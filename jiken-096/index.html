<script>
const D={"name": "096", "file": "096_編集用", "dur": 2163.31665625, "segs": [], "subs": [{"t": 0.0, "x": "1983年、昭和58年9月1日。"}, {"t": 3.65, "x": "この日の午前3時26分ごろ、\n北海道の稚内で、ある声が録音されていた。"}, {"t": 8.866666666666667, "x": "日本語ではない。"}, {"t": 10.05, "x": "なんの声？"}, {"t": 10.95, "x": "戦闘機の操縦士が話している声だ。"}, {"t": 13.383333333333333, "x": "後に防衛庁の局長が、国会でこう説明している。"}, {"t": 16.783333333333335, "x": "「発射した」「目標は撃墜された」「離脱する」。"}, {"t": 20.0, "x": "……撃墜。"}, {"t": 20.85, "x": "そのとき、その空にいたのは旅客機だった。"}, {"t": 23.616666666666667, "x": "ニューヨークを出て、ソウルへ\n向かっていた大韓航空の便だ。"}, {"t": 26.983333333333334, "x": "乗っていたのは269人。そのうち28人が日本人だった。"}, {"t": 31.45, "x": "269人って、全員なの？"}, {"t": 34.016666666666666, "x": "全員だ。"}, {"t": 34.8, "x": "飛行機は決められた道を大きく\n外れて、ソ連の領空に入っていた。"}, {"t": 38.9, "x": "そこを飛んでいた理由は、いまも分かっていない。"}, {"t": 41.61666666666667, "x": "いまもって、何年たってるの？"}, {"t": 43.68333333333333, "x": "43年だ。"}, {"t": 44.85, "x": "今回は、この大韓航空機撃墜事件を追っていく。"}, {"t": 48.166666666666664, "x": "撃った側の交信記録は、2週間も\nたたないうちに国連の場へ出された。"}, {"t": 52.5, "x": "出したのは日本とアメリカだ。"}, {"t": 54.15, "x": "録っていたのは日本だった。"}, {"t": 55.96666666666667, "x": "そして機体に積まれていた記録装置は、\n9年たってから返ってきた。"}, {"t": 60.166666666666664, "x": "ボイスレコーダーと、フライトレコーダーだ。"}, {"t": 62.5, "x": "それでも、外れた理由は決まらなかった。"}, {"t": 65.01666666666667, "x": "何が分かっていて、何が分かっていないのか。\nそこを一つずつ数えていく。"}, {"t": 70.08333333333333, "x": "始める前に、いくつか断っておく。"}, {"t": 72.46666666666667, "x": "一つ目。この回で話すことは、\nほとんどが日本の国会の記録だ。"}, {"t": 76.75, "x": "国立国会図書館の国会会議録検索システムで、\n誰でも読める。"}, {"t": 81.21666666666667, "x": "「大韓航空機」で891件、「大韓航空機撃墜」に\n絞っても155件の発言がある。"}, {"t": 87.85, "x": "そんなにあるの？"}, {"t": 89.0, "x": "ある。日本人が28人乗っていたから、\n日本の国会でも長く扱われた。"}, {"t": 93.88333333333334, "x": "二つ目。撃った側の操縦士の名前は出さない。"}, {"t": 96.85, "x": "公の記録で私が確かめられたのは\n「ソ連機パイロットの声」というところまでだ。"}, {"t": 101.96666666666667, "x": "三つ目。亡くなった方の名前も読み上げない。"}, {"t": 104.6, "x": "機長の名前も出さない。"}, {"t": 106.26666666666667, "x": "数だけにするのね。"}, {"t": 107.7, "x": "四つ目。落ちていく場面の描写はしない。"}, {"t": 110.26666666666667, "x": "遺品や遺体の状態も細かくは言わない。"}, {"t": 112.65, "x": "五つ目。「なぜ道を外れたのか」に、\n私は結論を出さない。"}, {"t": 116.66666666666667, "x": "説は二つある。最後にその二つを\n並べるが、どちらだとは言わない。"}, {"t": 120.8, "x": "国会でも、国際民間航空機関でも、\n決まっていないからだ。"}, {"t": 124.91666666666667, "x": "決まってないことを、決まったように\n話さない、ということね。"}, {"t": 128.45, "x": "六つ目。ソ連という国は1991年に無くなっている。"}, {"t": 132.45, "x": "これは1983年から1993年までの話で、\nいまの国やいまの人の話ではない。"}, {"t": 139.0, "x": "「撃墜」という強い言葉を、この回では何度も使う。"}, {"t": 142.36666666666667, "x": "衆議院と参議院の決議文、外務大臣の談話、"}, {"t": 145.55, "x": "政府の答弁が、全部この言葉を使っている。"}, {"t": 148.45, "x": "では、始めよう。"}, {"t": 150.3, "x": "まず、その飛行機が通るはずだった道の話だ。"}, {"t": 153.43333333333334, "x": "ニューヨークを出た便は、\nアラスカのアンカレジで燃料を入れる。"}, {"t": 156.68333333333334, "x": "そこからソウルへ向かう。"}, {"t": 157.95, "x": "北太平洋を斜めに横切る形だ。"}, {"t": 160.43333333333334, "x": "この区間に決められた航空路の一本が、\nロメオ20と呼ばれる道だった。"}, {"t": 164.88333333333333, "x": "ロメオ20。"}, {"t": 165.86666666666667, "x": "アルファベットのRだ。"}, {"t": 167.03333333333333, "x": "無線で読み違えないように、Rをロメオと言う。"}, {"t": 169.8, "x": "1983年9月19日、衆議院の予算委員会で、"}, {"t": 173.96666666666667, "x": "正木良明委員がこの名前を出している。"}, {"t": 176.41666666666666, "x": "「いわゆるロメオ20と言われるルート」\n「ここを日本航空も飛んでいる」。"}, {"t": 180.16666666666666, "x": "日本の飛行機も通ってたの？"}, {"t": 182.13333333333333, "x": "通っていた。だから国会でもすぐ問題になった。"}, {"t": 185.2, "x": "事件の翌月、1983年10月7日。"}, {"t": 188.83333333333334, "x": "参議院で三つの委員会が合同で会議を開いた。"}, {"t": 191.81666666666666, "x": "そこに4人の参考人が呼ばれている。"}, {"t": 194.08333333333334, "x": "慶應義塾大学の栗林忠男教授。国際法が専門だ。"}, {"t": 198.05, "x": "航空評論家の関川栄一郎参考人と、\n同じく航空評論家の青木日出雄参考人。"}, {"t": 203.51666666666668, "x": "そして日本航空でボーイング\n747の運航乗員部副部長をしていた巖祥夫参考人。"}, {"t": 209.33333333333334, "x": "現役のパイロットが呼ばれたの？"}, {"t": 211.36666666666667, "x": "実際にその道を飛んでいる人だ。"}, {"t": 213.53333333333333, "x": "青木参考人が、ロメオ20についてこう述べている。"}, {"t": 216.63333333333333, "x": "この航空路は、設定されてから\nまだ一年余りしかたっていない。"}, {"t": 220.46666666666667, "x": "ソ連の領土にとても近いので、\n特に緩衝地帯が設けてあった。"}, {"t": 224.43333333333334, "x": "航空路から50マイル、およそ80\nキロまでは、飛んでよいことになっていた。"}, {"t": 229.03333333333333, "x": "80キロずれても、まだ許される道だったの？"}, {"t": 232.08333333333334, "x": "そうだ。そして青木参考人はこう付け加えている。"}, {"t": 235.18333333333334, "x": "この道は、国際民間航空機関で\nソ連の同意を得て開かれたものだ、と。"}, {"t": 239.85, "x": "それまでロメオ20を飛んでいた航空機が\n要撃を受けたことは、一度もなかった。"}, {"t": 245.06666666666666, "x": "ではその日、飛行機は決められた\n線からどれくらい外れたのか。"}, {"t": 248.78333333333333, "x": "同じ日の会議で、関川栄一郎参考人がこう言っている。"}, {"t": 252.41666666666666, "x": "「今回の大韓航空の事件のように、500\nキロも本来のコースから外れてしまう」。"}, {"t": 257.4, "x": "500キロ。"}, {"t": 258.35, "x": "緩衝地帯が80キロの道で、500キロだ。"}, {"t": 261.43333333333334, "x": "関川参考人は、それを「常識では\n考えられないような問題」と言っている。"}, {"t": 266.26666666666665, "x": "この数字は、政府が\n確定させたものではない。参考人の発言だ。"}, {"t": 270.71666666666664, "x": "それだけ外れたら、途中で気づかないものなの？"}, {"t": 273.7, "x": "普通は気づく。というより、\n気づくための仕組みが何重にもある。"}, {"t": 277.4166666666667, "x": "関川参考人は、航空路を共産圏から遠ざけては\nどうかという案にも、こう答えている。"}, {"t": 282.78333333333336, "x": "500キロも外れるなら、少し離しても意味がない。"}, {"t": 285.96666666666664, "x": "もう一つ、関川参考人が挙げた例がある。"}, {"t": 288.85, "x": "1978年4月20日の、ムルマンスク事件だ。"}, {"t": 292.8666666666667, "x": "それも旅客機なの？"}, {"t": 294.3, "x": "旅客機だ。パリを出て、スコットランド、\nグリーンランド、カナダ北部を通る。"}, {"t": 298.8666666666667, "x": "そしてアンカレジへ行くはずの便だった。"}, {"t": 301.1166666666667, "x": "それが、逆に東へ飛んだ。"}, {"t": 303.15, "x": "……逆。"}, {"t": 303.8, "x": "逆だ。そしてムルマンスクから\nソ連の領土に入り、発砲を受けている。"}, {"t": 308.03333333333336, "x": "関川参考人は、この2件が\n同じ航空会社で続いたことを、"}, {"t": 312.01666666666665, "x": "偶然とは思えないと述べている。"}, {"t": 313.9, "x": "会社の人事管理、特に乗員の管理に\n欠陥があったのではないか、と。"}, {"t": 318.23333333333335, "x": "これは参考人の見方であって、\n確かめられた原因ではない。"}, {"t": 322.48333333333335, "x": "巖祥夫参考人。日本航空のボーイング\n747の運航乗員部副部長だ。"}, {"t": 327.73333333333335, "x": "総飛行時間は1万3622時間。"}, {"t": 330.78333333333336, "x": "アンカレジと成田の間は、月に1回か2回飛んでいた。"}, {"t": 334.3666666666667, "x": "まさにその路線の人ね。"}, {"t": 336.15, "x": "巖参考人は、位置を確かめる方法を三つ挙げている。"}, {"t": 339.56666666666666, "x": "一つ目が慣性航法装置。"}, {"t": 341.3333333333333, "x": "英語の頭文字でINSと呼ばれる。"}, {"t": 343.71666666666664, "x": "出発する空港の、駐機している\n位置の緯度と経度を先に入れる。"}, {"t": 347.5833333333333, "x": "あとは機体の動きを感じ取って、いま\nどこにいるかを計算して出し続ける。"}, {"t": 352.05, "x": "最初に場所を教えたら、あとは自分で数えてくれるの？"}, {"t": 355.3666666666667, "x": "そういう装置だ。日本航空のボーイング\n747は、これを3台積んでいた。"}, {"t": 360.3333333333333, "x": "二つ目が、地上から出ている\n電波を受けて位置を測る方法だ。"}, {"t": 364.03333333333336, "x": "三つ目が、気象レーダーだ。"}, {"t": 365.6666666666667, "x": "本来は進む先の雲を見るためのものだ。"}, {"t": 368.3666666666667, "x": "島や海岸線の形が出るので、\nそれとの位置関係で自分の場所が分かる。"}, {"t": 373.03333333333336, "x": "三つあれば、どれかがおかしければ分かるわね。"}, {"t": 375.8, "x": "巖参考人は、その三つを互いに\n突き合わせながら飛ぶ、と言っている。"}, {"t": 380.06666666666666, "x": "そして、外れる原因として\n考えられるものを三つ挙げている。"}, {"t": 383.73333333333335, "x": "一つ目、慣性航法装置の故障。"}, {"t": 386.1666666666667, "x": "3台が同時に壊れる確率は\n「まさに天文学的数字」だと言っている。"}, {"t": 390.8333333333333, "x": "二つ目、準備が終わる前に機体を動かすこと。"}, {"t": 393.8666666666667, "x": "出発地の緯度と経度を入れ間違えること。"}, {"t": 396.4166666666667, "x": "三つ目が、通過する地点の座標を\n入れ間違えて、その後の確認でも見逃すことだ。"}, {"t": 401.6666666666667, "x": "それは警告灯が点かないの？"}, {"t": 403.6166666666667, "x": "点かない。入れた数字が正しいか\nどうかまでは、機械には分からないからだ。"}, {"t": 407.8333333333333, "x": "ただし巖参考人は、その場合でも\n早く見つかるはずだと述べている。"}, {"t": 411.93333333333334, "x": "飛行のデータ、地上の施設のデータ、気象レーダー。"}, {"t": 415.0833333333333, "x": "見比べれば異常はすぐ出る、と。"}, {"t": 417.0, "x": "確かめる場所も決まっていた。"}, {"t": 418.8333333333333, "x": "アンカレジを出たあとは、\n地上の施設で数字を突き合わせる。"}, {"t": 422.18333333333334, "x": "ほぼ中間のシェミア島を過ぎると電波は\n使えず、あとは気象レーダーで島影を見る。"}, {"t": 426.9, "x": "巖参考人は質疑でこう聞かれている。"}, {"t": 429.15, "x": "日本航空で、これほど外れた例はあるか。"}, {"t": 431.8, "x": "答えは「ございません」。"}, {"t": 433.1166666666667, "x": "ロメオ20で不安を感じたことはあるか。"}, {"t": 435.53333333333336, "x": "これも「ございません」。"}, {"t": 437.03333333333336, "x": "……じゃあ、なんで。"}, {"t": 438.15, "x": "巖参考人は最後にこう述べている。"}, {"t": 440.3666666666667, "x": "今回の事件は「きわめて不可解」としか\n言いようがない。"}, {"t": 443.7, "x": "「原因については想像もできません」。"}, {"t": 446.4166666666667, "x": "この人は当日の飛行計画と\n交信の記録を見て、こう述べている。"}, {"t": 450.56666666666666, "x": "交信で分かるかぎり、機長は正確にロメオ\n20を飛んでいるつもりだっただろう、と。"}, {"t": 455.4166666666667, "x": "外れていると思っていなかった、ということ？"}, {"t": 458.1333333333333, "x": "そう読める、という話だ。理由がある。"}, {"t": 460.56666666666666, "x": "この区間には、義務位置通報点という\n地点がいくつも決まっている。"}, {"t": 464.46666666666664, "x": "そこを通るたびに、通過した時刻と\n高度を報告しなければならない。"}, {"t": 468.46666666666664, "x": "機長は、それを毎回やっていた。"}, {"t": 470.56666666666666, "x": "そのうえで、決められていないことまで報告している。"}, {"t": 473.68333333333334, "x": "なにを？"}, {"t": 474.3666666666667, "x": "風の向きと、風の速さ。"}, {"t": 476.1, "x": "外の気温。残っている燃料。"}, {"t": 478.18333333333334, "x": "これを、いくつもの地点で報告している。"}, {"t": 480.68333333333334, "x": "必ずやっていた、と青木参考人は言っている。"}, {"t": 483.55, "x": "この記録だけを見るかぎり、眠っていたわけでも、\n手を抜いていたわけでもない。"}, {"t": 487.8833333333333, "x": "当時の慣性航法装置は、つまみの位置を\n切り替えると出るものが変わる。"}, {"t": 492.03333333333336, "x": "一番目の位置にすると、いまいる\n場所の緯度と経度が出る。"}, {"t": 495.31666666666666, "x": "二番目にすると、次に通る\n地点までの距離と、かかる時間が出る。"}, {"t": 499.3666666666667, "x": "そして三番目にして、初めて風の向きと速さが出る。"}, {"t": 502.96666666666664, "x": "……風を報告してるってことは？"}, {"t": 504.93333333333334, "x": "三番目まで回している、ということだ。"}, {"t": 507.3, "x": "つまり機長は、その装置を見ていた。"}, {"t": 509.6166666666667, "x": "しかも、報告された風は、アンカレジを\n出る前に持っていた予報とは違っていた。"}, {"t": 514.3833333333333, "x": "青木参考人は、だから慣性航法装置を\n確かめていたことは確かだ、と言い切っている。"}, {"t": 519.7666666666667, "x": "飛行計画では、サハリンまでの間に\n2回、高度を変えることになっていた。"}, {"t": 524.2166666666667, "x": "機長は、その2回とも変えている。"}, {"t": 526.3833333333333, "x": "3万1000フィートから3万3000フィート。"}, {"t": 529.05, "x": "そこから3万5000フィートへ。"}, {"t": 530.9666666666667, "x": "計画どおりに上げてるのね。"}, {"t": 532.7666666666667, "x": "高度で計画に従っているなら、"}, {"t": 534.85, "x": "経路についても計画どおりに\n入れていた可能性が高い。"}, {"t": 538.0333333333333, "x": "そうすると、意図的にスパイ飛行をしたという\n形跡は見当たらない、と。"}, {"t": 542.1666666666666, "x": "「しからばなぜこのような航路からの逸脱が\n起きたのかということが疑問になります」。"}, {"t": 546.8166666666667, "x": "43年たっても、この一文がそのまま残っている。"}, {"t": 550.8833333333333, "x": "1983年10月6日、衆議院の内閣委員会。"}, {"t": 554.8833333333333, "x": "防衛庁の防衛局長だった矢崎新二政府委員が、\n時刻を並べて説明している。"}, {"t": 559.9, "x": "9月1日の午前3時12分。"}, {"t": 562.1166666666667, "x": "稚内にある航空自衛隊のレーダーに、ある航跡が\n映り始めた。"}, {"t": 566.2666666666667, "x": "航跡って、飛んだあとの線ね。"}, {"t": 568.4166666666666, "x": "画面に残る点の並びだ。その航跡は、\nサハリンを南西に横切る形で動いていた。"}, {"t": 573.7833333333333, "x": "矢崎政府委員の言葉では「\n同機のものではないかと思われる航跡」だ。"}, {"t": 578.1666666666666, "x": "そのとき、それが大韓航空の便だとは\n誰も分かっていなかった。"}, {"t": 582.0833333333334, "x": "同じ日の決算委員会で、防衛庁の江間清二課長が\nもっとはっきり言っている。"}, {"t": 586.6333333333333, "x": "稚内のレーダーが捉えた、\nその飛行機のものと思われる航跡は、"}, {"t": 590.6666666666666, "x": "3時12分から3時29分まで。"}, {"t": 593.1666666666666, "x": "「それのみでございます」。"}, {"t": 594.65, "x": "17分間だけ？"}, {"t": 596.1333333333333, "x": "17分だけだ。"}, {"t": 598.0333333333333, "x": "3時12分から映っていたその航跡に、\n同じころ、別の航跡が現れている。"}, {"t": 603.1, "x": "矢崎政府委員は「その航跡に\n寄り添うような三つの航跡」と言っている。"}, {"t": 607.7, "x": "寄り添う。"}, {"t": 608.5166666666667, "x": "そして、これはソ連機による\n緊急発進ではないかと考えられた、と続けた。"}, {"t": 613.3, "x": "そして3時29分。最初の航跡が、レーダーから消えた。"}, {"t": 617.2166666666667, "x": "もう一つ、別の記録がある。"}, {"t": 619.0333333333333, "x": "自衛隊の部隊がたまたま受信していた交信の記録だ。"}, {"t": 622.4666666666667, "x": "レーダーの記録を調べたあとで、\nその交信の記録も調べ直した。"}, {"t": 626.4333333333333, "x": "すると、3時26分前後のところに声が残っていた。"}, {"t": 630.1666666666666, "x": "それが、さっきの？"}, {"t": 631.6166666666667, "x": "冒頭で言ったものだ。"}, {"t": 632.9666666666667, "x": "「発射した」。\n「目標は撃墜された」。「離脱する」。"}, {"t": 636.0833333333334, "x": "矢崎政府委員は、\nソ連機のパイロットの声だと説明している。"}, {"t": 639.9, "x": "レーダーから消えたのが3時29分。"}, {"t": 642.05, "x": "声が残っていたのは、その3分前だ。"}, {"t": 644.6666666666666, "x": "この二つを合わせて、防衛庁はこう判断した。"}, {"t": 647.45, "x": "撃墜された公算が大きい。"}, {"t": 649.4333333333333, "x": "公算が大きい、という言い方なのね。"}, {"t": 651.7666666666667, "x": "現場を見た人はいない。"}, {"t": 653.1, "x": "夜明け前の海の上だ。"}, {"t": 654.6166666666667, "x": "残っているのは、消えた点と、3分前の声だけだった。"}, {"t": 658.85, "x": "1983年9月20日、衆議院の予算委員会。"}, {"t": 662.75, "x": "谷川和穗防衛庁長官が答えている。"}, {"t": 665.2666666666667, "x": "所沢にある東京航空交通管制部から、\n防衛庁へ照会が入った。"}, {"t": 669.7833333333333, "x": "その時刻が、9月1日の午前4時56分。"}, {"t": 673.0666666666667, "x": "撃墜の1時間半あと？"}, {"t": 674.95, "x": "そうなる。谷川長官は、照会の直後から\n各種の記録を調べた、と続けている。"}, {"t": 680.3, "x": "そして稚内のレーダーサイトが、それらしき\n航跡を捉えていたことが分かった。"}, {"t": 684.9, "x": "「このときにはすでに航空機そのものは\n撃墜をされておった」。"}, {"t": 688.35, "x": "江間課長は、もう少し細かく説明している。"}, {"t": 691.2333333333333, "x": "連絡が入ったのは、1日の午前5時少し前。"}, {"t": 694.4333333333333, "x": "それを受けて、三沢にある\n防空管制指令所の記録を調べた。"}, {"t": 698.2, "x": "その結果、根室の沖ではなく、"}, {"t": 700.35, "x": "稚内のレーダーが捉えていた\n航跡が該当すると分かった。"}, {"t": 704.0166666666667, "x": "先に連絡が来て、それから探したのね。"}, {"t": 706.9166666666666, "x": "順番はそうだ。そして江間課長は、こう言っている。"}, {"t": 709.9333333333333, "x": "航跡が現れた時点で、それが\n大韓航空の便だと知るすべは何もなかった。"}, {"t": 714.7, "x": "だから警告を出すことは不可能だった、と。"}, {"t": 717.4, "x": "同じ日、中曽根康弘内閣総理大臣も\n同じことを別の言い方で述べている。"}, {"t": 722.2833333333333, "x": "領空に入り込んでいたとき、日本側は\n国籍不明の機体として捉えてはいただろう。"}, {"t": 727.2833333333333, "x": "だが、大韓航空の便だとは知らなかったと思う、と。"}, {"t": 730.65, "x": "運輸省から5時に連絡があって、それから\n交信の記録を調べ、翻訳をした。"}, {"t": 735.6166666666667, "x": "日本語じゃない声を、まず訳さないといけないのよね。"}, {"t": 738.75, "x": "この点については、後から\n国会で厳しい問いが出ている。"}, {"t": 742.15, "x": "1983年10月6日、衆議院の決算委員会。"}, {"t": 746.0, "x": "楢崎弥之助委員だ。"}, {"t": 747.6, "x": "楢崎委員は、レーダーの能力から考えて、"}, {"t": 750.4, "x": "本当に3時過ぎからしか\n捉えられなかったのかと問うた。"}, {"t": 753.7333333333333, "x": "日米は分かっていながら\n見殺しにしたのではないか、という声が一部にある。"}, {"t": 758.0, "x": "そういうものに対しては、納得のいく\n説明をする必要があるから聞いている、と。"}, {"t": 762.7666666666667, "x": "楢崎委員自身が、誤解や\n間違いであれば整理する必要がある、"}, {"t": 766.6333333333333, "x": "という立場で聞いていた。"}, {"t": 768.1333333333333, "x": "私もその線を越えない。そういう問いが\n国会で出た、というところまでだ。"}, {"t": 773.0666666666667, "x": "同じ日の衆議院決算委員会で、\n楢崎弥之助委員が中身に触れている。"}, {"t": 777.5833333333334, "x": "陸上自衛隊に、電波を受けて記録する部隊がある。"}, {"t": 780.7666666666667, "x": "当時は略して調別と呼ばれていた。"}, {"t": 783.0166666666667, "x": "楢崎委員が名前を出したのは、\n稚内の東千歳通信所分遣隊だ。"}, {"t": 787.8333333333334, "x": "ずっとそこで聞いてたの？"}, {"t": 789.45, "x": "そういう部隊だ。楢崎委員は\n「覆面部隊であったわけですが」と言っている。"}, {"t": 794.0666666666667, "x": "ただ、楢崎委員が本当に\n問題にしたかったのは、別のことだった。"}, {"t": 798.4166666666666, "x": "電波法の第59条だ。条文はこうだ。"}, {"t": 801.2333333333333, "x": "何人も、法律に別段の定めがある場合を除くほか、"}, {"t": 804.7333333333333, "x": "特定の相手方に対して行われる無線通信を傍受して、"}, {"t": 808.4, "x": "その存在や内容を漏らし、または\nこれを窃用してはならない。"}, {"t": 812.1666666666666, "x": "……漏らしてはならない。"}, {"t": 813.45, "x": "この条文の例外に、自衛隊は入っていない。"}, {"t": 816.2333333333333, "x": "政府の中だけで行うなら第59条には触れない。"}, {"t": 819.45, "x": "だが第三者に漏らしてはならない。"}, {"t": 821.4666666666667, "x": "ところが今回は、傍受した内容をアメリカに知らせた。"}, {"t": 824.8, "x": "さらに、後藤田官房長官が\n記者会見でその内容を発表した。"}, {"t": 829.0333333333333, "x": "……表に出したのね。"}, {"t": 830.4333333333333, "x": "出した。ただし、誤解のないように言っておく。"}, {"t": 833.1666666666666, "x": "楢崎委員はこう言っている。"}, {"t": 834.6333333333333, "x": "今度の場合は緊急事態だからやむを得なかった、と。"}, {"t": 837.85, "x": "そのうえで、法律の整理はしておくべきだ、という\n立場だった。"}, {"t": 841.5833333333334, "x": "そしてこの記録は、国際的な場で使われることになる。"}, {"t": 845.7333333333333, "x": "乗っていたのは、乗客と乗員を合わせて269人。"}, {"t": 849.35, "x": "そのうち28人が日本人だった。"}, {"t": 851.7, "x": "この数字は、外交青書の資料編に載っている。"}, {"t": 854.6833333333333, "x": "1983年9月13日の、安倍晋太郎外務大臣の談話だ。"}, {"t": 859.5333333333333, "x": "「28名の日本人を含む269名の尊い人命が\n失なわれたという重大かつ衝撃的な国際事件」。"}, {"t": 866.5833333333334, "x": "……269人。"}, {"t": 868.05, "x": "初村滝一郎委員は、日本人28名を含む\n269名の方々に深い哀悼の意を表している。"}, {"t": 874.7666666666667, "x": "名前は読み上げない。年齢も言わない。"}, {"t": 876.95, "x": "どういう人が乗っていたかも話さない。"}, {"t": 879.2833333333333, "x": "ご遺族が、いまも。"}, {"t": 880.7666666666667, "x": "いる。43年前だが、遠い昔の話ではない。"}, {"t": 884.1833333333333, "x": "この事件で、ご遺族が裁判に\n使える資料は、ほとんど無かった。"}, {"t": 888.2, "x": "1993年3月25日、衆議院内閣委員会で、\n大出俊委員がこう言っている。"}, {"t": 894.2, "x": "遺族の皆さんが裁判をやる資料というのは\n「三つ、四つしかない」。"}, {"t": 898.4166666666666, "x": "三つか四つ？"}, {"t": 899.5666666666667, "x": "機体は海の底で、ソ連は資料を出さなかった。"}, {"t": 902.5166666666667, "x": "残っていたのは、日本が録っていた\n交信の記録と、アメリカが出した航跡図。"}, {"t": 907.3666666666667, "x": "そして防衛庁が出した、高度のデータだった。"}, {"t": 910.15, "x": "大出委員は、その三つを\n国会で出させて、ご遺族に渡している。"}, {"t": 914.8166666666667, "x": "ソ連側は、何と言っていたのか。"}, {"t": 916.9333333333333, "x": "青木日出雄参考人が、その中身を整理している。"}, {"t": 920.0166666666667, "x": "ソ連は、大韓航空の便が\nスパイ行為をしたと発表していた。"}, {"t": 923.8666666666667, "x": "9月6日のソ連政府の公式声明と、\n9月9日の参謀総長の記者会見だ。"}, {"t": 929.3166666666667, "x": "領空に入ったことは認めてるの？"}, {"t": 931.5666666666667, "x": "入ったことも、撃ったことも、最後には認めている。"}, {"t": 934.7833333333333, "x": "認めなかったのは責任のほうだ。"}, {"t": 936.8833333333333, "x": "青木参考人によれば、\nソ連側が出した航跡から見ると、"}, {"t": 940.5666666666667, "x": "領空に入ったのは三回になる。"}, {"t": 942.5833333333334, "x": "コマンドルスキー島。"}, {"t": 943.6833333333333, "x": "カムチャツカ半島のペトロパブロフスクの上空。"}, {"t": 946.55, "x": "そしてサハリンのユジノサハリンスクの付近。"}, {"t": 949.0833333333334, "x": "青木参考人はこうも指摘している。"}, {"t": 951.1666666666666, "x": "今回の戦闘機が上がった基地は、"}, {"t": 953.3333333333334, "x": "サハリン中部のドリンスクソコール基地であろうと\n思う、と。"}, {"t": 956.5333333333333, "x": "「であろうと思う」という言い方だ。"}, {"t": 958.4333333333333, "x": "断定していない。私もそこは動かさない。"}, {"t": 961.1666666666666, "x": "もう一つ、青木参考人が触れた話がある。"}, {"t": 964.05, "x": "ただし、本人が「確認をされないのでありますが」と\n前置きしている話だ。"}, {"t": 968.7833333333333, "x": "アメリカのワシントン・\nポストの報道として、こう述べている。"}, {"t": 972.1833333333333, "x": "9月1日に、ソ連が新しい\nミサイルの発射実験をする予定だったという。"}, {"t": 976.7666666666667, "x": "実際には、この事件が起きたため\n当日の実験は行われなかった。"}, {"t": 981.0166666666667, "x": "そして3日後に、ソ連は発射実験を行っている。"}, {"t": 984.3333333333334, "x": "……たまたま、その日だったの？"}, {"t": 986.25, "x": "青木参考人は「きわめて不幸な\n条件の一致があったのではないか」と言っている。"}, {"t": 990.9666666666667, "x": "これも報道であって、確かめられた事実ではない。"}, {"t": 993.95, "x": "もう一つ、青木参考人はこう述べている。"}, {"t": 996.5833333333334, "x": "パイロットが日常使う航空図には、"}, {"t": 998.8166666666667, "x": "この地域では無警告で射撃をされる、という\n注意書きが随所にある。"}, {"t": 1002.8, "x": "ソ連、中国、朝鮮半島の38度線、\n当時のイランとイラク。"}, {"t": 1007.0833333333334, "x": "別に共産圏に限った話ではない、と。"}, {"t": 1009.8666666666667, "x": "そしてソ連は、5年前のムルマンスクの一件のあと、"}, {"t": 1013.1166666666667, "x": "前の年に国境法を成立させている。"}, {"t": 1015.55, "x": "国境を侵すものについて、武器を\n使用することがあると法律で決めた。"}, {"t": 1020.3166666666667, "x": "では、国際法ではどうなっていたのか。"}, {"t": 1022.6833333333333, "x": "ここは栗林忠男参考人の話だ。"}, {"t": 1025.2333333333333, "x": "慶應義塾大学で国際法を専門にしていた教授だ。"}, {"t": 1028.6666666666667, "x": "出発点は、1944年にシカゴで\n結ばれた国際民間航空条約だ。"}, {"t": 1033.9666666666667, "x": "その第1条にこうある。"}, {"t": 1035.4666666666667, "x": "各国が、その領域の上の空間において、\n完全かつ排他的な主権を有すること。"}, {"t": 1040.9, "x": "上の空も、その国のものということね。"}, {"t": 1043.5666666666666, "x": "栗林参考人はこう言っている。"}, {"t": 1045.4833333333333, "x": "領空に入った機体をどう扱うかについて、"}, {"t": 1048.1666666666667, "x": "国際法の規則は必ずしも定まっていない部分がある。"}, {"t": 1051.5833333333333, "x": "東西の対立の中で\n数多くの領空侵犯が起きているのに、"}, {"t": 1055.25, "x": "関係国が抗議を繰り返すばかりで、"}, {"t": 1057.5333333333333, "x": "一度として権威ある国際的な\n司法判断が下されていないことだ、と。"}, {"t": 1062.0333333333333, "x": "裁判で決着したことが、一度も無いの？"}, {"t": 1064.9166666666667, "x": "それでも、これまでの各国のやり方と\n学説からは、大まかな線は引ける。"}, {"t": 1069.5333333333333, "x": "民間の航空機が領空に入ったときは、まず警告。"}, {"t": 1072.8833333333334, "x": "次に進路の変更。そして強制着陸。"}, {"t": 1075.6833333333334, "x": "この命令が先に来るべきだ、というのが\n栗林参考人の説明だ。"}, {"t": 1079.9166666666667, "x": "この条約には附属書がある。"}, {"t": 1081.7, "x": "第二附属書が「航空規則」で、\nその第三章に要撃の規定がある。"}, {"t": 1086.3, "x": "その中の添付Aに、民間の航空機を\n要撃する場合の規定がある。"}, {"t": 1090.4833333333333, "x": "その七番目が「武器の使用」だ。"}, {"t": 1092.9333333333334, "x": "なんて書いてあるの？"}, {"t": 1094.2333333333333, "x": "「要撃機は、民間航空機を要撃するいかなる場合に\nおいても武器を使用しないものとする」。"}, {"t": 1099.4833333333333, "x": "文だけを見れば、これ以上はっきりした書き方はない。"}, {"t": 1103.2166666666667, "x": "ところが、栗林参考人の話には続きがある。"}, {"t": 1106.4833333333333, "x": "その一文がどこに置かれているか、という話だ。"}, {"t": 1109.4666666666667, "x": "条約の本文ではない。"}, {"t": 1110.8333333333333, "x": "附属書の本文でもない。"}, {"t": 1112.5, "x": "「添付」と呼ばれる部分に置かれている。"}, {"t": 1114.8333333333333, "x": "添付。"}, {"t": 1115.5333333333333, "x": "付け足し、という意味の置き場所だ。"}, {"t": 1117.6, "x": "付録と呼ばれる部分は、基準や\n勧告の一部を構成するものとされている。"}, {"t": 1121.9666666666667, "x": "一方、添付と呼ばれる部分は、補足の資料か、\n適用のための手引きにすぎない。"}, {"t": 1126.9, "x": "だから、要撃機は武器を\n使用してはならないという要請は、"}, {"t": 1130.3666666666666, "x": "附属書の本文と同じ効力を持つとは\n言いがたい側面がある、と。"}, {"t": 1134.45, "x": "……守らなくてもいい、ということ？"}, {"t": 1136.4333333333334, "x": "そこまでは言っていない。"}, {"t": 1137.6333333333334, "x": "効力の強さの話をしている。"}, {"t": 1139.7, "x": "ただ、栗林参考人はもう一歩踏み込んでいる。"}, {"t": 1142.7, "x": "なぜ、その規定がわざわざ\n添付という形で置かれたのか。"}, {"t": 1146.1666666666667, "x": "その背景には、附属書の本文と同じ強さで\n認めたくなかったという声が反映したためだ、と。"}, {"t": 1152.1833333333334, "x": "……わざと、弱い場所に置いたの？"}, {"t": 1154.1833333333334, "x": "そう述べている。"}, {"t": 1155.1666666666667, "x": "269人が乗った機体に武器を\n使ってはいけないという一文は、"}, {"t": 1159.3666666666666, "x": "1983年の時点で、いちばん弱い置き場所にあった。"}, {"t": 1163.3, "x": "栗林参考人は、過去の例も挙げている。"}, {"t": 1166.0166666666667, "x": "1952年、スウェーデンの軍用機が\nバルト海の上空でソ連機に撃墜された。"}, {"t": 1171.1666666666667, "x": "スウェーデン側は、進路を変えて領空の外へ\n立ち去るなら撃ってはならない、と考えていた。"}, {"t": 1176.3666666666666, "x": "ソ連側は、着陸しないで立ち去るのであれば\n発砲の対象になる、と考えていた。"}, {"t": 1181.4833333333333, "x": "同じ場面で、真逆なのね。"}, {"t": 1183.4666666666667, "x": "だから慣習法が育たなかった、というのが\n栗林参考人の説明だ。"}, {"t": 1188.0, "x": "そして栗林参考人は、質疑でこう言い切った。"}, {"t": 1191.1333333333334, "x": "警告、進路変更、強制着陸という\n一連の事前の措置がとられない限り、"}, {"t": 1196.0166666666667, "x": "いきなり撃墜する行為は国際法上違反である、\n違法であると自分は判断する、と。"}, {"t": 1201.7333333333333, "x": "安倍晋太郎外務大臣の談話に、順番が書いてある。"}, {"t": 1205.0, "x": "日本は直ちに国連の安全保障理事会に提訴した。"}, {"t": 1208.35, "x": "そして、緊急に招集された\n安全保障理事会で、ある物を出した。"}, {"t": 1212.7166666666667, "x": "稚内で録っていたもの？"}, {"t": 1214.55, "x": "それだ。談話の言葉ではこうなっている。"}, {"t": 1216.95, "x": "我が国が保有する、ソ連機が\n地上と交した交信記録を、"}, {"t": 1220.6666666666667, "x": "アメリカと共同して提出した。"}, {"t": 1222.7166666666667, "x": "ソ連軍用機のミサイルによる\n攻撃を受けて撃墜された事実を、"}, {"t": 1226.5333333333333, "x": "世界に明らかにするためだ、と。"}, {"t": 1228.6666666666667, "x": "安全保障理事会は、世界が見ている\n中で6回の会合を重ねた。"}, {"t": 1232.8166666666666, "x": "40カ国以上が討議に参加した。"}, {"t": 1235.15, "x": "談話によれば、圧倒的多数で\nこういう国際世論がまとまった。"}, {"t": 1239.0333333333333, "x": "非武装、無抵抗の民間機の撃墜は、\n絶対に許されるべき行為ではない。"}, {"t": 1243.8, "x": "それでソ連は？"}, {"t": 1244.95, "x": "ソ連は、ミサイルによる撃墜という\n事実そのものは認めざるを得なかった。"}, {"t": 1249.2833333333333, "x": "そのうえで日本は、14カ国の友好国と\n共同で決議案を出した。"}, {"t": 1253.55, "x": "国際民間航空の安全を確保するため、\n国際民間航空機関に協力すべきこと。"}, {"t": 1259.1, "x": "安全保障理事会の討議では、圧倒的多数が\nこの決議案の内容に賛成を表明した。"}, {"t": 1264.65, "x": "それなら通ったんじゃないの？"}, {"t": 1266.3333333333333, "x": "通らなかった。"}, {"t": 1267.3666666666666, "x": "ソ連は責任を認めず、第三国に\n転嫁しようとする態度に終始した。"}, {"t": 1271.8166666666666, "x": "そして、決議案の表決で拒否権を行使した。"}, {"t": 1274.8833333333334, "x": "これが1983年9月12日のことだ。"}, {"t": 1278.2666666666667, "x": "安倍外務大臣は、その翌日に出した\n談話でこう書いている。"}, {"t": 1281.8333333333333, "x": "かかるソ連の厚顔無恥の態度は、\n何人も許さないであろう。"}, {"t": 1285.5666666666666, "x": "……外務大臣が、そこまで書くのね。"}, {"t": 1288.45, "x": "1983年9月12日、衆議院の本会議で\n決議が採択されている。"}, {"t": 1293.7333333333333, "x": "提案の趣旨を説明したのは、山村新治郎議員だ。"}, {"t": 1297.1, "x": "6つの会派の共同提案だった。"}, {"t": 1299.35, "x": "全部の会派が一緒に？"}, {"t": 1300.9666666666667, "x": "この件では割れていない。"}, {"t": 1302.2333333333333, "x": "決議の本文を、途中まで読む。"}, {"t": 1304.4, "x": "9月1日未明、邦人28名を含む\n269名の乗客と乗員を乗せた大韓航空機が、"}, {"t": 1310.85, "x": "ソ連軍用機のミサイルにより撃墜されたことは、\nいかなる理由があったにもせよ、"}, {"t": 1315.45, "x": "国際航空慣行と国際法を\n無視した非人道的行為であり、"}, {"t": 1319.2666666666667, "x": "国際民間航空の安全確保からも\n断じて許し得ざる蛮行である。"}, {"t": 1323.4333333333334, "x": "そして政府に六つの事項を求めている。"}, {"t": 1325.8666666666666, "x": "一つ目が、この回でいちばん大事なところだ。"}, {"t": 1328.7, "x": "国際機関などによる事故調査団の派遣など、\nあらゆる方途により、"}, {"t": 1332.7833333333333, "x": "大韓航空機が領空侵犯をするに至った\n原因を含め、事件の真相究明に努めること。"}, {"t": 1338.6666666666667, "x": "……なぜ外れたのかを、明らかにすること。"}, {"t": 1341.2166666666667, "x": "残りの五つは、ソ連政府の公式の謝罪と\n再発防止の保障、"}, {"t": 1345.3333333333333, "x": "ソ連の領海での捜索の許可、犠牲者の補償、\n国際機関での再発防止、緊張の緩和だ。"}, {"t": 1351.3833333333334, "x": "翌日の9月13日、参議院でも\nほぼ同じ決議が採択された。"}, {"t": 1355.7833333333333, "x": "提案の趣旨を説明したのは、遠藤要議員だ。"}, {"t": 1358.9333333333334, "x": "参議院の決議文には、こういう一文が入っている。"}, {"t": 1362.0833333333333, "x": "もしこの事件の全貌が十分に解明されず、"}, {"t": 1364.8333333333333, "x": "責任が明確にされないまま\n葬り去られるようなことがあったなら、"}, {"t": 1368.6333333333334, "x": "国際民間航空を利用する人々の不安は去らず、"}, {"t": 1371.8333333333333, "x": "その安全は著しく損なわれるであろう。"}, {"t": 1374.4833333333333, "x": "……葬り去られるような。"}, {"t": 1375.95, "x": "安倍外務大臣は、決議のあとに壇上でこう述べている。"}, {"t": 1379.2166666666667, "x": "ソ連側は撃墜の事実は認めたものの、\n自分の責任を認めようとしない。"}, {"t": 1383.95, "x": "そこで日本は、9月9日に一連の対ソ措置を\n発表した。それでも変化が無かった。"}, {"t": 1389.4166666666667, "x": "日本とソ連の間の航空機の運航を、\n9月15日から28日まで停止する。"}, {"t": 1394.6666666666667, "x": "2週間、飛行機を止めたの？"}, {"t": 1396.7, "x": "止めた。多くの西側の国が同じ期間の停止を\n決めていたことも踏まえた措置だ。"}, {"t": 1402.1666666666667, "x": "この事件は、防げたのか。"}, {"t": 1404.05, "x": "1983年10月7日の会議で、\n関川栄一郎参考人がその問いに答えている。"}, {"t": 1409.9666666666667, "x": "一つ目。民間機に武力を行使しないという、\n拘束力のある国際的な取り決めを結ぶ。"}, {"t": 1415.5333333333333, "x": "関川参考人の答えは、ソ連が合意するとは\nいまの情勢では考えられない、だった。"}, {"t": 1420.8666666666666, "x": "撃ったあとで、民間機だと\n分からなかったと言われたら？"}, {"t": 1424.1166666666666, "x": "関川参考人も、まさにそれを言っている。"}, {"t": 1426.85, "x": "それで問題は終わってしまう、と。"}, {"t": 1428.85, "x": "二つ目。航空路そのものを\n引き直す。これは前の章で話した。"}, {"t": 1432.9, "x": "燃料が増えるし、500キロ外れるなら効果がない。"}, {"t": 1436.1, "x": "全部、どこかで詰まるのね。"}, {"t": 1438.0333333333333, "x": "六つ目が、関川参考人が「一番手っ取り\n早く、かなり効果がある」と言ったものだ。"}, {"t": 1443.5666666666666, "x": "飛行機の運航の情報を、国と国の間で\nもっと細かく、もっと早く流す。"}, {"t": 1448.4, "x": "当時、北太平洋の航空路の情報が\n流れていたのは、日本とアメリカの間だけだった。"}, {"t": 1453.8333333333333, "x": "ソ連の側には流れていなかった。"}, {"t": 1456.0166666666667, "x": "……あの飛行機がどこを飛ぶ\n予定か、ソ連は知らなかったの？"}, {"t": 1459.4333333333334, "x": "関川参考人の説明では、そうなる。"}, {"t": 1462.1, "x": "七つ目が、関係者の安全意識だ。"}, {"t": 1464.5666666666666, "x": "ここで出てくるのが、機械への過信という話だった。"}, {"t": 1467.7666666666667, "x": "そのうえで、どんなに精緻な機械でも、\nしょせん機械は機械だと言っている。"}, {"t": 1472.05, "x": "補助の手段は四重にも\n五重にも付いていて、それを全部使えば、"}, {"t": 1475.9166666666667, "x": "コースをそれ始めた時点ですぐ見つけられる、と。"}, {"t": 1478.8166666666666, "x": "その決まりがあるのに事件が起きた。"}, {"t": 1480.9, "x": "だから規定が守られていなかった可能性が強い。"}, {"t": 1483.8, "x": "ただし、機体は海の底で、記録は何も戻っていない。"}, {"t": 1487.25, "x": "この時点では、誰も中身を確かめられなかった。"}, {"t": 1490.9333333333334, "x": "1985年1月23日、参議院の決算委員会で、"}, {"t": 1495.3833333333334, "x": "安倍晋太郎外務大臣が経過を説明している。"}, {"t": 1498.25, "x": "1983年9月、国際民間航空機関の理事会で\n特別会合が開かれた。"}, {"t": 1504.1, "x": "そして、事件の事実調査を事務局長に\n指示する決議を採択するために努力した。"}, {"t": 1509.3333333333333, "x": "これに基づいて1983年10月、\n調査団が日本に来ている。"}, {"t": 1514.0333333333333, "x": "日本にも調べに来たの？"}, {"t": 1515.7333333333333, "x": "来た。調査団は、日本のほかに\nアメリカと韓国でも調査を行っている。"}, {"t": 1520.2333333333333, "x": "そして1983年12月、調査報告書が提出された。"}, {"t": 1524.7833333333333, "x": "さらに1984年3月、理事会で\nその報告書の審議が行われた。"}, {"t": 1529.8166666666666, "x": "そこで採択されたのが、ソ連の非協力を\n遺憾とする決議だった。"}, {"t": 1534.0666666666666, "x": "……調査に協力しなかったのね。"}, {"t": 1536.1, "x": "ソ連は調査に対して暫定の報告書を\n提出したが、その後は何も提出していない。"}, {"t": 1541.35, "x": "外務大臣は1984年の2月と9月、\nグロムイコ外務大臣と二度会談している。"}, {"t": 1547.1166666666666, "x": "返ってきたのは、アメリカのスパイ機であるという、\n従来どおりの立場だった。"}, {"t": 1551.5333333333333, "x": "安倍外務大臣は「誠意のある対応を\n示していないのは遺憾」と述べている。"}, {"t": 1555.8, "x": "真相がいまに至るまで\nはっきりしていないという点については、"}, {"t": 1559.2166666666667, "x": "我々も残念に思っている。"}, {"t": 1561.15, "x": "1985年の時点で、まだ何も？"}, {"t": 1564.2166666666667, "x": "何も戻っていない。"}, {"t": 1565.4666666666667, "x": "この状態が、このあと8年近く続く。"}, {"t": 1568.85, "x": "1993年3月25日、衆議院の内閣委員会。"}, {"t": 1573.0166666666667, "x": "大出俊委員の質問だ。"}, {"t": 1574.7833333333333, "x": "大出委員は、その日、手元にある文書の話を始めた。"}, {"t": 1578.4333333333334, "x": "1992年10月15日。"}, {"t": 1580.95, "x": "ロシア政府が、この事件の関係資料を\n国際民間航空機関に渡した。"}, {"t": 1585.5666666666666, "x": "その資料は、10の文書からできていた。"}, {"t": 1588.2, "x": "10も？"}, {"t": 1588.9333333333334, "x": "乗務員の会話。地上の管制機関との交信の内容。"}, {"t": 1592.3833333333334, "x": "ブラックボックスの音声の記録。その写真。"}, {"t": 1595.0833333333333, "x": "デジタル飛行データ記録装置の分析に\n関する、技師の陸軍中将による報告書。"}, {"t": 1600.2333333333333, "x": "そして、アンドロポフ書記長に宛てた、"}, {"t": 1602.5666666666666, "x": "ウスチノフ国防相とチェブリコフ\nKGB議長の書簡が二通。"}, {"t": 1606.4, "x": "……書記長あての手紙。"}, {"t": 1607.8666666666666, "x": "大出委員は、そのうち日本語に訳された\n一通を、国会で読み上げている。"}, {"t": 1612.2333333333333, "x": "表題には「特別機密」と銘打たれていた。"}, {"t": 1615.05, "x": "宛先は「アンドロポフ同志へ」。"}, {"t": 1617.0666666666666, "x": "カムチャツカ地区およびサハリン島のソ連邦の領空を\n侵犯した航空機が、"}, {"t": 1621.3166666666666, "x": "9月1日、日本海において撃墜された後、"}, {"t": 1624.4, "x": "太平洋艦隊は\nこの航空機の電子機器の捜索を行っていた。"}, {"t": 1628.3, "x": "この機器は、我が領空を二回にわたって\n侵犯した同機の目的をより正確にするため、"}, {"t": 1633.5666666666666, "x": "我々にとって必要であった。"}, {"t": 1635.5666666666666, "x": "……探してたのね。"}, {"t": 1636.8166666666666, "x": "探していた。そしてここからだ。"}, {"t": 1638.95, "x": "捜索は、いくつかの地域では150\nメートルから300メートルの深さで行われた。"}, {"t": 1644.0666666666666, "x": "40隻近くの船を使って、とうとうこれを回収した。"}, {"t": 1647.8, "x": "……回収した？"}, {"t": 1648.8666666666666, "x": "見つけていた。そして、書簡にはその先が書いてある。"}, {"t": 1652.2333333333333, "x": "このとき、アメリカと日本の20隻以上の艦船と、\n大量の航空機が付近にいた。"}, {"t": 1657.4, "x": "だから秘匿する意味で、ソビエト側は、\nまだ引き揚げていないかのように装って、"}, {"t": 1662.0833333333333, "x": "捜索の行動を続けていた。"}, {"t": 1664.1, "x": "……見つけたあとも、探してるふりを？"}, {"t": 1666.3333333333333, "x": "そう書いてある、と大出委員は国会で述べている。"}, {"t": 1669.1166666666666, "x": "僕らはテレビなどを見て、まだ見つからないのか、"}, {"t": 1671.95, "x": "見つからないのかと思っているのに。"}, {"t": 1673.9666666666667, "x": "見つかっていて、機体も、\nブラックボックスも発見してあって。"}, {"t": 1677.7, "x": "「ちょっとこれは私は了解に苦しむのですね」。"}, {"t": 1680.3833333333334, "x": "1993年の衆議院内閣委員会の記録にある言葉だ。"}, {"t": 1685.2166666666667, "x": "では、その箱はいつ表に出たのか。"}, {"t": 1687.6, "x": "同じ日の委員会で、\n外務大臣官房の津守滋審議官が答えている。"}, {"t": 1692.1, "x": "1992年12月18日、パリ。"}, {"t": 1695.25, "x": "日本、アメリカ、韓国、ロシアの代表が立ち会った。"}, {"t": 1698.7166666666667, "x": "その場でロシア側から、国際民間航空機関に\n二つの箱が引き渡された。"}, {"t": 1703.5333333333333, "x": "ボイスレコーダーと、フライトレコーダーだ。"}, {"t": 1705.9833333333333, "x": "事件は1983年の9月1日。"}, {"t": 1709.1333333333334, "x": "9年と3か月半だ。その間、無いことになっていた。"}, {"t": 1712.6833333333334, "x": "津守審議官は、\nその後の作業の段取りも説明している。"}, {"t": 1716.25, "x": "第一段階が、ブラックボックスの解析。"}, {"t": 1718.9666666666667, "x": "第二段階が、関係する\n四カ国への調査団の訪問調査だ。"}, {"t": 1722.9833333333333, "x": "日本については、1993年2月7日から\n10日の間に調査団が来ている。"}, {"t": 1728.3833333333334, "x": "第三段階が、そのデータを使ったシミュレーションだ。"}, {"t": 1731.5166666666667, "x": "これはアメリカのボーイング社と\n協力して行う、と説明されている。"}, {"t": 1735.5333333333333, "x": "作った会社ね。"}, {"t": 1736.8333333333333, "x": "この第三段階が終わったあと、\n事務局長に最終報告書が提出される。"}, {"t": 1741.5, "x": "当初は1993年3月と\n言われていたが、5月ごろに延びた。"}, {"t": 1746.0, "x": "その報告書は、第139回の理事会の審議を\n経て公表される予定だ、と。"}, {"t": 1751.1166666666666, "x": "私はその最終報告書そのものを確かめていない。"}, {"t": 1754.3166666666666, "x": "だから、報告書に何が\n書いてあったかは、この回では話さない。"}, {"t": 1758.3833333333334, "x": "読んでいないものは、言わないのね。"}, {"t": 1760.5, "x": "私が言えるのは、1993年3月の時点で\n国会でそう答弁された、というところまでだ。"}, {"t": 1766.7833333333333, "x": "この10年で、あの決議の一つ目は果たされたのか。"}, {"t": 1770.0, "x": "大韓航空機が領空侵犯をするに至った\n原因を含め、事件の真相究明に努めること。"}, {"t": 1775.7666666666667, "x": "箱は返ってきた。解析もされた。"}, {"t": 1777.9666666666667, "x": "シミュレーションも行われた。"}, {"t": 1779.65, "x": "それでも、外れた理由は決まらなかった。"}, {"t": 1782.8, "x": "遺体と遺品の回収については、当然のことながら\nご遺族の最大の関心事である、と。"}, {"t": 1788.0, "x": "津守審議官は、ご遺族に同行して1992年10月に\nモスクワへ行った、と述べている。"}, {"t": 1794.0166666666667, "x": "その場で、ロシア側に引き渡しを求めた。"}, {"t": 1796.8333333333333, "x": "返ってきたの？"}, {"t": 1797.9666666666667, "x": "返ってこなかった。ロシア側の答えは、こうだった。"}, {"t": 1801.1666666666667, "x": "事件の直後に、当時のソ連課長が\n受け取りに行って引き渡しを受けた数十点。"}, {"t": 1805.9, "x": "それ以外は、もう何もない。"}, {"t": 1807.65, "x": "そして1993年3月10日、もう\n一度モスクワで話し合いが持たれた。"}, {"t": 1812.7166666666667, "x": "今度は、韓国とアメリカと日本の、\nご遺族の代表が出ている。"}, {"t": 1816.7333333333333, "x": "……今度は？"}, {"t": 1817.55, "x": "返答はこうだ。"}, {"t": 1818.6166666666666, "x": "遺体については、ほとんど見なかった。"}, {"t": 1820.9, "x": "潜水の作業を始めて数日たってから、\n腕の一部を一度見ただけだ。"}, {"t": 1825.2166666666667, "x": "遺品については、その後、全部焼いてしまった。"}, {"t": 1828.2666666666667, "x": "…………。"}, {"t": 1828.5833333333333, "x": "これが、1993年3月25日の衆議院内閣委員会の記録に\n残っている答弁だ。"}, {"t": 1834.8333333333333, "x": "ご遺族が、10年かけて\nモスクワまで行って、聞かされた言葉だ。"}, {"t": 1838.7666666666667, "x": "前の章の書簡には、150メートルから300\nメートルの深さで捜索したとあった。"}, {"t": 1843.9166666666667, "x": "その二つを並べて、どう考えるかは、私は言わない。"}, {"t": 1847.3833333333334, "x": "補償についても、栗林参考人が\n1983年の時点で先に整理していた。"}, {"t": 1852.9, "x": "ソ連を相手取ってご遺族が訴訟を起こすこと。"}, {"t": 1855.55, "x": "理論的には考えられるが、実現性は\nはなはだ疑問だ、と述べている。"}, {"t": 1859.9166666666667, "x": "個人に対して十分な補償になるか\nどうかは疑問だ、と言っている。"}, {"t": 1863.8833333333334, "x": "国どうしの話になると、遺族には届かないのね。"}, {"t": 1867.1666666666667, "x": "栗林参考人は、過去の例を\n引いてソ連に求めたことがある。"}, {"t": 1871.0333333333333, "x": "1955年のブルガリアと、1973年のイスラエル。"}, {"t": 1875.45, "x": "実力を行使したこの二つの国は、\n違法性はないとして国家責任は拒否した。"}, {"t": 1880.4666666666667, "x": "それでも、遺族に対する補償金は支払おうとした。"}, {"t": 1883.6666666666667, "x": "民間航空機の乗客の遺族に対して、\n最低限このような誠意をとることを要望したい。"}, {"t": 1889.5666666666666, "x": "最後に、二つの説を並べる。"}, {"t": 1891.6833333333334, "x": "なぜ、あの飛行機は決められた道から外れたのか。"}, {"t": 1894.7666666666667, "x": "一つ目は、入力の誤りという説だ。"}, {"t": 1897.35, "x": "中曽根康弘内閣総理大臣が、\n1983年9月13日の衆議院本会議で触れている。"}, {"t": 1903.9666666666667, "x": "コンピューターに\nインプットするのが間違っていたのであるかどうか。"}, {"t": 1907.3, "x": "これは十分に検証する必要のある問題である、と。"}, {"t": 1910.55, "x": "ただ、これは総理が原因を決めた発言ではない。"}, {"t": 1913.4833333333333, "x": "技術の面では、巖祥夫参考人が挙げた\n三つ目の形がこれにあたる。"}, {"t": 1917.9, "x": "通過する地点の座標を入れ間違えて、\nその後の確認でも見逃す。"}, {"t": 1921.9166666666667, "x": "この形だけは、警告灯が点かない。"}, {"t": 1924.5166666666667, "x": "でも、風の報告はしてたんでしょう？"}, {"t": 1926.8833333333334, "x": "そこが噛み合わないところだ。"}, {"t": 1928.5666666666666, "x": "青木日出雄参考人が言ったとおり、機長は\n装置を三番目まで回して風を読んでいた。"}, {"t": 1933.5, "x": "装置を見ていた人が、その装置の示す\n位置だけを見なかったことになる。"}, {"t": 1937.7833333333333, "x": "二つ目は、何らかの意図があったという説だ。"}, {"t": 1940.5666666666666, "x": "1985年2月15日、衆議院の予算委員会で、\n大出俊委員がこう述べている。"}, {"t": 1946.3166666666666, "x": "計器の誤り、入力の誤り、\nジャイロが動いた、人為の誤り。"}, {"t": 1950.4, "x": "そういう説がほとんど消えて、意図説が\n最近はもうほとんどである、と。"}, {"t": 1954.5166666666667, "x": "大出委員が根拠にしたのは、\nソ連のオガルコフ参謀総長が出した航跡図だった。"}, {"t": 1959.5666666666666, "x": "ソ連が出した図なのね。"}, {"t": 1961.2, "x": "その図では、サハリンの手前で、\nおよそ90度近く右に曲がっている。"}, {"t": 1965.4166666666667, "x": "大出委員はパイロットや専門家に\n聞いて回り、こういう答えを持ち帰っている。"}, {"t": 1969.7333333333333, "x": "この種の90度近い旋回は、\n慣性航法装置では断じてできない。"}, {"t": 1973.9833333333333, "x": "機長が操縦桿を握って回すか、\n自動操縦装置の方位を人が変えるしかない。"}, {"t": 1978.8333333333333, "x": "だから、意図が無ければ\n曲がれない、というのが大出委員の主張だった。"}, {"t": 1982.8, "x": "この図については、いまだに\nアメリカからも日本からも反論がない。"}, {"t": 1986.5666666666666, "x": "そうすると、右に曲がったと考えざるを得ない、と。"}, {"t": 1989.75, "x": "……でも、その図もソ連が出したものよね？"}, {"t": 1992.2833333333333, "x": "そうだ。そして大出委員自身が、こう付け加えている。"}, {"t": 1995.6, "x": "オガルコフ氏が、どういう意図で\nその図を出したかは知らない、と。"}, {"t": 1999.0833333333333, "x": "一方で、青木日出雄参考人は\n1983年の時点でこう述べていた。"}, {"t": 2003.8666666666666, "x": "高度で計画に従っている以上、経路も\n計画どおりに入れていた可能性が高い。"}, {"t": 2008.6166666666666, "x": "意図的にスパイ飛行をするという形跡は見当たらない。"}, {"t": 2011.6833333333334, "x": "二つの説は、どちらも国会の記録に残っている。"}, {"t": 2014.95, "x": "どちらも、確かめられてはいない。"}, {"t": 2017.6, "x": "43年たって、分かっていることを数える。"}, {"t": 2020.5, "x": "1983年9月1日、269人を乗せた機体が、"}, {"t": 2025.2, "x": "サハリンの西南のはしの洋上で撃墜された。"}, {"t": 2028.0333333333333, "x": "稚内のレーダーは、3時12分から\n3時29分まで、その航跡を捉えていた。"}, {"t": 2033.3333333333333, "x": "3時26分前後、稚内で録られた交信の中に、"}, {"t": 2036.95, "x": "ソ連機のパイロットの声が残っていた。"}, {"t": 2039.3, "x": "その記録は、日本とアメリカが共同で、\n国連の安全保障理事会に出した。"}, {"t": 2044.0666666666666, "x": "ソ連は撃墜の事実を認め、\nそして決議案には拒否権を行使した。"}, {"t": 2048.483333333333, "x": "9年後、機体の記録装置がパリで引き渡された。"}, {"t": 2051.75, "x": "そのころに出てきた書簡には、事件の年のうちに\n回収していたと書かれていた。"}, {"t": 2056.483333333333, "x": "探しているふりを続けていた、とも書かれていた。"}, {"t": 2059.4, "x": "次に、分かっていないことを数える。"}, {"t": 2061.6, "x": "なぜ、決められた道から\n外れたのか。これは決まっていない。"}, {"t": 2065.116666666667, "x": "撃った側が、旅客機だと分かっていたのかどうか。"}, {"t": 2068.0333333333333, "x": "これも私には分からない。"}, {"t": 2069.633333333333, "x": "269人の方のほとんどは、いまも戻っていない。"}, {"t": 2073.2833333333333, "x": "……分かっていないほうが、まだ多いのね。"}, {"t": 2075.5666666666666, "x": "1983年9月12日、衆議院は\n決議の一つ目にこう書いた。"}, {"t": 2080.4666666666667, "x": "大韓航空機が領空侵犯をするに至った\n原因を含め、事件の真相究明に努めること。"}, {"t": 2086.233333333333, "x": "43年たって、この一つ目は、まだ終わっていない。"}, {"t": 2089.6666666666665, "x": "ここまで話したのは、1983年から\n1993年までの十年だ。"}, {"t": 2095.15, "x": "ソ連という国は、その十年のうちに無くなった。"}, {"t": 2098.133333333333, "x": "だから、きょうの国やきょうの人に\n読みかえないでもらいたい。"}, {"t": 2101.383333333333, "x": "事件の経過と時刻、稚内の記録は、\n国立国会図書館の国会会議録検索システムから。"}, {"t": 2107.75, "x": "1983年9月20日の衆議院予算委員会と、\n10月4日と10月6日の各委員会。"}, {"t": 2114.0333333333333, "x": "航法と国際法と予防策は、1983年10月7日、"}, {"t": 2118.5333333333333, "x": "参議院の連合審査会の参考人質疑。"}, {"t": 2121.2, "x": "決議の本文は、9月12日の衆議院本会議と、\n9月13日の参議院本会議。"}, {"t": 2126.8333333333335, "x": "安全保障理事会と拒否権は、外務省の外交青書、\n昭和59年版の資料編にある談話。"}, {"t": 2132.65, "x": "記録装置の引き渡しとご遺族への回答は、"}, {"t": 2135.4333333333334, "x": "1993年3月25日の衆議院内閣委員会だ。"}, {"t": 2139.65, "x": "紙の量でいえば、この事件は\nいちばん多く残っているほうだ。"}, {"t": 2143.116666666667, "x": "安全保障理事会で6回、40カ国以上が議論した。"}, {"t": 2146.75, "x": "日本の国会にも、891件の発言が積まれている。"}, {"t": 2150.7166666666667, "x": "それだけ積まれていて、なぜ道を\n外れたのかだけが、いまも空いたままだ。"}, {"t": 2155.0833333333335, "x": "……あれだけ積まれているのに。"}, {"t": 2156.6833333333334, "x": "積まれているのに、そこだけが空いている。"}, {"t": 2158.9666666666667, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
