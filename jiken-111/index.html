<script>
const D={"name": "111", "file": "111_編集用", "dur": 2096.1, "segs": [], "subs": [{"t": 0.0, "x": "1949年12月1日、参議院の予算委員会。"}, {"t": 4.1, "x": "ある議員が政府の予算に反対する演説をしていた。"}, {"t": 7.216666666666667, "x": "中身のない樽ほど高く鳴る、という話の途中だ。"}, {"t": 10.466666666666667, "x": "明治の思想家の言葉を引いて、\n政府の予算を空っぽの樽にたとえていた。"}, {"t": 14.85, "x": "そこで議場から声が飛んだ。"}, {"t": 16.616666666666667, "x": "「光クラブだ」。"}, {"t": 17.816666666666666, "x": "光クラブ？　お店の名前？"}, {"t": 19.783333333333335, "x": "会社の名前だ。速記録にもそのまま残っている。"}, {"t": 22.95, "x": "かっこ書きで「光クラブだと呼ぶ者あり」とな。"}, {"t": 26.116666666666667, "x": "誰が言ったの？"}, {"t": 27.25, "x": "それは書かれていない。"}, {"t": 28.366666666666667, "x": "野次の主は分からない。"}, {"t": 29.866666666666667, "x": "説明は1つも付いていない。"}, {"t": 31.55, "x": "名前だけが書かれている。"}, {"t": 33.11666666666667, "x": "この野次の6日前に、\nこの会社の社長が亡くなっている。"}, {"t": 36.516666666666666, "x": "社長は満26歳。まだ東京大学の学生だった。"}, {"t": 40.21666666666667, "x": "学生が社長？　何の会社だったの？"}, {"t": 42.733333333333334, "x": "お金を集めて、高い利子で貸す会社だ。"}, {"t": 45.35, "x": "最後には394人から、約3000万円を\n返せと迫られていた。"}, {"t": 49.983333333333334, "x": "394人って、相当な数よね。"}, {"t": 52.88333333333333, "x": "その3000万円が、最後に\n誰の手にどれだけ戻ったのか。"}, {"t": 56.516666666666666, "x": "まとまった記録は、今回あたった資料からは\n見つかっていない。"}, {"t": 60.25, "x": "えっ。分かっていないの？"}, {"t": 61.88333333333333, "x": "分かっていない。新聞は\n「破産か再建か」と書いてそこで止まる。"}, {"t": 66.01666666666667, "x": "今回はこの会社が生まれてから社長が\n亡くなるまでの、1年あまりを追う。"}, {"t": 70.28333333333333, "x": "そのあと国会で、この名前が\nどう使われたかも見ていく。"}, {"t": 73.78333333333333, "x": "野次になるくらいの会社、ってことね。"}, {"t": 76.16666666666667, "x": "そうだ。始まりは中野の横丁の小さな広告だった。"}, {"t": 80.26666666666667, "x": "1948年10月22日の東京タイムズ。"}, {"t": 83.88333333333334, "x": "2面のいちばん下に、小さな広告が載っている。"}, {"t": 86.86666666666666, "x": "何行かで用件だけを書く、三行広告と呼ばれる欄だ。"}, {"t": 90.56666666666666, "x": "新聞の隅っこの、細かい字のところね。"}, {"t": 93.33333333333333, "x": "そこにこう書いてあった。"}, {"t": 94.75, "x": "「金融斡旋。貸方月1割8分迄」。"}, {"t": 97.73333333333333, "x": "「担保提供大小不問。乞照会」。"}, {"t": 100.23333333333333, "x": "「中野本町4の38。"}, {"t": 102.0, "x": "鍋横電停近。光クラブ」。"}, {"t": 104.65, "x": "呪文みたい。ひとつずつ教えて。"}, {"t": 106.85, "x": "金融斡旋は\nお金の貸し借りの仲立ちをするという意味だ。"}, {"t": 110.21666666666667, "x": "担保の大きさは問わない、と続く。"}, {"t": 112.4, "x": "最後に照会を乞う。つまり問い合わせてください、だ。"}, {"t": 115.66666666666667, "x": "「鍋横」っていうのは？"}, {"t": 117.18333333333334, "x": "中野の鍋屋横丁のことだ。そこに\n路面電車の停留所があった。"}, {"t": 121.23333333333333, "x": "店を開いたのは、その6日前の10月16日。"}, {"t": 124.53333333333333, "x": "鍋屋横丁のマーケットの一角だった。"}, {"t": 127.08333333333333, "x": "マーケットって、闇市みたいな場所？"}, {"t": 129.48333333333332, "x": "戦後の東京には、そういう市場がたくさんあった。"}, {"t": 132.48333333333332, "x": "週刊朝日によると、元手は1万5000円だ。"}, {"t": 135.63333333333333, "x": "会社を始めるにしては、ずいぶん少ないわね。"}, {"t": 138.56666666666666, "x": "少ない。机ひとつ分くらいの商売だ。"}, {"t": 141.2, "x": "それが1年も経たないうちに、\n総額数千万円を動かすようになる。"}, {"t": 145.48333333333332, "x": "1万5000円から数千万円？"}, {"t": 147.6, "x": "当時の新聞が書いた数字だ。"}, {"t": 149.36666666666667, "x": "順番に見ていこう。"}, {"t": 150.68333333333334, "x": "まずこの会社の名前がどこから来たかだ。"}, {"t": 153.8, "x": "光クラブって、名前だけ聞くと明るいわよね。"}, {"t": 156.86666666666667, "x": "本人があとで本に書いている。"}, {"t": 158.7, "x": "1950年2月に出た『私は偽悪者』という本だ。"}, {"t": 162.78333333333333, "x": "偽悪者？　悪人のふりをする人ってこと？"}, {"t": 165.56666666666666, "x": "そういう題だ。本人が亡くなったあとに出ている。"}, {"t": 168.41666666666666, "x": "その中で名前の由来をこう説明している。"}, {"t": 171.01666666666668, "x": "新宿の大きな露店の組が、復興の\nかけ声にしていた言葉がある。"}, {"t": 175.16666666666666, "x": "「光は新宿から」。"}, {"t": 176.56666666666666, "x": "そこから取った、と書いている。"}, {"t": 178.56666666666666, "x": "中野のすぐとなりが新宿よね。"}, {"t": 180.73333333333332, "x": "電車でひと駅かふた駅の距離だ。"}, {"t": 182.86666666666667, "x": "当時の新宿は、闇市の中心のひとつだった。"}, {"t": 186.03333333333333, "x": "焼け跡に店が並んで、物と\nお金がいちばん速く回る場所だ。"}, {"t": 190.01666666666668, "x": "その勢いにあやかった、ってことかしら。"}, {"t": 192.53333333333333, "x": "本人の説明は、取ったというところまでだ。"}, {"t": 195.26666666666668, "x": "あやかったのか、皮肉なのかは書いていない。"}, {"t": 197.98333333333332, "x": "本人の言葉より先は、言えないのね。"}, {"t": 200.56666666666666, "x": "言えない。ここからも同じやり方で行く。"}, {"t": 202.9, "x": "では名前を付けた本人はどんな人だったのか。"}, {"t": 205.7, "x": "当時の週刊誌が、かなり細かく書いている。"}, {"t": 209.08333333333334, "x": "名前は山崎晃嗣。"}, {"t": 210.63333333333333, "x": "1923年1月23日、千葉県の木更津に生まれた。"}, {"t": 215.16666666666666, "x": "木更津って東京湾の向こう側よね。"}, {"t": 217.56666666666666, "x": "そうだ。父親は医師で、木更津の市長も務めた人だ。"}, {"t": 221.16666666666666, "x": "週刊朝日は母親が音楽学校の出身だとも書いている。"}, {"t": 224.95, "x": "かなりきちんとしたお家ね。"}, {"t": 226.76666666666668, "x": "本人は旧制の一高に進んだ。"}, {"t": 229.01666666666668, "x": "いまの東京大学の教養学部にあたる学校だ。"}, {"t": 232.01666666666668, "x": "そこから1942年に、東京帝国大学の法学部に入った。"}, {"t": 236.8, "x": "絵に描いたような秀才コースね。"}, {"t": 238.86666666666667, "x": "成績まで新聞に出ている。"}, {"t": 240.63333333333333, "x": "週刊朝日は20科目のうち優が11と書いた。"}, {"t": 243.73333333333332, "x": "ところが朝日新聞は、あとで優は17だと書き直した。"}, {"t": 247.4, "x": "数が違うじゃない。"}, {"t": 248.68333333333334, "x": "違う。どちらが正しいかは、確かめられていない。"}, {"t": 251.7, "x": "ただ成績表の中身まで\n記事になるほど注目されていた。"}, {"t": 255.18333333333334, "x": "そこは間違いない。"}, {"t": 256.51666666666665, "x": "法学部ってことは、法律の勉強をしていたのよね。"}, {"t": 259.8333333333333, "x": "そうだ。ここは覚えておいてほしい。"}, {"t": 261.81666666666666, "x": "この人は最後まで、法律の言葉で物を考えている。"}, {"t": 265.23333333333335, "x": "ただその前に、大学は戦争で中断する。"}, {"t": 268.7, "x": "1943年。学生のまま兵隊に取られる。学徒出陣だ。"}, {"t": 273.3833333333333, "x": "大学生も戦争に行かされた時期ね。"}, {"t": 275.9, "x": "1944年の2月から10月までは、\n神奈川の溝の口にいた。"}, {"t": 280.43333333333334, "x": "お金や食べ物を扱う、経理の幹部候補生の教育だ。"}, {"t": 283.95, "x": "そのあと主計少尉になる。"}, {"t": 285.7, "x": "主計って何をする係？"}, {"t": 287.46666666666664, "x": "部隊のお金や食料、衣服を管理する役目だ。"}, {"t": 290.5, "x": "終戦は北海道の旭川で迎えている。"}, {"t": 293.15, "x": "北部第178部隊という部隊だ。"}, {"t": 295.78333333333336, "x": "その年の11月に、友人へ手紙を書いている。"}, {"t": 299.03333333333336, "x": "11月って、まだ戦争中の1944年の？"}, {"t": 302.81666666666666, "x": "そうだ。終戦の前の年だ。"}, {"t": 304.81666666666666, "x": "その手紙にこういう一行がある。"}, {"t": 306.71666666666664, "x": "「国家は最高の悪である。」"}, {"t": 308.43333333333334, "x": "軍隊の中でそんなことを書いたの？"}, {"t": 310.71666666666664, "x": "作家の保阪正康さんが、本で紹介している手紙だ。"}, {"t": 314.31666666666666, "x": "そして終戦の直後、もうひとつ出来事がある。"}, {"t": 317.25, "x": "部隊の食料を隠した件で、横領罪に問われた。"}, {"t": 320.43333333333334, "x": "判決は懲役1年6か月、執行猶予3年。"}, {"t": 323.8833333333333, "x": "えっ。有罪になってるの？"}, {"t": 325.7, "x": "なっている。この事件より前の話だ。"}, {"t": 328.15, "x": "中身の細かいところは、資料によって書き方が違う。"}, {"t": 331.51666666666665, "x": "だからこの回では、判決の結論だけを言っておく。"}, {"t": 334.85, "x": "戦争が終わって、大学に戻ったのね。"}, {"t": 337.55, "x": "戻った。そして大学に\n籍を置いたまま、中野で店を開く。"}, {"t": 341.46666666666664, "x": "その頃、日本の経済は大きく\n向きを変えようとしていた。"}, {"t": 345.51666666666665, "x": "1948年12月18日。"}, {"t": 348.4, "x": "占領していた連合国軍の総司令部が、\n日本政府に指令を出す。"}, {"t": 352.48333333333335, "x": "経済安定9原則と呼ばれるものだ。"}, {"t": 355.05, "x": "9原則？　何を決めたの？"}, {"t": 357.1, "x": "ひとことで言えば、物の値段が\n上がり続けるのを止めろ、だ。"}, {"t": 360.7, "x": "予算を締める。税金を取る。"}, {"t": 362.43333333333334, "x": "銀行の貸し出しを絞る。"}, {"t": 364.0833333333333, "x": "翌年の春には、この方針が具体的な形で固まる。"}, {"t": 367.9166666666667, "x": "値段が落ち着くなら、いいことじゃないの？"}, {"t": 370.4, "x": "値段の面ではそうだ。"}, {"t": 371.78333333333336, "x": "ただお金の回りは一気に悪くなった。"}, {"t": 374.1, "x": "当時の新聞は、これを「金づまり」と呼んでいる。"}, {"t": 377.28333333333336, "x": "金づまり。言葉のとおりね。"}, {"t": 379.25, "x": "銀行は貸してくれない。でも\n商売を止めるわけにはいかない。"}, {"t": 382.65, "x": "そういう店や会社が、銀行以外の貸し手を探す。"}, {"t": 385.9166666666667, "x": "そこに光クラブが入ってくるわけね。"}, {"t": 388.4, "x": "光クラブだけではない。"}, {"t": 389.93333333333334, "x": "1949年3月20日の朝日新聞に、こんな見出しがある。"}, {"t": 394.4, "x": "「私設銀行をヤリ玉。"}, {"t": 395.73333333333335, "x": "二週間で資本が四倍」。"}, {"t": 397.5833333333333, "x": "私設銀行って、勝手に銀行をやってるってこと？"}, {"t": 400.78333333333336, "x": "銀行の許しを持たずに、お金を\n集めて貸す業者のことだ。"}, {"t": 404.4166666666667, "x": "この記事は光クラブとは別の業者の摘発を伝えている。"}, {"t": 407.98333333333335, "x": "記事によると、こうした業者の摘発は16年ぶりだった。"}, {"t": 411.75, "x": "16年ぶりってことは、前はいつだったの？"}, {"t": 414.56666666666666, "x": "記事は昭和7年から8年の不況のころを挙げている。"}, {"t": 417.76666666666665, "x": "そのころ東北地方で、こうした\n業者がかなり挙げられたそうだ。"}, {"t": 421.56666666666666, "x": "昭和7年って、1932年よね。"}, {"t": 424.68333333333334, "x": "そうだ。戦争の前の、不況の時代だな。"}, {"t": 427.6333333333333, "x": "じゃあ、そのあとは見逃されてたの？"}, {"t": 429.8333333333333, "x": "記事はそこまでは書いていない。"}, {"t": 431.53333333333336, "x": "はっきりしているのは、\n同じ種類の業者が増えていたことだ。"}, {"t": 435.01666666666665, "x": "その中で光クラブは中野を出る準備を始めていた。"}, {"t": 438.8833333333333, "x": "1949年1月25日の東京タイムズに、また広告が出る。"}, {"t": 443.7, "x": "「求ム貸事務所」。"}, {"t": 445.1166666666667, "x": "場所の希望は「銀座、新橋、日本橋方面」。"}, {"t": 448.48333333333335, "x": "中野から一気に都心に出るつもりなのね。"}, {"t": 451.15, "x": "2月10日には、読売新聞に広告を出している。"}, {"t": 454.35, "x": "文句は「遊金利殖。堅実第一担保提供」。"}, {"t": 457.96666666666664, "x": "遊金利殖って何？"}, {"t": 459.48333333333335, "x": "使っていないお金を預ければ\n増やします、という意味だ。"}, {"t": 462.68333333333334, "x": "中野の広告は、お金を貸しますだった。"}, {"t": 465.3333333333333, "x": "銀座の広告は、お金を預けませんかに変わっている。"}, {"t": 468.6666666666667, "x": "あ。借りる人じゃなくて出す人を呼んでるのね。"}, {"t": 471.46666666666664, "x": "そこがこの会社の大事なところだ。"}, {"t": 473.6166666666667, "x": "広告に載った住所は、中央区銀座2ノ3。"}, {"t": 476.4166666666667, "x": "かっこ書きで「松屋百貨店裏」とある。"}, {"t": 479.2, "x": "松屋っていまもある銀座のデパートよね。"}, {"t": 481.6, "x": "ただ当時の松屋は、デパートとして\n営業していなかった。"}, {"t": 484.95, "x": "1946年から1952年まで、占領軍に\n建物ごと押さえられている。"}, {"t": 490.5, "x": "看板には英語で「TOKYO PX」と出ていた。"}, {"t": 493.85, "x": "PXって？"}, {"t": 495.06666666666666, "x": "占領軍の兵隊と家族のための売店だ。"}, {"t": 497.9, "x": "その裏に学生の金融会社があったのね。"}, {"t": 500.6333333333333, "x": "住所の上では、そういうことになる。"}, {"t": 502.8, "x": "銀座の住所は、それだけで広告になった。"}, {"t": 505.55, "x": "中野の横丁から、4か月ほどで銀座へ出たわけだ。"}, {"t": 509.53333333333336, "x": "同じ年の5月、国会も動いている。"}, {"t": 512.15, "x": "光クラブのことで？"}, {"t": 513.6666666666666, "x": "名前は出ていない。もっと広い話だ。"}, {"t": 516.0666666666667, "x": "「貸金業等の取締に関する法律」という\n法律が出された。"}, {"t": 520.0833333333334, "x": "5月19日に参議院の大蔵委員会で採決。"}, {"t": 523.0166666666667, "x": "全員が手を挙げた。"}, {"t": 524.35, "x": "その日の委員会では、ある委員がこう聞いている。"}, {"t": 527.0333333333333, "x": "この法律の相手は、3月に私が取り上げた\n日掛貯金のような商売か、と。"}, {"t": 532.1, "x": "日掛貯金って？"}, {"t": 533.45, "x": "毎日少しずつお金を集めて回る、\n貯金のような仕組みだ。"}, {"t": 537.1666666666666, "x": "銀行ではない業者が、それをやっていた。"}, {"t": 539.7666666666667, "x": "町の人から、毎日小銭を集めてたのね。"}, {"t": 542.8166666666667, "x": "国会が気にしていたのは、\nそういう細かい集め方だった。"}, {"t": 546.35, "x": "翌20日の参議院本会議で、\n委員長がこう報告している。"}, {"t": 550.0666666666667, "x": "最近の金融のひっ迫で、高い\n金利の悪質な業者が乱立している。"}, {"t": 554.5333333333333, "x": "預金のようにお金を受け入れて、\n銀行の法律に違反している。"}, {"t": 558.2166666666667, "x": "それを取り締まるための法律だ、とな。"}, {"t": 560.7333333333333, "x": "まさに光クラブみたいな業者のことじゃない。"}, {"t": 563.4666666666667, "x": "中身はそう読める。ただ会議録に、\n会社の名前は1つも無い。"}, {"t": 567.3333333333334, "x": "この法律は5月31日に、\n法律第170号として施行された。"}, {"t": 572.2333333333333, "x": "何が変わったの？"}, {"t": 573.5166666666667, "x": "お金を貸す商売をする人は、\n大蔵大臣に届け出ることになった。"}, {"t": 577.6833333333333, "x": "届け出た業者は、国から監督を受ける。"}, {"t": 580.45, "x": "届け出れば続けてもいいってこと？"}, {"t": 582.6333333333333, "x": "そういう仕組みだ。禁止したわけではない。"}, {"t": 585.0333333333333, "x": "ここは後でもう一度出てくる。"}, {"t": 586.7666666666667, "x": "この法律が実際にはどこまで\n守られたか、という話でな。"}, {"t": 590.5833333333334, "x": "守られなかったってこと？"}, {"t": 592.2833333333333, "x": "それは1950年の国会で、視察の結果として出てくる。"}, {"t": 596.35, "x": "先に1949年の夏に進もう。"}, {"t": 599.1, "x": "光クラブの広告が派手になっていく。"}, {"t": 602.2, "x": "1949年6月14日の東京タイムズ。"}, {"t": 605.65, "x": "光クラブの広告は、問いかけで始まる。"}, {"t": 608.35, "x": "「光クラブは何故有名なのでせう？」。"}, {"t": 610.55, "x": "自分で有名って言っちゃうのね。"}, {"t": 612.4833333333333, "x": "答えも自分で書いている。"}, {"t": 614.0333333333333, "x": "「これは堅実と近代性を誇る\n日本唯一の金融株式会社だからなのです」。"}, {"t": 618.95, "x": "日本唯一？　さすがに言いすぎじゃない？"}, {"t": 621.3666666666667, "x": "何が唯一なのかは、広告には書かれていない。"}, {"t": 624.25, "x": "12日後の6月26日には、別の広告も出している。"}, {"t": 628.2166666666667, "x": "社長の秘書を募集する広告だ。"}, {"t": 630.4166666666666, "x": "秘書の募集が、そんなに話題になるの？"}, {"t": 632.9833333333333, "x": "文面が変わっていた。"}, {"t": 634.2333333333333, "x": "書き出しはこうだ。"}, {"t": 635.4333333333333, "x": "「喜劇と悲劇は紙一重である」。"}, {"t": 637.55, "x": "求人広告の書き出しとは思えないわね。"}, {"t": 640.2333333333333, "x": "そのあと敗戦の社会で何を\n学んだか、と読者に問いかける。"}, {"t": 644.0166666666667, "x": "最後は「近代女性は来れ。"}, {"t": 645.8666666666667, "x": "求社長秘書」で終わる。"}, {"t": 648.0666666666667, "x": "会社の広告というより、本人の文章ね。"}, {"t": 650.95, "x": "そう読める。広告にも社長の色が出ている。"}, {"t": 653.6166666666667, "x": "中野で1万5000円から始めて、8か月だ。"}, {"t": 656.7833333333333, "x": "新聞に自分の言葉で広告を打つ会社になっていた。"}, {"t": 660.1166666666667, "x": "このまま大きくなりそうな勢いね。"}, {"t": 662.3, "x": "この秘書募集の広告から、8日後だ。"}, {"t": 664.8666666666667, "x": "社長は警察署にいた。"}, {"t": 667.0666666666667, "x": "1949年7月4日。"}, {"t": 669.5666666666667, "x": "光クラブの社長と専務の2人が、\n京橋警察署に留置された。"}, {"t": 673.9333333333333, "x": "専務ってもう1人の経営者？"}, {"t": 675.9333333333333, "x": "そうだ。当時25歳の医大生だった。"}, {"t": 678.4666666666667, "x": "この人の名前は、この回では出さない。"}, {"t": 681.0166666666667, "x": "どうして？"}, {"t": 681.8666666666667, "x": "いま生きているかどうか、確かめられなかったからだ。"}, {"t": 684.85, "x": "疑いの中身は、物価統制令の違反。"}, {"t": 687.5333333333333, "x": "物価統制令？　お金を貸すのに物価の法律なの？"}, {"t": 690.8666666666667, "x": "そこが面白いところだ。"}, {"t": 692.4333333333333, "x": "物価統制令は、1946年3月に出された勅令だ。"}, {"t": 696.7666666666667, "x": "戦後の物不足で、値段が\nどんどん上がっていた頃だな。"}, {"t": 700.1666666666666, "x": "その第10条に、こうある。"}, {"t": 701.85, "x": "誰であっても、暴利となる\n値段で契約をしてはいけない。"}, {"t": 705.15, "x": "暴利となる値段を受け取ってもいけない。"}, {"t": 707.4833333333333, "x": "お金を貸したときの利子も、値段の一種ってこと？"}, {"t": 710.6833333333333, "x": "そういう扱いだ。翌日の朝日新聞は、\n暴利による違反の疑いと書いた。"}, {"t": 715.3833333333333, "x": "記事の見出しは「『光クラブ』を摘発。"}, {"t": 717.95, "x": "学生社長の金融業」。"}, {"t": 719.6666666666666, "x": "社会面の2段の記事だった。"}, {"t": 721.5666666666667, "x": "取り調べで社長は事実を認めている、とも書いている。"}, {"t": 724.9166666666666, "x": "認めたのね。"}, {"t": 726.0, "x": "ただ読売新聞には、本人の別の言葉も出ている。"}, {"t": 729.3333333333334, "x": "「六法全書をタテに徹底的に闘う」。"}, {"t": 731.95, "x": "法律で闘うってことね。"}, {"t": 733.8166666666667, "x": "法学部の学生らしい言い方だ。"}, {"t": 735.8333333333334, "x": "ではその暴利とはどのくらいの利子だったのか。"}, {"t": 739.0166666666667, "x": "朝日新聞は貸し付けの例を2つ挙げている。"}, {"t": 741.7166666666667, "x": "1つ目。3月19日から\n4月23日まで、ある会社に76万円を貸した。"}, {"t": 747.3833333333333, "x": "そのとき2割1分の利子を、先に差し引いている。"}, {"t": 750.5, "x": "先に差し引くって、どういうこと？"}, {"t": 752.7666666666667, "x": "100万円を借りたのに、手元には\n79万円しか来ないような形だ。"}, {"t": 757.2, "x": "これを天引きと言う。"}, {"t": 758.5333333333333, "x": "返すときは100万円なのよね。"}, {"t": 760.6166666666667, "x": "そうだ。借りた側には、数字以上に重い。"}, {"t": 763.2666666666667, "x": "2つ目の例。5月18日に3万円を貸した。"}, {"t": 766.5666666666667, "x": "利子は日歩70銭だった。"}, {"t": 768.4833333333333, "x": "日歩って聞いたことない。"}, {"t": 770.0, "x": "100円を1日借りるごとに、\nいくら払うかという数え方だ。"}, {"t": 773.6333333333333, "x": "日歩70銭なら、100円につき1日70銭。"}, {"t": 777.05, "x": "1日で70銭なら、たいしたことなさそう。"}, {"t": 780.0833333333334, "x": "1か月続けると、100円につき21円になる。"}, {"t": 783.4833333333333, "x": "えっ。ひと月で2割以上？"}, {"t": 785.4166666666666, "x": "そういう計算になる。"}, {"t": 786.7666666666667, "x": "週刊朝日によると、法律で\n決まった上限は日歩50銭だった。"}, {"t": 790.8333333333334, "x": "つまり上限を20銭こえていた、という疑いだ。"}, {"t": 793.9333333333333, "x": "じゃあお金を出す人にはどのくらい払ってたの？"}, {"t": 796.7333333333333, "x": "読売新聞はこう書いている。"}, {"t": 798.5333333333333, "x": "一般から月1割の利率で募集した\n資金を、月2割から3割の高利で回した。"}, {"t": 803.6666666666666, "x": "総額数千万円にのぼる大がかりな金融だった、と。"}, {"t": 807.1666666666666, "x": "月1割を払って、月2割から3割で貸す。"}, {"t": 810.3666666666667, "x": "記事の書き方では、そうなる。"}, {"t": 812.3166666666667, "x": "資料によって、出資者への利率はかなり違う。"}, {"t": 815.1666666666666, "x": "ここは当時の読売の記事だけを紹介しておく。"}, {"t": 818.1, "x": "でも月1割って払い続けられるものなの？"}, {"t": 820.8833333333333, "x": "貸したお金が、ちゃんと戻ってくるあいだはな。"}, {"t": 823.6, "x": "戻らなくなったとき、何が\n起きるか。それがこの先の話だ。"}, {"t": 828.2, "x": "光クラブの摘発が新聞に出た、7月5日。"}, {"t": 831.6166666666667, "x": "その日、国鉄の下山総裁が行方不明になっている。"}, {"t": 835.2333333333333, "x": "下山事件ね。"}, {"t": 836.55, "x": "翌日、線路の上で亡くなっているのが見つかった。"}, {"t": 839.65, "x": "国鉄では9万5000人を減らす整理が進んでいた頃だ。"}, {"t": 843.2333333333333, "x": "新聞の紙面は、そちらで埋まっていく。"}, {"t": 845.8, "x": "じゃあ光クラブの話は、すぐに消えたの？"}, {"t": 848.5833333333334, "x": "ところが消えなかった。"}, {"t": 849.9833333333333, "x": "週刊朝日の7月31日号が、大きく取り上げる。"}, {"t": 853.7, "x": "題は「現代のファウスト。"}, {"t": 855.3, "x": "あげられた\"学生社長\"」。"}, {"t": 857.2, "x": "ファウスト？"}, {"t": 858.0666666666667, "x": "ゲーテの戯曲の主人公だ。"}, {"t": 859.8333333333334, "x": "学問を極めた博士が、悪魔と契約する話だな。"}, {"t": 863.5166666666667, "x": "秀才が悪魔と契約。たしかに重ねたくなるわね。"}, {"t": 866.9, "x": "週刊朝日が書いたのは、成績や\n家族のことだけではない。"}, {"t": 870.5333333333333, "x": "店を始めたいきさつも書いている。"}, {"t": 872.6166666666667, "x": "前の年の10月に、客として金融会社を訪ねた。"}, {"t": 876.05, "x": "そこでのちに専務になる学生と知り合ったという。"}, {"t": 879.0, "x": "お客さんとして行った先で、相棒を見つけたのね。"}, {"t": 882.1833333333333, "x": "そういう書き方だ。"}, {"t": 883.4166666666666, "x": "記事の最後には、こういう言葉もある。"}, {"t": 885.7166666666667, "x": "世間はこの青年に、戦後派という\nレッテルを張って済ませている。"}, {"t": 889.4333333333333, "x": "それで片付けてよいのか、とな。"}, {"t": 891.6, "x": "週刊誌が簡単に決めつけるなって書いてるの？"}, {"t": 894.5333333333333, "x": "そうだ。ただ世間の見方はそちらに傾いていく。"}, {"t": 897.6166666666667, "x": "そして8月に、社長は外に出てくる。"}, {"t": 900.9, "x": "1949年8月、社長は釈放された。"}, {"t": 904.5833333333334, "x": "裁判にはならなかったの？"}, {"t": 906.3666666666667, "x": "処分保留で釈放、と書く資料がある。"}, {"t": 908.8, "x": "別の資料は約1か月後に不起訴になったと書く。"}, {"t": 911.8666666666667, "x": "どちらにしても、起訴はされていない。"}, {"t": 914.1833333333333, "x": "じゃあ元どおり商売を続けられるわね。"}, {"t": 916.5, "x": "形の上ではな。でもお金を出す側はそう考えなかった。"}, {"t": 920.0666666666667, "x": "社長が警察に連れて行かれた会社だ。"}, {"t": 922.5, "x": "お金を預けていた人たちは、返してくれと言い始める。"}, {"t": 925.9833333333333, "x": "そうなるわよね。"}, {"t": 927.1166666666667, "x": "しかも街全体が、さらに苦しくなっていた。"}, {"t": 930.0, "x": "8月29日の朝日新聞の見出しは\n「ヤミ金融も金づまり」。"}, {"t": 934.1833333333333, "x": "社会面のいちばん上の記事だ。"}, {"t": 936.2333333333333, "x": "ヤミ金融まで、お金に困りだしたってこと？"}, {"t": 939.1666666666666, "x": "そうだ。お金を出していた側が、手を引き始めていた。"}, {"t": 942.5333333333333, "x": "9月12日の読売新聞は、もっとはっきり書く。"}, {"t": 945.85, "x": "「ヤミ金融泣き面に蜂。"}, {"t": 947.3833333333333, "x": "回収不能と取締まりの追討ち」。"}, {"t": 949.5833333333334, "x": "泣き面に蜂。うまいこと言うわね。"}, {"t": 951.8833333333333, "x": "本文はこうだ。"}, {"t": 952.95, "x": "ひどい金づまりで、貸したお金が戻らない。"}, {"t": 955.6166666666667, "x": "出資者への利子はもちろん、\n元金さえ返せなくなりがちだ。"}, {"t": 959.1166666666667, "x": "さらに大蔵省と警視庁が、\n取り締まりに乗り出すと書いている。"}, {"t": 962.9166666666666, "x": "貸したお金は戻らない。"}, {"t": 964.2833333333333, "x": "預かったお金は返せって言われる。"}, {"t": 966.5166666666667, "x": "その両方から挟まれたわけだ。"}, {"t": 968.4833333333333, "x": "9月、光クラブは394人から返済を求められた。"}, {"t": 972.5333333333333, "x": "合わせて約3000万円。"}, {"t": 973.9666666666667, "x": "資料によっては3600万円とも書かれる。"}, {"t": 977.0333333333333, "x": "3000万円って、いまだとどのくらい？"}, {"t": 979.4666666666667, "x": "文春オンラインの記事は、\n約2億3300万円と換算している。"}, {"t": 983.95, "x": "394人で2億円以上。"}, {"t": 985.95, "x": "1人あたりけっこうな額ね。"}, {"t": 987.9, "x": "そこから2か月あまり、社長は\n返すための計算を続けることになる。"}, {"t": 992.75, "x": "11月21日、月曜日の夜。"}, {"t": 995.3666666666667, "x": "社長は浅草の銭湯にいた。"}, {"t": 997.4, "x": "銭湯？　社長なのに？"}, {"t": 999.05, "x": "本人の手記にそう書いてある。"}, {"t": 1000.8666666666667, "x": "手記はのちに読売新聞に載った。題はこうだ。"}, {"t": 1003.85, "x": "「高利貸となりえざりし弁明」。"}, {"t": 1005.7666666666667, "x": "高利貸になりきれなかった言い訳、ってこと？"}, {"t": 1008.5666666666667, "x": "そういう意味だ。書き出しはこうなっている。"}, {"t": 1010.9166666666666, "x": "1949年11月21日、午後8時10分より、\n湯舟につかりながら考えた。"}, {"t": 1017.2, "x": "時刻まで書いてあるのね。"}, {"t": 1018.8666666666667, "x": "この人は毎日の時間を分単位で記録していた。"}, {"t": 1021.9666666666667, "x": "のちに出た手記の本には、\n1日の時間割の表まで載っている。"}, {"t": 1025.8, "x": "本が出たのは、亡くなった翌月の1949年12月だ。"}, {"t": 1030.15, "x": "題は『私は天才であり超人である』。"}, {"t": 1032.7833333333333, "x": "すごい題ね。本人が付けたの？"}, {"t": 1035.0333333333333, "x": "手記を集めた本で、副題に社長の手記とある。"}, {"t": 1038.0666666666666, "x": "誰が題を決めたかまでは、確かめられていない。"}, {"t": 1040.9, "x": "睡眠は0時から6時半までで390分、といった具合だ。"}, {"t": 1045.0833333333333, "x": "自分の1日を、帳簿みたいに付けてたのね。"}, {"t": 1048.0166666666667, "x": "そう読める記録だ。"}, {"t": 1049.2666666666667, "x": "手記の中には、期限の話も出てくる。"}, {"t": 1051.8833333333334, "x": "12月5日が期限で、払うべき利子は300万円。"}, {"t": 1055.3, "x": "全額は無理だが、半分なら払える\n見込みがあった、という内容だ。"}, {"t": 1059.4666666666667, "x": "半分は払えるつもりだったのね。"}, {"t": 1061.6166666666666, "x": "本人の手記ではな。"}, {"t": 1062.9666666666667, "x": "ところが死後の朝日新聞は別の日付を書いている。"}, {"t": 1066.0333333333333, "x": "25日に300万円を支払う予定だった、と。"}, {"t": 1069.3166666666666, "x": "12月5日と11月25日。"}, {"t": 1071.6333333333334, "x": "どっちが本当なの？"}, {"t": 1073.1333333333334, "x": "両方の資料がある、としか言えない。"}, {"t": 1075.2666666666667, "x": "支払いの約束が、ひとつではなかった可能性もある。"}, {"t": 1078.5833333333333, "x": "でもそれを確かめた資料にはたどり着けていない。"}, {"t": 1081.4666666666667, "x": "日付が違っても、300万円って数字は同じなのね。"}, {"t": 1085.1333333333334, "x": "そこは2つの資料で一致している。"}, {"t": 1087.2666666666667, "x": "そしてこの頃、本人はある雑誌の対談にも出ている。"}, {"t": 1091.2, "x": "雑誌は婦人公論の1950年1月号。"}, {"t": 1094.3166666666666, "x": "対談が行われたのは、亡くなる数日前だった。"}, {"t": 1097.4666666666667, "x": "相手は作家の2人だ。"}, {"t": 1099.1166666666666, "x": "そんな時期に対談なんてしてたの？"}, {"t": 1101.3666666666666, "x": "していた。そこでこう言っている。"}, {"t": 1103.2333333333333, "x": "「合意によるものは拘束さるべし」。"}, {"t": 1105.35, "x": "難しい言い方ね。どういう意味？"}, {"t": 1107.45, "x": "お互いに約束したことは、\n守らなければならない、だ。"}, {"t": 1110.8833333333334, "x": "もとは国と国との約束ごとの原則でな。"}, {"t": 1113.7166666666667, "x": "手記の中でも、同じ原則を名前ごと引いている。"}, {"t": 1116.8333333333333, "x": "パクタ・スント・セルバンダ。"}, {"t": 1118.9166666666667, "x": "法学部で習うような言葉なのね。"}, {"t": 1121.1666666666667, "x": "そうだ。手記はこう続く。"}, {"t": 1122.8666666666666, "x": "借りたお金を返す義務は、契約で縛られている。"}, {"t": 1125.85, "x": "その縛りがほどけるのは、事情が\n大きく変わったときだけだ。"}, {"t": 1129.55, "x": "じゃあ金づまりは事情が変わったことにならないの？"}, {"t": 1132.45, "x": "そこは手記の中で、本人が\n理屈を組み立てている部分だ。"}, {"t": 1136.0166666666667, "x": "この回でその理屈が正しいかどうかは決めない。"}, {"t": 1138.7666666666667, "x": "はっきり言えることは1つだけだ。"}, {"t": 1140.7333333333333, "x": "この人は最後まで、借金を契約の問題として書いた。"}, {"t": 1144.4833333333333, "x": "お金を返せないって話を、\n法律の言葉で書いてたのね。"}, {"t": 1148.1833333333334, "x": "7月には六法全書をタテに闘うと言った人だ。"}, {"t": 1151.4, "x": "11月には約束は守られるべきだと言っている。"}, {"t": 1154.55, "x": "同じ人が同じ法律の言葉を使ってるのね。"}, {"t": 1157.5833333333333, "x": "そうだ。"}, {"t": 1158.2166666666667, "x": "作家の1人は、対談のあとで\n厳しい言葉を書き足している。"}, {"t": 1161.8833333333334, "x": "本人の死は解決ではなく、\n自分だけの逃げ道だった、とな。"}, {"t": 1165.95, "x": "……対談のすぐあとに、亡くなったのね。"}, {"t": 1168.3666666666666, "x": "ここから先は、11月24日の夜の話になる。"}, {"t": 1172.55, "x": "ここは言うことを決めてある。"}, {"t": 1174.1166666666666, "x": "起きたことだけを言う。"}, {"t": 1175.25, "x": "どうやったかは言わない。"}, {"t": 1176.7333333333333, "x": "うん。"}, {"t": 1177.25, "x": "1949年11月24日の夜。"}, {"t": 1180.4166666666667, "x": "社長は銀座2ノ3の社長室で、自ら命を絶った。"}, {"t": 1183.95, "x": "会社に泊まっていた社員が見つけ、病院に運んだ。"}, {"t": 1187.1333333333334, "x": "助からなかった。"}, {"t": 1188.35, "x": "亡くなったのは、11月25日。満26歳だった。"}, {"t": 1192.3833333333334, "x": "……26歳。"}, {"t": 1193.4333333333334, "x": "当時の新聞は、27歳と書いている。"}, {"t": 1196.0833333333333, "x": "生まれた年を1歳と数える、数え年の書き方だ。"}, {"t": 1199.45, "x": "昔の数え方ね。"}, {"t": 1200.9833333333333, "x": "そうだ。この回では満年齢で言っている。"}, {"t": 1203.4333333333334, "x": "読売新聞によると、机の上には\n便箋5枚の遺書があった。"}, {"t": 1207.35, "x": "中身はどんなことが書いてあったの？"}, {"t": 1209.5333333333333, "x": "中身を大きく取り上げるつもりはない。"}, {"t": 1211.6333333333334, "x": "1つだけ書き方のことを言っておく。"}, {"t": 1213.8833333333334, "x": "結びの言葉が、昔の証文と同じ形だった。"}, {"t": 1217.2, "x": "「よって件のごとし」。"}, {"t": 1218.6666666666667, "x": "契約書の最後に書く決まり文句よね。"}, {"t": 1221.2166666666667, "x": "そうだ。最後まで書類の形で書いている。"}, {"t": 1223.8666666666666, "x": "残されたお金の約束が、ここで終わるわけではない。"}, {"t": 1227.0333333333333, "x": "394人ぶんの約束は、会社に残ったままだ。"}, {"t": 1230.8, "x": "社長がいなくなって、お金はどうなるの？"}, {"t": 1233.3833333333334, "x": "それを翌朝の新聞から見ていく。"}, {"t": 1236.1166666666666, "x": "11月26日の朝刊。"}, {"t": 1238.1833333333334, "x": "大きな新聞はそろって、社会面でこの件を伝えた。"}, {"t": 1241.55, "x": "朝日と読売は、社会面のいちばん上の記事だ。"}, {"t": 1244.5833333333333, "x": "毎日は3段の記事だった。"}, {"t": 1246.5833333333333, "x": "見出しはどんな言葉だったの？"}, {"t": 1248.4833333333333, "x": "朝日は「三千万円の金策つきて」。"}, {"t": 1251.0833333333333, "x": "読売は「三百万円の金策つきて」。"}, {"t": 1253.8833333333334, "x": "ちょっと待って。桁がひとつ違うじゃない。"}, {"t": 1256.4333333333334, "x": "違う。同じ日の同じ出来事の見出しだ。"}, {"t": 1259.15, "x": "どっちかが間違えたの？"}, {"t": 1260.7666666666667, "x": "朝日の本文を読むと、両方の数字が出てくる。"}, {"t": 1263.7333333333333, "x": "9月に394人から、約3000万円を返せと言われていた。"}, {"t": 1268.05, "x": "そして25日に、300万円を払う予定だった。"}, {"t": 1271.5166666666667, "x": "あ。3000万円は全体で、\n300万円は目の前の支払いなのね。"}, {"t": 1275.85, "x": "そう読むと2つの見出しは矛盾しない。"}, {"t": 1278.1333333333334, "x": "朝日は全体の大きさを見出しにした。"}, {"t": 1280.45, "x": "読売はその日に足りなかった額を見出しにした。"}, {"t": 1283.4666666666667, "x": "同じ事件でも、どこを見出しにするかで全然違うのね。"}, {"t": 1286.9833333333333, "x": "毎日の見出しは、また違う。"}, {"t": 1288.9666666666667, "x": "「栄華も夢、金詰りに首が回らず」。"}, {"t": 1291.5166666666667, "x": "これは数字じゃなくて、物語みたいな言い方ね。"}, {"t": 1294.65, "x": "3つの新聞が、3つの切り口で書いた。"}, {"t": 1297.3666666666666, "x": "ただどの新聞も伝えていることは同じだ。"}, {"t": 1299.9333333333334, "x": "お金が足りなかった。"}, {"t": 1301.2833333333333, "x": "ではその足りなかった\nお金の持ち主たちは、どうしたのか。"}, {"t": 1305.3666666666666, "x": "社長室には銀行の通帳が残されていた。"}, {"t": 1308.1, "x": "記入されていた残高は、2700円。"}, {"t": 1310.9166666666667, "x": "2700円？　3000万円の会社で？"}, {"t": 1313.6666666666667, "x": "文春オンラインの換算では、いまの約2万1000円だ。"}, {"t": 1317.1166666666666, "x": "数千万円を回していた会社の通帳が、2万円ちょっと。"}, {"t": 1320.8833333333334, "x": "そういう記録だ。"}, {"t": 1322.0, "x": "お金を出していた人たちは、会社に押しかけた。"}, {"t": 1325.0, "x": "11月27日の新聞が、その様子を伝えている。"}, {"t": 1328.6833333333334, "x": "時事新報の見出しは「四百の嘆き顔」。"}, {"t": 1331.3666666666666, "x": "学生社長の死に押しかけた投資者、と続く。"}, {"t": 1334.5166666666667, "x": "400人近くが、会社に来たってこと？"}, {"t": 1337.35, "x": "394人という数と、ほぼ重なる。"}, {"t": 1340.2166666666667, "x": "毎日新聞は債権者の緊急総会の様子を書いた。"}, {"t": 1343.6166666666666, "x": "応対に出た学生の社員が、泣き顔になっていたという。"}, {"t": 1347.0666666666666, "x": "社員も学生だったのね。"}, {"t": 1348.85, "x": "日本経済新聞の見出しは\n「破産か再建か。腹の探り合い」。"}, {"t": 1352.9166666666667, "x": "残った専務と、債権者たちの話し合いだ。"}, {"t": 1355.9333333333334, "x": "それでどっちになったの？"}, {"t": 1357.5166666666667, "x": "そこが冒頭で言った話だ。"}, {"t": 1359.3166666666666, "x": "今回あたった資料の中に、\nその結末を書いたものが無かった。"}, {"t": 1363.3333333333333, "x": "会議録にも？"}, {"t": 1364.4833333333333, "x": "無い。当時の新聞を引いた\n記事も、ここで終わっている。"}, {"t": 1367.6833333333334, "x": "破産になったのか。立て直したのか。"}, {"t": 1370.0666666666666, "x": "394人にどれだけのお金が戻ったのか。"}, {"t": 1373.2833333333333, "x": "……まとまった記録が見つかっていないのね。"}, {"t": 1375.7166666666667, "x": "見つかっていない。だからここは推測で埋めない。"}, {"t": 1378.55, "x": "分かっているのは、社長室の通帳が\n2700円だったことだけだ。"}, {"t": 1382.9166666666667, "x": "でも名前だけは消えなかったのよね。"}, {"t": 1385.15, "x": "消えなかった。最初の野次の話に戻ろう。"}, {"t": 1388.5166666666667, "x": "1949年12月1日の野次は、\n亡くなってから6日後だった。"}, {"t": 1393.2333333333333, "x": "議員が言っていたのは、中身のない予算への反対だ。"}, {"t": 1396.4166666666667, "x": "中身のない樽は、たたくと高い音がする。"}, {"t": 1399.1166666666666, "x": "そこへ「光クラブだ」と声が飛んだ。"}, {"t": 1401.7833333333333, "x": "中身がないのに、音だけ大きい。\nそういう意味で使われたのね。"}, {"t": 1405.5666666666666, "x": "速記録にはどういう意味かまでは書かれていない。"}, {"t": 1408.1833333333334, "x": "説明なしで名前だけが飛んでいる。"}, {"t": 1410.4, "x": "会社の名前が、悪口のたとえになっちゃったのね。"}, {"t": 1413.6166666666666, "x": "2か月後の1950年2月3日。"}, {"t": 1416.2166666666667, "x": "衆議院の予算委員会だ。"}, {"t": 1417.9666666666667, "x": "中曽根康弘 議員が、政府に質問している。"}, {"t": 1421.35, "x": "のちに総理大臣になる人よね。"}, {"t": 1423.55, "x": "そうだ。このときは31歳の若い議員だった。"}, {"t": 1426.6, "x": "質問の中で最近の社会の風潮を嘆いている。"}, {"t": 1429.65, "x": "学生の風潮の例として、こう言った。"}, {"t": 1432.1166666666666, "x": "あの山崎という光クラブの社長の例が、\nいちばんいい例だ。"}, {"t": 1435.85, "x": "名前まで出してるのね。"}, {"t": 1437.4166666666667, "x": "国会の質問で、学生の悪い見本として名前が出た。"}, {"t": 1441.0, "x": "前の日の2月2日には、別の答弁もある。"}, {"t": 1443.9, "x": "池田勇人 大蔵大臣が、\nヤミ金融の利子について答えた。"}, {"t": 1448.0333333333333, "x": "大蔵大臣がヤミ金融の相場を答えてるの？"}, {"t": 1450.9, "x": "答えている。いまは平均で月5分くらいではないか。"}, {"t": 1454.0, "x": "昨年の今ごろは、月1割5分とか\n2割というのも聞いていた、とな。"}, {"t": 1458.4, "x": "昨年の今ごろって、光クラブが銀座に出た頃よね。"}, {"t": 1461.9666666666667, "x": "ちょうど重なる。"}, {"t": 1462.9666666666667, "x": "大臣の口から、その頃の相場がそのまま語られている。"}, {"t": 1466.5333333333333, "x": "ではヤミ金融は、これで静かになったのか。"}, {"t": 1469.2, "x": "1950年の秋、参議院に視察の報告が上がってくる。"}, {"t": 1473.8666666666666, "x": "1950年10月3日。"}, {"t": 1475.85, "x": "参議院の大蔵委員会。"}, {"t": 1477.4833333333333, "x": "ある委員が東海と北陸を視察した結果を報告した。"}, {"t": 1480.8666666666666, "x": "テーマは前の年に決まった貸金業の法律だ。"}, {"t": 1483.9333333333334, "x": "届け出の決まりを作った、あの法律ね。"}, {"t": 1486.6833333333334, "x": "そうだ。まず届け出の数だ。"}, {"t": 1488.6, "x": "届け出た業者は、見込んでいた\n数の半分にも届かなかった。"}, {"t": 1492.3833333333334, "x": "報告には、細かい数字も出ている。"}, {"t": 1494.6666666666667, "x": "東海財務局の管内では、届け出の受け付けが265件。"}, {"t": 1498.7833333333333, "x": "そのうち31件はやめていて、残りは234件だった。"}, {"t": 1502.9166666666667, "x": "北陸財務局の管内では、受け付けが133件。"}, {"t": 1506.6, "x": "やめたのが10件で、残りは123件。"}, {"t": 1509.5666666666666, "x": "やめた業者も、けっこういるのね。"}, {"t": 1511.7166666666667, "x": "東海の担当者は、やめた理由を2つ挙げている。"}, {"t": 1514.7833333333333, "x": "不正なもうけに税金がかかるのを恐れたこと。"}, {"t": 1517.5, "x": "それと、景気が変わって商売が\n成り立たなくなりそうなことだ。"}, {"t": 1521.2666666666667, "x": "税金がこわくてやめる人もいたのね。"}, {"t": 1523.5833333333333, "x": "半分も届け出てないの？"}, {"t": 1525.35, "x": "北陸の担当者は、もっと厳しい見方をしている。"}, {"t": 1528.4833333333333, "x": "届け出ていない業者は、届け出た\n業者の2倍もあろうか、という説明だ。"}, {"t": 1533.0166666666667, "x": "法律を作っても、もぐりの業者のほうが多いのね。"}, {"t": 1536.2166666666667, "x": "そして報告はこう続く。"}, {"t": 1537.8833333333334, "x": "法律をくぐり抜けるやり方が、かなり行われている。"}, {"t": 1541.0833333333333, "x": "事業に出資するという名目で、一般からお金を集める。"}, {"t": 1544.6666666666667, "x": "配当という名目で、毎月お金を払う。"}, {"t": 1547.5, "x": "それ光クラブの「遊金利殖」とそっくりじゃない。"}, {"t": 1550.8333333333333, "x": "形はよく似ている。"}, {"t": 1552.1666666666667, "x": "ある場所でお金が集まると、\nそこをやめて別の場所に移る。"}, {"t": 1555.6833333333334, "x": "名古屋だけで、1億円以上を集めたものもあるらしい。"}, {"t": 1558.9166666666667, "x": "場所を変えながら集めるのね。"}, {"t": 1560.7666666666667, "x": "北陸の報告には、もう1つの例が出てくる。"}, {"t": 1563.75, "x": "品物を分割払いで売る会社が、10社あまりあった。"}, {"t": 1567.05, "x": "毎月の掛け金を集めて、\n品物を先に渡すという名目だ。"}, {"t": 1571.0333333333333, "x": "ところが実際は、品物の代わりに\n現金を渡しているという噂があった。"}, {"t": 1575.55, "x": "品物を売るふりをして、お金を回してたってこと？"}, {"t": 1578.75, "x": "報告は、確かな証拠を\nつかむのは難しいと書いている。"}, {"t": 1582.15, "x": "だからこれも、噂の段階の話だ。"}, {"t": 1584.8333333333333, "x": "1億円？　光クラブより、ずっと大きいじゃない。"}, {"t": 1587.8666666666666, "x": "報告の言葉は「あるらしい」だ。"}, {"t": 1589.9, "x": "確かめた数字ではない。"}, {"t": 1591.4666666666667, "x": "ただ国会の記録に、そう残っている。"}, {"t": 1594.0333333333333, "x": "光クラブがなくなっても、\n同じ形のものは続いてたのね。"}, {"t": 1597.9166666666667, "x": "そういう報告だ。"}, {"t": 1599.1, "x": "そして2年後、ある議員がこの流れに名前を付ける。"}, {"t": 1602.8833333333334, "x": "1952年4月22日。"}, {"t": 1605.2333333333333, "x": "衆議院の通商産業委員会。"}, {"t": 1607.2666666666667, "x": "社会党の議員が、中小企業の\nお金の問題を取り上げた。"}, {"t": 1610.9, "x": "その中でこう言っている。"}, {"t": 1612.3666666666666, "x": "光クラブを最初のスタートとする\n全国のヤミ金融会社が、次から次へと生まれた。"}, {"t": 1617.55, "x": "それが国民に与えた被害は、ばく大なものだ、と。"}, {"t": 1620.9666666666667, "x": "最初のスタート。光クラブが始まりってこと？"}, {"t": 1624.0833333333333, "x": "議員はそう呼んだ。"}, {"t": 1625.2166666666667, "x": "本当に最初だったかどうかは、別の話だ。"}, {"t": 1628.15, "x": "3月の朝日新聞には、光クラブより\n前の摘発が出ていたからな。"}, {"t": 1632.7166666666667, "x": "そうよね。16年ぶりの摘発って記事があったわね。"}, {"t": 1636.1833333333334, "x": "それでも国会では、光クラブが\n始まりの名前として語られた。"}, {"t": 1640.1833333333334, "x": "いちばん名前が知られていた、ということだ。"}, {"t": 1642.6833333333334, "x": "さらに2年後の1954年2月1日。"}, {"t": 1645.65, "x": "衆議院の行政監察特別委員会。"}, {"t": 1648.2166666666667, "x": "保全経済会という団体が問題になっていた。"}, {"t": 1651.25, "x": "保全経済会？"}, {"t": 1652.5, "x": "お金を集めて配当を約束し、\nそれが払えなくなった団体だ。"}, {"t": 1656.4666666666667, "x": "その顧問だった人が、証人として呼ばれている。"}, {"t": 1659.5, "x": "証人はこう言った。"}, {"t": 1660.7333333333333, "x": "当時はたぶん、光クラブのような\n似た機関があったと思う。"}, {"t": 1664.1333333333334, "x": "でも保全経済会のような機関は、なかったと思う、と。"}, {"t": 1667.75, "x": "自分たちは光クラブとは違う、って言ってるの？"}, {"t": 1670.7333333333333, "x": "そう読める答えだ。比べる\n相手が、5年前の光クラブだった。"}, {"t": 1674.7, "x": "この年の6月23日、新しい法律ができる。"}, {"t": 1678.1833333333334, "x": "出資の受入れ、\n預り金及び金利等の取締りに関する法律。"}, {"t": 1682.3666666666666, "x": "いまでも出資法と呼ばれて、使われている法律だ。"}, {"t": 1685.6166666666666, "x": "いまも？"}, {"t": 1686.35, "x": "いまもだ。一般の人から預り金のように\nお金を集めることを、この法律は禁じている。"}, {"t": 1691.8333333333333, "x": "光クラブのあとに、ようやくできた線引きなのね。"}, {"t": 1695.0333333333333, "x": "光クラブのためだけに、できた法律ではない。"}, {"t": 1697.9166666666667, "x": "ただその手前に光クラブの名前が何度も出てくる。"}, {"t": 1701.6666666666667, "x": "名前が残ったのは、国会だけではない。"}, {"t": 1704.15, "x": "1950年ある小説が雑誌の新潮で連載される。"}, {"t": 1707.75, "x": "題は『青の時代』。"}, {"t": 1709.0833333333333, "x": "書いたのは三島由紀夫だ。"}, {"t": 1710.7666666666667, "x": "あの三島由紀夫？"}, {"t": 1712.0, "x": "そうだ。単行本の「序」でこの事件を\nモデルにしたと書いている。"}, {"t": 1715.95, "x": "保阪さんによると、書き始めたのは1949年12月。"}, {"t": 1720.25, "x": "社長が亡くなった、翌月のことだ。"}, {"t": 1722.8166666666666, "x": "すぐ小説にしたのね。"}, {"t": 1724.5, "x": "ほかにもこの事件をもとにした小説はいくつもある。"}, {"t": 1727.5333333333333, "x": "のちに映画になった推理小説\n『白昼の死角』もその1つだ。"}, {"t": 1731.8833333333334, "x": "それだけみんなが気になる話だったのね。"}, {"t": 1734.5, "x": "保阪さんは日付のことも書いている。"}, {"t": 1736.7166666666667, "x": "山崎が亡くなったのは、1949年の11月25日。"}, {"t": 1741.25, "x": "三島由紀夫が亡くなったのは、1970年の11月25日。"}, {"t": 1745.9166666666667, "x": "同じ日付なの？"}, {"t": 1747.2333333333333, "x": "同じ日付だ。保阪さんはこの一致を\n本の中で取り上げている。"}, {"t": 1751.0166666666667, "x": "意味があるかどうかを、この回で言うつもりはない。"}, {"t": 1753.6333333333334, "x": "日付が同じだという事実だけを置いておく。"}, {"t": 1756.25, "x": "……偶然かどうかは、言わないのね。"}, {"t": 1758.3666666666666, "x": "言わない。言える材料が無いからな。"}, {"t": 1760.4, "x": "ただ小説の中の社長はもう\n一度、物語の主役になった。"}, {"t": 1764.3333333333333, "x": "394人の名前は、どこにも出てこないままだ。"}, {"t": 1768.3333333333333, "x": "当時の大人たちは、この件をどう見てたの？"}, {"t": 1771.0833333333333, "x": "社説が残っている。"}, {"t": 1772.45, "x": "11月27日の夕刊読売の社説は、\n題が「戦後派の悲劇」。"}, {"t": 1777.15, "x": "どこか思いつめたところがあり、\n心のゆとりがなさすぎる。"}, {"t": 1780.5666666666666, "x": "そう書いている。"}, {"t": 1781.6333333333334, "x": "戦後派って言葉が、ここでも出てくるのね。"}, {"t": 1784.4, "x": "当時は「アプレゲール」という言い方もした。"}, {"t": 1787.0333333333333, "x": "戦後に育った若い人の、新しい考え方を指す言葉だ。"}, {"t": 1790.8833333333334, "x": "この事件はその代表のように扱われた。"}, {"t": 1793.4, "x": "東京タイムズの社説は、別の本と重ねて論じている。"}, {"t": 1796.9333333333334, "x": "その年の10月に\n出たばかりの『きけ わだつみのこえ』だ。"}, {"t": 1800.8333333333333, "x": "戦争で亡くなった学生たちの、\n手紙や日記を集めた本よね。"}, {"t": 1804.9, "x": "そうだ。同じ学徒出陣の世代として並べたわけだ。"}, {"t": 1808.4833333333333, "x": "戦争から帰ってきた学生の、もう1つの姿ってことね。"}, {"t": 1812.4333333333334, "x": "社説の言い方は、そういう並べ方だった。"}, {"t": 1815.15, "x": "週刊誌のサンデー毎日は、もっと厳しい。"}, {"t": 1817.8166666666666, "x": "少しの良心のとがめもなくやってのけた。"}, {"t": 1820.4, "x": "そこに今の若者と、今の教育の正体が\n出ている、と書いた。"}, {"t": 1824.5, "x": "若い人全体のせいにしてるのね。"}, {"t": 1826.8333333333333, "x": "一方で朝日新聞の署名記事は、\n少し違う書き方をした。"}, {"t": 1830.6666666666667, "x": "暗い現実に本当のものを探した、\n不完全な理想主義者だったかもしれない。"}, {"t": 1835.5333333333333, "x": "同じ人なのに、見方が真逆ね。"}, {"t": 1837.95, "x": "週刊朝日は7月の時点で、\nレッテルで済ませるなと書いていた。"}, {"t": 1841.9333333333334, "x": "それでも世間は、戦後派という言葉で片付けていった。"}, {"t": 1845.3, "x": "翌年には、ある評論家が人が自ら命を\n絶つことを論じた本を出している。"}, {"t": 1850.0666666666666, "x": "その中でこの件は戦後の一現象として見るだけでは\n片が付かない、と書いた。"}, {"t": 1854.8666666666666, "x": "片付けるなって言う人も、ちゃんといたのね。"}, {"t": 1857.6333333333334, "x": "いた。ただ数としては少なかった。"}, {"t": 1860.0, "x": "394人の側の話は、社説には出てこないの？"}, {"t": 1863.7833333333333, "x": "今回見た範囲では、ほとんど出てこない。"}, {"t": 1866.25, "x": "語られたのは、ほとんどが社長1人の人物像だ。"}, {"t": 1869.6166666666666, "x": "お金を出した人たちのことは、置いていかれたのね。"}, {"t": 1872.7833333333333, "x": "そういう記録の残り方をしている。"}, {"t": 1875.4833333333333, "x": "ちょっと整理させて。"}, {"t": 1876.6, "x": "1年あまりで、何が起きたんだっけ。"}, {"t": 1879.1333333333334, "x": "並べてみよう。"}, {"t": 1880.1, "x": "1948年10月16日。"}, {"t": 1882.6833333333334, "x": "中野の鍋屋横丁で、元手1万5000円で始める。"}, {"t": 1886.2166666666667, "x": "10月22日。新聞の隅に三行の広告を出す。"}, {"t": 1889.8333333333333, "x": "12月18日。9原則の指令が出て、金づまりが始まる。"}, {"t": 1894.1, "x": "1949年の1月から2月。"}, {"t": 1896.7333333333333, "x": "銀座の松屋の裏に、事務所を構える。"}, {"t": 1899.2, "x": "5月31日。貸金業の届け出を\n決めた法律が施行される。"}, {"t": 1903.4833333333333, "x": "6月。「日本唯一の金融株式会社」と広告を打つ。"}, {"t": 1907.4, "x": "7月4日。物価統制令違反の疑いで、\n京橋署に留置される。"}, {"t": 1911.8, "x": "8月。釈放される。起訴はされていない。"}, {"t": 1914.5833333333333, "x": "9月。394人から、約3000万円の返済を求められる。"}, {"t": 1919.1333333333334, "x": "11月24日の夜。社長室で命を\n絶ち、亡くなったのは25日だ。"}, {"t": 1924.2166666666667, "x": "摘発から数えると、どのくらいなの？"}, {"t": 1926.7666666666667, "x": "7月4日から11月25日まで、144日だ。"}, {"t": 1930.8166666666666, "x": "5か月もないのね。"}, {"t": 1932.25, "x": "店を開いてから数えても、1年と1か月あまりだ。"}, {"t": 1935.7666666666667, "x": "その間に元手が1万5000円から\n数千万円になったのね。"}, {"t": 1939.6666666666667, "x": "新聞の数字では、そうなる。"}, {"t": 1941.5666666666666, "x": "そして最後に残った記録は、通帳の2700円だ。"}, {"t": 1945.3166666666666, "x": "上がるのも下がるのも、早すぎるわね。"}, {"t": 1947.7666666666667, "x": "集めたお金で集めたお金を払う\n形は、止まったときが早い。"}, {"t": 1951.6666666666667, "x": "1950年の国会の報告にあった、\n名古屋の話も同じ形だった。"}, {"t": 1956.6666666666667, "x": "集まっているうちは回る。"}, {"t": 1958.0333333333333, "x": "止まったら一気に崩れる。"}, {"t": 1959.7833333333333, "x": "この1年あまりは、その形をそのまま見せている。"}, {"t": 1963.5166666666667, "x": "ここでこの回で避けたことをまとめておく。"}, {"t": 1966.0666666666666, "x": "うん。聞かせて。"}, {"t": 1967.2833333333333, "x": "まず専務の名前を出していない。"}, {"t": 1969.1166666666666, "x": "当時25歳の医大生で、\nいまの生死を確かめられなかった。"}, {"t": 1972.9333333333334, "x": "専務がどこまで何をしたかにも、触れていない。"}, {"t": 1975.7, "x": "会社に泊まっていて、社長を見つけた\n社員の名前も出していない。"}, {"t": 1979.6166666666666, "x": "社長のご家族のことも、ほとんど言わなかったわね。"}, {"t": 1982.7833333333333, "x": "父親が市長だったことまでにした。"}, {"t": 1985.0, "x": "当時の新聞には、\n社長の身の回りの女性の話も出ている。"}, {"t": 1988.75, "x": "それも扱わなかった。お金の話とは別のことだからだ。"}, {"t": 1992.4666666666667, "x": "それから亡くなり方の話。"}, {"t": 1994.3166666666666, "x": "何を使ったかも、細かい時刻も言っていない。"}, {"t": 1997.3, "x": "遺書の中身も、結びの形だけだったわね。"}, {"t": 2000.2833333333333, "x": "遺書を名言のように扱うのは、やめておいた。"}, {"t": 2003.0166666666667, "x": "最後に7月の新聞が書いていた疑いのいくつか。"}, {"t": 2006.2, "x": "あとで確かめた資料が無いものは、言っていない。"}, {"t": 2009.1166666666666, "x": "社長本人のことも、有罪とは言ってないのよね。"}, {"t": 2012.3, "x": "言っていない。7月の件は起訴されていないからだ。"}, {"t": 2015.3666666666666, "x": "有罪と言えるのは、終戦直後の食料の件だけだ。"}, {"t": 2018.8333333333333, "x": "言えることと、言えないことを分けたのね。"}, {"t": 2021.2833333333333, "x": "分けた。分けると残る話は思ったより少ない。"}, {"t": 2024.3166666666666, "x": "でもその少ない話の中に394人がいる。"}, {"t": 2028.2833333333333, "x": "ねえ。最後にひとつ聞いていい？"}, {"t": 2030.2666666666667, "x": "なんだ。"}, {"t": 2031.0, "x": "394人の人たちは、どうして\n光クラブにお金を預けたのかしら。"}, {"t": 2035.7833333333333, "x": "銀行が貸してくれない時代だった。"}, {"t": 2037.9166666666667, "x": "手元のお金を、少しでも増やしたい人がいた。"}, {"t": 2040.8833333333334, "x": "そこへ銀座の住所で、増やしますという広告が出た。"}, {"t": 2044.2333333333333, "x": "……私でもちょっと気になるかも。"}, {"t": 2046.2, "x": "そういう人が、394人いたということだ。"}, {"t": 2049.366666666667, "x": "その人たちの名前は、どの記事にも出てこない。"}, {"t": 2052.266666666667, "x": "戻ったお金の額も、今回は見つけられなかった。"}, {"t": 2055.5333333333333, "x": "残ったのは社長の名前と、通帳の2700円なのね。"}, {"t": 2059.366666666667, "x": "それと国会の速記録に残った野次ひとつだ。"}, {"t": 2062.3, "x": "「光クラブだ」。"}, {"t": 2063.5, "x": "中身のない樽の、高い音。"}, {"t": 2065.5833333333335, "x": "そういう意味で飛んだのかどうかは、記録には無い。"}, {"t": 2068.3, "x": "ただいまでも似た言葉は新聞やネットで見かける。"}, {"t": 2071.15, "x": "元本は保証。毎月、高い配当。"}, {"t": 2073.85, "x": "……見たことあるわ。"}, {"t": 2074.983333333333, "x": "そういう文句を見かけたら、\n1949年の銀座を思い出してほしい。"}, {"t": 2079.483333333333, "x": "松屋の裏の学生の会社のことをな。"}, {"t": 2081.9666666666667, "x": "394人のほうを、ね。"}, {"t": 2084.133333333333, "x": "そうだ。今回の話はここまでだ。"}, {"t": 2086.45, "x": "あなたが当時の記事やその後の記録を\n知っていたら、コメント欄に書き残してくれ。"}, {"t": 2091.15, "x": "394人のその後を埋められるのは、\nそういう記録だけだからな。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
