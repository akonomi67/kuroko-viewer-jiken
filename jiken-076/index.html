<script>
const D={"name": "076", "file": "076_編集用", "dur": 2207.8833125, "segs": [], "subs": [{"t": 0.0, "x": "1995年、平成7年3月30日の朝。"}, {"t": 3.9, "x": "東京都荒川区。"}, {"t": 5.166666666666667, "x": "出勤のため自宅マンションを出た男性が、\n待ち伏せしていた男にけん銃で撃たれた。"}, {"t": 10.116666666666667, "x": "撃たれたのは、國松孝次警察庁長官。"}, {"t": 12.966666666666667, "x": "日本の警察の、いちばん上にいる人だ。"}, {"t": 15.733333333333333, "x": "警察のトップが、撃たれたの？"}, {"t": 17.85, "x": "そうだ。4発撃たれて、3発が当たった。重傷だった。"}, {"t": 21.65, "x": "犯人はその場から自転車で\n逃げて、いまも分かっていない。"}, {"t": 25.016666666666666, "x": "2010年3月30日、この事件は公訴時効を迎えた。"}, {"t": 28.95, "x": "そして2025年3月30日で、発生から30年が経った。"}, {"t": 33.583333333333336, "x": "三十年。"}, {"t": 34.5, "x": "この事件については、本も、番組も、たくさんある。"}, {"t": 37.75, "x": "誰が撃ったのか。あの説、この説。"}, {"t": 40.333333333333336, "x": "だが、この回でやるのはそれではない。"}, {"t": 42.55, "x": "私が使うのは、国会に残された記録だけだ。"}, {"t": 45.733333333333334, "x": "国会会議録、質問主意書と\n政府の答弁書、そして警察白書。"}, {"t": 50.46666666666667, "x": "そんなに残っているのね。"}, {"t": 52.166666666666664, "x": "残っている。それどころか、国会は\nこの事件のために特別な会を開いている。"}, {"t": 57.0, "x": "1996年10月31日、参議院の地方行政委員会。"}, {"t": 61.666666666666664, "x": "「警察庁長官狙撃事件の捜査状況について」という、\nこの件だけを議題にした打合会だ。"}, {"t": 67.73333333333333, "x": "そしてその席に、説明する側として\n座っていたのは、撃たれた本人だった。"}, {"t": 72.66666666666667, "x": "撃たれた本人が、説明する側に？"}, {"t": 75.16666666666667, "x": "そうだ。"}, {"t": 75.8, "x": "先に断っておく。この事件の犯人は、\n今も特定されていない。"}, {"t": 79.95, "x": "だから、誰かを実行犯として\n名指しすることは一切しない。"}, {"t": 83.6, "x": "「自分が撃った」と供述した人が\n実際にいるが、その名前も出さない。"}, {"t": 87.96666666666667, "x": "私が追うのは、犯人探しではない。"}, {"t": 90.36666666666666, "x": "警察のいちばん上が撃たれたあと、\n警察の中で何が起きていたのか。"}, {"t": 94.55, "x": "それが、国会の記録にそのまま残っている。"}, {"t": 97.98333333333333, "x": "翌年に出た平成8年の警察白書に、こう書かれている。"}, {"t": 101.83333333333333, "x": "「平成7年3月30日午前8時30分ころ、"}, {"t": 105.25, "x": "國松孝次警察庁長官が、"}, {"t": 107.36666666666666, "x": "出勤のため東京都荒川区所在の自宅マンションを\n出たところを、"}, {"t": 111.13333333333334, "x": "同マンション付近で待ち伏せしていた男にけん銃で\n狙撃され、重傷を負うという事件が発生した」"}, {"t": 116.98333333333333, "x": "待ち伏せ。"}, {"t": 117.86666666666666, "x": "偶然すれ違ったのではない。待っていた。"}, {"t": 120.36666666666666, "x": "同じ白書は、この事件を「\n警察組織の最高責任者の殺害を狙った\n極めて重大な犯罪」と位置づけている。"}, {"t": 127.61666666666666, "x": "殺害を狙った。警察庁が自分でそう書いている。"}, {"t": 130.78333333333333, "x": "では、現場で何が起きたのか。"}, {"t": 132.78333333333333, "x": "事件から2週間後、\n1995年4月13日の参議院地方行政委員会。"}, {"t": 138.3, "x": "説明したのは、杉田和博警備局長だ。"}, {"t": 141.31666666666666, "x": "「犯人は、出勤時の長官を待ち伏せまして、"}, {"t": 144.08333333333334, "x": "二十数メートル離れた場所から"}, {"t": 146.06666666666666, "x": "四発発射をいたしまして、そのうち三発を\n命中させ國松長官に重傷を負わせた後、"}, {"t": 151.25, "x": "近くにとめてあった黒っぽい自転車で逃走した」"}, {"t": 154.26666666666668, "x": "「ことは判明しておりますけれども、\nいまだ犯人の特定には至っておりません」"}, {"t": 158.86666666666667, "x": "二十数メートルって、けっこう遠いわよね？"}, {"t": 161.48333333333332, "x": "遠い。その距離から4発撃って、3発当てている。"}, {"t": 164.75, "x": "同じ日の衆議院の委員会で、ある委員が\nこう言っている。"}, {"t": 167.91666666666666, "x": "「二十数メーターから\n数発命中させるということからすれば随分と\nプロらしき者がやったのではないか」"}, {"t": 173.63333333333333, "x": "警察庁の刑事局長の答えは、犯人の割り出しには\n至っていない、というものだった。"}, {"t": 178.83333333333334, "x": "捜査本部は、その自転車を\n探すところから始まっている。"}, {"t": 183.03333333333333, "x": "この事件を見るには、10日前に戻る必要がある。"}, {"t": 186.1, "x": "1995年3月20日。"}, {"t": 188.36666666666667, "x": "地下鉄サリン事件だ。"}, {"t": 189.93333333333334, "x": "朝のラッシュの地下鉄で猛毒のサリンが\nまかれ、多くの人が亡くなり、\n5千人を超える人が被害を受けた。"}, {"t": 196.3, "x": "あの事件の、たった十日後なのね。"}, {"t": 198.6, "x": "そうだ。しかも、その間にも動きがある。"}, {"t": 201.26666666666668, "x": "3月22日、警察はオウム真理教の施設に\n一斉に強制捜査に入っている。"}, {"t": 206.36666666666667, "x": "山梨県の上九一色村を含む、全国の拠点だ。"}, {"t": 209.9, "x": "日本じゅうが緊張の頂点にあった、\nその最中の事件だった。"}, {"t": 213.7, "x": "事件から4日後、4月3日の参議院予算委員会。"}, {"t": 217.06666666666666, "x": "村山富市総理大臣が、こう答弁している。"}, {"t": 220.03333333333333, "x": "「治安の最高責任者を\n狙撃するなどというようなことは、これは\nいまだかつてなかったことなんです」"}, {"t": 225.6, "x": "「日本ぐらい治安の維持がされた安全な"}, {"t": 227.61666666666667, "x": "国はないということを誇りに\n思っておりましたけれども、\nこんな事件がございまして世界に衝撃を与えて」"}, {"t": 233.55, "x": "「私はやっぱり名誉を回復するためにも、これは"}, {"t": 236.46666666666667, "x": "何としてもこの事件だけは犯人を検挙して再発を\n絶対に防ぐということが与えられた最大の課題だ」"}, {"t": 242.63333333333333, "x": "総理が、名誉って言葉を使っているのね。"}, {"t": 245.38333333333333, "x": "使っている。"}, {"t": 246.25, "x": "当時の野中広務国家公安委員長も、\n同じ月の委員会でこう言っている。"}, {"t": 250.71666666666667, "x": "「警察をある意味においては"}, {"t": 252.18333333333334, "x": "あざけり笑うように、あるいは法秩序に\n対する挑戦でもあろうかと考えまして、"}, {"t": 256.43333333333334, "x": "重大な認識を持っておるわけでございます」"}, {"t": 259.1, "x": "あざけり笑うように。"}, {"t": 260.28333333333336, "x": "警察を管理する側が、国会で\nそういう言葉を使っている。"}, {"t": 264.56666666666666, "x": "最初に問題になったのは、犯人ではなかった。"}, {"t": 267.56666666666666, "x": "なぜ、警察庁長官が無防備だったのか、だ。"}, {"t": 270.73333333333335, "x": "警護がついていなかったの？"}, {"t": 272.48333333333335, "x": "ＳＰはついていなかった。"}, {"t": 274.0833333333333, "x": "4月20日の衆議院予算委員会で、ある委員が\nこう述べている。"}, {"t": 277.78333333333336, "x": "「アメリカの連邦捜査局、ＦＢＩの長官は、"}, {"t": 280.6166666666667, "x": "就任と同時に住所を変えて、どこに\n住んでいるかは国家秘密として秘匿される」"}, {"t": 285.46666666666664, "x": "「そういうものに比べれば、我が国の場合は、"}, {"t": 287.9, "x": "警察の頂点に立つ者が官舎でもないし、\nマンションの一室に住んで\nほとんど無防備の状態である」"}, {"t": 293.6666666666667, "x": "「おまけに、撃たれたときにはＳＰもついていない」"}, {"t": 296.5833333333333, "x": "えっ。"}, {"t": 297.21666666666664, "x": "委員はさらにこう続ける。"}, {"t": 298.71666666666664, "x": "「長官の住むマンションには"}, {"t": 300.95, "x": "無線も整備されていないというふうに"}, {"t": 301.85, "x": "聞いておりますが、このようなことで一国の治安を\nしっかりと守ることができるものかどうか」"}, {"t": 306.9, "x": "これに、野中国家公安委員長が答えている。"}, {"t": 309.76666666666665, "x": "「国民の治安を守るもののトップにある者がこういう\n事犯に襲われたということにつきまして厳粛に"}, {"t": 315.25, "x": "受けとめますとともに、深刻な反省と\nそしてとらまえ方をしておる次第でございます」"}, {"t": 320.21666666666664, "x": "深刻な反省。否定はしていない。"}, {"t": 322.5, "x": "この点は、3年後にもう一度、文書で確認されている。"}, {"t": 326.1333333333333, "x": "1998年、保坂展人議員が質問主意書を出した。"}, {"t": 330.23333333333335, "x": "議員が政府に文書で質問し、政府が\n閣議決定した文書で答える仕組みだ。"}, {"t": 335.15, "x": "口で答えるのとは違うのね。"}, {"t": 337.1166666666667, "x": "違う。内閣総理大臣の名前で\n返ってくる、公式の回答文書になる。"}, {"t": 341.75, "x": "このときの答弁書は、平成10年9月4日付。"}, {"t": 344.9, "x": "内閣総理大臣の名前で出されている。"}, {"t": 347.4, "x": "「警戒の強化を図っていたにもかかわらず、"}, {"t": 349.76666666666665, "x": "結果的に事件の発生をみたことについては、"}, {"t": 352.48333333333335, "x": "警戒方法等が犯行を防ぎ得るものでなく、\nその間隙をつかれたと承知している」"}, {"t": 357.51666666666665, "x": "防ぎ得るものでなかった。"}, {"t": 358.93333333333334, "x": "政府が、文書でそう認めている。"}, {"t": 361.76666666666665, "x": "捜査本部は、荒川区の南千住警察署に置かれた。"}, {"t": 365.3, "x": "ここに、あとで大きな意味を持つことが一つある。"}, {"t": 368.15, "x": "この特別捜査本部の本部長は、\n警視庁の公安部長だった。"}, {"t": 372.25, "x": "公安部？　人が撃たれた事件よね？"}, {"t": 374.6166666666667, "x": "そこだ。"}, {"t": 375.3, "x": "人が撃たれた事件は、ふつうは\n刑事部の捜査一課が中心になる。"}, {"t": 379.25, "x": "だがこの事件では、公安部長が本部長になった。"}, {"t": 382.3666666666667, "x": "1998年の質問主意書でも、そこが問われている。"}, {"t": 386.3666666666667, "x": "「本来強行事件の捜査に\n当たる刑事部の捜査一課などが\n中心にならなかったのはなぜか。"}, {"t": 391.48333333333335, "x": "初期段階で、公安事件と判断する要素があったのか」"}, {"t": 395.05, "x": "「警視庁において、当時の治安情勢等を踏まえ、"}, {"t": 397.8, "x": "総合的に判断した結果、公安、"}, {"t": 400.15, "x": "刑事両部門が合同して公安部長を長とする\n特別捜査本部を設置し、捜査を推進してきた」"}, {"t": 406.1166666666667, "x": "合同ではある。ただし、長は公安部長。"}, {"t": 408.65, "x": "警察白書にも、南千住警察署に公安部長を長とする\n特別捜査本部を設置した、と書かれている。"}, {"t": 415.3833333333333, "x": "どうしてそこが大事なのかしら。"}, {"t": 417.4, "x": "公安部は、情報を外に出さないことを\n前提に動く部門だからだ。"}, {"t": 421.4, "x": "秘密を守ることが、仕事の一部になっている。"}, {"t": 424.3333333333333, "x": "その部門が、人が撃たれた事件の捜査を仕切った。"}, {"t": 427.51666666666665, "x": "ただ、この事件では、その仕組みが\n後で問題として表に出てくる。"}, {"t": 431.68333333333334, "x": "30年後の2025年、日本経済新聞は\n当時の警察幹部の言葉を伝えている。"}, {"t": 437.1666666666667, "x": "「部門間の壁があり、\n最大限の捜査をし尽くしたとは言いがたい」"}, {"t": 441.6333333333333, "x": "4月27日の参議院地方行政委員会で、\n杉田警備局長がこう報告している。"}, {"t": 447.06666666666666, "x": "「犯人の人相着衣、逃走方向等については、これまで\n二百件以上の目撃情報等が寄せられておりまして、"}, {"t": 453.55, "x": "現在その裏づけ捜査を\n実施しているところでございます」"}, {"t": 457.06666666666666, "x": "二百件？"}, {"t": 457.93333333333334, "x": "二百件以上だ。朝の8時半、\n通勤時間帯の出来事だからな。"}, {"t": 462.23333333333335, "x": "一方、銃については、こうだ。"}, {"t": 464.28333333333336, "x": "「銃につきまして今申し上げられますことは、\n三十八口径の回転式であるということだけで」"}, {"t": 469.8333333333333, "x": "どこの製品かも特定できていない。"}, {"t": 472.05, "x": "翌1996年3月には、週刊誌が\n弾の種類について書いた。"}, {"t": 476.85, "x": "これも杉田警備局長がはっきり否定している。"}, {"t": 479.71666666666664, "x": "「一部にプラスチック弾ではないかというような\n記事もございましたけれども、"}, {"t": 483.53333333333336, "x": "少なくともプラスチック弾であるというようなことを\n思わせるものは全くございません」"}, {"t": 488.3833333333333, "x": "情報はあるのに、絞れていないのね。"}, {"t": 490.75, "x": "そうだ。二百件以上の目撃情報があって、\n犯人にたどり着かない。"}, {"t": 495.06666666666666, "x": "この時期、もう一つ\n動いていたことがある。銃の法律だ。"}, {"t": 498.6333333333333, "x": "事件の直後、国会では\n銃刀法の改正案が審議されていた。"}, {"t": 502.55, "x": "けん銃を撃つこと自体を新しく\n罪にする、発射罪の新設が入っていた。"}, {"t": 507.1333333333333, "x": "ある委員は、審議の場でこう述べている。"}, {"t": 509.3833333333333, "x": "「三月二十九日の夕刻に、警察庁当局から、"}, {"t": 512.65, "x": "今回の銃砲刀剣類所持等取締法の改正についての\n考え方を聴取しておったところであります。その翌朝、"}, {"t": 519.5833333333334, "x": "警察庁長官國松さんが狙撃された」"}, {"t": 522.5166666666667, "x": "説明を受けた、その次の朝に。"}, {"t": 524.85, "x": "そうだ。銃の取り締まりを強めようとしていた\n朝に、その責任者が撃たれた。"}, {"t": 530.0666666666667, "x": "ここから、この事件はまったく別の顔を見せ始める。"}, {"t": 533.3166666666667, "x": "1996年10月。事件から1年半が過ぎていた。"}, {"t": 537.4333333333333, "x": "都内の報道機関に、一通の投書が届く。"}, {"t": 540.3166666666667, "x": "内容はこうだ。長官を撃ったのは\n警視庁の警察官である。"}, {"t": 543.9333333333333, "x": "その警察官はすでに犯行を自供している。\nしかし警視庁は捜査をしていない。"}, {"t": 548.7333333333333, "x": "警察官が撃った、と書いてあったのね。"}, {"t": 551.3333333333334, "x": "そう書いてあった。そして、これが報道される。"}, {"t": 554.1666666666666, "x": "10月31日、参議院の地方行政委員会が、\nこの件だけを議題にした打合会を開いた。"}, {"t": 560.3333333333334, "x": "会議録に載っている議題は、たった一行。"}, {"t": 562.8, "x": "「警察庁長官狙撃事件の捜査状況について」"}, {"t": 566.05, "x": "出席したのは、国家公安委員長、\n警察庁の警備局長、そして警察庁長官その人だ。"}, {"t": 572.25, "x": "この日、倉田寛之国家公安委員長が、\n経緯を報告している。"}, {"t": 576.35, "x": "「本年三月中旬、地下鉄サリン事件等で\n公判中のオウム真理教幹部信者が、"}, {"t": 581.3166666666667, "x": "当該警察官が長官狙撃事件に関与している可能性を\n示唆するとも受け取れる供述を行ったため、"}, {"t": 587.4, "x": "四月上旬から同人に対する\n事情聴取を始めたものであります」"}, {"t": 591.4166666666666, "x": "「当該警察官は、当初、"}, {"t": 593.15, "x": "事件への関与を否定しておりましたが、\n繰り返し事情を聞いたところ、"}, {"t": 597.0666666666667, "x": "五月初めごろになって初めて本事件の犯行を\n自認する供述をするに至ったものであります」"}, {"t": 602.8, "x": "五月？　それって、この年の五月よね？"}, {"t": 605.5666666666667, "x": "1996年の5月だ。"}, {"t": 607.7, "x": "投書が届いたのは10月。"}, {"t": 609.45, "x": "この時点で、供述から5か月が経っていた。"}, {"t": 612.9333333333333, "x": "その警察官は、当時、警視庁の巡査長だった。"}, {"t": 616.3166666666667, "x": "オウム真理教の信者でもあった。"}, {"t": 618.2, "x": "ここから先、私はこの人を「元巡査長」とだけ呼ぶ。"}, {"t": 622.1666666666666, "x": "名前は言わないのね。"}, {"t": 623.55, "x": "言わない。起訴されていないし、\n実行犯だと認定されてもいないからだ。"}, {"t": 627.7166666666667, "x": "倉田国家公安委員長の報告は、こう続く。"}, {"t": 630.6833333333333, "x": "「当該警察官の供述は"}, {"t": 632.5, "x": "犯行を自認する点において変化はないものの、事件に\nかかわるその余の自己の行動についてはあいまいな"}, {"t": 637.9, "x": "点や矛盾が多く、供述内容も目まぐるしく\n変遷するなど、その真偽ははっきりしておりません」"}, {"t": 643.6333333333333, "x": "自分が撃った、という一点は変わらない。"}, {"t": 646.0, "x": "だが、それ以外の話がぐらぐら動く。"}, {"t": 648.6, "x": "どっちなのか分からない、ということね。"}, {"t": 650.95, "x": "警察も分からなかった、ということだ。"}, {"t": 653.3666666666667, "x": "「自分が撃ったと供述しながらも\n供述の真偽がはっきりしないことや、"}, {"t": 657.3, "x": "精神的に極めて不安定な\n状況にあると認められたため、\n本人の同意を得た上で保護下に置き、"}, {"t": 662.95, "x": "事情聴取を進めているところであります」"}, {"t": 665.4833333333333, "x": "保護下に置く。逮捕ではない。"}, {"t": 667.2833333333333, "x": "のちの説明によれば、本人が、\n自分の居場所や供述したことが外に\n知られるのを強く恐れていたという。"}, {"t": 673.6666666666666, "x": "そして倉田国家公安委員長は、\nこの日、こう言い切っている。"}, {"t": 677.3, "x": "「現職警察官が警察庁長官狙撃事件の犯行を\n自認する供述をしていることは、"}, {"t": 682.5833333333334, "x": "全国の警察に対する国民の信頼に\nかかわる重大な問題であり、"}, {"t": 686.7666666666667, "x": "今捜査当局に求められるのは\n事案の徹底究明であると考えております」"}, {"t": 691.45, "x": "国民の信頼。"}, {"t": 692.7166666666667, "x": "この言葉が、この日から何度も\n繰り返されることになる。"}, {"t": 696.7, "x": "供述があったのは1996年5月。この回で、\nいちばん引っかかるのはここだ。"}, {"t": 702.1333333333333, "x": "では、警察庁がそれを知ったのはいつか。"}, {"t": 704.8166666666667, "x": "すぐじゃないの？"}, {"t": 705.9, "x": "10月15日だ。"}, {"t": 707.35, "x": "五か月も後？"}, {"t": 708.55, "x": "しかも、報道機関に投書が届いたあとだった。"}, {"t": 711.5166666666667, "x": "10月31日、杉田警備局長が説明している。"}, {"t": 715.2, "x": "「本月の十五日に警視庁より、"}, {"t": 717.15, "x": "一部都内の報道機関に対して投書があったと、"}, {"t": 720.05, "x": "投書の中に、いわゆる現職警察官が\n長官狙撃事件について自供しておるけれども警視庁は"}, {"t": 725.4833333333333, "x": "捜査をしていないということでありましたが」"}, {"t": 728.1333333333333, "x": "「そういう事実については、\nまず供述をした事実はある、"}, {"t": 731.25, "x": "取り調べをした事実はある、そういうような\n報告を受けたところでございます」"}, {"t": 735.6, "x": "「重大な事柄であるだけに早期の解明が\n求められるわけでありまして、できるだけ"}, {"t": 740.4, "x": "早く報告を上げるべき事案であったと\n認識をいたしております」"}, {"t": 743.85, "x": "上げるべきだった。警察庁の局長が、\n国会でそう述べている。"}, {"t": 747.7666666666667, "x": "この日、撃たれた本人である\n國松長官も発言している。"}, {"t": 751.4333333333333, "x": "「国民の疑惑を払拭し警察に\n対する信頼を回復するためには、"}, {"t": 755.4666666666667, "x": "事の真偽を一刻も早く明らかにする必要がございます」"}, {"t": 759.2666666666667, "x": "撃たれた本人が、そう言っているのね。"}, {"t": 761.6833333333333, "x": "翌月、11月27日の参議院決算委員会では、\nもう少し踏み込んでいる。"}, {"t": 766.95, "x": "「現職警察官が警察庁長官を撃ったという\n自供をしたことにつきましては報告がなかったのは"}, {"t": 772.7333333333333, "x": "事実でございます」"}, {"t": 773.7666666666667, "x": "「若干不確かで\n判断がしにくいところがあったにしても、\nそれはもう少し早く"}, {"t": 778.35, "x": "報告があってしかるべきではなかったのかなという\n感じは今でも持っております」"}, {"t": 782.5166666666667, "x": "撃たれた長官が、自分の組織に\n向かって、そう言っている。"}, {"t": 786.75, "x": "元巡査長は、使ったけん銃をどうしたのか。"}, {"t": 789.6, "x": "捨てた、と供述していた。"}, {"t": 791.3, "x": "場所は、水道橋付近の神田川。"}, {"t": 793.85, "x": "川に捨てたのね。"}, {"t": 795.1833333333333, "x": "そうだ。だから警視庁は、神田川を捜索した。"}, {"t": 798.3666666666667, "x": "ただし、それは1996年10月。"}, {"t": 801.2, "x": "供述から5か月後のことだ。"}, {"t": 803.2, "x": "10月31日の打合会。ある委員は、自分が\nスキューバダイビングをやると前置きしてこう述べた。"}, {"t": 809.25, "x": "「この四日間ぐらいのあの神田川の\nどぶさらいを見ていたら何か"}, {"t": 812.7666666666667, "x": "ごまかしているようで、だって\n水中ポンプを持ってくれば、"}, {"t": 815.5833333333334, "x": "ヘドロが幾らあったって\nどうということないじゃないですか」"}, {"t": 818.6333333333333, "x": "「初日の捜査ではエアが足りなくなった、"}, {"t": 820.75, "x": "エアが足りなくなればコンプレッサーを\n持ってきてどんどん入れておけばいいんですよ。"}, {"t": 824.6666666666666, "x": "矢板で仕切ればいいじゃないですか」"}, {"t": 826.7666666666667, "x": "ずいぶん具体的ね。"}, {"t": 828.2166666666667, "x": "「私が撃ちましたと言っている\n人が、その銃を神田川に捨てたと"}, {"t": 831.8333333333334, "x": "言えばさっさとやればよかったんですよ。\nそこらが僕らは納得できないんです」"}, {"t": 836.2, "x": "この追及に、杉田警備局長はこう答えている。"}, {"t": 839.3333333333334, "x": "「現職の警察官が私が撃ちましたと\n言っておるわけでありますから、それだけにやはり"}, {"t": 844.2666666666667, "x": "事は急いで解明をする必要がある」"}, {"t": 846.4166666666666, "x": "「こうしたけん銃の捜索というものについても\nもう少し速やかに早い段階で"}, {"t": 850.3, "x": "実施すべきであったろうと、\nそういう印象を持っております」"}, {"t": 853.85, "x": "早くやるべきだった。ここでも同じことを認めている。"}, {"t": 857.1666666666666, "x": "それで、銃は出たの？"}, {"t": 858.7166666666667, "x": "出なかった。"}, {"t": 859.5666666666667, "x": "この事件を通して、けん銃は\n最後まで見つかっていない。"}, {"t": 863.45, "x": "ここで、日付を三つ並べる。"}, {"t": 865.2666666666667, "x": "1995年3月23日、3月30日、そして4月1日だ。"}, {"t": 871.0, "x": "三月三十日が、事件の日よね。"}, {"t": 873.6166666666667, "x": "では、残りの二つは何か。これは\n1998年の政府答弁書に書いてある。"}, {"t": 878.95, "x": "「平成七年三月二十三日に"}, {"t": 881.2333333333333, "x": "滋賀県警察において\nオウム真理教のフロッピーディスク等を\n押収したところであるが」"}, {"t": 885.6, "x": "「その解読、分析等に時間を要したことから、"}, {"t": 888.5666666666667, "x": "警視庁において、オウム真理教関係者である\n疑いがあるとして、"}, {"t": 892.2833333333333, "x": "元警察官の地下鉄サリン事件"}, {"t": 894.4, "x": "特別捜査本部への派遣を解除したのが\n同年四月一日になったものであると承知している」"}, {"t": 900.0166666666667, "x": "ちょっと待って。その元巡査長は、\n地下鉄サリン事件の捜査本部にいたの？"}, {"t": 904.8, "x": "いた。"}, {"t": 905.3166666666667, "x": "3月23日に押収された資料から、その人が\nオウム真理教の関係者である疑いが出た。"}, {"t": 911.1333333333333, "x": "しかし解読と分析に時間がかかり、\n捜査本部から外れたのは4月1日。"}, {"t": 916.0, "x": "長官が撃たれたのは、その2日前、3月30日だ。"}, {"t": 919.9166666666666, "x": "……間に合っていない。"}, {"t": 921.0666666666667, "x": "そういうことになる。"}, {"t": 922.2333333333333, "x": "この点は、1996年の打合会でも指摘されている。"}, {"t": 926.4666666666667, "x": "ある委員は、3月22日にオウム真理教への強制捜査が\n始まったことを挙げて、こう述べた。"}, {"t": 932.25, "x": "「そういう団体に属している現職警官というのは"}, {"t": 935.0666666666667, "x": "適切な配置転換をするなり、"}, {"t": 936.8666666666667, "x": "オウムの捜査に関連する捜査の現場から"}, {"t": 939.55, "x": "外してしまうなり、そういう対応策を\n機敏にやれたんじゃないかと思うんですよ」"}, {"t": 943.5833333333334, "x": "「そうすれば、長官が狙撃されたのは三十日ですか、"}, {"t": 946.8, "x": "八日間あるじゃないですか。\nそれで防げたはずなのに、そういう\n対応が甘かったんじゃないか」"}, {"t": 952.0333333333333, "x": "八日間。"}, {"t": 952.75, "x": "この元巡査長が撃ったと確かめられたわけではない。"}, {"t": 955.8, "x": "確かめられていないから、この話は\n今も「もし」で終わっている。"}, {"t": 960.4, "x": "1996年11月28日、朝6時。"}, {"t": 964.05, "x": "警視庁のトップである警視総監が、\n警察庁長官に辞職を申し出た。"}, {"t": 968.7, "x": "警視総監が、辞めたの？"}, {"t": 970.6166666666667, "x": "警視総監と警察庁長官は、別の役職だ。"}, {"t": 973.9166666666666, "x": "同じ日、参議院の委員会で、\n白川勝彦国家公安委員長が答弁している。"}, {"t": 978.95, "x": "「この供述等もいろいろと\nあいまいであったり変遷したりするもので、"}, {"t": 982.5333333333333, "x": "警視庁といたしましても、これを直ちに警察庁へ\n報告したらいいかどうかということで迷いもあった」"}, {"t": 988.3666666666667, "x": "「いろいろ事情があったにしろ\n報告がなかったという点は、これはやはり"}, {"t": 991.3, "x": "問題があるのではないかということで\n今日まで参ったわけでございます」"}, {"t": 995.65, "x": "そのうえで、この日の朝6時に\n警視総監から辞職の申し出があったこと、"}, {"t": 999.9333333333333, "x": "国家公安委員会としてこれを了承したこと、"}, {"t": 1002.6, "x": "補佐する立場にあった者の処分も\nこの日に決定したことを説明した。"}, {"t": 1007.0333333333333, "x": "報告しなかったことで、トップが辞めたのね。"}, {"t": 1009.9333333333333, "x": "そうだ。"}, {"t": 1010.5666666666667, "x": "12月5日の衆議院の委員会で、\n白川国家公安委員長はこう報告している。"}, {"t": 1015.6166666666667, "x": "「十二月三日付で警視総監の交代人事を\n発令しましたが、国家公安委員会委員長として、\n警察当局に対し、"}, {"t": 1022.85, "x": "今後とも警察庁長官狙撃事件を解決するために\n全力を挙げるよう督励してまいります」"}, {"t": 1028.4666666666667, "x": "同じ日、処分の理由を國松長官が説明している。"}, {"t": 1031.9166666666667, "x": "「一つは元巡査長の服務規律違反に\n対する監督責任というものがございます」"}, {"t": 1036.95, "x": "「もう一つが、この元巡査長が長官狙撃事件の犯行を\n自認する供述をしていたにもかかわらず、"}, {"t": 1042.8166666666666, "x": "警察庁への報告をしていなかった\n責任ということがその事由になっている」"}, {"t": 1047.2666666666667, "x": "監督責任と、報告しなかった責任。この二つだ。"}, {"t": 1051.6166666666666, "x": "この事件で、警察は二度、処分を行っている。"}, {"t": 1054.7166666666667, "x": "どちらも、処分された人数は9人だった。"}, {"t": 1057.6, "x": "九人が、二回？"}, {"t": 1059.0333333333333, "x": "そうだ。これは1998年の政府答弁書に書かれている。"}, {"t": 1063.1666666666667, "x": "一度目は、1996年4月4日付。"}, {"t": 1066.35, "x": "理由は、事件を防げなかったことだ。"}, {"t": 1068.85, "x": "「事件を未然に防止できなかったことにつき、"}, {"t": 1071.3166666666666, "x": "事件当時の警視総監及び警視庁警備部長を\n国家公安委員会訓戒、"}, {"t": 1075.7166666666667, "x": "警視庁南千住警察署長らを減給とするなど、"}, {"t": 1078.8666666666666, "x": "合計九名の関係者に対する処分を\n平成八年四月四日付けで行った」"}, {"t": 1083.55, "x": "二度目は、1996年11月28日付。"}, {"t": 1087.3333333333333, "x": "警視総監が辞職を申し出た、あの日だ。"}, {"t": 1090.0833333333333, "x": "「元警察官がオウム真理教に\n警察の内部資料を渡したこと、"}, {"t": 1093.85, "x": "元警察官が長官狙撃事件の犯行を自認する\n供述をしていることについての警察庁への"}, {"t": 1099.6333333333334, "x": "報告が遅れたことなどによって、警察に\n対する信頼を失墜させた責任により」"}, {"t": 1104.55, "x": "「当時の警視庁副総監、刑事部長、公安部長、"}, {"t": 1107.6833333333334, "x": "警務部参事官、本富士警察署長らを減給とするなど、"}, {"t": 1111.2166666666667, "x": "合計九名の関係者に対する処分を\n平成八年十一月二十八日付けで行った」"}, {"t": 1116.7, "x": "二回目にも公安部長が入っているのね。"}, {"t": 1119.2666666666667, "x": "入っている。刑事部長も、副総監もだ。"}, {"t": 1122.1, "x": "一度目の9人は、長官が撃たれたことに対する処分だ。"}, {"t": 1125.6666666666667, "x": "二度目の9人は、供述を\n報告しなかったことに対する処分だ。"}, {"t": 1129.8333333333333, "x": "同じ重さ、ということね。"}, {"t": 1131.7166666666667, "x": "人数が同じだから重さも同じ、とまでは言えない。"}, {"t": 1134.6666666666667, "x": "ただ、報告が上がらなかったということが、\n長官が撃たれたこととほぼ同じ規模で扱われた。"}, {"t": 1140.1833333333334, "x": "それは、記録に残っている事実だ。"}, {"t": 1143.1166666666666, "x": "では、その供述は、具体的にどういう内容だったのか。"}, {"t": 1146.6833333333334, "x": "これは1996年12月5日、衆議院の委員会で\n杉田警備局長が公表している。"}, {"t": 1152.6833333333334, "x": "「一つは、平成七年の三月下旬、"}, {"t": 1155.1166666666666, "x": "オウム真理教幹部とともに犯行現場の下見、\nさらにけん銃の試射を行ったこと」"}, {"t": 1160.1333333333334, "x": "「二つは、長官を撃った後、"}, {"t": 1161.85, "x": "現場から自転車で逃走したけれども、\n現場周辺にはオウム真理教幹部数人がいたこと」"}, {"t": 1167.3333333333333, "x": "「三つは、けん銃は、同日、水道橋付近の神田川に\n捨てたということ等であります」"}, {"t": 1172.8, "x": "けっこう細かいのね。"}, {"t": 1174.25, "x": "細かい。だから警察も扱いに困った。"}, {"t": 1176.9333333333334, "x": "「けん銃の試射を行った\n場所の特定及びけん銃の発見には\n至っていないことなどから、"}, {"t": 1181.7666666666667, "x": "当該元警察官が長官狙撃事件の実行犯であるか\n否かは判断できる段階にはございません」"}, {"t": 1187.7666666666667, "x": "判断できる段階にはない。"}, {"t": 1189.4833333333333, "x": "だが、そのすぐ後にこうも言っている。"}, {"t": 1191.7333333333333, "x": "「現場及び現場周辺の状況等の供述が\n具体的かつ詳細であること、犯行の直前、"}, {"t": 1197.1666666666667, "x": "直後の状況に関する供述も、"}, {"t": 1199.25, "x": "目撃者等に対する昨年来の捜査結果と\n一致する点があることなどから、\n事件に関与していた疑いもある」"}, {"t": 1206.1, "x": "疑いはある、でも決められない。"}, {"t": 1208.1166666666666, "x": "そういう状態が、このあと何年も続く。"}, {"t": 1210.55, "x": "警察は、この人を逮捕していない。"}, {"t": 1212.9166666666667, "x": "1997年4月の国会では、都内で\nごく普通の生活をしており、"}, {"t": 1217.6, "x": "弁護人を通じて連絡をとれる\n状況にある、と報告されている。"}, {"t": 1221.55, "x": "一方、オウム真理教に警察の内部資料を\n渡していたという、地方公務員法違反の件では"}, {"t": 1226.9, "x": "手続きが進んでいた。"}, {"t": 1228.35, "x": "この人は1996年11月に懲戒免職となり、\n翌年、書類送検された。"}, {"t": 1235.0, "x": "1997年2月18日と19日。"}, {"t": 1238.1833333333334, "x": "テレビで、ある映像が放送された。"}, {"t": 1240.4166666666667, "x": "元巡査長が、専門家の面接を\n受けている様子を撮ったビデオだ。"}, {"t": 1244.5666666666666, "x": "それ、外に出ていいものなの？"}, {"t": 1246.5666666666666, "x": "国会でも、まさにそこが問題になった。"}, {"t": 1249.2166666666667, "x": "2月25日の衆議院予算委員会。"}, {"t": 1251.55, "x": "小池百合子委員がこう述べている。"}, {"t": 1253.4666666666667, "x": "「当時現職の警察官だった人が、催眠状態とはいえ、"}, {"t": 1257.0666666666666, "x": "非常に克明にそのときの模様を話しているという\nビデオが二日間にわたって延々と放送されました」"}, {"t": 1262.9, "x": "なぜ、そんなビデオが存在したのか。"}, {"t": 1265.25, "x": "同じ日、杉田警備局長が説明している。"}, {"t": 1268.1333333333334, "x": "「この元警察官の精神状態というものが"}, {"t": 1270.05, "x": "どういうぐあいであるかということについて\n把握をする必要があるという判断をいたしまして、"}, {"t": 1275.25, "x": "精神科医を含むところの数人の、複数の専門家に\n面接をさせたところでございます」"}, {"t": 1280.6833333333334, "x": "供述が信用できるか判断するために、\n警視庁が専門家に面接を頼んでいた。"}, {"t": 1285.75, "x": "その面接の映像が、外に出た。"}, {"t": 1288.1833333333334, "x": "警視庁が流したの？"}, {"t": 1289.7666666666667, "x": "2月20日の衆議院法務委員会で、\n警察庁の公安第三課長がこう答えている。"}, {"t": 1294.85, "x": "「御指摘のそのビデオの放映につきましては、\n警視庁は全く何ら関与をしていないわけでございます」"}, {"t": 1300.6, "x": "同じ日、白川国家公安委員長が、\n少し変わった答弁をしている。"}, {"t": 1304.9333333333334, "x": "「警察は保護はいたしておりますけれども、"}, {"t": 1307.15, "x": "警察が一〇〇％管理している状態でないというのは\n結果としては言えることなのじゃないかな」"}, {"t": 1312.5, "x": "ビデオが外に出たこと自体が、その人を警察が\n囲い込んでいない証拠だ、という言い方だ。"}, {"t": 1318.0166666666667, "x": "そして、こうも言っている。"}, {"t": 1319.6166666666666, "x": "「狙撃したとは言っていますけれども\n本当なのだろうかというところで大変"}, {"t": 1323.4666666666667, "x": "苦労しているわけでございまして、"}, {"t": 1325.2, "x": "どうか警察当局の悩みもまた\n御理解いただければと思う次第でございます」"}, {"t": 1329.8166666666666, "x": "悩んでいる、と言ったのね。"}, {"t": 1331.5666666666666, "x": "この時期、日本弁護士連合会の人権擁護委員会も\n動いている。"}, {"t": 1335.55, "x": "1997年1月9日付で、"}, {"t": 1338.3333333333333, "x": "元巡査長の身柄がいまどうなっているのかを\n説明するよう、警視総監あてに申し入れていた。"}, {"t": 1343.8333333333333, "x": "2月20日の国会で、委員は「いまだに\n回答をいただいておらない」と述べている。"}, {"t": 1349.25, "x": "1997年6月17日、東京地方検察庁の次席検事が\n記者会見を開いた。"}, {"t": 1355.5833333333333, "x": "この内容は、1998年の政府答弁書に残っている。"}, {"t": 1359.8833333333334, "x": "検察が、何て言ったの？"}, {"t": 1361.8, "x": "おおむね七つのことを述べた、とされている。"}, {"t": 1364.3333333333333, "x": "一つ。地方公務員法違反の件は、懲戒免職を\n受けていることなどを勘案して、起訴猶予にした。"}, {"t": 1370.6, "x": "二つ。狙撃の供述が報じられたことから、\nその信用性を検討する捜査を行った。"}, {"t": 1376.1166666666666, "x": "三つ。ここが核心になる。"}, {"t": 1378.0166666666667, "x": "まず、警察の取調べについては、"}, {"t": 1380.15, "x": "供述の任意性に影響を及ぼすような\n特段の事情はなかったと認められる、としている。"}, {"t": 1385.4333333333334, "x": "無理に言わせたわけではない、ということだ。"}, {"t": 1387.8, "x": "そのうえで、四つの点を挙げている。"}, {"t": 1389.95, "x": "犯行についていったん失念していたものを、\nその後突然思い出したと供述していること。"}, {"t": 1395.3333333333333, "x": "けん銃の処分など、基本的かつ重大な点に\nおいて供述に不可解な変遷があること。"}, {"t": 1400.6333333333334, "x": "神田川に投棄したとされるけん銃を徹底的に\n捜索したにもかかわらず、未発見であること。"}, {"t": 1406.3833333333334, "x": "試射を行ったと供述するものの、\nその試射場所が特定されないこと。"}, {"t": 1410.6833333333334, "x": "「不自然、不可解な点があることから、\n同供述の信用性には疑問を抱かざるを得ない」"}, {"t": 1415.95, "x": "信用できない、ってことね。"}, {"t": 1417.75, "x": "疑問を抱かざるを得ない、という言い方だ。"}, {"t": 1420.1833333333334, "x": "四つ目。こういう指摘もしている。"}, {"t": 1422.3, "x": "「学問上は、自らが行っていない行為について、"}, {"t": 1425.1, "x": "あたかも自らが本当に行ったかのような\n供述をする事例があるとの指摘がある」"}, {"t": 1429.7, "x": "五つ目。これはテレビ報道への反論だ。"}, {"t": 1432.2333333333333, "x": "「テレビ報道では、元警察官の狙撃状況に"}, {"t": 1435.05, "x": "関する供述が『秘密の暴露』に\n該当するとされているようであるが、同供述は"}, {"t": 1440.1, "x": "『秘密の暴露』には該当せず」"}, {"t": 1442.2333333333333, "x": "「このような誤った証拠評価が一般視聴者に誤解を\n生じせしめたとすれば大変残念なことである」"}, {"t": 1448.1333333333334, "x": "秘密の暴露って何かしら？"}, {"t": 1450.0833333333333, "x": "犯人しか知り得ないことを、供述で言い当てることだ。"}, {"t": 1453.2166666666667, "x": "それがあれば、供述の信用性は一気に上がる。"}, {"t": 1456.1, "x": "検察は、それには当たらないと言った。"}, {"t": 1458.4666666666667, "x": "そして六つ目。ここが重要だ。"}, {"t": 1460.5666666666666, "x": "「元警察官について長官狙撃事件と全く\n関係がないと結論付けたわけではない」"}, {"t": 1466.0, "x": "白ではない、とも言っていないのね。"}, {"t": 1468.1666666666667, "x": "そうだ。黒とも白とも言っていない。"}, {"t": 1470.3333333333333, "x": "この会見で、この線は事実上止まった。"}, {"t": 1473.6666666666667, "x": "1998年1月。ある週刊誌が、\nこういう趣旨の記事を出した。"}, {"t": 1478.4166666666667, "x": "警察庁長官が、この事件の捜査を\n打ち切るよう指示した、という内容だ。"}, {"t": 1483.1666666666667, "x": "本当なの？"}, {"t": 1484.1833333333334, "x": "2月4日の衆議院決算行政監視委員会で、\n国家公安委員長が答えている。"}, {"t": 1489.1, "x": "長官が捜査打ち切りを指示したという記事について、\n長官本人からも報告を聞いたうえで、こう述べた。"}, {"t": 1495.1666666666667, "x": "「断じてそのような事実はございません」"}, {"t": 1497.3833333333334, "x": "「警察は、関係週刊誌の記事に対して正式に\n抗議をいたしておるところでございまして、"}, {"t": 1502.5333333333333, "x": "警察の名誉と信頼にかけて、この点については\n私から申し上げておきたいと思います」"}, {"t": 1507.8666666666666, "x": "警察庁長官本人も、同じ日に述べている。"}, {"t": 1510.8833333333334, "x": "「この三月にはもう\n三年になるということでございますが、"}, {"t": 1514.0, "x": "残念ながらいまだ被疑者の検挙に至っておりません」"}, {"t": 1517.0666666666666, "x": "「決して事件を風化させてはならない、必ずや検挙、"}, {"t": 1520.2, "x": "解決を図らなければならないと\n考えているところでございます」"}, {"t": 1523.9166666666667, "x": "この時期、警察はもう一つ追っていた。"}, {"t": 1526.25, "x": "オウム真理教関係の、警察庁指定特別手配被疑者だ。"}, {"t": 1530.25, "x": "1998年の政府答弁書には、こう書かれている。"}, {"t": 1534.0333333333333, "x": "「長官狙撃事件と\nオウム真理教との関係の解明のため、"}, {"t": 1537.4666666666667, "x": "オウム真理教関係警察庁指定特別手配被疑者三名の\n発見検挙に向け、追跡捜査を鋭意推進しているが、"}, {"t": 1544.5, "x": "残念ながらいまだ検挙には至っていない」"}, {"t": 1547.1666666666667, "x": "三人が、まだ見つかっていなかったのね。"}, {"t": 1549.8333333333333, "x": "そうだ。この3人が見つかれば、\n事件の解明が進むかもしれない。"}, {"t": 1553.85, "x": "警察はそう考えていた。"}, {"t": 1555.6666666666667, "x": "ただし、この3人が実際に\n見つかるのは、ずっと後になる。"}, {"t": 1559.4, "x": "そのころにはもう、この事件の時効は完成していた。"}, {"t": 1563.1833333333334, "x": "2004年7月7日。"}, {"t": 1564.7666666666667, "x": "事件から9年が過ぎていた。"}, {"t": 1566.7333333333333, "x": "この日、警視庁は殺人未遂の容疑で3人を逮捕した。"}, {"t": 1570.4833333333333, "x": "ついに動いたのね。"}, {"t": 1571.8333333333333, "x": "動いた。だが、話はそこで終わらない。"}, {"t": 1574.3833333333334, "x": "7月28日、3人は処分保留のまま釈放されている。"}, {"t": 1578.5333333333333, "x": "三週間で？"}, {"t": 1579.65, "x": "そうだ。8月4日、衆議院の内閣委員会で\nこれが追及されている。"}, {"t": 1584.15, "x": "警察庁の警備局長は、逮捕に\n至った経緯をこう説明した。"}, {"t": 1588.15, "x": "「発生以来九年余にわたりまして、"}, {"t": 1590.15, "x": "大変物証の乏しい中、証拠収集、裏づけ等、\n警視庁において鋭意捜査を進めてきた」"}, {"t": 1596.0166666666667, "x": "「任意捜査で可能な限り手段を尽くしても\nなお未解明の部分が残る、しかし、"}, {"t": 1600.55, "x": "強制捜査に踏み切るだけの材料は\nこれはある、こういう状況に至った」"}, {"t": 1604.7, "x": "大変物証の乏しい中。この一言が、\nこの事件の9年間を要約している。"}, {"t": 1609.8, "x": "一方、質問した委員はこう指摘した。"}, {"t": 1612.3666666666666, "x": "「七月七日は参議院選挙の真っ最中です。しかも、"}, {"t": 1615.7, "x": "十一日が投票日、選挙期間もあと\n四日というタイミングでございました」"}, {"t": 1620.2, "x": "「その三週間後ぐらいですか、すぐ\n釈放されるということなんですね。"}, {"t": 1624.15, "x": "一体これは何なのかということなんです」"}, {"t": 1626.7333333333333, "x": "タイミングを疑われたのね。"}, {"t": 1628.5166666666667, "x": "警備局長は、はっきり否定している。"}, {"t": 1630.95, "x": "「そういうことによって、"}, {"t": 1632.1, "x": "犯罪捜査というものに着手する、しないということが\n左右されるものではないということは"}, {"t": 1637.1333333333334, "x": "明確に申し上げさせていただきたい」"}, {"t": 1639.15, "x": "この日は、もう一つ興味深いやりとりがある。"}, {"t": 1641.8666666666666, "x": "別の委員が、兵庫県にある大型放射光施設、\nスプリングエイトの話を持ち出した。"}, {"t": 1647.1166666666666, "x": "この施設で硝煙の反応を解析したことによって\n犯人が特定できたと聞いている、という趣旨だ。"}, {"t": 1652.9833333333333, "x": "特定できたの？"}, {"t": 1654.25, "x": "そこは注意が要る。そう言ったのは\n委員であって、政府ではない。"}, {"t": 1657.75, "x": "警察庁の答えはこうだ。"}, {"t": 1659.45, "x": "「具体的にどのような鑑定、"}, {"t": 1661.0833333333333, "x": "分析を行って、また結果が\nどうだったかということにつきましては、"}, {"t": 1665.0666666666666, "x": "捜査中の事案であるという性質上、\nお答えを差し控えざるを得ない」"}, {"t": 1669.1333333333334, "x": "肯定も否定もしていない。"}, {"t": 1670.75, "x": "そして、その後、この3人が\n起訴されることはなかった。"}, {"t": 1674.9, "x": "2010年3月30日、午前0時。\nこの事件の公訴時効が完成した。"}, {"t": 1679.9166666666667, "x": "殺人未遂罪の公訴時効は、当時15年だった。"}, {"t": 1683.3666666666666, "x": "十五年。"}, {"t": 1684.2166666666667, "x": "そして、その同じ日に、警視庁は異例のことをした。"}, {"t": 1687.5, "x": "公安部長が記者会見を開き、\n捜査結果を公表したのだ。"}, {"t": 1691.3333333333333, "x": "内容は、この事件はオウム真理教の信者による\n組織的なテロだった、という趣旨のものだった。"}, {"t": 1697.0833333333333, "x": "犯人が捕まっていないのに？"}, {"t": 1699.0333333333333, "x": "そこが問題になった。"}, {"t": 1700.5166666666667, "x": "4月6日、参議院法務委員会。ある議員が\nこう述べている。"}, {"t": 1704.1833333333334, "x": "「これは去る三月三十日に\n時効が来たわけでありまして、このことは"}, {"t": 1708.0333333333333, "x": "大変残念なことで、ついに真相が必ずしも\n解明されないままに時効になったと」"}, {"t": 1713.1333333333334, "x": "「更にまた残念なのは、"}, {"t": 1714.5333333333333, "x": "時効後に警視庁の公安部長が、\nこの國松長官狙撃事件はオウムの組織的な"}, {"t": 1719.55, "x": "テロだというような意見を\n述べられておるわけでございます」"}, {"t": 1722.5333333333333, "x": "「時効完成後に特定の者あるいは特定の団体に"}, {"t": 1725.4666666666667, "x": "対してあれが犯人だというふうに\n名指しで認定するというのは、これは私は"}, {"t": 1729.5666666666666, "x": "極めて異例なことだし、こんなことが次々に\n起こるようであればこれは大変な問題だ」"}, {"t": 1734.55, "x": "これに、中井洽国家公安委員長が答えている。"}, {"t": 1737.7166666666667, "x": "「記者会見でこの件についてマスコミから"}, {"t": 1740.1166666666666, "x": "質問を受けました。とっさに\n悔しさの余りだと申し上げましたが、\nそういう面も強くあったのではないか」"}, {"t": 1746.0166666666667, "x": "「長官が狙撃されて、"}, {"t": 1747.35, "x": "結局犯人を挙げられなかった\n捜査当局としての悔しさが\nにじみ出ている、こういう会見であったかと"}, {"t": 1753.2833333333333, "x": "思っております」"}, {"t": 1754.2333333333333, "x": "悔しさ。"}, {"t": 1755.1166666666666, "x": "そして、こう続けている。"}, {"t": 1756.8, "x": "「先生御指摘の人権問題というようなことも\n含めまして、過般、"}, {"t": 1760.6833333333334, "x": "公安委員会でも議論のあったところでございます」"}, {"t": 1763.55, "x": "「公安委員五人の先生方の御意見は"}, {"t": 1765.3833333333334, "x": "様々でございましたが、"}, {"t": 1767.1, "x": "ああいう発表の仕方も\nこの際やむを得なかったということが\n大方の空気でございまして、"}, {"t": 1771.85, "x": "私はそれを了といたしているところであります」"}, {"t": 1774.6166666666666, "x": "公安委員5人の意見は様々だった。"}, {"t": 1776.9666666666667, "x": "警察を管理する側の中でも、\n割れていた、ということだ。"}, {"t": 1781.1833333333334, "x": "この公表は、そのあと裁判になった。"}, {"t": 1783.6, "x": "警視庁は捜査結果をホームページに\n1か月間掲示している。"}, {"t": 1787.2333333333333, "x": "オウム真理教の後継団体は、これで名誉を\n傷つけられたとして、東京都を相手に訴えを起こした。"}, {"t": 1793.1833333333334, "x": "裁判所の判断が気になるわね。"}, {"t": 1795.3833333333334, "x": "2013年1月15日、東京地方裁判所は、\n名誉毀損の成立を認めた。"}, {"t": 1800.7833333333333, "x": "そして東京都に、100万円の賠償と\n謝罪文の交付を命じている。"}, {"t": 1804.9166666666667, "x": "判決が指摘したのは、無罪推定の原則に\n反する、という点だった。"}, {"t": 1809.5, "x": "同じ年の11月27日、東京高等裁判所は、\n支払いの命令は維持した。"}, {"t": 1814.85, "x": "ただし、謝罪文を交付せよという\n部分は取り消している。"}, {"t": 1818.1333333333334, "x": "一審判決が報道されたことで、社会的評価は\n一定程度回復した、という理由だった。"}, {"t": 1823.7833333333333, "x": "そして2014年4月、最高裁判所は\n上告を退け、賠償が確定した。"}, {"t": 1829.15, "x": "つまり、あの発表は違法だったということ？"}, {"t": 1831.8333333333333, "x": "裁判所は、名誉毀損にあたると\n判断した。そこは確定している。"}, {"t": 1836.05, "x": "ここで、はっきりさせておく。"}, {"t": 1837.85, "x": "この事件がオウム真理教による組織的な\nテロだったと確定した公の判断は、存在しない。"}, {"t": 1843.7, "x": "警視庁は、そういう見方を公表した。"}, {"t": 1846.1666666666667, "x": "裁判所は、その公表のしかたを\n名誉毀損だと判断した。"}, {"t": 1849.8833333333334, "x": "この二つが、どちらも起きたことだ。"}, {"t": 1852.1666666666667, "x": "だから私は、この回で「オウム真理教がやった」とも\n「やっていない」とも言わない。"}, {"t": 1857.2666666666667, "x": "言えるのは、犯人は特定されないまま\n時効になった、ということだけだ。"}, {"t": 1861.6166666666666, "x": "それが、公の記録に残っていることなのね。"}, {"t": 1864.6833333333334, "x": "そういうことだ。"}, {"t": 1866.3333333333333, "x": "時効から、さらに15年が過ぎた。"}, {"t": 1868.6666666666667, "x": "2025年3月30日。"}, {"t": 1870.75, "x": "事件から30年だ。"}, {"t": 1872.3666666666666, "x": "日本経済新聞は、初動の問題をこう伝えている。"}, {"t": 1875.6166666666666, "x": "不審な人物の目撃情報が得られたエリアを重視する\nあまり、その外側の捜査がおろそかになった。"}, {"t": 1881.5666666666666, "x": "防犯カメラの映像を広い範囲で\n集めることも行われなかった。"}, {"t": 1885.45, "x": "当時にも、防犯カメラはあったのね。"}, {"t": 1887.8666666666666, "x": "今ほどではないが、あった。だから、\nそこが指摘されている。"}, {"t": 1891.55, "x": "そして、組織の問題だ。"}, {"t": 1893.45, "x": "同じ記事は、公安部が秘密の保全を優先したため、\n刑事部との間で情報が十分に共有されず、"}, {"t": 1899.3666666666666, "x": "裏づけ捜査に支障が出た、と伝え、\n当時の警察幹部の言葉を載せている。"}, {"t": 1904.2166666666667, "x": "「部門間の壁があり、\n最大限の捜査をし尽くしたとは言いがたい」"}, {"t": 1908.1666666666667, "x": "最初のほうで言っていた話ね。"}, {"t": 1910.2333333333333, "x": "そうだ。公安部長を長とする特別捜査本部。"}, {"t": 1913.2833333333333, "x": "あの体制の話が、30年たってここに戻ってくる。"}, {"t": 1916.7666666666667, "x": "同じ2025年3月、楠芳伸警察庁長官は、\n記者会見でこう述べている。"}, {"t": 1922.4666666666667, "x": "「警察のトップが狙撃されるという極めて重大な\n事件について真相の解明に至らなかったことは、"}, {"t": 1928.1166666666666, "x": "私個人としては大変重く受け止めている」"}, {"t": 1930.95, "x": "そして、同じ年の7月。"}, {"t": 1932.95, "x": "この事件への関与を認める\n趣旨の手紙を新聞社の取材に\n送っていたと報じられていた受刑者が、"}, {"t": 1938.4, "x": "94歳で亡くなった。"}, {"t": 1940.2666666666667, "x": "その人が、犯人だったの？"}, {"t": 1942.35, "x": "それを認定した公の判断は無い。"}, {"t": 1944.6166666666666, "x": "だから私は、名前を出さないし、\n犯人だとも言わない。"}, {"t": 1948.0666666666666, "x": "ただ、事件について何かを語れる立場にいたかも\nしれない人が、また一人いなくなった。"}, {"t": 1954.0166666666667, "x": "ここからは私の見方だ。"}, {"t": 1955.6, "x": "事実と分けて聞いてほしい。"}, {"t": 1957.3333333333333, "x": "四つある。"}, {"t": 1958.1166666666666, "x": "一つ目。この記録を読んでいちばん\n奇妙に感じたのは、処分の人数だ。"}, {"t": 1962.55, "x": "長官が撃たれたことで9人。"}, {"t": 1964.25, "x": "供述を報告しなかったことで9人。"}, {"t": 1966.7, "x": "外からの攻撃と、内側の沈黙が、\n同じ規模で処理されている。"}, {"t": 1971.0, "x": "偶然かもしれないわよね。"}, {"t": 1972.7166666666667, "x": "だが私は、ここにこの組織が何を\n怖れていたかが出ていると思う。"}, {"t": 1976.7333333333333, "x": "撃たれたことよりも、報告が\n上がらなかったことのほうが、\n組織としては深いところを揺らした。"}, {"t": 1982.25, "x": "だから警視総監が辞めた。"}, {"t": 1983.8666666666666, "x": "撃たれた時点では辞めていない。"}, {"t": 1985.6833333333334, "x": "二つ目。「早くやるべきだった」という\n言葉が、何度も出てくることだ。"}, {"t": 1990.0833333333333, "x": "報告はもっと早く上げるべきだった。"}, {"t": 1992.1833333333334, "x": "神田川の捜索はもっと早くやるべきだった。"}, {"t": 1995.0333333333333, "x": "これを言っているのは、批判する\n側ではない。警察庁の側だ。"}, {"t": 1998.7666666666667, "x": "この事件は「警察が隠した」という\n一言では終わらない。"}, {"t": 2002.45, "x": "隠したかどうかの前に、\n判断ができなかった、という状態が長く続いている。"}, {"t": 2007.2, "x": "本人は自分が撃ったと言う。だが裏づけが取れない。"}, {"t": 2010.05, "x": "銃も出ない。試射の場所も分からない。"}, {"t": 2012.4166666666667, "x": "逮捕もできず、白だとも言えない。\nその中で、時間だけが過ぎた。"}, {"t": 2016.6833333333334, "x": "どちらにも決められないまま。"}, {"t": 2018.5, "x": "そうだ。三つ目。壁の話だ。"}, {"t": 2020.7833333333333, "x": "公安部は、情報を守ることが\n仕事の一部になっている部門だ。"}, {"t": 2024.6166666666666, "x": "それ自体を責めることはできない。"}, {"t": 2026.5166666666667, "x": "だがこの事件では、その仕組みが、\n人が撃たれた事件の上に乗った。"}, {"t": 2030.7, "x": "30年後に当時の幹部が\n言っているとおり、部門間の壁があった。"}, {"t": 2034.6833333333334, "x": "私は、これは誰か一人の失敗ではなく、\n仕組みの形がそのまま出た結果だと思っている。"}, {"t": 2040.4333333333334, "x": "四つ目。私がいちばん\n引っかかっているのは、元巡査長のことだ。"}, {"t": 2044.6833333333334, "x": "この人は、自分が撃ったと言った。"}, {"t": 2046.85, "x": "検察は、その供述の信用性には\n疑問を抱かざるを得ないと述べた。"}, {"t": 2051.0666666666666, "x": "同時に、全く関係がないと\n結論づけたわけではない、とも述べた。"}, {"t": 2055.2833333333333, "x": "起訴されていない。有罪でもない。無罪でもない。"}, {"t": 2058.1666666666665, "x": "告白の映像だけがテレビで流れて、多くの人が\nそれを見た。そして、時効になった。"}, {"t": 2063.633333333333, "x": "終わっていないのね。"}, {"t": 2064.9, "x": "この事件で、疑いを晴らされた人は一人もいない。"}, {"t": 2068.05, "x": "犯人が捕まっていれば、関係のなかった\n人は関係がなかったと分かった。"}, {"t": 2072.5833333333335, "x": "だが、捕まらなかった。だから、\n誰もそう言われていない。"}, {"t": 2076.0833333333335, "x": "時効は、起訴をできなくする。だが、\n疑いは消してくれない。"}, {"t": 2080.4166666666665, "x": "最後に、この回で確かめたことをもう一度並べる。"}, {"t": 2083.55, "x": "1995年3月30日午前8時30分ごろ、\n警察庁長官が自宅マンションの前で撃たれた。"}, {"t": 2090.5333333333333, "x": "二十数メートル離れた場所から\n4発が発射され、3発が命中した。"}, {"t": 2094.866666666667, "x": "犯人は自転車で逃げた。"}, {"t": 2096.7, "x": "ＳＰはついておらず、"}, {"t": 2097.883333333333, "x": "政府はのちに「警戒方法等が\n犯行を防ぎ得るものでなく、\nその間隙をつかれた」と答弁した。"}, {"t": 2104.1, "x": "1996年5月、現職の警察官が\n犯行を自認する供述をした。"}, {"t": 2109.35, "x": "その報告が警察庁に上がったのは、\n5か月後の10月15日。"}, {"t": 2113.3333333333335, "x": "報道機関への投書が先だった。"}, {"t": 2115.6, "x": "同じ年の11月28日、警視総監が辞職を申し出た。"}, {"t": 2119.8333333333335, "x": "処分はこのときも、事件の翌年の4月4日のときも、\nそれぞれ9人だった。"}, {"t": 2124.8333333333335, "x": "1997年6月、東京地検の次席検事は、\n供述の信用性には疑問を抱かざるを得ないとし、"}, {"t": 2131.5, "x": "同時に、全く関係がないと\n結論づけたわけではないと述べた。"}, {"t": 2135.5833333333335, "x": "2004年7月、3人が逮捕され、\n3週間後に処分保留で釈放された。"}, {"t": 2140.6833333333334, "x": "2010年3月30日、公訴時効が完成した。"}, {"t": 2144.233333333333, "x": "その日、警視庁は捜査結果を公表し、のちに\n裁判所は、その公表を名誉毀損にあたると判断した。"}, {"t": 2150.733333333333, "x": "そして2025年、事件から30年が経った。"}, {"t": 2154.016666666667, "x": "これらは、私の推測ではない。"}, {"t": 2156.15, "x": "国会会議録と、政府の答弁書と、\n警察白書に書かれていることだ。"}, {"t": 2160.75, "x": "中心にしたのは、\n1996年10月31日の参議院地方行政委員打合会と、"}, {"t": 2166.633333333333, "x": "1996年12月5日の衆議院地方行政委員会。"}, {"t": 2171.116666666667, "x": "そして、平成10年9月4日付の政府答弁書、\n内閣衆質一四三第三号だ。"}, {"t": 2177.0333333333333, "x": "どれも、国会会議録検索システムと\n衆議院のウェブサイトで、どなたでも無料で読める。"}, {"t": 2182.366666666667, "x": "警察のいちばん上に立つ人が撃たれ、\n犯人が分からないまま時効になった。"}, {"t": 2186.9, "x": "それは、たしかに未解決事件だ。"}, {"t": 2189.15, "x": "だが記録に残っているのは、それだけではない。"}, {"t": 2191.9333333333334, "x": "その15年のあいだ、警察という組織が自分の内側と\nどう向き合ったかが、全部残っている。"}, {"t": 2197.6833333333334, "x": "時効は事件を閉じる。だが、記録は閉じない。"}, {"t": 2200.5333333333333, "x": "この事件について、あなたはどう\n考えるか。よかったらコメントで教えてほしい。"}, {"t": 2205.0833333333335, "x": "最後まで見てくれて、ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
