<script>
const D={"name": "133", "file": "133_編集用", "dur": 2131.31665625, "segs": [], "subs": [{"t": 0.0, "x": "電車の網棚に、紙袋が一つ載っていた。"}, {"t": 2.95, "x": "底が四角い、どこにでもある買い物袋だ。"}, {"t": 5.75, "x": "誰が置いたのか、気にする人はいなかった。"}, {"t": 8.533333333333333, "x": "網棚の荷物なんて、いちいち見ないものね。"}, {"t": 11.366666666666667, "x": "その紙袋が、走っている電車の中で爆発した。"}, {"t": 14.933333333333334, "x": "えっ……。"}, {"t": 15.566666666666666, "x": "1968年6月16日。"}, {"t": 18.2, "x": "国鉄の横須賀線だ。"}, {"t": 19.916666666666668, "x": "乗っていた30代の会社員が亡くなった。"}, {"t": 22.516666666666666, "x": "ほかにも大勢の乗客がけがをした。"}, {"t": 24.85, "x": "犯人はその車両にいたの？"}, {"t": 26.683333333333334, "x": "いなかった。時計じかけの仕掛けだった。"}, {"t": 29.166666666666668, "x": "置いた人は、とっくに電車を降りていた。"}, {"t": 31.666666666666668, "x": "じゃあ、手がかりは何も無いじゃない。"}, {"t": 33.75, "x": "残ったのは、粉々になった袋の中身だけだ。"}, {"t": 36.85, "x": "包み紙にした古い新聞が1枚。"}, {"t": 39.166666666666664, "x": "名古屋のもなか屋の菓子箱が1つ。"}, {"t": 41.38333333333333, "x": "ほかにもいくつかの部品があった。"}, {"t": 43.483333333333334, "x": "それで犯人が分かるものなの？"}, {"t": 45.46666666666667, "x": "分かった。5か月かかってな。"}, {"t": 47.46666666666667, "x": "その新聞は、6万8000部刷られたうちの1部だった。"}, {"t": 51.05, "x": "6万8000分の1……。"}, {"t": 52.71666666666667, "x": "今回は、物から人へたどり着いた捜査の話だ。"}, {"t": 55.96666666666667, "x": "国会の記録と最高裁の判決、\n当時の記者の記録で追っていく。"}, {"t": 60.8, "x": "6月16日は日曜日だった。"}, {"t": 63.083333333333336, "x": "しかもその年の父の日にあたっていた。"}, {"t": 65.6, "x": "家族で出かけた人も多そうね。"}, {"t": 67.7, "x": "そうだ。電車は行楽帰りの客で混んでいた。"}, {"t": 70.51666666666667, "x": "走っていたのは、横須賀から東京へ向かう上り電車だ。"}, {"t": 74.0, "x": "鎌倉や逗子の海や寺から帰る人が乗る路線だな。"}, {"t": 77.33333333333333, "x": "日曜の午後の、のんびりした電車ね。"}, {"t": 79.81666666666666, "x": "10両の編成だった。"}, {"t": 81.28333333333333, "x": "電車は北鎌倉の駅を出て、大船の駅に近づいていた。"}, {"t": 85.01666666666667, "x": "時刻は午後3時すぎ。"}, {"t": 86.63333333333334, "x": "大船の手前ってことは、もうすぐ乗り換えの駅ね。"}, {"t": 89.78333333333333, "x": "そうだ。降りる準備をしていた人もいただろう。"}, {"t": 92.43333333333334, "x": "その時、前から6両目で大きな音がした。"}, {"t": 95.33333333333333, "x": "網棚の上の荷物が爆発したんだ。"}, {"t": 97.83333333333333, "x": "……混んでる車両で。"}, {"t": 99.03333333333333, "x": "車内は悲鳴が飛び交う\n状態だったと、記者は書いている。"}, {"t": 102.35, "x": "のちの調べでは、置かれていた場所も分かった。"}, {"t": 105.08333333333333, "x": "車両の後ろの方、左側の向かい合った\n席の上の網棚だ。"}, {"t": 109.1, "x": "座っていた人の、ちょうど頭の上ね。"}, {"t": 111.66666666666667, "x": "そういう場所だった。"}, {"t": 112.86666666666666, "x": "網棚は、誰でも荷物を置ける場所だ。"}, {"t": 115.33333333333333, "x": "置いた人を覚えている人は、まずいない。"}, {"t": 117.8, "x": "だから網棚を選んだのかしら。"}, {"t": 119.83333333333333, "x": "それは裁判の話のところで出てくる。"}, {"t": 122.8, "x": "爆発した場所は、大船の駅の少し手前だ。"}, {"t": 125.86666666666666, "x": "田園踏切と呼ばれる踏切のあたりとされた。"}, {"t": 128.8, "x": "電車はそこで止まったの？"}, {"t": 130.5, "x": "電車はそのあと、車庫に入れられた。"}, {"t": 132.71666666666667, "x": "大船電車区という、電車を置いておく場所だ。"}, {"t": 135.5, "x": "けがをした人たちは？"}, {"t": 137.05, "x": "翌朝の新聞は、死者1人、重軽傷28人と伝えた。"}, {"t": 141.33333333333334, "x": "28人も……。"}, {"t": 142.56666666666666, "x": "ただ、あとの裁判の数え方は少し違う。"}, {"t": 145.38333333333333, "x": "一審の判決が被害者として数えたのは15人だ。"}, {"t": 148.68333333333334, "x": "亡くなった方が1人、けがをした人が14人。"}, {"t": 151.8, "x": "新聞と判決で数がずれてるのね。"}, {"t": 154.21666666666667, "x": "なぜ違うのか、記録からははっきりしない。"}, {"t": 156.81666666666666, "x": "判決の数は、罪を問う相手として\n一人ずつ数えた人数だ。"}, {"t": 160.68333333333334, "x": "この回では、両方の数をそのまま並べておく。"}, {"t": 163.75, "x": "けがの重さもいろいろだったのね。"}, {"t": 165.8, "x": "そうだ。破片を受けてけがをした人が多かった。"}, {"t": 168.73333333333332, "x": "中には、長く後に残るけがをした人もいた。"}, {"t": 171.56666666666666, "x": "……。"}, {"t": 172.5, "x": "この回では、その方々のお名前は扱わない。"}, {"t": 175.43333333333334, "x": "けがの様子も、細かくは話さない。"}, {"t": 177.85, "x": "うん、それでいいと思う。"}, {"t": 179.88333333333333, "x": "亡くなったのは、東京の武蔵野市に住む会社員だ。"}, {"t": 183.11666666666667, "x": "30代の男性だった。"}, {"t": 184.9, "x": "日曜に、どうして横須賀線に乗っていたの？"}, {"t": 187.78333333333333, "x": "当時の記者が、そのことを書き残している。"}, {"t": 190.48333333333332, "x": "生まれて間もない娘が、逗子の病院に入院していた。"}, {"t": 193.91666666666666, "x": "妻がそこに付き添っていた。"}, {"t": 195.81666666666666, "x": "じゃあ、娘さんのお見舞いに行っていたのね。"}, {"t": 198.41666666666666, "x": "そうだ。病院で娘と過ごし、別れて帰る途中だった。"}, {"t": 202.16666666666666, "x": "父の日に、生まれたばかりの娘に会いに……。"}, {"t": 204.88333333333333, "x": "その帰りの電車で、事件に遭った。"}, {"t": 207.3, "x": "……言葉が出ない。"}, {"t": 208.4, "x": "この方は、爆発した荷物とは何の関係も無い。"}, {"t": 211.65, "x": "たまたまその車両の、その席にいただけだ。"}, {"t": 214.53333333333333, "x": "犯人とも、もちろん関係ないのよね。"}, {"t": 217.1, "x": "関係ない。会ったことも無い相手だ。"}, {"t": 219.33333333333334, "x": "警察庁の担当者は、国会でこう言っている。"}, {"t": 222.21666666666667, "x": "何の関係も無い人を殺傷する\n事件は、社会公共の敵だ、と。"}, {"t": 226.61666666666667, "x": "本当にそうね。"}, {"t": 227.81666666666666, "x": "この言葉が出た日のことは、あとで詳しく話す。"}, {"t": 230.85, "x": "ここでは一つだけ覚えておいてほしい。"}, {"t": 233.03333333333333, "x": "亡くなった方には、帰りを待つ家族がいた。"}, {"t": 235.88333333333333, "x": "うん。"}, {"t": 236.38333333333333, "x": "この回は、その方を中心に置いたまま進める。"}, {"t": 240.03333333333333, "x": "爆発で、車両そのものも大きく壊れた。"}, {"t": 242.76666666666668, "x": "その壊れ方は、最高裁の判決に書き残されている。"}, {"t": 246.45, "x": "判決に、電車の壊れ方まで書いてあるの？"}, {"t": 249.36666666666667, "x": "あるんだ。罪の重さを決めるのに必要だったからな。"}, {"t": 252.53333333333333, "x": "判決は、その車両を「5号車両」と呼んでいる。"}, {"t": 255.8, "x": "さっきは前から6両目って言ってなかった？"}, {"t": 258.43333333333334, "x": "記者の記録は6両目。"}, {"t": 259.85, "x": "判決の記録は5号車両だ。"}, {"t": 261.85, "x": "数え方の違いとみられる。"}, {"t": 263.43333333333334, "x": "今回は両方を並べておく。"}, {"t": 265.3833333333333, "x": "分かった。それで、どう壊れたの？"}, {"t": 267.71666666666664, "x": "屋根と天井に張られた鉄板と合金の板が4枚。"}, {"t": 270.8666666666667, "x": "座席が7つ。網棚。窓ガラスが4枚。"}, {"t": 273.85, "x": "そのほかに、車体の付属品が8点。"}, {"t": 276.51666666666665, "x": "網棚そのものも壊れたのね。"}, {"t": 278.56666666666666, "x": "そうだ。そして破片が床いっぱいに散らばった。"}, {"t": 281.45, "x": "判決はこう書いている。"}, {"t": 282.93333333333334, "x": "乗客を乗せて安全な\n運行を続けることができない状態になった。"}, {"t": 286.98333333333335, "x": "電車として使えなくなった、ってことね。"}, {"t": 289.6333333333333, "x": "その一文が、あとで大事な意味を持つ。"}, {"t": 292.06666666666666, "x": "最高裁が「電車を壊す」とは\n何かを決めた判決なんだ。"}, {"t": 296.06666666666666, "x": "へえ。それは最後の方の話？"}, {"t": 298.28333333333336, "x": "最後の方だ。順番に行こう。"}, {"t": 300.3, "x": "まずは、車内に誰が乗っていたかからだ。"}, {"t": 303.43333333333334, "x": "神奈川県警は、すぐに捜査本部を作った。"}, {"t": 306.3666666666667, "x": "1か月余りたった7月25日、国会で報告があった。"}, {"t": 310.4166666666667, "x": "どこの委員会？"}, {"t": 311.56666666666666, "x": "衆議院の運輸委員会だ。"}, {"t": 313.18333333333334, "x": "国会が開かれていない時期の、特別の審査だった。"}, {"t": 316.6666666666667, "x": "運輸委員会ってことは、鉄道の安全の話ね。"}, {"t": 319.78333333333336, "x": "そうだ。ある議員が、捜査は\nどうなっているかと聞いた。"}, {"t": 322.93333333333334, "x": "答えたのは、警察庁の説明員だ。"}, {"t": 325.46666666666664, "x": "捜査本部は140人の態勢だと述べた。"}, {"t": 328.4, "x": "140人も。"}, {"t": 329.7, "x": "捜査には二つの柱があると説明している。"}, {"t": 332.48333333333335, "x": "人の面からの捜査と、物の面からの捜査だ。"}, {"t": 335.7, "x": "人の面って、乗っていた人を調べること？"}, {"t": 338.55, "x": "そうだ。爆発した車両には66、7人が乗っていた。"}, {"t": 342.45, "x": "そのうち60人が、誰なのか分かった。"}, {"t": 345.18333333333334, "x": "日曜の行楽帰りの客を、60人も探し出したの？"}, {"t": 348.8833333333333, "x": "探し出した。一人ずつ話を聞いた。"}, {"t": 351.3833333333333, "x": "だが、その中に犯人はいなかった。"}, {"t": 353.76666666666665, "x": "犯人らしい人を見た、という人も出てこなかった。"}, {"t": 357.0, "x": "残りの人は？"}, {"t": 358.18333333333334, "x": "まだ5、6人が分かっていない、と報告している。"}, {"t": 361.25, "x": "ただ、それで犯人に届くとは考えにくかった。"}, {"t": 364.45, "x": "置いた人は、もう降りてたんだもんね。"}, {"t": 366.76666666666665, "x": "そこがこの種の事件の一番難しいところだった。"}, {"t": 370.5, "x": "実はこの日の質問は、\n横須賀線だけの話ではなかった。"}, {"t": 374.35, "x": "議員は、もう一つの事件を並べて聞いている。"}, {"t": 377.26666666666665, "x": "もう一つ？"}, {"t": 378.21666666666664, "x": "ちょうど1年前、兵庫県で起きた電車の爆発だ。"}, {"t": 381.46666666666664, "x": "姫路から神戸へ向かう山陽電車だった。"}, {"t": 383.96666666666664, "x": "1967年の6月18日。こちらも日曜日だ。"}, {"t": 388.26666666666665, "x": "同じような事件が、1年前にもあったのね。"}, {"t": 391.21666666666664, "x": "議員はこう言った。二つとも、\nいまだ犯人が分かっていない。"}, {"t": 394.78333333333336, "x": "国民は恐怖の念を持って電車に\n乗らなければならない。"}, {"t": 398.0833333333333, "x": "……怖いわよね。毎日乗る電車なのに。"}, {"t": 400.55, "x": "答えた国鉄総裁の石田禮助は、こう述べた。"}, {"t": 403.75, "x": "ああいう事故が起こらないよう、監視を厳しくしたい。"}, {"t": 406.68333333333334, "x": "でも、網棚の荷物を全部調べるなんて無理よね。"}, {"t": 409.9, "x": "総裁もそこは分かっていたようだ。"}, {"t": 411.9166666666667, "x": "話は新幹線の線路に置かれる障害物へ移っていった。"}, {"t": 415.48333333333335, "x": "置き石は全国で\n毎年2000件以上ある、とも言っている。"}, {"t": 419.03333333333336, "x": "国鉄の力だけでは防げない、って話ね。"}, {"t": 422.06666666666666, "x": "そうだ。電車は誰でも乗れる場所だ。"}, {"t": 424.31666666666666, "x": "誰でも乗れるから、誰でも荷物を置ける。"}, {"t": 426.95, "x": "便利さと危なさが、背中合わせなのね。"}, {"t": 429.6166666666667, "x": "そして警察は、山陽電車の捜査の中身も報告した。"}, {"t": 433.31666666666666, "x": "それを聞くと、物の捜査がどういうものか分かる。"}, {"t": 436.81666666666666, "x": "山陽電車の車内にも、いろいろな物が残っていた。"}, {"t": 440.06666666666666, "x": "まず時計だ。精工舎の「フラワー」という型だった。"}, {"t": 443.45, "x": "1952年の11月に作られたもので、7284個ある。"}, {"t": 448.5833333333333, "x": "作られた数まで分かるのね。"}, {"t": 450.48333333333335, "x": "会社に記録が残っているからな。"}, {"t": 452.56666666666666, "x": "包んでいた新聞は、デイリースポーツだった。"}, {"t": 455.23333333333335, "x": "事件当日の6月18日付で、14万4865部刷られていた。"}, {"t": 460.68333333333334, "x": "14万部……全部は追えないわよね。"}, {"t": 463.01666666666665, "x": "警察もそう言っている。"}, {"t": 464.3, "x": "全部追うのは不可能に近い。"}, {"t": 466.1166666666667, "x": "そこで売られた地域を兵庫・京都・大阪にしぼった。"}, {"t": 469.43333333333334, "x": "さらに、新聞に使われた紙に目をつけた。"}, {"t": 472.3333333333333, "x": "紙？"}, {"t": 472.95, "x": "刷った時間によって、紙を作った会社が違ったんだ。"}, {"t": 476.31666666666666, "x": "紙の違いから、どの時間に\n刷られた新聞かを割り出した。"}, {"t": 479.93333333333334, "x": "すごい細かさね。"}, {"t": 481.26666666666665, "x": "そうやって、3584部までは行き先を確かめた。"}, {"t": 485.1166666666667, "x": "だが、その中に犯人はいなかった。"}, {"t": 487.48333333333335, "x": "ドライヤーの空き箱も残っていた。"}, {"t": 489.46666666666664, "x": "これは約46万個売られていた。"}, {"t": 491.7, "x": "そのうち約5000個の行き先を確かめた。"}, {"t": 494.4, "x": "それでも届かなかったの？"}, {"t": 496.1166666666667, "x": "届かなかった。捜査員100人で1年追っても、だ。"}, {"t": 499.51666666666665, "x": "物の捜査は、それほど気の遠くなる作業だった。"}, {"t": 502.6666666666667, "x": "横須賀線も、同じことになりそうね。"}, {"t": 505.26666666666665, "x": "警察庁の担当者も、その難しさを隠していない。"}, {"t": 509.35, "x": "山陽電車の捜査では、もう一つの見方も使われた。"}, {"t": 512.8, "x": "物から人を割り出すのではなく、\n人の条件を考える方法だ。"}, {"t": 516.8666666666667, "x": "人の条件？"}, {"t": 517.95, "x": "この爆弾を作れるのは、どんな人か、ということだ。"}, {"t": 521.2666666666667, "x": "説明員は、国会でいくつも挙げている。"}, {"t": 523.7666666666667, "x": "ガスや電気の溶接、穴をあける\n機械を使える立場にある人。"}, {"t": 527.6666666666666, "x": "溶接の技術を持っている人。"}, {"t": 529.6333333333333, "x": "火薬について、それなりの知識と経験がある人。"}, {"t": 532.9333333333333, "x": "素人には無理、ってことね。"}, {"t": 534.8, "x": "そうだ。ボルトやナットを手に入れられる人でもある。"}, {"t": 537.6333333333333, "x": "さらに、性格のことまで言っている。"}, {"t": 539.9833333333333, "x": "性格まで？"}, {"t": 541.0166666666667, "x": "工作がかなり精密だから、\n工作好きで凝り性だろう、と。"}, {"t": 544.7166666666667, "x": "家か職場に、工作をする場所と道具がある人だ。"}, {"t": 547.9666666666667, "x": "そういう人に、物の行き先を重ねていくのね。"}, {"t": 551.0666666666667, "x": "そうだ。人の条件と物の行き先を、結びつけて調べた。"}, {"t": 554.95, "x": "それでも、山陽電車では届かなかった。"}, {"t": 557.6833333333333, "x": "条件に合う人は、きっとたくさんいたのね。"}, {"t": 560.4833333333333, "x": "腕のいい職人は、どの町にもいるからな。"}, {"t": 563.0833333333334, "x": "条件だけでは、一人にはしぼれない。"}, {"t": 565.5333333333333, "x": "やっぱり、決め手は物なのね。"}, {"t": 567.5666666666667, "x": "説明員の話は、ここから捜査の難しさへ移っていく。"}, {"t": 571.9, "x": "なぜこの種の事件は、なかなか解決しないのか。"}, {"t": 574.9666666666667, "x": "説明員は、国会で理由を三つ挙げた。"}, {"t": 577.7, "x": "三つ？"}, {"t": 578.45, "x": "一つ目は、犯人を見た人がいないことだ。"}, {"t": 581.1833333333333, "x": "時計じかけだから、犯人はもうその車両にいない。"}, {"t": 584.2166666666667, "x": "説明員は、一つの例を出している。"}, {"t": 586.6, "x": "前の年、新幹線のひかり号で起きた事件だ。"}, {"t": 589.8166666666667, "x": "新幹線でも？"}, {"t": 591.05, "x": "本の中にダイナマイトを仕掛けた事件だ。"}, {"t": 593.5666666666667, "x": "本は源氏物語だった。"}, {"t": 595.1666666666666, "x": "爆発はせず、未遂に終わった。"}, {"t": 597.4666666666667, "x": "よかった……。犯人は？"}, {"t": 599.0666666666667, "x": "少年だった。翌年の3月に捕まえている。"}, {"t": 602.1166666666667, "x": "ところが、捕まえてから写真を見せて回っても。"}, {"t": 605.0333333333333, "x": "鉄道の人も乗客も、その少年を覚えていなかった。"}, {"t": 608.6333333333333, "x": "一等車に乗ってたのに？"}, {"t": 610.2833333333333, "x": "そうだ。それほど人は他人を見ていない。"}, {"t": 612.7333333333333, "x": "二つ目は、爆発物が普通の荷物に見えることだ。"}, {"t": 616.0833333333334, "x": "網棚や座席に置かれると、事前にはまず気づけない。"}, {"t": 619.4166666666666, "x": "三つ目は？"}, {"t": 620.3666666666667, "x": "物の数があまりにも多いことだ。"}, {"t": 622.3333333333334, "x": "一つずつ追うと、どうしても時間がかかる。"}, {"t": 625.1, "x": "見た人はいない、気づけない、数が多い……。"}, {"t": 627.7, "x": "それでも警察は、物を追うしかなかった。"}, {"t": 630.25, "x": "では横須賀線には、何が残っていたのか。"}, {"t": 633.6833333333333, "x": "7月25日の国会で、説明員は物を一つずつ挙げた。"}, {"t": 637.75, "x": "まとめると、大きく7つになる。"}, {"t": 639.9666666666667, "x": "7つも残っていたのね。"}, {"t": 641.6833333333333, "x": "爆発で粉々になっても、部品は案外残るものなんだ。"}, {"t": 645.3333333333334, "x": "一つ目は、時間で電気を入れるタイムスイッチ。"}, {"t": 648.15, "x": "二つ目は、乾電池を入れておくケース。"}, {"t": 650.5666666666667, "x": "三つ目は、全体を包んでいた新聞紙。"}, {"t": 653.1833333333333, "x": "四つ目は、中身を入れていた菓子の箱。"}, {"t": 655.7, "x": "五つ目は、それを全部入れた紙の買い物袋。"}, {"t": 658.6666666666666, "x": "六つ目は、配管に使う金具。"}, {"t": 660.7166666666667, "x": "三方継ぎ手と呼ぶ物だ。"}, {"t": 662.4666666666667, "x": "七つ目は、爆発した火薬そのものだ。"}, {"t": 665.2833333333333, "x": "最初に言ってた紙袋と新聞と菓子箱も入ってるのね。"}, {"t": 668.9333333333333, "x": "そうだ。当時の記者も、車内で\n同じような物を見ている。"}, {"t": 672.3666666666667, "x": "タイムスイッチ、電池、鉄パイプ、菓子箱、新聞紙。"}, {"t": 676.0166666666667, "x": "それに紙袋の破片だ。"}, {"t": 677.85, "x": "組み立て方は……話さないのよね。"}, {"t": 680.1666666666666, "x": "話さない。この回で扱うのは、\n何が使われていたかまでだ。"}, {"t": 683.9666666666667, "x": "大事なのは、どれも店で買える物だったということだ。"}, {"t": 687.2666666666667, "x": "特別な物じゃないってこと？"}, {"t": 689.2, "x": "そうだ。だから一つ一つが、\n数え切れないほど出回っていた。"}, {"t": 693.1666666666666, "x": "山陽電車と同じで、また気の遠くなる話ね。"}, {"t": 696.3833333333333, "x": "ところが、7つのうちいくつかには「狭さ」があった。"}, {"t": 699.9666666666667, "x": "狭さ？"}, {"t": 700.75, "x": "出回った数や場所が、思ったより限られていたんだ。"}, {"t": 704.5833333333334, "x": "まずタイムスイッチから見ていこう。"}, {"t": 706.4333333333333, "x": "ナショナル製だった。"}, {"t": 707.5333333333333, "x": "今で言うパナソニックだな。"}, {"t": 709.35, "x": "家電のメーカーね。"}, {"t": 710.6333333333333, "x": "家庭で、決まった時間に電気を入れるための道具だ。"}, {"t": 713.7333333333333, "x": "1963年から64年にかけて、約1万個作られた。"}, {"t": 718.4166666666666, "x": "1万個。山陽電車の時計より多いわね。"}, {"t": 721.2666666666667, "x": "しかも全国に出回っていた。"}, {"t": 723.1333333333333, "x": "これだけだと、とても追い切れない。"}, {"t": 725.25, "x": "じゃあ、手がかりにならないの？"}, {"t": 727.1, "x": "説明員は、中を開けると特徴があると言っている。"}, {"t": 730.2, "x": "いろいろな特徴がある、という言い方だ。"}, {"t": 732.6666666666666, "x": "同じ製品でも、見分ける手がかりがあるのね。"}, {"t": 735.5333333333333, "x": "そうだ。その違いから出荷先をしぼろうとした。"}, {"t": 738.5166666666667, "x": "工場、問屋、電器店と、順番にさかのぼる捜査だ。"}, {"t": 742.2666666666667, "x": "気が遠くなるわね。"}, {"t": 743.6333333333333, "x": "説明員自身が「ばく大な量」と言っている。"}, {"t": 746.5333333333333, "x": "ただ、物の捜査はこれ一つで終わらない。"}, {"t": 749.1, "x": "別々の物の行き先を重ねていくんだ。"}, {"t": 751.7666666666667, "x": "重ねる？"}, {"t": 752.6166666666667, "x": "タイムスイッチを買った人。"}, {"t": 754.1166666666667, "x": "電池ケースを持っていた人。"}, {"t": 755.9166666666666, "x": "同じ新聞を読んでいた人。"}, {"t": 757.7, "x": "その全部に当てはまる人は、ぐっと少なくなる。"}, {"t": 760.7833333333333, "x": "網の目を重ねていく感じね。"}, {"t": 762.7833333333333, "x": "そうだ。次の電池ケースは、\nその網をかなり細かくした。"}, {"t": 767.0166666666667, "x": "二つ目の物、電池を入れていたケースだ。"}, {"t": 769.5666666666667, "x": "これは、あるテープレコーダーの部品だった。"}, {"t": 772.1166666666667, "x": "テープレコーダー？"}, {"t": 773.2333333333333, "x": "音を録音して聞く機械だ。"}, {"t": 774.8833333333333, "x": "持ち運べる型だった。"}, {"t": 776.45, "x": "クラウンという会社の、CTR5310型という製品だ。"}, {"t": 780.4333333333333, "x": "型番まで分かったのね。"}, {"t": 782.1166666666667, "x": "部品の形と刻印から割り出せたんだろう。"}, {"t": 784.75, "x": "この型は、1964年の11月から翌年4月まで売られた。"}, {"t": 789.4166666666666, "x": "国内向けに約1万3500台だ。"}, {"t": 792.2, "x": "半年だけ売られた機械なのね。"}, {"t": 794.3333333333334, "x": "そうだ。しかも当時のテープレコーダーは高い。"}, {"t": 797.0, "x": "誰もが持っている物ではなかった。"}, {"t": 799.1833333333333, "x": "持ってる人は限られてた、ってことね。"}, {"t": 801.65, "x": "警察は、売った店と買った人を順に調べていった。"}, {"t": 804.95, "x": "資料によれば、男はこの機械を\n英会話の勉強に買っていた。"}, {"t": 808.8, "x": "勉強のための道具が、こんなことに……。"}, {"t": 811.2833333333333, "x": "本来の使い方とは全く違う使われ方だな。"}, {"t": 814.4, "x": "ただ、この時点で警察はまだ男を知らない。"}, {"t": 817.2333333333333, "x": "1万3500台を、一台ずつ、たどる段階だった。"}, {"t": 821.0333333333333, "x": "1万個のスイッチに、1万3500台の機械。"}, {"t": 824.4833333333333, "x": "両方に当てはまる人は、まだ見えてこない。"}, {"t": 827.0666666666667, "x": "次の物は、さらに人を選ぶ物だった。"}, {"t": 830.3333333333334, "x": "七つ目の物、爆発した火薬だ。"}, {"t": 832.8, "x": "調べると、日本油脂という会社の製品だと分かった。"}, {"t": 836.1333333333333, "x": "「SS」と呼ばれる種類だった。"}, {"t": 838.2833333333333, "x": "何に使う火薬なの？"}, {"t": 839.9166666666666, "x": "猟銃だ。散弾の弾を飛ばすための火薬だった。"}, {"t": 843.15, "x": "狩りの道具の火薬ね。"}, {"t": 844.7333333333333, "x": "1967年の1年間で、約60トン作られていた。"}, {"t": 849.1666666666666, "x": "60トン……量はすごく多いわね。"}, {"t": 851.4166666666666, "x": "量は多い。だが、使う人は限られている。"}, {"t": 854.25, "x": "あ、猟銃を持ってる人ってこと？"}, {"t": 856.45, "x": "そうだ。猟銃を持つには警察の許可がいる。"}, {"t": 859.1666666666666, "x": "つまり、持っている人の名簿は警察の手元にある。"}, {"t": 862.4333333333333, "x": "それは大きいわね。"}, {"t": 863.7166666666667, "x": "説明員もそこを強調している。"}, {"t": 865.75, "x": "東京、神奈川、\nその周りの県の猟銃の持ち主を全部調べる。"}, {"t": 869.9833333333333, "x": "全部？"}, {"t": 870.7, "x": "全部だ。神奈川県警が、\n周りの県の協力を得てやると。"}, {"t": 874.5666666666667, "x": "これで一気に人がしぼれそう。"}, {"t": 876.5, "x": "それでも、まだ数千、数万の単位だろう。"}, {"t": 879.2333333333333, "x": "猟銃の持ち主で、あの型の機械を持っていた人。"}, {"t": 882.55, "x": "網の目が、また一つ重なったわね。"}, {"t": 885.1, "x": "そして、場所をしぼる物が別にあった。"}, {"t": 887.5333333333333, "x": "包んでいた新聞紙だ。"}, {"t": 889.6833333333333, "x": "その前に、紙袋の話をしておこう。"}, {"t": 892.2166666666667, "x": "全部を入れて網棚に置いた、あの袋だ。"}, {"t": 894.9166666666666, "x": "最初に出てきた紙袋ね。"}, {"t": 896.8833333333333, "x": "底が角型になったショッピングバッグだった。"}, {"t": 899.5833333333334, "x": "1966年から、約50万枚作られていた。"}, {"t": 903.4666666666667, "x": "50万枚は、さすがに追えないわよね。"}, {"t": 906.0, "x": "追えない。だから警察は別の手を使った。"}, {"t": 908.75, "x": "別の手？"}, {"t": 909.6666666666666, "x": "実物や、実物そっくりのポスターを作った。"}, {"t": 912.7166666666667, "x": "それを街頭や駅に貼り出したんだ。"}, {"t": 914.9333333333333, "x": "見覚えのある人はいませんか、ってことね。"}, {"t": 917.5, "x": "そうだ。説明員は\n「御協力を願っている」と言っている。"}, {"t": 921.1333333333333, "x": "人の記憶を集める捜査だな。"}, {"t": 923.2333333333333, "x": "網棚の袋なんて、誰も覚えてないって話だったけど。"}, {"t": 926.9166666666666, "x": "置いたところは覚えていなくても。"}, {"t": 928.7833333333333, "x": "持って歩いていた人を見た人はいるかもしれない。"}, {"t": 931.65, "x": "なるほど、乗る前の姿ね。"}, {"t": 933.6833333333333, "x": "同じ考えで、菓子箱や配管の金具も調べられた。"}, {"t": 937.1, "x": "配管の金具は日本鋼管の製品だった。"}, {"t": 939.8833333333333, "x": "ガスや水道、プロパンガスの管をつなぐ物だ。"}, {"t": 942.9166666666666, "x": "それも、どこにでもありそう。"}, {"t": 944.75, "x": "月に1万3000個ほど作られていた。"}, {"t": 947.0833333333334, "x": "比較的新しい物とみて追った。"}, {"t": 949.4666666666667, "x": "どれも、ありふれた物ばかりね。"}, {"t": 951.5666666666667, "x": "だからこそ、一番ありふれた物が効いてくる。新聞だ。"}, {"t": 955.7333333333333, "x": "新聞の話には、一人の新聞記者が関わっている。"}, {"t": 959.1333333333333, "x": "当時、朝日新聞で警視庁を担当していた記者だ。"}, {"t": 962.5333333333333, "x": "記者が捜査に関わったの？"}, {"t": 964.3833333333333, "x": "正確には、記者が独自に見つけた手がかりだ。"}, {"t": 967.3166666666667, "x": "この記者は、のちに日本記者クラブに\n取材の記録を残した。"}, {"t": 971.05, "x": "事件の日、記者たちは現場に向かった。"}, {"t": 973.5333333333333, "x": "だが電車は、もう大船電車区の車庫に入っていた。"}, {"t": 976.8333333333334, "x": "車両はもう現場にないのね。"}, {"t": 978.65, "x": "その夜、記者は一人で車庫を訪れた。"}, {"t": 981.1333333333333, "x": "電車の外側を、ぐるりと見て回った。"}, {"t": 983.7666666666667, "x": "外側を？"}, {"t": 984.7166666666667, "x": "すると窓枠の外に、白い\n米粒のような物が付いていた。"}, {"t": 988.5333333333333, "x": "お弁当のご飯つぶかしら。"}, {"t": 990.3333333333334, "x": "記者もそう思ったらしい。はがし取ってみた。"}, {"t": 992.9166666666666, "x": "指先で広げていくと、それは新聞紙の切れ端だった。"}, {"t": 996.5666666666667, "x": "新聞の切れ端が、窓の外に？"}, {"t": 998.9333333333333, "x": "爆発で紙が細かくちぎれた。"}, {"t": 1001.0333333333333, "x": "開いていた窓から外へ飛び出し、窓枠に張り付いた。"}, {"t": 1004.3833333333333, "x": "記者はそう考えている。"}, {"t": 1005.9833333333333, "x": "6月だから、窓を開けてたのね。"}, {"t": 1008.35, "x": "そうだろう。その小さな紙片に、文字が残っていた。"}, {"t": 1011.7, "x": "何が書いてあったの？"}, {"t": 1013.15, "x": "表と裏、両方に広告の一部が残っていたんだ。"}, {"t": 1016.9666666666667, "x": "紙片の表は広告の欄だった。"}, {"t": 1018.9833333333333, "x": "皇太子一家についての記事を\n宣伝する広告らしかった。"}, {"t": 1022.5333333333333, "x": "雑誌の広告かしら。"}, {"t": 1024.1166666666666, "x": "週刊誌の記事だったようだ。"}, {"t": 1025.7166666666667, "x": "記者はそこから時期を推し量った。"}, {"t": 1027.8333333333333, "x": "裏は、運送会社の求人広告だった。"}, {"t": 1030.6166666666666, "x": "会社の名前は読めたの？"}, {"t": 1032.3, "x": "一字しか読めなかった。"}, {"t": 1033.8, "x": "だが、電話番号の市外局番が切れ切れに残っていた。"}, {"t": 1037.3666666666666, "x": "市外局番で、場所が分かるのね。"}, {"t": 1039.7, "x": "そうだ。東京の武蔵野市の会社だと分かった。"}, {"t": 1042.7666666666667, "x": "武蔵野市って、東京の西の方よね。"}, {"t": 1045.3666666666666, "x": "記者は大船署の近くに借りた家で、作業を続けた。"}, {"t": 1048.7, "x": "武蔵野の支局に問い合わせ、\nその運送会社に電話をかけた。"}, {"t": 1052.6, "x": "夜中に？"}, {"t": 1053.4666666666667, "x": "出たのは宿直の担当者だった。"}, {"t": 1055.6333333333334, "x": "その人が、こう教えてくれた。"}, {"t": 1057.6166666666666, "x": "あの求人広告は、毎日新聞か\nサンケイ新聞に出したはずだ。"}, {"t": 1061.6666666666667, "x": "東京都下の、多摩地方の版だ、と。"}, {"t": 1064.2333333333333, "x": "じゃあ、新聞の種類も地域も分かったのね。"}, {"t": 1067.0166666666667, "x": "記者はそれを書いた。だが翌朝の扱いは小さかった。"}, {"t": 1070.3333333333333, "x": "1面の、わずか3行だった。"}, {"t": 1072.5166666666667, "x": "3行だけ？"}, {"t": 1073.55, "x": "記者は抗議した。すると夕刊の1面に大きく載った。"}, {"t": 1076.95, "x": "見出しは「犯人は三多摩地方か」だった。"}, {"t": 1080.4166666666667, "x": "この夕刊の記事には、ほかの社の記者も反応した。"}, {"t": 1083.65, "x": "産経新聞の記者が、捜査本部へ駆けつけたんだ。"}, {"t": 1087.0333333333333, "x": "自分の会社の新聞かもしれないものね。"}, {"t": 1089.6666666666667, "x": "そうだ。記者は幹部にこう聞いた。"}, {"t": 1091.7166666666667, "x": "残された新聞は、サンケイですか。"}, {"t": 1094.1333333333334, "x": "幹部は何て？"}, {"t": 1095.25, "x": "これから調べるところです、と答えた。"}, {"t": 1097.7833333333333, "x": "警察より先に、記者が新聞を割り出しかけてたのね。"}, {"t": 1101.3, "x": "少なくとも、記事が出た時点ではそうだった。"}, {"t": 1104.0833333333333, "x": "産経の記者は、朝日の記者の方を\n向いて感心していたという。"}, {"t": 1108.0333333333333, "x": "ライバルなのに、ちょっといい話ね。"}, {"t": 1110.25, "x": "記者同士の競争が、事件の報道を\n前に進めた面はある。"}, {"t": 1114.05, "x": "でも、記事が出ると犯人にも伝わっちゃわない？"}, {"t": 1116.9666666666667, "x": "そこは難しいところだな。"}, {"t": 1118.6666666666667, "x": "新聞が手がかりだと、犯人も知ることになる。"}, {"t": 1121.7333333333333, "x": "逃げたり、証拠を捨てたりしないかしら。"}, {"t": 1124.2, "x": "ただ、配られた新聞はもう取り戻せない。"}, {"t": 1126.7666666666667, "x": "販売店の配達の記録も、犯人には消せない。"}, {"t": 1130.0833333333333, "x": "あ、そうか。"}, {"t": 1131.1, "x": "犯人が隠せるのは自分の手元の物だけだ。"}, {"t": 1133.9833333333333, "x": "町に残った記録までは、どうにもできなかった。"}, {"t": 1137.55, "x": "では、警察はその新聞をどう特定したのか。"}, {"t": 1140.5166666666667, "x": "7月25日の国会で、説明員がはっきり答えている。"}, {"t": 1144.3666666666666, "x": "爆弾を包んでいたのは、毎日新聞だった。"}, {"t": 1147.3166666666666, "x": "1968年の4月17日付、13版の東京都下版だ。"}, {"t": 1152.35, "x": "記者の読みが当たってたのね。"}, {"t": 1154.1666666666667, "x": "新聞の種類と地域は、記者の見立ての通りだった。"}, {"t": 1157.3666666666666, "x": "日付は、記者の初めの見立てより一日二日あとだ。"}, {"t": 1160.8333333333333, "x": "東京都下版って、何？"}, {"t": 1162.7, "x": "同じ日の新聞でも、地域ごとに中身が少し違う。"}, {"t": 1166.0333333333333, "x": "東京の23区の外、三多摩に配る版のことだ。"}, {"t": 1169.6166666666666, "x": "じゃあ、配られた場所が限られるのね。"}, {"t": 1172.0, "x": "そうだ。この版は6万8000部刷られていた。"}, {"t": 1174.8, "x": "そして三多摩の地方で売られていた。"}, {"t": 1177.0833333333333, "x": "6万8000部。山陽電車の14万部の半分以下ね。"}, {"t": 1180.8333333333333, "x": "しかも新聞は、毎朝家に届けられる物だ。"}, {"t": 1183.9, "x": "あ、配達されてる家が分かる……。"}, {"t": 1185.95, "x": "そうだ。販売店には配達先の記録がある。"}, {"t": 1188.9333333333334, "x": "説明員は、こういう方針だと述べている。"}, {"t": 1191.5, "x": "販売店、それから購入先を、全部解明する。"}, {"t": 1194.85, "x": "全部！"}, {"t": 1195.55, "x": "警視庁と神奈川県警が力を合わせて進めていた。"}, {"t": 1198.9666666666667, "x": "電車は神奈川、新聞は東京なのね。"}, {"t": 1201.65, "x": "そうだ。事件が県の境を越えていた。"}, {"t": 1204.1333333333334, "x": "犯人は、三多摩に住んでいるかもしれない。"}, {"t": 1207.3666666666666, "x": "もう一つの物、菓子箱の話をしよう。"}, {"t": 1209.9833333333333, "x": "中身を入れていたのは、菓子の空き箱だった。"}, {"t": 1212.65, "x": "名古屋市内の、もなかを作る店が使っていた箱だ。"}, {"t": 1216.0666666666666, "x": "もなかの箱？"}, {"t": 1217.2, "x": "あんこを薄い皮ではさんだ和菓子だな。"}, {"t": 1219.5, "x": "名古屋のお菓子なのに、事件は\n神奈川で、新聞は東京。"}, {"t": 1223.1833333333334, "x": "そうなんだ。場所がばらばらだった。"}, {"t": 1225.2833333333333, "x": "説明員は、この箱についてはこう言っている。"}, {"t": 1227.9833333333333, "x": "業者も見当がつかないくらい量が多い。"}, {"t": 1230.4833333333333, "x": "じゃあ、手がかりにならないんじゃ。"}, {"t": 1232.4, "x": "それでも、何か手がかりにならないかと調べていると。"}, {"t": 1235.7166666666667, "x": "あきらめてはいないのね。"}, {"t": 1237.2333333333333, "x": "記者の記録にも、この箱は\n手がかりの一つとして出てくる。"}, {"t": 1240.8666666666666, "x": "名古屋市内で売られていた最中の菓子箱、と。"}, {"t": 1243.7166666666667, "x": "でも、三多摩に住む人が名古屋の箱を持ってるって。"}, {"t": 1247.05, "x": "そこがこの箱の意味だ。"}, {"t": 1248.6, "x": "自分で名古屋へ行ったか、誰かにもらったか。"}, {"t": 1251.4166666666667, "x": "お土産ね！"}, {"t": 1252.3333333333333, "x": "そうだ。もらった物なら、渡した人がいる。"}, {"t": 1255.2333333333333, "x": "渡した人は、たいてい覚えている。"}, {"t": 1257.5166666666667, "x": "人の記憶につながる箱なのね。"}, {"t": 1259.75, "x": "新聞が地域をしぼり、箱が人をしぼった。"}, {"t": 1262.5, "x": "その二つが重なるまで、あと4か月かかる。"}, {"t": 1266.05, "x": "7月25日の報告の終わりに、説明員はこう述べた。"}, {"t": 1269.8, "x": "何の関係も無い人を殺傷する\n事件は、社会公共の敵だ。"}, {"t": 1273.9, "x": "最初の方で出てきた言葉ね。"}, {"t": 1275.9333333333334, "x": "そうだ。続けてこう言っている。"}, {"t": 1277.8, "x": "検挙するのが私ども警察の責務であると痛感している。"}, {"t": 1281.3833333333334, "x": "国民の皆さまの協力を得て、一日も早く解決したい。"}, {"t": 1285.35, "x": "協力って、さっきのポスターみたいなこと？"}, {"t": 1288.1166666666666, "x": "そうだ。物の捜査には、人の記憶がどうしても要る。"}, {"t": 1291.45, "x": "説明員は、横須賀線の事件が\n起きた時のことも話した。"}, {"t": 1295.3666666666666, "x": "すぐに兵庫県警と警視庁を集めて会議を開いた。"}, {"t": 1298.6666666666667, "x": "山陽電車の兵庫と、新聞の東京ね。"}, {"t": 1301.4833333333333, "x": "そうだ。物の捜査は全国に広がるからだ。"}, {"t": 1304.3333333333333, "x": "警察庁が全体をまとめて、全国で追う態勢にした。"}, {"t": 1307.9833333333333, "x": "県ごとの捜査じゃ足りないのね。"}, {"t": 1309.9666666666667, "x": "資料によれば、この事件は\n警察庁の広域重要指定事件になった。"}, {"t": 1314.25, "x": "番号は107号だ。"}, {"t": 1315.9833333333333, "x": "広域重要指定って、何？"}, {"t": 1318.0666666666666, "x": "いくつもの県にまたがる重大な事件を、\n国がまとめて指定するものだ。"}, {"t": 1322.3, "x": "一つの事件だけで指定されたのは、\nこれが唯一の例とされる。"}, {"t": 1326.1833333333334, "x": "それだけ特別扱いだったのね。"}, {"t": 1328.45, "x": "そして秋、同じ指定を受ける事件がもう一つ起きる。"}, {"t": 1331.85, "x": "108号……？"}, {"t": 1332.8833333333334, "x": "そうだ。その話は次の章で少しだけする。"}, {"t": 1336.4666666666667, "x": "1968年の秋、警察は大きな事件を同時に抱えていた。"}, {"t": 1341.0166666666667, "x": "12月、国家公安委員長の荒木萬壽夫が\n国会でこう述べている。"}, {"t": 1345.0333333333333, "x": "最近の犯罪で注目されるのは、三つの種類の事件だ。"}, {"t": 1348.85, "x": "三つ？"}, {"t": 1349.5833333333333, "x": "拳銃による連続射殺事件。"}, {"t": 1351.5833333333333, "x": "金融機関に対する強盗事件。"}, {"t": 1353.6833333333334, "x": "そして、列車などに対する爆破事件だ。"}, {"t": 1356.5, "x": "拳銃の事件って……。"}, {"t": 1357.95, "x": "秋に東京や京都などで続いた\n事件だ。これが108号になった。"}, {"t": 1362.0166666666667, "x": "この回では詳しく扱わない。"}, {"t": 1363.7666666666667, "x": "別の回で取り上げている。"}, {"t": 1365.5166666666667, "x": "金融機関の強盗は？"}, {"t": 1367.15, "x": "12月10日の、いわゆる三億円事件も、この頃だ。"}, {"t": 1370.8166666666666, "x": "同じ年なのね……。"}, {"t": 1372.1333333333334, "x": "そうだ。大きな事件が、立て続けに起きていた。"}, {"t": 1375.3, "x": "警察は手が回ったのかしら。"}, {"t": 1377.2833333333333, "x": "当時の国会では、警察は手が\n足りているのかという声も出た。"}, {"t": 1380.9666666666667, "x": "刑事局長は、刑事事件が\nおろそかになることはないと答えている。"}, {"t": 1385.0333333333333, "x": "大変な年だったのね。"}, {"t": 1386.7666666666667, "x": "その中で、横須賀線の捜査は地道に続いていた。"}, {"t": 1390.1333333333334, "x": "新聞の配達先を、一軒ずつ当たる作業だ。"}, {"t": 1393.3, "x": "派手さは全く無いわね。"}, {"t": 1394.9666666666667, "x": "無い。だが、その地道さが結果を出す。"}, {"t": 1397.55, "x": "国家公安委員長は同じ演説でこう言った。"}, {"t": 1400.2333333333333, "x": "幸い横須賀線電車爆破事件は、解決を見た。"}, {"t": 1404.1833333333334, "x": "捜査本部は、都下に配られた\n毎日新聞の配達先を調べた。"}, {"t": 1408.3333333333333, "x": "記者の記録にも、そう書かれている。"}, {"t": 1410.7, "x": "6万8000部の配達先ね。"}, {"t": 1412.9333333333334, "x": "そうだ。その家々に、ほかの物の網を重ねていく。"}, {"t": 1416.2166666666667, "x": "猟銃の持ち主の名簿。"}, {"t": 1417.65, "x": "テープレコーダーを買った人。"}, {"t": 1419.4833333333333, "x": "二つも三つも重なる家は、少ないわよね。"}, {"t": 1422.4833333333333, "x": "少ない。資料によれば、一人の男が浮かんだ。"}, {"t": 1425.5333333333333, "x": "東京の日野市に住む、25歳の大工だった。"}, {"t": 1428.6666666666667, "x": "日野市って、三多摩の中よね。"}, {"t": 1430.8833333333334, "x": "そうだ。資料によれば男は毎日新聞を取っていた。"}, {"t": 1434.1833333333334, "x": "そして、猟銃の許可を受けて散弾銃を持っていた。"}, {"t": 1437.45, "x": "新聞と火薬が、一人に重なったのね。"}, {"t": 1440.2666666666667, "x": "大工だから、道具の扱いにも慣れていた。"}, {"t": 1443.0333333333333, "x": "でも、それだけで犯人とは言えないわよね。"}, {"t": 1445.7166666666667, "x": "言えない。新聞を取る\n猟銃の持ち主は、ほかにもいる。"}, {"t": 1449.0, "x": "ここで、名古屋の箱が効いてくる。"}, {"t": 1451.2166666666667, "x": "お土産の話ね。"}, {"t": 1452.6166666666666, "x": "資料によれば、警察はある事実を突き止めた。"}, {"t": 1455.5166666666667, "x": "前の年、男の隣の家の夫婦が\n新婚旅行に出かけていた。"}, {"t": 1459.45, "x": "行き先で、名古屋の最中を土産に買っていた。"}, {"t": 1462.4166666666667, "x": "まさか……。"}, {"t": 1463.2166666666667, "x": "その最中を、隣に住む男に渡していた。"}, {"t": 1466.2, "x": "箱が、男の家に入っていたのね。"}, {"t": 1468.7, "x": "新聞、火薬、そして箱。"}, {"t": 1470.55, "x": "三つの物が一人に重なった。"}, {"t": 1473.3333333333333, "x": "1968年11月9日。"}, {"t": 1476.0, "x": "事件から5か月近くたっていた。"}, {"t": 1478.25, "x": "資料によれば、捜査員は男の仕事場を訪ねた。"}, {"t": 1481.5333333333333, "x": "いきなり逮捕じゃないのね。"}, {"t": 1483.1833333333334, "x": "まず、任意で警察へ来てほしいと頼んだ。"}, {"t": 1485.85, "x": "そして集めた証拠を男に示した。"}, {"t": 1488.3, "x": "男はどうしたの？"}, {"t": 1489.6333333333334, "x": "資料によれば、男は犯行を\n認めた。そのまま逮捕された。"}, {"t": 1493.5833333333333, "x": "……認めたのね。"}, {"t": 1494.7, "x": "横須賀線の電車に、\n時限式の爆弾を仕掛けたと話した。"}, {"t": 1498.6166666666666, "x": "記者の記録では、ここは短く書かれている。"}, {"t": 1501.3666666666666, "x": "11月、東京都日野市に住む容疑者が\n逮捕され、事件は解決した。"}, {"t": 1506.1333333333334, "x": "記者は、自分の記事を思い出したでしょうね。"}, {"t": 1508.8333333333333, "x": "「書いたとおりになった」と振り返っている。"}, {"t": 1511.3333333333333, "x": "三多摩の新聞、っていう記事ね。"}, {"t": 1513.4333333333334, "x": "そうだ。窓枠の紙片から始まった見立てだった。"}, {"t": 1516.55, "x": "ここで一つ、はっきりさせておきたい。"}, {"t": 1519.0333333333333, "x": "なに？"}, {"t": 1519.6666666666667, "x": "この男は、のちに裁判で有罪が確定している。"}, {"t": 1522.8166666666666, "x": "犯人であることは、最高裁で刑が確定した事実だ。"}, {"t": 1526.35, "x": "ただ、この回では男の名前は出さない。"}, {"t": 1529.0, "x": "亡くなった方のご家族のことを考えて、よね。"}, {"t": 1532.1166666666666, "x": "そうだ。主役は男ではなく、\n男にたどり着いた物と人だ。"}, {"t": 1536.2166666666667, "x": "うん。"}, {"t": 1537.2333333333333, "x": "でも、どうして横須賀線だったの？"}, {"t": 1539.4666666666667, "x": "日野市からだと、ずいぶん遠いわよね。"}, {"t": 1541.8666666666666, "x": "そこに男の動機が関わっている。"}, {"t": 1544.0166666666667, "x": "資料によれば、男は山形県の出身だった。"}, {"t": 1547.0833333333333, "x": "結婚を約束した相手がいたが、別れることになった。"}, {"t": 1550.65, "x": "その恨みで……？"}, {"t": 1551.7, "x": "資料はそう書いている。"}, {"t": 1552.8666666666666, "x": "相手への恨みを晴らすためだった、と。"}, {"t": 1555.2, "x": "横須賀線は、その相手が山形から\n上京するときに使っていた路線だ。"}, {"t": 1559.85, "x": "じゃあ、相手を狙ったの？"}, {"t": 1561.5, "x": "記者の記録では、相手が使うと\n思われる電車に仕掛けた、とある。"}, {"t": 1565.4833333333333, "x": "だが資料によれば、相手は\nその頃その電車を使っていなかった。"}, {"t": 1569.45, "x": "……じゃあ、亡くなった方は。"}, {"t": 1571.1333333333334, "x": "全く関係の無い人だった。"}, {"t": 1572.95, "x": "乗っていた乗客全員がそうだ。"}, {"t": 1575.1, "x": "個人の恨みで、知らない人たちが巻き込まれたのね。"}, {"t": 1578.4, "x": "記者は、うっぷん晴らしだったと書いている。"}, {"t": 1580.95, "x": "そんな理由で……。"}, {"t": 1582.05, "x": "自分の気持ちの問題を、無関係の大勢にぶつけた。"}, {"t": 1585.5, "x": "網棚を選んだのも、そのせい？"}, {"t": 1587.6166666666666, "x": "網棚は、置いた人が誰かを分からなくする場所だ。"}, {"t": 1590.7166666666667, "x": "そして、誰が下に座るかも選べない場所だ。"}, {"t": 1593.7166666666667, "x": "誰に当たってもいい、ってことよね。"}, {"t": 1595.8333333333333, "x": "裁判は、まさにそこを問題にした。"}, {"t": 1598.8333333333333, "x": "逮捕の翌月、国会で警察のまとめが述べられた。"}, {"t": 1602.1833333333334, "x": "1968年12月17日の衆議院、19日の参議院だ。"}, {"t": 1607.1166666666666, "x": "どちらも同じ人？"}, {"t": 1608.5, "x": "国家公安委員長の荒木萬壽夫だ。"}, {"t": 1610.5166666666667, "x": "就任したばかりだった。"}, {"t": 1612.1666666666667, "x": "その所信の中に、横須賀線の事件が出てくる。"}, {"t": 1615.3333333333333, "x": "幸い横須賀線電車爆破事件については、"}, {"t": 1618.1166666666666, "x": "国民各位の御協力により解決を見た。"}, {"t": 1620.9, "x": "国民の協力、って言葉が入ってるのね。"}, {"t": 1623.7333333333333, "x": "そうだ。ポスター、配達先、土産を覚えていた人。"}, {"t": 1627.2, "x": "たくさんの人の記憶がつながった結果だった。"}, {"t": 1630.1166666666666, "x": "記者の紙片もね。"}, {"t": 1631.4833333333333, "x": "そうだな。委員長は続けて、こう述べている。"}, {"t": 1634.2333333333333, "x": "広域の捜査態勢を、さらに充実させる。"}, {"t": 1637.0333333333333, "x": "捜査のやり方を、科学的で合理的なものにしていく。"}, {"t": 1640.5666666666666, "x": "物の捜査を、もっと速くしたいってことね。"}, {"t": 1643.4166666666667, "x": "そうだ。山陽電車の事件は、まだ解決していなかった。"}, {"t": 1647.1, "x": "1年以上追っても届かない事件があった。"}, {"t": 1649.75, "x": "横須賀線が解決できて、\n山陽電車ができなかったのは？"}, {"t": 1653.6166666666666, "x": "資料からは、はっきりとは言えない。"}, {"t": 1655.65, "x": "ただ、横須賀線には配られた\n地域の狭い新聞があった。"}, {"t": 1659.2666666666667, "x": "そして、人の手を渡った菓子箱があった。"}, {"t": 1662.0833333333333, "x": "物の「狭さ」が分かれ目だったのかもね。"}, {"t": 1664.9833333333333, "x": "その違いは大きかったと思う。"}, {"t": 1667.45, "x": "翌1969年の春にも、国会でこの事件が語られた。"}, {"t": 1671.8333333333333, "x": "3月25日の参議院、地方行政委員会だ。"}, {"t": 1675.1666666666667, "x": "まだ話題になってたのね。"}, {"t": 1676.8333333333333, "x": "この日は、未解決の事件が問題になっていた。"}, {"t": 1679.8833333333334, "x": "三億円事件、連続ピストル射殺事件、\n銀行の強盗事件だ。"}, {"t": 1684.2666666666667, "x": "どれも解決していなかったのね。"}, {"t": 1686.4, "x": "答えた警察庁の刑事局長は、こう言っている。"}, {"t": 1689.45, "x": "自慢するわけではないが、と前置きしてな。"}, {"t": 1692.05, "x": "ほとんど捜査不可能といわれた横須賀線事件なども、"}, {"t": 1695.25, "x": "克明な苦心惨たんの捜査を\n遂げて犯人に到着している。"}, {"t": 1699.0166666666667, "x": "捜査不可能って言われてたのね。"}, {"t": 1701.0666666666666, "x": "目撃者がいない。物はありふれている。\nそういう事件だった。"}, {"t": 1704.65, "x": "4月11日の衆議院、法務委員会でも出てくる。"}, {"t": 1707.8833333333334, "x": "国家公安委員長が、こう述べた。"}, {"t": 1710.0333333333333, "x": "近代的な捜査能力に、一人一人の警察官の使命感。"}, {"t": 1714.0333333333333, "x": "執念深い捜査努力が、功を奏した。"}, {"t": 1716.75, "x": "足で稼いだ、って感じね。"}, {"t": 1718.65, "x": "委員長は同じ答弁で、こんな言い方もしている。"}, {"t": 1721.55, "x": "足をすりこ木のようにしてでも、という言い方だ。"}, {"t": 1724.4333333333334, "x": "すりこ木？"}, {"t": 1725.2833333333333, "x": "すり減るほど歩き回る、という意味だな。"}, {"t": 1727.8166666666666, "x": "配達先を一軒ずつ、だもんね。"}, {"t": 1730.2333333333333, "x": "そうだ。5か月の捜査は、\nそういう仕事の積み重ねだった。"}, {"t": 1734.6, "x": "男は横浜地方裁判所に起訴された。"}, {"t": 1737.2166666666667, "x": "罪の名前はいくつもあった。"}, {"t": 1738.95, "x": "殺人、爆発物取締罰則違反、そして船車覆没致死だ。"}, {"t": 1743.5333333333333, "x": "船車覆没？　難しい言葉ね。"}, {"t": 1745.9333333333334, "x": "船や電車をひっくり返したり\n壊したりして、人を死なせる罪だ。"}, {"t": 1749.9666666666667, "x": "最高裁の判決の事件名にも、この言葉が入っている。"}, {"t": 1753.7166666666667, "x": "電車の事件ならではの罪なのね。"}, {"t": 1755.9666666666667, "x": "資料によれば、初公判は1968年の12月25日だった。"}, {"t": 1760.9166666666667, "x": "男は、起訴状に書かれた行為そのものは認めた。"}, {"t": 1764.1833333333334, "x": "じゃあ争うところは無かったの？"}, {"t": 1766.1, "x": "一つだけあった。殺意だ。"}, {"t": 1767.9833333333333, "x": "男は、人を殺すつもりは無かったと言い続けた。"}, {"t": 1771.2166666666667, "x": "爆弾を混んだ電車に置いて、それは……。"}, {"t": 1773.6666666666667, "x": "裁判所も、その言い分を\nそのままには受け取らなかった。"}, {"t": 1776.9833333333333, "x": "1969年の3月3日、検察は死刑を求めた。"}, {"t": 1781.2666666666667, "x": "死刑……。"}, {"t": 1781.9833333333333, "x": "亡くなった方は1人。だが、けがをした人は大勢いた。"}, {"t": 1785.4833333333333, "x": "そして、無関係の乗客を狙った事件だった。"}, {"t": 1788.65, "x": "判決はいつ？"}, {"t": 1789.8166666666666, "x": "資料によれば、求刑から17日後だ。"}, {"t": 1792.4833333333333, "x": "判決の中で、殺意の問題に一つの答えが出された。"}, {"t": 1796.25, "x": "殺すつもりは無かった、が通ったかどうか、ね。"}, {"t": 1799.3333333333333, "x": "鍵になったのは、事件の前に男がしていたことだった。"}, {"t": 1803.4666666666667, "x": "1969年3月20日、横浜地方裁判所の判決だ。"}, {"t": 1808.15, "x": "資料によれば、判決は求刑の通り死刑だった。"}, {"t": 1811.3833333333334, "x": "殺意は認められたの？"}, {"t": 1812.9833333333333, "x": "認められた。その理由が大事だ。"}, {"t": 1815.1833333333334, "x": "男は事件の前に、3回、爆発の試しをしていた。"}, {"t": 1818.9333333333334, "x": "試しって……前もって爆発させてみたってこと？"}, {"t": 1822.1, "x": "そうだ。資料はそう書いている。"}, {"t": 1823.95, "x": "だから男は、爆発が\nどれほどの力か十分に知っ {"t": 2054.35, "x": "……。"}, {"t": 2055.2833333333333, "x": "20年待て、と言った支援者たちの言葉は、"}, {"t": 2058.0666666666666, "x": "その時間の重さを分かっていたからだと思う。"}, {"t": 2060.7833333333333, "x": "事件のあとの時間は、\n遺族の側にもずっと流れてたのね。"}, {"t": 2064.4666666666667, "x": "そうだ。判決で終わる話ではなかった。"}, {"t": 2067.733333333333, "x": "ねえ、最初の紙袋の話に戻っていい？"}, {"t": 2070.5666666666666, "x": "いいぞ。"}, {"t": 2071.2166666666667, "x": "網棚の紙袋、誰も気にしなかったのよね。"}, {"t": 2074.3166666666666, "x": "そうだ。誰でも置ける場所に、誰でも持てる袋だった。"}, {"t": 2077.85, "x": "中身も、店で買える物ばかりだった。"}, {"t": 2080.4333333333334, "x": "1万個のスイッチ。1万3500台の機械。"}, {"t": 2083.633333333333, "x": "年に60トンの火薬。50万枚の袋。"}, {"t": 2086.6666666666665, "x": "どれも、数え切れないほどある物。"}, {"t": 2088.9, "x": "だが、6万8000部の新聞は配る地域が決まっていた。"}, {"t": 2092.483333333333, "x": "名古屋の最中の箱は、人の手から手へ渡っていた。"}, {"t": 2095.7833333333333, "x": "ありふれた物の中に、狭い物が混ざってたのね。"}, {"t": 2098.9666666666667, "x": "そして、その狭さを見つけたのは人だった。"}, {"t": 2101.8, "x": "窓枠の紙片をはがした記者。"}, {"t": 2103.766666666667, "x": "配達先を一軒ずつ当たった捜査員。"}, {"t": 2106.1833333333334, "x": "ポスターを見て、記憶をたどった人たち。"}, {"t": 2108.7833333333333, "x": "国民各位の協力、ね。"}, {"t": 2110.766666666667, "x": "そうだ。網棚の荷物は、置いた人を隠した。"}, {"t": 2113.8166666666666, "x": "だが、置いた人の暮らしまでは隠せなかった。"}, {"t": 2116.733333333333, "x": "取ってる新聞や、もらったお土産……。"}, {"t": 2119.05, "x": "1968年6月16日、父の日の上り電車。"}, {"t": 2123.25, "x": "見舞いの帰りだった人が、網棚の下にいた。"}, {"t": 2126.15, "x": "今回は、その一つの紙袋から\n始まった5か月を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
