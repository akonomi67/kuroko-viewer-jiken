<script>
const D={"name": "133", "file": "133_編集用", "dur": 2116.46665625, "segs": [], "subs": [{"t": 0.0, "x": "神奈川県を走る横須賀線の電車の網棚に、\n紙袋が一つ載っていた。"}, {"t": 4.733333333333333, "x": "底が四角い、どこにでもある買い物袋だ。"}, {"t": 7.533333333333333, "x": "誰が置いたのか、気にする人はいなかった。"}, {"t": 10.3, "x": "網棚の荷物なんて、いちいち見ないものね。"}, {"t": 13.133333333333333, "x": "その紙袋が、走っている電車の中で爆発した。"}, {"t": 16.716666666666665, "x": "えっ……。"}, {"t": 17.85, "x": "1968年6月16日。"}, {"t": 20.466666666666665, "x": "国鉄の横須賀線だ。"}, {"t": 22.183333333333334, "x": "場所は鎌倉市。大船駅の手前だった。"}, {"t": 24.866666666666667, "x": "乗っていた30代の会社員が亡くなった。"}, {"t": 27.466666666666665, "x": "ほかにも大勢の乗客がけがをした。"}, {"t": 29.783333333333335, "x": "犯人はその車両にいたの？"}, {"t": 31.633333333333333, "x": "いなかった。時計じかけの仕掛けだった。"}, {"t": 34.11666666666667, "x": "置いた人は、とっくに電車を降りていた。"}, {"t": 36.61666666666667, "x": "じゃあ手がかりは何も無いじゃない。"}, {"t": 38.516666666666666, "x": "残ったのは、粉々になった袋の中身だけだ。"}, {"t": 41.61666666666667, "x": "包み紙にした古い新聞が1枚。"}, {"t": 43.93333333333333, "x": "名古屋のもなか屋の菓子箱が1つ。"}, {"t": 46.13333333333333, "x": "ほかにもいくつかの部品があった。"}, {"t": 48.25, "x": "それで犯人が分かるものなの？"}, {"t": 50.233333333333334, "x": "分かった。5か月かかってな。"}, {"t": 52.233333333333334, "x": "その新聞は、6万8000部刷られたうちの1部だった。"}, {"t": 55.833333333333336, "x": "6万8000分の1……。"}, {"t": 57.5, "x": "今回は物から人へたどり着いた捜査の話だ。"}, {"t": 60.53333333333333, "x": "国会の記録と最高裁の判決、\n当時の記者の記録で追っていく。"}, {"t": 65.35, "x": "6月16日は日曜日だった。"}, {"t": 67.63333333333334, "x": "しかもその年の父の日にあたっていた。"}, {"t": 70.15, "x": "家族で出かけた人も多そうね。"}, {"t": 72.25, "x": "そうだ。電車は行楽帰りの客で混んでいた。"}, {"t": 75.06666666666666, "x": "走っていたのは、横須賀から東京へ向かう上り電車だ。"}, {"t": 78.55, "x": "鎌倉や逗子の海や寺から帰る人が乗る路線だな。"}, {"t": 81.88333333333334, "x": "日曜の午後の、のんびりした電車ね。"}, {"t": 84.36666666666666, "x": "10両の編成だった。"}, {"t": 85.83333333333333, "x": "電車は北鎌倉の駅を出て、大船の駅に近づいていた。"}, {"t": 89.56666666666666, "x": "時刻は午後3時すぎ。"}, {"t": 91.18333333333334, "x": "大船の手前ってことは、もうすぐ乗り換えの駅ね。"}, {"t": 94.33333333333333, "x": "そうだ。降りる準備をしていた人もいただろう。"}, {"t": 96.98333333333333, "x": "その時前から6両目で大きな音がした。"}, {"t": 99.65, "x": "網棚の上の荷物が爆発したんだ。"}, {"t": 102.15, "x": "……混んでる車両で。"}, {"t": 103.35, "x": "車内は悲鳴が飛び交う\n状態だったと、記者は書いている。"}, {"t": 106.66666666666667, "x": "のちの調べでは、置かれていた場所も分かった。"}, {"t": 109.38333333333334, "x": "車両の後ろの方、左側の向かい合った\n席の上の網棚だ。"}, {"t": 113.41666666666667, "x": "座っていた人の、ちょうど頭の上ね。"}, {"t": 115.96666666666667, "x": "そういう場所だった。"}, {"t": 117.18333333333334, "x": "網棚は誰でも荷物を置ける場所だ。"}, {"t": 119.4, "x": "置いた人を覚えている人は、まずいない。"}, {"t": 121.88333333333334, "x": "だから網棚を選んだのかしら。"}, {"t": 123.9, "x": "それは裁判の話のところで出てくる。"}, {"t": 126.88333333333334, "x": "爆発した場所は、大船の駅の少し手前だ。"}, {"t": 129.95, "x": "田園踏切と呼ばれる踏切のあたりとされた。"}, {"t": 132.88333333333333, "x": "電車はそこで止まったの？"}, {"t": 134.58333333333334, "x": "電車はそのあと、車庫に入れられた。"}, {"t": 136.8, "x": "大船電車区という、電車を置いておく場所だ。"}, {"t": 139.58333333333334, "x": "けがをした人たちは？"}, {"t": 141.13333333333333, "x": "翌朝の新聞は、死者1人、重軽傷28人と伝えた。"}, {"t": 145.4, "x": "28人も……。"}, {"t": 146.65, "x": "ただあとの裁判の数え方は少し違う。"}, {"t": 149.2, "x": "一審の判決が被害者として数えたのは15人だ。"}, {"t": 152.5, "x": "亡くなった方が1人、けがをした人が14人。"}, {"t": 155.61666666666667, "x": "新聞と判決で数がずれてるのね。"}, {"t": 158.03333333333333, "x": "なぜ違うのか、記録からははっきりしない。"}, {"t": 160.63333333333333, "x": "判決の数は、罪を問う相手として\n一人ずつ数えた人数だ。"}, {"t": 164.5, "x": "この回では、両方の数をそのまま並べておく。"}, {"t": 167.56666666666666, "x": "けがの重さもいろいろだったのね。"}, {"t": 169.61666666666667, "x": "そうだ。破片を受けてけがをした人が多かった。"}, {"t": 172.55, "x": "中には長く後に残るけがをした人もいた。"}, {"t": 175.16666666666666, "x": "……。"}, {"t": 176.1, "x": "この回では、その方々のお名前は扱わない。"}, {"t": 179.01666666666668, "x": "けがの様子も、細かくは話さない。"}, {"t": 181.43333333333334, "x": "うん、それでいいと思う。"}, {"t": 183.48333333333332, "x": "亡くなったのは、東京の武蔵野市に住む会社員だ。"}, {"t": 186.7, "x": "30代の男性だった。"}, {"t": 188.5, "x": "日曜にどうして横須賀線に乗っていたの？"}, {"t": 191.16666666666666, "x": "当時の記者が、そのことを書き残している。"}, {"t": 193.85, "x": "生まれて間もない娘が、逗子の病院に入院していた。"}, {"t": 197.3, "x": "妻がそこに付き添っていた。"}, {"t": 199.18333333333334, "x": "じゃあ娘さんのお見舞いに行っていたのね。"}, {"t": 201.58333333333334, "x": "そうだ。病院で娘と過ごし、別れて帰る途中だった。"}, {"t": 205.33333333333334, "x": "父の日に生まれたばかりの娘に会いに……。"}, {"t": 207.83333333333334, "x": "その帰りの電車で、事件に遭った。"}, {"t": 210.25, "x": "……言葉が出ない。"}, {"t": 211.43333333333334, "x": "この方は爆発した荷物とは何の関係も無い。"}, {"t": 214.45, "x": "たまたまその車両の、その席にいただけだ。"}, {"t": 217.33333333333334, "x": "犯人とももちろん関係ないのよね。"}, {"t": 219.66666666666666, "x": "関係ない。会ったことも無い相手だ。"}, {"t": 221.9, "x": "警察庁の担当者は、国会でこう言っている。"}, {"t": 224.78333333333333, "x": "何の関係も無い人を殺傷する\n事件は、社会公共の敵だ、と。"}, {"t": 229.18333333333334, "x": "本当にそうね。"}, {"t": 230.38333333333333, "x": "この言葉が出た日のことは、あとで詳しく話す。"}, {"t": 233.41666666666666, "x": "ここでは一つだけ覚えておいてほしい。"}, {"t": 235.6, "x": "亡くなった方には、帰りを待つ家族がいた。"}, {"t": 238.45, "x": "うん。"}, {"t": 239.56666666666666, "x": "この回はその方を中心に置いたまま進める。"}, {"t": 242.96666666666667, "x": "爆発で車両そのものも大きく壊れた。"}, {"t": 245.48333333333332, "x": "その壊れ方は、最高裁の判決に書き残されている。"}, {"t": 249.16666666666666, "x": "判決に電車の壊れ方まで書いてあるの？"}, {"t": 251.86666666666667, "x": "あるんだ。罪の重さを決めるのに必要だったからな。"}, {"t": 255.05, "x": "判決はその車両を「5号車両」と呼んでいる。"}, {"t": 258.0833333333333, "x": "さっきは前から6両目って言ってなかった？"}, {"t": 260.7, "x": "記者の記録は6両目。"}, {"t": 262.1333333333333, "x": "判決の記録は5号車両だ。"}, {"t": 264.1333333333333, "x": "数え方の違いとみられる。"}, {"t": 265.7, "x": "今回は両方を並べておく。"}, {"t": 267.65, "x": "分かった。それでどう壊れたの？"}, {"t": 269.75, "x": "屋根と天井に張られた鉄板と合金の板が4枚。"}, {"t": 272.9166666666667, "x": "座席が7つ。網棚。窓ガラスが4枚。"}, {"t": 275.9, "x": "そのほかに、車体の付属品が8点。"}, {"t": 278.55, "x": "網棚そのものも壊れたのね。"}, {"t": 280.6, "x": "そうだ。そして破片が床いっぱいに散らばった。"}, {"t": 283.5, "x": "判決はこう書いている。"}, {"t": 284.96666666666664, "x": "乗客を乗せて安全な\n運行を続けることができない状態になった。"}, {"t": 289.01666666666665, "x": "電車として使えなくなった、ってことね。"}, {"t": 291.6666666666667, "x": "その一文が、あとで大事な意味を持つ。"}, {"t": 294.1166666666667, "x": "最高裁が「電車を壊す」とは\n何かを決めた判決なんだ。"}, {"t": 298.1166666666667, "x": "へえ。それは最後の方の話？"}, {"t": 300.3333333333333, "x": "最後の方だ。順番に行こう。"}, {"t": 302.35, "x": "まずは車内に誰が乗っていたかからだ。"}, {"t": 305.25, "x": "神奈川県警は、すぐに捜査本部を作った。"}, {"t": 308.1666666666667, "x": "1か月余りたった7月25日、国会で報告があった。"}, {"t": 312.21666666666664, "x": "どこの委員会？"}, {"t": 313.3666666666667, "x": "衆議院の運輸委員会だ。"}, {"t": 314.98333333333335, "x": "国会が開かれていない時期の、特別の審査だった。"}, {"t": 318.46666666666664, "x": "運輸委員会ってことは、鉄道の安全の話ね。"}, {"t": 321.7, "x": "そうだ。ある議員が、捜査は\nどうなっているかと聞いた。"}, {"t": 324.85, "x": "答えたのは、警察庁の説明員だ。"}, {"t": 327.3833333333333, "x": "捜査本部は140人の態勢だと述べた。"}, {"t": 330.31666666666666, "x": "140人も。"}, {"t": 331.6333333333333, "x": "捜査には二つの柱があると説明している。"}, {"t": 334.4, "x": "人の面からの捜査と、物の面からの捜査だ。"}, {"t": 337.6333333333333, "x": "人の面って、乗っていた人を調べること？"}, {"t": 340.48333333333335, "x": "そうだ。爆発した車両には66、7人が乗っていた。"}, {"t": 344.3666666666667, "x": "そのうち60人が、誰なのか分かった。"}, {"t": 347.1166666666667, "x": "日曜の行楽帰りの客を、60人も探し出したの？"}, {"t": 350.81666666666666, "x": "探し出した。一人ずつ話を聞いた。"}, {"t": 353.31666666666666, "x": "だがその中に犯人はいなかった。"}, {"t": 355.45, "x": "犯人らしい人を見た、という人も出てこなかった。"}, {"t": 358.68333333333334, "x": "残りの人は？"}, {"t": 359.8666666666667, "x": "まだ5、6人が分かっていない、と報告している。"}, {"t": 362.93333333333334, "x": "ただそれで犯人に届くとは考えにくかった。"}, {"t": 365.8833333333333, "x": "置いた人は、もう降りてたんだもんね。"}, {"t": 368.2, "x": "そこがこの種の事件の一番難しいところだった。"}, {"t": 371.93333333333334, "x": "実はこの日の質問は、\n横須賀線だけの話ではなかった。"}, {"t": 375.78333333333336, "x": "議員はもう一つの事件を並べて聞いている。"}, {"t": 378.46666666666664, "x": "もう一つ？"}, {"t": 379.6, "x": "ちょうど1年前、兵庫県で起きた電車の爆発だ。"}, {"t": 382.85, "x": "姫路から神戸へ向かう山陽電車だった。"}, {"t": 385.35, "x": "1967年の6月18日。こちらも日曜日だ。"}, {"t": 389.6333333333333, "x": "同じような事件が、1年前にもあったのね。"}, {"t": 392.5833333333333, "x": "議員はこう言った。二つとも\nいまだ犯人が分かっていない。"}, {"t": 395.93333333333334, "x": "国民は恐怖の念を持って電車に\n乗らなければならない。"}, {"t": 399.23333333333335, "x": "……怖いわよね。毎日乗る電車なのに。"}, {"t": 401.7, "x": "答えた国鉄総裁の石田禮助は、こう述べた。"}, {"t": 404.9, "x": "ああいう事故が起こらないよう、監視を厳しくしたい。"}, {"t": 407.8333333333333, "x": "でも網棚の荷物を全部調べるなんて無理よね。"}, {"t": 410.81666666666666, "x": "総裁もそこは分かっていたようだ。"}, {"t": 412.8333333333333, "x": "話は新幹線の線路に置かれる障害物へ移っていった。"}, {"t": 416.4, "x": "置き石は全国で\n毎年2000件以上ある、とも言っている。"}, {"t": 419.95, "x": "国鉄の力だけでは防げない、って話ね。"}, {"t": 422.98333333333335, "x": "そうだ。電車は誰でも乗れる場所だ。"}, {"t": 425.23333333333335, "x": "誰でも乗れるから、誰でも荷物を置ける。"}, {"t": 427.8666666666667, "x": "便利さと危なさが、背中合わせなのね。"}, {"t": 430.53333333333336, "x": "そして警察は、山陽電車の捜査の中身も報告した。"}, {"t": 434.23333333333335, "x": "それを聞くと、物の捜査がどういうものか分かる。"}, {"t": 437.73333333333335, "x": "山陽電車の車内にも、いろいろな物が残っていた。"}, {"t": 440.98333333333335, "x": "まず時計だ。精工舎の「フラワー」という型だった。"}, {"t": 444.3666666666667, "x": "1952年の11月に作られたもので、7284個ある。"}, {"t": 449.5, "x": "作られた数まで分かるのね。"}, {"t": 451.4, "x": "会社に記録が残っているからな。"}, {"t": 453.48333333333335, "x": "包んでいた新聞は、デイリースポーツだった。"}, {"t": 456.15, "x": "事件当日の6月18日付で、14万4865部刷られていた。"}, {"t": 461.65, "x": "14万部……全部は追えないわよね。"}, {"t": 463.96666666666664, "x": "警察もそう言っている。"}, {"t": 465.25, "x": "全部追うのは不可能に近い。"}, {"t": 467.06666666666666, "x": "そこで売られた地域を兵庫・京都・大阪にしぼった。"}, {"t": 470.4, "x": "さらに新聞に使われた紙に目をつけた。"}, {"t": 473.05, "x": "紙？"}, {"t": 474.18333333333334, "x": "刷った時間によって、紙を作った会社が違ったんだ。"}, {"t": 477.53333333333336, "x": "紙の違いから、どの時間に\n刷られた新聞かを割り出した。"}, {"t": 481.2, "x": "すごい細かさね。"}, {"t": 482.53333333333336, "x": "そうやって、3584部までは行き先を確かめた。"}, {"t": 486.3666666666667, "x": "だが、行き先を調べても犯人に\nたどりつく人は出なかった。"}, {"t": 490.1, "x": "ドライヤーの空き箱も残っていた。"}, {"t": 492.1, "x": "これは約46万個売られていた。"}, {"t": 494.3333333333333, "x": "そのうち約5000個の行き先を確かめた。"}, {"t": 497.03333333333336, "x": "それでも届かなかったの？"}, {"t": 498.75, "x": "届かなかった。捜査員100人で1年追っても、だ。"}, {"t": 502.15, "x": "物の捜査は、それほど気の遠くなる作業だった。"}, {"t": 505.3, "x": "横須賀線も、同じことになりそうね。"}, {"t": 507.9, "x": "警察庁の担当者も、その難しさを隠していない。"}, {"t": 511.98333333333335, "x": "山陽電車の捜査では、もう一つの見方も使われた。"}, {"t": 515.4333333333333, "x": "物から人を割り出すのではなく、\n人の条件を考える方法だ。"}, {"t": 519.5, "x": "人の条件？"}, {"t": 520.65, "x": "この爆弾を作れるのは、どんな人か、ということだ。"}, {"t": 523.9666666666667, "x": "説明員は国会でいくつも挙げている。"}, {"t": 526.2666666666667, "x": "ガスや電気の溶接、穴をあける\n機械を使える立場にある人。"}, {"t": 530.1666666666666, "x": "溶接の技術を持っている人。"}, {"t": 532.1166666666667, "x": "火薬について、それなりの知識と経験がある人。"}, {"t": 535.4333333333333, "x": "素人には無理、ってことね。"}, {"t": 537.2833333333333, "x": "そうだ。ボルトやナットを手に入れられる人でもある。"}, {"t": 540.1333333333333, "x": "さらに性格のことまで言っている。"}, {"t": 542.25, "x": "性格まで？"}, {"t": 543.3833333333333, "x": "工作がかなり精密だから、\n工作好きで凝り性だろう、と。"}, {"t": 547.0833333333334, "x": "家か職場に、工作をする場所と道具がある人だ。"}, {"t": 550.35, "x": "そういう人に、物の行き先を重ねていくのね。"}, {"t": 553.4333333333333, "x": "そうだ。人の条件と物の行き先を、結びつけて調べた。"}, {"t": 557.3166666666667, "x": "それでも山陽電車では届かなかった。"}, {"t": 559.8166666666667, "x": "条件に合う人は、きっとたくさんいたのね。"}, {"t": 562.6, "x": "腕のいい職人は、どの町にもいるからな。"}, {"t": 565.2166666666667, "x": "条件だけでは、一人にはしぼれない。"}, {"t": 567.65, "x": "やっぱり決め手は物なのね。"}, {"t": 569.5, "x": "説明員の話は、ここから捜査の難しさへ移っていく。"}, {"t": 573.8333333333334, "x": "なぜこの種の事件は、なかなか解決しないのか。"}, {"t": 576.9166666666666, "x": "説明員は国会で理由を三つ挙げた。"}, {"t": 579.4333333333333, "x": "三つ？"}, {"t": 580.5666666666667, "x": "一つ目は犯人を見た人がいないことだ。"}, {"t": 583.0666666666667, "x": "時計じかけだから、犯人はもうその車両にいない。"}, {"t": 586.1, "x": "説明員は一つの例を出している。"}, {"t": 588.25, "x": "前の年、新幹線のひかり号で起きた事件だ。"}, {"t": 591.4666666666667, "x": "新幹線でも？"}, {"t": 592.7166666666667, "x": "本の中にダイナマイトを仕掛けた事件だ。"}, {"t": 595.2333333333333, "x": "本は源氏物語だった。"}, {"t": 596.8333333333334, "x": "爆発はせず、未遂に終わった。"}, {"t": 599.1333333333333, "x": "よかった……。犯人は？"}, {"t": 600.7333333333333, "x": "少年だった。翌年の3月に捕まえている。"}, {"t": 603.7666666666667, "x": "ところが捕まえてから写真を見せて回っても。"}, {"t": 606.4833333333333, "x": "鉄道の人も乗客も、その少年を覚えていなかった。"}, {"t": 610.0833333333334, "x": "一等車に乗ってたのに？"}, {"t": 611.7333333333333, "x": "そうだ。それほど人は他人を見ていない。"}, {"t": 614.1833333333333, "x": "二つ目は爆発物が普通の荷物に見えることだ。"}, {"t": 617.3166666666667, "x": "網棚や座席に置かれると、事前にはまず気づけない。"}, {"t": 620.65, "x": "三つ目は？"}, {"t": 621.7833333333333, "x": "物の数があまりにも多いことだ。"}, {"t": 623.75, "x": "一つずつ追うと、どうしても時間がかかる。"}, {"t": 626.5166666666667, "x": "見た人はいない、気づけない、数が多い……。"}, {"t": 629.1166666666667, "x": "それでも警察は、物を追うしかなかった。"}, {"t": 631.6666666666666, "x": "では横須賀線には、何が残っていたのか。"}, {"t": 635.1, "x": "7月25日の国会で、説明員は物を一つずつ挙げた。"}, {"t": 639.1666666666666, "x": "まとめると、大きく7つになる。"}, {"t": 641.3833333333333, "x": "7つも残っていたのね。"}, {"t": 643.1, "x": "爆発で粉々になっても、部品は案外残るものなんだ。"}, {"t": 646.7333333333333, "x": "一つ目は時間で電気を入れるタイムスイッチ。"}, {"t": 649.3333333333334, "x": "二つ目は乾電池を入れておくケース。"}, {"t": 651.55, "x": "三つ目は全体を包んでいた新聞紙。"}, {"t": 653.9166666666666, "x": "四つ目は中身を入れていた菓子の箱。"}, {"t": 656.2166666666667, "x": "五つ目はそれを全部入れた紙の買い物袋。"}, {"t": 658.9333333333333, "x": "六つ目は配管に使う金具。"}, {"t": 660.75, "x": "三方継ぎ手と呼ぶ物だ。"}, {"t": 662.5, "x": "七つ目は爆発した火薬そのものだ。"}, {"t": 665.0666666666667, "x": "最初に言ってた紙袋と新聞と菓子箱も入ってるのね。"}, {"t": 668.7166666666667, "x": "そうだ。当時の記者も、車内で\n同じような物を見ている。"}, {"t": 672.15, "x": "タイムスイッチ、電池、鉄パイプ、菓子箱、新聞紙。"}, {"t": 675.8, "x": "それに紙袋の破片だ。"}, {"t": 677.65, "x": "組み立て方は……話さないのよね。"}, {"t": 679.95, "x": "話さない。この回で扱うのは、\n何が使われていたかまでだ。"}, {"t": 683.7666666666667, "x": "大事なのは、どれも店で買える物だったということだ。"}, {"t": 687.05, "x": "特別な物じゃないってこと？"}, {"t": 689.0, "x": "そうだ。だから一つ一つが、\n数え切れないほど出回っていた。"}, {"t": 692.95, "x": "山陽電車と同じで、また気の遠くなる話ね。"}, {"t": 696.1833333333333, "x": "ところが7つのうちいくつかには「狭さ」があった。"}, {"t": 699.5, "x": "狭さ？"}, {"t": 700.6333333333333, "x": "出回った数や場所が、思ったより限られていたんだ。"}, {"t": 704.45, "x": "まずタイムスイッチから見ていこう。"}, {"t": 706.3166666666667, "x": "ナショナル製だった。"}, {"t": 707.4, "x": "今で言うパナソニックだな。"}, {"t": 709.2333333333333, "x": "家電のメーカーね。"}, {"t": 710.5166666666667, "x": "家庭で決まった時間に電気を入れるための道具だ。"}, {"t": 713.4, "x": "1963年から64年にかけて、約1万個作られた。"}, {"t": 718.0833333333334, "x": "1万個。山陽電車の時計より多いわね。"}, {"t": 720.9333333333333, "x": "しかも全国に出回っていた。"}, {"t": 722.8, "x": "これだけだと、とても追い切れない。"}, {"t": 724.9333333333333, "x": "じゃあ手がかりにならないの？"}, {"t": 726.5833333333334, "x": "説明員は中を開けると特徴があると言っている。"}, {"t": 729.45, "x": "いろいろな特徴がある、という言い方だ。"}, {"t": 731.9333333333333, "x": "同じ製品でも、見分ける手がかりがあるのね。"}, {"t": 734.8, "x": "そうだ。その違いから出荷先をしぼろうとした。"}, {"t": 737.7833333333333, "x": "工場、問屋、電器店と、順番にさかのぼる捜査だ。"}, {"t": 741.5333333333333, "x": "気が遠くなるわね。"}, {"t": 742.9, "x": "説明員自身が「ばく大な量」と言っている。"}, {"t": 745.8, "x": "ただ物の捜査はこれ一つで終わらない。"}, {"t": 748.1, "x": "別々の物の行き先を重ねていくんだ。"}, {"t": 750.7833333333333, "x": "重ねる？"}, {"t": 751.9166666666666, "x": "タイムスイッチを買った人。"}, {"t": 753.4, "x": "電池ケースを持っていた人。"}, {"t": 755.2166666666667, "x": "同じ新聞を読んでいた人。"}, {"t": 757.0, "x": "その全部に当てはまる人は、ぐっと少なくなる。"}, {"t": 760.0833333333334, "x": "網の目を重ねていく感じね。"}, {"t": 762.0833333333334, "x": "そうだ。次の電池ケースは、\nその網をかなり細かくした。"}, {"t": 766.3, "x": "二つ目の物、電池を入れていたケースだ。"}, {"t": 768.8666666666667, "x": "これはあるテープレコーダーの部品だった。"}, {"t": 771.1666666666666, "x": "テープレコーダー？"}, {"t": 772.35, "x": "音を録音して聞く機械だ。"}, {"t": 774.0, "x": "持ち運べる型だった。"}, {"t": 775.5666666666667, "x": "クラウンという会社の、CTR5310型という製品だ。"}, {"t": 779.55, "x": "型番まで分かったのね。"}, {"t": 781.2333333333333, "x": "部品の形と刻印から割り出せたんだろう。"}, {"t": 783.8666666666667, "x": "この型は1964年の11月から翌年4月まで売られた。"}, {"t": 788.3, "x": "国内向けに約1万3500台だ。"}, {"t": 791.0833333333334, "x": "半年だけ売られた機械なのね。"}, {"t": 793.2, "x": "そうだ。しかも当時のテープレコーダーは高い。"}, {"t": 795.8666666666667, "x": "誰もが持っている物ではなかった。"}, {"t": 798.05, "x": "持ってる人は限られてた、ってことね。"}, {"t": 800.5333333333333, "x": "警察は売った店と買った人を順に調べていった。"}, {"t": 803.6166666666667, "x": "資料によれば、男はこの機械を\n英会話の勉強に買っていた。"}, {"t": 807.4666666666667, "x": "勉強のための道具が、こんなことに……。"}, {"t": 809.95, "x": "本来の使い方とは全く違う使われ方だな。"}, {"t": 813.0666666666667, "x": "ただこの時点で警察はまだ男を知らない。"}, {"t": 815.6833333333333, "x": "1万3500台を、一台ずつ、たどる段階だった。"}, {"t": 819.5, "x": "1万個のスイッチに、1万3500台の機械。"}, {"t": 822.9333333333333, "x": "両方に当てはまる人は、まだ見えてこない。"}, {"t": 825.5333333333333, "x": "次の物はさらに人を選ぶ物だった。"}, {"t": 828.5666666666667, "x": "七つ目の物、爆発した火薬だ。"}, {"t": 831.0166666666667, "x": "調べると日本油脂という会社の製品だと分かった。"}, {"t": 834.1166666666667, "x": "「SS」と呼ばれる種類だった。"}, {"t": 836.2666666666667, "x": "何に使う火薬なの？"}, {"t": 837.9, "x": "猟銃だ。散弾の弾を飛ばすための火薬だった。"}, {"t": 841.1333333333333, "x": "狩りの道具の火薬ね。"}, {"t": 842.7166666666667, "x": "1967年の1年間で、約60トン作られていた。"}, {"t": 847.15, "x": "60トン……量はすごく多いわね。"}, {"t": 849.4, "x": "量は多い。だが使う人は限られている。"}, {"t": 852.0333333333333, "x": "あ、猟銃を持ってる人ってこと？"}, {"t": 854.2333333333333, "x": "そうだ。猟銃を持つには警察の許可がいる。"}, {"t": 856.95, "x": "つまり持っている人の名簿は警察の手元にある。"}, {"t": 860.0166666666667, "x": "それは大きいわね。"}, {"t": 861.3, "x": "説明員もそこを強調している。"}, {"t": 863.3333333333334, "x": "東京、神奈川、\nその周りの県の猟銃の持ち主を全部調べる。"}, {"t": 867.5666666666667, "x": "全部？"}, {"t": 868.6833333333333, "x": "全部だ。神奈川県警が、\n周りの県の協力を得てやると。"}, {"t": 872.55, "x": "これで一気に人がしぼれそう。"}, {"t": 874.4833333333333, "x": "それでもまだ数千、数万の単位だろう。"}, {"t": 876.9833333333333, "x": "猟銃の持ち主で、あの型の機械を持っていた人。"}, {"t": 880.3, "x": "網の目がまた一つ重なったわね。"}, {"t": 882.6166666666667, "x": "そして場所をしぼる物が別にあった。"}, {"t": 884.8, "x": "包んでいた新聞紙だ。"}, {"t": 886.95, "x": "その前に紙袋の話をしておこう。"}, {"t": 889.3166666666667, "x": "全部を入れて網棚に置いた、あの袋だ。"}, {"t": 892.0166666666667, "x": "最初に出てきた紙袋ね。"}, {"t": 893.9833333333333, "x": "底が角型になったショッピングバッグだった。"}, {"t": 896.6833333333333, "x": "1966年から、約50万枚作られていた。"}, {"t": 900.55, "x": "50万枚は、さすがに追えないわよね。"}, {"t": 903.1, "x": "追えない。だから警察は別の手を使った。"}, {"t": 905.8666666666667, "x": "別の手？"}, {"t": 907.0, "x": "実物や実物そっくりのポスターを作った。"}, {"t": 909.8, "x": "それを街頭や駅に貼り出したんだ。"}, {"t": 912.0166666666667, "x": "見覚えのある人はいませんか、ってことね。"}, {"t": 914.5833333333334, "x": "そうだ。説明員は\n「御協力を願っている」と言っている。"}, {"t": 918.2166666666667, "x": "人の記憶を集める捜査だな。"}, {"t": 920.3166666666667, "x": "網棚の袋なんて、誰も覚えてないって話だったけど。"}, {"t": 924.0, "x": "置いたところは覚えていなくても。"}, {"t": 925.8666666666667, "x": "持って歩いていた人を見た人はいるかもしれない。"}, {"t": 928.7333333333333, "x": "なるほど乗る前の姿ね。"}, {"t": 930.55, "x": "同じ考えで、菓子箱や配管の金具も調べられた。"}, {"t": 933.95, "x": "配管の金具は日本鋼管の製品だった。"}, {"t": 936.75, "x": "ガスや水道、プロパンガスの管をつなぐ物だ。"}, {"t": 939.7833333333333, "x": "それもどこにでもありそう。"}, {"t": 941.3833333333333, "x": "月に1万3000個ほど作られていた。"}, {"t": 943.7166666666667, "x": "比較的新しい物とみて追った。"}, {"t": 946.1, "x": "どれもありふれた物ばかりね。"}, {"t": 947.9666666666667, "x": "だからこそ、一番ありふれた物が効いてくる。新聞だ。"}, {"t": 952.1166666666667, "x": "新聞の話には、一人の新聞記者が関わっている。"}, {"t": 955.5333333333333, "x": "当時朝日新聞で警視庁を担当していた記者だ。"}, {"t": 958.7166666666667, "x": "記者が捜査に関わったの？"}, {"t": 960.5666666666667, "x": "正確には記者が独自に見つけた手がかりだ。"}, {"t": 963.2833333333333, "x": "この記者は、のちに日本記者クラブに\n取材の記録を残した。"}, {"t": 967.0166666666667, "x": "事件の日、記者たちは現場に向かった。"}, {"t": 969.5166666666667, "x": "だが電車は、もう大船電車区の車庫に入っていた。"}, {"t": 972.8166666666667, "x": "車両はもう現場にないのね。"}, {"t": 974.6333333333333, "x": "その夜記者は一人で車庫を訪れた。"}, {"t": 976.9166666666666, "x": "電車の外側を、ぐるりと見て回った。"}, {"t": 979.55, "x": "外側を？"}, {"t": 980.6666666666666, "x": "すると窓枠の外に、白い\n米粒のような物が付いていた。"}, {"t": 984.4833333333333, "x": "お弁当のご飯つぶかしら。"}, {"t": 986.3, "x": "記者もそう思ったらしい。はがし取ってみた。"}, {"t": 988.8833333333333, "x": "指先で広げていくと、それは新聞紙の切れ端だった。"}, {"t": 992.5333333333333, "x": "新聞の切れ端が、窓の外に？"}, {"t": 994.9, "x": "爆発で紙が細かくちぎれた。"}, {"t": 997.0, "x": "開いていた窓から外へ飛び出し、窓枠に張り付いた。"}, {"t": 1000.35, "x": "記者はそう考えている。"}, {"t": 1001.95, "x": "6月だから、窓を開けてたのね。"}, {"t": 1004.3, "x": "そうだろう。その小さな紙片に、文字が残っていた。"}, {"t": 1007.6666666666666, "x": "何が書いてあったの？"}, {"t": 1009.1166666666667, "x": "表と裏、両方に広告の一部が残っていたんだ。"}, {"t": 1012.9333333333333, "x": "紙片の表は広告の欄だった。"}, {"t": 1014.95, "x": "皇太子一家についての記事を\n宣伝する広告らしかった。"}, {"t": 1018.4833333333333, "x": "雑誌の広告かしら。"}, {"t": 1020.0666666666667, "x": "週刊誌の記事だったようだ。"}, {"t": 1021.6666666666666, "x": "記者はそこから時期を推し量った。"}, {"t": 1023.8, "x": "裏は運送会社の求人広告だった。"}, {"t": 1026.35, "x": "会社の名前は読めたの？"}, {"t": 1028.0333333333333, "x": "一字しか読めなかった。"}, {"t": 1029.5333333333333, "x": "だが電話番号の市外局番が切れ切れに残っていた。"}, {"t": 1032.8666666666666, "x": "市外局番で、場所が分かるのね。"}, {"t": 1035.2, "x": "そうだ。東京の武蔵野市の会社だと分かった。"}, {"t": 1038.2666666666667, "x": "武蔵野市って、東京の西の方よね。"}, {"t": 1040.8666666666666, "x": "記者は大船署の近くに借りた家で、作業を続けた。"}, {"t": 1044.2, "x": "武蔵野の支局に問い合わせ、\nその運送会社に電話をかけた。"}, {"t": 1048.0833333333333, "x": "夜中に？"}, {"t": 1049.2166666666667, "x": "出たのは宿直の担当者だった。"}, {"t": 1051.3833333333334, "x": "その人がこう教えてくれた。"}, {"t": 1053.15, "x": "あの求人広告は、毎日新聞か\nサンケイ新聞に出したはずだ。"}, {"t": 1057.2, "x": "東京都下の、多摩地方の版だ、と。"}, {"t": 1059.7666666666667, "x": "じゃあ新聞の種類も地域も分かったのね。"}, {"t": 1062.3166666666666, "x": "記者はそれを書いた。だが翌朝の扱いは小さかった。"}, {"t": 1065.6333333333334, "x": "1面のわずか3行だった。"}, {"t": 1067.5833333333333, "x": "3行だけ？"}, {"t": 1068.7, "x": "記者は抗議した。すると夕刊の1面に大きく載った。"}, {"t": 1072.1, "x": "見出しは「犯人は三多摩地方か」だった。"}, {"t": 1075.5666666666666, "x": "この夕刊の記事には、ほかの社の記者も反応した。"}, {"t": 1078.8, "x": "産経新聞の記者が、捜査本部へ駆けつけたんだ。"}, {"t": 1082.1833333333334, "x": "自分の会社の新聞かもしれないものね。"}, {"t": 1084.8166666666666, "x": "そうだ。記者は幹部にこう聞いた。"}, {"t": 1086.8666666666666, "x": "残された新聞は、サンケイですか。"}, {"t": 1089.2833333333333, "x": "幹部は何て？"}, {"t": 1090.4, "x": "これから調べるところです、と答えた。"}, {"t": 1092.9333333333334, "x": "警察より先に、記者が新聞を割り出しかけてたのね。"}, {"t": 1096.45, "x": "少なくとも、記事が出た時点ではそうだった。"}, {"t": 1099.2333333333333, "x": "産経の記者は、朝日の記者の方を\n向いて感心していたという。"}, {"t": 1103.1666666666667, "x": "ライバルなのに、ちょっといい話ね。"}, {"t": 1105.4, "x": "記者同士の競争が、事件の報道を\n前に進めた面はある。"}, {"t": 1109.2, "x": "でも記事が出ると犯人にも伝わっちゃわない？"}, {"t": 1111.9166666666667, "x": "そこは難しいところだな。"}, {"t": 1113.6166666666666, "x": "新聞が手がかりだと、犯人も知ることになる。"}, {"t": 1116.6666666666667, "x": "逃げたり証拠を捨てたりしないかしら。"}, {"t": 1118.9333333333334, "x": "ただ配られた新聞はもう取り戻せない。"}, {"t": 1121.3, "x": "販売店の配達の記録も、犯人には消せない。"}, {"t": 1124.6, "x": "あ、そうか。"}, {"t": 1125.7333333333333, "x": "犯人が隠せるのは自分の手元の物だけだ。"}, {"t": 1128.6166666666666, "x": "町に残った記録までは、どうにもできなかった。"}, {"t": 1132.1833333333334, "x": "では警察はその新聞をどう特定したのか。"}, {"t": 1134.9333333333334, "x": "7月25日の国会で、説明員がはっきり答えている。"}, {"t": 1138.7833333333333, "x": "爆弾を包んでいたのは、毎日新聞だった。"}, {"t": 1141.7333333333333, "x": "1968年の4月17日付、13版の東京都下版だ。"}, {"t": 1146.7666666666667, "x": "記者の読みが当たってたのね。"}, {"t": 1148.6, "x": "新聞の種類と地域は、記者の見立ての通りだった。"}, {"t": 1151.8, "x": "日付は記者の初めの見立てより一日二日あとだ。"}, {"t": 1155.05, "x": "東京都下版って、何？"}, {"t": 1156.9333333333334, "x": "同じ日の新聞でも、地域ごとに中身が少し違う。"}, {"t": 1160.2666666666667, "x": "東京の23区の外、三多摩に配る版のことだ。"}, {"t": 1163.85, "x": "じゃあ配られた場所が限られるのね。"}, {"t": 1166.0333333333333, "x": "そうだ。この版は6万8000部刷られていた。"}, {"t": 1168.8833333333334, "x": "そして三多摩の地方で売られていた。"}, {"t": 1171.15, "x": "6万8000部。山陽電車の14万部の半分以下ね。"}, {"t": 1174.9166666666667, "x": "しかも新聞は、毎朝家に届けられる物だ。"}, {"t": 1177.9666666666667, "x": "あ、配達されてる家が分かる……。"}, {"t": 1180.0333333333333, "x": "そうだ。販売店には配達先の記録がある。"}, {"t": 1183.0, "x": "説明員はこういう方針だと述べている。"}, {"t": 1185.3666666666666, "x": "販売店、それから購入先を、全部解明する。"}, {"t": 1188.7166666666667, "x": "全部！"}, {"t": 1189.85, "x": "警視庁と神奈川県警が力を合わせて進めていた。"}, {"t": 1193.2666666666667, "x": "電車は神奈川、新聞は東京なのね。"}, {"t": 1195.95, "x": "そうだ。事件が県の境を越えていた。"}, {"t": 1198.4333333333334, "x": "犯人は三多摩に住んでいるかもしれない。"}, {"t": 1201.45, "x": "もう一つの物、菓子箱の話をしよう。"}, {"t": 1204.0666666666666, "x": "中身を入れていたのは、菓子の空き箱だった。"}, {"t": 1206.7333333333333, "x": "名古屋市内の、もなかを作る店が使っていた箱だ。"}, {"t": 1210.15, "x": "もなかの箱？"}, {"t": 1211.3333333333333, "x": "あんこを薄い皮ではさんだ和菓子だな。"}, {"t": 1213.65, "x": "名古屋のお菓子なのに、事件は\n神奈川で、新聞は東京。"}, {"t": 1217.3166666666666, "x": "そうなんだ。場所がばらばらだった。"}, {"t": 1219.4166666666667, "x": "説明員はこの箱についてはこう言っている。"}, {"t": 1221.9333333333334, "x": "業者も見当がつかないくらい量が多い。"}, {"t": 1224.4333333333334, "x": "じゃあ、手がかりは無いんじゃ。"}, {"t": 1226.1166666666666, "x": "それでも何か手がかりにならないかと調べていると。"}, {"t": 1229.1833333333334, "x": "あきらめてはいないのね。"}, {"t": 1230.7, "x": "記者の記録にも、この箱は\n手がかりの一つとして出てくる。"}, {"t": 1234.3333333333333, "x": "名古屋市内で売られていた最中の菓子箱、と。"}, {"t": 1237.2, "x": "でも三多摩に住む人が名古屋の箱を持ってるって。"}, {"t": 1240.3, "x": "そこがこの箱の意味だ。"}, {"t": 1241.8333333333333, "x": "自分で名古屋へ行ったか、誰かにもらったか。"}, {"t": 1244.65, "x": "お土産ね！"}, {"t": 1245.7833333333333, "x": "そうだ。もらった物なら、渡した人がいる。"}, {"t": 1248.6666666666667, "x": "渡した人は、たいてい覚えている。"}, {"t": 1250.9666666666667, "x": "人の記憶につながる箱なのね。"}, {"t": 1253.1833333333334, "x": "新聞が地域をしぼり、箱が人をしぼった。"}, {"t": 1255.9333333333334, "x": "その二つが重なるまで、あと4か月かかる。"}, {"t": 1259.4833333333333, "x": "7月25日の報告の終わりに、説明員はこう述べた。"}, {"t": 1263.25, "x": "何の関係も無い人を殺傷する\n事件は、社会公共の敵だ。"}, {"t": 1267.3333333333333, "x": "最初の方で出てきた言葉ね。"}, {"t": 1269.3666666666666, "x": "そうだ。続けてこう言っている。"}, {"t": 1271.2333333333333, "x": "検挙するのが私ども警察の責務であると痛感している。"}, {"t": 1274.8166666666666, "x": "国民の皆さまの協力を得て、一日も早く解決したい。"}, {"t": 1278.7833333333333, "x": "協力ってさっきのポスターみたいなこと？"}, {"t": 1281.3, "x": "そうだ。物の捜査には、人の記憶がどうしても要る。"}, {"t": 1284.6166666666666, "x": "説明員は横須賀線の事件が起きた時のことも話した。"}, {"t": 1288.2833333333333, "x": "すぐに兵庫県警と警視庁を集めて会議を開いた。"}, {"t": 1291.6, "x": "山陽電車の兵庫と、新聞の東京ね。"}, {"t": 1294.4166666666667, "x": "そうだ。物の捜査は全国に広がるからだ。"}, {"t": 1297.25, "x": "警察庁が全体をまとめて、全国で追う態勢にした。"}, {"t": 1300.9, "x": "県ごとの捜査じゃ足りないのね。"}, {"t": 1302.9, "x": "資料によれば、この事件は\n警察庁の広域重要指定事件になった。"}, {"t": 1307.1666666666667, "x": "番号は107号だ。"}, {"t": 1308.9166666666667, "x": "広域重要指定って、何？"}, {"t": 1310.9833333333333, "x": "いくつもの県にまたがる重大な事件を、\n国がまとめて指定するものだ。"}, {"t": 1315.2333333333333, "x": "一つの事件だけで指定されたのは、\nこれが唯一の例とされる。"}, {"t": 1319.1, "x": "それだけ特別扱いだったのね。"}, {"t": 1321.3666666666666, "x": "そして秋、同じ指定を受ける事件がもう一つ起きる。"}, {"t": 1324.7666666666667, "x": "108号……？"}, {"t": 1325.9, "x": "そうだ。その話は次の章で少しだけする。"}, {"t": 1329.4833333333333, "x": "1968年の秋、警察は大きな事件を同時に抱えていた。"}, {"t": 1334.0333333333333, "x": "12月、国家公安委員長の荒木萬壽夫が\n国会でこう述べている。"}, {"t": 1338.05, "x": "最近の犯罪で注目されるのは、三つの種類の事件だ。"}, {"t": 1341.8833333333334, "x": "三つ？"}, {"t": 1343.0, "x": "拳銃による連続射殺事件。"}, {"t": 1345.0, "x": "金融機関に対する強盗事件。"}, {"t": 1347.1, "x": "そして列車などに対する爆破事件だ。"}, {"t": 1349.65, "x": "拳銃の事件って……。"}, {"t": 1351.1, "x": "秋に東京や京都などで続いた\n事件だ。これが108号になった。"}, {"t": 1355.1833333333334, "x": "この回では詳しく扱わない。"}, {"t": 1356.9333333333334, "x": "別の回で取り上げている。"}, {"t": 1358.6666666666667, "x": "金融機関の強盗は？"}, {"t": 1360.3, "x": "12月10日の、いわゆる三億円事件も、この頃だ。"}, {"t": 1363.9666666666667, "x": "同じ年なのね……。"}, {"t": 1365.2833333333333, "x": "そうだ。大きな事件が、立て続けに起きていた。"}, {"t": 1368.45, "x": "警察は手が回ったのかしら。"}, {"t": 1370.4333333333334, "x": "当時の国会では、警察は手が\n足りているのかという声も出た。"}, {"t": 1374.1166666666666, "x": "刑事局長は、刑事事件が\nおろそかになることはないと答えている。"}, {"t": 1378.1833333333334, "x": "大変な年だったのね。"}, {"t": 1379.9166666666667, "x": "その中で横須賀線の捜査は地道に続いていた。"}, {"t": 1383.0333333333333, "x": "新聞の配達先を、一軒ずつ当たる作業だ。"}, {"t": 1386.1833333333334, "x": "派手さは全く無いわね。"}, {"t": 1387.85, "x": "無い。だがその地道さが結果を出す。"}, {"t": 1390.2, "x": "国家公安委員長は同じ演説でこう言った。"}, {"t": 1392.8666666666666, "x": "幸い横須賀線電車爆破事件は、解決を見た。"}, {"t": 1396.8333333333333, "x": "捜査本部は、都下に配られた\n毎日新聞の配達先を調べた。"}, {"t": 1400.9666666666667, "x": "記者の記録にも、そう書かれている。"}, {"t": 1403.35, "x": "6万8000部の配達先ね。"}, {"t": 1405.5666666666666, "x": "そうだ。その家々に、ほかの物の網を重ねていく。"}, {"t": 1408.85, "x": "猟銃の持ち主の名簿。"}, {"t": 1410.3, "x": "テープレコーダーを買った人。"}, {"t": 1412.1333333333334, "x": "二つも三つも重なる家は、少ないわよね。"}, {"t": 1415.1333333333334, "x": "少ない。資料によれば、一人の男が浮かんだ。"}, {"t": 1418.1833333333334, "x": "東京の日野市に住む、25歳の大工だった。"}, {"t": 1421.3, "x": "日野市って、三多摩の中よね。"}, {"t": 1423.5333333333333, "x": "そうだ。資料によれば男は毎日新聞を取っていた。"}, {"t": 1426.8333333333333, "x": "そして猟銃の許可を受けて散弾銃を持っていた。"}, {"t": 1429.8333333333333, "x": "新聞と火薬が、一人に重なったのね。"}, {"t": 1432.65, "x": "大工だから、道具の扱いにも慣れていた。"}, {"t": 1435.4166666666667, "x": "でもそれだけで犯人とは言えないわよね。"}, {"t": 1437.8666666666666, "x": "言えない。新聞を取る\n猟銃の持ち主は、ほかにもいる。"}, {"t": 1441.15, "x": "ここで名古屋の箱が効いてくる。"}, {"t": 1443.15, "x": "お土産の話ね。"}, {"t": 1444.55, "x": "資料によれば、警察はある事実を突き止めた。"}, {"t": 1447.45, "x": "前の年男の隣の家の夫婦が新婚旅行に出かけていた。"}, {"t": 1451.1833333333334, "x": "行き先で名古屋の最中を土産に買っていた。"}, {"t": 1453.9166666666667, "x": "まさか……。"}, {"t": 1455.05, "x": "その最中を、隣に住む男に渡していた。"}, {"t": 1458.0333333333333, "x": "箱が男の家に入っていたのね。"}, {"t": 1460.3, "x": "新聞、火薬、そして箱。"}, {"t": 1462.15, "x": "三つの物が一人に重なった。"}, {"t": 1464.9333333333334, "x": "1968年11月9日。"}, {"t": 1467.6, "x": "事件から5か月近くたっていた。"}, {"t": 1469.8666666666666, "x": "資料によれば、捜査員は男の仕事場を訪ねた。"}, {"t": 1473.1333333333334, "x": "いきなり逮捕じゃないのね。"}, {"t": 1474.8, "x": "まず任意で警察へ来てほしいと頼んだ。"}, {"t": 1477.2333333333333, "x": "そして集めた証拠を男に示した。"}, {"t": 1479.6833333333334, "x": "男はどうしたの？"}, {"t": 1481.0166666666667, "x": "資料によれば、男は犯行を\n認めた。そのまま逮捕された。"}, {"t": 1484.9666666666667, "x": "……認めたのね。"}, {"t": 1486.15, "x": "横須賀線の電車に、\n時限式の爆弾を仕掛けたと話した。"}, {"t": 1490.0666666666666, "x": "記者の記録では、ここは短く書かれている。"}, {"t": 1492.8166666666666, "x": "11月、東京都日野市に住む容疑者が\n逮捕され、事件は解決した。"}, {"t": 1497.5833333333333, "x": "記者は自分の記事を思い出したでしょうね。"}, {"t": 1500.0333333333333, "x": "「書いたとおりになった」と振り返っている。"}, {"t": 1502.5333333333333, "x": "三多摩の新聞、っていう記事ね。"}, {"t": 1504.65, "x": "そうだ。窓枠の紙片から始まった見立てだった。"}, {"t": 1507.75, "x": "ここで一つ、はっきりさせておきたい。"}, {"t": 1510.25, "x": "なに？"}, {"t": 1511.3666666666666, "x": "この男はのちに裁判で有罪が確定している。"}, {"t": 1514.3166666666666, "x": "犯人であることは、最高裁で刑が確定した事実だ。"}, {"t": 1517.85, "x": "ただこの回では男の名前は出さない。"}, {"t": 1520.2666666666667, "x": "亡くなった方のご家族のことを考えて、よね。"}, {"t": 1523.3833333333334, "x": "そうだ。主役は男ではなく、\n男にたどり着いた物と人だ。"}, {"t": 1527.4833333333333, "x": "うん。"}, {"t": 1528.6166666666666, "x": "でもどうして横須賀線だったの？"}, {"t": 1530.6166666666666, "x": "日野市からだと、ずいぶん遠いわよね。"}, {"t": 1533.0166666666667, "x": "そこに男の動機が関わっている。"}, {"t": 1535.1833333333334, "x": "資料によれば、男は山形県の出身だった。"}, {"t": 1538.25, "x": "結婚を約束した相手がいたが、別れることになった。"}, {"t": 1541.8, "x": "その恨みで……？"}, {"t": 1542.9333333333334, "x": "資料はそう書いている。"}, {"t": 1544.1, "x": "相手への恨みを晴らすためだった、と。"}, {"t": 1546.4333333333334, "x": "横須賀線は、その相手が山形から\n上京するときに使っていた路線だ。"}, {"t": 1551.0833333333333, "x": "じゃあ相手を狙ったの？"}, {"t": 1552.5166666666667, "x": "記者の記録では、相手が使うと\n思われる電車に仕掛けた、とある。"}, {"t": 1556.5, "x": "だが資料によれば、相手は\nその頃その電車を使っていなかった。"}, {"t": 1560.4666666666667, "x": "……じゃあ、亡くなった方は。"}, {"t": 1562.15, "x": "全く関係の無い人だった。"}, {"t": 1563.9666666666667, "x": "乗っていた乗客全員がそうだ。"}, {"t": 1566.1166666666666, "x": "個人の恨みで、知らない人たちが巻き込まれたのね。"}, {"t": 1569.4166666666667, "x": "記者はうっぷん晴らしだったと書いている。"}, {"t": 1571.7333333333333, "x": "そんな理由で……。"}, {"t": 1572.9, "x": "自分の気持ちの問題を、無関係の大勢にぶつけた。"}, {"t": 1576.3333333333333, "x": "網棚を選んだのも、そのせい？"}, {"t": 1578.45, "x": "網棚は置いた人が誰かを分からなくする場所だ。"}, {"t": 1581.35, "x": "そして誰が下に座るかも選べない場所だ。"}, {"t": 1584.1, "x": "誰に当たってもいい、ってことよね。"}, {"t": 1586.2166666666667, "x": "裁判はまさにそこを問題にした。"}, {"t": 1588.9833333333333, "x": "逮捕の翌月、国会で警察のまとめが述べられた。"}, {"t": 1592.3333333333333, "x": "1968年12月17日の衆議院、19日の参議院だ。"}, {"t": 1597.25, "x": "どちらも同じ人？"}, {"t": 1598.65, "x": "国家公安委員長の荒木萬壽夫だ。"}, {"t": 1600.6666666666667, "x": "就任したばかりだった。"}, {"t": 1602.3166666666666, "x": "その所信の中に、横須賀線の事件が出てくる。"}, {"t": 1605.4833333333333, "x": "幸い横須賀線電車爆破事件については、"}, {"t": 1608.25, "x": "国民各位の御協力により解決を見た。"}, {"t": 1611.05, "x": "国民の協力、って言葉が入ってるのね。"}, {"t": 1613.8666666666666, "x": "そうだ。ポスター、配達先、土産を覚えていた人。"}, {"t": 1617.35, "x": "たくさんの人の記憶がつながった結果だった。"}, {"t": 1620.2666666666667, "x": "記者の紙片もね。"}, {"t": 1621.6333333333334, "x": "そうだな。委員長は続けて、こう述べている。"}, {"t": 1624.3833333333334, "x": "広域の捜査態勢を、さらに充実させる。"}, {"t": 1627.1833333333334, "x": "捜査のやり方を、科学的で合理的なものにしていく。"}, {"t": 1630.7166666666667, "x": "物の捜査を、もっと速くしたいってことね。"}, {"t": 1633.5666666666666, "x": "そうだ。山陽電車の事件は、まだ解決していなかった。"}, {"t": 1637.25, "x": "1年以上追っても届かない事件があった。"}, {"t": 1639.9, "x": "横須賀線が解決できて、\n山陽電車ができなかったのは？"}, {"t": 1643.75, "x": "資料からは、はっきりとは言えない。"}, {"t": 1645.7833333333333, "x": "ただ横須賀線には配られた地域の狭い新聞があった。"}, {"t": 1649.1666666666667, "x": "そして人の手を渡った菓子箱があった。"}, {"t": 1651.7333333333333, "x": "物の「狭さ」が分かれ目だったのかもね。"}, {"t": 1654.6166666666666, "x": "その違いは大きかったと思う。"}, {"t": 1657.1, "x": "翌1969年の春にも、国会でこの事件が語られた。"}, {"t": 1661.4833333333333, "x": "3月25日の参議院、地方行政委員会だ。"}, {"t": 1664.8166666666666, "x": "まだ話題になってたのね。"}, {"t": 1666.4833333333333, "x": "この日は未解決の事件が問題になっていた。"}, {"t": 1669.3166666666666, "x": "三億円事件、連続ピストル射殺事件、\n銀行の強盗事件だ。"}, {"t": 1673.7, "x": "どれも解決していなかったのね。"}, {"t": 1675.8333333333333, "x": "答えた警察庁の刑事局長は、こう言っている。"}, {"t": 1678.8833333333334, "x": "自慢するわけではないが、と前置きしてな。"}, {"t": 1681.4833333333333, "x": "ほとんど捜査不可能といわれた横須賀線事件なども、"}, {"t": 1684.6833333333334, "x": "克明な苦心惨たんの捜査を\n遂げて犯人に到着している。"}, {"t": 1688.4333333333334, "x": "捜査不可能って言われてたのね。"}, {"t": 1690.5, "x": "目撃者がいない。物はありふれている。\nそういう事件だった。"}, {"t": 1694.0833333333333, "x": "4月11日の衆議院、法務委員会でも出てくる。"}, {"t": 1697.3166666666666, "x": "国家公安委員長が、こう述べた。"}, {"t": 1699.4666666666667, "x": "近代的な捜査能力に、一人一人の警察官の使命感。"}, {"t": 1703.45, "x": "執念深い捜査努力が、功を奏した。"}, {"t": 1706.1833333333334, "x": "足で稼いだ、って感じね。"}, {"t": 1708.0666666666666, "x": "委員長は同じ答弁で、こんな言い方もしている。"}, {"t": 1710.9666666666667, "x": "足をすりこ木のようにしてでも、という言い方だ。"}, {"t": 1713.8666666666666, "x": "すりこ木？"}, {"t": 1715.0, "x": "すり減るほど歩き回る、という意味だな。"}, {"t": 1717.5166666666667, "x": "配達先を一軒ずつ、だもんね。"}, {"t": 1719.95, "x": "そうだ。5か月の捜査は、\nそういう仕事の積み重ねだった。"}, {"t": 1724.3, "x": "男は横浜地方裁判所に起訴された。"}, {"t": 1726.9333333333334, "x": "罪の名前はいくつもあった。"}, {"t": 1728.6666666666667, "x": "殺人、爆発物取締罰則違反、そして船車覆没致死だ。"}, {"t": 1733.25, "x": "船車覆没？　難しい言葉ね。"}, {"t": 1735.65, "x": "船や電車をひっくり返したり\n壊したりして、人を死なせる罪だ。"}, {"t": 1739.6833333333334, "x": "最高裁の判決の事件名にも、この言葉が入っている。"}, {"t": 1743.4333333333334, "x": "電車の事件ならではの罪なのね。"}, {"t": 1745.6833333333334, "x": "資料によれば、初公判は1968年の12月25日だった。"}, {"t": 1750.6166666666666, "x": "男は起訴状に書かれた行為そのものは認めた。"}, {"t": 1753.6666666666667, "x": "じゃあ争うところは無かったの？"}, {"t": 1755.6, "x": "一つだけあった。殺意だ。"}, {"t": 1757.4666666666667, "x": "男は人を殺すつもりは無かったと言い続けた。"}, {"t": 1760.4833333333333, "x": "爆弾を混んだ電車に置いて、それは……。"}, {"t": 1762.95, "x": "裁判所もその言い分をそのままには受け取らなかった。"}, {"t": 1766.0166666666667, "x": "1969年の3月3日、検察は死刑を求めた。"}, {"t": 1770.3, "x": "死刑……。"}, {"t": 1771.4333333333334, "x": "亡くなった方は1人。だがけがをした人は大勢いた。"}, {"t": 1774.7333333333333, "x": "そして無関係の乗客を狙った事件だった。"}, {"t": 1777.65, "x": "判決はいつ？"}, {"t": 1778.8333333333333, "x": "資料によれば、求刑から17日後だ。"}, {"t": 1781.4833333333333, "x": "判決の中で、殺意の問題に一つの答えが出された。"}, {"t": 1785.2666666666667, "x": "殺すつもりは無かった、が通ったかどうか、ね。"}, {"t": 1788.3333333333333, "x": "鍵になったのは、事件の前に男がしていたことだった。"}, {"t": 1792.4666666666667, "x": "1969年3月20日、横浜地方裁判所の判決だ。"}, {"t": 1797.15, "x": "資料によれば、判決は求刑の通り死刑だった。"}, {"t": 1800.4, "x": "殺意は認められたの？"}, {"t": 1801.9833333333333, "x": "認められた。その理由が大事だ。"}, {"t": 1804.2, "x": "男は事件の前に、3回、爆発の試しをしていた。"}, {"t": 1807.9333333333334, "x": "試しって……前もって爆発させてみたってこと？"}, {"t": 1811.1, "x": "そうだ。資料はそう書いている。"}, {"t": 1812.9666666666667, "x": "だから男は、爆発が\nどれほどの力か十分に知っていた。"}, {"t": 1816.8666666666666, "x": "知っていて、混んだ電車の網棚に置いたのね。"}, {"t": 1819.75, "x": "裁判所はそこを重く見た。"}, {"t": 1821.4666666666667, "x": "人が死ぬかもしれないと分かっていた。"}, {"t": 1823.7, "x": "それでも構わないと思って置いた。"}, {"t": 1825.8166666666666, "x": "それが殺意になるの？"}, {"t": 1827.3166666666666, "x": "なる。「未必の故意」という考え方だ。"}, {"t": 1829.8666666666666, "x": "はっきり殺そうとしていなくても、"}, {"t": 1831.8666666666666, "x": "死んでも構わないと思っていれば、\n殺意があったとされる。"}, {"t": 1835.2666666666667, "x": "じゃあ乗客全員に殺意があったことに？"}, {"t": 1837.75, "x": "そこは細かく分けられた。"}, {"t": 1839.3666666666666, "x": "爆発物に近い席にいた13人に対して、殺意を認めた。"}, {"t": 1843.5, "x": "亡くなった方に殺人、12人に殺人未遂。"}, {"t": 1846.6166666666666, "x": "残る2人には、傷害の罪だ。"}, {"t": 1848.95, "x": "席の近さで、罪が分けられたのね。"}, {"t": 1851.4833333333333, "x": "網棚の下に誰が座るか、男は選べなかった。"}, {"t": 1854.7166666666667, "x": "その一人一人に、判決は向き合ったことになる。"}, {"t": 1858.4833333333333, "x": "男は控訴した。資料によれば\n二審では心の状態も調べられた。"}, {"t": 1862.65, "x": "1970年8月11日、東京高等裁判所は控訴を退けた。"}, {"t": 1867.6666666666667, "x": "責任を負う力は十分にあった、という判断だ。"}, {"t": 1870.9, "x": "それで最高裁へ？"}, {"t": 1872.2666666666667, "x": "そうだ。1971年4月22日、最高裁の第一小法廷だ。"}, {"t": 1877.4166666666667, "x": "裁判長は藤林益三。4人の裁判官全員の一致だった。"}, {"t": 1881.5333333333333, "x": "上告は退けられ、死刑が確定した。"}, {"t": 1884.3666666666666, "x": "最初に言ってた「電車を壊す」の話は？"}, {"t": 1887.3333333333333, "x": "それがこの判決の大事な所だ。"}, {"t": 1889.5833333333333, "x": "弁護側は法律の当てはめが誤っているとも訴えた。"}, {"t": 1892.9333333333334, "x": "それはどうなったの？"}, {"t": 1894.2666666666667, "x": "最高裁はその訴えを退けた。そのうえで、書き添えた。"}, {"t": 1897.9333333333334, "x": "電車の「破壊」とは何か、という定義だ。"}, {"t": 1900.8, "x": "電車の実質を害して、交通機関としての働きの、"}, {"t": 1904.35, "x": "全部または一部を失わせる程度の壊れ方をいう。"}, {"t": 1907.4333333333334, "x": "形が残ってても、電車として\n使えなければ破壊ってこと？"}, {"t": 1911.3333333333333, "x": "そうだ。そして最初の章の一文につながる。"}, {"t": 1914.1666666666667, "x": "乗客を乗せて安全に走り続けられない状態になった。"}, {"t": 1917.5833333333333, "x": "だから電車の破壊に当たる、と。"}, {"t": 1919.75, "x": "網棚や天井の壊れ方が、ここで効いたのね。"}, {"t": 1922.8166666666666, "x": "この判断は、最高裁の判例集に収められている。"}, {"t": 1926.1166666666666, "x": "判決はもう一つ書き添えている。"}, {"t": 1928.2166666666667, "x": "男の自白について、任意性を疑う事情は無い、と。"}, {"t": 1931.7666666666667, "x": "無理に言わされたわけじゃない、ってことね。"}, {"t": 1934.6166666666666, "x": "最高裁では、弁護側はもう一つ大きな訴えをしている。"}, {"t": 1938.1833333333334, "x": "死刑という刑そのものが、憲法に反するという訴えだ。"}, {"t": 1941.7, "x": "憲法？"}, {"t": 1942.8333333333333, "x": "憲法の36条は、残虐な刑罰を禁じている。"}, {"t": 1946.2666666666667, "x": "死刑はその残虐な刑罰に当たるという主張だった。"}, {"t": 1949.55, "x": "最高裁はどう答えたの？"}, {"t": 1951.3166666666666, "x": "その点はもう答えが出ているとした。"}, {"t": 1953.4666666666667, "x": "1948年3月12日の大法廷の判決だ。"}, {"t": 1957.45, "x": "死刑は残虐な刑罰に当たらない、と判断した判決だ。"}, {"t": 1961.25, "x": "23年前の判決を、そのまま当てはめたのね。"}, {"t": 1964.6, "x": "そうだ。だからその訴えには理由が無いとした。"}, {"t": 1967.4666666666667, "x": "ほかの訴えも、上告の理由にならないとして退けた。"}, {"t": 1971.0833333333333, "x": "結局全部退けられたのね。"}, {"t": 1973.2166666666667, "x": "判決文は全部でとても短い。"}, {"t": 1975.3333333333333, "x": "本文は1枚ほどにおさまっている。"}, {"t": 1977.5833333333333, "x": "命に関わる判決なのに、短いのね。"}, {"t": 1980.5, "x": "最高裁は一審と二審の判断を確かめる場所だからな。"}, {"t": 1984.0166666666667, "x": "事実の細かいところは、下の裁判所が決めていた。"}, {"t": 1987.5, "x": "網棚の位置も、3回の試しも、ね。"}, {"t": 1990.2666666666667, "x": "そうだ。最高裁はその上で法律の線を引いた。"}, {"t": 1993.9833333333333, "x": "死刑が確定したあと、男は東京拘置所で過ごした。"}, {"t": 1997.4833333333333, "x": "資料によれば、そこでキリスト教の洗礼を受けた。"}, {"t": 2000.5333333333333, "x": "そして短歌を詠むようになった。"}, {"t": 2002.5, "x": "短歌……。"}, {"t": 2003.6333333333334, "x": "歌集を出したいと、何度も支援者に話していたそうだ。"}, {"t": 2006.9333333333334, "x": "だが支援者たちは、そのたびにこう言った。"}, {"t": 2009.4666666666667, "x": "遺族の気持ちを考えて、待つように、と。"}, {"t": 2012.25, "x": "……そうよね。"}, {"t": 2013.3666666666666, "x": "家族を失った人がいる。その人たちが先だ。"}, {"t": 2016.5333333333333, "x": "1975年12月5日、東京拘置所で死刑が執行された。"}, {"t": 2021.2, "x": "資料によれば32歳だった。"}, {"t": 2023.3166666666666, "x": "事件から7年半ね。"}, {"t": 2025.0333333333333, "x": "歌集が出たのは、それから20年後の1995年だ。"}, {"t": 2029.05, "x": "20年も待ったのね。"}, {"t": 2030.6, "x": "この回では、その歌集の名前も歌も紹介しない。"}, {"t": 2033.8833333333334, "x": "うん。それはそうだと思う。"}, {"t": 2035.6, "x": "あの日逗子の病院には生まれたばかりの娘がいた。"}, {"t": 2038.5333333333333, "x": "その子は生まれてすぐに父を失った。"}, {"t": 2040.6666666666667, "x": "……。"}, {"t": 2041.6, "x": "20年待て、と言った支援者たちの言葉は、"}, {"t": 2044.3833333333334, "x": "その時間の重さを分かっていたからだと思う。"}, {"t": 2047.1, "x": "事件のあとの時間は、\n遺族の側にもずっと流れてたのね。"}, {"t": 2050.7833333333333, "x": "そうだ。判決で終わる話ではなかった。"}, {"t": 2054.05, "x": "ねえ最初の紙袋の話に戻っていい？"}, {"t": 2056.6833333333334, "x": "いいぞ。"}, {"t": 2057.8, "x": "網棚の紙袋、誰も気にしなかったのよね。"}, {"t": 2060.9, "x": "そうだ。誰でも置ける場所に、誰でも持てる袋だった。"}, {"t": 2064.45, "x": "中身も店で買える物ばかりだった。"}, {"t": 2066.766666666667, "x": "1万個のスイッチ。1万3500台の機械。"}, {"t": 2069.983333333333, "x": "年に60トンの火薬。50万枚の袋。"}, {"t": 2073.016666666667, "x": "どれも数え切れないほどある物。"}, {"t": 2075.0333333333333, "x": "だが6万8000部の新聞は配る地域が決まっていた。"}, {"t": 2078.366666666667, "x": "名古屋の最中の箱は、人の手から手へ渡っていた。"}, {"t": 2081.6666666666665, "x": "ありふれた物の中に、狭い物が混ざってたのね。"}, {"t": 2084.85, "x": "そしてその狭さを見つけたのは人だった。"}, {"t": 2087.4333333333334, "x": "窓枠の紙片をはがした記者。"}, {"t": 2089.4, "x": "配達先を一軒ずつ当たった捜査員。"}, {"t": 2091.8166666666666, "x": "ポスターを見て、記憶をたどった人たち。"}, {"t": 2094.4166666666665, "x": "国民各位の協力、ね。"}, {"t": 2096.4, "x": "そうだ。網棚の荷物は、置いた人を隠した。"}, {"t": 2099.45, "x": "だが置いた人の暮らしまでは隠せなかった。"}, {"t": 2102.116666666667, "x": "取ってる新聞や、もらったお土産……。"}, {"t": 2104.4333333333334, "x": "1968年6月16日、父の日の上り電車。"}, {"t": 2108.633333333333, "x": "見舞いの帰りだった人が、網棚の下にいた。"}, {"t": 2111.5333333333333, "x": "今回はその一つの紙袋から\n始まった5か月を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

document.getElementById('ttl').innerHTML=D.name+

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){

function mark(pane,i){

  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
