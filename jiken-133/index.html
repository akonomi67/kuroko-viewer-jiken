<script>
const D={"name": "133", "file": "133_編集用", "dur": 2107.26665625, "segs": [], "subs": [{"t": 0.0, "x": "神奈川県を走る横須賀線の電車の網棚に、\n紙袋が一つ載っていた。"}, {"t": 4.733333333333333, "x": "底が四角い、どこにでもある買い物袋だ。"}, {"t": 7.533333333333333, "x": "誰が置いたのか、気にする人はいなかった。"}, {"t": 10.3, "x": "網棚の荷物なんて、いちいち見ないものね。"}, {"t": 13.133333333333333, "x": "その紙袋が、走っている電車の中で爆発した。"}, {"t": 16.716666666666665, "x": "えっ……。"}, {"t": 17.333333333333332, "x": "1968年6月16日。"}, {"t": 19.966666666666665, "x": "国鉄の横須賀線だ。"}, {"t": 21.666666666666668, "x": "場所は鎌倉市。大船駅の手前だった。"}, {"t": 24.366666666666667, "x": "乗っていた30代の会社員が亡くなった。"}, {"t": 26.95, "x": "ほかにも大勢の乗客がけがをした。"}, {"t": 29.283333333333335, "x": "犯人はその車両にいたの？"}, {"t": 31.133333333333333, "x": "いなかった。時計じかけの仕掛けだった。"}, {"t": 33.61666666666667, "x": "置いた人は、とっくに電車を降りていた。"}, {"t": 36.11666666666667, "x": "じゃあ手がかりは何も無いじゃない。"}, {"t": 38.016666666666666, "x": "残ったのは、粉々になった袋の中身だけだ。"}, {"t": 41.1, "x": "包み紙にした古い新聞が1枚。"}, {"t": 43.416666666666664, "x": "名古屋のもなか屋の菓子箱が1つ。"}, {"t": 45.63333333333333, "x": "ほかにもいくつかの部品があった。"}, {"t": 47.75, "x": "それで犯人が分かるものなの？"}, {"t": 49.733333333333334, "x": "分かった。5か月かかってな。"}, {"t": 51.733333333333334, "x": "その新聞は、6万8000部刷られたうちの1部だった。"}, {"t": 55.333333333333336, "x": "6万8000分の1……。"}, {"t": 57.0, "x": "今回は物から人へたどり着いた捜査の話だ。"}, {"t": 60.016666666666666, "x": "国会の記録と最高裁の判決、\n当時の記者の記録で追っていく。"}, {"t": 64.85, "x": "6月16日は日曜日だった。"}, {"t": 67.13333333333334, "x": "しかもその年の父の日にあたっていた。"}, {"t": 69.65, "x": "家族で出かけた人も多そうね。"}, {"t": 71.75, "x": "そうだ。電車は行楽帰りの客で混んでいた。"}, {"t": 74.56666666666666, "x": "走っていたのは、横須賀から東京へ向かう上り電車だ。"}, {"t": 78.05, "x": "鎌倉や逗子の海や寺から帰る人が乗る路線だな。"}, {"t": 81.38333333333334, "x": "日曜の午後の、のんびりした電車ね。"}, {"t": 83.86666666666666, "x": "10両の編成だった。"}, {"t": 85.33333333333333, "x": "電車は北鎌倉の駅を出て、大船の駅に近づいていた。"}, {"t": 89.06666666666666, "x": "時刻は午後3時すぎ。"}, {"t": 90.68333333333334, "x": "大船の手前ってことは、もうすぐ乗り換えの駅ね。"}, {"t": 93.83333333333333, "x": "そうだ。降りる準備をしていた人もいただろう。"}, {"t": 96.48333333333333, "x": "その時前から6両目で大きな音がした。"}, {"t": 99.15, "x": "網棚の上の荷物が爆発したんだ。"}, {"t": 101.65, "x": "……混んでる車両で。"}, {"t": 102.85, "x": "車内は悲鳴が飛び交う\n状態だったと、記者は書いている。"}, {"t": 106.16666666666667, "x": "のちの調べでは、置かれていた場所も分かった。"}, {"t": 108.88333333333334, "x": "車両の後ろの方、左側の向かい合った\n席の上の網棚だ。"}, {"t": 112.91666666666667, "x": "座っていた人の、ちょうど頭の上ね。"}, {"t": 115.46666666666667, "x": "そういう場所だった。"}, {"t": 116.68333333333334, "x": "網棚は誰でも荷物を置ける場所だ。"}, {"t": 118.9, "x": "置いた人を覚えている人は、まずいない。"}, {"t": 121.36666666666666, "x": "だから網棚を選んだのかしら。"}, {"t": 123.4, "x": "それは裁判の話のところで出てくる。"}, {"t": 126.36666666666666, "x": "爆発した場所は、大船の駅の少し手前だ。"}, {"t": 129.45, "x": "田園踏切と呼ばれる踏切のあたりとされた。"}, {"t": 132.38333333333333, "x": "電車はそこで止まったの？"}, {"t": 134.08333333333334, "x": "電車はそのあと、車庫に入れられた。"}, {"t": 136.3, "x": "大船電車区という、電車を置いておく場所だ。"}, {"t": 139.08333333333334, "x": "けがをした人たちは？"}, {"t": 140.61666666666667, "x": "翌朝の新聞は、死者1人、重軽傷28人と伝えた。"}, {"t": 144.9, "x": "28人も……。"}, {"t": 146.15, "x": "ただあとの裁判の数え方は少し違う。"}, {"t": 148.7, "x": "一審の判決が被害者として数えたのは15人だ。"}, {"t": 152.0, "x": "亡くなった方が1人、けがをした人が14人。"}, {"t": 155.11666666666667, "x": "新聞と判決で数がずれてるのね。"}, {"t": 157.53333333333333, "x": "なぜ違うのか、記録からははっきりしない。"}, {"t": 160.11666666666667, "x": "判決の数は、罪を問う相手として\n一人ずつ数えた人数だ。"}, {"t": 164.0, "x": "この回では、両方の数をそのまま並べておく。"}, {"t": 167.06666666666666, "x": "けがの重さもいろいろだったのね。"}, {"t": 169.1, "x": "そうだ。破片を受けてけがをした人が多かった。"}, {"t": 172.03333333333333, "x": "中には長く後に残るけがをした人もいた。"}, {"t": 174.66666666666666, "x": "……。"}, {"t": 175.58333333333334, "x": "この回では、その方々のお名前は扱わない。"}, {"t": 178.51666666666668, "x": "けがの様子も、細かくは話さない。"}, {"t": 180.93333333333334, "x": "うん、それでいいと思う。"}, {"t": 182.98333333333332, "x": "亡くなったのは、東京の武蔵野市に住む会社員だ。"}, {"t": 186.2, "x": "30代の男性だった。"}, {"t": 188.0, "x": "日曜にどうして横須賀線に乗っていたの？"}, {"t": 190.66666666666666, "x": "当時の記者が、そのことを書き残している。"}, {"t": 193.35, "x": "生まれて間もない娘が、逗子の病院に入院していた。"}, {"t": 196.78333333333333, "x": "妻がそこに付き添っていた。"}, {"t": 198.68333333333334, "x": "じゃあ娘さんのお見舞いに行っていたのね。"}, {"t": 201.08333333333334, "x": "そうだ。病院で娘と過ごし、別れて帰る途中だった。"}, {"t": 204.83333333333334, "x": "父の日に生まれたばかりの娘に会いに……。"}, {"t": 207.33333333333334, "x": "その帰りの電車で、事件に遭った。"}, {"t": 209.75, "x": "……言葉が出ない。"}, {"t": 210.85, "x": "この方は爆発した荷物とは何の関係も無い。"}, {"t": 213.86666666666667, "x": "たまたまその車両の、その席にいただけだ。"}, {"t": 216.75, "x": "犯人とももちろん関係ないのよね。"}, {"t": 219.1, "x": "関係ない。会ったことも無い相手だ。"}, {"t": 221.31666666666666, "x": "警察庁の担当者は、国会でこう言っている。"}, {"t": 224.21666666666667, "x": "何の関係も無い人を殺傷する\n事件は、社会公共の敵だ、と。"}, {"t": 228.6, "x": "本当にそうね。"}, {"t": 229.8, "x": "この言葉が出た日のことは、あとで詳しく話す。"}, {"t": 232.83333333333334, "x": "ここでは一つだけ覚えておいてほしい。"}, {"t": 235.01666666666668, "x": "亡くなった方には、帰りを待つ家族がいた。"}, {"t": 237.86666666666667, "x": "うん。"}, {"t": 238.36666666666667, "x": "この回はその方を中心に置いたまま進める。"}, {"t": 241.76666666666668, "x": "爆発で車両そのものも大きく壊れた。"}, {"t": 244.28333333333333, "x": "その壊れ方は、最高裁の判決に書き残されている。"}, {"t": 247.96666666666667, "x": "判決に電車の壊れ方まで書いてあるの？"}, {"t": 250.66666666666666, "x": "あるんだ。罪の重さを決めるのに必要だったからな。"}, {"t": 253.85, "x": "判決はその車両を「5号車両」と呼んでいる。"}, {"t": 256.8833333333333, "x": "さっきは前から6両目って言ってなかった？"}, {"t": 259.5, "x": "記者の記録は6両目。"}, {"t": 260.93333333333334, "x": "判決の記録は5号車両だ。"}, {"t": 262.93333333333334, "x": "数え方の違いとみられる。"}, {"t": 264.5, "x": "今回は両方を並べておく。"}, {"t": 266.45, "x": "分かった。それでどう壊れたの？"}, {"t": 268.55, "x": "屋根と天井に張られた鉄板と合金の板が4枚。"}, {"t": 271.71666666666664, "x": "座席が7つ。網棚。窓ガラスが4枚。"}, {"t": 274.7, "x": "そのほかに、車体の付属品が8点。"}, {"t": 277.35, "x": "網棚そのものも壊れたのね。"}, {"t": 279.4, "x": "そうだ。そして破片が床いっぱいに散らばった。"}, {"t": 282.3, "x": "判決はこう書いている。"}, {"t": 283.76666666666665, "x": "乗客を乗せて安全な\n運行を続けることができない状態になった。"}, {"t": 287.81666666666666, "x": "電車として使えなくなった、ってことね。"}, {"t": 290.46666666666664, "x": "その一文が、あとで大事な意味を持つ。"}, {"t": 292.9166666666667, "x": "最高裁が「電車を壊す」とは\n何かを決めた判決なんだ。"}, {"t": 296.9166666666667, "x": "へえ。それは最後の方の話？"}, {"t": 299.1333333333333, "x": "最後の方だ。順番に行こう。"}, {"t": 301.15, "x": "まずは車内に誰が乗っていたかからだ。"}, {"t": 304.05, "x": "神奈川県警は、すぐに捜査本部を作った。"}, {"t": 306.96666666666664, "x": "1か月余りたった7月25日、国会で報告があった。"}, {"t": 311.01666666666665, "x": "どこの委員会？"}, {"t": 312.1666666666667, "x": "衆議院の運輸委員会だ。"}, {"t": 313.78333333333336, "x": "国会が開かれていない時期の、特別の審査だった。"}, {"t": 317.26666666666665, "x": "運輸委員会ってことは、鉄道の安全の話ね。"}, {"t": 320.5, "x": "そうだ。ある議員が、捜査は\nどうなっているかと聞いた。"}, {"t": 323.65, "x": "答えたのは、警察庁の説明員だ。"}, {"t": 326.18333333333334, "x": "捜査本部は140人の態勢だと述べた。"}, {"t": 329.1166666666667, "x": "140人も。"}, {"t": 330.43333333333334, "x": "捜査には二つの柱があると説明している。"}, {"t": 333.2, "x": "人の面からの捜査と、物の面からの捜査だ。"}, {"t": 336.43333333333334, "x": "人の面って、乗っていた人を調べること？"}, {"t": 339.28333333333336, "x": "そうだ。爆発した車両には66、7人が乗っていた。"}, {"t": 343.1666666666667, "x": "そのうち60人が、誰なのか分かった。"}, {"t": 345.9166666666667, "x": "日曜の行楽帰りの客を、60人も探し出したの？"}, {"t": 349.6166666666667, "x": "探し出した。一人ずつ話を聞いた。"}, {"t": 352.1166666666667, "x": "だがその中に犯人はいなかった。"}, {"t": 354.25, "x": "犯人らしい人を見た、という人も出てこなかった。"}, {"t": 357.48333333333335, "x": "残りの人は？"}, {"t": 358.6666666666667, "x": "まだ5、6人が分かっていない、と報告している。"}, {"t": 361.73333333333335, "x": "ただそれで犯人に届くとは考えにくかった。"}, {"t": 364.68333333333334, "x": "置いた人は、もう降りてたんだもんね。"}, {"t": 367.0, "x": "そこがこの種の事件の一番難しいところだった。"}, {"t": 370.73333333333335, "x": "実はこの日の質問は、\n横須賀線だけの話ではなかった。"}, {"t": 374.5833333333333, "x": "議員はもう一つの事件を並べて聞いている。"}, {"t": 377.26666666666665, "x": "もう一つ？"}, {"t": 378.23333333333335, "x": "ちょうど1年前、兵庫県で起きた電車の爆発だ。"}, {"t": 381.48333333333335, "x": "姫路から神戸へ向かう山陽電車だった。"}, {"t": 383.96666666666664, "x": "1967年の6月18日。こちらも日曜日だ。"}, {"t": 388.26666666666665, "x": "同じような事件が、1年前にもあったのね。"}, {"t": 391.21666666666664, "x": "議員はこう言った。二つとも\nいまだ犯人が分かっていない。"}, {"t": 394.56666666666666, "x": "国民は恐怖の念を持って電車に\n乗らなければならない。"}, {"t": 397.85, "x": "……怖いわよね。毎日乗る電車なのに。"}, {"t": 400.31666666666666, "x": "答えた国鉄総裁の石田禮助は、こう述べた。"}, {"t": 403.51666666666665, "x": "ああいう事故が起こらないよう、監視を厳しくしたい。"}, {"t": 406.45, "x": "でも網棚の荷物を全部調べるなんて無理よね。"}, {"t": 409.45, "x": "総裁もそこは分かっていたようだ。"}, {"t": 411.46666666666664, "x": "話は新幹線の線路に置かれる障害物へ移っていった。"}, {"t": 415.03333333333336, "x": "置き石は全国で\n毎年2000件以上ある、とも言っている。"}, {"t": 418.56666666666666, "x": "国鉄の力だけでは防げない、って話ね。"}, {"t": 421.6166666666667, "x": "そうだ。電車は誰でも乗れる場所だ。"}, {"t": 423.8666666666667, "x": "誰でも乗れるから、誰でも荷物を置ける。"}, {"t": 426.48333333333335, "x": "便利さと危なさが、背中合わせなのね。"}, {"t": 429.1666666666667, "x": "そして警察は、山陽電車の捜査の中身も報告した。"}, {"t": 432.8666666666667, "x": "それを聞くと、物の捜査がどういうものか分かる。"}, {"t": 436.3666666666667, "x": "山陽電車の車内にも、いろいろな物が残っていた。"}, {"t": 439.6166666666667, "x": "まず時計だ。精工舎の「フラワー」という型だった。"}, {"t": 443.0, "x": "1952年の11月に作られたもので、7284個ある。"}, {"t": 448.1333333333333, "x": "作られた数まで分かるのね。"}, {"t": 450.03333333333336, "x": "会社に記録が残っているからな。"}, {"t": 452.1166666666667, "x": "包んでいた新聞は、デイリースポーツだった。"}, {"t": 454.76666666666665, "x": "事件当日の6月18日付で、14万4865部刷られていた。"}, {"t": 460.26666666666665, "x": "14万部……全部は追えないわよね。"}, {"t": 462.6, "x": "警察もそう言っている。"}, {"t": 463.8833333333333, "x": "全部追うのは不可能に近い。"}, {"t": 465.7, "x": "そこで売られた地域を兵庫・京都・大阪にしぼった。"}, {"t": 469.01666666666665, "x": "さらに新聞に使われた紙に目をつけた。"}, {"t": 471.68333333333334, "x": "紙？"}, {"t": 472.31666666666666, "x": "刷った時間によって、紙を作った会社が違ったんだ。"}, {"t": 475.6666666666667, "x": "紙の違いから、どの時間に\n刷られた新聞かを割り出した。"}, {"t": 479.31666666666666, "x": "すごい細かさね。"}, {"t": 480.65, "x": "そうやって、3584部までは行き先を確かめた。"}, {"t": 484.5, "x": "だが、行き先を調べても犯人に\nたどりつく人は出なかった。"}, {"t": 488.23333333333335, "x": "ドライヤーの空き箱も残っていた。"}, {"t": 490.21666666666664, "x": "これは約46万個売られていた。"}, {"t": 492.46666666666664, "x": "そのうち約5000個の行き先を確かめた。"}, {"t": 495.1666666666667, "x": "それでも届かなかったの？"}, {"t": 496.8666666666667, "x": "届かなかった。捜査員100人で1年追っても、だ。"}, {"t": 500.26666666666665, "x": "物の捜査は、それほど気の遠くなる作業だった。"}, {"t": 503.43333333333334, "x": "横須賀線も、同じことになりそうね。"}, {"t": 506.03333333333336, "x": "警察庁の担当者も、その難しさを隠していない。"}, {"t": 510.1, "x": "山陽電車の捜査では、もう一つの見方も使われた。"}, {"t": 513.5666666666667, "x": "物から人を割り出すのではなく、\n人の条件を考える方法だ。"}, {"t": 517.6333333333333, "x": "人の条件？"}, {"t": 518.7, "x": "この爆弾を作れるのは、どんな人か、ということだ。"}, {"t": 522.0166666666667, "x": "説明員は国会でいくつも挙げている。"}, {"t": 524.3166666666667, "x": "ガスや電気の溶接、穴をあける\n機械を使える立場にある人。"}, {"t": 528.2166666666667, "x": "溶接の技術を持っている人。"}, {"t": 530.1666666666666, "x": "火薬について、それなりの知識と経験がある人。"}, {"t": 533.4833333333333, "x": "素人には無理、ってことね。"}, {"t": 535.3333333333334, "x": "そうだ。ボルトやナットを手に入れられる人でもある。"}, {"t": 538.1833333333333, "x": "さらに性格のことまで言っている。"}, {"t": 540.3, "x": "性格まで？"}, {"t": 541.3166666666667, "x": "工作がかなり精密だから、\n工作好きで凝り性だろう、と。"}, {"t": 545.0333333333333, "x": "家か職場に、工作をする場所と道具がある人だ。"}, {"t": 548.2833333333333, "x": "そういう人に、物の行き先を重ねていくのね。"}, {"t": 551.3833333333333, "x": "そうだ。人の条件と物の行き先を、結びつけて調べた。"}, {"t": 555.2666666666667, "x": "それでも山陽電車では届かなかった。"}, {"t": 557.75, "x": "条件に合う人は、きっとたくさんいたのね。"}, {"t": 560.5333333333333, "x": "腕のいい職人は、どの町にもいるからな。"}, {"t": 563.15, "x": "条件だけでは、一人にはしぼれない。"}, {"t": 565.6, "x": "やっぱり決め手は物なのね。"}, {"t": 567.45, "x": "説明員の話は、ここから捜査の難しさへ移っていく。"}, {"t": 571.7833333333333, "x": "なぜこの種の事件は、なかなか解決しないのか。"}, {"t": 574.85, "x": "説明員は国会で理由を三つ挙げた。"}, {"t": 577.3666666666667, "x": "三つ？"}, {"t": 578.1166666666667, "x": "一つ目は犯人を見た人がいないことだ。"}, {"t": 580.6333333333333, "x": "時計じかけだから、犯人はもうその車両にいない。"}, {"t": 583.6666666666666, "x": "説明員は一つの例を出している。"}, {"t": 585.8166666666667, "x": "前の年、新幹線のひかり号で起きた事件だ。"}, {"t": 589.0333333333333, "x": "新幹線でも？"}, {"t": 590.2666666666667, "x": "本の中にダイナマイトを仕掛けた事件だ。"}, {"t": 592.8, "x": "本は源氏物語だった。"}, {"t": 594.4, "x": "爆発はせず、未遂に終わった。"}, {"t": 596.6833333333333, "x": "よかった……。犯人は？"}, {"t": 598.2833333333333, "x": "少年だった。翌年の3月に捕まえている。"}, {"t": 601.3333333333334, "x": "ところが捕まえてから写真を見せて回っても。"}, {"t": 604.05, "x": "鉄道の人も乗客も、その少年を覚えていなかった。"}, {"t": 607.65, "x": "一等車に乗ってたのに？"}, {"t": 609.2833333333333, "x": "そうだ。それほど人は他人を見ていない。"}, {"t": 611.7333333333333, "x": "二つ目は爆発物が普通の荷物に見えることだ。"}, {"t": 614.8833333333333, "x": "網棚や座席に置かれると、事前にはまず気づけない。"}, {"t": 618.2166666666667, "x": "三つ目は？"}, {"t": 619.15, "x": "物の数があまりにも多いことだ。"}, {"t": 621.1333333333333, "x": "一つずつ追うと、どうしても時間がかかる。"}, {"t": 623.8833333333333, "x": "見た人はいない、気づけない、数が多い……。"}, {"t": 626.5, "x": "それでも警察は、物を追うしかなかった。"}, {"t": 629.0333333333333, "x": "では横須賀線には、何が残っていたのか。"}, {"t": 632.4666666666667, "x": "7月25日の国会で、説明員は物を一つずつ挙げた。"}, {"t": 636.5333333333333, "x": "まとめると、大きく7つになる。"}, {"t": 638.75, "x": "7つも残っていたのね。"}, {"t": 640.4666666666667, "x": "爆発で粉々になっても、部品は案外残るものなんだ。"}, {"t": 644.1166666666667, "x": "一つ目は時間で電気を入れるタイムスイッチ。"}, {"t": 646.7166666666667, "x": "二つ目は乾電池を入れておくケース。"}, {"t": 648.9166666666666, "x": "三つ目は全体を包んでいた新聞紙。"}, {"t": 651.2833333333333, "x": "四つ目は中身を入れていた菓子の箱。"}, {"t": 653.5833333333334, "x": "五つ目はそれを全部入れた紙の買い物袋。"}, {"t": 656.3, "x": "六つ目は配管に使う金具。"}, {"t": 658.1333333333333, "x": "三方継ぎ手と呼ぶ物だ。"}, {"t": 659.8666666666667, "x": "七つ目は爆発した火薬そのものだ。"}, {"t": 662.45, "x": "最初に言ってた紙袋と新聞と菓子箱も入ってるのね。"}, {"t": 666.1, "x": "そうだ。当時の記者も、車内で\n同じような物を見ている。"}, {"t": 669.5333333333333, "x": "タイムスイッチ、電池、鉄パイプ、菓子箱、新聞紙。"}, {"t": 673.1833333333333, "x": "それに紙袋の破片だ。"}, {"t": 675.0166666666667, "x": "組み立て方は……話さないのよね。"}, {"t": 677.3333333333334, "x": "話さない。この回で扱うのは、\n何が使われていたかまでだ。"}, {"t": 681.1333333333333, "x": "大事なのは、どれも店で買える物だったということだ。"}, {"t": 684.4333333333333, "x": "特別な物じゃないってこと？"}, {"t": 686.3666666666667, "x": "そうだ。だから一つ一つが、\n数え切れないほど出回っていた。"}, {"t": 690.3333333333334, "x": "山陽電車と同じで、また気の遠くなる話ね。"}, {"t": 693.55, "x": "ところが7つのうちいくつかには「狭さ」があった。"}, {"t": 696.8666666666667, "x": "狭さ？"}, {"t": 697.65, "x": "出回った数や場所が、思ったより限られていたんだ。"}, {"t": 701.4833333333333, "x": "まずタイムスイッチから見ていこう。"}, {"t": 703.3333333333334, "x": "ナショナル製だった。"}, {"t": 704.4333333333333, "x": "今で言うパナソニックだな。"}, {"t": 706.25, "x": "家電のメーカーね。"}, {"t": 707.55, "x": "家庭で決まった時間に電気を入れるための道具だ。"}, {"t": 710.4166666666666, "x": "1963年から64年にかけて、約1万個作られた。"}, {"t": 715.1166666666667, "x": "1万個。山陽電車の時計より多いわね。"}, {"t": 717.95, "x": "しかも全国に出回っていた。"}, {"t": 719.8166666666667, "x": "これだけだと、とても追い切れない。"}, {"t": 721.95, "x": "じゃあ手がかりにならないの？"}, {"t": 723.6, "x": "説明員は中を開けると特徴があると言っている。"}, {"t": 726.4833333333333, "x": "いろいろな特徴がある、という言い方だ。"}, {"t": 728.95, "x": "同じ製品でも、見分ける手がかりがあるのね。"}, {"t": 731.8333333333334, "x": "そうだ。その違いから出荷先をしぼろうとした。"}, {"t": 734.8166666666667, "x": "工場、問屋、電器店と、順番にさかのぼる捜査だ。"}, {"t": 738.5666666666667, "x": "気が遠くなるわね。"}, {"t": 739.9333333333333, "x": "説明員自身が「ばく大な量」と言っている。"}, {"t": 742.8166666666667, "x": "ただ物の捜査はこれ一つで終わらない。"}, {"t": 745.1333333333333, "x": "別々の物の行き先を重ねていくんだ。"}, {"t": 747.8166666666667, "x": "重ねる？"}, {"t": 748.65, "x": "タイムスイッチを買った人。"}, {"t": 750.15, "x": "電池ケースを持っていた人。"}, {"t": 751.95, "x": "同じ新聞を読んでいた人。"}, {"t": 753.7333333333333, "x": "その全部に当てはまる人は、ぐっと少なくなる。"}, {"t": 756.8333333333334, "x": "網の目を重ねていく感じね。"}, {"t": 758.8166666666667, "x": "そうだ。次の電池ケースは、\nその網をかなり細かくした。"}, {"t": 763.05, "x": "二つ目の物、電池を入れていたケースだ。"}, {"t": 765.6166666666667, "x": "これはあるテープレコーダーの部品だった。"}, {"t": 767.9166666666666, "x": "テープレコーダー？"}, {"t": 769.0166666666667, "x": "音を録音して聞く機械だ。"}, {"t": 770.6666666666666, "x": "持ち運べる型だった。"}, {"t": 772.2333333333333, "x": "クラウンという会社の、CTR5310型という製品だ。"}, {"t": 776.2166666666667, "x": "型番まで分かったのね。"}, {"t": 777.9, "x": "部品の形と刻印から割り出せたんだろう。"}, {"t": 780.5333333333333, "x": "この型は1964年の11月から翌年4月まで売られた。"}, {"t": 784.9666666666667, "x": "国内向けに約1万3500台だ。"}, {"t": 787.7666666666667, "x": "半年だけ売られた機械なのね。"}, {"t": 789.8833333333333, "x": "そうだ。しかも当時のテープレコーダーは高い。"}, {"t": 792.55, "x": "誰もが持っている物ではなかった。"}, {"t": 794.7333333333333, "x": "持ってる人は限られてた、ってことね。"}, {"t": 797.2, "x": "警察は売った店と買った人を順に調べていった。"}, {"t": 800.2833333333333, "x": "資料によれば、男はこの機械を\n英会話の勉強に買っていた。"}, {"t": 804.1333333333333, "x": "勉強のための道具が、こんなことに……。"}, {"t": 806.6166666666667, "x": "本来の使い方とは全く違う使われ方だな。"}, {"t": 809.75, "x": "ただこの時点で警察はまだ男を知らない。"}, {"t": 812.3666666666667, "x": "1万3500台を、一台ずつ、たどる段階だった。"}, {"t": 816.1666666666666, "x": "1万個のスイッチに、1万3500台の機械。"}, {"t": 819.6166666666667, "x": "両方に当てはまる人は、まだ見えてこない。"}, {"t": 822.2, "x": "次の物はさらに人を選ぶ物だった。"}, {"t": 825.2333333333333, "x": "七つ目の物、爆発した火薬だ。"}, {"t": 827.6833333333333, "x": "調べると日本油脂という会社の製品だと分かった。"}, {"t": 830.7833333333333, "x": "「SS」と呼ばれる種類だった。"}, {"t": 832.9333333333333, "x": "何に使う火薬なの？"}, {"t": 834.5666666666667, "x": "猟銃だ。散弾の弾を飛ばすための火薬だった。"}, {"t": 837.8, "x": "狩りの道具の火薬ね。"}, {"t": 839.3833333333333, "x": "1967年の1年間で、約60トン作られていた。"}, {"t": 843.8333333333334, "x": "60トン……量はすごく多いわね。"}, {"t": 846.0666666666667, "x": "量は多い。だが使う人は限られている。"}, {"t": 848.7, "x": "あ、猟銃を持ってる人ってこと？"}, {"t": 850.9, "x": "そうだ。猟銃を持つには警察の許可がいる。"}, {"t": 853.6333333333333, "x": "つまり持っている人の名簿は警察の手元にある。"}, {"t": 856.6833333333333, "x": "それは大きいわね。"}, {"t": 857.9666666666667, "x": "説明員もそこを強調している。"}, {"t": 860.0, "x": "東京、神奈川、\nその周りの県の猟銃の持ち主を全部調べる。"}, {"t": 864.2333333333333, "x": "全部？"}, {"t": 864.95, "x": "全部だ。神奈川県警が、\n周りの県の協力を得てやると。"}, {"t": 868.8166666666667, "x": "これで一気に人がしぼれそう。"}, {"t": 870.75, "x": "それでもまだ数千、数万の単位だろう。"}, {"t": 873.25, "x": "猟銃の持ち主で、あの型の機械を持っていた人。"}, {"t": 876.5666666666667, "x": "網の目がまた一つ重なったわね。"}, {"t": 878.8666666666667, "x": "そして場所をしぼる物が別にあった。"}, {"t": 881.0666666666667, "x": "包んでいた新聞紙だ。"}, {"t": 883.2166666666667, "x": "その前に紙袋の話をしておこう。"}, {"t": 885.5666666666667, "x": "全部を入れて網棚に置いた、あの袋だ。"}, {"t": 888.2666666666667, "x": "最初に出てきた紙袋ね。"}, {"t": 890.25, "x": "底が角型になったショッピングバッグだった。"}, {"t": 892.95, "x": "1966年から、約50万枚作られていた。"}, {"t": 896.8166666666667, "x": "50万枚は、さすがに追えないわよね。"}, {"t": 899.3666666666667, "x": "追えない。だから警察は別の手を使った。"}, {"t": 902.1166666666667, "x": "別の手？"}, {"t": 903.0166666666667, "x": "実物や実物そっくりのポスターを作った。"}, {"t": 905.8333333333334, "x": "それを街頭や駅に貼り出したんだ。"}, {"t": 908.05, "x": "見覚えのある人はいませんか、ってことね。"}, {"t": 910.6166666666667, "x": "そうだ。説明員は\n「御協力を願っている」と言っている。"}, {"t": 914.2333333333333, "x": "人の記憶を集める捜査だな。"}, {"t": 916.35, "x": "網棚の袋なんて、誰も覚えてないって話だったけど。"}, {"t": 920.0333333333333, "x": "置いたところは覚えていなくても。"}, {"t": 921.9, "x": "持って歩いていた人を見た人はいるかもしれない。"}, {"t": 924.7666666666667, "x": "なるほど乗る前の姿ね。"}, {"t": 926.5833333333334, "x": "同じ考えで、菓子箱や配管の金具も調べられた。"}, {"t": 929.9833333333333, "x": "配管の金具は日本鋼管の製品だった。"}, {"t": 932.7833333333333, "x": "ガスや水道、プロパンガスの管をつなぐ物だ。"}, {"t": 935.8166666666667, "x": "それもどこにでもありそう。"}, {"t": 937.4166666666666, "x": "月に1万3000個ほど作られていた。"}, {"t": 939.75, "x": "比較的新しい物とみて追った。"}, {"t": 942.1333333333333, "x": "どれもありふれた物ばかりね。"}, {"t": 943.9833333333333, "x": "だからこそ、一番ありふれた物が効いてくる。新聞だ。"}, {"t": 948.15, "x": "新聞の話には、一人の新聞記者が関わっている。"}, {"t": 951.55, "x": "当時朝日新聞で警視庁を担当していた記者だ。"}, {"t": 954.75, "x": "記者が捜査に関わったの？"}, {"t": 956.6, "x": "正確には記者が独自に見つけた手がかりだ。"}, {"t": 959.3166666666667, "x": "この記者は、のちに日本記者クラブに\n取材の記録を残した。"}, {"t": 963.05, "x": "事件の日、記者たちは現場に向かった。"}, {"t": 965.5333333333333, "x": "だが電車は、もう大船電車区の車庫に入っていた。"}, {"t": 968.8333333333334, "x": "車両はもう現場にないのね。"}, {"t": 970.65, "x": "その夜記者は一人で車庫を訪れた。"}, {"t": 972.95, "x": "電車の外側を、ぐるりと見て回った。"}, {"t": 975.5666666666667, "x": "外側を？"}, {"t": 976.5166666666667, "x": "すると窓枠の外に、白い\n米粒のような物が付いていた。"}, {"t": 980.3333333333334, "x": "お弁当のご飯つぶかしら。"}, {"t": 982.1333333333333, "x": "記者もそう思ったらしい。はがし取ってみた。"}, {"t": 984.7333333333333, "x": "指先で広げていくと、それは新聞紙の切れ端だった。"}, {"t": 988.3833333333333, "x": "新聞の切れ端が、窓の外に？"}, {"t": 990.7333333333333, "x": "爆発で紙が細かくちぎれた。"}, {"t": 992.85, "x": "開いていた窓から外へ飛び出し、窓枠に張り付いた。"}, {"t": 996.1833333333333, "x": "記者はそう考えている。"}, {"t": 997.8, "x": "6月だから、窓を開けてたのね。"}, {"t": 1000.15, "x": "そうだろう。その小さな紙片に、文字が残っていた。"}, {"t": 1003.5166666666667, "x": "何が書いてあったの？"}, {"t": 1004.9666666666667, "x": "表と裏、両方に広告の一部が残っていたんだ。"}, {"t": 1008.7666666666667, "x": "紙片の表は広告の欄だった。"}, {"t": 1010.7833333333333, "x": "皇太子一家についての記事を\n宣伝する広告らしかった。"}, {"t": 1014.3333333333334, "x": "雑誌の広告かしら。"}, {"t": 1015.9166666666666, "x": "週刊誌の記事だったようだ。"}, {"t": 1017.5333333333333, "x": "記者はそこから時期を推し量った。"}, {"t": 1019.6333333333333, "x": "裏は運送会社の求人広告だった。"}, {"t": 1022.1833333333333, "x": "会社の名前は読めたの？"}, {"t": 1023.8833333333333, "x": "一字しか読めなかった。"}, {"t": 1025.3666666666666, "x": "だが電話番号の市外局番が切れ切れに残っていた。"}, {"t": 1028.7, "x": "市外局番で、場所が分かるのね。"}, {"t": 1031.05, "x": "そうだ。東京の武蔵野市の会社だと分かった。"}, {"t": 1034.1166666666666, "x": "武蔵野市って、東京の西の方よね。"}, {"t": 1036.7166666666667, "x": "記者は大船署の近くに借りた家で、作業を続けた。"}, {"t": 1040.05, "x": "武蔵野の支局に問い合わせ、\nその運送会社に電話をかけた。"}, {"t": 1043.9333333333334, "x": "夜中に？"}, {"t": 1044.8, "x": "出たのは宿直の担当者だった。"}, {"t": 1046.9666666666667, "x": "その人がこう教えてくれた。"}, {"t": 1048.7166666666667, "x": "あの求人広告は、毎日新聞か\nサンケイ新聞に出したはずだ。"}, {"t": 1052.7833333333333, "x": "東京都下の、多摩地方の版だ、と。"}, {"t": 1055.35, "x": "じゃあ新聞の種類も地域も分かったのね。"}, {"t": 1057.8833333333334, "x": "記者はそれを書いた。だが翌朝の扱いは小さかった。"}, {"t": 1061.2166666666667, "x": "1面のわずか3行だった。"}, {"t": 1063.15, "x": "3行だけ？"}, {"t": 1064.1833333333334, "x": "記者は抗議した。すると夕刊の1面に大きく載った。"}, {"t": 1067.5833333333333, "x": "見出しは「犯人は三多摩地方か」だった。"}, {"t": 1071.05, "x": "この夕刊の記事には、ほかの社の記者も反応した。"}, {"t": 1074.2833333333333, "x": "産経新聞の記者が、捜査本部へ駆けつけたんだ。"}, {"t": 1077.6666666666667, "x": "自分の会社の新聞かもしれないものね。"}, {"t": 1080.3, "x": "そうだ。記者は幹部にこう聞いた。"}, {"t": 1082.35, "x": "残された新聞は、サンケイですか。"}, {"t": 1084.7666666666667, "x": "幹部は何て？"}, {"t": 1085.8666666666666, "x": "これから調べるところです、と答えた。"}, {"t": 1088.4166666666667, "x": "警察より先に、記者が新聞を割り出しかけてたのね。"}, {"t": 1091.9333333333334, "x": "少なくとも、記事が出た時点ではそうだった。"}, {"t": 1094.7166666666667, "x": "産経の記者は、朝日の記者の方を\n向いて感心していたという。"}, {"t": 1098.65, "x": "ライバルなのに、ちょっといい話ね。"}, {"t": 1100.8833333333334, "x": "記者同士の競争が、事件の報道を\n前に進めた面はある。"}, {"t": 1104.6666666666667, "x": "でも記事が出ると犯人にも伝わっちゃわない？"}, {"t": 1107.3833333333334, "x": "そこは難しいところだな。"}, {"t": 1109.1, "x": "新聞が手がかりだと、犯人も知ることになる。"}, {"t": 1112.15, "x": "逃げたり証拠を捨てたりしないかしら。"}, {"t": 1114.4166666666667, "x": "ただ配られた新聞はもう取り戻せない。"}, {"t": 1116.7833333333333, "x": "販売店の配達の記録も、犯人には消せない。"}, {"t": 1120.0833333333333, "x": "あ、そうか。"}, {"t": 1121.1166666666666, "x": "犯人が隠せるのは自分の手元の物だけだ。"}, {"t": 1123.9833333333333, "x": "町に残った記録までは、どうにもできなかった。"}, {"t": 1127.5666666666666, "x": "では警察はその新聞をどう特定したのか。"}, {"t": 1130.3166666666666, "x": "7月25日の国会で、説明員がはっきり答えている。"}, {"t": 1134.1666666666667, "x": "爆弾を包んでいたのは、毎日新聞だった。"}, {"t": 1137.1166666666666, "x": "1968年の4月17日付、13版の東京都下版だ。"}, {"t": 1142.15, "x": "記者の読みが当たってたのね。"}, {"t": 1143.9666666666667, "x": "新聞の種類と地域は、記者の見立ての通りだった。"}, {"t": 1147.1833333333334, "x": "日付は記者の初めの見立てより一日二日あとだ。"}, {"t": 1150.4333333333334, "x": "東京都下版って、何？"}, {"t": 1152.3, "x": "同じ日の新聞でも、地域ごとに中身が少し違う。"}, {"t": 1155.6333333333334, "x": "東京の23区の外、三多摩に配る版のことだ。"}, {"t": 1159.2333333333333, "x": "じゃあ配られた場所が限られるのね。"}, {"t": 1161.4166666666667, "x": "そうだ。この版は6万8000部刷られていた。"}, {"t": 1164.2666666666667, "x": "そして三多摩の地方で売られていた。"}, {"t": 1166.5333333333333, "x": "6万8000部。山陽電車の14万部の半分以下ね。"}, {"t": 1170.3, "x": "しかも新聞は、毎朝家に届けられる物だ。"}, {"t": 1173.35, "x": "あ、配達されてる家が分かる……。"}, {"t": 1175.4166666666667, "x": "そうだ。販売店には配達先の記録がある。"}, {"t": 1178.3833333333334, "x": "説明員はこういう方針だと述べている。"}, {"t": 1180.75, "x": "販売店、それから購入先を、全部解明する。"}, {"t": 1184.1, "x": "全部！"}, {"t": 1184.8, "x": "警視庁と神奈川県警が力を合わせて進めていた。"}, {"t": 1188.2166666666667, "x": "電車は神奈川、新聞は東京なのね。"}, {"t": 1190.9, "x": "そうだ。事件が県の境を越えていた。"}, {"t": 1193.3833333333334, "x": "犯人は三多摩に住んでいるかもしれない。"}, {"t": 1196.4, "x": "もう一つの物、菓子箱の話をしよう。"}, {"t": 1199.0166666666667, "x": "中身を入れていたのは、菓子の空き箱だった。"}, {"t": 1201.6833333333334, "x": "名古屋市内の、もなかを作る店が使っていた箱だ。"}, {"t": 1205.1, "x": "もなかの箱？"}, {"t": 1206.2333333333333, "x": "あんこを薄い皮ではさんだ和菓子だな。"}, {"t": 1208.5333333333333, "x": "名古屋のお菓子なのに、事件は\n神奈川で、新聞は東京。"}, {"t": 1212.2, "x": "そうなんだ。場所がばらばらだった。"}, {"t": 1214.3, "x": "説明員はこの箱についてはこう言っている。"}, {"t": 1216.8166666666666, "x": "業者も見当がつかないくらい量が多い。"}, {"t": 1219.3166666666666, "x": "じゃあ、手がかりは無いんじゃ。"}, {"t": 1221.0, "x": "それでも何か手がかりにならないかと調べていると。"}, {"t": 1224.0833333333333, "x": "あきらめてはいないのね。"}, {"t": 1225.5833333333333, "x": "記者の記録にも、この箱は\n手がかりの一つとして出てくる。"}, {"t": 1229.2333333333333, "x": "名古屋市内で売られていた最中の菓子箱、と。"}, {"t": 1232.0833333333333, "x": "でも三多摩に住む人が名古屋の箱を持ってるって。"}, {"t": 1235.1833333333334, "x": "そこがこの箱の意味だ。"}, {"t": 1236.7166666666667, "x": "自分で名古屋へ行ったか、誰かにもらったか。"}, {"t": 1239.5333333333333, "x": "お土産ね！"}, {"t": 1240.4666666666667, "x": "そうだ。もらった物なら、渡した人がいる。"}, {"t": 1243.35, "x": "渡した人は、たいてい覚えている。"}, {"t": 1245.65, "x": "人の記憶につながる箱なのね。"}, {"t": 1247.8666666666666, "x": "新聞が地域をしぼり、箱が人をしぼった。"}, {"t": 1250.6333333333334, "x": "その二つが重なるまで、あと4か月かかる。"}, {"t": 1254.1666666666667, "x": "7月25日の報告の終わりに、説明員はこう述べた。"}, {"t": 1257.9333333333334, "x": "何の関係も無い人を殺傷する\n事件は、社会公共の敵だ。"}, {"t": 1262.0333333333333, "x": "最初の方で出てきた言葉ね。"}, {"t": 1264.0666666666666, "x": "そうだ。続けてこう言っている。"}, {"t": 1265.9166666666667, "x": "検挙するのが私ども警察の責務であると痛感している。"}, {"t": 1269.5166666666667, "x": "国民の皆さまの協力を得て、一日も早く解決したい。"}, {"t": 1273.4666666666667, "x": "協力ってさっきのポスターみたいなこと？"}, {"t": 1275.9833333333333, "x": "そうだ。物の捜査には、人の記憶がどうしても要る。"}, {"t": 1279.3166666666666, "x": "説明員は横須賀線の事件が起きた時のことも話した。"}, {"t": 1282.9666666666667, "x": "すぐに兵庫県警と警視庁を集めて会議を開いた。"}, {"t": 1286.2833333333333, "x": "山陽電車の兵庫と、新聞の東京ね。"}, {"t": 1289.1, "x": "そうだ。物の捜査は全国に広がるからだ。"}, {"t": 1291.9333333333334, "x": "警察庁が全体をまとめて、全国で追う態勢にした。"}, {"t": 1295.5833333333333, "x": "県ごとの捜査じゃ足りないのね。"}, {"t": 1297.5833333333333, "x": "資料によれば、この事件は\n警察庁の広域重要指定事件になった。"}, {"t": 1301.8666666666666, "x": "番号は107号だ。"}, {"t": 1303.6, "x": "広域重要指定って、何？"}, {"t": 1305.6666666666667, "x": "いくつもの県にまたがる重大な事件を、\n国がまとめて指定するものだ。"}, {"t": 1309.9166666666667, "x": "一つの事件だけで指定されたのは、\nこれが唯一の例とされる。"}, {"t": 1313.7833333333333, "x": "それだけ特別扱いだったのね。"}, {"t": 1316.0666666666666, "x": "そして秋、同じ指定を受ける事件がもう一つ起きる。"}, {"t": 1319.45, "x": "108号……？"}, {"t": 1320.4833333333333, "x": "そうだ。その話は次の章で少しだけする。"}, {"t": 1324.0833333333333, "x": "1968年の秋、警察は大きな事件を同時に抱えていた。"}, {"t": 1328.6166666666666, "x": "12月、国家公安委員長の荒木萬壽夫が\n国会でこう述べている。"}, {"t": 1332.6333333333334, "x": "最近の犯罪で注目されるのは、三つの種類の事件だ。"}, {"t": 1336.4666666666667, "x": "三つ？"}, {"t": 1337.2, "x": "拳銃による連続射殺事件。"}, {"t": 1339.1833333333334, "x": "金融機関に対する強盗事件。"}, {"t": 1341.3, "x": "そして列車などに対する爆破事件だ。"}, {"t": 1343.85, "x": "拳銃の事件って……。"}, {"t": 1345.3, "x": "秋に東京や京都などで続いた\n事件だ。これが108号になった。"}, {"t": 1349.3666666666666, "x": "この回では詳しく扱わない。"}, {"t": 1351.1166666666666, "x": "別の回で取り上げている。"}, {"t": 1352.8666666666666, "x": "金融機関の強盗は？"}, {"t": 1354.5, "x": "12月10日の、いわゆる三億円事件も、この頃だ。"}, {"t": 1358.1666666666667, "x": "同じ年なのね……。"}, {"t": 1359.4833333333333, "x": "そうだ。大きな事件が、立て続けに起きていた。"}, {"t": 1362.65, "x": "警察は手が回ったのかしら。"}, {"t": 1364.6333333333334, "x": "当時の国会では、警察は手が\n足りているのかという声も出た。"}, {"t": 1368.3, "x": "刑事局長は、刑事事件が\nおろそかになることはないと答えている。"}, {"t": 1372.3833333333334, "x": "大変な年だったのね。"}, {"t": 1374.1, "x": "その中で横須賀線の捜査は地道に続いていた。"}, {"t": 1377.2333333333333, "x": "新聞の配達先を、一軒ずつ当たる作業だ。"}, {"t": 1380.3833333333334, "x": "派手さは全く無いわね。"}, {"t": 1382.05, "x": "無い。だがその地道さが結果を出す。"}, {"t": 1384.3833333333334, "x": "国家公安委員長は同じ演説でこう言った。"}, {"t": 1387.0666666666666, "x": "幸い横須賀線電車爆破事件は、解決を見た。"}, {"t": 1391.0333333333333, "x": "捜査本部は、都下に配られた\n毎日新聞の配達先を調べた。"}, {"t": 1395.1666666666667, "x": "記者の記録にも、そう書かれている。"}, {"t": 1397.5333333333333, "x": "6万8000部の配達先ね。"}, {"t": 1399.7666666666667, "x": "そうだ。その家々に、ほかの物の網を重ねていく。"}, {"t": 1403.05, "x": "猟銃の持ち主の名簿。"}, {"t": 1404.5, "x": "テープレコーダーを買った人。"}, {"t": 1406.3333333333333, "x": "二つも三つも重なる家は、少ないわよね。"}, {"t": 1409.3166666666666, "x": "少ない。資料によれば、一人の男が浮かんだ。"}, {"t": 1412.3833333333334, "x": "東京の日野市に住む、25歳の大工だった。"}, {"t": 1415.5, "x": "日野市って、三多摩の中よね。"}, {"t": 1417.7166666666667, "x": "そうだ。資料によれば男は毎日新聞を取っていた。"}, {"t": 1421.0166666666667, "x": "そして猟銃の許可を受けて散弾銃を持っていた。"}, {"t": 1424.0333333333333, "x": "新聞と火薬が、一人に重なったのね。"}, {"t": 1426.85, "x": "大工だから、道具の扱いにも慣れていた。"}, {"t": 1429.6166666666666, "x": "でもそれだけで犯人とは言えないわよね。"}, {"t": 1432.0666666666666, "x": "言えない。新聞を取る\n猟銃の持ち主は、ほかにもいる。"}, {"t": 1435.35, "x": "ここで名古屋の箱が効いてくる。"}, {"t": 1437.35, "x": "お土産の話ね。"}, {"t": 1438.75, "x": "資料によれば、警察はある事実を突き止めた。"}, {"t": 1441.6333333333334, "x": "前の年男の隣の家の夫婦が新婚旅行に出かけていた。"}, {"t": 1445.3833333333334, "x": "行き先で名古屋の最中を土産に買っていた。"}, {"t": 1448.1166666666666, "x": "まさか……。"}, {"t": 1448.9166666666667, "x": "その最中を、隣に住む男に渡していた。"}, {"t": 1451.9, "x": "箱が男の家に入っていたのね。"}, {"t": 1454.1666666666667, "x": "新聞、火薬、そして箱。"}, {"t": 1456.0, "x": "三つの物が一人に重なった。"}, {"t": 1458.8, "x": "1968年11月9日。"}, {"t": 1461.4666666666667, "x": "事件から5か月近くたっていた。"}, {"t": 1463.7166666666667, "x": "資料によれば、捜査員は男の仕事場を訪ねた。"}, {"t": 1467.0, "x": "いきなり逮捕じゃないのね。"}, {"t": 1468.65, "x": "まず任意で警察へ来てほしいと頼んだ。"}, {"t": 1471.1, "x": "そして集めた証拠を男に示した。"}, {"t": 1473.55, "x": "男はどうしたの？"}, {"t": 1474.8666666666666, "x": "資料によれば、男は犯行を\n認めた。そのまま逮捕された。"}, {"t": 1478.8333333333333, "x": "……認めたのね。"}, {"t": 1479.95, "x": "横須賀線の電車に、\n時限式の爆弾を仕掛けたと話した。"}, {"t": 1483.85, "x": "記者の記録では、ここは短く書かれている。"}, {"t": 1486.6166666666666, "x": "11月、東京都日野市に住む容疑者が\n逮捕され、事件は解決した。"}, {"t": 1491.3833333333334, "x": "記者は自分の記事を思い出したでしょうね。"}, {"t": 1493.8333333333333, "x": "「書いたとおりになった」と振り返っている。"}, {"t": 1496.3333333333333, "x": "三多摩の新聞、っていう記事ね。"}, {"t": 1498.4333333333334, "x": "そうだ。窓枠の紙片から始まった見立てだった。"}, {"t": 1501.55, "x": "ここで一つ、はっきりさせておきたい。"}, {"t": 1504.0333333333333, "x": "なに？"}, {"t": 1504.65, "x": "この男はのちに裁判で有罪が確定している。"}, {"t": 1507.6, "x": "犯人であることは、最高裁で刑が確定した事実だ。"}, {"t": 1511.1333333333334, "x": "ただこの回では男の名前は出さない。"}, {"t": 1513.5666666666666, "x": "亡くなった方のご家族のことを考えて、よね。"}, {"t": 1516.6666666666667, "x": "そうだ。主役は男ではなく、\n男にたどり着いた物と人だ。"}, {"t": 1520.7666666666667, "x": "うん。"}, {"t": 1521.7833333333333, "x": "でもどうして横須賀線だったの？"}, {"t": 1523.7833333333333, "x": "日野市からだと、ずいぶん遠いわよね。"}, {"t": 1526.2, "x": "そこに男の動機が関わっている。"}, {"t": 1528.35, "x": "資料によれば、男は山形県の出身だった。"}, {"t": 1531.4166666666667, "x": "結婚を約束した相手がいたが、別れることになった。"}, {"t": 1534.9666666666667, "x": "その恨みで……？"}, {"t": 1536.0166666666667, "x": "資料はそう書いている。"}, {"t": 1537.1833333333334, "x": "相手への恨みを晴らすためだった、と。"}, {"t": 1539.5333333333333, "x": "横須賀線は、その相手が山形から\n上京するときに使っていた路線だ。"}, {"t": 1544.1666666666667, "x": "じゃあ相手を狙ったの？"}, {"t": 1545.6, "x": "記者の記録では、相手が使うと\n思われる電車に仕掛けた、とある。"}, {"t": 1549.6, "x": "だが資料によれば、相手は\nその頃その電車を使っていなかった。"}, {"t": 1553.55, "x": "……じゃあ、亡くなった方は。"}, {"t": 1555.25, "x": "全く関係の無い人だった。"}, {"t": 1557.0666666666666, "x": "乗っていた乗客全員がそうだ。"}, {"t": 1559.2, "x": "個人の恨みで、知らない人たちが巻き込まれたのね。"}, {"t": 1562.5, "x": "記者はうっぷん晴らしだったと書いている。"}, {"t": 1564.8166666666666, "x": "そんな理由で……。"}, {"t": 1565.9333333333334, "x": "自分の気持ちの問題を、無関係の大勢にぶつけた。"}, {"t": 1569.3666666666666, "x": "網棚を選んだのも、そのせい？"}, {"t": 1571.4833333333333, "x": "網棚は置いた人が誰かを分からなくする場所だ。"}, {"t": 1574.3666666666666, "x": "そして誰が下に座るかも選べない場所だ。"}, {"t": 1577.1166666666666, "x": "誰に当たってもいい、ってことよね。"}, {"t": 1579.2333333333333, "x": "裁判はまさにそこを問題にした。"}, {"t": 1582.0, "x": "逮捕の翌月、国会で警察のまとめが述べられた。"}, {"t": 1585.35, "x": "1968年12月17日の衆議院、19日の参議院だ。"}, {"t": 1590.2833333333333, "x": "どちらも同じ人？"}, {"t": 1591.6666666666667, "x": "国家公安委員長の荒木萬壽夫だ。"}, {"t": 1593.6833333333334, "x": "就任したばかりだった。"}, {"t": 1595.3333333333333, "x": "その所信の中に、横須賀線の事件が出てくる。"}, {"t": 1598.5, "x": "幸い横須賀線電車爆破事件については、"}, {"t": 1601.2833333333333, "x": "国民各位の御協力により解決を見た。"}, {"t": 1604.0666666666666, "x": "国民の協力、って言葉が入ってるのね。"}, {"t": 1606.9, "x": "そうだ。ポスター、配達先、土産を覚えていた人。"}, {"t": 1610.3666666666666, "x": "たくさんの人の記憶がつながった結果だった。"}, {"t": 1613.2833333333333, "x": "記者の紙片もね。"}, {"t": 1614.65, "x": "そうだな。委員長は続けて、こう述べている。"}, {"t": 1617.4, "x": "広域の捜査態勢を、さらに充実させる。"}, {"t": 1620.2, "x": "捜査のやり方を、科学的で合理的なものにしていく。"}, {"t": 1623.7333333333333, "x": "物の捜査を、もっと速くしたいってことね。"}, {"t": 1626.5833333333333, "x": "そうだ。山陽電車の事件は、まだ解決していなかった。"}, {"t": 1630.2666666666667, "x": "1年以上追っても届かない事件があった。"}, {"t": 1632.9166666666667, "x": "横須賀線が解決できて、\n山陽電車ができなかったのは？"}, {"t": 1636.7833333333333, "x": "資料からは、はっきりとは言えない。"}, {"t": 1638.8166666666666, "x": "ただ横須賀線には配られた地域の狭い新聞があった。"}, {"t": 1642.1833333333334, "x": "そして人の手を渡った菓子箱があった。"}, {"t": 1644.75, "x": "物の「狭さ」が分かれ目だったのかもね。"}, {"t": 1647.65, "x": "その違いは大きかったと思う。"}, {"t": 1650.1333333333334, "x": "翌1969年の春にも、国会でこの事件が語られた。"}, {"t": 1654.5, "x": "3月25日の参議院、地方行政委員会だ。"}, {"t": 1657.8333333333333, "x": "まだ話題になってたのね。"}, {"t": 1659.5, "x": "この日は未解決の事件が問題になっていた。"}, {"t": 1662.3333333333333, "x": "三億円事件、連続ピストル射殺事件、\n銀行の強盗事件だ。"}, {"t": 1666.7166666666667, "x": "どれも解決していなかったのね。"}, {"t": 1668.85, "x": "答えた警察庁の刑事局長は、こう言っている。"}, {"t": 1671.9166666666667, "x": "自慢するわけではないが、と前置きしてな。"}, {"t": 1674.5, "x": "ほとんど捜査不可能といわれた横須賀線事件なども、"}, {"t": 1677.7, "x": "克明な苦心惨たんの捜査を\n遂げて犯人に到着している。"}, {"t": 1681.4666666666667, "x": "捜査不可能って言われてたのね。"}, {"t": 1683.5166666666667, "x": "目撃者がいない。物はありふれている。\nそういう事件だった。"}, {"t": 1687.1166666666666, "x": "4月11日の衆議院、法務委員会でも出てくる。"}, {"t": 1690.3333333333333, "x": "国家公安委員長が、こう述べた。"}, {"t": 1692.4833333333333, "x": "近代的な捜査能力に、一人一人の警察官の使命感。"}, {"t": 1696.4833333333333, "x": "執念深い捜査努力が、功を奏した。"}, {"t": 1699.2, "x": "足で稼いだ、って感じね。"}, {"t": 1701.1, "x": "委員長は同じ答弁で、こんな言い方もしている。"}, {"t": 1704.0, "x": "足をすりこ木のようにしてでも、という言い方だ。"}, {"t": 1706.8833333333334, "x": "すりこ木？"}, {"t": 1707.7333333333333, "x": "すり減るほど歩き回る、という意味だな。"}, {"t": 1710.2666666666667, "x": "配達先を一軒ずつ、だもんね。"}, {"t": 1712.6833333333334, "x": "そうだ。5か月の捜査は、\nそういう仕事の積み重ねだった。"}, {"t": 1717.05, "x": "男は横浜地方裁判所に起訴された。"}, {"t": 1719.6666666666667, "x": "罪の名前はいくつもあった。"}, {"t": 1721.4, "x": "殺人、爆発物取締罰則違反、そして船車覆没致死だ。"}, {"t": 1725.9833333333333, "x": "船車覆没？　難しい言葉ね。"}, {"t": 1728.3833333333334, "x": "船や電車をひっくり返したり\n壊したりして、人を死なせる罪だ。"}, {"t": 1732.4166666666667, "x": "最高裁の判決の事件名にも、この言葉が入っている。"}, {"t": 1736.1666666666667, "x": "電車の事件ならではの罪なのね。"}, {"t": 1738.4333333333334, "x": "資料によれば、初公判は1968年の12月25日だった。"}, {"t": 1743.3666666666666, "x": "男は起訴状に書かれた行為そのものは認めた。"}, {"t": 1746.4166666666667, "x": "じゃあ争うところは無かったの？"}, {"t": 1748.35, "x": "一つだけあった。殺意だ。"}, {"t": 1750.2166666666667, "x": "男は人を殺すつもりは無かったと言い続けた。"}, {"t": 1753.2333333333333, "x": "爆弾を混んだ電車に置いて、それは……。"}, {"t": 1755.6833333333334, "x": "裁判所もその言い分をそのままには受け取らなかった。"}, {"t": 1758.75, "x": "1969年の3月3日、検察は死刑を求めた。"}, {"t": 1763.05, "x": "死刑……。"}, {"t": 1763.75, "x": "亡くなった方は1人。だがけがをした人は大勢いた。"}, {"t": 1767.05, "x": "そして無関係の乗客を狙った事件だった。"}, {"t": 1769.9833333333333, "x": "判決はいつ？"}, {"t": 1771.15, "x": "資料によれば、求刑から17日後だ。"}, {"t": 1773.8166666666666, "x": "判決の中で、殺意の問題に一つの答えが出された。"}, {"t": 1777.5833333333333, "x": "殺すつもりは無かった、が通ったかどうか、ね。"}, {"t": 1780.65, "x": "鍵になったのは、事件の前に男がしていたことだった。"}, {"t": 1784.8, "x": "1969年3月20日、横浜地方裁判所の判決だ。"}, {"t": 1789.4833333333333, "x": "資料によれば、判決は求刑の通り死刑だった。"}, {"t": 1792.7166666666667, "x": "殺意は認められたの？"}, {"t": 1794.3166666666666, "x": "認められた。その理由が大事だ。"}, {"t": 1796.5166666666667, "x": "男は事件の前に、3回、爆発の試しをしていた。"}, {"t": 1800.25, "x": "試しって……前もって爆発させてみたってこと？"}, {"t": 1803.4333333333334, "x": "そうだ。資料はそう書いている。"}, {"t": 1805.2833333333333, "x": "だから男は、爆発が\nどれほどの力か十分に知っていた。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);

sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
