<script>
const D={"name": "156", "file": "156_編集用", "dur": 2059.0833125, "segs": [], "subs": [{"t": 0.0, "x": "2001年9月1日、土曜日の午前1時ごろのことだ。"}, {"t": 3.683333333333333, "x": "東京都新宿区の歌舞伎町で、雑居ビルから火が出た。"}, {"t": 7.15, "x": "火が出たのは、ビルの3階あたりだった。"}, {"t": 9.733333333333333, "x": "夜中の繁華街ね。中に人はいたの？"}, {"t": 12.45, "x": "いた。この火事で44人が亡くなっている。"}, {"t": 15.133333333333333, "x": "けがをした人は3人だ。"}, {"t": 16.95, "x": "44人も？　そんなに大きなビルだったの？"}, {"t": 19.816666666666666, "x": "いや。延べ面積は\n500平方メートルほどの小さなビルだ。"}, {"t": 23.35, "x": "それなのに、この火が\nどこから来たのかは分かっていない。"}, {"t": 26.5, "x": "火が出た場所は、\n3階のエレベーターホールのあたりだ。"}, {"t": 29.65, "x": "場所まで分かっているのに、原因が分からないの？"}, {"t": 32.55, "x": "警視庁は、放火と失火の両方で調べた。"}, {"t": 35.35, "x": "半年後の国会で警察庁は、\n原因の特定に至っていないと答えた。"}, {"t": 39.833333333333336, "x": "25年たった2026年の消防の資料にも、\n未解明と書かれている。"}, {"t": 44.46666666666667, "x": "今回は、この夜の記録を\n国の資料だけで1つずつ読んでいく。"}, {"t": 48.45, "x": "記録の中にも、まだ分からないことがあるの？"}, {"t": 51.31666666666667, "x": "ある。4階からの119番は、\n2分おきに4本かかっていた。"}, {"t": 55.45, "x": "火が出た3階からは、1本もなかったと\n国会で語られている。"}, {"t": 59.25, "x": "ビルの階の数でさえ、資料に\nよって4階と5階に分かれる。"}, {"t": 62.96666666666667, "x": "数字までそろっていないのね。"}, {"t": 64.81666666666666, "x": "亡くなった人の名前は出さず、\n誰がやったかの話もしない。"}, {"t": 68.5, "x": "残っている記録を、順番に追っていこう。"}, {"t": 71.61666666666666, "x": "記録ってどこに残っているの？"}, {"t": 73.58333333333333, "x": "いちばん多いのは国会の会議録だ。"}, {"t": 75.76666666666667, "x": "火事の12日後から、総務委員会で\nくり返し取り上げられた。"}, {"t": 79.46666666666667, "x": "消防庁の長官や警察庁の局長が、そこで答えている。"}, {"t": 83.41666666666667, "x": "役所の人が直接答えた記録なのね。"}, {"t": 86.23333333333333, "x": "次に、当日の朝に内閣府が出した第1報がある。"}, {"t": 89.6, "x": "11時30分の時点で、分かっていたことが並んでいる。"}, {"t": 93.21666666666667, "x": "それから、消防庁と国土交通省が\nのちにまとめた資料だ。"}, {"t": 96.98333333333333, "x": "東京消防庁の研究所が行った実験の報告書もある。"}, {"t": 100.71666666666667, "x": "最後に、翌年の消防白書で法律の改正を確かめる。"}, {"t": 104.6, "x": "新聞や雑誌は使わないの？"}, {"t": 106.5, "x": "使わない。ただ、国会で議員が\n新聞を引いた場面はある。"}, {"t": 110.03333333333333, "x": "そこは、議員がそう述べたという形で紹介する。"}, {"t": 113.7, "x": "そのビルは歌舞伎町のどのあたりにあったの？"}, {"t": 116.26666666666667, "x": "内閣府の第1報には、住所がこう書かれている。"}, {"t": 119.3, "x": "新宿区歌舞伎町1丁目18の4。"}, {"t": 121.76666666666667, "x": "消防庁の長官は、歌舞伎町一番街にある\nビルだと国会で報告した。"}, {"t": 126.26666666666667, "x": "ビルの名前は明星56ビルだ。"}, {"t": 128.51666666666668, "x": "一番街って人が多い通りよね。"}, {"t": 130.73333333333332, "x": "ある議員は、翌年の春に現場を見に行っている。"}, {"t": 133.63333333333333, "x": "場所が分からず、しばらくうろうろしたそうだ。"}, {"t": 136.2, "x": "同じような雑居ビルが、たくさん\n並んでいたからだと述べた。"}, {"t": 139.68333333333334, "x": "その議員は、場所をコマ劇場のそばだと言っている。"}, {"t": 142.81666666666666, "x": "まわりのビルと見分けがつかないくらいなのね。"}, {"t": 145.41666666666666, "x": "シャッターが閉まり、禁止命令の紙が\n張ってあったという。"}, {"t": 148.6, "x": "ここで44人が亡くなったとは、\n信じられないと述べている。"}, {"t": 152.85, "x": "ビルの大きさはどれくらいだったの？"}, {"t": 154.93333333333334, "x": "消防庁と国土交通省の資料では、\n建築面積が83平方メートルだ。"}, {"t": 159.93333333333334, "x": "建物が地面を占める広さがそれくらいになる。"}, {"t": 162.86666666666667, "x": "思っていたよりずっと小さいのね。"}, {"t": 164.95, "x": "延べ面積は516平方メートル。"}, {"t": 167.41666666666666, "x": "耐火建築物で、鉄骨と一部が\n鉄筋コンクリートのつくりだ。"}, {"t": 171.43333333333334, "x": "着工は昭和59年。1984年になる。"}, {"t": 175.0, "x": "そして、資料にはこう書き添えてある。"}, {"t": 177.26666666666668, "x": "階段は1つ。"}, {"t": 178.51666666666668, "x": "階段が1つしかなかったの？"}, {"t": 180.58333333333334, "x": "そうだ。長官も国会で、階段は\n1つしかなかったと報告した。"}, {"t": 184.85, "x": "この1つの階段が、あとでくり返し出てくる。"}, {"t": 188.4, "x": "中にはどんなお店が入っていたの？"}, {"t": 190.61666666666667, "x": "長官の報告では、3階が遊技場で、4階が飲食店だ。"}, {"t": 194.68333333333334, "x": "ほかに、カジノやクラブも入っていたと述べている。"}, {"t": 197.55, "x": "内閣府の第1報は、飲食店と\n風俗店が入っていたと書いた。"}, {"t": 201.81666666666666, "x": "夜中まで開いているお店ばかりね。"}, {"t": 204.08333333333334, "x": "警察庁の生活安全局長は、営業所の数も答えている。"}, {"t": 208.01666666666668, "x": "このビルで、風俗営業などの営業所が5件あった。"}, {"t": 211.2, "x": "そのうち1件は、許可の申請も\n届け出もしていなかった。"}, {"t": 214.73333333333332, "x": "残りの4件は許可があったという。"}, {"t": 216.9, "x": "届け出のないお店もあったのね。"}, {"t": 218.95, "x": "局長は、名義人や営業の中身を\n捜査していると答えた。"}, {"t": 222.65, "x": "店の名前は、この回では出さないでおく。"}, {"t": 225.76666666666668, "x": "歌舞伎町にはお店がどれくらいあったの？"}, {"t": 228.16666666666666, "x": "国会では、いくつかの数字が出ている。"}, {"t": 230.56666666666666, "x": "9月13日の委員会で、議員が挙げたのは\n新宿区役所の数字だ。"}, {"t": 234.85, "x": "区は9月の上旬に、\n歌舞伎町の飲食店などを緊急に調べた。"}, {"t": 238.91666666666666, "x": "その対象は4061件だったという。"}, {"t": 241.73333333333332, "x": "1つの町で4000件も？"}, {"t": 243.63333333333333, "x": "9月21日には、別の議員がもっと大きな数を挙げた。"}, {"t": 247.35, "x": "歌舞伎町だけで、風俗営業の店が\n5700以上あると聞いていると。"}, {"t": 251.73333333333332, "x": "3か月で経営者が代わる店もあると述べている。"}, {"t": 254.73333333333332, "x": "すぐに入れ替わってしまうのね。"}, {"t": 256.6, "x": "さらに、別の議員は町の店主の話を紹介した。"}, {"t": 259.9, "x": "火事のあと、細いビルに入るのをやめる客が出てきた。"}, {"t": 263.15, "x": "逃げ道はどこかと聞かれて、\n商売にならない店もあったという。"}, {"t": 266.8333333333333, "x": "不況も重なっていた。"}, {"t": 268.3, "x": "10店舗入るビルに、2つか\n3つしか入っていない所もあった。"}, {"t": 272.4166666666667, "x": "町の商売にまで火事の影が落ちていたのね。"}, {"t": 275.26666666666665, "x": "ある議員は、新聞の報道としてこうも述べた。"}, {"t": 278.0833333333333, "x": "多くの雑居ビルでは、客に\nエレベーターを使ってもらう。"}, {"t": 281.23333333333335, "x": "階段は物置の代わりになっていると。"}, {"t": 284.15, "x": "火が出たのは、正確には何時なの？"}, {"t": 286.6166666666667, "x": "資料によって2つの時刻がある。"}, {"t": 288.65, "x": "警察庁の刑事局長は、\n午前0時58分ごろの発生と答えた。"}, {"t": 293.1666666666667, "x": "消防が119番で知ったのは、午前1時1分だ。"}, {"t": 296.7, "x": "3分くらいの差があるのね。"}, {"t": 298.53333333333336, "x": "発生の時刻と通報を受けた時刻だからな。"}, {"t": 301.3, "x": "消防の記録では、この1時1分を覚知と呼ぶ。"}, {"t": 304.3666666666667, "x": "長官は、通報を受けてすぐ\n消防車を出したと報告した。"}, {"t": 307.95, "x": "逃げ遅れた人が多いと分かり、\n救助車と救急車も向かった。"}, {"t": 311.78333333333336, "x": "その時間なら、通りにもまだ人がいたでしょうね。"}, {"t": 314.8333333333333, "x": "そこは記録にない。"}, {"t": 316.05, "x": "書いてあるのは時刻と出動の順番だけだ。"}, {"t": 319.3666666666667, "x": "内閣府の第1報の題には、\n爆発火災という言葉が入っている。"}, {"t": 323.6166666666667, "x": "爆発？　ただの火事じゃなかったの？"}, {"t": 325.95, "x": "第1報はこう書いた。"}, {"t": 327.3333333333333, "x": "マージャンゲーム店の店員が、\n店のドアを開けたところ爆発した。"}, {"t": 331.1666666666667, "x": "そして火災が発生した、という書き方だ。"}, {"t": 334.03333333333336, "x": "ドアを開けたらいきなり燃えたってこと？"}, {"t": 336.25, "x": "当日の朝の時点で、そう伝わっていたということだ。"}, {"t": 339.51666666666665, "x": "のちの資料では、エレベーターホール付近から\n出火と書かれている。"}, {"t": 343.1666666666667, "x": "第1報の最後には、原因などは調査中とある。"}, {"t": 346.3333333333333, "x": "その日のうちには何も分からなかったのね。"}, {"t": 348.93333333333334, "x": "この調査中という言葉が、\nこのあとずっと続くことになる。"}, {"t": 353.1, "x": "火が消えるまでどれくらいかかったの？"}, {"t": 355.25, "x": "第1報には4つの時刻が並んでいる。"}, {"t": 357.6333333333333, "x": "通報を受けたのが、午前1時1分。"}, {"t": 360.0, "x": "火が広がるのを止めたのが午前2時14分。"}, {"t": 362.68333333333334, "x": "勢いを抑えた鎮圧が午前5時36分。"}, {"t": 365.45, "x": "完全に消えた鎮火が午前6時44分だ。"}, {"t": 368.56666666666666, "x": "5時間以上も燃えていたのね。"}, {"t": 370.46666666666664, "x": "ただ、焼けた広さは160平方メートルにとどまった。"}, {"t": 374.06666666666666, "x": "消防庁の資料では、3階が80で、4階も80だ。"}, {"t": 378.0833333333333, "x": "焼けたのは2つの階だけなのね。"}, {"t": 380.3, "x": "そうだ。燃えた広さに比べて、\n亡くなった人がとても多い。"}, {"t": 383.95, "x": "消防白書もこの食い違いに目を向けている。"}, {"t": 387.18333333333334, "x": "どれくらいの消防が駆けつけたの？"}, {"t": 389.35, "x": "第1報によると救急車が47隊。"}, {"t": 391.95, "x": "消防車両が98隊で、合わせて341名が出動した。"}, {"t": 396.4, "x": "助け出されたのは、合計で5名と書かれている。"}, {"t": 399.45, "x": "341人で助け出せたのが5人。"}, {"t": 402.28333333333336, "x": "地元の消防団員も21名が\n出動したと、長官が答えている。"}, {"t": 406.6166666666667, "x": "警察は、捜査第一課長たちが現場に向かった。"}, {"t": 409.8333333333333, "x": "新宿警察署には捜査本部が置かれた。"}, {"t": 412.55, "x": "火事なのに最初から捜査本部ができたのね。"}, {"t": 415.3666666666667, "x": "44人が亡くなったからな。"}, {"t": 417.1666666666667, "x": "名前の長い本部ができた。"}, {"t": 419.0, "x": "その名前はあとの章で読む。"}, {"t": 421.3, "x": "国の消防庁が動いた時刻も、国会で報告されている。"}, {"t": 424.95, "x": "宿直の職員が火事を知ったのが、午前1時40分。"}, {"t": 428.53333333333336, "x": "午前2時に第一次の応急体制を取った。"}, {"t": 431.26666666666665, "x": "夜中にだんだん人が集まってきたのね。"}, {"t": 433.85, "x": "被害が広がるのを受けて、\n4時30分に第二次の体制へ移った。"}, {"t": 437.98333333333335, "x": "ここで、消防庁次長を本部長とする\n災害対策本部ができた。"}, {"t": 442.05, "x": "5時30分には東京消防庁の本庁へ職員を出した。"}, {"t": 445.6666666666667, "x": "7時20分には現地にも職員を送った。"}, {"t": 448.4, "x": "長官自身が現場を確かめたのは、午前9時だ。"}, {"t": 451.65, "x": "朝になって長官も見に行ったのね。"}, {"t": 453.8833333333333, "x": "死者44人という数は、\n9時40分の時点で消防庁がまとめた。"}, {"t": 458.28333333333336, "x": "総理大臣からも、再発防止に全力で\n取り組むよう指示が出ていた。"}, {"t": 463.06666666666666, "x": "駆けつけた消防の人たちは大丈夫だったの？"}, {"t": 465.98333333333335, "x": "そのことも国会で取り上げられている。"}, {"t": 468.1666666666667, "x": "9月21日に、消防庁の審議官が答えた。"}, {"t": 471.53333333333336, "x": "現場に出た東京消防庁の職員は約340人。"}, {"t": 475.05, "x": "そのうち3分の1の120人が、\n話し合いの場に加わった。"}, {"t": 479.06666666666666, "x": "話し合いって何を話すの？"}, {"t": 480.96666666666664, "x": "専門家や同僚と、心の負担の具合を話す場だ。"}, {"t": 484.28333333333336, "x": "惨事ストレスへの手当ての初めの段階になる。"}, {"t": 487.0833333333333, "x": "審議官は、120人の全員が\n苦しんでいたのではないとも述べた。"}, {"t": 491.18333333333334, "x": "当時、本格的に取り組んでいたのは\n東京消防庁だけだった。"}, {"t": 495.21666666666664, "x": "ほかの消防には仕組みがなかったのね。"}, {"t": 497.6333333333333, "x": "4年後の2005年に、消防庁の次長が\nその後を答えている。"}, {"t": 501.3833333333333, "x": "歌舞伎町で多くの職員が惨事ストレスを負った。"}, {"t": 504.28333333333336, "x": "それを受けて、専門家を派遣する\nチームを国が作ったという。"}, {"t": 507.93333333333334, "x": "精神医学や心理学の専門家が、\n各地の消防本部へ出向く。"}, {"t": 511.9, "x": "答弁の時点で、6件の現場に専門家を送っていた。"}, {"t": 515.4666666666667, "x": "助ける人を助ける仕組みも、ここから生まれたのね。"}, {"t": 519.3333333333334, "x": "44人というのは、昔の火事と比べてどれくらいなの？"}, {"t": 523.0, "x": "長官は国会でこう並べている。"}, {"t": 525.0, "x": "雑居ビルの火災では、\n昭和47年の千日デパートビル火災に次ぐ。"}, {"t": 529.4666666666667, "x": "千日デパートでは、118人が亡くなっている。"}, {"t": 532.6333333333333, "x": "30人以上が亡くなった火災は、\n昭和57年以来だとも述べた。"}, {"t": 536.9333333333333, "x": "昭和57年の火災とはホテルニュージャパンの火災だ。"}, {"t": 540.2833333333333, "x": "どちらもこのチャンネルで取り上げた火事ね。"}, {"t": 542.7666666666667, "x": "翌年の消防白書は、もう一歩ふみこんで書いた。"}, {"t": 545.9333333333333, "x": "ホテルニュージャパン火災の死者33人を\n超える大惨事だと。"}, {"t": 549.6666666666666, "x": "ホテルよりずっと小さいビルなのに。"}, {"t": 551.7666666666667, "x": "白書は、その理由として防火管理を挙げている。"}, {"t": 554.6833333333333, "x": "違法で不適切な管理のせいで、\n有効な初期対応ができなかった。"}, {"t": 559.35, "x": "ここで冒頭で話した119番の話をしよう。"}, {"t": 562.4333333333333, "x": "10月30日の総務委員会で、ある議員が\n新聞の記事を引いた。"}, {"t": 566.5, "x": "10月27日の夕刊に、こう書かれていたという。"}, {"t": 569.7833333333333, "x": "あの夜ビルからの119番は10本あった。"}, {"t": 572.5166666666667, "x": "そのうち4本が4階からで、3階からは1本もなかった。"}, {"t": 576.3833333333333, "x": "火が出たのは3階なのに？"}, {"t": 578.1333333333333, "x": "議員は4階からの時刻も挙げている。"}, {"t": 580.4, "x": "1時1分、3分、5分、7分。"}, {"t": 582.9, "x": "6分のあいだ、4階から\n電話がかかり続けていたことになる。"}, {"t": 586.7666666666667, "x": "電話をかけられる時間はあったのね。"}, {"t": 588.9333333333333, "x": "議員は大学の教授の話も新聞から引いた。"}, {"t": 591.8666666666667, "x": "このくらいのビルなら、6分あれば\n十分に逃げられるという話だ。"}, {"t": 595.7333333333333, "x": "3階から電話がなかった理由は、\n国会では語られていない。"}, {"t": 599.9666666666667, "x": "逃げられなかったのはどうしてなの？"}, {"t": 602.0, "x": "長官は火事の12日後にこう報告している。"}, {"t": 604.8333333333334, "x": "火は1つしかない階段の3階付近で出た。"}, {"t": 607.65, "x": "そして、3階と4階の部屋の中へ\n燃え広がったと考えられる。"}, {"t": 611.6333333333333, "x": "階段は狭いうえに、ロッカーなどの物が置かれていた。"}, {"t": 614.9166666666666, "x": "逃げ道に物が置いてあったのね。"}, {"t": 616.9833333333333, "x": "翌年の春、総務副大臣は\nビールケースという言葉も使った。"}, {"t": 620.9666666666667, "x": "階段と防火戸のまわりに、\nビールケースなどが置かれていた。"}, {"t": 624.35, "x": "それが逃げ遅れの原因になったと答えている。"}, {"t": 627.0166666666667, "x": "東京消防庁は、屋内の階段に\n大量の物が放置されていたと書いた。"}, {"t": 631.5166666666667, "x": "物が逃げる邪魔になり、燃えて煙をたくさん出した。"}, {"t": 634.65, "x": "上の階へ火が広がる道にもなったと説明している。"}, {"t": 638.4, "x": "防火戸って火を止める扉のことよね？"}, {"t": 640.8333333333334, "x": "そうだ。階段と部屋の間を仕切る扉になる。"}, {"t": 643.75, "x": "長官の報告ではこの防火戸が開いていた。"}, {"t": 646.45, "x": "そのため、火が部屋の中へ\n入りやすかったと述べている。"}, {"t": 649.7666666666667, "x": "のちの消防庁の資料は、言い方を少し変えている。"}, {"t": 652.8666666666667, "x": "防火戸が有効に閉まらなかった、という書き方だ。"}, {"t": 656.1, "x": "開けてあったのか、閉まらなかったのか。"}, {"t": 658.5833333333334, "x": "資料で言い方がそろっていないところだ。"}, {"t": 660.85, "x": "国土交通省の資料にはもう1つ書いてある。"}, {"t": 663.5833333333334, "x": "防火戸を動かす煙の感知器の位置が悪かった。"}, {"t": 666.5666666666667, "x": "火と煙は、3階と4階の店の中へ一気に流れこんだ。"}, {"t": 671.0333333333333, "x": "外から助けに入ることはできなかったの？"}, {"t": 673.7666666666667, "x": "消防庁の資料には外側の問題も書かれている。"}, {"t": 676.8166666666667, "x": "3階と4階には、消防隊が\n外から入るための口があった。"}, {"t": 680.7666666666667, "x": "その口が外から広告板で覆われていた。"}, {"t": 683.5166666666667, "x": "看板でふさがれていたの？"}, {"t": 685.25, "x": "資料には救助の活動に支障が出たとある。"}, {"t": 687.8333333333334, "x": "国土交通省の資料では、\n非常用進入口の閉鎖と書かれた。"}, {"t": 691.8166666666667, "x": "中からは階段、外からは進入口。"}, {"t": 694.2833333333333, "x": "どちらの道も使いにくくなっていたことになる。"}, {"t": 697.1666666666666, "x": "中にいた人には、逃げる道がほとんどなかったのね。"}, {"t": 700.5, "x": "資料に書かれた事実をつなぐとそうなる。"}, {"t": 703.5333333333333, "x": "東京消防庁の研究所の報告には、もう1つの点がある。"}, {"t": 707.3666666666667, "x": "自動火災報知設備が機能しなかった。"}, {"t": 709.9666666666667, "x": "火事を知らせるベルのこと？"}, {"t": 711.6666666666666, "x": "そうだ。報告は、それを\n維持管理の問題として挙げている。"}, {"t": 715.2666666666667, "x": "のちの法令の改正にもこれはつながった。"}, {"t": 717.7666666666667, "x": "地上への階段が1つしかない\n雑居ビルには、設置を義務にした。"}, {"t": 721.85, "x": "階段が1つなら、早く知らせないといけないものね。"}, {"t": 725.25, "x": "国土交通省の資料には、\n建物の不備がほかにも並んでいる。"}, {"t": 729.0666666666667, "x": "窓のない部屋の煙を出す設備に不備があった。"}, {"t": 731.8833333333333, "x": "消防法の面では避難器具がなかった。"}, {"t": 734.3, "x": "避難の訓練も行われていなかったと書かれている。"}, {"t": 737.9, "x": "こんなに問題があって誰も気づかなかったの？"}, {"t": 740.65, "x": "気づいてはいた。"}, {"t": 741.65, "x": "火事の2年前に東京消防庁が中を調べている。"}, {"t": 744.7666666666667, "x": "平成11年、1999年の10月の立入検査だ。"}, {"t": 748.9833333333333, "x": "長官によると、その時点の様子はこうだった。"}, {"t": 751.85, "x": "店ごとに置くはずの防火管理者が、\nまったく選ばれていなかった。"}, {"t": 755.8, "x": "まったく？"}, {"t": 756.9333333333333, "x": "そう答えている。だから、まず\n選ぶように指導したという。"}, {"t": 760.2666666666667, "x": "のちに議員は、このときの指摘は\n8項目だったと述べた。"}, {"t": 763.85, "x": "長官は、完成のときの検査や\nその後の検査もしていたと答えた。"}, {"t": 768.0666666666667, "x": "それでも直らなかったのね。"}, {"t": 769.85, "x": "長官はその理由に、店の権利関係が\n複雑だったことを挙げた。"}, {"t": 773.9166666666666, "x": "経営する人の入れ替わりも、とても激しかったという。"}, {"t": 777.7333333333333, "x": "このビルだけが特別に悪かったの？"}, {"t": 780.0666666666667, "x": "長官は9月13日に全国の数字も出している。"}, {"t": 783.3333333333334, "x": "いろいろな用途が入った建物全体の数字だ。"}, {"t": 786.2, "x": "平成12年3月末の時点でこうなっていた。"}, {"t": 789.2, "x": "防火管理者を選んだ届けの違反が35.6％。"}, {"t": 792.9166666666666, "x": "消防計画を作った届けの違反が47.6％。"}, {"t": 796.7666666666667, "x": "共同防火管理の届けの違反が39.7％。"}, {"t": 800.5166666666667, "x": "半分近くが、計画の届けを出していなかったのね。"}, {"t": 804.0166666666667, "x": "自動火災報知設備の違反は5.9％だった。"}, {"t": 807.4, "x": "避難器具の違反は5.8％だ。"}, {"t": 809.9166666666666, "x": "長官は、小さい雑居ビルの数字は\n手元に無いと断った。"}, {"t": 813.5666666666667, "x": "ただ持ち主や店の入れ替わりが激しい。"}, {"t": 815.9, "x": "だからこれより高いだろうと述べた。"}, {"t": 818.05, "x": "火事の前から数字には出ていたのね。"}, {"t": 820.35, "x": "その見立てが当たっていたことは、\nのちの一斉検査で分かる。"}, {"t": 824.4333333333333, "x": "10月の委員会で、議員は\nこの8項目をさらに問題にした。"}, {"t": 828.3, "x": "雑居ビルには、ビル全体で\n防火を受け持つ仕組みがある。"}, {"t": 831.55, "x": "共同防火管理と呼ばれるものだ。"}, {"t": 833.7, "x": "お店ごとじゃなくてビルまとめての管理ね。"}, {"t": 836.2333333333333, "x": "議員によると、8項目には\nこの共同防火の話が入っていなかった。"}, {"t": 840.5833333333334, "x": "ビル全体の防火の計画もなかったと述べている。"}, {"t": 843.4833333333333, "x": "長官は前の委員会でこう説明していた。"}, {"t": 846.0833333333334, "x": "まず店ごとの管理ができてこそ、共同の管理が生きる。"}, {"t": 849.4333333333333, "x": "だから、店ごとの選任を先に\n指導したのではないかと。"}, {"t": 853.0166666666667, "x": "順番を決めて指導していたのね。"}, {"t": 855.1666666666666, "x": "議員は、千日デパート火災のあとと\n同じことがくり返されたと言った。"}, {"t": 859.3333333333334, "x": "この仕組みはのちの法改正で見直されていく。"}, {"t": 862.6666666666666, "x": "ビルの持ち主は誰だったの？"}, {"t": 864.5666666666667, "x": "名前は言わない。"}, {"t": 865.55, "x": "ただ、国会では持ち主の変わり方が問題になった。"}, {"t": 868.9, "x": "翌年6月に国土交通大臣はこう答えている。"}, {"t": 872.1, "x": "持ち主が転々としていて、持ち主自身も把握できない。"}, {"t": 875.6833333333333, "x": "そういう報告が東京都から来ていると。"}, {"t": 878.1833333333333, "x": "持ち主にも分からないなんてあるの？"}, {"t": 880.35, "x": "大臣は、所有者が3人も4人も変わったとも述べた。"}, {"t": 883.8, "x": "今の所有者も責任者も分からないのは、\nおかしいと言っている。"}, {"t": 887.4, "x": "長官も、所有者や店の入れ替わりが\n極めて激しいと答えた。"}, {"t": 891.2333333333333, "x": "だから、ほかのビルより指導が届きにくいと説明した。"}, {"t": 894.7166666666667, "x": "誰に言えば直るのか分からなかったのね。"}, {"t": 897.15, "x": "誰が責任を持つのかという問題は、\n裁判でも問われることになる。"}, {"t": 901.8, "x": "建物の法律の面からも、国会で問題が挙げられた。"}, {"t": 905.3333333333334, "x": "翌年6月の国土交通委員会で、\n議員が資料を配っている。"}, {"t": 909.2666666666667, "x": "このビルは、建築基準法の違反が5つあったという。"}, {"t": 912.65, "x": "5つも？"}, {"t": 913.7833333333333, "x": "議員がいちばん上に挙げたのは完了検査だ。"}, {"t": 916.3666666666667, "x": "工事が終わったあとの検査を受けていなかった。"}, {"t": 918.9166666666666, "x": "建てたあとの定期報告も、していなかったと述べた。"}, {"t": 922.2166666666667, "x": "最初から最後まで、確かめられていなかったのね。"}, {"t": 925.35, "x": "議員は、一般の店舗として\n建築の確認を取ったとも言っている。"}, {"t": 929.35, "x": "国土交通省の住宅局長は、9月の委員会でこう答えた。"}, {"t": 933.2833333333333, "x": "キャバレーなどの用途なら、\n逃げ道を2つ持つ決まりがある。"}, {"t": 936.6333333333333, "x": "決まりが足りなかったのか、守られなかったのか。"}, {"t": 939.55, "x": "それが1つの点だと述べた。"}, {"t": 942.0333333333333, "x": "冒頭で、階の数がそろわないって言っていたわよね？"}, {"t": 945.2, "x": "そうだ。ここで並べておく。"}, {"t": 946.95, "x": "当日の内閣府の第1報は、\n地上4階、地下2階と書いた。"}, {"t": 950.9833333333333, "x": "長官の国会での報告も、地上4階、地下2階だ。"}, {"t": 954.5666666666667, "x": "ところが、東京消防庁の研究所の報告は\n地上5階と書いている。"}, {"t": 958.7666666666667, "x": "2022年の消防庁と国土交通省の資料も、地上5階だ。"}, {"t": 963.1166666666667, "x": "1階分、数え方が分かれているのね。"}, {"t": 965.6833333333333, "x": "広さも同じだ。白書は500平方メートル程度と書いた。"}, {"t": 969.3, "x": "消防庁の資料は516平方メートル。"}, {"t": 972.0333333333333, "x": "2004年に国会で議員が述べた\n数字は、400平米だった。"}, {"t": 976.0666666666667, "x": "どうして分かれたのかは書いてあるの？"}, {"t": 978.2, "x": "どの資料にも数え方の説明は見当たらない。"}, {"t": 980.9166666666666, "x": "44人の火事の記録でさえ、\n建物の数字がそろっていない。"}, {"t": 985.3833333333333, "x": "警察の捜査はどうなっていたの？"}, {"t": 987.4833333333333, "x": "警察庁の刑事局長が、\n9月13日の委員会で答えている。"}, {"t": 991.65, "x": "警視庁は火事の当日に特別捜査本部を置いた。"}, {"t": 994.7833333333333, "x": "本部の長は警視庁の刑事部長だ。"}, {"t": 997.1833333333333, "x": "さっき言っていた名前の長い本部ね。"}, {"t": 999.5166666666667, "x": "正式な名前はこうだ。"}, {"t": 1001.0, "x": "歌舞伎町一丁目雑居ビル火災に\n伴う多数焼死事件特別捜査本部。"}, {"t": 1005.7333333333333, "x": "本当に長いのね。"}, {"t": 1007.1666666666666, "x": "本部は現場の検証と、\n関係者からの話の聞き取りを進めた。"}, {"t": 1011.2666666666667, "x": "現場に残った物の鑑定もしていた。"}, {"t": 1013.65, "x": "局長は、出火の場所は3階付近とみられると答えた。"}, {"t": 1017.2166666666667, "x": "そして、失火と放火の両面で捜査していると述べた。"}, {"t": 1021.2, "x": "同じ9月13日の委員会では、ある議員が\n先にこう尋ねている。"}, {"t": 1025.3166666666666, "x": "出火の原因は端的に言って放火か失火か。"}, {"t": 1028.1833333333334, "x": "それを決めて発表するまでに、\nふつう何日くらいかかるのか。"}, {"t": 1031.9833333333333, "x": "みんなそれがいちばん知りたかったのね。"}, {"t": 1034.25, "x": "議員は、徹底的に調べて原因を\n明らかにしてほしいと述べた。"}, {"t": 1038.1333333333334, "x": "原因が分かれば、責任もはっきりするという考えだ。"}, {"t": 1041.45, "x": "9月21日の委員会でも、\n刑事局長は同じように答えた。"}, {"t": 1045.5333333333333, "x": "9月2日から、今もなお現場で検証を続けている。"}, {"t": 1049.0, "x": "火事から3週間たっても、まだ現場を調べていたのね。"}, {"t": 1052.5333333333333, "x": "別の議員は、まだ原因も何も分かっていないと述べた。"}, {"t": 1055.8666666666666, "x": "現場には机が置かれ、お供え物が\n絶えないとも話している。"}, {"t": 1060.1333333333334, "x": "通りのカメラに何か映っていなかったの？"}, {"t": 1062.7166666666667, "x": "同じ9月21日に、議員がまさにそれを尋ねている。"}, {"t": 1066.2666666666667, "x": "不審な人がいたと思わせる\n情報があると、議員は述べた。"}, {"t": 1069.7333333333333, "x": "歌舞伎町には、\n防犯用のカメラがあるのではないかと。"}, {"t": 1072.9, "x": "警察庁の生活安全局長の答えはこうだった。"}, {"t": 1076.0833333333333, "x": "現場の近くの街頭には、\n防犯カメラは置かれていない。"}, {"t": 1079.5666666666666, "x": "1台も無かったのね。"}, {"t": 1081.1333333333334, "x": "局長は続けて、今年度に50台を置く予定だと答えた。"}, {"t": 1084.8333333333333, "x": "火事のあった歌舞伎町一番街にも、置く予定だという。"}, {"t": 1088.1833333333334, "x": "火事のあとで、カメラが置かれることになったのね。"}, {"t": 1091.1333333333334, "x": "不審な人の情報の中身は、国会では語られていない。"}, {"t": 1094.6166666666666, "x": "この回でもそれ以上は追わないでおく。"}, {"t": 1097.35, "x": "2001年の9月って、ほかにも\n大きな出来事があったわよね？"}, {"t": 1101.2833333333333, "x": "火事の10日後に、アメリカで同時多発テロが起きた。"}, {"t": 1104.3833333333334, "x": "9月13日の委員会でも、議員は\nまずテロの話から入っている。"}, {"t": 1108.5333333333333, "x": "そのあとで歌舞伎町の火事の質問に移った。"}, {"t": 1111.4333333333334, "x": "同じ委員会で両方を話していたのね。"}, {"t": 1113.8833333333334, "x": "9月21日には別の議員がこう述べた。"}, {"t": 1116.6333333333334, "x": "テロに隠れて、歌舞伎町の火事が\n記憶に遠くなっている。"}, {"t": 1120.0333333333333, "x": "まだ20日しかたっていないのに、という言い方だ。"}, {"t": 1122.9833333333333, "x": "大きなニュースが、上から重なってしまったのね。"}, {"t": 1125.9833333333333, "x": "それでも国会は、このあと\n何度も火事を取り上げ続けた。"}, {"t": 1129.3833333333334, "x": "原因が分からないまま、議論は\n防ぎ方のほうへ進んでいく。"}, {"t": 1133.65, "x": "防ぎ方は誰が考えていたの？"}, {"t": 1135.8333333333333, "x": "消防庁は火事の5日後に検討委員会を開いた。"}, {"t": 1138.9166666666667, "x": "名前は小規模雑居ビル火災緊急対策検討委員会だ。"}, {"t": 1142.55, "x": "委員長は消防庁の次長が務めた。"}, {"t": 1144.85, "x": "大学の教授や研究機関の研究員が加わった。"}, {"t": 1148.0833333333333, "x": "現場を預かる消防局の部長たちも入っている。"}, {"t": 1151.1, "x": "現場の人の声も聞くのね。"}, {"t": 1153.0666666666666, "x": "長官によると第1回ではこんな意見が出た。"}, {"t": 1155.75, "x": "立入検査を増やすのには限界がある。"}, {"t": 1158.1166666666666, "x": "民間の力も借りられないか。"}, {"t": 1160.0666666666666, "x": "ほかの役所ともつながった対策が要る。"}, {"t": 1162.4666666666667, "x": "国土交通省も別に委員会を\n作り、9月12日に初めて開いた。"}, {"t": 1167.0333333333333, "x": "2つの役所が別々に話し合っていたのね。"}, {"t": 1169.9833333333333, "x": "委員が重なっていると議員から指摘も出た。"}, {"t": 1172.5833333333333, "x": "消防庁の審議官は、法律の受け持ちが\n分かれているからだと答えた。"}, {"t": 1176.8166666666666, "x": "10月の委員会では、別の議員がこう言っている。"}, {"t": 1179.7333333333333, "x": "委員会はこれまで2回しか開かれていないと。"}, {"t": 1182.3833333333334, "x": "結論は、年内をめどにまとめる予定とされていた。"}, {"t": 1186.1333333333334, "x": "火事の2日後に消防庁は全国に通達を出した。"}, {"t": 1189.3333333333333, "x": "同じような小さい雑居ビルを、\n一斉に立ち入りで調べること。"}, {"t": 1192.9, "x": "対象は、3階より上を遊びや飲食に使っているビルだ。"}, {"t": 1196.6166666666666, "x": "ほかのビルも同じだったのかしら？"}, {"t": 1198.7333333333333, "x": "10月の委員会で、議員が\n東京消防庁の結果を読み上げた。"}, {"t": 1202.5166666666667, "x": "9月21日までに調べたのが2469棟。"}, {"t": 1206.35, "x": "そのうち2160棟に違反があった。"}, {"t": 1209.0333333333333, "x": "違反率は87.5％だ。"}, {"t": 1211.5833333333333, "x": "ほとんど全部じゃない。"}, {"t": 1212.9666666666667, "x": "違反の数は全部で2万5010件あった。"}, {"t": 1215.6333333333334, "x": "実際に直したのは1648件だったという。"}, {"t": 1218.9666666666667, "x": "警告は39件で、命令までいったのは\n2件だと議員は述べた。"}, {"t": 1223.0666666666666, "x": "翌年4月には全国の数字も出た。"}, {"t": 1225.55, "x": "8407件のうち、91.9％に\n違反があったと議員が述べている。"}, {"t": 1231.2833333333333, "x": "調べている間にまた何か起きたの？"}, {"t": 1233.65, "x": "起きた。10月29日に、\n歌舞伎町の別の雑居ビルで火事が出た。"}, {"t": 1237.9833333333333, "x": "議員によると、2人が亡くなり5人がけがをした。"}, {"t": 1241.1333333333334, "x": "同じ歌舞伎町で2か月もたたないうちに？"}, {"t": 1243.7666666666667, "x": "そうだ。翌日の委員会で、議員がすぐ取り上げた。"}, {"t": 1247.0, "x": "このビルは、9月の一斉の査察から外れていたという。"}, {"t": 1250.3166666666666, "x": "一斉の査察は、1000平方メートル以下が対象だった。"}, {"t": 1253.65, "x": "議員はそうした事情が重なったと述べている。"}, {"t": 1256.25, "x": "総務大臣は、小さい雑居ビルの火事が\n2件も続いたと答えた。"}, {"t": 1260.2666666666667, "x": "法律をどう変えるか、急いで検討させると述べた。"}, {"t": 1263.4833333333333, "x": "最初の火事の原因はそのころ分かっていたの？"}, {"t": 1266.2666666666667, "x": "同じ日の別の議員は、原因も\nまだ特定されていないと述べた。"}, {"t": 1270.0666666666666, "x": "現地には、青いテントや花束が\nそのまま残っていたという。"}, {"t": 1274.2333333333333, "x": "原因を調べる側にも、別の壁があったと語られている。"}, {"t": 1277.7333333333333, "x": "翌年4月、議員は新宿区役所から聞いた話を紹介した。"}, {"t": 1281.8166666666666, "x": "区役所の建築課の人が現場に\n入れたのは、12月だった。"}, {"t": 1285.8833333333334, "x": "火事は9月よね？"}, {"t": 1287.2, "x": "9月、10月、11月、12月。"}, {"t": 1289.9666666666667, "x": "4か月目にやっと入れたという。"}, {"t": 1292.0333333333333, "x": "警察の捜査との兼ね合いで、\n研究者も入りにくいと議員は述べた。"}, {"t": 1296.1, "x": "前の年の10月にも、議員はこの問題を挙げている。"}, {"t": 1299.3166666666666, "x": "過去の火災でも、調査団が中に\n入れなかった例があるという。"}, {"t": 1303.1, "x": "捜査と防ぐための調査がぶつかってしまうのね。"}, {"t": 1306.1, "x": "議員は、航空機の事故のような\n第三者の調査機関を求めた。"}, {"t": 1309.9333333333334, "x": "消防庁が自分で調べられる仕組みも提案している。"}, {"t": 1313.6, "x": "警察はそのあと何をしていたの？"}, {"t": 1315.7833333333333, "x": "翌年3月の国会で、2人が同じことを答えている。"}, {"t": 1319.3666666666666, "x": "警察庁の刑事局長と国家公安委員長だ。"}, {"t": 1322.3666666666666, "x": "3月17日に、このビルと同じ中のつくりを再現した。"}, {"t": 1326.2333333333333, "x": "その建物を使って燃え方を確かめる実験をした。"}, {"t": 1329.6166666666666, "x": "同じ形の建物を作って燃やしたのね。"}, {"t": 1332.4, "x": "国家公安委員長は、別の委員会でこうも話している。"}, {"t": 1335.7666666666667, "x": "ああいう火事でどこまで温度が\n上がるか、実験して初めて分かった。"}, {"t": 1339.6166666666666, "x": "そう聞いているという言い方だ。"}, {"t": 1341.4333333333334, "x": "実験で原因は分かったの？"}, {"t": 1343.3, "x": "次の章の答弁がその答えになる。"}, {"t": 1346.1666666666667, "x": "2002年3月19日、参議院の法務委員会だ。"}, {"t": 1349.6, "x": "議員が尋ねた。事故なのか、\n放火なのか、失火なのか。"}, {"t": 1353.3166666666666, "x": "どうやら分からないようだが、\nその後どうなっているのかと。"}, {"t": 1356.55, "x": "半年たってもまだ聞かれていたのね。"}, {"t": 1358.8833333333334, "x": "刑事局長は、実験のことを説明したうえでこう答えた。"}, {"t": 1362.5166666666667, "x": "現在までのところ、まだ\n出火原因の特定には至っていない。"}, {"t": 1366.2833333333333, "x": "翌日の内閣委員会で、\n国家公安委員長も同じように答えた。"}, {"t": 1370.4166666666667, "x": "あらゆる可能性を念頭に、\n失火と放火の両面で捜査する。"}, {"t": 1374.2333333333333, "x": "2つのどちらなのかも決まっていないのね。"}, {"t": 1376.8, "x": "局長はもう1つ捜査の柱を挙げている。"}, {"t": 1379.4, "x": "ビルの管理者などに刑事責任があるかどうかだ。"}, {"t": 1382.2666666666667, "x": "火の原因と管理の責任。"}, {"t": 1384.0333333333333, "x": "捜査は2つの道に分かれていった。"}, {"t": 1386.85, "x": "ビルそのものはどうなったの？"}, {"t": 1388.6, "x": "議員が、新宿区役所から聞いた\n話を国会で紹介している。"}, {"t": 1392.55, "x": "12月に、警察がビルの1階の鍵を所有者に返した。"}, {"t": 1396.2333333333333, "x": "区役所は急いで改善の命令を出したという。"}, {"t": 1398.9, "x": "所有者に5回か6回来てもらって、話し合いを重ねた。"}, {"t": 1402.5666666666666, "x": "鍵が戻るまで区も手を出せなかったのね。"}, {"t": 1405.1166666666666, "x": "2月4日に改善について納得してもらえた。"}, {"t": 1408.05, "x": "そして3月22日に、\n使用禁止の命令を出すことができた。"}, {"t": 1412.1, "x": "議員は、ホテルニュージャパン以来、\n20年ぶりだと述べた。"}, {"t": 1415.5833333333333, "x": "またホテルニュージャパンの名前が出てきたわね。"}, {"t": 1418.1833333333334, "x": "議員が現場で見た禁止命令の紙は、\nこのときのものだ。"}, {"t": 1422.2666666666667, "x": "2002年4月4日、衆議院の総務委員会。"}, {"t": 1425.3166666666666, "x": "消防法を改める法案が話し合われていた。"}, {"t": 1428.0, "x": "議員が、火事の原因がまだ\n特定されていないと指摘した。"}, {"t": 1431.5833333333333, "x": "総務大臣はこう答えている。"}, {"t": 1433.4, "x": "新宿の9月の雑居ビルの火災については、\n放火説もありますね。"}, {"t": 1437.65, "x": "大臣が国会で放火という言葉を出したのね。"}, {"t": 1440.5833333333333, "x": "ただ大臣はすぐにこう続けた。"}, {"t": 1442.55, "x": "東京消防庁などが調査中で、\n原因がはっきりしていない。"}, {"t": 1446.1833333333334, "x": "だから、とりあえず審議会の答申を\n入れて法律を改める。"}, {"t": 1449.7333333333333, "x": "新しい事実が分かれば、\nまた対応するという答えだった。"}, {"t": 1453.35, "x": "原因が分かる前に、法律のほうが先に動いたのね。"}, {"t": 1456.7666666666667, "x": "そうだ。原因を待たずに、国は防ぐ側の手を打った。"}, {"t": 1460.7166666666667, "x": "法律はどう変わったの？"}, {"t": 1462.3166666666666, "x": "消防庁がまとめた法案の柱は、大きく分けて4つある。"}, {"t": 1465.9333333333334, "x": "1つ目は違反を直させる力を強くすることだ。"}, {"t": 1468.9666666666667, "x": "立ち入りの検査は、それまで\n営業時間か昼間に限られていた。"}, {"t": 1472.7, "x": "それをどの時間でも入れるように変えた。"}, {"t": 1475.1, "x": "夜中に開くお店も夜に調べられるのね。"}, {"t": 1477.8666666666666, "x": "2つ目は、ビルの防火管理を\n専門の人が定期的に点検する制度だ。"}, {"t": 1482.3666666666666, "x": "点検の結果を消防に報告させる。"}, {"t": 1484.7333333333333, "x": "3つ目は、階段や廊下に\n物を置かないよう管理させる義務だ。"}, {"t": 1488.3666666666666, "x": "4つ目が、命令に従わないときの罰を\n重くすることだった。"}, {"t": 1492.2833333333333, "x": "階段の物の話がちゃんと法律になったのね。"}, {"t": 1495.8833333333334, "x": "消防白書はもう1つの変化を大きく取り上げた。"}, {"t": 1498.8833333333334, "x": "現場の消防吏員が、その場で\n命令を出せるようにしたことだ。"}, {"t": 1502.6333333333334, "x": "それまでは出せなかったの？"}, {"t": 1504.3333333333333, "x": "出せなかった。"}, {"t": 1505.45, "x": "命令は消防長か消防署長しか出せなかった。"}, {"t": 1508.35, "x": "検査で危ない物を見つけても、\nその場では命令できない。"}, {"t": 1511.7, "x": "改正のあとは、階段や廊下の物を\nどけろと現場で命じられる。"}, {"t": 1515.5833333333333, "x": "見つけたその場で片づけさせられるのね。"}, {"t": 1518.1166666666666, "x": "2012年の国会で消防庁の次長がまとめている。"}, {"t": 1521.45, "x": "昼間に限られた検査の時間をなくしたこと。"}, {"t": 1524.2333333333333, "x": "使用禁止命令を出す条件をはっきりさせたこと。"}, {"t": 1527.2166666666667, "x": "そして現場の吏員でも命令できるようにしたことだ。"}, {"t": 1530.8166666666666, "x": "その法律はいつ決まったの？"}, {"t": 1532.7, "x": "衆議院の記録では、2002年4月26日に公布された。"}, {"t": 1536.7166666666667, "x": "法律第30号だ。"}, {"t": 1538.2166666666667, "x": "火事から7か月と少したっていた。"}, {"t": 1540.5333333333333, "x": "施行はその年の10月25日だ。"}, {"t": 1543.05, "x": "火事のちょうど1年あとくらいね。"}, {"t": 1545.1, "x": "法案を出すとき、総務大臣は理由をこう述べている。"}, {"t": 1548.2166666666667, "x": "新宿区歌舞伎町ビル火災などを\n踏まえて改正するのだと。"}, {"t": 1551.6666666666667, "x": "国はお金と人も用意した。"}, {"t": 1553.55, "x": "2002年度に、検査を受け持つ\n予防の要員を1077人増やす措置をとった。"}, {"t": 1558.4666666666667, "x": "消防庁の次長は、\nおよそ48億円の財政措置だと答えている。"}, {"t": 1562.9, "x": "1つの火事が全国の消防の人数まで変えたのね。"}, {"t": 1566.7166666666667, "x": "建物の法律を受け持つ国土交通省も動いた。"}, {"t": 1569.8, "x": "火事の2日後に各都道府県の知事へ通知を出した。"}, {"t": 1572.9833333333333, "x": "3階より上を風俗営業などに使う\n小さいビルを、重点的に調べる。"}, {"t": 1577.4833333333333, "x": "消防と同じ日に別の役所も動いていたのね。"}, {"t": 1580.4333333333334, "x": "議員によると対象は1万1千あまりのビルだった。"}, {"t": 1583.5, "x": "そのうち38.4％に、防火や\n避難の部分の違反があった。"}, {"t": 1587.8166666666666, "x": "国土交通省は決まりそのものも変えている。"}, {"t": 1590.4333333333334, "x": "逃げ道となる階段を2つ以上求める\n用途を、広げたのだ。"}, {"t": 1594.2666666666667, "x": "階段が1つのビルは、もう許されなくなったの？"}, {"t": 1597.3833333333334, "x": "資料に書かれているのは、新しい\n形の風俗の用途に広げたことだ。"}, {"t": 1601.7166666666667, "x": "すべてのビルにではない。そこは正確に言っておく。"}, {"t": 1605.25, "x": "東京消防庁の研究所も独自に実験を重ねていた。"}, {"t": 1608.75, "x": "火事の2か月後には、\n小さな実験用の建物で燃やしてみた。"}, {"t": 1612.65, "x": "独立行政法人の消防研究所の協力を受けての実験だ。"}, {"t": 1616.7, "x": "警察の実験とは別なのね。"}, {"t": 1618.85, "x": "そのあと取り壊す予定の都営住宅を作り替えた。"}, {"t": 1621.8666666666666, "x": "そこで本物の大きさの火災実験を行った。"}, {"t": 1624.8166666666666, "x": "報告書はこんな疑問を挙げている。"}, {"t": 1626.8333333333333, "x": "ビールケースや燃えないごみが\n1つなら、踊り場に置いてもよいのか。"}, {"t": 1630.6666666666667, "x": "1つくらいなら大丈夫と思う人もいそうね。"}, {"t": 1633.5166666666667, "x": "本来燃えないはずの場所で\n火が出たら、何が起きるのか。"}, {"t": 1636.8166666666666, "x": "煙はどれくらいの速さで広がるのか。"}, {"t": 1639.1833333333334, "x": "小さな雑居ビルに潜む危なさを、\n確かめるための実験だった。"}, {"t": 1643.8, "x": "裁判は開かれたの？"}, {"t": 1645.35, "x": "開かれた。国土交通省の資料に結果が載っている。"}, {"t": 1648.6833333333334, "x": "裁かれたのは火をつけた人ではない。"}, {"t": 1650.8666666666666, "x": "ビルの防火を管理する責任を負った人たちだ。"}, {"t": 1653.8, "x": "管理の責任のほうなのね。"}, {"t": 1655.6833333333334, "x": "建物所有会社の経営者は、\n業務上過失致死傷罪で禁固3年。"}, {"t": 1660.05, "x": "執行猶予は5年だ。"}, {"t": 1661.4833333333333, "x": "店舗の経営者などは禁固2年から3年。"}, {"t": 1664.1, "x": "執行猶予は4年から5年になった。"}, {"t": 1666.5166666666667, "x": "全員に執行猶予がついたのね。"}, {"t": 1668.7, "x": "資料は防火管理の責任を\n認めた判決だとまとめている。"}, {"t": 1672.2666666666667, "x": "事件の番号は、東京地方裁判所の平成15年、\n刑わ第794号だ。"}, {"t": 1677.65, "x": "名前はこの回では言わないでおく。"}, {"t": 1680.1833333333334, "x": "同じ資料には民事のほうの結果も書いてある。"}, {"t": 1682.8333333333333, "x": "建物所有会社やその実質的な経営者たち。"}, {"t": 1685.9333333333334, "x": "亡くなった44人の遺族と、けがをした3人と和解した。"}, {"t": 1689.8333333333333, "x": "いくらだったの？"}, {"t": 1690.9666666666667, "x": "和解金やお見舞いのお金などとして、10億1050万円。"}, {"t": 1694.7, "x": "資料は続けてこう呼びかけている。"}, {"t": 1696.6833333333334, "x": "火事で多くの人が死傷すれば、\n所有者や経営者の責任は重い。"}, {"t": 1700.6666666666667, "x": "だから建築基準法と消防法を守ってほしいと。"}, {"t": 1703.8666666666666, "x": "お金で終わる話じゃないけれど。"}, {"t": 1705.8833333333334, "x": "そうだ。そして刑事でも民事でも、\n問われたのは管理だった。"}, {"t": 1709.55, "x": "あの夜3階で火を出したのが何だったのか。"}, {"t": 1712.2, "x": "それはどちらの裁判の結果にも書かれていない。"}, {"t": 1715.55, "x": "結局、原因について国の資料は何と書いているの？"}, {"t": 1719.0, "x": "資料ごとに書き方が少しずつ動いている。"}, {"t": 1721.5666666666666, "x": "当日の内閣府は原因などは調査中。"}, {"t": 1724.1333333333334, "x": "翌年の国会で警察庁は特定には至っていない。"}, {"t": 1727.4, "x": "国土交通省の資料は、放火である\n可能性が高いと書いた。"}, {"t": 1731.1333333333334, "x": "2022年の消防庁の資料は、\n括弧の中に放火の疑いとだけある。"}, {"t": 1735.7833333333333, "x": "だんだん放火の方へ寄っているのね。"}, {"t": 1737.95, "x": "2026年9月に、福岡市消防局の資料はこう書いた。"}, {"t": 1742.0166666666667, "x": "出火の原因は放火と推定されるが、未解明である。"}, {"t": 1745.3333333333333, "x": "そして現在も未解決事件である、と。"}, {"t": 1748.0, "x": "可能性と推定までで決まってはいないのね。"}, {"t": 1750.65, "x": "誰かがつけた火なら、その誰かはまだ分かっていない。"}, {"t": 1754.45, "x": "警察はそのあと何か変えたの？"}, {"t": 1756.5666666666666, "x": "2008年12月に国家公安委員長が答えている。"}, {"t": 1759.95, "x": "歌舞伎町の火災を受けて、警察庁は\n都道府県の警察に指導した。"}, {"t": 1764.25, "x": "風俗営業の店などについて消防と連携するようにと。"}, {"t": 1767.7166666666667, "x": "警察と消防が手を組んだのね。"}, {"t": 1769.85, "x": "2012年には、警察庁の生活安全局長が\nもっとくわしく述べた。"}, {"t": 1774.45, "x": "きっかけに挙げた事件は3つある。"}, {"t": 1776.4833333333333, "x": "1つ目が平成13年の歌舞伎町の雑居ビル火災。"}, {"t": 1779.85, "x": "2つ目は、\n平成16年の埼玉県の量販店での連続放火事件だ。"}, {"t": 1784.5833333333333, "x": "3つ目は、前の年の8月に渋谷区で起きた事件だった。"}, {"t": 1788.3166666666666, "x": "店の中にガソリンをまいた殺人未遂事件だという。"}, {"t": 1791.6, "x": "どれも火を使った事件ね。"}, {"t": 1793.4166666666667, "x": "局長は、消防署や建築の役所と\n組んだ予防策を指導したと答えた。"}, {"t": 1797.95, "x": "危ない場所を一緒に見回る\nパトロールもしているという。"}, {"t": 1800.8666666666666, "x": "歌舞伎町の火は、原因が分からないまま\n予防策のきっかけになった。"}, {"t": 1805.5333333333333, "x": "法律が変わってビルは安全になったの？"}, {"t": 1808.0, "x": "2007年の国会で議員が立入検査の割合を並べた。"}, {"t": 1811.6166666666666, "x": "2000年度は30.9％。"}, {"t": 1813.9, "x": "火事のあった2001年は30.3％。"}, {"t": 1816.9166666666667, "x": "法律を改めた2002年は28.2％に下がった。"}, {"t": 1820.8666666666666, "x": "火事のあとなのに下がっているの？"}, {"t": 1822.8333333333333, "x": "2004年には31.0％まで上がった。"}, {"t": 1825.95, "x": "ところが、議員が述べた最新の数字は26.3％だった。"}, {"t": 1830.2, "x": "消防庁の長官はやり方を変えたからだと説明した。"}, {"t": 1833.5166666666667, "x": "すべてのビルを同じように回るのではない。"}, {"t": 1835.8166666666666, "x": "違反の多い危ないビルに重点を置いて調べる。"}, {"t": 1838.4166666666667, "x": "それを補うのが新しく作った定期点検の報告だという。"}, {"t": 1842.6833333333334, "x": "持ち主が分からない問題はどうなったの？"}, {"t": 1845.2166666666667, "x": "2004年4月に消防庁の次長がこう答えている。"}, {"t": 1848.35, "x": "歌舞伎町の火災では、誰が権原を\n持つのかが大きな問題になった。"}, {"t": 1852.6333333333334, "x": "権原ってどういう意味？"}, {"t": 1854.1, "x": "建物を管理して直させる正当な立場のことだ。"}, {"t": 1857.2, "x": "次長は、法令の改正で所有者の責任を\n重く見るようになったと述べた。"}, {"t": 1861.55, "x": "東京消防庁も25年の資料で同じこ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
