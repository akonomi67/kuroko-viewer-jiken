<script>
const D={"name": "095", "file": "095_編集用", "dur": 2243.2333125, "segs": [], "subs": [{"t": 0.0, "x": "2014年3月8日。その日の話は、終わっていない。"}, {"t": 3.9, "x": "……終わっていない？"}, {"t": 4.9, "x": "この回で扱う出来事は、いまも続いている。"}, {"t": 7.716666666666667, "x": "2026年3月8日。"}, {"t": 9.583333333333334, "x": "マレーシアの運輸省が、遺族に\n向けて一枚の文書を出している。"}, {"t": 13.366666666666667, "x": "日本語に直すと、こう書いてある。"}, {"t": 15.466666666666667, "x": "実施された捜索活動は、機体の残骸の位置を\n確認できるいかなる発見ももたらしていない。"}, {"t": 21.216666666666665, "x": "……見つかっていない、と。"}, {"t": 22.716666666666665, "x": "2026年の3月に出た文書だ。つい最近のことだ。"}, {"t": 26.533333333333335, "x": "消えたのは2014年3月8日。"}, {"t": 28.7, "x": "マレーシア航空370便。"}, {"t": 30.766666666666666, "x": "クアラルンプールを出て、北京へ向かう便だった。"}, {"t": 33.46666666666667, "x": "乗っていたのは239人。"}, {"t": 35.5, "x": "飛び立って40分ほどで、画面から消えた。"}, {"t": 38.4, "x": "それきり？"}, {"t": 39.25, "x": "それきりだ。12年たって、機体は\nまだ一つも見つかっていない。"}, {"t": 43.233333333333334, "x": "この12年で、海の底を\n14万平方キロメートル以上、地図にした。"}, {"t": 47.6, "x": "船は、のべ151日間、海の上にいた。"}, {"t": 50.8, "x": "14万平方キロって、どのくらい？"}, {"t": 53.2, "x": "日本の国土のおよそ4割だ。それを\n海の底で、音で塗りつぶしていった。"}, {"t": 57.71666666666667, "x": "それでも、無い。"}, {"t": 58.833333333333336, "x": "公式の報告書は495ページある。"}, {"t": 61.43333333333333, "x": "最後の1行はこうだ。"}, {"t": 62.95, "x": "結論として、調査団はMH370が消えた\n本当の原因を特定することができない。"}, {"t": 69.11666666666666, "x": "今回は、本題の前に、この回で\n話さないことを決めておく。"}, {"t": 73.06666666666666, "x": "この事件、いろんな話があるものね。"}, {"t": 75.5, "x": "ある。だから先に線を引く。"}, {"t": 77.36666666666666, "x": "一つ目。機長と副操縦士を、犯人のように\n扱わない。名前も出さない。"}, {"t": 82.13333333333334, "x": "公式の報告書は、原因を特定していない。"}, {"t": 85.06666666666666, "x": "自殺だった、乗っ取られた、という見方を、\n結論として採っていないんだ。"}, {"t": 89.61666666666666, "x": "でも、そういう話はよく聞くわ。"}, {"t": 91.81666666666666, "x": "聞く。だが私は、報告書に書いてあることだけで組む。"}, {"t": 95.31666666666666, "x": "二つ目。撃ち落とされた、どこかの基地に\n降りた、という話をしない。"}, {"t": 99.51666666666667, "x": "並べて否定することもしない。"}, {"t": 101.2, "x": "最初から外に置く。"}, {"t": 102.66666666666667, "x": "三つ目。ここは大事だ。"}, {"t": 104.2, "x": "239人が亡くなった、という言い方をしない。"}, {"t": 107.63333333333334, "x": "……え。"}, {"t": 108.11666666666666, "x": "報告書自身が、239人はまだ\n行方不明である、と書いている。"}, {"t": 112.58333333333333, "x": "機体が見つかっていない以上、\n国は死亡を確定していない。"}, {"t": 115.98333333333333, "x": "だから私も「行方が分かっていない」と言う。"}, {"t": 118.8, "x": "四つ目。マレーシアも、中国も、\nオーストラリアも、責める形にしない。"}, {"t": 123.35, "x": "報告書に書いてある事実は、\nそのまま置く。評価は足さない。"}, {"t": 127.1, "x": "五つ目。英語の資料は、日本語に直したものを読む。"}, {"t": 130.4, "x": "原文のまま読むのは、\nたった一言だけだ。あとで出てくる。"}, {"t": 134.2, "x": "……ずいぶん、しばりが多いのね。"}, {"t": 136.01666666666668, "x": "多い。だがそれでも、この回は材料が余るくらいある。"}, {"t": 139.18333333333334, "x": "使うのは、マレーシア政府の報告書と、\n日本の防衛省の記録と、国会の会議録だ。"}, {"t": 145.31666666666666, "x": "では、その夜から始める。"}, {"t": 147.13333333333333, "x": "2014年3月8日、土曜日。"}, {"t": 149.35, "x": "マレーシア時間で、午前0時42分。"}, {"t": 152.13333333333333, "x": "日付がかわったばかりの時間ね。"}, {"t": 154.26666666666668, "x": "クアラルンプール国際空港の、32\nRという滑走路から飛び立った。"}, {"t": 158.58333333333334, "x": "行き先は北京。着く予定は、その日の朝だった。"}, {"t": 161.73333333333332, "x": "乗っていたのは、乗客227人と乗員12人。"}, {"t": 165.13333333333333, "x": "合わせて239人。"}, {"t": 166.95, "x": "乗員は12人とも、マレーシアの方だ。"}, {"t": 169.51666666666668, "x": "乗客のいちばん多い国籍は中国で、153人。"}, {"t": 173.03333333333333, "x": "次がマレーシアで38人。"}, {"t": 174.8, "x": "あとはインドネシア、オーストラリア、\nインド、フランスと続く。"}, {"t": 178.56666666666666, "x": "日本の人は？"}, {"t": 179.75, "x": "乗っていない。報告書の国籍の一覧に、日本は無い。"}, {"t": 183.26666666666668, "x": "そして、乗客227人の中には、\n子どもが3人と、赤ちゃんが2人いた。"}, {"t": 188.43333333333334, "x": "……。"}, {"t": 189.36666666666667, "x": "機体はボーイング777型機。"}, {"t": 191.36666666666667, "x": "登録記号は9M-MRO。"}, {"t": 193.58333333333334, "x": "2002年5月に作られて、その月のうちに\nマレーシア航空へ引き渡されている。"}, {"t": 198.41666666666666, "x": "事故の前日までに、5万3千時間あまり、\n7,526回飛んでいた。"}, {"t": 203.4, "x": "エンジンはロールス・ロイス製が2基。"}, {"t": 205.55, "x": "積んでいた燃料は4万9,100キログラム。"}, {"t": 208.3, "x": "これは、予備も入れて7時間31分ぶん飛べる量だ。"}, {"t": 211.73333333333332, "x": "北京までの予定は、5時間34分だった。"}, {"t": 214.86666666666667, "x": "……2時間ぶん、余裕があったのね。"}, {"t": 216.93333333333334, "x": "この余裕の量が、あとで効いてくる。"}, {"t": 218.93333333333334, "x": "覚えておいてほしい。"}, {"t": 220.81666666666666, "x": "離陸から37分後。午前1時19分26秒。"}, {"t": 224.53333333333333, "x": "クアラルンプールの管制が、\nこの機に指示を出している。"}, {"t": 227.61666666666667, "x": "ホーチミンの管制に、周波数120.9メガヘルツで\n連絡してください、という内容だ。"}, {"t": 233.26666666666668, "x": "次の国の管制に引きつぐのね。"}, {"t": 235.56666666666666, "x": "マレーシアの空域から、\nベトナムの空域へ移るところだ。"}, {"t": 238.93333333333334, "x": "その4秒後、午前1時19分30秒。"}, {"t": 241.71666666666667, "x": "機体から返事があった。"}, {"t": 243.3, "x": "ここだけは、英語のまま読む。"}, {"t": 245.11666666666667, "x": "グッドナイト、マレーシアン スリーセブンゼロ。"}, {"t": 247.85, "x": "……おやすみなさい、マレーシア370便。"}, {"t": 250.56666666666666, "x": "報告書は、これを「MH370から記録された\n最後の無線交信だった」と書いている。"}, {"t": 256.26666666666665, "x": "この声を出したのは機長だった、とも書いてある。"}, {"t": 259.25, "x": "……最後の言葉が、それなのね。"}, {"t": 261.31666666666666, "x": "この一言は、世界中で何度も再生された。"}, {"t": 264.31666666666666, "x": "声の調子がどうだった、という話も、ずいぶん出た。"}, {"t": 267.53333333333336, "x": "だが報告書は、その点についても\nきちんと書いている。日本語に直す。"}, {"t": 271.81666666666666, "x": "機長と副操縦士が管制官と行った\n無線のやりとりからは、"}, {"t": 275.65, "x": "会話の中に不安や緊張の証拠は認められなかった。"}, {"t": 279.01666666666665, "x": "……ふつうだった、と。"}, {"t": 280.3666666666667, "x": "報告書はそう書いている。"}, {"t": 281.76666666666665, "x": "私はそこから先へは行かない。"}, {"t": 284.4166666666667, "x": "ただし、報告書はもう一つ、細かいことを書いている。"}, {"t": 287.9166666666667, "x": "なに？"}, {"t": 288.56666666666666, "x": "無線の決まりでは、周波数を指示されたら、\nその数字を繰り返して返すことになっている。"}, {"t": 293.9166666666667, "x": "120.9で連絡してください、と\n言われたら、120.9です、と返す。"}, {"t": 299.1333333333333, "x": "聞きまちがいを防ぐためね。"}, {"t": 301.0, "x": "そうだ。ところがこのときの返事には、\nその数字が入っていない。"}, {"t": 304.85, "x": "報告書の言い方を日本語に直すと、こうなる。"}, {"t": 307.73333333333335, "x": "彼は指定された周波数を復唱しておらず、"}, {"t": 310.4, "x": "これは無線電話の手順と一致していなかった。"}, {"t": 313.21666666666664, "x": "……手順どおりじゃなかったのね。"}, {"t": 314.96666666666664, "x": "そこは事実として書いてある。"}, {"t": 316.75, "x": "ただし、ここから先が大事だ。"}, {"t": 318.8, "x": "報告書は、この一文と同じ節に、\nさっきの一文も並べて書いている。"}, {"t": 323.3, "x": "不安や緊張の証拠は\n認められなかった、という一文だ。"}, {"t": 326.9, "x": "……両方、同じところに書いてあるの。"}, {"t": 329.18333333333334, "x": "同じところに書いてある。"}, {"t": 330.6666666666667, "x": "つまり報告書は、決まりから外れたことと、\n様子がおかしかったことを、結びつけていない。"}, {"t": 336.1666666666667, "x": "私も結びつけない。"}, {"t": 337.6666666666667, "x": "復唱を忘れることは、そう珍しいことではないらしい。"}, {"t": 340.8666666666667, "x": "この一点から動機を読み取ろうとするのは、\n報告書がやっていないことだ。"}, {"t": 345.7, "x": "最後の交信から1分後。"}, {"t": 347.3, "x": "午前1時20分31秒。"}, {"t": 349.48333333333335, "x": "機体は、イガリという地点を通過した。"}, {"t": 352.01666666666665, "x": "イガリ？"}, {"t": 352.68333333333334, "x": "空の道の上にある、決められた通過点だ。"}, {"t": 355.26666666666665, "x": "地図の上の目印だな。"}, {"t": 356.85, "x": "ここがマレーシアとベトナムの空域の境目にあたる。"}, {"t": 359.8666666666667, "x": "その5秒後。午前1時20分36秒。"}, {"t": 362.8333333333333, "x": "管制官の画面から、この機のしるしが消えた。"}, {"t": 365.85, "x": "5秒後。"}, {"t": 366.6666666666667, "x": "機体から出ている信号が、\n届かなくなったということだ。"}, {"t": 370.01666666666665, "x": "最後に位置のしるしが\n記録されたのは、午前1時21分13秒。"}, {"t": 374.26666666666665, "x": "そして、これはマレーシアだけの話ではない。"}, {"t": 376.9166666666667, "x": "マレーシア軍のレーダーも、\nベトナムのレーダーも、タイのレーダーも、"}, {"t": 380.48333333333335, "x": "同じように、このしるしが消えるのを捉えている。"}, {"t": 383.31666666666666, "x": "……3か国の画面から、いっぺんに消えたのね。"}, {"t": 386.15, "x": "機体とやりとりする別のしくみもある。"}, {"t": 388.26666666666665, "x": "飛行中の状態を地上へ送る通信だ。"}, {"t": 390.78333333333336, "x": "これはふつう30分おきに送られる。"}, {"t": 392.8666666666667, "x": "最後に届いたのは、午前1時7分29秒。"}, {"t": 396.1166666666667, "x": "次に届くはずだった午前1時37分と、\nその30分後の分は、どちらも届かなかった。"}, {"t": 402.25, "x": "じゃあ、まったく何も分からなくなったのね。"}, {"t": 404.9166666666667, "x": "いや。そこがこの話のいちばん\n面白いところだ。あとで話す。"}, {"t": 409.45, "x": "ここで、よく言われる話に触れておく。"}, {"t": 411.9166666666667, "x": "誰かがスイッチを切ったんじゃないか、っていう話ね。"}, {"t": 415.03333333333336, "x": "それだ。報告書がその点について何と\n書いているか、読む。日本語に直す。"}, {"t": 419.81666666666666, "x": "さらなる証拠がない以上、"}, {"t": 421.31666666666666, "x": "機体からのトランスポンダー情報が\n途絶えた理由は、特定できなかった。"}, {"t": 425.6, "x": "……特定できなかった。"}, {"t": 427.0833333333333, "x": "報告書はもう一つ、隣に並べて書いている。"}, {"t": 430.03333333333336, "x": "管制官の表示から消えたのは\nMH370の信号だけであり、"}, {"t": 434.03333333333336, "x": "他の機体の表示は、依然として\n利用可能だったと判定された。"}, {"t": 438.1, "x": "他の飛行機は、ちゃんと映ってたのね。"}, {"t": 440.68333333333334, "x": "映っていた。だから、\n地上の装置が壊れたのではない。"}, {"t": 444.0, "x": "機体の側で信号が出なくなった。\nそこまでは分かっている。"}, {"t": 447.43333333333334, "x": "だが、なぜそうなったのかは、分かっていない。"}, {"t": 450.1166666666667, "x": "機械が壊れたのか、電気が\n落ちたのか、誰かが止めたのか。"}, {"t": 453.9, "x": "報告書は、そのどれとも書いていない。"}, {"t": 456.35, "x": "……書けなかったのね。"}, {"t": 457.68333333333334, "x": "書ける材料が無いからだ。"}, {"t": 459.26666666666665, "x": "ここを「誰かが切った」と言い切ってしまうと、\n話はとたんに面白くなる。"}, {"t": 463.76666666666665, "x": "だが、それは報告書が\n言っていないことだ。私は言わない。"}, {"t": 467.96666666666664, "x": "ここから、軍のレーダーの記録に移る。"}, {"t": 470.3666666666667, "x": "民間の管制の画面からは消えたが、\n軍のレーダーはまだ何かを捉えていた。"}, {"t": 474.96666666666664, "x": "映ってたの？"}, {"t": 476.0, "x": "映っていた。報告書はこれを、\nエア・ターン・バックと呼んでいる。"}, {"t": 479.8333333333333, "x": "日本語にすれば、空中での引き返しだ。"}, {"t": 482.4166666666667, "x": "午前1時21分13秒。"}, {"t": 484.35, "x": "機体は右へ旋回し、その直後に左へ回り始めた。"}, {"t": 487.98333333333335, "x": "向いた方角は273度。ほぼ真西だ。"}, {"t": 491.0833333333333, "x": "北京は北東よね。"}, {"t": 492.56666666666666, "x": "正反対に近い。そのまま、コタバルという\n町の方角へ向かっている。"}, {"t": 496.78333333333336, "x": "午前1時37分59秒。"}, {"t": 498.96666666666664, "x": "向きは239度。南西寄りだ。"}, {"t": 501.56666666666666, "x": "ペナンの方角へ向かう別の空の道に、\n平行して飛んでいる。"}, {"t": 505.28333333333336, "x": "午前1時52分31秒。"}, {"t": 507.35, "x": "ペナン島の南10海里のあたり。向きは261度。"}, {"t": 511.0, "x": "午前2時1分59秒。"}, {"t": 512.6666666666666, "x": "向きは022度。ほぼ北だ。"}, {"t": 514.9166666666666, "x": "……また、曲がったのね。"}, {"t": 516.4666666666667, "x": "曲がっている。午前2時3分9秒。\nここで、いったん光点が消える。"}, {"t": 520.6833333333333, "x": "そして午前2時15分25秒。また現れる。"}, {"t": 523.75, "x": "最後に映っていたのは、午前2時22分12秒。"}, {"t": 527.0, "x": "バタワースという場所から、\nおよそ195海里。向きは285度。"}, {"t": 531.5166666666667, "x": "メカーという通過点の、北およそ10海里のあたりだ。"}, {"t": 534.8333333333334, "x": "それで、本当に消えたのね。"}, {"t": 536.8333333333334, "x": "レーダーに映ったのは、ここまでだ。"}, {"t": 539.5333333333333, "x": "ここで、どうしても\n言っておかなければならないことがある。"}, {"t": 542.75, "x": "なに？"}, {"t": 543.3666666666667, "x": "この事件を調べていると、すごい数字に出会う。"}, {"t": 546.15, "x": "高度4万7,500フィートまで急上昇して、そのあと\n4,800フィートまで急降下した、という話だ。"}, {"t": 552.9166666666666, "x": "……聞いたことがある。"}, {"t": 553.8333333333334, "x": "レーダーを避けるために低く飛んだ、って。"}, {"t": 556.3333333333334, "x": "たくさんの動画や記事が、その数字を使っている。"}, {"t": 559.3166666666667, "x": "だが、報告書はその数字について、\nはっきり書いている。日本語に直す。"}, {"t": 563.8666666666667, "x": "しかし、記録された高度と速度の、\n光点から光点への変化が、"}, {"t": 567.9666666666667, "x": "機体の能力をはるかに\n超えていることは、非常に明らかだった。"}, {"t": 571.85, "x": "……機体の能力を、超えている。"}, {"t": 573.7833333333333, "x": "旅客機に、そんな上がり方も\n下がり方もできない、という意味だ。"}, {"t": 577.6166666666667, "x": "報告書は続けてこう書く。"}, {"t": 579.4, "x": "軍のレーダーから得られた唯一有用な\n情報は、機体の緯度と経度の位置であり、"}, {"t": 583.8166666666667, "x": "このデータは相応に正確である。"}, {"t": 585.8666666666667, "x": "……使えるのは、場所だけなのね。"}, {"t": 587.9, "x": "場所だけだ。高さと速さは、\n記録はされているが、当てにならない。"}, {"t": 592.0, "x": "だから私は、この回で高度の数字を一つも使わない。"}, {"t": 595.5, "x": "さっきの章で言ったのは、時刻と、\n方角と、場所だけだったはずだ。"}, {"t": 599.9166666666666, "x": "……そういえば、高さは言わなかったわね。"}, {"t": 602.2666666666667, "x": "報告書は、もう一つ書いている。"}, {"t": 604.4166666666666, "x": "MH370がレーダーを回避していたことを示すような、"}, {"t": 607.9166666666666, "x": "急激な高度あるいは速度の変化の証拠はない。"}, {"t": 610.8, "x": "レーダーを避けて飛んだ、という\n話も、報告書は採っていないんだ。"}, {"t": 615.3333333333334, "x": "では、あの旋回は誰がやったのか。"}, {"t": 617.7, "x": "……そこよね。"}, {"t": 618.6166666666667, "x": "報告書の結論を、二つ並べて読む。まず一つ目。"}, {"t": 622.1666666666666, "x": "機体が、指定された\nマレーシア航空のパイロット以外の誰かによって"}, {"t": 626.2, "x": "操縦されていたことを示す証拠もない。"}, {"t": 628.7, "x": "じゃあ、操縦席にいたのは2人だけだったのね。"}, {"t": 631.7, "x": "ところが、そのすぐあとに、こう続く。"}, {"t": 634.15, "x": "ただし調査団は、第三者による\n介入の可能性を排除しない。"}, {"t": 638.1166666666667, "x": "……え。どっちなの。"}, {"t": 639.3166666666667, "x": "どちらとも決めていない、というのが答えだ。"}, {"t": 641.85, "x": "証拠が無いから、いたとも\n言えないし、いなかったとも言えない。"}, {"t": 645.3166666666667, "x": "報告書は、最後までこの書き方を崩さない。"}, {"t": 648.2333333333333, "x": "機長と副操縦士についても、同じだ。読む。"}, {"t": 651.3, "x": "2人が最近、人間関係の変化や困難を\n経験したことを示す証拠はなく、"}, {"t": 656.2333333333333, "x": "2人の間に対立や問題があったことを示す証拠もない。"}, {"t": 659.75, "x": "経済的な困窮も、差し迫った\n破産も、最近の保険の加入も、"}, {"t": 664.2, "x": "最近の行動の変化も、乗員には無かった。"}, {"t": 667.2666666666667, "x": "……身辺には、何も出てこなかったのね。"}, {"t": 669.8166666666667, "x": "機長の自宅にあった飛行シミュレータについても、\n報告書は結論を載せている。"}, {"t": 674.4333333333333, "x": "マレーシア警察の鑑識報告書は、"}, {"t": 676.7333333333333, "x": "ゲームに関連した飛行シミュレーション以外に\n異常な活動はなかったと結論した。"}, {"t": 681.3166666666667, "x": "この一文まで言わずに、\n途中で切るのは公平ではない。"}, {"t": 685.1333333333333, "x": "さて、ここからがこの回の芯だ。"}, {"t": 687.2833333333333, "x": "レーダーから消えたのが午前2時22分。"}, {"t": 689.6833333333333, "x": "ところが、この機体はそのあとも、\n6時間近く飛んでいる。"}, {"t": 693.4666666666667, "x": "……なんで分かるの？"}, {"t": 694.6, "x": "衛星だ。"}, {"t": 695.3166666666667, "x": "この機体には、衛星を使って\n通信するしくみが積んであった。"}, {"t": 699.0333333333333, "x": "そのしくみは、使われていないときでも、"}, {"t": 701.4666666666667, "x": "1時間おきに地上と短いやりとりをして、\nつながっているかどうかを確かめる。"}, {"t": 706.1333333333333, "x": "生きてる、って合図を送るのね。"}, {"t": 708.0833333333334, "x": "中身は何も無い。声も、文字も、位置も入っていない。"}, {"t": 711.5, "x": "ただ「そこにいる」とだけ分かる\n信号だ。これをハンドシェイクと呼ぶ。"}, {"t": 715.5166666666667, "x": "時刻を並べる。マレーシア時間だ。"}, {"t": 717.7166666666667, "x": "午前2時25分。機体の側から、\nつなぎ直しの信号が出た。これが1回目。"}, {"t": 722.7166666666667, "x": "午前3時41分。2回目。"}, {"t": 724.8, "x": "午前4時41分、3回目。"}, {"t": 727.05, "x": "午前5時41分、4回目。"}, {"t": 729.1333333333333, "x": "午前6時41分、5回目。"}, {"t": 731.3666666666667, "x": "午前8時11分、6回目。"}, {"t": 733.6666666666666, "x": "……ずっと、飛んでるのね。"}, {"t": 735.2333333333333, "x": "そして午前8時19分。7回目。"}, {"t": 737.8166666666667, "x": "これが機体の側から出た、最後の通信だ。"}, {"t": 740.6166666666667, "x": "正確には、午前8時19分29秒42。"}, {"t": 743.9333333333333, "x": "離陸からちょうど7時間37分後にあたる。"}, {"t": 746.9333333333333, "x": "その56分後、午前9時15分。"}, {"t": 749.2333333333333, "x": "地上から呼びかけたが、機体は応答しなかった。"}, {"t": 752.35, "x": "……そこで、終わったのね。"}, {"t": 753.95, "x": "ちなみに、この途中で地上から\n機内へ電話をかけた記録が2回ある。"}, {"t": 757.9833333333333, "x": "午前2時39分と、午前7時13分。"}, {"t": 760.9333333333333, "x": "どちらも、応答は無かった。"}, {"t": 763.4166666666666, "x": "ここで、よく誤解されるところを直しておく。"}, {"t": 766.2, "x": "衛星が場所を突き止めた、っていうやつ？"}, {"t": 768.6166666666667, "x": "それだ。突き止めていない。"}, {"t": 770.2833333333333, "x": "信号の中に、位置の情報は入っていない。"}, {"t": 773.0833333333334, "x": "じゃあ、何が分かったの？"}, {"t": 774.7666666666667, "x": "時間だ。"}, {"t": 775.5, "x": "地上から出た電波が衛星を通って機体に\n届き、また戻ってくるまでの時間を測る。"}, {"t": 780.5, "x": "その時間から、衛星と機体の距離が出る。"}, {"t": 783.2666666666667, "x": "……距離だけ。"}, {"t": 784.15, "x": "方角は分からない。距離だけだ。"}, {"t": 786.1666666666666, "x": "衛星を中心にして、その距離のところに円を描く。"}, {"t": 789.3666666666667, "x": "機体は、その円のどこかにいた。それしか分からない。"}, {"t": 792.6, "x": "報告書は、この線をこう定義している。日本語に直す。"}, {"t": 796.1166666666667, "x": "弧とは、衛星との通信の時点における、"}, {"t": 798.65, "x": "機体の位置としてありうる点の集合を\n表す、地球に沿って引かれた線である。"}, {"t": 803.3166666666667, "x": "……ありうる点の、集合。"}, {"t": 804.9333333333333, "x": "点ではなく、線だ。そして地球は\n丸いから、その線はとても長い。"}, {"t": 809.25, "x": "7回目のハンドシェイクのときに\n引かれた線を、第7弧と呼ぶ。"}, {"t": 813.0333333333333, "x": "この12年の捜索は、ずっとこの線の周りを探している。"}, {"t": 816.8166666666667, "x": "……線の上を、ずっと。"}, {"t": 818.3166666666667, "x": "そういうことだ。"}, {"t": 819.3333333333334, "x": "報告書は、この機体が南インド洋で\n飛行を終えた、という言い方をしている。"}, {"t": 823.7833333333333, "x": "墜落した、とは書いていない。"}, {"t": 825.5333333333333, "x": "飛行を終えた、だ。"}, {"t": 827.4333333333333, "x": "では、なぜ7回目だけ機体の側から出たのか。"}, {"t": 830.5666666666667, "x": "2回目から6回目は、地上から呼びかけたのよね。"}, {"t": 833.7833333333333, "x": "そうだ。1回目と7回目だけが、\n機体の側から出ている。"}, {"t": 837.4833333333333, "x": "報告書の見立てを読む。日本語に直す。"}, {"t": 840.0833333333334, "x": "第7弧に結びついた機体の衛星送信は、"}, {"t": 842.9, "x": "燃料の枯渇によって引き起こされた機内の電源の中断と\n関係している可能性がもっとも高い。"}, {"t": 848.75, "x": "……燃料が、尽きた。"}, {"t": 850.2333333333333, "x": "報告書は、根拠も書いている。"}, {"t": 852.2333333333333, "x": "この送信の時刻は、最後の通信の時点で\n残っていた燃料の総重量に基づく、"}, {"t": 857.3666666666667, "x": "MH370便に見込まれる\n最大の飛行時間と一致している。"}, {"t": 861.3666666666667, "x": "積んでいたのは7時間31分ぶんの燃料だった。"}, {"t": 864.6333333333333, "x": "最後の信号は、離陸から7時間37分後だ。"}, {"t": 868.2, "x": "……ぴったりね。"}, {"t": 869.15, "x": "報告書は、そのあと何が起きたかも書いている。"}, {"t": 872.0666666666667, "x": "飛行の最後に燃料が尽きて\n両方のエンジンが停止したあと、"}, {"t": 875.6166666666667, "x": "補助動力装置が、そうあるべきように\n自動で起動した可能性がある。"}, {"t": 879.5833333333334, "x": "この起動と、電気系統への給電が、"}, {"t": 882.05, "x": "7回目にして最後の、機体の側から始まった\n通信を引き起こした可能性がもっとも高い。"}, {"t": 887.7166666666667, "x": "……じゃあ、あの最後の信号は。"}, {"t": 889.5833333333334, "x": "エンジンが止まって、\n非常用の発電機が立ち上がった。"}, {"t": 892.8666666666667, "x": "その瞬間に、通信の装置がもう一度電源を\n入れ直した合図だ、ということになる。"}, {"t": 897.8333333333334, "x": "誰かが送ったのではない。"}, {"t": 899.25, "x": "機械が、ひとりでに送った。"}, {"t": 901.8333333333334, "x": "衛星の話に、小さな補足を足しておく。"}, {"t": 904.7, "x": "なに？"}, {"t": 905.3333333333334, "x": "この機体が使っていた衛星は、\nインド洋の上にあるインマルサットのものだ。"}, {"t": 909.5833333333334, "x": "受けていた地上の局は、\nオーストラリアのパースにあった。"}, {"t": 912.7833333333333, "x": "報告書は、わざわざこう書いている。日本語に直す。"}, {"t": 916.0666666666667, "x": "インマルサットは、飛行の間、衛星の通信や通話が"}, {"t": 919.55, "x": "他のいかなる衛星を経由して他のいかなる地上局にも"}, {"t": 922.9833333333333, "x": "送られていないことを確認した。"}, {"t": 925.1, "x": "……他の衛星は経由していない、と。"}, {"t": 927.2833333333333, "x": "その「他のいかなる衛星」の例として、\n報告書が括弧の中に挙げているものがある。"}, {"t": 932.4666666666667, "x": "MTSATだ。"}, {"t": 933.6833333333333, "x": "……なにそれ。"}, {"t": 934.55, "x": "報告書の脚注に説明がある。読む。"}, {"t": 937.15, "x": "MTSATは、日本の気象および航空用の衛星と\n地上局のシリーズである。"}, {"t": 941.6833333333333, "x": "MTSAT-1RとMTSAT-2の衛星は、\nインマルサットの衛星と相互運用できる。"}, {"t": 947.4333333333333, "x": "日本の衛星なのね。"}, {"t": 948.9166666666666, "x": "ひまわり、と呼ばれている系列のものだ。"}, {"t": 951.1666666666666, "x": "天気予報でおなじみのあれだな。"}, {"t": 953.1166666666667, "x": "あの衛星は、天気を撮るだけでなく、\n航空の通信も中継できる作りになっていた。"}, {"t": 958.1, "x": "だから調査団は、そちらを経由していないか\nどうかも、わざわざ確かめている。"}, {"t": 962.75, "x": "……確かめたうえで、経由していなかった、と。"}, {"t": 965.5333333333333, "x": "そうだ。もし経由していたら、\n別の記録が残っていたかもしれない。"}, {"t": 969.5666666666667, "x": "この事故について、日本の名前が\n報告書に出てくるのは、ここだけだ。"}, {"t": 973.8333333333334, "x": "495ページの中の、脚注の1行。"}, {"t": 976.9833333333333, "x": "……ちょっと、惜しい感じね。"}, {"t": 978.6666666666666, "x": "私はこの1行が好きでな。"}, {"t": 980.5666666666667, "x": "調べるというのは、こういう「無かった」を\n一つずつ潰していくことなんだと思う。"}, {"t": 985.95, "x": "ここで、地上の側の時間を並べておく。"}, {"t": 988.4833333333333, "x": "報告書が書いている事実を、\nそのまま置くだけにする。評価は足さない。"}, {"t": 992.7333333333333, "x": "午前1時39分6秒。"}, {"t": 994.6333333333333, "x": "ホーチミンの管制が、\nクアラルンプールの管制に問い合わせている。"}, {"t": 998.3833333333333, "x": "この機がどこにいるか、という照会だ。"}, {"t": 1000.8333333333334, "x": "消えてから、18分後ね。"}, {"t": 1002.8166666666667, "x": "報告書は、本来なら午前2時27分の時点で、"}, {"t": 1006.25, "x": "クアラルンプールの管制が遭難段階を\n宣言すべきだった、と書いている。"}, {"t": 1010.65, "x": "遭難段階。"}, {"t": 1011.8166666666667, "x": "いちばん重い区分だ。これを出すと、\n捜索と救助のしくみが動き出す。"}, {"t": 1016.1666666666666, "x": "実際に動いたのは、午前5時30分。"}, {"t": 1018.65, "x": "救難を調整するセンターが起動した。"}, {"t": 1021.0666666666667, "x": "遭難段階が宣言されたのは、午前6時32分だ。"}, {"t": 1024.9, "x": "……2時27分に出すはずのものが、6時32分。"}, {"t": 1028.4666666666667, "x": "4時間あまり、開いている。"}, {"t": 1030.2333333333333, "x": "報告書はこう書いている。日本語に直す。"}, {"t": 1032.85, "x": "両センターの管制官は、当時求められていた\n各種の緊急段階を開始せず、"}, {"t": 1037.6666666666667, "x": "それによって警急業務と\n捜索救難活動の起動を遅らせた。"}, {"t": 1041.6833333333334, "x": "……はっきり書いてあるのね。"}, {"t": 1043.2166666666667, "x": "はっきり書いてある。"}, {"t": 1044.2333333333333, "x": "私はここに評価を足さない。"}, {"t": 1046.1333333333334, "x": "ただし、一つだけ言っておく。"}, {"t": 1048.0166666666667, "x": "この時点で機体は、まだ5時間近く飛んでいた。"}, {"t": 1051.0333333333333, "x": "たとえすぐ動いていても、探すべき\n海はまったく別の場所だった。"}, {"t": 1054.8833333333334, "x": "誰も、この機が西へ向かっているとは\n思っていなかったからだ。"}, {"t": 1059.1, "x": "ここから、この回でいちばん\n話したかったところに入る。"}, {"t": 1062.55, "x": "なに？"}, {"t": 1063.2, "x": "日本も、この捜索に参加していた。"}, {"t": 1065.7666666666667, "x": "……日本が？"}, {"t": 1066.6333333333334, "x": "ほとんど語られていないが、公式の記録が残っている。"}, {"t": 1069.8166666666666, "x": "防衛省のページだ。"}, {"t": 1071.1833333333334, "x": "そのまま読む。"}, {"t": 1072.15, "x": "3月10日にマレーシア政府から支援要請があったことを\n踏まえ、外務大臣との協議に基づき、"}, {"t": 1077.7166666666667, "x": "同年3月11日、防衛大臣は自衛隊による、\n国際緊急援助活動を実施することを決定しました。"}, {"t": 1084.6, "x": "消えて3日目ね。"}, {"t": 1085.8833333333334, "x": "その日のうちに、命令が出ている。"}, {"t": 1087.95, "x": "出したのは、国際緊急援助活動の実施に\n関する自衛隊行動命令、という名前の命令だ。"}, {"t": 1093.8, "x": "送ったものを読む。"}, {"t": 1094.95, "x": "最大で人員およそ90名、\n海上自衛隊のP-3C哨戒機2機、"}, {"t": 1099.4833333333333, "x": "および航空自衛隊のC-130H輸送機2機を\nマレーシアに派遣し、捜索救助活動を実施しました。"}, {"t": 1106.1666666666667, "x": "哨戒機って、海の上を見る飛行機よね。"}, {"t": 1108.8666666666666, "x": "海面を長い時間見張るのが仕事の機体だ。\nこういう捜索には向いている。"}, {"t": 1113.2166666666667, "x": "拠点はスバンという場所に置いた。"}, {"t": 1115.1166666666666, "x": "その後、捜索の重点が南インド洋へ移ったので、"}, {"t": 1118.3833333333334, "x": "マレーシア政府とオーストラリア政府の要請を受けて、"}, {"t": 1121.25, "x": "P-3Cをオーストラリアの西部、\nパースの近くへ移している。"}, {"t": 1124.9666666666667, "x": "日本時間でいうと、消えたのは\n3月8日の午前1時42分。"}, {"t": 1128.9833333333333, "x": "その3日後には、もう日本の飛行機が\n向かう決定が出ていたことになる。"}, {"t": 1133.8166666666666, "x": "活動が終わったのは、2014年4月28日だ。"}, {"t": 1137.4, "x": "この日、オーストラリアの首相が、\n海面の捜索から海底の捜索へ移ると発表した。"}, {"t": 1142.95, "x": "上から見るのを、やめたのね。"}, {"t": 1144.8833333333334, "x": "浮いているものを探す段階が終わった、ということだ。"}, {"t": 1147.9166666666667, "x": "それを受けて、防衛大臣が終結の命令を出している。"}, {"t": 1151.2166666666667, "x": "防衛省の記録を読む。"}, {"t": 1152.7333333333333, "x": "本活動において、自衛隊は、P-3\nC哨戒機やC-130H輸送機など、のべ6機、"}, {"t": 1158.9, "x": "派遣隊員およそ130名が活動に従事し、\n計46回、およそ400時間の捜索を行いました。"}, {"t": 1165.7166666666667, "x": "46回。400時間。"}, {"t": 1167.7666666666667, "x": "1か月半で、それだけ飛んだ。"}, {"t": 1169.85, "x": "ただし、ここははっきりさせておく。"}, {"t": 1171.95, "x": "日本の部隊が何かを見つけた、という\n記録は、どこにも無い。"}, {"t": 1175.8, "x": "……見つからなかったのね。"}, {"t": 1177.3166666666666, "x": "誰も見つけていない。"}, {"t": 1178.5, "x": "日本も見つけていない。"}, {"t": 1179.9833333333333, "x": "それでも私は、この400時間を数えておきたかった。"}, {"t": 1183.4333333333334, "x": "日本人の乗客は、一人もいなかった。"}, {"t": 1186.0666666666666, "x": "それでも、のべ6機が飛んだ。"}, {"t": 1187.95, "x": "2014年5月13日、防衛大臣が\nマレーシアを訪れている。"}, {"t": 1192.0666666666666, "x": "国会での報告を読む。"}, {"t": 1193.6333333333334, "x": "ナジブ首相からは、マレーシア航空機捜索に係る\n自衛隊部隊の貢献に謝意が述べられました。"}, {"t": 1199.8833333333334, "x": "飛んだのは自衛隊だけではない。"}, {"t": 1201.7, "x": "2014年3月26日、衆議院の国土交通委員会で、\n海上保安庁の長官が説明している。"}, {"t": 1208.3666666666666, "x": "そのまま読む。"}, {"t": 1209.35, "x": "3月8日からマレーシア航空機が\n消息不明となっている事案に関しまして、"}, {"t": 1213.9333333333334, "x": "11日に外務省から\n国際緊急援助隊への派遣協力の協議を受けまして、"}, {"t": 1218.85, "x": "13日に海上保安庁の航空機ガルフ5・1機と\n関係要員をマレーシアに派遣いたしました。"}, {"t": 1224.7166666666667, "x": "13日。自衛隊より2日あとね。"}, {"t": 1227.25, "x": "長官の説明は続く。"}, {"t": 1228.9, "x": "翌14日から\nマレー半島東方海域およびインドネシア南方海域の\n捜索を実施してまいりました。"}, {"t": 1234.8333333333333, "x": "その後、捜索海域の重点が\nインド洋南部へ移りましたことから、"}, {"t": 1238.9333333333334, "x": "マレーシア、オーストラリア両政府の要請を\n踏まえまして、"}, {"t": 1242.1166666666666, "x": "本日、同航空機の拠点をオーストラリアに\n移すこととしております。"}, {"t": 1246.35, "x": "この答弁の日に、移してるのね。"}, {"t": 1248.65, "x": "3月26日だ。動きながら国会で報告している。"}, {"t": 1252.3333333333333, "x": "それから、もう一つある。"}, {"t": 1254.0166666666667, "x": "2014年4月14日、参議院の決算委員会で、\n内閣衛星情報センターの次長が述べている。"}, {"t": 1260.3333333333333, "x": "先般のマレーシア航空機の消息不明事案の際には、"}, {"t": 1263.65, "x": "情報収集衛星による捜索で得られた情報を、\nマレーシア政府などに提供したところでございます。"}, {"t": 1269.4666666666667, "x": "……衛星の写真も出したのね。"}, {"t": 1271.3166666666666, "x": "出している。ただし、ここも同じだ。"}, {"t": 1273.6, "x": "その写真から何かが見つかった、という記録は無い。"}, {"t": 1276.7333333333333, "x": "提供した、というところまでが\n公式の記録だ。それ以上は言わない。"}, {"t": 1280.8, "x": "それから、もう一つ、実らなかった話もある。"}, {"t": 1284.05, "x": "実らなかった？"}, {"t": 1285.2333333333333, "x": "2014年3月25日、\n参議院の外交防衛委員会でのやりとりだ。"}, {"t": 1289.8666666666666, "x": "文部科学副大臣が、こう答えている。読む。"}, {"t": 1292.9, "x": "現時点では文部科学省に対して\n海洋探査等の協力要請は来ておりませんが、"}, {"t": 1297.8166666666666, "x": "独立行政法人海洋研究開発機構は、\n海洋科学技術分野における"}, {"t": 1302.7666666666667, "x": "先端的な基盤技術を有しており、"}, {"t": 1305.05, "x": "これまでも国等からの要請に基づき\n海底探査を実施してきたところでございます。"}, {"t": 1310.05, "x": "海底を探る技術を持ってる、ってことね。"}, {"t": 1312.7, "x": "日本には、深い海に潜って調べる船と機械がある。"}, {"t": 1316.0666666666666, "x": "副大臣は、こう続けている。"}, {"t": 1318.0666666666666, "x": "マレーシア政府から協力要請があった場合、"}, {"t": 1320.6, "x": "協力に必要となる研究船、\n探査機器等の都合が付けば、"}, {"t": 1324.45, "x": "可能な範囲で協力してまいりたいと思っております。"}, {"t": 1327.6166666666666, "x": "……要請は、来たの？"}, {"t": 1329.05, "x": "私が調べた範囲の記録には、\nそのあとの話は出てこない。"}, {"t": 1332.8333333333333, "x": "この時点では、まだ海面を探している段階だった。"}, {"t": 1336.05, "x": "海底を探す段階に入ったのは、この1か月後だ。"}, {"t": 1339.3833333333334, "x": "そのころには、日本の部隊はもう引き上げていた。"}, {"t": 1342.3, "x": "同じ日、外務大臣もこう述べている。"}, {"t": 1344.6833333333334, "x": "マレーシア政府と緊密に連携しながら、\n同政府の要請を踏まえつつ、"}, {"t": 1348.85, "x": "できる限り協力をしていきたいと考えております。"}, {"t": 1351.9, "x": "日本が公式に関わったのは、ここまでだ。"}, {"t": 1355.2333333333333, "x": "この事件のあと、日本の国会で\n一つだけ、こういう質問が出ている。"}, {"t": 1359.6666666666667, "x": "どんな？"}, {"t": 1360.4333333333334, "x": "同じことが日本で起きたら、\nどうなるのか、という質問だ。"}, {"t": 1364.0166666666667, "x": "2014年4月9日、衆議院の国土交通委員会。"}, {"t": 1367.6, "x": "答えたのは航空局長だ。"}, {"t": 1369.4666666666667, "x": "読む。"}, {"t": 1370.0, "x": "まず、航空機が行方不明になった場合に、"}, {"t": 1372.5666666666666, "x": "国土交通省の羽田の事務所に\n東京救難調整本部というのが置かれまして、"}, {"t": 1377.2666666666667, "x": "これが、我が国が管轄します\nかなり広大な飛行情報区、"}, {"t": 1380.9666666666667, "x": "この中で捜索救難活動を\n実施するわけでございますけれども、"}, {"t": 1384.85, "x": "警察庁、消防庁、海上保安庁、防衛省と協力しながら\nそれを実施するということになっております。"}, {"t": 1391.3333333333333, "x": "役所を集めて、羽田で仕切るのね。"}, {"t": 1393.8333333333333, "x": "そのしくみ自体は、ちゃんとある。だが、\nそのあとが正直だ。"}, {"t": 1397.5833333333333, "x": "マレーシア航空機不明事案のように、\n航空機からの通信が途絶した状態でございますと、"}, {"t": 1402.8333333333333, "x": "航空機の位置特定に必要な\n情報というのが、なかなか取得できない。"}, {"t": 1407.3166666666666, "x": "……同じことになる、と。"}, {"t": 1408.85, "x": "局長は、こう締めている。"}, {"t": 1410.5333333333333, "x": "これは各国とも同じような課題を\n抱えている、ということでございます。"}, {"t": 1414.6, "x": "2014年の時点で、日本の役所はそう答えている。"}, {"t": 1418.0, "x": "飛行機が黙ってしまったら、\nどこの国でも同じことになる。"}, {"t": 1421.5833333333333, "x": "報告書も、まったく同じところを問題にしている。"}, {"t": 1424.7, "x": "この技術の時代に、国際的な航空界は、"}, {"t": 1427.65, "x": "現在の世代の商業用航空機の位置が\n常に把握されていることを、"}, {"t": 1431.6166666666666, "x": "旅行する人々に保証する必要がある。"}, {"t": 1434.1666666666667, "x": "そうでないことは、容認できない。"}, {"t": 1436.8333333333333, "x": "ここで、この報告書を作った\n人たちのことを話しておく。"}, {"t": 1440.55, "x": "マレーシアの役所が作ったんでしょう。"}, {"t": 1442.7333333333333, "x": "それだけではない。報告書の最初のほうに、\nこう書いてある。日本語に直す。"}, {"t": 1447.3, "x": "19人のマレーシア人と、7か国の7つの安全調査機関の"}, {"t": 1451.5, "x": "7人の公認代表者からなる、\n独立した国際的な調査団が、"}, {"t": 1455.8666666666666, "x": "マレーシアの運輸大臣によって設置された。"}, {"t": 1458.5333333333333, "x": "……7か国。"}, {"t": 1459.5333333333333, "x": "イギリス、オーストラリア、フランス、中国、\nアメリカ、インドネシア、シンガポールだ。"}, {"t": 1464.7833333333333, "x": "それぞれの国で、事故を調べる\n役所の代表が入っている。"}, {"t": 1468.4, "x": "中国が入ってるのは、乗客がいちばん多いからね。"}, {"t": 1471.7166666666667, "x": "フランスは、最初の部品が見つかった\nレユニオン島を持っている国だ。"}, {"t": 1475.6666666666667, "x": "アメリカは、機体を作った国。"}, {"t": 1477.55, "x": "イギリスは、エンジンを作った\n国と、衛星の会社の国だ。"}, {"t": 1481.35, "x": "報告書は、この事故について3回、文書を出している。"}, {"t": 1484.8, "x": "1回目が2014年4月9日の予備報告書。"}, {"t": 1488.1, "x": "この中で、国際民間航空機関に\nひとつ勧告を出している。"}, {"t": 1492.0833333333333, "x": "飛行機の位置をリアルタイムで追いかけるしくみを、"}, {"t": 1494.6833333333334, "x": "世界共通の決まりにすることを\n検討してほしい、という中身だ。"}, {"t": 1498.6, "x": "……消えて1か月で、もう出してるのね。"}, {"t": 1501.0, "x": "2回目が2015年3月8日。"}, {"t": 1503.1666666666667, "x": "失踪から1年の日に、事実だけを\nまとめた報告書を出している。"}, {"t": 1507.3666666666666, "x": "分析も、結論も、勧告も入っていない。"}, {"t": 1510.1666666666667, "x": "分かっていることだけを並べたものだ。"}, {"t": 1512.4333333333334, "x": "そして3回目が、2018年7月2日の最終報告書だ。"}, {"t": 1516.8166666666666, "x": "ちなみに、1回目の勧告は実った。"}, {"t": 1519.2833333333333, "x": "国際民間航空機関の理事会は、2016年と2017年に、"}, {"t": 1523.9, "x": "飛行機の位置を追いかける決まりを改めている。"}, {"t": 1526.6, "x": "……この事故のせいで、世界の決まりが変わったのね。"}, {"t": 1529.5833333333333, "x": "原因は分からないままだが、決まりのほうは動いた。"}, {"t": 1533.1833333333334, "x": "話を海へ戻す。"}, {"t": 1534.5, "x": "機体が消えてから1年4か月あまり。"}, {"t": 1536.75, "x": "2015年7月29日だ。"}, {"t": 1539.1333333333334, "x": "アフリカの東、インド洋に浮かぶ\nレユニオン島という島がある。"}, {"t": 1542.8, "x": "フランスの島ね。"}, {"t": 1544.1166666666666, "x": "その島のサンドニという町で、浜に\n打ち上げられた大きな部品が見つかった。"}, {"t": 1548.6, "x": "フラッペロンという、翼のうしろに付いている板だ。"}, {"t": 1551.6833333333334, "x": "……370便のもの？"}, {"t": 1553.45, "x": "その年の9月3日、フランスの司法当局が、\nMH370のものであると確認した。"}, {"t": 1559.25, "x": "報告書には、そう書いてある。"}, {"t": 1561.1666666666667, "x": "消えてから、初めて出てきた確かな物だ。"}, {"t": 1563.9166666666667, "x": "そのあとも、部品は出てくる。"}, {"t": 1565.8, "x": "2016年5月10日、モーリシャスのイロ・\nベルナッシュという場所で、左の外側のフラップ。"}, {"t": 1571.6833333333334, "x": "2016年6月20日、タンザニアの東にある\nペンバ島で、右の外側のフラップ。"}, {"t": 1577.1833333333334, "x": "この3つが、公式に「確実にMH370のもの」と\n確認された部品だ。"}, {"t": 1582.6666666666667, "x": "3つだけ？"}, {"t": 1583.65, "x": "3つだけだ。ここは、はっきり言っておきたい。"}, {"t": 1587.0333333333333, "x": "報告書には、調べた漂着物の一覧が載っている。"}, {"t": 1590.4666666666667, "x": "2018年7月の報告書の時点で、27点だ。"}, {"t": 1594.3666666666666, "x": "それを5つの段階に分けている。"}, {"t": 1596.35, "x": "確認済みが3点。ほぼ確実が7点。"}, {"t": 1598.95, "x": "可能性が高いが8点。"}, {"t": 1600.6, "x": "可能性があるが2点。そして、\n識別できないものが7点。"}, {"t": 1604.4833333333333, "x": "……はっきりしてるのは、やっぱり3点なのね。"}, {"t": 1607.2166666666667, "x": "この一覧は、その年の12月30日に\n運輸省が更新している。"}, {"t": 1611.55, "x": "そのときは32点に増えた。だが、\n確認済みは3点のまま変わっていない。"}, {"t": 1616.2666666666667, "x": "見つかった場所は、レユニオン島、\nモザンビーク、南アフリカ、"}, {"t": 1620.0333333333333, "x": "モーリシャス、タンザニア、マダガスカルだ。"}, {"t": 1622.6666666666667, "x": "……全部、アフリカの東側ね。"}, {"t": 1624.8, "x": "インド洋の海流に乗って、西へ流れてきた形になる。"}, {"t": 1628.25, "x": "報告書は、その3点から何が言えるかも書いている。"}, {"t": 1631.5, "x": "回収された右の外側のフラップの損傷の検査は、"}, {"t": 1634.8166666666666, "x": "右のフラッペロンに見つかった損傷と\n合わせて、次の結論に至った。"}, {"t": 1639.0666666666666, "x": "右の外側のフラップは、翼から分離した\n時点でおそらく格納位置にあり、"}, {"t": 1643.6666666666667, "x": "右のフラッペロンは、おそらく\n中立位置かそれに近い位置にあった。"}, {"t": 1647.6666666666667, "x": "格納位置って？"}, {"t": 1648.8833333333334, "x": "しまわれたまま、ということだ。"}, {"t": 1650.7333333333333, "x": "着陸するときは、この板を出して、\nゆっくり降りられるようにする。"}, {"t": 1654.6166666666666, "x": "それが、しまわれたままだった。"}, {"t": 1656.6833333333334, "x": "……降りようとしていたのではない、ということ？"}, {"t": 1659.1166666666666, "x": "報告書はそこまでしか書いていない。"}, {"t": 1661.1, "x": "私もそこまでしか言わない。"}, {"t": 1662.9333333333334, "x": "客室の内装の破片も見つかっている。"}, {"t": 1665.4333333333334, "x": "報告書は、機体が分解した可能性が\n高い、と書いたうえで、こう続ける。"}, {"t": 1670.0833333333333, "x": "ただし、機体が空中で分解したのか、\n海面への衝突時に分解したのかを判定するには、"}, {"t": 1675.7666666666667, "x": "情報が足りない。"}, {"t": 1677.5166666666667, "x": "報告書が出たのは、2018年7月2日だ。"}, {"t": 1680.9333333333334, "x": "消えてから、4年4か月近くたっている。"}, {"t": 1683.6333333333334, "x": "ページ数は495ページ。"}, {"t": 1685.8, "x": "……厚いのね。"}, {"t": 1686.7333333333333, "x": "その結論の部分を、順に読む。"}, {"t": 1688.75, "x": "日本語に直したものだ。"}, {"t": 1690.4, "x": "機体が提出された飛行計画の経路から外れた\n理由を、確実性をもって特定するには、"}, {"t": 1695.9333333333334, "x": "調査団が利用できる証拠が著しく\n不足していることを認めなければならない。"}, {"t": 1700.55, "x": "ただし、飛行経路の変化は、\n手動での入力によって生じた可能性が高い。"}, {"t": 1705.4, "x": "……手で操作した、と。"}, {"t": 1706.8833333333334, "x": "報告書が踏み込んだのは、ここまでだ。"}, {"t": 1709.15, "x": "誰がやったかは書いていない。"}, {"t": 1710.85, "x": "続きを読む。"}, {"t": 1711.75, "x": "機体の残骸の検査と、記録された\n飛行データの情報が得られない以上、"}, {"t": 1715.9833333333333, "x": "調査は、観測された各系統の停止、\n提出された飛行計画の経路からの逸脱、"}, {"t": 1721.45, "x": "およびその後に機体がとった\n飛行経路をもたらすような、"}, {"t": 1724.5666666666666, "x": "もっともらしい機体または系統の故障の様式を、\n特定することができなかった。"}, {"t": 1729.3166666666666, "x": "ただし、同じ証拠の不足は、その可能性を\n決定的に排除することも、調査に許さなかった。"}, {"t": 1735.4, "x": "第三者による介入の可能性も、排除できない。"}, {"t": 1738.6, "x": "……全部、排除できない、で終わってるのね。"}, {"t": 1741.2333333333333, "x": "そして、本文の443ページ目。"}, {"t": 1743.85, "x": "結論の、いちばん最後の1行だ。"}, {"t": 1746.2, "x": "結論として、調査団はMH370が消えた\n本当の原因を特定することができない。"}, {"t": 1751.8833333333334, "x": "……それで、終わり。"}, {"t": 1753.0833333333333, "x": "495ページ使って、その1行で終わっている。"}, {"t": 1757.1, "x": "報告書には、もう一つ、私が引っかかった一文がある。"}, {"t": 1761.0, "x": "なに？"}, {"t": 1761.6333333333334, "x": "報告書の中に、こう書いてある。"}, {"t": 1763.75, "x": "239人はまだ行方不明である。"}, {"t": 1766.3833333333334, "x": "……行方不明。"}, {"t": 1767.3833333333334, "x": "亡くなった、とは書いていない。"}, {"t": 1769.1833333333334, "x": "機体が見つかっていない以上、\n報告書は死亡を書けないんだ。"}, {"t": 1772.6833333333334, "x": "だから私も、この回では最後まで\n「行方が分かっていない」と言ってきた。"}, {"t": 1777.3, "x": "……12年たっても、まだそう書くのね。"}, {"t": 1779.7666666666667, "x": "報告書の書き出しには、献辞がある。"}, {"t": 1782.15, "x": "本を誰かに捧げる、あの言葉だ。日本語に直す。"}, {"t": 1785.4666666666667, "x": "この報告書は、2014年3月8日にMH370で"}, {"t": 1789.4, "x": "行方不明となった239人の乗客と乗員の記憶に捧げる。"}, {"t": 1793.6666666666667, "x": "彼らは家族、友人、同僚によって、永遠に\n惜しまれるが、決して忘れられることはない。"}, {"t": 1799.2, "x": "……最初のページに、それが書いてあるのね。"}, {"t": 1801.7333333333333, "x": "495ページの、いちばん前だ。"}, {"t": 1804.2333333333333, "x": "この報告書を作った人たちが、何を\n目的にしていたかが、そこに出ていると思う。"}, {"t": 1809.4166666666667, "x": "原因を当てることではなく、記録を残すことだ。"}, {"t": 1812.3666666666666, "x": "当てられなかったことは、\n最後の1行に正直に書いてある。"}, {"t": 1815.8833333333334, "x": "だが、残すべきものは495ページ分残した。"}, {"t": 1819.4833333333333, "x": "……それはそれで、仕事をしたのね。"}, {"t": 1821.6333333333334, "x": "私はそう思う。"}, {"t": 1823.4, "x": "ここから先が、この回の本当の山場だ。"}, {"t": 1826.2666666666667, "x": "まだ続くの？"}, {"t": 1827.3333333333333, "x": "続く。まず、最初の捜索がどこで終わったかを話す。"}, {"t": 1830.8333333333333, "x": "2014年3月8日から2017年1月17日まで。1,046日間。"}, {"t": 1836.3833333333334, "x": "このうち、海面を船と飛行機で探した日数が52日だ。"}, {"t": 1840.2833333333333, "x": "海の底の地形を測った面積が、71万平方キロメートル。"}, {"t": 1844.4833333333333, "x": "音で細かく見ていった面積が、\n12万平方キロメートル以上。"}, {"t": 1848.3833333333334, "x": "これはオーストラリアの機関が主導した分だ。"}, {"t": 1851.1, "x": "……それでも、見つからないのね。"}, {"t": 1853.0666666666666, "x": "2017年1月17日。"}, {"t": 1855.1666666666667, "x": "最後の捜索船が、海中の捜索区域を離れた。"}, {"t": 1858.6666666666667, "x": "その日、マレーシア、オーストラリア、\n中国の3か国が、共同で声明を出している。"}, {"t": 1863.9, "x": "3か国？"}, {"t": 1864.8833333333334, "x": "マレーシアの運輸相、オーストラリアのインフラ・\n運輸相、中国の交通運輸相。"}, {"t": 1869.5833333333333, "x": "大臣3人が、一枚の紙に名前を並べている。"}, {"t": 1872.7833333333333, "x": "中身を読む。日本語に直したものだ。"}, {"t": 1875.2, "x": "本日、最後の捜索船が海中の捜索区域を離れた。"}, {"t": 1879.0666666666666, "x": "マレーシア航空MH370便は、\n南インド洋の12万平方キロメートルの"}, {"t": 1883.9833333333333, "x": "海中捜索区域において発見されなかった。"}, {"t": 1886.85, "x": "利用できる最良の科学、最先端の技術、"}, {"t": 1889.8166666666666, "x": "そしてそれぞれの分野で最高の、\nきわめて高い技能をもつ専門家による"}, {"t": 1894.1666666666667, "x": "モデル化と助言を用いたあらゆる努力にもかかわらず、"}, {"t": 1897.1833333333334, "x": "残念ながら、捜索は機体を\n発見することができなかった。"}, {"t": 1900.9666666666667, "x": "よって、MH370の海中捜索は中止された。"}, {"t": 1904.6666666666667, "x": "……中止。"}, {"t": 1905.4, "x": "そのすぐあとに、この一文が来る。"}, {"t": 1907.55, "x": "海中捜索を中止するというこの決定は、"}, {"t": 1910.2166666666667, "x": "軽々しく、また悲しみなしに下されたものではない。"}, {"t": 1913.6166666666666, "x": "……役所の文書よね、これ。"}, {"t": 1915.45, "x": "役所の文書だ。3人の大臣が署名した公式の声明だ。"}, {"t": 1919.3833333333334, "x": "そこに、悲しみなしに\n下されたものではない、と書いてある。"}, {"t": 1922.8833333333334, "x": "この決定自体は、前の年の7月に、3か国の大臣が\n集まって決めた方針に沿ったものだ。"}, {"t": 1929.0333333333333, "x": "急に止めたのではない。"}, {"t": 1930.2666666666667, "x": "半年かけて、その日を迎えている。"}, {"t": 1932.7, "x": "声明は、こう締められている。"}, {"t": 1934.483 : 2055.75, "x": "失踪からちょうど12年の日だ。"}, {"t": 2057.8333333333335, "x": "マレーシアの運輸省が、遺族に向けて\n文書を出した。この回の冒頭で読んだものだ。"}, {"t": 2062.7, "x": "実施された捜索活動は、機体の残骸の位置を\n確認できるいかなる発見ももたらしていない。"}, {"t": 2068.4, "x": "文書はこう締められている。"}, {"t": 2069.9666666666667, "x": "政府は引き続き遺族に情報を伝えることに\n尽力し、適宜、更新を提供していく。"}, {"t": 2075.366666666667, "x": "……12年目の3月8日に、それを出したのね。"}, {"t": 2078.4333333333334, "x": "毎年その日に、何かを出している。"}, {"t": 2080.733333333333, "x": "この年に出せたのは、\n見つからなかった、という報告だった。"}, {"t": 2085.1, "x": "同じ日、探していた会社のほうも声明を出している。"}, {"t": 2088.3333333333335, "x": "2026年3月8日。"}, {"t": 2090.2, "x": "日本語に直して読む。"}, {"t": 2091.733333333333, "x": "2026年1月23日、オーシャン・インフィニティは、"}, {"t": 2095.5, "x": "MH370を見つけるための最新の取り組みを終えて、\nインド洋の捜索区域を離れた。"}, {"t": 2100.9666666666667, "x": "2018年にこの任務に初めて乗り出して\n以来、同社は海上で151日を過ごし、"}, {"t": 2106.516666666667, "x": "14万平方キロメートルを超える海底を地図化してきた。"}, {"t": 2109.883333333333, "x": "そして、社長の言葉が続く。"}, {"t": 2112.016666666667, "x": "利用できるあらゆる情報とデータを生かして\n戻ることが、私たちにとって重要だった。"}, {"t": 2116.983333333333, "x": "しかしそれだけの努力にもかかわらず、\n私たちはそれを見つけることができなかった。"}, {"t": 2122.0333333333333, "x": "……見つからなかった。"}, {"t": 2123.3333333333335, "x": "ここからだ。私がこの回で\nいちばん置きたかった言葉は、この先にある。"}, {"t": 2127.75, "x": "少なくとも一つ、私たちは自信をもってこう言える。"}, {"t": 2131.116666666667, "x": "それは、私たちが探した場所には無い。"}, {"t": 2133.8166666666666, "x": "……探した場所には、無い。"}, {"t": 2135.5333333333333, "x": "見つからなかった、ではないんだ。"}, {"t": 2137.5333333333333, "x": "探した場所には無い、と言い切れるようになった。"}, {"t": 2140.233333333333, "x": "社長はこう続けている。"}, {"t": 2141.75, "x": "それには意味がある。それは明確さをもたらし、"}, {"t": 2144.4666666666667, "x": "証拠を研究し続ける人々が考えを研ぎ澄まし、"}, {"t": 2147.6666666666665, "x": "今後の捜索戦略を形づくるのを助けるだろう。"}, {"t": 2150.9166666666665, "x": "……無かった場所が分かるのも、前に進むことなのね。"}, {"t": 2154.116666666667, "x": "14万平方キロを、消しこんだということだ。"}, {"t": 2156.9, "x": "そして、声明はこう終わる。"}, {"t": 2158.65, "x": "捜索のこの段階は終わったが、\n私たちの関与は終わっていない。"}, {"t": 2162.5833333333335, "x": "状況が許せば戻れることを願って、\nマレーシア政府と協力を続けている。"}, {"t": 2167.0333333333333, "x": "2026年6月29日、マレーシアの内閣は、\nこの協定を1年延ばすことに同意した。"}, {"t": 2173.0833333333335, "x": "2027年6月30日までだ。"}, {"t": 2175.6, "x": "条件は変わっていない。"}, {"t": 2176.9333333333334, "x": "見つからなければ報酬なし。"}, {"t": 2178.766666666667, "x": "運輸相の声明を読む。"}, {"t": 2180.233333333333, "x": "この決定は、MH370便の乗客の遺族に\n区切りをもたらすという、"}, {"t": 2184.7833333333333, "x": "政府の継続的で揺るぎない関与の表れである。"}, {"t": 2187.7, "x": "延ばした理由も書いてある。まだ\n調べ終えていない区域が残っているからだ。"}, {"t": 2191.866666666667, "x": "その面積は、7,428.54平方キロメートル。"}, {"t": 2196.133333333333, "x": "……小数点まで出てるのね。"}, {"t": 2197.85, "x": "そこまで細かく区切って、残りを数えている。"}, {"t": 2200.65, "x": "ただし、次にいつ船が出るかは、\n2026年9月のこの時点で決まっていない。"}, {"t": 2205.7, "x": "私が調べた範囲では、\n日程の発表は見つからなかった。"}, {"t": 2209.5666666666666, "x": "……まだ、途中なのね。"}, {"t": 2211.0666666666666, "x": "途中だ。この回は、終わった事件の話ではない。"}, {"t": 2214.2166666666667, "x": "今日ここまで話したのは、2026年9月までに\n公に出ているものだけだ。"}, {"t": 2219.0833333333335, "x": "報告書はマレーシア運輸省のサイトに置いてある。"}, {"t": 2221.6666666666665, "x": "495ページ、誰でも読める。"}, {"t": 2224.133333333333, "x": "自衛隊の記録は防衛省のページに、\n国会の答弁は国会会議録検索システムにある。"}, {"t": 2229.5833333333335, "x": "残り7,428平方キロメートル。\nそこに在るのか、それとも別の場所なのか。"}, {"t": 2235.1, "x": "それが分かる日が来たら、私はもう一度この話をする。"}, {"t": 2238.5833333333335, "x": "この回で気になったところがあれば、\nコメントに書いてもらえるとうれしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
