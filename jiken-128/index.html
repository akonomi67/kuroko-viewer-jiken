<script>
const D={"name": "128", "file": "128_編集用", "dur": 2058.5, "segs": [], "subs": [{"t": 0.0, "x": "1945年8月15日の正午。"}, {"t": 2.966666666666667, "x": "日本中のラジオから昭和天皇の声が流れた。"}, {"t": 5.8, "x": "玉音放送と呼ばれる放送だ。"}, {"t": 7.85, "x": "あの声はその場で話したものではない。"}, {"t": 10.066666666666666, "x": "前の晩に、円盤に録音しておいたものだ。"}, {"t": 12.916666666666666, "x": "録音だったの？"}, {"t": 14.15, "x": "そうだ。録音は2回行われている。"}, {"t": 16.5, "x": "放送に使われたのは2回目の盤だった。"}, {"t": 19.05, "x": "その2回目の盤は全部で5枚ある。"}, {"t": 21.316666666666666, "x": "5枚？　1枚じゃないのね。"}, {"t": 23.15, "x": "2枚組と3枚組。2セットで計5枚だ。"}, {"t": 26.066666666666666, "x": "これは宮内庁が平成27年に公表した数字だ。"}, {"t": 29.45, "x": "同じ年、宮内庁はその原盤を70年ぶりに再生した。"}, {"t": 33.233333333333334, "x": "そして昭和天皇の声を原盤から\n取り出すことに成功している。"}, {"t": 37.11666666666667, "x": "70年も、しまってあったってこと？"}, {"t": 39.6, "x": "大切に保管されてきた、と宮内庁は書いている。"}, {"t": 42.666666666666664, "x": "だがその5枚が無事だったのは当たり前ではない。"}, {"t": 45.333333333333336, "x": "放送の前の晩、この円盤を\n探して兵が皇居に入っている。"}, {"t": 49.166666666666664, "x": "兵が？　何のために？"}, {"t": 50.766666666666666, "x": "放送を止めるためだ。"}, {"t": 52.15, "x": "その夜の出来事は、のちに宮城事件と呼ばれる。"}, {"t": 55.233333333333334, "x": "宮城は当時の皇居の呼び名だ。"}, {"t": 57.21666666666667, "x": "今回はその一晩を、5枚の円盤の側から追っていく。"}, {"t": 60.63333333333333, "x": "どこで録られ、どこに隠され、\nどうやって放送に間に合ったのか。"}, {"t": 64.53333333333333, "x": "円盤が主役なのね。"}, {"t": 66.11666666666666, "x": "そうだ。人の思いの良し悪しはこの回では決めない。"}, {"t": 69.16666666666667, "x": "残った記録で物の動きを順に見ていく。"}, {"t": 72.31666666666666, "x": "時計を前の日の8月14日に戻す。"}, {"t": 74.91666666666667, "x": "宮内庁がまとめた昭和天皇実録という記録がある。"}, {"t": 78.15, "x": "天皇の一日を時刻つきで書いた公式の記録だ。"}, {"t": 81.36666666666666, "x": "それによると、この日の午前11時2分。"}, {"t": 83.98333333333333, "x": "天皇は御文庫を出て御前会議に臨んだ。"}, {"t": 86.6, "x": "御文庫って？"}, {"t": 87.58333333333333, "x": "皇居の中にあった天皇の防空用の住まいだ。"}, {"t": 90.38333333333334, "x": "会議の場所はそのそばの御文庫附属庫。"}, {"t": 92.78333333333333, "x": "陸軍が防空用に造り、宮内省に引き継いだ施設だ。"}, {"t": 96.31666666666666, "x": "4日前の8月10日にも、ここで\n重要な会議が開かれている。"}, {"t": 100.41666666666667, "x": "同じ場所で2回目の会議ってこと？"}, {"t": 102.71666666666667, "x": "そうなる。"}, {"t": 103.4, "x": "この日の会議で、天皇は\n前の決断に変わりはないと述べた。"}, {"t": 107.08333333333333, "x": "連合国の回答を受け入れて\n戦争を終えるという決断だ。"}, {"t": 110.41666666666667, "x": "そしてもう一つ、実録はこう書いている。"}, {"t": 113.05, "x": "自分がマイクの前に立って国民に伝えてもよい。"}, {"t": 116.1, "x": "自分で話すってこと？"}, {"t": 117.71666666666667, "x": "そうだ。これが録音の始まりになる。"}, {"t": 120.03333333333333, "x": "会議は正午の手前、11時55分に終わった。"}, {"t": 123.18333333333334, "x": "天皇は御文庫へ戻っている。"}, {"t": 124.91666666666667, "x": "ここから日付が変わるまでの半日がある。"}, {"t": 127.41666666666667, "x": "その半日で言葉を文にして、\n声にしなければならない。"}, {"t": 130.95, "x": "半日って、すごく短くない？"}, {"t": 133.2, "x": "短い。しかも文の中身はまだ固まっていなかった。"}, {"t": 137.08333333333334, "x": "ここで一日前に話を戻しておく。"}, {"t": 139.46666666666667, "x": "8月13日の夜、陸軍大臣の官邸を\n6人の将校が訪ねている。"}, {"t": 144.25, "x": "陸軍省の軍事課と軍務課の将校たちだ。"}, {"t": 147.01666666666668, "x": "畑中少佐、椎崎中佐、井田中佐も\nこの6人に入っていた。"}, {"t": 151.36666666666667, "x": "何を持って行ったの？"}, {"t": 152.78333333333333, "x": "兵力使用計画と名付けた案だ。"}, {"t": 154.98333333333332, "x": "東部軍と近衛第一師団を\n使って、皇居を外から切り離す。"}, {"t": 158.96666666666667, "x": "政府の要人を押さえて戦争を続ける。\nそういう中身だったとされる。"}, {"t": 163.06666666666666, "x": "それを陸軍大臣に頼んだの？"}, {"t": 165.2, "x": "賛成してほしいと迫った。"}, {"t": 166.96666666666667, "x": "阿南惟幾 陸軍大臣は、参謀総長と\n会ってから決めると答えたとされる。"}, {"t": 171.93333333333334, "x": "そして14日の午前7時、大臣は\n梅津美治郎 参謀総長と会った。"}, {"t": 176.61666666666667, "x": "参謀総長は計画に反対し、大臣も\nそれに同じたと伝えられている。"}, {"t": 181.18333333333334, "x": "じゃあ計画はそこで消えたのね。"}, {"t": 183.18333333333334, "x": "上の人の賛成を得る道は、そこで消えた。"}, {"t": 185.93333333333334, "x": "残ったのは上を通さずに部隊を動かす道だ。"}, {"t": 188.83333333333334, "x": "上を通さずに……。"}, {"t": 189.96666666666667, "x": "その道の入り口が、近衛第一師団の師団長室だった。"}, {"t": 193.66666666666666, "x": "だがそれは夜になってからの話だ。"}, {"t": 195.91666666666666, "x": "昼の御前会議のあと、まず\n動き出したのは詔書のほうだった。"}, {"t": 200.21666666666667, "x": "天皇が読み上げる文を詔書という。"}, {"t": 202.26666666666668, "x": "その日の午後、内閣は\nこの詔書の文を閣議で直していた。"}, {"t": 206.05, "x": "直していた？　もう書いてあったんじゃないの？"}, {"t": 208.55, "x": "下書きはあった。だが閣議で修正と追加が入った。"}, {"t": 211.88333333333333, "x": "いまその原本は国立公文書館にある。"}, {"t": 214.45, "x": "館の説明では、書き直す時間が無かったとされている。"}, {"t": 217.85, "x": "だから直した場所は、紙を\n貼ったり書き込んだりしてある。"}, {"t": 221.16666666666666, "x": "普段の詔書ではまずやらない直し方だそうだ。"}, {"t": 224.03333333333333, "x": "それだけ急いでたのね。"}, {"t": 225.63333333333333, "x": "実録によると午後8時32分。"}, {"t": 227.98333333333332, "x": "鈴木貫太郎 首相が御文庫に詔書を持って参上した。"}, {"t": 231.53333333333333, "x": "天皇がそれに署名したのは午後9時20分。"}, {"t": 234.23333333333332, "x": "そして午後11時、詔書は\n官報号外に載って発せられた。"}, {"t": 238.05, "x": "じゃあその時点で国民にも知らされたの？"}, {"t": 240.58333333333334, "x": "そこが分かれ目だ。"}, {"t": 241.75, "x": "国内への公表は、翌日の正午の放送まで待たされた。"}, {"t": 245.4, "x": "紙の上ではもう出ている。"}, {"t": 246.85, "x": "だが国民が知るのは声が流れたときだ。"}, {"t": 249.51666666666668, "x": "じゃあ放送が止まったら……。"}, {"t": 251.1, "x": "国民はまだ知らないままになる。"}, {"t": 253.03333333333333, "x": "止めたい人たちが狙ったのは、まさにそこだった。"}, {"t": 256.0833333333333, "x": "紙ではなく声のほうだ。"}, {"t": 257.6, "x": "その声を入れる道具がここで運び込まれる。"}, {"t": 260.68333333333334, "x": "放送協会に話が来たのは、\nこの日の昼過ぎだとされる。"}, {"t": 264.35, "x": "会長が情報局に呼ばれ、急いで\n準備をするよう言われた。"}, {"t": 267.8333333333333, "x": "天皇が直接放送することになるかも\nしれない、という知らせだ。"}, {"t": 271.8333333333333, "x": "その日の昼に言われて、その日の夜に録るの？"}, {"t": 274.76666666666665, "x": "そうなる。準備の時間は半日も無かった。"}, {"t": 277.51666666666665, "x": "録音を受け持ったのは日本放送協会。いまのNHKだ。"}, {"t": 281.21666666666664, "x": "技術の職員たちが宮内省へ機材を持ち込んだ。"}, {"t": 284.31666666666666, "x": "どんな機械だったの？"}, {"t": 285.78333333333336, "x": "円盤に溝を刻んで音を記録する機械だ。"}, {"t": 288.4, "x": "型の名前はDP-17-K。"}, {"t": 290.1666666666667, "x": "持ち運びのできる型だった。"}, {"t": 292.0833333333333, "x": "ここで一つ大事な数字がある。"}, {"t": 294.01666666666665, "x": "当時の円盤は、片面に約3分しか録れなかった。"}, {"t": 297.5, "x": "3分？　放送はもっと長かったんじゃない？"}, {"t": 300.15, "x": "詔書を読むと3分では収まらない。"}, {"t": 302.26666666666665, "x": "だから前半と後半に分けて別の盤に録った。"}, {"t": 305.31666666666666, "x": "それで1回の録音でも何枚かになるのね。"}, {"t": 308.1166666666667, "x": "そういうことだ。"}, {"t": 309.1166666666667, "x": "宮内庁の言う「2枚組」「3枚組」も、\nこの事情と関わっている。"}, {"t": 313.5, "x": "1つの朗読が何枚かの円盤にまたがっているわけだ。"}, {"t": 316.93333333333334, "x": "じゃあ1枚でも欠けたら……。"}, {"t": 318.5833333333333, "x": "放送は途中で切れてしまう。"}, {"t": 320.3333333333333, "x": "5枚はどれも替えのきかない部品だった。"}, {"t": 322.8, "x": "部品、ね。"}, {"t": 323.8333333333333, "x": "同じ型の録音機と録音に使われた\n円盤は、いまも見ることができる。"}, {"t": 328.15, "x": "東京の愛宕山にあるNHK放送博物館だ。"}, {"t": 331.43333333333334, "x": "展示されている円盤は、放送に\n使われなかった方の盤とされている。"}, {"t": 335.7, "x": "使われなかった方？"}, {"t": 337.23333333333335, "x": "1回目の録音の盤だ。"}, {"t": 338.8833333333333, "x": "2回目の正本は宮内庁の手元にある。"}, {"t": 342.0, "x": "午後11時25分。"}, {"t": 343.5, "x": "天皇は御文庫を出て、宮内省の内廷庁舎へ向かった。"}, {"t": 346.8666666666667, "x": "これも実録に書かれている時刻だ。"}, {"t": 349.21666666666664, "x": "御文庫とは別の建物なのね。"}, {"t": 351.3333333333333, "x": "別の建物だ。宮内省の庁舎の中の一室で\n録音が行われた。"}, {"t": 355.6666666666667, "x": "部屋には放送協会が組んだマイクが置かれていた。"}, {"t": 358.53333333333336, "x": "天皇はそのマイクの前で詔書を読み上げた。"}, {"t": 361.0833333333333, "x": "そして、もう一度読み上げた。"}, {"t": 363.0833333333333, "x": "やり直したってこと？"}, {"t": 364.56666666666666, "x": "2回にわたって朗読した、と記録は書いている。"}, {"t": 367.5, "x": "なぜ2回になったかは、資料によって言い方が違う。"}, {"t": 370.6166666666667, "x": "この回では理由は決めないでおく。"}, {"t": 372.55, "x": "確かなのは2回目の盤が正本になったことだ。"}, {"t": 375.6, "x": "1回目の盤も捨てなかったのよね。"}, {"t": 377.9, "x": "捨てていない。それがあとで役に立つ。"}, {"t": 380.1666666666667, "x": "天皇が御文庫に戻ったのは、15日の午前0時5分。"}, {"t": 383.68333333333334, "x": "日付はもう8月15日に変わっていた。"}, {"t": 386.3, "x": "実録はそのあと、午前0時50分に休んだと書いている。"}, {"t": 390.0833333333333, "x": "日付が変わった時点で、放送まであと12時間ね。"}, {"t": 393.46666666666664, "x": "ちょうど12時間だ。"}, {"t": 394.76666666666665, "x": "この12時間のあいだ、5枚の円盤をどこに置くか。"}, {"t": 397.9166666666667, "x": "それがこの夜の一番の問題になった。"}, {"t": 400.48333333333335, "x": "どこに置いたの？"}, {"t": 401.6, "x": "答えは宮内省の建物の中だ。"}, {"t": 404.43333333333334, "x": "録音が終わったあと、円盤は放送協会の手を離れた。"}, {"t": 407.9, "x": "受け取ったのは徳川義寛 侍従だと伝えられている。"}, {"t": 411.4, "x": "侍従って、天皇のそばで仕える人よね。"}, {"t": 414.21666666666664, "x": "そうだ。"}, {"t": 414.8333333333333, "x": "円盤は皇后宮職という部署の事務室に運ばれた。"}, {"t": 418.0, "x": "皇后のお世話をする役所の部屋だ。"}, {"t": 420.1, "x": "そこにあった小さな金庫にしまわれたとされている。"}, {"t": 423.1, "x": "小さな金庫？　もっと厳重な場所じゃなくて？"}, {"t": 425.93333333333334, "x": "記録の言葉では軽金庫だ。"}, {"t": 427.8333333333333, "x": "持ち上げられそうなほどの\n金庫だった、ということになる。"}, {"t": 431.1333333333333, "x": "それ、見つかったら終わりじゃない。"}, {"t": 433.18333333333334, "x": "見つかれば終わりだ。"}, {"t": 434.3666666666667, "x": "だが目立たない場所でもあった。"}, {"t": 436.1666666666667, "x": "録音をした部屋とも、\n天皇の住まいとも違う部屋だからだ。"}, {"t": 439.9, "x": "探す人がまず思いつかない場所ってこと？"}, {"t": 442.6166666666667, "x": "そういう見方もできる。"}, {"t": 444.0, "x": "ここでもう一つ押さえておくことがある。"}, {"t": 446.2, "x": "録音を終えた人たちは、このあと\n宮内省を出て帰ろうとした。"}, {"t": 449.8333333333333, "x": "情報局総裁の下村宏と、放送協会の職員たちだ。"}, {"t": 454.06666666666666, "x": "情報局って？"}, {"t": 455.3, "x": "政府の広報を受け持つ役所だ。"}, {"t": 457.3, "x": "下村はその長として録音に立ち会っていた。"}, {"t": 460.06666666666666, "x": "円盤を宮内省に残し、人だけが外へ出る。"}, {"t": 463.0, "x": "その帰り道で車が止められる。"}, {"t": 465.6666666666667, "x": "場所は坂下門のあたりだ。"}, {"t": 467.46666666666664, "x": "皇居の東側にある門で、宮内省の庁舎に近い。"}, {"t": 470.78333333333336, "x": "記録では、午前0時を過ぎたころとされている。"}, {"t": 473.7, "x": "止めたのは誰なの？"}, {"t": 475.06666666666666, "x": "皇居を守っていた近衛兵だ。"}, {"t": 476.9166666666667, "x": "近衛兵は天皇と皇居を守るための部隊だった。"}, {"t": 480.0, "x": "守る側の兵が止めたの？"}, {"t": 481.8, "x": "そうだ。下村たちは銃を向けられたと伝えられている。"}, {"t": 485.05, "x": "そして近くの守衛隊の建物に閉じ込められた。"}, {"t": 488.21666666666664, "x": "録音をした人たちが捕まったってこと？"}, {"t": 490.9, "x": "そうなる。"}, {"t": 491.6, "x": "兵たちが知りたかったのは円盤のありかだった。"}, {"t": 494.31666666666666, "x": "だが一行は円盤を持っていなかった。"}, {"t": 496.6, "x": "宮内省に置いてきたものね。"}, {"t": 498.46666666666664, "x": "置いてきたからこそ、ここで取られずに済んだ。"}, {"t": 501.1, "x": "持って帰っていたら、門で\n取り上げられていたかもしれない。"}, {"t": 504.45, "x": "……偶然なの？"}, {"t": 505.46666666666664, "x": "偶然かどうかはこの回では決めない。"}, {"t": 507.6, "x": "ただ、円盤と人が別々に\n動いたことは記録に残っている。"}, {"t": 511.4, "x": "この夜はずっとそうだ。"}, {"t": 512.8166666666667, "x": "円盤は動かず、人のほうが動いていく。"}, {"t": 515.4833333333333, "x": "じゃあ兵たちは、どうして止める側に回ったの？"}, {"t": 518.35, "x": "そのために別の建物で起きていたことを見る。"}, {"t": 521.0666666666667, "x": "皇居の北にある近衛第一師団の司令部だ。"}, {"t": 524.45, "x": "近衛兵を率いていたのが近衛第一師団だ。"}, {"t": 527.2166666666667, "x": "その師団長は森赳 中将。"}, {"t": 529.5666666666667, "x": "一番上の人ね。"}, {"t": 531.0166666666667, "x": "そうだ。近衛兵を動かすには、この人の命令がいる。"}, {"t": 534.35, "x": "この夜、その師団長室を陸軍省の将校たちが訪ねた。"}, {"t": 538.1666666666666, "x": "前の晩に陸軍大臣へ計画を持ち込んだ将校たちだ。"}, {"t": 541.7333333333333, "x": "何をしに来たの？"}, {"t": 543.05, "x": "戦争をやめる決定に従わない\n動きへの、加わりを求めに来た。"}, {"t": 547.05, "x": "その中に畑中健二 少佐と椎崎二郎 中佐がいた。"}, {"t": 550.8666666666667, "x": "井田正孝 中佐もこの夜の師団長室に来ている。"}, {"t": 554.3333333333334, "x": "師団長は、うんと言ったの？"}, {"t": 556.2333333333333, "x": "言っていない。"}, {"t": 557.0333333333333, "x": "森師団長は応じなかった、と\nのちの証言は伝えている。"}, {"t": 560.5166666666667, "x": "部屋にはもう一人いた。"}, {"t": 561.95, "x": "白石通教 中佐。森師団長の義理の弟にあたる人だ。"}, {"t": 566.0166666666667, "x": "別の用事で師団長室を訪れていた。"}, {"t": 568.6166666666667, "x": "たまたま居合わせたのね。"}, {"t": 570.2, "x": "そうだ。"}, {"t": 570.8166666666667, "x": "そしてこの部屋で、森師団長と\n白石中佐は命を奪われた。"}, {"t": 574.8666666666667, "x": "……え。"}, {"t": 575.3166666666667, "x": "誰が手を下したのかはこの回では言わない。"}, {"t": 577.8166666666667, "x": "証言に食い違いがあり、\n確かめられない人もいるからだ。"}, {"t": 581.2, "x": "確かなのは、師団に命令を出せる\n人がいなくなったことだ。"}, {"t": 584.95, "x": "命令を出せる人が、いない……。"}, {"t": 586.9, "x": "そしてその空いた場所に、紙が一枚置かれる。"}, {"t": 590.3, "x": "その紙は師団の命令書だ。"}, {"t": 592.1166666666667, "x": "番号は近作命甲第584号。"}, {"t": 594.8833333333333, "x": "防衛庁の戦史室が集めた\n資料に、その文面が残っている。"}, {"t": 598.8666666666667, "x": "中身は分かってるのね。"}, {"t": 600.4666666666667, "x": "分かっている。命令の時刻は\n8月15日の午前2時と書かれている。"}, {"t": 604.7166666666667, "x": "最初の項目はこうだ。"}, {"t": 606.25, "x": "「師団ハ敵ノ謀略ヲ破摧、天皇陛下ヲ奉持、\n我カ国体ヲ護持セントス」"}, {"t": 611.1, "x": "難しい言葉ね。"}, {"t": 612.4666666666667, "x": "敵のたくらみを打ち破り、天皇を守るという意味だ。"}, {"t": 615.55, "x": "全部で11項目ある。"}, {"t": 617.1666666666666, "x": "2つ目の項目が、この回にとって一番大事だ。"}, {"t": 620.3833333333333, "x": "近衛歩兵第一連隊は、約1つの中隊で\n東京放送局を占領せよ。"}, {"t": 625.1166666666667, "x": "そして放送を封じよ。"}, {"t": 626.7166666666667, "x": "放送局を押さえろってこと？"}, {"t": 628.6, "x": "そうだ。円盤を見つけられなくても、\n流す場所を押さえれば止められる。"}, {"t": 632.6333333333333, "x": "3つ目は、近衛歩兵第二連隊に\n皇居の吹上地区を守らせる命令だ。"}, {"t": 637.1166666666667, "x": "5つ目は二重橋の前で皇居の周りを遮断せよ。"}, {"t": 640.1333333333333, "x": "10番目は皇居の通信網を断て、という命令だった。"}, {"t": 643.4666666666667, "x": "電話も止めるのね。"}, {"t": 644.8333333333334, "x": "外と連絡させないということだ。"}, {"t": 646.9166666666666, "x": "残りの項目は、ほとんどが「待機せよ」だ。"}, {"t": 649.9333333333333, "x": "砲兵も工兵もその場で待てと書かれている。"}, {"t": 652.6666666666666, "x": "全部を動かすわけじゃないのね。"}, {"t": 654.6333333333333, "x": "動かすのは、皇居と放送局と通信に\n関わる部隊に絞られていた。"}, {"t": 658.9166666666666, "x": "円盤を探す。放送局を押さえる。電話を断つ。"}, {"t": 662.0333333333333, "x": "1枚の紙に全部が書き込まれていた。"}, {"t": 664.5333333333333, "x": "でも師団長は、もういないのよね。"}, {"t": 666.75, "x": "いない。そこがこの命令書の一番おかしなところだ。"}, {"t": 670.5, "x": "命令書の最後、11番目の項目はこうだ。"}, {"t": 673.4166666666666, "x": "「予ハ師団司令部ニ在リ」"}, {"t": 674.9833333333333, "x": "予って？"}, {"t": 675.75, "x": "自分のことだ。私は\n師団司令部にいる、という意味になる。"}, {"t": 679.3333333333334, "x": "そして命令書の名義は「近師長 森赳」。"}, {"t": 682.5166666666667, "x": "亡くなった人の名前で出されてるの？"}, {"t": 684.8333333333334, "x": "そうだ。森師団長の名前で偽の命令が出された。"}, {"t": 688.05, "x": "起案したのは畑中少佐とされている。"}, {"t": 690.4166666666666, "x": "命令は、師団の参謀だった\n古賀秀正 少佐から部隊へ伝えられた。"}, {"t": 694.9833333333333, "x": "受け取った部隊は疑わなかったの？"}, {"t": 697.25, "x": "多くの部隊は命令として受け取った。"}, {"t": 699.45, "x": "師団長の名前の命令に逆らうのは、軍では重いことだ。"}, {"t": 702.9833333333333, "x": "だが全部の部隊が動いたわけではない。"}, {"t": 705.35, "x": "動かなかった部隊があるの？"}, {"t": 707.15, "x": "ある。近衛騎兵連隊だ。"}, {"t": 708.9, "x": "命令書の6つ目は、戦車の中隊を\n代官町通へ進めよ、だった。"}, {"t": 713.3, "x": "この連隊の連隊長は命令を不審に思ったとされる。"}, {"t": 716.5, "x": "そして東部軍の司令部に\n問い合わせ、出動を見合わせた。"}, {"t": 720.0166666666667, "x": "問い合わせるだけで止まったのね。"}, {"t": 721.9833333333333, "x": "紙1枚で動く軍隊は、紙1枚を疑う人がいれば止まる。"}, {"t": 725.8166666666667, "x": "この夜は、その疑いが少しずつ広がっていく。"}, {"t": 728.85, "x": "だが午前2時の時点では、まだ間に合っていない。"}, {"t": 731.6666666666666, "x": "近衛歩兵第二連隊は、命令どおりに\n皇居の門を閉じていった。"}, {"t": 736.15, "x": "門が閉じられ、皇居は外から切り離された。"}, {"t": 738.9833333333333, "x": "宮内省では電話線が切られたと記録されている。"}, {"t": 741.9833333333333, "x": "命令書の10番目ね。"}, {"t": 743.55, "x": "そうだ。"}, {"t": 744.15, "x": "皇居の警備をしていた皇宮警察も、\n武器を取り上げられた。"}, {"t": 747.8333333333334, "x": "警察まで？"}, {"t": 748.8833333333333, "x": "中で止められる人を先に減らしたということだ。"}, {"t": 751.7333333333333, "x": "こうして宮内省の建物は兵に囲まれた。"}, {"t": 754.4, "x": "建物の中には何人もの人がまだ残っていた。"}, {"t": 757.4833333333333, "x": "宮内大臣の石渡荘太郎。"}, {"t": 759.2333333333333, "x": "内大臣の木戸幸一。"}, {"t": 760.8666666666667, "x": "侍従や宮内省の職員たち。"}, {"t": 762.8833333333333, "x": "内大臣って、どんな役目なの？"}, {"t": 765.15, "x": "天皇のそばで政治の相談を受ける役目だ。"}, {"t": 767.8, "x": "戦争をやめる流れの中で、\n大きな役を果たした一人とされている。"}, {"t": 771.9666666666667, "x": "じゃあ兵たちに狙われる側ね。"}, {"t": 773.9166666666666, "x": "そう見られていた。"}, {"t": 775.0333333333333, "x": "外とつながる電話は切れている。"}, {"t": 776.9333333333333, "x": "助けを呼ぶことも、外の様子を聞くこともできない。"}, {"t": 780.2333333333333, "x": "建物ごと閉じ込められたのね。"}, {"t": 782.3166666666667, "x": "そうだ。"}, {"t": 782.9333333333333, "x": "そしてこの建物のある\n部屋の小さな金庫に、5枚の円盤がある。"}, {"t": 787.0166666666667, "x": "兵たちは、そこにあるって知ってたの？"}, {"t": 789.4666666666667, "x": "最初は知らなかった。"}, {"t": 790.85, "x": "知ったきっかけは別の場所で起きていた。"}, {"t": 793.1833333333333, "x": "命令書にあった放送局のほうだ。"}, {"t": 795.95, "x": "放送局は内幸町の放送会館にあった。"}, {"t": 798.9333333333333, "x": "命令どおり、近衛兵の中隊がそこを押さえた。"}, {"t": 801.75, "x": "放送会館の職員は閉じ込められたとされる。"}, {"t": 804.6833333333333, "x": "放送局の人なら、円盤のありかを知ってたかも。"}, {"t": 807.9666666666667, "x": "そこだ。"}, {"t": 808.65, "x": "職員を問いただして、円盤は\n宮内省の中にあると分かった。"}, {"t": 812.3666666666667, "x": "記録では、師団参謀の古賀少佐が\nそれを知ったとされている。"}, {"t": 816.1333333333333, "x": "じゃあすぐ探しに行ったのね。"}, {"t": 817.9, "x": "宮内省の中を探すよう命令が出された。"}, {"t": 820.4833333333333, "x": "兵たちは廊下を進み、部屋を一つずつ開けていった。"}, {"t": 823.7333333333333, "x": "探したのは円盤だけではない。"}, {"t": 825.6, "x": "録音にかかわった人も探していた。"}, {"t": 828.0666666666667, "x": "人も？"}, {"t": 828.8666666666667, "x": "円盤を隠した人が分かれば、ありかも分かるからだ。"}, {"t": 832.0166666666667, "x": "宮内大臣の石渡荘太郎と\n内大臣の木戸幸一は建物の中に隠れた。"}, {"t": 836.75, "x": "金庫室などに身を潜めていたと伝えられる。"}, {"t": 839.5833333333334, "x": "見つからなかったの？"}, {"t": 841.0, "x": "見つからなかった。"}, {"t": 842.1833333333333, "x": "宮内省の建物は広く部屋も多い。"}, {"t": 844.45, "x": "兵たちは、どの部屋に何があるのかも\n分からないまま探した。"}, {"t": 848.15, "x": "手当たり次第ってこと？"}, {"t": 849.6666666666666, "x": "記録を読む限り、そう見える。"}, {"t": 851.5333333333333, "x": "皇后宮職の事務室も、その中の一つにすぎなかった。"}, {"t": 855.8833333333333, "x": "円盤を受け取った徳川侍従は、\nこの夜建物の中を動いていた。"}, {"t": 859.95, "x": "のちの記録では、御文庫へ異変を\n知らせに行っていたとされる。"}, {"t": 863.5166666666667, "x": "天皇のいる所に知らせに行ったのね。"}, {"t": 865.95, "x": "そうだ。そして宮内省へ戻ってきた。"}, {"t": 868.3666666666667, "x": "戻ったところで兵たちと言い合いになった。"}, {"t": 870.9, "x": "言い合い？"}, {"t": 871.5666666666667, "x": "円盤のありかや人の居場所を\n問われた、と考えられている。"}, {"t": 874.95, "x": "徳川侍従は答えなかった。"}, {"t": 876.8333333333334, "x": "そして兵の一人に殴られた。"}, {"t": 878.9, "x": "殴られたの？"}, {"t": 879.95, "x": "殴られた。ただ、この話には続きがある。"}, {"t": 882.8, "x": "殴った下士官は、のちに家族に\nこう話したと伝えられている。"}, {"t": 886.5833333333334, "x": "周りの兵が侍従を取り囲んでいて、\nこのままでは命が危ないと思った。"}, {"t": 890.8166666666667, "x": "だから自分が殴って倒し、周りを納得させた、と。"}, {"t": 894.3833333333333, "x": "守るために殴ったってこと？"}, {"t": 896.3, "x": "本人の話としてはそうなる。"}, {"t": 898.25, "x": "この回では、その話を確かめる方法が無い。"}, {"t": 901.2, "x": "だから、そう伝えられているとだけ言っておく。"}, {"t": 903.8166666666667, "x": "確かなのは、徳川侍従が\n円盤のありかを言わなかったことだ。"}, {"t": 907.6833333333333, "x": "円盤は侍従のすぐ近くの部屋にあったのよね。"}, {"t": 910.5666666666667, "x": "そうだ。殴られた人のすぐ近くの部屋だ。"}, {"t": 913.3333333333334, "x": "兵たちはその部屋の金庫には行き着かなかった。"}, {"t": 916.2833333333333, "x": "ほんの少しの差ね。"}, {"t": 917.7333333333333, "x": "その少しの差のまま、夜は明け方へ向かっていく。"}, {"t": 921.4333333333333, "x": "この夜の宮内省を国会で語った人がいる。"}, {"t": 924.3166666666667, "x": "国会で？"}, {"t": 925.2333333333333, "x": "8年後の1953年7月21日。"}, {"t": 928.4833333333333, "x": "衆議院の行政監察特別委員会だ。"}, {"t": 931.1666666666666, "x": "別の件の証人として元宮内省の職員が呼ばれた。"}, {"t": 934.6, "x": "終戦のころ、宮内省の総務局で働いていた人だ。"}, {"t": 938.2166666666667, "x": "別の件って？"}, {"t": 939.4166666666666, "x": "終戦の直後に、ある品物が\n宮内省に持ち込まれた件だ。"}, {"t": 943.2, "x": "その日付を聞かれて、証人はこう前置きした。"}, {"t": 946.1333333333333, "x": "「あの当時終戦の詔書が渙発せられました\n八月十四日の晩、私おりましたものですから」"}, {"t": 951.8333333333334, "x": "「そのとき例の録音奪取事件があって、\n宮内省の中は非常に混乱をしたのであります」"}, {"t": 957.1666666666666, "x": "録音奪取事件って呼んでるのね。"}, {"t": 959.4, "x": "中にいた人にとっては、そういう名前の夜だった。"}, {"t": 962.5, "x": "委員の一人もこう言っている。"}, {"t": 964.1666666666666, "x": "「八月十四日には陛下の録音盤を\n探すために兵隊が相当侵入しております」"}, {"t": 969.2833333333333, "x": "国会の記録にも、録音盤を探したことが残ってるのね。"}, {"t": 973.1666666666666, "x": "同じ委員はその年の2月にも、こう話している。"}, {"t": 976.1833333333333, "x": "「この録音盤をめぐって\n陸海軍の一部将官あるいは兵隊たちが、\n宮城の中にいろいろな形で侵入して」"}, {"t": 982.65, "x": "「宮内省の金庫の中とか書類」"}, {"t": 984.7833333333333, "x": "金庫の中まで探したってこと？"}, {"t": 986.9666666666667, "x": "委員はそういう認識で話している。"}, {"t": 989.05, "x": "だが円盤は見つからなかった。"}, {"t": 990.9166666666666, "x": "そして証人はこうも語った。"}, {"t": 992.8, "x": "「八月の十四日の晩から十五日のあかつきへかけて」"}, {"t": 996.15, "x": "「宮内省は、一晩のうちに歴史をつくった」"}, {"t": 998.95, "x": "「その混乱した状態は想像以上のものでありました」"}, {"t": 1002.2, "x": "……すごい言い方ね。"}, {"t": 1003.4166666666666, "x": "そのあとの宮内省については、こう続けている。"}, {"t": 1006.25, "x": "「ずっとひき潮のような静けさを\n持っておったのであります」"}, {"t": 1009.5333333333333, "x": "嵐のあとの静けさ、みたいね。"}, {"t": 1011.7833333333333, "x": "中にいた人の言葉だ。"}, {"t": 1013.4, "x": "ではその嵐はどうやって収まったのか。"}, {"t": 1015.7, "x": "きっかけは1本の電話だった。"}, {"t": 1018.2, "x": "皇居を囲む部隊を外から見ていた司令部があった。"}, {"t": 1021.1666666666666, "x": "東部軍管区の司令部だ。"}, {"t": 1022.9166666666666, "x": "東部軍って？"}, {"t": 1024.0, "x": "東京を含む東日本の守りを受け持つ軍だ。"}, {"t": 1026.9, "x": "この司令部は近衛師団の動きをおかしいと見ていた。"}, {"t": 1029.8333333333333, "x": "師団の参謀長も、この司令部へ来ていたとされる。"}, {"t": 1032.9, "x": "井田中佐がそれに付いて行き、\n東部軍に加わるよう求めた。"}, {"t": 1036.5333333333333, "x": "東部軍は乗ったの？"}, {"t": 1037.9166666666667, "x": "乗らなかった。"}, {"t": 1038.8666666666666, "x": "記録では、東部軍はすでに鎮める\n方針を決めていたとされる。"}, {"t": 1042.5666666666666, "x": "そして午前4時を過ぎたころ。"}, {"t": 1044.35, "x": "東部軍の参謀長が、\n近衛歩兵第二連隊の連隊長と電話でつながった。"}, {"t": 1049.1, "x": "電話線は切られてたんじゃないの？"}, {"t": 1051.1166666666666, "x": "宮内省の電話は切られていた。だが連隊とは通じた。"}, {"t": 1054.4, "x": "参謀長は連隊長に、師団の命令は\n偽物だと伝えたとされる。"}, {"t": 1058.6666666666667, "x": "偽物って、そこで初めて知ったの？"}, {"t": 1061.2166666666667, "x": "連隊長は森師団長の死をすでに\n知り、疑いを持っていたとされる。"}, {"t": 1065.2333333333333, "x": "そこへ電話ではっきりと告げられた。"}, {"t": 1067.3, "x": "連隊長はその場にいた将校たちに、\n皇居から出るよう命じた。"}, {"t": 1071.1333333333334, "x": "これで終わり？"}, {"t": 1072.0833333333333, "x": "まだだ。命じられても全員が\nすぐに引いたわけではない。"}, {"t": 1075.2833333333333, "x": "ここで畑中少佐は皇居を離れる。"}, {"t": 1077.5166666666667, "x": "向かった先は放送会館だった。"}, {"t": 1080.2833333333333, "x": "午前4時半ごろ。"}, {"t": 1081.5, "x": "畑中少佐は放送会館のスタジオに入ったとされる。"}, {"t": 1084.8666666666666, "x": "そして自分たちの声明を放送させろと求めた。"}, {"t": 1088.0, "x": "円盤を止めるんじゃなくて、自分で流そうとしたの？"}, {"t": 1091.2, "x": "そうだ。"}, {"t": 1091.8166666666666, "x": "放送会館の幹部はその場にいなかった。"}, {"t": 1094.3333333333333, "x": "応じたのは、中堅の職員や\n技術の職員たちだったとされる。"}, {"t": 1098.3166666666666, "x": "銃を持った将校が相手でしょ？"}, {"t": 1100.2333333333333, "x": "ピストルを向けられながらの対応だった、と\n伝えられている。"}, {"t": 1103.6, "x": "職員たちはある決まりを盾にした。"}, {"t": 1105.7333333333333, "x": "空襲警報が出ている間は、\n放送の権限が東部軍の司令部に移る。"}, {"t": 1110.05, "x": "だから警報が解けるまで、放送会館からは出せない。"}, {"t": 1113.3166666666666, "x": "東部軍の許可がなければ\n放送できない、と言い続けたとされる。"}, {"t": 1117.1, "x": "決まりで断ったのね。"}, {"t": 1118.7166666666667, "x": "そうだ。しかも東部軍に電話して\n許可を取ってくれ、と頼んだ。"}, {"t": 1122.6833333333334, "x": "その東部軍は、もう鎮める側よね。"}, {"t": 1125.15, "x": "そういうことになる。"}, {"t": 1126.3166666666666, "x": "この場面は、当日の司会を務めた\n和田信賢 放送員の本に詳しいとされる。"}, {"t": 1131.2666666666667, "x": "翌1946年に出た『放送ばなし』という本だ。"}, {"t": 1135.3, "x": "当日の人がすぐ本に書いたのね。"}, {"t": 1137.6833333333334, "x": "書いたのは本人の見方だ。\nそのことは覚えておいてほしい。"}, {"t": 1141.1, "x": "結局、畑中少佐の声明が電波に乗ることはなかった。"}, {"t": 1144.7833333333333, "x": "東部軍に放送を断られ、\n少佐は放送会館をあとにした。"}, {"t": 1148.5833333333333, "x": "外はもう明るくなり始めていた。"}, {"t": 1151.2666666666667, "x": "午前5時ごろ。"}, {"t": 1152.2666666666667, "x": "東部軍管区の司令官、田中静壱 大将が動いた。"}, {"t": 1155.8666666666666, "x": "わずかな供を連れて、自ら\n近衛第一師団の司令部へ向かったとされる。"}, {"t": 1160.3, "x": "一番上の人が直接行ったの？"}, {"t": 1162.6, "x": "そうだ。"}, {"t": 1163.2166666666667, "x": "司令部では、偽の命令で\n部隊を出そうとしていた連隊長を止めた。"}, {"t": 1167.1833333333334, "x": "そのあと皇居の中へ入り、乾門の\nあたりで連隊長に会った。"}, {"t": 1170.9833333333333, "x": "そして兵を引き揚げるよう命じたとされる。"}, {"t": 1173.5, "x": "これで兵は引いたの？"}, {"t": 1174.9, "x": "ここから一気に静まっていった、と記録は書いている。"}, {"t": 1178.0333333333333, "x": "田中大将は御文庫と宮内省にも回ったとされる。"}, {"t": 1181.15, "x": "事態が収まったことを伝えるためだ。"}, {"t": 1183.5166666666667, "x": "田中大将が鎮めた、ってことでいいの？"}, {"t": 1186.1166666666666, "x": "そこは見方が二つある。"}, {"t": 1187.7, "x": "田中大将が鎮めたという見方。"}, {"t": 1189.9, "x": "その前に将校たちが、もうあきらめていたという見方。"}, {"t": 1193.1333333333334, "x": "どちらが正しいかは、ここでは決めずに置く。"}, {"t": 1195.85, "x": "決めないのね。"}, {"t": 1196.9166666666667, "x": "決められるだけの記録がそろっていないからだ。"}, {"t": 1199.5, "x": "同じころ、陸軍大臣の官邸でも\n一つのことが起きている。"}, {"t": 1203.2833333333333, "x": "阿南惟幾 陸軍大臣が、この朝に命を絶った。"}, {"t": 1207.0, "x": "陸軍大臣が？"}, {"t": 1208.3333333333333, "x": "そうだ。ただし、この夜の計画に\n加わっていたわけではない。"}, {"t": 1211.9666666666667, "x": "同じ朝に起きたことだと、\nここでは並べて置くだけにする。"}, {"t": 1215.4, "x": "午前8時前には近衛兵は皇居から引き揚げた。"}, {"t": 1218.4166666666667, "x": "隠れていた宮内大臣の石渡荘太郎と\n内大臣の木戸幸一も、外へ出て御文庫へ向かった。"}, {"t": 1224.7333333333333, "x": "兵が引いて、金庫の円盤が\nようやく動かせるようになった。"}, {"t": 1228.1666666666667, "x": "放送まであと4時間ほどだ。"}, {"t": 1230.0833333333333, "x": "すぐに放送局へ運んだのね。"}, {"t": 1232.2, "x": "運んだ。だがその運び方に工夫があった。"}, {"t": 1234.9666666666667, "x": "円盤は2つに分けて運ばれた。"}, {"t": 1237.15, "x": "2つに？"}, {"t": 1238.0333333333333, "x": "2回目に録った正本と、1回目に録った方の盤だ。"}, {"t": 1241.45, "x": "正本は内幸町の放送会館へ。"}, {"t": 1243.9, "x": "1回目の盤は、別に用意してあった\n予備のスタジオへ運ばれたとされる。"}, {"t": 1248.2166666666667, "x": "予備のスタジオもあったのね。"}, {"t": 1250.0166666666667, "x": "放送会館が使えなくなったときの備えだ。"}, {"t": 1252.8166666666666, "x": "そして運び方の工夫はここからだ。"}, {"t": 1255.1166666666666, "x": "1回目の盤のほうを、いかにも\n大事な使いらしく仕立てた。"}, {"t": 1258.6333333333334, "x": "天皇の使いである勅使のような\n形にした、と伝えられている。"}, {"t": 1262.6, "x": "じゃあ正本は？"}, {"t": 1263.7, "x": "正本は目立たない袋に入れて、\n木炭で走る車で運んだとされる。"}, {"t": 1268.1, "x": "本物をわざと地味にしたのね。"}, {"t": 1270.1166666666666, "x": "まだ皇居の外には、何が\n起きるか分からない状況だった。"}, {"t": 1273.65, "x": "狙われるなら目立つほうが狙われる。"}, {"t": 1275.8666666666666, "x": "1回目の盤を捨てなかったのは、\nこういうことだったのね。"}, {"t": 1279.2833333333333, "x": "結果としてそうなった。"}, {"t": 1280.75, "x": "替えがあることが、正本を守る盾になった。"}, {"t": 1283.5333333333333, "x": "正本の5枚は放送会館に着いた。"}, {"t": 1285.8666666666666, "x": "だがその近くで、まだ終わっていない人たちがいた。"}, {"t": 1289.6, "x": "畑中少佐と椎崎中佐は、放送会館を\n出たあとも皇居のまわりにいた。"}, {"t": 1294.1166666666666, "x": "決起を呼び掛けるビラをまいたとされる。"}, {"t": 1296.4333333333334, "x": "まだあきらめてなかったの？"}, {"t": 1298.1166666666666, "x": "最後まで、と記録は書いている。"}, {"t": 1300.1166666666666, "x": "そして午前11時を過ぎたころ。"}, {"t": 1302.1833333333334, "x": "二人は二重橋と\n坂下門のあいだの芝生の上で、命を絶った。"}, {"t": 1306.3833333333334, "x": "……坂下門って、最初に\n下村さんたちが止められた所よね。"}, {"t": 1310.4333333333334, "x": "そうだ。この夜の始まりと\n終わりが同じ門のそばにある。"}, {"t": 1313.7666666666667, "x": "放送のための声明の原稿は、\n二人とともに失われたとされる。"}, {"t": 1317.9, "x": "放送されなかった声明ね。"}, {"t": 1319.7833333333333, "x": "そうだ。円盤に録られた声は残り、\n録られなかった声は消えた。"}, {"t": 1323.6166666666666, "x": "もう一人、師団参謀の古賀少佐も\nこの日に命を絶っている。"}, {"t": 1327.3, "x": "場所は近衛第一師団の司令部。"}, {"t": 1329.3666666666666, "x": "森師団長の遺体が安置された部屋だったとされる。"}, {"t": 1332.4666666666667, "x": "師団長の前で……。"}, {"t": 1333.75, "x": "古賀少佐がこの計画にどこまで\n加わっていたかは、はっきりしていない。"}, {"t": 1337.8333333333333, "x": "だからここではそれ以上は言わない。"}, {"t": 1339.7666666666667, "x": "井田中佐は、この日陸軍省で\n命を絶とうとしたとされる。"}, {"t": 1343.2833333333333, "x": "だが見張っていた将校に止められ、生き延びた。"}, {"t": 1346.2, "x": "生き延びた人もいるのね。"}, {"t": 1347.9, "x": "いる。井田中佐は戦後を生き、\n2004年に亡くなっている。"}, {"t": 1351.35, "x": "この夜に関わった人の中には、\nのちに証言を残した人がいる。"}, {"t": 1355.45, "x": "この回で使っている流れの多くは、\nそうした証言に基づいている。"}, {"t": 1359.4, "x": "そして正午が近づいてくる。"}, {"t": 1361.8166666666666, "x": "ねえ、時刻がたくさん出てきて、\nちょっと混ざってきた。"}, {"t": 1365.1666666666667, "x": "なら一度並べ直そう。"}, {"t": 1366.6333333333334, "x": "8月14日の午後11時。"}, {"t": 1368.5166666666667, "x": "詔書が官報号外で発せられる。"}, {"t": 1370.6666666666667, "x": "午後11時25分。天皇が内廷庁舎へ\n向かい、録音が2回行われる。"}, {"t": 1375.4333333333334, "x": "15日の午前0時5分。"}, {"t": 1377.0166666666667, "x": "天皇が御文庫へ戻る。"}, {"t": 1378.5333333333333, "x": "午前0時過ぎ。坂下門で下村総裁たちが止められる。"}, {"t": 1382.2666666666667, "x": "そのあと師団長室で、森師団長と\n白石中佐の命が奪われる。"}, {"t": 1386.5, "x": "午前2時。偽の師団命令が出る。"}, {"t": 1388.8666666666666, "x": "ここまでで、まだ3時間たってないのね。"}, {"t": 1391.5, "x": "たっていない。"}, {"t": 1392.3333333333333, "x": "午前4時過ぎ。東部軍の参謀長が、\n連隊長に命令は偽物だと伝える。"}, {"t": 1397.15, "x": "午前4時半ごろ。畑中少佐が\n放送会館で声明を流せと迫る。"}, {"t": 1401.4833333333333, "x": "午前5時ごろ。田中大将が師団の司令部へ向かう。"}, {"t": 1404.6166666666666, "x": "午前8時前。近衛兵が皇居から引き揚げる。"}, {"t": 1407.5666666666666, "x": "午前11時過ぎ。畑中少佐と\n椎崎中佐が宮城の前で命を絶つ。"}, {"t": 1412.2, "x": "そして正午。正本の円盤が回る。"}, {"t": 1414.7166666666667, "x": "円盤はそのあいだ、ずっと金庫の中だったのね。"}, {"t": 1417.8333333333333, "x": "録音のあと金庫に入り、兵が引くまで動いていない。"}, {"t": 1421.05, "x": "時刻の大半は、のちの証言と戦史からとったものだ。"}, {"t": 1424.5166666666667, "x": "分単位までは資料ごとにずれがある。"}, {"t": 1426.6, "x": "だが順番は動かない。"}, {"t": 1428.1666666666667, "x": "順番だけは確か。"}, {"t": 1429.6833333333334, "x": "そうだ。最後の一つ、正午の放送を見ていく。"}, {"t": 1433.4, "x": "8月15日、正午。"}, {"t": 1435.2, "x": "ラジオからまず放送の予告が流れた。"}, {"t": 1437.5833333333333, "x": "話したのは下村情報局総裁だと伝えられている。"}, {"t": 1441.0333333333333, "x": "夜中に閉じ込められた、あの下村さん？"}, {"t": 1443.6833333333334, "x": "そうだ。朝には解放されていた。"}, {"t": 1445.8166666666666, "x": "12時間前に門で止められた\n人が、正午には予告をしている。"}, {"t": 1449.8333333333333, "x": "同じ日のことなのね。"}, {"t": 1451.3833333333334, "x": "同じ日だ。続いて君が代が流れた。"}, {"t": 1453.8166666666666, "x": "そして正本の円盤が回り始めた。"}, {"t": 1456.3, "x": "5枚のうち、どれが使われたの？"}, {"t": 1458.4666666666667, "x": "宮内庁は、2回目の録音盤が\n正本として放送されたと書いている。"}, {"t": 1462.7, "x": "どの盤を何番目にかけたかまでは、\nこの回の資料では確かめられなかった。"}, {"t": 1467.25, "x": "そこは言わないのね。"}, {"t": 1468.6166666666666, "x": "言わない。"}, {"t": 1469.25, "x": "放送の直前にも、放送会館で\n一つの騒ぎがあったとされる。"}, {"t": 1473.3, "x": "スタジオの前で一人の将校が刀を抜こうとしたという。"}, {"t": 1476.6166666666666, "x": "すぐに取り押さえられ、\n連れ出されたと伝えられている。"}, {"t": 1479.75, "x": "最後の最後まで……。"}, {"t": 1481.1, "x": "最後の最後まで、円盤は狙われていたことになる。"}, {"t": 1484.1833333333334, "x": "それでも声は予定どおりに流れた。"}, {"t": 1486.2666666666667, "x": "前の晩に、宮内省の一室で2回読まれた声だ。"}, {"t": 1489.5166666666667, "x": "止めようとした夜のことを、聞いている\n人たちは知らなかったのよね。"}, {"t": 1493.45, "x": "知らなかった。"}, {"t": 1494.4, "x": "国民がこの夜のことを知るのは、\nずっとあとになってからだ。"}, {"t": 1497.9333333333334, "x": "その前に、国会の記録に残った言葉の数を見ておく。"}, {"t": 1502.0833333333333, "x": "ここで一つ数を数えてみた。"}, {"t": 1503.9666666666667, "x": "国会の会議録で「録音盤」という言葉を引いてみる。"}, {"t": 1507.4166666666667, "x": "出てくるのは64件だった。"}, {"t": 1509.55, "x": "64件？　思ったより多いわね。"}, {"t": 1511.9, "x": "だがほとんどは別の話だ。"}, {"t": 1513.7333333333333, "x": "選挙で録音盤を使ってよいか、という議論。"}, {"t": 1516.4833333333333, "x": "大臣に出された録音盤の中身を問う議論。"}, {"t": 1519.1833333333334, "x": "終戦の夜の録音盤に触れているのは、\nそのうち5件だった。"}, {"t": 1522.9166666666667, "x": "しかも4件は、\n1953年の同じ委員会での同じ委員の発言だ。"}, {"t": 1527.8333333333333, "x": "少ないのね。"}, {"t": 1528.9, "x": "「宮城事件」という名前で引くと、2件しかない。"}, {"t": 1531.9833333333333, "x": "しかも1件は同じ名前の別の件だった。"}, {"t": 1534.75, "x": "国会では、あまり話されなかったってこと？"}, {"t": 1537.5333333333333, "x": "この会議録が始まるのは1947年からだ。"}, {"t": 1541.0333333333333, "x": "事件はその2年前に起きている。"}, {"t": 1543.0833333333333, "x": "裁判も無かったから、法律の議論にもなりにくい。"}, {"t": 1546.2, "x": "出てくるのは、別の話のついでに\n触れられる形がほとんどだ。"}, {"t": 1549.9833333333333, "x": "宮内省に品物が持ち込まれた件。"}, {"t": 1552.0833333333333, "x": "恩給の審査の件。軍法会議の件。"}, {"t": 1554.7166666666667, "x": "ついでに出てくる、か。"}, {"t": 1556.2333333333333, "x": "2007年には、ある議員がこう触れている。"}, {"t": 1558.8166666666666, "x": "「玉音放送のあのレコード盤が軍部の一部の方に\n取られそうになって放送ができなくなる」"}, {"t": 1563.9666666666667, "x": "62年たっても言い表し方は同じだ。"}, {"t": 1566.65, "x": "あの夜はレコード盤の夜として覚えられている。"}, {"t": 1569.25, "x": "では、この夜を起こした人たちは\nそのあとどうなったのか。"}, {"t": 1573.2166666666667, "x": "師団長と参謀の命が奪われ、偽の命令が出された。"}, {"t": 1576.75, "x": "皇居は兵に囲まれ、放送局も押さえられた。"}, {"t": 1579.8, "x": "それって軍の中でも重い罪よね。"}, {"t": 1582.05, "x": "当時の軍の法でも、明らかに重い罪にあたる。"}, {"t": 1585.0166666666667, "x": "だがこの夜に関わった将校たちは、\n軍法会議にかけられていない。"}, {"t": 1589.15, "x": "裁判が無かったの？"}, {"t": 1590.6166666666666, "x": "無かった。"}, {"t": 1591.3666666666666, "x": "裁くはずの陸軍そのものが、\nそのあと解体されたからだ。"}, {"t": 1594.9833333333333, "x": "中心にいた人の多くは、\nこの日のうちに命を絶っていた。"}, {"t": 1598.4833333333333, "x": "生き延びた人も、裁かれないまま戦後を迎えた。"}, {"t": 1601.65, "x": "ほかの事件でもそうだったの？"}, {"t": 1603.55, "x": "そこで比べられた事件がある。"}, {"t": 1605.3833333333334, "x": "1973年4月5日。"}, {"t": 1607.6333333333334, "x": "参議院の予算委員会の分科会だ。"}, {"t": 1609.9666666666667, "x": "厚生省の援護局長がこう答えている。"}, {"t": 1612.45, "x": "「陸軍における宮城事件等も同じような終戦時に\nおける徹底抗戦を叫んだ人たちによりまして」"}, {"t": 1618.3333333333333, "x": "「宮城内におきまして陛下の録音盤を奪うとか」"}, {"t": 1621.45, "x": "ここにも録音盤が出てくるのね。"}, {"t": 1623.6166666666666, "x": "出てくる。比べられていたのは、\n厚木の海軍の航空隊の事件だ。"}, {"t": 1627.7166666666667, "x": "終戦のあと、降伏するなと呼び掛けた事件だった。"}, {"t": 1630.9666666666667, "x": "局長は、こちらは海軍の軍法会議で\n裁かれたと答えている。"}, {"t": 1634.85, "x": "質問した議員はこう言った。"}, {"t": 1636.6166666666666, "x": "「ビラをまいただけでこの人は\n終身禁錮になったわけなんです」"}, {"t": 1640.25, "x": "ビラだけで終身……。"}, {"t": 1641.5333333333333, "x": "議員は、69人がこの罪に問われたとも言っている。"}, {"t": 1644.9166666666667, "x": "片方は裁かれ、片方は裁く場が無かった。"}, {"t": 1647.85, "x": "この日、答弁に立った厚生大臣はこう述べている。"}, {"t": 1650.95, "x": "「何とかこれはしてあげなければならぬなという\n私感じを率直にいたします」"}, {"t": 1655.4166666666667, "x": "大臣も、気の毒だと思ってたのね。"}, {"t": 1657.95, "x": "裁かれた側には判決の記録が\n残り、こうして国会で語られた。"}, {"t": 1662.1333333333334, "x": "裁かれなかった側には、その記録そのものが無い。"}, {"t": 1665.2333333333333, "x": "その差が、28年たっても国会で\n問われていたことになる。"}, {"t": 1669.6166666666666, "x": "この夜は、戦後の別の場面でも国会に出てくる。"}, {"t": 1672.7833333333333, "x": "恩給の話だ。"}, {"t": 1674.15, "x": "恩給って？"}, {"t": 1675.1166666666666, "x": "国のために働いた人や遺族に、国が出すお金だ。"}, {"t": 1678.55, "x": "終戦のころに亡くなった軍人が、\n国の務めで亡くなったと言えるのか。"}, {"t": 1682.8333333333333, "x": "その審査がなかなか進まなかった。"}, {"t": 1685.0833333333333, "x": "1954年2月24日。"}, {"t": 1687.4, "x": "衆議院の内閣委員会。"}, {"t": 1689.1333333333334, "x": "審査を早めるよう求めた議員がこう言っている。"}, {"t": 1691.7833333333333, "x": "「終戦時に森師団長を殺して\n自決した、こういう人と違います」"}, {"t": 1695.95, "x": "「こっちにおって反乱を起して自決したのと\n違います。こういう方は別の話であります」"}, {"t": 1701.3166666666666, "x": "この夜の将校たちは別にしろってこと？"}, {"t": 1703.9, "x": "議員は、外地で追い詰められて\n亡くなった兵を先に救え、と言っていた。"}, {"t": 1708.1166666666666, "x": "そのとき、この夜の死を例に出してはっきり分けた。"}, {"t": 1711.2833333333333, "x": "じゃあ命を奪われた側の師団長たちは？"}, {"t": 1713.8666666666666, "x": "1958年3月5日の同じ委員会で、\n別の議員がそこに触れている。"}, {"t": 1718.8333333333333, "x": "近衛師団長や田中司令官は、脅しに応じずに拒んだ。"}, {"t": 1722.4166666666667, "x": "そしてこう続けた。"}, {"t": 1723.7333333333333, "x": "「それらの遺族に対しての手当は\nほとんどしておりません」"}, {"t": 1726.95, "x": "遺族の人たちには、何も無かったの？"}, {"t": 1729.55, "x": "議員はそう訴えた。それが事実か\nどうかは、この回では確かめていない。"}, {"t": 1733.8833333333334, "x": "それにこの議員は、田中司令官も\n殺されたように話している。"}, {"t": 1737.6, "x": "実際には、田中大将は8月24日に自ら命を絶っている。"}, {"t": 1742.05, "x": "記憶も混ざっていくのね。"}, {"t": 1743.7333333333333, "x": "13年たてば、国会の中でも混ざる。"}, {"t": 1746.3666666666666, "x": "だから記録を一つずつ開く意味がある。"}, {"t": 1749.4, "x": "話を円盤に戻す。"}, {"t": 1750.9333333333334, "x": "放送が終わったあと、正本の5枚は保管された。"}, {"t": 1753.9833333333333, "x": "だがずっと金庫の中にあったわけではない。"}, {"t": 1756.5333333333333, "x": "どこかに出たの？"}, {"t": 1757.7333333333333, "x": "1946年の7月。"}, {"t": 1759.9833333333333, "x": "原盤は連合国軍の総司令部に貸し出された。"}, {"t": 1762.95, "x": "いわゆるGHQだ。期間は9日間だったとされる。"}, {"t": 1766.4666666666667, "x": "何のために？"}, {"t": 1767.5166666666667, "x": "複製を作るためだ。"}, {"t": 1768.95, "x": "返されたあと、原盤は\n皇室の持ち物として宮内庁が保管した。"}, {"t": 1773.2333333333333, "x": "じゃあ、いままで流れてた玉音放送は？"}, {"t": 1775.8, "x": "そこが面白いところだ。"}, {"t": 1777.35, "x": "テレビなどで流れてきた音は、原盤から\n直接とったものではないとみられている。"}, {"t": 1782.05, "x": "GHQが作った複製を、さらに\n何度も写したものだという。"}, {"t": 1786.0833333333333, "x": "コピーのコピー、ってこと？"}, {"t": 1787.7, "x": "そういうことになる。"}, {"t": 1788.9, "x": "写すたびに音は少しずつ変わっていく。"}, {"t": 1791.4333333333334, "x": "じゃあ本物の音は、誰も聞いてなかったの？"}, {"t": 1794.1833333333334, "x": "原盤は長いあいだ、\n再生されないまま保管されていた。"}, {"t": 1797.55, "x": "宮内庁は、1946年5月の天皇のお言葉の原盤も\n一緒に保管してきたと書いている。"}, {"t": 1803.6666666666667, "x": "食糧の問題について語った別の録音だ。"}, {"t": 1806.5166666666667, "x": "2つの原盤が並んでしまわれていた。"}, {"t": 1808.85, "x": "それがもう一度回る日が来る。"}, {"t": 1811.3, "x": "平成27年、2015年の8月1日。"}, {"t": 1814.6166666666666, "x": "宮内庁は先の大戦に関わる資料を公表した。"}, {"t": 1817.6833333333334, "x": "戦後70年の節目としてだ。"}, {"t": 1819.8, "x": "その中に玉音放送の原盤があった。"}, {"t": 1822.3, "x": "70年ぶりに再生を試み、天皇の声を\n直接取り出すことに成功した。"}, {"t": 1827.2666666666667, "x": "70年前の円盤が、まだ鳴ったのね。"}, {"t": 1830.0, "x": "鳴った。宮内庁はその音を公開している。"}, {"t": 1832.6333333333334, "x": "録音盤と、それを入れていた缶の写真も出した。"}, {"t": 1835.8, "x": "缶に入ってたのね。"}, {"t": 1837.25, "x": "宮内庁の写真には収納缶と書かれている。"}, {"t": 1839.9166666666667, "x": "この日、宮内庁はほかの資料も一緒に出している。"}, {"t": 1842.95, "x": "8月14日の御前会議が開かれた、\n御文庫附属庫の写真と映像だ。"}, {"t": 1847.7, "x": "最初に出てきた会議の場所ね。"}, {"t": 1849.7666666666667, "x": "そうだ。声が決まった場所と声を\n入れた円盤が、同じ日に公表された。"}, {"t": 1854.1166666666666, "x": "そして、聞き比べた人たちが気づいたことがある。"}, {"t": 1857.1333333333334, "x": "原盤の音は、それまで出回っていた\n音より10秒以上短かった。"}, {"t": 1861.3166666666666, "x": "短い？　同じ録音なのに？"}, {"t": 1863.3166666666666, "x": "なぜ短くなったのか、くわしい\n理由はこの回では確かめていない。"}, {"t": 1867.15, "x": "確かなのは、写した音と\n原盤の音の長さが違ったことだ。"}, {"t": 1871.0333333333333, "x": "原盤の声は、それまでより\n聞き取りやすかったとも言われた。"}, {"t": 1874.6833333333334, "x": "70年間、少し違う声を聞いてたってことね。"}, {"t": 1877.9833333333333, "x": "そういうことになる。"}, {"t": 1879.1666666666667, "x": "あの夜、兵たちが探して見つけられなかった円盤だ。"}, {"t": 1882.4666666666667, "x": "それがいま、宮内庁の公表で\n写真と音になって残っている。"}, {"t": 1886.2333333333333, "x": "5枚とも無事だったの？"}, {"t": 1887.8, "x": "宮内庁は2回目の盤5枚を正本として書いている。"}, {"t": 1890.9166666666667, "x": "そして大切に保管されてきたと書いている。"}, {"t": 1893.5666666666666, "x": "この回で言えるのはそこまでだ。"}, {"t": 1896.0, "x": "この回で使った記録を、順に挙げておく。"}, {"t": 1898.65, "x": "5枚と2回、70年ぶりの再生は、\n宮内庁の平成27年8月1日の公表だ。"}, {"t": 1904.5666666666666, "x": "8月14日の時刻は、昭和天皇実録を\n引いた記事を使った。"}, {"t": 1908.8333333333333, "x": "詔書の原本の直し方は国立公文書館の説明だ。"}, {"t": 1912.4333333333334, "x": "録音機の型と片面3分は、当時の機材を紹介した記事。"}, {"t": 1916.4333333333334, "x": "命令書の文面は、防衛庁の戦史室の資料の翻刻だ。"}, {"t": 1920.1333333333334, "x": "1953年の証人の言葉は、\n7月21日の衆議院行政監察特別委員会 第8号。"}, {"t": 1927.1166666666666, "x": "1954年の発言は、\n2月24日の衆議院内閣委員会 第6号。"}, {"t": 1932.5, "x": "1958年の発言は、\n3月5日の衆議院内閣委員会 第9号。"}, {"t": 1937.8333333333333, "x": "1973年の答弁は、\n4月5日の参議院予算委員会第四分科会 第1号だ。"}, {"t": 1943.95, "x": "GHQへの貸し出しと10秒の差は、\n事典の解説を使った。"}, {"t": 1948.1, "x": "一晩の細かい時刻は？"}, {"t": 1949.8833333333334, "x": "防衛庁がまとめた戦史と、\nのちの証言をまとめた本によっている。"}, {"t": 1953.8833333333334, "x": "だから「とされる」と付けて話した。"}, {"t": 1956.3, "x": "名前を出したのは、亡くなったことを\n確かめた人と公人だけだ。"}, {"t": 1960.2, "x": "手を下した人の名前と、亡くなり方は話していない。"}, {"t": 1963.5666666666666, "x": "昭和天皇や政府の判断が正しかったか\nどうかも、決めていない。"}, {"t": 1968.0833333333333, "x": "ねえ、最初の数字に戻っていい？"}, {"t": 1970.2333333333333, "x": "いいぞ。"}, {"t": 1970.8833333333334, "x": "5枚って聞いたとき、多いなって思ったの。"}, {"t": 1973.5666666666666, "x": "1枚に片面3分しか入らない時代だった。"}, {"t": 1976.6166666666666, "x": "でも今は少ないって思う。"}, {"t": 1978.3833333333334, "x": "どうしてだ。"}, {"t": 1979.3333333333333, "x": "一晩じゅう、宮内省の中を兵が探してたんでしょ。"}, {"t": 1982.4833333333333, "x": "5枚なんて、どこにでも隠れちゃう数よね。"}, {"t": 1985.2333333333333, "x": "小さな金庫に収まる数だった。"}, {"t": 1987.3166666666666, "x": "そしてそれを隠した人は、殴られても言わなかった。"}, {"t": 1990.65, "x": "止めようとした人たちが探したのは円盤だった。"}, {"t": 1993.6, "x": "守った人たちが守ったのも円盤だった。"}, {"t": 1996.3166666666666, "x": "どちらも、声が人に届くかどうかを争っていた。"}, {"t": 1999.4, "x": "紙の詔書は、前の晩の11時にはもう出ていた。"}, {"t": 2002.5166666666667, "x": "それでも国民が終わりを\n知ったのは、声を聞いたときだ。"}, {"t": 2005.8166666666666, "x": "だからあの夜は、円盤の取り合いになったのね。"}, {"t": 2008.7166666666667, "x": "そうだ。"}, {"t": 2009.3333333333333, "x": "裁かれなかった人がいて、遺族に手当が\n届かなかったと訴えた議員がいた。"}, {"t": 2014.0, "x": "その一方で、円盤は70年ぶりにもう一度回った。"}, {"t": 2017.5, "x": "録られた声は残って、録られなかった声は消えた。"}, {"t": 2020.6, "x": "あの夜に残ったものは、\n宮内庁の写真に写っている5枚だ。"}, {"t": 2024.3, "x": "坂下門で止められた人たちが、\n宮内省に置いてきた円盤だ。"}, {"t": 2028.3666666666666, "x": "もし、あの金庫が見つかってたら？"}, {"t": 2030.6, "x": "それはこの回では考えない。"}, {"t": 2032.3166666666666, "x": "記録に無いことを足すと、記録のほうが見えなくなる。"}, {"t": 2035.5333333333333, "x": "……そうね。あったことだけで、もう十分重いもの。"}, {"t": 2038.45, "x": "置いてきて、よかったのね。"}, {"t": 2040.3, "x": "それは聞いた人それぞれが決めればいい。"}, {"t": 2042.4666666666667, "x": "記録に残っているのは、置いてきた\n円盤が正午に回ったということだけだ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
