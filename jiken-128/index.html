<script>
const D={"name": "128", "file": "128_編集用", "dur": 2058.26665625, "segs": [], "subs": [{"t": 0.0, "x": "1945年8月15日の正午。"}, {"t": 2.966666666666667, "x": "日本中のラジオから昭和天皇の声が流れた。"}, {"t": 5.8, "x": "玉音放送と呼ばれる放送だ。"}, {"t": 7.85, "x": "あの声はその場で話したものではない。"}, {"t": 10.066666666666666, "x": "前の晩に、円盤に録音しておいたものだ。"}, {"t": 12.916666666666666, "x": "録音だったの？"}, {"t": 14.15, "x": "そうだ。録音は2回行われている。"}, {"t": 16.5, "x": "放送に使われたのは2回目の盤だった。"}, {"t": 19.05, "x": "その2回目の盤は全部で5枚ある。"}, {"t": 21.316666666666666, "x": "5枚？　1枚じゃないのね。"}, {"t": 23.15, "x": "2枚組と3枚組。2セットで計5枚だ。"}, {"t": 26.066666666666666, "x": "これは宮内庁が平成27年に公表した数字だ。"}, {"t": 29.45, "x": "同じ年、宮内庁はその原盤を70年ぶりに再生した。"}, {"t": 33.233333333333334, "x": "そして昭和天皇の声を原盤から\n取り出すことに成功している。"}, {"t": 37.11666666666667, "x": "70年も、しまってあったってこと？"}, {"t": 39.6, "x": "大切に保管されてきた、と宮内庁は書いている。"}, {"t": 42.666666666666664, "x": "だがその5枚が無事だったのは当たり前ではない。"}, {"t": 45.333333333333336, "x": "放送の前の晩、この円盤を\n探して兵が皇居に入っている。"}, {"t": 49.166666666666664, "x": "兵が？　何のために？"}, {"t": 50.766666666666666, "x": "放送を止めるためだ。"}, {"t": 52.15, "x": "その夜の出来事は、のちに宮城事件と呼ばれる。"}, {"t": 55.233333333333334, "x": "宮城は当時の皇居の呼び名だ。"}, {"t": 57.21666666666667, "x": "今回はその一晩を、5枚の円盤の側から追っていく。"}, {"t": 60.63333333333333, "x": "どこで録られ、どこに隠され、\nどうやって放送に間に合ったのか。"}, {"t": 64.53333333333333, "x": "円盤が主役なのね。"}, {"t": 66.11666666666666, "x": "そうだ。人の思いの良し悪しはこの回では決めない。"}, {"t": 69.16666666666667, "x": "残った記録で物の動きを順に見ていく。"}, {"t": 72.31666666666666, "x": "時計を前の日の8月14日に戻す。"}, {"t": 74.91666666666667, "x": "宮内庁がまとめた昭和天皇実録という記録がある。"}, {"t": 78.15, "x": "天皇の一日を時刻つきで書いた公式の記録だ。"}, {"t": 81.36666666666666, "x": "それによると、この日の午前11時2分。"}, {"t": 83.98333333333333, "x": "天皇は御文庫を出て御前会議に臨んだ。"}, {"t": 86.6, "x": "御文庫って？"}, {"t": 87.73333333333333, "x": "皇居の中にあった天皇の防空用の住まいだ。"}, {"t": 90.53333333333333, "x": "会議の場所はそのそばの御文庫附属庫。"}, {"t": 92.93333333333334, "x": "陸軍が防空用に造り、宮内省に引き継いだ施設だ。"}, {"t": 96.46666666666667, "x": "4日前の8月10日にも、ここで\n重要な会議が開かれている。"}, {"t": 100.56666666666666, "x": "同じ場所で2回目の会議ってこと？"}, {"t": 102.86666666666666, "x": "そうなる。"}, {"t": 104.0, "x": "この日の会議で、天皇は\n前の決断に変わりはないと述べた。"}, {"t": 107.68333333333334, "x": "連合国の回答を受け入れて\n戦争を終えるという決断だ。"}, {"t": 111.01666666666667, "x": "そしてもう一つ、実録はこう書いている。"}, {"t": 113.65, "x": "自分がマイクの前に立って国民に伝えてもよい。"}, {"t": 116.7, "x": "自分で話すってこと？"}, {"t": 118.33333333333333, "x": "そうだ。これが録音の始まりになる。"}, {"t": 120.63333333333334, "x": "会議は正午の手前、11時55分に終わった。"}, {"t": 123.78333333333333, "x": "天皇は御文庫へ戻っている。"}, {"t": 125.51666666666667, "x": "ここから日付が変わるまでの半日がある。"}, {"t": 128.01666666666668, "x": "その半日で言葉を文にして、\n声にしなければならない。"}, {"t": 131.55, "x": "半日って、すごく短くない？"}, {"t": 133.8, "x": "短い。しかも文の中身はまだ固まっていなかった。"}, {"t": 137.68333333333334, "x": "ここで一日前に話を戻しておく。"}, {"t": 140.08333333333334, "x": "8月13日の夜、陸軍大臣の官邸を\n6人の将校が訪ねている。"}, {"t": 144.85, "x": "陸軍省の軍事課と軍務課の将校たちだ。"}, {"t": 147.61666666666667, "x": "畑中少佐、椎崎中佐、井田中佐も\nこの6人に入っていた。"}, {"t": 151.96666666666667, "x": "何を持って行ったの？"}, {"t": 153.38333333333333, "x": "兵力使用計画と名付けた案だ。"}, {"t": 155.58333333333334, "x": "東部軍と近衛第一師団を\n使って、皇居を外から切り離す。"}, {"t": 159.56666666666666, "x": "政府の要人を押さえて戦争を続ける。\nそういう中身だったとされる。"}, {"t": 163.66666666666666, "x": "それを陸軍大臣に頼んだの？"}, {"t": 165.8, "x": "賛成してほしいと迫った。"}, {"t": 167.56666666666666, "x": "阿南惟幾 陸軍大臣は、参謀総長と\n会ってから決めると答えたとされる。"}, {"t": 172.53333333333333, "x": "そして14日の午前7時、大臣は\n梅津美治郎 参謀総長と会った。"}, {"t": 177.21666666666667, "x": "参謀総長は計画に反対し、大臣も\nそれに同じたと伝えられている。"}, {"t": 181.78333333333333, "x": "じゃあ計画はそこで消えたのね。"}, {"t": 183.78333333333333, "x": "上の人の賛成を得る道は、そこで消えた。"}, {"t": 186.53333333333333, "x": "残ったのは上を通さずに部隊を動かす道だ。"}, {"t": 189.43333333333334, "x": "上を通さずに……。"}, {"t": 190.56666666666666, "x": "その道の入り口が、近衛第一師団の師団長室だった。"}, {"t": 194.26666666666668, "x": "だがそれは夜になってからの話だ。"}, {"t": 196.51666666666668, "x": "昼の御前会議のあと、まず\n動き出したのは詔書のほうだった。"}, {"t": 200.83333333333334, "x": "天皇が読み上げる文を詔書という。"}, {"t": 202.86666666666667, "x": "その日の午後、内閣は\nこの詔書の文を閣議で直していた。"}, {"t": 206.65, "x": "直していた？　もう書いてあったんじゃないの？"}, {"t": 209.15, "x": "下書きはあった。だが閣議で修正と追加が入った。"}, {"t": 212.48333333333332, "x": "いまその原本は国立公文書館にある。"}, {"t": 215.05, "x": "館の説明では、書き直す時間が無かったとされている。"}, {"t": 218.45, "x": "だから直した場所は、紙を\n貼ったり書き込んだりしてある。"}, {"t": 221.76666666666668, "x": "普段の詔書ではまずやらない直し方だそうだ。"}, {"t": 224.63333333333333, "x": "それだけ急いでたのね。"}, {"t": 226.23333333333332, "x": "実録によると午後8時32分。"}, {"t": 228.6, "x": "鈴木貫太郎 首相が御文庫に詔書を持って参上した。"}, {"t": 232.13333333333333, "x": "天皇がそれに署名したのは午後9時20分。"}, {"t": 234.83333333333334, "x": "そして午後11時、詔書は\n官報号外に載って発せられた。"}, {"t": 238.66666666666666, "x": "じゃあその時点で国民にも知らされたの？"}, {"t": 241.18333333333334, "x": "そこが分かれ目だ。"}, {"t": 242.35, "x": "国内への公表は、翌日の正午の放送まで待たされた。"}, {"t": 246.0, "x": "紙の上ではもう出ている。"}, {"t": 247.45, "x": "だが国民が知るのは声が流れたときだ。"}, {"t": 250.11666666666667, "x": "じゃあ放送が止まったら……。"}, {"t": 251.7, "x": "国民はまだ知らないままになる。"}, {"t": 253.63333333333333, "x": "止めたい人たちが狙ったのは、まさにそこだった。"}, {"t": 256.68333333333334, "x": "紙ではなく声のほうだ。"}, {"t": 258.2, "x": "その声を入れる道具がここで運び込まれる。"}, {"t": 261.3, "x": "放送協会に話が来たのは、\nこの日の昼過ぎだとされる。"}, {"t": 264.96666666666664, "x": "会長が情報局に呼ばれ、急いで\n準備をするよう言われた。"}, {"t": 268.43333333333334, "x": "天皇が直接放送することになるかも\nしれない、という知らせだ。"}, {"t": 272.43333333333334, "x": "その日の昼に言われて、その日の夜に録るの？"}, {"t": 275.3666666666667, "x": "そうなる。準備の時間は半日も無かった。"}, {"t": 278.1166666666667, "x": "録音を受け持ったのは日本放送協会。いまのNHKだ。"}, {"t": 281.8333333333333, "x": "技術の職員たちが宮内省へ機材を持ち込んだ。"}, {"t": 284.9166666666667, "x": "どんな機械だったの？"}, {"t": 286.3833333333333, "x": "円盤に溝を刻んで音を記録する機械だ。"}, {"t": 289.01666666666665, "x": "型の名前はDP-17-K。"}, {"t": 290.78333333333336, "x": "持ち運びのできる型だった。"}, {"t": 292.68333333333334, "x": "ここで一つ大事な数字がある。"}, {"t": 294.6166666666667, "x": "当時の円盤は、片面に約3分しか録れなかった。"}, {"t": 298.1, "x": "3分？　放送はもっと長かったんじゃない？"}, {"t": 300.75, "x": "詔書を読むと3分では収まらない。"}, {"t": 302.8666666666667, "x": "だから前半と後半に分けて別の盤に録った。"}, {"t": 305.9166666666667, "x": "それで1回の録音でも何枚かになるのね。"}, {"t": 308.71666666666664, "x": "そういうことだ。"}, {"t": 309.71666666666664, "x": "宮内庁の言う「2枚組」「3枚組」も、\nこの事情と関わっている。"}, {"t": 314.1, "x": "1つの朗読が何枚かの円盤にまたがっているわけだ。"}, {"t": 317.55, "x": "じゃあ1枚でも欠けたら……。"}, {"t": 319.18333333333334, "x": "放送は途中で切れてしまう。"}, {"t": 320.93333333333334, "x": "5枚はどれも替えのきかない部品だった。"}, {"t": 323.4, "x": "部品、ね。"}, {"t": 324.53333333333336, "x": "同じ型の録音機と録音に使われた\n円盤は、いまも見ることができる。"}, {"t": 328.8333333333333, "x": "東京の愛宕山にあるNHK放送博物館だ。"}, {"t": 332.1166666666667, "x": "展示されている円盤は、放送に\n使われなかった方の盤とされている。"}, {"t": 336.31666666666666, "x": "使われなかった方？"}, {"t": 337.75, "x": "1回目の録音の盤だ。"}, {"t": 339.4, "x": "2回目の正本は宮内庁の手元にある。"}, {"t": 342.5, "x": "午後11時25分。"}, {"t": 344.0, "x": "天皇は御文庫を出て、宮内省の内廷庁舎へ向かった。"}, {"t": 347.3666666666667, "x": "これも実録に書かれている時刻だ。"}, {"t": 349.73333333333335, "x": "御文庫とは別の建物なのね。"}, {"t": 351.85, "x": "別の建物だ。宮内省の庁舎の中の一室で\n録音が行われた。"}, {"t": 356.18333333333334, "x": "部屋には放送協会が組んだマイクが置かれていた。"}, {"t": 359.05, "x": "天皇はそのマイクの前で詔書を読み上げた。"}, {"t": 361.6, "x": "そして、もう一度読み上げた。"}, {"t": 363.6, "x": "やり直したってこと？"}, {"t": 365.0833333333333, "x": "2回にわたって朗読した、と記録は書いている。"}, {"t": 368.0, "x": "なぜ2回になったかは、資料によって言い方が違う。"}, {"t": 371.1333333333333, "x": "この回では理由は決めないでおく。"}, {"t": 373.05, "x": "確かなのは2回目の盤が正本になったことだ。"}, {"t": 376.1166666666667, "x": "1回目の盤も捨てなかったのよね。"}, {"t": 378.4166666666667, "x": "捨てていない。それがあとで役に立つ。"}, {"t": 380.68333333333334, "x": "天皇が御文庫に戻ったのは、15日の午前0時5分。"}, {"t": 384.2, "x": "日付はもう8月15日に変わっていた。"}, {"t": 386.81666666666666, "x": "実録はそのあと、午前0時50分に休んだと書いている。"}, {"t": 390.6, "x": "日付が変わった時点で、放送まであと12時間ね。"}, {"t": 393.98333333333335, "x": "ちょうど12時間だ。"}, {"t": 395.28333333333336, "x": "この12時間のあいだ、5枚の円盤をどこに置くか。"}, {"t": 398.43333333333334, "x": "それがこの夜の一番の問題になった。"}, {"t": 401.0, "x": "どこに置いたの？"}, {"t": 402.1166666666667, "x": "答えは宮内省の建物の中だ。"}, {"t": 404.93333333333334, "x": "録音が終わったあと、円盤は放送協会の手を離れた。"}, {"t": 408.4166666666667, "x": "受け取ったのは徳川義寛 侍従だと伝えられている。"}, {"t": 411.9166666666667, "x": "侍従って、天皇のそばで仕える人よね。"}, {"t": 414.73333333333335, "x": "そうだ。"}, {"t": 415.85, "x": "円盤は皇后宮職という部署の事務室に運ばれた。"}, {"t": 419.01666666666665, "x": "皇后のお世話をする役所の部屋だ。"}, {"t": 421.1166666666667, "x": "そこにあった小さな金庫にしまわれたとされている。"}, {"t": 424.1166666666667, "x": "小さな金庫？　もっと厳重な場所じゃなくて？"}, {"t": 426.95, "x": "記録の言葉では軽金庫だ。"}, {"t": 428.85, "x": "持ち上げられそうなほどの\n金庫だった、ということになる。"}, {"t": 432.15, "x": "それ、見つかったら終わりじゃない。"}, {"t": 434.2, "x": "見つかれば終わりだ。"}, {"t": 435.4, "x": "だが目立たない場所でもあった。"}, {"t": 437.18333333333334, "x": "録音をした部屋とも、\n天皇の住まいとも違う部屋だからだ。"}, {"t": 440.9166666666667, "x": "探す人がまず思いつかない場所ってこと？"}, {"t": 443.6333333333333, "x": "そういう見方もできる。"}, {"t": 445.01666666666665, "x": "ここでもう一つ押さえておくことがある。"}, {"t": 447.21666666666664, "x": "録音を終えた人たちは、このあと\n宮内省を出て帰ろうとした。"}, {"t": 450.85, "x": "情報局総裁の下村宏と、放送協会の職員たちだ。"}, {"t": 455.0833333333333, "x": "情報局って？"}, {"t": 456.31666666666666, "x": "政府の広報を受け持つ役所だ。"}, {"t": 458.31666666666666, "x": "下村はその長として録音に立ち会っていた。"}, {"t": 461.0833333333333, "x": "円盤を宮内省に残し、人だけが外へ出る。"}, {"t": 464.01666666666665, "x": "その帰り道で車が止められる。"}, {"t": 466.68333333333334, "x": "場所は坂下門のあたりだ。"}, {"t": 468.48333333333335, "x": "皇居の東側にある門で、宮内省の庁舎に近い。"}, {"t": 471.8, "x": "記録では、午前0時を過ぎたころとされている。"}, {"t": 474.71666666666664, "x": "止めたのは誰なの？"}, {"t": 476.0833333333333, "x": "皇居を守っていた近衛兵だ。"}, {"t": 477.93333333333334, "x": "近衛兵は天皇と皇居を守るための部隊だった。"}, {"t": 481.01666666666665, "x": "守る側の兵が止めたの？"}, {"t": 482.8333333333333, "x": "そうだ。下村たちは銃を向けられたと伝えられている。"}, {"t": 486.06666666666666, "x": "そして近くの守衛隊の建物に閉じ込められた。"}, {"t": 489.23333333333335, "x": "録音をした人たちが捕まったってこと？"}, {"t": 491.9166666666667, "x": "そうなる。"}, {"t": 493.05, "x": "兵たちが知りたかったのは円盤のありかだった。"}, {"t": 495.76666666666665, "x": "だが一行は円盤を持っていなかった。"}, {"t": 498.05, "x": "宮内省に置いてきたものね。"}, {"t": 499.9166666666667, "x": "置いてきたからこそ、ここで取られずに済んだ。"}, {"t": 502.55, "x": "持って帰っていたら、門で\n取り上げられていたかもしれない。"}, {"t": 505.9166666666667, "x": "……偶然なの？"}, {"t": 507.03333333333336, "x": "偶然かどうかはこの回では決めない。"}, {"t": 509.1666666666667, "x": "ただ、円盤と人が別々に\n動いたことは記録に残っている。"}, {"t": 512.9833333333333, "x": "この夜はずっとそうだ。"}, {"t": 514.4, "x": "円盤は動かず、人のほうが動いていく。"}, {"t": 517.05, "x": "じゃあ兵たちは、どうして止める側に回ったの？"}, {"t": 519.9166666666666, "x": "そのために別の建物で起きていたことを見る。"}, {"t": 522.6333333333333, "x": "皇居の北にある近衛第一師団の司令部だ。"}, {"t": 526.0166666666667, "x": "近衛兵を率いていたのが近衛第一師団だ。"}, {"t": 528.8, "x": "その師団長は森赳 中将。"}, {"t": 531.15, "x": "一番上の人ね。"}, {"t": 532.5833333333334, "x": "そうだ。近衛兵を動かすには、この人の命令がいる。"}, {"t": 535.9333333333333, "x": "この夜、その師団長室を陸軍省の将校たちが訪ねた。"}, {"t": 539.75, "x": "前の晩に陸軍大臣へ計画を持ち込んだ将校たちだ。"}, {"t": 543.3166666666667, "x": "何をしに来たの？"}, {"t": 544.6166666666667, "x": "戦争をやめる決定に従わない\n動きへの、加わりを求めに来た。"}, {"t": 548.6166666666667, "x": "その中に畑中健二 少佐と椎崎二郎 中佐がいた。"}, {"t": 552.45, "x": "井田正孝 中佐もこの夜の師団長室に来ている。"}, {"t": 555.9166666666666, "x": "師団長は、うんと言ったの？"}, {"t": 557.8166666666667, "x": "言っていない。"}, {"t": 558.9333333333333, "x": "森師団長は応じなかった、と\nのちの証言は伝えている。"}, {"t": 562.4166666666666, "x": "部屋にはもう一人いた。"}, {"t": 563.85, "x": "白石通教 中佐。森師団長の義理の弟にあたる人だ。"}, {"t": 567.9166666666666, "x": "別の用事で師団長室を訪れていた。"}, {"t": 570.5166666666667, "x": "たまたま居合わせたのね。"}, {"t": 572.0833333333334, "x": "そうだ。"}, {"t": 573.2166666666667, "x": "そしてこの部屋で、森師団長と\n白石中佐は命を奪われた。"}, {"t": 577.2666666666667, "x": "……え。"}, {"t": 578.4, "x": "誰が手を下したのかはこの回では言わない。"}, {"t": 580.9, "x": "証言に食い違いがあり、\n確かめられない人もいるからだ。"}, {"t": 584.2666666666667, "x": "確かなのは、師団に命令を出せる\n人がいなくなったことだ。"}, {"t": 588.0333333333333, "x": "命令を出せる人が、いない……。"}, {"t": 589.9833333333333, "x": "そしてその空いた場所に、紙が一枚置かれる。"}, {"t": 593.3833333333333, "x": "その紙は師団の命令書だ。"}, {"t": 595.2, "x": "番号は近作命甲第584号。"}, {"t": 597.9666666666667, "x": "防衛庁の戦史室が集めた\n資料に、その文面が残っている。"}, {"t": 601.9333333333333, "x": "中身は分かってるのね。"}, {"t": 603.5333333333333, "x": "分かっている。命令の時刻は\n8月15日の午前2時と書かれている。"}, {"t": 607.8, "x": "最初の項目はこうだ。"}, {"t": 609.3333333333334, "x": "「師団ハ敵ノ謀略ヲ破摧、天皇陛下ヲ奉持、\n我カ国体ヲ護持セントス」"}, {"t": 614.1833333333333, "x": "難しい言葉ね。"}, {"t": 615.5333333333333, "x": "敵のたくらみを打ち破り、天皇を守るという意味だ。"}, {"t": 618.6333333333333, "x": "全部で11項目ある。"}, {"t": 620.25, "x": "2つ目の項目が、この回にとって一番大事だ。"}, {"t": 623.4666666666667, "x": "近衛歩兵第一連隊は、約1つの中隊で\n東京放送局を占領せよ。"}, {"t": 628.2, "x": "そして放送を封じよ。"}, {"t": 629.7833333333333, "x": "放送局を押さえろってこと？"}, {"t": 631.6666666666666, "x": "そうだ。円盤を見つけられなくても、\n流す場所を押さえれば止められる。"}, {"t": 635.7166666666667, "x": "3つ目は、近衛歩兵第二連隊に\n皇居の吹上地区を守らせる命令だ。"}, {"t": 640.1833333333333, "x": "5つ目は二重橋の前で皇居の周りを遮断せよ。"}, {"t": 643.2, "x": "10番目は皇居の通信網を断て、という命令だった。"}, {"t": 646.5333333333333, "x": "電話も止めるのね。"}, {"t": 647.9166666666666, "x": "外と連絡させないということだ。"}, {"t": 650.0, "x": "残りの項目は、ほとんどが「待機せよ」だ。"}, {"t": 653.0, "x": "砲兵も工兵もその場で待てと書かれている。"}, {"t": 655.7333333333333, "x": "全部を動かすわけじゃないのね。"}, {"t": 657.7166666666667, "x": "動かすのは、皇居と放送局と通信に\n関わる部隊に絞られていた。"}, {"t": 662.0, "x": "円盤を探す。放送局を押さえる。電話を断つ。"}, {"t": 665.1, "x": "1枚の紙に全部が書き込まれていた。"}, {"t": 667.6, "x": "でも師団長は、もういないのよね。"}, {"t": 669.8333333333334, "x": "いない。そこがこの命令書の一番おかしなところだ。"}, {"t": 673.5833333333334, "x": "命令書の最後、11番目の項目はこうだ。"}, {"t": 676.5, "x": "「予ハ師団司令部ニ在リ」"}, {"t": 678.0666666666667, "x": "予って？"}, {"t": 679.2, "x": "自分のことだ。私は\n師団司令部にいる、という意味になる。"}, {"t": 682.7833333333333, "x": "そして命令書の名義は「近師長 森赳」。"}, {"t": 685.95, "x": "亡くなった人の名前で出されてるの？"}, {"t": 688.2833333333333, "x": "そうだ。森師団長の名前で偽の命令が出された。"}, {"t": 691.5, "x": "起案したのは畑中少佐とされている。"}, {"t": 693.85, "x": "命令は、師団の参謀だった\n古賀秀正 少佐から部隊へ伝えられた。"}, {"t": 698.4333333333333, "x": "受け取った部隊は疑わなかったの？"}, {"t": 700.6833333333333, "x": "多くの部隊は命令として受け取った。"}, {"t": 702.9, "x": "師団長の名前の命令に逆らうのは、軍では重いことだ。"}, {"t": 706.4166666666666, "x": "だが全部の部隊が動いたわけではない。"}, {"t": 708.7833333333333, "x": "動かなかった部隊があるの？"}, {"t": 710.6, "x": "ある。近衛騎兵連隊だ。"}, {"t": 712.3333333333334, "x": "命令書の6つ目は、戦車の中隊を\n代官町通へ進めよ、だった。"}, {"t": 716.7333333333333, "x": "この連隊の連隊長は命令を不審に思ったとされる。"}, {"t": 719.9333333333333, "x": "そして東部軍の司令部に\n問い合わせ、出動を見合わせた。"}, {"t": 723.4666666666667, "x": "問い合わせるだけで止まったのね。"}, {"t": 725.4166666666666, "x": "紙1枚で動く軍隊は、紙1枚を疑う人がいれば止まる。"}, {"t": 729.2666666666667, "x": "この夜は、その疑いが少しずつ広がっていく。"}, {"t": 732.3, "x": "だが午前2時の時点では、まだ間に合っていない。"}, {"t": 735.1, "x": "近衛歩兵第二連隊は、命令どおりに\n皇居の門を閉じていった。"}, {"t": 739.5833333333334, "x": "門が閉じられ、皇居は外から切り離された。"}, {"t": 742.4333333333333, "x": "宮内省では電話線が切られたと記録されている。"}, {"t": 745.4333333333333, "x": "命令書の10番目ね。"}, {"t": 746.9833333333333, "x": "そうだ。"}, {"t": 748.1166666666667, "x": "皇居の警備をしていた皇宮警察も、\n武器を取り上げられた。"}, {"t": 751.8, "x": "警察まで？"}, {"t": 752.9333333333333, "x": "中で止められる人を先に減らしたということだ。"}, {"t": 755.7666666666667, "x": "こうして宮内省の建物は兵に囲まれた。"}, {"t": 758.45, "x": "建物の中には何人もの人がまだ残っていた。"}, {"t": 761.5166666666667, "x": "宮内大臣の石渡荘太郎。"}, {"t": 763.2666666666667, "x": "内大臣の木戸幸一。"}, {"t": 764.9, "x": "侍従や宮内省の職員たち。"}, {"t": 766.9333333333333, "x": "内大臣って、どんな役目なの？"}, {"t": 769.1833333333333, "x": "天皇のそばで政治の相談を受ける役目だ。"}, {"t": 771.8333333333334, "x": "戦争をやめる流れの中で、\n大きな役を果たした一人とされている。"}, {"t": 776.0, "x": "じゃあ兵たちに狙われる側ね。"}, {"t": 777.95, "x": "そう見られていた。"}, {"t": 779.0666666666667, "x": "外とつながる電話は切れている。"}, {"t": 780.9666666666667, "x": "助けを呼ぶことも、外の様子を聞くこともできない。"}, {"t": 784.2666666666667, "x": "建物ごと閉じ込められたのね。"}, {"t": 786.35, "x": "そうだ。"}, {"t": 787.4833333333333, "x": "そしてこの建物のある\n部屋の小さな金庫に、5枚の円盤がある。"}, {"t": 791.5666666666667, "x": "兵たちは、そこにあるって知ってたの？"}, {"t": 794.0, "x": "最初は知らなかった。"}, {"t": 795.4, "x": "知ったきっかけは別の場所で起きていた。"}, {"t": 797.7333333333333, "x": "命令書にあった放送局のほうだ。"}, {"t": 800.4833333333333, "x": "放送局は内幸町の放送会館にあった。"}, {"t": 803.4833333333333, "x": "命令どおり、近衛兵の中隊がそこを押さえた。"}, {"t": 806.3, "x": "放送会館の職員は閉じ込められたとされる。"}, {"t": 809.2166666666667, "x": "放送局の人なら、円盤のありかを知ってたかも。"}, {"t": 812.5166666666667, "x": "そこだ。"}, {"t": 813.6333333333333, "x": "職員を問いただして、円盤は\n宮内省の中にあると分かった。"}, {"t": 817.35, "x": "記録では、師団参謀の古賀少佐が\nそれを知ったとされている。"}, {"t": 821.1166666666667, "x": "じゃあすぐ探しに行ったのね。"}, {"t": 822.9, "x": "宮内省の中を探すよう命令が出された。"}, {"t": 825.4666666666667, "x": "兵たちは廊下を進み、部屋を一つずつ開けていった。"}, {"t": 828.7166666666667, "x": "探したのは円盤だけではない。"}, {"t": 830.5833333333334, "x": "録音にかかわった人も探していた。"}, {"t": 833.05, "x": "人も？"}, {"t": 834.1833333333333, "x": "円盤を隠した人が分かれば、ありかも分かるからだ。"}, {"t": 837.3333333333334, "x": "宮内大臣の石渡荘太郎と\n内大臣の木戸幸一は建物の中に隠れた。"}, {"t": 842.0666666666667, "x": "金庫室などに身を潜めていたと伝えられる。"}, {"t": 844.9, "x": "見つからなかったの？"}, {"t": 846.3166666666667, "x": "見つからなかった。"}, {"t": 847.5, "x": "宮内省の建物は広く部屋も多い。"}, {"t": 849.7666666666667, "x": "兵たちは、どの部屋に何があるのかも\n分からないまま探した。"}, {"t": 853.4666666666667, "x": "手当たり次第ってこと？"}, {"t": 854.9833333333333, "x": "記録を読む限り、そう見える。"}, {"t": 856.85, "x": "皇后宮職の事務室も、その中の一つにすぎなかった。"}, {"t": 861.2, "x": "円盤を受け取った徳川侍従は、\nこの夜建物の中を動いていた。"}, {"t": 865.2666666666667, "x": "のちの記録では、御文庫へ異変を\n知らせに行っていたとされる。"}, {"t": 868.8333333333334, "x": "天皇のいる所に知らせに行ったのね。"}, {"t": 871.2666666666667, "x": "そうだ。そして宮内省へ戻ってきた。"}, {"t": 873.7, "x": "戻ったところで兵たちと言い合いになった。"}, {"t": 876.2166666666667, "x": "言い合い？"}, {"t": 877.3333333333334, "x": "円盤のありかや人の居場所を\n問われた、と考えられている。"}, {"t": 880.7333333333333, "x": "徳川侍従は答えなかった。"}, {"t": 882.6, "x": "そして兵の一人に殴られた。"}, {"t": 884.6666666666666, "x": "殴られたの？"}, {"t": 885.8, "x": "殴られた。ただ、この話には続きがある。"}, {"t": 888.65, "x": "殴った下士官は、のちに家族に\nこう話したと伝えられている。"}, {"t": 892.4333333333333, "x": "周りの兵が侍従を取り囲んでいて、\nこのままでは命が危ないと思った。"}, {"t": 896.6666666666666, "x": "だから自分が殴って倒し、周りを納得させた、と。"}, {"t": 900.2333333333333, "x": "守るために殴ったってこと？"}, {"t": 902.15, "x": "本人の話としてはそうなる。"}, {"t": 904.1, "x": "この回では、その話を確かめる方法が無い。"}, {"t": 907.0333333333333, "x": "だから、そう伝えられているとだけ言っておく。"}, {"t": 909.6666666666666, "x": "確かなのは、徳川侍従が\n円盤のありかを言わなかったことだ。"}, {"t": 913.5333333333333, "x": "円盤は侍従のすぐ近くの部屋にあったのよね。"}, {"t": 916.4166666666666, "x": "そうだ。殴られた人のすぐ近くの部屋だ。"}, {"t": 919.1833333333333, "x": "兵たちはその部屋の金庫には行き着かなかった。"}, {"t": 922.1333333333333, "x": "ほんの少しの差ね。"}, {"t": 923.5833333333334, "x": "その少しの差のまま、夜は明け方へ向かっていく。"}, {"t": 927.2666666666667, "x": "この夜の宮内省を国会で語った人がいる。"}, {"t": 930.15, "x": "国会で？"}, {"t": 931.2833333333333, "x": "8年後の1953年7月21日。"}, {"t": 934.55, "x": "衆議院の行政監察特別委員会だ。"}, {"t": 937.2333333333333, "x": "別の件の証人として元宮内省の職員が呼ばれた。"}, {"t": 940.65, "x": "終戦のころ、宮内省の総務局で働いていた人だ。"}, {"t": 944.2666666666667, "x": "別の件って？"}, {"t": 945.4666666666667, "x": "終戦の直後に、ある品物が\n宮内省に持ち込まれた件だ。"}, {"t": 949.25, "x": "その日付を聞かれて、証人はこう前置きした。"}, {"t": 952.1833333333333, "x": "「あの当時終戦の詔書が渙発せられました\n八月十四日の晩、私おりましたものですから」"}, {"t": 957.8833333333333, "x": "「そのとき例の録音奪取事件があって、\n宮内省の中は非常に混乱をしたのであります」"}, {"t": 963.2333333333333, "x": "録音奪取事件って呼んでるのね。"}, {"t": 965.4666666666667, "x": "中にいた人にとっては、そういう名前の夜だった。"}, {"t": 968.55, "x": "委員の一人もこう言っている。"}, {"t": 970.2333333333333, "x": "「八月十四日には陛下の録音盤を\n探すために兵隊が相当侵入しております」"}, {"t": 975.35, "x": "国会の記録にも、録音盤を探したことが残ってるのね。"}, {"t": 979.2333333333333, "x": "同じ委員はその年の2月にも、こう話している。"}, {"t": 982.25, "x": "「この録音盤をめぐって\n陸海軍の一部将官あるいは兵隊たちが、\n宮城の中にいろいろな形で侵入して」"}, {"t": 988.7, "x": "「宮内省の金庫の中とか書類」"}, {"t": 990.85, "x": "金庫の中まで探したってこと？"}, {"t": 993.0333333333333, "x": "委員はそういう認識で話している。"}, {"t": 995.1, "x": "だが円盤は見つからなかった。"}, {"t": 996.9666666666667, "x": "そして証人はこうも語った。"}, {"t": 998.85, "x": "「八月の十四日の晩から十五日のあかつきへかけて」"}, {"t": 1002.2, "x": "「宮内省は、一晩のうちに歴史をつくった」"}, {"t": 1005.0166666666667, "x": "「その混乱した状態は想像以上のものでありました」"}, {"t": 1008.2666666666667, "x": "……すごい言い方ね。"}, {"t": 1009.4833333333333, "x": "そのあとの宮内省については、こう続けている。"}, {"t": 1012.3166666666667, "x": "「ずっとひき潮のような静けさを\n持っておったのであります」"}, {"t": 1015.6, "x": "嵐のあとの静けさ、みたいね。"}, {"t": 1017.8333333333334, "x": "中にいた人の言葉だ。"}, {"t": 1019.45, "x": "ではその嵐はどうやって収まったのか。"}, {"t": 1021.7666666666667, "x": "きっかけは1本の電話だった。"}, {"t": 1024.2666666666667, "x": "皇居を囲む部隊を外から見ていた司令部があった。"}, {"t": 1027.2166666666667, "x": "東部軍管区の司令部だ。"}, {"t": 1028.9666666666667, "x": "東部軍って？"}, {"t": 1030.1166666666666, "x": "東京を含む東日本の守りを受け持つ軍だ。"}, {"t": 1033.0333333333333, "x": "この司令部は近衛師団の動きをおかしいと見ていた。"}, {"t": 1035.9666666666667, "x": "師団の参謀長も、この司令部へ来ていたとされる。"}, {"t": 1039.0166666666667, "x": "井田中佐がそれに付いて行き、\n東部軍に加わるよう求めた。"}, {"t": 1042.65, "x": "東部軍は乗ったの？"}, {"t": 1044.0333333333333, "x": "乗らなかった。"}, {"t": 1045.1666666666667, "x": "記録では、東部軍はすでに鎮める\n方針を決めていたとされる。"}, {"t": 1048.8666666666666, "x": "そして午前4時を過ぎたころ。"}, {"t": 1050.65, "x": "東部軍の参謀長が、\n近衛歩兵第二連隊の連隊長と電話でつながった。"}, {"t": 1055.4166666666667, "x": "電話線は切られてたんじゃないの？"}, {"t": 1057.4166666666667, "x": "宮内省の電話は切られていた。だが連隊とは通じた。"}, {"t": 1060.7, "x": "参謀長は連隊長に、師団の命令は\n偽物だと伝えたとされる。"}, {"t": 1064.9666666666667, "x": "偽物って、そこで初めて知ったの？"}, {"t": 1067.5333333333333, "x": "連隊長は森師団長の死をすでに\n知り、疑いを持っていたとされる。"}, {"t": 1071.5333333333333, "x": "そこへ電話ではっきりと告げられた。"}, {"t": 1073.6, "x": "連隊長はその場にいた将校たちに、\n皇居から出るよう命じた。"}, {"t": 1077.45, "x": "これで終わり？"}, {"t": 1078.5666666666666, "x": "まだだ。命じられても全員が\nすぐに引いたわけではない。"}, {"t": 1081.7666666666667, "x": "ここで畑中少佐は皇居を離れる。"}, {"t": 1084.0166666666667, "x": "向かった先は放送会館だった。"}, {"t": 1086.7666666666667, "x": "午前4時半ごろ。"}, {"t": 1088.0, "x": "畑中少佐は放送会館のスタジオに入ったとされる。"}, {"t": 1091.3666666666666, "x": "そして自分たちの声明を放送させろと求めた。"}, {"t": 1094.5, "x": "円盤を止めるんじゃなくて、自分で流そうとしたの？"}, {"t": 1097.6833333333334, "x": "そうだ。"}, {"t": 1098.8166666666666, "x": "放送会館の幹部はその場にいなかった。"}, {"t": 1101.3166666666666, "x": "応じたのは、中堅の職員や\n技術の職員たちだったとされる。"}, {"t": 1105.3166666666666, "x": "銃を持った将校が相手でしょ？"}, {"t": 1107.2166666666667, "x": "ピストルを向けられながらの対応だった、と\n伝えられている。"}, {"t": 1110.6, "x": "職員たちはある決まりを盾にした。"}, {"t": 1112.7333333333333, "x": "空襲警報が出ている間は、\n放送の権限が東部軍の司令部に移る。"}, {"t": 1117.0333333333333, "x": "だから警報が解けるまで、放送会館からは出せない。"}, {"t": 1120.3166666666666, "x": "東部軍の許可がなければ\n放送できない、と言い続けたとされる。"}, {"t": 1124.1, "x": "決まりで断ったのね。"}, {"t": 1125.7, "x": "そうだ。しかも東部軍に電話して\n許可を取ってくれ、と頼んだ。"}, {"t": 1129.6666666666667, "x": "その東部軍は、もう鎮める側よね。"}, {"t": 1132.15, "x": "そういうことになる。"}, {"t": 1133.3166666666666, "x": "この場面は、当日の司会を務めた\n和田信賢 放送員の本に詳しいとされる。"}, {"t": 1138.2666666666667, "x": "翌1946年に出た『放送ばなし』という本だ。"}, {"t": 1142.3, "x": "当日の人がすぐ本に書いたのね。"}, {"t": 1144.6666666666667, "x": "書いたのは本人の見方だ。\nそのことは覚えておいてほしい。"}, {"t": 1148.0833333333333, "x": "結局、畑中少佐の声明が電波に乗ることはなかった。"}, {"t": 1151.7833333333333, "x": "東部軍に放送を断られ、\n少佐は放送会館をあとにした。"}, {"t": 1155.5666666666666, "x": "外はもう明るくなり始めていた。"}, {"t": 1158.25, "x": "午前5時ごろ。"}, {"t": 1159.2666666666667, "x": "東部軍管区の司令官、田中静壱 大将が動いた。"}, {"t": 1162.85, "x": "わずかな供を連れて、自ら\n近衛第一師団の司令部へ向かったとされる。"}, {"t": 1167.3, "x": "一番上の人が直接行ったの？"}, {"t": 1169.5833333333333, "x": "そうだ。"}, {"t": 1170.7166666666667, "x": "司令部では、偽の命令で\n部隊を出そうとしていた連隊長を止めた。"}, {"t": 1174.6833333333334, "x": "そのあと皇居の中へ入り、乾門の\nあたりで連隊長に会った。"}, {"t": 1178.4833333333333, "x": "そして兵を引き揚げるよう命じたとされる。"}, {"t": 1181.0, "x": "これで兵は引いたの？"}, {"t": 1182.4, "x": "ここから一気に静まっていった、と記録は書いている。"}, {"t": 1185.5333333333333, "x": "田中大将は御文庫と宮内省にも回ったとされる。"}, {"t": 1188.65, "x": "事態が収まったことを伝えるためだ。"}, {"t": 1191.0166666666667, "x": "田中大将が鎮めた、ってことでいいの？"}, {"t": 1193.6166666666666, "x": "そこは見方が二つある。"}, {"t": 1195.2, "x": "田中大将が鎮めたという見方。"}, {"t": 1197.4, "x": "その前に将校たちが、もうあきらめていたという見方。"}, {"t": 1200.6333333333334, "x": "どちらが正しいかは、ここでは決めずに置く。"}, {"t": 1203.35, "x": "決めないのね。"}, {"t": 1204.4833333333333, "x": "決められるだけの記録がそろっていないからだ。"}, {"t": 1207.0833333333333, "x": "同じころ、陸軍大臣の官邸でも\n一つのことが起きている。"}, {"t": 1210.85, "x": "阿南惟幾 陸軍大臣が、この朝に命を絶った。"}, {"t": 1214.5666666666666, "x": "陸軍大臣が？"}, {"t": 1215.9, "x": "そうだ。ただし、この夜の計画に\n加わっていたわけではない。"}, {"t": 1219.5333333333333, "x": "同じ朝に起きたことだと、\nここでは並べて置くだけにする。"}, {"t": 1222.9666666666667, "x": "午前8時前には近衛兵は皇居から引き揚げた。"}, {"t": 1225.9833333333333, "x": "隠れていた宮内大臣の石渡荘太郎と\n内大臣の木戸幸一も、外へ出て御文庫へ向かった。"}, {"t": 1232.3, "x": "兵が引いて、金庫の円盤が\nようやく動かせるようになった。"}, {"t": 1235.7333333333333, "x": "放送まであと4時間ほどだ。"}, {"t": 1237.65, "x": "すぐに放送局へ運んだのね。"}, {"t": 1239.7666666666667, "x": "運んだ。だがその運び方に工夫があった。"}, {"t": 1242.5333333333333, "x": "円盤は2つに分けて運ばれた。"}, {"t": 1244.7333333333333, "x": "2つに？"}, {"t": 1245.85, "x": "2回目に録った正本と、1回目に録った方の盤だ。"}, {"t": 1249.2166666666667, "x": "正本は内幸町の放送会館へ。"}, {"t": 1251.65, "x": "1回目の盤は、別に用意してあった\n予備のスタジオへ運ばれたとされる。"}, {"t": 1255.9666666666667, "x": "予備のスタジオもあったのね。"}, {"t": 1257.7666666666667, "x": "放送会館が使えなくなったときの備えだ。"}, {"t": 1260.5666666666666, "x": "そして運び方の工夫はここからだ。"}, {"t": 1262.8666666666666, "x": "1回目の盤のほうを、いかにも\n大事な使いらしく仕立てた。"}, {"t": 1266.3833333333334, "x": "天皇の使いである勅使のような\n形にした、と伝えられている。"}, {"t": 1270.3666666666666, "x": "じゃあ正本は？"}, {"t": 1271.5, "x": "正本は目立たない袋に入れて、\n木炭で走る車で運んだとされる。"}, {"t": 1275.9166666666667, "x": "本物をわざと地味にしたのね。"}, {"t": 1277.9333333333334, "x": "まだ皇居の外には、何が\n起きるか分からない状況だった。"}, {"t": 1281.4666666666667, "x": "狙われるなら目立つほうが狙われる。"}, {"t": 1283.6666666666667, "x": "1回目の盤を捨てなかったのは、\nこういうことだったのね。"}, {"t": 1287.0833333333333, "x": "結果としてそうなった。"}, {"t": 1288.5666666666666, "x": "替えがあることが、正本を守る盾になった。"}, {"t": 1291.3333333333333, "x": "正本の5枚は放送会館に着いた。"}, {"t": 1293.6833333333334, "x": "だがその近くで、まだ終わっていない人たちがいた。"}, {"t": 1297.4, "x": "畑中少佐と椎崎中佐は、放送会館を\n出たあとも皇居のまわりにいた。"}, {"t": 1301.9333333333334, "x": "決起を呼び掛けるビラをまいたとされる。"}, {"t": 1304.25, "x": "まだあきらめてなかったの？"}, {"t": 1305.9166666666667, "x": "最後まで、と記録は書いている。"}, {"t": 1307.9333333333334, "x": "そして午前11時を過ぎたころ。"}, {"t": 1310.0, "x": "二人は二重橋と\n坂下門のあいだの芝生の上で、命を絶った。"}, {"t": 1314.2, "x": "……坂下門って、最初に\n下村さんたちが止められた所よね。"}, {"t": 1318.2333333333333, "x": "そうだ。この夜の始まりと\n終わりが同じ門のそばにある。"}, {"t": 1321.5666666666666, "x": "放送のための声明の原稿は、\n二人とともに失われたとされる。"}, {"t": 1325.7, "x": "放送されなかった声明ね。"}, {"t": 1327.6, "x": "そうだ。円盤に録られた声は残り、\n録られなかった声は消えた。"}, {"t": 1331.4166666666667, "x": "もう一人、師団参謀の古賀少佐も\nこの日に命を絶っている。"}, {"t": 1335.1, "x": "場所は近衛第一師団の司令部。"}, {"t": 1337.1666666666667, "x": "森師団長の遺体が安置された部屋だったとされる。"}, {"t": 1340.2833333333333, "x": "師団長の前で……。"}, {"t": 1341.55, "x": "古賀少佐がこの計画にどこまで\n加わっていたかは、はっきりしていない。"}, {"t": 1345.65, "x": "だからここではそれ以上は言わない。"}, {"t": 1347.5833333333333, "x": "井田中佐は、この日陸軍省で\n命を絶とうとしたとされる。"}, {"t": 1351.1, "x": "だが見張っていた将校に止められ、生き延びた。"}, {"t": 1354.0, "x": "生き延びた人もいるのね。"}, {"t": 1355.7, "x": "いる。井田中佐は戦後を生き、\n2004年に亡くなっている。"}, {"t": 1359.1666666666667, "x": "この夜に関わった人の中には、\nのちに証言を残した人がいる。"}, {"t": 1363.2666666666667, "x": "この回で使っている流れの多くは、\nそうした証言に基づいている。"}, {"t": 1367.2166666666667, "x": "そして正午が近づいてくる。"}, {"t": 1369.6166666666666, "x": "ねえ、時刻がたくさん出てきて、\nちょっと混ざってきた。"}, {"t": 1372.9833333333333, "x": "なら一度並べ直そう。"}, {"t": 1374.45, "x": "8月14日の午後11時。"}, {"t": 1376.3333333333333, "x": "詔書が官報号外で発せられる。"}, {"t": 1378.4666666666667, "x": "午後11時25分。天皇が内廷庁舎へ\n向かい、録音が2回行われる。"}, {"t": 1383.25, "x": "15日の午前0時5分。"}, {"t": 1384.8333333333333, "x": "天皇が御文庫へ戻る。"}, {"t": 1386.35, "x": "午前0時過ぎ。坂下門で下村総裁たちが止められる。"}, {"t": 1390.0666666666666, "x": "そのあと師団長室で、森師団長と\n白石中佐の命が奪われる。"}, {"t": 1394.3, "x": "午前2時。偽の師団命令が出る。"}, {"t": 1396.6833333333334, "x": "ここまでで、まだ3時間たってないのね。"}, {"t": 1399.3, "x": "たっていない。"}, {"t": 1400.4333333333334, "x": "午前4時過ぎ。東部軍の参謀長が、\n連隊長に命令は偽物だと伝える。"}, {"t": 1405.25, "x": "午前4時半ごろ。畑中少佐が\n放送会館で声明を流せと迫る。"}, {"t": 1409.6, "x": "午前5時ごろ。田中大将が師団の司令部へ向かう。"}, {"t": 1412.7333333333333, "x": "午前8時前。近衛兵が皇居から引き揚げる。"}, {"t": 1415.6833333333334, "x": "午前11時過ぎ。畑中少佐と\n椎崎中佐が宮城の前で命を絶つ。"}, {"t": 1420.3166666666666, "x": "そして正午。正本の円盤が回る。"}, {"t": 1422.8333333333333, "x": "円盤はそのあいだ、ずっと金庫の中だったのね。"}, {"t": 1425.95, "x": "録音のあと金庫に入り、兵が引くまで動いていない。"}, {"t": 1429.15, "x": "時刻の大半は、のちの証言と戦史からとったものだ。"}, {"t": 1432.6333333333334, "x": "分単位までは資料ごとにずれがある。"}, {"t": 1434.7, "x": "だが順番は動かない。"}, {"t": 1436.2666666666667, "x": "順番だけは確か。"}, {"t": 1437.7833333333333, "x": "そうだ。最後の一つ、正午の放送を見ていく。"}, {"t": 1441.5166666666667, "x": "8月15日、正午。"}, {"t": 1443.3166666666666, "x": "ラジオからまず放送の予告が流れた。"}, {"t": 1445.6833333333334, "x": "話したのは下村情報局総裁だと伝えられている。"}, {"t": 1449.15, "x": "夜中に閉じ込められた、あの下村さん？"}, {"t": 1451.7833333333333, "x": "そうだ。朝には解放されていた。"}, {"t": 1453.9333333333334, "x": "12時間前に門で止められた\n人が、正午には予告をしている。"}, {"t": 1457.9333333333334, "x": "同じ日のことなのね。"}, {"t": 1459.5, "x": "同じ日だ。続いて君が代が流れた。"}, {"t": 1461.9333333333334, "x": "そして正本の円盤が回り始めた。"}, {"t": 1464.4, "x": "5枚のうち、どれが使われたの？"}, {"t": 1466.5666666666666, "x": "宮内庁は、2回目の録音盤が\n正本として放送されたと書いている。"}, {"t": 1470.8, "x": "どの盤を何番目にかけたかまでは、\nこの回の資料では確かめられなかった。"}, {"t": 1475.3666666666666, "x": "そこは言わないのね。"}, {"t": 1476.7333333333333, "x": "言わない。"}, {"t": 1477.8666666666666, "x": "放送の直前にも、放送会館で\n一つの騒ぎがあったとされる。"}, {"t": 1481.9166666666667, "x": "スタジオの前で一人の将校が刀を抜こうとしたという。"}, {"t": 1485.2333333333333, "x": "すぐに取り押さえられ、\n連れ出されたと伝えられている。"}, {"t": 1488.3833333333334, "x": "最後の最後まで……。"}, {"t": 1489.7166666666667, "x": "最後の最後まで、円盤は狙われていたことになる。"}, {"t": 1492.8, "x": "それでも声は予定どおりに流れた。"}, {"t": 1494.8833333333334, "x": "前の晩に、宮内省の一室で2回読まれた声だ。"}, {"t": 1498.1333333333334, "x": "止めようとした夜のことを、聞いている\n人たちは知らなかったのよね。"}, {"t": 1502.0666666666666, "x": "知らなかった。"}, {"t": 1503.2, "x": "国民がこの夜のことを知るのは、\nずっとあとになってからだ。"}, {"t": 1506.7333333333333, "x": "その前に、国会の記録に残った言葉の数を見ておく。"}, {"t": 1510.8666666666666, "x": "ここで一つ数を数えてみた。"}, {"t": 1512.7666666666667, "x": "国会の会議録で「録音盤」という言葉を引いてみる。"}, {"t": 1516.2166666666667, "x": "出てくるのは64件だった。"}, {"t": 1518.35, "x": "64件？　思ったより多いわね。"}, {"t": 1520.6833333333334, "x": "だがほとんどは別の話だ。"}, {"t": 1522.5333333333333, "x": "選挙で録音盤を使ってよいか、という議論。"}, {"t": 1525.2833333333333, "x": "大臣に出された録音盤の中身を問う議論。"}, {"t": 1527.9833333333333, "x": "終戦の夜の録音盤に触れているのは、\nそのうち5件だった。"}, {"t": 1531.7, "x": "しかも4件は、\n1953年の同じ委員会での同じ委員の発言だ。"}, {"t": 1536.6166666666666, "x": "少ないのね。"}, {"t": 1537.7666666666667, "x": "「宮城事件」という名前で引くと、2件しかない。"}, {"t": 1540.85, "x": "しかも1件は同じ名前の別の件だった。"}, {"t": 1543.6333333333334, "x": "国会では、あまり話されなかったってこと？"}, {"t": 1546.4166666666667, "x": "この会議録が始まるのは1947年からだ。"}, {"t": 1549.9166666666667, "x": "事件はその2年前に起きている。"}, {"t": 1551.95, "x": "裁判も無かったから、法律の議論にもなりにくい。"}, {"t": 1555.0666666666666, "x": "出てくるのは、別の話のついでに\n触れられる形がほとんどだ。"}, {"t": 1558.85, "x": "宮内省に品物が持ち込まれた件。"}, {"t": 1560.95, "x": "恩給の審査の件。軍法会議の件。"}, {"t": 1563.6, "x": "ついでに出てくる、か。"}, {"t": 1565.1166666666666, "x": "2007年には、ある議員がこう触れている。"}, {"t": 1567.7, "x": "「玉音放送のあのレコード盤が軍部の一部の方に\n取られそうになって放送ができなくなる」"}, {"t": 1572.8333333333333, "x": "62年たっても言い表し方は同じだ。"}, {"t": 1575.5166666666667, "x": "あの夜はレコード盤の夜として覚えられている。"}, {"t": 1578.1333333333334, "x": "では、この夜を起こした人たちは\nそのあとどうなったのか。"}, {"t": 1582.0833333333333, "x": "師団長と参謀の命が奪われ、偽の命令が出された。"}, {"t": 1585.6166666666666, "x": "皇居は兵に囲まれ、放送局も押さえられた。"}, {"t": 1588.6666666666667, "x": "それって軍の中でも重い罪よね。"}, {"t": 1590.9333333333334, "x": "当時の軍の法でも、明らかに重い罪にあたる。"}, {"t": 1593.8833333333334, "x": "だがこの夜に関わった将校たちは、\n軍法会議にかけられていない。"}, {"t": 1598.0333333333333, "x": "裁判が無かったの？"}, {"t": 1599.5, "x": "無かった。"}, {"t": 1600.6333333333334, "x": "裁くはずの陸軍そのものが、\nそのあと解体されたからだ。"}, {"t": 1604.2333333333333, "x": "中心にいた人の多くは、\nこの日のうちに命を絶っていた。"}, {"t": 1607.75, "x": "生き延びた人も、裁かれないまま戦後を迎えた。"}, {"t": 1610.9, "x": "ほかの事件でもそうだったの？"}, {"t": 1612.8, "x": "そこで比べられた事件がある。"}, {"t": 1614.6333333333334, "x": "1973年4月5日。"}, {"t": 1616.9, "x": "参議院の予算委員会の分科会だ。"}, {"t": 1619.2333333333333, "x": "厚生省の援護局長がこう答えている。"}, {"t": 1621.7, "x": "「陸軍における宮城事件等も同じような終戦時に\nおける徹底抗戦を叫んだ人たちによりまして」"}, {"t": 1627.5833333333333, "x": "「宮城内におきまして陛下の録音盤を奪うとか」"}, {"t": 1630.7166666666667, "x": "ここにも録音盤が出てくるのね。"}, {"t": 1632.8666666666666, "x": "出てくる。比べられていたのは、\n厚木の海軍の航空隊の事件だ。"}, {"t": 1636.9666666666667, "x": "終戦のあと、降伏するなと呼び掛けた事件だった。"}, {"t": 1640.2166666666667, "x": "局長は、こちらは海軍の軍法会議で\n裁かれたと答えている。"}, {"t": 1644.1, "x": "質問した議員はこう言った。"}, {"t": 1645.8666666666666, "x": "「ビラをまいただけでこの人は\n終身禁錮になったわけなんです」"}, {"t": 1649.5, "x": "ビラだけで終身……。"}, {"t": 1650.7833333333333, "x": "議員は、69人がこの罪に問われたとも言っている。"}, {"t": 1654.1666666666667, "x": "片方は裁かれ、片方は裁く場が無かった。"}, {"t": 1657.1, "x": "この日、答弁に立った厚生大臣はこう述べている。"}, {"t": 1660.2166666666667, "x": "「何とかこれはしてあげなければならぬなという\n私感じを率直にいたします」"}, {"t": 1664.6833333333334, "x": "大臣も、気の毒だと思ってたのね。"}, {"t": 1667.2166666666667, "x": "裁かれた側には判決の記録が\n残り、こうして国会で語られた。"}, {"t": 1671.3833333333334, "x": "裁かれなかった側には、その記録そのものが無い。"}, {"t": 1674.4833333333333, "x": "その差が、28年たっても国会で\n問われていたことになる。"}, {"t": 1678.8666666666666, "x": "この夜は、戦後の別の場面でも国会に出てくる。"}, {"t": 1682.0333333333333, "x": "恩給の話だ。"}, {"t": 1683.4, "x": "恩給って？"}, {"t": 1684.5333333333333, "x": "国のために働いた人や遺族に、国が出すお金だ。"}, {"t": 1687.9666666666667, "x": "終戦のころに亡くなった軍人が、\n国の務めで亡くなったと言えるのか。"}, {"t": 1692.25, "x": "その審査がなかなか進まなかった。"}, {"t": 1694.5, "x": "1954年2月24日。"}, {"t": 1696.8, "x": "衆議院の内閣委員会。"}, {"t": 1698.5333333333333, "x": "審査を早めるよう求めた議員がこう言っている。"}, {"t": 1701.2, "x": "「終戦時に森師団長を殺して\n自決した、こういう人と違います」"}, {"t": 1705.35, "x": "「こっちにおって反乱を起して自決したのと\n違います。こういう方は別の話であります」"}, {"t": 1710.7166666666667, "x": "この夜の将校たちは別にしろってこと？"}, {"t": 1713.3166666666666, "x": "議員は、外地で追い詰められて\n亡くなった兵を先に救え、と言っていた。"}, {"t": 1717.5166666666667, "x": "そのとき、この夜の死を例に出してはっきり分けた。"}, {"t": 1720.7, "x": "じゃあ命を奪われた側の師団長たちは？"}, {"t": 1723.2666666666667, "x": "1958年3月5日の同じ委員会で、\n別の議員がそこに触れている。"}, {"t": 1728.25, "x": "近衛師団長や田中司令官は、脅しに応じずに拒んだ。"}, {"t": 1731.8333333333333, "x": "そしてこう続けた。"}, {"t": 1733.15, "x": "「それらの遺族に対しての手当は\nほとんどしておりません」"}, {"t": 1736.35, "x": "遺族の人たちには、何も無かったの？"}, {"t": 1738.9666666666667, "x": "議員はそう訴えた。それが事実か\nどうかは、この回では確かめていない。"}, {"t": 1743.3, "x": "それにこの議員は、田中司令官も\n殺されたように話している。"}, {"t": 1747.0166666666667, "x": "実際には、田中大将は8月24日に自ら命を絶っている。"}, {"t": 1751.45, "x": "記憶も混ざっていくのね。"}, {"t": 1753.1333333333334, "x": "13年たてば、国会の中でも混ざる。"}, {"t": 1755.7666666666667, "x": "だから記録を一つずつ開く意味がある。"}, {"t": 1758.8166666666666, "x": "話を円盤に戻す。"}, {"t": 1760.3333333333333, "x": "放送が終わったあと、正本の5枚は保管された。"}, {"t": 1763.3833333333334, "x": "だがずっと金庫の中にあったわけではない。"}, {"t": 1765.9333333333334, "x": "どこかに出たの？"}, {"t": 1767.15, "x": "1946年の7月。"}, {"t": 1769.4, "x": "原盤は連合国軍の総司令部に貸し出された。"}, {"t": 1772.3666666666666, "x": "いわゆるGHQだ。期間は9日間だったとされる。"}, {"t": 1775.8833333333334, "x": "何のために？"}, {"t": 1777.0166666666667, "x": "複製を作るためだ。"}, {"t": 1778.45, "x": "返されたあと、原盤は\n皇室の持ち物として宮内庁が保管した。"}, {"t": 1782.7166666666667, "x": "じゃあ、いままで流れてた玉音放送は？"}, {"t": 1785.2833333333333, "x": "そこが面白いところだ。"}, {"t": 1786.8333333333333, "x": "テレビなどで流れてきた音は、原盤から\n直接とったものではないとみられている。"}, {"t": 1791.5333333333333, "x": "GHQが作った複製を、さらに\n何度も写したものだという。"}, {"t": 1795.5666666666666, "x": "コピーのコピー、ってこと？"}, {"t": 1797.2, "x": "そういうことになる。"}, {"t": 1798.3833333333334, "x": "写すたびに音は少しずつ変わっていく。"}, {"t": 1800.9166666666667, "x": "じゃあ本物の音は、誰も聞いてなかったの？"}, {"t": 1803.6666666666667, "x": "原盤は長いあいだ、\n再生されないまま保管されていた。"}, {"t": 1807.0333333333333, "x": "宮内庁は、1946年5月の天皇のお言葉の原盤も\n一緒に保管してきたと書いている。"}, {"t": 1813.15, "x": "食糧の問題について語った別の録音だ。"}, {"t": 1816.0, "x": "2つの原盤が並んでしまわれていた。"}, {"t": 1818.35, "x": "それがもう一度回る日が来る。"}, {"t": 1820.7833333333333, "x": "平成27年、2015年の8月1日。"}, {"t": 1824.1, "x": "宮内庁は先の大戦に関わる資料を公表した。"}, {"t": 1827.1833333333334, "x": "戦後70年の節目としてだ。"}, {"t": 1829.2833333333333, "x": "その中に玉音放送の原盤があった。"}, {"t": 1831.7833333333333, "x": "70年ぶりに再生を試み、天皇の声を\n直接取り出すことに成功した。"}, {"t": 1836.75, "x": "70年前の円盤が、まだ鳴ったのね。"}, {"t": 1839.4833333333333, "x": "鳴った。宮内庁はその音を公開している。"}, {"t": 1842.1166666666666, "x": "録音盤と、それを入れていた缶の写真も出した。"}, {"t": 1845.2833333333333, "x": "缶に入ってたのね。"}, {"t": 1846.75, "x": "宮内庁の写真には収納缶と書かれている。"}, {"t": 1849.4166666666667, "x": "この日、宮内庁はほかの資料も一緒に出している。"}, {"t": 1852.45, "x": "8月14日の御前会議が開かれた、\n御文庫附属庫の写真と映像だ。"}, {"t": 1857.1833333333334, "x": "最初に出てきた会議の場所ね。"}, {"t": 1859.2666666666667, "x": "そうだ。声が決まった場所と声を\n入れた円盤が、同じ日に公表された。"}, {"t": 1863.6, "x": "そして、聞き比べた人たちが気づいたことがある。"}, {"t": 1866.6333333333334, "x": "原盤の音は、それまで出回っていた\n音より10秒以上短かった。"}, {"t": 1870.8, "x": "短い？　同じ録音なのに？"}, {"t": 1872.8, "x": "なぜ短くなったのか、くわしい\n理由はこの回では確かめていない。"}, {"t": 1876.6333333333334, "x": "確かなのは、写した音と\n原盤の音の長さが違ったことだ。"}, {"t": 1880.5333333333333, "x": "原盤の声は、それまでより\n聞き取りやすかったとも言われた。"}, {"t": 1884.1833333333334, "x": "70年間、少し違う声を聞いてたってことね。"}, {"t": 1887.4666666666667, "x": "そういうことになる。"}, {"t": 1888.6666666666667, "x": "あの夜、兵たちが探して見つけられなかった円盤だ。"}, {"t": 1891.95, "x": "それがいま、宮内庁の公表で\n写真と音になって残っている。"}, {"t": 1895.7166666666667, "x": "5枚とも無事だったの？"}, {"t": 1897.3, "x": "宮内庁は2回目の盤5枚を正本として書いている。"}, {"t": 1900.4166666666667, "x": "そして大切に保管されてきたと書いている。"}, {"t": 1903.05, "x": "この回で言えるのはそこまでだ。"}, {"t": 1905.4833333333333, "x": "この回で使った記録を、順に挙げておく。"}, {"t": 1908.1333333333334, "x": "5枚と2回、70年ぶりの再生は、\n宮内庁の平成27年8月1日の公表だ。"}, {"t": 1914.05, "x": "8月14日の時刻は、昭和天皇実録を\n引いた記事を使った。"}, {"t": 1918.3333333333333, "x": "詔書の原本の直し方は国立公文書館の説明だ。"}, {"t": 1921.9333333333334, "x": "録音機の型と片面3分は、当時の機材を紹介した記事。"}, {"t": 1925.9166666666667, "x": "命令書の文面は、防衛庁の戦史室の資料の翻刻だ。"}, {"t": 1929.6166666666666, "x": "1953年の証人の言葉は、\n7月21日の衆議院行政監察特別委員会 第8号。"}, {"t": 1936.6166666666666, "x": "1954年の発言は、\n2月24日の衆議院内閣委員会 第6号。"}, {"t": 1941.9833333333333, "x": "1958年の発言は、\n3月5日の衆議院内閣委員会 第9号。"}, {"t": 1947.3166666666666, "x": "1973年の答弁は、\n4月5日の参議院予算委員会第四分科会 第1号だ。"}, {"t": 1953.4333333333334, "x": "GHQへの貸し出しと10秒の差は、\n事典の解説を使った。"}, {"t": 1957.5833333333333, "x": "一晩の細かい時刻は？"}, {"t": 1959.3666666666666, "x": "防衛庁がまとめた戦史と、\nのちの証言をまとめた本によっている。"}, {"t": 1963.3666666666666, "x": "だから「とされる」と付けて話した。"}, {"t": 1965.7833333333333, "x": "名前を出したのは、亡くなったことを\n確かめた人と公人だけだ。"}, {"t": 1969.7, "x": "手を下した人の名前と、亡くなり方は話していない。"}, {"t": 1973.0666666666666, "x": "昭和天皇や政府の判断が正しかったか\nどうかも、決めていない。"}, {"t": 1977.5666666666666, "x": "ねえ、最初の数字に戻っていい？"}, {"t": 1979.7333333333333, "x": "いいぞ。"}, {"t": 1980.8666666666666, "x": "5枚って聞いたとき、多いなって思ったの。"}, {"t": 1983.55, "x": "1枚に片面3分しか入らない時代だった。"}, {"t": 1986.6, "x": "でも今は少ないって思う。"}, {"t": 1988.3666666666666, "x": "どうしてだ。"}, {"t": 1989.5, "x": "一晩じゅう、宮内省の中を兵が探してたんでしょ。"}, {"t": 1992.6333333333334, "x": "5枚なんて、どこにでも隠れちゃう数よね。"}, {"t": 1995.3833333333334, "x": "小さな金庫に収まる数だった。"}, {"t": 1997.4833333333333, "x": "そしてそれを隠した人は、殴られても言わなかった。"}, {"t": 2000.8, "x": "止めようとした人たちが探したのは円盤だった。"}, {"t": 2003.7666666666667, "x": "守った人たちが守ったのも円盤だった。"}, {"t": 2006.4666666666667, "x": "どちらも、声が人に届くかどうかを争っていた。"}, {"t": 2009.5666666666666, "x": "紙の詔書は、前の晩の11時にはもう出ていた。"}, {"t": 2012.6666666666667, "x": "それでも国民が終わりを\n知ったのは、声を聞いたときだ。"}, {"t": 2015.9833333333333, "x": "だからあの夜は、円盤の取り合いになったのね。"}, {"t": 2018.8666666666666, "x": "そうだ。"}, {"t": 2020.0, "x": "裁かれなかった人がいて、遺族に手当が\n届かなかったと訴えた議員がいた。"}, {"t": 2024.65, "x": "その一方で、円盤は70年ぶりにもう一度回った。"}, {"t": 2028.15, "x": "録られた声は残って、録られなかった声は消えた。"}, {"t": 2031.25, "x": "あの夜に残ったものは、\n宮内庁の写真に写っている5枚だ。"}, {"t": 2034.95, "x": "坂下門で止められた人たちが、\n宮内省に置いてきた円盤だ。"}, {"t": 2039.0166666666667, "x": "もし、あの金庫が見つかってたら？"}, {"t": 2041.25, "x": "それはこの回では考えない。"}, {"t": 2042.9833333333333, "x": "記録に無いことを足すと、記録のほうが見えなくなる。"}, {"t": 2046.2, "x": "……そうね。あったことだけで、もう十分重いもの。"}, {"t": 2049.116666666667, "x": "置いてきて、よかったのね。"}, {"t": 2050.95, "x": "それは聞いた人それぞれが決めればいい。"}, {"t": 2053.116666666667, "x": "記録に残っているのは、置いてきた\n円盤が正午に回ったということだけだ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
