<script>
const D={"name": "106", "file": "106_編集用", "dur": 2079.25, "segs": [], "subs": [{"t": 0.0, "x": "戸高某と市木某が、同一人である。"}, {"t": 2.466666666666667, "x": "1957年3月15日。"}, {"t": 4.866666666666666, "x": "衆議院の法務委員会で、委員長がそう言った。"}, {"t": 7.9, "x": "とだか？　いちき？"}, {"t": 9.216666666666667, "x": "2つとも人の名前だ。"}, {"t": 10.883333333333333, "x": "市木春秋は大分県の山あいの村にいた男の名前。"}, {"t": 14.233333333333333, "x": "戸高公徳は大分県の警察にいた巡査部長の名前だ。"}, {"t": 17.866666666666667, "x": "その2人が同じ人だった。"}, {"t": 19.833333333333332, "x": "同じ人ってどういうこと？"}, {"t": 21.55, "x": "村では市木と名乗っていた。でも\n本当は警察官だった。"}, {"t": 25.133333333333333, "x": "その日の委員会で、警察庁の長官がそれを認めた。"}, {"t": 28.6, "x": "委員長はこう続けている。"}, {"t": 30.166666666666668, "x": "前回の委員会まで謎に包まれていた\n問題が、きょう明らかになった、と。"}, {"t": 34.8, "x": "その村で何かあったのね。"}, {"t": 36.6, "x": "あった。1952年6月2日の未明。"}, {"t": 39.8, "x": "村の駐在所で、ダイナマイトが爆発した。"}, {"t": 42.75, "x": "駐在所で？　誰がそんなことを？"}, {"t": 44.88333333333333, "x": "それが、いまも分かっていない。"}, {"t": 46.7, "x": "判決は、誰が仕掛けたのかを最後まで書かなかった。"}, {"t": 50.15, "x": "え、それで終わったの？"}, {"t": 51.65, "x": "まだある。爆発のあと、\n市木春秋という男が村から消えた。"}, {"t": 55.65, "x": "行方が知れないまま、4年9か月がたった。"}, {"t": 58.63333333333333, "x": "4年9か月も？"}, {"t": 60.03333333333333, "x": "東京のアパートでその男を\n見つけたのは、警察ではない。"}, {"t": 63.333333333333336, "x": "通信社の記者たちだった。"}, {"t": 65.23333333333333, "x": "警察官が、なんで名前を変えて村にいたの？"}, {"t": 68.18333333333334, "x": "そこがこの事件のいちばん大きな穴だ。"}, {"t": 70.5, "x": "今回は国会の会議録に残った言葉を手がかりにする。"}, {"t": 73.98333333333333, "x": "1956年から1989年まで、\n30年以上にわたって残っている。"}, {"t": 79.56666666666666, "x": "誰が何を言って、何を言わなかったのか。"}, {"t": 81.96666666666667, "x": "順番に並べていく。"}, {"t": 83.58333333333333, "x": "まずはその村からね。"}, {"t": 85.11666666666666, "x": "ああ。大分県の真ん中より少し南の、山の中だ。"}, {"t": 89.31666666666666, "x": "場所は大分県直入郡菅生村。"}, {"t": 91.51666666666667, "x": "いまの竹田市菅生にあたる。"}, {"t": 93.38333333333334, "x": "すごうって読むのね。"}, {"t": 94.75, "x": "そうだ。竹田は阿蘇とくじゅうの山にはさまれた町だ。"}, {"t": 97.93333333333334, "x": "1989年の国会で、ある本の一節が\n読み上げられている。"}, {"t": 102.3, "x": "わずか戸数200あまりの農村で\n起こった駐在所の爆破事件、と。"}, {"t": 106.43333333333334, "x": "200軒くらいの村なのね。"}, {"t": 108.3, "x": "顔を知らない人のほうが少ない。そういう大きさだ。"}, {"t": 111.36666666666666, "x": "村には駐在所が1つあった。"}, {"t": 113.36666666666666, "x": "巡査が家族と一緒に住みこんで、村の見回りをする。"}, {"t": 116.78333333333333, "x": "交番と家がひとつになってるのよね。"}, {"t": 119.13333333333334, "x": "そうだ。建物の片側が事務所で、\n奥が住まいになっている。"}, {"t": 122.9, "x": "時代は1952年。戦争が終わって7年だ。"}, {"t": 126.38333333333334, "x": "この年の4月に、占領が終わって\n日本は独立を取りもどした。"}, {"t": 130.41666666666666, "x": "独立したばかりの年なのね。"}, {"t": 132.51666666666668, "x": "その3日後の5月1日には、\n皇居前の広場で大きな衝突も起きている。"}, {"t": 137.11666666666667, "x": "メーデーの日に、デモ隊と警察がぶつかった事件だ。"}, {"t": 140.31666666666666, "x": "警察庁の長官は、菅生の話をするときに\nこの事件の名前も挙げている。"}, {"t": 145.05, "x": "警察は、そういう空気の中にいたのね。"}, {"t": 147.71666666666667, "x": "長官の説明では、そうなる。"}, {"t": 149.71666666666667, "x": "同じころ国会では1つの法律が\n大きな争いになっていた。"}, {"t": 153.41666666666666, "x": "破壊活動防止法だ。"}, {"t": 155.0, "x": "暴力で国をひっくり返そうとする\n団体を取りしまる法律だ。"}, {"t": 158.65, "x": "これが公布されたのは、1952年7月21日。"}, {"t": 162.7, "x": "菅生の爆発から、7週間ほどあとになる。"}, {"t": 165.76666666666668, "x": "時期が近いのね。"}, {"t": 167.1, "x": "近い。ただこの2つを結びつけた判決はない。"}, {"t": 170.11666666666667, "x": "ここでは同じ年に起きたこととして置いておく。"}, {"t": 172.78333333333333, "x": "警察庁の長官は、のちに国会で\n当時の村の様子をこう説明した。"}, {"t": 177.25, "x": "その前の年から、共産党が村で強く活動していた。"}, {"t": 180.86666666666667, "x": "村の有力者とのあいだで、もめごとが続いていた、と。"}, {"t": 184.36666666666667, "x": "それは警察から見た説明なのよね。"}, {"t": 186.81666666666666, "x": "そうだ。警察の側がそう言った、というところまでだ。"}, {"t": 190.05, "x": "これは1952年の話だ。"}, {"t": 192.28333333333333, "x": "今の政党の話にはつなげない。"}, {"t": 194.45, "x": "大事なのは警察がこの村に目を向けていたことだ。"}, {"t": 197.51666666666668, "x": "そしてその目は村の外からではなく中にあった。"}, {"t": 200.56666666666666, "x": "中に？"}, {"t": 201.33333333333334, "x": "村の中に警察官が1人まぎれこんでいた。"}, {"t": 204.78333333333333, "x": "1952年の3月の下旬ごろ。"}, {"t": 207.45, "x": "菅生村の製材所に、1人の男が勤めはじめた。"}, {"t": 210.86666666666667, "x": "名乗った名前は市木春秋。"}, {"t": 212.78333333333333, "x": "さっきの名前ね。"}, {"t": 214.08333333333334, "x": "そうだ。製材所では会計の仕事をしていた、と\n国会で言われている。"}, {"t": 218.2, "x": "この男の本当の名前は戸高公徳。"}, {"t": 220.75, "x": "大分県の警察本部にいた巡査部長だった。"}, {"t": 223.71666666666667, "x": "警察官が製材所で働いてたの？"}, {"t": 226.2, "x": "身分を隠して入った。これは\n警察庁の長官が国会で認めている。"}, {"t": 230.5, "x": "長官の言葉をそのまま読む。"}, {"t": 232.35, "x": "警察官であるという身分を秘匿いたしまして。"}, {"t": 235.16666666666666, "x": "製材所の主人にお願いをしまして、\n職員に採用していただきまして。"}, {"t": 239.63333333333333, "x": "製材所の主人は、知ってたってこと？"}, {"t": 242.18333333333334, "x": "長官の答弁では、主人に頼んで\n雇ってもらったとなっている。"}, {"t": 245.98333333333332, "x": "主人がどこまで知っていたかは、\nこの答弁からは分からない。"}, {"t": 249.41666666666666, "x": "命じたのは当時の大分県の警察の警備部長だった。"}, {"t": 252.73333333333332, "x": "長官はその理由を、こう説明している。"}, {"t": 255.23333333333332, "x": "村の共産党の動きを正確につかむため。"}, {"t": 258.0, "x": "そして法にふれる事件を前もって防ぐためだった、と。"}, {"t": 261.4166666666667, "x": "情報を集めるための潜入ってことね。"}, {"t": 263.9166666666667, "x": "そうだ。長官はこれを、虎穴に\n入らずんば虎児を得ず、とたとえた。"}, {"t": 267.78333333333336, "x": "必ずしも感心したやり方ではないかも\nしれない、とも言っている。"}, {"t": 271.71666666666664, "x": "自分たちでもそう思ってたのね。"}, {"t": 273.8, "x": "そう言わざるをえなかった、ということだろう。"}, {"t": 276.18333333333334, "x": "市木は村の人たちと付き合い、\n党の人とも近づいていった。"}, {"t": 279.93333333333334, "x": "この人物はのちに国会でこう呼ばれる。"}, {"t": 282.3333333333333, "x": "「市木春秋こと戸高公徳」。"}, {"t": 284.43333333333334, "x": "名前が2つ並ぶのね。"}, {"t": 286.1333333333333, "x": "この並び方が、事件のすべてを表している。"}, {"t": 289.05, "x": "村から見れば市木。警察から見れば戸高だ。"}, {"t": 291.96666666666664, "x": "そして6月が来る。"}, {"t": 293.98333333333335, "x": "6月1日の昼ごろ。"}, {"t": 295.6666666666667, "x": "戸高は警備部長に報告を入れた。"}, {"t": 297.8333333333333, "x": "これも長官の国会答弁に出てくる。"}, {"t": 300.31666666666666, "x": "何を報告したの？"}, {"t": 301.75, "x": "駐在所を襲う計画があるようだ、という報告だ。"}, {"t": 304.8, "x": "しかも前の日の5月31日にも計画があったという。"}, {"t": 308.3666666666667, "x": "そのときは自分が説得してやめさせた。"}, {"t": 310.8833333333333, "x": "でもこの先も止められるかは\n分からない。そういう中身だった。"}, {"t": 314.53333333333336, "x": "前の日にも？"}, {"t": 315.6, "x": "長官の説明ではそうなっている。"}, {"t": 317.6166666666667, "x": "警備部長は最後まで防ぐよう努めろと重ねて命じた。"}, {"t": 321.0, "x": "そのうえで万一のための手も打った。"}, {"t": 323.25, "x": "万一のため？"}, {"t": 324.4, "x": "村に警察官を入れておいたんだ。"}, {"t": 326.45, "x": "表向きの理由は、別の事件の捜査だった。"}, {"t": 329.35, "x": "1957年の参議院で、\n警察庁の警備部長はこう答えている。"}, {"t": 333.9, "x": "当時牛どろぼうの事件があった。\nその件で逮捕状を取ってあった、と。"}, {"t": 338.15, "x": "牛どろぼう。"}, {"t": 339.06666666666666, "x": "逮捕状は、2、3日前にもらってあったという。"}, {"t": 342.0833333333333, "x": "つまりその夜の村には、\nふだんより多くの警察官がいた。"}, {"t": 345.65, "x": "議員の一人は、\n何十人もの警官が来ていたと言っている。"}, {"t": 349.31666666666666, "x": "そんなに警察がいる夜に、何かが起きるの？"}, {"t": 352.26666666666665, "x": "その議員も同じ疑問を口にしている。"}, {"t": 354.55, "x": "常識人としてちょっと考えられない、とな。"}, {"t": 357.26666666666665, "x": "警察の側の答えはこうだ。"}, {"t": 359.1, "x": "計画のことは、現場の責任者にだけ伝えてあった。"}, {"t": 362.5, "x": "事前に動けば新聞社に\n気づかれる。そう考えていた、と。"}, {"t": 366.28333333333336, "x": "知ってたのは、ごく一部の人だけってこと？"}, {"t": 369.0833333333333, "x": "答弁ではそうなっている。"}, {"t": 370.53333333333336, "x": "ここで覚えておいてほしいことが1つある。"}, {"t": 372.9, "x": "爆発の前から、警察は計画があることを知っていた。"}, {"t": 376.35, "x": "これは警察自身が国会で認めた事実だ。"}, {"t": 379.3333333333333, "x": "それなのに止まらなかったのね。"}, {"t": 381.28333333333336, "x": "止まらなかった。"}, {"t": 382.98333333333335, "x": "1952年6月2日の未明。"}, {"t": 385.6666666666667, "x": "菅生村の駐在所で、ダイナマイトが爆発した。"}, {"t": 388.95, "x": "中には人がいたのよね。"}, {"t": 390.6666666666667, "x": "駐在所は巡査の家族の住まいでもある。"}, {"t": 393.1, "x": "建物の一部が壊れた。\nここまでは資料で確かめられた。"}, {"t": 396.6166666666667, "x": "けが人については、今回あたった資料では\n確かめられなかった。"}, {"t": 400.3833333333333, "x": "だからここでは言わない。"}, {"t": 401.9, "x": "時刻は？"}, {"t": 402.78333333333336, "x": "資料によって違う。0時半ごろとするものと、\n1時ごろとするものがある。"}, {"t": 407.2, "x": "だから未明とだけ言っておく。"}, {"t": 408.9, "x": "爆発のすぐあと、警察は近くにいた2人をつかまえた。"}, {"t": 412.5, "x": "続いて仲間とされた3人もつかまえた。"}, {"t": 415.1666666666667, "x": "全部で5人ね。"}, {"t": 416.3833333333333, "x": "5人は爆発物取締罰則という法律の違反で起訴された。"}, {"t": 420.4166666666667, "x": "明治17年にできた、とても古い法律だ。"}, {"t": 423.5, "x": "明治の法律が、昭和の事件に使われたの？"}, {"t": 426.51666666666665, "x": "そうだ。爆発物を使うことや、\n持つことを重く罰する法律だ。"}, {"t": 430.6666666666667, "x": "警察の見方ははっきりしていた。"}, {"t": 432.75, "x": "現場で現行犯でつかまえた。"}, {"t": 434.51666666666665, "x": "証拠もそろっている。"}, {"t": 435.8833333333333, "x": "1957年3月の参議院でも、\n警察庁の警備部長はそう言っている。"}, {"t": 440.8833333333333, "x": "事件そのものの事実は、そうめんどうな\n問題ではないと考えている、と。"}, {"t": 445.3333333333333, "x": "自信があったのね。"}, {"t": 446.7, "x": "あった。少なくとも国会ではそう見せていた。"}, {"t": 449.5, "x": "ただこの夜からいなくなった人が1人いる。"}, {"t": 452.21666666666664, "x": "市木春秋ね。"}, {"t": 453.48333333333335, "x": "そうだ。製材所の会計係が、村から姿を消した。"}, {"t": 457.21666666666664, "x": "村の人から見れば、あの人は\nどこへ行ったのか、となる。"}, {"t": 460.6333333333333, "x": "つかまった5人の側から見れば、もっと切実だ。"}, {"t": 463.73333333333335, "x": "あの夜のことを知っているはずの人が、いない。"}, {"t": 466.55, "x": "その人がいれば、話が変わるかもしれないのに。"}, {"t": 469.65, "x": "そういうことだ。"}, {"t": 470.6333333333333, "x": "5人の側はのちに市木こそが鍵だと言いつづける。"}, {"t": 473.6333333333333, "x": "でも市木を法廷に呼ぼうにも、\nどこにいるか分からない。"}, {"t": 476.76666666666665, "x": "それどころか、本当にいる人なのかさえ疑われていく。"}, {"t": 480.75, "x": "爆発から28日後の6月30日。"}, {"t": 483.73333333333335, "x": "大分県の警察で、1人の巡査部長が依願退職した。"}, {"t": 487.6166666666667, "x": "戸高公徳ね。"}, {"t": 488.93333333333334, "x": "そうだ。理由は健康のためとされていた。"}, {"t": 491.46666666666664, "x": "これは1957年に、警察庁長官が\n国会で説明したことだ。"}, {"t": 496.3833333333333, "x": "辞めたあとどうしてたの？"}, {"t": 497.9166666666667, "x": "長官の説明を、そのまま順に並べる。"}, {"t": 500.5833333333333, "x": "まず2、3か月ほどふるさとで休んでいた。"}, {"t": 503.3333333333333, "x": "その年の9月ごろ、東京に出てきた。"}, {"t": 505.8666666666667, "x": "当時の警備部長が、仕事探しを手伝ったという。"}, {"t": 509.15, "x": "命令を出した人が、仕事も探したのね。"}, {"t": 512.0, "x": "答弁ではそうなっている。"}, {"t": 513.4666666666667, "x": "東京では国家地方警察の本部の警備課で働いた。"}, {"t": 516.9, "x": "資料を整理する仕事だ。"}, {"t": 518.3333333333334, "x": "立場は臨時雇いのようなものだった。"}, {"t": 520.7166666666667, "x": "辞めたのに警察の本部で働いてたの？"}, {"t": 523.3666666666667, "x": "そうだ。長官はそれを隠さずに答えている。"}, {"t": 526.0833333333334, "x": "翌年の1953年9月。"}, {"t": 528.5833333333334, "x": "戸高はもう一度警察官になりたいと申し出た。"}, {"t": 531.5166666666667, "x": "国家地方警察の東京都本部に、\n警察官として採用された。"}, {"t": 535.7166666666667, "x": "1954年には警察の仕組みが\n変わって、警視庁の職員になる。"}, {"t": 540.3333333333334, "x": "その年の警視庁の職員録に、名前が載っていた。"}, {"t": 543.7666666666667, "x": "名簿に本名で？"}, {"t": 545.05, "x": "本名で載っていた。原籍は\n大分県、と書かれていたという。"}, {"t": 548.7166666666667, "x": "そして1956年4月、一身上の理由で退職している。"}, {"t": 553.1666666666666, "x": "じゃあどこにもいなかったわけじゃないのね。"}, {"t": 555.4666666666667, "x": "いなかったわけじゃない。"}, {"t": 556.75, "x": "市木春秋という人は村から消えた。"}, {"t": 559.1, "x": "でも戸高公徳という人は、警察の名簿に載っていた。"}, {"t": 562.75, "x": "名前が違うと、つながらないのね。"}, {"t": 565.05, "x": "外から見ると、そうなる。"}, {"t": 566.75, "x": "ただこれが分かったのは1957年になってからだ。"}, {"t": 570.2666666666667, "x": "それまでのあいだ、裁判は先に進んでいた。"}, {"t": 573.7, "x": "裁判は大分地方裁判所で開かれた。"}, {"t": 576.2333333333333, "x": "判決が出たのは1955年。"}, {"t": 578.6333333333333, "x": "5人とも有罪だった。"}, {"t": 580.2666666666667, "x": "全員？"}, {"t": 580.9833333333333, "x": "全員だ。重い人で懲役10年。ほかに\n8年、3年といった刑がついた。"}, {"t": 585.8833333333333, "x": "1956年の国会で、議員がその刑期を挙げている。"}, {"t": 589.8333333333334, "x": "10年ってほんとに長いわね。"}, {"t": 591.75, "x": "5人の側は判決を受けいれなかった。"}, {"t": 594.1, "x": "福岡高等裁判所に控訴した。"}, {"t": 596.3166666666667, "x": "控訴の中で強く言いつづけたことがある。"}, {"t": 598.8833333333333, "x": "市木春秋のこと？"}, {"t": 600.3666666666667, "x": "そうだ。あの夜の計画には、\n市木という男がかかわっていた。"}, {"t": 604.2666666666667, "x": "その男を呼んで調べてほしい、という主張だ。"}, {"t": 607.1166666666667, "x": "でもどこにいるか分からないのよね。"}, {"t": 609.2, "x": "分からない。しかも一審では、検事が\n市木なる人物はいないと言ったという。"}, {"t": 613.75, "x": "いない？"}, {"t": 614.4, "x": "1956年の国会で、議員がそう述べている。"}, {"t": 617.8333333333334, "x": "いないと言われれば、呼びようがない。"}, {"t": 619.8, "x": "ここで、5人の側がもう1つ言いはじめたことがある。"}, {"t": 622.95, "x": "爆発の前に駐在所に投げこまれた手紙があった。"}, {"t": 626.1, "x": "それを書いたのが市木だ、という主張だ。"}, {"t": 628.6666666666666, "x": "手紙？"}, {"t": 629.4, "x": "脅しの手紙だ。脅迫状だな。"}, {"t": 631.5666666666667, "x": "その手紙は一審の裁判には出ていた、とされる。"}, {"t": 634.5333333333333, "x": "ところが二審になると、出てこなかった。"}, {"t": 637.1166666666667, "x": "出てこない？"}, {"t": 638.0333333333333, "x": "なくなっていた。"}, {"t": 639.0666666666667, "x": "この1枚の紙のゆくえが、国会で\n何度も問われることになる。"}, {"t": 642.8, "x": "次の章はその紙の話だ。"}, {"t": 645.3833333333333, "x": "1956年12月5日。"}, {"t": 647.7, "x": "衆議院の法務委員会。"}, {"t": 649.2666666666667, "x": "1人の議員がこう述べた。"}, {"t": 650.8833333333333, "x": "その脅迫状は自筆で、革命は近いぞ、\n覚悟はよいか、という文だった。"}, {"t": 655.7333333333333, "x": "そんなことが書いてあったの。"}, {"t": 657.4833333333333, "x": "議員の説明ではそうだ。"}, {"t": 659.0666666666667, "x": "そしてこう続ける。"}, {"t": 660.3333333333334, "x": "一審では押収第七号として証拠物件にあった。"}, {"t": 663.5, "x": "二審になると、この証拠物件が消えている、と。"}, {"t": 666.6333333333333, "x": "押収第七号って、証拠の番号ね。"}, {"t": 669.2666666666667, "x": "そうだ。裁判の証拠には番号がつく。"}, {"t": 671.7833333333333, "x": "5人の側はこう考えた。"}, {"t": 673.4666666666667, "x": "脅迫状の字と、市木の字を\n比べれば、誰が書いたか分かる。"}, {"t": 677.4166666666666, "x": "筆跡を比べるのね。"}, {"t": 679.0166666666667, "x": "そうだ。ところが比べるための紙がない。"}, {"t": 681.5, "x": "1957年3月15日、法務省の刑事局長が国会で答えた。"}, {"t": 686.6, "x": "何回も調べたが、その脅迫文は\nまだわれわれの手にない。"}, {"t": 690.2833333333333, "x": "見つからないってこと？"}, {"t": 691.7833333333333, "x": "そうだ。しかも同じ日、局長はこうも言っている。"}, {"t": 694.8333333333334, "x": "問題の脅迫文と考えられるものは、\n押収の手続きをとっていない。"}, {"t": 699.15, "x": "えさっきは押収第七号って。"}, {"t": 701.1666666666666, "x": "そこが食い違った。議員もすぐにそこを突いている。"}, {"t": 704.15, "x": "押収したのか。初めからなかったのか。あったけれど\n今は見つからないのか。"}, {"t": 708.6666666666666, "x": "局長の答えは、番号を打っていない\n文書だと思う、というものだった。"}, {"t": 712.8, "x": "当時は市木が誰なのか分からなかった。"}, {"t": 715.1833333333333, "x": "だから正式な事件として扱わず、\n目録にも入れなかったようだ、と。"}, {"t": 719.6666666666666, "x": "正式に扱ってなかったから、なくなったの？"}, {"t": 722.6833333333333, "x": "そう説明された。"}, {"t": 723.9166666666666, "x": "この話は1959年8月の国会でも出てくる。"}, {"t": 727.7333333333333, "x": "そのときも検察庁へ行ってから\n行方不明だと言われている。"}, {"t": 731.1333333333333, "x": "同じ年の8月、議員の一人が\nこんな場面を思い出して話している。"}, {"t": 735.4, "x": "検察の局長は、あれは証拠として\nとったものではないと言った。"}, {"t": 739.2, "x": "ところが隣にいた警察庁の長官は、\n確かに証拠として出したと言った。"}, {"t": 743.8, "x": "受けとった書類までもらっています、とな。"}, {"t": 746.3666666666667, "x": "隣どうしで、言うことが違ったの？"}, {"t": 748.7333333333333, "x": "議員の記憶では、そうだったという。"}, {"t": 750.8666666666667, "x": "渡した側は渡したと言い、受けとった\n側は受けとっていないと言う。"}, {"t": 754.5833333333334, "x": "どちらが正しいのかを決めた\n記録は、今回は見つからなかった。"}, {"t": 758.5, "x": "3年たっても見つかってないのね。"}, {"t": 760.7333333333333, "x": "その後見つかったという答弁を、\n今回の会議録の中には見つけられなかった。"}, {"t": 765.3166666666667, "x": "紙1枚だ。"}, {"t": 766.2833333333333, "x": "でもその紙1枚が、市木と脅迫状を\n結ぶ線になるはずだった。"}, {"t": 771.0833333333334, "x": "紙がないなら、ほかの方法でつなぐしかない。"}, {"t": 773.8166666666667, "x": "5人の側が使ったのは、1枚の写真だった。"}, {"t": 777.0, "x": "写真？"}, {"t": 777.6666666666666, "x": "戸高公徳の結婚のときの写真だ。"}, {"t": 780.1666666666666, "x": "1956年12月の国会で、議員が\nその写真を手にこう述べている。"}, {"t": 784.95, "x": "この写真を地元の人に見せた。"}, {"t": 787.05, "x": "菅生村にいた市木春秋と同じ人だと、\n多くの村の人が言っている。"}, {"t": 791.5166666666667, "x": "村の人なら顔を覚えてるものね。"}, {"t": 793.7333333333333, "x": "200軒あまりの村だ。"}, {"t": 795.1, "x": "製材所の会計係の顔を覚えている人は多い。"}, {"t": 798.15, "x": "製材所で一緒に働いていた人たちも、\n証人になると言っている、と。"}, {"t": 802.6166666666667, "x": "じゃあ市木と戸高が同じ人だって分かったのね。"}, {"t": 805.6166666666667, "x": "村の人の証言としては、そうなる。"}, {"t": 808.0, "x": "ただそれだけでは足りない。"}, {"t": 809.6333333333333, "x": "どうして？"}, {"t": 810.4666666666667, "x": "本人がどこにいるか分からないからだ。"}, {"t": 812.7, "x": "本人が出てこなければ、法廷で確かめられない。"}, {"t": 815.6833333333333, "x": "議員は戸高の住まいを役所の書類からたどってもいた。"}, {"t": 818.85, "x": "1953年10月に、東京の福生に家族と住んでいた。"}, {"t": 823.0, "x": "その後何度も住所が変わっていた。"}, {"t": 825.0666666666667, "x": "最後の転出先には、転入の届けが出ていなかった。"}, {"t": 828.65, "x": "引っ越したまま、届けを出してないのね。"}, {"t": 831.25, "x": "そうだ。そこで足どりが切れていた。"}, {"t": 833.45, "x": "この写真は国会で警察の側にも手わたされている。"}, {"t": 836.6, "x": "これで調べてください、と。"}, {"t": 838.4, "x": "受けとった警察は、どうしたの？"}, {"t": 840.6, "x": "それが次の章だ。"}, {"t": 841.85, "x": "警察の答えは、のちに大きく変わることになる。"}, {"t": 845.4666666666667, "x": "1956年12月13日。"}, {"t": 848.0333333333333, "x": "衆議院の法務委員会。"}, {"t": 849.5833333333334, "x": "答弁に立ったのは、警察庁の警備部長だった。"}, {"t": 852.6666666666666, "x": "議員は戸高が現職の警察官だったことを\n調べたのかと聞いた。"}, {"t": 856.6, "x": "部長の答えは、こうだ。"}, {"t": 858.2, "x": "戸高が真犯人であると断定されて\n話を進めているようだ。"}, {"t": 861.9166666666666, "x": "私はこの交番を爆破した\n事件の真犯人であるとは考えていない。"}, {"t": 866.1833333333333, "x": "はっきり否定したのね。"}, {"t": 867.8, "x": "した。そのうえでこう付けくわえている。"}, {"t": 870.0333333333333, "x": "その後の戸高の住所については、\nわれわれも探したい。"}, {"t": 873.3833333333333, "x": "警察も知らなかったってこと？"}, {"t": 875.4, "x": "この日の答えではそうなる。"}, {"t": 877.0333333333333, "x": "同じ日部長はもう1つ答えている。"}, {"t": 879.2333333333333, "x": "戸高は1952年6月30日まで\n警察官だった。それから後は分からない。"}, {"t": 884.7666666666667, "x": "警察大学校にいたという話も、\n調べたが心当たりはない。"}, {"t": 888.75, "x": "でもさっきの話だと。"}, {"t": 890.4166666666666, "x": "そうだ。戸高は東京の警察で働き、名簿に載っていた。"}, {"t": 894.2, "x": "この食い違いは、3か月後に国会で問題になる。"}, {"t": 897.5833333333334, "x": "議員の側はどう言ってたの？"}, {"t": 899.3, "x": "議員は警察が戸高を\n守っているのではないかと疑っていた。"}, {"t": 902.8666666666667, "x": "ただここで1つ線を引いておく。"}, {"t": 904.85, "x": "「戸高が真犯人だ」という\n言葉は、議員と5人の側の主張だ。"}, {"t": 908.9166666666666, "x": "判決はそこを認めていない。これはあとで話す。"}, {"t": 911.9833333333333, "x": "主張と判決は、分けて聞くのね。"}, {"t": 914.45, "x": "分けて聞いてほしい。"}, {"t": 915.6166666666667, "x": "この時点ではっきりしていたことは2つだけだ。"}, {"t": 918.4166666666666, "x": "市木春秋がどこにいるか、誰も表では言っていない。"}, {"t": 921.5333333333333, "x": "そして警察は、探したいと言った。"}, {"t": 924.0166666666667, "x": "その3か月後に、何が起きたの？"}, {"t": 926.4166666666666, "x": "探していた側とは、別の人たちが見つけた。"}, {"t": 930.05, "x": "1957年3月。"}, {"t": 932.1, "x": "東京の新宿区番衆町に、\n春風荘というアパートがあった。"}, {"t": 935.9166666666666, "x": "そこで共同通信の記者たちが戸高公徳を見つけた。"}, {"t": 939.4166666666666, "x": "記者が？"}, {"t": 940.2166666666667, "x": "そうだ。警察ではなく、通信社の記者たちだった。"}, {"t": 943.5166666666667, "x": "あとから弁護士もかけつけた、と\n国会で述べられている。"}, {"t": 946.8166666666667, "x": "3月15日の国会で、議員はこう言った。"}, {"t": 949.6833333333333, "x": "一昨日新聞記者につかまった。"}, {"t": 951.8, "x": "じゃあ、3月13日ごろね。"}, {"t": 954.0, "x": "そうなる。事件から4年9か月がたっていた。"}, {"t": 956.9333333333333, "x": "見つかったとき、戸高はもう警察官ではなかった。"}, {"t": 960.1, "x": "1956年4月に退職していたからだ。"}, {"t": 963.45, "x": "現職の警察官が見つかったわけじゃないのね。"}, {"t": 966.4666666666667, "x": "そこは間違えやすい。"}, {"t": 967.7666666666667, "x": "現職だったのは、事件のときだ。"}, {"t": 970.05, "x": "議員の話では、アパートの管理人が\nこう話していたという。"}, {"t": 973.6, "x": "昼間は部屋にいて、夜に出かけていく。"}, {"t": 976.0333333333333, "x": "留守のときの連絡先として、ある電話番号を\n渡していた。"}, {"t": 979.7833333333333, "x": "どこの番号だったの？"}, {"t": 981.3, "x": "本人は東大だと言っていた。"}, {"t": 983.1166666666667, "x": "かけてみると、警察大学校だった。"}, {"t": 985.4333333333333, "x": "議員はそう述べている。"}, {"t": 986.9166666666666, "x": "これも議員の話なのね。"}, {"t": 988.6833333333333, "x": "そうだ。裏づけは会議録の中の議員の言葉だけだ。"}, {"t": 992.0, "x": "見つかった戸高は、記者たちに\nいくつかのことを話した。"}, {"t": 995.3833333333333, "x": "市木春秋は自分だということ。"}, {"t": 997.4, "x": "そして法廷に証人として出るということだ。"}, {"t": 1000.15, "x": "自分から認めたのね。"}, {"t": 1001.8, "x": "認めた。翌日それが新聞に大きく載った。"}, {"t": 1004.7666666666667, "x": "その記事を手に、国会の委員会が開かれる。"}, {"t": 1007.5666666666667, "x": "3月15日。この動画のいちばん初めの日だ。"}, {"t": 1011.3166666666667, "x": "1957年3月15日の衆議院法務委員会。"}, {"t": 1015.0666666666667, "x": "この日、答弁に立ったのは警察庁の長官本人だった。"}, {"t": 1018.7166666666667, "x": "長官は前の年の12月のことから話しはじめた。"}, {"t": 1022.15, "x": "「探したい」って言った日ね。"}, {"t": 1023.9333333333333, "x": "そうだ。長官はこう言っている。"}, {"t": 1025.8166666666666, "x": "12月の時点で、私は寝耳に\n水というわけではなかった。"}, {"t": 1029.6, "x": "ある新聞に戸高の名前が出ていたからだ。"}, {"t": 1032.1333333333334, "x": "それで初めて、現職の警察官が何らかの形で\nかかわったのでは、と疑ったという。"}, {"t": 1037.6833333333334, "x": "それで調べたの？"}, {"t": 1038.9833333333333, "x": "調べた。年が明けて1月、\n当時の警備部長を東京に呼んだ。"}, {"t": 1042.9833333333333, "x": "そこで初めて、事情を\n聞くことができた、と長官は言う。"}, {"t": 1046.6666666666667, "x": "命令を出した本人に聞いたのね。"}, {"t": 1048.85, "x": "そうだ。そして長官は、この4年9か月を順番に話した。"}, {"t": 1052.8666666666666, "x": "村に入ったのが3月下旬。"}, {"t": 1054.7666666666667, "x": "6月1日に報告。6月30日に退職。"}, {"t": 1058.2666666666667, "x": "9月から東京の本部で臨時の仕事。"}, {"t": 1060.7166666666667, "x": "1953年9月に警察官として採用。"}, {"t": 1063.9333333333334, "x": "1956年4月に退職。"}, {"t": 1066.6333333333334, "x": "さっき並べたとおりなのね。"}, {"t": 1068.4333333333334, "x": "そうだ。長官の答弁が、そのまま時刻表になっている。"}, {"t": 1071.9666666666667, "x": "長官は戸高についてこうも言った。"}, {"t": 1074.0833333333333, "x": "戸高巡査部長は、事件には直接何ら関係はない。"}, {"t": 1077.5833333333333, "x": "上司から示された任務のために、最善をつくした。"}, {"t": 1080.95, "x": "警察はそう説明したのね。"}, {"t": 1082.95, "x": "これが警察の見方だ。"}, {"t": 1084.5333333333333, "x": "議員の側は納得しなかった。"}, {"t": 1086.4833333333333, "x": "12月には警察大学校にも\n心当たりはないと言っていたではないか。"}, {"t": 1090.6666666666667, "x": "自分の部下のことを、委員会に\n違うように言ったのか、と。"}, {"t": 1094.2166666666667, "x": "3か月で答えが変わったのね。"}, {"t": 1096.35, "x": "変わった。"}, {"t": 1097.0833333333333, "x": "委員会の終わりに、委員長がまとめた。"}, {"t": 1099.4166666666667, "x": "戸高某と市木某が同一人である。"}, {"t": 1101.6333333333334, "x": "前回まで謎に包まれていた\nこの問題は、きょう明らかになった。"}, {"t": 1105.65, "x": "最初の言葉に、戻ってきたわね。"}, {"t": 1108.0333333333333, "x": "ここが折り返しだ。名前の謎は解けた。"}, {"t": 1110.5666666666666, "x": "残ったのは爆発の夜に何があったのかだ。"}, {"t": 1113.9333333333334, "x": "1957年戸高は福岡高等裁判所に呼ばれた。"}, {"t": 1117.75, "x": "5人の控訴審に、証人として立った。"}, {"t": 1120.3666666666666, "x": "6月の国会で、長官がこう答えている。"}, {"t": 1123.1333333333334, "x": "戸高は証人として先般喚問されて、証言をしている。"}, {"t": 1126.7833333333333, "x": "もう1回証人として呼ばれることになっているようだ。"}, {"t": 1129.7833333333333, "x": "その少し前の4月、別の議員は国会でこう言っている。"}, {"t": 1133.2666666666667, "x": "戸高は公判で、爆発物を\n運んだことを自分で話している。"}, {"t": 1137.15, "x": "脅迫文を書いたことも話している。\nなぜ検挙しないのか、と。"}, {"t": 1141.1333333333334, "x": "本人が話してたなら、もう決まりじゃないの？"}, {"t": 1143.95, "x": "これは議員がそう述べたものだ。"}, {"t": 1145.5833333333333, "x": "証言の記録そのものを、私は読めていない。"}, {"t": 1148.4833333333333, "x": "だから、ここは議員の言葉として置いておく。"}, {"t": 1151.25, "x": "法廷で何を話したの？"}, {"t": 1152.9833333333333, "x": "証言の中身を、全部ここで並べることはしない。"}, {"t": 1156.0166666666667, "x": "私が確かめられたのは、\nのちの判決が認めた事実のほうだ。"}, {"t": 1160.2, "x": "判決が認めたこと？"}, {"t": 1161.85, "x": "戸高はダイナマイトにかかわっていた。"}, {"t": 1164.0333333333333, "x": "1984年の国会で、警察庁の警備局長が\nこう説明している。"}, {"t": 1168.9666666666667, "x": "被告人の一人から頼まれて、\nダイナマイトを受けとった。"}, {"t": 1172.4166666666667, "x": "それを保管して、その人に渡した。"}, {"t": 1174.9666666666667, "x": "警察官がダイナマイトを預かってたの？"}, {"t": 1177.4833333333333, "x": "判決ではそうなっている。"}, {"t": 1179.05, "x": "この行為が爆発物取締罰則の違反として起訴された。"}, {"t": 1182.95, "x": "5人と同じ法律ね。"}, {"t": 1184.6166666666666, "x": "同じ法律だ。"}, {"t": 1185.7, "x": "ここでよく混ざる2つの話を分けておく。"}, {"t": 1188.25, "x": "1つはダイナマイトを受けとって\n渡したこと。これは判決が認めた。"}, {"t": 1192.3666666666666, "x": "もう1つは駐在所を爆破したこと。"}, {"t": 1194.8, "x": "そっちは？"}, {"t": 1195.6333333333334, "x": "戸高の加担は、判決で否定された。"}, {"t": 1198.2, "x": "警備局長の言葉で言えば、その加担は\n判決では否定されております、だ。"}, {"t": 1202.9666666666667, "x": "渡したことと、爆破したことは別なのね。"}, {"t": 1205.8666666666666, "x": "別だ。ここを混ぜると、判決にない話になる。"}, {"t": 1209.0666666666666, "x": "国会では議員が何度も戸高を真犯人と呼んだ。"}, {"t": 1212.1166666666666, "x": "それは議員の言葉として、会議録に残っている。"}, {"t": 1215.15, "x": "でも判決はそうは書かなかった。"}, {"t": 1217.1666666666667, "x": "この動画は判決の線の内側で話す。"}, {"t": 1220.4166666666667, "x": "1958年6月。福岡高等裁判所が判決を出した。"}, {"t": 1224.95, "x": "駐在所の爆破について、5人は全員無罪。"}, {"t": 1227.9666666666667, "x": "全員無罪。"}, {"t": 1229.0, "x": "同じ1984年の国会で、警備局長はこうも述べている。"}, {"t": 1233.3, "x": "被告人らの有罪を認めるに足る\n証拠がない、ということで全員無罪になった。"}, {"t": 1238.05, "x": "一審では、10年だったのよね。"}, {"t": 1240.25, "x": "そうだ。同じ事件で一審と\n二審の答えが正反対になった。"}, {"t": 1244.0833333333333, "x": "ただここも正確に言っておく。"}, {"t": 1245.9, "x": "5人の裁判には、駐在所の件のほかに別の件もあった。"}, {"t": 1249.7166666666667, "x": "別の件？"}, {"t": 1250.6166666666666, "x": "ダイナマイトを持っていたことなどだ。"}, {"t": 1252.65, "x": "そちらでは一部の人が有罪になっている。"}, {"t": 1255.15, "x": "警備局長は懲役刑に\n処せられている、と説明している。"}, {"t": 1258.85, "x": "じゃあ何もかも無罪ではないのね。"}, {"t": 1260.9, "x": "そうだ。無罪になったのは、\n駐在所の爆破についてだ。"}, {"t": 1264.35, "x": "検察はこの判決を不服として最高裁に上告した。"}, {"t": 1267.9333333333334, "x": "1958年7月の国会で、刑事局長が\nその理由を説明している。"}, {"t": 1273.0333333333333, "x": "判決の理由のつけ方が、\nこれまでの判例に反している、と。"}, {"t": 1277.0, "x": "判決の中身じゃなくて、理由の書き方の問題なの？"}, {"t": 1280.55, "x": "最高裁には事実の争いだけでは\n上告できない決まりがある。"}, {"t": 1284.2166666666667, "x": "だから判例違反という形をとった。"}, {"t": 1286.4833333333333, "x": "この裁判の中で、\n爆発の調べ方についての鑑定も出ていた。"}, {"t": 1290.5666666666666, "x": "1958年4月の国会で、議員がそれを紹介している。"}, {"t": 1294.75, "x": "東大工学部の教授の鑑定では、\n外から投げこんだものではない、と。"}, {"t": 1299.15, "x": "外からじゃない？"}, {"t": 1300.3, "x": "ただし同じ議員が、九州大学からは\n異論も出ている、と言っている。"}, {"t": 1304.3333333333333, "x": "鑑定は割れていた。"}, {"t": 1305.7, "x": "じゃあどっちが正しいの？"}, {"t": 1307.2333333333333, "x": "判決がどちらを採ったのかは、\n今回あたった資料では確かめられなかった。"}, {"t": 1311.6333333333334, "x": "だからここでは鑑定が2つあったことまでにしておく。"}, {"t": 1314.75, "x": "確かなのは、5人がやったという\n証拠が足りないとされたことだ。"}, {"t": 1319.0833333333333, "x": "5人の二審と同じころ、もう1つの裁判が進んでいた。"}, {"t": 1322.7, "x": "戸高公徳の裁判だ。"}, {"t": 1324.4833333333333, "x": "ダイナマイトを渡したことの裁判ね。"}, {"t": 1326.85, "x": "そうだ。最初は大分地方裁判所だった。"}, {"t": 1329.5666666666666, "x": "判決は無罪。"}, {"t": 1330.7833333333333, "x": "無罪なの？"}, {"t": 1331.7166666666667, "x": "1958年8月の国会で、議員が\nその理由を問題にしている。"}, {"t": 1336.4166666666667, "x": "期待可能性の理論をとって無罪にした、と。"}, {"t": 1339.3166666666666, "x": "きたいかのうせい？"}, {"t": 1340.5166666666667, "x": "法律の考え方の1つだ。"}, {"t": 1342.5333333333333, "x": "ほかの行動をとることを期待できない\n状況なら、責任は問えない。"}, {"t": 1346.45, "x": "ざっくり言うと、そういう考え方になる。"}, {"t": 1349.0333333333333, "x": "やるしかない立場だった、ってこと？"}, {"t": 1351.3, "x": "そういう場面に使われる考え方だ。"}, {"t": 1353.6166666666666, "x": "裁判所がどの事情を重く見たのか。"}, {"t": 1355.8166666666666, "x": "細かい理由までは、今回の資料では\n確かめられなかった。"}, {"t": 1359.3166666666666, "x": "ただ議員たちはこの判決に強く反発した。"}, {"t": 1362.2166666666667, "x": "ダイナマイトを運んだ人が無罪になる。"}, {"t": 1364.5333333333333, "x": "その上司には何の責任も問われない。"}, {"t": 1366.85, "x": "脅迫状はなくなったままだ。"}, {"t": 1368.6833333333334, "x": "この一連のことを、このままにしてよいのか。"}, {"t": 1371.1833333333334, "x": "議員はそう問うた。"}, {"t": 1372.5333333333333, "x": "怒るのも分かる気がするわ。"}, {"t": 1374.2833333333333, "x": "もう1つ議員が問題にしたのは起訴の中身だった。"}, {"t": 1377.4, "x": "弁護団は戸高と当時の警備部長を告発していた。"}, {"t": 1380.65, "x": "爆発物取締罰則の第1条違反だ。"}, {"t": 1383.7, "x": "第1条って？"}, {"t": 1384.8666666666666, "x": "爆発物を使った人を罰する条文だ。"}, {"t": 1387.5166666666667, "x": "ところが戸高が起訴されたのは、第5条のほうだった。"}, {"t": 1390.7333333333333, "x": "議員はこれで第1条の話が\nうやむやになるのではと心配した。"}, {"t": 1394.6, "x": "使ったかどうかじゃなくて、運んだか\nどうかの裁判になったのね。"}, {"t": 1398.5166666666667, "x": "そうなる。"}, {"t": 1399.2166666666667, "x": "そして判決は、使ったことへの加担を否定した。"}, {"t": 1402.4333333333334, "x": "裁判の場で問われたのは、\n運んだかどうかまでだった。"}, {"t": 1406.2166666666667, "x": "1959年9月11日。福岡高等裁判所。"}, {"t": 1410.25, "x": "戸高公徳の二審の判決が出た。"}, {"t": 1412.6166666666666, "x": "有罪。"}, {"t": 1413.35, "x": "今度は有罪なのね。"}, {"t": 1414.85, "x": "そうだ。ただし刑は免除された。"}, {"t": 1417.05, "x": "有罪なのに刑がないの？"}, {"t": 1418.75, "x": "法律には刑の免除という言い渡しがある。"}, {"t": 1421.1666666666667, "x": "罪にはなる。でも罰は科さない。"}, {"t": 1423.3666666666666, "x": "それって無罪とどう違うの？"}, {"t": 1425.15, "x": "記録に「有罪」と残る。そこが違う。"}, {"t": 1427.9166666666667, "x": "1969年の国会で、議員の一人が\nまさにそこを言っている。"}, {"t": 1432.3, "x": "有罪ではあるけれども刑を\n免除する。だから無罪ではない、と。"}, {"t": 1436.05, "x": "有罪だけど罰はない。"}, {"t": 1437.6166666666666, "x": "この判決で戸高の刑事の責任は決着した。"}, {"t": 1440.7833333333333, "x": "1984年に、警察庁の警備局長がこう言っている。"}, {"t": 1444.8333333333333, "x": "彼の刑事責任は、判決のうえで処理されている。"}, {"t": 1448.0833333333333, "x": "決着なのね。"}, {"t": 1449.3166666666666, "x": "裁判としては決着だ。"}, {"t": 1451.0, "x": "ここで事件全体を一度まとめておく。"}, {"t": 1453.3166666666666, "x": "駐在所の爆破で起訴された5人は、無罪になった。"}, {"t": 1456.55, "x": "ダイナマイトを受けとって渡した\n警察官は、有罪で刑は免除。"}, {"t": 1460.45, "x": "その警察官の爆破への加担は、判決で否定された。"}, {"t": 1464.1833333333334, "x": "そうすると爆破した人は……。"}, {"t": 1466.05, "x": "判決の中には、出てこない。"}, {"t": 1468.1333333333334, "x": "誰も爆破したことになってないのね。"}, {"t": 1470.5333333333333, "x": "なっていない。"}, {"t": 1471.35, "x": "駐在所は確かに壊れている。"}, {"t": 1473.1333333333334, "x": "ダイナマイトは確かに爆発した。"}, {"t": 1475.3333333333333, "x": "でもそれをした人の名前を書いた判決はない。"}, {"t": 1478.2166666666667, "x": "おかしな話ね。"}, {"t": 1479.55, "x": "おかしな話だ。そしてこの判決の\nあとに、もう1つ出来事がある。"}, {"t": 1484.4666666666667, "x": "1959年12月。"}, {"t": 1486.5833333333333, "x": "戸高公徳はふたたび警察に戻った。"}, {"t": 1489.2833333333333, "x": "戻ったの？"}, {"t": 1490.2333333333333, "x": "戻った。警察庁勤務の警部補としてだ。"}, {"t": 1493.0666666666666, "x": "これは1989年の国会で、議員が\n読み上げた本の一節にある。"}, {"t": 1497.7166666666667, "x": "昭和34年12月、ふたたび\n警察庁勤務の警部補となった。"}, {"t": 1502.1833333333334, "x": "判決が9月だから。"}, {"t": 1503.8333333333333, "x": "3か月後になる。"}, {"t": 1505.2166666666667, "x": "辞めたときは巡査部長だったのよね。"}, {"t": 1507.5666666666666, "x": "そうだ。警部補は、巡査部長のすぐ次の階級だ。"}, {"t": 1511.05, "x": "上がって戻ったのね。"}, {"t": 1512.5166666666667, "x": "そうなる。"}, {"t": 1513.2, "x": "1960年3月の国会で、議員がもう問題にしている。"}, {"t": 1517.3333333333333, "x": "現職の警官にまた復帰した。とんでもないことだ、と。"}, {"t": 1520.9, "x": "4月の国会でも、昇進して\n復職している、と言っている。"}, {"t": 1524.8, "x": "警察の側はどう答えたの？"}, {"t": 1526.7166666666667, "x": "この件への答えがはっきり\n残っているのは、10年後の1969年だ。"}, {"t": 1531.5666666666666, "x": "警察庁の参事官がこう答えている。"}, {"t": 1533.9333333333334, "x": "戸高本人は刑の免除を受けている。"}, {"t": 1536.15, "x": "公務員になれない理由、\nいわゆる欠格条項は彼にはない。"}, {"t": 1539.7333333333333, "x": "法律の上では、問題ないってこと？"}, {"t": 1542.2, "x": "そういう説明だ。"}, {"t": 1543.3833333333334, "x": "刑の免除は刑を受けたことにはならない。"}, {"t": 1545.7166666666667, "x": "だから公務員に戻る妨げにはならない、という理屈だ。"}, {"t": 1549.25, "x": "理屈は分かるけど……。"}, {"t": 1550.6166666666666, "x": "議員の側はそれでは道義が立たないと言った。"}, {"t": 1553.15, "x": "ここはどちらの言い分も会議録に残っている。"}, {"t": 1555.8, "x": "私はどちらかに軍配を上げることはしない。"}, {"t": 1558.3666666666666, "x": "確かなのは時間の並びだ。"}, {"t": 1560.15, "x": "9月に有罪で刑の免除。12月に警部補。"}, {"t": 1563.25, "x": "そして翌年、5人の裁判が最後の段階をむかえる。"}, {"t": 1567.3, "x": "1960年12月16日。"}, {"t": 1569.95, "x": "最高裁判所が、検察の上告を退けた。"}, {"t": 1573.15, "x": "上告棄却ね。"}, {"t": 1574.4833333333333, "x": "そうだ。これで\n駐在所の爆破についての5人の無罪が確定した。"}, {"t": 1578.5166666666667, "x": "その日の午後、衆議院の法務委員会で\n議員がこう言っている。"}, {"t": 1581.9666666666667, "x": "けさ菅生事件の上告審の判決がありました。"}, {"t": 1584.9833333333333, "x": "検事側の上告は棄却されました。"}, {"t": 1587.4333333333334, "x": "その日のうちに国会で話に出たのね。"}, {"t": 1590.0333333333333, "x": "出た。そして議員は、こう続けた。"}, {"t": 1592.35, "x": "棄却されてみると、実際には交番は爆破されている。"}, {"t": 1595.7, "x": "だれがやったかという問題が残る、と。"}, {"t": 1598.2, "x": "みんな同じところで引っかかるのね。"}, {"t": 1600.4166666666667, "x": "3日後の12月19日。"}, {"t": 1602.1166666666666, "x": "今度は参議院の決算委員会だ。"}, {"t": 1604.3166666666666, "x": "大分出身の議員が、こう話している。"}, {"t": 1606.7833333333333, "x": "菅生というのは竹田市だ。"}, {"t": 1608.3, "x": "あの付近のことはよく知っている。"}, {"t": 1610.2833333333333, "x": "あの事件が起こって以来、\n8年半個人として関心を持って見てきた。"}, {"t": 1614.6833333333334, "x": "8年半。"}, {"t": 1615.6833333333334, "x": "1952年6月から1960年12月まで。"}, {"t": 1619.6166666666666, "x": "数えると8年半になる。"}, {"t": 1621.4, "x": "議員はこうも言っている。"}, {"t": 1622.7333333333333, "x": "ついにあの犯人がわからないのですね、あの爆破。"}, {"t": 1625.85, "x": "地元の人の言葉なのね。"}, {"t": 1627.7666666666667, "x": "この議員は戸高の家族についても\n知っていると話している。"}, {"t": 1631.1333333333334, "x": "隣の町の人だ。家族のことはよく知っている、と。"}, {"t": 1634.6166666666666, "x": "同じ地域の人どうしなのね。"}, {"t": 1636.5833333333333, "x": "そうだ。小さな地域の中で起きたことだ。"}, {"t": 1639.1833333333334, "x": "つかまった5人も、駐在所の家族も、\n戸高の家族もそこにいた。"}, {"t": 1643.3666666666666, "x": "8年半のあいだ、その全員が事件の中で暮らしていた。"}, {"t": 1647.1166666666666, "x": "裁判が終わっても、同じ地域に住んでるのよね。"}, {"t": 1650.1666666666667, "x": "そうだ。"}, {"t": 1650.8, "x": "判決は確定した。でも問いは1つ残った。"}, {"t": 1653.8, "x": "爆破したのは誰か。"}, {"t": 1655.8333333333333, "x": "ここで分かっていることと分かっていないことを分ける。"}, {"t": 1658.75, "x": "整理してくれると助かるわ。"}, {"t": 1660.6166666666666, "x": "まず分かっていること。"}, {"t": 1661.9333333333334, "x": "警察官が身分を隠して村に\n入っていた。警察庁が認めた。"}, {"t": 1666.05, "x": "爆発の前日に、計画の報告が\n上がっていた。警察庁が認めた。"}, {"t": 1670.65, "x": "その夜、村には警察官が配置されていた。\nこれも警察庁は認めている。"}, {"t": 1675.3666666666666, "x": "警察官はダイナマイトを受けとり、\n渡していた。判決が認めた。"}, {"t": 1679.6333333333334, "x": "けっこう分かってることが多いのね。"}, {"t": 1681.7166666666667, "x": "多い。次に判決が否定したこと。"}, {"t": 1684.0333333333333, "x": "5人が駐在所を爆破したこと。"}, {"t": 1685.9833333333333, "x": "証拠が足りないとされた。"}, {"t": 1687.6, "x": "戸高が爆破に加担したこと。これも否定された。"}, {"t": 1690.8666666666666, "x": "残ったのは？"}, {"t": 1691.9, "x": "誰が爆破したか。これが空いている。"}, {"t": 1694.1, "x": "国会ではいろいろな説が語られた。"}, {"t": 1696.3166666666666, "x": "警察の内側から仕掛けられたという\n議員の主張もあった。"}, {"t": 1699.7166666666667, "x": "警察の側は、5人の現行犯だという見方を\n変えなかった。"}, {"t": 1703.5833333333333, "x": "まったく正反対ね。"}, {"t": 1705.1333333333334, "x": "正反対だ。そしてどちらの言い分も\n判決はとらなかった。"}, {"t": 1708.8666666666666, "x": "どうして決まらなかったのかしら。"}, {"t": 1710.9, "x": "裁判は起訴された人がやったかどうかを決める場だ。"}, {"t": 1713.8833333333334, "x": "起訴されていない人について、やったか\nどうかは決めない。"}, {"t": 1717.2333333333333, "x": "だから、5人が違うってことまでしか言えないのね。"}, {"t": 1720.3666666666666, "x": "そうだ。5人が違うなら誰なのか。\nそれは裁判の外の問いになる。"}, {"t": 1724.5333333333333, "x": "そしてその問いを引き取る捜査は、\n記録の上では見えてこない。"}, {"t": 1728.1, "x": "1960年3月の国会で、刑事局長はこう答えている。"}, {"t": 1732.3666666666666, "x": "戸高の裁判の中で、可能なかぎり\n事実を明らかにする調べはしている。"}, {"t": 1736.8833333333334, "x": "ちゃんと調べたってこと？"}, {"t": 1738.5166666666667, "x": "調べているとは言った。"}, {"t": 1739.75, "x": "結果を明らかにするかどうかは別だ、とも言っている。"}, {"t": 1742.9333333333334, "x": "私が断定できるのは、ここまでだ。"}, {"t": 1745.2833333333333, "x": "誰がやったかを、この動画では決めない。"}, {"t": 1747.6166666666666, "x": "決める材料を持っている判決が、決めていないからだ。"}, {"t": 1751.4666666666667, "x": "1969年9月10日。"}, {"t": 1753.6666666666667, "x": "衆議院の地方行政委員会。"}, {"t": 1755.6, "x": "議員がある人事異動を取り上げた。"}, {"t": 1757.5166666666667, "x": "8月30日付けで、戸高公徳が\n警察大学校の研修所の教授になった。"}, {"t": 1762.85, "x": "教授？"}, {"t": 1763.5666666666666, "x": "特別捜査幹部研修所というところだ。"}, {"t": 1766.15, "x": "捜査の幹部を育てる場所になる。"}, {"t": 1768.2, "x": "警察庁の参事官は、そのとおりだと答えた。"}, {"t": 1771.35, "x": "認めたのね。"}, {"t": 1772.4666666666667, "x": "認めた。そのうえでさっきの答えを返している。"}, {"t": 1775.3333333333333, "x": "判決も確定し、本人は刑の免除を受けている。"}, {"t": 1778.5, "x": "公務員になる資格に欠けるところはない、と。"}, {"t": 1781.2, "x": "参事官はこうも言っている。"}, {"t": 1782.8166666666666, "x": "事件の内容については、\n先生とは違う見解を持っている。"}, {"t": 1786.5666666666666, "x": "議員と警察で、まだ見方が分かれてるのね。"}, {"t": 1789.5166666666667, "x": "分かれていた。事件から17年たっても、だ。"}, {"t": 1792.5833333333333, "x": "その後の歩みは、1989年の国会で\n読み上げられた本に書かれている。"}, {"t": 1797.5333333333333, "x": "研修所のあと、警視に上がった。"}, {"t": 1799.6833333333334, "x": "1977年2月には、\n警察庁の人事課の課長補佐になっている。"}, {"t": 1804.6833333333334, "x": "人事課って人を動かす部署よね。"}, {"t": 1806.9333333333334, "x": "そうだ。"}, {"t": 1807.5666666666666, "x": "最後は警察大学校の術科教養部長。"}, {"t": 1810.15, "x": "階級は警視長だった。"}, {"t": 1811.8166666666666, "x": "1985年に退職している。\nこれは百科事典にも出ている。"}, {"t": 1816.1833333333334, "x": "けいしちょう、ってどのくらい上なの？"}, {"t": 1818.2333333333333, "x": "警視長は警察の階級で上から3つ目だ。"}, {"t": 1821.15, "x": "かなり上なのね。"}, {"t": 1822.3833333333334, "x": "人名辞典は異例の昇進と書いている。"}, {"t": 1824.7666666666667, "x": "村の製材所の会計係として\n名乗った名前は、市木春秋。"}, {"t": 1828.75, "x": "33年後に退職したとき、その人は\n警察の学校の部長だった。"}, {"t": 1833.5, "x": "同じ人の話とは思えないわね。"}, {"t": 1835.8, "x": "同じ人だ。そこは1957年の国会で確かめられている。"}, {"t": 1840.1666666666667, "x": "1984年7月には、参議院でも同じ問いが出ている。"}, {"t": 1844.3, "x": "質問したのは、大分の事件だから\n気になっていたという議員だ。"}, {"t": 1848.1166666666666, "x": "戸高さんが有罪判決のあとに警察官に\nまたなっている。これは事実か。"}, {"t": 1852.8, "x": "25年たっても、まだ聞かれてたのね。"}, {"t": 1855.4833333333333, "x": "その場では、はっきりした答えは出なかった。"}, {"t": 1858.15, "x": "1週間後、同じ議員がこう話している。"}, {"t": 1860.75, "x": "あとで警察庁の官房長から報告を聞いた。"}, {"t": 1863.4333333333334, "x": "事実のようですね、と。"}, {"t": 1865.2166666666667, "x": "そこでやっと確かめられたのね。"}, {"t": 1867.2833333333333, "x": "一件落着だと受けとっていた、と本人が言っている。"}, {"t": 1870.5666666666666, "x": "裁判が終わると、事件は人の目から離れていく。"}, {"t": 1873.7166666666667, "x": "そのあとに起きたことは、\n聞かれないかぎり表に出てこない。"}, {"t": 1877.75, "x": "1989年10月25日。"}, {"t": 1880.35, "x": "参議院の予算委員会。"}, {"t": 1881.9666666666667, "x": "事件から37年たっていた。"}, {"t": 1884.1, "x": "議員がある会社の役員の名前を挙げた。"}, {"t": 1886.5, "x": "その会社の常務取締役。"}, {"t": 1888.4833333333333, "x": "そこに戸高公徳の名前があった。"}, {"t": 1890.8166666666666, "x": "退職したあとね。"}, {"t": 1892.2166666666667, "x": "そうだ。議員は警察庁の部長にこう聞いた。"}, {"t": 1894.9833333333333, "x": "菅生事件とは、どういう事件か説明してください。"}, {"t": 1898.2333333333333, "x": "部長は何て答えたの？"}, {"t": 1899.8666666666666, "x": "突然の御質問でございますので、\n私は内容を承知しておりません。"}, {"t": 1904.1833333333334, "x": "知らないって？"}, {"t": 1905.2333333333333, "x": "そう答えた。"}, {"t": 1906.1333333333334, "x": "議員は重ねて聞いた。"}, {"t": 1907.4166666666667, "x": "戸高公徳さんのことを知らないのですか。"}, {"t": 1910.0, "x": "そこで議員は、1冊の本を読み上げはじめる。"}, {"t": 1912.7833333333333, "x": "わずか戸数200あまりの農村で\n起こった駐在所の爆破事件。"}, {"t": 1916.5, "x": "事件の渦中に謎の人物がいて、\nその人物が現職の警官と判明した。"}, {"t": 1921.4, "x": "2つ目の章で読んだのも、この本の言葉だ。"}, {"t": 1924.3833333333334, "x": "37年たつと、警察の中でも\n知らない人が出てくるのね。"}, {"t": 1928.5166666666667, "x": "突然聞かれて、すぐには\n答えられなかった。それだけかもしれない。"}, {"t": 1932.55, "x": "ただこの答弁は会議録にそのまま残った。"}, {"t": 1935.3833333333334, "x": "残るのね、そういう言葉も。"}, {"t": 1937.3833333333334, "x": "残る。1956年の「われわれも探したい」も\n残っている。"}, {"t": 1941.7833333333333, "x": "1957年の「同一人である」も残っている。"}, {"t": 1945.3833333333334, "x": "1989年の「承知しておりません」も\n同じように残っている。"}, {"t": 1949.9833333333333, "x": "会議録って正直なのね。"}, {"t": 1951.8666666666666, "x": "言ったことしか残らない。"}, {"t": 1953.2333333333333, "x": "言わなかったことは残らない。"}, {"t": 1955.0, "x": "この事件で一番大事なことは、\n言われていない側にある。"}, {"t": 1958.4666666666667, "x": "誰が爆破したか、ね。"}, {"t": 1960.2333333333333, "x": "そうだ。今回集めた会議録の中に、\nそれを確かめた答弁はなかった。"}, {"t": 1964.8, "x": "この回の出どころを、ここで並べておく。"}, {"t": 1967.1666666666667, "x": "経過の大部分は、\n国会会議録検索システムの会議録だ。"}, {"t": 1971.15, "x": "1956年から1989年までの衆議院と\n参議院の委員会の記録になる。"}, {"t": 1976.9666666666667, "x": "判決の中身は、\n1984年の参議院での警察庁警備局長の答弁による。"}, {"t": 1982.6333333333334, "x": "年月日の照らし合わせには、\n日本大百科全書の菅生事件の項目を使った。"}, {"t": 1987.6666666666667, "x": "法律の公布日は、\n政府の法令データベースで確かめた。"}, {"t": 1991.1, "x": "出どころは以上だ。"}, {"t": 1992.9, "x": "最後に、1枚の紙の話に戻る。"}, {"t": 1995.5, "x": "押収第七号ね。"}, {"t": 1996.95, "x": "そうだ。革命は近いぞ、覚悟はよいか。"}, {"t": 1999.6166666666666, "x": "議員の説明では、そう書かれていた脅迫状だ。"}, {"t": 2002.6166666666666, "x": "誰が書いたのかを確かめるはずだった\n紙は、なくなった。"}, {"t": 2006.0166666666667, "x": "誰が爆破したのかを書くはずだった\n判決は、書かなかった。"}, {"t": 2009.8, "x": "どっちも空いたままなのね。"}, {"t": 2011.4833333333333, "x": "空いたままだ。"}, {"t": 2012.3666666666666, "x": "この事件で名前がはっきりしたのは1つだけだ。"}, {"t": 2015.3, "x": "市木春秋という名前の人が、本当は誰だったのか。"}, {"t": 2018.7666666666667, "x": "それは記者たちが\nアパートの部屋の前まで行って確かめた。"}, {"t": 2022.1333333333334, "x": "警察じゃなくて、記者だったのよね。"}, {"t": 2024.55, "x": "そうだ。"}, {"t": 2025.1666666666667, "x": "そして無罪になった5人がいる。"}, {"t": 2027.1166666666666, "x": "一審の判決から数えても、\n確定まで5年あまりかかった。"}, {"t": 2030.8666666666666, "x": "逮捕からは8年半だ。"}, {"t": 2032.6666666666667, "x": "そのあいだずっと疑われてたのね。"}, {"t": 2034.8166666666666, "x": "疑われていた。一審では懲役10年を\n言いわたされた人もいた。"}, {"t": 2038.6833333333334, "x": "今回、5人の名前は出していない。"}, {"t": 2040.9, "x": "駐在所に住んでいた家族の名前も出していない。"}, {"t": 2043.85, "x": "いまも同じ土地に家族の人がいるかも\nしれないものね。"}, {"t": 2047.1333333333334, "x": "そうだ。名前を出さなくても、\nこの事件の形は伝えられる。"}, {"t": 2050.883333333333, "x": "紙が1枚なくなった。"}, {"t": 2052.4666666666667, "x": "名前が1つ見つかった。"}, {"t": 2054.1, "x": "判決が1つ書かずに終わった。"}, {"t": 2056.1833333333334, "x": "1952年6月2日の未明に、菅生村で何があったのか。"}, {"t": 2060.633333333333, "x": "その夜のいちばん大事な一行は、今も空いている。"}, {"t": 2063.7833333333333, "x": "空いたところを、勝手に埋めないことも大事なのね。"}, {"t": 2066.8166666666666, "x": "ああ。埋めるなら記録で埋める。"}, {"t": 2068.633333333333, "x": "なくなった1枚が、どこかの倉庫の箱から\n出てくる日が来るのか。"}, {"t": 2072.5833333333335, "x": "そ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
