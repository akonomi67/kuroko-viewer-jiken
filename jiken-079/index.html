<script>
const D={"name": "079", "file": "079_編集用", "dur": 2125.0833125, "segs": [], "subs": [{"t": 0.0, "x": "二〇〇三年六月二十日の未明、\n福岡市東区で、一つの家族が殺された。"}, {"t": 5.2, "x": "夫婦と、子ども二人。四人だ。"}, {"t": 7.4, "x": "四人の遺体は、その日のうちに博多湾に沈められた。"}, {"t": 10.9, "x": "四人まるごと。"}, {"t": 12.05, "x": "ああ。関わったのは三人の男で、\n全員が当時二十代だった。"}, {"t": 16.066666666666666, "x": "そのうち一人は日本の裁判所で裁かれ、死刑が\n確定して、二〇一九年に刑が執行された。"}, {"t": 22.25, "x": "残る二人は、日本の法廷に一度も立っていない。"}, {"t": 25.3, "x": "二人は中国へ渡り、中国の裁判所で裁かれた。"}, {"t": 28.766666666666666, "x": "日本で起きた事件なのに？"}, {"t": 30.55, "x": "そうだ。そこが今回の話だ。"}, {"t": 32.733333333333334, "x": "私はこの回を作るとき、まず\n国会の記録を全部検索した。"}, {"t": 36.85, "x": "明治から今日までの、衆議院と\n参議院の会議録すべてだ。"}, {"t": 40.416666666666664, "x": "この事件の名前で引いてみた。"}, {"t": 42.15, "x": "ヒットは、ゼロだった。"}, {"t": 43.833333333333336, "x": "ゼロ？"}, {"t": 44.483333333333334, "x": "一件も無い。事件の名前では、\n国会の記録に一度も出てこない。"}, {"t": 48.53333333333333, "x": "ではどう引けば出てくるのか。"}, {"t": 50.05, "x": "「代理処罰」という言葉だ。"}, {"t": 51.96666666666667, "x": "制度の名前で引くと、出てくる。"}, {"t": 54.016666666666666, "x": "今回はそこを追っていく。"}, {"t": 55.53333333333333, "x": "先に、この動画で守ることを言っておく。"}, {"t": 58.03333333333333, "x": "一つ目。亡くなった四人の名前も、\n年齢も、何があったのかの細かいところも、\nこの動画では出さない。"}, {"t": 64.43333333333334, "x": "二つ目。実行した三人の名前も出さない。"}, {"t": 67.21666666666667, "x": "理由はあとで話す。"}, {"t": 68.6, "x": "三つ目。どこの国の人だったから、という\n言い方を一度もしない。"}, {"t": 72.55, "x": "これは国の話ではなく、仕組みの話だからだ。"}, {"t": 76.33333333333333, "x": "まず、動かない事実だけを置く。"}, {"t": 78.36666666666666, "x": "二〇〇三年六月二十日の未明、\n福岡市東区の住宅に、三人の男が押し入った。"}, {"t": 84.0, "x": "目的は金品だったと、のちの判決は認定している。"}, {"t": 87.53333333333333, "x": "家にいた四人が殺された。"}, {"t": 89.21666666666667, "x": "四人の遺体は、同じ夜のうちに\n博多湾に運ばれ、沈められた。"}, {"t": 93.48333333333333, "x": "同じ夜のうちに。"}, {"t": 94.8, "x": "ああ。ここから先は言わない。"}, {"t": 96.5, "x": "どうやって、どんな状態で、という\n話は、この動画では一切しない。"}, {"t": 100.65, "x": "報道にも判決にも書いてあるが、\n私はそこを読み上げない。"}, {"t": 104.36666666666666, "x": "ご遺族がいるものね。"}, {"t": 105.83333333333333, "x": "そうだ。子どもが二人いた家だ。"}, {"t": 107.81666666666666, "x": "この事件を「どれだけ酷かったか」で\n語る動画は、もう世の中にたくさんある。"}, {"t": 112.56666666666666, "x": "私がこの回で見たいのは、そこではない。"}, {"t": 115.15, "x": "三人のうち一人だけが日本で裁かれ、\n二人は日本の法廷に来なかった。"}, {"t": 119.73333333333333, "x": "なぜそうなったのか。"}, {"t": 121.01666666666667, "x": "その「なぜ」は、\nこの三人の誰かの性格の話ではない。"}, {"t": 124.9, "x": "日本と外国のあいだにある、ある仕組みの話だ。"}, {"t": 128.08333333333334, "x": "仕組み。"}, {"t": 128.85, "x": "そう。国境をまたいだ瞬間、\n日本の刑罰権はそこで止まる。"}, {"t": 132.7, "x": "止まったあと、どうなるのか。\nそれを最後まで見ていく。"}, {"t": 135.83333333333334, "x": "先に断っておくが、この回で\n「逃げ得だった」という話はしない。"}, {"t": 140.21666666666667, "x": "三人とも、罰は受けている。\nそこは事実として動かない。"}, {"t": 143.98333333333332, "x": "じゃあ、何が問題なの？"}, {"t": 145.73333333333332, "x": "誰が裁いたか、だ。"}, {"t": 147.21666666666667, "x": "日本で起きた事件を、日本の裁判所が\n最後まで裁けなかった。"}, {"t": 151.15, "x": "そのことが当時どう説明されたのか。\nそして、いまどうなっているのか。"}, {"t": 155.33333333333334, "x": "国会の記録には、その説明がきちんと残っている。"}, {"t": 158.7, "x": "残っているのに、ほとんど読まれていない。"}, {"t": 161.68333333333334, "x": "事件のあと、三人は別々の道をたどった。"}, {"t": 164.63333333333333, "x": "一人は日本に残っていた。"}, {"t": 166.38333333333333, "x": "この男は事件の年の八月、\n別の事件の容疑で逮捕されている。"}, {"t": 170.65, "x": "そして年が明けた二〇〇四年一月、\nこの事件の容疑であらためて逮捕された。"}, {"t": 175.36666666666667, "x": "同じ月のうちに起訴されている。"}, {"t": 177.46666666666667, "x": "日本に残っていたのね。"}, {"t": 179.16666666666666, "x": "ああ。残っていたから、日本の裁判所が裁けた。"}, {"t": 182.36666666666667, "x": "単純な話だ。日本の刑事裁判は、その人が\n日本の中にいなければ動かせない。"}, {"t": 187.66666666666666, "x": "日本の刑事訴訟法の第二百八十六条に、\nこう書いてある。"}, {"t": 191.51666666666668, "x": "「被告人が公判期日に出頭しないときは、\n開廷することはできない」"}, {"t": 195.81666666666666, "x": "軽い罰金の事件などをのぞけば、\n本人がいなければ法廷を開けない。"}, {"t": 199.98333333333332, "x": "欠席のまま有罪にはできないのね。"}, {"t": 202.35, "x": "できない。逆に言えば、残る二人は日本の外に出た。"}, {"t": 205.75, "x": "出た時点で、日本の裁判所にできることは、\nほとんど無くなる。"}, {"t": 209.73333333333332, "x": "追いかけられないの？"}, {"t": 211.03333333333333, "x": "捜査はできる。逮捕状も取れる。"}, {"t": 212.95, "x": "国際刑事警察機構を通した国際手配もできる。"}, {"t": 216.31666666666666, "x": "紙の上では、世界中どこにいても\n手配されている状態になる。"}, {"t": 220.03333333333333, "x": "だが、実際に身柄を日本に連れ戻すとなると、\n相手の国の協力がどうしても要る。"}, {"t": 225.16666666666666, "x": "手配されているというだけでは、誰も動かせない。"}, {"t": 228.11666666666667, "x": "手配は、お願いの紙なのね。"}, {"t": 230.21666666666667, "x": "そういうことだ。そして、\nその協力の形が、国によってまるで違う。"}, {"t": 234.68333333333334, "x": "ここが今回の芯になる。"}, {"t": 236.33333333333334, "x": "先に日本で行われた裁判のほうを片づけてしまおう。"}, {"t": 239.58333333333334, "x": "こちらは日本の裁判所が認定した\n事実なので、はっきり言える。"}, {"t": 244.08333333333334, "x": "一審は福岡地方裁判所だった。"}, {"t": 246.35, "x": "判決が出たのは、二〇〇\n五年五月十九日。死刑だった。"}, {"t": 250.13333333333333, "x": "弁護側が控訴し、二審は福岡高等裁判所。"}, {"t": 253.36666666666667, "x": "二〇〇七年三月八日、控訴は棄却された。"}, {"t": 256.26666666666665, "x": "死刑が維持された。"}, {"t": 257.71666666666664, "x": "そこから最高裁ね。"}, {"t": 259.3, "x": "ああ。最高裁判所第一小法廷の判決は、\n二〇一一年十月二十日だ。"}, {"t": 264.3333333333333, "x": "上告は棄却され、死刑が確定した。"}, {"t": 266.85, "x": "裁判官五人は全員一致だった。"}, {"t": 269.1333333333333, "x": "報道されている判決の言葉を引く。"}, {"t": 271.43333333333334, "x": "「金品のためには人の生命の尊さも\n意に介しない行為は冷酷、残忍。"}, {"t": 275.78333333333336, "x": "刑事責任は極めて重大で、\n死刑を是認せざるを得ない」"}, {"t": 279.5, "x": "事件から八年かかったのね。"}, {"t": 281.5833333333333, "x": "そうだ。そして死刑が執行されたのは、\n二〇一九年十二月二十六日。"}, {"t": 286.3, "x": "福岡拘置所だった。"}, {"t": 287.9, "x": "当時の法務大臣は記者会見で、こう説明している。"}, {"t": 291.25, "x": "「身勝手な理由から、幸せに暮らしていた子どもを\n含む家族全員を殺害した極めて冷酷かつ残忍な事件」"}, {"t": 297.8333333333333, "x": "「慎重な検討を経た上で死刑の執行を命じた」"}, {"t": 300.81666666666666, "x": "なお、同じ日に日本弁護士連合会が、\nこの執行に抗議する会長声明を出している。"}, {"t": 306.1666666666667, "x": "抗議。"}, {"t": 306.85, "x": "日弁連は死刑制度そのものに反対の立場だからだ。"}, {"t": 310.25, "x": "私はこの動画で、死刑がいいか\n悪いかという話はしない。"}, {"t": 313.81666666666666, "x": "そういう声明が出た、という事実だけを置いておく。"}, {"t": 316.6666666666667, "x": "ここまでが、日本の裁判所が扱った部分だ。"}, {"t": 319.68333333333334, "x": "三人のうち、一人。"}, {"t": 321.8333333333333, "x": "では、残る二人だ。"}, {"t": 323.31666666666666, "x": "二人は事件のあと日本を出て、中国へ渡っている。"}, {"t": 326.5, "x": "二人とも中国籍だった。"}, {"t": 328.18333333333334, "x": "母国に戻った、ということになる。"}, {"t": 330.53333333333336, "x": "帰ってしまったのね。"}, {"t": 332.0, "x": "ああ。そして、ここからが日本の司法にとっての壁だ。"}, {"t": 335.3666666666667, "x": "日本の警察と検察が、この二人を日本の法廷に\n立たせようとすると、二つのやり方しかない。"}, {"t": 341.4166666666667, "x": "一つは、二人が自分から日本に\n戻ってくるのを待つこと。"}, {"t": 345.01666666666665, "x": "もう一つは、中国に「引き渡してくれ」と頼むことだ。"}, {"t": 348.9, "x": "頼めば渡してくれるものなの？"}, {"t": 350.9166666666667, "x": "それを決めるのが、犯罪人引渡条約というものだ。"}, {"t": 354.4166666666667, "x": "国と国のあいだで、一定の条件を満たせばお互いに\n犯罪人を引き渡す、と約束しておく条約だ。"}, {"t": 360.76666666666665, "x": "「引き渡してくれたらありがたい」ではなく、\n「引き渡す義務がある」という形にする。"}, {"t": 365.73333333333335, "x": "日本と中国のあいだには、それがあるの？"}, {"t": 368.3666666666667, "x": "無い。"}, {"t": 368.8333333333333, "x": "事件が起きた二〇〇三年の時点でも無かったし、\nこの動画を作っている二〇二六年の時点でも無い。"}, {"t": 374.95, "x": "この二十三年、一度も結ばれていない。"}, {"t": 377.6, "x": "そんなに長いあいだ。"}, {"t": 379.01666666666665, "x": "ああ。ちなみに、条約が無い相手に\nまったく頼めないわけではない。"}, {"t": 382.85, "x": "日本の法律には、条約が無い相手からの請求にも\n応じられる道が用意してある。"}, {"t": 387.6666666666667, "x": "ただし条件がある。相手の国が「日本が\n同じことを頼んだときは応じる」と保証すること。"}, {"t": 393.3666666666667, "x": "お互い様にする、ということね。"}, {"t": 395.53333333333336, "x": "そうだ。相互主義という。\nこの保証が無ければ、日本は手続に入らない。"}, {"t": 400.06666666666666, "x": "そして、この道を使ったとしても、\n最後に決めるのは相手の国だ。"}, {"t": 404.2, "x": "頼むことはできる。断られたら、それで終わる。"}, {"t": 407.15, "x": "条約があれば、断れなくなる。そこが違う。"}, {"t": 410.1, "x": "そして、そのあとに起きたことが、\nこの事件をややこしくした。"}, {"t": 414.45, "x": "二人は、中国の当局に拘束された。"}, {"t": 417.03333333333336, "x": "事件の年の八月のことだ。"}, {"t": 419.1333333333333, "x": "そして中国で起訴され、中国の裁判所で裁かれた。"}, {"t": 422.65, "x": "裁いたのは、遼寧省遼陽市の中級人民法院だ。"}, {"t": 426.18333333333334, "x": "中級人民法院。"}, {"t": 427.6666666666667, "x": "日本でいう地方裁判所にあたる。"}, {"t": 429.68333333333334, "x": "判決が出たのは、二〇〇五年一月二十四日。"}, {"t": 432.81666666666666, "x": "一人は死刑、もう一人は無期懲役だった。"}, {"t": 435.71666666666664, "x": "二人で違うのね。"}, {"t": 437.1, "x": "ああ。無期懲役になったほうについては、\n中国の法律でいう自首が\n認められた、と報じられている。"}, {"t": 442.93333333333334, "x": "別の件で拘束されたときに自分から関与を\n申し出て、捜査に協力した、という理由だ。"}, {"t": 448.5, "x": "死刑判決を受けたほうは上訴したが、\n遼寧省の高級人民法院がこれを\n棄却して、死刑が確定した。"}, {"t": 455.1333333333333, "x": "刑が執行されたのは、二〇〇五年七月十二日。"}, {"t": 458.28333333333336, "x": "当時二十五歳だった。"}, {"t": 459.95, "x": "二人とも罰は受けたということ？"}, {"t": 462.05, "x": "受けた。ここは大事なところだ。"}, {"t": 464.06666666666666, "x": "「逃げ得になった」という話ではない。"}, {"t": 466.3833333333333, "x": "ただし、ここから先は言い方を\n厳しく分ける必要がある。"}, {"t": 469.85, "x": "いま私が話したのは、全部\n「中国の裁判所が認定した」ことだ。"}, {"t": 474.45, "x": "日本の裁判所は、この二人について\n何一つ認定していない。"}, {"t": 478.31666666666666, "x": "日本の判決文に、この二人の有罪は書かれていない。"}, {"t": 481.81666666666666, "x": "日本では裁かれていないから。"}, {"t": 483.75, "x": "そうだ。だから私は、この二人について\n「有罪だ」と日本の司法の言葉では言えない。"}, {"t": 489.1666666666667, "x": "もう一つ、言っておきたいことがある。"}, {"t": 491.35, "x": "中国での取り調べは、日本の要請を\n受けて中国の公安当局が行った。"}, {"t": 496.21666666666664, "x": "福岡地検の検察官が、その取り調べに\n立ち会ったとも報じられている。"}, {"t": 500.71666666666664, "x": "日本側が集めた証拠も、\n捜査共助という形で中国に渡っている。"}, {"t": 505.0833333333333, "x": "外務省の局長は、のちに国会でそこにも触れている。"}, {"t": 508.48333333333335, "x": "「あの中国の件につきましては、"}, {"t": 510.3333333333333, "x": "捜査共助というその過程でいろいろ日本側から\n十分な証拠が提供されたのでこういうことになった」"}, {"t": 516.15, "x": "日本の証拠が使われたのね。"}, {"t": 518.1666666666666, "x": "ああ。日本の捜査が無ければ、\n中国の裁判は成り立たなかったと思う。"}, {"t": 522.4666666666667, "x": "それでも、裁いたのは中国の裁判所だった。"}, {"t": 526.0333333333333, "x": "この結末は、当時からある言葉で呼ばれてきた。"}, {"t": 529.0333333333333, "x": "「代理処罰」だ。"}, {"t": 530.4166666666666, "x": "代わりに罰する。"}, {"t": 531.6333333333333, "x": "ああ。日本が裁けないから、中国が日本の代わりに\n裁いてくれた、という意味で使われている。"}, {"t": 537.2166666666667, "x": "報道でもそう書かれたし、いまでも\nそう説明されていることが多い。"}, {"t": 540.9833333333333, "x": "だが、この言葉には国会の場で、\nはっきり疑いが出されている。"}, {"t": 544.8833333333333, "x": "二〇〇七年二月二十一日、衆議院法務委員会。"}, {"t": 548.2833333333333, "x": "法務省の刑事局長が、代理処罰とは\n何かを説明している。読む。"}, {"t": 552.6666666666666, "x": "「代理処罰という言葉でございますけれども、\nこれは、一般的には、"}, {"t": 556.6333333333333, "x": "本来の処罰国にかわって他の国が処罰するという理念を\n指すとされておりますけれども、いろいろな意味に"}, {"t": 562.7333333333333, "x": "使われているようでございまして、もちろん\n法律上、何か定義があるわけでもございません」"}, {"t": 567.8166666666667, "x": "法律上の定義が無い。"}, {"t": 569.4333333333333, "x": "無い。つまり「代理処罰」は、法律用語ではない。"}, {"t": 572.7833333333333, "x": "同じ局長は、この続きでもっと踏み込んでいる。"}, {"t": 575.7333333333333, "x": "「決して、日本の刑罰権をいわばブラジル側に"}, {"t": 578.5666666666667, "x": "渡して、そういう意味で\nかわってやってもらったということではない」"}, {"t": 582.1, "x": "ブラジル？"}, {"t": 582.9166666666666, "x": "この日の質問は別の事件についてのものだったからだ。"}, {"t": 586.2166666666667, "x": "だが言っていることの中身は同じだ。"}, {"t": 588.3666666666667, "x": "日本の刑罰権は、外国に渡せない。"}, {"t": 591.0333333333333, "x": "渡せないものを「代理」と\n呼ぶのは、そもそもおかしい。"}, {"t": 594.35, "x": "そしてこの理屈を、この福岡の事件そのものについて\n述べた答弁がある。"}, {"t": 599.3333333333334, "x": "二〇〇六年四月二十日。"}, {"t": 600.9166666666666, "x": "参議院の外交防衛委員会だ。"}, {"t": 602.9833333333333, "x": "この日、ある議員が海外に逃げた\n被疑者の問題を取り上げている。"}, {"t": 606.75, "x": "中心になっていたのはブラジルの話だった。"}, {"t": 609.4166666666666, "x": "ブラジルは憲法で自国民の引き渡しを\n禁じているので、日本が\n求めても引き渡してもらえない。"}, {"t": 615.2166666666667, "x": "憲法に書いてあるの？"}, {"t": 616.7, "x": "ああ。この日の議論では、日本に\n逃亡犯罪人が八十六人いる相手として、\nブラジルの名前が出ている。"}, {"t": 623.0666666666667, "x": "その流れで、この議員が過去の例として\nこの福岡の事件を持ち出した。"}, {"t": 627.35, "x": "質問の言葉を、名前の部分を伏せて引く。"}, {"t": 630.15, "x": "「記憶に新しいのが福岡での一家殺害事件で、"}, {"t": 633.1166666666667, "x": "中国政府は外交的に率先して\n代理処罰を行ったという例は"}, {"t": 636.9666666666667, "x": "記憶に新しいと思うんですが、\nこの福岡の事件以外に代理処罰が施行された、"}, {"t": 641.75, "x": "履行された例はどれぐらいあるんでしょうか」"}, {"t": 644.2, "x": "ほかにも例はあるのか、って聞いているのね。"}, {"t": 646.7, "x": "そうだ。この事件が、うまくいった\n見本として語られている。"}, {"t": 650.2666666666667, "x": "中国が率先して動いてくれた、と。"}, {"t": 652.6833333333333, "x": "この質問に答えたのが、外務省の国際法局長だ。"}, {"t": 656.3166666666667, "x": "国際法局というのは、条約の解釈を担当する部署だ。"}, {"t": 660.0833333333334, "x": "条約や国際法について、政府としての理屈を\n整理して答える立場にある。"}, {"t": 664.75, "x": "その人が、この事件についてどう答えたか。"}, {"t": 667.5666666666667, "x": "私はこの答弁を読んだとき、\nこの回のテーマが決まったと思った。"}, {"t": 671.65, "x": "そんなに？"}, {"t": 672.5166666666667, "x": "ああ。世の中でこの事件がどう\n語られてきたかと、まるで違うことを言っている。"}, {"t": 677.05, "x": "しかも、喧嘩腰でもなければ、目立つ答弁でもない。"}, {"t": 680.3666666666667, "x": "淡々と、理屈だけを並べている。"}, {"t": 682.6, "x": "次の章で、丸ごと読む。"}, {"t": 684.9833333333333, "x": "外務省国際法局長の答弁だ。"}, {"t": 687.2166666666667, "x": "長いが、そのまま読む。"}, {"t": 688.8833333333333, "x": "「今おっしゃいました代理処罰というその言葉、"}, {"t": 691.3666666666667, "x": "報道等で私ども目にするわけでございますけれども、"}, {"t": 694.4, "x": "必ずしも適切な言葉かなという疑問は持っております」"}, {"t": 698.0666666666667, "x": "いきなり否定から入ったわね。"}, {"t": 700.0166666666667, "x": "ああ。そして理屈を説明していく。"}, {"t": 702.2666666666667, "x": "「日本で犯罪行為が行われた場合に、当然日本は"}, {"t": 705.5166666666667, "x": "領域に基づく管轄権に基づきまして、\n日本国民のみならず、"}, {"t": 709.3666666666667, "x": "外国人が日本国内で行った犯罪を\n犯罪としてそれを取り締まるという、\nそういう刑法上の管轄権を持っていると」"}, {"t": 716.4833333333333, "x": "「他方、国籍をつながりといたしまして、"}, {"t": 718.85, "x": "自国民が外国で行う一定の犯罪を\nこれを犯罪と定めると。これは"}, {"t": 723.1666666666666, "x": "各国刑法で行われていることでございまして、"}, {"t": 725.8666666666667, "x": "日本の刑法も国民の国外犯ということを\n定めているわけでございます」"}, {"t": 730.3833333333333, "x": "日本の刑法にも同じ決まりがある、ということ？"}, {"t": 733.35, "x": "そうだ。日本人が外国で罪を犯したときも、\n日本の刑法で裁ける場合がある。"}, {"t": 738.3333333333334, "x": "どの国もそういう決まりを持っている。"}, {"t": 740.4, "x": "そのうえで、局長はこの事件をこう位置づけた。"}, {"t": 743.25, "x": "「それで、福岡の件でございますけれども、\nこの殺人という行為につきまして、日本の刑法上、"}, {"t": 748.95, "x": "日本の刑事裁判管轄権のある犯罪であると。\nそれと同時に、中国の刑法におきましても、"}, {"t": 754.7, "x": "国民の国外犯として\n中国の刑事裁判管轄権があって、そこで"}, {"t": 759.4, "x": "裁判管轄権が\n競合をしているということであろうかと思います」"}, {"t": 762.8666666666667, "x": "競合。両方に権限がある状態ね。"}, {"t": 765.45, "x": "ああ。そして、ここが結論だ。"}, {"t": 767.55, "x": "「したがいまして、最終的に"}, {"t": 769.3, "x": "中国がこれを自国の刑法に基づいて\n処罰したわけでございますけれども、これは"}, {"t": 773.5, "x": "日本の代理ということではなくて、"}, {"t": 775.7, "x": "あくまでも自国の刑事裁判管轄権に基づいて\n裁判をしたということではないかと」"}, {"t": 780.85, "x": "……代理じゃない。"}, {"t": 781.8166666666667, "x": "日本の代わりではない。"}, {"t": 783.0333333333333, "x": "中国が中国の権限で裁いただけだ。"}, {"t": 785.6833333333333, "x": "日本の刑罰権は、あの二人に一度も届いていない。"}, {"t": 789.5666666666667, "x": "では、なぜ中国に権限があったのか。"}, {"t": 792.05, "x": "条文がある。中華人民共和国刑法の第七条だ。"}, {"t": 795.5, "x": "中国語の条文なので、日本語に直して読む。"}, {"t": 798.4333333333333, "x": "「中華人民共和国公民が中華人民共和国の領域外で\n本法に規定する罪を犯した場合は、本法を適用する」"}, {"t": 805.75, "x": "自分の国の人が外国で罪を\n犯しても、自分の国の法律で裁ける。"}, {"t": 810.4833333333333, "x": "そうだ。属人管轄という。"}, {"t": 812.2833333333333, "x": "人に付いてくる管轄、という意味だ。"}, {"t": 814.7333333333333, "x": "領土ではなく国籍で決まる。"}, {"t": 816.6, "x": "条文には続きがあって、最高刑が三年以下の懲役に\nとどまる罪なら追及しなくてもよい、とある。"}, {"t": 822.7666666666667, "x": "逆に言えば、重い罪ならきっちり\n追及できるということだ。"}, {"t": 826.3833333333333, "x": "今回は重い罪だものね。"}, {"t": 828.2333333333333, "x": "ああ。だから中国の裁判所に、\nはじめから権限があった。"}, {"t": 831.9, "x": "さらに同じ刑法の第十条にも、こう\n書いてある。これも日本語に直したものだ。"}, {"t": 836.6833333333333, "x": "「およそ中華人民共和国の領域外で犯罪を犯し、"}, {"t": 839.8166666666667, "x": "本法によって刑事責任を負うべき者は、"}, {"t": 842.2666666666667, "x": "外国の裁判を経たとしても、なお本法に\nよって追及することができる」"}, {"t": 846.85, "x": "外国で裁かれていても、もう一度自分の国で裁ける。"}, {"t": 850.4666666666667, "x": "ああ。ただし、外国ですでに刑罰を受けているなら、\n免除または軽減できる、とも書いてある。"}, {"t": 856.0833333333334, "x": "つまり中国の刑法は、自国民については「どこで\n何があっても、こちらで裁く」という作りになっている。"}, {"t": 862.5833333333334, "x": "外務省の局長が「競合している」と\n言ったのは、この条文のことだ。"}, {"t": 867.6, "x": "権限があることと、引き渡さないことは別の話だ。"}, {"t": 871.0, "x": "中国が二人を日本に引き渡さなかった\n理由も、条文にはっきり書いてある。"}, {"t": 875.5833333333334, "x": "中華人民共和国引渡法。"}, {"t": 877.6666666666666, "x": "二〇〇〇年十二月二十八日に成立した法律だ。"}, {"t": 881.0666666666667, "x": "事件の二年半前にできたばかりの、\n新しい法律だった。"}, {"t": 884.7666666666667, "x": "その第八条は、引き渡しを\n「拒絶しなければならない」場合を並べている。"}, {"t": 889.4166666666666, "x": "その第一号を、日本語に直して読む。"}, {"t": 891.8666666666667, "x": "「中華人民共和国の法律により、引渡しを請求された\n者が中華人民共和国の国籍を有する場合」"}, {"t": 898.6166666666667, "x": "自国民は渡さない。"}, {"t": 900.15, "x": "ああ。しかもこれは「拒んでもよい」ではない。"}, {"t": 902.8666666666667, "x": "条文の言葉は「拒絶しなければならない」だ。"}, {"t": 905.7, "x": "日本の法律でいう義務にあたる。"}, {"t": 907.8, "x": "断る義務があるのね。"}, {"t": 909.3333333333334, "x": "そうだ。担当者の判断が入る余地が無い。"}, {"t": 912.0166666666667, "x": "さらに第九条には、拒むことが「できる」\n場合も並んでいて、その一番目がこうだ。"}, {"t": 917.2833333333333, "x": "中国に裁判管轄権があって、\nその人について刑事訴追を進めているか、\nこれから起こそうとしている場合。"}, {"t": 923.9, "x": "今回はこれにも当たる。"}, {"t": 925.35, "x": "つまり日本が引渡しを求めたとしても、\n中国の法律の側は最初から二重に閉じていた。"}, {"t": 931.0833333333334, "x": "はじめから決まっていたようなものね。"}, {"t": 933.3, "x": "ああ。ここで多くの人は、こう思うと思う。"}, {"t": 935.8666666666667, "x": "「中国は自国民を渡さない国なんだな」と。"}, {"t": 938.75, "x": "私も最初はそう思った。だが、\n調べていくと、その理解は間違っていた。"}, {"t": 944.15, "x": "日本にも、同じ法律がある。"}, {"t": 946.1333333333333, "x": "逃亡犯罪人引渡法。昭和二十八年、\n一九五三年の法律だ。"}, {"t": 951.3666666666667, "x": "この第二条は、引き渡してはならない\n場合を並べている。"}, {"t": 954.7166666666667, "x": "その第九号を読む。"}, {"t": 956.0333333333333, "x": "「逃亡犯罪人が日本国民であるとき」"}, {"t": 958.6666666666666, "x": "……同じ。"}, {"t": 959.3833333333333, "x": "同じだ。日本も、自国民は引き渡さない。"}, {"t": 962.3666666666667, "x": "条文の頭には「次の各号のいずれかに\n該当する場合には、逃亡犯罪人を\n引き渡してはならない」とある。"}, {"t": 969.0166666666667, "x": "これも「渡さなくてよい」ではなく\n「渡してはならない」だ。"}, {"t": 972.85, "x": "中国と同じ書き方なのね。"}, {"t": 974.9333333333333, "x": "ああ。そしてこれは日本と中国だけの話でもない。"}, {"t": 978.1333333333333, "x": "さっき出てきたブラジルは、憲法にそれを書いている。"}, {"t": 981.1333333333333, "x": "自国民を引き渡さないという\n考え方は、世界にごく普通にある。"}, {"t": 985.2166666666667, "x": "自分の国の人を、よその国の法廷と\n刑務所に送り込むことへの警戒心だ。"}, {"t": 990.0333333333333, "x": "どういう裁判をされるか\n分からない、という不安が根っこにある。"}, {"t": 993.5333333333333, "x": "そう言われると、分かる気もするわ。"}, {"t": 995.7, "x": "ああ。この考え方には名前が付いている。"}, {"t": 998.0666666666667, "x": "自国民不引渡の原則という。"}, {"t": 1000.4666666666667, "x": "日本の国会にこの言葉が出てくるのは、\n私が調べたかぎり一度だけだ。"}, {"t": 1005.0166666666667, "x": "一九五八年四月三日。"}, {"t": 1007.2, "x": "参議院の外務委員会と法務委員会の連合審査会。"}, {"t": 1010.4833333333333, "x": "外務省の条約局長が、こう説明している。"}, {"t": 1013.4666666666667, "x": "「自国民不引渡の原則と申しますか、"}, {"t": 1016.1666666666666, "x": "犯罪人引渡条約にはそういうことを\n例外として規定するのが通例でございます」"}, {"t": 1021.35, "x": "通例。よくあること、ということね。"}, {"t": 1023.7833333333333, "x": "ああ。六十八年前から、ずっと同じ論点なんだ。"}, {"t": 1027.1833333333334, "x": "ああ。だからこの事件を\n「中国が渡さなかった事件」として\n語るのは、正確ではない。"}, {"t": 1032.55, "x": "正確に言うなら、こうなる。"}, {"t": 1034.2833333333333, "x": "どちらの国も自国民を渡さない仕組みを持っていて、\nそのあいだに、それを外す約束が無かった。"}, {"t": 1040.15, "x": "片方が冷たかったのではない。"}, {"t": 1041.95, "x": "両方が同じ壁を持っていて、扉を作っていなかった。"}, {"t": 1046.0333333333333, "x": "これは昔の法律の話ではない。"}, {"t": 1048.2666666666667, "x": "二〇二六年七月九日、\n参議院法務委員会。今年の答弁だ。"}, {"t": 1052.9666666666667, "x": "法務省の刑事局長が、条約の無い国から引渡しを\n求められたらどうなるかを説明している。読む。"}, {"t": 1059.2666666666667, "x": "「逃亡犯罪人引渡条約を締結していない\n国からの引渡請求につきましては、"}, {"t": 1064.5333333333333, "x": "我が国のこの逃亡犯罪人引渡法に基づいてその可否が\n判断されることになるわけでございますが」"}, {"t": 1070.7166666666667, "x": "「同法は、引渡犯罪が\n政治犯罪であるとき、あるいは引渡犯罪に係る\n行為が日本国内において"}, {"t": 1077.0833333333333, "x": "行われたとした場合において、\n当該行為が日本国の法令により死刑又は"}, {"t": 1081.4333333333334, "x": "無期若しくは長期三年以上の拘禁刑に\n処すべき罪に当たるものでないとき、"}, {"t": 1085.6833333333334, "x": "逃亡犯罪人が日本国民であるとき、こういった場合には"}, {"t": 1089.05, "x": "逃亡犯罪人を引き渡してはならないと\n規定しているところでございます」"}, {"t": 1093.3333333333333, "x": "今年の国会でも、そう言っているのね。"}, {"t": 1095.9, "x": "ああ。二十三年前と同じ答えが、いまも返ってくる。"}, {"t": 1099.35, "x": "もし日本人が外国で罪を犯して\n日本に逃げ帰ってきたら、日本も\n原則としてその人を渡さない。"}, {"t": 1105.6166666666666, "x": "立場が逆になるだけで、同じことが起きるのね。"}, {"t": 1108.7333333333333, "x": "そうだ。実際、そういう事例も国会で議論されている。"}, {"t": 1112.1166666666666, "x": "日本人が外国でひき逃げをして日本に\n戻ってきた場合はどうなるのか、という質問だ。"}, {"t": 1117.2833333333333, "x": "答弁では、罪の種類によっては\n日本の刑法に国外犯の規定が無く、"}, {"t": 1121.55, "x": "日本でも裁けない場合がある、と説明されている。"}, {"t": 1124.75, "x": "どちらでも裁かれない、ということが起きうるの？"}, {"t": 1127.5666666666666, "x": "制度の隙間としては、ある。"}, {"t": 1129.4166666666667, "x": "だからこそ、条約が要る。"}, {"t": 1131.8, "x": "ここで、条約が何をするものなのかを\nはっきりさせておきたい。"}, {"t": 1135.4333333333334, "x": "日本の逃亡犯罪人引渡法の第二条には、\nただし書きが付いている。"}, {"t": 1139.9, "x": "「ただし、第三号、第四号、第八号又は"}, {"t": 1142.9833333333333, "x": "第九号に該当する場合において、引渡条約に\n別段の定めがあるときは、この限りでない」"}, {"t": 1148.75, "x": "第九号って、日本国民のときの決まりよね。"}, {"t": 1151.9, "x": "そうだ。つまり、条約さえあれば、\n自国民を渡さないという縛りを外せる。"}, {"t": 1156.5, "x": "法務省の犯罪白書にも、そのまま書いてある。読む。"}, {"t": 1159.9, "x": "「逃亡犯罪人引渡条約を締結することで、"}, {"t": 1162.9333333333334, "x": "締約国間では、一定の要件の下に\n逃亡犯罪人の引渡しを相互に\n義務付けることになるほか、"}, {"t": 1168.9666666666667, "x": "我が国の逃亡犯罪人引渡法で"}, {"t": 1171.6666666666667, "x": "原則として禁止されている自国民の引渡しを\n被要請国の裁量により行うことを認めることにより、"}, {"t": 1177.4, "x": "締約国との間の国際協力の強化を図ることができる」"}, {"t": 1181.3333333333333, "x": "条約って、そういうものなのね。"}, {"t": 1183.5166666666667, "x": "ああ。条約が無いと、頼むことしかできない。"}, {"t": 1186.35, "x": "条約があると、義務になる。"}, {"t": 1188.1666666666667, "x": "それに、条約が無い相手に引渡しを頼むときは、\nこちらも同じ約束をしなければならない。"}, {"t": 1193.8166666666666, "x": "日本の法律には、相手国から「\n日本が同じことを頼んだときは"}, {"t": 1197.5166666666667, "x": "応じる」という保証が無ければ\n手続を進めない、と書いてある。"}, {"t": 1201.5333333333333, "x": "中国の引渡法の第十五条にも、\n同じ趣旨の条文がある。"}, {"t": 1205.4166666666667, "x": "条約が無い場合は互恵の約束をすること、と。"}, {"t": 1208.55, "x": "どちらの法律にも同じことが書いてあるのね。"}, {"t": 1211.35, "x": "ああ。お互い様の世界なんだ。"}, {"t": 1213.3166666666666, "x": "では日本は、その条約をどれだけ持っているのか。"}, {"t": 1216.9166666666667, "x": "日本が犯罪人引渡条約を\n結んでいる相手は、二か国だ。"}, {"t": 1221.0833333333333, "x": "二か国。"}, {"t": 1221.9666666666667, "x": "アメリカと、韓国。それだけだ。"}, {"t": 1224.2166666666667, "x": "日米の条約は一九八〇年に発効した。"}, {"t": 1227.3, "x": "日韓の条約は二〇〇二年に発効した。"}, {"t": 1230.0166666666667, "x": "それ以降、一本も増えていない。"}, {"t": 1231.95, "x": "これは私の推測ではない。"}, {"t": 1233.6, "x": "警察庁が自分のサイトにこう書いている。"}, {"t": 1236.1333333333334, "x": "「犯罪人引渡条約は、"}, {"t": 1237.9166666666667, "x": "日本で犯罪を犯し国外に逃亡した犯罪人等を\n確実に追跡し、逮捕するため、一定の場合を除き、"}, {"t": 1244.55, "x": "犯罪人の引渡しを相互に義務付けるものであり、\nこれまでに米国及び韓国との間で締結しています」"}, {"t": 1251.0666666666666, "x": "いまもそう書いてあるの？"}, {"t": 1252.55, "x": "ああ。二〇二六年九月、この動画を\n作っている時点でそう書いてある。"}, {"t": 1256.9166666666667, "x": "国会でも、同じことが繰り返し言われてきた。"}, {"t": 1259.8166666666666, "x": "二〇〇八年四月十一日、衆議院法務委員会。"}, {"t": 1262.9666666666667, "x": "当時の法務大臣の答弁だ。"}, {"t": 1264.9666666666667, "x": "「犯罪人引き渡し条約は日米、日韓しかありません。"}, {"t": 1268.3666666666666, "x": "ブラジル、中国等は、\n交渉はしておるようでありますが、\n本格的にはなっておりません」"}, {"t": 1273.7666666666667, "x": "二〇〇八年の時点で、もう分かっていたのね。"}, {"t": 1276.6833333333334, "x": "ああ。この大臣は、こうも言っている。"}, {"t": 1278.9, "x": "「代理処罰というのがきちんとできるかというのは\n一〇〇％の保証というものではありませんので、"}, {"t": 1283.9333333333334, "x": "今後、やはりできるだけ条約を多く\n結べるように努力をしたいと思います」"}, {"t": 1288.4333333333334, "x": "努力をしたい、ね。"}, {"t": 1289.8666666666666, "x": "あれから十八年たった。増えていない。"}, {"t": 1292.8666666666666, "x": "ここで、誤解のないように付け足しておく。"}, {"t": 1295.35, "x": "条約が無いと一切引き渡せない、という意味ではない。"}, {"t": 1298.5, "x": "二〇〇八年四月十六日、\n衆議院外務委員会での法務省の審議官の答弁だ。"}, {"t": 1303.7, "x": "「我が国といたしましては、"}, {"t": 1305.15, "x": "他国から犯罪人の引き渡しを\n求められて条約がなければできないと\nいうわけではございませんで、"}, {"t": 1310.5333333333333, "x": "国内法であります逃亡犯罪人引渡法を\n根拠といたしまして、相互主義の保証に基づきまして、"}, {"t": 1316.7, "x": "他国に犯罪人を引き渡すということを\n行っているところでございます」"}, {"t": 1321.0, "x": "条約が無くてもできる場合はあるのね。"}, {"t": 1323.3833333333334, "x": "ある。日本の法律は、条約が無くても\n手続を進められる作りになっている。"}, {"t": 1328.1666666666667, "x": "だが、相手がそうとはかぎらない。"}, {"t": 1330.0333333333333, "x": "同じ日、外務省の審議官がこう言っている。"}, {"t": 1332.8166666666666, "x": "「国によっては条約前置主義ということをとっている\n国がございまして、犯罪人引き渡しというものを、"}, {"t": 1338.5, "x": "実際に渡す場合には条約がなければいけないという\n国もございますので、そういう国との"}, {"t": 1343.4833333333333, "x": "関係におきましては、やはり条約は\n必要だろうというふうに考えております」"}, {"t": 1348.1666666666667, "x": "条約が無いと、そもそも渡せない国があるのね。"}, {"t": 1351.35, "x": "ああ。日本の側がいくら柔らかくても、\n相手が固ければ動かない。"}, {"t": 1355.3333333333333, "x": "そして、中国との条約づくりは、\n一度は動きかけていた。"}, {"t": 1359.1, "x": "同じ日、外務副大臣がこう答弁している。"}, {"t": 1361.95, "x": "「特に中国については、"}, {"t": 1363.3666666666666, "x": "昨年四月の温家宝総理訪日の際に発出されました\n日中共同プレス発表におきまして、"}, {"t": 1369.1666666666667, "x": "日中間の刑事司法分野における協力関係を\n強化していく重要な一環として、"}, {"t": 1374.1333333333334, "x": "日中犯罪人引き渡し条約の締結に関する協議を\n推進していくことで両首脳が一致しております」"}, {"t": 1380.6333333333334, "x": "首脳どうしで一致していたの？"}, {"t": 1382.5333333333333, "x": "ああ。副大臣は続けて、こうも言っている。"}, {"t": 1385.2666666666667, "x": "「日中刑事共助条約締結交渉の機会をとらえ、"}, {"t": 1388.3666666666666, "x": "昨年四月、七月、十月に犯罪人引き渡し\n条約に関する協議を三回行ったところです」"}, {"t": 1395.0166666666667, "x": "一年で三回も協議している。"}, {"t": 1397.1, "x": "二〇〇七年のことだ。"}, {"t": 1398.45, "x": "両国の首脳が一致し、実務の協議も三回開かれた。"}, {"t": 1402.1666666666667, "x": "そのうえで副大臣は、こう締めている。"}, {"t": 1404.5333333333333, "x": "「日中犯罪人引き渡し条約のあり方につき\n検討していく考えであります」"}, {"t": 1409.4333333333334, "x": "検討していく、ね。"}, {"t": 1410.9666666666667, "x": "あれから十八年たつ。条約は無い。"}, {"t": 1413.35, "x": "交渉が止まった理由を、私は\n自分で確かめられなかった。"}, {"t": 1416.9833333333333, "x": "だから、止まった理由については何も言わない。"}, {"t": 1419.6833333333334, "x": "分かっているのは、二〇〇七年に\n三回協議して、いまも無いという事実だけだ。"}, {"t": 1425.0666666666666, "x": "ここで混同しやすいものを整理しておく。"}, {"t": 1427.4, "x": "日本と中国のあいだに、条約が\nまったく無いわけではない。"}, {"t": 1430.8666666666666, "x": "刑事共助条約というものがある。"}, {"t": 1432.9833333333333, "x": "さっきの引渡条約とは違うの？"}, {"t": 1435.4333333333334, "x": "まったく違う。共助条約は、証拠を\nやりとりするための条約だ。"}, {"t": 1439.4333333333334, "x": "供述調書、書類、記録、鑑定。そういうものを\n相手の国から取り寄せる手続を決めてある。"}, {"t": 1445.35, "x": "人は動かない。動くのは紙と情報だけだ。"}, {"t": 1448.2, "x": "日中のあいだで、この条約は二〇〇\n七年十二月一日に北京で署名された。"}, {"t": 1453.0666666666666, "x": "国会での承認は二〇〇八年。"}, {"t": 1454.9666666666667, "x": "衆議院本会議では全会一致で可決されている。"}, {"t": 1458.0166666666667, "x": "発効したのは二〇〇八年十一月二十三日だ。"}, {"t": 1461.45, "x": "事件の五年後ね。"}, {"t": 1462.8333333333333, "x": "ああ。衆議院本会議での委員長報告に、\n中身が要約されている。読む。"}, {"t": 1467.4666666666667, "x": "「日中両国は、共助の請求及び諾否の決定権限を\n持つ中央当局をそれぞれ指定し、"}, {"t": 1472.95, "x": "両中央当局間の直接の請求に基づき、捜査、\n訴追その他の刑事手続について共助を実施すること」"}, {"t": 1480.1, "x": "「被請求国の中央当局は、その対象とされる行為が\n自国の法令によれば犯罪とならない等の場合には、"}, {"t": 1486.5, "x": "共助を拒否することができること」"}, {"t": 1488.6666666666667, "x": "拒否できるとも書いてあるのね。"}, {"t": 1490.5833333333333, "x": "ああ。義務だが、例外もある。"}, {"t": 1492.4833333333333, "x": "そして大事なのは、この条約のどこにも\n「人を引き渡す」とは書いていないということだ。"}, {"t": 1497.9166666666667, "x": "日本が中国と結んだのは、\n証拠の条約であって、人の条約ではない。"}, {"t": 1503.1166666666666, "x": "そのうえで、事件が起きた二〇〇三年に話を戻す。"}, {"t": 1506.4666666666667, "x": "当時、日本は刑事共助条約を\n一本も持っていなかった。"}, {"t": 1510.1333333333334, "x": "一本も？"}, {"t": 1511.0333333333333, "x": "一本もだ。参議院の調査室が出している\n資料にこう書かれている。"}, {"t": 1514.9833333333333, "x": "「従来、我が国は、\nどの国とも刑事共助に関する二国間条約を\n締結していなかったが、平成十五年八月、"}, {"t": 1522.0333333333333, "x": "初めて米国との間で刑事共助条約の署名に\n至り、平成十八年七月に発効した」"}, {"t": 1527.9333333333334, "x": "平成十五年は二〇〇三年だ。"}, {"t": 1529.85, "x": "事件が起きた年の八月に、ようやく\nアメリカと一本目を署名した。"}, {"t": 1534.15, "x": "つまり事件が起きた六月の時点では、日本が\n持っていた刑事共助条約はゼロだった。"}, {"t": 1539.4166666666667, "x": "ゼロから始まったのね。"}, {"t": 1541.05, "x": "ああ。そして、同じ資料にはこうも書いてある。"}, {"t": 1543.8166666666666, "x": "「中国はこれまでに四十二か国との間で"}, {"t": 1546.2333333333333, "x": "刑事共助条約に署名しており、そのうち\n三十五か国との間の条約が発効済み」"}, {"t": 1551.5, "x": "四十二か国。"}, {"t": 1552.7666666666667, "x": "日本が一本も持っていなかった時期に、\n中国は四十二本を署名していた。"}, {"t": 1557.2666666666667, "x": "日中の条約は、中国にとって四十三番目だった。"}, {"t": 1560.9, "x": "ずいぶん差があるのね。"}, {"t": 1562.3, "x": "ああ。どちらが進んでいるという\n話をしたいのではない。"}, {"t": 1565.3666666666666, "x": "ただ、あの二人が海を渡ったとき、日本の側には\n使える道具が本当に何も無かった。"}, {"t": 1570.7333333333333, "x": "そして、その参議院の資料には、\nこの事件そのものについての一文もある。読む。"}, {"t": 1575.7333333333333, "x": "「日本の捜査当局は、当初、"}, {"t": 1577.65, "x": "平成十五年に福岡の一家四人が\n中国人グループに殺害された事件において、"}, {"t": 1582.55, "x": "中国に逃げ帰った男らを捜し出して拘束するなど、"}, {"t": 1585.9, "x": "高い捜査能力を見せてきた\n中国当局への期待が高かった」"}, {"t": 1590.0, "x": "「当初は」って書いてあるのが、ひっかかるわね。"}, {"t": 1592.8333333333333, "x": "ああ。この資料が書かれた二〇〇八年の初め、\n中国製の冷凍ギョーザによる中毒事件が起きていた。"}, {"t": 1598.95, "x": "それをめぐって日中の捜査当局のあいだに\n食い違いが生じたと、資料は書いている。"}, {"t": 1603.8666666666666, "x": "福岡の事件のときに生まれた期待が、\n五年後には揺らいでいた、という文脈だ。"}, {"t": 1608.7833333333333, "x": "この事件が、その期待の出発点だったのね。"}, {"t": 1611.9833333333333, "x": "そうだ。道具が何も無いところで、\nそれでも二人は見つかった。"}, {"t": 1615.75, "x": "だから当時、期待が生まれたんだ。"}, {"t": 1618.4833333333333, "x": "ここで数字を出す。法務省の犯罪白書にある数字だ。"}, {"t": 1621.9666666666667, "x": "日本国内で罪を犯して国外に逃げている、\nまたは逃げるおそれがある人。"}, {"t": 1626.4, "x": "警察が捜査の対象にしているその人数は、\n二〇二三年末の時点で七百八十四人だ。"}, {"t": 1632.5833333333333, "x": "七百八十四人も。"}, {"t": 1634.2833333333333, "x": "ああ。そして、その内訳をきちんと見てほしい。"}, {"t": 1637.15, "x": "外国籍の人が六百九人。"}, {"t": 1639.2, "x": "日本人が百七十五人だ。"}, {"t": 1641.35, "x": "日本人も百七十五人いるのね。"}, {"t": 1643.7, "x": "いる。事件が起きた二〇〇三年も見ておこう。"}, {"t": 1646.3833333333334, "x": "この年の総数は七百三人。うち日本人が\n百四十六人、外国籍の人が五百五十七人だった。"}, {"t": 1653.2333333333333, "x": "二十年で総数はほとんど変わっていない。"}, {"t": 1655.6, "x": "では、そのうち何人が条約の手続で\n日本に引き渡されているのか。"}, {"t": 1660.0333333333333, "x": "何人なの？"}, {"t": 1661.0666666666666, "x": "同じ白書の表に、一九八九年から二〇\n二三年までの三十五年ぶんが載っている。"}, {"t": 1667.0166666666667, "x": "私はそれを自分で足してみた。"}, {"t": 1668.9833333333333, "x": "外国から日本が引渡しを受けた\n逃亡犯罪人は、三十五年間で三十九人だ。"}, {"t": 1674.5166666666667, "x": "三十九人。三十五年で。"}, {"t": 1676.65, "x": "ああ。逆に日本が外国へ引き渡したのは四十四人。"}, {"t": 1679.9666666666667, "x": "直近の二〇二二年と二〇二三年は、\n受けたのも渡したのも、どちらもゼロだ。"}, {"t": 1685.4333333333334, "x": "毎年八百人近くが外に出ていて、\n戻ってくるのが三十五年で三十九人。"}, {"t": 1690.6333333333334, "x": "それがこの制度の実際の姿だ。"}, {"t": 1692.8333333333333, "x": "国境をまたがれたら、ほぼ戻らない。"}, {"t": 1695.1166666666666, "x": "もちろん、この三十九人という数字は\n条約や法律の手続を通ったぶんだけだ。"}, {"t": 1700.0, "x": "日本に自分から戻ってきて捕まった人や、相手の国から\n強制的に送り返された人は、ここに入っていない。"}, {"t": 1706.9166666666667, "x": "別の道もあるのね。"}, {"t": 1708.4333333333334, "x": "ああ。犯罪白書にもそう書いてある。"}, {"t": 1710.6666666666667, "x": "逃亡先の国に対して、退去強制や\n国外犯処罰規定の適用を\n要請する取組を進めている、と。"}, {"t": 1717.2333333333333, "x": "つまり正面の道が細いぶん、脇の道でしのいでいる。"}, {"t": 1720.5333333333333, "x": "その脇の道の一つが、\n「代理処罰」と呼ばれてきたものだ。"}, {"t": 1724.9833333333333, "x": "ここまで話してきて、一つ、どうしても\n言っておきたいことがある。"}, {"t": 1728.8666666666666, "x": "この事件は、当時から\n「外国人の犯罪」として語られてきた。"}, {"t": 1733.1333333333334, "x": "いまもそう語られることがある。"}, {"t": 1735.0166666666667, "x": "実際、三人とも中国籍だったものね。"}, {"t": 1737.9666666666667, "x": "ああ。それは事実だ。"}, {"t": 1739.4, "x": "だが、その事実から「だから外国人は」という話に\n進んだ瞬間、この回で見てきたことが全部消える。"}, {"t": 1746.1166666666666, "x": "思い出してほしい。日本も自国民を引き渡さない。"}, {"t": 1749.2166666666667, "x": "ブラジルは憲法にそう書いている。"}, {"t": 1751.0, "x": "中国は法律にそう書いている。"}, {"t": 1753.0, "x": "日本は逃亡犯罪人引渡法第二条第九号に\nそう書いている。"}, {"t": 1757.1166666666666, "x": "そして国外に逃げている被疑者のうち、\n百七十五人は日本人だ。"}, {"t": 1761.4166666666667, "x": "どこの国にも同じことが起きているのね。"}, {"t": 1763.9666666666667, "x": "そうだ。この事件で\n起きたのは、ある国の性質の問題ではなく、\n国境という線の問題だ。"}, {"t": 1769.7, "x": "もう一つ、当時の国会での指摘を紹介しておきたい。"}, {"t": 1773.1166666666666, "x": "二〇〇五年三月二十八日、参議院行政監視委員会。"}, {"t": 1776.9, "x": "ある議員が、警察庁の資料を自分で\n取り寄せて、こう述べている。"}, {"t": 1780.75, "x": "「在日外国人あるいは留学生の犯罪が率としては\n日本人の犯罪より増えていないということは"}, {"t": 1786.2333333333333, "x": "警察庁のデータでも分かっていますね」"}, {"t": 1788.55, "x": "比べた期間は、平成十一年から十五年まで。"}, {"t": 1791.5833333333333, "x": "西暦でいえば一九九九年から二〇〇三年だ。"}, {"t": 1795.2333333333333, "x": "ちょうどこの事件の前後ね。"}, {"t": 1797.0166666666667, "x": "ああ。この事件がいちばん\n報じられていた時期のデータだ。"}, {"t": 1800.15, "x": "その時期についてすら、率としては日本人より\n増えていない、と国会で指摘されている。"}, {"t": 1805.4, "x": "ひどい事件が起きたことと、ある集団が\n危険だということは、別の話だ。"}, {"t": 1810.0166666666667, "x": "そこを混ぜると、本当の原因である\n制度の穴が見えなくなる。"}, {"t": 1814.2666666666667, "x": "制度の穴の話を、もう一つだけ。"}, {"t": 1816.65, "x": "「代理処罰」は、この事件のあと\n成功例として語られるようになった。"}, {"t": 1820.9, "x": "では、それは何件あるのか。"}, {"t": 1822.8666666666666, "x": "何件くらいなの？"}, {"t": 1824.2, "x": "分からない。国が数えていないからだ。"}, {"t": 1826.5166666666667, "x": "二〇〇七年二月二十一日、衆議院法務委員会。"}, {"t": 1829.9, "x": "議員が「本国へ戻って国外犯として処罰された\n人の数を把握しているか」と聞いている。"}, {"t": 1835.6166666666666, "x": "法務省の刑事局長の答えを読む。"}, {"t": 1837.9, "x": "「日本で悪いことをして外国に"}, {"t": 1839.6, "x": "逃亡して、それでその本国でどれだけ"}, {"t": 1842.1, "x": "処罰をされたのかということについての数字は、\nそういう事情で"}, {"t": 1845.3166666666666, "x": "私ども把握していないということでございます」"}, {"t": 1848.0666666666666, "x": "把握していない。"}, {"t": 1849.2333333333333, "x": "ああ。同じ日、同じ局長は、このやり方が\n「非常にレアケース」だとも言っている。"}, {"t": 1854.4166666666667, "x": "さらに二〇〇六年の外務省の答弁でも、\nこの福岡の事件以外にどんな例があるかと"}, {"t": 1859.3833333333334, "x": "聞かれて、こう答えている。"}, {"t": 1861.0333333333333, "x": "「ちょっとお答えをするのがなかなか\n難しいところでございます」"}, {"t": 1864.5333333333333, "x": "答えられない。"}, {"t": 1865.6, "x": "そうだ。つまりこういうことになる。"}, {"t": 1867.6166666666666, "x": "日本には、国外に\n逃げられたときの正規の道がほとんど無い。"}, {"t": 1871.3333333333333, "x": "条約は二本しかなく、三十五年で\n戻ってきたのは三十九人。"}, {"t": 1875.4333333333334, "x": "正規の道の外側に「代理処罰」と呼ばれる\n非公式なやり方があるが、法律上の定義は無く、"}, {"t": 1881.35, "x": "件数も分からない。"}, {"t": 1882.7166666666667, "x": "この事件は、その非公式なやり方の見本として\n語られてきた。"}, {"t": 1886.8666666666666, "x": "見本にするには、あやふや過ぎるわね。"}, {"t": 1889.2833333333333, "x": "ああ。私もそう思う。"}, {"t": 1891.4, "x": "冒頭で言ったことに戻る。"}, {"t": 1893.05, "x": "私はこの回で、三人の名前を一度も出していない。"}, {"t": 1896.4833333333333, "x": "そうね。理由を話すって言っていたわ。"}, {"t": 1898.9, "x": "ああ。二つある。"}, {"t": 1900.0666666666666, "x": "一つ目。中国で\n無期懲役になったほうの人は、いまも存命だ。"}, {"t": 1904.2333333333333, "x": "この動画では、存命の人の名前を\n必要もなく出さないと決めている。"}, {"t": 1908.4, "x": "二つ目のほうが、この回にとっては大きい。"}, {"t": 1910.9666666666667, "x": "中国に渡った二人について、\n日本の裁判所は何も認定していない。"}, {"t": 1915.35, "x": "判決文が無い。日本語で読める裁判の記録が無い。"}, {"t": 1918.6333333333334, "x": "私が持っているのは、中国の裁判所がこう\n判断したと日本の新聞が伝えた記事だけだ。"}, {"t": 1924.35, "x": "判決そのものは読めないのね。"}, {"t": 1926.4166666666667, "x": "読めない。どんな証拠で、\nどんな手続で、どう認定されたのか。"}, {"t": 1930.25, "x": "私は一行も見ていない。"}, {"t": 1932.0833333333333, "x": "見ていないものを、見たように語ることはしない。"}, {"t": 1934.7333333333333, "x": "だから、名前で呼ばない。"}, {"t": 1936.4666666666667, "x": "日本で裁かれた一人のほうは、判決があるのに。"}, {"t": 1939.6666666666667, "x": "ああ。そちらは地裁も高裁も\n最高裁も記録が残っている。"}, {"t": 1943.3333333333333, "x": "この差が、そのままこの事件の形だ。"}, {"t": 1945.9333333333334, "x": "同じ夜に同じ家に押し入った三人のうち、\n一人ぶんだけ、日本語で読める記録がある。"}, {"t": 1951.0833333333333, "x": "残り二人ぶんは、無い。"}, {"t": 1952.8333333333333, "x": "同じ事件なのに。"}, {"t": 1954.2, "x": "同じ事件なのに、だ。"}, {"t": 1955.75, "x": "条約が無いというのは、そういうことだ。"}, {"t": 1958.1333333333334, "x": "人が戻ってこないだけではない。"}, {"t": 1959.9166666666667, "x": "記録も戻ってこない。"}, {"t": 1961.3833333333334, "x": "ご遺族の側から見れば、もっとはっきりするはずだ。"}, {"t": 1964.4166666666667, "x": "日本の法廷で、\n三人ぶんの審理を見ることができなかった。"}, {"t": 1968.05, "x": "報道によれば、ご遺族は\n中国での初公判を傍聴している。"}, {"t": 1971.65, "x": "異例の扱いだったそうだ。"}, {"t": 1973.45, "x": "中国まで行ったのね。"}, {"t": 1975.0, "x": "ああ。そして、無期懲役という判決を不服として、"}, {"t": 1978.1833333333334, "x": "二〇〇五年一月に日本の外務省を\n通じて要請書を出している。"}, {"t": 1982.1166666666666, "x": "中国の検察当局に控訴を求めてほしい、という\n内容だったと報じられている。"}, {"t": 1987.0666666666666, "x": "日本の裁判所には、頼めないものね。"}, {"t": 1989.6833333333334, "x": "頼めない。日本の裁判所は、\nこの二人については何も持っていないからだ。"}, {"t": 1994.2, "x": "被害者の家族が、外国の検察に控訴を求める。"}, {"t": 1997.6, "x": "そういうことが実際に起きた事件なんだ。"}, {"t": 2000.6666666666667, "x": "最後にまとめておく。"}, {"t": 2002.0166666666667, "x": "二〇〇三年六月二十日、福岡市東区で\n一家四人が殺され、遺体は博多湾に沈められた。"}, {"t": 2008.1166666666666, "x": "関わった三人のうち、日本に\n残っていた一人は日本の裁判所で"}, {"t": 2012.15, "x": "死刑が確定し、二〇一九年に刑が執行された。"}, {"t": 2015.5333333333333, "x": "中国へ渡った二人は中国の裁判所で裁かれ、\n一人は死刑、一人は無期懲役となった。"}, {"t": 2021.3333333333333, "x": "死刑は二〇〇五年に執行されている。"}, {"t": 2023.5666666666666, "x": "罰は受けた。だが、日本の刑罰権は\nあの二人に届いていない。"}, {"t": 2027.5333333333333, "x": "外務省の国際法局長が国会で述べたとおり、\nそれは日本の代理ではなかった。"}, {"t": 2032.5666666666666, "x": "中国が中国の権限で裁いただけ、だったのね。"}, {"t": 2035.95, "x": "ああ。そして、日本と中国のあいだに\n犯罪人引渡条約は無い。"}, {"t": 2040.3, "x": "事件から二十三年たった二〇二六年のいまも、\n日本の引渡条約はアメリカと韓国の二本だけだ。"}, {"t": 2047.0, "x": "この二十三年で刑事共助条約のほうは\n増えた。中国とも結んだ。"}, {"t": 2051.2166666666667, "x": "だがそれは証拠の条約であって、人の条約ではない。"}, {"t": 2054.5333333333333, "x": "同じ事件がいま起きても、結末は変わらないと思う。"}, {"t": 2057.75, "x": "この回の出典を言っておく。"}, {"t": 2059.516666666667, "x": "国会会議録は、\n国立国会図書館の国会会議録検索システムから\n全文を取った。"}, {"t": 2065.1833333333334, "x": "主に使ったのは四つだ。"}, {"t": 2066.85, "x": "二〇〇六年四月二十日の参議院外交防衛委員会。"}, {"t": 2069.9666666666667, "x": "外務省国際法局長の答弁。"}, {"t": 2072.25, "x": "二〇〇七年二月二十一日の衆議院法務委員会。"}, {"t": 2075.366666666667, "x": "法務省刑事局長の答弁。"}, {"t": 2077.35, "x": "二〇〇八年四月十一日の衆議院法務委員会。\n法務大臣の答弁。"}, {"t": 2081.8, "x": "そして二〇二六年七月九日の参議院法務委員会。"}, {"t": 2085.45, "x": "法務省刑事局長の答弁だ。"}, {"t": 2087.5833333333335, "x": "条文は、日本の逃亡犯罪人引渡法と\n刑事訴訟法をイーガブ法令検索から引いた。"}, {"t": 2093.1833333333334, "x": "中国の引渡法と刑法は、中国政府の公報と\n全国人民代表大会のサイトから引いた。"}, {"t": 2099.2833333333333, "x": "数字は法務省の令和六年版犯罪白書、条約の状況は\n警察庁のサイトと参議院調査室の資料によっている。"}, {"t": 2106.4333333333334, "x": "日本での裁判の経過と死刑執行については、\n当時の新聞報道を参照した。"}, {"t": 2111.3, "x": "中国での裁判については、\n共同通信の配信記事による。"}, {"t": 2114.9, "x": "判決そのものは確認できていない。"}, {"t": 2117.3166666666666, "x": "確認できていないことは、\n確認できていないと言っておく。"}, {"t": 2120.733333333333, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
