<script>
const D={"name": "116", "file": "116_編集用", "dur": 2056.61665625, "segs": [], "subs": [{"t": 0.0, "x": "1977年1月3日。"}, {"t": 2.35, "x": "午後11時23分ごろ。"}, {"t": 4.266666666666667, "x": "東京の品川駅から寮へ帰る途中の学生がいた。"}, {"t": 7.533333333333333, "x": "新幹線ひかり号のビュッフェで\n働く、アルバイトの学生だ。"}, {"t": 11.183333333333334, "x": "帰り道の電話ボックスに、コーラが1本置いてあった。"}, {"t": 14.466666666666667, "x": "誰かの忘れ物？"}, {"t": 15.85, "x": "そう見えたはずだ。学生は、それを拾って飲んだ。"}, {"t": 18.95, "x": "意識を失い、翌日の1月4日に亡くなっている。"}, {"t": 22.316666666666666, "x": "飲み残しのコーラからは青酸の反応が出た。"}, {"t": 25.166666666666668, "x": "最初から毒が入ってたってこと？"}, {"t": 27.4, "x": "そうだ。しかもこの1本だけでは終わらない。"}, {"t": 30.0, "x": "最初に一つの数字を置いておく。"}, {"t": 32.03333333333333, "x": "同じコカコーラは、当時およそ300万本出回っていた。"}, {"t": 35.61666666666667, "x": "300万本……。"}, {"t": 36.766666666666666, "x": "警察庁の幹部が、国会でそう説明した数字だ。"}, {"t": 40.15, "x": "1本の瓶から犯人をたどるのが\n難しい。その理由として出てきた。"}, {"t": 44.266666666666666, "x": "犯人は捕まっていない。"}, {"t": 45.666666666666664, "x": "未解決のまま、15年後に時効を迎えたとされる。"}, {"t": 48.96666666666667, "x": "今回は、道に置かれた1本がどこにも\nつながらなかった記録を読む。"}, {"t": 53.06666666666667, "x": "国会の会議録と、警察白書に残った言葉だけを使う。"}, {"t": 57.06666666666667, "x": "1本の瓶が、どこにもつながらない？"}, {"t": 59.483333333333334, "x": "つながらなかった先で、\n社会のほうが少しずつ動いた。"}, {"t": 62.9, "x": "亡くなった2人の名前と年齢は、言わずにおく。"}, {"t": 65.78333333333333, "x": "犯人が誰だったのかも決めつけずに進める。"}, {"t": 69.2, "x": "最初の1本の話を、記録に沿ってもう少し細かく見る。"}, {"t": 72.91666666666667, "x": "出どころは、\nその年の4月6日の衆議院の法務委員会だ。"}, {"t": 76.65, "x": "説明したのは佐々淳行 警察庁刑事局参事官。"}, {"t": 80.43333333333334, "x": "警察の人が国会で説明したのね。"}, {"t": 83.1, "x": "議員に聞かれて事件の流れを読み上げている。"}, {"t": 85.66666666666667, "x": "その言葉をそのまま引く。"}, {"t": 87.33333333333333, "x": "「新幹線ひかり号のビュッフェに\n勤務しておりますアルバイト学生が」"}, {"t": 91.15, "x": "「勤務を終えて国電品川駅から寮に帰る途中」"}, {"t": 94.15, "x": "「電話ボックスの中にありました\nコカコーラを拾得して」"}, {"t": 97.48333333333333, "x": "拾得、って拾ったってことよね。"}, {"t": 99.75, "x": "落とし物を拾うときの、役所の言葉だ。"}, {"t": 102.41666666666667, "x": "拾ったあとに飲んで意識を失った。"}, {"t": 104.61666666666666, "x": "そして「翌四日死亡した」と続く。"}, {"t": 107.31666666666666, "x": "どうして、コーラに毒が入ってたって分かったの？"}, {"t": 110.28333333333333, "x": "「検死の結果、飲み残しのコーラから\n青酸反応がございました」"}, {"t": 114.21666666666667, "x": "瓶に残っていた分を調べて分かったわけだ。"}, {"t": 116.98333333333333, "x": "お正月の三が日の、最後の日よね。"}, {"t": 119.65, "x": "その日の勤めを終えて寮へ帰るところだった。"}, {"t": 122.26666666666667, "x": "電話ボックスは、人が足を止める場所だ。"}, {"t": 124.98333333333333, "x": "そこにぽつんと置いてあったら目に入るわね。"}, {"t": 127.53333333333333, "x": "目に入る場所に置かれていた。\nここは、あとで効いてくる。"}, {"t": 131.41666666666666, "x": "同じ1月4日。品川でもう一人が見つかる。"}, {"t": 134.55, "x": "最初の現場から、およそ700\nメートル離れた場所だった。"}, {"t": 138.26666666666668, "x": "もう一人？"}, {"t": 139.16666666666666, "x": "一人の男性が、亡くなった姿で見つかった。"}, {"t": 142.18333333333334, "x": "説明の言葉はこうだ。"}, {"t": 143.71666666666667, "x": "「解剖の結果、胃の内容物から青酸反応があり」"}, {"t": 147.11666666666667, "x": "同じ毒……。"}, {"t": 148.06666666666666, "x": "そしてもう一つの言葉が続く。"}, {"t": 150.16666666666666, "x": "「その死体発見場所から\n約百五十メートルくらいのところに」"}, {"t": 153.76666666666668, "x": "「青酸入りのコカコーラがそれぞれ放置されておる」"}, {"t": 156.63333333333333, "x": "また置いてあったの？"}, {"t": 157.93333333333334, "x": "置いてあった。1本目と同じ、\n青酸入りのコカコーラだ。"}, {"t": 161.36666666666667, "x": "ここで偶然という見方は消える。"}, {"t": 163.41666666666666, "x": "誰かがわざと何本も置いたってことね。"}, {"t": 165.86666666666667, "x": "少なくとも記録は、そういう前提で語られている。"}, {"t": 169.01666666666668, "x": "700メートルと150メートル。歩ける距離だ。"}, {"t": 172.16666666666666, "x": "続けて近くで2人……。"}, {"t": 173.8, "x": "2人とも狙われる理由のある人ではなかった。"}, {"t": 176.53333333333333, "x": "佐々参事官はこう言い表した。"}, {"t": 178.56666666666666, "x": "「全く関係のない方が犠牲になっておられる」"}, {"t": 181.45, "x": "関係のない人。"}, {"t": 182.8, "x": "犯人と何の関係もない人、という意味だ。"}, {"t": 185.58333333333334, "x": "たまたまその道を通った。\nそれだけで選ばれてしまった。"}, {"t": 189.55, "x": "では、なぜ瓶から犯人にたどり着けなかったのか。"}, {"t": 192.63333333333333, "x": "参事官は理由を三つ挙げている。"}, {"t": 194.61666666666667, "x": "一つ目が冒頭の数字だ。"}, {"t": 196.35, "x": "「コカコーラのごときは\n約三百万本同じものが出回っておる」"}, {"t": 200.08333333333334, "x": "同じ瓶が多すぎるってこと？"}, {"t": 201.96666666666667, "x": "そうだ。どこにでも売っていて誰でも買える。"}, {"t": 204.46666666666667, "x": "店で買った人を一人ずつ当たることは、まずできない。"}, {"t": 207.68333333333334, "x": "参事官の言葉ではこうなる。"}, {"t": 209.48333333333332, "x": "「この物の捜査から犯人に\n到達するということが大変困難」"}, {"t": 213.45, "x": "物の捜査って？"}, {"t": 214.73333333333332, "x": "残された物から、持ち主や\n売った店をたどる捜査のことだ。"}, {"t": 218.45, "x": "珍しい物なら売った店は少ない。"}, {"t": 220.63333333333333, "x": "買った人の顔を覚えている店員も、いるかもしれない。"}, {"t": 223.9, "x": "でも、コーラは珍しくない。"}, {"t": 225.81666666666666, "x": "むしろ、一番ありふれた飲み物の一つだった。"}, {"t": 228.75, "x": "ありふれているから手に取っても怪しまれない。"}, {"t": 231.16666666666666, "x": "ありふれているから、犯人の手がかりにもなりにくい。"}, {"t": 234.28333333333333, "x": "同じ理由が両方に効いちゃうのね。"}, {"t": 236.43333333333334, "x": "そこがこの事件の、いちばん厄介なところだ。"}, {"t": 239.28333333333333, "x": "1本の瓶は、300万本の中に紛れてしまう。"}, {"t": 242.56666666666666, "x": "瓶に指紋とかは残らないの？"}, {"t": 244.55, "x": "そこは国会でも語られていない。"}, {"t": 246.4, "x": "記録に無い話は、ここでは足さない。"}, {"t": 249.46666666666667, "x": "二つ目の理由は動機だ。"}, {"t": 251.08333333333334, "x": "参事官は、ふつうの事件と比べている。"}, {"t": 253.63333333333333, "x": "「通常の犯罪の場合には\n痴情とか怨恨とか物取りとか」"}, {"t": 257.06666666666666, "x": "「こういう動機があるわけでございます」"}, {"t": 259.18333333333334, "x": "痴情は恋愛のもつれ、怨恨はうらみよね。"}, {"t": 261.9, "x": "物取りは金や物が目当ての犯行だ。"}, {"t": 264.25, "x": "どれかが分かれば、被害者の\nまわりから探していける。"}, {"t": 267.55, "x": "知り合いの中に、犯人がいるかもしれないから？"}, {"t": 270.48333333333335, "x": "そうだ。捜査は、まず被害者の人間関係から当たる。"}, {"t": 273.95, "x": "ところが今回はその入り口が無い。"}, {"t": 276.05, "x": "被害者を選んでいない犯行だからだ。"}, {"t": 278.4, "x": "誰が飲むか、犯人にも分からないのよね。"}, {"t": 281.15, "x": "分からないまま置いている。"}, {"t": 282.6, "x": "参事官は、この種の犯罪をこう説明した。"}, {"t": 285.5, "x": "「不特定多数の人を対象として」"}, {"t": 287.75, "x": "「動機が必ずしも明らかでない形で行われる」"}, {"t": 290.93333333333334, "x": "被害者から探す道が、最初から閉じてる。"}, {"t": 293.9166666666667, "x": "その通りだ。2人のまわりをいくら\n調べても、犯人の影は出てこない。"}, {"t": 298.18333333333334, "x": "関係が無いからこそ、被害に遭っている。"}, {"t": 300.85, "x": "……ひどい話。"}, {"t": 301.9166666666667, "x": "参事官は、犯人の側の目的についても\n一言だけ触れている。"}, {"t": 306.03333333333336, "x": "社会に動揺と不安を与え、快感を覚える\n異常な性格の持ち主と「思われる」。"}, {"t": 310.8833333333333, "x": "ここは警察の見立てとして聞いておく。"}, {"t": 313.05, "x": "犯人が分かった話ではない。"}, {"t": 315.65, "x": "三つ目の理由は街の変わり方だ。"}, {"t": 317.81666666666666, "x": "参事官はこう続けている。"}, {"t": 319.5, "x": "「隣近所の連帯性が非常に薄くなってきておる」"}, {"t": 322.7, "x": "近所づきあいが減った、ってこと？"}, {"t": 324.85, "x": "そうだ。大きな街ほど、隣に\n誰が住んでいるか知らない。"}, {"t": 328.3833333333333, "x": "「市民の無関心さに便乗して」\nこの種の犯行が行われる、と言った。"}, {"t": 332.8333333333333, "x": "誰かが電話ボックスに\n瓶を置いても、気にしない……。"}, {"t": 335.81666666666666, "x": "夜の駅の近くなら、人は急いで通り過ぎる。"}, {"t": 338.8, "x": "誰かが立ち止まって何かしていても覚えていない。"}, {"t": 341.73333333333335, "x": "私も、たぶん覚えてないわ。"}, {"t": 343.75, "x": "それが責められる話ではないのが難しいところだ。"}, {"t": 346.76666666666665, "x": "参事官も市民を責めてはいない。"}, {"t": 348.73333333333335, "x": "「目撃者の方々に大変積極的に\n協力をしていただきまして」"}, {"t": 352.95, "x": "と、協力に礼を言っている。"}, {"t": 354.8, "x": "協力してくれる人はいたのね。"}, {"t": 356.9166666666667, "x": "いた。ただ、決め手になる目撃は記録に出てこない。"}, {"t": 360.18333333333334, "x": "参事官の答弁は、最後にこう結ばれている。"}, {"t": 363.03333333333336, "x": "「国民の御協力を切に希望するものでございます」"}, {"t": 366.23333333333335, "x": "お願いで終わってるのね。"}, {"t": 367.81666666666666, "x": "4月の時点で、警察がそう\n言うしかなかったということだ。"}, {"t": 371.3333333333333, "x": "1月の事件から、3か月がたっていた。"}, {"t": 374.73333333333335, "x": "ここで4月6日の質問そのものを見ておく。"}, {"t": 377.48333333333335, "x": "質問に立ったのは公明党の議員だった。"}, {"t": 380.01666666666665, "x": "議員は前置きでこういう犯罪を並べている。"}, {"t": 382.48333333333335, "x": "「通り魔的犯罪、無差別の爆弾テロ、\nいわゆるいわれなき犯罪」"}, {"t": 386.68333333333334, "x": "いわれなき犯罪？"}, {"t": 387.95, "x": "狙われる理由の無い人が被害に\n遭う犯罪、という意味だろう。"}, {"t": 391.4, "x": "議員はそれが\n「最近次第に増加する傾向」にあると言った。"}, {"t": 395.25, "x": "コーラの事件もその中に入ってるのね。"}, {"t": 397.78333333333336, "x": "入っている。毒入りコーラと\nチョコレートの名前が、その場で挙がった。"}, {"t": 401.68333333333334, "x": "議員はこうも問いかけている。"}, {"t": 403.31666666666666, "x": "「思想的背景があるのか、単に\n社会に背を向けた犯罪なのか」"}, {"t": 407.3833333333333, "x": "思想的背景って？"}, {"t": 408.95, "x": "政治の主張のために事件を起こす、という意味合いだ。"}, {"t": 412.03333333333336, "x": "同じ質問の中に爆弾テロも並んでいたからな。"}, {"t": 415.25, "x": "コーラの事件で犯人から何か届いたりはしたの？"}, {"t": 418.3333333333333, "x": "少なくとも国会の記録には、そういう話は出てこない。"}, {"t": 421.8666666666667, "x": "だから議員もどちらなのかを問う形にしている。"}, {"t": 424.6333333333333, "x": "法務大臣の所信表明にも、似た言葉があったという。"}, {"t": 428.0, "x": "「自分さえよければ他を顧みない」社会の傾向だ。"}, {"t": 431.18333333333334, "x": "社会の空気の話にまで広がってたのね。"}, {"t": 433.98333333333335, "x": "議員は、こうした事件が人々に\n与えるものも言っている。"}, {"t": 437.3333333333333, "x": "「不特定の市民が不幸な被害者となり、\n国民を極端な不安に陥れてしまう」"}, {"t": 442.3666666666667, "x": "誰でも被害者になりうるから、\nみんなが不安になるのね。"}, {"t": 445.8, "x": "被害に遭った人の外側にまで、不安が広がっていく。"}, {"t": 449.23333333333335, "x": "1本の瓶が、そこまでの問いを呼んでいた。"}, {"t": 451.8, "x": "ただ、問いに答えが出たわけではない。"}, {"t": 454.01666666666665, "x": "犯人が見つからない以上、\n動機も確かめようがなかった。"}, {"t": 458.0833333333333, "x": "同じ日の答弁で、参事官は別の事件にも触れている。"}, {"t": 461.51666666666665, "x": "こちらは捕まえることができた事件の話だ。"}, {"t": 464.43333333333334, "x": "捕まった事件もあったの？"}, {"t": 466.23333333333335, "x": "新宿の連続放火と、大阪阿倍野の連続放火だ。"}, {"t": 469.6, "x": "どちらも火をつけて回る事件だった。"}, {"t": 471.85, "x": "参事官は捕まえ方をこう説明した。"}, {"t": 474.3333333333333, "x": "「結局現行犯逮捕する以外にない」"}, {"t": 476.81666666666666, "x": "火をつける瞬間を押さえるってこと？"}, {"t": 479.05, "x": "そうだ。そのために長い間、現場で張り込んだ。"}, {"t": 482.1666666666667, "x": "連日、多くの警察官が出た。"}, {"t": 484.43333333333334, "x": "地元の住民の有志も張り込みに協力している。"}, {"t": 487.3833333333333, "x": "阿倍野の事件は、そうして現行犯で検挙された。"}, {"t": 490.46666666666664, "x": "新宿の事件も、地元の協力を得て\n検挙したと述べている。"}, {"t": 494.3666666666667, "x": "近所づきあいが薄くても、協力はしてくれたのね。"}, {"t": 497.6166666666667, "x": "参事官も、隣組の意識が\n高まるときがあると言っていた。"}, {"t": 501.45, "x": "じゃあコーラの事件も張り込めば……。"}, {"t": 503.4, "x": "そこが違う。放火なら、\n狙われやすい場所に見当がつく。"}, {"t": 507.03333333333336, "x": "続いている場所の近くで待てば、\n次が来るかもしれない。"}, {"t": 510.3, "x": "コーラの瓶は、どこに置かれるか分からない。"}, {"t": 512.7333333333333, "x": "電話ボックスは街じゅうにある。"}, {"t": 514.6333333333333, "x": "全部の電話ボックスを見張るのは無理よね。"}, {"t": 517.1666666666666, "x": "無理だ。待ち伏せの手が、\nこの事件では使えなかった。"}, {"t": 520.4666666666667, "x": "議員はモンタージュや顔写真を出す\n呼びかけにも触れていた。"}, {"t": 523.7833333333333, "x": "顔が分からないと、その手も使えないのね。"}, {"t": 526.5666666666667, "x": "品川の事件で似顔絵が出たという\n話は、今回の記録には無い。"}, {"t": 531.2333333333333, "x": "4月6日の答弁で、コーラの前に語られた事件がある。"}, {"t": 534.7, "x": "前の年に東京の多摩地域で続いた通り魔だ。"}, {"t": 537.6166666666667, "x": "福生、昭島、立川の3つの警察署の管内で起きている。"}, {"t": 541.8, "x": "どんな事件だったの？"}, {"t": 543.2833333333333, "x": "1976年の5月から9月までに、\n車を使った傷害が4件続いた。"}, {"t": 548.6333333333333, "x": "被害に遭ったのはいずれも20歳前後の女性だ。"}, {"t": 551.5, "x": "夜の帰り道で刃物で傷つけられている。"}, {"t": 554.0666666666667, "x": "そのうち一人は、入院のあとに亡くなった。"}, {"t": 556.8833333333333, "x": "その犯人は？"}, {"t": 558.05, "x": "参事官は「まだ検挙に至っておりません」と述べた。"}, {"t": 561.3, "x": "3つの署が、合同で捜査本部を置いて\n調べている最中だった。"}, {"t": 565.25, "x": "未解決の事件が、同じ答弁に二つ並んでたのね。"}, {"t": 568.8333333333334, "x": "そうだ。どちらも狙う相手を選んでいない。"}, {"t": 571.2666666666667, "x": "国会が聞いたのはそういう事件のまとまりだった。"}, {"t": 574.0833333333334, "x": "この通り魔のその後は、この回では追わない。"}, {"t": 576.6333333333333, "x": "ここで見ておきたいのは並び方のほうだ。"}, {"t": 579.1, "x": "コーラの事件だけが、特別だったわけじゃないのね。"}, {"t": 582.2833333333333, "x": "同じ形の不安が、同じ年に重なっていた。"}, {"t": 586.0, "x": "少し時間を戻す。3月3日の、衆議院の内閣委員会だ。"}, {"t": 590.1833333333333, "x": "ここで、別の物が話に出る。チョコレートだ。"}, {"t": 593.25, "x": "チョコレート？"}, {"t": 594.1833333333333, "x": "ある議員がこう切り出している。"}, {"t": 595.8666666666667, "x": "「最近起こりました\n東京駅八重洲地下街での青酸チョコレート事件」"}, {"t": 599.9166666666666, "x": "コーラの次はチョコレートなの？"}, {"t": 601.75, "x": "この委員会の少し前、東京駅の地下街で\n青酸入りのチョコレートが見つかっていた。"}, {"t": 606.7, "x": "見つかった日や個数は、一次資料で\n確かめられなかった。ここでは言わない。"}, {"t": 611.1, "x": "議員が聞いたのは置かれていた場所のことだ。"}, {"t": 613.5333333333333, "x": "そこは国鉄の土地なのか、と。"}, {"t": 615.75, "x": "場所が大事なの？"}, {"t": 617.05, "x": "誰が見張る責任を持つか、が変わるからだ。"}, {"t": 619.8, "x": "国鉄の常務理事はこう答えた。"}, {"t": 621.8666666666667, "x": "置かれていたのは「国鉄の用地外」だった。"}, {"t": 624.6833333333333, "x": "地下街を管理しているのは民間の会社だという。"}, {"t": 627.65, "x": "駅のすぐそばなのに駅の土地じゃないのね。"}, {"t": 630.2333333333333, "x": "議員は重ねて聞いた。"}, {"t": 631.5166666666667, "x": "国鉄は、出資していないのか。"}, {"t": 633.7166666666667, "x": "答えは「出資いたしておりません」。"}, {"t": 635.9, "x": "じゃあ国鉄は関係ない、ってこと？"}, {"t": 638.15, "x": "議員はそこで引き下がらなかった。"}, {"t": 640.1833333333333, "x": "駅へ行く人にとっては、駅の通り道の一部だからだ。"}, {"t": 644.1833333333333, "x": "この委員会で、議員が述べた言葉がある。"}, {"t": 646.65, "x": "この回で一番大事な一文だと思うので長めに引く。"}, {"t": 649.9833333333333, "x": "「置いてあった物を食べる、あるいは置いてあった\nコーラを飲むということは」"}, {"t": 653.6, "x": "「それはまた親の教育の問題」"}, {"t": 655.5333333333333, "x": "「あるいはそんな物に手を出すのは\nおかしいじゃないかという」"}, {"t": 658.4666666666667, "x": "「わけ知りの言い方はあるかもしれませんが」"}, {"t": 660.9, "x": "拾ったほうが悪い、って言う人もいたのね。"}, {"t": 663.5166666666667, "x": "いたのだろう。議員は、それを先回りして言っている。"}, {"t": 666.6166666666667, "x": "そのうえでこう続けた。"}, {"t": 668.05, "x": "「置いたと思われる犯人は無差別のそういう\n大量に人が動くところへ置いておいて」"}, {"t": 672.5666666666667, "x": "「だれかが食べるであろうということを\n計算して置いているわけです」"}, {"t": 676.05, "x": "計算して置いてる……。"}, {"t": 677.4166666666666, "x": "拾う人が出ることまで、犯人は見込んでいる。"}, {"t": 680.2166666666667, "x": "だから拾った人の不注意で片付けてはいけない。"}, {"t": 683.1333333333333, "x": "議員の言いたいことはそういうことだ。"}, {"t": 685.25, "x": "電話ボックスも、人が必ず立ち寄る場所よね。"}, {"t": 688.4, "x": "そうだな。夜でも明るく手を伸ばせば届く。"}, {"t": 691.1, "x": "最初の章で「目に入る場所」と\n言ったのは、このためだ。"}, {"t": 694.8, "x": "置き場所まで選ばれてたかもしれないのね。"}, {"t": 697.25, "x": "かもしれない。ただ、それを決める記録は無い。"}, {"t": 700.0, "x": "言えるのは、議員がそう受け止めていたところまでだ。"}, {"t": 703.4833333333333, "x": "では駅の中に、持ち主の分からない\n物があったらどうなるのか。"}, {"t": 707.2, "x": "常務理事は、議員の問いをこう受け止めていた。"}, {"t": 709.8333333333334, "x": "もし駅のコンコースに置かれていたら、\n国鉄はどう責任を負うのか。"}, {"t": 713.8666666666667, "x": "場所が少しずれてたら、駅の問題だったのね。"}, {"t": 716.95, "x": "そういうことだ。そこで常務理事は、\nふだんの扱いを説明した。"}, {"t": 720.85, "x": "コーラやチョコレートが置いてあって、\n持ち主が分からない。"}, {"t": 723.95, "x": "その場合は「遺失物法の規定に\nよりまして遺失物扱い」をする。"}, {"t": 728.3166666666667, "x": "落とし物として預かるのね。"}, {"t": 730.2333333333333, "x": "そうだ。駅にとって置き去りの物は、毎日のことだ。"}, {"t": 733.6, "x": "ただし、毒が入っていると明らかなら、扱いが変わる。"}, {"t": 737.05, "x": "警察署に連絡して国鉄の中の公安官を動員する。"}, {"t": 740.75, "x": "公安官って？"}, {"t": 741.9, "x": "当時の国鉄にいた、鉄道の中の警察のような係だ。"}, {"t": 745.6333333333333, "x": "ここで一つ、引っかかる点がある。"}, {"t": 747.9666666666667, "x": "引っかかる点？"}, {"t": 749.0666666666667, "x": "見た目では、毒が入っているかは分からないことだ。"}, {"t": 752.0333333333333, "x": "瓶の外から眺めても、中身の違いは区別がつかない。"}, {"t": 755.6833333333333, "x": "じゃあ、ふつうは落とし物として扱われちゃう。"}, {"t": 758.45, "x": "そういう仕組みの中に、毒入りの物がまぎれ込む。"}, {"t": 761.4166666666666, "x": "議員は新幹線の放送も例に出していた。"}, {"t": 764.0333333333333, "x": "「自分の荷物でない物がありたら\nこれは届け出てください」"}, {"t": 767.3, "x": "「命ということに関して言えば同じ理屈であります」"}, {"t": 770.4166666666666, "x": "置かれた物は手を出さずに届ける、ってことね。"}, {"t": 773.2666666666667, "x": "持ち主の分からない物を拾う物から届ける物へ。"}, {"t": 776.3333333333334, "x": "考え方の向きを変えようという話だった。"}, {"t": 779.5666666666667, "x": "では国鉄は何をすると答えたのか。"}, {"t": 781.9333333333333, "x": "まず、今の見回りの回数が出てくる。"}, {"t": 784.3333333333334, "x": "ふつうの駅なら、駅長が「午前一回、\n午後一回」必ず巡回している。"}, {"t": 789.2833333333333, "x": "1日に2回？"}, {"t": 790.5166666666667, "x": "そうだ。駅長の見回りとしては、それが決まりだった。"}, {"t": 794.0, "x": "電話ボックスの事件は、夜の11時台よね。"}, {"t": 797.1, "x": "そこは駅の外の話だから、\n比べるのは筋違いかもしれない。"}, {"t": 801.0, "x": "ただ、1日2回の見回りで、\n全部の置き物は見つけられない。"}, {"t": 804.9333333333333, "x": "それは答弁からも伝わってくる。"}, {"t": 806.95, "x": "常務理事は、これからの対策も述べた。"}, {"t": 809.45, "x": "人の多い駅で、客に注意を\nうながす放送や掲示をする。"}, {"t": 812.9333333333333, "x": "名前が挙がったのは、東京駅、\n上野駅、新宿駅、広島駅だ。"}, {"t": 817.5833333333334, "x": "広島駅も入ってるのね。"}, {"t": 819.4833333333333, "x": "大きな駅の例として並べたのだろう。"}, {"t": 821.55, "x": "理由までは語っていない。"}, {"t": 823.15, "x": "常務理事は、駅長の責任にも触れている。"}, {"t": 825.8666666666667, "x": "駅長は駅の中の秩序を\n守ることに社会的な責任を持つ。"}, {"t": 829.7833333333333, "x": "職務の上の責任も持っている、と述べた。"}, {"t": 832.6, "x": "責任はある、でも全部は見られない。"}, {"t": 834.9333333333333, "x": "そこで考えたのが次の手だ。"}, {"t": 836.8666666666667, "x": "見回る人を増やすより、客の目を借りる。"}, {"t": 839.5166666666667, "x": "拾わないで知らせてくださいって呼びかけるのね。"}, {"t": 842.35, "x": "何万人も通る駅では、それが現実的な手だった。"}, {"t": 845.7333333333333, "x": "議員は「すんでのところだった」とも言っている。"}, {"t": 848.6666666666666, "x": "すんでのところ？"}, {"t": 849.8166666666667, "x": "誰かが口にしていても\nおかしくなかった、という意味だろう。"}, {"t": 853.1833333333333, "x": "命に関わる物が、何万人も通る\n道に置かれていたわけだ。"}, {"t": 857.6833333333333, "x": "次は、毒そのものの話だ。"}, {"t": 859.8, "x": "4月5日、参議院の予算委員会。"}, {"t": 862.2333333333333, "x": "ある議員が厚生大臣に質問した。"}, {"t": 864.55, "x": "「倒産した企業の倉庫に\n多量の青酸カリが放置されている」"}, {"t": 868.1166666666667, "x": "「こういった危険な状態が頻発しております」"}, {"t": 870.9833333333333, "x": "倉庫に置きっぱなし？"}, {"t": 872.4666666666667, "x": "そういう例があると、議員は言っている。"}, {"t": 874.6, "x": "答えたのは渡辺美智雄 厚生大臣だ。"}, {"t": 877.2666666666667, "x": "「青酸カリが最近いろいろと悪用されて\n大きな社会問題になっておる」"}, {"t": 881.4, "x": "「十分承知をいたしております」"}, {"t": 883.3833333333333, "x": "毒ってふつうに買えるものなの？"}, {"t": 885.35, "x": "大臣は法律で決まっていることを並べた。"}, {"t": 887.9333333333333, "x": "盗まれないようにする。なくさないようにする。"}, {"t": 890.55, "x": "売るときには買う人の名前を確かめる。"}, {"t": 892.9166666666666, "x": "渡す相手を限り、しまう場所を明らかにする。"}, {"t": 895.85, "x": "決まりはちゃんとあったのね。"}, {"t": 897.5333333333333, "x": "あった。問題はその先だと、大臣は言う。"}, {"t": 900.3333333333334, "x": "工場や学校に流れていった先が\n「なかなか把握がむずかしい」。"}, {"t": 904.2666666666667, "x": "売るところまでは見張れてもそのあとが追えない。"}, {"t": 906.8166666666667, "x": "ここでもたどれない話が出てくる。"}, {"t": 908.8666666666667, "x": "瓶も、毒も、一度手を離れると追えなくなっていた。"}, {"t": 912.7333333333333, "x": "大臣はすでに出した手も紹介している。"}, {"t": 915.1833333333333, "x": "「三月二十六日に」と、日付まで言った。"}, {"t": 918.1, "x": "「毒物及び劇物の管理保管について」という\n通達を出したという。"}, {"t": 922.3833333333333, "x": "中身は？"}, {"t": 923.2166666666667, "x": "「貯蔵、陳列その他の管理について」\n細かく決めた、とある。"}, {"t": 927.2, "x": "しまい方と、並べ方と、そのほかの扱いだ。"}, {"t": 930.5166666666667, "x": "1月の事件から3か月くらいね。"}, {"t": 932.9833333333333, "x": "そうだ。国会で質問される少し前に出ていた。"}, {"t": 936.05, "x": "この答弁の中で、大臣はもう\n一つ気になることを言っている。"}, {"t": 939.7333333333333, "x": "「今回コーラのびんに青酸カリが入って\n殺人未遂というような大きな問題が起きておる」"}, {"t": 944.8666666666667, "x": "殺人未遂？ 品川のほかにも？"}, {"t": 947.25, "x": "そう読める。ただ、どこの件なのかを\n大臣は言っていない。"}, {"t": 950.6, "x": "場所や人をこの回で足すことはしない。"}, {"t": 952.8833333333333, "x": "確かめられたのは、大臣がそう\n述べた、という一点だけだ。"}, {"t": 956.6333333333333, "x": "でも、コーラの瓶がまた使われたのよね。"}, {"t": 959.25, "x": "大臣の言葉の上ではそうなる。"}, {"t": 961.2, "x": "そして大臣はこう結んでいる。"}, {"t": 963.05, "x": "「一層さらにきめ細かく指導してまいりたい」"}, {"t": 965.7666666666667, "x": "指導、なのね。"}, {"t": 967.0333333333333, "x": "法律を変えるのではなく、今ある\n決まりを細かく守らせる方向だ。"}, {"t": 971.6, "x": "渡辺大臣の答弁には見通しを語った一文もある。"}, {"t": 974.9166666666666, "x": "毒がどう手に入れられたのか、についてだ。"}, {"t": 977.3666666666667, "x": "「どういうような経路でその入手をされていったか」"}, {"t": 979.9666666666667, "x": "「というようなことがだんだん\n明らかになってくると思います」"}, {"t": 983.2833333333333, "x": "分かってくるはず、って言ってるのね。"}, {"t": 985.45, "x": "警察の捜査で、入手の道筋が\n見えてくると期待していた。"}, {"t": 989.2666666666667, "x": "見えてきたらそれに合わせて規制を考える。"}, {"t": 991.7333333333333, "x": "大臣はそういう順番で話している。"}, {"t": 994.0666666666667, "x": "それで明らかになったの？"}, {"t": 995.75, "x": "国会の記録を見る限り、そういう報告は出てこない。"}, {"t": 998.9833333333333, "x": "7年後の長官も「検挙になっておりません」と言う。"}, {"t": 1002.3666666666667, "x": "入手の道筋も分からないままだったのね。"}, {"t": 1005.0333333333333, "x": "少なくとも表に出た記録の上ではそうだ。"}, {"t": 1007.7, "x": "1977年の春は、まだ分かるはずだと思われていた。"}, {"t": 1011.7166666666667, "x": "答弁の言葉には、その空気が残っている。"}, {"t": 1014.55, "x": "期待してたぶん、重たいわね。"}, {"t": 1016.5666666666667, "x": "答えが出ないまま、規制のほうが先に進んだ。"}, {"t": 1019.4833333333333, "x": "それが次に見る警察の動きだ。"}, {"t": 1022.2, "x": "警察の側も動いていた。"}, {"t": 1023.9166666666666, "x": "翌年に出た警察白書にその記録がある。"}, {"t": 1026.7, "x": "「52年は青酸コーラによる\n連続殺人事件等の凶悪事件や」"}, {"t": 1030.8666666666666, "x": "「シアン化ナトリウムの盗難事件及び放置事案が\n発生し社会的な問題となった」"}, {"t": 1035.8833333333334, "x": "盗まれたり、放っておかれたり。"}, {"t": 1038.0333333333333, "x": "倉庫の話と、同じ流れだな。"}, {"t": 1040.3166666666666, "x": "そこで警察は、厚生省に一つ要望を出した。"}, {"t": 1043.4333333333334, "x": "シアン化合物の管理を、\n適正にしてほしいという要望だ。"}, {"t": 1046.9833333333333, "x": "警察から役所にお願いしたのね。"}, {"t": 1049.35, "x": "そうだ。毒の管理は、厚生省の受け持ちだからだ。"}, {"t": 1052.6166666666666, "x": "そのうえで警察自身も動いている。"}, {"t": 1054.7333333333333, "x": "5月に全国いっせいの防犯指導をした。"}, {"t": 1057.2833333333333, "x": "対象はシアン化ナトリウムなどを扱う場所。"}, {"t": 1059.8333333333333, "x": "その数が「3万4,506箇所」だ。"}, {"t": 1062.9333333333334, "x": "3万か所以上……。"}, {"t": 1064.2166666666667, "x": "白書は、どんな業種の場所かという\n内訳までは書いていない。"}, {"t": 1067.85, "x": "それだけの場所に、同じ毒があったってことよね。"}, {"t": 1070.9333333333334, "x": "そうなる。毒の出どころを探す\n側から見れば、とても広い。"}, {"t": 1074.5, "x": "入手先から犯人に届いた、という記録も見当たらない。"}, {"t": 1077.9166666666667, "x": "ここは推測を足さず、数字の大きさだけを見ておく。"}, {"t": 1081.7166666666667, "x": "同じ白書にもう一つ目を引く数字がある。"}, {"t": 1084.3, "x": "落とし物と拾い物の数だ。"}, {"t": 1086.2166666666667, "x": "1977年の拾得届は、300万8,786件。"}, {"t": 1091.4833333333333, "x": "また300万？"}, {"t": 1092.6666666666667, "x": "偶然だが、瓶の本数とほぼ同じ桁だな。"}, {"t": 1095.55, "x": "拾得届は、拾った物を警察に届けた数だ。"}, {"t": 1098.9666666666667, "x": "遺失届、つまり落としましたという\n届けは、160万4,556件。"}, {"t": 1104.25, "x": "拾って届けた数のほうが、ずっと多いのね。"}, {"t": 1107.15, "x": "そうだ。拾った物を届ける人が、\nそれだけいたということになる。"}, {"t": 1111.1666666666667, "x": "白書によると、窓口の多くは派出所や駐在所だった。"}, {"t": 1114.7833333333333, "x": "お金の落とし物も数えられている。"}, {"t": 1116.8666666666666, "x": "落としたと届けられたお金は、約187億円。"}, {"t": 1120.35, "x": "拾って届けられたお金は、約91億円だった。"}, {"t": 1123.9166666666667, "x": "落としたお金のほうが、倍くらい多いのね。"}, {"t": 1126.5833333333333, "x": "白書は、落としたお金は出てきにくいと書いている。"}, {"t": 1129.5833333333333, "x": "物のほうは、落とした人があきらめて\n届けない場合が多いともある。"}, {"t": 1133.55, "x": "みんな、拾った物はちゃんと届けてたんだ。"}, {"t": 1136.3333333333333, "x": "拾う、というのは悪いことではない。"}, {"t": 1138.4, "x": "むしろ、届けるために拾う人がたくさんいた。"}, {"t": 1141.3666666666666, "x": "電話ボックスのコーラも拾うだけなら……。"}, {"t": 1143.7333333333333, "x": "飲まずに届けていれば、と言いたくなる。"}, {"t": 1146.0333333333333, "x": "だが、議員の言葉を思い出してほしい。"}, {"t": 1148.5166666666667, "x": "わけ知りの言い方、ね。"}, {"t": 1150.2, "x": "そうだ。飲み物が置いてあれば、\n手が伸びることもある。"}, {"t": 1153.3333333333333, "x": "犯人は、その手が伸びるところまで見込んでいた。"}, {"t": 1156.2166666666667, "x": "拾う人の多い社会だった、ということは\n覚えておきたい。"}, {"t": 1159.6333333333334, "x": "拾う手と、毒を置く手は、まるで別のものなのにね。"}, {"t": 1163.5166666666667, "x": "4月6日の法務委員会に戻る。"}, {"t": 1165.6333333333334, "x": "議員は国民への呼びかけ方を聞いていた。"}, {"t": 1168.1333333333334, "x": "佐々参事官の答えの中にこういう一文がある。"}, {"t": 1171.05, "x": "「毒入りチョコレート事件、毒入りコーラ事件の後は」"}, {"t": 1174.0666666666666, "x": "「こういう放置されておるものを\n食べないように、飲まないように」"}, {"t": 1177.3, "x": "「呼びかけを、種々の防犯協会その他の\n諸団体あるいは学校等を通じて」"}, {"t": 1181.9666666666667, "x": "学校でも言われてたのね。"}, {"t": 1183.6833333333334, "x": "子どもに向けた呼びかけでもあった。"}, {"t": 1185.8333333333333, "x": "知らない物を口に入れない、って今でも言われるわ。"}, {"t": 1188.7, "x": "その言い方が、全国で広く\n呼びかけられた時期の一つが、ここだ。"}, {"t": 1192.9666666666667, "x": "参事官は、事件が起きたときの方針も語っている。"}, {"t": 1196.2833333333333, "x": "速やかに記者発表をして、\nマスコミを通じて呼びかける。"}, {"t": 1199.8, "x": "必要なら公開捜査に踏み切る。"}, {"t": 1202.0166666666667, "x": "隠さないで知らせるほうを選んだのね。"}, {"t": 1204.3166666666666, "x": "無差別の事件では、次に拾う\n人を止めるのが先になる。"}, {"t": 1207.9, "x": "知らせが早ければ、手を伸ばす人が減る。"}, {"t": 1210.6, "x": "知らせるのが防ぐことにもなるのね。"}, {"t": 1212.9, "x": "そうだ。ここは、犯人を捕まえる話とは別の守り方だ。"}, {"t": 1216.8, "x": "捕まえられなくても次の1本を飲ませない。"}, {"t": 1219.4, "x": "1977年の対策は、ほとんどがこの向きを向いている。"}, {"t": 1224.1166666666666, "x": "佐々参事官は数字でも答えている。"}, {"t": 1226.4166666666667, "x": "無差別の事件が、どのくらいの割合なのか。"}, {"t": 1229.2166666666667, "x": "まず全体。殺人事件は未遂を\n含めて、毎年約2,000件。"}, {"t": 1233.3, "x": "亡くなった人は、毎年約1,100人だった。"}, {"t": 1236.2833333333333, "x": "未遂も入れた数なので、\n亡くなった人の数とは一致しない。"}, {"t": 1240.0166666666667, "x": "多いのね……。"}, {"t": 1240.8666666666666, "x": "このうち、犯人と被害者に面識が\n全然ない事件が、およそ12％。"}, {"t": 1245.85, "x": "残りの9割近くは知り合い同士？"}, {"t": 1248.1333333333334, "x": "そういうことになる。"}, {"t": 1249.1666666666667, "x": "殺人の多くは、身近な人の間で起きている。"}, {"t": 1252.2333333333333, "x": "だから警察は人間関係から当たる。"}, {"t": 1254.6333333333334, "x": "もう一つ、別の数え方もしている。"}, {"t": 1257.0666666666666, "x": "1974年の殺人事件などの被害者は948人。"}, {"t": 1261.5833333333333, "x": "そのうち298人、31.4％は\n「全く関係のない方」だった。"}, {"t": 1267.3833333333334, "x": "12％と31.4％、どう違うの？"}, {"t": 1270.9166666666667, "x": "12％は、顔を知らないかどうかで数えた割合だ。"}, {"t": 1274.2833333333333, "x": "31.4％は、被害者のほうに犯行の\nきっかけが無いかで数えている。"}, {"t": 1279.25, "x": "数え方が違うのね。"}, {"t": 1280.85, "x": "参事官は、二つを分けて説明していた。"}, {"t": 1283.6, "x": "品川の2人は、参事官の言う\n「全く関係のない方」の側だ。"}, {"t": 1288.2166666666667, "x": "狙われるきっかけが何も無い。"}, {"t": 1290.1666666666667, "x": "そうだ。いちばん捜査の手が\n届きにくい側の事件だった。"}, {"t": 1294.2333333333333, "x": "この委員会で、議員はもう一つ大事な質問をしている。"}, {"t": 1297.65, "x": "犯罪の被害に遭った人への、補償の制度だ。"}, {"t": 1300.7166666666667, "x": "補償ってお金のこと？"}, {"t": 1302.3, "x": "そうだ。犯人が分からなければ、\n誰からも償ってもらえない。"}, {"t": 1306.1, "x": "議員は、国が補う仕組みが\n要るのではないかと聞いた。"}, {"t": 1309.2833333333333, "x": "法務省の側からは刑事局長が答えた。"}, {"t": 1311.9166666666667, "x": "刑事局長は、国の研究所の調べを紹介した。"}, {"t": 1315.2, "x": "人の命や体を傷つけた故意の犯罪の、被害の調べだ。"}, {"t": 1319.2166666666667, "x": "どんな結果だったの？"}, {"t": 1320.7, "x": "まず傷害の事件では、被害者に\n全く落ち度がないものが約64％。"}, {"t": 1325.7, "x": "6割以上……。"}, {"t": 1326.7333333333333, "x": "亡くなった事件に絞ると、全く\n落ち度がないものが約40％。"}, {"t": 1331.2, "x": "4割も……。"}, {"t": 1332.1166666666666, "x": "亡くなった被害者のうち、養う家族がいた人が約44％。"}, {"t": 1336.5666666666666, "x": "加害者から賠償金を受け取れたのは、\n約21％にとどまった。"}, {"t": 1341.0833333333333, "x": "残りの8割近くは、受け取れてないのね。"}, {"t": 1343.95, "x": "そういう数字だ。"}, {"t": 1345.0333333333333, "x": "犯人が捕まらない事件なら、受け取る相手すらいない。"}, {"t": 1348.4666666666667, "x": "傷害の事件だとどうなの？"}, {"t": 1350.3, "x": "傷害では、養う家族がいた人が約42％。"}, {"t": 1353.95, "x": "賠償金を受け取れたのは約34％だった。"}, {"t": 1357.1833333333334, "x": "顔見知りでない相手からの被害は、傷害で\n58.6％、亡くなった事件で20.6％。"}, {"t": 1363.8333333333333, "x": "品川の2人の家族も……。"}, {"t": 1365.6833333333334, "x": "そこは記録に無いのでここでは語らない。"}, {"t": 1368.05, "x": "刑事局長は、制度の必要性は認めていると答えた。"}, {"t": 1371.6, "x": "外国の法律や実態を調べている最中だ、と。"}, {"t": 1374.8833333333334, "x": "まだ、作ってる途中だったのね。"}, {"t": 1377.1333333333334, "x": "1977年の春の時点ではまだ無かった。"}, {"t": 1381.1166666666666, "x": "補償の質問をした議員は、\n一人の人物の話もしている。"}, {"t": 1384.9333333333334, "x": "犯罪の被害者の会で会長を務めた人だ。"}, {"t": 1387.8166666666666, "x": "名前はここでは伏せておく。"}, {"t": 1389.55, "x": "どんな人だったの？"}, {"t": 1390.95, "x": "前の年にこの委員会で意見を述べた人だ。"}, {"t": 1393.6333333333334, "x": "議員によると、そこまでに\n運動を始めて約10年がたっていた。"}, {"t": 1397.55, "x": "10年も補償を求めてきたのね。"}, {"t": 1399.7666666666667, "x": "そして議員はこう続けた。"}, {"t": 1401.4166666666667, "x": "「制度の日の目を見るまでもなく、ことしに\n入って亡くなられた」"}, {"t": 1405.1, "x": "……間に合わなかったのね。"}, {"t": 1406.5666666666666, "x": "議員は「非常に気の毒な事態」と言っている。"}, {"t": 1409.4166666666667, "x": "議員は、この問題が関心を集めた始まりにも触れた。"}, {"t": 1412.8666666666666, "x": "三菱重工の爆弾事件だ。\nこの事件も前に別の回で扱った。"}, {"t": 1417.3333333333333, "x": "あの事件から、補償の話が強くなったのね。"}, {"t": 1420.45, "x": "その年は、被害者の補償に向けた予算もついたという。"}, {"t": 1423.8166666666666, "x": "弁護士の団体も自分たちの案を発表していた。"}, {"t": 1426.8166666666666, "x": "議員の党も法案を委員会に出していた。"}, {"t": 1429.35, "x": "みんなが作ろうとしてたのね。"}, {"t": 1431.25, "x": "だが4月の時点ではまだ形になっていない。"}, {"t": 1433.95, "x": "品川の事件は、その議論のまっただ中で起きた。"}, {"t": 1437.75, "x": "その制度が形になったのは、3年後だ。"}, {"t": 1440.5333333333333, "x": "1980年4月23日、参議院の本会議。"}, {"t": 1444.4, "x": "犯罪被害者等給付金支給法案が、採決にかけられた。"}, {"t": 1448.4333333333334, "x": "名前が長いわね。"}, {"t": 1449.75, "x": "故意の犯罪で亡くなった\n人の遺族などに、一時金を出す法律だ。"}, {"t": 1453.85, "x": "結果は全会一致での可決だった。"}, {"t": 1456.2333333333333, "x": "みんな賛成したのね。"}, {"t": 1457.7833333333333, "x": "ただ、委員長の報告に一つ大事な点がある。"}, {"t": 1460.7833333333333, "x": "施行は1981年1月1日。"}, {"t": 1463.75, "x": "「同日以後の犯罪行為による被害について適用する」"}, {"t": 1467.1166666666666, "x": "それより前の事件には……。"}, {"t": 1468.7666666666667, "x": "当たらない、ということだ。"}, {"t": 1470.3333333333333, "x": "委員会でも、そこは熱心に\n話し合われたと報告されている。"}, {"t": 1474.0, "x": "施行を早めることや、さかのぼって当てることだ。"}, {"t": 1477.0166666666667, "x": "でも、変わらなかったのね。"}, {"t": 1478.8333333333333, "x": "原案のまま可決された。"}, {"t": 1480.5333333333333, "x": "そのかわり、附帯決議がつけられた。"}, {"t": 1482.9333333333334, "x": "法律より前の被害者についても、\n別に救済に努めること、などだ。"}, {"t": 1487.5, "x": "1977年の品川は、線の手前なのね。"}, {"t": 1491.2, "x": "日付の上ではそうなる。"}, {"t": 1492.65, "x": "断っておくが、この法律は品川の事件が\nきっかけでできた、とは記録に無い。"}, {"t": 1497.55, "x": "同じ時代に、同じ問いが国会にあった。"}, {"t": 1500.0, "x": "並べられるのはそこまでだ。"}, {"t": 1502.35, "x": "ここで1977年という年を外から見ておく。"}, {"t": 1505.8333333333333, "x": "警察白書は、毎年その前の年を振り返る。"}, {"t": 1508.95, "x": "1977年の振り返りにはこういう並びがある。"}, {"t": 1512.3833333333334, "x": "「王選手の756号ホームラン、ニューネッシー騒ぎ等」"}, {"t": 1516.0833333333333, "x": "ホームランの記録の年なのね。"}, {"t": 1518.0666666666666, "x": "国民の関心を呼んだ話題として並べられている。"}, {"t": 1521.0, "x": "そのすぐあとにこう続く。"}, {"t": 1522.5833333333333, "x": "「青酸コーラ殺人事件」"}, {"t": 1524.2666666666667, "x": "そして、日本赤軍による日航機の乗っ取り。"}, {"t": 1527.0333333333333, "x": "有珠山の大きな噴火。"}, {"t": 1528.7, "x": "明るい話と怖い話が、同じ年にあったのね。"}, {"t": 1532.0666666666666, "x": "白書は事件の特徴も一言でまとめている。"}, {"t": 1534.9666666666667, "x": "「不特定人をねらったとみられる\n青酸コーラ殺人事件等が発生した」"}, {"t": 1539.3833333333334, "x": "不特定の人、ね。"}, {"t": 1541.0166666666667, "x": "その年の見出しは「対象の無差別化が\n目立つ凶悪犯罪」だった。"}, {"t": 1545.4333333333334, "x": "無差別が、その年の特徴になったんだ。"}, {"t": 1548.2833333333333, "x": "連続放火や、人質事件や、\n爆破事件も同じ見出しの下に並ぶ。"}, {"t": 1552.85, "x": "その中で、名前が出ている\n事件の一つが青酸コーラだった。"}, {"t": 1556.75, "x": "それだけ、みんなの記憶に残ったのね。"}, {"t": 1559.3666666666666, "x": "白書は、事件の数そのものの動きも書いている。"}, {"t": 1562.4333333333334, "x": "1977年の刑法犯は、前の年より1.7％増えた。"}, {"t": 1567.25, "x": "増えたのは主に窃盗で、4年続けての増加だった。"}, {"t": 1570.65, "x": "数で見ると、ほとんどが盗みなのね。"}, {"t": 1573.15, "x": "1977年の刑法犯の数は、126万8,430件。"}, {"t": 1578.4833333333333, "x": "その中の1件が、年を代表する\n事件として名前を残した。"}, {"t": 1583.05, "x": "次に国会で品川のコーラが語られた\n記録は、1984年の秋に見つかった。"}, {"t": 1588.5666666666666, "x": "別の毒物の事件が、関西で続いていた時期だった。"}, {"t": 1592.15, "x": "グリコ・森永事件の年ね。"}, {"t": 1594.35, "x": "そうだ。あの事件は、前に別の回で扱っている。"}, {"t": 1597.6, "x": "10月23日の参議院の地方行政委員会。"}, {"t": 1600.6833333333334, "x": "警察庁長官が、過去の例をふり返った。"}, {"t": 1603.4666666666667, "x": "「日本におきましても五十二年段階におきまして」"}, {"t": 1606.45, "x": "「品川でコーラにやはり毒物が\n入れられて二人が亡くなる」"}, {"t": 1609.7666666666667, "x": "「というふうな事件もございました」"}, {"t": 1611.8166666666666, "x": "7年たっても品川の名前で出てくるのね。"}, {"t": 1614.6333333333334, "x": "長官は八重洲口の件にも触れている。"}, {"t": 1616.9166666666667, "x": "そしてこう言った。"}, {"t": 1618.0333333333333, "x": "「これは犯人が検挙になっておりません」"}, {"t": 1620.4166666666667, "x": "7年たっても捕まってない。"}, {"t": 1622.3666666666666, "x": "警察のトップが、国会でそう認めた記録だ。"}, {"t": 1625.4166666666667, "x": "一次資料で「捕まっていない」と言える、\nいちばん遅い記録がこれになる。"}, {"t": 1629.85, "x": "そのあとは？"}, {"t": 1630.7833333333333, "x": "今回の検索では、そのあと国会で\nこの事件を語った記録は見つからなかった。"}, {"t": 1635.7, "x": "次に動くのは法律の上の時計のほうだ。"}, {"t": 1638.9, "x": "同じ1984年の委員会では、毒の管理も話に出ている。"}, {"t": 1643.3, "x": "ある議員が、埼玉県の工場で起きた盗難を挙げた。"}, {"t": 1646.5666666666666, "x": "青酸ソーダの粉末270グラムが入った\n金庫が、丸ごと盗まれたという。"}, {"t": 1651.6, "x": "金庫ごと？"}, {"t": 1652.55, "x": "議員はそう述べている。"}, {"t": 1653.85, "x": "厚生省の担当者は、決まりの中身を説明した。"}, {"t": 1657.0833333333333, "x": "メッキや金属の加工で青酸を使う\n業者にも、鍵のかかる設備でしまわせる。"}, {"t": 1661.85, "x": "在庫の量も決まった時期に点検させる。"}, {"t": 1664.45, "x": "1977年のころより細かくなってる？"}, {"t": 1667.6666666666667, "x": "比べられる記録は、今回そろえていない。"}, {"t": 1670.1666666666667, "x": "ただ、同じ問題が形を変えずに\n残っていたのは確かだ。"}, {"t": 1673.8333333333333, "x": "盗まれたり無くしたりした届けは、\n前の年に青酸ソーダで2件あったという。"}, {"t": 1678.55, "x": "届けが2件だけ？"}, {"t": 1679.9666666666667, "x": "届けが出た数としてそう説明されている。"}, {"t": 1682.55, "x": "届けの出ない分が、どれだけあったかは分からない。"}, {"t": 1685.5833333333333, "x": "7年たっても、毒の行き先は追いにくいままなのね。"}, {"t": 1688.95, "x": "1977年に大臣が言った\n「その先」の難しさは続いていた。"}, {"t": 1694.5166666666667, "x": "当時、殺人の罪には時効があった。"}, {"t": 1696.9666666666667, "x": "一定の年数がたつと、起訴できなくなる決まりだ。"}, {"t": 1700.2333333333333, "x": "何年だったの？"}, {"t": 1701.4666666666667, "x": "15年だ。"}, {"t": 1702.3833333333334, "x": "2004年の参議院の法務委員会で、ある議員が\nこう言っている。"}, {"t": 1706.05, "x": "「十五年姿を隠しておけば」"}, {"t": 1708.0166666666667, "x": "「殺人を犯しても刑罰を問われない」"}, {"t": 1710.4166666666667, "x": "それを変えようって話？"}, {"t": 1712.0166666666667, "x": "そうだ。その年に、25年へ延ばす\n改正案が審議されていた。"}, {"t": 1716.0833333333333, "x": "つまり、それまでの長い間、\n殺人の時効は15年だった。"}, {"t": 1720.0666666666666, "x": "1977年の15年後って……。"}, {"t": 1722.8333333333333, "x": "1992年の1月になる。"}, {"t": 1725.4, "x": "その日までに捕まらなかったらもう裁けないのね。"}, {"t": 1728.4333333333334, "x": "そういう決まりだった。"}, {"t": 1729.75, "x": "15年の間に、瓶は何も語らなかった。"}, {"t": 1732.6166666666666, "x": "同じ瓶が300万本あった、という最初の壁は動かない。"}, {"t": 1736.2166666666667, "x": "毒の出どころも3万か所の先に紛れていた。"}, {"t": 1739.1833333333334, "x": "手がかりの入り口が、全部ふさがってる……。"}, {"t": 1741.7833333333333, "x": "そして1992年1月、事件は時効を迎えたとされている。"}, {"t": 1746.1833333333334, "x": "時効の日付を書いた当時の新聞は、\n今回確かめられなかった。"}, {"t": 1750.1666666666667, "x": "だから、日付と時刻は言わない。"}, {"t": 1752.1333333333334, "x": "年と月までにしておく。"}, {"t": 1754.4166666666667, "x": "時効の決まりは、その後も変わっていく。"}, {"t": 1756.8333333333333, "x": "2004年には、25年へ延ばす改正が審議された。"}, {"t": 1760.2833333333333, "x": "さらに2010年4月27日、衆議院の本会議で\n別の改正案が可決される。"}, {"t": 1765.6833333333334, "x": "死刑のある罪を時効の対象から外すという中身だ。"}, {"t": 1768.9, "x": "殺人の罪も、ここに入る。"}, {"t": 1771.0333333333333, "x": "なくなったなら品川の事件も……。"}, {"t": 1773.1833333333334, "x": "そこが分かれ目だ。"}, {"t": 1774.3666666666666, "x": "法務委員長は、本会議でこう報告している。"}, {"t": 1777.2166666666667, "x": "「その施行の際公訴時効が\n完成してい 誰かももちろん言わない。"}, {"t": 1994.9, "x": "記録の中に、それを決める言葉は一つも無かった。"}, {"t": 1998.8, "x": "ねえ、最初の電話ボックスの話に戻っていい？"}, {"t": 2001.8, "x": "いいぞ。"}, {"t": 2002.4666666666667, "x": "あの学生は、ただ喉が\nかわいてたのかもしれないわよね。"}, {"t": 2005.85, "x": "かもしれない。仕事を終えた夜の帰り道だ。"}, {"t": 2008.5333333333333, "x": "そこに誰のものとも分からない1本があった。"}, {"t": 2011.2833333333333, "x": "私だったらどうしてたかな。"}, {"t": 2013.2, "x": "それを責める言葉は、記録のどこにも無い。"}, {"t": 2015.7666666666667, "x": "国会の議員も、拾った人を責める\n言い方を先に退けていた。"}, {"t": 2019.8666666666666, "x": "わけ知りの言い方、ね。"}, {"t": 2021.5333333333333, "x": "議員の見方では、犯人は誰かが\n手に取ることを計算して置いた。"}, {"t": 2025.4666666666667, "x": "300万本のうちの1本を選び、人の通る場所に置いた。"}, {"t": 2029.0833333333333, "x": "そして15年の間、名前も顔も出てこなかった。"}, {"t": 2032.4166666666667, "x": "……捕まらないまま、終わっちゃった。"}, {"t": 2034.5333333333333, "x": "裁く扉は閉じた。だが記録は残っている。"}, {"t": 2037.3666666666666, "x": "1977年の春、警察は国会で2人を\n「全く関係のない方」と呼んだ。"}, {"t": 2043.3166666666666, "x": "関係のない人がたまたま通っただけで。"}, {"t": 2045.9, "x": "だから今でも、道に置かれた飲み物には\n手を出さないように、と言われる。"}, {"t": 2050.0333333333333, "x": "その言葉の手前に品川の1本があった。"}, {"t": 2052.6833333333334, "x": "今回はその1本が残した記録を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
