<script>
const D={"name": "116", "file": "116_編集用", "dur": 2068.61665625, "segs": [], "subs": [{"t": 0.0, "x": "1977年1月3日。"}, {"t": 2.35, "x": "午後11時23分ごろ。"}, {"t": 4.266666666666667, "x": "東京の品川駅から寮へ帰る途中の学生がいた。"}, {"t": 7.533333333333333, "x": "新幹線ひかり号のビュッフェで\n働く、アルバイトの学生だ。"}, {"t": 11.183333333333334, "x": "帰り道の電話ボックスに、コーラが1本置いてあった。"}, {"t": 14.466666666666667, "x": "誰かの忘れ物？"}, {"t": 15.85, "x": "そう見えたはずだ。学生は、それを拾って飲んだ。"}, {"t": 18.95, "x": "意識を失い、翌日の1月4日に亡くなっている。"}, {"t": 22.316666666666666, "x": "飲み残しのコーラからは青酸の反応が出た。"}, {"t": 25.166666666666668, "x": "最初から毒が入ってたってこと？"}, {"t": 27.4, "x": "そうだ。しかもこの1本だけでは終わらない。"}, {"t": 30.0, "x": "最初に一つの数字を置いておく。"}, {"t": 32.03333333333333, "x": "同じコカコーラは、当時およそ300万本出回っていた。"}, {"t": 35.61666666666667, "x": "300万本……。"}, {"t": 36.766666666666666, "x": "警察庁の幹部が、国会でそう説明した数字だ。"}, {"t": 40.15, "x": "1本の瓶から犯人をたどるのが\n難しい。その理由として出てきた。"}, {"t": 44.266666666666666, "x": "犯人は捕まっていない。"}, {"t": 45.666666666666664, "x": "未解決のまま、15年後に時効を迎えたとされる。"}, {"t": 48.96666666666667, "x": "今回は、道に置かれた1本がどこにも\nつながらなかった記録を読む。"}, {"t": 53.06666666666667, "x": "国会の会議録と、警察白書に残った言葉だけを使う。"}, {"t": 57.06666666666667, "x": "1本の瓶が、どこにもつながらない？"}, {"t": 59.483333333333334, "x": "つながらなかった先で、\n社会のほうが少しずつ動いた。"}, {"t": 62.9, "x": "亡くなった2人の名前と年齢は、言わずにおく。"}, {"t": 65.78333333333333, "x": "犯人が誰だったのかも決めつけずに進める。"}, {"t": 69.2, "x": "最初の1本の話を、記録に沿ってもう少し細かく見る。"}, {"t": 72.91666666666667, "x": "出どころは、\nその年の4月6日の衆議院の法務委員会だ。"}, {"t": 76.65, "x": "説明したのは佐々淳行 警察庁刑事局参事官。"}, {"t": 80.43333333333334, "x": "警察の人が国会で説明したのね。"}, {"t": 83.1, "x": "議員に聞かれて事件の流れを読み上げている。"}, {"t": 85.66666666666667, "x": "その言葉をそのまま引く。"}, {"t": 87.33333333333333, "x": "「新幹線ひかり号のビュッフェに\n勤務しておりますアルバイト学生が」"}, {"t": 91.15, "x": "「勤務を終えて国電品川駅から寮に帰る途中」"}, {"t": 94.15, "x": "「電話ボックスの中にありました\nコカコーラを拾得して」"}, {"t": 97.48333333333333, "x": "拾得、って拾ったってことよね。"}, {"t": 99.75, "x": "落とし物を拾うときの、役所の言葉だ。"}, {"t": 102.41666666666667, "x": "拾ったあとに飲んで意識を失った。"}, {"t": 104.61666666666666, "x": "そして「翌四日死亡した」と続く。"}, {"t": 107.31666666666666, "x": "どうして、コーラに毒が入ってたって分かったの？"}, {"t": 110.28333333333333, "x": "「検死の結果、飲み残しのコーラから\n青酸反応がございました」"}, {"t": 114.21666666666667, "x": "瓶に残っていた分を調べて分かったわけだ。"}, {"t": 116.98333333333333, "x": "お正月の三が日の、最後の日よね。"}, {"t": 119.65, "x": "その日の勤めを終えて寮へ帰るところだった。"}, {"t": 122.26666666666667, "x": "電話ボックスは、人が足を止める場所だ。"}, {"t": 124.98333333333333, "x": "そこにぽつんと置いてあったら目に入るわね。"}, {"t": 127.53333333333333, "x": "目に入る場所に置かれていた。\nここは、あとで効いてくる。"}, {"t": 131.41666666666666, "x": "同じ1月4日。品川でもう一人が見つかる。"}, {"t": 134.55, "x": "最初の現場から、およそ700\nメートル離れた場所だった。"}, {"t": 138.26666666666668, "x": "もう一人見つかったの？"}, {"t": 139.86666666666667, "x": "一人の男性が、亡くなった姿で見つかった。"}, {"t": 142.86666666666667, "x": "説明の言葉はこうだ。"}, {"t": 144.41666666666666, "x": "「解剖の結果、胃の内容物から青酸反応があり」"}, {"t": 147.81666666666666, "x": "同じ毒が出たのね……。"}, {"t": 149.31666666666666, "x": "そしてもう一つの言葉が続く。"}, {"t": 151.41666666666666, "x": "「その死体発見場所から\n約百五十メートルくらいのところに」"}, {"t": 155.01666666666668, "x": "「青酸入りのコカコーラがそれぞれ放置されておる」"}, {"t": 157.88333333333333, "x": "また置いてあったの？"}, {"t": 159.18333333333334, "x": "置いてあった。1本目と同じ、\n青酸入りのコカコーラだ。"}, {"t": 162.61666666666667, "x": "ここで偶然という見方は消える。"}, {"t": 164.66666666666666, "x": "誰かがわざと何本も置いたってことね。"}, {"t": 167.11666666666667, "x": "少なくとも記録は、そういう前提で語られている。"}, {"t": 170.26666666666668, "x": "700メートルと150メートル。歩ける距離だ。"}, {"t": 173.41666666666666, "x": "続けて近くで2人……。"}, {"t": 175.05, "x": "2人とも狙われる理由のある人ではなかった。"}, {"t": 177.78333333333333, "x": "佐々参事官はこう言い表した。"}, {"t": 179.81666666666666, "x": "「全く関係のない方が犠牲になっておられる」"}, {"t": 182.7, "x": "関係のない人。"}, {"t": 184.05, "x": "犯人と何の関係もない人、という意味だ。"}, {"t": 186.83333333333334, "x": "たまたまその道を通った。\nそれだけで選ばれてしまった。"}, {"t": 190.8, "x": "では、なぜ瓶から犯人にたどり着けなかったのか。"}, {"t": 193.88333333333333, "x": "参事官は理由を三つ挙げている。"}, {"t": 195.86666666666667, "x": "一つ目が冒頭の数字だ。"}, {"t": 197.6, "x": "「コカコーラのごときは\n約三百万本同じものが出回っておる」"}, {"t": 201.31666666666666, "x": "同じ瓶が多すぎるってこと？"}, {"t": 203.21666666666667, "x": "そうだ。どこにでも売っていて誰でも買える。"}, {"t": 205.71666666666667, "x": "店で買った人を一人ずつ当たることは、まずできない。"}, {"t": 208.93333333333334, "x": "参事官の言葉ではこうなる。"}, {"t": 210.73333333333332, "x": "「この物の捜査から犯人に\n到達するということが大変困難」"}, {"t": 214.7, "x": "物の捜査って？"}, {"t": 215.98333333333332, "x": "残された物から、持ち主や\n売った店をたどる捜査のことだ。"}, {"t": 219.7, "x": "珍しい物なら売った店は少ない。"}, {"t": 221.86666666666667, "x": "買った人の顔を覚えている店員も、いるかもしれない。"}, {"t": 225.15, "x": "でも、コーラは珍しくない。"}, {"t": 227.06666666666666, "x": "むしろ、一番ありふれた飲み物の一つだった。"}, {"t": 230.0, "x": "ありふれているから手に取っても怪しまれない。"}, {"t": 232.41666666666666, "x": "ありふれているから、犯人の手がかりにもなりにくい。"}, {"t": 235.51666666666668, "x": "同じ理由が両方に効いちゃうのね。"}, {"t": 237.68333333333334, "x": "そこがこの事件の、いちばん厄介なところだ。"}, {"t": 240.53333333333333, "x": "1本の瓶は、300万本の中に紛れてしまう。"}, {"t": 243.81666666666666, "x": "瓶に指紋とかは残らないの？"}, {"t": 245.8, "x": "そこは国会でも語られていない。"}, {"t": 247.65, "x": "記録に無い話は、ここでは足さない。"}, {"t": 250.71666666666667, "x": "二つ目の理由は動機だ。"}, {"t": 252.33333333333334, "x": "参事官は、ふつうの事件と比べている。"}, {"t": 254.88333333333333, "x": "「通常の犯罪の場合には\n痴情とか怨恨とか物取りとか」"}, {"t": 258.31666666666666, "x": "「こういう動機があるわけでございます」"}, {"t": 260.43333333333334, "x": "痴情は恋愛のもつれ、怨恨はうらみよね。"}, {"t": 263.15, "x": "物取りは金や物が目当ての犯行だ。"}, {"t": 265.5, "x": "どれかが分かれば、被害者の\nまわりから探していける。"}, {"t": 268.78333333333336, "x": "知り合いの中に、犯人がいるかもしれないから？"}, {"t": 271.73333333333335, "x": "そうだ。捜査は、まず被害者の人間関係から当たる。"}, {"t": 275.2, "x": "ところが今回はその入り口が無い。"}, {"t": 277.3, "x": "被害者を選んでいない犯行だからだ。"}, {"t": 279.65, "x": "誰が飲むか、犯人にも分からないのよね。"}, {"t": 282.4, "x": "分からないまま置いている。"}, {"t": 283.85, "x": "参事官は、この種の犯罪をこう説明した。"}, {"t": 286.75, "x": "「不特定多数の人を対象として」"}, {"t": 289.0, "x": "「動機が必ずしも明らかでない形で行われる」"}, {"t": 292.18333333333334, "x": "被害者から探す道が、最初から閉じてる。"}, {"t": 295.1666666666667, "x": "その通りだ。2人のまわりをいくら\n調べても、犯人の影は出てこない。"}, {"t": 299.43333333333334, "x": "関係が無いからこそ、被害に遭っている。"}, {"t": 302.0833333333333, "x": "……ひどい話だわ、それ。"}, {"t": 303.81666666666666, "x": "参事官は、犯人の側の目的についても\n一言だけ触れている。"}, {"t": 307.93333333333334, "x": "社会に動揺と不安を与え、快感を覚える\n異常な性格の持ち主と「思われる」。"}, {"t": 312.78333333333336, "x": "ここは警察の見立てとして聞いておく。"}, {"t": 314.95, "x": "犯人が分かった話ではない。"}, {"t": 317.55, "x": "三つ目の理由は街の変わり方だ。"}, {"t": 319.71666666666664, "x": "参事官はこう続けている。"}, {"t": 321.4166666666667, "x": "「隣近所の連帯性が非常に薄くなってきておる」"}, {"t": 324.6166666666667, "x": "近所づきあいが減った、ってこと？"}, {"t": 326.75, "x": "そうだ。大きな街ほど、隣に\n誰が住んでいるか知らない。"}, {"t": 330.3, "x": "「市民の無関心さに便乗して」\nこの種の犯行が行われる、と言った。"}, {"t": 334.75, "x": "誰かが電話ボックスに\n瓶を置いても、気にしない……。"}, {"t": 337.71666666666664, "x": "夜の駅の近くなら、人は急いで通り過ぎる。"}, {"t": 340.7, "x": "誰かが立ち止まって何かしていても覚えていない。"}, {"t": 343.6333333333333, "x": "私も、たぶん覚えてないわ。"}, {"t": 345.65, "x": "それが責められる話ではないのが難しいところだ。"}, {"t": 348.6666666666667, "x": "参事官も市民を責めてはいない。"}, {"t": 350.6333333333333, "x": "「目撃者の方々に大変積極的に\n協力をしていただきまして」"}, {"t": 354.85, "x": "と、協力に礼を言っている。"}, {"t": 356.7, "x": "協力してくれる人はいたのね。"}, {"t": 358.81666666666666, "x": "いた。ただ、決め手になる目撃は記録に出てこない。"}, {"t": 362.0833333333333, "x": "参事官の答弁は、最後にこう結ばれている。"}, {"t": 364.93333333333334, "x": "「国民の御協力を切に希望するものでございます」"}, {"t": 368.15, "x": "お願いで終わってるのね。"}, {"t": 369.71666666666664, "x": "4月の時点で、警察がそう\n言うしかなかったということだ。"}, {"t": 373.25, "x": "1月の事件から、3か月がたっていた。"}, {"t": 376.65, "x": "ここで4月6日の質問そのものを見ておく。"}, {"t": 379.3833333333333, "x": "質問に立ったのは公明党の議員だった。"}, {"t": 381.93333333333334, "x": "議員は前置きでこういう犯罪を並べている。"}, {"t": 384.4, "x": "「通り魔的犯罪、無差別の爆弾テロ、\nいわゆるいわれなき犯罪」"}, {"t": 388.5833333333333, "x": "いわれなき犯罪？"}, {"t": 389.85, "x": "狙われる理由の無い人が被害に\n遭う犯罪、という意味だろう。"}, {"t": 393.3, "x": "議員はそれが\n「最近次第に増加する傾向」にあると言った。"}, {"t": 397.15, "x": "コーラの事件もその中に入ってるのね。"}, {"t": 399.7, "x": "入っている。毒入りコーラと\nチョコレートの名前が、その場で挙がった。"}, {"t": 403.5833333333333, "x": "議員はこうも問いかけている。"}, {"t": 405.21666666666664, "x": "「思想的背景があるのか、単に\n社会に背を向けた犯罪なのか」"}, {"t": 409.28333333333336, "x": "思想的背景って？"}, {"t": 410.85, "x": "政治の主張のために事件を起こす、という意味合いだ。"}, {"t": 413.95, "x": "同じ質問の中に爆弾テロも並んでいたからな。"}, {"t": 417.15, "x": "コーラの事件で犯人から何か届いたりはしたの？"}, {"t": 420.25, "x": "少なくとも国会の記録には、そういう話は出てこない。"}, {"t": 423.76666666666665, "x": "だから議員もどちらなのかを問う形にしている。"}, {"t": 426.53333333333336, "x": "法務大臣の所信表明にも、似た言葉があったという。"}, {"t": 429.9, "x": "「自分さえよければ他を顧みない」社会の傾向だ。"}, {"t": 433.0833333333333, "x": "社会の空気の話にまで広がってたのね。"}, {"t": 435.8833333333333, "x": "議員は、こうした事件が人々に\n与えるものも言っている。"}, {"t": 439.25, "x": "「不特定の市民が不幸な被害者となり、\n国民を極端な不安に陥れてしまう」"}, {"t": 444.26666666666665, "x": "誰でも被害者になりうるから、\nみんなが不安になるのね。"}, {"t": 447.7, "x": "被害に遭った人の外側にまで、不安が広がっていく。"}, {"t": 451.15, "x": "1本の瓶が、そこまでの問いを呼んでいた。"}, {"t": 453.71666666666664, "x": "ただ、問いに答えが出たわけではない。"}, {"t": 455.9166666666667, "x": "犯人が見つからない以上、\n動機も確かめようがなかった。"}, {"t": 459.98333333333335, "x": "同じ日の答弁で、参事官は別の事件にも触れている。"}, {"t": 463.43333333333334, "x": "こちらは捕まえることができた事件の話だ。"}, {"t": 466.35, "x": "捕まった事件もあったの？"}, {"t": 468.1333333333333, "x": "新宿の連続放火と、大阪阿倍野の連続放火だ。"}, {"t": 471.5, "x": "どちらも火をつけて回る事件だった。"}, {"t": 473.76666666666665, "x": "参事官は捕まえ方をこう説明した。"}, {"t": 476.25, "x": "「結局現行犯逮捕する以外にない」"}, {"t": 478.71666666666664, "x": "火をつける瞬間を押さえるってこと？"}, {"t": 480.95, "x": "そうだ。そのために長い間、現場で張り込んだ。"}, {"t": 484.0833333333333, "x": "連日、多くの警察官が出た。"}, {"t": 486.35, "x": "地元の住民の有志も張り込みに協力している。"}, {"t": 489.28333333333336, "x": "阿倍野の事件は、そうして現行犯で検挙された。"}, {"t": 492.3833333333333, "x": "新宿の事件も、地元の協力を得て\n検挙したと述べている。"}, {"t": 496.26666666666665, "x": "近所づきあいが薄くても、協力はしてくれたのね。"}, {"t": 499.51666666666665, "x": "参事官も、隣組の意識が\n高まるときがあると言っていた。"}, {"t": 503.35, "x": "じゃあコーラの事件も張り込めば……。"}, {"t": 505.3, "x": "そこが違う。放火なら、\n狙われやすい場所に見当がつく。"}, {"t": 508.93333333333334, "x": "続いている場所の近くで待てば、\n次が来るかもしれない。"}, {"t": 512.2166666666667, "x": "コーラの瓶は、どこに置かれるか分からない。"}, {"t": 514.65, "x": "電話ボックスは街じゅうにある。"}, {"t": 516.5333333333333, "x": "全部の電話ボックスを見張るのは無理よね。"}, {"t": 519.0666666666667, "x": "無理だ。待ち伏せの手が、\nこの事件では使えなかった。"}, {"t": 522.3833333333333, "x": "議員はモンタージュや顔写真を出す\n呼びかけにも触れていた。"}, {"t": 525.7, "x": "顔が分からないと、その手も使えないのね。"}, {"t": 528.4666666666667, "x": "品川の事件で似顔絵が出たという\n話は、今回の記録には無い。"}, {"t": 533.1333333333333, "x": "4月6日の答弁で、コーラの前に語られた事件がある。"}, {"t": 536.6, "x": "前の年に東京の多摩地域で続いた通り魔だ。"}, {"t": 539.5333333333333, "x": "福生、昭島、立川の3つの警察署の管内で起きている。"}, {"t": 543.7, "x": "どんな事件だったの？"}, {"t": 545.1833333333333, "x": "1976年の5月から9月までに、\n車を使った傷害が4件続いた。"}, {"t": 550.5333333333333, "x": "被害に遭ったのはいずれも20歳前後の女性だ。"}, {"t": 553.4, "x": "夜の帰り道で刃物で傷つけられている。"}, {"t": 555.9666666666667, "x": "そのうち一人は、入院のあとに亡くなった。"}, {"t": 558.7833333333333, "x": "その犯人は？"}, {"t": 559.95, "x": "参事官は「まだ検挙に至っておりません」と述べた。"}, {"t": 563.2, "x": "3つの署が、合同で捜査本部を置いて\n調べている最中だった。"}, {"t": 567.15, "x": "未解決の事件が、同じ答弁に二つ並んでたのね。"}, {"t": 570.75, "x": "そうだ。どちらも狙う相手を選んでいない。"}, {"t": 573.1833333333333, "x": "国会が聞いたのはそういう事件のまとまりだった。"}, {"t": 575.9833333333333, "x": "この通り魔のその後は、この回では追わない。"}, {"t": 578.5333333333333, "x": "ここで見ておきたいのは並び方のほうだ。"}, {"t": 581.0, "x": "コーラの事件だけが、特別だったわけじゃないのね。"}, {"t": 584.2, "x": "同じ形の不安が、同じ年に重なっていた。"}, {"t": 587.9, "x": "少し時間を戻す。3月3日の、衆議院の内閣委員会だ。"}, {"t": 592.1, "x": "ここで、別の物が話に出る。チョコレートだ。"}, {"t": 595.15, "x": "チョコレートが出てくるの？"}, {"t": 596.7166666666667, "x": "ある議員がこう切り出している。"}, {"t": 598.4, "x": "「最近起こりました\n東京駅八重洲地下街での青酸チョコレート事件」"}, {"t": 602.45, "x": "コーラの次はチョコレートなの？"}, {"t": 604.2833333333333, "x": "この委員会の少し前、東京駅の地下街で\n青酸入りのチョコレートが見つかっていた。"}, {"t": 609.2333333333333, "x": "見つかった日や個数は、一次資料で\n確かめられなかった。ここでは言わない。"}, {"t": 613.6333333333333, "x": "議員が聞いたのは置かれていた場所のことだ。"}, {"t": 616.0666666666667, "x": "そこは国鉄の土地なのか、と。"}, {"t": 618.2833333333333, "x": "場所が大事なの？"}, {"t": 619.5833333333334, "x": "誰が見張る責任を持つか、が変わるからだ。"}, {"t": 622.3333333333334, "x": "国鉄の常務理事はこう答えた。"}, {"t": 624.4, "x": "置かれていたのは「国鉄の用地外」だった。"}, {"t": 627.2166666666667, "x": "地下街を管理しているのは民間の会社だという。"}, {"t": 630.1833333333333, "x": "駅のすぐそばなのに駅の土地じゃないのね。"}, {"t": 632.7666666666667, "x": "議員は重ねて聞いた。"}, {"t": 634.05, "x": "国鉄は、出資していないのか。"}, {"t": 636.25, "x": "答えは「出資いたしておりません」。"}, {"t": 638.4333333333333, "x": "じゃあ国鉄は関係ない、ってこと？"}, {"t": 640.6833333333333, "x": "議員はそこで引き下がらなかった。"}, {"t": 642.7166666666667, "x": "駅へ行く人にとっては、駅の通り道の一部だからだ。"}, {"t": 646.7166666666667, "x": "この委員会で、議員が述べた言葉がある。"}, {"t": 649.1833333333333, "x": "この回で一番大事な一文だと思うので長めに引く。"}, {"t": 652.5166666666667, "x": "「置いてあった物を食べる、あるいは置いてあった\nコーラを飲むということは」"}, {"t": 656.1333333333333, "x": "「それはまた親の教育の問題」"}, {"t": 658.0666666666667, "x": "「あるいはそんな物に手を出すのは\nおかしいじゃないかという」"}, {"t": 661.0, "x": "「わけ知りの言い方はあるかもしれませんが」"}, {"t": 663.4333333333333, "x": "拾ったほうが悪い、って言う人もいたのね。"}, {"t": 666.05, "x": "いたのだろう。議員は、それを先回りして言っている。"}, {"t": 669.15, "x": "そのうえでこう続けた。"}, {"t": 670.5833333333334, "x": "「置いたと思われる犯人は無差別のそういう\n大量に人が動くところへ置いておいて」"}, {"t": 675.1, "x": "「だれかが食べるであろうということを\n計算して置いているわけです」"}, {"t": 678.5833333333334, "x": "計算して置いてる……。"}, {"t": 679.95, "x": "拾う人が出ることまで、犯人は見込んでいる。"}, {"t": 682.75, "x": "だから拾った人の不注意で片付けてはいけない。"}, {"t": 685.65, "x": "議員の言いたいことはそういうことだ。"}, {"t": 687.7666666666667, "x": "電話ボックスも、人が必ず立ち寄る場所よね。"}, {"t": 690.9333333333333, "x": "そうだな。夜でも明るく手を伸ばせば届く。"}, {"t": 693.6333333333333, "x": "最初の章で「目に入る場所」と\n言ったのは、このためだ。"}, {"t": 697.3333333333334, "x": "置き場所まで選ばれてたかもしれないのね。"}, {"t": 699.7833333333333, "x": "かもしれない。ただ、それを決める記録は無い。"}, {"t": 702.5333333333333, "x": "言えるのは、議員がそう受け止めていたところまでだ。"}, {"t": 706.0166666666667, "x": "では駅の中に、持ち主の分からない\n物があったらどうなるのか。"}, {"t": 709.7333333333333, "x": "常務理事は、議員の問いをこう受け止めていた。"}, {"t": 712.3666666666667, "x": "もし駅のコンコースに置かれていたら、\n国鉄はどう責任を負うのか。"}, {"t": 716.3833333333333, "x": "場所が少しずれてたら、駅の問題だったのね。"}, {"t": 719.4833333333333, "x": "そういうことだ。そこで常務理事は、\nふだんの扱いを説明した。"}, {"t": 723.3833333333333, "x": "コーラやチョコレートが置いてあって、\n持ち主が分からない。"}, {"t": 726.4666666666667, "x": "その場合は「遺失物法の規定に\nよりまして遺失物扱い」をする。"}, {"t": 730.85, "x": "落とし物として預かるのね。"}, {"t": 732.7666666666667, "x": "そうだ。駅にとって置き去りの物は、毎日のことだ。"}, {"t": 736.1333333333333, "x": "ただし、毒が入っていると明らかなら、扱いが変わる。"}, {"t": 739.5833333333334, "x": "警察署に連絡して国鉄の中の公安官を動員する。"}, {"t": 743.2833333333333, "x": "公安官って？"}, {"t": 744.4333333333333, "x": "当時の国鉄にいた、鉄道の中の警察のような係だ。"}, {"t": 748.1666666666666, "x": "ここで一つ、引っかかる点がある。"}, {"t": 750.5, "x": "引っかかる点って、何？"}, {"t": 752.35, "x": "見た目では、毒が入っているかは分からないことだ。"}, {"t": 755.3166666666667, "x": "瓶の外から眺めても、中身の違いは区別がつかない。"}, {"t": 758.9666666666667, "x": "じゃあ、ふつうは落とし物として扱われちゃう。"}, {"t": 761.7333333333333, "x": "そういう仕組みの中に、毒入りの物がまぎれ込む。"}, {"t": 764.7, "x": "議員は新幹線の放送も例に出していた。"}, {"t": 767.3166666666667, "x": "「自分の荷物でない物がありたら\nこれは届け出てください」"}, {"t": 770.5833333333334, "x": "「命ということに関して言えば同じ理屈であります」"}, {"t": 773.7, "x": "置かれた物は手を出さずに届ける、ってことね。"}, {"t": 776.55, "x": "持ち主の分からない物を拾う物から届ける物へ。"}, {"t": 779.6166666666667, "x": "考え方の向きを変えようという話だった。"}, {"t": 782.85, "x": "では国鉄は何をすると答えたのか。"}, {"t": 785.2, "x": "まず、今の見回りの回数が出てくる。"}, {"t": 787.6166666666667, "x": "ふつうの駅なら、駅長が「午前一回、\n午後一回」必ず巡回している。"}, {"t": 792.5666666666667, "x": "1日に2回？"}, {"t": 793.8, "x": "そうだ。駅長の見回りとしては、それが決まりだった。"}, {"t": 797.2833333333333, "x": "電話ボックスの事件は、夜の11時台よね。"}, {"t": 800.3833333333333, "x": "そこは駅の外の話だから、\n比べるのは筋違いかもしれない。"}, {"t": 804.2833333333333, "x": "ただ、1日2回の見回りで、\n全部の置き物は見つけられない。"}, {"t": 808.2166666666667, "x": "それは答弁からも伝わってくる。"}, {"t": 810.2333333333333, "x": "常務理事は、これからの対策も述べた。"}, {"t": 812.7333333333333, "x": "人の多い駅で、客に注意を\nうながす放送や掲示をする。"}, {"t": 816.2166666666667, "x": "名前が挙がったのは、東京駅、\n上野駅、新宿駅、広島駅だ。"}, {"t": 820.8666666666667, "x": "広島駅も入ってるのね。"}, {"t": 822.7666666666667, "x": "大きな駅の例として並べたのだろう。"}, {"t": 824.8333333333334, "x": "理由までは語っていない。"}, {"t": 826.4333333333333, "x": "常務理事は、駅長の責任にも触れている。"}, {"t": 829.15, "x": "駅長は駅の中の秩序を\n守ることに社会的な責任を持つ。"}, {"t": 833.0666666666667, "x": "職務の上の責任も持っている、と述べた。"}, {"t": 835.8666666666667, "x": "責任はある、でも全部は見られない。"}, {"t": 838.2166666666667, "x": "そこで考えたのが次の手だ。"}, {"t": 840.15, "x": "見回る人を増やすより、客の目を借りる。"}, {"t": 842.8, "x": "拾わないで知らせてくださいって呼びかけるのね。"}, {"t": 845.6333333333333, "x": "何万人も通る駅では、それが現実的な手だった。"}, {"t": 849.0166666666667, "x": "議員は「すんでのところだった」とも言っている。"}, {"t": 851.95, "x": "すんでのところ？"}, {"t": 853.1, "x": "誰かが口にしていても\nおかしくなかった、という意味だろう。"}, {"t": 856.4666666666667, "x": "命に関わる物が、何万人も通る\n道に置かれていたわけだ。"}, {"t": 860.9666666666667, "x": "次は、毒そのものの話だ。"}, {"t": 863.0833333333334, "x": "4月5日、参議院の予算委員会。"}, {"t": 865.5166666666667, "x": "ある議員が厚生大臣に質問した。"}, {"t": 867.8333333333334, "x": "「倒産した企業の倉庫に\n多量の青酸カリが放置されている」"}, {"t": 871.4, "x": "「こういった危険な状態が頻発しております」"}, {"t": 874.2666666666667, "x": "倉庫に置きっぱなし？"}, {"t": 875.75, "x": "そういう例があると、議員は言っている。"}, {"t": 877.8833333333333, "x": "答えたのは渡辺美智雄 厚生大臣だ。"}, {"t": 880.55, "x": "「青酸カリが最近いろいろと悪用されて\n大きな社会問題になっておる」"}, {"t": 884.6833333333333, "x": "「十分承知をいたしております」"}, {"t": 886.6666666666666, "x": "毒ってふつうに買えるものなの？"}, {"t": 888.6333333333333, "x": "大臣は法律で決まっていることを並べた。"}, {"t": 891.2166666666667, "x": "盗まれないようにする。なくさないようにする。"}, {"t": 893.8333333333334, "x": "売るときには買う人の名前を確かめる。"}, {"t": 896.2, "x": "渡す相手を限り、しまう場所を明らかにする。"}, {"t": 899.1333333333333, "x": "決まりはちゃんとあったのね。"}, {"t": 900.8166666666667, "x": "あった。問題はその先だと、大臣は言う。"}, {"t": 903.6166666666667, "x": "工場や学校に流れていった先が\n「なかなか把握がむずかしい」。"}, {"t": 907.55, "x": "売るところまでは見張れてもそのあとが追えない。"}, {"t": 910.1, "x": "ここでもたどれない話が出てくる。"}, {"t": 912.15, "x": "瓶も、毒も、一度手を離れると追えなくなっていた。"}, {"t": 916.0166666666667, "x": "大臣はすでに出した手も紹介している。"}, {"t": 918.4666666666667, "x": "「三月二十六日に」と、日付まで言った。"}, {"t": 921.3833333333333, "x": "「毒物及び劇物の管理保管について」という\n通達を出したという。"}, {"t": 925.6666666666666, "x": "その通達の中身は？"}, {"t": 927.2833333333333, "x": "「貯蔵、陳列その他の管理について」\n細かく決めた、とある。"}, {"t": 931.2666666666667, "x": "しまい方と、並べ方と、そのほかの扱いだ。"}, {"t": 934.5833333333334, "x": "1月の事件から3か月くらいね。"}, {"t": 937.05, "x": "そうだ。国会で質問される少し前に出ていた。"}, {"t": 940.1333333333333, "x": "この答弁の中で、大臣はもう\n一つ気になることを言っている。"}, {"t": 943.8, "x": "「今回コーラのびんに青酸カリが入って\n殺人未遂というような大きな問題が起きておる」"}, {"t": 948.9333333333333, "x": "殺人未遂？ 品川のほかにも？"}, {"t": 951.3333333333334, "x": "そう読める。ただ、どこの件なのかを\n大臣は言っていない。"}, {"t": 954.6666666666666, "x": "場所や人をこの回で足すことはしない。"}, {"t": 956.95, "x": "確かめられたのは、大臣がそう\n述べた、という一点だけだ。"}, {"t": 960.7, "x": "でも、コーラの瓶がまた使われたのよね。"}, {"t": 963.3166666666667, "x": "大臣の言葉の上ではそうなる。"}, {"t": 965.2666666666667, "x": "そして大臣はこう結んでいる。"}, {"t": 967.1166666666667, "x": "「一層さらにきめ細かく指導してまいりたい」"}, {"t": 969.8333333333334, "x": "指導、なのね。"}, {"t": 971.1, "x": "法律を変えるのではなく、今ある\n決まりを細かく守らせる方向だ。"}, {"t": 975.6833333333333, "x": "渡辺大臣の答弁には見通しを語った一文もある。"}, {"t": 978.9833333333333, "x": "毒がどう手に入れられたのか、についてだ。"}, {"t": 981.4333333333333, "x": "「どういうような経路でその入手をされていったか」"}, {"t": 984.0333333333333, "x": "「というようなことがだんだん\n明らかになってくると思います」"}, {"t": 987.35, "x": "分かってくるはず、って言ってるのね。"}, {"t": 989.5166666666667, "x": "警察の捜査で、入手の道筋が\n見えてくると期待していた。"}, {"t": 993.3333333333334, "x": "見えてきたらそれに合わせて規制を考える。"}, {"t": 995.8, "x": "大臣はそういう順番で話している。"}, {"t": 998.15, "x": "それで明らかになったの？"}, {"t": 999.8166666666667, "x": "国会の記録を見る限り、そういう報告は出てこない。"}, {"t": 1003.05, "x": "7年後の長官も「検挙になっておりません」と言う。"}, {"t": 1006.4333333333333, "x": "入手の道筋も分からないままだったのね。"}, {"t": 1009.1, "x": "少なくとも表に出た記録の上ではそうだ。"}, {"t": 1011.7666666666667, "x": "1977年の春は、まだ分かるはずだと思われていた。"}, {"t": 1015.7833333333333, "x": "答弁の言葉には、その空気が残っている。"}, {"t": 1018.6166666666667, "x": "期待してたぶん、重たいわね。"}, {"t": 1020.6333333333333, "x": "答えが出ないまま、規制のほうが先に進んだ。"}, {"t": 1023.55, "x": "それが次に見る警察の動きだ。"}, {"t": 1026.2833333333333, "x": "警察の側も動いていた。"}, {"t": 1028.0, "x": "翌年に出た警察白書にその記録がある。"}, {"t": 1030.7666666666667, "x": "「52年は青酸コーラによる\n連続殺人事件等の凶悪事件や」"}, {"t": 1034.9333333333334, "x": "「シアン化ナトリウムの盗難事件及び放置事案が\n発生し社会的な問題となった」"}, {"t": 1039.95, "x": "盗まれたり、放っておかれたり。"}, {"t": 1042.1, "x": "倉庫の話と、同じ流れだな。"}, {"t": 1044.3833333333334, "x": "そこで警察は、厚生省に一つ要望を出した。"}, {"t": 1047.5, "x": "シアン化合物の管理を、\n適正にしてほしいという要望だ。"}, {"t": 1051.05, "x": "警察から役所にお願いしたのね。"}, {"t": 1053.4166666666667, "x": "そうだ。毒の管理は、厚生省の受け持ちだからだ。"}, {"t": 1056.6833333333334, "x": "そのうえで警察自身も動いている。"}, {"t": 1058.8166666666666, "x": "5月に全国いっせいの防犯指導をした。"}, {"t": 1061.35, "x": "対象はシアン化ナトリウムなどを扱う場所。"}, {"t": 1063.9, "x": "その数が「3万4,506箇所」だ。"}, {"t": 1067.0, "x": "3万か所以上……。"}, {"t": 1068.2833333333333, "x": "白書は、どんな業種の場所かという\n内訳までは書いていない。"}, {"t": 1071.9166666666667, "x": "それだけの場所に、同じ毒があったってことよね。"}, {"t": 1075.0, "x": "そうなる。毒の出どころを探す\n側から見れば、とても広い。"}, {"t": 1078.5666666666666, "x": "入手先から犯人に届いた、という記録も見当たらない。"}, {"t": 1081.9833333333333, "x": "ここは推測を足さず、数字の大きさだけを見ておく。"}, {"t": 1085.7833333333333, "x": "同じ白書にもう一つ目を引く数字がある。"}, {"t": 1088.3666666666666, "x": "落とし物と拾い物の数だ。"}, {"t": 1090.2833333333333, "x": "1977年の拾得届は、300万8,786件。"}, {"t": 1095.55, "x": "また300万？"}, {"t": 1096.7333333333333, "x": "偶然だが、瓶の本数とほぼ同じ桁だな。"}, {"t": 1099.6166666666666, "x": "拾得届は、拾った物を警察に届けた数だ。"}, {"t": 1103.0333333333333, "x": "遺失届、つまり落としましたという\n届けは、160万4,556件。"}, {"t": 1108.3166666666666, "x": "拾って届けた数のほうが、ずっと多いのね。"}, {"t": 1111.2166666666667, "x": "そうだ。拾った物を届ける人が、\nそれだけいたということになる。"}, {"t": 1115.25, "x": "白書によると、窓口の多くは派出所や駐在所だった。"}, {"t": 1118.8666666666666, "x": "お金の落とし物も数えられている。"}, {"t": 1120.95, "x": "落としたと届けられたお金は、約187億円。"}, {"t": 1124.4166666666667, "x": "拾って届けられたお金は、約91億円だった。"}, {"t": 1127.9833333333333, "x": "落としたお金のほうが、倍くらい多いのね。"}, {"t": 1130.65, "x": "白書は、落としたお金は出てきにくいと書いている。"}, {"t": 1133.65, "x": "物のほうは、落とした人があきらめて\n届けない場合が多いともある。"}, {"t": 1137.6166666666666, "x": "みんな、拾った物はちゃんと届けてたんだ。"}, {"t": 1140.4, "x": "拾う、というのは悪いことではない。"}, {"t": 1142.4666666666667, "x": "むしろ、届けるために拾う人がたくさんいた。"}, {"t": 1145.45, "x": "電話ボックスのコーラも拾うだけなら……。"}, {"t": 1147.8, "x": "飲まずに届けていれば、と言いたくなる。"}, {"t": 1150.1, "x": "だが、議員の言葉を思い出してほしい。"}, {"t": 1152.5833333333333, "x": "わけ知りの言い方、ね。"}, {"t": 1154.2666666666667, "x": "そうだ。飲み物が置いてあれば、\n手が伸びることもある。"}, {"t": 1157.4, "x": "犯人は、その手が伸びるところまで見込んでいた。"}, {"t": 1160.2833333333333, "x": "拾う人の多い社会だった、ということは\n覚えておきたい。"}, {"t": 1163.7, "x": "拾う手と、毒を置く手は、まるで別のものなのにね。"}, {"t": 1167.5833333333333, "x": "4月6日の法務委員会に戻る。"}, {"t": 1169.7, "x": "議員は国民への呼びかけ方を聞いていた。"}, {"t": 1172.2, "x": "佐々参事官の答えの中にこういう一文がある。"}, {"t": 1175.1333333333334, "x": "「毒入りチョコレート事件、毒入りコーラ事件の後は」"}, {"t": 1178.1333333333334, "x": "「こういう放置されておるものを\n食べないように、飲まないように」"}, {"t": 1181.3666666666666, "x": "「呼びかけを、種々の防犯協会その他の\n諸団体あるいは学校等を通じて」"}, {"t": 1186.05, "x": "学校でも言われてたのね。"}, {"t": 1187.75, "x": "子どもに向けた呼びかけでもあった。"}, {"t": 1189.9, "x": "知らない物を口に入れない、って今でも言われるわ。"}, {"t": 1192.7833333333333, "x": "その言い方が、全国で広く\n呼びかけられた時期の一つが、ここだ。"}, {"t": 1197.0333333333333, "x": "参事官は、事件が起きたときの方針も語っている。"}, {"t": 1200.35, "x": "速やかに記者発表をして、\nマスコミを通じて呼びかける。"}, {"t": 1203.8666666666666, "x": "必要なら公開捜査に踏み切る。"}, {"t": 1206.0833333333333, "x": "隠さないで知らせるほうを選んだのね。"}, {"t": 1208.3833333333334, "x": "無差別の事件では、次に拾う\n人を止めるのが先になる。"}, {"t": 1211.9666666666667, "x": "知らせが早ければ、手を伸ばす人が減る。"}, {"t": 1214.6666666666667, "x": "知らせるのが防ぐことにもなるのね。"}, {"t": 1216.9666666666667, "x": "そうだ。ここは、犯人を捕まえる話とは別の守り方だ。"}, {"t": 1220.8666666666666, "x": "捕まえられなくても次の1本を飲ませない。"}, {"t": 1223.4666666666667, "x": "1977年の対策は、ほとんどがこの向きを向いている。"}, {"t": 1228.1833333333334, "x": "佐々参事官は数字でも答えている。"}, {"t": 1230.4833333333333, "x": "無差別の事件が、どのくらいの割合なのか。"}, {"t": 1233.2833333333333, "x": "まず全体。殺人事件は未遂を\n含めて、毎年約2,000件。"}, {"t": 1237.3666666666666, "x": "亡くなった人は、毎年約1,100人だった。"}, {"t": 1240.35, "x": "未遂も入れた数なので、\n亡くなった人の数とは一致しない。"}, {"t": 1244.0833333333333, "x": "思ったより多いのね……。"}, {"t": 1245.5, "x": "このうち、犯人と被害者に面識が\n全然ない事件が、およそ12％。"}, {"t": 1250.4833333333333, "x": "残りの9割近くは知り合い同士？"}, {"t": 1252.7666666666667, "x": "そういうことになる。"}, {"t": 1253.8166666666666, "x": "殺人の多くは、身近な人の間で起きている。"}, {"t": 1256.8666666666666, "x": "だから警察は人間関係から当たる。"}, {"t": 1259.2666666666667, "x": "もう一つ、別の数え方もしている。"}, {"t": 1261.7, "x": "1974年の殺人事件などの被害者は948人。"}, {"t": 1266.2166666666667, "x": "そのうち298人、31.4％は\n「全く関係のない方」だった。"}, {"t": 1272.0166666666667, "x": "12％と31.4％、どう違うの？"}, {"t": 1275.55, "x": "12％は、顔を知らないかどうかで数えた割合だ。"}, {"t": 1278.9333333333334, "x": "31.4％は、被害者のほうに犯行の\nきっかけが無いかで数えている。"}, {"t": 1283.8833333333334, "x": "数え方が違うのね。"}, {"t": 1285.4833333333333, "x": "参事官は、二つを分けて説明していた。"}, {"t": 1288.2333333333333, "x": "品川の2人は、参事官の言う\n「全く関係のない方」の側だ。"}, {"t": 1292.85, "x": "狙われるきっかけが何も無い。"}, {"t": 1294.8166666666666, "x": "そうだ。いちばん捜査の手が\n届きにくい側の事件だった。"}, {"t": 1298.8666666666666, "x": "この委員会で、議員はもう一つ大事な質問をしている。"}, {"t": 1302.2833333333333, "x": "犯罪の被害に遭った人への、補償の制度だ。"}, {"t": 1305.3666666666666, "x": "補償ってお金のこと？"}, {"t": 1306.95, "x": "そうだ。犯人が分からなければ、\n誰からも償ってもらえない。"}, {"t": 1310.7333333333333, "x": "議員は、国が補う仕組みが\n要るのではないかと聞いた。"}, {"t": 1313.9166666666667, "x": "法務省の側からは刑事局長が答えた。"}, {"t": 1316.55, "x": "刑事局長は、国の研究所の調べを紹介した。"}, {"t": 1319.85, "x": "人の命や体を傷つけた故意の犯罪の、被害の調べだ。"}, {"t": 1323.85, "x": "どんな結果だったの？"}, {"t": 1325.3333333333333, "x": "まず傷害の事件では、被害者に\n全く落ち度がないものが約64％。"}, {"t": 1330.3333333333333, "x": "6割以上もあるの……。"}, {"t": 1331.7666666666667, "x": "亡くなった事件に絞ると、全く\n落ち度がないものが約40％。"}, {"t": 1336.2333333333333, "x": "亡くなった事件でも4割も……。"}, {"t": 1338.2, "x": "亡くなった被害者のうち、養う家族がいた人が約44％。"}, {"t": 1342.65, "x": "加害者から賠償金を受け取れたのは、\n約21％にとどまった。"}, {"t": 1347.15, "x": "残りの8割近くは、受け取れてないのね。"}, {"t": 1350.0166666666667, "x": "そういう数字だ。"}, {"t": 1351.1, "x": "犯人が捕まらない事件なら、受け取る相手すらいない。"}, {"t": 1354.5333333333333, "x": "傷害の事件だとどうなの？"}, {"t": 1356.3833333333334, "x": "傷害では、養う家族がいた人が約42％。"}, {"t": 1360.0333333333333, "x": "賠償金を受け取れたのは約34％だった。"}, {"t": 1363.2666666666667, "x": "顔見知りでない相手からの被害は、傷害で\n58.6％、亡くなった事件で20.6％。"}, {"t": 1369.9166666666667, "x": "品川の2人の家族も……。"}, {"t": 1371.7666666666667, "x": "そこは記録に無いのでここでは語らない。"}, {"t": 1374.1333333333334, "x": "刑事局長は、制度の必要性は認めていると答えた。"}, {"t": 1377.6833333333334, "x": "外国の法律や実態を調べている最中だ、と。"}, {"t": 1380.9666666666667, "x": "まだ、作ってる途中だったのね。"}, {"t": 1383.2166666666667, "x": "1977年の春の時点ではまだ無かった。"}, {"t": 1387.1833333333334, "x": "補償の質問をした議員は、\n一人の人物の話もしている。"}, {"t": 1391.0, "x": "犯罪の被害者の会で会長を務めた人だ。"}, {"t": 1393.9, "x": "名前はここでは伏せておく。"}, {"t": 1395.6166666666666, "x": "どんな人だったの？"}, {"t": 1397.0333333333333, "x": "前の年にこの委員会で意見を述べた人だ。"}, {"t": 1399.7, "x": "議員によると、そこまでに\n運動を始めて約10年がたっていた。"}, {"t": 1403.6333333333334, "x": "10年も補償を求めてきたのね。"}, {"t": 1405.85, "x": "そして議員はこう続けた。"}, {"t": 1407.5, "x": "「制度の日の目を見るまでもなく、ことしに\n入って亡くなられた」"}, {"t": 1411.1666666666667, "x": "……間に合わなかったのね。"}, {"t": 1412.6333333333334, "x": "議員は「非常に気の毒な事態」と言っている。"}, {"t": 1415.5, "x": "議員は、この問題が関心を集めた始まりにも触れた。"}, {"t": 1418.95, "x": "三菱重工の爆弾事件だ。\nこの事件も前に別の回で扱った。"}, {"t": 1423.4, "x": "あの事件から、補償の話が強くなったのね。"}, {"t": 1426.5333333333333, "x": "その年は、被害者の補償に向けた予算もついたという。"}, {"t": 1429.9, "x": "弁護士の団体も自分たちの案を発表していた。"}, {"t": 1432.9, "x": "議員の党も法案を委員会に出していた。"}, {"t": 1435.4166666666667, "x": "みんなが作ろうとしてたのね。"}, {"t": 1437.3166666666666, "x": "だが4月の時点ではまだ形になっていない。"}, {"t": 1440.0166666666667, "x": "品川の事件は、その議論のまっただ中で起きた。"}, {"t": 1443.8333333333333, "x": "その制度が形になったのは、3年後だ。"}, {"t": 1446.6, "x": "1980年4月23日、参議院の本会議。"}, {"t": 1450.4666666666667, "x": "犯罪被害者等給付金支給法案が、採決にかけられた。"}, {"t": 1454.5, "x": "名前が長いわね。"}, {"t": 1455.8333333333333, "x": "故意の犯罪で亡くなった\n人の遺族などに、一時金を出す法律だ。"}, {"t": 1459.9166666666667, "x": "結果は全会一致での可決だった。"}, {"t": 1462.3, "x": "みんな賛成したのね。"}, {"t": 1463.8666666666666, "x": "ただ、委員長の報告に一つ大事な点がある。"}, {"t": 1466.8666666666666, "x": "施行は1981年1月1日。"}, {"t": 1469.8166666666666, "x": "「同日以後の犯罪行為による被害について適用する」"}, {"t": 1473.2, "x": "それより前の事件には……。"}, {"t": 1474.85, "x": "当たらない、ということだ。"}, {"t": 1476.4, "x": "委員会でも、そこは熱心に\n話し合われたと報告されている。"}, {"t": 1480.0833333333333, "x": "施行を早めることや、さかのぼって当てることだ。"}, {"t": 1483.0833333333333, "x": "でも、変わらなかったのね。"}, {"t": 1484.9166666666667, "x": "原案のまま可決された。"}, {"t": 1486.6166666666666, "x": "そのかわり、附帯決議がつけられた。"}, {"t": 1489.0166666666667, "x": "法律より前の被害者についても、\n別に救済に努めること、などだ。"}, {"t": 1493.5666666666666, "x": "1977年の品川は、線の手前なのね。"}, {"t": 1497.2833333333333, "x": "日付の上ではそうなる。"}, {"t": 1498.7333333333333, "x": "断っておくが、この法律は品川の事件が\nきっかけでできた、とは記録に無い。"}, {"t": 1503.6166666666666, "x": "同じ時代に、同じ問いが国会にあった。"}, {"t": 1506.0833333333333, "x": "並べられるのはそこまでだ。"}, {"t": 1508.4166666666667, "x": "ここで1977年という年を外から見ておく。"}, {"t": 1511.9, "x": "警察白書は、毎年その前の年を振り返る。"}, {"t": 1515.0333333333333, "x": "1977年の振り返りにはこういう並びがある。"}, {"t": 1518.45, "x": "「王選手の756号ホームラン、ニューネッシー騒ぎ等」"}, {"t": 1522.15, "x": "ホームランの記録の年なのね。"}, {"t": 1524.1333333333334, "x": "国民の関心を呼んだ話題として並べられている。"}, {"t": 1527.0833333333333, "x": "そのすぐあとにこう続く。"}, {"t": 1528.6666666666667, "x": "「青酸コーラ殺人事件」"}, {"t": 1530.3333333333333, "x": "そして、日本赤軍による日航機の乗っ取り。"}, {"t": 1533.1, "x": "有珠山の大きな噴火。"}, {"t": 1534.7833333333333, "x": "明るい話と怖い話が、同じ年にあったのね。"}, {"t": 1538.15, "x": "白書は事件の特徴も一言でまとめている。"}, {"t": 1541.0333333333333, "x": "「不特定人をねらったとみられる\n青酸コーラ殺人事件等が発生した」"}, {"t": 1545.4666666666667, "x": "不特定の人、ね。"}, {"t": 1547.1, "x": "その年の見出しは「対象の無差別化が\n目立つ凶悪犯罪」だった。"}, {"t": 1551.5166666666667, "x": "無差別が、その年の特徴になったんだ。"}, {"t": 1554.35, "x": "連続放火や、人質事件や、\n爆破事件も同じ見出しの下に並ぶ。"}, {"t": 1558.9333333333334, "x": "その中で、名前が出ている\n事件の一つが青酸コーラだった。"}, {"t": 1562.8166666666666, "x": "それだけ、みんなの記憶に残ったのね。"}, {"t": 1565.45, "x": "白書は、事件の数そのものの動きも書いている。"}, {"t": 1568.5, "x": "1977年の刑法犯は、前の年より1.7％増えた。"}, {"t": 1573.3166666666666, "x": "増えたのは主に窃盗で、4年続けての増加だった。"}, {"t": 1576.7333333333333, "x": "数で見ると、ほとんどが盗みなのね。"}, {"t": 1579.2333333333333, "x": "1977年の刑法犯の数は、126万8,430件。"}, {"t": 1584.55, "x": "その中の1件が、年を代表する\n事件として名前を残した。"}, {"t": 1589.1166666666666, "x": "次に国会で品川のコーラが語られた\n記録は、1984年の秋に見つかった。"}, {"t": 1594.6333333333334, "x": "別の毒物の事件が、関西で続いていた時期だった。"}, {"t": 1598.2333333333333, "x": "グリコ・森永事件の年ね。"}, {"t": 1600.4333333333334, "x": "そうだ。あの事件は、前に別の回で扱っている。"}, {"t": 1603.6833333333334, "x": "10月23日の参議院の地方行政委員会。"}, {"t": 1606.7666666666667, "x": "警察庁長官が、過去の例をふり返った。"}, {"t": 1609.55, "x": "「日本におきましても五十二年段階におきまして」"}, {"t": 1612.5333333333333, "x": "「品川でコーラにやはり毒物が\n入れられて二人が亡くなる」"}, {"t": 1615.85, "x": "「というふうな事件もございました」"}, {"t": 1617.8833333333334, "x": "7年たっても品川の名前で出てくるのね。"}, {"t": 1620.7, "x": "長官は八重洲口の件にも触れている。"}, {"t": 1623.0, "x": "そしてこう言った。"}, {"t": 1624.1, "x": "「これは犯人が検挙になっておりません」"}, {"t": 1626.4833333333333, "x": "7年たっても捕まってない。"}, {"t": 1628.45, "x": "警察のトップが、国会でそう認めた記録だ。"}, {"t": 1631.4833333333333, "x": "一次資料で「捕まっていない」と言える、\nいちばん遅い記録がこれになる。"}, {"t": 1635.9166666666667, "x": "じゃあ、そのあとはどうなったの？"}, {"t": 1637.8333333333333, "x": "今回の検索では、そのあと国会で\nこの事件を語った記録は見つからなかった。"}, {"t": 1642.7666666666667, "x": "次に動くのは法律の上の時計のほうだ。"}, {"t": 1645.9666666666667, "x": "同じ1984年の委員会では、毒の管理も話に出ている。"}, {"t": 1650.3666666666666, "x": "ある議員が、埼玉県の工場で起きた盗難を挙げた。"}, {"t": 1653.6333333333334, "x": "青酸ソーダの粉末270グラムが入った\n金庫が、丸ごと盗まれたという。"}, {"t": 1658.6666666666667, "x": "金庫ごと持っていかれたの？"}, {"t": 1660.4166666666667, "x": "議員はそう述べている。"}, {"t": 1661.7, "x": "厚生省の担当者は、決まりの中身を説明した。"}, {"t": 1664.95, "x": "メッキや金属の加工で青酸を使う\n業者にも、鍵のかかる設備でしまわせる。"}, {"t": 1669.7, "x": "在庫の量も決まった時期に点検させる。"}, {"t": 1672.3166666666666, "x": "1977年のころより細かくなってる？"}, {"t": 1675.5166666666667, "x": "比べられる記録は、今回そろえていない。"}, {"t": 1678.0333333333333, "x": "ただ、同じ問題が形を変えずに\n残っていたのは確かだ。"}, {"t": 1681.6833333333334, "x": "盗まれたり無くしたりした届けは、\n前の年に青酸ソーダで2件あったという。"}, {"t": 1686.4, "x": "届けが2件だけ？"}, {"t": 1687.8333333333333, "x": "届けが出た数としてそう説明されている。"}, {"t": 1690.4, "x": "届けの出ない分が、どれだけあったかは分からない。"}, {"t": 1693.45, "x": "7年たっても、毒の行き先は追いにくいままなのね。"}, {"t": 1696.8, "x": "1977年に大臣が言った\n「その先」の難しさは続いていた。"}, {"t": 1702.3666666666666, "x": "当時、殺人の罪には時効があった。"}, {"t": 1704.8333333333333, "x": "一定の年数がたつと、起訴できなくなる決まりだ。"}, {"t": 1708.0833333333333, "x": "何年だったの？"}, {"t": 1709.3166666666666, "x": "15年だった。当時はそう決まっていた。"}, {"t": 1711.85, "x": "2004年の参議院の法務委員会で、ある議員が\nこう言っている。"}, {"t": 1715.5166666666667, "x": "「十五年姿を隠しておけば」"}, {"t": 1717.4833333333333, "x": "「殺人を犯しても刑罰を問われない」"}, {"t": 1719.8833333333334, "x": "それを変えようって話？"}, {"t": 1721.4833333333333, "x": "そうだ。その年に、25年へ延ばす\n改正案が審議されていた。"}, {"t": 1725.55, "x": "つまり、それまでの長い間、\n殺人の時効は15年だった。"}, {"t": 1729.5333333333333, "x": "1977年の15年後って……。"}, {"t": 1732.3, "x": "1992年の1月になる。"}, {"t": 1734.8666666666666, "x": "その日までに捕まらなかったらもう裁けないのね。"}, {"t": 1737.9, "x": "そういう決まりだった。"}, {"t": 1739.2166666666667, "x": "15年の間に、瓶は何も語らなかった。"}, {"t": 1742.0833333333333, "x": "同じ瓶が300万本あった、という最初の壁は動かない。"}, {"t": 1745.6833333333334, "x": "毒の出どころも3万か所の先に紛れていた。"}, {"t": 1748.65, "x": "手がかりの入り口が、全部ふさがってる……。"}, {"t": 1751.25, "x": "そして1992年1月、事件は時効を迎えたとされている。"}, {"t": 1755.65, "x": "時効の日付を書いた当時の新聞は、\n今回確かめられなかった。"}, {"t": 1759.6333333333334, "x": "だから、日付と時刻は言わない。"}, {"t": 1761.5833333333333, "x": "年と月までにしておく。"}, {"t": 1763.8833333333334, "x": "時効の決まりは、その後も変わっていく。"}, {"t": 1766.3, "x": "2004年には、25年へ延ばす改正が審議された。"}, {"t": 1769.75, "x": "さらに2010年4月27日、衆議院の本会議で\n別の改正案が可決される。"}, {"t": 1775.15, "x": "死刑のある罪を時効の対象から外すという中身だ。"}, {"t": 1778.3666666666666, "x": "殺人の罪も、ここに入る。"}, {"t": 1780.5, "x": "なくなったなら品川の事件も……。"}, {"t": 1782.65, "x": "そこが分かれ目だ。"}, {"t": 1783.8333333333333, , "x": "今回、国会の会議録を言葉で探してみた。"}, {"t": 1898.9833333333333, "x": "探したのは「青酸コーラ」という言葉だ。"}, {"t": 1901.8833333333334, "x": "何回出てきたの？"}, {"t": 1903.2333333333333, "x": "会議録の全部を通して1回だけだった。"}, {"t": 1905.9333333333334, "x": "全部を通して、たった1回？"}, {"t": 1907.9833333333333, "x": "1977年4月6日の佐々参事官の答弁、その1回だけだ。"}, {"t": 1912.8666666666666, "x": "「毒入りコーラ」で探すと、同じ日の2回が出てくる。"}, {"t": 1916.2, "x": "あとは「品川でコーラ」と\n言った1984年の長官答弁だ。"}, {"t": 1920.8333333333333, "x": "あんなに大きな事件なのに少ないのね。"}, {"t": 1923.3333333333333, "x": "白書は年を代表する事件として名前を挙げている。"}, {"t": 1926.4333333333334, "x": "それでも、国会で名前が\n呼ばれたのは数えるほどだった。"}, {"t": 1929.9, "x": "どうしてなのかしら。"}, {"t": 1931.2666666666667, "x": "理由を書いた記録は無い。だから、ここでは決めない。"}, {"t": 1934.35, "x": "ただ、捕まった事件なら裁判の話で名前が出続ける。"}, {"t": 1937.9833333333333, "x": "捕まらなかった事件は、話を続ける入り口が少ない。"}, {"t": 1941.55, "x": "そういう見方もできる、というところまでにしておく。"}, {"t": 1944.6, "x": "名前が呼ばれなくなっていくのもさみしいわね。"}, {"t": 1947.25, "x": "だから今回は、その数少ない記録を全部読んだ。"}, {"t": 1951.0833333333333, "x": "今回読んだ記録を並べておく。"}, {"t": 1953.0666666666666, "x": "1977年3月3日の衆議院内閣委員会。"}, {"t": 1956.7333333333333, "x": "八重洲地下街の件。"}, {"t": 1958.1166666666666, "x": "4月5日の参議院予算委員会。毒の管理と通達。"}, {"t": 1961.6833333333334, "x": "4月6日の衆議院法務委員会。"}, {"t": 1963.6666666666667, "x": "事件の流れと、補償の質問。"}, {"t": 1966.05, "x": "同じ年の春に、3つの委員会で話が出てたのね。"}, {"t": 1969.5833333333333, "x": "そのあと、1978年に出た警察白書。"}, {"t": 1973.15, "x": "1980年の参議院本会議。"}, {"t": 1975.5666666666666, "x": "給付金の法律の可決。"}, {"t": 1977.4333333333334, "x": "1984年の長官答弁。"}, {"t": 1979.7, "x": "2004年と2010年の時効の審議。"}, {"t": 1982.4, "x": "反対に言わなかったことは？"}, {"t": 1984.25, "x": "亡くなった2人の名前と年齢。"}, {"t": 1986.2166666666667, "x": "電話ボックスが、正確にどこの建物の前だったか。"}, {"t": 1989.6, "x": "ほかの地方で起きたとされる件の、場所や人。"}, {"t": 1992.45, "x": "チョコレートが見つかった日と、その数。"}, {"t": 1994.9666666666667, "x": "どうして言わなかったの？"}, {"t": 1996.5, "x": "一次資料で確かめられなかったからだ。"}, {"t": 1998.9, "x": "本や記事に書いてあっても、\n元の記録までは届かなかった。"}, {"t": 2002.6166666666666, "x": "確かめられないなら言わない。"}, {"t": 2004.4, "x": "犯人が誰かももちろん言わない。"}, {"t": 2006.3333333333333, "x": "記録の中に、それを決める言葉は一つも無かった。"}, {"t": 2010.2333333333333, "x": "ねえ、最初の電話ボックスの話に戻っていい？"}, {"t": 2013.2333333333333, "x": "いいぞ、戻ろう。"}, {"t": 2014.45, "x": "あの学生は、ただ喉が\nかわいてたのかもしれないわよね。"}, {"t": 2017.8333333333333, "x": "かもしれない。仕事を終えた夜の帰り道だ。"}, {"t": 2020.5166666666667, "x": "そこに誰のものとも分からない1本があった。"}, {"t": 2023.2666666666667, "x": "私だったらどうしてたかな。"}, {"t": 2025.2, "x": "それを責める言葉は、記録のどこにも無い。"}, {"t": 2027.7666666666667, "x": "国会の議員も、拾った人を責める\n言い方を先に退けていた。"}, {"t": 2031.85, "x": "わけ知りの言い方、ね。"}, {"t": 2033.5166666666667, "x": "議員の見方では、犯人は誰かが\n手に取ることを計算して置いた。"}, {"t": 2037.45, "x": "300万本のうちの1本を選び、人の通る場所に置いた。"}, {"t": 2041.0833333333333, "x": "そして15年の間、名前も顔も出てこなかった。"}, {"t": 2044.4, "x": "……捕まらないまま、終わっちゃった。"}, {"t": 2046.5166666666667, "x": "裁く扉は閉じた。だが記録は残っている。"}, {"t": 2049.35, "x": "1977年の春、警察は国会で2人を\n「全く関係のない方」と呼んだ。"}, {"t": 2055.3, "x": "関係のない人がたまたま通っただけで。"}, {"t": 2057.883333333333, "x": "だから今でも、道に置かれた飲み物には\n手を出さないように、と言われる。"}, {"t": 2062.016666666667, "x": "その言葉の手前に品川の1本があった。"}, {"t": 2064.6666666666665, "x": "今回はその1本が残した記録を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
