<script>
const D={"name": "135", "file": "135_編集用", "dur": 2089.5, "segs": [], "subs": [{"t": 0.0, "x": "1989年2月10日。東京・築地。"}, {"t": 3.5, "x": "朝日新聞の東京本社に、1通の封筒が届いた。"}, {"t": 6.95, "x": "中身は、ある事件の犯人を名乗る文書だった。"}, {"t": 10.033333333333333, "x": "犯人が新聞社に手紙を？"}, {"t": 11.966666666666667, "x": "そうだ。差出人の名前は「今田勇子」。"}, {"t": 14.783333333333333, "x": "女の人の名前に見える。"}, {"t": 16.6, "x": "その人が犯人だったの？"}, {"t": 18.45, "x": "そこが今回の話の芯だ。"}, {"t": 20.383333333333333, "x": "今田勇子という人は、どこにもいなかった。"}, {"t": 23.05, "x": "名前は作り物で、書いた人は別にいた。"}, {"t": 25.883333333333333, "x": "……じゃあ誰が書いたの。"}, {"t": 27.2, "x": "それが分かるのは、この日から5か月あとだ。"}, {"t": 29.866666666666667, "x": "しかも手がかりは、この手紙ではなかった。"}, {"t": 32.45, "x": "「今田勇子」の文書は、全部で2通ある。"}, {"t": 35.11666666666667, "x": "2月の「犯行声明」と、3月の「告白文」だ。"}, {"t": 39.11666666666667, "x": "2通も出して、それでも分からなかったのね。"}, {"t": 41.93333333333333, "x": "分からなかった。"}, {"t": 43.0, "x": "舞台は埼玉県の西部と東京都だ。"}, {"t": 45.43333333333333, "x": "のちに国の記録で\n「連続幼女誘拐殺人事件」と呼ばれる。"}, {"t": 49.45, "x": "今回は、この2通の手紙と、事件の呼び名を追う。"}, {"t": 52.65, "x": "国会と警察白書と判決が、どう呼んだかを順に見る。"}, {"t": 56.416666666666664, "x": "呼び名？"}, {"t": 57.53333333333333, "x": "始めは名前すら無かった。それが変わっていく。"}, {"t": 60.416666666666664, "x": "先に一つだけ言っておく。"}, {"t": 62.13333333333333, "x": "被害に遭った子どもたちの名前と様子は話さない。"}, {"t": 65.71666666666667, "x": "手紙の半年前に戻る。"}, {"t": 67.46666666666667, "x": "1988年8月22日。埼玉県入間市。"}, {"t": 71.58333333333333, "x": "4歳の女の子の行方が分からなくなった。"}, {"t": 74.35, "x": "4歳……。"}, {"t": 75.48333333333333, "x": "のちに裁判で、これが1件目の事件とされる。"}, {"t": 78.38333333333334, "x": "ただ、この時点では事件か事故かも分からない。"}, {"t": 81.18333333333334, "x": "連れ去られたのか、どこかで迷ったのか。"}, {"t": 83.76666666666667, "x": "手がかりは無かったの？"}, {"t": 85.26666666666667, "x": "犯人につながるものは、まだ無かった。"}, {"t": 87.71666666666667, "x": "そして、この子は帰ってこなかった。"}, {"t": 89.96666666666667, "x": "ここで一つ、最高裁の判決の言い方を出しておく。"}, {"t": 93.38333333333334, "x": "判決は、この一連の事件をこうまとめている。"}, {"t": 96.28333333333333, "x": "「昭和63年8月から平成元年7月にかけて」。"}, {"t": 100.05, "x": "「埼玉県内及び東京都内において」。"}, {"t": 102.45, "x": "「当時4歳から7歳のいたいけない\n女児5名を次々と誘拐し」。"}, {"t": 106.43333333333334, "x": "5人？"}, {"t": 107.55, "x": "連れ去られたのは5人だ。"}, {"t": 109.1, "x": "そのうち4人が、その日のうちに命を奪われた。"}, {"t": 112.1, "x": "入間市の女の子は、その1人目になる。"}, {"t": 114.83333333333333, "x": "その日のうちになのね。"}, {"t": 116.4, "x": "判決にそう書かれている。"}, {"t": 118.03333333333333, "x": "だが1988年の夏には、まだ誰もそれを知らない。"}, {"t": 122.0, "x": "行方が分からない、というところで止まっていた。"}, {"t": 125.3, "x": "2か月後の1988年10月3日。"}, {"t": 128.46666666666667, "x": "今度は隣の飯能市で、\n7歳の女の子の行方が分からなくなった。"}, {"t": 132.86666666666667, "x": "また？"}, {"t": 134.0, "x": "小学1年生だった。"}, {"t": 135.61666666666667, "x": "さらに2か月後の12月9日。"}, {"t": 137.76666666666668, "x": "川越市で4歳の女の子。"}, {"t": 139.8, "x": "2か月ごとに……。"}, {"t": 141.0, "x": "のちに国会で、ある議員がこの並びを口にしている。"}, {"t": 144.18333333333334, "x": "「埼玉県の西部の方では、幼児誘拐殺人、\n失跡事件が二カ月ごとの偶数月に三件発生し」。"}, {"t": 150.75, "x": "偶数月。8月10月、12月ね。"}, {"t": 153.75, "x": "そうだ。"}, {"t": 154.88333333333333, "x": "三つの場所は、どれも入間川の流れに近い町だった。"}, {"t": 158.31666666666666, "x": "入間市飯能市、川越市。"}, {"t": 160.26666666666668, "x": "近いなら同じ人だと思うわよね。"}, {"t": 162.56666666666666, "x": "思う人は多かった。"}, {"t": 163.91666666666666, "x": "だが思うことと、確かめることは別だ。"}, {"t": 166.48333333333332, "x": "事件はそれぞれの町で、別々に捜査されていた。"}, {"t": 169.76666666666668, "x": "つながっているって言えなかったの？"}, {"t": 171.78333333333333, "x": "言える材料がまだ無かった。"}, {"t": 173.41666666666666, "x": "この「言える材料が無い」は、\n半年後の国会でもう一度出てくる。"}, {"t": 177.55, "x": "12月の川越市の女の子は、6日後に見つかった。"}, {"t": 180.98333333333332, "x": "家から遠く離れた山の中だった。"}, {"t": 183.21666666666667, "x": "ここから先、見つかった時の様子は話さない。"}, {"t": 186.18333333333334, "x": "代わりに、この件が国の記録にどう載ったかを見る。"}, {"t": 189.85, "x": "警察庁は毎年、警察白書という報告を出している。"}, {"t": 193.46666666666667, "x": "前の年に何が起きたかを、まとめて書く本だ。"}, {"t": 196.58333333333334, "x": "1988年の分はいつ出たの？"}, {"t": 199.38333333333333, "x": "1989年に出た平成元年版だ。"}, {"t": 202.51666666666668, "x": "その犯罪の章に、川越市の件が\n「事例」として載っている。"}, {"t": 206.58333333333334, "x": "事例？"}, {"t": 207.71666666666667, "x": "例として挙げられた一件だ。"}, {"t": 209.46666666666667, "x": "書き方はこうだ。"}, {"t": 210.63333333333333, "x": "「12月9日午後4時30分ころ、\n埼玉県川越市に住む幼女（4）が」。"}, {"t": 215.81666666666666, "x": "「行方不明となっていたが、12月15日に自宅から\n50キロ離れた山中において」見つかった。"}, {"t": 221.98333333333332, "x": "そして最後の一語が「捜査中」。"}, {"t": 224.31666666666666, "x": "捜査中だけ？"}, {"t": 225.5, "x": "それだけだ。事件の名前も、犯人の姿も無い。"}, {"t": 228.83333333333334, "x": "ほかの2件とのつながりも書かれていない。"}, {"t": 231.21666666666667, "x": "載っている場所は、幼い子や小学生が\n狙われた事件の数を並べた表のすぐ下だ。"}, {"t": 236.31666666666666, "x": "数字の一つとして、そっと置かれている。"}, {"t": 238.98333333333332, "x": "まだ分からなかったからね。"}, {"t": 240.71666666666667, "x": "そうだ。白書は分かったことしか書かない。"}, {"t": 243.28333333333333, "x": "これが、この事件の一つ目の呼ばれ方になる。"}, {"t": 246.16666666666666, "x": "名前の無いただの「事例2」だ。"}, {"t": 248.43333333333334, "x": "……なんだか寂しい書き方ね。"}, {"t": 250.26666666666668, "x": "記録というのはそういうものだ。"}, {"t": 252.03333333333333, "x": "ところが翌年の白書では、書き方がまるで変わる。"}, {"t": 255.23333333333332, "x": "それは後で並べて見せる。"}, {"t": 256.8333333333333, "x": "その前に、記録の外で起きていたことを話す。"}, {"t": 259.78333333333336, "x": "1988年の暮れに、ある家に1枚の葉書が届いた。"}, {"t": 264.56666666666666, "x": "川越市の女の子が見つかった数日あとだ。"}, {"t": 267.35, "x": "その子の家に葉書が届いた。"}, {"t": 269.3666666666667, "x": "誰から？"}, {"t": 270.5, "x": "差出人の名前は無かった。"}, {"t": 272.4166666666667, "x": "裁判の記録を引いた論文によると、\n短い言葉が並んでいたという。"}, {"t": 276.6666666666667, "x": "どんな言葉？"}, {"t": 277.8, "x": "ここでは読まない。"}, {"t": 278.8666666666667, "x": "ご家族をさらに傷つける中身だったからだ。"}, {"t": 281.7, "x": "……そう。"}, {"t": 282.8333333333333, "x": "この葉書は、のちに裁判で\n男の行為の一つとして挙げられた。"}, {"t": 286.78333333333336, "x": "検察官は冒頭陳述でこう並べている。"}, {"t": 289.43333333333334, "x": "葉書、犯行声明、告白文、段ボール箱の送付。"}, {"t": 293.2, "x": "全部男が出したものなのね。"}, {"t": 295.25, "x": "裁判ではそう扱われた。"}, {"t": 296.9166666666667, "x": "ここで覚えておいてほしいのは、\n葉書には名前が無かったことだ。"}, {"t": 300.6333333333333, "x": "名前が付くのは、この次からになる。"}, {"t": 303.06666666666666, "x": "「今田勇子」ね。"}, {"t": 304.4, "x": "そうだ。名乗らない葉書から、名乗る手紙へ。"}, {"t": 307.23333333333335, "x": "送り手のやり方が、少しずつ変わっていく。"}, {"t": 310.0833333333333, "x": "変わったのはなぜ？"}, {"t": 311.35, "x": "それは記録からは言えない。"}, {"t": 312.9, "x": "言えるのは、何がいつ届いたかだけだ。"}, {"t": 315.26666666666665, "x": "年が明けて1989年。"}, {"t": 317.43333333333334, "x": "昭和が終わり、平成になった。"}, {"t": 319.46666666666664, "x": "その2月の初めに、もっと大きな出来事が起きる。"}, {"t": 322.6166666666667, "x": "入間市の、1人目の女の子の家の前だ。"}, {"t": 325.96666666666664, "x": "1989年2月6日。"}, {"t": 328.3666666666667, "x": "入間市の女の子の家の玄関前に、\n段ボール箱が置かれていた。"}, {"t": 332.35, "x": "誰が置いたの？"}, {"t": 333.46666666666664, "x": "その時は分からない。"}, {"t": 334.8, "x": "箱の中身はここでは話さない。"}, {"t": 336.81666666666666, "x": "女の子のご家族にとって、言葉にできないものだった。"}, {"t": 340.31666666666666, "x": "……うん。"}, {"t": 341.45, "x": "捜査本部は中身を調べた。"}, {"t": 343.31666666666666, "x": "3月1日に、それが女の子のものだと発表している。"}, {"t": 347.1, "x": "じゃあもう……。"}, {"t": 348.23333333333335, "x": "そうだ。行方が分からない、ではなくなった。"}, {"t": 351.05, "x": "箱から、置いた人のことは分かったの？"}, {"t": 353.6166666666667, "x": "中身が誰のものかは分かった。"}, {"t": 355.51666666666665, "x": "だが、誰が置いたかまでは、\nそこからはたどれなかった。"}, {"t": 358.8, "x": "この箱は事件の性格を変えた。"}, {"t": 360.9, "x": "それまでは「行方不明の子が3人」という\n出来事だった。"}, {"t": 364.4, "x": "ここからは、誰かがわざと家族に\n物を届けてくる事件になる。"}, {"t": 368.31666666666666, "x": "わざと？"}, {"t": 369.45, "x": "玄関の前に置く、ということは、\n家を知っているということだ。"}, {"t": 373.1666666666667, "x": "怖い……。"}, {"t": 374.3, "x": "周りの家もそう感じただろう。"}, {"t": 376.1166666666667, "x": "そして箱が置かれて4日後。"}, {"t": 377.93333333333334, "x": "最初に話した築地の封筒が届く。"}, {"t": 380.5, "x": "つながったわね。"}, {"t": 381.68333333333334, "x": "つながる。封筒の書き出しは、この箱のことだった。"}, {"t": 384.98333333333335, "x": "箱を置いたのは自分だ、という書き出しだ。"}, {"t": 387.46666666666664, "x": "ここで初めて、送り手が名前を名乗る。"}, {"t": 389.95, "x": "「今田勇子」。2通のうちの1通目だ。"}, {"t": 392.95, "x": "1通目は2月10日、\n朝日新聞の東京本社に郵送で届いた。"}, {"t": 397.15, "x": "裁判の記録を引いた論文は、\nこれを「犯行声明」と呼んでいる。"}, {"t": 401.35, "x": "中身は？"}, {"t": 402.48333333333335, "x": "書き出しは、玄関前の箱を置いたのは\n自分だ、というものだった。"}, {"t": 406.4166666666667, "x": "その先は遺骨に触れる文が\n多いので、この回では読まない。"}, {"t": 410.0, "x": "字は手書き？"}, {"t": 411.1333333333333, "x": "手書きだ。"}, {"t": 412.25, "x": "報道によると、極端に角張った字だった。"}, {"t": 415.03333333333336, "x": "利き手と反対の手で書いたようにも見える字だ。"}, {"t": 417.8333333333333, "x": "自分の字を隠すため？"}, {"t": 419.45, "x": "そう見る人が多かった。"}, {"t": 420.81666666666666, "x": "筆跡の鑑定も行われている。"}, {"t": 422.95, "x": "そして署名が「今田勇子」。"}, {"t": 424.98333333333335, "x": "女の人の名前よね。"}, {"t": 426.65, "x": "女性の名前だ。"}, {"t": 427.78333333333336, "x": "住所の欄には、埼玉県の所沢市と\n書かれていたとも報じられた。"}, {"t": 432.1666666666667, "x": "所沢って入間市のすぐ隣じゃない。"}, {"t": 434.5833333333333, "x": "近い。だからこそ、読む人は本物らしく感じた。"}, {"t": 437.95, "x": "ここが手紙というものの強さだ。"}, {"t": 439.96666666666664, "x": "書いた人の顔は見えない。"}, {"t": 441.3833333333333, "x": "名前と字だけが届く。"}, {"t": 443.0833333333333, "x": "名前が本物かどうか、確かめようがないのね。"}, {"t": 446.0833333333333, "x": "確かめようがない。"}, {"t": 447.23333333333335, "x": "だが新聞社に届いた以上、報じるか\nどうかを決めなければならない。"}, {"t": 451.1166666666667, "x": "そして1か月後2通目が届く。"}, {"t": 453.8666666666667, "x": "2通目は3月11日に届いた。"}, {"t": 456.3666666666667, "x": "また新聞社？"}, {"t": 457.55, "x": "新聞社ともう一か所だ。"}, {"t": 459.18333333333334, "x": "被害に遭った子の家にも、同じ日に届いている。"}, {"t": 462.2, "x": "家族のところにも……。"}, {"t": 463.6, "x": "こちらは「告白文」と呼ばれる。"}, {"t": 465.8, "x": "その中に、論文が拾っている一行がある。"}, {"t": 468.5833333333333, "x": "「私はあなた方の身近に居ます」。"}, {"t": 470.81666666666666, "x": "身近に？"}, {"t": 471.95, "x": "そうだ。読む人にとって一番いやな言葉だ。"}, {"t": 474.93333333333334, "x": "本当に近くにいたの？"}, {"t": 476.56666666666666, "x": "それは後で分かる。ここではまだ言わない。"}, {"t": 478.8833333333333, "x": "この「告白文」は、文の中でも\n書き手を女性として描いていた。"}, {"t": 483.1, "x": "報道によると、子どもを産めない\n女性の気持ちを語る形だったという。"}, {"t": 487.28333333333336, "x": "じゃあ警察は女の人を探したの？"}, {"t": 489.65, "x": "報道ではそう伝えられている。"}, {"t": 491.4166666666667, "x": "埼玉県警は、女性による\n犯行という見方に傾いたとされる。"}, {"t": 495.56666666666666, "x": "手紙が捜査の向きを変えたのね。"}, {"t": 497.6666666666667, "x": "変えたと言われている。"}, {"t": 498.9, "x": "ただこれは報道の言い方だ。"}, {"t": 500.6166666666667, "x": "警察が公式に「女性を探した」と\n言った記録は見つけられなかった。"}, {"t": 505.03333333333336, "x": "だから「そう報じられた」までにしておく。"}, {"t": 507.76666666666665, "x": "分かった。"}, {"t": 508.9, "x": "手紙は2通。名前は1つ。"}, {"t": 510.8833333333333, "x": "その名前の人は、この世のどこにもいなかった。"}, {"t": 514.4166666666666, "x": "ねえ、どうして実在しない名前を使ったの？"}, {"t": 517.25, "x": "本人の気持ちは、記録からは言えない。"}, {"t": 519.6333333333333, "x": "名前の由来もいくつか説がある。"}, {"t": 521.6333333333333, "x": "だがどれも裏付けが無いので、\nこの回では取り上げない。"}, {"t": 524.8, "x": "じゃあ言えることは？"}, {"t": 525.9666666666667, "x": "言えるのは、名前が人の目をどこへ向けたかだ。"}, {"t": 528.75, "x": "女性の名前。近くの町の住所。"}, {"t": 531.0666666666667, "x": "そして「身近に居ます」。"}, {"t": 532.85, "x": "全部、本当の書き手から目をそらす方へ働くのね。"}, {"t": 536.3, "x": "結果としてはそうなった。"}, {"t": 537.9, "x": "本当に書いたのは、東京都の五日市町に\n住む20代の男だった。"}, {"t": 542.3666666666667, "x": "五日市町ってどこ？"}, {"t": 543.9333333333333, "x": "東京都の西のはずれ、いまのあきる野市だ。"}, {"t": 546.6166666666667, "x": "埼玉の現場から車で行き来できる距離にある。"}, {"t": 549.4333333333333, "x": "手紙に書かれた所沢市とは、別の都と県になる。"}, {"t": 552.8833333333333, "x": "女の人でも、所沢の人でもなかったのね。"}, {"t": 556.0833333333334, "x": "そうだ。男の名前は宮崎勤。"}, {"t": 558.5, "x": "家業の印刷の仕事を\n手伝っていたと、論文は書いている。"}, {"t": 562.2, "x": "その人がどうして見つかったの？"}, {"t": 564.2833333333333, "x": "そこが今回のもう一つの柱だ。"}, {"t": 566.5333333333333, "x": "先に答えだけ言うと、手紙からではない。"}, {"t": 569.0833333333334, "x": "筆跡からでも、所沢の住所からでもない。"}, {"t": 572.0833333333334, "x": "じゃあ何から？"}, {"t": 573.2166666666667, "x": "別の場所で起きた、別の出来事からだ。"}, {"t": 575.8333333333334, "x": "その話の前に、1989年の6月を通る。"}, {"t": 579.6833333333333, "x": "4人目の女の子が連れ去られた月だ。"}, {"t": 582.7166666666667, "x": "1989年6月6日。東京都江東区。"}, {"t": 586.35, "x": "5歳の女の子の行方が分からなくなった。"}, {"t": 589.0333333333333, "x": "今度は東京なのね。"}, {"t": 590.55, "x": "埼玉の3件から、川を越えて都内に移った。"}, {"t": 593.6166666666667, "x": "そして6月11日、女の子は\n埼玉県の飯能市で見つかった。"}, {"t": 598.0, "x": "翌日の12日、捜査本部はその子だと断定した。"}, {"t": 601.6, "x": "東京で連れ去られて埼玉で……。"}, {"t": 603.6166666666667, "x": "そうだ。二つの都と県にまたがった。"}, {"t": 606.0333333333333, "x": "様子は話さない。"}, {"t": 607.2166666666667, "x": "ただ、この件で世の中の空気ははっきり変わった。"}, {"t": 610.3666666666667, "x": "どう変わったの？"}, {"t": 611.4666666666667, "x": "国会が、続けてこの話を取り上げ始める。"}, {"t": 614.3833333333333, "x": "断定の翌日、6月13日の参議院の予算委員会。"}, {"t": 618.25, "x": "ある議員が、閣僚の席に向かってこう聞いた。"}, {"t": 621.0166666666667, "x": "子どもや孫を持つ人にとっては、\n身の毛のよだつ話だ、と。"}, {"t": 624.7666666666667, "x": "「今やお子さんたちが遊ぶ場所もない」。"}, {"t": 627.0, "x": "遊ぶ場所もないか。"}, {"t": 628.3833333333333, "x": "外で遊ばせられない、という親の声だ。"}, {"t": 630.8166666666667, "x": "答えたのは国家公安委員長だった。"}, {"t": 633.1, "x": "「警察庁が中心になって、警視庁と\n埼玉県警が全力を挙げて」。"}, {"t": 637.45, "x": "「早く犯人を検挙しよう」。"}, {"t": 639.2333333333333, "x": "警視庁と埼玉県警が一緒に、ってことね。"}, {"t": 642.2166666666667, "x": "そうだ。東京の事件は警視庁、\n埼玉の事件は埼玉県警。"}, {"t": 646.3166666666667, "x": "持ち場の違う二つの警察が、\n同じ相手を追うことになった。"}, {"t": 650.0333333333333, "x": "翌日の委員会では、さらに踏み込んだ数字が出る。"}, {"t": 653.8, "x": "6月14日、衆議院の地方行政委員会。"}, {"t": 656.85, "x": "ある議員が、4件をまとめて取り上げた。"}, {"t": 659.3333333333334, "x": "「類似の地域から誘拐されておるということ、\n手口も何か同じようなやり方」。"}, {"t": 663.8833333333333, "x": "「何か同一の犯人ではなかろうか、巷間では\n大変これに対してのうわさやら、あるいは憤りやら」。"}, {"t": 669.8666666666667, "x": "みんな同じ人だと思ってたのね。"}, {"t": 672.0666666666667, "x": "議員も町の人もそう感じていた。"}, {"t": 674.25, "x": "最初に答えたのは担当の大臣だ。"}, {"t": 676.5833333333334, "x": "「総理からもきのう私のところに\n昼ごろ電話がありまして」。"}, {"t": 680.0666666666667, "x": "総理から電話？"}, {"t": 681.25, "x": "「警察を総動員してぜひこの問題を早急に\n解決すべきだという指示を受けた」。"}, {"t": 686.0833333333334, "x": "総理まで動いたのね。"}, {"t": 687.6, "x": "それほどの事件になっていた。"}, {"t": 689.3833333333333, "x": "5日後の6月19日、参議院の本会議でも\n同じ大臣が答えている。"}, {"t": 693.9666666666667, "x": "「特に昨年来から連続発生している\n幼女誘拐殺人事件については」。"}, {"t": 698.4166666666666, "x": "「警察庁長官を現地に派遣するなど\n捜査を督励するとともに」。"}, {"t": 702.3833333333333, "x": "「私自身も本日現地に\n督励に参る所存でございます」。"}, {"t": 706.1166666666667, "x": "大臣が自分で現地に行くの？"}, {"t": 708.1333333333333, "x": "その日に行くと、本会議で言っている。"}, {"t": 710.4333333333333, "x": "ここで呼び名に注目してほしい。"}, {"t": 712.3666666666667, "x": "6月の国会では「幼女誘拐殺人事件」や\n「一連の幼児対象誘拐事件」と呼ばれている。"}, {"t": 718.6666666666666, "x": "まだ「連続」が付いてないのね。"}, {"t": 720.9666666666667, "x": "付いていない言い方が多い。"}, {"t": 722.4666666666667, "x": "同じ犯人だと、まだ公には言えなかったからだ。"}, {"t": 725.6166666666667, "x": "その「言えない」を、はっきり口にした人がいる。"}, {"t": 728.7, "x": "同じ14日に答えた、警察庁の刑事局長だ。"}, {"t": 732.7, "x": "刑事局長はまず、捜査の規模を答えた。"}, {"t": 735.3666666666667, "x": "江東区の件は、警視庁と埼玉県警が\n特別捜査本部を置いた。"}, {"t": 739.6333333333333, "x": "「合わせまして約七百人近い体制で懸命な捜査を」。"}, {"t": 743.15, "x": "七百人。"}, {"t": 744.2833333333333, "x": "そして、埼玉の3件とのつながりについてだ。"}, {"t": 747.3333333333334, "x": "「被害の対象者が\n同じぐらいの年ごろの子供さんであるということ」。"}, {"t": 751.15, "x": "「関連地域が埼玉県の西部に集中しておる」。"}, {"t": 754.1, "x": "「連れ去られたと思われます場所が\n小学校でございますとかあるいは保育園」の近く。"}, {"t": 758.95, "x": "共通点はたくさんあるのね。"}, {"t": 760.85, "x": "そうだ。だから「同一犯人の\n犯行ではないかという見方がある」と言った。"}, {"t": 765.4166666666666, "x": "その次の一文が、この回で一番大事な一文だ。"}, {"t": 768.7833333333333, "x": "「一方におきまして、これらの犯人が\n同一であるということを断定するだけの具体的な資料は"}, {"t": 773.35, "x": "現在まだ入手しておらない」。"}, {"t": 775.7833333333333, "x": "手紙が2通もあるのに？"}, {"t": 777.4, "x": "手紙はあった。箱もあった。葉書もあった。"}, {"t": 780.2333333333333, "x": "それでも「断定するだけの資料」にはならなかった。"}, {"t": 783.55, "x": "どうして？"}, {"t": 784.6833333333333, "x": "手紙が語るのは、書き手が名乗った姿だけだからだ。"}, {"t": 788.0666666666667, "x": "名前は作り物。字は隠してある。"}, {"t": 790.2166666666667, "x": "住所も本当かどうか分からない。"}, {"t": 792.25, "x": "本当の書き手にたどり着く\n線が、そこからは引けなかった。"}, {"t": 795.9666666666667, "x": "……手紙って、何も教えてくれなかったのね。"}, {"t": 798.7333333333333, "x": "教えてくれたのは、書き手が見せたいものだけだった。"}, {"t": 801.7666666666667, "x": "この答弁は1989年6月14日。"}, {"t": 805.1, "x": "ここから、男が取り押さえられるまで、あと39日だ。"}, {"t": 808.8, "x": "39日。"}, {"t": 809.95, "x": "そしてその日、場所は八王子だった。"}, {"t": 813.0, "x": "6月の国会では、警察の委員会の外でも\nこの事件が語られた。"}, {"t": 817.35, "x": "6月20日参議院の文教委員会。"}, {"t": 819.7333333333333, "x": "教育を話し合う場で、ある議員がこう並べた。"}, {"t": 822.5166666666667, "x": "「昨今連続して未解決の幼女の\n誘拐あるいは行方不明事件あるいは殺害事件等々」。"}, {"t": 827.9333333333333, "x": "未解決ってはっきり言ってるのね。"}, {"t": 830.0833333333334, "x": "この日、まだ犯人は分かっていない。"}, {"t": 832.2833333333333, "x": "議員は、子どもの事件を聞く\nたびに胸が痛むと続けている。"}, {"t": 835.8666666666667, "x": "翌21日、参議院の地方行政委員会。"}, {"t": 838.8833333333333, "x": "別の議員が、警察にこう語りかけた。"}, {"t": 841.5166666666667, "x": "「最近では、非常に気になってみんなが\n泣いたあの幼女の誘拐事件」。"}, {"t": 845.5666666666667, "x": "みんなが泣いた……。"}, {"t": 846.6833333333333, "x": "会議録の言葉としては珍しい言い方だ。"}, {"t": 849.3166666666667, "x": "その議員はこう続ける。"}, {"t": 850.8, "x": "「幼女の誘拐事件はこれは起きなきゃ\nわからぬからなんですけれども」。"}, {"t": 854.6, "x": "起きるまでは分からないか。"}, {"t": 856.2333333333333, "x": "前もって防ぐのが難しい、という意味だ。"}, {"t": 858.7833333333333, "x": "ここで6月の国会を振り返る。"}, {"t": 860.8833333333333, "x": "予算委員会、地方行政委員会、本会議、文教委員会。"}, {"t": 864.7333333333333, "x": "1週間あまりで、少なくとも四つの場で語られている。"}, {"t": 868.2833333333333, "x": "それだけみんなが心配してたのね。"}, {"t": 870.55, "x": "そうだ。"}, {"t": 871.6833333333333, "x": "だがどの場でも、この事件には\nまだ決まった名前が無い。"}, {"t": 874.9, "x": "「あの幼女の誘拐事件」。"}, {"t": 876.2333333333333, "x": "「幼女誘拐殺人事件」。"}, {"t": 877.95, "x": "呼ぶ人ごとに、少しずつ言い方が違っていた。"}, {"t": 881.0666666666667, "x": "犯人が分からないと、名前も決まらないのね。"}, {"t": 884.0, "x": "そういうことだ。その状態が、7月23日まで続く。"}, {"t": 888.55, "x": "1989年7月23日。"}, {"t": 891.3333333333334, "x": "日曜日。東京都八王子市。"}, {"t": 893.4166666666666, "x": "ここで一人の男が、現行犯で逮捕された。"}, {"t": 896.5333333333333, "x": "誘拐の事件で？"}, {"t": 897.8333333333334, "x": "違う。強制わいせつの疑いだ。"}, {"t": 899.9833333333333, "x": "論文によると、6歳の女の子の服を\n脱がせて写真を撮ろうとした。"}, {"t": 904.3, "x": "……また小さい子。"}, {"t": 905.45, "x": "その場を、女の子の父親が見つけた。"}, {"t": 907.9666666666667, "x": "父親が男を取り押さえた。"}, {"t": 909.8833333333333, "x": "お父さんが？"}, {"t": 911.0, "x": "そうだ。警察が張り込んでいて捕まえたのではない。"}, {"t": 914.0333333333333, "x": "その場にいた父親が、まず男を押さえた。"}, {"t": 916.65, "x": "これが5件目にあたる出来事だ。"}, {"t": 918.7333333333333, "x": "最高裁が言ってた「5名」の、5人目ね。"}, {"t": 921.7833333333333, "x": "そうだ。判決は「残る1名の被害者には\nわいせつ行為をした」と書いている。"}, {"t": 926.5666666666667, "x": "この子は命を奪われていない。"}, {"t": 928.4666666666667, "x": "よかった……とは言えないけど。"}, {"t": 930.3166666666667, "x": "言えない。だが帰ってこられた。"}, {"t": 932.1666666666666, "x": "このとき取り押さえられた男が、宮崎勤だった。"}, {"t": 935.5833333333334, "x": "じゃあ、ここで今田勇子の正体が分かったの？"}, {"t": 938.35, "x": "この日はまだだ。"}, {"t": 939.4166666666666, "x": "逮捕されたのは、あくまで八王子の件だけだった。"}, {"t": 942.5333333333333, "x": "埼玉と江東区の4件と結びつくのは、もう少し先だ。"}, {"t": 946.3333333333334, "x": "最初の封筒が届いてから、5か月と13日。"}, {"t": 949.5166666666667, "x": "手紙が名乗った名前ではなく、\n別の現場から男は出てきた。"}, {"t": 953.9166666666666, "x": "この捕まり方は、のちの国会でも取り上げられた。"}, {"t": 957.0833333333334, "x": "1990年6月25日、参議院の地方行政委員会。"}, {"t": 961.4166666666666, "x": "ある議員が、警察庁長官にこう言っている。"}, {"t": 964.1333333333333, "x": "「これも捕まえたのはどっちかと\nいえば子供のおやじさんですわね」。"}, {"t": 967.75, "x": "おやじさんね。"}, {"t": 968.8666666666667, "x": "議員はさらに続けた。"}, {"t": 970.3166666666667, "x": "「どうしてもっと早く犠牲者を少なくして\n逮捕できなかったのだろうかという思いがする」。"}, {"t": 975.2166666666667, "x": "厳しい言い方ね。"}, {"t": 976.4833333333333, "x": "議員の言葉だ。この回は、ここで\n警察を責める側には立たない。"}, {"t": 980.4333333333333, "x": "代わりに長官の答えを聞いておく。"}, {"t": 982.4833333333333, "x": "長官は、捕まえにくくなった理由を二つ挙げた。"}, {"t": 985.5333333333333, "x": "一つ目は物だ。"}, {"t": 986.7333333333333, "x": "「大量生産、大量流通の\nこの物からの犯人への到達というのは\n非常に時間がかかります」。"}, {"t": 992.45, "x": "物から犯人を探すのが難しい？"}, {"t": 994.8, "x": "同じ品物が何万個も売られている\n時代だ、ということだ。"}, {"t": 998.3333333333334, "x": "二つ目は情報だ。"}, {"t": 999.6666666666666, "x": "「いろいろな情報が警察の方に寄せられます。\nこれを一つ一つその真偽を解明していく」。"}, {"t": 1005.0666666666667, "x": "「人手と時間がかかっております」。"}, {"t": 1007.2, "x": "手紙もその情報の一つよね。"}, {"t": 1009.35, "x": "そう考えると分かりやすい。"}, {"t": 1011.0, "x": "2通の手紙は、確かめるべき情報を増やした。"}, {"t": 1013.9333333333333, "x": "だが本当の書き手には近づけなかった。"}, {"t": 1016.4333333333333, "x": "最後に男を押さえたのは、\n一人の父親の目と手だった。"}, {"t": 1020.0333333333333, "x": "記録に残る「おやじさん」なのね。"}, {"t": 1022.4333333333333, "x": "そうだ。名前は記録に無い。この回でも出さない。"}, {"t": 1026.0666666666666, "x": "逮捕のあとの流れを、日付で並べる。"}, {"t": 1028.5, "x": "8月7日。男は八王子の件で起訴された。"}, {"t": 1031.8833333333334, "x": "まず5件目からなのね。"}, {"t": 1033.5, "x": "そうだ。順番は事件の起きた順ではない。"}, {"t": 1036.0666666666666, "x": "取り調べの中で、男は江東区の件を話し始めた。"}, {"t": 1039.6166666666666, "x": "8月11日。江東区の件で、改めて逮捕される。"}, {"t": 1043.4666666666667, "x": "ここで4件とつながったの？"}, {"t": 1045.35, "x": "つながり始めた。"}, {"t": 1046.5666666666666, "x": "翌年の警察白書は、この日を\n「元年8月11日検挙」と書いている。"}, {"t": 1051.85, "x": "7月23日じゃないのね。"}, {"t": 1054.0, "x": "白書にとっての検挙は、4件の事件の検挙だからだ。"}, {"t": 1057.5833333333333, "x": "八王子の日は、別の事件の日として扱われている。"}, {"t": 1060.95, "x": "そのあと、男の話にそって、\n残る子たちが見つかっていく。"}, {"t": 1064.8666666666666, "x": "9月6日の衆議院の法務委員会で、ある議員が\nこう話した。"}, {"t": 1068.6333333333334, "x": "「本日の昼のニュースによりますと、\n本人の供述に基づきまして」。"}, {"t": 1072.8166666666666, "x": "4人目の子と思われる子が見つかった、と。"}, {"t": 1075.5166666666667, "x": "その日のうちに国会で……。"}, {"t": 1077.2, "x": "答えた法務大臣はこう言った。"}, {"t": 1079.1333333333334, "x": "「本当に胸の痛い思いが私もいたしております」。"}, {"t": 1082.1333333333334, "x": "そして「目下捜査中でございますので」と、\nそれ以上は控えた。"}, {"t": 1086.3166666666666, "x": "まだ捜査中なのね。"}, {"t": 1087.8166666666666, "x": "8月24日には、検察の依頼で\n医師が簡単な精神の診断をした。"}, {"t": 1092.4833333333333, "x": "論文によると、病気の疑いは\n否定できないが、今の所見では\n人格の障害にとどまる、という結果だった。"}, {"t": 1099.1833333333334, "x": "それで裁判に進んだのね。"}, {"t": 1101.0833333333333, "x": "そうだ。起訴は、9月2日に江東区の件。"}, {"t": 1103.9833333333333, "x": "9月29日に入間市の件。"}, {"t": 1105.85, "x": "10月19日に飯能市と川越市の件。"}, {"t": 1108.7166666666667, "x": "5件全部起訴されたのね。"}, {"t": 1110.5666666666666, "x": "そうだ。秋の終わりに、5件がそろった。"}, {"t": 1113.75, "x": "この間に、事件にもう一つの名前が付いた。"}, {"t": 1116.6833333333334, "x": "番号だ。"}, {"t": 1117.8166666666666, "x": "番号？"}, {"t": 1118.95, "x": "警察庁の「指定第117号事件」。"}, {"t": 1121.7, "x": "いくつもの都道府県にまたがる\n大きな事件に、警察庁が付ける番号だ。"}, {"t": 1126.2666666666667, "x": "どの事件にも付くの？"}, {"t": 1127.7833333333333, "x": "付かない。この前の番号は、\n別の大きな未解決事件に付いている。"}, {"t": 1131.95, "x": "この制度の中身は、前に別の回で詳しく話した。"}, {"t": 1135.3, "x": "今回見るのは、番号が付いた時期だけだ。"}, {"t": 1137.9666666666667, "x": "1990年3月29日、参議院の法務委員会。"}, {"t": 1141.9333333333334, "x": "警察庁の捜査第一課長が、こう説明している。"}, {"t": 1145.2, "x": "「最終段階ではございますが一連の事件が\n同一犯人のものであるということが\n明らかになりまして」。"}, {"t": 1151.1, "x": "最終段階？"}, {"t": 1152.2666666666667, "x": "そこが大事だ。"}, {"t": 1153.3333333333333, "x": "番号が付いたのは、男が\n捕まって、話し始めたあとだ。"}, {"t": 1157.1333333333334, "x": "つまり「同じ犯人だ」と\n言えるようになってから付いた。"}, {"t": 1160.55, "x": "6月には「断定する資料が無い」だったものね。"}, {"t": 1163.85, "x": "そうだ。6月にはまだ言えなかった。"}, {"t": 1166.1833333333334, "x": "言えるようになったのは、男が口を開いてからだ。"}, {"t": 1169.3, "x": "手紙の段階では、番号は付かなかったのね。"}, {"t": 1172.2666666666667, "x": "付かなかった。"}, {"t": 1173.2666666666667, "x": "2通の手紙が届いても、4件は\n一つの事件にならなかった。"}, {"t": 1177.2166666666667, "x": "一つになったのは、八王子の現場のあとだ。"}, {"t": 1180.0333333333333, "x": "ここから、記録の中の呼び名が一気にそろっていく。"}, {"t": 1183.8, "x": "番号が付いたあと、国会では\n捜査のやり方そのものが話題になった。"}, {"t": 1187.9666666666667, "x": "1989年11月21日、衆議院の地方行政委員会。"}, {"t": 1192.8, "x": "ある議員が、広い範囲にまたがる\n捜査の難しさを取り上げた。"}, {"t": 1196.5, "x": "グリコ・森永事件と並べて、\nこの事件の名前も出している。"}, {"t": 1200.3833333333334, "x": "「広域捜査の場合に、"}, {"t": 1201.65, "x": "後から結果を見ますとこれはやはり\nちょっとまずかったなということが"}, {"t": 1205.25, "x": "出ているようでございます」。"}, {"t": 1206.7166666666667, "x": "まずかったって……。"}, {"t": 1207.8666666666666, "x": "議員の見方だ。何がまずかったかを、\nこの回では決めない。"}, {"t": 1211.45, "x": "翌1990年3月27日、同じ委員会。"}, {"t": 1215.2166666666667, "x": "別の議員が、警察庁の懇談会で出た意見を紹介した。"}, {"t": 1218.9833333333333, "x": "県の境を越えて捜査することは、外国の国境を\n越えるのと同じくらい難しいのか。"}, {"t": 1224.1333333333334, "x": "そういう趣旨の意見が出たと。"}, {"t": 1225.9833333333333, "x": "県境が国境みたいってこと？"}, {"t": 1228.1333333333334, "x": "そういうたとえだ。"}, {"t": 1229.1833333333334, "x": "刑事局長はこう答えている。"}, {"t": 1231.0333333333333, "x": "「確かに犯罪者にとりましては\n都道府県の境はないわけでございますが」。"}, {"t": 1235.3, "x": "捜査する側にとっても、境が\n妨げになっては困る、と続けた。"}, {"t": 1239.7166666666667, "x": "犯人は境なんて気にしないものね。"}, {"t": 1242.1166666666666, "x": "この事件も、埼玉で始まり、東京に\n移り、また埼玉に戻っている。"}, {"t": 1246.6833333333334, "x": "局長は、1989年の春から警察庁に\n「広域捜査指導官室」を置いたと答えた。"}, {"t": 1253.0833333333333, "x": "各地の警察にも「広域機動捜査班」を置いた、と。"}, {"t": 1256.7833333333333, "x": "境を越えるための仕組みね。"}, {"t": 1258.6666666666667, "x": "そうだ。この事件のためだけに作られたとは言えない。"}, {"t": 1261.7333333333333, "x": "だが、境をまたいだ事件が続いた\n時期に、仕組みが足されていった。"}, {"t": 1265.85, "x": "手紙は県境を気にせず届いた。"}, {"t": 1267.8666666666666, "x": "捜査は境の内側から始まった。"}, {"t": 1270.8666666666666, "x": "国会の記録を、日付順に並べてみる。"}, {"t": 1273.55, "x": "1989年6月13日。"}, {"t": 1276.1666666666667, "x": "議員の言葉は「幼児誘拐殺人、失跡事件」。"}, {"t": 1279.5333333333333, "x": "6月19日。大臣の言葉は「\n連続発生している幼女誘拐殺人事件」。"}, {"t": 1284.75, "x": "「連続発生している」は、説明の言葉ね。"}, {"t": 1287.85, "x": "そうだ。まだ名前ではない。"}, {"t": 1289.55, "x": "10月2日。海部俊樹 首相が、\n国会で所信表明の演説をした。"}, {"t": 1294.3833333333334, "x": "「先般の世間を震撼させた\n幼女誘拐殺人事件を初めとして」。"}, {"t": 1298.6333333333334, "x": "総理の演説にまで出てきたのね。"}, {"t": 1300.8, "x": "教育の話の入り口に、この事件を置いている。"}, {"t": 1303.7333333333333, "x": "「日本人の心から何か大切なものが\n欠落しつつあるのではないか」。"}, {"t": 1308.1166666666666, "x": "重い言葉ね。"}, {"t": 1309.25, "x": "そして11月9日。国家公安委員長のあいさつ。"}, {"t": 1312.75, "x": "「連続幼女誘拐殺人事件を初めとして、\n凶悪な犯罪が相次いで発生しております」。"}, {"t": 1318.3, "x": "ここで「連続幼女誘拐殺人事件」になったのね。"}, {"t": 1321.8833333333334, "x": "そうだ。説明だった言葉が、名前に変わった。"}, {"t": 1324.9666666666667, "x": "12月5日の参議院でも、\n同じ名前で読み上げられている。"}, {"t": 1328.6166666666666, "x": "そして翌1990年の警察白書だ。"}, {"t": 1331.6833333333334, "x": "「警察庁指定第117号事件（埼玉県、\n東京都における連続幼女誘拐殺人事件）」。"}, {"t": 1337.8166666666666, "x": "1年前は「捜査中」の事例2だったのに。"}, {"t": 1340.85, "x": "そうだ。名前と番号がついた。"}, {"t": 1342.8833333333334, "x": "白書は「同一犯人による\n連続4件の幼女誘拐殺人事件」と書いた。"}, {"t": 1347.7333333333333, "x": "「東京都五日市町居住の男」。"}, {"t": 1349.8, "x": "「元年8月11日検挙」。"}, {"t": 1352.1, "x": "今田勇子の名前は？"}, {"t": 1353.5833333333333, "x": "白書のどこにも出てこない。"}, {"t": 1355.25, "x": "記録の中で、その名前はもう役目を終えていた。"}, {"t": 1358.8166666666666, "x": "1990年の警察白書は、書き出しから\nこの事件を出している。"}, {"t": 1363.3, "x": "犯罪の章の最初の段落だ。"}, {"t": 1365.3333333333333, "x": "「平成元年の刑法犯の認知件数は167万件を\n超え、戦後最高を記録した前年を更に上回った」。"}, {"t": 1372.4, "x": "167万件。"}, {"t": 1373.9666666666667, "x": "警察が知った犯罪の数だ。"}, {"t": 1375.95, "x": "そして白書は、その年の特徴の一つ目にこう書いた。"}, {"t": 1379.5, "x": "「警察庁指定第117号事件をはじめとする\n幼児等対象の誘拐殺人事件が多発したこと」。"}, {"t": 1385.8166666666666, "x": "一つ目に挙げたのね。"}, {"t": 1387.3666666666666, "x": "そうだ。白書の言う「幼児等」は、\n12歳以下の子どものことだ。"}, {"t": 1391.6, "x": "白書には、別の誘拐事件も並んでいる。"}, {"t": 1394.35, "x": "小学生の女の子を連れ去り、お金の受け渡し\n場所を隣の県に指定した事件だ。"}, {"t": 1399.5333333333333, "x": "同じ年にほかにも……。"}, {"t": 1401.0666666666666, "x": "1989年は、子どもを狙う誘拐が重なった年だった。"}, {"t": 1405.35, "x": "1990年4月17日、衆議院の地方行政委員会。"}, {"t": 1409.6166666666666, "x": "新しい国家公安委員長も、\nあいさつで同じ数字を読み上げた。"}, {"t": 1413.4333333333334, "x": "「昨年における刑法犯の認知件数は、\n約百六十七万件と戦後最高を記録しております」。"}, {"t": 1419.55, "x": "そのあとに、この事件の名前が出てくる。"}, {"t": 1422.0333333333333, "x": "「連続幼児誘拐殺人事件や\n身の代金目的誘拐事件など」。"}, {"t": 1426.3166666666666, "x": "あれ今度は「幼児」なのね。"}, {"t": 1428.3666666666666, "x": "気づいたか。"}, {"t": 1429.5, "x": "前の年の11月は「幼女」。この日は「幼児」。"}, {"t": 1432.8, "x": "名前がそろったあとでも、言い方は少し揺れている。"}, {"t": 1435.9, "x": "記録って細かいところで違うのね。"}, {"t": 1438.2166666666667, "x": "だから並べて読むと面白い。"}, {"t": 1440.0166666666667, "x": "1990年5月22日には、海部俊樹 首相が\nまたこの事件に触れた。"}, {"t": 1445.4166666666667, "x": "「一連のいたいけな幼女の生命を奪うというような\n残虐な反社会的な事件の報道を見るたびに、"}, {"t": 1450.8, "x": "本当に胸が痛む思い」。"}, {"t": 1452.5833333333333, "x": "事件から2年近くたっても、国会は\nこの事件を語り続けていた。"}, {"t": 1457.4333333333334, "x": "逮捕のあと、世の中の目は男の部屋に向いた。"}, {"t": 1460.5333333333333, "x": "部屋？"}, {"t": 1461.6666666666667, "x": "自分の部屋に、ビデオテープが約5,800本あった。"}, {"t": 1465.1, "x": "5,800本！"}, {"t": 1466.3833333333334, "x": "論文が挙げている数だ。"}, {"t": 1467.95, "x": "男はアニメなどを趣味にしていた、とも書かれている。"}, {"t": 1471.0, "x": "そこから、この事件は「おたくの犯罪」と\n呼ばれるようになった。"}, {"t": 1475.0166666666667, "x": "おたく、って言葉はその前からあったの？"}, {"t": 1477.4833333333333, "x": "あった。だが論文は、この事件を\nきっかけに広く知られたと書いている。"}, {"t": 1481.6666666666667, "x": "しかも、悪い意味をまとって広まった。"}, {"t": 1484.1666666666667, "x": "趣味が同じだけの人まで、悪く見られたってこと？"}, {"t": 1487.4166666666667, "x": "そういう面はあった。"}, {"t": 1488.4833333333333, "x": "論文も、おたくの側から事件を\n問い直す本が出たと書いている。"}, {"t": 1492.3666666666666, "x": "ここで、この回の立場をはっきりさせておく。"}, {"t": 1495.1, "x": "趣味が事件を起こしたとは言わない。"}, {"t": 1497.0833333333333, "x": "判決が動機として認めたのは、別のものだ。"}, {"t": 1500.2333333333333, "x": "別のもの？"}, {"t": 1501.35, "x": "最高裁はこうまとめている。"}, {"t": 1503.1, "x": "「自己の性的欲求を満たすために」。"}, {"t": 1505.3, "x": "そして撮影したものを「自分だけの珍しい\nビデオテープを持ちたいという収集欲」。"}, {"t": 1510.2166666666667, "x": "……集めたい気持ち。"}, {"t": 1511.4833333333333, "x": "判決はそれを「誠に自己中心的かつ非道なもので、\nおよそ酌量の余地がない」と書いた。"}, {"t": 1517.3333333333333, "x": "テープの山は、捜査の大事な証拠にもなった。"}, {"t": 1520.2333333333333, "x": "中身はここでは話さない。"}, {"t": 1521.8833333333334, "x": "部屋の話より先に、法廷に何が並んだかを見る。"}, {"t": 1525.8333333333333, "x": "1990年3月30日。"}, {"t": 1528.2, "x": "東京地方裁判所で、最初の公判が開かれた。"}, {"t": 1531.6333333333334, "x": "逮捕から8か月ね。"}, {"t": 1533.2666666666667, "x": "そうだ。5件をまとめて裁くことになった。"}, {"t": 1535.95, "x": "法廷では、証拠が一つずつ示されていく。"}, {"t": 1538.7333333333333, "x": "論文によると、子どもたちの服や靴と\n並んで、物証として示されたものがある。"}, {"t": 1543.8166666666666, "x": "もしかして……。"}, {"t": 1544.95, "x": "「犯行声明」と「告白文」。あの2通だ。"}, {"t": 1547.95, "x": "手紙が証拠になったのね。"}, {"t": 1549.7666666666667, "x": "築地に届いた封筒は、ここで\n法廷の机の上に戻ってきた。"}, {"t": 1553.6833333333334, "x": "では男は、手紙について何と答えたか。"}, {"t": 1556.4, "x": "1992年12月18日、17回目の公判。"}, {"t": 1560.5333333333333, "x": "犯行声明と告白文を送ったことはあるか、と聞かれた。"}, {"t": 1564.1666666666667, "x": "男の答えは「あるように思う」。"}, {"t": 1566.3, "x": "あるように思う？"}, {"t": 1567.45, "x": "はっきり認めもしない。否定もしない。"}, {"t": 1569.8, "x": "捜査の段階では、細かく話していたとされる。"}, {"t": 1572.7833333333333, "x": "検察官は「捜査段階では、詳しく\n供述していたではないですか」と問い返した。"}, {"t": 1578.2, "x": "でも法廷では言わなくなった。"}, {"t": 1580.0833333333333, "x": "「相手に合わせた」\n「やはり覚えていない」といった答えが続いた。"}, {"t": 1583.8666666666666, "x": "今田勇子のときと同じね。"}, {"t": 1585.75, "x": "同じ？"}, {"t": 1586.8666666666666, "x": "本当のことが、また見えなくなる感じ。"}, {"t": 1589.4833333333333, "x": "……そうかもしれない。"}, {"t": 1590.5333333333333, "x": "手紙では名前を偽った。"}, {"t": 1592.0666666666666, "x": "法廷では記憶をぼかした。"}, {"t": 1593.8166666666666, "x": "裁判は、そこをどう判断するかに\n長い時間を使うことになる。"}, {"t": 1598.2833333333333, "x": "裁判で大きな争いになったのは、責任能力だ。"}, {"t": 1601.7, "x": "責任能力？"}, {"t": 1602.9666666666667, "x": "自分のしたことが悪いと分かって、\n止められる力があったかどうかだ。"}, {"t": 1606.9666666666667, "x": "その力が無い、または弱いと\n認められると、刑が変わる。"}, {"t": 1610.6666666666667, "x": "それを誰が決めるの？"}, {"t": 1612.1166666666666, "x": "決めるのは裁判所だ。だが\n材料として、医師の鑑定を使う。"}, {"t": 1615.9333333333334, "x": "この裁判では、鑑定書が三つ出された。"}, {"t": 1618.5833333333333, "x": "2007年の国会で、ある議員が長い\n裁判の例としてこの事件を挙げている。"}, {"t": 1623.2666666666667, "x": "「三通の鑑定書が出ています、その責任能力に」。"}, {"t": 1626.7, "x": "三通とも同じ結論？"}, {"t": 1628.3666666666666, "x": "違った。"}, {"t": 1629.5, "x": "一つは、責任能力は欠けていないとした。"}, {"t": 1632.3833333333334, "x": "あとの二つは、能力が弱まっていたという見方だった。"}, {"t": 1635.8833333333334, "x": "お医者さんでも割れたのね。"}, {"t": 1637.5166666666667, "x": "割れた。この回では、どの病名が\n正しいかには入らない。"}, {"t": 1640.9833333333333, "x": "鑑定のたびに、公判は長く止まった。"}, {"t": 1643.6, "x": "どのくらい？"}, {"t": 1644.7333333333333, "x": "最初の公判から、第一審の判決まで7年かかっている。"}, {"t": 1648.5666666666666, "x": "同じ議員の言葉だ。"}, {"t": 1649.9666666666667, "x": "「一九九七年の四月十四日、三十八回の公判で\n死刑の判決が言い渡されました」。"}, {"t": 1656.2, "x": "38回。"}, {"t": 1657.3666666666666, "x": "判決は、責任能力を認めた鑑定を採った。"}, {"t": 1660.5833333333333, "x": "2008年にも、別の議員がこの事件を例に出している。"}, {"t": 1664.1333333333334, "x": "裁判が長くなる理由の一つとして、「\n鑑定がなかなか出てこない場合がある」と。"}, {"t": 1669.0666666666666, "x": "裁判のやり方の議論にまで使われたのね。"}, {"t": 1671.8666666666666, "x": "そうだ。事件は、裁判の長さの話にも名前を残した。"}, {"t": 1676.3333333333333, "x": "第一審のあと、男の側は控訴した。"}, {"t": 1678.95, "x": "2001年6月28日、東京高等裁判所は控訴を棄却した。"}, {"t": 1683.7333333333333, "x": "死刑のままね。"}, {"t": 1684.9166666666667, "x": "そうだ。そして最高裁へ上告した。"}, {"t": 1687.4166666666667, "x": "2006年1月17日。"}, {"t": 1689.3333333333333, "x": "最高裁の第三小法廷が判決を出した。"}, {"t": 1692.3, "x": "主文は「本件上告を棄却する」。"}, {"t": 1694.8, "x": "最初の公判から……。"}, {"t": 1696.25, "x": "16年近くたっていた。"}, {"t": 1698.0166666666667, "x": "判決文は2ページほどの短いものだ。"}, {"t": 1700.5166666666667, "x": "その中に、2通の手紙にあたる言葉がある。"}, {"t": 1703.4166666666667, "x": "どんな言葉？"}, {"t": 1704.55, "x": "「被害者の家族へ遺骨や犯行声明文等を\n送り付けるなどしており」。"}, {"t": 1708.55, "x": "「一連の凶悪な犯行が社会に与えた衝撃は甚大で」。"}, {"t": 1712.2, "x": "手紙のことも重く見られたのね。"}, {"t": 1714.3, "x": "刑を重くする事情の一つとして書かれている。"}, {"t": 1717.0333333333333, "x": "一方で、男のために考えた事情も並べている。"}, {"t": 1720.2, "x": "生まれつきの腕の障害に\n悩んできたこと。前科が無いこと。"}, {"t": 1723.8166666666666, "x": "捜査の段階では事実を認めていたこと。"}, {"t": 1726.4, "x": "母親が遺族に「慰謝の一部として\n計800万円を送付している」こと。"}, {"t": 1731.0833333333333, "x": "それでも死刑は変わらなかった。"}, {"t": 1733.0666666666666, "x": "「当裁判所もこれを是認せざるを得ない」。"}, {"t": 1735.3333333333333, "x": "そして最後の一文。「裁判官全員一致の意見で」。"}, {"t": 1738.75, "x": "全員一致。"}, {"t": 1739.8833333333334, "x": "この小法廷の4人の裁判官が、\n全員で同じ結論を出した。"}, {"t": 1744.0833333333333, "x": "4人の名前が判決に並んでいるのね。"}, {"t": 1746.65, "x": "そうだ。この判決で、刑は確定へ向かった。"}, {"t": 1750.25, "x": "裁判が続く間に、別の事件が起きる。"}, {"t": 1753.0, "x": "奈良県で、小学生の女の子が連れ去られた事件だ。"}, {"t": 1756.4833333333333, "x": "また子どもの……。"}, {"t": 1757.6666666666667, "x": "そのあと、2005年2月25日、\n衆議院の予算委員会の分科会。"}, {"t": 1762.25, "x": "奈良が地元の議員が、法務大臣にこう迫った。"}, {"t": 1765.3, "x": "「振り返れば、十六年前に私たちは同じように、\nそれこそ全国民が震撼をした」あの事件があった、と。"}, {"t": 1772.1, "x": "「十六年間、では何をなされていたのか」。"}, {"t": 1774.8333333333333, "x": "16年前ってこの事件のことね。"}, {"t": 1777.2333333333333, "x": "そうだ。議員は、罪を犯した人を\n立ち直らせる取り組みが遅れたと言った。"}, {"t": 1781.65, "x": "この回では、議員の言い分が\n正しいかどうかは決めない。"}, {"t": 1784.8166666666666, "x": "言えるのは、16年たっても比べる\n相手として名前が出たことだ。"}, {"t": 1788.75, "x": "さらに1年後の2006年2月14日、\n衆議院の青少年問題の特別委員会。"}, {"t": 1794.15, "x": "参考人として呼ばれた大学の研究者が、\n写真を見せながら話した。"}, {"t": 1798.6833333333334, "x": "どんな写真？"}, {"t": 1799.8166666666666, "x": "犯罪が起きた場所の写真だ。その中に、\nこの事件の江東区の場所があった。"}, {"t": 1804.55, "x": "研究者は、犯罪が起きる場所には\n二つの条件があると言った。"}, {"t": 1808.4, "x": "「入りやすくて見えにくい場所」。"}, {"t": 1810.2833333333333, "x": "入りやすくて見えにくい。"}, {"t": 1811.8666666666666, "x": "そういう場所を、子どもや大人が\n地図に書き込んで確かめる。"}, {"t": 1815.2, "x": "「地域安全マップ」という取り組みだ。"}, {"t": 1817.4666666666667, "x": "同じ日、別の参考人は違う角度から話した。"}, {"t": 1820.75, "x": "危ないと言われていない場所でも、事件は起きうる。"}, {"t": 1823.55, "x": "だから怖い目に遭ったらどうするかを、\n子どもに伝えたい、と。"}, {"t": 1827.1333333333334, "x": "場所を知ることと、その時どうするかね。"}, {"t": 1829.75, "x": "どちらも、この事件のあとに積み重なった考え方だ。"}, {"t": 1833.1833333333334, "x": "事件の名前は、子どもを守る議論の中にも残った。"}, {"t": 1837.1333333333334, "x": "2008年6月17日。"}, {"t": 1839.1, "x": "死刑が執行された。"}, {"t": 1840.7, "x": "確定からどのくらい？"}, {"t": 1842.2, "x": "2年あまりだ。"}, {"t": 1843.2, "x": "翌日の6月18日、ある衆議院議員が\n政府に質問主意書を出している。"}, {"t": 1848.1833333333334, "x": "質問主意書？"}, {"t": 1849.3833333333334, "x": "議員が文書で政府に質問し、\n内閣が文書で答える仕組みだ。"}, {"t": 1853.3666666666666, "x": "書き出しはこうだ。"}, {"t": 1854.5333333333333, "x": "「六月十七日、鳩山邦夫法務大臣に\nよる四回目の死刑執行が行われた」。"}, {"t": 1859.9333333333334, "x": "4回目。"}, {"t": 1861.05, "x": "大臣の就任からの回数だ。"}, {"t": 1863.0666666666666, "x": "質問は、大臣が記者会見で語った言葉も引いている。"}, {"t": 1866.7, "x": "「妙な言い方だが、自信と責任を\nもって執行できるという人を選んだ」。"}, {"t": 1871.1166666666666, "x": "選んだって……。"}, {"t": 1872.2333333333333, "x": "議員はそこを問題にした。"}, {"t": 1873.7666666666667, "x": "精神の状態をどう確かめたのか、と。"}, {"t": 1876.35, "x": "内閣の答えは、6月24日に出た。"}, {"t": 1879.15, "x": "個別の執行の詳しいことは\n「お答えを差し控えたい」。"}, {"t": 1882.5666666666666, "x": "答えなかったのね。"}, {"t": 1883.9833333333333, "x": "一般の手続きとしては、確かめた\n上で命令を出していると答えている。"}, {"t": 1888.2166666666667, "x": "だがこの人について何をどう\n確かめたかは、記録に無い。"}, {"t": 1891.8166666666666, "x": "最後まで、分からないことが残ったのね。"}, {"t": 1894.4833333333333, "x": "残った。"}, {"t": 1895.6166666666666, "x": "最初の封筒が届いてから、19年と4か月。"}, {"t": 1898.9, "x": "「今田勇子」を名乗った人は、\n本当の名前のまま記録を終えた。"}, {"t": 1903.4166666666667, "x": "今回使った記録をここでまとめて言う。"}, {"t": 1905.85, "x": "判決は、最高裁の2006年1月17日の判決。"}, {"t": 1909.7833333333333, "x": "裁判所の判例検索で全文が読める。"}, {"t": 1912.3833333333334, "x": "警察白書は、平成元年版と\n平成2年版の、犯罪の章だ。"}, {"t": 1916.8166666666666, "x": "国会の記録は、\n1989年6月13日の参議院予算委員会から始まる。"}, {"t": 1922.65, "x": "6月14日の衆議院地方行政委員会と、\n6月19日の参議院本会議も開いた。"}, {"t": 1928.3666666666666, "x": "6月20日と21日は、参議院の文教と\n地方行政の二つの委員会だ。"}, {"t": 1933.3833333333334, "x": "9月6日の衆議院法務委員会、10月2日の首相の演説、\n11月9日のあいさつも使った。"}, {"t": 1939.9, "x": "広い範囲の捜査の話は、1989年11月21日と\n1990年3月27日の衆議院の委員会で出た。"}, {"t": 1948.6666666666667, "x": "117号の説明は、\n1990年3月29日の参議院法務委員会にある。"}, {"t": 1954.35, "x": "4月17日の衆議院と、\n5月22日の参議院の記録も読んだ。"}, {"t": 1958.8833333333334, "x": "父親の話は、\n1990年6月25日の参議院地方行政委員会だ。"}, {"t": 1964.3166666666666, "x": "鑑定と裁判の長さは、2007年4月10日と\n2008年11月13日の参議院法務委員会。"}, {"t": 1970.95, "x": "16年後の話は、2005年2月25日と\n2006年2月14日の衆議院の記録だ。"}, {"t": 1977.0333333333333, "x": "執行の話は、2008年6月18日の質問主意書と、\n6月24日の答弁書だ。"}, {"t": 1983.2833333333333, "x": "手紙が届いた日付と、八王子の日のことは、\n裁判の記録を引いた大学の論文で確かめた。"}, {"t": 1989.4, "x": "「女の人を探した」っていう話は？"}, {"t": 1991.8833333333334, "x": "それは当時の報道だ。だから「報じられた」と言った。"}, {"t": 1995.3333333333333, "x": "あえて触れなかったことも挙げておく。"}, {"t": 1997.3333333333333, "x": "子どもたちの名前と、亡くなった時の様子。"}, {"t": 2000.1166666666666, "x": "箱の中身と、手紙や葉書の文面の大半。"}, {"t": 2003.1166666666666, "x": "今田勇子という名前の由来。"}, {"t": 2004.8666666666666, "x": "鑑定のうち、どの病名が正しいか。"}, {"t": 2007.3666666666666, "x": "話さないって決めたのね。"}, {"t": 2009.1, "x": "決めた。記録にあっても、言わなくていいことがある。"}, {"t": 2012.7666666666667, "x": "ねえ、最初の手紙の話に戻っていい？"}, {"t": 2015.4166666666667, "x": "いいぞ。"}, {"t": 2016.5333333333333, "x": "「私はあなた方の身近に居ます」って\n書いてあったのよね。"}, {"t": 2020.0, "x": "2通目の告白文にな。"}, {"t": 2021.8166666666666, "x": "本当に身近にいたの？"}, {"t": 2023.4666666666667, "x": "住んでいたのは、東京都の五日市町だ。"}, {"t": 2026.0833333333333, "x": "所沢でも入間市でもない。"}, {"t": 2027.85, "x": "名前も、女性の名前ではなかった。"}, {"t": 2030.2666666666667, "x": "じゃあ、あの一行もうそだったのね。"}, {"t": 2032.5, "x": "少なくとも、書かれた通りの人ではなかった。"}, {"t": 2035.3833333333334, "x": "手紙は、書き手が見せたい姿だけを運んでくる。"}, {"t": 2038.4166666666667, "x": "国会で刑事局長が「断定するだけの資料は無い」と\n言ったのも、そこだ。"}, {"t": 2043.2333333333333, "x": "2通もあったのに。"}, {"t": 2044.55, "x": "2通あっても、本当の名前は書かれていなかった。"}, {"t": 2047.5666666666666, "x": "男を押さえたのは、八王子にいた一人の父親だった。"}, {"t": 2051.0833333333335, "x": "手紙じゃなくて、人の目だったのね。"}, {"t": 2053.5333333333333, "x": "そうだ。"}, {"t": 2054.6666666666665, "x": "そして記録は、事件を少しずつ呼び直していった。"}, {"t": 2057.866666666667, "x": "「捜査中」の事例2。"}, {"t": 2059.366666666667, "x": "「幼女誘拐殺人事件」。"}, {"t": 2060.866666666667, "x": "「連続幼女誘拐殺人事件」。そして117号。"}, {"t": 2064.45, "x": "最後まで「今田勇子事件」とは呼ばれなかったのね。"}, {"t": 2067.8166666666666, "x": "呼ばれなかった。偽の名前は、\n記録には残らなかった。"}, {"t": 2071.3333333333335, "x": "残ったのは、連れ去られた\n5人の子と、帰れなかった4人の子だ。"}, {"t": 2075.2833333333333, "x": "名前を出さなくても、その数は忘れないでおきたい。"}, {"t": 2078.45, "x": "手紙の2より、子どもの5と4、ね。"}, {"t": 2080.9, "x": "そうだ。先に覚えておくのは、子どもの数のほうだ。"}, {"t": 2084.0833333333335, "x": "今回は、2通の手紙が名乗った名前と、\n記録が付けた名前の回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
