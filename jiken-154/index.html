<script>
const D={"name": "154", "file": "154_編集用", "dur": 1826.01665625, "segs": [], "subs": [{"t": 0.0, "x": "1963年2月28日、名古屋高等裁判所。"}, {"t": 4.166666666666667, "x": "傍聴席は80人で埋まっていた。"}, {"t": 6.45, "x": "被告人の席には、80歳を超えた老人がいた。"}, {"t": 9.85, "x": "そんな年で裁判を受けていたの？"}, {"t": 11.983333333333333, "x": "そうだ。耳もよく聞こえない人だった。"}, {"t": 14.433333333333334, "x": "裁判所は念のため医師を立ち会わせていた。"}, {"t": 17.083333333333332, "x": "お医者さんまで呼んでいたのね。"}, {"t": 18.9, "x": "老人の名前は吉田石松。"}, {"t": 20.816666666666666, "x": "裁かれていたのは、50年前の強盗殺人だ。"}, {"t": 24.016666666666666, "x": "50年も前の事件なの？"}, {"t": 25.883333333333333, "x": "吉田は警察でも法廷でも、一度も\n自分がやったとは認めなかった。"}, {"t": 30.25, "x": "それでも、言い分は通らなかったの？"}, {"t": 32.56666666666667, "x": "一緒にやったとされた2人の話は、\n調書ごとに変わっていた。"}, {"t": 36.3, "x": "今回は、国会の会議録に\n残った言葉だけで50年を追う。"}, {"t": 40.13333333333333, "x": "事件の記録も、戦災でほとんど失われている。"}, {"t": 43.2, "x": "なぜ彼は、50年も自分ではないと言い続けたのか。"}, {"t": 64.3, "x": "50年って、ほとんど一生じゃない。"}, {"t": 66.61666666666666, "x": "彼は日本の巌窟王と呼ばれた。"}, {"t": 68.7, "x": "巌窟王は、長く牢に閉じこめられた男の物語だ。"}, {"t": 72.41666666666667, "x": "国会でもその呼び名が使われたの？"}, {"t": 74.73333333333333, "x": "何度も使われた。昭和の巌窟王という呼び名もある。"}, {"t": 78.0, "x": "2026年6月の法務委員会でも、\n議員がこの名前を出した。"}, {"t": 82.35, "x": "事件から100年以上たっているのに？"}, {"t": 84.68333333333334, "x": "1959年から今までに、\n吉田石松の名前が出る発言は97件ある。"}, {"t": 90.11666666666666, "x": "会議録には、1961年の決定の全文が\n朗読されて残っている。"}, {"t": 95.18333333333334, "x": "そこに、事件の夜のことが書いてあるのね。"}, {"t": 97.98333333333333, "x": "そうだ。誰が犯人かを、ここで当てることはしない。"}, {"t": 101.71666666666667, "x": "始まりは大正2年の夏だ。"}, {"t": 103.68333333333334, "x": "1913年8月13日の夜、名古屋の千種町のあたり。"}, {"t": 108.1, "x": "繭の空の籠を積んだ荷車を、引いて歩く男性がいた。"}, {"t": 111.73333333333333, "x": "繭を売った帰りだったのかしら。"}, {"t": 113.73333333333333, "x": "売った代金を持っていると思われた、と判決にある。"}, {"t": 116.85, "x": "この男性が殺されて財布が取られた。"}, {"t": 119.33333333333333, "x": "財布にはいくら入っていたの？"}, {"t": 121.23333333333333, "x": "1円20銭だ。"}, {"t": 122.63333333333334, "x": "そのお金のために命が奪われたのね。"}, {"t": 125.15, "x": "疑われたのは3人の男だった。"}, {"t": 127.36666666666666, "x": "そのうちの1人が30代の吉田石松だ。"}, {"t": 130.81666666666666, "x": "吉田さんはどうやって捕まったの？"}, {"t": 132.98333333333332, "x": "本人がのちに国会でこう話している。"}, {"t": 135.38333333333333, "x": "仕事をしていたら刑事が4人来た。"}, {"t": 137.53333333333333, "x": "ちょっと警察へ来いと言われた。"}, {"t": 139.35, "x": "わけを聞くと、警察へ来たらわかると返されたそうだ。"}, {"t": 142.7, "x": "理由も言われずに連れて行かれたの？"}, {"t": 144.76666666666668, "x": "警察では、血のついた物を見せられたという。"}, {"t": 147.45, "x": "弁護士も国会で、非常に重い拷問を受けたと述べた。"}, {"t": 150.98333333333332, "x": "それでも認めなかったのね。"}, {"t": 152.8, "x": "がんとして否認し続けたと弁護士は言った。"}, {"t": 155.43333333333334, "x": "警察でも予審でも公判でも、一度も自白していない。"}, {"t": 159.51666666666668, "x": "1914年4月15日、名古屋地方裁判所の判決が出た。"}, {"t": 163.98333333333332, "x": "吉田石松は死刑。"}, {"t": 165.43333333333334, "x": "ほかの2人は無期懲役だった。"}, {"t": 167.55, "x": "3人とも有罪にされたのね。"}, {"t": 169.6, "x": "2人はすぐに判決に服した。"}, {"t": 171.7, "x": "吉田だけが控訴した。"}, {"t": 173.36666666666667, "x": "やっていないなら当然そうするわよね。"}, {"t": 175.66666666666666, "x": "判決では吉田が言い出したことになっていた。"}, {"t": 178.35, "x": "2人を仲間に引き入れた首謀者という筋書きだ。"}, {"t": 181.93333333333334, "x": "同じ年の7月31日、名古屋控訴院の判決が出た。"}, {"t": 186.0, "x": "死一等を減じて無期懲役になった。"}, {"t": 188.38333333333333, "x": "死刑ではなくなったけど、有罪のままなのね。"}, {"t": 191.33333333333334, "x": "そうだ。吉田はさらに上告した。"}, {"t": 193.6, "x": "11月3日、大審院は上告を棄却した。"}, {"t": 196.86666666666667, "x": "大審院って、いまの最高裁みたいなところ？"}, {"t": 199.85, "x": "その役目の裁判所だ。これで無期懲役が確定した。"}, {"t": 203.31666666666666, "x": "事件から1年と3か月足らずのことだった。"}, {"t": 206.31666666666666, "x": "大審院は、どうして見直してくれなかったのかしら。"}, {"t": 209.56666666666666, "x": "のちに元記者が、国会でこんな話をしている。"}, {"t": 212.6, "x": "記者クラブには毎月、上告の写しが\n山のように回ってきた。"}, {"t": 216.5, "x": "ほとんどは、本件上告はこれを棄却す、で終わる。"}, {"t": 219.86666666666667, "x": "それが、当たり前だったのね。"}, {"t": 221.86666666666667, "x": "吉田の上告も、その中の1件だったと元記者は語った。"}, {"t": 225.78333333333333, "x": "1審と2審がそうなっていて、2人も服罪していた。"}, {"t": 229.16666666666666, "x": "だから、同じ一味として\n片づけられたのではないか、と話した。"}, {"t": 233.76666666666668, "x": "その裁判の記録はいまも残っているの？"}, {"t": 236.33333333333334, "x": "ほとんど残っていない。"}, {"t": 237.55, "x": "戦災で焼けてしまった。"}, {"t": 239.2, "x": "残ったのは1審と2審の判決文だけだ。"}, {"t": 242.15, "x": "それじゃあ調べ直しようがないじゃない。"}, {"t": 244.25, "x": "ところが2つの判決には、\n証拠の説明が詳しく書いてあった。"}, {"t": 248.3, "x": "1961年の決定は、その2つを並べて比べた。"}, {"t": 252.45, "x": "比べると何が見えてきたの？"}, {"t": 254.36666666666667, "x": "同じ事件なのに、中身が大きく食い違っていた。"}, {"t": 257.43333333333334, "x": "たとえば財布を取ったのは誰か。"}, {"t": 259.3666666666667, "x": "1審では、道を教えた男が取ったことになっている。"}, {"t": 262.6666666666667, "x": "2審ではそれが吉田に変わっていた。"}, {"t": 264.96666666666664, "x": "同じ証拠から違う人になったの？"}, {"t": 267.26666666666665, "x": "玄翁で殴るよう指図した者も2審では消えた。"}, {"t": 270.21666666666664, "x": "ほかの役目も、1審と2審で別の人になっている。"}, {"t": 273.7, "x": "玄翁って大きな金づちのことよね。"}, {"t": 276.0833333333333, "x": "そうだ。食い違いはほとんど\n全部に及ぶ、と決定は書いた。"}, {"t": 279.8, "x": "判決ごとに役目が入れ替わっているみたい。"}, {"t": 282.4166666666667, "x": "2審は、動機やいつ思い立ったかも書いていなかった。"}, {"t": 285.53333333333336, "x": "決定はそれを、漠然とした認定だと指摘した。"}, {"t": 289.3666666666667, "x": "3人はどうやって集まったことになっていたの？"}, {"t": 292.2, "x": "そこも話がそろっていない。"}, {"t": 293.95, "x": "玄翁を持った男の最初の調書ではこうだ。"}, {"t": 296.6333333333333, "x": "吉田が来て、今夜いい\n仕事があるから手伝えと言った。"}, {"t": 300.0, "x": "吉田さんが誘ったってことね。"}, {"t": 302.0833333333333, "x": "ところが2回目の調書では違っていた。"}, {"t": 304.45, "x": "誘いに来たのは、道を教えた男のように話している。"}, {"t": 307.95, "x": "同じ人が別のことを言っているのね。"}, {"t": 310.3, "x": "謀議がいつどこでできたのか、\n決定は明らかでないとした。"}, {"t": 313.76666666666665, "x": "財布の話も、2人で食い違う。"}, {"t": 316.03333333333336, "x": "玄翁を持った男は、自分が財布を取ったと話した。"}, {"t": 319.4166666666667, "x": "中身は20銭銀貨が5個と10銭銀貨が2個。"}, {"t": 322.53333333333336, "x": "中身まで細かく覚えていたのね。"}, {"t": 324.71666666666664, "x": "一方、道を教えた男は2審でこう述べた。"}, {"t": 327.51666666666665, "x": "自分が取った財布を、吉田に渡せと言われて渡した。"}, {"t": 331.0, "x": "財布を持っていった人が違うじゃない。"}, {"t": 333.26666666666665, "x": "決定は、矛盾にただならないものがあると書いた。"}, {"t": 336.8333333333333, "x": "次は着物についた血の話だ。"}, {"t": 338.9166666666667, "x": "1審は、吉田の単衣についた人の血を証拠にした。"}, {"t": 342.46666666666664, "x": "それなら有力な証拠じゃない？"}, {"t": 344.35, "x": "鑑定書をよく読むと、汚れは9個あった。"}, {"t": 346.98333333333335, "x": "人の血と認められたのは一小斑点だけだ。"}, {"t": 349.93333333333334, "x": "小さな点が1つだけってこと？"}, {"t": 352.0833333333333, "x": "玄翁を持った男の着物は、\n5個の汚れがすべて人の血だった。"}, {"t": 356.03333333333336, "x": "返り血を浴びるのが普通なのになぜ\n一点だけか、と決定は問うた。"}, {"t": 360.06666666666666, "x": "一緒にいたならもっとついていそうよね。"}, {"t": 362.3833333333333, "x": "しかも2審は、その鑑定書を証拠から外していた。"}, {"t": 366.25, "x": "吉田さんは何で殴ったことにされていたの？"}, {"t": 368.98333333333335, "x": "尺八だ。"}, {"t": 370.1166666666667, "x": "楽器の尺八？"}, {"t": 371.45, "x": "尺八で殴ったという供述だった。"}, {"t": 373.76666666666665, "x": "ところが尺八は、2審判決の証拠に引用されていない。"}, {"t": 377.4, "x": "血痕のついた形跡が無かったからではないか、と\n決定は書いた。"}, {"t": 381.4166666666667, "x": "凶器なのに血がついていなかったの？"}, {"t": 383.6333333333333, "x": "鑑定の言う重い鈍い物に\nあたるかにも、疑問が残るとした。"}, {"t": 387.3333333333333, "x": "傷の場所も、仰向けの人を\n殴った形と合わないとされた。"}, {"t": 391.6333333333333, "x": "目撃した人もいた。近くで湯屋を営む人だ。"}, {"t": 394.8833333333333, "x": "夜の9時半ごろ、表で夕涼みをしていた。"}, {"t": 397.6166666666667, "x": "荷車の男性に、道を教えている男を見たという。"}, {"t": 400.76666666666665, "x": "もう1人、足早に東へ過ぎていく男がいた。"}, {"t": 403.95, "x": "その男が吉田さんだったの？"}, {"t": 405.95, "x": "肩の張り具合と背恰好から、\nそう思われるという証言だ。"}, {"t": 409.6, "x": "顔を見たわけじゃないのね。"}, {"t": 411.25, "x": "推測にすぎない疑いがあると決定は書いた。"}, {"t": 414.06666666666666, "x": "尺八を持っていたはずなのに、その話も出てこない。"}, {"t": 417.3833333333333, "x": "それに見たのは2人だけで、3人目の姿が無い。"}, {"t": 421.18333333333334, "x": "じゃあ有罪の決め手は何だったの？"}, {"t": 423.26666666666665, "x": "共犯とされた2人の供述だ。"}, {"t": 425.3666666666667, "x": "吉田が首謀者だと2人は話していた。"}, {"t": 427.96666666666664, "x": "同じ事件で裁かれた人の話なのね。"}, {"t": 430.7, "x": "2人の話は互いに矛盾してころころ\n変わる、と決定は書いた。"}, {"t": 434.6166666666667, "x": "つなげると、吉田がほとんど1人でやったことになる。"}, {"t": 437.8, "x": "決定はそれを吉田のひとり舞台と表した。"}, {"t": 440.6666666666667, "x": "2人が言われるままに動いたなんて不自然ね。"}, {"t": 443.4, "x": "そして決定は結論にこう書いた。"}, {"t": 445.56666666666666, "x": "有罪とするきめ手となるような決定的証拠は存しない。"}, {"t": 449.6166666666667, "x": "話を1914年に戻そう。"}, {"t": 451.9166666666667, "x": "確定したその日に、吉田は小菅監獄で服役を始めた。"}, {"t": 455.81666666666666, "x": "翌1915年には秋田の監獄へ移された。"}, {"t": 459.06666666666666, "x": "1918年にもう一度小菅へ。"}, {"t": 461.56666666666666, "x": "そのあと間もなく北海道の網走へ送られた。"}, {"t": 464.46666666666664, "x": "あちこち移されたのね。"}, {"t": 466.0833333333333, "x": "1925年10月1日にまた秋田へ戻された。"}, {"t": 469.68333333333334, "x": "議員がこの道のりを、国会で一つずつ読み上げている。"}, {"t": 473.5833333333333, "x": "刑務所の中ではどう過ごしていたの？"}, {"t": 475.8666666666667, "x": "囚人の着物を着ることを拒んだ。"}, {"t": 478.0, "x": "労役につくことも拒んだ。"}, {"t": 479.9, "x": "自分は囚人じゃないという意味ね。"}, {"t": 481.96666666666664, "x": "弁護士の説明でもまさにそう言っていた。"}, {"t": 484.4, "x": "そのために網走へ送られたと決定は書いている。"}, {"t": 487.26666666666665, "x": "受けた懲罰は53回に及んだ。"}, {"t": 489.6166666666667, "x": "53回も罰を受けて、それでも曲げなかったの？"}, {"t": 492.8833333333333, "x": "あくまで屈しなかったと決定にはある。"}, {"t": 495.1166666666667, "x": "刑務所の側も困ったらしい。"}, {"t": 496.9, "x": "あまりに訴え続けるので心の病を疑った。"}, {"t": 499.98333333333335, "x": "それで調べたの？"}, {"t": 501.28333333333336, "x": "精神鑑定もしたと弁護士が国会で述べている。"}, {"t": 504.23333333333335, "x": "結果は精神上みじんも異常はなかった。"}, {"t": 506.81666666666666, "x": "まともな人が本気で訴えていたってことね。"}, {"t": 509.6333333333333, "x": "獄中では毎日のように無実を訴えたそうだ。"}, {"t": 512.5333333333333, "x": "21年間の細かい記録が\n残っている、と弁護士は話した。"}, {"t": 517.1666666666666, "x": "裁判のやり直しは頼まなかったの？"}, {"t": 519.5, "x": "頼んだ。1918年に大審院へ再審を請求した。"}, {"t": 523.5166666666667, "x": "その年の3月1日に棄却された。"}, {"t": 526.0833333333334, "x": "1922年にも請求して、11月22日に棄却された。"}, {"t": 530.8333333333334, "x": "どうして通らなかったの？"}, {"t": 532.4833333333333, "x": "本人が獄中から出したもので、法律を知らなかった。"}, {"t": 535.9166666666666, "x": "判決の写しも証拠の書類も添えていなかった。"}, {"t": 538.95, "x": "手続きの形が整っていなかったのね。"}, {"t": 541.6833333333333, "x": "司法大臣への願い出も、数回いずれも届かなかった。"}, {"t": 545.7333333333333, "x": "1935年3月21日、秋田刑務所から仮出獄が許された。"}, {"t": 550.95, "x": "服役は20年4か月19日に及んでいた。"}, {"t": 554.0833333333334, "x": "やっと外に出られたのね。"}, {"t": 555.8333333333334, "x": "外に出て、まず向かったのは秋田警察署だった。"}, {"t": 559.0666666666667, "x": "警察に？　何のために？"}, {"t": 560.8833333333333, "x": "あの2人の居場所を探してほしいと頼むためだ。"}, {"t": 563.6666666666666, "x": "決定は、出所するやその足でと書いている。"}, {"t": 566.5166666666667, "x": "自由になって最初にしたのがそれなのね。"}, {"t": 569.1, "x": "そのあとは屑屋をしながら2人を探し歩いた。"}, {"t": 572.4833333333333, "x": "出所の2日後の3月23日。"}, {"t": 574.95, "x": "吉田は、東京の裁判所の記者クラブに姿を見せた。"}, {"t": 578.4333333333333, "x": "そこで出会った記者が、のちに国会で話している。"}, {"t": 581.4833333333333, "x": "翌日、記者3人で公園の店へ連れて行き、話を聞いた。"}, {"t": 585.5, "x": "記者は信じてくれたの？"}, {"t": 587.1166666666667, "x": "まず獄中で書いた手記を見せられた。"}, {"t": 589.3333333333334, "x": "字はつたなく当て字が多く、読むのに苦労したという。"}, {"t": 592.3833333333333, "x": "それでも切々と胸を打ったと記者は語った。"}, {"t": 595.3166666666667, "x": "裁判所の書類とはまるで違うものだったのね。"}, {"t": 598.2166666666667, "x": "毎日見る裁判の記録とは本質的に\n違う、と記者は感じたそうだ。"}, {"t": 603.2166666666667, "x": "記者たちはある弁護士に相談した。"}, {"t": 605.3666666666667, "x": "検事として長い経験を持つ人だった。"}, {"t": 608.0166666666667, "x": "元検事なら厳しく見そうね。"}, {"t": 610.05, "x": "記者もそう思っていた。だめと\n言われたら諦めるつもりだった。"}, {"t": 613.6166666666667, "x": "弁護士は記録を取り寄せて、細かく読んだ。"}, {"t": 616.3166666666667, "x": "返ってきた答えは、この事件はいけるぜ、だった。"}, {"t": 619.55, "x": "検事だった人がそう言ったのね。"}, {"t": 621.6666666666666, "x": "2審は証拠の点でだいぶ弱いとも話したそうだ。"}, {"t": 625.2333333333333, "x": "4月の下旬に、1人目の居場所が分かった。"}, {"t": 628.0166666666667, "x": "玄翁を持った男が神戸の救護院にいた。"}, {"t": 630.6, "x": "4月24日、吉田は名古屋新聞の記者と\n救護院を訪ねた。"}, {"t": 634.8166666666667, "x": "20年以上たって本人と向き合ったのね。"}, {"t": 637.5333333333333, "x": "院長も同じ部屋に立ち会った。"}, {"t": 639.4333333333333, "x": "記者の会見記が決定に引かれている。"}, {"t": 641.8166666666667, "x": "なぜ俺を罪に巻き込んだのか、と吉田は問うた。"}, {"t": 644.75, "x": "男は、申しわけない、お前には\n罪はなかったのだと答えた。"}, {"t": 648.6666666666666, "x": "その場で認めたの？"}, {"t": 650.0833333333334, "x": "2人とも涙を流していたと記者は書いている。"}, {"t": 652.9833333333333, "x": "どうして吉田さんの名前を出したの？"}, {"t": 655.2666666666667, "x": "男の説明はこうだ。"}, {"t": 656.7666666666667, "x": "取り調べで石松も一緒だったろうと言われた。"}, {"t": 659.4333333333333, "x": "自分の罪を少しでも軽くしたくて、つい\n首謀者にしてしまった。"}, {"t": 663.5166666666667, "x": "心にもないことを言ったのね。"}, {"t": 665.4666666666667, "x": "吉田と男はもともと一面識も無かったという。"}, {"t": 668.4833333333333, "x": "男は筆で書いて無罪を証明すると約束した。"}, {"t": 671.5333333333333, "x": "そして謝りの覚書を書いた。"}, {"t": 674.15, "x": "道を教えた男の居場所は、なかなか分からなかった。"}, {"t": 677.3833333333333, "x": "新聞社の通信網で埼玉にいることがつかめた。"}, {"t": 680.45, "x": "1936年12月14日、都新聞の記者が吉田と訪ねた。"}, {"t": 685.3333333333334, "x": "こちらの人はどんな様子だったの？"}, {"t": 687.5166666666667, "x": "記者の証言では男は道ばたに崩れた。"}, {"t": 690.1333333333333, "x": "四つんばいになって頭を下げたという。"}, {"t": 692.3, "x": "事件に巻き込んですまなかったと言ったそうだ。"}, {"t": 695.05, "x": "2人とも謝ったのね。"}, {"t": 696.7333333333333, "x": "この男も詫び状を書いた。"}, {"t": 698.3666666666667, "x": "記者は写真部でその詫び状を見た、と\n国会で話している。"}, {"t": 702.4666666666667, "x": "2人が謝ったなら、今度こそやり直せるでしょ？"}, {"t": 705.5666666666667, "x": "1937年、弁護士が大審院へ3回目の再審を請求した。"}, {"t": 710.2666666666667, "x": "新しい証拠は2人の偽証の自白と詫び状だ。"}, {"t": 713.3166666666667, "x": "それでどうなったの？"}, {"t": 714.6166666666667, "x": "結果が出たのは、戦争の末期の1944年だった。"}, {"t": 718.5, "x": "棄却だ。"}, {"t": 719.6333333333333, "x": "えっ、また駄目だったの？"}, {"t": 721.35, "x": "裁判所は2人だけを尋問した、と弁護士は説明した。"}, {"t": 724.9666666666667, "x": "2人はそこで、詫び状を書いたことを否認したという。"}, {"t": 728.0666666666667, "x": "立ち会った記者や院長は調べられなかった。"}, {"t": 730.6, "x": "のちに弁護士は国会でこう述べている。"}, {"t": 732.8666666666667, "x": "周りの人まで調べていれば、昭和12、\n13年に開始が認められたはずだ。"}, {"t": 737.9, "x": "そこで晴れていれば25年も早かったのね。"}, {"t": 740.7, "x": "弁護士はそれを裁判所の審理の粗雑さと呼んだ。"}, {"t": 743.7, "x": "そして戦争の中でもう一つ失われた物がある。"}, {"t": 746.9, "x": "まさか詫び状？"}, {"t": 748.0833333333334, "x": "そうだ。詫び状は戦災で焼けて、無くなってしまった。"}, {"t": 751.5666666666667, "x": "やっと手に入れた証拠が灰になったのね。"}, {"t": 754.55, "x": "戦争が終わって吉田は農業に戻った。"}, {"t": 757.0, "x": "暮らしは苦しかったが、不正には加わらなかった。"}, {"t": 760.05, "x": "前科も隠さず村で無実を言い続けた。"}, {"t": 762.6833333333333, "x": "周りの人はどう受け止めたの？"}, {"t": 764.6666666666666, "x": "その声がだんだん村の人の胸を\n打った、と決定にある。"}, {"t": 768.0833333333334, "x": "隣の町村も合わせて、600名が再審を願う署名をした。"}, {"t": 772.15, "x": "600人も味方になってくれたのね。"}, {"t": 774.6333333333333, "x": "法務省の人権擁護の部署も調べに動いた。"}, {"t": 777.4, "x": "戦後、記者たちは吉田の消息を新聞で知った。"}, {"t": 780.5333333333333, "x": "1952年6月ごろ、ある新聞に記事が出た。"}, {"t": 784.1333333333333, "x": "吉田石松が栃木県で生きている。"}, {"t": 786.5, "x": "記者さんたちは驚いたでしょうね。"}, {"t": 788.5666666666667, "x": "事件は法務局の人権擁護の係へ移された。"}, {"t": 791.6333333333333, "x": "そこから長い付き合いが続いた、と\nその記者は話している。"}, {"t": 795.7666666666667, "x": "戦後にはラジオ局も動いた。"}, {"t": 797.6166666666667, "x": "ラジオ東京が、吉田と道を教えた\n男を向き合わせて録音した。"}, {"t": 801.75, "x": "本人どうしを会わせたの？"}, {"t": 803.4333333333333, "x": "そうだ。記者は、吉田が手を\n下したのは事実かと尋ねた。"}, {"t": 807.1666666666666, "x": "男の答えは、いいや、そんなことは知らない、だった。"}, {"t": 810.65, "x": "はっきり否定したのね。"}, {"t": 812.2666666666667, "x": "判こを押せと言われたから押したとも弁解した。"}, {"t": 814.9833333333333, "x": "最後にはわしが悪かったと認めたという。"}, {"t": 817.4, "x": "この録音の速記録も決定の中に引かれている。"}, {"t": 820.4666666666667, "x": "法務省の事務官もこの男から話を聞いた。"}, {"t": 823.3166666666667, "x": "1953年4月10日と、1955年6月22日の調査書が残る。"}, {"t": 829.25, "x": "その書類には何と書いてあったの？"}, {"t": 831.4, "x": "警察で厳しく調べられて、夢中でしゃべってしまった。"}, {"t": 834.7833333333333, "x": "一度しゃべったので公判でもその通り述べた。"}, {"t": 837.4333333333333, "x": "そういう説明だったという。"}, {"t": 839.1833333333333, "x": "最初の話がそのまま裁判まで続いたのね。"}, {"t": 842.1833333333333, "x": "吉田に悪いことをしたと思うとも述べている。"}, {"t": 845.3833333333333, "x": "1957年9月18日、4回目の再審請求が\n名古屋高裁に出された。"}, {"t": 850.9333333333333, "x": "弁護人は16名いた。"}, {"t": 852.65, "x": "今度は大勢ついてくれたのね。"}, {"t": 854.6, "x": "ところが1959年7月15日、これも棄却された。"}, {"t": 858.8166666666667, "x": "最高裁への抗告も8月31日に退けられた。"}, {"t": 862.6166666666667, "x": "何度やっても扉が開かないのね。"}, {"t": 864.9166666666666, "x": "このときも1人分の偽証しか\n調べなかった、と弁護士は述べた。"}, {"t": 869.4833333333333, "x": "その年の3月、国会で初めて名前が出た。"}, {"t": 872.5833333333334, "x": "衆議院の法務委員会で議員が取り上げた。"}, {"t": 875.0666666666667, "x": "栃木県に79歳の老人がいる。"}, {"t": 877.5333333333333, "x": "45年間も無実を叫び続けている。"}, {"t": 880.1833333333333, "x": "もし叫ぶ通り無実なら、国はもはや償う道が全然ない。"}, {"t": 884.1, "x": "議員はそこまで言ったのね。"}, {"t": 885.8, "x": "当時の刑事補償は、1日200円から\n300円だったという。"}, {"t": 889.6833333333333, "x": "翌日には人権擁護局が調べているかも尋ねた。"}, {"t": 892.95, "x": "最近の新聞をにぎわしているとも議員は述べた。"}, {"t": 895.95, "x": "新聞にもだんだん載るようになったのね。"}, {"t": 898.8666666666667, "x": "同じ1959年の秋、法務省の廊下でのことだ。"}, {"t": 902.6833333333333, "x": "1人の検事が、守衛ともめている老人を見かけた。"}, {"t": 905.8833333333333, "x": "老人は法務大臣に会わせろと言っていた。"}, {"t": 908.4833333333333, "x": "それが吉田さん？"}, {"t": 909.7166666666667, "x": "そうだ。検事は自分の部屋へ\n連れて行き、話を聞いた。"}, {"t": 913.1166666666667, "x": "話は理路整然として、いかにも真実味があったという。"}, {"t": 916.65, "x": "検事さんが耳を傾けてくれたのね。"}, {"t": 919.1, "x": "ただ省の中では取り上げられない。"}, {"t": 921.0333333333333, "x": "検事はその足で、日本弁護士連合会へ\n吉田を連れて行った。"}, {"t": 924.7833333333333, "x": "この話は、日弁連の元事務総長が国会で語っている。"}, {"t": 928.7833333333333, "x": "日弁連はすぐに信じてくれたの？"}, {"t": 931.05, "x": "担当の部長ははじめは疑っていた。"}, {"t": 933.3333333333334, "x": "本当は犯人なのに無実を装う人もいるからだ。"}, {"t": 936.4666666666667, "x": "そこで部長は自分で吉田に会った。"}, {"t": 938.6166666666667, "x": "するとうそではないと身をもって感じたという。"}, {"t": 941.2333333333333, "x": "会って話すと伝わるものがあったのね。"}, {"t": 943.65, "x": "下調べには約1年をかけた、と日弁連の会長は話した。"}, {"t": 947.7, "x": "冤罪だと確信してから手続きに入ったそうだ。"}, {"t": 950.7166666666667, "x": "委員会は総員一致で無実と\n考えた、と別の弁護士も述べた。"}, {"t": 954.7, "x": "訴えは数多く来るが、全部を\n取り上げるわけではないとも話した。"}, {"t": 959.2, "x": "ただ調べるにはお金がかかる。"}, {"t": 961.0666666666667, "x": "日弁連の人権擁護委員会の予算は、\n年に150万円だった。"}, {"t": 965.4333333333333, "x": "それって多いの？　少ないの？"}, {"t": 967.3666666666667, "x": "全国の委員が集まる旅費と\n昼食代で、すぐ無くなる額だそうだ。"}, {"t": 971.5166666666667, "x": "そこで、新しく委員長になった\n弁護士が費用を負担した。"}, {"t": 975.1333333333333, "x": "その額は数百万円に上った。"}, {"t": 977.4, "x": "自分のお金で調べたのね。"}, {"t": 979.2833333333333, "x": "弁護士たちは自分の負担で\n動いていた、と議員も述べている。"}, {"t": 982.8333333333334, "x": "日弁連の会長はのちに、次の事件には\n800万円は要ると話した。"}, {"t": 987.45, "x": "同じだけ調べるにはそれだけかかるのね。"}, {"t": 990.5333333333333, "x": "1960年11月28日、5回目の再審請求が出された。"}, {"t": 995.4333333333333, "x": "人権擁護委員たちが連名で弁護人になった。"}, {"t": 998.4166666666666, "x": "今度は何が新しい証拠になったの？"}, {"t": 1000.8333333333334, "x": "1つは、2人がかつて偽証を\n認め詫び状を出していた事実。"}, {"t": 1004.6, "x": "詫び状そのものは焼けたので、事実として示した。"}, {"t": 1007.7833333333333, "x": "もう1つは新しく探し出した2人の証人だ。"}, {"t": 1010.9166666666666, "x": "どんな証人なの？"}, {"t": 1012.2666666666667, "x": "事件の夜、吉田が\n別の場所にいたことを話す人たちだ。"}, {"t": 1015.95, "x": "アリバイの成立を明らかにする\n証拠だ、と決定は書いている。"}, {"t": 1019.55, "x": "日弁連の会長は、この3年7\nか月を振り返ってこう話した。"}, {"t": 1023.7166666666667, "x": "勝ったと思えばまた負けてしまう。"}, {"t": 1025.75, "x": "まさに一進一退だったのね。"}, {"t": 1027.7166666666667, "x": "名古屋高裁は昔の記者も証人として呼んだ。"}, {"t": 1030.6, "x": "救護院と埼玉で謝る場面に立ち会った2人だ。"}, {"t": 1033.8166666666666, "x": "四半世紀も前のことを覚えていたの？"}, {"t": 1036.1666666666667, "x": "会見の細かい言葉までは\n覚えていない、と1人は答えた。"}, {"t": 1039.7666666666667, "x": "ただ新聞の記事はありのまま書いたと述べた。"}, {"t": 1042.3333333333333, "x": "裁判所はその証言を録音した。"}, {"t": 1044.6333333333334, "x": "書き取りだけじゃなかったのね。"}, {"t": 1046.5166666666667, "x": "録音を直接聴けば信用の高さが\n分かる、と決定は書いた。"}, {"t": 1051.05, "x": "1961年4月11日、\n名古屋高裁の第4部が決定を出した。"}, {"t": 1056.0666666666666, "x": "本件について再審を開始する。"}, {"t": 1058.2666666666667, "x": "とうとうやり直しが決まったのね。"}, {"t": 1060.3, "x": "裁判長は小林。のちに無罪を言い渡す人だ。"}, {"t": 1063.4333333333334, "x": "決定は、確定の重さと真実の求めの調和を説いた。"}, {"t": 1066.9666666666667, "x": "確定を重んじすぎると、かえって\n裁判の威信を傷つけるとした。"}, {"t": 1071.0166666666667, "x": "裁判所がそこまで書いたのね。"}, {"t": 1073.0333333333333, "x": "異例といわれるほどの勇気だ、と\n弁護士は国会で述べた。"}, {"t": 1077.0, "x": "喜びは3日しか続かなかった。"}, {"t": 1079.1666666666667, "x": "4月14日、検察官が異議を申し立てた。"}, {"t": 1082.3166666666666, "x": "異議って決定に反対するってこと？"}, {"t": 1084.65, "x": "そうだ。弁護士たちは、\n名古屋の検事長にも会っていた。"}, {"t": 1088.05, "x": "結果はどうでもいいから\n裁判だけはさせてほしい、と頼んだ。"}, {"t": 1091.65, "x": "それでも異議が出たのね。"}, {"t": 1093.2333333333333, "x": "異議は同じ名古屋高裁の第5部が受け持った。"}, {"t": 1095.9, "x": "1962年1月30日、第5部の判断が出た。"}, {"t": 1099.95, "x": "開始決定を取り消し再審請求を棄却する。"}, {"t": 1103.0, "x": "一度開いた扉がまた閉まったの？"}, {"t": 1105.3, "x": "そうだ。弁護士たちは最高裁へ特別抗告をした。"}, {"t": 1108.6666666666667, "x": "その中で第5部の判事の1人にも触れている。"}, {"t": 1111.4666666666667, "x": "数年前に、吉田の請求を退けた裁判官だったという。"}, {"t": 1115.35, "x": "同じ人がもう一度判断していたのね。"}, {"t": 1117.9333333333334, "x": "それを公平を欠くとして、憲法違反の理由に挙げた。"}, {"t": 1121.8, "x": "どうして再審はこんなに通りにくいの？"}, {"t": 1124.1833333333334, "x": "弁護士は国会でこう説明している。"}, {"t": 1126.45, "x": "再審の道は確かに法律にある。"}, {"t": 1128.65, "x": "でも弁護人の請求で許された例は、おそらく無い。"}, {"t": 1131.9, "x": "道はあるのに誰も通れていないのね。"}, {"t": 1134.1666666666667, "x": "裁判官から見ると、同僚や\n先輩の判決を覆すことになる。"}, {"t": 1138.3166666666666, "x": "それは人情のうえで非常に\n難しい、と弁護士は述べた。"}, {"t": 1141.7833333333333, "x": "仲間の間違いは認めにくいってことね。"}, {"t": 1144.3333333333333, "x": "過去の請求は先入観で書類だけで\n退けられた、と日弁連の会長も語った。"}, {"t": 1150.0333333333333, "x": "取り消しから1か月後の1962年2月28日。"}, {"t": 1154.1166666666666, "x": "衆議院の法務委員会に、\n吉田が参考人として呼ばれた。"}, {"t": 1157.8666666666666, "x": "本人が国会に来たのね。"}, {"t": 1159.75, "x": "栃木から出てきた。弁護士は83歳だと説明した。"}, {"t": 1163.4666666666667, "x": "席に着くにも付き添いが要る\n体だった、と議員が述べた。"}, {"t": 1166.95, "x": "議員は、当時の事件を追った\n新聞記者にも会っていた。"}, {"t": 1170.1666666666667, "x": "記者は、無罪を確信していると話したそうだ。"}, {"t": 1173.0833333333333, "x": "この日、議員は開始決定の全文を読み上げた。"}, {"t": 1176.15, "x": "決定を国会の記録に残すため？"}, {"t": 1178.55, "x": "そう言っていた。だから今も会議録で読める。"}, {"t": 1181.8833333333334, "x": "吉田の発言はこう始まる。"}, {"t": 1183.75, "x": "私は耳が聞こえない。目もみえない。"}, {"t": 1186.0333333333333, "x": "病気ではなくひどい扱いでつぶれたと続けた。"}, {"t": 1189.0, "x": "本人の声がそのまま記録に残っているのね。"}, {"t": 1191.95, "x": "衆議院が取り上げたことが、\nうれしくてうれしくて、と言った。"}, {"t": 1195.4666666666667, "x": "この国民を救い国家の法を救ってほしいとも訴えた。"}, {"t": 1199.0, "x": "自分のことより制度のことを言っていたのね。"}, {"t": 1201.65, "x": "裁判は証拠の物を並べてからするものだ、とも話した。"}, {"t": 1205.2166666666667, "x": "話は途中から何度もあちこちへ飛んだ。"}, {"t": 1207.7, "x": "高齢で順序立てて話すのは\n難しい、と弁護士は説明した。"}, {"t": 1211.55, "x": "判断は在監中の膨大な記録で\n行った、とも付け加えた。"}, {"t": 1215.3666666666666, "x": "興奮しすぎないように、気をつけてもらっていたのね。"}, {"t": 1218.55, "x": "親族の付き添いから、健康を心配する声が出ていた。"}, {"t": 1221.9833333333333, "x": "この日、取り上げた議員はこう問いかけた。"}, {"t": 1224.4166666666667, "x": "最高裁が退けたら、吉田はどこへ訴えたらよいのか。"}, {"t": 1227.9333333333334, "x": "強盗殺人の汚名を着たまま、世を去らねばならない。"}, {"t": 1231.2166666666667, "x": "最後の望みが最高裁だったのね。"}, {"t": 1233.55, "x": "議員は、道を教えた男も\n委員会に呼びたいと提案した。"}, {"t": 1237.0833333333333, "x": "立ち会った記者2人も一緒に呼ぼうとした。"}, {"t": 1239.6666666666667, "x": "国会で本当のことを話してもらうために？"}, {"t": 1242.4166666666667, "x": "そうだ。委員長は次の理事会に諮ると答えた。"}, {"t": 1246.1166666666666, "x": "翌日、植木法務大臣が委員会で答えた。"}, {"t": 1249.0666666666666, "x": "きのう本人の顔を見て発言も聞いた。"}, {"t": 1251.4666666666667, "x": "全く感慨無量だったと大臣は語った。"}, {"t": 1254.2833333333333, "x": "大臣もあの場にいたのね。"}, {"t": 1256.0166666666667, "x": "そしてこう続けた。"}, {"t": 1257.3333333333333, "x": "もし吉田氏の言う通りなら、国家として\n何とおわびしていいかわからぬ。"}, {"t": 1261.45, "x": "大臣がそこまで言ったの？"}, {"t": 1263.2, "x": "ただ、最高裁で審理中なので結論を待ちたいとした。"}, {"t": 1266.7, "x": "書類が焼けて無くなっている\n部分もあるそうだ、とも述べた。"}, {"t": 1270.0666666666666, "x": "再審の制度は狭められていて\n見直しが要るのでは、とも話した。"}, {"t": 1274.5666666666666, "x": "1962年3月、法務委員会の中に\n小さな委員会ができた。"}, {"t": 1279.25, "x": "名前は再審制度調査小委員会。"}, {"t": 1281.5833333333333, "x": "吉田さんの件がきっかけ？"}, {"t": 1283.45, "x": "小委員長の議員がそう説明している。"}, {"t": 1285.7833333333333, "x": "与党も野党も加わって、再審の決まりを見直した。"}, {"t": 1289.0333333333333, "x": "学者や弁護士が次々と参考人に呼ばれた。"}, {"t": 1292.1, "x": "1人の訴えが国会の仕組みまで動かしたのね。"}, {"t": 1295.1833333333334, "x": "共犯の自白に頼るのは危ない、と\n参考人の学者は指摘した。"}, {"t": 1299.9333333333334, "x": "小委員会では、こんな問いも出た。"}, {"t": 1302.05, "x": "英米には、法廷の外の行動を\n証拠とする考え方がある。"}, {"t": 1305.7666666666667, "x": "40数年、一貫して無実を言い続けたこと\n自体が、証拠にならないか。"}, {"t": 1310.5333333333333, "x": "言い続けたこと自体が、証拠になるの？"}, {"t": 1313.15, "x": "弁護士は、再審の請求書でまさに\nそこを強く書いた、と答えた。"}, {"t": 1317.3166666666666, "x": "第4部はそれを考えたが、\n第5部は全く考えなかったという。"}, {"t": 1321.25, "x": "弁護士は、元の判決をわら一本で\nつぶれる弱い判決とまで言った。"}, {"t": 1325.6166666666666, "x": "判決の土台は、それほど細かったのね。"}, {"t": 1328.95, "x": "1962年の秋、最高裁の判断が出た。"}, {"t": 1332.4666666666667, "x": "第5部の決定を取り消し、検察官の異議を退けた。"}, {"t": 1336.05, "x": "じゃあ再審が復活したのね！"}, {"t": 1338.0666666666666, "x": "裁判官13名の全員一致だったと議員が述べた。"}, {"t": 1341.45, "x": "理由は何だったの？"}, {"t": 1342.8333333333333, "x": "大正の事件なので、古い\n刑事訴訟法で扱うべきだった。"}, {"t": 1346.5833333333333, "x": "古い法律では、この場合の検察官の異議は\n許されていない。"}, {"t": 1350.2333333333333, "x": "だから異議そのものが違法だったという判断だ。"}, {"t": 1353.0666666666666, "x": "それって、ずっと前から分かっていたことじゃないの？"}, {"t": 1356.0833333333333, "x": "弁護士は国会で正直にこう話している。"}, {"t": 1358.7166666666667, "x": "4回目と5回目の請求では、誰もが\n新しい法律を当てはめていた。"}, {"t": 1362.9666666666667, "x": "弁護人も裁判官も検察官も、みんな取り違えていた。"}, {"t": 1366.8, "x": "みんな気づいていなかったの？"}, {"t": 1368.55, "x": "異議の段階で弁護人が初めて気づいたそうだ。"}, {"t": 1371.3666666666666, "x": "その気づきが最高裁の判断につながった。"}, {"t": 1374.2166666666667, "x": "最後の扉は法律の読み直しで開いたのね。"}, {"t": 1377.7, "x": "1962年12月6日、名古屋高裁で\n再審の公判が始まった。"}, {"t": 1382.6833333333334, "x": "翌日の法務委員会で議員がその様子を伝えた。"}, {"t": 1385.7166666666667, "x": "テレビもラジオも新聞も、一斉に報じたという。"}, {"t": 1388.75, "x": "みんなが見守っていたのね。"}, {"t": 1390.5166666666667, "x": "町には同情の動きが広がったと議員は述べた。"}, {"t": 1393.4, "x": "公判は年をまたいで1月と2月にも開かれた。"}, {"t": 1396.65, "x": "やり直しの裁判で、検察はどう出たの？"}, {"t": 1399.35, "x": "立ち会った検事は有罪を\n主張した、と議員が述べている。"}, {"t": 1402.7, "x": "判決の前に、無期懲役の論告をした。"}, {"t": 1405.6, "x": "50年前と同じ求め方なのね。"}, {"t": 1408.0333333333333, "x": "そのとき本人はひどく興奮したという。"}, {"t": 1410.45, "x": "検事に会いに行く、と言い出した。"}, {"t": 1412.4, "x": "拘置所の前の小さな旅館で、\n元記者と議員がなだめた。"}, {"t": 1416.1, "x": "周りの人が支えてくれていたのね。"}, {"t": 1418.9333333333334, "x": "そして冒頭の1963年2月28日に戻る。"}, {"t": 1422.9333333333334, "x": "判決は無罪だった。"}, {"t": 1424.5, "x": "やっと、やっとね。"}, {"t": 1425.9333333333334, "x": "法廷には、委員会でこの件を取り上げた議員もいた。"}, {"t": 1429.0666666666666, "x": "本人と家族に頼まれて立ち会っていたそうだ。"}, {"t": 1431.8333333333333, "x": "本人は判決がよく聞き取れなかったらしい。"}, {"t": 1434.4833333333333, "x": "議員が口を耳に当てて無罪だぞと言った。"}, {"t": 1437.1, "x": "それで吉田さんは？"}, {"t": 1438.4666666666667, "x": "涙を流していた、と議員は翌日の委員会で話した。"}, {"t": 1441.9666666666667, "x": "傍聴席では声を上げて泣く人もいたという。"}, {"t": 1444.6, "x": "議員がのちに会議録に残した、判決の結びはこうだ。"}, {"t": 1448.1833333333334, "x": "被告人、いな、被告人というに\n忍びず、吉田翁と呼ぼう。"}, {"t": 1452.2166666666667, "x": "われわれの先輩が翁に対して\nおかした過誤を、ひたすら陳謝する。"}, {"t": 1456.3666666666666, "x": "先輩って昔の裁判官たちのことね。"}, {"t": 1459.1166666666666, "x": "そうだ。半世紀にわたり、迫害に耐えたことも称えた。"}, {"t": 1462.7, "x": "その不撓不屈の精神力に、\n深甚なる敬意を表すとした。"}, {"t": 1466.5833333333333, "x": "最後は、翁の余生に幸多から\nんことを祈念する、で終わる。"}, {"t": 1470.4, "x": "判決がお祈りの言葉で終わっているのね。"}, {"t": 1473.0166666666667, "x": "裁判所が判決で謝ったのは\nあのときだけだ、とのちに議員は述べた。"}, {"t": 1477.8666666666666, "x": "検察はまた上告したりしなかったの？"}, {"t": 1480.4166666666667, "x": "翌3月1日、議員が中垣法務大臣にそれを尋ねた。"}, {"t": 1484.3666666666666, "x": "裁判が長引けば本人の命が\n保証されない、と議員は訴えた。"}, {"t": 1488.3666666666666, "x": "大臣は、個人的には非常に喜んでいると答えた。"}, {"t": 1491.7166666666667, "x": "ほっとしておるのが偽らない気持ちだとも述べた。"}, {"t": 1494.6666666666667, "x": "上告については？"}, {"t": 1496.0, "x": "決めるのは検事総長の責任だと前置きした。"}, {"t": 1498.9166666666667, "x": "そのうえで、個人の立場では\n上告しない方がいいと答えた。"}, {"t": 1502.5166666666667, "x": "3月25日には参議院で、無罪が\n確定したと議員が述べている。"}, {"t": 1507.4333333333334, "x": "3月22日、小委員会にあの検事が参考人として来た。"}, {"t": 1511.5, "x": "法務省の廊下で吉田に声をかけた人だ。"}, {"t": 1514.2666666666667, "x": "あの検事さんが国会に？"}, {"t": 1516.0, "x": "再審が開く例は何万件に一件だと説明した。"}, {"t": 1519.2666666666667, "x": "たまに閉じた事件を開いても、\n法の安定は崩れないとした。"}, {"t": 1522.95, "x": "吉田の件がそのよい例だと言った。"}, {"t": 1525.0666666666666, "x": "世の中の安心は少しも乱されなかったと述べた。"}, {"t": 1528.2833333333333, "x": "むしろ裁判所を見直した人が多かったのね。"}, {"t": 1531.1166666666666, "x": "国民は裁判長の英断を尊敬したとも話している。"}, {"t": 1534.4333333333334, "x": "ただ、この検事には逆風も吹いていた。"}, {"t": 1536.9166666666667, "x": "6月の委員会で、議員が\nその検事の雑誌の文を読み上げた。"}, {"t": 1540.6833333333334, "x": "吉田の再審を助けたことで、検察の一部が硬化した。"}, {"t": 1544.4, "x": "小委員会に呼ばれたときも、\n省の一部が止めようとした。"}, {"t": 1547.95, "x": "正しいと思って動いたのに？"}, {"t": 1549.8166666666666, "x": "議員は、この検事が函館へ\n移されたことを大臣に質した。"}, {"t": 1553.7333333333333, "x": "吉田さんを助けた人にも、\n重いものがのしかかったのね。"}, {"t": 1557.95, "x": "無実で20年以上入っていたなら、国は償ったのよね？"}, {"t": 1561.7, "x": "刑事補償という仕組みでお金が支払われた。"}, {"t": 1564.35, "x": "1964年に、法務省の参事官が\n国会で金額を答えている。"}, {"t": 1569.0, "x": "合計315万5600円。"}, {"t": 1571.35, "x": "1日あたり400円の割合だった。"}, {"t": 1573.8, "x": "人生の大半を奪われてそれだけ？"}, {"t": 1576.1, "x": "気の毒だというのが世論だったと議員は述べた。"}, {"t": 1578.8, "x": "そのあと1日の額は1000円に\n改められた、とも議員は話した。"}, {"t": 1582.7833333333333, "x": "国会は、冤罪の補償をさらに\n見直すよう附帯決議も付けた。"}, {"t": 1586.7666666666667, "x": "吉田さんの件が補償の議論も動かしたのね。"}, {"t": 1590.2333333333333, "x": "判決のあと、裁判所には全国からはがきが届いた。"}, {"t": 1593.75, "x": "1966年に議員が国会でそう紹介している。"}, {"t": 1597.45, "x": "どんなはがきだったの？"}, {"t": 1598.95, "x": "感謝の言葉や詩や歌が書かれていたという。"}, {"t": 1601.4666666666667, "x": "議員はそれを見せてもらったと話した。"}, {"t": 1603.8666666666666, "x": "判決が人の心を動かしたのね。"}, {"t": 1606.3333333333333, "x": "小林裁判長は裁判のあとすぐ\n弁護士になった、とも議員は述べた。"}, {"t": 1611.2, "x": "無罪から3か月後、\n衆議院の法務委員会がまた開かれた。"}, {"t": 1615.0, "x": "呼ばれたのは、吉田を支えた弁護士や元記者たちだ。"}, {"t": 1618.4666666666667, "x": "みんなで、50年を振り返ったのね。"}, {"t": 1620.8666666666666, "x": "小委員長は、経過を詳しく聞いて\n今後の参考にしたい、と述べた。"}, {"t": 1624.9833333333333, "x": "元記者は、記者は白紙で事件に\n向き合うものだと話した。"}, {"t": 1628.5833333333333, "x": "うそであってはならない、とも語っている。"}, {"t": 1631.0333333333333, "x": "最初に手記を読んだ人の言葉だから、重いわね。"}, {"t": 1634.2333333333333, "x": "この日の話の多くが、今回の台本のもとになっている。"}, {"t": 1638.4166666666667, "x": "吉田石松は、無罪の判決から9か月後に亡くなった。"}, {"t": 1642.1833333333334, "x": "2002年の参議院の憲法調査会で、\n元の日弁連の委員長が語った。"}, {"t": 1647.0666666666666, "x": "裁判長が祈った余生は1年もなかったのね。"}, {"t": 1650.0666666666666, "x": "無罪のときは84歳になっていた、と\n元委員長は話した。"}, {"t": 1654.0166666666667, "x": "1977年には議員がこうも述べている。"}, {"t": 1657.0666666666666, "x": "肩身の狭い思いをしてきた\n親兄弟は、もう世を去っていた。"}, {"t": 1660.7333333333333, "x": "一緒に喜んでほしかった人がもういなかったのね。"}, {"t": 1663.85, "x": "失われた50年を償うすべは無いと議員は言った。"}, {"t": 1666.95, "x": "1979年には、元の日弁連会長が\n参考人として問いかけた。"}, {"t": 1671.9666666666667, "x": "この50年の彼の人生はどうであったか。"}, {"t": 1675.15, "x": "吉田さんのあと再審を求める人は増えたの？"}, {"t": 1678.05, "x": "1965年に議員がこう述べている。"}, {"t": 1680.75, "x": "吉田の事件以来、\n再審の請求がほうはいとして生まれてきた。"}, {"t": 1684.7, "x": "ほうはいって、波が一気に押し寄せる感じね。"}, {"t": 1687.5833333333333, "x": "声を上げられなかった人たちが、\n動き出したということだ。"}, {"t": 1691.0333333333333, "x": "日弁連の会長も、ほかの死刑囚の事件に\n取りかかろうとしていた。"}, {"t": 1695.3833333333334, "x": "吉田さんの50年がほかの人の道も開いたのね。"}, {"t": 1699.2333333333333, "x": "再審の決まりそのものは変わったの？"}, {"t": 1701.55, "x": "小委員会は何度も参考人を呼んで議論した。"}, {"t": 1704.35, "x": "50年かかった原因は法の不備と\n審理の粗雑さだ、と弁護士は述べた。"}, {"t": 1708.7666666666667, "x": "一方で慎重な意見の学者もいた。"}, {"t": 1711.0166666666667, "x": "大正の記録が全部残っていても、\n心証をとるのは難しいという。"}, {"t": 1715.1666666666667, "x": "古い事件をやり直すこと自体が難しいってことね。"}, {"t": 1718.4666666666667, "x": "その議論は長く続くことになった。"}, {"t": 1720.75, "x": "2018年にも、議員がこの小委員会を振り返っている。"}, {"t": 1724.3833333333334, "x": "2026年6月にも、再審法の見直しの中で名前が出た。"}, {"t": 1728.8333333333333, "x": "60年以上たってもまだ話し合っているのね。"}, {"t": 1731.75, "x": "吉田の件は、いまも議論の出発点として語られている。"}, {"t": 1736.0166666666667, "x": "ねえ、ここまでを短く並べてくれる？"}, {"t": 1738.45, "x": "いいだろう。まずは会議録に日付があることからだ。"}, {"t": 1741.4333333333334, "x": "1913年8月13日の夜、荷車の男性が\n殺され1円20銭が奪われた。"}, {"t": 1747.3666666666666, "x": "1914年に死刑のあと\n無期懲役になり、11月に確定した。"}, {"t": 1751.9833333333333, "x": "1935年3月21日に仮出獄し、\nその年と翌年に2人の謝罪をとった。"}, {"t": 1758.1166666666666, "x": "1961年4月11日に再審の開始が決まった。"}, {"t": 1762.25, "x": "1963年2月28日に無罪の判決が出た。"}, {"t": 1766.45, "x": "その間に再審の請求は何回あったの？"}, {"t": 1769.2166666666667, "x": "5回だ。最後の5回目でようやく開いた。"}, {"t": 1771.85, "x": "次に会議録だけでは分からないことだ。"}, {"t": 1774.25, "x": "事件の夜に本当は何が起きたのか。"}, {"t": 1776.6666666666667, "x": "最初の裁判の記録の大半は戦災で焼けている。"}, {"t": 1779.8666666666666, "x": "だから誰が何をしたかはもう分からないのね。"}, {"t": 1782.5666666666666, "x": "確かなのは、吉田を有罪とする\n決め手が無かったことだ。"}, {"t": 1786.7166666666667, "x": "最後に1935年3月21日の秋田に戻ろう。"}, {"t": 1790.7333333333333, "x": "20年ぶりに外へ出た吉田は、\nまっすぐ警察署へ向かった。"}, {"t": 1794.4666666666667, "x": "あの2人を探してほしいと頼むためだった。"}, {"t": 1797.2, "x": "自分を罪に巻き込んだ2人を、自分で探したのね。"}, {"t": 1800.6, "x": "そして本当に見つけ出して詫び状を書かせた。"}, {"t": 1803.3333333333333, "x": "その詫び状は焼けたが、話は\n記者の証言として残った。"}, {"t": 1807.1, "x": "最後は、見ていた人たちの言葉が助けになったのね。"}, {"t": 1810.6166666666666, "x": "記者、検事、弁護士、村の600人、そして国会。"}, {"t": 1814.3833333333334, "x": "1人の訴えを、何人もの人が受け取って次へ渡した。"}, {"t": 1818.1, "x": "吉田さん1人では扉は開かなかったのね。"}, {"t": 1821.0166666666667, "x": "吉田岩窟王事件の50年は、\n会議録の中にいまも残っている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
