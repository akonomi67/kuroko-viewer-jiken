<script>
const D={"name": "078", "file": "078_編集用", "dur": 2174.55, "segs": [], "subs": [{"t": 0.0, "x": "1974年8月30日。"}, {"t": 2.683333333333333, "x": "東京、丸の内。昼の12時45分ごろだ。"}, {"t": 5.933333333333334, "x": "三菱重工業の東京本社ビルの、\n1階の出入口の前で、爆発が起きた。"}, {"t": 11.083333333333334, "x": "丸の内って、オフィス街よね。"}, {"t": 13.166666666666666, "x": "そうだ。しかも昼休みの時間だ。"}, {"t": 15.466666666666667, "x": "この爆発で、8人が亡くなった。"}, {"t": 17.866666666666667, "x": "負傷した人の数は、資料によって幅がある。"}, {"t": 20.6, "x": "あとで詳しく話す。"}, {"t": 22.066666666666666, "x": "警察庁の呼び方では、丸の内ビル街爆破事件。"}, {"t": 25.216666666666665, "x": "世の中では、三菱重工ビル爆破事件と呼ばれている。"}, {"t": 28.8, "x": "ここから9か月のあいだに、同じグループに\nよるものとされた爆破が、11件続いた。"}, {"t": 34.2, "x": "11件。"}, {"t": 35.11666666666667, "x": "翌年の5月、8人が一斉に\n逮捕される。だが、2人だけ取り逃がした。"}, {"t": 40.0, "x": "そのうちの1人が、桐島聡だ。"}, {"t": 42.416666666666664, "x": "桐島が姿を現したのは、49年後の2024年1月。"}, {"t": 46.766666666666666, "x": "末期のがんで入院した病院の中だった。"}, {"t": 49.46666666666667, "x": "今日追いかけたいのは、そこじゃない。"}, {"t": 51.55, "x": "違うの？"}, {"t": 52.38333333333333, "x": "どうやって49年も隠れていたか、という\n話は、世の中にたくさんある。"}, {"t": 57.03333333333333, "x": "私が見たいのは、二つだけだ。"}, {"t": 59.21666666666667, "x": "49年もたって、なぜ時効になっていなかったのか。"}, {"t": 62.65, "x": "そして、時効が来ていなかったのに、\nなぜ最後まで裁かれなかったのか。"}, {"t": 67.06666666666666, "x": "時効じゃないのに、裁かれない。"}, {"t": 69.13333333333334, "x": "そうだ。普通は逆だと思うだろう。"}, {"t": 71.28333333333333, "x": "先に断っておく。桐島聡は起訴されていない。"}, {"t": 74.38333333333334, "x": "有罪の判決も受けていない。"}, {"t": 76.3, "x": "だから私はこの回で、桐島を「犯人」とは呼ばない。"}, {"t": 79.75, "x": "指名手配されていた人として話す。"}, {"t": 82.26666666666667, "x": "材料は、当時の国会の会議録と、警察庁が出した\n警察白書。そして2024年の各社の報道だ。"}, {"t": 89.96666666666667, "x": "まず、その日の丸の内がどういう\n場所だったかを押さえておきたい。"}, {"t": 93.51666666666667, "x": "東京駅の目の前。日本の大企業の本社が\n並んでいる一角だ。"}, {"t": 97.58333333333333, "x": "1974年といえば、高度経済成長がオイルショックで\n急ブレーキを踏んだ直後にあたる。"}, {"t": 103.25, "x": "物価が上がり、企業の海外進出が\n盛んに論じられていた時期だ。"}, {"t": 107.33333333333333, "x": "それでも、丸の内の昼休みは人であふれていた。"}, {"t": 110.55, "x": "ごく普通の、働く人たちの街ね。"}, {"t": 113.23333333333333, "x": "そうだ。ここが大事なところだ。"}, {"t": 115.21666666666667, "x": "爆発が起きたのは、ビルの中ではない。"}, {"t": 117.55, "x": "1階の出入口の前だ。"}, {"t": 119.26666666666667, "x": "つまり、通りかかっただけの人が\n巻き込まれる場所で起きている。"}, {"t": 122.86666666666666, "x": "昼休みに外に出ていた人、これから\n戻ろうとしていた人、たまたま前を歩いていた人。"}, {"t": 128.3, "x": "亡くなった8人も、負傷した人たちも、\nその会社の社員だけではなかった。"}, {"t": 133.23333333333332, "x": "狙われた会社と関係のない人まで。"}, {"t": 135.7, "x": "関係のない人のほうが\n多かった、という言い方もできる。"}, {"t": 139.0, "x": "この回では、亡くなった8人の氏名は出さない。"}, {"t": 142.06666666666666, "x": "どうして？"}, {"t": 142.9, "x": "ご遺族がいるからだ。"}, {"t": 144.05, "x": "50年たっても、それは変わらない。"}, {"t": 146.35, "x": "数字として「8人」と言うことと、\n一人ひとりの名前を並べて見せ物にすることは、"}, {"t": 151.5, "x": "違う話だと私は思っている。"}, {"t": 153.75, "x": "それに、この動画で名前を並べたところで、\n事件の何が分かるわけでもない。"}, {"t": 158.25, "x": "私が見ておきたいのは、この8人という\n数字が、そのあとの日本の制度を一つ"}, {"t": 163.1, "x": "動かした、という事実のほうだ。"}, {"t": 165.06666666666666, "x": "その話は、いちばん最後にする。"}, {"t": 167.11666666666667, "x": "今日の締めはそこだ。"}, {"t": 169.08333333333334, "x": "事件の前に、予告の電話があった。"}, {"t": 171.55, "x": "電話？"}, {"t": 172.25, "x": "警察庁がまとめた昭和50年版の警察白書に、\nこの一連の事件について"}, {"t": 177.13333333333333, "x": "「事前予告電話」があったと書かれている。"}, {"t": 179.76666666666668, "x": "公的な記録としてはっきり\n残っているのは、そこまでだ。"}, {"t": 183.25, "x": "ただ、当時の報道や、その後の記録では、\nもう少し細かく伝えられている。"}, {"t": 187.96666666666667, "x": "爆発の8分前に、最初の電話がかかったとされている。"}, {"t": 191.6, "x": "それはいたずら電話として扱われ、切られた。"}, {"t": 194.45, "x": "切られたの。"}, {"t": 195.4, "x": "かけ直したが、また切られた。"}, {"t": 197.35, "x": "3回目で、ようやく最後まで聞いてもらえた。"}, {"t": 199.91666666666666, "x": "爆発の4分前だったと言われている。"}, {"t": 202.46666666666667, "x": "4分……。"}, {"t": 203.23333333333332, "x": "そして、避難は行われなかった。"}, {"t": 205.46666666666667, "x": "ここは伝えられている話であって、私が原典で\n確かめられたわけではない。そこは正直に言っておく。"}, {"t": 211.7, "x": "想像はできる。この年、爆破予告のいたずら\n電話は、日本中で毎日のように鳴っていた。"}, {"t": 217.3, "x": "その数字は、このあとの章で出す。\nとんでもない件数だ。"}, {"t": 220.78333333333333, "x": "本物とにせものを、電話口で\n見分けろというほうが無理だったとも言える。"}, {"t": 224.73333333333332, "x": "ただ、一つだけ言えることがある。"}, {"t": 226.8, "x": "仮にその電話が全部つながっていたとしても、それは"}, {"t": 229.91666666666666, "x": "「先に言っておいたから\n許される」という話にはならない。"}, {"t": 233.36666666666667, "x": "……そうね。"}, {"t": 234.11666666666667, "x": "人が大勢いる場所に、時限式の爆発物を置いた。"}, {"t": 237.31666666666666, "x": "結果として8人が亡くなっている。"}, {"t": 239.56666666666666, "x": "予告があったかどうかは、その事実を軽くしない。"}, {"t": 242.56666666666666, "x": "私はこの回で、予告電話を「良心の痕跡」のようには\n扱わない。そういう読み方はしない。"}, {"t": 249.1, "x": "ここで、被害の数字を整理しておきたい。"}, {"t": 251.6, "x": "亡くなったのは8人。これは\nどの資料でも一致している。"}, {"t": 254.85, "x": "問題は、負傷した人の数だ。"}, {"t": 257.2, "x": "さっき、幅があるって言ってたわね。"}, {"t": 259.46666666666664, "x": "報道で広く使われている数字は、\n376人、あるいは、およそ380人だ。"}, {"t": 265.23333333333335, "x": "一方で、のちに確定した裁判の判決が\n認定した数は、重軽傷165人となっている。"}, {"t": 271.43333333333334, "x": "倍以上、違うじゃない。"}, {"t": 272.98333333333335, "x": "違う。だが、どちらかが\n嘘をついている、という話ではない。"}, {"t": 276.6666666666667, "x": "裁判で認定される人数は、起訴の対象になった\n範囲や、証拠で確認できた範囲に限られる。"}, {"t": 282.6166666666667, "x": "診断書があるか、本人の確認が\n取れるか。そういう線引きが入る。"}, {"t": 286.93333333333334, "x": "報道の数字は、当日その場で手当てを\n受けた人まで含めた数え方だ。"}, {"t": 291.31666666666666, "x": "数え方が違えば、数は変わる。"}, {"t": 293.5833333333333, "x": "じゃあ、どっちを言えばいいのかしら。"}, {"t": 295.6, "x": "私はこう言うことにしている。"}, {"t": 297.3833333333333, "x": "「亡くなったのが8人。"}, {"t": 298.65, "x": "負傷した人は、判決の認定で165人、\n報道の数え方では約380人」。"}, {"t": 304.6, "x": "幅があるなら、幅があると言えばいい。"}, {"t": 306.6, "x": "片方だけを選んで断定するほうが、よほど不誠実だ。"}, {"t": 310.15, "x": "この種の事件では、数字が\n一人歩きすることがよくある。"}, {"t": 313.6166666666667, "x": "大きいほうの数字だけを使えば煽れるし、\n小さいほうだけを使えば軽く見せられる。"}, {"t": 318.18333333333334, "x": "どちらもやらない。両方出して、\nなぜ違うかを言う。それでいい。"}, {"t": 321.9166666666667, "x": "そして、負傷した人たちがどういう\n状態だったかは、この動画では描写しない。"}, {"t": 326.6166666666667, "x": "そこを細かく語ることで、誰かの役に\n立つとは思えないからだ。"}, {"t": 331.1333333333333, "x": "では、捜査がどこから始まったかを見ていく。"}, {"t": 333.8666666666667, "x": "1974年12月24日。"}, {"t": 336.46666666666664, "x": "事件から4か月後だ。"}, {"t": 338.0, "x": "衆議院の地方行政委員会で、\n警察庁の長官官房長が捜査状況を報告している。"}, {"t": 343.5833333333333, "x": "この報告に、当日の人の動きが残っている。"}, {"t": 346.6666666666667, "x": "「事件当日の午前九時十分ごろ、"}, {"t": 348.73333333333335, "x": "地下鉄丸の内線茗荷谷駅から二名の若い\n男が、他の一名の見送りを受け、"}, {"t": 353.8333333333333, "x": "円筒型の荷物二個を持って電車に乗り込み、\n同九時十六分ごろ御茶ノ水駅で下車したこと」"}, {"t": 359.6, "x": "見送りが1人いたのね。"}, {"t": 361.25, "x": "3人いた、ということだ。"}, {"t": 362.96666666666664, "x": "報告は続く。"}, {"t": 364.0833333333333, "x": "「同日午後零時十六分ごろ、"}, {"t": 365.8333333333333, "x": "地下鉄千代田線新御茶ノ水駅近くの聖橋ビル前から、\n二名の若い男が、"}, {"t": 370.8833333333333, "x": "円筒型の荷物二個を持ってタクシーに\n乗車して三菱重工本社前に"}, {"t": 375.06666666666666, "x": "至り、そこで一名が荷物二個と\nともに下車し、他の一名は"}, {"t": 378.7, "x": "東京駅北口まで行って下車したこと」"}, {"t": 381.18333333333334, "x": "午後0時16分に乗って、爆発が0時45分ごろ。"}, {"t": 385.06666666666666, "x": "29分。"}, {"t": 386.1, "x": "荷物の中身が何だったかについては、\n私はこの動画では一切話さない。"}, {"t": 390.6166666666667, "x": "どんな材料で、どう作られていたか。\nその種類の話はしない。ここは最初から決めている。"}, {"t": 396.1333333333333, "x": "話すのは、人の動きだけだ。"}, {"t": 398.21666666666664, "x": "警察は、この2つの目撃から\n「犯人グループは茗荷谷駅と"}, {"t": 402.48333333333335, "x": "新御茶ノ水駅を中心とする地区に\n何らかの関係がある」と読んだ。"}, {"t": 406.4166666666667, "x": "そして、その地域に大量の捜査員を\n入れて、聞き込みを始めている。"}, {"t": 410.5833333333333, "x": "ただ、この読みだけでは犯人にたどりつかなかった。"}, {"t": 413.68333333333334, "x": "実際に逮捕まで進むのは、ここから5\nか月後。しかも、別の事件が入口になる。"}, {"t": 419.65, "x": "三菱重工の事件は、単発では終わらなかった。"}, {"t": 422.81666666666666, "x": "同じ12月24日の報告に、この4\nか月の記録が並んでいる。"}, {"t": 427.1666666666667, "x": "8月30日、丸の内ビル街。"}, {"t": 429.43333333333334, "x": "10月14日、三井物産の館内。"}, {"t": 431.93333333333334, "x": "11月25日、帝人の中央研究所。"}, {"t": 434.93333333333334, "x": "12月10日、大成建設のビル。"}, {"t": 437.6, "x": "ほとんど毎月じゃない。"}, {"t": 439.1166666666667, "x": "そのとおりだ。さらに12月23日、\n鹿島建設の施設の入口前でも\n小さな爆発が起きている。"}, {"t": 445.6666666666667, "x": "年が明けても止まらない。"}, {"t": 447.03333333333336, "x": "1975年2月28日には、ハザマ組の本社と、\n埼玉の大宮工場が、ほぼ同時に爆破された。"}, {"t": 454.48333333333335, "x": "最終的に、この一連の企業爆破は11件にのぼった。"}, {"t": 458.2, "x": "呼び方を整理しておく。"}, {"t": 459.55, "x": "警察庁の白書は、この11件をまとめて\n「一連の企業爆破事件」と呼んでいる。"}, {"t": 464.96666666666664, "x": "1976年3月2日の衆議院予算委員会では、"}, {"t": 468.76666666666665, "x": "警備局長自身が\n「いわゆる連続企業爆破事件」と言っている。"}, {"t": 472.96666666666664, "x": "じゃあ、連続企業爆破事件でいいのね。"}, {"t": 475.5833333333333, "x": "いい。この動画では11件全体をそう呼び、\nその1件目を「三菱重工の事件」と呼び分ける。"}, {"t": 481.5, "x": "もう一つ、同じ報告に私が気になった数字がある。"}, {"t": 484.75, "x": "爆破予告の電話だ。"}, {"t": 486.26666666666665, "x": "官房長は、こう言っている。"}, {"t": 488.0, "x": "「本年十二月十七日現在における\n爆破予告事件の発生件数は、"}, {"t": 492.4, "x": "本年当初以来二千五百五十五件でありまして、\nそのうち八〇パーセントに"}, {"t": 497.0, "x": "当たる二千九十五件は丸の内ビル街爆破事件以後に\n発生したものであります」"}, {"t": 501.85, "x": "8割が、あの事件のあと？"}, {"t": 503.85, "x": "そうだ。しかも、そのうち\n検挙できたのは140件しかない。"}, {"t": 507.8, "x": "そして、捕まえた人の内訳について、\nこうも言っている。"}, {"t": 511.31666666666666, "x": "「検挙した事例から見ますと、少年による\n犯行が三〇パーセント以上を占めており」"}, {"t": 516.1833333333333, "x": "動機の多くは、世間を騒がせるためのいたずらか、\n金を脅し取るための手段だった。"}, {"t": 521.1833333333333, "x": "つまり、実際に爆発物を仕掛けた人間とは\n無関係の電話が、社会をさらに揺らしていた。"}, {"t": 527.0, "x": "便乗ね。"}, {"t": 527.9333333333333, "x": "一つの事件が起きると、事件そのものより\n広い範囲で、人の行動が変わっていく。"}, {"t": 533.0166666666667, "x": "この2555件という数字は、その記録として残っている。"}, {"t": 537.1333333333333, "x": "さっきの「予告電話が切られた」という\n話も、この空気の中で起きたことだ。"}, {"t": 542.65, "x": "犯行のあと、新聞社などに声明文が送られている。"}, {"t": 545.95, "x": "そこに書かれていた名前が、\n東アジア反日武装戦線だ。"}, {"t": 549.85, "x": "聞いたことのある名前ね。"}, {"t": 551.4833333333333, "x": "そして、名乗りは一つではなかった。"}, {"t": 553.8, "x": "「狼」「大地の牙」「さそり」。"}, {"t": 555.7, "x": "三つの名前が使い分けられていた。"}, {"t": 557.9166666666666, "x": "1976年3月2日、衆議院の予算委員会で、\n警察庁の警備局長がこう説明している。"}, {"t": 564.7166666666667, "x": "「初めのうちは『狼』\nグループであるとかあるいは『さそり』"}, {"t": 568.1166666666667, "x": "グループであるとか、いろいろ\n名前を名のっておりましたが、"}, {"t": 571.1666666666666, "x": "最後の段階ではそういうものをつけないで、単に\n東アジア反日武装戦線、こう言っております」"}, {"t": 576.9, "x": "警察の見立ては、三つが\n一体化していた、というものだった。"}, {"t": 580.7, "x": "どの班がどの事件をやったかも、\n国会で読み上げられている。"}, {"t": 584.1833333333333, "x": "1975年7月4日、\n衆議院地方行政委員会での警備局長の報告だ。"}, {"t": 589.8666666666667, "x": "三菱重工と帝人の研究所が「狼」。"}, {"t": 592.6, "x": "三井物産と大成建設が「大地の牙」。"}, {"t": 595.5666666666667, "x": "鹿島建設と、ハザマ組の江戸川の作業所、\n京成の鉄橋の工事現場が「さそり」。"}, {"t": 600.9666666666667, "x": "そして、ハザマ組の本社と大宮工場の同時爆破は、\n三つの班が合同で行ったとされた。"}, {"t": 606.6166666666667, "x": "きれいに分かれてるのね。"}, {"t": 608.15, "x": "この「どの班か」という区分けが、あとで効いてくる。"}, {"t": 611.2, "x": "覚えておいてほしい。"}, {"t": 612.4333333333333, "x": "さらに捜査の結果、1971年以降に未解決だった\n4件も、同じ人たちの犯行と判明する。"}, {"t": 619.45, "x": "熱海、横浜、札幌、旭川。いずれも\n記念碑や資料館が狙われていた。"}, {"t": 624.5333333333333, "x": "警察白書の昭和51年版は、これで「\n合計15件の爆破事件が解決した」と書いている。"}, {"t": 630.9, "x": "一つの事件を追っていたら、15件が\nまとめてつながった、ということだ。"}, {"t": 635.8666666666667, "x": "この事件には、その前段があったと伝えられている。"}, {"t": 639.0, "x": "裁判や当時の報道で語られてきたのが、\n「虹作戦」と呼ばれた計画だ。"}, {"t": 643.8, "x": "虹？"}, {"t": 644.4333333333333, "x": "昭和天皇が乗った列車を、\n橋ごと爆破しようとした計画だとされている。"}, {"t": 648.8833333333333, "x": "準備は途中まで進んだが、中止された。"}, {"t": 651.5166666666667, "x": "そして、そのとき使われなかったものが、\n三菱重工に向けられた、という説明がされてきた。"}, {"t": 657.4, "x": "ここも私が原典で確認できた話ではない。"}, {"t": 660.2333333333333, "x": "「伝えられている」という範囲にとどめる。"}, {"t": 662.5833333333334, "x": "ただ、この点がなぜ語られ続けてきたかは分かる。"}, {"t": 665.6833333333333, "x": "最初の標的と、実際に被害を受けた\n人たちが、まったく違うからだ。"}, {"t": 670.4, "x": "ぜんぜん違うわね。"}, {"t": 671.75, "x": "亡くなった8人は、その計画とも、標的とされた\n企業の経営とも、何の関係もない。"}, {"t": 677.4166666666666, "x": "昼休みに、そこを歩いていただけの人たちだ。"}, {"t": 680.5, "x": "……それは、理屈にならないわね。"}, {"t": 682.5333333333333, "x": "ならない。"}, {"t": 683.1666666666666, "x": "彼らが何を考えていたかについては、\n捜査当局の説明が国会に残っている。"}, {"t": 688.0, "x": "一度だけ紹介しておく。"}, {"t": 689.7833333333333, "x": "同じ1975年7月4日の報告で、警備局長は\nグループの成り立ちをこう説明している。"}, {"t": 696.1166666666667, "x": "1969年に大学に入った学生が、学園紛争に\n刺激されて、翌年に仲間を集めて委員会を作った。"}, {"t": 703.7666666666667, "x": "その後、学生運動に限界を感じ、当時の一部で\n唱えられていた革命論の影響を強く受けた、と。"}, {"t": 710.0666666666667, "x": "私はその中身を解説しない。\nこの動画の目的ではないし、紹介すること\n自体が宣伝になりうるからだ。"}, {"t": 716.6166666666667, "x": "扱うのは、捜査がどう見ていたかという\n記録としてだけだ。"}, {"t": 720.1333333333333, "x": "もう一点、同じ報告にこうある。"}, {"t": 722.1, "x": "「背後の黒幕、資金源等は\n彼らのグループ以外にはないというのが\n判明しておる事実でございます」"}, {"t": 728.0333333333333, "x": "誰かに操られていたわけじゃない、と。"}, {"t": 730.4333333333333, "x": "警察の結論はそうだった。"}, {"t": 732.15, "x": "自分たちで決めて、\n自分たちの金でやった、ということだ。"}, {"t": 736.5, "x": "1975年5月19日。"}, {"t": 738.8333333333334, "x": "事件から8か月半。"}, {"t": 740.4333333333333, "x": "警視庁が動いた。"}, {"t": 741.7, "x": "5月22日の衆議院地方行政委員会で、\n警備局長が報告している。"}, {"t": 746.4333333333333, "x": "「五月十九日午前七時三十五分から\n午前八時四十分ごろまでの間におきまして、"}, {"t": 751.6, "x": "都内において通勤途上にあった者を\n五名逮捕し、マンションの居室内にいた\n者二名、さらに同日午後四時、"}, {"t": 757.8, "x": "仙台市内のアパートにおいて一名、\n合計八名を逮捕いたしました」"}, {"t": 762.1666666666666, "x": "通勤の途中で。"}, {"t": 763.5, "x": "そうだ。会社に向かう途中で捕まっている。"}, {"t": 766.15, "x": "逮捕の罪名は、爆発物取締罰則の第1条違反。"}, {"t": 769.8333333333334, "x": "爆発物を使った罪だ。"}, {"t": 771.7333333333333, "x": "ここで注意してほしいのは、逮捕の対象になった\n事件が、三菱重工ではないことだ。"}, {"t": 777.0333333333333, "x": "違う事件で捕まえたの？"}, {"t": 778.8333333333334, "x": "その年の4月に起きた、銀座のビルでの爆破事件だ。"}, {"t": 782.3, "x": "まず確実に固められる一件で身柄を\n取り、そこから一連の事件を詰めていく。"}, {"t": 786.95, "x": "捜査としてはよくある形だ。"}, {"t": 789.0, "x": "逮捕されたのは8人。"}, {"t": 790.35, "x": "大道寺将司、その妻の大道寺あや子、\n片岡利明、佐々木規夫、浴田由紀子ら。"}, {"t": 796.0166666666667, "x": "年齢は、24歳から27歳だった。"}, {"t": 798.85, "x": "この一斉逮捕には、そこに\n至るまでの長い絞り込みがあった。"}, {"t": 802.5666666666667, "x": "6月3日の参議院地方行政委員会で、\n警備局長がその経緯を説明している。"}, {"t": 807.6833333333333, "x": "前年8月からの一連の事件をもとに犯人像を\n分析し、いくつかのグループと人物が浮かんだ。"}, {"t": 813.7666666666667, "x": "そこから焦点を絞っていったところに、\n4月の銀座の事件が起きた。"}, {"t": 817.95, "x": "それがこのグループの犯行である疑いが強まり、\n裏づけを重ねて、一斉逮捕に至った、と。"}, {"t": 823.65, "x": "8か月半かかっている。"}, {"t": 825.15, "x": "当時の捜査としては、早いほうだ。"}, {"t": 828.05, "x": "この逮捕でいちばん語られてきたのが、\n彼らの暮らしぶりだ。"}, {"t": 831.5666666666667, "x": "国会で読み上げられた職業を見てほしい。"}, {"t": 833.95, "x": "会社員。元会社員。喫茶店のウエーター。"}, {"t": 836.5666666666667, "x": "臨床検査技師。短大生。"}, {"t": 838.7166666666667, "x": "……普通ね。"}, {"t": 839.5666666666667, "x": "住んでいたのも、東京のごく\n普通のアパートやマンションだ。"}, {"t": 842.7, "x": "足立区、中野区、江東区、練馬区、荒川区。"}, {"t": 846.2666666666667, "x": "警察白書の昭和51年版は、こう書いている。"}, {"t": 849.4833333333333, "x": "「会社員、喫茶店店員等の職業に就き、"}, {"t": 852.15, "x": "近隣との付き合いも普通に行うなど\n表面上は平凡な市民を装いながら」"}, {"t": 856.7333333333333, "x": "近所づきあいも、普通にしていた、ということだ。"}, {"t": 859.8333333333334, "x": "隣に住んでても分からないわね。"}, {"t": 861.9333333333333, "x": "一方で、捜査の報告には別の話も出てくる。"}, {"t": 865.1, "x": "6月3日の参議院地方行政委員会で、\n警備局長はこう述べている。"}, {"t": 869.4833333333333, "x": "「被疑者の佐々木規夫、"}, {"t": 870.7333333333333, "x": "宇賀神寿一、この両名のアパートの居室の床下に、\n秘密の地下室がつくられてあるのを発見しております」"}, {"t": 877.6333333333333, "x": "床下に地下室。"}, {"t": 879.15, "x": "押収された物の中身については、\n私はここでは話さない。"}, {"t": 882.85, "x": "どんな材料を、どう使ったか。その種類の話は、\nこの動画では一切扱わないと決めている。"}, {"t": 888.6, "x": "知りたい人がいるのは分かる。だが、\nそれを並べることに意味はない。"}, {"t": 892.4166666666666, "x": "彼らが冊子を作って売っていたことも記録に\n残っているが、中身には触れない。理由は同じだ。"}, {"t": 898.0833333333334, "x": "押さえておくべきなのは、「普通に暮らしている\n人間の部屋で、それが行われていた」という一点だ。"}, {"t": 903.9, "x": "そして、この「普通に暮らす」という形は、\nこのあと49年間、別の人間が続けることになる。"}, {"t": 911.05, "x": "この一斉逮捕には、その日のうちに\n起きたことがもう一つある。"}, {"t": 914.75, "x": "逮捕された8人のうち1人が、その日、死亡している。"}, {"t": 918.45, "x": "逮捕された日に？"}, {"t": 919.7166666666667, "x": "5月22日の国会報告に、そのまま残っている。"}, {"t": 923.25, "x": "「逮捕した被疑者の一人斉藤和は、"}, {"t": 925.4333333333333, "x": "警視庁において取り調べ中、"}, {"t": 927.1666666666666, "x": "体調に異常が認められましたので警察病院に\n収容いたしましたが、同日午後二時十五分、"}, {"t": 932.6666666666666, "x": "死亡いたしました」"}, {"t": 934.0, "x": "「死因は、解剖の結果、青酸化合物に\nよる中毒死と判明をいたしました」"}, {"t": 938.8, "x": "警察の説明は、捜査員が自宅に入る直前に、\n自分で飲んだと認められる、というものだった。"}, {"t": 944.9333333333333, "x": "同じ部屋にいた内縁の妻も、同じように\n飲んだが、こちらは一命をとりとめている。"}, {"t": 949.9166666666666, "x": "二人とも、用意してたのね。"}, {"t": 951.95, "x": "この1人が亡くなったことで、\n捜査は一つの口を失った。"}, {"t": 955.7166666666667, "x": "そして、ここで国会がもめる。"}, {"t": 957.7333333333333, "x": "6月4日の衆議院法務委員会で、ある委員が\nこう質問している。"}, {"t": 961.7666666666667, "x": "取り調べがほとんど行われていないはずなのに、"}, {"t": 964.3166666666667, "x": "2日後には、この人物の行動について詳しい内容が\n発表されている。それはどこから出たのか、と。"}, {"t": 970.6, "x": "たしかに、おかしいわね。"}, {"t": 972.3, "x": "委員が問題にしたのは、亡くなった\n人の供述として報じられている内容が、"}, {"t": 976.7666666666667, "x": "裁判で確かめられないまま世に出ることだった。"}, {"t": 979.7, "x": "この指摘は、私はまっとうだと思う。"}, {"t": 982.1333333333333, "x": "本人がいない以上、その説明は\n反論されることも、法廷で検証されることもない。"}, {"t": 987.2166666666667, "x": "後半で出てくる桐島の話も、\n実はこれと同じ形をしている。"}, {"t": 991.3833333333333, "x": "話せる本人がいないまま、記録だけが残る。\nこの事件には、それが二度起きている。"}, {"t": 997.0666666666667, "x": "ここからが、この回の本題だ。"}, {"t": 999.15, "x": "一斉逮捕の4日後、捜査は\n共犯者をさらに2人割り出した。"}, {"t": 1003.0, "x": "1975年7月4日、衆議院地方行政委員会。"}, {"t": 1006.9333333333333, "x": "警察庁の警備局長の報告だ。"}, {"t": 1009.35, "x": "「その後の捜査によりまして新たに"}, {"t": 1011.15, "x": "共犯二名、これは\n明治学院大学生の桐島聡、二十一歳、"}, {"t": 1015.3833333333333, "x": "同じく宇賀神寿一、二十二歳、この二名を\n割り出しまして五月二十三日指名手配をし、"}, {"t": 1020.9333333333333, "x": "逮捕すべく捜査中でございます」"}, {"t": 1023.1666666666666, "x": "桐島聡、21歳。"}, {"t": 1025.1666666666667, "x": "大学生だ。"}, {"t": 1026.1833333333334, "x": "ここで一つ、細かいが大事な話をしておく。"}, {"t": 1029.1333333333334, "x": "桐島の指名手配日を「5月19日」と\n書いている資料がある。"}, {"t": 1032.9333333333334, "x": "ネット上ではそちらのほうが多いくらいだ。"}, {"t": 1035.3833333333334, "x": "だが、当時の国会で、警察庁自身が\n「五月二十三日」と述べている。"}, {"t": 1040.3166666666666, "x": "6月3日の参議院での報告でも、「\n一斉逮捕するとともに、その後、"}, {"t": 1044.6666666666667, "x": "新たに共犯者二名を割り出して\n指名手配を行い」と説明されている。"}, {"t": 1049.1166666666666, "x": "逮捕のあと、なのね。"}, {"t": 1050.7333333333333, "x": "私は一次資料のほうを採る。\nこの動画では5月23日とする。"}, {"t": 1054.8333333333333, "x": "もう一つ、大事な点がある。"}, {"t": 1056.6, "x": "桐島が手配された容疑は、三菱重工の事件ではない。"}, {"t": 1060.35, "x": "違うの？"}, {"t": 1061.1666666666667, "x": "違う。その年の4月に起きた、別の爆破事件だ。\nここは最後にもう一度出てくる。"}, {"t": 1066.4333333333334, "x": "この日から、桐島聡という\n名前は、指名手配の写真として\n日本中に貼り出されることになる。"}, {"t": 1072.3833333333334, "x": "駅にも、交番にも。そして、その写真は\n49年間、更新されないまま貼られ続けた。"}, {"t": 1078.25, "x": "21歳の顔のままだ。"}, {"t": 1080.0166666666667, "x": "年を取った顔は、誰も知らないのね。"}, {"t": 1082.5, "x": "そうだ。手配写真というのは、\nその人が消えた時点で止まる。"}, {"t": 1086.2833333333333, "x": "あとから似顔絵で年齢を重ねたものが\n作られることもあるが、あくまで推定だ。"}, {"t": 1090.85, "x": "この49年のあいだ、桐島聡の顔として世の中に\n出ていたのは、大学生のときの1枚だけだった。"}, {"t": 1098.0833333333333, "x": "逮捕された人たちの処理は、早かった。"}, {"t": 1100.7, "x": "1975年6月10日、まず\n銀座のビルの事件で6人が起訴される。"}, {"t": 1105.6333333333334, "x": "続いて6月28日。ここで三菱重工の事件が入ってくる。"}, {"t": 1109.9333333333334, "x": "警備局長の報告では、このとき5人が「殺人罪と\n同未遂罪及び爆発物取締罰則第一条違反」で\n起訴され、"}, {"t": 1117.5666666666666, "x": "2人が爆発物取締罰則違反で起訴された。"}, {"t": 1121.0666666666666, "x": "殺人罪。"}, {"t": 1122.0833333333333, "x": "そうだ。爆発物を使った罪だけではなく、\n人を殺した罪として起訴された。"}, {"t": 1127.15, "x": "さらに6月27日には、ハザマ組の本社と\n大宮工場、江戸川の作業所、"}, {"t": 1132.1166666666666, "x": "京成の鉄橋の工事現場などの事件でも\n逮捕が行われている。"}, {"t": 1136.0833333333333, "x": "そして7月17日の衆議院決算委員会で、\n警察庁の参事官がこう述べている。"}, {"t": 1141.4666666666667, "x": "「七月の九日までに、"}, {"t": 1142.9666666666667, "x": "自殺者一人を除きまして全員を爆発物取締罰則違反、"}, {"t": 1147.0333333333333, "x": "殺人、同未遂罪等ですでに\n起訴されておるところでございます」"}, {"t": 1150.9, "x": "逮捕から2か月弱で、全員が起訴された。"}, {"t": 1153.9166666666667, "x": "早いわね。"}, {"t": 1154.8333333333333, "x": "この「起訴された」という\n言葉を、覚えておいてほしい。"}, {"t": 1158.0666666666666, "x": "起訴というのは、裁判を始めてくださいと\n検察官が裁判所に申し立てることだ。"}, {"t": 1163.0833333333333, "x": "そして起訴には、もう一つの効き目がある。"}, {"t": 1165.5333333333333, "x": "時効を止める、という効き目だ。"}, {"t": 1167.65, "x": "時効を、止める？"}, {"t": 1168.9333333333334, "x": "そうだ。事件から時間が過ぎると\n起訴できなくなる、というのが公訴時効だが、"}, {"t": 1173.4333333333334, "x": "起訴した瞬間にその時計は止まる。"}, {"t": 1175.8166666666666, "x": "しかもこの効き目は、起訴された\n本人だけでは終わらない。"}, {"t": 1179.25, "x": "どういうこと？"}, {"t": 1180.25, "x": "そこがこの回のいちばん大事なところになる。\nもう少し先で、条文ごと読む。"}, {"t": 1185.6, "x": "裁判は長くかかった。"}, {"t": 1187.15, "x": "起訴が1975年。判決が\n確定したのは1987年3月24日だ。"}, {"t": 1193.4166666666667, "x": "12年。"}, {"t": 1194.2833333333333, "x": "最高裁判所で、2人の死刑が確定した。"}, {"t": 1197.25, "x": "大道寺将司死刑囚と、益永利明死刑囚だ。"}, {"t": 1200.5, "x": "益永は、逮捕当時は片岡利明という名前だった。"}, {"t": 1204.1166666666666, "x": "確定した判決が認定したのは、\n1971年から1975年にかけての、"}, {"t": 1210.0333333333333, "x": "合わせて14件の爆破事件への関与だ。"}, {"t": 1212.8, "x": "そのうち三菱重工の事件について、判決は\n8人の死亡と、165人の重軽傷を認定している。"}, {"t": 1219.5833333333333, "x": "さっきの165人は、この判決の数字なのね。"}, {"t": 1223.0666666666666, "x": "そうだ。だから「判決の認定では165人」という\n言い方になる。"}, {"t": 1227.5166666666667, "x": "この裁判は、審理そのものも難航した。"}, {"t": 1230.2166666666667, "x": "1978年6月、衆議院法務委員会で"}, {"t": 1233.75, "x": "最高裁判所の刑事局長が、\nこの事件の公判の様子を例に挙げて説明している。"}, {"t": 1238.7833333333333, "x": "被告人を全員まとめて審理してほしいという\n要求があり、それが通らないうちは"}, {"t": 1243.2666666666667, "x": "被告人も弁護人も出てこない、という\n状態が続いた、と。"}, {"t": 1246.9333333333334, "x": "裁判が進まなかったのね。"}, {"t": 1248.8666666666666, "x": "この時期、刑事裁判の遅れは"}, {"t": 1250.6666666666667, "x": "国会でくり返し取り上げられていた。\nこの事件はその代表例として扱われている。"}, {"t": 1255.5666666666666, "x": "大道寺将司は、死刑が確定したあと\n30年にわたって東京拘置所にいた。"}, {"t": 1260.3333333333333, "x": "そして2017年5月24日、多発性骨髄腫のため、\n拘置所の中で死亡している。68歳だった。"}, {"t": 1267.6333333333334, "x": "死刑は執行されないまま終わった、ということになる。"}, {"t": 1270.6833333333334, "x": "益永利明は、死刑が確定した\n人として、いまも収監されている。"}, {"t": 1275.2, "x": "ここまでが、逮捕された人たちの話だ。"}, {"t": 1277.7833333333333, "x": "問題は、逮捕されなかった人たちのほうだった。"}, {"t": 1281.4666666666667, "x": "起訴されたはずの人が、日本からいなくなっている。"}, {"t": 1284.6333333333334, "x": "どういうこと？"}, {"t": 1285.65, "x": "1975年8月4日、マレーシアのクアラルンプールで、\n日本赤軍が大使館などを占拠する事件が起きた。"}, {"t": 1292.9, "x": "人質の解放と引き換えに要求されたのが、\n日本で勾留されていた人間の釈放だった。"}, {"t": 1298.4333333333334, "x": "政府はそれに応じた。このとき\n出て行った1人が、佐々木規夫だ。"}, {"t": 1302.4166666666667, "x": "さらに2年後、1977年9月28日。"}, {"t": 1306.0833333333333, "x": "日本航空の旅客機がハイジャックされ、\nバングラデシュのダッカに着陸した。"}, {"t": 1310.6333333333334, "x": "このときも、同じ形で釈放が行われている。"}, {"t": 1313.7666666666667, "x": "1977年11月17日、参議院法務委員会。"}, {"t": 1317.9, "x": "警察庁の公安第三課長が、こう述べている。"}, {"t": 1321.0333333333333, "x": "「佐々木規夫とそれから\n今回連れ出されました大道寺あや子、"}, {"t": 1324.3666666666666, "x": "浴田由紀子、これはいずれも\n東アジア反日武装戦線のメンバーでございます」"}, {"t": 1329.2, "x": "3人が、国外に出たのね。"}, {"t": 1331.3166666666666, "x": "そうだ。裁判の途中で、被告人が国の外に出た。"}, {"t": 1334.85, "x": "この釈放は、当時「超法規的措置」と呼ばれた。"}, {"t": 1338.1166666666666, "x": "法律の枠の外で行われた判断、という意味だ。"}, {"t": 1341.3833333333334, "x": "国会では、当然もめた。"}, {"t": 1343.1833333333334, "x": "同じ日の委員会で、\n瀬戸山三男法務大臣は、こう答えている。"}, {"t": 1347.2, "x": "「私はこういうことを繰り返して、ただ人命尊重、"}, {"t": 1350.2166666666667, "x": "人命尊重ということだけで実定法を\n次々に破っていくということは、"}, {"t": 1354.3666666666666, "x": "本来の憲法なり法律制度が国民全体の人命尊重を"}, {"t": 1357.7166666666667, "x": "阻害するおそれがある、\nこういうことになってはならないという\n判断をしなければならない」"}, {"t": 1362.7333333333333, "x": "人質の命は助かったけど、法律は破った。"}, {"t": 1366.05, "x": "そういうことだ。この判断が正しかったか\nどうかを、私はこの動画で決めるつもりはない。"}, {"t": 1371.3166666666666, "x": "3人のうち浴田由紀子受刑者は、のちに\n身柄を確保され、懲役20年の刑期を務めた。"}, {"t": 1376.8666666666666, "x": "出所は2017年3月だ。"}, {"t": 1379.2, "x": "だが、佐々木規夫容疑者と大道寺あや子容疑者は、\nいまも国際手配されたままだ。"}, {"t": 1384.2166666666667, "x": "つまり、この2人の裁判は、終わっていない。"}, {"t": 1386.8, "x": "判決が出ていない。"}, {"t": 1388.15, "x": "ここに、当時誰も想定していなかった副作用があった。"}, {"t": 1392.1666666666667, "x": "ここで、公訴時効の仕組みを整理する。"}, {"t": 1394.5666666666666, "x": "公訴時効というのは、事件から一定の期間が過ぎると、\n検察官が起訴できなくなる制度だ。"}, {"t": 1400.3333333333333, "x": "ただし、時計は進み続けるとは限らない。"}, {"t": 1402.8666666666666, "x": "止まることがある。"}, {"t": 1404.0, "x": "刑事訴訟法の254条2項に、こう書かれている。"}, {"t": 1407.5, "x": "「共犯の一人に対してした\n公訴の提起による時効の停止は、"}, {"t": 1411.0166666666667, "x": "他の共犯に対してその効力を有する。\nこの場合において、停止した時効は、"}, {"t": 1415.7, "x": "当該事件についてした裁判が\n確定した時からその進行を始める」"}, {"t": 1420.15, "x": "……もう一回、ゆっくり言って。"}, {"t": 1421.9666666666667, "x": "一緒にやったとされる人のうち、誰か1人が\n起訴されると、他の人の時効も止まる。"}, {"t": 1427.1833333333334, "x": "そして止まった時効は、その裁判が\n確定したときから、また進み始める。"}, {"t": 1432.0666666666666, "x": "裁判が終わらなかったら？"}, {"t": 1433.7666666666667, "x": "進み始めない。止まったままだ。"}, {"t": 1435.8833333333334, "x": "ここで、さっきの話がつながる。"}, {"t": 1438.0333333333333, "x": "桐島が関わったとされる事件の共犯者のうち、\n佐々木規夫と大道寺あや子は、"}, {"t": 1442.7333333333333, "x": "国外に出たまま裁判が終わっていない。"}, {"t": 1445.1666666666667, "x": "だから時効は止まったままだった、と説明されている。"}, {"t": 1448.3333333333333, "x": "ここは断定を避ける。"}, {"t": 1449.5666666666666, "x": "私が判決文や検察の判断そのものを\n読んで確かめたわけではなく、\n報道と資料の説明を紹介している。"}, {"t": 1456.45, "x": "でも、結論は変わらないのよね。"}, {"t": 1458.65, "x": "変わらない。49年たっても、\n桐島の時効は完成していなかった。"}, {"t": 1463.1, "x": "言い方を変えるとこうなる。"}, {"t": 1464.6, "x": "1977年に日本政府が人質の命を\n優先して2人を国外に出したことが、"}, {"t": 1470.1666666666667, "x": "結果として、まったく別の1人の時効を止め続けた。"}, {"t": 1473.75, "x": "誰もそれを狙ってやったわけではない。"}, {"t": 1475.7666666666667, "x": "制度の噛み合わせが、そうなっただけだ。"}, {"t": 1478.25, "x": "49年という数字は、その噛み合わせの上に乗っている。"}, {"t": 1482.4, "x": "ここで、勘違いされやすい点を一つつぶしておきたい。"}, {"t": 1485.6666666666667, "x": "2010年に、日本の公訴時効は大きく変わった。"}, {"t": 1488.7166666666667, "x": "人を死亡させた重い罪の時効が、廃止された。"}, {"t": 1492.0166666666667, "x": "じゃあ、それで時効が無くなったんじゃないの？"}, {"t": 1494.5666666666666, "x": "それでは説明がつかない。"}, {"t": 1496.2, "x": "2010年の改正で廃止されたのは、\n「人を死亡させた罪」だ。"}, {"t": 1500.2333333333333, "x": "桐島にかけられていた容疑は、\n爆発物取締罰則違反と、殺人未遂だった。"}, {"t": 1505.7166666666667, "x": "未遂ということは、その事件で人は\n亡くなっていない。つまり、廃止の対象ではない。"}, {"t": 1510.85, "x": "……じゃあ、やっぱり。"}, {"t": 1512.0666666666666, "x": "そうだ。桐島の時効が来なかったのは、\n法律が変わったからじゃない。"}, {"t": 1516.1833333333334, "x": "共犯とされた\n人たちの裁判が、終わっていなかったからだ。"}, {"t": 1519.7833333333333, "x": "この違いは、けっこう大きい。"}, {"t": 1521.55, "x": "2010年の時効廃止は、国会で\n議論をして、みんなで決めたことだ。"}, {"t": 1525.9166666666667, "x": "ところが桐島の場合に効いたのは、1977年に\n一晩で決まった政治判断の、副産物だ。"}, {"t": 1532.6833333333334, "x": "誰も決めてないのに、そうなったのね。"}, {"t": 1535.1333333333334, "x": "決めていない。議論もされていない。"}, {"t": 1537.1666666666667, "x": "ハイジャックされた飛行機の乗客を\n助けるという判断と、"}, {"t": 1540.3833333333334, "x": "49年後に1人の時効が生きているという\n結果に、直接の関係はない。"}, {"t": 1545.2166666666667, "x": "だが、条文をたどると、つながってしまう。"}, {"t": 1547.8833333333334, "x": "制度というのは、こういう形で\n人の人生に効いてくることがある。"}, {"t": 1551.7333333333333, "x": "ep059でやった松山ホステス事件は、\n時効の11時間前に起訴が間に合った話だった。"}, {"t": 1557.8, "x": "今回は逆だ。時効はいつまでも来なかった。\nそれでも、間に合わなかった。"}, {"t": 1562.95, "x": "ここで、もう1人を思い出してほしい。"}, {"t": 1565.2, "x": "1975年5月23日、桐島と同じ日に\n指名手配された人間がいた。宇賀神寿一だ。"}, {"t": 1572.05, "x": "さっき出てきたわね。"}, {"t": 1573.2, "x": "同じ明治学院大の。"}, {"t": 1574.9666666666667, "x": "そうだ。年齢は1つ上の22歳。"}, {"t": 1577.3, "x": "同じ班に属していたとされる。"}, {"t": 1579.3, "x": "この2人は、同じ日に手配された。"}, {"t": 1581.5, "x": "同じ条件で逃げ始めた。"}, {"t": 1583.35, "x": "宇賀神は、1982年7月13日に\n東京都内で逮捕されている。"}, {"t": 1588.3833333333334, "x": "逃亡期間は、約7年だ。"}, {"t": 1590.4333333333334, "x": "逮捕までのあいだ、偽名を使って\n新聞販売店で働いていたと報じられている。"}, {"t": 1595.3, "x": "……桐島と、同じような暮らしね。"}, {"t": 1597.5333333333333, "x": "そうだ。名前を変えて、住み込みで\n働く。やっていたことは、ほとんど変わらない。"}, {"t": 1602.45, "x": "それでも、片方は7年で見つかり、\n片方は見つからなかった。"}, {"t": 1606.45, "x": "宇賀神はその後、懲役18年が確定し、服役している。"}, {"t": 1610.4166666666667, "x": "宇賀神寿一元受刑者が出所したのは、2003年だ。"}, {"t": 1614.1333333333334, "x": "そのとき、桐島はまだ藤沢にいた。"}, {"t": 1616.45, "x": "手配は続いていた。"}, {"t": 1617.9333333333334, "x": "7年と、49年。"}, {"t": 1619.85, "x": "同じ日に手配された2人で、42年の差がついた。"}, {"t": 1623.2833333333333, "x": "この差がどこから来たのかは、私には分からない。"}, {"t": 1626.2666666666667, "x": "運なのか、生き方なのか、周りに誰がいたのか。"}, {"t": 1629.3, "x": "答えを出せるだけの材料が無い。"}, {"t": 1631.2833333333333, "x": "ただ、この対比は覚えておいてほしい。"}, {"t": 1633.5166666666667, "x": "「49年逃げ切った」という言い方をすると、\n何か特別な技術があったように聞こえる。"}, {"t": 1639.0166666666667, "x": "何かすごい方法があったみたいに、ね。"}, {"t": 1641.5333333333333, "x": "実際に残っている記録は、そういう話ではなかった。"}, {"t": 1644.9, "x": "そして、逃げた期間の長さは、\n何かを成し遂げた長さではない。"}, {"t": 1648.9, "x": "その49年のあいだ、8人が亡くなった\n事件の遺族も、同じ49年を過ごしている。"}, {"t": 1654.65, "x": "私はそちらの49年のほうを、忘れないようにしたい。"}, {"t": 1658.8, "x": "では、桐島はどこにいたのか。"}, {"t": 1660.7833333333333, "x": "手配された直後の足取りについては、\n一つだけ記録が伝えられている。"}, {"t": 1665.0666666666666, "x": "1975年5月31日、実家の父親に電話をかけている。\nそれが確認された最後の連絡だとされる。"}, {"t": 1672.5333333333333, "x": "手配された、8日後ね。"}, {"t": 1674.35, "x": "そこから先が、長い空白になる。"}, {"t": 1676.7, "x": "見つかったとき、いたのは神奈川県藤沢市だった。"}, {"t": 1679.7833333333333, "x": "東京から電車で1時間ほどの場所にある。"}, {"t": 1682.55, "x": "そんなに近いの？"}, {"t": 1683.8333333333333, "x": "近い。1980年代から、藤沢市内の工務店に\n住み込みで働いていたと報じられている。"}, {"t": 1690.1166666666666, "x": "その期間、およそ40年。"}, {"t": 1691.9666666666667, "x": "名乗っていた名前は、内田洋。"}, {"t": 1694.1166666666666, "x": "周りの人の話として伝えられているのは、\n拍子抜けするような内容だ。"}, {"t": 1698.5333333333333, "x": "音楽が好きで、月に1回ほど、音楽好きが\n集まるバーに顔を出していた。"}, {"t": 1703.1666666666667, "x": "店では、あだ名で呼ばれていた。"}, {"t": 1705.2, "x": "ただの近所の人ね。"}, {"t": 1706.75, "x": "健康保険証も、\n運転免許も無かったとされている。だから\n病院にもほとんど行かなかった。"}, {"t": 1712.3, "x": "身元を証明する紙が要らない働き方を、\n40年続けた、ということになる。"}, {"t": 1717.4, "x": "……それで40年。"}, {"t": 1718.6333333333334, "x": "40年だ。"}, {"t": 1719.6333333333334, "x": "私はここを「巧妙な逃亡術」として話すつもりはない。"}, {"t": 1723.3666666666666, "x": "身分を証明するものを持たないまま、"}, {"t": 1725.35, "x": "住み込みで働き続けられる場所が、\nこの国にあったというだけの話だ。"}, {"t": 1729.8833333333334, "x": "そして、警察がこの40年間、まったく\n動いていなかったわけでもない。"}, {"t": 1734.2833333333333, "x": "指名手配のポスターは貼られ続けていたし、\n定期的に情報提供の呼びかけも行われていた。"}, {"t": 1739.9, "x": "それでも、たどりつかなかった。"}, {"t": 1741.8333333333333, "x": "この暮らしを終わらせたのは、\n捜査でも、通報でもなかった。"}, {"t": 1746.05, "x": "2024年1月。"}, {"t": 1747.65, "x": "この男性は、末期の胃がんで、\n神奈川県鎌倉市の病院に入院した。"}, {"t": 1752.1666666666667, "x": "入院したときは、内田洋と名乗っていた。"}, {"t": 1754.9666666666667, "x": "1月25日。病院の関係者に、\nこう伝えたと報じられている。"}, {"t": 1759.2333333333333, "x": "「私は桐島聡だ」。"}, {"t": 1761.0, "x": "自分から。"}, {"t": 1761.9666666666667, "x": "そして、こう言ったとされる。"}, {"t": 1763.55, "x": "「最期は本名で迎えたい」。"}, {"t": 1765.2166666666667, "x": "病院から連絡を受けて、警視庁の公安部が動く。"}, {"t": 1768.4333333333334, "x": "ただ、この時点では何も\n確定していない。名乗っただけだ。"}, {"t": 1772.1, "x": "世の中には、事件の犯人を\n名乗り出る人がときどきいる。"}, {"t": 1775.4833333333333, "x": "警察はそれを前提に確認する。"}, {"t": 1777.8333333333333, "x": "報じられているところでは、本人しか知り得ない\n家族の情報や、当時の状況について話したという。"}, {"t": 1783.7833333333333, "x": "本人らしい、とは思われたのね。"}, {"t": 1785.9333333333334, "x": "だが、確定させるには時間が要る。"}, {"t": 1788.2, "x": "そして、時間は残っていなかった。"}, {"t": 1790.4833333333333, "x": "1月29日、この男性は入院先の病院で\n死亡した。70歳だった。"}, {"t": 1795.4833333333333, "x": "名乗ってから、4日だ。"}, {"t": 1797.2333333333333, "x": "4日……。"}, {"t": 1798.0, "x": "捜査当局は、本人から話を聞く機会を、\nほとんど持てないまま終わった。"}, {"t": 1802.6166666666666, "x": "当時、公安部の幹部が報道機関にこう話している。"}, {"t": 1805.75, "x": "49年も逃げたのか、支援者はいたのか、\n聴きたいことだらけだった、と。"}, {"t": 1810.6166666666666, "x": "……何も聞けなかったのね。"}, {"t": 1812.3, "x": "49年間、誰も見つけられなかった人が、\n自分から名乗って、4日で死んだ。"}, {"t": 1817.5333333333333, "x": "なぜ名乗ったのか、なぜそのタイミングだったのか。"}, {"t": 1820.3, "x": "本人に確かめられた記録は無い。"}, {"t": 1822.5166666666667, "x": "一つ言えるのは、名乗らなければ、内田洋という\n名前のまま終わっていたということだ。"}, {"t": 1827.55, "x": "誰も気づかないまま、\n49年の手配は続いていたことになる。"}, {"t": 1832.1666666666667, "x": "確認が終わったのは、死亡から1か月後だ。"}, {"t": 1835.0166666666667, "x": "2024年2月27日、警視庁公安部は、\nこの男性を桐島聡本人と特定したと発表した。"}, {"t": 1842.1333333333334, "x": "根拠として説明されたのが、DNA型鑑定だ。"}, {"t": 1845.5, "x": "親族のDNA型と照合して、親族関係に\n矛盾が無いという結果が出た、とされている。"}, {"t": 1851.2833333333333, "x": "49年ぶりに、身元が分かったのね。"}, {"t": 1854.0833333333333, "x": "そして同じ日、公安部は桐島聡容疑者を、\n被疑者死亡のまま書類送検した。"}, {"t": 1859.25, "x": "容疑は、爆発物取締罰則違反と、殺人未遂。"}, {"t": 1862.9666666666667, "x": "対象は5つの事件だ。"}, {"t": 1864.65, "x": "指名手配の理由になった事件と、そのほかに4件。"}, {"t": 1867.9333333333334, "x": "内訳を見ると、1974年12月の鹿島建設。"}, {"t": 1871.85, "x": "1975年2月のハザマ組の本社と大宮工場。"}, {"t": 1875.8, "x": "4月のハザマ組の江戸川の作業所。"}, {"t": 1877.9833333333333, "x": "5月の京成の橋の工事現場。"}, {"t": 1880.1833333333334, "x": "ここで、さっき覚えておいてほしいと\n言った点が効いてくる。"}, {"t": 1883.55, "x": "……三菱重工が、入っていない。"}, {"t": 1885.7333333333333, "x": "入っていない。"}, {"t": 1886.6333333333334, "x": "桐島が属していたとされた班は「さそり」で、\n三菱重工を担当したとされたのは「狼」だった。"}, {"t": 1893.15, "x": "だから桐島は、8人が亡くなった\n事件そのもので立件されてはいない。"}, {"t": 1897.5, "x": "ここを取り違えている説明は、けっこう多い。"}, {"t": 1899.9666666666667, "x": "「三菱重工爆破の犯人が\n49年ぶりに」という言い方だ。"}, {"t": 1904.1333333333334, "x": "正確ではない。連続企業爆破事件のうちの5件で、\n被疑者死亡のまま書類送検された、が正しい。"}, {"t": 1910.55, "x": "そして2024年3月21日、東京地方検察庁は、\n被疑者死亡を理由に不起訴処分とした。"}, {"t": 1917.2666666666667, "x": "裁判は、無いのね。"}, {"t": 1918.8166666666666, "x": "無い。ここで最初の話に戻る。"}, {"t": 1920.9833333333333, "x": "時効は来ていなかった。"}, {"t": 1922.3, "x": "制度としては、まだ起訴できる状態だった。"}, {"t": 1925.0666666666666, "x": "だが、起訴するべき相手がいなくなった。"}, {"t": 1927.5, "x": "49年、時計は止まっていた。"}, {"t": 1929.5833333333333, "x": "止まっていたのに、間に合わなかった。"}, {"t": 1931.8166666666666, "x": "だから私は、この回の最初に断りを入れた。"}, {"t": 1934.8, "x": "桐島聡は起訴されていない。"}, {"t": 1936.6333333333334, "x": "判決を受けていない。"}, {"t": 1937.9, "x": "有罪とされた事実は一つも無い。"}, {"t": 1940.1666666666667, "x": "本人が名乗り、捜査当局が本人と特定し、\n被疑者死亡のまま書類送検した。そこまでが記録だ。"}, {"t": 1946.75, "x": "何をやったのか。誰と、どうやってやったのか。\nなぜ49年逃げ続けたのか。"}, {"t": 1951.7333333333333, "x": "どれも、裁判の場で確かめられることはなかった。"}, {"t": 1954.9166666666667, "x": "……何も分からないまま終わったのね。"}, {"t": 1956.9833333333333, "x": "分からないまま終わった。それが、\nこの事件のいまの状態だ。"}, {"t": 1961.2166666666667, "x": "最後に、この事件が確かに\n動かしたものの話をしたい。"}, {"t": 1964.8, "x": "亡くなった8人と、負傷した人たちのことだ。"}, {"t": 1967.9, "x": "当時、犯罪の被害者を国が\n助ける制度は、日本に無かった。"}, {"t": 1972.1, "x": "無かったの？"}, {"t": 1973.0666666666666, "x": "無い。犯人に賠償させるのが\n筋だ、というのが建前だった。"}, {"t": 1976.9333333333334, "x": "だが、犯人が\n捕まらなければ、あるい const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
