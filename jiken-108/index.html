<script>
const D={"name": "108", "file": "108_編集用", "dur": 2057.7333125, "segs": [], "subs": [{"t": 0.0, "x": "1949年1月26日、朝の7時20分。"}, {"t": 4.15, "x": "奈良県の法隆寺で、金堂の中から煙が上がった。"}, {"t": 7.566666666666666, "x": "法隆寺ってあの法隆寺？"}, {"t": 9.25, "x": "そうだ。世界でいちばん古い\n木造建築として知られる寺だ。"}, {"t": 13.033333333333333, "x": "火が消えたのは、9時5分。"}, {"t": 14.75, "x": "2時間もたっていない。"}, {"t": 16.25, "x": "建物は残ったの？"}, {"t": 17.75, "x": "残った。燃え落ちてはいない。"}, {"t": 19.516666666666666, "x": "消えたのは壁に描かれていた色だ。"}, {"t": 21.75, "x": "色？"}, {"t": 22.316666666666666, "x": "金堂の壁には仏さまの絵が12面あった。"}, {"t": 25.15, "x": "飛鳥の時代から残ってきた、古い仏教の絵だ。"}, {"t": 28.25, "x": "その色がひと朝でほとんど失われた。"}, {"t": 30.633333333333333, "x": "あとに残ったのは黒い線だけだった。"}, {"t": 33.016666666666666, "x": "線だけ？"}, {"t": 33.86666666666667, "x": "当時の国会で役所の人はこう言っている。"}, {"t": 36.43333333333333, "x": "写真のネガを見ているような感じだ。"}, {"t": 38.68333333333333, "x": "白と黒が逆になったあのネガ？"}, {"t": 40.78333333333333, "x": "そうだ。色が抜けて、線だけが浮いていた。"}, {"t": 43.5, "x": "この火事にはもうひとつ残ったものがある。"}, {"t": 45.88333333333333, "x": "なぜ火が出たのかという問いだ。"}, {"t": 47.65, "x": "4人が起訴されて裁判にもなった。"}, {"t": 49.88333333333333, "x": "それでも寺は今もこう書いている。"}, {"t": 51.85, "x": "出火の原因が分からない炎に包まれた。"}, {"t": 54.63333333333333, "x": "裁判までして分かっていないの？"}, {"t": 56.65, "x": "分かっていないと寺自身が書いている。"}, {"t": 58.81666666666667, "x": "今回は、この朝に何があったのかを\n国会の記録で順に見ていく。"}, {"t": 62.85, "x": "先に言っておく。この動画は、\n誰か一人のせいにはしない。"}, {"t": 66.48333333333333, "x": "どうして？"}, {"t": 67.3, "x": "記録を読むと、一人の失敗では説明できないからだ。"}, {"t": 70.73333333333333, "x": "まずは焼ける前の壁画から話そう。"}, {"t": 73.55, "x": "法隆寺は奈良県の斑鳩町にある。"}, {"t": 75.73333333333333, "x": "金堂はその中心に建つお堂だ。"}, {"t": 77.83333333333333, "x": "中には本尊の釈迦三尊像がまつられている。"}, {"t": 80.73333333333333, "x": "仏像が中にならんでいるのね。"}, {"t": 82.8, "x": "そのまわりを囲む壁に絵が描かれていた。"}, {"t": 85.25, "x": "大きな壁が4面ある。"}, {"t": 86.76666666666667, "x": "高さは約3.1メートル、幅は約2.6メートルだ。"}, {"t": 90.43333333333334, "x": "小さな壁が8面。高さは同じで、幅は約1.5メートル。"}, {"t": 94.45, "x": "あわせて12面。これを外陣の壁画と呼ぶ。"}, {"t": 97.25, "x": "3メートルって、家の天井より高いわよね。"}, {"t": 100.13333333333334, "x": "少し高い。見上げる大きさだ。"}, {"t": 102.18333333333334, "x": "大きな壁には、仏さまの国の様子が描かれていた。"}, {"t": 105.6, "x": "真ん中に仏さまがいて、まわりに菩薩がならぶ絵だ。"}, {"t": 108.9, "x": "6号壁と呼ばれる壁には、阿弥陀浄土図があった。"}, {"t": 112.01666666666667, "x": "その脇に立つ観音さまの顔は、とくに知られていた。"}, {"t": 115.4, "x": "教科書で見たことあるかも。"}, {"t": 117.2, "x": "あるかもしれない。戦後には、\n切手の絵にもなっている。"}, {"t": 120.38333333333334, "x": "その話はもう少しあとでする。"}, {"t": 122.38333333333334, "x": "お堂の内側の高いところにも壁画があった。"}, {"t": 125.15, "x": "空を舞う天人を描いた飛天図が、20面だ。"}, {"t": 128.25, "x": "じゃあ全部で32面？"}, {"t": 129.83333333333334, "x": "数えればそうなる。"}, {"t": 130.98333333333332, "x": "ただ、この20面は火事のときにお堂の中になかった。"}, {"t": 134.46666666666667, "x": "外に出してあったの？"}, {"t": 135.98333333333332, "x": "そうだ。本尊の釈迦三尊像も、外に出されていた。"}, {"t": 139.43333333333334, "x": "法隆寺の文章には、そのおかげで無事だったとある。"}, {"t": 142.51666666666668, "x": "お堂の中に残っていたのは、外陣の12面だけだった。"}, {"t": 146.1, "x": "12面だけが置いていかれたのね。"}, {"t": 148.23333333333332, "x": "なぜ12面だけが残っていたのか。"}, {"t": 150.43333333333334, "x": "そこにこの火事のいちばん大きな事情がある。"}, {"t": 153.56666666666666, "x": "法隆寺では、1934年から大きな修理が始まっていた。"}, {"t": 157.76666666666668, "x": "のちに昭和の大修理と呼ばれる工事だ。"}, {"t": 160.13333333333333, "x": "国はほかの国宝よりも多くのお金を出していた。"}, {"t": 163.15, "x": "特別あつかいだったのね。"}, {"t": 164.96666666666667, "x": "それだけ大事な寺だと考えられていた。"}, {"t": 167.43333333333334, "x": "1949年の初めには、13の建物の修理が終わっていた。"}, {"t": 172.01666666666668, "x": "残っていたのは五重塔と金堂だけだ。"}, {"t": 174.61666666666667, "x": "その2つがいちばんの大物でしょう？"}, {"t": 176.83333333333334, "x": "そうだ。しかも途中で、戦争がはさまった。"}, {"t": 179.73333333333332, "x": "空襲にそなえて外せる部分は外して運び出した。"}, {"t": 182.86666666666667, "x": "安全な場所へ木材を疎開させたんだ。"}, {"t": 185.4, "x": "じゃあ、壁画も疎開させればよかったんじゃない？"}, {"t": 188.2, "x": "国会でもまさにそれが聞かれている。"}, {"t": 190.35, "x": "役所の答えはこうだった。"}, {"t": 192.01666666666668, "x": "壁画は美術品であると同時に、拝む相手でもある。"}, {"t": 195.18333333333334, "x": "寺は壁画に向かって手を\n合わせ、花や香をささげてきた。"}, {"t": 198.65, "x": "だから壁を動かすことに、寺の了承が取れなかった。"}, {"t": 202.08333333333334, "x": "絵じゃなくて仏さまそのものなのね。"}, {"t": 204.4, "x": "寺から見ればそうなる。"}, {"t": 205.8, "x": "そのせいで金堂は変わった姿になっていた。"}, {"t": 208.46666666666667, "x": "上の部分をそっくり外し、いちばん\n下の柱と壁だけを残した。"}, {"t": 212.5, "x": "そこに雨よけの仮の屋根をかぶせた。"}, {"t": 214.73333333333332, "x": "これを素屋根という。"}, {"t": 216.01666666666668, "x": "屋根の下にもうひとつ屋根がある感じ？"}, {"t": 218.45, "x": "大きな小屋で、建物ごと覆っている感じだ。"}, {"t": 221.18333333333334, "x": "壁画はその小屋の中に立ったまま残された。"}, {"t": 223.95, "x": "周りを閉め切った暗い場所だ。"}, {"t": 225.76666666666668, "x": "この閉め切った形が、火事の朝に大きく効いてくる。"}, {"t": 229.65, "x": "修理が始まった翌年、1935年の夏。"}, {"t": 233.23333333333332, "x": "文部省の事業として、壁画の写真を撮ることになった。"}, {"t": 236.85, "x": "記録のため？"}, {"t": 237.95, "x": "そうだ。今の姿をそのまま残すためだ。"}, {"t": 240.66666666666666, "x": "撮影を受け持ったのは、\n京都の便利堂という会社だった。"}, {"t": 244.1, "x": "始まったのは8月1日。"}, {"t": 245.88333333333333, "x": "終わったのは10月の半ばだ。"}, {"t": 247.9, "x": "写真に、2か月半もかかったの？"}, {"t": 250.3, "x": "かかった。原寸大で撮ったからだ。"}, {"t": 252.6, "x": "大きな壁は縦に6つ横に7つ。"}, {"t": 254.91666666666666, "x": "42枚に分けて撮っている。"}, {"t": 256.76666666666665, "x": "小さな壁は、24枚に分けた。"}, {"t": 259.23333333333335, "x": "パズルみたいにつなげるのね。"}, {"t": 261.05, "x": "そうだ。写したのは、大きなガラスの板だ。"}, {"t": 263.8666666666667, "x": "1枚がおよそ縦56センチ、横46センチある。"}, {"t": 267.45, "x": "このガラスの原板が、363枚残っている。"}, {"t": 270.98333333333335, "x": "火事の14年前の写真ってこと？"}, {"t": 273.28333333333336, "x": "そうなる。のちに、この写真が大きな意味を持つ。"}, {"t": 276.25, "x": "2015年、このガラス原板は国の重要文化財になった。"}, {"t": 280.21666666666664, "x": "写真が文化財になったの？"}, {"t": 282.1, "x": "焼ける前の姿を原寸大で写した記録だからだ。"}, {"t": 285.3, "x": "この原板は、今では高い精細さで\nデジタル化もされている。"}, {"t": 288.8833333333333, "x": "大きな壁は、300億画素を超えるそうだ。"}, {"t": 291.7, "x": "300億ってもう想像がつかないわ。"}, {"t": 294.0833333333333, "x": "筆の跡まで追える細かさだ。"}, {"t": 295.9166666666667, "x": "そしてもうひとつこの写真には役目があった。"}, {"t": 298.6, "x": "模写の下絵になったんだ。"}, {"t": 300.81666666666666, "x": "写真を撮ったあと国は次の手を打った。"}, {"t": 303.1333333333333, "x": "画家に、壁画をそっくり写して描かせる計画だ。"}, {"t": 306.3, "x": "これを模写という。"}, {"t": 307.48333333333335, "x": "写真があるのに絵でも写すの？"}, {"t": 309.4166666666667, "x": "写真だけでは、色や筆の運びまでは伝えきれない。"}, {"t": 312.5833333333333, "x": "それに壁画は少しずつはがれ落ちていた。"}, {"t": 315.06666666666666, "x": "どんな方法でも、今の姿がそのまま残るのは難しい。"}, {"t": 318.65, "x": "役所は国会でそう説明している。"}, {"t": 320.85, "x": "模写は、1940年の9月に始まった。"}, {"t": 324.03333333333336, "x": "集められた画家は、20人あまりだ。"}, {"t": 326.3666666666667, "x": "班に分かれて壁ごとに受け持った。"}, {"t": 328.46666666666664, "x": "班をまとめたのは、荒井寛方、\n中村岳陵、橋本明治、入江波光の4人。"}, {"t": 333.75, "x": "4つの班なのね。"}, {"t": 335.1666666666667, "x": "写真を土台にして壁の前で色を合わせていく。"}, {"t": 337.9, "x": "お堂の中は暗い。だから、明かりが要った。"}, {"t": 340.56666666666666, "x": "そこで入れたのが蛍光灯だ。"}, {"t": 342.46666666666664, "x": "1940年にもう蛍光灯があったの？"}, {"t": 345.3666666666667, "x": "あった。ただ、文化財の中に\n電気を入れるのは大ごとだった。"}, {"t": 349.05, "x": "専門家を集めた協議会で話し合いをしている。"}, {"t": 351.8833333333333, "x": "安全を確かめてから蛍光灯を入れた。"}, {"t": 354.23333333333335, "x": "これは覚えておいてほしい。"}, {"t": 355.78333333333336, "x": "蛍光灯はちゃんと手順をふんだのね。"}, {"t": 358.0833333333333, "x": "そうだ。蛍光灯は、だ。"}, {"t": 359.8333333333333, "x": "画家が使う火にも決まりがあった。"}, {"t": 361.85, "x": "絵の具をとく膠を温めるのは、小さな電気コンロだ。"}, {"t": 365.1666666666667, "x": "光が見えるから、消し忘れに気づきやすい。"}, {"t": 367.8666666666667, "x": "たばこは扉の外の仮小屋でしか吸えない。"}, {"t": 370.48333333333335, "x": "スイッチは二重に切るようにしていた。"}, {"t": 372.68333333333334, "x": "けっこう気をつけていたのね。"}, {"t": 374.48333333333335, "x": "役所の説明ではそうだ。"}, {"t": 376.15, "x": "ただ最初からそうだったわけではない。"}, {"t": 378.23333333333335, "x": "火事のあとの国会で、ある委員が\n昔の様子を話している。"}, {"t": 381.76666666666665, "x": "作家の中野重治だ。当時は参議院の議員だった。"}, {"t": 385.23333333333335, "x": "作家が国会議員だったの？"}, {"t": 387.15, "x": "そうだ。この委員会には、作家の議員がもう1人いた。"}, {"t": 390.5, "x": "中野の記憶では、修理が始まった\nころの現場はこうだった。"}, {"t": 394.1166666666667, "x": "大工さんが下帯ひとつでたばこを\nくわえて仕事をしていた。"}, {"t": 397.6166666666667, "x": "法隆寺の中で？"}, {"t": 398.93333333333334, "x": "食堂か聖霊院か、どちらかの工事だったそうだ。"}, {"t": 402.31666666666666, "x": "役所の答えは、火にうるさくなったのは\n蛍光灯を入れたころからだ。"}, {"t": 406.26666666666665, "x": "毎年の協議会で学者から注意を受けるようになった。"}, {"t": 409.56666666666666, "x": "だんだん厳しくなっていったのね。"}, {"t": 411.6666666666667, "x": "そうだ。厳しくなった途中で、あの冬が来る。"}, {"t": 414.5833333333333, "x": "そしてもうひとつ模写には決まりがあった。"}, {"t": 416.95, "x": "真夏と真冬は仕事を休むことだ。"}, {"t": 419.31666666666666, "x": "暑すぎたり寒すぎたりするから？"}, {"t": 421.45, "x": "気候のためだと、国会では説明されている。"}, {"t": 424.26666666666665, "x": "春と秋だけ壁の前に座る。"}, {"t": 426.25, "x": "そうやって、10年近くが過ぎていった。"}, {"t": 429.3833333333333, "x": "ここで時計を少し戻す。"}, {"t": 431.06666666666666, "x": "火事の1年3か月前、1947年の10月だ。"}, {"t": 435.06666666666666, "x": "国会の文化委員会が法隆寺を見に行っている。"}, {"t": 437.9166666666667, "x": "国会の人がわざわざ？"}, {"t": 439.6166666666667, "x": "10人ほどで行っている。"}, {"t": 441.01666666666665, "x": "この委員会が外へ調べに出たのは、\nそのとき1回だけだった。"}, {"t": 444.93333333333334, "x": "その1回が法隆寺だったのね。"}, {"t": 447.03333333333336, "x": "帰ってきて、11月11日に\n文部大臣たちに注意を伝えた。"}, {"t": 451.45, "x": "なんて言ったの？"}, {"t": 452.55, "x": "火を消す備えによく気をつけてほしい。"}, {"t": 454.76666666666665, "x": "燃えやすい建物の中に大事なものを置くのは危ない。"}, {"t": 457.8, "x": "離しておいたほうがいいのではないか。"}, {"t": 459.96666666666664, "x": "それって、ほとんど言い当ててるじゃない。"}, {"t": 462.21666666666664, "x": "火事のあとの国会で、これを持ち出した委員がいる。"}, {"t": 465.1666666666667, "x": "山本勇造だ。作家の山本有三の本名だよ。"}, {"t": 468.5833333333333, "x": "路傍の石の山本有三？"}, {"t": 470.4, "x": "そうだ。当時は参議院の議員だった。"}, {"t": 472.73333333333335, "x": "山本はこう聞いている。"}, {"t": 474.2, "x": "あのとき注意したことは、現場まで伝わっていたのか。"}, {"t": 477.43333333333334, "x": "役所の答えはこうだった。"}, {"t": 479.0833333333333, "x": "注意は、よく覚えている。"}, {"t": 480.56666666666666, "x": "技術者とも相談した。"}, {"t": 482.25, "x": "壁をよそへ移せないかも話にのぼった。"}, {"t": 484.75, "x": "ただ、壁を移すところまでは、寺と話が進まなかった。"}, {"t": 488.6333333333333, "x": "またそこなのね。"}, {"t": 489.8833333333333, "x": "またそこだ。"}, {"t": 490.78333333333336, "x": "役所はこうも言っている。"}, {"t": 492.21666666666664, "x": "寺がもう少し早く\n承知してくれたら、という気持ちもする。"}, {"t": 495.75, "x": "ただそれは言い訳にもならない。"}, {"t": 497.6333333333333, "x": "自分で、言い訳にならないって言ったのね。"}, {"t": 500.25, "x": "言っている。記録に残っている。"}, {"t": 502.1666666666667, "x": "注意は届いていた。でも、壁は動かなかった。"}, {"t": 505.15, "x": "そのまま、1949年の冬が来る。"}, {"t": 508.8, "x": "1948年の暮れ、模写の進め方が変わった。"}, {"t": 512.5333333333333, "x": "完成の期限が決められたんだ。"}, {"t": 514.4833333333333, "x": "1949年度のうちに、模写を終わらせること。"}, {"t": 518.0166666666667, "x": "急にどうして？"}, {"t": 519.15, "x": "のちの国会で、ある議員が理由を2つ挙げている。"}, {"t": 522.1333333333333, "x": "ひとつは、東京で法隆寺の展覧会を\n開く計画があったこと。"}, {"t": 526.1166666666667, "x": "模写をそこに出したかった。"}, {"t": 527.7833333333333, "x": "もうひとつは、10年たっても終わりが見えないことだ。"}, {"t": 530.9333333333333, "x": "それで冬もやることにしたの？"}, {"t": 532.8833333333333, "x": "そうだ。1月と2月の、いちばん\n寒い時期に金堂にこもる。"}, {"t": 536.75, "x": "役所の説明では画家たちも熱心だった。"}, {"t": 539.4, "x": "真冬でも続けたいと言っていたそうだ。"}, {"t": 541.7833333333333, "x": "寒い中で筆を持つのね。"}, {"t": 543.5666666666667, "x": "画家の日当は、300円だった。"}, {"t": 545.8, "x": "泊まるのは粗末なバラックの小屋だ。"}, {"t": 547.9, "x": "これも国会で別の議員が指摘している。"}, {"t": 550.5166666666667, "x": "きびしい条件ね。"}, {"t": 551.8333333333334, "x": "そこで体を温める道具が要る。"}, {"t": 553.9166666666666, "x": "炭火はもちろん危ない。"}, {"t": 555.3666666666667, "x": "では何がいいか。"}, {"t": 556.4666666666667, "x": "安全だと考えられたのが電気の座布団だった。"}, {"t": 559.45, "x": "電気座布団？"}, {"t": 560.55, "x": "座布団の中に電熱線が入っていて、温かくなるものだ。"}, {"t": 564.3166666666667, "x": "国会では、しろうと考えから安全だと\n思われた、と言われている。"}, {"t": 568.2666666666667, "x": "座布団は京都の百貨店から納められた。"}, {"t": 570.85, "x": "お堂の中に入ったのは、1月16日だと言われている。"}, {"t": 574.5333333333333, "x": "火事の、10日前ね。"}, {"t": 576.1166666666667, "x": "そうだ。冬の模写は、この座布団と一緒に始まった。"}, {"t": 580.15, "x": "ここでさっきの蛍光灯を思い出してほしい。"}, {"t": 582.6, "x": "蛍光灯は協議会で話し合って入れた。"}, {"t": 584.9833333333333, "x": "電気座布団はどうだったか。"}, {"t": 586.8333333333334, "x": "同じように話し合ったんでしょう？"}, {"t": 588.7833333333333, "x": "話し合っていない。"}, {"t": 589.9, "x": "現場の主任の技師が、画家と相談して入れた。"}, {"t": 592.85, "x": "国会ではそう説明されている。"}, {"t": 594.8, "x": "文部省は前もって知らなかったそうだ。"}, {"t": 597.2166666666667, "x": "現場だけで決めちゃったのね。"}, {"t": 599.0666666666667, "x": "議員からもそこを突かれた。"}, {"t": 600.7, "x": "蛍光灯でさえ大さわぎだったのに、\nなぜ現場で許したのか。"}, {"t": 604.2666666666667, "x": "役所はこう認めている。"}, {"t": 605.7833333333333, "x": "本来なら、同じように確かめるべきだった。"}, {"t": 608.5666666666667, "x": "物事を軽く考えたのか、急いで焦ったのか。"}, {"t": 611.6666666666666, "x": "相談をまったくせずに使ってしまった。"}, {"t": 614.1833333333333, "x": "はっきり認めてるのね。"}, {"t": 615.7666666666667, "x": "ただ、現場が何もしなかったわけではない。"}, {"t": 618.3666666666667, "x": "座布団を見張るために、電気の技術者を雇っている。"}, {"t": 621.5166666666667, "x": "技術者は座布団を一応調べた。"}, {"t": 623.6666666666666, "x": "そしてもっと安全にしようと考えた。"}, {"t": 626.0, "x": "座布団の中に細いヒューズを付ける計画だ。"}, {"t": 628.85, "x": "ヒューズって、電気が流れすぎると切れる部品よね。"}, {"t": 631.9833333333333, "x": "そうだ。おかしなときは、\nすぐに電気が止まるようにする。"}, {"t": 635.3666666666667, "x": "そのヒューズを大阪まで買いに行った。"}, {"t": 637.4, "x": "火事の前の日、1月25日だ。"}, {"t": 639.85, "x": "戻ったのはその日の夜遅くだった。"}, {"t": 642.0833333333334, "x": "いよいよ取り付けようとした、その朝に火が出た。"}, {"t": 645.0833333333334, "x": "その朝に？"}, {"t": 646.0333333333333, "x": "その朝だ。"}, {"t": 646.8833333333333, "x": "記録に残っているのはこの順番だけだ。"}, {"t": 649.3333333333334, "x": "付けていれば防げたかどうかは、\nどこにも書かれていない。"}, {"t": 653.1666666666666, "x": "1月26日の朝に戻ろう。"}, {"t": 655.3666666666667, "x": "法隆寺には火事を知らせる仕組みがあった。"}, {"t": 657.7666666666667, "x": "お堂の中で新聞紙を1枚燃やすだけで、\n事務所に知らせが届く。"}, {"t": 661.9166666666666, "x": "すごく敏感じゃない。"}, {"t": 663.3166666666667, "x": "敏感だ。ただ、金堂には付いていなかった。"}, {"t": 666.3, "x": "えっ。どうして？"}, {"t": 667.5166666666667, "x": "作っていた会社が、戦争中に\n仕事を続けられなくなった。"}, {"t": 671.3166666666667, "x": "装置が手に入るのは、1941年ごろまでだったらしい。"}, {"t": 675.2666666666667, "x": "それより後に修理した建物には、付けられなかった。"}, {"t": 678.6666666666666, "x": "よりによってそのときに。"}, {"t": 680.2666666666667, "x": "代わりの備えは、2つあった。"}, {"t": 682.2666666666667, "x": "ひとつは、裏山の高いところに\nつくった大きな貯水池だ。"}, {"t": 685.85, "x": "そこから境内のあちこちに消火栓を引いていた。"}, {"t": 688.7166666666667, "x": "五重塔より高く水が上がる強さがある。"}, {"t": 691.2833333333333, "x": "もうひとつは夜回りだ。"}, {"t": 692.7166666666667, "x": "だいたい2時間おきに、決まった道を歩いて見回る。"}, {"t": 695.9, "x": "お寺の人が？"}, {"t": 697.0666666666667, "x": "工事事務所の人だ。"}, {"t": 698.4666666666667, "x": "寺には、働き手が2、3人しか残っていなかった。"}, {"t": 701.9833333333333, "x": "暮らしが苦しくて、人を雇えなかったそうだ。"}, {"t": 704.9666666666667, "x": "戦争のあとだものね。"}, {"t": 706.5166666666667, "x": "火事の30分ほど前、住職が\n金堂のすぐ脇を通っている。"}, {"t": 710.4166666666666, "x": "そのときは何も気づかなかった。"}, {"t": 712.5333333333333, "x": "中では、もう燃えてたかもしれないのに？"}, {"t": 715.0166666666667, "x": "役所はこう言っている。"}, {"t": 716.3666666666667, "x": "いちばん安全だと思っていた\n油断が、災いしたのではないか。"}, {"t": 720.05, "x": "そして、7時過ぎ。"}, {"t": 721.5333333333333, "x": "何人かがほとんど同時に煙に気づいた。"}, {"t": 724.0833333333334, "x": "記録では、発見は7時20分とされている。"}, {"t": 727.0666666666667, "x": "みんな駆けつけて火を消しにかかった。"}, {"t": 729.9166666666666, "x": "問題は金堂の形だった。"}, {"t": 731.8333333333334, "x": "上半分がなく、素屋根でまるごと覆われている。"}, {"t": 734.6166666666667, "x": "周りはすっかり閉め切ってあった。"}, {"t": 736.7, "x": "中に水が届かないの？"}, {"t": 738.4, "x": "そこで素屋根と天井の間からホースを入れた。"}, {"t": 741.1, "x": "見つけてからおよそ10分で、\n水がお堂の中に入り始めた。"}, {"t": 744.9833333333333, "x": "10分なら早いほうよね。"}, {"t": 746.7166666666667, "x": "消防の人にほめられるくらい、手順はよかったそうだ。"}, {"t": 749.9166666666666, "x": "裏山の貯水池の水も勢いよく出た。"}, {"t": 752.3333333333334, "x": "隣の五重塔にも大きな素屋根が建っていた。"}, {"t": 755.1166666666667, "x": "高さは、30メートルを超える小屋だ。"}, {"t": 757.5333333333333, "x": "その素屋根にも火が移りかけている。"}, {"t": 759.7833333333333, "x": "五重塔まで？"}, {"t": 760.9666666666667, "x": "こちらは強い水ですぐに消えた。"}, {"t": 762.95, "x": "五重塔には、火も水も、まったく\n傷を与えなかったそうだ。"}, {"t": 766.75, "x": "だが金堂の中はちがった。"}, {"t": 768.5166666666667, "x": "閉め切っていて空気があまり入らない。"}, {"t": 770.6666666666666, "x": "炎が高く上がるのではなく、蒸し焼きになった。"}, {"t": 773.7166666666667, "x": "蒸し焼き……。"}, {"t": 774.5833333333334, "x": "水もたくさん入った。"}, {"t": 776.05, "x": "あとで扉を開けると、水が30センチ以上たまっていた。"}, {"t": 779.5166666666667, "x": "火は、9時5分に消えた。"}, {"t": 781.2, "x": "消火そのものは、うまくいったと言っていい。"}, {"t": 783.65, "x": "それでも、守りたかったものは守れなかった。"}, {"t": 786.55, "x": "壁画は火と水の両方を受けたのね。"}, {"t": 788.9333333333333, "x": "そういうことだ。"}, {"t": 790.5833333333334, "x": "火が消えたあとの金堂の中を見ていこう。"}, {"t": 792.9333333333333, "x": "柱と扉はどれも同じくらい焦げていた。"}, {"t": 795.4833333333333, "x": "深さは、1.5センチから3センチほどだ。"}, {"t": 798.4333333333333, "x": "全部？"}, {"t": 799.15, "x": "ほぼ全部だ。"}, {"t": 800.0833333333334, "x": "北西の柱が1本だけ無傷で残っていた。"}, {"t": 802.95, "x": "なぜそこだけ火が行かなかったのか、と\n役所も首をかしげている。"}, {"t": 806.7166666666667, "x": "外側の丸い柱は、18本ある。"}, {"t": 809.2, "x": "どれも、お堂の内側を向いた\n3分の2ほどが焼けていた。"}, {"t": 812.75, "x": "中から燃えたってことね。"}, {"t": 814.4833333333333, "x": "そうだ。火はお堂の中から出ている。"}, {"t": 816.6833333333333, "x": "そして壁画だ。"}, {"t": 817.85, "x": "6号壁には大きな穴が3つあいた。"}, {"t": 820.2333333333333, "x": "ほかの壁は、もともとのひびやは\nがれが大きく広がった。"}, {"t": 823.6166666666667, "x": "いちばん大きかったのは色だ。"}, {"t": 825.35, "x": "絵の具の色が熱でほとんど失われた。"}, {"t": 827.8, "x": "それがネガみたいって話ね。"}, {"t": 829.75, "x": "そうだ。線だけが残っている、と国会で説明された。"}, {"t": 833.2666666666667, "x": "役所の局長は、その日のうちに現地へ駆けつけている。"}, {"t": 836.7166666666667, "x": "そして国会でこう言った。"}, {"t": 838.3166666666667, "x": "建物は、元のとおり建て直すのは難しくない。"}, {"t": 841.4333333333333, "x": "ただ壁画だけは、どうにも元に戻る見込みがない。"}, {"t": 844.4666666666667, "x": "局長は、国会でまず頭を下げている。"}, {"t": 847.05, "x": "念には念を入れてやっているつもりだった。"}, {"t": 849.4, "x": "それでも不注意の点があったのだろう。"}, {"t": 851.5333333333333, "x": "まことに申し訳ない。"}, {"t": 853.0666666666667, "x": "役所の人が、最初に謝ったのね。"}, {"t": 855.5666666666667, "x": "建物は直せても絵は戻らないのね。"}, {"t": 857.9666666666667, "x": "上の部分は疎開してあったから無事だった。"}, {"t": 860.4833333333333, "x": "本尊も飛天図も外にあった。"}, {"t": 862.4666666666667, "x": "焼けたのは、動かせなかった12面だった。"}, {"t": 865.3166666666667, "x": "動かせなかったものだけが焼けた。"}, {"t": 867.4833333333333, "x": "結果として、そういう形になってしまった。"}, {"t": 870.9, "x": "火事から10日後の2月5日と6日。"}, {"t": 873.25, "x": "法隆寺に専門家が30人ほど集まった。"}, {"t": 876.0166666666667, "x": "これからどうするかを決める話し合いだ。"}, {"t": 878.35, "x": "寺の人もいたの？"}, {"t": 879.7333333333333, "x": "寺の人も同じ席にいた。"}, {"t": 881.5333333333333, "x": "ここで大きな決まりがいくつも出ている。"}, {"t": 883.7166666666667, "x": "まず修理は止めずに続ける。"}, {"t": 885.45, "x": "五重塔は1950年、金堂は1951年に\n仕上げる見込みを立てた。"}, {"t": 890.6333333333333, "x": "焼けた分の模写は2年のうちに描き足す。"}, {"t": 893.3166666666667, "x": "壁画そのものはどうするの？"}, {"t": 895.1333333333333, "x": "ここで寺も考えを変えた。"}, {"t": 896.8333333333334, "x": "建物を土台から組み直すなら壁を外すしかない。"}, {"t": 899.9, "x": "壁は一度外して寝かせて安全な場所に置く。"}, {"t": 902.7, "x": "はがれかけた絵の具は樹脂で壁に留める。"}, {"t": 905.1333333333333, "x": "あれだけ動かせなかった壁を動かすのね。"}, {"t": 907.75, "x": "焼けてから、動かすことになった。"}, {"t": 909.95, "x": "2月28日には国の会議で急ぎの手当ても決まった。"}, {"t": 913.55, "x": "その年度のうちに50万円を出すことだ。"}, {"t": 916.2, "x": "とりあえずのお金ね。"}, {"t": 917.6, "x": "4月の終わりには衆議院の委員も見に来ている。"}, {"t": 920.25, "x": "5人の議員が夜行列車で東京を\nたち、翌朝奈良に着いた。"}, {"t": 923.8833333333333, "x": "金堂の中を見た報告はこうだ。"}, {"t": 925.95, "x": "すみずみまで蒸し焼きになっていて\n目をおおうばかりだった。"}, {"t": 928.95, "x": "報告はこう続く。"}, {"t": 930.25, "x": "千年以上前の木の建物が今まで\n残っていたこと自体が奇跡かもしれない。"}, {"t": 934.8666666666667, "x": "祖先はそれを持ちこたえてきた。"}, {"t": 936.7833333333333, "x": "だから私たちは十分に反省し、二度と\n同じあやまちを繰り返さない決意が要る。"}, {"t": 941.7333333333333, "x": "千年もったものを、私たちの代で焼いたってことね。"}, {"t": 945.15, "x": "報告した議員は、そう受け止めていた。"}, {"t": 947.7, "x": "議員が見ても、そう思うのね。"}, {"t": 949.7166666666667, "x": "一方でこの春には東京で展覧会が開かれた。"}, {"t": 952.75, "x": "5月15日から6月14日までの法隆寺の文化展だ。"}, {"t": 956.5166666666667, "x": "焼け残った分の模写が、ここで初めて公開された。"}, {"t": 959.9333333333333, "x": "前に言ってた、模写を出したかった展覧会？"}, {"t": 962.7833333333333, "x": "そうだ。予定どおり開かれた。"}, {"t": 964.7166666666667, "x": "国会では、これにも厳しい声が出た。"}, {"t": 967.1166666666667, "x": "火事の原因と展覧会の計画は深く関わっている。"}, {"t": 970.4166666666666, "x": "そうである以上、開くのは\n控えるべきだったのではないか。"}, {"t": 973.8166666666667, "x": "火事のきっかけになった計画だものね。"}, {"t": 976.3333333333334, "x": "一方で、焼け残った模写を\n初めて人に見せる場にもなった。"}, {"t": 980.0333333333333, "x": "記録には、その両方が残っている。"}, {"t": 982.9833333333333, "x": "では火はどこから出たのか。"}, {"t": 984.6, "x": "最初に疑われたのはもちろん電気座布団だ。"}, {"t": 987.35, "x": "焼け残った座布団を大阪の大学で調べている。"}, {"t": 990.45, "x": "何が分かったの？"}, {"t": 991.7166666666667, "x": "気になる点が、3つ出てきた。"}, {"t": 993.7666666666667, "x": "ひとつめは温度で電気を止める部品だ。"}, {"t": 996.1, "x": "サーモスタットという。"}, {"t": 997.3833333333333, "x": "本来は60度くらいで止まるはずだった。"}, {"t": 999.8666666666667, "x": "それが、80度くらいになってやっと効いた。"}, {"t": 1002.6833333333333, "x": "20度もずれてたの？"}, {"t": 1004.1333333333333, "x": "実験ではそうだった、と国会で説明されている。"}, {"t": 1007.2333333333333, "x": "ふたつめは石綿だ。"}, {"t": 1008.6, "x": "電熱線の上と下を、石綿の薄い\n板ではさむのが普通だった。"}, {"t": 1012.65, "x": "その石綿が省かれていた。"}, {"t": 1014.55, "x": "熱から守る板が入ってなかったのね。"}, {"t": 1017.1, "x": "みっつめは線のつながり方だ。"}, {"t": 1018.9833333333333, "x": "つなぎ目の触れ合いがよくなかった。"}, {"t": 1020.9666666666667, "x": "役所は、明らかに戦前の品より\n質が落ちている、と言っている。"}, {"t": 1025.0333333333333, "x": "じゃあ原因は座布団で決まりでしょう？"}, {"t": 1027.15, "x": "そう簡単ではない。"}, {"t": 1028.3666666666666, "x": "ここで大事な事実がひとつある。"}, {"t": 1030.3833333333334, "x": "座布団のスイッチは切ってあった。"}, {"t": 1032.45, "x": "えっ？"}, {"t": 1033.0833333333333, "x": "スイッチを切ったことは確かだ、と国会で答えている。"}, {"t": 1036.45, "x": "切ってあるのに火が出るの？"}, {"t": 1038.1166666666666, "x": "役所の人も、非常に不思議だ、と言っている。"}, {"t": 1041.0833333333333, "x": "普通なら、線が熱くなっても綿に火はつかないそうだ。"}, {"t": 1044.45, "x": "火が出るとすれば、線が切れたところの火花だろう。"}, {"t": 1047.4666666666667, "x": "これが当時の専門家の見立てだった。"}, {"t": 1050.3833333333334, "x": "そこで出てきたのがひとつの推定だ。"}, {"t": 1052.6666666666667, "x": "スイッチを切る直前に、\n触れ合いの悪いところで火花が出た。"}, {"t": 1056.25, "x": "その火花が座布団の綿に移った。"}, {"t": 1058.5, "x": "綿は炎を上げずに、じわじわとくすぶり続けた。"}, {"t": 1061.5333333333333, "x": "そして10時間をこえて、朝に燃え上がった。"}, {"t": 1064.3, "x": "前の日の夕方から朝まで？"}, {"t": 1066.2333333333333, "x": "そういう筋書きだ。"}, {"t": 1067.4666666666667, "x": "ただこの推定には弱いところがある。"}, {"t": 1069.6, "x": "学問の上では、くすぶる時間が少し長すぎるそうだ。"}, {"t": 1073.1666666666667, "x": "じゃあちがうかもしれないってこと？"}, {"t": 1075.1, "x": "こじつければ説明はつく、という言い方もしている。"}, {"t": 1078.1, "x": "つまり当時も、はっきりとは言えなかった。"}, {"t": 1080.5833333333333, "x": "役所の人はこうまとめている。"}, {"t": 1082.45, "x": "学術的に、必ず電気座布団が\n原因だとはなかなか言えない。"}, {"t": 1086.4166666666667, "x": "ただほかに火が出ることが考えにくい。"}, {"t": 1088.6833333333334, "x": "だから座布団を前提に考えている。"}, {"t": 1091.0333333333333, "x": "消去法なのね。"}, {"t": 1092.3166666666666, "x": "そういうことだ。"}, {"t": 1093.3333333333333, "x": "しかも2月12日の時点で、検察は\nまだ原因を確定していなかった。"}, {"t": 1098.0, "x": "ほかの可能性は調べたの？"}, {"t": 1099.85, "x": "電気の配線も調べられている。"}, {"t": 1101.8166666666666, "x": "蛍光灯の配線は、漏電はまず起きない作りだった。"}, {"t": 1105.1166666666666, "x": "暮れに座布団のために引いた\n新しい配線は、質が落ちていた。"}, {"t": 1108.9, "x": "それでも漏電があったとは\n思えない、という見立てだった。"}, {"t": 1112.15, "x": "電気の使いすぎとかは？"}, {"t": 1113.8833333333334, "x": "それも聞かれている。"}, {"t": 1115.1166666666666, "x": "12月にくらべて、1月の電気の量は\nおよそ10倍に増えていた。"}, {"t": 1119.3, "x": "10倍も？"}, {"t": 1120.2, "x": "役所の答えはこうだ。"}, {"t": 1121.65, "x": "12月は模写を休んでいて、\n電気をほとんど使っていない。"}, {"t": 1125.15, "x": "1月は模写が始まり、\n五重塔の工事の機械も動き出した。"}, {"t": 1129.0666666666666, "x": "だから増えて当然だった。"}, {"t": 1130.8333333333333, "x": "増えたこと自体はおかしくないのね。"}, {"t": 1133.0333333333333, "x": "そうだ。こうして、疑いは座布団に集まっていった。"}, {"t": 1136.85, "x": "火事から2か月あまりたった、3月31日。"}, {"t": 1140.1333333333334, "x": "衆議院の本会議で緊急の質問が出た。"}, {"t": 1142.8333333333333, "x": "質問した議員はこう始めている。"}, {"t": 1144.9333333333334, "x": "朝5時から7時までのわずか2時間。"}, {"t": 1147.2166666666667, "x": "その間に内陣は焼けくずれてしまった。"}, {"t": 1149.7833333333333, "x": "議員もその2時間を言うのね。"}, {"t": 1151.6833333333334, "x": "答えたのは就いたばかりの文部大臣だ。"}, {"t": 1154.1166666666666, "x": "大臣は調査会の結論をこう伝えた。"}, {"t": 1156.6166666666666, "x": "はなはだ不完全な電気座布団から、原因が生じた。"}, {"t": 1160.1166666666666, "x": "調査会は座布団だって決めたのね。"}, {"t": 1162.4333333333334, "x": "そうだ。国の調査会はそう結論した。"}, {"t": 1165.0333333333333, "x": "そして処分も明らかにされた。"}, {"t": 1167.0, "x": "文部省の社会教育局長は、3か月の減給。"}, {"t": 1170.35, "x": "工事事務所の所長と技師の2人は、懲戒解職。"}, {"t": 1173.7, "x": "やめさせられたってこと？"}, {"t": 1175.3333333333333, "x": "そうだ。いちばん重い処分だ。"}, {"t": 1177.25, "x": "文部次官も辞表を出している。"}, {"t": 1179.1, "x": "大臣はこうも言った。"}, {"t": 1180.45, "x": "この責任は、事務の責任だけでは済まない。"}, {"t": 1183.3166666666666, "x": "道義でも政治でも、重い責任がある。"}, {"t": 1185.8833333333334, "x": "上のほうの人まで責任をとったのね。"}, {"t": 1188.35, "x": "もうひとつ大臣が挙げたことがある。"}, {"t": 1190.45, "x": "所長と技師はふだん東京にいた。"}, {"t": 1192.45, "x": "ときどき出張して、現場を見るやり方だった。"}, {"t": 1195.3833333333334, "x": "座布団を使っていいか、すぐ\n決められる人がそばにいなかった。"}, {"t": 1199.0666666666666, "x": "それも大きな原因だった、と大臣は言っている。"}, {"t": 1202.0166666666667, "x": "現場に決める人がいなかったのね。"}, {"t": 1204.2833333333333, "x": "だから、次の所長はいつも現地にいるようにする。"}, {"t": 1207.2, "x": "大臣はそう約束した。"}, {"t": 1209.5, "x": "ただ、国会の空気はそれで収まらなかった。"}, {"t": 1212.2833333333333, "x": "4月12日の衆議院の文部委員会で、ある議員が\nこう言っている。"}, {"t": 1216.2, "x": "これを、電気座布団の責任にしてはいけない。"}, {"t": 1219.0, "x": "現場で働く\n人たちの責任にして、終わらせてもいけない。"}, {"t": 1222.8333333333333, "x": "じゃあ誰の責任だって言うの？"}, {"t": 1224.7333333333333, "x": "修理の仕組みそのものだ。"}, {"t": 1226.3333333333333, "x": "当時の法隆寺の修理には、\nいくつもの組織が関わっていた。"}, {"t": 1230.05, "x": "持ち主の寺がある。お金を出す文部省がある。"}, {"t": 1232.9333333333334, "x": "文部省の中に保存事業部という別の組織がある。"}, {"t": 1236.0333333333333, "x": "学者が集まる協議会がある。"}, {"t": 1237.9166666666667, "x": "そして現場の工事事務所がある。"}, {"t": 1239.9833333333333, "x": "多すぎない？"}, {"t": 1240.9, "x": "別の議員も組織の表を見ながら言っている。"}, {"t": 1243.4666666666667, "x": "非常に複雑で、責任が\nどこにあるのかさっぱり分からない。"}, {"t": 1247.0833333333333, "x": "極端なことを言えば、電気座布団に\n責任があるとまで言われている。"}, {"t": 1251.15, "x": "座布団に責任って……。"}, {"t": 1252.75, "x": "笑い話のようだが本気の皮肉だ。"}, {"t": 1255.0166666666667, "x": "画家の日当が300円だったのも、この議員の指摘だ。"}, {"t": 1258.5166666666667, "x": "お金のかけ方がおかしい、と言いたかったんだ。"}, {"t": 1261.35, "x": "一人を責めても、同じことが起きるってことね。"}, {"t": 1264.3666666666666, "x": "そういう意見だ。"}, {"t": 1265.3833333333334, "x": "大臣も5月にはこう答えている。"}, {"t": 1267.45, "x": "電気座布団を使ったことは、ひとつの欠陥だった。"}, {"t": 1270.75, "x": "今後は厳しく取り締まる。"}, {"t": 1272.3833333333334, "x": "そして国会はここから動き出す。"}, {"t": 1274.5, "x": "誰かに責任を負わせるより、仕組みを作り直す方向だ。"}, {"t": 1278.6666666666667, "x": "一方で検察の調べも進んでいた。"}, {"t": 1281.0, "x": "奈良地方検察庁は、慎重に\n調べた結果を上に報告した。"}, {"t": 1284.9833333333333, "x": "そして、1949年7月9日。"}, {"t": 1288.2333333333333, "x": "最高検察庁が、4人を起訴すると決めた。"}, {"t": 1291.35, "x": "4人も？"}, {"t": 1292.1833333333334, "x": "工事に関わる立場の人が3人。"}, {"t": 1294.45, "x": "座布団をつくった会社の役員が1人だ。"}, {"t": 1297.0333333333333, "x": "罪の名前は業務上失火。"}, {"t": 1298.85, "x": "それに電気事業法の違反だ。"}, {"t": 1300.8333333333333, "x": "電気の法律にもふれたのね。"}, {"t": 1302.85, "x": "そういう疑いで起訴された。"}, {"t": 1304.5166666666667, "x": "ここではっきり言っておく。"}, {"t": 1305.9833333333333, "x": "この4人の名前は、この動画では出さない。"}, {"t": 1308.6666666666667, "x": "記録には残ってるのよね？"}, {"t": 1310.4666666666667, "x": "残っている。だが出さない。"}, {"t": 1312.1333333333334, "x": "このあとの判決を見れば、理由は分かると思う。"}, {"t": 1315.6333333333334, "x": "判決は、1951年5月10日に出た。"}, {"t": 1318.9333333333334, "x": "火事から、2年あまりあとだ。"}, {"t": 1320.8, "x": "場所は奈良地方裁判所。"}, {"t": 1322.4333333333334, "x": "工事事務所の元所長は無罪。"}, {"t": 1324.3666666666666, "x": "ほかの3人は罰金1,000円だった。"}, {"t": 1326.7, "x": "1,000円……。"}, {"t": 1327.4166666666667, "x": "ここでひとつ困ったことがある。"}, {"t": 1329.3, "x": "この罰金がどの罪に対するものなのか。"}, {"t": 1331.85, "x": "失火の罪なのか、電気の法律の違反なのか。"}, {"t": 1334.9, "x": "今回たどれた記録には、そこまで書かれていない。"}, {"t": 1338.0, "x": "じゃあ、火事の原因を裁判がどう見たのかも？"}, {"t": 1340.7333333333333, "x": "この記録だけでは分からない。"}, {"t": 1342.4333333333334, "x": "手がかりはもうひとつある。"}, {"t": 1343.95, "x": "22年後、1973年の国会だ。"}, {"t": 1347.2166666666667, "x": "家電から出る火事を話し合う場で、\n法務省の課長が答えている。"}, {"t": 1350.95, "x": "記憶でお答えして申し訳ない、と前置きしてからだ。"}, {"t": 1354.1666666666667, "x": "法隆寺の火事では、座布団のメーカーを\n業務上失火で起訴した。"}, {"t": 1357.9666666666667, "x": "ただ、出火の原因が電気座布団か\nどうか分からなかった。"}, {"t": 1361.5, "x": "私の記憶では結局無罪になったと思う。"}, {"t": 1364.35, "x": "原因かどうか分からなかった、って言ってるの？"}, {"t": 1367.0666666666666, "x": "法務省の担当者が、国会でそう答えている。"}, {"t": 1369.9833333333333, "x": "ただし本人が記憶だと断っている。"}, {"t": 1372.3333333333333, "x": "判決の文を、そのまま読み上げたわけではない。"}, {"t": 1375.2833333333333, "x": "記録どうしがぴったりは合わないのね。"}, {"t": 1377.4833333333333, "x": "合わない。だから、どちらか\n片方だけで決めつけない。"}, {"t": 1380.6833333333334, "x": "確かなのはここまでだ。"}, {"t": 1382.1833333333334, "x": "国の調査会は、座布団が原因だと結論した。"}, {"t": 1385.4, "x": "裁判では元所長が無罪になった。"}, {"t": 1387.65, "x": "法務省は、原因かどうか\n分からなかったと記憶していた。"}, {"t": 1391.6666666666667, "x": "では法隆寺自身はどう書いているか。"}, {"t": 1393.8, "x": "2023年と2024年に、寺が出した文章がある。"}, {"t": 1397.6666666666667, "x": "壁画を守る活動への支援を、広く呼びかける文章だ。"}, {"t": 1401.2166666666667, "x": "そこにはこうある。"}, {"t": 1402.2833333333333, "x": "金堂は、出火原因がわからない炎に包まれました。"}, {"t": 1405.85, "x": "75年たっても、わからないって書いてるのね。"}, {"t": 1408.9833333333333, "x": "そうだ。寺は原因を決めていない。"}, {"t": 1411.0833333333333, "x": "2012年にはひとつの論文も出ている。"}, {"t": 1413.7, "x": "大阪の会社の役員が、およそ4年かけて\n裁判の記録を読み直した。"}, {"t": 1418.0666666666666, "x": "その論文は法隆寺が出している季刊誌に載った。"}, {"t": 1421.1333333333334, "x": "何て書いてあったの？"}, {"t": 1422.5333333333333, "x": "電気の元のスイッチの切り忘れ。"}, {"t": 1424.6333333333334, "x": "それに小さなミスがいくつも重なった。"}, {"t": 1427.0166666666667, "x": "そういう主張だ。"}, {"t": 1428.2333333333333, "x": "じゃあそれが答え？"}, {"t": 1429.45, "x": "そうとは言えない。これは、ひとつの見方だ。"}, {"t": 1432.1, "x": "国も寺も、これを原因として認めたわけではない。"}, {"t": 1435.2166666666667, "x": "この動画で誰の名前も出さない理由は、ここにある。"}, {"t": 1438.2333333333333, "x": "原因がひとつに決まっていない\n以上、誰かを指さすことはできない。"}, {"t": 1442.2333333333333, "x": "記録はたくさんあるのにね。"}, {"t": 1444.0, "x": "たくさんある。どの記録も、\nちがう向きから光を当てている。"}, {"t": 1447.55, "x": "それでも真ん中の一点に光が届かない。"}, {"t": 1450.85, "x": "話を火事の次の日に戻す。"}, {"t": 1452.85, "x": "1月27日。アメリカのハーバード大学の、\nフォッグ美術館だ。"}, {"t": 1457.2333333333333, "x": "日本美術の研究者ウォーナーが、\n法隆寺の壁画の展覧会を開いた。"}, {"t": 1461.6666666666667, "x": "次の日にもう？"}, {"t": 1462.8166666666666, "x": "国会ではそう報告されている。"}, {"t": 1464.75, "x": "ウォーナーは解説で、金堂を\nシスティーナ礼拝堂にたとえたそうだ。"}, {"t": 1468.6, "x": "ミケランジェロの天井画がある、あの礼拝堂？"}, {"t": 1471.35, "x": "そうだ。それくらいの宝だと見られていた。"}, {"t": 1473.95, "x": "国会の視察に行った議員は、こう報告している。"}, {"t": 1476.9833333333333, "x": "私たちは、何とおわびを\n言えばいいのか、言葉に困る。"}, {"t": 1480.4833333333333, "x": "外国の人に顔向けできないって感じね。"}, {"t": 1483.2666666666667, "x": "衆議院の議長も動いている。"}, {"t": 1485.0333333333333, "x": "あの原寸大の写真の原板を、ずっと残してほしい。"}, {"t": 1488.3166666666666, "x": "そう文部委員長に頼んでいる。"}, {"t": 1490.2833333333333, "x": "1935年の写真が、ここで効いてくるのね。"}, {"t": 1493.8333333333333, "x": "そうだ。もとの色を知る手がかりは、\n写しにしか残っていない。"}, {"t": 1497.4833333333333, "x": "翌年度の予算には、12面の複製を\nつくるお金が入った。"}, {"t": 1501.4, "x": "449万2,000円だ。"}, {"t": 1503.45, "x": "色付きの写真を300組つくるお金も、240万円ついた。"}, {"t": 1507.75, "x": "写しを増やして残すのね。"}, {"t": 1509.5833333333333, "x": "本物を失った以上、残った写しを守るしかなかった。"}, {"t": 1513.1166666666666, "x": "それだけ、多くの人が胸を痛めた火事だった。"}, {"t": 1516.7166666666667, "x": "国会の動きでいちばん大きかったのは法律だ。"}, {"t": 1519.55, "x": "火事の17日後、2月12日。"}, {"t": 1522.0166666666667, "x": "参議院の文部委員会で、\nこの火事が初めて取り上げられた。"}, {"t": 1525.5833333333333, "x": "その委員会が、文化財を守る\n新しい法律を書き始めた。"}, {"t": 1529.4833333333333, "x": "国会議員が自分で法律を書いたの？"}, {"t": 1531.9166666666667, "x": "そうだ。議員が出す法律だ。"}, {"t": 1533.85, "x": "それまでの国宝の法律は、20年前の古いものだった。"}, {"t": 1537.5, "x": "役所も分かれていて、責任の場所があいまいだった。"}, {"t": 1540.6166666666666, "x": "国宝の数そのものにも問題があった。"}, {"t": 1543.05, "x": "1948年の5月に7,388点あった国宝が、\n1年足らずで7,597点に増えていた。"}, {"t": 1551.05, "x": "増えるのは良いことじゃないの？"}, {"t": 1552.7666666666667, "x": "参議院の予算委員会ではこう言われている。"}, {"t": 1555.1833333333334, "x": "指定するだけでしっぱなしで、\n守る手だてが追いついていない。"}, {"t": 1558.6, "x": "数を増やすより、大事なものに\n力を集めるべきではないか。"}, {"t": 1562.3166666666666, "x": "守れないなら、指定しても意味がないってことね。"}, {"t": 1565.3333333333333, "x": "法隆寺の火事は、その弱いところを\n一度に見せてしまった。"}, {"t": 1568.8166666666666, "x": "法案の説明ではこう言われている。"}, {"t": 1570.8333333333333, "x": "1月26日の法隆寺金堂の火災は、\nこれまでの欠陥をさらけ出した。"}, {"t": 1575.7166666666667, "x": "火事が法律の理由になったのね。"}, {"t": 1577.9, "x": "その年はほかにも火事が続いた。"}, {"t": 1580.0166666666667, "x": "愛媛県の松山城。北海道の松前城。"}, {"t": 1582.95, "x": "国会の決議にもこの3つの名前がならんでいる。"}, {"t": 1585.9, "x": "法案は一度は時間切れで通らなかった。"}, {"t": 1588.3333333333333, "x": "それでも作り直して、1950年の国会で成立した。"}, {"t": 1592.3333333333333, "x": "文化財保護法だ。"}, {"t": 1593.6666666666667, "x": "1950年5月30日に公布され、\n8月29日から実施された。"}, {"t": 1598.8833333333334, "x": "火事から、1年4か月ね。"}, {"t": 1601.05, "x": "その年の7月には京都の金閣も焼けている。"}, {"t": 1604.0333333333333, "x": "国会では、法隆寺の壁画も焼いた、\n金閣寺も焼いた、という声が上がった。"}, {"t": 1608.9, "x": "法律ができても、火事は止まらなかったのね。"}, {"t": 1611.7833333333333, "x": "法律だけでは止まらなかった。"}, {"t": 1613.6333333333334, "x": "だから次に決まったのが日付だ。"}, {"t": 1616.3833333333334, "x": "1955年。"}, {"t": 1617.8333333333333, "x": "国家消防本部と文化財保護委員会が、連名で決めた。"}, {"t": 1621.4666666666667, "x": "1月26日を文化財防火デーとする。"}, {"t": 1624.3166666666666, "x": "法隆寺が焼けた日ね。"}, {"t": 1625.9, "x": "そうだ。"}, {"t": 1626.5333333333333, "x": "今は文化庁と消防庁が一緒に続けている。"}, {"t": 1629.3166666666666, "x": "この日を中心に、全国の寺や\n神社で防火の訓練が行われる。"}, {"t": 1633.4, "x": "2024年が、70回目だった。"}, {"t": 1635.9833333333333, "x": "だから2026年の1月で、72回目になった。"}, {"t": 1639.8666666666666, "x": "ニュースで、お寺に水をかけてる\n映像を見たことあるわ。"}, {"t": 1643.0666666666666, "x": "あれがこの日の訓練だ。"}, {"t": 1644.5833333333333, "x": "消火栓や放水の用意を、点検し直す日でもある。"}, {"t": 1647.9, "x": "法隆寺も訓練するの？"}, {"t": 1649.5833333333333, "x": "法隆寺ではその後の守りが大きく変わった。"}, {"t": 1652.1666666666667, "x": "1962年の国会では、こう報告されている。"}, {"t": 1655.7, "x": "金堂の火事のあと、防火も\n雷よけも大いに整えられた。"}, {"t": 1659.4, "x": "ほかの寺とくらべて、ずっと備えがよくなっている。"}, {"t": 1662.5666666666666, "x": "焼けてから備えたのね。"}, {"t": 1664.2333333333333, "x": "その報告はこう続く。"}, {"t": 1665.7833333333333, "x": "焼けてからの防災より、焼ける前の防災が大切だ。"}, {"t": 1669.25, "x": "……耳が痛い言葉ね。"}, {"t": 1670.7, "x": "始まりは、閉め切った金堂の、蒸し焼きの朝だった。"}, {"t": 1674.7, "x": "では焼けた壁画はどうなったのか。"}, {"t": 1676.7, "x": "火事のすぐあとから画家たちは動いている。"}, {"t": 1679.05, "x": "2月18日、記憶が薄れないうちにと模写をまた始めた。"}, {"t": 1682.8666666666666, "x": "最初に取りかかったのは入江の班だった。"}, {"t": 1685.3166666666666, "x": "入江波光本人は、火事の前の年に亡くなっている。"}, {"t": 1688.5166666666667, "x": "残った班の画家たちが、その仕事を引き継いでいた。"}, {"t": 1691.75, "x": "ほかの班もすぐあとに続いて、5月の完成を目指した。"}, {"t": 1695.3666666666666, "x": "見た色を覚えているうちに描くのね。"}, {"t": 1697.55, "x": "写真を刷った線を土台にして、\n色を思い出しながら塗っていった。"}, {"t": 1701.3333333333333, "x": "焼けた壁は、これ以上崩れないように手当てをした。"}, {"t": 1704.3166666666666, "x": "樹脂を使って、はがれかけた\n絵の具を壁に留めたんだ。"}, {"t": 1707.5333333333333, "x": "そして壁ごと抜き取ることになった。"}, {"t": 1709.8666666666666, "x": "壁を抜くの？"}, {"t": 1710.9166666666667, "x": "そうだ。寺も動かすことを受け入れた。"}, {"t": 1713.2333333333333, "x": "建物を土台から組み直すには、そうするしかない。"}, {"t": 1716.3, "x": "1950年5月12日、作業が始まった。"}, {"t": 1719.7333333333333, "x": "東京大学の博士2人が立ち会って、\n小さな4号壁から手をつけた。"}, {"t": 1724.2, "x": "壁を木の枠で固めて、つり下げて運び出す。"}, {"t": 1727.1333333333334, "x": "1951年2月6日には、法要をして\n運び出しが始まっている。"}, {"t": 1731.75, "x": "工事に関わる100人ほどが\n集まって、無事を祈る法要をした。"}, {"t": 1735.5333333333333, "x": "朝の9時15分、寺の管長が鎖を引いた。"}, {"t": 1738.4833333333333, "x": "木の枠で固めた壁が、つり下げられて動き出した。"}, {"t": 1741.8, "x": "管長さんが自分で動かしたのね。"}, {"t": 1744.0833333333333, "x": "動かせなかった壁を、寺の手で動かした瞬間だ。"}, {"t": 1747.2833333333333, "x": "焼けた柱や梁も捨てなかった。"}, {"t": 1749.3666666666666, "x": "境内に建てた収蔵庫に壁画と一緒に収めた。"}, {"t": 1752.5, "x": "焦げた柱まで？"}, {"t": 1753.8, "x": "そうだ。今も、金堂の中と\n同じ並びで組み直されている。"}, {"t": 1757.5166666666667, "x": "壁画は焼けた柱に囲まれて、立っているんだ。"}, {"t": 1760.6, "x": "金堂の1階が、そのまま別の建物の中にあるのね。"}, {"t": 1764.2833333333333, "x": "そういうことだ。"}, {"t": 1765.2666666666667, "x": "金堂そのものは、1952年の12月に\n柱を立てる式をした。"}, {"t": 176 5.8, "x": "ただその後もふだんは閉ざされてきた。"}, {"t": 1888.0666666666666, "x": "どうして？"}, {"t": 1888.9166666666667, "x": "壁画は温度や湿り気の変化に弱い。"}, {"t": 1891.2666666666667, "x": "法隆寺は、見学で人が\n入ったときの変化まで測っている。"}, {"t": 1895.05, "x": "2015年の12月、寺は専門家の委員会を立ち上げた。"}, {"t": 1898.9166666666667, "x": "壁画を初めて、科学の目で総合的に調べるためだ。"}, {"t": 1902.4333333333334, "x": "同じ2015年には、あの1935年のガラス原板も\n重要文化財になった。"}, {"t": 1908.0166666666667, "x": "本物と写真が同じ年に動いたのね。"}, {"t": 1910.65, "x": "2020年には、東京国立博物館で\n大きな展覧会が予定された。"}, {"t": 1915.3333333333333, "x": "ところが、感染症が広がって中止になった。"}, {"t": 1918.3833333333334, "x": "見られなかったのね。"}, {"t": 1919.7666666666667, "x": "2021年からは、支援した人に\n限って収蔵庫を公開している。"}, {"t": 1924.1666666666667, "x": "そのたびに、温度や湿り気が\nどう変わるかを記録している。"}, {"t": 1927.5166666666667, "x": "2022年には、集まったお金で\n収蔵庫に除湿の機械を入れた。"}, {"t": 1931.7666666666667, "x": "見学では僧侶が中で説明をしている。"}, {"t": 1934.2666666666667, "x": "焼ける前の姿と見比べられる冊子も配っているそうだ。"}, {"t": 1937.75, "x": "焼ける前の写真と並べて見るのね。"}, {"t": 1940.0833333333333, "x": "1935年の写真が、ここでも役に立っている。"}, {"t": 1943.6666666666667, "x": "2023年5月には、委員会が提言を出した。"}, {"t": 1947.0166666666667, "x": "収蔵庫を改修して、いずれ一般に公開する方針だ。"}, {"t": 1950.6333333333334, "x": "いつか、だれでも見られるようになるのね。"}, {"t": 1953.0833333333333, "x": "寺はそれを目指していると書いている。"}, {"t": 1955.1666666666667, "x": "前の管長が願っていたことでもある、とも書いている。"}, {"t": 1958.9666666666667, "x": "最後にあの朝のあとに残ったものを数えておく。"}, {"t": 1961.75, "x": "1935年に写した、363枚のガラス原板。"}, {"t": 1966.0833333333333, "x": "12年かけた模写。"}, {"t": 1967.5166666666667, "x": "1968年の再現壁画。"}, {"t": 1970.15, "x": "そして色を失った12面の本物。"}, {"t": 1972.6666666666667, "x": "残ったもの、けっこう多いのね。"}, {"t": 1974.75, "x": "多い。色は消えたが線は残った。"}, {"t": 1976.8666666666666, "x": "線が残ったから、写真や模写と重ねて色をたどれる。"}, {"t": 1980.2166666666667, "x": "法隆寺の文章には見学した人の声ものっている。"}, {"t": 1983.4, "x": "壁画は完全に焼失したと思っていた。"}, {"t": 1986.1166666666666, "x": "私もそう思ってたかも。"}, {"t": 1987.9166666666667, "x": "焼けてなくなったのではない。"}, {"t": 1989.4, "x": "焼けて、残っている。"}, {"t": 1990.95, "x": "それともうひとつ残ったものがある。"}, {"t": 1993.0333333333333, "x": "なぜ火が出たのかという問いだ。"}, {"t": 1994.7833333333333, "x": "調査会は座布団と言い、裁判は元所長を無罪とした。"}, {"t": 1998.2333333333333, "x": "そして寺はわからないと書く。"}, {"t": 2000.1333333333334, "x": "答えは、ひとつにまとまらないままなのね。"}, {"t": 2002.85, "x": "まとまらない。だから、誰かの名前で終わらせない。"}, {"t": 2005.8333333333333, "x": "注意は、1年3か月前に届いていた。"}, {"t": 2008.5833333333333, "x": "ヒューズは、その朝に付けられる予定だった。"}, {"t": 2011.15, "x": "壁を外へ出す話は、最後まで進まなかった。"}, {"t": 2014.2833333333333, "x": "ひとつひとつは小さな遅れだ。"}, {"t": 2016.2166666666667, "x": "それが、1月26日の朝に重なった。"}, {"t": 2019.3333333333333, "x": "次の1月26日、ニュースを見たら思い出しそう。"}, {"t": 2022.8, "x": "それでいい。放水の映像の向こうに、\nあの金堂がある。"}, {"t": 2025.9666666666667, "x": "出どころを言っておく。"}, {"t": 2027.1833333333334, "x": "火事の様子と座布団の調べは、\n1949年2月12日の参議院文部委員会の記録。"}, {"t": 2033.3, "x": "処分と調査会の結論は、\n同じ年の衆議院の本会議と文部委員会の記録。"}, {"t": 2038.3, "x": "起訴と判決は、東京文化財研究所が\n当時の報道をまとめた年表。"}, {"t": 2042.8, "x": "1973年の答弁は、衆議院予算委員会の分科会の記録。"}, {"t": 2047.5, "x": "壁画の大きさと今の扱いは、法隆寺自身の文章。"}, {"t": 2050.9666666666667, "x": "写真の撮影は文化庁の資料による。"}, {"t": 2053.3166666666666, "x": "どれも今インターネットで読める。"}, {"t": 2055.133333333333, "x": "今回の話はここまでだ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
