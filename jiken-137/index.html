<script>
const D={"name": "137", "file": "137_編集用", "dur": 2082.11665625, "segs": [], "subs": [{"t": 0.0, "x": "1980年9月10日。埼玉県所沢市。"}, {"t": 3.683333333333333, "x": "ある産婦人科病院の理事長が逮捕された。"}, {"t": 6.35, "x": "疑いは医師法違反。医師の資格が無かった。"}, {"t": 9.266666666666667, "x": "資格が無いのに診察していたの？"}, {"t": 11.5, "x": "超音波の機械を自分で動かし、病名を告げていた。"}, {"t": 14.716666666666667, "x": "逮捕の疑いになった患者は12人だ。"}, {"t": 17.333333333333332, "x": "12人。それなら小さな事件に聞こえるけど。"}, {"t": 20.316666666666666, "x": "ところが13日後、数字が変わる。"}, {"t": 22.666666666666668, "x": "警察に284人。保健所などに990人。"}, {"t": 26.416666666666668, "x": "合わせて1,274人が、病院のことを届け出ていた。"}, {"t": 30.283333333333335, "x": "2週間で1,000人以上？"}, {"t": 31.916666666666668, "x": "2回以上届けた人も含む数だ。それでも、桁が違った。"}, {"t": 35.88333333333333, "x": "多かった訴えはこうだ。"}, {"t": 37.36666666666667, "x": "悪くない子宮や卵巣を、手術で\n取られたのではないか。"}, {"t": 40.833333333333336, "x": "それは傷害事件でしょ。誰が裁かれたの？"}, {"t": 43.65, "x": "今回はその答えを最後まで追う。"}, {"t": 45.666666666666664, "x": "先に言うと傷害罪で起訴された人は0人だ。"}, {"t": 48.766666666666666, "x": "0人？ 1,000件以上の訴えがあったのに？"}, {"t": 51.43333333333333, "x": "そして民事の判決が確定するまで24年かかった。"}, {"t": 54.916666666666664, "x": "これは埼玉県の富士見産婦人科病院の事件だ。"}, {"t": 58.06666666666667, "x": "訴えの数が節目ごとに減っていく。"}, {"t": 60.35, "x": "なぜ減ったのか。数の順に見ていこう。"}, {"t": 62.733333333333334, "x": "名前は誰も出さない。"}, {"t": 63.95, "x": "手術の様子も話さない。"}, {"t": 66.35, "x": "まず病院の大きさから押さえる。"}, {"t": 68.21666666666667, "x": "正式には医療法人芙蓉会の富士見産婦人科病院。"}, {"t": 71.51666666666667, "x": "場所は埼玉県の所沢市だ。"}, {"t": 73.63333333333334, "x": "ベッドは56床。産婦人科だけの病院だった。"}, {"t": 76.86666666666666, "x": "医師は院長を含めて5人。"}, {"t": 78.63333333333334, "x": "大病院じゃないのね。"}, {"t": 80.13333333333334, "x": "むしろ町の病院の大きさだ。"}, {"t": 81.98333333333333, "x": "ただ評判は良かった。"}, {"t": 83.51666666666667, "x": "評判が？"}, {"t": 84.65, "x": "のちに被害者同盟の代表が、国会でこう説明している。"}, {"t": 88.31666666666666, "x": "新聞にチラシが入っていた。"}, {"t": 90.15, "x": "医学雑誌のように見える冊子も配っていた。"}, {"t": 92.71666666666667, "x": "中身はこの病院の特集だった。"}, {"t": 94.98333333333333, "x": "自分で作った雑誌なの？"}, {"t": 96.75, "x": "代表は「自費出版」と述べた。"}, {"t": 99.05, "x": "そして来る患者ごとに超音波の機械を宣伝した。"}, {"t": 102.13333333333334, "x": "「設備のいい病院」という話が、口伝えで広がる。"}, {"t": 105.45, "x": "入院案内には、こんな文句があったと\n議員が読み上げた。"}, {"t": 108.76666666666667, "x": "「最も安心できます」。"}, {"t": 110.43333333333334, "x": "産婦人科で最新の機械なら、安心すると思うわ。"}, {"t": 113.85, "x": "そこだ。患者は疑って行ったのではない。"}, {"t": 116.33333333333333, "x": "代表は「本当に心の底から\n信頼していた」と述べている。"}, {"t": 120.3, "x": "その信頼を支えていたのが1台の機械だった。"}, {"t": 123.86666666666666, "x": "評判がいいなら、患者も多かったのよね。"}, {"t": 126.5, "x": "多かった。問題は手術の数だ。"}, {"t": 128.78333333333333, "x": "埼玉県の調べで1979年度の手術は602件。"}, {"t": 133.01666666666668, "x": "前の年は550例だったと別の議員が述べた。"}, {"t": 136.21666666666667, "x": "56床で602件って、多いの？"}, {"t": 138.88333333333333, "x": "議員がほかの病院と並べて見せた。"}, {"t": 141.11666666666667, "x": "国立病院医療センターはベッドが620床。"}, {"t": 144.18333333333334, "x": "子宮の摘出は同じ年度に153件だ。"}, {"t": 147.25, "x": "日本大学の駿河台病院は403床で84件。"}, {"t": 150.93333333333334, "x": "日赤医療センターは25件。"}, {"t": 152.96666666666667, "x": "ベッドは10分の1なのに、手術は何倍もあるじゃない。"}, {"t": 156.36666666666667, "x": "比べる物が違うから、そのまま割ってはいけない。"}, {"t": 159.33333333333334, "x": "602件は手術全体の数だ。"}, {"t": 161.66666666666666, "x": "ただ議員は、その8割近くが\n子宮と卵巣の摘出だと述べた。"}, {"t": 165.85, "x": "602件を365日で割ると毎日1.6件だ。"}, {"t": 169.73333333333332, "x": "手術をする医師は5人だ。"}, {"t": 171.51666666666668, "x": "誰かおかしいって思わなかったの？"}, {"t": 173.66666666666666, "x": "のちに厚生大臣も、同じことを言っている。"}, {"t": 176.36666666666667, "x": "「これくらい子宮、卵巣の摘出があるものか\nどうかという疑問がすぐ出てくるはず」。"}, {"t": 181.03333333333333, "x": "「何とかして事前にわからなかったものか」。"}, {"t": 183.5, "x": "事件のあとの、国会での答弁だ。"}, {"t": 185.91666666666666, "x": "大臣があとから言っても、ねえ。"}, {"t": 187.98333333333332, "x": "ではなぜ数が増えたのか。"}, {"t": 189.58333333333334, "x": "手術の入り口になっていたのが超音波の部屋だ。"}, {"t": 193.11666666666667, "x": "患者が来ると超音波の検査に回される。"}, {"t": 195.6, "x": "機械を動かすのは理事長だった。"}, {"t": 197.75, "x": "理事長って、経営の人よね。"}, {"t": 199.88333333333333, "x": "そうだ。医師でも看護士でもない。"}, {"t": 201.88333333333333, "x": "警察庁の説明では資格は何も無かった。"}, {"t": 204.71666666666667, "x": "当時の法律に、医師でない人を\n理事長にしてはいけない決まりは無い。"}, {"t": 208.78333333333333, "x": "えっ、無かったの？"}, {"t": 210.15, "x": "これは後の話につながるから覚えておいてくれ。"}, {"t": 212.93333333333334, "x": "逮捕の疑いはこう説明された。"}, {"t": 215.01666666666668, "x": "1978年9月ごろから、1980年5月ごろまで。"}, {"t": 219.75, "x": "主婦など12人に超音波診断装置を操作した。"}, {"t": 222.88333333333333, "x": "そして子宮筋腫や卵巣嚢腫といった病名を告げた。"}, {"t": 226.15, "x": "妊娠や検診で来た人まで\n病名をつけられたと、代表はのちに述べた。"}, {"t": 230.66666666666666, "x": "機械の使い方は誰に習ったの？"}, {"t": 232.96666666666667, "x": "議員は「メーカーの講習を受けてきた」と述べた。"}, {"t": 235.95, "x": "当時この機械はまだ珍しかった。"}, {"t": 238.16666666666666, "x": "1台5千万円ほどと別の議員が述べている。"}, {"t": 240.95, "x": "画面を読むには専門の勉強が要る。"}, {"t": 243.16666666666666, "x": "ところが常勤の医師5人は、\n誰も判定できなかったという。"}, {"t": 246.71666666666667, "x": "これは医師でもある議員が、\n現地で聞いた話として述べた。"}, {"t": 250.3, "x": "じゃあ、理事長の言うことを\n誰も確かめられないじゃない。"}, {"t": 253.45, "x": "確かめる人がいない診断が手術の入り口にあった。"}, {"t": 256.6666666666667, "x": "では理事長は画面に何を見ていたのか。"}, {"t": 258.98333333333335, "x": "防衛医大の教授の説明が記録に残っている。"}, {"t": 262.5, "x": "議員が防衛医大の教授に聞いた話を国会で述べた。"}, {"t": 265.75, "x": "教授は超音波の専門家だ。"}, {"t": 267.6333333333333, "x": "本来の撮り方には一つ手順があるという。"}, {"t": 270.31666666666666, "x": "手順？"}, {"t": 271.45, "x": "下腹の前には腸がある。"}, {"t": 273.1333333333333, "x": "そのままでは子宮や卵巣が写らない。"}, {"t": 275.4166666666667, "x": "そこでまず膀胱に尿をためてもらう。"}, {"t": 277.55, "x": "水分は超音波をよく通すし、腸も横へよけられる。"}, {"t": 280.8666666666667, "x": "へえ、ためてから撮るのね。"}, {"t": 282.65, "x": "ところが理事長は逆にしていたと議員は述べた。"}, {"t": 285.3666666666667, "x": "患者に尿を出させてから、撮っていた。"}, {"t": 287.85, "x": "それだと腸がじゃまになるんじゃないの？"}, {"t": 290.03333333333336, "x": "そうなる。写るのは動いている腸だ。"}, {"t": 292.23333333333335, "x": "教授はその写真を何枚も見たという。"}, {"t": 294.48333333333335, "x": "議員が伝えた言葉はこうだ。"}, {"t": 296.3, "x": "「読めと言われても読めないしろものだ」。"}, {"t": 298.5, "x": "読めない写真に病名を書いていたの？"}, {"t": 300.78333333333336, "x": "議員は「むちゃくちゃな作文」と表現した。"}, {"t": 303.56666666666666, "x": "所見を書き込み、絵を描いて、\nここに腫瘍があると示す。"}, {"t": 307.0, "x": "のちの民事の判決も、\n「でたらめなＭＥ検査所見」と書いた。"}, {"t": 310.9166666666667, "x": "ＭＥはこの超音波検査のことだ。"}, {"t": 313.18333333333334, "x": "医師は気づかなかったの？"}, {"t": 314.76666666666665, "x": "別の議員の問いはまさにそこだった。"}, {"t": 316.98333333333335, "x": "開いてみて何もなければ、機械を疑うのが普通だと。"}, {"t": 320.3666666666667, "x": "それが2度3度続けば、やり方を見直すはずだと。"}, {"t": 323.5833333333333, "x": "なぜ止まらなかったのか。これが後々の争点になる。"}, {"t": 327.48333333333335, "x": "次はお金の話だ。"}, {"t": 328.98333333333335, "x": "ある議員が所沢へ行って被害者の話を聞いた。"}, {"t": 331.95, "x": "多かったのは、子宮と卵巣を\n一度に取られた例だという。"}, {"t": 335.3, "x": "請求は100万円。"}, {"t": 336.7, "x": "高いの？ 手術なら、それくらいかかりそうだけど。"}, {"t": 339.9166666666667, "x": "議員は厚生省に保険の点数を確かめた。"}, {"t": 342.7, "x": "子宮の全摘が5,100点。"}, {"t": 344.48333333333335, "x": "卵巣が2,350点。"}, {"t": 346.51666666666665, "x": "合わせて7,450点。1点は10円だ。"}, {"t": 349.73333333333335, "x": "7万4,500円？"}, {"t": 351.3833333333333, "x": "手術そのものの費用としてはそうなる。"}, {"t": 353.75, "x": "もちろん、麻酔も入院も別にかかる。"}, {"t": 356.1166666666667, "x": "議員もそこは断っている。"}, {"t": 357.76666666666665, "x": "ただ入院の個室は1日3万円だったという。"}, {"t": 360.7, "x": "全部足しても40万円くらいだ、と議員は計算した。"}, {"t": 364.25, "x": "残りの60万円は？"}, {"t": 365.9, "x": "そこを議員は厚生省に問いただした。"}, {"t": 368.1333333333333, "x": "患者の話では金額は入院の前に知らされない。"}, {"t": 371.18333333333334, "x": "退院のときに請求書が来る。"}, {"t": 373.18333333333334, "x": "断れないじゃない。もう手術は終わってるのに。"}, {"t": 376.0, "x": "のちに代表は、手術後の1週間は\n個室に強制だったと述べた。"}, {"t": 380.1166666666667, "x": "別の議員はもっと踏み込んだ。"}, {"t": 381.95, "x": "若い人の卵巣を取れば、ホルモンが足りなくなる。"}, {"t": 384.98333333333335, "x": "すると注射に通うことになる。その注射でまた払う。"}, {"t": 388.3, "x": "議員はこれを「マッチポンプ」と呼んだ。"}, {"t": 390.65, "x": "ここまでは国会での発言で判決の言葉ではない。"}, {"t": 393.8, "x": "ただ数字のほうは記録に残る。"}, {"t": 395.75, "x": "全摘を受けた人の平均は35歳だと、\n被害者同盟はつかんでいた。"}, {"t": 400.3333333333333, "x": "ほかの病院より、10歳若いという。"}, {"t": 403.25, "x": "ねえ、これだけ長く続いて、誰も気づかなかったの？"}, {"t": 406.6166666666667, "x": "気づいた人はいた。かなり早くからな。"}, {"t": 409.05, "x": "厚労省はのちに、1974年から\n80年の医療行為と整理している。"}, {"t": 413.98333333333335, "x": "議員の調べでは、\n1974年3月の入院が最も早い訴えだ。"}, {"t": 418.95, "x": "逮捕の6年も前じゃない。"}, {"t": 420.71666666666664, "x": "別の議員はもっと前からだと言った。"}, {"t": 422.93333333333334, "x": "地元の産婦人科医は\n「あそこはおかしい」と話していたという。"}, {"t": 426.68333333333334, "x": "はっきりした記録が残るのは1978年だ。"}, {"t": 430.1666666666667, "x": "1978年9月から79年1月にかけて。"}, {"t": 434.18333333333334, "x": "患者5人が所沢の保健所に訴えた。"}, {"t": 436.8333333333333, "x": "内容は二つあった。"}, {"t": 438.21666666666664, "x": "一つはよその病院と診断が食い違うこと。"}, {"t": 440.96666666666664, "x": "防衛医大では何ともないと言われた人がいた。"}, {"t": 443.65, "x": "もう一つはうわさだ。"}, {"t": 445.0, "x": "資格のない理事長が超音波を動かしているらしい。"}, {"t": 447.98333333333335, "x": "それって、もう答えじゃないの。"}, {"t": 449.95, "x": "局長も、うわさとして聞いたと認めている。"}, {"t": 452.6666666666667, "x": "保健所は動いた。理事長ら責任者を\n呼んで問いただした。"}, {"t": 456.15, "x": "防衛医大の専門家の意見も聞いた。"}, {"t": 458.55, "x": "それで？"}, {"t": 459.6666666666667, "x": "局長の答弁はこうだ。"}, {"t": 461.25, "x": "「残念ながら事件のさらに突っ込んだところまで\n把握するということができなかった」。"}, {"t": 465.95, "x": "呼んで、聞いて、終わり？"}, {"t": 467.6333333333333, "x": "議員も同じことを問うた。"}, {"t": 469.18333333333334, "x": "この時点で表に出ていれば、\n多くの人が助かったはずだと。"}, {"t": 472.9166666666667, "x": "では呼んだあとに残された手は何だったのか。"}, {"t": 476.1, "x": "病院には医療監視という検査がある。"}, {"t": 478.3333333333333, "x": "保健所の職員が、年に1回、中に入る。"}, {"t": 481.3666666666667, "x": "富士見病院にも入っていた。"}, {"t": 483.15, "x": "1979年2月と1980年2月の2回だ。"}, {"t": 487.5833333333333, "x": "訴えのあとに2回も？"}, {"t": 488.9, "x": "なら見つかるでしょ。"}, {"t": 490.3, "x": "何を指摘したか、局長の答弁を見てくれ。"}, {"t": 493.18333333333334, "x": "1979年は看護婦と助産婦が足りないこと。"}, {"t": 496.71666666666664, "x": "1980年は職員の健康診断をしていないこと。"}, {"t": 500.53333333333336, "x": "それだけ？"}, {"t": 501.6666666666667, "x": "逮捕のあとの大臣も、こう嘆いている。"}, {"t": 504.1, "x": "「掃除のブラシがなかったのを備えたとか」。"}, {"t": 506.5, "x": "「定員不足が二名埋められたとか」。"}, {"t": 508.6, "x": "「そういう程度でやっている」。"}, {"t": 510.1666666666667, "x": "ブラシ……。"}, {"t": 511.3, "x": "これは怠けたというより、作りの問題だ。"}, {"t": 513.9166666666666, "x": "医療監視が見るのは建物と人数と書類。"}, {"t": 516.5666666666667, "x": "診療の中身には入れない決まりになっていた。"}, {"t": 519.2666666666667, "x": "超音波の部屋も見ていない。"}, {"t": 520.9166666666666, "x": "臨床検査技師がいると報告を受けていたからだ。"}, {"t": 523.9333333333333, "x": "なんで中身を見ないの？"}, {"t": 525.45, "x": "局長の説明がこの事件の芯に近い。"}, {"t": 528.05, "x": "資格を持った医師が良心的に診療する。"}, {"t": 530.65, "x": "それが法律の考え方だという。"}, {"t": 532.75, "x": "医師がこんなことをすると\n前提に、制度は作られていない。"}, {"t": 536.0833333333334, "x": "だから刑法などで立ち向かうほかないと局長は答えた。"}, {"t": 539.5166666666667, "x": "つまり、警察に任せるしかないってこと？"}, {"t": 542.2666666666667, "x": "その言葉をよく覚えておいてくれ。"}, {"t": 544.2166666666667, "x": "広告の件でも、同じことが起きた。"}, {"t": 546.65, "x": "1979年12月、テレビの広告で保健所長が注意した。"}, {"t": 551.2333333333333, "x": "病院は意見書で責任はテレビ局にあると返した。"}, {"t": 554.3666666666667, "x": "翌年5月の地元紙の広告では、\n始末書を取って終わった。"}, {"t": 558.8333333333334, "x": "手術の数がおかしいなら、\nお金を払う側は気づかないの？"}, {"t": 562.4833333333333, "x": "いい質問だ。保険の請求は毎月の明細書で届く。"}, {"t": 566.0166666666667, "x": "これをレセプトという。"}, {"t": 567.2666666666667, "x": "ある議員がこの仕組みの弱さを説明している。"}, {"t": 569.9333333333333, "x": "レセプトを書くのは医師だ。"}, {"t": 571.4833333333333, "x": "それを審査するのも医師だ。"}, {"t": 573.2666666666667, "x": "同じ仲間が見るってこと？"}, {"t": 575.0666666666667, "x": "作るときから、かばい合いを\n心配する声はあったという。"}, {"t": 578.25, "x": "それでも医師の良識を信じて、\nこの形になったと議員は述べた。"}, {"t": 582.1833333333333, "x": "審査は1か月単位で書類だけを見る。"}, {"t": 584.5333333333333, "x": "別の議員は、この形では傾向を\nつかむのも難しいと述べた。"}, {"t": 588.4166666666666, "x": "一枚の明細に書いてあるのは病名と手術だ。"}, {"t": 591.2833333333333, "x": "病名が合っていれば、書類の上では整って見える。"}, {"t": 594.4333333333333, "x": "病名そのものが間違っていたら、分からないのね。"}, {"t": 597.5833333333334, "x": "のちに被害者同盟の代表がその点を突いている。"}, {"t": 600.5333333333333, "x": "診断が正しいか、処置が本当に必要か。"}, {"t": 603.4833333333333, "x": "「医療内容のチェックは全くなされておりません」。"}, {"t": 606.1666666666666, "x": "「その盲点をついたのがこの事件だった」。"}, {"t": 608.6666666666666, "x": "監査も、審査も、中身は見ていなかったのね。"}, {"t": 611.8166666666667, "x": "もう一人、中を見ていた人がいる。患者本人だ。"}, {"t": 615.0666666666667, "x": "明細書を求めた患者も、たくさんいたという。"}, {"t": 617.8333333333334, "x": "出てきたのは、室料や\n処置料といった大まかな項目だけ。"}, {"t": 621.45, "x": "もっと詳しい物をと頼んでも、\n窓口で断られたと代表は述べた。"}, {"t": 626.2666666666667, "x": "じゃあ警察はどうしていたの？"}, {"t": 628.0666666666667, "x": "埼玉県警は、1978年の暮れに話を聞きつけた。"}, {"t": 632.4333333333333, "x": "所沢警察署と県警の保安課が、内偵を始めている。"}, {"t": 636.1833333333333, "x": "逮捕までほぼ2年だ。"}, {"t": 637.7666666666667, "x": "長くない？ その間も手術は続いていたのよね。"}, {"t": 640.9, "x": "議員も同じ点を突いた。"}, {"t": 642.4666666666667, "x": "もっと早ければ、こんなに被害者を出さずに済んだと。"}, {"t": 645.6166666666667, "x": "警察庁の答えは、理由を四つ挙げている。"}, {"t": 648.3666666666667, "x": "一つ目。病院の中の、いわば密室の出来事だった。"}, {"t": 651.9666666666667, "x": "二つ目。医療という専門の分野だった。"}, {"t": 654.5833333333334, "x": "三つ目。実質的な経営者である理事長の犯罪だった。"}, {"t": 658.2166666666667, "x": "四つ目がこの事件らしい理由だ。"}, {"t": 660.3833333333333, "x": "なに？"}, {"t": 661.5166666666667, "x": "被害を届け出るのを、ためらう人が多かった。"}, {"t": 664.2833333333333, "x": "手術の性質からか、名前を\n言わない人が多かったという。"}, {"t": 667.9833333333333, "x": "婦人科のことを、警察に話すのは勇気がいるわね。"}, {"t": 671.3, "x": "名前が言えなければ、具体的な話にならない。"}, {"t": 674.25, "x": "さらに法律の当てはめにも苦労したと述べている。"}, {"t": 677.1, "x": "どの法律の、どの罪に当たるのか。"}, {"t": 679.4, "x": "これが後にもっと大きな壁になる。"}, {"t": 681.5333333333333, "x": "捜査の間、病院は普通に診療を続けていた。"}, {"t": 684.6333333333333, "x": "テレビや新聞の広告も出ていた。"}, {"t": 686.7, "x": "別の議員は、捜査が止まっていた\n時期があったのではと問うている。"}, {"t": 690.4, "x": "これは議員の指摘で、確かめられた話ではない。"}, {"t": 693.4333333333333, "x": "確かなのは、1980年9月10日に\nようやく動いたことだ。"}, {"t": 698.2833333333333, "x": "逮捕の翌日、新聞が大きく報じた。"}, {"t": 700.9333333333333, "x": "ここから届け出が止まらなくなる。"}, {"t": 702.95, "x": "最初に出した1,274人は、9月23日の時点の数だ。"}, {"t": 707.4833333333333, "x": "10月15日には、約1,400人と警察庁が答えている。"}, {"t": 711.6833333333333, "x": "まだ増えたのね。"}, {"t": 712.85, "x": "ところが別の数字もある。"}, {"t": 714.4833333333333, "x": "埼玉県の衛生部に届いた被害は1,138件。"}, {"t": 718.0, "x": "のちに1,140人と言った議員もいる。"}, {"t": 720.6, "x": "どれが本当なの？"}, {"t": 721.9166666666666, "x": "どれも本当だ。数えた場所が違う。"}, {"t": 724.2333333333333, "x": "警察と保健所を足した数。"}, {"t": 725.9833333333333, "x": "県の衛生部に届いた数。"}, {"t": 727.7833333333333, "x": "2回届けた人が入っている数もある。"}, {"t": 730.2166666666667, "x": "ここで気をつけることがある。"}, {"t": 731.8333333333334, "x": "国会では「1,138人が摘出された」という\n言い方も出た。"}, {"t": 736.2666666666667, "x": "だが1,138は届け出の数だ。"}, {"t": 738.9166666666666, "x": "届け出た人が、全員手術を受けたわけじゃないのね。"}, {"t": 742.3666666666667, "x": "そうだ。別の議員は内訳を述べている。"}, {"t": 744.8166666666667, "x": "保健所に訴えた人のうち、\n969人が超音波の検査を受けた。"}, {"t": 749.4666666666667, "x": "726人が手術室に送られた。"}, {"t": 752.2333333333333, "x": "手術を受けた全員を数えた\n記録は、見つからなかった。"}, {"t": 755.6666666666666, "x": "後年の議員が調査を求めたが、\n厚生省は困難だと答えた。"}, {"t": 759.6166666666667, "x": "そっとしておいてほしい人もいる、というのが理由だ。"}, {"t": 762.7166666666667, "x": "それも、そうよね。"}, {"t": 764.1333333333333, "x": "だから、この回で言えるのは\n「訴えは1,000件を超えた」までだ。"}, {"t": 767.9333333333333, "x": "そしてここが最初の数になる。"}, {"t": 770.5333333333333, "x": "事件は、すぐに別の方向へ飛び火した。"}, {"t": 773.1666666666666, "x": "9月25日の国会で、議員はこう呼んでいる。"}, {"t": 776.1833333333333, "x": "「前厚生大臣」。"}, {"t": 777.4666666666667, "x": "前？ 大臣が代わったの？"}, {"t": 779.2833333333333, "x": "辞めていた。逮捕から半月のうちにな。"}, {"t": 781.8, "x": "国会の発言によると経過はこうだ。"}, {"t": 784.1166666666667, "x": "この年の8月13日。"}, {"t": 786.05, "x": "厚生大臣の就任祝いとして、\n理事長が500万円を渡した。"}, {"t": 790.0833333333334, "x": "場所は大臣室だと、議員は述べている。"}, {"t": 792.7166666666667, "x": "厚生省の一番上の部屋で？"}, {"t": 794.7166666666667, "x": "本人が認めて大臣を辞めた、と別の議員も述べた。"}, {"t": 798.0666666666667, "x": "大臣のほかにも、献金の話は広がった。"}, {"t": 801.05, "x": "12月8日には、関係者8人が書類送致された。"}, {"t": 804.55, "x": "疑いは政治資金規正法違反だ。"}, {"t": 806.9, "x": "病院の話が、政治の話になっちゃった。"}, {"t": 809.8833333333333, "x": "国会の論戦も、しばらくそちらに流れた。"}, {"t": 812.7, "x": "後任の大臣は、辞めた人の分まで答弁に立つ。"}, {"t": 815.9666666666667, "x": "こう述べた。「遺憾の意を越えて\n恐しいことでございます」。"}, {"t": 819.15, "x": "「想像もできないことが医療で行われた」とも言った。"}, {"t": 822.4, "x": "強い言葉ね。"}, {"t": 823.5833333333334, "x": "そして「氷山の一角ではないか」と心配している。"}, {"t": 826.9333333333333, "x": "ただ、言葉は強くても、すぐには\n病院を閉められなかった。"}, {"t": 831.2333333333333, "x": "閉められない？ 理事長が逮捕されたのに？"}, {"t": 833.7833333333333, "x": "議員も、そこに食いついた。"}, {"t": 835.5666666666667, "x": "食中毒を出したレストランは、翌日から休業する。"}, {"t": 839.05, "x": "それなのに、病院はなぜ診療を続けられるのか、と。"}, {"t": 842.45, "x": "そうよ。なんで？"}, {"t": 843.6833333333333, "x": "医療法には、確かに閉鎖の決まりがある。"}, {"t": 846.2333333333333, "x": "開設者に犯罪があれば、閉鎖を命じられる。"}, {"t": 849.1, "x": "だがこの病院の開設者は医療法人だ。"}, {"t": 851.6833333333333, "x": "理事長ではなく、法人そのものが開設者になる。"}, {"t": 854.95, "x": "理事長は法人の代表じゃないの？"}, {"t": 857.0833333333334, "x": "局長の説明はこうだ。"}, {"t": 858.7166666666667, "x": "理事長の個人の犯罪だけで、\n法人がしたとは言いにくい。"}, {"t": 862.2, "x": "院長の犯罪も明らかになれば、\n法人ぐるみと認定できる。"}, {"t": 866.05, "x": "理屈は分かるけど、回りくどいわね。"}, {"t": 868.4333333333333, "x": "議員も納得しなかった。"}, {"t": 870.0833333333334, "x": "ここでも、法律の作りが壁になった。"}, {"t": 872.65, "x": "動きが出たのは12月だ。"}, {"t": 874.4, "x": "12月3日、埼玉県が保険の指定を取り消した。"}, {"t": 877.8666666666667, "x": "病院と医師3人の分だ。"}, {"t": 879.6333333333333, "x": "理由は、資格のない人が機械を\n動かして請求したことなど。"}, {"t": 883.5, "x": "12月26日、院長が起訴された。"}, {"t": 886.3333333333334, "x": "翌1981年2月、県は法人の言い分を\n聞き、閉鎖命令へ進む。"}, {"t": 891.4833333333333, "x": "逮捕から数えて、およそ5か月。"}, {"t": 893.7166666666667, "x": "1983年の国会では、病院は\n閉鎖され営業していないとされた。"}, {"t": 898.6666666666666, "x": "やっと止まったのね。"}, {"t": 900.0666666666667, "x": "診療は止まった。ただ、一番の問いはまだ残っている。"}, {"t": 904.1, "x": "病院が閉まったら、被害の補償はどうなるの？"}, {"t": 907.0166666666667, "x": "そこも早くから問題になった。"}, {"t": 909.0333333333333, "x": "病院の負債は26億円にのぼると議員が述べている。"}, {"t": 912.35, "x": "建物も土地も、銀行の担保に\n入っていたという話まで出た。"}, {"t": 916.4, "x": "払えるお金が無いってことじゃない。"}, {"t": 918.5, "x": "被害者同盟は、厚生省に救済を要望した。"}, {"t": 921.5166666666667, "x": "議員は、国が代わりに\n補償できないかと大臣に尋ねた。"}, {"t": 924.9833333333333, "x": "大臣の答えは、原則を崩さなかった。"}, {"t": 927.6833333333333, "x": "加害者が被害者に補償するのが原則である。"}, {"t": 930.4666666666667, "x": "国が代わって補償するのは大変難しい問題だ、と。"}, {"t": 934.0, "x": "患者の側に立つって言っていたのに。"}, {"t": 936.25, "x": "補償に協力したいとは述べている。"}, {"t": 938.35, "x": "ただ法律の上では、医師と患者の民事の争いになる。"}, {"t": 941.7333333333333, "x": "お金の流れにも、議員は疑問を向けた。"}, {"t": 944.2833333333333, "x": "理事長も院長も、公示される\n所得に届いていなかった。"}, {"t": 947.7333333333333, "x": "法人も赤字の年があったと、議員は述べている。"}, {"t": 950.6666666666666, "x": "それなのに、大きな献金が各所に渡っていた。"}, {"t": 953.7, "x": "国税庁は、この年の1月に\n税務調査を終えていたと答えた。"}, {"t": 957.6166666666667, "x": "その後の調べは、推移を見て検討するとの答弁だ。"}, {"t": 960.8333333333334, "x": "銀行は病院に融資をしていた。"}, {"t": 962.8333333333334, "x": "医師の免許と保険の指定があるから\n妥当と考えたのだろう、と役所は述べた。"}, {"t": 967.3666666666667, "x": "資格と指定があれば、外からは立派な病院に見える。"}, {"t": 970.6666666666666, "x": "これも、この事件に何度も出てくる形だ。"}, {"t": 974.0333333333333, "x": "逮捕の疑いは、無資格で診たことだった。"}, {"t": 976.7666666666667, "x": "しかし被害を訴えた人たちの怒りは、そこではない。"}, {"t": 980.1833333333333, "x": "悪くないものを取られた、ってことよね。"}, {"t": 982.5833333333334, "x": "そうだ。だから女性たちは自分で動いた。"}, {"t": 985.1333333333333, "x": "まず被害者同盟を作った。"}, {"t": 986.9333333333333, "x": "そして1980年9月29日に12人。"}, {"t": 990.35, "x": "10月14日に20人。"}, {"t": 992.1, "x": "合わせて32人が、傷害罪で告訴した。"}, {"t": 995.0666666666667, "x": "相手は理事長と医師たちだ。"}, {"t": 996.9, "x": "よく名乗り出たわね。"}, {"t": 998.2833333333333, "x": "名前を言えなかった人が多かった事件だ。"}, {"t": 1000.7666666666667, "x": "告訴には、名前も事情もさらす覚悟が要る。"}, {"t": 1003.5833333333334, "x": "同盟の代表は、公の場でこう説明している。"}, {"t": 1006.6166666666667, "x": "警察の捜査は、資格の有無に絞られていた。"}, {"t": 1009.55, "x": "それでは、手術が必要だったかどうかが問われない。"}, {"t": 1012.6333333333333, "x": "だから傷害で告訴した、と。"}, {"t": 1014.75, "x": "資格の話じゃなくて、体の話をしてほしかったのね。"}, {"t": 1018.5333333333333, "x": "材料はあった。"}, {"t": 1019.55, "x": "病院は手術のあと、取った\n物の写真を家族に見せていた。"}, {"t": 1023.2166666666667, "x": "その写真をもらっていた家族がいた。"}, {"t": 1025.4, "x": "別の病院で見てもらうと、\n写っている限りでは異常が無い。"}, {"t": 1028.8666666666666, "x": "そういう例がたくさんあったと、代表は述べた。"}, {"t": 1031.7333333333333, "x": "それなら証拠になるじゃない。"}, {"t": 1033.4666666666667, "x": "普通はそう思う。"}, {"t": 1034.55, "x": "警察も臓器を押収し、専門家に鑑定を頼んでいる。"}, {"t": 1038.0, "x": "11月6日の夜、理事長は保釈された。"}, {"t": 1040.9166666666667, "x": "警察庁は、捜査への影響を認めている。"}, {"t": 1043.6166666666666, "x": "「全く影響がないとは申されない」と。"}, {"t": 1046.6, "x": "医師たちはどう関わっていたのか。"}, {"t": 1048.55, "x": "1980年11月17日、警察は\n院長ら医師5人を書類送検した。"}, {"t": 1053.95, "x": "ただし傷害ではない。"}, {"t": 1055.4166666666667, "x": "じゃあ何の罪？"}, {"t": 1056.6166666666666, "x": "医師法違反の手助けと、\n看護の資格を決めた法律の違反だ。"}, {"t": 1060.5333333333333, "x": "中身はこう説明された。"}, {"t": 1062.1833333333334, "x": "理事長の無資格の検査と知りながら、患者を回した。"}, {"t": 1065.5666666666666, "x": "1978年1月から79年12月で、延べ845人。"}, {"t": 1070.9666666666667, "x": "845人も、知っていて回したってこと？"}, {"t": 1074.2, "x": "それが送検の疑いだ。"}, {"t": 1075.8166666666666, "x": "ほかにも二つあった。"}, {"t": 1077.2333333333333, "x": "資格のない秘書が、手術の糸を結ぶ作業をしたこと。"}, {"t": 1080.6666666666667, "x": "これが51回で患者は50人。"}, {"t": 1082.7833333333333, "x": "別の秘書が、心電図の検査をしたこと。"}, {"t": 1085.4833333333333, "x": "これが25回で患者は21人。"}, {"t": 1087.7833333333333, "x": "合わせて延べ921人の分が、書類送検された。"}, {"t": 1091.55, "x": "921って、大きな数よね。"}, {"t": 1094.1333333333334, "x": "大きい。でも、これは手術の是非の数ではない。"}, {"t": 1097.0166666666667, "x": "誰が検査をしたか、の数だ。"}, {"t": 1099.2166666666667, "x": "あ、また資格の話なのね。"}, {"t": 1101.2833333333333, "x": "そうなんだ。"}, {"t": 1102.4166666666667, "x": "資格の有無は、書類と記録で確かめられる。"}, {"t": 1105.2333333333333, "x": "手術が必要だったかは、そう簡単にいかない。"}, {"t": 1108.2166666666667, "x": "議員の一人は、このころ国会で不安を述べている。"}, {"t": 1111.25, "x": "悪くない臓器を取っても、\n立証できなければ犯罪にならないのか。"}, {"t": 1115.2, "x": "それでは国民は怖くて医者にかかれない、と。"}, {"t": 1117.9333333333334, "x": "その不安は、3年後に現実の数字になる。"}, {"t": 1121.45, "x": "捜査が続く間に国も動いていた。"}, {"t": 1123.75, "x": "逮捕の翌月、厚生省に検討委員会ができる。"}, {"t": 1126.95, "x": "名前が長い。信頼を回復するための検討委員会だ。"}, {"t": 1130.4166666666667, "x": "議員たちが求めたのは、苦情を受ける窓口だった。"}, {"t": 1133.6833333333334, "x": "どういうこと？"}, {"t": 1134.8, "x": "この事件では、訴えがたらい回しになった。"}, {"t": 1137.55, "x": "県の保険課も保健所も、記録が無いと\n答えたと議員は述べた。"}, {"t": 1141.5333333333333, "x": "訴えたのに記録が残ってないの？"}, {"t": 1143.7833333333333, "x": "受ける場所が決まっていなかったからだ。"}, {"t": 1145.9833333333333, "x": "前例もあった。1977年に東京と\n大阪で開いた医療110番だ。"}, {"t": 1151.0833333333333, "x": "延べ5日間で1,182件の苦情が来たと、\n議員が述べている。"}, {"t": 1155.25, "x": "大臣は、各県に窓口を作る考えを示した。"}, {"t": 1158.55, "x": "ここで大臣が珍しいことを言っている。"}, {"t": 1160.85, "x": "「医療についてはお医者さんや\n医療機関が主人公ではなくて」。"}, {"t": 1164.1666666666667, "x": "「地域住民が主人公である」。"}, {"t": 1166.1, "x": "いいこと言うじゃない。"}, {"t": 1167.2833333333333, "x": "ところが反発が来た。"}, {"t": 1168.8166666666666, "x": "議員が紹介した新聞記事によると、\n日本医師会の申し入れだ。"}, {"t": 1172.6833333333334, "x": "「暗黒国家における人民裁判的要素を\n導入しようとするもの」。"}, {"t": 1176.7, "x": "人民裁判！"}, {"t": 1177.8166666666666, "x": "医師の側にも、理由はあった。"}, {"t": 1179.7, "x": "大部分の医師は、まじめに働いている。"}, {"t": 1182.2, "x": "大臣も「これと一緒にされたくない」\n気持ちは強いと認めていた。"}, {"t": 1186.2, "x": "不正を調べることと、医師全体を疑うこと。"}, {"t": 1189.1333333333334, "x": "その線引きが、ここから何年も揉めることになる。"}, {"t": 1192.8333333333333, "x": "刑事の話に戻る。1984年4月11日。"}, {"t": 1196.8, "x": "衆議院の法務委員会で、議員が結果を尋ねた。"}, {"t": 1199.8666666666666, "x": "法務省の刑事局長が答えた。"}, {"t": 1202.0166666666667, "x": "理事長と院長らに対する傷害事件は、合計233件。"}, {"t": 1206.3166666666666, "x": "32人から、233件まで増えたのね。"}, {"t": 1209.7166666666667, "x": "告訴に加えて、警察が送った分もあったという。"}, {"t": 1212.8166666666666, "x": "ここが二つ目の数だ。"}, {"t": 1214.3666666666666, "x": "1,000件を超えた訴えが、233件になった。"}, {"t": 1217.8166666666666, "x": "それで結果は？"}, {"t": 1218.9666666666667, "x": "局長の答えは一文だった。"}, {"t": 1220.9, "x": "「いずれも不起訴処分に付されております」。"}, {"t": 1223.3166666666666, "x": "233件、全部？"}, {"t": 1225.3166666666666, "x": "全部だ。"}, {"t": 1226.45, "x": "1981年8月から83年8月にかけて、\n何回かに分けて出された。"}, {"t": 1232.2666666666667, "x": "三つ目の数は0だ。"}, {"t": 1233.8666666666666, "x": "全部だめって、そんなことある？"}, {"t": 1235.95, "x": "議員も理由を問いただした。"}, {"t": 1237.5833333333333, "x": "局長は、医学の問題の難しさを挙げた。"}, {"t": 1240.4833333333333, "x": "手術の必要があったかどうか。"}, {"t": 1242.4833333333333, "x": "手術の方法が適当だったかどうか。"}, {"t": 1244.8666666666666, "x": "医師や鑑定人に多数お願いして\n調べた、と述べている。"}, {"t": 1248.2833333333333, "x": "その結論がこれだ。"}, {"t": 1249.6833333333334, "x": "「犯罪を認め公訴を維持するだけの証拠はない」。"}, {"t": 1252.5333333333333, "x": "公訴を維持？"}, {"t": 1253.65, "x": "裁判で有罪を証明し切れる、という意味だ。"}, {"t": 1256.35, "x": "大学の資料は、医師の証言を否定する\n証拠が足りない判断だと書く。"}, {"t": 1260.65, "x": "ここからは、記録を読んだ上での推測だ。"}, {"t": 1263.3, "x": "手術の必要が無かったと示すには、\n手術の前の体の状態が要る。"}, {"t": 1267.7666666666667, "x": "だが手術のあとでは、確かめられる物が限られる。"}, {"t": 1271.0166666666667, "x": "取られたあとじゃ、証明できないってこと？"}, {"t": 1273.5833333333333, "x": "そこが、この事件の一番つらいところだ。"}, {"t": 1276.85, "x": "不起訴に文句は言えないの？"}, {"t": 1278.6166666666666, "x": "言える。検察審査会という仕組みがある。"}, {"t": 1281.1166666666666, "x": "くじで選ばれた市民が、\n不起訴でよかったかを調べる。"}, {"t": 1284.3166666666666, "x": "被害者たちはここに申し立てた。"}, {"t": 1286.3666666666666, "x": "まず1982年11月に3人が申し立てる。"}, {"t": 1290.0333333333333, "x": "翌83年1月12日に議決が出た。"}, {"t": 1293.1166666666666, "x": "3人のうち2人は不起訴相当。"}, {"t": 1295.25, "x": "残る1人は不起訴不相当。"}, {"t": 1297.2333333333333, "x": "不起訴はおかしい、ってことよね？"}, {"t": 1299.2333333333333, "x": "そうだ。市民が、もう一度調べろと言った。"}, {"t": 1302.0, "x": "検察は再び調べた。"}, {"t": 1303.7333333333333, "x": "そして答えが出たのは、7日後の1月19日だ。"}, {"t": 1307.1833333333334, "x": "7日？"}, {"t": 1308.3, "x": "結果はまた不起訴だった。"}, {"t": 1310.0833333333333, "x": "えっ、たった7日で？"}, {"t": 1311.6333333333334, "x": "議員は、2人についての議決の内容にも触れた。"}, {"t": 1314.7166666666667, "x": "不起訴相当の理由に、公訴時効があったという。"}, {"t": 1317.6, "x": "局長も「何件か時効の関係もあった」と認めている。"}, {"t": 1321.4166666666667, "x": "時効……手術が古いから？"}, {"t": 1323.35, "x": "訴えが1974年までさかのぼる事件だ。"}, {"t": 1326.6, "x": "時間がたち過ぎた分は、判断さえ受けられない。"}, {"t": 1329.5166666666667, "x": "議員は局長にこう迫った。"}, {"t": 1331.3333333333333, "x": "シロかクロかを決めるのは、裁判所の役割だろうと。"}, {"t": 1334.4833333333333, "x": "局長の答えははっきりしていた。"}, {"t": 1336.5666666666666, "x": "「シロかクロかわからぬ」なら、\n起訴するのは適当でない。"}, {"t": 1339.9, "x": "起訴する権限は、検察官だけが持っている。"}, {"t": 1342.8, "x": "検察が起こさなければ、法廷で確かめる道は閉じる。"}, {"t": 1346.2333333333333, "x": "その後に13人も申し立て、2人は\n不起訴相当、11人は当時審査中だった。"}, {"t": 1351.5666666666666, "x": "心配の声はもう一つあった。"}, {"t": 1353.5, "x": "不起訴で終わると、押収したカルテが病院側へ返る。"}, {"t": 1356.75, "x": "民事の証拠が隠されないか、と議員は訴えた。"}, {"t": 1360.3666666666666, "x": "じゃあ、誰も罪に問われなかったの？"}, {"t": 1362.6666666666667, "x": "そこは正確に言う必要がある。"}, {"t": 1364.6166666666666, "x": "有罪になった罪はある。"}, {"t": 1366.1666666666667, "x": "理事長は医師法違反で起訴された。"}, {"t": 1368.2666666666667, "x": "院長は、看護の資格を決めた\n法律の違反で起訴された。"}, {"t": 1371.85, "x": "資格のない人に、検査などをさせたという内容だ。"}, {"t": 1375.0166666666667, "x": "大学の資料が判例雑誌を引いて、結果を載せている。"}, {"t": 1378.3333333333333, "x": "1988年1月28日、浦和地裁川越支部の判決。"}, {"t": 1383.25, "x": "院長は懲役8か月、理事長は懲役1年6か月。"}, {"t": 1387.05, "x": "刑務所に入ったの？"}, {"t": 1388.4833333333333, "x": "どちらも執行猶予がついた。"}, {"t": 1390.3, "x": "院長の刑事罰は、1990年に確定している。"}, {"t": 1393.9666666666667, "x": "これは厚労省の文書でも確かめられる。"}, {"t": 1396.5166666666667, "x": "逮捕から10年で執行猶予。"}, {"t": 1398.5666666666666, "x": "しかも、裁かれたのは資格の問題だけだ。"}, {"t": 1401.4, "x": "手術が必要だったかは、この裁判の争いにならない。"}, {"t": 1404.9, "x": "判決のなかで、一つ大事な\n考え方が示されたと資料にある。"}, {"t": 1409.0, "x": "検査が無害かどうかは関係ない。"}, {"t": 1411.05, "x": "誤った検査結果が、診断に\n使われる危険があるからだ。"}, {"t": 1414.85, "x": "検査を甘く見るなってことね。"}, {"t": 1416.8333333333333, "x": "そうだ。今の医療の決まりにつながる話でもある。"}, {"t": 1419.8666666666666, "x": "ただ被害者が聞きたかった答えではなかった。"}, {"t": 1422.5666666666666, "x": "被害者同盟の代表は、国会でこう述べている。"}, {"t": 1425.5333333333333, "x": "悪いことをしたのなら、見合った処分をしてほしい。"}, {"t": 1428.4166666666667, "x": "そうでなければ、患者は全体に\n不信を持たざるを得ない。"}, {"t": 1432.2666666666667, "x": "1984年7月30日。参議院の公聴会。"}, {"t": 1436.2833333333333, "x": "被害者同盟の代表が、国会で意見を述べた。"}, {"t": 1439.3166666666666, "x": "名前は出さない。話の中身だけを追う。"}, {"t": 1441.8333333333333, "x": "まず最初に出た1,138件のその後だ。"}, {"t": 1444.8666666666666, "x": "県に届いた数よね。あれは調べたんでしょ？"}, {"t": 1447.6666666666667, "x": "代表の答えは、調べていないに近かった。"}, {"t": 1450.4666666666667, "x": "事件の前の届け出は、受け付けたまま止まっている。"}, {"t": 1453.6, "x": "事件の後の1,138件も、まとめが出ていない。"}, {"t": 1457.05, "x": "県庁の中にあるだけだ、と代表は述べた。"}, {"t": 1459.95, "x": "4年たっても、まとめてないの？"}, {"t": 1462.0833333333333, "x": "追いかけて調べてほしいと、ずっと求めていたという。"}, {"t": 1465.1333333333334, "x": "次に手術のあとの体の話だ。"}, {"t": 1467.45, "x": "肩凝り、目まい、いらいら、汗。"}, {"t": 1469.6333333333334, "x": "更年期に似た症状が、20代や30代の人に出ていた。"}, {"t": 1473.4666666666667, "x": "離婚に至った例も多いと、代表は述べている。"}, {"t": 1476.2666666666667, "x": "「その人の一生を狂わせてしまうような被害」。"}, {"t": 1478.9166666666667, "x": "行政に救済を頼むと、返事はこうだったという。"}, {"t": 1481.9666666666667, "x": "「病院とあなた方の間の問題だ」。"}, {"t": 1484.3333333333333, "x": "冷たいわね……。"}, {"t": 1485.4666666666667, "x": "代表は、第三者が医療の中身を見る仕組みを求めた。"}, {"t": 1488.9, "x": "医師の良心に頼るだけでは、\n解決しないと述べている。"}, {"t": 1492.2166666666667, "x": "お金の話も、きれいには終わらなかった。"}, {"t": 1494.8, "x": "不正な請求の分で、378枚、\n123万5,173円が保険者へ返された。"}, {"t": 1501.25, "x": "では患者が窓口で払った分は？"}, {"t": 1503.4, "x": "1986年の国会で、議員が問いただしている。"}, {"t": 1507.1, "x": "患者の負担分は返っておらず、通知も無いと述べた。"}, {"t": 1510.4166666666667, "x": "なんで知らせないのよ。"}, {"t": 1511.8166666666666, "x": "局長は、埼玉県の考えをこう紹介した。"}, {"t": 1514.8833333333334, "x": "事件に触れられたくない人もいる。"}, {"t": 1516.9333333333334, "x": "だから県から通知はせず、\n問い合わせがあれば答える。"}, {"t": 1520.0166666666667, "x": "そっとしておく配慮と、知らせない不利益。"}, {"t": 1522.6166666666666, "x": "この事件は、そのどちらにも当てはまるから難しい。"}, {"t": 1526.35, "x": "ここでもう一方の言い分も置いておく。"}, {"t": 1528.4333333333334, "x": "傷害では誰も起訴されていない。"}, {"t": 1530.3833333333334, "x": "だから院長の側には、主張する余地があった。"}, {"t": 1533.2666666666667, "x": "1984年7月、議員が国会で手記の内容を紹介した。"}, {"t": 1537.85, "x": "院長は、ある新聞社を訴えると手記に書いたという。"}, {"t": 1541.0, "x": "記事で病院をつぶされた、という主張だ。"}, {"t": 1543.6333333333334, "x": "えっ、病院の側が怒っていたの？"}, {"t": 1545.9166666666667, "x": "手記の言葉はこう読み上げられた。"}, {"t": 1547.8833333333334, "x": "「乱診乱療どころか、誠心誠意、心をつくして」。"}, {"t": 1551.2333333333333, "x": "「臨床医として最善の努力を重ねてきた」。"}, {"t": 1554.05, "x": "被害を訴えた人からしたら、たまらないわね。"}, {"t": 1557.0166666666667, "x": "議員も、居直りだと批判した。"}, {"t": 1559.0666666666666, "x": "ただ裁かれていない主張を黙らせることもできない。"}, {"t": 1561.9833333333333, "x": "刑事の結論が出ないと、話はここで止まってしまう。"}, {"t": 1565.3, "x": "病院の再開についても、動きがあった。"}, {"t": 1567.9, "x": "1982年には、分院の開設を\n申請したという報道が議員から出ている。"}, {"t": 1573.05, "x": "被害者同盟は、社会正義を\n逆なでするものと反対した。"}, {"t": 1576.75, "x": "監督する側は、今の法律では\n認めざるを得ないとも報じられた。"}, {"t": 1580.8833333333334, "x": "法律の作りがまた出てくるのね。"}, {"t": 1583.1, "x": "何度も同じ壁に当たる事件だ。"}, {"t": 1585.1333333333334, "x": "1984年の国会では、厚生省の局長がこう答えた。"}, {"t": 1589.45, "x": "「国もまだ被告でございまして、終わったとは\n考えておりません」。"}, {"t": 1593.0833333333333, "x": "被害者同盟は、もう一つの道を進んでいた。"}, {"t": 1596.0333333333333, "x": "刑事で問えないなら、民事で問う。"}, {"t": 1598.75, "x": "その前に法律の話を片づける。"}, {"t": 1601.0333333333333, "x": "「理事長に医師の資格が\n要らなかった」話を覚えているか。"}, {"t": 1604.6166666666666, "x": "覚えてる。あれ、おかしいわよね。"}, {"t": 1606.75, "x": "議員は事件の直後から、そこを問うていた。"}, {"t": 1609.4, "x": "厚生省は医療法の改正に動く。"}, {"t": 1611.5833333333333, "x": "だがまとまるまでに時間がかかった。"}, {"t": 1613.7333333333333, "x": "1983年に審議官が、こう答えている。"}, {"t": 1617.15, "x": "関係方面との調整がうまくいかず、\n延び延びになった、と。"}, {"t": 1620.85, "x": "成立は1985年12月だ。"}, {"t": 1623.45, "x": "逮捕から5年余りたっていた。"}, {"t": 1625.4, "x": "中身の大事な所は二つある。"}, {"t": 1627.4833333333333, "x": "一つ。理事長は、原則として\n医師か歯科医師から選ぶ。"}, {"t": 1631.0833333333333, "x": "二つ。知事が医療法人の事務所に立入検査できる。"}, {"t": 1634.4666666666667, "x": "違反があれば、改善命令や役員の解任勧告もできる。"}, {"t": 1638.2, "x": "よかったじゃない。"}, {"t": 1639.3, "x": "確かに抜け穴の一つはふさがった。"}, {"t": 1641.6166666666666, "x": "ただ審議の中で別の疑問も出た。"}, {"t": 1643.8166666666666, "x": "改正の元になった問題に、\n本当に対応しているのか、と。"}, {"t": 1647.6666666666667, "x": "あのとき足りなかったのは、\n診療の中身を見る力だった。"}, {"t": 1651.2, "x": "1992年、別の改正の審議で局長が答えている。"}, {"t": 1655.2833333333333, "x": "富士見のようなものが、今回の改正で規制できるか。"}, {"t": 1658.5333333333333, "x": "局長の答えは、「それはできない」。"}, {"t": 1660.8166666666666, "x": "えっ。"}, {"t": 1661.95, "x": "医療の中に入る規制は、\n診療報酬のチェックになるという。"}, {"t": 1665.5833333333333, "x": "事件から12年たっても、壁の場所は同じだった。"}, {"t": 1668.9333333333334, "x": "掃除のブラシの話が、まだ続いているのね。"}, {"t": 1671.9333333333334, "x": "そう言ってもいいだろう。"}, {"t": 1673.8, "x": "民事の裁判は、1981年に始まったと資料にある。"}, {"t": 1677.9666666666667, "x": "被害を訴えた女性たちが、医師らを相手に起こした。"}, {"t": 1681.1166666666666, "x": "国も相手に含まれていた。"}, {"t": 1682.9666666666667, "x": "刑事とは何が違うの？"}, {"t": 1684.6333333333334, "x": "民事はお金の賠償を求める裁判だ。"}, {"t": 1687.0833333333333, "x": "起こすのは検察ではなく、本人たち自身だ。"}, {"t": 1690.0166666666667, "x": "だから不起訴でも、法廷で争える。"}, {"t": 1692.3333333333333, "x": "ただその長さは想像を超えていた。"}, {"t": 1694.45, "x": "1981年に始まって、一審の判決が出るまでに18年。"}, {"t": 1699.1333333333334, "x": "1999年6月30日。"}, {"t": 1701.7333333333333, "x": "東京地裁の判決だ。"}, {"t": 1703.55, "x": "18年！ 訴えた人も年を取っちゃうわよ。"}, {"t": 1706.5, "x": "事件の発覚からは19年になる。"}, {"t": 1708.85, "x": "議員は「ほぼ全面勝訴」と述べている。"}, {"t": 1711.4333333333334, "x": "認められた額は、5億1,425万円。"}, {"t": 1714.4333333333334, "x": "国会では、議員が判決文の一部を読み上げている。"}, {"t": 1717.6166666666666, "x": "「単なる違法と言うにとどまらず」。"}, {"t": 1719.45, "x": "「明らかに常軌を逸した集団的異常行為と言うべき」。"}, {"t": 1722.7, "x": "判決でそこまで書くの？"}, {"t": 1724.4666666666667, "x": "さらに続く。"}, {"t": 1725.6, "x": "「単なるもうけ主義とは\n全然別個の異質のものである」。"}, {"t": 1728.7166666666667, "x": "医師たちは理事長の決定のまま\n手術をした、と判決は書いた。"}, {"t": 1732.6333333333334, "x": "判決は、こんなことは\n「通常あり得ない異様な事態」とも書いた。"}, {"t": 1736.7333333333333, "x": "刑事では起訴すらなかったのに、\n民事では 、\n1984年7月30日の参議院の公聴会。"}, {"t": 1961.4333333333334, "x": "医療法の改正は、\n1985年12月の本会議の報告を読んだ。"}, {"t": 1966.2666666666667, "x": "判決の言葉は、1999年11月25日に\n議員が読み上げた分を使った。"}, {"t": 1972.2, "x": "判決文そのものは読んだの？"}, {"t": 1974.2, "x": "全文は手に入らなかった。だから\n「読み上げた」と言った。"}, {"t": 1977.8666666666666, "x": "最後の処分は、\n2005年3月2日の厚生労働省の文書だ。"}, {"t": 1982.0666666666666, "x": "刑事の判決の年と刑は、\n東京大学の公開講義の資料で確かめた。"}, {"t": 1986.7166666666667, "x": "学生の発表資料なので、\nそこだけ「資料では」と言った。"}, {"t": 1990.6, "x": "わざと外した話もある。"}, {"t": 1992.3166666666666, "x": "手術の様子。被害を受けた方々の体の話の細かい所。"}, {"t": 1996.5, "x": "関わった人たちの名前。"}, {"t": 1998.1833333333334, "x": "国会で議員が述べても、\n確かめられなかった話もやめた。"}, {"t": 2001.9333333333334, "x": "国への訴えはどうなったの？"}, {"t": 2003.7666666666667, "x": "結末は確かめられなかった。だから話していない。"}, {"t": 2007.6, "x": "ねえ、最初の数の話に戻っていい？"}, {"t": 2010.1166666666666, "x": "いいぞ。"}, {"t": 2011.25, "x": "1,000件を超えた訴えは、最後にいくつになったの？"}, {"t": 2014.3666666666666, "x": "並べるとこうなる。"}, {"t": 2015.5333333333333, "x": "届け出は1,138件。"}, {"t": 2017.35, "x": "傷害の事件が233件。"}, {"t": 2019.7, "x": "起訴が0件。民事で認められたのが60事例。"}, {"t": 2022.7833333333333, "x": "処分の基になったのが9事例だ。"}, {"t": 2025.0833333333333, "x": "減ったのは、被害が小さかったからじゃないのね。"}, {"t": 2028.05, "x": "違う。数が減るたびに、確かめる物が減っていった。"}, {"t": 2031.4166666666667, "x": "密室だった。記録が無かった。"}, {"t": 2033.3833333333334, "x": "時効が来た。資料が捨てられた。"}, {"t": 2035.6, "x": "名乗り出られない人も、たくさんいた。"}, {"t": 2037.9833333333333, "x": "9にならなかった人たちは、どうなるの？"}, {"t": 2040.6166666666666, "x": "文書も、裁判所の判断を\n「否定するということではない」と書いている。"}, {"t": 2045.0, "x": "認められなかったことと、無かったことは別だ。"}, {"t": 2047.9166666666667, "x": "局長は「刑法その他の法律で\n立ち向かわざるを得ない」と答えた。"}, {"t": 2052.05, "x": "その刑法は、手術が必要だったかを裁けなかった。"}, {"t": 2055.4666666666667, "x": "行政は中に入れず、刑事は証明し切れなかった。"}, {"t": 2058.6666666666665, "x": "最後に残った道が、女性たちが\n自分で起こした民事だった。"}, {"t": 2062.5833333333335, "x": "自分で18年も闘わなきゃいけなかったのね。"}, {"t": 2065.6833333333334, "x": "そうだ。代表の言葉を、もう一度置いておく。"}, {"t": 2068.483333333333, "x": "病院に行った時点では「本当に\n心の底から信頼していた」。"}, {"t": 2072.383333333333, "x": "医師を疑わずに病院へ行けること。"}, {"t": 2074.483333333333, "x": "それを誰が確かめるのかは、今も問われ続けている。"}, {"t": 2077.6666666666665, "x": "今回は、1,000件の訴えと、0件の起訴の回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
