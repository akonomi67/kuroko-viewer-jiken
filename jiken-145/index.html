<script>
const D={"name": "145", "file": "145_編集用", "dur": 2085.3333125, "segs": [], "subs": [{"t": 0.0, "x": "1958年8月20日、東京の読売新聞社。"}, {"t": 4.066666666666666, "x": "社会部に若い男の声で電話が入った。"}, {"t": 6.683333333333334, "x": "自分が女の人の命を奪った、と男は言う。"}, {"t": 9.716666666666667, "x": "場所まで告げて電話は切れた。"}, {"t": 11.633333333333333, "x": "いたずらじゃないの？"}, {"t": 12.833333333333334, "x": "警察もはじめは、いたずらとして\n扱ったと伝えられている。"}, {"t": 16.433333333333334, "x": "ところが翌日、高校の屋上で16歳の生徒が見つかる。"}, {"t": 20.216666666666665, "x": "4日前の夕方から行方が分からなくなっていた。"}, {"t": 23.15, "x": "電話の主はそのあとも新聞社と警察へ連絡を続けた。"}, {"t": 26.883333333333333, "x": "犯人が自分から電話してくるの？"}, {"t": 29.133333333333333, "x": "そうだ。半月後に捕まったのは18歳の少年だった。"}, {"t": 32.766666666666666, "x": "問題はここから先だ。"}, {"t": 34.35, "x": "在京の新聞で名前を伏せたのは、たった1紙だった。"}, {"t": 37.75, "x": "1紙だけ？　未成年なのに？"}, {"t": 39.7, "x": "全国でも半分の新聞が名前を載せたという。"}, {"t": 42.55, "x": "学校の名前と家の住所は全部の新聞に出た。"}, {"t": 45.63333333333333, "x": "法律で禁じられていなかったの？"}, {"t": 47.75, "x": "禁じられていた。ただ、罰則が無かった。"}, {"t": 50.5, "x": "その秋、新聞社と国会と役所が同時に動き出す。"}, {"t": 53.96666666666667, "x": "12月16日、新聞協会は1つの方針を定めた。"}, {"t": 57.86666666666667, "x": "この方針は2022年まで1度も改定されていない。"}, {"t": 61.4, "x": "じゃあ今の新聞の書き方は、そこから？"}, {"t": 64.05, "x": "始まりの1つがこの事件だ。"}, {"t": 66.03333333333333, "x": "今回は小松川事件の秋を国会の記録で読んでいく。"}, {"t": 69.43333333333334, "x": "そして少年の名前を1度も言わずに進める。"}, {"t": 72.18333333333334, "x": "亡くなった2人の名前も出さない。"}, {"t": 74.36666666666666, "x": "名前の話なのに、名前を言わないのね。"}, {"t": 77.03333333333333, "x": "そういう回だ。"}, {"t": 78.68333333333334, "x": "場所は東京の東の端、江戸川区だ。"}, {"t": 81.3, "x": "都立小松川高校には夜に学ぶ定時制があった。"}, {"t": 84.51666666666667, "x": "昼は働いて夕方から学校へ行く生徒たちがいた。"}, {"t": 87.83333333333333, "x": "16歳で昼も夜もなのね。"}, {"t": 89.91666666666667, "x": "亡くなった生徒も、昼は働きながら\n通っていたと伝えられている。"}, {"t": 93.95, "x": "のちに国会で、ある議員が\nこの学校の夜の生徒に触れている。"}, {"t": 97.66666666666667, "x": "夜間の学生も労働者の立場で\n働いている、という言い方だ。"}, {"t": 101.46666666666667, "x": "当時の新聞にはハイティーンという言葉も見える。"}, {"t": 104.13333333333334, "x": "夏休みの8月17日のことだった。"}, {"t": 106.88333333333334, "x": "夕方4時ごろ、友人に会うと\n言って家を出たきり帰らない。"}, {"t": 110.31666666666666, "x": "8月21日、今度は小松川の警察署に電話が入る。"}, {"t": 114.33333333333333, "x": "場所をくわしく知らせる内容だった。"}, {"t": 116.46666666666667, "x": "調べた捜査員が学校の屋上で生徒を見つけた。"}, {"t": 119.61666666666666, "x": "学校の中だったの？"}, {"t": 121.2, "x": "そうだ。それも自分の通う学校だ。"}, {"t": 123.56666666666666, "x": "何があったかの中身は、この回では言わない。"}, {"t": 126.25, "x": "16歳の命が奪われたことだけを、ここに置いておく。"}, {"t": 129.73333333333332, "x": "警察はどう動いたの？"}, {"t": 131.28333333333333, "x": "小松川署に捜査本部が置かれた。"}, {"t": 133.48333333333332, "x": "手がかりは電話の声だった。"}, {"t": 135.83333333333334, "x": "犯人の動きはそれで止まらなかった。"}, {"t": 138.11666666666667, "x": "葬儀をしている家に郵便が届いた。"}, {"t": 140.28333333333333, "x": "中身は亡くなった生徒の櫛と手鏡だった。"}, {"t": 143.18333333333334, "x": "家族のところに？　ひどい……。"}, {"t": 144.95, "x": "警察にも持ち物が送られたと伝えられている。"}, {"t": 147.81666666666666, "x": "新聞はこの事件を連日大きく取り上げた。"}, {"t": 150.48333333333332, "x": "警察と新聞社は次の電話を待った。"}, {"t": 152.93333333333334, "x": "読売新聞社の電話に逆探知の装置が用意された。"}, {"t": 156.2, "x": "かかってきたら記者が話を引き延ばす手はずだ。"}, {"t": 159.23333333333332, "x": "本当にまた、かかってくるの？"}, {"t": 161.3, "x": "かかってきた。"}, {"t": 162.98333333333332, "x": "8月28日の朝、8時半を過ぎたころだ。"}, {"t": 166.36666666666667, "x": "読売新聞社の電話が鳴った。"}, {"t": 168.36666666666667, "x": "記者は相手を挑発して話を長引かせた。"}, {"t": 171.1, "x": "前の電話と声が違う、偽者じゃないのかと言う。"}, {"t": 174.21666666666667, "x": "怒らせて切らせないようにしたのね。"}, {"t": 176.41666666666666, "x": "男はしゃべり続けた。"}, {"t": 177.9, "x": "通話はおよそ30分におよんだ。"}, {"t": 179.95, "x": "32分と書く本もあるから、およそと言っておく。"}, {"t": 183.08333333333334, "x": "思いついたのは夏休みの前だ、と男は語った。"}, {"t": 186.28333333333333, "x": "指紋を残さない工夫も得意げに話している。"}, {"t": 189.03333333333333, "x": "そして「2度目の完全犯罪」と口にした。"}, {"t": 192.15, "x": "2度目？"}, {"t": 193.28333333333333, "x": "3度目は予告する、とまで言った。"}, {"t": 195.41666666666666, "x": "この時点では警察もその意味が分かっていない。"}, {"t": 198.11666666666667, "x": "逆探知は成功した。"}, {"t": 199.78333333333333, "x": "じゃあ捕まえたのね？"}, {"t": 201.13333333333333, "x": "かけた場所は分かったが、\n本人は押さえられなかった。"}, {"t": 204.23333333333332, "x": "5年後の国会で、ある議員が\nこの時のことを振り返っている。"}, {"t": 207.85, "x": "公衆電話を見つけて向かったが、\n一瞬の差で逃がしてしまった、と。"}, {"t": 211.96666666666667, "x": "残ったのは録音されたテープだ。"}, {"t": 213.98333333333332, "x": "翌日の8月29日、その声はラジオで全国に流される。"}, {"t": 218.1, "x": "声が似ている、という知らせが多く寄せられた。"}, {"t": 220.88333333333333, "x": "そこから見つかったの？"}, {"t": 222.41666666666666, "x": "声で絞り込まれ、1人の少年が\n捜査線に浮かんだと伝えられている。"}, {"t": 226.61666666666667, "x": "通っていたのは同じ学校の定時制1年だった。"}, {"t": 230.31666666666666, "x": "1958年9月1日、捜査本部は少年を逮捕した。"}, {"t": 234.66666666666666, "x": "この日の夕刊に、もう記事が出ている。"}, {"t": 237.11666666666667, "x": "なんて書いてあったの？"}, {"t": 238.55, "x": "毎日新聞の夕刊は見出しに少年の名前を入れた。"}, {"t": 241.78333333333333, "x": "もちろん、ここでは読まない。"}, {"t": 243.41666666666666, "x": "見出しの言葉は「二重人格」。"}, {"t": 245.53333333333333, "x": "わき見出しには「秀才の空想家」とある。"}, {"t": 248.3, "x": "本文には「孤独なハイ・ティーン」という\n言葉も見える。"}, {"t": 251.31666666666666, "x": "逮捕された日に、もう性格の話なの？"}, {"t": 254.06666666666666, "x": "取り調べの係官や、\nかつての担任の言葉が並んでいた。"}, {"t": 257.8, "x": "ある論文は当時の記事をこうまとめている。"}, {"t": 260.18333333333334, "x": "少年の性格と家庭に説明が集中したという。"}, {"t": 263.3, "x": "犯行の原因は育った環境にある、という書き方だ。"}, {"t": 266.6666666666667, "x": "当時のほとんどの新聞に同じ論調が見られたそうだ。"}, {"t": 269.96666666666664, "x": "名前も性格も、家のことも載ったのね。"}, {"t": 272.68333333333334, "x": "載った。ここでさっきの数字が出てくる。"}, {"t": 275.0833333333333, "x": "2018年の論文が当時の報道をこうまとめている。"}, {"t": 278.43333333333334, "x": "18歳の少年の実名を伏せた\n在京の新聞は、朝日新聞だけだった。"}, {"t": 283.15, "x": "全国の新聞でも半数が実名で報じた。"}, {"t": 285.96666666666664, "x": "学校名と家の住所は、すべての紙面に載っている。"}, {"t": 289.26666666666665, "x": "名前を伏せても住所が出たら同じじゃない？"}, {"t": 291.76666666666665, "x": "近所の人なら、すぐ分かっただろうな。"}, {"t": 294.2, "x": "この秋の少年事件の報道は、\n国会でも話題になっている。"}, {"t": 297.9, "x": "10月7日、ある女性の議員が法務大臣にこう頼んだ。"}, {"t": 301.46666666666664, "x": "どこの家でもお茶の間の話題になって、\n子どもへの影響が心配だ、と。"}, {"t": 305.6166666666667, "x": "「知る人ぞ知るでいい」という言い方までしている。"}, {"t": 308.4, "x": "騒ぎすぎだって言っているのね？"}, {"t": 310.3666666666667, "x": "名前の問題とは別の話だが、\n同じ秋の空気がよく分かる発言だ。"}, {"t": 315.48333333333335, "x": "少年法の第61条を見てみよう。"}, {"t": 317.8833333333333, "x": "戦後に作られた今の少年法の条文だ。"}, {"t": 320.55, "x": "家庭裁判所の審判に付された\n少年について定めている。"}, {"t": 324.0833333333333, "x": "「氏名、年齢、職業、住居、容ぼう等」とある。"}, {"t": 327.5833333333333, "x": "本人だと分かるような記事は載せてはならない。"}, {"t": 330.3333333333333, "x": "はっきり書いてあるじゃない。"}, {"t": 331.8833333333333, "x": "はっきり書いてある。"}, {"t": 332.9, "x": "条文の言葉では「推知」という。"}, {"t": 335.26666666666665, "x": "名前を書かなくても、誰か分かればだめだ。"}, {"t": 338.0, "x": "でも守られなかったのね？"}, {"t": 339.7, "x": "この条文には罰則が無い。"}, {"t": 341.45, "x": "戦前の旧少年法には罰則があった。"}, {"t": 344.01666666666665, "x": "1年以下の懲役か、千円以下の罰金だ。"}, {"t": 346.9166666666667, "x": "今の法律は表現の自由に\n配慮して罰則を置かなかった。"}, {"t": 350.6, "x": "罰が無いなら、新聞の判断に任せるわけね。"}, {"t": 353.76666666666665, "x": "そういう作りだ。だから前にも1度もめている。"}, {"t": 356.6166666666667, "x": "1950年9月、東京で現金が奪われる事件があった。"}, {"t": 360.6666666666667, "x": "奪われたのは、およそ190万円だ。"}, {"t": 363.23333333333335, "x": "疑われたのは19歳の少年だった。"}, {"t": 365.71666666666664, "x": "ほとんどの新聞が名前と顔写真を載せた。"}, {"t": 368.35, "x": "最高裁判所は事務総長の名前で新聞協会に警告した。"}, {"t": 372.21666666666664, "x": "新聞の側は、自粛を申し合わせて\n注意すると答えている。"}, {"t": 375.96666666666664, "x": "8年前に、もう約束していたの？"}, {"t": 378.46666666666664, "x": "約束はあった。だが申し合わせどまりだった。"}, {"t": 381.25, "x": "そして1958年の9月が来る。"}, {"t": 384.65, "x": "少年の名前には、もう1つ別の話がある。"}, {"t": 387.6333333333333, "x": "少年は在日朝鮮人の2世だった。"}, {"t": 390.1333333333333, "x": "ほとんどの記事には2つの名前が並んでいたという。"}, {"t": 393.2, "x": "2つ？"}, {"t": 394.3333333333333, "x": "ふだん使う日本の名前と本来の名前だ。"}, {"t": 396.96666666666664, "x": "同じ論文によると書き方にも差があった。"}, {"t": 399.55, "x": "在日朝鮮人という点をはっきり見ていたのは、\n読売新聞だけだった。"}, {"t": 403.96666666666664, "x": "ほかの多くの紙面に、その視点は無かったという。"}, {"t": 407.03333333333336, "x": "名前は2つ載せたのに？"}, {"t": 408.73333333333335, "x": "載せていても、話題の中心は性格と家庭だった。"}, {"t": 411.95, "x": "論文は当時の社会の見方の表れかも\nしれないと書いている。"}, {"t": 415.51666666666665, "x": "この「かもしれない」は大事に受け取っておきたい。"}, {"t": 418.43333333333334, "x": "なぜそうだったかを言い切れる資料は無い。"}, {"t": 420.5833333333333, "x": "国会でも国籍の話は短く出てくる。"}, {"t": 423.3333333333333, "x": "1959年3月10日、参議院の内閣委員会だ。"}, {"t": 427.4, "x": "愛知揆一 法務大臣が、\n前歴の扱いを振り返って答えた。"}, {"t": 431.5, "x": "「家が貧乏で特に\n国籍日本国籍でないというような関係等から」。"}, {"t": 435.65, "x": "「それは割合簡単にいわば\n無罪放免になっておった」。"}, {"t": 438.81666666666666, "x": "国籍のせいで扱いが軽くなったってこと？"}, {"t": 441.65, "x": "大臣がそう答えた、という記録だ。"}, {"t": 444.0, "x": "本当にそうだったかは、この答弁だけでは分からない。"}, {"t": 447.1333333333333, "x": "ここはそのまま置いておく。"}, {"t": 449.26666666666665, "x": "逮捕のあと、もう1つのことが明らかになる。"}, {"t": 452.1, "x": "あの電話の「2度目」という言葉だ。"}, {"t": 454.55, "x": "1度目があったの？"}, {"t": 455.8666666666667, "x": "あった。少年の自供で4月20日の事件が分かった。"}, {"t": 459.25, "x": "亡くなったのは20代の女性だ。"}, {"t": 461.28333333333336, "x": "年齢は資料で1歳ずれるので、20代と言っておく。"}, {"t": 464.56666666666666, "x": "4か月も、つながっていなかったのね。"}, {"t": 467.1666666666667, "x": "のちの裁判で、少年は\nこの事件の乱暴の部分を否認した。"}, {"t": 470.98333333333335, "x": "検察に導かれた供述だと主張したという。"}, {"t": 473.9, "x": "ただ判決は2人への犯行をどちらも認めている。"}, {"t": 477.03333333333336, "x": "その話も新聞に出たの？"}, {"t": 478.96666666666664, "x": "出た。もう1つ紙面をにぎわせた話がある。"}, {"t": 481.8, "x": "少年は小説を書いて懸賞に\n応募していたと報じられた。"}, {"t": 485.23333333333335, "x": "応募先は読売新聞社だったとされる。"}, {"t": 487.78333333333336, "x": "電話をかけた先と同じ？"}, {"t": 489.55, "x": "そうだ。筋書きが4月の事件に\n似ていると取り上げられた。"}, {"t": 493.06666666666666, "x": "これも新聞の見方として置いておく。"}, {"t": 495.28333333333336, "x": "相手は誰でもよかった、と評した作家もいた。"}, {"t": 498.1333333333333, "x": "9月2日の読売新聞には、大学教授の分析も載った。"}, {"t": 502.1, "x": "自分を誇示する異常な\n心理の持ち主だ、という見立てだ。"}, {"t": 505.46666666666664, "x": "裁判が始まる前に、紙面の上で\n少年の人物像ができていった。"}, {"t": 509.65, "x": "動機のない事件という言い方が広がっていく。"}, {"t": 512.3166666666667, "x": "なぜ電話をかけたのか。"}, {"t": 513.75, "x": "答えを断言できる資料は見つかっていない。"}, {"t": 516.8666666666667, "x": "ここで舞台は国会へ移る。"}, {"t": 518.6, "x": "1958年10月21日、参議院の法務委員会だ。"}, {"t": 522.95, "x": "法務省の検事が委員に資料を配った。"}, {"t": 525.3333333333334, "x": "裏表紙に紙が1枚貼りつけてある。"}, {"t": 527.7666666666667, "x": "なんの紙？"}, {"t": 528.8833333333333, "x": "東京地検が調べた少年の前歴の一覧だ。"}, {"t": 531.8833333333333, "x": "1回目は1955年6月。"}, {"t": 534.4, "x": "ハンドバッグと現金1950円を盗んだ。"}, {"t": 537.3666666666667, "x": "2回目は3か月後で、図書館の本を\n8回にわたって持ち出した。"}, {"t": 541.4666666666667, "x": "3回目は年末で、自転車だった。"}, {"t": 543.8833333333333, "x": "家庭裁判所の処分は不処分と審判不開始だった。"}, {"t": 547.3, "x": "なにも無しってこと？"}, {"t": 548.7, "x": "特別の手当ては要らない、という扱いだ。"}, {"t": 551.2333333333333, "x": "4回目が1958年1月で、\n6つの図書館から本を合わせて52冊。"}, {"t": 556.5833333333334, "x": "ここで初めて保護観察になった。"}, {"t": 558.7666666666667, "x": "小松川の事件は、その保護観察の最中に起きた。"}, {"t": 562.2, "x": "検事は言う。「おそるべきことにはこの少年は\nすでに四回の前歴を持っておる」。"}, {"t": 566.7666666666667, "x": "本ばかり盗んでいたのね。"}, {"t": 568.5333333333333, "x": "逮捕の日の記事にも「本のムシ」とある。"}, {"t": 571.7666666666667, "x": "この「4回」はすぐ国の問題になった。"}, {"t": 574.6166666666667, "x": "10月7日の参議院法務委員会で、ある議員が\n聞いている。"}, {"t": 578.1666666666666, "x": "保護観察中に起きたのは事実なのか、と。"}, {"t": 580.9666666666667, "x": "法務省の参事官が答えた。"}, {"t": 582.8833333333333, "x": "単純な窃盗として扱っていた、というものだ。"}, {"t": 585.9166666666666, "x": "「窃盗犯としてはきわめて優秀な保護観察の対象」。"}, {"t": 589.4, "x": "優秀？"}, {"t": 590.5333333333333, "x": "報告ではそういう評価だったという。"}, {"t": 592.6166666666667, "x": "参事官は調べが不十分だったと反省を述べた。"}, {"t": 595.6166666666667, "x": "心と体についての鑑別も、行われていなかったという。"}, {"t": 599.3, "x": "決められた日には必ず保護観察所へ来て、\n近況を報告していた。"}, {"t": 603.5, "x": "頭もよく態度もおだやかで、判定は\n「良」だったと本に書かれている。"}, {"t": 607.9, "x": "愛知法務大臣も同じ日に答えている。"}, {"t": 610.3166666666667, "x": "「四回も警察の門をくぐったような\n者」への処置はどうだったか。"}, {"t": 614.2, "x": "将来に生かしたい、と大臣は言った。"}, {"t": 616.5, "x": "翌年2月5日の衆議院では、\n別の議員が本を読み上げた。"}, {"t": 620.3, "x": "家庭裁判所は3回も機会がありながら\n気づかなかった、という本だ。"}, {"t": 624.4333333333333, "x": "著者は検事と刑務所長の2人だった。"}, {"t": 626.8666666666667, "x": "最高裁判所の家庭局長はこう答えた。"}, {"t": 629.5833333333334, "x": "「その通りでございますので、これについては\n何とも申し上げようがない」。"}, {"t": 633.55, "x": "認めたのね。"}, {"t": 634.7333333333333, "x": "認めた。少年1人の前歴が国会で何度も読まれていく。"}, {"t": 638.5333333333333, "x": "会議録の中で、検事も議員も名前を呼んでいない。"}, {"t": 641.7333333333333, "x": "名前を出さないで話しているの？"}, {"t": 643.7666666666667, "x": "新聞が名前を載せたその秋に、国会は載せなかった。"}, {"t": 647.8, "x": "そのころ少年犯罪はどう見られていたのか。"}, {"t": 650.4, "x": "10月21日の同じ委員会で、\n警察庁の課長が数字を示した。"}, {"t": 654.9, "x": "昭和32年に検挙された少年は14万4506人。"}, {"t": 658.9833333333333, "x": "昭和11年の4万6550人と比べて、およそ3倍だ。"}, {"t": 663.3666666666667, "x": "課長はグラフを見せて、\n戦前戦後の第二の山が来ていると言った。"}, {"t": 667.4666666666667, "x": "3倍はすごいわね。"}, {"t": 668.8833333333333, "x": "全刑法犯に占める少年の割合も上がっていた。"}, {"t": 671.8833333333333, "x": "昭和28年の23パーセントが、\n昭和33年の上半期には27パーセントだ。"}, {"t": 677.5833333333334, "x": "ところが同じ日に、\n最高裁判所の課長が別の見方を出す。"}, {"t": 681.4666666666667, "x": "増えていることは確かに事実だと認めた。"}, {"t": 684.05, "x": "ただ問題はその中身だ、と言う。"}, {"t": 686.1666666666666, "x": "家庭裁判所が受けた事件はおよそ46万件。"}, {"t": 689.3, "x": "そのうち31万件が交通事件で、67パーセントだった。"}, {"t": 693.6666666666666, "x": "3分の2は交通違反ってこと？"}, {"t": 695.85, "x": "そうだ。激増という言い方を、そこで\n分けて考えてほしいと言っている。"}, {"t": 699.9666666666667, "x": "交通を除いた増え方を\n「ゆるやかなカーブ」と課長は表現した。"}, {"t": 703.95, "x": "同じ委員会で、役所ごとに数字の読み方が分かれた。"}, {"t": 707.3166666666667, "x": "世間の心配と数字は、ぴったり重なってはいなかった。"}, {"t": 710.7333333333333, "x": "最高裁判所の課長は、経験から3つの問題も挙げた。"}, {"t": 714.45, "x": "1つ目は、少年の性格の問題だ。"}, {"t": 716.9, "x": "自分の衝動を抑えられない子がいる。"}, {"t": 719.0666666666667, "x": "ここで「小松川の高校生」の事案を例に出している。"}, {"t": 722.4666666666667, "x": "2つ目は家庭の問題で、3つ目は\n学校と職場の問題だった。"}, {"t": 726.5666666666667, "x": "法務省の刑事局長は、警察限りで\n処理された問題少年も数えた。"}, {"t": 731.1166666666667, "x": "昭和32年の統計で、その数は62万4千だという。"}, {"t": 735.4666666666667, "x": "62万？　家庭裁判所に来る手前の子たちね。"}, {"t": 738.6833333333333, "x": "ただ1つの事件の大きさは、数字では小さくならない。"}, {"t": 742.0666666666667, "x": "翌年の春、ある議員はこう言った。"}, {"t": 744.3, "x": "18歳の少年が警官をおそった\n別の事件と並べて、憂慮にたえないと。"}, {"t": 749.55, "x": "年齢の話も、すぐに始まった。"}, {"t": 751.8833333333333, "x": "逮捕から25日後の9月26日、参議院の内閣委員会だ。"}, {"t": 756.3166666666667, "x": "ある議員が少年法の話を持ち出した。"}, {"t": 758.7833333333333, "x": "「小松川高校等に起った事件等から」という前置きだ。"}, {"t": 762.3166666666667, "x": "少年法を18才に下げるべきだという\n意見がある、と言う。"}, {"t": 765.8666666666667, "x": "逮捕からまだ1か月もたってないじゃない。"}, {"t": 768.4, "x": "ただ、この議員は慎重に\n進めるべきだという立場だった。"}, {"t": 771.9, "x": "下げれば解決するという話ではない、と。"}, {"t": 774.5, "x": "検察の側は前から引き下げを主張していた。"}, {"t": 777.3666666666667, "x": "裁判所の側は20歳を守る考えだった。"}, {"t": 780.0166666666667, "x": "10月21日には法務省の刑事局長が論点を並べた。"}, {"t": 783.9333333333333, "x": "年齢を18才未満に下げるかどうかが、まず1つ。"}, {"t": 787.25, "x": "検察官が家庭裁判所の決定に\n不服を言えるかどうかが、もう1つ。"}, {"t": 791.6, "x": "検察が先に事件を見る権利も挙げられている。"}, {"t": 794.5333333333333, "x": "検察と裁判所のけんかみたいね。"}, {"t": 796.85, "x": "局長の言葉では、刑事処分に回る\n事件はわずか3割だった。"}, {"t": 800.85, "x": "それでいいのか、というのが検察の疑問だ。"}, {"t": 803.5, "x": "翌1959年の秋、議員団が\n各地を回った報告も残っている。"}, {"t": 808.2666666666667, "x": "検察と警察は引き下げを強く求めた。"}, {"t": 811.0166666666667, "x": "裁判所の側はそれに反対した。"}, {"t": 813.1833333333333, "x": "衆議院の議員団の報告には、\n年齢別の数字も出てくる。"}, {"t": 816.9, "x": "前の年の犯罪は18才台が頂点で、\n19才台では減っていたという。"}, {"t": 821.5333333333333, "x": "年少の少年の方が、増える傾向だとも書かれている。"}, {"t": 825.0, "x": "下げろと言っている18歳と\n19歳の話とは、少しずれるのね。"}, {"t": 829.3166666666667, "x": "ある地域の数字だから、全国の話にはできない。"}, {"t": 832.4666666666667, "x": "ただ、議論はこの時点でも割れていた。"}, {"t": 834.8333333333334, "x": "意見は対立したまま、法律は変わらなかった。"}, {"t": 837.95, "x": "じゃあ20歳のまま？"}, {"t": 839.25, "x": "そのあと60年以上、20歳のままだ。"}, {"t": 842.4333333333333, "x": "そもそも、なぜ20歳だったのか。"}, {"t": 844.6, "x": "戦前の旧少年法の線は18歳未満だった。"}, {"t": 847.7333333333333, "x": "戦後に全部改正されて20歳未満へ上がる。"}, {"t": 850.4166666666666, "x": "実際に20歳になったのは昭和26年だと、\n弁護士が国会で説明している。"}, {"t": 855.5, "x": "つい7年前の話なのね。"}, {"t": 857.5333333333333, "x": "そうだ。1958年の時点で20歳の線はまだ新しい。"}, {"t": 861.6166666666667, "x": "引き上げた理由も記録が残っている。"}, {"t": 863.85, "x": "20歳ぐらいまでの犯罪が増えて悪質になっている。"}, {"t": 866.85, "x": "だから刑罰より保護で教え直す\n方がいい、という考えだ。"}, {"t": 870.4333333333333, "x": "同じ理由で、今度は下げろって話になったの？"}, {"t": 873.5, "x": "そう見える流れだな。"}, {"t": 874.8, "x": "1959年11月12日、参議院の法務委員会に\n参考人が呼ばれた。"}, {"t": 880.15, "x": "弁護士は外国の例を挙げている。"}, {"t": 882.15, "x": "アメリカの31州は18歳、\nフランスも18歳、イギリスは17歳。"}, {"t": 886.8, "x": "外国は18歳が多いと認めた。"}, {"t": 889.05, "x": "それでも20歳の線は常識的にも納得がいくと述べた。"}, {"t": 892.5833333333334, "x": "少年犯罪を年齢の規定のせいにするのは即断だ、と。"}, {"t": 896.15, "x": "年長少年の事件が世間の声を\n動かしていることも、この人は指摘した。"}, {"t": 900.85, "x": "18歳の線を前にして、国会は結論を出さなかった。"}, {"t": 905.1, "x": "小松川の事件は別の法案の議論にも使われた。"}, {"t": 908.3, "x": "1958年の秋は警職法の国会でもあった。"}, {"t": 912.0333333333333, "x": "けいしょくほう？"}, {"t": 913.1666666666666, "x": "警察官職務執行法だ。"}, {"t": 915.0833333333334, "x": "警察官の権限を広げる改正案に\n大きな反対が起きていた。"}, {"t": 919.0, "x": "10月17日の衆議院本会議で、ある議員が演説した。"}, {"t": 922.8666666666667, "x": "青少年の犯罪の数を挙げて、こう呼びかける。"}, {"t": 925.8166666666667, "x": "あの小松川の事件を諸君は何と考えられますか、と。"}, {"t": 929.4166666666666, "x": "法案の賛成に使ったの？"}, {"t": 931.3166666666667, "x": "演説の中ではそういう形になる。"}, {"t": 933.55, "x": "10月29日の委員会でも、\n賛成の議員が小松川を挙げた。"}, {"t": 937.5833333333334, "x": "警察が見張っておくべき\n少年の例だ、という文脈だった。"}, {"t": 941.2, "x": "一方で反対の側も同じ事件を使った。"}, {"t": 943.8833333333333, "x": "翌年2月、ある議員は法務委員会で言った。"}, {"t": 946.7166666666667, "x": "警職法を変えても、こういう事件は抑えられないと。"}, {"t": 949.7666666666667, "x": "「こういう科学的なる根本対策を立つべきである」。"}, {"t": 952.8833333333333, "x": "同じ事件で賛成にも反対にも使えるのね。"}, {"t": 955.8833333333333, "x": "名前を知らなくても語れる事件になっていた。"}, {"t": 958.5666666666667, "x": "18歳の少年1人が、法律の議論の材料になっていく。"}, {"t": 963.0666666666667, "x": "10月21日の委員会には、もう1つの話がある。"}, {"t": 966.6833333333333, "x": "例の検事が持ち込んだのが犯罪予測の表だった。"}, {"t": 969.9, "x": "犯罪の予測？"}, {"t": 971.15, "x": "アメリカのグリュック夫妻が作った方法だ。"}, {"t": 973.6666666666666, "x": "家庭の様子などから、\n将来の非行の可能性を点数にする。"}, {"t": 977.4, "x": "検事はこの表の的中率を92パーセントと紹介した。"}, {"t": 981.1666666666666, "x": "92パーセントも当たるの？"}, {"t": 983.05, "x": "検事がそう説明した、という記録だ。"}, {"t": 985.55, "x": "日本に合う表を作れば早く手を打てると言っている。"}, {"t": 988.4, "x": "翌年2月には、ある議員がこう言い切った。"}, {"t": 991.0333333333333, "x": "この票を数年早く作っていれば「\n小松川事件は起らなかったはず」。"}, {"t": 995.3, "x": "その年の秋、東京家裁の調査官はこれに異を唱えた。"}, {"t": 998.8166666666667, "x": "この研究だけでは足りない、\nもっと組織的に調べるべきだと。"}, {"t": 1002.6333333333333, "x": "その調査官は、少年のきょうだいは\n非行に走っていないと付け加えた。"}, {"t": 1006.8333333333334, "x": "同じ日に調査官は、外国の長い\n追跡調査も紹介している。"}, {"t": 1010.9333333333333, "x": "少年の非行は、大体23歳を過ぎると\nやむという結果だ。"}, {"t": 1014.8, "x": "別の調査では、16年の追跡で「良い」と\n評価された人の8割は罪を犯していない。"}, {"t": 1020.5333333333333, "x": "「悪い」と評価された人のうち、\n犯罪者になったのは6割だった。"}, {"t": 1024.75, "x": "悪いと言われても、4割は外れるのね。"}, {"t": 1027.25, "x": "同じ家でも違うのね。"}, {"t": 1028.85, "x": "予測は、そう簡単ではないということだ。"}, {"t": 1031.4, "x": "それでも1960年10月の国会で、\nこの件はまだ問われている。"}, {"t": 1035.8333333333333, "x": "ある議員は、少年鑑別所の鑑別が\nずさんだったと厳しく批判した。"}, {"t": 1040.1833333333334, "x": "模範少年のような報告書が出ていた、という言い方だ。"}, {"t": 1043.55, "x": "それでも国は動いた。"}, {"t": 1044.9833333333333, "x": "法務省の設置法を変えて研究の組織を作る案が出た。"}, {"t": 1048.4666666666667, "x": "1959年4月、法務総合研究所という\n名前の機関が生まれる。"}, {"t": 1053.2333333333333, "x": "愛知大臣は国会で、犯罪の原因を\n科学的に調べると説明した。"}, {"t": 1057.75, "x": "動いたのは1つの事件だけのせいではない。"}, {"t": 1060.25, "x": "ただ大臣は、説明のたびに小松川を例に出していた。"}, {"t": 1064.35, "x": "大臣が語った考え方は、もう1つある。"}, {"t": 1067.2333333333333, "x": "保護観察の人手は足りない。対象は多い。"}, {"t": 1069.9333333333334, "x": "千人の少年がいれば、全員を\n同じように見るのは無理だ。"}, {"t": 1073.4, "x": "調べて危ない80人を見つければ、そこに集中できる。"}, {"t": 1077.1166666666666, "x": "80人に絞るの？"}, {"t": 1078.65, "x": "たとえ話としてそう説明している。"}, {"t": 1080.9, "x": "大臣はこれまでのやり方を\n「マンネリズム」とまで呼んだ。"}, {"t": 1084.3166666666666, "x": "役所へ来て顔を見て、大丈夫そうだと\n帰すだけではいけないと。"}, {"t": 1088.0833333333333, "x": "最高裁判所の家庭局長も、\n調査票を全面的に改めると答えた。"}, {"t": 1092.7, "x": "現場の調査官も国会で実情を語っている。"}, {"t": 1095.5333333333333, "x": "小松川の事件には、ほとんど1週間かかりきりだった。"}, {"t": 1099.0666666666666, "x": "一方で裁判官は15分か16分で\n片づけざるを得ないという。"}, {"t": 1103.0166666666667, "x": "少年の事件って、そんなに多かったの？"}, {"t": 1105.7, "x": "裁判官の人数の問題だと調査官は言っている。"}, {"t": 1108.7666666666667, "x": "1961年3月、ある議員が予算の席で数字を出した。"}, {"t": 1113.1166666666666, "x": "保護観察官の増員は、わずか100人。"}, {"t": 1115.7166666666667, "x": "「スズメの涙」という言い方をしている。"}, {"t": 1118.1, "x": "昭和34年度に保護観察を受けた人は14万3470人。"}, {"t": 1122.8333333333333, "x": "そのうち取り消されたのは5パーセントだった。"}, {"t": 1125.45, "x": "じゃあ保護観察そのものは効いているのね。"}, {"t": 1127.95, "x": "議員はその数字を根拠に拡大を求めた。"}, {"t": 1130.6166666666666, "x": "大きな事件1つと、静かな14万人。"}, {"t": 1133.4333333333334, "x": "国会の記録には、その両方が残っている。"}, {"t": 1136.8833333333334, "x": "では、名前の問題はどうなったか。"}, {"t": 1139.0666666666666, "x": "こちらは国会ではなく話し合いの場で動いた。"}, {"t": 1141.75, "x": "論文によると、この事件をきっかけに席が設けられた。"}, {"t": 1145.1833333333334, "x": "間に立ったのは法務省の人権擁護局だ。"}, {"t": 1148.0666666666666, "x": "誰が集まったの？"}, {"t": 1149.4, "x": "新聞協会と最高裁判所の家庭局。"}, {"t": 1152.1, "x": "法務省の刑事局と保護局。"}, {"t": 1154.1, "x": "それに在野の法律家たちだ。"}, {"t": 1156.1, "x": "裁判所と新聞が同じ席に？"}, {"t": 1158.2833333333333, "x": "そうなる。裁判所には8年前の警告のことがある。"}, {"t": 1161.6333333333334, "x": "法律の条文はそのままだ。"}, {"t": 1163.4333333333334, "x": "罰則を足すのではなく、新聞の側が\n決まりを書く形になった。"}, {"t": 1167.45, "x": "1958年12月16日、新聞協会が方針を定める。"}, {"t": 1172.1833333333334, "x": "名前は「少年法第61条の扱いの方針」。"}, {"t": 1175.4833333333333, "x": "事件の発生から、およそ4か月後の日付だ。"}, {"t": 1178.6666666666667, "x": "4か月で決まったのね。"}, {"t": 1180.4166666666667, "x": "秋の国会が年齢でもめている横でだ。"}, {"t": 1182.8833333333334, "x": "方針には、なぜ罰則が無いかも書いてある。"}, {"t": 1185.6166666666666, "x": "報道する側の自主的な規制に任せる趣旨だからだと。"}, {"t": 1189.0166666666667, "x": "だから各社は社会的な責任をいっそう\n自覚すべきだ、という理屈だ。"}, {"t": 1194.0, "x": "方針の中身を見ていこう。"}, {"t": 1195.6333333333334, "x": "未成熟な少年を保護して更生できるようにする。"}, {"t": 1198.5666666666666, "x": "20歳未満の少年の名前と写真は載せるべきではない。"}, {"t": 1201.95, "x": "はっきり決めたのね。"}, {"t": 1203.3666666666666, "x": "ただし例外が2つ書かれた。"}, {"t": 1205.25, "x": "1つ目は、逃げていて凶悪な犯罪を\nくり返すおそれが明らかな場合。"}, {"t": 1209.4333333333334, "x": "2つ目は、指名手配の捜査に協力する場合だ。"}, {"t": 1212.7333333333333, "x": "逃げている間は名前を出してもいいの？"}, {"t": 1215.05, "x": "社会を守る方が強く優先する、という考え方だ。"}, {"t": 1218.4166666666667, "x": "では小松川の場合はどうか。"}, {"t": 1220.1833333333334, "x": "9月1日の夕刊は逮捕の日に出ている。"}, {"t": 1222.8166666666666, "x": "捕まったあとなら、例外の2つには当たらない。"}, {"t": 1225.7, "x": "方針の通りなら、名前は載らなかったことになる。"}, {"t": 1228.7166666666667, "x": "ただし方針にも罰則は無い。"}, {"t": 1230.6, "x": "そのあとも大きな少年事件の\nたびに各紙の対応は分かれた。"}, {"t": 1234.2333333333333, "x": "1988年の事件では週刊誌が実名を載せている。"}, {"t": 1238.2166666666667, "x": "週刊誌の実名には、商業主義だという\n批判もメディアの中から出た。"}, {"t": 1242.5, "x": "新聞の外で、線は破られていった。"}, {"t": 1245.05, "x": "決めても全部は止められなかったのね。"}, {"t": 1247.3833333333334, "x": "止める道具がもともと無い決まりだからな。"}, {"t": 1250.4166666666667, "x": "話を少年に戻そう。"}, {"t": 1252.0, "x": "少年は家庭裁判所から検察官へ送り返された。"}, {"t": 1255.3, "x": "逆送と呼ばれる手続きだ。"}, {"t": 1257.2166666666667, "x": "大人と同じ裁判を受けるってこと？"}, {"t": 1259.5166666666667, "x": "そうなる。起訴されたのは2人の事件だ。"}, {"t": 1262.05, "x": "1959年2月27日、東京地方裁判所が判決を言い渡す。"}, {"t": 1267.2, "x": "死刑だった。"}, {"t": 1268.3333333333333, "x": "18歳で……。"}, {"t": 1269.4833333333333, "x": "少年法の第51条は18歳未満なら\n死刑にしないと定める。"}, {"t": 1273.6666666666667, "x": "少年は犯行の時に18歳だった。"}, {"t": 1276.1333333333334, "x": "つまり、この線の1つ上にいた。"}, {"t": 1278.25, "x": "逮捕された時は18歳、判決の時は19歳だ。"}, {"t": 1281.8166666666666, "x": "のちに国会で別の議員が「普通ならば」と言っている。"}, {"t": 1285.2166666666667, "x": "青少年なら死刑はほとんどない、というのが\nその議員の見方だった。"}, {"t": 1289.1833333333334, "x": "実際には戦後の未成年の死刑は少なくない。"}, {"t": 1292.1, "x": "戦後の少年死刑囚は、2024年までに\n45人という数え方がある。"}, {"t": 1296.8833333333334, "x": "この判決は、その中でも広く知られた1つになった。"}, {"t": 1301.05, "x": "判決の言葉が、また別の議論を呼ぶ。"}, {"t": 1303.6833333333334, "x": "1959年12月、参議院の逓信委員会だ。"}, {"t": 1307.5, "x": "ある議員が2月の朝日新聞の「天声人語」を\n読み上げた。"}, {"t": 1311.2833333333333, "x": "裁判長の言葉として、こう書かれていたという。"}, {"t": 1314.1833333333334, "x": "「被告の残忍性は映画、\nテレビの影響が多いと思われ」。"}, {"t": 1317.5166666666667, "x": "「文学の邪悪な要素だけを\n片寄って吸収したようだ」。"}, {"t": 1320.8666666666666, "x": "テレビのせいって言ったの？"}, {"t": 1322.4666666666667, "x": "新聞の伝えた裁判長の言葉では、そうなる。"}, {"t": 1325.4666666666667, "x": "議員はこれを受けてNHKの番組の責任を質問した。"}, {"t": 1329.1, "x": "天声人語は週刊誌の数字も紹介していたそうだ。"}, {"t": 1332.3, "x": "東京の3つのテレビ局で、土日の2日間に\n画面の中で72人が命を落としたと。"}, {"t": 1337.9833333333333, "x": "数えた人がいるのね。"}, {"t": 1339.5666666666666, "x": "テレビが家に入り始めたころの話だ。"}, {"t": 1342.0666666666666, "x": "一方で少年は図書館の本を\n読みふける生徒でもあった。"}, {"t": 1345.3833333333334, "x": "ゲーテやドストエフスキーを\n愛読していたと伝えられる。"}, {"t": 1348.45, "x": "本を読んだから悪いのか、テレビを見たから悪いのか。"}, {"t": 1351.5, "x": "どちらも確かめようのない話だ。"}, {"t": 1353.75, "x": "理由が分からないと、みんな探したくなるのね。"}, {"t": 1356.6833333333334, "x": "そして探した先に見たいものを見つける。"}, {"t": 1359.1666666666667, "x": "同じ少年が貧しさの話にも映像の話にも使われた。"}, {"t": 1363.5333333333333, "x": "1959年12月28日、\n東京高等裁判所も一審を支持した。"}, {"t": 1368.8166666666666, "x": "二審の判決には、こういう言葉があったという。"}, {"t": 1371.6666666666667, "x": "「洋の東西を問わず国籍のいかんに拘らず」。"}, {"t": 1374.4833333333333, "x": "「人間としての重大な責任を\n問われなければならない」。"}, {"t": 1377.7833333333333, "x": "国籍に関わらず、なのね。"}, {"t": 1379.8666666666666, "x": "ただ、ここは判決文そのものを読めていない。"}, {"t": 1382.6333333333334, "x": "のちの嘆願の文章に引かれた形で分かる部分だ。"}, {"t": 1385.8166666666666, "x": "だから言葉だけを紹介して、これ以上は言わない。"}, {"t": 1388.75, "x": "ここから1960年にかけて事件の見え方が変わっていく。"}, {"t": 1392.7, "x": "逮捕の時は「秀才」「二重人格」の話だった。"}, {"t": 1396.3, "x": "2年たって、別の問いが出てくる。"}, {"t": 1398.45, "x": "この事件を在日朝鮮人の問題として\n考えるとどうなるか。"}, {"t": 1402.3833333333334, "x": "名前は同じでも、見られ方が変わったのね。"}, {"t": 1405.2, "x": "この問いを出したのは学者と文学者だった。"}, {"t": 1408.4833333333333, "x": "1960年8月、少年を助ける会ができた。"}, {"t": 1412.25, "x": "中心になったのは東京都立大学の教授だ。"}, {"t": 1415.2, "x": "発起人には作家の大岡昇平、\n劇作家の木下順二らが並ぶ。"}, {"t": 1419.4666666666667, "x": "署名を集め、嘆願書を作った。"}, {"t": 1421.6833333333334, "x": "9月には声明も出している。"}, {"t": 1423.6, "x": "犯した罪を否定するの？"}, {"t": 1425.3833333333334, "x": "慎重に審理してほしい、という訴えだった。"}, {"t": 1428.05, "x": "文章にはこうある。"}, {"t": 1429.2666666666667, "x": "「少年は孤立した環境の中で\n母国語も、祖国のことも知らず」。"}, {"t": 1433.3333333333333, "x": "「民族的自覚がないままに育ちました」。"}, {"t": 1435.95, "x": "そして日本人としての責任を考えたい、と結んでいる。"}, {"t": 1439.5, "x": "大岡昇平は1960年10月の婦人公論に文章を載せた。"}, {"t": 1443.85, "x": "「社会の一員としての自己の責任」を\nここまで求めるのは酷ではないか。"}, {"t": 1448.3, "x": "大岡昇平って「野火」の人よね？"}, {"t": 1450.8666666666666, "x": "そうだ。戦争を書いた作家がこの裁判に声を上げた。"}, {"t": 1454.2, "x": "吉川英治らも名を連ねたと伝えられている。"}, {"t": 1456.9166666666667, "x": "在日朝鮮人の作家の中にも発言した人がいた。"}, {"t": 1460.45, "x": "少年は日本からも朝鮮からも\n切り離されていた、という見方だ。"}, {"t": 1464.4833333333333, "x": "論文はここを事件の見方が変わった転機としている。"}, {"t": 1467.6166666666666, "x": "ただ、これは支援する側の見方でもある。"}, {"t": 1470.1333333333334, "x": "亡くなった2人と家族の前で軽く言える話ではない。"}, {"t": 1473.9666666666667, "x": "この運動には、もう1つの出来事がある。"}, {"t": 1476.5666666666666, "x": "亡くなった生徒の遺族から、減刑を望む\n申し出があったと伝えられている。"}, {"t": 1481.0333333333333, "x": "えっ、遺族から？"}, {"t": 1482.4, "x": "そう書く本と記事がある。"}, {"t": 1483.9, "x": "どんな思いだったかは、ここでは言わない。"}, {"t": 1486.2166666666667, "x": "この回で触れるのは、ここだけだ。"}, {"t": 1488.2833333333333, "x": "別の動きもあった。"}, {"t": 1489.6333333333334, "x": "少年は無実だと主張する本も、あとになって出ている。"}, {"t": 1493.0166666666667, "x": "物証が十分ではなかった、という主張だ。"}, {"t": 1495.6833333333334, "x": "ただ、少年自身は犯行を認めていた。"}, {"t": 1498.3, "x": "この回はどちらとも言わない。"}, {"t": 1500.1, "x": "判決はそのまま？"}, {"t": 1501.5333333333333, "x": "判決は確定している。それが記録だ。"}, {"t": 1504.7666666666667, "x": "確定までの間、少年は拘置所にいた。"}, {"t": 1507.4666666666667, "x": "そこで続いたのが手紙のやり取りだった。"}, {"t": 1509.9, "x": "相手は在日朝鮮人の女性の記者だ。"}, {"t": 1512.4166666666667, "x": "のちに1963年5月、三一書房から\n1冊の本になって出た。"}, {"t": 1517.2333333333333, "x": "題名は『罪と死と愛と』。"}, {"t": 1519.1666666666667, "x": "本人が書いた手紙なの？"}, {"t": 1520.95, "x": "そうだ。拘置所の中で書いた言葉が残っている。"}, {"t": 1523.9166666666667, "x": "この書簡集について書いた文学者たちもいた。"}, {"t": 1526.7833333333333, "x": "中身には深入りしない。"}, {"t": 1528.2666666666667, "x": "拘置所でカトリックの洗礼も受けたと伝えられている。"}, {"t": 1531.45, "x": "変わっていったのね。"}, {"t": 1532.7833333333333, "x": "そう書く人もいる。"}, {"t": 1534.0166666666667, "x": "ただ、人の心の中は資料では確かめられない。"}, {"t": 1537.1666666666667, "x": "残っているのは書かれた言葉だけだ。"}, {"t": 1539.3833333333334, "x": "世間に名前が出たのは18歳の秋だった。"}, {"t": 1542.1166666666666, "x": "本の表紙に名前が出たのは、もういなくなったあとだ。"}, {"t": 1545.8666666666666, "x": "1961年8月17日、最高裁判所が上告を棄却した。"}, {"t": 1550.9666666666667, "x": "死刑が確定する。"}, {"t": 1552.4166666666667, "x": "8月17日って……。"}, {"t": 1554.1666666666667, "x": "そう。屋上の事件から、ちょうど3年の日だ。"}, {"t": 1557.1, "x": "偶然かどうかは分からない。"}, {"t": 1558.7333333333333, "x": "資料には日付だけが残っている。"}, {"t": 1560.8, "x": "戦後に未成年で死刑が確定した\n人の20人目とする論文もある。"}, {"t": 1565.15, "x": "20人目？　そんなにいたの？"}, {"t": 1567.1333333333334, "x": "少年は21歳になっていた。"}, {"t": 1569.15, "x": "残るのは恩赦と再審という道だった。"}, {"t": 1571.55, "x": "恩赦は刑を軽くする国の手続きだ。"}, {"t": 1573.95, "x": "再審は裁判をやり直す手続きになる。"}, {"t": 1576.4333333333334, "x": "支援する人たちは、その準備を進めていた。"}, {"t": 1579.95, "x": "1962年8月、少年は東京から仙台へ移された。"}, {"t": 1584.3, "x": "当時の東京拘置所には死刑を\n執行する設備が無かった。"}, {"t": 1587.8333333333333, "x": "そのため仙台へ送ることが行われていたという。"}, {"t": 1590.8333333333333, "x": "移されたら、もう……。"}, {"t": 1592.25, "x": "そう受け止められていた。"}, {"t": 1593.6666666666667, "x": "1962年11月16日、宮城刑務所で死刑が執行された。"}, {"t": 1598.6333333333334, "x": "少年は22歳だった。"}, {"t": 1600.45, "x": "18歳の事件から4年なのね。"}, {"t": 1602.7333333333333, "x": "4年と3か月だ。"}, {"t": 1604.15, "x": "支援した人の証言が残っている。"}, {"t": 1606.3666666666666, "x": "恩赦の審議のさなかに、執行が\n決まったと連絡が来たという。"}, {"t": 1610.15, "x": "これは支援する側の証言で、公の記録ではない。"}, {"t": 1613.35, "x": "再審の請求も予定されていた、と伝えられている。"}, {"t": 1616.6, "x": "国はどう言っているの？"}, {"t": 1618.05, "x": "それが国会の記録に残っている。"}, {"t": 1620.8166666666666, "x": "執行から21日後の12月7日だ。"}, {"t": 1623.6166666666666, "x": "衆議院の法務委員会で、ある議員が\n中垣国男 法務大臣に迫った。"}, {"t": 1628.15, "x": "別の死刑囚の執行と並べて、\n少年の名前を挙げている。"}, {"t": 1631.85, "x": "議員はこの2つの執行に\n政治の意図があるのではないかと疑った。"}, {"t": 1635.75, "x": "その中にこういう言葉がある。"}, {"t": 1637.55, "x": "「民族的偏見のまつわりやすい」。"}, {"t": 1639.8166666666666, "x": "少年のことをそう言ったの？"}, {"t": 1641.6, "x": "少年の置かれた立場を、そう言い表したものだ。"}, {"t": 1644.5666666666666, "x": "中垣大臣は、そういう影響は全く無いと答えた。"}, {"t": 1647.95, "x": "関係書類を「精査精読」して決裁したという。"}, {"t": 1651.25, "x": "そして少年についてこう続けた。"}, {"t": 1653.35, "x": "「韓国人ということでございますから、一そう\n恩赦その他の所定の手続を経まして」。"}, {"t": 1658.3, "x": "これ以上の機会を与える制度が\nもう無いと考えて決裁した。"}, {"t": 1661.95, "x": "手続きは全部終わっていた、って答えね。"}, {"t": 1664.55, "x": "支援の側の証言とは食い違って見える。"}, {"t": 1666.9666666666667, "x": "どちらが正しいかは、ここでは決められない。"}, {"t": 1669.5166666666667, "x": "再審についても、やり取りが残っている。"}, {"t": 1672.0666666666666, "x": "議員は、死刑は執行したら\n再審のしようがない、と訴えた。"}, {"t": 1675.8666666666666, "x": "大臣は、再審中でも\n執行はできるというのは議論だと述べた。"}, {"t": 1679.7333333333333, "x": "ただ、実際に決裁する時は努めて\n避けるのが当然だろう、とも答えている。"}, {"t": 1684.5333333333333, "x": "大臣は同じ日に「人の大事な命」とも言っている。"}, {"t": 1687.9833333333333, "x": "少年の前歴が国会で読まれてから4年後のことだ。"}, {"t": 1691.8833333333334, "x": "執行の前後から、少年は別の形で語られていく。"}, {"t": 1695.3833333333334, "x": "事件の翌年には深沢七郎が\n小説『絢爛の椅子』を書いた。"}, {"t": 1699.6333333333334, "x": "1961年3月、木下順二のドラマが\nNHKのテレビで放送された。"}, {"t": 1705.0833333333333, "x": "題名は『口笛が冬の空に』だ。"}, {"t": 1707.6333333333334, "x": "ドラマにもなったのね。"}, {"t": 1709.1333333333334, "x": "この作品では、主人公は人を傷つけずに自ら命を絶つ。"}, {"t": 1713.1333333333334, "x": "現実とは違う結末に作り替えられている。"}, {"t": 1715.9333333333334, "x": "ドラマの少年は、在日朝鮮人であるために\n就職できないという設定だった。"}, {"t": 1720.7666666666667, "x": "作者は支援の会の一員で、そこを\n描こうとしたと論文は見ている。"}, {"t": 1724.8166666666666, "x": "執行と同じ月、1962年11月には\n大江健三郎の『叫び声』も出た。"}, {"t": 1730.6833333333334, "x": "1968年、大島渚が映画『絞死刑』を作った。"}, {"t": 1735.0666666666666, "x": "事件の10年後のことだ。"}, {"t": 1736.85, "x": "映画の題名、かなり強いわね。"}, {"t": 1739.0, "x": "大島は前の年にこんな言い方をしている。"}, {"t": 1741.5, "x": "これまでの作品は、電話をかけたことに\n引っかかっている、と。"}, {"t": 1745.2, "x": "なぜ電話をかけたかに\nこだわるから、だめなんだという。"}, {"t": 1748.3666666666666, "x": "この回の冒頭の話じゃない。"}, {"t": 1750.3666666666666, "x": "そうだ。新聞も小説も、あの電話に理由を探した。"}, {"t": 1753.85, "x": "映画の監督はそこを別の見方で考えた。"}, {"t": 1756.6, "x": "映画には、現実の屋上の風景も\n映し込まれているという。"}, {"t": 1760.2666666666667, "x": "事件の場所をそのまま使ったの？"}, {"t": 1762.4333333333334, "x": "論文によると、現実の場所を\n作り話の中に入れたそうだ。"}, {"t": 1766.25, "x": "論文は作品ごとに少年の像が違うと書いている。"}, {"t": 1769.4166666666667, "x": "新聞の少年と小説の少年と映画の少年。"}, {"t": 1772.4, "x": "どれも本人そのものではない。"}, {"t": 1774.2, "x": "作品に残ったのは作り手の見方だった。"}, {"t": 1776.9, "x": "大江健三郎は、少年を2重に\n切り離された人として書き表した。"}, {"t": 1781.2666666666667, "x": "日本人として教育を受けて朝鮮人の意識から\n離れ、その認識が日本人からも離した、という。"}, {"t": 1787.55, "x": "評論家の秋山駿は、内部の人間の犯罪と呼んだ。"}, {"t": 1791.15, "x": "みんな、別の言葉で説明しているのね。"}, {"t": 1793.9, "x": "言葉の数だけ、説明があった。"}, {"t": 1795.9833333333333, "x": "答えが1つにならなかった証拠でもある。"}, {"t": 1799.15, "x": "では1958年の方針はどうなったか。"}, {"t": 1802.1666666666667, "x": "そのあと長く、そのまま使われ続けた。"}, {"t": 1804.8333333333333, "x": "年齢の議論も、そのあと何度か持ち上がっている。"}, {"t": 1807.8166666666666, "x": "1977年には中間答申が出たが、\n法改正には至らなかった。"}, {"t": 1812.6833333333334, "x": "2000年には、刑事処分ができる年齢が\n16歳以上から14歳以上へ下がった。"}, {"t": 1817.6666666666667, "x": "2015年には選挙権の年齢が18歳になる。"}, {"t": 1820.9, "x": "与党は同じ年の9月に、\n少年法の年齢も下げるよう提言した。"}, {"t": 1825.1, "x": "動いたのは2022年だ。"}, {"t": 1827.0, "x": "少年法が改正されて18歳と19歳の扱いが変わった。"}, {"t": 1830.9166666666667, "x": "民法の成人が18歳になったのに合わせた改正だ。"}, {"t": 1834.3666666666666, "x": "18歳の話、ここで戻ってくるのね。"}, {"t": 1837.1666666666667, "x": "18歳と19歳は「特定少年」と呼ばれることになった。"}, {"t": 1841.1, "x": "少年法の対象からは外れていない。"}, {"t": 1843.3666666666666, "x": "ただ、 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
