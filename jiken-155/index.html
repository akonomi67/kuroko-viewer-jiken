<script>
const D={"name": "155", "file": "155_編集用", "dur": 1914.61665625, "segs": [], "subs": [{"t": 0.0, "x": "1995年7月30日、日曜日の夜のことだ。"}, {"t": 4.116666666666666, "x": "東京都八王子市の大和田町にある\nスーパーで事件が起きた。"}, {"t": 7.633333333333334, "x": "時刻は午後9時15分ごろ。"}, {"t": 9.466666666666667, "x": "店の2階にある事務所で、\n女性の従業員3人が拳銃で殺害された。"}, {"t": 14.1, "x": "3人も亡くなったの？"}, {"t": 15.683333333333334, "x": "そうだ。犯人はいまも逃げたままになっている。"}, {"t": 18.416666666666668, "x": "警視庁はこの事件のページを今も公開している。"}, {"t": 21.35, "x": "最後の更新は2026年7月30日だ。"}, {"t": 24.833333333333332, "x": "31年たっても、まだ続いているのね。"}, {"t": 27.683333333333334, "x": "ページの見出しには、こんな一文が書かれている。"}, {"t": 30.5, "x": "あなたの近くに犯人がいるかもしれません。"}, {"t": 33.15, "x": "亡くなった3人のことは、どう話すの？"}, {"t": 35.78333333333333, "x": "名前や年、亡くなったときの様子は話さない。"}, {"t": 38.53333333333333, "x": "犯人が誰かという話もしない。"}, {"t": 40.7, "x": "今回はこの公開されている\n手がかりを1つずつ読んでいく。"}, {"t": 44.11666666666667, "x": "あわせて国会で語られた記録も年の順に追う。"}, {"t": 64.3, "x": "どんな資料を見ながら話すの？"}, {"t": 66.25, "x": "中心になるのは、警視庁が出している5本のページだ。"}, {"t": 69.58333333333333, "x": "事件の全体を書いた本体のページがまず1本。"}, {"t": 72.46666666666667, "x": "犯人が履いていた靴を説明するページが2本ある。"}, {"t": 75.56666666666666, "x": "残りの2本は、当時の町並みの動画と\n31年目のお知らせだ。"}, {"t": 79.81666666666666, "x": "警察が自分で出している情報なのね。"}, {"t": 82.35, "x": "もう1つは国会の会議録になる。"}, {"t": 84.6, "x": "1995年から2010年までの答弁に、\n何度もこの事件が出てくる。"}, {"t": 89.53333333333333, "x": "最後に警察庁の白書で法律の改正を確かめる。"}, {"t": 93.01666666666667, "x": "新聞や雑誌の記事は使わないの？"}, {"t": 95.28333333333333, "x": "使わない。犯人についての噂話も取り上げない。"}, {"t": 98.48333333333333, "x": "公の記録に残っていることだけを、順番に読んでいく。"}, {"t": 102.6, "x": "あの日はとても暑い日だったと、警視庁は書いている。"}, {"t": 105.71666666666667, "x": "店の近くの北の原公園では盆踊りが開かれていた。"}, {"t": 109.3, "x": "夏祭りの夜だったのね。"}, {"t": 111.13333333333334, "x": "始まりは午後6時。終わったのは午後9時6分ごろだ。"}, {"t": 114.38333333333334, "x": "事件の時刻は、その9分ほどあとになる。"}, {"t": 117.26666666666667, "x": "まだ人が歩いていそうな時間ね？"}, {"t": 119.38333333333334, "x": "ページには盆踊りの終わった\n時刻まで、分単位で書いてある。"}, {"t": 122.81666666666666, "x": "警視庁は、通りかかった人の話を今も求めている。"}, {"t": 126.4, "x": "その近くで事件が起きていたなんて。"}, {"t": 128.73333333333332, "x": "ページの書き方からも、\nその時間の近さが伝わってくる。"}, {"t": 132.35, "x": "祭りの音がやんだばかりの夜に、\n店の2階で事件は起きた。"}, {"t": 136.68333333333334, "x": "お店はどんな場所にあったの？"}, {"t": 138.51666666666668, "x": "住所は八王子市大和田町4丁目26番1号。"}, {"t": 141.86666666666667, "x": "店の名前はスーパーナンペイ大和田店だ。"}, {"t": 144.28333333333333, "x": "JR八王子駅から北東へ、およそ2000メートル。"}, {"t": 147.58333333333334, "x": "八高線の北八王子駅からは、\n西南西へおよそ750メートルになる。"}, {"t": 152.5, "x": "駅から歩けなくもない距離ね。"}, {"t": 154.48333333333332, "x": "西には八王子バイパスが南北に通っている。"}, {"t": 157.26666666666668, "x": "南には国道20号線が東西に走っていた。"}, {"t": 160.33333333333334, "x": "まわりは、住宅と工場がまじり合う土地だった。"}, {"t": 163.38333333333333, "x": "大きな道に挟まれた場所なのね。"}, {"t": 165.63333333333333, "x": "そうだ。ページには地図が2枚ある。"}, {"t": 167.73333333333332, "x": "広い範囲の地図と、店のまわりの細かい地図だ。"}, {"t": 171.38333333333333, "x": "建物のつくりもページに書いてある。"}, {"t": 173.53333333333333, "x": "1階がスーパーの売り場で、2階が事務所だった。"}, {"t": 176.56666666666666, "x": "2階へは店の中から上がるの？"}, {"t": 178.6, "x": "いや、外階段を使う。"}, {"t": 180.31666666666666, "x": "売り場を通らなくても、2階へ上がれたことになる。"}, {"t": 183.33333333333334, "x": "外から人が出入りしても、気づきにくいのね。"}, {"t": 186.26666666666668, "x": "そこは推し量らないでおこう。"}, {"t": 187.8, "x": "書いてあるのは階段の位置だけだ。"}, {"t": 189.81666666666666, "x": "ただ警視庁は、外階段を上り下りする\n人を見なかったかと尋ねている。"}, {"t": 194.18333333333334, "x": "この階段は、呼びかけの中でも\n大事な場所になっている。"}, {"t": 197.58333333333334, "x": "ページには店の全景や、正面からの写真も載っている。"}, {"t": 201.0, "x": "当時のまわりを空から写した写真もある。"}, {"t": 203.51666666666668, "x": "被害の当日に事務所の側を写した写真も1枚ある。"}, {"t": 206.98333333333332, "x": "場所を思い出してもらうための写真なのね。"}, {"t": 210.1, "x": "亡くなった3人は、どんな人たちだったの？"}, {"t": 212.95, "x": "警視庁の書き方をそのまま使う。"}, {"t": 215.13333333333333, "x": "当時は女子高校生だったアルバイトが2人。"}, {"t": 217.7, "x": "それにパートの女性が1人。"}, {"t": 219.3, "x": "合わせて3人の女性だ。"}, {"t": 221.1, "x": "高校生も働いていたのね。"}, {"t": 223.1, "x": "7月の終わりの日曜日に、\n店の仕事をしていた人たちだ。"}, {"t": 226.86666666666667, "x": "警視庁は、3人を無抵抗な女性従業員と書いている。"}, {"t": 230.46666666666667, "x": "抵抗もできなかったということね。"}, {"t": 232.6, "x": "国会の答弁でも、この3人の働き方は\n何度か語られている。"}, {"t": 236.76666666666668, "x": "アルバイトの高校生とパートの女性という言い方だ。"}, {"t": 239.68333333333334, "x": "この回で3人について言うのは、ここまでにしておく。"}, {"t": 242.83333333333334, "x": "3人と家族の人たちのことを\n思いながら、話を進めよう。"}, {"t": 246.78333333333333, "x": "だからこそ、手がかりの話をきちんと聞きたいわ。"}, {"t": 250.43333333333334, "x": "警視庁のページには、少し変わった欄がある。"}, {"t": 253.25, "x": "その年に何があったかを並べた欄だ。"}, {"t": 255.76666666666668, "x": "事件のページに、ほかの出来事を書くの？"}, {"t": 258.43333333333334, "x": "そうだ。1995年の出来事として3つが挙がっている。"}, {"t": 262.4166666666667, "x": "1月17日の阪神淡路大震災。"}, {"t": 265.1, "x": "3月20日の地下鉄サリン事件。"}, {"t": 267.3333333333333, "x": "そして11月23日には、パソコンの新しい\n基本ソフトが発売された。"}, {"t": 272.4166666666667, "x": "大きな出来事がいくつも重なった年なのね。"}, {"t": 275.3, "x": "読んだ人が当時の自分を思い出せるようにしている。"}, {"t": 278.23333333333335, "x": "その年の夏に、自分はどこで何をしていたのか。"}, {"t": 281.46666666666664, "x": "記憶を呼び起こすための欄なのね。"}, {"t": 284.1666666666667, "x": "その月の出来事も書いてある。"}, {"t": 286.06666666666666, "x": "7月1日にPHSのサービスが始まった。"}, {"t": 289.3, "x": "携帯電話の仲間よね？"}, {"t": 291.03333333333336, "x": "そうだ。持ち歩ける電話の新しい仕組みだった。"}, {"t": 293.96666666666664, "x": "同じ月の24日には、ある人気の曲が\n発売されたとも書いてある。"}, {"t": 298.43333333333334, "x": "その夏に流れていた曲なのね。"}, {"t": 300.6666666666667, "x": "歌や道具の話は、季節の記憶に結びつきやすい。"}, {"t": 303.98333333333335, "x": "ページはそこから当日の記憶を\nたぐってほしいと呼びかけている。"}, {"t": 307.65, "x": "曲を聞くと、そのころの夏を思い出すものね。"}, {"t": 310.6666666666667, "x": "31年前の夏を思い出すには、\nこうした手がかりが要る。"}, {"t": 314.95, "x": "さらに細かく、7月30日の出来事まで並んでいる。"}, {"t": 318.75, "x": "その日にあったことまで書いてあるの？"}, {"t": 320.95, "x": "昼間は高校野球の地方予選があった。"}, {"t": 323.4, "x": "西東京大会の決勝と、神奈川大会の試合だ。"}, {"t": 326.78333333333336, "x": "札幌の競馬場でも、レースが行われていた。"}, {"t": 329.8, "x": "夜は何があったの？"}, {"t": 331.23333333333335, "x": "愛知県体育館では、\nプロボクシングの世界タイトルマッチ。"}, {"t": 334.78333333333336, "x": "神宮球場ではプロ野球のヤクルト対巨人。"}, {"t": 337.46666666666664, "x": "豊洲では、人気グループの野外コンサートが\n開かれていた。"}, {"t": 340.9166666666667, "x": "このコンサートは前の日の29日にもあったそうだ。"}, {"t": 344.0833333333333, "x": "テレビで試合を見ていた人もいそうね。"}, {"t": 346.3833333333333, "x": "そうだな。その夜の自分を思い出す糸口になる。"}, {"t": 350.05, "x": "テレビの番組も3つ書いてある。"}, {"t": 352.01666666666665, "x": "大河ドラマと人物を紹介する\n番組、そして日曜の夜の洋画だ。"}, {"t": 356.3666666666667, "x": "ドラマの名前まで書いてあるの？"}, {"t": 358.28333333333336, "x": "ある。さらに当日の番組表そのものも、\nPDFで載せている。"}, {"t": 362.35, "x": "番組表を丸ごと載せるなんて、ずいぶん丁寧ね。"}, {"t": 365.55, "x": "あの夜に何を見ていたか、\n思い出せる人がいるかもしれない。"}, {"t": 369.06666666666666, "x": "見ていた番組が分かれば、\nその夜の居場所も見えてくる。"}, {"t": 372.3333333333333, "x": "その時刻に店の前を通っていた\n人がいるかもしれない。"}, {"t": 375.71666666666664, "x": "ささいな記憶でも、時刻と結びつくのね。"}, {"t": 378.5833333333333, "x": "警視庁が欲しいのは、まさにそういう話だ。"}, {"t": 381.95, "x": "ここからは、警視庁が捜している人の話になる。"}, {"t": 385.21666666666664, "x": "最初は最後に買い物をしたカップルだ。"}, {"t": 387.7, "x": "最後のお客さんがいたのね？"}, {"t": 389.55, "x": "閉店まぎわの午後8時56分に、レジで精算した。"}, {"t": 393.1, "x": "精算のあと、2人は駐車場へ向かった。"}, {"t": 395.76666666666665, "x": "白いセダン型の車に乗ったという情報があるそうだ。"}, {"t": 399.01666666666665, "x": "事件の20分くらい前ね。"}, {"t": 400.98333333333335, "x": "そうなる。精算の時刻が分単位で分かっているわけだ。"}, {"t": 404.3, "x": "何を買ったかも、ページに1つずつ書いてある。"}, {"t": 407.21666666666664, "x": "買った物まで分かっているの？"}, {"t": 409.05, "x": "分かっている。それを全部読み上げてみよう。"}, {"t": 412.1, "x": "青果が88円で、モヤシが45円。"}, {"t": 414.93333333333334, "x": "青果がもう1つで96円。さらに青果が580円。"}, {"t": 418.8833333333333, "x": "野菜や果物を4つ買っているのね。"}, {"t": 421.23333333333335, "x": "そのあとに、お好み焼きが268円。"}, {"t": 424.0833333333333, "x": "焼きそばが228円で、ハムが398円だ。"}, {"t": 427.93333333333334, "x": "全部で7点。税込みの合計は1754円になる。"}, {"t": 431.75, "x": "夕ごはんの買い物みたいね？"}, {"t": 433.6, "x": "そう見えるが、何に使ったかまでは書いていない。"}, {"t": 436.4166666666667, "x": "ただ、この買い物に覚えのある\n人がいるかもしれない。"}, {"t": 439.65, "x": "一緒に食べた家族や友だちもいそうね。"}, {"t": 442.18333333333334, "x": "そういう人の記憶も、手がかりになるかもしれない。"}, {"t": 445.15, "x": "お好み焼きと焼きそばを買った\n夏の夜を思い出せるかどうかだ。"}, {"t": 448.81666666666666, "x": "金額まで1円単位で書いてあるのね。"}, {"t": 451.28333333333336, "x": "そうだ。7点の値段と合計が全部ページに並んでいる。"}, {"t": 455.3666666666667, "x": "そのカップルの見た目は分かっているの？"}, {"t": 457.6666666666667, "x": "2人を見た人の話が載っている。"}, {"t": 459.8333333333333, "x": "男性は身長177センチくらい。"}, {"t": 462.3833333333333, "x": "髪は両サイドを刈り上げたような\n形で、ラフな格好だった。"}, {"t": 466.01666666666665, "x": "女性は肩までのまっすぐな髪。"}, {"t": 467.96666666666664, "x": "黒っぽいワンピースのような服を着ていたという。"}, {"t": 470.65, "x": "けっこう細かく覚えている人がいたのね。"}, {"t": 473.1666666666667, "x": "ただし、2人がどこの誰かは今も分かっていない。"}, {"t": 476.23333333333335, "x": "名乗り出てくれたら、話が進むかもしれないわね。"}, {"t": 479.98333333333335, "x": "そのカップルが、何か関わっているの？"}, {"t": 482.55, "x": "警視庁はそういう書き方はしていない。"}, {"t": 484.78333333333336, "x": "書いているのは、犯人を見ているかも\nしれないという一文だ。"}, {"t": 488.31666666666666, "x": "見ている人として捜しているのね。"}, {"t": 490.56666666666666, "x": "そうだ。最後の客は、\n事件の直前の店を知っている人になる。"}, {"t": 494.6666666666667, "x": "駐車場に止まっていた車や、\nまわりにいた人を見たかもしれない。"}, {"t": 498.51666666666665, "x": "本人は気づかずに、何かを\n目にしている可能性もある。"}, {"t": 501.95, "x": "自分が捜されていると、知らないかもしれないわね。"}, {"t": 505.0833333333333, "x": "だから警視庁は、目撃した\n人の話も同じように求めている。"}, {"t": 509.3, "x": "本人じゃなくても、2人を見た人がいればいいのね。"}, {"t": 512.9833333333333, "x": "次の呼びかけは花火大会の話だ。"}, {"t": 515.55, "x": "花火と事件に、何の関係があるの？"}, {"t": 518.1333333333333, "x": "事件の前に、近くでいくつも\n花火大会が開かれていた。"}, {"t": 521.8, "x": "花火のあとにこの店で買い物をした\n人を、警視庁は捜している。"}, {"t": 525.7333333333333, "x": "まず前の日の7月29日、土曜日。"}, {"t": 528.4166666666666, "x": "隅田川の花火大会が午後6時15分から8時30分まで。"}, {"t": 532.5333333333333, "x": "会場は墨田区と台東区で、\n上がった花火はおよそ2万発。"}, {"t": 536.3, "x": "見た人は95万9千人と書いてある。"}, {"t": 539.1, "x": "ものすごい人出ね。"}, {"t": 540.5166666666667, "x": "同じ29日には立川の花火大会もあった。"}, {"t": 543.6166666666667, "x": "場所は陸上自衛隊の立川駐屯地の滑走路だ。"}, {"t": 546.8166666666667, "x": "店から北東へ6キロあまりで、見物した人は25万人。"}, {"t": 550.7166666666667, "x": "時間は午後7時30分から\n8時50分までで、5096発だった。"}, {"t": 556.2166666666667, "x": "事件の日にも花火はあったの？"}, {"t": 558.2333333333333, "x": "あった。7月30日には西武園ゆうえんちで花火大会。"}, {"t": 561.9666666666667, "x": "店から北東へおよそ14キロで、\n午後8時から30分ほどだ。"}, {"t": 566.0833333333334, "x": "相模川の河川敷では、\n相模原の納涼花火大会があった。"}, {"t": 570.0833333333334, "x": "こちらは南西へおよそ17キロで、8時45分まで。"}, {"t": 573.6833333333333, "x": "町田市の木曽団地では団地祭の花火もあった。"}, {"t": 576.6333333333333, "x": "29日と30日の2日間で、夜8時から9時までだ。"}, {"t": 580.7166666666667, "x": "まわりじゅうで花火が上がっていたのね。"}, {"t": 582.9333333333333, "x": "5つの花火大会の場所と時間が、\nページに表で並んでいる。"}, {"t": 586.6333333333333, "x": "ただし帰りの人の流れまでは書いていない。"}, {"t": 589.7833333333333, "x": "花火のあと、そのスーパーに寄った人を捜すのね？"}, {"t": 592.9833333333333, "x": "そうだ。花火大会が終わった\nあとに、買い物をしていないか。"}, {"t": 596.5666666666667, "x": "心当たりのある人からの連絡を\n待っていると書いてある。"}, {"t": 599.9166666666666, "x": "29日の夜に寄った人も入るのかしら？"}, {"t": 602.75, "x": "ページは事件前の花火大会とだけ書いている。"}, {"t": 605.4, "x": "日にちは分けていない。"}, {"t": 606.7833333333333, "x": "前の晩に寄っただけでも、店の様子を\n覚えているかもしれない。"}, {"t": 610.4166666666666, "x": "そこに見慣れない人がいたかもしれない。"}, {"t": 612.8333333333334, "x": "いつもと違う何かを、見ているかもしれないのね。"}, {"t": 615.8333333333334, "x": "花火の帰りという場面なら思い出しやすい。"}, {"t": 618.35, "x": "警視庁は、その場面から\n思い出してほしいと呼びかけている。"}, {"t": 622.5333333333333, "x": "3つ目の呼びかけは、\n事件の時間帯に近くを通った人だ。"}, {"t": 626.4, "x": "どんなことを見ていたら、知らせればいいの？"}, {"t": 628.9166666666666, "x": "警視庁は例を並べている。まず、\n白い不審な車と不審な人。"}, {"t": 633.0333333333333, "x": "それから店の外階段を上り下りしていた人。"}, {"t": 635.95, "x": "スーパーの敷地から出ていく\n人を見たという話もほしいという。"}, {"t": 639.6, "x": "外階段がここでも出てくるのね。"}, {"t": 641.85, "x": "普段は見かけない人や、見かけない\n車を見たという話も入る。"}, {"t": 645.7666666666667, "x": "駐車場から出てきた人と、車に\n乗り込む人も挙がっている。"}, {"t": 649.65, "x": "白い車は、最後のお客さんの車とは別の話なの？"}, {"t": 653.4333333333333, "x": "そこは書いていない。だから、ここでは結びつけない。"}, {"t": 657.15, "x": "例の中に、もう1つ目を引く項目がある。"}, {"t": 659.8833333333333, "x": "スーパーの敷地の中でたばこを吸っていた人を見た。"}, {"t": 662.9833333333333, "x": "たばこを吸う人まで気にしているのね。"}, {"t": 665.3, "x": "店の敷地で、誰かが立ち止まっていなかったか。"}, {"t": 668.3166666666667, "x": "そういう姿を覚えている人がいないかということだ。"}, {"t": 671.35, "x": "理由は書いてあるの？"}, {"t": 672.7, "x": "書いていない。だから、理由を\n想像で足すのはやめておく。"}, {"t": 676.0166666666667, "x": "どの例の最後にも同じ言葉が添えてある。"}, {"t": 678.4666666666667, "x": "どんなささいなことでも結構です、という言葉だ。"}, {"t": 681.5833333333334, "x": "小さなことでも言ってほしいのね。"}, {"t": 683.6333333333333, "x": "情報はメールでも送れるように、\nページに窓口が付いている。"}, {"t": 687.6666666666666, "x": "ここからは物の手がかりに移る。"}, {"t": 689.6166666666667, "x": "警視庁には、犯人が履いていた\n靴の特徴というページがある。"}, {"t": 693.4666666666667, "x": "靴の跡が残っていたの？"}, {"t": 695.25, "x": "そうだ。現場に靴の跡が残されていた。"}, {"t": 697.8833333333333, "x": "調べた結果、当てはまる\nスニーカーは2種類だと分かった。"}, {"t": 701.45, "x": "2種類にまで絞れたのね。"}, {"t": 703.2666666666667, "x": "さらに、その靴は新品ではなかったという。"}, {"t": 705.9333333333333, "x": "ある程度履きこんだ靴だと分かっている。"}, {"t": 708.3666666666667, "x": "ずっと使っていた靴なのね。"}, {"t": 710.3, "x": "このページは2018年7月17日に更新された。"}, {"t": 714.05, "x": "2種類の靴を、それぞれA社とB社として説明している。"}, {"t": 717.6, "x": "どちらも大きさは26センチだ。"}, {"t": 720.35, "x": "A社の靴は、どんな靴だったの？"}, {"t": 722.6666666666666, "x": "色は黒と白と青など、7色あった。"}, {"t": 725.2166666666667, "x": "主に丸井の各店で、平成2年から3年に売られていた。"}, {"t": 728.9, "x": "値段は7800円だ。"}, {"t": 730.8666666666667, "x": "1990年から91年ごろの靴ね。"}, {"t": 734.15, "x": "そうだ。事件の4年か5年前に売られていたことになる。"}, {"t": 737.5333333333333, "x": "ひも穴は、金属のものが4個と\nプラスチックのものが2個。"}, {"t": 741.1666666666666, "x": "底の上の部分には黒い線が2本入っている。"}, {"t": 743.9666666666667, "x": "かかとには、メーカーの名前が入っていた。"}, {"t": 746.6333333333333, "x": "見た目の特徴がかなりはっきりしているのね。"}, {"t": 749.9, "x": "売れた数も出ている。"}, {"t": 751.1333333333333, "x": "東京と神奈川と埼玉の丸井、\nそれにアメリカ屋靴店の分だ。"}, {"t": 755.1333333333333, "x": "21店舗で439足が売られていた。"}, {"t": 758.3333333333334, "x": "色ごとの数も分かっているの？"}, {"t": 760.2666666666667, "x": "分かっている。白が119足でいちばん多い。"}, {"t": 763.1666666666666, "x": "青が73足で、赤が64足、黒が63足。"}, {"t": 767.2333333333333, "x": "茶色が59足で、緑が35足、黄色が26足だ。"}, {"t": 771.65, "x": "足すと、ちゃんと439足になるのね。"}, {"t": 774.7666666666667, "x": "そうだ。都内では丸井の10の店で売られていた。"}, {"t": 777.6166666666667, "x": "八王子、町田、立川、国分寺、吉祥寺。"}, {"t": 781.0666666666667, "x": "新宿ヤング館、池袋本館、渋谷、上野、錦糸町だ。"}, {"t": 785.15, "x": "ほかに新宿のアメリカ屋靴店でも売られていた。"}, {"t": 788.6666666666666, "x": "もう1つのB社の靴は？"}, {"t": 790.4333333333333, "x": "こちらも26センチ。"}, {"t": 791.8333333333334, "x": "色は黒と白の2色だけだ。"}, {"t": 793.8333333333334, "x": "主にパルコと丸井で、\n平成5年から6年に売られていた。"}, {"t": 797.4333333333333, "x": "値段は1万2000円で、A社より高い。"}, {"t": 800.1666666666666, "x": "事件の1年か2年前の靴なのね。"}, {"t": 802.7333333333333, "x": "ひも穴は金属のものが7個。\nかかとにメーカーの名前が入る。"}, {"t": 806.5666666666667, "x": "売れた数はずっと少ない。"}, {"t": 808.0, "x": "都内の9店舗で19足だ。"}, {"t": 810.0666666666667, "x": "黒が15足で、白が4足になる。"}, {"t": 812.5833333333334, "x": "全国でも49店舗で94足。"}, {"t": 815.1333333333333, "x": "黒が60足で、白が34足だ。"}, {"t": 818.1, "x": "全国で100足もないのね。"}, {"t": 820.0333333333333, "x": "数が少ない分、履いていた人を\n覚えている人がいるかもしれない。"}, {"t": 824.4333333333333, "x": "B社の靴は、都内のどこで売られていたの？"}, {"t": 827.2, "x": "丸井は新宿メンズ館、\n新宿ファッション館、渋谷、錦糸町。"}, {"t": 831.15, "x": "パルコは池袋と渋谷と調布と吉祥寺の4店だ。"}, {"t": 834.45, "x": "ほかにプランタン銀座でも売られていた。"}, {"t": 836.7833333333333, "x": "若い人が服を買いに行く店が多いのね。"}, {"t": 839.4, "x": "そうだな。ただ、それで持ち主の年や\n顔が決まるわけではない。"}, {"t": 843.1666666666666, "x": "警視庁は2つの靴を、立体の画像でも見せている。"}, {"t": 846.45, "x": "A社の7色とB社の2色で、全部で9つの画像だ。"}, {"t": 850.25, "x": "画面の上で靴を回して見られるのね。"}, {"t": 852.6666666666666, "x": "このページは2022年6月23日に更新されている。"}, {"t": 856.55, "x": "機械によっては見られないこともある、と\n注意書きが付いている。"}, {"t": 860.1166666666667, "x": "靴の形を細かいところまで見てほしいのね。"}, {"t": 863.0166666666667, "x": "ひも穴の数や線の本数は、画像で見ればすぐ分かる。"}, {"t": 866.35, "x": "古い写真と見比べるための画像でもあるわけだ。"}, {"t": 869.8, "x": "靴のページの終わりには、こんなお願いがある。"}, {"t": 872.4166666666666, "x": "平成2年から7年ごろの写真やアルバムも見てほしい。"}, {"t": 875.8, "x": "自分の家の写真を見るってこと？"}, {"t": 877.9166666666666, "x": "そうだ。写真の中に、このスニーカーを\n履いた人がいるかもしれない。"}, {"t": 881.9166666666666, "x": "友だちと撮った写真や旅行の写真もあるだろう。"}, {"t": 884.8666666666667, "x": "足元までは、ふつう気にしないものね。"}, {"t": 887.3833333333333, "x": "だからこそ、写真が残っていれば確かめられる。"}, {"t": 890.3666666666667, "x": "見つけたらどんなことでも捜査本部へ、と書いてある。"}, {"t": 893.5333333333333, "x": "押し入れの中に、手がかりが\n眠っているかもしれないのね。"}, {"t": 896.9, "x": "31年たったからこそできる頼み方でもある。"}, {"t": 900.5666666666667, "x": "ここからは国会での記録を見ていこう。"}, {"t": 902.85, "x": "事件から2か月たらずの1995年9月20日。"}, {"t": 906.6166666666667, "x": "参議院の決算委員会で、\n警察庁の生活安全局長が答えた。"}, {"t": 911.1166666666667, "x": "どんなことを話したの？"}, {"t": 912.7, "x": "拳銃などの銃が撃たれた事件の数だ。"}, {"t": 915.1333333333333, "x": "最近は、暴力団どうしの争い\n以外の発砲が増えている。"}, {"t": 918.75, "x": "一般の市民が銃弾の犠牲になる\n例が目立つ、と述べた。"}, {"t": 922.3666666666667, "x": "その例に、八王子の事件が入っていたのね？"}, {"t": 925.35, "x": "そうだ。八王子市内のスーパーの\n女性3名の強盗殺人事件。"}, {"t": 929.3666666666667, "x": "中野区のパチンコ店の売り上げをねらった事件。"}, {"t": 932.0666666666667, "x": "横浜市の釣り具店の路上での強盗殺人事件。"}, {"t": 935.15, "x": "この3つを並べて、銃を使った\n凶悪な事件が続いていると語った。"}, {"t": 940.1166666666667, "x": "その年の発砲は、どれくらいあったの？"}, {"t": 942.65, "x": "答弁の前日までで124回。"}, {"t": 944.8333333333334, "x": "亡くなった人は28人だ。"}, {"t": 946.9333333333333, "x": "銃を撃っての強盗は、前の年が1年で12件。"}, {"t": 950.0333333333333, "x": "この年は9月の時点で14件に達していた。"}, {"t": 953.15, "x": "まだ秋なのに、前の年を超えていたのね。"}, {"t": 955.8333333333334, "x": "その強盗で、4人が亡くなり8人がけがをしている。"}, {"t": 959.0666666666667, "x": "局長は検挙が難しくなっているとも認めた。"}, {"t": 962.05, "x": "124件のうち、検挙できたのは46件だという。"}, {"t": 965.8166666666667, "x": "半分も捕まっていないのね。"}, {"t": 967.7666666666667, "x": "局長は、発砲の回数だけなら昔より少ないとも言った。"}, {"t": 971.5666666666667, "x": "暴力団の抗争が激しかった1985年前後に\n比べれば、減っているという。"}, {"t": 977.0166666666667, "x": "それなら、何が問題だったの？"}, {"t": 979.2333333333333, "x": "問題はその中身だ、と局長は答えている。"}, {"t": 982.1, "x": "銃口が市民の暮らしや会社や言論に\n向けられることが多くなった。"}, {"t": 985.9833333333333, "x": "答弁は、銃が身近な脅威になった\n年の数字を並べている。"}, {"t": 990.3166666666667, "x": "10月2日の衆議院の本会議でも、事件の名前が出た。"}, {"t": 994.0333333333333, "x": "ある議員の代表質問の中だ。"}, {"t": 996.2, "x": "どんな話の流れだったの？"}, {"t": 998.1, "x": "議員はこの年に起きた出来事を並べた。"}, {"t": 1000.5333333333333, "x": "大震災、地下鉄サリン事件、警察庁長官の狙撃事件。"}, {"t": 1004.5666666666667, "x": "そして八王子の\nスーパー強盗殺人事件などの銃の犯罪だ。"}, {"t": 1008.3666666666667, "x": "これで日本の安全神話が大きく\n揺らいでいる、と述べた。"}, {"t": 1011.7666666666667, "x": "安全な国だと思われていたのにね。"}, {"t": 1014.0666666666667, "x": "この事件は、そういう\n年の出来事として国会で語られた。"}, {"t": 1017.7166666666667, "x": "ただし質問の言葉だから、\n議員の見方として聞いておこう。"}, {"t": 1021.9666666666667, "x": "政府は何か手を打ったの？"}, {"t": 1023.6833333333333, "x": "のちの2007年に、内閣府の審議官が説明している。"}, {"t": 1027.4166666666667, "x": "1995年は、銃を使った凶悪な事件が続いた年だった。"}, {"t": 1031.95, "x": "その例として、長官の銃撃事件と\n八王子の事件を挙げた。"}, {"t": 1035.8333333333333, "x": "そこで1995年9月に、閣議の決定で\n銃器対策推進本部ができた。"}, {"t": 1041.3333333333333, "x": "事件の少しあとに作られたのね。"}, {"t": 1043.6333333333334, "x": "本部は銃を取り締まるための要綱を作った。"}, {"t": 1046.2666666666667, "x": "毎年、取り締まりの計画を立てて進めているという。"}, {"t": 1049.6166666666666, "x": "この事件も、きっかけの1つになったのね。"}, {"t": 1052.4666666666667, "x": "答弁では、続いた事件の1つとして\n名前が挙がっている。"}, {"t": 1056.6, "x": "年が明けた1996年2月27日、参議院の法務委員会。"}, {"t": 1061.4666666666667, "x": "法務省の刑事局長が、最近の銃の事件を説明した。"}, {"t": 1065.3666666666666, "x": "法務省からも話があったのね。"}, {"t": 1067.5166666666667, "x": "局長は、かつて日本では\nめったに無かった犯罪だと言った。"}, {"t": 1071.15, "x": "その例に、\n八王子市内のスーパーの事務所の事件を挙げた。"}, {"t": 1074.6833333333334, "x": "女子従業員など3名が射殺されたと説明している。"}, {"t": 1078.0, "x": "大変世間の皆様方に衝撃を与えた\n事件であった、とも述べた。"}, {"t": 1082.4, "x": "半年たっても強く記憶されていたのね。"}, {"t": 1085.05, "x": "局長は警察とよく話し合って、\n検挙に協力していくと結んだ。"}, {"t": 1089.9, "x": "ほかには、どんな事件が挙がったの？"}, {"t": 1092.2, "x": "同じ答弁で、局長は少し\nさかのぼった事件も挙げている。"}, {"t": 1095.8666666666666, "x": "1993年8月に、和歌山市で\n銀行の副頭取が撃たれた事件。"}, {"t": 1100.8166666666666, "x": "1994年9月に、名古屋市で\n銀行の支店長が撃たれた事件だ。"}, {"t": 1105.6, "x": "どちらも銀行の人なのね。"}, {"t": 1107.5, "x": "局長は、この2件はどちらも\n検挙されていないと述べた。"}, {"t": 1110.95, "x": "1995年3月の警察庁長官の狙撃事件も、\n同じ流れで挙がっている。"}, {"t": 1116.55, "x": "解決していない銃の事件が、\nいくつも重なっていたのね。"}, {"t": 1120.2333333333333, "x": "局長は、かつてない\n事態が見られるようになったと語った。"}, {"t": 1123.7333333333333, "x": "八王子の事件は、そうした\n事件の並びの中で語られていた。"}, {"t": 1128.2333333333333, "x": "同じ1996年の6月4日には、\n参議院の小委員会があった。"}, {"t": 1133.0166666666667, "x": "警察庁の生活安全局長が\n前の年1年間の数字を出した。"}, {"t": 1137.3833333333334, "x": "1995年は、全部でどうだったの？"}, {"t": 1140.4, "x": "銃の発砲は168件。"}, {"t": 1142.2666666666667, "x": "34人が亡くなり、33人がけがをした。"}, {"t": 1145.4833333333333, "x": "亡くなった34人のうち14人は一般の人だった。"}, {"t": 1149.0166666666667, "x": "14人も、関係のない人が亡くなっていたのね。"}, {"t": 1152.2, "x": "局長が挙げた例の中にも、\n八王子のスーパーの事件があった。"}, {"t": 1156.0333333333333, "x": "女子高校生を含む女性3人が被害にあった事件だ。"}, {"t": 1159.4333333333334, "x": "そしてこう分析している。"}, {"t": 1161.0666666666666, "x": "今まで銃は脅しの道具だった。"}, {"t": 1163.0, "x": "それがまさに殺傷の道具として使われている。"}, {"t": 1165.8666666666666, "x": "銃の使われ方が変わったと言っているのね。"}, {"t": 1168.55, "x": "発砲の数そのものは、前の年より\n81件減っていたとも述べた。"}, {"t": 1172.8833333333334, "x": "数は減っても中身が重くなった、という見方だ。"}, {"t": 1176.5666666666666, "x": "同じ答弁で、銃の押収の数も出てくる。"}, {"t": 1179.2833333333333, "x": "1995年に押収した銃は1880丁だった。"}, {"t": 1183.5333333333333, "x": "それは多いの？"}, {"t": 1184.6666666666667, "x": "それまでの最高は、1984年の1807丁だった。"}, {"t": 1189.0166666666667, "x": "それを上回る史上最高の数だと述べている。"}, {"t": 1191.75, "x": "そのうち暴力団から押収したのは1396丁だった。"}, {"t": 1195.85, "x": "残りは暴力団以外から見つかったのね。"}, {"t": 1198.5, "x": "そういう計算になる。"}, {"t": 1199.6833333333334, "x": "取り締まりも強めていたわけだ。"}, {"t": 1201.6333333333334, "x": "一方で、局長は情勢はまだまだ厳しいとも言った。"}, {"t": 1204.8666666666666, "x": "1996年も5月末までに発砲が50件あったという。"}, {"t": 1209.05, "x": "そのうち4人が亡くなり、\n一般の人が2人ふくまれていた。"}, {"t": 1212.8166666666666, "x": "八王子の事件も、まだ解決していなかったのよね。"}, {"t": 1216.2166666666667, "x": "そうだ。その年の国会では、\n議員たちもこの事件にふれている。"}, {"t": 1220.7666666666667, "x": "次は1996年5月23日、参議院で\n開かれた地方行政委員会だ。"}, {"t": 1226.2666666666667, "x": "警察法を改める法案を話し合う場だった。"}, {"t": 1229.0166666666667, "x": "ある議員が警察庁の資料の数字を紹介した。"}, {"t": 1232.0333333333333, "x": "どんな数字なの？"}, {"t": 1233.3, "x": "1995年の重要犯罪の検挙率は90.5パーセント。"}, {"t": 1237.6833333333334, "x": "捜査本部を置いた事件の解決率は\n85.5パーセントだった。"}, {"t": 1241.9, "x": "ほとんどの事件は解決していたのね。"}, {"t": 1244.3333333333333, "x": "議員はそのうえで、\n八王子市の拳銃の強盗殺人事件を挙げた。"}, {"t": 1248.3333333333333, "x": "拳銃の使用が、\n市民の身近なところまで来ていると述べている。"}, {"t": 1252.2166666666667, "x": "解決しない側に残った事件なのね。"}, {"t": 1254.8, "x": "10月31日の地方行政委員打合会でも、\n別の議員が述べた。"}, {"t": 1259.4, "x": "八王子のスーパー3人射殺事件がある。"}, {"t": 1261.9833333333333, "x": "凶悪な事件で未解決のものが、\n依然として残っていると。"}, {"t": 1265.7, "x": "どれも議員の言葉だが、\n事件が忘れられていなかったことは分かる。"}, {"t": 1270.25, "x": "1999年7月6日、参議院の法務委員会。"}, {"t": 1274.15, "x": "答弁に立ったのは、警察庁で\n刑事の部門を率いる局長だった。"}, {"t": 1278.3833333333334, "x": "4年たって、銃の犯罪は減ったの？"}, {"t": 1280.9, "x": "逆だった。1998年の銃を使った犯罪は339件。"}, {"t": 1285.8333333333333, "x": "1994年の234件と比べると、105件も増えている。"}, {"t": 1290.6166666666666, "x": "割合にしておよそ45パーセントの増加だ。"}, {"t": 1293.4833333333333, "x": "減るどころか増えていたのね。"}, {"t": 1295.2666666666667, "x": "局長は、一般の市民を対象にした\n銃の犯罪が多いと述べた。"}, {"t": 1299.3166666666666, "x": "その例に、八王子のスーパーの事件をまた挙げている。"}, {"t": 1302.45, "x": "アルバイト中の女子高校生2名と\nパートの主婦の3名だと説明した。"}, {"t": 1306.7833333333333, "x": "4年たっても、例として語られる事件だったのね。"}, {"t": 1310.5333333333333, "x": "次は懸賞金の話だ。"}, {"t": 1312.3333333333333, "x": "2007年10月25日、参議院の内閣委員会。"}, {"t": 1315.9333333333334, "x": "国家公安委員長が新しい仕組みを説明した。"}, {"t": 1318.9833333333333, "x": "どんな仕組みなの？"}, {"t": 1320.2833333333333, "x": "捜査特別報奨金という制度だ。\nこの年の4月1日に始まった。"}, {"t": 1324.8, "x": "未解決の重い事件について、\n情報を出した人にお金を払う。"}, {"t": 1328.7, "x": "きっかけは民間が先に出していた懸賞広告だった。"}, {"t": 1332.0333333333333, "x": "その中から、5件が事件の解決に結びついたという。"}, {"t": 1335.6666666666667, "x": "民間の懸賞金が役に立っていたのね。"}, {"t": 1338.3333333333333, "x": "委員長は、情報の出方が\nかつてのようではないとも述べた。"}, {"t": 1341.7833333333333, "x": "警察とのかかわりを避ける人がいる、という見方だ。"}, {"t": 1344.9833333333333, "x": "そこで国も同じような広告を出すことにした。"}, {"t": 1347.8166666666666, "x": "5月1日の第1回の広告から、\n14件の事件が対象になった。"}, {"t": 1352.4166666666667, "x": "上限は1件につき300万円だ。"}, {"t": 1355.4, "x": "懸賞金を出して、効き目はあったの？"}, {"t": 1357.8666666666666, "x": "委員長は、まだ検挙には至っていないと答えた。"}, {"t": 1360.8, "x": "ただ、警察に届く情報は大きく増えたという。"}, {"t": 1363.7333333333333, "x": "第1回の広告では、前は月に\n10件あまりだった情報が増えた。"}, {"t": 1367.8333333333333, "x": "広告のあとは月に34件になった。"}, {"t": 1370.6166666666666, "x": "3倍くらいに増えたのね。"}, {"t": 1372.35, "x": "委員長は、周りの人からの情報が\n大事だとも述べている。"}, {"t": 1375.8833333333334, "x": "人やものの動きが大きくなって、\n捜査が難しくなっているからだ。"}, {"t": 1379.95, "x": "国境を越えて動く人やものもある、と\n委員長は付け加えた。"}, {"t": 1383.6833333333334, "x": "身近な人の話が、いちばんの手がかりなのね。"}, {"t": 1386.8666666666666, "x": "八王子の事件も、今はこの制度の対象になっている。"}, {"t": 1390.8833333333334, "x": "その制度には、どんな決まりがあるの？"}, {"t": 1393.2166666666667, "x": "警視庁のページに、制度の説明が載っている。"}, {"t": 1396.0833333333333, "x": "重い事件の検挙に結びつく\n情報を出した人に、報奨金を払う。"}, {"t": 1400.3, "x": "払うことを前もって広告するのが特徴だ。"}, {"t": 1403.0333333333333, "x": "上限は原則として300万円。"}, {"t": 1405.2666666666667, "x": "特に必要なときは、1000万円を\n超えない範囲で増やせる。"}, {"t": 1409.0166666666667, "x": "もっと高くできることもあるのね。"}, {"t": 1411.1333333333334, "x": "金額は、検挙にどれだけ\n役立ったかで警察庁が決める。"}, {"t": 1414.7666666666667, "x": "広告の期間は原則1年で、\n延ばしたり縮めたりもできる。"}, {"t": 1418.7166666666667, "x": "決まりはきちんと書いてあるのね。"}, {"t": 1420.6833333333334, "x": "この事件には、ここに民間の懸賞金が加わっている。"}, {"t": 1424.75, "x": "2009年になると、別の問題が近づいていた。"}, {"t": 1428.0666666666666, "x": "別の問題って？"}, {"t": 1429.4333333333334, "x": "時効だ。公訴時効と呼ばれる決まりがあった。"}, {"t": 1432.1333333333334, "x": "決まった年数がたつと、犯人が\n見つかっても裁判にかけられない。"}, {"t": 1436.2833333333333, "x": "この事件は、いつ時効になるはずだったの？"}, {"t": 1439.0166666666667, "x": "2010年の7月30日だ。"}, {"t": 1441.15, "x": "事件からちょうど15年になる日だった。"}, {"t": 1443.7166666666667, "x": "もう1年も残っていなかったのね。"}, {"t": 1445.9666666666667, "x": "そうだ。2009年11月17日、衆議院の法務委員会。"}, {"t": 1450.2, "x": "ある議員が、この事件は来年の7月に時効だと述べた。"}, {"t": 1453.7333333333333, "x": "過去5年に時効を迎えた殺人事件は\n241件、とも言っている。"}, {"t": 1458.15, "x": "20年では990件になるという。"}, {"t": 1460.6833333333334, "x": "議員は、見直しを早く決めてほしいと大臣に求めた。"}, {"t": 1464.0833333333333, "x": "専門家の会議に意見を聞く場面があった。"}, {"t": 1466.6833333333334, "x": "そのときに、早急にと書いてほしかったという。"}, {"t": 1469.65, "x": "急いでほしい理由が、はっきりしていたのね。"}, {"t": 1472.3833333333334, "x": "ほかにも時効が刻々と進んでいる\n事件がある、と議員は述べている。"}, {"t": 1476.9833333333333, "x": "そんなに多くの事件が、時効になっていたの？"}, {"t": 1479.8833333333334, "x": "2010年4月6日の参議院の法務委員会でも、\n数字が出た。"}, {"t": 1483.9166666666667, "x": "ある議員が殺人事件の時効の数を挙げている。"}, {"t": 1486.7333333333333, "x": "2008年が62件で、その前の年が\n58件、その前が54件。"}, {"t": 1491.7833333333333, "x": "1週間に1回は、\n殺人事件の時効が来ているという計算だ。"}, {"t": 1495.9333333333334, "x": "毎週どこかで、裁けなくなる事件があったのね。"}, {"t": 1499.0666666666666, "x": "議員は前の日に、法務省の担当者から\n説明を受けていた。"}, {"t": 1502.75, "x": "一番近いのは7月30日の八王子スーパー事件だと\n聞いたという。"}, {"t": 1507.0333333333333, "x": "議員は、大きく報道された\n事件だけを見ていないかとも問うた。"}, {"t": 1510.8333333333333, "x": "名前の知られていない事件も、\n毎週時効を迎えていたのね。"}, {"t": 1514.55, "x": "同じ年の4月20日には、衆議院でも数字が出た。"}, {"t": 1517.9, "x": "1999年から2008年までの殺人の時効は508件だった。"}, {"t": 1522.8833333333334, "x": "その議員は、被害者の会の人たちの声も\n紹介している。"}, {"t": 1526.5166666666667, "x": "冤罪は望んでいない。"}, {"t": 1527.7, "x": "真犯人を捕まえてほしい、という声だ。"}, {"t": 1530.4166666666667, "x": "本当の犯人をという気持ちなのね。"}, {"t": 1533.2666666666667, "x": "その議員は、どんな立場で話していたの？"}, {"t": 1535.9666666666667, "x": "議員は、法案の前に多くの人から\n話を聞いたと述べている。"}, {"t": 1539.7, "x": "犯罪の被害者の会や、交通事故の遺族の会の人たち。"}, {"t": 1543.3833333333334, "x": "弁護士の団体からも話を聞いたという。"}, {"t": 1546.0, "x": "いろいろな立場の人の声を集めたのね。"}, {"t": 1548.5666666666666, "x": "この法案は、参議院で先に審議されていた。"}, {"t": 1551.45, "x": "議員の会派は、参議院で賛成していたと述べている。"}, {"t": 1554.6833333333334, "x": "法務大臣は、提案の理由として\n遺族の声を挙げていた。"}, {"t": 1558.1, "x": "人の命を奪った罪は、より長く\n責任を問うべきだという声だ。"}, {"t": 1562.3, "x": "国民の間でも、そういう考えが広がっていたのね。"}, {"t": 1565.7166666666667, "x": "議員はそう紹介した。"}, {"t": 1567.2, "x": "そのうえで、八王子の事件の期限にふれていた。"}, {"t": 1570.8, "x": "4月6日の委員会では、法務大臣も答えている。"}, {"t": 1574.1166666666666, "x": "何を聞かれたの？"}, {"t": 1575.4, "x": "今のままなら、次に時効になる大きな事件はどれか。"}, {"t": 1578.65, "x": "大臣は、一番近いのは\n八王子市内のスーパーの事件だと答えた。"}, {"t": 1582.9, "x": "スーパーマーケットの事務所で\n女性3名が射殺された事件だ。"}, {"t": 1586.5166666666667, "x": "時効の完成は、2010年の7月30日になる。"}, {"t": 1590.2333333333333, "x": "あと4か月もなかったのね。"}, {"t": 1592.1333333333334, "x": "大臣はほかに、2つの事件の時効の日も挙げた。"}, {"t": 1595.3333333333333, "x": "葛飾区の大学生の事件は2011年の9月。"}, {"t": 1598.7666666666667, "x": "世田谷の一家の事件は、2015年の12月31日だった。"}, {"t": 1603.3, "x": "どれも、まだ犯人が見つかっていない事件ね。"}, {"t": 1606.7666666666667, "x": "4月20日の衆議院の法務委員会では、\n国家公安委員長が答えた。"}, {"t": 1611.2, "x": "警察の側の考えを話したのね。"}, {"t": 1613.6166666666666, "x": "時効が無くなれば、証拠を\n何十年も残す体制が要ると言った。"}, {"t": 1617.5166666666667, "x": "最初の捜査で証拠をきちんと集め、\nいつでも鑑定できる形で残す。"}, {"t": 1621.8833333333334, "x": "法案の裏には、\nDNA鑑定への信頼の高まりがあるとも述べた。"}, {"t": 1626.0833333333333, "x": "どうやって残すの？"}, {"t": 1627.4166666666667, "x": "各県の科学捜査研究所には、\nマイナス80度の冷凍庫がある。"}, {"t": 1631.5833333333333, "x": "さらに千数百の警察署に、マイナス\n20度で保てる冷凍庫を配る。"}, {"t": 1635.9166666666667, "x": "その年の予算で手配したと述べている。"}, {"t": 1638.3, "x": "そして、法案が早く成立すれば\n八王子のスーパーの時効は無くなる。"}, {"t": 1642.5166666666667, "x": "早速もう一度洗い直しをする、と約束した。"}, {"t": 1645.6833333333334, "x": "捜査本部はどうなるの？"}, {"t": 1647.2666666666667, "x": "解決しない限り、捜査本部は\n解散しないと答えている。"}, {"t": 1650.9, "x": "何年に1度見直すかという\n議論も、始めていると付け加えた。"}, {"t": 1655.4166666666667, "x": "法律はその1週間後に成立した。"}, {"t": 1657.7833333333333, "x": "警察庁の白書に、くわしい説明がある。"}, {"t": 1660.5, "x": "2010年4月27日、刑法と\n刑事訴訟法を改める法律が成立した。"}, {"t": 1665.7, "x": "同じ日に公布されて、その日のうちに施行された。"}, {"t": 1668.9333333333334, "x": "成立した日に、もう効き目が出たのね。"}, {"t": 1671.5333333333333, "x": "人を死なせた罪で、いちばん重い刑が死刑のもの。"}, {"t": 1674.7, "x": "殺人罪などは公訴時効が無くなった。"}, {"t": 1677.05, "x": "改正の前は25年だった。"}, {"t": 1679.05, "x": "ほかの重い罪も、時効の年数が延びている。"}, {"t": 1681.8833333333334, "x": "無期の刑が上限の罪は、15年から30年になった。"}, {"t": 1685.5333333333333, "x": "傷害致死のように上限が20年の罪は、\n10年から20年になった。"}, {"t": 1689.9333333333334, "x": "ただし、入らない罪もある。"}, {"t": 1691.75, "x": "殺人未遂や放火のように、人が亡くなっていない罪だ。"}, {"t": 1695.4, "x": "前に起きた事件には、どうなるの？"}, {"t": 1697.65, "x": "施行の時点で時効が来ていなければ、\n新しい決まりが当てはまる。"}, {"t": 1701.5, "x": "八王子の事件の時効は、7月30日の予定だった。"}, {"t": 1705.2166666666667, "x": "施行の日はその94日前にあたる。"}, {"t": 1707.85, "x": "3か月ほどの差で、間に合ったのね。"}, {"t": 1710.85, "x": "時効が無くなって、何が変わったの？"}, {"t": 1713.3, "x": "犯人が見つかれば、何年たっても裁判にかけられる。"}, {"t": 1716.7666666666667, "x": "警察はずっと調べ続けられるのね。"}, {"t": 1719.1833333333334, "x": "そうだ。警視庁の特別捜査本部も、\n今も八王子警察署にある。"}, {"t": 1723.5666666666666, "x": "ページの問い合わせ先にも、その名前が書いてある。"}, {"t": 1726.5333333333333, "x": "正式な呼び名は、\n大和田町スーパー事務所内けん銃使用強盗殺人事件。"}, {"t": 1731.2666666666667, "x": "長い名前ね。場所と中身が全部入っているのね。"}, {"t": 1734.4833333333333, "x": "時効が無くなった今も、その名前で\n呼びかけが続いている。"}, {"t": 1737.9833333333333, "x": "ただし、期限が無いことと解決が近いことは別の話だ。"}, {"t": 1742.3666666666666, "x": "警視庁は呼びかけの形も変えてきた。"}, {"t": 1744.8166666666666, "x": "2022年4月1日には、\n現場の付近の3D動画を載せている。"}, {"t": 1749.45, "x": "3Dの動画って、どんなもの？"}, {"t": 1751.65, "x": "事件が起きた1995年当時の、\n現場のまわりのイメージだ。"}, {"t": 1755.9, "x": "今の景色とは違う\n当時の町並みを、見せようとしている。"}, {"t": 1759.5, "x": "31年もたてば、町の様子も変わるものね。"}, {"t": 1762.75, "x": "そうだ。当時の記憶を\n呼び起こしてほしい、と書いてある。"}, {"t": 1765.9833333333333, "x": "そして2026年7月30日には、事件は\n31年前というページも作った。"}, {"t": 1771.6333333333334, "x": "こちらにも積極的な情報提供をという一文がある。"}, {"t": 1775.05, "x": "事件の日に合わせて、ページを新しくしたのね。"}, {"t": 1778.1166666666666, "x": "本体のページも、同じ日に更新されている。"}, {"t": 1780.9333333333334, "x": "懸賞金の期間も、この日から新しい1年に入った。"}, {"t": 1785.1166666666666, "x": "いまの懸賞金は、いくらなの？"}, {"t": 1787.25, "x": "2つを合わせて上限600万円だ。"}, {"t": 1789.6166666666666, "x": "1つは警察庁の捜査特別報奨金で、上限300万円。"}, {"t": 1793.8166666666666, "x": "もう1つは捜査に協力する\n会の懸賞金で、こちらも300万円。"}, {"t": 1798.25, "x": "民間の会もお金を出しているのね。"}, {"t": 1800.55, "x": "金額は、検挙にどれだけ役立ったかで決まる。"}, {"t": 1803.4833333333333, "x": "当てはまる人が何人もいれば、分けて支払われる。"}, {"t": 1806.6833333333334, "x": "受け取れない人もいるの？"}, {"t": 1808.3333333333333, "x": "いる。名乗らずに誰か分からない人。"}, {"t": 1810.6, "x": "警察の職員や、事件に関わった本人と仲間も外れる。"}, {"t": 1814.4833333333333, "x": "ほかに、受け取るのが\n世の中の常識に合わない人も外れる。"}, {"t": 1818.1, "x": "期間は2026年7月30日から、2027年7月29日までだ。"}, {"t": 1824.4, "x": "ねえ、今の時点で分かっていることをまとめて？"}, {"t": 1827.2166666666667, "x": "分かった。まず1995年7月30日の午後9時15分ごろ。"}, {"t": 1831.9666666666667, "x": "大和田町のスーパーの2階で、\n女性3人が拳銃で殺害された。"}, {"t": 1836.0333333333333, "x": "近くでは盆踊りが、その9分ほど前に終わっていた。"}, {"t": 1839.3666666666666, "x": "最後の客は午後8時56分に\n精算して、白いセダンに乗った。"}, {"t": 1843.5833333333333, "x": "現場には、2種類のスニーカーに\n当たる靴の跡があった。"}, {"t": 1846.9333333333334, "x": "時効は2010年4月27日の法律で無くなった。"}, {"t": 1850.55, "x": "懸賞金は、国と民間の分を足して600万円までだ。"}, {"t": 1854.3666666666666, "x": "そこまでは警視庁や国の記録で確かめられるのね。"}, {"t": 1857.6333333333334, "x": "次に、まだ分かっていないことを挙げる。"}, {"t": 1859.9166666666667, "x": "犯人が誰なのか。どこから来てどこへ去ったのか。"}, {"t": 1863.0166666666667, "x": "最後の客の2人が誰なのか。"}, {"t": 1865.05, "x": "2種類の靴を誰が履いていたのか。"}, {"t": 1867.35, "x": "いちばん知りたいところが、まだ空白なのね。"}, {"t": 1870.15, "x": "だから警視庁は、どんなささいなことでもと\n頼み続けている。"}, {"t": 1874.4333333333334, "x": "最後に、あの夜の大和田町を思い浮かべてみよう。"}, {"t": 1877.3166666666666, "x": "盆踊りが終わり、まわりの町では\n花火も上がった夜だった。"}, {"t": 1880.8, "x": "スーパーの2階では、3人がその日の仕事をしていた。"}, {"t": 1884.2166666666667, "x": "いつもと同じ夜になるはずだったのね。"}, {"t": 1886.6166666666666, "x": "31年がたち、時効も無くなった。"}, {"t": 1889.25, "x": "それでも犯人はまだ見つかっていない。"}, {"t": 1891.5666666666666, "x": "あの夜に何かを見た人が、\nどこかにいるかもしれないのね。"}, {"t": 1895.15, "x": "古い写真の中に、あの靴が写っているかもしれない。"}, {"t": 1898.3833333333334, "x": "心当たりのある人は、\n警視庁八王子警察署の特別捜査本部へ。"}, {"t": 1902.8166666666666, "x": "電話は、042の621の0110だ。"}, {"t": 1906.4, "x": "亡くなった3人のためにも、\n手がかりが届いてほしいわ。"}, {"t": 1909.85, "x": "八王子スーパー強盗殺人事件の呼びかけは、\n今も続いている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
