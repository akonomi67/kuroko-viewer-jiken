<script>
const D={"name": "153", "file": "153_編集用", "dur": 1873.3333125, "segs": [], "subs": [{"t": 0.0, "x": "1954年1月24日の昼ごろ、東京の飯倉一丁目。"}, {"t": 4.5, "x": "1人の外国人が、停留所で電車を待っていた。"}, {"t": 7.6, "x": "そこへバスが来た。男はふいにバスに乗った。"}, {"t": 10.4, "x": "そばにいた同僚2人は乗らなかった。"}, {"t": 12.733333333333333, "x": "一緒にお昼を食べに行くところだったの？"}, {"t": 15.15, "x": "そうだ。3人とも歩いて昼食に出たところだった。"}, {"t": 18.4, "x": "男はそのまま、二度と職場へ戻らなかった。"}, {"t": 21.4, "x": "どこの人だったの？"}, {"t": 22.85, "x": "ソ連の代表部にいた二等書記官だ。"}, {"t": 25.166666666666668, "x": "名前はラストボロフ。"}, {"t": 26.5, "x": "やがて、アメリカへ渡っていたことが分かる。"}, {"t": 29.183333333333334, "x": "日本の政府はそれを知っていたの？"}, {"t": 31.316666666666666, "x": "知らされなかった。出国の手続きもなかった。"}, {"t": 34.3, "x": "今回は、この書記官が消えた日から始める。"}, {"t": 37.166666666666664, "x": "そのあと日本の中で、何人もの公務員が調べられた。"}, {"t": 40.65, "x": "3人が捕まり、そのうち1人が亡くなっている。"}, {"t": 43.78333333333333, "x": "外国の人が消えて、日本の人が捕まったのね。"}, {"t": 47.2, "x": "そうだ。国会の答弁を日付の順に読んでいく。"}, {"t": 64.3, "x": "あの日の動きは、半年以上たってから\n国会で説明された。"}, {"t": 68.03333333333333, "x": "答えたのは調べを任された警察庁の部長だ。"}, {"t": 71.1, "x": "バスに乗ったあと、どうしたの？"}, {"t": 73.1, "x": "まず昼食をとった。"}, {"t": 74.46666666666667, "x": "それから、知り合いのアメリカ人に連絡した。"}, {"t": 77.23333333333333, "x": "いつ会うか時間を打ち合わせたそうだ。"}, {"t": 79.41666666666667, "x": "その日に連絡をとったのね。"}, {"t": 81.3, "x": "機会を見て抜け出す決意は、もう固めていたという。"}, {"t": 84.36666666666666, "x": "そのあと浴場に入って、店で食事をした。"}, {"t": 87.23333333333333, "x": "約束の時間に約束の場所へ向かった。"}, {"t": 89.85, "x": "そこから、アメリカ人と自動車で去った。"}, {"t": 92.51666666666667, "x": "まるで普通の休日みたいな動きね？"}, {"t": 94.88333333333334, "x": "部長が語ったのはそこまでだった。"}, {"t": 97.0, "x": "この先の細かい道筋は、聞いていないと答えた。"}, {"t": 100.16666666666667, "x": "知っているのは軍用機で国外に\n出たということだけだった。"}, {"t": 104.11666666666666, "x": "二等書記官って、外交官の肩書よね？"}, {"t": 107.06666666666666, "x": "そうだ。だが政府の説明では、表向きの姿だった。"}, {"t": 110.66666666666667, "x": "本当の身分は、ソ連の内務省に属する陸軍の中佐だ。"}, {"t": 114.4, "x": "諜報の仕事をするために、日本へ送られていたという。"}, {"t": 117.73333333333333, "x": "最初から情報を集めに来ていたのね。"}, {"t": 120.16666666666667, "x": "部長は二等書記官という仮装のもとにと言った。"}, {"t": 123.03333333333333, "x": "アメリカ人にも日本人にも近づいていた。"}, {"t": 125.6, "x": "調べていたのはアメリカの事情だけではない。"}, {"t": 128.06666666666666, "x": "日本と外国の関係や、\n日本の国内の事情も対象だった。"}, {"t": 132.18333333333334, "x": "日本のこともしっかり見ていたのね。"}, {"t": 134.38333333333333, "x": "ただし、これが分かったのは亡命のあとだ。"}, {"t": 136.86666666666667, "x": "消えた直後の日本は、まだ何も知らなかった。"}, {"t": 140.4, "x": "1月27日、警視庁に2人のソ連人がやって来た。"}, {"t": 144.21666666666667, "x": "代表部の領事と書記官だ。"}, {"t": 146.08333333333334, "x": "ラストボロフがいなくなったので、\n捜してほしいという依頼だった。"}, {"t": 149.9, "x": "3日もたってから届け出たの？"}, {"t": 151.93333333333334, "x": "そうだ。いなくなった日から3日あとだった。"}, {"t": 154.53333333333333, "x": "警視庁はすぐに手配をした。"}, {"t": 156.35, "x": "当時の公安の課長は、のちに国会でこう答えている。"}, {"t": 159.66666666666666, "x": "それより前には、失跡のことを何も知らなかった。"}, {"t": 162.95, "x": "日本の警察も、本当に知らなかったのね？"}, {"t": 165.9, "x": "課長ははっきりそう言った。"}, {"t": 167.5, "x": "あとで議員から、知っていたのではと\n疑われることになる。"}, {"t": 170.78333333333333, "x": "その話は、後半でまた出てくる。"}, {"t": 173.7, "x": "2月1日、ソ連の代表部が声明を出した。"}, {"t": 176.71666666666667, "x": "議員の質問によると中身はこうだ。"}, {"t": 178.95, "x": "ラストボロフは在日アメリカの諜報部に連れ去られた。"}, {"t": 182.13333333333333, "x": "そして、そこに留め置かれている。"}, {"t": 184.3, "x": "自分で逃げたんじゃなくて、\nさらわれたって言ったのね？"}, {"t": 187.45, "x": "そうだ。代表部は亡命という言葉を使わなかった。"}, {"t": 190.63333333333333, "x": "2月3日、衆議院の外務委員会でも議員が取り上げた。"}, {"t": 194.15, "x": "アメリカが連れ去ったり\n閉じ込めたりしたのなら、大事件だ。"}, {"t": 197.63333333333333, "x": "日本の主権にも関わると議員は述べた。"}, {"t": 200.21666666666667, "x": "逆の見方も、あったのかしら？"}, {"t": 202.38333333333333, "x": "同じ議員が別の説も紹介している。"}, {"t": 204.76666666666668, "x": "アメリカを陥れるために、ソ連側が\n仕組んだ芝居だという話だ。"}, {"t": 208.86666666666667, "x": "どっちの言い分が本当か、まだ分からなかったのね。"}, {"t": 212.05, "x": "この時点では、どちらも確かめられていない。"}, {"t": 215.33333333333334, "x": "そもそもソ連の代表部って、どういう場所なの？"}, {"t": 218.31666666666666, "x": "同じ日に、外務省の政務次官が説明している。"}, {"t": 221.45, "x": "ソ連は日本との平和条約に調印しなかった。"}, {"t": 224.33333333333334, "x": "だから条約が効力を持ったあと、日本は通告した。"}, {"t": 227.68333333333334, "x": "代表部としての公の地位は、もう消えたという通告だ。"}, {"t": 231.23333333333332, "x": "じゃあ大使館ではないのね？"}, {"t": 232.95, "x": "そうだ。外交官としての地位も認めていなかった。"}, {"t": 236.05, "x": "日本の法律の上では普通の外国人という扱いだった。"}, {"t": 239.56666666666666, "x": "それでも実際には、東京に残って暮らしていた。"}, {"t": 242.63333333333333, "x": "その数は、家族を合わせて33人だったという。"}, {"t": 245.91666666666666, "x": "国としては認めていないのに、人はいたのね。"}, {"t": 248.9, "x": "4月には、外務省の条約局長がこう説明した。"}, {"t": 252.3, "x": "代表部が書類を届けに来ても、\n認めないので受け取らずに返す。"}, {"t": 256.23333333333335, "x": "会いに来ても面会を断る。"}, {"t": 258.0, "x": "法律の上では日本の法律がそのまま当てはまる。"}, {"t": 260.95, "x": "ただ国と国の習わしから手心を加えているという。"}, {"t": 264.1666666666667, "x": "認めないけど、強くも出られない相手だったのね。"}, {"t": 267.75, "x": "2月3日の政務次官は、もう1つ答えている。"}, {"t": 270.8333333333333, "x": "新聞に記事が出たので、外務省は\nアメリカ大使館に問い合わせた。"}, {"t": 274.9, "x": "アメリカは何て答えたの？"}, {"t": 276.65, "x": "今のところ、何の情報も\n持っていないという返事だった。"}, {"t": 280.01666666666665, "x": "何か分かれば、すぐに知らせるとも約束したという。"}, {"t": 283.35, "x": "知らないって言ったのね。"}, {"t": 284.8833333333333, "x": "ソ連の側から出ているのも、捜査の願いだけだった。"}, {"t": 288.0833333333333, "x": "外務省には、ほかに確かな材料がなかった。"}, {"t": 291.1333333333333, "x": "日本だけが、蚊帳の外みたいね？"}, {"t": 293.4166666666667, "x": "この日の答弁を見る限り、そう読める。"}, {"t": 296.43333333333334, "x": "2月5日、今度は予算委員会で取り上げられた。"}, {"t": 299.5, "x": "英字の新聞に、2日にわたって記事が出たからだ。"}, {"t": 302.6333333333333, "x": "ラストボロフは日本の官界に深く入り込んでいる。"}, {"t": 305.65, "x": "議員は記事にそう書いてあると紹介した。"}, {"t": 308.18333333333334, "x": "それはアメリカ政府の発表だったの？"}, {"t": 310.53333333333336, "x": "犬養健法務大臣は、そうではないと答えた。"}, {"t": 313.6333333333333, "x": "政府の発表ではなく、AP通信の記事だという。"}, {"t": 316.75, "x": "大臣は記事を読んですぐに調べさせたと言った。"}, {"t": 319.53333333333336, "x": "前の晩と、その朝と、その昼の3度だ。"}, {"t": 322.56666666666666, "x": "3回も聞いたのね。それで？"}, {"t": 324.55, "x": "心当たりになる事実の報告は、まだ来ていない。"}, {"t": 327.6166666666667, "x": "これは中間の報告だと大臣は付け加えた。"}, {"t": 331.06666666666666, "x": "ところが、同じ2月5日に別のことが起きていた。"}, {"t": 334.28333333333336, "x": "これはずっとあとの1983年に\n警察庁の局長が説明している。"}, {"t": 339.05, "x": "外務省の職員だった関係者の1人が、\n警視庁に自首したんだ。"}, {"t": 343.3333333333333, "x": "自分から名乗り出たの？"}, {"t": 344.9166666666667, "x": "そうだ。ラストボロフに情報を\n渡していたと話したという。"}, {"t": 348.3666666666667, "x": "局長はこれがこの事件の始まりだったと述べた。"}, {"t": 351.45, "x": "大臣が報告はないって答えた\n日に、もう動いていたのね。"}, {"t": 355.06666666666666, "x": "答弁と自首の、どちらが先だったかは分からない。"}, {"t": 358.06666666666666, "x": "ただ日付は同じ2月5日だ。"}, {"t": 360.23333333333335, "x": "知らないところで、話が進んでいたのね。"}, {"t": 363.53333333333336, "x": "2月10日、外務委員会で法務省の局長たちが答えた。"}, {"t": 367.26666666666665, "x": "刑事局長はまだ居場所は正確に分からないと言った。"}, {"t": 370.4, "x": "検察庁も警視庁も、国の警察も捜している最中だった。"}, {"t": 374.56666666666666, "x": "港や空港は調べなかったの？"}, {"t": 376.71666666666664, "x": "入国管理局長がそこを答えている。"}, {"t": 379.1, "x": "外国人が日本を出るときは\n出国の証印を受ける決まりがある。"}, {"t": 382.81666666666666, "x": "各地の港に調べさせたが、\nその手続きをした中に彼はいない。"}, {"t": 387.03333333333336, "x": "正式には、日本を出ていないことになるのね。"}, {"t": 389.93333333333334, "x": "書類の上ではまだ日本にいるはずの人だった。"}, {"t": 392.6666666666667, "x": "それでも、もう国内にいないという\nうわさは広がっていた。"}, {"t": 396.53333333333336, "x": "勝手に国を出たら、罪になるんでしょ？"}, {"t": 399.01666666666665, "x": "刑事局長は出入国管理令の25条と\n71条に当たると答えた。"}, {"t": 403.7, "x": "ただし、それ以外の罰の決まりには触れないという。"}, {"t": 406.73333333333335, "x": "もし閉じ込められていたら？"}, {"t": 408.43333333333334, "x": "そのときは閉じ込めた側が罪に問われることになる。"}, {"t": 411.43333333333334, "x": "だが、本当にそうなのかがまだ分からなかった。"}, {"t": 414.3, "x": "入国管理局長はさらにこう答えた。"}, {"t": 416.73333333333335, "x": "外へ出た人を、追いかけて\n連れ戻すほどの問題とは考えていない。"}, {"t": 420.75, "x": "問題になるのはまた日本に入るときだという。"}, {"t": 423.55, "x": "出てしまったら、もう追わないのね。"}, {"t": 425.6666666666667, "x": "この答えはのちに国会で何度も問われることになる。"}, {"t": 429.3666666666667, "x": "2月23日の予算委員会では空気がさらに張りつめた。"}, {"t": 433.0, "x": "議員が政府の中にも\n関係者がいるかのように述べたからだ。"}, {"t": 436.56666666666666, "x": "大臣の中に協力者がいるってこと？"}, {"t": 439.0833333333333, "x": "そう聞こえる言い方だった。"}, {"t": 440.6666666666667, "x": "答えたのは総理の代わりに\n出ていた緒方竹虎副総理だ。"}, {"t": 444.15, "x": "何か根拠がありますでしょうか、と問い返した。"}, {"t": 446.96666666666664, "x": "さらに閣僚が関わっていると\n決めつけるのは軽率だと述べた。"}, {"t": 450.78333333333336, "x": "かなり強く言い返したのね。"}, {"t": 452.65, "x": "新聞に、名前の頭文字が\n出ていたことにも触れている。"}, {"t": 456.03333333333336, "x": "根拠があるなら、\n聞きたださなければならないと言った。"}, {"t": 459.26666666666665, "x": "うわさが、国会まで届いていたのね？"}, {"t": 461.71666666666664, "x": "何も確かめられないまま、話だけが広がっていた。"}, {"t": 465.6666666666667, "x": "次の日、2月24日の外務委員会。"}, {"t": 468.35, "x": "議員が岡崎勝男外務大臣に直接たずねた。"}, {"t": 471.46666666666664, "x": "大臣からはまだ一度も説明を聞いていない、と。"}, {"t": 474.48333333333335, "x": "外務大臣は何て答えたの？"}, {"t": 476.5, "x": "これについては、まだ承知いたしておりません。"}, {"t": 479.0833333333333, "x": "申し上げる材料を持っておりません。"}, {"t": 481.1666666666667, "x": "1か月たっても、外務大臣が知らないのね。"}, {"t": 484.1666666666667, "x": "少なくとも国会ではそう答えた。"}, {"t": 486.3666666666667, "x": "あとで分かるが、この事件は\n外務省の中にまで及んでいた。"}, {"t": 489.8833333333333, "x": "その大臣が半年後に恐縮だと述べることになる。"}, {"t": 493.68333333333334, "x": "3月6日の参議院の予算委員会。"}, {"t": 496.05, "x": "犬養法務大臣が自分のことについて弁明に立った。"}, {"t": 499.45, "x": "法務大臣まで疑われていたの？"}, {"t": 501.6, "x": "議員が思いもよらない話をぶつけたんだ。"}, {"t": 504.1, "x": "法務省には、出入国を扱う入国管理局がある。"}, {"t": 507.5833333333333, "x": "大臣が情報を流して、\n逃がしたのではないかという話だ。"}, {"t": 511.3666666666667, "x": "それはひどい疑いね。"}, {"t": 512.8833333333333, "x": "大臣は全然扱っていないと答えた。"}, {"t": 515.3666666666667, "x": "表向きはもちろん、裏で扱ったこともないという。"}, {"t": 518.4166666666666, "x": "ラストボロフとは、公でも私でもつきあいはない。"}, {"t": 521.5166666666667, "x": "どんなソ連人とも、間接にもつきあいはないと述べた。"}, {"t": 524.9833333333333, "x": "そこまで言わないといけなかったのね。"}, {"t": 527.2, "x": "それほど、うわさが大きくなっていたということだ。"}, {"t": 530.65, "x": "では実際に、政府はいつ事情を知ったのか。"}, {"t": 533.3333333333334, "x": "のちに警察庁の部長が、9月の国会で説明している。"}, {"t": 537.0166666666667, "x": "当時の彼は、公安調査庁で調査を担う部長だった。"}, {"t": 540.5333333333333, "x": "その人が、調べることになったのね？"}, {"t": 543.1, "x": "そうだ。2月10日ごろ、長官から話があったという。"}, {"t": 546.5333333333333, "x": "ラストボロフはすでにアメリカへ移っている。"}, {"t": 548.9166666666666, "x": "アメリカ側に、かなり大事な情報を渡している。"}, {"t": 551.8333333333334, "x": "アメリカは日本の機関と協力する用意がある。"}, {"t": 554.5666666666667, "x": "そう伝えられて、調べを命じられたそうだ。"}, {"t": 557.3333333333334, "x": "2月10日って、国会で分からないって答えた日よね？"}, {"t": 560.7666666666667, "x": "そうだ。同じころ、別の役所には話が届いていた。"}, {"t": 564.2666666666667, "x": "ただそれが表に出るのは半年先になる。"}, {"t": 567.5166666666667, "x": "調べは、国の警察と警視庁と\n公安調査庁が組んで進めた。"}, {"t": 571.6, "x": "何日もかけて、本人の話の裏付けを取っていった。"}, {"t": 575.1666666666666, "x": "どうやって本当かどうかを確かめたの？"}, {"t": 577.5666666666667, "x": "部長は2つの話を突き合わせたと答えた。"}, {"t": 580.35, "x": "1つはラストボロフがアメリカ側に話したことだ。"}, {"t": 583.3833333333333, "x": "もう1つは亡命の直後に警視庁へ自首した人の話だ。"}, {"t": 587.1833333333333, "x": "その2つが合っていたの？"}, {"t": 588.85, "x": "ぴったり合っていたと部長は述べた。"}, {"t": 590.85, "x": "それで、全体として間違いないという\n確信を持ったという。"}, {"t": 594.3166666666667, "x": "ただ細かい時間や場所はまだ\n聞きたいことが残っていた。"}, {"t": 598.25, "x": "7月10日、部長たちは東京をたった。"}, {"t": 600.9166666666666, "x": "向かった先は、アメリカの首都ワシントンだ。"}, {"t": 603.5833333333334, "x": "そこで、ラストボロフ本人に直接会った。"}, {"t": 606.5166666666667, "x": "本人から何を聞いたの？"}, {"t": 608.25, "x": "一番は、自分の意思で国を出たのかどうかだ。"}, {"t": 611.05, "x": "部長はその態度にも疑いの余地はなかったと答えた。"}, {"t": 614.4, "x": "さらわれたわけではなかったということね。"}, {"t": 616.7833333333333, "x": "政府はそう判断した。"}, {"t": 618.3, "x": "中身の細かい点は、捜査中なので言えないとした。"}, {"t": 621.4833333333333, "x": "ただ新しく大事な資料も\nかなり得たと部長は述べている。"}, {"t": 624.75, "x": "部長たちが帰ってきたのは8月1日だった。"}, {"t": 628.3833333333333, "x": "でも、どうして半年も黙っていたの？"}, {"t": 630.9166666666666, "x": "10月の法務委員会で議員も同じことを問いただした。"}, {"t": 634.0666666666667, "x": "部長はいくつかの理由を挙げている。"}, {"t": 636.0666666666667, "x": "まず、本当に自分から出たのかを調べる必要があった。"}, {"t": 639.4833333333333, "x": "次に、アメリカの大使から手紙が届いていた。"}, {"t": 642.5, "x": "手紙には何て書いてあったの？"}, {"t": 644.4333333333333, "x": "自分から出たことは知られたくないという希望だ。"}, {"t": 647.1666666666666, "x": "本人の家族が、ソ連の国内に残っていたからだという。"}, {"t": 650.8666666666667, "x": "家族がひどい目にあうかもしれないのね。"}, {"t": 653.25, "x": "理由がはっきりしない間は、仕返しもされにくい。"}, {"t": 656.2333333333333, "x": "本人はそう考えたと部長は説明した。"}, {"t": 658.8666666666667, "x": "もう1つは長い供述を調べるのに\n日数がかかったことだ。"}, {"t": 663.1166666666667, "x": "8月13日、アメリカ政府が国内で事件を発表した。"}, {"t": 667.0166666666667, "x": "次の日の14日に、日本でも発表があった。"}, {"t": 670.0, "x": "外務省の情報文化局と、公安調査庁の共同の発表だ。"}, {"t": 674.1333333333333, "x": "1日ずれたのは、たまたまなの？"}, {"t": 676.3666666666667, "x": "議員もそこを気にしていた。"}, {"t": 678.0166666666667, "x": "アメリカと歩調を\n合わせすぎではないか、という質問だ。"}, {"t": 681.2, "x": "部長は暦の上で1日ずれるだけだと答えた。"}, {"t": 684.15, "x": "アメリカ側と話し合って、\n同時に出そうと決めたという。"}, {"t": 687.5333333333333, "x": "時差を考えると、ほぼ同じ時間ってことね。"}, {"t": 690.4666666666667, "x": "そうだ。同じ14日に、警視庁は関係者を逮捕した。"}, {"t": 694.1, "x": "これは1983年の警察庁の局長の説明だ。"}, {"t": 698.65, "x": "アメリカに合わせなきゃいけない決まりが、あったの？"}, {"t": 701.5, "x": "議員はまさにそこを疑っていた。"}, {"t": 703.4833333333333, "x": "国と国の約束のようなものがあるのではないか、と。"}, {"t": 706.6333333333333, "x": "部長は自分の知る範囲ではと前置きして答えた。"}, {"t": 709.5666666666667, "x": "一緒にしなければならない特別の理由は、なかった。"}, {"t": 712.7666666666667, "x": "そうした方が、お互いに\n都合がよかったのだろうという。"}, {"t": 716.0166666666667, "x": "外務省の人なら、もっと詳しく知っていそうね。"}, {"t": 719.1666666666666, "x": "部長も外務省から聞いてもらう\n方が正確かもしれないと答えた。"}, {"t": 722.9833333333333, "x": "ただその外務省も10月の時点で\n報告を受けていなかった。"}, {"t": 726.65, "x": "どういうこと？"}, {"t": 727.7666666666667, "x": "外務省の局長が別の委員会でそう答えているんだ。"}, {"t": 730.9666666666667, "x": "検察庁が調べている最中で、\n中身は知らされていなかった。"}, {"t": 735.45, "x": "そもそも、どうしてアメリカへ行こうと思ったの？"}, {"t": 738.2666666666667, "x": "部長は根はもっと深いところにあったと述べた。"}, {"t": 740.9666666666667, "x": "1つはその人の生い立ちだ。"}, {"t": 742.8166666666667, "x": "もう1つは日本で暮らすうちに\n自分の国の体制を疑い始めたことだ。"}, {"t": 747.25, "x": "日本に来て、考えが変わったのね。"}, {"t": 749.6833333333333, "x": "そこへ、ソ連の中で大きな出来事が起きた。"}, {"t": 752.4666666666667, "x": "ベリヤという人物が追放されたんだ。"}, {"t": 754.75, "x": "ラストボロフはこれに強い衝撃を受けたという。"}, {"t": 757.5833333333334, "x": "それで、心が大きく揺れたのね？"}, {"t": 759.8666666666667, "x": "さらに職場の仲間ともうまくいっていなかった。"}, {"t": 762.6, "x": "そこへ、急いで国へ戻れという命令が出た。"}, {"t": 765.3333333333334, "x": "わが身が危ないと感じたのが、\n直接のきっかけだった。"}, {"t": 768.7333333333333, "x": "別のきっかけを書いた雑誌もある、と\n翌年に議員が紹介した。"}, {"t": 772.5833333333334, "x": "1954年1月に来日したスケート団に、\nソ連の内務省の課長がいた。"}, {"t": 777.8166666666667, "x": "それを聞いて、アメリカへ逃れたという筋書きだ。"}, {"t": 780.8, "x": "政府の説明と、雑誌の話があるのね。"}, {"t": 783.6333333333333, "x": "そうだ。雑誌の方も、本人の話として\nそう書いているという。"}, {"t": 788.1166666666667, "x": "日本人はどうやって協力することになったの？"}, {"t": 790.9666666666667, "x": "部長の説明は、ここが一番重い。"}, {"t": 793.3, "x": "近づいた日本人はほとんど全部が同じ経歴だった。"}, {"t": 796.5666666666667, "x": "戦争に負けたとき、ソ連の領内にいた人たちだ。"}, {"t": 799.8333333333334, "x": "そのまま抑留され、向こうで誓約をさせられた。"}, {"t": 802.9, "x": "誓約って、何を約束させられたの？"}, {"t": 805.5666666666667, "x": "ソ連の諜報の仕事に協力するという約束だ。"}, {"t": 808.6166666666667, "x": "断れば、日本へ帰されないかもしれない。"}, {"t": 811.2166666666667, "x": "その心の重さで書いてしまった人が多かったという。"}, {"t": 814.4666666666667, "x": "帰りたい一心だったのね。"}, {"t": 816.2, "x": "部長は帰国してから断った人も相当多いと述べた。"}, {"t": 819.6, "x": "自分から断った人もいたし、\n向こうが近づかなかった人もいた。"}, {"t": 823.6666666666666, "x": "誓約どおりに動いたのはその一部だという説明だ。"}, {"t": 827.3166666666667, "x": "協力した人には、お金が渡されていた。"}, {"t": 830.1833333333333, "x": "どのくらいの額だったの？"}, {"t": 831.85, "x": "部長は記憶がはっきりしないと断ってから答えた。"}, {"t": 834.9833333333333, "x": "少ない人で月に5千円くらい。"}, {"t": 837.1166666666667, "x": "多い人で月に4万円くらいだったという。"}, {"t": 839.6666666666666, "x": "普通は、月に2万円から4万円ほどだった。"}, {"t": 842.7833333333333, "x": "毎月、決まった額を渡していたのね。"}, {"t": 845.4166666666666, "x": "月ぎめで払うやり方だったそうだ。"}, {"t": 847.5666666666667, "x": "特別なものとして、数十万円を\n受け取った人もいたという。"}, {"t": 851.4333333333333, "x": "情報の重さで額が変わったのかしら？"}, {"t": 853.8833333333333, "x": "そこまでは、会議録では語られていない。"}, {"t": 857.0, "x": "意外なことに、日本人は一番の目標ではなかった。"}, {"t": 860.3333333333334, "x": "部長によると主な任務はアメリカ人への工作だった。"}, {"t": 863.6166666666667, "x": "アメリカ人から情報を取ろうとしていたのね？"}, {"t": 866.2833333333333, "x": "そうだ。ただ、なかなか思うようには行かなかった。"}, {"t": 869.3, "x": "本人がそう言っていると部長は説明した。"}, {"t": 871.8666666666667, "x": "たとえば、アメリカ軍に雇われている日本人がいる。"}, {"t": 874.9166666666666, "x": "その人から、アメリカ軍の情報を\n取ろうとしていたという。"}, {"t": 878.4, "x": "日本人を通して、アメリカを見ていたのね。"}, {"t": 881.1166666666667, "x": "部長はそれが罪になるかはさらに検討が要ると述べた。"}, {"t": 884.3166666666667, "x": "危うい事柄にも手を伸ばしていたのは事実だという。"}, {"t": 887.95, "x": "日本で情報を集めていたのはソ連だけだったの？"}, {"t": 890.9333333333333, "x": "10月の法務委員会で議員もそれをたずねた。"}, {"t": 893.6166666666667, "x": "部長は自分の調べとは\n直接つながらないと断って答えた。"}, {"t": 897.4166666666666, "x": "ソ連だけでなく、非常に多くの国の諜報が\nこの国で入り乱れている。"}, {"t": 901.6, "x": "関わる人は100人や150人ではなく、\nもっと多いだろうという。"}, {"t": 905.6166666666667, "x": "日本が、情報戦の舞台になっていたのね。"}, {"t": 908.4666666666667, "x": "部長自身も、国際的な\nスパイの活動舞台だと述べている。"}, {"t": 912.2833333333333, "x": "それなのに、秘密を守る決まりは限られていた。"}, {"t": 915.2333333333333, "x": "在日米軍に関わる法律と、\n国家公務員法の一部だけだ。"}, {"t": 919.35, "x": "それで足りるのかしら？"}, {"t": 920.8166666666667, "x": "部長はまさに検討を要する問題だと答えた。"}, {"t": 924.3, "x": "9月14日、衆議院の外務委員会。"}, {"t": 926.8833333333333, "x": "岡崎外務大臣が今度は謝る側に回った。"}, {"t": 929.8333333333334, "x": "外務省の関係者から、3人の容疑者が出たからだ。"}, {"t": 933.3666666666667, "x": "2月には承知していないって言っていた大臣よね？"}, {"t": 936.3833333333333, "x": "そうだ。大臣は非常に恐縮していると述べた。"}, {"t": 939.3833333333333, "x": "まことに遺憾なことと考えている、とも言った。"}, {"t": 942.3166666666667, "x": "外務省の中では、何か手を打ったの？"}, {"t": 944.8833333333333, "x": "局長と課長を全員集めて、事情を話したという。"}, {"t": 948.1166666666667, "x": "大事な書類は封筒に入れて回す。"}, {"t": 950.25, "x": "タイプライターで写しを取るときの扱いも決める。"}, {"t": 953.05, "x": "そんな細かいところまで、注意するよう求めたそうだ。"}, {"t": 956.35, "x": "書類の回し方から、変えないといけなかったのね。"}, {"t": 960.0333333333333, "x": "同じ日、別の議員がもう1つたずねた。"}, {"t": 962.6833333333333, "x": "3人はどうして容疑者として浮かんだのか。"}, {"t": 965.35, "x": "日本の警察が、前から怪しんでいたの？"}, {"t": 968.0666666666667, "x": "議員もまさにそれを聞いた。"}, {"t": 969.6833333333333, "x": "日本が自分で調べたのか、本人の話から出たのか。"}, {"t": 973.1833333333333, "x": "大臣は自分の役目ではないがと断って答えた。"}, {"t": 976.2333333333333, "x": "差し支えないと思われることだけを言うという。"}, {"t": 978.7666666666667, "x": "ラストボロフの供述をもとに係官がアメリカで調べた。"}, {"t": 982.2166666666667, "x": "その結果、3人に疑いがあるとなって逮捕になった。"}, {"t": 985.7666666666667, "x": "本人の話が、出発点だったのね。"}, {"t": 988.6, "x": "大臣はそう理解していると述べた。"}, {"t": 991.3166666666667, "x": "10月4日には、外務省の情報文化局長が答えている。"}, {"t": 995.0833333333334, "x": "大臣以下、非常に驚き恐縮していたという。"}, {"t": 998.1, "x": "幹部の会議でも、何度もこの話が出たそうだ。"}, {"t": 1001.2833333333333, "x": "一番大事な秘密は、大丈夫だったの？"}, {"t": 1004.0166666666667, "x": "局長は暗号そのものが盗まれる\n心配は今はないと答えた。"}, {"t": 1007.7, "x": "戦争中とは、だいぶ別のやり方を使っているという。"}, {"t": 1010.9666666666667, "x": "ただ読み解いたものが漏れるのは別の話だ。"}, {"t": 1013.6166666666667, "x": "それは規律を引き締めるほかないと局長は述べた。"}, {"t": 1016.7166666666667, "x": "結局は、人の問題ってことね。"}, {"t": 1019.1833333333333, "x": "外務省はそう受け止めていたようだ。"}, {"t": 1021.8833333333333, "x": "10月12日、衆議院の法務委員会。"}, {"t": 1024.5166666666667, "x": "この日の午前の議題は、この事件だった。"}, {"t": 1027.1333333333334, "x": "法務省の刑事局長が捜査の結果を短く答えた。"}, {"t": 1030.5333333333333, "x": "国家公務員を3人検挙した。"}, {"t": 1032.7333333333333, "x": "どんな罪だったの？"}, {"t": 1034.1, "x": "国家公務員法の違反や、\n外国の為替の法律の違反などだ。"}, {"t": 1038.0666666666666, "x": "外務大臣も、法律で問えるのは\n公務員法だけだと言っていた。"}, {"t": 1041.9833333333333, "x": "スパイをしたって罪じゃないのね？"}, {"t": 1043.9833333333333, "x": "当時の日本には、諜報そのものを\n広く罰する法律がなかった。"}, {"t": 1047.9166666666667, "x": "だから、秘密を漏らした公務員として調べたんだ。"}, {"t": 1051.0666666666666, "x": "3人のうち2人は、起訴されて裁判が続いていた。"}, {"t": 1055.0, "x": "残りの1人は、どうなったの？"}, {"t": 1057.05, "x": "刑事局長の答えはひとことだった。"}, {"t": 1059.4, "x": "そのうちの1人は亡くなった。"}, {"t": 1061.3333333333333, "x": "取り調べの途中だったの？"}, {"t": 1063.1333333333334, "x": "政府の答弁には、日にちも場所も出てこない。"}, {"t": 1065.9333333333334, "x": "のちに別の議員が\n検事の取り調べの最中だったと述べている。"}, {"t": 1069.5666666666666, "x": "ただそれは作家が書いたものを引いた話だった。"}, {"t": 1072.5166666666667, "x": "はっきりしているのは亡くなったことだけなのね。"}, {"t": 1075.3166666666666, "x": "そうだ。この回では、その人の名前も言わない。"}, {"t": 1078.2833333333333, "x": "残された家族のことを思えば、それが筋だと考えた。"}, {"t": 1081.75, "x": "同じ委員会で別の議員はこうも述べている。"}, {"t": 1084.2666666666667, "x": "無罪だと言って亡くなった人がいる。"}, {"t": 1086.3833333333334, "x": "保釈されて、本人と会わせろと言っている人もいる。"}, {"t": 1089.6666666666667, "x": "本人って、ラストボロフのこと？"}, {"t": 1091.9333333333334, "x": "そうだ。言い分を確かめる相手は、海の向こうにいた。"}, {"t": 1095.8, "x": "アメリカへ行ったのは\n警察庁の部長たちだけではない。"}, {"t": 1098.8333333333333, "x": "そのあと、検事2人もアメリカに渡っている。"}, {"t": 1101.7166666666667, "x": "何のために行ったの？"}, {"t": 1103.1333333333334, "x": "刑事局長は裁判の証拠を固めるためだと答えた。"}, {"t": 1106.4, "x": "起訴された人たちの、裁判に使う証拠だ。"}, {"t": 1109.3333333333333, "x": "目的は十分に果たしたと局長は述べた。"}, {"t": 1112.2166666666667, "x": "アメリカで日本の検事が調べられるの？"}, {"t": 1114.6666666666667, "x": "アメリカの好意で、日本の法の力がそこまで届いた。"}, {"t": 1118.0166666666667, "x": "局長はある程度そういう形になると説明した。"}, {"t": 1121.0333333333333, "x": "これが、のちに大きな意味を持つことになる。"}, {"t": 1123.6, "x": "緒方副総理は9月に、ほかに特別な手は\n今のところ打っていないと答えていた。"}, {"t": 1129.0833333333333, "x": "少し戻って9月8日、参議院の外務委員会。"}, {"t": 1132.25, "x": "ある議員が強い言葉で政府に迫っていた。"}, {"t": 1134.8166666666666, "x": "日本に住む人は、外国人でも憲法で人権を守られる。"}, {"t": 1138.5666666666666, "x": "その人が、日本の役所に知らせもなく連れて行かれた。"}, {"t": 1141.9666666666667, "x": "これは重大な国の権利の侵害だという。"}, {"t": 1144.6, "x": "アメリカは謝ったんじゃなかったの？"}, {"t": 1146.6833333333334, "x": "議員は遺憾の意では足りないと言った。"}, {"t": 1148.7833333333333, "x": "あくまで陳謝を求めるべきだという主張だ。"}, {"t": 1151.3333333333333, "x": "さらに外国まで公務員を送って\n話を聞くやり方も批判した。"}, {"t": 1155.2166666666667, "x": "なぜ本人を日本に連れて来て、\n調べると言わないのか。"}, {"t": 1158.65, "x": "それができれば、一番早いわね。"}, {"t": 1160.9, "x": "だが、それには条約の壁があった。"}, {"t": 1163.8333333333333, "x": "日米の間には、犯罪人を引き渡す条約がある。"}, {"t": 1167.15, "x": "外務省の条約局長がその中身を説明した。"}, {"t": 1170.2666666666667, "x": "引き渡しを求めるには、2つの条件がある。"}, {"t": 1173.1666666666667, "x": "1つは告訴や告発を受けているか\n有罪の判決を受けていること。"}, {"t": 1177.2, "x": "もう1つは条約に並んだ罪の種類に当たることだ。"}, {"t": 1180.5166666666667, "x": "ラストボロフはどっちに当たるの？"}, {"t": 1182.4666666666667, "x": "局長はどちらにも当たらないと答えた。"}, {"t": 1184.85, "x": "アメリカ軍の機密に関わる罪は、\n条約の一覧に入っていなかった。"}, {"t": 1189.1666666666667, "x": "岡崎大臣も、引き渡しは\n求められないという解釈だと述べた。"}, {"t": 1193.3833333333334, "x": "先に告発しておけば、道はあったんじゃない？"}, {"t": 1196.2833333333333, "x": "議員もそれなら\n道がないわけではなかったはずだと言った。"}, {"t": 1200.0833333333333, "x": "では、許しなく国を出たことはどうなるのか。"}, {"t": 1202.7833333333333, "x": "刑事局長は出入国管理令の違反だと改めて答えた。"}, {"t": 1206.5333333333333, "x": "ただし、日本を出た人を\n連れ戻して罰したことはない。"}, {"t": 1209.9333333333334, "x": "じゃあそのままにするってこと？"}, {"t": 1211.75, "x": "事実上、放っておくほかないと局長は述べた。"}, {"t": 1214.75, "x": "すでに国外へ去った人なので、\n事件として立てていない。"}, {"t": 1218.2, "x": "これまでの慣例に従ったという説明だった。"}, {"t": 1221.1166666666666, "x": "議員はそれで納得したの？"}, {"t": 1222.9666666666667, "x": "いや、それでは日本の法の秩序が\n立たないと強く反発した。"}, {"t": 1226.7833333333333, "x": "局長はこれからもその慣例は\n変えないつもりだと答えた。"}, {"t": 1230.7666666666667, "x": "局長は別の点も挙げた。"}, {"t": 1232.5166666666667, "x": "こうした行いは、一種の政治犯に当たるという。"}, {"t": 1235.4166666666667, "x": "だから、そもそも引き渡しの対象にならない。"}, {"t": 1238.4166666666667, "x": "議員は何て言い返したの？"}, {"t": 1240.1666666666667, "x": "在日米軍に関わる法律の第6条に、\nちゃんと書いてある。"}, {"t": 1243.9, "x": "諜報をした者は、10年以下の懲役だ。"}, {"t": 1246.55, "x": "議員はそう言って、局長の弱腰をなじった。"}, {"t": 1249.4333333333334, "x": "かなり厳しく言われたのね。"}, {"t": 1251.2166666666667, "x": "局長の答えは短かった。"}, {"t": 1253.1166666666666, "x": "条約を改めてもらえれば、\n喜んで引き渡しを受けたい。"}, {"t": 1256.7333333333333, "x": "今の条約のままでは、無理ってことね？"}, {"t": 1259.2833333333333, "x": "答弁はそこで止まっている。"}, {"t": 1261.5833333333333, "x": "同じ日、別の議員はある事件の名前を出した。"}, {"t": 1264.5, "x": "作家の鹿地亘が、行方不明になった事件だ。"}, {"t": 1267.6833333333334, "x": "その事件も、アメリカの機関が関わっていたのよね？"}, {"t": 1271.0, "x": "議員はそう述べている。"}, {"t": 1272.15, "x": "法務委員会は、あの事件を審査していた。"}, {"t": 1274.8666666666666, "x": "そのとき、委員会として決議をしている。"}, {"t": 1277.4333333333334, "x": "飛行機でひそかに外国へ連れ出すようなことは\n二度とあってはならない。"}, {"t": 1281.3, "x": "議員はそれなのにまた起きたと迫った。"}, {"t": 1283.7166666666667, "x": "今度は日本人じゃなくて外国人だったのね。"}, {"t": 1286.6, "x": "議員は外国人でも同じだと述べた。"}, {"t": 1288.9333333333334, "x": "日本にいる外国人の人権も、\n守られなければならない。"}, {"t": 1292.4333333333334, "x": "本人が望んだ場合も、無理に\n連れて行かれる場合もあり得る。"}, {"t": 1295.8666666666666, "x": "それを日本が知らないままでは\n困る、という訴えだった。"}, {"t": 1299.7333333333333, "x": "日本の政府はアメリカに何か言ったの？"}, {"t": 1302.15, "x": "警察庁の部長が、外務省のやり取りを説明している。"}, {"t": 1305.6166666666666, "x": "許可なく出国したのは事実で、非常に遺憾だという。"}, {"t": 1308.9333333333334, "x": "外務省は、文書をやり取りして厳しく抗議した。"}, {"t": 1312.0, "x": "アメリカは1つの約束をしたそうだ。"}, {"t": 1314.3333333333333, "x": "これからは、日本の法令を尊重する。"}, {"t": 1316.7666666666667, "x": "同じようなことが起きたら、\nすぐに日本政府と相談する。"}, {"t": 1320.3833333333334, "x": "二度と、黙って連れて行かないってことね。"}, {"t": 1323.0166666666667, "x": "刑事局長も、アメリカが遺憾の意を表したと述べた。"}, {"t": 1326.3833333333334, "x": "その説明で、ひとまず了承したという。"}, {"t": 1328.9333333333334, "x": "本人の意思に反して連れ去るような\n事件なら、話は別だとも言った。"}, {"t": 1333.2, "x": "そのときはしっかり対策を考えたいという。"}, {"t": 1335.9, "x": "議員はどう受け止めたのかしら？"}, {"t": 1337.8166666666666, "x": "あっさりしすぎではないか、と\n疑問の声が上がっていた。"}, {"t": 1341.5166666666667, "x": "この日、もう1つ問題になった記事がある。"}, {"t": 1344.2333333333333, "x": "AP通信の東京支局長が書いた手記だ。"}, {"t": 1347.0166666666667, "x": "議員は新聞に載ったその中身を紹介した。"}, {"t": 1349.7166666666667, "x": "警視庁の課が、アメリカの機関に頼まれていた。"}, {"t": 1352.7333333333333, "x": "望遠レンズを付けたカメラで、代表部を見張っていた。"}, {"t": 1355.9666666666667, "x": "日本の警察が、アメリカの手伝いをしていたってこと？"}, {"t": 1359.4, "x": "記事にはそう書いてあると議員は述べた。"}, {"t": 1361.5666666666666, "x": "答えたのは当時その課を率いていた課長だ。"}, {"t": 1364.2666666666667, "x": "アメリカの機関から頼まれた事実は、全然ないという。"}, {"t": 1367.7666666666667, "x": "じゃあ見張りはしていなかったの？"}, {"t": 1369.6166666666666, "x": "付近で張り込んだことはある、と課長は認めた。"}, {"t": 1372.4833333333333, "x": "指名手配中の日本人が、代表部に\n出入りするという情報があった。"}, {"t": 1376.5666666666666, "x": "それを確かめるための、独自の捜査だという。"}, {"t": 1379.5, "x": "その犯人って、誰だったの？"}, {"t": 1381.6333333333334, "x": "捜査中なので申し上げかねる、と課長は答えた。"}, {"t": 1384.6833333333334, "x": "警察庁の部長も記事はそのままには\n受け取れないと述べた。"}, {"t": 1388.1166666666666, "x": "自分も、アメリカからの知らせと\n新聞で初めて知ったという。"}, {"t": 1392.3333333333333, "x": "この事件で、日本の何が変わったの？"}, {"t": 1394.8833333333334, "x": "議員も影響はどうだったのかとたずねている。"}, {"t": 1397.35, "x": "部長はとても難しい問題だと前置きした。"}, {"t": 1400.0833333333333, "x": "外交への影響は、自分の専門ではないので\n言いかねるという。"}, {"t": 1403.6333333333334, "x": "ただ国内には1つ変化があったと述べた。"}, {"t": 1406.4166666666667, "x": "どんな変化？"}, {"t": 1407.5666666666666, "x": "何の気なしに協力していた人がいた。"}, {"t": 1410.0166666666667, "x": "そんなことは起きないと、楽観していた人もいた。"}, {"t": 1413.0666666666666, "x": "そうした人たちに、警戒心を与えたという。"}, {"t": 1415.9833333333333, "x": "自分も関わっていたかもしれない、と気づいたのね。"}, {"t": 1419.0833333333333, "x": "部長の言葉からは、そう読み取れる。"}, {"t": 1421.9666666666667, "x": "次の年、1955年6月6日の予算委員会。"}, {"t": 1425.75, "x": "警察庁の長官が、事件の広がりを答えた。"}, {"t": 1428.8833333333334, "x": "ラストボロフは60数人の名前を挙げている。"}, {"t": 1431.7166666666667, "x": "そんなにいたの？"}, {"t": 1432.8666666666666, "x": "そうだ。だが捕まったのは外務省の関係の3人だけだ。"}, {"t": 1436.6166666666666, "x": "残りの人は、どうして捕まらなかったの？"}, {"t": 1439.3833333333334, "x": "長官の答えは検挙する法令がない、だった。"}, {"t": 1442.25, "x": "公務員でなければ、問える罪がなかったんだ。"}, {"t": 1444.9333333333334, "x": "議員は雑誌の記事も紹介している。"}, {"t": 1447.1, "x": "そこには、約50人の日本人の協力者と\n書いてあったという。"}, {"t": 1451.1, "x": "雑誌と長官で、数が違うのね。"}, {"t": 1453.5, "x": "人数も、資料によって食い違っている。"}, {"t": 1456.5833333333333, "x": "同じ質問で、議員はもう1つの話を持ち出した。"}, {"t": 1459.9333333333334, "x": "ラストボロフの側から、ある政党の幹部に\nお金が渡った。"}, {"t": 1463.5166666666667, "x": "雑誌には、本人がそう話したと書いてあるという。"}, {"t": 1466.6666666666667, "x": "それは本当だったの？"}, {"t": 1468.1833333333334, "x": "長官はそういう話を聞いていると答えた。"}, {"t": 1470.7166666666667, "x": "だが、名前も事実も調べている途中だという。"}, {"t": 1473.6166666666666, "x": "まだ確認はしていない、とはっきり述べた。"}, {"t": 1476.3, "x": "じゃあここでも言えないのね。"}, {"t": 1477.9, "x": "確かめられていない話は、話としてだけ置いておく。"}, {"t": 1481.2666666666667, "x": "その政党の名前も、ここでは言わない。"}, {"t": 1484.2166666666667, "x": "結局、バスに乗ってから国を出るまでどこにいたの？"}, {"t": 1487.45, "x": "これはずっとあとの1961年に国会で取り上げられた。"}, {"t": 1491.3333333333333, "x": "ある議員が厚木にあった\nアメリカ軍の機関の名前を挙げた。"}, {"t": 1494.5833333333333, "x": "ラストボロフはアメリカへ立つまでそこに潜んでいた。"}, {"t": 1497.5333333333333, "x": "目撃した人の話で\n明らかになっている、と議員は述べた。"}, {"t": 1501.4166666666667, "x": "政府はそれを認めたの？"}, {"t": 1503.0666666666666, "x": "外務省のアメリカ局長はこう答えた。"}, {"t": 1505.4833333333333, "x": "非常に古いことで、はっきり\nその事実は承知していない。"}, {"t": 1508.8666666666666, "x": "けれども、なかったものと思います。"}, {"t": 1511.2, "x": "知らないけど無かったと思う、って答えなのね。"}, {"t": 1513.9833333333333, "x": "議員は調べに行った人なら聞いているはずだと迫った。"}, {"t": 1517.0833333333333, "x": "消えた24日から3日間、どこにいたかという問いだ。"}, {"t": 1520.3833333333334, "x": "その答えは会議録には出てこない。"}, {"t": 1523.1333333333334, "x": "法律がないなら、作ればいいって\n話にならなかったの？"}, {"t": 1526.6, "x": "なった。ただ、政府の中にも慎重な声があった。"}, {"t": 1529.8166666666666, "x": "緒方副総理は、9月の外務委員会でこう述べている。"}, {"t": 1533.0833333333333, "x": "国の秘密が、まったく知らない間に\n漏れていた事実が確かめられた。"}, {"t": 1537.3333333333333, "x": "戦争が終わったとき、この種の法律は\n17種ほど一度に廃止された。"}, {"t": 1541.6666666666667, "x": "9月30日の内閣委員会ではさらに踏み込んだ。"}, {"t": 1544.9, "x": "そういう法律を1つも持たない独立国はない。"}, {"t": 1547.8, "x": "だから、当然に必要だという考えだ。"}, {"t": 1550.5333333333333, "x": "反対の考えも、あったのね？"}, {"t": 1552.6833333333334, "x": "法務省の刑事局長は戦争中の例を挙げた。"}, {"t": 1555.5833333333333, "x": "当時の厳しい法律で、普通の言論まで封じられた。"}, {"t": 1558.95, "x": "その悪い影響も、かなりあったという。"}, {"t": 1561.2, "x": "取り締まることと、言論を\n守ることの両方を見て研究したい。"}, {"t": 1564.95, "x": "警察庁の部長も国民の自由が\n傷ついてはならないと述べた。"}, {"t": 1568.8666666666666, "x": "同じ政府の中でも、心配の向きが分かれたのね。"}, {"t": 1572.15, "x": "両方の答弁が、同じ年の会議録に並んでいる。"}, {"t": 1576.0166666666667, "x": "1956年2月、事件はアメリカの側から再び動いた。"}, {"t": 1580.35, "x": "ラストボロフが、アメリカの議会で証言したんだ。"}, {"t": 1583.4666666666667, "x": "アメリカで何を話したの？"}, {"t": 1585.2666666666667, "x": "日本の役所の中に手先となった\n人がいたという中身だ。"}, {"t": 1588.8166666666666, "x": "重光外務大臣はその証言は\n新しいものではないと答えた。"}, {"t": 1592.6, "x": "議員はこうも紹介している。"}, {"t": 1594.3, "x": "日本の関係者の名前は、今は明かしていない。"}, {"t": 1597.1333333333334, "x": "だが求められれば、いずれ名前を出すだろう、と。"}, {"t": 1600.1166666666666, "x": "名前が出たら、また大騒ぎね。"}, {"t": 1602.25, "x": "官房長官はそこで1つの数字を挙げた。"}, {"t": 1604.8833333333334, "x": "もし防諜の法律があれば、\n十数人が処分されていただろう。"}, {"t": 1608.65, "x": "つまり、今の法律では処分できないってことね？"}, {"t": 1611.7, "x": "官房長官はそこまでしか言えないと答えた。"}, {"t": 1615.0, "x": "起訴された人たちの裁判はその後どうなったか。"}, {"t": 1617.9, "x": "1967年、法務省の刑事局長が国会で触れている。"}, {"t": 1622.1333333333334, "x": "裁判は東京高裁から最高裁まで進んで確定した。"}, {"t": 1625.8, "x": "何が争いになったの？"}, {"t": 1627.45, "x": "国家公務員法が言う秘密とは、何かという点だ。"}, {"t": 1630.6333333333334, "x": "中身が本当に大事なものだけを言うのか。"}, {"t": 1633.1833333333334, "x": "それとも、国が秘密と指定したものも入るのか。"}, {"t": 1636.4666666666667, "x": "判決は、どっちだったの？"}, {"t": 1638.35, "x": "高裁は、国が指定したものも入ると判断した。"}, {"t": 1641.5166666666667, "x": "配られた書類に秘扱いの印があれば、\nそれで足りるという考えだ。"}, {"t": 1645.6166666666666, "x": "問題になったのは外交の秘密の文書だった。"}, {"t": 1648.5, "x": "有罪は免れないとして、\n最高裁でその判決が確定した。"}, {"t": 1652.6333333333334, "x": "この事件が、あとの裁判の物差しになったのね。"}, {"t": 1655.85, "x": "その後も、国会で何度も引き合いに出されている。"}, {"t": 1659.4333333333334, "x": "もう1つ、この事件が残した先例がある。"}, {"t": 1662.1833333333334, "x": "1976年に、刑事局長がこう説明した。"}, {"t": 1665.85, "x": "外国で日本の捜査の力は、そのままでは使えない。"}, {"t": 1669.2833333333333, "x": "だが、相手の国が承知すれば使える。"}, {"t": 1671.8833333333334, "x": "その例として挙がるのが、この事件なの？"}, {"t": 1674.5, "x": "そうだ。ラストボロフ事件は、その先例だという。"}, {"t": 1677.5666666666666, "x": "検察官が、アメリカで本人から調書をとった。"}, {"t": 1680.65, "x": "その調書は、裁判の証拠として\n使えると判決で認められた。"}, {"t": 1684.8, "x": "アメリカでとった書類が、日本の裁判で生きたのね。"}, {"t": 1688.0666666666666, "x": "ただすんなり決まったわけではない。"}, {"t": 1689.9833333333333, "x": "本人は日本の法廷には\n出てこなかった、と議員が述べている。"}, {"t": 1693.65, "x": "それで証拠になるのかを\nめぐって、大論争になったという。"}, {"t": 1697.05, "x": "1981年にも、刑事局長は同じ例を挙げた。"}, {"t": 1700.85, "x": "一種のスパイ事件と言われる事件だ、と前置きしてな。"}, {"t": 1704.7666666666667, "x": "1982年12月、別のソ連の工作員が\nアメリカ議会で証言した。"}, {"t": 1709.95, "x": "東京で、4年半ほど勤めていた人物だった。"}, {"t": 1713.05, "x": "官房長官は率直な感じは「またか」だと答えた。"}, {"t": 1716.75, "x": "またかってことは前にもあったのね？"}, {"t": 1718.9333333333334, "x": "官房長官は古い話だがと断って例を挙げた。"}, {"t": 1722.0666666666666, "x": "その1つが、ラストボロフの事件だった。"}, {"t": 1724.75, "x": "1983年には、警察庁の局長が\n2つの事件を比べている。"}, {"t": 1729.6, "x": "ラストボロフのときは関係者の自首が始まりだった。"}, {"t": 1732.75, "x": "その話をもとに捜査官がアメリカで調べを進めた。"}, {"t": 1736.1333333333334, "x": "今度はどこが違ったの？"}, {"t": 1737.8, "x": "今度はアメリカ議会の秘密の証言が\n漏れたのが始まりだという。"}, {"t": 1741.5, "x": "局長は性質も流れも大きく異なると述べた。"}, {"t": 1745.1333333333334, "x": "1986年になっても、この事件は国会で語られていた。"}, {"t": 1749.4833333333333, "x": "秘密を守る法律を、作るかどうかの議論の中でだ。"}, {"t": 1752.9166666666667, "x": "どんなふうに使われたの？"}, {"t": 1754.5833333333333, "x": "ある議員はこう述べている。"}, {"t": 1756.0333333333333, "x": "7か月たってから、外務省の事務官3人が検挙された。"}, {"t": 1759.8333333333333, "x": "それも、ラストボロフとの関係ははっきりしないまま。"}, {"t": 1763.0, "x": "今ある法律で裁かれた事件だ、という見方だ。"}, {"t": 1766.1333333333334, "x": "反対の見方も、あったの？"}, {"t": 1768.1166666666666, "x": "官房長官は同じ年の別の委員会でこう言った。"}, {"t": 1771.1666666666667, "x": "担当者がアメリカまで行ったが、\n全部検挙できましたか。"}, {"t": 1774.5833333333333, "x": "できない、と自分で答えている。"}, {"t": 1776.6666666666667, "x": "同じ事件なのに、まったく逆の使われ方ね。"}, {"t": 1779.7666666666667, "x": "どちらが正しいかは、ここでは判定しない。"}, {"t": 1783.0, "x": "ねえ、ここまでの話を短くまとめて？"}, {"t": 1785.6666666666667, "x": "分かった。まず、日付で確かめられることだ。"}, {"t": 1788.6, "x": "1954年1月24日、昼食に出て戻らなかった。"}, {"t": 1792.8666666666666, "x": "1月27日、代表部が警視庁に捜索を頼んだ。"}, {"t": 1796.65, "x": "2月5日、外務省の職員だった人が自首した。"}, {"t": 1800.0, "x": "7月10日、日本の調べの担当者が\nワシントンへ向かった。"}, {"t": 1803.7666666666667, "x": "8月14日、日米が同時に\n発表して関係者が逮捕された。"}, {"t": 1808.0166666666667, "x": "公務員3人が検挙され、1人が亡くなった。"}, {"t": 1811.1333333333334, "x": "それは全部答弁に出てくるのね。"}, {"t": 1813.25, "x": "では次に、会議録では分からないことだ。"}, {"t": 1815.8, "x": "消えてから軍用機に乗るまで、どこにいたのか。"}, {"t": 1818.5833333333333, "x": "名前が挙がった60数人が、それぞれ何をしたのか。"}, {"t": 1821.95, "x": "ある政党へのお金の話が、本当だったのか。"}, {"t": 1825.05, "x": "大事なところが、まだ霧の中なのね。"}, {"t": 1827.6666666666667, "x": "答弁も、そこは捜査中か未確認で止まっている。"}, {"t": 1831.4666666666667, "x": "最後に、1954年1月24日の停留所に戻ろう。"}, {"t": 1835.6166666666666, "x": "あの日、ラストボロフは1人でバスに乗った。"}, {"t": 1838.2833333333333, "x": "隣にいた2人は、そのバスには乗らなかった。"}, {"t": 1841.2833333333333, "x": "あのバスが、すべての分かれ道だったのね。"}, {"t": 1843.9666666666667, "x": "彼はアメリカでたくさんの話をした。"}, {"t": 1846.2333333333333, "x": "その話から、日本の中で何人もの人が調べられた。"}, {"t": 1849.9166666666667, "x": "裁判にかけられた人がいて、亡くなった人がいる。"}, {"t": 1853.2, "x": "本人が日本で裁かれることは無かったのね？"}, {"t": 1856.0333333333333, "x": "そうだ。引き渡しも立件もされなかった。"}, {"t": 1858.7166666666667, "x": "日本は、条約と法律の隙間を何度も国会で問われた。"}, {"t": 1862.5166666666667, "x": "去った1人より、残された人の話が重いわね。"}, {"t": 1865.8166666666666, "x": "答弁を追うと、その重さがよく見えてくる。"}, {"t": 1868.3666666666666, "x": "ラストボロフ事件の記録は、日付と\n答弁の中に今も残っている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
