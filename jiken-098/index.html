<script>
const D={"name": "098", "file": "098_編集用", "dur": 2306.86665625, "segs": [], "subs": [{"t": 0.0, "x": "兵庫県明石市に、朝霧歩道橋という橋がある。"}, {"t": 3.1166666666666667, "x": "1999年にできた、歩く人だけの橋だ。"}, {"t": 6.733333333333333, "x": "JRの朝霧駅と、大蔵海岸をまっすぐ結んでいる。"}, {"t": 10.25, "x": "長さは、およそ103メートル。"}, {"t": 12.3, "x": "人が歩く部分の幅は、6メートルある。"}, {"t": 15.0, "x": "けっこう広いのね。"}, {"t": 16.333333333333332, "x": "ああ。ところが、橋を渡りきった先に階段がある。"}, {"t": 19.533333333333335, "x": "その階段の幅は、3メートルだ。"}, {"t": 21.95, "x": "……半分？"}, {"t": 22.7, "x": "半分だ。"}, {"t": 23.5, "x": "6メートルの通り道が、3メートルの出口になる。"}, {"t": 26.633333333333333, "x": "2001年7月21日の夜、\nこの橋の上には、およそ6400人がいた。"}, {"t": 32.2, "x": "6400人？"}, {"t": 33.6, "x": "そうだ。橋と階段を合わせて、それだけの人が\n乗っていたと推定されている。"}, {"t": 38.25, "x": "花火大会の帰りだった。"}, {"t": 39.96666666666667, "x": "第32回明石市民夏まつり。\nその二日目の、花火の夜だ。"}, {"t": 44.3, "x": "午後7時45分に花火が上がり、\n午後8時31分ころに終わった。"}, {"t": 48.8, "x": "その十数分後、橋の上で人が折り重なって倒れた。"}, {"t": 52.11666666666667, "x": "……。"}, {"t": 53.03333333333333, "x": "亡くなった方は、11人。"}, {"t": 54.95, "x": "そのうち9人が、10歳になっていない子どもだった。"}, {"t": 58.166666666666664, "x": "残る2人は、71歳と75歳の女性だ。"}, {"t": 61.45, "x": "けがをされた方は、明石市の数え方で247人。"}, {"t": 65.15, "x": "今日は、この橋の話をする。"}, {"t": 67.13333333333334, "x": "橋そのものの話だ。"}, {"t": 68.7, "x": "幅6メートルの道が、幅3\nメートルの出口につながっている。"}, {"t": 72.5, "x": "1時間に1万4千人しか通れない橋に、それ\n以上の人を入れ続けたら、どうなるか。"}, {"t": 78.03333333333333, "x": "……計算すれば、分かりそうなものだけど。"}, {"t": 80.55, "x": "分かる。実際、事故のあとで計算されている。"}, {"t": 83.45, "x": "ただ、その計算は、\n事故の半年前にもできたはずだった。"}, {"t": 87.36666666666666, "x": "半年前に、何かあったの。"}, {"t": 89.45, "x": "同じ橋で、同じことが起きかけている。"}, {"t": 91.95, "x": "そこから始める。"}, {"t": 93.78333333333333, "x": "先に、この回で私が守ることを言っておく。四つある。"}, {"t": 97.35, "x": "一つ目。亡くなった方の名前を出さない。"}, {"t": 100.01666666666667, "x": "明石市が出した報告書にも、\n11人の氏名は載っていない。"}, {"t": 103.6, "x": "年齢と性別だけだ。"}, {"t": 105.28333333333333, "x": "子どもが多いって、さっき言っていたけど。"}, {"t": 107.76666666666667, "x": "9人が子どもだ。それは事実として言う。"}, {"t": 110.36666666666666, "x": "ただ、その事実を煽りに使わない。"}, {"t": 112.48333333333333, "x": "倒れた場面も描写しない。"}, {"t": 114.2, "x": "かかっていた力は、報告書が\n測っている。だから測った値をそのまま出す。"}, {"t": 119.01666666666667, "x": "二つ目。この事故では、2人が刑事責任を\n問われて有罪が確定している。"}, {"t": 123.71666666666667, "x": "だが、私はその2人を名前で呼ばない。"}, {"t": 126.38333333333334, "x": "どうして。"}, {"t": 127.23333333333333, "x": "最高裁の決定文が、名前を書いていないからだ。"}, {"t": 130.36666666666667, "x": "「被告人Ａ」「被告人Ｂ」としか書かれていない。"}, {"t": 133.45, "x": "役職で呼ぶ。「明石警察署の地域官」と\n「警備会社の大阪支社長」だ。"}, {"t": 138.43333333333334, "x": "三つ目。「警察が人を死なせた」という\n言い方をしない。"}, {"t": 141.96666666666667, "x": "警察の責任は問われているのに。"}, {"t": 144.2, "x": "ただ、報告書も、国会の答弁も、\n最高裁の決定も、全部が同じ立て方をしている。"}, {"t": 150.01666666666668, "x": "主催者の明石市、警備会社、\nそして警察署。この三者だ。"}, {"t": 154.16666666666666, "x": "一つに絞った資料が、私の手元には\n一本も無い。だから絞らない。"}, {"t": 158.61666666666667, "x": "四つ目。出どころを言う。"}, {"t": 160.18333333333334, "x": "明石市の事故調査報告書。"}, {"t": 161.93333333333334, "x": "最高裁の決定。国会の会議録。"}, {"t": 164.4, "x": "質問主意書と答弁書。"}, {"t": 166.15, "x": "この四種類だけで話す。"}, {"t": 167.7, "x": "報道でしか確認できないことは、その都度そう断る。"}, {"t": 171.28333333333333, "x": "分かったわ。"}, {"t": 172.75, "x": "まず、橋そのものを見る。"}, {"t": 174.43333333333334, "x": "朝霧歩道橋は、大蔵海岸を整備する\n事業の一部として1999年11月に完成した。"}, {"t": 180.93333333333334, "x": "市道大蔵町53号線として、道路の認定を受けている。"}, {"t": 184.81666666666666, "x": "橋なのに、道路。"}, {"t": 186.26666666666668, "x": "そうだ。ここは後で効いてくる。\nこの橋は明石市の市道だ。"}, {"t": 189.81666666666666, "x": "長さは、最高裁の決定でおよそ103.65メートル。"}, {"t": 193.55, "x": "報告書は103.7メートルと書いている。"}, {"t": 196.41666666666666, "x": "有効幅員、つまり人が歩ける幅は6メートル。"}, {"t": 199.5, "x": "渡りきった南の端で直角に\n曲がり、48段の階段を降りる。"}, {"t": 203.66666666666666, "x": "階段の幅は3メートルだ。"}, {"t": 205.65, "x": "橋は6メートルで、階段は3メートル。"}, {"t": 208.31666666666666, "x": "そこがこの橋の急所だ。"}, {"t": 209.85, "x": "報告書はこう書いている。"}, {"t": 211.45, "x": "階段の幅は、夏場のピーク時の海水浴客を\n計画交通量として決めた。"}, {"t": 216.3, "x": "一方で橋の上の幅は、車椅子の通行や、景色を\n眺めて立ち止まることを考えて広くとった。"}, {"t": 222.36666666666667, "x": "その結果、計画以上の利用者があれば\n滞留しやすい、ボトルネック構造になっていた。"}, {"t": 227.58333333333334, "x": "作ったときから、そうなっていたのね。"}, {"t": 230.05, "x": "そもそもこの橋は、海水浴客のための通路だ。"}, {"t": 233.3, "x": "最盛期の1日の最大歩行者数は、\n1万4400人と読み込まれていた。"}, {"t": 238.46666666666667, "x": "1日で1万4400人。"}, {"t": 240.7, "x": "では、1時間あたりでは何人通れるのか。"}, {"t": 243.23333333333332, "x": "報告書は、階段のほうから計算している。"}, {"t": 246.16666666666666, "x": "出口のほうから。"}, {"t": 247.41666666666666, "x": "階段は、幅1メートルあたり1秒に\n1.3人が通れると考える。"}, {"t": 251.7, "x": "1.3人×3600秒×3メートル。"}, {"t": 254.81666666666666, "x": "1時間あたり、およそ1万4000人だ。"}, {"t": 257.68333333333334, "x": "1日ぶんが、1時間で通る計算なのね。"}, {"t": 260.65, "x": "そのつもりで作られた橋だ。もう\n一つ、公式の案内を見ておく。"}, {"t": 264.8, "x": "会場までの案内図には、朝霧駅からの通路として、\nこの橋だけが図示されていた。"}, {"t": 270.03333333333336, "x": "ほかに道は無かったの。"}, {"t": 271.6666666666667, "x": "あった。線路の北側を西に進む迂回路だ。\nただし徒歩でおよそ1200メートル。"}, {"t": 276.65, "x": "そして当日、その迂回路の案内表示は、\n往路も復路も出されていなかった。"}, {"t": 281.95, "x": "2000年の大晦日から2001年の元日にかけて、\n同じ大蔵海岸でカウントダウンの行事があった。"}, {"t": 288.1166666666667, "x": "来場者はおよそ5万5000人。"}, {"t": 289.8666666666667, "x": "午前0時から、10分間の花火が上がった。"}, {"t": 292.8333333333333, "x": "同じ橋も使っている。\nその10分のあいだに、何が起きたか。"}, {"t": 296.71666666666664, "x": "橋の南の端と階段は、花火を見るのに\n絶好の位置だ。そこに人が立ち止まる。"}, {"t": 301.9166666666667, "x": "一方で、駅のほうからは会場へ\n向かう人が押し寄せてくる。"}, {"t": 305.45, "x": "そこへ、花火が終わって帰ろうとする\n人が、広場から階段を上がってきた。"}, {"t": 310.0833333333333, "x": "……ぶつかるわね。"}, {"t": 311.1666666666667, "x": "ぶつかった。「一挙に群衆の圧力がぶつかり合い\n混雑混乱が生じた」と書かれている。"}, {"t": 316.51666666666665, "x": "混乱は、およそ20分続いた。"}, {"t": 318.75, "x": "1平方メートルに13人とも15人とも思える\nひしめき合いだった、という記述だ。"}, {"t": 323.93333333333334, "x": "13人。1メートル四方に。"}, {"t": 326.06666666666666, "x": "「人の頭が自分の顎の下に食い込み、骨が\n折れるか息が止まるかというすさまじさ」。"}, {"t": 331.0833333333333, "x": "報告書も「幸いこの時は死傷者も\n出ることはなかった」と書いている。"}, {"t": 335.45, "x": "そして、関係者の受け止めはこうだった。"}, {"t": 337.96666666666664, "x": "すごい混雑で大変な状況だったが、\n無事に事故もなく終わってよかった。"}, {"t": 342.45, "x": "……よかった、で終わったのね。"}, {"t": 344.25, "x": "そこで終わった。報告書も二通り残っている。"}, {"t": 347.2, "x": "一つは、明石警察署が作った警備実施結果報告書だ。"}, {"t": 351.28333333333336, "x": "そこには何て。"}, {"t": 352.48333333333335, "x": "当夜5万5000人の人出があり、特異事項なし。"}, {"t": 355.65, "x": "それだけ？"}, {"t": 356.55, "x": "それだけだ。"}, {"t": 357.43333333333334, "x": "もう一つは、警備会社が作った\n自主警備実施結果報告書だ。"}, {"t": 361.51666666666665, "x": "「花火終了後まで来場者が集中し、\n朝霧歩道橋まで長蛇の列が生じ」。"}, {"t": 366.15, "x": "「階段付近にあってはバランスを崩す、"}, {"t": 368.3, "x": "来場者の子ども連れの親子が\n引き離される等の混雑が見受けられた」。"}, {"t": 372.53333333333336, "x": "どちらも、同じ夜の同じ場所の話だ。"}, {"t": 375.05, "x": "当事者からの聴き取りも残っている。"}, {"t": 377.28333333333336, "x": "夏まつりで元請けになる警備会社の大阪支社長は、\nこの夜は下請けとして現場にいた。"}, {"t": 382.6, "x": "階段の下で群衆整理の指揮を執り、\n急いで規制のロープを張った。"}, {"t": 386.6333333333333, "x": "しかし群衆の勢いで役に立たず、ロープで\n首を吊ったような状態になる人が出た。"}, {"t": 391.5833333333333, "x": "自分自身も、群衆のうちから殴られた。"}, {"t": 394.4, "x": "それだけのことがあって、警察署の報告書は\n「特異事項なし」なのね。"}, {"t": 399.05, "x": "調査委員会は、この件について一文だけ書いている。"}, {"t": 402.25, "x": "これらの状況が、後日それぞれの組織の中で\n共有された形跡が見当たらない。"}, {"t": 407.6666666666667, "x": "警察署と主催者側の協議は、\n2001年4月10日に始まっている。"}, {"t": 412.15, "x": "4月は10日、16日、18日、25日。5月は22日。"}, {"t": 417.05, "x": "6月は4日、7日、8日、11日、12日、13日。"}, {"t": 421.8833333333333, "x": "けっこうな回数ね。"}, {"t": 423.3, "x": "11回だ。ほかに市役所での検討会が\n5月21日、6月6日、6月26日にある。"}, {"t": 429.95, "x": "それだけ話したなら、橋の話も出たでしょう。"}, {"t": 433.0, "x": "ここが、この事故の一番きしむところだ。"}, {"t": 435.5833333333333, "x": "報告書はこう書いている。"}, {"t": 436.98333333333335, "x": "協議の内容は「専ら大蔵海岸での花火大会当日、"}, {"t": 440.71666666666664, "x": "夜店を大会会場の何処に\n出店させるかの討議が繰り返されている」。"}, {"t": 445.03333333333336, "x": "……夜店の場所。"}, {"t": 446.1666666666667, "x": "夜店の場所だ。11回のうち、\n繰り返されたのはそれだった。"}, {"t": 449.96666666666664, "x": "5月21日には、カウントダウンのときに駅前の車道に"}, {"t": 453.55, "x": "人があふれたのと同じ状態が\n予想される、と言っている。"}, {"t": 456.8333333333333, "x": "ちゃんと言っているじゃない。"}, {"t": 458.28333333333336, "x": "言っている。報告書も、それは\n認めている。そのうえで、こう続けている。"}, {"t": 462.73333333333335, "x": "「指導、助言はこの程度に止まっていて」、"}, {"t": 464.98333333333335, "x": "群衆整理の方法や危険防止の措置について「更に\n突っ込んだ協議がなされた形跡は見当たらない」。"}, {"t": 471.0, "x": "6月6日には、警備会社も加わって協議している。"}, {"t": 474.3, "x": "警察署から、朝霧駅周辺の歩道橋の歩行者対策を\nとること、と指導が出た。"}, {"t": 479.68333333333334, "x": "なんて答えたの。"}, {"t": 480.93333333333334, "x": "「カウントダウンイベントの時のようにやる」。"}, {"t": 483.28333333333336, "x": "……それ、あの夜と同じことをやるってこと。"}, {"t": 485.85, "x": "報告書は、この答えについて\n括弧付きでこう注記している。"}, {"t": 489.31666666666666, "x": "「答になっていない」。"}, {"t": 490.6, "x": "警察署と警備会社の二者だけで、警備の詳細について\n綿密に事前協議が行われたことは、一度もなかった。"}, {"t": 498.1, "x": "2001年5月7日、夏まつりの主催者の代表たちが\n明石警察署を訪ねて挨拶をしている。"}, {"t": 504.25, "x": "その席で、署長が言ったことが報告書に残っている。"}, {"t": 507.71666666666664, "x": "なんて。"}, {"t": 508.45, "x": "警察の仕事は暴走族対策である。"}, {"t": 511.05, "x": "……夏まつりの挨拶で。"}, {"t": 512.6166666666667, "x": "これは、その場の思いつきの一言ではない。"}, {"t": 515.1666666666666, "x": "計画書に数字で出ている。"}, {"t": 516.9166666666666, "x": "明石警察署が作った、\n第32回明石市民夏まつり雑踏警備計画書。"}, {"t": 522.1333333333333, "x": "その中の、7月21日の部隊編成と任務分担表だ。"}, {"t": 526.2833333333333, "x": "暴走族対策と、それに関わる事件対策に\n配置された警備要員が、292人。"}, {"t": 532.0333333333333, "x": "これに対して、雑踏対策に配置されたのが36人。"}, {"t": 535.9, "x": "292人と、36人。"}, {"t": 538.4166666666666, "x": "報告書の表現は「遥かに少ない36人の警備要員が\n雑踏対策に配置されているに過ぎず」だ。"}, {"t": 545.0333333333333, "x": "……歩道橋は。"}, {"t": 546.0166666666667, "x": "報告書はこう書いている。"}, {"t": 547.4333333333333, "x": "「今回事故現場となった朝霧歩道橋には\n全く配置されておらず」。"}, {"t": 551.55, "x": "橋が雑踏事故防止の対象になっているのは、"}, {"t": 554.1666666666666, "x": "花火大会が終わったあとに一部が\n任務に就く、というところだけだ。"}, {"t": 558.2333333333333, "x": "当日、明石警察署が動かした\n警察官は、応援も含めて総員349人。"}, {"t": 563.9166666666666, "x": "署本部が11人。地域官が指揮する\n現地本部と雑踏対策が46人。"}, {"t": 568.8333333333334, "x": "事件対策が102人。"}, {"t": 570.3166666666667, "x": "暴走族対策が190人だ。"}, {"t": 572.7, "x": "そのうち雑踏警備班は16人。"}, {"t": 574.75, "x": "会場の東広場に8人、西広場に8人。"}, {"t": 578.1166666666667, "x": "349人のうち、16人。"}, {"t": 580.7666666666667, "x": "明石警察署側の警備体制の主眼は、専ら\n暴走族対策であったことが裏書されている。"}, {"t": 587.25, "x": "元請けになったのは、大阪に支社を置く警備会社だ。"}, {"t": 590.35, "x": "選ばれた理由が報告書に書いてある。"}, {"t": 592.7166666666667, "x": "会社そのものの実績よりも、大蔵海岸の行事で\n警備責任者をしていた大阪支社長個人への評価が"}, {"t": 598.9333333333333, "x": "高かった。"}, {"t": 599.7666666666667, "x": "主催者側は「同人に任せれば大丈夫」「同人なら\n間違いなくやってくれる」と過信していた。"}, {"t": 605.6333333333333, "x": "会社じゃなくて、人で選んだのね。"}, {"t": 608.0, "x": "報告書がそう書いている。次は、契約書だ。"}, {"t": 610.9333333333333, "x": "主催者側と警備会社のあいだに、警備業務請負に\n関する契約書は作られていなかった。"}, {"t": 616.45, "x": "作られていない。"}, {"t": 617.6333333333333, "x": "正確に言うと、7月16日付の契約書は存在する。\nただし報告書は括弧の中でこう書いている。"}, {"t": 624.1666666666666, "x": "これは事故後の7月26日ころに、日付を\n遡らせて急ぎ作成されたものである。"}, {"t": 629.7333333333333, "x": "……事故のあとに作ったのね。"}, {"t": 631.5, "x": "そういう記述だ。では、警備計画書はどうだったか。"}, {"t": 634.75, "x": "6月9日付で、大阪支社が作った\n警備実施計画書が出ている。"}, {"t": 639.1, "x": "報告書の判断はこうだ。"}, {"t": 640.85, "x": "カウントダウンイベントのときの計画書と\n酷似する部分があり、"}, {"t": 644.2, "x": "歩道橋付近の雑踏警備対策の部分は特に顕著だった。"}, {"t": 648.0833333333334, "x": "今回の花火大会には全く必要のない、\nJR山陽本線の深夜便の記載なども\nそのまま含まれていた。"}, {"t": 654.8833333333333, "x": "いわば丸写しの疑いが濃厚である。"}, {"t": 657.2166666666667, "x": "深夜便。花火大会は夜の8時半に終わるのに。"}, {"t": 660.5166666666667, "x": "残っていた。"}, {"t": 661.45, "x": "そしてこの計画書を、大阪支社長は\n社内で命じて作らせている。"}, {"t": 665.55, "x": "報告書には、作成後に内容へ\n直接目を通していなかった、と書かれている。"}, {"t": 670.3666666666667, "x": "報告書の結論はこうだ。"}, {"t": 672.0833333333334, "x": "混乱が起これば対処する、"}, {"t": 673.6, "x": "臨機応変に警察の援助を得て対処すればよい。\nその考え以上に出ることがなかった。"}, {"t": 678.8166666666667, "x": "警備業務の慣れも手伝い、いわばでたとこ勝負で"}, {"t": 681.5, "x": "対処して切り抜けようという\n安易な考え方に終始していた。"}, {"t": 685.6166666666667, "x": "ここまでは、人を通す側の話だ。"}, {"t": 687.9, "x": "次は、倒れた人を運ぶ側の話をする。"}, {"t": 690.8333333333334, "x": "救急のほうね。"}, {"t": 692.0666666666667, "x": "主催者側と消防本部の事前協議は、\n7月3日と7月4日の2回行われている。"}, {"t": 697.65, "x": "内容は二つだけだ。一つ、\n花火による消火などへの対応。"}, {"t": 701.3833333333333, "x": "二つ、救急車の派遣。"}, {"t": 703.35, "x": "……人が大勢倒れたときの話は。"}, {"t": 705.6166666666667, "x": "無い。"}, {"t": 706.0833333333334, "x": "報告書はこう書いている。"}, {"t": 707.4666666666667, "x": "多数傷病者発生時における\n対応等の事前協議は行われていなかった。"}, {"t": 711.9833333333333, "x": "それから、警備会社が作った警備計画書は、\n消防本部には手渡されていない。"}, {"t": 717.0166666666667, "x": "消防は、警備の計画を知らないまま当日を迎えたの。"}, {"t": 720.5666666666667, "x": "報告書の記述はそうなっている。"}, {"t": 722.45, "x": "医療機関のほうも見ておく。"}, {"t": 724.2, "x": "6月15日に、主催者側が会場の近くの病院へ\n協力依頼の文書を持参した。それだけだ。"}, {"t": 730.45, "x": "消防本部と、市の医師会や\n救急病院との事前協議は、全く行われていない。"}, {"t": 735.5666666666667, "x": "集団災害が起きたときの対応計画は、\n作成されていなかった。"}, {"t": 739.8166666666667, "x": "作られていなかったのね。"}, {"t": 741.5166666666667, "x": "不測の事態に対応する救急計画が\n策定されていなかった結果、"}, {"t": 745.5666666666667, "x": "救急対応の遅れを必然的に\n生じさせる第一要因となった。"}, {"t": 749.6833333333333, "x": "重い患者を受け入れる三次救急の医療機関が、\n明石市内には無かった。"}, {"t": 754.05, "x": "日常でも、およそ15パーセントの救急患者が\n市外の病院へ運ばれている。"}, {"t": 758.8, "x": "それだと、一度に大勢けが人が出たら。"}, {"t": 761.4333333333333, "x": "明石市内の医療機関のみで傷病者を受け入れ、\n治療することは困難な現状であるといえる。"}, {"t": 766.7833333333333, "x": "それが、7月21日を迎える前の状態だった。"}, {"t": 770.9166666666666, "x": "2001年7月21日、土曜日。"}, {"t": 773.6333333333333, "x": "午後6時、予告の音花火が50発上がった。"}, {"t": 776.7, "x": "同じ時刻に、広場の一角で\nスイカの無料配布が始まっている。"}, {"t": 780.8166666666667, "x": "まだ明るい時間ね。"}, {"t": 782.2333333333333, "x": "薄暮だ。ここから人が集まり始める。"}, {"t": 784.8, "x": "そして夜店だ。"}, {"t": 785.9, "x": "階段の東のロータリーから、橋の下を\nくぐって西へ、およそ290メートル。"}, {"t": 790.9666666666667, "x": "報告書の本編では184店、\n概要版では約180店と書かれている。"}, {"t": 796.2666666666667, "x": "橋の真下にも出ていたの。"}, {"t": 798.1, "x": "橋の下を通り抜ける形で並んでいる。"}, {"t": 800.6166666666667, "x": "向かい合う店と店の間隔は、およそ11メートルだ。"}, {"t": 804.05, "x": "11メートルなら、通れそうだけど。"}, {"t": 806.4333333333333, "x": "そこに人が入る。"}, {"t": 807.7333333333333, "x": "しかも夜店の北側には、国道28号との間に高さ\nおよそ1.8メートルのネットフェンスが張られていた。"}, {"t": 814.5333333333333, "x": "……抜けられないのね。"}, {"t": 815.7833333333333, "x": "群衆がその混雑を逃れようと思っても\n逃れられない状態になっており、"}, {"t": 819.8, "x": "一部の群衆が夜店の間の僅かな隙間から\n逃れようと殺到しひしめき合った。"}, {"t": 824.8, "x": "そして、事故が発生してもおかしくないと\n思える状況も生まれていた。"}, {"t": 828.8333333333334, "x": "これは、橋の上の話ではない。橋の下の話だ。"}, {"t": 832.3, "x": "午後6時30分ころ、朝霧駅のホームは\nすでに大混雑していた。"}, {"t": 836.6, "x": "駅の放送は、花火大会の経路として\n歩道橋の方向を案内していた。"}, {"t": 841.6833333333333, "x": "ここから、当日に何度も出てくる\n言葉がある。「規制」だ。"}, {"t": 845.3666666666667, "x": "橋に入る人を、いったん止める。それだけのことだ。"}, {"t": 848.6, "x": "この提案が、当日に何回出て、\n何回通らなかったかを順に見る。"}, {"t": 852.8833333333333, "x": "一回目。午後6時15分ころ。"}, {"t": 855.05, "x": "警備員1人が無線機を2台持って\n朝霧駅側に来て、自主警備本部と連絡をとった。"}, {"t": 860.4, "x": "結論は、分断規制をするには\n警察の許可が必要、というものだった。"}, {"t": 864.9, "x": "警察官の到着を待ったが、\n現場に警察官は来なかった。"}, {"t": 868.6, "x": "規制は実施できていない。"}, {"t": 870.3333333333334, "x": "二回目は。"}, {"t": 871.25, "x": "午後7時ころだ。"}, {"t": 872.4166666666666, "x": "警察官が現場に現れたので、警備員が状況を\n説明して、通路の分断か、入場制限を提案した。"}, {"t": 879.05, "x": "返事が記録に残っている。"}, {"t": 880.65, "x": "「流れているのでこのまま様子をみる」。"}, {"t": 882.9, "x": "……様子をみる。"}, {"t": 883.8666666666667, "x": "この判断について、兵庫県警察本部は\n調査委員会にこう回答している。"}, {"t": 888.4833333333333, "x": "この時点で歩道橋への入場制限をすれば、"}, {"t": 890.9833333333333, "x": "混雑している朝霧駅で乗降客がホームから線路に\n転落したり、駅前のロータリーに人があふれる。"}, {"t": 897.0833333333334, "x": "だから特段の措置をとらなかった。"}, {"t": 899.3833333333333, "x": "……駅のほうが危ない、という判断ね。"}, {"t": 901.6833333333333, "x": "三回目。午後7時25分ころ。"}, {"t": 904.05, "x": "朝霧駅側が非常に混んでいるという無線が入り、\n警備会社の責任者が明石警察署の地域官に相談した。"}, {"t": 910.8833333333333, "x": "地域官の答えはこうだ。"}, {"t": 912.3333333333334, "x": "「自然の流れ、このまま行こう」。"}, {"t": 914.3166666666667, "x": "四回目。午後7時45分。"}, {"t": 916.35, "x": "花火が始まる時刻だ。"}, {"t": 918.0333333333333, "x": "警備員が、その場の警察官にもう一度要請している。"}, {"t": 921.4666666666667, "x": "今、歩道橋の北側の入口がすいているうちに、\n強制的に通行制限することを許してほしい。"}, {"t": 927.4666666666667, "x": "すいているうちに。"}, {"t": 928.65, "x": "返事はこうだ。「花火が終わってからにしよう」。"}, {"t": 931.9, "x": "午後7時45分、花火が上がった。"}, {"t": 934.4, "x": "打ち上げが始まったすぐあと、\n橋の上の警備員から無線が入っている。"}, {"t": 938.55, "x": "「橋の上の流れが止まった」。"}, {"t": 940.2833333333333, "x": "警備員と市の職員が、橋の下や\n夜店の通路で帰り道の迂回案内を始めた。"}, {"t": 945.3166666666667, "x": "しかし階段の下は、夜店と花火見物の人で\n埋め尽くされていて、人が流れなかった。"}, {"t": 951.1, "x": "誘導はできなかったの。"}, {"t": 952.7, "x": "警備員は観客に殴られたり、\nビールをかけられたりして、誘導を\n効果的に行うことができなかった。"}, {"t": 958.75, "x": "花火が上がると群衆の足が\n止まり、散ってしまうと進む。"}, {"t": 962.2, "x": "これが繰り返されるたびに、\nその進み幅が狭くなっていった。"}, {"t": 966.05, "x": "少しずつ、進まなくなっていくのね。"}, {"t": 968.6166666666667, "x": "そうだ。そして、人と人の間隔が詰まっていく。"}, {"t": 971.95, "x": "橋の上では、ベビーカーをたたむ人がいた。"}, {"t": 974.55, "x": "歩かせていた子どもを抱き上げる人がいた。"}, {"t": 977.0, "x": "息苦しくなって、子どもをできるだけ\n高く抱く人がいた。"}, {"t": 980.5666666666667, "x": "鉄の手すりと、透明な板のあいだに\n子どもを入れる人もいた。"}, {"t": 984.3, "x": "……板のあいだに。"}, {"t": 985.3833333333333, "x": "橋の両側は、線路や国道への落下物を\n防ぐために、透明な板で上まで覆われている。"}, {"t": 990.7666666666667, "x": "ただ、報告書はその先も書いている。"}, {"t": 993.2, "x": "さらに圧力は増し、手すりと板のあいだにいる\n子どもにも、人の圧力がのしかかる状況となった。"}, {"t": 999.1, "x": "手すりの近くの親たちは、両腕を板に\n突いて、必死に子どもらを護っていた。"}, {"t": 1003.65, "x": "……。"}, {"t": 1004.5833333333334, "x": "そして、駅の側からは、こういう声が上がっていた。"}, {"t": 1007.7, "x": "「花火が終わってしまうやろ、進め」。"}, {"t": 1010.5, "x": "ここで、事故のあとに行われた\n技術解析の数字を出す。"}, {"t": 1014.2333333333333, "x": "写真から数えたの。"}, {"t": 1015.75, "x": "写真と証言と駅の記録から割り出している。"}, {"t": 1018.5166666666667, "x": "その結果、ピーク時に会場にいた\n人数は、およそ8万3000人。"}, {"t": 1022.8, "x": "計画では何人の予定だったの。"}, {"t": 1025.0166666666667, "x": "明石警察署の計画書には15万人、最高裁の決定には\n10万人を超える見込みと書かれている。"}, {"t": 1031.1333333333334, "x": "実際に来たのは8万3000人だから、\n見込みより少ない。"}, {"t": 1034.9666666666667, "x": "少ないのに、事故が起きたのね。"}, {"t": 1037.1666666666667, "x": "そこが大事なところだ。"}, {"t": 1038.5333333333333, "x": "人数ではなく、どこに何人いたかだ。"}, {"t": 1041.0333333333333, "x": "夜店の通路の群衆密度は、\n1平方メートルあたり7人だった。"}, {"t": 1045.1666666666667, "x": "橋の上の滞留人数は、三つの方法で\n別々に計算されている。"}, {"t": 1049.3166666666666, "x": "改札の記録から出して6400人。"}, {"t": 1051.85, "x": "歩く速さから出して6500人。"}, {"t": 1054.1, "x": "混雑の証言から出して6450人。"}, {"t": 1057.2166666666667, "x": "総合して、最大でおよそ6400人と推定されている。"}, {"t": 1061.0666666666666, "x": "計算上は1時間に1万4000人通せるはずだった。"}, {"t": 1064.4666666666667, "x": "ところが午後7時30分から8時までの30分間で、\n降りていったのは1800人程度だ。"}, {"t": 1070.4666666666667, "x": "1時間だと3600人。"}, {"t": 1072.2833333333333, "x": "計算上の4分の1ね。"}, {"t": 1074.2, "x": "「階段を降りて広場に行こうにも、降りて行く\n所がないと思えるほど」と書かれている。"}, {"t": 1079.0666666666666, "x": "時間の変化も出ている。"}, {"t": 1080.45, "x": "18時以降に増え始め、特に\n18時30分ころから急激に増えた。"}, {"t": 1085.3, "x": "遅くとも19時ころまでに流入を\n制限するなど強力な規制を行えば、"}, {"t": 1089.45, "x": "事故を防止することができたかとは思われる。"}, {"t": 1092.6666666666667, "x": "午後8時ころ。ここが、この事故の分かれ目だ。"}, {"t": 1095.6, "x": "橋の上の警備員から、自主警備本部に無線が入る。"}, {"t": 1099.0, "x": "「前が詰まっているので後ろを止めてほしい。"}, {"t": 1101.15, "x": "警察に要請できないか」。"}, {"t": 1102.8833333333334, "x": "これを受けて、警備会社の大阪支社長が、\n明石警察署の地域官のところへ行っている。"}, {"t": 1108.2333333333333, "x": "橋を眺めながら、「止めましょうか」と提案した。"}, {"t": 1111.3666666666666, "x": "それで。"}, {"t": 1112.1, "x": "報告書に残っている返事はこうだ。"}, {"t": 1114.2, "x": "「今、見に行かしている」「情報を取っている」。"}, {"t": 1116.8666666666666, "x": "最高裁の決定は、同じ場面を\nもう少し細かく認定している。"}, {"t": 1120.9333333333334, "x": "支社長は一度は「前が詰まってどうにもなりません。"}, {"t": 1123.7666666666667, "x": "ストップしましょうか。」と打診した。"}, {"t": 1126.0833333333333, "x": "しかし地域官の消極的な反応を\n受けて、すぐに引き下がった。"}, {"t": 1130.3, "x": "引き下がった。"}, {"t": 1131.4333333333334, "x": "最高裁はそこを、\n支社長の側の過失として認定している。"}, {"t": 1135.1833333333334, "x": "一方で、地域官の側にも別の情報が入っていた。"}, {"t": 1138.5166666666667, "x": "配下の警察官から、橋の中が非常に混雑し、\n今後さらに混雑が増す不安があると報告されている。"}, {"t": 1145.1333333333334, "x": "そして、機動隊を入れる検討を\n求める、という内容だった。"}, {"t": 1148.9166666666667, "x": "機動隊は、近くにいたの。"}, {"t": 1150.8666666666666, "x": "最高裁によると、当日、会場とその周辺には\n管区機動隊員72人を含む150人以上の警察官がいた。"}, {"t": 1158.4166666666667, "x": "そして地域官は、署長らを\n介して、あるいは直接要請することで、"}, {"t": 1162.6, "x": "自分の判断で機動隊を動かせる立場にあった。"}, {"t": 1165.7833333333333, "x": "……呼べる立場だったのね。"}, {"t": 1167.4, "x": "最高裁はそう認定している。\nそのうえで、こう書いている。"}, {"t": 1170.8166666666666, "x": "しかし、被告人Ａは、\n午後8時ころの時点において、直ちに、"}, {"t": 1174.7666666666667, "x": "流入規制等を行うよう配下警察官を指揮するとともに\n機動隊の出動を要請する措置を講じなかった。"}, {"t": 1181.2, "x": "市の職員によると、地域官が「\n歩道橋の上に人が増えてきた、"}, {"t": 1185.1833333333334, "x": "詰まって動かない、どうするのか」と\n叫んで本部テントに入ってきた。"}, {"t": 1189.45, "x": "気づいてはいたのね。"}, {"t": 1190.7833333333333, "x": "気づいていた、という証言だ。"}, {"t": 1193.2833333333333, "x": "午後8時24分ころ。"}, {"t": 1195.0166666666667, "x": "110番通報を受けた兵庫県警本部の通信司令課が、\n明石警察署へ指令を出している。"}, {"t": 1200.55, "x": "「朝霧歩道橋人が多すぎて動けない。"}, {"t": 1202.8166666666666, "x": "数カ所で喧嘩している。」"}, {"t": 1204.4166666666667, "x": "午後8時29分ころ、通信司令課はもう一度動いている。"}, {"t": 1208.1833333333334, "x": "朝霧駅前で警戒していた班に、携帯電話で\n「歩道橋に急行するように」と指示した。"}, {"t": 1213.9166666666667, "x": "橋の上の人たちは、どうしていたの。"}, {"t": 1216.4333333333334, "x": "110番通報をする人が続出していた。"}, {"t": 1219.1833333333334, "x": "ただ、混雑のせいで電話が通じなかったり、\n通信の混雑や電波の状態でつながりにくかったりした。"}, {"t": 1225.3666666666666, "x": "橋の上では、怒鳴り声と、\n子どもたちの泣き声が聞こえていた。"}, {"t": 1229.1666666666667, "x": "群衆の中から、順番に駅の方へ\n「戻って下さい」と声を伝えていく人がいた。"}, {"t": 1234.45, "x": "ただ、駅の方に向かって「戻れ」という声と、\n海岸の方に向かって「戻れ」という声が混ざった。"}, {"t": 1240.7833333333333, "x": "……どっちにも「戻れ」って。"}, {"t": 1242.6, "x": "そんな中で、一人が「あかん。みんな戻れ！」と\n言ったのをきっかけに、一斉に掛け声が始まった。"}, {"t": 1248.6333333333334, "x": "「戻れ！戻れ！」。"}, {"t": 1249.75, "x": "これに応じて引き返す観客もいた。"}, {"t": 1252.0333333333333, "x": "ただし報告書はこう書いている。"}, {"t": 1253.7666666666667, "x": "密度の高い所では、その効果は感じられなかった。"}, {"t": 1257.2166666666667, "x": "橋の上の人たちが、南の階段の下にいる\n警察官の姿を見つけた。"}, {"t": 1262.0, "x": "そこで一斉に透明な板を叩いて、助けを求めた。"}, {"t": 1265.4333333333334, "x": "気づいてもらえた。"}, {"t": 1266.6666666666667, "x": "報告書の一行はこうだ。これに\n気付いてくれる警察官は無く、\n歩道橋上の観客らの意は通じなかった。"}, {"t": 1273.0833333333333, "x": "警備員の一人が、朝霧駅前にいた\n5人の警察官に頼んでいる。"}, {"t": 1277.3333333333333, "x": "「中で大変なことになっている。"}, {"t": 1279.1333333333334, "x": "子どもが窒息しそうになっているから\n何とかして欲しい」。"}, {"t": 1282.4833333333333, "x": "……返事は。"}, {"t": 1283.3333333333333, "x": "報告書には、こう書かれている。"}, {"t": 1285.1833333333334, "x": "警察官の返答はなかった。"}, {"t": 1287.8166666666666, "x": "ここで、橋の上にかかっていた力の話をする。"}, {"t": 1290.95, "x": "倒れる場面は話さない。かかっていた\n力を、数字で出す。"}, {"t": 1294.7, "x": "測れるものなの。"}, {"t": 1296.0, "x": "測れる。三つの方法で測っている。"}, {"t": 1298.3666666666666, "x": "一つ目。橋の南の端の手すりが、どれだけ\n曲がったか。そこから力を逆算した。"}, {"t": 1303.9, "x": "手すり1メートルあたり、最大158\nキログラムの力がかかっていた。"}, {"t": 1308.4, "x": "人が押し合っていた南北方向には、その約2.\n5倍、最大およそ400キログラムと推定される。"}, {"t": 1314.6166666666666, "x": "400キロ。"}, {"t": 1315.6833333333334, "x": "二つ目は、密度から出す方法だ。"}, {"t": 1318.0166666666667, "x": "事故現場の最高の群衆密度は、\n1平方メートルあたり13人から\n15人だったと推定されている。"}, {"t": 1324.25, "x": "三つ目は、過去の事故の鑑定書から出す方法だ。"}, {"t": 1327.2333333333333, "x": "8人から10人で押すと400キロ前後に達する。"}, {"t": 1330.5166666666667, "x": "三つを総合した結論はこうだ。"}, {"t": 1332.6, "x": "事故現場における群衆の圧力は、幅1\nメートルあたり400キログラム程度またはそれ以上。"}, {"t": 1338.1833333333334, "x": "それって、一人あたりだとどれくらいなの。"}, {"t": 1340.8, "x": "進行方向に2人が並んだ場合、\n1人につき200キログラム以上。"}, {"t": 1344.8, "x": "3人並んでも130キログラム以上。"}, {"t": 1347.4833333333333, "x": "大人でも胸部圧迫で立ったまま\n失神するということもありうるし、\nまして子供や高齢者にとっては"}, {"t": 1352.8833333333334, "x": "極めて危険な状態であった。"}, {"t": 1354.9, "x": "……立ったまま。"}, {"t": 1355.8833333333334, "x": "呼び方の話もしておく。"}, {"t": 1357.6, "x": "当時の報道では「将棋倒し」と言われた。"}, {"t": 1360.1666666666667, "x": "報告書の判断は違う。"}, {"t": 1361.9333333333334, "x": "「群衆なだれ」とするのが\n適当である、と書いている。"}, {"t": 1365.2333333333333, "x": "何が違うの。"}, {"t": 1366.4166666666667, "x": "将棋倒しは、倒れる方向が一方向で、\n1平方メートルあたり5人くらいでも起こりうる。"}, {"t": 1371.6833333333334, "x": "群衆なだれは、\n1平方メートルあたり10人以上の高密度でないと\n発生しない。"}, {"t": 1376.4666666666667, "x": "そして倒れる方向が一つではない。"}, {"t": 1378.5, "x": "弱いところに向かって、周囲から倒れ込むこともある。"}, {"t": 1381.8166666666666, "x": "起き方は三段階だ。まず、周囲から\n押されて身体が浮き上がるほどになる。"}, {"t": 1386.35, "x": "次に、密集の中に人のいない空隙ができると、\nつっかい棒がはずされた状態になる。"}, {"t": 1391.6333333333334, "x": "その空隙に向かって、バランスを\n失った人々が周囲から倒れこむ。"}, {"t": 1395.8833333333334, "x": "最後に、後ろから押す強い力が続くと、\n転倒はさらに大規模になる。"}, {"t": 1400.5, "x": "じゃあ、その空隙は何でできたの。"}, {"t": 1402.8, "x": "そこが、この報告書のいちばん慎重なところだ。"}, {"t": 1405.7, "x": "候補はいくつか挙げている。"}, {"t": 1407.2666666666667, "x": "子どもの転倒やうずくまり。"}, {"t": 1408.7666666666667, "x": "「戻れコール」による後退。"}, {"t": 1410.4, "x": "警察官が進入した際に群衆を排除したこと。"}, {"t": 1413.7, "x": "そのうえで、こう書いて終わっている。\n断定はできない。"}, {"t": 1416.8333333333333, "x": "決めていないのね。"}, {"t": 1418.0833333333333, "x": "決めていない。だから私も決めない。"}, {"t": 1420.3166666666666, "x": "ただし、過密な状態が生まれた\n要因のほうは、はっきり三つ挙げている。"}, {"t": 1424.55, "x": "一つ、橋の幅6メートルに対して\n階段の幅が3メートルしかなかったこと。"}, {"t": 1429.4166666666667, "x": "二つ、橋や階段の上で群衆が立ち止まって\n花火見物を始め、流れが止まったこと。"}, {"t": 1435.0, "x": "三つ、階段の下に夜店が並び、高い密度で人が\n滞留して、階段から降りるのを妨げたこと。"}, {"t": 1441.3666666666666, "x": "そして報告書は、ボトルネックの形成に\n大きく関わったのは三つ目だと書いている。"}, {"t": 1446.3833333333334, "x": "……夜店の位置。"}, {"t": 1447.45, "x": "4月から6月まで、11回の協議で繰り返し\n話し合われた、あの夜店の位置だ。"}, {"t": 1453.2166666666667, "x": "午後8時31分ころ、花火の打ち上げが終わった。"}, {"t": 1456.55, "x": "午後8時45分ころ、機動隊が\n橋の南側の階段の下に到着した。"}, {"t": 1461.5333333333333, "x": "階段の下にいた人を分けて、6人から7人が\n盾でバリケードを作り、階段を封鎖した。"}, {"t": 1467.3333333333333, "x": "そこで止めたのね。"}, {"t": 1468.65, "x": "止めた。ただし、このとき一つのことが起きている。"}, {"t": 1471.8, "x": "消防職員が、警察官に規制されて\n階段を上がれなかった。"}, {"t": 1475.7, "x": "そのため、階段の上が\nどうなっているかを把握できていない。"}, {"t": 1479.2, "x": "……消防が、上を見られなかったの。"}, {"t": 1481.3666666666666, "x": "報告書にそう書かれている。"}, {"t": 1483.0666666666666, "x": "階段の下では、盾の前で警備員と\n市の職員が「一方通行です。"}, {"t": 1487.3333333333333, "x": "上がれません」と広報していた。"}, {"t": 1489.3666666666666, "x": "機動隊員の一部は、人を\n分けながら48段の階段を登り、"}, {"t": 1493.2833333333333, "x": "エレベーターの前でバリケードを作ろうとしていた。"}, {"t": 1496.0666666666666, "x": "そのときに、大規模な転倒が起きた。"}, {"t": 1498.6333333333334, "x": "時刻は。"}, {"t": 1499.5166666666667, "x": "報告書は、午後8時45分ころから\n50分過ぎころ、と書いている。幅で書いている。"}, {"t": 1505.0, "x": "最高裁の決定は、午後8時48分ないし49分ころ、と\n書いている。点で書いている。"}, {"t": 1510.95, "x": "資料が違えば、書き方も違う。私は両方を出す。"}, {"t": 1514.4333333333334, "x": "起きた場所も特定されている。"}, {"t": 1516.1, "x": "橋の屋根の南の端から、北へ5メートル付近だ。"}, {"t": 1519.4666666666667, "x": "そこを起点に6人から7人が折り重なり、\nその山は1.5メートル近くに達した。"}, {"t": 1524.7333333333333, "x": "巻き込まれたのは、300人から\n400人と判断されている。"}, {"t": 1528.65, "x": "300人から400人。"}, {"t": 1530.4333333333334, "x": "午後9時ころ、朝霧駅側から橋に入った\n機動隊員が現場に着いて、救出に加わっている。"}, {"t": 1536.8166666666666, "x": "ここで、亡くなった11人のことを話す。"}, {"t": 1539.5333333333333, "x": "名前は出さない。報告書にも載っていないからだ。"}, {"t": 1542.4833333333333, "x": "載っているのは、年齢と性別と、死因だけだ。"}, {"t": 1545.3333333333333, "x": "報告書の表のとおりに読む。"}, {"t": 1547.2166666666667, "x": "0歳の女の子。2歳の男の子。"}, {"t": 1549.5166666666667, "x": "3歳の男の子。5歳の女の子。"}, {"t": 1552.0333333333333, "x": "7歳の男の子が2人。"}, {"t": 1553.6333333333334, "x": "8歳の女の子。9歳の男の子。9歳の女の子。"}, {"t": 1557.3666666666666, "x": "ここまでで9人だ。"}, {"t": 1558.8, "x": "……9人が。"}, {"t": 1559.7333333333333, "x": "そして、71歳の女性と、75歳の女性。"}, {"t": 1563.05, "x": "合わせて11人だ。"}, {"t": 1564.5, "x": "報告書の第3部には、この事故から\n出てきた言葉がある。「災害弱者」だ。"}, {"t": 1569.3166666666666, "x": "橋の上でいちばん力の弱い人たちに、\nいちばん強い力がかかった。"}, {"t": 1573.6666666666667, "x": "次に、けがをされた方の数だ。\nここは、資料によって数字が違う。"}, {"t": 1578.05, "x": "違うの。"}, {"t": 1578.9, "x": "一つは、明石市の報告書の247人だ。"}, {"t": 1582.1333333333334, "x": "2001年12月31日の時点で数えた数字になっている。"}, {"t": 1586.4, "x": "もう一つは、最高裁の決定に出てくる183名だ。"}, {"t": 1590.3833333333334, "x": "どっちが正しいの。"}, {"t": 1591.7166666666667, "x": "どちらも正しい。数えている範囲が違う。"}, {"t": 1594.2666666666667, "x": "最高裁のほうは、刑事事件として\n立件された範囲の数字だ。"}, {"t": 1598.1833333333334, "x": "明石市のほうは、その年の暮れまでに\n把握できた負傷者の数だ。"}, {"t": 1602.0833333333333, "x": "だから私は、片方を間違いとして\n消さない。両方を出す。"}, {"t": 1605.8833333333334, "x": "総患者数は258人。"}, {"t": 1607.7666666666667, "x": "女性が186人、男性が72人。"}, {"t": 1610.8666666666666, "x": "救急隊が搬送したのは84人で、\n16の病院に分かれて運ばれた。"}, {"t": 1615.6, "x": "救急の記録も時刻で残っている。"}, {"t": 1617.85, "x": "午後9時22分、神戸市消防局への応援要請。"}, {"t": 1621.05, "x": "そして午後10時50分、最後のけが人が搬送された。"}, {"t": 1625.1833333333334, "x": "事故から12日後の2001年8月2日、\n明石市に事故調査委員会が置かれた。"}, {"t": 1630.45, "x": "委員長は、弁護士の原田直郎さんだ。"}, {"t": 1632.95, "x": "大阪高等裁判所の長官をつとめた人だ。"}, {"t": 1635.9333333333334, "x": "副委員長は、京都大学防災研究所の河田惠昭さん。"}, {"t": 1639.7333333333333, "x": "ほかに、災害医学、建築人間工学、\n都市防災、法曹の専門家が4人。"}, {"t": 1644.8, "x": "合計6人の委員会だ。"}, {"t": 1646.6, "x": "会議は15回開かれた。"}, {"t": 1648.1666666666667, "x": "報告書が出たのは、2002年1月だ。"}, {"t": 1651.1, "x": "半年で、あれだけの厚さのものを。"}, {"t": 1653.4666666666667, "x": "本編だけで100ページを超える。"}, {"t": 1655.3333333333333, "x": "ただ、この委員会には、\n調べきれなかったところがある。"}, {"t": 1658.75, "x": "どこ。"}, {"t": 1659.4166666666667, "x": "警察だ。"}, {"t": 1660.2666666666667, "x": "照会しても、警察側からは"}, {"t": 1662.2833333333333, "x": "「捜査本部を設けて事故原因等の解明に\n向けて鋭意捜査中である」という回答だった。"}, {"t": 1667.5666666666666, "x": "関係職員の出席を要請したときも、\n同じ理由で応じてもらえなかった。"}, {"t": 1672.2833333333333, "x": "……委員会に、来てもらえなかったのね。"}, {"t": 1674.5833333333333, "x": "刑事事件から離れて事故を解明し、\n今後の事故防止を図ることは、"}, {"t": 1678.5833333333333, "x": "警察の使命にも沿うところと思われ、\n警察側の積極的な協力が望まれる。"}, {"t": 1683.7833333333333, "x": "そのうえで委員会は、予見できたかどうかを判断した。"}, {"t": 1686.9, "x": "結論は、予見できた、だ。"}, {"t": 1688.9666666666667, "x": "三者が、一般通常人の払うべき注意を用いるならば\n容易に知ることができた、という判断だ。"}, {"t": 1694.8, "x": "三者には注意義務があり、\nかつこれらの措置をとることが"}, {"t": 1697.7833333333333, "x": "可能であったこともまた明らかと\nいわなければならない。"}, {"t": 1700.8333333333333, "x": "それが委員会の判断だ。そのうえで、\n18項目の再発防止策が提言されている。"}, {"t": 1706.1833333333334, "x": "三つ目の提言はこうだ。"}, {"t": 1707.75, "x": "万一リスクを払拭、もしくは軽減できない場合は、"}, {"t": 1710.85, "x": "開催場所の再度の変更もしくは中止も\n視野に入れる必要がある。"}, {"t": 1714.9, "x": "中止も。"}, {"t": 1715.7333333333333, "x": "中止も、と書いてある。"}, {"t": 1717.1, "x": "八つ目は、警察の役割についてだ。"}, {"t": 1719.6666666666667, "x": "雑踏警備の実施は、\n主催者側の自主警備を原則としているが、"}, {"t": 1723.6666666666667, "x": "警備会社に何ら法的な権限を付与していない。"}, {"t": 1726.75, "x": "さらに、警察は、主催者側に対する指導、\n助言を積極的に行うことが明記されている。"}, {"t": 1732.65, "x": "したがって、主催者側が警察の指導、\n助言に明らかに従わなかった場合を除き、"}, {"t": 1737.8166666666666, "x": "事故が起こった場合の責任は最終的には\n雑踏警備のプロである警察にあるということになる。"}, {"t": 1743.4666666666667, "x": "……最終的には警察にある、と書いてあるのね。"}, {"t": 1746.4333333333334, "x": "明石市が作った委員会の報告書に、\nそう書かれている。"}, {"t": 1749.85, "x": "そして十八番目。地域の防災計画に\n「群衆事故対策」を入れること。"}, {"t": 1754.7333333333333, "x": "書き出しはこうだ。"}, {"t": 1755.8833333333334, "x": "安全なイベントの開催を目指すものの、事故発生確率を\nゼロにはできないことを明示しなければならない。"}, {"t": 1761.9666666666667, "x": "ゼロにはできない、と先に書け、ということだ。"}, {"t": 1765.4166666666667, "x": "ここから、国会の記録に移る。"}, {"t": 1767.5833333333333, "x": "2002年7月23日、\n衆議院の決算行政監視委員会第一分科会。"}, {"t": 1772.7166666666667, "x": "質問したのは、細野豪志さんだ。"}, {"t": 1774.9, "x": "答えたのは、\n当時の国家公安委員会委員長、村井仁さん。"}, {"t": 1778.9666666666667, "x": "村井大臣はこう言っていた。"}, {"t": 1780.5, "x": "催しをなさる方に一義的な責任があるということは、"}, {"t": 1783.7666666666667, "x": "自己責任というものを大事にする社会で、もっと\n強調されなければならないことではないか。"}, {"t": 1789.1833333333334, "x": "主催者の責任だ、ということね。"}, {"t": 1791.5666666666666, "x": "細野さんは、警察法2条と\n警察官職務執行法4条を挙げて、こう聞いた。"}, {"t": 1796.5333333333333, "x": "国民の生命財産を守るのは最終的には\n警察の責任だと、法律に書いてある。"}, {"t": 1801.7, "x": "今回の最終的な責任はどこにあるのか。"}, {"t": 1804.6333333333334, "x": "村井大臣の答えが、会議録に残っている。"}, {"t": 1807.5, "x": "あの公道における事件が公道の上であったからすべて"}, {"t": 1810.35, "x": "警察の責任だというのは、いささか\n論理の飛躍があるのではないか。"}, {"t": 1814.5333333333333, "x": "橋は市道だったのに。"}, {"t": 1816.0666666666666, "x": "第3章で覚えておいてほしいと言ったのは、\nここだ。この橋は市道、つまり公道だった。"}, {"t": 1821.35, "x": "やりとりはそのあとも続く。"}, {"t": 1822.8666666666666, "x": "村井大臣はこうも言っている。"}, {"t": 1824.6833333333334, "x": "私は、警察に責任がないなんとは全然言っていない。"}, {"t": 1828.1833333333334, "x": "そして、警察の責任として二つ挙げた。"}, {"t": 1831.0333333333333, "x": "一つ、不十分な計画のままこれを承認したという疑い。"}, {"t": 1834.7333333333333, "x": "二つ、当日の分断や迂回の指導について\n適切な措置をとらなかったこと。"}, {"t": 1839.45, "x": "そのうえで、こう結んでいる。"}, {"t": 1841.0166666666667, "x": "三者それぞれに責任があるんだろうと思っております。"}, {"t": 1844.1666666666667, "x": "同じ日、警察庁生活安全局長の黒澤正和さんが、\n夜店についてこう答えている。"}, {"t": 1849.9333333333334, "x": "露店については、歩道橋への観衆の集中防止や\n迂回路への観衆誘導等、"}, {"t": 1854.4166666666667, "x": "雑踏事故防止に配慮した出店について\n検討することも考慮すべきであった。"}, {"t": 1859.1833333333334, "x": "その年の11月1日には、\n生活安全局長の瀬川勝久さんが\n衆議院の内閣委員会で総括している。"}, {"t": 1866.3333333333333, "x": "主催者であります明石市、それから\nその委託を受けた警備会社、\nそして明石警察署という関係の三者が、いずれも"}, {"t": 1873.3166666666666, "x": "雑踏事故の危険性に対する認識が\n甘かったというふうに言わざるを得ない。"}, {"t": 1877.5, "x": "三者の関係者、合計12名を\n業務上過失致死傷罪で事件送致した。"}, {"t": 1882.3833333333334, "x": "12人。"}, {"t": 1883.25, "x": "兵庫県警察が警察関係者を\n懲戒処分にし、国家公安委員会が\n前の明石警察署長を懲戒処分にした。"}, {"t": 1890.3666666666666, "x": "2004年5月7日、衆議院内閣委員会。"}, {"t": 1893.2666666666667, "x": "山内おさむさんの発言だ。"}, {"t": 1895.2, "x": "この事件は、雑踏事故で初めて警察官が\n刑事事件に問われるということになりました。"}, {"t": 1900.6666666666667, "x": "初めて。"}, {"t": 1901.5666666666666, "x": "同じ日、地元選出の西村康稔さんは、"}, {"t": 1904.4833333333333, "x": "10歳未満の子ども9人を含む11人が\n亡くなった大変な惨事だ、と述べている。"}, {"t": 1910.35, "x": "最後まで残ったのは、明石警察署の地域官と、\n警備会社の大阪支社長の2人だ。"}, {"t": 1915.85, "x": "最高裁判所第一小法廷が、\n上告を退ける決定を出している。"}, {"t": 1920.1666666666667, "x": "裁判長裁判官は横田尤孝さん。"}, {"t": 1922.4833333333333, "x": "裁判官全員一致の意見だ。"}, {"t": 1924.5333333333333, "x": "決定の本文に氏名は書かれていない。"}, {"t": 1926.7, "x": "「被告人Ａ」「被告人Ｂ」とだけ書かれている。"}, {"t": 1929.8833333333334, "x": "最高裁は、何を認定したの。"}, {"t": 1932.2, "x": "時刻だ。"}, {"t": 1932.95, "x": "決定はこう書いている。"}, {"t": 1934.2, "x": "遅くとも午後8時ころまでには、\n歩道橋上の混雑状態は、"}, {"t": 1937.9833333333333, "x": "明石市職員及び警備員による自主警備に\nよっては対処し得ない段階に達していた。"}, {"t": 1943.0666666666666, "x": "そして、そのころまでには、二人とも、雑踏事故が\n発生することを容易に予見し得たものと認められる。"}, {"t": 1949.3666666666666, "x": "地域官には、直ちに配下警察官を\n指揮し、機動隊の出動を要請すべき\n業務上の注意義務があった。"}, {"t": 1955.85, "x": "支社長には、明石市の担当者らに警察官の出動要請を\n進言し、または自ら要請すべき注意義務があった。"}, {"t": 1962.95, "x": "それで、防げたと言えるの。"}, {"t": 1964.85, "x": "そこが、この決定のいちばん有名なところだ。"}, {"t": 1967.55, "x": "決定の文をそのまま読む。"}, {"t": 1969.2833333333333, "x": "機動隊に対して遅くとも午後8時10分ころまでに\n出動指令があったならば、機動隊は、"}, {"t": 1974.6, "x": "花火大会終了が予定される\n午後8時30分ころよりも前に歩道橋に到着し。"}, {"t": 1979.8333333333333, "x": "階段下から歩道橋内に流入する\n参集者の流れを阻止し、"}, {"t": 1983.3666666666666, "x": "南端部付近にいる参集者の北進を禁止する\n広報をし、階段上の参集者を階段下に誘導し。"}, {"t": 1989.5666666666666, "x": "さらに、北側からの参集者の流入を規制して\n北側への誘導を行うことなどにより、"}, {"t": 1994.65, "x": "滞留自体の激化を防止し。"}, {"t": 1996.6333333333334, "x": "これによって、群衆なだれによって\n多数の死傷者を生じさせた本件事故は、"}, {"t": 2001.0166666666667, "x": "回避することができたと認められる。"}, {"t": 2003.4, "x": "午後8時10分。"}, {"t": 2004.75, "x": "事故が起きたのが、\n午後8時48分ないし49分ころだ。その38分前だ。"}, {"t": 2010.3833333333334, "x": "そして決定は、こう結んでいる。"}, {"t": 2012.4666666666667, "x": "雑踏事故はないものと軽信し、"}, {"t": 2014.3166666666666, "x": "上記各注意義務を怠って結果を回避する\n措置を講じることなく漫然放置し、"}, {"t": 2019.0, "x": "本件事故を発生させて多数の参集者に\n死傷の結果を生じさせた。"}, {"t": 2023.3833333333334, "x": "被告人両名には、いずれも\n業務上過失致死傷罪が成立する。"}, {"t": 2027.5, "x": "ここで、この2人の刑事責任は確定した。"}, {"t": 2031.05, "x": "ただ、送致されたのは12人だった。"}, {"t": 2033.3166666666666, "x": "全員が起訴されたわけではない。"}, {"t": 2035.2833333333333, "x": "不起訴になった人について、\n検察審査会に申し立てが行われている。"}, {"t": 2039.8, "x": "検察審査会って、何をするところなの。"}, {"t": 2042.6666666666667, "x": "くじで選ばれた市民が、検察官の不起訴が\n妥当だったかを審査する仕組みだ。"}, {"t": 2047.35, "x": "2006年6月9日、衆議院議員の河村たかしさんが、\n質問主意書を出している。"}, {"t": 2052.9333333333334, "x": "件名は「明石花火大会歩道橋事故の責任追及に\n関する質問主意書」。"}, {"t": 2057.733333333333, "x": "質問第326号だ。"}, {"t": 2060.0, "x": "一つ目の質問はこうだ。"}, {"t": 2061.7, "x": "検察審査会において、これまで\n同一事案で二度起訴相当議決が\nなされている事案の数は何件あるか。"}, {"t": 2067.9666666666667, "x": "答弁書が、11日後の6月20日に出ている。"}, {"t": 2071.0333333333333, "x": "内閣総理大臣、小泉純一郎さんの名前だ。"}, {"t": 2074.3333333333335, "x": "法務省に保存されている関連資料により\n確認することができた昭和五十三年以降では。"}, {"t": 2079.6, "x": "検察官の不起訴処分に"}, {"t": 2081.15, "x": "関し検察審査会において起訴相当の議決がされ、\nその事件について検察官が行った再度の不起訴処分に"}, {"t": 2087.6, "x": "関して、さらに起訴相当の議決がされた件数は。"}, {"t": 2090.9666666666667, "x": "御指摘の事故に関して\n平成十七年にされた一件であり、"}, {"t": 2094.5, "x": "二回目の起訴相当の議決を受けて検察官に\nよる再度の処分が行われた例はない。"}, {"t": 2099.7, "x": "……昭和53年から、一件だけ。"}, {"t": 2102.15, "x": "市民が選ばれて、二度「起訴すべきだ」と\n議決した事案は、この事故しかなかった。"}, {"t": 2107.3333333333335, "x": "質問主意書には、こういう項目もある。"}, {"t": 2109.8, "x": "明石の事件では、五年目の時効が近付いている。"}, {"t": 2112.6833333333334, "x": "事実と証拠だけに基づいて、一切の予断を\n排除し、適切な判断をするべきではないか。"}, {"t": 2118.4166666666665, "x": "これに対する答弁は、こうだ。"}, {"t": 2120.366666666667, "x": "御指摘の事件の処分については、"}, {"t": 2122.35, "x": "個別具体的な事件における捜査機関の活動内容に\nかかわる事柄であり、答弁を差し控えたい。"}, {"t": 2128.483333333333, "x": "この時点の状況も、答弁書に書かれている。"}, {"t": 2131.266666666667, "x": "起訴された者については大阪高等裁判所に\nおいて公判が係属しており、"}, {"t": 2135.55, "x": "不起訴とされた者については\n神戸地方検察庁において捜査中である。"}, {"t": 2139.9, "x": "それで、そのあとは。"}, {"t": 2141.383333333333, "x": "ここで止める。"}, {"t": 2142.3, "x": "この先、不起訴だった人の刑事手続が\nどうなったかについて、私は\n一次資料に行き着けていない。"}, {"t": 2148.4166666666665, "x": "判決や決定の原本を、自分の目で\n読めていない。だから、この回では話さない。"}, {"t": 2153.5666666666666, "x": "報道なら、あるんじゃないの。"}, {"t": 2155.4, "x": "あるだろう。ただ、この回では使わない。"}, {"t": 2157.8166666666666, "x": "原本を読めていないことを、読めたことのように\n話すのが、いちばんやってはいけないことだ。"}, {"t": 2163.016666666667, "x": "私が確かめられたのは、\n2006年6月20日の答弁書までだ。"}, {"t": 2168.016666666667, "x": "整理する。"}, {"t": 2168.8166666666666, "x": "幅6メートルの橋の先に、幅3メートルの階段があった。"}, {"t": 2172.616666666667, "x": "1時間に1万4000人通せる計算の出口が、\n当日は1時間に3600人しか流していなかった。"}, {"t": 2179.4, "x": "橋の上には、およそ6400人が乗っていた。"}, {"t": 2182.55, "x": "半年前の同じ場所で、同じことが起きかけていた。"}, {"t": 2185.633333333333, "x": "報告書に残っていたが、共有されなかった。"}, {"t": 2188.6666666666665, "x": "11回の協議で話し合われたのは、\n夜店をどこに置くかだった。"}, {"t": 2192.5, "x": "警備計画書は、292人を暴走族対策に、\n36人を雑踏対策に割り当てていた。"}, {"t": 2198.6, "x": "橋には0人だった。"}, {"t": 2200.2166666666667, "x": "消防には、その計画書が渡っていなかった。"}, {"t": 2203.116666666667, "x": "当日、橋に入る人を止めようという提案は、\n少なくとも4回出て、4回とも通らなかった。"}, {"t": 2209.2, "x": "午後8時、二人の責任者が、\n橋の上の状態を認識していた。"}, {"t": 2213.5, "x": "午後8時10分、機動隊への指令があれば\n間に合ったと、最高裁は認定した。"}, {"t": 2218.2833333333333, "x": "午後8時48分ないし49分ころ、群衆なだれが起きた。"}, {"t": 2222.5, "x": "11人が亡くなり、そのうち9人が\n10歳になっていない子どもだった。"}, {"t": 2226.883333333333, "x": "……全部、前に書いてあったことね。"}, {"t": 2229.0666666666666, "x": "そうだ。ほとんどが、事故の前から紙の上にあった。"}, {"t": 2232.266666666667, "x": "足りなかったのは、それを一つにして読む人だ。"}, {"t": 2235.3333333333335, "x": "一つにして読む人。"}, {"t": 2236.9333333333334, "x": "そうだ。"}, {"t": 2237.55, "x": "ここで、話の出どころを並べておく。"}, {"t": 2239.9333333333334, "x": "事故の経緯と数字は、明石市が\n公開している事故調査報告書。"}, {"t": 2243.9166666666665, "x": "刑事裁判の認定は、最高裁判所の決定の全文。"}, {"t": 2247.3, "x": "裁判所のウェブサイトで読める。"}, {"t": 2249.1666666666665, "x": "国会の発言は、\n国立国会図書館の国会会議録検索システム。"}, {"t": 2253.85, "x": "検察審査会の件は、\n2006年の質問第326号と、その答弁書。"}, {"t": 2259.35, "x": "報道でしか確認できないことは、\nこの回では話していない。"}, {"t": 2263.0833333333335, "x": "ぜんぶ、読めるものなのね。"}, {"t": 2264.9166666666665, "x": "ぜんぶ、読める。"}, {"t": 2266.05, "x": "そのうえで、報告書の第3部から\n一文だけ引いて終わる。"}, {"t": 2269.55, "x": "雑踏する会場やその周辺にいる人々は、"}, {"t": 2272.233333333333, "x": "自分の周りのごく限られた空間で起こっていることしか\n認識できないという情報過疎の状態に置かれる。"}, {"t": 2278.35, "x": "……情報過疎。"}, {"t": 2279.4166666666665, "x": "橋の上にいた人には、橋の外が見えない。"}, {"t": 2282.3166666666666, "x": "外が見えない。"}, {"t": 2283.4333333333334, "x": "離れた場所にいる警備の人にも、いちばん\n混んでいる所のことは分からない。"}, {"t": 2287.883333333333, "x": "どちらからも、見えていないのね。"}, {"t": 2290.0, "x": "見えていない。"}, {"t": 2290.8, "x": "だから報告書は、事前の準備が\n大切なのだと結んでいる。"}, {"t": 2294.5333333333333, "x": "当日その場でできることは、\nもうほとんど残っていない。"}, {"t": 2297.883333333333, "x": "……当日にできることは、そんなに少ないのね。"}, {"t": 2300.8166666666666, "x": "報告書は、そう書いている。"}, {"t": 2302.6, "x": "この事故について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
