<script>
const D={"name": "146", "file": "146_編集用", "dur": 2026.21665625, "segs": [], "subs": [{"t": 0.0, "x": "1952年4月28日、参議院の法務委員会。"}, {"t": 4.033333333333333, "x": "議員が政府に、ある資料を出してほしいと\n求めていた。"}, {"t": 7.216666666666667, "x": "戦争中のスパイ事件の記録だ。"}, {"t": 9.433333333333334, "x": "法務府の局長はこう答えている。"}, {"t": 11.5, "x": "「資料がそれぞれ手許にございません」。"}, {"t": 13.55, "x": "関係者で話し合った「記憶という程度」だと。"}, {"t": 16.733333333333334, "x": "記録が無いから、出せないってこと？"}, {"t": 19.066666666666666, "x": "そうだ。ところがその8か月前の話がある。"}, {"t": 22.0, "x": "1951年8月、アメリカの首都ワシントン。"}, {"t": 25.483333333333334, "x": "下院の委員会で、1人の日本の検事が宣誓していた。"}, {"t": 28.983333333333334, "x": "10年前にその事件の取り調べを指揮した人だ。"}, {"t": 32.18333333333333, "x": "日本では記録が無いのにアメリカでは話してたの？"}, {"t": 35.21666666666667, "x": "そういうことになる。"}, {"t": 36.4, "x": "事件の名前はゾルゲ事件。"}, {"t": 38.1, "x": "1941年に東京で発覚した、ソ連の諜報の事件だ。"}, {"t": 42.55, "x": "今回は事件の中身より、戦後の記録の行方を追う。"}, {"t": 45.78333333333333, "x": "捕まえた側の何人かは戦後に公職から追放された。"}, {"t": 49.28333333333333, "x": "書類の一部は占領軍の手に渡った。"}, {"t": 51.68333333333333, "x": "そして1979年、国会でこう答弁される。"}, {"t": 55.21666666666667, "x": "判決の原本も事件の記録も「散逸」している。"}, {"t": 58.81666666666667, "x": "判決まで無くなったの？"}, {"t": 60.516666666666666, "x": "局長は最後に「見つかるまで捜します」と言った。"}, {"t": 63.8, "x": "材料は国会の会議録と、\nアメリカ下院の公聴会の記録だ。"}, {"t": 67.78333333333333, "x": "ゾルゲを英雄とも悪人とも決めずに読んでいく。"}, {"t": 70.6, "x": "記録がどこへ行ったか、なのね。"}, {"t": 72.75, "x": "そうだ。まずは1941年の東京から始めよう。"}, {"t": 77.08333333333333, "x": "リヒャルト・ゾルゲは、\nドイツの新聞の記者として東京にいた。"}, {"t": 80.56666666666666, "x": "日本の情報局が出した、\n外国の通信員の身分証明票が残っている。"}, {"t": 85.2, "x": "日付は昭和16年7月4日、番号は46号。"}, {"t": 88.78333333333333, "x": "顔写真が貼ってある。"}, {"t": 90.21666666666667, "x": "新聞の名前は、フランクフルター・ツァイトゥングだ。"}, {"t": 93.13333333333334, "x": "ちゃんと日本の役所が認めた記者だったのね。"}, {"t": 96.0, "x": "そうだ。しかもドイツ大使館に出入りしていた。"}, {"t": 98.8, "x": "のちの国会の答弁では\n「駐日ドイツ大使顧問」と呼ばれている。"}, {"t": 102.81666666666666, "x": "公聴会で検事は正式な役職は無かったと証言した。"}, {"t": 106.41666666666667, "x": "それでも、\nオット大使の最高の相談役の1人だったという。"}, {"t": 110.21666666666667, "x": "大使の相談相手が別の国の諜報員だったの？"}, {"t": 113.36666666666666, "x": "検事の証言では大使は「完全にだまされていた」。"}, {"t": 116.5, "x": "もう1人の中心が日本人の尾崎秀実だ。"}, {"t": 119.28333333333333, "x": "1980年の答弁では「当時の内閣の嘱託」とされる。"}, {"t": 123.66666666666667, "x": "公聴会で吉河は、\n近衛首相の相談役の集まりの1人だったと述べた。"}, {"t": 128.45, "x": "記者と内閣の相談役ね。"}, {"t": 130.46666666666667, "x": "防衛研究所の文書では、2人が上海で\n引き合わされたのは1930年の末だ。"}, {"t": 135.91666666666666, "x": "ゾルゲが日本に入ったのは1933年9月だ。"}, {"t": 139.51666666666668, "x": "赤軍の情報部の命令による、と同じ文書にある。"}, {"t": 142.8, "x": "8年も東京で記者をしてたのね。"}, {"t": 145.11666666666667, "x": "この8年分のことは今回はほとんど扱わない。"}, {"t": 148.15, "x": "扱うのは捕まったあとに作られた書類のほうだ。"}, {"t": 151.71666666666667, "x": "防衛研究所の文書は検挙の流れをこう書いている。"}, {"t": 154.78333333333333, "x": "1941年9月末から、関係者の検挙が始まった。"}, {"t": 159.1, "x": "10月中旬、尾崎と\nドイツ人の電信技師クラウゼンが捕まる。"}, {"t": 163.0, "x": "ユーゴスラビア人の記者ヴーケリッチも一緒だ。"}, {"t": 165.61666666666667, "x": "沖縄出身の画家、宮城与徳も含まれていた。"}, {"t": 168.88333333333333, "x": "国籍がばらばらね。"}, {"t": 170.4, "x": "ドイツ、ユーゴスラビア、日本、\nそれにアメリカ帰りの日本人だ。"}, {"t": 174.35, "x": "1979年の国会で、法務省の刑事局長が\n人数を答えている。"}, {"t": 179.26666666666668, "x": "外国人が4人、日本人がおよそ30人。"}, {"t": 182.18333333333334, "x": "1934年ごろから機密を\n集めていた、という内容だった。"}, {"t": 186.51666666666668, "x": "30人って思ったより多いのね。"}, {"t": 188.68333333333334, "x": "使われた法律も1つではない。"}, {"t": 190.71666666666667, "x": "国防保安法、軍機保護法、\n軍用資源秘密保護法、治安維持法。"}, {"t": 195.13333333333333, "x": "4つの法律の違反で起訴された、と局長は述べた。"}, {"t": 198.61666666666667, "x": "4つも並ぶとどれが何だか分からないわ。"}, {"t": 201.2, "x": "大きく言えば、国の秘密を外へ\n漏らした罪と、思想の罪だ。"}, {"t": 205.18333333333334, "x": "この「思想」の部分が戦後に意味を持ってくる。"}, {"t": 208.11666666666667, "x": "覚えておいてほしい。"}, {"t": 209.88333333333333, "x": "ではどうやって発覚したのか。"}, {"t": 211.75, "x": "ここからは、1951年の公聴会で\n検事が語った話になる。"}, {"t": 216.36666666666667, "x": "検事の名前は吉河光貞。"}, {"t": 218.38333333333333, "x": "事件のとき東京の検事局にいて、\n捜査の主任の1人だった。"}, {"t": 222.45, "x": "吉河によれば、始まりは1941年の春だ。"}, {"t": 226.16666666666666, "x": "アメリカから帰ってきた1人の女性に、\nスパイの疑いがかかった。"}, {"t": 230.11666666666667, "x": "ただ、証拠は見つからなかったという。"}, {"t": 232.53333333333333, "x": "じゃあ、そこで終わり？"}, {"t": 233.93333333333334, "x": "10月にある情報が入って女性を検挙した。"}, {"t": 236.71666666666667, "x": "女性はスパイを否定したが、\n別の人物の名前を出した。"}, {"t": 240.26666666666668, "x": "それが画家の宮城与徳だった。"}, {"t": 242.3, "x": "画家がスパイ？"}, {"t": 243.45, "x": "宮城の家を調べると妙な物が出てきた。"}, {"t": 245.98333333333332, "x": "英語で書かれた満鉄の書類で、\n政府の秘密の資料だった。"}, {"t": 249.78333333333333, "x": "絵描きの家に満鉄の秘密の書類ね。"}, {"t": 252.31666666666666, "x": "吉河は「画家が持つのは変だと思った」と\n証言している。"}, {"t": 256.06666666666666, "x": "宮城は否定を続けた。"}, {"t": 257.6, "x": "築地の警察署の2階で調べていたときのことだ。"}, {"t": 260.73333333333335, "x": "宮城は窓から外へ飛び出した。"}, {"t": 262.73333333333335, "x": "けがは無く、追いかけた\n警察官がすぐに取り押さえた。"}, {"t": 265.98333333333335, "x": "そのあと宮城は話し始めた、と吉河は言う。"}, {"t": 268.9166666666667, "x": "いちばん近い仲間として名前が\n出たのが、尾崎秀実だった。"}, {"t": 272.76666666666665, "x": "首相の相談役の名前が出てきたら、困るわよね。"}, {"t": 276.1, "x": "吉河も「とても驚いた」と証言している。"}, {"t": 279.03333333333336, "x": "首相に近すぎて進めてよいか迷ったという。"}, {"t": 282.4166666666667, "x": "尾崎は目黒の警察署で調べられ、\nその日のうちに認めた。"}, {"t": 286.15, "x": "尾崎の後ろに何人もの外国人がいることが分かる。"}, {"t": 289.3666666666667, "x": "吉河の証言では、ちょうど\n近衛内閣が総辞職した頃だ。"}, {"t": 293.18333333333334, "x": "次の内閣でも同じ司法大臣が残ると分かっていた。"}, {"t": 296.53333333333336, "x": "その大臣の了承をとって外国人の検挙に入った。"}, {"t": 299.95, "x": "外国人を捕まえるのはそんなに大ごとなの？"}, {"t": 302.8, "x": "相手はドイツ大使館に出入りする記者だからな。"}, {"t": 305.51666666666665, "x": "クラウゼンの家で、いちばん\n探したのは無線の機械だ。"}, {"t": 308.75, "x": "吉河は「幸い見つかった」と言っている。"}, {"t": 311.5, "x": "暗号にした電文とこれから暗号にする電文も出た。"}, {"t": 314.6666666666667, "x": "そして暗号の鍵の本。"}, {"t": 316.06666666666666, "x": "ドイツの統計年鑑だ。"}, {"t": 317.81666666666666, "x": "統計の本が暗号の鍵？"}, {"t": 319.6166666666667, "x": "3冊組で吉河が手に取ると使い込んだ跡があった。"}, {"t": 322.9166666666667, "x": "ページの数字を足して、解読を難しくしていたという。"}, {"t": 326.21666666666664, "x": "クラウゼンはゾルゲより先にそれを認めた。"}, {"t": 328.68333333333334, "x": "ゾルゲの家は数日見張ってから踏み込んだ。"}, {"t": 331.21666666666664, "x": "拳銃で撃ってくるのを心配した、と吉河は述べている。"}, {"t": 334.7, "x": "映画みたいね。"}, {"t": 335.8333333333333, "x": "捕まったゾルゲは、自分は\nナチスだと言い張ったそうだ。"}, {"t": 339.03333333333336, "x": "ドイツ大使館の高い地位の顧問だ、とも。"}, {"t": 342.35, "x": "取り調べは吉河が自分で受け持った。"}, {"t": 344.71666666666664, "x": "ゾルゲは強く否定した。"}, {"t": 346.3, "x": "吉河はほかの人の自白と証拠を少しずつ伝えた。"}, {"t": 349.7, "x": "無線の機械を押さえたことも本人に伝えている。"}, {"t": 352.5833333333333, "x": "1週間たった土曜日の夕方だったという。"}, {"t": 355.1333333333333, "x": "ゾルゲは紙と鉛筆を求めた。"}, {"t": 357.1166666666667, "x": "そしてドイツ語でこう書いて渡した。"}, {"t": 359.21666666666664, "x": "「1925年から国際共産主義者である」。"}, {"t": 362.5, "x": "自分で書いて渡したの？"}, {"t": 364.18333333333334, "x": "吉河の証言ではそうだ。"}, {"t": 365.75, "x": "上着を脱いで、こう叫んだとも言う。"}, {"t": 367.9, "x": "負けたのは初めてだ、と。"}, {"t": 369.75, "x": "本当にそう言ったのかしら。"}, {"t": 371.56666666666666, "x": "それを確かめる記録は、\nこの公聴会の証言しか今回は持っていない。"}, {"t": 375.8333333333333, "x": "だから「吉河がそう証言した」とだけ言っておく。"}, {"t": 379.06666666666666, "x": "委員は無理に言わせなかったかとも聞いた。"}, {"t": 381.35, "x": "吉河の答えは「いいえ」の一言だった。"}, {"t": 384.1666666666667, "x": "これも本人の言葉として置いておく。"}, {"t": 386.5, "x": "捕まえた側の話だけ、ってことね。"}, {"t": 389.06666666666666, "x": "そうだ。この回の記録の多くは、\n捕まえた側が残したものだ。"}, {"t": 393.65, "x": "ゾルゲが捕まってドイツ大使館は大騒ぎになった。"}, {"t": 396.7, "x": "吉河の証言では、オット大使夫妻は\nとても驚いて怒った。"}, {"t": 400.48333333333335, "x": "大使は司法大臣を通じて、\nゾルゲに会わせてほしいと求めた。"}, {"t": 404.3833333333333, "x": "取り調べの途中なのに？"}, {"t": 406.06666666666666, "x": "吉河たちも困った、と言っている。"}, {"t": 408.35, "x": "自白のあと、吉河はゾルゲに、\n大使に会いたいかと聞いた。"}, {"t": 411.98333333333335, "x": "ゾルゲは最初、会いたくないと答えた。"}, {"t": 414.3833333333333, "x": "吉河は、日本人なら最後の\nあいさつに会うだろう、と勧めた。"}, {"t": 418.28333333333336, "x": "短い面会のあと、ゾルゲは大使に、\nこれが最後になると告げた。"}, {"t": 422.4166666666667, "x": "大使はどうしたの？"}, {"t": 423.71666666666664, "x": "顔色が変わった、と吉河は言っている。"}, {"t": 426.15, "x": "大使はもうこの件には口を出さないと約束した。"}, {"t": 429.1666666666667, "x": "ただ、早く調べを終えて結果を\n知らせてほしいと頼んだ。"}, {"t": 432.56666666666666, "x": "それでも大使館の側から、\n圧力らしきものがあったという。"}, {"t": 436.1333333333333, "x": "そこで日本側は取り調べの記録の第1章を写した。"}, {"t": 439.43333333333334, "x": "司法大臣を通じて、その写しを\nドイツ大使館に送ったと述べている。"}, {"t": 443.75, "x": "記録の写しが外国の大使館へ？"}, {"t": 446.1, "x": "吉河の証言ではそうだ。その写しが\nその後どうなったかは、記録に出てこない。"}, {"t": 450.8333333333333, "x": "これが、この事件の書類が外へ出た最初の話になる。"}, {"t": 454.3, "x": "外国へ渡る書類の話は、戦後にもう1度出てくる。"}, {"t": 457.85, "x": "今度は、どこの国へ？"}, {"t": 459.5, "x": "アメリカだ。それも軍と議会の両方へ渡っていく。"}, {"t": 463.21666666666664, "x": "ゾルゲは通訳を付けるのを嫌がったという。"}, {"t": 465.6, "x": "吉河はドイツ語も英語も\n片言だった、と自分で言っている。"}, {"t": 469.23333333333335, "x": "分からない所はゾルゲが紙に書いて説明した。"}, {"t": 472.18333333333334, "x": "数日たつと、ゾルゲは話した\n中身をタイプで打ち始めた。"}, {"t": 475.95, "x": "取調室でタイプライター？"}, {"t": 477.8666666666667, "x": "家から押収した、本人のタイプライターだったそうだ。"}, {"t": 481.0833333333333, "x": "打ち終えると読み返して目の前で直して渡した。"}, {"t": 483.9, "x": "原本は1部だけだった、と吉河の宣誓書にある。"}, {"t": 487.1666666666667, "x": "翻訳は外国語学校の教授が受け持った。"}, {"t": 489.9, "x": "宣誓してから日本語に直し教授と吉河が署名した。"}, {"t": 493.48333333333335, "x": "手記とその日本語訳ね。"}, {"t": 495.28333333333336, "x": "司法省の刑事局はその訳を冊子に刷った。"}, {"t": 498.1, "x": "1942年2月と4月の2冊だ。"}, {"t": 500.93333333333334, "x": "公聴会の英訳では「ゾルゲ事件資料」とある。"}, {"t": 504.03333333333336, "x": "これとは別に正式な尋問の調書も作られた。"}, {"t": 507.06666666666666, "x": "吉河の証言ではおよそ38冊になった。"}, {"t": 510.03333333333336, "x": "1冊ずつ教授がドイツ語で\n読み聞かせ、ゾルゲが署名した。"}, {"t": 513.75, "x": "38冊も！"}, {"t": 515.1166666666667, "x": "完成は1942年6月ごろ、と吉河は言っている。"}, {"t": 519.05, "x": "つまり書類には少なくとも3つの山があった。"}, {"t": 521.8666666666667, "x": "本人が打った手記、刷られた\n冊子、そして38冊の調書だ。"}, {"t": 526.0666666666667, "x": "この3つが戦後それぞれ別の道をたどる。"}, {"t": 529.2666666666667, "x": "1979年の局長の答弁では、判決は\n1943年から1944年にかけて確定した。"}, {"t": 536.9333333333333, "x": "ゾルゲと尾崎は死刑。"}, {"t": 538.3333333333334, "x": "ほかに2人が無期懲役、12人が懲役2年から15年。"}, {"t": 542.2833333333333, "x": "死刑が2人……。"}, {"t": 543.4, "x": "防衛研究所の文書は、死刑の執行を\n1944年11月としている。"}, {"t": 548.45, "x": "ヴーケリッチと宮城は、拘置中か服役中に亡くなった。"}, {"t": 552.1, "x": "判決の前に亡くなった人もいるの？"}, {"t": 554.55, "x": "1979年の答弁では、宮城は\n病死のため判決の言い渡しが無い。"}, {"t": 559.4666666666667, "x": "ほかにもう1人、亡くなって\n言い渡しが無かった人がいる。"}, {"t": 562.85, "x": "名前と刑の一覧も読み上げられたが、\nここでは人数だけにしておく。"}, {"t": 566.85, "x": "1952年の国会で、ある議員がこの裁判に触れている。"}, {"t": 570.85, "x": "国家の機密を漏らした事件でさえ、\n弁護人は付けられた、と。"}, {"t": 574.65, "x": "外務公務員法案の審査で、\n弁護人を付けない条文に反対した場面だ。"}, {"t": 579.35, "x": "反対の理由にゾルゲ事件を持ち出したのね。"}, {"t": 582.1333333333333, "x": "1967年には別の議員がこう言っている。"}, {"t": 585.35, "x": "尾崎は「ほとんど国民の知らないうちに」\n死刑にされた、と。"}, {"t": 589.1666666666666, "x": "戦争中、事件はほとんど\n知らされなかったという言い方だ。"}, {"t": 592.8333333333334, "x": "知らないうちに始まって、\n知らないうちに終わったのね。"}, {"t": 596.0666666666667, "x": "そして1945年の夏、戦争が終わる。"}, {"t": 599.9833333333333, "x": "戦争の終わりに役所の書類は大量に失われた。"}, {"t": 603.05, "x": "1952年の国会で、法務府の局長はこう説明している。"}, {"t": 607.3333333333334, "x": "軍機保護法の事件の記録は「全部焼失」した。"}, {"t": 610.7666666666667, "x": "終戦の時の火災とその後の整理でなくなった、と。"}, {"t": 614.1333333333333, "x": "整理で、なくなったの？"}, {"t": 615.7666666666667, "x": "局長の言葉では「火災とその後の整理」だ。"}, {"t": 618.75, "x": "統計だけは残っていたが、1943年まで。"}, {"t": 622.2833333333333, "x": "1944年から1945年の前半の統計も焼けた、という。"}, {"t": 627.2, "x": "これは軍機保護法の事件全体についての答弁だ。"}, {"t": 630.3, "x": "ゾルゲ事件の調書については、\n吉河が公聴会で語っている。"}, {"t": 634.1666666666666, "x": "38冊の調書の写しは作らなかった。"}, {"t": 637.0, "x": "そして調書は火事で\n失われたのではないか、と述べた。"}, {"t": 640.3833333333333, "x": "空襲で？"}, {"t": 641.5166666666667, "x": "委員もそう聞いた。吉河の答えは「おそらく」だった。"}, {"t": 645.0, "x": "確かではない、という答え方だ。"}, {"t": 647.2333333333333, "x": "38冊がおそらく焼けた……。"}, {"t": 649.3166666666667, "x": "ただし刷られた冊子は残っていた。"}, {"t": 651.4166666666666, "x": "そして吉河自身も手元に紙を持っていた。"}, {"t": 654.2, "x": "その紙は1949年、思いがけない\n相手に渡ることになる。"}, {"t": 659.1166666666667, "x": "その前に戦後の「公職追放」の話をしておく。"}, {"t": 662.5166666666667, "x": "占領軍の方針で、戦争に深く\n関わった人は役所から外された。"}, {"t": 667.0166666666667, "x": "思想を取り締まった警察や検事も対象になった。"}, {"t": 670.2, "x": "ゾルゲ事件を捕まえた人たちは？"}, {"t": 672.4666666666667, "x": "1952年2月の参議院にその答えの1つがある。"}, {"t": 676.25, "x": "人事官の候補になった人の、\n内務省時代の経歴が問われた。"}, {"t": 680.3, "x": "戦争中、内務省の警保局で外事課長をしていた人だ。"}, {"t": 684.05, "x": "官房長官は、この人が追放された理由をこう説明した。"}, {"t": 687.8166666666667, "x": "ゾルゲ事件の処理で重要な役割を\n演じた、という指定だった。"}, {"t": 691.65, "x": "捕まえたから追放？"}, {"t": 693.1833333333333, "x": "そうなる。ところが続きがある。"}, {"t": 695.1, "x": "1950年10月、訴願委員会で追放は解除された。"}, {"t": 699.0666666666667, "x": "理由の1つは、事件そのものの見方が変わったことだ。"}, {"t": 702.5333333333333, "x": "官房長官は「純然たるスパイ事件」と言っている。"}, {"t": 705.8166666666667, "x": "「思想的背景を持たない」とも付け加えた。"}, {"t": 708.7, "x": "さっきの、思想の罪の話ね。"}, {"t": 711.0333333333333, "x": "そうだ。官房長官の説明を並べるとこうなる。"}, {"t": 714.0666666666667, "x": "思想の事件なら追放、ただのスパイ事件なら解除。"}, {"t": 717.35, "x": "追放の指定では「重要思想刑事事件」と\n書かれていた、と官房長官は認めている。"}, {"t": 722.7333333333333, "x": "同じ事件の呼び方が、数年で\n入れ替わったことになる。"}, {"t": 726.1, "x": "外事課は連絡と協力だけだった、とも\n官房長官は答えた。"}, {"t": 730.0833333333334, "x": "捜査は「殆んど検事局が直接」やった、とも。"}, {"t": 733.5833333333334, "x": "ところが自分が指揮したと名乗った人もいる。"}, {"t": 736.25, "x": "1949年4月、参議院の法務委員会に呼ばれた証人だ。"}, {"t": 740.75, "x": "ゾルゲ事件のとき総務課長をしていて\n「私が総指揮をしました」と述べた。"}, {"t": 745.5166666666667, "x": "検事局がやったって話と合わないじゃない。"}, {"t": 748.1833333333333, "x": "合わない。どちらが正しいかを\n決める書類が、今回は手元に無い。"}, {"t": 752.05, "x": "誰が何をしたかの話は、\n戦後になって人によって違ってくる。"}, {"t": 756.7166666666667, "x": "もう1人、自分で理由を語った人がいる。"}, {"t": 759.3833333333333, "x": "1955年6月24日、衆議院の行政監察特別委員会。"}, {"t": 764.3166666666667, "x": "教科書の売り込みを調べる中で、\n文部省の局長が証人に呼ばれた。"}, {"t": 768.5833333333334, "x": "初等中等教育局長の緒方信一だ。"}, {"t": 771.3666666666667, "x": "教科書の話でなぜゾルゲ事件が？"}, {"t": 773.7166666666667, "x": "議員が経歴を聞いたからだ。"}, {"t": 775.4666666666667, "x": "大学を出てすぐ内務省に入った、\n生え抜きの内務官僚だ、と。"}, {"t": 779.5, "x": "追放された理由は何か、と問われた。"}, {"t": 781.9333333333333, "x": "緒方は「言わなければならぬとしたら\n申し上げます」と前置きした。"}, {"t": 785.8666666666667, "x": "そしてこう答えている。"}, {"t": 787.2833333333333, "x": "「ゾルゲ事件というものを戦争前に\n検挙いたしましたので」。"}, {"t": 790.6333333333333, "x": "「その事件の関係で追放になりました」。"}, {"t": 793.25, "x": "自分で言うのはつらかったでしょうね。"}, {"t": 795.35, "x": "気持ちは記録からは分からない。"}, {"t": 797.2, "x": "分かるのは、検挙した側にいたことが\n追放の理由になったことだ。"}, {"t": 801.1333333333333, "x": "そして追放が解けて、文部省の局長になっていたこと。"}, {"t": 804.8333333333334, "x": "捕まえた側も戦後に立場が変わったのね。"}, {"t": 807.6, "x": "ところが全員が追放されたわけではない。"}, {"t": 810.0, "x": "取り調べの主任だった吉河は追放されなかった。"}, {"t": 813.75, "x": "1949年5月18日、衆議院の法務委員会。"}, {"t": 817.8333333333334, "x": "ある議員が、法務庁の特別審査局長の経歴を\n問題にした。"}, {"t": 821.95, "x": "その局長が吉河光貞だった。"}, {"t": 824.3666666666667, "x": "取り調べの主任が戦後も役所の局長に？"}, {"t": 827.2333333333333, "x": "そうだ。団体の届け出などを\n調べる部署の責任者だった。"}, {"t": 830.8666666666667, "x": "議員は、吉河がゾルゲ事件で\n主任として活躍したと述べた。"}, {"t": 834.8333333333334, "x": "検挙の功で表彰された、と聞いているとも言った。"}, {"t": 837.8333333333334, "x": "そして「たまたま追放を免れたのかもしれません」と。"}, {"t": 841.3333333333334, "x": "やめさせろって話？"}, {"t": 842.85, "x": "そうだ。思想を取り締まる局になるのを心配していた。"}, {"t": 846.1166666666667, "x": "これはあくまでこの議員の主張だ。"}, {"t": 848.0833333333334, "x": "答えたのは法務総裁だった。"}, {"t": 850.0, "x": "思想検事の特徴の強い人は「全部追放」されている。"}, {"t": 853.7833333333333, "x": "残っているのはまず「無害な人」だと。"}, {"t": 856.5333333333333, "x": "無害ってすごい言い方ね。"}, {"t": 858.2, "x": "厳しい資格の審査も通過している、とも述べた。"}, {"t": 861.2333333333333, "x": "さらに逆の評判もあると明かしている。"}, {"t": 863.4833333333333, "x": "学生時代に左翼の研究をしていたので、\n左に甘いのでは、という声だ。"}, {"t": 868.2333333333333, "x": "右からも左からも言われてたのね。"}, {"t": 870.5833333333334, "x": "同じ日、議員はラジオのニュースも持ち出している。"}, {"t": 873.4, "x": "法務庁の中に「非日委員会」のような\n組織を作る予算がある、という話だ。"}, {"t": 878.5, "x": "非日ってアメリカの非米活動委員会の日本版？"}, {"t": 881.5833333333334, "x": "議員はそう心配していた。"}, {"t": 883.1, "x": "法務総裁の答えははっきりしていた。"}, {"t": 885.5, "x": "非日活動委員会を作る意思は「全然ございません」。"}, {"t": 888.8, "x": "非日活動が何を指すのかも、まだ\n頭に入らない、と言っている。"}, {"t": 892.8833333333333, "x": "法務総裁は、自分も数年間、憲兵に\n尾行されていた、とも明かした。"}, {"t": 897.5666666666667, "x": "取り締まられた側の人が、\n取り締まる役所を率いているのね。"}, {"t": 901.3, "x": "この局長が、その2年後に\nワシントンへ向かうことになる。"}, {"t": 905.3666666666667, "x": "時計を少し戻す。1949年2月の東京だ。"}, {"t": 909.3, "x": "占領軍の情報部、参謀第2部が、\nゾルゲ事件を調べていた。"}, {"t": 913.3666666666667, "x": "2月18日、吉河は手元の紙を情報部の中佐に渡した。"}, {"t": 917.7, "x": "どんな紙？"}, {"t": 918.8333333333334, "x": "ゾルゲがタイプで打った手記の、\n差し替える前の部分だ。"}, {"t": 922.05, "x": "上海の話が足りないのでゾルゲは後で打ち直した。"}, {"t": 925.2, "x": "吉河は古い部分を抜き取って、\nずっと持っていたという。"}, {"t": 928.5166666666667, "x": "24ページ分で、1941年10月と\n11月に打たれたものだ。"}, {"t": 933.5333333333333, "x": "8年近く、手元に置いてたのね。"}, {"t": 936.0166666666667, "x": "吉河の宣誓書にそう書いてある。"}, {"t": 937.9833333333333, "x": "中佐に頼まれて渡した、と。"}, {"t": 940.0333333333333, "x": "次の日の2月19日、吉河はその宣誓書に署名した。"}, {"t": 943.9166666666666, "x": "名前の下とページのつなぎ目に判を押している。"}, {"t": 946.6333333333333, "x": "公聴会ではこの判の押し方まで説明された。"}, {"t": 949.6666666666666, "x": "日本の書類の作法ね。"}, {"t": 951.3333333333334, "x": "3月4日にはもう1枚の証明書を書いた。"}, {"t": 954.1, "x": "司法省の2冊の冊子は、正しい\n訳を刷ったものだ、という証明だ。"}, {"t": 958.35, "x": "4月1日にはさらに長い宣誓書を出した。"}, {"t": 961.1666666666666, "x": "拷問はしていない、\n警察にもさせていない、という内容だ。"}, {"t": 964.7333333333333, "x": "ゾルゲの周りの外国人2人は、日本にいれば\n逮捕して起訴した、とも書いた。"}, {"t": 969.55, "x": "繰り返すがこれは本人の宣誓書の言葉だ。"}, {"t": 972.95, "x": "集めた書類は、占領軍から\nアメリカの陸軍省へ送られた。"}, {"t": 976.6833333333333, "x": "情報部の部長はのちに公聴会でこう述べている。"}, {"t": 979.5166666666667, "x": "東京から何年もかけて膨大な書類を送ってきた。"}, {"t": 982.6833333333333, "x": "合わせて「100万語を超える」書類だった、と。"}, {"t": 985.7333333333333, "x": "100万語ってどのくらい？"}, {"t": 987.3166666666667, "x": "何百もの図版や写しも付いていた、と言っている。"}, {"t": 990.3, "x": "この部長がチャールズ・ウィロビー少将だ。"}, {"t": 992.4333333333333, "x": "マッカーサーの情報参謀を1939年から務めた人だ。"}, {"t": 996.5666666666667, "x": "防衛研究所の文書によれば、\nウィロビーは事件を大きく宣伝した。"}, {"t": 1000.55, "x": "「世界スパイ史空前のもの」という言葉で。"}, {"t": 1003.3, "x": "日本の事件なのにアメリカで宣伝？"}, {"t": 1005.6, "x": "ねらいは日本ではなく、上海でゾルゲに\n協力したとされる人たちだった。"}, {"t": 1010.0, "x": "その中にアメリカ人がいたからだ。"}, {"t": 1012.1166666666667, "x": "ウィロビー自身、1949年に\n騒ぎになったと公聴会で振り返っている。"}, {"t": 1017.0, "x": "また名誉毀損で訴えられるだろう、\n前と同じように、とも話した。"}, {"t": 1021.1833333333333, "x": "日本の事件の書類が、\nアメリカの政治の材料になったのね。"}, {"t": 1024.9833333333333, "x": "そうだ。そして1951年、\nその書類の舞台はアメリカの議会に移る。"}, {"t": 1030.4666666666667, "x": "1951年8月9日、午前10時半。"}, {"t": 1033.9666666666667, "x": "ワシントンの下院の旧議員会館、220号室。"}, {"t": 1037.3, "x": "非米活動委員会の公聴会が始まった。"}, {"t": 1040.15, "x": "ひべい……何の委員会？"}, {"t": 1041.75, "x": "アメリカに対する破壊的な活動を\n調べる、下院の委員会だ。"}, {"t": 1045.5833333333333, "x": "まず通訳が宣誓した。"}, {"t": 1047.2166666666667, "x": "日本語の訳が分かれた時のために、\nもう1人の女性も宣誓した。"}, {"t": 1051.3166666666666, "x": "それから証人が立ち上がる。"}, {"t": 1053.0166666666667, "x": "誓いの言葉は「何も加えず、何も隠さない」だった。"}, {"t": 1056.8333333333333, "x": "それが吉河ね。"}, {"t": 1058.15, "x": "そうだ。最初に、生まれた日と\n今の役職を聞かれている。"}, {"t": 1061.6833333333334, "x": "1907年1月16日、東京生まれ。"}, {"t": 1064.9, "x": "法務府の特別審査局の局長をおよそ3年。"}, {"t": 1067.9333333333334, "x": "1938年9月ごろから、\nおよそ8年間、東京の検事だった。"}, {"t": 1072.9833333333333, "x": "なぜ日本の検事がアメリカの議会に？"}, {"t": 1075.3666666666666, "x": "委員会の弁護士は\n「日本政府の任務で」来ていると言った。"}, {"t": 1079.0166666666667, "x": "吉河も「はい」と答えている。"}, {"t": 1081.1333333333334, "x": "どんな任務だったかはこの記録には出てこない。"}, {"t": 1083.7833333333333, "x": "答えが出るのは翌年の日本の国会だ。"}, {"t": 1086.9666666666667, "x": "公聴会で委員が吉河にこう聞いた。"}, {"t": 1089.25, "x": "ゾルゲを捕まえたのはいつごろか。"}, {"t": 1091.2166666666667, "x": "吉河はまず「東京で」と答えた。"}, {"t": 1093.7833333333333, "x": "場所じゃなくて日付を聞いてるのよね。"}, {"t": 1096.0333333333333, "x": "委員が聞き直すとこう答えた。"}, {"t": 1097.95, "x": "「1941年の11月だったと思う」。"}, {"t": 1101.1166666666666, "x": "あれ？　さっきは10月って言ってなかった？"}, {"t": 1103.6666666666667, "x": "言った。防衛研究所の文書も、\n1979年の答弁も10月だ。"}, {"t": 1108.5833333333333, "x": "しかも吉河自身の1949年の宣誓書にも、\nこう書いてある。"}, {"t": 1113.1333333333334, "x": "1941年10月、拘置所にいた\nゾルゲの取り調べを命じられた、と。"}, {"t": 1118.1333333333334, "x": "自分の書類と自分の証言がずれてるのね。"}, {"t": 1120.8833333333334, "x": "10年前の記憶で答えた、ということだろう。"}, {"t": 1123.6333333333334, "x": "吉河は、ほかの質問にも\n「よく覚えていない」と何度か答えている。"}, {"t": 1128.05, "x": "宮城がアメリカの市民だったかも\n「はっきりしない」と言った。"}, {"t": 1131.7166666666667, "x": "記憶で話すとこうなるのね。"}, {"t": 1133.6333333333334, "x": "書類のほうが正しい、とは限らない。"}, {"t": 1135.85, "x": "ただ、この日は書類と記憶が並んで記録に残った。"}, {"t": 1139.1333333333334, "x": "それがこの公聴会の記録の面白いところだ。"}, {"t": 1142.6, "x": "委員たちが知りたかったのは別のことだった。"}, {"t": 1145.1666666666667, "x": "ドイツとソ連は、真珠湾の攻撃を\n前もって知っていたか。"}, {"t": 1148.7333333333333, "x": "委員長役の議員が何度もこれを聞いている。"}, {"t": 1151.2333333333333, "x": "吉河の答えはこうだ。"}, {"t": 1152.7833333333333, "x": "「真珠湾の攻撃は、取り調べで出てこなかった」。"}, {"t": 1155.8833333333334, "x": "はっきり否定したのね。"}, {"t": 1157.5, "x": "委員は別の電文を見せた。"}, {"t": 1159.2333333333333, "x": "アメリカが10月半ばまでに歩み寄らなければ、\n日本はアメリカやシンガポールを攻める。"}, {"t": 1164.1, "x": "そういう中身の電文だった。"}, {"t": 1165.8833333333334, "x": "吉河は「覚えている」と答えた。"}, {"t": 1168.35, "x": "じゃあ、知ってたってこと？"}, {"t": 1170.0333333333333, "x": "委員は、ソ連は日本の計画を\n前もって知っていた、とまとめた。"}, {"t": 1173.9666666666667, "x": "吉河は「はい」と答え、南へ向かうのを\nソ連は喜んだだろう、と付け足した。"}, {"t": 1178.9333333333334, "x": "ただし真珠湾という言葉は、\n最後まで吉河の口から出ていない。"}, {"t": 1183.0, "x": "聞きたいことと答えがずれてるのね。"}, {"t": 1185.2166666666667, "x": "別の委員が真珠湾は誰の考えだったかを聞いた。"}, {"t": 1188.25, "x": "答えは「取り調べでは出てこなかった」だった。"}, {"t": 1191.15, "x": "この記録は、委員会が何を探していたかもよく分かる。"}, {"t": 1194.5166666666667, "x": "探していたのはアメリカの中の協力者だった。"}, {"t": 1197.9833333333333, "x": "午後、吉河は調書の話をした。"}, {"t": 1200.35, "x": "ゾルゲがドイツ大使館に近づいた\n経緯を、調書に書いたという。"}, {"t": 1204.0, "x": "ソ連から満州へ逃げてきた将軍の報告の話もあった。"}, {"t": 1207.6, "x": "ゾルゲはその報告を写真に撮って、\nモスクワへ送ったと述べた。"}, {"t": 1211.5, "x": "それも調書に書いてあったの？"}, {"t": 1213.3666666666666, "x": "吉河はそう言っている。ただ、その調書が問題だった。"}, {"t": 1216.85, "x": "「写しは作られなかった」。"}, {"t": 1218.4333333333334, "x": "「焼けてしまったのではないか」。"}, {"t": 1220.1, "x": "続けて吉河はこう言った。"}, {"t": 1221.8333333333333, "x": "「これを話すのは初めてだ。"}, {"t": 1223.4, "x": "事件から10年たって」。"}, {"t": 1225.15, "x": "10年、誰にも話してなかったの？"}, {"t": 1227.5333333333333, "x": "本人の言葉ではそうだ。"}, {"t": 1229.15, "x": "話の中身を確かめる調書はもう手元に無い。"}, {"t": 1232.0333333333333, "x": "だから記録に残ったのは、\n10年後の記憶の言葉になる。"}, {"t": 1235.75, "x": "初めて話した場所がアメリカの議会だったのね。"}, {"t": 1238.7666666666667, "x": "委員会は、吉河の宣誓書と\n2冊の冊子に番号を付けて受け取った。"}, {"t": 1243.1166666666666, "x": "「吉河証拠1号」から「6号」まで番号が付いた。"}, {"t": 1246.7, "x": "日本の役所が刷った冊子が、\nアメリカの議会の証拠になったわけだ。"}, {"t": 1251.4333333333334, "x": "2週間後の8月22日、別の証人が立った。"}, {"t": 1254.9333333333334, "x": "ウィロビー少将だ。退役を待つ身だと名乗っている。"}, {"t": 1257.8666666666666, "x": "少将は最初に長い声明を読んだ。"}, {"t": 1260.0833333333333, "x": "新聞が自分の証言を大げさに書き立てている、と。"}, {"t": 1263.3166666666666, "x": "自分から言い出すのね。"}, {"t": 1264.8666666666666, "x": "そして、ゾルゲの話は東京で\n始まって終わる話ではない、と言った。"}, {"t": 1269.1833333333334, "x": "上海の時代を調べ直した、とも述べている。"}, {"t": 1272.0166666666667, "x": "報告には180を超える名前や偽名が並ぶ、と言う。"}, {"t": 1275.55, "x": "180人も？"}, {"t": 1276.9333333333334, "x": "裁判の記録と上海の警察の記録から集めたという。"}, {"t": 1280.3833333333334, "x": "ただ、どこまでが関わった人かは、\n本人も分けたと言っている。"}, {"t": 1284.1833333333334, "x": "関わった人とたまたま近くにいた人を分けた、と。"}, {"t": 1287.5333333333333, "x": "名前が並ぶだけで疑われそうね。"}, {"t": 1289.7666666666667, "x": "この回ではその名前は1つも読まない。"}, {"t": 1292.1333333333334, "x": "表紙には、8月9日、22日、23日の3日分とある。"}, {"t": 1296.7666666666667, "x": "表題は「リヒャルト・ゾルゲ事件のアメリカの側面」。"}, {"t": 1299.7833333333333, "x": "日本の事件の記録が、\nアメリカの議会の印刷物になった。"}, {"t": 1304.1666666666667, "x": "ここで東京の国会に戻る。"}, {"t": 1305.9166666666667, "x": "1952年4月だ。"}, {"t": 1307.9833333333333, "x": "参議院の法務委員会では、\n刑事特別法案を審査していた。"}, {"t": 1311.8, "x": "アメリカ軍の機密を守るための法律だ。"}, {"t": 1314.4833333333333, "x": "秘密を守る法律の審査でゾルゲ事件が？"}, {"t": 1317.2833333333333, "x": "4月21日、新聞社の論説委員が参考人で呼ばれた。"}, {"t": 1321.2833333333333, "x": "この種の防諜の法律は、小さな人が\nつまらないことで捕まる例が多い。"}, {"t": 1325.65, "x": "「ゾルゲ事件は\n特別でありますけれども」と言いながらだ。"}, {"t": 1328.9333333333334, "x": "昔の軍機保護法でどんな人が\n捕まったか、調べてほしいと訴えた。"}, {"t": 1333.4666666666667, "x": "だから資料を出してって話になるのね。"}, {"t": 1336.0, "x": "翌日、ある議員がもう1歩踏み込んだ。"}, {"t": 1338.4833333333333, "x": "法務府の公務員がアメリカの上院に出て証言した。"}, {"t": 1341.5666666666666, "x": "そして同僚の参議院議員の名誉を\n傷つけた、と言うのだ。"}, {"t": 1345.1833333333334, "x": "上院？　さっきは下院って言ってたわよね。"}, {"t": 1347.7, "x": "公聴会の記録の表紙は「下院」だ。"}, {"t": 1350.2166666666667, "x": "議員は「上院」と言っている。\nここにも記憶のずれがある。"}, {"t": 1353.6166666666666, "x": "名前の挙がった参議院議員が誰かは、\nこの発言では伏せられている。"}, {"t": 1357.5833333333333, "x": "議員は、ゾルゲ事件が政治的に\n使われているのでは、と問うた。"}, {"t": 1362.1166666666666, "x": "そして冒頭の4月28日になる。"}, {"t": 1364.6166666666666, "x": "答えたのは法務府の検務局長、岡原昌男だ。"}, {"t": 1367.7833333333333, "x": "まず、アメリカの国会で何か\n説明があったのは聞いた、と言った。"}, {"t": 1371.7333333333333, "x": "たしか国防保安法の違反、\nゾルゲ事件の関係だと思う、と。"}, {"t": 1375.6, "x": "取り調べた人たちの話も、\n間接直接に聞いたことはある。"}, {"t": 1379.5666666666666, "x": "ただ、資料は手元に無いので詳しくは出せない、と。"}, {"t": 1382.8666666666666, "x": "それで記憶という程度、なのね。"}, {"t": 1385.0333333333333, "x": "不正確な資料を記憶で出すのは\nどうか、と考えて遠慮したという。"}, {"t": 1388.95, "x": "議員は続けて聞いた。"}, {"t": 1390.2333333333333, "x": "今後もアメリカの議会で証言することはあるのか。"}, {"t": 1393.1833333333334, "x": "岡原は「若干想像を交えて」と断ってから答えている。"}, {"t": 1397.0666666666666, "x": "「たしか非米活動委員会の召喚じゃなかったか」。"}, {"t": 1400.0666666666666, "x": "たしか、なのね。"}, {"t": 1401.4166666666667, "x": "どんな証言をしたかは\n「全然聞いておりません」とも言った。"}, {"t": 1404.9833333333333, "x": "さらに、こちらの材料を\n「むやみやたらに出したくない」。"}, {"t": 1408.1833333333334, "x": "だから今後は「望ましからざること」だと。"}, {"t": 1411.1333333333334, "x": "材料を出したくない、って\n言いながら、手元に無いのよね。"}, {"t": 1414.5166666666667, "x": "そうなる。続きもある。"}, {"t": 1416.0166666666667, "x": "吉河はガリオア資金で団体で渡米していたという。"}, {"t": 1418.9833333333333, "x": "警察か検察の団体だった、と岡原は記憶をたどった。"}, {"t": 1422.7166666666667, "x": "ワシントンにいる間に、委員会が\n「聞いたらどうか」となった。"}, {"t": 1426.4166666666667, "x": "だから特に呼んだのではない、と岡原は考えていた。"}, {"t": 1429.6333333333334, "x": "「時期的にもちょっと\nずれております」とも言っている。"}, {"t": 1432.5166666666667, "x": "ただし「確信を持って申上げかねる」とも\n付け加えている。"}, {"t": 1436.8, "x": "1952年の暮れ、ゾルゲ事件の名前がまた国会に出る。"}, {"t": 1440.9, "x": "作家の鹿地亘の事件が、国会で\n取り上げられていた時期だ。"}, {"t": 1444.6166666666666, "x": "12月23日、衆議院の法務委員会。"}, {"t": 1447.5833333333333, "x": "ある議員が新聞の報道に怒って質問した。"}, {"t": 1450.3666666666666, "x": "鹿地がゾルゲ事件に\n関係があるかのように書いた記事だ。"}, {"t": 1453.6666666666667, "x": "本当に関係があったの？"}, {"t": 1455.4166666666667, "x": "議員は記者から聞いた話としてこう述べた。"}, {"t": 1458.0333333333333, "x": "デスクが外務省に頼まれて書いた、と言われたという。"}, {"t": 1461.1333333333334, "x": "これは議員の言い分で確かめた事実ではない。"}, {"t": 1463.75, "x": "翌日の外務委員会でも、\n別の議員が同じことを聞いた。"}, {"t": 1467.3166666666666, "x": "答えたのは法務大臣の犬養健だ。"}, {"t": 1469.8333333333333, "x": "「私も新聞で読んだだけであります」。"}, {"t": 1472.0833333333333, "x": "役所の公式な報告としてはそういう話は無い。"}, {"t": 1475.15, "x": "むしろ、そうではないだろうと\n読む人が多い、と答えた。"}, {"t": 1478.5, "x": "大臣も新聞で知った、ってことね。"}, {"t": 1480.9, "x": "次の年の11月、別の議員がこの大臣に質問している。"}, {"t": 1484.9166666666667, "x": "前置きで、ゾルゲ事件の時に大臣の名前も\n「出たりひっ込んだり」した、と言った。"}, {"t": 1490.0833333333333, "x": "この回で言えるのは、議員がそう\n前置きした、というところまでだ。"}, {"t": 1493.9166666666667, "x": "答弁した人の名前も取りざたされてたのね。"}, {"t": 1497.3, "x": "1954年5月8日、衆議院の外務委員会。"}, {"t": 1500.8666666666666, "x": "アメリカとの協定に伴う、秘密保護法案の審査だった。"}, {"t": 1504.5166666666667, "x": "ある議員が法案の目的の書き方に注文を付けた。"}, {"t": 1507.7666666666667, "x": "「わが国の安全を害すべき用途に供する目的」。"}, {"t": 1510.9333333333334, "x": "そういう目的で秘密を漏らしたら罰する、ってこと？"}, {"t": 1514.1666666666667, "x": "そうだ。議員は、これでは\n大きなスパイは捕まらないと言った。"}, {"t": 1517.7666666666667, "x": "例に出したのがゾルゲ事件だ。"}, {"t": 1519.6333333333334, "x": "尾崎は、日本の安全に役立つと思ってやったのだ、と。"}, {"t": 1523.1666666666667, "x": "情報も不当な方法で取ったものではない。"}, {"t": 1525.65, "x": "周りの人から自然に聞き込んだことだった、と述べた。"}, {"t": 1529.1333333333334, "x": "本人は安全のためと思ってたら、\nこの法律では罰せない……。"}, {"t": 1532.8333333333333, "x": "そういう理屈だ。議員は根拠も挙げている。"}, {"t": 1535.3833333333334, "x": "ウィロビーのスパイの本を全部読んだ、と。"}, {"t": 1537.85, "x": "またあの少将の名前ね。"}, {"t": 1539.5666666666666, "x": "ウィロビーの本は、1953年に日本語訳が\n出ている、と防衛研究所の文書の注にある。"}, {"t": 1545.5166666666667, "x": "議員が読んだのが原書か\n翻訳かは、発言からは分からない。"}, {"t": 1549.1333333333334, "x": "ただ、日本の役所の記録ではなく、\nアメリカ側の本が根拠になっていた。"}, {"t": 1554.3333333333333, "x": "1956年5月7日、参議院の内閣委員会。"}, {"t": 1558.1833333333334, "x": "憲法調査会法案の審査で参考人が意見を述べた。"}, {"t": 1561.55, "x": "元法務総裁の鈴木義男だ。"}, {"t": 1563.6, "x": "ソ連の参戦について聞かれてこう話し始めた。"}, {"t": 1566.5666666666666, "x": "「私はゾルゲ事件というものを担当して、\n事こまかに知っておりまする」。"}, {"t": 1570.8666666666666, "x": "担当してた人がまだいたのね。"}, {"t": 1573.0, "x": "鈴木はこう続けた。"}, {"t": 1574.3833333333334, "x": "御前会議で北へ行くか南へ行くかを話し合った。"}, {"t": 1577.4166666666667, "x": "そして南へ行くと決めた。「北守南進」だ。"}, {"t": 1580.4, "x": "それが詳しくソ連に伝わっていたのが\nゾルゲ事件だ、と。"}, {"t": 1583.9666666666667, "x": "鈴木はどういう立場で担当したの？"}, {"t": 1586.3, "x": "それが分からない。この発言には書かれていない。"}, {"t": 1589.1, "x": "今回の資料では\n確かめられなかったので、言わずにおく。"}, {"t": 1592.45, "x": "同じ年の2月には、別の議員が\n予算委員会で話している。"}, {"t": 1596.25, "x": "元ソ連大使館員が、\nアメリカの上院の分科委員会で証言した件だ。"}, {"t": 1600.7, "x": "議員は、それを聞いて\nゾルゲ事件を思い出す、と言った。"}, {"t": 1604.1, "x": "またアメリカの議会の証言が、\n日本の国会に来たのね。"}, {"t": 1607.7333333333333, "x": "この型はゾルゲ事件のあとも何度も繰り返される。"}, {"t": 1611.3333333333333, "x": "ソ連の側はどうだったか。"}, {"t": 1612.9333333333334, "x": "防衛研究所の文書によれば、ソ連は\n戦争中からゾルゲの活動を否定していた。"}, {"t": 1617.9166666666667, "x": "それが1964年9月、ゾルゲを\nソ連邦英雄と公式に認めた。"}, {"t": 1622.7833333333333, "x": "20年たって急に？"}, {"t": 1624.3, "x": "文書には「20年後」とある。"}, {"t": 1626.25, "x": "死刑の執行から数えて20年だ。"}, {"t": 1628.65, "x": "同じ文書はこうも書く。"}, {"t": 1630.1833333333334, "x": "ロシアでは今もゾルゲをたたえる動きが強い。"}, {"t": 1632.6666666666667, "x": "一方で、新しく公開された\n資料で実像も調べられている。"}, {"t": 1636.4333333333334, "x": "神話にする動きと、神話をほどく\n動きが同時に進んでいる、と。"}, {"t": 1640.45, "x": "英雄にも悪人にも、ってこの回の決まりと同じね。"}, {"t": 1643.7, "x": "1984年の国会ではある議員がこう言っている。"}, {"t": 1647.1, "x": "戦争が終わってから、スターリンが\n国家の英雄とたたえた人だ、と。"}, {"t": 1651.2, "x": "防衛研究所の文書では認定は1964年9月だ。"}, {"t": 1655.2333333333333, "x": "ここでも記憶と記録がずれてるのね。"}, {"t": 1657.5833333333333, "x": "同じ議員は、判決文を\n読ませていただいた、とも述べている。"}, {"t": 1661.2666666666667, "x": "どこで、どの写しを読んだのかは、発言に出てこない。"}, {"t": 1664.5666666666666, "x": "これが、5年前の答弁と食い違ってくる。"}, {"t": 1667.8833333333334, "x": "1979年3月10日、参議院の予算委員会。"}, {"t": 1671.8166666666666, "x": "ある議員が、ゾルゲ事件を\n国民に知らせるべきだと迫った。"}, {"t": 1675.3833333333334, "x": "国会図書館から4冊の本を\n借りて読んだ、と言っている。"}, {"t": 1678.9166666666667, "x": "そして法務省に事件の概要を説明させた。"}, {"t": 1681.75, "x": "答えたのは法務省の刑事局長、伊藤栄樹だ。"}, {"t": 1684.9666666666667, "x": "どんな答えだったの？"}, {"t": 1686.4333333333334, "x": "最初の一言はこうだ。"}, {"t": 1688.0333333333333, "x": "「判決書原本及び事件記録が\n散逸いたしておりますために」。"}, {"t": 1691.8666666666666, "x": "詳細は定かでない、と。"}, {"t": 1693.6666666666667, "x": "判決の原本が無いの？"}, {"t": 1695.4, "x": "部内の資料で分かる範囲を\n答える、という前置きだった。"}, {"t": 1698.6833333333334, "x": "1941年10月に検挙、1943年から\n1944年に判決が確定。"}, {"t": 1705.3833333333334, "x": "外国人4人と日本人およそ30人。"}, {"t": 1707.8666666666666, "x": "人数は、最初に話したとおりだ。"}, {"t": 1710.1833333333334, "x": "議員は次に捜査のきっかけと検挙の経過を聞いた。"}, {"t": 1713.2833333333333, "x": "局長は「事件記録が\n散逸しておりますので」と答えた。"}, {"t": 1717.1, "x": "責任ある答えはできない、と。"}, {"t": 1719.1833333333334, "x": "本に書いてあることも言えないの？"}, {"t": 1721.1833333333334, "x": "本に書いてあるのは承知しているが、\n法務省として確かめられない。"}, {"t": 1725.0833333333333, "x": "公安調査庁にも問い合わせたが、\n資料の持ち合わせが無いという。"}, {"t": 1729.4166666666667, "x": "議員は手元の資料を示した。"}, {"t": 1731.3166666666666, "x": "外務省からもらった、省内の印刷物だという。"}, {"t": 1734.4166666666667, "x": "議員の言葉では、1957年10月の日付が入っている。"}, {"t": 1738.7666666666667, "x": "外務省にはあったの？"}, {"t": 1740.2166666666667, "x": "議員はこう主張した。"}, {"t": 1741.6333333333334, "x": "ウィロビーが一度アメリカへ\n持っていき、それを返してきた。"}, {"t": 1744.8666666666666, "x": "その中身を、外務省が省内の記録にまとめていた、と。"}, {"t": 1748.4666666666667, "x": "これは議員の主張で、\n今回の資料では確かめていない。"}, {"t": 1751.9, "x": "じゃあ、法務省はそれを見ればいいんじゃない？"}, {"t": 1754.3, "x": "局長の答えは、見せてもらったのは\n「エキス」だ、というものだった。"}, {"t": 1758.6166666666666, "x": "判決の原本と裁判の記録そのものに\n基づかないと、公の場では話せない。"}, {"t": 1763.6, "x": "内容を肯定も否定もできない、と。"}, {"t": 1765.9333333333334, "x": "きびしいのね。"}, {"t": 1767.05, "x": "議員はさらに聞いた。"}, {"t": 1768.2, "x": "ゾルゲが捕まったのはいつか、\nなぜ記録が出ないのか。"}, {"t": 1771.4833333333333, "x": "別の事件の記録は、昭和8年ごろから\n全部出たではないか、と。"}, {"t": 1775.6166666666666, "x": "局長はこう答えた。"}, {"t": 1777.0666666666666, "x": "「連合国軍によります占領中に\n散逸をいたしておりまして」。"}, {"t": 1780.7166666666667, "x": "その行方を捜しているがまだつかめていない、と。"}, {"t": 1784.1666666666667, "x": "局長は判決原本の決まりを説明した。"}, {"t": 1786.9833333333333, "x": "判決の原本は永久に保存するものだ。"}, {"t": 1789.5833333333333, "x": "だから別の事件の原本はある。"}, {"t": 1791.5833333333333, "x": "ところがゾルゲ事件は\n「判決原本そのものも散逸」している。"}, {"t": 1795.7833333333333, "x": "永久保存のはずのものが無いのね。"}, {"t": 1798.0333333333333, "x": "戦後、確かに検察にあった記録と\n原本を、一生懸命捜している、と。"}, {"t": 1802.95, "x": "戦後にはまだあったの？"}, {"t": 1804.4666666666667, "x": "局長の言葉では「戦後確かに\n検察当局にありました」だ。"}, {"t": 1808.6333333333334, "x": "それが占領中に散らばった、という説明になる。"}, {"t": 1811.65, "x": "議員が聞いた。見つかる見込みはあるのか。"}, {"t": 1814.0833333333333, "x": "局長の答えはこうだ。"}, {"t": 1815.6, "x": "国際的にも有名な事件なので、「\n必ずどこかにあるんじゃないか」。"}, {"t": 1819.6, "x": "そう確信して捜している、と。"}, {"t": 1821.7833333333333, "x": "いつまで捜すの？"}, {"t": 1823.05, "x": "議員も同じことを聞いた。「いつまで」と。"}, {"t": 1825.5166666666667, "x": "局長は「見つかるまで捜します」と答えた。"}, {"t": 1828.5666666666666, "x": "最後に首相の大平正芳が\n「鋭意努力いたします」と述べている。"}, {"t": 1832.8166666666666, "x": "首相まで答えたのね。"}, {"t": 1834.4333333333334, "x": "1年後の1980年3月にも、\n同じ委員会で概要が聞かれた。"}, {"t": 1839.1166666666666, "x": "別の刑事局長が、やはり\n大まかな筋だけを答えている。"}, {"t": 1843.3833333333334, "x": "1979年のその日、もう1つのやり取りがあった。"}, {"t": 1847.2333333333333, "x": "議員が起訴された人の名前を言え、と迫ったのだ。"}, {"t": 1850.3, "x": "局長は、起訴された人の名前と\n判決の結果は分かっている、と答えた。"}, {"t": 1855.05, "x": "記録は無いのに名前は分かるの？"}, {"t": 1857.0833333333333, "x": "部内の資料に、名前と刑だけは\n残っていたということだろう。"}, {"t": 1860.6166666666666, "x": "局長は、1人ずつ名前と刑を読み上げた。"}, {"t": 1863.3833333333334, "x": "数えると18人分あった。"}, {"t": 1865.25, "x": "この回ではその名前は読まない。"}, {"t": 1867.15, "x": "死刑が2人、無期懲役が2人、\n亡くなって言い渡しの無い人が2人。"}, {"t": 1871.55, "x": "あとの人は、懲役15年から、\n執行猶予の付いた懲役2年までだ。"}, {"t": 1876.1833333333334, "x": "一覧はあるのに、なぜ\nそうなったかの記録が無いのね。"}, {"t": 1879.45, "x": "そうだ。結果だけが残って途中の書類が無い。"}, {"t": 1882.3333333333333, "x": "だから局長はきっかけも経過も答えられなかった。"}, {"t": 1885.4, "x": "答えたのは、部内資料の「ほんの粗筋、\n骨のところ」だけだ。"}, {"t": 1889.7333333333333, "x": "骨だけの記録……。"}, {"t": 1891.05, "x": "本に書かれた中身と役所が確かめられる中身。"}, {"t": 1894.0666666666666, "x": "その間を埋める書類が役所の手元に無かった。"}, {"t": 1897.5666666666666, "x": "では記録はどこから出てきたのか。"}, {"t": 1899.6, "x": "防衛研究所の文書は別の方角を書いている。"}, {"t": 1902.4833333333333, "x": "冷戦が終わった直後の1991年。"}, {"t": 1905.4, "x": "ソ連の政府が、ゾルゲの電報や\n報告書をおよそ90通公開した。"}, {"t": 1909.6666666666667, "x": "受け取ったのは日本のテレビ局の取材班だった。"}, {"t": 1912.7166666666667, "x": "日本の役所からじゃなくてモスクワから？"}, {"t": 1915.2333333333333, "x": "そうだ。送った側の国に、\n受け取った電報が残っていた。"}, {"t": 1918.9166666666667, "x": "ロシアではその後も、電報や\n書簡をまとめた本が出ている。"}, {"t": 1922.3333333333333, "x": "新しく秘密を解かれた資料も\n使われている、と文書は書く。"}, {"t": 1926.1333333333334, "x": "捕まえた国より、送った先の国のほうが残ってたのね。"}, {"t": 1929.8166666666666, "x": "この1点についてはそう言える。"}, {"t": 1931.6166666666666, "x": "日本の国会の会議録も探してみた。"}, {"t": 1934.1333333333334, "x": "2000年以降に「ゾルゲ」が\n出てくる発言は36件あった。"}, {"t": 1938.15, "x": "その中に、判決原本が\n見つかったという答弁は無かった。"}, {"t": 1942.0333333333333, "x": "じゃあ、まだ見つかってない？"}, {"t": 1943.75, "x": "そこまでは言えない。"}, {"t": 1944.75, "x": "国会で答弁が無い、というだけだ。"}, {"t": 1947.0166666666667, "x": "裁判所や公文書館の目録までは、\n今回は調べていない。"}, {"t": 1951.4, "x": "整理しておこう。"}, {"t": 1952.4333333333334, "x": "1941年10月、ゾルゲと尾崎たちが捕まった。"}, {"t": 1956.3666666666666, "x": "取り調べで手記と冊子と38冊の調書が作られた。"}, {"t": 1959.9666666666667, "x": "1944年11月、2人に死刑が執行された。"}, {"t": 1963.9333333333334, "x": "戦後、捕まえた側の何人かは\n追放され、やがて解除された。"}, {"t": 1967.9833333333333, "x": "1949年、主任の検事は手元の紙を占領軍に渡した。"}, {"t": 1972.55, "x": "1951年、その検事はワシントンで宣誓して証言した。"}, {"t": 1976.7666666666667, "x": "1952年、日本の国会は「記憶という程度」と答えた。"}, {"t": 1981.15, "x": "1979年、判決の原本も記録も「散逸」と答えた。"}, {"t": 1986.05, "x": "記録がいちばん手元にあったはずの国で、\n記録が消えてるのね。"}, {"t": 1989.9333333333334, "x": "そうだ。代わりに残ったのは、\n人の記憶と、外国の書類だった。"}, {"t": 1994.1666666666667, "x": "吉河の「11月だったと思う」も、その記憶の1つだ。"}, {"t": 1998.3166666666666, "x": "記憶もずれるし書類も焼けるし……。"}, {"t": 2000.35, "x": "だから、どれか1つだけを信じないで並べてみた。"}, {"t": 2003.45, "x": "ゾルゲが何をしたか、の評価は\nこの回ではしなかった。"}, {"t": 2006.7333333333333, "x": "死刑になった2人と、獄中で亡くなった人たちがいた。"}, {"t": 2010.2666666666667, "x": "そのことは記録の話の前に置いておきたい。"}, {"t": 2012.95, "x": "1979年の局長は「見つかるまで捜します」と言った。"}, {"t": 2017.3666666666666, "x": "その書類が今どこにあるのか、答えは\nまだ国会の記録に出てこない。"}, {"t": 2021.45, "x": "今回は、ゾルゲ事件の書類が\nたどった戦後の道の記録だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
