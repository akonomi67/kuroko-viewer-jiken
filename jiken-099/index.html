<script>
const D={"name": "099", "file": "099_編集用", "dur": 2132.66665625, "segs": [], "subs": [{"t": 0.0, "x": "1973年、昭和48年11月29日。"}, {"t": 4.166666666666667, "x": "熊本市の下通一丁目。"}, {"t": 5.933333333333334, "x": "熊本で一番にぎやかな通りだ。"}, {"t": 8.116666666666667, "x": "午後1時15分ごろ、そこに\n建っていたデパートで火が出た。"}, {"t": 11.75, "x": "お昼すぎ？"}, {"t": 12.683333333333334, "x": "昼すぎだ。買い物のお客さんが、\nいちばん多い時間だな。"}, {"t": 16.25, "x": "火が消えたのは、その日の夜9時19分。"}, {"t": 18.95, "x": "約8時間、燃えつづけた。"}, {"t": 20.883333333333333, "x": "亡くなった方は、消防庁の資料で100人。"}, {"t": 23.633333333333333, "x": "怪我をされた方が124人。"}, {"t": 25.766666666666666, "x": "……100人。"}, {"t": 26.55, "x": "この火事には、決まっていないことが二つある。"}, {"t": 29.25, "x": "一つ目。何が火のもとだったのかが、\nいまも決まっていない。"}, {"t": 33.016666666666666, "x": "原因が分からないままなの？"}, {"t": 34.85, "x": "二つ目。この火事で罪に問われて\n有罪になった人が、一人もいない。"}, {"t": 39.28333333333333, "x": "……100人も亡くなっているのに？"}, {"t": 41.15, "x": "いない。最高裁まで行って、そういう結論になった。"}, {"t": 44.36666666666667, "x": "今日は、この大洋デパート火災を追っていく。"}, {"t": 46.95, "x": "先に二つだけ断っておく。"}, {"t": 48.916666666666664, "x": "亡くなった方の名前や様子は扱わない。"}, {"t": 51.4, "x": "火を出した人がいたとも言わない。"}, {"t": 53.45, "x": "どうして言わないの？"}, {"t": 54.733333333333334, "x": "決まっていないからだ。それだけだ。"}, {"t": 56.833333333333336, "x": "この回で使う数字は、ほとんどが\n国会の記録から取った。"}, {"t": 60.45, "x": "当時の消防庁長官が、自分の口で話した数字だ。"}, {"t": 64.0, "x": "確かだ。ただし、\nその確かなはずの数字が、あとで揺れる。"}, {"t": 67.78333333333333, "x": "まずは、建物の話からいこう。"}, {"t": 70.53333333333333, "x": "場所は熊本市の下通一丁目。"}, {"t": 72.78333333333333, "x": "消防庁長官の佐々木喜久治さんは、\n国会でこう説明している。"}, {"t": 76.78333333333333, "x": "「熊本市における最も繁華街の地域」だと。"}, {"t": 79.83333333333333, "x": "そこに建っていたのが、大洋デパートだ。"}, {"t": 82.28333333333333, "x": "鉄筋コンクリートの、地下1階、地上9階の建物。"}, {"t": 85.86666666666666, "x": "ただし9階まであるのは一部だけで、\n大部分は7階までだった。"}, {"t": 89.78333333333333, "x": "建物の床面積を全部足すと、約2万500平方メートル。"}, {"t": 93.96666666666667, "x": "大きいのね。"}, {"t": 94.93333333333334, "x": "火が出たのは、3階の呉服と寝具の売り場のあたりだ。"}, {"t": 98.21666666666667, "x": "正確には、2階から3階へ上がる\n階段の踊り場付近と推定されている。"}, {"t": 102.83333333333333, "x": "階段なの。"}, {"t": 103.83333333333333, "x": "階段だ。ここが、この火事の\nすべてを決めることになる。"}, {"t": 107.25, "x": "1階と2階には、火が入っていない。"}, {"t": 109.73333333333333, "x": "えっ、下は無事だったの。"}, {"t": 111.51666666666667, "x": "無事だった。長官は「一階と二階までの部分は\n全然火が入っておりません」と言っている。"}, {"t": 117.0, "x": "そして煙は、火よりもっと速く上へ行く。"}, {"t": 119.6, "x": "だから3階から上にいた人が、\n逃げ場を探すことになった。"}, {"t": 123.26666666666667, "x": "火事のとき、3階から上には、\nお客さんと従業員が何人いたか。"}, {"t": 127.5, "x": "あとで出てくる調査によると、各階にそれぞれ\n200人から300人いたと見られている。"}, {"t": 132.66666666666666, "x": "……階ごとに、それだけ。"}, {"t": 134.31666666666666, "x": "そういう建物で、昼の1時すぎに火が出た。"}, {"t": 137.8, "x": "この建物が建ったのは、昭和27年。1952年だ。"}, {"t": 142.21666666666667, "x": "火事の21年前ね。"}, {"t": 143.98333333333332, "x": "戦争が終わってすぐの時期に建った、\n古い鉄筋コンクリートの建物だ。"}, {"t": 148.3, "x": "この21年のあいだに、\n日本の法律は何度も変わっている。"}, {"t": 152.05, "x": "大きな火事が起きるたびに、\n防火の決まりが厳しくなった。"}, {"t": 155.46666666666667, "x": "スプリンクラーを付けろ、火災報知機を付けろ、\n階段を区切れ、という具合にだ。"}, {"t": 160.21666666666667, "x": "じゃあ、このデパートも付けてたんじゃないの。"}, {"t": 162.68333333333334, "x": "ここが、この回で一番覚えてほしい言葉になる。"}, {"t": 165.7, "x": "「遡及適用」という言葉だ。"}, {"t": 167.76666666666668, "x": "そきゅう……？"}, {"t": 168.5, "x": "さかのぼって当てはめる、という意味だ。"}, {"t": 170.7, "x": "新しい決まりを、昔からある建物にも\n当てはめるかどうか、という話だな。"}, {"t": 175.38333333333333, "x": "当時の法律は、当てはめない、という\n作りになっていた。"}, {"t": 178.9, "x": "ええっ。"}, {"t": 179.46666666666667, "x": "新しく建てる建物には義務。すでに\n建っている建物には義務なし。"}, {"t": 183.56666666666666, "x": "だから、決まりをいくら厳しくしても、\n古い建物はそのまま残る。"}, {"t": 187.66666666666666, "x": "長官は国会で、こう言っている。"}, {"t": 189.71666666666667, "x": "「改正前の建築物のいろいろな"}, {"t": 191.58333333333334, "x": "欠陥というものが、この大洋デパートの火災に\nおいてすべてがはっきりしてきた」。"}, {"t": 196.25, "x": "ちなみにこの火事の1年半前にも、\n同じことが起きている。"}, {"t": 199.9, "x": "1972年5月、大阪の千日デパートビル火災。"}, {"t": 203.88333333333333, "x": "亡くなった方が118人。これも古い建物だった。"}, {"t": 207.53333333333333, "x": "……1年半前に、もう起きてたの。"}, {"t": 209.75, "x": "起きていた。そこは覚えておいてくれ。"}, {"t": 212.58333333333334, "x": "1973年のこの日、大洋デパートは工事中だった。"}, {"t": 216.75, "x": "工事？"}, {"t": 217.45, "x": "二種類の工事が同時に走っていた。"}, {"t": 219.68333333333334, "x": "一つは増築工事。建物を横に広げる工事だ。"}, {"t": 223.0, "x": "もう一つが、防火の設備を付ける工事だな。"}, {"t": 225.81666666666666, "x": "長官の説明では、工事の完成予定は翌年の1月末。"}, {"t": 229.73333333333332, "x": "火事は11月29日だから、あと2か月というところだ。"}, {"t": 233.61666666666667, "x": "……あと2か月。"}, {"t": 234.66666666666666, "x": "この「あと2か月」が、そのまま\n被害の大きさになった。"}, {"t": 238.28333333333333, "x": "付いていたもの。消火器、\n屋内の消火栓、連結送水管、放送設備。"}, {"t": 243.2, "x": "付いていなかったもの、あるいは工事の\n途中だったもの。"}, {"t": 246.33333333333334, "x": "自動火災報知設備。煙の感知器。"}, {"t": 248.76666666666668, "x": "スプリンクラー設備。避難器具。"}, {"t": 251.01666666666668, "x": "……火事を知らせるものが、全部ないほうに入ってる。"}, {"t": 253.95, "x": "長官は国会でこう言った。"}, {"t": 255.68333333333334, "x": "「消防の設備につきましては、全く皆無に\nひとしかったという状況であったわけです」。"}, {"t": 260.8333333333333, "x": "それからもう一つ、防火管理の話がある。"}, {"t": 263.6166666666667, "x": "法律では、大きな建物には防火管理者を\n決めて届け出ることになっている。"}, {"t": 268.15, "x": "これは決めて、届け出もされていた。"}, {"t": 270.48333333333335, "x": "じゃあ大丈夫だったんじゃ。"}, {"t": 272.03333333333336, "x": "ただ、その防火管理者が\n作るはずの「消防計画」が、作られていなかった。"}, {"t": 277.2, "x": "消防計画って。"}, {"t": 278.6, "x": "火が出たときに誰が何をするか、を\n先に決めておく紙だ。"}, {"t": 282.1666666666667, "x": "誰が放送するか、誰がどの階のお客さんを\n外へ出すか。それを決めた紙がない。"}, {"t": 287.1333333333333, "x": "長官は「消防の観点から見ますると、ほとんど\n無防備にひとしい状態」と述べている。"}, {"t": 292.3666666666667, "x": "この状態で、昼の1時15分を迎える。"}, {"t": 295.76666666666665, "x": "出火は午後1時15分ごろ、と推定されている。"}, {"t": 298.81666666666666, "x": "場所は、2階から3階へ上がる階段の踊り場付近。"}, {"t": 302.01666666666665, "x": "階段だ。しかもここは、従業員が\n使う階段だったとされている。"}, {"t": 306.1666666666667, "x": "そして、この階段には物が置かれていた。"}, {"t": 308.9, "x": "物って。"}, {"t": 309.73333333333335, "x": "この日は歳末の売り出しが始まっていた時期だ。"}, {"t": 312.5833333333333, "x": "長官の言葉では、「商品が階段、\n踊り場付近にも相当積まれておった」。"}, {"t": 317.26666666666665, "x": "……そこから燃えたの。"}, {"t": 318.5833333333333, "x": "そこから燃えた、と見られている。"}, {"t": 320.51666666666665, "x": "積まれていたのが\n段ボール箱だった、という記録もある。"}, {"t": 323.7, "x": "そしてその上、3階が呉服と寝具の売り場だった。"}, {"t": 327.03333333333336, "x": "布ばっかりじゃない。"}, {"t": 328.3333333333333, "x": "布ばかりだ。長官はこう説明している。"}, {"t": 330.93333333333334, "x": "「三階の踊り場付近に積まれておりました商品が、"}, {"t": 333.8, "x": "呉服、寝具でございましたために、\n急激に煙が発生をし、また火も出た」。"}, {"t": 338.78333333333336, "x": "その通り道が、そのまま上への煙突になった。"}, {"t": 341.8833333333333, "x": "……逃げる道が、火のもとだったのね。"}, {"t": 344.2, "x": "そういうことになる。"}, {"t": 345.3833333333333, "x": "その日の天気も足を引っぱった。"}, {"t": 347.43333333333334, "x": "晴れ。風はかすかに吹いている程度。"}, {"t": 349.6666666666667, "x": "そして湿度が38パーセント。"}, {"t": 352.03333333333336, "x": "低いの？"}, {"t": 352.8833333333333, "x": "低い。その日は異常乾燥注意報が出ていた。"}, {"t": 355.73333333333335, "x": "ここから8時間、この建物は燃えつづけることになる。"}, {"t": 359.75, "x": "出火が午後1時15分ごろ。"}, {"t": 361.6666666666667, "x": "119番の通報が消防署に入ったのが、1時23分。"}, {"t": 365.8, "x": "……8分。"}, {"t": 366.55, "x": "この8分について、長官は国会でこう言っている。"}, {"t": 369.65, "x": "「この間若干の時間のズレがございます。\nここに一つ問題があるわけであります」。"}, {"t": 374.48333333333335, "x": "自分から問題だって言ってるのね。"}, {"t": 376.7, "x": "言っている。報告の中で、わざわざそこを指している。"}, {"t": 379.93333333333334, "x": "消防隊が現場に着いたのは、通報の2分後だ。"}, {"t": 382.96666666666664, "x": "着いたときには、屋上の塔屋の\nあたりから白い煙が出ていた。"}, {"t": 386.8, "x": "もう上まで行ってたの。"}, {"t": 388.23333333333335, "x": "行っていた。消防が来る前に、\n煙は最上部まで届いている。"}, {"t": 392.0, "x": "火が階段の布の山を登りきるには、十分な時間だ。"}, {"t": 395.6, "x": "じゃあ、どうして8分もかかったの。"}, {"t": 397.8833333333333, "x": "そこを決める設備が、工事中だったからだ。"}, {"t": 400.6166666666667, "x": "自動火災報知設備。煙の感知器。"}, {"t": 403.18333333333334, "x": "これが動いていれば、人が\n気づくより先に機械が知らせる。"}, {"t": 406.68333333333334, "x": "機械が無いなら、誰かが見つけて、\n誰かが電話をかけるしかない。"}, {"t": 410.6166666666667, "x": "その「誰か」は、まず自分で火を消そうとする。"}, {"t": 413.8333333333333, "x": "……消そうとしてる間に、時間が過ぎるのね。"}, {"t": 416.56666666666666, "x": "過ぎる。これはこの火事に限った話じゃない。"}, {"t": 419.3, "x": "それでも、外に出せるかどうかが、\nこの火事では全部だった。"}, {"t": 423.55, "x": "付いていたもののほうに、\n「放送設備」が入っていた。"}, {"t": 426.75, "x": "付いていた。工事も終わっていた。"}, {"t": 428.7, "x": "ところが、長官の報告にはこう書いてある。"}, {"t": 431.35, "x": "「ただし、この火災の当日は\nこの設備は動いておりません」。"}, {"t": 434.9, "x": "……動いてない。"}, {"t": 435.81666666666666, "x": "動いていない。消火器も、屋内の消火栓も、\n連結送水管も、放送設備も。"}, {"t": 441.2, "x": "全部「設置済み」で、全部「当日は動いていない」。"}, {"t": 444.76666666666665, "x": "壊れてたってこと？"}, {"t": 446.15, "x": "そこまでは記録に書かれていない。だから\n私は決めつけない。"}, {"t": 449.68333333333334, "x": "書かれているのは、使われた\n形跡が無い、ということだけだ。"}, {"t": 453.3666666666667, "x": "……じゃあ、館内放送は。"}, {"t": 454.98333333333335, "x": "機械があって、火事が起きていて、\nそれでも流れた記録が出てこない。"}, {"t": 459.05, "x": "そして、さっき言った「消防計画」が無い。"}, {"t": 462.01666666666665, "x": "誰が放送するか、先に\n決めていなかった、ということだ。"}, {"t": 465.75, "x": "……決めてないと、誰も押さないのね。"}, {"t": 467.95, "x": "誰も押さない、というより、誰が押すのか分からない。"}, {"t": 470.93333333333334, "x": "結果として、上の階の人が火事を知るのが遅れた。"}, {"t": 474.1666666666667, "x": "長官も、そこを問題点として四つ目に挙げている。"}, {"t": 477.4, "x": "「全館に火災報知がなされておらない。そのために、"}, {"t": 480.3333333333333, "x": "上の階の人たちが火災に\n気がつくのに相当おくれた」。"}, {"t": 483.81666666666666, "x": "……知らないまま、煙が来るのね。"}, {"t": 485.93333333333334, "x": "来る。3階から上は、そういう状態になった。"}, {"t": 489.51666666666665, "x": "スプリンクラーの話をする。"}, {"t": 491.3333333333333, "x": "天井から水が出るやつね。"}, {"t": 493.1666666666667, "x": "大洋デパートにも、取り付け工事が入っていた。"}, {"t": 496.06666666666666, "x": "ここが、この火事で一番よく知られている話だ。"}, {"t": 499.0833333333333, "x": "火事の半年後、1974年5月24日。"}, {"t": 502.6, "x": "衆議院の建設委員会。"}, {"t": 504.31666666666666, "x": "当時の建設大臣、亀岡高夫さんが、こう答弁している。"}, {"t": 508.1333333333333, "x": "自分は大臣になってすぐ、まだくすぶっている\n大洋デパートを見に行った、と。"}, {"t": 512.5833333333334, "x": "そのうえで、こう言った。"}, {"t": 514.05, "x": "「一部においてスプリンクラーの取りつけ\n工事が行なわれておった」。"}, {"t": 517.5333333333333, "x": "「したがって、スプリンクラーの機能は、"}, {"t": 519.65, "x": "工事完成の部門においても、\n水が行っていないために働く作用をしなかった」。"}, {"t": 524.4166666666666, "x": "……工事が終わってるところも、動かなかったの。"}, {"t": 527.1833333333333, "x": "動かなかった、と大臣が国会で言っている。"}, {"t": 529.9333333333333, "x": "付いてはいた。でも、水が来ていなかった。"}, {"t": 532.6833333333333, "x": "それって、無いのと同じじゃない。"}, {"t": 534.7166666666667, "x": "この日に限っては、同じだ。"}, {"t": 536.6666666666666, "x": "水が通って、電気が通って、点検して、初めて働く。"}, {"t": 540.65, "x": "その手前で止まっていた。"}, {"t": 542.2, "x": "大臣は、続けてこうも言っている。"}, {"t": 544.3666666666667, "x": "「もし、防災施設なり、あるいは防火施設なり\n待避施設なりが完備しておれば、人命は"}, {"t": 549.6333333333333, "x": "一名も損傷せずに済んだのではないかという\n感じを持った」。"}, {"t": 553.0666666666667, "x": "……一人も、って。"}, {"t": 554.2333333333333, "x": "現場を見た大臣の言葉だ。"}, {"t": 556.05, "x": "これは法律の話ではなく、見た\n人の感想として述べられている。"}, {"t": 560.05, "x": "ただ、その感想がそのまま、\nこのあとの法律の改正につながっていく。"}, {"t": 565.0666666666667, "x": "この建物には、もう一つ大きな特徴があった。"}, {"t": 568.1666666666666, "x": "窓だ。"}, {"t": 568.9166666666666, "x": "窓が無かったの？"}, {"t": 570.2, "x": "窓はあった。数もそれなりにあった。"}, {"t": 572.4166666666666, "x": "ただ、その窓の前に、ほとんど\n商品の棚が置かれていた。"}, {"t": 576.2166666666667, "x": "……ふさいでたのね。"}, {"t": 577.4, "x": "ふさいでいた。長官の言葉ではこうだ。"}, {"t": 579.8166666666667, "x": "「窓の部分にはほとんどの窓に商品だなが\n設けられてございまして、まず、"}, {"t": 583.9666666666667, "x": "窓のない建物とほぼ同じような状況であった」。"}, {"t": 586.9833333333333, "x": "これを当時の言葉で「無窓建物」という。"}, {"t": 589.8166666666667, "x": "窓がふさがっていると、三つのことが同時に起きる。"}, {"t": 592.9, "x": "一つ、煙が外へ出ていかない。中にたまる。"}, {"t": 595.9666666666667, "x": "二つ、外から消防が中へ入れない。水もかけにくい。"}, {"t": 599.45, "x": "三つ、中の人が外へ出られない。"}, {"t": 601.8666666666667, "x": "……全部、逃げるのに関係してる。"}, {"t": 604.0333333333333, "x": "している。"}, {"t": 604.7333333333333, "x": "しかも、この棚がしっかり作られていた。"}, {"t": 607.2833333333333, "x": "長官は「相当がんじょうにできておりました」と\n言っている。"}, {"t": 610.7166666666667, "x": "窓を割って外へ出るには、まず\n棚をどかす必要があった。"}, {"t": 614.2666666666667, "x": "煙の中で？"}, {"t": 615.4166666666666, "x": "煙の中でだ。"}, {"t": 616.5666666666667, "x": "長官はこの点について、こう述べている。"}, {"t": 619.0333333333333, "x": "「相当これは力のある者でないというと、窓を\n破って出ることができない状況にあった」。"}, {"t": 624.1166666666667, "x": "この火事のあと、国は「有効な開口部」という\n言い方を何度も使うようになる。"}, {"t": 628.9333333333333, "x": "窓でもいい。ベランダでもいい。外階段でもいい。"}, {"t": 631.8, "x": "外につながる穴がいくつあるか。それが\n生き死にを分けた、という話が続く。"}, {"t": 637.05, "x": "ここで「縦穴区画」という言葉が出てくる。"}, {"t": 640.05, "x": "たてあなくかく。"}, {"t": 641.2166666666667, "x": "建物の中で、上下につながっている\n穴のことを縦穴という。"}, {"t": 644.9666666666667, "x": "階段、エスカレーター、\nエレベーターの通り道。それが縦穴だ。"}, {"t": 648.8166666666667, "x": "この縦穴に、火事のときだけ閉まる\n扉を付けて、上下を切り離す。"}, {"t": 653.0833333333334, "x": "これを縦穴区画という。"}, {"t": 654.75, "x": "煙が上に行かないようにするのね。"}, {"t": 656.95, "x": "そのための仕切りだ。"}, {"t": 658.2666666666667, "x": "大洋デパートでは、この仕切りが働いていなかった。"}, {"t": 661.3833333333333, "x": "長官の12月1日の報告では「\n縦穴区画がまだなされておらない」。"}, {"t": 665.8666666666667, "x": "12月7日の報告では、こう変わっている。"}, {"t": 668.65, "x": "「縦穴区画がなされておったわけでありますけれども、\n完全に閉鎖されておらなかった」。"}, {"t": 673.7166666666667, "x": "……言い方が変わってる。"}, {"t": 675.0833333333334, "x": "変わっている。無かったのか、あったけど\n閉まらなかったのか。"}, {"t": 678.5666666666667, "x": "そこは、この二つの記録の間で揺れている。"}, {"t": 681.35, "x": "私はどちらが正しいとは決めない。"}, {"t": 683.35, "x": "両方を並べておく。"}, {"t": 684.7333333333333, "x": "煙は階段を通って、上の階へ急速に広がった。"}, {"t": 688.1166666666667, "x": "当時の自治大臣、町村金五さんも、\n国会で同じ言い方をしている。"}, {"t": 692.4, "x": "「階段が煙突になってしまって、\nそこで煙に巻かれて」と。"}, {"t": 696.1, "x": "そして大臣は、こうも言っている。"}, {"t": 698.15, "x": "「いかに消防が手を尽くしましても、"}, {"t": 700.05, "x": "一たん火事が出ましたならば煙を\n防ぐということはほとんど不可能ではないか」。"}, {"t": 704.5666666666667, "x": "長官の報告にも、こうある。"}, {"t": 706.5166666666667, "x": "「死者は、屋外に出ることができないために、"}, {"t": 708.9666666666667, "x": "煙のために死亡したというのが\nほとんど全部でございます」。"}, {"t": 712.9833333333333, "x": "ここから、少しだけ違う話をする。"}, {"t": 715.4833333333333, "x": "この建物の中で、5階だけが例外だった。"}, {"t": 718.3833333333333, "x": "5階では、亡くなった方がほとんどいない。"}, {"t": 720.9, "x": "5階には、外へ出る道が二つあった。"}, {"t": 723.4333333333333, "x": "一つは、隣の建物へ渡る通路だ。"}, {"t": 726.0166666666667, "x": "デパートの事務の建物が隣にあって、\nそこへ渡り廊下がかかっていた。"}, {"t": 730.3166666666667, "x": "そうだ。もう一つが、増築工事の部分。"}, {"t": 733.0833333333334, "x": "横に建て増ししていた部分のコンクリートが、\nちょうど5階の高さまで打ち終わっていた。"}, {"t": 737.9333333333333, "x": "できていた。だから、そこへ出られた。"}, {"t": 740.2833333333333, "x": "長官の説明だ。"}, {"t": 741.6, "x": "「五階はそういう意味におきまして避難路が\n他の階に比べると二方面にあった」。"}, {"t": 746.0333333333333, "x": "建設大臣の亀岡さんも、同じことを国会で言っている。"}, {"t": 749.7166666666667, "x": "「五階の階においては一人も犠牲者が出てない」。"}, {"t": 752.4, "x": "「隣のビルに渡る工事用の木造の渡り\n廊下がつけてあったということで\n一人も犠牲者がなかった」。"}, {"t": 758.2, "x": "……渡り廊下があっただけで。"}, {"t": 759.9, "x": "それだけでだ。"}, {"t": 760.8666666666667, "x": "この「二方面」という言葉は、\nいまの防火の決まりに残っている。"}, {"t": 764.8333333333334, "x": "逃げる道は、必ず二方向に取れ、という考え方だ。"}, {"t": 768.4833333333333, "x": "一つだと、そっちが煙だったら終わりだもんね。"}, {"t": 771.5833333333334, "x": "5階の人は、たまたま道が二つあった。"}, {"t": 774.2833333333333, "x": "ほかの階の人は、たまたま一つしか無かった。"}, {"t": 777.3, "x": "その違いだけだ。"}, {"t": 778.5, "x": "本人の落ち度でも、勇気でもない。"}, {"t": 780.5166666666667, "x": "建物の作りの話だ。"}, {"t": 782.4333333333333, "x": "……たまたま、なのね。"}, {"t": 783.8666666666667, "x": "たまたまだ。そこは、はっきりさせておきたい。"}, {"t": 787.3, "x": "もう一つ、この火事には皮肉な話がある。"}, {"t": 790.05, "x": "工事の足場だ。"}, {"t": 791.1666666666666, "x": "増築工事と、防火設備の工事。"}, {"t": 793.3666666666667, "x": "両方をやっていたから、外に足場が組まれていた。"}, {"t": 796.4666666666667, "x": "中から外へ出られた人は、\nその足場を伝って下りている。"}, {"t": 800.0666666666667, "x": "……工事の足場で逃げたの。"}, {"t": 801.7166666666667, "x": "逃げた。長官はこう報告している。"}, {"t": 804.0, "x": "「その足場を利用いたしまして\n相当多数の人たちが脱出をいたしております」。"}, {"t": 808.5, "x": "消防隊が助け出した人は122名。"}, {"t": 811.2666666666667, "x": "そのうち、屋上からはしご車で下ろされた方が67名だ。"}, {"t": 815.2333333333333, "x": "はしご車、何台あったの。"}, {"t": 817.1166666666667, "x": "ここが問題でな。熊本市のはしご車は1台だった。"}, {"t": 820.4833333333333, "x": "1台だ。それでも救出は全部終わって、\n余力があった、と長官は言っている。"}, {"t": 825.3, "x": "ただし、そのあとにこう続けている。"}, {"t": 827.5, "x": "「もしこの建物にあの足場がない場合には、\n一台だけではおそらく救助が困難であったろう」。"}, {"t": 832.8666666666667, "x": "……足場が無かったら、もっと。"}, {"t": 834.7666666666667, "x": "もっと大きくなっていた、という意味だ。"}, {"t": 837.0, "x": "自衛隊のヘリコプターも7機来ている。"}, {"t": 839.45, "x": "ヘリで助けられなかったの。"}, {"t": 841.25, "x": "できなかった。火の上は空気が激しく上へ動く。"}, {"t": 844.2666666666667, "x": "長官の言葉では「上昇気流が非常に激しいために\nヘリコプターによる救出は不可能であった」。"}, {"t": 850.0333333333333, "x": "つまりこの日、人を外へ出したのは、\n消防の装備ではない。"}, {"t": 853.7, "x": "工事のために、たまたま組んであった足場だった。"}, {"t": 856.6333333333333, "x": "……工事中だったから、助かった人もいるのね。"}, {"t": 859.6166666666667, "x": "そういうことになる。"}, {"t": 860.7833333333333, "x": "工事中だったから設備が動かず、\n工事中だったから足場があった。"}, {"t": 865.4166666666666, "x": "ここから、少し珍しい記録の話をする。"}, {"t": 868.3166666666667, "x": "この火事では、逃げた人たち本人への聞き取り\n調査が行われている。"}, {"t": 872.5833333333334, "x": "本人に？"}, {"t": 873.5, "x": "本人にだ。しかも火事の直後にな。"}, {"t": 875.9166666666666, "x": "やったのは、京都大学の堀内三郎さんの研究室だ。"}, {"t": 879.5666666666667, "x": "当時そこにいた室崎益輝さんが、\nのちに記録を残している。"}, {"t": 883.4166666666666, "x": "テレビのニュースで火事を知った堀内さんから\n呼び出されたのが、その日の午後2時ごろ。"}, {"t": 888.2666666666667, "x": "……火が消える前じゃない。"}, {"t": 889.6333333333333, "x": "消える前だ。指示は、逃げた人の行動を\n調べるから、すぐ準備しろ、というものだった。"}, {"t": 895.0666666666667, "x": "先発は、その日の夜行列車で熊本へ。"}, {"t": 897.7666666666667, "x": "作った。当時はワープロもコピー機も無い。"}, {"t": 900.0833333333334, "x": "ガリ版で刷っている。"}, {"t": 901.4, "x": "この研究室は、逃げるときの行動を科学で\n捉えよう、という研究を続けていた。"}, {"t": 906.3666666666667, "x": "聞き取りに応じた方は、全部で180名。"}, {"t": 909.35, "x": "逃げる必要があった3階から上でいうと、\n従業員が44名、お客さんが76名だ。"}, {"t": 915.25, "x": "よく話してくれたわね。"}, {"t": 916.9166666666666, "x": "従業員側はデパートの社長が協力を呼びかけている。"}, {"t": 920.1166666666667, "x": "お客さん側は、消防局が搬送した\n方の名簿を出して、そこから紹介された。"}, {"t": 925.1833333333333, "x": "室崎さんは、あとでこう書いている。"}, {"t": 927.3666666666667, "x": "いまの時代なら、この調査はできない、と。"}, {"t": 930.0666666666667, "x": "個人の情報だものね。"}, {"t": 931.7166666666667, "x": "そうだ。だからこれは、二度と\n取れない記録ということになる。"}, {"t": 935.2166666666667, "x": "次の章から、その中身を見ていく。"}, {"t": 938.1666666666666, "x": "まず、お客さんと従業員で、\n行動がはっきり分かれている。"}, {"t": 941.85, "x": "どう違うの。"}, {"t": 942.8333333333334, "x": "火事だと気づいた直後の一手が違う。"}, {"t": 945.1166666666667, "x": "お客さんの多くは、気づいたらすぐ逃げ始めている。"}, {"t": 948.1333333333333, "x": "従業員は、そうじゃない。"}, {"t": 949.85, "x": "逃げないの？"}, {"t": 950.8, "x": "まず人に知らせに行く。"}, {"t": 952.1333333333333, "x": "燃えている場所を確かめに行く。"}, {"t": 953.8333333333334, "x": "荷物を取りに行く。"}, {"t": 955.25, "x": "……仕事だからよね。"}, {"t": 956.5666666666667, "x": "仕事だからだ。責める話じゃない。"}, {"t": 958.8166666666667, "x": "次に、逃げる方向も違う。"}, {"t": 960.7333333333333, "x": "お客さんは、もと来た方向へ戻ろうとする。"}, {"t": 963.55, "x": "入ってきた道ね。"}, {"t": 964.9666666666667, "x": "そうだ。人は知らない道より、来た道を選ぶ。"}, {"t": 967.95, "x": "従業員は、ふだん使っている階段へ向かう。"}, {"t": 970.7333333333333, "x": "問題は、その知っている道が、\nこの日は煙の通り道だったことだ。"}, {"t": 975.0, "x": "出火したのは、従業員が使う階段の踊り場だからな。"}, {"t": 978.6666666666666, "x": "……いつもの階段が、一番危ないところだったの。"}, {"t": 981.7, "x": "そうなる。"}, {"t": 982.4, "x": "従業員が亡くなった割合が高かったことは、\n国会でも報告されている。"}, {"t": 986.8166666666667, "x": "長官は、お客さんの数から見ると\n従業員の被害の割合が約10倍だ、と述べている。"}, {"t": 992.2166666666667, "x": "10倍。"}, {"t": 992.9666666666667, "x": "10倍だ。長官はその理由を、こう見ている。"}, {"t": 995.7333333333333, "x": "従業員はお客さんの誘導を相当やっていた。\nそれでも逃げ道が無かった、と。"}, {"t": 1000.4166666666666, "x": "「結局、避難路がなかったために、従業員もろとも\n死亡するというようなことになった」。"}, {"t": 1005.6666666666666, "x": "……誘導してた人が。"}, {"t": 1007.15, "x": "そういう記録になっている。"}, {"t": 1009.3333333333334, "x": "この調査には、もう一つ、重い結果がある。"}, {"t": 1012.2166666666667, "x": "同じ従業員でも、正社員と\nパートで、選んだ道が違った。"}, {"t": 1016.1, "x": "正社員のほうは、隣の建物への渡り\n廊下など、安全な道を選んでいる。"}, {"t": 1020.7333333333333, "x": "パートのほうは、煙が入っている\n階段を選ぶ傾向があった。"}, {"t": 1024.4333333333334, "x": "どうして。"}, {"t": 1025.2833333333333, "x": "知らないからだ。"}, {"t": 1026.3166666666666, "x": "渡り廊下がどこにあるか。"}, {"t": 1027.7833333333333, "x": "増築部分のどこから出られるか。"}, {"t": 1029.9, "x": "それは、その建物を毎日使っている\n人の頭の中にしか無い。"}, {"t": 1034.1166666666666, "x": "……働いている時間が短いと、知らないのね。"}, {"t": 1037.05, "x": "知らない。室崎さんはこれを\n「安全格差」と呼んでいる。"}, {"t": 1040.6, "x": "空間を知っている人と、知らない\n人の間にある差、という意味だ。"}, {"t": 1044.7333333333333, "x": "……知ってるか知らないかで、分かれちゃったの。"}, {"t": 1047.2833333333333, "x": "分かれた、という結果が出ている。"}, {"t": 1049.2833333333333, "x": "逃げるときの心の状態についても、記録が残っている。"}, {"t": 1052.7666666666667, "x": "ほとんどの人が、途中で頭に血が上って、何が\n何だか分からなくなる状態を経験している。"}, {"t": 1058.6333333333334, "x": "……パニック。"}, {"t": 1059.5, "x": "そのきっかけが、二種類あった。"}, {"t": 1061.55, "x": "一つは、息が苦しくなること。"}, {"t": 1063.5666666666666, "x": "体のほうからくる。"}, {"t": 1064.9333333333334, "x": "もう一つは、どこへ逃げていいか分からなくなること。"}, {"t": 1067.7833333333333, "x": "頭のほうからくる。"}, {"t": 1069.15, "x": "従業員は前のほうが多く、\nお客さんは後のほうが多かった。"}, {"t": 1072.85, "x": "……お客さんは、道が分からないのよね。"}, {"t": 1075.2833333333333, "x": "分からない。だから「どこへ」で止まる。"}, {"t": 1078.35, "x": "この調査には、当時の言葉で\n「不適応行動」と呼ばれたものが出てくる。"}, {"t": 1083.0, "x": "ふてきおう。"}, {"t": 1083.8833333333334, "x": "火事のときに、火事に合っていない\n動きをしてしまうことだ。"}, {"t": 1087.2, "x": "一つ目。レジのお金を数えていた従業員がいる。"}, {"t": 1090.2666666666667, "x": "売り上げの帳尻を合わせて、袋に詰めていた。"}, {"t": 1093.2166666666667, "x": "……逃げないで？"}, {"t": 1094.15, "x": "逃げないでだ。毎日やっている手順だからな。"}, {"t": 1096.9166666666667, "x": "室崎さんは「職務に忠実なあまり、\nみずからの避難を遅らせ」と書いている。"}, {"t": 1101.7666666666667, "x": "二つ目。エレベーターへ向かった人がいる。"}, {"t": 1104.2833333333333, "x": "それでも、人は上下に動く道として、\nまずエレベーターを思い浮かべる。"}, {"t": 1108.45, "x": "三つ目。燃えていないところに、煙に\n向かって消火器を向けた人がいる。"}, {"t": 1112.9, "x": "……煙を消そうとしたのね。"}, {"t": 1114.6, "x": "煙は消火器では消えない。それでも、\n目の前にあるものに向けてしまう。"}, {"t": 1118.75, "x": "階段の無い窓際に、たくさんの人が\n集まっていた場所がある。"}, {"t": 1122.5666666666666, "x": "階段が無いのに？"}, {"t": 1123.8666666666666, "x": "無いのにだ。理由も書かれている。"}, {"t": 1125.9, "x": "その窓から、外の光が差し込んでいた。"}, {"t": 1128.75, "x": "……あ。"}, {"t": 1129.2166666666667, "x": "光が見えると、そこから外へ出られるように思える。"}, {"t": 1132.35, "x": "室崎さんは「その光の漏れが外部に\n避難できるという錯覚を生んだもの」と書いている。"}, {"t": 1137.7333333333333, "x": "煙の中で、人は明るいほうへ行く。"}, {"t": 1140.1, "x": "それは間違いではない。ふだんは正しい。"}, {"t": 1142.55, "x": "……正しいのに、その日は違ったのね。"}, {"t": 1144.9333333333334, "x": "違った。"}, {"t": 1145.6666666666667, "x": "この火事は、そのことを日本に教えた火事でもある。"}, {"t": 1149.3, "x": "ここで、この回で一番やりたかった話をする。"}, {"t": 1152.2333333333333, "x": "この火事で亡くなった方の数だ。"}, {"t": 1154.4333333333334, "x": "最初に100人って言ってたわよね。"}, {"t": 1156.6333333333334, "x": "言った。消防庁の資料の数字だ。"}, {"t": 1158.8833333333334, "x": "ただ、世の中で一番よく見るのは104人のほうだ。"}, {"t": 1162.2333333333333, "x": "……えっ。違うの？"}, {"t": 1163.4666666666667, "x": "私が自分で開いて確かめられた\n資料を、日付の順に並べていく。"}, {"t": 1167.7166666666667, "x": "一つ目。1973年12月1日、参議院の地方行政委員会。"}, {"t": 1172.9, "x": "消防庁長官が、前の日の午後6時の時点では\n死者101人と報告されていた、と述べている。"}, {"t": 1178.8833333333334, "x": "そのうえで、その場でこう訂正している。"}, {"t": 1181.1, "x": "「この死者が百人というふうに\n訂正をされております」。"}, {"t": 1184.1833333333334, "x": "このときの怪我をされた方は95人だ。"}, {"t": 1186.9166666666667, "x": "101から100に直したのね。"}, {"t": 1188.9666666666667, "x": "直した。次。"}, {"t": 1190.1333333333334, "x": "二つ目。同じ年の12月7日、\n衆議院の地方行政委員会。同じ長官だ。"}, {"t": 1195.4666666666667, "x": "ここでは「死者は百一人でございます」と言っている。"}, {"t": 1198.85, "x": "……101に戻ってる。"}, {"t": 1200.3, "x": "戻っている。そして、こう続く。"}, {"t": 1202.4833333333333, "x": "「その後、病院に収容されましてから四十八時間後に\n死亡いたしました者が三名ございます」。"}, {"t": 1208.25, "x": "「したがいまして、その後の死者も加えますと\n死者が百四名ということでございます」。"}, {"t": 1213.15, "x": "……あ。104が出てきた。"}, {"t": 1214.8, "x": "出てきた。101に3を足して104だ。"}, {"t": 1217.4666666666667, "x": "このときの怪我をされた方は128人。"}, {"t": 1220.0333333333333, "x": "重い方が14人、軽い方が114人と報告されている。"}, {"t": 1223.9833333333333, "x": "三つ目。12月13日、\n衆議院の地方行政委員会。また同じ長官だ。"}, {"t": 1229.1333333333334, "x": "「死者が、先般は百一人と"}, {"t": 1230.85, "x": "申し上げましたのが、その後の調査に\nよりまして百人というふうになっております」。"}, {"t": 1235.7166666666667, "x": "……また100に戻った。"}, {"t": 1237.15, "x": "戻った。しかも、このときは内訳まで出している。"}, {"t": 1240.3, "x": "男性29人、うち従業員が10人。"}, {"t": 1242.8, "x": "女性71人、うち従業員が39人。"}, {"t": 1245.9333333333334, "x": "お客さんが51人、従業員が49人。"}, {"t": 1248.8333333333333, "x": "足すと100人だ。"}, {"t": 1250.0833333333333, "x": "そして、怪我をされた方が119人。"}, {"t": 1252.6833333333334, "x": "「そのうち三名が死亡いたしております」と続く。"}, {"t": 1255.7666666666667, "x": "……その3人、さっきの3人よね。"}, {"t": 1258.0666666666666, "x": "たぶん同じ3人だ。ただし「同じだ」とは\nどこにも書かれていない。"}, {"t": 1262.1666666666667, "x": "12月7日には死者のほうに足されていて、\n12月13日には怪我をされた方のほうに入っている。"}, {"t": 1268.2833333333333, "x": "……数え方が変わったの？"}, {"t": 1269.8666666666666, "x": "変わったように見える。でも、なぜ\n変えたのかは、どの記録にも書かれていない。"}, {"t": 1274.25, "x": "四つ目。1974年5月24日、衆議院の建設委員会。"}, {"t": 1279.1166666666666, "x": "村田敬次郎委員が、建築基準法の改正について\n質問する中でこう述べている。"}, {"t": 1284.1666666666667, "x": "「死者百名、負傷者百二十四名という\nわが国火災史上まれに見る大惨事となりました」。"}, {"t": 1289.6833333333334, "x": "100人と124人。"}, {"t": 1291.3666666666666, "x": "この組み合わせが、\nいまの国の資料に残っているものだ。"}, {"t": 1294.7, "x": "五つ目。総務省消防庁が平成30年、\n2018年に出した予防行政の資料。"}, {"t": 1300.2333333333333, "x": "古い建物への規制を強めてきた年表が載っている。"}, {"t": 1303.45, "x": "そこに「昭和48年11月 熊本市大洋デパート火災」と\n並んで、数字が三つ書いてある。"}, {"t": 1309.9833333333333, "x": "焼けた面積が19,074。"}, {"t": 1312.3333333333333, "x": "死者100。負傷124。"}, {"t": 1314.4666666666667, "x": "……45年たっても100人なのね、国の資料だと。"}, {"t": 1317.8, "x": "100人だ。ここは動いていない。"}, {"t": 1319.7666666666667, "x": "六つ目。今度は研究者の側だ。"}, {"t": 1322.05, "x": "さっき出てきた室崎益輝さんが、\n関西学院大学の研究紀要に書いた文章。"}, {"t": 1327.2166666666667, "x": "そこには「死者は103名、負傷者は\n124名であった」とある。"}, {"t": 1331.75, "x": "103。また違う。"}, {"t": 1333.25, "x": "違う。しかも内訳が、国の記録と違う形になっている。"}, {"t": 1337.1333333333334, "x": "お客さんが48名、従業員が\n52名、そして作業員が3名。"}, {"t": 1341.8166666666666, "x": "……作業員。工事の人ね。"}, {"t": 1343.6, "x": "工事の人だ。国の記録には、この区分が無い。\nお客さんと従業員の二つしか無かった。"}, {"t": 1349.2333333333333, "x": "焼けた面積も違う。室崎さんの文章では\n12,581平方メートル。"}, {"t": 1354.6, "x": "消防庁の資料は19,074だ。"}, {"t": 1357.5, "x": "……面積まで違うの。"}, {"t": 1358.95, "x": "違う。測り方が違うのか、範囲が\n違うのか。そこも書かれていない。"}, {"t": 1363.3666666666666, "x": "七つ目。東京理科大学の小林恭一さんが\n書いた解説では"}, {"t": 1367.3333333333333, "x": "「100人の方が亡くなる熊本市大洋デパート火災」。"}, {"t": 1370.6333333333334, "x": "これは消防庁の数字と同じだ。"}, {"t": 1372.6833333333334, "x": "八つ目。国立国会図書館が運営している、\n図書館の調べもの記録のデータベースがある。"}, {"t": 1378.2833333333333, "x": "そこに2010年に載った質問の文が、こうなっている。"}, {"t": 1381.7, "x": "「熊本大洋デパート火災、昭和48年11月発生、\n死者107名の判例を知りたい」。"}, {"t": 1387.8333333333333, "x": "……107。"}, {"t": 1388.7166666666667, "x": "107だ。これは国の統計ではない。"}, {"t": 1390.95, "x": "図書館に来た質問の書き方だ。"}, {"t": 1393.25, "x": "それでも、公の記録としてそう残っている。"}, {"t": 1396.1166666666666, "x": "並べ直すぞ。100人。"}, {"t": 1397.5833333333333, "x": "101人。103人。"}, {"t": 1399.15, "x": "104人。107人。"}, {"t": 1400.8, "x": "怪我をされた方のほうは、95人。"}, {"t": 1403.0, "x": "119人。124人。128人。"}, {"t": 1406.3333333333333, "x": "……こんなに揺れるものなの。"}, {"t": 1407.8833333333334, "x": "揺れる。理由はいくつも考えられる。"}, {"t": 1410.1166666666666, "x": "すぐには数え終わらない。"}, {"t": 1411.4333333333334, "x": "あとから亡くなる方がいる。"}, {"t": 1412.9833333333333, "x": "どこまでを火事の被害とするか決め方がある。"}, {"t": 1415.7166666666667, "x": "でも、そのどれが理由だったのかは、私が\n開けた資料の中には書かれていなかった。"}, {"t": 1420.65, "x": "だから、決めない。"}, {"t": 1421.8833333333334, "x": "104人という数字は、誰かが盛ったものではない。"}, {"t": 1424.8833333333334, "x": "1973年12月7日、消防庁長官が\n国会で自分の口から言った数字だ。"}, {"t": 1430.75, "x": "100人という数字も、同じ長官が、\n6日後に同じ国会で言った数字だ。"}, {"t": 1435.5, "x": "……どっちも本物なのね。"}, {"t": 1437.1166666666666, "x": "どちらも本物だ。"}, {"t": 1438.3833333333334, "x": "この火事では、亡くなった方の数さえ、\n53年たったいまも一つに揃っていない。"}, {"t": 1444.0833333333333, "x": "ここも、決まっていない。"}, {"t": 1445.5833333333333, "x": "場所までは分かっている。"}, {"t": 1446.8333333333333, "x": "2階から3階へ上がる階段の踊り場付近。"}, {"t": 1449.55, "x": "そこに置かれていた段ボール箱や\n商品が燃えた、と見られている。"}, {"t": 1453.2166666666667, "x": "室崎益輝さんの文章には、こう書かれている。"}, {"t": 1456.2333333333333, "x": "「出火原因は、たばこの不始末か"}, {"t": 1458.4166666666667, "x": "マッチのポイ捨てあるいは放火と\nいわれているが、よくわかっていない」。"}, {"t": 1461.95, "x": "……三つとも「といわれている」なのね。"}, {"t": 1464.3333333333333, "x": "三つとも、だ。どれも確かめられていない。"}, {"t": 1467.0, "x": "だから私は、この三つのどれかを\n選んで話すことはしない。"}, {"t": 1470.55, "x": "特に放火については、慎重に扱う必要がある。"}, {"t": 1473.8666666666666, "x": "どうして。"}, {"t": 1474.7166666666667, "x": "放火だと言うことは、火をつけた\n人がいると言うことだからだ。"}, {"t": 1478.2333333333333, "x": "その人が誰かは、\n決まっていない。というより、いたのか\nどうかも決まっていない。"}, {"t": 1482.7166666666667, "x": "決まっていないことを、決まったように\n話すのは、この番組ではやらない。"}, {"t": 1486.75, "x": "当時、会社の側が\n放火の可能性を挙げたことは報じられている。"}, {"t": 1490.55, "x": "ただ、それは会社の側の言い分として\n報じられたものだ。"}, {"t": 1493.95, "x": "裁判所が放火だと認めた、という記録は出てこない。"}, {"t": 1497.2, "x": "私が確かめられた範囲で言えるのは、これだけだ。"}, {"t": 1500.2666666666667, "x": "出火の場所は推定されている。"}, {"t": 1502.05, "x": "出火の原因は特定されていない。"}, {"t": 1504.3666666666666, "x": "……53年たっても。"}, {"t": 1505.8833333333334, "x": "53年たってもだ。"}, {"t": 1507.4166666666667, "x": "100人以上の方が亡くなって、何から\n火が出たのかが決まっていない。"}, {"t": 1511.4666666666667, "x": "それが、この火事のいちばん奇妙なところだ。"}, {"t": 1514.7333333333333, "x": "ここからは、火事の前の話に戻る。"}, {"t": 1517.15, "x": "この建物は、放っておかれていたわけじゃない。"}, {"t": 1519.9666666666667, "x": "どういうこと。"}, {"t": 1520.9833333333333, "x": "消防は毎年、この建物を見に行っていた。査察という。"}, {"t": 1524.5666666666666, "x": "中でも一番細かく見たのが、昭和46年の暮れ。"}, {"t": 1528.0, "x": "1971年の年末だ。"}, {"t": 1530.55, "x": "火事の2年前ね。"}, {"t": 1531.95, "x": "2年前だ。このとき、\nかなりの数の問題点が見つかっている。"}, {"t": 1535.8333333333333, "x": "長官の言葉では「相当多数の項目につきまして、\n防火上の問題点あるいは法令違反の点を指摘」。"}, {"t": 1542.3, "x": "そして、直すように警告を出している。"}, {"t": 1544.7166666666667, "x": "ここからが重い。長官はこう続けている。"}, {"t": 1547.2666666666667, "x": "そのあとも数回、査察をして警告を出した。"}, {"t": 1550.2166666666667, "x": "「その警告の内容は、四十六年以来ほとんど\n同様な警告になっておる」。"}, {"t": 1554.8833333333334, "x": "……同じ警告を、ずっと。"}, {"t": 1556.6333333333334, "x": "ずっとだ。長官自身が、その意味をこう説明している。"}, {"t": 1560.0833333333333, "x": "「デパート側におきましてこうした警告に"}, {"t": 1562.25, "x": "対する改善措置が\nとられなかったということの証明になるかと\n思います」。"}, {"t": 1566.5, "x": "消防の側にも問題があった、と自分から言っている。"}, {"t": 1569.6833333333334, "x": "「消防側といたしましても、そうした査察の結果、"}, {"t": 1572.7333333333333, "x": "不備な点あるいは違法な点等を指摘しながら、\nそれを最後まで追及しなかった」。"}, {"t": 1577.5833333333333, "x": "「査察をし、警告のしっぱなしにしておったという\n点に、やはり消防側としては非常に問題がある」。"}, {"t": 1583.5333333333333, "x": "……しっぱなし。"}, {"t": 1584.5166666666667, "x": "自分の役所のことを、国会でそう言っている。"}, {"t": 1587.25, "x": "「私どもも深く反省をしておるわけでございます」。"}, {"t": 1590.2333333333333, "x": "謝っている。火事から2週間後の国会でだ。"}, {"t": 1593.1166666666666, "x": "ちなみに、この火事のあと、国は\n全国の大きな都市のデパートを調べている。"}, {"t": 1597.5666666666666, "x": "はっきり消防法に違反している店が5店。"}, {"t": 1600.1333333333334, "x": "違反ではないが設備が整っていない店が7店。"}, {"t": 1603.25, "x": "……ほかにもあったの。"}, {"t": 1604.5166666666667, "x": "あった。大洋デパートだけの\n話ではなかった、ということだ。"}, {"t": 1608.8333333333333, "x": "1973年12月15日。"}, {"t": 1611.4333333333334, "x": "火事から16日後の国会だ。"}, {"t": 1613.5666666666666, "x": "衆議院の地方行政委員会で、\n佐藤敬治委員がこう言っている。"}, {"t": 1617.2833333333333, "x": "「あれだけの大災害がありながら、消防庁も、"}, {"t": 1619.9333333333334, "x": "建設省も、通産省も、県も自治体も、\nどこも責任を負うところはないのです」。"}, {"t": 1625.2, "x": "「しかもその無責任な状態において\n人が百人死んでいるんですよ」。"}, {"t": 1628.9333333333334, "x": "……。"}, {"t": 1629.8666666666666, "x": "「あの建物は、厳然としてどこかが、\nだれかが許可しているのでしょう」。"}, {"t": 1633.9333333333334, "x": "「消防庁は消防の関係で、建設省は"}, {"t": 1636.5333333333333, "x": "建物の関係で、それから通産省は百貨店を\n営業してもよろしいという許可をしている」。"}, {"t": 1641.7, "x": "「それで厳としてやっているものだから、"}, {"t": 1643.7, "x": "住民はこれならだいじょうぶだと\n安心してあそこに行っているのです」。"}, {"t": 1647.4333333333334, "x": "「ところがそれによって死んでしまった。\nだれも責任を負わない」。"}, {"t": 1651.0, "x": "……安心して行った、って。"}, {"t": 1652.55, "x": "誰かが許可を出しているから、大丈夫だと思って入る。"}, {"t": 1655.9833333333333, "x": "……そうよね。普通そう思う。"}, {"t": 1657.75, "x": "この委員は、その「誰か」が\nどこにもいない、と言っている。"}, {"t": 1661.3166666666666, "x": "これに答えたのが、自治大臣の町村金五さんだ。"}, {"t": 1664.5666666666666, "x": "「近年たびたび大きな火災が起きて、そのときはみな"}, {"t": 1667.9333333333334, "x": "非常にこの問題について真剣に努力を\nし合うのでございますけれども」。"}, {"t": 1671.6166666666666, "x": "「結果的に見ますると、その教訓が\nほとんど生かされていない」。"}, {"t": 1675.25, "x": "「まことに残念千万なことだと思います」。"}, {"t": 1677.9333333333334, "x": "……大臣も認めてるのね。"}, {"t": 1679.6333333333334, "x": "認めている。"}, {"t": 1680.5333333333333, "x": "そのうえで、大臣はこう言った。"}, {"t": 1682.3333333333333, "x": "古い建物にも新しい決まりを当てはめたい、と。"}, {"t": 1685.3333333333333, "x": "「今度は私は、安全なそういう\n建築基準ができましたならば、せひこれを"}, {"t": 1689.8, "x": "遡及させるようにするということをやりたいものだ」。"}, {"t": 1692.4666666666667, "x": "遡及。さかのぼって当てはめる、という、あの言葉だ。"}, {"t": 1696.3666666666666, "x": "火事の翌年、1974年6月。"}, {"t": 1699.4333333333334, "x": "国会で、消防法の改正が可決された。"}, {"t": 1702.3833333333334, "x": "何が変わったの。"}, {"t": 1703.65, "x": "デパートやホテルのように、\n不特定多数の人が出入りする建物。"}, {"t": 1707.55, "x": "これを特定防火対象物という。"}, {"t": 1709.6333333333334, "x": "この特定防火対象物については、古い\n建物にも消防の設備を付けさせることにした。"}, {"t": 1715.1333333333334, "x": "付けさせる。スプリンクラー。"}, {"t": 1716.75, "x": "自動火災報知設備。非常用の電源。"}, {"t": 1719.4333333333334, "x": "東京理科大学の小林恭一さんは、\nこの改正をこう書いている。"}, {"t": 1723.4, "x": "「消防庁は、ついに特定防火対象物に対する\n全消防用設備等の遡及設置に踏み切った」。"}, {"t": 1729.3333333333333, "x": "同時に、ほかにも三つ新しい仕組みができている。"}, {"t": 1732.4, "x": "一つ、防火管理について、消防が\n「こうしろ」と命令できる権限。"}, {"t": 1736.8333333333333, "x": "二つ、設備を付けたときに消防が検査する仕組み。"}, {"t": 1740.1833333333334, "x": "三つ、決まった時期に点検して報告させる仕組みだ。"}, {"t": 1743.6166666666666, "x": "そうだ。付けただけでは働かない。"}, {"t": 1745.6666666666667, "x": "大洋デパートのスプリンクラーがそうだったからな。"}, {"t": 1748.5666666666666, "x": "デパートのような物を売る店では、"}, {"t": 1750.35, "x": "1974年6月から1977年3月までが、\nその付け替えの期間になった。"}, {"t": 1756.75, "x": "では、建物そのもののほうはどうなったか。"}, {"t": 1759.45, "x": "建築基準法のほう。"}, {"t": 1761.0666666666666, "x": "そっちは、うまくいかなかった。"}, {"t": 1762.9666666666667, "x": "改正案は1974年3月に国会へ出されて、\n1976年5月まで2年以上、審議が続いた。"}, {"t": 1770.5166666666667, "x": "それでも、階段を区切れとか、逃げ道を作れという\n部分を古い建物に当てはめることは、実現していない。"}, {"t": 1776.9833333333333, "x": "技術のうえでも、お金のうえでも\n難しい、というのが理由だ。"}, {"t": 1780.6, "x": "ただ、一つだけ通ったものがある。"}, {"t": 1782.8166666666666, "x": "1976年5月、工事中の建物の\n「仮使用」についての決まりができた。"}, {"t": 1788.4333333333334, "x": "工事の途中の建物を、使いながら営業していいか\nどうかを、先に承認させる仕組みだ。"}, {"t": 1793.7166666666667, "x": "小林さんは、この決まりができた\n理由をはっきり書いている。"}, {"t": 1797.1, "x": "この火事で多くの方が亡くなった理由の一つが、"}, {"t": 1799.8666666666666, "x": "工事中で多くの階段が使えないまま\n営業していたことにある、と。"}, {"t": 1804.0, "x": "……あの工事のことね。"}, {"t": 1805.35, "x": "あの工事のことだ。"}, {"t": 1806.5666666666666, "x": "火事1件あたりに焼ける面積が、1970年から\n1975年のあいだに大きく下がっている。"}, {"t": 1813.1666666666667, "x": "小林さんはこれを\n「劇的と言ってもよいほどだ」と書いている。"}, {"t": 1816.9166666666667, "x": "室崎さんも「1974年以降のデパート火災は\n急激に減少している」と書いている。"}, {"t": 1822.8666666666666, "x": "……減ったのね。"}, {"t": 1823.8666666666666, "x": "減った。100人の方が亡くなったあとで、だ。"}, {"t": 1827.3666666666666, "x": "この火事では、刑事の裁判が行われている。"}, {"t": 1830.2333333333333, "x": "誰が裁かれたの。"}, {"t": 1831.6166666666666, "x": "デパートの側の人たちだ。名前は出さない。"}, {"t": 1834.3166666666666, "x": "起訴されたのは5人。"}, {"t": 1835.4833333333333, "x": "社長、常務取締役、取締役の人事部長、\n3階の売り場の課長、営繕課の課員。"}, {"t": 1841.4833333333333, "x": "最後の営繕課の課員が、あの防火管理者だった人だ。"}, {"t": 1844.9, "x": "「業務上過失致死傷」という。"}, {"t": 1846.9, "x": "仕事の上での不注意で、人を死なせたり\n怪我をさせたりした罪、という意味だ。"}, {"t": 1851.5, "x": "ただ、5人のうち2人は、判断が\n出る前に亡くなっている。"}, {"t": 1855.2666666666667, "x": "……えっ。"}, {"t": 1855.8833333333334, "x": "社長は一審の裁判が始まる前に。"}, {"t": 1858.1, "x": "常務取締役は裁判の途中にだ。"}, {"t": 1860.6166666666666, "x": "そして最高裁判所が判断を出したのが、\n1991年11月14日。"}, {"t": 1865.9833333333333, "x": "第一小法廷の判決だ。"}, {"t": 1867.7333333333333, "x": "事件番号は昭和63年、あ、第1064号。"}, {"t": 1871.4166666666667, "x": "昭和63年ということは、最高裁に\n上がったのが1988年、ということになる。"}, {"t": 1877.2666666666667, "x": "デパートの火災事故について、\n取締役人事部長、売り場課長、"}, {"t": 1881.2, "x": "営繕課員に業務上過失致死傷罪は成立しない。"}, {"t": 1884.5833333333333, "x": "……3人とも。"}, {"t": 1885.65, "x": "3人ともだ。"}, {"t": 1886.7, "x": "防火管理者だった課員については、"}, {"t": 1888.65, "x": "防火管理の仕事を適切に進められる立場でも\n力でもなかった、という判断がされている。"}, {"t": 1894.35, "x": "人事部長については、防火管理について全体の権限を\n持つ代表取締役が別にいた、という判断だ。"}, {"t": 1900.9333333333334, "x": "売り場の課長については、"}, {"t": 1902.2666666666667, "x": "階段の防火シャッターを閉めなかったことを\n落ち度とは言えない、とされている。"}, {"t": 1906.4833333333333, "x": "……じゃあ、責任があったのは。"}, {"t": 1908.3166666666666, "x": "そこは、この判決では決まらなかった。"}, {"t": 1910.8166666666666, "x": "全体の権限を持っていたとされる代表取締役は、\n裁判が始まる前に亡くなっている。"}, {"t": 1916.4166666666667, "x": "……いないのね。"}, {"t": 1917.3333333333333, "x": "いない。"}, {"t": 1917.8666666666666, "x": "一審と二審が何年に何を決めたのかは、私は\n判決の原文にも公的な資料にもたどりつけなかった。"}, {"t": 1924.4166666666667, "x": "だから今日は言わない。"}, {"t": 1925.5, "x": "確かめられていないことは、話さない。"}, {"t": 1927.9166666666667, "x": "火事は1973年11月29日。"}, {"t": 1931.0333333333333, "x": "最高裁の判決は1991年11月14日。"}, {"t": 1935.1, "x": "18年かかって、罪に問われた\n人はいない、という形で終わった。"}, {"t": 1939.9333333333334, "x": "最後にまとめる。"}, {"t": 1941.0833333333333, "x": "1973年11月29日、午後1時15分ごろ、\n熊本市下通一丁目。"}, {"t": 1947.1166666666666, "x": "2階から3階へ上がる階段の踊り場付近から火が出た。"}, {"t": 1950.4833333333333, "x": "通報は1時23分。消防が来たときには、\n屋上まで煙が回っていた。"}, {"t": 1955.3333333333333, "x": "放送設備はあったが動いていない。"}, {"t": 1957.2333333333333, "x": "火災報知機は工事中。"}, {"t": 1958.8666666666666, "x": "スプリンクラーは、付いた\n部分にも水が来ていなかった。"}, {"t": 1962.05, "x": "窓は商品の棚でふさがれ、階段は煙突になった。"}, {"t": 1965.4166666666667, "x": "外へ出る道が二つあった5階だけが、助かった。"}, {"t": 1968.6166666666666, "x": "外へ出た人を下ろしたのは、\n工事のために組んであった足場だ。"}, {"t": 1972.2333333333333, "x": "夜9時19分に鎮火。約8時間。"}, {"t": 1975.05, "x": "……はっきりしていないほうは。"}, {"t": 1976.65, "x": "一つ。何から火が出たのかが決まっていない。"}, {"t": 1979.4333333333334, "x": "二つ。亡くなった方の数が、資料ごとに違う。"}, {"t": 1982.6666666666667, "x": "100人、101人、103人、104人、107人。"}, {"t": 1986.4, "x": "怪我をされた方も、95人、119人、\n124人、128人と揺れている。"}, {"t": 1992.15, "x": "三つ。刑事の責任が、\n誰のものだったのかが決まっていない。"}, {"t": 1996.0, "x": "18年かけて出た答えは、\nこの3人ではない、というものだった。"}, {"t": 2000.1833333333334, "x": "……三つとも、決まってないのね。"}, {"t": 2002.1833333333334, "x": "決まっていない。"}, {"t": 2003.15, "x": "先へ進む前に、今日の話の出どころを挙げておく。"}, {"t": 2006.2833333333333, "x": "火災の経過と被害の数字は、\n国立国会図書館の国会会議録検索システムから。"}, {"t": 2011.8166666666666, "x": "第72回国会 参議院地方行政委員会 第1号、\n1973年12月1日。"}, {"t": 2018.3666666666666, "x": "第72回国会 衆議院地方行政委員会 第1号、\n1973年12月7日。"}, {"t": 2024.8333333333333, "x": "第72回国会 衆議院地方行政委員会 第2号、\n1973年12月13日。"}, {"t": 2031.4666666666667, "x": "第72回国会 衆議院建設委員会 第18号、\n1974年5月24日。"}, {"t": 2037.9833333333333, "x": "死者100人・負傷124人の数字は、\n総務省消防庁の予防行政の資料から。"}, {"t": 2043.2833333333333, "x": "逃げるときの行動の調査は、室崎益輝さんが\n関西学院大学の研究紀要に書いたものから。"}, {"t": 2049.35, "x": "法律の改正の中身は、小林恭一さんの解説から。"}, {"t": 2053.0333333333333, "x": "最高裁の判決は、\n事件番号 昭和63年、あ、第1064号。"}, {"t": 2058.0666666666666, "x": "1991年11月14日 第一小法廷。"}, {"t": 2062.1, "x": "全部の対応は、リサーチのファイルに残してある。"}, {"t": 2064.95, "x": "この火事のあと、日本は古い建物に\n新しい決まりを当てはめることにした。"}, {"t": 2069.4333333333334, "x": "いま、私たちが入るデパートや\nホテルの天井にスプリンクラーがある。"}, {"t": 2073.45, "x": "あれは、建てたときから付いていたとは限らない。"}, {"t": 2076.3, "x": "……あとから付けたのもあるのね。"}, {"t": 2078.116666666667, "x": "ある。1974年から1977年にかけて、\n全国で付け替えが行われた。"}, {"t": 2084.1666666666665, "x": "全部、この火事と、\nその1年半前の千日デパートの火事の\nあとで決まったことだ。"}, {"t": 2089.35, "x": "……100人が亡くなったあとで。"}, {"t": 2091.1, "x": "あとでだ。そこは、ごまかさずに言っておく。"}, {"t": 2093.7166666666667, "x": "亡くなった100人の方のことを、もう一度書いておく。"}, {"t": 2096.883333333333, "x": "消防庁の内訳では、お客さんが51人、従業員が49人。"}, {"t": 2101.4, "x": "お客さんは、歳末の売り出しに\n買い物に来た方たちだ。"}, {"t": 2104.9333333333334, "x": "従業員は、その日そこで働いていた方たちだ。"}, {"t": 2108.0833333333335, "x": "中には、お客さんを外へ出そうとして、\n戻れなくなった方もいる。"}, {"t": 2112.266666666667, "x": "……普通の昼だったのよね、その人たちには。"}, {"t": 2115.15, "x": "普通の昼だった。"}, {"t": 2116.4, "x": "この火事の出火原因は、特定されていない。"}, {"t": 2119.1833333333334, "x": "だから私は、誰かが火をつけたという話はしない。"}, {"t": 2122.5333333333333, "x": "……決まらないまま、ここまで来たのね。"}, {"t": 2124.8, "x": "来た。決まらないことは、\n決まらないと言ったまま置いておく。"}, {"t": 2128.1666666666665, "x": "あなたがこの火事をどう受け止めたか、\nコメント欄で聞かせてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
