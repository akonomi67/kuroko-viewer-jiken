<script>
const D={"name": "110", "file": "110_編集用", "dur": 2060.71665625, "segs": [], "subs": [{"t": 0.0, "x": "1960年10月18日。"}, {"t": 2.4, "x": "衆議院の本会議場。"}, {"t": 3.966666666666667, "x": "総理大臣の池田勇人が演壇に立った。"}, {"t": 6.583333333333333, "x": "最初にこう言っている。"}, {"t": 7.9, "x": "この議場に一つの空席をはっきりと認める。"}, {"t": 10.816666666666666, "x": "空席？　誰の席なの？"}, {"t": 12.65, "x": "6日前までそこに座っていた人の席だ。"}, {"t": 15.3, "x": "社会党の委員長、浅沼稲次郎さん。"}, {"t": 17.833333333333332, "x": "野党第一党の党首だった。"}, {"t": 19.716666666666665, "x": "池田はその席を好敵手の席と呼んだ。"}, {"t": 22.283333333333335, "x": "本会議の壇上で、その人と政策を争うつもりだった。"}, {"t": 25.983333333333334, "x": "総選挙では、全国の街頭で論じ合うつもりだった。"}, {"t": 29.3, "x": "そう誓っていた相手の席だと言っている。"}, {"t": 31.8, "x": "与党の総理が野党の党首をそう呼んだのね。"}, {"t": 34.46666666666667, "x": "呼んだ。議事録にそのまま残っている。"}, {"t": 36.88333333333333, "x": "浅沼さんは10月12日に亡くなった。"}, {"t": 39.45, "x": "東京の日比谷公会堂で、演説をしている最中だった。"}, {"t": 42.93333333333333, "x": "壇上に駆け上がってきた17歳の少年に刺された。"}, {"t": 46.35, "x": "演説の途中で？"}, {"t": 47.666666666666664, "x": "途中でだ。会場には千人ほどの聴衆がいた。"}, {"t": 50.65, "x": "警察官も159人が出ていた。"}, {"t": 53.1, "x": "テレビのカメラも回っていた。"}, {"t": 54.95, "x": "それだけ人がいて止められなかったの？"}, {"t": 57.3, "x": "止められなかった。"}, {"t": 58.45, "x": "今回はその日の日比谷公会堂で\n何が起きていたかを追う。"}, {"t": 61.78333333333333, "x": "材料は、事件のすぐ後に開かれた国会の記録だ。"}, {"t": 65.21666666666667, "x": "警視総監や警察庁長官が、\n時刻を分刻みで答えている。"}, {"t": 69.25, "x": "少年は当時17歳で、事件の21日後に亡くなっている。"}, {"t": 73.25, "x": "だからこの動画では名前を呼ばない。"}, {"t": 75.41666666666667, "x": "21日後？　裁判はどうなったの？"}, {"t": 77.93333333333334, "x": "開かれていない。1度もだ。"}, {"t": 79.75, "x": "少年が法廷で何を語るはずだったのかは、\n今も分かっていない。"}, {"t": 83.6, "x": "まずは空席になった席の主から見ていこう。"}, {"t": 86.9, "x": "浅沼稲次郎さんは、1898年12月に生まれた。"}, {"t": 91.08333333333333, "x": "生まれたのは東京の三宅島だ。"}, {"t": 93.23333333333333, "x": "島の生まれなのね。"}, {"t": 94.61666666666666, "x": "そうだ。東京府立第三中学から早稲田大学に進んだ。"}, {"t": 98.4, "x": "大学を出たのは1923年。"}, {"t": 100.85, "x": "それから労働組合や農民組合の運動に入っていく。"}, {"t": 104.15, "x": "学生のころから社会主義の運動に加わっていた。"}, {"t": 107.16666666666667, "x": "警察に連れて行かれたことも、牢に\n入れられたこともあったと池田は語っている。"}, {"t": 111.83333333333333, "x": "総理がそこまで話したの？"}, {"t": 113.68333333333334, "x": "話した。経歴を隠さずに並べている。"}, {"t": 116.26666666666667, "x": "1925年の暮れには、農民労働党という\n党の書記長になった。"}, {"t": 120.75, "x": "国立国会図書館の解説によれば、この党は\nその日のうちに結社を禁じられている。"}, {"t": 126.01666666666667, "x": "作ったその日に禁止されたの？"}, {"t": 128.13333333333333, "x": "そうだ。政党を作ることそのものが、\nまだ自由ではない時代だった。"}, {"t": 132.23333333333332, "x": "そこから35年かけて、浅沼さんは\n野党第一党の党首になった。"}, {"t": 136.65, "x": "衆議院に初めて当選したのは1936年だ。"}, {"t": 140.26666666666668, "x": "東京4区から出ている。"}, {"t": 141.78333333333333, "x": "戦後は日本社会党をつくる側に回った。"}, {"t": 144.41666666666666, "x": "1947年、新しい憲法のもとで最初の国会が開かれる。"}, {"t": 148.96666666666667, "x": "このとき浅沼さんは\n初代の議院運営委員長に選ばれた。"}, {"t": 152.45, "x": "議院運営委員長って何をする役なの？"}, {"t": 154.93333333333334, "x": "国会の段取りを決める委員会のまとめ役だ。"}, {"t": 157.7, "x": "何をいつ話し合うか。"}, {"t": 158.96666666666667, "x": "どの順で採決するか。"}, {"t": 160.63333333333333, "x": "新しい国会の決まりごとを、\nここで一から作っていった。"}, {"t": 164.13333333333333, "x": "池田の追悼演説は、この時期の働きを\n与野党が褒めたと言っている。"}, {"t": 168.35, "x": "1948年には党の書記長になった。"}, {"t": 171.45, "x": "それから11年、書記長を続けている。"}, {"t": 174.05, "x": "委員長になったのは1960年の3月だ。"}, {"t": 177.35, "x": "亡くなるほんの7か月前じゃない。"}, {"t": 179.51666666666668, "x": "そうなる。委員長として迎えた\n最初の総選挙の前だった。"}, {"t": 183.15, "x": "当選は9回。衆議院にいた期間は20年9か月。"}, {"t": 186.68333333333334, "x": "池田は演説の中で短い歌を読み上げている。"}, {"t": 189.53333333333333, "x": "浅沼さんの友人が、大正の終わりに作った歌だそうだ。"}, {"t": 193.1, "x": "沼は演説百姓よ。よごれた服にボロカバン。"}, {"t": 196.0, "x": "きょうは本所の公会堂。"}, {"t": 197.35, "x": "あすは京都の辻の寺。"}, {"t": 199.11666666666667, "x": "演説百姓。演説を、畑仕事みたいに\n毎日続ける人ってこと？"}, {"t": 203.85, "x": "そういう意味だろう。"}, {"t": 204.93333333333334, "x": "演説こそ私の唯一の武器だ。"}, {"t": 206.95, "x": "浅沼さん本人の言葉として、そう引かれている。"}, {"t": 210.15, "x": "30年来、東京の下町のアパートで暮らしていた。"}, {"t": 213.51666666666668, "x": "犬を連れて近所を歩くのが\n楽しみだったとも語られている。"}, {"t": 217.01666666666668, "x": "党首なのにアパート暮らしだったのね。"}, {"t": 219.33333333333334, "x": "池田はそこを、国民が親しみを\n感じたところだと言っている。"}, {"t": 222.96666666666667, "x": "その人が演説の最中に倒れた。"}, {"t": 225.28333333333333, "x": "本人がいちばん大事にしていた場所でだ。"}, {"t": 228.33333333333334, "x": "この事件だけを見ると、突然の出来事に見える。"}, {"t": 231.31666666666666, "x": "ただ1960年という年は少し違った。"}, {"t": 234.55, "x": "何があった年なの？"}, {"t": 236.03333333333333, "x": "日米安全保障条約の改定を\nめぐって、国じゅうが揺れていた。"}, {"t": 239.93333333333334, "x": "条約に反対する運動が、全国で\n大きく盛り上がっていた。"}, {"t": 243.65, "x": "その年の6月。"}, {"t": 244.98333333333332, "x": "社会党の河上丈太郎さんが刃物で刺された。"}, {"t": 247.95, "x": "場所は衆議院の面会所だ。"}, {"t": 249.86666666666667, "x": "国会の中で？"}, {"t": 251.1, "x": "国会の中でだ。河上さんは命を取りとめている。"}, {"t": 254.35, "x": "翌月の7月には前の首相の岸信介さんが刺された。"}, {"t": 258.06666666666666, "x": "こちらは首相官邸の中だった。"}, {"t": 260.15, "x": "池田が自民党の総裁に選ばれた、そのお祝いの席だ。"}, {"t": 263.8, "x": "お祝いの席で？"}, {"t": 264.98333333333335, "x": "そうだ。岸さんも命は助かった。"}, {"t": 267.3333333333333, "x": "そして10月が浅沼さんだ。"}, {"t": 269.21666666666664, "x": "警察庁長官は国会で、これを3回目と数えている。"}, {"t": 272.75, "x": "右翼的な人物による刺傷事件の、3回目だと。"}, {"t": 276.25, "x": "4か月で3回も……。"}, {"t": 277.8333333333333, "x": "池田は国会で自分のことをこう答えている。"}, {"t": 280.43333333333334, "x": "岸さんと浅沼さんが難にあったとき、\nどちらも面前に居合わせた。"}, {"t": 284.56666666666666, "x": "両方とも目の前で見ていたの？"}, {"t": 286.5833333333333, "x": "見ていた。社会党の河上さんもそこを取り上げている。"}, {"t": 289.8333333333333, "x": "歴代の総理で、池田ほど目の前で\n血を見た人はいないだろう、と。"}, {"t": 293.78333333333336, "x": "警察も手を打っていなかったわけではない。"}, {"t": 296.1333333333333, "x": "6月と7月の事件のあと、右翼の動きを\n探る態勢を強めたと答えている。"}, {"t": 301.0833333333333, "x": "それでも3回目は起きた。"}, {"t": 302.73333333333335, "x": "その3回目の舞台が日比谷公会堂だった。"}, {"t": 306.1, "x": "10月12日に開かれたのは、三党首の立会演説会だ。"}, {"t": 310.23333333333335, "x": "立会演説会ってどういうものなの？"}, {"t": 312.45, "x": "何人かの候補や党首が、\n同じ壇上で順番に演説する会だ。"}, {"t": 316.55, "x": "聴く人はその場で並べて比べられる。"}, {"t": 318.8333333333333, "x": "この日の顔ぶれは、自民党、\n社会党、民主社会党の党首だ。"}, {"t": 323.06666666666666, "x": "自民党は総裁の池田勇人。"}, {"t": 325.1, "x": "社会党が浅沼稲次郎。"}, {"t": 326.8333333333333, "x": "民主社会党が委員長の西尾末広だ。"}, {"t": 329.4166666666667, "x": "主催は3つの団体だった。"}, {"t": 331.25, "x": "東京都選挙管理委員会。"}, {"t": 332.85, "x": "公明選挙連盟。そしてNHKだ。"}, {"t": 335.65, "x": "NHKが主催に入ってたのね。"}, {"t": 338.01666666666665, "x": "入っていた。会の様子はNHKが撮っていた。"}, {"t": 341.03333333333336, "x": "総選挙を目の前にした時期だ。"}, {"t": 343.03333333333336, "x": "衆議院の解散は事件の12日後になる。"}, {"t": 345.7, "x": "会が始まったのは午後2時過ぎ。"}, {"t": 347.6666666666667, "x": "聴衆はおよそ千人と国会で報告されている。"}, {"t": 350.6166666666667, "x": "最初に話したのは西尾委員長だった。"}, {"t": 353.01666666666665, "x": "開会のときから、客席のヤジが\nかなり激しかったという。"}, {"t": 356.75, "x": "最初から荒れてたのね。"}, {"t": 358.31666666666666, "x": "荒れていた。そうなりそうだということは、\n前から分かっていた。"}, {"t": 361.96666666666664, "x": "前から分かってたの？"}, {"t": 363.43333333333334, "x": "分かっていた。その話は、\n事件の1週間前までさかのぼる。"}, {"t": 368.01666666666665, "x": "10月5日。会の1週間前だ。"}, {"t": 370.4, "x": "主催の都選管と、丸の内警察署が\n打ち合わせをしている。"}, {"t": 374.1, "x": "このときのやりとりを、\n警視総監が国会で細かく話した。"}, {"t": 377.85, "x": "選管側の要望はまず一つ。"}, {"t": 379.8333333333333, "x": "警備は相当数お願いしたい。"}, {"t": 381.68333333333334, "x": "ただし会場の中に制服で入られては困る。"}, {"t": 384.6166666666667, "x": "制服の警察官は中に入れたくなかったのね。"}, {"t": 387.6666666666667, "x": "そうだ。警察もそれは当然だと受けている。"}, {"t": 390.3833333333333, "x": "中には私服の警察官を入れることになった。"}, {"t": 393.1666666666667, "x": "次に会場の整理をする人数の話になった。"}, {"t": 396.0833333333333, "x": "選管側は、階下に11人、階上に\n3人で当たりたいと言った。"}, {"t": 400.3833333333333, "x": "合わせて14人？"}, {"t": 401.6166666666667, "x": "14人だ。千人の会場でな。"}, {"t": 403.81666666666666, "x": "警察側は、最低でも\n60人ぐらいはほしいと返している。"}, {"t": 407.65, "x": "ずいぶん差があるのね。"}, {"t": 409.05, "x": "ほかにも申し合わせがあった。"}, {"t": 410.73333333333335, "x": "記者席は1階のいちばん前の列だ。"}, {"t": 413.0833333333333, "x": "そのうしろの通路に、整理の係を1人ずつ置く。"}, {"t": 416.15, "x": "そこから前へ、一般のお客を入れない。"}, {"t": 418.53333333333336, "x": "ヤジを止めるのはまず主催者がやる。"}, {"t": 420.6166666666667, "x": "主催者の手に負えないときに警察が出る。"}, {"t": 423.23333333333335, "x": "最初に止めるのは主催者なのね。"}, {"t": 425.43333333333334, "x": "そういう取り決めだった。"}, {"t": 426.85, "x": "当日の午前中にも、会場で署長と\n選管の事務局長が確かめ直している。"}, {"t": 431.75, "x": "当日に整理に当たった選管とNHKの係は59人。"}, {"t": 435.6, "x": "警察が言った60人に、ほぼ届く数にはなっていた。"}, {"t": 439.06666666666666, "x": "ここまではどこにでもある段取りの話だ。"}, {"t": 441.51666666666665, "x": "変わったのはその5日後だった。"}, {"t": 444.05, "x": "10月10日。"}, {"t": 445.06666666666666, "x": "大日本愛国党の総裁が都選管を訪ねてきた。"}, {"t": 448.46666666666664, "x": "大日本愛国党？"}, {"t": 450.0, "x": "当時あった右翼の政治団体だ。"}, {"t": 452.03333333333336, "x": "総裁は抗議をした。"}, {"t": 453.4166666666667, "x": "三党首だけの演説会を選管が開くのは\n選挙違反だ、という言い分だった。"}, {"t": 458.23333333333335, "x": "選挙違反？"}, {"t": 459.21666666666664, "x": "選挙の前の運動を、選管が\n自分でやっているという理屈だ。"}, {"t": 462.8666666666667, "x": "翌日の11日には警視庁にも来ている。"}, {"t": 465.6166666666667, "x": "取り締まってほしいと言ったうえで、もう一つ言った。"}, {"t": 468.5, "x": "会場に党員を集める、と。"}, {"t": 470.48333333333335, "x": "それを警察に言いに来たの？"}, {"t": 472.31666666666666, "x": "そうだ。だから警察は、当日は\n妨害が相当あると見込んだ。"}, {"t": 476.18333333333334, "x": "党員たちには前もって厳しく警告した。"}, {"t": 478.85, "x": "そして警備を増やした。"}, {"t": 480.3, "x": "ただし、ここで大事な一文がある。"}, {"t": 482.46666666666664, "x": "警視総監はこう付け加えている。"}, {"t": 484.48333333333335, "x": "直接の行動に出るという事前の情報はなかった。"}, {"t": 487.68333333333334, "x": "ヤジや妨害は予想してたけど、\n刃物は予想してなかったのね。"}, {"t": 491.56666666666666, "x": "そういうことになる。"}, {"t": 492.73333333333335, "x": "警察が身構えていたのは声とビラだった。"}, {"t": 495.4, "x": "じゃあその日の警察の配置はどうだったの？"}, {"t": 498.01666666666665, "x": "そこも数字が残っている。"}, {"t": 500.28333333333336, "x": "当日の正午ごろ、警備の本部が置かれた。"}, {"t": 502.95, "x": "場所は近くの内幸町の巡査派出所だ。"}, {"t": 505.8, "x": "出た警察官は制服が97人、私服が62人。"}, {"t": 509.6, "x": "合わせて159人だ。"}, {"t": 511.45, "x": "159人もいたの？"}, {"t": 513.1833333333333, "x": "いた。国家公安委員長は、この種の集会としては\n異例の厳しさだったと言っている。"}, {"t": 518.1333333333333, "x": "会場の中にいたのは私服の57人。"}, {"t": 520.7, "x": "外は、制服の部隊と機動隊の一部が受け持った。"}, {"t": 523.9833333333333, "x": "機動隊の一部は、公会堂の地下で待機していた。"}, {"t": 527.2666666666667, "x": "かなり用意してたのね。"}, {"t": 528.8166666666667, "x": "問題は中の57人をどこに置いたかだ。"}, {"t": 531.5, "x": "演壇に向かって左側に、\n愛国党の党員たちが固まっていた。"}, {"t": 535.6, "x": "私服の警察官は、そこを重点的に見張っていた。"}, {"t": 539.0833333333334, "x": "左側に集めてたのね。"}, {"t": 540.9333333333333, "x": "そうだ。もちろん、ほかの要所にも置いてはいる。"}, {"t": 543.9333333333333, "x": "それから浅沼さんのそばにも一人ついていた。"}, {"t": 546.6833333333333, "x": "参議院で国家公安委員長が答えている。"}, {"t": 549.2333333333333, "x": "浅沼委員長には、丸の内署の署員1名を\n身辺の警戒につけた、と。"}, {"t": 554.0, "x": "1人だけ？"}, {"t": 555.0166666666667, "x": "1人だ。党首の身辺を守るために、そばにいた人数だ。"}, {"t": 558.7166666666667, "x": "会場の騒がしさは、この時点では\nまだ始まったばかりだった。"}, {"t": 562.4333333333333, "x": "ここから時刻を順に追っていく。"}, {"t": 565.0, "x": "西尾委員長の演説が終わった。"}, {"t": 566.9666666666667, "x": "午後2時45分ごろ、浅沼さんの演説が始まった。"}, {"t": 570.55, "x": "ヤジは、西尾委員長のときよりさらに激しくなった。"}, {"t": 573.8833333333333, "x": "浅沼さんのときにもっと強くなったの？"}, {"t": 576.45, "x": "なった。警視総監は、一段と\n激しくなったと言っている。"}, {"t": 580.1166666666667, "x": "2時47分ごろ。"}, {"t": 581.6, "x": "2階の席からビラがまかれた。"}, {"t": 583.5333333333333, "x": "まいた2人はその場で捕まっている。"}, {"t": 585.6833333333333, "x": "2時52分ごろ。"}, {"t": 586.9833333333333, "x": "愛国党の党員の1人が壇上に駆け上がった。"}, {"t": 590.05, "x": "えっ、もう一人上がってたの？"}, {"t": 592.0, "x": "上がっていた。演壇に向かって右側からだ。"}, {"t": 594.7166666666667, "x": "その男は、浅沼さんの方に向かってビラをまいた。"}, {"t": 597.9, "x": "演壇の近くにいた私服の警察官3人が、\nすぐに捕まえている。"}, {"t": 602.25, "x": "その人は刃物は持ってなかったのね。"}, {"t": 604.65, "x": "ビラだけだ。ここでは止められている。"}, {"t": 606.8, "x": "そのあとも場内のヤジはおさまらない。"}, {"t": 608.9666666666667, "x": "署長は、左側の一団でいちばん\n激しくヤジっていた1人を捕まえた。"}, {"t": 613.4166666666666, "x": "それでも静かにならなかった。"}, {"t": 615.2333333333333, "x": "国会の説明では、演説の中身が\n聞き取れない状態になっていたという。"}, {"t": 619.75, "x": "それじゃ、演説会にならないわね。"}, {"t": 622.0666666666667, "x": "ならない。そして午後3時ごろを迎える。"}, {"t": 625.0666666666667, "x": "午後3時ごろ。"}, {"t": 626.1, "x": "主催者はついに、浅沼さんに演説を\n止めてもらうよう申し入れた。"}, {"t": 630.1333333333333, "x": "演説を止めたの？"}, {"t": 631.4833333333333, "x": "いったん止めた。"}, {"t": 632.5, "x": "そして場内に放送を流した。"}, {"t": 634.3666666666667, "x": "静かにしてほしい、と。"}, {"t": 635.9833333333333, "x": "司会はNHKのアナウンサーだった。"}, {"t": 638.2833333333333, "x": "残っている映像には、静粛にと\n繰り返す声が入っているという。"}, {"t": 642.2833333333333, "x": "浅沼さんはそのあいだ壇上で待ってたのね。"}, {"t": 645.0166666666667, "x": "待っていた。そして演説を再び始めた。"}, {"t": 647.7666666666667, "x": "ここまでで、会場ではすでに何人も捕まっている。"}, {"t": 650.85, "x": "ビラをまいた2人。壇上に上がった1人。ヤジの1人。"}, {"t": 654.2666666666667, "x": "警察の目は騒いでいる人たちに向いていた。"}, {"t": 656.9166666666666, "x": "これはあとで警視総監自身が認めていることだ。"}, {"t": 659.95, "x": "騒ぎの方にみんなの目が向いてたのね。"}, {"t": 662.4333333333333, "x": "そうだ。騒ぎがあれば、\nそこを見るのが警備の仕事でもある。"}, {"t": 665.9666666666667, "x": "のちの調べでは、少年が入口に来たのは\n午後2時50分ごろだった。"}, {"t": 670.3333333333334, "x": "直前に来たの？"}, {"t": 671.6333333333333, "x": "直前だ。入口で入場券が要ると言われ、\n整理の係からもらって中に入っている。"}, {"t": 676.7833333333333, "x": "誰でも入れる演説会だった。"}, {"t": 678.7666666666667, "x": "演説が再び始まって間もなくのことだった。"}, {"t": 682.2833333333333, "x": "午後3時5分ごろ。"}, {"t": 683.6, "x": "演壇に向かって右側から、\n1人の男が壇上に駆け上がった。"}, {"t": 687.7166666666667, "x": "また右側から？"}, {"t": 689.0, "x": "また右側からだ。13分前に、\nビラの男が上がったのと同じ側だ。"}, {"t": 693.4833333333333, "x": "男は隠し持っていた短刀のさやを払った。"}, {"t": 696.2333333333333, "x": "演壇の真ん中で演説をしていた\n浅沼さんに駆け寄った。"}, {"t": 699.6166666666667, "x": "そして体ごとぶつかるようにして、左の胸を刺した。"}, {"t": 702.9333333333333, "x": "……。"}, {"t": 703.8666666666667, "x": "国家公安委員長は、まことに\n一瞬の出来事だったと言っている。"}, {"t": 707.7, "x": "演壇のまわりにいた警察官は、すぐに飛び出した。"}, {"t": 710.8833333333333, "x": "だが間に合わなかった。"}, {"t": 712.2333333333333, "x": "警察官たちは折り重なって男を\n押さえ、刃物を取り上げた。"}, {"t": 715.9166666666666, "x": "このとき警察官3人が切り傷を負っている。"}, {"t": 718.7, "x": "壇上は、救護と逮捕と報道陣とで大混乱になった。"}, {"t": 722.25, "x": "浅沼さんは、丸の内署のパトロールカーで\n近くの日比谷病院へ運ばれた。"}, {"t": 726.6833333333333, "x": "国会での説明では、午後3時10分ごろに\n息を引き取ったとされている。"}, {"t": 731.15, "x": "刺されてから5分ほどで……。"}, {"t": 732.85, "x": "のちの解剖では、最初のひと\n突きが致命傷だったとされた。"}, {"t": 736.5166666666667, "x": "61歳だった。"}, {"t": 737.8333333333334, "x": "ここで一つだけ断っておく。"}, {"t": 739.7666666666667, "x": "この瞬間は写真にも映像にも残っている。"}, {"t": 742.4166666666666, "x": "この動画では、それを大きく出すことはしない。"}, {"t": 745.2, "x": "どうして？"}, {"t": 746.05, "x": "浅沼さんが最後に見せた姿を、\n見世物にしたくないからだ。"}, {"t": 749.8833333333333, "x": "写真が残った意味はあとの章で別に話す。"}, {"t": 753.2166666666667, "x": "159人もいて、どうして止められなかったの？"}, {"t": 756.3833333333333, "x": "警視総監の説明をそのまま見てみよう。"}, {"t": 758.8833333333333, "x": "演壇の周りの警察官は、\n騒然とした中で警戒していた。"}, {"t": 762.8166666666667, "x": "注意を向けていたのは、警戒を\n要する言動をする人たちだった。"}, {"t": 766.65, "x": "そのために、男が動き出したのを\n見つけるのが一瞬遅れた。"}, {"t": 770.5, "x": "騒いでる人を見てたから、黙って\n動いた人に気づけなかったのね。"}, {"t": 774.6333333333333, "x": "そういう説明だ。"}, {"t": 775.8333333333334, "x": "思い出してほしい。私服の警察官は\n左側に重く置かれていた。"}, {"t": 779.9, "x": "愛国党の党員たちが、左側に固まっていたからだ。"}, {"t": 783.4833333333333, "x": "男が上がってきたのは右側だった。"}, {"t": 785.8333333333334, "x": "手薄な側から来たってこと？"}, {"t": 787.7666666666667, "x": "結果としてはそうなる。"}, {"t": 789.1833333333333, "x": "ただ、狙って右側を選んだとまでは、\n国会の記録には書かれていない。"}, {"t": 793.4833333333333, "x": "ここは記録にあることだけを言っておく。"}, {"t": 795.6833333333333, "x": "国会では別の点も問われている。"}, {"t": 797.75, "x": "ビラの男が右側から上がったのは、13分前だった。"}, {"t": 801.2666666666667, "x": "同じ側からもう一度上がられた、ということになる。"}, {"t": 804.2333333333333, "x": "参議院では場所そのものも取り上げられた。"}, {"t": 806.6833333333333, "x": "男はテレビやラジオの機材がある陰から\n飛び上がった、と国家公安委員長が答えている。"}, {"t": 811.9, "x": "機材の陰に隠れてたの？"}, {"t": 813.7333333333333, "x": "そう説明されている。"}, {"t": 814.95, "x": "中継の機材が、見通しをさえぎる位置にあった。"}, {"t": 817.9, "x": "主催者が制服を入れたがらなかったこと。"}, {"t": 820.4, "x": "最初に止めるのは主催者という取り決め。"}, {"t": 822.8166666666667, "x": "党首のそばには1人。"}, {"t": 824.2666666666667, "x": "どれもその時点では普通の判断に見えた。"}, {"t": 826.8166666666667, "x": "重なった結果が3時5分だった。"}, {"t": 829.6666666666666, "x": "警察の中では、事件から36日後に処分が出ている。"}, {"t": 833.4833333333333, "x": "11月17日のことだ。"}, {"t": 835.4833333333333, "x": "警視庁は、幹部4人について\n国家公安委員会に処分を申し出た。"}, {"t": 839.6333333333333, "x": "そのうち、現場の丸の内警察署長が訓戒になった。"}, {"t": 843.2666666666667, "x": "訓戒って重いの？"}, {"t": 844.6166666666667, "x": "注意を言い渡す処分だ。"}, {"t": 846.0, "x": "国会では、軽すぎるという声が出た。"}, {"t": 848.45, "x": "処分の理由を、警視総監はこう説明している。"}, {"t": 851.4, "x": "警備には相当注意をしていた。そこは認める。"}, {"t": 854.2833333333333, "x": "ただもっと具体的に部下を\n指導し、配置するべきだった。"}, {"t": 857.7166666666667, "x": "ビラまきやヤジで人を捕まえる\nたびに、場内の警察官が動いた。"}, {"t": 861.8166666666667, "x": "動いて空いた場所をすぐ埋める\n手を、もう少し考えるべきだった。"}, {"t": 865.55, "x": "捕まえに行った人の持ち場が、\n空いたままになってたのね。"}, {"t": 869.05, "x": "そういう指摘だ。"}, {"t": 870.2, "x": "参議院ではもう2つの点が問われた。"}, {"t": 872.4833333333333, "x": "1つは公会堂の入口の見張りだ。"}, {"t": 874.8166666666667, "x": "入口は1か所で、はじめは警察官が見張っていた。"}, {"t": 878.1166666666667, "x": "それが午後2時半ごろに\n外されていたのではないか、という指摘だった。"}, {"t": 882.1666666666666, "x": "もう1つは、少年に気づけなかったのかという点だ。"}, {"t": 885.4333333333333, "x": "十数回捕まった少年なら、顔を\n知る警察官もいたのではないか。"}, {"t": 889.7333333333333, "x": "警察はなんて答えたの？"}, {"t": 891.5, "x": "どちらの点も、処分を決めるときの検討に\n入っていると答えた。"}, {"t": 895.45, "x": "それ以上の細かい答えは、記録には出てこない。"}, {"t": 898.9666666666667, "x": "ここで捕まった少年について話しておく。"}, {"t": 901.5833333333334, "x": "先に言っておくが、この人の考えを\n長く紹介することはしない。"}, {"t": 905.65, "x": "どうして？"}, {"t": 906.5, "x": "事件のあと、この行いをたたえる動きがあったからだ。"}, {"t": 909.6666666666666, "x": "警察庁長官が国会で、それをはっきり問題にしている。"}, {"t": 913.35, "x": "英雄のように扱う言動がかなり見られる、\n厳に注意を要する、と。"}, {"t": 917.35, "x": "だから国会で説明された事実だけを短く言う。"}, {"t": 920.45, "x": "少年は1943年2月の生まれ。17歳だった。"}, {"t": 924.4666666666667, "x": "大学で中国文学を学ぶ学生だった。"}, {"t": 927.3333333333334, "x": "大学生だったのね。"}, {"t": 928.9, "x": "前の年の5月、参議院選挙の演説を\n聞いて、愛国党に入った。"}, {"t": 933.3166666666667, "x": "党の宿舎で暮らすようになった。"}, {"t": 935.3166666666667, "x": "そのあいだに、公務執行妨害や\n傷害などの疑いで十数回捕まっている。"}, {"t": 940.0, "x": "十数回も？"}, {"t": 941.1166666666667, "x": "十数回だ。ただ、\nこの年の5月の終わりに党をやめている。"}, {"t": 944.7833333333333, "x": "党の中のもつれや、党のやり方に\n批判的になったことが理由とされた。"}, {"t": 949.1833333333333, "x": "そのあと、やめた仲間が7月に\n作った別の団体に加わった。"}, {"t": 953.2833333333333, "x": "ただそこの事務所にも、最近は\n出入りしていなかったという。"}, {"t": 956.8166666666667, "x": "じゃあどこにも属してない状態だったの？"}, {"t": 959.2666666666667, "x": "籍は残っていたが、離れていたということだ。"}, {"t": 962.0666666666667, "x": "ここが、あとで背後関係を調べるときの焦点になる。"}, {"t": 965.3833333333333, "x": "誰かに言われてやったのか。"}, {"t": 966.8666666666667, "x": "一人で決めたのか。"}, {"t": 968.2666666666667, "x": "本人は一人でやったと言い続けた。"}, {"t": 971.1333333333333, "x": "なぜ浅沼さんだったのか。"}, {"t": 972.8166666666667, "x": "国会ではこの問いも出た。"}, {"t": 974.4333333333333, "x": "答えたのは警視総監だ。"}, {"t": 976.1666666666666, "x": "少年の供述を読み上げる前に、\n総監はこう前置きしている。"}, {"t": 979.8333333333334, "x": "これは故人に対して、はなはだ\n失礼になるのでございますが。"}, {"t": 983.6333333333333, "x": "前置きをしたのね。"}, {"t": 984.9666666666667, "x": "した。中身は、\n浅沼さんの政治の姿勢への強い反発だった。"}, {"t": 989.0666666666667, "x": "浅沼さんが中国を訪れたときの発言も、\nそこに入っていた。"}, {"t": 993.1166666666667, "x": "ここではそれ以上は読み上げない。"}, {"t": 994.9166666666666, "x": "総監の前置きのとおり、亡くなった\n人への悪口になるからだ。"}, {"t": 998.8166666666667, "x": "うん、それでいいと思う。"}, {"t": 1000.35, "x": "もう一つ、供述で分かったことがある。"}, {"t": 1002.8166666666667, "x": "少年が狙っていたのは、浅沼さん1人ではなかった。"}, {"t": 1006.35, "x": "ほかにもいたの？"}, {"t": 1007.5333333333333, "x": "ほかの団体の指導者の名前も挙がっていた。"}, {"t": 1010.15, "x": "刑事局長の説明では、10月に\n入って自宅で短刀を見つけた。"}, {"t": 1014.3666666666667, "x": "そこで実行を決めた、とされている。"}, {"t": 1016.6166666666667, "x": "その日の新聞で三党首の演説会があると知った。"}, {"t": 1019.75, "x": "午後2時ごろ、中野の自宅を出た。"}, {"t": 1022.0166666666667, "x": "そしてさっきの入口から会場に入った。"}, {"t": 1024.7333333333333, "x": "その日に決めてその日に行ったの？"}, {"t": 1026.85, "x": "行き先を決めたのは、その日だったことになる。"}, {"t": 1029.6666666666667, "x": "警察が身構えていた抗議とは、\n別の筋から来たわけだ。"}, {"t": 1033.2666666666667, "x": "事前に情報がなかった、という説明はここにつながる。"}, {"t": 1036.6166666666666, "x": "ここで大事なのは言い分の中身ではない。"}, {"t": 1038.9333333333334, "x": "演説の途中で人を刺した、という事実のほうだ。"}, {"t": 1042.6833333333334, "x": "事件の知らせは、その日のうちに国じゅうに広がった。"}, {"t": 1045.9166666666667, "x": "会場にはテレビのカメラがあった。"}, {"t": 1047.8833333333334, "x": "警察庁長官は、テレビを通じて\n全国の人の目に映った、と言っている。"}, {"t": 1052.4833333333333, "x": "だからなまなましい実感で受け止められたのだと。"}, {"t": 1055.4166666666667, "x": "みんな、映像で見ちゃったのね。"}, {"t": 1057.4333333333334, "x": "見た人が多かった。"}, {"t": 1058.7833333333333, "x": "その日のうちに、抗議の集会やデモが組まれた。"}, {"t": 1061.6666666666667, "x": "東京をはじめ、10の都道府県だ。"}, {"t": 1063.9666666666667, "x": "加わった人はおよそ1万5千人と報告されている。"}, {"t": 1067.3833333333334, "x": "その日のうちに1万5千人。"}, {"t": 1069.4, "x": "一部では、警察の車を\n壊すなどの荒れた動きもあった。"}, {"t": 1072.9166666666667, "x": "ただ全体としては、比較的平静だったと\n警察庁長官は言っている。"}, {"t": 1077.3833333333334, "x": "海の外でも大きく報じられた。"}, {"t": 1079.3666666666666, "x": "13日付の各国の主な新聞は、これを1面で伝えた。"}, {"t": 1083.3166666666666, "x": "日本の民主主義の土台は\n弱いのではないか、と心配する論評も出た。"}, {"t": 1087.7, "x": "外国からもそう見られたのね。"}, {"t": 1089.7166666666667, "x": "そして国内には逆の声もあった。"}, {"t": 1091.9166666666667, "x": "さっき話した、少年をたたえる動きだ。"}, {"t": 1094.5, "x": "これには池田がはっきり答えている。"}, {"t": 1096.5833333333333, "x": "テロリストが愛国者であるというようなことは、\n毛頭考えていない。"}, {"t": 1100.4, "x": "そんな暴論は絶対に用いていない、と。"}, {"t": 1102.9833333333333, "x": "総理が国会でそう言ったのね。"}, {"t": 1105.0, "x": "言った。拍手が起きたと議事録にある。"}, {"t": 1107.4, "x": "では責任は誰がとったのか。次はそこだ。"}, {"t": 1110.8166666666666, "x": "事件のあと閣僚が1人辞めている。"}, {"t": 1113.0666666666666, "x": "自治大臣で国家公安委員長だった山崎巌だ。"}, {"t": 1116.3, "x": "警察の担当の大臣ね。"}, {"t": 1118.25, "x": "そうだ。池田はその辞任を認めた理由をこう答えた。"}, {"t": 1121.5, "x": "法律上の責任はない。"}, {"t": 1123.1333333333334, "x": "ただ、事の重さを政府が深く\n受け止めていると国民に知ってもらうためだ。"}, {"t": 1127.7, "x": "法律上は責任がないけど、辞めたってこと？"}, {"t": 1130.7166666666667, "x": "そういう整理だ。社会党はそれでは足りないと迫った。"}, {"t": 1133.9333333333334, "x": "内閣全体で責任をとるべきだ、と。"}, {"t": 1136.4833333333333, "x": "池田の答えはこうだ。"}, {"t": 1137.8666666666666, "x": "テロ事件で内閣が代わるのは、\n民主主義のルールに反する。"}, {"t": 1141.6, "x": "うーん。どっちの言い分も分かる気がする。"}, {"t": 1143.95, "x": "この動画では、どちらが正しいかは決めない。"}, {"t": 1146.5666666666666, "x": "両方の言葉を記録どおりに並べておく。"}, {"t": 1149.0166666666667, "x": "新しく国家公安委員長になった\n周東英雄は、別の点も強く言った。"}, {"t": 1153.55, "x": "政府には警察を指揮監督する力がない。"}, {"t": 1156.45, "x": "え、ないの？"}, {"t": 1157.45, "x": "ない。警察が政治から\n独立するように、そう作られている。"}, {"t": 1161.1333333333334, "x": "具体的な警備は、都道府県の警察と\n公安委員会が受け持つ。"}, {"t": 1165.15, "x": "だから警察官の責任を政府が\n問うのは筋が違う、という答えだ。"}, {"t": 1169.35, "x": "一方で警察は再発を防ぐための手を4つ挙げた。"}, {"t": 1172.5833333333333, "x": "危ない人物の見張りを強める。"}, {"t": 1174.4166666666667, "x": "狙われそうな人に護衛をつける。"}, {"t": 1176.4666666666667, "x": "集会の主催者と前もってよく話し合う。"}, {"t": 1179.0333333333333, "x": "そして刃物を持ち歩かせない運動を、\n学校とも組んで全国で行う。"}, {"t": 1183.35, "x": "最後のは少年だったからね。"}, {"t": 1185.3166666666666, "x": "そうだ。17歳が持ってきた刃物だった。"}, {"t": 1188.7333333333333, "x": "10月24日の連合審査会では、\n法務大臣も発言している。"}, {"t": 1192.95, "x": "小島徹三法務大臣だ。"}, {"t": 1194.7666666666667, "x": "最初に語ったのは、浅沼さんの思い出だった。"}, {"t": 1197.75, "x": "政治の立場は違ったが、親しみ\n深い人柄と温かい顔を思い出す。"}, {"t": 1202.2166666666667, "x": "だからこそこの事件には、限りない\n憎しみと悲しみを感じる、と。"}, {"t": 1206.4333333333334, "x": "大臣も個人として悲しんでたのね。"}, {"t": 1208.9, "x": "そうだ。そのうえで大臣は、暴力は\n左右を問わず民主主義の敵だと言った。"}, {"t": 1213.6, "x": "左右を問わず？"}, {"t": 1214.7, "x": "右からの暴力も左からの暴力も、\nどちらも許さないという意味だ。"}, {"t": 1218.8666666666666, "x": "そしてもう一つ付け加えている。"}, {"t": 1220.85, "x": "こういう事件が起きるたびに、\n取り締まりの法律を強めろという声が出る。"}, {"t": 1224.9333333333334, "x": "だが法律の上に法律を作るより、今ある\n法律を守らせることに重きを置きたい。"}, {"t": 1229.8666666666666, "x": "新しい法律は作らないってこと？"}, {"t": 1232.1833333333334, "x": "むやみに作らない、という言い方だ。"}, {"t": 1234.3166666666666, "x": "ただし法律を無視して暴力で主張を通す\n者には、今ある手段で断固として当たる。"}, {"t": 1239.3333333333333, "x": "事件の直後は、強い手を求める\n声がいちばん大きくなるときだ。"}, {"t": 1243.2166666666667, "x": "その時に法務大臣がこう\n言ったことも、記録に残っている。"}, {"t": 1247.0166666666667, "x": "怒ってるときほど、落ち着いて決めるってことね。"}, {"t": 1249.9666666666667, "x": "そういうことだろう。"}, {"t": 1251.0833333333333, "x": "警察庁長官の報告には、\n海外の受け止め方の違いも出てくる。"}, {"t": 1255.35, "x": "共産圏の新聞は、これを池田内閣と\nアメリカの責任だと書いた。"}, {"t": 1259.6166666666666, "x": "自由圏の新聞は、民主主義の土台への心配に\n加えてもう一つ書いた。"}, {"t": 1264.1, "x": "極右への反発から、左の側が暴力に\n傾くのではないかという心配だ。"}, {"t": 1268.9333333333334, "x": "どっちの側からも、暴力が増えるのが心配されたのね。"}, {"t": 1272.4666666666667, "x": "そうだ。だから大臣の左右を\n問わずという言葉には、重みがあった。"}, {"t": 1277.0833333333333, "x": "ここで最初の場面に戻る。"}, {"t": 1278.85, "x": "10月18日。事件から6日後の衆議院だ。"}, {"t": 1282.0166666666667, "x": "議長がまず報告した。"}, {"t": 1283.5666666666666, "x": "議員の浅沼稲次郎君は日比谷公会堂で\n災難にあい、急に亡くなりました、と。"}, {"t": 1288.5166666666667, "x": "院として、弔いの言葉を贈ることが決まった。"}, {"t": 1291.4666666666667, "x": "議長が読み上げた弔いの言葉には、こうある。"}, {"t": 1294.2666666666667, "x": "初代の議院運営委員長として\n新しい国会の運営に努めた。"}, {"t": 1298.0666666666666, "x": "民主政治の発達に力を尽くし、\nその功績はまことに偉大である。"}, {"t": 1302.4333333333334, "x": "最初の国会のときの仕事を、ちゃんと覚えてたのね。"}, {"t": 1305.7333333333333, "x": "13年前の仕事だ。議場の誰もが知っていた。"}, {"t": 1308.9, "x": "そのあと池田が壇上に立った。"}, {"t": 1310.9666666666667, "x": "最初に話してた演説ね。"}, {"t": 1312.9166666666667, "x": "そうだ。空席の話のあと、池田はこう続けている。"}, {"t": 1316.3, "x": "かつてここから発せられる一つの声を、私は聞いた。"}, {"t": 1319.7, "x": "今その人はなく、その声もやみました。"}, {"t": 1322.3166666666666, "x": "私は、誰に向かって論争をいどめばよいのでしょうか。"}, {"t": 1325.6166666666666, "x": "……論争の相手がいなくなったってことなのね。"}, {"t": 1328.2833333333333, "x": "そうだ。そして、その席から聞こえる声があるという。"}, {"t": 1331.5333333333333, "x": "わが身に起こったことを、\n他の人に起こさせてはならない。"}, {"t": 1334.8166666666666, "x": "暴力は、民主政治家にとって共通の敵である。"}, {"t": 1338.0666666666666, "x": "浅沼さんが言いそうなことを、\n池田さんが代わりに言ったのね。"}, {"t": 1341.6666666666667, "x": "そういう形をとっている。"}, {"t": 1343.2166666666667, "x": "池田はさらに、目的のために手段を\n選ばない風潮を絶対に許さないと誓った。"}, {"t": 1348.1833333333334, "x": "それが、浅沼さんのみたまに\nささげる唯一の玉ぐしだ、と。"}, {"t": 1352.1, "x": "玉ぐしって、神さまにお供えする木の枝よね。"}, {"t": 1355.1833333333334, "x": "そうだ。言葉を、お供えの代わりにするという意味だ。"}, {"t": 1358.3, "x": "池田はこの国会の意味にも触れている。"}, {"t": 1360.55, "x": "各党がそれぞれの政策を出し合い、\n国民に判断してもらうつもりだった。"}, {"t": 1364.9833333333333, "x": "浅沼さんもその決意だったはずだ。"}, {"t": 1367.2, "x": "暴力による死はその機会を永久に奪った。"}, {"t": 1369.9833333333333, "x": "選挙で比べてもらう機会、ってことね。"}, {"t": 1372.5, "x": "そうだ。1人の命と一緒に、比べてもらう場も消えた。"}, {"t": 1376.0, "x": "この演説は、議事録を開けば今でも全文が読める。"}, {"t": 1379.3333333333333, "x": "拍手の箇所まで全部記録されている。"}, {"t": 1381.6333333333334, "x": "党の違う2人のあいだにあった\n距離を、この演説は隠していない。"}, {"t": 1385.45, "x": "政策では争う。ただ、言葉で争う。"}, {"t": 1388.1166666666666, "x": "池田が言ったのはその一点だった。"}, {"t": 1390.85, "x": "3日後の10月21日。"}, {"t": 1392.7833333333333, "x": "衆議院で、各党の代表が総理に質問をする日だった。"}, {"t": 1396.3666666666666, "x": "社会党の代表として立ったのは、河上丈太郎さんだ。"}, {"t": 1400.0166666666667, "x": "6月に刺された人？"}, {"t": 1401.7, "x": "その人だ。河上さんは最初にこう言った。"}, {"t": 1404.4333333333334, "x": "本来ならば、きょうは浅沼君が社会党を代表して、\nこの壇上から質問をいたすはずでありました。"}, {"t": 1410.5166666666667, "x": "……本当なら、浅沼さんが立つ日だったのね。"}, {"t": 1413.4, "x": "そうだ。河上さんは浅沼さんを、運動に\n入って以来の友人と呼んでいる。"}, {"t": 1417.8833333333334, "x": "そして浅沼さんについてこう言った。"}, {"t": 1420.05, "x": "身に寸鉄を帯びず、ただ三寸の舌を\nもって信念を訴えてきた。"}, {"t": 1424.15, "x": "すんてつ？"}, {"t": 1425.0166666666667, "x": "小さな刃物のことだ。"}, {"t": 1426.3666666666666, "x": "刃物ひとつ持たず、言葉だけで\n訴えてきたという意味だ。"}, {"t": 1429.8833333333334, "x": "河上さんは、政府の責任を強く追及している。"}, {"t": 1433.1666666666667, "x": "右翼の資金がどこから出ているのか、\n調べるべきだとも迫った。"}, {"t": 1436.9833333333333, "x": "池田は、テロへの考えは河上君と全く同じだと答えた。"}, {"t": 1440.8666666666666, "x": "そして総理の責任は、こういう事件が\n起きない世の中を作ることだと言った。"}, {"t": 1445.3666666666666, "x": "河上さんの質問は最後に自分の話になる。"}, {"t": 1448.4166666666667, "x": "私は本年6月、衆議院の面会所に\nおいて暴漢に刺されました。"}, {"t": 1452.9, "x": "自分のことをそこで話したのね。"}, {"t": 1455.0666666666666, "x": "話した。そしてこう締めくくった。"}, {"t": 1457.2666666666667, "x": "テロ、暗殺に関する追悼演説のごときは、\n今後再び繰り返されないことを願う。"}, {"t": 1462.6333333333334, "x": "刺された人が、刺された\n仲間のために言った言葉なのね。"}, {"t": 1466.2833333333333, "x": "そうだ。この願いがどうなったかは、最後の章で話す。"}, {"t": 1470.3166666666666, "x": "この事件には、世界で知られた1枚の写真がある。"}, {"t": 1473.45, "x": "撮ったのは、毎日新聞のカメラマンの長尾靖さんだ。"}, {"t": 1476.9666666666667, "x": "写真は通信社のUPIを通じて、世界中に配られた。"}, {"t": 1480.75, "x": "有名な写真なの？"}, {"t": 1482.2, "x": "有名だ。翌1961年、\nアメリカのピュリツァー賞を受けている。"}, {"t": 1486.6, "x": "1961年の世界報道写真コンテストでも、\n大賞に選ばれた。"}, {"t": 1491.4166666666667, "x": "賞をもらった写真なのね。"}, {"t": 1493.1666666666667, "x": "ただ国会では逆の声も出ていた。"}, {"t": 1495.3, "x": "事件の10日後の参議院本会議だ。"}, {"t": 1497.6166666666666, "x": "社会党の議員がこう言っている。"}, {"t": 1499.4666666666667, "x": "あの身の毛もよだつ場面が写真に\n撮られ、テレビで流されるのは、"}, {"t": 1503.0166666666667, "x": "今の世の中であってはならないことだ、と。"}, {"t": 1505.7, "x": "撮られたこと自体が、おかしいって言ってるの？"}, {"t": 1508.45, "x": "そうだ。そんな場面が人前で起きてしまったこと。"}, {"t": 1511.5333333333333, "x": "それを全国の人が見ることになったこと。"}, {"t": 1514.1, "x": "その両方への怒りだ。"}, {"t": 1515.6666666666667, "x": "記録として大事だっていう考えもあるわよね。"}, {"t": 1518.4833333333333, "x": "ある。何が起きたかを、言葉より確かに伝えるからだ。"}, {"t": 1521.9, "x": "一方で、写っているのは亡くなる直前の1人の人だ。"}, {"t": 1525.5, "x": "残すことと見せ方は分けて考えるってこと？"}, {"t": 1528.4166666666667, "x": "私はそう考えている。"}, {"t": 1529.9666666666667, "x": "この動画では、写真を出すときは\n小さく、引用の枠の中で出す。"}, {"t": 1534.1166666666666, "x": "出典をつけて話している場面でだけ使う。"}, {"t": 1536.8, "x": "残った記録に、見せ物の役をさせないためだ。"}, {"t": 1540.4, "x": "国会がいちばん長く\n問い続けたのは、背後関係だった。"}, {"t": 1544.0833333333333, "x": "誰かが後ろで指図してたか、ってこと？"}, {"t": 1546.7, "x": "そうだ。17歳が一人で決めたのか。"}, {"t": 1549.2833333333333, "x": "誰かが金を出したり、指図したりしていなかったか。"}, {"t": 1552.5, "x": "捜査はかなりの規模で行われた。"}, {"t": 1554.5666666666666, "x": "事件の夜11時ごろから\n翌日の午前1時ごろにかけて、6か所を捜索した。"}, {"t": 1559.6166666666666, "x": "自宅や、少年が加わっていた団体の事務所などだ。"}, {"t": 1562.95, "x": "メモやノートなど、26種類90点を押収している。"}, {"t": 1566.55, "x": "その日の夜のうちに？"}, {"t": 1568.0666666666666, "x": "その日の夜のうちにだ。"}, {"t": 1569.5833333333333, "x": "翌日には合同の特別捜査本部が置かれた。"}, {"t": 1572.5666666666666, "x": "14日には、事件が東京地検に送られている。"}, {"t": 1575.6333333333334, "x": "地検は公安部の検事10人全員と、\n事務官14人で班を組んだ。"}, {"t": 1579.85, "x": "あとから4か所を追加で調べ、\nさらに文書107件を押さえた。"}, {"t": 1583.75, "x": "参考人も十数人、任意で呼んで話を聞いている。"}, {"t": 1586.95, "x": "調べる中で関係する別の事件も\n数件見つかり、それぞれ処理された。"}, {"t": 1591.45, "x": "別の事件って、浅沼さんの事件の仲間ってこと？"}, {"t": 1594.9166666666667, "x": "そうではない。今回の事件の共犯とは、\n別に扱われている。"}, {"t": 1598.8833333333334, "x": "かなり調べたのね。"}, {"t": 1600.3, "x": "調べた。国会では、資金の出どころも質問された。"}, {"t": 1603.7666666666667, "x": "団体が事務所を借りるお金を、\n誰かが出しているのではないかという問いだ。"}, {"t": 1607.9333333333334, "x": "国家公安委員長は、調べた\n結果そういう事実はないと答えている。"}, {"t": 1612.0166666666667, "x": "部屋は無償で貸されていた、という説明だった。"}, {"t": 1614.9833333333333, "x": "じゃあお金の線は出なかったの？"}, {"t": 1616.95, "x": "政府の答えでは出なかった。"}, {"t": 1618.6666666666667, "x": "ここで一つ断っておく。"}, {"t": 1620.35, "x": "国会では、何人かの実名が質問の中に出てくる。"}, {"t": 1623.85, "x": "ただその人たちが事件に\n関わったという結論は出ていない。"}, {"t": 1627.35, "x": "だからこの動画では名前を出さない。"}, {"t": 1629.4166666666667, "x": "質問として出ただけの名前は、答えではないからだ。"}, {"t": 1633.2666666666667, "x": "事件から21日目の11月2日。"}, {"t": 1636.0, "x": "検察は少年の事件を家庭裁判所に送った。"}, {"t": 1639.0333333333333, "x": "意見をつけてだ。大人と\n同じ刑事裁判にかけるのが相当だ、と。"}, {"t": 1643.3166666666666, "x": "少年だからまず家庭裁判所に行くのね。"}, {"t": 1645.9666666666667, "x": "そういう決まりだ。そこから、もう\n一度検察に戻して起訴する考えだった。"}, {"t": 1650.6333333333334, "x": "家庭裁判所は、その日のうちに\n東京少年鑑別所に入れる決定をした。"}, {"t": 1655.2833333333333, "x": "鑑別所ってどういうところ？"}, {"t": 1657.1, "x": "少年の心や体の様子を調べて、\n処分を決める材料を作るところだ。"}, {"t": 1661.6333333333334, "x": "少年が鑑別所に着いたのは、午後2時10分。"}, {"t": 1664.6166666666666, "x": "所長は前もって幹部を集め、扱いを話し合っていた。"}, {"t": 1668.0333333333333, "x": "世間の注目を集めた事件だったからだ。"}, {"t": 1670.6666666666667, "x": "面接をして決まりを説明した。"}, {"t": 1672.75, "x": "午後3時半ごろ、寮の部屋に入れた。"}, {"t": 1675.1166666666666, "x": "職員は5分から15分おきに、\n廊下の窓から様子を見ていた。"}, {"t": 1679.0, "x": "持ってきた弁当も、所の食事も、\nほとんど食べたという。"}, {"t": 1682.7666666666667, "x": "落ち着いてたのね。"}, {"t": 1684.05, "x": "落ち着いて見えた、と報告されている。"}, {"t": 1686.3333333333333, "x": "午後7時55分まで、変わったところは\n何も見られなかった。"}, {"t": 1690.0666666666666, "x": "そこで30分のあいだ見回りが離れた。"}, {"t": 1692.7333333333333, "x": "30分……。"}, {"t": 1693.7, "x": "午後8時15分ごろ。"}, {"t": 1695.2333333333333, "x": "少年が部屋の中で自ら命を絶っているのが見つかった。"}, {"t": 1698.85, "x": "……鑑別所に入った、その日の夜に。"}, {"t": 1701.35, "x": "その日の夜にだ。"}, {"t": 1702.55, "x": "ここではそれ以上のことは話さない。"}, {"t": 1704.6666666666667, "x": "法務省の矯正局長は国会で、\nまことに残念だと述べている。"}, {"t": 1708.65, "x": "捜査に障害を与えたという点で、\nきわめて遺憾だとも言った。"}, {"t": 1712.9333333333334, "x": "12月1日、参議院の法務委員会。"}, {"t": 1715.6166666666666, "x": "法務省の刑事局長が、捜査の結果を報告した。"}, {"t": 1719.0, "x": "起訴して地裁で裁くつもりだったが、\nそれができなくなった。"}, {"t": 1722.6166666666666, "x": "事件はこのまま終わらざるを得なくなった、と。"}, {"t": 1725.3666666666666, "x": "終わっちゃったの？"}, {"t": 1726.4666666666667, "x": "刑事事件としてはそこで終わった。"}, {"t": 1728.55, "x": "犯人が亡くなれば、起訴はできない。"}, {"t": 1730.7833333333333, "x": "だからこの事件には判決が1つもない。"}, {"t": 1733.5, "x": "裁判で確かめられたことは、何もないってこと？"}, {"t": 1736.6666666666667, "x": "そうなる。裁判そのものが一度も開かれていない。"}, {"t": 1739.7, "x": "残っているのは、検察と警察の調べの結果だけだ。"}, {"t": 1743.1833333333334, "x": "その結果を刑事局長はこうまとめた。"}, {"t": 1745.6, "x": "少年は、自分の単独の犯行だと主張している。"}, {"t": 1748.85, "x": "外から調べていく捜査も行った。"}, {"t": 1751.1666666666667, "x": "それでも刑法でいう共犯関係を認めるに\n足る証拠は見つからなかった。"}, {"t": 1755.4666666666667, "x": "一人でやった、ということね。"}, {"t": 1757.45, "x": "刑法の上では、そうなる。ただ、続きがある。"}, {"t": 1760.3833333333334, "x": "思想的な影響を与えたという\n点は、認めざるを得ない、と。"}, {"t": 1764.1, "x": "考え方の影響はあった、ってこと？"}, {"t": 1766.5, "x": "そうだ。影響はあった。共犯ではない。"}, {"t": 1768.9666666666667, "x": "法律で言えるのはここまで、という線を引いている。"}, {"t": 1771.8166666666666, "x": "12月の国会でも、この点は何度も問われた。"}, {"t": 1774.8666666666666, "x": "鑑別所での30分はなぜ空いたのか。"}, {"t": 1777.35, "x": "背後は本当に調べ尽くしたのか。"}, {"t": 1779.5333333333333, "x": "裁判が開かれていれば、\n少年は法廷で何を語ったのか。"}, {"t": 1783.3833333333334, "x": "それはもう誰にも分からないのね。"}, {"t": 1785.4333333333334, "x": "分からない。そこだけは、\n答えが出ないまま残っている。"}, {"t": 1788.7, "x": "この動画が、ここから先を推し量ることはしない。"}, {"t": 1791.65, "x": "記録に書かれた線で止めておく。"}, {"t": 1794.2833333333333, "x": "同じ日の委員会には、\n東京少年鑑別所の所長も呼ばれていた。"}, {"t": 1798.35, "x": "議員たちは厳しく問うた。"}, {"t": 1800.0, "x": "形だけの見回りになっていたのではないか、と。"}, {"t": 1803.0333333333333, "x": "所長はなんて答えたの？"}, {"t": 1804.7, "x": "まず、鑑別所という役所の性格を話した。"}, {"t": 1807.6333333333334, "x": "少年の心をしずめ、落ち着かせてから診断する。"}, {"t": 1810.85, "x": "それが本来のやり方だ、と。"}, {"t": 1812.9166666666667, "x": "ずっと見張るところじゃない、ってことね。"}, {"t": 1815.2333333333333, "x": "そうだ。そのうえでこう言っている。"}, {"t": 1817.1666666666667, "x": "あの30分の間も、誰か一人つけておけばよかった。"}, {"t": 1820.6666666666667, "x": "これはあとから考えることでございます、と。"}, {"t": 1823.3833333333334, "x": "あとから考えたこと……。"}, {"t": 1824.9333333333334, "x": "例外の扱いは考えていた。だが、\n考えが至らなかったとも認めた。"}, {"t": 1829.4, "x": "別の議員は、職員が\n足りなかったのではないかとも聞いた。"}, {"t": 1832.8833333333334, "x": "所長は人手を理由にはしなかった。"}, {"t": 1835.0333333333333, "x": "やるべきだと考えれば、\n今の職員でもできないわけではなかったと答えている。"}, {"t": 1839.7333333333333, "x": "言い訳にしなかったのね。"}, {"t": 1841.4, "x": "しなかった。その答えも、議事録に残っている。"}, {"t": 1844.5, "x": "別の議員は、少年法の見直しにも触れている。"}, {"t": 1847.4833333333333, "x": "少年事件の扱い方そのものを、\n考え直すべきだという声だ。"}, {"t": 1851.5, "x": "事件の10日余りあとの連合審査会でも、\n少年鑑別のあり方は問われていた。"}, {"t": 1856.5, "x": "前から言われてたことなのね。"}, {"t": 1858.3833333333334, "x": "言われていた。"}, {"t": 1859.25, "x": "この事件では穴が2回あいている。"}, {"t": 1861.25, "x": "会場で右側があいた。"}, {"t": 1862.7666666666667, "x": "鑑別所で30分があいた。"}, {"t": 1864.7833333333333, "x": "どっちも、その時は普通の判断に見えたのね。"}, {"t": 1867.9, "x": "そうだ。どちらも、あとから見ると穴だった。"}, {"t": 1870.6333333333334, "x": "事件を振り返ると、悪意より先に\n見えてくるのは、こういう隙間だ。"}, {"t": 1875.3166666666666, "x": "10月24日。"}, {"t": 1876.6333333333334, "x": "この日の午前、衆議院では\n連合審査会が開かれていた。"}, {"t": 1880.1666666666667, "x": "警視総監や警察庁長官が、\n事件の時刻を分刻みで報告した。"}, {"t": 1884.6833333333334, "x": "この動画で使った数字の多くは、\nこの日の記録から来ている。"}, {"t": 1888.4666666666667, "x": "159人とか、2時52分とかね。"}, {"t": 1891.4333333333334, "x": "そうだ。そして同じ日の本会議で、\n衆議院は解散された。"}, {"t": 1895.3833333333334, "x": "事件から12日後に解散？"}, {"t": 1897.4333333333334, "x": "12日後だ。11月20日に総選挙が行われた。"}, {"t": 1901.05, "x": "浅沼さんが全国の街頭で演説するはずだった選挙だ。"}, {"t": 1904.6, "x": "池田が、その人と論じ合うと誓った選挙でもある。"}, {"t": 1907.9666666666667, "x": "相手がいないまま、選挙になったのね。"}, {"t": 1910.4666666666667, "x": "そういうことになる。"}, {"t": 1911.65, "x": "12月の国会では、\n選挙そのものの報告も行われている。"}, {"t": 1915.55, "x": "自治省の選挙局長はこう報告した。"}, {"t": 1918.0833333333333, "x": "浅沼事件を受けて、立会演説会の秩序を\n守ることに特に気をつけた。"}, {"t": 1922.7333333333333, "x": "どの会場でも事故は1つもなかった、と。"}, {"t": 1925.4833333333333, "x": "立会演説会はそのまま続けたのね。"}, {"t": 1928.1, "x": "続けた。言葉で争う場はなくさなかった。"}, {"t": 1930.8833333333334, "x": "守り方の方を固めて、選挙を通したということだ。"}, {"t": 1934.2666666666667, "x": "池田の演説も、河上さんの演説も、\n同じことを言っていた。"}, {"t": 1938.2166666666667, "x": "演説の場を、暴力に明け渡さないということだ。"}, {"t": 1941.1833333333334, "x": "ここで今回の話のもとになった記録を挙げておく。"}, {"t": 1944.2833333333333, "x": "当日の時刻と警備の数字は、\n1960年10月24日の衆議院の連合審査会。"}, {"t": 1950.1833333333334, "x": "地方行政委員会と法務委員会が合同で開いたものだ。"}, {"t": 1953.5666666666666, "x": "警備の配置と機材の陰の話は、\n10月22日の参議院本会議。"}, {"t": 1958.1833333333334, "x": "池田の追悼演説は、10月18日の衆議院本会議。"}, {"t": 1962.05, "x": "河上さんの質問と池田の答弁は、\n10月21日の衆議院本会議。"}, {"t": 1966.85, "x": "鑑別所と捜査の結果は、\n12月1日の参議院法務委員会だ。"}, {"t": 1971.3333333333333, "x": "全部、国会の記録なのね。"}, {"t": 1973.4333333333334, "x": "そうだ。国会会議録検索システムで、誰でも読める。"}, {"t": 1977.0333333333333, "x": "写真の賞は、ピュリツァー賞と\n世界報道写真財団の記録。"}, {"t": 1980.75, "x": "浅沼さんの経歴は、\n国立国会図書館の近代日本人の肖像も見た。"}, {"t": 1985.5166666666667, "x": "ここに無いことは話していない。"}, {"t": 1988.0, "x": "最後に河上さんの願いの話をしておく。"}, {"t": 1990.6833333333334, "x": "テロや暗殺の追悼演説が、\n二度と繰り返されないように。"}, {"t": 1994.3666666666666, "x": "その願いはかなったの？"}, {"t": 1995.95, "x": "かなわなかった。"}, {"t": 1997.0333333333333, "x": "2022年10月25日。"}, {"t": 1999.1, "x": "衆議院の本会議場。"}, {"t": 2000.6666666666667, "x": "安倍晋三元総理への追悼演説が行われた。"}, {"t": 2003.65, "x": "その年の7月、選挙の応援演説の最中に\n銃で撃たれて亡くなっている。"}, {"t": 2008.4166666666667, "x": "また、演説の最中に……。"}, {"t": 2010.3, "x": "演説の最中にだ。"}, {"t": 2011.7166666666667, "x": "追悼演説に立ったのは、党の違う\n野田佳彦元総理だった。"}, {"t": 2015.7, "x": "62年前と同じく、立場の違う人が壇上に立った。"}, {"t": 2019.6333333333334, "x": "池田さんと浅沼さんのときと、同じ形なのね。"}, {"t": 2022.9666666666667, "x": "形は同じになった。"}, {"t": 2024.4333333333334, "x": "この件の中身にはここでは立ち入らない。"}, {"t": 2026.7833333333333, "x": "言っておきたいのは一つだけだ。"}, {"t": 2028.6333333333334, "x": "河上さんの願いは、今もまだ\n願いのままだということだ。"}, {"t": 2032.0, "x": "……。"}, {"t": 2032.9333333333334, "x": "浅沼さんの友人が作った歌を、もう一度だけ読む。"}, {"t": 2036.2, "x": "きょうは本所の公会堂。"}, {"t": 2037.55, "x": "あすは京都の辻の寺。"}, {"t": 2039.3166666666666, "x": "きょうの次は、あす。"}, {"t": 2040.7833333333333, "x": "演説百姓には、いつも次の日の演説があった。"}, {"t": 2043.9666666666667, "x": "1960年10月12日の演説は、途中で止まった。"}, {"t": 2048.05, "x": "その次の日の演説はない。"}, {"t": 2049.8, "x": "止まった続きを刃物で決めさせない。"}, {"t": 2052.016666666667, "x": "池田が議場で誓ったのはそれだけだった。"}, {"t": 2054.633333333333, "x": "一つの空席、ね。"}, {"t": 2056.2833333333333, "x": "そうだ。あの席は、言葉で争う人のための席だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
