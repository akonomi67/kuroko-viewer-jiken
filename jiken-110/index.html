<script>
const D={"name": "110", "file": "110_編集用", "dur": 2057.7833125, "segs": [], "subs": [{"t": 0.0, "x": "1960年10月18日。"}, {"t": 2.4, "x": "衆議院の本会議場。"}, {"t": 3.966666666666667, "x": "総理大臣の池田勇人が演壇に立った。"}, {"t": 6.583333333333333, "x": "最初にこう言っている。"}, {"t": 7.9, "x": "この議場に一つの空席をはっきりと認める。"}, {"t": 10.816666666666666, "x": "空席？　誰の席なの？"}, {"t": 12.65, "x": "6日前までそこに座っていた人の席だ。"}, {"t": 15.3, "x": "社会党の委員長、浅沼稲次郎さん。"}, {"t": 17.833333333333332, "x": "野党第一党の党首だった。"}, {"t": 19.716666666666665, "x": "池田はその席を好敵手の席と呼んだ。"}, {"t": 22.283333333333335, "x": "本会議の壇上で、その人と政策を争うつもりだった。"}, {"t": 25.983333333333334, "x": "総選挙では、全国の街頭で論じ合うつもりだった。"}, {"t": 29.3, "x": "そう誓っていた相手の席だと言っている。"}, {"t": 31.8, "x": "与党の総理が野党の党首をそう呼んだのね。"}, {"t": 34.46666666666667, "x": "呼んだ。議事録にそのまま残っている。"}, {"t": 36.88333333333333, "x": "浅沼さんは10月12日に亡くなった。"}, {"t": 39.45, "x": "東京の日比谷公会堂で、演説をしている最中だった。"}, {"t": 42.93333333333333, "x": "壇上に駆け上がってきた17歳の少年に刺された。"}, {"t": 46.35, "x": "演説の途中で？"}, {"t": 47.666666666666664, "x": "途中でだ。会場には千人ほどの聴衆がいた。"}, {"t": 50.65, "x": "警察官も159人が出ていた。"}, {"t": 53.1, "x": "テレビのカメラも回っていた。"}, {"t": 54.95, "x": "それだけ人がいて止められなかったの？"}, {"t": 57.3, "x": "止められなかった。"}, {"t": 58.45, "x": "今回はその日の日比谷公会堂で\n何が起きていたかを追う。"}, {"t": 61.78333333333333, "x": "材料は、事件のすぐ後に開かれた国会の記録だ。"}, {"t": 65.21666666666667, "x": "警視総監や警察庁長官が、\n時刻を分刻みで答えている。"}, {"t": 69.25, "x": "少年は当時17歳で、事件の21日後に亡くなっている。"}, {"t": 73.25, "x": "だからこの動画では名前を呼ばない。"}, {"t": 75.41666666666667, "x": "21日後？　裁判はどうなったの？"}, {"t": 77.93333333333334, "x": "開かれていない。1度もだ。"}, {"t": 79.75, "x": "そこも順番に話していく。"}, {"t": 81.55, "x": "まずは空席になった席の主から見ていこう。"}, {"t": 84.9, "x": "浅沼稲次郎さんは、1898年12月に生まれた。"}, {"t": 89.08333333333333, "x": "生まれたのは東京の三宅島だ。"}, {"t": 91.23333333333333, "x": "島の生まれなのね。"}, {"t": 92.61666666666666, "x": "そうだ。東京府立第三中学から早稲田大学に進んだ。"}, {"t": 96.4, "x": "大学を出たのは1923年。"}, {"t": 98.85, "x": "それから労働組合や農民組合の運動に入っていく。"}, {"t": 102.15, "x": "学生のころから社会主義の運動に加わっていた。"}, {"t": 105.16666666666667, "x": "警察に連れて行かれたことも、牢に\n入れられたこともあったと池田は語っている。"}, {"t": 109.83333333333333, "x": "総理がそこまで話したの？"}, {"t": 111.68333333333334, "x": "話した。経歴を隠さずに並べている。"}, {"t": 114.26666666666667, "x": "1925年の暮れには、農民労働党という\n党の書記長になった。"}, {"t": 118.75, "x": "国立国会図書館の解説によれば、この党は\nその日のうちに結社を禁じられている。"}, {"t": 124.01666666666667, "x": "作ったその日に禁止されたの？"}, {"t": 126.13333333333334, "x": "そうだ。政党を作ることそのものが、\nまだ自由ではない時代だった。"}, {"t": 130.23333333333332, "x": "そこから35年かけて、浅沼さんは\n野党第一党の党首になった。"}, {"t": 134.65, "x": "衆議院に初めて当選したのは1936年だ。"}, {"t": 138.26666666666668, "x": "東京4区から出ている。"}, {"t": 139.78333333333333, "x": "戦後は日本社会党をつくる側に回った。"}, {"t": 142.41666666666666, "x": "1947年、新しい憲法のもとで最初の国会が開かれる。"}, {"t": 146.96666666666667, "x": "このとき浅沼さんは\n初代の議院運営委員長に選ばれた。"}, {"t": 150.45, "x": "議院運営委員長って何をする役なの？"}, {"t": 152.93333333333334, "x": "国会の段取りを決める委員会のまとめ役だ。"}, {"t": 155.7, "x": "何をいつ話し合うか。"}, {"t": 156.96666666666667, "x": "どの順で採決するか。"}, {"t": 158.63333333333333, "x": "新しい国会の決まりごとを、\nここで一から作っていった。"}, {"t": 162.13333333333333, "x": "池田の追悼演説は、この時期の働きを\n与野党が褒めたと言っている。"}, {"t": 166.35, "x": "1948年には党の書記長になった。"}, {"t": 169.45, "x": "それから11年、書記長を続けている。"}, {"t": 172.05, "x": "委員長になったのは1960年の3月だ。"}, {"t": 175.35, "x": "亡くなるほんの7か月前じゃない。"}, {"t": 177.51666666666668, "x": "そうなる。委員長として迎えた\n最初の総選挙の前だった。"}, {"t": 181.15, "x": "当選は9回。衆議院にいた期間は20年9か月。"}, {"t": 184.68333333333334, "x": "池田は演説の中で短い歌を読み上げている。"}, {"t": 187.53333333333333, "x": "浅沼さんの友人が、大正の終わりに作った歌だそうだ。"}, {"t": 191.1, "x": "沼は演説百姓よ。よごれた服にボロカバン。"}, {"t": 194.0, "x": "きょうは本所の公会堂。"}, {"t": 195.35, "x": "あすは京都の辻の寺。"}, {"t": 197.11666666666667, "x": "演説百姓。演説を、畑仕事みたいに\n毎日続ける人ってこと？"}, {"t": 201.85, "x": "そういう意味だろう。"}, {"t": 202.91666666666666, "x": "演説こそ私の唯一の武器だ。"}, {"t": 204.95, "x": "浅沼さん本人の言葉として、そう引かれている。"}, {"t": 208.15, "x": "30年来、東京の下町のアパートで暮らしていた。"}, {"t": 211.5, "x": "犬を連れて近所を歩くのが\n楽しみだったとも語られている。"}, {"t": 215.01666666666668, "x": "党首なのにアパート暮らしだったのね。"}, {"t": 217.33333333333334, "x": "池田はそこを、国民が親しみを\n感じたところだと言っている。"}, {"t": 220.96666666666667, "x": "その人が演説の最中に倒れた。"}, {"t": 223.28333333333333, "x": "本人がいちばん大事にしていた場所でだ。"}, {"t": 226.33333333333334, "x": "この事件だけを見ると、突然の出来事に見える。"}, {"t": 229.31666666666666, "x": "ただ1960年という年は少し違った。"}, {"t": 232.55, "x": "何があった年なの？"}, {"t": 234.03333333333333, "x": "日米安全保障条約の改定を\nめぐって、国じゅうが揺れていた。"}, {"t": 237.93333333333334, "x": "条約に反対する運動が、全国で\n大きく盛り上がっていた。"}, {"t": 241.65, "x": "その年の6月。"}, {"t": 242.96666666666667, "x": "社会党の河上丈太郎さんが刃物で刺された。"}, {"t": 245.93333333333334, "x": "場所は衆議院の面会所だ。"}, {"t": 247.86666666666667, "x": "国会の中で？"}, {"t": 249.1, "x": "国会の中でだ。河上さんは命を取りとめている。"}, {"t": 252.35, "x": "翌月の7月には前の首相の岸信介さんが刺された。"}, {"t": 256.06666666666666, "x": "こちらは首相官邸の中だった。"}, {"t": 258.15, "x": "池田が自民党の総裁に選ばれた、そのお祝いの席だ。"}, {"t": 261.8, "x": "お祝いの席で？"}, {"t": 262.98333333333335, "x": "そうだ。岸さんも命は助かった。"}, {"t": 265.3333333333333, "x": "そして10月が浅沼さんだ。"}, {"t": 267.21666666666664, "x": "警察庁長官は国会で、これを3回目と数えている。"}, {"t": 270.75, "x": "右翼的な人物による刺傷事件の、3回目だと。"}, {"t": 274.25, "x": "4か月で3回も……。"}, {"t": 275.8333333333333, "x": "池田は国会で自分のことをこう答えている。"}, {"t": 278.43333333333334, "x": "岸さんと浅沼さんが難にあったとき、\nどちらも面前に居合わせた。"}, {"t": 282.56666666666666, "x": "両方とも目の前で見ていたの？"}, {"t": 284.56666666666666, "x": "見ていた。社会党の河上さんもそこを取り上げている。"}, {"t": 287.8333333333333, "x": "歴代の総理で、池田ほど目の前で\n血を見た人はいないだろう、と。"}, {"t": 291.78333333333336, "x": "警察も手を打っていなかったわけではない。"}, {"t": 294.1333333333333, "x": "6月と7月の事件のあと、右翼の動きを\n探る態勢を強めたと答えている。"}, {"t": 299.0833333333333, "x": "それでも3回目は起きた。"}, {"t": 300.73333333333335, "x": "その3回目の舞台が日比谷公会堂だった。"}, {"t": 304.1, "x": "10月12日に開かれたのは、三党首の立会演説会だ。"}, {"t": 308.23333333333335, "x": "立会演説会ってどういうものなの？"}, {"t": 310.5833333333333, "x": "何人かの候補や党首が、\n同じ壇上で順番に演説する会だ。"}, {"t": 314.6666666666667, "x": "聴く人はその場で並べて比べられる。"}, {"t": 316.95, "x": "この日の顔ぶれは、自民党、\n社会党、民主社会党の党首だ。"}, {"t": 321.2, "x": "自民党は総裁の池田勇人。"}, {"t": 323.21666666666664, "x": "社会党が浅沼稲次郎。"}, {"t": 324.95, "x": "民主社会党が委員長の西尾末広だ。"}, {"t": 327.53333333333336, "x": "主催は3つの団体だった。"}, {"t": 329.3666666666667, "x": "東京都選挙管理委員会。"}, {"t": 330.96666666666664, "x": "公明選挙連盟。そしてNHKだ。"}, {"t": 333.76666666666665, "x": "NHKが主催に入ってたのね。"}, {"t": 336.1333333333333, "x": "入っていた。会の様子はNHKが撮っていた。"}, {"t": 339.15, "x": "総選挙を目の前にした時期だ。"}, {"t": 341.15, "x": "衆議院の解散は事件の12日後になる。"}, {"t": 343.81666666666666, "x": "会が始まったのは午後2時過ぎ。"}, {"t": 345.78333333333336, "x": "聴衆はおよそ千人と国会で報告されている。"}, {"t": 348.73333333333335, "x": "最初に話したのは西尾委員長だった。"}, {"t": 351.1333333333333, "x": "開会のときから、客席のヤジが\nかなり激しかったという。"}, {"t": 354.8666666666667, "x": "最初から荒れてたのね。"}, {"t": 356.43333333333334, "x": "荒れていた。そうなりそうだということは、\n前から分かっていた。"}, {"t": 360.0833333333333, "x": "前から分かってたの？"}, {"t": 361.55, "x": "分かっていた。その話は、\n事件の1週間前までさかのぼる。"}, {"t": 366.1333333333333, "x": "10月5日。会の1週間前だ。"}, {"t": 368.53333333333336, "x": "主催の都選管と、丸の内警察署が\n打ち合わせをしている。"}, {"t": 372.21666666666664, "x": "このときのやりとりを、\n警視総監が国会で細かく話した。"}, {"t": 375.96666666666664, "x": "選管側の要望はまず一つ。"}, {"t": 377.95, "x": "警備は相当数お願いしたい。"}, {"t": 379.8, "x": "ただし会場の中に制服で入られては困る。"}, {"t": 382.73333333333335, "x": "制服の警察官は中に入れたくなかったのね。"}, {"t": 385.78333333333336, "x": "そうだ。警察もそれは当然だと受けている。"}, {"t": 388.5, "x": "中には私服の警察官を入れることになった。"}, {"t": 391.28333333333336, "x": "次に会場の整理をする人数の話になった。"}, {"t": 394.2, "x": "選管側は、階下に11人、階上に\n3人で当たりたいと言った。"}, {"t": 398.5, "x": "合わせて14人？"}, {"t": 399.73333333333335, "x": "14人だ。千人の会場でな。"}, {"t": 401.93333333333334, "x": "警察側は、最低でも\n60人ぐらいはほしいと返している。"}, {"t": 405.76666666666665, "x": "ずいぶん差があるのね。"}, {"t": 407.1666666666667, "x": "ほかにも申し合わせがあった。"}, {"t": 408.85, "x": "記者席は1階のいちばん前の列だ。"}, {"t": 411.2, "x": "そのうしろの通路に、整理の係を1人ずつ置く。"}, {"t": 414.26666666666665, "x": "そこから前へ、一般のお客を入れない。"}, {"t": 416.65, "x": "ヤジを止めるのはまず主催者がやる。"}, {"t": 418.73333333333335, "x": "主催者の手に負えないときに警察が出る。"}, {"t": 421.35, "x": "最初に止めるのは主催者なのね。"}, {"t": 423.55, "x": "そういう取り決めだった。"}, {"t": 424.96666666666664, "x": "当日の午前中にも、会場で署長と\n選管の事務局長が確かめ直している。"}, {"t": 429.8666666666667, "x": "当日に整理に当たった選管とNHKの係は59人。"}, {"t": 433.73333333333335, "x": "警察が言った60人に、ほぼ届く数にはなっていた。"}, {"t": 437.18333333333334, "x": "ここまではどこにでもある段取りの話だ。"}, {"t": 439.6333333333333, "x": "変わったのはその5日後だった。"}, {"t": 442.1666666666667, "x": "10月10日。"}, {"t": 443.18333333333334, "x": "大日本愛国党の総裁が都選管を訪ねてきた。"}, {"t": 446.6, "x": "大日本愛国党？"}, {"t": 448.1166666666667, "x": "当時あった右翼の政治団体だ。"}, {"t": 450.15, "x": "総裁は抗議をした。"}, {"t": 451.53333333333336, "x": "三党首だけの演説会を選管が開くのは\n選挙違反だ、という言い分だった。"}, {"t": 456.35, "x": "選挙違反？"}, {"t": 457.3333333333333, "x": "選挙の前の運動を、選管が\n自分でやっているという理屈だ。"}, {"t": 461.0, "x": "翌日の11日には警視庁にも来ている。"}, {"t": 463.75, "x": "取り締まってほしいと言ったうえで、もう一つ言った。"}, {"t": 466.6333333333333, "x": "会場に党員を集める、と。"}, {"t": 468.6, "x": "それを警察に言いに来たの？"}, {"t": 470.43333333333334, "x": "そうだ。だから警察は、当日は\n妨害が相当あると見込んだ。"}, {"t": 474.3, "x": "党員たちには前もって厳しく警告した。"}, {"t": 476.96666666666664, "x": "そして警備を増やした。"}, {"t": 478.43333333333334, "x": "ただし、ここで大事な一文がある。"}, {"t": 480.5833333333333, "x": "警視総監はこう付け加えている。"}, {"t": 482.6166666666667, "x": "直接の行動に出るという事前の情報はなかった。"}, {"t": 485.8, "x": "ヤジや妨害は予想してたけど、\n刃物は予想してなかったのね。"}, {"t": 489.68333333333334, "x": "そういうことになる。"}, {"t": 490.85, "x": "警察が身構えていたのは声とビラだった。"}, {"t": 493.53333333333336, "x": "じゃあその日の警察の配置はどうだったの？"}, {"t": 496.1333333333333, "x": "そこも数字が残っている。"}, {"t": 498.4, "x": "当日の正午ごろ、警備の本部が置かれた。"}, {"t": 501.06666666666666, "x": "場所は近くの内幸町の巡査派出所だ。"}, {"t": 503.9166666666667, "x": "出た警察官は制服が97人、私服が62人。"}, {"t": 507.71666666666664, "x": "合わせて159人だ。"}, {"t": 509.56666666666666, "x": "159人もいたの？"}, {"t": 511.3, "x": "いた。国家公安委員長は、この種の集会としては\n異例の厳しさだったと言っている。"}, {"t": 516.25, "x": "会場の中にいたのは私服の57人。"}, {"t": 518.8166666666667, "x": "外は、制服の部隊と機動隊の一部が受け持った。"}, {"t": 522.1, "x": "機動隊の一部は、公会堂の地下で待機していた。"}, {"t": 525.3833333333333, "x": "かなり用意してたのね。"}, {"t": 526.9333333333333, "x": "問題は中の57人をどこに置いたかだ。"}, {"t": 529.6166666666667, "x": "演壇に向かって左側に、\n愛国党の党員たちが固まっていた。"}, {"t": 533.7166666666667, "x": "私服の警察官は、そこを重点的に見張っていた。"}, {"t": 537.2166666666667, "x": "左側に集めてたのね。"}, {"t": 539.05, "x": "そうだ。もちろん、ほかの要所にも置いてはいる。"}, {"t": 541.8, "x": "それから浅沼さんのそばにも一人ついていた。"}, {"t": 544.5666666666667, "x": "参議院で国家公安委員長が答えている。"}, {"t": 547.1166666666667, "x": "浅沼委員長には、丸の内署の署員1名を\n身辺の警戒につけた、と。"}, {"t": 551.8666666666667, "x": "1人だけ？"}, {"t": 552.9, "x": "1人だ。党首の身辺を守るために、そばにいた人数だ。"}, {"t": 556.5833333333334, "x": "会場の騒がしさは、この時点では\nまだ始まったばかりだった。"}, {"t": 560.3166666666667, "x": "ここから時刻を順に追っていく。"}, {"t": 562.8833333333333, "x": "西尾委員長の演説が終わった。"}, {"t": 564.85, "x": "午後2時45分ごろ、浅沼さんの演説が始まった。"}, {"t": 568.3333333333334, "x": "ヤジは、西尾委員長のときよりさらに激しくなった。"}, {"t": 571.65, "x": "浅沼さんのときにもっと強くなったの？"}, {"t": 574.2333333333333, "x": "なった。警視総監は、一段と\n激しくなったと言っている。"}, {"t": 577.8833333333333, "x": "2時47分ごろ。"}, {"t": 579.3833333333333, "x": "2階の席からビラがまかれた。"}, {"t": 581.3, "x": "まいた2人はその場で捕まっている。"}, {"t": 583.45, "x": "2時52分ごろ。"}, {"t": 584.75, "x": "愛国党の党員の1人が壇上に駆け上がった。"}, {"t": 587.8333333333334, "x": "えっ、もう一人上がってたの？"}, {"t": 589.7666666666667, "x": "上がっていた。演壇に向かって右側からだ。"}, {"t": 592.5, "x": "その男は、浅沼さんの方に向かってビラをまいた。"}, {"t": 595.6666666666666, "x": "演壇の近くにいた私服の警察官3人が、\nすぐに捕まえている。"}, {"t": 600.0166666666667, "x": "その人は刃物は持ってなかったのね。"}, {"t": 602.4166666666666, "x": "ビラだけだ。ここでは止められている。"}, {"t": 604.5666666666667, "x": "そのあとも場内のヤジはおさまらない。"}, {"t": 606.7333333333333, "x": "署長は、左側の一団でいちばん\n激しくヤジっていた1人を捕まえた。"}, {"t": 611.1833333333333, "x": "それでも静かにならなかった。"}, {"t": 613.0166666666667, "x": "国会の説明では、演説の中身が\n聞き取れない状態になっていたという。"}, {"t": 617.5333333333333, "x": "それじゃ、演説会にならないわね。"}, {"t": 619.85, "x": "ならない。そして午後3時ごろを迎える。"}, {"t": 622.85, "x": "午後3時ごろ。"}, {"t": 623.8833333333333, "x": "主催者はついに、浅沼さんに演説を\n止めてもらうよう申し入れた。"}, {"t": 627.9, "x": "演説を止めたの？"}, {"t": 629.25, "x": "いったん止めた。"}, {"t": 630.2833333333333, "x": "そして場内に放送を流した。"}, {"t": 632.15, "x": "静かにしてほしい、と。"}, {"t": 633.75, "x": "司会はNHKのアナウンサーだった。"}, {"t": 636.05, "x": "残っている映像には、静粛にと\n繰り返す声が入っているという。"}, {"t": 640.0666666666667, "x": "浅沼さんはそのあいだ壇上で待ってたのね。"}, {"t": 642.8, "x": "待っていた。そして演説を再び始めた。"}, {"t": 645.5333333333333, "x": "ここまでで、会場ではすでに何人も捕まっている。"}, {"t": 648.6166666666667, "x": "ビラをまいた2人。壇上に上がった1人。ヤジの1人。"}, {"t": 652.05, "x": "警察の目は騒いでいる人たちに向いていた。"}, {"t": 654.6833333333333, "x": "これはあとで警視総監自身が認めていることだ。"}, {"t": 657.7333333333333, "x": "騒ぎの方にみんなの目が向いてたのね。"}, {"t": 660.2166666666667, "x": "そうだ。騒ぎがあれば、\nそこを見るのが警備の仕事でもある。"}, {"t": 663.75, "x": "のちの調べでは、少年が入口に来たのは\n午後2時50分ごろだった。"}, {"t": 668.1, "x": "直前に来たの？"}, {"t": 669.4, "x": "直前だ。入口で入場券が要ると言われ、\n整理の係からもらって中に入っている。"}, {"t": 674.55, "x": "誰でも入れる演説会だった。"}, {"t": 676.55, "x": "演説が再び始まって間もなくのことだった。"}, {"t": 680.05, "x": "午後3時5分ごろ。"}, {"t": 681.3833333333333, "x": "演壇に向かって右側から、\n1人の男が壇上に駆け上がった。"}, {"t": 685.5, "x": "また右側から？"}, {"t": 686.7833333333333, "x": "また右側からだ。13分前に、\nビラの男が上がったのと同じ側だ。"}, {"t": 691.25, "x": "男は隠し持っていた短刀のさやを払った。"}, {"t": 694.0, "x": "演壇の真ん中で演説をしていた\n浅沼さんに駆け寄った。"}, {"t": 697.4, "x": "そして体ごとぶつかるようにして、左の胸を刺した。"}, {"t": 700.7, "x": "……。"}, {"t": 701.6333333333333, "x": "国家公安委員長は、まことに\n一瞬の出来事だったと言っている。"}, {"t": 705.4666666666667, "x": "演壇のまわりにいた警察官は、すぐに飛び出した。"}, {"t": 708.65, "x": "だが間に合わなかった。"}, {"t": 710.0, "x": "警察官たちは折り重なって男を\n押さえ、刃物を取り上げた。"}, {"t": 713.6833333333333, "x": "このとき警察官3人が切り傷を負っている。"}, {"t": 716.4833333333333, "x": "壇上は、救護と逮捕と報道陣とで大混乱になった。"}, {"t": 720.0333333333333, "x": "浅沼さんは、丸の内署のパトロールカーで\n近くの日比谷病院へ運ばれた。"}, {"t": 724.4666666666667, "x": "国会での説明では、午後3時10分ごろに\n息を引き取ったとされている。"}, {"t": 728.9333333333333, "x": "刺されてから5分ほどで……。"}, {"t": 730.6333333333333, "x": "のちの解剖では、最初のひと\n突きが致命傷だったとされた。"}, {"t": 734.2833333333333, "x": "61歳だった。"}, {"t": 735.6166666666667, "x": "ここで一つだけ断っておく。"}, {"t": 737.55, "x": "この瞬間は写真にも映像にも残っている。"}, {"t": 740.2, "x": "この動画では、それを大きく出すことはしない。"}, {"t": 742.9666666666667, "x": "どうして？"}, {"t": 743.8166666666667, "x": "浅沼さんが最後に見せた姿を、\n見世物にしたくないからだ。"}, {"t": 747.6666666666666, "x": "写真が残った意味はあとの章で別に話す。"}, {"t": 751.0, "x": "159人もいて、どうして止められなかったの？"}, {"t": 754.1666666666666, "x": "警視総監の説明をそのまま見てみよう。"}, {"t": 756.6666666666666, "x": "演壇の周りの警察官は、\n騒然とした中で警戒していた。"}, {"t": 760.5833333333334, "x": "注意を向けていたのは、警戒を\n要する言動をする人たちだった。"}, {"t": 764.4166666666666, "x": "そのために、男が動き出したのを\n見つけるのが一瞬遅れた。"}, {"t": 768.2833333333333, "x": "騒いでる人を見てたから、黙って\n動いた人に気づけなかったのね。"}, {"t": 772.4166666666666, "x": "そういう説明だ。"}, {"t": 773.6166666666667, "x": "思い出してほしい。私服の警察官は\n左側に重く置かれていた。"}, {"t": 777.6833333333333, "x": "愛国党の党員たちが、左側に固まっていたからだ。"}, {"t": 781.25, "x": "男が上がってきたのは右側だった。"}, {"t": 783.6166666666667, "x": "手薄な側から来たってこと？"}, {"t": 785.5333333333333, "x": "結果としてはそうなる。"}, {"t": 786.9666666666667, "x": "ただ、狙って右側を選んだとまでは、\n国会の記録には書かれていない。"}, {"t": 791.2666666666667, "x": "ここは記録にあることだけを言っておく。"}, {"t": 793.4666666666667, "x": "国会では別の点も問われている。"}, {"t": 795.5166666666667, "x": "ビラの男が右側から上がったのは、13分前だった。"}, {"t": 799.05, "x": "同じ側からもう一度上がられた、ということになる。"}, {"t": 802.0166666666667, "x": "参議院では場所そのものも取り上げられた。"}, {"t": 804.45, "x": "男はテレビやラジオの機材がある陰から\n飛び上がった、と国家公安委員長が答えている。"}, {"t": 809.6833333333333, "x": "機材の陰に隠れてたの？"}, {"t": 811.5166666666667, "x": "そう説明されている。"}, {"t": 812.7333333333333, "x": "中継の機材が、見通しをさえぎる位置にあった。"}, {"t": 815.6833333333333, "x": "主催者が制服を入れたがらなかったこと。"}, {"t": 818.1833333333333, "x": "最初に止めるのは主催者という取り決め。"}, {"t": 820.6, "x": "党首のそばには1人。"}, {"t": 822.05, "x": "どれもその時点では普通の判断に見えた。"}, {"t": 824.6, "x": "重なった結果が3時5分だった。"}, {"t": 827.45, "x": "警察の中では、事件から36日後に処分が出ている。"}, {"t": 831.2666666666667, "x": "11月17日のことだ。"}, {"t": 833.2666666666667, "x": "警視庁は、幹部4人について\n国家公安委員会に処分を申し出た。"}, {"t": 837.4, "x": "そのうち、現場の丸の内警察署長が訓戒になった。"}, {"t": 841.05, "x": "訓戒って重いの？"}, {"t": 842.4, "x": "注意を言い渡す処分だ。"}, {"t": 843.7833333333333, "x": "国会では、軽すぎるという声が出た。"}, {"t": 846.2333333333333, "x": "処分の理由を、警視総監はこう説明している。"}, {"t": 849.1833333333333, "x": "警備には相当注意をしていた。そこは認める。"}, {"t": 852.0666666666667, "x": "ただもっと具体的に部下を\n指導し、配置するべきだった。"}, {"t": 855.5, "x": "ビラまきやヤジで人を捕まえる\nたびに、場内の警察官が動いた。"}, {"t": 859.6, "x": "動いて空いた場所をすぐ埋める\n手を、もう少し考えるべきだった。"}, {"t": 863.3333333333334, "x": "捕まえに行った人の持ち場が、\n空いたままになってたのね。"}, {"t": 866.8333333333334, "x": "そういう指摘だ。"}, {"t": 867.9666666666667, "x": "参議院ではもう2つの点が問われた。"}, {"t": 870.2666666666667, "x": "1つは公会堂の入口の見張りだ。"}, {"t": 872.6, "x": "入口は1か所で、はじめは警察官が見張っていた。"}, {"t": 875.9, "x": "それが午後2時半ごろに\n外されていたのではないか、という指摘だった。"}, {"t": 879.95, "x": "もう1つは、少年に気づけなかったのかという点だ。"}, {"t": 883.2166666666667, "x": "十数回捕まった少年なら、顔を\n知る警察官もいたのではないか。"}, {"t": 887.5166666666667, "x": "警察はなんて答えたの？"}, {"t": 889.2833333333333, "x": "どちらの点も、処分を決めるときの検討に\n入っていると答えた。"}, {"t": 893.2166666666667, "x": "それ以上の細かい答えは、記録には出てこない。"}, {"t": 896.7333333333333, "x": "ここで捕まった少年について話しておく。"}, {"t": 899.3666666666667, "x": "先に言っておくが、この人の考えを\n長く紹介することはしない。"}, {"t": 903.4333333333333, "x": "どうして？"}, {"t": 904.2833333333333, "x": "事件のあと、この行いをたたえる動きがあったからだ。"}, {"t": 907.4333333333333, "x": "警察庁長官が国会で、それをはっきり問題にしている。"}, {"t": 911.1333333333333, "x": "英雄のように扱う言動がかなり見られる、\n厳に注意を要する、と。"}, {"t": 915.1333333333333, "x": "だから国会で説明された事実だけを短く言う。"}, {"t": 918.2333333333333, "x": "少年は1943年2月の生まれ。17歳だった。"}, {"t": 922.25, "x": "大学で中国文学を学ぶ学生だった。"}, {"t": 925.1, "x": "大学生だったのね。"}, {"t": 926.6833333333333, "x": "前の年の5月、参議院選挙の演説を\n聞いて、愛国党に入った。"}, {"t": 931.1, "x": "党の宿舎で暮らすようになった。"}, {"t": 933.0833333333334, "x": "そのあいだに、公務執行妨害や\n傷害などの疑いで十数回捕まっている。"}, {"t": 937.7833333333333, "x": "十数回も？"}, {"t": 938.9, "x": "十数回だ。ただ、\nこの年の5月の終わりに党をやめている。"}, {"t": 942.55, "x": "党の中のもつれや、党のやり方に\n批判的になったことが理由とされた。"}, {"t": 946.95, "x": "そのあと、やめた仲間が7月に\n作った別の団体に加わった。"}, {"t": 951.05, "x": "ただそこの事務所にも、最近は\n出入りしていなかったという。"}, {"t": 954.5833333333334, "x": "じゃあどこにも属してない状態だったの？"}, {"t": 957.05, "x": "籍は残っていたが、離れていたということだ。"}, {"t": 959.85, "x": "ここが、あとで背後関係を調べるときの焦点になる。"}, {"t": 963.1666666666666, "x": "誰かに言われてやったのか。"}, {"t": 964.65, "x": "一人で決めたのか。"}, {"t": 966.05, "x": "本人は一人でやったと言い続けた。"}, {"t": 968.9166666666666, "x": "なぜ浅沼さんだったのか。"}, {"t": 970.6, "x": "国会ではこの問いも出た。"}, {"t": 972.2166666666667, "x": "答えたのは警視総監だ。"}, {"t": 973.95, "x": "少年の供述を読み上げる前に、\n総監はこう前置きしている。"}, {"t": 977.6166666666667, "x": "これは故人に対して、はなはだ\n失礼になるのでございますが。"}, {"t": 981.4166666666666, "x": "前置きをしたのね。"}, {"t": 982.75, "x": "した。中身は、\n浅沼さんの政治の姿勢への強い反発だった。"}, {"t": 986.85, "x": "浅沼さんが中国を訪れたときの発言も、\nそこに入っていた。"}, {"t": 990.9, "x": "ここではそれ以上は読み上げない。"}, {"t": 992.7, "x": "総監の前置きのとおり、亡くなった\n人への悪口になるからだ。"}, {"t": 996.6, "x": "うん、それでいいと思う。"}, {"t": 998.1333333333333, "x": "もう一つ、供述で分かったことがある。"}, {"t": 1000.6, "x": "少年が狙っていたのは、浅沼さん1人ではなかった。"}, {"t": 1004.1333333333333, "x": "ほかにもいたの？"}, {"t": 1005.3166666666667, "x": "ほかの団体の指導者の名前も挙がっていた。"}, {"t": 1007.9333333333333, "x": "刑事局長の説明では、10月に\n入って自宅で短刀を見つけた。"}, {"t": 1012.15, "x": "そこで実行を決めた、とされている。"}, {"t": 1014.3833333333333, "x": "その日の新聞で三党首の演説会があると知った。"}, {"t": 1017.5333333333333, "x": "午後2時ごろ、中野の自宅を出た。"}, {"t": 1019.8, "x": "そしてさっきの入口から会場に入った。"}, {"t": 1022.5166666666667, "x": "その日に決めてその日に行ったの？"}, {"t": 1024.6333333333334, "x": "行き先を決めたのは、その日だったことになる。"}, {"t": 1027.4333333333334, "x": "警察が身構えていた抗議とは、\n別の筋から来たわけだ。"}, {"t": 1031.05, "x": "事前に情報がなかった、という説明はここにつながる。"}, {"t": 1034.4, "x": "ここで大事なのは言い分の中身ではない。"}, {"t": 1036.7166666666667, "x": "演説の途中で人を刺した、という事実のほうだ。"}, {"t": 1040.45, "x": "事件の知らせは、その日のうちに国じゅうに広がった。"}, {"t": 1043.6833333333334, "x": "会場にはテレビのカメラがあった。"}, {"t": 1045.65, "x": "警察庁長官は、テレビを通じて\n全国の人の目に映った、と言っている。"}, {"t": 1050.2666666666667, "x": "だからなまなましい実感で受け止められたのだと。"}, {"t": 1053.2, "x": "みんな、映像で見ちゃったのね。"}, {"t": 1055.2166666666667, "x": "見た人が多かった。"}, {"t": 1056.5666666666666, "x": "その日のうちに、抗議の集会やデモが組まれた。"}, {"t": 1059.45, "x": "東京をはじめ、10の都道府県だ。"}, {"t": 1061.7333333333333, "x": "加わった人はおよそ1万5千人と報告されている。"}, {"t": 1065.1666666666667, "x": "その日のうちに1万5千人。"}, {"t": 1067.1833333333334, "x": "一部では、警察の車を\n壊すなどの荒れた動きもあった。"}, {"t": 1070.6833333333334, "x": "ただ全体としては、比較的平静だったと\n警察庁長官は言っている。"}, {"t": 1075.15, "x": "海の外でも大きく報じられた。"}, {"t": 1077.15, "x": "13日付の各国の主な新聞は、これを1面で伝えた。"}, {"t": 1081.1, "x": "日本の民主主義の土台は\n弱いのではないか、と心配する論評も出た。"}, {"t": 1085.4833333333333, "x": "外国からもそう見られたのね。"}, {"t": 1087.5, "x": "そして国内には逆の声もあった。"}, {"t": 1089.7, "x": "さっき話した、少年をたたえる動きだ。"}, {"t": 1092.2833333333333, "x": "これには池田がはっきり答えている。"}, {"t": 1094.3666666666666, "x": "テロリストが愛国者であるというようなことは、\n毛頭考えていない。"}, {"t": 1098.1833333333334, "x": "そんな暴論は絶対に用いていない、と。"}, {"t": 1100.7666666666667, "x": "総理が国会でそう言ったのね。"}, {"t": 1102.7666666666667, "x": "言った。拍手が起きたと議事録にある。"}, {"t": 1105.1666666666667, "x": "では責任は誰がとったのか。次はそこだ。"}, {"t": 1108.6, "x": "事件のあと閣僚が1人辞めている。"}, {"t": 1110.85, "x": "自治大臣で国家公安委員長だった山崎巌だ。"}, {"t": 1114.0833333333333, "x": "警察の担当の大臣ね。"}, {"t": 1116.0333333333333, "x": "そうだ。池田はその辞任を認めた理由をこう答えた。"}, {"t": 1119.2833333333333, "x": "法律上の責任はない。"}, {"t": 1120.9, "x": "ただ、事の重さを政府が深く\n受け止めていると国民に知ってもらうためだ。"}, {"t": 1125.4666666666667, "x": "法律上は責任がないけど、辞めたってこと？"}, {"t": 1128.5, "x": "そういう整理だ。社会党はそれでは足りないと迫った。"}, {"t": 1131.7166666666667, "x": "内閣全体で責任をとるべきだ、と。"}, {"t": 1134.2666666666667, "x": "池田の答えはこうだ。"}, {"t": 1135.65, "x": "テロ事件で内閣が代わるのは、\n民主主義のルールに反する。"}, {"t": 1139.3666666666666, "x": "うーん。どっちの言い分も分かる気がする。"}, {"t": 1141.7333333333333, "x": "この動画では、どちらが正しいかは決めない。"}, {"t": 1144.35, "x": "両方の言葉を記録どおりに並べておく。"}, {"t": 1146.8, "x": "新しく国家公安委員長になった\n周東英雄は、別の点も強く言った。"}, {"t": 1151.3333333333333, "x": "政府には警察を指揮監督する力がない。"}, {"t": 1154.2333333333333, "x": "え、ないの？"}, {"t": 1155.2333333333333, "x": "ない。警察が政治から\n独立するように、そう作られている。"}, {"t": 1158.9166666666667, "x": "具体的な警備は、都道府県の警察と\n公安委員会が受け持つ。"}, {"t": 1162.9333333333334, "x": "だから警察官の責任を政府が\n問うのは筋が違う、という答えだ。"}, {"t": 1167.1333333333334, "x": "一方で警察は再発を防ぐための手を4つ挙げた。"}, {"t": 1170.35, "x": "危ない人物の見張りを強める。"}, {"t": 1172.2, "x": "狙われそうな人に護衛をつける。"}, {"t": 1174.25, "x": "集会の主催者と前もってよく話し合う。"}, {"t": 1176.8166666666666, "x": "そして刃物を持ち歩かせない運動を、\n学校とも組んで全国で行う。"}, {"t": 1181.1333333333334, "x": "最後のは少年だったからね。"}, {"t": 1183.1, "x": "そうだ。17歳が持ってきた刃物だった。"}, {"t": 1186.5166666666667, "x": "10月24日の連合審査会では、\n法務大臣も発言している。"}, {"t": 1190.7333333333333, "x": "小島徹三法務大臣だ。"}, {"t": 1192.55, "x": "最初に語ったのは、浅沼さんの思い出だった。"}, {"t": 1195.5333333333333, "x": "政治の立場は違ったが、親しみ\n深い人柄と温かい顔を思い出す。"}, {"t": 1200.0, "x": "だからこそこの事件には、限りない\n憎しみと悲しみを感じる、と。"}, {"t": 1204.2166666666667, "x": "大臣も個人として悲しんでたのね。"}, {"t": 1206.6833333333334, "x": "そうだ。そのうえで大臣は、暴力は\n左右を問わず民主主義の敵だと言った。"}, {"t": 1211.3833333333334, "x": "左右を問わず？"}, {"t": 1212.4666666666667, "x": "右からの暴力も左からの暴力も、\nどちらも許さないという意味だ。"}, {"t": 1216.6333333333334, "x": "そしてもう一つ付け加えている。"}, {"t": 1218.6166666666666, "x": "こういう事件が起きるたびに、\n取り締まりの法律を強めろという声が出る。"}, {"t": 1222.7, "x": "だが法律の上に法律を作るより、今ある\n法律を守らせることに重きを置きたい。"}, {"t": 1227.65, "x": "新しい法律は作らないってこと？"}, {"t": 1229.9666666666667, "x": "むやみに作らない、という言い方だ。"}, {"t": 1232.1, "x": "ただし法律を無視して暴力で主張を通す\n者には、今ある手段で断固として当たる。"}, {"t": 1237.1166666666666, "x": "事件の直後は、強い手を求める\n声がいちばん大きくなるときだ。"}, {"t": 1240.9833333333333, "x": "その時に法務大臣がこう\n言ったことも、記録に残っている。"}, {"t": 1244.7833333333333, "x": "怒ってるときほど、落ち着いて決めるってことね。"}, {"t": 1247.75, "x": "そういうことだろう。"}, {"t": 1248.8666666666666, "x": "警察庁長官の報告には、\n海外の受け止め方の違いも出てくる。"}, {"t": 1253.1166666666666, "x": "共産圏の新聞は、これを池田内閣と\nアメリカの責任だと書いた。"}, {"t": 1257.4, "x": "自由圏の新聞は、民主主義の土台への心配に\n加えてもう一つ書いた。"}, {"t": 1261.8833333333334, "x": "極右への反発から、左の側が暴力に\n傾くのではないかという心配だ。"}, {"t": 1266.7, "x": "どっちの側からも、暴力が増えるのが心配されたのね。"}, {"t": 1270.2333333333333, "x": "そうだ。だから大臣の左右を\n問わずという言葉には、重みがあった。"}, {"t": 1274.8666666666666, "x": "ここで最初の場面に戻る。"}, {"t": 1276.6333333333334, "x": "10月18日。事件から6日後の衆議院だ。"}, {"t": 1279.8, "x": "議長がまず報告した。"}, {"t": 1281.35, "x": "議員の浅沼稲次郎君は日比谷公会堂で\n災難にあい、急に亡くなりました、と。"}, {"t": 1286.3, "x": "院として、弔いの言葉を贈ることが決まった。"}, {"t": 1289.25, "x": "議長が読み上げた弔いの言葉には、こうある。"}, {"t": 1292.0333333333333, "x": "初代の議院運営委員長として\n新しい国会の運営に努めた。"}, {"t": 1295.85, "x": "民主政治の発達に力を尽くし、\nその功績はまことに偉大である。"}, {"t": 1300.2166666666667, "x": "最初の国会のときの仕事を、ちゃんと覚えてたのね。"}, {"t": 1303.5166666666667, "x": "13年前の仕事だ。議場の誰もが知っていた。"}, {"t": 1306.6833333333334, "x": "そのあと池田が壇上に立った。"}, {"t": 1308.75, "x": "最初に話してた演説ね。"}, {"t": 1310.7, "x": "そうだ。空席の話のあと、池田はこう続けている。"}, {"t": 1314.0833333333333, "x": "かつてここから発せられる一つの声を、私は聞いた。"}, {"t": 1317.4666666666667, "x": "今その人はなく、その声もやみました。"}, {"t": 1320.1, "x": "私は、誰に向かって論争をいどめばよいのでしょうか。"}, {"t": 1323.4, "x": "……論争の相手がいなくなったってことなのね。"}, {"t": 1326.0666666666666, "x": "そうだ。そして、その席から聞こえる声があるという。"}, {"t": 1329.3, "x": "わが身に起こったことを、\n他の人に起こさせてはならない。"}, {"t": 1332.6, "x": "暴力は、民主政治家にとって共通の敵である。"}, {"t": 1335.85, "x": "浅沼さんが言いそうなことを、\n池田さんが代わりに言ったのね。"}, {"t": 1339.4333333333334, "x": "そういう形をとっている。"}, {"t": 1341.0, "x": "池田はさらに、目的のために手段を\n選ばない風潮を絶対に許さないと誓った。"}, {"t": 1345.9666666666667, "x": "それが、浅沼さんのみたまに\nささげる唯一の玉ぐしだ、と。"}, {"t": 1349.8666666666666, "x": "玉ぐしって、神さまにお供えする木の枝よね。"}, {"t": 1352.9666666666667, "x": "そうだ。言葉を、お供えの代わりにするという意味だ。"}, {"t": 1356.0666666666666, "x": "池田はこの国会の意味にも触れている。"}, {"t": 1358.3333333333333, "x": "各党がそれぞれの政策を出し合い、\n国民に判断してもらうつもりだった。"}, {"t": 1362.7666666666667, "x": "浅沼さんもその決意だったはずだ。"}, {"t": 1364.9666666666667, "x": "暴力による死はその機会を永久に奪った。"}, {"t": 1367.7666666666667, "x": "選挙で比べてもらう機会、ってことね。"}, {"t": 1370.2833333333333, "x": "そうだ。1人の命と一緒に、比べてもらう場も消えた。"}, {"t": 1373.7833333333333, "x": "この演説は、議事録を開けば今でも全文が読める。"}, {"t": 1377.1166666666666, "x": "拍手の箇所まで全部記録されている。"}, {"t": 1379.4166666666667, "x": "党の違う2人のあいだにあった\n距離を、この演説は隠していない。"}, {"t": 1383.2333333333333, "x": "政策では争う。ただ、言葉で争う。"}, {"t": 1385.9, "x": "池田が言ったのはその一点だった。"}, {"t": 1388.6333333333334, "x": "3日後の10月21日。"}, {"t": 1390.5666666666666, "x": "衆議院で、各党の代表が総理に質問をする日だった。"}, {"t": 1394.15, "x": "社会党の代表として立ったのは、河上丈太郎さんだ。"}, {"t": 1397.8, "x": "6月に刺された人？"}, {"t": 1399.4833333333333, "x": "その人だ。河上さんは最初にこう言った。"}, {"t": 1402.2166666666667, "x": "本来ならば、きょうは浅沼君が社会党を代表して、\nこの壇上から質問をいたすはずでありました。"}, {"t": 1408.3, "x": "……本当なら、浅沼さんが立つ日だったのね。"}, {"t": 1411.1833333333334, "x": "そうだ。河上さんは浅沼さんを、運動に\n入って以来の友人と呼んでいる。"}, {"t": 1415.6666666666667, "x": "そして浅沼さんについてこう言った。"}, {"t": 1417.8333333333333, "x": "身に寸鉄を帯びず、ただ三寸の舌を\nもって信念を訴えてきた。"}, {"t": 1421.9333333333334, "x": "すんてつ？"}, {"t": 1422.8, "x": "小さな刃物のことだ。"}, {"t": 1424.15, "x": "刃物ひとつ持たず、言葉だけで\n訴えてきたという意味だ。"}, {"t": 1427.6666666666667, "x": "河上さんは、政府の責任を強く追及している。"}, {"t": 1430.95, "x": "右翼の資金がどこから出ているのか、\n調べるべきだとも迫った。"}, {"t": 1434.75, "x": "池田は、テロへの考えは河上君と全く同じだと答えた。"}, {"t": 1438.65, "x": "そして総理の責任は、こういう事件が\n起きない世の中を作ることだと言った。"}, {"t": 1443.15, "x": "河上さんの質問は最後に自分の話になる。"}, {"t": 1446.1833333333334, "x": "私は本年6月、衆議院の面会所に\nおいて暴漢に刺されました。"}, {"t": 1450.6833333333334, "x": "自分のことをそこで話したのね。"}, {"t": 1452.85, "x": "話した。そしてこう締めくくった。"}, {"t": 1455.05, "x": "テロ、暗殺に関する追悼演説のごときは、\n今後再び繰り返されないことを願う。"}, {"t": 1460.4166666666667, "x": "刺された人が、刺された\n仲間のために言った言葉なのね。"}, {"t": 1464.0666666666666, "x": "そうだ。この願いがどうなったかは、最後の章で話す。"}, {"t": 1468.1, "x": "この事件には、世界で知られた1枚の写真がある。"}, {"t": 1471.2333333333333, "x": "撮ったのは、毎日新聞のカメラマンの長尾靖さんだ。"}, {"t": 1474.75, "x": "写真は通信社のUPIを通じて、世界中に配られた。"}, {"t": 1478.5333333333333, "x": "有名な写真なの？"}, {"t": 1479.9833333333333, "x": "有名だ。翌1961年、\nアメリカのピュリツァー賞を受けている。"}, {"t": 1484.3666666666666, "x": "1961年の世界報道写真コンテストでも、\n大賞に選ばれた。"}, {"t": 1489.2, "x": "賞をもらった写真なのね。"}, {"t": 1490.95, "x": "ただ国会では逆の声も出ていた。"}, {"t": 1493.0833333333333, "x": "事件の10日後の参議院本会議だ。"}, {"t": 1495.4, "x": "社会党の議員がこう言っている。"}, {"t": 1497.25, "x": "あの身の毛もよだつ場面が写真に\n撮られ、テレビで流されるのは、"}, {"t": 1500.8, "x": "今の世の中であってはならないことだ、と。"}, {"t": 1503.4833333333333, "x": "撮られたこと自体が、おかしいって言ってるの？"}, {"t": 1506.2333333333333, "x": "そうだ。そんな場面が人前で起きてしまったこと。"}, {"t": 1509.3166666666666, "x": "それを全国の人が見ることになったこと。"}, {"t": 1511.8833333333334, "x": "その両方への怒りだ。"}, {"t": 1513.45, "x": "記録として大事だっていう考えもあるわよね。"}, {"t": 1516.25, "x": "ある。何が起きたかを、言葉より確かに伝えるからだ。"}, {"t": 1519.6833333333334, "x": "一方で、写っているのは亡くなる直前の1人の人だ。"}, {"t": 1523.2833333333333, "x": "残すことと見せ方は分けて考えるってこと？"}, {"t": 1526.2, "x": "私はそう考えている。"}, {"t": 1527.75, "x": "この動画では、写真を出すときは\n小さく、引用の枠の中で出す。"}, {"t": 1531.9, "x": "出典をつけて話している場面でだけ使う。"}, {"t": 1534.5833333333333, "x": "残った記録に、見せ物の役をさせないためだ。"}, {"t": 1538.1833333333334, "x": "国会がいちばん長く\n問い続けたのは、背後関係だった。"}, {"t": 1541.8666666666666, "x": "誰かが後ろで指図してたか、ってこと？"}, {"t": 1544.4833333333333, "x": "そうだ。17歳が一人で決めたのか。"}, {"t": 1547.05, "x": "誰かが金を出したり、指図したりしていなかったか。"}, {"t": 1550.2833333333333, "x": "捜査はかなりの規模で行われた。"}, {"t": 1552.35, "x": "事件の夜11時ごろから\n翌日の午前1時ごろにかけて、6か所を捜索した。"}, {"t": 1557.3833333333334, "x": "自宅や、少年が加わっていた団体の事務所などだ。"}, {"t": 1560.7166666666667, "x": "メモやノートなど、26種類90点を押収している。"}, {"t": 1564.3333333333333, "x": "その日の夜のうちに？"}, {"t": 1565.85, "x": "その日の夜のうちにだ。"}, {"t": 1567.3666666666666, "x": "翌日には合同の特別捜査本部が置かれた。"}, {"t": 1570.3333333333333, "x": "14日には、事件が東京地検に送られている。"}, {"t": 1573.4166666666667, "x": "地検は公安部の検事10人全員と、\n事務官14人で班を組んだ。"}, {"t": 1577.6333333333334, "x": "あとから4か所を追加で調べ、\nさらに文書107件を押さえた。"}, {"t": 1581.5333333333333, "x": "参考人も十数人、任意で呼んで話を聞いている。"}, {"t": 1584.7333333333333, "x": "調べる中で関係する別の事件も\n数件見つかり、それぞれ処理された。"}, {"t": 1589.2166666666667, "x": "別の事件って、浅沼さんの事件の仲間ってこと？"}, {"t": 1592.7, "x": "そうではない。今回の事件の共犯とは、\n別に扱われている。"}, {"t": 1596.6666666666667, "x": "かなり調べたのね。"}, {"t": 1598.0833333333333, "x": "調べた。国会では、資金の出どころも質問された。"}, {"t": 1601.55, "x": "団体が事務所を借りるお金を、\n誰かが出しているのではないかという問いだ。"}, {"t": 1605.7166666666667, "x": "国家公安委員長は、調べた\n結果そういう事実はないと答えている。"}, {"t": 1609.8, "x": "部屋は無償で貸されていた、という説明だった。"}, {"t": 1612.7666666666667, "x": "じゃあお金の線は出なかったの？"}, {"t": 1614.7166666666667, "x": "政府の答えでは出なかった。"}, {"t": 1616.45, "x": "ここで一つ断っておく。"}, {"t": 1618.1333333333334, "x": "国会では、何人かの実名が質問の中に出てくる。"}, {"t": 1621.6333333333334, "x": "ただその人たちが事件に\n関わったという結論は出ていない。"}, {"t": 1625.1333333333334, "x": "だからこの動画では名前を出さない。"}, {"t": 1627.1833333333334, "x": "質問として出ただけの名前は、答えではないからだ。"}, {"t": 1631.05, "x": "事件から21日目の11月2日。"}, {"t": 1633.7833333333333, "x": "検察は少年の事件を家庭裁判所に送った。"}, {"t": 1636.8166666666666, "x": "意見をつけてだ。大人と\n同じ刑事裁判にかけるのが相当だ、と。"}, {"t": 1641.0833333333333, "x": "少年だからまず家庭裁判所に行くのね。"}, {"t": 1643.75, "x": "そういう決まりだ。そこから、もう\n一度検察に戻して起訴する考えだった。"}, {"t": 1648.4166666666667, "x": "家庭裁判所は、その日のうちに\n東京少年鑑別所に入れる決定をした。"}, {"t": 1653.0666666666666, "x": "鑑別所ってどういうところ？"}, {"t": 1654.8833333333334, "x": "少年の心や体の様子を調べて、\n処分を決める材料を作るところだ。"}, {"t": 1659.4166666666667, "x": "少年が鑑別所に着いたのは、午後2時10分。"}, {"t": 1662.4, "x": "所長は前もって幹部を集め、扱いを話し合っていた。"}, {"t": 1665.8166666666666, "x": "世間の注目を集めた事件だったからだ。"}, {"t": 1668.45, "x": "面接をして決まりを説明した。"}, {"t": 1670.5333333333333, "x": "午後3時半ごろ、寮の部屋に入れた。"}, {"t": 1672.9, "x": "職員は5分から15分おきに、\n廊下の窓から様子を見ていた。"}, {"t": 1676.7833333333333, "x": "持ってきた弁当も、所の食事も、\nほとんど食べたという。"}, {"t": 1680.55, "x": "落ち着いてたのね。"}, {"t": 1681.8333333333333, "x": "落ち着いて見えた、と報告されている。"}, {"t": 1684.1, "x": "午後7時55分まで、変わったところは\n何も見られなかった。"}, {"t": 1687.85, "x": "そこで30分のあいだ見回りが離れた。"}, {"t": 1690.5166666666667, "x": "30分……。"}, {"t": 1691.4833333333333, "x": "午後8時15分ごろ。"}, {"t": 1693.0, "x": "少年が部屋の中で自ら命を絶っているのが見つかった。"}, {"t": 1696.6166666666666, "x": "……鑑別所に入った、その日の夜に。"}, {"t": 1699.1333333333334, "x": "その日の夜にだ。"}, {"t": 1700.3333333333333, "x": "ここではそれ以上のことは話さない。"}, {"t": 1702.45, "x": "法務省の矯正局長は国会で、\nまことに残念だと述べている。"}, {"t": 1706.4333333333334, "x": "捜査に障害を与えたという点で、\nきわめて遺憾だとも言った。"}, {"t": 1710.7, "x": "12月1日、参議院の法務委員会。"}, {"t": 1713.3833333333334, "x": "法務省の刑事局長が、捜査の結果を報告した。"}, {"t": 1716.7833333333333, "x": "起訴して地裁で裁くつもりだったが、\nそれができなくなった。"}, {"t": 1720.4, "x": "事件はこのまま終わらざるを得なくなった、と。"}, {"t": 1723.1333333333334, "x": "終わっちゃったの？"}, {"t": 1724.2333333333333, "x": "刑事事件としてはそこで終わった。"}, {"t": 1726.3333333333333, "x": "犯人が亡くなれば、起訴はできない。"}, {"t": 1728.5666666666666, "x": "だからこの事件には判決が1つもない。"}, {"t": 1731.2833333333333, "x": "裁判で確かめられたことは、何もないってこと？"}, {"t": 1734.4333333333334, "x": "法廷で確かめられたことは何もない。"}, {"t": 1736.75, "x": "残っているのは、検察と警察の調べの結果だけだ。"}, {"t": 1740.2333333333333, "x": "その結果を刑事局長はこうまとめた。"}, {"t": 1742.65, "x": "少年は、自分の単独の犯行だと主張している。"}, {"t": 1745.9, "x": "外から調べていく捜査も行った。"}, {"t": 1748.2166666666667, "x": "それでも刑法でいう共犯関係を認めるに\n足る証拠は見つからなかった。"}, {"t": 1752.5166666666667, "x": "一人でやった、ということね。"}, {"t": 1754.5166666666667, "x": "刑法の上では、そうなる。ただ、続きがある。"}, {"t": 1757.45, "x": "思想的な影響を与えたという\n点は、認めざるを得ない、と。"}, {"t": 1761.1666666666667, "x": "考え方の影響はあった、ってこと？"}, {"t": 1763.55, "x": "そうだ。影響はあった。共犯ではない。"}, {"t": 1766.0333333333333, "x": "法律で言えるのはここまで、という線を引いている。"}, {"t": 1768.8666666666666, "x": "12月の国会でも、この点は何度も問われた。"}, {"t": 1771.9333333333334, "x": "鑑別所での30分はなぜ空いたのか。"}, {"t": 1774.4, "x": "背後は本当に調べ尽くしたのか。"}, {"t": 1776.6, "x": "裁判が開かれていれば、\n少年は法廷で何を語ったのか。"}, {"t": 1780.45, "x": "それはもう誰にも分からないのね。"}, {"t": 1782.5, "x": "分からない。そこだけは、\n答えが出ないまま残っている。"}, {"t": 1785.75, "x": "この動画が、ここから先を推し量ることはしない。"}, {"t": 1788.7, "x": "記録に書かれた線で止めて }, {"t": 1905.0166666666667, "x": "相手がいないまま、選挙になったのね。"}, {"t": 1907.5166666666667, "x": "そういうことになる。"}, {"t": 1908.7166666666667, "x": "12月の国会では、\n選挙そのものの報告も行われている。"}, {"t": 1912.6, "x": "自治省の選挙局長はこう報告した。"}, {"t": 1915.1333333333334, "x": "浅沼事件を受けて、立会演説会の秩序を\n守ることに特に気をつけた。"}, {"t": 1919.7833333333333, "x": "どの会場でも事故は1つもなかった、と。"}, {"t": 1922.5333333333333, "x": "立会演説会はそのまま続けたのね。"}, {"t": 1925.15, "x": "続けた。言葉で争う場はなくさなかった。"}, {"t": 1927.9333333333334, "x": "守り方の方を固めて、選挙を通したということだ。"}, {"t": 1931.3166666666666, "x": "池田の演説も、河上さんの演説も、\n同じことを言っていた。"}, {"t": 1935.2666666666667, "x": "演説の場を、暴力に明け渡さないということだ。"}, {"t": 1938.2333333333333, "x": "ここで今回の話のもとになった記録を挙げておく。"}, {"t": 1941.3333333333333, "x": "当日の時刻と警備の数字は、\n1960年10月24日の衆議院の連合審査会。"}, {"t": 1947.25, "x": "地方行政委員会と法務委員会が合同で開いたものだ。"}, {"t": 1950.6333333333334, "x": "警備の配置と機材の陰の話は、\n10月22日の参議院本会議。"}, {"t": 1955.2333333333333, "x": "池田の追悼演説は、10月18日の衆議院本会議。"}, {"t": 1959.1, "x": "河上さんの質問と池田の答弁は、\n10月21日の衆議院本会議。"}, {"t": 1963.9166666666667, "x": "鑑別所と捜査の結果は、\n12月1日の参議院法務委員会だ。"}, {"t": 1968.3833333333334, "x": "全部、国会の記録なのね。"}, {"t": 1970.4833333333333, "x": "そうだ。国会会議録検索システムで、誰でも読める。"}, {"t": 1974.1, "x": "写真の賞は、ピュリツァー賞と\n世界報道写真財団の記録。"}, {"t": 1977.8166666666666, "x": "浅沼さんの経歴は、\n国立国会図書館の近代日本人の肖像も見た。"}, {"t": 1982.5833333333333, "x": "ここに無いことは話していない。"}, {"t": 1985.05, "x": "最後に河上さんの願いの話をしておく。"}, {"t": 1987.7333333333333, "x": "テロや暗殺の追悼演説が、\n二度と繰り返されないように。"}, {"t": 1991.4166666666667, "x": "その願いはかなったの？"}, {"t": 1993.0, "x": "かなわなかった。"}, {"t": 1994.0833333333333, "x": "2022年10月25日。"}, {"t": 1996.15, "x": "衆議院の本会議場。"}, {"t": 1997.7166666666667, "x": "安倍晋三元総理への追悼演説が行われた。"}, {"t": 2000.7, "x": "その年の7月、選挙の応援演説の最中に\n銃で撃たれて亡くなっている。"}, {"t": 2005.4666666666667, "x": "また、演説の最中に……。"}, {"t": 2007.35, "x": "演説の最中にだ。"}, {"t": 2008.7666666666667, "x": "追悼演説に立ったのは、党の違う\n野田佳彦元総理だった。"}, {"t": 2012.75, "x": "62年前と同じく、立場の違う人が壇上に立った。"}, {"t": 2016.6833333333334, "x": "池田さんと浅沼さんのときと、同じ形なのね。"}, {"t": 2020.0166666666667, "x": "形は同じになった。"}, {"t": 2021. const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
