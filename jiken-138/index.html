<script>
const D={"name": "138", "file": "138_編集用", "dur": 2200.66665625, "segs": [], "subs": [{"t": 0.0, "x": "長野県のある家に、朝になると\n郵便局から封筒が届いた。"}, {"t": 3.8666666666666667, "x": "1971年2月ごろの話である。"}, {"t": 6.833333333333333, "x": "中身は現金の50万円。"}, {"t": 8.466666666666667, "x": "朝に2通か3通で、夕方にまた届く。"}, {"t": 11.433333333333334, "x": "50万円！？　何を売った代金なの？"}, {"t": 13.833333333333334, "x": "何も売っていない。差出人も見知らぬ人だ。"}, {"t": 16.766666666666666, "x": "友人の家でそれを見たのは、食堂を営む男だった。"}, {"t": 20.216666666666665, "x": "1日で200万円が飛び込んでくるのだという。"}, {"t": 23.0, "x": "朝から晩まで町じゅうがその話でごった返していた。"}, {"t": 26.2, "x": "のちに国会で本人が語った光景だ。"}, {"t": 28.833333333333332, "x": "宝くじに当たったわけでもないのね。"}, {"t": 31.15, "x": "違う。送り主も同じように誰かへ送っていた。"}, {"t": 34.083333333333336, "x": "60万円を出すと、3300万円が返ってくるはずの会。"}, {"t": 38.233333333333334, "x": "55倍？　そんな話があるの？"}, {"t": 40.46666666666667, "x": "あった。公称の会員は120万人に達した。"}, {"t": 43.56666666666667, "x": "今回は天下一家の会事件を、この現金封筒から追う。"}, {"t": 47.11666666666667, "x": "見るのは、かけ算と法律の条文だ。"}, {"t": 49.63333333333333, "x": "かけ算？"}, {"t": 50.766666666666666, "x": "掛け算を3回やれば、終わりが見える会だった。"}, {"t": 53.63333333333333, "x": "それなのに、止める法律は11年なかった。"}, {"t": 64.3, "x": "始まりは1967年3月だ。"}, {"t": 67.08333333333333, "x": "場所は熊本県の上益城郡、甲佐町。"}, {"t": 69.9, "x": "内村健一という男が、自宅で会を立ち上げた。"}, {"t": 73.16666666666667, "x": "名前は第一相互経済研究所という。"}, {"t": 75.73333333333333, "x": "堅い名前ね。経済の研究をするところ？"}, {"t": 78.58333333333333, "x": "のちに法廷で、弁護士も同じことを尋ねた。"}, {"t": 81.4, "x": "研究所と名乗る以上、何か研究しているのだろうと。"}, {"t": 84.85, "x": "それで答えは？"}, {"t": 85.96666666666667, "x": "研究しているものは何もなかった。"}, {"t": 88.16666666666667, "x": "やっていたのは、ねずみ講だけだった。"}, {"t": 90.58333333333333, "x": "名前だけはりっぱなのね。"}, {"t": 92.25, "x": "この「名前だけ」は、あとで何度も出てくる。"}, {"t": 95.18333333333334, "x": "同じ年の8月12日。"}, {"t": 96.95, "x": "地元の熊本日日新聞が記事を載せた。"}, {"t": 99.86666666666666, "x": "見出しは「〃ネズミ講〃その危険な魅力」だった。"}, {"t": 103.2, "x": "始まって5か月で、もう新聞に？"}, {"t": 105.58333333333333, "x": "呼び名まで、もう定まっていた。"}, {"t": 107.65, "x": "会は何をうたっていたの？"}, {"t": 109.33333333333333, "x": "「天下一家」。世の中は\nひとつの家だという考え方だ。"}, {"t": 112.71666666666667, "x": "会員どうしの助け合い運動だと説明した。"}, {"t": 115.53333333333333, "x": "金もうけとは言わなかったのね。"}, {"t": 117.51666666666667, "x": "言わない。国民を貧乏から救うと語っていた。"}, {"t": 120.4, "x": "この看板は、最後まで下ろされなかった。"}, {"t": 123.56666666666666, "x": "1970年の時点で、コースは4つあった。"}, {"t": 126.8, "x": "国会で読み上げられた数字を順に見る。"}, {"t": 129.13333333333333, "x": "一つ目は「親しき友の会」。"}, {"t": 131.06666666666666, "x": "元手は2千円あまりだ。"}, {"t": 132.71666666666667, "x": "4人を誘い、6段階で102万4000円を受け取る。"}, {"t": 136.13333333333333, "x": "二つ目は相互経済協力会。"}, {"t": 138.08333333333334, "x": "4万円で102万円。"}, {"t": 139.7, "x": "こちらは2人を誘い、段階は7つになる。"}, {"t": 142.45, "x": "三つ目は10万円で528万円のマイハウス友の会。"}, {"t": 146.3, "x": "家を建てるお金ってこと？"}, {"t": 148.0, "x": "そう売り出された。誘うのは2人で8段階だ。"}, {"t": 151.0, "x": "四つ目が中小企業向けの60万円のコース。"}, {"t": 154.0, "x": "受け取りは3300万円。これが一番大きい。"}, {"t": 157.15, "x": "冒頭の50万円の封筒は、これね。"}, {"t": 159.7, "x": "その通り。1970年の11月ごろに始まったらしい。"}, {"t": 163.75, "x": "1977年にはコースが7つまで増えている。"}, {"t": 167.1, "x": "規定では、法人しか入れないはずだった。"}, {"t": 169.71666666666667, "x": "だが名前を書いて金を送れば、実際は誰でも通った。"}, {"t": 173.08333333333334, "x": "参考人はこれを「ネコもしゃくしも」と言っている。"}, {"t": 176.21666666666667, "x": "会社じゃない人まで60万円を？"}, {"t": 178.45, "x": "出した。高利貸しから借りて入る人までいた。"}, {"t": 181.26666666666668, "x": "銀行が貸さない中小企業も引き寄せられた。"}, {"t": 184.03333333333333, "x": "パンフレットの言葉を、長野の判決が引いている。"}, {"t": 187.11666666666667, "x": "「数ケ月後には貴方の企業グループから三、三〇\n〇万円のお金が順次送られることになるのです。」"}, {"t": 193.18333333333334, "x": "数か月で！　それはまぶしいわね。"}, {"t": 195.86666666666667, "x": "では60万円はどこへ行くのか。"}, {"t": 197.88333333333333, "x": "警察庁の説明では、二つに分かれる。"}, {"t": 200.58333333333334, "x": "10万円は熊本の本部へ。"}, {"t": 202.43333333333334, "x": "残りの50万円は、本部が指定した先輩会員へ。"}, {"t": 205.91666666666666, "x": "本部を通さず、直接送るの？"}, {"t": 208.16666666666666, "x": "そこが肝心だ。現金書留で人から人へ送る。"}, {"t": 211.56666666666666, "x": "冒頭の友人に届いた封筒が、この50万円だ。"}, {"t": 214.93333333333334, "x": "じゃあ本部が受け取るのは10万円だけ？"}, {"t": 217.31666666666666, "x": "入会金という名前の10万円だけだ。"}, {"t": 219.68333333333334, "x": "だがこの10万円は、入る人がいる限り必ず入る。"}, {"t": 223.2, "x": "誰が損をしても？"}, {"t": 224.55, "x": "関係ない。ある議員は、\n機械的に転がり込むと表現した。"}, {"t": 228.3, "x": "講元の権利だけは確実に\n保障されている、とも言った。"}, {"t": 231.91666666666666, "x": "講元って、会の親玉のことね。"}, {"t": 234.3, "x": "そう。そして会員は2人を誘う義務を負う。"}, {"t": 236.91666666666666, "x": "誘われた2人が、また2人ずつ誘う。"}, {"t": 239.5, "x": "孫の会員が4人できると、うち2人から50万円ずつ届く。"}, {"t": 243.51666666666668, "x": "100万円！　もう元が取れてるじゃない。"}, {"t": 245.83333333333334, "x": "さらに進むと、7段下に128人ができる。"}, {"t": 249.18333333333334, "x": "その半分の64人から、また50万円ずつ届く。"}, {"t": 252.86666666666667, "x": "64かける50万で……3200万円？"}, {"t": 255.98333333333332, "x": "先の100万円と足して3300万円。"}, {"t": 258.6166666666667, "x": "計算は合っている。"}, {"t": 259.96666666666664, "x": "じゃあ、どこが問題なの？"}, {"t": 261.7, "x": "128人の下にも人がいないと、その128人が損をする。"}, {"t": 266.8833333333333, "x": "ここで冒頭に言った掛け算をやる。"}, {"t": 268.8833333333333, "x": "1人の満額のために、7段下までで何人要るか。"}, {"t": 272.21666666666664, "x": "2人、4人、8人、16人、32人、64人、128人。"}, {"t": 277.45, "x": "足すと254人。一番下の段は128人だ。"}, {"t": 281.35, "x": "1人のために254人？"}, {"t": 283.4166666666667, "x": "その128人も、全員が満額を待っている。"}, {"t": 286.6333333333333, "x": "128人それぞれに、また128人の段が要る。"}, {"t": 290.35, "x": "128掛ける128で、1万6384人。"}, {"t": 294.65, "x": "もう1回で209万7152人。"}, {"t": 297.6, "x": "一気に増えたわね。"}, {"t": 298.93333333333334, "x": "もう1回掛けると、2億6843万人を超える。"}, {"t": 302.8333333333333, "x": "当時の日本の人口は、1億1000万人あまりだ。"}, {"t": 306.26666666666665, "x": "3回で日本の人口を超えちゃった！"}, {"t": 308.55, "x": "これが冒頭の3回だ。"}, {"t": 310.0833333333333, "x": "東京大学の教授も、国会でこう見積もっている。"}, {"t": 313.23333333333335, "x": "恐らく30世代ぐらいで、\n地球上の全人口が入る勘定になる。"}, {"t": 317.4, "x": "1週間に1世代なら、半年かそこらだと。"}, {"t": 320.5, "x": "地球が半年で終わっちゃう。"}, {"t": 322.3, "x": "教授は続けて、面白いことを言った。"}, {"t": 324.75, "x": "「私は現に入っておらないわけであります。」"}, {"t": 327.3666666666667, "x": "先生、まじめな顔で何を言ってるの。"}, {"t": 329.8666666666667, "x": "10年たっても自分が誘われて入るに至っていない。"}, {"t": 332.9166666666667, "x": "それは勧誘がいかに難しいかの証拠だ、という話だ。"}, {"t": 336.3666666666667, "x": "つまり途中で泣いている人が、それだけ多い。"}, {"t": 339.18333333333334, "x": "会長はこの計算に何て答えたの？"}, {"t": 341.6, "x": "教授の論文によると、人間は次々と\n生まれると言っていたらしい。"}, {"t": 345.5, "x": "教授の切り返しはこうだ。"}, {"t": 347.1, "x": "どの夫婦も四つ子をもうけ、たちまち\n成人してまた四つ子を生む。"}, {"t": 351.0833333333333, "x": "皮肉がきいてるわね。"}, {"t": 352.56666666666666, "x": "教授の一文を、そのまま読む。"}, {"t": 354.6166666666667, "x": "「ネズミ講は必ず被害者を生む。」"}, {"t": 356.6166666666667, "x": "「早くつぶれればつぶれるほど、\n被害者は少なくてすむ」"}, {"t": 360.05, "x": "大きくなるほど、悪くなるのね。"}, {"t": 362.23333333333335, "x": "そう。発展は被害の増加と同じ意味だった。"}, {"t": 365.6666666666667, "x": "その発展は、まず地方の町を飲み込んだ。"}, {"t": 368.3666666666667, "x": "1970年12月17日。"}, {"t": 370.9, "x": "参議院の大蔵委員会。"}, {"t": 372.51666666666665, "x": "ある議員が、長野県の丸子町の話を持ち出した。"}, {"t": 375.8666666666667, "x": "町の半分ぐらいの3000世帯が入っている、と。"}, {"t": 379.01666666666665, "x": "町の半分！？"}, {"t": 380.18333333333334, "x": "もう誘う相手がいなくなった。"}, {"t": 381.98333333333335, "x": "すると会員の奪い合いが始まった。"}, {"t": 384.23333333333335, "x": "奪い合いって、何を？"}, {"t": 385.78333333333336, "x": "まだ入っていない人を、だ。"}, {"t": 387.53333333333336, "x": "おれが取ったこの人が取ったと、\n親戚や友人でけんかになる。"}, {"t": 391.3833333333333, "x": "友達が金づるに見えちゃうのね。"}, {"t": 393.53333333333336, "x": "同じ議員が、熊本の本部の様子も伝えている。"}, {"t": 396.6333333333333, "x": "申し込みは現金書留で郵便局に届く。"}, {"t": 399.5, "x": "研究所がワゴン車で取りに行く。"}, {"t": 401.4166666666667, "x": "戻ると銀行が待っていて、すぐ預金する。"}, {"t": 404.18333333333334, "x": "銀行が待ちかまえてるの？"}, {"t": 405.93333333333334, "x": "1日で3000万円を下らない金が入ると言われていた。"}, {"t": 409.3666666666667, "x": "ホテルも次々と買い取り、\n本部の裏には6階建てを新築中だった。"}, {"t": 413.75, "x": "止める人はいなかったの？"}, {"t": 415.43333333333334, "x": "この日、国税庁も警察庁も、まだ\n調べている最中だと答えた。"}, {"t": 419.8, "x": "始まってから3年9か月がたっていた。"}, {"t": 422.43333333333334, "x": "同じ型の組織も全国に生まれていた。"}, {"t": 424.96666666666664, "x": "東京では「幸福の手紙」が配られ、\n警視庁に被害の届けが出た。"}, {"t": 429.43333333333334, "x": "委員席から声が飛んでいる。"}, {"t": 431.15, "x": "「悪いことをまねしたものだ」"}, {"t": 432.8, "x": "国税庁の長官は、根本は熊本から\n発しているようだと答えた。"}, {"t": 437.6166666666667, "x": "国に目をつけられて、会長は怖くなかったの？"}, {"t": 440.6333333333333, "x": "逆だ。週刊誌でこう語ったと、議員が読み上げた。"}, {"t": 443.95, "x": "「大蔵省って国民のための役所じゃなかか。」"}, {"t": 446.6333333333333, "x": "「大蔵大臣の資格なし。\nわしが罷免してやりまっしゅ」"}, {"t": 450.1, "x": "大臣を罷免！？"}, {"t": 451.26666666666665, "x": "委員会の記録には（笑声）と書いてある。"}, {"t": 454.0833333333333, "x": "笑われてるじゃない。"}, {"t": 455.35, "x": "だが会長の側には、それを\n言えるだけの理由があった。"}, {"t": 458.48333333333335, "x": "どの法律にも引っかからない形をしていたのだ。"}, {"t": 461.4166666666667, "x": "議員は「はっきりと詐欺罪を\n構成するのじゃないですか」と迫った。"}, {"t": 465.4166666666667, "x": "委員席からも「詐欺罪だ」と声が上がった。"}, {"t": 468.3833333333333, "x": "みんなそう思っていたのね。"}, {"t": 470.0833333333333, "x": "思っていた。だが思うだけでは罪にはならない。"}, {"t": 472.8666666666667, "x": "ここから法律との長い追いかけっこが始まる。"}, {"t": 476.26666666666665, "x": "最初に動いたのは警察ではなかった。"}, {"t": 478.65, "x": "1971年6月。熊本国税局が強制調査に入った。"}, {"t": 483.3833333333333, "x": "冒頭の男は、この時どうしていたか。"}, {"t": 485.8666666666667, "x": "彼は結局、60万円の口を3つ買っていた。"}, {"t": 489.25, "x": "3つって、180万円！？"}, {"t": 491.35, "x": "保養所の祝賀会で、本部の幹部の説明を聞いたのだ。"}, {"t": 494.8333333333333, "x": "これは助け合いだ。\n二百億の資産があるから心配はいらない。"}, {"t": 498.5, "x": "断り切れない世間づきあいもあった。"}, {"t": 500.7, "x": "彼は誘う相手を探して、友人のいる横浜まで来た。"}, {"t": 504.18333333333334, "x": "その日の新聞に、熊本の査察が大きく載っていた。"}, {"t": 507.68333333333334, "x": "うわ、よりによって。"}, {"t": 509.15, "x": "それでも彼は二百億の話を信じて友人を誘った。"}, {"t": 512.55, "x": "のちに国会でそのことも正直に話している。"}, {"t": 515.4166666666666, "x": "長野へ帰ると町の様子が変わっていた。"}, {"t": 517.8666666666667, "x": "本人の言葉では「火をつけたように\nごった返している」。"}, {"t": 521.2166666666667, "x": "何が起きたの？"}, {"t": 522.4166666666666, "x": "新聞で騒がれて、次の人が入らなくなった。"}, {"t": 525.4666666666667, "x": "下がいなければ、金は永久に届かない。"}, {"t": 528.0833333333334, "x": "誘った人と誘われた人の間で、\n金を返せという争いになる。"}, {"t": 532.2, "x": "家族で夜逃げした人もいた。"}, {"t": 534.05, "x": "スキー場で知られる志賀高原の例も語られている。"}, {"t": 536.9333333333333, "x": "ある人が村じゅうに勧めて、全員が入った。"}, {"t": 539.8333333333334, "x": "その結果、持っていく先が無くなった。"}, {"t": 542.5, "x": "勧めた人はどうなったの？"}, {"t": 544.3333333333334, "x": "村八分になったという。"}, {"t": 545.8333333333334, "x": "岐阜県では、自ら命を絶った\n人が出たと国会で語られている。"}, {"t": 550.05, "x": "……お金の話じゃ、済まなくなったのね。"}, {"t": 552.6166666666667, "x": "そうだ。被害に遭った人は、\n同時に誘った人でもあった。"}, {"t": 556.95, "x": "長野の会員たちは毎晩何百人も集まって相談した。"}, {"t": 560.5166666666667, "x": "熊本へ確かめに行こう、という話になった。"}, {"t": 563.3666666666667, "x": "代理に頼まれたのが、あの食堂の男だ。"}, {"t": 566.15, "x": "皆から4万5000円のカンパをもらって熊本へ向かった。"}, {"t": 569.5666666666667, "x": "着いたのは1971年6月14日。"}, {"t": 572.5666666666667, "x": "翌15日が本館の落成の大会だ。"}, {"t": 575.3, "x": "行ってみて、彼は驚いた。"}, {"t": 577.0833333333334, "x": "6月15日は、会長自身の誕生日だった。"}, {"t": 580.35, "x": "えっ、全国から人を呼んで誕生祝い？"}, {"t": 582.9666666666667, "x": "彼の目にはそう映った。"}, {"t": 584.35, "x": "税金の騒ぎの真っただ中にだ。"}, {"t": 586.5333333333333, "x": "その夜、各県の代表と会長の話し合いが開かれた。"}, {"t": 590.1333333333333, "x": "世間の非難の理由は何か。"}, {"t": 591.85, "x": "損をした人をどうするのか。"}, {"t": 593.7833333333333, "x": "会長は何て答えたの？"}, {"t": 595.5, "x": "国がつぶしたら、国が責任を取ってほしい。"}, {"t": 598.3, "x": "新聞が騒ぐのは、でたらめなのだ。"}, {"t": 600.5833333333334, "x": "補償の話に、それらしい返事は無かったという。"}, {"t": 603.5333333333333, "x": "これは彼が国会で語った記憶で、\n会長の側の記録ではない。"}, {"t": 607.55, "x": "そこは分けておくのね。"}, {"t": 609.0666666666667, "x": "分ける。今回は、誰が語ったかを必ず言う。"}, {"t": 612.0666666666667, "x": "彼は帰っても、寝ても覚めてもいられなかった。"}, {"t": 614.9166666666666, "x": "そして裁判をすると決めた。"}, {"t": 617.3333333333334, "x": "だがこの裁判は、始める前から壁があった。"}, {"t": 620.2333333333333, "x": "何人の弁護士に会っても、\n相手にしてくれなかったのだ。"}, {"t": 623.7, "x": "どうして？　被害者が大勢いるのに。"}, {"t": 625.9833333333333, "x": "1人あたりの金額が小さいからだ。"}, {"t": 628.25, "x": "訴えて返せと言えるのは、まず入会金の部分になる。"}, {"t": 631.5666666666667, "x": "60万円のうち10万円だ。"}, {"t": 633.6333333333333, "x": "手間のほうが高くつくのね。"}, {"t": 635.4833333333333, "x": "それに、入った人にも引け目がある。"}, {"t": 637.8166666666667, "x": "欲をかいたのが悪いと言われるのが怖い。"}, {"t": 640.1333333333333, "x": "本部もそれを見越していた、と弁護士は語っている。"}, {"t": 643.1833333333333, "x": "ようやく会えた弁護士は、金が無いと聞いて答えた。"}, {"t": 646.1833333333333, "x": "社会問題だから放ってはおけない、やりましょうと。"}, {"t": 649.35, "x": "その弁護士さん、かっこいいじゃない。"}, {"t": 651.4666666666667, "x": "1972年2月、長野地方裁判所に訴えが起こされた。"}, {"t": 655.8666666666667, "x": "原告は520人にのぼった。"}, {"t": 658.05, "x": "のちの集団訴訟の費用も、国会で紹介されている。"}, {"t": 661.4333333333333, "x": "60万円の人で1万1000円。"}, {"t": 663.5666666666667, "x": "最高裁まで行っても同じだと。"}, {"t": 665.6166666666667, "x": "裁判は5年かかり、公判は25回を数えた。"}, {"t": 668.75, "x": "判決の話は後に回す。"}, {"t": 670.6666666666666, "x": "その間に、刑事の方が先に答えを出したからだ。"}, {"t": 674.5666666666667, "x": "被害者たちは、詐欺で告訴した。"}, {"t": 676.8, "x": "松本、長野、静岡の警察へ告訴状を持って行った。"}, {"t": 680.5666666666667, "x": "1973年2月、熊本地検は結論を出した。不起訴だ。"}, {"t": 685.3833333333333, "x": "どうして！　あんなに損をした人がいるのに。"}, {"t": 688.0666666666667, "x": "詐欺には、相手に思い違いをさせることが要る。"}, {"t": 690.8666666666667, "x": "その思い違いで金を渡した、という流れを立証する。"}, {"t": 694.2, "x": "法務省の説明は「十分な\n確信を得るに至らなかった」だ。"}, {"t": 698.0833333333334, "x": "検察審査会も不起訴相当と判断したと聞く、と答えた。"}, {"t": 702.0, "x": "警察が手を付けた詐欺の捜査は6件あった。"}, {"t": 704.9166666666666, "x": "その6件は？"}, {"t": 706.0666666666667, "x": "全部不起訴だ。"}, {"t": 707.15, "x": "ここで、ある検事の話が出てくる。"}, {"t": 709.4333333333333, "x": "法務省の刑事課長が、\n1977年の国会で打ち明けた体験だ。"}, {"t": 714.2833333333333, "x": "彼は東京地検の特捜部で、\nねずみ講の事件を担当した。"}, {"t": 718.1166666666667, "x": "数十人の会員から直接話を聞いている。"}, {"t": 720.9833333333333, "x": "一番聞きたかったのは、入った動機だそうだ。"}, {"t": 723.8833333333333, "x": "成り立つものではないと、分かって入ったのか。"}, {"t": 726.6166666666667, "x": "大体の人の答えはこうだった。"}, {"t": 728.6666666666666, "x": "「知っておりました。」"}, {"t": 729.9333333333333, "x": "えっ、知ってたの？"}, {"t": 731.3, "x": "ではなぜ入ったのか。"}, {"t": 732.5166666666667, "x": "彼はさらに聞いた。"}, {"t": 733.8, "x": "自分だけはうまくもうかるのではないか。"}, {"t": 736.0333333333333, "x": "万が一を当てにした、という答えだった。"}, {"t": 738.65, "x": "ああ……それは分かるかも。"}, {"t": 740.2833333333333, "x": "もちろん全員ではない。"}, {"t": 741.5166666666667, "x": "信じ切って入った人も大勢いた。"}, {"t": 743.75, "x": "ただ、思い違いをしていないなら詐欺とは言いにくい。"}, {"t": 746.65, "x": "この壁に、被害者の側は強く反発した。"}, {"t": 749.6, "x": "弁護士は「検察庁はこれに\nひっかかってしまった」と語っている。"}, {"t": 754.2833333333333, "x": "元を取れた人は、どれくらいいたの？"}, {"t": 756.6333333333333, "x": "先ほどの検事は、聞いた範囲の数字を挙げている。"}, {"t": 759.6166666666667, "x": "ほぼ20人から30人に1人の割合だった。"}, {"t": 762.5833333333334, "x": "彼はその人に、もうかる秘訣を尋ねた。"}, {"t": 765.2666666666667, "x": "答えは、子の尻をたたいて孫を、\n孫からひ孫を作らせること。"}, {"t": 769.1666666666666, "x": "四六時中、不眠不休で数か月走り回ったそうだ。"}, {"t": 772.7166666666667, "x": "それ、もう仕事じゃない。"}, {"t": 774.35, "x": "本人も、覚めてから考えたという。"}, {"t": 776.7, "x": "その努力を本業に向ければ10倍も\n20倍も得られたはずだと。"}, {"t": 780.3833333333333, "x": "そして「もうこりごりです」と言った。"}, {"t": 782.8166666666667, "x": "もうかった人でも、こりごりなのね。"}, {"t": 785.1333333333333, "x": "検事はこの人たちを、こう表現している。"}, {"t": 787.7333333333333, "x": "「被害者が加害者に転化した」方々だと。"}, {"t": 790.7, "x": "被害者が加害者に……。"}, {"t": 792.2, "x": "ここが、ねずみ講の一番嫌なところだ。"}, {"t": 794.75, "x": "取り戻そうとすれば、次の人を誘うしかない。"}, {"t": 797.65, "x": "誘えば、その人を損の場所へ立たせることになる。"}, {"t": 800.75, "x": "弁護士の心証は、また別の数字だった。"}, {"t": 803.4666666666667, "x": "宣伝どおりの額を得た人は、\n10万人か20万人に1人だという。"}, {"t": 807.8166666666667, "x": "どっちが本当なの？"}, {"t": 809.2666666666667, "x": "見ている所が別だ。検事は元を取った人を数えた。"}, {"t": 812.6666666666666, "x": "弁護士は、約束の満額をもらった人を言っている。"}, {"t": 815.8666666666667, "x": "どちらにしても、全員に届く計算ではない。"}, {"t": 819.3333333333334, "x": "では他の法律はどうか。"}, {"t": 820.8, "x": "一つずつ当たってみる。"}, {"t": 822.3333333333334, "x": "最初は出資法だ。金を預かる行為を取り締まる。"}, {"t": 825.5, "x": "それなら使えそうじゃない。"}, {"t": 827.1333333333333, "x": "ねずみ講には二つの型があった。"}, {"t": 829.2166666666667, "x": "先輩への金を本部が預かる型。これが会主導型だ。"}, {"t": 832.7833333333333, "x": "預かるのだから、出資法の違反で検挙できる。"}, {"t": 835.7166666666667, "x": "警察は1977年の1年で、11の組織を検挙している。"}, {"t": 840.5666666666667, "x": "じゃあ天下一家も？"}, {"t": 841.85, "x": "こちらは会員主導型だった。"}, {"t": 843.7666666666667, "x": "思い出してくれ。50万円は人から人へ直接送る。"}, {"t": 847.3166666666667, "x": "本部は入会金を受け取るだけで、預かってはいない。"}, {"t": 850.5166666666667, "x": "あっ、だから直接送らせていたの！"}, {"t": 852.9666666666667, "x": "結果として、そこが抜け穴になった。"}, {"t": 855.4, "x": "警察庁の課長も、規制できないタイプだと答えている。"}, {"t": 858.8333333333334, "x": "次は賭博だ。もうけは運次第に見える。"}, {"t": 861.3, "x": "だが法務省は、これも違うと答えた。"}, {"t": 863.75, "x": "賭博は偶然で決まる。ねずみ講は\n本人の努力で決まる。"}, {"t": 867.35, "x": "努力！？　人を誘う努力のこと？"}, {"t": 869.6333333333333, "x": "そう。「われわれの日常の仕事と\n同じ面もある」と課長は言った。"}, {"t": 873.5333333333333, "x": "一緒にすると失礼かもしれない、と本人も添えている。"}, {"t": 876.7833333333333, "x": "では全部まとめて罰する法律を作ればいいのか。"}, {"t": 879.65, "x": "これにも課長は疑問を述べた。"}, {"t": 881.4833333333333, "x": "末端まで含めると、200万人近くを巻き込む罪になる。"}, {"t": 885.4, "x": "被害者まで罰することになっちゃうのか。"}, {"t": 887.85, "x": "こうして穴は埋まらないまま、年月だけが過ぎた。"}, {"t": 890.8666666666667, "x": "ただ一つ、効いた法律があった。税法だ。"}, {"t": 893.7333333333333, "x": "1972年3月、所得税法違反で起訴された。"}, {"t": 897.7, "x": "免れたとされた税額は、\n1970年分で約19億6500万円だ。"}, {"t": 903.2666666666667, "x": "詐欺じゃなくて、税金なのね。"}, {"t": 905.35, "x": "そう。刑事で問えたのは、最初から税金だった。"}, {"t": 909.0166666666667, "x": "起訴されても、勧誘は止まらなかった。"}, {"t": 911.45, "x": "それどころか、会は新しい看板を手に入れた。"}, {"t": 914.4, "x": "看板？"}, {"t": 915.5333333333333, "x": "財団法人だ。"}, {"t": 916.6833333333333, "x": "当時の財団法人は、役所の許可がないと\n作れない公益の団体だ。"}, {"t": 921.0166666666667, "x": "弁護士の話では、会は\n公益法人になりたかったが許可されなかった。"}, {"t": 925.3666666666667, "x": "そこで目を付けたのが、\n熊本の財団法人肥後厚生会だ。"}, {"t": 929.2, "x": "1947年5月1日に許可された、\n戦災者を援護する団体だった。"}, {"t": 934.3666666666667, "x": "ところが活動をやめて、20年も眠っていた。"}, {"t": 937.45, "x": "眠っていた団体を、どうしたの？"}, {"t": 939.6333333333333, "x": "1973年5月。会長が役員に入った。"}, {"t": 943.2833333333333, "x": "名前を財団法人天下一家の会へ\n変える登記が申請された。"}, {"t": 947.0333333333333, "x": "資産も書き換えられた。もとは18万円だった。"}, {"t": 950.2833333333333, "x": "それがいくらに？"}, {"t": 951.4333333333333, "x": "12億8000万円だ。"}, {"t": 953.0666666666667, "x": "名前の変更には、県知事の許可が要る。"}, {"t": 955.6, "x": "だが熊本県は許可を出していなかった。"}, {"t": 958.2, "x": "じゃあ、どうして登記できたの？"}, {"t": 960.1166666666667, "x": "議員の追及では、添えた書類がにせものだった。"}, {"t": 963.0833333333334, "x": "別の議員の言葉では「乗っ取られておる」状態だ。"}, {"t": 966.4333333333333, "x": "眠っている財団を乗っ取るなんて。"}, {"t": 968.55, "x": "弁護士は法廷で、財団の目的を\n一つずつ質問している。"}, {"t": 972.4666666666667, "x": "目的は十数項目あり、福祉の事業も書いてある。"}, {"t": 975.7333333333333, "x": "この点の事業はどうだ。それは将来やる見込みです。"}, {"t": 978.85, "x": "一つとしてやっていなかった、と弁護士は語っている。"}, {"t": 982.6833333333333, "x": "この看板は、勧誘の場で大きな力を発揮した。"}, {"t": 985.9, "x": "1977年2月11日。"}, {"t": 988.4333333333333, "x": "東京の九段に会館が開かれた。"}, {"t": 990.7333333333333, "x": "靖国神社の境内に隣接する土地だ。"}, {"t": 993.35, "x": "建物は10階建て。上には\n財団法人天下一家の会の文字。"}, {"t": 997.4666666666667, "x": "東京のど真ん中じゃない！"}, {"t": 999.1333333333333, "x": "財団法人は国が許可した団体だ。"}, {"t": 1001.4333333333333, "x": "国が認めた助け合い運動だ。"}, {"t": 1003.5, "x": "勧誘の言葉はそうだったと、議員たちが伝えている。"}, {"t": 1006.6833333333333, "x": "議員に届いた被害の訴えの多くが、\n同じことを書いていた。"}, {"t": 1010.3, "x": "財団法人と言われたので安心して入った、と。"}, {"t": 1013.4333333333333, "x": "それは信じちゃうわよ。"}, {"t": 1014.8833333333333, "x": "機関誌はさらに踏み込んでいた。"}, {"t": 1016.7666666666667, "x": "「本当に詐欺なんかであるものとするならば、\n国家が財団法人や宗教法人として認めるかい」"}, {"t": 1022.4666666666667, "x": "うまいこと言うわね。"}, {"t": 1023.7166666666667, "x": "勧誘を担う人も組織になっていた。"}, {"t": 1026.1166666666666, "x": "思想普及員という名前で、全国に1300人あまりいた。"}, {"t": 1030.0166666666667, "x": "思想？　お金の話なのに？"}, {"t": 1032.0166666666667, "x": "議員はセールスマンと呼んでいる。"}, {"t": 1033.7666666666667, "x": "研究しない研究所。事業をしない財団。"}, {"t": 1036.35, "x": "勧誘する思想普及員。"}, {"t": 1038.1, "x": "名前だけ、ってさっき言ってた話ね。"}, {"t": 1040.5666666666666, "x": "入る人の前にあったのは、中身ではなく看板だった。"}, {"t": 1043.95, "x": "これを責めるのは難しい。"}, {"t": 1045.4666666666667, "x": "国の役所の登記簿に、そう書いてあったのだから。"}, {"t": 1049.0833333333333, "x": "看板はもう一枚あった。"}, {"t": 1050.7, "x": "1973年11月24日、宗教法人大観宮が設立された。"}, {"t": 1056.0833333333333, "x": "事務所の登録は阿蘇。"}, {"t": 1057.3666666666666, "x": "代表役員は同じ内村健一だ。"}, {"t": 1059.75, "x": "こうして三つの組織が並んだ。"}, {"t": 1061.7833333333333, "x": "ねずみ講の本部。財団法人。宗教法人。"}, {"t": 1064.8, "x": "チラシには「心」「和」\n「救け合い」と書かれていた。"}, {"t": 1068.1166666666666, "x": "議員はこれを「三位一体」と\n呼び、判決も同じだと指摘した。"}, {"t": 1072.3666666666666, "x": "お金はどう動いていたの？"}, {"t": 1074.0166666666667, "x": "入会金の4分の1が、財団か\n宗教法人へ寄付される形になった。"}, {"t": 1078.65, "x": "残り4分の3が本部に入る。"}, {"t": 1080.7333333333333, "x": "財団の1976年3月末の資産は、47億2325万円あまり。"}, {"t": 1086.85, "x": "負債はゼロだ。本部の事業概要にそう書いてある。"}, {"t": 1090.0, "x": "4分の1だけで47億！"}, {"t": 1092.1833333333334, "x": "国税庁は、本部が受け取る時点で\n全額に課税していると答えた。"}, {"t": 1096.3, "x": "ただ財団の名前の変更は無効だった。"}, {"t": 1098.8, "x": "法律上は存在しないはずの団体に、\n金が積み上がっていた。"}, {"t": 1102.7166666666667, "x": "存在しない団体に47億円……。"}, {"t": 1105.1666666666667, "x": "国税庁の長官も、翌年の国会で説明に苦しんでいる。"}, {"t": 1109.1166666666666, "x": "受け取った寄付金が一体何なのか、\n課税上問題になっていると。"}, {"t": 1113.7166666666667, "x": "会長個人はどれくらいもうけていたの？"}, {"t": 1116.0833333333333, "x": "1977年5月に発表された高額所得者の番付に載った。"}, {"t": 1120.85, "x": "全国で39位。前の年の所得は2億7770万円だ。"}, {"t": 1125.6, "x": "弁護士によると、月給は1000万円だった。"}, {"t": 1128.3166666666666, "x": "月給1000万円の日本人は、\n彼以外にいないのではと語っている。"}, {"t": 1132.3833333333334, "x": "それって、会のお金じゃないの？"}, {"t": 1134.45, "x": "長野の判決が挙げた\n理由の一つが、そこに触れている。"}, {"t": 1137.9333333333334, "x": "入会金でヘリコプターや高級自動車を買っていた。"}, {"t": 1140.9666666666667, "x": "現金を積んで見せたという報道もあった。"}, {"t": 1143.3666666666666, "x": "議員は「七十五億円も現ナマを机の上に\n積んで誇示した」と紹介した。"}, {"t": 1148.1666666666667, "x": "机の上に75億！？"}, {"t": 1149.9333333333334, "x": "報道された話として、国会の記録に残っている。"}, {"t": 1153.2833333333333, "x": "会長の言い分も聞いておく。"}, {"t": 1154.9666666666667, "x": "政府が「ネズミ講にご用心」と\n新聞広告を出した時のことだ。"}, {"t": 1159.1333333333334, "x": "まことに結構だ、と言ったと議員が紹介した。"}, {"t": 1162.1833333333334, "x": "えっ、結構なの？"}, {"t": 1163.6166666666666, "x": "あの広告は天下一家とは言っていない。"}, {"t": 1165.8833333333334, "x": "類似のにせものが整理されてよい、という理屈だ。"}, {"t": 1168.9, "x": "自分はねずみ講じゃないって言うのね。"}, {"t": 1171.0666666666666, "x": "勧誘の現場でも\n「断じてネズミ講ではない」と説明された。"}, {"t": 1174.8833333333334, "x": "そう言われて入った人の手紙が、\n国会で読み上げられている。"}, {"t": 1179.0666666666666, "x": "1976年の秋。会は創立10周年の大会を開いた。"}, {"t": 1183.55, "x": "場所は東京の日本武道館だ。"}, {"t": 1185.5333333333333, "x": "ある議員の話では、集まったのは1万3000人。"}, {"t": 1188.8333333333333, "x": "武道館に1万3000人！？"}, {"t": 1190.7166666666667, "x": "会の新聞は「日本武道館にうねる大活力」と書いた。"}, {"t": 1194.4333333333334, "x": "この種の大会には、\n現職の国会議員も姿を見せていた。"}, {"t": 1198.2666666666667, "x": "祝辞を述べたことが、委員会で\n名前つきで指摘されている。"}, {"t": 1201.85, "x": "今回は個人の名前は言わない。"}, {"t": 1203.85, "x": "議員さんは、知ってて行ったのかな？"}, {"t": 1206.1166666666666, "x": "そこは分からない。本人たちの事情は記録に無い。"}, {"t": 1209.15, "x": "確かなのは、それが勧誘に使われたことだ。"}, {"t": 1212.0, "x": "大会の写真やインタビューが、本や宣伝物に載った。"}, {"t": 1215.3333333333333, "x": "参考人が読み上げた手紙にこうある。"}, {"t": 1217.5833333333333, "x": "知っている人の名前がいっぱい\n出てきたので安心して入会した。"}, {"t": 1221.4166666666667, "x": "財団法人に、国会議員に……。"}, {"t": 1223.6333333333334, "x": "安心の材料が、ひとそろい用意されていた。"}, {"t": 1226.35, "x": "官房長官の答えは、\n議員それぞれの良識の問題だった。"}, {"t": 1230.0666666666666, "x": "弁護士は当時、こう語っている。"}, {"t": 1232.1166666666666, "x": "ロッキードにまさるとも劣らないものではないか、と。"}, {"t": 1235.0, "x": "個人的な考えだと本人も断っている。"}, {"t": 1237.7333333333333, "x": "ただ、当事者はそれだけの規模だと感じていた。"}, {"t": 1241.2333333333333, "x": "1977年3月30日。ついに判決の日が来た。"}, {"t": 1245.5666666666666, "x": "提訴から5年。長野地方裁判所だ。"}, {"t": 1248.1166666666666, "x": "裁判所は、講の組織は\n民法90条の公序良俗に反して無効だとした。"}, {"t": 1253.0166666666667, "x": "公序良俗？"}, {"t": 1254.1666666666667, "x": "世の中の秩序や、まともな道徳に反するという意味だ。"}, {"t": 1257.65, "x": "法律に禁止と書いていなくても、無効にできる条文だ。"}, {"t": 1261.1, "x": "国会では、理由が5つ紹介された。"}, {"t": 1263.6166666666666, "x": "一つ目。人数には必ず限界が来る。"}, {"t": 1266.3, "x": "二つ目。何も生み出さず、早い\n者勝ちで賭博の性質が強い。"}, {"t": 1270.3666666666666, "x": "三つ目。詐欺的な誇大宣伝をしている。"}, {"t": 1273.0333333333333, "x": "四つ目。射幸心をあおり、人間関係を壊す。"}, {"t": 1276.2166666666667, "x": "五つ目が、さっきのヘリコプターと高級自動車だ。"}, {"t": 1279.5166666666667, "x": "ぜんぶ言ってくれた感じ！"}, {"t": 1281.1, "x": "これは内村個人の事業である、とも判断された。"}, {"t": 1284.1833333333334, "x": "看板をいくら増やしても、裁判所は中身を見た。"}, {"t": 1287.25, "x": "命じられた返還は、520人に2287万円だ。"}, {"t": 1291.65, "x": "1人あたりにすると、いくら？"}, {"t": 1293.65, "x": "計算すると、1人4万4000円ほどになる。"}, {"t": 1296.65, "x": "これは入会金の分だけで、\n他の会員へ送った金は入らない。"}, {"t": 1300.5333333333333, "x": "法務省の刑事局長も、注目に値する判決だと答えた。"}, {"t": 1304.6833333333334, "x": "これで終わったんじゃないの？"}, {"t": 1306.25, "x": "終わらなかった。会長の側は控訴した。"}, {"t": 1308.7833333333333, "x": "民事の判決は、訴えた人の分にしか届かない。"}, {"t": 1312.1, "x": "本部はたかをくくっている、と弁護士は語った。"}, {"t": 1314.9166666666667, "x": "止めるには、やはり法律が要る。"}, {"t": 1316.95, "x": "男は国会で、全国から届いた手紙の一節を読んだ。"}, {"t": 1320.5833333333333, "x": "「天下一家の被害者はもう私丈で沢山です。」"}, {"t": 1324.2333333333333, "x": "それで国はすぐ法律を作ったの？"}, {"t": 1326.5, "x": "ここからが、この事件の一番長いところだ。"}, {"t": 1329.3333333333333, "x": "政府が動いたのは1974年10月8日に始まる。"}, {"t": 1333.15, "x": "総理大臣が座長の消費者保護会議だ。"}, {"t": 1335.7, "x": "法的な規制を検討すると決めた。"}, {"t": 1337.9833333333333, "x": "翌年も、その翌年も、会議はこの問題を取り上げた。"}, {"t": 1341.6833333333334, "x": "1976年の決定にはこうある。"}, {"t": 1344.4166666666667, "x": "「早急に出資法の改正を含め新規立法を検討する。」"}, {"t": 1348.0333333333333, "x": "早急に、って書いてあるじゃない。"}, {"t": 1349.9666666666667, "x": "書いてある。関係する7つの省庁が6回協議した。"}, {"t": 1353.3333333333333, "x": "だが結論が出ない。"}, {"t": 1354.65, "x": "1977年10月の国会で議員は\n驚くべきことを言っている。"}, {"t": 1359.0166666666667, "x": "どこが担当の役所なのかさえ、まだ決まっていない。"}, {"t": 1362.2333333333333, "x": "3年たって、担当も決まってないの？"}, {"t": 1364.7833333333333, "x": "経済企画庁の長官は、率直にこう答えていた。"}, {"t": 1368.1666666666667, "x": "立法の話になると「また振り出しに戻って」しまう。"}, {"t": 1371.65, "x": "1978年3月の参議院で、\n別の議員がしびれを切らした。"}, {"t": 1376.2333333333333, "x": "「いまだに法律のほの字も出てこない」"}, {"t": 1378.4666666666667, "x": "ほの字……。"}, {"t": 1379.6, "x": "民間には昔から、頼母子講という助け合いがある。"}, {"t": 1382.8666666666666, "x": "これと区別する書き方が\n難しい、というのが理由の一つだった。"}, {"t": 1386.9333333333334, "x": "ちゃんと理由はあるのね。"}, {"t": 1388.4166666666667, "x": "ある。ただ待っている間も、封筒は飛び続けていた。"}, {"t": 1391.6666666666667, "x": "ある議員の試算では、本部に入る日銭は5000万円。"}, {"t": 1394.9166666666667, "x": "動いている金は1000億円になるはずだという。"}, {"t": 1398.1, "x": "1978年3月24日。"}, {"t": 1400.75, "x": "参議院の予算委員会。"}, {"t": 1402.3666666666666, "x": "法務大臣と議員のやり取りが山場になった。"}, {"t": 1405.0166666666667, "x": "議員は、詐欺に問えないのかと尋ねた。"}, {"t": 1407.4166666666667, "x": "大臣はまず、率直に申し上げると前置きした。"}, {"t": 1410.4833333333333, "x": "事情を知って入ったのなら、競馬を\n買ったのと同じようなものだ。"}, {"t": 1414.2666666666667, "x": "競馬と同じって言っちゃうの？"}, {"t": 1416.05, "x": "そして、こう続けた。"}, {"t": 1417.5833333333333, "x": "「途中までは必ずもうけるんです。」"}, {"t": 1419.5833333333333, "x": "「途中までもうけますから、どの段階で\n詐欺になるのかということは非常に問題になる」"}, {"t": 1424.6166666666666, "x": "うーん、そう言われるとそうかも。"}, {"t": 1426.5, "x": "犯罪の線を引く難しさを言った答弁だ。"}, {"t": 1429.1666666666667, "x": "さらに大臣は、国民に向けて言った。"}, {"t": 1431.65, "x": "「そういうものを相手にしないということを\nひとつ国民の皆さんも考えてもらいたい」"}, {"t": 1436.2833333333333, "x": "それは、ちょっと……。"}, {"t": 1437.55, "x": "議員は怒った。"}, {"t": 1438.6, "x": "「だまかされた方が悪いなんて、\nそんなの答弁になるかい」"}, {"t": 1441.9666666666667, "x": "国が財団法人の登記を\n認めたではないか、とも迫っている。"}, {"t": 1445.8666666666666, "x": "確かに、登記をしたのは国の役所だものね。"}, {"t": 1448.8666666666666, "x": "大臣も、法律の穴があることは認めていた。"}, {"t": 1451.8166666666666, "x": "財団法人の名を勝手に使っても、\n罰する規定が無いのだ。"}, {"t": 1455.5833333333333, "x": "4か月前の法務委員会では、大臣はこう言っていた。"}, {"t": 1458.9333333333334, "x": "内容をつまびらかにしておらないのは遺憾だ、と。"}, {"t": 1461.7666666666667, "x": "それほど急に、ねずみ講が国の問題になっていた。"}, {"t": 1465.5666666666666, "x": "看板の話の続きをする。"}, {"t": 1467.4333333333334, "x": "1977年10月の小委員会で、\n議員が登記簿を突きつけた。"}, {"t": 1472.0166666666667, "x": "財団法人天下一家の会は、\n法律上存在しないのではないか。"}, {"t": 1476.2666666666667, "x": "役所は認めたの？"}, {"t": 1477.7, "x": "認めた。その年の終わりごろ、\n登記は職権で抹消された。"}, {"t": 1481.5166666666667, "x": "名称の変更も理事の交代も、資産の変更も全部だ。"}, {"t": 1485.25, "x": "やった！　これで財団法人じゃなくなったのね。"}, {"t": 1488.1166666666666, "x": "登記簿の上ではそうなった。"}, {"t": 1489.75, "x": "ところが九段の看板はそのままだった。"}, {"t": 1492.1666666666667, "x": "翌年の国会で、議員はグラビアを持ち出している。"}, {"t": 1495.2333333333333, "x": "りっぱな看板が今も上がっているではないか。"}, {"t": 1497.7666666666667, "x": "大臣の答えは、これは良識の問題だった。"}, {"t": 1500.8, "x": "ずるい！　看板だけ残るの？"}, {"t": 1502.7166666666667, "x": "残った。1978年6月の国会でも、\nまだ掲げられていた。"}, {"t": 1507.6, "x": "若い人の勧誘に、それがまた使われていた。"}, {"t": 1510.6666666666667, "x": "若い人？"}, {"t": 1511.8, "x": "ここで話は大学に飛ぶ。"}, {"t": 1514.2333333333333, "x": "1978年。ねずみ講は京都の大学に広がっていた。"}, {"t": 1518.4166666666667, "x": "ある大学では運動部から始まったと報告されている。"}, {"t": 1521.6166666666666, "x": "先輩と後輩の関係は、断りにくい。"}, {"t": 1524.25, "x": "学生1万5000人のうち、\n1割の千数百人が入ったと推定された。"}, {"t": 1529.0833333333333, "x": "千人以上も！？"}, {"t": 1530.25, "x": "学生にそんな金は無い。そこでサラ金が出てくる。"}, {"t": 1533.4, "x": "学生証1枚で30万円を借りる。"}, {"t": 1535.85, "x": "30万円で1650万円になると聞かされて入る。"}, {"t": 1539.45, "x": "ひっかかったが最後、勉強が手につかない。"}, {"t": 1542.1333333333334, "x": "夏休みもアルバイトで、国へ帰らなかった学生がいた。"}, {"t": 1545.7, "x": "かわいそうに。"}, {"t": 1546.8333333333333, "x": "子の会員を作れず、家出した\n高校生の例も警察が報告している。"}, {"t": 1551.0333333333333, "x": "飛び火は速かった。大阪、\n兵庫、滋賀、愛知、岐阜へ。"}, {"t": 1554.8833333333334, "x": "京都と滋賀を中心に、35の大学の学長が動いた。"}, {"t": 1558.6166666666666, "x": "署名と捺印をつけて、ねずみ講の禁止を求めたのだ。"}, {"t": 1562.0833333333333, "x": "政府の案を待っていては間に合わない。"}, {"t": 1564.1166666666666, "x": "議員たちは、自分たちで法律を書くことにした。"}, {"t": 1567.7666666666667, "x": "舞台は衆議院の物価問題等に関する特別委員会だ。"}, {"t": 1571.3666666666666, "x": "1977年6月7日に小委員会ができていた。"}, {"t": 1575.2333333333333, "x": "委員会を5回、小委員会を9回重ねた。"}, {"t": 1578.05, "x": "1978年10月11日、党派を超えた案がまとまった。"}, {"t": 1582.5, "x": "法律には、新しい名前が付いた。"}, {"t": 1584.8, "x": "無限連鎖講の防止に関する法律。"}, {"t": 1587.2666666666667, "x": "むげんれんさこう？　かっこいい名前じゃない。"}, {"t": 1589.65, "x": "ねずみ講の、法律での名前だ。"}, {"t": 1591.7666666666667, "x": "第2条の定義がよくできている。"}, {"t": 1593.7333333333333, "x": "「一定額の金銭を支出する加入者が\n無限に増加するものであるとして」"}, {"t": 1598.15, "x": "「あるとして」？"}, {"t": 1599.2833333333333, "x": "無限に増えると称していれば当たる、という書き方だ。"}, {"t": 1602.35, "x": "そして二以上の倍率で増える、と条文に入れた。"}, {"t": 1605.2333333333333, "x": "掛け算そのものを、法律の言葉にしたのだ。"}, {"t": 1608.0666666666666, "x": "これで頼母子講とも区別がつく。"}, {"t": 1610.1833333333334, "x": "第1条には、もっとはっきり書いてある。"}, {"t": 1612.65, "x": "「終局において破たんすべき性質のもの」"}, {"t": 1615.3166666666666, "x": "法律が、必ずつぶれると言ってるの？"}, {"t": 1617.8666666666666, "x": "そうだ。かけ算の答えを、国が条文に書いた。"}, {"t": 1620.8833333333334, "x": "開設や運営は、3年以下の懲役か300万円以下の罰金。"}, {"t": 1624.9, "x": "勧誘も罰せられ、入ること自体も禁止された。"}, {"t": 1627.9333333333334, "x": "だまされたかどうかを問わずに、\n止められるようになったのだ。"}, {"t": 1631.2666666666667, "x": "会は黙ってたの？"}, {"t": 1632.6333333333334, "x": "審議のころ、天下一家の会から請願書が届いた。"}, {"t": 1635.8833333333334, "x": "無限の加入者は要らない、という内容だ。"}, {"t": 1638.3333333333333, "x": "議員の紹介では「\n会員数五百万人くらいで円軌道を描く」。"}, {"t": 1642.25, "x": "えんきどう？"}, {"t": 1643.3666666666666, "x": "同じ人が再加入を繰り返して、\nぐるぐる回るという理屈だ。"}, {"t": 1647.1166666666666, "x": "衆議院の法制局は、それでも該当すると答えた。"}, {"t": 1650.5833333333333, "x": "逃げ道をふさいだのね。"}, {"t": 1652.1833333333334, "x": "法律は1978年11月11日に公布された。"}, {"t": 1656.3333333333333, "x": "1967年3月の開始から、11年8か月がたっていた。"}, {"t": 1661.7333333333333, "x": "ただし、法律には猶予が付いた。"}, {"t": 1663.8833333333334, "x": "施行は、公布の日から6か月を過ぎてからだ。"}, {"t": 1666.7833333333333, "x": "議員たちが一番恐れたのは、駆け込みの勧誘だ。"}, {"t": 1669.9, "x": "止まる前に取り返そうと、\n末端の人が死にもの狂いで誘う。"}, {"t": 1673.85, "x": "財産はどうなるの？"}, {"t": 1675.2333333333333, "x": "1977年9月8日、会は総会で決めていた。"}, {"t": 1679.1333333333334, "x": "資産を宗教法人の大観宮の名義にする、と。"}, {"t": 1682.2333333333333, "x": "全国20か所ほどの保養所の看板が、\n大観宮に変わっていった。"}, {"t": 1686.4333333333334, "x": "ある議員は委員会で、印象深いたとえを使った。"}, {"t": 1689.4, "x": "ネズミはもぬけの殻で、親ネズミはよそへ行っている。"}, {"t": 1692.4166666666667, "x": "残るのは、子ネズミとやせネズミだけだ。"}, {"t": 1695.0, "x": "うまいこと言うけど、笑えないわね。"}, {"t": 1697.2, "x": "大観宮は「太子講」というものも始めていた。"}, {"t": 1700.2666666666667, "x": "5万円を出して、264万円を受け取る仕組みだ。"}, {"t": 1703.95, "x": "それって同じじゃない！"}, {"t": 1705.35, "x": "法務省の担当者も、個人の見解として\n該当するだろうと答えた。"}, {"t": 1709.5666666666666, "x": "会長は新聞にこう語っていたと、議員が紹介している。"}, {"t": 1713.0666666666666, "x": "机上の計算はそうなるが、うちの講は\n無限連鎖講にならない。"}, {"t": 1716.75, "x": "国が講を禁止させるのだから、国が責任を取るべきだ。"}, {"t": 1720.4166666666667, "x": "まだ言ってる！"}, {"t": 1721.55, "x": "1979年4月11日。ついにねずみ講の終結宣言が出た。"}, {"t": 1726.4833333333333, "x": "翌月、法律が施行された。"}, {"t": 1728.6, "x": "施行の翌日、熊本県の職員が大観宮を訪ねている。"}, {"t": 1732.4166666666667, "x": "太子講は今後一切行わない。そう回答があった。"}, {"t": 1735.7333333333333, "x": "これで本当に終わり？"}, {"t": 1737.1333333333334, "x": "ところが5月21日の朝日新聞が、別の話を伝えた。"}, {"t": 1741.25, "x": "「天下一家の会の被害者を救う」と\n称する新しい会が出たのだ。"}, {"t": 1745.3666666666666, "x": "被害者を救う会が、また同じことを？"}, {"t": 1747.9166666666667, "x": "文面まで、うり二つだったと議員は怒っている。"}, {"t": 1750.85, "x": "人口は将来に向かって無限である、と書いてあった。"}, {"t": 1754.6, "x": "1980年。内村健一は破産した。"}, {"t": 1757.7666666666667, "x": "報じられた債務は約1896億円だ。"}, {"t": 1760.9333333333334, "x": "その前の年、破産を求めて\n本部に立ち入りが行われている。"}, {"t": 1764.6666666666667, "x": "建物の中に、ほとんど財産は無かったと議員は語った。"}, {"t": 1768.4166666666667, "x": "先に移しちゃってたのね。"}, {"t": 1770.2, "x": "会員は最終的に、約102万人と報じられた。"}, {"t": 1773.5166666666667, "x": "ただし資料によって数字は違う。"}, {"t": 1775.5333333333333, "x": "1970年の国会では公称120万人。"}, {"t": 1778.9166666666667, "x": "公称80万人と書く人名事典もあり、\n150万人という説もあった。"}, {"t": 1783.7833333333333, "x": "全然そろわないのね。"}, {"t": 1785.3333333333333, "x": "入り直す人もいるから、数え方も難しい。"}, {"t": 1788.25, "x": "刑事の裁判も決着がついた。"}, {"t": 1790.35, "x": "20世紀日本人名事典によると、\n1983年7月に脱税で罰金7億円の判決。"}, {"t": 1797.0333333333333, "x": "7億円も払えたの？"}, {"t": 1798.6333333333334, "x": "払わずに、刑務所に入る道を選んだと書かれている。"}, {"t": 1801.7833333333333, "x": "懲役の年数は資料によって書き方が\n違うので、ここでは言わない。"}, {"t": 1805.7666666666667, "x": "1985年5月、刑の執行が止められて病院に入った。"}, {"t": 1810.1, "x": "そして1995年1月2日に亡くなった。"}, {"t": 1813.6333333333334, "x": "詐欺の罪には問われないまま？"}, {"t": 1815.5166666666667, "x": "問われないままだ。無限連鎖講の法律も、\nさかのぼっては使えない。"}, {"t": 1819.65, "x": "作られた法律は、これから先のためのものだった。"}, {"t": 1823.4333333333334, "x": "ここで少し時間を戻す。"}, {"t": 1825.15, "x": "1978年10月11日。"}, {"t": 1827.7666666666667, "x": "案を決めた、あの小委員会だ。"}, {"t": 1829.85, "x": "条文は「金銭」だ。金銭以外で逃げられないか。"}, {"t": 1833.15, "x": "そう心配する質問が出ている。"}, {"t": 1835.25, "x": "たとえば何？"}, {"t": 1836.3833333333334, "x": "土地の権利証や国債だ。"}, {"t": 1838.15, "x": "法務省の刑事課長は、こう答えた。"}, {"t": 1840.5166666666667, "x": "「国債をもって金銭にかえるという\nふうなやり方ではこれはとうていやっていけない」"}, {"t": 1844.9333333333334, "x": "国債じゃ無理って言ったのね。"}, {"t": 1846.7833333333333, "x": "ただし課長は、一言添えている。"}, {"t": 1848.9833333333333, "x": "これは「法律と人間との知恵比べ」でございます、と。"}, {"t": 1852.6666666666667, "x": "なんだか嫌な予感がする。"}, {"t": 1854.4166666666667, "x": "10年後の1988年2月23日。"}, {"t": 1857.6833333333334, "x": "衆議院の予算委員会。"}, {"t": 1859.2833333333333, "x": "あの法律づくりに加わった議員が立ち上がった。"}, {"t": 1862.05, "x": "30万円の元手の国債で、\n300万円の国債が返ってくる。"}, {"t": 1866.35, "x": "そういう会が現れたのだ。"}, {"t": 1868.1, "x": "本当に国債で！？"}, {"t": 1869.5333333333333, "x": "法務省の局長は答えた。"}, {"t": 1871.3333333333333, "x": "国債が金銭と言えるかには問題があろうかと。"}, {"t": 1874.1833333333334, "x": "法律はすぐ直された。"}, {"t": 1875.5666666666666, "x": "1988年の改正だ。"}, {"t": 1878.0166666666667, "x": "有価証券や貴金属まで広げ、\n「金銭」は「金品」になった。"}, {"t": 1882.2833333333333, "x": "委員会では、議員席から声が飛んでいる。"}, {"t": 1884.8166666666666, "x": "「大丈夫だ、我々の議員立法だから」"}, {"t": 1887.4166666666667, "x": "今度こそ大丈夫なの？"}, {"t": 1889.0666666666666, "x": "その2年前、宝石を売る\n会社の件は不起訴になっている。"}, {"t": 1892.65, "x": "物の販売が隠れみのだとまでは、\n立証できなかったのだ。"}, {"t": 1896.25, "x": "第70回で扱った豊田商事も、この法律の後の事件だ。"}, {"t": 1900.4666666666667, "x": "形を変えて出てくるのね。"}, {"t": 1902.2833333333333, "x": "1977年の議員の言葉が、そのまま当たっていた。"}, {"t": 1906.1833333333334, "x": "「形を変えた新手のネズミが\n次から次へと出てくるのです。」"}, {"t": 1910.2666666666667, "x": "最後に、被害者の金の話をする。"}, {"t": 1912.7166666666667, "x": "破産のあと、管財人の弁護士が\n残った財産を集めることになった。"}, {"t": 1917.0833333333333, "x": "管財人って？"}, {"t": 1918.3, "x": "裁判所に選ばれて、財産を管理して分ける人だ。"}, {"t": 1921.6, "x": "被害者のために、約30件の裁判を起こした。"}, {"t": 1924.8166666666666, "x": "最後まで残ったのは、国などに\n納めた税金の裁判だった。"}, {"t": 1928.7166666666667, "x": "税金を取り返すの？"}, {"t": 1930.2166666666667, "x": "こういう理屈だ。"}, {"t": 1931.2833333333333, "x": "会長は「団体」の形にして、法人税を納めていた。"}, {"t": 1935.0666666666666, "x": "だが実態は個人の事業で、団体など無かった。"}, {"t": 1938.15, "x": "それなら法人税は無効だから、返してもらおう。"}, {"t": 1941.1666666666667, "x": "なるほど！　あの看板を逆手に取るのね。"}, {"t": 1943.7666666666667, "x": "1984年2月27日、熊本地方裁判所で\n国の課税の一部が取り消された。"}, {"t": 1949.8333333333333, "x": "ある議員は、国が返す額は\n約150億円ぐらいと見積もった。"}, {"t": 1953.7833333333333, "x": "だが国は控訴した。"}, {"t": 1955.1833333333334, "x": "議員は「取ったものは絶対返さない」のかと\n迫っている。"}, {"t": 1958.65, "x": "返還を求めた裁判は、1999年4月27日に\n福岡高等裁判所へ進んだ。"}, {"t": 1964.9833333333333, "x": "高裁は管財人を勝たせた。"}, {"t": 1966.85, "x": "この団体は、\n会長の個人事業の別の呼び名にすぎない。"}, {"t": 1970.3666666666666, "x": "課税は無効だ、という判断だ。"}, {"t": 1972.5333333333333, "x": "よかった！"}, {"t": 1973.6666666666667, "x": "ところが2004年7月13日。"}, {"t": 1975.9333333333334, "x": "最高裁判所第三小法廷。"}, {"t": 1978.0666666666666, "x": "裁判官全員一致で、これをひっくり返した。"}, {"t": 1981.1, "x": "えっ！？"}, {"t": 1982.2333333333333, "x": "理由はこうだ。外から見れば、団体の形は整っていた。"}, {"t": 1986.05, "x": "定款があり、総会があり、理事会があった。"}, {"t": 1988.8333333333333, "x": "支部で代表を選び、多数決もしている。"}, {"t": 1991.4666666666667, "x": "でも中身は違ったんでしょ？"}, {"t": 1993.2666666666667, "x": "仮に誤りでも、初めから\n外形上明らかだったとは言えない。"}, {"t": 1997.0333333333333, "x": "しかも本人が税務対策として、団体の形を作った。"}, {"t": 2000.8166666666666, "x": "判決は「高額の所得税の負担を免れた」とも\n書いている。"}, {"t": 2004.8, "x": "だから課税は当然には無効にならない。"}, {"t": 2007.25, "x": "会長が作った看板が、被害者の\nお金の前に立ちはだかったの？"}, {"t": 2011.45, "x": "結果としては、そういうことになる。"}, {"t": 2013.6, "x": "会長はもう、9年前に亡くなっていた。"}, {"t": 2016.7833333333333, "x": "2005年12月。破産の手続きが終わった。"}, {"t": 2019.8, "x": "確定した債権者は約6万7200人。"}, {"t": 2022.85, "x": "債権の総額は約220億円だ。"}, {"t": 2025.5666666666666, "x": "102万人のうちの6万7200人？"}, {"t": 2028.4166666666667, "x": "認められて記録に残ったのが、それだけだった。"}, {"t": 2031.45, "x": "1992年に約65億円の中間の配当があった。"}, {"t": 2035.55, "x": "最後に不動産などの約9億円が上乗せされた。"}, {"t": 2038.6333333333334, "x": "配当の率は34％だ。"}, {"t": 2041.0, "x": "3割ちょっと。"}, {"t": 2042.15, "x": "管財人は、大きな破産事件としては\n異例の高配当だと語った。"}, {"t": 2046.3, "x": "確定した債権が100万円なら、34万円になる計算だ。"}, {"t": 2050.5666666666666, "x": "しかも25年かかって。"}, {"t": 2052.366666666667, "x": "冒頭の封筒を思い出してくれ。"}, {"t": 2054.2833333333333, "x": "朝に2通か3通の50万円が、\n人の手から手へ飛んでいた。"}, {"t": 2058.1, "x": "それを裁判所を通して集め直すのに、25年かかった。"}, {"t": 2062.366666666667, "x": "今回使った記録をまとめて言う。"}, {"t": 2064.4666666666667, "x": "国会の記録は\n1970年12月17日の参議院大蔵委員会から始まる。"}, {"t": 2069.983333333333, "x": "参考人の話は\n1977年5月19日の衆議院の特別委員会だ。"}, {"t": 2075.3166666666666, "x": "登記の追及は同じ年の10月18日の小委員会にある。"}, {"t": 2079.1666666666665, "x": "法務大臣のやり取りは\n1978年3月24日の参議院予算委員会。"}, {"t": 2084.4, "x": "法律の審議は1978年10月11日と\n12日、18日の記録を読んだ。"}, {"t": 2090.366666666667, "x": "施行の後は1979年5月24日。"}, {"t": 2093.5666666666666, "x": "税金の裁判は1984年3月の記録だ。"}, {"t": 2097.2166666666667, "x": "国債の話は1988年2月23日と4月21日の記録だ。"}, {"t": 2102.75, "x": "最高裁の判決は、裁判所の判例検索で読める。"}, {"t": 2106.266666666667, "x": "生没年は人名事典、配当の数字は\n2005年の新聞報道だ。"}, {"t": 2110.65, "x": "はっきりしなかったことは？"}, {"t": 2112.366666666667, "x": "長野の判決の控訴審がどう終わったか。"}, {"t": 2114.883333333333, "x": "懲役の年数と執行猶予の扱いの流れ。"}, {"t": 2117.7166666666667, "x": "本当の会員数と、本当の被害総額。"}, {"t": 2120.5666666666666, "x": "分からない数字は、分からないと言っておく。"}, {"t": 2123.0666666666666, "x": "あえて言わなかったこともある。"}, {"t": 2124.7166666666667, "x": "会員だった人の名前と、祝辞を述べた議員の名前だ。"}, {"t": 2128.8166666666666, "x": "ねえ、最初の友人の話に戻っていい？"}, {"t": 2131.483333333333, "x": "いいぞ。"}, {"t": 2132.616666666667, "x": "朝晩50万円の封筒を受け取ってた人。"}, {"t": 2135.133333333333, "x": "あの人はもうかったのよね。"}, {"t": 2136.9666666666667, "x": "その時点ではな。"}, {"t": 2138.133333333333, "x": "だがその50万円は、誰かが出した60万円の一部だ。"}, {"t": 2141.8166666666666, "x": "出した人は、次の人の封筒を待っている。"}, {"t": 2144.6666666666665, "x": "次の人は、その次の人の封筒を。"}, {"t": 2147.3166666666666, "x": "封筒はいつも下から上へ向かう。"}, {"t": 2149.3, "x": "一番下にいる人だけ、出したまま受け取れない。"}, {"t": 2152.266666666667, "x": "かけ算が示していたのは、それだけのことだ。"}, {"t": 2155.233333333333, "x": "3回掛ければ分かる話だったのに。"}, {"t": 2157.65, "x": "分かっていて入った人も、確かにいた。"}, {"t": 2160.1833333333334, "x": "自分は一番下にならないだろう、と思ったのだ。"}, {"t": 2163.15, "x": "友人に頼まれて断れなかった人もいた。"}, {"t": 2165.866666666667, "x": "財団法人という看板を信じた人もいた。"}, {"t": 2168.733333333333, "x": "止める法律がなかった11年の間に、それだけの人が。"}, {"t": 2172.5833333333335, "x": "法律は最後に、はっきり書いた。"}, {"t": 2174.7166666666667, "x": "その仕組みは必ず行き詰まる、という一文だ。"}, {"t": 2177.5333333333333, "x": "教授が1971年に書いた\n論文と、同じことを言っている。"}, {"t": 2181.9166666666665, "x": "7年遅れで、法律が教授に追いついたのね。"}, {"t": 2184.9333333333334, "x": "そして被害に遭った人のもとへは、34％が届いた。"}, {"t": 2188.983333333333, "x": "一番下の人を作らない方法は、一つだけなのね。"}, {"t": 2192.5833333333335, "x": "始めないことだ。"}, {"t": 2193.766666666667, "x": "今回は1通の現金封筒から、終局において\n破たんすべき仕組みと国の11年を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
