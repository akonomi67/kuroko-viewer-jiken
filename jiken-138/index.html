<script>
const D={"name": "138", "file": "138_編集用", "dur": 2098.6833125, "segs": [], "subs": [{"t": 0.0, "x": "長野県のある家に、朝になると\n郵便局から封筒が届いた。"}, {"t": 3.8666666666666667, "x": "1971年2月ごろの話である。"}, {"t": 6.833333333333333, "x": "中身は現金の50万円。"}, {"t": 8.466666666666667, "x": "朝に2通か3通で、夕方にまた届く。"}, {"t": 11.433333333333334, "x": "50万円！？　何を売った代金なの？"}, {"t": 13.833333333333334, "x": "何も売っていない。差出人も見知らぬ人だ。"}, {"t": 16.766666666666666, "x": "友人の家でそれを見たのは、食堂を営む男だった。"}, {"t": 20.216666666666665, "x": "1日で200万円が飛び込んでくるのだという。"}, {"t": 23.0, "x": "朝から晩まで町じゅうがその話でごった返していた。"}, {"t": 26.2, "x": "のちに国会で本人が語った光景だ。"}, {"t": 28.833333333333332, "x": "宝くじに当たったわけでもないのね。"}, {"t": 31.166666666666668, "x": "そうだ。送り主も同じように誰かへ送っていた。"}, {"t": 34.15, "x": "60万円を出すと、3300万円が返ってくるはずの会。"}, {"t": 38.28333333333333, "x": "55倍？　そんな話があるの？"}, {"t": 40.516666666666666, "x": "あった。公称の会員は120万人に達した。"}, {"t": 43.61666666666667, "x": "今回は天下一家の会事件を、この現金封筒から追う。"}, {"t": 47.18333333333333, "x": "見るのは、かけ算と法律の条文だ。"}, {"t": 49.7, "x": "かけ算？"}, {"t": 50.81666666666667, "x": "掛け算を3回やれば、終わりが見える会だった。"}, {"t": 53.68333333333333, "x": "それなのに、止める法律は11年なかった。"}, {"t": 64.3, "x": "始まりは1967年3月だ。"}, {"t": 67.08333333333333, "x": "場所は熊本県の上益城郡、甲佐町。"}, {"t": 69.9, "x": "内村健一という男が、自宅で会を立ち上げた。"}, {"t": 73.16666666666667, "x": "名前は第一相互経済研究所という。"}, {"t": 75.73333333333333, "x": "堅い名前ね。経済の研究をするところ？"}, {"t": 78.58333333333333, "x": "のちに法廷で、弁護士も同じことを尋ねた。"}, {"t": 81.4, "x": "研究所と名乗る以上、何か研究しているのだろうと。"}, {"t": 84.85, "x": "それで答えは？"}, {"t": 85.96666666666667, "x": "研究しているものは何もなかった。"}, {"t": 88.16666666666667, "x": "やっていたのは、ねずみ講だけだった。"}, {"t": 90.58333333333333, "x": "名前だけはりっぱなのね。"}, {"t": 92.25, "x": "この「名前だけ」は、あとで何度も出てくる。"}, {"t": 95.18333333333334, "x": "同じ年の8月12日。"}, {"t": 96.95, "x": "地元の熊本日日新聞が記事を載せた。"}, {"t": 99.86666666666666, "x": "見出しは「〃ネズミ講〃その危険な魅力」だった。"}, {"t": 103.2, "x": "始まって5か月で、もう新聞に？"}, {"t": 105.58333333333333, "x": "呼び名まで、もう定まっていた。"}, {"t": 107.65, "x": "会は何をうたっていたの？"}, {"t": 109.33333333333333, "x": "「天下一家」。世の中は\nひとつの家だという考え方だ。"}, {"t": 112.71666666666667, "x": "会員どうしの助け合い運動だと説明した。"}, {"t": 115.53333333333333, "x": "金もうけとは言わなかったのね。"}, {"t": 117.51666666666667, "x": "言わない。国民を貧乏から救うと語っていた。"}, {"t": 120.4, "x": "この看板は、最後まで下ろされなかった。"}, {"t": 123.56666666666666, "x": "1970年の時点で、コースは4つあった。"}, {"t": 126.81666666666666, "x": "一つ目は「親しき友の会」。"}, {"t": 128.75, "x": "元手は2千円あまりだ。"}, {"t": 130.4, "x": "4人を誘い、6段階で102万4000円を受け取る。"}, {"t": 133.81666666666666, "x": "二つ目は相互経済協力会。"}, {"t": 135.76666666666668, "x": "4万円で102万円。"}, {"t": 137.38333333333333, "x": "こちらは2人を誘い、段階は7つになる。"}, {"t": 140.13333333333333, "x": "三つ目は10万円で528万円のマイハウス友の会。"}, {"t": 143.98333333333332, "x": "家を建てるお金ってこと？"}, {"t": 145.68333333333334, "x": "そう売り出された。誘うのは2人で8段階だ。"}, {"t": 148.68333333333334, "x": "四つ目が中小企業向けの60万円のコース。"}, {"t": 151.68333333333334, "x": "受け取りは3300万円。これが一番大きい。"}, {"t": 154.83333333333334, "x": "冒頭の50万円の封筒は、これね。"}, {"t": 157.38333333333333, "x": "その通り。1970年の11月ごろに始まったらしい。"}, {"t": 161.41666666666666, "x": "規定では、法人しか入れないはずだった。"}, {"t": 164.03333333333333, "x": "だが名前を書いて金を送れば、実際は誰でも通った。"}, {"t": 167.4, "x": "参考人はこれを「ネコもしゃくしも」と言っている。"}, {"t": 170.53333333333333, "x": "会社じゃない人まで60万円を？"}, {"t": 172.76666666666668, "x": "出した。高利貸しから借りて入る人までいた。"}, {"t": 175.58333333333334, "x": "パンフレットの言葉を、長野の判決が引いている。"}, {"t": 178.65, "x": "「数ケ月後には貴方の企業グループから三、三〇\n〇万円のお金が順次送られることになるのです。」"}, {"t": 184.5, "x": "数か月で！　それはまぶしいわね。"}, {"t": 187.2, "x": "では60万円はどこへ行くのか。"}, {"t": 189.2, "x": "警察庁の説明では、二つに分かれる。"}, {"t": 191.9, "x": "10万円は熊本の本部へ。"}, {"t": 193.75, "x": "残りの50万円は、本部が指定した先輩会員へ。"}, {"t": 197.23333333333332, "x": "本部を通さず、直接送るの？"}, {"t": 199.5, "x": "そこが肝心だ。現金書留で人から人へ送る。"}, {"t": 203.03333333333333, "x": "じゃあ本部が受け取るのは10万円だけ？"}, {"t": 205.4, "x": "入会金という名前の10万円だけだ。"}, {"t": 207.78333333333333, "x": "だがこの10万円は、入る人がいる限り必ず入る。"}, {"t": 211.28333333333333, "x": "誰が損をしても？"}, {"t": 212.63333333333333, "x": "関係ない。ある議員は、\n機械的に転がり込むと表現した。"}, {"t": 216.41666666666666, "x": "そして会員は2人を誘う義務を負う。"}, {"t": 218.61666666666667, "x": "誘われた2人が、また2人ずつ誘う。"}, {"t": 221.18333333333334, "x": "孫の会員が4人できると、うち2人から50万円ずつ届く。"}, {"t": 225.21666666666667, "x": "100万円！　もう元が取れてるじゃない。"}, {"t": 227.53333333333333, "x": "さらに進むと、7段下に128人ができる。"}, {"t": 231.0, "x": "その半分の64人から、また50万円ずつ届く。"}, {"t": 234.66666666666666, "x": "64かける50万で……3200万円？"}, {"t": 237.8, "x": "先の100万円と足して3300万円。"}, {"t": 240.43333333333334, "x": "計算は合っている。"}, {"t": 241.78333333333333, "x": "じゃあ、どこが問題なの？"}, {"t": 243.51666666666668, "x": "128人の下にも人がいないと、その128人が損をする。"}, {"t": 248.7, "x": "ここで冒頭に言った掛け算をやる。"}, {"t": 250.7, "x": "1人の満額のために、7段下までで何人要るか。"}, {"t": 254.13333333333333, "x": "2人、4人、8人、16人、32人、64人、128人。"}, {"t": 259.3666666666667, "x": "足すと254人。一番下の段は128人だ。"}, {"t": 263.26666666666665, "x": "1人のために254人？"}, {"t": 265.31666666666666, "x": "その128人も、全員が満額を待っている。"}, {"t": 268.55, "x": "128人それぞれに、また128人の段が要る。"}, {"t": 272.25, "x": "128掛ける128で、1万6384人。"}, {"t": 276.56666666666666, "x": "もう1回で209万7152人。"}, {"t": 279.5, "x": "一気に増えたわね。"}, {"t": 280.85, "x": "もう1回掛けると、2億6843万人を超える。"}, {"t": 284.75, "x": "当時の日本の人口は、1億1000万人あまりだ。"}, {"t": 288.18333333333334, "x": "3回で日本の人口を超えちゃった！"}, {"t": 290.46666666666664, "x": "東京大学の教授も、国会でこう見積もっている。"}, {"t": 293.6166666666667, "x": "恐らく30世代ぐらいで、\n地球上の全人口が入る勘定になる。"}, {"t": 297.8, "x": "1週間に1世代なら、半年かそこらだと。"}, {"t": 300.9, "x": "地球が半年で終わっちゃう。"}, {"t": 302.7, "x": "教授は続けて、面白いことを言った。"}, {"t": 305.15, "x": "「私は現に入っておらないわけであります。」"}, {"t": 307.75, "x": "先生、まじめな顔で何を言ってるの。"}, {"t": 310.26666666666665, "x": "10年たっても自分が誘われて入るに至っていない。"}, {"t": 313.31666666666666, "x": "それは勧誘がいかに難しいかの証拠だ、という話だ。"}, {"t": 316.75, "x": "つまり途中で泣いている人が、それだけ多い。"}, {"t": 319.5833333333333, "x": "会長はこの計算に何て答えたの？"}, {"t": 322.0, "x": "教授の論文によると、人間は次々と\n生まれると言っていたらしい。"}, {"t": 325.9, "x": "教授の切り返しはこうだ。"}, {"t": 327.5, "x": "どの夫婦も四つ子をもうけ、たちまち\n成人してまた四つ子を生む。"}, {"t": 331.28333333333336, "x": "皮肉がきいてるわね。"}, {"t": 332.76666666666665, "x": "教授の一文を、そのまま読む。"}, {"t": 334.8, "x": "「ネズミ講は必ず被害者を生む。」"}, {"t": 336.8, "x": "「早くつぶれればつぶれるほど、\n被害者は少なくてすむ」"}, {"t": 340.25, "x": "大きくなるほど、悪くなるのね。"}, {"t": 342.43333333333334, "x": "そう。発展は被害の増加と同じ意味だった。"}, {"t": 345.85, "x": "その発展は、まず地方の町を飲み込んだ。"}, {"t": 348.56666666666666, "x": "1970年12月17日。"}, {"t": 351.0833333333333, "x": "参議院の大蔵委員会。"}, {"t": 352.71666666666664, "x": "ある議員が、長野県の丸子町の話を持ち出した。"}, {"t": 356.06666666666666, "x": "町の半分ぐらいの3000世帯が入っている、と。"}, {"t": 359.21666666666664, "x": "町の半分！？"}, {"t": 360.3833333333333, "x": "もう誘う相手がいなくなった。"}, {"t": 362.1666666666667, "x": "すると会員の奪い合いが始まった。"}, {"t": 364.43333333333334, "x": "奪い合いって、何を？"}, {"t": 365.96666666666664, "x": "まだ入っていない人を、だ。"}, {"t": 367.73333333333335, "x": "おれが取ったこの人が取ったと、\n親戚や友人でけんかになる。"}, {"t": 371.5833333333333, "x": "友達が金づるに見えちゃうのね。"}, {"t": 373.73333333333335, "x": "同じ議員が、熊本の本部の様子も伝えている。"}, {"t": 376.8333333333333, "x": "申し込みは現金書留で郵便局に届く。"}, {"t": 379.68333333333334, "x": "研究所がワゴン車で取りに行く。"}, {"t": 381.6, "x": "戻ると銀行が待っていて、すぐ預金する。"}, {"t": 384.3666666666667, "x": "銀行が待ちかまえてるの？"}, {"t": 386.1333333333333, "x": "1日で3000万円を下らない金が入ると言われていた。"}, {"t": 389.56666666666666, "x": "ホテルも次々と買い取り、\n本部の裏には6階建てを新築中だった。"}, {"t": 393.95, "x": "止める人はいなかったの？"}, {"t": 395.6333333333333, "x": "この日、国税庁も警察庁も、まだ\n調べている最中だと答えた。"}, {"t": 400.0, "x": "始まってから3年9か月がたっていた。"}, {"t": 402.6333333333333, "x": "同じ型の組織も全国に生まれていた。"}, {"t": 405.1666666666667, "x": "東京では「幸福の手紙」が配られ、\n警視庁に被害の届けが出た。"}, {"t": 409.6166666666667, "x": "国税庁の長官は、根本は熊本から\n発しているようだと答えた。"}, {"t": 414.43333333333334, "x": "国に目をつけられて、会長は怖くなかったの？"}, {"t": 417.43333333333334, "x": "逆だ。週刊誌でこう語ったと、議員が読み上げた。"}, {"t": 420.75, "x": "「大蔵省って国民のための役所じゃなかか。」"}, {"t": 423.45, "x": "「大蔵大臣の資格なし。\nわしが罷免してやりまっしゅ」"}, {"t": 426.9, "x": "大臣を罷免！？"}, {"t": 428.06666666666666, "x": "委員会の記録には（笑声）と書いてある。"}, {"t": 430.9, "x": "笑われてるじゃない。"}, {"t": 432.15, "x": "だが会長の側には、それを\n言えるだけの理由があった。"}, {"t": 435.3, "x": "どの法律にも引っかからない形をしていたのだ。"}, {"t": 438.23333333333335, "x": "議員は「はっきりと詐欺罪を\n構成するのじゃないですか」と迫った。"}, {"t": 442.21666666666664, "x": "委員席からも「詐欺罪だ」と声が上がった。"}, {"t": 445.2, "x": "みんなそう思っていたのね。"}, {"t": 446.9, "x": "思っていた。だが思うだけでは罪にはならない。"}, {"t": 449.68333333333334, "x": "ここから法律との長い追いかけっこが始まる。"}, {"t": 453.0833333333333, "x": "最初に動いたのは警察ではなかった。"}, {"t": 455.45, "x": "1971年6月。熊本国税局が強制調査に入った。"}, {"t": 460.2, "x": "冒頭の男は、この時どうしていたか。"}, {"t": 462.68333333333334, "x": "彼は結局、60万円の口を3つ買っていた。"}, {"t": 466.06666666666666, "x": "3つって、180万円！？"}, {"t": 468.1666666666667, "x": "保養所の祝賀会で、本部の幹部の説明を聞いたのだ。"}, {"t": 471.6333333333333, "x": "これは助け合いだ。\n二百億の資産があるから心配はいらない。"}, {"t": 475.3, "x": "断り切れない世間づきあいもあった。"}, {"t": 477.48333333333335, "x": "彼は誘う相手を探して、友人のいる横浜まで来た。"}, {"t": 480.98333333333335, "x": "その日の新聞に、熊本の査察が大きく載っていた。"}, {"t": 484.46666666666664, "x": "うわ、よりによって。"}, {"t": 485.93333333333334, "x": "それでも彼は二百億の話を信じて友人を誘った。"}, {"t": 489.3333333333333, "x": "長野へ帰ると町の様子が変わっていた。"}, {"t": 491.78333333333336, "x": "本人の言葉では「火をつけたように\nごった返している」。"}, {"t": 495.15, "x": "何が起きたの？"}, {"t": 496.3333333333333, "x": "新聞で騒がれて、次の人が入らなくなった。"}, {"t": 499.3833333333333, "x": "下がいなければ、金は永久に届かない。"}, {"t": 502.0, "x": "誘った人と誘われた人の間で、\n金を返せという争いになる。"}, {"t": 506.1166666666667, "x": "家族で夜逃げした人もいた。"}, {"t": 507.98333333333335, "x": "スキー場で知られる志賀高原の例も語られている。"}, {"t": 510.85, "x": "ある人が村じゅうに勧めて、全員が入った。"}, {"t": 513.7666666666667, "x": "その結果、持っていく先が無くなった。"}, {"t": 516.4166666666666, "x": "勧めた人はどうなったの？"}, {"t": 518.2666666666667, "x": "村八分になったという。"}, {"t": 519.75, "x": "岐阜県では、自ら命を絶った\n人が出たと国会で語られている。"}, {"t": 523.9833333333333, "x": "……お金の話じゃ、済まなくなったのね。"}, {"t": 526.55, "x": "そうだ。被害に遭った人は、\n同時に誘った人でもあった。"}, {"t": 530.8666666666667, "x": "長野の会員たちは毎晩何百人も集まって相談した。"}, {"t": 534.45, "x": "熊本へ確かめに行こう、という話になった。"}, {"t": 537.2833333333333, "x": "代理に頼まれたのが、あの食堂の男だ。"}, {"t": 540.0833333333334, "x": "皆から4万5000円のカンパをもらって熊本へ向かった。"}, {"t": 543.4833333333333, "x": "着いたのは1971年6月14日。"}, {"t": 546.5, "x": "翌15日が本館の落成の大会だ。"}, {"t": 549.2333333333333, "x": "行ってみて、彼は驚いた。"}, {"t": 551.0, "x": "6月15日は、会長自身の誕生日だった。"}, {"t": 554.2666666666667, "x": "えっ、全国から人を呼んで誕生祝い？"}, {"t": 556.9, "x": "彼の目にはそう映った。"}, {"t": 558.2666666666667, "x": "税金の騒ぎの真っただ中にだ。"}, {"t": 560.45, "x": "その夜、各県の代表と会長の話し合いが開かれた。"}, {"t": 564.05, "x": "世間の非難の理由は何か。"}, {"t": 565.7666666666667, "x": "損をした人をどうするのか。"}, {"t": 567.7, "x": "会長は何て答えたの？"}, {"t": 569.4166666666666, "x": "国がつぶしたら、国が責任を取ってほしい。"}, {"t": 572.2166666666667, "x": "新聞が騒ぐのは、でたらめなのだ。"}, {"t": 574.5166666666667, "x": "補償の話に、それらしい返事は無かったという。"}, {"t": 577.4666666666667, "x": "これは彼が国会で語った記憶で、\n会長の側の記録ではない。"}, {"t": 581.3333333333334, "x": "彼は帰っても、寝ても覚めてもいられなかった。"}, {"t": 584.1833333333333, "x": "そして裁判をすると決めた。"}, {"t": 586.6, "x": "だがこの裁判は、始める前から壁があった。"}, {"t": 589.5, "x": "何人の弁護士に会っても、\n相手にしてくれなかったのだ。"}, {"t": 592.9666666666667, "x": "どうして？　被害者が大勢いるのに。"}, {"t": 595.25, "x": "1人あたりの金額が小さいからだ。"}, {"t": 597.5166666666667, "x": "訴えて返せと言えるのは、まず入会金の部分になる。"}, {"t": 600.8333333333334, "x": "60万円のうち10万円だ。"}, {"t": 602.9, "x": "手間のほうが高くつくのね。"}, {"t": 604.7666666666667, "x": "それに、入った人にも引け目がある。"}, {"t": 607.0833333333334, "x": "欲をかいたのが悪いと言われるのが怖い。"}, {"t": 609.4, "x": "本部もそれを見越していた、と弁護士は語っている。"}, {"t": 612.45, "x": "ようやく会えた弁護士は、金が無いと聞いて答えた。"}, {"t": 615.45, "x": "社会問題だから放ってはおけない、やりましょうと。"}, {"t": 618.55, "x": "その弁護士さん、かっこいいじゃない。"}, {"t": 620.6833333333333, "x": "1972年2月、長野地方裁判所に訴えが起こされた。"}, {"t": 625.0833333333334, "x": "原告は520人にのぼった。"}, {"t": 627.25, "x": "裁判は5年かかり、公判は25回を数えた。"}, {"t": 630.3833333333333, "x": "判決の話は後に回す。"}, {"t": 632.3166666666667, "x": "その間に、刑事の方が先に答えを出したからだ。"}, {"t": 636.15, "x": "被害者たちは、詐欺で告訴した。"}, {"t": 638.3833333333333, "x": "松本、長野、静岡の警察へ告訴状を持って行った。"}, {"t": 642.15, "x": "1973年2月、熊本地検は結論を出した。不起訴だ。"}, {"t": 646.9666666666667, "x": "どうして！　あんなに損をした人がいるのに。"}, {"t": 649.65, "x": "詐欺には、相手に思い違いをさせることが要る。"}, {"t": 652.45, "x": "その思い違いで金を渡した、という流れを立証する。"}, {"t": 655.7833333333333, "x": "法務省の説明は「十分な\n確信を得るに至らなかった」だ。"}, {"t": 659.6666666666666, "x": "警察が手を付けた詐欺の捜査は6件あった。"}, {"t": 662.5833333333334, "x": "その6件は？"}, {"t": 663.7333333333333, "x": "全部不起訴だ。"}, {"t": 664.8, "x": "ここで、ある検事の話が出てくる。"}, {"t": 667.1, "x": "法務省の刑事課長が、\n1977年の国会で打ち明けた体験だ。"}, {"t": 671.95, "x": "彼は東京地検の特捜部で、\nねずみ講の事件を担当した。"}, {"t": 675.7833333333333, "x": "数十人の会員から直接話を聞いている。"}, {"t": 678.65, "x": "一番聞きたかったのは、入った動機だそうだ。"}, {"t": 681.55, "x": "成り立つものではないと、分かって入ったのか。"}, {"t": 684.2666666666667, "x": "大体の人の答えはこうだった。"}, {"t": 686.3333333333334, "x": "「知っておりました。」"}, {"t": 687.6, "x": "えっ、知ってたの？"}, {"t": 688.9666666666667, "x": "ではなぜ入ったのか。"}, {"t": 690.1833333333333, "x": "彼はさらに聞いた。"}, {"t": 691.4666666666667, "x": "自分だけはうまくもうかるのではないか。"}, {"t": 693.7, "x": "万が一を当てにした、という答えだった。"}, {"t": 696.3166666666667, "x": "ああ……それは分かるかも。"}, {"t": 697.95, "x": "もちろん全員ではない。"}, {"t": 699.1666666666666, "x": "信じ切って入った人も大勢いた。"}, {"t": 701.4166666666666, "x": "ただ、思い違いをしていないなら詐欺とは言いにくい。"}, {"t": 704.3166666666667, "x": "この壁に、被害者の側は強く反発した。"}, {"t": 707.25, "x": "弁護士は「検察庁はこれに\nひっかかってしまった」と語っている。"}, {"t": 711.95, "x": "元を取れた人は、どれくらいいたの？"}, {"t": 714.2833333333333, "x": "先ほどの検事は、聞いた範囲の数字を挙げている。"}, {"t": 717.2833333333333, "x": "ほぼ20人から30人に1人の割合だった。"}, {"t": 720.25, "x": "彼はその人に、もうかる秘訣を尋ねた。"}, {"t": 722.9333333333333, "x": "答えは、子の尻をたたいて孫を、\n孫からひ孫を作らせること。"}, {"t": 726.8333333333334, "x": "四六時中、不眠不休で数か月走り回ったそうだ。"}, {"t": 730.3666666666667, "x": "それ、もう仕事じゃない。"}, {"t": 732.0166666666667, "x": "本人も、覚めてから考えたという。"}, {"t": 734.3666666666667, "x": "その努力を本業に向ければ10倍も\n20倍も得られたはずだと。"}, {"t": 738.05, "x": "そして「もうこりごりです」と言った。"}, {"t": 740.4833333333333, "x": "もうかった人でも、こりごりなのね。"}, {"t": 742.7833333333333, "x": "検事はこの人たちを、こう表現している。"}, {"t": 745.4, "x": "「被害者が加害者に転化した」方々だと。"}, {"t": 748.3666666666667, "x": "被害者が加害者に……。"}, {"t": 749.8666666666667, "x": "ここが、ねずみ講の一番嫌なところだ。"}, {"t": 752.4166666666666, "x": "取り戻そうとすれば、次の人を誘うしかない。"}, {"t": 755.3166666666667, "x": "誘えば、その人を損の場所へ立たせることになる。"}, {"t": 759.05, "x": "では他の法律はどうか。"}, {"t": 760.5166666666667, "x": "一つずつ当たってみる。"}, {"t": 762.05, "x": "最初は出資法だ。金を預かる行為を取り締まる。"}, {"t": 765.2333333333333, "x": "それなら使えそうじゃない。"}, {"t": 766.85, "x": "ねずみ講には二つの型があった。"}, {"t": 768.9333333333333, "x": "先輩への金を本部が預かる型。これが会主導型だ。"}, {"t": 772.5, "x": "預かるのだから、出資法の違反で検挙できる。"}, {"t": 775.4333333333333, "x": "警察は1977年の1年で、11の組織を検挙している。"}, {"t": 780.2833333333333, "x": "じゃあ天下一家も？"}, {"t": 781.5833333333334, "x": "こちらは会員主導型だった。"}, {"t": 783.4833333333333, "x": "思い出してくれ。50万円は人から人へ直接送る。"}, {"t": 787.0333333333333, "x": "本部は入会金を受け取るだけで、預かってはいない。"}, {"t": 790.2333333333333, "x": "あっ、だから直接送らせていたの！"}, {"t": 792.6833333333333, "x": "結果として、そこが抜け穴になった。"}, {"t": 795.1166666666667, "x": "警察庁の課長も、規制できないタイプだと答えている。"}, {"t": 798.55, "x": "次は賭博だ。もうけは運次第に見える。"}, {"t": 801.0333333333333, "x": "だが法務省は、これも違うと答えた。"}, {"t": 803.4666666666667, "x": "賭博は偶然で決まる。ねずみ講は\n本人の努力で決まる。"}, {"t": 807.0666666666667, "x": "努力！？　人を誘う努力のこと？"}, {"t": 809.35, "x": "そう。「われわれの日常の仕事と\n同じ面もある」と課長は言った。"}, {"t": 813.25, "x": "一緒にすると失礼かもしれない、と本人も添えている。"}, {"t": 816.5166666666667, "x": "では全部まとめて罰する法律を作ればいいのか。"}, {"t": 819.3666666666667, "x": "これにも課長は疑問を述べた。"}, {"t": 821.2166666666667, "x": "末端まで含めると、200万人近くを巻き込む罪になる。"}, {"t": 825.1333333333333, "x": "被害者まで罰することになっちゃうのか。"}, {"t": 827.5666666666667, "x": "こうして穴は埋まらないまま、年月だけが過ぎた。"}, {"t": 830.5833333333334, "x": "ただ一つ、効いた法律があった。税法だ。"}, {"t": 833.45, "x": "1972年3月、所得税法違反で起訴された。"}, {"t": 837.4166666666666, "x": "免れたとされた税額は、\n1970年分で約19億6500万円だ。"}, {"t": 843.0, "x": "詐欺じゃなくて、税金なのね。"}, {"t": 845.0666666666667, "x": "そう。刑事で問えたのは、最初から税金だった。"}, {"t": 848.7333333333333, "x": "起訴されても、勧誘は止まらなかった。"}, {"t": 851.1666666666666, "x": "それどころか、会は新しい看板を手に入れた。"}, {"t": 854.1166666666667, "x": "看板？"}, {"t": 855.25, "x": "財団法人だ。"}, {"t": 856.4, "x": "当時の財団法人は、役所の許可がないと\n作れない公益の団体だ。"}, {"t": 860.75, "x": "そこで目を付けたのが、\n熊本の財団法人肥後厚生会だ。"}, {"t": 864.5833333333334, "x": "1947年5月1日に許可された、\n戦災者を援護する団体だった。"}, {"t": 869.75, "x": "ところが活動をやめて、20年も眠っていた。"}, {"t": 872.8333333333334, "x": "眠っていた団体を、どうしたの？"}, {"t": 875.0333333333333, "x": "1973年5月。会長が役員に入った。"}, {"t": 878.6666666666666, "x": "名前を財団法人天下一家の会へ\n変える登記が申請された。"}, {"t": 882.4333333333333, "x": "資産も書き換えられた。もとは18万円だった。"}, {"t": 885.6666666666666, "x": "それがいくらに？"}, {"t": 886.8166666666667, "x": "12億8000万円だ。"}, {"t": 888.45, "x": "名前の変更には、県知事の許可が要る。"}, {"t": 891.0, "x": "だが熊本県は許可を出していなかった。"}, {"t": 893.5833333333334, "x": "じゃあ、どうして登記できたの？"}, {"t": 895.5166666666667, "x": "議員の追及では、添えた書類がにせものだった。"}, {"t": 898.4833333333333, "x": "別の議員の言葉では「乗っ取られておる」状態だ。"}, {"t": 901.8166666666667, "x": "眠っている財団を乗っ取るなんて。"}, {"t": 903.95, "x": "弁護士は法廷で、財団の目的を\n一つずつ質問している。"}, {"t": 907.85, "x": "目的は十数項目あり、福祉の事業も書いてある。"}, {"t": 911.1166666666667, "x": "この点の事業はどうだ。それは将来やる見込みです。"}, {"t": 914.2333333333333, "x": "一つとしてやっていなかった、と弁護士は語っている。"}, {"t": 918.0666666666667, "x": "この看板は、勧誘の場で大きな力を発揮した。"}, {"t": 921.2833333333333, "x": "1977年2月11日。"}, {"t": 923.8166666666667, "x": "東京の九段に会館が開かれた。"}, {"t": 926.1166666666667, "x": "靖国神社の境内に隣接する土地だ。"}, {"t": 928.75, "x": "建物は10階建て。上には\n財団法人天下一家の会の文字。"}, {"t": 932.85, "x": "東京のど真ん中じゃない！"}, {"t": 934.5166666666667, "x": "財団法人は国が許可した団体だ。"}, {"t": 936.8333333333334, "x": "国が認めた助け合い運動だ。"}, {"t": 938.8833333333333, "x": "勧誘の言葉はそうだったと、議員たちが伝えている。"}, {"t": 942.0666666666667, "x": "議員に届いた被害の訴えの多くが、\n同じことを書いていた。"}, {"t": 945.6833333333333, "x": "財団法人と言われたので安心して入った、と。"}, {"t": 948.8333333333334, "x": "それは信じちゃうわよ。"}, {"t": 950.2666666666667, "x": "機関誌はさらに踏み込んでいた。"}, {"t": 952.15, "x": "「本当に詐欺なんかであるものとするならば、\n国家が財団法人や宗教法人として認めるかい」"}, {"t": 957.85, "x": "うまいこと言うわね。"}, {"t": 959.1, "x": "勧誘を担う人も組織になっていた。"}, {"t": 961.5, "x": "思想普及員という名前で、全国に1300人あまりいた。"}, {"t": 965.4, "x": "思想？　お金の話なのに？"}, {"t": 967.4, "x": "議員はセールスマンと呼んでいる。"}, {"t": 969.15, "x": "研究しない研究所。事業をしない財団。"}, {"t": 971.7333333333333, "x": "勧誘する思想普及員。"}, {"t": 973.4833333333333, "x": "名前だけ、ってさっき言ってた話ね。"}, {"t": 975.95, "x": "入る人の前にあったのは、中身ではなく看板だった。"}, {"t": 979.3333333333334, "x": "これを責めるのは難しい。"}, {"t": 980.8666666666667, "x": "国の役所の登記簿に、そう書いてあったのだから。"}, {"t": 984.4666666666667, "x": "看板はもう一枚あった。"}, {"t": 986.0833333333334, "x": "1973年11月24日、宗教法人大観宮が設立された。"}, {"t": 991.4666666666667, "x": "事務所の登録は阿蘇。"}, {"t": 992.7666666666667, "x": "代表役員は同じ内村健一だ。"}, {"t": 995.15, "x": "こうして三つの組織が並んだ。"}, {"t": 997.1666666666666, "x": "ねずみ講の本部。財団法人。宗教法人。"}, {"t": 1000.1833333333333, "x": "チラシには「心」「和」\n「救け合い」と書かれていた。"}, {"t": 1003.5, "x": "議員はこれを「三位一体」と\n呼び、判決も同じだと指摘した。"}, {"t": 1007.75, "x": "お金はどう動いていたの？"}, {"t": 1009.4, "x": "入会金の4分の1が、財団か\n宗教法人へ寄付される形になった。"}, {"t": 1014.0333333333333, "x": "残り4分の3が本部に入る。"}, {"t": 1016.1166666666667, "x": "財団の1976年3月末の資産は、47億2325万円あまり。"}, {"t": 1022.2333333333333, "x": "負債はゼロだ。本部の事業概要にそう書いてある。"}, {"t": 1025.3833333333334, "x": "4分の1だけで47億！"}, {"t": 1027.5666666666666, "x": "国税庁は、本部が受け取る時点で\n全額に課税していると答えた。"}, {"t": 1031.6833333333334, "x": "ただ財団の名前の変更は無効だった。"}, {"t": 1034.1833333333334, "x": "法律上は存在しないはずの団体に、\n金が積み上がっていた。"}, {"t": 1038.1, "x": "存在しない団体に47億円……。"}, {"t": 1041.0666666666666, "x": "会長個人はどれくらいもうけていたの？"}, {"t": 1043.4333333333334, "x": "1977年5月に発表された高額所得者の番付に載った。"}, {"t": 1048.2, "x": "全国で39位。前の年の所得は2億7770万円だ。"}, {"t": 1052.95, "x": "弁護士によると、月給は1000万円だった。"}, {"t": 1055.8, "x": "月給1000万円の日本人は、\n彼以外にいないのではと語っている。"}, {"t": 1060.0166666666667, "x": "それって、会のお金じゃないの？"}, {"t": 1062.0833333333333, "x": "長野の判決が挙げた\n理由の一つが、そこに触れている。"}, {"t": 1065.5666666666666, "x": "入会金でヘリコプターや高級自動車を買っていた。"}, {"t": 1068.6, "x": "議員は「七十五億円も現ナマを机の上に\n積んで誇示した」と紹介した。"}, {"t": 1073.4, "x": "机の上に75億！？"}, {"t": 1075.1666666666667, "x": "報道された話として、国会の記録に残っている。"}, {"t": 1078.5333333333333, "x": "会長の言い分も聞いておく。"}, {"t": 1080.2, "x": "政府が「ネズミ講にご用心」と\n新聞広告を出した時のことだ。"}, {"t": 1084.3666666666666, "x": "まことに結構だ、と言ったと議員が紹介した。"}, {"t": 1087.4166666666667, "x": "えっ、結構なの？"}, {"t": 1088.85, "x": "あの広告は天下一家とは言っていない。"}, {"t": 1091.1166666666666, "x": "類似のにせものが整理されてよい、という理屈だ。"}, {"t": 1094.1333333333334, "x": "自分はねずみ講じゃないって言うのね。"}, {"t": 1096.3166666666666, "x": "勧誘の現場でも\n「断じてネズミ講ではない」と説明された。"}, {"t": 1100.1166666666666, "x": "そう言われて入った人の手紙が、\n国会で読み上げられている。"}, {"t": 1104.3, "x": "1976年の秋。会は創立10周年の大会を開いた。"}, {"t": 1108.7833333333333, "x": "場所は東京の日本武道館だ。"}, {"t": 1110.8666666666666, "x": "ある議員の話では、集まったのは1万3000人。"}, {"t": 1114.15, "x": "武道館に1万3000人！？"}, {"t": 1116.05, "x": "会の新聞は「日本武道館にうねる大活力」と書いた。"}, {"t": 1119.8333333333333, "x": "この種の大会には、\n現職の国会議員も姿を見せていた。"}, {"t": 1123.6666666666667, "x": "祝辞を述べたことが、委員会で\n名前つきで指摘されている。"}, {"t": 1127.25, "x": "今回は個人の名前は言わない。"}, {"t": 1129.25, "x": "議員さんは、知ってて行ったのかな？"}, {"t": 1131.5333333333333, "x": "そこは分からない。本人たちの事情は記録に無い。"}, {"t": 1134.55, "x": "確かなのは、それが勧誘に使われたことだ。"}, {"t": 1137.4166666666667, "x": "大会の写真やインタビューが、本や宣伝物に載った。"}, {"t": 1140.75, "x": "参考人が読み上げた手紙にこうある。"}, {"t": 1142.9833333333333, "x": "知っている人の名前がいっぱい\n出てきたので安心して入会した。"}, {"t": 1146.8333333333333, "x": "財団法人に、国会議員に……。"}, {"t": 1149.05, "x": "安心の材料が、ひとそろい用意されていた。"}, {"t": 1151.7666666666667, "x": "官房長官の答えは、\n議員それぞれの良識の問題だった。"}, {"t": 1156.1333333333334, "x": "1977年3月30日。ついに判決の日が来た。"}, {"t": 1160.4666666666667, "x": "提訴から5年。長野地方裁判所だ。"}, {"t": 1163.0, "x": "裁判所は、講の組織は\n民法90条の公序良俗に反して無効だとした。"}, {"t": 1167.9, "x": "公序良俗？"}, {"t": 1169.0666666666666, "x": "世の中の秩序や、まともな道徳に反するという意味だ。"}, {"t": 1172.55, "x": "法律に禁止と書いていなくても、無効にできる条文だ。"}, {"t": 1176.0, "x": "国会では、理由が5つ紹介された。"}, {"t": 1178.5166666666667, "x": "一つ目。人数には必ず限界が来る。"}, {"t": 1181.2, "x": "二つ目。何も生み出さず、早い\n者勝ちで賭博の性質が強い。"}, {"t": 1185.35, "x": "三つ目。詐欺的な誇大宣伝をしている。"}, {"t": 1188.0166666666667, "x": "四つ目。射幸心をあおり、人間関係を壊す。"}, {"t": 1191.2, "x": "五つ目が、さっきのヘリコプターと高級自動車だ。"}, {"t": 1194.5, "x": "ぜんぶ言ってくれた感じ！"}, {"t": 1196.0833333333333, "x": "これは内村個人の事業である、とも判断された。"}, {"t": 1199.1666666666667, "x": "看板をいくら増やしても、裁判所は中身を見た。"}, {"t": 1202.2333333333333, "x": "命じられた返還は、520人に2287万円だ。"}, {"t": 1206.6333333333334, "x": "1人あたりにすると、いくら？"}, {"t": 1208.6333333333334, "x": "計算すると、1人4万4000円ほどになる。"}, {"t": 1211.6333333333334, "x": "これは入会金の分だけで、\n他の会員へ送った金は入らない。"}, {"t": 1215.6166666666666, "x": "これで終わったんじゃないの？"}, {"t": 1217.1833333333334, "x": "終わらなかった。会長の側は控訴した。"}, {"t": 1219.7166666666667, "x": "民事の判決は、訴えた人の分にしか届かない。"}, {"t": 1223.0333333333333, "x": "本部はたかをくくっている、と弁護士は語った。"}, {"t": 1225.85, "x": "止めるには、やはり法律が要る。"}, {"t": 1227.8833333333334, "x": "男は国会で、全国から届いた手紙の一節を読んだ。"}, {"t": 1231.5166666666667, "x": "「天下一家の被害者はもう私丈で沢山です。」"}, {"t": 1235.1666666666667, "x": "それで国はすぐ法律を作ったの？"}, {"t": 1237.4333333333334, "x": "ここからが、この事件の一番長いところだ。"}, {"t": 1240.2666666666667, "x": "政府が動いたのは1974年10月8日に始まる。"}, {"t": 1244.0833333333333, "x": "総理大臣が座長の消費者保護会議だ。"}, {"t": 1246.6333333333334, "x": "法的な規制を検討すると決めた。"}, {"t": 1248.9166666666667, "x": "翌年も、その翌年も、会議はこの問題を取り上げた。"}, {"t": 1252.6166666666666, "x": "1976年の決定にはこうある。"}, {"t": 1255.35, "x": "「早急に出資法の改正を含め新規立法を検討する。」"}, {"t": 1258.9666666666667, "x": "早急に、って書いてあるじゃない。"}, {"t": 1260.9, "x": "書いてある。関係する7つの省庁が6回協議した。"}, {"t": 1264.2666666666667, "x": "だが結論が出ない。"}, {"t": 1265.5833333333333, "x": "1977年10月の国会で議員は\n驚くべきことを言っている。"}, {"t": 1269.95, "x": "どこが担当の役所なのかさえ、まだ決まっていない。"}, {"t": 1273.1666666666667, "x": "3年たって、担当も決まってないの？"}, {"t": 1275.7166666666667, "x": "経済企画庁の長官は、率直にこう答えていた。"}, {"t": 1279.1, "x": "立法の話になると「また振り出しに戻って」しまう。"}, {"t": 1282.5833333333333, "x": "1978年3月の参議院で、\n別の議員がしびれを切らした。"}, {"t": 1287.1666666666667, "x": "「いまだに法律のほの字も出てこない」"}, {"t": 1289.4, "x": "ほの字……。"}, {"t": 1290.5333333333333, "x": "民間には昔から、頼母子講という助け合いがある。"}, {"t": 1293.8, "x": "これと区別する書き方が\n難しい、というのが理由の一つだった。"}, {"t": 1297.8666666666666, "x": "ちゃんと理由はあるのね。"}, {"t": 1299.35, "x": "ある。ただ待っている間も、封筒は飛び続けていた。"}, {"t": 1302.6, "x": "ある議員の試算では、本部に入る日銭は5000万円。"}, {"t": 1305.85, "x": "動いている金は1000億円になるはずだという。"}, {"t": 1309.0333333333333, "x": "1978年3月24日。"}, {"t": 1311.7, "x": "参議院の予算委員会。"}, {"t": 1313.3, "x": "法務大臣と議員のやり取りが山場になった。"}, {"t": 1315.95, "x": "議員は、詐欺に問えないのかと尋ねた。"}, {"t": 1318.35, "x": "大臣はまず、率直に申し上げると前置きした。"}, {"t": 1321.4166666666667, "x": "事情を知って入ったのなら、競馬を\n買ったのと同じようなものだ。"}, {"t": 1325.2, "x": "競馬と同じって言っちゃうの？"}, {"t": 1326.9833333333333, "x": "そして、こう続けた。"}, {"t": 1328.5166666666667, "x": "「途中までは必ずもうけるんです。」"}, {"t": 1330.5166666666667, "x": "「途中までもうけますから、どの段階で\n詐欺になるのかということは非常に問題になる」"}, {"t": 1335.55, "x": "うーん、そう言われるとそうかも。"}, {"t": 1337.4333333333334, "x": "犯罪の線を引く難しさを言った答弁だ。"}, {"t": 1340.1, "x": "さらに大臣は、国民に向けて言った。"}, {"t": 1342.5833333333333, "x": "「そういうものを相手にしないということを\nひとつ国民の皆さんも考えてもらいたい」"}, {"t": 1347.2166666666667, "x": "それは、ちょっと……。"}, {"t": 1348.4833333333333, "x": "議員は怒った。"}, {"t": 1349.5333333333333, "x": "「だまかされた方が悪いなんて、\nそんなの答弁になるかい」"}, {"t": 1352.85, "x": "国が財団法人の登記を\n認めたではないか、とも迫っている。"}, {"t": 1356.75, "x": "確かに、登記をしたのは国の役所だものね。"}, {"t": 1359.7333333333333, "x": "大臣も、法律の穴があることは認めていた。"}, {"t": 1362.6833333333334, "x": "財団法人の名を勝手に使っても、\n罰する規定が無いのだ。"}, {"t": 1367.0666666666666, "x": "看板の話の続きをする。"}, {"t": 1368.95, "x": "1977年10月の小委員会で、\n議員が登記簿を突きつけた。"}, {"t": 1373.5333333333333, "x": "財団法人天下一家の会は、\n法律上存在しないのではないか。"}, {"t": 1377.7833333333333, "x": "役所は認めたの？"}, {"t": 1379.2166666666667, "x": "認めた。その年の終わりごろ、\n登記は職権で抹消された。"}, {"t": 1383.0333333333333, "x": "名称の変更も理事の交代も、資産の変更も全部だ。"}, {"t": 1386.7666666666667, "x": "やった！　これで財団法人じゃなくなったのね。"}, {"t": 1389.6333333333334, "x": "登記簿の上ではそうなった。"}, {"t": 1391.2666666666667, "x": "ところが九段の看板はそのままだった。"}, {"t": 1393.6666666666667, "x": "翌年の国会で、議員はグラビアを持ち出している。"}, {"t": 1396.75, "x": "りっぱな看板が今も上がっているではないか。"}, {"t": 1399.2833333333333, "x": "大臣の答えは、これは良識の問題だった。"}, {"t": 1402.3166666666666, "x": "ずるい！　看板だけ残るの？"}, {"t": 1404.2333333333333, "x": "残った。1978年6月の国会でも、\nまだ掲げられていた。"}, {"t": 1409.1166666666666, "x": "若い人の勧誘に、それがまた使われていた。"}, {"t": 1412.1833333333334, "x": "若い人？"}, {"t": 1413.3, "x": "ここで話は大学に飛ぶ。"}, {"t": 1415.7333333333333, "x": "1978年。ねずみ講は京都の大学に広がっていた。"}, {"t": 1419.9166666666667, "x": "ある大学では運動部から始まったと報告されている。"}, {"t": 1423.1166666666666, "x": "先輩と後輩の関係は、断りにくい。"}, {"t": 1425.7666666666667, "x": "学生1万5000人のうち、\n1割の千数百人が入ったと推定された。"}, {"t": 1430.6, "x": "千人以上も！？"}, {"t": 1431.75, "x": "学生にそんな金は無い。そこでサラ金が出てくる。"}, {"t": 1434.8833333333334, "x": "学生証1枚で30万円を借りる。"}, {"t": 1437.3166666666666, "x": "30万円で1650万円になると聞かされて入る。"}, {"t": 1440.9333333333334, "x": "ひっかかったが最後、勉強が手につかない。"}, {"t": 1443.6166666666666, "x": "夏休みもアルバイトで、国へ帰らなかった学生がいた。"}, {"t": 1447.1833333333334, "x": "かわいそうに。"}, {"t": 1448.3, "x": "子の会員を作れず、家出した\n高校生の例も警察が報告している。"}, {"t": 1452.5166666666667, "x": "飛び火は速かった。大阪、\n兵庫、滋賀、愛知、岐阜へ。"}, {"t": 1456.3666666666666, "x": "京都と滋賀を中心に、35の大学の学長が動いた。"}, {"t": 1460.1, "x": "署名と捺印をつけて、ねずみ講の禁止を求めたのだ。"}, {"t": 1463.5666666666666, "x": "政府の案を待っていては間に合わない。"}, {"t": 1465.6, "x": "議員たちは、自分たちで法律を書くことにした。"}, {"t": 1469.25, "x": "舞台は衆議院の物価問題等に関する特別委員会だ。"}, {"t": 1472.85, "x": "1977年6月7日に小委員会ができていた。"}, {"t": 1476.7166666666667, "x": "委員会を5回、小委員会を9回重ねた。"}, {"t": 1479.5333333333333, "x": "1978年10月11日、党派を超えた案がまとまった。"}, {"t": 1483.9666666666667, "x": "法律には、新しい名前が付いた。"}, {"t": 1486.2833333333333, "x": "無限連鎖講の防止に関する法律。"}, {"t": 1488.75, "x": "むげんれんさこう？　かっこいい名前じゃない。"}, {"t": 1491.1333333333334, "x": "ねずみ講の、法律での名前だ。"}, {"t": 1493.25, "x": "第2条の定義がよくできている。"}, {"t": 1495.2166666666667, "x": "「一定額の金銭を支出する加入者が\n無限に増加するものであるとして」"}, {"t": 1499.6333333333334, "x": "「あるとして」？"}, {"t": 1500.7666666666667, "x": "無限に増えると称していれば当たる、という書き方だ。"}, {"t": 1503.8333333333333, "x": "そして二以上の倍率で増える、と条文に入れた。"}, {"t": 1506.7166666666667, "x": "掛け算そのものを、法律の言葉にしたのだ。"}, {"t": 1509.55, "x": "これで頼母子講とも区別がつく。"}, {"t": 1511.6666666666667, "x": "第1条には、もっとはっきり書いてある。"}, {"t": 1514.1333333333334, "x": "「終局において破たんすべき性質のもの」"}, {"t": 1516.8, "x": "法律が、必ずつぶれると言ってるの？"}, {"t": 1519.3333333333333, "x": "そうだ。かけ算の答えを、国が条文に書いた。"}, {"t": 1522.3666666666666, "x": "開設や運営は、3年以下の懲役か300万円以下の罰金。"}, {"t": 1526.3833333333334, "x": "勧誘も罰せられ、入ること自体も禁止された。"}, {"t": 1529.4166666666667, "x": "だまされたかどうかを問わずに、\n止められるようになったのだ。"}, {"t": 1532.75, "x": "会は黙ってたの？"}, {"t": 1534.1, "x": "審議のころ、天下一家の会から請願書が届いた。"}, {"t": 1537.3666666666666, "x": "無限の加入者は要らない、という内容だ。"}, {"t": 1539.8166666666666, "x": "議員の紹介では「\n会員数五百万人くらいで円軌道を描く」。"}, {"t": 1543.7166666666667, "x": "えんきどう？"}, {"t": 1544.85, "x": "同じ人が再加入を繰り返して、\nぐるぐる回るという理屈だ。"}, {"t": 1548.6, "x": "衆議院の法制局は、それでも該当すると答えた。"}, {"t": 1552.0666666666666, "x": "逃げ道をふさいだのね。"}, {"t": 1553.65, "x": "法律は1978年11月11日に公布された。"}, {"t": 1557.8166666666666, "x": "1967年3月の開始から、11年8か月がたっていた。"}, {"t": 1563.2, "x": "ただし、法律には猶予が付いた。"}, {"t": 1565.35, "x": "施行は、公布の日から6か月を過ぎてからだ。"}, {"t": 1568.2666666666667, "x": "議員たちが一番恐れたのは、駆け込みの勧誘だ。"}, {"t": 1571.3833333333334, "x": "止まる前に取り返そうと、\n末端の人が死にもの狂いで誘う。"}, {"t": 1575.3333333333333, "x": "財産はどうなるの？"}, {"t": 1576.7166666666667, "x": "1977年9月8日、会は総会で決めていた。"}, {"t": 1580.6166666666666, "x": "資産を宗教法人の大観宮の名義にする、と。"}, {"t": 1583.7166666666667, "x": "全国20か所ほどの保養所の看板が、\n大観宮に変わっていった。"}, {"t": 1587.8833333333334, "x": "ある議員は委員会で、印象深いたとえを使った。"}, {"t": 1590.8666666666666, "x": "ネズミはもぬけの殻で、親ネズミはよそへ行っている。"}, {"t": 1593.8833333333334, "x": "残るのは、子ネズミとやせネズミだけだ。"}, {"t": 1596.4666666666667, "x": "うまいこと言うけど、笑えないわね。"}, {"t": 1598.65, "x": "大観宮は「太子講」というものも始めていた。"}, {"t": 1601.7166666666667, "x": "5万円を出して、264万円を受け取る仕組みだ。"}, {"t": 1605.4166666666667, "x": "それって同じじゃない！"}, {"t": 1606.8166666666666, "x": "法務省の担当者も、個人の見解として\n該当するだろうと答えた。"}, {"t": 1611.0333333333333, "x": "会長は新聞にこう語っていたと、議員が紹介している。"}, {"t": 1614.5166666666667, "x": "机上の計算はそうなるが、うちの講は\n無限連鎖講にならない。"}, {"t": 1618.2166666666667, "x": "国が講を禁止させるのだから、国が責任を取るべきだ。"}, {"t": 1621.8833333333334, "x": "まだ言ってる！"}, {"t": 1623.0166666666667, "x": "1979年4月11日。ついにねずみ講の終結宣言が出た。"}, {"t": 1627.95, "x": "翌月、法律が施行された。"}, {"t": 1630.0666666666666, "x": "施行の翌日、熊本県の職員が大観宮を訪ねている。"}, {"t": 1633.8833333333334, "x": "太子講は今後一切行わない。そう回答があった。"}, {"t": 1637.2, "x": "これで本当に終わり？"}, {"t": 1638.6, "x": "ところが5月21日の朝日新聞が、別の話を伝えた。"}, {"t": 1642.7166666666667, "x": "「天下一家の会の被害者を救う」と\n称する新しい会が出たのだ。"}, {"t": 1646.8166666666666, "x": "被害者を救う会が、また同じことを？"}, {"t": 1649.3833333333334, "x": "文面まで、うり二つだったと議員は怒っている。"}, {"t": 1652.3166666666666, "x": "人口は将来に向かって無限である、と書いてあった。"}, {"t": 1656.05, "x": "1980年。内村健一は破産した。"}, {"t": 1659.2333333333333, "x": "報じられた債務は約1896億円だ。"}, {"t": 1662.4, "x": "その前の年、破産を求めて\n本部に立ち入りが行われている。"}, {"t": 1666.1333333333334, "x": "建物の中に、ほとんど財産は無かったと議員は語った。"}, {"t": 1669.8833333333334, "x": "先に移しちゃってたのね。"}, {"t": 1671.6666666666667, "x": "会員は最終的に、約102万人と報じられた。"}, {"t": 1674.9833333333333, "x": "ただし資料によって数字は違う。"}, {"t": 1676.9833333333333, "x": "1970年の国会では公称120万人。"}, {"t": 1680.3833333333334, "x": "公称80万人と書く人名事典もあり、\n150万人という説もあった。"}, {"t": 1685.25, "x": "全然そろわないのね。"}, {"t": 1686.8, "x": "入り直す人もいるから、数え方も難しい。"}, {"t": 1689.7166666666667, "x": "刑事の裁判も決着がついた。"}, {"t": 1691.8166666666666, "x": "20世紀日本人名事典によると、\n1983年7月に脱税で罰金7億円の判決。"}, {"t": 1698.5, "x": "7億円も払えたの？"}, {"t": 1700.1, "x": "払わずに、刑務所に入る道を選んだと書かれている。"}, {"t": 1703.25, "x": "懲役の年数は資料によって書き方が\n違うので、ここでは言わない。"}, {"t": 1707.2333333333333, "x": "1985年5月、刑の執行が止められて病院に入った。"}, {"t": 1711.5666666666666, "x": "そして1995年1月2日に亡くなった。"}, {"t": 1715.1, "x": "詐欺の罪には問われないまま？"}, {"t": 1716.9833333333333, "x": "問われないままだ。無限連鎖講の法律も、\nさかのぼっては使えない。"}, {"t": 1721.1, "x": "作られた法律は、これから先のためのものだった。"}, {"t": 1724.9, "x": "ここで少し時間を戻す。"}, {"t": 1726.6166666666666, "x": "1978年10月11日。"}, {"t": 1729.2333333333333, "x": "案を決めた、あの小委員会だ。"}, {"t": 1731.3, "x": "条文は「金銭」だ。金銭以外で逃げられないか。"}, {"t": 1734.6, "x": "そう心配する質問が出ている。"}, {"t": 1736.7166666666667, "x": "たとえば何？"}, {"t": 1737.85, "x": "土地の権利証や国債だ。"}, {"t": 1739.6166666666666, "x": "法務省の刑事課長は、こう答えた。"}, {"t": 1741.9666666666667, "x": "「国債をもって金銭にかえるという\nふうなやり方ではこれはとうていやっていけない」"}, {"t": 1746.4, "x": "国債じゃ無理って言ったのね。"}, {"t": 1748.25, "x": "ただし課長は、一言添えている。"}, {"t": 1750.4333333333334, "x": "これは「法律と人間との知恵比べ」でございます、と。"}, {"t": 1754.1333333333334, "x": "なんだか嫌な予感がする。"}, {"t": 1755.8833333333334, "x": "10年後の1988年2月23日。"}, {"t": 1759.15, "x": "衆議院の予算委員会。"}, {"t": 1760.75, "x": "あの法律づくりに加わった議員が立ち上がった。"}, {"t": 1763.5166666666667, "x": "30万円の元手の国債で、\n300万円の国債が返ってくる。"}, {"t": 1767.8, "x": "そういう会が現れたのだ。"}, {"t": 1769.5666666666666, "x": "本当に国債で！？"}, {"t": 1770.9833333333333, "x": "法務省の局長は答えた。"}, {"t": 1772.8, "x": "国債が金銭と言えるかには問題があろうかと。"}, {"t": 1775.65, "x": "法律はすぐ直された。"}, {"t": 1777.0333333333333, "x": "1988年の改正だ。"}, {"t": 1779.4833333333333, "x": "有価証券や貴金属まで広げ、\n「金銭」は「金品」になった。"}, {"t": 1783.7333333333333, "x": "委員会では、議員席から声が飛んでいる。"}, {"t": 1786.2833333333333, "x": "「大丈夫だ、我々の議員立法だから」"}, {"t": 1788.8833333333334, "x": "今度こそ大丈夫なの？"}, {"t": 1790.5333333333333, "x": "その2年前、宝石を売る\n会社の件は不起訴になっている。"}, {"t": 1794.1, "x": "物の販売が隠れみのだとまでは、\n立証できなかったのだ。"}, {"t": 1797.7, "x": "第70回で扱った豊田商事も、この法律の後の事件だ。"}, {"t": 1801.9333333333334, "x": "形を変えて出てくるのね。"}, {"t": 1803.75, "x": "1977年の議員の言葉が、そのまま当たっていた。"}, {"t": 1807.65, "x": "「形を変えた新手のネズミが\n次から次へと出てくるのです。」"}, {"t": 1811.7333333333333, "x": "最後に、被害者の金の話をする。"}, {"t": 1814.1833333333334, "x": "破産のあと、管財人の弁護士が\n残った財産を集めることになった。"}, {"t": 1818.55, "x": "管財人って？"}, {"t": 1819.7666666666667, "x": "裁判所に選ばれて、財産を管理して分ける人だ。"}, {"t": 1823.05, "x": "被害者のために、約30件の裁判を起こした。"}, {"t": 1826.2666666666667, "x": "最後まで残ったのは、国などに\n納めた税金の裁判だった。"}, {"t": 1830.1833333333334, "x": "税金を取り返すの？"}, {"t": 1831.6833333333334, "x": "こういう理屈だ。"}, {"t": 1832.75, "x": "会長は「団体」の形にして、法人税を納めていた。"}, {"t": 1836.5333333333333, "x": "だが実態は個人の事業で、団体など無かった。"}, {"t": 1839.6166666666666, "x": "それなら法人税は無効だから、返してもらおう。"}, {"t": 1842.6333333333334, "x": "なるほど！　あの看板を逆手に取るのね。"}, {"t": 1845.2333333333333, "x": "1984年2月27日、熊本地方裁判所で\n国の課税の一部が取り消された。"}, {"t": 1851.3, "x": "ある議員は、国が返す額は\n約150億円ぐらいと見積もった。"}, {"t": 1855.25, "x": "だが国は控訴した。"}, {"t": 1856.6666666666667, "x": "返還を求めた裁判は、1999年4月27日に\n福岡高等裁判所へ進んだ。"}, {"t": 1862.9833333333333, "x": "高裁は管財人を勝たせた。"}, {"t": 1864.8666666666666, "x": "この団体は、\n会長の個人事業の別の呼び名にすぎない。"}, {"t": 1868.3833333333334, "x": "課税は無効だ、という判断だ。"}, {"t": 1870.55, "x": "よかった！"}, {"t": 1871.6833333333334, "x": "ところが2004年7月13日。"}, {"t": 1873.9333333333334, "x": "最高裁判所第三小法廷。"}, {"t": 1876.0833333333333, "x": "裁判官全員一致で、これをひっくり返した。"}, {"t": 1879.1166666666666, "x": "えっ！？"}, {"t": 1880.25, "x": "理由はこうだ。外から見れば、団体の形は整っていた。"}, {"t": 1884.0666666666666, "x": "定款があり、総会があり、理事会があった。"}, {"t": 1886.85, "x": "支部で代表を選び、多数決もしている。"}, {"t": 1889.4833333333333, "x": "でも中身は違ったんでしょ？"}, {"t": 1891.2833333333333, "x": "仮に誤りでも、初めから\n外形上明らかだったとは言えない。"}, {"t": 1895.0333333333333, "x": "しかも本人が税務対策として、団体の形を作った。"}, {"t": 1898.8333333333333, "x": "判決は「高額の所得税の負担を免れた」とも\n書いている。"}, {"t": 1902.8166666666666, "x": "だから課税は当然には無効にならない。"}, {"t": 1905.2666666666667, "x": "会長が作った看板が、被害者の\nお金の前に立ちはだかったの？"}, {"t": 1909.45, "x": "結果としては、そういうことになる。"}, {"t": 1911.6166666666666, "x": "会長はもう、9年前に亡くなっていた。"}, {"t": 1914.7833333333333, "x": "2005年12月。破産の手続きが終わった。"}, {"t": 1917.8166666666666, "x": "確定した債権者は約6万7200人。"}, {"t": 1920.8666666666666, "x": "債権の総額は約220億円だ。"}, {"t": 1923.5833333333333, "x": "102万人のうちの6万7200人？"}, {"t": 1926.4166666666667, "x": "認められて記録に残ったのが、それだけだった。"}, {"t": 1929.45, "x": "1992年に約65億円の中間の配当があった。"}, {"t": 1933.5666666666666, "x": "最後に不動産などの約9億円が上乗せされた。"}, {"t": 1936.65, "x": "配当の率は34％だ。"}, {"t": 1939.0166666666667, "x": "3割ちょっと。"}, {"t": 1940.15, "x": "管財人は、大きな破産事件としては\n異例の高配当だと語った。"}, {"t": 1944.3166666666666, "x": "確定した債権が100万円なら、34万円になる計算だ。"}, {"t": 1948.5833333333333, "x": "しかも25年かかって。"}, {"t": 1950.3833333333334, "x": "冒頭の封筒を思い出してくれ。"}, {"t": 1952.3, "x": "朝に2通か3通の50万円が、\n人の手から手へ飛んでいた。"}, {"t": 1956.1166666666666, "x": "それを裁判所を通して集め直すのに、25年かかった。"}, {"t": 1960.3833333333334, "x": "今回使った記録をまとめて言う。"}, {"t": 1962.4666666666667, "x": "国会の記録は\n1970年12月17日の参議院大蔵委員会から始まる。"}, {"t": 1968.0, "x": "参考人の話は\n1977年5月19日の衆議院の特別委員会だ。"}, {"t": 1973.3333333333333, "x": "登記の追及は同じ年の10月18日の小委員会にある。"}, {"t": 1977.1666666666667, "x": "法務大臣のやり取りは\n1978年3月24日の参議院予算委員会。"}, {"t": 1982.4166666666667, "x": "法律の審議は1978年10月11日と\n12日、18日の記録を読んだ。"}, {"t": 1988.3833333333334, "x": "施行の後は1979年5月24日。"}, {"t": 1991.5833333333333, "x": "税金の裁判は1984年3月の記録だ。"}, {"t": 1995.2333333333333, "x": "国債の話は1988年2月23日と4月21日の記録だ。"}, {"t": 2000.7666666666667, "x": "最高裁の判決は、裁判所の判例検索で読める。"}, {"t": 2004.2833333333333, "x": "生没年は人名事典、配当の数字は\n2005年の新聞報道だ。"}, {"t": 2008.6666666666667, "x": "はっきりしなかったことは？"}, {"t": 2010.3666666666666, "x": "長野の判決の控訴審がどう終わったか。"}, {"t": 2012.9, "x": "懲役の年数と執行猶予の扱いの流れ。"}, {"t": 2015.7333333333333, "x": "本当の会員数と、本当の被害総額。"}, {"t": 2018.5666666666666, "x": "分からない数字は、分からないと言っておく。"}, {"t": 2021.0833333333333, "x": "あえて言わなかったこともある。"}, {"t": 2022.7166666666667, "x": "会員だった人の名前と、祝辞を述べた議員の名前だ。"}, {"t": 2026.8166666666666, "x": "ねえ、最初の友人の話に戻っていい？"}, {"t": 2029.5, "x": "いいぞ。"}, {"t": 2030.6166666666666, "x": "朝晩50万円の封筒を受け取ってた人。"}, {"t": 2033.15, "x": "あの人はもうかったのよね。"}, {"t": 2034.9833333333333, "x": "その時点ではな const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
