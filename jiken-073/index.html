<script>
const D={"name": "073", "file": "073_編集用", "dur": 2042.4833125, "segs": [], "subs": [{"t": 0.0, "x": "いま日本には、情報を提供すると\n国からお金が出る事件がある。"}, {"t": 4.016666666666667, "x": "国から？"}, {"t": 4.9, "x": "ああ。テレビ番組の企画でも、遺族が\n私費で出しているものでもない。"}, {"t": 8.9, "x": "警察庁が制度としてやっているものだ。"}, {"t": 11.333333333333334, "x": "名前を、捜査特別報奨金制度という。"}, {"t": 14.05, "x": "世間では、公的懸賞金と呼ばれることもある。"}, {"t": 17.05, "x": "今日はこの回で、いまこの制度がかかっている\n事件を、全部並べる。"}, {"t": 21.05, "x": "何件あると思う。"}, {"t": 22.366666666666667, "x": "……百件くらい？"}, {"t": 23.45, "x": "15件だ。"}, {"t": 24.466666666666665, "x": "たった？"}, {"t": 25.233333333333334, "x": "ああ。2026年9月の時点で、警察庁が\n公告を出しているのは15件だけだ。"}, {"t": 30.65, "x": "日本で起きた未解決事件は、これよりずっと多い。"}, {"t": 33.666666666666664, "x": "その中の15件に、いま国がお金をかけている。"}, {"t": 36.75, "x": "この回でやることは、単純だ。"}, {"t": 38.8, "x": "その15件を、古い順に並べる。"}, {"t": 41.083333333333336, "x": "何が起きて、何年たったのかを、\n公表されている範囲だけで言う。"}, {"t": 45.016666666666666, "x": "先に断っておく。"}, {"t": 46.36666666666667, "x": "この15件は全部、いま捜査が続いている事件だ。"}, {"t": 49.45, "x": "終わった話ではない。"}, {"t": 50.86666666666667, "x": "だから、犯人はこういう\n人物だ、という話は一切しない。"}, {"t": 54.6, "x": "似顔絵や特徴が公開されているものもあるが、\nそれを実在の誰かに結びつける話もしない。"}, {"t": 60.266666666666666, "x": "どの事件にも、待っている家族がいる。"}, {"t": 62.6, "x": "金額を、驚かせるために大きく言うこともしない。"}, {"t": 66.3, "x": "まず、この話がどこに書いてあるのかを言っておく。"}, {"t": 69.21666666666667, "x": "警察庁のホームページだ。"}, {"t": 70.91666666666667, "x": "「捜査特別報奨金制度の実施」というページがある。"}, {"t": 74.23333333333333, "x": "そこに、いま対象になっている\n事件が一覧で載っている。"}, {"t": 77.6, "x": "事件の名前、いつどこで起きたか、\nいくらか、いつまで受け付けるか。"}, {"t": 81.76666666666667, "x": "全部そこに書いてある。"}, {"t": 83.28333333333333, "x": "誰でも見られるの？"}, {"t": 84.61666666666666, "x": "見られる。無料だし、登録も要らない。"}, {"t": 86.96666666666667, "x": "このチャンネルでは毎回同じことを\n言っているが、もう一度言う。"}, {"t": 90.43333333333334, "x": "私がこの動画で話すことは、全部そこで確かめられる。"}, {"t": 94.05, "x": "それぞれの事件については、担当している\n都道府県の警察のページにも、\nもう少し詳しく載っている。"}, {"t": 100.15, "x": "似顔絵や、当時の現場の写真が出ているものもある。"}, {"t": 103.16666666666667, "x": "この回で私が話すのは、そこに書いてあることだけだ。"}, {"t": 106.6, "x": "書いていないことは、話さない。"}, {"t": 108.51666666666667, "x": "もう一つ。"}, {"t": 109.36666666666666, "x": "この一覧は、固定ではない。"}, {"t": 111.16666666666667, "x": "受け付けの期間が決まっていて、\nそれが切れると、その事件は一覧から消える。"}, {"t": 115.81666666666666, "x": "延長されることもあれば、そのまま終わることもある。"}, {"t": 118.76666666666667, "x": "だから、この動画を見ている時点の一覧は、\n私が話しているものと違うかもしれない。"}, {"t": 123.95, "x": "必ず、いまの警察庁のページを見てほしい。"}, {"t": 127.36666666666666, "x": "この制度がいつできたかを見ておく。"}, {"t": 129.38333333333333, "x": "2007年。平成でいうと19年だ。"}, {"t": 132.0, "x": "警察白書の平成21年版に、こう書かれている。"}, {"t": 135.46666666666667, "x": "「警察庁では、平成十九年度から、\n国民からの情報提供を促進し、」"}, {"t": 140.3, "x": "「重要犯罪等の検挙の徹底を図ることを目的として、」"}, {"t": 143.91666666666666, "x": "「捜査特別報奨金制度、公的懸賞金制度を導入し、」"}, {"t": 147.76666666666668, "x": "「警察庁ウェブサイト等で対象となる\n事件等について広報している」"}, {"t": 151.78333333333333, "x": "最初の公告が出たのが、2007年の5月だ。"}, {"t": 155.1, "x": "それより前は無かったの？"}, {"t": 156.73333333333332, "x": "国の制度としては無かった。"}, {"t": 158.53333333333333, "x": "遺族や企業が私費で\n懸賞金を出すことはあった。それは昔からある。"}, {"t": 162.68333333333334, "x": "だが、警察庁が予算を組んで公に\n呼びかける形は、2007年からだ。"}, {"t": 167.53333333333333, "x": "なぜこの時期だったのか。"}, {"t": 169.08333333333334, "x": "白書に書いてあるのは、さっきの一文だけだ。"}, {"t": 171.9, "x": "「国民からの情報提供を促進し、\n重要犯罪等の検挙の徹底を図る」"}, {"t": 176.66666666666666, "x": "それ以上の理由は、公表資料には書かれていない。"}, {"t": 179.56666666666666, "x": "だから私も、それ以上のことは言わない。"}, {"t": 182.08333333333334, "x": "ただ、時期は覚えておいてほしい。2007年だ。"}, {"t": 185.13333333333333, "x": "公訴時効が無くなるのは、\nこの3年後の2010年になる。"}, {"t": 189.38333333333333, "x": "次は金額の話だ。"}, {"t": 191.0, "x": "いま出ている15件は、全部、上限が300万円だ。"}, {"t": 194.65, "x": "全部同じ？"}, {"t": 195.68333333333334, "x": "ああ。15件とも300万円。"}, {"t": 197.73333333333332, "x": "ただし、制度の決まりには、もう一つの数字がある。"}, {"t": 200.91666666666666, "x": "原則は300万円。特に必要があると認めるときは、"}, {"t": 204.4, "x": "1,000万円を超えない範囲で増やすことができる。"}, {"t": 207.16666666666666, "x": "この二段構えは、2007年に\n制度ができたときからある。"}, {"t": 210.73333333333332, "x": "ここは、間違えて伝わっていることが多い。"}, {"t": 213.31666666666666, "x": "「300万円だったのが1,000万円に\n引き上げられた」という言い方をよく見る。"}, {"t": 217.61666666666667, "x": "それは違う。最初から両方書いてある。"}, {"t": 220.06666666666666, "x": "そして、いまのところ1,000万円が\n使われている事件は、一件も無い。"}, {"t": 224.33333333333334, "x": "一件も？"}, {"t": 225.25, "x": "ああ。15件とも300万円だ。"}, {"t": 227.5, "x": "もう一つ、混ざりやすい話がある。"}, {"t": 229.76666666666668, "x": "事件によっては、これとは別に、遺族や\n関係者が私費で懸賞金を出している。"}, {"t": 234.55, "x": "警察庁のページには、それも並べて書いてある。"}, {"t": 237.5, "x": "たとえば、いちばん額が大きい事件では、\n国の300万円と、私費の1,700万円が並んでいる。"}, {"t": 243.66666666666666, "x": "この二つは、出しているところが違う。"}, {"t": 246.05, "x": "国の300万円は税金だ。"}, {"t": 247.88333333333333, "x": "私費のほうは、遺族や関係者が\n自分で用意したお金だ。"}, {"t": 251.4, "x": "私は、この動画で額の大きさを売りにしない。"}, {"t": 254.2, "x": "ただ、私費のほうの金額が何を\n意味するかは、言っておきたい。"}, {"t": 257.9, "x": "あれは、家族が自分の生活を削って積んだ金額だ。"}, {"t": 261.8833333333333, "x": "ここから、15件を古い順に並べる。"}, {"t": 264.4166666666667, "x": "事件の名前は、警察庁が付けている\n呼び方をそのまま使う。"}, {"t": 268.25, "x": "中身は、公表されている範囲だけだ。"}, {"t": 270.6333333333333, "x": "まず、1990年代に起きた4件。"}, {"t": 273.5, "x": "一件目。1995年7月30日の午後9時15分ごろ、\n東京都八王子市大和田町。"}, {"t": 279.9166666666667, "x": "スーパーマーケットの2階の事務所で、\n女性の従業員3人がけん銃で殺害された事件だ。"}, {"t": 285.43333333333334, "x": "31年1か月がたっている。"}, {"t": 287.56666666666666, "x": "国の報奨金が300万円。これとは\n別に、私費の懸賞金が300万円。"}, {"t": 292.5, "x": "二件目。1996年7月7日、\n群馬県太田市高林東町のパチンコ店。"}, {"t": 298.53333333333336, "x": "当時4歳だった横山ゆかりさんが、\n店の中で行方が分からなくなった。"}, {"t": 302.98333333333335, "x": "群馬県警は、連れ去りの事件として\n捜査本部を置いている。"}, {"t": 306.53333333333336, "x": "30年2か月がたっている。"}, {"t": 308.43333333333334, "x": "国が300万円、私費が400万円。"}, {"t": 311.18333333333334, "x": "三十年……。四歳の子が。"}, {"t": 313.06666666666666, "x": "この子の名前と写真は、群馬県警が公開している。"}, {"t": 316.25, "x": "情報を集めるためだ。"}, {"t": 317.76666666666665, "x": "だから、この動画でも名前を出す。"}, {"t": 319.93333333333334, "x": "三件目。1996年9月9日、\n午後3時50分から4時39分までの間。"}, {"t": 326.06666666666666, "x": "東京都葛飾区柴又三丁目。"}, {"t": 328.5, "x": "当時21歳の女子大学生が自宅で殺害され、\nその家に火が付けられた事件だ。"}, {"t": 333.75, "x": "29年11か月。この動画を出す\nころには、ちょうど30年になる。"}, {"t": 338.1666666666667, "x": "国が300万円、私費が500万円。"}, {"t": 340.56666666666666, "x": "合わせて800万円だと警視庁が書いている。"}, {"t": 343.4, "x": "四件目。1998年1月14日の夜中、群馬県高崎市。"}, {"t": 348.4, "x": "当時は群馬町三ツ寺という地名だった。"}, {"t": 351.03333333333336, "x": "一家3人が殺害された事件だ。"}, {"t": 353.31666666666666, "x": "28年7か月がたっている。"}, {"t": 355.46666666666664, "x": "国が300万円。私費の懸賞金は無い。"}, {"t": 358.23333333333335, "x": "なお、亡くなった3人の続柄や\n年齢は、群馬県警は公表していない。"}, {"t": 362.85, "x": "報道で書かれているものはあるが、\nそれは警察が出した\n事実ではない。だからここでは言わない。"}, {"t": 368.18333333333334, "x": "この4件が、いま出ている中でいちばん古い。"}, {"t": 370.9166666666667, "x": "どれも、私が生まれるより前の話だ、という\n人がもう大勢いる年数だ。"}, {"t": 376.06666666666666, "x": "次は2000年代だ。ここがいちばん多い。8件ある。"}, {"t": 379.3333333333333, "x": "五件目。2000年12月30日の夜から31日の未明。"}, {"t": 383.46666666666664, "x": "東京都世田谷区上祖師谷三丁目。"}, {"t": 386.1, "x": "一家4人が殺害された強盗殺人事件だ。"}, {"t": 389.03333333333336, "x": "25年8か月。"}, {"t": 390.46666666666664, "x": "国が300万円。私費の懸賞金が1,700万円。"}, {"t": 394.05, "x": "さっき言った、いちばん額が大きい事件がこれだ。"}, {"t": 397.05, "x": "この事件は、前にやったわね。"}, {"t": 399.15, "x": "ああ。このチャンネルでも扱っている。"}, {"t": 401.28333333333336, "x": "六件目。2003年5月20日の午後3時ごろ、\n大阪府泉南郡熊取町七山。"}, {"t": 406.8666666666667, "x": "当時9歳、小学4年生だった\n吉川友梨さんの行方が分からなくなった。"}, {"t": 411.3833333333333, "x": "これも、大阪府警が名前と写真を公開している。"}, {"t": 414.55, "x": "23年3か月がたっている。国が300万円。"}, {"t": 417.8833333333333, "x": "七件目。2007年1月15日の午後7時45分ごろ、\n京都市左京区岩倉幡枝町の歩道。"}, {"t": 424.56666666666666, "x": "京都府警の文章はこうだ。"}, {"t": 426.1666666666667, "x": "「自転車で帰宅中の京都精華大学1年生が\n刃物で殺害されました」"}, {"t": 430.8666666666667, "x": "19年7か月。国が300万円。"}, {"t": 433.56666666666666, "x": "八件目。千葉県市原市姉崎の、不動産会社の事務所。"}, {"t": 437.56666666666666, "x": "経営者の男性が刃物で刺されて殺害された事件だ。"}, {"t": 440.9166666666667, "x": "ここは日付の書き方に注意が要る。"}, {"t": 442.98333333333335, "x": "2008年1月17日というのは、発見された日だ。"}, {"t": 446.9, "x": "千葉県警も「発見年月日」と書いている。"}, {"t": 449.7, "x": "起きた日ではない。"}, {"t": 450.8666666666667, "x": "18年7か月。国が300万円。"}, {"t": 453.6, "x": "九件目。2008年5月2日の午後7時半ごろ、\n愛知県豊田市生駒町の農道。"}, {"t": 459.1333333333333, "x": "部活動から帰る途中の女子高校生が襲われ、\n通学用のかばんが奪われた強盗殺人事件だ。"}, {"t": 465.15, "x": "18年4か月。国が300万円。"}, {"t": 467.85, "x": "十件目。2008年7月1日、岩手県宮古市。"}, {"t": 471.55, "x": "当時は下閉伊郡川井村だった山あいの地域だ。"}, {"t": 474.65, "x": "岩手県警の文章では「当時17歳の女性が\n遺体で発見された事件」となっている。"}, {"t": 479.98333333333335, "x": "18年2か月。国が300万円。"}, {"t": 482.6333333333333, "x": "十一件目。2009年7月17日の午後9時40分ごろ、\n鳥取市立川町六丁目の住宅街。"}, {"t": 489.53333333333336, "x": "タクシー運転手が襲われた強盗殺人事件。"}, {"t": 492.2, "x": "17年1か月。国が300万円。"}, {"t": 494.95, "x": "十二件目。2009年11月1日、\n新潟市東区空港西一丁目。"}, {"t": 500.03333333333336, "x": "これもタクシー運転手が襲われた強盗殺人事件だ。"}, {"t": 503.2, "x": "16年10か月。国が300万円。"}, {"t": 506.06666666666666, "x": "タクシーの運転手さんが、二人。"}, {"t": 508.3333333333333, "x": "ああ。別の県の、別の事件だ。"}, {"t": 511.23333333333335, "x": "残りは3件だ。"}, {"t": 512.4833333333333, "x": "十三件目。2010年11月3日の午前3時ごろ、\n石川県加賀市桑原町。"}, {"t": 517.9833333333333, "x": "コンビニエンスストアで起きた強盗殺人事件。"}, {"t": 520.7333333333333, "x": "15年10か月がたっている。国が300万円。"}, {"t": 523.8666666666667, "x": "この事件については、犯人の映像と、\n声が公開されている。"}, {"t": 527.7, "x": "石川県警のページで、いま誰でも見られるし、聞ける。"}, {"t": 531.1166666666667, "x": "十四件目。2012年9月2日の午前3時43分ごろ、\n東京都港区六本木五丁目。"}, {"t": 537.4833333333333, "x": "雑居ビルの2階の店の中で、複数の人物が\n一人の男性客を殴って殺害した事件だ。"}, {"t": 543.3833333333333, "x": "警視庁の書き方では、そのうち「\n唯一逃走を続けている主犯格の男」を手配している。"}, {"t": 549.1833333333333, "x": "ちょうど14年。国が300万円、私費が300万円。"}, {"t": 552.7333333333333, "x": "十五件目。2022年6月29日、大分県別府市の交差点。"}, {"t": 557.5166666666667, "x": "大学生2人が被害に遭った事件だ。"}, {"t": 559.9833333333333, "x": "4年2か月。国が300万円、私費が500万円。"}, {"t": 563.6333333333333, "x": "これはまだ4年なのね。"}, {"t": 565.2166666666667, "x": "ああ。この15件の中では、いちばん新しい。"}, {"t": 568.0833333333334, "x": "全部並べたので、幅を言っておく。"}, {"t": 570.2833333333333, "x": "いちばん古い1995年の事件から、\nいちばん新しい2022年の事件まで。"}, {"t": 575.7833333333333, "x": "31年から、4年まで。"}, {"t": 577.8, "x": "この幅の広さは、私は大事だと思っている。"}, {"t": 580.7833333333333, "x": "未解決事件というと、何十年も\n前の話だと思われがちだ。"}, {"t": 584.7833333333333, "x": "だが、4年前の事件も、いま情報を待っている。"}, {"t": 588.4833333333333, "x": "15件を並べて、私が気づいたことを言う。"}, {"t": 591.2666666666667, "x": "ここからは私の見方だ。"}, {"t": 592.85, "x": "事実と分けて聞いてほしい。"}, {"t": 594.5833333333334, "x": "一つ目。働いている場所と、その行き帰りが多い。"}, {"t": 597.8666666666667, "x": "スーパーの事務所。不動産会社の事務所。"}, {"t": 600.3666666666667, "x": "コンビニ。飲食店。タクシー。"}, {"t": 602.4166666666666, "x": "15件のうち、かなりの数がそこに集まっている。"}, {"t": 605.6, "x": "仕事中に。"}, {"t": 606.6833333333333, "x": "ああ。"}, {"t": 607.1, "x": "二つ目。夜と、明け方が多い。"}, {"t": 609.35, "x": "午後9時すぎ、午後9時40分、\n午前3時、午前3時43分。"}, {"t": 613.8333333333334, "x": "時刻が公表されているものを見ると、\nその時間帯に寄っている。"}, {"t": 617.5666666666667, "x": "見ている人が少ない時間だ、ということだと思う。"}, {"t": 620.6, "x": "三つ目。場所が全国にばらけている。"}, {"t": 623.0, "x": "東京が3件。群馬が2件。"}, {"t": 624.85, "x": "あとは大阪、京都、愛知、千葉、\n岩手、鳥取、新潟、石川、大分。"}, {"t": 630.2833333333333, "x": "都会の事件だけではない。"}, {"t": 631.9, "x": "山あいの地域も、地方都市の住宅街も入っている。"}, {"t": 635.1666666666666, "x": "四つ目。これが私はいちばん重いと思っている。"}, {"t": 638.1166666666667, "x": "15件のうち2件が、子どもが連れ去られた事件だ。"}, {"t": 641.3333333333334, "x": "1996年の群馬の事件と、2003年の大阪の事件。"}, {"t": 645.75, "x": "どちらも、まだ見つかっていない。"}, {"t": 647.85, "x": "……見つかっていない。"}, {"t": 649.05, "x": "ああ。"}, {"t": 649.45, "x": "この2件については、この後もう一度話す。\nほかの13件とは、制度の上での扱いが違うからだ。"}, {"t": 655.8, "x": "五つ目。これは並べてみて意外だったことだ。"}, {"t": 658.5833333333334, "x": "15件のうち4件は、誰がやったかがもう分かっている。"}, {"t": 662.0666666666667, "x": "分かっているの？"}, {"t": 663.1666666666666, "x": "警察庁が「指定重要指名手配被疑者」として\n名前と顔写真を公開している人がいる。"}, {"t": 668.8, "x": "2025年の指定は全部で10人。そのうち\n4人が、この15件の事件の被疑者だ。"}, {"t": 674.15, "x": "群馬の一家3人の事件。"}, {"t": 675.7666666666667, "x": "岩手の宮古の事件。六本木の事件。別府の事件。"}, {"t": 679.1666666666666, "x": "この4件は、逮捕できていないだけで、\n誰を捜しているかは公開されている。"}, {"t": 683.7166666666667, "x": "この動画では、その4人の名前は読み上げない。"}, {"t": 686.4833333333333, "x": "警察庁のページに顔写真と一緒に\n載っているので、そちらを見てほしい。"}, {"t": 690.7, "x": "私が名前を読み上げると、それを聞いた人の中で\n「似た名前の別人」と混ざる恐れがある。"}, {"t": 696.35, "x": "このチャンネルは、その事故が\n起きた回を一本作っている。"}, {"t": 699.7333333333333, "x": "残りの11件は、まだ誰を捜すかも分かっていない。"}, {"t": 703.0, "x": "似顔絵や、体つきの特徴が\n公開されているものはある。"}, {"t": 706.45, "x": "だが、名前は分かっていない。"}, {"t": 708.8666666666667, "x": "さっき「この一覧は固定ではない」と\n言った。そこを詳しく話す。"}, {"t": 712.9666666666667, "x": "この制度には、決まりを書いた文書がある。"}, {"t": 715.4166666666666, "x": "捜査特別報奨金取扱要綱という。"}, {"t": 718.0666666666667, "x": "警察庁のページで、そのまま読める。"}, {"t": 720.5, "x": "そこに、こう書いてある。"}, {"t": 721.9833333333333, "x": "「長官は、対象事件について被疑者の検挙又は"}, {"t": 725.0333333333333, "x": "事件の解決があった\n場合その他指定の必要がなくなった場合には、」"}, {"t": 728.9, "x": "「速やかに、対象事件の指定を取り消すものとする」"}, {"t": 732.1, "x": "取り消されると、警察庁のページから、\nその事件の広告が消える。"}, {"t": 736.3666666666667, "x": "消えたら、解決したってこと？"}, {"t": 738.5333333333333, "x": "そう決めつけられないところが、\nこの話の難しいところだ。"}, {"t": 742.1166666666667, "x": "文章をもう一度読んでほしい。"}, {"t": 743.85, "x": "「被疑者の検挙又は事件の解決があった場合」、\nそして「その他指定の必要がなくなった場合」。"}, {"t": 749.6333333333333, "x": "二つ書いてある。"}, {"t": 750.75, "x": "実際に、この1年で一覧から消えた事件がある。"}, {"t": 753.9166666666666, "x": "名古屋市西区で起きた事件だ。"}, {"t": 755.6833333333333, "x": "2025年の2月に広告が出て、"}, {"t": 758.2333333333333, "x": "その年の12月には「指定の取消し」と\n表示され、2026年には一覧から消えた。"}, {"t": 764.0666666666667, "x": "なぜ取り消されたのか。その理由は、\n警察庁の公表資料には書かれていない。"}, {"t": 768.7, "x": "だから私は、この事件が\n解決したとも、していないとも言わない。"}, {"t": 772.8166666666667, "x": "分からないことは、分からないと言う。"}, {"t": 774.9333333333333, "x": "もう一つ、逆の動きもある。"}, {"t": 776.9, "x": "さっき最後に挙げた、別府市の事件だ。"}, {"t": 779.4166666666666, "x": "この事件は、最初は\n「死亡ひき逃げ事件」として広告が出ていた。"}, {"t": 783.7333333333333, "x": "それが一度取り消されて、2025年に、\n罪名を変えて出し直されている。"}, {"t": 788.3666666666667, "x": "いまの手配の罪名は、殺人と、\n殺人未遂と、道路交通法違反だ。"}, {"t": 793.2333333333333, "x": "ひき逃げから、殺人に？"}, {"t": 795.1166666666667, "x": "ああ。そう変わったことが、公の記録に残っている。"}, {"t": 798.4333333333333, "x": "なぜ変わったのかは、公表資料には書かれていない。"}, {"t": 801.4, "x": "捜査が進んで、見方が変わったのだろう、とは\n思う。だがそれは私の推測だ。"}, {"t": 806.35, "x": "この二つが言っているのは、同じことだ。"}, {"t": 808.8333333333334, "x": "この一覧は、生きて動いている。"}, {"t": 810.8666666666667, "x": "終わった事件の墓標ではなくて、\nいま動いている捜査の窓口だ。"}, {"t": 815.2833333333333, "x": "ここは、間違えて\n伝わりやすいところなので、丁寧に言う。"}, {"t": 818.7666666666667, "x": "さっき出した15件のうち、13件は殺人か強盗殺人だ。"}, {"t": 822.8833333333333, "x": "法律の条文に当てはめると、\nこの13件には、いま公訴時効が無い。"}, {"t": 827.2333333333333, "x": "2010年に廃止されたからだ。"}, {"t": 829.15, "x": "何年たっても裁判にかけられる。"}, {"t": 831.3166666666667, "x": "ただし、これは私が条文を読んで当てはめた話だ。"}, {"t": 834.5333333333333, "x": "警察の公表資料には、事件ごとに\n時効があるか無いかは書かれていない。"}, {"t": 838.8, "x": "だが、残りの2件は違う。"}, {"t": 840.6666666666666, "x": "群馬の事件と、大阪の事件だ。"}, {"t": 842.9666666666667, "x": "この2件の罪名は、略取誘拐。"}, {"t": 845.1333333333333, "x": "人を連れ去った罪だ。"}, {"t": 846.8166666666667, "x": "殺人じゃない？"}, {"t": 847.9333333333333, "x": "この2件は、まだ被害に遭った\n子どもが見つかっていない。"}, {"t": 851.2, "x": "だから、何の罪として扱うかが、\n連れ去りのところで止まっている。"}, {"t": 855.3, "x": "そして、2010年に時効が無くなったのは「人を\n死亡させた罪であって、死刑にあたるもの」だ。"}, {"t": 861.4166666666666, "x": "連れ去りの罪は、その中に入っていない。"}, {"t": 863.9833333333333, "x": "つまり、この2件については\n「時効が無い」とは言えない。"}, {"t": 867.35, "x": "ネットでは、この15件を全部まとめて\n「時効が無い事件」と説明しているものがある。"}, {"t": 872.6166666666667, "x": "それは正確ではない。"}, {"t": 873.9833333333333, "x": "私も、この回を作るまで同じように思っていた。"}, {"t": 877.0833333333334, "x": "警察庁の事件名をきちんと読んで、初めて気づいた。"}, {"t": 880.6166666666667, "x": "名前に書いてあるのね。"}, {"t": 882.15, "x": "ああ。「略取誘拐容疑事件」\n「未成年者略取誘拐事件」と、そのまま書いてある。"}, {"t": 887.3, "x": "それでも、この2件に国が\n報奨金をかけ続けているという事実は残る。"}, {"t": 891.7333333333333, "x": "制度の対象から外していない、ということだ。"}, {"t": 895.1166666666667, "x": "ここで、時効の話をしておく。"}, {"t": 897.2166666666667, "x": "このチャンネルでは、以前に公訴時効の回をやった。"}, {"t": 900.25, "x": "おさらいすると、こういうことだ。"}, {"t": 902.1333333333333, "x": "昔は、人を殺しても、一定の年数が過ぎると、\nもう裁判にかけられなくなった。"}, {"t": 907.4166666666666, "x": "その年数が、公訴時効だ。"}, {"t": 909.3666666666667, "x": "強盗殺人の時効は、もともと15年だった。"}, {"t": 912.4333333333333, "x": "2005年にそれが25年に延ばされた。"}, {"t": 915.0166666666667, "x": "そして2010年、人を死なせて死刑にあたる\n罪について、時効そのものが無くなった。"}, {"t": 920.4166666666666, "x": "いつまでも捕まえられる、ということ？"}, {"t": 922.75, "x": "そういうことだ。"}, {"t": 923.75, "x": "当時の国会では、こんな言い方がされている。"}, {"t": 926.4833333333333, "x": "「それからわずか五年足らずで、\nさらに時効が廃止される」"}, {"t": 929.8, "x": "25年に延ばしてから、5年も\nたたずに、無期限になった。"}, {"t": 933.6, "x": "それだけ、この問題に対する\n声が強かったということだ。"}, {"t": 937.1333333333333, "x": "ただし、この改正には慎重な意見もあった。"}, {"t": 939.9166666666666, "x": "過去の事件にさかのぼって\n適用していいのか、という憲法上の問題。"}, {"t": 944.0833333333334, "x": "証拠を保管する体制が伴っていない、という指摘。"}, {"t": 947.3166666666667, "x": "2005年に延ばした結果がまだ分からない\n段階で、また変えるのか、という声。"}, {"t": 952.0166666666667, "x": "私はどちらの立場も取らない。こういう\n議論があった、というところまでだ。"}, {"t": 956.3, "x": "そのうえで、この回で言いたいのは別のことだ。"}, {"t": 959.0166666666667, "x": "時効が無くなった。それでも、事件は解けていない。"}, {"t": 962.3166666666667, "x": "時効が無くなっても解けないの？"}, {"t": 964.35, "x": "そこが、この回のいちばん大事なところだ。"}, {"t": 966.9833333333333, "x": "時効が無くなるまでの経緯も、記録に残っている。"}, {"t": 970.0166666666667, "x": "2010年4月27日、衆議院の法務委員会での説明だ。"}, {"t": 974.3, "x": "「平成二十一年一月、当時、\n被害者の遺族の方々を中心として、」"}, {"t": 979.0333333333333, "x": "「殺人等の凶悪重大犯罪の公訴時効のあり方について\n見直しを求める声が高まっていた」"}, {"t": 984.7, "x": "「こういう中で、この点に関する\nさまざまな御意見を参考にしながら、」"}, {"t": 988.7333333333333, "x": "「殺人等の凶悪重大犯罪の公訴時効のあり方について\n検討を行うために省内勉強会が設置をされ」"}, {"t": 995.25, "x": "2009年1月に、遺族の声を受けて\n役所の中に勉強会ができた。"}, {"t": 999.8, "x": "そこから1年3か月で、法律が変わっている。"}, {"t": 1003.0, "x": "一年三か月？"}, {"t": 1004.3833333333333, "x": "ああ。"}, {"t": 1004.7833333333333, "x": "このチャンネルでは、制度が動くのに\n何十年もかかった話を何度もしてきた。"}, {"t": 1009.4833333333333, "x": "再審のやり方が変わるまでに\n五十八年かかった回もある。"}, {"t": 1013.0333333333333, "x": "それに比べると、これは異例の速さだ。"}, {"t": 1015.45, "x": "ただし、説明ではこうも言っている。"}, {"t": 1017.5833333333334, "x": "「結論ありきではなくて、そもそも制度改正が\n必要かという根本的なところからスタートをされて」"}, {"t": 1023.4666666666667, "x": "早かったことを、良かったとも\n悪かったとも、私は言わない。"}, {"t": 1027.1833333333334, "x": "ただ、なぜそこまで急いだのかには、\nはっきりした理由がある。"}, {"t": 1031.45, "x": "2010年4月6日、参議院の法務委員会。"}, {"t": 1034.5, "x": "千葉景子 法務大臣が、こう答えている。"}, {"t": 1037.2666666666667, "x": "「一番近く時効が、これまでの年数ですと、\n公訴時効が完成をするとなるのが」"}, {"t": 1042.2166666666667, "x": "「東京の八王子市内のスーパーに\nおける強盗殺人事件、」"}, {"t": 1045.65, "x": "「これは東京都八王子市内の\nスーパーマーケット事務所において女性三名が"}, {"t": 1049.75, "x": "射殺された事件でございまして、」"}, {"t": 1051.6833333333334, "x": "「時効の完成が\n本年の七月三十日ということになります」"}, {"t": 1055.6333333333334, "x": "……七月三十日？"}, {"t": 1057.1166666666666, "x": "気づいたか。"}, {"t": 1057.9666666666667, "x": "さっき、この回のいちばん最初に並べた事件だ。"}, {"t": 1061.0, "x": "1995年7月30日、\n八王子市大和田町のスーパーの事務所。"}, {"t": 1066.0, "x": "15年で、2010年の7月30日に\n時効が来ることになっていた。"}, {"t": 1070.5166666666667, "x": "この答弁があったのが、その年の4月6日だ。"}, {"t": 1073.55, "x": "法律が成立したのが、4月27日。"}, {"t": 1076.65, "x": "三か月前。"}, {"t": 1077.8166666666666, "x": "ああ。"}, {"t": 1078.2333333333333, "x": "同じ月の衆議院の委員会でも、こう述べられている。"}, {"t": 1081.3666666666666, "x": "「東京八王子市内のスーパーにおける強盗殺人事件、"}, {"t": 1084.5666666666666, "x": "女性三名の射殺、これが\n本年七月三十日に時効完成する」"}, {"t": 1089.05, "x": "「こういう状況の中で今回の法案というものが、\nそれこそ、ある意味では、」"}, {"t": 1093.35, "x": "「前政権から継続して精力的に\nなされてこういう法案になった」"}, {"t": 1097.3333333333333, "x": "この事件は、いま報奨金がかかっている\n15件の中で、いちばん古い事件だ。"}, {"t": 1102.1666666666667, "x": "そして、時効まであと3か月という\nところで、時効そのものが無くなった。"}, {"t": 1106.65, "x": "私は、この回を作るまで、この二つが\nつながっているとは知らなかった。"}, {"t": 1111.0666666666666, "x": "報奨金の一覧と、2010年の国会の記録は、\n別々のところにある。"}, {"t": 1115.8333333333333, "x": "並べて初めて分かる。"}, {"t": 1117.9333333333334, "x": "さっき「憲法上の問題があった」と\n言った。そこを少し詳しく話す。"}, {"t": 1122.4833333333333, "x": "2010年に時効が無くなったとき、\nいちばん争われたのがここだ。"}, {"t": 1126.5166666666667, "x": "時効が無くなる前に起きた事件に、\nこの新しい決まりを当てはめていいのか。"}, {"t": 1130.9833333333333, "x": "起きたときには、まだ時効があったのに？"}, {"t": 1133.4666666666667, "x": "そうだ。"}, {"t": 1134.0666666666666, "x": "憲法39条には、あとから作った決まりでさかのぼって\n罰してはいけない、という考え方がある。"}, {"t": 1140.0333333333333, "x": "国会でも、こう質されている。"}, {"t": 1142.0166666666667, "x": "「本法案についての遡及適用は\n憲法三十九条の精神に違反しないか」"}, {"t": 1146.5666666666666, "x": "この争いには、決着がついている。"}, {"t": 1148.9, "x": "最高裁判所が判断を出しているからだ。"}, {"t": 1151.4666666666667, "x": "2015年12月3日、最高裁判所第一小法廷の判決。"}, {"t": 1155.95, "x": "扱われたのは、1997年4月13日に\n起きた強盗殺人の事件だ。"}, {"t": 1161.3833333333334, "x": "起訴されたのは2013年2月22日。"}, {"t": 1164.1666666666667, "x": "事件から15年以上たっている。"}, {"t": 1166.2666666666667, "x": "判決の文章を読む。"}, {"t": 1167.75, "x": "「本法は、人を死亡させた罪であって、死刑に\n当たるものについて公訴時効を廃止し、」"}, {"t": 1172.8833333333334, "x": "「懲役又は禁錮の刑に当たるものについて\n公訴時効期間を延長したにすぎず、」"}, {"t": 1177.5, "x": "「行為時点における違法性の評価や\n責任の重さを遡って変更するものではない」"}, {"t": 1182.3833333333334, "x": "そして、こう結んでいる。"}, {"t": 1183.9833333333333, "x": "「憲法三十九条、三十一条に違反せず、\nそれらの趣旨に反するとも認められない」"}, {"t": 1189.35, "x": "合憲、ということ？"}, {"t": 1190.8, "x": "ああ。裁判官全員の一致だ。"}, {"t": 1192.85, "x": "つまり、いま報奨金がかかっている事件のうち、"}, {"t": 1195.7333333333333, "x": "2010年の時点で時効が来ていなかったものは、\nいまも裁判にかけられる。"}, {"t": 1200.1666666666667, "x": "この判決で、そこがはっきりした。"}, {"t": 1202.4833333333333, "x": "ただし、逆に言えば、2010年より前に\n時効が来てしまった事件は、その外にある。"}, {"t": 1207.7333333333333, "x": "ここは、あとでもう一度出てくる。"}, {"t": 1210.35, "x": "時効が無くなると、何が起きるか。"}, {"t": 1212.6, "x": "当たり前の話だが、捜査が終わらなくなる。"}, {"t": 1215.3666666666666, "x": "そして、証拠を捨てられなくなる。"}, {"t": 1217.4666666666667, "x": "2010年4月13日、参議院の法務委員会。"}, {"t": 1220.8, "x": "この法律を出した側の、中井洽 法務大臣の答弁だ。"}, {"t": 1224.7666666666667, "x": "「問題は、先生も御指摘の、\n保管場所をどういうふうにこれから、」"}, {"t": 1228.6666666666667, "x": "「証拠の保管場所を、四十年、五十年と\n残していくわけでございます、」"}, {"t": 1232.9666666666667, "x": "「これをどういうふうにするのかなというのを\nちょっと頭を正直痛めているんじゃないかと"}, {"t": 1237.0, "x": "私は思っております」"}, {"t": 1238.7166666666667, "x": "大臣が、頭を痛めている？"}, {"t": 1240.8166666666666, "x": "法案を出した側の人が、そう言っている。"}, {"t": 1243.3833333333334, "x": "同じ月の27日、衆議院の法務委員会では、\nこういう指摘も出ている。"}, {"t": 1248.0666666666666, "x": "証拠の扱いについては、1995年9月6日付で、\n警察庁から各都道府県警に指針が出されている。"}, {"t": 1255.3833333333334, "x": "だが、その指針には、こう書かれていないという。"}, {"t": 1258.2166666666667, "x": "「具体的に保管期間をどうするのかということが\n触れられておりません」"}, {"t": 1261.9666666666667, "x": "どれだけ持っておくのか、が決まっていない。"}, {"t": 1264.4333333333334, "x": "時効が無くなったのは2010年だ。"}, {"t": 1266.6833333333334, "x": "その時点で、いま報奨金がかかっている事件の\nいくつかは、もう何年も前に起きている。"}, {"t": 1271.9833333333333, "x": "現場から採った物が、何十年ぶんも積み上がっていく。"}, {"t": 1275.3333333333333, "x": "捜査本部も、置かれたまま残る。"}, {"t": 1277.5166666666667, "x": "同じ委員会で、中井大臣はこうも言っている。"}, {"t": 1280.3, "x": "「やはり捜査本部が置かれた\nその署あるいは県におきまして\n未解決事件を抱えるということは、」"}, {"t": 1285.4833333333333, "x": "「遺族の、被害者のお気持ちやら考えますと本当に\n堪えられない、悔しさも残るわけでございます」"}, {"t": 1291.2166666666667, "x": "時効を無くしたことで、終わらせられなくなった。"}, {"t": 1294.0166666666667, "x": "それは、被害者の側にとっても、\n捜査の側にとっても、同じことだ。"}, {"t": 1299.0166666666667, "x": "ここで、私がこの回でいちばん\n紹介したかった発言を出す。"}, {"t": 1302.8833333333334, "x": "2010年4月23日、衆議院の法務委員会。"}, {"t": 1306.35, "x": "参考人として呼ばれた、\n片山徒有さんという方の言葉だ。"}, {"t": 1310.2333333333333, "x": "この人は、交通事故で子どもを亡くした遺族で、"}, {"t": 1313.2166666666667, "x": "そのあと長く、被害者の支援と、\n事件の情報提供の窓口をやってきた方だ。"}, {"t": 1318.3166666666666, "x": "まず、こう言っている。"}, {"t": 1319.6166666666666, "x": "「私もそのような\n事件の情報提供の窓口をやっておりまして、」"}, {"t": 1323.4166666666667, "x": "「被害者側の思いというのが、"}, {"t": 1325.05, "x": "怖さではなくて強さで伝わっているなということを\n随分受けとめてまいりました」"}, {"t": 1329.65, "x": "怖さではなくて、強さ。"}, {"t": 1331.5166666666667, "x": "そして、これだ。"}, {"t": 1332.7333333333333, "x": "「最近も、その情報提供ボックスを見てみますと、\n少し報道がされるごとに情報が集まっておりまして、」"}, {"t": 1338.9833333333333, "x": "「五年たって六年たって十年たっても、\n決して人々は忘れていない、」"}, {"t": 1343.2166666666667, "x": "「この国の国民は皆、好意的であるという\nふうに私は実感をしているところでございます」"}, {"t": 1348.6166666666666, "x": "報道されるたびに、情報が。"}, {"t": 1350.6833333333334, "x": "ああ。"}, {"t": 1351.0833333333333, "x": "これは、感情の話ではない。"}, {"t": 1352.9, "x": "窓口を実際にやってきた人の、実感だ。"}, {"t": 1355.9333333333334, "x": "少し取り上げられるだけで、情報が動く。"}, {"t": 1358.55, "x": "10年たっても動く。"}, {"t": 1359.95, "x": "私がこの回を作ろうと思ったのは、\nこの一文を読んだからだ。"}, {"t": 1364.3833333333334, "x": "ただし、同じ人が、同じ日に、こうも言っている。"}, {"t": 1367.5333333333333, "x": "ここは飛ばさずに読む。"}, {"t": 1368.9166666666667, "x": "「したがって、公訴時効を長くして、\n延ばして、なくしてしまって、」"}, {"t": 1373.0166666666667, "x": "「それで終わりというのは、被害者に\nとってもいいことではないというふうに思います」"}, {"t": 1377.45, "x": "え。遺族の人が？"}, {"t": 1378.9166666666667, "x": "ああ。続きがある。"}, {"t": 1380.1333333333334, "x": "「被害者にもその後の人生があります。"}, {"t": 1382.2833333333333, "x": "立ち直って幸せになっていく必要があると思います」"}, {"t": 1385.5166666666667, "x": "「被害者で終わりたくない、それを\n克服して新たな人生を築き上げたいと、」"}, {"t": 1389.85, "x": "「だれもが思っていることではないかなと\n思っております」"}, {"t": 1392.85, "x": "私は、この言葉を必ず入れようと決めていた。"}, {"t": 1395.8333333333333, "x": "未解決事件を扱う動画は、\nどうしても一つの形になりやすい。"}, {"t": 1399.95, "x": "「遺族はいまも真相を待っている」\n「風化させてはいけない」"}, {"t": 1403.1166666666666, "x": "どちらも間違いではない。"}, {"t": 1404.4666666666667, "x": "私も何度も言ってきた。"}, {"t": 1406.2, "x": "だが、遺族は一人ではないし、みんなが\n同じ気持ちでいるわけでもない。"}, {"t": 1410.3, "x": "事件から時間がたてば、結婚する\n人もいるし、就職する人もいる。"}, {"t": 1414.7666666666667, "x": "それぞれの生活が、また歩き出す。"}, {"t": 1417.0666666666666, "x": "この参考人は、そういう話をしている。"}, {"t": 1419.6333333333334, "x": "同じ2010年の委員会には、こういうやりとりもある。"}, {"t": 1422.8166666666666, "x": "時効の廃止に反対する側が\n配っていたビラについての質問だ。"}, {"t": 1426.7333333333333, "x": "そこには、こう書かれていたという。"}, {"t": 1428.75, "x": "「被害者・遺族の方々の声は多様です」"}, {"t": 1431.4666666666667, "x": "「公訴時効の廃止・延長をもって\n被害者救済とするなら、あまりに安易です」"}, {"t": 1436.2333333333333, "x": "……多様。"}, {"t": 1436.8833333333334, "x": "この言葉を、私はこの回の途中で何度も思い出した。"}, {"t": 1440.4, "x": "法務大臣も、同じ委員会でこう述べている。"}, {"t": 1443.1, "x": "「公訴時効の廃止をめぐりましては、被害者、\n御遺族の方々の中にもさまざまな御意見がある」"}, {"t": 1448.8333333333333, "x": "遺族の気持ちを一つにまとめて\n代弁するようなことを、私はしない。"}, {"t": 1452.9166666666667, "x": "だから私は、この回で「忘れるな」とは言わない。"}, {"t": 1456.1833333333334, "x": "言うのは、これだけだ。"}, {"t": 1457.6, "x": "情報を持っている人がいるなら、\nそれを届ける先が用意されている。"}, {"t": 1462.1333333333334, "x": "風化、という言葉がよく使われる。"}, {"t": 1464.35, "x": "この言葉は、あいまいなまま使われることが多い。"}, {"t": 1467.1833333333334, "x": "だからここで、具体的に何が\n失われるのかを言っておく。"}, {"t": 1470.6833333333334, "x": "一つ目。人の記憶だ。"}, {"t": 1472.5, "x": "見た人が、見たことを思い出せなくなる。"}, {"t": 1474.9666666666667, "x": "これはいちばん早い。"}, {"t": 1476.05, "x": "事件の直後から始まっている。"}, {"t": 1478.1166666666666, "x": "二つ目。人そのものだ。"}, {"t": 1479.9666666666667, "x": "目撃した人が高齢になり、亡くなっていく。"}, {"t": 1482.8833333333334, "x": "40年前の事件なら、当時40歳だった\n目撃者は、いま80歳だ。"}, {"t": 1487.8666666666666, "x": "時間が経つほど、聞ける人が減っていく。"}, {"t": 1490.6, "x": "ああ。"}, {"t": 1491.0166666666667, "x": "三つ目。物だ。"}, {"t": 1492.3, "x": "現場が建て替えられる。"}, {"t": 1493.55, "x": "道が変わる。当時の写真や記録が捨てられる。"}, {"t": 1496.5166666666667, "x": "捜査機関が持っている証拠は\n残るが、それ以外は残らない。"}, {"t": 1500.1333333333334, "x": "四つ目。これが私はいちばん大きいと思っている。"}, {"t": 1503.1166666666666, "x": "「あの事件を知っている人」が減ることだ。"}, {"t": 1505.6333333333334, "x": "情報提供というのは、心当たりのある\n人が思い出して初めて起きる。"}, {"t": 1509.8833333333334, "x": "事件そのものを知らなければ、思い出しようがない。"}, {"t": 1512.7833333333333, "x": "さっきの参考人が言っていたのは、まさにそこだ。"}, {"t": 1515.8166666666666, "x": "少し報道されるごとに、情報が集まる。"}, {"t": 1518.4666666666667, "x": "つまり、風化とは「思い出す\nきっかけが無くなること」だ。"}, {"t": 1522.6666666666667, "x": "ここで、この回の作り方について話しておく。"}, {"t": 1525.65, "x": "未解決事件をまとめて扱う動画は、たくさんある。"}, {"t": 1528.8666666666666, "x": "その多くは、犯人像を推理する形になっている。"}, {"t": 1531.9833333333333, "x": "この回では、それを一切やっていない。"}, {"t": 1534.3833333333334, "x": "一つも？"}, {"t": 1535.3, "x": "一つもだ。"}, {"t": 1536.2, "x": "理由は三つある。"}, {"t": 1537.3333333333333, "x": "一つ目。ここで挙げた事件は、\n全部まだ捜査が続いている。"}, {"t": 1541.1, "x": "終わった話ではない。いま\n情報を集めている最中の話だ。"}, {"t": 1544.8166666666666, "x": "私が筋書きを一つ立てると、それを見た\n人の記憶がその筋書きに寄る。"}, {"t": 1549.45, "x": "思い出してほしいのは、その人が\n実際に見たものであって、私の筋書きではない。"}, {"t": 1554.4833333333333, "x": "二つ目。似顔絵や特徴が公開されている事件がある。"}, {"t": 1557.8833333333334, "x": "あれを、実在の誰かに結びつけて\n名前を出すのは、絶対にやってはいけないことだ。"}, {"t": 1562.9333333333334, "x": "このチャンネルでは、\n松本サリン事件の回でその話をした。"}, {"t": 1566.65, "x": "通報した人が、1年近く犯人扱いされた回だ。"}, {"t": 1570.2833333333333, "x": "あれは、誰かが悪意でやったというより、"}, {"t": 1572.5166666666667, "x": "手近な筋書きに、たまたま合う\n人がいた、という形で起きている。"}, {"t": 1576.7, "x": "同じことをするなってことね。"}, {"t": 1578.6, "x": "ああ。"}, {"t": 1579.0333333333333, "x": "三つ目。遺族の方が、いまも生きている。"}, {"t": 1581.7, "x": "どの事件も、家族が待っている。"}, {"t": 1583.7833333333333, "x": "その人たちの前で、\n推理ごっこをするわけにはいかない。"}, {"t": 1587.05, "x": "だから私は、この回では\n公表されている事実だけを並べた。"}, {"t": 1590.8333333333333, "x": "何が起きて、何年たって、何が\n分かっていないか。それだけだ。"}, {"t": 1595.55, "x": "捜査本部は、いつまで置かれるのか。"}, {"t": 1597.7666666666667, "x": "これは、警察庁の白書に書いてある。"}, {"t": 1600.2, "x": "平成26年版、2014年の警察白書の特集だ。"}, {"t": 1604.2333333333333, "x": "見出しは「公訴時効の廃止・\n延長に伴う捜査期間の長期化」。"}, {"t": 1608.45, "x": "本文を読む。"}, {"t": 1609.3833333333334, "x": "「警察では、未解決事件の捜査期間の長期化に\n的確に対応し、」"}, {"t": 1613.7666666666667, "x": "「捜査本部を設置した事件については、事件が\n解決するまで必要な体制を維持しつつ、」"}, {"t": 1619.2166666666667, "x": "「捜査方針の再検討、新たな情報の収集、"}, {"t": 1622.1333333333334, "x": "各種情報の見直し、有力情報の掘り下げ、\n証拠資料の再鑑定等を実施している」"}, {"t": 1627.7, "x": "解決するまで？"}, {"t": 1628.9666666666667, "x": "ああ。年数は決まっていない。"}, {"t": 1630.75, "x": "さらに、こうも書いてある。"}, {"t": 1632.3, "x": "「公訴時効が廃止され又は延長された\n罪に係る事件については、」"}, {"t": 1636.3, "x": "「捜査本部を設置していないものであっても、\n捜査本部設置事件に準じた捜査を推進している」"}, {"t": 1641.9666666666667, "x": "そして、この特集にはもう一文ある。"}, {"t": 1644.3833333333334, "x": "これは警察庁自身が書いている文章だ。"}, {"t": 1646.9666666666667, "x": "「一方で、このような取組は他の事件に捜査員を\n投入する上での制約とならざるを得ない側面もある」"}, {"t": 1653.15, "x": "……ほかの事件に人を回せなくなる。"}, {"t": 1655.3833333333334, "x": "そう書いてある。"}, {"t": 1656.3333333333333, "x": "時効を無くしたことの代償が、\n白書の中にそのまま書かれている。"}, {"t": 1660.3666666666666, "x": "私はこれを、警察の言い訳だとは思わない。"}, {"t": 1663.1833333333334, "x": "人も金も無限ではない、という当たり前のことだ。"}, {"t": 1666.2166666666667, "x": "そして、その中で、いま挙げた\n事件の捜査本部は、いまも置かれている。"}, {"t": 1671.1666666666667, "x": "ここで、この制度の実際について、数字を一つ出す。"}, {"t": 1674.6333333333334, "x": "警察庁が、税金の使い方について\n国に出した資料の中にある数字だ。"}, {"t": 1679.3333333333333, "x": "内閣府の税制調査会に提出された、\n平成23年度の税制改正要望の資料だ。"}, {"t": 1684.9833333333333, "x": "そのまま読む。"}, {"t": 1685.9666666666667, "x": "「平成十九年五月、第一回目広告から\n平成二十二年八月までの間において、」"}, {"t": 1691.3833333333334, "x": "「捜査特別報奨金制度対象事件のうち国民から\n提供された情報が検挙へ寄与した検挙事件数」"}, {"t": 1697.7166666666667, "x": "「一事件。一年平均、約〇・三事件」"}, {"t": 1700.8, "x": "……一件？"}, {"t": 1701.55, "x": "制度が始まってから3年4か月で、1件だ。"}, {"t": 1704.7166666666667, "x": "ここは正確に言う。"}, {"t": 1705.95, "x": "これは「報奨金が支払われた件数」ではない。"}, {"t": 1708.9666666666667, "x": "「国民から寄せられた情報が、\n検挙に結びついた事件の数」だ。"}, {"t": 1713.1333333333334, "x": "同じ資料に、情報が\nどれだけ来ているかも書いてある。"}, {"t": 1716.3, "x": "1つの事件あたり、1か月に来る情報の平均だ。"}, {"t": 1719.6833333333334, "x": "平成19年度、24.2件。"}, {"t": 1722.0, "x": "平成20年度、17.3件。"}, {"t": 1724.35, "x": "平成21年度、25.5件。"}, {"t": 1727.05, "x": "毎月20件くらいは来てるのに。"}, {"t": 1729.3166666666666, "x": "ああ。情報は来ている。"}, {"t": 1730.8, "x": "1つの事件に、月に20件前後。"}, {"t": 1733.2166666666667, "x": "対象が十数件あるから、全体では相当な数だ。"}, {"t": 1736.6166666666666, "x": "それでも、検挙に結びついたのは\n3年4か月で1件だった。"}, {"t": 1740.55, "x": "この数字をどう見るか。"}, {"t": 1741.9333333333334, "x": "私は、「意味が無い」という話ではないと思っている。"}, {"t": 1745.1333333333334, "x": "1件は1件だ。その1件は、\nそれが無ければ動かなかった。"}, {"t": 1749.0166666666667, "x": "ただ、この数字は、この回の見方を決める。"}, {"t": 1751.8333333333333, "x": "情報提供というのは、そういう確率のものだ。"}, {"t": 1754.7833333333333, "x": "だから、外れることを前提に、数を出すしかない。"}, {"t": 1758.5333333333333, "x": "もう一つ、数字の話をする。"}, {"t": 1760.65, "x": "日本の殺人の検挙率は高い、とよく言われる。"}, {"t": 1763.6833333333334, "x": "警察庁の統計を見る。"}, {"t": 1765.3, "x": "2025年の数字だ。"}, {"t": 1766.8666666666666, "x": "認知した件数が976件、検挙が961件。"}, {"t": 1771.2, "x": "割ると、98.5パーセントになる。"}, {"t": 1773.8166666666666, "x": "ほとんど解決してる？"}, {"t": 1775.3833333333334, "x": "ここで止めると、間違える。"}, {"t": 1777.1833333333334, "x": "同じ統計に、内訳が書いてある。"}, {"t": 1779.45, "x": "2025年の976件のうち、既遂が\n284件、未遂が692件だ。"}, {"t": 1785.9333333333334, "x": "七割が未遂？"}, {"t": 1787.15, "x": "ああ。"}, {"t": 1787.5666666666666, "x": "未遂の事件は、被害者が生きている。"}, {"t": 1789.9166666666667, "x": "誰にやられたかを、本人が話せる場合が多い。"}, {"t": 1792.75, "x": "だから、この98.5という数字を「\n殺人事件の98.5パーセントが解決している」と"}, {"t": 1798.8666666666666, "x": "言い換えると、誤りになる。"}, {"t": 1800.55, "x": "私はこの言い換えをしない。"}, {"t": 1802.1666666666667, "x": "もう一つ、よく言われる話がある。"}, {"t": 1804.4, "x": "「昔は検挙率が高かったが、\n今は下がった」というものだ。"}, {"t": 1808.2, "x": "これも、数字の上では成り立たない。"}, {"t": 1810.3833333333334, "x": "戦後すぐの時期は90パーセント台前半だった。"}, {"t": 1813.45, "x": "1950年代の半ばに98パーセント台に\n上がって、そこから70年、"}, {"t": 1818.4666666666667, "x": "95から98パーセントで横ばいだ。"}, {"t": 1821.3, "x": "下がってはいない。"}, {"t": 1822.3333333333333, "x": "では、なぜ解けない事件があるのか。"}, {"t": 1824.5166666666667, "x": "それは、率の話ではないからだ。"}, {"t": 1826.75, "x": "数字の外に残った、その数件が、\n今日ここで並べた事件だ。"}, {"t": 1831.45, "x": "では、もし心当たりがある人がいたら、\nどこに伝えればいいのか。"}, {"t": 1835.3166666666666, "x": "ここも、間違えて\n広まっていることがあるので、正確に言う。"}, {"t": 1838.9333333333334, "x": "まず、よく紹介される二つの番号について。"}, {"t": 1841.8166666666666, "x": "一つは、警察相談専用電話の「シャープ九一一〇」。"}, {"t": 1846.5166666666667, "x": "もう一つは、匿名通報ダイヤル。"}, {"t": 1848.7333333333333, "x": "このどちらも、未解決の殺人事件の情報提供を\n受け付ける窓口ではない。"}, {"t": 1853.6, "x": "違うの？"}, {"t": 1854.4166666666667, "x": "違う。"}, {"t": 1855.0, "x": "シャープ九一一〇は、事件や\n事故になる前の相談のための番号だ。"}, {"t": 1860.1166666666666, "x": "匿名通報ダイヤルは、対象になる犯罪が\n決まっていて、その中に未解決の殺人は入っていない。"}, {"t": 1866.3, "x": "では、どこか。"}, {"t": 1867.3833333333334, "x": "それぞれの事件の捜査本部だ。"}, {"t": 1869.35, "x": "警察庁の一覧から、その事件の担当している\n警察のページに行くと、"}, {"t": 1873.85, "x": "連絡先の電話番号が書いてある。"}, {"t": 1875.9, "x": "専用の番号が用意されているものもある。"}, {"t": 1878.3666666666666, "x": "伝える先は、そこだ。"}, {"t": 1880.0, "x": "事件によっては、通話料のかからない\n専用の番号が用意されている。"}, {"t": 1884.0, "x": "群馬、新潟、鳥取、愛知、京都、大分。"}, {"t": 1887.2666666666667, "x": "私が見ただけでも、それだけあった。"}, {"t": 1889.7333333333333, "x": "もう一つ、よく聞かれることがある。"}, {"t": 1891.9333333333334, "x": "名前を言わないといけないのか、という話だ。"}, {"t": 1894.6, "x": "ここは、さっきの要綱にはっきり書いてある。"}, {"t": 1897.0666666666666, "x": "二つ、別々のことが書いてある。"}, {"t": 1899.3833333333334, "x": "一つ目。「広告に応じて情報提供を行った者に\n関する秘密は、厳守しなければならない」"}, {"t": 1905.15, "x": "名乗った人の情報は、守られる。そう決められている。"}, {"t": 1908.4666666666667, "x": "二つ目。報奨金を払わない人として、こう書いてある。"}, {"t": 1912.0333333333333, "x": "「匿名であるなどのため個人の特定ができない者」"}, {"t": 1915.1833333333334, "x": "匿名だと、お金は出ない。"}, {"t": 1917.1166666666666, "x": "そういうことだ。"}, {"t": 1918.1166666666666, "x": "だから、こうなる。"}, {"t": 1919.3333333333333, "x": "名前を伏せて伝えることはできる。\nただし、その場合は報奨金は出ない。"}, {"t": 1923.6, "x": "名乗った場合は、報奨金の対象になるし、\nその人の情報は秘密として守られる。"}, {"t": 1928.75, "x": "どちらを選ぶかは、その人が決めることだ。"}, {"t": 1931.4666666666667, "x": "私が言えるのはここまでだ。"}, {"t": 1933.05, "x": "細かい扱いは、その捜査本部に聞いてほしい。"}, {"t": 1936.0333333333333, "x": "そして、これだけは言っておく。"}, {"t": 1937.9, "x": "情報は、確実なものでなくていい。"}, {"t": 1940.1666666666667, "x": "確実かどうかを決めるのは、伝える側ではないからだ。"}, {"t": 1944.0833333333333, "x": "最後に、この回で出した数字をもう一度置いておく。"}, {"t": 1947.0833333333333, "x": "いま国が報奨金をかけている未解決事件は、15件。"}, {"t": 1950.6833333333334, "x": "いちばん古いのが1995年、\nいちばん新しいのが2022年。"}, {"t": 1955.2166666666667, "x": "31年前から、4年前まで。"}, {"t": 1957.6, "x": "全部、上限は300万円。"}, {"t": 1959.6, "x": "制度が始まったのは2007年。"}, {"t": 1961.7, "x": "始まってから3年4か月のあいだに、寄せられた\n情報が検挙に結びついた事件は、1件。"}, {"t": 1967.5, "x": "一方で、1つの事件に月に\n20件前後の情報が寄せられている。"}, {"t": 1971.75, "x": "2010年に、人を死なせて死刑に\nあたる罪の時効が無くなった。"}, {"t": 1975.8, "x": "さかのぼって適用することについては、\n2015年に最高裁が合憲と判断 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
