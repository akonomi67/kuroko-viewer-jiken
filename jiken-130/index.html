<script>
const D={"name": "130", "file": "130_編集用", "dur": 1995.36665625, "segs": [], "subs": [{"t": 0.0, "x": "1972年5月13日、土曜日の夜。大阪のミナミ。"}, {"t": 4.45, "x": "千日前の交差点に、7階建ての古いビルが建っていた。"}, {"t": 8.116666666666667, "x": "名前は千日デパート。"}, {"t": 9.633333333333333, "x": "その最上階の7階から外へ出る道を、先に数えておく。"}, {"t": 13.45, "x": "階段が4つ。エレベーターが2基。救助袋が1つ。"}, {"t": 17.016666666666666, "x": "けっこうあるじゃない。"}, {"t": 18.25, "x": "あった。数だけ見ればな。"}, {"t": 19.9, "x": "この夜7階のキャバレーには181人がいた。"}, {"t": 23.05, "x": "そして夜10時半ごろ下の3階から火が出た。"}, {"t": 26.116666666666667, "x": "7階まで燃えたの？"}, {"t": 27.566666666666666, "x": "いや。7階には火は一度も入っていない。"}, {"t": 30.133333333333333, "x": "入ってきたのは煙だけだ。"}, {"t": 31.933333333333334, "x": "それでも7階では118人が亡くなった。"}, {"t": 34.88333333333333, "x": "火が来てないのに？"}, {"t": 36.18333333333333, "x": "外へ出る道がその夜はほとんど使えなかった。"}, {"t": 39.0, "x": "階段4つのうち、安全に地上まで降りられたのは1つ。"}, {"t": 42.483333333333334, "x": "その1つを通って逃げられたのは2人だった。"}, {"t": 45.333333333333336, "x": "……2人。"}, {"t": 46.46666666666667, "x": "今回は、7階から外へ出る道を一本ずつ見ていく。"}, {"t": 49.86666666666667, "x": "どの道がなぜ閉じていて、何人がそこを通れたのか。"}, {"t": 53.13333333333333, "x": "数字は消防局の資料と、国会の記録と、\n最高裁の決定から取った。"}, {"t": 57.916666666666664, "x": "亡くなった方の様子は話さない。名前も出さない。"}, {"t": 61.0, "x": "扱うのは道のほうだ。"}, {"t": 64.3, "x": "まず建物の話からだ。"}, {"t": 66.03333333333333, "x": "このビルが建ったのは1932年。昭和7年だ。"}, {"t": 69.8, "x": "戦争の前じゃない。"}, {"t": 71.16666666666667, "x": "そうだ。最初は大阪歌舞伎座という劇場だった。"}, {"t": 74.26666666666667, "x": "芝居の小屋として、昭和33年まで使われている。"}, {"t": 77.7, "x": "そのあと中を作り替えて、千日デパートになった。"}, {"t": 80.96666666666667, "x": "劇場がデパートに？"}, {"t": 82.41666666666667, "x": "外の箱はそのままで中の仕切りを変えたんだ。"}, {"t": 85.2, "x": "火事のあと国会である議員がこう言っている。"}, {"t": 87.61666666666666, "x": "「従来の建物を改造いたしまして\nいろいろな用途に使うという場合」。"}, {"t": 91.48333333333333, "x": "そこに「一つの大きな落とし穴」がある、と。"}, {"t": 94.56666666666666, "x": "作り替えた建物は危ないってこと？"}, {"t": 96.93333333333334, "x": "危ないと決めたわけじゃない。だが、\n考えることが増える。"}, {"t": 100.25, "x": "劇場として引いた線の上に、\n店の線を重ねているからな。"}, {"t": 103.95, "x": "火事の当時このビルの中はこうなっていた。"}, {"t": 106.4, "x": "地下と1階と2階がデパート。"}, {"t": 108.33333333333333, "x": "3階と4階が衣料品のスーパー。"}, {"t": 110.5, "x": "5階も売場や事務所で6階は遊技場。"}, {"t": 112.9, "x": "そして最上階の7階がキャバレーだ。"}, {"t": 115.35, "x": "一つのビルに全然違うお店が重なってるのね。"}, {"t": 118.51666666666667, "x": "ある研究者は「合計で176店舗が共存する\n典型的な古い雑居ビル」と書いている。"}, {"t": 124.35, "x": "持ち主の会社があって、その子会社が\nキャバレーを開いていた。"}, {"t": 127.98333333333333, "x": "開いたのは1967年。火事の5年前だ。"}, {"t": 131.53333333333333, "x": "最上階にキャバレーってどうなの？"}, {"t": 133.56666666666666, "x": "火事のあと、まさにそこが国会で問われることになる。"}, {"t": 136.71666666666667, "x": "たくさんの人を集める店を、ビルの高い\n階に置いていいのか、とな。"}, {"t": 141.33333333333334, "x": "このビルには夜になると決まった形があった。"}, {"t": 144.03333333333333, "x": "デパートの売場は夜9時に閉まる。"}, {"t": 146.03333333333333, "x": "閉まったあとの売場には、店の人は一人もいなくなる。"}, {"t": 149.48333333333332, "x": "じゃあビルは空っぽ？"}, {"t": 150.76666666666668, "x": "空っぽではない。7階のキャバレーだけは\n夜11時まで開いている。"}, {"t": 154.7, "x": "最高裁の決定はこの形をそのまま書いている。"}, {"t": 157.7, "x": "「七階の『Ｊ』だけが午後一一時まで営業し」。"}, {"t": 160.75, "x": "「多数の従業員や客が\n在店しているという状況にあった」。"}, {"t": 164.3, "x": "Ｊって？"}, {"t": 165.43333333333334, "x": "決定の中では、店の名前を\n記号に置き換えてあるんだ。"}, {"t": 168.83333333333334, "x": "Ｊはキャバレーのことだ。"}, {"t": 170.1, "x": "人の名前もみんな記号になっている。"}, {"t": 172.51666666666668, "x": "じゃあ下の売場は誰が見てるの？"}, {"t": 174.5, "x": "デパートの保安係だ。ふだんは\n5人で、ビル全体を見回る。"}, {"t": 178.26666666666668, "x": "ところがこの夜は1人休んでいて4人だった。"}, {"t": 181.15, "x": "7階建てのビルを4人で。"}, {"t": 182.96666666666667, "x": "そしてもう一つ。この夜、3階では工事が入っていた。"}, {"t": 186.56666666666666, "x": "3階のスーパーが、電気の工事を\n業者に頼んでいたんだ。"}, {"t": 190.05, "x": "閉店したあとの売場で、作業員が配線をしていた。"}, {"t": 193.38333333333333, "x": "誰もいない売場で、工事の人と、上のキャバレーと。"}, {"t": 196.68333333333334, "x": "そうだ。下は暗くて人がいない。"}, {"t": 198.73333333333332, "x": "上は明るくて人が多い。"}, {"t": 200.36666666666667, "x": "その間をつなぐのは保安係の4人だけだった。"}, {"t": 203.96666666666667, "x": "下で何かあったら、7階にはどうやって知らせるの？"}, {"t": 207.26666666666668, "x": "そこが、この回の最初の「道」だ。"}, {"t": 209.73333333333332, "x": "逃げ道の前の、知らせの道だな。"}, {"t": 212.05, "x": "デパートには、館内に一斉に放送できる機械があった。"}, {"t": 215.43333333333334, "x": "だがその放送は6階より下にしか届かない。"}, {"t": 218.41666666666666, "x": "7階には？"}, {"t": 219.55, "x": "届かない。最高裁の決定はこう書いている。"}, {"t": 222.33333333333334, "x": "「七階の『Ｊ』に通報する設備はなく」。"}, {"t": 225.1, "x": "「午後九時以降は一階の保安室から外線によって\n電話をする以外に同店に連絡する方法はなかった」。"}, {"t": 231.11666666666667, "x": "同じビルなのに外線の電話？"}, {"t": 233.11666666666667, "x": "そうだ。同じ建物の中なのに、\n外の電話番号に掛けるしかなかった。"}, {"t": 237.68333333333334, "x": "火事を知らせる道は、その一本だけだったわけだ。"}, {"t": 240.85, "x": "じゃあ、ビル全体で火事のときの決まりはなかったの？"}, {"t": 243.95, "x": "火を見張る責任者は店ごとに届けが出ていた。"}, {"t": 246.83333333333334, "x": "デパート、3階のスーパー、7階のキャバレー。3人だ。"}, {"t": 250.48333333333332, "x": "その3人の上に立つ、ビル全体の責任者は\n決まっていなかった。"}, {"t": 254.53333333333333, "x": "火事の3日後、消防庁長官が国会でそう答えている。"}, {"t": 258.0833333333333, "x": "前の年の6月、消防署は3人を呼んで話し合わせた。"}, {"t": 261.73333333333335, "x": "ビル全体で決まりを作るようにとな。"}, {"t": 264.06666666666666, "x": "それで？"}, {"t": 265.2, "x": "「三者協議をして防火協議会というものをつくり」。"}, {"t": 268.0, "x": "「統括防火管理者というものをきめるというまでには\n至らずに今日まで来ておる」。"}, {"t": 272.21666666666664, "x": "消防署に出ていた計画は、\n昭和38年に作ったものだった。"}, {"t": 276.4, "x": "キャバレーができる前の計画のままだったということだ。"}, {"t": 280.06666666666666, "x": "夜10時半前。3階の売場の東側で火が出た。"}, {"t": 283.43333333333334, "x": "工事の作業員が、パリパリという音を聞いている。"}, {"t": 286.23333333333335, "x": "ガラスが割れるような音だったという。"}, {"t": 288.3833333333333, "x": "見たらもう燃えてたの？"}, {"t": 289.81666666666666, "x": "東のほうを見ると赤黒い炎が上がっていた。"}, {"t": 292.53333333333336, "x": "作業員は「火事だ」と叫んで、\n仲間と消火器を探した。"}, {"t": 296.35, "x": "そして3階の西側にある火災報知機を押している。"}, {"t": 299.55, "x": "火のもとは何だったの？"}, {"t": 301.1666666666667, "x": "それは後の章でじっくりやる。"}, {"t": 302.75, "x": "先に言っておくと、分かっていない。"}, {"t": 305.06666666666666, "x": "分かってないの？"}, {"t": 306.23333333333335, "x": "最高裁の決定も、ここは\n「その原因は不明であるが」と書いている。"}, {"t": 310.53333333333336, "x": "工事中だったことと、3階の売場から\n出たことまでは確かだ。"}, {"t": 314.4, "x": "その先はこの回の後半で記録を開く。"}, {"t": 317.15, "x": "じゃあ燃えたものは？"}, {"t": 318.3833333333333, "x": "3階には服や布団や雑貨が、\n売場いっぱいに並んでいた。"}, {"t": 321.96666666666664, "x": "ある研究者の文章ではこうまとめられている。"}, {"t": 324.55, "x": "「化繊商品等の収納物や内装材から発生した\n一酸化炭素を含んだ多量の濃煙」。"}, {"t": 329.8833333333333, "x": "化学繊維の服が燃えた煙ね。"}, {"t": 332.1, "x": "そうだ。火そのものより、\nこの煙がこの夜の主役になる。"}, {"t": 335.75, "x": "保安係と作業員は、消火器と消火栓で消そうとした。"}, {"t": 339.31666666666666, "x": "だが間に合わず、濃い煙に\n押されて1階まで下がっている。"}, {"t": 343.3, "x": "3階の真ん中には、エスカレーターが2か所あった。"}, {"t": 346.35, "x": "エスカレーターの穴は、上と下の階をつなぐ縦の穴だ。"}, {"t": 349.8666666666667, "x": "そこから火が上がっちゃう？"}, {"t": 351.45, "x": "そのために、穴をふさぐ防火シャッターがついていた。"}, {"t": 354.4166666666667, "x": "ただし手で閉めるものだ。"}, {"t": 355.75, "x": "火事のときに人が閉めないと閉まらない。"}, {"t": 358.26666666666665, "x": "誰か閉めたの？"}, {"t": 359.48333333333335, "x": "閉められなかった。火は、\nその穴から4階と2階に広がった。"}, {"t": 363.45, "x": "2階と3階と4階がほぼ丸ごと焼けている。"}, {"t": 366.35, "x": "5階より上は？"}, {"t": 367.48333333333335, "x": "5階で止まった。床の仕切りと、\n消防の放水で止めたんだ。"}, {"t": 371.35, "x": "だから6階にも7階にも炎は届いていない。"}, {"t": 374.35, "x": "じゃあ、シャッターをもっと閉めておけばよかったの？"}, {"t": 377.1333333333333, "x": "その問いが18年後に最高裁で答えられる。"}, {"t": 380.01666666666665, "x": "3階の売場には、自動で下りるもの\n以外に防火シャッターが11枚あった。"}, {"t": 384.3, "x": "防火の扉も2か所ある。"}, {"t": 385.9166666666667, "x": "この夜それらは閉まっていなかった。"}, {"t": 388.0833333333333, "x": "工事してたから開けてたとか？"}, {"t": 390.0, "x": "工事のために開けておく必要があったのは、\n南の端の2枚だけだった。"}, {"t": 394.35, "x": "最高裁はそう見た。残りは閉めておけたはずだ、と。"}, {"t": 397.65, "x": "閉めていれば、煙はほぼ東側に\n閉じこめられたと書いている。"}, {"t": 401.48333333333335, "x": "閉じこめられてたら7階は？"}, {"t": 403.3666666666667, "x": "煙の入り方が減って、知らせも\n届いて、逃げられたはずだ、とな。"}, {"t": 407.5833333333333, "x": "これは裁判所の見立てだ。\nその夜、そうはならなかった。"}, {"t": 411.68333333333334, "x": "3階の火災報知機が押されると、\n1階の保安室のベルが鳴る。"}, {"t": 415.6, "x": "保安係長がそれを知ったのは、夜10時34分ごろだ。"}, {"t": 419.4, "x": "数分後消防に119番の電話が入った。"}, {"t": 422.31666666666666, "x": "消防が火事を知った時刻は、\n夜10時40分になっている。"}, {"t": 426.1166666666667, "x": "消防はすぐ来たの？"}, {"t": 427.56666666666666, "x": "早かった。国会で、自治政務次官はこう報告している。"}, {"t": 431.23333333333335, "x": "「出火後約四分で消防隊が現場に到着し」。"}, {"t": 434.21666666666664, "x": "現場を見に行った議員のメモでは、消防車は81台。"}, {"t": 437.68333333333334, "x": "そのうちはしご車が7台だ。"}, {"t": 439.6333333333333, "x": "大阪じゅうの消防車ね。"}, {"t": 441.3, "x": "議員自身も「大阪のほとんど全市の消防車」と\n言っている。"}, {"t": 445.01666666666665, "x": "ここまでは手が早かった。"}, {"t": 446.73333333333335, "x": "……ここまでは？"}, {"t": 447.85, "x": "119番は鳴った。だが\n7階への外線は、誰も掛けていない。"}, {"t": 451.98333333333335, "x": "決定の文をそのまま読む。"}, {"t": 453.68333333333334, "x": "「保安係員らは、いずれも『Ｊ』に電話で\n火災の発生を通報することを全く失念しており」。"}, {"t": 459.6333333333333, "x": "「右通報をした者はいなかった」。"}, {"t": 461.75, "x": "忘れてたってこと？"}, {"t": 463.1333333333333, "x": "決定の言葉は「失念」だ。"}, {"t": 465.1166666666667, "x": "煙の勢いが強く、4人とも外へ逃げている。"}, {"t": 468.25, "x": "消防庁の予防課長も、国会で\nここを一つ目の問題に挙げた。"}, {"t": 472.23333333333335, "x": "「七階部分のキャバレーへの火災の連絡、\nこれが十分に行なわれておらない」。"}, {"t": 476.68333333333334, "x": "じゃあ7階の人は何で火事を知ったの？"}, {"t": 479.15, "x": "煙だ。知らせより先に、煙のほうが7階に着いた。"}, {"t": 483.4, "x": "火は5階で止まったのに、煙は\nどうやって7階まで行ったの？"}, {"t": 487.1, "x": "煙は、縦にのびる穴を探して上がる。\nこのビルにはそれが何本もあった。"}, {"t": 491.53333333333336, "x": "最高裁は煙の通り道を四つ挙げている。"}, {"t": 494.21666666666664, "x": "キャバレー専用の南側エレベーターの昇降路。"}, {"t": 496.9, "x": "E階段。F階段。そしてビルの北側の換気ダクトだ。"}, {"t": 500.73333333333335, "x": "昇降路って？"}, {"t": 501.8833333333333, "x": "エレベーターの箱が上り下りする縦の穴だ。"}, {"t": 504.6, "x": "その穴の壁に欠けたところがあって、\nそこから煙が入った。"}, {"t": 508.3666666666667, "x": "上がった煙は、7階のエレベーターの扉の\nすき間から吹き出した。"}, {"t": 512.5, "x": "換気ダクトのほうは？"}, {"t": 513.9333333333333, "x": "空気を吸いこむダクトが、3階、\n4階、7階をつないでいた。"}, {"t": 517.9833333333333, "x": "3階と4階の吸い口から煙が入り、ダクトの中を上った。"}, {"t": 522.1, "x": "途中で止める仕かけはなかったの？"}, {"t": 524.25, "x": "あった。5階と6階と7階の床に、\n防火ダンパーという弁がついていた。"}, {"t": 528.7333333333333, "x": "熱で閉じて煙を止めるためのものだ。"}, {"t": 531.0833333333334, "x": "だが研究者の文章では\n「作動していなかった」とある。"}, {"t": 534.4, "x": "古くなっていたらしい。"}, {"t": 535.9333333333333, "x": "止めるはずのものが止めなかった。"}, {"t": 537.9833333333333, "x": "火事の3日後、建設省の担当者は\n国会でこう言っている。"}, {"t": 541.6333333333333, "x": "「最上階の七階には火害が認められておりません」。"}, {"t": 544.65, "x": "「この経路は、私ども一見した\nところではなかなかわかりませんでした」。"}, {"t": 549.05, "x": "国の人が見ても最初は分からなかったのね。"}, {"t": 551.9, "x": "そうだ。どこから煙が来たのか、\nその場ではつかめなかった。"}, {"t": 555.6333333333333, "x": "7階の人たちには、なおさら分からなかったはずだ。"}, {"t": 559.4833333333333, "x": "ここで7階のキャバレーの作りを見ておく。"}, {"t": 561.9, "x": "お客は、地下の専用の入口から\nエレベーターで7階へ上がる。"}, {"t": 565.5666666666667, "x": "降りるときもエレベーターだ。"}, {"t": 567.1666666666666, "x": "階段は使わないの？"}, {"t": 568.6833333333333, "x": "使わない。国の報告はこう言っている。"}, {"t": 571.1, "x": "「七階は、通常、エレベーター二基のみで昇降し」。"}, {"t": 574.15, "x": "「階段に通ずる部分の防火戸は\nすべて閉鎖してありました」。"}, {"t": 577.6666666666666, "x": "階段の扉がふだんから閉まってたってこと？"}, {"t": 580.5, "x": "そうだ。営業中は、鍵がかかっていたものが多い。"}, {"t": 583.7333333333333, "x": "なんで鍵なんか？"}, {"t": 585.0, "x": "ある議員は、4年後の国会で理由をこう説明した。"}, {"t": 588.2, "x": "出入りが自由すぎると、お金を払わずに帰る客が出る。"}, {"t": 591.5, "x": "だから、決まった入口しか\n通れないようにしてあったという。"}, {"t": 594.9833333333333, "x": "お店の都合なのね。"}, {"t": 596.4333333333333, "x": "研究者の文章でも、営業上や\n防犯上の理由とされている。"}, {"t": 600.2, "x": "そしてこう続く。"}, {"t": 601.3833333333333, "x": "「非常時にお客が即時に利用可能な\n避難階段は一つもなかった」。"}, {"t": 605.5833333333334, "x": "階段は4つあったのに。"}, {"t": 607.2666666666667, "x": "4つあった。どれも開けるのに、ひと手間が要った。"}, {"t": 610.2833333333333, "x": "ふだん客が知っている道は、\nエレベーターの1本だけだった。"}, {"t": 613.75, "x": "では7階で煙が出たとき何が起きたか。"}, {"t": 616.4, "x": "ここから先は道を一本ずつ見ていく。"}, {"t": 619.3833333333333, "x": "夜10時35分ごろ。"}, {"t": 620.8666666666667, "x": "7階ではショーが終わったところだった。"}, {"t": 623.1666666666666, "x": "お客とホステスが話したり踊ったりしていた。"}, {"t": 626.0666666666667, "x": "まだ誰も気づいてないのね。"}, {"t": 627.8333333333334, "x": "最初に見えたのは白い煙だ。"}, {"t": 629.8, "x": "エレベーターの扉のすき間や、\n事務所の前の吸い口から出てきた。"}, {"t": 633.6833333333333, "x": "白い煙はすぐに黒い煙に変わった。"}, {"t": 636.2833333333333, "x": "みんなどうしたの？"}, {"t": 637.5166666666667, "x": "まず、いつもの出口に向かった。エレベーターだ。"}, {"t": 640.3833333333333, "x": "エレベーターの前には人があふれた。"}, {"t": 642.3833333333333, "x": "研究者の文章は「ラッシュ時の地下鉄のように\n人で埋まった」と書いている。"}, {"t": 647.0333333333333, "x": "でも、そのエレベーターの穴から煙が来てるのよね。"}, {"t": 650.2333333333333, "x": "そうだ。扉のすき間から煙が吹き出して、\nそこで待っていられなくなった。"}, {"t": 654.7166666666667, "x": "店内には放送が流れた。"}, {"t": 656.35, "x": "火事だ、落ち着いてくれ、という内容だ。"}, {"t": 659.0, "x": "どこへ逃げろとは？"}, {"t": 660.25, "x": "言っていない。具体的に、\nどの道へ行けという放送はなかった。"}, {"t": 664.0, "x": "最高裁は支配人についてこう書いている。"}, {"t": 666.4833333333333, "x": "煙が入ってきた「初期の段階で」。"}, {"t": 668.9, "x": "「客等を誘導して安全なＢ階段から\n避難させる機会があったのに、これを失し」。"}, {"t": 673.85, "x": "安全なB階段？"}, {"t": 675.2, "x": "そうだ。4つの階段のうち、\n一つだけ安全な階段があった。"}, {"t": 679.2166666666667, "x": "その話はあとに回す。まず、\n閉じていた道から見ていく。"}, {"t": 683.45, "x": "一つ目の階段A階段だ。"}, {"t": 685.3333333333334, "x": "場所は、客が使うエレベーターのすぐ横にあった。"}, {"t": 688.4166666666666, "x": "エレベーターの横ならみんな気づくわね。"}, {"t": 690.7, "x": "気づく場所だ。だが扉には鍵がかかっていた。"}, {"t": 693.7166666666667, "x": "鍵はどこにあったの？"}, {"t": 695.1666666666666, "x": "店の事務所だ。事務所に保管されていた。"}, {"t": 697.9166666666666, "x": "取りに行けばいいじゃない。"}, {"t": 699.3333333333334, "x": "その事務所の前には換気の吸い口があった。"}, {"t": 701.9833333333333, "x": "さっき話した煙が吹き出していた吸い口だ。"}, {"t": 704.9166666666666, "x": "……鍵のある部屋の前が、\nいちばん煙がひどかったの？"}, {"t": 708.1666666666666, "x": "そうだ。煙が激しくて、事務所に近づけなかった。"}, {"t": 711.6166666666667, "x": "支配人は扉を開けるように\n指示したらしい、と資料にある。"}, {"t": 715.0, "x": "それでも結局A階段は使われていない。"}, {"t": 717.55, "x": "最後まで扉が開かなかった。"}, {"t": 719.7, "x": "エレベーターの横で、煙が濃くて、鍵は煙の向こう。"}, {"t": 723.2166666666667, "x": "そうだ。しかもエレベーターの横ということは、\n昇降路のすぐそばだ。"}, {"t": 727.1666666666666, "x": "仮に開いていても、そこが煙の通り道に近かった。"}, {"t": 730.8166666666667, "x": "一つ目は使えなかった。"}, {"t": 732.5666666666667, "x": "使えなかった。この階段で逃げた人は0人だ。"}, {"t": 735.7, "x": "鍵をかけた理由はさっきの出入りの都合だ。"}, {"t": 738.1833333333333, "x": "鍵をどこに置くかまでは、火事を\n考えて決めていなかった。"}, {"t": 742.2166666666667, "x": "二つ目はE階段だ。"}, {"t": 743.6833333333333, "x": "この階段はホステスの更衣室の中にあった。"}, {"t": 746.6333333333333, "x": "お客さんは知らない場所ね。"}, {"t": 748.4166666666666, "x": "知らない。ふだん使うのはホステスだけだ。"}, {"t": 750.9666666666667, "x": "火事のとき、更衣室には十数人のホステスがいた。"}, {"t": 754.1833333333333, "x": "事務所のほうから流れてくる煙で、火事に気づいた。"}, {"t": 757.4833333333333, "x": "それでE階段へ？"}, {"t": 758.8, "x": "そうだ。誰かが事務所から鍵を\n取ってきて、扉を開けた。"}, {"t": 762.5, "x": "開いたのね。"}, {"t": 763.65, "x": "開いた。だが中から煙が吹き出してきた。"}, {"t": 766.65, "x": "中から？"}, {"t": 767.7833333333333, "x": "E階段は、煙が下から上ってくる通り道の一つだった。"}, {"t": 771.6666666666666, "x": "最高裁が挙げた四つの道の中にも、\nE階段が入っている。"}, {"t": 775.5166666666667, "x": "開けた扉はすぐに閉めるしかなかった。"}, {"t": 778.0166666666667, "x": "じゃあホールのほうへ戻れば？"}, {"t": 779.6333333333333, "x": "ホールの方からも煙が来ていた。"}, {"t": 781.65, "x": "研究者の文章は「両側から煙に\n攻められて立往生した」と書いている。"}, {"t": 786.4833333333333, "x": "……更衣室の人たちは。"}, {"t": 788.0666666666667, "x": "窓から消防に助け出されたのが\n2人。ほかの人は助からなかった。"}, {"t": 792.3666666666667, "x": "鍵は開けられた。開けた先が煙の道だった。"}, {"t": 795.4666666666667, "x": "開いても逃げ道にならないことがあるのね。"}, {"t": 798.0833333333334, "x": "そうだ。階段は、煙が入らない\n作りでないと役に立たない。"}, {"t": 801.8833333333333, "x": "この「煙が入らない階段」が、\nあとの法律の話につながる。"}, {"t": 806.6666666666666, "x": "三つ目はF階段だ。"}, {"t": 808.1666666666666, "x": "ステージの横にあって、客席側は\nシャッターで閉じてあった。"}, {"t": 811.8333333333334, "x": "シャッター？扉じゃなくて？"}, {"t": 813.6166666666667, "x": "上から下ろす幅の広いシャッターだ。"}, {"t": 815.7, "x": "ふだんはカーテンで隠されていたという。"}, {"t": 817.9666666666667, "x": "お店の中から見えないようにしてたのね。"}, {"t": 820.45, "x": "建設省の担当者も国会でそう推測している。"}, {"t": 823.5833333333334, "x": "「キャバレーの中でございますから、おそらくこれが\n何か見えないようになっていたのじゃないか」。"}, {"t": 828.4666666666667, "x": "しかもシャッターの電源は切ってあった。"}, {"t": 830.8, "x": "じゃあ開かないじゃない。"}, {"t": 832.1833333333333, "x": "ボーイが、シャッターのボタンを\n押して上げた。開いたんだ。"}, {"t": 835.5166666666667, "x": "開いた！"}, {"t": 836.65, "x": "開いた瞬間濃い煙が出てきた。"}, {"t": 838.8666666666667, "x": "F階段も最高裁が挙げた煙の通り道の一つだ。"}, {"t": 842.4166666666666, "x": "またなの。"}, {"t": 843.55, "x": "それでも人々は、その煙の中に飛び込んだ。"}, {"t": 846.45, "x": "屋上と、下の階へ向かった。"}, {"t": 848.7166666666667, "x": "屋上なら外の空気があるわよね。"}, {"t": 850.9333333333333, "x": "屋上への出口には鍵がかかっていた。"}, {"t": 853.2666666666667, "x": "下へ向かった人も、上ってくる煙にさえぎられた。"}, {"t": 856.5333333333333, "x": "上も下もこの階段では逃げられなかった。"}, {"t": 859.0833333333334, "x": "そして、開けたシャッターから\n煙がどっと店内に入った。"}, {"t": 862.65, "x": "開けたことでもっと煙が入っちゃったの？"}, {"t": 865.1833333333333, "x": "資料では、逃げようとした人が\nホールに押し戻されたとある。"}, {"t": 868.5833333333334, "x": "誰かを責める話ではない。"}, {"t": 870.15, "x": "開けるしかない状況だった。"}, {"t": 871.9166666666666, "x": "三つ目の階段で地上に降りた人も0人だ。"}, {"t": 875.4, "x": "四つ目がB階段だ。"}, {"t": 877.0166666666667, "x": "さっき出てきた安全な階段ね。"}, {"t": 879.1833333333333, "x": "そうだ。この階段には、外の空気に\n開いた小部屋がついていた。"}, {"t": 883.1333333333333, "x": "煙が入っても、その小部屋で外へ逃げていく作りだ。"}, {"t": 886.5166666666667, "x": "扉に鍵もかかっていなかった。"}, {"t": 888.6666666666666, "x": "それならみんなそこへ行けば。"}, {"t": 890.4166666666666, "x": "場所が問題だった。\nB階段の入口の前には、クロークがあった。"}, {"t": 894.5666666666667, "x": "コートを預けるところ？"}, {"t": 896.05, "x": "そうだ。その奥にある、従業員用の階段だったんだ。"}, {"t": 899.45, "x": "客とすれ違わないように、\n従業員が出入りに使っていた。"}, {"t": 903.05, "x": "お客さんは存在を知らないのね。"}, {"t": 905.1833333333333, "x": "知らない。最高裁はこう書いている。"}, {"t": 907.3666666666667, "x": "「完全に遮断された安全な避難階段は」。"}, {"t": 910.05, "x": "「平素は従業員が使用していた階段\n（別紙図面のＢ階段）のみであったが」。"}, {"t": 914.6666666666666, "x": "「同階段を利用しての避難誘導訓練はもとより、"}, {"t": 917.5, "x": "階下からの出火を想定した訓練は\n一切行われていなかった」。"}, {"t": 921.5166666666667, "x": "下から火が出るとは考えてなかった。"}, {"t": 923.9833333333333, "x": "その夜B階段を通って地上に出たのは2人だ。"}, {"t": 926.9333333333333, "x": "1人はクロークの係の女性。"}, {"t": 928.7, "x": "早く火事に気づいて、隣の部屋に伝えた。"}, {"t": 931.5833333333334, "x": "戻ると、ホールはもう黒い煙で\nマイクの場所も分からなかった。"}, {"t": 935.2333333333333, "x": "ほかの人は別の階段から逃げたと\n思い、一人でB階段を降りた。"}, {"t": 939.4833333333333, "x": "もう1人は？"}, {"t": 940.6, "x": "店の中を逃げ場を探して回ったホステスだ。"}, {"t": 943.4, "x": "日ごろ、帰るときにこの階段を\n使っていた。だから知っていた。"}, {"t": 947.3666666666667, "x": "知ってた人だけがそこへ行けたのね。"}, {"t": 949.7, "x": "そうだ。開いていて、煙が入らなくて、\n知っている人が2人だけだった。"}, {"t": 954.9666666666667, "x": "階段のほかにエレベーターが2基あった。"}, {"t": 957.3333333333334, "x": "でも、エレベーターの前は煙で待てなかったんでしょ？"}, {"t": 960.4666666666667, "x": "そうだ。7階の前で待っていた\n人たちは、別の場所へ散った。"}, {"t": 964.3833333333333, "x": "そのあと思いがけないことが起きている。"}, {"t": 966.5666666666667, "x": "下の階からエレベーターが1基上がってきた。"}, {"t": 969.2333333333333, "x": "誰が乗ってたの？"}, {"t": 970.5166666666667, "x": "上の火事を知らないまま、7階へ\n上がってきたお客とホステスだ。"}, {"t": 974.4833333333333, "x": "知らずに煙のまっただ中へ？"}, {"t": 976.4666666666667, "x": "扉が開くと、店の中は真っ暗で、\n煙がどっと入ってきた。"}, {"t": 980.6, "x": "2人はあわてて扉を閉め下へ戻ろうとした。"}, {"t": 983.2166666666667, "x": "そのとき、7階にいたホステスが\n1人、飛び込んできた。"}, {"t": 986.9166666666666, "x": "乗れたのね。"}, {"t": 988.0333333333333, "x": "3人で地下まで降りた。"}, {"t": 989.55, "x": "途中で縦の穴の煙が箱の中にも入ってきた。"}, {"t": 992.75, "x": "苦しくて床に座りこんだほどだったという。"}, {"t": 995.4333333333333, "x": "それでも降りられた。"}, {"t": 996.75, "x": "降りられた。7階からエレベーターで\n逃げたのは、この1人だ。"}, {"t": 1000.5, "x": "エレベーターが2基あって1人。"}, {"t": 1002.35, "x": "そうだ。しかもたまたま下から来た箱だ。"}, {"t": 1005.05, "x": "7階の側から呼んで乗ったわけではない。"}, {"t": 1007.4166666666666, "x": "建設省の担当者は国会でこうまとめている。"}, {"t": 1010.3166666666667, "x": "「唯一の通路のエレベーターは\n電気が切れまして停止をしたこと」。"}, {"t": 1013.8333333333334, "x": "「それによりまして完全に避難路が断たれまして」。"}, {"t": 1016.8166666666667, "x": "いつもの道が止まった。"}, {"t": 1018.4333333333333, "x": "店の中も、夜10時49分ごろに停電した。"}, {"t": 1021.6333333333333, "x": "真っ暗になったんだ。"}, {"t": 1023.65, "x": "次は救助袋だ。"}, {"t": 1025.1166666666666, "x": "救助袋ってどういうもの？"}, {"t": 1026.9, "x": "布でできた長い筒だ。"}, {"t": 1028.35, "x": "窓から地上へ斜めに張る。"}, {"t": 1030.1833333333334, "x": "中に入ってすべり台のように滑り降りる。"}, {"t": 1032.7666666666667, "x": "中に入るのね。"}, {"t": 1034.05, "x": "そこが大事なところだ。"}, {"t": 1035.4333333333334, "x": "7階には、これが1つあった。"}, {"t": 1037.6166666666666, "x": "窓ぎわの鉄板のケースに入っていて、\n目印の灯りもついていた。"}, {"t": 1041.7166666666667, "x": "ちゃんとしてるじゃない。"}, {"t": 1043.0666666666666, "x": "見た目はな。従業員が\n何人かで、窓から投げ下ろした。"}, {"t": 1046.6333333333334, "x": "先が途中の照明に引っかかって手間取った。"}, {"t": 1049.5, "x": "引っかかっちゃったの。"}, {"t": 1050.9333333333334, "x": "下では通行人が先を押さえてくれたという記録もある。"}, {"t": 1054.15, "x": "問題は上の入口だった。"}, {"t": 1055.7166666666667, "x": "入口の枠を起こさないと、口が開かない。"}, {"t": 1058.6666666666667, "x": "開いてないのにみんな降りたの？"}, {"t": 1060.5833333333333, "x": "最初の数人が、袋の外側に\n馬乗りになって降りて、うまくいった。"}, {"t": 1064.9333333333334, "x": "それを見て、十数人が、\n口の開いていない袋にすがって降りた。"}, {"t": 1069.1666666666667, "x": "外側を……。"}, {"t": 1070.3, "x": "そのほとんどが途中で手を離して落ちた。"}, {"t": 1072.7333333333333, "x": "この袋で降りられたのは5人だ。"}, {"t": 1074.8333333333333, "x": "5人。"}, {"t": 1075.9666666666667, "x": "最高裁はこう書いている。"}, {"t": 1077.5333333333333, "x": "「救助袋が地上に投下されたのに、従業員が\n救助袋の入口を開ける方法を知らなかった」。"}, {"t": 1083.2333333333333, "x": "もう一つ決定にはこうある。"}, {"t": 1084.9666666666667, "x": "「救助袋は一個であり、それも一部破損しており」。"}, {"t": 1088.0166666666667, "x": "「これを利用した避難訓練も行われていなかった」。"}, {"t": 1091.05, "x": "壊れてて練習もしてなくて。"}, {"t": 1093.05, "x": "翌月の国会では、細谷治嘉 議員が\n新聞の報道を紹介している。"}, {"t": 1097.6833333333334, "x": "「長さが短くて」\n「ネズミに食われておって」という報道だ。"}, {"t": 1101.2666666666667, "x": "これは新聞の話を議員が読んだものだ。"}, {"t": 1103.5833333333333, "x": "決定が認めたのは「一部破損」までになる。"}, {"t": 1106.7333333333333, "x": "その後ほかのビルの救助袋は大丈夫だったの？"}, {"t": 1109.7166666666667, "x": "翌年、消防庁がビルを調べた\n結果を国会で報告している。"}, {"t": 1113.6833333333334, "x": "避難の道具の前に物が置いてある。"}, {"t": 1115.65, "x": "壊れている。そういう例が187件あった。"}, {"t": 1118.7666666666667, "x": "消防庁の次長は例としてこの火事を挙げた。"}, {"t": 1121.4333333333334, "x": "「千日ビルの例にございましたように、\n救助袋に大きな穴があいておる」。"}, {"t": 1125.65, "x": "付けただけで見てなかったのね。"}, {"t": 1127.65, "x": "次長は、付けたあとの手入れの仕組みを\n作りたい、と答えている。"}, {"t": 1131.9833333333333, "x": "階段もエレベーターも救助袋も、\nほとんど使えなかった。"}, {"t": 1135.5166666666667, "x": "残った道は窓だ。"}, {"t": 1137.0166666666667, "x": "窓から外の空気を吸える。"}, {"t": 1138.85, "x": "そのはずだった。だが7階の窓には、\n内側に金網がはめてあった。"}, {"t": 1143.1833333333334, "x": "取っ手に針金を巻いて、\n開かないようにしてあったんだ。"}, {"t": 1146.5833333333333, "x": "なんでそんなことを？"}, {"t": 1147.8833333333334, "x": "安全のため、とされている。"}, {"t": 1149.5166666666667, "x": "落ちないように、だな。"}, {"t": 1151.1166666666666, "x": "落ちないための金網が、\n出られない金網になったのね。"}, {"t": 1154.4833333333333, "x": "ボーイたちが苦労して針金をほどいた。"}, {"t": 1156.7666666666667, "x": "ビール瓶やテーブルで窓ガラスを割った。"}, {"t": 1158.9666666666667, "x": "割れた窓に人が集まりはしご車を待った。"}, {"t": 1161.6333333333334, "x": "はしご車は届いたの？"}, {"t": 1163.1166666666666, "x": "届いた窓もある。7階の窓は、\n地上から25メートル余りの高さだ。"}, {"t": 1167.6666666666667, "x": "はしご車が7階から助け出したのは50人だ。"}, {"t": 1170.7666666666667, "x": "50人も。"}, {"t": 1171.9, "x": "この夜7階から助かった人の、\nいちばん多い道がはしご車だった。"}, {"t": 1176.0833333333333, "x": "バンドマンの控え室と、出演者の控え室の窓からも、\n多くの人が助けられた。"}, {"t": 1181.5166666666667, "x": "その部屋はどうして助かったの？"}, {"t": 1183.5833333333333, "x": "ホールとの間に扉が2か所あったからだ。"}, {"t": 1186.1, "x": "扉で仕切られていて煙が比較的薄かった。"}, {"t": 1189.0833333333333, "x": "そこへ逃げた人は、ほとんどが助け出されている。"}, {"t": 1192.1833333333334, "x": "扉2枚で違ったのね。"}, {"t": 1193.95, "x": "そうだ。この夜、扉はずっと人を閉じこめる側だった。"}, {"t": 1197.4333333333334, "x": "ここで初めて扉が人を守る側に回った。"}, {"t": 1200.9166666666667, "x": "はしご車は全部の窓に届いたの？"}, {"t": 1203.1333333333334, "x": "届かない窓があった。ビルの南側だ。"}, {"t": 1205.7, "x": "南側の道には、商店街のアーケードの屋根が\nずっと続いていた。"}, {"t": 1209.8166666666666, "x": "雨の日でも濡れずに歩ける屋根ね。"}, {"t": 1212.0, "x": "そうだ。その屋根が、はしご車を\nビルに寄せるのをさまたげた。"}, {"t": 1215.5166666666667, "x": "現地を見た米田東吾 議員は、\n国会でこう報告している。"}, {"t": 1219.25, "x": "「屋根がふさがってあるために\nはしご車が入れない」。"}, {"t": 1221.9166666666667, "x": "手の届くところまで来てたのに。"}, {"t": 1223.9833333333333, "x": "米田議員は、この報告の中でもう一つ言っている。"}, {"t": 1227.1833333333334, "x": "繁華街の屋根を増やしている\n今の街づくりを、見直す必要がある、とな。"}, {"t": 1231.7, "x": "便利な屋根が救助の邪魔をしたのね。"}, {"t": 1234.0166666666667, "x": "窓から直接飛び降りた人は、11人いたとされる。"}, {"t": 1237.4333333333334, "x": "そのうち助かったのは2人。"}, {"t": 1239.0833333333333, "x": "アーケードの屋根の上に落ちた人たちだ。"}, {"t": 1241.4666666666667, "x": "ほかの人は助からなかった。"}, {"t": 1243.4833333333333, "x": "言葉が出ないわね。"}, {"t": 1244.8166666666666, "x": "ここで少し数を言っておく。"}, {"t": 1246.55, "x": "7階で亡くなったのは118人。"}, {"t": 1248.8666666666666, "x": "そのうち96人は、店の中で煙によって亡くなった。"}, {"t": 1252.6333333333334, "x": "22人は、窓から落ちて亡くなった。"}, {"t": 1254.9833333333333, "x": "救助袋の外側から落ちた人も入っている。"}, {"t": 1258.0666666666666, "x": "火は一度も7階に入ってないのよね。"}, {"t": 1260.5666666666666, "x": "入っていない。米田議員はこう言った。"}, {"t": 1262.85, "x": "「百十八名のうち九十六名が七階で、火災に\nよらず煙と有毒ガスによって」亡くなった、と。"}, {"t": 1269.7166666666667, "x": "外から来たはしご車の動きも、記録に残っている。"}, {"t": 1272.9333333333334, "x": "最初のはしご車が窓に向けて\n伸び始めたのは、夜10時45分ごろだ。"}, {"t": 1277.5833333333333, "x": "火事に気づいてからすぐね。"}, {"t": 1279.3333333333333, "x": "出てきたはしご車は7台。"}, {"t": 1280.8666666666666, "x": "窓からの救助に使われたのは5台だ。"}, {"t": 1283.3333333333333, "x": "夜10時51分ごろ着いた1台は、\nすぐには伸ばさなかった。"}, {"t": 1287.2833333333333, "x": "どうして？"}, {"t": 1288.4166666666667, "x": "まず、ハンドマイクで呼びかけたんだ。およそ5分間。"}, {"t": 1291.55, "x": "飛び降りないでくれ、という\n呼びかけと、救助袋の使い方だ。"}, {"t": 1295.45, "x": "下から袋の入り方を教えたのね。"}, {"t": 1297.8166666666666, "x": "そうだ。7階では誰も使い方を知らなかったからな。"}, {"t": 1301.1666666666667, "x": "別の1台はバンドマンの控え室の窓に付いた。"}, {"t": 1304.1666666666667, "x": "18分間で20人を助け出している。"}, {"t": 1306.8833333333334, "x": "1分に1人くらい。"}, {"t": 1308.3666666666666, "x": "出演者の控え室の窓では10分間で10人だ。"}, {"t": 1311.5666666666666, "x": "はしご車の最後の救出は夜11時23分ごろ。"}, {"t": 1314.9333333333334, "x": "7階の東側の、いちばん南の窓から男性を1人助けた。"}, {"t": 1319.1666666666667, "x": "夜11時半ごろ、7階に助けを待つ\n人はもういないと判断された。"}, {"t": 1323.6833333333334, "x": "煙が出始めてから1時間もたってないのね。"}, {"t": 1326.65, "x": "そうだ。7階からの救助は、\nほぼ1時間の間のことだった。"}, {"t": 1330.6333333333334, "x": "その1時間のうち、最初の数分で\n使えたはずの道が、B階段だった。"}, {"t": 1335.9, "x": "ここでこの夜の7階を一枚の表にしてみる。"}, {"t": 1338.7166666666667, "x": "大阪市の消防局がまとめた数字だ。"}, {"t": 1341.15, "x": "火事のとき7階にいたのは、181人と推定されている。"}, {"t": 1345.2666666666667, "x": "最初の報告は約170人じゃなかった？"}, {"t": 1348.1666666666667, "x": "火事の3日後の国の報告は「約百七十名」だった。"}, {"t": 1351.95, "x": "あとの消防局の調べで181人になった。\nここでは181人を使う。"}, {"t": 1357.2166666666667, "x": "助かった人は？"}, {"t": 1358.5666666666666, "x": "63人だ。道ごとに分けるとこうなる。"}, {"t": 1361.3333333333333, "x": "はしご車で50人。"}, {"t": 1362.5833333333333, "x": "救助袋で5人。"}, {"t": 1363.85, "x": "下で広げた救助用の布で受け止められた人が3人。"}, {"t": 1367.2, "x": "B階段で2人。窓から飛び降りて助かった人が2人。"}, {"t": 1370.7833333333333, "x": "エレベーターで1人。"}, {"t": 1372.1, "x": "A階段とE階段とF階段は？"}, {"t": 1374.4333333333334, "x": "0人だ。地上まで階段で降りた\n人は、B階段の2人しかいない。"}, {"t": 1378.8166666666666, "x": "4つの階段で2人。"}, {"t": 1380.4166666666667, "x": "火事の5日後、消防庁の予防課長が\n国会でこう言っている。"}, {"t": 1384.0666666666666, "x": "「階段を使用しておりた方は、きのうまで調べた\n新しい状況では二名ばかりあるようでございまして」。"}, {"t": 1389.7166666666667, "x": "火事のすぐあとから、この2人という\n数字は出ていたことになる。"}, {"t": 1393.45, "x": "表にすると道の偏りがはっきりするわね。"}, {"t": 1396.2166666666667, "x": "そうだ。50人を助けたのは、外から来たはしご車だ。"}, {"t": 1399.7833333333333, "x": "建物の中に用意されていた道で\n助かったのは、全部合わせても8人になる。"}, {"t": 1404.6833333333334, "x": "階段とエレベーターと救助袋で8人。"}, {"t": 1407.2833333333333, "x": "用意されていた道は7つあった。"}, {"t": 1409.9166666666667, "x": "この表には一つ引っかかる点がある。"}, {"t": 1412.3, "x": "引っかかる？"}, {"t": 1413.4333333333334, "x": "火事の3日後の国会で、建設省の担当者が\n階段を一つずつ説明した。"}, {"t": 1418.35, "x": "そのときB階段についてはこう言っている。"}, {"t": 1420.75, "x": "「これもドアが施錠され、その踊り場のところには\nいろいろな荷物が置かれておる」。"}, {"t": 1425.15, "x": "えB階段も鍵がかかってたの？"}, {"t": 1427.2833333333333, "x": "火事の3日後の説明ではな。"}, {"t": 1429.0166666666667, "x": "全部の階段が施錠されていた、とまとめている。"}, {"t": 1432.0, "x": "ところが、のちの消防局の資料では\n「施錠されておらず」となっている。"}, {"t": 1436.3666666666666, "x": "最高裁の決定も、B階段を唯一の安全な\n避難階段として書いている。"}, {"t": 1441.1666666666667, "x": "どっちが本当なの？"}, {"t": 1442.6, "x": "この回ではどちらかに決めない。"}, {"t": 1444.4333333333334, "x": "ただ、早い説明は「推測されております」という\n言葉も使っていた。"}, {"t": 1448.95, "x": "あとになって、裁判で争われた\n結果が決定の書き方だ。"}, {"t": 1452.6833333333334, "x": "B階段から実際に2人が降りている、という事実もある。"}, {"t": 1456.2833333333333, "x": "降りた人がいるなら少なくとも通れたのね。"}, {"t": 1459.0166666666667, "x": "そういうことになる。"}, {"t": 1460.1833333333334, "x": "火事の直後は、どの扉が\nどうだったか、国にも分からなかった。"}, {"t": 1464.1333333333334, "x": "予防課長も「どの程度使える状態にあったか、\nこれを調べてはおりますが」と言っていた。"}, {"t": 1469.5166666666667, "x": "開いてたかどうかすら、すぐには分からなかったのね。"}, {"t": 1472.7333333333333, "x": "だから裁判は、この階段を\nめぐって長くかかることになる。"}, {"t": 1476.45, "x": "開いてた階段があったなら、なおさら悔しいわね。"}, {"t": 1479.6, "x": "そうだ。閉じていた道だけなら、\n建物のせいとも言える。"}, {"t": 1483.0, "x": "だが開いていた道が一つあって、\nそこへ人を導けなかった。"}, {"t": 1486.8666666666666, "x": "この違いがのちの判決を分けることになる。"}, {"t": 1490.1166666666666, "x": "ここで後回しにしていた火のもとの話をする。"}, {"t": 1493.1, "x": "分かってないって言ってたやつね。"}, {"t": 1495.0666666666666, "x": "火事の翌日の夜、3階で工事をしていた\n作業員の1人が逮捕された。"}, {"t": 1499.55, "x": "警察庁の担当者は国会で、たばこの火の不始末と\n認められた、と説明している。"}, {"t": 1504.9833333333333, "x": "じゃあその人が原因？"}, {"t": 1506.4666666666667, "x": "そこで終わらなかった。この作業員は、\nのちに不起訴になっている。"}, {"t": 1510.4333333333334, "x": "不起訴？"}, {"t": 1511.55, "x": "裁判にかけないという検察の決定だ。"}, {"t": 1514.0833333333333, "x": "3年後の国会で、法務省の刑事局長が\n理由を説明している。"}, {"t": 1518.2166666666667, "x": "一つ目は自供が変わり続けたことだ。"}, {"t": 1520.6333333333334, "x": "最初は「自分がマッチで放火をした」。"}, {"t": 1523.0, "x": "次に「火のついたたばこを捨てたんだ」。"}, {"t": 1525.3666666666666, "x": "さらに「マッチの火が消えているのを\n確認しないで捨てたんだ」。"}, {"t": 1529.0, "x": "話がどんどん変わってる。"}, {"t": 1530.7166666666667, "x": "刑事局長は「自供が転々として」と言っている。"}, {"t": 1533.9666666666667, "x": "二つ目は火の付き方を試した実験だ。"}, {"t": 1536.6166666666666, "x": "火のついたマッチを捨てて、あんな火事が起こるのか。"}, {"t": 1539.5666666666666, "x": "結果は「一メートルの高さの布団の積み重ねの上に」\n捨てれば起こりうる、だった。"}, {"t": 1544.7666666666667, "x": "1メートルの布団の上にわざわざ？"}, {"t": 1546.9333333333334, "x": "刑事局長も、それが\n常識的にあり得るだろうか、と述べている。"}, {"t": 1550.9166666666667, "x": "三つ目はほかの事情だ。"}, {"t": 1552.4666666666667, "x": "火事の2週間ほど前、4階の婦人服売場に\n夜、何者かが入っていた。"}, {"t": 1557.2833333333333, "x": "婦人服にいたずら書きをしていったという。"}, {"t": 1559.6666666666667, "x": "それから、閉店前に閉まっていた\n3階の防火シャッターが、火事のときは開いていた。"}, {"t": 1564.8166666666666, "x": "閉めたはずのシャッターが開いてた。"}, {"t": 1566.9333333333334, "x": "刑事局長の結論は、この作業員を\n「犯人であるということを\n認定するだけの証拠に乏しかった」。"}, {"t": 1573.0, "x": "だからこの回では、作業員の名前も出さないし、\n原因とも言わない。"}, {"t": 1577.0666666666666, "x": "火のもとは分かっていない。"}, {"t": 1579.1666666666667, "x": "原因が分からないまま終わって、ご遺族は納得したの？"}, {"t": 1582.6333333333334, "x": "納得していない。それも国会の記録に残っている。"}, {"t": 1585.8666666666666, "x": "ご遺族は、不起訴はおかしいと、\n検察審査会に申し立てた。"}, {"t": 1589.9, "x": "検察審査会って？"}, {"t": 1591.3333333333333, "x": "検察が裁判にかけなかったことが\n正しいか、市民が見直す場だ。"}, {"t": 1595.4833333333333, "x": "ところが申し立ては却下された。"}, {"t": 1597.6, "x": "どうして？"}, {"t": 1598.7333333333333, "x": "申し立てできるのは亡くなった本人だけで、\nご遺族には権利がない、とされたんだ。"}, {"t": 1603.75, "x": "亡くなった本人は申し立てできないじゃない。"}, {"t": 1606.3666666666666, "x": "1975年3月、ある議員がそこを国会で取り上げた。"}, {"t": 1610.4333333333334, "x": "ご遺族の思いをこう代わりに述べている。"}, {"t": 1612.65, "x": "「その原因なり、はっきりしたものが\n全然究明されないまま、うやむやで終わっている」。"}, {"t": 1617.55, "x": "「どうにも納得できないわけなんですね」。"}, {"t": 1619.9666666666667, "x": "そう思うのは当たり前よ。"}, {"t": 1621.5833333333333, "x": "火のもとは分からない。"}, {"t": 1622.75, "x": "誰も、その夜の火について裁かれない。"}, {"t": 1625.3166666666666, "x": "ただ、火事を大きくした「管理」については、\n別に4人が起訴されていた。"}, {"t": 1630.0166666666667, "x": "4人？"}, {"t": 1631.15, "x": "デパートの管理部の次長と管理課長。"}, {"t": 1633.4333333333334, "x": "キャバレーを経営する会社の代表取締役と、\nキャバレーの支配人だ。"}, {"t": 1637.6, "x": "罪の名前は業務上過失致死傷。"}, {"t": 1639.8333333333333, "x": "火を出した責任ではない。"}, {"t": 1641.3, "x": "逃げ道と知らせの責任を問う裁判だ。"}, {"t": 1644.5, "x": "裁判は長くかかった。"}, {"t": 1646.0833333333333, "x": "4人のうち、管理部の次長は\n裁判の途中で亡くなっている。"}, {"t": 1649.65, "x": "最初の判決が出たのは、1984年5月16日。"}, {"t": 1653.7166666666667, "x": "火事から12年後だ。"}, {"t": 1655.35, "x": "12年。"}, {"t": 1656.4833333333333, "x": "大阪地方裁判所の判決は無罪だった。"}, {"t": 1659.3333333333333, "x": "無罪？"}, {"t": 1660.45, "x": "翌月の国会で、細谷治嘉 議員がこう言っている。"}, {"t": 1663.9666666666667, "x": "「全員無罪なんですよ」。"}, {"t": 1665.4166666666667, "x": "「せんじ詰めるともう個人の責任を\n問い詰めることはできない」。"}, {"t": 1668.9166666666667, "x": "118人が亡くなって誰の責任でもない？"}, {"t": 1671.9166666666667, "x": "細谷議員は新聞の社説の見出しも読み上げた。"}, {"t": 1674.8, "x": "「どこにある雑居ビルの管理責任」。"}, {"t": 1677.0, "x": "雑居ビルだから責任がばらばらってこと？"}, {"t": 1679.65, "x": "そういう読み方をされた判決だった。"}, {"t": 1681.9, "x": "このとき消防庁長官は、控訴中だとして\n判決への意見を控えた。"}, {"t": 1686.25, "x": "ただ一つだけ気になる点を挙げている。"}, {"t": 1688.5, "x": "「Ｂ階段を利用しての避難誘導の可能性」だ。"}, {"t": 1691.6333333333334, "x": "ここでもB階段。"}, {"t": 1692.95, "x": "そうだ。B階段へ誘導できたのか、できなかったのか。"}, {"t": 1696.4166666666667, "x": "裁判の大きな争いの一つがここにあった。"}, {"t": 1699.1166666666666, "x": "検察は控訴した。"}, {"t": 1700.5, "x": "3年後の1987年9月28日、\n大阪高等裁判所は一審の判決を取り消した。"}, {"t": 1707.05, "x": "3人は有罪になった。"}, {"t": 1709.2666666666667, "x": "最後は最高裁だ。1990年11月29日。"}, {"t": 1713.2666666666667, "x": "最高裁は、3人の上告を退けた。有罪が決まった。"}, {"t": 1717.25, "x": "火事から18年ね。"}, {"t": 1718.8333333333333, "x": "決定の中で支配人の側はこう主張していた。"}, {"t": 1721.7833333333333, "x": "前の年に消防の訓練をしたが、B階段が\n一番安全だとは言われなかった。"}, {"t": 1726.55, "x": "火の気のない下の階からの火事を、\nいつも心配する必要はない、と。"}, {"t": 1730.8666666666666, "x": "それに最高裁は？"}, {"t": 1732.2666666666667, "x": "こう答えている。"}, {"t": 1733.3166666666666, "x": "「あらかじめ階下からの出火を\n想定し、避難のための適切な\n経路の点検を行ってさえいれば」。"}, {"t": 1739.0833333333333, "x": "「Ｂ階段が安全確実に地上に\n避難することができる唯一の通路であるとの結論に"}, {"t": 1743.9666666666667, "x": "到達することは十分可能であった」。"}, {"t": 1746.35, "x": "点検していれば分かったはず。"}, {"t": 1748.3, "x": "そうだ。そして保安係が知らせを忘れた\n事情を考えても、と続ける。"}, {"t": 1752.7333333333333, "x": "避難の訓練をしなかった過失は明らかだ、とした。"}, {"t": 1756.0666666666666, "x": "デパートの管理課長のほうは？"}, {"t": 1757.9833333333333, "x": "3階の防火シャッターを閉め、工事に\n保安係を立ち会わせるべきだった、とした。"}, {"t": 1762.75, "x": "法律に「閉めろ」と書いてあるか\nどうかは関係ない、とも言っている。"}, {"t": 1766.75, "x": "「法令上の規定の有無を問わず」だ。"}, {"t": 1769.0333333333333, "x": "代表取締役は？"}, {"t": 1770.65, "x": "救助袋の修理や取り替えが\n放置されていたことなどを知っていた、とされた。"}, {"t": 1775.0333333333333, "x": "それなのに、支配人がきちんと\n備えているかを見ていなかった、とな。"}, {"t": 1779.2666666666667, "x": "火を出した人じゃなくて、道を用意する人の責任ね。"}, {"t": 1782.8333333333333, "x": "そうだ。この裁判で決まったのはそこだ。"}, {"t": 1785.35, "x": "火のもとは分からないままでも、\n逃げ道の責任は問える。"}, {"t": 1789.3166666666666, "x": "火事の3日後の国会では、\n建物の作りそのものも問われた。"}, {"t": 1793.15, "x": "ある議員が、京都大学の教授の言葉を\n読み上げている。"}, {"t": 1796.45, "x": "「千日デパートは旧歌舞伎座を改造したもので、\n内部は錯そうした空間がつくられていたとみられる」。"}, {"t": 1802.3, "x": "「このため外来者が自分のいる\n位置がとっさの場合、わからない」。"}, {"t": 1805.9333333333334, "x": "劇場を作り替えた建物だから、\n中が入り組んでたのね。"}, {"t": 1809.6166666666666, "x": "そうだ。7階の客も、エレベーターで\n上がって、細い通路を通って席に着く。"}, {"t": 1814.3666666666666, "x": "建設省の担当者も、客は細いところを通って\nカウンターの前から客席に行く、と説明している。"}, {"t": 1820.5666666666666, "x": "来た道しか知らないのね。"}, {"t": 1822.3333333333333, "x": "その来た道が、煙の吹き出すエレベーターだった。"}, {"t": 1825.35, "x": "現地を見た米田議員は、もっと\n踏み込んだことを言った。"}, {"t": 1828.5666666666666, "x": "不特定多数の人を集める部屋を、建物の高い\n階に置くことを考え直すべきだ、と。"}, {"t": 1834.0666666666666, "x": "キャバレーを上の階に作るなってこと？"}, {"t": 1836.3333333333333, "x": "「規制する必要があるのじゃないか」という\n言い方だ。"}, {"t": 1839.3166666666666, "x": "自治政務次官も最初の報告で、\n今後の重点を三つ挙げている。"}, {"t": 1843.3, "x": "避難誘導の訓練。ビル全体での共同の管理。"}, {"t": 1846.35, "x": "そして「避難路を煙から守るための措置」だ。"}, {"t": 1849.6, "x": "最初の報告で、もう煙から道を守るって言ってたのね。"}, {"t": 1853.3, "x": "そうだ。この火事の答えは、\n最初から「道と煙」だった。"}, {"t": 1857.9, "x": "この火事のあと何か変わったの？"}, {"t": 1859.9333333333334, "x": "変わった。この回は道の話なので、\n道に関わるものだけ言う。"}, {"t": 1863.95, "x": "まず火事の3日後、雑居ビルを全国で\n点検することが閣議で決まった。"}, {"t": 1868.3833333333334, "x": "その年の12月には、火を見張る\n責任者の決まりが変わった。"}, {"t": 1872.25, "x": "ビルにいくつも店がある場合に、\n全体で決まりを作る範囲が広げられた。"}, {"t": 1876.65, "x": "7階だけ別をなくすのね。"}, {"t": 1878.6166666666666, "x": "そういう方向だ。翌年の8月には、\n建物の決まりも変わった。"}, {"t": 1882.8333333333333, "x": "防火の扉は、ふだんから\n閉めておくのが原則になった。"}, {"t": 1886.4333333333334, "x": "開けっぱなしのシャッターをなくすのね。"}, {"t": 1888.65, "x": "それから避難階段の扉だ。"}, {"t": 1890.6, "x": "煙を通さない作りにすること。"}, {"t": 1892.5, "x": "煙を感じたら自動で閉まること。"}, {"t": 1894.8333333333333, "x": "E階段やF階段みたいに、\n煙の通り道にならないように。"}, {"t": 1898.7, "x": "そうだ。換気ダクトの弁にも、\n煙を止める力が求められた。"}, {"t": 1902.6666666666667, "x": "止めるはずの弁が止めなかった、この夜への答えだ。"}, {"t": 1905.9333333333334, "x": "翌年にも大きな火事があったわよね。"}, {"t": 1908.3, "x": "熊本のデパートの火事だな。それは\n別の回で扱った。ここでは中に入らない。"}, {"t": 1913.2, "x": "研究者は、二つの火事の\nあとの改正について、こう書いている。"}, {"t": 1917.0666666666666, "x": "「これらの以上に述べた重要な改正以降、\n死者100人を超すようなビル火災は発生していない」。"}, {"t": 1922.4666666666667, "x": "決まりが変わって同じことは起きてない。"}, {"t": 1924.8166666666666, "x": "100人を超える火事はな。"}, {"t": 1926.3166666666666, "x": "ただ、決まりを作るのと、その道を\n知っていることは別の話だ。"}, {"t": 1931.0, "x": "一つずつ見てきた道を、最後に\nもう一度並べてくれない？"}, {"t": 1934.6333333333334, "x": "並べよう。"}, {"t": 1935.75, "x": "最初に数えた道は、全部でいくつだったっけ？"}, {"t": 1938.8, "x": "階段とエレベーターと救助袋で7つだ。"}, {"t": 1941.3666666666666, "x": "A階段は鍵が煙の向こうにあった。"}, {"t": 1943.7166666666667, "x": "E階段は開けたら煙の通り道だった。"}, {"t": 1946.25, "x": "F階段はカーテンの裏で上も下も煙だった。"}, {"t": 1949.2, "x": "エレベーターは止まり、下から来た1基に1人が乗れた。"}, {"t": 1952.4333333333334, "x": "救助袋は口が開かず5人が降りた。"}, {"t": 1955.0666666666666, "x": "そしてB階段。"}, {"t": 1956.3333333333333, "x": "開いていて、煙が入らなくて、地上まで降りられた。"}, {"t": 1959.6833333333334, "x": "そこを通ったのは、その階段を知っていた2人だった。"}, {"t": 1963.0666666666666, "x": "知ってるかどうかで分かれちゃったのね。"}, {"t": 1965.25, "x": "最高裁も、知らせて、導いておくべきだったと言った。"}, {"t": 1968.7833333333333, "x": "道があることと、その道を\n誰かが知っていることは、違う。"}, {"t": 1972.5166666666667, "x": "……私たちが入るお店にも、\n知らない階段があるのかしら。"}, {"t": 1976.15, "x": "あるかもしれないな。"}, {"t": 1977.35, "x": "千日デパートの建物はのちに取り壊された。"}, {"t": 1980.2333333333333, "x": "跡地には別のビルが建っている。"}, {"t": 1982.1333333333334, "x": "1972年5月13日の夜、7階の窓から\n見下ろした千日前の交差点。"}, {"t": 1987.8166666666666, "x": "そこには今もたくさんの人が行き交っている。"}, {"t": 1990.4166666666667, "x": "今回は、7階から外へ出る\n7つの道の記録を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
