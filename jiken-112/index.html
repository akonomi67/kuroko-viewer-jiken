<script>
const D={"name": "112", "file": "112_編集用", "dur": 2003.66665625, "segs": [], "subs": [{"t": 0.0, "x": "1954年3月14日。"}, {"t": 2.45, "x": "静岡県の焼津港に、1隻のマグロ船が戻ってきた。"}, {"t": 6.0, "x": "木でできた船だ。"}, {"t": 7.2, "x": "名前は第五福竜丸という。"}, {"t": 9.1, "x": "教科書で見た名前ね。"}, {"t": 10.666666666666666, "x": "たぶんその船だ。"}, {"t": 11.866666666666667, "x": "乗っていたのは23人。"}, {"t": 13.45, "x": "年はいちばん下が18歳で、上が39歳。"}, {"t": 16.666666666666668, "x": "平均すると25歳になる。"}, {"t": 18.7, "x": "みんな若いのね。"}, {"t": 19.933333333333334, "x": "その若い男たちの顔や手が、赤くはれていた。"}, {"t": 22.983333333333334, "x": "水ぶくれのできた人もいた。"}, {"t": 24.933333333333334, "x": "日焼けじゃなくて？"}, {"t": 26.15, "x": "日焼けとは違った。"}, {"t": 27.466666666666665, "x": "2週間ほど前、海の上で空から灰が降ってきた。"}, {"t": 30.733333333333334, "x": "船の上に白く積もった灰だ。"}, {"t": 32.7, "x": "男たちはその灰をかぶったまま、ここまで帰ってきた。"}, {"t": 36.06666666666667, "x": "灰はアメリカの水爆実験で舞い上がったものだった。"}, {"t": 39.28333333333333, "x": "水爆。"}, {"t": 40.1, "x": "場所は太平洋のまんなか。"}, {"t": 41.833333333333336, "x": "マーシャル諸島のビキニ環礁だ。"}, {"t": 43.75, "x": "このあと船の名前は、国会で何度も読み上げられる。"}, {"t": 46.916666666666664, "x": "1955年の暮れまでに、この名前が\n出てくる発言は219件ある。"}, {"t": 51.96666666666667, "x": "そんなに。"}, {"t": 52.833333333333336, "x": "話は船の上の23人だけでは終わらない。"}, {"t": 55.666666666666664, "x": "積んできたマグロのこと。"}, {"t": 57.15, "x": "同じ海にいたほかの船のこと。"}, {"t": 59.13333333333333, "x": "そして最後に短い書簡で決着がついたこと。"}, {"t": 62.28333333333333, "x": "短い書簡？"}, {"t": 63.4, "x": "日本とアメリカの政府が取り交わしたものだ。"}, {"t": 66.01666666666667, "x": "そこには200万ドルという金額が書いてある。"}, {"t": 68.75, "x": "もう一つ大事な言葉も入っている。"}, {"t": 70.96666666666667, "x": "それは後ろのほうで読む。"}, {"t": 73.05, "x": "この出来事を追うと、同じものに何度も行き当たる。"}, {"t": 76.06666666666666, "x": "線だ。"}, {"t": 76.81666666666666, "x": "線？"}, {"t": 77.36666666666666, "x": "地図の上の線。表の上の線。名簿の上の線だ。"}, {"t": 80.48333333333333, "x": "アメリカは実験場のまわりに危険区域を決めていた。"}, {"t": 83.61666666666666, "x": "船が入ってはいけない範囲だ。"}, {"t": 85.51666666666667, "x": "日本の政府の調べでは、\n第五福竜丸はその線の外にいた。"}, {"t": 89.51666666666667, "x": "外にいたのに灰が降ったの。"}, {"t": 91.43333333333334, "x": "降った。"}, {"t": 92.08333333333333, "x": "線の内側だけが危ないという考えは、ここで崩れた。"}, {"t": 95.6, "x": "線を守っていても、安全じゃなかったのね。"}, {"t": 98.35, "x": "少なくともこの朝は、そうだった。"}, {"t": 100.63333333333334, "x": "そのあとも線は何度も引かれる。"}, {"t": 102.56666666666666, "x": "どの魚を捨てるか。"}, {"t": 103.98333333333333, "x": "どの船を調べるか。"}, {"t": 105.33333333333333, "x": "誰を被害にあった人として数えるか。"}, {"t": 107.73333333333333, "x": "線の内側に入った人には、記録が残った。"}, {"t": 110.8, "x": "外に置かれた人の記録は、\n長いあいだ表に出なかった。"}, {"t": 114.48333333333333, "x": "その線を今回は1本ずつ見ていくのね。"}, {"t": 117.13333333333334, "x": "そうだ。"}, {"t": 117.75, "x": "乗っていた方々の病気の話も出てくる。"}, {"t": 120.38333333333334, "x": "それは国会などに残った記録の範囲だけで話す。"}, {"t": 123.55, "x": "23人の中には、いまも暮らしている\n方がいるかもしれない。"}, {"t": 127.28333333333333, "x": "だから名前を出すのは、亡くなったことが\n公に伝えられた方だけにする。"}, {"t": 131.66666666666666, "x": "ご家族のお名前は出さない。"}, {"t": 133.48333333333332, "x": "わかったわ。"}, {"t": 134.41666666666666, "x": "では船の生まれから始める。"}, {"t": 136.78333333333333, "x": "第五福竜丸は最初からこの名前だったわけではない。"}, {"t": 139.95, "x": "造られたのは1947年。"}, {"t": 142.18333333333334, "x": "和歌山県の古座町だ。"}, {"t": 143.85, "x": "いまの串本町にあたる。"}, {"t": 145.46666666666667, "x": "そのころの名前は第七事代丸。"}, {"t": 147.85, "x": "ことしろまる。"}, {"t": 148.88333333333333, "x": "カツオを釣るための船だった。"}, {"t": 150.66666666666666, "x": "1953年にマグロの船に\n造り直されて、焼津の船になった。"}, {"t": 155.28333333333333, "x": "そのとき付いた名前が第五福竜丸だ。"}, {"t": 157.76666666666668, "x": "大きさは総トン数で140トン。"}, {"t": 159.93333333333334, "x": "長さはおよそ30メートルある。"}, {"t": 161.98333333333332, "x": "それって大きいの？"}, {"t": 163.23333333333332, "x": "遠い海まで出るマグロ船としては、大きくはない。"}, {"t": 166.1, "x": "この船に23人が乗り込んだ。"}, {"t": 168.26666666666668, "x": "船の上の仕事は細かく分かれている。"}, {"t": 170.61666666666667, "x": "船を動かす船長。"}, {"t": 171.98333333333332, "x": "どこで縄を入れるかを決める漁労長。"}, {"t": 174.06666666666666, "x": "陸と連絡をとる無線長。"}, {"t": 175.81666666666666, "x": "とった魚を凍らせて守る冷凍士。"}, {"t": 178.08333333333334, "x": "そして縄を入れたり上げたりする甲板の人たちだ。"}, {"t": 181.08333333333334, "x": "漁労長は見崎吉男さん。"}, {"t": 182.71666666666667, "x": "久保山愛吉さんは無線長だ。このとき\n39歳で、船ではいちばん年上の一人だった。"}, {"t": 188.38333333333333, "x": "冷凍士として大石又七さんが乗っていた。"}, {"t": 191.06666666666666, "x": "大石さんはのちに、この航海のことを\n本に書き、人前で語り続けた。"}, {"t": 195.71666666666667, "x": "船長さんは？"}, {"t": 196.8, "x": "この航海では本来の船長が急に病気になった。"}, {"t": 199.91666666666666, "x": "それで若い乗組員が代わりに船長を務めている。"}, {"t": 202.93333333333334, "x": "1954年1月22日。"}, {"t": 205.48333333333332, "x": "船は焼津港を出た。"}, {"t": 206.81666666666666, "x": "この船にとって、4回目の遠い海への漁だった。"}, {"t": 209.95, "x": "行き先は南の海。マグロをとるはえ縄の漁だ。"}, {"t": 213.6, "x": "はえ縄というのは、長い縄に\nたくさんの釣り針をつけて流す道具だ。"}, {"t": 217.7, "x": "全部つなぐと何十キロにもなる。"}, {"t": 219.9, "x": "そんなに長いの。"}, {"t": 221.15, "x": "だから一度入れると、上げるまでに何時間もかかる。"}, {"t": 224.2, "x": "このことがあとで大きく効いてくる。"}, {"t": 226.18333333333334, "x": "船はマーシャル諸島の近くの海で漁をした。"}, {"t": 228.91666666666666, "x": "アメリカが実験をしていた場所の近くよね。"}, {"t": 231.65, "x": "そうだ。危険区域があることは知らされていた。"}, {"t": 234.38333333333333, "x": "ビキニのまわりが危険区域に\n加えられたのは、前の年の10月10日。"}, {"t": 238.61666666666667, "x": "海上保安庁が航路告示を出して、船に知らせていた。"}, {"t": 242.1, "x": "それより前からあった区域は、\nエニウェトク環礁のまわりだ。"}, {"t": 245.48333333333332, "x": "こちらは1952年に、アメリカから\n文書で知らされていた。"}, {"t": 249.5, "x": "広さは東西に200海里、南北に150海里。"}, {"t": 252.9, "x": "ずいぶん広いのね。"}, {"t": 254.21666666666667, "x": "ビキニはその東にある。"}, {"t": 255.81666666666666, "x": "そこが新しく線の内側に加えられた。"}, {"t": 258.3666666666667, "x": "ただこの区域には変わった点がある。"}, {"t": 260.48333333333335, "x": "「追って通告があるまで」\n危険とされる出しっぱなしの区域だった。"}, {"t": 264.3833333333333, "x": "いつ実験するかは、知らされないの？"}, {"t": 266.78333333333336, "x": "知らされない。"}, {"t": 267.6666666666667, "x": "外務省の条約局長は国会でこう説明した。"}, {"t": 270.8, "x": "前もって知らせるのは、安全保障の理由から\n好ましくない、というのがアメリカ側の考えだった。"}, {"t": 276.5, "x": "つまり船の側からは、\n線の外にいることしか守りようがなかった。"}, {"t": 280.6166666666667, "x": "いつ来るか分からないなら、なおさらね。"}, {"t": 283.01666666666665, "x": "運輸大臣は3月19日の国会でこう答えている。"}, {"t": 286.3333333333333, "x": "船長と漁労長の話は、少し食い違っていた。"}, {"t": 289.53333333333336, "x": "船には海図もなかった。"}, {"t": 291.1333333333333, "x": "そこで海上保安庁が海図を\n取り寄せて、位置を調べ直した。"}, {"t": 294.8666666666667, "x": "その結果がこれだ。"}, {"t": 296.18333333333334, "x": "船が光を見た位置は、危険な海の東の方へ19マイル。"}, {"t": 300.1333333333333, "x": "19マイルって？"}, {"t": 301.43333333333334, "x": "30キロほどだ。"}, {"t": 302.7, "x": "線の外にそれだけ離れていた。"}, {"t": 305.4, "x": "1954年3月1日。"}, {"t": 307.75, "x": "まだ空が暗い夜明け前のことだ。"}, {"t": 309.8333333333333, "x": "乗組員たちは縄を海に入れ終えたところだった。"}, {"t": 312.6166666666667, "x": "そのとき西の空が明るくなった。"}, {"t": 314.9166666666667, "x": "西？　朝日は東からでしょう。"}, {"t": 317.03333333333336, "x": "そうだ。だからみんな何が起きたのか分からなかった。"}, {"t": 320.1333333333333, "x": "光を見た時刻は、資料によって違う。"}, {"t": 322.71666666666664, "x": "運輸大臣の答弁では、船は3時42分ごろに\n星を見て位置を測っていた。"}, {"t": 327.55, "x": "光を見たのは4時12分ごろで、そこから\n東へ500メートルほどの所だった。"}, {"t": 332.43333333333334, "x": "展示館などの資料では、光は\n午前3時45分とされている。"}, {"t": 336.5, "x": "この回ではどちらとも決めない。"}, {"t": 338.35, "x": "音は少し遅れてやってきた。"}, {"t": 340.21666666666664, "x": "東京大学の都築正男教授は、国会でこう伝えている。"}, {"t": 343.8666666666667, "x": "「はるか遠方に光が見えた。それから\n数分たちましてから鈍い爆音を聞いた」"}, {"t": 348.6333333333333, "x": "遠くで何かが爆発した、ってこと？"}, {"t": 351.1333333333333, "x": "そうだ。"}, {"t": 351.76666666666665, "x": "アメリカがこの朝に行ったのは、\nキャッスル作戦という一連の実験の1回目だった。"}, {"t": 356.8666666666667, "x": "水爆にはブラボーという名前がついていた。"}, {"t": 359.3, "x": "爆発の力は15メガトン。"}, {"t": 361.25, "x": "広島に落とされた原爆のおよそ1000倍とされている。"}, {"t": 364.5, "x": "1000倍……。"}, {"t": 365.26666666666665, "x": "船がいたのは爆心から東へおよそ160キロの海の上だ。"}, {"t": 369.15, "x": "東京から静岡までより、もう少し遠い。"}, {"t": 371.76666666666665, "x": "中泉教授は国会で、80\nカイリ離れていたと話している。"}, {"t": 375.73333333333335, "x": "こちらはおよそ150キロになる。"}, {"t": 377.81666666666666, "x": "数字は資料でずれるが、遠く離れていたことは同じだ。"}, {"t": 381.25, "x": "そんなに離れていたのに。"}, {"t": 382.95, "x": "離れていた。"}, {"t": 383.8666666666667, "x": "光を見たあと乗組員たちは縄を上げ始めた。"}, {"t": 386.8, "x": "何十キロもある縄だ。"}, {"t": 388.31666666666666, "x": "その場をすぐに離れることはできなかった。"}, {"t": 391.4166666666667, "x": "しばらくすると、空の様子が変わった。"}, {"t": 393.8833333333333, "x": "都築教授の説明はこう続く。"}, {"t": 395.93333333333334, "x": "「ちょうどさみだれが降るように\nその辺が曇って参りまして」"}, {"t": 399.18333333333334, "x": "「そうして何か灰のようなものが落っこって来た」"}, {"t": 402.0, "x": "それが白い灰。"}, {"t": 403.21666666666664, "x": "そうだ。細かい粉のような灰だった。"}, {"t": 405.5833333333333, "x": "同じ東京大学の中泉正徳教授は、\n別の日の国会でこう話した。"}, {"t": 410.3, "x": "「灰は爆発しましてから数時間後に\n船に降り始めまして、5、6時間続いて\n灰が降っておったらしいです」"}, {"t": 416.78333333333336, "x": "「甲板などでは、人の足跡があとで\nわかるくらいに降ったらしいです」"}, {"t": 420.85, "x": "足あとが残るほど……。"}, {"t": 422.26666666666665, "x": "粒の細かいものは、船室の中にまで舞い込んだ。"}, {"t": 425.45, "x": "髪の毛にも服にも耳の中にも入った。"}, {"t": 428.05, "x": "降り始めた時刻と降っていた長さは、\n資料によって数時間ずつ違う。"}, {"t": 432.35, "x": "ただ何時間も降り続いたことは、どの記録も同じだ。"}, {"t": 435.71666666666664, "x": "灰の正体は何だったのか。"}, {"t": 437.5, "x": "都築教授は珊瑚礁の\nかけらではないか、と国会で話している。"}, {"t": 441.3833333333333, "x": "これは想像だと本人が断ったうえでだ。"}, {"t": 443.9166666666667, "x": "いまの展示館は、爆発で砕けた\nサンゴの粉だと説明している。"}, {"t": 447.98333333333335, "x": "きのこ雲に吸い上げられて、\nまわりの海に降ってきたものだ。"}, {"t": 451.43333333333334, "x": "この灰はのちに「死の灰」と呼ばれる。"}, {"t": 453.8666666666667, "x": "だがそのときの甲板では、まだ\n名前のない白い粉だった。"}, {"t": 457.45, "x": "縄を上げ終えた船は、焼津へ向けて走り出した。"}, {"t": 461.01666666666665, "x": "焼津までの帰り道は、2週間ほどかかる。"}, {"t": 463.8, "x": "その間に体の様子が変わってきた。"}, {"t": 466.1666666666667, "x": "都築教授の説明では、灰をかぶって2、\n3日たつと顔や手が赤くはれてきた。"}, {"t": 471.1166666666667, "x": "ひりひりしてむずがゆいような感じがあった。"}, {"t": 473.55, "x": "一部には水ぶくれもできた。"}, {"t": 475.43333333333334, "x": "それでも何なのか分からないのよね。"}, {"t": 477.6333333333333, "x": "分からない。"}, {"t": 478.4166666666667, "x": "船の上には医者もいないし、\n放射線を測る道具もない。"}, {"t": 481.73333333333335, "x": "都築教授の言い方では、23人が\n2週間ばかり、その船に乗って帰ってきた。"}, {"t": 486.9, "x": "中泉教授は国会でこう言っている。"}, {"t": 489.18333333333334, "x": "「船員たちは恐ろしいものだとは知らずに、\n二週間くらいして焼津にたどり着いた」"}, {"t": 493.8666666666667, "x": "その間はほかに食べるものもない。"}, {"t": 495.8833333333333, "x": "とったマグロも食べていたはずだ、と教授は話した。"}, {"t": 499.0833333333333, "x": "灰の積もった船の上で……。"}, {"t": 500.81666666666666, "x": "灰は甲板にも船室にも残っていた。"}, {"t": 503.28333333333336, "x": "この2週間を外務省の欧米局長は\n国会でこう振り返っている。"}, {"t": 507.1333333333333, "x": "「現実に被害を受けました人たちが\n帰って来て初めてわかった」"}, {"t": 511.03333333333336, "x": "「その間約二週間を空費してしまった」"}, {"t": 513.65, "x": "空費。むだにしたってことね。"}, {"t": 515.7166666666667, "x": "船が港に着くまで、誰もこのことを知らなかった。"}, {"t": 518.95, "x": "3月14日船は焼津に戻った。"}, {"t": 521.9166666666666, "x": "港に着いた乗組員たちは、焼津の病院へ行った。"}, {"t": 525.1666666666666, "x": "都築教授の説明では、町の共立病院の外科だ。"}, {"t": 528.5833333333334, "x": "診た医師はただのやけどではないと考えた。"}, {"t": 531.0333333333333, "x": "そして顔と手がいちばんひどくやられていた\n2人を、東京へ向かわせた。"}, {"t": 535.2166666666667, "x": "東京の病院？"}, {"t": 536.3666666666667, "x": "東京大学の附属病院だ。"}, {"t": 538.3166666666667, "x": "2人が着いたのは15日の夕方。"}, {"t": 540.5666666666667, "x": "都築教授は翌日の16日にその2人を診ている。"}, {"t": 543.8833333333333, "x": "このとき船の灰も、少しだけ一緒に持ち込まれた。"}, {"t": 547.3, "x": "灰も？"}, {"t": 548.0333333333333, "x": "灰はすぐに大学の化学の研究室へ届けられた。"}, {"t": 551.2833333333333, "x": "中身を調べる作業が始まった。"}, {"t": 553.3333333333334, "x": "これがあとで大きな意味を持つ。"}, {"t": 555.05, "x": "ただこの時点で事情を知っていたのは、\nごく一部の人だけだった。"}, {"t": 558.8833333333333, "x": "港では船からマグロが下ろされていた。"}, {"t": 561.25, "x": "いつもの水揚げと同じように、市場へ回されていった。"}, {"t": 564.5333333333333, "x": "えっ。"}, {"t": 565.1666666666666, "x": "灰をかぶった船のマグロだ。"}, {"t": 566.9166666666666, "x": "それを止める決まりは、まだどこにもなかった。"}, {"t": 570.2166666666667, "x": "3月16日の朝。"}, {"t": 571.9, "x": "読売新聞がこのことを報じた。"}, {"t": 574.1, "x": "国より新聞のほうが先だったの？"}, {"t": 576.35, "x": "先だった。"}, {"t": 577.25, "x": "同じ16日参議院の予算委員会で、ある議員が\nこの記事を取り上げている。"}, {"t": 581.7166666666667, "x": "「恐るべき原子病に\nおかされておるというような記事が載っておる」"}, {"t": 585.1333333333333, "x": "「二十三名からなる日本の漁民」"}, {"t": 587.2833333333333, "x": "その日のうちに国会に届いたのね。"}, {"t": 589.65, "x": "そこから国の動きが一気に始まった。"}, {"t": 592.1166666666667, "x": "3月19日の厚生大臣の答弁では、\n2人が東大の病院にいた。"}, {"t": 596.6166666666667, "x": "ほかの21人は、焼津の病院でみてもらっていた。"}, {"t": 599.9, "x": "焼津に人が集まった。"}, {"t": 601.4666666666667, "x": "医者、学者、役所の人、記者だ。"}, {"t": 604.1166666666667, "x": "船には放射線を測る計器が向けられた。"}, {"t": 606.7333333333333, "x": "船は港の外れにつながれ、\n人が近づかないようにされた。"}, {"t": 610.4833333333333, "x": "焼津の町の様子は、国会でこう伝えられている。"}, {"t": 613.5166666666667, "x": "「まったく火の消えたようなさびしい状態」"}, {"t": 615.9, "x": "漁の町なのに。"}, {"t": 617.1666666666666, "x": "漁の町だからこそだ。"}, {"t": 618.6666666666666, "x": "そしてもう一つの心配が持ち上がった。"}, {"t": 621.1333333333333, "x": "すでに市場へ出ていた、あのマグロだ。"}, {"t": 623.9833333333333, "x": "厚生大臣が3月18日の国会で、\n行き先を説明している。"}, {"t": 628.3166666666667, "x": "焼津で水揚げした魚は、2290貫。"}, {"t": 631.6, "x": "かん？"}, {"t": 632.1666666666666, "x": "昔の重さの単位だ。いまの重さにすると\n8トンあまりになる。"}, {"t": 635.9666666666667, "x": "それが焼津から、13の府県に出荷されていた。"}, {"t": 639.2166666666667, "x": "13も。"}, {"t": 640.15, "x": "探して集めて測ることになった。"}, {"t": 642.3333333333334, "x": "東京に届いた分は、売りに出さずに\n全部埋めたと答弁されている。"}, {"t": 646.2166666666667, "x": "そして厚生省は、放射能を\n持っているというだけで、売ることを禁じた。"}, {"t": 650.5666666666667, "x": "それでひと安心？"}, {"t": 651.85, "x": "そうはならなかった。"}, {"t": 653.1, "x": "町の魚屋の店先で、マグロが売れなくなった。"}, {"t": 656.2, "x": "買う側からはどの船の魚かは分からないからだ。"}, {"t": 659.1166666666667, "x": "このころ原子マグロという言葉まで生まれている。"}, {"t": 661.7833333333333, "x": "そこで国は港で魚を一つずつ測ることにした。"}, {"t": 665.1, "x": "ここでまた線が引かれる。"}, {"t": 667.3, "x": "南の海から帰ってきた船は、決められた\n5つの港で魚を検査されることになった。"}, {"t": 672.6666666666666, "x": "使ったのはガイガー計数管という計器だ。"}, {"t": 675.2166666666667, "x": "放射線が当たると、カチカチと音を立てて数を数える。"}, {"t": 678.6666666666666, "x": "その数が多かったら、捨てる？"}, {"t": 680.7833333333333, "x": "そうだ。決められた数を超えた\n魚は、売ってはいけない。"}, {"t": 684.1333333333333, "x": "線は数字で引かれた。"}, {"t": 685.5833333333334, "x": "線の上の魚は捨てられ、線の下の魚は市場に出た。"}, {"t": 689.3833333333333, "x": "同じ船の魚でも、分かれることがあるのね。"}, {"t": 692.3666666666667, "x": "1匹ずつ測るから、そうなる。"}, {"t": 694.4333333333333, "x": "ただ測る道具も人も足りなかった。"}, {"t": 696.6833333333333, "x": "中泉教授は国会でこう打ち明けている。"}, {"t": 699.1666666666666, "x": "基準を決めるための計器は、日本に3台しかない。"}, {"t": 702.3166666666667, "x": "東京大学に1台、東京の研究所に\n1台、京都大学に1台だ。"}, {"t": 706.95, "x": "市場に船が着くたびに電話がかかり、\n夜でも頼まれて出かけた。"}, {"t": 710.8666666666667, "x": "本人の言葉では「寝耳に水で泥縄」だった。"}, {"t": 714.2166666666667, "x": "準備なんてできてなかったのね。"}, {"t": 716.25, "x": "役所を今すぐ責めるのは\n無理だ、とも教授は言っている。"}, {"t": 719.45, "x": "そして第五福竜丸のほかにも、\n引っかかる船が次々に出てきた。"}, {"t": 723.8333333333334, "x": "ほかの船も？"}, {"t": 724.95, "x": "アメリカの実験は、3月1日の1回で終わらなかった。"}, {"t": 728.5833333333334, "x": "キャッスル作戦の実験は、そのあとも続いた。"}, {"t": 731.5333333333333, "x": "立教大学の田島英三教授は、\n7月の国会でこう報告している。"}, {"t": 736.0333333333333, "x": "3月下旬から6月中旬までの船、およそ200隻。"}, {"t": 739.8, "x": "そのうち80隻ほどが、100\nカウントを超える放射能を示した。"}, {"t": 743.85, "x": "半分近く……。"}, {"t": 745.0166666666667, "x": "その海でマグロをとっていた\n船は、1隻や2隻ではなかった。"}, {"t": 748.7166666666667, "x": "秋には高知県を見て回った\n議員の報告も国会に出ている。"}, {"t": 752.3166666666667, "x": "4月から9月までに、魚を捨てた\n高知の船は130隻あった。"}, {"t": 756.8166666666667, "x": "高知の船だけで130隻……。"}, {"t": 759.0333333333333, "x": "この高知という名前は、\n最後のほうでもう一度出てくる。"}, {"t": 762.8833333333333, "x": "魚だけでなく海そのものも調べられた。"}, {"t": 765.4666666666667, "x": "1954年5月15日、調査船の俊鶻丸が東京港を出た。"}, {"t": 770.1833333333333, "x": "国が送り出した船で、学者たちが乗り込んでいた。"}, {"t": 773.4833333333333, "x": "何を調べに行ったの？"}, {"t": 775.0, "x": "海の水とプランクトン、それにマグロやサメだ。"}, {"t": 777.7666666666667, "x": "深さ800メートルまでの水も、\n何層にも分けてくみ上げた。"}, {"t": 781.55, "x": "雨が降ればその雨も集めて測った。"}, {"t": 783.8666666666667, "x": "船は50日ほどかけて、ビキニのまわりを回った。"}, {"t": 787.0333333333333, "x": "走った道のりは、およそ8000海里になる。"}, {"t": 789.7833333333333, "x": "7月4日に全員が無事に帰ってきた。"}, {"t": 792.5166666666667, "x": "それで海はどうだったの？"}, {"t": 794.1, "x": "汚れの強い所と弱い所が、\n波のように入りまじっていた。"}, {"t": 797.85, "x": "ビキニの西およそ80マイル、深さ50メートルの水では、\n1分間に5780カウントという値が出た。"}, {"t": 804.9, "x": "報告した学者は、これでも\n最高の値ではないと断っている。"}, {"t": 808.9, "x": "灰は海の中にも広がっていたのね。"}, {"t": 811.3, "x": "そうだ。"}, {"t": 811.9166666666666, "x": "魚には線を引けても、海には線を引けない。"}, {"t": 815.4833333333333, "x": "焼津に残っていた乗組員たちも、\n東京へ移ることになった。"}, {"t": 819.3, "x": "3月28日の正午。"}, {"t": 821.1833333333333, "x": "16人が国立東京第一病院に入った。"}, {"t": 824.2, "x": "残りの7人は東京大学の附属病院だ。"}, {"t": 827.2166666666667, "x": "23人全員が入院したのね。"}, {"t": 829.5666666666667, "x": "全員だ。"}, {"t": 830.3333333333334, "x": "病院では何度も血を採って調べた。"}, {"t": 832.5, "x": "血の中の白血球が、大きく減っていた。"}, {"t": 835.2, "x": "体を守る力が落ちている、ということだ。"}, {"t": 837.9333333333333, "x": "中泉教授は灰が体の中にも入っていると考えていた。"}, {"t": 841.6833333333333, "x": "息をするとき、食べるとき、肌から。"}, {"t": 844.1166666666667, "x": "だから治療は体の中の灰を一日も早く\n外に出すことが先だと話している。"}, {"t": 849.15, "x": "家族の人たちは心配だったでしょうね。"}, {"t": 851.7166666666667, "x": "焼津から東京は遠い。"}, {"t": 853.1833333333333, "x": "入院は春から夏へ、さらに秋へと続いていく。"}, {"t": 856.15, "x": "病室の外では別の騒ぎも続いていた。"}, {"t": 858.7833333333333, "x": "記者が集まり写真が撮られた。"}, {"t": 860.7, "x": "乗組員の名前と顔が、新聞に並んだ。"}, {"t": 863.6166666666667, "x": "本人たちにとっては、どうだったのかしら。"}, {"t": 866.3333333333334, "x": "そのことはもう少しあとで話す。"}, {"t": 868.9833333333333, "x": "東京大学に届いた灰は、すぐに分析にかけられた。"}, {"t": 872.5166666666667, "x": "都築教授は3月22日の国会で、\nその結果を話している。"}, {"t": 876.6833333333333, "x": "灰の大もとは炭酸カルシウム。"}, {"t": 878.6, "x": "貝殻やサンゴと同じ成分だ。"}, {"t": 880.5833333333334, "x": "そこに放射性の物質がくっついていた。"}, {"t": 883.1666666666666, "x": "どんなもの？"}, {"t": 884.1333333333333, "x": "ジルコニウム、ニオブ、ヨウ素、\nストロンチウム、バリウム。"}, {"t": 887.6333333333333, "x": "テルルやランタンという名前も挙がっている。"}, {"t": 889.8666666666667, "x": "都築教授は、10の放射性物質がある、と\n説明している。"}, {"t": 893.8, "x": "名前を聞いてもよく分からないけど、たくさんね。"}, {"t": 896.6833333333333, "x": "アメリカは実験の中身を、\nくわしくは公表していなかった。"}, {"t": 900.2, "x": "それでも灰を調べれば、\nどんな爆発だったのかの手がかりになる。"}, {"t": 904.05, "x": "焼津に戻った小さな船の灰が、その証拠になった。"}, {"t": 907.4333333333333, "x": "医学部では別の調べ方もしていた。"}, {"t": 909.7333333333333, "x": "灰をネズミに与えて、体のどこにたまるかを見た。"}, {"t": 912.8333333333334, "x": "いちばん多くたまったのは骨だった。"}, {"t": 914.95, "x": "骨の中には血を作る骨髄がある。"}, {"t": 917.2, "x": "中泉教授は国会で、こう言っている。"}, {"t": 919.7, "x": "「一番弱いところに一番たくさん、\n残念ながらたまっておる」"}, {"t": 923.15, "x": "……。"}, {"t": 924.0666666666667, "x": "灰は外から当たっただけではなかった。"}, {"t": 927.0, "x": "アメリカ側も説明を出してきた。"}, {"t": 929.0833333333334, "x": "3月31日。"}, {"t": 930.6166666666667, "x": "アイゼンハワー大統領の記者会見の場で、\n原子力委員会のストローズ委員長が声明を読んだ。"}, {"t": 936.1166666666667, "x": "第五福竜丸については、こういう見方を示している。"}, {"t": 939.3666666666667, "x": "船は危険区域の十分内側にいたに違いない。"}, {"t": 942.4666666666667, "x": "内側？　日本の政府は外だったって言ってたのに。"}, {"t": 945.6666666666666, "x": "そこが食い違った。"}, {"t": 946.9666666666667, "x": "日本大使館はのちにアメリカ側へ\n文書で反論している。"}, {"t": 950.3333333333334, "x": "船の位置は区域の外。"}, {"t": 951.8, "x": "19マイルあるいは26マイル外だった、と。"}, {"t": 954.6833333333333, "x": "大使館の文書によると、声明は\n船長の話も手がかりにしていた。"}, {"t": 958.9333333333333, "x": "光を見てから音が聞こえるまで、\n6分だったという話だ。"}, {"t": 962.6166666666667, "x": "大使館の側は7分から8分だったと返している。"}, {"t": 965.95, "x": "細かいところまで言い合ったのね。"}, {"t": 967.95, "x": "船がどこにいたのか。"}, {"t": 969.3333333333334, "x": "それは責任がどちらにあるかに、\nまっすぐつながる話だった。"}, {"t": 973.0333333333333, "x": "区域の中なら入った船の落ち度になる。"}, {"t": 975.5, "x": "外なら線の引き方の問題になる。"}, {"t": 977.95, "x": "だからこだわったのね。"}, {"t": 979.4666666666667, "x": "もう一つ国会で議員が問題にした話がある。"}, {"t": 982.4666666666667, "x": "アメリカの原子力の責任者が、"}, {"t": 984.4333333333333, "x": "スパイをするために近くへ寄ってくる\n場合もあり得る、と言ったというものだ。"}, {"t": 988.6166666666667, "x": "3月18日の衆議院で、議員はこれを\n「まことに心外な発言」と呼んだ。"}, {"t": 993.6166666666667, "x": "そして政府にスパイなどではないと\n断言してほしいと求めた。"}, {"t": 997.3, "x": "誰が言ったの？"}, {"t": 998.4166666666666, "x": "国会では「何とかいう人」としか言っていない。"}, {"t": 1001.4, "x": "アメリカ側の誰が、いつ言ったのかは、\n日本の記録からは確かめられない。"}, {"t": 1005.7833333333333, "x": "だからこの回では、それ以上は言わない。"}, {"t": 1008.7666666666667, "x": "夏になると多くの乗組員の具合は\n少しずつ落ち着いていった。"}, {"t": 1012.4166666666666, "x": "ただ一人だけ重くなっていった人がいる。"}, {"t": 1014.9, "x": "無線長の久保山愛吉さんだ。"}, {"t": 1016.9, "x": "受け持った医師が、のちに\n国会で経過を報告している。"}, {"t": 1020.2333333333333, "x": "6月24日から、黄疸が出た。"}, {"t": 1022.6333333333333, "x": "肝臓の働きが落ちて、肌や目が黄色くなる症状だ。"}, {"t": 1026.1166666666666, "x": "いったん軽くなっても、また\n強くなる。それを何度もくり返した。"}, {"t": 1030.0833333333333, "x": "8月29日に意識がもうろうとした。"}, {"t": 1032.6666666666667, "x": "9月4日の朝から、意識が戻ってきた。"}, {"t": 1035.5666666666666, "x": "よくなったの？"}, {"t": 1036.65, "x": "意識は最後まではっきりしていたと、\n医師は話している。"}, {"t": 1039.9166666666667, "x": "だが黄疸はずっと強いままだった。"}, {"t": 1042.0166666666667, "x": "輸血は11回におよんだ。"}, {"t": 1043.7833333333333, "x": "入れた血は合わせて2200グラムだった。"}, {"t": 1046.2333333333333, "x": "1954年9月23日、午後6時55分。"}, {"t": 1050.0333333333333, "x": "久保山さんは国立東京第一病院で亡くなった。"}, {"t": 1053.1833333333334, "x": "40歳だった。"}, {"t": 1054.2333333333333, "x": "……。"}, {"t": 1055.15, "x": "灰を浴びた3月1日から、206日後のことだった。"}, {"t": 1058.85, "x": "別の議員は国会で、その日を\n「お彼岸の中日」と言い表している。"}, {"t": 1063.2333333333333, "x": "4日後参議院の水産委員会で委員長がこう述べている。"}, {"t": 1066.55, "x": "「人類最初の水爆犠牲者として、去る\n二十三日逝去されました」"}, {"t": 1070.85, "x": "当時はこういう言い方がされた。"}, {"t": 1072.65, "x": "ただ実験場のあるマーシャル諸島の人たちも、\n同じ灰を浴びている。"}, {"t": 1076.6166666666666, "x": "だからこの回では、この言葉は\n当時の呼び方として紹介するだけにする。"}, {"t": 1081.6333333333334, "x": "久保山さんはなぜ亡くなったのか。"}, {"t": 1083.6333333333334, "x": "解剖を受け持った医師は、\n10月6日の参議院で話している。"}, {"t": 1087.2833333333333, "x": "解剖は亡くなってからわずか5時間14分後に行われた。"}, {"t": 1090.8666666666666, "x": "言い方はとても慎重だった。"}, {"t": 1092.6833333333334, "x": "「放射能症という新しい病名に相当する\n病変というものがあるのじゃなかろうか」"}, {"t": 1097.2666666666667, "x": "何かが加わったとしても、もとにあるのは\n放射性物質の影響ではないか、とも述べた。"}, {"t": 1102.6, "x": "言い切ってはいないのね。"}, {"t": 1104.0666666666666, "x": "言い切っていない。"}, {"t": 1105.05, "x": "一方アメリカ側には別の見方があった。"}, {"t": 1107.5333333333333, "x": "10月2日の衆議院で、ある議員がこう紹介している。"}, {"t": 1110.9166666666667, "x": "アメリカ側は日本の医学のあやまちだったとか、\n輸血のやり過ぎではなかったか、と言っている。"}, {"t": 1116.4166666666667, "x": "まったく違う説明ね。"}, {"t": 1118.1166666666666, "x": "同じ死に、2つの説明が並んだ。"}, {"t": 1120.5333333333333, "x": "この回ではどちらが正しいとは決めない。"}, {"t": 1122.85, "x": "記録に残っている言葉を、そのまま並べておく。"}, {"t": 1125.85, "x": "のちに夢の島の展示館が開くとき、\n久保山さんの記念碑が建てられた。"}, {"t": 1130.3666666666666, "x": "そこにはこう刻まれている。"}, {"t": 1131.9833333333333, "x": "「原水爆の被害者はわたしを最後にしてほしい」"}, {"t": 1134.8, "x": "展示館には久保山さんとご家族にあてて全国から\n届いた手紙が、およそ3000通残されている。"}, {"t": 1140.75, "x": "入院中の久保山さんがご家族に書いた\n手紙は、焼津市の資料館に残っている。"}, {"t": 1145.55, "x": "ご家族はその後も、長く取材を受け続けた。"}, {"t": 1148.45, "x": "この回ではご家族のお名前は出さない。"}, {"t": 1151.3666666666666, "x": "港での魚の検査は、その年の暮れまで続いた。"}, {"t": 1154.7166666666667, "x": "1954年の12月末で、検査は中止された。"}, {"t": 1158.5666666666666, "x": "やめたの？　どうして。"}, {"t": 1160.0666666666666, "x": "翌年1月の国会で、厚生省の担当者が\n理由を説明している。"}, {"t": 1164.4, "x": "食べる身の部分は、どれも10\nカウント以下になっていた。"}, {"t": 1167.4833333333333, "x": "残っている放射能も、おおむね\n亜鉛によるものだと説明された。"}, {"t": 1171.25, "x": "汚れていると分かるマグロは、全体の0.5パーセント。"}, {"t": 1174.45, "x": "200匹に1匹だった。"}, {"t": 1176.3166666666666, "x": "それでやめても大丈夫ってこと？"}, {"t": 1178.3666666666666, "x": "厚生省はそう判断した。"}, {"t": 1180.1, "x": "議員からは別の点も問われている。"}, {"t": 1182.15, "x": "検査をやめた時期が、アメリカとのお金の話が\nまとまった時期と重なっている、と。"}, {"t": 1187.1, "x": "厚生省の答えは「全くの偶然の一致」だった。"}, {"t": 1190.3, "x": "……。"}, {"t": 1191.2333333333333, "x": "ここでこの年の数をまとめておく。"}, {"t": 1193.35, "x": "1954年の暮れまでに、汚れた\nマグロを水揚げした船は856隻。"}, {"t": 1198.5666666666666, "x": "捨てられたマグロは456トンとされている。"}, {"t": 1201.6, "x": "856隻……。"}, {"t": 1203.15, "x": "これが記録に残った数だ。"}, {"t": 1205.0666666666666, "x": "記録に残ったって言い方が気になるわ。"}, {"t": 1207.5666666666666, "x": "魚は数えられた。捨てた量も船の名前も残った。"}, {"t": 1210.95, "x": "ではその船に乗っていた人たちの体はどうか。"}, {"t": 1213.8333333333333, "x": "魚のように一人ずつ測られたわけではなかった。"}, {"t": 1216.8, "x": "これは最後の章でつながる。"}, {"t": 1219.1166666666666, "x": "魚が売れなくなったことは、台所の話でもあった。"}, {"t": 1222.5666666666666, "x": "東京の杉並区では、1954年4月17日に\n区議会が水爆実験の禁止を決議した。"}, {"t": 1229.05, "x": "全会一致だった。"}, {"t": 1230.3333333333333, "x": "5月9日には署名を集めるための会ができた。"}, {"t": 1233.3833333333334, "x": "5月13日には、署名を呼びかける文が発表された。"}, {"t": 1237.0166666666667, "x": "翌日から区の全体で署名集めが始まった。"}, {"t": 1239.95, "x": "区の中だけで、7月20日までに\n27万3916の署名が集まっている。"}, {"t": 1245.55, "x": "区だけで27万。"}, {"t": 1247.05, "x": "署名は全国に広がった。"}, {"t": 1248.8333333333333, "x": "翌年の8月6日、広島で\n第1回の原水爆禁止世界大会が開かれた。"}, {"t": 1254.1666666666667, "x": "その前の年の8月8日には、全国で\n署名をまとめる会もできている。"}, {"t": 1258.6166666666666, "x": "その翌日全国の署名は3216万を超えた。"}, {"t": 1262.2, "x": "9月18日には、3259万を超えたとされている。"}, {"t": 1266.4166666666667, "x": "3000万……。"}, {"t": 1267.3666666666666, "x": "杉並区の資料は、最後に集まった数を、\n当時の15歳以上の人口のおよそ6割と書いている。"}, {"t": 1273.3166666666666, "x": "この動きをどう見るかは、人によって違う。"}, {"t": 1275.9333333333334, "x": "ここでは数と日付だけを置いておく。"}, {"t": 1278.7166666666667, "x": "お金の話し合いは、事件の翌月から始まっていた。"}, {"t": 1282.1, "x": "日本は4月に第五福竜丸の損害の資料を\nアメリカに渡した。"}, {"t": 1286.0, "x": "5月にはほかの船の分も含めた資料を渡している。"}, {"t": 1289.3333333333333, "x": "アメリカは払うって言ったの？"}, {"t": 1291.1166666666666, "x": "払うこと自体には反対しなかった。"}, {"t": 1293.3833333333334, "x": "ただし法律上の責任の話には触れたくない。"}, {"t": 1296.35, "x": "これがアメリカ側のはじめからの姿勢だった。"}, {"t": 1298.95, "x": "アメリカの外交記録を見ると、\n6月の時点で考えていた額が出てくる。"}, {"t": 1303.4166666666667, "x": "15万ドルだ。"}, {"t": 1304.6166666666666, "x": "15万ドル？"}, {"t": 1305.7, "x": "同じ記録には日本の外務省の見積もりも出てくる。"}, {"t": 1308.7666666666667, "x": "損害は700万ドルを少し超える、というものだった。"}, {"t": 1312.1, "x": "当時のアメリカ大使は、これは\n法律より政治の問題だと見ていた。"}, {"t": 1316.0666666666666, "x": "法律上の義務ではなく、見舞いとして払う。"}, {"t": 1318.7666666666667, "x": "その考えはこの時からもうあった。"}, {"t": 1320.9166666666667, "x": "9月の初めには、100万ドルを\n払う用意があると言ってきた。"}, {"t": 1324.55, "x": "日本はそれでは足りないと返した。"}, {"t": 1326.6, "x": "捨てる魚はそのあとも次々に出ていたからだ。"}, {"t": 1329.5166666666667, "x": "魚の値段が下がった損も、まだ数えきれていなかった。"}, {"t": 1333.05, "x": "日本の政府が見積もった損害は、26億円。"}, {"t": 1336.1666666666667, "x": "これは外務政務次官が、\n翌年1月の国会で答えた数字だ。"}, {"t": 1340.4, "x": "26億円と、100万ドル。"}, {"t": 1342.6, "x": "100万ドルは、当時のお金で3億6千万円になる。"}, {"t": 1346.0166666666667, "x": "話し合いは年の暮れまで続いた。"}, {"t": 1348.0666666666666, "x": "11月の国会では、国際法の学者が\n参考人として話している。"}, {"t": 1352.55, "x": "日本は600万ドルくらいを求め、\nアメリカは200万ドルと言っている。"}, {"t": 1356.7166666666667, "x": "本人はこの数字は正確ではないと\n断ったうえでそう述べた。"}, {"t": 1360.4166666666667, "x": "差はまだ大きかったのね。"}, {"t": 1362.1, "x": "12月の終わり、アメリカ政府の中で\n200万ドルまでが認められた。"}, {"t": 1366.2833333333333, "x": "日本の外務大臣も、200万ドルで\n閣議の了承を取りつけた。"}, {"t": 1370.25, "x": "アメリカの記録には、\n発表の時期についての勧めも書かれている。"}, {"t": 1374.1666666666667, "x": "年の初めは貸し借りを片づける時期だ。"}, {"t": 1376.65, "x": "だから新年に合わせて\n発表するのがよい、というものだ。"}, {"t": 1380.1166666666666, "x": "それで1月だったのね。"}, {"t": 1382.3333333333333, "x": "1955年1月4日。"}, {"t": 1384.6, "x": "日本とアメリカの政府が、書簡を取り交わした。"}, {"t": 1387.5166666666667, "x": "交換公文という形の取り決めだ。"}, {"t": 1389.8166666666666, "x": "国と国が書簡をやりとりして、約束を結ぶやり方だ。"}, {"t": 1393.5833333333333, "x": "最初に言ってた、短い書簡ね。"}, {"t": 1395.9333333333334, "x": "そうだ。"}, {"t": 1396.5666666666666, "x": "アメリカが払う金額は200万ドル。"}, {"t": 1398.85, "x": "当時のお金で7億2千万円だ。"}, {"t": 1401.1166666666666, "x": "1ドルが360円と決まっていた時代だ。"}, {"t": 1403.9833333333333, "x": "では最初に言った大事な言葉を読む。"}, {"t": 1406.1833333333334, "x": "外務政務次官が、国会で\n書簡の中身を説明したときの言葉だ。"}, {"t": 1410.4833333333333, "x": "「法律上の責任の問題とは関係なく、\n慰謝料として二百万ドル支払う」"}, {"t": 1415.35, "x": "法律上の責任とは関係なく……？"}, {"t": 1417.6666666666667, "x": "払う。だが責任を認めて払うのではない。"}, {"t": 1420.3833333333334, "x": "見舞いとして払う、という形だ。"}, {"t": 1422.5166666666667, "x": "書簡にはもう一つ大事な点がある。"}, {"t": 1424.75, "x": "日本はこのお金を、実験で生じた一切の損害に\n対する最終的な解決として受け取る。"}, {"t": 1430.5666666666666, "x": "最終的な解決。"}, {"t": 1432.1666666666667, "x": "これで終わりにする、ということだ。"}, {"t": 1434.2666666666667, "x": "あとで損が見つかっても、もう求められないの？"}, {"t": 1437.1666666666667, "x": "書簡の言葉どおりに読めば、そうなる。"}, {"t": 1439.5166666666667, "x": "この「最終的」という言葉はあとまで重く残る。"}, {"t": 1442.75, "x": "損害26億円に対して、7億2千万円。"}, {"t": 1446.05, "x": "3割に届かない。"}, {"t": 1447.3333333333333, "x": "国会ではこの決着がすぐに問われた。"}, {"t": 1449.7666666666667, "x": "ある議員はこう言った。"}, {"t": 1451.0333333333333, "x": "200万ドルを受け取るのは\n国であって、被害者ではない。"}, {"t": 1454.3166666666666, "x": "国は被害者にどれだけ払うのか。"}, {"t": 1456.4166666666667, "x": "外務省の条約局長は、別の見方を述べている。"}, {"t": 1459.65, "x": "法律の議論だけで争っていたら、\n直接の損害の4億3千万円さえ\n認められたかどうか分からない。"}, {"t": 1465.9833333333333, "x": "200万ドルは、前の例と比べれば\nはるかによい額だとも述べた。"}, {"t": 1469.9833333333333, "x": "もっと少なかったかもしれない、ってこと？"}, {"t": 1472.55, "x": "政府の側はそう説明した。"}, {"t": 1474.3833333333334, "x": "どちらが正しかったのかは、確かめようがない。"}, {"t": 1477.1833333333334, "x": "裁判で争わなかったからだ。"}, {"t": 1479.1, "x": "国会では言葉の意味も問われた。"}, {"t": 1481.1333333333334, "x": "委員長はこの200万ドルは損害を\n償うものと言えるのか、と質問している。"}, {"t": 1485.7833333333333, "x": "4月の衆議院本会議でも、ある議員がこう迫った。"}, {"t": 1489.0666666666666, "x": "損害26億円に対して、\n7億2千万円しか受け取らなかった。"}, {"t": 1493.5166666666667, "x": "それであとは知らないということが一体できるのか。"}, {"t": 1496.4333333333334, "x": "受け取ったあとも、問われ続けたのね。"}, {"t": 1499.35, "x": "では7億2千万円は、どう分けられたのか。"}, {"t": 1502.15, "x": "1955年5月12日、農林大臣が\n参議院で配分の中身を報告している。"}, {"t": 1507.75, "x": "いちばん大きいのは、マグロの値下がりで\n損をした漁業者の分だ。"}, {"t": 1511.4333333333334, "x": "4億5千万円あまり。"}, {"t": 1513.1333333333334, "x": "全体の半分以上ね。"}, {"t": 1514.8, "x": "魚を捨てた損害が、およそ7900万円。"}, {"t": 1518.05, "x": "危険区域のせいで漁ができなかった\n船の損害が、およそ5100万円。"}, {"t": 1522.4666666666667, "x": "市場の仲買の人たちや、\nちくわを焼く人たちの分もある。"}, {"t": 1526.1333333333334, "x": "焼津市や漁業の団体にも、合わせて\n1300万円あまりが回った。"}, {"t": 1530.3, "x": "この分け方は、\n1955年4月28日の閣議で決まっている。"}, {"t": 1535.0166666666667, "x": "では人の体の分はどうか。"}, {"t": 1536.8666666666666, "x": "治療費は第五福竜丸の乗組員の分が2486万9千円。"}, {"t": 1541.6, "x": "ほかの船の乗組員の分は、60万5千円。"}, {"t": 1544.8333333333333, "x": "ほかの船の人にも出てたのね。"}, {"t": 1546.95, "x": "出ている。ただ額を見てほしい。"}, {"t": 1548.8166666666666, "x": "慰謝料と病気で働けない間の手当。"}, {"t": 1551.2833333333333, "x": "第五福竜丸の乗組員の分が5279万2千円。"}, {"t": 1555.3666666666666, "x": "ほかの船の乗組員の分は、147万円だ。"}, {"t": 1558.8833333333334, "x": "……およそ36倍も違うわ。"}, {"t": 1560.8666666666666, "x": "23人は名簿に載っていた。"}, {"t": 1562.8166666666666, "x": "灰を浴びたことが、はっきり記録されていたからだ。"}, {"t": 1565.8333333333333, "x": "ほかの船の乗組員の多くは、その名簿の外にいた。"}, {"t": 1569.1833333333334, "x": "体を測られていない人は、数えようがない。"}, {"t": 1571.9166666666667, "x": "この事件でいちばん長く残る線は、ここで引かれた。"}, {"t": 1575.7833333333333, "x": "大石又七さんの入院は、1年2か月におよんだ。"}, {"t": 1579.15, "x": "船の上にいたのは2か月足らず。"}, {"t": 1581.1833333333334, "x": "退院したあとの暮らしは、何十年と続いた。"}, {"t": 1584.2, "x": "そっちのほうが、ずっと長いのね。"}, {"t": 1586.45, "x": "2012年の毎日新聞が、大石さんの話を伝えている。"}, {"t": 1590.4166666666667, "x": "被ばくした人への偏見があった。"}, {"t": 1592.5333333333333, "x": "見舞金を受け取ったことに、ねたみを向けられた。"}, {"t": 1595.4166666666667, "x": "借金の肩代わりを頼まれたこともあった。"}, {"t": 1598.15, "x": "被害にあった人なのに。"}, {"t": 1599.85, "x": "そうだ。被害を受けたほうが、\n口を閉ざすことになった。"}, {"t": 1603.2333333333333, "x": "大石さんもはじめは過去を忘れて\n暮らしたいと思っていた。"}, {"t": 1606.4833333333333, "x": "だが仲間の乗組員が次々に病気で亡くなっていく。"}, {"t": 1609.8, "x": "それを見て声を上げると決めた。"}, {"t": 1611.6333333333334, "x": "その後は本を書き、各地で体験を語った。"}, {"t": 1614.4333333333334, "x": "築地にマグロ塚を作る会の代表も務めている。"}, {"t": 1617.5166666666667, "x": "大石さんは2021年に87歳で亡くなった。"}, {"t": 1621.1333333333334, "x": "最後まで語り続けた人なのね。"}, {"t": 1623.4333333333334, "x": "語った人もいれば、語らずに暮らした人もいる。"}, {"t": 1626.4833333333333, "x": "どちらもその人が選んだことだ。"}, {"t": 1628.5166666666667, "x": "漁労長だった見崎吉男さんは、\n2016年に90歳で亡くなった。"}, {"t": 1632.95, "x": "この航海で船長を務めた方も、2024年に\n92歳で亡くなったと報じられている。"}, {"t": 1638.5833333333333, "x": "ほかの方々のことは、この回では話さない。"}, {"t": 1642.05, "x": "では船そのものはどうなったか。"}, {"t": 1643.9166666666667, "x": "第五福竜丸は、1954年8月に国が買い上げた。"}, {"t": 1648.05, "x": "配分の報告にも、船の購入費として\n2100万円が載っている。"}, {"t": 1652.2666666666667, "x": "ただしこれは200万ドルの中からではなく、\n国の予算から出された。"}, {"t": 1656.4, "x": "船の買い上げを含めて、国が別に出した\nお金は1億2884万円あまりあった。"}, {"t": 1662.2833333333333, "x": "買ってどうしたの？"}, {"t": 1663.5333333333333, "x": "放射能が弱まるのを待った。"}, {"t": 1665.3, "x": "そのあと東京水産大学の練習船になった。"}, {"t": 1668.3166666666666, "x": "いまの東京海洋大学だ。"}, {"t": 1670.1333333333334, "x": "名前もはやぶさ丸に変わった。"}, {"t": 1672.0166666666667, "x": "1956年のことだ。"}, {"t": 1674.2166666666667, "x": "また名前が変わったのね。"}, {"t": 1675.9, "x": "第七事代丸、第五福竜丸、\nはやぶさ丸。3つ目の名前だ。"}, {"t": 1680.3333333333333, "x": "学生を乗せて海に出る日々が続いた。"}, {"t": 1682.6833333333334, "x": "そして1967年、役目を終えて廃船になった。"}, {"t": 1686.45, "x": "船は解体業者に払い下げられた。"}, {"t": 1688.7, "x": "エンジンは外され、船体は\n東京湾の埋め立て地に置かれた。"}, {"t": 1692.25, "x": "ごみを埋めて作った土地、夢の島だ。"}, {"t": 1694.85, "x": "置き去りにされたの？"}, {"t": 1696.2166666666667, "x": "ほとんどそういう状態だった。"}, {"t": 1697.9833333333333, "x": "1968年3月10日、朝日新聞に1通の投書が載った。"}, {"t": 1702.65, "x": "題は「沈めてよいか第五福竜丸」。"}, {"t": 1705.0666666666666, "x": "これをきっかけに、船を残そうという\n動きが全国に広がった。"}, {"t": 1708.8833333333334, "x": "1973年11月には、船を守るための財団ができた。"}, {"t": 1713.4, "x": "1976年6月10日、東京都が夢の島に展示館を開いた。"}, {"t": 1718.35, "x": "船はいまもその建物の中にある。"}, {"t": 1720.5666666666666, "x": "海の上ではなく、屋根の下に置かれている。"}, {"t": 1723.7666666666667, "x": "外されたエンジンのほうにも、別の話がある。"}, {"t": 1726.6333333333334, "x": "エンジンは別の貨物船に積みかえられて使われた。"}, {"t": 1729.65, "x": "その貨物船が、1968年7月に事故にあう。"}, {"t": 1733.5833333333333, "x": "濃い霧の中、三重県の熊野灘で座礁して沈んだ。"}, {"t": 1737.0666666666666, "x": "エンジンごと？"}, {"t": 1738.0666666666666, "x": "エンジンごと海の底だ。"}, {"t": 1739.6, "x": "それから28年、エンジンは海の中にあった。"}, {"t": 1742.6, "x": "1996年12月、市民の呼びかけで引き上げられた。"}, {"t": 1746.75, "x": "2000年1月からは、\n展示館の前の広場に置かれている。"}, {"t": 1750.5, "x": "船とエンジンが、また同じ場所にそろったのね。"}, {"t": 1753.5, "x": "そうなる。"}, { 33, "x": "訴えるまでに時間がたちすぎた、というのが\n理由の一つだった。"}, {"t": 1878.3833333333334, "x": "2019年12月12日、高松高等裁判所も訴えを退けた。"}, {"t": 1883.2, "x": "判決は立法府や行政府の検討に\n期待するほかない、と述べている。"}, {"t": 1887.35, "x": "元船員たちは上告せず、この判決が確定した。"}, {"t": 1890.9166666666667, "x": "それで終わり？"}, {"t": 1891.8833333333334, "x": "別の道が取られた。"}, {"t": 1893.3, "x": "2016年元船員と遺族は船員保険の給付を申請した。"}, {"t": 1897.35, "x": "仕事中のけがや病気に出る保険だ。"}, {"t": 1899.6666666666667, "x": "申請は認められなかった。"}, {"t": 1901.4, "x": "国会でも2017年に、審査の進み\n具合が取り上げられている。"}, {"t": 1905.5, "x": "2020年その判断の取り消しを\n求めて、また裁判を起こした。"}, {"t": 1909.6, "x": "この裁判はのちに高知から東京の裁判所へ移された。"}, {"t": 1913.0166666666667, "x": "少なくとも2023年の時点で、この裁判は\n東京地方裁判所で続いていた。"}, {"t": 1918.2666666666667, "x": "2020年7月には、日本弁護士連合会が\n意見書を出している。"}, {"t": 1922.5166666666667, "x": "国に元船員たちを救う手立てを求めるものだ。"}, {"t": 1925.5, "x": "2022年には、高知で国を相手にした\n別の裁判に5人が加わったと報じられた。"}, {"t": 1930.8, "x": "こちらの結果も、この回では確かめられていない。"}, {"t": 1933.9, "x": "1954年の出来事が、まだ裁判所にあるのね。"}, {"t": 1937.65, "x": "まだある。"}, {"t": 1938.9333333333334, "x": "最初に線の話をした。"}, {"t": 1940.6333333333334, "x": "危険区域の線。魚を捨てる\n数字の線。お金を分ける名簿の線。"}, {"t": 1944.7666666666667, "x": "第五福竜丸は最初の線の外にいた。"}, {"t": 1947.3333333333333, "x": "そしてあとの2本の線の内側に入った。"}, {"t": 1950.0666666666666, "x": "外にいたから内側に入った……。"}, {"t": 1952.1666666666667, "x": "灰を浴びたことが、誰の目にも\nはっきりしていたからだ。"}, {"t": 1955.4, "x": "23人の体は何度も測られ、記録された。"}, {"t": 1958.5833333333333, "x": "その記録がのちの治療と健康診断のもとになった。"}, {"t": 1961.85, "x": "同じ海にいたほかの船の人たちは、\nそうはならなかった。"}, {"t": 1965.35, "x": "測られなかった人は、数えられない。"}, {"t": 1967.6666666666667, "x": "数えられなかった人は、名簿に載らない。"}, {"t": 1970.3166666666666, "x": "線を引いた人たちは、わざとそうしたのかしら。"}, {"t": 1973.3166666666666, "x": "記録を読むかぎり、多くは手さぐりだった。"}, {"t": 1975.8166666666666, "x": "計器は3台しかなく、医師は夜中に呼び出されていた。"}, {"t": 1979.1333333333334, "x": "線を引かなければ、魚を売ることも、\nお金を分けることもできなかった。"}, {"t": 1983.4666666666667, "x": "ただ一度引かれた線は、引いた\n人がいなくなっても残る。"}, {"t": 1986.95, "x": "夢の島の展示館では、船が今日も屋根の下にある。"}, {"t": 1990.3, "x": "前の広場には海の底から上げられたエンジンがある。"}, {"t": 1993.2166666666667, "x": "隣には仮の場所に置かれたままのマグロ塚がある。"}, {"t": 1996.1833333333334, "x": "船とエンジンは、同じ場所に戻ってきた。"}, {"t": 1998.8166666666666, "x": "あの年同じ海にいたほかの船の記録は、\nまだ全部はそろっていない。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
