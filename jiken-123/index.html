<script>
const D={"name": "123", "file": "123_編集用", "dur": 2073.0, "segs": [], "subs": [{"t": 0.0, "x": "1952年4月28日。"}, {"t": 2.6, "x": "東京地方裁判所。"}, {"t": 4.083333333333333, "x": "一つの判決が言い渡された。"}, {"t": 6.1, "x": "争われていたのは、\n皇居前の広場を使えるかどうかだ。"}, {"t": 9.616666666666667, "x": "広場を使う？"}, {"t": 10.716666666666667, "x": "5月1日のメーデーの会場として、労働組合が\n使わせてほしいと申し出ていた。"}, {"t": 15.716666666666667, "x": "国はそれを許可しなかった。"}, {"t": 17.433333333333334, "x": "組合は処分の取り消しを求めて訴えた。"}, {"t": 20.05, "x": "判決は許可しなかった処分を\n取り消すというものだった。"}, {"t": 23.466666666666665, "x": "じゃあ広場は使えることになったの？"}, {"t": 25.65, "x": "ならなかった。"}, {"t": 26.6, "x": "国の側はその日のうちに控訴している。"}, {"t": 28.983333333333334, "x": "その判決から3日後の5月1日。"}, {"t": 31.466666666666665, "x": "午後の皇居前の広場で、警官隊と\nデモの集団がぶつかった。"}, {"t": 35.35, "x": "拳銃が撃たれ、催涙弾が投げられた。"}, {"t": 37.833333333333336, "x": "亡くなった人が出た。"}, {"t": 39.233333333333334, "x": "警察官のけが人だけで700人を超えた。"}, {"t": 42.06666666666667, "x": "のちに血のメーデー事件と呼ばれる日だ。"}, {"t": 44.3, "x": "この日のことで起訴された人は、200人を超える。"}, {"t": 47.38333333333333, "x": "高等裁判所の判決が出るまでに、\n20年6か月かかった。"}, {"t": 51.483333333333334, "x": "20年？"}, {"t": 52.31666666666667, "x": "今回はその20年6か月を判決と\n国会の会議録だけでたどる。"}, {"t": 56.583333333333336, "x": "誰が正しかったかを、ここで裁くつもりはない。"}, {"t": 59.483333333333334, "x": "何が起きたと、誰がどこで言ったのか。"}, {"t": 61.916666666666664, "x": "それを順に並べる。"}, {"t": 63.2, "x": "最後に裁判所が何と書いたかまで読む。"}, {"t": 66.3, "x": "まずこの年の春がどういう時期だったかだ。"}, {"t": 68.78333333333333, "x": "1952年4月28日。"}, {"t": 71.41666666666667, "x": "判決が出たのと同じ日だな。"}, {"t": 73.35, "x": "この日に講和条約が効力を\n持ち、日本は占領から抜けた。"}, {"t": 77.23333333333333, "x": "判決の日と同じ日なのね。"}, {"t": 79.23333333333333, "x": "同じ日だ。"}, {"t": 80.06666666666666, "x": "だから5月1日は、独立してから\n最初のメーデーになった。"}, {"t": 83.83333333333333, "x": "警視総監の田中榮一 は、\nのちに国会でこう話している。"}, {"t": 87.73333333333333, "x": "「ことに平和独立後の記念すべき\nメーデーでありますので」"}, {"t": 90.95, "x": "警察が行進に口を出すのは、なるべく\n避ける方針だったという。"}, {"t": 94.88333333333334, "x": "多少のジグザグ行進や、条件に反した\n点があっても、なるべく目をつぶる。"}, {"t": 99.45, "x": "主催者の自主的な統制に\nまかせる、というのが総監の説明だ。"}, {"t": 103.65, "x": "記念すべき日、って言い方なのね。"}, {"t": 105.91666666666667, "x": "法務総裁の木村篤太郎 も、\n事件のあと国会でこう言った。"}, {"t": 109.88333333333334, "x": "「講和発効により独立を回復した\n直後に、しかも首都において」"}, {"t": 113.93333333333334, "x": "政府にとっても、重く受け止める日付だったわけだ。"}, {"t": 117.1, "x": "そしてもう一つ、この春の国会では\n大きな法案が審議されていた。"}, {"t": 121.36666666666666, "x": "法案？"}, {"t": 122.06666666666666, "x": "破壊活動防止法という法律の案だ。"}, {"t": 124.53333333333333, "x": "これはあとで、事件と一緒に\n国会で何度も名前が出てくる。"}, {"t": 128.13333333333333, "x": "先に当日の朝からの流れを見ておく。"}, {"t": 131.23333333333332, "x": "この年のメーデーは、総評という\n労働組合の集まりが中心だった。"}, {"t": 135.38333333333333, "x": "実行委員会の事務局長は島上善五郎 という人だ。"}, {"t": 139.03333333333333, "x": "島上は事件のあと国会に証人として呼ばれている。"}, {"t": 142.36666666666667, "x": "判決が出たあと、どうしたって話してるの？"}, {"t": 145.21666666666667, "x": "している。"}, {"t": 145.91666666666666, "x": "判決のあとで厚生省と労働省にかけ合った、と。"}, {"t": 149.11666666666667, "x": "返ってきた答えは「控訴をするから\n今年は使わせない」。"}, {"t": 152.48333333333332, "x": "島上はそれを「はなはだ不満」だと言った。"}, {"t": 155.26666666666668, "x": "それでも「合法的に\nメーデーをやるという建前」に立った。"}, {"t": 158.8, "x": "だから準備してきた\n神宮外苑でやろう、と決めたという。"}, {"t": 162.23333333333332, "x": "不満でも決まりには従ったのね。"}, {"t": 164.48333333333332, "x": "主催する側としては、そういう\n判断だったと述べている。"}, {"t": 167.83333333333334, "x": "大会のあとは、参加者を5つの班に\n分けて行進する計画だった。"}, {"t": 172.06666666666666, "x": "新宿、渋谷、後楽園の近く、それに\n日比谷公園が解散の場所だ。"}, {"t": 176.7, "x": "警視総監の説明では、\n警戒に付けた警察官は約4100人。"}, {"t": 181.08333333333334, "x": "行進の道すじと解散の場所に、\n人を分けて置いていた。"}, {"t": 184.58333333333334, "x": "都内73の警察署は、ほとんど\n全員の署員を署で待機させたという。"}, {"t": 189.08333333333334, "x": "警察は事前の話し合いで、\n時間の繰り上げも申し入れていた。"}, {"t": 192.78333333333333, "x": "デモの開始は0時30分、解散は遅くとも\n4時30分ごろまで、という案だ。"}, {"t": 197.78333333333333, "x": "解散のあとに皇居外苑へなだれ込むのを\n防ぐことも求め、確約を得たという。"}, {"t": 202.56666666666666, "x": "皇居前の広場には？"}, {"t": 204.11666666666667, "x": "警視総監は多くは置けなかったと国会で認めている。"}, {"t": 207.33333333333334, "x": "5つの方向に人手を割く以上、\nやむを得なかったという説明だ。"}, {"t": 211.83333333333334, "x": "主催者の側は、当日の混乱を\n心配していなかったのか。"}, {"t": 215.55, "x": "島上は国会で、その点も聞かれている。"}, {"t": 218.23333333333332, "x": "多少は心配した、と答えた。"}, {"t": 220.3, "x": "だから実行委員会で、参加する\n団体に約束をさせていたという。"}, {"t": 224.48333333333332, "x": "どんな約束？"}, {"t": 225.66666666666666, "x": "島上が読み上げた「確認事項」は3つだ。"}, {"t": 228.71666666666667, "x": "式典は決めたプログラムどおりに\n行い、変えたり足したりしない。"}, {"t": 232.4, "x": "デモが終わるまでは、指揮者や警備員の指示に従う。"}, {"t": 235.55, "x": "外れた行動をした団体には、\n実行委員会が責任を持って対処する。"}, {"t": 239.93333333333334, "x": "参加団体が何の異議もなく\n確認したと島上は言っている。"}, {"t": 243.7, "x": "それで守られたの？"}, {"t": 245.06666666666666, "x": "朝の会場で、1つ目の約束がもう崩れかけた。"}, {"t": 248.35, "x": "ある組合の旗を先頭にした一団が、\n警備を押し切って演壇を占拠したという。"}, {"t": 253.03333333333333, "x": "議長団はその場の判断で、\n一人だけ話をさせることにした。"}, {"t": 256.98333333333335, "x": "島上はあのような大きな問題になるとは\n考えていなかったと述べている。"}, {"t": 261.71666666666664, "x": "ここからは警視総監が国会で話した当日の流れだ。"}, {"t": 265.25, "x": "あくまで警察の側から見た説明だということを、\n頭に置いて聞いてほしい。"}, {"t": 269.7, "x": "うん。"}, {"t": 270.21666666666664, "x": "大会が終わり、行進が始まった。"}, {"t": 272.46666666666664, "x": "中部班の先頭は、交通の労働組合が\n楽隊をつけて秩序よく出たという。"}, {"t": 277.1333333333333, "x": "そこへ学生などの一団が別の列を\nつくって駆け足で追い越した。"}, {"t": 281.05, "x": "日比谷公園に着くと、演説があった。"}, {"t": 283.46666666666664, "x": "広場を「われわれの力によって\n闘いとれ」という呼びかけだったという。"}, {"t": 287.81666666666666, "x": "広場って皇居前の？"}, {"t": 289.3666666666667, "x": "そうだ。"}, {"t": 290.0, "x": "総監の数え方では、公園に集まったのは約7000人。"}, {"t": 293.6333333333333, "x": "そこから列が広場の方へ流れ出した。"}, {"t": 296.05, "x": "馬場先門のあたりに集まったのが、\n2時23分ごろだと総監は言う。"}, {"t": 300.53333333333336, "x": "時間まで出てるのね。"}, {"t": 302.0, "x": "警察の記録としての時刻だな。"}, {"t": 304.2, "x": "一方で総監はこうも言っている。"}, {"t": 306.1, "x": "一般の組合員は扇動に乗らず、\n日比谷公園で解散した、と。"}, {"t": 310.1333333333333, "x": "「メーデーそのものは無事平和裡に終了いたしました」"}, {"t": 313.1166666666667, "x": "広場に入ったのは参加者のうちの一部だった。"}, {"t": 315.9, "x": "ここは警察の側も、あとの政府の説明も一致している。"}, {"t": 320.1166666666667, "x": "広場の中では、二重橋の前に警官隊が並んだ。"}, {"t": 323.5, "x": "総監の説明では、そこまで駆けて\n先回りした2個中隊ほどだ。"}, {"t": 327.6666666666667, "x": "予備隊の隊長が拡声機で、\n解散するよう何度も警告した。"}, {"t": 331.6333333333333, "x": "応じなければ催涙弾も使う、と告げたという。"}, {"t": 334.56666666666666, "x": "それでも人は引かなかったの？"}, {"t": 336.56666666666666, "x": "総監によれば、引かなかった。"}, {"t": 338.6, "x": "そして催涙弾が投げられ始めた。"}, {"t": 340.81666666666666, "x": "総監は警察官がけられ、堀に\n落とされたとも話している。"}, {"t": 344.53333333333336, "x": "意識を失った警察官を、堀に\n落とした者がいたという説明だ。"}, {"t": 348.8, "x": "堀に……。"}, {"t": 349.51666666666665, "x": "別の場所でも、堀に落ちた警察官を\n助けようとした警察官が突き落とされたと言う。"}, {"t": 354.76666666666665, "x": "「瀕死の重傷」を負って入院している\n者がいる、と総監は述べた。"}, {"t": 358.68333333333334, "x": "ここも総監の言葉としてだけ置いておく。"}, {"t": 361.18333333333334, "x": "裁判ではこの場面にいた人たちの行為が\n一つずつ問われていくからだ。"}, {"t": 365.43333333333334, "x": "そのとき広場には、どれくらいの人がいたの？"}, {"t": 368.3333333333333, "x": "20年後の高等裁判所は、こう認定している。"}, {"t": 371.3666666666667, "x": "桜田濠に沿った砂利道から先の一帯を\n「埋め尽くさんばかりに」集まっていた。"}, {"t": 376.3333333333333, "x": "その数は「およそ万にも達する」。"}, {"t": 378.65, "x": "1万人……。"}, {"t": 380.1, "x": "総監の説明を、もう少し追う。"}, {"t": 382.26666666666665, "x": "その前に警察官の装備の話が一つある。"}, {"t": 385.2, "x": "総監によると、予備隊ではごく\n一部の者にだけ拳銃を持たせていた。"}, {"t": 389.4, "x": "大部分の隊員からは、わざと拳銃を外させたという。"}, {"t": 392.8666666666667, "x": "どうして外させたの？"}, {"t": 394.4, "x": "奪われるのを防ぐためと、撃てば相手を\n刺激するからだ、と説明している。"}, {"t": 398.81666666666666, "x": "撃つのはやむを得ない場合に\n限るという方針だったという。"}, {"t": 401.8833333333333, "x": "3時を過ぎて、あちこちから予備隊が着き始めた。"}, {"t": 405.01666666666665, "x": "風は警視庁の方から広場へ吹いていたという。"}, {"t": 407.75, "x": "催涙弾のガスが流れ、人の群れが風上へ動いた。"}, {"t": 411.15, "x": "3時15分ごろ、また大きな衝突になる。"}, {"t": 413.96666666666664, "x": "石が投げられ、警察官は催涙弾を投げ返した。"}, {"t": 417.1333333333333, "x": "竹やりのような物を突き出して来た\n一団に向かって、警察官が撃った。"}, {"t": 421.5, "x": "総監の言葉では「やむを得ず自衛上発砲いたした」。"}, {"t": 424.8666666666667, "x": "撃っちゃったのね。"}, {"t": 426.03333333333336, "x": "撃っている。"}, {"t": 426.76666666666665, "x": "その弾で東京都の職員の男性が亡くなった。"}, {"t": 429.73333333333335, "x": "これは総監自身が、国会で認めた事実だ。"}, {"t": 432.5833333333333, "x": "……。"}, {"t": 433.51666666666665, "x": "この男性は都の職員の組合の人だったと\n総監は言っている。"}, {"t": 437.23333333333335, "x": "学生が亡くなったという話も、\nこの時点ではラジオで流れていた。"}, {"t": 441.23333333333335, "x": "3時30分ごろから、警官隊は約20分かけて\n人を通りの外へ押し返した。"}, {"t": 446.43333333333334, "x": "4時10分ごろには、馬場先門の外まで押し出した。"}, {"t": 449.73333333333335, "x": "その途中で止めてあったアメリカの車が\n倒され、火を付けられたという。"}, {"t": 454.45, "x": "数字を整理しておく。"}, {"t": 455.8, "x": "どれも「誰がそう言ったか」付きだ。"}, {"t": 458.1333333333333, "x": "まず警察官のけが。"}, {"t": 459.6166666666667, "x": "総監の数字で、重傷が83人、軽傷が678人。"}, {"t": 464.1333333333333, "x": "合わせて761人だ。"}, {"t": 466.26666666666665, "x": "警察官だけで761人……。"}, {"t": 468.78333333333336, "x": "デモの側のけが人は、警察も数えきれていなかった。"}, {"t": 472.1166666666667, "x": "5月6日の法務総裁の報告では、推定で約200人。"}, {"t": 475.9, "x": "翌日の総監は\n「少くとも数百名」はいたのではないか、と言った。"}, {"t": 480.6333333333333, "x": "ずいぶん幅があるのね。"}, {"t": 482.1333333333333, "x": "死者の数は国会の中でも言い分が割れた。"}, {"t": 484.75, "x": "9人や10人という数を挙げた議員もいた。"}, {"t": 487.31666666666666, "x": "一方で所属まで挙げて述べられたのは2人だ。"}, {"t": 490.01666666666665, "x": "撃たれた東京都の職員の男性。"}, {"t": 492.1333333333333, "x": "それから「一日おいて法大の学生が一人なくなった」。"}, {"t": 495.76666666666665, "x": "この回は、2人として話すのね。"}, {"t": 498.18333333333334, "x": "そうする。"}, {"t": 498.8666666666667, "x": "記録で確かめられる数で話す。"}, {"t": 501.0, "x": "車の被害も法務総裁が数えている。"}, {"t": 503.45, "x": "焼かれた車が14台、壊された車が101台。"}, {"t": 506.8, "x": "米軍の公用車や外国人の車だ。"}, {"t": 509.25, "x": "警察官の拳銃も3丁奪われた、と報告にある。"}, {"t": 512.6166666666667, "x": "米軍の車については、政府は陳謝し、\n調べたうえで賠償すると述べた。"}, {"t": 517.1833333333333, "x": "同じ日、京都でも府庁や\n警察署をめぐる衝突があった。"}, {"t": 520.75, "x": "法務総裁の報告では、\n京都の警察官のけが人は345人。"}, {"t": 525.3666666666667, "x": "警察の側は自分たちの警備をどう見てたの？"}, {"t": 528.2166666666667, "x": "総監は手薄だったという意見は\nもっともだと認めている。"}, {"t": 531.5, "x": "「絶対に完全であったとは言えません。"}, {"t": 533.5166666666667, "x": "相当不備な点もあった」。"}, {"t": 535.2, "x": "「私としましても非常に責任を\n感じておる」とも言った。"}, {"t": 539.35, "x": "では政府はこの日をどう説明したか。"}, {"t": 541.5833333333334, "x": "5月6日の衆議院本会議で、法務総裁が報告している。"}, {"t": 545.4166666666666, "x": "「計画的、組織的な暴挙」と\n考えられる節がある、という言い方だ。"}, {"t": 550.0166666666667, "x": "一部の過激な人たちが群衆の興奮を\n利用して扇動した、と。"}, {"t": 554.2, "x": "最初から計画されてた、って見方なのね。"}, {"t": 557.0333333333333, "x": "政府の見方としてはそうだ。"}, {"t": 558.8333333333334, "x": "人数も推定で約6000人と出している。"}, {"t": 561.45, "x": "同時に法務総裁は、こうも言った。"}, {"t": 563.6833333333333, "x": "総評の下の穏やかな組合員は\n「終始平穏裡に行事を行い」解散した、と。"}, {"t": 568.95, "x": "参加者みんなが、ってことではないのね。"}, {"t": 571.4166666666666, "x": "そこは政府も分けて話している。"}, {"t": 573.3833333333333, "x": "次に警察官が撃ったことについてだ。"}, {"t": 575.8166666666667, "x": "翌日、法務政務次官が国会で答えている。"}, {"t": 578.85, "x": "発砲は「いわゆる正当防衛と認定いたし」。"}, {"t": 581.5833333333334, "x": "「警察官に対しての刑事責任はないものと\n考えておる」。"}, {"t": 585.2666666666667, "x": "それで話は終わったの？"}, {"t": 586.9333333333333, "x": "終わらなかった。"}, {"t": 587.9333333333333, "x": "同じ国会で違う見方がすぐに出てくる。"}, {"t": 591.1166666666667, "x": "5月7日、衆議院の地方行政委員会。"}, {"t": 593.9, "x": "現場を見たという、ある議員が質問に立った。"}, {"t": 596.6333333333333, "x": "この議員はまず広場に力ずくで\n入った行為を認めていない。"}, {"t": 600.15, "x": "「当然に責めらるべきものだと思う」と言っている。"}, {"t": 603.0833333333334, "x": "そこは責めてるのね。"}, {"t": 604.5333333333333, "x": "そのうえでこう続けた。"}, {"t": 605.95, "x": "力で入って来た人を力で外へ出す\n行為には「おのずから限界がある」。"}, {"t": 610.3833333333333, "x": "「公務執行において行き過ぎがあった」と、\n自分は感じている、と。"}, {"t": 614.4333333333333, "x": "入ったほうも、出したほうも、ってこと？"}, {"t": 616.9666666666667, "x": "そういう組み立ての質問だ。"}, {"t": 618.7, "x": "この議員は、広場を使わせない理由にも触れている。"}, {"t": 621.75, "x": "木を傷めないことや、公園の見た\n目を保つことが理由だった、と。"}, {"t": 625.6666666666666, "x": "衆議院の行政監察特別委員会は、\n5月15日から3日続けてこの件を調べた。"}, {"t": 631.25, "x": "主催者の島上も、警視総監もここで証言している。"}, {"t": 634.7666666666667, "x": "総評も声明を出し、事務局長の島上が\nそれを国会で読み上げた。"}, {"t": 639.0166666666667, "x": "一部の人の行動は、メーデーを\n「汚した反労働者的行為」だと書いている。"}, {"t": 643.7666666666667, "x": "同じ声明は政府の側にも矛先を向けた。"}, {"t": 646.55, "x": "裁判の決定を無視してまで広場を\n使わせなかった態度が、暴力に条件を与えた。"}, {"t": 651.6666666666666, "x": "さらに警察官の発砲と催涙弾も問題にしている。"}, {"t": 655.15, "x": "どっちにも厳しいのね。"}, {"t": 656.75, "x": "主催した側は、両方を責める形をとった。"}, {"t": 659.6333333333333, "x": "政府、警察、主催者、野党の議員。"}, {"t": 662.3833333333333, "x": "言い分はそれぞれ違う。"}, {"t": 663.75, "x": "この回ではどれか一つを正解として扱わない。"}, {"t": 667.2833333333333, "x": "ここでさっきの法案の話に戻る。"}, {"t": 669.5333333333333, "x": "破壊活動防止法の案は、まさに\nこの春に審議されていた。"}, {"t": 673.2833333333333, "x": "事件はその審議の真ん中に起きた。"}, {"t": 675.65, "x": "じゃあ事件は法案の話にも使われたの？"}, {"t": 678.3, "x": "使われた。"}, {"t": 679.15, "x": "賛成する側からも、反対する側からもだ。"}, {"t": 682.0666666666667, "x": "法務総裁は参議院の本会議でこう述べている。"}, {"t": 684.9, "x": "組織的な破壊行動には、\nこの法案の「必要がますますある」。"}, {"t": 689.1333333333333, "x": "反対する側は？"}, {"t": 690.4333333333333, "x": "5月27日の参議院法務委員会で、\n海員の組合の幹部が意見を述べた。"}, {"t": 695.3666666666667, "x": "まずあの日の行動は\n「言語道断の暴行」で、許されないと言う。"}, {"t": 699.3333333333334, "x": "そのうえでこう続けた。"}, {"t": 700.7833333333333, "x": "今の刑法で「立派に\n取締れるということの証明になった」。"}, {"t": 704.5833333333334, "x": "同じ事件から、反対の結論が出てるのね。"}, {"t": 707.6333333333333, "x": "そういうことだ。"}, {"t": 708.65, "x": "その中身の是非は、この回の話ではない。"}, {"t": 711.3666666666667, "x": "ここで見ておきたいのは、裁く側の手続きのほうだ。"}, {"t": 715.1666666666666, "x": "事件の直後から、逮捕が続いた。"}, {"t": 717.5, "x": "当日その場で、放火や\n公務執行妨害の疑いで8人が逮捕された。"}, {"t": 721.9833333333333, "x": "5月5日までに騒擾罪などで\n逮捕された人は、225人になった。"}, {"t": 726.65, "x": "総監の話では、5月7日の朝までに検挙が321人。"}, {"t": 730.9833333333333, "x": "6月17日、東京地方検察庁の検事正が\n参議院で数字を挙げた。"}, {"t": 735.7833333333333, "x": "「千人以上逮捕をして」検察庁に来た、と。"}, {"t": 738.95, "x": "千人？"}, {"t": 739.7166666666667, "x": "そこから証拠の薄い人を外し、\n勾留したのが600人から700人の間。"}, {"t": 744.6333333333333, "x": "その日までに騒擾罪で起訴したのが180人だと言った。"}, {"t": 748.2833333333333, "x": "別に公務執行妨害などで起訴した人が8人。"}, {"t": 751.45, "x": "まだ決めていない人が、\n100人ほどいるとも言っている。"}, {"t": 754.5833333333334, "x": "検事正は起訴はできるだけ絞っているとも述べた。"}, {"t": 757.4833333333333, "x": "起訴しようと思えばできる証拠のある\n人も、たくさん帰している、と。"}, {"t": 761.6333333333333, "x": "最後には何人になったの？"}, {"t": 763.4833333333333, "x": "16年後の国会で、ある議員が\n「被告は261名」と言っている。"}, {"t": 768.2833333333333, "x": "別の議員も「たしか261人起訴された」と述べた。"}, {"t": 772.2166666666667, "x": "被告の中には、16歳の少年もいたと\n国会で取り上げられている。"}, {"t": 776.5666666666667, "x": "16歳……。"}, {"t": 777.5333333333333, "x": "では騒擾罪とはどんな罪なのか。"}, {"t": 779.6666666666666, "x": "そこを先に押さえておく。"}, {"t": 781.8333333333334, "x": "騒擾罪は明治にできた刑法の106条にある罪だ。"}, {"t": 785.1833333333333, "x": "いまの刑法では、名前が騒乱罪に変わっている。"}, {"t": 788.1666666666666, "x": "条文の書き出しは「多衆で集合して\n暴行又は脅迫をした者」。"}, {"t": 792.3833333333333, "x": "たしゅう？"}, {"t": 793.1, "x": "大勢の人という意味だ。"}, {"t": 794.6, "x": "一人一人の暴力とは別に、集団そのものを罰する。"}, {"t": 798.1, "x": "役割で刑が分かれているのが特徴だな。"}, {"t": 800.6333333333333, "x": "首謀者。"}, {"t": 801.3833333333333, "x": "他人を指揮した者。"}, {"t": 802.75, "x": "他人に率先して勢いを助けた者。"}, {"t": 805.2166666666667, "x": "それと、ついて行っただけの「付和随行」した者。"}, {"t": 808.55, "x": "ついて行っただけでも罪になるの？"}, {"t": 810.65, "x": "なる。"}, {"t": 811.1333333333333, "x": "いまの条文で言えば、首謀者は1年以上10年以下。"}, {"t": 814.4, "x": "指揮した者や勢いを助けた者は6か月以上7年以下。"}, {"t": 818.0833333333334, "x": "ついて行った者は10万円以下の罰金だ。"}, {"t": 820.5833333333334, "x": "さっきの16歳の少年も、ついて行った\n側の罪で起訴されたと議員は述べている。"}, {"t": 825.4, "x": "ここで一つ大事な前提がある。"}, {"t": 827.4, "x": "騒擾罪にはまず\n「一つの大勢の集団」がいなければならない。"}, {"t": 831.25, "x": "その集団が一つの地方の平穏を\n害するほどの暴力をふるったかどうか。"}, {"t": 835.6833333333333, "x": "一つの集団、ね。"}, {"t": 837.25, "x": "あの日の広場では、午後から夕方まで\n場所を変えて衝突が続いた。"}, {"t": 841.25, "x": "それを全部まとめて一つの騒擾と見るのか。"}, {"t": 843.9833333333333, "x": "20年の裁判の最後に、この点が\n大きな分かれ目になる。"}, {"t": 848.1666666666666, "x": "裁判は東京地方裁判所で開かれた。"}, {"t": 850.75, "x": "のちに最高裁の刑事局長が国会で説明している。"}, {"t": 854.1333333333333, "x": "「東京地方裁判所の第十一部におきまして、\n昭和28年2月以来審理中」。"}, {"t": 859.4, "x": "事件の次の年の2月からなのね。"}, {"t": 861.85, "x": "そうだ。"}, {"t": 862.4833333333333, "x": "始まった時から、ふつうの裁判とは形が違った。"}, {"t": 865.9333333333333, "x": "同じ局長は担当の裁判官が\n「できるだけ早く正しい裁判を」と\n努めているとも述べた。"}, {"t": 871.6333333333333, "x": "被告人が200人を超える。"}, {"t": 873.4666666666667, "x": "証人は警察官も、デモに加わった人もいる。"}, {"t": 876.5166666666667, "x": "当日の警視総監も、事件から\n10年後の1962年に法廷で証言している。"}, {"t": 882.1166666666667, "x": "1956年、衆議院の法務委員会で、ある議員が\n新聞の記事を紹介した。"}, {"t": 887.35, "x": "このままの速さだと\n「昭和50年過ぎに判決が下る」というものだ。"}, {"t": 891.8666666666667, "x": "昭和50年って、事件から何年？"}, {"t": 894.3666666666667, "x": "23年だ。"}, {"t": 895.4666666666667, "x": "予想としては大げさに聞こえたかもしれない。"}, {"t": 898.0, "x": "同じ日、最高裁の事務総長はこう答えている。"}, {"t": 901.05, "x": "百人、二百人の事件でも、一人の窃盗の被告と\n同じ手続きでやるしかない。"}, {"t": 906.1666666666666, "x": "「そこに欠陥があるのじゃないか」と。"}, {"t": 908.45, "x": "裁判所の側も、困ってたのね。"}, {"t": 910.7833333333333, "x": "困っていた。"}, {"t": 911.6833333333333, "x": "だからやり方を変える試みも出てくる。"}, {"t": 914.6666666666666, "x": "1959年の参議院法務委員会。"}, {"t": 917.4833333333333, "x": "ある議員が新聞の報道を引いた。"}, {"t": 919.4833333333333, "x": "メーデー事件の審理を早めるために、\n東京地裁が異例の方法をとる。"}, {"t": 923.5333333333333, "x": "6人の判事が、まず3人ずつの2組に\n分かれて全体の審理をする。"}, {"t": 927.8333333333334, "x": "次に6人が一人ずつに分かれて、\n個々の被告人を調べる。"}, {"t": 931.6333333333333, "x": "最後に全員がそろって仕上げる、という形だ。"}, {"t": 934.6333333333333, "x": "分担作業みたいね。"}, {"t": 936.15, "x": "新聞は「分業裁判」と呼んだ、と\nその議員は言っている。"}, {"t": 939.7666666666667, "x": "それでも裁判は早くは終わらなかった。"}, {"t": 942.2, "x": "どうして？"}, {"t": 943.05, "x": "のちの最高裁の刑事局長の答弁が分かりやすい。"}, {"t": 946.2166666666667, "x": "被告人がとても多い。"}, {"t": 947.6833333333333, "x": "そのそれぞれに、証人へ問い返す権利がある。"}, {"t": 950.4666666666667, "x": "「反対尋問権」を守りながら進めなければならない。"}, {"t": 953.7666666666667, "x": "速く終える要請と、権利を守る要請の間で、\n裁判官も「苦慮」していると。"}, {"t": 958.9833333333333, "x": "急げば権利が削れるし、守れば長くなるのね。"}, {"t": 962.1333333333333, "x": "その板ばさみが、そのまま年数になって表れた。"}, {"t": 965.9, "x": "長い裁判の途中で、検察が\n起訴の中身を書き足したこともあった。"}, {"t": 970.15, "x": "ある2人の被告人は、\n1952年5月31日付の起訴状で起訴されていた。"}, {"t": 975.8833333333333, "x": "その起訴の内容が、\n1960年11月21日に変更されている。"}, {"t": 981.0666666666667, "x": "8年もたってから？"}, {"t": 982.5666666666667, "x": "8年余りだ。"}, {"t": 983.7, "x": "広場の別の場所での乱闘が、新しく付け加えられた。"}, {"t": 987.2166666666667, "x": "検察の考えは、それも全部で\n一つの騒擾だというものだった。"}, {"t": 991.2166666666667, "x": "弁護側は、これは実質的に新しい起訴だと反論した。"}, {"t": 994.9333333333333, "x": "付け加えた部分だけを見れば、\n時効の期間はもう過ぎている、と。"}, {"t": 998.8666666666667, "x": "時効ってそこにも関わるのね。"}, {"t": 1000.9, "x": "高裁は、時効は最初に起訴した\n時を基準に考えるべきだとした。"}, {"t": 1005.1166666666667, "x": "同じ騒擾の範囲の書き足しなら、\n新しい起訴には当たらない。"}, {"t": 1008.8166666666667, "x": "防御に実質的な不利益が出た\n形跡も見当たらない、と判断した。"}, {"t": 1013.0333333333333, "x": "1968年には、法務省の刑事局長も\n国会でこの点に触れている。"}, {"t": 1018.0833333333334, "x": "「若干の者について\n訴因の変更をした」ことは承知している、と。"}, {"t": 1022.1333333333333, "x": "一つの騒擾として組み立てるかどうかは、\n法廷の手続きにまで響いていた。"}, {"t": 1027.3166666666666, "x": "裁判の途中で、一つの出来事が起きている。"}, {"t": 1030.25, "x": "1960年3月、衆議院法務委員会で、\n法務省の刑事局長が報告した。"}, {"t": 1035.9166666666667, "x": "メーデー事件の公判で証言した\n警察官の、偽証の件だ。"}, {"t": 1039.8, "x": "偽証ってうその証言？"}, {"t": 1041.35, "x": "そうだ。"}, {"t": 1041.9666666666667, "x": "局長の説明では、その警察官は\n公判の途中で自分から認めた。"}, {"t": 1046.4666666666667, "x": "「みずから偽証の事実を認め、証言を\n訂正して真実を述べるに至って」いる。"}, {"t": 1051.2666666666667, "x": "検察は前の年の12月23日に起訴猶予にした。"}, {"t": 1055.0666666666666, "x": "罪には問わなかったのね。"}, {"t": 1056.7833333333333, "x": "問わなかった。"}, {"t": 1057.75, "x": "認めて訂正したことなどが理由とされた。"}, {"t": 1060.3, "x": "この処分には、国会で強い反発も出ている。"}, {"t": 1063.2333333333333, "x": "警察官だけをかばう扱いではないか、という質問だ。"}, {"t": 1066.6666666666667, "x": "のちの高裁の判決も、この件に一言触れている。"}, {"t": 1070.0166666666667, "x": "警察官の証人は、争いの一方の当事者の立場にある。"}, {"t": 1073.7833333333333, "x": "それは否定できない、と判決は認めた。"}, {"t": 1076.3833333333334, "x": "同時に被告人側の証人も被告人と\n同じ立場にある、とも書いている。"}, {"t": 1080.85, "x": "警察官の証人の「ある者が偽証したからといって」。"}, {"t": 1084.2166666666667, "x": "警察官の証人がすべて信用できないとは\n言えない、という判断だ。"}, {"t": 1088.4333333333334, "x": "一人のうそで、全部を\n捨てるわけにはいかない、ってことね。"}, {"t": 1091.9833333333333, "x": "そういう書き方だ。"}, {"t": 1093.25, "x": "証言の一つ一つを、判決は個別に量っていく。"}, {"t": 1097.3166666666666, "x": "1968年8月、衆議院法務委員会。"}, {"t": 1100.8666666666666, "x": "ある議員がこの裁判の数字を並べた。"}, {"t": 1103.2, "x": "「あれからすでに16年、裁判は驚くなかれ1792回」。"}, {"t": 1107.5333333333333, "x": "1792回？"}, {"t": 1109.25, "x": "公判の回数だ。"}, {"t": 1110.5333333333333, "x": "2年前の3月に証拠調べが終わり、結審している。"}, {"t": 1113.9, "x": "それでも6人の裁判官は、まだ\n判決文を書き上げていなかった。"}, {"t": 1117.9833333333333, "x": "議員は被告人の暮らしの話もした。"}, {"t": 1120.4333333333334, "x": "16年の間に、もとの職場へ\n戻れた人は「わずかに13名」。"}, {"t": 1124.7333333333333, "x": "被告人のまま亡くなった人が15人いる、と。"}, {"t": 1127.7, "x": "親が被告人だというだけで、子どもの就職が\n妨げられる例もあると訴えた。"}, {"t": 1132.55, "x": "判決を聞く前に……。"}, {"t": 1134.0, "x": "この議員は「判決のあり方について…\n論ずるものではありません」とも断っている。"}, {"t": 1138.95, "x": "問うたのは裁判の長さそのものだ。"}, {"t": 1141.15, "x": "答えた法務省の公安課長は、こう言った。"}, {"t": 1143.8333333333333, "x": "16年という期間は「決して好ましいものであるという\nふうには考えておりません」。"}, {"t": 1148.5166666666667, "x": "同時に初めのうちは実質の審理に\n入るまで数年かかった、とも述べた。"}, {"t": 1152.9833333333333, "x": "それだけ争い方が激しかった、という説明だ。"}, {"t": 1156.25, "x": "長くなった理由も、立場で言い方が違うのね。"}, {"t": 1159.85, "x": "被告人が亡くなると、その人の裁判はどうなるか。"}, {"t": 1163.15, "x": "判決は出ない。"}, {"t": 1164.25, "x": "裁判は「公訴棄却」という形で打ち切られる。"}, {"t": 1167.5, "x": "有罪でも無罪でもないまま？"}, {"t": 1169.4, "x": "そうだ。"}, {"t": 1170.0166666666667, "x": "1969年の国会で、ある議員がこの点を挙げている。"}, {"t": 1174.0, "x": "メーデー事件では「死亡によって\n公訴棄却の判決を受けた人もかなりいる」。"}, {"t": 1178.4666666666667, "x": "同じ年、法務省の刑事局長は、\n別の大量起訴の事件について答えた。"}, {"t": 1183.35, "x": "「メーデー事件その他の長期に延びた\n事件の反省を教訓といたしまして」。"}, {"t": 1187.7666666666667, "x": "反省って法務省が言ってるの？"}, {"t": 1189.8, "x": "言っている。"}, {"t": 1190.5, "x": "起訴の中身をできるだけ簡単ではっきりさせる、と。"}, {"t": 1193.6333333333334, "x": "まだ一審の判決も出ていない段階で、\nもう教訓として語られていた。"}, {"t": 1197.95, "x": "そしてこの打ち切られた人たちの話は、\nあとで意外な形でもう一度出てくる。"}, {"t": 1203.3, "x": "被告人の中には、事件の時に少年だった人もいた。"}, {"t": 1206.9666666666667, "x": "少年の事件は、まず家庭裁判所が扱う。"}, {"t": 1209.8666666666666, "x": "そこで調査官の補佐をする職員が、\n少年から話を聞くことがある。"}, {"t": 1214.2166666666667, "x": "取り調べとは違うの？"}, {"t": 1215.7666666666667, "x": "違う。"}, {"t": 1216.35, "x": "少年を守るための手続きで、\n信頼関係を前提にした面接だ。"}, {"t": 1220.6166666666666, "x": "ある少年の被告人について、その面接の記録が\n有罪の証拠に使われていた。"}, {"t": 1225.5833333333333, "x": "高裁はこれを認めなかった。"}, {"t": 1227.4, "x": "黙秘権を告げた形跡も無い面接の記録を、\n刑事裁判の証拠に使うのは許されない。"}, {"t": 1232.9166666666667, "x": "守るための話を、罰するために\n使っちゃいけないのね。"}, {"t": 1236.4333333333334, "x": "そういう理屈だ。"}, {"t": 1237.5333333333333, "x": "判決の要旨にも、この点が一項目として載っている。"}, {"t": 1240.9833333333333, "x": "ただこの少年の場合は、ほかの証拠で\n石を投げた事実が認められた。"}, {"t": 1245.1833333333334, "x": "記録の使い方は違法だったが、\n結論は変わらなかった。"}, {"t": 1249.35, "x": "1970年1月28日。"}, {"t": 1252.0333333333333, "x": "東京地裁が判決を言い渡した。"}, {"t": 1254.2166666666667, "x": "事件から17年と8か月あまりだ。"}, {"t": 1256.7333333333333, "x": "言い渡しは、2月と3月の日付にも分かれている。"}, {"t": 1260.05, "x": "結果は？"}, {"t": 1260.9, "x": "一審は騒擾罪が成り立つと認めた。"}, {"t": 1263.2833333333333, "x": "当日の各場所で起きた衝突を、\n全部で一つの騒擾として見た。"}, {"t": 1267.4833333333333, "x": "朝の会場から夕方までの流れを、\n細かく認定したうえでの判断だ。"}, {"t": 1271.8333333333333, "x": "判決の総論の部分だけで、\n4つの分冊に分かれていたという。"}, {"t": 1275.9, "x": "じゃあみんな有罪？"}, {"t": 1277.1166666666666, "x": "全員ではない。"}, {"t": 1278.1166666666666, "x": "一審で無罪とされた人もいた。"}, {"t": 1280.1333333333334, "x": "のちに最高裁の刑事局長が、\n国会で数字を示している。"}, {"t": 1283.95, "x": "1970年は、捕まっていた日数に\n応じた国の補償の決定が多かった。"}, {"t": 1289.05, "x": "その理由がメーデー事件などの一審判決で\n無罪とされた人が出たためだという。"}, {"t": 1293.7833333333333, "x": "一審の時点で、もう分かれてたのね。"}, {"t": 1296.2166666666667, "x": "分かれていた。"}, {"t": 1297.15, "x": "そして有罪とされた人の多くは控訴する。"}, {"t": 1299.7666666666667, "x": "舞台は東京高等裁判所に移った。"}, {"t": 1302.8333333333333, "x": "1972年11月21日。"}, {"t": 1305.75, "x": "東京高裁の判決が出た。"}, {"t": 1307.6666666666667, "x": "裁かれたのは、控訴した人などを合わせて100人だ。"}, {"t": 1310.9, "x": "判決はまずさっきの「一つの集団」の問題に\n正面から入った。"}, {"t": 1315.25, "x": "一審のやり方にも「相応の理由があった」と、\n最初に断ってからだ。"}, {"t": 1319.85, "x": "場所を変えて衝突が続いた、って話ね。"}, {"t": 1322.6333333333334, "x": "そうだ。"}, {"t": 1323.25, "x": "高裁は各場面で集団の顔ぶれが\n入れ替わっていたことを確かめた。"}, {"t": 1327.2333333333333, "x": "一審もそれは認めていた、と判決は書く。"}, {"t": 1330.0333333333333, "x": "そのうえでこう言い切った。"}, {"t": 1331.4833333333333, "x": "「社会事象として\n観察できるということから、ただちに」。"}, {"t": 1334.8666666666666, "x": "法的にも「一個の騒擾罪」になるという\n推論には「とうてい賛成することはできない」。"}, {"t": 1340.25, "x": "続けて起きたことでも、一つの罪とは限らないのね。"}, {"t": 1343.7666666666667, "x": "限らない。"}, {"t": 1344.55, "x": "判決はもう一点、はっきり書いた。"}, {"t": 1346.8, "x": "あらかじめ決めた騒擾の計画があったという事実。"}, {"t": 1349.8166666666666, "x": "特定の首謀者が仕組んで支配したという事実。"}, {"t": 1352.7166666666667, "x": "そのどちらも、一審は「毫も認定しなかった」。"}, {"t": 1355.9, "x": "ごうも？"}, {"t": 1356.6166666666666, "x": "少しも、という意味だ。"}, {"t": 1358.1666666666667, "x": "5月6日に政府が説明した\n「計画的、組織的」という見方。"}, {"t": 1362.7833333333333, "x": "それと同じ認定は、\n一審の判決にも無かったということになる。"}, {"t": 1367.35, "x": "高裁は警官隊が前に出る\n直前の広場の様子も書いている。"}, {"t": 1371.0666666666666, "x": "石を投げたり、棒や竹ざおを\n振り上げたりした人たちがいたのは確かだ。"}, {"t": 1375.25, "x": "脅すような言葉を叫んだ\n者もいた、と判決は認めている。"}, {"t": 1378.9333333333334, "x": "ただそれは集団の「前方の部分に\n位置した集団員の一部に限られていた」。"}, {"t": 1383.65, "x": "前のほうの一部？"}, {"t": 1384.9333333333334, "x": "そうだ。"}, {"t": 1385.5666666666666, "x": "後ろや外側にいた人たちについては、こうある。"}, {"t": 1388.4666666666667, "x": "「傍観者的態度の者や、\n児童、幼児を同伴した女性」。"}, {"t": 1392.1666666666667, "x": "「物を食べたりして休む者もあった」。"}, {"t": 1394.45, "x": "子ども連れの人もいたのね。"}, {"t": 1396.2833333333333, "x": "いた。"}, {"t": 1396.8, "x": "石を投げる人を、近くで\n止めようとした人もいたという。"}, {"t": 1400.1333333333334, "x": "広場に入れたことでもう目的は果たしたと、\n帰る時を待っていた人もいる。"}, {"t": 1404.5666666666666, "x": "そして全体を指揮し、まとめている者はいなかった。"}, {"t": 1407.7, "x": "高裁はその1万近い人を\n一つの統制された集団とは見なかった。"}, {"t": 1412.1166666666666, "x": "前のほうの一部と、全体は別ってことね。"}, {"t": 1415.0333333333333, "x": "そういう認定だ。"}, {"t": 1416.1666666666667, "x": "これが次の「前進命令」の判断につながっていく。"}, {"t": 1420.2, "x": "午後2時50分過ぎ。"}, {"t": 1421.65, "x": "第七方面予備隊の268人に、\n広場へ向かう命令が出た。"}, {"t": 1426.0166666666667, "x": "現場で指揮したのは、その予備隊の副隊長だ。"}, {"t": 1429.0833333333333, "x": "先に警察が集団を解散させる根拠を押さえておく。"}, {"t": 1432.4, "x": "1950年にできた東京都の公安条例だ。"}, {"t": 1435.5666666666666, "x": "高裁はこの条例で集団を解散させ、\n人を排除できる場合があると認めた。"}, {"t": 1440.2333333333333, "x": "ただし条件がある。"}, {"t": 1441.4833333333333, "x": "公共の秩序に、はっきりした\n差し迫った危険があること。"}, {"t": 1445.0666666666666, "x": "そして必要な限度を超えないことだ。"}, {"t": 1447.45, "x": "その条件を満たしてたかどうか、ってことね。"}, {"t": 1450.2, "x": "きっかけは桜田濠沿いの砂利道で\n起きた小さな動きだった。"}, {"t": 1453.8166666666666, "x": "集団の一部が、ひときわ高い声と\nともに数メートル前へふくらんだ。"}, {"t": 1457.95, "x": "警官隊との間は、15メートルから\n20メートルに縮まった。"}, {"t": 1461.95, "x": "それで副隊長はどうしたの？"}, {"t": 1463.9, "x": "一気に前進を命じた。"}, {"t": 1465.4666666666667, "x": "前に出た警察官は190人あまり。"}, {"t": 1468.0166666666667, "x": "高裁はこの判断をこう見ている。"}, {"t": 1470.0, "x": "その一部がさらに攻めてくる\n様子だったかを確かめていない。"}, {"t": 1473.4166666666667, "x": "周りの集団がどう動いているかも、確かめていない。"}, {"t": 1476.5333333333333, "x": "そして排除する相手を絞らず、\nほかの人まで「無差別に排除に及んだ」。"}, {"t": 1481.1666666666667, "x": "前に出てきた人だけじゃなく、全員を？"}, {"t": 1483.7833333333333, "x": "そうだ。"}, {"t": 1484.4, "x": "高裁はこの前進命令と、それに\n基づく実力行使を「違法」とした。"}, {"t": 1489.0166666666667, "x": "一審はこれを適法だと判断していた。"}, {"t": 1491.4833333333333, "x": "そこを覆したわけだ。"}, {"t": 1493.1, "x": "許されたのは、実際に警察官に暴力を\nふるっていた人を排除するところまで。"}, {"t": 1498.1, "x": "じゃあ命令が違法だから、全部が無罪になったの？"}, {"t": 1501.1666666666667, "x": "そこは違う。"}, {"t": 1502.1, "x": "判決ははっきり線を引いている。"}, {"t": 1504.0833333333333, "x": "命令が違法でも、それに対抗した行為が\n何でも罪にならないわけではない。"}, {"t": 1508.4333333333334, "x": "弁護側のその主張は「採るを得ない」と退けた。"}, {"t": 1512.2, "x": "ではなぜ騒擾罪が成り立たないとされたのか。"}, {"t": 1514.8833333333334, "x": "残る条件は暴力の程度だ。"}, {"t": 1516.8166666666666, "x": "一つの地方の平穏を\n害するほどだったか、が問われた。"}, {"t": 1520.3333333333333, "x": "けが人はたくさん出てるわよね。"}, {"t": 1522.3, "x": "出ている。"}, {"t": 1522.9666666666667, "x": "高裁もその後の広場が騒然としたことは\n記録上明らかだと書いた。"}, {"t": 1527.1166666666666, "x": "そのうえで問題の砂利道と\n十字路の場面を、条件ごとに量っている。"}, {"t": 1531.2666666666667, "x": "使われた道具は、棒や竹の棒や\n石を超えるものではなかった。"}, {"t": 1534.9333333333334, "x": "時間は、とても短かった。"}, {"t": 1536.8666666666666, "x": "場所はふだん人の往来が\n少ない、限られた一角だった。"}, {"t": 1540.4, "x": "そして警官隊に対抗するためのもので、\n一般の住民に向けたものではなかった。"}, {"t": 1545.45, "x": "だから一つの地方の平穏まではいかない、と。"}, {"t": 1548.3666666666666, "x": "そういう結論だ。"}, {"t": 1549.5833333333333, "x": "「一地方の静謐を害するに足りる\n程度のものとはいい難い」。"}, {"t": 1553.0, "x": "そのあと広場で続いた衝突も、最初の集団と\n同じ集団だとは証拠で言えない。"}, {"t": 1557.9166666666667, "x": "だから最初の場面にいた人に、\nその後のことの責任までは問えない。"}, {"t": 1562.1333333333334, "x": "一つずつ切り分けていったのね。"}, {"t": 1564.2, "x": "切り分けた。"}, {"t": 1565.0333333333333, "x": "ここが一審と最も大きく違う点だ。"}, {"t": 1568.15, "x": "判決の中から、ある被告人の例を一つだけ見ておく。"}, {"t": 1571.7166666666667, "x": "一審はこの被告人が二重橋前で\n巡査を棒で殴ったと認定していた。"}, {"t": 1576.0833333333333, "x": "証拠は私服でいた\n警察官の一人の調書と証言だけだった。"}, {"t": 1580.0666666666666, "x": "その警察官が、見たって言ったのね。"}, {"t": 1582.6166666666666, "x": "そうだ。"}, {"t": 1583.2333333333333, "x": "混乱の中で相手の顔を一瞬見ただけで、\n知っている男だと思った。"}, {"t": 1587.4666666666667, "x": "高裁は時刻を突き合わせた。"}, {"t": 1589.3, "x": "一審の認定では、集団が二重橋前に\n着き始めたのが2時30分過ぎ。"}, {"t": 1594.1, "x": "それを追って警官隊が着いたのは、その数分後だ。"}, {"t": 1597.2, "x": "だから殴打が起きたのは、どんなに\n早くても午後2時40分過ぎになる。"}, {"t": 1601.4, "x": "ところが同じころ、この被告人は\n日比谷公園の霞門の近くにいた。"}, {"t": 1605.7666666666667, "x": "仲間の列に加わったという、\n仲間2人の調書が残っていたんだ。"}, {"t": 1609.9166666666667, "x": "同じ時間に二つの場所に？"}, {"t": 1611.8666666666666, "x": "二重橋前と霞門は「かなりの距離を隔てている」。"}, {"t": 1615.15, "x": "両方に同じ時刻にいることは\n「容易に両立し難い」と高裁は書いた。"}, {"t": 1619.5833333333333, "x": "仲間の調書は事件から間もない\n時期のもので、具体的で詳しかった。"}, {"t": 1623.9666666666667, "x": "それに比べて、私服の警察官の証言は\n信用性に疑問がある、と判断した。"}, {"t": 1629.05, "x": "一審の認定には誤りの疑いがあるとして、\nその部分は覆された。"}, {"t": 1633.5333333333333, "x": "20年たって、時計の針で確かめ直したのね。"}, {"t": 1636.8, "x": "そういう作業が、100人分一人ずつ\n積み重ねられていった。"}, {"t": 1641.0333333333333, "x": "高裁は長い裁判そのものについても書いている。"}, {"t": 1643.9, "x": "被告人たちに「社会生活上不安定な生活を強いた」。"}, {"t": 1647.5833333333333, "x": "証人の記憶も薄れ、確かな証拠を期待しにくくなった。"}, {"t": 1651.2, "x": "それは「極めて遺憾とすべきこと」だと。"}, {"t": 1654.0166666666667, "x": "裁判所自身が、そう書いたのね。"}, {"t": 1656.3333333333333, "x": "書いている。"}, {"t": 1657.0833333333333, "x": "ただそれで裁判を打ち切るべきだとは考えなかった。"}, {"t": 1660.1333333333334, "x": "長くなったのには、やむを得ない\n事情もあったとしている。"}, {"t": 1663.3, "x": "弁護側はほかにもいくつかの主張をしていた。"}, {"t": 1666.0, "x": "政府が人々を挑発し、計画的に\n引き起こした事件だ、という主張。"}, {"t": 1670.5833333333333, "x": "警察官の違法な行為は起訴せず、デモの側だけを\n起訴したのは不当だ、という主張。"}, {"t": 1675.8, "x": "それはどうなったの？"}, {"t": 1677.1, "x": "高裁はどちらも退けた。"}, {"t": 1678.8666666666666, "x": "政府が計画的に引き起こしたという\n主張は、理由がないとした。"}, {"t": 1682.8, "x": "片方だけを起訴したことも、それだけで\n起訴が無効にはならないと書いた。"}, {"t": 1687.2333333333333, "x": "検察の組み立ても、弁護側の組み立ても、\n全部はそのまま通らなかったのね。"}, {"t": 1692.1666666666667, "x": "そういう判決だった。"}, {"t": 1693.5833333333333, "x": "だから読むのに手間がかかる。"}, {"t": 1695.9333333333334, "x": "判決の主文を、数字で並べる。"}, {"t": 1698.2, "x": "100人のうち、93人について\n一審の判決を取り消した。"}, {"t": 1702.15, "x": "そのうち84人は、無罪だ。"}, {"t": 1704.4333333333334, "x": "84人……。"}, {"t": 1705.5, "x": "9人は懲役4か月から6か月。"}, {"t": 1707.95, "x": "全員に1年の執行猶予が付いた。"}, {"t": 1710.2833333333333, "x": "内訳は、6か月が5人、5か月が2人、4か月が2人だ。"}, {"t": 1714.5833333333333, "x": "この9人も騒擾の指揮や助勢の点は無罪とされている。"}, {"t": 1717.9666666666667, "x": "有罪になったのは、騒擾とは別の罪の部分だ。"}, {"t": 1721.25, "x": "残りの7人は？"}, {"t": 1722.6, "x": "控訴が退けられ、一審の判断がそのまま維持された。"}, {"t": 1726.0833333333333, "x": "騒擾とは別の、暴力行為や\n公務執行妨害などの罪に問われていた人たちだ。"}, {"t": 1731.05, "x": "だからこの判決を「全員無罪」と\n言うのは正確ではない。"}, {"t": 1734.6833333333334, "x": "正確に言えば、高裁は騒擾罪の成立を認めなかった。"}, {"t": 1738.4166666666667, "x": "事件からどれくらいたってたの？"}, {"t": 1740.4, "x": "1952年5月1日から、1972年11月21日まで。"}, {"t": 1745.9833333333333, "x": "20年6か月と20日だ。"}, {"t": 1747.9, "x": "判決自身も「20年の長期にわたる本事件」と\n書いている。"}, {"t": 1752.45, "x": "検察は最高裁へ上告しなかった。"}, {"t": 1754.8666666666666, "x": "これで高裁の判決が確定した。"}, {"t": 1757.25, "x": "検察は納得したってこと？"}, {"t": 1759.3, "x": "そうとは限らない。"}, {"t": 1760.5, "x": "翌年の国会に、一つのやりとりが残っている。"}, {"t": 1763.65, "x": "ある検察の幹部が、記者の質問に\n答えて話したことが問題になった。"}, {"t": 1768.2333333333333, "x": "法務大臣の説明では、幹部はこう考えていたという。"}, {"t": 1771.5833333333333, "x": "無罪になったこと、「それに対して\n上告のできないことは無念である」。"}, {"t": 1775.7166666666667, "x": "無念……。"}, {"t": 1776.3666666666666, "x": "大臣はその言い方を\n「ことばがすべった」ものと説明した。"}, {"t": 1780.1333333333334, "x": "一方で、同じ年の国会で、ある議員は\n上告しなかったのは「当然」だと言った。"}, {"t": 1785.3, "x": "この確定も受け止め方は立場で正反対だった。"}, {"t": 1788.4, "x": "ここでもどちらかを正解として話すことはしない。"}, {"t": 1791.2833333333333, "x": "記録に残っているのは、\n上告されずに確定したという一点だ。"}, {"t": 1795.8666666666666, "x": "無罪が確定した人は、捕まっていた\n日数に応じて国から補償を受けられる。"}, {"t": 1800.55, "x": "刑事補償という仕組みだ。"}, {"t": 1802.1666666666667, "x": "1970年の決定の多くは、1日あたり1300円だった。"}, {"t": 1806.7666666666667, "x": "1日1300円？"}, {"t": 1808.3333333333333, "x": "1973年、最高裁の刑事局長が\n国会で数字を示している。"}, {"t": 1813.2, "x": "1970年には210人に補償が決まり、\nそのうち175人が1日1300円。"}, {"t": 1819.2833333333333, "x": "20年前に捕まっていた日の分を、\n確定した時の決まりで払う。"}, {"t": 1823.4333333333334, "x": "その点を物価も違うのにと国会で問う議員もいた。"}, {"t": 1826.5333333333333, "x": "参考人として呼ばれた作家も、メーデー事件の被告が\n1300円を受けたと述べている。"}, {"t": 1831.9, "x": "さっき言ってた、途中で亡くなった人たちは？"}, {"t": 1834.7666666666667, "x": "そこがさっき言った「意外な形」だ。"}, {"t": 1837.3166666666666, "x": "1975年、法務省の刑事局長が一つの例を挙げている。"}, {"t": 1841.65, "x": "被告人のまま亡くなり、公訴棄却で\n裁判が打ち切られた人がいた。"}, {"t": 1845.8333333333333, "x": "その人と一緒に起訴されていた\n人たちに、無罪の判決が確定した。"}, {"t": 1850.3, "x": "それを前提に請求があり、亡くなった\n人についても補償が認められた。"}, {"t": 1854.6833333333334, "x": "判決を聞けなかった人にも……。"}, {"t": 1856.7666666666667, "x": "局長はこうした例は\n「わずかに」しかないと言っている。"}, {"t": 1860.0833333333333, "x": "その数少ない例の一つが、メーデー事件だった。"}, {"t": 1863.2, "x": "翌年には最高裁の刑事局長も、\nメーデー事件を例に挙げている。"}, {"t": 1867.3166666666666, "x": "被告人の死亡や、起訴の取り消しで終わった\n人がいた事件だ、と。"}, {"t": 1871.4, "x": "それでも、一緒に起訴された人の無罪は\n確定している、と説明した。"}, {"t": 1876.4333333333334, "x": "この裁判はそのあとも国会で何度も名前が出てくる。"}, {"t": 1879.65, "x": "多くは裁判が長すぎるという話の例としてだ。"}, {"t": 1882.6166666666666, "x": "1970年3月、一審の判決のすぐあと。"}, {"t": 1886.25, "x": "ある議員はこう表現した。"}, {"t": 1887.8333333333333, "x": "裁判が長くなったことは「非常に苦いと\nいいますか貴重な教訓」だ、と。"}, {"t": 1892.4833333333333, "x": "同じ年、最高裁の総務局長はこう説明した。"}, {"t": 1895.85, "x": "専門の裁判官がその事件だけにかかりきりで、\n手続きを厳正にやる。"}, {"t": 1900.2666666666667, "x": "「それであれだけの\n期間がかかるわけでございます」。"}, {"t": 1903.1, "x": "急いで済む話でもないのね。"}, {"t": 1905.1, "x": "1975年には、ある議員が\nこの年の3つの事件を並べた。"}, {"t": 1909.4666666666667, "x": "5月1日の東京、6月の大阪の吹田、7月の大須。"}, {"t": 1913.65, "x": "いわゆる「三大騒擾事件」だ。"}, {"t": 1915.9666666666667, "x": "同じ年に、3つも？"}, {"t": 1917.7, "x": "3つともこの年に起きて、どれも長い裁判になった。"}, {"t": 1921.0666666666666, "x": "大須事件の裁判は、その時点でもまだ続いていた。"}, {"t": 1924.3333333333333, "x": "裁判の長さそのものが、国会で\n何度も問われることになった。"}, {"t": 1928.8, "x": "この回で開いた記録を、順に挙げておく。"}, {"t": 1931.4166666666667, "x": "中心は、1972年11月21日の東京高裁の判決文だ。"}, {"t": 1936.7833333333333, "x": "裁判所の判例検索で全文が読める。"}, {"t": 1939.3333333333333, "x": "判決では被告人も警察官も名前を\n伏せて記号で書かれている。"}, {"t": 1943.3166666666666, "x": "当日の流れは、1952年5月7日の\n衆議院地方行政委員会での警視総監の説明。"}, {"t": 1949.6333333333334, "x": "政府の見方は、\n5月6日の衆議院本会議の法務総裁の報告。"}, {"t": 1953.9333333333334, "x": "4月28日の判決と会場の話は、5月15日と\n17日の衆議院行政監察特別委員会。"}, {"t": 1960.9, "x": "逮捕と起訴の数は、\n6月17日の参議院法務委員会の検事正の答弁。"}, {"t": 1965.85, "x": "1792回の公判は、\n1968年8月9日の衆議院法務委員会。"}, {"t": 1971.85, "x": "刑事補償は、1973年3月30日と\n1975年3月18日の衆議院法務委員会だ。"}, {"t": 1979.3666666666666, "x": "騒乱罪のいまの条文は、国の法令検索で確かめた。"}, {"t": 1983.15, "x": "話さなかったこともある？"}, {"t": 1984.8666666666666, "x": "ある。"}, {"t": 1985.3166666666666, "x": "被告人の名前は、一人も出していない。"}, {"t": 1987.9, "x": "亡くなった2人の名前も出していない。"}, {"t": 1990.1166666666666, "x": "どちらの側がより悪かったのかも、決めていない。"}, {"t": 1992.9833333333333, "x": "裁判所が書いたこと以上のことは、\n言わないようにした。"}, {"t": 1996.8333333333333, "x": "ねえ最初の判決の話に戻っていい？"}, {"t": 1999.3833333333334, "x": "いいぞ。"}, {"t": 2000.0333333333333, "x": "4月28日に、広場を使わせないのは\n違うって判決が出てたのよね。"}, {"t": 2004.85, "x": "出ていた。"}, {"t": 2005.5666666666666, "x": "国はすぐに控訴し、主催者は会場を変えなかった。"}, {"t": 2008.7833333333333, "x": "あの判決は広場を「主権の存する\n国民一般の用に供して」ある場所だと書いた。"}, {"t": 2014.1666666666667, "x": "みんなの広場、ってことね。"}, {"t": 2016.0166666666667, "x": "そうだ。"}, {"t": 2016.6333333333334, "x": "その広場で、3日後に人が撃たれた。"}, {"t": 2019.1166666666666, "x": "そこから先は、20年6か月の間、\n法廷で一人ずつ確かめられた。"}, {"t": 2023.95, "x": "一つの集団だったのか、って。"}, {"t": 2026.0833333333333, "x": "そうだ。"}, {"t": 2026.6833333333334, "x": "検察は一つの騒擾だと\n組み立て、一審はそれを認めた。"}, {"t": 2030.55, "x": "高裁は場面ごと人ごとに分けて見直した。"}, {"t": 2033.3833333333334, "x": "同じ記録を読んで、結論が分かれたのね。"}, {"t": 2036.15, "x": "高裁が最後に見たのは、1万近い\n人の中の一人一人だった。"}, {"t": 2040.3666666666666, "x": "前の方で石を投げた人もいた。"}, {"t": 2042.3833333333334, "x": "後ろで子どもを連れて休む人もいた。"}, {"t": 2044.6666666666667, "x": "それを一つの罪でまとめていいのか、という問いだ。"}, {"t": 2047.7666666666667, "x": "答えはまとめられない、だったのね。"}, {"t": 2050.0, "x": "この事件については、そう判断された。"}, {"t": 2052.483333333333, "x": "ただその答えが出るまでに、判決を\n聞けずに亡くなった被告人がいた。"}, {"t": 2056.75, "x": "その20年の記録は、いまも判決と\n会議録で読むことができる。"}, {"t": 2060.9333333333334, "x": "3日前の判決と、20年後の判決。"}, {"t": 2063.7833333333333, "x": "両方ともあの広場の話なのね。"}, {"t": 2066.1, "x": "そうだ。"}, {"t": 2066.7166666666667, "x": "今回は、1952年の春の広場から\n始まった、長い記録を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
