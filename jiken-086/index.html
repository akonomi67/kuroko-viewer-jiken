<script>
const D={"name": "086", "file": "086_編集用", "dur": 2238.41665625, "segs": [], "subs": [{"t": 0.0, "x": "北海道警の書庫に、74年間ずっと\n更新され続けている紙が2枚ある。"}, {"t": 5.0, "x": "74年って、ちょっと気が遠くなる数字ね。"}, {"t": 8.0, "x": "逮捕状だ。期限が切れる前に、また出し直す。\nそれを半年ごとに繰り返している。"}, {"t": 13.266666666666667, "x": "待って。逮捕状って、普通は\n使ったらそれで終わりじゃないの？"}, {"t": 17.05, "x": "普通はな。この逮捕状は違う。"}, {"t": 19.233333333333334, "x": "どう違うの？"}, {"t": 20.233333333333334, "x": "出されたのは1952年。"}, {"t": 22.166666666666668, "x": "今年は2026年。一度も\n執行されないまま74年が経っている。"}, {"t": 26.9, "x": "一度も。"}, {"t": 27.75, "x": "一度もだ。"}, {"t": 28.583333333333332, "x": "日本経済新聞が2022年に数字を出している。"}, {"t": 31.916666666666668, "x": "その年の3月の時点で、片方の逮捕状は\n161回、もう片方は180回、更新されていた。"}, {"t": 38.93333333333333, "x": "180回……。"}, {"t": 40.15, "x": "効力を持っている日本の逮捕状としては、\nいちばん古いものだと言われている。"}, {"t": 44.53333333333333, "x": "今回は、この紙が生まれた夜の話を追いかける。"}, {"t": 47.61666666666667, "x": "白鳥事件。"}, {"t": 48.61666666666667, "x": "1952年1月、札幌で、警察官が撃たれた。"}, {"t": 52.75, "x": "でも、74年前の事件でしょ。時効は？"}, {"t": 55.766666666666666, "x": "止まっている。"}, {"t": 56.61666666666667, "x": "逮捕状の2人は国外に出たとされていて、\n日本の外にいる間は、時効の時計が進まない。"}, {"t": 62.43333333333333, "x": "じゃあ、永遠に終わらないじゃない。"}, {"t": 64.35, "x": "終わらせる方法はある。"}, {"t": 65.55, "x": "死亡が確認されればいい。"}, {"t": 67.21666666666667, "x": "2人とも、亡くなったという話は伝わっている。"}, {"t": 70.05, "x": "片方は1988年、片方は2012年だ。"}, {"t": 74.05, "x": "ただ、その確認が取れない。"}, {"t": 75.93333333333334, "x": "警察庁は2002年に、中国の公安当局に\n問い合わせている。はっきりした\n答えは返ってこなかった。"}, {"t": 82.28333333333333, "x": "北海道警はこう言っている。"}, {"t": 83.85, "x": "「常識的に考え生きている\n可能性がある限り」続ける、と。"}, {"t": 87.9, "x": "それで、半年ごとに書き換えるのね。"}, {"t": 90.38333333333334, "x": "そうだ。"}, {"t": 91.01666666666667, "x": "先に言っておく。この動画では、\n誰かを犯人だと断定しない。"}, {"t": 94.83333333333333, "x": "この事件は、そこが特別に厄介なんだ。"}, {"t": 98.25, "x": "1952年1月21日。"}, {"t": 100.88333333333334, "x": "札幌の、午後7時40分ごろだ。"}, {"t": 103.5, "x": "1月の札幌の7時半過ぎって、もう真っ暗ね。"}, {"t": 106.91666666666667, "x": "真っ暗だ。"}, {"t": 107.73333333333333, "x": "そこを、私服の男が一人、自転車で走っていた。"}, {"t": 111.13333333333334, "x": "札幌市中央警察署の警備課長、警部の白鳥一雄。"}, {"t": 114.65, "x": "仕事を終えて、家に帰るところだった。"}, {"t": 117.16666666666667, "x": "後ろから、もう一台の自転車が追いついてきた。"}, {"t": 120.11666666666666, "x": "追い越しざまに、拳銃が撃たれた。"}, {"t": 122.2, "x": "白鳥警部は、その場で亡くなった。"}, {"t": 124.65, "x": "……即死だったの。"}, {"t": 125.86666666666666, "x": "即死だ。"}, {"t": 126.63333333333334, "x": "この夜のことは、1か月後に\n国会で読み上げられている。"}, {"t": 130.05, "x": "衆議院の行政監察特別委員会。"}, {"t": 132.36666666666667, "x": "1952年2月25日。"}, {"t": 134.93333333333334, "x": "衆議院議長の命令で、議員4人が札幌に行って、\n3日間かけて調べてきた。その報告書だ。"}, {"t": 141.1, "x": "読み上げたのは、篠田弘作という議員だ。"}, {"t": 143.83333333333334, "x": "国会が調査団を出したの。"}, {"t": 145.75, "x": "出した。それくらいの扱いだったということだ。"}, {"t": 148.58333333333334, "x": "報告書には、こう書いてある。"}, {"t": 150.46666666666667, "x": "「自転車で追いついた\n氏名年齢不詳の男に突然背後から、"}, {"t": 153.98333333333332, "x": "約1メートルぐらいの距離と\n説明されておりますが、拳銃で狙撃され」"}, {"t": 158.46666666666667, "x": "1メートル。"}, {"t": 159.45, "x": "ほとんど真後ろだ。"}, {"t": 160.65, "x": "現場についても書いてある。"}, {"t": 162.1, "x": "「現場はバス路線、人家稠密、\n中央警察署から人家続きで約20丁」"}, {"t": 167.06666666666666, "x": "20丁は、だいたい2キロちょっとだ。"}, {"t": 169.16666666666666, "x": "署から歩いて帰れる距離に、\n家が並んでいる通りだった。"}, {"t": 172.65, "x": "人は、いなかったの。"}, {"t": 174.26666666666668, "x": "いた。「犯行の現場付近には2、\n3名の通行人がありましたが」"}, {"t": 178.33333333333334, "x": "ただ、その続きがこうだ。"}, {"t": 179.95, "x": "「暗夜のため犯人の人相、着衣等を\n確認した者はありませんでした」"}, {"t": 184.4, "x": "誰も、顔を見ていない。"}, {"t": 186.03333333333333, "x": "誰も見ていない。"}, {"t": 187.08333333333334, "x": "近くの住人は、銃声が一発聞こえたと話している。"}, {"t": 190.4, "x": "通りがかりの人は、二発聞こえたと話している。"}, {"t": 193.61666666666667, "x": "そこも、最初から合っていなかった。"}, {"t": 196.48333333333332, "x": "撃たれた人のことを、もう少し聞きたい。"}, {"t": 199.06666666666666, "x": "報告書に、経歴がそのまま載っている。"}, {"t": 201.61666666666667, "x": "「昭和10年北海道巡査を拝命し、終戦前は\n外事係員、終戦後は警備係員として勤務し」"}, {"t": 207.91666666666666, "x": "「昭和23年3月札幌市警の警備課長に\n就任、今日に至った人であります」"}, {"t": 213.06666666666666, "x": "昭和10年は1935年。"}, {"t": 215.21666666666667, "x": "巡査から始めて、17年目だ。"}, {"t": 217.76666666666668, "x": "外事係って、何をする人。"}, {"t": 220.03333333333333, "x": "外国に関わる情報を扱う部署だ。"}, {"t": 222.26666666666668, "x": "戦前は特高警察の中にあった。"}, {"t": 224.68333333333334, "x": "彼は戦時中、満州のハルビン学院という学校に\n行かされて、ロシア語を勉強している。"}, {"t": 230.0, "x": "警察官が、ロシア語。"}, {"t": 231.8, "x": "そういう仕事に就く人だったということだ。"}, {"t": 234.31666666666666, "x": "戦争が終わって、その仕事は\n無くなった。ただ、彼は残った。"}, {"t": 238.33333333333334, "x": "残って、今度は警備課長になった。"}, {"t": 240.78333333333333, "x": "警備課長は、何を担当するの。"}, {"t": 243.11666666666667, "x": "報告書はこう書いている。"}, {"t": 244.5, "x": "「営業許可事項も担当しておりましたので、\nこの方面の業者とも関係があり」"}, {"t": 249.2, "x": "「また渉外事項の担当で第三国人との交渉もあった」"}, {"t": 252.71666666666667, "x": "そして、こう続く。"}, {"t": 254.11666666666667, "x": "「何といっても昨秋来の日共系自由労組員検挙に\n関し、しばしば過激な脅迫を受けておりました」"}, {"t": 260.4, "x": "いろんな方向に、恨まれる可能性があったってこと。"}, {"t": 263.5833333333333, "x": "報告書自体が、そう読める書き方をしている。"}, {"t": 266.48333333333335, "x": "一つ、書かれていないことがある。"}, {"t": 268.51666666666665, "x": "彼が持っていた警察手帳だ。"}, {"t": 270.5833333333333, "x": "手帳。"}, {"t": 271.28333333333336, "x": "情報を集めるのが仕事の人が、\n毎日持ち歩いていた手帳だ。"}, {"t": 275.0833333333333, "x": "何か書いてあったはずだと、ずっと言われてきた。"}, {"t": 278.06666666666666, "x": "この手帳は、裁判に出ていない。"}, {"t": 279.98333333333335, "x": "警察が提出を断り続けた。"}, {"t": 282.3833333333333, "x": "……それは、気になるわね。"}, {"t": 283.96666666666664, "x": "気になった人が大勢いた。だから、\nこの事件にはいろんな説が付いた。"}, {"t": 288.18333333333334, "x": "ただ、手帳が出ていない以上、\n中身は誰にも分からない。"}, {"t": 291.3833333333333, "x": "分からないことを、分かったようには話さない。"}, {"t": 294.1666666666667, "x": "年齢も、実はきれいに揃っていない。"}, {"t": 296.53333333333336, "x": "国会の報告書は「当年37歳」と書いている。"}, {"t": 299.9, "x": "後の資料の多くは36歳と書く。"}, {"t": 302.51666666666665, "x": "一歳ずれてるの。"}, {"t": 303.78333333333336, "x": "ずれている。数え年か満年齢かの差かも\nしれないが、どちらとも書いていない。"}, {"t": 308.26666666666665, "x": "この事件は、そういう小さいずれが、あちこちにある。"}, {"t": 311.98333333333335, "x": "この事件には、前置きがある。"}, {"t": 313.8666666666667, "x": "撃たれる前の1か月、白鳥警部のところには、\n脅迫状が届き続けていた。"}, {"t": 318.93333333333334, "x": "一通や二通じゃなくて。"}, {"t": 320.55, "x": "報告書に、通数が書いてある。"}, {"t": 322.6166666666667, "x": "1951年の暮れから、1952年1月18日ごろまで。"}, {"t": 327.65, "x": "白鳥警部あてが、およそ105通。"}, {"t": 329.96666666666664, "x": "札幌市長あてが72通。"}, {"t": 331.8, "x": "札幌地検の検事あてが61通。"}, {"t": 334.43333333333334, "x": "三人まとめて狙われてたのね。"}, {"t": 336.56666666666666, "x": "三人の名前と住所を並べた\nビラも、市内にまかれている。"}, {"t": 340.0833333333333, "x": "きっかけは、前の年の12月だ。"}, {"t": 342.43333333333334, "x": "日雇いの労働者たちが市役所に押しかけて、\n石炭をよこせ、越冬の金をよこせと座り込んだ。"}, {"t": 348.3666666666667, "x": "出ていかないので、白鳥警部が現場に行って、退去を\n命じた。それでも動かなかった人が検挙された。"}, {"t": 354.71666666666664, "x": "それで、恨まれた。"}, {"t": 356.1666666666667, "x": "直後から、脅迫が始まっている。"}, {"t": 358.4166666666667, "x": "文面は、会議録にそのまま残っている。一つだけ読む。"}, {"t": 362.06666666666666, "x": "黒い枠のはがきで、「祝、\n白鳥警備課長御家族一同の死」"}, {"t": 366.23333333333335, "x": "……家族まで。"}, {"t": 367.1666666666667, "x": "家族に手を出すと書いたものも、\n複数あった。そこは読まない。"}, {"t": 370.96666666666664, "x": "年が明けて1月4日と5日には、こういう\n文書が警察に郵送されている。"}, {"t": 375.53333333333336, "x": "題は「新年に当り警察官諸君に宣言す」"}, {"t": 378.75, "x": "「我々はこれらの敵、新しい敵を国民の名に\nおいて一人一人葬り去ることを宣言する」"}, {"t": 384.23333333333335, "x": "この文書には、狙う相手の名前が\n並んでいた。その一番目が、市長。"}, {"t": 388.56666666666666, "x": "二番目が、白鳥警部だ。"}, {"t": 390.65, "x": "予告されてたってこと。"}, {"t": 392.3, "x": "報告書は「暗殺の予告も数十通の投書に\nよって受けておった」と書いている。"}, {"t": 397.15, "x": "そして、こう結んでいる。"}, {"t": 398.6, "x": "「思想的背景を持つ計画的犯行と\n疑うに足る理由が相当濃厚であります」"}, {"t": 403.7, "x": "……最初から、方向が決まってたのね。"}, {"t": 406.1166666666667, "x": "ここが、この事件のいちばん難しいところだ。"}, {"t": 408.95, "x": "予告があったのは事実だ。"}, {"t": 410.48333333333335, "x": "書いた人たちがいるのも事実だ。"}, {"t": 412.5833333333333, "x": "ただ、「予告した人」と「撃った人」が\n同じかどうかは、それだけでは決まらない。"}, {"t": 417.7, "x": "この先の11年、法廷で\n争われたのは、まさにそこだった。"}, {"t": 422.3, "x": "1952年って、どういう年だったの。"}, {"t": 425.35, "x": "日本が、占領から出る年だ。"}, {"t": 427.4166666666667, "x": "サンフランシスコ平和条約が\n発効するのが、1952年4月28日。"}, {"t": 432.73333333333335, "x": "白鳥事件は1月21日。"}, {"t": 434.8333333333333, "x": "条約発効の、3か月と1週間前だ。"}, {"t": 437.93333333333334, "x": "ぎりぎり占領下ね。"}, {"t": 439.3833333333333, "x": "そう。そして日本の中では、この先どういう\n国にするかが、まだ何も決まっていなかった。"}, {"t": 444.8666666666667, "x": "軍隊を持つのか持たないのか。"}, {"t": 446.6, "x": "警察をどれだけ強くするのか。"}, {"t": 448.51666666666665, "x": "全部、これから決める話だった。"}, {"t": 450.9, "x": "その真ん中に、この事件が置かれた。"}, {"t": 453.23333333333335, "x": "1952年3月27日、参議院の本会議。"}, {"t": 457.03333333333336, "x": "来年度の予算を通すかどうかの討論だ。"}, {"t": 459.6333333333333, "x": "自由党の愛知揆一という議員が、\n賛成の理由の中でこう言っている。"}, {"t": 463.6666666666667, "x": "「かの白鳥事件等を初め、全国的に起りつつある\n警察署或いは税務署等々に対するテロ的事件のごとく」"}, {"t": 470.55, "x": "「政治的、革命的意図を背景とする暴力行為が\n頻々と起っておるではありませんか」"}, {"t": 475.81666666666666, "x": "予算の話に、事件が出てくるんだ。"}, {"t": 478.3833333333333, "x": "出てくる。続きがこうだ。"}, {"t": 480.05, "x": "「いわゆる間接侵略の危険なきにあらざる\n現状に対しては、相当に強力なる治安組織が、"}, {"t": 485.6166666666667, "x": "量質両面にわたって\n整備確立せられなければならない」"}, {"t": 489.1666666666667, "x": "つまり、警察にもっと金を出せ、と。"}, {"t": 491.78333333333336, "x": "そういう文脈で使われた。"}, {"t": 493.48333333333335, "x": "この年の4月、政府は破壊活動防止法を\n国会に出す。7月に成立する。"}, {"t": 498.71666666666664, "x": "団体の活動を規制できるようにする法律だ。"}, {"t": 501.43333333333334, "x": "国会は大荒れになった。"}, {"t": 503.1166666666667, "x": "事件が、法律を作る材料になったってこと。"}, {"t": 506.2, "x": "材料の一つになった、というのが正確なところだ。\nこの年は他にも事件が続いている。"}, {"t": 511.6, "x": "ただ、白鳥事件はその先頭に置かれることが多かった。"}, {"t": 515.1166666666667, "x": "翌年の国会で、国家地方警察本部長官の斎藤昇が、\nこう言っている。"}, {"t": 520.0666666666667, "x": "「昨年の下半期の白鳥事件から\nメーデーあるいは吹田事件からこれまでの間に」"}, {"t": 524.9833333333333, "x": "起点の扱いね。"}, {"t": 526.3333333333334, "x": "起点の扱いだ。"}, {"t": 527.5666666666667, "x": "一人の警察官が撃たれた事件が、\n国の制度の話に接続していった。"}, {"t": 532.2333333333333, "x": "そこがこの事件の、もう一つの顔だ。"}, {"t": 535.3666666666667, "x": "事件の翌日から、札幌の街にビラがまかれた。"}, {"t": 538.75, "x": "翌日。"}, {"t": 539.65, "x": "1月22日付だ。撃たれたのが\n21日の夜だから、ほぼ翌日だな。"}, {"t": 544.6333333333333, "x": "報告書の書き方はこうだ。"}, {"t": 546.4333333333333, "x": "「日本共産党札幌委員会の名義で\n『見よ天誅遂に下る』と題した\n活版刷りのビラが多数配布されました」"}, {"t": 553.3166666666667, "x": "天誅。"}, {"t": 554.0833333333334, "x": "天罰、という意味の言葉だ。"}, {"t": 556.0, "x": "報告書は、中身をこう要約している。"}, {"t": 558.35, "x": "「白鳥警備課長の暗殺を是認し」"}, {"t": 560.7333333333333, "x": "そして枚数が書いてある。"}, {"t": 562.1666666666666, "x": "「活版所で約1万枚刷られたと見られておりまして、\n市内各所に数千枚撒布せられております」"}, {"t": 568.1666666666666, "x": "1万枚。"}, {"t": 569.1166666666667, "x": "報告書は、この枚数からある結論を引き出している。"}, {"t": 572.4166666666666, "x": "「これが1万枚も刷られているということから、\n自由労働者の行為ではないというふうに判断される」"}, {"t": 577.9666666666667, "x": "……手書きじゃなくて、活版で1万枚。"}, {"t": 580.4333333333333, "x": "印刷所に頼まないと作れない量だ。"}, {"t": 582.6333333333333, "x": "組織が動いていなければ\n出てこない、と読んだわけだ。"}, {"t": 585.85, "x": "捜査の向きは、これで固まった。"}, {"t": 587.9666666666667, "x": "もう一つ、報告書に書かれていることがある。"}, {"t": 590.75, "x": "事件の3日後、1月24日。ある人物が\n道庁の記者クラブで、記者40人を前に声明を出した。"}, {"t": 597.4333333333333, "x": "内容は、白鳥警部への抵抗は\n愛国的な行動だと言うものだった。"}, {"t": 601.65, "x": "報告書は、こう書いている。"}, {"t": 603.25, "x": "「NHKの録音にとられておりますので、\n同君の発表は証拠が残っております」"}, {"t": 608.4, "x": "録音が残ってるんだ。"}, {"t": 610.0166666666667, "x": "残っている。報告書に、記者との\nやりとりまで書いてある。"}, {"t": 613.45, "x": "記者が、検事の家に投げ込まれた石が赤ん坊の枕元に\n落ちていた、これも人権擁護と言うのかと聞いた。"}, {"t": 619.8, "x": "答えは、「それは死んでおらないのだから、\n死んでからでなければ答弁はできない」だった。"}, {"t": 624.8666666666667, "x": "……ひどいわね。"}, {"t": 625.8, "x": "この空気の中で、捜査が始まった。"}, {"t": 628.2333333333333, "x": "ただ、ここで気をつけてほしいことが一つある。"}, {"t": 631.0, "x": "ビラを配ることと、人を撃つことは、別の行為だ。"}, {"t": 634.1833333333333, "x": "ビラの出どころが分かっても、撃った\n人が分かったことにはならない。"}, {"t": 637.9, "x": "この区別が、この事件では最後まで付いて回る。"}, {"t": 641.5333333333333, "x": "捜査の規模も、報告書に書いてある。"}, {"t": 643.9166666666666, "x": "「市警、国警、検察庁が\n合体となりまして捜査本部を設置」"}, {"t": 648.0333333333333, "x": "当時は、市が持つ警察と国が持つ\n警察が別々にあった。それを合わせた。"}, {"t": 652.8666666666667, "x": "さらに「小樽、函館、旭川、帯広その他自警の応援も\n受けまして、約600名を動員」"}, {"t": 659.2333333333333, "x": "600人。"}, {"t": 660.2333333333333, "x": "北海道中から集めている。"}, {"t": 662.0666666666667, "x": "報告書を読んだ議員たちが札幌に\n入ったのは、事件の1か月後だ。"}, {"t": 666.3166666666667, "x": "そのときの様子も、一行だけ書き残されている。"}, {"t": 669.4, "x": "「私たちが参りましたときは、まだ\n捜査を続行しておったのであります」"}, {"t": 673.7333333333333, "x": "1か月経っても、まだ600人態勢のままだったのね。"}, {"t": 677.4, "x": "それだけの人数を動かして、現場から\n出てきたものは、多くなかった。"}, {"t": 681.6333333333333, "x": "現場に何があったかも、押さえておこう。"}, {"t": 684.0, "x": "残っていたのは、薬莢と、\n白鳥警部の体から出た弾丸が一発。"}, {"t": 688.65, "x": "それだけ。"}, {"t": 689.55, "x": "それだけだ。"}, {"t": 690.4166666666666, "x": "拳銃は見つかっていない。"}, {"t": 691.8, "x": "犯人が乗っていたとされる自転車も見つかっていない。"}, {"t": 694.8833333333333, "x": "この二つは、この後74年、一度も出てきていない。"}, {"t": 698.5333333333333, "x": "じゃあ、何を証拠に捜すの。"}, {"t": 700.5166666666667, "x": "弾丸だ。"}, {"t": 701.3166666666667, "x": "弾丸には、銃身の中の溝でついた\n傷が残る。線条痕という。"}, {"t": 705.5833333333334, "x": "同じ銃から撃った弾なら、同じ傷が付く。"}, {"t": 708.2333333333333, "x": "銃が見つかれば、照合できる。"}, {"t": 710.4, "x": "でも、銃が無いんでしょ。"}, {"t": 712.0666666666667, "x": "無い。だから照合する相手がいない。"}, {"t": 714.2, "x": "ここが、この事件のすべての出発点だ。"}, {"t": 716.95, "x": "後にこの裁判は「物証なき裁判」と\n呼ばれるようになる。"}, {"t": 720.5333333333333, "x": "物が無いなら、何で組み立てるか。人の話だ。"}, {"t": 723.9166666666666, "x": "……証言。"}, {"t": 724.6666666666666, "x": "証言と、供述だ。"}, {"t": 726.2166666666667, "x": "この事件の捜査は、そこに全部を賭けることになった。"}, {"t": 729.55, "x": "そして、そこから先が長い。"}, {"t": 732.15, "x": "ここで、当時の言葉を一つ説明しておく。"}, {"t": 734.9666666666667, "x": "中核自衛隊だ。"}, {"t": 736.4, "x": "自衛隊。今のとは違うのよね。"}, {"t": 738.6, "x": "全然違う。名前が似ているだけだ。"}, {"t": 740.9166666666666, "x": "当時、日本共産党が掲げていた方針の中に、"}, {"t": 744.0, "x": "軍事組織を作るというものがあった。\nその実行部隊の呼び名だ。"}, {"t": 748.0666666666667, "x": "先に断っておく。これは\n1952年の話だ。いまの政党や、いま\n所属している人たちの話ではない。"}, {"t": 755.1666666666666, "x": "この方針自体、のちに党が\n「極左冒険主義」として誤りだったと断じている。"}, {"t": 760.2333333333333, "x": "当時の警察が、この組織を\nどれくらいの規模だと見ていたか。"}, {"t": 763.75, "x": "国会に数字が残っている。"}, {"t": 765.65, "x": "1953年3月5日、衆議院の地方行政委員会。"}, {"t": 769.65, "x": "国家地方警察本部長官の斎藤昇の答弁だ。"}, {"t": 773.1666666666666, "x": "「いわゆる中核自衛隊は、現在われわれのところに\nわかっておりますのは約600隊でありまして」"}, {"t": 778.7, "x": "「隊員数が5500名でございます。われわれの\nわかっている資料によるものはさようであります」"}, {"t": 784.0666666666667, "x": "5500人。"}, {"t": 785.25, "x": "ただ、この数字は警察の推定だ。"}, {"t": 787.4666666666667, "x": "答弁自体が「われわれのわかっている\n資料によるもの」と付け加えている。"}, {"t": 791.8666666666667, "x": "実際にどれだけいたかは、分からない。"}, {"t": 794.3333333333334, "x": "札幌にも、あったの。"}, {"t": 796.0166666666667, "x": "あったとされている。"}, {"t": 797.0333333333333, "x": "裁判で認定されたのも、そこだ。"}, {"t": 799.3833333333333, "x": "確定判決は、この事件を、札幌の中核自衛隊が\n組織として起こしたものだと見ている。"}, {"t": 805.1, "x": "誰が何をしたと見られたか、整理しておく。"}, {"t": 807.8, "x": "撃ったのは、佐藤博という人物とされた。"}, {"t": 810.5666666666667, "x": "付き添ったのが鶴田倫也、隊長格が\n宍戸均、そして指示を出したのが\n札幌委員会の責任者、村上國治。"}, {"t": 817.9833333333333, "x": "4人ね。"}, {"t": 818.8666666666667, "x": "そう見られた。"}, {"t": 819.75, "x": "この4人のうち、\n裁判にかけられたのは、何人だと思う。"}, {"t": 823.5, "x": "……全員じゃないの。"}, {"t": 824.6833333333333, "x": "一人だ。"}, {"t": 825.5666666666667, "x": "一人。"}, {"t": 826.3, "x": "村上國治だけだ。あとの3人は、\n法廷に一度も現れていない。"}, {"t": 831.1, "x": "どうしてそんなことになるの。"}, {"t": 832.9166666666666, "x": "順番に話す。まず、捜査がどう動いたかだ。"}, {"t": 835.9333333333333, "x": "最初の数か月、捜査は完全に行き詰まっていた。"}, {"t": 839.1166666666667, "x": "別の事件の容疑で人を捕まえては、\n白鳥事件を聞く。それの繰り返しだった。"}, {"t": 844.1666666666666, "x": "人違いで逮捕したこともある。"}, {"t": 846.0, "x": "全く別の大学の学生を、北海道の学生だと思って\n捕まえて、裁判になるまで気づかなかった。"}, {"t": 852.5333333333333, "x": "……それは、ひどい。"}, {"t": 853.7833333333333, "x": "そういう捜査だった、と後に厳しく批判されている。"}, {"t": 856.95, "x": "流れが変わったのは、事件から\n4か月ほど経ったころだ。"}, {"t": 860.45, "x": "静岡県の伊東市で、一人の若い男が\n行き倒れになっているのが見つかった。"}, {"t": 865.1166666666667, "x": "警察が保護したら、白鳥事件に\n関係のある人物だと分かった。"}, {"t": 869.4, "x": "偶然じゃない。"}, {"t": 870.4333333333333, "x": "完全に偶然だ。"}, {"t": 871.7, "x": "この人物が、地下に潜っていた組織のことを\n話し始めた。そこから芋づるに逮捕が続く。"}, {"t": 877.5, "x": "捕まった人が、次の人の名前を出す。\nその人が捕まって、また次の名前を出す。"}, {"t": 883.1666666666666, "x": "……最初の一人が間違ってたら、\n全部ずれるじゃない。"}, {"t": 886.2666666666667, "x": "後で弁護側が突いたのも、まさにそこだ。"}, {"t": 888.9166666666666, "x": "そして1952年10月1日、村上國治が逮捕される。"}, {"t": 893.3166666666667, "x": "当時30歳。北海道の比布村で生まれて、\n戦争から帰ってきて、運動に入った人だ。"}, {"t": 899.1833333333333, "x": "この年の7月に、\n札幌委員会の委員長になったばかりだった。"}, {"t": 903.35, "x": "なったばかりで。"}, {"t": 904.5, "x": "なったばかりだ。"}, {"t": 905.5166666666667, "x": "彼はこの日から、17年、外に出られなくなる。"}, {"t": 908.75, "x": "そして、最後まで、自分はやっていないと言い続けた。"}, {"t": 912.6833333333333, "x": "ここで、この事件のいちばん妙なところを説明する。"}, {"t": 915.8333333333334, "x": "撃ったとされた人たちが、日本にいなくなった。"}, {"t": 918.8333333333334, "x": "いなくなった。"}, {"t": 919.8666666666667, "x": "中国に渡ったとされている。"}, {"t": 921.5333333333333, "x": "後の章で詳しく話す。"}, {"t": 923.2666666666667, "x": "結果として、起訴できたのは、その時点で\n日本の刑務所にいた人だけになった。"}, {"t": 928.1666666666666, "x": "3人だ。村上國治と、手助けをしたとされた\n村手宏光、高安知彦。"}, {"t": 933.55, "x": "撃った人は、いない。"}, {"t": 935.0666666666667, "x": "いない。"}, {"t": 935.6, "x": "裁判が始まったのは1957年だ。"}, {"t": 938.4166666666666, "x": "事件から5年経っている。"}, {"t": 940.1166666666667, "x": "実行犯とされる人物が行方不明のまま、\n指示をしたとされる人の裁判が先に始まった。"}, {"t": 945.9, "x": "それ、成立するの。"}, {"t": 947.5, "x": "法律上はできる。共謀共同正犯という\n考え方があるからだ。"}, {"t": 951.55, "x": "後の章で、ここは丁寧にやる。"}, {"t": 953.5833333333334, "x": "法廷で何が争われたか。一点だ。"}, {"t": 956.05, "x": "「共同謀議があったかなかったか」"}, {"t": 958.1333333333333, "x": "話し合いがあったかどうか。"}, {"t": 959.8166666666667, "x": "そうだ。1月の初めに、村上たちが\n集まって、白鳥警部を撃つことを決めた。"}, {"t": 964.8666666666667, "x": "検察はそう主張した。"}, {"t": 966.6, "x": "村上は、そんな会議は無いと言った。"}, {"t": 968.95, "x": "この一点で、果てしない議論が続いた。"}, {"t": 971.4666666666667, "x": "傍聴席に、毎回座っていた人がいる。"}, {"t": 974.2833333333333, "x": "誰。"}, {"t": 974.9166666666666, "x": "村上の母親だ。名前をセイという。"}, {"t": 977.3, "x": "一審と二審を通じて、公判は120回開かれた。"}, {"t": 980.8, "x": "この人は、120回、一度も休まずに\n通ったと記録されている。"}, {"t": 985.2166666666667, "x": "……120回。"}, {"t": 986.3333333333334, "x": "比布から札幌までだ。"}, {"t": 987.7333333333333, "x": "今でも汽車で2時間近くかかる。"}, {"t": 989.95, "x": "1957年5月7日、札幌地裁の判決が出る。"}, {"t": 994.05, "x": "村上國治、無期懲役。"}, {"t": 996.0666666666667, "x": "無期。"}, {"t": 996.7166666666667, "x": "村手宏光は懲役3年、執行猶予5年。"}, {"t": 999.55, "x": "高安知彦は懲役3年、執行猶予3年。"}, {"t": 1002.85, "x": "村上と村手は、その日のうちに控訴している。"}, {"t": 1006.4166666666666, "x": "ここからが、この事件の山だ。"}, {"t": 1008.4833333333333, "x": "さっき言ったとおり、物証は、\n白鳥警部の体から出た弾丸一発しか無かった。"}, {"t": 1013.5166666666667, "x": "比べる相手がいなかった。"}, {"t": 1015.2333333333333, "x": "うん。"}, {"t": 1015.7333333333333, "x": "ところが、捜査の途中で、比べる相手が出てきた。"}, {"t": 1018.9666666666667, "x": "起訴された3人のうちの一人、\n高安知彦が、こう供述した。"}, {"t": 1023.2666666666667, "x": "事件の前に、札幌の郊外で\n拳銃の試し撃ちをした、と。"}, {"t": 1027.1, "x": "場所は、幌見峠という。"}, {"t": 1028.9333333333334, "x": "山の中ね。"}, {"t": 1030.05, "x": "札幌の市街を見下ろす峠だ。冬は雪が積もる。"}, {"t": 1033.2166666666667, "x": "警察がそこを掘った。"}, {"t": 1034.5333333333333, "x": "弾丸が2発、出てきた。"}, {"t": 1036.55, "x": "……出てきたんだ。"}, {"t": 1037.6166666666666, "x": "出てきた。"}, {"t": 1038.3833333333334, "x": "これで、比べる相手ができた。"}, {"t": 1040.3, "x": "幌見峠から出た2発と、白鳥警部の体から出た\n1発。この3発が同じ銃から出たものなら、繋がる。"}, {"t": 1047.3333333333333, "x": "繋がるの。"}, {"t": 1048.3, "x": "鑑定が、割れた。"}, {"t": 1049.6333333333334, "x": "一つの鑑定は、同じ銃から\n出たとは断定できないとした。"}, {"t": 1053.3166666666666, "x": "別の鑑定は、同じ銃だという証拠は無いとした。"}, {"t": 1056.45, "x": "そして、ある大学教授の鑑定が、違う\n銃から出る確率は極めて小さいとした。"}, {"t": 1061.7, "x": "バラバラじゃない。"}, {"t": 1062.7833333333333, "x": "バラバラだ。"}, {"t": 1063.6166666666666, "x": "それだけじゃない。弁護側は、\nこの2発そのものがおかしいと言い出した。"}, {"t": 1067.75, "x": "理由を5つ挙げている。"}, {"t": 1069.15, "x": "見つかった経緯。傷や変形があるかどうか。"}, {"t": 1071.6666666666667, "x": "地面にどれだけめり込んでいたか。"}, {"t": 1073.7, "x": "そして、腐食。最後に線条痕だ。"}, {"t": 1076.4333333333334, "x": "腐食。"}, {"t": 1077.2166666666667, "x": "鉛の弾を何年も土の中に置いたら、表面が腐る。"}, {"t": 1080.6333333333334, "x": "腐食の孔ができる。"}, {"t": 1082.0833333333333, "x": "幌見峠から出た2発には、それが無かった。"}, {"t": 1085.0666666666666, "x": "……土に埋まってた割に、きれいすぎたってこと。"}, {"t": 1087.8833333333334, "x": "弁護側はそう主張した。そして、\nこの主張は裁判官を動かしている。"}, {"t": 1092.2833333333333, "x": "後の研究者は、こう書いている。"}, {"t": 1094.2, "x": "「それは裁判官をも説得しているのである」"}, {"t": 1096.8, "x": "この弾丸は、誰かが後から置いたものではないか。"}, {"t": 1099.8166666666666, "x": "そういう疑いが、法廷の中に入り込んだ。"}, {"t": 1103.1666666666667, "x": "この弾丸の話には、続きがある。"}, {"t": 1105.5333333333333, "x": "1969年3月11日、衆議院の法務委員会。"}, {"t": 1109.5333333333333, "x": "猪俣浩三という議員が、こう話している。"}, {"t": 1112.3166666666666, "x": "「科学警察研究所というところで、"}, {"t": 1114.45, "x": "十数年前に事件当時唯一の物的証拠とされておりまする\nピストルの弾丸を鑑定している」"}, {"t": 1120.25, "x": "科学警察研究所。警察の中の、鑑定をする所ね。"}, {"t": 1124.3666666666666, "x": "そうだ。続きがこうだ。"}, {"t": 1125.9333333333334, "x": "「今度初めて警察庁の一機関でありまする\n科学警察研究所ですでに15年前に、これは違うんだ」"}, {"t": 1132.2666666666667, "x": "「幌見峠から出た弾丸と白鳥警部のからだから\n出た弾丸とは違うんだという鑑定ができておった」"}, {"t": 1138.1666666666667, "x": "違うっていう鑑定が、あったの。"}, {"t": 1140.3333333333333, "x": "あった、とこの議員は言っている。"}, {"t": 1142.2166666666667, "x": "そしてこう続ける。「それを\n検事は出さぬのであります」"}, {"t": 1145.4666666666667, "x": "……出さなかった。"}, {"t": 1146.6, "x": "「それが今度ようやく明らかになりまして、\n再審裁判所の札幌高等裁判所が\n提出命令を出しまして」"}, {"t": 1152.9333333333334, "x": "「科学警察研究所からその鑑定書があらわれました」"}, {"t": 1156.4, "x": "裁判所が命令して、やっと出た。"}, {"t": 1158.7666666666667, "x": "そういう発言が、国会の記録に残っている。"}, {"t": 1161.6666666666667, "x": "ここは慎重に言う。これは\n議員が委員会で述べたことだ。"}, {"t": 1164.9166666666667, "x": "裁判所が「隠していた」と認定したわけではない。"}, {"t": 1168.2833333333333, "x": "でも、15年。"}, {"t": 1169.5833333333333, "x": "15年だ。"}, {"t": 1170.5, "x": "その前の年の12月、別の議員も\n法務委員会でこう言っている。"}, {"t": 1174.4666666666667, "x": "岡沢完治という議員だ。"}, {"t": 1175.95, "x": "「例のきめ手となりました弾丸鑑定書が\n偽造であったということも明らかにされておる」"}, {"t": 1180.7666666666667, "x": "これも議員の発言であって、\n判決ではない。そこは分けて聞いてほしい。"}, {"t": 1184.9833333333333, "x": "ただ、1968年から69年にかけて、国会の中では、\nこの弾丸はおかしいという話が公然と出ていた。"}, {"t": 1192.7833333333333, "x": "それでも、有罪は変わらなかったのね。"}, {"t": 1195.2666666666667, "x": "変わらなかった。"}, {"t": 1196.3333333333333, "x": "なぜ変わらなかったのか。ここを\n理解するのに、もう一つ必要な話がある。"}, {"t": 1201.5333333333333, "x": "共謀共同正犯という言葉を説明する。"}, {"t": 1204.3833333333334, "x": "さっき出てきたやつね。"}, {"t": 1205.9166666666667, "x": "漢字が並んで難しく見えるが、中身は単純だ。"}, {"t": 1209.1166666666666, "x": "何人かで話し合って、一緒にやろうと\n決める。そのうちの一人が実行する。"}, {"t": 1213.7, "x": "このとき、実行しなかった人も、正犯として扱う。"}, {"t": 1217.4166666666667, "x": "手を下していなくても、決めた側なら同じ、ってこと。"}, {"t": 1220.8166666666666, "x": "そういう扱いだ。手伝った、という軽い\n位置ではなくて、本人と同じ位置に置く。"}, {"t": 1225.6666666666667, "x": "この考え方が無いと、組織の上の人には\nいつまでも手が届かない。"}, {"t": 1229.9833333333333, "x": "それは、分かる気がする。"}, {"t": 1231.7, "x": "問題は、この事件での使われ方だ。"}, {"t": 1234.1833333333334, "x": "実行した人が、法廷にいない。"}, {"t": 1236.4833333333333, "x": "……あ。"}, {"t": 1236.95, "x": "普通なら、実行した人がまず裁かれる。"}, {"t": 1239.5333333333333, "x": "何があったかが、そこで固まる。"}, {"t": 1241.7333333333333, "x": "そのうえで、決めた人の裁判をやる。"}, {"t": 1244.0333333333333, "x": "この事件は逆だ。実行した人が\n不在のまま、決めた人だけが裁かれた。"}, {"t": 1248.95, "x": "じゃあ、何があったかは、誰が決めるの。"}, {"t": 1251.5333333333333, "x": "残った人たちの供述だ。"}, {"t": 1253.4, "x": "「あの日、あの部屋で、こう決まった」という\n話を、周りにいたとされる人たちがする。"}, {"t": 1258.5333333333333, "x": "それを積み上げて、謀議があったと認定する。"}, {"t": 1261.3166666666666, "x": "……その人たちの記憶が違ってたら。"}, {"t": 1263.65, "x": "後に研究者が、この点を正面から書いている。"}, {"t": 1266.65, "x": "組織を動かすには話し合いが要るが、\n軍事組織なら命令一つで足りる。"}, {"t": 1271.05, "x": "その命令の中身を確かめることは、\n謀議があったと証明するよりさらに難しい、と。"}, {"t": 1276.0833333333333, "x": "ここを押さえておいてほしい。"}, {"t": 1277.55, "x": "村上國治が有罪になったのは、\n「撃った」からではない。"}, {"t": 1280.95, "x": "「決めた側にいた」と認定されたからだ。"}, {"t": 1283.5666666666666, "x": "撃っていない人が、撃った\n人より先に有罪になったのね。"}, {"t": 1287.1666666666667, "x": "そして、撃ったとされた人は、\n今日まで一度も裁かれていない。"}, {"t": 1291.5166666666667, "x": "裁判の流れを、日付で追う。"}, {"t": 1293.4666666666667, "x": "1957年5月7日、札幌地裁。"}, {"t": 1296.55, "x": "村上國治に無期懲役。"}, {"t": 1298.4, "x": "控訴して、1960年5月31日、札幌高裁の判決が出る。"}, {"t": 1303.65, "x": "無期懲役が、懲役20年に下がった。"}, {"t": 1306.4333333333334, "x": "下がったんだ。"}, {"t": 1307.5, "x": "下がった。ただ、有罪であることは変わっていない。"}, {"t": 1310.4833333333333, "x": "控訴審では、弁護人の数が一気に増えている。"}, {"t": 1313.2833333333333, "x": "全国から集まってきた。"}, {"t": 1315.05, "x": "この段階で、弁護側は幌見峠の弾丸に\n集中した。さっき話した5つの論点だ。"}, {"t": 1320.6166666666666, "x": "後の研究者は、控訴審について「はじめて五分に\n近い戦いをすることができた」と書いている。"}, {"t": 1326.6833333333334, "x": "一審は、五分じゃなかったってこと。"}, {"t": 1329.05, "x": "そう書かれている。"}, {"t": 1330.1333333333334, "x": "そして上告。最高裁第一小法廷。"}, {"t": 1332.8666666666666, "x": "1963年10月17日、上告棄却。"}, {"t": 1336.7333333333333, "x": "棄却。"}, {"t": 1337.5, "x": "懲役20年が確定した。"}, {"t": 1339.4333333333334, "x": "事件が1952年1月だから、11年9か月かかっている。"}, {"t": 1344.0833333333333, "x": "村上はこの間、一度も保釈されていない。"}, {"t": 1346.8166666666666, "x": "判決が出るまでの勾留、つまり\n未決勾留だけで11年だ。"}, {"t": 1350.7666666666667, "x": "……刑が決まる前に、11年。"}, {"t": 1352.8333333333333, "x": "後に国会で、この長さが問題にされている。"}, {"t": 1355.7333333333333, "x": "1968年12月19日、衆議院法務委員会。"}, {"t": 1359.6833333333334, "x": "岡沢完治の発言だ。"}, {"t": 1361.45, "x": "「その前に11年間の未決勾留がございます」"}, {"t": 1364.4666666666667, "x": "「御承知のとおり刑は20年でございますが、"}, {"t": 1366.8833333333334, "x": "本年の5月26日をもちまして\n刑法28条にいうところの刑期の3分の1を経過し、"}, {"t": 1372.5833333333333, "x": "仮釈放の要件ができております」"}, {"t": 1374.9833333333333, "x": "もう、出られる条件は満たしてたのね。"}, {"t": 1377.4166666666667, "x": "同じ発言に、こうもある。"}, {"t": 1379.0333333333333, "x": "「未決期間を含めますとことしの10月で\n満16年の拘禁でございました」"}, {"t": 1383.7666666666667, "x": "「実質的には刑期の4分の3をすでに\n経過しておるわけであります」"}, {"t": 1387.8333333333333, "x": "ちなみに、この議員は判決の年を\n「昭和38年11月」と言っている。"}, {"t": 1392.85, "x": "実際の上告棄却は、1963年、\n昭和38年の10月17日だ。"}, {"t": 1398.5333333333333, "x": "1か月ずれている。"}, {"t": 1399.9666666666667, "x": "国会の記録も、完璧じゃないのね。"}, {"t": 1402.5, "x": "完璧じゃない。だから、日付は必ず判決の側で取る。"}, {"t": 1406.8333333333333, "x": "ここで、いなくなった人たちの話をする。"}, {"t": 1409.6, "x": "中国に渡ったっていう。"}, {"t": 1411.2666666666667, "x": "当時、日本と中国のあいだに、\n正式な行き来は無かった。"}, {"t": 1414.85, "x": "国交が無いからだ。"}, {"t": 1416.2166666666667, "x": "それでも、船で行き来する経路があった。"}, {"t": 1418.7166666666667, "x": "非公式の密航船だ。当時これを\n「人民艦隊」と呼んだ。"}, {"t": 1422.8, "x": "艦隊って言うほど大げさなものなの。"}, {"t": 1425.05, "x": "漁船に近いものだったとされている。"}, {"t": 1427.0666666666666, "x": "呼び名だけが大げさだ。"}, {"t": 1428.5833333333333, "x": "1955年3月30日、静岡県の焼津から、\n上海に向かう船が出たとされている。"}, {"t": 1434.75, "x": "その後も何度か出て、1956年3月の船が最後だった。"}, {"t": 1439.15, "x": "この事件に関係するとされた人が、あわせて\n10人、この経路で日本を離れたとされている。"}, {"t": 1444.7666666666667, "x": "10人。"}, {"t": 1445.5166666666667, "x": "そのうち、撃ったとされた人と、\nその場にいたとされた人が含まれていた。"}, {"t": 1449.9333333333334, "x": "国会にも出ている。1958年7月17日、"}, {"t": 1453.7166666666667, "x": "衆議院の海外同胞引揚及び遺家族援護に\n関する調査特別委員会だ。"}, {"t": 1458.5833333333333, "x": "中山マサという議員の発言だ。"}, {"t": 1460.7, "x": "「このいわゆる人民艦隊というものは\nどうしてできたかと申しますれば」"}, {"t": 1464.6, "x": "「しかも、北海道の白鳥事件の容疑者なども、\nこれに乗って向こうへ行っているのですが」"}, {"t": 1469.85, "x": "国会で、そう言われてたんだ。"}, {"t": 1471.85, "x": "同じ日に、長谷川峻という議員も話している。"}, {"t": 1474.9166666666667, "x": "この年、白山丸という船で、\n中国から大勢が帰ってきた。"}, {"t": 1478.9666666666667, "x": "「白山丸に乗船した密出国者58名はすでに\n逮捕した。これは私も現地に参りまして、"}, {"t": 1484.9, "x": "逮捕したところを見ることができたのであります」"}, {"t": 1487.65, "x": "そのうえで、こう聞いている。"}, {"t": 1489.1, "x": "「人民艦隊だ、あるいは火炎びんの問題だ、\nそのほか白鳥事件の問題等々があるやに"}, {"t": 1494.5166666666667, "x": "私どもは拝承しております」"}, {"t": 1496.4666666666667, "x": "帰ってきた人の中に、いるかもしれないと。"}, {"t": 1499.3333333333333, "x": "そういう疑いが、国会で語られていた。"}, {"t": 1501.9, "x": "1975年4月、北海道警は、4人を国外逃亡として\n時効を止め、あらためて全国に指名手配した。"}, {"t": 1509.4, "x": "この時、時効の時計が正式に止まった。"}, {"t": 1512.1833333333334, "x": "そして、その後に日本へ帰ってきた\n人たちは、いずれも起訴されていない。"}, {"t": 1516.6666666666667, "x": "されなかったの。"}, {"t": 1517.85, "x": "されなかった。当時の弁護士は、"}, {"t": 1519.7666666666667, "x": "検察としては白鳥事件をまた\n掘り起こさずに終わらせたかったのだろう、と"}, {"t": 1523.95, "x": "語っている。"}, {"t": 1524.9, "x": "これは弁護士の見方であって、検察が\n理由を公表したわけではない。"}, {"t": 1529.5666666666666, "x": "村上國治の話に戻る。"}, {"t": 1531.4666666666667, "x": "刑が確定した後、彼は網走の刑務所に入った。"}, {"t": 1534.9, "x": "網走。"}, {"t": 1535.6833333333334, "x": "北海道の東の端だ。冬は氷点下が続く。"}, {"t": 1538.9333333333334, "x": "ここでの彼の様子も、国会に残っている。"}, {"t": 1541.6666666666667, "x": "1969年3月11日の法務委員会。"}, {"t": 1545.0, "x": "猪俣浩三は、前の年に実際に網走まで行っている。"}, {"t": 1548.6166666666666, "x": "「刑務所の担当官は村上を非常にほめておりました。"}, {"t": 1551.7166666666667, "x": "模範囚だと言っておりました」"}, {"t": 1553.6166666666666, "x": "そして、こういう事実を挙げている。"}, {"t": 1555.7166666666667, "x": "「昨年網走の刑務所では、"}, {"t": 1557.3833333333334, "x": "刑務官全員会議を開きまして、\n全部の一致した意見で村上国治は"}, {"t": 1561.7166666666667, "x": "仮釈放すべきものだという決議をいたしまして」"}, {"t": 1564.75, "x": "刑務官が、全員一致で。"}, {"t": 1566.75, "x": "そういう発言が残っている。"}, {"t": 1568.5333333333333, "x": "外の動きも大きかった。"}, {"t": 1570.0333333333333, "x": "1968年12月の岡沢完治の発言から引く。"}, {"t": 1574.1666666666667, "x": "「村上国治さんの故郷である北海道上川郡比布町長が\n身元引き受け人をみずから買って出られ」"}, {"t": 1580.1833333333334, "x": "「地元の町議会は満場一致で\n早期釈放の決議をされて、その要請書を\n当局にお出しになっておられます」"}, {"t": 1586.55, "x": "比布町だけではない。"}, {"t": 1587.7666666666667, "x": "周りの6つの町村、旭川市長、網走市長も動いた。"}, {"t": 1591.75, "x": "「網走市……30名の議員さんの中の26名までが、"}, {"t": 1595.1333333333334, "x": "早期釈放のための署名や\n要請行動に参加しておられます」"}, {"t": 1599.0166666666667, "x": "刑務所がある町の議員が。"}, {"t": 1600.7833333333333, "x": "そして全国だ。「この村上さんの早期釈放を願う\n嘆願署名が60万も集まっておる」"}, {"t": 1606.4833333333333, "x": "60万人。"}, {"t": 1607.6, "x": "この議員は、村上と同い年だった。45歳だ。"}, {"t": 1611.0166666666667, "x": "本人に会った印象を、こう述べている。"}, {"t": 1613.3166666666666, "x": "「私も白髪でありますが、村上さんは非常な"}, {"t": 1616.35, "x": "白髪になられて、からだも小さくて、\n一見60歳くらいのような肉体の現象を示しておられる」"}, {"t": 1622.3666666666666, "x": "45歳で。"}, {"t": 1623.55, "x": "16年の勾留と服役の後だ。"}, {"t": 1625.85, "x": "ただし、この動きの全部が「無実だから出せ」という\n主張だったわけではない。"}, {"t": 1630.5, "x": "仮釈放の要件は、もう満たしていた。\nそこを指摘する声も混ざっていた。"}, {"t": 1635.05, "x": "法務省の答弁は、慎重だった。"}, {"t": 1637.3166666666666, "x": "仮釈放を決めるのは地方更生保護委員会で、法務省が\n指図するものではない。そう繰り返している。"}, {"t": 1643.9, "x": "1969年11月14日、村上國治は仮釈放された。"}, {"t": 1648.85, "x": "出られたんだ。"}, {"t": 1649.8666666666666, "x": "出られた。刑期を43パーセント残しての釈放だった。"}, {"t": 1653.5166666666667, "x": "逮捕された日から数えると、外に\n出られなかったのは17年と45日だ。"}, {"t": 1658.4333333333334, "x": "17年。"}, {"t": 1659.3833333333334, "x": "この釈放が、どれくらい異例だったか。"}, {"t": 1661.7833333333333, "x": "後の国会に、その答えがある。"}, {"t": 1663.75, "x": "1975年2月25日、衆議院法務委員会。"}, {"t": 1667.5666666666666, "x": "青柳盛雄という議員の発言だ。"}, {"t": 1669.8, "x": "「北海道の白鳥事件の村上国治君などは\n一審無期懲役、二審20年の刑になって」"}, {"t": 1675.5333333333333, "x": "「14年ぐらい刑をつとめまして、たしか"}, {"t": 1678.05, "x": "5、6年の仮出獄を認められていま\n釈放されておりますけれども」"}, {"t": 1682.0666666666666, "x": "「これは非常に異例な部類でありまして」"}, {"t": 1684.3666666666666, "x": "異例。"}, {"t": 1684.9666666666667, "x": "この議員が問題にしていたのは、別のことだ。"}, {"t": 1687.85, "x": "無実を主張し続ける人は、反省していないと\n見なされて、仮釈放が下りにくい。"}, {"t": 1692.8833333333334, "x": "彼はそれを、おかしいと言っている。"}, {"t": 1694.85, "x": "「罪を犯したことがないという確信に燃えている\n人に、改悛の情があるかないかなんということを」"}, {"t": 1700.2833333333333, "x": "「事実を認めるか認めないかに\nよって判定するということこそが、\n一方的な官僚的な考え方ではないか」"}, {"t": 1706.9166666666667, "x": "やってないと言い続けると、出られなくなる。"}, {"t": 1709.55, "x": "そういう構造の話だ。"}, {"t": 1711.1166666666666, "x": "村上は、出た後も無実を主張し続けた。"}, {"t": 1713.9833333333333, "x": "そして、再審を求め続けた。"}, {"t": 1716.1666666666667, "x": "ただ、その扉は開かない。"}, {"t": 1718.0833333333333, "x": "1969年6月18日、札幌高裁が再審請求を棄却。"}, {"t": 1723.1833333333334, "x": "1971年7月17日、異議申立ても棄却。"}, {"t": 1727.4, "x": "残ったのは、最高裁への特別抗告だけになった。"}, {"t": 1730.95, "x": "最後の一手ね。"}, {"t": 1732.1833333333334, "x": "最後の一手だ。"}, {"t": 1733.2833333333333, "x": "1975年2月と3月、衆議院法務委員会には「\n白鳥事件の再審に関する陳情書」が届いている。"}, {"t": 1740.8, "x": "会議録の頭の、事務的な\n一覧のところに、そう記されている。"}, {"t": 1744.9166666666667, "x": "決定が出る直前まで、国会に紙が届いていた。"}, {"t": 1748.8, "x": "1975年5月20日。"}, {"t": 1751.15, "x": "最高裁第一小法廷が、特別抗告を棄却した。"}, {"t": 1754.8666666666666, "x": "……負けたのね。"}, {"t": 1755.8833333333334, "x": "負けた。村上國治の有罪は、動かなかった。"}, {"t": 1759.05, "x": "ところが、この棄却の決定が、\n日本の刑事裁判を大きく変えることになる。"}, {"t": 1763.8333333333333, "x": "棄却なのに。"}, {"t": 1764.9333333333334, "x": "棄却なのに、だ。"}, {"t": 1766.2333333333333, "x": "決定の中で、最高裁は\n再審についての考え方を述べた。"}, {"t": 1770.1666666666667, "x": "それまで、再審の扉は\n「開かずの門」と呼ばれていた。"}, {"t": 1773.9833333333333, "x": "ほとんど開かなかったってこと。"}, {"t": 1776.0333333333333, "x": "ほとんど開かなかった。"}, {"t": 1777.4, "x": "真犯人が名乗り出るくらいのことが無いと、\n動かない。そういう運用だった。"}, {"t": 1781.9333333333334, "x": "この決定は、そこに二つのことを書いた。"}, {"t": 1784.6166666666666, "x": "一つ。新しく出てきた証拠だけを見るのではなく、\n前からある証拠と合わせて、全体で見直す。"}, {"t": 1790.5833333333333, "x": "二つ。「疑わしいときは被告人の利益に」という\n刑事裁判の鉄則は、再審にも当てはまる。"}, {"t": 1796.65, "x": "……有罪を確定させるときのルールを、\nやり直しの入口にも使う。"}, {"t": 1800.6166666666666, "x": "そういうことだ。"}, {"t": 1801.6, "x": "確定した判決の事実認定に、合理的な疑いが\n出るところまでいけば、再審を始めてよい。"}, {"t": 1807.5833333333333, "x": "この論旨が、後に「白鳥決定」と\n呼ばれるようになった。"}, {"t": 1811.3166666666666, "x": "ここは、はっきりさせておきたい。"}, {"t": 1813.2833333333333, "x": "「白鳥決定」と呼ばれているのは、村上の抗告を\n棄却した決定の本文全部ではない。"}, {"t": 1818.7666666666667, "x": "その中の、この考え方を示した部分を指している。"}, {"t": 1822.2166666666667, "x": "村上さん自身は、救われていないのね。"}, {"t": 1824.9333333333334, "x": "救われていない。"}, {"t": 1825.9666666666667, "x": "ただ、この決定は、幌見峠の弾丸について、\nこういう言い方をしている。"}, {"t": 1830.5, "x": "証拠の弾丸について、第三者の作為、\nつまり誰かが手を加えたことや、"}, {"t": 1834.85, "x": "不公正な捜査が入り込んだという\n疑いが生じうることも、否定しがたい。"}, {"t": 1839.3666666666666, "x": "……疑いは、あると言ってる。"}, {"t": 1841.1, "x": "そう読める。それでも、有罪はひっくり返らなかった。"}, {"t": 1844.4, "x": "そして翌1976年、財田川事件で\n同じ考え方が繰り返される。"}, {"t": 1849.4833333333333, "x": "ここから、免田事件、財田川事件、松山事件、\n島田事件と、死刑囚の再審が次々に開き始める。"}, {"t": 1856.7333333333333, "x": "開かずの門が、開いた。"}, {"t": 1858.6833333333334, "x": "自分は開かなかった扉を、\n他の人のために開けたのね。"}, {"t": 1862.45, "x": "結果としては、そうなった。"}, {"t": 1864.9, "x": "この事件には、二つの見方が、今も並んで残っている。"}, {"t": 1868.55, "x": "どちらが正しいかは、ここでは\n決めない。両方を並べる。"}, {"t": 1872.0666666666666, "x": "うん。"}, {"t": 1872.5833333333333, "x": "一つ目。これは作られた事件だ、という見方だ。"}, {"t": 1875.7666666666667, "x": "根拠として挙げられるのは、主に5つだ。"}, {"t": 1878.35, "x": "撃ったとされる人の身柄が\n一度も確保されていないこと。"}, {"t": 1881.65, "x": "拳銃も自転車も見つかっていないこと。"}, {"t": 1884.0166666666667, "x": "別の容疑で捕まえて本件を聞く、という\n捜査が積み重なっていること。"}, {"t": 1888.3333333333333, "x": "重要な証言の多くが、長い\n勾留の後に出てきていること。"}, {"t": 1892.0166666666667, "x": "そして、唯一の物証とされた幌見峠の弾丸に、\n偽造の疑いが持たれていること。"}, {"t": 1897.3833333333334, "x": "最後のは、裁判所も認めかけてたやつね。"}, {"t": 1900.3166666666666, "x": "そうだ。研究者はこう書いている。"}, {"t": 1902.25, "x": "「裁判所すら認識している」"}, {"t": 1904.1666666666667, "x": "二つ目。組織が関わったこと\n自体はあった、という見方だ。"}, {"t": 1908.0166666666667, "x": "これを言っているのは、意外な人たちでもある。"}, {"t": 1910.7833333333333, "x": "意外。"}, {"t": 1911.4333333333334, "x": "村上の弁護を担っていた弁護士の一人、岡林辰雄だ。"}, {"t": 1915.2, "x": "1960年代の終わりに、彼は\nこう語ったと記録されている。"}, {"t": 1919.35, "x": "「幌見峠で発見されたという\n弾丸はまぎれもなく偽造証拠だが」"}, {"t": 1923.2333333333333, "x": "「あの場所で彼の指示の下、党員による\n射撃演習が行われたことは疑いのない事実だ」"}, {"t": 1928.7333333333333, "x": "……弾は偽物だけど、練習はあった。"}, {"t": 1931.2333333333333, "x": "幌見峠からは、弾丸のほかに、\n手製の手榴弾の一部も見つかっている。"}, {"t": 1935.7666666666667, "x": "そちらは、偽造だとは言われていない。"}, {"t": 1937.8833333333334, "x": "この事件を長く調べてきた\n研究者も、最後にこう書いている。"}, {"t": 1941.7166666666667, "x": "火器を使った軍事訓練の実在が証明されているという\n事実の重みは、銃弾の偽造問題を超えて大きい、と。"}, {"t": 1948.3166666666666, "x": "この人は、もともと冤罪だと信じていた側だ。"}, {"t": 1951.4833333333333, "x": "……調べた結果、変わったのね。"}, {"t": 1953.5333333333333, "x": "変わった、と自分で書いている。"}, {"t": 1955.4, "x": "この二つは、矛盾していない。"}, {"t": 1957.3333333333333, "x": "弾丸が作られたことと、事件が\n起きたことは、別の問題として残る。"}, {"t": 1961.9, "x": "作られた証拠で有罪にしてよいか、というのが\n一つ目の問い。"}, {"t": 1965.5333333333333, "x": "では本当は何があったのか、というのが\n二つ目の問いだ。"}, {"t": 1969.0166666666667, "x": "二つ目は、まだ答えが出ていない。"}, {"t": 1971.2666666666667, "x": "出ていない。"}, {"t": 1972.65, "x": "最初の話に戻る。"}, {"t": 1974.1333333333334, "x": "逮捕状だ。"}, {"t": 1975.0, "x": "出ているのは2通。片方は、元ポンプ職人の佐藤博。\nもう片方は、元北海道大学の学生、鶴田倫也。"}, {"t": 1982.5666666666666, "x": "撃ったとされている人たち。"}, {"t": 1984.3333333333333, "x": "そうされている。ただ、繰り返すが、\nこの2人は起訴されていない。"}, {"t": 1988.2, "x": "逮捕状が出ているというのは、\n疑いをかけられているというだけで、\n有罪でも無罪でもない。"}, {"t": 1993.3666666666666, "x": "裁判が一度も開かれていない以上、この2人が\n撃ったかどうかは、決まっていない。"}, {"t": 1998.1333333333334, "x": "決まっていないまま、逮捕状だけ生きてるのね。"}, {"t": 2001.0166666666667, "x": "生きている。"}, {"t": 2001.7833333333333, "x": "半年ごとの更新が、ずっと続いている。"}, {"t": 2004.4333333333334, "x": "2012年に日本経済新聞が数えたときは、\n鶴田の逮捕状が約140回、佐藤が約160回だった。"}, {"t": 2011.8166666666666, "x": "その10年後、2022年3月の時点では、\n鶴田が161回、佐藤が180回になっていた。"}, {"t": 2018.8, "x": "まだ増えてるんだ。"}, {"t": 2020.0166666666667, "x": "増えている。"}, {"t": 2020.7833333333333, "x": "2人とも、存命なら90代だ。"}, {"t": 2023.1, "x": "2002年、警察庁は中国の公安当局に確認を求めた。"}, {"t": 2027.2166666666667, "x": "佐藤は亡くなっていて、鶴田は\n北京にいる、という情報はあった。"}, {"t": 2030.9833333333333, "x": "ただ、当局からの確認は取れなかった。"}, {"t": 2033.75, "x": "確認が取れないと、どうなるの。"}, {"t": 2035.9166666666667, "x": "死亡が確定しないから、事件を終わらせられない。"}, {"t": 2038.85, "x": "だから更新する。北海道警はこう言っている。"}, {"t": 2041.7166666666667, "x": "「常識的に考え生きている可能性がある限り」"}, {"t": 2044.7666666666667, "x": "……それ、いつまで。"}, {"t": 2046.0166666666667, "x": "誰にも言えない。"}, {"t": 2047.05, "x": "ちなみに、事件を最初に長く追いかけた\n本は、こういう書き出しで始まっている。"}, {"t": 2051.75, "x": "北海道警察本部の上層階の警備部書庫に60年を\n超えて執行を待ち続けている逮捕状がある、と。"}, {"t": 2058.2166666666667, "x": "それが書かれたのが2013年だ。"}, {"t": 2060.516666666667, "x": "あれから、また14年経っている。"}, {"t": 2063.2, "x": "最後に、整理しておく。"}, {"t": 2064.8166666666666, "x": "1952年1月21日の夜、札幌で、\n警察官の白鳥一雄が撃たれて亡くなった。"}, {"t": 2071.1666666666665, "x": "拳銃も、犯人が乗っていたとされる\n自転車も、今日まで見つかっていない。"}, {"t": 2075.5, "x": "起訴されたのは3人。いずれも、\n撃ったとされた人ではない。"}, {"t": 2079.05, "x": "1957年、村上國治に無期懲役。"}, {"t": 2082.1833333333334, "x": "1960年に懲役20年。"}, {"t": 2084.5333333333333, "x": "1963年10月17日に確定した。"}, {"t": 2088.1833333333334, "x": "罪の形は、組織の責任者として、\n共に決めた側にいたという認定だ。"}, {"t": 2093.016666666667, "x": "唯一の物証とされた幌見峠の弾丸には、\n偽造の疑いが残ったままだ。"}, {"t": 2097.7166666666667, "x": "村上は1969年11月14日に仮釈放された。"}, {"t": 2101.9333333333334, "x": "外に出られなかったのは17年と45日。"}, {"t": 2105.0333333333333, "x": "無実の主張は、最後まで変えなかった。"}, {"t": 2107.4333333333334, "x": "1994年に亡くなっている。"}, {"t": 2109.9, "x": "1975年5月20日、最高裁は特別抗告を棄却した。"}, {"t": 2114.6666666666665, "x": "その決定の中で示された「\n疑わしいときは被告人の利益に」という\n考え方が、白鳥決定と呼ばれている。"}, {"t": 2121.7, "x": "これが、後の再審の扉を開けた。"}, {"t": 2124.0333333333333, "x": "そして、撃ったとされた2人の逮捕状は、\nいまも半年ごとに書き換えられている。"}, {"t": 2128.9333333333334, "x": "……74年たって、まだ誰が\n撃ったかは決まっていないのね。"}, {"t": 2132.5, "x": "決まっていない。"}, {"t": 2133.45, "x": "この事件には、大きな話が\nたくさん付いている。だが、それを言い始めると、"}, {"t": 2137.9333333333334, "x": "必ず元の一点から離れていく。"}, {"t": 2140.3166666666666, "x": "1月の夜に、家に帰る途中の人が\n一人、後ろから撃たれた。"}, {"t": 2144.45, "x": "それを誰がやったかが、74年間、決まっていない。"}, {"t": 2147.7833333333333, "x": "この回で扱ったのは、1952年から1975年までの話だ。"}, {"t": 2153.0666666666666, "x": "いまの政党や、いまそこにいる\n人たちの話ではない。そこは混ぜないでほしい。"}, {"t": 2157.616666666667, "x": "出典を挙げておく。"}, {"t": 2158.9, "x": "事件の詳細と当時の札幌の状況は、\n国立国会図書館の国会会議録検索システムから、"}, {"t": 2164.9333333333334, "x": "1952年2月25日、\n衆議院行政監察特別委員会の調査報告。"}, {"t": 2170.7, "x": "時代の背景は、1952年3月27日の参議院本会議と、\n1953年3月5日の衆議院地方行政委員会。"}, {"t": 2179.366666666667, "x": "中国へ渡ったとされる経緯は、\n1958年7月17日の衆議院、"}, {"t": 2184.383333333333, "x": "海外同胞引揚及び遺家族援護に\n関する調査特別委員会。"}, {"t": 2188.516666666667, "x": "弾丸の鑑定と再審、仮釈放については、\n1968年12月19日、1969年3月11日、"}, {"t": 2196.6666666666665, "x": "1975年2月25日の衆議院法務委員会。"}, {"t": 2200.6, "x": "裁判の日付と判決の中身は、\n小樽商科大学の紀要「商学討究」\n第64巻に載っているシンポジウムの記録。"}, {"t": 2208.016666666667, "x": "逮捕状の更新回数は、\n日本経済新聞の2012年と2022年の記事だ。"}, {"t": 2213.516666666667, "x": "最後に、一つだけ。"}, {"t": 2215.0666666666666, "x": "この事件で有罪になった人は、撃っていない側だった。"}, {"t": 2218.4, "x": "撃ったとされた人は、一度も法廷に立っていない。"}, {"t": 2221.366666666667, "x": "そして、有罪が動かなかったその決定が、\n他の人たちのやり直しの道を作った。"}, {"t": 2226.7, "x": "噛み合っていない。ずっと噛み合っていない。"}, {"t": 2229.1, "x": "……終わっていないのね。"}, {"t": 2230.383333333333, "x": "終わっていない。半年ごとに、\n紙が書き換えられている限りは。"}, {"t": 2234.0666666666666, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
