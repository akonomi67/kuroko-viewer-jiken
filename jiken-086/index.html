<script>
const D={"name": "086", "file": "086_編集用", "dur": 2235.81665625, "segs": [], "subs": [{"t": 0.0, "x": "北海道警の書庫に、74年間ずっと\n更新され続けている紙が2枚ある。"}, {"t": 5.0, "x": "74年って、ちょっと気が遠くなる数字ね。"}, {"t": 8.0, "x": "逮捕状だ。期限が切れる前に、また出し直す。\nそれを半年ごとに繰り返している。"}, {"t": 13.266666666666667, "x": "待って。逮捕状って、普通は\n使ったらそれで終わりじゃないの。"}, {"t": 17.05, "x": "普通はな。今回は違う。"}, {"t": 18.933333333333334, "x": "どう違うの。"}, {"t": 19.916666666666668, "x": "出されたのは1952年。"}, {"t": 21.866666666666667, "x": "今年は2026年。一度も\n執行されないまま74年が経っている。"}, {"t": 26.583333333333332, "x": "一度も。"}, {"t": 27.433333333333334, "x": "一度もだ。"}, {"t": 28.266666666666666, "x": "日本経済新聞が2022年に数字を出している。"}, {"t": 31.616666666666667, "x": "その年の3月の時点で、片方の逮捕状は\n161回、もう片方は180回、更新されていた。"}, {"t": 38.65, "x": "180回……。"}, {"t": 39.86666666666667, "x": "効力を持っている日本の逮捕状としては、\nいちばん古いものだと言われている。"}, {"t": 44.36666666666667, "x": "でも、74年前の事件でしょ。時効は。"}, {"t": 47.38333333333333, "x": "止まっている。"}, {"t": 48.233333333333334, "x": "この2人は国外に出たとされていて、\n日本の外にいる間は、時効の時計が進まない。"}, {"t": 53.7, "x": "じゃあ、永遠に終わらないじゃない。"}, {"t": 55.6, "x": "終わらせる方法はある。"}, {"t": 56.8, "x": "死亡が確認されればいい。"}, {"t": 58.46666666666667, "x": "2人とも、亡くなったという話は伝わっている。"}, {"t": 61.3, "x": "片方は1988年、片方は2012年だ。"}, {"t": 65.3, "x": "ただ、その確認が取れない。"}, {"t": 67.18333333333334, "x": "警察庁は2002年に、中国の公安当局に\n問い合わせている。はっきりした\n答えは返ってこなかった。"}, {"t": 73.53333333333333, "x": "北海道警はこう言っている。"}, {"t": 75.1, "x": "「常識的に考え生きている\n可能性がある限り」続ける、と。"}, {"t": 79.15, "x": "それで、半年ごとに書き換えるのね。"}, {"t": 81.65, "x": "そうだ。"}, {"t": 82.25, "x": "今回追いかけるのは、この紙が生まれた夜の話だ。"}, {"t": 85.51666666666667, "x": "白鳥事件。"}, {"t": 86.51666666666667, "x": "1952年1月、札幌で、警察官が撃たれた。"}, {"t": 90.55, "x": "先に言っておく。この動画では、\n誰かを犯人だと断定しない。"}, {"t": 94.36666666666666, "x": "この事件は、そこが特別に厄介なんだ。"}, {"t": 97.76666666666667, "x": "1952年1月21日。"}, {"t": 100.41666666666667, "x": "札幌の、午後7時40分ごろだ。"}, {"t": 103.03333333333333, "x": "1月の札幌の7時半過ぎって、もう真っ暗ね。"}, {"t": 106.43333333333334, "x": "真っ暗だ。"}, {"t": 107.26666666666667, "x": "そこを、私服の男が一人、自転車で走っていた。"}, {"t": 110.65, "x": "札幌市中央警察署の警備課長、警部の白鳥一雄。"}, {"t": 114.16666666666667, "x": "仕事を終えて、家に帰るところだった。"}, {"t": 116.7, "x": "後ろから、もう一台の自転車が追いついてきた。"}, {"t": 119.63333333333334, "x": "追い越しざまに、拳銃が撃たれた。"}, {"t": 121.73333333333333, "x": "白鳥警部は、その場で亡くなった。"}, {"t": 124.18333333333334, "x": "……即死だったの。"}, {"t": 125.38333333333334, "x": "即死だ。"}, {"t": 126.16666666666667, "x": "この夜のことは、1か月後に\n国会で読み上げられている。"}, {"t": 129.58333333333334, "x": "衆議院の行政監察特別委員会。"}, {"t": 131.9, "x": "1952年2月25日。"}, {"t": 134.45, "x": "衆議院議長の命令で、議員4人が札幌に行って、\n3日間かけて調べてきた。その報告書だ。"}, {"t": 140.63333333333333, "x": "読み上げたのは、篠田弘作という議員だ。"}, {"t": 143.35, "x": "国会が調査団を出したの。"}, {"t": 145.28333333333333, "x": "出した。それくらいの扱いだったということだ。"}, {"t": 148.11666666666667, "x": "報告書には、こう書いてある。"}, {"t": 150.0, "x": "「自転車で追いついた\n氏名年齢不詳の男に突然背後から、"}, {"t": 153.51666666666668, "x": "約1メートルぐらいの距離と\n説明されておりますが、拳銃で狙撃され」"}, {"t": 158.0, "x": "1メートル。"}, {"t": 158.98333333333332, "x": "ほとんど真後ろだ。"}, {"t": 160.18333333333334, "x": "現場についても書いてある。"}, {"t": 161.63333333333333, "x": "「現場はバス路線、人家稠密、\n中央警察署から人家続きで約20丁」"}, {"t": 166.58333333333334, "x": "20丁は、だいたい2キロちょっとだ。"}, {"t": 168.7, "x": "署から歩いて帰れる距離に、\n家が並んでいる通りだった。"}, {"t": 172.16666666666666, "x": "人は、いなかったの。"}, {"t": 173.8, "x": "いた。「犯行の現場付近には\n2、3名の通行人がありました」"}, {"t": 177.76666666666668, "x": "ただ、その続きがこうだ。"}, {"t": 179.36666666666667, "x": "「暗夜のため犯人の人相、着衣等を\n確認した者はありませんでした」"}, {"t": 183.83333333333334, "x": "誰も、顔を見ていない。"}, {"t": 185.46666666666667, "x": "誰も見ていない。"}, {"t": 186.51666666666668, "x": "近くの住人は、銃声が一発聞こえたと話している。"}, {"t": 189.83333333333334, "x": "通りがかりの人は、二発聞こえたと話している。"}, {"t": 193.05, "x": "そこも、最初から合っていなかった。"}, {"t": 195.91666666666666, "x": "撃たれた人のことを、もう少し聞きたい。"}, {"t": 198.5, "x": "報告書に、経歴がそのまま載っている。"}, {"t": 201.05, "x": "「昭和10年北海道巡査を拝命し、終戦前は\n外事係員、終戦後は警備係員として勤務」"}, {"t": 207.23333333333332, "x": "「昭和23年3月札幌市警の警備課長に\n就任、今日に至った人であります」"}, {"t": 212.4, "x": "昭和10年は1935年。"}, {"t": 214.53333333333333, "x": "巡査から始めて、17年目だ。"}, {"t": 217.1, "x": "外事係って、何をする人。"}, {"t": 219.35, "x": "外国に関わる情報を扱う部署だ。"}, {"t": 221.6, "x": "戦前は特高警察の中にあった。"}, {"t": 224.0, "x": "彼は戦時中、満州のハルビン学院という学校に\n行かされて、ロシア語を勉強している。"}, {"t": 229.31666666666666, "x": "警察官が、ロシア語。"}, {"t": 231.13333333333333, "x": "そういう仕事に就く人だったということだ。"}, {"t": 233.63333333333333, "x": "戦争が終わって、その仕事は\n無くなった。ただ、彼は残った。"}, {"t": 237.66666666666666, "x": "残って、今度は警備課長になった。"}, {"t": 240.11666666666667, "x": "警備課長は、何を担当するの。"}, {"t": 242.43333333333334, "x": "報告書はこう書いている。"}, {"t": 243.83333333333334, "x": "「営業許可事項も担当しておりましたので、\nこの方面の業者とも関係があり」"}, {"t": 248.51666666666668, "x": "「また渉外事項の担当で第三国人との交渉もあった」"}, {"t": 252.03333333333333, "x": "そして、こう続く。"}, {"t": 253.45, "x": "「何といっても昨秋来の日共系自由労組員検挙に\n関し、しばしば過激な脅迫を受けておりました」"}, {"t": 259.73333333333335, "x": "いろんな方向に、恨まれる可能性があったってこと。"}, {"t": 262.9, "x": "報告書自体が、そう読める書き方をしている。"}, {"t": 265.8, "x": "一つ、書かれていないことがある。"}, {"t": 267.85, "x": "彼が持っていた警察手帳だ。"}, {"t": 269.9, "x": "手帳。"}, {"t": 270.6, "x": "情報を集めるのが仕事の人が、\n毎日持ち歩いていた手帳だ。"}, {"t": 274.4, "x": "何か書いてあったはずだと、ずっと言われてきた。"}, {"t": 277.3833333333333, "x": "この手帳は、裁判に出ていない。"}, {"t": 279.3, "x": "警察が提出を断り続けた。"}, {"t": 281.7, "x": "……それは、気になるわね。"}, {"t": 283.28333333333336, "x": "気になった人が大勢いた。だから、\nこの事件にはいろんな説が付いた。"}, {"t": 287.51666666666665, "x": "ただ、手帳が出ていない以上、\n中身は誰にも分からない。"}, {"t": 290.71666666666664, "x": "分からないことを、分かったようには話さない。"}, {"t": 293.48333333333335, "x": "年齢も、実はきれいに揃っていない。"}, {"t": 295.85, "x": "国会の報告書は「当年37歳」と書いている。"}, {"t": 299.23333333333335, "x": "後の資料の多くは36歳と書く。"}, {"t": 301.85, "x": "一歳ずれてるの。"}, {"t": 303.1, "x": "ずれている。数え年か満年齢かの差かも\nしれないが、どちらとも書いていない。"}, {"t": 307.5833333333333, "x": "この事件は、そういう小さいずれが、あちこちにある。"}, {"t": 311.3, "x": "この事件には、前置きがある。"}, {"t": 313.18333333333334, "x": "撃たれる前の1か月、白鳥警部のところには、\n脅迫状が届き続けていた。"}, {"t": 318.25, "x": "一通や二通じゃなくて。"}, {"t": 319.8666666666667, "x": "報告書に、通数が書いてある。"}, {"t": 321.93333333333334, "x": "1951年の暮れから、1952年1月18日ごろまで。"}, {"t": 326.96666666666664, "x": "白鳥警部あてが、およそ105通。"}, {"t": 329.3, "x": "札幌市長あてが72通。"}, {"t": 331.1166666666667, "x": "札幌地検の検事あてが61通。"}, {"t": 333.75, "x": "三人まとめて狙われてたのね。"}, {"t": 335.8833333333333, "x": "三人の名前と住所を並べた\nビラも、市内にまかれている。"}, {"t": 339.4, "x": "きっかけは、前の年の12月だ。"}, {"t": 341.75, "x": "日雇いの労働者たちが市役所に押しかけて、\n石炭をよこせ、越冬の金をよこせと座り込んだ。"}, {"t": 347.7, "x": "出ていかないので、白鳥警部が現場に行って、退去を\n命じた。それでも動かなかった人が検挙された。"}, {"t": 354.03333333333336, "x": "それで、恨まれた。"}, {"t": 355.48333333333335, "x": "直後から、脅迫が始まっている。"}, {"t": 357.75, "x": "文面は、会議録にそのまま残っている。一つだけ読む。"}, {"t": 361.4, "x": "黒い枠のはがきで、「祝、\n白鳥警備課長御家族一同の死」"}, {"t": 365.55, "x": "……家族まで。"}, {"t": 366.5, "x": "家族に手を出すと書いたものも、\n複数あった。そこは読まない。"}, {"t": 370.28333333333336, "x": "年が明けて1月4日と5日には、こういう\n文書が警察に郵送されている。"}, {"t": 374.8666666666667, "x": "題は「新年に当り警察官諸君に宣言す」"}, {"t": 378.06666666666666, "x": "「我々はこれらの敵、新しい敵を国民の名に\nおいて一人一人葬り去ることを宣言する」"}, {"t": 383.56666666666666, "x": "この文書には、狙う相手の名前が\n並んでいた。その一番目が、市長。"}, {"t": 387.9, "x": "二番目が、白鳥警部だ。"}, {"t": 389.96666666666664, "x": "予告されてたってこと。"}, {"t": 391.6166666666667, "x": "報告書は「暗殺の予告も数十通の投書に\nよって受けておった」と書いている。"}, {"t": 396.46666666666664, "x": "そして、こう結んでいる。"}, {"t": 397.93333333333334, "x": "「思想的背景を持つ計画的犯行と\n疑うに足る理由が相当濃厚であります」"}, {"t": 403.01666666666665, "x": "……最初から、方向が決まってたのね。"}, {"t": 405.43333333333334, "x": "ここが、この事件のいちばん難しいところだ。"}, {"t": 408.26666666666665, "x": "予告があったのは事実だ。"}, {"t": 409.8, "x": "書いた人たちがいるのも事実だ。"}, {"t": 411.9, "x": "ただ、「予告した人」と「撃った人」が\n同じかどうかは、それだけでは決まらない。"}, {"t": 417.01666666666665, "x": "この先の11年、法廷で\n争われたのは、まさにそこだった。"}, {"t": 421.6333333333333, "x": "1952年って、どういう年だったの。"}, {"t": 424.6666666666667, "x": "日本が、占領から出る年だ。"}, {"t": 426.75, "x": "サンフランシスコ平和条約が\n発効するのが、1952年4月28日。"}, {"t": 432.05, "x": "白鳥事件は1月21日。"}, {"t": 434.1666666666667, "x": "条約発効の、3か月と1週間前だ。"}, {"t": 437.26666666666665, "x": "ぎりぎり占領下ね。"}, {"t": 438.7, "x": "そう。そして日本の中では、この先どういう\n国にするかが、まだ何も決まっていなかった。"}, {"t": 444.18333333333334, "x": "軍隊を持つのか持たないのか。"}, {"t": 445.93333333333334, "x": "警察をどれだけ強くするのか。"}, {"t": 447.8333333333333, "x": "全部、これから決める話だった。"}, {"t": 450.21666666666664, "x": "その真ん中に、この事件が置かれた。"}, {"t": 452.55, "x": "1952年3月27日、参議院の本会議。"}, {"t": 456.3666666666667, "x": "来年度の予算を通すかどうかの討論だ。"}, {"t": 458.96666666666664, "x": "自由党の愛知揆一という議員が、\n賛成の理由の中でこう言っている。"}, {"t": 462.98333333333335, "x": "「かの白鳥事件等を初め、全国的に起りつつある\n警察署或いは税務署等々に対するテロ的事件のごとく」"}, {"t": 469.8666666666667, "x": "「政治的、革命的意図を背景とする暴力行為が\n頻々と起っているではありませんか」"}, {"t": 475.15, "x": "予算の話に、事件が出てくるんだ。"}, {"t": 477.7, "x": "出てくる。続きがこうだ。"}, {"t": 479.3666666666667, "x": "「いわゆる間接侵略の危険なきにあらざる\n現状に対しては、相当に強力なる治安組織が、"}, {"t": 484.95, "x": "量質両面にわたって\n整備確立せられなければならない」"}, {"t": 488.5, "x": "つまり、警察にもっと金を出せ、と。"}, {"t": 491.1166666666667, "x": "そういう文脈で使われた。"}, {"t": 492.81666666666666, "x": "この年の4月、政府は破壊活動防止法を\n国会に出す。7月に成立する。"}, {"t": 497.96666666666664, "x": "団体の活動を規制できるようにする法律だ。"}, {"t": 500.6666666666667, "x": "国会は大荒れになった。"}, {"t": 502.3666666666667, "x": "事件が、法律を作る材料になったってこと。"}, {"t": 505.43333333333334, "x": "材料の一つになった、というのが正確なところだ。\nこの年は他にも事件が続いている。"}, {"t": 510.85, "x": "ただ、白鳥事件はその先頭に置かれることが多かった。"}, {"t": 514.35, "x": "翌年の国会で、国家地方警察本部長官の斎藤昇が、\nこう言っている。"}, {"t": 519.3166666666667, "x": "「昨年の下半期の白鳥事件から\nメーデーあるいは吹田事件からこれまでの間に」"}, {"t": 524.2333333333333, "x": "起点の扱いね。"}, {"t": 525.5833333333334, "x": "起点の扱いだ。"}, {"t": 526.8166666666667, "x": "一人の警察官が撃たれた事件が、\n国の制度の話に接続していった。"}, {"t": 531.4833333333333, "x": "そこがこの事件の、もう一つの顔だ。"}, {"t": 534.6166666666667, "x": "事件の翌日から、札幌の街にビラがまかれた。"}, {"t": 538.0, "x": "翌日。"}, {"t": 538.9, "x": "1月22日付だ。撃たれたのが\n21日の夜だから、ほぼ翌日だな。"}, {"t": 543.8666666666667, "x": "報告書の書き方はこうだ。"}, {"t": 545.6666666666666, "x": "「日本共産党札幌委員会の名義で\n『見よ天誅遂に下る』と題した\n活版刷りのビラが多数配布されました」"}, {"t": 552.5666666666667, "x": "天誅。"}, {"t": 553.3333333333334, "x": "天罰、という意味の言葉だ。"}, {"t": 555.25, "x": "報告書は、中身をこう要約している。"}, {"t": 557.6, "x": "「白鳥警備課長の暗殺を是認し」"}, {"t": 559.9666666666667, "x": "そして枚数が書いてある。"}, {"t": 561.4166666666666, "x": "「活版所で約1万枚刷られたと見られておりまして、\n市内各所に数千枚撒布せられております」"}, {"t": 567.4, "x": "1万枚。"}, {"t": 568.3666666666667, "x": "報告書は、この枚数からある結論を引き出している。"}, {"t": 571.6666666666666, "x": "「これが1万枚も刷られているということから、\n自由労働者の行為ではないというふうに判断される」"}, {"t": 577.2166666666667, "x": "……手書きじゃなくて、活版で1万枚。"}, {"t": 579.6833333333333, "x": "印刷所に頼まないと作れない量だ。"}, {"t": 581.8833333333333, "x": "組織が動いていなければ\n出てこない、と読んだわけだ。"}, {"t": 585.1, "x": "捜査の向きは、これで固まった。"}, {"t": 587.2166666666667, "x": "もう一つ、報告書に書かれていることがある。"}, {"t": 590.0, "x": "事件の3日後、1月24日。ある人物が\n道庁の記者クラブで、記者40人を前に声明を出した。"}, {"t": 596.6666666666666, "x": "内容は、白鳥警部への抵抗は\n愛国的な行動だと言うものだった。"}, {"t": 600.9, "x": "報告書は、こう書いている。"}, {"t": 602.5, "x": "「NHKの録音にとられておりますので、\n同君の発表は証拠が残っております」"}, {"t": 607.65, "x": "録音が残ってるんだ。"}, {"t": 609.2666666666667, "x": "残っている。報告書に、記者との\nやりとりまで書いてある。"}, {"t": 612.7, "x": "記者が、検事の家に投げ込まれた石が赤ん坊の枕元に\n落ちていた、これも人権擁護と言うのかと聞いた。"}, {"t": 619.05, "x": "答えは、「それは死んでおらないのだから、\n死んでからでなければ答弁はできない」だった。"}, {"t": 624.1, "x": "……ひどいわね。"}, {"t": 625.05, "x": "この空気の中で、捜査が始まった。"}, {"t": 627.4833333333333, "x": "ただ、ここで気をつけてほしいことが一つある。"}, {"t": 630.25, "x": "ビラを配ることと、人を撃つことは、別の行為だ。"}, {"t": 633.4333333333333, "x": "ビラの出どころが分かっても、撃った\n人が分かったことにはならない。"}, {"t": 637.15, "x": "この区別が、この事件では最後まで付いて回る。"}, {"t": 640.7833333333333, "x": "捜査の規模も、報告書に書いてある。"}, {"t": 643.15, "x": "「市警、国警、検察庁が\n合体となりまして捜査本部を設置」"}, {"t": 647.2833333333333, "x": "当時は、市が持つ警察と国が持つ\n警察が別々にあった。それを合わせた。"}, {"t": 652.1, "x": "さらに「小樽、函館、旭川、帯広その他自警の応援も\n受けまして、約600名を動員」"}, {"t": 658.4833333333333, "x": "600人。"}, {"t": 659.4833333333333, "x": "北海道中から集めている。"}, {"t": 661.3, "x": "報告書を読んだ議員たちが札幌に\n入ったのは、事件の1か月後だ。"}, {"t": 665.5666666666667, "x": "そのときの様子も、一行だけ書き残されている。"}, {"t": 668.65, "x": "「私たちが参りましたときは、まだ\n捜査を続行しておったのであります」"}, {"t": 672.9833333333333, "x": "1か月経っても、まだ600人態勢のままだったのね。"}, {"t": 676.65, "x": "それだけの人数を動かして、現場から\n出てきたものは、多くなかった。"}, {"t": 680.8666666666667, "x": "現場に何があったかも、押さえておこう。"}, {"t": 683.2333333333333, "x": "残っていたのは、薬莢と、\n白鳥警部の体から出た弾丸が一発。"}, {"t": 687.9, "x": "それだけ。"}, {"t": 688.8, "x": "それだけだ。"}, {"t": 689.6666666666666, "x": "拳銃は見つかっていない。"}, {"t": 691.05, "x": "犯人が乗っていたとされる自転車も見つかっていない。"}, {"t": 694.1333333333333, "x": "この二つは、この後74年、一度も出てきていない。"}, {"t": 697.7833333333333, "x": "じゃあ、何を証拠に捜すの。"}, {"t": 699.7666666666667, "x": "弾丸だ。"}, {"t": 700.5666666666667, "x": "弾丸には、銃身の中の溝でついた\n傷が残る。線条痕という。"}, {"t": 704.8333333333334, "x": "同じ銃から撃った弾なら、同じ傷が付く。"}, {"t": 707.4666666666667, "x": "銃が見つかれば、照合できる。"}, {"t": 709.65, "x": "でも、銃が無いんでしょ。"}, {"t": 711.3166666666667, "x": "無い。だから照合する相手がいない。"}, {"t": 713.45, "x": "ここが、この事件のすべての出発点だ。"}, {"t": 716.2, "x": "後にこの裁判は「物証なき裁判」と\n呼ばれるようになる。"}, {"t": 719.7666666666667, "x": "物が無いなら、何で組み立てるか。人の話だ。"}, {"t": 723.1666666666666, "x": "……証言。"}, {"t": 723.9166666666666, "x": "証言と、供述だ。"}, {"t": 725.4666666666667, "x": "この事件の捜査は、そこに全部を賭けることになった。"}, {"t": 728.8, "x": "そして、そこから先が長い。"}, {"t": 731.4, "x": "ここで、当時の言葉を一つ説明しておく。"}, {"t": 734.2166666666667, "x": "中核自衛隊だ。"}, {"t": 735.65, "x": "自衛隊。今のとは違うのよね。"}, {"t": 737.85, "x": "全然違う。名前が似ているだけだ。"}, {"t": 740.1666666666666, "x": "当時、日本共産党が掲げていた方針の中に、"}, {"t": 743.25, "x": "軍事組織を作るというものがあった。\nその実行部隊の呼び名だ。"}, {"t": 747.3166666666667, "x": "先に断っておく。これは\n1952年の話だ。いまの政党や、いま\n所属している人たちの話ではない。"}, {"t": 754.4166666666666, "x": "この方針自体、のちに党が\n「極左冒険主義」として誤りだったと断じている。"}, {"t": 759.4666666666667, "x": "当時の警察が、この組織を\nどれくらいの規模だと見ていたか。"}, {"t": 763.0, "x": "国会に数字が残っている。"}, {"t": 764.9, "x": "1953年3月5日、衆議院の地方行政委員会。"}, {"t": 768.9, "x": "国家地方警察本部長官の斎藤昇の答弁だ。"}, {"t": 772.4166666666666, "x": "「いわゆる中核自衛隊は、現在われわれのところに\nわかっておりますのは約600隊でありまして」"}, {"t": 777.95, "x": "「隊員数が5500名でございます。われわれの\nわかっている資料によるものはさようであります」"}, {"t": 783.3, "x": "5500人。"}, {"t": 784.5, "x": "ただ、この数字は警察の推定だ。"}, {"t": 786.7333333333333, "x": "答弁自体が「われわれのわかっている\n資料によるもの」と付け加えている。"}, {"t": 791.1166666666667, "x": "実際にどれだけいたかは、分からない。"}, {"t": 793.5833333333334, "x": "札幌にも、あったの。"}, {"t": 795.2666666666667, "x": "あったとされている。"}, {"t": 796.2666666666667, "x": "裁判で認定されたのも、そこだ。"}, {"t": 798.6333333333333, "x": "確定判決は、この事件を、札幌の中核自衛隊が\n組織として起こしたものだと見ている。"}, {"t": 804.35, "x": "誰が何をしたと見られたか、整理しておく。"}, {"t": 807.05, "x": "撃ったのは、佐藤博という人物とされた。"}, {"t": 809.8166666666667, "x": "付き添ったのが鶴田倫也、隊長格が\n宍戸均、そして指示を出したのが\n札幌委員会の責任者、村上國治。"}, {"t": 817.2333333333333, "x": "4人ね。"}, {"t": 818.1166666666667, "x": "そう見られた。"}, {"t": 819.0, "x": "この4人のうち、\n裁判にかけられたのは、何人だと思う。"}, {"t": 822.75, "x": "……全員じゃないの。"}, {"t": 823.9166666666666, "x": "一人だ。"}, {"t": 824.8166666666667, "x": "一人。"}, {"t": 825.55, "x": "村上國治だけだ。あとの3人は、\n法廷に一度も現れていない。"}, {"t": 830.35, "x": "どうしてそんなことになるの。"}, {"t": 832.1666666666666, "x": "順番に話す。まず、捜査がどう動いたかだ。"}, {"t": 835.1833333333333, "x": "最初の数か月、捜査は完全に行き詰まっていた。"}, {"t": 838.3666666666667, "x": "別の事件の容疑で人を捕まえては、\n白鳥事件を聞く。それの繰り返しだった。"}, {"t": 843.4166666666666, "x": "人違いで逮捕したこともある。"}, {"t": 845.2333333333333, "x": "全く別の大学の学生を、北海道の学生だと思って\n捕まえて、裁判になるまで気づかなかった。"}, {"t": 851.7833333333333, "x": "……それは、ひどい。"}, {"t": 853.0166666666667, "x": "そういう捜査だった、と後に厳しく批判されている。"}, {"t": 856.1833333333333, "x": "流れが変わったのは、事件から\n4か月ほど経ったころだ。"}, {"t": 859.7, "x": "静岡県の伊東市で、一人の若い男が\n行き倒れになっているのが見つかった。"}, {"t": 864.3666666666667, "x": "警察が保護したら、白鳥事件に\n関係のある人物だと分かった。"}, {"t": 868.65, "x": "偶然じゃない。"}, {"t": 869.6833333333333, "x": "完全に偶然だ。"}, {"t": 870.95, "x": "この人物が、地下に潜っていた組織のことを\n話し始めた。そこから芋づるに逮捕が続く。"}, {"t": 876.75, "x": "捕まった人が、次の人の名前を出す。\nその人が捕まって、また次の名前を出す。"}, {"t": 882.4166666666666, "x": "……最初の一人が間違ってたら、\n全部ずれるじゃない。"}, {"t": 885.5166666666667, "x": "後で弁護側が突いたのも、まさにそこだ。"}, {"t": 888.1666666666666, "x": "そして1952年10月1日、村上國治が逮捕される。"}, {"t": 892.55, "x": "当時30歳。北海道の比布村で生まれて、\n戦争から帰ってきて、運動に入った人だ。"}, {"t": 898.4333333333333, "x": "この年の7月に、\n札幌委員会の委員長になったばかりだった。"}, {"t": 902.6, "x": "なったばかりで。"}, {"t": 903.7333333333333, "x": "なったばかりだ。"}, {"t": 904.75, "x": "彼はこの日から、17年、外に出られなくなる。"}, {"t": 908.0, "x": "そして、最後まで、自分はやっていないと言い続けた。"}, {"t": 911.9333333333333, "x": "ここで、この事件のいちばん妙なところを説明する。"}, {"t": 915.0833333333334, "x": "撃ったとされた人たちが、日本にいなくなった。"}, {"t": 918.0833333333334, "x": "いなくなった。"}, {"t": 919.1, "x": "中国に渡ったとされている。"}, {"t": 920.7666666666667, "x": "後の章で詳しく話す。"}, {"t": 922.5166666666667, "x": "結果として、起訴できたのは、その時点で\n日本の刑務所にいた人だけになった。"}, {"t": 927.4, "x": "3人だ。村上國治と、手助けをしたとされた\n村手宏光、高安知彦。"}, {"t": 932.8, "x": "撃った人は、いない。"}, {"t": 934.3166666666667, "x": "いない。"}, {"t": 934.8333333333334, "x": "裁判が始まったのは1957年だ。"}, {"t": 937.6666666666666, "x": "事件から5年経っている。"}, {"t": 939.35, "x": "実行犯とされる人物が行方不明のまま、\n指示をしたとされる人の裁判が先に始まった。"}, {"t": 945.15, "x": "それ、成立するの。"}, {"t": 946.75, "x": "法律上はできる。共謀共同正犯という\n考え方があるからだ。"}, {"t": 950.7166666666667, "x": "後の章で、ここは丁寧にやる。"}, {"t": 952.7666666666667, "x": "法廷で何が争われたか。一点だ。"}, {"t": 955.2166666666667, "x": "「共同の謀議があったかどうか」"}, {"t": 957.1333333333333, "x": "話し合いがあったかどうか。"}, {"t": 958.8166666666667, "x": "そうだ。1月の初めに、村上たちが\n集まって、白鳥警部を撃つことを決めた。"}, {"t": 963.8666666666667, "x": "検察はそう主張した。"}, {"t": 965.6, "x": "村上は、そんな会議は無いと言った。"}, {"t": 967.95, "x": "この一点で、果てしない議論が続いた。"}, {"t": 970.4666666666667, "x": "傍聴席に、毎回座っていた人がいる。"}, {"t": 973.2833333333333, "x": "誰。"}, {"t": 973.9166666666666, "x": "村上の母親だ。名前をセイという。"}, {"t": 976.3, "x": "一審と二審を通じて、公判は120回開かれた。"}, {"t": 979.8, "x": "この人は、120回、一度も休まずに\n通ったと記録されている。"}, {"t": 984.2333333333333, "x": "……120回。"}, {"t": 985.3333333333334, "x": "比布から札幌までだ。"}, {"t": 986.7333333333333, "x": "今でも汽車で2時間近くかかる。"}, {"t": 988.85, "x": "1957年5月7日、札幌地裁の判決が出る。"}, {"t": 992.95, "x": "村上國治、無期懲役。"}, {"t": 994.9666666666667, "x": "無期。"}, {"t": 995.6166666666667, "x": "村手宏光は懲役3年、執行猶予5年。"}, {"t": 998.45, "x": "高安知彦は懲役3年、執行猶予3年。"}, {"t": 1001.75, "x": "村上と村手は、その日のうちに控訴している。"}, {"t": 1005.3166666666667, "x": "ここからが、この事件の山だ。"}, {"t": 1007.3833333333333, "x": "さっき言ったとおり、物証は、\n白鳥警部の体から出た弾丸一発しか無かった。"}, {"t": 1012.4166666666666, "x": "比べる相手がいなかった。"}, {"t": 1014.1333333333333, "x": "うん。"}, {"t": 1014.6333333333333, "x": "ところが、捜査の途中で、比べる相手が出てきた。"}, {"t": 1017.8666666666667, "x": "起訴された3人のうちの一人、\n高安知彦が、こう供述した。"}, {"t": 1022.1666666666666, "x": "事件の前に、札幌の郊外で\n拳銃の試し撃ちをした、と。"}, {"t": 1026.0, "x": "場所は、幌見峠という。"}, {"t": 1027.8333333333333, "x": "山の中ね。"}, {"t": 1028.95, "x": "札幌の市街を見下ろす峠だ。冬は雪が積もる。"}, {"t": 1032.1166666666666, "x": "警察がそこを掘った。"}, {"t": 1033.4333333333334, "x": "弾丸が2発、出てきた。"}, {"t": 1035.45, "x": "……出てきたんだ。"}, {"t": 1036.5166666666667, "x": "出てきた。"}, {"t": 1037.2833333333333, "x": "これで、比べる相手ができた。"}, {"t": 1039.2, "x": "幌見峠から出た2発と、白鳥警部の体から出た\n1発。この3発が同じ銃から出たものなら、繋がる。"}, {"t": 1046.2333333333333, "x": "繋がるの。"}, {"t": 1047.1833333333334, "x": "鑑定が、割れた。"}, {"t": 1048.5333333333333, "x": "一つの鑑定は、同じ銃から\n出たとは断定できないとした。"}, {"t": 1052.2166666666667, "x": "別の鑑定は、同じ銃だという証拠は無いとした。"}, {"t": 1055.35, "x": "そして、ある大学教授の鑑定が、違う\n銃から出る確率は極めて小さいとした。"}, {"t": 1060.6, "x": "バラバラじゃない。"}, {"t": 1061.6833333333334, "x": "バラバラだ。"}, {"t": 1062.5166666666667, "x": "それだけじゃない。弁護側は、\nこの2発そのものがおかしいと言い出した。"}, {"t": 1066.65, "x": "理由を5つ挙げている。"}, {"t": 1068.05, "x": "見つかった経緯。傷や変形があるかどうか。"}, {"t": 1070.5666666666666, "x": "地面にどれだけめり込んでいたか。"}, {"t": 1072.6, "x": "そして、腐食。最後に線条痕だ。"}, {"t": 1075.3333333333333, "x": "腐食。"}, {"t": 1076.1166666666666, "x": "鉛の弾を何年も土の中に置いたら、表面が腐る。"}, {"t": 1079.5333333333333, "x": "腐食の孔ができる。"}, {"t": 1080.9666666666667, "x": "幌見峠から出た2発には、それが無かった。"}, {"t": 1083.9666666666667, "x": "……土に埋まってた割に、きれいすぎたってこと。"}, {"t": 1086.7833333333333, "x": "弁護側はそう主張した。そして、\nこの主張は裁判官を動かしている。"}, {"t": 1091.1833333333334, "x": "後の研究者は、こう書いている。"}, {"t": 1093.1, "x": "「それは裁判官をも説得しているのである」"}, {"t": 1095.7, "x": "この弾丸は、誰かが後から置いたものではないか。"}, {"t": 1098.7166666666667, "x": "そういう疑いが、法廷の中に入り込んだ。"}, {"t": 1102.0666666666666, "x": "この弾丸の話には、続きがある。"}, {"t": 1104.4333333333334, "x": "1969年3月11日、衆議院の法務委員会。"}, {"t": 1108.4333333333334, "x": "猪俣浩三という議員が、こう話している。"}, {"t": 1111.2166666666667, "x": "「科学警察研究所というところで、"}, {"t": 1113.35, "x": "十数年前に事件当時唯一の物的証拠とされている\nピストルの弾丸を鑑定している」"}, {"t": 1118.8333333333333, "x": "科学警察研究所。警察の中の、鑑定をする所ね。"}, {"t": 1122.95, "x": "そうだ。続きがこうだ。"}, {"t": 1124.5166666666667, "x": "「今度初めて、警察庁の一機関である\n科学警察研究所で、すでに\n15年前に、これは違うんだ」"}, {"t": 1130.9833333333333, "x": "「幌見峠から出た弾丸と白鳥警部のからだから\n出た弾丸とは違うんだという鑑定ができておった」"}, {"t": 1136.8666666666666, "x": "違うっていう鑑定が、あったの。"}, {"t": 1139.0333333333333, "x": "あった、とこの議員は言っている。"}, {"t": 1140.9333333333334, "x": "そしてこう続ける。「それを\n検事は出さぬのであります」"}, {"t": 1144.1833333333334, "x": "……出さなかった。"}, {"t": 1145.3166666666666, "x": "「それが今度ようやく明らかになりまして、\n再審裁判所の札幌高等裁判所が\n提出命令を出しまして」"}, {"t": 1151.65, "x": "「科学警察研究所からその鑑定書があらわれました」"}, {"t": 1155.1, "x": "裁判所が命令して、やっと出た。"}, {"t": 1157.4833333333333, "x": "そういう発言が、国会の記録に残っている。"}, {"t": 1160.3833333333334, "x": "ここは慎重に言う。これは\n議員が委員会で述べたことだ。"}, {"t": 1163.6166666666666, "x": "裁判所が「隠していた」と認定したわけではない。"}, {"t": 1166.9833333333333, "x": "でも、15年。"}, {"t": 1168.3, "x": "15年だ。"}, {"t": 1169.2, "x": "その前の年の12月、別の議員も\n法務委員会でこう言っている。"}, {"t": 1173.1833333333334, "x": "岡沢完治という議員だ。"}, {"t": 1174.65, "x": "「例のきめ手となりました弾丸鑑定書が\n偽造であったということも明らかにされておる」"}, {"t": 1179.4833333333333, "x": "これも議員の発言であって、\n判決ではない。そこは分けて聞いてほしい。"}, {"t": 1183.7, "x": "ただ、1968年から69年にかけて、国会の中では、\nこの弾丸はおかしいという話が公然と出ていた。"}, {"t": 1191.5, "x": "それでも、有罪は変わらなかったのね。"}, {"t": 1193.9833333333333, "x": "変わらなかった。"}, {"t": 1195.05, "x": "なぜ変わらなかったのか。ここを\n理解するのに、もう一つ必要な話がある。"}, {"t": 1200.25, "x": "共謀共同正犯という言葉を説明する。"}, {"t": 1203.0333333333333, "x": "さっき出てきたやつね。"}, {"t": 1204.5666666666666, "x": "漢字が並んで難しく見えるが、中身は単純だ。"}, {"t": 1207.7666666666667, "x": "何人かで話し合って、一緒にやろうと\n決める。そのうちの一人が実行する。"}, {"t": 1212.35, "x": "このとき、実行しなかった人も、正犯として扱う。"}, {"t": 1216.0833333333333, "x": "手を下していなくても、決めた側なら同じ、ってこと。"}, {"t": 1219.4666666666667, "x": "そういう扱いだ。手伝った、という軽い\n位置ではなくて、本人と同じ位置に置く。"}, {"t": 1224.3333333333333, "x": "この考え方が無いと、組織の上の人には\nいつまでも手が届かない。"}, {"t": 1228.6333333333334, "x": "それは、分かる気がする。"}, {"t": 1230.35, "x": "問題は、この事件での使われ方だ。"}, {"t": 1232.85, "x": "実行した人が、法廷にいない。"}, {"t": 1235.1333333333334, "x": "……あ。"}, {"t": 1235.6, "x": "普通なら、実行した人がまず裁かれる。"}, {"t": 1238.1666666666667, "x": "何があったかが、そこで固まる。"}, {"t": 1240.3833333333334, "x": "そのうえで、決めた人の裁判をやる。"}, {"t": 1242.6833333333334, "x": "この事件は逆だ。実行した人が\n不在のまま、決めた人だけが裁かれた。"}, {"t": 1247.6, "x": "じゃあ、何があったかは、誰が決めるの。"}, {"t": 1250.1833333333334, "x": "残った人たちの供述だ。"}, {"t": 1252.05, "x": "「あの日、あの部屋で、こう決まった」という\n話を、周りにいたとされる人たちがする。"}, {"t": 1257.2, "x": "それを積み上げて、謀議があったと認定する。"}, {"t": 1259.9833333333333, "x": "……その人たちの記憶が違ってたら。"}, {"t": 1262.3, "x": "後に研究者が、この点を正面から書いている。"}, {"t": 1265.3, "x": "組織を動かすには話し合いが要るが、\n軍事組織なら命令一つで足りる。"}, {"t": 1269.7166666666667, "x": "その命令の中身を確かめることは、\n謀議があったと証明するよりさらに難しい、と。"}, {"t": 1274.7333333333333, "x": "ここを押さえておいてほしい。"}, {"t": 1276.2, "x": "村上國治が有罪になったのは、\n「撃った」からではない。"}, {"t": 1279.6166666666666, "x": "「決めた側にいた」と認定されたからだ。"}, {"t": 1282.2333333333333, "x": "撃っていない人が、撃った\n人より先に有罪になったのね。"}, {"t": 1285.8333333333333, "x": "そして、撃ったとされた人は、\n今日まで一度も裁かれていない。"}, {"t": 1290.1666666666667, "x": "裁判の流れを、日付で追う。"}, {"t": 1292.1333333333334, "x": "1957年5月7日、札幌地裁。"}, {"t": 1295.2166666666667, "x": "村上國治に無期懲役。"}, {"t": 1297.0666666666666, "x": "控訴して、1960年5月31日、札幌高裁の判決が出る。"}, {"t": 1302.3, "x": "無期懲役が、懲役20年に下がった。"}, {"t": 1305.0833333333333, "x": "下がったんだ。"}, {"t": 1306.15, "x": "下がった。ただ、有罪であることは変わっていない。"}, {"t": 1309.1333333333334, "x": "控訴審では、弁護人の数が一気に増えている。"}, {"t": 1311.95, "x": "全国から集まってきた。"}, {"t": 1313.7, "x": "この段階で、弁護側は幌見峠の弾丸に\n集中した。さっき話した5つの論点だ。"}, {"t": 1319.2666666666667, "x": "後の研究者は、控訴審について「はじめて五分に\n近い戦いをすることができた」と書いている。"}, {"t": 1325.35, "x": "一審は、五分じゃなかったってこと。"}, {"t": 1327.7, "x": "そう書かれている。"}, {"t": 1328.7833333333333, "x": "そして上告。最高裁第一小法廷。"}, {"t": 1331.5333333333333, "x": "1963年10月17日、上告棄却。"}, {"t": 1335.3833333333334, "x": "棄却。"}, {"t": 1336.15, "x": "懲役20年が確定した。"}, {"t": 1338.0833333333333, "x": "事件が1952年1月だから、11年9か月かかっている。"}, {"t": 1342.7333333333333, "x": "村上はこの間、一度も保釈されていない。"}, {"t": 1345.4666666666667, "x": "判決が出るまでの勾留、つまり\n未決勾留だけで11年だ。"}, {"t": 1349.4333333333334, "x": "……刑が決まる前に、11年。"}, {"t": 1351.4833333333333, "x": "後に国会で、この長さが問題にされている。"}, {"t": 1354.4, "x": "1968年12月19日、衆議院法務委員会。"}, {"t": 1358.35, "x": "岡沢完治の発言だ。"}, {"t": 1360.1, "x": "「その前に11年間の未決勾留がございます」"}, {"t": 1363.1166666666666, "x": "「御承知のとおり刑は20年でございますが、"}, {"t": 1365.55, "x": "本年の5月26日をもちまして\n刑法28条にいうところの刑期の3分の1を経過し、"}, {"t": 1371.25, "x": "仮釈放の要件ができております」"}, {"t": 1373.65, "x": "もう、出られる条件は満たしてたのね。"}, {"t": 1376.0666666666666, "x": "同じ発言に、こうもある。"}, {"t": 1377.7, "x": "「未決期間を含めますとことしの10月で\n満16年の拘禁でございました」"}, {"t": 1382.4333333333334, "x": "「実質的には刑期の4分の3をすでに\n経過しておるわけであります」"}, {"t": 1386.4833333333333, "x": "ちなみに、この議員は判決の年を\n「昭和38年11月」と言っている。"}, {"t": 1391.5, "x": "実際の上告棄却は、1963年、\n昭和38年の10月17日だ。"}, {"t": 1397.1666666666667, "x": "1か月ずれている。"}, {"t": 1398.6333333333334, "x": "国会の記録も、完璧じゃないのね。"}, {"t": 1401.1666666666667, "x": "完璧じゃない。だから、日付は必ず判決の側で取る。"}, {"t": 1405.4833333333333, "x": "ここで、いなくなった人たちの話をする。"}, {"t": 1408.2666666666667, "x": "中国に渡ったっていう。"}, {"t": 1409.9333333333334, "x": "当時、日本と中国のあいだに、\n正式な行き来は無かった。"}, {"t": 1413.5166666666667, "x": "国交が無いからだ。"}, {"t": 1414.8833333333334, "x": "それでも、船で行き来する経路があった。"}, {"t": 1417.3666666666666, "x": "非公式の密航船だ。当時これを\n「人民艦隊」と呼んだ。"}, {"t": 1421.4666666666667, "x": "艦隊って言うほど大げさなものなの。"}, {"t": 1423.7, "x": "漁船に近いものだったとされている。"}, {"t": 1425.7333333333333, "x": "呼び名だけが大げさだ。"}, {"t": 1427.25, "x": "1955年3月30日、静岡県の焼津から、\n上海に向かう船が出たとされている。"}, {"t": 1433.4166666666667, "x": "その後も何度か出て、1956年3月の船が最後だった。"}, {"t": 1437.8166666666666, "x": "この事件に関係するとされた人が、あわせて\n10人、この経路で日本を離れたとされている。"}, {"t": 1443.4166666666667, "x": "10人。"}, {"t": 1444.1666666666667, "x": "そのうち、撃ったとされた人と、\nその場にいたとされた人が含まれていた。"}, {"t": 1448.5833333333333, "x": "国会にも出ている。1958年7月17日、"}, {"t": 1452.3666666666666, "x": "衆議院の海外同胞引揚及び遺家族援護に\n関する調査特別委員会だ。"}, {"t": 1457.25, "x": "中山マサという議員の発言だ。"}, {"t": 1459.35, "x": "「この人民艦隊というものは\nどうしてできたかと申しますれば」"}, {"t": 1462.9, "x": "「しかも、北海道の白鳥事件の容疑者なども、\nこれに乗って向こうへ行っているのですが」"}, {"t": 1468.15, "x": "国会で、そう言われてたんだ。"}, {"t": 1470.15, "x": "同じ日に、長谷川峻という議員も話している。"}, {"t": 1473.2166666666667, "x": "この年、白山丸という船で、\n中国から大勢が帰ってきた。"}, {"t": 1477.2666666666667, "x": "「白山丸に乗船した密出国者58名はすでに\n逮捕した。これは私も現地に参りまして、"}, {"t": 1483.2, "x": "逮捕したところを見ることができたのであります」"}, {"t": 1485.95, "x": "そのうえで、こう聞いている。"}, {"t": 1487.4, "x": "「人民艦隊だ、あるいは火炎びんの問題だ、\nそのほか白鳥事件の問題等々があるやに"}, {"t": 1492.8166666666666, "x": "私どもは拝承しております」"}, {"t": 1494.7666666666667, "x": "帰ってきた人の中に、いるかもしれないと。"}, {"t": 1497.6333333333334, "x": "そういう疑いが、国会で語られていた。"}, {"t": 1500.2, "x": "1975年4月、北海道警は、4人を国外逃亡として\n時効を止め、あらためて全国に指名手配した。"}, {"t": 1507.7, "x": "この時、時効の時計が正式に止まった。"}, {"t": 1510.4833333333333, "x": "そして、その後に日本へ帰ってきた\n人たちは、いずれも起訴されていない。"}, {"t": 1514.9666666666667, "x": "されなかったの。"}, {"t": 1516.15, "x": "されなかった。当時の弁護士は、"}, {"t": 1518.0666666666666, "x": "検察としては白鳥事件をまた\n掘り起こさずに終わらせたかったのだろう、と"}, {"t": 1522.25, "x": "語っている。"}, {"t": 1523.2, "x": "これは弁護士の見方であって、検察が\n理由を公表したわけではない。"}, {"t": 1527.8666666666666, "x": "村上國治の話に戻る。"}, {"t": 1529.7666666666667, "x": "刑が確定した後、彼は網走の刑務所に入った。"}, {"t": 1533.2, "x": "網走。"}, {"t": 1533.9833333333333, "x": "北海道の東の端だ。冬は氷点下が続く。"}, {"t": 1537.2333333333333, "x": "ここでの彼の様子も、国会に残っている。"}, {"t": 1539.9666666666667, "x": "1969年3月11日の法務委員会。"}, {"t": 1543.3, "x": "猪俣浩三は、前の年に実際に網走まで行っている。"}, {"t": 1546.9166666666667, "x": "「刑務所の担当官は村上を非常にほめておりました。"}, {"t": 1550.0333333333333, "x": "模範囚だと言っておりました」"}, {"t": 1551.9166666666667, "x": "そして、こういう事実を挙げている。"}, {"t": 1554.0166666666667, "x": "「昨年網走の刑務所では、"}, {"t": 1555.6833333333334, "x": "刑務官全員会議を開きまして、\n全部の一致した意見で村上国治は"}, {"t": 1560.0166666666667, "x": "仮釈放すべきものだという決議をいたしまして」"}, {"t": 1563.05, "x": "刑務官が、全員一致で。"}, {"t": 1565.05, "x": "そういう発言が残っている。"}, {"t": 1566.8333333333333, "x": "外の動きも大きかった。"}, {"t": 1568.3333333333333, "x": "1968年12月の岡沢完治の発言から引く。"}, {"t": 1572.4666666666667, "x": "「村上国治さんの故郷である北海道上川郡比布町長が\n身元引き受け人をみずから買って出られ」"}, {"t": 1578.4833333333333, "x": "「地元の町議会は満場一致で\n早期釈放の決議をされて、その要請書を\n当局にお出しになっておられます」"}, {"t": 1584.85, "x": "比布町だけではない。"}, {"t": 1586.0666666666666, "x": "周りの6つの町村、旭川市長、網走市長も動いた。"}, {"t": 1590.05, "x": "「網走市……30名の議員さんの中の26名までが、"}, {"t": 1593.4333333333334, "x": "早期釈放のための署名や\n要請行動に参加しておられます」"}, {"t": 1597.3166666666666, "x": "刑務所がある町の議員が。"}, {"t": 1599.0833333333333, "x": "そして全国だ。「この村上さんの早期釈放を願う\n嘆願署名が60万も集まっておる」"}, {"t": 1604.7833333333333, "x": "60万人。"}, {"t": 1605.9, "x": "この議員は、村上と同い年だった。45歳だ。"}, {"t": 1609.3166666666666, "x": "本人に会った印象を、こう述べている。"}, {"t": 1611.6166666666666, "x": "「私も白髪でありますが、村上さんは非常な"}, {"t": 1614.65, "x": "白髪になられて、からだも小さくて、\n一見60歳くらいのような肉体の現象を示しておられる」"}, {"t": 1620.6833333333334, "x": "45歳で。"}, {"t": 1621.85, "x": "16年の勾留と服役の後だ。"}, {"t": 1624.15, "x": "ただし、この動きの全部が「無実だから出せ」という\n主張だったわけではない。"}, {"t": 1628.8, "x": "仮釈放の要件は、もう満たしていた。\nそこを指摘する声も混ざっていた。"}, {"t": 1633.35, "x": "法務省の答弁は、慎重だった。"}, {"t": 1635.6166666666666, "x": "仮釈放を決めるのは地方更生保護委員会で、法務省が\n指図するものではない。そう繰り返している。"}, {"t": 1642.2, "x": "1969年11月14日、村上國治は仮釈放された。"}, {"t": 1647.15, "x": "出られたんだ。"}, {"t": 1648.1666666666667, "x": "出られた。刑期を43パーセント残しての釈放だった。"}, {"t": 1651.8166666666666, "x": "逮捕された日から数えると、外に\n出られなかったのは17年と45日だ。"}, {"t": 1656.7333333333333, "x": "17年。"}, {"t": 1657.6833333333334, "x": "この釈放が、どれくらい異例だったか。"}, {"t": 1660.0833333333333, "x": "後の国会に、その答えがある。"}, {"t": 1662.05, "x": "1975年2月25日、衆議院法務委員会。"}, {"t": 1665.8666666666666, "x": "青柳盛雄という議員の発言だ。"}, {"t": 1668.1, "x": "「北海道の白鳥事件の村上国治君などは\n一審無期懲役、二審20年の刑になって」"}, {"t": 1673.8333333333333, "x": "「14年ぐらい刑をつとめまして、たしか"}, {"t": 1676.35, "x": "5、6年の仮出獄を認められていま\n釈放されておりますけれども」"}, {"t": 1680.3666666666666, "x": "「これは非常に異例な部類でありまして」"}, {"t": 1682.6666666666667, "x": "異例。"}, {"t": 1683.2666666666667, "x": "この議員が問題にしていたのは、別のことだ。"}, {"t": 1686.15, "x": "無実を主張し続ける人は、反省していないと\n見なされて、仮釈放が下りにくい。"}, {"t": 1691.1833333333334, "x": "彼はそれを、おかしいと言っている。"}, {"t": 1693.15, "x": "「罪を犯したことがないという確信に燃えている\n人に、改悛の情があるかないかなんということを」"}, {"t": 1698.5833333333333, "x": "「事実を認めるか認めないかに\nよって判定するということこそが、\n一方的な官僚的な考え方ではないか」"}, {"t": 1705.2166666666667, "x": "やってないと言い続けると、出られなくなる。"}, {"t": 1707.85, "x": "そういう構造の話だ。"}, {"t": 1709.4166666666667, "x": "村上は、出た後も無実を主張し続けた。"}, {"t": 1712.2833333333333, "x": "そして、再審を求め続けた。"}, {"t": 1714.4666666666667, "x": "ただ、その扉は開かない。"}, {"t": 1716.3833333333334, "x": "1969年6月18日、札幌高裁が再審請求を棄却。"}, {"t": 1721.4833333333333, "x": "1971年7月17日、異議申立ても棄却。"}, {"t": 1725.7, "x": "残ったのは、最高裁への特別抗告だけになった。"}, {"t": 1729.25, "x": "最後の一手ね。"}, {"t": 1730.4833333333333, "x": "最後の一手だ。"}, {"t": 1731.5833333333333, "x": "1975年2月と3月、衆議院法務委員会には「\n白鳥事件の再審に関する陳情書」が届いている。"}, {"t": 1739.1, "x": "会議録の頭の、事務的な\n一覧のところに、そう記されている。"}, {"t": 1743.2166666666667, "x": "決定が出る直前まで、国会に紙が届いていた。"}, {"t": 1747.1, "x": "1975年5月20日。"}, {"t": 1749.45, "x": "最高裁第一小法廷が、特別抗告を棄却した。"}, {"t": 1753.1666666666667, "x": "……負けたのね。"}, {"t": 1754.1833333333334, "x": "負けた。村上國治の有罪は、動かなかった。"}, {"t": 1757.35, "x": "ところが、この棄却の決定が、\n日本の刑事裁判を大きく変えることになる。"}, {"t": 1762.1333333333334, "x": "棄却なのに。"}, {"t": 1763.2333333333333, "x": "棄却なのに、だ。"}, {"t": 1764.5333333333333, "x": "決定の中で、最高裁は\n再審についての考え方を述べた。"}, {"t": 1768.4666666666667, "x": "それまで、再審の扉は\n「開かずの門」と呼ばれていた。"}, {"t": 1772.2833333333333, "x": "ほとんど開かなかったってこと。"}, {"t": 1774.3333333333333, "x": "ほとんど開かなかった。"}, {"t": 1775.7, "x": "真犯人が名乗り出るくらいのことが無いと、\n動かない。そういう運用だった。"}, {"t": 1780.2333333333333, "x": "この決定は、そこに二つのことを書いた。"}, {"t": 1782.9166666666667, "x": "一つ。新しく出てきた証拠だけを見るのではなく、\n前からある証拠と合わせて、全体で見直す。"}, {"t": 1788.8833333333334, "x": "二つ。「疑わしいときは被告人の利益に」という\n刑事裁判の鉄則は、再審にも当てはまる。"}, {"t": 1794.95, "x": "……有罪を確定させるときのルールを、\nやり直しの入口にも使う。"}, {"t": 1798.9166666666667, "x": "そういうことだ。"}, {"t": 1799.9, "x": "確定した判決の事実認定に、合理的な疑いが\n出るところまでいけば、再審を始めてよい。"}, {"t": 1805.8833333333334, "x": "この論旨が、後に「白鳥決定」と\n呼ばれるようになった。"}, {"t": 1809.6166666666666, "x": "ここは、はっきりさせておきたい。"}, {"t": 1811.5833333333333, "x": "「白鳥決定」と呼ばれているのは、村上の抗告を\n棄却した決定の本文全部ではない。"}, {"t": 1817.0666666666666, "x": "その中の、この考え方を示した部分を指している。"}, {"t": 1820.5166666666667, "x": "村上さん自身は、救われていないのね。"}, {"t": 1823.2333333333333, "x": "救われていない。"}, {"t": 1824.2666666666667, "x": "ただ、この決定は、幌見峠の弾丸について、\nこういう言い方をしている。"}, {"t": 1828.8, "x": "証拠の弾丸について、第三者の作為、\nつまり誰かが手を加えたことや、"}, {"t": 1833.15, "x": "不公正な捜査が入り込んだという\n疑いが生じうることも、否定しがたい。"}, {"t": 1837.6666666666667, "x": "……疑いは、あると言ってる。"}, {"t": 1839.4, "x": "そう読める。それでも、有罪はひっくり返らなかった。"}, {"t": 1842.7, "x": "そして翌1976年、財田川事件で\n同じ考え方が繰り返される。"}, {"t": 1847.7833333333333, "x": "ここから、免田事件、財田川事件、松山事件、\n島田事件と、死刑囚の再審が次々に開き始める。"}, {"t": 1855.0333333333333, "x": "開かずの門が、開いた。"}, {"t": 1856.9833333333333, "x": "自分は開かなかった扉を、\n他の人のために開けたのね。"}, {"t": 1860.7666666666667, "x": "結果としては、そうなった。"}, {"t": 1863.2, "x": "この事件には、二つの見方が、今も並んで残っている。"}, {"t": 1866.85, "x": "どちらが正しいかは、ここでは\n決めない。両方を並べる。"}, {"t": 1870.3666666666666, "x": "うん。"}, {"t": 1870.8833333333334, "x": "一つ目。これは作られた事件だ、という見方だ。"}, {"t": 1874.0666666666666, "x": "根拠として挙げられるのは、主に5つだ。"}, {"t": 1876.65, "x": "撃ったとされる人の身柄が\n一度も確保されていないこと。"}, {"t": 1879.95, "x": "拳銃も自転車も見つかっていないこと。"}, {"t": 1882.3166666666666, "x": "別の容疑で捕まえて本件を聞く、という\n捜査が積み重なっていること。"}, {"t": 1886.6333333333334, "x": "重要な証言の多くが、長い\n勾留の後に出てきていること。"}, {"t": 1890.3166666666666, "x": "そして、唯一の物証とされた幌見峠の弾丸に、\n偽造の疑いが持たれていること。"}, {"t": 1895.6833333333334, "x": "最後のは、裁判所も認めかけてたやつね。"}, {"t": 1898.6166666666666, "x": "そうだ。研究者はこう書いている。"}, {"t": 1900.55, "x": "「裁判所すら認識している」"}, {"t": 1902.4666666666667, "x": "二つ目。組織が関わったこと\n自体はあった、という見方だ。"}, {"t": 1906.3166666666666, "x": "これを言っているのは、意外な人たちでもある。"}, {"t": 1909.0833333333333, "x": "意外。"}, {"t": 1909.7333333333333, "x": "村上の弁護を担っていた弁護士の一人、岡林辰雄だ。"}, {"t": 1913.5, "x": "1960年代の終わりに、彼は\nこう語ったと記録されている。"}, {"t": 1917.65, "x": "「幌見峠で発見されたという\n弾丸はまぎれもなく偽造証拠だが」"}, {"t": 1921.5333333333333, "x": "「あの場所で彼の指示の下、党員による\n射撃演習が行われたことは疑いのない事実だ」"}, {"t": 1927.0333333333333, "x": "……弾は偽物だけど、練習はあった。"}, {"t": 1929.5333333333333, "x": "幌見峠からは、弾丸のほかに、\n手製の手榴弾の一部も見つかっている。"}, {"t": 1934.0666666666666, "x": "そちらは、偽造だとは言われていない。"}, {"t": 1936.1833333333334, "x": "この事件を長く調べてきた\n研究者も、最後にこう書いている。"}, {"t": 1940.0166666666667, "x": "火器を使った軍事訓練が実際にあったという\n事実の重みは、弾丸の偽造問題を超えて大きい、と。"}, {"t": 1946.0333333333333, "x": "この人は、もともと冤罪だと信じていた側だ。"}, {"t": 1949.2, "x": "……調べた結果、変わったのね。"}, {"t": 1951.25, "x": "変わった、と自分で書いている。"}, {"t": 1953.1166666666666, "x": "この二つは、矛盾していない。"}, {"t": 1955.05, "x": "弾丸が作られたことと、事件が\n起きたことは、別の問題として残る。"}, {"t": 1959.6166666666666, "x": "作られた証拠で有罪にしてよいか、というのが\n一つ目の問い。"}, {"t": 1963.2333333333333, "x": "では本当は何があったのか、というのが\n二つ目の問いだ。"}, {"t": 1966.7333333333333, "x": "二つ目は、まだ答えが出ていない。"}, {"t": 1968.9833333333333, "x": "出ていない。"}, {"t": 1970.3666666666666, "x": "最初の話に戻る。"}, {"t": 1971.8333333333333, "x": "逮捕状だ。"}, {"t": 1972.7166666666667, "x": "出ているのは2通。片方は、元ポンプ職人の佐藤博。\nもう片方は、元北海道大学の学生、鶴田倫也。"}, {"t": 1980.2833333333333, "x": "撃ったとされている人たち。"}, {"t": 1982.05, "x": "そうされている。ただ、繰り返すが、\nこの2人は起訴されていない。"}, {"t": 1985.9166666666667, "x": "逮捕状が出ているというのは、\n疑いをかけられているというだけで、\n有罪でも無罪でもない。"}, {"t": 1991.0666666666666, "x": "裁判が一度も開かれていない以上、この2人が\n撃ったかどうかは、決まっていない。"}, {"t": 1995.85, "x": "決まっていないまま、逮捕状だけ生きてるのね。"}, {"t": 1998.7333333333333, "x": "生きている。"}, {"t": 1999.5, "x": "半年ごとの更新が、ずっと続いている。"}, {"t": 2002.15, "x": "2012年に日本経済新聞が数えたときは、\n鶴田の逮捕状が約140回、佐藤が約160回だった。"}, {"t": 2009.5166666666667, "x": "その10年後、2022年3月の時点では、\n鶴田が161回、佐藤が180回になっていた。"}, {"t": 2016.5, "x": "まだ増えてるんだ。"}, {"t": 2017.7333333333333, "x": "増えている。"}, {"t": 2018.5, "x": "2人とも、存命なら90代だ。"}, {"t": 2020.8166666666666, "x": "2002年、警察庁は中国の公安当局に確認を求めた。"}, {"t": 2024.9333333333334, "x": "佐藤は亡くなっていて、鶴田は\n北京にいる、という情報はあった。"}, {"t": 2028.7, "x": "ただ、当局からの確認は取れなかった。"}, {"t": 2031.4666666666667, "x": "確認が取れないと、どうなるの。"}, {"t": 2033.6166666666666, "x": "死亡が確定しないから、事件を終わらせられない。"}, {"t": 2036.55, "x": "だから更新する。北海道警はこう言っている。"}, {"t": 2039.4333333333334, "x": "「常識的に考え生きている可能性がある限り」"}, {"t": 2042.4833333333333, "x": "……それ、いつまで。"}, {"t": 2043.7333333333333, "x": "誰にも言えない。"}, {"t": 2044.7666666666667, "x": "ちなみに、事件を最初に長く追いかけた\n本は、こういう書き出しで始まっている。"}, {"t": 2049.4666666666667, "x": "北海道警察本部の上の階の書庫に、60年を\n超えて執行を待ち続けている逮捕状がある、と。"}, {"t": 2055.6666666666665, "x": "それが書かれたのが2012年だ。"}, {"t": 2057.866666666667, "x": "あれから、また14年経っている。"}, {"t": 2060.5666666666666, "x": "最後に、整理しておく。"}, {"t": 2062.1666666666665, "x": "1952年1月21日の夜、札幌で、\n警察官の白鳥一雄が撃たれて亡くなった。"}, {"t": 2068.5333333333333, "x": "拳銃も、犯人が乗っていたとされる\n自転車も、今日まで見つかっていない。"}, {"t": 2072.866666666667, "x": "起訴されたのは3人。いずれも、\n撃ったとされた人ではない。"}, {"t": 2076.4, "x": "1957年、村上國治に無期懲役。"}, {"t": 2079.5333333333333, "x": "1960年に懲役20年。"}, {"t": 2081.883333333333, "x": "1963年10月17日に確定した。"}, {"t": 2085.5333333333333, "x": "罪の形は、組織の責任者として、\n共に決めた側にいたという認定だ。"}, {"t": 2090.383333333333, "x": "唯一の物証とされた幌見峠の弾丸には、\n偽造の疑いが残ったままだ。"}, {"t": 2095.0666666666666, "x": "村上は1969年11月14日に仮釈放された。"}, {"t": 2099.2833333333333, "x": "外に出られなかったのは17年と45日。"}, {"t": 2102.4, "x": "無実の主張は、最後まで変えなかった。"}, {"t": 2104.7833333333333, "x": "1994年に亡くなっている。"}, {"t": 2107.266666666667, "x": "1975年5月20日、最高裁は特別抗告を棄却した。"}, {"t": 2112.0333333333333, "x": "その決定の中で示された「\n疑わしいときは被告人の利益に」という\n考え方が、白鳥決定と呼ばれている。"}, {"t": 2119.05, "x": "これが、後の再審の扉を開けた。"}, {"t": 2121.4, "x": "そして、撃ったとされた2人の逮捕状は、\nいまも半年ごとに書き換えられている。"}, {"t": 2126.3166666666666, "x": "……74年たって、まだ誰が\n撃ったかは決まっていないのね。"}, {"t": 2129.9, "x": "決まっていない。"}, {"t": 2130.85, "x": "この事件には、大きな話が\nたくさん付いている。だが、それを言い始めると、"}, {"t": 2135.3333333333335, "x": "必ず元の一点から離れていく。"}, {"t": 2137.7, "x": "1月の夜に、家に帰る途中の人が\n一人、後ろから撃たれた。"}, {"t": 2141.85, "x": "それを誰がやったかが、74年間、決まっていない。"}, {"t": 2145.1833333333334, "x": "この回で扱ったのは、1952年から1975年までの話だ。"}, {"t": 2150.4666666666667, "x": "いまの政党や、いまそこにいる\n人たちの話ではない。そこは混ぜないでほしい。"}, {"t": 2155.016666666667, "x": "出典を挙げておく。"}, {"t": 2156.3, "x": "事件の詳細と当時の札幌の状況は、\n国立国会図書館の国会会議録検索システムから、"}, {"t": 2162.3333333333335, "x": "1952年2月25日、\n衆議院行政監察特別委員会の調査報告。"}, {"t": 2168.1, "x": "時代の背景は、1952年3月27日の参議院本会議と、\n1953年3月5日の衆議院地方行政委員会。"}, {"t": 2176.766666666667, "x": "中国へ渡ったとされる経緯は、\n1958年7月17日の衆議院、"}, {"t": 2181.7833333333333, "x": "海外同胞引揚及び遺家族援護に\n関する調査特別委員会。"}, {"t": 2185.9, "x": "弾丸の鑑定と再審、仮釈放については、\n1968年12月19日、1969年3月11日、"}, {"t": 2194.0666666666666, "x": "1975年2月25日の衆議院法務委員会。"}, {"t": 2198.0, "x": "裁判の日付と判決の中身は、\n小樽商科大学の紀要「商学討究」\n第64巻に載っているシンポジウムの記録。"}, {"t": 2205.4166666666665, "x": "逮捕状の更新回数は、\n日本経済新聞の2012年と2022年の記事だ。"}, {"t": 2210.9166666666665, "x": "最後に、一つだけ。"}, {"t": 2212.45, "x": "この事件で有罪になった人は、撃っていない側だった。"}, {"t": 2215.8, "x": "撃ったとされた人は、一度も法廷に立っていない。"}, {"t": 2218.766666666667, "x": "そして、有罪が動かなかったその決定が、\n他の人たちのやり直しの道を作った。"}, {"t": 2224.0833333333335, "x": "噛み合っていない。ずっと噛み合っていない。"}, {"t": 2226.5, "x": "……終わっていないのね。"}, {"t": 2227.7833333333333, "x": "終わっていない。半年ごとに、\n紙が書き換えられている限りは。"}, {"t": 2231.4666666666667, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
