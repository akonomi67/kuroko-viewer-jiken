<script>
const D={"name": "高羽奈美子さん事件", "file": "085_編集用", "dur": 2106.41665625, "segs": [], "subs": [{"t": 0.0, "x": "2014年11月13日。"}, {"t": 2.283333333333333, "x": "本当なら、この日で終わっているはずだった\n事件がある。"}, {"t": 5.55, "x": "終わっている、というのは。"}, {"t": 7.15, "x": "時効だ。"}, {"t": 7.883333333333334, "x": "その日を過ぎたら、もう誰も起訴できなくなる。"}, {"t": 10.666666666666666, "x": "犯人が分かっても、捕まえられない。"}, {"t": 12.966666666666667, "x": "1999年11月13日、名古屋市西区のアパートで、\n主婦の高羽奈美子さんが亡くなった。当時32歳。"}, {"t": 20.766666666666666, "x": "当時の法律では、殺人の公訴時効は15年だった。"}, {"t": 24.3, "x": "15年後が、2014年11月13日だ。"}, {"t": 27.766666666666666, "x": "じゃあ、その日で打ち切りだったのね。"}, {"t": 29.983333333333334, "x": "ところが、2014年は来なかった。"}, {"t": 32.4, "x": "正確に言うと、2014年11月13日は来たが、\n時効は来なかった。"}, {"t": 37.333333333333336, "x": "その4年半前に、時効そのものが\n法律から消えていたからだ。"}, {"t": 41.3, "x": "……消えた？"}, {"t": 42.05, "x": "2010年4月27日。"}, {"t": 44.15, "x": "殺人の公訴時効を廃止する法律が、\nその日に成立して、その日に施行された。"}, {"t": 49.38333333333333, "x": "そして、その法律を求めて動いていた\n遺族の会に、この事件の夫が入っていた。"}, {"t": 54.61666666666667, "x": "自分の事件の時効を、自分で消したってこと。"}, {"t": 57.6, "x": "結果として、そうなった。"}, {"t": 59.35, "x": "2025年10月31日、事件から\n26年後に、69歳の女性が逮捕された。"}, {"t": 65.56666666666666, "x": "今回追っていくのは、この26年だ。"}, {"t": 68.15, "x": "先に断っておく。"}, {"t": 69.5, "x": "この事件は、いま裁判の途中だ。"}, {"t": 71.61666666666666, "x": "判決はまだ出ていない。"}, {"t": 73.16666666666667, "x": "だから私は、起訴された人を「犯人」とは呼ばない。"}, {"t": 76.61666666666666, "x": "「起訴された」「検察はこう主張している」\n「弁護側はこう述べている」、その形でしか話さない。"}, {"t": 82.31666666666666, "x": "それと、亡くなったときの様子は話さない。"}, {"t": 84.95, "x": "ご遺族が26年間、公の場で\n呼びかけ続けてきた事件だ。そこは崩さない。"}, {"t": 90.75, "x": "1999年、平成11年11月13日。"}, {"t": 94.71666666666667, "x": "土曜日だった。"}, {"t": 95.71666666666667, "x": "場所は、名古屋市西区稲生町5丁目。"}, {"t": 98.33333333333333, "x": "いのうちょう、と読むのね。"}, {"t": 99.95, "x": "そうだ。名古屋駅から北へ、\n車で15分ほどの住宅地だ。"}, {"t": 103.85, "x": "そこに、加藤コーポという2階建てのアパートがあった。"}, {"t": 106.93333333333334, "x": "その201号室に、高羽奈美子さんが住んでいた。"}, {"t": 110.2, "x": "夫の高羽悟さんと、当時2歳の長男との3人暮らしだ。"}, {"t": 114.2, "x": "この日、悟さんは仕事で出ていた。"}, {"t": 116.55, "x": "犯行があったのは、正午から\n午後1時ごろまでの間とみられている。"}, {"t": 120.41666666666667, "x": "午後2時ごろ、アパートの大家が部屋を訪ねて、\n奈美子さんが倒れているのを見つけた。"}, {"t": 125.26666666666667, "x": "首などを刃物で複数回刺されていて、\n死因は失血死だった。"}, {"t": 129.18333333333334, "x": "様子については、ここまでにする。"}, {"t": 131.38333333333333, "x": "ええ。"}, {"t": 131.9, "x": "長男は部屋にいたが、けがはなかった。"}, {"t": 134.26666666666668, "x": "この子については、これ以上話さない。"}, {"t": 136.58333333333334, "x": "悟さんは、奈美子さんの知り合いから\n連絡を受けて駆けつけている。"}, {"t": 140.41666666666666, "x": "伝えられたのは、奥さんが\n倒れている、という内容だった。"}, {"t": 143.91666666666666, "x": "本人はのちに、最初は病気で\n倒れたのだと思っていた、と語っている。"}, {"t": 148.25, "x": "首を刺されていたと知ったのは、\n警察関係者から聞いたあとだった。"}, {"t": 152.36666666666667, "x": "……何も分からないまま呼ばれたのね。"}, {"t": 154.45, "x": "この日は土曜日で、悟さんは仕事先にいた。"}, {"t": 157.4, "x": "家を出たときには、何も変わったことはなかった。"}, {"t": 160.33333333333334, "x": "奈美子さんは32歳。"}, {"t": 161.75, "x": "結婚して、子どもが生まれて、まだ数年という時期だ。"}, {"t": 165.23333333333332, "x": "その日の午前中までは、ごく普通の土曜日だった。"}, {"t": 168.33333333333334, "x": "そして午後、全部が変わった。"}, {"t": 170.26666666666668, "x": "事件を扱ったのは、愛知県警の西警察署だ。"}, {"t": 173.56666666666666, "x": "この署の名前は、26年後にもう一度出てくる。"}, {"t": 176.81666666666666, "x": "……同じ場所に戻ってくるのね。"}, {"t": 178.73333333333332, "x": "戻ってくる。"}, {"t": 180.25, "x": "ここから、捜査の話をする。"}, {"t": 182.26666666666668, "x": "この事件には、最初から物証があった。"}, {"t": 184.81666666666666, "x": "血痕だ。"}, {"t": 185.75, "x": "現場に残っていたの。"}, {"t": 187.3, "x": "現場だけじゃない。"}, {"t": 188.36666666666667, "x": "現場から北東の方角へ、およそ500\nメートルにわたって、点々と続いていた。"}, {"t": 193.35, "x": "500メートル。"}, {"t": 194.45, "x": "つまり、この事件をやった人物は、現場から\n500メートル、血を落としながら歩いている。"}, {"t": 199.65, "x": "そして、その血は\n奈美子さんのものではないとみられた。"}, {"t": 202.91666666666666, "x": "じゃあ、相手が自分でけがをしたってこと。"}, {"t": 205.45, "x": "警察はそう見た。"}, {"t": 206.66666666666666, "x": "手にけがをしている女性を\n探す、という捜査方針になっている。"}, {"t": 210.31666666666666, "x": "さらに、血を洗い流したとみられる跡が2か所あった。"}, {"t": 213.46666666666667, "x": "部屋の洗面所と、近くにある\n稲生公園の手洗い場の付近だ。"}, {"t": 217.21666666666667, "x": "現場には、飲みかけの乳酸菌飲料も残されていた。"}, {"t": 220.68333333333334, "x": "ずいぶん残していったのね。"}, {"t": 222.43333333333334, "x": "物としては残った。"}, {"t": 223.83333333333334, "x": "ただし、当時の技術では、そこから個人を\n特定するところまでは行けなかった。"}, {"t": 228.53333333333333, "x": "血痕は、保管されることになる。"}, {"t": 230.68333333333334, "x": "この「保管された」というのが、26年後に効いてくる。"}, {"t": 234.5, "x": "取っておいただけ、なのよね。当時は。"}, {"t": 237.0, "x": "当時はそうだ。"}, {"t": 238.0, "x": "1999年というのは、DNA型鑑定が捜査に\n使われ始めて、まだ日の浅い時期だった。"}, {"t": 244.5, "x": "いまのように、細かく型を\n読み分けられる技術ではない。"}, {"t": 247.68333333333334, "x": "警察が公表した人物像も、血液型が\nB型、という段階で止まっている。"}, {"t": 252.78333333333333, "x": "B型だけだと、絞れないものね。"}, {"t": 255.11666666666667, "x": "B型というだけでは、対象は何万人も残る。"}, {"t": 258.1333333333333, "x": "だから、この事件で当時できたのは、\n候補を挙げて、一人ずつ消していく作業だった。"}, {"t": 263.21666666666664, "x": "血痕そのものが名前を教えてくれるのは、\nずっとあとの話になる。"}, {"t": 267.8, "x": "警察が描いた人物像を並べておく。"}, {"t": 270.25, "x": "女性。"}, {"t": 270.81666666666666, "x": "当時、40歳から55歳くらい。"}, {"t": 273.23333333333335, "x": "身長はおよそ160センチ。"}, {"t": 275.23333333333335, "x": "血液型はB型。"}, {"t": 276.68333333333334, "x": "そして、履いていた靴が分かっていた。"}, {"t": 279.1333333333333, "x": "靴まで。"}, {"t": 279.98333333333335, "x": "かかとの高い、24センチの婦人靴。"}, {"t": 282.68333333333334, "x": "韓国製の、量販店で売られているものだった。"}, {"t": 285.76666666666665, "x": "そこまで分かっていて、26年。"}, {"t": 288.1, "x": "捜査は小さくなかった。"}, {"t": 289.6666666666667, "x": "投入された捜査員は、のべ10万人以上。"}, {"t": 292.4, "x": "事情を聴いた相手は、5000人を超えている。"}, {"t": 294.93333333333334, "x": "それでも、届かなかった。"}, {"t": 296.65, "x": "ここが、この事件の難しいところだ。"}, {"t": 299.0833333333333, "x": "手がかりが無かったわけじゃない。"}, {"t": 300.81666666666666, "x": "手がかりはあるのに、名前に結びつかない。"}, {"t": 303.35, "x": "血痕があっても、比べる相手が\n分からなければ、それはただの染みだ。"}, {"t": 307.55, "x": "照合する先がないのね。"}, {"t": 309.31666666666666, "x": "そうだ。"}, {"t": 309.95, "x": "捜査の形としては、絞り込み型になる。"}, {"t": 312.75, "x": "奈美子さんと面識がありそうな人を\n洗い出して、一人ずつ当たっていく。"}, {"t": 316.93333333333334, "x": "知人、近所の人、夫の関係者。"}, {"t": 319.51666666666665, "x": "名簿を作って、端から消していく作業だ。"}, {"t": 322.31666666666666, "x": "気の遠くなる話ね。"}, {"t": 323.93333333333334, "x": "しかも、当時の警察が探していたのは「手に\nけがをしている40代から50代の女性」だ。"}, {"t": 329.65, "x": "けがは、何年かすれば治る。"}, {"t": 331.55, "x": "靴も、捨てられれば残らない。"}, {"t": 333.53333333333336, "x": "時間がたつほど、外から見て\n分かる手がかりは消えていく。"}, {"t": 336.96666666666664, "x": "残るのは、保管された血痕だけだった。"}, {"t": 339.6166666666667, "x": "そして、その染みを何年持っていられるかを\n決めるのが、時効という制度だった。"}, {"t": 344.85, "x": "ここで、夫の高羽悟さんの話をする。"}, {"t": 347.68333333333334, "x": "1956年生まれ。名古屋市港区の出身だ。"}, {"t": 351.28333333333336, "x": "悟さんは、事件のあと、あの201号室を借り続けた。"}, {"t": 355.26666666666665, "x": "……現場の部屋を？"}, {"t": 356.3833333333333, "x": "現場の部屋だ。"}, {"t": 357.46666666666664, "x": "自分で契約して、自分で家賃を払い続けた。"}, {"t": 360.5833333333333, "x": "報道では、支払った家賃は\nおよそ2200万円と伝えられている。"}, {"t": 364.85, "x": "2200万円。"}, {"t": 366.21666666666664, "x": "25年を超えて借り続けた計算になる。"}, {"t": 368.8333333333333, "x": "なぜそこまでするのか。"}, {"t": 370.26666666666665, "x": "本人はこう語っている。"}, {"t": 371.8, "x": "「自分が奈美子にしてあげられるのは、\n何だろうと考える日々だった」"}, {"t": 375.8, "x": "……それが、部屋を残すことだったのね。"}, {"t": 378.23333333333335, "x": "理由はもう一つあった。"}, {"t": 379.73333333333335, "x": "部屋には、血痕が残っていた。"}, {"t": 381.8, "x": "鑑定の技術はこの先も上がっていく。"}, {"t": 384.1333333333333, "x": "だから、現場をそのまま置いておけば、\nいつか読み取れるかもしれない。"}, {"t": 388.01666666666665, "x": "時効が撤廃されたあとも、悟さんは「\nもう少し持っていたほうがいいか」と\n考えて、契約を続けている。"}, {"t": 394.6, "x": "警察じゃなくて、遺族が現場を保存してたのね。"}, {"t": 397.78333333333336, "x": "そういうことになる。"}, {"t": 398.95, "x": "この判断が正しかったのかどうかは、私には言えない。"}, {"t": 402.28333333333336, "x": "ただ、事実として、26年のあいだ、\nその部屋は残っていた。"}, {"t": 406.6166666666667, "x": "家賃を払い続けるって、毎月続くのよね。"}, {"t": 409.7, "x": "毎月だ。"}, {"t": 410.55, "x": "1年でも、5年でもない。"}, {"t": 412.3333333333333, "x": "事件が解決するかどうか分からないまま、\n25年を超えて払い続けた。"}, {"t": 416.81666666666666, "x": "しかも悟さんは、その部屋の外でも動いている。"}, {"t": 419.8833333333333, "x": "取材を受け、テレビに出て、\n事件を忘れさせないようにした。"}, {"t": 423.48333333333335, "x": "東海テレビは、逮捕の背景をこう表現している。"}, {"t": 426.5, "x": "急展開の背景にあった、夫の執念、と。"}, {"t": 429.65, "x": "……26年分の執念ね。"}, {"t": 431.55, "x": "ここで一つ、はっきりさせておきたいことがある。"}, {"t": 434.4166666666667, "x": "悟さんがやっていたのは、犯人捜しではない。"}, {"t": 437.31666666666666, "x": "誰かを名指ししたことは、一度も無い。"}, {"t": 439.71666666666664, "x": "やっていたのは、情報を\n求めることと、制度を変えることだ。"}, {"t": 443.3666666666667, "x": "そのうちの一つが、時効の話になる。"}, {"t": 446.6, "x": "ここから制度の話に入る。"}, {"t": 448.45, "x": "この事件を理解するには、そこを外せない。"}, {"t": 451.0833333333333, "x": "公訴時効というのは、犯罪が終わったときから\n一定の期間が過ぎると、検察官が\n起訴できなくなる制度だ。"}, {"t": 457.65, "x": "捕まえても裁けなくなるのね。"}, {"t": 459.73333333333335, "x": "正確には、起訴という手続きができなくなる。"}, {"t": 462.5833333333333, "x": "1999年の時点で、殺人の公訴時効は15年だった。"}, {"t": 467.05, "x": "つまり、この事件の期限は2014年11月13日。"}, {"t": 470.8666666666667, "x": "ここで、少しややこしい話をする。"}, {"t": 473.2, "x": "2004年、平成16年に、\n刑事訴訟法が改正されている。"}, {"t": 477.25, "x": "殺人の時効が、15年から25年に延ばされた。"}, {"t": 480.8, "x": "じゃあ25年になったんじゃないの。"}, {"t": 482.8833333333333, "x": "ならなかった。"}, {"t": 483.8666666666667, "x": "施行は2005年1月1日で、\nこの改正には附則が付いていた。"}, {"t": 488.06666666666666, "x": "「この法律の施行前に犯した\n罪の公訴時効の期間については、\nなお従前の例による」"}, {"t": 493.4, "x": "前のまま、ってことかしら。"}, {"t": 495.21666666666664, "x": "そうだ。"}, {"t": 495.8333333333333, "x": "1999年の事件は、2005年より前だ。"}, {"t": 499.3833333333333, "x": "だから15年のまま、動かなかった。"}, {"t": 501.8, "x": "延長された25年は、この事件には届かなかった。"}, {"t": 505.1666666666667, "x": "期限は2014年11月13日のまま残った。"}, {"t": 508.6166666666667, "x": "残り時間は、あと10年を切っていた。"}, {"t": 511.15, "x": "延長されたのに、\n届かないっていうのは、変な感じね。"}, {"t": 514.7333333333333, "x": "法律を変えるときの原則だ。"}, {"t": 516.6666666666666, "x": "あとから重くした決まりを、昔の行為に当てはめない。"}, {"t": 519.8833333333333, "x": "2004年の改正は、その原則を守った。"}, {"t": 522.7666666666667, "x": "この附則については、のちに\n国会でも取り上げられている。"}, {"t": 526.1666666666666, "x": "日弁連の参考人が、2010年の法案を\n批判するときに、この2004年の例を持ち出した。"}, {"t": 532.15, "x": "前の改正ではちゃんと遡及を外したのに、\n今回はなぜ外さないのか、という形だ。"}, {"t": 537.4333333333333, "x": "……そこが争点になったのね。"}, {"t": 539.2666666666667, "x": "そうだ。"}, {"t": 539.9, "x": "そしてこの一点が、\n高羽さんの事件の運命を分けることになる。"}, {"t": 543.7666666666667, "x": "2004年の改正のやり方なら、期限は2014年のまま。"}, {"t": 547.6333333333333, "x": "2010年の改正のやり方なら、期限は消える。"}, {"t": 550.7166666666667, "x": "同じ国会が、6年違いで逆の判断をした。"}, {"t": 554.5, "x": "ここで一度、逆から考える。"}, {"t": 556.5333333333333, "x": "そもそも、なぜ時効があるのか。"}, {"t": 558.7, "x": "言われてみれば、考えたことなかったわね。"}, {"t": 561.35, "x": "これについては、国会でちゃんと説明が残っている。"}, {"t": 564.4833333333333, "x": "2010年4月23日、衆議院の法務委員会だ。"}, {"t": 568.0833333333334, "x": "この日、時効の法案について、\n4人の参考人が呼ばれている。"}, {"t": 572.0166666666667, "x": "一人目は、東京大学大学院教授の大澤裕参考人。"}, {"t": 575.8, "x": "刑事訴訟法の研究者だ。"}, {"t": 577.7, "x": "大澤裕参考人は、時効の理由を3つに整理している。"}, {"t": 581.3666666666667, "x": "一つ目。「時の経過とともに、\n証拠が散逸してしまい、起訴して\n正しい裁判を行うことが困難になる」"}, {"t": 587.8333333333334, "x": "二つ目。「時の経過とともに、\n社会一般の処罰感情等が希薄化する」"}, {"t": 592.5333333333333, "x": "三つ目が、事実状態の尊重。"}, {"t": 594.95, "x": "最後のは、どういう意味かしら。"}, {"t": 596.9333333333333, "x": "長く続いた状態は、そのまま認めようという考え方だ。"}, {"t": 600.6166666666667, "x": "何十年も普通に暮らしている人を、いまさら\n引きずり出すのか、という話になる。"}, {"t": 605.55, "x": "大澤裕参考人は、全体をこうまとめている。"}, {"t": 608.65, "x": "「公訴時効制度と申しますのは、"}, {"t": 610.5, "x": "犯罪者の処罰を確保するという要請と"}, {"t": 613.0166666666667, "x": "時の経過による社会的安定を\n尊重するという要請との調和点として\n政策的に設けられた制度である」"}, {"t": 619.3166666666667, "x": "どっちも大事だから、真ん中で線を引いた、と。"}, {"t": 622.4166666666666, "x": "そうだ。"}, {"t": 623.05, "x": "その線が、殺人では15年だった。"}, {"t": 625.5666666666667, "x": "そして、その線に納得できない人たちが出てきた。"}, {"t": 629.55, "x": "2000年代に入って、時効を\n見直すべきだという声が強くなっていく。"}, {"t": 633.75, "x": "きっかけの一つが、時効が完成した\nあとに犯人が判明した事件だった。"}, {"t": 638.5166666666667, "x": "……過ぎてから分かったの。"}, {"t": 640.0333333333333, "x": "参議院の「立法と調査」という資料に、\n当時の立法の背景として3件が挙げられている。"}, {"t": 645.7, "x": "1件目。1978年、昭和53年、東京都足立区で\n小学校の女性教諭が亡くなった事件。"}, {"t": 652.6666666666666, "x": "判明したのは2004年8月だ。"}, {"t": 654.9666666666667, "x": "2件目。1988年、昭和63年、福岡県北九州市で、\nタクシー会社の警備員が亡くなった事件。"}, {"t": 662.7333333333333, "x": "判明したのは2007年1月。"}, {"t": 665.0, "x": "3件目。同じ1988年、東京都昭島市で\n主婦が亡くなった事件。"}, {"t": 670.25, "x": "判明したのは2004年1月だ。"}, {"t": 672.6333333333333, "x": "3件とも、過ぎてからなのね。"}, {"t": 674.8333333333334, "x": "分かっても、起訴はできない。"}, {"t": 676.6, "x": "警察は、名前を持ったまま、何もできずに終わる。"}, {"t": 679.7666666666667, "x": "この3件が、国会の資料に並んだ。"}, {"t": 682.3166666666667, "x": "制度を変えるときに、立法事実という言い方をする。"}, {"t": 685.4333333333333, "x": "法律を変えなければならない\n現実の根拠、という意味だ。"}, {"t": 688.8, "x": "この3件が、その根拠として扱われた。"}, {"t": 691.75, "x": "……実際に起きてしまったことが、理由になったのね。"}, {"t": 694.9166666666666, "x": "もう一つ、外国の話も資料に載っている。"}, {"t": 697.8166666666667, "x": "イギリスには、ごく軽い罪を除いて時効が無い。"}, {"t": 700.7, "x": "アメリカのニューヨーク州も、最も\n重い類型の重罪には時効が無い。"}, {"t": 704.6666666666666, "x": "ドイツは、第二次世界大戦のあとに、\n計画的な殺人などの時効を撤廃している。"}, {"t": 709.95, "x": "日本だけが特殊というわけでもなかった。"}, {"t": 713.0333333333333, "x": "2009年2月28日。"}, {"t": 715.1333333333333, "x": "「殺人事件被害者遺族の会」という団体ができた。"}, {"t": 718.5, "x": "通称を、宙の会という。"}, {"t": 720.3166666666667, "x": "そらの会。"}, {"t": 721.25, "x": "宇宙の宙と書いて、そらだ。"}, {"t": 723.1333333333333, "x": "中心になったのは、\n世田谷一家の事件のご遺族だった。"}, {"t": 726.6666666666666, "x": "名前の由来は、この会の代表幹事が\n国会で説明している。"}, {"t": 730.5, "x": "「宙という文字が無限の時間を意味するところから、"}, {"t": 733.1833333333333, "x": "被害者は宇宙の無限の世界に、遺族は\n悲しみの無限の世界に、殺人を犯した者は"}, {"t": 738.6666666666666, "x": "裁きを受ける無限の世界にとの思いを込めて」"}, {"t": 741.2833333333333, "x": "……三つとも、終わりがないのね。"}, {"t": 743.2666666666667, "x": "発足したときで、22件の事件の\nご遺族が参加している。"}, {"t": 747.1333333333333, "x": "目的は3つ掲げられた。"}, {"t": 748.9666666666667, "x": "一つ、公訴時効制度の廃止。"}, {"t": 751.1333333333333, "x": "二つ、仮に廃止されても進行中の事件に\n及ばない場合の、時効の停止。"}, {"t": 755.9, "x": "三つ、民事の賠償を国が\n代わりに執行する仕組みの提案。"}, {"t": 759.5833333333334, "x": "この会に、高羽悟さんがいた。"}, {"t": 761.9, "x": "自分の事件がまだ動いている状態で。"}, {"t": 764.35, "x": "残り5年ほどだ。"}, {"t": 765.5833333333334, "x": "この時点で、2014年11月13日は目の前にあった。"}, {"t": 769.6166666666667, "x": "なお、悟さんは現在、\nこの宙の会の代表幹事を務めている。"}, {"t": 773.6833333333333, "x": "当時の代表幹事は、別の事件のご遺族だった。"}, {"t": 776.85, "x": "宙の会がやったことは、シンプルだ。"}, {"t": 779.1833333333333, "x": "署名を集める。"}, {"t": 780.2166666666667, "x": "国に訴える。"}, {"t": 781.2666666666667, "x": "テレビに出て、時効という\n制度があることを知ってもらう。"}, {"t": 784.5, "x": "……知られてなかったの。"}, {"t": 785.8833333333333, "x": "殺人にも時効がある、ということ\n自体を知らない人は多かった。"}, {"t": 789.6666666666666, "x": "自分の身内が事件に遭うまで、\n調べる理由が無いからだ。"}, {"t": 793.0666666666667, "x": "この会より前に、全国犯罪被害者の会という団体も、\n2008年2月に殺人の時効廃止を求めている。"}, {"t": 800.1, "x": "声は、一つの会から出たものではなかった。"}, {"t": 802.8833333333333, "x": "そして2010年の春、\nその積み重ねが国会にたどり着く。"}, {"t": 806.7333333333333, "x": "次は、当時の代表幹事が国会で話した内容だ。"}, {"t": 810.7833333333333, "x": "政府の側も動き始めていた。"}, {"t": 812.7666666666667, "x": "2009年1月、法務省の中に、凶悪で重大な\n事件の時効についての勉強会が設けられた。"}, {"t": 819.05, "x": "同じ年の7月、その勉強会が最終報告書を出している。"}, {"t": 823.0666666666667, "x": "そこには、4つの案が並べられていた。"}, {"t": 825.5833333333334, "x": "一つ、時効の廃止。"}, {"t": 827.2, "x": "二つ、時効期間の延長。"}, {"t": 829.15, "x": "三つ、DNA型の情報などで被告人を\n特定して起訴し、時効を止める。"}, {"t": 833.9833333333333, "x": "四つ、検察官が請求して、時効を止めるか延ばす。"}, {"t": 837.7166666666667, "x": "3つ目が変わってるわね。"}, {"t": 839.1166666666667, "x": "名前が分からなくても起訴する、ってこと。"}, {"t": 841.75, "x": "DNA型だけで「この型の人物」として\n起訴してしまう、という案だ。"}, {"t": 846.35, "x": "海外には例がある。"}, {"t": 847.5833333333334, "x": "ただ、日本ではこれは採られなかった。"}, {"t": 849.9, "x": "2009年10月28日、千葉景子法務大臣が、\n法制審議会に諮問を出す。"}, {"t": 855.3333333333334, "x": "このとき、方向性は「白紙」とされた。"}, {"t": 858.25, "x": "結論を決めずに投げたのね。"}, {"t": 860.2, "x": "廃止ありき、ではなかったということだ。"}, {"t": 862.55, "x": "法制審議会の部会では、5つの案が検討された。"}, {"t": 865.9, "x": "議論は、2009年の11月から\n2010年の2月まで続いている。"}, {"t": 870.3333333333334, "x": "その途中、2010年1月に\n内閣府の世論調査の結果が出た。"}, {"t": 874.5833333333334, "x": "殺人などが25年で時効になることについて、\n「短すぎる」という答えが多数だった。"}, {"t": 879.9833333333333, "x": "見直し策を聞かれた人のうち、49.3パーセントが\n「殺人などは時効廃止」と答えている。"}, {"t": 886.3666666666667, "x": "半分ね。"}, {"t": 887.3, "x": "2010年2月、部会は骨子案を採決した。"}, {"t": 890.45, "x": "賛成11、反対3。"}, {"t": 892.25, "x": "全員一致ではなかった。"}, {"t": 893.8333333333334, "x": "反対した3人がいたということは、\n覚えておいてほしい。"}, {"t": 897.75, "x": "2010年4月23日、衆議院法務委員会。"}, {"t": 901.1, "x": "宙の会の代表幹事として、\n小林賢二参考人が席に着いた。"}, {"t": 905.3833333333333, "x": "最初に、自分のことから話している。"}, {"t": 907.8166666666667, "x": "「初めに、私は、平成八年九月九日、"}, {"t": 910.9333333333333, "x": "東京都葛飾区柴又三丁目の自宅で、\n二十一歳の次女順子を殺害されました」"}, {"t": 916.35, "x": "「当日は霧雨の降る寒い日でした」"}, {"t": 918.8, "x": "……日付と、天気から入るのね。"}, {"t": 920.9666666666667, "x": "そして、こう続けている。"}, {"t": 922.65, "x": "「事件以来、きょうで十三年七カ月と\n十七日過ぎて、いまだ犯人が捕まらない中」"}, {"t": 928.2333333333333, "x": "カ月と、日にちまで数えてるのね。"}, {"t": 930.6333333333333, "x": "小林賢二参考人は、\n設立の趣意書の一部も読み上げている。"}, {"t": 934.6333333333333, "x": "「私たち遺族の思いは、十五年・\n二十五年の歳月で薄れることなど全くありません」"}, {"t": 939.95, "x": "「ところが、法的には時効制度が存在し、"}, {"t": 942.55, "x": "十五年・二十五年の月日が流れると犯人は"}, {"t": 945.85, "x": "何らの刑罰を受けることなく、堂々と\n社会の中で生きてゆけるのです」"}, {"t": 949.7333333333333, "x": "さっきの大澤裕参考人の説明を思い出してほしい。"}, {"t": 953.1166666666667, "x": "時効の理由の二つ目は、処罰感情が\n薄れていくこと、だった。"}, {"t": 957.3, "x": "……薄れない、って言ってるのね。"}, {"t": 959.0666666666667, "x": "そこが、この法案の出発点だ。"}, {"t": 961.4, "x": "制度が前提にしていたことは、本当にそうなのか。"}, {"t": 964.55, "x": "それを、実際に数えている人が国会で言った。"}, {"t": 967.5666666666667, "x": "小林賢二参考人は、最後にこう述べている。"}, {"t": 970.55, "x": "署名活動に協力した人が約8万人。"}, {"t": 973.4166666666666, "x": "手紙やメールで激励を送った\n人が、約10万人に及んだ、と。"}, {"t": 978.0666666666667, "x": "この日の質疑で、小林賢二参考人が\nもう一つ話したことがある。"}, {"t": 982.3833333333333, "x": "時効が完成する、その瞬間に\n何が起きるか、という話だ。"}, {"t": 986.4833333333333, "x": "何が起きるの。"}, {"t": 987.6333333333333, "x": "宙の会には、すでに時効を\n迎えてしまったご遺族も参加していた。"}, {"t": 991.7, "x": "22件のうち、3件がそうだった。"}, {"t": 994.15, "x": "その人たちから聞いた話として、こう説明している。"}, {"t": 997.55, "x": "「秒針が午前零時を指した、その瞬間に\n捜査をお願いしている看板がまず外される」"}, {"t": 1002.6833333333333, "x": "「それからポスターが外される」"}, {"t": 1004.45, "x": "「それから証拠品がその後警察から戻ってくる」"}, {"t": 1007.5166666666667, "x": "……順番まで決まってるのね。"}, {"t": 1009.2833333333333, "x": "そして、こう言っている。"}, {"t": 1010.7666666666667, "x": "「まさに警察の方から縁を切られたような、\nそういった非常に無念な気持ちを味わっておる」"}, {"t": 1015.85, "x": "さらに、こんな例も挙げている。"}, {"t": 1017.6833333333333, "x": "「その中には既に犯人の名前まで\nわかっていて顔写真入りで"}, {"t": 1021.3166666666667, "x": "指名手配されている、そういったポスターまでも"}, {"t": 1023.6833333333333, "x": "張ってあったわけですけれども、\nそういったものまではがされてしまう」"}, {"t": 1027.3166666666666, "x": "名前が分かってても、ね。"}, {"t": 1029.0833333333333, "x": "小林賢二参考人は、自分たちが\n求めているものについても、はっきり線を引いている。"}, {"t": 1034.4, "x": "「当初の捜査体制を永久に保ってほしいと\n言っているわけでは決してない」"}, {"t": 1038.5, "x": "「たとえそれが縮小されたとしましても、やはり"}, {"t": 1041.1166666666666, "x": "警察がいつも犯人を\n追いかけていてくれる、あるいはきょうか"}, {"t": 1044.4, "x": "あしたはもしかしたら犯人が捕まるかも\nしれない、そういったかすかな"}, {"t": 1047.9833333333333, "x": "希望があることが、やはり私たち被害者遺族に\nとっては唯一心のよりどころになるわけです」"}, {"t": 1053.6666666666667, "x": "……体制じゃなくて、続いていること自体なのね。"}, {"t": 1056.5666666666666, "x": "そう聞こえる。"}, {"t": 1058.0666666666666, "x": "ここで、反対側の話をする。"}, {"t": 1060.2333333333333, "x": "同じ日、同じ委員会に、\n日本弁護士連合会の副会長も呼ばれていた。"}, {"t": 1064.85, "x": "江藤洋一参考人だ。"}, {"t": 1066.4333333333334, "x": "最初から、はっきり言っている。"}, {"t": 1068.3, "x": "「結論から申します。"}, {"t": 1069.6166666666666, "x": "私は、今回の公訴時効と刑の時効を\n廃止し、また延長する刑事訴訟法並びに\n刑法改正に反対でございます」"}, {"t": 1077.05, "x": "正面からね。"}, {"t": 1078.2, "x": "理由の中心は、「逃げ得を許さない」という\n言い方そのものにあった。"}, {"t": 1082.2833333333333, "x": "江藤洋一参考人は、こう問い返している。"}, {"t": 1084.9833333333333, "x": "「その真犯人というのは一体だれなのか。それは\n神や仏の目から見た真犯人なのでございます」"}, {"t": 1090.7833333333333, "x": "……実際に捕まえるのは、人間だものね。"}, {"t": 1093.4833333333333, "x": "捜査をするのも、裁くのも人間だ。"}, {"t": 1095.9, "x": "そして、間違えることがある。"}, {"t": 1097.7833333333333, "x": "江藤洋一参考人は、こう言っている。"}, {"t": 1100.15, "x": "「最近の足利事件、氷見事件は言うに及ばず、"}, {"t": 1102.9833333333333, "x": "幾つもの再審無罪事件が現に\n発生しているわけでございます」"}, {"t": 1106.8833333333334, "x": "足利事件は、この番組でも扱った。"}, {"t": 1109.5666666666666, "x": "DNA型鑑定で一人の男性が\n犯人とされ、同じDNA型鑑定で、\nその人が無実だと分かった事件だ。"}, {"t": 1116.7333333333333, "x": "2009年に釈放されて、\n2010年に無罪が確定している。"}, {"t": 1120.9, "x": "……この委員会の、すぐ前の年ね。"}, {"t": 1123.15, "x": "だから、この場では生々しい例だった。"}, {"t": 1125.6, "x": "江藤洋一参考人が守ろうとしたのは、\nこういう人たちだ。"}, {"t": 1129.2333333333333, "x": "「捜査の過程で被疑者、"}, {"t": 1130.5833333333333, "x": "容疑者として捜査線上に上った人にとっては、"}, {"t": 1133.5333333333333, "x": "何ら逃げ得ではなく、むしろ\n大変な災厄なわけでございます」"}, {"t": 1137.9166666666667, "x": "江藤洋一参考人は、この日、\n委員会でひとつ実験をしている。"}, {"t": 1142.1166666666666, "x": "実験？"}, {"t": 1142.8833333333334, "x": "議員たちに、こう聞いた。"}, {"t": 1144.4833333333333, "x": "「いかがでございましょう、"}, {"t": 1145.5833333333333, "x": "三十年前、\nすなわち昭和五十五年四月二十三日の午前十時、\n先生方はどこにおられたでしょうか」"}, {"t": 1152.15, "x": "……三十年前の、ある日の午前十時。"}, {"t": 1154.6, "x": "会議録には、ここで発言する者あり、と書かれている。"}, {"t": 1158.0666666666666, "x": "そして江藤洋一参考人は、一人ずつ\n名前を挙げながら、こう続けた。"}, {"t": 1162.4833333333333, "x": "本当にわからないと思うんです、と。"}, {"t": 1164.7166666666667, "x": "ある議員はまだ小学生で、\n別の議員はまだ生まれていなかった。"}, {"t": 1168.4166666666667, "x": "そのうえで、本題に入る。"}, {"t": 1170.1833333333334, "x": "「しかも、先生方を犯人らしく思わせる\nもっともらしい証拠があり、ただ、"}, {"t": 1174.4833333333333, "x": "先生方としては身に覚えがないという\n場合を考えていただきたいのでございます」"}, {"t": 1179.0333333333333, "x": "「どうやってアリバイ立証ができるのか」"}, {"t": 1181.25, "x": "……証明できないわね。"}, {"t": 1182.4, "x": "三十年前の、朝の十時なんて。"}, {"t": 1184.8833333333334, "x": "これが、時効の一つ目の理由の裏側だ。"}, {"t": 1187.5833333333333, "x": "証拠が散らばっていくというのは、\n警察の側だけの話ではない。"}, {"t": 1191.4333333333334, "x": "疑われた人が、自分は違うと\n示すための材料も、同じように消えていく。"}, {"t": 1196.1833333333334, "x": "江藤洋一参考人は、こうまとめている。"}, {"t": 1198.7166666666667, "x": "「真犯人だけを解放するのではないのです。"}, {"t": 1201.1666666666667, "x": "真犯人と疑われた罪のない人々を\n解放するということに意味がございます」"}, {"t": 1205.9833333333333, "x": "時効って、そういう働きもしてたのね。"}, {"t": 1208.65, "x": "この指摘は、いまも消えていない。"}, {"t": 1210.6833333333334, "x": "時効が無くなった以上、疑われた人は、何十年たっても\n疑われたままでいられるということでもある。"}, {"t": 1217.2, "x": "この法案には、もう一つ大きな論点があった。"}, {"t": 1220.15, "x": "すでに起きている事件に、新しい\n法律を当てはめていいのか、だ。"}, {"t": 1224.1666666666667, "x": "さかのぼって適用する、ってこと。"}, {"t": 1226.4, "x": "そうだ。"}, {"t": 1227.0166666666667, "x": "法案には、こう書かれていた。"}, {"t": 1228.8833333333334, "x": "施行前に犯した罪であって、施行の際に時効が\n完成していないものについても適用する。"}, {"t": 1234.4166666666667, "x": "つまり、まだ時効が来ていない事件は、\n全部この新しい法律の下に入る。"}, {"t": 1239.1666666666667, "x": "高羽さんの事件は、そこに入るのね。"}, {"t": 1241.7666666666667, "x": "2014年が期限だったから、入る。"}, {"t": 1244.2666666666667, "x": "ここで問題になるのが、憲法第39条だ。"}, {"t": 1247.4166666666667, "x": "あとから作った罰で、昔の行為を\n処罰してはいけない、という決まりがある。"}, {"t": 1251.9166666666667, "x": "大澤裕参考人は、これには当たらない、と説明した。"}, {"t": 1255.55, "x": "憲法39条が禁じているのは、実行のときに\n適法だった行為を、あとから処罰することだ。"}, {"t": 1261.5833333333333, "x": "殺人は1999年の時点でも犯罪だった。だから、\nその部分は何も変わらない。"}, {"t": 1267.3666666666666, "x": "時効は、起訴という手続きが有効か\nどうかを決めるものだ、という整理になる。"}, {"t": 1271.95, "x": "罪の重さは変えてない、ってことね。"}, {"t": 1274.2333333333333, "x": "政府側の説明も同じだった。"}, {"t": 1276.2833333333333, "x": "一定期間逃げ切れば処罰されない、という\n期待は、守る必要がない。"}, {"t": 1280.5666666666666, "x": "一方、江藤洋一参考人は、そこに反対した。"}, {"t": 1283.8666666666666, "x": "「これは余りにも形式論理に過ぎると考えます」"}, {"t": 1286.7666666666667, "x": "「公訴時効は時間的可罰性に対する制約である」"}, {"t": 1289.9833333333333, "x": "時効を延ばすことは、罰せられる\n範囲を広げることだ、という主張だ。"}, {"t": 1294.1166666666666, "x": "そして、2004年の改正のときと同じように、\n附則で遡及を外すべきだと求めた。"}, {"t": 1299.5833333333333, "x": "でも、そうはならなかったのよね。"}, {"t": 1302.2333333333333, "x": "2010年4月27日。"}, {"t": 1304.3, "x": "刑法及び刑事訴訟法の一部を\n改正する法律が成立した。"}, {"t": 1308.1666666666667, "x": "平成22年法律第26号。"}, {"t": 1310.6, "x": "公布も施行も、同じ4月27日だ。"}, {"t": 1313.6, "x": "その日のうちに動き出したのね。"}, {"t": 1315.6833333333334, "x": "人を死亡させた罪のうち、死刑に\n当たるものは、公訴時効の対象から外された。"}, {"t": 1320.7333333333333, "x": "殺人は、ここに入る。"}, {"t": 1322.3833333333334, "x": "そして附則によって、時効が\n進行中の事件にも適用された。"}, {"t": 1326.4166666666667, "x": "この瞬間、1999年11月13日の事件から、\n期限が消えた。"}, {"t": 1331.7333333333333, "x": "2014年11月13日という日付は、ただの日付になった。"}, {"t": 1336.1833333333334, "x": "……その日、高羽さんはどこにいたのかしら。"}, {"t": 1338.75, "x": "国会にいた。"}, {"t": 1339.75, "x": "本人が語っている。傍聴席で、\n「やったぞ」という感覚を味わった、と。"}, {"t": 1344.5666666666666, "x": "自分の事件の時効が、目の前で消えたのね。"}, {"t": 1347.5166666666667, "x": "そういうことになる。"}, {"t": 1348.6833333333334, "x": "ただ、これで事件が解決したわけじゃない。"}, {"t": 1351.2833333333333, "x": "この時点でも、名前は分かっていない。"}, {"t": 1353.5833333333333, "x": "分かったのは、期限が無くなった、ということだけだ。"}, {"t": 1356.7666666666667, "x": "時効が無くなるというのは、犯人が\n見つかるということではない。"}, {"t": 1360.3666666666666, "x": "探し続けてよくなった、というだけの話だ。"}, {"t": 1363.4, "x": "期限が消えただけ、なのよね。"}, {"t": 1365.5, "x": "そこは冷静に見ておきたい。"}, {"t": 1367.1333333333334, "x": "この法律で時効が廃止されたのは、人を\n死亡させた罪のうち、死刑に当たるものだけだ。"}, {"t": 1372.6, "x": "殺人、強盗殺人、強盗致死など刑法にある6つの罪。"}, {"t": 1376.4833333333333, "x": "それに、航空機を奪って人を死亡させた\n場合など、特別法にある6つの罪。"}, {"t": 1381.3333333333333, "x": "合わせて12の罪が、時効の対象から外された。"}, {"t": 1384.5666666666666, "x": "それ以外の、人を死亡させた\n罪は、期間が伸びただけだ。"}, {"t": 1388.2333333333333, "x": "無期の懲役に当たる罪は、15年から30年へ。"}, {"t": 1391.5333333333333, "x": "それより軽いものは、おおむね倍に延ばされた。"}, {"t": 1394.2333333333333, "x": "だから、すべての事件で時効が消えたわけではない。"}, {"t": 1397.35, "x": "線は、引き直されただけなのね。"}, {"t": 1399.65, "x": "引き直された。"}, {"t": 1400.7333333333333, "x": "同じ日、刑の時効も見直されている。"}, {"t": 1403.1166666666666, "x": "判決が確定したあと、執行されないまま\n一定期間が過ぎると刑が免除される、という制度だ。"}, {"t": 1409.0, "x": "死刑については、これも廃止された。"}, {"t": 1411.2833333333333, "x": "そして、探し続けるには、現実的な問題が出てくる。"}, {"t": 1415.6833333333334, "x": "時効を廃止するとき、法制審議会で\n議論されたことがある。"}, {"t": 1419.35, "x": "証拠を、いつまで持っているのか、という話だ。"}, {"t": 1422.3833333333334, "x": "あ……期限が無くなるってことは。"}, {"t": 1424.4166666666667, "x": "終わりが無くなる。"}, {"t": 1425.4833333333333, "x": "議事録に、事務当局の発言が残っている。"}, {"t": 1428.4333333333334, "x": "「ずっと永久的に持ち続けるということはなかなか\n難しくて、どこかの時点で線引きは"}, {"t": 1433.55, "x": "必要だなと考えております」"}, {"t": 1435.35, "x": "そして、具体的な試算まで出ている。"}, {"t": 1437.7666666666667, "x": "証拠を100年保存すると、いまより\n2万1000平方メートル余分に要る。"}, {"t": 1441.85, "x": "「これは東京ドーム半分くらいという感じ」"}, {"t": 1444.3833333333334, "x": "東京ドーム半分。"}, {"t": 1445.7666666666667, "x": "全国の警察が押収した物を、\n100年分置いておくとそうなる、という計算だ。"}, {"t": 1450.6666666666667, "x": "検挙率についても聞かれている。"}, {"t": 1452.6166666666666, "x": "「例えば期間が倍になれば検挙率が\n倍になるというほど飛躍的にはならないだろうと」"}, {"t": 1457.5, "x": "「ただし、意味がないということはないという\n感じを持っております」"}, {"t": 1461.0833333333333, "x": "ずいぶん控えめね。"}, {"t": 1462.45, "x": "正直な言い方だと思う。"}, {"t": 1464.1166666666666, "x": "時効を無くしても、劇的に捕まるようにはならない。"}, {"t": 1467.3166666666666, "x": "それでも、意味が無いわけではない。"}, {"t": 1469.3166666666666, "x": "そして、警察の側も動いている。"}, {"t": 1471.5666666666666, "x": "時効が廃止されたあと、\n国家公安委員会委員長の所信には、\n毎年こういう一文が入るようになった。"}, {"t": 1477.75, "x": "「ＤＮＡ型鑑定、\n各種捜査支援システム等の科学技術を\n活用した捜査を更に推進するとともに、"}, {"t": 1484.0333333333333, "x": "公訴時効の廃止等に的確に対処するため、\n必要な捜査基盤を整備します」"}, {"t": 1489.2333333333333, "x": "時効を無くしたから、鑑定と保管に力を入れる、と。"}, {"t": 1492.7333333333333, "x": "この2つは、セットだった。"}, {"t": 1495.2, "x": "ここで、また名古屋に戻る。"}, {"t": 1496.9833333333333, "x": "時効が消えたあとも、事件は動かなかった。"}, {"t": 1499.7166666666667, "x": "2010年、2011年、2012年。"}, {"t": 1502.65, "x": "何も出ない。"}, {"t": 1503.5333333333333, "x": "2013年8月、高羽悟さんは、あることを始める。"}, {"t": 1507.5666666666666, "x": "何かしら。"}, {"t": 1508.55, "x": "毎月13日に、情報提供を呼びかけることだ。"}, {"t": 1511.8833333333334, "x": "13日というのは、月命日にあたる。"}, {"t": 1514.6166666666666, "x": "……毎月、ね。"}, {"t": 1515.7833333333333, "x": "現場の近くに立って、ビラを配る。"}, {"t": 1518.0833333333333, "x": "毎年11月にも、事件のあった\n月として呼びかけを続けた。"}, {"t": 1522.15, "x": "部屋の家賃は、そのあいだもずっと払っている。"}, {"t": 1524.8833333333334, "x": "宙の会の活動も続けていた。"}, {"t": 1527.0, "x": "やがて、代表幹事を務めるようになる。"}, {"t": 1529.5166666666667, "x": "自分の事件だけの話ではなくなっていった。"}, {"t": 1532.3833333333334, "x": "他の遺族の側にも立つようになったのね。"}, {"t": 1535.0166666666667, "x": "ここで一つ、押さえておきたいことがある。"}, {"t": 1537.5, "x": "時効が無くなるということは、\n終わりが無くなるということでもある。"}, {"t": 1541.0666666666666, "x": "区切りが法律で来なくなった分、待つ\n側は、自分で終わりを決められなくなる。"}, {"t": 1545.6, "x": "さっきの江藤洋一参考人も、そこには触れていた。"}, {"t": 1548.8166666666666, "x": "時効で一区切りをつけたいと考える遺族もいる、と。"}, {"t": 1552.1166666666666, "x": "……気持ちは、一つじゃないものね。"}, {"t": 1554.2, "x": "ただ、高羽悟さんは、待ち続けるほうを選んだ。"}, {"t": 1557.4, "x": "呼びかけの場所は、いつも同じだった。"}, {"t": 1559.7333333333333, "x": "現場のある稲生町の周辺だ。"}, {"t": 1561.6833333333334, "x": "犯人はこのあたりを歩いたはずだ、という前提がある。"}, {"t": 1564.7666666666667, "x": "血痕は、北東へ500メートル続いていた。"}, {"t": 1567.5666666666666, "x": "つまり、その範囲に住んでいた人なら、\n何かを見ているかもしれない。"}, {"t": 1571.6666666666667, "x": "だから同じ場所で配り続けたのね。"}, {"t": 1574.0666666666666, "x": "14年目も、15年目も、同じ場所だ。"}, {"t": 1576.9166666666667, "x": "そして毎年11月には、事件のあった\n月として、別に呼びかけを行った。"}, {"t": 1581.9333333333334, "x": "年に13回、外に立っていた計算になる。"}, {"t": 1584.85, "x": "時効が消えたということは、その13回に\n終わりが無いということでもある。"}, {"t": 1589.0166666666667, "x": "そして2020年、事件が一度だけ、外に向けて動く。"}, {"t": 1593.5, "x": "2020年2月5日。"}, {"t": 1595.25, "x": "警察庁が、この事件を\n捜査特別報奨金の対象に指定した。"}, {"t": 1599.6333333333334, "x": "懸賞金ね。"}, {"t": 1600.7666666666667, "x": "解決に結びつく情報を提供した人に、最高300万円。"}, {"t": 1604.8, "x": "期間は、その日から1年間だった。"}, {"t": 1607.2666666666667, "x": "同じ日、愛知県警は似顔絵を公開している。"}, {"t": 1610.1333333333334, "x": "しかも、2枚だ。"}, {"t": 1611.5833333333333, "x": "2枚？"}, {"t": 1612.2666666666667, "x": "1枚は、事件当時の目撃情報をもとにした似顔絵。"}, {"t": 1615.7833333333333, "x": "もう1枚は、そこから20年分の加齢を\n加味した、現在の予想の似顔絵だ。"}, {"t": 1620.6666666666667, "x": "……年を取らせた顔を作ったのね。"}, {"t": 1622.75, "x": "当時40代から50代なら、2020年には\n60代から70代になっている。"}, {"t": 1627.8833333333334, "x": "だから、いまの顔で探す必要があった。"}, {"t": 1630.4666666666667, "x": "この2枚は、ポスターになって近隣に貼られた。"}, {"t": 1633.3333333333333, "x": "のちに逮捕の報道が出たとき、\n近隣からはこんな声が出ている。"}, {"t": 1637.0833333333333, "x": "ポスターを見ても、本人とは分からなかった、と。"}, {"t": 1640.2, "x": "……見てはいたのね。"}, {"t": 1641.3666666666666, "x": "貼ってあった。見てもいた。"}, {"t": 1643.05, "x": "それでも結びつかない。"}, {"t": 1644.4833333333333, "x": "公開捜査というのは、そういうものでもある。"}, {"t": 1647.0833333333333, "x": "この時点でも、事件は動かなかった。"}, {"t": 1649.6333333333334, "x": "懸賞金まで出したのにね。"}, {"t": 1651.5333333333333, "x": "ただ、この2020年の動きには意味があった。"}, {"t": 1654.45, "x": "時効が生きていれば、2014年で捜査は終わっている。"}, {"t": 1657.7333333333333, "x": "警察庁が2020年に懸賞金を指定できたのは、\n事件がまだ「捜査中」だったからだ。"}, {"t": 1663.6333333333334, "x": "似顔絵を作り直せたのも、同じ理由だ。"}, {"t": 1666.35, "x": "……時効が無いから、20年後の顔を作れたのね。"}, {"t": 1669.4333333333334, "x": "そういうことになる。"}, {"t": 1670.6166666666666, "x": "時効があった時代なら、6年前に\nポスターは剥がされていた。"}, {"t": 1674.2666666666667, "x": "小林賢二参考人が国会で話していた、あの場面だ。"}, {"t": 1677.9333333333334, "x": "看板が外され、ポスターが\n外され、証拠品が戻ってくる。"}, {"t": 1681.7166666666667, "x": "この事件では、それが起きなかった。"}, {"t": 1683.9666666666667, "x": "報奨金の期間は過ぎ、2021年、2022年、\n2023年、2024年と過ぎていく。"}, {"t": 1690.7833333333333, "x": "25年目に入っても、名前は出なかった。"}, {"t": 1694.1666666666667, "x": "2025年。"}, {"t": 1695.3166666666666, "x": "愛知県警は、この年に入ってから、ある女性に\n複数回、任意で事情を聴いていた。"}, {"t": 1700.65, "x": "任意で。"}, {"t": 1701.4, "x": "逮捕ではない。断ることもできる聴き取りだ。"}, {"t": 1704.2, "x": "そして警察は、DNA型鑑定のために、\n唾液などの検体を出してほしいと求めた。"}, {"t": 1709.6333333333334, "x": "これも任意だ。"}, {"t": 1710.6166666666666, "x": "当初、その女性は拒否している。"}, {"t": 1712.85, "x": "出さなかったのね。"}, {"t": 1714.1666666666667, "x": "ところが、最近になって応じた、と報じられている。"}, {"t": 1717.4, "x": "2025年10月30日の午後。"}, {"t": 1719.9166666666667, "x": "その女性は、一人で愛知県警の西警察署に出頭した。"}, {"t": 1723.8, "x": "そして、事件への関与を\nほのめかす供述をしたとされる。"}, {"t": 1727.4166666666667, "x": "……自分から来たのね。"}, {"t": 1728.85, "x": "翌10月31日、殺人の疑いで逮捕された。"}, {"t": 1732.45, "x": "逮捕されたのは、名古屋市港区に\n住む、当時69歳のアルバイトの女性だ。"}, {"t": 1737.3166666666666, "x": "決め手になったのは、鑑定結果だった。"}, {"t": 1739.8, "x": "現場に残されていた血痕のDNA型と、一致した。"}, {"t": 1743.4666666666667, "x": "……26年前の血痕が。"}, {"t": 1745.4, "x": "1999年に採取されて、ずっと保管されていたものだ。"}, {"t": 1749.5833333333333, "x": "調べに対しては、「合っています」と\n容疑を認めたと報じられている。"}, {"t": 1753.6, "x": "そして、逮捕後に分かったことがある。"}, {"t": 1755.9, "x": "その女性は、夫の高羽悟さんの高校の同級生だった。"}, {"t": 1759.8166666666666, "x": "……同級生。"}, {"t": 1760.7833333333333, "x": "同じソフトテニス部に\n所属していた、とも報じられている。"}, {"t": 1764.2333333333333, "x": "ここで、はっきりさせておく。"}, {"t": 1766.0166666666667, "x": "DNA型が一致したというのは、非常に強い事実だ。"}, {"t": 1769.5333333333333, "x": "ただし、絶対に間違いがない、という\n言い方は私はしない。"}, {"t": 1773.1833333333334, "x": "足利事件の回で見たとおり、鑑定は\n結論を2回ひっくり返している。"}, {"t": 1777.4833333333333, "x": "技術は上がったが、判断するのは裁判所だ。"}, {"t": 1781.0, "x": "逮捕のあと、検察は鑑定留置を行った。"}, {"t": 1783.9833333333333, "x": "鑑定留置。"}, {"t": 1785.05, "x": "刑事責任を問えるかどうかを、\n専門家に調べてもらう手続きだ。"}, {"t": 1789.0333333333333, "x": "期間はおよそ3か月。"}, {"t": 1790.6166666666666, "x": "そして2026年3月5日、\n名古屋地検は、殺人罪で起訴した。"}, {"t": 1795.45, "x": "精神鑑定の結果を踏まえて、刑事責任を\n問えると判断した、としている。"}, {"t": 1800.1333333333334, "x": "高羽悟さんは、起訴を受けてこう語っている。"}, {"t": 1802.95, "x": "「鑑定留置に行っていましたから、"}, {"t": 1804.7666666666667, "x": "1％でも2％でも不起訴がありえるかなと"}, {"t": 1807.9, "x": "思っていましたので心配していましたが、\nそういうことがなくて無事起訴できたのでよかった」"}, {"t": 1812.8, "x": "そして、「検事さんにお願いしようと思っているのは、"}, {"t": 1815.65, "x": "求刑できる一番重い刑を\n求刑してもらいたい」とも述べている。"}, {"t": 1819.6333333333334, "x": "……26年、待ったものね。"}, {"t": 1821.55, "x": "ただし、ここからが難しい。"}, {"t": 1823.4, "x": "被告人は、逮捕の直後に黙秘に転じている。"}, {"t": 1826.45, "x": "報道では、逮捕直後に学生時代の好意について\n供述したとも伝えられた。"}, {"t": 1831.2, "x": "しかし、そこから先を話していない。"}, {"t": 1833.55, "x": "だから、検察も動機については\n「判然としない」としている。"}, {"t": 1837.5666666666666, "x": "分からないままなのね。"}, {"t": 1839.0666666666666, "x": "そうだ。"}, {"t": 1839.6666666666667, "x": "この事件は、裁判員裁判で\n審理されることになっている。"}, {"t": 1843.2166666666667, "x": "その前に、争点を絞る公判前整理手続がある。"}, {"t": 1846.5666666666666, "x": "2026年8月の時点でも、初公判は\nまだ先だと報じられていた。"}, {"t": 1851.3666666666666, "x": "つまり、判決はまだ出ていない。"}, {"t": 1853.3833333333334, "x": "私がこの回で「犯人」という言葉を\n使わないのは、そのためだ。"}, {"t": 1857.6, "x": "起訴されたというのは、検察がそう\n主張しているという意味であって、"}, {"t": 1861.25, "x": "裁判所が認めたという意味ではない。"}, {"t": 1863.5833333333333, "x": "……江藤参考人が言っていたことに、つながるわね。"}, {"t": 1866.5666666666666, "x": "つながる。"}, {"t": 1867.2833333333333, "x": "時効を無くした以上、そこは\n前より厳しく守るべきところだ。"}, {"t": 1871.6333333333334, "x": "もう一つ、いま動いている裁判がある。"}, {"t": 1874.0333333333333, "x": "民事のほうだ。"}, {"t": 1875.0333333333333, "x": "2026年3月30日、高羽悟さんは、被告人を\n相手取って損害賠償を求める訴訟を起こした。"}, {"t": 1882.0333333333333, "x": "請求額は、およそ1億2000万円。"}, {"t": 1884.55, "x": "そして2026年9月8日、名古屋地裁で\n第1回の口頭弁論が開かれた。"}, {"t": 1889.9, "x": "先週じゃない。"}, {"t": 1890.9666666666667, "x": "ここで、被告側が出してきた主張がある。"}, {"t": 1893.6333333333334, "x": "除斥期間だ。"}, {"t": 1894.8833333333334, "x": "じょせききかん。"}, {"t": 1895.9166666666667, "x": "改正前の民法では、不法行為から20年が過ぎると、\n損害賠償を請求する権利が消えるとされていた。"}, {"t": 1902.45, "x": "事件は1999年。20年後は2019年だ。"}, {"t": 1906.4166666666667, "x": "被告側は、すでに\nその期間が過ぎている、と主張した。"}, {"t": 1909.9833333333333, "x": "答弁書では、こう書かれている。"}, {"t": 1911.9166666666667, "x": "「原告が主張する不法行為を前提としたとしても、\n除斥期間を排除すべき事案とはいえない」"}, {"t": 1917.4833333333333, "x": "そして、事実関係については、\n包括的に黙秘権を行使するとしている。"}, {"t": 1922.3833333333334, "x": "……刑事でも民事でも、話さないのね。"}, {"t": 1924.7833333333333, "x": "原告側の主張はこうだ。"}, {"t": 1926.5166666666667, "x": "逮捕されるまで、誰が加害者なのか分からなかった。"}, {"t": 1929.6833333333334, "x": "分からない相手を訴えることはできない。"}, {"t": 1931.9333333333334, "x": "だから、この事案に除斥期間を当てはめるのは、\n著しく正義・公平に反する、としている。"}, {"t": 1938.0, "x": "ここで、面白いことを言う。"}, {"t": 1939.7166666666667, "x": "この対立は、2010年の時点で予告されていた。"}, {"t": 1943.1166666666666, "x": "予告？"}, {"t": 1943.8833333333334, "x": "法制審議会の部会で、こういう指摘が出ていた。"}, {"t": 1946.9166666666667, "x": "公訴時効を廃止したり大幅に延長した const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
