<script>
const D={"name": "092", "file": "092_編集用", "dur": 2175.06665625, "segs": [], "subs": [{"t": 0.0, "x": "1999年、埼玉県の上尾警察署に出された\n紙が一枚ある。"}, {"t": 4.8, "x": "警察の書式で、表に「告訴状」と書いてある紙だ。"}, {"t": 8.55, "x": "告訴状？"}, {"t": 9.483333333333333, "x": "犯罪の被害にあった人が、警察に\n対して「この事実を訴えます、"}, {"t": 13.8, "x": "犯人を処罰してください」と申し出るための書類だ。"}, {"t": 17.216666666666665, "x": "被害届とは違う。被害届は\n「こういう被害がありました」という報告だ。"}, {"t": 21.916666666666668, "x": "告訴状には、処罰してほしいという\n意思表示まで入っている。"}, {"t": 25.683333333333334, "x": "だから、受け取った側の責任も違ってくるのね。"}, {"t": 28.916666666666668, "x": "そうだ。告訴を受理したら、警察は\n速やかに処理しなければならない。"}, {"t": 32.93333333333333, "x": "本部に報告する義務も生まれる。"}, {"t": 35.083333333333336, "x": "1999年7月29日、埼玉県の上尾警察署で、\n一人の大学生の女性がこの紙に署名した。"}, {"t": 42.45, "x": "当時21歳だった。"}, {"t": 44.1, "x": "彼女は、その3か月後に亡くなっている。"}, {"t": 46.88333333333333, "x": "……3か月。"}, {"t": 47.88333333333333, "x": "10月26日、桶川市のJR桶川駅の西口で、\n刃物のようなもので刺されて\n亡くなった。昼のさなかだ。"}, {"t": 55.166666666666664, "x": "今回は、この一枚の紙がどう\n扱われたか、という話をする。"}, {"t": 59.166666666666664, "x": "先に断っておく。亡くなった女性の名前は出さない。"}, {"t": 62.583333333333336, "x": "報道されている名前でも？"}, {"t": 64.3, "x": "出さない。議事録を引くときも「◯◯さん」と伏せる。"}, {"t": 67.35, "x": "処分を受けた警察官も、役職だけで呼ぶ。"}, {"t": 70.31666666666666, "x": "それから、これは後で必ずもう一度言うが、\nこの事件では国家賠償の裁判が確定していて、"}, {"t": 75.98333333333333, "x": "警察の対応と、彼女が亡くなったこととの因果関係は、\n裁判所が否定している。"}, {"t": 81.26666666666667, "x": "警察のせいで亡くなった、とは言えないということ。"}, {"t": 84.3, "x": "法律上はそうなっている。"}, {"t": 85.73333333333333, "x": "私もその線は越えない。"}, {"t": 87.43333333333334, "x": "そのうえで、紙の話をする。"}, {"t": 90.0, "x": "この事件の経過は、\n2000年3月7日の参議院予算委員会で、\n竹村泰子議員が細かく読み上げている。"}, {"t": 96.7, "x": "国立国会図書館の国会会議録検索システムに、\n全文が残っている。まずはそれをなぞる。"}, {"t": 102.76666666666667, "x": "議事録に残っているのね。"}, {"t": 104.58333333333333, "x": "ああ。1999年1月、彼女は大宮市内で\n男性に声をかけられ、交際が始まった。"}, {"t": 110.81666666666666, "x": "6月、交際を断りたいと何度か\n伝えたところ、その元交際相手が\n他の男性2人と一緒に自宅を訪ねてきた。"}, {"t": 118.26666666666667, "x": "今まで買ってやったものを返せ、と言って、\n数百万円相当の返済を要求している。"}, {"t": 123.56666666666666, "x": "数百万円。"}, {"t": 124.68333333333334, "x": "この時点で、彼女は上尾署に\n相談している。1回目の相談だ。"}, {"t": 128.75, "x": "竹村議員はこう述べている。"}, {"t": 130.3, "x": "「彼女と母親は身を切られる思いで\n上尾署へ相談に訪れました」"}, {"t": 134.21666666666667, "x": "「前日の三人組とのやりとりを\n録音したテープを持っていきました」"}, {"t": 138.26666666666668, "x": "録音まで持っていったのね。"}, {"t": 140.08333333333334, "x": "そのうえで、若い刑事は"}, {"t": 141.65, "x": "「それは大変だ、それは恐喝だ」と言ったが、\n年上の刑事が横から「だめだめ、これは"}, {"t": 147.16666666666666, "x": "事件にならないよ」と言った。そういう\nやりとりがあったのではないか、と\n国会で問われている。"}, {"t": 152.31666666666666, "x": "あったの。"}, {"t": 153.11666666666667, "x": "ここは、後から埼玉県警が調べた結果と食い違う。"}, {"t": 156.61666666666667, "x": "2000年5月22日、参議院の行政監視委員会で、\n警察庁の刑事局長がこう答えている。"}, {"t": 162.85, "x": "「御指摘のやりとりにつきましても慎重に"}, {"t": 165.25, "x": "確認を行わせました結果、そのような\nやりとりはなかったということが確認された」"}, {"t": 170.21666666666667, "x": "警察は、そういう会話は無かったと。"}, {"t": 172.66666666666666, "x": "そう報告している。私はどちらかに決めない。"}, {"t": 175.4, "x": "国会でそう問われ、警察がそう\n答えた、というところまでを事実として置く。"}, {"t": 180.08333333333334, "x": "ただ、この後に起きることについては、\n警察自身が全部認めている。そこからが本題だ。"}, {"t": 186.23333333333332, "x": "1999年7月13日。この日に、\n名誉毀損事件が起きている。"}, {"t": 191.38333333333333, "x": "彼女の自宅の周りの電柱に、\n写真入りの中傷ビラが、べたべたと貼られた。"}, {"t": 196.31666666666666, "x": "写真入りの。"}, {"t": 197.35, "x": "中身は、ここでは読まない。"}, {"t": 198.9, "x": "彼女の名誉を傷つけるための紙だ。"}, {"t": 201.25, "x": "警察庁の刑事局長は、後にこう表現している。"}, {"t": 204.4, "x": "「大変悪質な中傷ビラを自宅付近に\n大量にまくという大変悪質なもの」"}, {"t": 209.23333333333332, "x": "名誉毀損は、刑法の罪だ。"}, {"t": 211.1, "x": "人の社会的評価を落とすような事実を、\n公然と広めた場合に成立する。"}, {"t": 215.9, "x": "そしてこの罪は、親告罪だ。"}, {"t": 218.2, "x": "親告罪って、確か。"}, {"t": 220.0, "x": "告訴がなければ、検察官が起訴できない罪のことだ。"}, {"t": 223.5, "x": "だから名誉毀損の場合、被害者が\n「処罰してください」と申し出ないと、\nそもそも手続きが前に進まない。"}, {"t": 230.28333333333333, "x": "じゃあ、告訴状はどうしても要るのね。"}, {"t": 232.6, "x": "要る。ここを押さえておいてくれ。\nこの事件で告訴状という紙が重い\n意味を持つのは、そういう理由だ。"}, {"t": 238.26666666666668, "x": "8月には、彼女の父親が勤める会社に、\n中傷の文書が100通以上も郵送されている。"}, {"t": 244.1, "x": "100通。もう、家だけじゃないのね。"}, {"t": 246.41666666666666, "x": "家の周り、大学、父親の職場。"}, {"t": 248.76666666666668, "x": "生活の場所が順番に狙われている。"}, {"t": 251.15, "x": "彼女はこの7月に、上尾署へ\n2回目の相談に行っている。"}, {"t": 254.78333333333333, "x": "そこで何が言われたのか。"}, {"t": 256.21666666666664, "x": "埼玉県警が自分で調べて、報告書に書いている。"}, {"t": 260.28333333333336, "x": "2000年5月22日の参議院行政監視委員会で、\n竹村議員がその報告書を読み上げている。"}, {"t": 266.25, "x": "これは議員の推測ではない。"}, {"t": 267.8333333333333, "x": "埼玉県警が作って、議員に渡した\n11ページの報告書の本文だ。"}, {"t": 272.5833333333333, "x": "警察が自分で書いたものなのね。"}, {"t": 274.8, "x": "そうだ。まず、彼女と母親が訴えた内容。"}, {"t": 277.81666666666666, "x": "「その際、被害者らは、元交際相手から\n何度も電話があり、無言電話もある」"}, {"t": 282.6166666666667, "x": "「早く元交際相手を捕まえてください」"}, {"t": 285.1, "x": "名前も出して、この人に脅かされている、\nこの人に殺されるかもしれない、と訴えている。"}, {"t": 290.68333333333334, "x": "ちゃんと、誰か言っているのね。"}, {"t": 292.6666666666667, "x": "言っている。それに対して、\n上尾署の刑事第二課長はどう答えたか。"}, {"t": 296.6333333333333, "x": "報告書の記述はこうだ。"}, {"t": 298.48333333333335, "x": "「背景を踏み込んで聴取することもなく」"}, {"t": 300.8333333333333, "x": "「告訴がなければ動けない」"}, {"t": 302.48333333333335, "x": "「嫁入り前の娘さんだし、"}, {"t": 304.06666666666666, "x": "裁判になればいろいろなことを聞かれて、\n辛い目に遭うことがいっぱいありますよ」"}, {"t": 308.45, "x": "「告訴は\nテストが終わってからでもいいんじゃないですか」"}, {"t": 311.4166666666667, "x": "……テストが終わってから。"}, {"t": 312.8666666666667, "x": "大学の試験のことだ。"}, {"t": 314.46666666666664, "x": "これに対して、彼女たちはこう言っている。"}, {"t": 316.81666666666666, "x": "同じ報告書に、そのまま書いてある。"}, {"t": 319.26666666666665, "x": "「告訴は今日ではだめなんですか」"}, {"t": 321.1666666666667, "x": "「元交際相手と接触してください。"}, {"t": 323.31666666666666, "x": "逮捕してください。家族に被害が及ぶのが怖い」"}, {"t": 326.3833333333333, "x": "「覚悟はしてきているんです」"}, {"t": 328.05, "x": "「なぜ延ばすのか理解できません」"}, {"t": 330.0, "x": "……全部、言っているじゃない。"}, {"t": 331.65, "x": "全部、言っている。そして刑事第二課長は、"}, {"t": 334.3333333333333, "x": "試験期間が終わった7月22日という日にちを\n指定して、その日に告訴をしなさい、とした。"}, {"t": 340.8666666666667, "x": "7月22日。指定された日だ。"}, {"t": 343.2, "x": "母親が上尾署を訪ねた。"}, {"t": 345.0, "x": "報告書には、刑事第二課長が\nこう述べたと書かれている。"}, {"t": 348.4166666666667, "x": "「今日は事件があって担当者がいないので、\nまた改めて来てもらえますか。"}, {"t": 352.43333333333334, "x": "電話で連絡しますので」"}, {"t": 354.2, "x": "……指定した日なのに。"}, {"t": 355.6166666666667, "x": "事情聴取は行われず、そのまま帰されている。"}, {"t": 358.51666666666665, "x": "この日の対応について、\n警察庁の刑事局長は国会でこう答えている。"}, {"t": 363.0, "x": "「被害者が御自身や家族の身の危険を\n感じておるという切実な訴えをされておったのは事実」"}, {"t": 368.4166666666667, "x": "「危害発生の見きわめを欠く、\nそして被害者の置かれた重大な切迫する事情に"}, {"t": 372.96666666666664, "x": "対する認識を持たないで応対した」"}, {"t": 375.25, "x": "「被害者のそういう切実な訴えに対する真摯な姿勢が\n全く欠如したものでありまして、国民の生命、身体、"}, {"t": 382.06666666666666, "x": "財産の保護に任ずる警察としてその応対は\nまことに不適切なものであった」"}, {"t": 386.9166666666667, "x": "警察庁が、そこまで言っているのね。"}, {"t": 389.4166666666667, "x": "言っている。同じ答弁の中で、こうも言っている。"}, {"t": 392.3666666666667, "x": "「訴えてきておるのが\n自分の娘であったならばということを\n考えるだけの、そういった心持ちで"}, {"t": 397.56666666666666, "x": "対処すべきであるというふうに指導もしておりますが、\n今回そういう点が全く欠けておる」"}, {"t": 402.73333333333335, "x": "自分の娘だったら、と。"}, {"t": 404.6333333333333, "x": "ああ。ただ、これが国会で語られるのは、\n彼女が亡くなってから7か月近くたった後だ。"}, {"t": 410.1333333333333, "x": "7月22日の時点では、まだ誰も何も言っていない。"}, {"t": 413.7, "x": "彼女と母親は、1週間後にもう\n一度、上尾署へ行っている。"}, {"t": 418.1333333333333, "x": "7月29日。三度目だ。"}, {"t": 420.28333333333336, "x": "報告書には、こう書かれている。"}, {"t": 422.1333333333333, "x": "刑事第二課長が、自分でワープロで\n作成していた告訴状を彼女に示して、"}, {"t": 426.75, "x": "署名を求めた。そして告訴を受理した。"}, {"t": 429.55, "x": "……告訴状を、警察が作ったの。"}, {"t": 431.8333333333333, "x": "そこは国会でも問題になった。"}, {"t": 433.75, "x": "竹村議員はこう聞いている。"}, {"t": 435.48333333333335, "x": "「本来、告訴状は告訴人あるいは代理人が\n作成するものではないかと思いますが、"}, {"t": 440.26666666666665, "x": "刑事第二課長が作成した告訴状なるものは\n刑訴法上告訴状と認められるんでしょうか」"}, {"t": 445.7, "x": "警察庁の刑事局長の答えはこうだ。"}, {"t": 448.21666666666664, "x": "「告訴状というのは被害者本人または"}, {"t": 450.15, "x": "代理人、ほとんどが弁護士さんでございますけれども、\nこれが作成するというのが通例でございます」"}, {"t": 455.96666666666664, "x": "「他方、刑事訴訟法二百四十一条の規定に\nよりますと、告訴は書面または"}, {"t": 460.65, "x": "口頭でしなければならないということで、\n口頭で告訴がなされることも予定されておる」"}, {"t": 465.46666666666664, "x": "「刑事訴訟法上は被害者御本人による有効な\n告訴状が提出されたものと見て差し支えないもの」"}, {"t": 471.5, "x": "法律上は、有効なのね。"}, {"t": 473.51666666666665, "x": "有効だ。ここは押さえておいてほしい。\nこの告訴は、法律の上ではちゃんと成立している。"}, {"t": 478.78333333333336, "x": "告訴の中身は、名誉毀損。"}, {"t": 480.6333333333333, "x": "犯人は誰か分からないままの、\n被疑者不詳の告訴だった。"}, {"t": 484.3333333333333, "x": "そして受理した後、彼女から事情を\n聴いて、供述調書が作られた。"}, {"t": 488.46666666666664, "x": "話した内容を警察官が文章にして、\n本人が確認して署名する書類だ。"}, {"t": 493.5, "x": "この調書の中に、彼女はこう書かれている。"}, {"t": 496.01666666666665, "x": "「告訴をいたしました」"}, {"t": 497.45, "x": "そして、「犯人は元交際相手しか考えられません」"}, {"t": 500.8666666666667, "x": "はっきり書いてあるのね。"}, {"t": 502.4, "x": "はっきり書いてある。この二か所を覚えておいてくれ。"}, {"t": 505.05, "x": "後で、両方とも書き換えられる。"}, {"t": 507.8333333333333, "x": "ここで、告訴と被害届の違いを、\nきちんと整理しておく。ここが\n分からないと、この事件は分からない。"}, {"t": 514.1666666666666, "x": "お願い。"}, {"t": 514.9333333333333, "x": "被害届は、こういう被害に\n遭いました、という届け出だ。"}, {"t": 518.3, "x": "事実の報告に近い。"}, {"t": 519.95, "x": "告訴は、それに加えて、犯人を\n処罰してくださいという意思表示が入る。"}, {"t": 524.45, "x": "だから、告訴を受けた警察には、\n被害届より重い手続きがぶら下がる。"}, {"t": 529.15, "x": "どんな。"}, {"t": 529.9166666666666, "x": "埼玉県警の手順を、警察庁の刑事局長が\n国会で説明している。そのまま読む。"}, {"t": 535.4166666666666, "x": "「埼玉県警察におきましては、"}, {"t": 537.35, "x": "警察署で告訴を受理した場合には、\n本部報告のための書類を作成しまして、これは"}, {"t": 542.55, "x": "告訴事件受理報告書、これは\n告訴状の写しを添付しますが」"}, {"t": 546.45, "x": "「これを実務的には署長の決裁を得て、\nそして担当の課長、この場合は"}, {"t": 550.6833333333333, "x": "刑事二課長になりますが、これが\n速やかに警察本部の主管課へ\n提出するというのが手順でございます」"}, {"t": 556.9666666666667, "x": "署の中で終わらないのね。本部に上がる。"}, {"t": 559.5166666666667, "x": "上がる。つまり、告訴を受理すると、\nその事件は署の外から見える状態になる。"}, {"t": 564.25, "x": "それから、告訴事件は"}, {"t": 566.0166666666667, "x": "速やかに処理しなければならないという\n内部の規定もある。これも国会で答弁されている。"}, {"t": 570.8333333333334, "x": "じゃあ、告訴で受けると、署としては\n仕事が増えるし、逃げ場もなくなるのね。"}, {"t": 575.4333333333333, "x": "そういうことになる。"}, {"t": 576.6, "x": "逆に、被害届で受けたことにすれば、本部に\n報告する義務も、速やかに処理する義務も、外れる。"}, {"t": 583.05, "x": "……それって。"}, {"t": 583.9166666666666, "x": "ああ。この事件で実際に起きたのは、それだ。"}, {"t": 587.3666666666667, "x": "8月31日ごろ。刑事第二課長が、上尾署の刑事・\n生活安全担当次長の決裁を受けに行っている。"}, {"t": 594.3333333333334, "x": "決裁というのは、上司に\n書類を見せて判子をもらうことだ。"}, {"t": 597.8166666666667, "x": "そのとき、次長が\n被疑者不詳の告訴状を見て、こう言った。"}, {"t": 601.5166666666667, "x": "「被疑者が特定されていなければ、\nまず被害届を取り、それで捜査を進め、"}, {"t": 606.0, "x": "被疑者を特定した時点で告訴状を取ってもよかった」"}, {"t": 609.4166666666666, "x": "それって、一般論として言ったのかしら。"}, {"t": 612.1, "x": "そう読める言い方だ。ここから\n先が、埼玉県警の報告書の文章だ。"}, {"t": 616.5166666666667, "x": "私の言葉じゃない。"}, {"t": 617.9166666666666, "x": "「この発言を聞いた刑事第二課長は、"}, {"t": 620.0833333333334, "x": "本件名誉毀損事件についても、"}, {"t": 622.1833333333333, "x": "被害者から被害届の提出を受けてこれに\nより捜査をしていたこととすれば、"}, {"t": 626.6, "x": "告訴受理の事実を県警本部に報告する義務を回避し、"}, {"t": 630.0333333333333, "x": "告訴事件としての迅速な事件処理の義務も\n免れることができると考えた」"}, {"t": 634.95, "x": "……報告しなくて済む。"}, {"t": 636.1666666666666, "x": "急がなくても済む。"}, {"t": 637.6666666666666, "x": "報告書は、この考えについてこう書いている。"}, {"t": 640.3, "x": "「極めて不当なものであった」"}, {"t": 642.0833333333334, "x": "この時点で、告訴状はもう彼女の署名入りで\n存在している。供述調書もある。"}, {"t": 646.9666666666667, "x": "紙は全部そろっている。"}, {"t": 648.2833333333333, "x": "あとは、それを本部に上げるだけだった。"}, {"t": 650.8333333333334, "x": "上げなかったのね。"}, {"t": 652.1, "x": "上げなかった。そのかわりに、紙のほうを直した。"}, {"t": 655.75, "x": "1999年9月7日。この日が、この回の中心だ。"}, {"t": 660.0833333333334, "x": "何が起きたのか、警察庁の刑事局長が\n国会で説明している。"}, {"t": 664.15, "x": "2000年5月22日、\n参議院行政監視委員会の答弁だ。そのまま読む。"}, {"t": 669.25, "x": "「九月七日に改めて被害者から被害届を受理して、"}, {"t": 672.55, "x": "捜査員がその前にできておりました\n供述調書の記載の中の、\n告訴をいたしました、という記載の、"}, {"t": 678.5, "x": "告訴、の部分を、届出、に書きかえ」"}, {"t": 681.4, "x": "告訴、を、届出。"}, {"t": 683.1, "x": "二文字を、二文字に置き換えた。"}, {"t": 684.9833333333333, "x": "答弁は続く。「また、犯人は"}, {"t": 687.0666666666667, "x": "元交際相手しか考えられません、という記載を、"}, {"t": 689.8333333333334, "x": "元交際相手の仕業だと思いました、と\n書きかえるなどの改ざんを行ったもの」"}, {"t": 694.75, "x": "……そっちも変えたのね。"}, {"t": 696.1833333333333, "x": "ああ。「犯人は元交際相手しか\n考えられません」から、「\n元交際相手の仕業だと思いました」へ。"}, {"t": 702.35, "x": "言い切りが、感想になっているわ。"}, {"t": 704.5, "x": "そうだ。断定が推測に落とされている。\nこの二つは、性質が違う書き換えだ。"}, {"t": 709.5166666666667, "x": "一つ目は、手続きを軽くするための書き換え。"}, {"t": 712.2833333333333, "x": "告訴を、届出にする。"}, {"t": 714.0, "x": "二つ目は、証拠としての強さを\n弱める書き換えだ。この人しか"}, {"t": 717.8333333333334, "x": "考えられない、という証言が、\nそう思いました、になる。"}, {"t": 721.45, "x": "本人は、そんなこと言っていないのに。"}, {"t": 723.9, "x": "本人が署名した後の書類だ。"}, {"t": 725.7666666666667, "x": "彼女はこの書き換えを知らない。"}, {"t": 727.6333333333333, "x": "この日、被害届も新しく取られている。"}, {"t": 730.2, "x": "名誉毀損の被害届だ。"}, {"t": 732.0833333333334, "x": "その被害届の、犯人の住所・氏名を書く\n欄について、刑事局長はこう答えている。"}, {"t": 737.4833333333333, "x": "「この欄には何ら記載がされておりません」"}, {"t": 739.9833333333333, "x": "空白。"}, {"t": 740.7833333333333, "x": "空白だ。7月29日の調書には名前があった。"}, {"t": 744.0666666666667, "x": "9月7日の被害届には、無い。"}, {"t": 747.0833333333334, "x": "書き換えた調書は、そのまま消えたわけじゃない。"}, {"t": 749.6666666666666, "x": "上司のところへ回っている。"}, {"t": 751.3833333333333, "x": "9月9日。刑事第二課長は、その供述調書を告訴状と\n一緒に、副署長と署長に報告して決裁を受けている。"}, {"t": 758.9166666666666, "x": "告訴状も一緒に出したの。"}, {"t": 760.8, "x": "出している。だから、署長の机の上には\n「告訴状」という紙と、"}, {"t": 764.95, "x": "「届出」と書き直された調書が、\n同時に載っていたことになる。"}, {"t": 769.0, "x": "……並べて見たら、おかしいって\n分かるんじゃないの。"}, {"t": 771.7, "x": "竹村議員も同じことを聞いている。"}, {"t": 773.65, "x": "刑事局長の答えはこうだ。"}, {"t": 775.5166666666667, "x": "「決裁は上げておりますけれども細かな"}, {"t": 777.5666666666667, "x": "調書の内容まで点検していないということで、それに"}, {"t": 780.5333333333333, "x": "気づかずに決裁をしておるというのは\n議員御指摘のとおりでございます」"}, {"t": 784.5, "x": "読んでいなかった、ということ。"}, {"t": 786.45, "x": "中身までは見ていない、ということだ。\n判子は押された。"}, {"t": 789.6833333333333, "x": "そして、本部への報告はどうなったか。"}, {"t": 792.0166666666667, "x": "刑事局長の答弁だ。"}, {"t": 793.65, "x": "「今回の事案におきましては、"}, {"t": 795.3166666666667, "x": "告訴を受理した刑事第二課長がみずから"}, {"t": 797.7666666666667, "x": "作成しなければならない本部報告用の書類をそもそも\n作成していない、そして本部への報告も怠った」"}, {"t": 804.0333333333333, "x": "作っていない。だから、この告訴は\n埼玉県警本部から見えない事件のままになった。"}, {"t": 809.1666666666666, "x": "ここに、もう一つ悪い偶然が重なる。"}, {"t": 811.55, "x": "決裁が上がった翌日、9月10日付で、\n人が入れ替わっている。"}, {"t": 815.7333333333333, "x": "「警察署長、副署長、それから刑事・"}, {"t": 818.3, "x": "生安担当の次長、この三名の上司というのは\n刑事二課長が本部報告の手続を\n行っているか否かというものを"}, {"t": 824.8666666666667, "x": "監督すべき立場にあるわけでありますけれども、"}, {"t": 827.55, "x": "事件報告の決裁が上がった\n直後の九月十日付で三名とも異動をしておる」"}, {"t": 832.4, "x": "三人とも。"}, {"t": 833.45, "x": "監督する立場の人が、判子を押した\n翌日に、まとめていなくなった。"}, {"t": 837.9333333333333, "x": "後任はこうだ。「これらの後任者についてはそもそも"}, {"t": 840.7833333333333, "x": "刑事二課長が事件の報告を行っていないということから\nこれ自体の存在を知りませんで、"}, {"t": 845.7833333333333, "x": "本部報告がなされていないということを\n全然知らなかった」"}, {"t": 849.3666666666667, "x": "新しい人は、事件があること自体を知らないのね。"}, {"t": 852.65, "x": "知らない。刑事局長は"}, {"t": 854.2, "x": "「大変重要な事件として個別に\n引き継ぐということもされていなかった」とも\n言っている。"}, {"t": 859.35, "x": "紙は上尾署にある。だが、それを\n追いかける人が、誰もいなくなった。"}, {"t": 864.15, "x": "9月21日。上尾署の署員が、彼女の家を訪ねている。"}, {"t": 868.0833333333334, "x": "そこで、告訴の取り下げを求めた。"}, {"t": 870.5, "x": "……取り下げ。"}, {"t": 871.35, "x": "告訴を、無かったことにしてくださいという話だ。"}, {"t": 874.2666666666667, "x": "母親は断っている。"}, {"t": 875.8, "x": "この場のやりとりの細かいところは\n報道が伝えているもので、"}, {"t": 879.05, "x": "私は一次資料に行き着いていない。だから\n細部は言わない。"}, {"t": 882.5833333333334, "x": "ただ、取り下げを求めたという事実そのものは、\n翌年3月の参議院予算委員会で\n警察庁長官が認めている。"}, {"t": 889.6833333333333, "x": "「上尾警察署の刑事第二課員が告訴の取り下げを\n依頼したと受けとめられるような不適切な"}, {"t": 894.9333333333333, "x": "発言をしたことが判明いたしました」"}, {"t": 897.3166666666667, "x": "告訴の取り下げを、依頼した。"}, {"t": 899.4, "x": "ここで一つ、法律の話をしておく。"}, {"t": 901.8, "x": "告訴の取り下げには、重い効果がある。"}, {"t": 904.2666666666667, "x": "刑事訴訟法では、告訴を取り消した人は、\nその事件について、もう一度告訴することができない。"}, {"t": 910.4, "x": "一度やめたら、二度目は無いの。"}, {"t": 912.4833333333333, "x": "無い。そして名誉毀損は親告罪だ。"}, {"t": 914.8333333333334, "x": "告訴が無ければ起訴できない。"}, {"t": 916.6833333333333, "x": "つまり、彼女がここで取り下げていたら、\nこの名誉毀損事件は、法律上、"}, {"t": 921.15, "x": "二度と処罰できない事件になっていた。"}, {"t": 923.65, "x": "断ってくれてよかった、という言い方も変だけど。"}, {"t": 926.85, "x": "母親が断ったことで、告訴そのものは\n残った。紙は残った。"}, {"t": 931.0333333333333, "x": "残ったが、動かなかった。"}, {"t": 932.7, "x": "10月には、自宅の周りで車が騒音を\n立てる嫌がらせが続いている。"}, {"t": 936.9166666666666, "x": "父親が通報したが、警察官は確認できなかった。"}, {"t": 941.1166666666667, "x": "ここで一度、当時の警察の考え方の話をしておきたい。"}, {"t": 944.9, "x": "1999年の日本に、ストーカーを\n取り締まる法律は無かった。"}, {"t": 949.4666666666667, "x": "一つも。"}, {"t": 950.3833333333333, "x": "ストーカーという言葉が入った法律が、\n一本も無かった。だから、つきまとい\n自体を罰する条文が無い。"}, {"t": 956.6333333333333, "x": "使えるのは、既にある罪に当てはまったときだけだ。"}, {"t": 959.6666666666666, "x": "名誉毀損、脅迫、傷害、住居侵入。そういうものだ。"}, {"t": 963.6666666666666, "x": "この事件で警察が扱ったのも、\nストーカー行為ではなく、名誉毀損だった。"}, {"t": 968.4333333333333, "x": "そしてもう一つ、当時の現場には\n「民事不介入」という言葉があった。"}, {"t": 972.8666666666667, "x": "男女のもめごと、金の貸し借り、\n近所の争い。そういうものには警察は\n立ち入らない、という考え方だ。"}, {"t": 979.3333333333334, "x": "2000年3月7日の参議院予算委員会で、\n北岡秀二議員がこう述べている。"}, {"t": 984.2, "x": "「私は、この事件に関連しても、"}, {"t": 986.35, "x": "民事不介入という\n大きな壁があったのではないかということを\n推測するものでございます」"}, {"t": 991.45, "x": "壁、という言い方をしているのね。"}, {"t": 993.6333333333333, "x": "4月18日の衆議院地方行政委員会では、\n中川正春議員が、もっと踏み込んでこう述べている。"}, {"t": 999.9166666666666, "x": "「その問題は民事不介入なのでちょっと\nそれ以上は行けないんだという、"}, {"t": 1003.55, "x": "自分の心に言い聞かす大義名分になっている」"}, {"t": 1006.4833333333333, "x": "そして、これは桶川だけの話ではなかった。"}, {"t": 1009.2333333333333, "x": "4月17日の参議院行政監視委員会で、\n竹村議員が兵庫県の事件を取り上げている。"}, {"t": 1015.0, "x": "「桶川事件の約九カ月前、九九年二月、全く\n同種の事件が兵庫県で起きていたわけなんですね」"}, {"t": 1021.6833333333333, "x": "「被害者の女性は、何度も何度も警察に駆け込み、"}, {"t": 1024.8, "x": "告訴しようとしたけれども取り合ってもらえず、\nこの場合は告訴をついにしないで殺されてしまった」"}, {"t": 1030.3166666666666, "x": "九か月前。"}, {"t": 1031.4833333333333, "x": "1998年12月、その女性は診断書を持って\n交番へ行っている。傷害の届け出だ。"}, {"t": 1037.55, "x": "ところが、告訴はされなかった。"}, {"t": 1039.45, "x": "議員の言葉だ。「告訴が\n誓約書に変えられてしまった」"}, {"t": 1043.0, "x": "誓約書。"}, {"t": 1043.95, "x": "二度と殴らない、つきまとわない。"}, {"t": 1045.8333333333333, "x": "破ったら訴えられても文句を\n言わない。そういう内容の紙だ。"}, {"t": 1049.6, "x": "後に警察庁の生活安全局長が、\n担当の警部補について、こう説明している。"}, {"t": 1054.75, "x": "「こうした認識を欠いたまま報告を怠っておりまして、\n極めて不適切な取り扱いであった」"}, {"t": 1060.45, "x": "……また、本署に報告していないのね。"}, {"t": 1062.8833333333334, "x": "告訴を、別の紙に変える。\nそして報告しない。桶川と同じ形だ。"}, {"t": 1067.4833333333333, "x": "この兵庫の女性は、1999年2月に亡くなっている。"}, {"t": 1071.4, "x": "桶川の8か月ほど前だ。"}, {"t": 1073.9833333333333, "x": "1999年10月26日。"}, {"t": 1076.8, "x": "場所は埼玉県桶川市、JR高崎線の桶川駅西口。"}, {"t": 1080.8666666666666, "x": "駅前の大型ショッピングセンターの前の路上だ。"}, {"t": 1083.7666666666667, "x": "竹村議員は国会でこう述べている。"}, {"t": 1085.8333333333333, "x": "「若い女性が突然男性に\n刃物のようなもので刺殺された」"}, {"t": 1089.5333333333333, "x": "状況の描写は、ここまでにする。"}, {"t": 1091.8, "x": "……昼間の、駅前で。"}, {"t": 1093.35, "x": "人通りのある場所だ。"}, {"t": 1094.6, "x": "彼女は搬送されたが、亡くなった。21歳だった。"}, {"t": 1098.15, "x": "警察庁長官は、翌年3月の予算委員会で\nこの事件をこう説明している。"}, {"t": 1103.15, "x": "「埼玉県警が名誉毀損罪で"}, {"t": 1105.0833333333333, "x": "告訴を受けまして、その捜査中に告訴人の女子大生が\n刺殺されたという事案でございます」"}, {"t": 1110.6, "x": "告訴人、という言い方をしているのね。"}, {"t": 1113.0333333333333, "x": "そこは正確な言い方だ。"}, {"t": 1114.5333333333333, "x": "彼女は、被害者であると同時に、\n埼玉県警に対して告訴をしている人だった。"}, {"t": 1119.75, "x": "長官はこう続けている。"}, {"t": 1121.15, "x": "「まことに残念でございます。また、"}, {"t": 1123.3, "x": "被害者の方に心から御冥福を\nお祈り申し上げますとともに、"}, {"t": 1127.0, "x": "御家族の皆様にお見舞い申し上げたいと存じます」"}, {"t": 1130.1333333333334, "x": "この答弁が行われたのは、2000年3月7日。"}, {"t": 1133.2833333333333, "x": "事件から4か月以上たっている。"}, {"t": 1136.0833333333333, "x": "殺人事件の捜査は動いた。"}, {"t": 1137.8833333333334, "x": "12月には、実行に関わったとされる\n人物たちが逮捕されている。"}, {"t": 1142.2833333333333, "x": "その取り調べの中で、\n名誉毀損のほうにも話がつながった。"}, {"t": 1146.1666666666667, "x": "2000年3月7日、警察庁の刑事局長が\n経緯を説明している。読む。"}, {"t": 1151.0833333333333, "x": "「十二月十九日から二十日にかけて、この殺人事件で"}, {"t": 1154.4666666666667, "x": "逮捕した被疑者連中の供述に\nよって、この自殺した男が\n名誉毀損の犯人でもあるということが確定できまして、"}, {"t": 1161.3333333333333, "x": "一月下旬に至り、この男を直ちに指名手配をした」"}, {"t": 1165.05, "x": "一月下旬。"}, {"t": 1166.15, "x": "名誉毀損の告訴が出されてから、6か月がたっている。"}, {"t": 1169.6333333333334, "x": "そして指名手配の直後だ。"}, {"t": 1171.3166666666666, "x": "「同人が北海道に潜伏しておる可能性が\n高いという情報を得ましたことから、"}, {"t": 1175.8666666666666, "x": "北海道警察と緊密に連絡を\nとりながら追跡をしたところ、"}, {"t": 1179.75, "x": "一月二十八日に被疑者が前日にもはや\n自殺をしておったということが判明した」"}, {"t": 1185.0333333333333, "x": "前の日に。"}, {"t": 1185.9666666666667, "x": "1月27日に北海道の屈斜路湖で亡くなっていて、\n警察がそれを知ったのが28日だ。"}, {"t": 1191.9666666666667, "x": "この人物は、名誉毀損事件の被疑者として\n指名手配されただけで、裁判は\n開かれていない。判決も無い。"}, {"t": 1198.7, "x": "だから私は、この人を犯人とは書かない。"}, {"t": 1201.3333333333333, "x": "「被疑者として指名手配された人物」までだ。"}, {"t": 1204.4166666666667, "x": "本人がいないと、もう聞けないのね。"}, {"t": 1206.7666666666667, "x": "竹村議員は「これでもうすべてが\nやみの中に入ってしまったと言っても\n過言ではない」と述べている。"}, {"t": 1212.4166666666667, "x": "一方で、殺人事件そのものは裁判になっている。\nここは確定した判決の範囲だけを話す。"}, {"t": 1218.3666666666666, "x": "実際に手を下した人物に、懲役18年。"}, {"t": 1221.3166666666666, "x": "車を運転していた人物に、懲役15年。"}, {"t": 1224.1666666666667, "x": "見張りをしていた人物に、懲役15年。"}, {"t": 1226.95, "x": "そして、この殺害を実行させたとされる\n人物に、無期懲役。この人は、"}, {"t": 1231.65, "x": "亡くなった元交際相手の兄にあたる。"}, {"t": 1234.2166666666667, "x": "四人が裁かれたのね。"}, {"t": 1235.8166666666666, "x": "確定している。刑の重さは、2006年3月31日の\nさいたま地方裁判所の民事の判決文に書かれている。"}, {"t": 1242.9333333333334, "x": "刑事の判決文そのものには、私は\nたどり着けていない。だから刑の重さだけを言う。"}, {"t": 1248.1833333333334, "x": "それから、これは大事な話だ。\nこの四人の裁判で裁かれたのは、"}, {"t": 1252.1833333333334, "x": "1999年10月26日に何が行われたか、だ。"}, {"t": 1256.65, "x": "上尾署がその前の3か月に何をしたかは、\nこの裁判では裁かれていない。"}, {"t": 1261.2333333333333, "x": "別の場所で問われたのね。"}, {"t": 1262.9666666666667, "x": "ああ。国会と、内部調査と、もう一つの裁判でだ。"}, {"t": 1267.15, "x": "2000年3月7日、参議院予算委員会 第6号。"}, {"t": 1270.6666666666667, "x": "国会会議録に全文が残っている。"}, {"t": 1273.0666666666666, "x": "この日、警察はもう一つ別の件でも追及されていた。"}, {"t": 1276.4833333333333, "x": "新潟県警の問題だ。"}, {"t": 1278.2166666666667, "x": "竹村議員は、財政投融資の質問を終えてから、\nこう切り出している。"}, {"t": 1282.5, "x": "「さて、警察関係のことがいろいろと\n取りざたされておりまして、"}, {"t": 1286.05, "x": "新潟県警の問題がいろいろ\n予算委員会で追及をされております」"}, {"t": 1290.1, "x": "「昨年十月にこんな事件がありました」"}, {"t": 1292.6, "x": "そこから、桶川の経過を順番に読み上げていく。"}, {"t": 1295.5, "x": "1月の交際開始、6月の金銭要求、\n7月のビラ、7月29日の告訴。"}, {"t": 1301.55, "x": "一つずつ、日付を挙げて。"}, {"t": 1303.5333333333333, "x": "挙げている。そして、こう聞いた。"}, {"t": 1305.4166666666667, "x": "「これは事実でしょうか、どうでしょうか」"}, {"t": 1307.6166666666666, "x": "答えたのは、警察庁長官だ。"}, {"t": 1309.7, "x": "彼は1月11日に長官に就任したばかりだった。"}, {"t": 1313.2333333333333, "x": "「それが事実であるのか\nどうかということにつきましては\n目下埼玉県警におきまして調査中でございます」"}, {"t": 1319.25, "x": "調査中。"}, {"t": 1320.1333333333334, "x": "この日はそこまでだった。"}, {"t": 1321.5166666666667, "x": "長官はこう続けている。"}, {"t": 1323.1333333333334, "x": "「やはり警察の敷居は"}, {"t": 1324.5, "x": "高いというような御意識が一般の皆さんにはあると"}, {"t": 1326.9666666666667, "x": "思います。その敷居が高いということを\n意識されながらお見えになるわけでありますから、"}, {"t": 1331.7666666666667, "x": "本当に真摯にこれを受けとめて」"}, {"t": 1333.85, "x": "ここまでは、よくある答弁だ。"}, {"t": 1335.6333333333334, "x": "問題はこの後に起きる。"}, {"t": 1337.8833333333334, "x": "竹村議員が、質問を変えた。"}, {"t": 1340.0333333333333, "x": "「この三度の訴えをいいかげんに\nあしらった刑事さんは今どのような立場に、"}, {"t": 1343.95, "x": "どのような職についてどんな仕事をしておられますか」"}, {"t": 1347.1166666666666, "x": "あの人は今どこにいるのか、ということね。"}, {"t": 1349.7833333333333, "x": "そうだ。答えたのは警察庁の刑事局長だった。"}, {"t": 1353.0, "x": "「まことに恐縮でございますが、現在、担当、何を\n担当しておるかということは存じておりません」"}, {"t": 1358.8166666666666, "x": "「ただ、一言申し上げますのは、"}, {"t": 1360.8166666666666, "x": "言いわけになりますけれども、\n詳細、いいかげんに扱ったということは"}, {"t": 1364.7666666666667, "x": "私どもはないものと承知しております」"}, {"t": 1367.05, "x": "「告訴に関しては告訴の下書きもして、\nいろんな注意事項をお与えして\n告訴を受理し、そして連絡すべきは"}, {"t": 1373.4666666666667, "x": "連絡をとり、そういうふうに\n対処していたものというふうに信じておる」"}, {"t": 1377.1833333333334, "x": "……告訴を受理して、連絡もとっていた。"}, {"t": 1379.7, "x": "3月7日の時点では、警察庁はそう説明している。\nこの答弁が事実と違うことが分かるのは、2か月後だ。"}, {"t": 1386.7333333333333, "x": "竹村議員が返した。「想像で物を言ってもらっちゃ\n困ります、予算委員会の質問ですからね」"}, {"t": 1392.5166666666667, "x": "「私はちょっと急でしたけれども\n予告をしているわけですから、\nなぜ調べてくれないんですか」"}, {"t": 1397.6666666666667, "x": "これに対する刑事局長の答えが、これだ。"}, {"t": 1400.45, "x": "「怠慢でございました」"}, {"t": 1401.9833333333333, "x": "……それだけ。"}, {"t": 1402.8833333333334, "x": "それだけだ。会議録には、この一行しか無い。"}, {"t": 1405.8333333333333, "x": "ここは誤解されやすいので、\nはっきり言っておく。これは"}, {"t": 1408.8833333333334, "x": "「警察の対応が怠慢でした」と認めた発言ではない。"}, {"t": 1412.55, "x": "違うの。"}, {"t": 1413.3833333333334, "x": "直前の質問は\n「なぜ調べてくれないんですか」だ。つまり、"}, {"t": 1417.1, "x": "下調べをしていなかったことについて、\n怠慢でした、と答えている。"}, {"t": 1421.3666666666666, "x": "竹村議員はこう言った。"}, {"t": 1422.75, "x": "「質問できません。\nとんでもないですよ。質問できません」"}, {"t": 1426.2833333333333, "x": "会議録には、この後に\n「発言する者あり」と書かれている。"}, {"t": 1430.0, "x": "委員会が騒がしくなった、ということだ。"}, {"t": 1432.6666666666667, "x": "そして委員長が言う。「速記をとめて」"}, {"t": 1435.1, "x": "速記を止める。"}, {"t": 1436.2333333333333, "x": "国会の議事録は、速記で記録される。それを\n止めるのは、記録に残さずに調整するときだ。"}, {"t": 1442.0833333333333, "x": "しばらくして、「速記を起こして」。"}, {"t": 1443.9666666666667, "x": "刑事局長が言い直した。"}, {"t": 1445.7166666666667, "x": "「ただいまのお答えはまことに不適切でございました。"}, {"t": 1448.6, "x": "急に御質問を受けたために\nお答えをできませんでした。"}, {"t": 1451.6666666666667, "x": "失礼いたしました」"}, {"t": 1453.2333333333333, "x": "それで収まったの。"}, {"t": 1454.5833333333333, "x": "収まっていない。委員長がまた\n「速記をとめて」と言う。二度目だ。"}, {"t": 1458.6833333333334, "x": "再開して、今度は警察庁長官が立った。"}, {"t": 1461.5, "x": "「刑事局長の怠慢という答弁、まことに\n不適切で心からおわびを申し上げます」"}, {"t": 1466.5666666666666, "x": "そしてまた「発言する者あり」。"}, {"t": 1468.55, "x": "三度目の「速記をとめて」だ。"}, {"t": 1470.9166666666667, "x": "三回も止まったのね。"}, {"t": 1472.5166666666667, "x": "最後に委員長はこう言って、質疑を打ち切っている。"}, {"t": 1475.3333333333333, "x": "「竹村泰子君の残余の時間は留保いたします」"}, {"t": 1478.3666666666666, "x": "この日の質疑は、最後まで終わらなかった。"}, {"t": 1481.6666666666667, "x": "3月10日。国会が止まった三日後だ。"}, {"t": 1484.3833333333334, "x": "埼玉県警が、専従の調査チームを作った。"}, {"t": 1487.4166666666667, "x": "10日後の3月17日、警察庁長官が\n参議院予算委員会の冒頭で報告に\n立っている。そのまま読む。"}, {"t": 1494.2166666666667, "x": "「埼玉県警察におきましては、今月に入り、"}, {"t": 1497.15, "x": "国会での御論議を踏まえながら、"}, {"t": 1499.0, "x": "被害者の御両親に確認をするなど\n改めて調査したところ、"}, {"t": 1502.6333333333334, "x": "名誉毀損事件の捜査を担当していた\n上尾警察署の刑事第二課員が\n告訴の取り下げを依頼したと"}, {"t": 1508.4333333333334, "x": "受けとめられるような不適切な\n発言をしたことが判明いたしました」"}, {"t": 1512.5333333333333, "x": "国会での議論を踏まえながら、と言っているわね。"}, {"t": 1515.4833333333333, "x": "ああ。国会で追及されたから\n調べ直した、と自分で言っている。"}, {"t": 1519.3833333333334, "x": "「埼玉県警察では、三月十日、"}, {"t": 1521.75, "x": "刑事部参事官を長として、"}, {"t": 1523.4666666666667, "x": "刑事部門及び監察部門の十二名から成る\n専従の調査チームを設置したところであります」"}, {"t": 1528.9, "x": "「この調査チームは、被害者の訴えに警察が的確に\n対応できたのかどうかを検証することを目的とし」"}, {"t": 1535.2666666666667, "x": "そして、3月17日の\n時点までにやったことが挙げられている。"}, {"t": 1539.2333333333333, "x": "「被害者の御家族から四回にわたり\n数時間ずつ事情を聴取させていただき、"}, {"t": 1543.5166666666667, "x": "一連の過程に加わった上尾署員十一名から\n延べ二十回以上の事情聴取を行い」"}, {"t": 1548.6833333333334, "x": "署員十一人。二十回以上。"}, {"t": 1550.8333333333333, "x": "一つの警察署の、一つの事件についてだ。"}, {"t": 1553.85, "x": "ただ、この日はまだ結論が出ていない。"}, {"t": 1556.05, "x": "長官はこう言っている。"}, {"t": 1557.4666666666667, "x": "「関係者からの事情聴取がすべて"}, {"t": 1559.25, "x": "終了しておらず、また、それぞれの聴取内容が\n一致しない点もあることから、\nいまだ事実関係の確定には"}, {"t": 1565.7166666666667, "x": "至っておりません」"}, {"t": 1566.8666666666666, "x": "話が食い違っているのね。"}, {"t": 1568.7333333333333, "x": "食い違っている。長官は後に、\n別の委員会でこうも言っている。"}, {"t": 1572.4833333333333, "x": "「当事者であります警察官の言い分と\n申しますか供述というのが、"}, {"t": 1576.25, "x": "私どもとしても腑に落ちないというところがございます」"}, {"t": 1580.0833333333333, "x": "2000年4月6日。"}, {"t": 1581.4, "x": "埼玉県警が調査の結果を公表した。"}, {"t": 1584.1166666666666, "x": "報告書の題は「埼玉県桶川市に於ける\n女子大生殺人事件をめぐる調査報告書」。"}, {"t": 1589.6666666666667, "x": "同じ日、県警本部長が記者会見で謝罪し、\nその日の夕方に遺族の家を訪ねて謝罪している。"}, {"t": 1595.8, "x": "認めたのね。"}, {"t": 1596.9166666666667, "x": "認めた。告訴状と供述調書の改ざん。"}, {"t": 1599.55, "x": "証拠品についての虚偽の書類の作成。"}, {"t": 1602.1166666666666, "x": "そして処分が出た。上尾署の刑事第二課長、\n係長、課員の3人が懲戒免職。"}, {"t": 1607.5666666666666, "x": "県警本部長以下12人が、減給や\n戒告の処分を受けている。"}, {"t": 1611.5833333333333, "x": "ただし、この人数の内訳の出どころは報道だ。"}, {"t": 1614.4, "x": "当時の県警の発表資料そのものには、\n私はたどり着けていない。"}, {"t": 1618.65, "x": "国会には出てこないの。"}, {"t": 1620.3, "x": "処分の数については、4月20日の衆議院の分科会で、"}, {"t": 1623.7833333333333, "x": "地元選出の若松謙維議員が\n「今回の県警の十二名の処分」と\n言っている。ここは会議録で確認できる。"}, {"t": 1631.0, "x": "この議員は、上尾警察署も桶川も自分の選挙区だと\n述べたうえで、こう質問している。"}, {"t": 1636.3333333333333, "x": "「上尾警察署の担当課長が全く調書を\nつくっていないとか、さまざまな、\nいわゆる書類改ざんとか、"}, {"t": 1642.2333333333333, "x": "全くあってはいけないことが次から次へと露呈した」"}, {"t": 1645.5833333333333, "x": "地元の議員が、そう言うのね。"}, {"t": 1647.6333333333334, "x": "ああ。そして竹村議員は、この報告書を\n受け取って、5月の委員会でこう述べている。"}, {"t": 1652.75, "x": "「人一人の命がかかり、しかも警察がきちんと\n取り合っていればこの◯◯さんという方は"}, {"t": 1657.8333333333333, "x": "亡くならなくてもよかったのではないかという\n人の命の重さを考えますと、"}, {"t": 1661.8833333333334, "x": "余りにもこの十一ページの報告書というのは\n簡単過ぎて」"}, {"t": 1665.5, "x": "いまの◯◯のところには、実名が入っている。\nこの番組では伏せて読んでいる。"}, {"t": 1670.1333333333334, "x": "十一ページ。"}, {"t": 1671.2333333333333, "x": "十一ページだ。"}, {"t": 1672.95, "x": "2000年5月8日、参議院行政監視委員会。ここで\n初めて、何が罪になったのかが国会で説明される。"}, {"t": 1679.8833333333334, "x": "3人は懲戒免職になっただけではない。"}, {"t": 1682.3333333333333, "x": "刑事事件として起訴されている。"}, {"t": 1684.2166666666667, "x": "罪名は、虚偽有印公文書作成と、その行使だ。"}, {"t": 1687.8166666666666, "x": "警察の書類は、公文書なのね。"}, {"t": 1690.1833333333334, "x": "そうだ。それに嘘を書けば犯罪になる。"}, {"t": 1692.6333333333334, "x": "警察庁の刑事局長は、問題になった事実は\n「大きく分けて二点」あると述べた。一つずつ読む。"}, {"t": 1699.0833333333333, "x": "一点目。「名誉毀損事件の捜査を\n担当しておった係員が既に"}, {"t": 1703.1, "x": "告訴を受理しておるにもかかわらず、この告訴を\n受理していなかったということにした上、"}, {"t": 1707.65, "x": "被害届を受けてそれでもって\n捜査をしたような形で捜査を進めよう」"}, {"t": 1711.85, "x": "「ということで、この係員が独断で、"}, {"t": 1714.0833333333333, "x": "既にとっておりました\n被害者の供述調書の中の告訴という\n部分を届け出に変えるというようなことで"}, {"t": 1719.7, "x": "調書を改ざんした」"}, {"t": 1721.1, "x": "これが、9月7日の書き換えね。"}, {"t": 1723.4, "x": "そうだ。ここで「独断で」と\n言っているのが一点目の特徴だ。"}, {"t": 1727.1666666666667, "x": "一人でやった、という説明になっている。"}, {"t": 1729.8333333333333, "x": "二点目は、性質が違う。こちらは複数だ。読む。"}, {"t": 1733.2666666666667, "x": "「この名誉毀損事件の証拠品である名誉を毀損する\nビラでございますが、この八枚につきまして、捜査上は"}, {"t": 1739.4666666666667, "x": "当然これは領置手続というのを\nとらなきゃいけないわけですけれ"}, {"t": 1742.55, "x": "ども、これを怠った」"}, {"t": 1744.2333333333333, "x": "「という手続上のミスを隠ぺいするということで、"}, {"t": 1746.8333333333333, "x": "今度は刑事二課長、係長、"}, {"t": 1748.8, "x": "係員三人が一緒になって、\nこのビラ八枚を領置したんだという\n内容を含む捜査書類五通を作成した」"}, {"t": 1755.35, "x": "領置って。"}, {"t": 1756.3, "x": "任意で出された物を、警察が\n証拠として預かる手続きだ。"}, {"t": 1759.8333333333333, "x": "書類を作って、記録に残す。"}, {"t": 1761.8666666666666, "x": "ビラ8枚について、それを取っていなかった。"}, {"t": 1764.75, "x": "それを隠すために。"}, {"t": 1766.15, "x": "ちゃんと預かっていました、という\n書類を、5通作った。今度は3人でだ。"}, {"t": 1770.65, "x": "刑事局長はこの二つをまとめて、こう言っている。"}, {"t": 1773.5333333333333, "x": "「まことに捜査に携わる者としては\n信じがたい、あり得べからざることが現実に起こった」"}, {"t": 1778.9, "x": "あり得べからざること。"}, {"t": 1780.3166666666666, "x": "あってはならない、という意味だ。"}, {"t": 1781.95, "x": "警察庁の局長が、国会でそう言った。"}, {"t": 1784.7, "x": "起訴された3人の裁判は、\n2000年9月に判決が出ている。"}, {"t": 1788.5, "x": "元刑事二課長と元係長に懲役1年6\nか月、元課員に懲役1年2か月。"}, {"t": 1793.9833333333333, "x": "3人とも執行猶予3年。この判決の原本にも\n私は行き着いていない。報道による。"}, {"t": 1799.6166666666666, "x": "もう一つ、刑事局長は、"}, {"t": 1801.35, "x": "元交際相手を名誉毀損の被疑者として\n特定できなかった理由を、こう説明している。"}, {"t": 1806.6833333333334, "x": "「上尾警察署の捜査の進捗状況というものが\n極めて緩慢であったということから、"}, {"t": 1811.4666666666667, "x": "同人が本件名誉毀損事件の犯行に\nかかわっていたと認定するだけの証拠を、"}, {"t": 1816.15, "x": "捜査が緩慢なものですから入手するに至らず、\n被疑者として特定するということができなかった」"}, {"t": 1822.0666666666666, "x": "捜査が緩慢だったから、特定できなかった。"}, {"t": 1824.8333333333333, "x": "警察が自分で言っているのね。"}, {"t": 1826.9, "x": "自分で言っている。"}, {"t": 1828.6333333333334, "x": "この年、法律が一本できている。"}, {"t": 1830.9166666666667, "x": "ストーカー行為等の規制等に関する法律。"}, {"t": 1833.4666666666667, "x": "平成12年法律第81号だ。"}, {"t": 1836.1333333333334, "x": "ここは短くやる。この回の主役は法律ではないからだ。"}, {"t": 1839.75, "x": "紙の話だものね。"}, {"t": 1841.3, "x": "ああ。ただ、できかたが\n特徴的なので、そこだけ話す。"}, {"t": 1844.9666666666667, "x": "この法律は、政府が出したものではない。"}, {"t": 1847.35, "x": "議員立法で、参議院の委員会が\n自分で起草して出したものだ。"}, {"t": 1851.3833333333334, "x": "2000年5月16日、参議院の地方行政・\n警察委員会で草案が説明され、"}, {"t": 1856.5666666666666, "x": "全会一致で委員会から提出することが決まった。"}, {"t": 1859.8333333333333, "x": "翌17日、参議院の本会議で可決。"}, {"t": 1862.75, "x": "18日、衆議院の地方行政委員会に\n付託され、同じ日に採決されている。"}, {"t": 1867.7166666666667, "x": "会議録にはこうある。"}, {"t": 1868.95, "x": "「本案につきましては、質疑及び討論ともに\n申し出がありませんので、直ちに採決に入ります」"}, {"t": 1875.0, "x": "質問も討論も無しで。"}, {"t": 1876.75, "x": "無しだ。そして同じ18日の衆議院本会議で\n可決、成立した。"}, {"t": 1881.1666666666667, "x": "草案が出てから成立まで、三日だ。"}, {"t": 1883.7166666666667, "x": "提案理由の説明では、こう述べられている。"}, {"t": 1886.1666666666667, "x": "「いわゆるストーカー行為が社会問題化しており、"}, {"t": 1888.75, "x": "ストーカー行為がエスカレートし、\n殺人などの凶悪事件に発展する\n事案が全国的に見受けられる」"}, {"t": 1894.75, "x": "「現実には既存法令の適用が困難な"}, {"t": 1896.6666666666667, "x": "場合が大部分であり、これまで有効な\n対策をとりがたいものでありました」"}, {"t": 1901.45, "x": "これまで、手が無かったと認めているのね。"}, {"t": 1904.1, "x": "認めている。公布は5月24日。"}, {"t": 1906.3666666666666, "x": "施行は、その半年後の11月24日だ。"}, {"t": 1909.55, "x": "ここはe-Govの法令検索で条文を確認した。"}, {"t": 1912.5666666666666, "x": "附則の一項に「この法律は、公布の日から\n起算して六月を経過した日から施行する」とある。"}, {"t": 1918.6666666666667, "x": "できたときの罰則は、ストーカー行為をした者は"}, {"t": 1921.5333333333333, "x": "6月以下の懲役または50万円以下の罰金。\nそしてこの罪も、親告罪だった。"}, {"t": 1926.8666666666666, "x": "……また、告訴が要るのね。"}, {"t": 1928.6, "x": "そこは、そういう作りで始まった。"}, {"t": 1931.45, "x": "最後の裁判の話をする。"}, {"t": 1933.1, "x": "国家賠償請求訴訟だ。"}, {"t": 1934.95, "x": "遺族が、埼玉県を相手に、\nおよそ1億1千万円の支払いを求めた。"}, {"t": 1939.5833333333333, "x": "2003年2月、さいたま地方裁判所が判決を出した。"}, {"t": 1943.2333333333333, "x": "県に550万円の支払いを命じている。"}, {"t": 1946.0833333333333, "x": "認められたのね。"}, {"t": 1947.3833333333334, "x": "一部だ。ここからが大事なところだ。\nよく聞いてほしい。"}, {"t": 1950.7, "x": "裁判所は、名誉毀損事件についての県警の対応を\n厳しく批判した。"}, {"t": 1955.05, "x": "報道によれば、判決は「不誠実な対応」\n「期待と信頼を裏切った」という言葉を使っている。"}, {"t": 1961.2, "x": "そのうえで、捜査を怠ったことと、彼女が\n亡くなったこととの因果関係については、\nこう述べて否定した。"}, {"t": 1967.55, "x": "「適切に捜査をしていたとしても、4人に接触し、\n犯行を断念させることができたと認める証拠はない」"}, {"t": 1974.1166666666666, "x": "……ちゃんと捜査していても、\n止められたとは言えない。"}, {"t": 1976.95, "x": "そういう判断だ。"}, {"t": 1978.1166666666666, "x": "つまり、550万円という賠償は、"}, {"t": 1980.4333333333334, "x": "「警察のせいで彼女が亡くなった」ことに\n対して払われたものではない。"}, {"t": 1984.7, "x": "告訴を受けた側としての対応が\n不誠実だったこと、そこに対する賠償だ。"}, {"t": 1989.4666666666667, "x": "そこは、分けて考えないといけないのね。"}, {"t": 1992.1166666666666, "x": "分けないといけない。だから私は、この事件について\n「警察が彼女を殺した」という言い方をしない。"}, {"t": 1998.2666666666667, "x": "この裁判は、2005年1月に\n東京高等裁判所が双方の控訴を退け、"}, {"t": 2003.0666666666666, "x": "2006年8月に最高裁判所が\n上告を退けて確定している。"}, {"t": 2007.35, "x": "550万円のままだ。"}, {"t": 2009.1833333333334, "x": "ここも正直に言っておく。\nこの三つの判決の原本に、私は行き着いていない。"}, {"t": 2014.1833333333334, "x": "それは、なぜ。"}, {"t": 2015.4, "x": "2023年に報道されている。さいたま\n地方裁判所が、この民事訴訟の記録を、"}, {"t": 2020.55, "x": "保存期間が終わったとして廃棄した。"}, {"t": 2023.0333333333333, "x": "……捨てたの。"}, {"t": 2023.95, "x": "捨てた。だから、私が読めるのは報道の要約までだ。\nそれを承知のうえで、いま話した。"}, {"t": 2030.1833333333334, "x": "整理する。"}, {"t": 2030.9666666666667, "x": "1999年7月29日、彼女は上尾署で告訴状に署名した。"}, {"t": 2035.8833333333334, "x": "作ったのは署の刑事第二課長だったが、\n法律上は有効な告訴だった。"}, {"t": 2040.5, "x": "9月7日、その告訴を受けて作られた\n供述調書の「告訴」の二文字が\n「届出」に書き換えられ、「犯人は"}, {"t": 2047.55, "x": "元交際相手しか考えられません」という\n一行が「元交際相手の仕業だと\n思いました」に書き換えられた。"}, {"t": 2054.0666666666666, "x": "9月9日、その調書は告訴状と一緒に決裁を通った。"}, {"t": 2057.7833333333333, "x": "中身は読まれなかった。"}, {"t": 2059.3333333333335, "x": "本部への報告書は、作られなかった。"}, {"t": 2061.65, "x": "9月10日、監督する立場の3人が同時に異動した。"}, {"t": 2065.366666666667, "x": "9月21日、署員が告訴の取り下げを\n求め、母親が断った。"}, {"t": 2069.95, "x": "10月26日、彼女は桶川駅の西口で亡くなった。"}, {"t": 2073.9166666666665, "x": "紙は、全部そこにあったのに。"}, {"t": 2076.0333333333333, "x": "あった。署の中に、ずっとあった。"}, {"t": 2078.25, "x": "そして、書き換えられた紙のほうも残った。"}, {"t": 2080.7833333333333, "x": "3人が懲戒免職になり、起訴され、有罪判決を\n受けたのは、その紙が残っていたからだ。"}, {"t": 2086.9333333333334, "x": "書き換えた跡が、証拠になったのね。"}, {"t": 2089.4, "x": "そうだ。紙は、都合よく消えてはくれない。"}, {"t": 2091.983333333333, "x": "出典を挙げておく。"}, {"t": 2093.25, "x": "経過と発言はすべて、国立国会図書館の\n国会会議録検索システムから取った。"}, {"t": 2098.7833333333333, "x": "2000年3月7日と3月17日の参議院予算委員会。\n5月8日と5月22日の参議院行政監視委員会。"}, {"t": 2106.0833333333335, "x": "4月18日の衆議院地方行政委員会だ。"}, {"t": 2109.25, "x": "法律の条文と施行日は、e-\nGovの法令検索で確認した。"}, {"t": 2113.2, "x": "平成12年法律第81号だ。"}, {"t": 2115.95, "x": "懲戒処分の人数、刑事裁判の刑期、\n国家賠償訴訟の判決内容は、\n原本に行き着けていない。"}, {"t": 2122.15, "x": "報道によるものだと、本編でその都度断った。"}, {"t": 2125.4, "x": "詳しい対応は、リサーチのファイルに全部残してある。"}, {"t": 2128.5, "x": "最後に、一つだけ。"}, {"t": 2130.0333333333333, "x": "警察の相談体制も、ストーカー規制法も、\nこの事件のあとに作られたものだ。"}, {"t": 2135.0333333333333, "x": "けれど1999年の上尾署に無かったのは、\n私の見立てでは法律でも制度でもない。"}, {"t": 2140.8166666666666, "x": "何だと思うの。"}, {"t": 2141.983333333333, "x": "「覚悟はしてきているんです」という\n彼女の言葉を、そのまま書き留める姿勢だ。"}, {"t": 2146.5833333333335, "x": "紙というものは、書いたとおりの形でしか残らない。"}, {"t": 2149.5666666666666, "x": "書き換えれば、書き換えた形のまま残る。"}, {"t": 2152.366666666667, "x": "そのくらいのことすら、\nあの年の上尾署では通らなかった。"}, {"t": 2155.9333333333334, "x": "……もし通っていたら、結果は変わっていたのかしら。"}, {"t": 2158.95, "x": "そこは裁判所自身が「証拠が無い」と述べた領域だ。"}, {"t": 2162.3, "x": "私からも断定はしない。"}, {"t": 2164.0333333333333, "x": "確かなのは、彼女の残した紙も、書き換えられた\n紙も、両方とも消えずに残ったという事実だけだ。"}, {"t": 2170.4166666666665, "x": "この回について感じたことがあれば、\nコメント欄に書き込んでほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
