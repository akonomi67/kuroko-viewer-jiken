<script>
const D={"name": "087", "file": "087_編集用", "dur": 2110.26665625, "segs": [], "subs": [{"t": 0.0, "x": "山形県で起きた一つの死について、\n国が二つの答えを出したことがある。"}, {"t": 4.683333333333334, "x": "二つ？"}, {"t": 5.483333333333333, "x": "ああ。片方は「やっていない」、\nもう片方は「やった」だ。"}, {"t": 9.183333333333334, "x": "どちらも、この国の裁判所が出した答えだ。"}, {"t": 12.2, "x": "……同じ事件で？"}, {"t": 13.333333333333334, "x": "同じ事件で、同じ人たちについてだ。"}, {"t": 15.916666666666666, "x": "一九九三年、平成五年の一月。"}, {"t": 19.0, "x": "山形県新庄市の中学校の体育館で、\n一年生の男子生徒が亡くなった。"}, {"t": 24.033333333333335, "x": "巻いたマットの中で、逆さの状態で\n見つかった。十三歳だった。"}, {"t": 28.216666666666665, "x": "七人の生徒が逮捕、または補導された。"}, {"t": 30.933333333333334, "x": "そのうち三人について、家庭裁判所は\n「非行なし」という判断を出した。"}, {"t": 35.61666666666667, "x": "法律の言葉で、不処分という。"}, {"t": 37.85, "x": "やっていない、ということね。"}, {"t": 39.65, "x": "そうだ。"}, {"t": 40.25, "x": "ところがその後、上の裁判所は、七人全員が\n関わっていたという判断を書いた。"}, {"t": 45.28333333333333, "x": "さらにあとから起こされた民事の裁判では、\n七人全員に賠償の責任があるとされた。"}, {"t": 50.63333333333333, "x": "……逆じゃない。"}, {"t": 51.53333333333333, "x": "逆だ。"}, {"t": 52.18333333333333, "x": "そして、どちらの判断も、いまも生きている。"}, {"t": 54.983333333333334, "x": "どちらかが取り消されたわけではない。"}, {"t": 57.03333333333333, "x": "今回は、この二つの答えが並んだまま、\n三十三年が過ぎた話をする。"}, {"t": 61.85, "x": "先に断っておく。犯人を決めつける話はしない。"}, {"t": 65.2, "x": "七人は当時、全員が未成年だ。名前は出さない。"}, {"t": 68.58333333333333, "x": "亡くなるまでの様子や怪我はくわしく\n話さないし、面白がりもしない。"}, {"t": 72.71666666666667, "x": "ええ。"}, {"t": 73.25, "x": "この話には、家庭裁判所、高等裁判所、\n民事の裁判、そして国会が出てくる。"}, {"t": 78.85, "x": "それぞれの場所で何が語られ、何が\n決まったのかを、順に見ていく。"}, {"t": 82.95, "x": "二〇二六年のいまも、賠償の話は終わっていない。"}, {"t": 86.5, "x": "……三十三年たっても？"}, {"t": 88.13333333333334, "x": "そうだ。"}, {"t": 88.76666666666667, "x": "まずは、あの冬の日から見ていこう。"}, {"t": 91.53333333333333, "x": "一九九三年一月十三日。"}, {"t": 94.25, "x": "場所は、山形県新庄市十日町。"}, {"t": 96.61666666666666, "x": "市立明倫中学校だ。"}, {"t": 98.36666666666666, "x": "新庄市は山形県の北の方にある。"}, {"t": 100.61666666666666, "x": "県庁所在地の山形市から、さらに北へ行った盆地だ。"}, {"t": 104.2, "x": "この日は水曜日で、ごく普通の授業日だった。"}, {"t": 107.16666666666667, "x": "冬の山形よね。"}, {"t": 108.58333333333333, "x": "雪の季節だ。だから生徒は体育館に集まる。"}, {"t": 111.71666666666667, "x": "亡くなった生徒は一年生で、放課後、\n部活のために体育館へ行っている。"}, {"t": 116.28333333333333, "x": "そこから先、夕方の体育館で何があったのか。"}, {"t": 119.5, "x": "ここが、三十三年たったいまも、国として\n一つの答えが出ていないところだ。"}, {"t": 124.33333333333333, "x": "報道では、上級生から芸を強要されて、\nそれを断ったことが発端だったとされている。"}, {"t": 129.71666666666667, "x": "この経緯は、事件の翌月に国会でも語られている。"}, {"t": 133.08333333333334, "x": "一九九三年二月十六日、衆議院の予算委員会だ。"}, {"t": 137.35, "x": "山原健二郎という議員が、\n時の総理大臣に向かってこう述べている。"}, {"t": 141.56666666666666, "x": "「いわゆるいじめの中で一発芸と\nいいますか、芸をさせられるわけですね」"}, {"t": 145.66666666666666, "x": "「それを拒否したために巻いたマットの中に\n頭から押し込まれて、そして放置された」"}, {"t": 150.63333333333333, "x": "……事件の一か月後に、もう国会で。"}, {"t": 153.1, "x": "それだけ大きく報じられた。"}, {"t": 154.8, "x": "ただし、これは国会での発言だ。"}, {"t": 156.91666666666666, "x": "裁判所が認定した事実ではない。"}, {"t": 159.2, "x": "そこは分けておいてほしい。"}, {"t": 160.68333333333334, "x": "もう一つ、国会に残っている数字がある。"}, {"t": 163.36666666666667, "x": "翌年の法務委員会で、別の議員がこう言っている。"}, {"t": 166.48333333333332, "x": "「学校の現場で、山形のマット死事件なんか\n体育館で五十人もおったのですからね」"}, {"t": 171.78333333333333, "x": "五十人。"}, {"t": 172.61666666666667, "x": "五十人ほどがいた体育館で起きた、ということだ。"}, {"t": 175.71666666666667, "x": "それでも、何が起きたのかが分からない。"}, {"t": 178.1, "x": "この違和感が、このあと七年にわたって\n国会に居座ることになる。"}, {"t": 182.68333333333334, "x": "その日の夜、家族が学校に問い合わせをしている。"}, {"t": 185.68333333333334, "x": "子どもが帰ってこない、という連絡だ。"}, {"t": 188.03333333333333, "x": "そして教師が校内を探し、\n体育館の用具室で見つかった。"}, {"t": 192.03333333333333, "x": "……見つかった、というのは。"}, {"t": 193.68333333333334, "x": "立てて巻いてあったマットの、中だ。"}, {"t": 195.88333333333333, "x": "逆さの状態だった。"}, {"t": 197.33333333333334, "x": "これ以上は話さない。"}, {"t": 198.8, "x": "ええ。"}, {"t": 199.33333333333334, "x": "この「どんな状態で見つかったか」は、\nあとの話にそのままつながっていく。"}, {"t": 203.98333333333332, "x": "だから、そこだけは押さえておいてほしい。"}, {"t": 206.31666666666666, "x": "法務省の刑事局長が、二〇〇\n〇年の衆議院法務委員会で、\nこの事件をこう説明している。"}, {"t": 211.96666666666667, "x": "「平成五年の一月に、\n中学一年生の被害者が体育館内のマットに\n押し込まれて窒息死したという事件」"}, {"t": 218.6, "x": "政府の公式な説明としては、ここまでだ。"}, {"t": 221.56666666666666, "x": "押し込まれて、と言っているのね。"}, {"t": 223.6, "x": "政府の答弁としてはそうなっている。"}, {"t": 225.73333333333332, "x": "ただ、繰り返すが、政府の答弁と\n裁判所の認定は別物だ。"}, {"t": 229.83333333333334, "x": "そして、この事件でいちばん厄介なのは、\nその裁判所の認定が一つに定まらなかったことだ。"}, {"t": 235.75, "x": "時刻については、報道では夕方の四時台から暴行が\n始まり、夜七時過ぎに見つかったとされている。"}, {"t": 241.93333333333334, "x": "ただ、私はこの時刻の一次の資料に\n行き着けなかった。"}, {"t": 245.48333333333332, "x": "だから、この回では「夕方」\n「夜になって」としか言わない。"}, {"t": 249.43333333333334, "x": "……確かめられないことは、言わないのね。"}, {"t": 251.83333333333334, "x": "言わない。"}, {"t": 252.43333333333334, "x": "この事件は、確かめられないことを誰かが\n言い切ったせいで、ここまでこじれている。"}, {"t": 257.06666666666666, "x": "私が同じことをするわけにはいかない。"}, {"t": 260.0, "x": "ここで一つ、はっきりさせておきたいことがある。"}, {"t": 262.8666666666667, "x": "なぜ、これが事故ではないと考えられたのか。"}, {"t": 265.6666666666667, "x": "マットの中で見つかった、というだけなら。"}, {"t": 268.3, "x": "ふざけて入って抜けなくなった、という話もありえる。"}, {"t": 271.5, "x": "その線が消えたのは、状態のためだ。"}, {"t": 273.93333333333334, "x": "巻いて立ててあるマットの中に、逆さで入っていた。"}, {"t": 277.05, "x": "自分で入ってその状態になるのは\n難しい、と受け取られた。"}, {"t": 280.75, "x": "……だから、誰かがやったことだと。"}, {"t": 282.93333333333334, "x": "そう見られた。"}, {"t": 283.85, "x": "実際、警察は生徒を捕まえている。それは後で話す。"}, {"t": 287.43333333333334, "x": "ただ、ここから先が難しい。"}, {"t": 289.4166666666667, "x": "「誰かがやった」と\n「この人がやった」は、まったく別の話だ。"}, {"t": 293.65, "x": "前者は状況から言える。"}, {"t": 295.01666666666665, "x": "後者は証拠が要る。"}, {"t": 296.3333333333333, "x": "そして、この事件では、その証拠が薄かった。"}, {"t": 299.3666666666667, "x": "どのくらい薄かったか。"}, {"t": 300.81666666666666, "x": "これも国会に記録が残っている。"}, {"t": 302.78333333333336, "x": "二〇〇八年、参議院の法務委員会だ。"}, {"t": 305.43333333333334, "x": "松浦大悟という議員が、\n当時の弁護人の指摘としてこう述べている。"}, {"t": 309.53333333333336, "x": "「体育館用具室の扉の指紋を\n取っていなかったりだとか、物証がなかったりだとか」"}, {"t": 314.6, "x": "「例えば髪の毛など採取できるはずのものだと\n思うんですが、それさえもやっていなかったり」"}, {"t": 319.78333333333336, "x": "……指紋も取っていない。"}, {"t": 321.15, "x": "これは弁護人側の主張を議員が紹介したものだ。"}, {"t": 324.2, "x": "警察が公式に認めた話ではない。そこは区別しておく。"}, {"t": 327.98333333333335, "x": "ただ、この議員はそのあとにこう続けている。"}, {"t": 330.6166666666667, "x": "「その結果、当時はっきりとやったことを\n認めていた少年たちは全員否認に"}, {"t": 334.93333333333334, "x": "転じ、事件はやぶの中となってしまいました」"}, {"t": 337.76666666666665, "x": "「殺された被害者は確かに存在するのに、\nだれがやったのか分からない」"}, {"t": 341.9166666666667, "x": "この「誰がやったのか分からない」という\n状態が、この事件の全部だ。"}, {"t": 346.1666666666667, "x": "残ったのは、自白と、供述だけだった。"}, {"t": 349.6333333333333, "x": "事件から五日後の一月十八日。"}, {"t": 352.0833333333333, "x": "生徒三人が逮捕され、四人が\n補導された。あわせて七人だ。"}, {"t": 356.21666666666664, "x": "逮捕と補導で、分かれているのね。"}, {"t": 358.48333333333335, "x": "年齢で分かれた。"}, {"t": 359.65, "x": "日本の刑法では、十四歳にならないと\n刑事の責任を問えない。"}, {"t": 363.55, "x": "これを刑事責任年齢という。"}, {"t": 365.43333333333334, "x": "十四歳以上なら逮捕できる。"}, {"t": 367.1666666666667, "x": "十四歳未満だと逮捕できない。"}, {"t": 369.26666666666665, "x": "この事件で逮捕された三人は十四歳、補導された\n四人は十三歳と十二歳だったとされている。"}, {"t": 375.1666666666667, "x": "中学一年生と二年生ね。"}, {"t": 377.31666666666666, "x": "同じ体育館にいて、同じ日のことなのに、\n手続きが二つに割れた。"}, {"t": 381.6166666666667, "x": "ここが一つ目の分かれ道だ。"}, {"t": 383.48333333333335, "x": "そしてもう一つ、大事なことがある。"}, {"t": 385.78333333333336, "x": "逮捕された三人も、成人と\n同じ刑事裁判にはかけられない。"}, {"t": 389.7, "x": "未成年の事件は、原則として\n全部、家庭裁判所に送られる。"}, {"t": 393.81666666666666, "x": "これを全件送致主義という。"}, {"t": 395.7, "x": "全部、家裁に行くの。"}, {"t": 397.3333333333333, "x": "行く。検察が起訴するかどうかを\n決めるのではなく、家裁が決める。"}, {"t": 401.28333333333336, "x": "この事件では、傷害致死という罪名で、\n六人が家庭裁判所に送られた。"}, {"t": 406.01666666666665, "x": "残る一人は家裁には行かず、児童福祉司による\n在宅指導という扱いになったとされている。"}, {"t": 411.53333333333336, "x": "この人数は、あとの話でずっと\n効いてくるので覚えておいてほしい。"}, {"t": 415.3, "x": "家裁に送られたのは六人。\nそこに行かなかったのが一人。合わせて七人だ。"}, {"t": 420.0833333333333, "x": "六人と、一人。"}, {"t": 421.56666666666666, "x": "ここから、少年審判が始まる。"}, {"t": 424.51666666666665, "x": "少年審判が何なのかを、先に説明しておく。"}, {"t": 427.68333333333334, "x": "ここを飛ばすと、このあとの話が\n全部わけの分からないものになる。"}, {"t": 431.6666666666667, "x": "お願い。"}, {"t": 432.43333333333334, "x": "ふつうの刑事裁判は、検察官が訴えて、\n弁護人が反論して、裁判官が判断する。"}, {"t": 438.26666666666665, "x": "三人いる。役割が分かれている。"}, {"t": 440.43333333333334, "x": "少年審判には、当時、検察官がいなかった。"}, {"t": 443.7, "x": "裁判官が一人。少年と、付添人という\n立場の弁護士がいるだけだ。"}, {"t": 448.43333333333334, "x": "……訴える人がいないの。"}, {"t": 450.01666666666665, "x": "いない。裁判官が、調べる役と判断する役を兼ねる。"}, {"t": 453.6333333333333, "x": "なぜそうなっているかというと、\n少年審判は罰を与える場ではないからだ。"}, {"t": 457.85, "x": "立ち直らせるための手続きだ、という\n考え方で作られている。"}, {"t": 461.6166666666667, "x": "だから非公開だ。傍聴もできない。"}, {"t": 463.76666666666665, "x": "決定の文書も公開されない。"}, {"t": 465.73333333333335, "x": "当時は、被害者の遺族にすら、\n結果が通知されなかった。"}, {"t": 469.55, "x": "……遺族にも。"}, {"t": 470.48333333333335, "x": "当時はそうだった。ここも、あとで変わる。"}, {"t": 473.03333333333336, "x": "それから、証拠の扱いも刑事裁判とは違う。"}, {"t": 476.0833333333333, "x": "一九九九年の参議院法務委員会で、\n大森礼子という議員がこう指摘している。"}, {"t": 481.45, "x": "「普通の刑事訴訟法の刑事事件のように\n証拠法則の採用がございませんね」"}, {"t": 486.05, "x": "「それから、事実の認定に厳格な証明も要らない」"}, {"t": 489.3, "x": "「保護主義を掲げたときに一般の刑事事件と\n同じ真相解明を望むのはもう無理なんだ」"}, {"t": 494.55, "x": "もともと、真相を\n突き止めるための場じゃないってこと。"}, {"t": 497.85, "x": "そう設計されている、という指摘だ。"}, {"t": 500.1166666666667, "x": "立ち直らせるのが目的なら、何が\n起きたかを争う場にはなりにくい。"}, {"t": 504.25, "x": "ふだんは、それでうまくいく。"}, {"t": 505.95, "x": "ところが、この事件では、\n少年たちが途中から否認に転じた。"}, {"t": 510.0, "x": "訴える人がいない部屋で、\n事実そのものが争いになった。"}, {"t": 514.2666666666667, "x": "この事件の少年審判は、長引いた。"}, {"t": 516.8, "x": "どのくらい長引いたか。"}, {"t": 518.0833333333334, "x": "国会にはっきりした数字が残っている。"}, {"t": 520.5833333333334, "x": "二〇〇〇年十月二十五日、衆議院法務委員会。"}, {"t": 523.7166666666667, "x": "山内功という議員の発言だ。"}, {"t": 525.85, "x": "「山形マット死事件では、\n三十週間ぐらい審理にかかっております」"}, {"t": 530.1833333333333, "x": "三十週間。半年以上じゃない。"}, {"t": 532.4666666666667, "x": "問題は、その間ずっと身柄を\n預かっていられるわけではないことだ。"}, {"t": 536.3333333333334, "x": "当時の少年法では、少年鑑別所に留め置ける\n期間は最長で四週間と決まっていた。"}, {"t": 541.75, "x": "これを観護措置という。"}, {"t": 543.1333333333333, "x": "四週間を過ぎたら、家に帰さないといけない。"}, {"t": 546.1166666666667, "x": "……じゃあ、残りの二十六週間は。"}, {"t": 548.3333333333334, "x": "全員が家にいる状態で、審理が続いた。"}, {"t": 551.0, "x": "この委員会で、山内議員はそこを突いている。"}, {"t": 553.7333333333333, "x": "「共犯にある少年たちが口裏を\n合わせるのじゃないか、真実の追求という\n点ではそういう危惧がある」"}, {"t": 559.4166666666666, "x": "これに答えたのが麻生太郎だ。"}, {"t": 561.15, "x": "当時、少年法の改正案を出した側の議員だった。"}, {"t": 564.4833333333333, "x": "「少年の供述が後からどんどん変わったり\nいろいろして、話が随分込み入って」"}, {"t": 569.1333333333333, "x": "「単独犯じゃない場合、\n複数犯の場合はなかなか取り調べに……\n少年であるとたびたびずれるわけです」"}, {"t": 575.1166666666667, "x": "供述が、変わっていったのね。"}, {"t": 577.2166666666667, "x": "最初は認めていた。それが覆った。"}, {"t": 579.7833333333333, "x": "そしてアリバイの主張が出てきた。"}, {"t": 581.75, "x": "この時間には別の場所にいた、という主張だ。"}, {"t": 584.5666666666667, "x": "裁判官は一人で、検察官はいない。"}, {"t": 587.1333333333333, "x": "そのアリバイが本当かどうかを、\n自分で調べるしかない。"}, {"t": 590.3833333333333, "x": "三十週間かかったのは、そういう事情だ。"}, {"t": 593.7333333333333, "x": "そして一九九三年八月。"}, {"t": 596.2833333333333, "x": "山形家庭裁判所が、最初の判断を出した。"}, {"t": 599.4, "x": "家裁に送られた六人のうち、三人について不処分。"}, {"t": 602.7166666666667, "x": "非行なし、つまり「やっていない」という判断だ。"}, {"t": 605.9, "x": "……三人が。"}, {"t": 606.8333333333334, "x": "この決定の中身は、法務省の刑事局長が\n国会で説明している。"}, {"t": 611.1666666666666, "x": "二〇〇〇年十月十日、衆議院法務委員会。"}, {"t": 613.8666666666667, "x": "古田佑紀という人の答弁だ。"}, {"t": 615.9333333333333, "x": "「傷害致死により家裁送致された\n六名の少年のうち三人について」"}, {"t": 620.0833333333334, "x": "「捜査段階での自白の信用性を否定するとともに、"}, {"t": 623.15, "x": "アリバイの成立を認め、\n非行なしとして不処分の決定をした」"}, {"t": 627.2166666666667, "x": "自白は信用できない、と。"}, {"t": 629.1166666666667, "x": "そしてアリバイは成り立つ、と家裁は判断した。"}, {"t": 632.0, "x": "ここが大事なところだ。"}, {"t": 633.5, "x": "不処分というのは、「証拠が足りないから\n今回は見送る」という意味ではない。"}, {"t": 637.7666666666667, "x": "非行事実そのものが無い、という判断だ。"}, {"t": 640.4166666666666, "x": "少年審判で出せるいちばん\n強い無実の判断が、これだ。"}, {"t": 644.1833333333333, "x": "じゃあ、その三人は。"}, {"t": 645.75, "x": "法律のうえでは、何もしていない。"}, {"t": 647.8833333333333, "x": "この決定は、いまも取り消されていない。"}, {"t": 650.3, "x": "三十三年たった現在も、この三人は\n少年審判では「非行なし」のままだ。"}, {"t": 655.5666666666667, "x": "……でも、民事では責任があるって。"}, {"t": 657.85, "x": "それが、この回の話だ。"}, {"t": 659.6666666666666, "x": "ただ、順番に行こう。"}, {"t": 661.1333333333333, "x": "家裁の判断は、この三人で終わりではなかった。"}, {"t": 664.7666666666667, "x": "八月から三週間ほどあとの九月。"}, {"t": 667.2166666666667, "x": "山形家庭裁判所は、残る\n三人について、逆の判断を出した。"}, {"t": 671.5666666666667, "x": "さっきの答弁の続きだ。"}, {"t": 673.25, "x": "「その他の三名につきましては、非行事実を\n認め、少年院送致等の保護処分決定を行った」"}, {"t": 679.55, "x": "同じ裁判所が、同じ事件で、三人は\n無し、三人は有りにしたのね。"}, {"t": 684.2166666666667, "x": "そうだ。"}, {"t": 684.8333333333334, "x": "整理する。"}, {"t": 685.6, "x": "家裁に送られたのは六人。そのうち\n三人が不処分で、三人が保護処分。"}, {"t": 690.2166666666667, "x": "家裁に行かなかった一人は、\n児童福祉司による在宅指導とされている。"}, {"t": 694.5166666666667, "x": "合わせて七人だ。"}, {"t": 695.9, "x": "半分は無し、半分は有り。"}, {"t": 697.8166666666667, "x": "ここで、どうしても\n言っておかないといけないことがある。"}, {"t": 700.75, "x": "この六人は、ばらばらの事件をやったわけではない。"}, {"t": 703.7333333333333, "x": "同じ日の、同じ体育館の、\n同じ一人の死についての手続きだ。"}, {"t": 707.9833333333333, "x": "その一つの出来事について、三人はやっていて、\n三人はやっていない、という答えが出た。"}, {"t": 713.5, "x": "普通、そうはならない。"}, {"t": 715.1, "x": "……一緒にいたかどうか、という話だものね。"}, {"t": 717.7333333333333, "x": "家裁は、不処分にした三人のアリバイを認めた。"}, {"t": 720.7833333333333, "x": "つまり「その三人はその場にいなかった」という\n前提で、残る三人の関与を認めたことになる。"}, {"t": 726.6833333333333, "x": "矛盾はしていない。理屈の上では成り立つ。"}, {"t": 729.2833333333333, "x": "問題は、その前提が上の裁判所で\nひっくり返ったことだ。"}, {"t": 733.0, "x": "保護処分を受けた三人が、\nこの決定を不服として抗告した。"}, {"t": 736.9, "x": "抗告というのは、上級の裁判所に\n判断し直してもらう手続きだ。"}, {"t": 741.1666666666666, "x": "舞台は、仙台高等裁判所に移る。"}, {"t": 744.3666666666667, "x": "一九九三年の十一月。"}, {"t": 746.6333333333333, "x": "仙台高等裁判所が決定を出した。"}, {"t": 749.1333333333333, "x": "結論から言うと、抗告は棄却された。"}, {"t": 751.7333333333333, "x": "保護処分を受けた三人の訴えは通らなかった。"}, {"t": 754.7166666666667, "x": "じゃあ、そのままなのね。"}, {"t": 756.3666666666667, "x": "そのままだ。ただし、理由の書き方が、\nとんでもないものだった。"}, {"t": 760.3166666666667, "x": "さっきの法務省刑事局長の答弁の続きを読む。"}, {"t": 763.4333333333333, "x": "「高等裁判所は、家庭裁判所において\n非行なしとされた三名を含めた共犯者全員について」"}, {"t": 769.1833333333333, "x": "「捜査段階における自白の信用性を認め、さらに、"}, {"t": 772.3833333333333, "x": "少年らが主張するアリバイは\n認められないとして、抗告棄却の決定をした」"}, {"t": 777.2666666666667, "x": "……非行なしとされた三人を、含めた。"}, {"t": 779.8166666666667, "x": "含めた。"}, {"t": 780.5833333333334, "x": "高裁は、家裁が信用できないとした\n自白を、信用できるとした。"}, {"t": 784.7, "x": "家裁が成り立つとしたアリバイを、\n成り立たないとした。"}, {"t": 787.8, "x": "そのうえで、共犯者全員が関わっていた、と書いた。"}, {"t": 791.2666666666667, "x": "全部ひっくり返してるじゃない。"}, {"t": 793.1666666666666, "x": "ひっくり返した。"}, {"t": 794.3333333333334, "x": "そして、保護処分を受けた三人は、\nさらに最高裁判所に再抗告した。"}, {"t": 799.0166666666667, "x": "最高裁も、これを棄却している。"}, {"t": 801.2166666666667, "x": "一九九四年六月の衆議院法務委員会で、\n正森成二という議員がこの決定に触れている。"}, {"t": 807.3166666666667, "x": "「保護処分決定を受けた少年三人が\n再抗告を申し立てたのについて、"}, {"t": 811.4666666666667, "x": "最高裁の第二小法廷が再抗告を棄却する決定をした」"}, {"t": 815.3666666666667, "x": "この議員は、高裁の決定を新聞で\n読んだ感想として、こうも述べている。"}, {"t": 819.7833333333333, "x": "「高裁は一審の判決をほとんど\n否定いたしまして、そして、"}, {"t": 823.3333333333334, "x": "どうして供述が信用できるかということを\nずっと引用しております」"}, {"t": 827.3333333333334, "x": "一審をほとんど否定した、と。"}, {"t": 829.4166666666666, "x": "同じ少年審判の中で、下の裁判所と\n上の裁判所が、正反対のことを言った。"}, {"t": 834.7833333333333, "x": "これが、一つ目の「二つの答え」だ。"}, {"t": 838.15, "x": "ここが、この回でいちばん理解しにくいところだ。"}, {"t": 841.0, "x": "高裁は「七人全員が関わっていた」と書いた。"}, {"t": 844.2333333333333, "x": "それなのに、不処分になった\n三人の決定は、まったく動かなかった。"}, {"t": 848.6166666666667, "x": "……なんで。"}, {"t": 849.3333333333334, "x": "不処分の三人は、抗告していないからだ。"}, {"t": 852.2166666666667, "x": "そりゃ、勝ってるんだから抗告しないわよね。"}, {"t": 854.9333333333333, "x": "そうだ。勝った側は上に行かない。"}, {"t": 856.95, "x": "では、誰が上に持って行くのか。"}, {"t": 858.9833333333333, "x": "ふつうの刑事裁判なら、無罪判決に\n不服があれば検察官が控訴する。"}, {"t": 863.5833333333334, "x": "当時の少年審判に、検察官はいなかった。"}, {"t": 866.6166666666667, "x": "だから、抗告する権利を\n持つのは少年の側だけだった。"}, {"t": 870.25, "x": "……「非行なし」を上で見直す\n道が、そもそも無いってこと。"}, {"t": 873.8666666666667, "x": "無かった。"}, {"t": 874.5833333333334, "x": "これは、私がそう解釈しているのではない。"}, {"t": 877.1666666666666, "x": "国会でそのまま言われている。"}, {"t": 878.9833333333333, "x": "二〇〇〇年十一月十四日、参議院法務委員会。"}, {"t": 882.05, "x": "谷垣禎一の発言だ。"}, {"t": 883.8666666666667, "x": "「検察官が出席できないこと、あるいは検察官に\n抗告権がなくて」"}, {"t": 888.4, "x": "「少年に非行なしとの決定がなされた場合は\n上級審における是正の機会がないではないか」"}, {"t": 893.6666666666666, "x": "「こういうことが問題点として指摘された」"}, {"t": 896.2333333333333, "x": "もう一つ紹介する。二〇〇〇\n年八月四日、衆議院法務委員会。"}, {"t": 900.4833333333333, "x": "当時の法務大臣、保岡興治が、\n自分の答弁をわざわざ訂正している場面だ。"}, {"t": 905.45, "x": "「同じ少年審判の手続の中で、"}, {"t": 907.7, "x": "抗告をした上訴審の判断と不処分にしたという\n家庭裁判所の審判との事実が乖離した」"}, {"t": 913.3833333333333, "x": "「ということでございますので、\n訂正させていただきたいと思います」"}, {"t": 917.2166666666667, "x": "法務大臣が、言い直したのね。"}, {"t": 919.4166666666666, "x": "そのくらい、説明するのが難しい形になっていた。"}, {"t": 922.75, "x": "結果として、こういう状態が残った。"}, {"t": 925.1833333333333, "x": "上の裁判所は七人全員の関与を認めている。"}, {"t": 928.1666666666666, "x": "それでも、三人は制度の上では\n「やっていない」ままだ。"}, {"t": 931.6666666666666, "x": "どちらも取り消されていない。"}, {"t": 933.1333333333333, "x": "両方とも、生きている。"}, {"t": 935.4, "x": "ここで、少し引いて見てみたい。"}, {"t": 937.3833333333333, "x": "この事件は、国会でどのくらい語られたのか。"}, {"t": 940.2666666666667, "x": "国立国会図書館の国会会議録検索システムで調べた。"}, {"t": 944.2833333333333, "x": "「山形マット死」で二十八件、\n「マット死事件」で四十二件が出てくる。"}, {"t": 948.8, "x": "重複を除くと、四十九の発言だ。"}, {"t": 951.6333333333333, "x": "多いの、それって。"}, {"t": 953.05, "x": "一つの少年事件としては、異例だ。"}, {"t": 955.5333333333333, "x": "しかも、事件の翌月から始まって、\n二〇一二年まで断続的に出てくる。"}, {"t": 960.4666666666667, "x": "最初は一九九三年二月十六日の衆議院予算委員会。\nさっき引用したものだ。"}, {"t": 966.1833333333333, "x": "その八日後には、衆議院の文教委員会でも\n取り上げられている。"}, {"t": 969.9, "x": "同じ議員が、現地に行ってきた\n報告としてこう述べている。"}, {"t": 973.3666666666667, "x": "中学校の校長が語った\n言葉として、こう紹介されている。"}, {"t": 977.15, "x": "「いじめはいけないのだという\n子供たちの認識と私たちの認識が甘かった」"}, {"t": 981.6333333333333, "x": "「正義感、勇気、人間としての尊厳なくしては国語、"}, {"t": 985.0666666666667, "x": "数学、英語などの教科も\n成り立たないことを思い知らされました」"}, {"t": 988.9666666666667, "x": "「教育の原点に立ち返って一から出直すつもりです」"}, {"t": 992.35, "x": "……事件のひと月後の言葉ね。"}, {"t": 994.3833333333333, "x": "そして同じ年の十一月、参議院の法務委員会。"}, {"t": 997.7, "x": "紀平悌子という議員が、こう切り出している。"}, {"t": 1000.3333333333334, "x": "「去る一月の十三日だったと思いますが、"}, {"t": 1002.8666666666667, "x": "山形県新庄市十日町の市立明倫中学校の\n体育館の用具置き場で発生しました」"}, {"t": 1008.5166666666667, "x": "「死というのをまだ私どもは\n決して忘れてはおりません」"}, {"t": 1011.5333333333333, "x": "「何としても胸が締めつけられるような\n事件でございました」"}, {"t": 1014.8666666666667, "x": "この時点では、まだ話は\n教育の問題として語られている。"}, {"t": 1018.6333333333333, "x": "いじめをどう防ぐか、学校をどうするか、という話だ。"}, {"t": 1022.1333333333333, "x": "この時点では、まだ。"}, {"t": 1023.7, "x": "ここから、話が変わる。"}, {"t": 1025.4166666666667, "x": "教育の問題として始まったこの事件は、このあと\n日本の法律を一本、書き換えることになる。"}, {"t": 1031.7666666666667, "x": "法律の話に入る前に、\nどうしても置いておきたい記録が一つある。"}, {"t": 1035.9, "x": "二〇〇〇年四月二十日、\n衆議院の青少年問題に関する特別委員会。"}, {"t": 1040.4833333333333, "x": "明星大学の高橋史朗という教授が、\n参考人として呼ばれている。"}, {"t": 1044.7333333333333, "x": "この人が、一通の手紙を読み上げている。"}, {"t": 1047.35, "x": "事件のあった中学校に通っていた\n生徒の、母親から届いた手紙だ。"}, {"t": 1051.8833333333334, "x": "……在校生の、親からの。"}, {"t": 1053.6833333333334, "x": "読む。"}, {"t": 1054.2, "x": "「あのニュースが流れた\nショックは決して忘れられません」"}, {"t": 1057.1, "x": "「街中、驚き、悲しみ、いきどおりのこわばった空気で"}, {"t": 1060.5666666666666, "x": "重くおおわれた何日かを等しく体験したと思います」"}, {"t": 1063.7, "x": "「ところが、一年を経て、報じられる通り真の解明には\n至らず、双方に憎しみ、うらみの渦巻くまま」"}, {"t": 1070.05, "x": "「一番の被害者はＡ君であることは勿論ですが、\n傷を負ったのは生徒のように思われます」"}, {"t": 1075.2333333333333, "x": "「家族も学校も大変なのですが、\n生徒の心の傷は大きく計り知れません」"}, {"t": 1079.95, "x": "「それを癒すこともできないまま、"}, {"t": 1081.6666666666667, "x": "不信感のみが広がった子供たちのことを\n思いますと、暗たんと致します」"}, {"t": 1086.3333333333333, "x": "……真の解明には至らず、って。"}, {"t": 1088.3166666666666, "x": "一年たった時点の言葉だ。"}, {"t": 1090.1833333333334, "x": "この手紙を書いた人は、\n被害者の家族でもないし、七人の家族でもない。"}, {"t": 1094.8166666666666, "x": "ただ、同じ学校に子どもを通わせていた人だ。"}, {"t": 1097.8333333333333, "x": "この人が「双方に憎しみ、\nうらみの渦巻くまま」と書いている。"}, {"t": 1101.8666666666666, "x": "双方、という言い方に、当時の町の空気が出ている。"}, {"t": 1105.1166666666666, "x": "断っておくと、これは参考人が紹介した\n個人の手紙で、裁判所が認定した事実ではない。"}, {"t": 1111.0666666666666, "x": "この手紙の中では「いじめ」があった前提で\n書かれているが、そこは私は断定しない。"}, {"t": 1116.3833333333334, "x": "私が拾いたいのは、別のところだ。"}, {"t": 1118.8333333333333, "x": "何が起きたのかが確定しないと、\n誰も前に進めない、ということだ。"}, {"t": 1123.0833333333333, "x": "亡くなった生徒の家族も、七人も、\n同じ学校にいた生徒も、教師も、町も。"}, {"t": 1128.35, "x": "全員が、答えの出ないところに置かれたまま\n一年が過ぎていた。"}, {"t": 1132.2333333333333, "x": "……そのまま、三十三年ね。"}, {"t": 1134.2833333333333, "x": "そのままだ。"}, {"t": 1135.8, "x": "少年審判が全部終わったあと、遺族が動いた。"}, {"t": 1138.8333333333333, "x": "一九九五年十二月二十六日。"}, {"t": 1141.6833333333334, "x": "元生徒七人と、学校を設置している新庄市を\n相手取って、民事の裁判を起こした。"}, {"t": 1147.0333333333333, "x": "請求額は、およそ一億九千万円だ。"}, {"t": 1149.9166666666667, "x": "なんで民事なの。刑事はもう終わってるのに。"}, {"t": 1152.55, "x": "民事でしか、できないことがあったからだ。"}, {"t": 1155.05, "x": "少年審判は非公開で、記録も見せてもらえない。"}, {"t": 1158.2166666666667, "x": "当時は、結果の通知すら遺族には無かった。"}, {"t": 1161.0166666666667, "x": "何が起きたのかを知る方法が、\n民事の裁判しか残っていなかった。"}, {"t": 1165.25, "x": "……お金の話じゃなくて。"}, {"t": 1166.8666666666666, "x": "この父親は、後に本を書いている。"}, {"t": 1169.1833333333334, "x": "その一節が、国会で読み上げられている。"}, {"t": 1171.6, "x": "二〇〇〇年十一月九日、参議院法務委員会。"}, {"t": 1174.8833333333334, "x": "橋本敦という議員が、こう紹介している。"}, {"t": 1177.7166666666667, "x": "「私たち家族は何とか訴訟費用を\n捻出することができました」"}, {"t": 1181.7166666666667, "x": "「しかし、訴訟費用がなければ泣き\n寝入りをしろ、ということです」"}, {"t": 1185.45, "x": "「わが子が殺された理由さえ\n知ることができないのです」"}, {"t": 1188.5666666666666, "x": "……お金がないと、理由も分からない。"}, {"t": 1190.7833333333333, "x": "この父親は、こう続けている。"}, {"t": 1192.7833333333333, "x": "「お金がないから、なぜ、お前が\n殺されたのかもわからないままだった」"}, {"t": 1196.8666666666666, "x": "「その無念さ、辛さがわかりますか」"}, {"t": 1199.1666666666667, "x": "紹介した議員自身も、こうまとめている。"}, {"t": 1201.7166666666667, "x": "「御家族の方は、莫大な"}, {"t": 1202.9333333333334, "x": "訴訟費用を負担して民事訴訟を提起されまして、\nようやくその中で事件の概要がわかってきた」"}, {"t": 1209.0666666666666, "x": "民事の裁判は、お金を取るための手続きだ。"}, {"t": 1211.9833333333333, "x": "それを、何が起きたのかを\n知るために使うしかなかった。"}, {"t": 1215.2833333333333, "x": "この時点で、もう三年が経っている。"}, {"t": 1218.2, "x": "民事の一審は、山形地方裁判所だ。"}, {"t": 1220.9166666666667, "x": "判決が出たのは、二〇〇二年三月十九日。"}, {"t": 1223.95, "x": "提訴から六年以上たっていた。"}, {"t": 1226.05, "x": "長いわね。"}, {"t": 1226.9666666666667, "x": "結果は、請求棄却だ。"}, {"t": 1228.9333333333334, "x": "……負けたの。"}, {"t": 1229.8166666666666, "x": "全面的に負けた。"}, {"t": 1231.2333333333333, "x": "報じられた理由は、元生徒たちと事件の結びつきが\n認定できない、というものだった。"}, {"t": 1236.4166666666667, "x": "私はこの判決の原文には行き着けなかった。"}, {"t": 1239.3833333333334, "x": "だから中身をこれ以上は説明しない。"}, {"t": 1241.5, "x": "結論だけを言っている。"}, {"t": 1242.9666666666667, "x": "ここで、いまどういう状態になったかを整理しておく。"}, {"t": 1245.95, "x": "家庭裁判所は、三人について\n「やっていない」と言った。"}, {"t": 1249.5666666666666, "x": "高等裁判所は、七人全員が関わっていた、と書いた。"}, {"t": 1253.2833333333333, "x": "そして民事の一審は、誰の責任も認めなかった。"}, {"t": 1256.7666666666667, "x": "……三つ目の答えが出たのね。"}, {"t": 1258.5666666666666, "x": "三つ目だ。"}, {"t": 1259.4166666666667, "x": "この時点で、遺族は九年かけて、\n一つも答えを手にしていない。"}, {"t": 1263.4666666666667, "x": "先ほど紹介した父親が国会の参考人席に\n立ったのは、この判決の一年半前だ。"}, {"t": 1269.15, "x": "つまり、まだ一審の判決も出ていない\n時期に、国会に呼ばれている。"}, {"t": 1273.25, "x": "そのときの言葉は、あとでまとめて紹介する。"}, {"t": 1276.1333333333334, "x": "遺族は、控訴した。"}, {"t": 1277.55, "x": "舞台はもう一度、仙台高等裁判所に移る。"}, {"t": 1280.55, "x": "少年審判の抗告審と、同じ裁判所だ。"}, {"t": 1284.2166666666667, "x": "ここで、どうしても\n説明しておかないといけないことがある。"}, {"t": 1287.5333333333333, "x": "刑事と民事では、証明に求められる物差しが違う。"}, {"t": 1291.0166666666667, "x": "物差し？"}, {"t": 1291.8666666666666, "x": "どこまで確かなら「あった」と\n認めていいか、という基準だ。"}, {"t": 1295.6166666666666, "x": "刑事の裁判では、合理的な疑いを\n容れない程度、という言い方をする。"}, {"t": 1299.8333333333333, "x": "つまり、まともに考えて疑いが\n残るなら、有罪にはできない。"}, {"t": 1303.75, "x": "疑わしきは被告人の利益に、というやつだ。"}, {"t": 1306.75, "x": "迷ったら、無罪。"}, {"t": 1308.1666666666667, "x": "無罪だ。国が人の自由を奪う\n手続きだから、そこまで厳しくしてある。"}, {"t": 1312.6666666666667, "x": "少年審判も、この考え方に沿っている。"}, {"t": 1315.4833333333333, "x": "では民事はどうか。"}, {"t": 1316.6666666666667, "x": "民事で求められるのは、高度の蓋然性だ。"}, {"t": 1319.4333333333334, "x": "かなりの確からしさで、そう\n言える。そこまで来ればいい。"}, {"t": 1322.7333333333333, "x": "刑事より、ゆるいのね。"}, {"t": 1324.3833333333334, "x": "ゆるい、というより、目的が違う。"}, {"t": 1326.6166666666666, "x": "刑事は、国が人を罰していいかを決める手続きだ。"}, {"t": 1329.7666666666667, "x": "民事は、二人の私人のあいだで、どちらに\n損を負わせるのが公平かを決める手続きだ。"}, {"t": 1334.85, "x": "罰しないことと、責任を\n負わせないことは、別の判断になりうる。"}, {"t": 1339.05, "x": "……だから、刑事で無しでも民事で有りになる。"}, {"t": 1341.7, "x": "なりうる。制度としては、おかしなことではない。"}, {"t": 1344.5166666666667, "x": "ただし、この事件はそれだけでは説明がつかない。"}, {"t": 1347.5166666666667, "x": "この事件では、同じ少年審判の中で\n家裁と高裁が割れている。"}, {"t": 1351.6333333333334, "x": "そのうえ、民事の一審と二審でも割れることになる。"}, {"t": 1354.7166666666667, "x": "物差しが違うから、では片づかない。"}, {"t": 1357.1, "x": "当時の読売新聞の論説副委員長が、二〇〇\n〇年に国会の参考人席でこう述べている。"}, {"t": 1362.6666666666667, "x": "「家庭裁判所と高等裁判所の判断が割れる\nケースとか、それから家庭裁判所の審判と"}, {"t": 1367.8166666666666, "x": "民事裁判が割れるケースとか」"}, {"t": 1369.85, "x": "「揺れるケースがいろいろあります」"}, {"t": 1371.6, "x": "もう一つ、付け加えておかないといけないことがある。"}, {"t": 1374.6333333333334, "x": "民事で責任が認められたからといって、\nそれが唯一の正解というわけではない。"}, {"t": 1379.4166666666667, "x": "……どういうこと。"}, {"t": 1380.4166666666667, "x": "少年事件では、実際に冤罪が起きている。"}, {"t": 1383.25, "x": "二〇〇〇年五月の衆議院法務委員会の小委員会で、\n保坂展人という議員がこう述べている。"}, {"t": 1388.6166666666666, "x": "「例えば、草加事件という冤罪事件が\n生まれているわけですけれども」"}, {"t": 1392.6, "x": "「あるいは、綾瀬で起きた\n母子殺人事件というのがありましたね」"}, {"t": 1396.2, "x": "「これも、加害少年だということで、いわば"}, {"t": 1398.7, "x": "二人の少年が結局は冤罪だったという\n問題が明らかになりました」"}, {"t": 1402.7666666666667, "x": "この人は、その理由についてもこう言っている。"}, {"t": 1405.4833333333333, "x": "「少年審判においても、やはりなかなか、"}, {"t": 1407.95, "x": "何を聞かれているのか、自分が何を\n問われているのかもはっきり理解ができない」"}, {"t": 1412.5, "x": "「専門用語などで言われるので\nわからなかった、あるいは裁判官の質問についても\nやはり非常に萎縮をした」"}, {"t": 1418.7166666666667, "x": "……子どもだものね。"}, {"t": 1419.9166666666667, "x": "この指摘も、同じ国会の記録に並んで残っている。"}, {"t": 1423.3333333333333, "x": "私は、どちらの結論が正しいかを言うつもりはない。"}, {"t": 1426.5666666666666, "x": "言えるのは、この国が同じ死について違う答えを出し、\nそれを一つにできなかった、ということだけだ。"}, {"t": 1433.15, "x": "二〇〇四年五月二十八日。"}, {"t": 1434.9833333333333, "x": "仙台高等裁判所が判決を出した。"}, {"t": 1437.5833333333333, "x": "一審を取り消した。"}, {"t": 1438.8833333333334, "x": "元生徒七人全員について関与を認め、\nおよそ五千七百六十万円の賠償責任があるとした。"}, {"t": 1445.2, "x": "……逆転したのね。"}, {"t": 1446.5166666666667, "x": "逆転した。"}, {"t": 1447.4833333333333, "x": "そして翌年、最高裁判所が上告を\n退け、この判決が確定した。"}, {"t": 1452.35, "x": "二〇〇五年だ。事件から十二年が経っていた。"}, {"t": 1455.25, "x": "ここで、いまの状態をもう一度整理する。"}, {"t": 1457.7333333333333, "x": "家庭裁判所は、三人について「やっていない」と\n決定した。これは取り消されていない。"}, {"t": 1463.1333333333334, "x": "仙台高等裁判所は、少年審判の抗告審で\n七人全員の関与を認めた。"}, {"t": 1468.2666666666667, "x": "民事の一審は、誰の責任も認めなかった。"}, {"t": 1471.2666666666667, "x": "民事の二審と最高裁は、\n七人全員に責任があるとした。"}, {"t": 1475.35, "x": "……四つも答えが出てるじゃない。"}, {"t": 1477.2, "x": "四つだ。"}, {"t": 1477.9333333333334, "x": "この食い違いは、国でも問題として扱われている。"}, {"t": 1481.15, "x": "一九九九年十二月の衆議院法務委員会で、\n法務省の刑事局長がこう述べている。"}, {"t": 1486.9333333333334, "x": "「家庭裁判所の認定が、それから後に"}, {"t": 1489.4, "x": "行われた被害者の親族等からなされた\n民事事件の損害賠償請求における」"}, {"t": 1494.2, "x": "「地方裁判所、高等裁判所等の事実認定と\n必ずしも合致しないということで」"}, {"t": 1499.3333333333333, "x": "「社会から見ると、果たして"}, {"t": 1501.1333333333334, "x": "事実はどうだったのかということにつきまして\n大変疑問が呈される事件が相次いだ」"}, {"t": 1505.7833333333333, "x": "果たして事実はどうだったのか。"}, {"t": 1507.8166666666666, "x": "政府自身が、そう言っている。"}, {"t": 1509.7, "x": "そして、いまも言えていない。"}, {"t": 1511.35, "x": "ただ、この時期に一つだけ、動いたものがある。"}, {"t": 1514.3333333333333, "x": "法律だ。"}, {"t": 1515.7833333333333, "x": "二〇〇〇年十月十七日。"}, {"t": 1517.4833333333333, "x": "衆議院法務委員会。"}, {"t": 1518.95, "x": "この日、亡くなった生徒の父親が、\n参考人として呼ばれている。"}, {"t": 1523.1, "x": "……遺族が、国会に。"}, {"t": 1524.65, "x": "少年法の改正案を審議している最中だった。"}, {"t": 1527.6, "x": "この人が何を言ったのか、会議録から読む。"}, {"t": 1530.4, "x": "「現行の少年法の少年審判の場合に、"}, {"t": 1532.9166666666667, "x": "加害者の少年が否認に転じた場合には\n大変構造的な欠陥が生じるようになっております」"}, {"t": 1538.5666666666666, "x": "「本来ならば事実認定が一番肝要かと\n思われるわけなのですが」"}, {"t": 1542.55, "x": "「その事実認定におきまして、加害者の少年本人が\n否認に転じますとなかなか事実認定がしづらい」"}, {"t": 1548.8333333333333, "x": "そして、この一節だ。"}, {"t": 1550.45, "x": "「何にも増しまして、どんな事件が起こったのか、\n何が起きたのかということが肝要であると思われます」"}, {"t": 1556.4833333333333, "x": "……何が起きたのか。"}, {"t": 1557.7666666666667, "x": "この人は、罰を重くしろとだけ言っているのではない。"}, {"t": 1560.8833333333334, "x": "何が起きたのかを確定してくれ、と言っている。"}, {"t": 1563.7, "x": "被害者への配慮についても、こう述べている。"}, {"t": 1566.3, "x": "「被害者を格段の扱いにせよとは申しませんが、\nせめて加害者と同等並みに配慮をいただきたい」"}, {"t": 1572.0166666666667, "x": "それから、審判の傍聴についての部分だ。"}, {"t": 1574.75, "x": "当時、遺族は少年審判を傍聴できなかった。"}, {"t": 1577.7833333333333, "x": "この人は、傍聴を認める条項を入れてほしいと\n言ったうえで、こう付け加えている。"}, {"t": 1582.4, "x": "「ちなみに、私の場合でしたら、\nもし認められたといたしましても、\n私は傍聴はしなかったと思います」"}, {"t": 1588.8, "x": "……え。"}, {"t": 1589.2666666666667, "x": "理由も述べている。"}, {"t": 1590.4333333333334, "x": "「自分の息子が殺されたことが\n争点になっているわけでございますから」"}, {"t": 1594.4666666666667, "x": "「微に入り細にわたり、"}, {"t": 1595.55, "x": "自分の息子が殺される状況を\n冷静な一市民として見て、\n聞いているわけには到底いかない」"}, {"t": 1600.9833333333333, "x": "自分は行かない。それでも、行きたい\n人のために道を開けてくれ、という話だ。"}, {"t": 1605.7333333333333, "x": "最後に、この人は制度の穴を一つ挙げている。"}, {"t": 1608.6333333333334, "x": "「偽証を阻止するような条項を\n何か入れていただきたい」"}, {"t": 1611.6166666666666, "x": "「私どもの事件でもそうなんですが、"}, {"t": 1613.6666666666667, "x": "虚偽のアリバイというものを申し立てても、\n何らそれを抑止する手だてがありません」"}, {"t": 1618.8, "x": "この年、少年法が改正された。"}, {"t": 1621.1333333333334, "x": "そして、この改正の出発点が\nこの事件だったことは、政府が公式に言っている。"}, {"t": 1626.25, "x": "二〇〇〇年五月十一日、衆議院本会議。"}, {"t": 1628.9666666666667, "x": "法務大臣の臼井日出男の趣旨説明だ。"}, {"t": 1631.5666666666666, "x": "「しかるに、近時、\nいわゆる山形マット死事件を初め、"}, {"t": 1634.85, "x": "少年審判手続における事実認定が問題となる\n事件が相次いで生じたことなどから」"}, {"t": 1640.3166666666666, "x": "「少年審判における事実認定手続のあり方が\n問われるに至っております」"}, {"t": 1644.9833333333333, "x": "法律の提案理由に、事件名が出てるのね。"}, {"t": 1647.9166666666667, "x": "出ている。しかも一回ではない。"}, {"t": 1649.8833333333334, "x": "法務省の刑事局長は、二〇〇\n〇年十一月にこう答えている。"}, {"t": 1653.75, "x": "「いわゆる山形マット死事件、\nこれをきっかけといたしまして」"}, {"t": 1657.2333333333333, "x": "「少年審判手続におきます事実認定をもっと\nしっかりしたものにすべきではないかという点が非常に"}, {"t": 1663.0333333333333, "x": "大きな問題となった」"}, {"t": 1664.3666666666666, "x": "改正の中身を見ていく。"}, {"t": 1665.9666666666667, "x": "一つ、裁判官一人ではなく、三人の合議で\n審判できるようにした。裁定合議という。"}, {"t": 1671.6166666666666, "x": "二つ、被害者が死亡した罪などで、\n検察官が審判に関与できるようにした。"}, {"t": 1676.7, "x": "三つ、検察官が関与するときは、\n国選の弁護士を付添人として付けることにした。"}, {"t": 1682.2833333333333, "x": "四つ、検察官の申立てによる\n抗告受理の制度を作った。"}, {"t": 1686.3166666666666, "x": "……あ。"}, {"t": 1686.7666666666667, "x": "気づいたか。"}, {"t": 1687.7333333333333, "x": "「非行なし」を上で見直せない、という話。"}, {"t": 1690.5833333333333, "x": "そこだ。この事件で動かせなかった\n三人の問題が、ここで制度として塞がれた。"}, {"t": 1695.6333333333334, "x": "五つ、身柄を預かる観護措置の期間を、\n最長四週間から八週間に延ばした。"}, {"t": 1700.8666666666666, "x": "政府の原案は十二週間だった。それが\n八週間になった経緯も、国会に残っている。"}, {"t": 1706.2333333333333, "x": "麻生太郎の説明だ。「一挙に三倍というと\n一学期丸々なくなってしまう」"}, {"t": 1710.8, "x": "六つ、保護処分が終わったあとでも、\nそれを取り消せる手続きを整えた。"}, {"t": 1715.1833333333334, "x": "そして七つ、家庭裁判所が被害者や遺族に\n審判の結果を通知する制度ができた。"}, {"t": 1720.4166666666667, "x": "意見を述べる機会と、記録を見る道もできた。"}, {"t": 1723.4166666666667, "x": "……あの人が参考人席で\n言ったこと、そのままじゃない。"}, {"t": 1726.7166666666667, "x": "この法律は平成十二年に成立して、\n翌年の四月から動き始めた。"}, {"t": 1731.45, "x": "平成十二年法律第百四十二号だ。"}, {"t": 1734.1333333333334, "x": "それから、この事件が動かしたのは\n少年法だけではない。"}, {"t": 1737.5833333333333, "x": "同じ二〇〇〇年、犯罪被害者を\n守るための法律も整備されている。"}, {"t": 1741.65, "x": "その審議に呼ばれた同志社大学の瀬川晃という\n教授が、経緯をこう説明している。"}, {"t": 1746.7333333333333, "x": "「山形の明倫中学校マット死事件あるいは神戸の\n児童虐殺事件、そういうものを契機としまして」"}, {"t": 1752.7, "x": "「被害者に対する配慮ということが\n非常に社会的な関心を呼んだ」"}, {"t": 1756.7, "x": "この人は、それまでの刑事裁判をこう表現している。"}, {"t": 1759.9833333333333, "x": "裁判官と被告人と弁護人、\nそして検察。この三者で行われてきた。"}, {"t": 1764.8166666666666, "x": "「被害者というものが全く、\n放置されたというよりも排除されてきた」"}, {"t": 1768.9666666666667, "x": "……排除。"}, {"t": 1769.6833333333334, "x": "研究者自身の言葉だ。"}, {"t": 1771.4, "x": "証人として出るときの付き添いや遮へい、\n意見を述べる機会、記録を見る道。"}, {"t": 1775.9833333333333, "x": "いまは当たり前になっているものが、\nこのとき初めて法律に書き込まれた。"}, {"t": 1780.2166666666667, "x": "ただ、順番を間違えてはいけない。"}, {"t": 1782.4166666666667, "x": "法律が変わったのは、遺族が\n十年近く声を上げ続けたあとだ。"}, {"t": 1786.3666666666666, "x": "先に制度があって遺族が救われたのではない。逆だ。"}, {"t": 1790.2333333333333, "x": "話を、賠償に戻す。"}, {"t": 1792.0, "x": "二〇〇五年に、七人全員に\n五千七百六十万円の賠償を命じる判決が確定した。"}, {"t": 1797.6666666666667, "x": "ここで終わりのはずだった。"}, {"t": 1799.3166666666666, "x": "払われなかったの。"}, {"t": 1800.6833333333334, "x": "七人のうち四人からは、給与の差押えなどで\n回収できたと報じられている。"}, {"t": 1805.3, "x": "残る三人は、勤務先が把握できず、\n差押えができなかった。"}, {"t": 1809.5, "x": "……居場所が分からない、ということ。"}, {"t": 1811.5166666666667, "x": "差押えをするには、どこに財産があるかを\n債権者の側が特定しないといけない。"}, {"t": 1816.3, "x": "裁判所が勝手に探してくれるわけではない。"}, {"t": 1818.95, "x": "そして、ここに時間の壁がある。"}, {"t": 1821.0666666666666, "x": "確定した判決で決まった権利も、十年で消える。"}, {"t": 1824.3666666666666, "x": "民法の百六十九条一項に書いてある。"}, {"t": 1826.8333333333333, "x": "確定判決で確定した権利の時効は十年だ、と。"}, {"t": 1830.45, "x": "……せっかく勝っても、十年経ったら。"}, {"t": 1832.7666666666667, "x": "消える。だから、消える前にもう一度訴えるしかない。"}, {"t": 1835.95, "x": "確定したのは二〇〇五年。"}, {"t": 1837.4833333333333, "x": "十年後は二〇一五年だ。"}, {"t": 1839.3333333333333, "x": "遺族は、二〇一六年一月に、払っていない\n元生徒を相手にもう一度訴えを起こした。"}, {"t": 1844.7833333333333, "x": "中身は、前とまったく同じ請求だ。"}, {"t": 1847.2666666666667, "x": "そして二〇一六年八月二十三日、\n山形地方裁判所が判決を出した。"}, {"t": 1852.4333333333334, "x": "遅延損害金を含めて、総額で\nおよそ一億二千四百万円の支払いを命じている。"}, {"t": 1857.7166666666667, "x": "この判決で裁判所は、元生徒側の主張は\n確定判決と矛盾する、と述べたと報じられている。"}, {"t": 1863.9333333333334, "x": "……まだ、やっていないと言っているのね。"}, {"t": 1866.15, "x": "そう報じられている。"}, {"t": 1867.3833333333334, "x": "そして、この二回目の判決が確定した\n日から、また十年の砂時計が始まった。"}, {"t": 1873.3166666666666, "x": "二〇二五年十一月十七日。"}, {"t": 1875.75, "x": "遺族は、三度目の訴えを起こした。"}, {"t": 1878.0333333333333, "x": "相手は、いまも払っていない元生徒三人だ。"}, {"t": 1881.0166666666667, "x": "三度目。"}, {"t": 1881.8833333333334, "x": "同じ死について、同じ相手に、同じ請求を、三回だ。"}, {"t": 1885.6166666666666, "x": "そして二〇二六年七月十五日。"}, {"t": 1888.1, "x": "山形地方裁判所が判決を出した。"}, {"t": 1890.7, "x": "二〇〇五年に確定した\n五千七百六十万円に、遅延損害金を加えた。"}, {"t": 1895.4666666666667, "x": "三人に対して、\n総額およそ一億一千二百六十万円の支払いを命じた。"}, {"t": 1900.4166666666667, "x": "この判決には控訴がなく、\n七月三十一日に確定している。"}, {"t": 1904.7333333333333, "x": "……確定して、それで。"}, {"t": 1906.35, "x": "それで、また十年、請求できる期間が延びた。"}, {"t": 1909.4166666666667, "x": "それだけだ。"}, {"t": 1910.4166666666667, "x": "払われたわけじゃないのね。"}, {"t": 1912.1, "x": "報道によれば、三人からの支払いはない。"}, {"t": 1914.5833333333333, "x": "謝罪もない、とされている。"}, {"t": 1916.3333333333333, "x": "そして、判決のあとも、元生徒側の弁護団は\n冤罪だという主張を続けていると報じられている。"}, {"t": 1922.3333333333333, "x": "私はそこに立ち入らない。"}, {"t": 1923.9666666666667, "x": "家庭裁判所が三人について\n「非行なし」と決定したことは事実だ。"}, {"t": 1928.4666666666667, "x": "民事で七人全員に賠償責任が\n認められたことも事実だ。"}, {"t": 1932.4, "x": "両方とも、この国の裁判所が出した\n答えとして残っている。"}, {"t": 1936.1833333333334, "x": "父親は、いま七十七歳だと報じられている。"}, {"t": 1939.1666666666667, "x": "この夏の取材に、こう答えたと伝えられている。"}, {"t": 1942.1166666666666, "x": "「この次の十年まで僕生きてんのか」"}, {"t": 1944.4833333333333, "x": "……次の十年。"}, {"t": 1945.5333333333333, "x": "この判決の次の期限は、二〇三六年ごろだ。"}, {"t": 1949.0, "x": "その前に、また同じ裁判を\n起こさないと、権利が消える。"}, {"t": 1952.5, "x": "そして、この人は国に対して、賠償金を国がいったん\n立て替える制度を作ってほしいと求めている。"}, {"t": 1959.1666666666667, "x": "最後に、整理しておく。"}, {"t": 1960.7666666666667, "x": "一九九三年一月十三日、山形県新庄市の中学校で、\n一年生の男子生徒が亡くなった。十三歳だった。"}, {"t": 1969.0, "x": "七人が逮捕、または補導された。"}, {"t": 1971.3, "x": "家庭裁判所は、六人のうち三人を\n不処分、三人を保護処分とした。"}, {"t": 1975.8666666666666, "x": "仙台高等裁判所の抗告審は、七人全員の関与を\n認めたうえで、抗告を棄却した。"}, {"t": 1981.6333333333334, "x": "それでも、不処分の三人の決定は動かなかった。"}, {"t": 1984.7, "x": "当時、それを見直す道が制度に無かったからだ。"}, {"t": 1987.85, "x": "民事の一審は請求を退けた。"}, {"t": 1989.85, "x": "二審は七人全員の責任を認め、\n二〇〇五年に確定した。"}, {"t": 1993.9333333333334, "x": "賠償は、四人からは回収された。"}, {"t": 1996.1166666666666, "x": "三人からは、いまも回収できていない。"}, {"t": 1998.65, "x": "遺族は、権利が十年で消えるのを止めるために、二\n〇一六年と二〇二五年に同じ訴えを起こしている。"}, {"t": 2005.1, "x": "二〇二六年七月十五日、三度目の支払い命令。"}, {"t": 2008.65, "x": "七月三十一日に確定。"}, {"t": 2010.9166666666667, "x": "……三十三年たって、増えたのは金額だけね。"}, {"t": 2013.9666666666667, "x": "金額と、年数だけだ。"}, {"t": 2015.75, "x": "ただ、一つだけ動いたものがある。法律だ。"}, {"t": 2018.6666666666667, "x": "いまの少年審判では、重い事件なら\n裁判官が三人で審理できる。"}, {"t": 2022.9666666666667, "x": "検察官が関与できる。"}, {"t": 2024.4666666666667, "x": "検察官の申立てで、上の裁判所が見直せる。"}, {"t": 2027.7666666666667, "x": "遺族は結果の通知を受けられるし、\n意見を述べられるし、記録を見られる。"}, {"t": 2031.9833333333333, "x": "三十三年前に、この事件でできなかったことが、\nいまは全部できる。"}, {"t": 2036.3833333333334, "x": "……この事件でだけ、できなかったのね。"}, {"t": 2038.8, "x": "そういうことになる。"}, {"t": 2040.0, "x": "出典を挙げておく。"}, {"t": 2041.2833333333333, "x": "少年審判の結果と抗告審の内容は、\n国立国会図書館の国会会議録検索システムから。"}, {"t": 2047.65, "x": "第百五十回国会、衆議院法務委員会第二号、\n二〇〇〇年十月十日の政府参考人答弁。"}, {"t": 2053.6833333333334, "x": "遺族の発言は、同じく衆議院法務委員会第四号、\n二〇〇〇年十月十七日の参考人陳述。"}, {"t": 2060.05, "x": "著書からの引用は、参議院法務委員会第五号、\n二〇〇〇年十一月九日の会議録による。"}, {"t": 2065.766666666667, "x": "改正の中身は、法務省が公表している「\n少年法等の一部を改正する法律の概要」。"}, {"t": 2071.3166666666666, "x": "民事の経過と二〇二六年の判決は、日本経済新聞、\n共同通信、集英社オンラインの各報道による。"}, {"t": 2078.2833333333333, "x": "確かめられなかったことは、リサーチのファイルに\n「要確認」として全部書き出してある。"}, {"t": 2083.5333333333333, "x": "最後に、一つだけ。"}, {"t": 2085.0666666666666, "x": "この事件を調べていて、いちばん\n引っかかったのは、あの参考人席の言葉だった。"}, {"t": 2090.05, "x": "「どんな事件が起こったのか、何が\n起きたのかということが肝要であると思われます」"}, {"t": 2094.7166666666667, "x": "罰の重さの話ではない。"}, {"t": 2096.3, "x": "何が起きたのかを教えてくれ、という話だ。"}, {"t": 2099.1, "x": "三十三年たって、そこにはまだ答えが無い。"}, {"t": 2102.116666666667, "x": "……お金の額だけが、増えていくのね。"}, {"t": 2104.483333333333, "x": "私はそう思っている。"}, {"t": 2105.9166666666665, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
