<script>
const D={"name": "087", "file": "087_編集用", "dur": 2114.46665625, "segs": [], "subs": [{"t": 0.0, "x": "一つの死について、国が\n二つの答えを出したことがある。"}, {"t": 3.65, "x": "二つ？"}, {"t": 4.45, "x": "ああ。片方は「やっていない」、\nもう片方は「やった」だ。"}, {"t": 8.133333333333333, "x": "どちらも、この国の裁判所が出した答えだ。"}, {"t": 11.15, "x": "……同じ事件で？"}, {"t": 12.3, "x": "同じ事件で、同じ人たちについてだ。"}, {"t": 14.783333333333333, "x": "一九九三年、平成五年の一月。"}, {"t": 17.866666666666667, "x": "山形県新庄市の中学校の体育館で、\n一年生の男子生徒が亡くなった。"}, {"t": 22.9, "x": "巻いたマットの中で、逆さの状態で\n見つかった。十三歳だった。"}, {"t": 27.083333333333332, "x": "七人の生徒が逮捕、または補導された。"}, {"t": 29.8, "x": "そのうち三人について、家庭裁判所は\n「非行なし」という判断を出した。"}, {"t": 34.483333333333334, "x": "法律の言葉で、不処分という。"}, {"t": 36.71666666666667, "x": "やっていない、ということね。"}, {"t": 38.516666666666666, "x": "そうだ。"}, {"t": 39.11666666666667, "x": "ところがその後、上の裁判所は、七人全員が\n関わっていたという判断を書いた。"}, {"t": 44.15, "x": "さらにあとから起こされた民事の裁判では、\n七人全員に賠償の責任があるとされた。"}, {"t": 49.483333333333334, "x": "……逆じゃない。"}, {"t": 50.4, "x": "逆だ。"}, {"t": 51.05, "x": "そして、どちらの判断も、いまも生きている。"}, {"t": 53.85, "x": "どちらかが取り消されたわけではない。"}, {"t": 55.916666666666664, "x": "先に断っておくことがある。"}, {"t": 57.75, "x": "この回で、私は特定の誰かを犯人とは呼ばない。"}, {"t": 61.05, "x": "七人は全員、当時は未成年だ。いまも生きている。"}, {"t": 64.33333333333333, "x": "名前は出さない。呼ぶときは、\n手続きの結果だけで呼ぶ。"}, {"t": 67.8, "x": "「不処分になった三人」\n「保護処分になった三人」、こういう言い方だけだ。"}, {"t": 72.06666666666666, "x": "それと、この事件はよく\n「いじめ」として語られてきた。"}, {"t": 75.61666666666666, "x": "ただし、刑事の手続きの中で\n「いじめ」として認定された事実はない。"}, {"t": 80.1, "x": "だから私は「いじめと報じられた」\n「国会ではそう語られた」という形でしか言わない。"}, {"t": 85.48333333333333, "x": "亡くなったときの様子も、これ以上は話さない。"}, {"t": 88.45, "x": "ええ。"}, {"t": 88.96666666666667, "x": "今回追うのは、一つの死に対して、\n国が二つの答えを出したまま\n三十三年が過ぎた、という話だ。"}, {"t": 96.1, "x": "一九九三年一月十三日。"}, {"t": 98.81666666666666, "x": "場所は、山形県新庄市十日町。"}, {"t": 101.2, "x": "市立明倫中学校だ。"}, {"t": 102.93333333333334, "x": "新庄市は山形県の北の方にある。"}, {"t": 105.25, "x": "県庁所在地の山形市から、さらに北へ行った盆地だ。"}, {"t": 108.85, "x": "この日は水曜日で、ごく普通の授業日だった。"}, {"t": 111.8, "x": "冬の山形よね。"}, {"t": 113.21666666666667, "x": "雪の季節だ。だから生徒は体育館に集まる。"}, {"t": 116.35, "x": "亡くなった生徒は一年生で、放課後、\n部活のために体育館へ行っている。"}, {"t": 120.91666666666667, "x": "そこから先、夕方の体育館で何があったのか。"}, {"t": 124.13333333333334, "x": "ここが、三十三年たったいまも、国として\n一つの答えが出ていないところだ。"}, {"t": 128.96666666666667, "x": "報道では、上級生から芸を強要されて、\nそれを断ったことが発端だったとされている。"}, {"t": 134.35, "x": "この経緯は、事件の翌月に国会でも語られている。"}, {"t": 137.73333333333332, "x": "一九九三年二月十六日、衆議院の予算委員会だ。"}, {"t": 141.98333333333332, "x": "山原健二郎という議員が、\n時の総理大臣に向かってこう述べている。"}, {"t": 146.2, "x": "「いわゆるいじめの中で一発芸と\nいいますか、芸をさせられるわけですね」"}, {"t": 150.31666666666666, "x": "「それを拒否したために巻いたマットの中に\n頭から押し込まれて、そして放置された」"}, {"t": 155.26666666666668, "x": "……事件の一か月後に、もう国会で。"}, {"t": 157.73333333333332, "x": "それだけ大きく報じられた。"}, {"t": 159.43333333333334, "x": "ただし、これは国会での発言だ。"}, {"t": 161.55, "x": "裁判所が認定した事実ではない。"}, {"t": 163.83333333333334, "x": "そこは分けておいてほしい。"}, {"t": 165.31666666666666, "x": "もう一つ、国会に残っている数字がある。"}, {"t": 168.0, "x": "翌年の法務委員会で、別の議員がこう言っている。"}, {"t": 171.13333333333333, "x": "「学校の現場で、山形のマット死事件なんか\n体育館で五十人もおったのですからね」"}, {"t": 176.41666666666666, "x": "五十人。"}, {"t": 177.25, "x": "五十人ほどがいた体育館で起きた、ということだ。"}, {"t": 180.35, "x": "それでも、何が起きたのかが分からない。"}, {"t": 182.73333333333332, "x": "この違和感が、このあと七年にわたって\n国会に居座ることになる。"}, {"t": 187.33333333333334, "x": "その日の夜、家族が学校に問い合わせをしている。"}, {"t": 190.31666666666666, "x": "子どもが帰ってこない、という連絡だ。"}, {"t": 192.68333333333334, "x": "そして教師が校内を探し、\n体育館の用具室で見つかった。"}, {"t": 196.68333333333334, "x": "……見つかった、というのは。"}, {"t": 198.31666666666666, "x": "立てて巻いてあったマットの、中だ。"}, {"t": 200.53333333333333, "x": "逆さの状態だった。"}, {"t": 201.98333333333332, "x": "これ以上は話さない。"}, {"t": 203.45, "x": "ええ。"}, {"t": 203.96666666666667, "x": "この「どんな状態で見つかったか」は、\nあとの話にそのままつながっていく。"}, {"t": 208.61666666666667, "x": "だから、そこだけは押さえておいてほしい。"}, {"t": 210.96666666666667, "x": "法務省の刑事局長が、二〇〇\n〇年の衆議院法務委員会で、\nこの事件をこう説明している。"}, {"t": 216.6, "x": "「平成五年の一月に、\n中学一年生の被害者が体育館内のマットに\n押し込まれて窒息死したという事件」"}, {"t": 223.25, "x": "政府の公式な説明としては、ここまでだ。"}, {"t": 226.2, "x": "押し込まれて、と言っているのね。"}, {"t": 228.25, "x": "政府の答弁としてはそうなっている。"}, {"t": 230.36666666666667, "x": "ただ、繰り返すが、政府の答弁と\n裁判所の認定は別物だ。"}, {"t": 234.48333333333332, "x": "そして、この事件でいちばん厄介なのは、\nその裁判所の認定が一つに定まらなかったことだ。"}, {"t": 240.4, "x": "時刻については、報道では夕方の四時台から暴行が\n始まり、夜七時過ぎに見つかったとされている。"}, {"t": 246.58333333333334, "x": "ただ、私はこの時刻の一次の資料に\n行き着けなかった。"}, {"t": 250.13333333333333, "x": "だから、この回では「夕方」\n「夜になって」としか言わない。"}, {"t": 254.08333333333334, "x": "……確かめられないことは、言わないのね。"}, {"t": 256.48333333333335, "x": "言わない。"}, {"t": 257.0833333333333, "x": "この事件は、確かめられないことを誰かが\n言い切ったせいで、ここまでこじれている。"}, {"t": 261.7, "x": "私が同じことをするわけにはいかない。"}, {"t": 264.6333333333333, "x": "ここで一つ、はっきりさせておきたいことがある。"}, {"t": 267.5, "x": "なぜ、これが事故ではないと考えられたのか。"}, {"t": 270.3, "x": "マットの中で見つかった、というだけなら。"}, {"t": 272.95, "x": "ふざけて入って抜けなくなった、という話もありえる。"}, {"t": 276.15, "x": "その線が消えたのは、状態のためだ。"}, {"t": 278.56666666666666, "x": "巻いて立ててあるマットの中に、逆さで入っていた。"}, {"t": 281.7, "x": "自分で入ってその状態になるのは\n難しい、と受け取られた。"}, {"t": 285.4, "x": "……だから、誰かがやったことだと。"}, {"t": 287.5833333333333, "x": "そう見られた。"}, {"t": 288.48333333333335, "x": "実際、警察は生徒を捕まえている。それは後で話す。"}, {"t": 292.06666666666666, "x": "ただ、ここから先が難しい。"}, {"t": 294.06666666666666, "x": "「誰かがやった」と\n「この人がやった」は、まったく別の話だ。"}, {"t": 298.28333333333336, "x": "前者は状況から言える。"}, {"t": 299.65, "x": "後者は証拠が要る。"}, {"t": 300.96666666666664, "x": "そして、この事件では、その証拠が薄かった。"}, {"t": 304.0, "x": "どのくらい薄かったか。"}, {"t": 305.46666666666664, "x": "これも国会に記録が残っている。"}, {"t": 307.43333333333334, "x": "二〇〇八年、参議院の法務委員会だ。"}, {"t": 310.0833333333333, "x": "松浦大悟という議員が、\n当時の弁護人の指摘としてこう述べている。"}, {"t": 314.18333333333334, "x": "「体育館用具室の扉の指紋を\n取っていなかったりだとか、物証がなかったりだとか」"}, {"t": 319.25, "x": "「例えば髪の毛など採取できるはずのものだと\n思うんですが、それさえもやっていなかったり」"}, {"t": 324.4166666666667, "x": "……指紋も取っていない。"}, {"t": 325.8, "x": "これは弁護人側の主張を議員が紹介したものだ。"}, {"t": 328.8333333333333, "x": "警察が公式に認めた話ではない。そこは区別しておく。"}, {"t": 332.6166666666667, "x": "ただ、この議員はそのあとにこう続けている。"}, {"t": 335.25, "x": "「その結果、当時はっきりとやったことを\n認めていた少年たちは全員否認に"}, {"t": 339.56666666666666, "x": "転じ、事件はやぶの中となってしまいました」"}, {"t": 342.4166666666667, "x": "「殺された被害者は確かに存在するのに、\nだれがやったのか分からない」"}, {"t": 346.55, "x": "この「誰がやったのか分からない」という\n状態が、この事件の全部だ。"}, {"t": 350.8, "x": "残ったのは、自白と、供述だけだった。"}, {"t": 354.26666666666665, "x": "事件から五日後の一月十八日。"}, {"t": 356.71666666666664, "x": "生徒三人が逮捕され、四人が\n補導された。あわせて七人だ。"}, {"t": 360.85, "x": "逮捕と補導で、分かれているのね。"}, {"t": 363.1166666666667, "x": "年齢で分かれた。"}, {"t": 364.28333333333336, "x": "日本の刑法では、十四歳にならないと\n刑事の責任を問えない。"}, {"t": 368.18333333333334, "x": "これを刑事責任年齢という。"}, {"t": 370.06666666666666, "x": "十四歳以上なら逮捕できる。"}, {"t": 371.81666666666666, "x": "十四歳未満だと逮捕できない。"}, {"t": 373.9166666666667, "x": "この事件で逮捕された三人は十四歳、補導された\n四人は十三歳と十二歳だったとされている。"}, {"t": 379.81666666666666, "x": "中学一年生と二年生ね。"}, {"t": 381.95, "x": "同じ体育館にいて、同じ日のことなのに、\n手続きが二つに割れた。"}, {"t": 386.25, "x": "ここが一つ目の分かれ道だ。"}, {"t": 388.1333333333333, "x": "そしてもう一つ、大事なことがある。"}, {"t": 390.4166666666667, "x": "逮捕された三人も、成人と\n同じ刑事裁判にはかけられない。"}, {"t": 394.3333333333333, "x": "未成年の事件は、原則として\n全部、家庭裁判所に送られる。"}, {"t": 398.45, "x": "これを全件送致主義という。"}, {"t": 400.3333333333333, "x": "全部、家裁に行くの。"}, {"t": 401.96666666666664, "x": "行く。検察が起訴するかどうかを\n決めるのではなく、家裁が決める。"}, {"t": 405.93333333333334, "x": "この事件では、傷害致死という罪名で、\n六人が家庭裁判所に送られた。"}, {"t": 410.65, "x": "残る一人は家裁には行かず、児童福祉司による\n在宅指導という扱いになったとされている。"}, {"t": 416.18333333333334, "x": "この人数は、あとの話でずっと\n効いてくるので覚えておいてほしい。"}, {"t": 419.95, "x": "家裁に送られたのは六人。\nそこに行かなかったのが一人。合わせて七人だ。"}, {"t": 424.71666666666664, "x": "六人と、一人。"}, {"t": 426.2, "x": "ここから、少年審判が始まる。"}, {"t": 429.15, "x": "少年審判が何なのかを、先に説明しておく。"}, {"t": 432.3666666666667, "x": "ここを飛ばすと、このあとの話が\n全部わけの分からないものになる。"}, {"t": 436.35, "x": "お願い。"}, {"t": 437.1166666666667, "x": "ふつうの刑事裁判は、検察官が訴えて、\n弁護人が反論して、裁判官が判断する。"}, {"t": 442.95, "x": "三人いる。役割が分かれている。"}, {"t": 445.1, "x": "少年審判には、当時、検察官がいなかった。"}, {"t": 448.3666666666667, "x": "裁判官が一人。少年と、付添人という\n立場の弁護士がいるだけだ。"}, {"t": 453.1, "x": "……訴える人がいないの。"}, {"t": 454.68333333333334, "x": "いない。裁判官が、調べる役と判断する役を兼ねる。"}, {"t": 458.3, "x": "なぜそうなっているかというと、\n少年審判は罰を与える場ではないからだ。"}, {"t": 462.51666666666665, "x": "立ち直らせるための手続きだ、という\n考え方で作られている。"}, {"t": 466.3, "x": "だから非公開だ。傍聴もできない。"}, {"t": 468.45, "x": "決定の文書も公開されない。"}, {"t": 470.4166666666667, "x": "当時は、被害者の遺族にすら、\n結果が通知されなかった。"}, {"t": 474.21666666666664, "x": "……遺族にも。"}, {"t": 475.15, "x": "当時はそうだった。ここも、あとで変わる。"}, {"t": 477.7, "x": "それから、証拠の扱いも刑事裁判とは違う。"}, {"t": 480.75, "x": "一九九九年の参議院法務委員会で、\n大森礼子という議員がこう指摘している。"}, {"t": 486.1333333333333, "x": "「普通の刑事訴訟法の刑事事件のように\n証拠法則の採用がございませんね」"}, {"t": 490.71666666666664, "x": "「それから、事実の認定に厳格な証明も要らない」"}, {"t": 493.96666666666664, "x": "「保護主義を掲げたときに一般の刑事事件と\n同じ真相解明を望むのはもう無理なんだ」"}, {"t": 499.21666666666664, "x": "もともと、真相を\n突き止めるための場じゃないってこと。"}, {"t": 502.51666666666665, "x": "そう設計されている、という指摘だ。"}, {"t": 504.78333333333336, "x": "立ち直らせるのが目的なら、何が\n起きたかを争う場にはなりにくい。"}, {"t": 508.9166666666667, "x": "ふだんは、それでうまくいく。"}, {"t": 510.6333333333333, "x": "ところが、この事件では、\n少年たちが途中から否認に転じた。"}, {"t": 514.6833333333333, "x": "訴える人がいない部屋で、\n事実そのものが争いになった。"}, {"t": 518.9333333333333, "x": "この事件の少年審判は、長引いた。"}, {"t": 521.4833333333333, "x": "どのくらい長引いたか。"}, {"t": 522.7666666666667, "x": "国会にはっきりした数字が残っている。"}, {"t": 525.25, "x": "二〇〇〇年十月二十五日、衆議院法務委員会。"}, {"t": 528.4, "x": "山内功という議員の発言だ。"}, {"t": 530.5333333333333, "x": "「山形マット死事件では、\n三十週間ぐらい審理にかかっております」"}, {"t": 534.85, "x": "三十週間。半年以上じゃない。"}, {"t": 537.15, "x": "問題は、その間ずっと身柄を\n預かっていられるわけではないことだ。"}, {"t": 541.0, "x": "当時の少年法では、少年鑑別所に留め置ける\n期間は最長で四週間と決まっていた。"}, {"t": 546.4166666666666, "x": "これを観護措置という。"}, {"t": 547.8, "x": "四週間を過ぎたら、家に帰さないといけない。"}, {"t": 550.7166666666667, "x": "……じゃあ、残りの二十六週間は。"}, {"t": 552.95, "x": "全員が家にいる状態で、審理が続いた。"}, {"t": 555.6166666666667, "x": "この委員会で、山内議員はそこを突いている。"}, {"t": 558.35, "x": "「共犯にある少年たちが口裏を\n合わせるのじゃないか、真実の追求という\n点ではそういう危惧がある」"}, {"t": 564.0333333333333, "x": "これに答えたのが麻生太郎だ。"}, {"t": 565.75, "x": "当時、少年法の改正案を出した側の議員だった。"}, {"t": 569.1, "x": "「少年の供述が後からどんどん変わったり\nいろいろして、話が随分込み入って」"}, {"t": 573.75, "x": "「単独犯じゃない場合、\n複数犯の場合はなかなか取り調べに……\n少年であるとたびたびずれるわけです」"}, {"t": 579.7333333333333, "x": "供述が、変わっていったのね。"}, {"t": 581.8166666666667, "x": "最初は認めていた。それが覆った。"}, {"t": 584.1, "x": "そしてアリバイの主張が出てきた。"}, {"t": 586.0833333333334, "x": "この時間には別の場所にいた、という主張だ。"}, {"t": 588.9, "x": "裁判官は一人で、検察官はいない。"}, {"t": 591.4666666666667, "x": "そのアリバイが本当かどうかを、\n自分で調べるしかない。"}, {"t": 594.7, "x": "三十週間かかったのは、そういう事情だ。"}, {"t": 598.05, "x": "そして一九九三年八月。"}, {"t": 600.6166666666667, "x": "山形家庭裁判所が、最初の判断を出した。"}, {"t": 603.7333333333333, "x": "家裁に送られた六人のうち、三人について不処分。"}, {"t": 607.0333333333333, "x": "非行なし、つまり「やっていない」という判断だ。"}, {"t": 610.2333333333333, "x": "……三人が。"}, {"t": 611.15, "x": "この決定の中身は、法務省の刑事局長が\n国会で説明している。"}, {"t": 615.5, "x": "二〇〇〇年十月十日、衆議院法務委員会。"}, {"t": 618.1833333333333, "x": "古田佑紀という人の答弁だ。"}, {"t": 620.2666666666667, "x": "「傷害致死により家裁送致された\n六名の少年のうち三人について」"}, {"t": 624.4, "x": "「捜査段階での自白の信用性を否定するとともに、"}, {"t": 627.4666666666667, "x": "アリバイの成立を認め、\n非行なしとして不処分の決定をした」"}, {"t": 631.55, "x": "自白は信用できない、と。"}, {"t": 633.45, "x": "そしてアリバイは成り立つ、と家裁は判断した。"}, {"t": 636.3333333333334, "x": "ここが大事なところだ。"}, {"t": 637.8166666666667, "x": "不処分というのは、「証拠が足りないから\n今回は見送る」という意味ではない。"}, {"t": 642.0833333333334, "x": "非行事実そのものが無い、という判断だ。"}, {"t": 644.7333333333333, "x": "少年審判で出せるいちばん\n強い無実の判断が、これだ。"}, {"t": 648.5166666666667, "x": "じゃあ、その三人は。"}, {"t": 650.0833333333334, "x": "法律のうえでは、何もしていない。"}, {"t": 652.2166666666667, "x": "この決定は、いまも取り消されていない。"}, {"t": 654.6166666666667, "x": "三十三年たった現在も、この三人は\n少年審判では「非行なし」のままだ。"}, {"t": 659.9, "x": "……でも、民事では責任があるって。"}, {"t": 662.1666666666666, "x": "それが、この回の話だ。"}, {"t": 664.0, "x": "ただ、順番に行こう。"}, {"t": 665.45, "x": "家裁の判断は、この三人で終わりではなかった。"}, {"t": 669.0833333333334, "x": "八月から三週間ほどあとの九月。"}, {"t": 671.55, "x": "山形家庭裁判所は、残る\n三人について、逆の判断を出した。"}, {"t": 675.9, "x": "さっきの答弁の続きだ。"}, {"t": 677.5666666666667, "x": "「その他の三名につきましては、非行事実を\n認め、少年院送致等の保護処分決定を行った」"}, {"t": 683.8666666666667, "x": "同じ裁判所が、同じ事件で、三人は\n無し、三人は有りにしたのね。"}, {"t": 688.5333333333333, "x": "そうだ。"}, {"t": 689.1666666666666, "x": "整理する。"}, {"t": 689.9333333333333, "x": "家裁に送られたのは六人。そのうち\n三人が不処分で、三人が保護処分。"}, {"t": 694.55, "x": "家裁に行かなかった一人は、\n児童福祉司による在宅指導とされている。"}, {"t": 698.85, "x": "合わせて七人だ。"}, {"t": 700.2166666666667, "x": "半分は無し、半分は有り。"}, {"t": 702.1333333333333, "x": "ここで、どうしても\n言っておかないといけないことがある。"}, {"t": 705.0833333333334, "x": "この六人は、ばらばらの事件をやったわけではない。"}, {"t": 708.05, "x": "同じ日の、同じ体育館の、\n同じ一人の死についての手続きだ。"}, {"t": 712.3, "x": "その一つの出来事について、三人はやっていて、\n三人はやっていない、という答えが出た。"}, {"t": 717.8333333333334, "x": "普通、そうはならない。"}, {"t": 719.4166666666666, "x": "……一緒にいたかどうか、という話だものね。"}, {"t": 722.05, "x": "家裁は、不処分にした三人のアリバイを認めた。"}, {"t": 725.1, "x": "つまり「その三人はその場にいなかった」という\n前提で、残る三人の関与を認めたことになる。"}, {"t": 731.0, "x": "矛盾はしていない。理屈の上では成り立つ。"}, {"t": 733.6, "x": "問題は、その前提が上の裁判所で\nひっくり返ったことだ。"}, {"t": 737.3166666666667, "x": "保護処分を受けた三人が、\nこの決定を不服として抗告した。"}, {"t": 741.2333333333333, "x": "抗告というのは、上級の裁判所に\n判断し直してもらう手続きだ。"}, {"t": 745.4833333333333, "x": "舞台は、仙台高等裁判所に移る。"}, {"t": 748.6833333333333, "x": "一九九三年の十一月。"}, {"t": 750.95, "x": "仙台高等裁判所が決定を出した。"}, {"t": 753.45, "x": "結論から言うと、抗告は棄却された。"}, {"t": 756.05, "x": "保護処分を受けた三人の訴えは通らなかった。"}, {"t": 759.05, "x": "じゃあ、そのままなのね。"}, {"t": 760.7, "x": "そのままだ。ただし、理由の書き方が、\nとんでもないものだった。"}, {"t": 764.65, "x": "さっきの法務省刑事局長の答弁の続きを読む。"}, {"t": 767.75, "x": "「高等裁判所は、家庭裁判所において\n非行なしとされた三名を含めた共犯者全員について」"}, {"t": 773.5166666666667, "x": "「捜査段階における自白の信用性を認め、さらに、"}, {"t": 776.7166666666667, "x": "少年らが主張するアリバイは\n認められないとして、抗告棄却の決定をした」"}, {"t": 781.6, "x": "……非行なしとされた三人を、含めた。"}, {"t": 784.1333333333333, "x": "含めた。"}, {"t": 784.9, "x": "高裁は、家裁が信用できないとした\n自白を、信用できるとした。"}, {"t": 789.0333333333333, "x": "家裁が成り立つとしたアリバイを、\n成り立たないとした。"}, {"t": 792.1333333333333, "x": "そのうえで、共犯者全員が関わっていた、と書いた。"}, {"t": 795.5833333333334, "x": "全部ひっくり返してるじゃない。"}, {"t": 797.5, "x": "ひっくり返した。"}, {"t": 798.6666666666666, "x": "そして、保護処分を受けた三人は、\nさらに最高裁判所に再抗告した。"}, {"t": 803.35, "x": "最高裁も、これを棄却している。"}, {"t": 805.55, "x": "一九九四年六月の衆議院法務委員会で、\n正森成二という議員がこの決定に触れている。"}, {"t": 811.65, "x": "「保護処分決定を受けた少年三人が\n再抗告を申し立てたのについて、"}, {"t": 815.8, "x": "最高裁の第二小法廷が再抗告を棄却する決定をした」"}, {"t": 819.7, "x": "この議員は、高裁の決定を新聞で\n読んだ感想として、こうも述べている。"}, {"t": 824.1166666666667, "x": "「高裁は一審の判決をほとんど\n否定いたしまして、そして、"}, {"t": 827.6666666666666, "x": "どうして供述が信用できるかということを\nずっと引用しております」"}, {"t": 831.65, "x": "一審をほとんど否定した、と。"}, {"t": 833.7333333333333, "x": "同じ少年審判の中で、下の裁判所と\n上の裁判所が、正反対のことを言った。"}, {"t": 839.1, "x": "これが、一つ目の「二つの答え」だ。"}, {"t": 842.4666666666667, "x": "ここが、この回でいちばん理解しにくいところだ。"}, {"t": 845.3166666666667, "x": "高裁は「七人全員が関わっていた」と書いた。"}, {"t": 848.55, "x": "それなのに、不処分になった\n三人の決定は、まったく動かなかった。"}, {"t": 852.95, "x": "……なんで。"}, {"t": 853.6666666666666, "x": "不処分の三人は、抗告していないからだ。"}, {"t": 856.55, "x": "そりゃ、勝ってるんだから抗告しないわよね。"}, {"t": 859.2666666666667, "x": "そうだ。勝った側は上に行かない。"}, {"t": 861.2666666666667, "x": "では、誰が上に持って行くのか。"}, {"t": 863.3, "x": "ふつうの刑事裁判なら、無罪判決に\n不服があれば検察官が控訴する。"}, {"t": 867.9, "x": "当時の少年審判に、検察官はいなかった。"}, {"t": 870.9333333333333, "x": "だから、抗告する権利を\n持つのは少年の側だけだった。"}, {"t": 874.5833333333334, "x": "……「非行なし」を上で見直す\n道が、そもそも無いってこと。"}, {"t": 878.1833333333333, "x": "無かった。"}, {"t": 878.9166666666666, "x": "これは、私がそう解釈しているのではない。"}, {"t": 881.5, "x": "国会でそのまま言われている。"}, {"t": 883.3, "x": "二〇〇〇年十一月十四日、参議院法務委員会。"}, {"t": 886.3666666666667, "x": "谷垣禎一の発言だ。"}, {"t": 888.2, "x": "「検察官が出席できないこと、あるいは検察官に\n抗告権がなくて」"}, {"t": 892.7166666666667, "x": "「少年に非行なしとの決定がなされた場合は\n上級審における是正の機会がないではないか」"}, {"t": 897.9833333333333, "x": "「こういうことが問題点として指摘された」"}, {"t": 900.5666666666667, "x": "もう一つ紹介する。二〇〇〇\n年八月四日、衆議院法務委員会。"}, {"t": 904.8, "x": "当時の法務大臣、保岡興治が、\n自分の答弁をわざわざ訂正している場面だ。"}, {"t": 909.7833333333333, "x": "「同じ少年審判の手続の中で、"}, {"t": 912.0166666666667, "x": "抗告をした上訴審の判断と不処分にしたという\n家庭裁判所の審判との事実が乖離した」"}, {"t": 917.7, "x": "「ということでございますので、\n訂正させていただきたいと思います」"}, {"t": 921.5333333333333, "x": "法務大臣が、言い直したのね。"}, {"t": 923.7333333333333, "x": "そのくらい、説明するのが難しい形になっていた。"}, {"t": 927.0833333333334, "x": "結果として、こういう状態が残った。"}, {"t": 929.5166666666667, "x": "上の裁判所は七人全員の関与を認めている。"}, {"t": 932.4833333333333, "x": "それでも、三人は制度の上では\n「やっていない」ままだ。"}, {"t": 935.9833333333333, "x": "どちらも取り消されていない。"}, {"t": 937.45, "x": "両方とも、生きている。"}, {"t": 939.7333333333333, "x": "ここで、少し引いて見てみたい。"}, {"t": 941.7166666666667, "x": "この事件は、国会でどのくらい語られたのか。"}, {"t": 944.5833333333334, "x": "国立国会図書館の国会会議録検索システムで調べた。"}, {"t": 948.6, "x": "「山形マット死」で二十八件、\n「マット死事件」で四十二件が出てくる。"}, {"t": 953.1333333333333, "x": "重複を除くと、四十九の発言だ。"}, {"t": 955.9666666666667, "x": "多いの、それって。"}, {"t": 957.3666666666667, "x": "一つの少年事件としては、異例だ。"}, {"t": 959.8666666666667, "x": "しかも、事件の翌月から始まって、\n二〇一二年まで断続的に出てくる。"}, {"t": 964.8, "x": "最初は一九九三年二月十六日の衆議院予算委員会。\nさっき引用したものだ。"}, {"t": 970.5166666666667, "x": "その八日後には、衆議院の文教委員会でも\n取り上げられている。"}, {"t": 974.2333333333333, "x": "同じ議員が、現地に行ってきた\n報告としてこう述べている。"}, {"t": 977.6833333333333, "x": "中学校の校長が語った\n言葉として、こう紹介されている。"}, {"t": 981.4666666666667, "x": "「いじめはいけないのだという\n子供たちの認識と私たちの認識が甘かった」"}, {"t": 985.9666666666667, "x": "「正義感、勇気、人間としての尊厳なくしては国語、"}, {"t": 989.4, "x": "数学、英語などの教科も\n成り立たないことを思い知らされました」"}, {"t": 993.2833333333333, "x": "「教育の原点に立ち返って一から出直すつもりです」"}, {"t": 996.6666666666666, "x": "……事件のひと月後の言葉ね。"}, {"t": 998.7, "x": "そして同じ年の十一月、参議院の法務委員会。"}, {"t": 1002.0333333333333, "x": "紀平悌子という議員が、こう切り出している。"}, {"t": 1004.6666666666666, "x": "「去る一月の十三日だったと思いますが、"}, {"t": 1007.1833333333333, "x": "山形県新庄市十日町の市立明倫中学校の\n体育館の用具置き場で発生しました」"}, {"t": 1012.8333333333334, "x": "「死というのをまだ私どもは\n決して忘れてはおりません」"}, {"t": 1015.9, "x": "「何としても胸が締めつけられるような\n事件でございました」"}, {"t": 1019.2166666666667, "x": "この時点では、まだ話は\n教育の問題として語られている。"}, {"t": 1023.0, "x": "いじめをどう防ぐか、学校をどうするか、という話だ。"}, {"t": 1026.4833333333333, "x": "この時点では、まだ。"}, {"t": 1028.0666666666666, "x": "ここから、話が変わる。"}, {"t": 1029.7666666666667, "x": "教育の問題として始まったこの事件は、このあと\n日本の法律を一本、書き換えることになる。"}, {"t": 1036.1333333333334, "x": "法律の話に入る前に、\nどうしても置いておきたい記録が一つある。"}, {"t": 1040.25, "x": "二〇〇〇年四月二十日、\n衆議院の青少年問題に関する特別委員会。"}, {"t": 1044.8333333333333, "x": "明星大学の高橋史朗という教授が、\n参考人として呼ばれている。"}, {"t": 1049.0833333333333, "x": "この人が、一通の手紙を読み上げている。"}, {"t": 1051.7, "x": "事件のあった中学校に通っていた\n生徒の、母親から届いた手紙だ。"}, {"t": 1056.2333333333333, "x": "……在校生の、親からの。"}, {"t": 1058.0333333333333, "x": "読む。"}, {"t": 1058.5666666666666, "x": "「あのニュースが流れた\nショックは決して忘れられません」"}, {"t": 1061.45, "x": "「街中、驚き、悲しみ、いきどおりのこわばった空気で"}, {"t": 1064.9333333333334, "x": "重くおおわれた何日かを等しく体験したと思います」"}, {"t": 1068.05, "x": "「ところが、一年を経て、報じられる通り真の解明には\n至らず、双方に憎しみ、うらみの渦巻くまま」"}, {"t": 1074.4, "x": "「一番の被害者はＡ君であることは勿論ですが、\n傷を負ったのは生徒のように思われます」"}, {"t": 1079.6, "x": "「家族も学校も大変なのですが、\n生徒の心の傷は大きく計り知れません」"}, {"t": 1084.3, "x": "「それを癒すこともできないまま、"}, {"t": 1086.0333333333333, "x": "不信感のみが広がった子供たちのことを\n思いますと、暗たんと致します」"}, {"t": 1090.7, "x": "……真の解明には至らず、って。"}, {"t": 1092.6666666666667, "x": "一年たった時点の言葉だ。"}, {"t": 1094.5333333333333, "x": "この手紙を書いた人は、\n被害者の家族でもないし、七人の家族でもない。"}, {"t": 1099.1666666666667, "x": "ただ、同じ学校に子どもを通わせていた人だ。"}, {"t": 1102.1833333333334, "x": "この人が「双方に憎しみ、\nうらみの渦巻くまま」と書いている。"}, {"t": 1106.2166666666667, "x": "双方、という言い方に、当時の町の空気が出ている。"}, {"t": 1109.4833333333333, "x": "断っておくと、これは参考人が紹介した\n個人の手紙で、裁判所が認定した事実ではない。"}, {"t": 1115.4333333333334, "x": "この手紙の中では「いじめ」があった前提で\n書かれているが、そこは私は断定しない。"}, {"t": 1120.7333333333333, "x": "私が拾いたいのは、別のところだ。"}, {"t": 1123.1833333333334, "x": "何が起きたのかが確定しないと、\n誰も前に進めない、ということだ。"}, {"t": 1127.45, "x": "亡くなった生徒の家族も、七人も、\n同じ学校にいた生徒も、教師も、町も。"}, {"t": 1132.7, "x": "全員が、答えの出ないところに置かれたまま\n一年が過ぎていた。"}, {"t": 1136.5833333333333, "x": "……そのまま、三十三年ね。"}, {"t": 1138.6333333333334, "x": "そのままだ。"}, {"t": 1140.15, "x": "少年審判が全部終わったあと、遺族が動いた。"}, {"t": 1143.2, "x": "一九九五年十二月二十六日。"}, {"t": 1146.0333333333333, "x": "元生徒七人と、学校を設置している新庄市を\n相手取って、民事の裁判を起こした。"}, {"t": 1151.3833333333334, "x": "請求額は、およそ一億九千万円だ。"}, {"t": 1154.2666666666667, "x": "なんで民事なの。刑事はもう終わってるのに。"}, {"t": 1156.9, "x": "民事でしか、できないことがあったからだ。"}, {"t": 1159.4, "x": "少年審判は非公開で、記録も見せてもらえない。"}, {"t": 1162.5666666666666, "x": "当時は、結果の通知すら遺族には無かった。"}, {"t": 1165.3666666666666, "x": "何が起きたのかを知る方法が、\n民事の裁判しか残っていなかった。"}, {"t": 1169.6, "x": "……お金の話じゃなくて。"}, {"t": 1171.2166666666667, "x": "この父親は、後に本を書いている。"}, {"t": 1173.4833333333333, "x": "その一節が、国会で読み上げられている。"}, {"t": 1175.9, "x": "二〇〇〇年十一月九日、参議院法務委員会。"}, {"t": 1179.2, "x": "橋本敦という議員が、こう紹介している。"}, {"t": 1182.0333333333333, "x": "「私たち家族は何とか訴訟費用を\n捻出することができました」"}, {"t": 1186.0166666666667, "x": "「しかし、訴訟費用がなければ泣き\n寝入りをしろ、ということです」"}, {"t": 1189.7666666666667, "x": "「わが子が殺された理由さえ\n知ることができないのです」"}, {"t": 1192.8833333333334, "x": "……お金がないと、理由も分からない。"}, {"t": 1195.0833333333333, "x": "この父親は、こう続けている。"}, {"t": 1197.1, "x": "「お金がないから、なぜ、お前が\n殺されたのかもわからないままだった」"}, {"t": 1201.1666666666667, "x": "「その無念さ、辛さがわかりますか」"}, {"t": 1203.4833333333333, "x": "紹介した議員自身も、こうまとめている。"}, {"t": 1206.0166666666667, "x": "「御家族の方は、莫大な"}, {"t": 1207.25, "x": "訴訟費用を負担して民事訴訟を提起されまして、\nようやくその中で事件の概要がわかってきた」"}, {"t": 1213.3833333333334, "x": "民事の裁判は、お金を取るための手続きだ。"}, {"t": 1216.3, "x": "それを、何が起きたのかを\n知るために使うしかなかった。"}, {"t": 1219.5833333333333, "x": "この時点で、もう三年が経っている。"}, {"t": 1222.5166666666667, "x": "民事の一審は、山形地方裁判所だ。"}, {"t": 1225.2333333333333, "x": "判決が出たのは、二〇〇二年三月十九日。"}, {"t": 1228.2666666666667, "x": "提訴から六年以上たっていた。"}, {"t": 1230.3666666666666, "x": "長いわね。"}, {"t": 1231.2833333333333, "x": "結果は、請求棄却だ。"}, {"t": 1233.2333333333333, "x": "……負けたの。"}, {"t": 1234.1166666666666, "x": "全面的に負けた。"}, {"t": 1235.5333333333333, "x": "報じられた理由は、元生徒たちと事件の結びつきが\n認定できない、というものだった。"}, {"t": 1240.7166666666667, "x": "私はこの判決の原文には行き着けなかった。"}, {"t": 1243.7, "x": "だから中身をこれ以上は説明しない。"}, {"t": 1245.8166666666666, "x": "結論だけを言っている。"}, {"t": 1247.2833333333333, "x": "ここで、いまどういう状態になったかを整理しておく。"}, {"t": 1250.2666666666667, "x": "家庭裁判所は、三人について\n「やっていない」と言った。"}, {"t": 1253.8666666666666, "x": "高等裁判所は、七人全員が関わっていた、と書いた。"}, {"t": 1257.6, "x": "そして民事の一審は、誰の責任も認めなかった。"}, {"t": 1261.0833333333333, "x": "……三つ目の答えが出たのね。"}, {"t": 1262.8833333333334, "x": "三つ目だ。"}, {"t": 1263.7166666666667, "x": "この時点で、遺族は九年かけて、\n一つも答えを手にしていない。"}, {"t": 1267.7833333333333, "x": "先ほど紹介した父親が国会の参考人席に\n立ったのは、この判決の一年半前だ。"}, {"t": 1273.4666666666667, "x": "つまり、まだ一審の判決も出ていない\n時期に、国会に呼ばれている。"}, {"t": 1277.5666666666666, "x": "そのときの言葉は、あとでまとめて紹介する。"}, {"t": 1280.45, "x": "遺族は、控訴した。"}, {"t": 1281.8666666666666, "x": "舞台はもう一度、仙台高等裁判所に移る。"}, {"t": 1284.8666666666666, "x": "少年審判の抗告審と、同じ裁判所だ。"}, {"t": 1288.5333333333333, "x": "ここで、どうしても\n説明しておかないといけないことがある。"}, {"t": 1291.85, "x": "刑事と民事では、証明に求められる物差しが違う。"}, {"t": 1295.3333333333333, "x": "物差し？"}, {"t": 1296.1833333333334, "x": "どこまで確かなら「あった」と\n認めていいか、という基準だ。"}, {"t": 1299.9333333333334, "x": "刑事の裁判では、合理的な疑いを\n容れない程度、という言い方をする。"}, {"t": 1304.15, "x": "つまり、まともに考えて疑いが\n残るなら、有罪にはできない。"}, {"t": 1308.0666666666666, "x": "疑わしきは被告人の利益に、というやつだ。"}, {"t": 1311.0666666666666, "x": "迷ったら、無罪。"}, {"t": 1312.4833333333333, "x": "無罪だ。国が人の自由を奪う\n手続きだから、そこまで厳しくしてある。"}, {"t": 1316.9666666666667, "x": "少年審判も、この考え方に沿っている。"}, {"t": 1319.8, "x": "では民事はどうか。"}, {"t": 1320.9833333333333, "x": "民事で求められるのは、高度の蓋然性だ。"}, {"t": 1323.7333333333333, "x": "かなりの確からしさで、そう\n言える。そこまで来ればいい。"}, {"t": 1327.05, "x": "刑事より、ゆるいのね。"}, {"t": 1328.6833333333334, "x": "ゆるい、というより、目的が違う。"}, {"t": 1330.9333333333334, "x": "刑事は、国が人を罰していいかを決める手続きだ。"}, {"t": 1334.0833333333333, "x": "民事は、二人の私人のあいだで、どちらに\n損を負わせるのが公平かを決める手続きだ。"}, {"t": 1339.1666666666667, "x": "罰しないことと、責任を\n負わせないことは、別の判断になりうる。"}, {"t": 1343.3666666666666, "x": "……だから、刑事で無しでも民事で有りになる。"}, {"t": 1346.0166666666667, "x": "なりうる。制度としては、おかしなことではない。"}, {"t": 1348.8166666666666, "x": "ただし、この事件はそれだけでは説明がつかない。"}, {"t": 1351.8166666666666, "x": "この事件では、同じ少年審判の中で\n家裁と高裁が割れている。"}, {"t": 1355.9333333333334, "x": "そのうえ、民事の一審と二審でも割れることになる。"}, {"t": 1359.0333333333333, "x": "物差しが違うから、では片づかない。"}, {"t": 1361.4166666666667, "x": "当時の読売新聞の論説副委員長が、二〇〇\n〇年に国会の参考人席でこう述べている。"}, {"t": 1366.9833333333333, "x": "「家庭裁判所と高等裁判所の判断が\n割れるケースとか、それから"}, {"t": 1370.95, "x": "家庭裁判所の審判と民事裁判が割れるケースとか」"}, {"t": 1374.15, "x": "「揺れるケースがいろいろあります」"}, {"t": 1375.9166666666667, "x": "もう一つ、付け加えておかないといけないことがある。"}, {"t": 1378.95, "x": "民事で責任が認められたからといって、\nそれが唯一の正解というわけではない。"}, {"t": 1383.7333333333333, "x": "……どういうこと。"}, {"t": 1384.7333333333333, "x": "少年事件では、実際に冤罪が起きている。"}, {"t": 1387.5666666666666, "x": "二〇〇〇年五月の衆議院法務委員会の小委員会で、\n保坂展人という議員がこう述べている。"}, {"t": 1392.9166666666667, "x": "「例えば、草加事件という冤罪事件が\n生まれているわけですけれども」"}, {"t": 1396.9166666666667, "x": "「あるいは、綾瀬で起きた\n母子殺人事件というのがありましたね」"}, {"t": 1400.5166666666667, "x": "「これも、加害少年だということで、いわば"}, {"t": 1403.0166666666667, "x": "二人の少年が結局は冤罪だったという\n問題が明らかになりました」"}, {"t": 1407.0833333333333, "x": "この人は、その理由についてもこう言っている。"}, {"t": 1409.8, "x": "「少年審判においても、やはりなかなか、"}, {"t": 1412.2666666666667, "x": "何を聞かれているのか、自分が何を\n問われているのかもはっきり理解ができない」"}, {"t": 1416.8166666666666, "x": "「専門用語などで言われるので\nわからなかった、あるいは裁判官の質問についても\nやはり非常に萎縮をした」"}, {"t": 1423.0333333333333, "x": "……子どもだものね。"}, {"t": 1424.2333333333333, "x": "この指摘も、同じ国会の記録に並んで残っている。"}, {"t": 1427.65, "x": "私は、どちらの結論が正しいかを言うつもりはない。"}, {"t": 1430.8833333333334, "x": "言えるのは、この国が同じ死について違う答えを出し、\nそれを一つにできなかった、ということだけだ。"}, {"t": 1437.4666666666667, "x": "二〇〇四年五月二十八日。"}, {"t": 1439.3, "x": "仙台高等裁判所が判決を出した。"}, {"t": 1441.9, "x": "一審を取り消した。"}, {"t": 1443.2, "x": "元生徒七人全員について関与を認め、\nおよそ五千七百六十万円の賠償責任があるとした。"}, {"t": 1449.5166666666667, "x": "……逆転したのね。"}, {"t": 1450.8166666666666, "x": "逆転した。"}, {"t": 1451.8, "x": "そして翌年、最高裁判所が上告を\n退け、この判決が確定した。"}, {"t": 1456.6666666666667, "x": "二〇〇五年だ。事件から十二年が経っていた。"}, {"t": 1459.5666666666666, "x": "ここで、いまの状態をもう一度整理する。"}, {"t": 1462.05, "x": "家庭裁判所は、三人について「やっていない」と\n決定した。これは取り消されていない。"}, {"t": 1467.45, "x": "仙台高等裁判所は、少年審判の抗告審で\n七人全員の関与を認めた。"}, {"t": 1472.5833333333333, "x": "民事の一審は、誰の責任も認めなかった。"}, {"t": 1475.5833333333333, "x": "民事の二審と最高裁は、\n七人全員に責任があるとした。"}, {"t": 1479.6666666666667, "x": "……四つも答えが出てるじゃない。"}, {"t": 1481.5, "x": "四つだ。"}, {"t": 1482.25, "x": "この食い違いは、国でも問題として扱われている。"}, {"t": 1485.4666666666667, "x": "一九九九年十二月の衆議院法務委員会で、\n法務省の刑事局長がこう述べている。"}, {"t": 1491.2333333333333, "x": "「家庭裁判所の認定が、それから後に"}, {"t": 1493.5666666666666, "x": "行われた被害者の親族等からなされた\n民事事件の損害賠償請求における」"}, {"t": 1498.4, "x": "「地方裁判所、高等裁判所等の事実認定と\n必ずしも合致しないということで」"}, {"t": 1503.5333333333333, "x": "「社会から見ると、果たして"}, {"t": 1505.3333333333333, "x": "事実はどうだったのかということにつきまして\n大変疑問が呈される事件が相次いだ」"}, {"t": 1509.9833333333333, "x": "果たして事実はどうだったのか。"}, {"t": 1512.0166666666667, "x": "政府自身が、そう言っている。"}, {"t": 1513.9, "x": "そして、いまも言えていない。"}, {"t": 1515.55, "x": "ただ、この時期に一つだけ、動いたものがある。"}, {"t": 1518.5333333333333, "x": "法律だ。"}, {"t": 1519.9833333333333, "x": "二〇〇〇年十月十七日。"}, {"t": 1521.6666666666667, "x": "衆議院法務委員会。"}, {"t": 1523.1333333333334, "x": "この日、亡くなった生徒の父親が、\n参考人として呼ばれている。"}, {"t": 1527.3, "x": "……遺族が、国会に。"}, {"t": 1528.8333333333333, "x": "少年法の改正案を審議している最中だった。"}, {"t": 1531.8, "x": "この人が何を言ったのか、会議録から読む。"}, {"t": 1534.6, "x": "「現行の少年法の少年審判の場合に、"}, {"t": 1537.1166666666666, "x": "加害者の少年が否認に転じた場合には\n大変構造的な欠陥が生じるようになっております」"}, {"t": 1542.7666666666667, "x": "「本来ならば事実認定が一番肝要かと\n思われるわけなのですが」"}, {"t": 1546.75, "x": "「その事実認定におきまして、加害者の少年本人が\n否認に転じますとなかなか事実認定がしづらい」"}, {"t": 1553.0333333333333, "x": "そして、この一節だ。"}, {"t": 1554.65, "x": "「何にも増しまして、どんな事件が起こったのか、\n何が起きたのかということが肝要であると思われます」"}, {"t": 1560.6833333333334, "x": "……何が起きたのか。"}, {"t": 1561.9666666666667, "x": "この人は、罰を重くしろとだけ言っているのではない。"}, {"t": 1565.0666666666666, "x": "何が起きたのかを確定してくれ、と言っている。"}, {"t": 1567.8833333333334, "x": "被害者への配慮についても、こう述べている。"}, {"t": 1570.5, "x": "「被害者を格段の扱いにせよとは申しませんが、\nせめて加害者と同等並みに配慮をいただきたい」"}, {"t": 1576.2, "x": "それから、審判の傍聴についての部分だ。"}, {"t": 1578.95, "x": "当時、遺族は少年審判を傍聴できなかった。"}, {"t": 1581.9666666666667, "x": "この人は、傍聴を認める条項を入れてほしいと\n言ったうえで、こう付け加えている。"}, {"t": 1586.6, "x": "「ちなみに、私の場合でしたら、\nもし認められたといたしましても、\n私は傍聴はしなかったと思います」"}, {"t": 1592.9833333333333, "x": "……え。"}, {"t": 1593.4666666666667, "x": "理由も述べている。"}, {"t": 1594.6333333333334, "x": "「自分の息子が殺されたことが\n争点になっているわけでございますから」"}, {"t": 1598.65, "x": "「微に入り細にわたり、"}, {"t": 1599.75, "x": "自分の息子が殺される状況を\n冷静な一市民として見て、\n聞いているわけには到底いかない」"}, {"t": 1605.1833333333334, "x": "自分は行かない。それでも、行きたい\n人のために道を開けてくれ、という話だ。"}, {"t": 1609.9333333333334, "x": "最後に、この人は制度の穴を一つ挙げている。"}, {"t": 1612.8333333333333, "x": "「偽証を阻止するような条項を\n何か入れていただきたい」"}, {"t": 1615.8166666666666, "x": "「私どもの事件でもそうなんですが、"}, {"t": 1617.8666666666666, "x": "虚偽のアリバイというものを申し立てても、\n何らそれを抑止する手だてがありません」"}, {"t": 1622.9833333333333, "x": "この年、少年法が改正された。"}, {"t": 1625.3333333333333, "x": "そして、この改正の出発点が\nこの事件だったことは、政府が公式に言っている。"}, {"t": 1630.4333333333334, "x": "二〇〇〇年五月十一日、衆議院本会議。"}, {"t": 1633.1666666666667, "x": "法務大臣の臼井日出男の趣旨説明だ。"}, {"t": 1635.7666666666667, "x": "「しかるに、近時、\nいわゆる山形マット死事件を初め、"}, {"t": 1639.05, "x": "少年審判手続における事実認定が問題となる\n事件が相次いで生じたことなどから」"}, {"t": 1644.5166666666667, "x": "「少年審判における事実認定手続のあり方が\n問われるに至っております」"}, {"t": 1649.1833333333334, "x": "法律の提案理由に、事件名が出てるのね。"}, {"t": 1652.1166666666666, "x": "出ている。しかも一回ではない。"}, {"t": 1654.0666666666666, "x": "法務省の刑事局長は、二〇〇\n〇年十一月にこう答えている。"}, {"t": 1657.95, "x": "「いわゆる山形マット死事件、\nこれをきっかけといたしまして」"}, {"t": 1661.4166666666667, "x": "「少年審判手続におきます事実認定をもっと\nしっかりしたものにすべきではないかという点が非常に"}, {"t": 1667.2333333333333, "x": "大きな問題となった」"}, {"t": 1668.5666666666666, "x": "改正の中身を見ていく。"}, {"t": 1670.1666666666667, "x": "一つ、裁判官一人ではなく、三人の合議で\n審判できるようにした。裁定合議という。"}, {"t": 1675.8166666666666, "x": "二つ、被害者が死亡した罪などで、\n検察官が審判に関与できるようにした。"}, {"t": 1680.9, "x": "三つ、検察官が関与するときは、\n国選の弁護士を付添人として付けることにした。"}, {"t": 1686.4833333333333, "x": "四つ、検察官の申立てによる\n抗告受理の制度を作った。"}, {"t": 1690.5166666666667, "x": "……あ。"}, {"t": 1690.95, "x": "気づいたか。"}, {"t": 1691.9333333333334, "x": "「非行なし」を上で見直せない、という話。"}, {"t": 1694.7833333333333, "x": "そこだ。この事件で動かせなかった\n三人の問題が、ここで制度として塞がれた。"}, {"t": 1699.8333333333333, "x": "五つ、身柄を預かる観護措置の期間を、\n最長四週間から八週間に延ばした。"}, {"t": 1705.05, "x": "政府の原案は十二週間だった。それが\n八週間になった経緯も、国会に残っている。"}, {"t": 1710.4333333333334, "x": "麻生太郎の説明だ。「一挙に三倍というと\n一学期丸々なくなってしまう」"}, {"t": 1715.0, "x": "六つ、保護処分が終わったあとでも、\nそれを取り消せる手続きを整えた。"}, {"t": 1719.3833333333334, "x": "そして七つ、家庭裁判所が被害者や遺族に\n審判の結果を通知する制度ができた。"}, {"t": 1724.6166666666666, "x": "意見を述べる機会と、記録を見る道もできた。"}, {"t": 1727.6, "x": "……あの人が参考人席で\n言ったこと、そのままじゃない。"}, {"t": 1730.9166666666667, "x": "この法律は平成十二年に成立して、\n翌年の四月から動き始めた。"}, {"t": 1735.65, "x": "平成十二年法律第百四十二号だ。"}, {"t": 1738.3333333333333, "x": "それから、この事件が動かしたのは\n少年法だけではない。"}, {"t": 1741.7833333333333, "x": "同じ二〇〇〇年、犯罪被害者を\n守るための法律も整備されている。"}, {"t": 1745.85, "x": "その審議に呼ばれた同志社大学の瀬川晃という\n教授が、経緯をこう説明している。"}, {"t": 1750.9166666666667, "x": "「山形の明倫中学校マット死事件あるいは神戸の\n児童虐殺事件、そういうものを契機としまして」"}, {"t": 1756.9, "x": "「被害者に対する配慮ということが\n非常に社会的な関心を呼んだ」"}, {"t": 1760.9, "x": "この人は、それまでの刑事裁判をこう表現している。"}, {"t": 1764.1833333333334, "x": "裁判官と被告人と弁護人、\nそして検察。この三者で行われてきた。"}, {"t": 1769.0, "x": "「被害者というものが全く、\n放置されたというよりも排除されてきた」"}, {"t": 1773.1666666666667, "x": "……排除。"}, {"t": 1773.8666666666666, "x": "研究者自身の言葉だ。"}, {"t": 1775.5833333333333, "x": "証人として出るときの付き添いや遮へい、\n意見を述べる機会、記録を見る道。"}, {"t": 1780.1833333333334, "x": "いまは当たり前になっているものが、\nこのとき初めて法律に書き込まれた。"}, {"t": 1784.4, "x": "ただ、順番を間違えてはいけない。"}, {"t": 1786.6166666666666, "x": "法律が変わったのは、遺族が\n十年近く声を上げ続けたあとだ。"}, {"t": 1790.5666666666666, "x": "先に制度があって遺族が救われたのではない。逆だ。"}, {"t": 1794.4333333333334, "x": "話を、賠償に戻す。"}, {"t": 1796.1833333333334, "x": "二〇〇五年に、七人全員に\n五千七百六十万円の賠償を命じる判決が確定した。"}, {"t": 1801.8666666666666, "x": "ここで終わりのはずだった。"}, {"t": 1803.5166666666667, "x": "払われなかったの。"}, {"t": 1804.8833333333334, "x": "七人のうち四人からは、給与の差押えなどで\n回収できたと報じられている。"}, {"t": 1809.5, "x": "残る三人は、勤務先が把握できず、\n差押えができなかった。"}, {"t": 1813.7, "x": "……居場所が分からない、ということ。"}, {"t": 1815.7166666666667, "x": "差押えをするには、どこに財産があるかを\n債権者の側が特定しないといけない。"}, {"t": 1820.5, "x": "裁判所が勝手に探してくれるわけではない。"}, {"t": 1823.15, "x": "そして、ここに時間の壁がある。"}, {"t": 1825.25, "x": "確定した判決で決まった権利も、十年で消える。"}, {"t": 1828.5666666666666, "x": "民法の百六十九条一項に書いてある。"}, {"t": 1831.0333333333333, "x": "確定判決で確定した権利の時効は十年だ、と。"}, {"t": 1834.65, "x": "……せっかく勝っても、十年経ったら。"}, {"t": 1836.9666666666667, "x": "消える。だから、消える前にもう一度訴えるしかない。"}, {"t": 1840.1333333333334, "x": "確定したのは二〇〇五年。"}, {"t": 1841.6666666666667, "x": "十年後は二〇一五年だ。"}, {"t": 1843.5333333333333, "x": "遺族は、二〇一六年一月に、払っていない\n元生徒を相手にもう一度訴えを起こした。"}, {"t": 1848.9833333333333, "x": "中身は、前とまったく同じ請求だ。"}, {"t": 1851.4666666666667, "x": "そして二〇一六年八月二十三日、\n山形地方裁判所が判決を出した。"}, {"t": 1856.6333333333334, "x": "遅延損害金を含めて、総額で\nおよそ一億二千四百万円の支払いを命じている。"}, {"t": 1861.9166666666667, "x": "この判決で裁判所は、元生徒側の主張は\n確定判決と矛盾する、と述べたと報じられている。"}, {"t": 1868.1166666666666, "x": "……まだ、やっていないと言っているのね。"}, {"t": 1870.35, "x": "そう報じられている。"}, {"t": 1871.5833333333333, "x": "そして、この二回目の判決が確定した\n日から、また十年の砂時計が始まった。"}, {"t": 1877.5166666666667, "x": "二〇二五年十一月十七日。"}, {"t": 1879.9333333333334, "x": "遺族は、三度目の訴えを起こした。"}, {"t": 1882.2333333333333, "x": "相手は、いまも払っていない元生徒三人だ。"}, {"t": 1885.2166666666667, "x": "三度目。"}, {"t": 1886.0833333333333, "x": "同じ死について、同じ相手に、同じ請求を、三回だ。"}, {"t": 1889.8166666666666, "x": "そして二〇二六年七月十五日。"}, {"t": 1892.2833333333333, "x": "山形地方裁判所が判決を出した。"}, {"t": 1894.9, "x": "二〇〇五年に確定した\n五千七百六十万円に、遅延損害金を加えた。"}, {"t": 1899.6666666666667, "x": "三人に対して、\n総額およそ一億一千二百六十万円の支払いを命じた。"}, {"t": 1904.6166666666666, "x": "この判決には控訴がなく、\n七月三十一日に確定している。"}, {"t": 1908.9333333333334, "x": "……確定して、それで。"}, {"t": 1910.55, "x": "それで、また十年、請求できる期間が延びた。"}, {"t": 1913.6166666666666, "x": "それだけだ。"}, {"t": 1914.6166666666666, "x": "払われたわけじゃないのね。"}, {"t": 1916.3, "x": "報道によれば、三人からの支払いはない。"}, {"t": 1918.7833333333333, "x": "謝罪もない、とされている。"}, {"t": 1920.5166666666667, "x": "そして、判決のあとも、元生徒側の弁護団は\n冤罪だという主張を続けていると報じられている。"}, {"t": 1926.5333333333333, "x": "私はそこに立ち入らない。"}, {"t": 1928.1666666666667, "x": "家庭裁判所が三人について\n「非行なし」と決定したことは事実だ。"}, {"t": 1932.6666666666667, "x": "民事で七人全員に賠償責任が\n認められたことも事実だ。"}, {"t": 1936.5833333333333, "x": "両方とも、この国の裁判所が出した\n答えとして残っている。"}, {"t": 1940.3833333333334, "x": "父親は、いま七十七歳だと報じられている。"}, {"t": 1943.3666666666666, "x": "この夏の取材に、こう答えたと伝えられている。"}, {"t": 1946.3, "x": "「この次の十年まで僕生きてんのか」"}, {"t": 1948.6833333333334, "x": "……次の十年。"}, {"t": 1949.7333333333333, "x": "この判決の次の期限は、二〇三六年ごろだ。"}, {"t": 1953.1833333333334, "x": "その前に、また同じ裁判を\n起こさないと、権利が消える。"}, {"t": 1956.7, "x": "そして、この人は国に対して、賠償金を国がいったん\n立て替える制度を作ってほしいと求めている。"}, {"t": 1963.35, "x": "最後に、整理しておく。"}, {"t": 1964.9666666666667, "x": "一九九三年一月十三日、山形県新庄市の中学校で、\n一年生の男子生徒が亡くなった。十三歳だった。"}, {"t": 1973.2, "x": "七人が逮捕、または補導された。"}, {"t": 1975.5, "x": "家庭裁判所は、六人のうち三人を\n不処分、三人を保護処分とした。"}, {"t": 1980.05, "x": "仙台高等裁判所の抗告審は、七人全員の関与を\n認めたうえで、抗告を棄却した。"}, {"t": 1985.8333333333333, "x": "それでも、不処分の三人の決定は動かなかった。"}, {"t": 1988.9, "x": "当時、それを見直す道が制度に無かったからだ。"}, {"t": 1992.05, "x": "民事の一審は請求を退けた。"}, {"t": 1994.05, "x": "二審は七人全員の責任を認め、\n二〇〇五年に確定した。"}, {"t": 1998.1166666666666, "x": "賠償は、四人からは回収された。"}, {"t": 2000.3166666666666, "x": "三人からは、いまも回収できていない。"}, {"t": 2002.85, "x": "遺族は、権利が十年で消えるのを止めるために、二\n〇一六年と二〇二五年に同じ訴えを起こしている。"}, {"t": 2009.2833333333333, "x": "二〇二六年七月十五日、三度目の支払い命令。"}, {"t": 2012.85, "x": "七月三十一日に確定。"}, {"t": 2015.1166666666666, "x": "……三十三年たって、増えたのは金額だけね。"}, {"t": 2018.15, "x": "金額と、年数だけだ。"}, {"t": 2019.95, "x": "ただ、一つだけ動いたものがある。法律だ。"}, {"t": 2022.8666666666666, "x": "いまの少年審判では、重い事件なら\n裁判官が三人で審理できる。"}, {"t": 2027.1666666666667, "x": "検察官が関与できる。"}, {"t": 2028.6666666666667, "x": "検察官の申立てで、上の裁判所が見直せる。"}, {"t": 2031.9666666666667, "x": "遺族は結果の通知を受けられるし、\n意見を述べられるし、記録を見られる。"}, {"t": 2036.1833333333334, "x": "三十三年前に、この事件でできなかったことが、\nいまは全部できる。"}, {"t": 2040.5666666666666, "x": "……この事件でだけ、できなかったのね。"}, {"t": 2043.0, "x": "そういうことになる。"}, {"t": 2044.1833333333334, "x": "出典を挙げておく。"}, {"t": 2045.4666666666667, "x": "少年審判の結果と抗告審の内容は、\n国立国会図書館の国会会議録検索システムから。"}, {"t": 2051.8333333333335, "x": "第百五十回国会、衆議院法務委員会第二号、\n二〇〇〇年十月十日の政府参考人答弁。"}, {"t": 2057.883333333333, "x": "遺族の発言は、同じく衆議院法務委員会第四号、\n二〇〇〇年十月十七日の参考人陳述。"}, {"t": 2064.233333333333, "x": "著書からの引用は、参議院法務委員会第五号、\n二〇〇〇年十一月九日の会議録による。"}, {"t": 2069.9666666666667, "x": "改正の中身は、法務省が公表している「\n少年法等の一部を改正する法律の概要」。"}, {"t": 2075.516666666667, "x": "民事の経過と二〇二六年の判決は、日本経済新聞、\n共同通信、集英社オンラインの各報道による。"}, {"t": 2082.4666666666667, "x": "確かめられなかったことは、リサーチのファイルに\n「要確認」として全部書き出してある。"}, {"t": 2087.733333333333, "x": "最後に、一つだけ。"}, {"t": 2089.266666666667, "x": "この事件を調べていて、いちばん\n引っかかったのは、あの参考人席の言葉だった。"}, {"t": 2094.233333333333, "x": "「どんな事件が起こったのか、何が\n起きたのかということが肝要であると思われます」"}, {"t": 2098.9166666666665, "x": "罰の重さの話ではない。"}, {"t": 2100.5, "x": "何が起きたのかを教えてくれ、という話だ。"}, {"t": 2103.3, "x": "三十三年たって、そこにはまだ答えが無い。"}, {"t": 2106.3166666666666, "x": "……お金の額だけが、増えていくのね。"}, {"t": 2108.6833333333334, "x": "私はそう思っている。"}, {"t": 2110.1, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
