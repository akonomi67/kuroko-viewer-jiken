<style>

<script>
const D={"name": "150", "file": "150_編集用", "dur": 2055.65, "segs": [], "subs": [{"t": 0.0, "x": "1936年2月29日、東京は夜の7時。"}, {"t": 3.9833333333333334, "x": "アメリカの大使が、本国へ1本の電報を打った。"}, {"t": 7.033333333333333, "x": "岡田首相は生きている。けがもない。"}, {"t": 9.35, "x": "首相が生きているってわざわざ電報で？"}, {"t": 11.716666666666667, "x": "そうだ。その2日前の電報には、\n逆のことが書いてある。"}, {"t": 15.333333333333334, "x": "岡田首相が亡くなったことが確かめられた、とな。"}, {"t": 18.583333333333332, "x": "亡くなったはずの首相が生きていたの？"}, {"t": 20.9, "x": "これが二・二六事件の4日間だ。"}, {"t": 23.1, "x": "2月26日の未明、約1400人の兵が動いた。"}, {"t": 26.883333333333333, "x": "首相官邸もそのとき襲われた場所の1つだ。"}, {"t": 29.8, "x": "重臣3人が命を奪われ、首相は\n行方が分からなくなった。"}, {"t": 33.75, "x": "その首相はどこにいたの？"}, {"t": 35.46666666666667, "x": "のちの帝国議会で、当時の大臣がこう答えている。"}, {"t": 38.71666666666667, "x": "首相は官邸にいた。"}, {"t": 40.2, "x": "官邸って兵が占めていた場所よね？"}, {"t": 42.483333333333334, "x": "そうだ。戦後の国会にはこんな言葉も残る。"}, {"t": 45.38333333333333, "x": "官邸の中も外も兵がきびしく見張っていた。"}, {"t": 48.233333333333334, "x": "その中で秘書官が首相を救い出した。"}, {"t": 50.85, "x": "見張りの中から首相を連れ出したのね。"}, {"t": 53.3, "x": "今回は、記録に残った時刻で二・二六事件を追う。"}, {"t": 56.61666666666667, "x": "帝国議会の会議録と戦後の国会の会議録。"}, {"t": 59.75, "x": "アメリカ大使が本国に送った電報。"}, {"t": 62.083333333333336, "x": "それに戒厳司令部が配った紙だ。"}, {"t": 64.45, "x": "日本の記録と外国の記録を並べるのね。"}, {"t": 67.28333333333333, "x": "亡くなった人と家族がいる話だから、\n襲われた場面は描かない。"}, {"t": 71.33333333333333, "x": "将校の側も報告と判決の言葉だけで言う。"}, {"t": 74.4, "x": "じゃあどこから始めるの？"}, {"t": 75.98333333333333, "x": "まずは事件の3か月後の、陸軍大臣の報告からだ。"}, {"t": 79.65, "x": "事件の全体を大臣が議会で読み上げている。"}, {"t": 82.46666666666667, "x": "最初に全体の地図を見るのね。"}, {"t": 85.06666666666666, "x": "1936年5月6日、衆議院の本会議。"}, {"t": 88.68333333333334, "x": "陸軍大臣の寺内寿一が事件の報告をした。"}, {"t": 92.1, "x": "事件のあと最初の議会なのね。"}, {"t": 94.21666666666667, "x": "大臣は「前古未曾有の不祥事」と呼んだ。"}, {"t": 97.08333333333333, "x": "前古未曾有？"}, {"t": 98.2, "x": "昔から一度も無かったという意味だ。"}, {"t": 100.46666666666667, "x": "動いたのは4つの連隊などに属する将兵だ。"}, {"t": 103.35, "x": "歩兵第一連隊、歩兵第三連隊。"}, {"t": 105.88333333333334, "x": "近衛歩兵第三連隊、野戦重砲兵第七連隊。"}, {"t": 109.31666666666666, "x": "その数は約1400余名と報告した。"}, {"t": 112.18333333333334, "x": "それだけの兵が同じ朝に動いたの？"}, {"t": 114.53333333333333, "x": "そうだ。2月26日の早朝に、何か所も襲った。"}, {"t": 118.23333333333333, "x": "首相官邸、斎藤内大臣の私邸。"}, {"t": 120.76666666666667, "x": "渡辺教育総監の私邸、高橋大蔵大臣の私邸。"}, {"t": 124.41666666666667, "x": "それに鈴木侍従長の官邸だ。"}, {"t": 126.58333333333333, "x": "5か所も同じ朝に？"}, {"t": 128.05, "x": "別の小さな部隊は湯河原の宿にも向かった。"}, {"t": 130.86666666666667, "x": "前の内大臣、牧野伸顕が泊まっていた宿だ。"}, {"t": 133.95, "x": "そして兵は永田町のあたりを占めた。"}, {"t": 136.36666666666667, "x": "永田町って今も国の中心の場所よね。"}, {"t": 139.08333333333334, "x": "国立国会図書館の解説も、同じ形で書いている。"}, {"t": 142.76666666666668, "x": "永田町と三宅坂の一帯が占められたとある。"}, {"t": 145.58333333333334, "x": "大臣はこの報告を、軍の責任の\nおわびから始めていた。"}, {"t": 149.23333333333332, "x": "天皇の心を悩ませ、国民に大きな不安を与えた、と。"}, {"t": 153.05, "x": "軍の大臣が議会でそう言ったのね。"}, {"t": 155.35, "x": "全軍の将兵が責任の重さを感じている、とも述べた。"}, {"t": 159.5, "x": "この朝、命を奪われた重臣は3人だ。"}, {"t": 162.28333333333333, "x": "1人目は内大臣の斎藤実だ。"}, {"t": 164.73333333333332, "x": "内大臣ってどういう役目なの？"}, {"t": 166.76666666666668, "x": "天皇のそばで国の大事を相談される役目だ。"}, {"t": 169.66666666666666, "x": "斎藤はその前に首相も務めていた。"}, {"t": 172.06666666666666, "x": "2人目は、大蔵大臣の高橋是清。"}, {"t": 174.7, "x": "1854年の生まれだ。"}, {"t": 176.9, "x": "80歳をこえてまだ大臣だったのね。"}, {"t": 179.46666666666667, "x": "岡田内閣で国のお金をあずかっていた。"}, {"t": 181.96666666666667, "x": "3人目は陸軍の教育総監の渡辺錠太郎だ。"}, {"t": 185.31666666666666, "x": "教育総監？"}, {"t": 186.45, "x": "陸軍の教育を受け持ついちばん上の役だ。"}, {"t": 189.1, "x": "侍従長の鈴木貫太郎は重いけがを負った。"}, {"t": 191.75, "x": "アメリカ大使の27日の電報にこうある。"}, {"t": 194.48333333333332, "x": "鈴木侍従長は重傷だがまだ生きている。"}, {"t": 197.08333333333334, "x": "牧野さんの宿はどうなったの？"}, {"t": 199.03333333333333, "x": "26日の夜の電報では無事と伝えている。"}, {"t": 201.88333333333333, "x": "本人と話した人から聞いたという書き方だ。"}, {"t": 204.9, "x": "その日のうちに少しずつ分かってきたのね。"}, {"t": 207.58333333333334, "x": "そうだ。最初はうわさが先に走っていた。"}, {"t": 210.21666666666667, "x": "この回では襲われた様子には触れない。"}, {"t": 212.46666666666667, "x": "残された家族がいる人たちだからだ。"}, {"t": 214.96666666666667, "x": "うん。名前と役目だけで十分ね。"}, {"t": 217.78333333333333, "x": "首相官邸はどんな建物だったのか。"}, {"t": 220.15, "x": "当時の官邸は1929年に建った建物だ。"}, {"t": 223.61666666666667, "x": "昭和4年の3月にできあがった。"}, {"t": 225.88333333333333, "x": "事件の7年前に建ったのね。"}, {"t": 228.01666666666668, "x": "首相官邸のホームページにその来歴がある。"}, {"t": 230.65, "x": "関東大震災のあと、役所の建て直しが決まった。"}, {"t": 234.0, "x": "その先がけとして最初に建ったのが官邸だ。"}, {"t": 236.93333333333334, "x": "今もその建物は残っているの？"}, {"t": 239.13333333333333, "x": "残っている。場所を少し動かして、手を入れた。"}, {"t": 242.08333333333334, "x": "2005年からは、首相の公邸として使われている。"}, {"t": 245.35, "x": "設計したのは大蔵省の技師の下元連だ。"}, {"t": 248.43333333333334, "x": "公邸って首相が住む所よね？"}, {"t": 250.61666666666667, "x": "そうだ。仕事の場の官邸は、今は別の新しい建物だ。"}, {"t": 254.43333333333334, "x": "古い官邸の写真も記録に残っている。"}, {"t": 256.95, "x": "れんがの壁で横に長い建物だ。"}, {"t": 259.26666666666665, "x": "この中に兵が入ってきたのね。"}, {"t": 261.43333333333334, "x": "内閣の広報室が出した写真に、こんな説明がある。"}, {"t": 264.8833333333333, "x": "正面玄関にある直径1センチほどの穴。"}, {"t": 267.5833333333333, "x": "弾の跡のような穴と書かれている。"}, {"t": 269.78333333333336, "x": "のようななのね。"}, {"t": 270.93333333333334, "x": "そうだ。広報室も言い切ってはいない。"}, {"t": 273.2, "x": "だからこの回も弾の跡と決めつけない。"}, {"t": 275.75, "x": "書いてあるとおりに言うのね。"}, {"t": 277.9, "x": "首相の岡田啓介は海軍の大将だった。"}, {"t": 280.65, "x": "1868年の生まれで、事件のときは60代の後半だ。"}, {"t": 285.15, "x": "海軍の人が首相だったのね。"}, {"t": 287.28333333333336, "x": "岡田内閣ができたのは1934年7月8日。"}, {"t": 291.01666666666665, "x": "その日の記念写真が横浜市に残っている。"}, {"t": 293.78333333333336, "x": "大臣たちが、2列に並んで写っている。"}, {"t": 296.55, "x": "前の列は座って、後ろの列は立っているのね。"}, {"t": 299.6166666666667, "x": "前の列のいちばん左が、外務大臣の広田弘毅だ。"}, {"t": 303.2, "x": "広田さんはあとで出てくるの？"}, {"t": 305.03333333333336, "x": "出てくる。事件のあと首相になる人だ。"}, {"t": 307.6166666666667, "x": "そして議会で、岡田のことを答えることになる。"}, {"t": 310.65, "x": "同じ内閣にいた人が答えるのね。"}, {"t": 313.06666666666666, "x": "岡田内閣ができたとき、1人の役人が呼ばれた。"}, {"t": 316.35, "x": "大蔵省の迫水久常だ。"}, {"t": 318.3333333333333, "x": "首相の秘書官として官邸に入った。"}, {"t": 320.9, "x": "秘書官ってどんな仕事？"}, {"t": 322.6, "x": "首相のそばで予定や連絡を受け持つ役だ。"}, {"t": 325.23333333333335, "x": "戦後の国会の追悼の言葉にこうある。"}, {"t": 327.68333333333334, "x": "請われるままに総理大臣の秘書官に移った。"}, {"t": 330.55, "x": "頼まれて引き受けたのね。"}, {"t": 332.31666666666666, "x": "事件の朝、迫水は33歳だった。"}, {"t": 335.1166666666667, "x": "この人が首相を救い出すことになる。"}, {"t": 338.0833333333333, "x": "事件の当日、外からはどう見えていたのか。"}, {"t": 340.9166666666667, "x": "東京のアメリカ大使館の電報が残っている。"}, {"t": 343.71666666666664, "x": "アメリカの国務省が、外交の記録集で公開した物だ。"}, {"t": 347.48333333333335, "x": "大使館から本国へ送った電報ね。"}, {"t": 349.95, "x": "最初の1本は26日の午前10時。"}, {"t": 352.51666666666665, "x": "軍が政府と市内の一部をおさえたとある。"}, {"t": 354.95, "x": "何人かの重臣が命を奪われた、とうわさもある。"}, {"t": 358.03333333333336, "x": "ただ、まだ何も確かめられないと書いている。"}, {"t": 360.76666666666665, "x": "正午の電報では街の様子も伝えている。"}, {"t": 363.3, "x": "役所と皇居のある一帯を軍が囲んだ。"}, {"t": 365.78333333333336, "x": "軍の通行証が無いと中には入れない。"}, {"t": 368.18333333333334, "x": "株の取引所もこの日は閉まった。"}, {"t": 370.51666666666665, "x": "大使館でも、分からなかったのね。"}, {"t": 372.8666666666667, "x": "記者は外国へ電報も電話もできなかった。"}, {"t": 375.48333333333335, "x": "だからこの電報は試しに打った物だった。"}, {"t": 378.15, "x": "試しに？"}, {"t": 379.28333333333336, "x": "暗号の電報が、ちゃんと届くかを確かめたんだ。"}, {"t": 382.28333333333336, "x": "正午の電報では名前が並びはじめる。"}, {"t": 384.6333333333333, "x": "岡田首相も命を奪われたという話がある。"}, {"t": 387.3333333333333, "x": "ただし大使館は、確かめられないと書き添えた。"}, {"t": 390.43333333333334, "x": "うわさの中に首相の名前もあったのね。"}, {"t": 392.95, "x": "同じ電報にはこうも書いてある。"}, {"t": 394.8333333333333, "x": "兵の動きは整っていて、街の人に手を出していない。"}, {"t": 398.35, "x": "外から見ると静かだったのね。"}, {"t": 400.45, "x": "静かなまま政府の中心が止まっていた。"}, {"t": 403.5833333333333, "x": "首相がいないと国の政府はどうなるのか。"}, {"t": 406.01666666666665, "x": "26日の夜11時の電報に答えがある。"}, {"t": 408.9166666666667, "x": "内務大臣の後藤文夫が、臨時の首相代理になった。"}, {"t": 412.46666666666664, "x": "臨時の首相代理？"}, {"t": 413.8833333333333, "x": "首相の仕事をかわりに受け持つ役だ。"}, {"t": 416.18333333333334, "x": "戦後の国会でも、このことが取り上げられた。"}, {"t": 418.96666666666664, "x": "1954年の参議院の予算委員会だ。"}, {"t": 421.93333333333334, "x": "臨時の首相代理は、それまでに\n6回あったと議員が数えた。"}, {"t": 425.65, "x": "その1つが、二・二六事件のときの後藤文夫だ。"}, {"t": 429.03333333333336, "x": "首相が亡くなったと思われていたから、\n代理を立てたのね。"}, {"t": 432.56666666666666, "x": "そうだ。首相の席を、空けたままにはできない。"}, {"t": 435.5, "x": "27日の電報には大臣たちの様子もある。"}, {"t": 438.46666666666664, "x": "政府の全員が宮中でひと晩を過ごした。"}, {"t": 441.2, "x": "宮中で？"}, {"t": 442.3333333333333, "x": "そうだ。モスクワのソ連政府の話として、\nアメリカ大使が伝えた。"}, {"t": 446.6166666666667, "x": "外へ出るのをおそれていたという書き方だ。"}, {"t": 449.1333333333333, "x": "大臣も外に出られなかったのね。"}, {"t": 451.35, "x": "その間も首相官邸は兵がおさえていた。"}, {"t": 453.95, "x": "首相の行方は政府の外には伝わっていない。"}, {"t": 456.76666666666665, "x": "だれも、首相が生きているとは思っていなかったのね。"}, {"t": 460.5, "x": "政府と軍はまず何をしたのか。"}, {"t": 462.45, "x": "寺内陸相の報告ではこう続く。"}, {"t": 464.73333333333335, "x": "東京警備司令官が、すぐに東京の部隊を指揮した。"}, {"t": 468.1333333333333, "x": "26日の午後3時ごろには、戦時警備が出された。"}, {"t": 471.68333333333334, "x": "戦時警備って？"}, {"t": 472.93333333333334, "x": "戦争のときと同じ形で守りを固めることだ。"}, {"t": 475.98333333333335, "x": "そして翌27日には、戒厳令の一部が東京市に出た。"}, {"t": 479.9, "x": "アメリカ大使の電報では午前3時だ。"}, {"t": 482.35, "x": "戒厳令って何が変わるの？"}, {"t": 484.25, "x": "軍の司令官が街の守りをまとめて受け持つ。"}, {"t": 487.0, "x": "電報では通る道が制限されると書いている。"}, {"t": 489.6666666666667, "x": "新聞や電報や電話もきびしく調べられる。"}, {"t": 492.4, "x": "知らせも止められたのね。"}, {"t": 494.03333333333336, "x": "戒厳司令官になったのは香椎浩平だ。"}, {"t": 496.5833333333333, "x": "戒厳司令部もこの日にできた。"}, {"t": 498.56666666666666, "x": "ほかの師団からも兵が東京に呼ばれた。"}, {"t": 501.01666666666665, "x": "第2師団と第14師団からも、一部の兵が上京した。"}, {"t": 504.75, "x": "着いた順に戒厳司令官の下に入れられた。"}, {"t": 507.55, "x": "東京の外からも兵が来たのね。"}, {"t": 509.78333333333336, "x": "寺内陸相の報告では、そう説明されている。"}, {"t": 512.9833333333333, "x": "反乱の兵を外から囲んだのね。"}, {"t": 515.2666666666667, "x": "ただ、すぐには攻めなかった。"}, {"t": 517.1666666666666, "x": "そのわけはあとで寺内陸相が議会で話す。"}, {"t": 520.05, "x": "囲んだまま待ったのね。"}, {"t": 522.1666666666666, "x": "兵がおさえた場所は首相官邸だけではない。"}, {"t": 524.7333333333333, "x": "26日の夜の電報に場所が並ぶ。"}, {"t": 527.25, "x": "首相官邸、警視庁、内務省、陸軍省。"}, {"t": 530.3666666666667, "x": "それに陸軍の参謀本部だ。"}, {"t": 532.3666666666667, "x": "警察の本部までおさえられたの？"}, {"t": 534.5, "x": "そうだ。その警視庁の中庭の写真が残っている。"}, {"t": 537.7166666666667, "x": "撮ったのは、警視庁の写真係だった石川光陽だ。"}, {"t": 541.1333333333333, "x": "日付は1936年2月27日。"}, {"t": 544.5, "x": "中の人が窓から撮ったのね。"}, {"t": 546.6, "x": "4枚あって、どれも雪の中庭を上から写している。"}, {"t": 549.8666666666667, "x": "兵が並び銃を立てて組んだ物が並んでいる。"}, {"t": 552.5166666666667, "x": "1枚には中庭にとめた車も写っている。"}, {"t": 555.3833333333333, "x": "雪がまだたくさん残っているのね。"}, {"t": 557.6166666666667, "x": "27日の東京はまだ雪の中だった。"}, {"t": 560.35, "x": "新聞社の写真ではなく、警察の人が撮った写真だ。"}, {"t": 563.8666666666667, "x": "建物の中にいた人の目で事件が残っている。"}, {"t": 566.9166666666666, "x": "同じころ首相官邸の中も兵がいたのね。"}, {"t": 569.7166666666667, "x": "そうだ。この写真の日に、首相は官邸を出たとされる。"}, {"t": 573.1333333333333, "x": "その話は帝国議会の質問の中にある。"}, {"t": 576.05, "x": "議会の質問に首相の話が出てくるのね。"}, {"t": 578.9666666666667, "x": "その前にもう1本の電報を見ておこう。"}, {"t": 581.8833333333333, "x": "27日の午後1時、アメリカ大使がまた電報を打った。"}, {"t": 585.5, "x": "4人の死が確かめられたとある。"}, {"t": 587.4666666666667, "x": "岡田首相、斎藤内大臣、渡辺教育総監。"}, {"t": 590.85, "x": "そして高橋大蔵大臣だ。"}, {"t": 592.95, "x": "岡田首相の名前が入っているのね。"}, {"t": 595.2666666666667, "x": "ただ高橋大臣の死は、まだ公には出ていないとある。"}, {"t": 598.6833333333333, "x": "お金の世界がゆれないように、\n伏せているのだろう、と。"}, {"t": 601.9333333333333, "x": "外国の大使館まで、首相が\n亡くなったと思っていたのね。"}, {"t": 605.7166666666667, "x": "同じ日、中国の南京からも電報が来ている。"}, {"t": 608.7333333333333, "x": "日本の大使館の人が、外国の記者に話したそうだ。"}, {"t": 612.3166666666667, "x": "亡くなったのは、岡田・高橋・斎藤・渡辺だと。"}, {"t": 615.4833333333333, "x": "日本の人もそう話していたの？"}, {"t": 617.6166666666667, "x": "電報にはそう書かれている。"}, {"t": 619.25, "x": "ただし、検閲がきびしくて確かめられないともある。"}, {"t": 622.4666666666667, "x": "検閲？"}, {"t": 623.6, "x": "新聞や電報の中身を、国が先に調べて止めることだ。"}, {"t": 627.2, "x": "新聞は、少ない公式の発表しか載せられなかった。"}, {"t": 630.7666666666667, "x": "だから本当のことが外に出なかったのね。"}, {"t": 633.4833333333333, "x": "そうだ。その間、首相は官邸の中にいた。"}, {"t": 636.5, "x": "それを話したのがのちの広田首相だ。"}, {"t": 639.0333333333333, "x": "広田さんは、事件のとき大臣だったのよね。"}, {"t": 642.0333333333333, "x": "そうだ。岡田内閣の外務大臣だった。"}, {"t": 644.7, "x": "事件の間は、ほかの大臣と\n宮中に集まっていた側の人だ。"}, {"t": 649.3666666666667, "x": "1936年5月12日、衆議院の予算委員会。"}, {"t": 653.3666666666667, "x": "1人の議員が岡田前首相のことを聞いた。"}, {"t": 655.9833333333333, "x": "最近いちばん人の心を驚かしたのは、\n岡田首相の生存だと。"}, {"t": 660.2833333333333, "x": "生きていたことにみんな驚いたのね。"}, {"t": 662.5166666666667, "x": "答えたのは首相になっていた広田弘毅だ。"}, {"t": 665.1333333333333, "x": "事件のときは岡田内閣の外務大臣だった。"}, {"t": 668.15, "x": "同じ内閣にいた人ね。"}, {"t": 669.95, "x": "広田はこう答えた。"}, {"t": 671.2833333333333, "x": "私も閣僚の1人として知っている。"}, {"t": 673.7, "x": "岡田首相が、たいへん気の毒な\n立場で官邸にいたことを。"}, {"t": 677.3666666666667, "x": "官邸にいたって大臣が議会で言ったのね。"}, {"t": 680.0166666666667, "x": "そうだ。これがこの回の大事な記録の1つだ。"}, {"t": 683.0166666666667, "x": "広田は続けてこう答えている。"}, {"t": 684.9333333333333, "x": "いよいよ出られるようになるとすぐに出た。"}, {"t": 687.0833333333334, "x": "たいへんな苦心をして出て宮中へ行った。"}, {"t": 689.5833333333334, "x": "たいへんな苦心ってどんなことをしたの？"}, {"t": 691.9666666666667, "x": "その中身は答弁には出てこない。"}, {"t": 693.95, "x": "どこに隠れ、どうやって出たのかも、話していない。"}, {"t": 697.1666666666666, "x": "議会の記録にはそこは残っていないのね。"}, {"t": 699.7833333333333, "x": "だからこの回もそこは作らずに進む。"}, {"t": 702.3, "x": "答弁で言われた所までを言うのね。"}, {"t": 704.5166666666667, "x": "そうだ。官邸にいた、苦心して出た。ここまでだ。"}, {"t": 708.3333333333334, "x": "では、亡くなったと伝えられたのはだれだったのか。"}, {"t": 711.2833333333333, "x": "翌年の帝国議会にその名前が出てくる。"}, {"t": 713.9666666666667, "x": "1937年2月24日、衆議院の予算委員会だ。"}, {"t": 718.2333333333333, "x": "議員がこう述べている。"}, {"t": 719.5333333333333, "x": "秘書役だった松尾大佐が、身代わりに命を落とした。"}, {"t": 722.9666666666667, "x": "身代わりに？"}, {"t": 724.1, "x": "アメリカ大使の電報にも同じ話がある。"}, {"t": 726.65, "x": "首相の義理の弟で首相に少し似ていた人。"}, {"t": 729.5833333333334, "x": "その人が、間違えられて命を落とした、とある。"}, {"t": 732.8, "x": "顔が似ていたから間違えられたのね。"}, {"t": 735.0666666666667, "x": "これは、宮中から戻った人の話として書かれている。"}, {"t": 738.5333333333333, "x": "大使がまた聞きしたことだ。"}, {"t": 740.3833333333333, "x": "記録のことばをそのまま言うのね。"}, {"t": 742.4833333333333, "x": "松尾大佐は首相の身の回りを手伝っていた。"}, {"t": 745.2333333333333, "x": "そして首相のかわりにこの朝亡くなった。"}, {"t": 747.85, "x": "首相が生きていた話は、この人の話でもあるのね。"}, {"t": 751.4, "x": "そうだ。だから救出の話だけにはしない。"}, {"t": 754.1666666666666, "x": "官邸ではほかにも犠牲になった人がいる。"}, {"t": 756.7, "x": "首相を守っていた警察の人たちだ。"}, {"t": 759.25, "x": "その人たちのことも、忘れないでおきたいわね。"}, {"t": 762.3, "x": "人数と名前は、今回の記録では確かめきれなかった。"}, {"t": 765.7666666666667, "x": "だから数字は言わない。"}, {"t": 767.7666666666667, "x": "首相を連れ出したのはだれだったのか。"}, {"t": 769.95, "x": "1977年7月30日、参議院の本会議。"}, {"t": 774.0333333333333, "x": "亡くなった迫水久常議員への、\n追悼の言葉が読まれた。"}, {"t": 777.9, "x": "迫水さんは戦後は議員になったのね。"}, {"t": 780.3666666666667, "x": "そうだ。参議院の議員だった。"}, {"t": 782.3166666666667, "x": "追悼の言葉は事件のことをこう述べる。"}, {"t": 784.7, "x": "総理官邸の内も外も、反乱軍の将兵が\nきびしく見張っていた。"}, {"t": 788.8833333333333, "x": "その中で落ち着いてすばやく事を進めた。"}, {"t": 791.5, "x": "そしてついに総理を無事に救い出した。"}, {"t": 793.9333333333333, "x": "見張りの中で救い出したのね。"}, {"t": 795.9833333333333, "x": "決死の行動だったとも述べている。"}, {"t": 798.1333333333333, "x": "決死って命がけってことよね。"}, {"t": 800.25, "x": "そうだ。見つかれば、首相も秘書官も危なかった。"}, {"t": 803.5166666666667, "x": "事件の朝、迫水は33歳。"}, {"t": 805.9666666666667, "x": "大蔵省から来て、まだ2年足らずの秘書官だった。"}, {"t": 809.35, "x": "若い秘書官が首相を助けたのね。"}, {"t": 811.7333333333333, "x": "ただ、追悼の言葉も、手順までは話していない。"}, {"t": 814.9, "x": "迫水本人は、のちにそのときのことを本にしている。"}, {"t": 818.25, "x": "題は「機関銃下の首相官邸」だ。"}, {"t": 820.9, "x": "本人の体験はその本に書いてあるのね。"}, {"t": 823.5333333333333, "x": "この回は公の記録に出てくる所までを言う。"}, {"t": 826.9833333333333, "x": "首相が官邸を出たのはいつだったのか。"}, {"t": 829.3333333333334, "x": "1936年5月12日の、あの議員の質問に出てくる。"}, {"t": 833.7, "x": "26日に起きた事件が、27日の昼には危機を脱した。"}, {"t": 837.85, "x": "そして首相の生存がはっきりしたと。"}, {"t": 840.3166666666667, "x": "27日の昼に官邸を出たのね。"}, {"t": 842.8166666666667, "x": "そう議員は述べている。"}, {"t": 844.1, "x": "ただ、これは質問の中のことばだ。"}, {"t": 846.45, "x": "答えた広田は日時までは言っていない。"}, {"t": 848.85, "x": "だから言い切らないのね。"}, {"t": 850.3833333333333, "x": "そうだ。警視庁の写真と同じ、27日の話になる。"}, {"t": 854.2666666666667, "x": "アメリカの電報が首相の死を\n伝えたのは、27日の午後1時。"}, {"t": 858.4833333333333, "x": "じゃあちょうど同じころなの？"}, {"t": 860.0833333333334, "x": "時刻を重ねるとそう読める。"}, {"t": 861.8333333333334, "x": "ただ電報の時刻と、官邸を出た時刻は別の物だ。"}, {"t": 865.25, "x": "何時何分に出たのかは今回の記録には無い。"}, {"t": 868.1666666666666, "x": "でも、死んだと伝えられている\n間に、首相は動いていたのね。"}, {"t": 872.0166666666667, "x": "そうだ。電報の「確かめられた」は、後から外れた。"}, {"t": 875.6666666666666, "x": "議員はこの質問で、もう1つ大事なことを聞いている。"}, {"t": 878.9833333333333, "x": "首相が出てきてから、職に戻るまでの間のことだ。"}, {"t": 882.4166666666666, "x": "すぐには首相に戻れなかったの？"}, {"t": 885.05, "x": "議員の質問はこう続いた。"}, {"t": 886.85, "x": "首相は宮内省で閣議をしている\n最中に、生存を明らかにした。"}, {"t": 890.8833333333333, "x": "そして、自分から職に戻ろうとした。"}, {"t": 893.4, "x": "それなのになぜ止められたのかと。"}, {"t": 895.4833333333333, "x": "首相が戻ろうとしたのに止められたの？"}, {"t": 897.9, "x": "議員はそう見ていた。"}, {"t": 899.1666666666666, "x": "臨時の代理は、首相が無事ならすぐ職を解くべきだ。"}, {"t": 902.45, "x": "その間の1日は、取り返しのつかない1日だった。"}, {"t": 905.9833333333333, "x": "それは議員の考えよね？"}, {"t": 907.7, "x": "そうだ。議員の考えとして聞いてほしい。"}, {"t": 910.15, "x": "広田はこう答えた。"}, {"t": 911.4666666666667, "x": "宮中に出向いたときには、\n臨時代理はもう解かれていた。"}, {"t": 914.8, "x": "岡田首相は元の首相の地位に戻っていた。"}, {"t": 917.6166666666667, "x": "じゃあちゃんと戻れたのね。"}, {"t": 919.2, "x": "ただ広田はこうも言っている。"}, {"t": 920.8666666666667, "x": "その間に、少し時期が遅れたような感じは持っていた。"}, {"t": 924.2666666666667, "x": "でも当時の事情で、しかたがなかったと思っている。"}, {"t": 927.4333333333333, "x": "遅れたかもしれないことは認めたのね。"}, {"t": 929.8666666666667, "x": "生きていることは、多分もう天皇に伝わっていた。"}, {"t": 932.8333333333334, "x": "広田はそれを推測だと断って答えている。"}, {"t": 936.25, "x": "首相が官邸を出たあとも兵はまだ動かない。"}, {"t": 938.8833333333333, "x": "28日、1枚の命令が出された。"}, {"t": 941.4833333333333, "x": "文書の番号は臨変参命第三号だ。"}, {"t": 944.1833333333333, "x": "りんぺんさんめい？"}, {"t": 945.35, "x": "参謀本部が出す臨時の命令の番号のことだ。"}, {"t": 948.2666666666667, "x": "頭に奉勅と書いてある。"}, {"t": 950.0666666666667, "x": "奉勅って？"}, {"t": 951.2, "x": "天皇の命令を受けて出すという意味だ。"}, {"t": 953.45, "x": "中身はこうだ。"}, {"t": 954.45, "x": "戒厳司令官は、三宅坂の近くを\n占めている将校以下を。"}, {"t": 958.1166666666667, "x": "すみやかに今の構えを解かせよ。"}, {"t": 960.0833333333334, "x": "そして、それぞれの師団長の下に戻らせよ。"}, {"t": 963.1166666666667, "x": "元の部隊に戻れという命令なのね。"}, {"t": 965.4833333333333, "x": "日付は昭和11年2月28日。"}, {"t": 968.15, "x": "出したのは参謀総長の載仁親王だ。"}, {"t": 970.8, "x": "あて先は戒厳司令官の香椎浩平。"}, {"t": 973.2, "x": "紙の右上には、極秘の印がある。"}, {"t": 975.7666666666667, "x": "秘密の命令だったのね。"}, {"t": 977.5166666666667, "x": "外に知らせる紙ではなく、軍の中の命令書だ。"}, {"t": 980.75, "x": "これで兵は戻ったの？"}, {"t": 982.2666666666667, "x": "その日のうちには戻らなかった。"}, {"t": 984.2333333333333, "x": "アメリカ大使の28日の夜中の電報に、こうある。"}, {"t": 987.5666666666667, "x": "午後3時、いちばん上からの命令が\n反乱の側に届けられた。"}, {"t": 991.35, "x": "しかし反乱の側は、従わないことを選んだ、と。"}, {"t": 995.2, "x": "28日の東京はどんな様子だったのか。"}, {"t": 997.9666666666667, "x": "28日の正午の電報には、戦車の話が出てくる。"}, {"t": 1001.5833333333334, "x": "政府側の兵が戦車とともに集まっている。"}, {"t": 1004.2, "x": "場所はイギリス大使館の近くだ。"}, {"t": 1006.45, "x": "街の中に戦車が来たのね。"}, {"t": 1008.45, "x": "戒厳司令部の参謀が、\nアメリカ大使館をたずねてきた。"}, {"t": 1011.95, "x": "戦いになれば、ここにも弾が飛ぶかもしれない。"}, {"t": 1014.8833333333333, "x": "陸軍士官学校へ移ってはどうかと言った。"}, {"t": 1017.6166666666667, "x": "大使館ごと引っ越すの？"}, {"t": 1019.3166666666667, "x": "大使はお礼を言って断った。"}, {"t": 1021.1166666666667, "x": "そして職員と家族に、外に出ないように伝えた。"}, {"t": 1024.3166666666666, "x": "29日の電報では、職員の家族を\n大使の公邸に泊めている。"}, {"t": 1028.3666666666666, "x": "建物の下には土のうの守りも置かれていた。"}, {"t": 1031.0333333333333, "x": "同じ日の午後6時の電報に、こんな1文がある。"}, {"t": 1034.0666666666666, "x": "反乱の側の旗は、まだ首相の官邸の上に立っている。"}, {"t": 1037.6833333333334, "x": "首相が出たあとなのに旗はまだあるのね。"}, {"t": 1040.1833333333334, "x": "そうだ。首相はもう官邸にいない。"}, {"t": 1042.3, "x": "でも外から見れば、官邸はまだ反乱の側の場所だ。"}, {"t": 1045.7166666666667, "x": "首相が生きていることも、まだ知られていないのね。"}, {"t": 1048.7166666666667, "x": "この日、第一師団長が命令を伝えたともある。"}, {"t": 1051.75, "x": "反乱の側は、従うと言いながら条件を話し合っていた。"}, {"t": 1055.4166666666667, "x": "まだ終わらないのね。"}, {"t": 1057.25, "x": "28日にはもう1つの知らせがあった。"}, {"t": 1059.8666666666666, "x": "高橋大蔵大臣の死が正式に発表された。"}, {"t": 1063.0833333333333, "x": "亡くなったのは26日よね？"}, {"t": 1065.2, "x": "そうだ。2日たってから発表された。"}, {"t": 1067.6833333333334, "x": "電報によると、株や債券の取引所は閉まっていた。"}, {"t": 1071.0666666666666, "x": "だから市場の動きはまだ見えない。"}, {"t": 1073.15, "x": "取引所が閉まっていたのね。"}, {"t": 1075.1, "x": "ただ、銀行の預金を引き出す人が多かった。"}, {"t": 1078.0166666666667, "x": "新聞は全国でそう伝えていた。"}, {"t": 1080.25, "x": "みんな不安だったのね。"}, {"t": 1081.7833333333333, "x": "27日の電報には、銀行家の心配も書かれていた。"}, {"t": 1085.4166666666667, "x": "高橋の死は、日本の国債の市場に悪い影響を出す。"}, {"t": 1088.95, "x": "お金の市場がひどくゆれるかもしれない。"}, {"t": 1091.4, "x": "それだけ大事な人だったのね。"}, {"t": 1093.4666666666667, "x": "高橋はそれまでに、何度も大蔵大臣を務めていた。"}, {"t": 1096.9166666666667, "x": "戦後の国会でも、高橋の名前は何度も出てくる。"}, {"t": 1100.2166666666667, "x": "不景気から抜け出す政策を、\n議員や大臣が語っている。"}, {"t": 1103.85, "x": "今の国会でも、話に出るのね。"}, {"t": 1106.2833333333333, "x": "一方で、円の相場はほぼふだんどおりだった。"}, {"t": 1108.9666666666667, "x": "横浜正金銀行が、\n買い支えていたからだと書いている。"}, {"t": 1112.6, "x": "銀行が円を支えていたのね。"}, {"t": 1114.5833333333333, "x": "重臣の死は国のお金の流れにも響いた。"}, {"t": 1117.2666666666667, "x": "そして翌29日、事件はようやく終わりに向かう。"}, {"t": 1121.0666666666666, "x": "2月29日、朝の東京。"}, {"t": 1123.2166666666667, "x": "アメリカ大使の午前11時の電報が、\n朝の様子を伝える。"}, {"t": 1126.9166666666667, "x": "午前5時、反乱の兵に向けてラジオで呼びかけた。"}, {"t": 1130.1666666666667, "x": "ラジオで兵に話しかけたの？"}, {"t": 1132.1166666666666, "x": "そうだ。天皇の命令に従って兵営に戻れと。"}, {"t": 1135.1833333333334, "x": "考え直してほしいとも呼びかけた。"}, {"t": 1137.3666666666666, "x": "従わなければ、反乱の者として扱われる、とも。"}, {"t": 1140.9166666666667, "x": "きびしい言い方ね。"}, {"t": 1142.2166666666667, "x": "同じ中身のビラが飛行機からまかれた。"}, {"t": 1144.65, "x": "反乱の兵がいる場所の上からだ。"}, {"t": 1146.8166666666666, "x": "空から紙を落としたのね。"}, {"t": 1148.6166666666666, "x": "大使館はここに大事な点があると書いた。"}, {"t": 1151.1333333333334, "x": "ビラは兵だけにあてて、将校にはあてていない。"}, {"t": 1154.0, "x": "兵と将校を分けて呼びかけたのね。"}, {"t": 1156.2833333333333, "x": "そうだ。兵は命令で連れてこられた、という見方だ。"}, {"t": 1159.4833333333333, "x": "ラジオでは降りた兵の数も伝えられた。"}, {"t": 1161.8, "x": "山王ホテルのあたりから約300人。"}, {"t": 1164.1333333333334, "x": "午前10時には、機関銃を持った30人も降りた。"}, {"t": 1167.2666666666667, "x": "戒厳の区域では、車も人も通れなくなっていた。"}, {"t": 1170.5166666666667, "x": "止められた道は、横浜のあたりまで続いたという。"}, {"t": 1173.7166666666667, "x": "少しずつ兵が戻りはじめたのね。"}, {"t": 1176.0333333333333, "x": "このとき配られた紙の1枚が、今も残っている。"}, {"t": 1179.8666666666666, "x": "残っている紙の見出しはこうだ。"}, {"t": 1181.7666666666667, "x": "下士官兵に告ぐ。"}, {"t": 1183.15, "x": "下士官兵って？"}, {"t": 1184.45, "x": "将校より下の兵や下士官のことだ。"}, {"t": 1186.8333333333333, "x": "中身は3つの箇条書きになっている。"}, {"t": 1189.0833333333333, "x": "1つ目。今からでも遅くないから、原隊へ帰れ。"}, {"t": 1192.4666666666667, "x": "原隊って？"}, {"t": 1193.6, "x": "自分が元いた部隊のことだ。"}, {"t": 1195.4833333333333, "x": "2つ目は、手向かう者は\n逆賊として撃つ、という警告だ。"}, {"t": 1199.25, "x": "3つ目。お前たちの父母兄弟は、\n国賊となるので皆泣いておるぞ。"}, {"t": 1203.5166666666667, "x": "家族のことまで書いてあるのね。"}, {"t": 1205.5166666666667, "x": "日付は2月29日、出したのは戒厳司令部だ。"}, {"t": 1208.9833333333333, "x": "戒厳司令部って、香椎さんの所よね？"}, {"t": 1211.7333333333333, "x": "そうだ。27日にできた、あの司令部だ。"}, {"t": 1214.6666666666667, "x": "紙は縦長で、大きな字で刷られている。"}, {"t": 1217.2, "x": "見出しの字が、とくに大きい。"}, {"t": 1218.9833333333333, "x": "役所の出した紙だから、新聞社の写真ではない。"}, {"t": 1222.2833333333333, "x": "兵たちはこれを読んだの？"}, {"t": 1223.9, "x": "上から落ちてきた紙を、拾って読んだ兵もいたはずだ。"}, {"t": 1227.1333333333334, "x": "ただ、何人が読んだかは記録に無い。"}, {"t": 1229.6166666666666, "x": "それは分からないのね。"}, {"t": 1231.0833333333333, "x": "このあと兵はつぎつぎに戻っていく。"}, {"t": 1233.25, "x": "そして午後すべてが終わる。"}, {"t": 1234.9333333333334, "x": "最後は、戦いになったの？"}, {"t": 1237.4166666666667, "x": "29日の午後4時、アメリカ大使が電報を打った。"}, {"t": 1240.6, "x": "反乱の兵はすべて降りたと発表された。"}, {"t": 1243.1333333333334, "x": "午後4時10分には、ふだんの状態に戻るという。"}, {"t": 1246.25, "x": "4日目の夕方に終わったのね。"}, {"t": 1248.3, "x": "寺内陸相も議会でこう報告した。"}, {"t": 1250.7166666666667, "x": "29日には、ついに武力で解決するしかなくなった。"}, {"t": 1254.2166666666667, "x": "しかし幸いに撃ち合いにはならなかった。"}, {"t": 1256.5666666666666, "x": "同じ日の午後にすっかり静まった。"}, {"t": 1258.8, "x": "撃ち合わずに済んだのね。"}, {"t": 1260.3333333333333, "x": "国立国会図書館の解説も、29日に終わったと書く。"}, {"t": 1264.25, "x": "天皇が討伐の意思をはっきり\n示したことで、事態は鎮圧に向かった。"}, {"t": 1268.6666666666667, "x": "天皇の考えが大きかったのね。"}, {"t": 1270.85, "x": "午後6時の電報にはこうある。"}, {"t": 1272.65, "x": "事件の間、東京ではとてもよく秩序が保たれた。"}, {"t": 1275.9833333333333, "x": "アメリカ人でけがをした人はいない。"}, {"t": 1278.1833333333334, "x": "街の人は落ち着いていたのね。"}, {"t": 1280.2166666666667, "x": "そして午後7時。最初の電報の時刻だ。"}, {"t": 1282.9833333333333, "x": "大使のもとに宮中から戻った人が来た。"}, {"t": 1285.8166666666666, "x": "やっと最初の電報に戻ってきたのね。"}, {"t": 1288.3166666666666, "x": "そうだ。ここから首相の話がもう一度動く。"}, {"t": 1291.8333333333333, "x": "電報に名前が出るのは林男爵という人だ。"}, {"t": 1294.75, "x": "宮中の儀式を受け持っていた、元の式部長官だ。"}, {"t": 1298.0833333333333, "x": "宮中から戻ったばかりの林男爵が、大使に話した。"}, {"t": 1301.8166666666666, "x": "首相は無事で、体に傷も無いという。"}, {"t": 1304.3833333333334, "x": "やっと外国の大使にも伝わったのね。"}, {"t": 1306.9166666666667, "x": "電報はこう続ける。"}, {"t": 1308.2666666666667, "x": "首相に少し似た\n義理の弟が、間違えられて亡くなった。"}, {"t": 1311.8666666666666, "x": "首相は逃れてずっと身を隠していた。"}, {"t": 1314.2666666666667, "x": "その間だれにも知られずにいたのね。"}, {"t": 1316.5333333333333, "x": "そして首相は、突然天皇の前に名乗り出たという。"}, {"t": 1319.7666666666667, "x": "それで臨時代理の後藤は首相の職を返した。"}, {"t": 1322.6, "x": "岡田がふたたび首相に戻った。"}, {"t": 1324.7166666666667, "x": "天皇はどう受け止めたの？"}, {"t": 1326.3833333333334, "x": "たいへん喜んだと公に伝えられたとある。"}, {"t": 1329.0166666666667, "x": "大使は最後にこう見立てている。"}, {"t": 1330.8666666666666, "x": "この4日間で、軍への反発が\n国じゅうに広がるかもしれない。"}, {"t": 1334.7666666666667, "x": "それは大使の考えよね？"}, {"t": 1336.5333333333333, "x": "そうだ。大使の見立てだ。"}, {"t": 1338.2, "x": "電報は加わった将校の数にも触れている。"}, {"t": 1340.7833333333333, "x": "大尉より上の者はいない、\n15人から20人ほどと聞いた、と。"}, {"t": 1344.7666666666667, "x": "将校は思ったより少ないのね。"}, {"t": 1346.8666666666666, "x": "これも聞いた話として書かれた数だ。"}, {"t": 1349.2333333333333, "x": "一方で、電報には食い違う所もある。"}, {"t": 1351.7833333333333, "x": "首相が身を隠したのを、25日の夜からと書いている。"}, {"t": 1355.3666666666666, "x": "事件は26日の未明よね？"}, {"t": 1357.55, "x": "そうだ。また聞きの電報だから、\n細かい所がずれている。"}, {"t": 1361.75, "x": "事件が終わって将校たちはどうなったのか。"}, {"t": 1364.25, "x": "3月1日の午後6時の電報にこうある。"}, {"t": 1366.9333333333334, "x": "戒厳令はまだ続いているが、東京はほぼ元に戻った。"}, {"t": 1370.4, "x": "道をふさいでいた物はすべて取り払われた。"}, {"t": 1372.9666666666667, "x": "兵にかわって、警察が街を見回るようになった。"}, {"t": 1376.0333333333333, "x": "兵の姿が見えるのは、\n戒厳司令部の近くくらいだという。"}, {"t": 1379.7166666666667, "x": "街はもう落ち着いたのね。"}, {"t": 1381.35, "x": "公式の発表では、将校のうち自ら\n命を絶ったのは野中大尉1人だけ。"}, {"t": 1386.1333333333334, "x": "ほかの将校はつかまって獄にいる。"}, {"t": 1388.3666666666666, "x": "みんなつかまったのね。"}, {"t": 1389.8833333333334, "x": "そして、軍から追放された。"}, {"t": 1391.9, "x": "裁判の前に追放したのは、これまでより\nきびしい扱いだと書いている。"}, {"t": 1396.15, "x": "裁判はそのあとなの？"}, {"t": 1397.7166666666667, "x": "そうだ。軍の裁判、軍法会議で裁かれた。"}, {"t": 1400.65, "x": "国立国会図書館の解説は、その結論をこう書く。"}, {"t": 1404.25, "x": "反乱の将校と、考えのもとになった\n北一輝と西田税が死刑になった。"}, {"t": 1409.15, "x": "将校のほかにも裁かれた人がいるのね。"}, {"t": 1411.8, "x": "裁判の記録そのものは、戦後に\n一度アメリカ側に移された。"}, {"t": 1415.6333333333334, "x": "日本に返されて、今は東京地方検察庁が持っている。"}, {"t": 1419.2333333333333, "x": "2012年の国会で議員がそう説明した。"}, {"t": 1422.2333333333333, "x": "今も全部は見られないの？"}, {"t": 1423.9166666666667, "x": "法務省は公開できないと答えたそうだ。"}, {"t": 1426.35, "x": "だからこの回も判決の結論だけを言う。"}, {"t": 1429.5666666666666, "x": "首相に戻った岡田はそのあとどうしたのか。"}, {"t": 1432.1833333333334, "x": "3月2日の電報では、新しい内閣の相談が続いていた。"}, {"t": 1436.2, "x": "外務次官は、2、3日かかるだろうと大使に話した。"}, {"t": 1439.9166666666667, "x": "岡田内閣は終わったの？"}, {"t": 1441.6333333333334, "x": "そうだ。岡田内閣は事件のあと退いた。"}, {"t": 1444.4166666666667, "x": "かわって首相になったのが広田弘毅だ。"}, {"t": 1446.85, "x": "3月に広田内閣ができた。"}, {"t": 1449.0333333333333, "x": "外務大臣だった広田さんね。"}, {"t": 1451.1, "x": "そのときの写真に、大臣たちの署名が入っている。"}, {"t": 1454.3166666666666, "x": "写真のまん中あたりに、広田弘毅の名前が見える。"}, {"t": 1457.4833333333333, "x": "筆で書いた名前が、写真の上に重なっている。"}, {"t": 1460.55, "x": "大臣たちが、自分で名前を書いたの？"}, {"t": 1463.1333333333334, "x": "そう見えるが、だれが書いたかは\n確かめられていない。"}, {"t": 1466.1666666666667, "x": "みんなの名前が写真に書いてあるのね。"}, {"t": 1468.5333333333333, "x": "この内閣の陸軍大臣が寺内寿一だ。"}, {"t": 1471.4166666666667, "x": "新しい内閣で陸軍をあずかった人だ。"}, {"t": 1474.0833333333333, "x": "5月に議会で事件を報告した人ね。"}, {"t": 1476.7833333333333, "x": "そうだ。この内閣で、5月の特別議会が開かれた。"}, {"t": 1480.4166666666667, "x": "事件のあと最初の議会だ。"}, {"t": 1482.1833333333334, "x": "5月6日の衆議院で、寺内陸相の報告が読まれた。"}, {"t": 1485.8, "x": "この回の2つ目の章で見た、あの報告だ。"}, {"t": 1488.7166666666667, "x": "議会では何が話されたの？"}, {"t": 1490.65, "x": "事件の責任と軍のこれからだ。"}, {"t": 1492.7833333333333, "x": "そして、生き残った前の首相のことも話に出た。"}, {"t": 1496.6833333333334, "x": "寺内陸相は、すぐに攻めなかったわけを話した。"}, {"t": 1499.8833333333334, "x": "攻めることはもちろんできた。"}, {"t": 1501.5833333333333, "x": "しかしそうすれば、同胞相撃つ流血はさけられない。"}, {"t": 1504.8333333333333, "x": "同胞相撃つって？"}, {"t": 1506.15, "x": "同じ国の者どうしが撃ち合うことだ。"}, {"t": 1508.3833333333334, "x": "それにその場所は宮城に近い。"}, {"t": 1510.3333333333333, "x": "皇族の住まいや役所、外国の公館もある。"}, {"t": 1513.2666666666667, "x": "住んでいる人の家もたくさんある。"}, {"t": 1515.35, "x": "街の真ん中で撃ち合えば、関係ない人も危ないのね。"}, {"t": 1518.7666666666667, "x": "だから3日にわたって、帰るように説いたという。"}, {"t": 1521.55, "x": "反乱の部隊とは、わざと呼ばなかったとも話した。"}, {"t": 1524.75, "x": "将校を刺激しないための、苦心の手段だったと。"}, {"t": 1527.8166666666666, "x": "形の上だけ、一時は元の部隊長の指揮に\n入れたこともあった。"}, {"t": 1531.75, "x": "これも、説いて戻らせるための手だったと話した。"}, {"t": 1534.8666666666666, "x": "呼び方まで気をつけていたのね。"}, {"t": 1536.9, "x": "大臣は兵のことにも触れている。"}, {"t": 1538.9, "x": "上官の命令だと信じて、加わった下士官や兵がいる。"}, {"t": 1542.35, "x": "その兵と家族には、心から残念に思っていると。"}, {"t": 1545.7833333333333, "x": "兵は命令だと思って動いたのね。"}, {"t": 1547.9666666666667, "x": "ビラが兵だけにあてられたのも、同じ考えだろう。"}, {"t": 1550.95, "x": "ただこれは大臣の説明として聞いてほしい。"}, {"t": 1553.6666666666667, "x": "軍の側の言い分、ということね。"}, {"t": 1555.8, "x": "そうだ。ここからは事件の理由の話になる。"}, {"t": 1559.2166666666667, "x": "将校たちは何をしようとしていたのか。"}, {"t": 1561.55, "x": "寺内陸相は、将校の文書と取り調べの話をまとめた。"}, {"t": 1565.35, "x": "将校が書いたのは蹶起趣意書という文書だ。"}, {"t": 1568.1, "x": "けっきしゅいしょ？"}, {"t": 1569.25, "x": "立ち上がるわけを書いた文書のことだ。"}, {"t": 1571.4333333333334, "x": "将校たちは、昭和維新をなしとげると述べていた。"}, {"t": 1574.5833333333333, "x": "昭和維新？"}, {"t": 1575.7166666666667, "x": "国を作り直すという意味で使った言葉だ。"}, {"t": 1578.35, "x": "大臣は、国の今の姿に直すべき\n所が多いことは認めた。"}, {"t": 1582.3833333333334, "x": "ただ、その底にある考えは\n国と相容れない、と述べた。"}, {"t": 1585.95, "x": "理由は分かるけど、やり方は認めないってこと？"}, {"t": 1588.95, "x": "大臣の言い方はもっときびしい。"}, {"t": 1590.8666666666666, "x": "天皇の軍隊が武器で重臣を傷つけた。"}, {"t": 1593.4833333333333, "x": "それは決して許されない反乱だったと。"}, {"t": 1595.9, "x": "取り調べの結果は、別に\n秘密会で話したいとも言った。"}, {"t": 1599.6333333333334, "x": "秘密会？"}, {"t": 1600.75, "x": "中身を外に出さない形で開く、議会の会のことだ。"}, {"t": 1604.4333333333334, "x": "はっきり反乱と言ったのね。"}, {"t": 1606.25, "x": "この回は、ここで将校の言い分には深入りしない。"}, {"t": 1609.2333333333333, "x": "言い分と判決で決まったことは分けておく。"}, {"t": 1611.7666666666667, "x": "決まったのは反乱として裁かれたことだ。"}, {"t": 1614.45, "x": "将校の側の思いはここでは追わないのね。"}, {"t": 1616.9833333333333, "x": "そうだ。この回の主役は、記録に残った4日間だ。"}, {"t": 1621.1, "x": "生きて戻った岡田はどう見られたのか。"}, {"t": 1623.3166666666666, "x": "5月12日の議員はこう述べている。"}, {"t": 1625.5666666666666, "x": "今いちばん気の毒な立場にいるのは、岡田前首相だ。"}, {"t": 1629.0333333333333, "x": "気の毒ってどうして？"}, {"t": 1630.5, "x": "臣節をつくす上で欠ける所があった、と\n国民に責められている。"}, {"t": 1634.6, "x": "臣節？"}, {"t": 1635.7166666666667, "x": "天皇に仕える者としての、守るべき道のことだ。"}, {"t": 1639.0166666666667, "x": "生き残ったことを、責める声があったということだ。"}, {"t": 1642.05, "x": "生きていたのに責められたの？"}, {"t": 1643.8333333333333, "x": "そうだ。議員はその声に反対の立場だった。"}, {"t": 1646.7, "x": "欠けていたのは岡田ではなく、\n当時の閣僚ではないか。"}, {"t": 1649.95, "x": "そう言って広田に問いただした。"}, {"t": 1651.95, "x": "岡田さんをかばう質問だったのね。"}, {"t": 1654.2333333333333, "x": "前の日、5月11日の本会議では逆の発言もあった。"}, {"t": 1658.05, "x": "岡田前首相は、なぜ命をもって\n国民にわびなかったのか。"}, {"t": 1661.75, "x": "議長が、その議員に壇を降りるよう求めている。"}, {"t": 1664.65, "x": "議会でも、意見が割れていたのね。"}, {"t": 1666.9333333333334, "x": "命が助かった人が責められる空気があった。"}, {"t": 1669.75, "x": "それも会議録に残っている。"}, {"t": 1672.2, "x": "事件から1年たった1937年2月24日。"}, {"t": 1676.15, "x": "松尾大佐の名前が出たあの予算委員会だ。"}, {"t": 1678.7333333333333, "x": "このときの首相は、陸軍大将の林銑十郎だった。"}, {"t": 1682.3, "x": "議員は、首相の覚悟を聞くために岡田の話を出した。"}, {"t": 1685.7666666666667, "x": "議員は岡田前首相の今の様子を話している。"}, {"t": 1688.6, "x": "世を忍んで、いるのかいないのか\n分からない様子だと。"}, {"t": 1691.7166666666667, "x": "世を忍ぶって？"}, {"t": 1692.8666666666666, "x": "人目をさけてひっそり暮らすことだ。"}, {"t": 1695.2, "x": "首相だった人がひっそりと？"}, {"t": 1697.15, "x": "秘書役の松尾大佐が、身代わりに命を落とした。"}, {"t": 1700.2666666666667, "x": "それに対して、岡田前首相は世を\n忍んでいる、という話し方だ。"}, {"t": 1704.45, "x": "松尾大佐のこととつなげて話したのね。"}, {"t": 1707.1, "x": "議員はこれも臣節の考え方によると述べた。"}, {"t": 1709.9666666666667, "x": "どちらがよいとは言い切らない、とも添えている。"}, {"t": 1712.4833333333333, "x": "それは議員の受け止め方だ。"}, {"t": 1714.25, "x": "岡田本人が議会で語った記録は、\n今回は見つからなかった。"}, {"t": 1718.2833333333333, "x": "本人の気持ちは記録には無いのね。"}, {"t": 1720.6, "x": "そうだ。だからここで止めておく。"}, {"t": 1722.6166666666666, "x": "岡田啓介は1952年に亡くなっている。"}, {"t": 1725.75, "x": "1954年の国会では、故岡田啓介さんと呼ばれた。"}, {"t": 1729.8666666666666, "x": "戦後まで生きたのね。"}, {"t": 1731.35, "x": "事件から16年ほどあとのことだ。"}, {"t": 1734.2666666666667, "x": "救い出した迫水はそのあとどうなったのか。"}, {"t": 1736.9, "  "x": "1977年の追悼は、救い出した秘書官をたたえた。"}, {"t": 1859.1, "x": "同じ事件をいろんな面から話しているのね。"}, {"t": 1861.8166666666666, "x": "どれも首相がいなかった4日間の話だ。"}, {"t": 1864.5666666666666, "x": "本当は首相は官邸の中にいたのにね。"}, {"t": 1867.2166666666667, "x": "そうだ。いないとされた首相は、\nずっと東京の真ん中にいた。"}, {"t": 1871.5166666666667, "x": "では4日間を時刻で並べ直してみよう。"}, {"t": 1874.0, "x": "26日の早朝、約1400余名の将兵が動いた。"}, {"t": 1877.7833333333333, "x": "午前10時、アメリカ大使が試しの電報を打つ。"}, {"t": 1880.7166666666667, "x": "午後3時ごろ戦時警備が出された。"}, {"t": 1882.9, "x": "夜には、後藤内務大臣が臨時の首相代理になった。"}, {"t": 1886.4333333333334, "x": "まだ1日目なのね。"}, {"t": 1887.9666666666667, "x": "27日の午前3時、戒厳令が出た。"}, {"t": 1890.8, "x": "昼には首相が危機を脱したと議員は述べた。"}, {"t": 1893.45, "x": "午後1時、大使は首相の死が確かめられたと打電した。"}, {"t": 1897.0666666666666, "x": "同じ27日に、生きている首相と、\n亡くなったという電報が並ぶのね。"}, {"t": 1901.8166666666666, "x": "28日、臨変参命第三号が出た。"}, {"t": 1904.7333333333333, "x": "夕方になっても、官邸の上には\n反乱の側の旗があった。"}, {"t": 1908.4, "x": "29日の午前5時、ラジオの呼びかけとビラ。"}, {"t": 1911.3166666666666, "x": "午後4時、兵はすべて降りたと発表された。"}, {"t": 1914.0166666666667, "x": "そして午後7時、首相は生きていると打電された。"}, {"t": 1917.2166666666667, "x": "最初に「亡くなった」と伝わってから、\n2日以上たっていたのね。"}, {"t": 1921.4833333333333, "x": "そうだ。首相がいないとされた\n時間が、それだけ続いた。"}, {"t": 1925.0166666666667, "x": "時刻を並べると記録どうしのずれも見える。"}, {"t": 1927.6333333333334, "x": "同じ時刻に別のことが書かれていたのね。"}, {"t": 1930.35, "x": "外の記録は、中で起きていたことに\n追いついていなかった。"}, {"t": 1934.4333333333334, "x": "最後に、分かっていないことをまとめておこう。"}, {"t": 1937.0166666666667, "x": "首相が官邸のどこにいたのか。"}, {"t": 1938.95, "x": "どうやって見張りの中を出たのか。"}, {"t": 1940.9166666666667, "x": "何時何分に出たのか。"}, {"t": 1942.5833333333333, "x": "どれも公の記録には無いのね。"}, {"t": 1944.7, "x": "そうだ。広田の答弁は「苦心をして出た」まで。"}, {"t": 1947.9, "x": "追悼の言葉は「無事に救い出した」まで。"}, {"t": 1950.7666666666667, "x": "アメリカの電報は「身を隠していた」までだ。"}, {"t": 1953.7333333333333, "x": "その先は迫水さんの本の中なのね。"}, {"t": 1956.3833333333334, "x": "本人の体験としては本に書かれている。"}, {"t": 1958.9, "x": "本が出たのは、1964年だ。"}, {"t": 1961.7166666666667, "x": "事件から、28年たってからなのね。"}, {"t": 1964.4833333333333, "x": "ただこの回は、公の記録で確かめられた所で止めた。"}, {"t": 1968.2666666666667, "x": "確かめられない所は、空けておくのね。"}, {"t": 1970.9, "x": "裁判の記録も今は公開されていない。"}, {"t": 1973.3, "x": "2012年の国会で、議員がそう話していた。"}, {"t": 1976.4166666666667, "x": "開かれれば、分かることが増えるかもしれない。"}, {"t": 1979.2166666666667, "x": "まだ分かっていないことがあるのね。"}, {"t": 1981.25, "x": "はっきりしているのは、首相は官邸の中にいたことだ。"}, {"t": 1984.5666666666666, "x": "そして、その身代わりに亡くなった人がいたことだ。"}, {"t": 1987.7833333333333, "x": "生きていた首相と、亡くなった人の両方の話なのね。"}, {"t": 1991.4166666666667, "x": "そうだ。それがこの回の、いちばん大事な所だ。"}, {"t": 1995.2, "x": "二・二六事件では多くの人が亡くなった。"}, {"t": 1997.8166666666666, "x": "斎藤実、高橋是清、渡辺錠太郎。"}, {"t": 2001.0333333333333, "x": "首相の身代わりになった松尾大佐。"}, {"t": 2003.2166666666667, "x": "そして、官邸などを守っていた警察の人たちだ。"}, {"t": 2006.6, "x": "みんなに家族がいたのよね。"}, {"t": 2008.4, "x": "そうだ。だからこの回は、\n襲われた場面を描かなかった。"}, {"t": 2012.05, "x": "首相を救った秘書官の話も、命がけだったのね。"}, {"t": 2015.65, "x": "見張りの中で、首相を連れ出した33歳の秘書官。"}, {"t": 2019.1333333333334, "x": "その行動は、40年あまりあとの国会でたたえられた。"}, {"t": 2022.6666666666667, "x": "記録の中にちゃんと残っていたのね。"}, {"t": 2025.0333333333333, "x": "外国の大使は、首相の死と生をどちらも電報に書いた。"}, {"t": 2028.6333333333334, "x": "議会では生き残った首相が責められもした。"}, {"t": 2031.3833333333334, "x": "同じ人がいろんな見方をされたのね。"}, {"t": 2033.8, "x": "事件は29日の午後に終わった。"}, {"t": 2035.95, "x": "でも、首相が生きていると外に\n伝わったのは、その夜だった。"}, {"t": 2039.95, "x": "最後まで首相の話は記録の外にあったのね。"}, {"t": 2043.05, "x": "アメリカ大使が最後に打った、あの1本。"}, {"t": 2045.5333333333333, "x": "無事を知らせる、短い1本の電報だ。"}, {"t": 2048.2, "x": "その1行の裏に4日間があったのね。"}, {"t": 2050.733333333333, "x": "二・二六事件の4日間は、こうして\n会議録と電報に残っている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
