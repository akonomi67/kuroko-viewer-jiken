<script>
const D={"name": "109", "file": "109_編集用", "dur": 2166.81665625, "segs": [], "subs": [{"t": 0.0, "x": "1951年11月25日、日曜日。"}, {"t": 3.466666666666667, "x": "神奈川県藤沢市の鵠沼だ。"}, {"t": 5.633333333333334, "x": "夕食のあと、一人の男が散歩に出た。"}, {"t": 8.35, "x": "着ていたのはふだん着と、霜降りの外套だけだ。"}, {"t": 11.416666666666666, "x": "寒い時期ね。どのくらい歩くの？"}, {"t": 13.6, "x": "20分くらいだ。"}, {"t": 14.833333333333334, "x": "それ以上は体がもたない。"}, {"t": 16.483333333333334, "x": "この人は右側の肋骨が7本なかった。"}, {"t": 19.383333333333333, "x": "7本も？"}, {"t": 20.316666666666666, "x": "結核の手術で取っている。"}, {"t": 22.1, "x": "医者には散歩は短くと言われていた。"}, {"t": 24.35, "x": "家から江ノ電の鵠沼駅のほうへ歩いて、ぐるっと戻る。"}, {"t": 27.733333333333334, "x": "いつもの道だ。"}, {"t": 28.816666666666666, "x": "その夜この人は戻らなかった。"}, {"t": 30.866666666666667, "x": "次に家族のもとへ帰ってきたのは、\n1952年12月7日の夜。"}, {"t": 35.8, "x": "……え、翌年の冬？"}, {"t": 37.266666666666666, "x": "数えると378日だ。"}, {"t": 39.483333333333334, "x": "20分の散歩が、378日になった。"}, {"t": 42.78333333333333, "x": "帰ってきた3日後、この人は\n衆議院の委員会に証人として座っている。"}, {"t": 47.233333333333334, "x": "外套を着たまま、座ったままでな。"}, {"t": 49.516666666666666, "x": "医者の診断で、証言は20分までという約束だった。"}, {"t": 53.06666666666667, "x": "最初の質問は、生年月日だった。"}, {"t": 55.63333333333333, "x": "答えはこうだ。"}, {"t": 56.63333333333333, "x": "「明治三十六年五月一日生れ」"}, {"t": 59.016666666666666, "x": "作家の鹿地亘。"}, {"t": 60.28333333333333, "x": "本名は瀬口貢という。"}, {"t": 62.1, "x": "作家が散歩の途中でいなくなったのね。"}, {"t": 64.63333333333334, "x": "今回はこの378日に何があったのかを、\n国会に残った記録で追う。"}, {"t": 69.56666666666666, "x": "鹿地亘事件だ。"}, {"t": 70.85, "x": "先に一つだけ言っておく。"}, {"t": 72.55, "x": "この事件には、二つの言い分がある。"}, {"t": 74.81666666666666, "x": "閉じ込められたという言い分と、\n保護したという言い分だ。"}, {"t": 77.91666666666667, "x": "この動画では、どちらが正しいかを決めない。"}, {"t": 80.61666666666666, "x": "決めないの？"}, {"t": 81.55, "x": "国会も最後まで決めきれなかった。"}, {"t": 83.75, "x": "その決めきれなかった形を、そのまま見ていく。"}, {"t": 87.31666666666666, "x": "まずこの人がどういう人かを見ておく。"}, {"t": 89.51666666666667, "x": "生まれは1903年。"}, {"t": 91.15, "x": "大分県の出身だ。"}, {"t": 92.58333333333333, "x": "鹿地亘という名前は、筆名だ。"}, {"t": 94.81666666666666, "x": "東京帝国大学の3年生のころ、文章を\n書くようになってから使い始めた。"}, {"t": 99.83333333333333, "x": "ペンネームなのね。"}, {"t": 101.1, "x": "1934年の春、治安維持法で逮捕されている。"}, {"t": 104.71666666666667, "x": "判決は懲役2年、執行猶予5年だ。"}, {"t": 107.43333333333334, "x": "これも本人が国会で話している。"}, {"t": 109.63333333333334, "x": "そのあと中国へ渡る。"}, {"t": 111.15, "x": "目的は中国文学の研究だ。"}, {"t": 113.45, "x": "上海で作家の魯迅のもとを訪ねた。"}, {"t": 115.95, "x": "魯迅って教科書に出てくる人？"}, {"t": 118.08333333333333, "x": "その魯迅だ。紹介したのは、上海で\n本屋をやっていた日本人だった。"}, {"t": 122.5, "x": "内山書店の内山完造という人だ。"}, {"t": 125.0, "x": "この名前はあとで大事になる。"}, {"t": 126.76666666666667, "x": "魯迅の翻訳も、鹿地亘の名前で出している。"}, {"t": 129.73333333333332, "x": "戦争が始まると、鹿地は中国の側にいた。"}, {"t": 132.63333333333333, "x": "国民政府の軍事委員会の顧問という形で、\n日本人捕虜の教育と世話をしていた。"}, {"t": 137.93333333333334, "x": "日本と戦っている側で？"}, {"t": 139.8, "x": "そうだ。日本人の反戦同盟を\n作った人として知られている。"}, {"t": 143.61666666666667, "x": "ここは本人の証言と、妻の証言の両方にある。"}, {"t": 146.85, "x": "妻の池田幸子とは、1938年に上海で結婚している。"}, {"t": 151.41666666666666, "x": "日本に帰ってきたのは、戦争が終わったあとだ。"}, {"t": 154.33333333333334, "x": "帰国の年は記録によって\n1946年と1947年で割れている。"}, {"t": 159.56666666666666, "x": "妻は1946年の5月だと証言した。"}, {"t": 162.98333333333332, "x": "本人は？"}, {"t": 163.9, "x": "本人は「二十二年ですな、五月」と答えている。"}, {"t": 167.3, "x": "昭和22年だな。"}, {"t": 168.71666666666667, "x": "少しあいまいだ。"}, {"t": 169.8, "x": "帰国してまもなく、結核がひどくなる。"}, {"t": 172.41666666666666, "x": "手術で右の肋骨を7本取った。"}, {"t": 174.76666666666668, "x": "1950年の暮れから、鵠沼の家を\n借りて一人で療養していた。"}, {"t": 179.13333333333333, "x": "妻と小さい娘二人は、東京の落合に住んでいた。"}, {"t": 182.65, "x": "一人で海の近くに住んでたのね。"}, {"t": 184.9, "x": "療養のためだ。"}, {"t": 186.0, "x": "そしてその療養の散歩で消えた。"}, {"t": 188.68333333333334, "x": "あの夜のことは、本人の証言でしか分からない。"}, {"t": 191.68333333333334, "x": "目撃者は見つかっていない。"}, {"t": 193.4, "x": "警視総監も国会でそう述べている。"}, {"t": 195.63333333333333, "x": "だからここからしばらくは\n「本人がこう証言した」という話だ。"}, {"t": 199.8, "x": "分かった。そう思って聞く。"}, {"t": 201.7, "x": "時刻は午後7時ごろ。"}, {"t": 203.2, "x": "「七時ちょっと過ぎておったかと\n思います」と言っている。"}, {"t": 206.26666666666668, "x": "江ノ電の鵠沼駅の近くの道だ。"}, {"t": 208.55, "x": "片側は電車の線路だった。"}, {"t": 210.41666666666666, "x": "人通りは全くなかったという。"}, {"t": 212.4, "x": "学校と屋敷が多い、静かな通りだ。"}, {"t": 214.86666666666667, "x": "うしろから車が一台来た。"}, {"t": 216.7, "x": "軍用の乗用車だ。"}, {"t": 218.05, "x": "本人の言葉だとこうなる。"}, {"t": 219.76666666666668, "x": "「ヘッドライトに目がくらんで」"}, {"t": 221.4, "x": "車から五、六人が飛び出してきた。"}, {"t": 223.86666666666667, "x": "制服の者と私服の者がいた。"}, {"t": 226.13333333333333, "x": "いきなり？"}, {"t": 226.93333333333334, "x": "いきなりだ。殴り倒されて、\n両手をうしろにねじ上げられた。"}, {"t": 230.48333333333332, "x": "手錠をかけられ、白い布で目隠しをされた。"}, {"t": 233.21666666666667, "x": "声は出せなかった。"}, {"t": 234.48333333333332, "x": "肺に大きな声を出す力が残っていなかったからだ。"}, {"t": 237.76666666666668, "x": "……抵抗しようがないわね。"}, {"t": 239.3, "x": "車は1時間以上走った。"}, {"t": 241.21666666666667, "x": "前の席には指揮をとる男が座っていた。"}, {"t": 243.8, "x": "名前は名乗らなかった。"}, {"t": 245.26666666666668, "x": "あとで分かった名前を、本人は国会でこう言っている。"}, {"t": 248.36666666666667, "x": "「キャノンという中佐」。"}, {"t": 249.56666666666666, "x": "会議録では「キヤナン」と書かれている。"}, {"t": 252.01666666666668, "x": "委員長に何をされたのかと\n聞かれて、鹿地はこう答えた。"}, {"t": 255.38333333333333, "x": "「もっと適切にいえば人さらいだと思います」"}, {"t": 258.18333333333334, "x": "人さらい、ね。"}, {"t": 259.46666666666664, "x": "本人の言葉としてはそうだ。"}, {"t": 261.31666666666666, "x": "米側の言い方は、だいぶ違う。"}, {"t": 263.35, "x": "それは後で並べる。"}, {"t": 265.23333333333335, "x": "着いたのはある建物の二階だった。"}, {"t": 267.3833333333333, "x": "目隠しのままだったので、場所は見ていない。"}, {"t": 269.96666666666664, "x": "そこで夜明けまで調べられたと証言している。"}, {"t": 272.71666666666664, "x": "何を聞かれたの？"}, {"t": 274.0, "x": "最初に名前を聞かれた。"}, {"t": 275.55, "x": "でも鹿地は答えなかった。"}, {"t": 277.1666666666667, "x": "理由を国会でこう語っている。"}, {"t": 279.05, "x": "「人の名前を聞くなら、まず\n自分の名前を告げるがいい」"}, {"t": 282.35, "x": "強気ね。"}, {"t": 283.23333333333335, "x": "ただあとでこうも言っている。"}, {"t": 284.7, "x": "車の中で「お前鹿地だろう」と言われた。"}, {"t": 287.3833333333333, "x": "だから相手は知っていたとも思える、とな。"}, {"t": 289.85, "x": "取り調べの中身は、二つの方向だったという。"}, {"t": 292.8, "x": "一つはどこかの国のスパイではないかという疑い。"}, {"t": 295.73333333333335, "x": "もう一つはこちらに協力しないかという誘いだ。"}, {"t": 298.76666666666665, "x": "疑っておいて、仲間になれって言うの？"}, {"t": 301.28333333333336, "x": "本人の証言ではそうだ。"}, {"t": 302.95, "x": "脅しの言葉も証言している。"}, {"t": 304.8333333333333, "x": "お前は一撃で死ぬ体だから、\nゆっくり扱うと言われたそうだ。"}, {"t": 308.7, "x": "翌日には病院へ連れて行かれた。"}, {"t": 310.81666666666666, "x": "レントゲンの袋に書いてあった名前で、\n病院の場所が分かったという。"}, {"t": 314.76666666666665, "x": "診た医者の言葉はこうだったと証言している。"}, {"t": 317.35, "x": "「このままでは半年持たない」"}, {"t": 319.21666666666664, "x": "そんな体で連れて行かれたのね。"}, {"t": 321.3333333333333, "x": "そうだ。ここで一つ、建物の話をしておく。"}, {"t": 324.45, "x": "最初の建物がどこだったのか。"}, {"t": 326.51666666666665, "x": "本人は目隠しで分からなかった。"}, {"t": 328.6166666666667, "x": "のちに警視総監が国会でまとめた\n場所は、文京区の岩崎邸だ。"}, {"t": 332.81666666666666, "x": "いまの都立旧岩崎邸庭園、\n上野の不忍池の近くにある洋館だな。"}, {"t": 337.53333333333336, "x": "あの洋館？　観光で行ける所じゃない。"}, {"t": 339.98333333333335, "x": "いまはそうだ。"}, {"t": 340.85, "x": "当時はアメリカ軍に接収されていた。"}, {"t": 343.1166666666667, "x": "そこで40年近く働いていた\n老人が、国会で証言している。"}, {"t": 347.26666666666665, "x": "1946年の5月15日に接収されて、中には\n「本郷ハウス」と呼ばれる機関が入っていたという。"}, {"t": 354.31666666666666, "x": "その老人は、11月ごろ二階に\n病人がいたらしい、と証言した。"}, {"t": 358.6, "x": "食器を消毒液の皿で消毒していたので、\n結核の病人だと思ったそうだ。"}, {"t": 363.48333333333335, "x": "食器で分かったのね。"}, {"t": 364.98333333333335, "x": "顔は見ていない。"}, {"t": 366.0, "x": "だからそれが鹿地だったとは言い切れない。"}, {"t": 368.18333333333334, "x": "ここも「そうらしい」までの話だ。"}, {"t": 371.1, "x": "家族の側に目を移す。"}, {"t": 372.6666666666667, "x": "妻の池田幸子が夫の不在を\n知ったのは、翌日の昼ごろだった。"}, {"t": 376.85, "x": "鵠沼の療養先の看護婦から、こう聞かれたという。"}, {"t": 380.05, "x": "「昨夜先生がお帰りになりませんが、\nこちらにお見えになっていますか」"}, {"t": 384.1333333333333, "x": "家族のほうも、何も知らないのね。"}, {"t": 386.48333333333335, "x": "何も知らない。"}, {"t": 387.5, "x": "そこへ手紙が届く。"}, {"t": 388.8833333333333, "x": "療養先の家のポストに入っていた。"}, {"t": 391.1666666666667, "x": "筆跡は夫のものだった。"}, {"t": 393.06666666666666, "x": "本人から？"}, {"t": 394.1, "x": "本人からだ。中身はこうだったと、妻が証言している。"}, {"t": 397.68333333333334, "x": "散歩の途中で、自動車にはねられた。"}, {"t": 400.1166666666667, "x": "重慶で顔見知りだった中国人に\n助けられて、いまその人のところにいる。"}, {"t": 404.68333333333334, "x": "その人は密入国だから、名前も住所も言えない。"}, {"t": 407.8666666666667, "x": "すぐ帰るから安心して待っていてくれ。"}, {"t": 410.26666666666665, "x": "……それ、本当なの？"}, {"t": 411.73333333333335, "x": "本人はのちに、相手の指示で\n書いた手紙だと証言している。"}, {"t": 415.3666666666667, "x": "お金を添えてやると言われたが、断ったそうだ。"}, {"t": 418.18333333333334, "x": "1月の終わりには、はがきも来た。"}, {"t": 420.3833333333333, "x": "鵠沼の部屋の家賃が切れるから\n払っておいてくれ、という内容だ。"}, {"t": 424.4, "x": "生活の話まで来るのね。"}, {"t": 426.3333333333333, "x": "家族は表向き騒がなかった。"}, {"t": 428.35, "x": "妻はのちにその理由を国会で話している。"}, {"t": 430.95, "x": "中国にいたころは、こういうことは\nよくある、と頭に入っていたからだと。"}, {"t": 435.23333333333335, "x": "最初、妻は台湾のほうの筋を疑っていた。"}, {"t": 438.1666666666667, "x": "アメリカだとは思っていなかった。"}, {"t": 440.18333333333334, "x": "手紙の中身を、そのまま信じたわけじゃないのね。"}, {"t": 443.28333333333336, "x": "半分ぐらいだろうな。"}, {"t": 444.6166666666667, "x": "警察に届けたのは、ずっとあとになってからだ。"}, {"t": 448.25, "x": "4日後の11月29日の夜。"}, {"t": 450.56666666666666, "x": "鹿地はまた目隠しをされて、車で移された。"}, {"t": 453.4, "x": "着いた先は川崎市の新丸子だ。"}, {"t": 455.76666666666665, "x": "今度はどうして場所が分かったの？"}, {"t": 457.81666666666666, "x": "買い物袋に書いてあった店の名前だ。"}, {"t": 460.26666666666665, "x": "そこから川崎だと分かったと証言している。"}, {"t": 462.98333333333335, "x": "建物はもとは銀行の持ち物だった。"}, {"t": 465.3666666666667, "x": "東京銀行のクラブで、東銀クラブ。"}, {"t": 467.76666666666665, "x": "中にいた人たちはTCと呼んでいた。"}, {"t": 470.06666666666666, "x": "ここで働いていた日本人の雑役係が、\n二人、国会で証言している。"}, {"t": 474.85, "x": "一人はこう言った。"}, {"t": 476.01666666666665, "x": "建物は十文字の形で、\n真ん中だけが二階になっている。"}, {"t": 479.75, "x": "病人がいたのは、下の南側に出っ張った部屋だった。"}, {"t": 483.3, "x": "病人ってやっぱり鹿地さん？"}, {"t": 485.0833333333333, "x": "二人とも病人とだけ呼んでいる。"}, {"t": 487.0833333333333, "x": "名前は聞かされていない。"}, {"t": 488.56666666666666, "x": "もう一人はこう証言した。"}, {"t": 490.26666666666665, "x": "「夜連れて来ましたときに、そのあくる日から\n病人であるから近寄っちゃいけない」"}, {"t": 494.75, "x": "ハウスの中には全く入れてもらえなかったそうだ。"}, {"t": 497.6333333333333, "x": "敷地の一方は、鉄条網で囲まれていた。"}, {"t": 500.55, "x": "逃げられたの？　そこから。"}, {"t": 502.31666666666666, "x": "そこで、二人の証言が割れた。"}, {"t": 504.4166666666667, "x": "一人は「逃げようと思えば\n逃げられたでしょう」と答えた。"}, {"t": 507.73333333333335, "x": "もう一人は「ガードがついておりますから、\n出られないだろう」と答えた。"}, {"t": 511.95, "x": "同じ建物で働いてたのに？"}, {"t": 514.05, "x": "同じ建物でだ。"}, {"t": 515.3, "x": "委員の一人は、答えが「一転、二転、\n三転して来ておる」と指摘している。"}, {"t": 520.25, "x": "警視総監がのちにまとめた\n中には、夜のガードの話もある。"}, {"t": 524.1, "x": "「顔もなるべく見るな」と言われたという。"}, {"t": 526.4833333333333, "x": "見るな、か。"}, {"t": 527.55, "x": "見張り小屋も新しく建てられた、と総監は述べている。"}, {"t": 531.4166666666666, "x": "川崎に移って数日後のことだ。"}, {"t": 533.65, "x": "ここから先は、つらい話になる。"}, {"t": 535.8666666666667, "x": "言葉は短くしておく。"}, {"t": 537.5666666666667, "x": "うん。"}, {"t": 538.1, "x": "1951年12月2日の未明、午前2時。"}, {"t": 541.65, "x": "鹿地は自分の命を絶とうとした。"}, {"t": 543.7166666666667, "x": "日付は記録によって三つある。"}, {"t": 545.6666666666666, "x": "本人が最初に出した声明では11月29日の夜中。"}, {"t": 549.45, "x": "国会の証言では12月2日の未明。"}, {"t": 552.0333333333333, "x": "警視総監の要約では12月3日だった。"}, {"t": 554.9166666666666, "x": "どれなの？"}, {"t": 555.7666666666667, "x": "本人は国会で、声明の日付は\n間違いで12月2日だと訂正した。"}, {"t": 560.3666666666667, "x": "のちの委員会の結論も、12月2日を採っている。"}, {"t": 563.7, "x": "だからこの動画も12月2日にする。"}, {"t": 566.1333333333333, "x": "なぜそうしたのか。"}, {"t": 567.3333333333334, "x": "本人の証言はこうだ。"}, {"t": 568.8666666666667, "x": "「他国のスパイになれ、自分たちの手先になれ、\nそれでなければ死を選ぶか、どっちかだ」"}, {"t": 574.25, "x": "……そう迫られたって言ってるのね。"}, {"t": 576.1833333333333, "x": "そう言っている。"}, {"t": 577.1166666666667, "x": "夜を選んだのは、気づかれないためだったそうだ。"}, {"t": 579.9166666666666, "x": "見つけたのは、このクラブで\n働いていた日本人のコックだった。"}, {"t": 583.6666666666666, "x": "ドアは中から鍵がかかっていた。"}, {"t": 585.6666666666666, "x": "コックは便所の上から入って、鍵を開けた。"}, {"t": 588.35, "x": "机の上に小さな紙切れと懐中時計があった。"}, {"t": 591.3166666666667, "x": "紙切れにはこう書いてあったとコックは証言している。"}, {"t": 594.2833333333333, "x": "「内山様、私は信念を守って死にます。"}, {"t": 597.1, "x": "時計は一時を、鹿地」"}, {"t": 598.7666666666667, "x": "内山様って、上海で本屋をしていた人？"}, {"t": 601.8, "x": "そうだ。内山完造あての遺書だった。"}, {"t": 604.2, "x": "監視役の二世の軍曹は、日本語を\n読むのが得意ではなかった。"}, {"t": 608.05, "x": "だからコックが声に出して読んだ。"}, {"t": 610.0166666666667, "x": "コックの証言はこう続く。"}, {"t": 611.7333333333333, "x": "「そこで私は初めて鹿地という人物を知ったわけです」"}, {"t": 615.1333333333333, "x": "それまで誰なのか知らなかったのね。"}, {"t": 617.3833333333333, "x": "知らなかった。"}, {"t": 618.3333333333334, "x": "病人とだけ聞かされていた。"}, {"t": 620.1333333333333, "x": "鹿地は助かった。"}, {"t": 621.35, "x": "翌日の夕方に目が覚めたという。"}, {"t": 623.5166666666667, "x": "ただ、しばらくは水も通らなかった。"}, {"t": 625.8666666666667, "x": "ミルクが通るまで4週間近くかかったという。"}, {"t": 628.6166666666667, "x": "時計は子どもへの形見のつもりだったと、\n本人はあとで話している。"}, {"t": 633.2333333333333, "x": "自殺未遂のあとで、一つの書類が作られている。"}, {"t": 636.4, "x": "のちに国会で、いちばん大きな争点になる書類だ。"}, {"t": 639.7, "x": "書類？"}, {"t": 640.4, "x": "本人の手書きの「手記」だ。"}, {"t": 642.45, "x": "米側は自白だと言い、本人は書かされたと言った。"}, {"t": 645.5666666666667, "x": "本人の証言では、作ったのは12月の半ばごろ。"}, {"t": 648.9, "x": "1週間から10日かかった。"}, {"t": 650.7, "x": "黄色い大きい状袋を渡されたという。"}, {"t": 652.95, "x": "中には鉛筆と消しゴム。"}, {"t": 654.6333333333333, "x": "それと書く項目を並べた紙が入っていた。"}, {"t": 657.4333333333333, "x": "書く中身まで決まってたってこと？"}, {"t": 659.6, "x": "本人はそう証言している。"}, {"t": 661.3333333333334, "x": "筋書があったとな。"}, {"t": 662.7166666666667, "x": "あとでペンを買ってきてもらって、ペンで書いた。"}, {"t": 665.3666666666667, "x": "日本の原稿用紙に縦書きだ。"}, {"t": 667.4166666666666, "x": "日付と署名はした。"}, {"t": 668.8333333333334, "x": "捺印はしなかったように思う、と言っている。"}, {"t": 671.4, "x": "のちに国警の長官が、その手記を\n国会で一部読み上げた。"}, {"t": 675.1166666666667, "x": "縦書きで58ページ。"}, {"t": 676.75, "x": "米側の説明では、\n1951年12月28日に出されたものだという。"}, {"t": 682.15, "x": "58ページも。"}, {"t": 683.5333333333333, "x": "中身の筋はこうだ。"}, {"t": 684.9, "x": "その年の6月ごろ、鵠沼の海岸で\n米軍の演習を見ていた。"}, {"t": 688.9333333333333, "x": "そこで外国人に声をかけられた。"}, {"t": 691.1166666666667, "x": "その人の紹介で、ある無線技師と会うようになった。"}, {"t": 694.2666666666667, "x": "その無線技師に、連絡の紙を渡していた、という筋だ。"}, {"t": 698.05, "x": "本当にあったことなの？"}, {"t": 699.6833333333333, "x": "そこが分からない。"}, {"t": 700.8166666666667, "x": "本人は示された筋書のとおりに\n実話風に書かされたと証言した。"}, {"t": 705.0, "x": "米側は本人が認めたことだと説明した。"}, {"t": 707.8333333333334, "x": "手記の終わりには、こんな一行がある。"}, {"t": 710.05, "x": "「この関係が切れたのでほっとした感じをしている」"}, {"t": 713.0, "x": "……どっちとも読めるわね。"}, {"t": 714.5, "x": "読めるんだ。だから、この動画では\n中身の真偽を決めない。"}, {"t": 717.9333333333333, "x": "決まっているのは、書かれたのが\n自殺未遂の約2週間後で、体が\n弱りきった時期だったことだけだ。"}, {"t": 724.5666666666667, "x": "ここでもう一人の主役を紹介する。"}, {"t": 726.8166666666667, "x": "遺書を読んだコックだ。"}, {"t": 728.1, "x": "名前は山田善二郎。"}, {"t": 729.5333333333333, "x": "1928年1月31日生まれで、当時は23歳だった。"}, {"t": 734.35, "x": "戦争中は予科練にいた。"}, {"t": 736.0166666666667, "x": "共産党とは関係のない人物だと、\n猪俣議員が国会で述べている。"}, {"t": 740.4833333333333, "x": "若いのね。"}, {"t": 741.45, "x": "戦後は進駐軍の仕事をしていた。"}, {"t": 743.6666666666666, "x": "働いて7年になると本人は話している。"}, {"t": 746.4333333333333, "x": "将校の家でハウスボーイとして2年半働いた。"}, {"t": 749.3666666666667, "x": "その家の主人が、のちに鹿地を捕まえた\n中佐だったと山田は証言している。"}, {"t": 754.0833333333334, "x": "え、そこにつながるの？"}, {"t": 755.7, "x": "その中佐が帰国するときに、\nこの川崎のクラブの仕事を世話されたそうだ。"}, {"t": 760.2333333333333, "x": "そして11月の下旬、一人の病人を\n連れてくるから部屋を準備しておけと言われた。"}, {"t": 765.2166666666667, "x": "自殺未遂のあと、山田は病人の食事を運ぶ係になる。"}, {"t": 769.1333333333333, "x": "どうして山田さんが？"}, {"t": 770.6, "x": "本人の証言だと、見張り役の軍曹が\n少し怠け者だったから、らしい。"}, {"t": 775.2833333333333, "x": "三度の食事。体をふくお湯。"}, {"t": 777.1833333333333, "x": "部屋の掃除。洗濯物。本の買い物。"}, {"t": 780.0166666666667, "x": "鹿地が頼んだ本も、山田が並べて証言している。"}, {"t": 783.2333333333333, "x": "雑誌の中央公論、世界、改造。"}, {"t": 785.6, "x": "トルストイのアンナ・カレーニナと復活。"}, {"t": 788.05, "x": "魏志倭人伝。それと、当時出たばかりの小説だ。"}, {"t": 791.35, "x": "閉じ込められて、トルストイを読んでたのね。"}, {"t": 793.9666666666667, "x": "水彩画の絵の具や紙も、頼めば買ってくれたそうだ。"}, {"t": 797.1666666666666, "x": "鹿地に近づけたのは、見張りの軍曹と\n山田の二人だけだった。"}, {"t": 801.0333333333333, "x": "そして山田は、だんだん鹿地と口をきくようになる。"}, {"t": 804.6833333333333, "x": "鹿地は山田に、一つ頼みごとをした。"}, {"t": 807.1666666666666, "x": "上海の内山完造さんに、\n自分のことを伝えてほしい、と。"}, {"t": 811.0666666666667, "x": "遺書のあて先の人ね。"}, {"t": 812.7166666666667, "x": "そうだ。内山は当時、東京に住んでいた。"}, {"t": 815.5333333333333, "x": "最初の連絡は、1952年の2月の下旬だったと\n山田は証言している。"}, {"t": 820.6166666666667, "x": "小さくて細い紙切れだった。"}, {"t": 822.5166666666667, "x": "内山はそれを国会で\n「一枚の小さい細い書いたもの」と言っている。"}, {"t": 826.8833333333333, "x": "何て書いてあったの？"}, {"t": 828.3, "x": "子どもを頼む、という内容だったと内山は証言した。"}, {"t": 831.65, "x": "一つ言葉の食い違いがある。"}, {"t": 833.5, "x": "山田は「人に売られた」と書いてあったと言った。"}, {"t": 836.4833333333333, "x": "鹿地は自分が書いたのは\n「はかられている」だと証言している。"}, {"t": 840.25, "x": "けっこう違うわね。"}, {"t": 841.55, "x": "違う。ここも食い違いのまま置いておく。"}, {"t": 843.95, "x": "2回目は4月の下旬か5月の上旬。"}, {"t": 846.3666666666667, "x": "今度はたばこの銀紙に書いた。"}, {"t": 848.3333333333334, "x": "3回目は1冊のノートだった。"}, {"t": 850.35, "x": "詩や子どもにあてた自分の話が書いてあったという。"}, {"t": 853.3, "x": "受け取った内山は、これを長いあいだ伏せていた。"}, {"t": 856.2666666666667, "x": "どうして？　すぐ知らせればいいのに。"}, {"t": 858.4333333333333, "x": "内山の証言では、騒げば\n鹿地の命が危ないと考えたからだ。"}, {"t": 862.5166666666667, "x": "「もう少し待とう」と山田にも言っていたらしい。"}, {"t": 865.1333333333333, "x": "妻が夫の監禁を知ったのは、4月の末ごろだ。"}, {"t": 868.3666666666667, "x": "内山から夫の直筆の紙片を見せられた。"}, {"t": 871.2, "x": "初めて山田から返事を受け取ったときの鹿地の様子を、\n山田はこう話している。"}, {"t": 875.8833333333333, "x": "「非常ににっこりと笑って、どうもありがとうと言った」"}, {"t": 878.9833333333333, "x": "……それはうれしいわよね。"}, {"t": 880.3833333333333, "x": "山田はあそこで初めて心から\n笑ったと思う、とも言っている。"}, {"t": 884.7166666666667, "x": "1952年の3月の初め。"}, {"t": 887.2333333333333, "x": "鹿地はまた移された。"}, {"t": 888.6, "x": "今度は茅ヶ崎だ。"}, {"t": 889.8833333333333, "x": "松林に囲まれた別荘で、米軍に接収されていた。"}, {"t": 893.5333333333333, "x": "また目隠し？"}, {"t": 894.6333333333333, "x": "また目隠しだ。"}, {"t": 895.75, "x": "山田の証言では、移すときに\nこう声をかけていたという。"}, {"t": 899.1833333333333, "x": "「いいですか、足元を気をつけて」"}, {"t": 901.2333333333333, "x": "建物の名前はUSハウスC31号。"}, {"t": 904.0166666666667, "x": "門には大きな標識があった。"}, {"t": 905.8666666666667, "x": "米軍管理財産につき立入禁止、と書いてあったそうだ。"}, {"t": 909.4333333333333, "x": "この家の見回りを頼まれていた\n近所の農家の人も、国会で証言している。"}, {"t": 914.0166666666667, "x": "「アメリカは全然日本人を立入り\n禁止で、入れないのです」"}, {"t": 917.5666666666667, "x": "近所の人も入れなかったのね。"}, {"t": 919.6, "x": "家は二階建てで、二階に部屋が二つあった。"}, {"t": 922.35, "x": "鹿地はその二階だ。"}, {"t": 923.65, "x": "外につけた非常ばしごの出入口は、\nくぎで打ちつけてあった。"}, {"t": 927.3166666666667, "x": "ここでは岩崎邸で働いていたあの老人も\n雑用係として呼ばれている。"}, {"t": 931.7333333333333, "x": "消毒の皿の人？"}, {"t": 933.25, "x": "その人だ。二階のドアに、言われて\n新しく錠をつけたと証言した。"}, {"t": 937.5333333333333, "x": "二階の客のことは「お客さん」と呼んでいたそうだ。"}, {"t": 940.6833333333333, "x": "食事を持っていくと、いつもこう言われたという。"}, {"t": 943.35, "x": "「ごちそうさまでした、ごくろうさんでした」"}, {"t": 945.8833333333333, "x": "丁寧な人ね。"}, {"t": 947.1166666666667, "x": "ところがこの老人と山田とで、\n受け取り方が大きく違う。"}, {"t": 950.6666666666666, "x": "老人は「監禁といえば、非常に楽な監禁」と言った。"}, {"t": 954.3, "x": "山田は庭に出ることも一切許されなかったと言った。"}, {"t": 957.55, "x": "また割れるのね。"}, {"t": 958.7166666666667, "x": "割れる。ただ老人も、委員に重ねて聞かれて、\n止められていたわけです、と言い直している。"}, {"t": 964.0833333333334, "x": "ここにはある大佐が週に何度か来ていた。"}, {"t": 966.55, "x": "山田はG大佐と呼んでいる。"}, {"t": 968.3, "x": "1回に30分から40分、鹿地と話していったそうだ。"}, {"t": 972.6166666666667, "x": "その大佐が何を話していたのか。"}, {"t": 974.7666666666667, "x": "鹿地の証言がある。"}, {"t": 976.0333333333333, "x": "2月の末ごろ、最初の中佐が\n別の大佐を連れてきたという。"}, {"t": 979.7833333333333, "x": "そしてこう言った。"}, {"t": 980.9166666666666, "x": "「私の用事はあなたにはもう済んだ、\n今後のあなたはこちらの方に渡す」"}, {"t": 985.2666666666667, "x": "人を物みたいに渡すのね。"}, {"t": 987.2, "x": "本人の証言ではそうだ。"}, {"t": 988.8666666666667, "x": "そのあとの大佐の頼みは、こうだったという。"}, {"t": 991.4666666666667, "x": "中国でやっていたようなことを、\n今度は米軍の側からやってくれ。"}, {"t": 995.35, "x": "捕虜の教育とか、反戦の呼びかけとか？"}, {"t": 998.15, "x": "たぶんそういうことだ。"}, {"t": 999.4666666666667, "x": "中身はそれ以上はっきりしない。"}, {"t": 1001.3166666666667, "x": "大佐は本を何冊も持ってきた。"}, {"t": 1003.3833333333333, "x": "元共産党員の人たちが書いた手記だ。"}, {"t": 1006.0166666666667, "x": "それを読んで、感想を書けと言われた。"}, {"t": 1008.2666666666667, "x": "鹿地はこれを「思想テスト」と呼んでいる。"}, {"t": 1010.7833333333333, "x": "感想は横書きの原稿用紙に25、26枚前後。"}, {"t": 1014.45, "x": "何回か書かされたそうだ。"}, {"t": 1016.2333333333333, "x": "書いたのね。"}, {"t": 1017.1833333333333, "x": "書いた。ただし、のらりくらりと\n書いた、と本人は言っている。"}, {"t": 1020.8, "x": "敵に言質を与えない。"}, {"t": 1022.2166666666667, "x": "でも時を待つ。機会を待つ。"}, {"t": 1024.1333333333334, "x": "そういう書き方だったと。"}, {"t": 1025.7, "x": "質問書にも答えさせられた。"}, {"t": 1027.6666666666667, "x": "アメリカ人をどう思うか、という問いもあった。"}, {"t": 1030.2, "x": "鹿地が書いた答えの一つは、こうだ。"}, {"t": 1032.5166666666667, "x": "「米国に私の要求することは、\n私に自由を与えることである」"}, {"t": 1036.6333333333334, "x": "はっきり書いたわね。"}, {"t": 1038.0, "x": "協力の話そのものには、国会でこう答えている。"}, {"t": 1041.25, "x": "「アメリカの極東政策には、日本国民として\n賛成できない、だから協力の基礎がない」"}, {"t": 1046.6666666666667, "x": "この「横書きの感想」は、あとで国会で問題になる。"}, {"t": 1050.3666666666666, "x": "覚えておいてほしい。"}, {"t": 1052.1333333333334, "x": "ここで外の世界の日付を一つ入れておく。"}, {"t": 1054.8, "x": "1952年4月28日。"}, {"t": 1057.4333333333334, "x": "サンフランシスコ平和条約が効力を持った日だ。"}, {"t": 1060.5, "x": "占領が終わった日ね。"}, {"t": 1062.0333333333333, "x": "そうだ。この日から、日本はまた独立した国になった。"}, {"t": 1065.6, "x": "鹿地はこの日のことを、ラジオで\n聞いてすぐ知ったと証言している。"}, {"t": 1069.2666666666667, "x": "茅ヶ崎の二階でな。"}, {"t": 1070.7833333333333, "x": "自分が閉じ込められたまま、\n独立の知らせを聞いたのね。"}, {"t": 1074.3, "x": "抗議はいつもしていた、とも言っている。"}, {"t": 1076.5333333333333, "x": "この日付があとで国会の議論の分かれ目になる。"}, {"t": 1079.4, "x": "占領中なら米軍は日本人を逮捕する権限を持っていた。"}, {"t": 1082.9833333333333, "x": "政府もそう答弁している。"}, {"t": 1084.6, "x": "でも4月28日を過ぎたら、話が変わる。"}, {"t": 1087.8333333333333, "x": "独立した国の中で、外国の機関が日本人を\n閉じ込めていいのか、ってことね。"}, {"t": 1092.9666666666667, "x": "そういうことだ。"}, {"t": 1093.9666666666667, "x": "数えると、4月28日から帰宅した\n12月7日までは223日ある。"}, {"t": 1099.2833333333333, "x": "378日のうち、223日が独立したあとだった。"}, {"t": 1103.8333333333333, "x": "半分以上じゃない。"}, {"t": 1105.1333333333334, "x": "半分以上だ。この数字を、国会の議員たちは\n何度も持ち出すことになる。"}, {"t": 1110.2666666666667, "x": "6月10日。山田は茅ヶ崎の仕事をやめた。"}, {"t": 1113.4166666666667, "x": "やめちゃったの？"}, {"t": 1114.4833333333333, "x": "給料は約束より安く、暴力や\n侮辱もあったと証言している。"}, {"t": 1118.4666666666667, "x": "茅ヶ崎の給料は1万3000円くらい。"}, {"t": 1120.9666666666667, "x": "それとラッキーストライクを4本だったそうだ。"}, {"t": 1123.5666666666666, "x": "やめる日に鹿地からあのノートを預かって出た。"}, {"t": 1126.1, "x": "7月の終わり、鹿地は4か所目へ移された。"}, {"t": 1128.8333333333333, "x": "東京の代官山だ。"}, {"t": 1130.3166666666666, "x": "小学校の前の家で、学校の放送が\n聞こえたので場所が分かったという。"}, {"t": 1134.7, "x": "放送で分かるのね。"}, {"t": 1136.1, "x": "建物の二階に、八畳の部屋が\n二つと六畳の部屋が二つあった。"}, {"t": 1140.3666666666666, "x": "夜は窓のない物置のような部屋に入れられた。"}, {"t": 1143.0333333333333, "x": "入口は3尺ばかりで、金網張りのドアに\n錠がかかったそうだ。"}, {"t": 1146.85, "x": "二階の八畳には、ピストルを持った\n見張りが二人いたと証言している。"}, {"t": 1151.0666666666666, "x": "ピストル……。"}, {"t": 1151.9333333333334, "x": "見張りが一人下りるときは、\n呼び鈴でもう一人を呼んだ。"}, {"t": 1155.1666666666667, "x": "目は必ず離さなかった。"}, {"t": 1156.8833333333334, "x": "ここには日本人は一人もいなかった。"}, {"t": 1159.2, "x": "二世の兵隊だけだったという。"}, {"t": 1161.0666666666666, "x": "のちに警視総監が、この家を調べている。"}, {"t": 1163.7333333333333, "x": "渋谷区猿楽町の個人の家で、米軍が接収していた。"}, {"t": 1167.3333333333333, "x": "家主の話す間取りと、鹿地の言う\n間取りは、ほぼ一致したと総監は述べた。"}, {"t": 1171.9666666666667, "x": "そこは裏が取れたのね。"}, {"t": 1173.5666666666666, "x": "間取りまではな。"}, {"t": 1174.5666666666666, "x": "鹿地はこの家で、階段から下を\n最後まで見なかったそうだ。"}, {"t": 1178.1, "x": "夏には大佐が浴衣を持ってきた。"}, {"t": 1180.2333333333333, "x": "散髪は見張りの軍曹がしてくれた。"}, {"t": 1182.5333333333333, "x": "お金は一銭ももらっていない、とも証言している。"}, {"t": 1186.1333333333334, "x": "秋になって外が動き始める。"}, {"t": 1188.1166666666666, "x": "9月ごろ鹿地の失踪を伝える怪しい文書が出回った。"}, {"t": 1191.4, "x": "英文のものもあったという。"}, {"t": 1192.9833333333333, "x": "新聞社や雑誌社から、妻のところへ\n問い合わせが来るようになった。"}, {"t": 1196.9833333333333, "x": "表に出始めたのね。"}, {"t": 1198.6, "x": "妻は藤沢の警察に、手紙で捜索願を出した。"}, {"t": 1202.05, "x": "日付は国警の長官が11月12日、妻は\n11月8日と証言していて、少しずれる。"}, {"t": 1208.1666666666667, "x": "警察にはアメリカのことは言ったの？"}, {"t": 1210.4166666666667, "x": "言わなかった。"}, {"t": 1211.3333333333333, "x": "黙っていたわけを、妻は国会で明かした。"}, {"t": 1213.9833333333333, "x": "「アメリカの兵隊に日本人がなぐられておるところに\n巡査がちゃんと立っていても、"}, {"t": 1218.2166666666667, "x": "何もそれをとめることができない」"}, {"t": 1220.35, "x": "……当時はそうだったのね。"}, {"t": 1221.9, "x": "もう一つの理由は、山田に\n危害が行くのが怖かったからだ。"}, {"t": 1225.55, "x": "そのころ週刊朝日に失踪の記事が出た。"}, {"t": 1228.1833333333334, "x": "伊豆の山田という人物が\n連絡した、とほぼ分かる形で。"}, {"t": 1231.7833333333333, "x": "山田は当時横須賀の米海軍基地で働いていた。"}, {"t": 1234.9333333333334, "x": "記事を見てすぐ仕事をやめた。"}, {"t": 1236.85, "x": "自分が狙われると思ったのね。"}, {"t": 1238.9, "x": "本人の言葉はこうだ。"}, {"t": 1240.4, "x": "「私自身も鹿地さんと同様な、\nやみに葬られんという危険を感じた」"}, {"t": 1244.6666666666667, "x": "山田は弁護士に相談し、そこから\n一人の国会議員につながった。"}, {"t": 1248.85, "x": "社会党の猪俣浩三 議員だ。"}, {"t": 1251.05, "x": "11月24日、議員会館の部屋を訪ねてきたという。"}, {"t": 1254.7666666666667, "x": "猪俣は山田に道順を口で言わせて、\n別の人に実際に歩かせて確かめた。"}, {"t": 1259.7333333333333, "x": "裏付けにほとんど2週間かかったと国会で述べている。"}, {"t": 1263.0833333333333, "x": "議員が自分で歩かせたのね。"}, {"t": 1265.0166666666667, "x": "そしてあることが起きる。"}, {"t": 1266.45, "x": "11月29日の土曜日だ。"}, {"t": 1269.2, "x": "その日見張りの軍曹がトランクを\n一つ買ってきたという。"}, {"t": 1272.4333333333334, "x": "荷物を詰めろと言われた。"}, {"t": 1274.1, "x": "どこかへ行くの？"}, {"t": 1275.2333333333333, "x": "午後4時ごろ、大佐が来て\n「日本ではない所に行く」と言ったそうだ。"}, {"t": 1279.45, "x": "11月に入ってから、新聞も\nラジオも見せてもらえなくなっていた。"}, {"t": 1283.55, "x": "見張りの軍曹は「東京ではおれたちが\nあぶなくなった」と言っていたという。"}, {"t": 1287.7, "x": "午後6時過ぎ、目隠しをされて車に乗せられた。"}, {"t": 1290.7666666666667, "x": "着いたのは羽田飛行場だ。"}, {"t": 1292.65, "x": "飛行機？"}, {"t": 1293.4833333333333, "x": "軍用機だ。乗せられたのは、\n鹿地と付き添いの軍曹二人だけ。"}, {"t": 1297.4166666666667, "x": "飛行機の中で、目隠しを外された。"}, {"t": 1299.9, "x": "そのときのことを、こう話している。"}, {"t": 1302.0666666666666, "x": "「私は帰れないのだ、それで\n実は私もう死を決心しておった」"}, {"t": 1306.05, "x": "……どこへ連れて行かれたの？"}, {"t": 1307.6166666666666, "x": "本人の証言では、沖縄だ。"}, {"t": 1309.7166666666667, "x": "着いてから軍曹が「沖縄に来ましたよ」と\n口をすべらせたという。"}, {"t": 1313.7666666666667, "x": "那覇から車で1時間半以上の、\n山の中だったと本人は推測している。"}, {"t": 1318.4666666666667, "x": "建物はバラックで、廊下の両側に\n六畳ほどの部屋が並んでいた。"}, {"t": 1322.5166666666667, "x": "窓は鉄の枠に金網だ。"}, {"t": 1324.2666666666667, "x": "「鉄仮面というような物語に出て来るものを\n想像して」と本人は言っている。"}, {"t": 1328.9, "x": "一生出られない人の話ね。"}, {"t": 1330.95, "x": "そう思ったそうだ。"}, {"t": 1332.1166666666666, "x": "食事が自分一人だけに、少しいい中身で\n運ばれてくるのも怖かったという。"}, {"t": 1336.7, "x": "時が迫っている、と感じたからだ。"}, {"t": 1338.9, "x": "沖縄に行った件は、米側も否定していない。"}, {"t": 1341.7166666666667, "x": "のちの回答で、居場所を\n変えたことはあり得る、と書いている。"}, {"t": 1345.1, "x": "外務省の政務次官も、1953年3月に国会で\n「米軍があちらへ連れて参った」と答弁した。"}, {"t": 1352.0, "x": "そしてこのトランクを、鹿地は国会に持ってきている。"}, {"t": 1355.2166666666667, "x": "持ってきたの？"}, {"t": 1356.2833333333333, "x": "「このトランクは私は証拠品として\n持って来てあります」。"}, {"t": 1359.5166666666667, "x": "12月23日の証言だ。"}, {"t": 1362.3166666666666, "x": "沖縄に着いて1週間ほどたった12月6日の昼。"}, {"t": 1365.6333333333334, "x": "様子が変わった。"}, {"t": 1366.7666666666667, "x": "東京から何かあわただしい\n電報が来たらしい、と本人は感じた。"}, {"t": 1370.8166666666666, "x": "何があったの？"}, {"t": 1371.9333333333334, "x": "ちょうどその日、全国の新聞にこの件が載っている。"}, {"t": 1375.15, "x": "猪俣議員がそう国会で述べた。"}, {"t": 1377.2166666666667, "x": "山田の手記も、6日の夕刊と7日の朝刊に出た。"}, {"t": 1380.6166666666666, "x": "国警の長官が国会でそう答弁している。"}, {"t": 1383.3, "x": "見張りの軍曹たちは、こう言ったという。"}, {"t": 1385.6166666666666, "x": "「外で騒ぎが大きくなったから、一時うちどめだ」"}, {"t": 1388.65, "x": "その夜の12時に車で出て、2時に飛行場へ。"}, {"t": 1391.7333333333333, "x": "夜の飛行で約4時間かかった。"}, {"t": 1393.8333333333333, "x": "帰りは爆撃機のB17だったと証言している。"}, {"t": 1396.9, "x": "富士山と伊豆の島々を越え、江の島を\n越えて、立川に着いたのが午前6時だ。"}, {"t": 1401.9, "x": "一気に戻されたのね。"}, {"t": 1403.4833333333333, "x": "代官山で午前中を休まされて、紙を二枚見せられた。"}, {"t": 1407.0333333333333, "x": "誓約書の2箇条だ。"}, {"t": 1408.5, "x": "ソ連のスパイとして捕まったと認めること。"}, {"t": 1411.1833333333334, "x": "米国政府に賠償を求めないこと。"}, {"t": 1413.5833333333333, "x": "それに署名したの？"}, {"t": 1415.0, "x": "署名した。署名しなければ出さないぞ、という\n空気だったと証言している。"}, {"t": 1419.3666666666666, "x": "そして12月7日の夕方。"}, {"t": 1421.3666666666666, "x": "暗くなってから、ジープに乗せられた。"}, {"t": 1423.7166666666667, "x": "降ろされたのは、神宮外苑の\nあたりの道の真ん中だった。"}, {"t": 1427.2, "x": "渡されたのは、車代の1200円だ。"}, {"t": 1429.9833333333333, "x": "1200円……。"}, {"t": 1431.0333333333333, "x": "鹿地はタクシーを拾った。"}, {"t": 1432.6, "x": "行き先は新宿区の上落合だ。"}, {"t": 1434.7333333333333, "x": "家族が引っ越していた先で、本人はまだ\n一度も行ったことがない住所だった。"}, {"t": 1439.3166666666666, "x": "探して探して、たどり着いた。"}, {"t": 1441.4, "x": "夜の10時ごろだったと家族は警察に話している。"}, {"t": 1444.6166666666666, "x": "378日ぶりに、知らない家に帰ったのね。"}, {"t": 1448.15, "x": "そうだ。そして明け方前に、\n近所の医者の家に身を隠した。"}, {"t": 1451.9166666666667, "x": "その医者の家で、翌朝\n「私は訴える」という声明を書いている。"}, {"t": 1456.75, "x": "12月8日、月曜日。"}, {"t": 1458.5666666666666, "x": "衆議院の法務委員会で、この件が取り上げられた。"}, {"t": 1461.65, "x": "最初に答えたのは犬養健 法務大臣だ。"}, {"t": 1464.7, "x": "失踪は昨年の11月25日、捜索願は今年の11月。"}, {"t": 1469.3166666666666, "x": "その間約1年たっている、と。"}, {"t": 1471.5166666666667, "x": "大臣もほとんど何も知らない感じね。"}, {"t": 1474.05, "x": "そうだ。猪俣議員が、山田から\n聞いた話と声明書を読み上げた。"}, {"t": 1478.25, "x": "声明書にはこういう一節がある。"}, {"t": 1480.1666666666667, "x": "「米軍のスパイになるか、それともだれにも\n知られない暗々裡の死を選ぶかを迫られた」"}, {"t": 1484.9666666666667, "x": "岡崎勝男 外務大臣は、こう答えた。"}, {"t": 1487.7833333333333, "x": "「抑留したなんという\n事実がないと私は信じております」"}, {"t": 1491.3, "x": "信じてる、なのね。"}, {"t": 1492.8166666666666, "x": "そのうえで外国の官憲が日本国民を捕まえることは\n「とうていあり得べからざること」だと言った。"}, {"t": 1498.6333333333334, "x": "12月10日には、参議院の本会議でも取り上げられた。"}, {"t": 1502.1333333333334, "x": "総理の代わりに答えた\n緒方竹虎 官房長官は、こう述べた。"}, {"t": 1506.1666666666667, "x": "「真相を調査した上でなければ\n今のところ何とも申上げかねます」"}, {"t": 1510.0833333333333, "x": "議場からは「何だ何だその答弁は」という\nやじが飛んだと、会議録に残っている。"}, {"t": 1515.2, "x": "会議録ってやじまで書いてあるのね。"}, {"t": 1517.4166666666667, "x": "書いてある。同じ日、衆議院の法務委員会で、\n鹿地本人が証人になった。"}, {"t": 1522.1333333333334, "x": "証人は4人。鹿地、山田、\n内山完造、そして岩崎邸の老人だ。"}, {"t": 1526.8666666666666, "x": "医者の診断で、鹿地は20分以上この雰囲気に置くと\n体に悪い、と言われていた。"}, {"t": 1531.8, "x": "外套を着たままでいいか、と猪俣議員が\n委員会に断りを入れている。"}, {"t": 1535.8333333333333, "x": "それが連れ去られたときの着の身着のままの姿だ、と。"}, {"t": 1539.2166666666667, "x": "同じ外套なのね。"}, {"t": 1540.65, "x": "同じ外套だ。20分の約束は、\n結局1時間近くになった。"}, {"t": 1545.05, "x": "帰ったあと鹿地は38度3分の熱を出して、\n2日間寝込んだと猪俣議員が報告している。"}, {"t": 1551.5, "x": "では米側は何と言ったのか。"}, {"t": 1553.2666666666667, "x": "ここで説明の移り変わりを並べる。"}, {"t": 1555.5666666666666, "x": "変わったの？"}, {"t": 1556.5333333333333, "x": "少しずつ変わった。"}, {"t": 1557.85, "x": "まず12月8日、在日米軍の発表だ。"}, {"t": 1560.8166666666666, "x": "1951年の暮れに、取り調べのため\n短い期間だけ拘禁した。"}, {"t": 1565.4666666666667, "x": "そのあとは関係ない、という内容だった。"}, {"t": 1567.9333333333334, "x": "外務省の局長は、軍は11月に逮捕し12月末に\n放した、という声明だったと紹介している。"}, {"t": 1574.4333333333334, "x": "短い期間、ね。"}, {"t": 1575.8333333333333, "x": "次に12月14日の日曜の晩、\n大使館から外務省への中間回答だ。"}, {"t": 1580.65, "x": "外務省の局長が12月23日に国会で紹介した。"}, {"t": 1584.55, "x": "「本人の意思に基いて保護した」"}, {"t": 1586.7333333333333, "x": "保護？"}, {"t": 1587.3833333333334, "x": "スパイ行為を自白したので、\n本人が命の危険を感じた。"}, {"t": 1591.0833333333333, "x": "病気も悪かった。"}, {"t": 1592.3166666666666, "x": "だから当分保護してほしいという\n申し出があった、という説明だ。"}, {"t": 1596.05, "x": "局長自身が「鹿地氏が言っておらるることと\n全然反対」だと述べている。"}, {"t": 1600.4833333333333, "x": "同じ日、鹿地は国会でこう答えた。"}, {"t": 1602.8333333333333, "x": "「私が保護を頼んだのだという\nばかばかしい言い方です」"}, {"t": 1605.9166666666667, "x": "「頼まれてやったんでしたら、私はここに来て\n皆さんにこういうことは申し上げません」"}, {"t": 1610.8166666666666, "x": "真っ向からぶつかってるわね。"}, {"t": 1612.6666666666667, "x": "3つ目は1953年1月25日付の大使館の回答だ。"}, {"t": 1617.25, "x": "外から鍵がかかっていたことについて、\nこう書いてあった。"}, {"t": 1620.6333333333334, "x": "「身の安全を守るという\nその人の願望にまったく一致するもの」"}, {"t": 1624.4333333333334, "x": "外から鍵をかけたのが、本人の希望？"}, {"t": 1627.1833333333334, "x": "委員の一人は「非常識きわまる」と言った。"}, {"t": 1630.0166666666667, "x": "与党の委員も\n「実にこれはばかげきった答弁」と言っている。"}, {"t": 1633.6, "x": "ただこの回答は1952年3月より\n前のことには何も触れていなかった。"}, {"t": 1638.5333333333333, "x": "4つ目は1953年2月24日付だ。"}, {"t": 1641.95, "x": "新しい事実はなく、同じ説明の繰り返しだった。"}, {"t": 1645.8833333333334, "x": "ここから話がもう一本の線とからみ始める。"}, {"t": 1648.7666666666667, "x": "12月9日の夕方。"}, {"t": 1650.5666666666666, "x": "一人の無線技師の男性が、\n国警の東京都本部に自首してきた。"}, {"t": 1654.8833333333334, "x": "自首？　何の？"}, {"t": 1656.1166666666666, "x": "許可のない無線局を動かした、電波法違反の疑いだ。"}, {"t": 1659.65, "x": "国警の長官によると、この人は\nソ連に抑留されていたときに無線を\n教わり、海外へ無線を打っていた。"}, {"t": 1665.95, "x": "翌10日に逮捕状が執行された。"}, {"t": 1668.1666666666667, "x": "この人の名前は、この動画では出さない。"}, {"t": 1670.8, "x": "どうして？"}, {"t": 1671.65, "x": "存命かどうかを、一次の記録で\n確かめられなかったからだ。"}, {"t": 1675.25, "x": "この人は鹿地と路上で連絡を取っていたと話した。"}, {"t": 1678.35, "x": "鹿地が捕まった夜も、その場にいたと。"}, {"t": 1680.95, "x": "……鹿地さんの手記の筋書と同じ話じゃない。"}, {"t": 1683.7833333333333, "x": "そうなる。そして同じ12月10日の夕方、\n国警の長官は米側から鹿地の手記を受け取っていた。"}, {"t": 1689.8833333333334, "x": "自首が9日の夕方。"}, {"t": 1691.55, "x": "手記が届いたのが10日の夕方だ。"}, {"t": 1693.7666666666667, "x": "ある委員は時間の経過からいって\n「まことにスピーディ」だと言った。"}, {"t": 1697.6833333333334, "x": "皮肉ね。"}, {"t": 1698.5833333333333, "x": "長官は警察は48時間しか留め置けないから\n急いで問い合わせた、と答えている。"}, {"t": 1703.7166666666667, "x": "1953年8月になって、長官はもう一つ認めた。"}, {"t": 1707.9333333333334, "x": "自首の日の昼ごろ、米側から連絡があった。"}, {"t": 1710.8, "x": "この人が身の危険を感じているので\n保護してやってほしい、と。"}, {"t": 1714.35, "x": "自首したほうがいい、と答えたのは\n自分だ、と長官は述べた。"}, {"t": 1718.1333333333334, "x": "自首を勧めたのが、長官本人なのね。"}, {"t": 1720.9333333333334, "x": "そうだ。長官はキャノン中佐とも、パーティーなどで\n何度も会っていたと答弁している。"}, {"t": 1725.7333333333333, "x": "ただし国警が米側の機関と\n一緒に何かをしていたことは、\n自分の知る限りない、とも言った。"}, {"t": 1731.4166666666667, "x": "鹿地はこの件を、こう言っている。"}, {"t": 1733.3333333333333, "x": "「私が外に出て事実を暴露した\nところが、電波法違反事件なるものが\nあとからくっついて出て来た」"}, {"t": 1739.8333333333333, "x": "この件で物の証拠とされたものが一つある。はがきだ。"}, {"t": 1743.2666666666667, "x": "鹿地から無線技師にあてた、\n偽名のはがきとされるものだった。"}, {"t": 1747.0, "x": "本物なら決め手じゃない。"}, {"t": 1748.6666666666667, "x": "そう扱われていた。"}, {"t": 1749.9666666666667, "x": "ところが1953年2月、そのはがきが\n無くなったと新聞に出た。"}, {"t": 1754.6333333333334, "x": "国警の長官が、国会で経過を説明している。"}, {"t": 1757.7666666666667, "x": "立件して検察に送ったあと、担当の捜査官が\n確認に使い、家に持ち帰っていた。"}, {"t": 1763.25, "x": "すべりやすい封筒に入れていて、鞄を\n開けたときに落ちたのではないか、と。"}, {"t": 1767.65, "x": "……落としたの？"}, {"t": 1768.6, "x": "無くしたのは1月17日の夕方ごろと推定されている。"}, {"t": 1772.25, "x": "ただ無くす前に写真は撮ってあった。"}, {"t": 1774.4333333333334, "x": "筆跡の鑑定もしていたという。"}, {"t": 1776.4333333333334, "x": "半年後の8月にも、長官は「かの原本は今日に\n至るまで出て参りません」と答えている。"}, {"t": 1782.0833333333333, "x": "このはがきには、変なところが一つあった。"}, {"t": 1784.95, "x": "変なところ？"}, {"t": 1786.0166666666667, "x": "宛名の名字の一文字目が、別の字になっていたんだ。"}, {"t": 1789.3333333333333, "x": "名刺には正しく書いてあったのに、はがきでは\n「光」の字になっていた、と議員が指摘した。"}, {"t": 1795.1333333333334, "x": "本人が書いたなら、名前を間違えるかしら。"}, {"t": 1798.0, "x": "そこも分からない。"}, {"t": 1799.1333333333334, "x": "無線技師の側は、本人が名刺はすぐ\n焼いたと言っていた、と説明した。"}, {"t": 1803.5166666666667, "x": "原本はもう無い。"}, {"t": 1804.6333333333334, "x": "残ったのは写真と、議員たちの疑いだけだ。"}, {"t": 1808.1833333333334, "x": "1953年8月4日。"}, {"t": 1810.5833333333333, "x": "衆議院の法務委員会に、二人が同時に呼ばれた。"}, {"t": 1813.65, "x": "鹿地と無線技師の男性だ。"}, {"t": 1815.4166666666667, "x": "顔を合わせて確かめる、対質という形だった。"}, {"t": 1818.6, "x": "同じ部屋で？"}, {"t": 1819.65, "x": "同じ部屋でだ。"}, {"t": 1820.6833333333334, "x": "偽証は3か月以上10年以下の懲役だ、と\n委員長が告げてから宣誓した。"}, {"t": 1825.35, "x": "無線技師は鹿地と全部で8回会ったと証言した。"}, {"t": 1828.4, "x": "最初は1951年8月30日の夕方6時。"}, {"t": 1832.3, "x": "江ノ電の柳小路で降りて、線路沿いだったと。"}, {"t": 1835.1833333333334, "x": "合言葉は本鵠沼へ行くには\nどう行きますか、だったという。"}, {"t": 1838.75, "x": "細かいわね。"}, {"t": 1839.8, "x": "暗号の電報は、薬の空きびんや、\nたばこの中に入れて渡された。"}, {"t": 1843.85, "x": "笛の入った布の人形の中に\n入っていたこともある、と証言した。"}, {"t": 1848.0, "x": "「おなかに笛があって、押すと\nピーピー鳴るきれのお人形であります」"}, {"t": 1851.6166666666666, "x": "お金は月に1万5000円ずつ受け取っていたという。"}, {"t": 1854.7333333333333, "x": "鹿地さんは何て？"}, {"t": 1856.0, "x": "「会っておりません」。"}, {"t": 1856.9833333333333, "x": "見たこともない、とな。"}, {"t": 1858.45, "x": "無線技師はこう迫った。"}, {"t": 1860.0, "x": "「私はこの目ではっきりあなたを見ております」"}, {"t": 1862.55, "x": "鹿地はこう返した。"}, {"t": 1863.8, "x": "「私はこの人物と別に問答をする\n必要はないと思います」"}, {"t": 1867.6333333333334, "x": "完全に平行線ね。"}, {"t": 1869.25, "x": "議員たちは細かいところを突いた。"}, {"t": 1871.25, "x": "8月30日の天気は、ある記録では朝から\n大雨で、別の記録では午後3時にやんでいた。"}, {"t": 1877.1166666666666, "x": "11月の祝日の曜日が、法廷での証言とずれていた。"}, {"t": 1880.8333333333333, "x": "捕まった夜の車について、無線技師は男4人に\n女1人と言い、鹿地は女はいなかったと言った。"}, {"t": 1886.9833333333333, "x": "どっちも引かないのね。"}, {"t": 1888.5166666666667, "x": "引かない。無線技師自身は、鹿地とのやりとりは\nずっと米側に報告していた、とも証言している。"}, {"t": 1894.3666666666666, "x": "鹿地は途中で、こう言って休憩を頼んでいる。"}, {"t": 1897.0666666666666, "x": "「さっきから掛けておりまして\n息が切れて参りましたから」"}, {"t": 1900.2333333333333, "x": "委員会はどちらの証言が\n正しいかを、この日も決めなかった。"}, {"t": 1904.5, "x": "3日後の1953年8月7日。"}, {"t": 1907.45, "x": "法務委員会は、結論を出した。"}, {"t": 1909.5666666666666, "x": "最初の証人尋問から8か月。"}, {"t": 1911.85, "x": "日本側の証人の証言と、\n米大使館の覚書3通をもとにした結論だ。"}, {"t": 1916.8666666666666, "x": "米側の人は呼べなかったの？"}, {"t": 1918.8333333333333, "x": "結論文に「法律上並びに事実上不可能」と\n書いてある。"}, {"t": 1922.6833333333334, "x": "結論は、二つに分かれていた。"}, {"t": 1924.8166666666666, "x": "一つ目。講和の前の逮捕と拘束は、\nスパイ容疑の取り調べに必要な限り、\n不法な逮捕、監禁とはいえない。"}, {"t": 1931.9666666666667, "x": "占領中は仕方ない、ってこと？"}, {"t": 1934.1333333333334, "x": "そういう判断だ。"}, {"t": 1935.3, "x": "二つ目が講和のあとだ。"}, {"t": 1936.8666666666666, "x": "外から鍵がかかっていたこと。"}, {"t": 1938.8166666666666, "x": "ピストルを持った見張りがいたこと。"}, {"t": 1940.8, "x": "夜に軍用機で沖縄へ連れて行ったこと。"}, {"t": 1943.2666666666667, "x": "この三つを挙げて、こう結んだ。"}, {"t": 1945.2833333333333, "x": "「不法監禁の疑いがあるものと\nいわなければならない」"}, {"t": 1948.4166666666667, "x": "疑い、なのね。"}, {"t": 1949.75, "x": "疑いだ。米側の言う純粋な人道的保護だったとは、\nにわかに肯定できない、とも書いた。"}, {"t": 1955.4, "x": "ある政党は「明らかに不法監禁」に直す\n修正案を出したが、少数で否決された。"}, {"t": 1960.8166666666666, "x": "賛成した猪俣議員は、こう言っている。"}, {"t": 1963.2666666666667, "x": "「不法監禁の疑いがあるということで\n涙をのんだのであります」"}, {"t": 1967.0, "x": "言い切りたかったのね。"}, {"t": 1968.4333333333334, "x": "結論は外務大臣、法務大臣、国警の長官へ送られた。"}, {"t": 1972.3166666666666, "x": "その日、犬養健 法務大臣は\n感想を一言だけ残している。"}, {"t": 1976.6333333333334, "x": "「外国だったらもっと人権問題の方が\n表に出たと思います」"}, {"t": 1981.1333333333334, "x": "では鹿地自身はどうなったのか。"}, {"t": 1983.0, "x": "1953年5月、国警は鹿地に逮捕状を請求していた。"}, {"t": 1987.3, "x": "無線技師との共同正犯の疑いだ。"}, {"t": 1989.8, "x": "被害を訴えた側が、逆に疑われたのね。"}, {"t": 1992.7666666666667, "x": "そういう形になった。"}, {"t": 1994.2333333333333, "x": "8月の時点では、長官は「何も逮捕する必要はない」\n「調べる必要がある」と答弁している。"}, {"t": 2000.45, "x": "その後鹿地は電波法違反で起訴された。"}, {"t": 2002.85, "x": "一審は東京地方裁判所だった。"}, {"t": 2005.0666666666666, "x": "猪俣議員がのちの国会でそう触れている。"}, {"t": 2007.5833333333333, "x": "裁判は長く続いた。"}, {"t": 2009.1166666666666, "x": "1969年6月27日、衆議院の法務委員会で、\n猪俣議員がこう述べている。"}, {"t": 2015.1666666666667, "x": "「昨日鹿地亘なる人物が無罪の判決を高裁で受けた」"}, {"t": 2018.8333333333333, "x": "高裁で無罪。"}, {"t": 2019.9666666666667, "x": "事件から17年半後だ。"}, {"t": 2021.8333333333333, "x": "猪俣議員は判決を見れば\nスパイをしたという事実はない、と述べた。"}, {"t": 2025.8166666666666, "x": "ただこれは議員の受け止め方だ。"}, {"t": 2027.7666666666667, "x": "判決の言葉そのものではない。"}, {"t": 2029.7666666666667, "x": "無罪はそのまま確定した、と事典には書かれている。"}, {"t": 2033.1, "x": "じゃあスパイだったかどうかは？"}, {"t": 2034.8333333333333, "x": "裁判で言えるのは、電波法違反の罪には\n当たらない、というところまでだ。"}, {"t": 2039.0833333333333, "x": "あの378日が保護だったのか、監禁だったのか。"}, {"t": 2042.8666666666666, "x": "国会の結論は「疑いがある」で止まっている。"}, {"t": 2045.9, "x": "米側の機関で、誰がどこまで決めていたのか。"}, {"t": 2048.8166666666666, "x": "これも公の記録では分からないままだ。"}, {"t": 2051.8333333333335, "x": "最後にこの事件で国会に持ち込まれた\n物を、一つずつ机に戻しておく。"}, {"t": 2056.6, "x": "物で終わるのね。"}, {"t": 2057.8333333333335, "x": "一つ目は霜降りの外套。"}, {"t": 2059.5833333333335, "x": "散歩に着て出て、証言の日もそのまま着ていた。"}, {"t": 2062.616666666667, "x": "二つ目は懐中時計。"}, {"t": 2064.15, "x": "遺書のそばに置いてあった。"}, {"t": 2065.65, "x": "子どもへの形見のつもりだった。"}, {"t": 2067.5666666666666, "x": "三つ目はたばこの銀紙と1冊のノート。"}, {"t": 2070.1, "x": "コックの青年が外へ運んだ。"}, {"t": 2072.0666666666666, "x": "四つ目は黄色い状袋と58ページの手記。"}, {"t": 2074.983333333333, "x": "書かされたのか、書いたのか。"}, {"t": 2076.85, "x": "五つ目は羽田で積まれたトランク。"}, {"t": 2078.95, "x": "本人が証拠品として国会に持ってきた。"}, {"t": 2081.6666666666665, "x": "六つ目は車代の1200円。"}, {"t": 2083.733333333333, "x": "神宮外苑の道の真ん中で渡された。"}, {"t": 2086.233333333333, "x": "七つ目は名字の一文字目が違うはがき。"}, {"t": 2088.8166666666666, "x": "原本は警察が無くした。"}, {"t": 2090.7166666666667, "x": "七つ並ぶといろいろ見えてくるわね。"}, {"t": 2092.95, "x": "見えてくる。でも、七つ並べても埋まらない欄がある。"}, {"t": 2096.15, "x": "あの1年の部屋の鍵を、内側から見たのか\n外側から見たのか、だ。"}, {"t": 2100.483333333333, "x": "本人は外からかけられたと言った。"}, {"t": 2102.65, "x": "米側は本人が望んだと言った。"}, {"t": 2104.7166666666667, "x": "委員会は外からかかっていたことは認めた。"}, {"t": 2107.366666666667, "x": "でもそれ以上は言わなかった。"}, {"t": 2109.1666666666665, "x": "……鍵の向きだけが、決まらなかったのね。"}, {"t": 2111.7166666666667, "x": "そうだ。最初に連れて行かれたとされる\n岩崎邸は、いまは都立の庭園になっている。"}, {"t": 2116.616666666667, "x": "2001年に開園して、いまは\n誰でもあの洋館を見に行ける。"}, {"t": 2120.4, "x": "鹿地さんは目隠しで見られなかった建物ね。"}, {"t": 2123.2, "x": "そういうことになる。"}, {"t": 2124.366666666667, "x": "出どころはほとんどが\n国会会議録検索システムで、いま誰でも読める。"}, {"t": 2128.7, "x": "1952年12月8日の衆議院法務委員会から、\n1953年8月7日の結論まで。"}, {"t": 2135.516666666667, "x": "証人の声も大臣の答弁も、議場の\nやじも、そのまま残っている。"}, {"t": 2139.75, "x": "この動画で守ったことを、最後に置いておく。"}, {"t": 2142.4, "x": "保護か監禁かを決めなかった。"}, {"t": 2144.3333333333335, "x": "スパイだったかどうかも決めなかった。"}, {"t": 2146.483333333333, "x": "自首した無線技師の名前を出さなかった。"}, {"t": 2148.95, "x": "米側の説明も、本人の証言も、同じ重さで並べた。"}, {"t": 2152.9666666666667, "x": "じゃあ見た人に聞いてみたいわね。"}, {"t": 2154.9666666666667, "x": "何をだ。"}, {"t": 2155.8166666666666, "x": "もし自分が、20分の散歩の途中で消えたら。"}, {"t": 2158.8333333333335, "x": "家族に届く最初の手紙に、何て書かされると思う？"}, {"t": 2162.3, "x": "……重い問いだな。"}, {"t": 2163.2833333333333, "x": "思ったことがあれば、コメントで聞かせてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
