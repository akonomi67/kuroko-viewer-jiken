<script>
const D={"name": "149", "file": "149_編集用", "dur": 2025.01665625, "segs": [], "subs": [{"t": 0.0, "x": "1976年9月6日、北海道の函館空港。"}, {"t": 4.05, "x": "13時50分ごろ、1機の戦闘機が滑走路に降りた。"}, {"t": 7.633333333333334, "x": "ソ連の戦闘機ミグ25だ。"}, {"t": 9.666666666666666, "x": "ソ連の戦闘機が日本の空港に？"}, {"t": 11.983333333333333, "x": "そうだ。しかも函館空港には、管制官がいなかった。"}, {"t": 15.6, "x": "無線で話せる相手はだれもいない。"}, {"t": 17.75, "x": "じゃあどうやって降りたの？"}, {"t": 19.2, "x": "それは運輸省の答弁であとで確かめる。"}, {"t": 21.633333333333333, "x": "自衛隊のレーダーが見つけたのは、13時11分。"}, {"t": 24.766666666666666, "x": "降りるまでは39分だ。"}, {"t": 26.633333333333333, "x": "39分も、どこを飛んでいたの？"}, {"t": 29.016666666666666, "x": "途中でレーダーから消えていた。"}, {"t": 30.866666666666667, "x": "消えたのにどうして時刻が分かるの？"}, {"t": 33.05, "x": "答弁が、見えた時刻と消えた\n時刻を全部残しているからだ。"}, {"t": 36.733333333333334, "x": "千歳から上がった戦闘機2機も、見失っている。"}, {"t": 39.8, "x": "乗っていたのはソ連空軍のベレンコ中尉。"}, {"t": 42.18333333333333, "x": "アメリカへ亡命したいと申し出た。"}, {"t": 44.3, "x": "亡命のために戦闘機で来たのね。"}, {"t": 46.56666666666667, "x": "ところが国会ではここで答えが割れた。"}, {"t": 48.88333333333333, "x": "これは領空侵犯なのか。それとも亡命なのか。"}, {"t": 52.03333333333333, "x": "同じ出来事なのに答えが違うの？"}, {"t": 54.333333333333336, "x": "午前と午後で、政府の言い方が変わった日もある。"}, {"t": 57.25, "x": "今回は会議録の時刻と答弁で、ミグ25事件を追う。"}, {"t": 60.85, "x": "防衛庁長官は、分刻みの経過を委員会で読み上げた。"}, {"t": 64.36666666666666, "x": "13時22分30秒という、秒までの時刻もある。"}, {"t": 67.96666666666667, "x": "秒まで残っているのね。"}, {"t": 69.58333333333333, "x": "この事件で亡くなった人はいない。"}, {"t": 71.75, "x": "それでも国会で何日も取り上げられたのね。"}, {"t": 74.55, "x": "そうだ。だから時刻と国の判断を、順に並べていく。"}, {"t": 78.11666666666666, "x": "まずは13時11分、北海道の西の海の上からだ。"}, {"t": 82.26666666666667, "x": "経過の報告は、10月7日の衆議院の内閣委員会だ。"}, {"t": 86.06666666666666, "x": "報告したのは坂田道太防衛庁長官。"}, {"t": 88.68333333333334, "x": "13時11分、航空自衛隊のレーダーサイトが\n1機を見つけた。"}, {"t": 92.58333333333333, "x": "答弁の言葉では識別不明機だ。"}, {"t": 94.98333333333333, "x": "識別不明機って？"}, {"t": 96.48333333333333, "x": "どこの国の何という機か、分からない飛行機のことだ。"}, {"t": 99.78333333333333, "x": "場所は北海道の西およそ100マイル。"}, {"t": 102.1, "x": "その機影は東へ進んでいた。"}, {"t": 104.18333333333334, "x": "日本に向かってきたのね。"}, {"t": 105.9, "x": "長官は、4つのレーダーサイトに見張らせたと答えた。"}, {"t": 109.16666666666667, "x": "奥尻と大湊と当別と加茂の4か所だ。"}, {"t": 112.06666666666666, "x": "レーダーサイトってどういう所？"}, {"t": 113.95, "x": "空を見張る大きなレーダーを置いた基地だ。"}, {"t": 116.21666666666667, "x": "11月の答弁では、全国に28か所あると言っている。"}, {"t": 119.96666666666667, "x": "9つの基地には、すぐ飛べる戦闘機が控えていた。"}, {"t": 123.45, "x": "見張る目はちゃんとあったのね。"}, {"t": 125.23333333333333, "x": "あった。だからこの機も最初は見えていた。"}, {"t": 127.71666666666667, "x": "ただ見えても相手がだれかは分からない。"}, {"t": 129.86666666666667, "x": "このときはまだ日本の空の外だ。"}, {"t": 132.16666666666666, "x": "外にいるうちはどうするの？"}, {"t": 133.85, "x": "近づく機には戦闘機を上げて確かめに行く。"}, {"t": 136.55, "x": "それが緊急発進、いわゆるスクランブルだ。"}, {"t": 139.2, "x": "この日の発進は発見から9分後だった。"}, {"t": 142.53333333333333, "x": "13時20分、千歳基地からF4EJが2機上がった。"}, {"t": 146.33333333333334, "x": "F4EJってどんな飛行機？"}, {"t": 148.31666666666666, "x": "航空自衛隊の戦闘機だ。"}, {"t": 150.1, "x": "国会の質問では、ファントムとも呼ばれている。"}, {"t": 152.93333333333334, "x": "防衛局長は、通常は5分待機の2機がいると話した。"}, {"t": 156.61666666666667, "x": "5分待機？"}, {"t": 157.75, "x": "5分で飛び立てるように、待っている態勢のことだ。"}, {"t": 160.85, "x": "5分って、ずいぶん短いのね。"}, {"t": 163.05, "x": "それだけ、空の上の出来事は速いということだ。"}, {"t": 166.06666666666666, "x": "この日に上がったのも2機だった。"}, {"t": 167.98333333333332, "x": "局長はしくみについてもこう答えている。"}, {"t": 170.4, "x": "見慣れない機が日本へ向かえば、自動で上がる。"}, {"t": 173.16666666666666, "x": "だれかの許可を待たないのね。"}, {"t": 175.0, "x": "そうだ。いちいち大臣に報告が来る\n話ではないとも言った。"}, {"t": 178.63333333333333, "x": "パイロットは追いかけるのに手いっぱいだ。"}, {"t": 180.78333333333333, "x": "報告する余裕はなかなか無い、とも局長は話した。"}, {"t": 184.21666666666667, "x": "飛びながら報告するのは大変そう。"}, {"t": 186.53333333333333, "x": "千歳の2機は識別不明機に近づこうとした。"}, {"t": 189.5, "x": "ただその2分後、事態は1つ進む。"}, {"t": 192.16666666666666, "x": "2分後に何があったの？"}, {"t": 193.78333333333333, "x": "この機が日本の空に入った。"}, {"t": 196.35, "x": "奥尻のレーダーサイトは、この機に警告を出した。"}, {"t": 199.33333333333334, "x": "使ったのは国際周波数だ。"}, {"t": 201.43333333333334, "x": "国際周波数？"}, {"t": 202.73333333333332, "x": "どこの国の機でも聞けるように、\n決めてある無線の周波数だ。"}, {"t": 206.36666666666667, "x": "それでも機は高度を下げながら東へ進んだ。"}, {"t": 209.06666666666666, "x": "そして13時22分30秒。"}, {"t": 211.35, "x": "北海道の茂津多岬の沖の上空で、\n日本の領空に入った。"}, {"t": 215.28333333333333, "x": "長官は位置も読み上げている。"}, {"t": 217.03333333333333, "x": "北緯42度38分、東経139度45分だ。"}, {"t": 221.25, "x": "数字まで細かく残っているのね。"}, {"t": 223.45, "x": "これが会議録に残る領空侵犯の時刻だ。"}, {"t": 226.4, "x": "領空ってどこまでのこと？"}, {"t": 228.13333333333333, "x": "その国の陸と、決められた海の上に広がる空だ。"}, {"t": 231.36666666666667, "x": "外務省の条約局長は別の日にこう答えた。"}, {"t": 234.33333333333334, "x": "国は自分の領空に、完全で排他的な主権を持つ。"}, {"t": 237.8, "x": "奥尻は侵犯のあと、約10分にわたって警告を続けた。"}, {"t": 241.63333333333333, "x": "侵犯したことを知らせて、出ていくように伝えたんだ。"}, {"t": 244.93333333333334, "x": "10分も警告して、返事は無かったの？"}, {"t": 247.71666666666667, "x": "答弁に返事のことは出てこない。"}, {"t": 249.7, "x": "機は向きを南へ変えた。"}, {"t": 251.35, "x": "函館に近づく向きね。"}, {"t": 253.15, "x": "そうだ。ここから、レーダーが追う時間になる。"}, {"t": 256.48333333333335, "x": "F4EJの2機は機影を追っていた。"}, {"t": 258.6666666666667, "x": "13時25分、F4EJの機上レーダーがこの機をとらえた。"}, {"t": 262.65, "x": "機上レーダー？"}, {"t": 263.78333333333336, "x": "戦闘機そのものに積んであるレーダーだ。"}, {"t": 266.01666666666665, "x": "ところがとらえていたのは30秒間だけ。"}, {"t": 268.55, "x": "そのあと見失った。"}, {"t": 270.03333333333336, "x": "30秒って、ほんの少しね。"}, {"t": 272.23333333333335, "x": "国会ではこの30秒が何度も問われた。"}, {"t": 274.8333333333333, "x": "ある議員は、上から下を見るレーダーの弱さを挙げた。"}, {"t": 277.81666666666666, "x": "ファントムを選んだ時から分かっていた\n弱点ではないか、という質問だ。"}, {"t": 281.95, "x": "別の日には、ファントムは欠陥機だとまで言っている。"}, {"t": 285.1666666666667, "x": "防衛庁はどう答えたの？"}, {"t": 286.85, "x": "装備局長は、当時のF4に\n欠陥があったとは思っていないと答えた。"}, {"t": 291.2, "x": "ただ将来の進歩を考えると、もう\n一度検討する必要はあるとも言った。"}, {"t": 295.68333333333334, "x": "欠陥とは言わないけど考え直すのね。"}, {"t": 298.23333333333335, "x": "そうだ。言葉の選び方に立場が出ている。"}, {"t": 300.9, "x": "戦闘機がこの機をとらえたのは、この30秒だけだった。"}, {"t": 304.3833333333333, "x": "レーダーサイトでも機影は消えかけていた。"}, {"t": 307.25, "x": "13時26分ごろ、機は久遠郡の上空を通過した。"}, {"t": 310.8333333333333, "x": "高さは1万フィート。"}, {"t": 312.1166666666667, "x": "メートルにすると、約3000メートルだ。"}, {"t": 314.76666666666665, "x": "3000メートルって富士山より低いのね。"}, {"t": 317.3333333333333, "x": "そうだ。そこからさらに下へ降りていった。"}, {"t": 319.8333333333333, "x": "高度を下げて、各レーダーサイトの画面から消えた。"}, {"t": 322.9166666666667, "x": "消えた？"}, {"t": 324.05, "x": "映らなくなったんだ。"}, {"t": 325.3833333333333, "x": "13時35分、奥尻の東の海の上で、一瞬だけ映った。"}, {"t": 329.71666666666664, "x": "でもまた消えた。"}, {"t": 330.9166666666667, "x": "一瞬だけ見えてまた消えたのね。"}, {"t": 333.0, "x": "それからは、どのレーダーも捕まえられなかった。"}, {"t": 335.73333333333335, "x": "国会の質問では、着陸までに\n2度見失ったと整理されている。"}, {"t": 339.8833333333333, "x": "どれくらいの時間見えなかったの？"}, {"t": 341.93333333333334, "x": "13時26分ごろから13時50分ごろまで、およそ24分だ。"}, {"t": 346.6166666666667, "x": "24分も、空のどこかにいたのね。"}, {"t": 349.23333333333335, "x": "途中の一瞬を除けばずっと見えていない。"}, {"t": 351.65, "x": "そのあいだも、F4EJとレーダーサイトは追跡を試みた。"}, {"t": 355.46666666666664, "x": "見えないのに追い続けたのね。"}, {"t": 357.3, "x": "長官の報告では、追跡を試み続けたとだけある。"}, {"t": 360.78333333333336, "x": "ではなぜ見えなくなったのか。"}, {"t": 362.45, "x": "長官はその理由を3つ挙げている。"}, {"t": 365.1666666666667, "x": "1つ目はこの機が高度を下げたことだ。"}, {"t": 367.53333333333336, "x": "2つ目は天気が悪かったこと。"}, {"t": 369.56666666666666, "x": "3つ目は海面や陸のクラッターの影響だ。"}, {"t": 372.26666666666665, "x": "クラッターって何？"}, {"t": 373.56666666666666, "x": "レーダーに映ってしまう、海や\n地面のはね返りのことだ。"}, {"t": 376.8666666666667, "x": "低く飛ぶ機はこのはね返りにまぎれやすい。"}, {"t": 379.5, "x": "雑音の中に隠れる感じ？"}, {"t": 381.48333333333335, "x": "そう考えていい。"}, {"t": 382.55, "x": "長官は9月9日、別の委員会でこう話していた。"}, {"t": 386.03333333333336, "x": "低く速く入ってくる機を、完全に捕まえるのは難しい。"}, {"t": 389.6666666666667, "x": "日本だけでなく、各国の軍事当局を\n悩ませている問題だと。"}, {"t": 393.8, "x": "日本だけの弱さじゃないってこと？"}, {"t": 395.9, "x": "そういう説明だ。三木首相も、\n本会議で同じ趣旨を述べた。"}, {"t": 399.75, "x": "低空で入ってきた飛行機は、レーダーがつかまえない。"}, {"t": 402.8666666666667, "x": "アメリカでも同じで苦心していると。"}, {"t": 405.06666666666666, "x": "でも、それで納得した人ばかりじゃないわよね。"}, {"t": 408.1, "x": "そうだ。予算委員会では、野党の議員がこう問うた。"}, {"t": 411.3333333333333, "x": "レーダーもスクランブルも、\nなんにもならないのではないか。"}, {"t": 414.45, "x": "非常事態に一体これでどうなるのかと。"}, {"t": 416.9, "x": "どちらの言い分も会議録に残っているのね。"}, {"t": 419.6333333333333, "x": "残っている。だからこの回では、両方を並べて読む。"}, {"t": 423.51666666666665, "x": "機が向かった函館空港は、どんな空港だったのか。"}, {"t": 426.76666666666665, "x": "答えたのは運輸省の航空局次長だ。"}, {"t": 429.23333333333335, "x": "10月13日の衆議院の委員会だった。"}, {"t": 431.95, "x": "函館はローカルの空港で管制官がいない。"}, {"t": 434.6166666666667, "x": "飛行場の管制が行われていなかったという。"}, {"t": 437.4166666666667, "x": "管制官がいなくて大丈夫なの？"}, {"t": 439.6166666666667, "x": "ふだんの出入りは、札幌の管制部が面倒を見ていた。"}, {"t": 442.8333333333333, "x": "空港には管制通信官という職員がいた。"}, {"t": 445.71666666666664, "x": "管制官とは違う人？"}, {"t": 447.45, "x": "滑走路がいま空いているかを、\nパイロットに伝える係だ。"}, {"t": 450.75, "x": "ふつうの不時着なら、まず\nこの管制通信官と無線で話す。"}, {"t": 454.65, "x": "滑走路が空いていると確かめてから、降りてくる。"}, {"t": 457.6333333333333, "x": "でもこの日は？"}, {"t": 458.8, "x": "ソ連の軍用機で周波数も何も分からない。"}, {"t": 461.5, "x": "次長は話のしようがないと答えた。"}, {"t": 463.9, "x": "呼びかけることもできなかったのね。"}, {"t": 466.06666666666666, "x": "外国の軍用機には、こちらから手の打ちようがない。"}, {"t": 469.1666666666667, "x": "そこが非常に問題だと次長は述べた。"}, {"t": 471.5833333333333, "x": "2度3度とあることとは思えない、とも付け加えている。"}, {"t": 474.85, "x": "空港の近くをほかの飛行機も飛んでいたの？"}, {"t": 477.6, "x": "飛んでいた。ちょうどその少し\n前に、1機が飛び立っている。"}, {"t": 481.7, "x": "13時35分過ぎ、全日空の旅客機が\n1機、函館から離陸した。"}, {"t": 486.56666666666666, "x": "ミグが降りる15分ほど前のことだ。"}, {"t": 488.85, "x": "ぶつかっていたかもしれないの？"}, {"t": 490.75, "x": "答弁ではそこまでは言っていない。"}, {"t": 492.6, "x": "ただ次長は、パイロットの動きをこう見ていた。"}, {"t": 495.28333333333336, "x": "全日空機が離陸するのを、どこかで見ていたようだ。"}, {"t": 498.3666666666667, "x": "函館の市の上空を、2、3回低く飛んだ。"}, {"t": 501.46666666666664, "x": "滑走路の位置と向きを確かめた。"}, {"t": 503.53333333333336, "x": "ほかの機がいないことも確かめて、\n降りたのではないか、と。"}, {"t": 507.1333333333333, "x": "自分の目で確かめてから降りたってこと？"}, {"t": 509.68333333333334, "x": "次長はそう見ていた。ただし、\nあとからの判断だと断っている。"}, {"t": 513.6666666666666, "x": "確かなことではないのね。"}, {"t": 515.4, "x": "そうだ。だからここでも、見立てとして紹介する。"}, {"t": 518.4833333333333, "x": "国会の質問では、\nその時間帯の便の多さも指摘された。"}, {"t": 522.3166666666667, "x": "13時57分の前後に、4機が\n発着する時間だったという指摘だ。"}, {"t": 526.9833333333333, "x": "札幌行きと大阪からの便、それに東京行きの便だ。"}, {"t": 530.45, "x": "にぎやかな時間に、知らない戦闘機が来たのね。"}, {"t": 533.5333333333333, "x": "空港からはだれとも話せないままだった。"}, {"t": 535.9833333333333, "x": "その動きはまず自衛隊の部隊に届いた。"}, {"t": 539.1333333333333, "x": "13時49分、三沢の防空管制司令所に連絡が入った。"}, {"t": 543.5166666666667, "x": "三沢って青森の？"}, {"t": 544.9, "x": "そうだ。青森県の三沢だ。"}, {"t": 546.8333333333334, "x": "連絡は千歳の航空団からだった。"}, {"t": 549.1666666666666, "x": "函館の上空をジェット機が旋回中、という中身だ。"}, {"t": 552.4833333333333, "x": "司令所は、F4EJをすぐ函館の向きへ飛ばした。"}, {"t": 555.9, "x": "やっと見つかったのね。"}, {"t": 557.4166666666666, "x": "ただレーダーにはまだ映っていなかった。"}, {"t": 559.6, "x": "そして1分後の13時50分ごろ。"}, {"t": 562.0, "x": "ミグ25は函館空港に降りた。"}, {"t": 564.3166666666667, "x": "F4EJは間に合わなかったの？"}, {"t": 566.4166666666666, "x": "時刻の上では間に合いようがない。"}, {"t": 568.3166666666667, "x": "旋回中の連絡から着陸までは1分ほどだ。"}, {"t": 571.3333333333334, "x": "連絡を受けた時刻と降りた時刻が、ほぼ重なっている。"}, {"t": 574.8666666666667, "x": "あと少し早く分かっていたら、と思っちゃうわね。"}, {"t": 577.8666666666667, "x": "その思いは、局長の反省の答弁にもつながっていく。"}, {"t": 581.4, "x": "13時11分から数えると？"}, {"t": 583.5833333333334, "x": "13時50分まで、39分だ。"}, {"t": 586.2, "x": "ここで時刻を1つ整理しておく。"}, {"t": 588.2833333333333, "x": "13時50分ごろは、警察と運輸省が答えた着陸の時刻。"}, {"t": 592.4833333333333, "x": "防衛庁が着陸を確かめた時刻は、別に残っている。"}, {"t": 596.1833333333333, "x": "同じ着陸なのに時刻が2つあるの？"}, {"t": 598.7666666666667, "x": "そうだ。もう1つは、このあとに出てくる13時57分だ。"}, {"t": 603.3, "x": "降りるときミグは空港の標識を壊していた。"}, {"t": 605.9666666666667, "x": "法務省の刑事局長が、\n9月9日の委員会でそう答えている。"}, {"t": 610.1666666666666, "x": "標識って？"}, {"t": 611.3, "x": "答弁では空港の標識とだけある。"}, {"t": 613.4833333333333, "x": "別の日の答弁では、保安設備を壊したと言っている。"}, {"t": 616.8, "x": "飛行機の安全のための設備だ。"}, {"t": 618.8833333333333, "x": "疑われた罪の1つは、この壊した設備から来ている。"}, {"t": 622.5, "x": "急いで降りたから？"}, {"t": 623.7833333333333, "x": "本人は、燃料が足りなくなり、\nやむなく降りたと話した。"}, {"t": 627.4166666666666, "x": "これも刑事局長の答弁だ。"}, {"t": 629.3166666666667, "x": "ただ、それが本当かは機体を見て\n確かめる必要があった。"}, {"t": 632.95, "x": "そこで検察は、防衛庁の専門家に\n見分を手伝ってもらった。"}, {"t": 637.1166666666667, "x": "降りる予定の空港は函館だったの？"}, {"t": 639.4666666666667, "x": "防衛局長は、千歳に\n降りるつもりだったようだと答えた。"}, {"t": 642.95, "x": "三沢ではなく千歳だと。"}, {"t": 644.6833333333333, "x": "千歳ってF4EJが上がった基地よね。"}, {"t": 647.25, "x": "そうだ。でも機が降りたのは函館だった。"}, {"t": 649.8, "x": "なぜ函館になったのかは、答弁ではここまでだ。"}, {"t": 652.95, "x": "じゃあ降りたあとはどうなったの？"}, {"t": 654.6666666666666, "x": "最初に駆けつけたのは北海道の警察だった。"}, {"t": 658.2333333333333, "x": "警察庁の警備局長の答弁は、10月5日の参議院だ。"}, {"t": 662.1333333333333, "x": "着陸は110番の通報で警察に伝わった。"}, {"t": 665.3333333333334, "x": "110番？　だれが通報したの？"}, {"t": 667.4833333333333, "x": "答弁には通報した人のことは出てこない。"}, {"t": 670.1, "x": "函館の警察は、すぐ警察官を空港に向かわせた。"}, {"t": 673.6666666666666, "x": "乗っていた人に事情を聞くと、\nソ連のベレンコ中尉だった。"}, {"t": 677.15, "x": "そしてアメリカへ亡命したいと分かった。"}, {"t": 679.4333333333333, "x": "警察は本人の身柄を保護した。"}, {"t": 681.7, "x": "逮捕はしなかったの？"}, {"t": 683.2, "x": "しなかった。任意で調べる形にした。"}, {"t": 685.7833333333333, "x": "本人は亡命を申し出て、身を\n守ってほしいと願っていた。"}, {"t": 689.3166666666667, "x": "逃げたり証拠を隠したりする\n疑いは、乏しいと判断したという。"}, {"t": 693.2833333333333, "x": "拳銃は持っていたの？"}, {"t": 694.7833333333333, "x": "自動拳銃を1丁持っていた。"}, {"t": 696.5333333333333, "x": "警察は任意で預かった。"}, {"t": 698.2666666666667, "x": "法務省の課長は、着陸の少しあとに\n拳銃が撃たれたと答えている。"}, {"t": 702.5, "x": "近づこうとした\n人への威嚇のようだった、という説明だ。"}, {"t": 705.9833333333333, "x": "議員は、逮捕した別の事件と比べて、\nなぜ逮捕しないのかと問うた。"}, {"t": 710.2833333333333, "x": "局長は、事件の様子が違うので\n結果が分かれたと答えた。"}, {"t": 714.1833333333333, "x": "けがをした人は？"}, {"t": 715.4833333333333, "x": "読んだ答弁にけが人の話は無い。"}, {"t": 717.6666666666666, "x": "機体については、令状なしの実況見分が行われた。"}, {"t": 721.15, "x": "9月7日には、北海道警察の函館方面本部が\n実況見分をした。"}, {"t": 725.95, "x": "防衛庁は、専門の知識を持つ\n数名を補助として出している。"}, {"t": 730.3333333333334, "x": "13時57分ごろ、防衛庁は\n札幌の管制部と連絡をとった。"}, {"t": 734.6833333333333, "x": "そこで、識別不明機が函館に\n強行着陸したと確かめた。"}, {"t": 738.9, "x": "14時10分、F4EJは千歳に帰った。"}, {"t": 741.9333333333333, "x": "首相にはいつ伝わったの？"}, {"t": 743.7333333333333, "x": "防衛局長の答弁では、総理には\n14時10分ごろ電話で報告した。"}, {"t": 748.1, "x": "長官はこのとき不在だったと、局長は言っている。"}, {"t": 751.3166666666667, "x": "着陸から20分くらいね。"}, {"t": 753.3333333333334, "x": "そうだ。局長はここに反省があると述べた。"}, {"t": 756.1, "x": "13時57分ごろには、\n千歳の司令部が情報を持っていた。"}, {"t": 760.0333333333333, "x": "それが大臣のところへ届くまでに、時間がかかった。"}, {"t": 763.2833333333333, "x": "防衛庁の中に、すぐ情報が\n届く仕組みがあればよかった。"}, {"t": 766.8833333333333, "x": "もう少し早く大臣に届き、時間を\n短くできたのではないかと。"}, {"t": 771.0, "x": "レーダーの状況が航空幕僚長にまっすぐ\n届く仕組みも、検討すべきだと話した。"}, {"t": 776.15, "x": "情報の通り道の話なのね。"}, {"t": 778.3166666666667, "x": "長官も報告の最後で、2つの問題を挙げている。"}, {"t": 781.5833333333334, "x": "情報の連絡に遅れがあったこと。"}, {"t": 783.7166666666667, "x": "レーダーサイトが航跡を見失ったことだ。"}, {"t": 786.1666666666666, "x": "防空の態勢に重要な問題があることを示している、と。"}, {"t": 789.75, "x": "長官自身が問題だと認めたのね。"}, {"t": 792.2666666666667, "x": "認めた。防空のあり方を、改めて検討するとした。"}, {"t": 795.8333333333334, "x": "10月1日の予算委員会では、まことに\n責任を感じているとも述べた。"}, {"t": 800.3333333333334, "x": "その日の夜も空と海の警戒は続いた。"}, {"t": 803.5666666666667, "x": "6日の夜、ソ連の飛行機2機が\n日本のレーダーに映った。"}, {"t": 807.1, "x": "千歳と小松から戦闘機が緊急発進した。"}, {"t": 810.1833333333333, "x": "取り返しに来たの？"}, {"t": 811.5666666666667, "x": "防衛局長は、日本に向かう\n航跡ではなかったと答えている。"}, {"t": 815.35, "x": "航跡は翌朝の2時ごろまで見えていた。"}, {"t": 817.7666666666667, "x": "防衛庁はふだんの待機の2機を増やした。"}, {"t": 820.2333333333333, "x": "海でも見張りが始まった。"}, {"t": 821.9166666666666, "x": "大湊の艦艇が、津軽海峡を進むソ連の船を見張った。"}, {"t": 825.8333333333334, "x": "海峡でも？"}, {"t": 826.9666666666667, "x": "あとから横須賀の船も加わって、\n多いときは9隻ほどになった。"}, {"t": 830.95, "x": "陸でも同じだ。函館には\n陸上自衛隊の第28普通科連隊がいた。"}, {"t": 835.65, "x": "隊員は夜の外出をやめて待機した。"}, {"t": 838.0666666666667, "x": "ミグが函館を離れるまで、警戒は続いたという。"}, {"t": 841.2666666666667, "x": "1機の戦闘機のために、陸も海も空も動いたのね。"}, {"t": 844.8, "x": "そういうことになる。"}, {"t": 846.0, "x": "ソ連の艦艇に特別な\n動きは無かった、とも局長は答えた。"}, {"t": 850.1, "x": "何も起きなかったならよかったわ。"}, {"t": 852.1833333333333, "x": "一方、地上では\nベレンコ中尉の取り調べが進んでいた。"}, {"t": 855.5, "x": "そこで並んだ罪名は1つではなかった。"}, {"t": 858.6, "x": "9月7日、警察は事件を検察に送った。"}, {"t": 861.6833333333333, "x": "法務省の課長が挙げた疑いはいくつもある。"}, {"t": 864.2666666666667, "x": "まず、旅券を持たずに日本に\n入った出入国管理令違反。"}, {"t": 867.95, "x": "次に、空港の設備を壊して\n航空の危険を生じさせた疑い。"}, {"t": 871.9, "x": "拳銃を持っていた銃刀法違反。"}, {"t": 873.8666666666667, "x": "弾を持っていた火薬類取締法違反。"}, {"t": 876.35, "x": "そして、拳銃を撃ったことによる脅迫の疑いだ。"}, {"t": 879.6166666666667, "x": "亡命しに来たのにそんなに罪名がつくの？"}, {"t": 882.3, "x": "疑いとしてはつく。防衛局長は、\n6つの罪名と表現した日もある。"}, {"t": 886.7666666666667, "x": "法務省の局長は、日本の司法権に\n従うという考えで捜査したと答えた。"}, {"t": 891.7666666666667, "x": "じゃあ裁判になったの？"}, {"t": 893.2666666666667, "x": "ならなかった。9月9日、\n函館地方検察庁は不起訴にした。"}, {"t": 897.6833333333333, "x": "亡命の意思を持っていたことなどを\n考えた、という説明だ。"}, {"t": 901.1666666666666, "x": "外務省の局長は、人道的な配慮などが\n理由だと聞いていると答えた。"}, {"t": 905.7333333333333, "x": "疑いはあっても裁かなかったのね。"}, {"t": 908.0, "x": "そうだ。最後は、本人の希望を考えた判断になった。"}, {"t": 911.6, "x": "では本人の希望とは何だったのか。"}, {"t": 913.8333333333334, "x": "その答えは本人が書いた紙に残っている。"}, {"t": 917.1166666666667, "x": "外務省の欧亜局長は、\n9月30日の予算委員会でこう答えた。"}, {"t": 921.35, "x": "ベレンコ中尉は函館で、まったく自発的に話した。"}, {"t": 924.8, "x": "自分はアメリカへ亡命したいのだと。"}, {"t": 926.9333333333333, "x": "そしてその声明書を自分の手で書いた。"}, {"t": 929.4333333333333, "x": "自分で書いたのね。どんな中身だったの？"}, {"t": 932.0666666666667, "x": "文面そのものは答弁には出てこない。"}, {"t": 934.35, "x": "分かっているのは、亡命したいという\n意思を書いたことだ。"}, {"t": 937.45, "x": "外務省は、この声明書を\n東京のソ連大使に見せている。"}, {"t": 941.0833333333334, "x": "ソ連の大使に見せたの？"}, {"t": 942.7666666666667, "x": "答弁では、見せたという事実だけが述べられている。"}, {"t": 945.7833333333333, "x": "ソ連は、そもそも亡命の事件だと認めなかった。"}, {"t": 948.9666666666667, "x": "飛行士と機体の即時返還を\n求めるのが、基本の立場だった。"}, {"t": 953.15, "x": "本人は帰りたくないのに？"}, {"t": 954.95, "x": "そうだ。本人と本人の国の言い分は、正反対だった。"}, {"t": 958.65, "x": "中尉は、ソ連の大使館員に\n会いたくないと強く言い続けていた。"}, {"t": 962.5333333333333, "x": "それでも日本は面会の場を作った。"}, {"t": 964.9, "x": "どうして会わせたの？"}, {"t": 966.2333333333333, "x": "その理由も外務省が答えている。"}, {"t": 968.9, "x": "外務省の欧亜局長は、\n10月7日の参議院でこう述べた。"}, {"t": 972.65, "x": "本人は大変な決意をして飛んできた。"}, {"t": 975.1166666666667, "x": "その緊張もあって、ソ連とは\n話したくもないと主張していた。"}, {"t": 978.9166666666666, "x": "ただ、全く会わせないまま\n出国させては、日ソ関係にも響く。"}, {"t": 983.3, "x": "だから説得したのね。"}, {"t": 984.9833333333333, "x": "そうだ。いやがる本人を説得して、会う手順を踏んだ。"}, {"t": 988.4, "x": "総理の指示もあったと、9月30日の答弁にある。"}, {"t": 991.7166666666667, "x": "面会は9月9日に日本を出る前だった。"}, {"t": 994.4666666666667, "x": "中尉は大使館員に、気持ちは\n声明書のとおりだと伝えた。"}, {"t": 998.1833333333333, "x": "はっきり言ったのね。"}, {"t": 999.5166666666667, "x": "アメリカに渡ったあとも確認は続いた。"}, {"t": 1001.9333333333333, "x": "9月28日、ワシントンでもソ連の大使館員と面会した。"}, {"t": 1006.05, "x": "亡命の意思は全く変わっていないと、\n重ねて確かめたという。"}, {"t": 1009.7666666666667, "x": "この知らせも、外務省がアメリカから受けたものだ。"}, {"t": 1012.9166666666666, "x": "日本でもアメリカでも会ってるのね。"}, {"t": 1015.05, "x": "そうだ。意思の確認を何度も重ねた形だ。"}, {"t": 1018.0333333333333, "x": "局長は、もう少し時間をかける\n考えもあったと認めている。"}, {"t": 1021.8, "x": "ただ、本人の気持ちや\n人道上の問題、警備の問題もあった。"}, {"t": 1025.8333333333333, "x": "だから人の扱いは比較的早く決めたという。"}, {"t": 1028.95, "x": "人の扱いと機体の扱いは別なの？"}, {"t": 1031.55, "x": "別だ。ここが、この事件のいちばんの分かれ道になる。"}, {"t": 1035.5666666666666, "x": "先に決まったのは人の扱いだった。"}, {"t": 1037.9333333333334, "x": "防衛庁も本人の同意を得て、9月8日と\n9日に東京で話を聞いている。"}, {"t": 1042.65, "x": "入管の手続きを答えたのは、\n法務大臣官房の審議官だ。"}, {"t": 1046.5333333333333, "x": "中尉は有効な旅券を持たずに\n入ったので、不法入国として扱った。"}, {"t": 1050.85, "x": "本人は審査の段階で事実を\n認め、口頭審理を求めなかった。"}, {"t": 1055.0166666666667, "x": "そこで退去強制令書が出された。"}, {"t": 1057.1833333333334, "x": "手続きのあいだ、本人は\n東京水上警察署で収容の形をとった。"}, {"t": 1061.6166666666666, "x": "令書が出たあと仮放免にして、\nそのうえで自費出国を認めている。"}, {"t": 1065.8, "x": "退去強制って国の外へ出すことよね？"}, {"t": 1068.45, "x": "そうだ。ただ本人は、自分の費用で\nアメリカへ行きたいと申し出た。"}, {"t": 1072.4666666666667, "x": "アメリカも受け入れると通知してきた。"}, {"t": 1074.6333333333334, "x": "そこで退去強制の1つの形として、自費出国を許した。"}, {"t": 1078.8333333333333, "x": "出す手続きの中で送り出したのね。"}, {"t": 1081.25, "x": "不起訴の通知を受けてから、\n出国を認めたという順番だ。"}, {"t": 1084.9166666666667, "x": "入国管理局長は、入管の立場では\n特殊な例ではないと言った。"}, {"t": 1089.0333333333333, "x": "旅券も乗員手帳も無ければ、\nだれでも不法入国者になる。"}, {"t": 1092.6666666666667, "x": "審議官によれば、\n1970年からの第三国への亡命の申し出は31名。"}, {"t": 1098.0166666666667, "x": "ベレンコ中尉もその1人で、ほとんど\n同じ形で処理してきたという。"}, {"t": 1102.2, "x": "日本では珍しくない手続きだったのね。"}, {"t": 1104.8333333333333, "x": "人の手続きとしてはそうだ。"}, {"t": 1106.6666666666667, "x": "9月9日、中尉は日本を出てアメリカへ向かった。"}, {"t": 1109.85, "x": "着陸から3日後のことだ。"}, {"t": 1111.6666666666667, "x": "ところが機体は函館に残っていた。"}, {"t": 1114.6166666666666, "x": "9月10日の夜、機体は防衛庁が保管することになった。"}, {"t": 1118.2333333333333, "x": "坂田長官はその理由をこう述べた。"}, {"t": 1120.45, "x": "ソ連の軍人が軍用機を操縦して、\n日本の領空を侵犯した。"}, {"t": 1124.4833333333333, "x": "そして日本の領土に強行着陸した事件だ。"}, {"t": 1127.4, "x": "防衛の任に当たる機関として、\n背景を明らかにする必要がある、と。"}, {"t": 1131.8333333333333, "x": "警察から防衛庁に担当が変わったのね。"}, {"t": 1134.6166666666666, "x": "そうだ。最初の1週間は警察と検察が\n捜査したと、防衛局長は答えた。"}, {"t": 1139.7333333333333, "x": "防衛庁はそのとき、技術の面で補助をしていた。"}, {"t": 1142.7333333333333, "x": "ここで法律の上の手順が1つ入る。"}, {"t": 1145.15, "x": "刑事局長は、機体をまず\nベレンコ中尉に返したと説明した。"}, {"t": 1149.1666666666667, "x": "本人はもうアメリカにいるのに？"}, {"t": 1151.1, "x": "書類の上の話だ。押収した物は、\n差し出した人に返すのが原則だという。"}, {"t": 1156.1, "x": "そして中尉から預かる形で、防衛庁が保管した。"}, {"t": 1159.5666666666666, "x": "持ち主はソ連なのにややこしいわね。"}, {"t": 1161.8833333333334, "x": "条約局長も、機体は\nソ連政府の国有財産だと答えている。"}, {"t": 1165.9833333333333, "x": "領空侵犯をしても、その地位は失われていないと。"}, {"t": 1169.1666666666667, "x": "いずれソ連に返す前提で、調べる権限を使った形だ。"}, {"t": 1173.05, "x": "じゃあ函館ですぐ調べたの？"}, {"t": 1174.9833333333333, "x": "それができなかった。"}, {"t": 1176.9, "x": "防衛局長は、函館で調べるのは難しかったと答えた。"}, {"t": 1180.7166666666667, "x": "理由の1つは警備の問題だ。"}, {"t": 1182.7333333333333, "x": "もう1つは、民間の飛行機が使う空港だということ。"}, {"t": 1186.2, "x": "そして調べるための機材が無かった。"}, {"t": 1188.4666666666667, "x": "発電機も無いという状態だった、と局長は言った。"}, {"t": 1191.8, "x": "電気が無いと機械が動かせないわね。"}, {"t": 1194.1833333333334, "x": "そうだ。そこで、自衛隊の基地へ運ぶことにした。"}, {"t": 1197.4166666666667, "x": "行き先は茨城県の百里基地だ。"}, {"t": 1199.75, "x": "運ぶなら、ばらばらにしないといけないわよね。"}, {"t": 1202.5666666666666, "x": "ところが、細かく切り刻むわけにはいかなかった。"}, {"t": 1205.5833333333333, "x": "将来ソ連に返すことを考えると、\n好きに切れないからだ。"}, {"t": 1209.3, "x": "運びたいけど壊せないのね。"}, {"t": 1211.2166666666667, "x": "もう1つ困った事実も分かっていた。"}, {"t": 1213.55, "x": "中尉の供述から、この機に自爆装置があると分かった。"}, {"t": 1216.9833333333333, "x": "そのスイッチも見つかった。"}, {"t": 1218.7333333333333, "x": "自爆装置！"}, {"t": 1219.8666666666666, "x": "解体のときに爆発しないか、\n知識が無かったと局長は認めている。"}, {"t": 1224.25, "x": "そこで9月13日ごろから、アメリカに問い合わせた。"}, {"t": 1227.5833333333333, "x": "アメリカには、ミグについての知識と機材があった。"}, {"t": 1231.2333333333333, "x": "アメリカの力を借りるには条件があった。"}, {"t": 1233.6833333333334, "x": "航空幕僚長と在日米軍の司令官が、考え方を詰めた。"}, {"t": 1237.7, "x": "1つ目、アメリカの要員と機器は、\n自衛隊の指令と監督のもとに置く。"}, {"t": 1242.2, "x": "2つ目、作業で得た知識は、\nすべて自衛隊のものになる。"}, {"t": 1245.8666666666666, "x": "3つ目、協力してもらった分は、自衛隊が実費を払う。"}, {"t": 1249.7, "x": "アメリカに勝手にやらせないってこと？"}, {"t": 1252.0, "x": "そうだ。勝手にやられたのでは\n自主性が保てない、と局長は話した。"}, {"t": 1256.2833333333333, "x": "アメリカ本国に勝手に\n報告してはいけない、とも説明している。"}, {"t": 1260.3333333333333, "x": "その約束は紙に書いたの？"}, {"t": 1262.2833333333333, "x": "防衛審議官は、中身を確かめるメモを作ったと答えた。"}, {"t": 1265.9166666666667, "x": "ただ、単なる内部のメモなので\n提出は控えたいと言った。"}, {"t": 1269.5666666666666, "x": "見せてはもらえなかったのね。"}, {"t": 1271.3666666666666, "x": "運ぶのに使ったのは、大型輸送機のギャラクシーだ。"}, {"t": 1274.5666666666666, "x": "作業中のアメリカの軍人には地位協定が\n当てはまらない、とも答弁された。"}, {"t": 1279.0666666666666, "x": "地位協定って？"}, {"t": 1280.25, "x": "日本にいるアメリカ軍の扱いを決めた、取り決めだ。"}, {"t": 1283.3666666666666, "x": "この作業では自衛隊の監督のもとで\n働くので、外れるという説明だった。"}, {"t": 1288.05, "x": "アメリカの軍人であることは\n変わらない、とも付け加えている。"}, {"t": 1291.5, "x": "三木首相も、扱った経験が無いので\n専門家の意見を聞く必要があったと答えた。"}, {"t": 1296.6166666666666, "x": "調べるのは、あくまで日本の自主性と\n責任でだ、とも述べている。"}, {"t": 1301.2666666666667, "x": "9月19日、解体の作業が始まった。"}, {"t": 1304.0833333333333, "x": "24日に解体を終え、その夜遅くから\n25日の未明にかけて運んだ。"}, {"t": 1308.7666666666667, "x": "アメリカのC5という輸送機で、百里基地へ移した。"}, {"t": 1312.2333333333333, "x": "函館に降りてから19日後ね。"}, {"t": 1314.4666666666667, "x": "百里では機体をもう一度組み立てた。"}, {"t": 1316.6666666666667, "x": "積んである機器やエンジンを調べた。"}, {"t": 1318.75, "x": "どんな飛行機だったの？"}, {"t": 1320.3, "x": "防衛局長は、幻の飛行機と言われていたと話した。"}, {"t": 1323.8833333333334, "x": "ジェーン年鑑でも、ぼうっとした\n写真ぐらいしか見たことがない。"}, {"t": 1327.4333333333334, "x": "そばに近寄るのも、慎重にやるくらいのものだったと。"}, {"t": 1330.6666666666667, "x": "局長は、普通の自動車なら\n3日もかからずに分かったと例えた。"}, {"t": 1334.8166666666666, "x": "戦闘機はそう簡単じゃないのね。"}, {"t": 1336.95, "x": "坂田長官は、速さはマッハ3.\n2という資料もあると紹介した。"}, {"t": 1341.2333333333333, "x": "音の速さの3倍よりも速いのね。"}, {"t": 1343.5833333333333, "x": "では調べて全部分かったのか。"}, {"t": 1345.45, "x": "局長は10月14日、自信を持って\n全部とは言いにくいと答えた。"}, {"t": 1349.55, "x": "細かく調べる時間は無かった。"}, {"t": 1351.5666666666666, "x": "ただ、組み立てて作動させ、\n知りたい範囲は知り得たと。"}, {"t": 1355.0166666666667, "x": "全部じゃないけど、必要なことは分かったのね。"}, {"t": 1357.9833333333333, "x": "そういう言い方だ。"}, {"t": 1359.1333333333334, "x": "調べた結果をいつ国会に\n報告するのかも、質問で問われた。"}, {"t": 1363.1166666666666, "x": "そしてその少し前、国会は言葉の意味でもめていた。"}, {"t": 1367.1333333333334, "x": "時間を少し戻して、\n10月4日の参議院の予算委員会だ。"}, {"t": 1371.0666666666666, "x": "ある議員が領空侵犯とは何かを尋ねた。"}, {"t": 1373.6833333333334, "x": "答えたのは内閣法制局長官だ。"}, {"t": 1376.2333333333333, "x": "法制局って？"}, {"t": 1377.4666666666667, "x": "法律の解釈について、政府の中で意見を言う役所だ。"}, {"t": 1381.0166666666667, "x": "長官は突然のお尋ねだがと前置きして、こう答えた。"}, {"t": 1384.45, "x": "国際法上の領空侵犯は、ある国が\n国家意思として他国の領空に入ること。"}, {"t": 1389.5333333333333, "x": "国家意思？"}, {"t": 1390.65, "x": "国としてそうしようと決めて動くことだ。"}, {"t": 1393.1, "x": "すると議員はすぐに切り返した。"}, {"t": 1395.05, "x": "ベレンコの行動は、国家の意思で\n入ってきたと見るべきか。"}, {"t": 1398.5, "x": "そうではない。だから領空侵犯は\n成り立たないのではないか、と。"}, {"t": 1402.3333333333333, "x": "たしかに亡命なら国の命令じゃないわよね。"}, {"t": 1405.0, "x": "法務省の刑事局長も続けてこう答えた。"}, {"t": 1407.75, "x": "亡命の目的なら、一般には\n国家意思ではないと推定するのが当然だ。"}, {"t": 1412.3666666666666, "x": "じゃあ領空侵犯じゃないってこと？"}, {"t": 1414.4166666666667, "x": "ところが防衛庁は同じ日の午前、\n領空侵犯の調査だと説明していた。"}, {"t": 1418.9166666666667, "x": "機体を百里で調べている根拠は、領空侵犯だった。"}, {"t": 1422.4333333333334, "x": "前提が崩れちゃうじゃない。"}, {"t": 1424.1, "x": "そのあと委員会は休憩に入った。"}, {"t": 1426.85, "x": "休憩のあと、法制局長官が政府の意見を読み上げた。"}, {"t": 1430.3833333333334, "x": "休憩前に国家意思と言ったのは、ある意味でのことだ。"}, {"t": 1433.55, "x": "国と国のあいだで国家の責任を\n問う、国際法違反の意味だった。"}, {"t": 1437.7666666666667, "x": "意味を限ったのね。"}, {"t": 1439.1166666666666, "x": "そうだ。そのうえでこう続けた。"}, {"t": 1441.1166666666666, "x": "承諾を得ずに入った航空機に、\nスクランブルをかけるのは当然認められる。"}, {"t": 1445.5166666666667, "x": "着陸のあとに機体を保管して\n調べることも、国際法上許されている。"}, {"t": 1449.9833333333333, "x": "自衛隊法84条などの領空侵犯は、\nすべての侵入を指すと。"}, {"t": 1454.4, "x": "国際法の意味と国内法の意味で、言葉を分けたのね。"}, {"t": 1457.9666666666667, "x": "そういうことだ。議員の手元には、\n印刷した紙も配られた。"}, {"t": 1461.8, "x": "議員はその紙を見ながらさらに確かめた。"}, {"t": 1464.3166666666666, "x": "ベレンコの場合は、\n相手の国の国家意思ではなかった。それでいいかと。"}, {"t": 1468.55, "x": "政府はどう答えたの？"}, {"t": 1470.05, "x": "外務省の条約局長は、この事件には\n2つの問題があると答えた。"}, {"t": 1474.4333333333334, "x": "1つは、亡命を望む軍人が不法に入国したこと。"}, {"t": 1477.8833333333334, "x": "もう1つは、最新鋭の軍用機が\n領空を侵し、強行着陸したことだ。"}, {"t": 1482.55, "x": "人の問題は国内の手続きを終えて、国の外へ出した。"}, {"t": 1486.1666666666667, "x": "機体の問題は防衛庁が調べていると。"}, {"t": 1488.7666666666667, "x": "人と機体で話を2つに分けたのね。"}, {"t": 1491.9166666666667, "x": "次の日の10月5日、三木首相も同じ委員会で答えた。"}, {"t": 1495.6, "x": "別の議員が、亡命でも何でも\n領空侵犯だと明確にせよと迫った。"}, {"t": 1500.0, "x": "首相は、この問題には2つの面があると答えた。"}, {"t": 1503.2, "x": "領空侵犯であることは間違いない。"}, {"t": 1505.3666666666666, "x": "ただ、国の責任を問うには\n国家の意思が伴わなければならない。"}, {"t": 1509.2666666666667, "x": "国家意思で侵犯したと言える\n証拠は、出てきていない、と。"}, {"t": 1512.7166666666667, "x": "調査はしているが、そういう証拠は\n出てこない、という言い方だった。"}, {"t": 1516.6333333333334, "x": "領空侵犯ではあるけど、国の責任は問えないってこと？"}, {"t": 1520.2333333333333, "x": "そう読める答弁だ。首相は、\nそこに問題が1つ残るとも認めた。"}, {"t": 1524.5833333333333, "x": "だから日本は、国内法で対処していると続けた。"}, {"t": 1527.9166666666667, "x": "亡命か領空侵犯か、どちらか1つじゃなかったのね。"}, {"t": 1531.4833333333333, "x": "政府の答えは両方だった。"}, {"t": 1533.2333333333333, "x": "ただその説明に納得しない議員もいた。"}, {"t": 1535.8166666666666, "x": "10月14日の参議院の内閣委員会で、\nまた同じ点が問われた。"}, {"t": 1540.0666666666666, "x": "法務省や法制局の見解と、\n防衛庁の答弁が食い違っている。"}, {"t": 1544.1333333333334, "x": "国家意思でないことは、9月6日の時点で\n明らかではないか、と。"}, {"t": 1548.2166666666667, "x": "着陸したその日に、亡命と分かっていたものね。"}, {"t": 1551.4166666666667, "x": "そうだ。この食い違いを問う質問は、\n会議録に何度も残っている。"}, {"t": 1555.6166666666666, "x": "言葉1つでそんなにもめるのね。"}, {"t": 1557.8166666666666, "x": "言葉で何をしてよいかが決まるからだ。"}, {"t": 1560.7333333333333, "x": "機体を調べてよいかは、別の言葉でも問われた。"}, {"t": 1563.75, "x": "不可侵権という言葉だ。"}, {"t": 1565.5166666666667, "x": "不可侵権？"}, {"t": 1566.65, "x": "外国の軍艦などには手を\n触れてはいけない、という考えだ。"}, {"t": 1570.1833333333334, "x": "条約局長は、10月6日の衆議院でこう答えた。"}, {"t": 1573.5833333333333, "x": "許可を得て入った軍用機なら、\n軍艦のような不可侵権を持つ。"}, {"t": 1577.3833333333334, "x": "でも、承諾なしに入った\n軍用機は、その不可侵権を失う。"}, {"t": 1581.35, "x": "これは国際法上疑う余地がないと述べた。"}, {"t": 1584.15, "x": "だから日本が調べてもいいってこと？"}, {"t": 1586.4333333333334, "x": "そうだ。局長は、\n1919年のパリ条約32条を読み上げた。"}, {"t": 1591.1166666666666, "x": "航空についての古い条約で、\n今のシカゴ条約に変わったものだ。"}, {"t": 1595.1166666666666, "x": "正確には国際慣習法と言うべきかも\nしれない、とも補っている。"}, {"t": 1599.1333333333334, "x": "ただ局長は、この事案に\n直接当てはまるわけではないとも断った。"}, {"t": 1603.3333333333333, "x": "承諾なく入った航空機の立場を\n示す規定だ、という説明だ。"}, {"t": 1607.55, "x": "言える範囲をきっちり区切っているのね。"}, {"t": 1609.7833333333333, "x": "そして局長はもう1つ付け加えた。"}, {"t": 1612.1666666666667, "x": "機体はもともとソ連政府の持ち物だ。"}, {"t": 1614.6, "x": "調べ終わればソ連に返すことになると。"}, {"t": 1617.0833333333333, "x": "調べるけど返す。最初から決まっていたの？"}, {"t": 1619.95, "x": "答弁の上ではそういう筋道だった。"}, {"t": 1622.8, "x": "亡命という言葉そのものも問われた。"}, {"t": 1625.0333333333333, "x": "同じ10月6日、条約局長はこう説明した。"}, {"t": 1628.3166666666666, "x": "ベレンコ中尉は、アメリカに行って\nそこにいたいと望んだ。"}, {"t": 1631.5, "x": "その手だてとして、軍用機で日本に入ってきた。"}, {"t": 1634.5666666666666, "x": "それを便宜上、亡命と呼んでいるのだろうと。"}, {"t": 1637.2833333333333, "x": "便宜上？"}, {"t": 1638.4166666666667, "x": "法律で決まった呼び名ではない、という意味だ。"}, {"t": 1641.0333333333333, "x": "難民条約の難民に当たるかは、\n必ずしもそうではないとも言った。"}, {"t": 1645.2166666666667, "x": "亡命と難民は違うの？"}, {"t": 1646.9833333333333, "x": "難民条約の難民は、本国で\n迫害されるおそれがある人などだ。"}, {"t": 1651.15, "x": "局長は、この事件はその定義とは別の話だと整理した。"}, {"t": 1654.9666666666667, "x": "法務省の審議官も、迫害の根拠は\n厳しく調べないと答えた。"}, {"t": 1659.1166666666666, "x": "不法入国として手続きをして、望む国へ出す形だ。"}, {"t": 1662.9, "x": "呼び名は亡命でも手続きは不法入国なのね。"}, {"t": 1665.85, "x": "そうだ。入管令には、\n政治亡命者という区分が無かった。"}, {"t": 1669.5166666666667, "x": "審議官は10月12日、その区分を\n作るかを検討していると答えた。"}, {"t": 1674.1166666666666, "x": "この事件が制度の話にもつながったのね。"}, {"t": 1676.9333333333334, "x": "そうだ。1機の着陸が、法律のすき間も照らした。"}, {"t": 1681.0, "x": "機体をどう返すか、外交の動きも会議録に残っている。"}, {"t": 1684.55, "x": "9月28日のニューヨーク時間、日本時間では29日だ。"}, {"t": 1688.5166666666667, "x": "小坂善太郎外務大臣が、\nソ連のグロムイコ外務大臣と会った。"}, {"t": 1692.6, "x": "そこでできるだけ早く返す方針を伝えた。"}, {"t": 1695.45, "x": "ソ連は喜んだの？"}, {"t": 1696.8833333333334, "x": "ソ連は、飛行士も機体もすぐ返せという立場だった。"}, {"t": 1700.2333333333333, "x": "亡命の事件とは認めていなかったからだ。"}, {"t": 1702.7833333333333, "x": "10月2日、日本は東京でソ連の大使館に伝えた。"}, {"t": 1706.4333333333334, "x": "10月15日以降、ソ連の用意が整い\n次第、適当な港で引き渡すと。"}, {"t": 1711.5, "x": "ソ連の返事は？"}, {"t": 1712.7666666666667, "x": "話し合いに入る反応は\n10月9日以降だったと、欧亜局長は答えた。"}, {"t": 1717.3166666666666, "x": "1週間たってからだ。"}, {"t": 1718.8166666666666, "x": "話し合ったのは、場所や確かめ方、\n立ち会う人などの細かい点だ。"}, {"t": 1723.0666666666666, "x": "細かい点をモスクワに確かめる\n必要があるようだ、と局長は見ていた。"}, {"t": 1727.4666666666667, "x": "返すのにも時間がかかるのね。"}, {"t": 1729.55, "x": "港は茨城県の日立港に決まった。"}, {"t": 1732.0666666666666, "x": "百里基地と同じ茨城県の港だ。"}, {"t": 1734.4666666666667, "x": "ソ連の書記長の演説の報道では、\n両国の関係に多少曇りが出たと言われた。"}, {"t": 1739.3833333333334, "x": "小坂外務大臣は、返すときもなるべく\n目立たせたくないと述べた。"}, {"t": 1743.4166666666667, "x": "ソ連にとって痛い傷口に、なるべく\n触れないようにしたいと。"}, {"t": 1746.9333333333334, "x": "大臣は、最新鋭の戦闘機乗りに\n亡命されたことは、ソ連に痛い所だと見ていた。"}, {"t": 1752.3333333333333, "x": "相手の気持ちにも気を配ったのね。"}, {"t": 1754.5333333333333, "x": "外交の言葉としてはそうなる。"}, {"t": 1757.1, "x": "11月15日、ミグ25は日立港で\nソ連の船に引き渡された。"}, {"t": 1761.5833333333333, "x": "1977年4月の衆議院で、\n外務省がこの日付を答えている。"}, {"t": 1766.4666666666667, "x": "函館に降りてからどれくらい？"}, {"t": 1768.3666666666666, "x": "外務省の参事官は約3か月余りと言った。"}, {"t": 1771.3, "x": "9月6日から数えると、70日だ。"}, {"t": 1774.0666666666666, "x": "ソ連の船ってどんな船だったの？"}, {"t": 1776.2833333333333, "x": "船の名前は読んだ答弁には出てこない。"}, {"t": 1778.7333333333333, "x": "返して終わりだったの？"}, {"t": 1780.25, "x": "終わらなかった。ソ連からは、\n機体の状態に不満が出た。"}, {"t": 1783.9333333333334, "x": "ばらばらにして調べたからかしら。"}, {"t": 1786.1, "x": "不満の中身はこの答弁では語られていない。"}, {"t": 1788.7666666666667, "x": "日本からは逆に費用を請求した。"}, {"t": 1790.9833333333333, "x": "百里基地から日立港までの運送の費用。"}, {"t": 1793.6, "x": "梱包の費用。"}, {"t": 1794.65, "x": "そして、函館空港の施設が壊された分の費用だ。"}, {"t": 1798.2666666666667, "x": "日本も言うべきことは言ったのね。"}, {"t": 1800.3166666666666, "x": "ソ連からも請求があったと、外務省は認めている。"}, {"t": 1803.5, "x": "参事官は、相手を刺激しないよう\n極めて慎重に処理したと述べた。"}, {"t": 1807.6, "x": "とるべき措置も、最小限に\nとどめる気持ちだったという。"}, {"t": 1811.0333333333333, "x": "国と国の後始末は長く続くのね。"}, {"t": 1814.15, "x": "この事件のあと、北の海の漁業者も不安を口にした。"}, {"t": 1817.6166666666666, "x": "ソ連による漁船の拿捕が、\n増えるのではないかという不安だ。"}, {"t": 1821.1333333333334, "x": "拿捕って？"}, {"t": 1822.2666666666667, "x": "漁船が相手の国につかまえられることだ。"}, {"t": 1824.7166666666667, "x": "外務省は10月20日、数字で答えている。"}, {"t": 1827.6, "x": "ミグ事件のあと、9月は5隻で、\n10月はその日までに3隻。"}, {"t": 1831.6666666666667, "x": "前の年の同じ時期は、9月3隻と10月8隻だった。"}, {"t": 1835.4833333333333, "x": "数字の上では、目立って\n増えてはいないという答えだ。"}, {"t": 1838.6333333333334, "x": "じゃあ関係なかったのね。"}, {"t": 1840.2666666666667, "x": "局長は、危ない海への出漁を\n控えている事情もあると付け加えた。"}, {"t": 1844.3833333333334, "x": "拿捕のたびに抗議して、すぐ\n返すよう申し入れているとも答えた。"}, {"t": 1848.1833333333334, "x": "一方、10月26日には\n漁業団体の代表が国会でこう述べた。"}, {"t": 1852.6, "x": "報復と一方的に片づけたくはない。"}, {"t": 1855.0, "x": "でも漁業者は、ミグ事件のつけが回ってきたと\n受け止めている、と。"}, {"t": 1859.1, "x": "数字と現場の受け止めが違ったのね。"}, {"t": 1861.5333333333333, "x": "どちらも同じ会議録に残っている。"}, {"t": 1863.7333333333333, "x": "外務省の課長は、政府や国民の意思と\n関わりなく起きた事件だと答えた。"}, {"t": 1868.3833333333334, "x": "国交の回復から20年の関係を、\n損ねるべきではないという考えだ。"}, {"t": 1872.8666666666666, "x": "日ソの基本の関係に、影響すべきものではないと。"}, {"t": 1876.2666666666667, "x": "起きたことは選べなかったものね。"}, {"t": 1878.8666666666666, "x": "では防空の問題はどうなったのか。"}, {"t": 1880.9666666666667, "x": "長官は、事件を分析して問題点を\n突き止めると言っていた。"}, {"t": 1884.8166666666666, "x": "1977年3月、防衛局長は\n次の戦闘機の条件を説明した。"}, {"t": 1890.0833333333333, "x": "条件は6つあった。"}, {"t": 1891.4666666666667, "x": "その1つが低い空から入る機への備えだ。"}, {"t": 1894.3, "x": "ミグ25のとき問題になったように、と\n局長は前置きした。"}, {"t": 1898.0333333333333, "x": "高い所から、低くはってくる\n機も見つけて攻撃できること。"}, {"t": 1902.0833333333333, "x": "ミグ25の事件が条件に入ったのね。"}, {"t": 1904.7333333333333, "x": "局長自身がそう言っている。"}, {"t": 1906.4666666666667, "x": "調査団の報告では、F15が最適という判断だった。"}, {"t": 1910.15, "x": "3つの機種を、同じ条件で比べた結果だという。"}, {"t": 1913.4166666666667, "x": "見張る飛行機の話も出たの？"}, {"t": 1915.4666666666667, "x": "1977年3月の国会では、\n早期警戒機の値段も質問された。"}, {"t": 1920.7833333333333, "x": "早期警戒機？"}, {"t": 1922.0166666666667, "x": "空の高い所から、レーダーで広く見張る飛行機だ。"}, {"t": 1925.3666666666666, "x": "低く飛ぶ機を上から見つける道具になる。"}, {"t": 1927.9166666666667, "x": "13時26分に消えた機を、上から見つけたかったのね。"}, {"t": 1931.7166666666667, "x": "そういう問いかけが国会で続いた。"}, {"t": 1933.8166666666666, "x": "長官が挙げた反省の2つ目は、\n航跡を見失ったことだった。"}, {"t": 1937.8, "x": "1つ目の、情報の遅れの反省も会議録に残っている。"}, {"t": 1942.05, "x": "最後に時刻をもう一度並べる。"}, {"t": 1944.0333333333333, "x": "13時11分、北海道の西で識別不明機を発見。"}, {"t": 1947.8166666666666, "x": "13時20分、千歳からF4EJが2機。"}, {"t": 1950.8666666666666, "x": "13時22分30秒、茂津多岬の沖で領空侵犯。"}, {"t": 1954.75, "x": "13時25分から30秒、機上レーダーがとらえた。"}, {"t": 1958.2, "x": "13時26分ごろ、高度を下げてレーダーから消えた。"}, {"t": 1961.5666666666666, "x": "13時35分過ぎ、全日空機が函館を離陸。"}, {"t": 1965.1166666666666, "x": "13時49分、函館の上空で旋回中との連絡。"}, {"t": 1969.0166666666667, "x": "13時50分ごろ、管制官のいない函館空港に着陸。"}, {"t": 1973.1166666666666, "x": "こうして並べると短い時間ね。"}, {"t": 1975.3166666666666, "x": "39分だ。そのあとの国会では、\n何週間も議論が続いた。"}, {"t": 1979.5833333333333, "x": "領空侵犯か亡命か。"}, {"t": 1981.2, "x": "政府は両方だと答えた。"}, {"t": 1982.8666666666666, "x": "国の責任を問う意味では、\n国家意思の証拠は出ていない。"}, {"t": 1986.1833333333334, "x": "でも、許可なく日本の空に入ったことは間違いない。"}, {"t": 1989.55, "x": "1つの言葉では全部は言えなかったのね。"}, {"t": 1992.1666666666667, "x": "そうだ。だから人と機体を分けて扱った。"}, {"t": 1994.95, "x": "人は3日後にアメリカへ。"}, {"t": 1996.4166666666667, "x": "機体は70日後にソ連へ。"}, {"t": 1998.4833333333333, "x": "ベレンコ中尉はそのあとどうなったの？"}, {"t": 2000.7, "x": "アメリカで暮らした。"}, {"t": 2001.9333333333334, "x": "2023年9月に76歳で亡くなったと、\n家族の話として報じられた。"}, {"t": 2007.2666666666667, "x": "この事件では、だれも命を落とさなかったのよね。"}, {"t": 2010.3833333333334, "x": "そうだ。空港でも、亡くなった人はいなかった。"}, {"t": 2013.3833333333334, "x": "残ったのは、分刻みの時刻と言葉を選んだ答弁だ。"}, {"t": 2016.9666666666667, "x": "秒まで残った記録だったわね。"}, {"t": 2019.0833333333333, "x": "1976年9月6日の39分は、\nこうして会議録に残っている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
