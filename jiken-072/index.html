<script>
const D={"name": "072", "file": "072_編集用", "dur": 2033.4333125, "segs": [], "subs": [{"t": 0.0, "x": "1994年6月27日、午後11時ごろ。"}, {"t": 3.8833333333333333, "x": "長野県松本市、北深志。"}, {"t": 6.066666666666666, "x": "住宅と、小さな駐車場と、\n池のある、ごく普通の一角だ。"}, {"t": 10.183333333333334, "x": "そこで、目に見えない毒のガスがまかれた。"}, {"t": 12.766666666666667, "x": "まず、この事件を警察がどう\n記録しているかから始める。"}, {"t": 16.233333333333334, "x": "警察庁が毎年出している\n「警察白書」という報告書がある。"}, {"t": 20.4, "x": "その平成7年版に、この事件の項目がある。"}, {"t": 23.5, "x": "正式な事件名は、こう書かれている。"}, {"t": 25.883333333333333, "x": "「松本市内における毒物使用多数殺人事件」"}, {"t": 29.183333333333334, "x": "松本サリン事件じゃないの？"}, {"t": 31.083333333333332, "x": "それは通り名だ。警察の記録では、\nこの名前になっている。"}, {"t": 34.75, "x": "白書の本文はこうだ。"}, {"t": 36.28333333333333, "x": "「平成六年六月二十七日午後十一時ころ、\n長野県松本市北深志においてサリンが発散され、」"}, {"t": 42.7, "x": "「その結果、付近住民七人が死亡し、約二百七十人が\n被害を訴えて病院で受診するという事件が発生した」"}, {"t": 50.016666666666666, "x": "長野県警は、通報を受けてすぐ、\nおよそ100人の警察官を現場に送った。"}, {"t": 54.85, "x": "そして翌28日から、松本警察署に\n捜査本部が置かれた。"}, {"t": 59.18333333333333, "x": "白書には、原因を突き止めるまでの経緯も書いてある。"}, {"t": 62.35, "x": "「科学警察研究所から所長以下の化学に\n関する専門的な知識を有する職員が派遣され、"}, {"t": 68.06666666666666, "x": "有毒ガスの解明等に当たったところ、」"}, {"t": 70.53333333333333, "x": "「本事件の原因物質はサリンであると判明した」"}, {"t": 73.7, "x": "サリン。"}, {"t": 74.33333333333333, "x": "軍が使う目的で作られた毒ガスだ。"}, {"t": 76.9, "x": "どうやって作るかは、この動画では一切話さない。"}, {"t": 79.9, "x": "この回で追いかけるのは、毒の話ではないからだ。"}, {"t": 83.58333333333333, "x": "この事件の死者の数は、資料に\nよって7人だったり8人だったりする。"}, {"t": 88.0, "x": "まずそこをはっきりさせておく。"}, {"t": 89.78333333333333, "x": "さっき読んだ警察白書は「七人が死亡」と書いている。"}, {"t": 93.36666666666666, "x": "これは、事件が起きた1994年の時点の数だ。"}, {"t": 97.11666666666666, "x": "亡くなったのは、19歳から53歳までの方たちだった。"}, {"t": 100.95, "x": "それから14年たって、8人目の方が亡くなっている。"}, {"t": 104.41666666666667, "x": "2008年8月5日、午前3時4分。"}, {"t": 107.26666666666667, "x": "松本市内の病院で、60歳だった。"}, {"t": 110.2, "x": "14年後？"}, {"t": 111.21666666666667, "x": "ああ。その方は、事件の夜に自宅の近くで\nサリンを吸って、心臓と呼吸が止まった。"}, {"t": 116.6, "x": "一度は戻ったが、そのあと、意識は戻らなかった。"}, {"t": 119.88333333333334, "x": "14年間、一度もだ。"}, {"t": 121.56666666666666, "x": "死因は、酸素が足りなくなったことで脳が\n傷ついたことによる、呼吸の不全だと発表されている。"}, {"t": 127.4, "x": "この方の名前は、河野澄子さんという。"}, {"t": 130.03333333333333, "x": "河野……。"}, {"t": 130.75, "x": "ああ。この回の主役の、奥さんだ。"}, {"t": 133.06666666666666, "x": "だから、いまの報道でこの事件の死者を\n書くときは、8人と書かれることが多い。"}, {"t": 137.88333333333333, "x": "怪我をした人の数も、資料で違う。"}, {"t": 140.28333333333333, "x": "警察白書は「約二百七十人が\n被害を訴えて病院で受診」。"}, {"t": 144.46666666666667, "x": "いまの新聞は「重軽傷およそ六百人」と\n書くことが多い。"}, {"t": 148.21666666666667, "x": "これは、数え方の違いだ。"}, {"t": 149.91666666666666, "x": "どちらかが嘘というわけではない。"}, {"t": 151.83333333333334, "x": "この動画では、死者8人、\n重軽傷およそ600人という言い方をする。"}, {"t": 156.25, "x": "数字が出てきたときに、どこから来た\n数字なのかを言うのは、この番組の決まりだ。"}, {"t": 161.06666666666666, "x": "もう一つ、数字の話を続ける。"}, {"t": 163.38333333333333, "x": "この事件の被害は、亡くなった方だけではない。"}, {"t": 166.31666666666666, "x": "目が見えづらい、息が苦しい、体がだるい。\nそういう症状が長く残った人がいる。"}, {"t": 171.3, "x": "1999年11月の参議院法務委員会で、被害者の相談に\nあたってきた弁護士がこう述べている。"}, {"t": 178.03333333333333, "x": "「被害者の現状、これは財産面だけじゃなくて、\n心身の傷というものが非常に大きいんだ」"}, {"t": 183.43333333333334, "x": "この人は、被害者のアンケートも\n資料として出している。"}, {"t": 186.75, "x": "その中の声を、一つだけ読む。"}, {"t": 188.93333333333334, "x": "「四年を過ぎた今も、後遺症が解明されないまま、"}, {"t": 191.83333333333334, "x": "レントゲンを撮ってもＣＴを撮っても\n異常ありませんで片づけられ」"}, {"t": 195.6, "x": "異常なし、で終わり？"}, {"t": 197.03333333333333, "x": "そう書いてある。事件から4年たった時点でだ。"}, {"t": 199.88333333333333, "x": "この回の主題は第一通報者の話だが、被害を\n受けた人が大勢いることは、先に置いておく。"}, {"t": 206.33333333333334, "x": "ここから、この回の本題に入る。"}, {"t": 208.58333333333334, "x": "その晩、いちばん最初に119番に通報した人がいる。"}, {"t": 212.26666666666668, "x": "河野義行さん。当時44歳、会社員だった。"}, {"t": 215.6, "x": "現場のすぐそばに、家があった。"}, {"t": 217.63333333333333, "x": "この人自身も、サリンを吸って倒れている。"}, {"t": 220.3, "x": "奥さんも倒れた。犬も、飼っていた熱帯魚も死んだ。"}, {"t": 223.76666666666668, "x": "家族ごと被害者じゃない。"}, {"t": 225.46666666666667, "x": "そうだ。だからこの人は、\n被害者であり、第一通報者だった。"}, {"t": 229.46666666666667, "x": "ところが、この人はそのあと1年近く、\n犯人ではないかと扱われることになる。"}, {"t": 234.45, "x": "警察からも、報道からもだ。"}, {"t": 236.53333333333333, "x": "先に、この回で\n私がやることと、やらないことを言っておく。"}, {"t": 240.23333333333332, "x": "やること。当時、何が報じられ、誰が何をして、\n後になって誰が何を認めたか。これを記録で追う。"}, {"t": 246.65, "x": "やらないこと。河野さんを疑う書き方は一切しない。"}, {"t": 249.88333333333333, "x": "この人が犯人ではないことは、\nとっくにはっきりしている。"}, {"t": 253.28333333333333, "x": "それから、当時の報道機関を一社ずつ\n名指しで責めることもしない。"}, {"t": 257.21666666666664, "x": "誤った報道を紹介するときは、その場で\n必ず「これは誤りだった」と言う。"}, {"t": 262.01666666666665, "x": "亡くなった8人の方と、そのご家族がいる。"}, {"t": 264.76666666666665, "x": "被害の様子を、話を盛るために使うことはしない。"}, {"t": 268.1166666666667, "x": "分かったわ。"}, {"t": 269.0833333333333, "x": "もう一つ。"}, {"t": 269.9166666666667, "x": "この事件は、のちに教団の犯行として裁かれている。"}, {"t": 273.3, "x": "確定した判決がある。"}, {"t": 274.76666666666665, "x": "首謀者とされた人物は2006年9月15日に\n死刑が確定し、2018年7月に執行された。"}, {"t": 281.6166666666667, "x": "実行した人たちの名前は、この動画では出さない。"}, {"t": 284.76666666666665, "x": "この回で見るのは、そこではないからだ。"}, {"t": 287.8, "x": "事件の翌日、6月28日。"}, {"t": 290.43333333333334, "x": "河野さんの家に、家宅捜索が入った。"}, {"t": 293.1666666666667, "x": "通報した人の家に？"}, {"t": 294.78333333333336, "x": "ああ。"}, {"t": 295.18333333333334, "x": "このときの令状の中身については、後になって、\n警察庁の刑事局長が国会で説明している。"}, {"t": 301.28333333333336, "x": "1996年5月23日、参議院の地方行政委員会だ。"}, {"t": 305.95, "x": "答えたのは、当時の警察庁刑事局長、野田健さん。"}, {"t": 309.73333333333335, "x": "そのまま読む。"}, {"t": 310.71666666666664, "x": "「松本サリン事件の捜査につきましては、法令の許す\n範囲内において適法に実施したものであります」"}, {"t": 316.8333333333333, "x": "「河野さんにつきましては、"}, {"t": 318.25, "x": "あくまでも第一通報者でありかつ被害者として\n御協力をいただいたわけでありますけれども、」"}, {"t": 323.4166666666667, "x": "「河野さんのお宅の直近が\n被害の発生現場であるということで、"}, {"t": 326.98333333333335, "x": "犯行に密接に関係ある\n場所であるということが考えられたために、」"}, {"t": 331.01666666666665, "x": "「被疑者不詳で捜索、差し押さえ\n許可状及び検証許可状の発布を得まして、」"}, {"t": 335.6, "x": "「河野さん宅及びその周辺の亡くなられた\n方のお宅等につきまして捜索、"}, {"t": 340.05, "x": "差し押さえ及び検証を実施したほか、河野さんからも\n事情をお聞きしたところでございます」"}, {"t": 345.3833333333333, "x": "被疑者不詳って？"}, {"t": 346.68333333333334, "x": "家に入って調べるには、裁判官が出す令状が要る。"}, {"t": 349.96666666666664, "x": "ふつうは、そこに「誰が」\n「何の罪を犯した疑いがあるか」を書く。"}, {"t": 354.31666666666666, "x": "被疑者不詳というのは、\nその「誰が」の欄を空けたまま出す形だ。"}, {"t": 358.56666666666666, "x": "つまり、河野さんは書類の上では\n被疑者ではなかった。"}, {"t": 361.6666666666667, "x": "それでも、家の中は調べられた。"}, {"t": 363.85, "x": "薬品などを含めて、二十数点が\n持ち出されたと報じられている。"}, {"t": 367.81666666666666, "x": "そして、このとき県警は、\n河野さんの名前を報道機関に伝えている。"}, {"t": 372.26666666666665, "x": "名前を？"}, {"t": 373.03333333333336, "x": "ああ。ここから、あの1年が始まる。"}, {"t": 376.05, "x": "なぜ、通報した人が疑われたのか。"}, {"t": 378.55, "x": "ここは推測で埋めるところではないので、\n記録に残っている理由だけを言う。"}, {"t": 382.78333333333336, "x": "さっきの国会答弁が、そのまま理由になっている。"}, {"t": 385.8833333333333, "x": "「河野さんのお宅の直近が被害の発生現場である」"}, {"t": 389.01666666666665, "x": "「犯行に密接に関係ある\n場所であるということが考えられた」"}, {"t": 392.6166666666667, "x": "毒がまかれた場所のいちばん近くに、\nその家があった。それが理由だ。"}, {"t": 396.9166666666667, "x": "それだけ？"}, {"t": 397.81666666666666, "x": "捜査のやり方としては、それは間違っていない。"}, {"t": 400.68333333333334, "x": "現場のいちばん近くから調べる。"}, {"t": 402.5833333333333, "x": "どんな事件でもそうする。"}, {"t": 404.18333333333334, "x": "問題は、そのあとだ。"}, {"t": 405.71666666666664, "x": "河野さんは20年ほど前に薬品を扱う\n会社に勤めていたことがあった。"}, {"t": 410.1666666666667, "x": "そこから「薬品にくわしいらしい」という見方が\n広がっていった。"}, {"t": 414.05, "x": "これは、あとから見れば何の意味もない話だった。"}, {"t": 417.01666666666665, "x": "それでも当時は、この一点が繰り返し取り上げられた。"}, {"t": 420.23333333333335, "x": "もう一つ、当時のこの事件には、\nいま考えると奇妙な前提があった。"}, {"t": 424.5833333333333, "x": "サリンという毒が、日本の住宅街で\nまかれるということを、誰も想定していなかった。"}, {"t": 429.6333333333333, "x": "だから「個人が家で作った」という\n筋で考えるしかなかった。"}, {"t": 433.56666666666666, "x": "1995年5月に国会でこう質した議員がいる。"}, {"t": 437.21666666666664, "x": "「化学の基礎知識がありさえすれば、"}, {"t": 439.2, "x": "身の安全を守る装置もないところで危険きわまる\nサリンの製造や実験など考えられもしない」"}, {"t": 444.65, "x": "素人が家で作れるものではない、ということだ。"}, {"t": 447.5833333333333, "x": "それは最初から言えたこと？"}, {"t": 449.35, "x": "この議員は「たちどころに\n明白であったはずだ」と言っている。"}, {"t": 452.9, "x": "ただ、それは事件から11か月たった時点での発言だ。"}, {"t": 456.56666666666666, "x": "当時の現場でそう考えられたかどうかは、\n私には分からない。だから断定はしない。"}, {"t": 461.48333333333335, "x": "ここで一つ、当時の空気を示す数字を置いておく。"}, {"t": 464.5833333333333, "x": "この事件が起きた1994年6月の時点で、\n日本でサリンがまかれた前例は無い。"}, {"t": 470.1, "x": "軍隊が持つ毒ガスが、地方都市の住宅街で\n使われるという想定そのものが無かった。"}, {"t": 475.3333333333333, "x": "だから、警察白書もこの事件を\n「毒物使用多数殺人事件」と呼んでいる。"}, {"t": 480.3833333333333, "x": "サリン事件、という枠がまだ存在しない。"}, {"t": 483.01666666666665, "x": "名前も無かったのね。"}, {"t": 484.51666666666665, "x": "名前が無いものは、うまく考えられない。"}, {"t": 486.95, "x": "起きていることに名前がつかないと、人は\n自分の知っている型に当てはめようとする。"}, {"t": 491.7, "x": "当時、いちばん手近にあった型が、「近くに\n住んでいる、薬品にくわしい人」だった。"}, {"t": 497.05, "x": "私はそう考えている。これは\n私の見方だ。事実ではない。"}, {"t": 501.55, "x": "ここから1年間、この人の名前は全国に出続けた。"}, {"t": 505.0833333333333, "x": "どういう扱いだったかを、事実だけで言う。"}, {"t": 507.65, "x": "実名が出た。顔写真も出た。自宅も映った。"}, {"t": 510.8666666666667, "x": "まだ、誰も逮捕されていない段階でだ。"}, {"t": 513.4833333333333, "x": "逮捕もされていないのに？"}, {"t": 515.1166666666667, "x": "ああ。書類の上では被疑者ですらない。"}, {"t": 517.3333333333334, "x": "さっき読んだとおり、令状は被疑者不詳で出ている。"}, {"t": 520.25, "x": "それでも、名前は出た。"}, {"t": 521.8166666666667, "x": "当時、報じられたことをいくつか挙げる。"}, {"t": 524.15, "x": "ただし、先に言っておく。これらは全部、\nあとから誤りだったことがはっきりしている。"}, {"t": 529.1833333333333, "x": "薬品の知識があるから\n作れたのではないか、という筋書き。"}, {"t": 532.85, "x": "家から押収された薬品が、\n材料だったのではないか、という見方。"}, {"t": 537.0, "x": "どれも違った。"}, {"t": 538.05, "x": "河野さんは起訴もされていない。"}, {"t": 539.6833333333333, "x": "送検もされていない。"}, {"t": 541.1, "x": "この人は本人が入院している\n最中に、事情を聞かれている。"}, {"t": 544.85, "x": "医師は、体の状態から2時間が限度だと言っていた。"}, {"t": 548.1833333333333, "x": "実際の聴取は、7時間に及んだと本人が語っている。"}, {"t": 551.8333333333334, "x": "当時高校1年生だった長男に対して、「君のお父さんは\n罪を認めている」と告げるやり方も取られた。"}, {"t": 558.2333333333333, "x": "……本人は認めてないのに？"}, {"t": 559.9833333333333, "x": "認めていない。"}, {"t": 560.95, "x": "家には無言電話と嫌がらせが殺到した。"}, {"t": 563.4666666666667, "x": "これが1年近く続いた。"}, {"t": 565.25, "x": "その間、奥さんは意識が戻らないままだ。"}, {"t": 568.5166666666667, "x": "この1年のあいだ、家の中で\n何が起きていたかも見ておく。"}, {"t": 572.0666666666667, "x": "ここは、本人やご家族が公にしてきた範囲だけにする。"}, {"t": 575.7, "x": "まず、奥さんの澄子さんだ。"}, {"t": 577.6, "x": "事件の夜、自宅の近くでサリンを吸って倒れた。"}, {"t": 580.75, "x": "心臓と呼吸が止まり、一度は戻った。"}, {"t": 583.3, "x": "だが、意識は戻らなかった。"}, {"t": 585.2166666666667, "x": "河野さん本人が2006年のインタビューで、「\n十二年と六か月、意識不明の状態」と語っている。"}, {"t": 591.4666666666667, "x": "そこからさらに1年半あって、\n2008年8月5日に亡くなった。"}, {"t": 595.8666666666667, "x": "事件の日から数えて、14年と1か月あまりだ。"}, {"t": 599.2333333333333, "x": "その14年、ずっと？"}, {"t": 600.8666666666667, "x": "ああ。"}, {"t": 601.2833333333333, "x": "そして、その最初の1年は、この人が\n犯人扱いされていた期間と、そのまま重なっている。"}, {"t": 607.3333333333334, "x": "奥さんが意識の戻らない状態で入院している。"}, {"t": 610.1833333333333, "x": "自分も入院している。"}, {"t": 611.45, "x": "子どもが3人いる。"}, {"t": 612.7833333333333, "x": "そこに、家宅捜索と、実名報道と、無言電話が来た。"}, {"t": 616.6333333333333, "x": "……。"}, {"t": 617.5666666666667, "x": "亡くなったときに、河野さんはこう言っている。"}, {"t": 620.0833333333334, "x": "家族にとってのゴールは、妻が完治する\n日か、亡くなる日だと思って闘ってきた。"}, {"t": 625.1333333333333, "x": "そして、「妻が頑張ったのだから私も\n頑張る」と、講演を続けると述べている。"}, {"t": 630.0, "x": "もう一つ、残っている言葉がある。"}, {"t": 632.2333333333333, "x": "2024年、事件から30年のときに、\n長女の方が新聞の取材に応じている。"}, {"t": 637.5333333333333, "x": "その中の一言だ。"}, {"t": 639.0333333333333, "x": "「『正確に書きます、客観的に\n書きます』という人をあまり信用しなくなった」"}, {"t": 644.0, "x": "……そうなるわよね。"}, {"t": 645.1333333333333, "x": "私はこの言葉を、この回の\nどこかに必ず置こうと決めていた。"}, {"t": 649.0166666666667, "x": "報道被害という言葉は、\nあの1年で終わった話ではない。"}, {"t": 652.5666666666667, "x": "30年たった家族の中に、こういう形で残っている。"}, {"t": 656.7, "x": "局面が変わったのは、まったく別の事件だった。"}, {"t": 659.7833333333333, "x": "1995年3月20日。"}, {"t": 662.2, "x": "警察白書の記述を読む。"}, {"t": 664.0166666666667, "x": "「七年三月二十日午前八時ころ、日比谷線、"}, {"t": 666.95, "x": "丸ノ内線、千代田線の三路線において車両内に\n新聞紙に包んだサリン入りの容器が置き去られ、」"}, {"t": 672.7333333333333, "x": "「複数の車両及び築地駅、"}, {"t": 674.5166666666667, "x": "霞ヶ関駅等駅構内に猛毒ガスが流出し、\n乗客、駅職員等十一人が死亡し、"}, {"t": 680.3833333333333, "x": "多数の人が負傷するという事件が発生した」"}, {"t": 683.3, "x": "地下鉄サリン事件だ。"}, {"t": 684.7833333333333, "x": "この「十一人」は白書を書いた時点の数で、\nその後さらに増えて、最終的には13人になっている。"}, {"t": 691.3666666666667, "x": "東京で、同じ物質。"}, {"t": 693.2, "x": "そうだ。同じサリンだった。"}, {"t": 694.95, "x": "ここで初めて、「個人が家で作った」という\n筋書きが成り立たなくなる。"}, {"t": 699.25, "x": "都心の地下鉄で、朝の通勤時間に、\n複数の路線で同時に。"}, {"t": 703.3833333333333, "x": "一人でできることではない。"}, {"t": 704.9833333333333, "x": "3月に教団の施設への一斉捜索が\n始まり、5月に教団の代表が逮捕された。"}, {"t": 710.3666666666667, "x": "白書には、こう書かれている。"}, {"t": 712.2166666666667, "x": "「松本市内における毒物使用多数殺人事件は、\nオウム真理教関係者による犯行である疑いが強まった」"}, {"t": 718.9, "x": "つまり、松本の事件の見方が変わったのは、\n東京で人が死んだあとだった。"}, {"t": 724.2, "x": "ここで、もう一つ記録を出す。"}, {"t": 726.25, "x": "同じ警察白書の中に、独立した\n項目として置かれている話だ。"}, {"t": 730.7166666666667, "x": "見出しはこうだ。「山梨県上九一色村に\nおけるサリン分解容疑物質の検出事案」"}, {"t": 735.9666666666667, "x": "本文を読む。"}, {"t": 736.9166666666666, "x": "「六年七月九日午前一時ころ、\n山梨県上九一色村の住民から\n『異臭がする』との通報がなされた」"}, {"t": 744.05, "x": "六年七月って、松本の……。"}, {"t": 746.3833333333333, "x": "松本の事件の、12日後だ。"}, {"t": 748.65, "x": "続きを読む。"}, {"t": 749.55, "x": "「当時、原因の解明には至らなかったが、その後、"}, {"t": 752.6166666666667, "x": "科学警察研究所が\n現場周辺の土砂の鑑定を行った結果、」"}, {"t": 756.7833333333333, "x": "「土砂の中から、サリンが分解した際にも\n発生する有機リン系物質が検出された」"}, {"t": 762.0833333333334, "x": "白書は、この件を松本の事件と並べて載せている。"}, {"t": 765.45, "x": "1995年5月24日の参議院本会議で、\nこの時間の流れが問われている。"}, {"t": 770.9166666666666, "x": "土を採ったのが9月。"}, {"t": 772.2666666666667, "x": "鑑定の結果が出たのが11月。"}, {"t": 774.5666666666667, "x": "質問した議員は、遅すぎるのではないかと問うた。"}, {"t": 777.65, "x": "答えたのは、自治大臣で\n国家公安委員長だった野中広務さんだ。"}, {"t": 781.8333333333334, "x": "「警察といたしましては、当時、"}, {"t": 783.75, "x": "犯罪の具体的な容疑を間擬するに\n至らなかったものと承知をいたしております」"}, {"t": 788.4333333333333, "x": "間擬というのは、疑いをかけるという\n意味の古い言い方だ。"}, {"t": 791.7666666666667, "x": "続けてこう答えている。"}, {"t": 793.2666666666667, "x": "「今日の事態になりますと、なぜ昨年のあの時期に"}, {"t": 796.0666666666667, "x": "強制捜査に\n入らなかったのかとの御指摘もございましょうが、」"}, {"t": 806.0, "x": "私はこの答弁を責めるつもりはない。"}, {"t": 808.2833333333333, "x": "後から見れば全部つながって見える。\nそれは、後から見ているからだ。"}, {"t": 812.8833333333333, "x": "ここからは、国会の記録を見ていく。"}, {"t": 815.2166666666667, "x": "この番組でいつも使っている、\n国会会議録検索システムだ。"}, {"t": 819.2333333333333, "x": "明治からの国会のやりとりが、そのまま無料で読める。"}, {"t": 822.4833333333333, "x": "この回のいちばん大事な一文は、\n1995年5月24日、参議院の本会議にある。"}, {"t": 828.55, "x": "事件が起きてから、まだ11か月しかたっていない。"}, {"t": 831.85, "x": "そんなに早く？"}, {"t": 833.05, "x": "ああ。しかも、この時点では捜査がまだ続いている。"}, {"t": 836.1833333333333, "x": "質問に立ったのは、日本共産党の橋本敦議員だ。"}, {"t": 839.9, "x": "読む。"}, {"t": 840.4, "x": "「九四年六月の松本事件では、\n化学の基礎知識がありさえすれば、」"}, {"t": 844.9166666666666, "x": "「身の安全を守る装置もないところで\n危険きわまるサリンの製造や実験など」"}, {"t": 849.3333333333334, "x": "「考えられもしないことはたちどころに\n明白であったはずでありますが、」"}, {"t": 853.2, "x": "「被害者である第一通報者の河野さんを警察は\nあえて容疑者と想定して追及し続けるという、」"}, {"t": 858.7166666666667, "x": "「とんでもない\n人権侵害の見込み違い捜査を行いました」"}, {"t": 862.3333333333334, "x": "被害者である、第一通報者の。"}, {"t": 864.6166666666667, "x": "そう書いてある。1995年5月の時点でだ。"}, {"t": 868.0333333333333, "x": "この言い方の順番を、よく見てほしい。"}, {"t": 870.4, "x": "「容疑者だった人」ではない。"}, {"t": 872.0833333333334, "x": "「被害者である第一通報者」だ。"}, {"t": 874.3166666666667, "x": "国会の記録の中では、最初から\nその順番で呼ばれている。"}, {"t": 878.0166666666667, "x": "私はこの言葉の並びが、\nこの回のすべてだと思っている。"}, {"t": 882.2833333333333, "x": "さて、この質問に政府はどう答えたか。"}, {"t": 884.9, "x": "答えたのは、さっきの野中広務 国家公安委員長だ。"}, {"t": 888.5333333333333, "x": "サリンの危険性をどう認識していたか、という\n点にはこう答えている。"}, {"t": 892.5333333333333, "x": "「警察においては、多数の死傷者を出した\n松本サリン事件発生以来、」"}, {"t": 896.8333333333334, "x": "「サリンの危険性について重大な関心を持って\n捜査を進めてきたところと承知をいたしております」"}, {"t": 902.5666666666667, "x": "それで、通報した人のことは？"}, {"t": 904.75, "x": "この日の答弁には、出てこない。"}, {"t": 906.75, "x": "上九一色村のことには答えている。"}, {"t": 908.8666666666667, "x": "サリンの認識にも答えている。"}, {"t": 910.85, "x": "だが、河野さんを容疑者と想定した\n捜査については、この日は触れていない。"}, {"t": 915.3833333333333, "x": "……そのまま？"}, {"t": 916.3, "x": "いや、そのままではない。"}, {"t": 917.7666666666667, "x": "ここが、この回でいちばん大事なところだ。"}, {"t": 920.35, "x": "この半年後から、政府の側の言葉が変わっていく。"}, {"t": 924.2333333333333, "x": "謝罪の記録を、順番に並べる。"}, {"t": 926.4833333333333, "x": "全部、公の記録に残っているものだけだ。"}, {"t": 929.35, "x": "一つ目。1995年6月11日。"}, {"t": 932.7, "x": "地元の松本警察署長が、\n河野さんに遺憾の意を伝えた。"}, {"t": 936.5333333333333, "x": "二つ目。同じ月の6月27日。"}, {"t": 939.4, "x": "長野県警察本部長が、県議会で「まことに\n申しわけなく存じている」と述べた。"}, {"t": 944.8, "x": "事件のちょうど1年後ね。"}, {"t": 946.5833333333334, "x": "ああ。この2件は、後で\n国会答弁の中で確認されている。"}, {"t": 950.4, "x": "三つ目。1995年11月28日。"}, {"t": 953.8666666666667, "x": "衆議院の、宗教法人に関する特別委員会。"}, {"t": 957.1166666666667, "x": "自治大臣で国家公安委員長だった\n深谷隆司さんが、こう述べている。"}, {"t": 961.3166666666667, "x": "「河野さんの疑惑というのが\nひとり歩きをしてしまった、"}, {"t": 964.2166666666667, "x": "結果において御迷惑をおかけしてまことに申し訳ない」"}, {"t": 967.4333333333333, "x": "四つ目。1996年5月22日。参議院の本会議。"}, {"t": 972.05, "x": "自治大臣で国家公安委員長だった\n倉田寛之さんの答弁だ。"}, {"t": 975.95, "x": "「第一通報者に対して御心労を\nおかけしたことにつきましては、"}, {"t": 979.55, "x": "大変申しわけなく感じている次第であります」"}, {"t": 982.4166666666666, "x": "五つ目。その翌日、1996年5月23日。"}, {"t": 986.6166666666667, "x": "参議院の地方行政委員会。"}, {"t": 988.55, "x": "さっき読んだ、\n警察庁刑事局長の野田健さんの答弁だ。"}, {"t": 992.4666666666667, "x": "「この過程において、"}, {"t": 993.5166666666667, "x": "河野さんに対して御迷惑をおかけすることになった\n点については申しわけないことと考えております」"}, {"t": 999.2333333333333, "x": "六つ目。1998年5月20日。"}, {"t": 1002.2, "x": "衆議院の法務委員会。"}, {"t": 1003.75, "x": "警察庁刑事局長だった\n佐藤英彦さんが、こう述べている。"}, {"t": 1007.6166666666667, "x": "「第一通報者である河野さんに対しまして、"}, {"t": 1010.1166666666667, "x": "多大な心労と迷惑をかけることになったことに\n対して申しわけなく思う」"}, {"t": 1014.6, "x": "ちゃんと謝ってはいるのね。"}, {"t": 1016.3166666666667, "x": "ああ。ここは、はっきり言っておく必要がある。"}, {"t": 1018.9666666666667, "x": "警察の側は謝っていない、という\n言われ方をすることがある。"}, {"t": 1022.4833333333333, "x": "だが記録の上では、署長も、県警本部長も、\n大臣も、刑事局長も、公の場で謝っている。"}, {"t": 1028.9833333333333, "x": "これは事実として、そのまま伝える。"}, {"t": 1031.3666666666666, "x": "日付をもう一度並べる。"}, {"t": 1032.95, "x": "1995年6月11日、松本警察署長。"}, {"t": 1036.9833333333333, "x": "1995年6月27日、長野県警察本部長。"}, {"t": 1041.4333333333334, "x": "1995年11月28日、国家公安委員長。"}, {"t": 1045.6166666666666, "x": "1996年5月22日と23日、\n国家公安委員長と警察庁刑事局長。"}, {"t": 1051.7666666666667, "x": "1998年5月20日、警察庁刑事局長。"}, {"t": 1055.7166666666667, "x": "地下鉄の事件が1995年3月20日だ。"}, {"t": 1059.2666666666667, "x": "最初の遺憾の意が示されたのは、\nその約3か月後になる。"}, {"t": 1063.0666666666666, "x": "一年近く疑われて、そのあと3か月。"}, {"t": 1066.05, "x": "ああ。"}, {"t": 1066.4666666666667, "x": "そして、いちばん最後の1998年の答弁まで、\n4年近くかかっている。"}, {"t": 1071.7333333333333, "x": "同じ趣旨の言葉が、4年にわたって\n国会で繰り返されたということだ。"}, {"t": 1076.0333333333333, "x": "それだけ、この件が何度も\n質されたということでもある。"}, {"t": 1079.95, "x": "ただし、その謝罪には、はっきりした形がある。"}, {"t": 1083.05, "x": "もう一度、\n1996年5月23日の答弁の最初の一文を読む。"}, {"t": 1088.1333333333334, "x": "「松本サリン事件の捜査につきましては、法令の許す\n範囲内において適法に実施したものであります」"}, {"t": 1094.3666666666666, "x": "適法。"}, {"t": 1095.1833333333334, "x": "そう言っている。"}, {"t": 1096.1, "x": "そのうえで、続く部分で謝っている。"}, {"t": 1098.4, "x": "「河野さんに対して御迷惑をおかけすることになった\n点については申しわけない」"}, {"t": 1102.7666666666667, "x": "つまり、謝っているのは「ご迷惑をおかけした点」だ。"}, {"t": 1106.1833333333334, "x": "捜査そのものが間違いだった、という\n言い方はしていない。"}, {"t": 1109.4666666666667, "x": "ほかの答弁も同じ形だ。"}, {"t": 1111.3333333333333, "x": "「御心労をおかけした」「多大な\n心労と迷惑をかけることになった」"}, {"t": 1115.2166666666667, "x": "どれも、結果として本人が\n苦しんだことについて謝っている。"}, {"t": 1119.1, "x": "やり方は間違ってなかった、ってこと？"}, {"t": 1121.6, "x": "政府の説明としては、そうなる。"}, {"t": 1123.7833333333333, "x": "私はこれを「不誠実だ」と決めつけるつもりはない。"}, {"t": 1127.15, "x": "令状は裁判官が出している。"}, {"t": 1128.8666666666666, "x": "手続きの上では、確かに違法ではない。"}, {"t": 1131.35, "x": "ただ、この形には、ひとつ落ちるものがある。"}, {"t": 1134.2, "x": "手続きが全部合っていても、人は追い詰められる。"}, {"t": 1137.1333333333334, "x": "そのとき、誰が何をやり直せばいいのかが、\nこの形では決まらない。"}, {"t": 1141.2666666666667, "x": "それが、この回で私がいちばん引っかかったところだ。"}, {"t": 1144.5333333333333, "x": "もう一つ、記録の上ではっきりしていることがある。"}, {"t": 1147.5166666666667, "x": "家宅捜索も、事情の聴取も、警察がやったことだ。"}, {"t": 1151.15, "x": "だが、名前と顔を全国に出したのは、報道だ。"}, {"t": 1154.3, "x": "この二つは、別の話として分けて見ないといけない。"}, {"t": 1157.5833333333333, "x": "警察の側は、国会で謝罪を述べている。\nここまで見てきたとおりだ。"}, {"t": 1161.7166666666667, "x": "では、報道の側はどうだったのか。"}, {"t": 1164.0166666666667, "x": "そっちは？"}, {"t": 1164.8666666666666, "x": "それが、次からの話になる。"}, {"t": 1167.5333333333333, "x": "次は、報道の側の話だ。"}, {"t": 1169.6, "x": "1997年1月24日、参議院の本会議。"}, {"t": 1173.6333333333334, "x": "質問に立った大久保直彦議員が、こう切り出している。"}, {"t": 1177.0166666666667, "x": "「私は先日、『松本サリン事件報道の罪と罰』という\n本を読みました」"}, {"t": 1181.7833333333333, "x": "これは、河野さん本人と、新聞記者だった\n研究者が一緒に出した本だ。"}, {"t": 1186.4166666666667, "x": "この議員は、本の中の言葉を国会で読み上げた。"}, {"t": 1189.5333333333333, "x": "「松本サリン事件の被害者でありながら犯人に\n仕立てられた河野義行さんは、その本の中で、」"}, {"t": 1195.3, "x": "「一般市民が報道被害に遭った場合、報道の嵐が\n過ぎ去るまで、息を潜めてただ待つことしか出来ない」"}, {"t": 1201.5833333333333, "x": "「また、仮に裁判で勝てたとしても得られるものは\nわずかである、と述べております」"}, {"t": 1206.2833333333333, "x": "息を潜めて、待つことしかできない。"}, {"t": 1208.7833333333333, "x": "本人の言葉だ。"}, {"t": 1210.0166666666667, "x": "この議員は続けてこう言っている。"}, {"t": 1211.9333333333334, "x": "「さらに、報道がまるで凶器となって河野さんを\n襲ったことが切々と述べられております」"}, {"t": 1217.0333333333333, "x": "「河野さんの人権を傷つけ名誉を\n踏みにじった一部週刊誌を初め、"}, {"t": 1220.9166666666667, "x": "各報道メディアの反省も極めて\n不十分であると指摘されております」"}, {"t": 1225.0666666666666, "x": "そして、外国の例を並べた。"}, {"t": 1227.15, "x": "前の年、アトランタでオリンピックが開かれた。"}, {"t": 1229.9833333333333, "x": "その会場の近くで、爆破事件が起きた。"}, {"t": 1232.75, "x": "このとき、犯人ではないかと報じられた人がいた。"}, {"t": 1235.8666666666666, "x": "疑いが晴れたあと、アメリカの大きな放送局が、\nその人に和解金を払ったと報じられている。"}, {"t": 1241.65, "x": "議員が挙げた額は、50万ドル。"}, {"t": 1243.6333333333334, "x": "当時の日本円で5,800万円を超える。"}, {"t": 1246.4833333333333, "x": "日本では？"}, {"t": 1247.4166666666667, "x": "それが、この質問のねらいだ。"}, {"t": 1249.4166666666667, "x": "「個人の人権や名誉毀損について日本と\nアメリカでは余りにも意識に違いがあり過ぎます」"}, {"t": 1254.5833333333333, "x": "「我が国では人権に対する認識が\nまことに軽く扱われております」"}, {"t": 1258.7666666666667, "x": "そのうえで、報道による被害から人を守る\n仕組みを作ってはどうか、と提案している。"}, {"t": 1263.7833333333333, "x": "報道評議会、という言葉が使われている。"}, {"t": 1267.0666666666666, "x": "答えたのは、当時の総理大臣、橋本龍太郎さんだ。"}, {"t": 1270.6166666666666, "x": "まずこう言っている。"}, {"t": 1271.7, "x": "「御指摘のように、報道の場面で人権に\n関し問題が発生するケースもありますが、」"}, {"t": 1276.7, "x": "「個人の人権がより一層"}, {"t": 1278.35, "x": "尊重される社会の実現を目指して\n今後とも人権擁護の施策を\n推進してまいりたいと考えております」"}, {"t": 1284.3, "x": "そして、提案された仕組みについては、こう答えた。"}, {"t": 1287.4666666666667, "x": "「この種の問題は、本来、報道の自由、"}, {"t": 1290.0333333333333, "x": "表現の自由と人権の保護、保障との調整に\n関する問題でありますし、」"}, {"t": 1294.5833333333333, "x": "「公的な機関が関与する形よりは、"}, {"t": 1296.85, "x": "マスコミ自身が自主的に取り組まれ、良識を\n持った取り扱いをなされることが望ましい」"}, {"t": 1302.1833333333334, "x": "国は作らない、ということ？"}, {"t": 1304.1333333333334, "x": "政府としては作らない、という答えだ。"}, {"t": 1306.5333333333333, "x": "私は、この答えが間違いだったとは言わない。"}, {"t": 1309.3333333333333, "x": "国が報道の中身に口を出す仕組みには、\n別の危うさがある。それは本当だ。"}, {"t": 1314.1, "x": "ただ、ここで話が一度止まったのは事実だ。"}, {"t": 1317.0166666666667, "x": "それから3年半後、\n2000年9月27日の参議院本会議で、\n同じ話がもう一度出てくる。"}, {"t": 1323.3333333333333, "x": "白浜一良議員が、こう言っている。"}, {"t": 1325.6666666666667, "x": "「松本サリン事件の河野義行さんは、御自身が\n受けられた報道被害に立ち向かい、」"}, {"t": 1330.6666666666667, "x": "「壮絶な人権闘争を展開されたことは\n周知のことであります」"}, {"t": 1334.5166666666667, "x": "「報道被害を受けた人の無力感と怒り、命を\n削るような苦痛と絶望はいかばかりでありましょうか」"}, {"t": 1340.35, "x": "そして、こう聞いた。"}, {"t": 1341.7333333333333, "x": "「報道する側が責任感とモラルを持つことは"}, {"t": 1344.0666666666666, "x": "当然でありますが、もはやそれだけでは\n不十分な状況ではないでしょうか」"}, {"t": 1348.4166666666667, "x": "答えたのは、当時の総理大臣、森喜朗さんだ。"}, {"t": 1351.6333333333334, "x": "「個人といたしましては、白浜議員のお考えと\n私は同じ考えを持つものでありますが、」"}, {"t": 1356.9166666666667, "x": "「政府といたしましては……乱訴の\nおそれがないかなどの問題があり、」"}, {"t": 1360.6333333333334, "x": "「その導入に関しましては、"}, {"t": 1362.2166666666667, "x": "関係各方面での十分なる検討の状況をも見ながら、\n慎重に考えていくべきものであると考えております」"}, {"t": 1368.9666666666667, "x": "個人としては同じ考え？"}, {"t": 1370.8, "x": "そう言っている。"}, {"t": 1371.7333333333333, "x": "1997年と2000年で、質問した議員は別の党の人だ。"}, {"t": 1376.3833333333334, "x": "それでも、返ってきた答えの形は、\nほとんど同じだった。"}, {"t": 1380.7, "x": "そのあと、この人の名前は、国会である\n特別な使われ方をするようになる。"}, {"t": 1385.45, "x": "1999年8月4日、参議院法務委員会の公聴会。"}, {"t": 1389.9, "x": "公聴会というのは、法律を作るときに、\n国会が外の人を呼んで意見を聞く場だ。"}, {"t": 1395.0166666666667, "x": "発言は全部、議事録に残る。"}, {"t": 1397.1666666666667, "x": "この日、評論家の佐高信さんが、こう述べている。"}, {"t": 1400.4833333333333, "x": "「では、松本サリン事件の河野義行さんという\n人は悪いことをやっていたのか」"}, {"t": 1405.1833333333334, "x": "「松本サリン事件の河野義行さんというのは、"}, {"t": 1407.9166666666667, "x": "警察が勝手に犯人と決め込んで、\nそして河野さんをあそこまで追い込んでいった」"}, {"t": 1412.65, "x": "そのうえで、この人はこう言っている。"}, {"t": 1414.8, "x": "「緒方事件と河野事件というものをきちっと\n警察なり政府なりが釈明、答弁しなければ」"}, {"t": 1420.2333333333333, "x": "河野事件？"}, {"t": 1421.2166666666667, "x": "ああ。事件の名前として使われている。"}, {"t": 1423.6166666666666, "x": "この日、この人は「河野事件」という\n言葉を3回使った。"}, {"t": 1427.5166666666667, "x": "同じ日、質問した議員がこういう言い方もしている。"}, {"t": 1430.6666666666667, "x": "「すべての人を河野さん\n状態にするものであるとおっしゃいましたから」"}, {"t": 1434.4666666666667, "x": "河野さん状態。"}, {"t": 1435.7166666666667, "x": "1999年の国会では、それで通じたということだ。"}, {"t": 1439.6666666666667, "x": "同じ年の11月30日、参議院の法務委員会。"}, {"t": 1443.25, "x": "呼ばれた参考人の一人が、\nあの捜索についてこう説明している。"}, {"t": 1447.2833333333333, "x": "「河野義行さんに対する家宅捜索というのは、"}, {"t": 1450.1, "x": "昔七〇年前後の公安事件で使われた\n被疑者不詳のままの家宅捜索なんです」"}, {"t": 1455.35, "x": "「河野さんは被疑者でもないのに捜索された」"}, {"t": 1457.9333333333334, "x": "この参考人が言っているのは、こういうことだ。"}, {"t": 1460.65, "x": "かつて、政治がらみの事件のためにだけ\n使われていたやり方が、"}, {"t": 1464.5166666666667, "x": "20年たって、ふつうに暮らしていた\n一般の市民に向けられた。"}, {"t": 1468.3, "x": "ここで一つ、はっきりさせておく。"}, {"t": 1470.4666666666667, "x": "この公聴会と委員会は、それぞれ\n別の法律について開かれたものだ。"}, {"t": 1474.8166666666666, "x": "その法律に賛成か反対かは、この動画の話ではない。"}, {"t": 1478.3, "x": "私はどちらの立場も取らない。"}, {"t": 1480.35, "x": "私が言いたいのは一つだけだ。"}, {"t": 1482.35, "x": "制度の是非を論じるとき、「これをやると、\nあの人と同じことが起きる」という物差しとして、"}, {"t": 1487.6833333333334, "x": "一人の被害者の名前が使われるようになった。"}, {"t": 1490.5, "x": "本人が望んで、そうなったわけではない。"}, {"t": 1493.6, "x": "では、その本人は何をしていたのか。"}, {"t": 1496.0166666666667, "x": "疑いが晴れたあと、この人がやったことを、\n記録に残っているものだけ並べる。"}, {"t": 1500.7166666666667, "x": "1995年11月、本を出している。"}, {"t": 1503.75, "x": "題名は『「疑惑」は晴れようとも』。"}, {"t": 1506.0333333333333, "x": "翌年には、\nさっきの『松本サリン事件報道の罪と罰』が出ている。"}, {"t": 1510.65, "x": "同じころ、自分の潔白を示して名誉を\n取り戻すために、二つのことをしている。"}, {"t": 1515.6333333333334, "x": "一つは、日本弁護士連合会の人権擁護委員会に、\n人権を救ってほしいと申し立てたこと。"}, {"t": 1521.6166666666666, "x": "もう一つは、地元の新聞社を相手に、\n民事の裁判を起こしたことだ。"}, {"t": 1526.15, "x": "裁判も。"}, {"t": 1527.0666666666666, "x": "ああ。ただし、その裁判がどうなったかまでは、\n私は確かめられていない。"}, {"t": 1531.4666666666667, "x": "だから、起こしたという事実だけを言う。"}, {"t": 1533.8166666666666, "x": "そして2002年、この人は\n長野県の公安委員会の委員になっている。"}, {"t": 1538.1833333333334, "x": "公安委員会？"}, {"t": 1539.2833333333333, "x": "県の警察を監督する立場だ。"}, {"t": 1541.4833333333333, "x": "つまり、自分を疑った側の組織を、外から見張る役だ。"}, {"t": 1545.2666666666667, "x": "1期、3年務めている。"}, {"t": 1547.1166666666666, "x": "それから、1999年の国会には\nこういう記録も残っている。"}, {"t": 1551.55, "x": "さっきの参考人が、\n河野さんの当時の考えを紹介した部分だ。"}, {"t": 1555.6166666666666, "x": "「河野義行さんは被害者でありながら、オウムの人にも\n適正手続とか人権をきちんと認めてあげたい、」"}, {"t": 1561.8, "x": "「裁判の行方をきちんと見守ってもらいたい、と」"}, {"t": 1564.75, "x": "……自分の家族を奪った側にも？"}, {"t": 1566.8, "x": "ああ。"}, {"t": 1567.2333333333333, "x": "さらに、当時、教団の財産を被害者の賠償に\n回すための法律が国会で審議されていた。"}, {"t": 1572.95, "x": "河野さんは、この法律に反対だと\n述べていたと、同じ参考人が紹介している。"}, {"t": 1577.95, "x": "理由は、記録によればこうだ。"}, {"t": 1579.8166666666666, "x": "期限を切った法律にしないのは、ほかの団体にも\n使えるようにしたいからではないか。"}, {"t": 1584.6833333333334, "x": "そして、犯罪の被害者を助けるなら、まず公の資金で、"}, {"t": 1588.5666666666666, "x": "お金の面と心の面の両方を支える\n仕組みを作るほうが先だ、と。"}, {"t": 1592.9, "x": "自分が被害者なのに。"}, {"t": 1594.5166666666667, "x": "ああ。自分の取り分が増える話のほうを、断っている。"}, {"t": 1597.8833333333334, "x": "私は、この立場が正しいかどうかを決めない。"}, {"t": 1600.75, "x": "ただ、疑われた1年を過ごした人がここに\n立っている、ということだけは言っておきたい。"}, {"t": 1606.4333333333334, "x": "ここで、制度の話をしておく。"}, {"t": 1608.5, "x": "この事件のあと、二つの方向で仕組みができている。"}, {"t": 1611.7166666666667, "x": "一つ目は、毒物のほうだ。"}, {"t": 1613.65, "x": "サリン等による人身被害の防止に関する法律。"}, {"t": 1616.5833333333333, "x": "平成7年、法律第78号。"}, {"t": 1619.2333333333333, "x": "1995年4月19日に成立し、4月21日に公布された。"}, {"t": 1624.3333333333333, "x": "罰則の部分だけは10日おいて、\n5月1日から動きだしている。"}, {"t": 1628.3166666666666, "x": "長い名前だが、中身は単純だ。"}, {"t": 1630.6, "x": "サリンなどを作ること、持つこと、\nまくことを、それ自体で罪にした。"}, {"t": 1635.0, "x": "それまでは？"}, {"t": 1635.9333333333334, "x": "それまでは、まいて人が死んで\n初めて罪に問える形だった。"}, {"t": 1639.6833333333334, "x": "さらに、役所の垣根を越えて\n動くための集まりも作られている。"}, {"t": 1643.55, "x": "1995年5月24日の参議院本会議で、\n国家公安委員長がこう報告している。"}, {"t": 1649.5166666666667, "x": "「サリンを使用した犯罪を有効に\n取り締まるため、国会の深い御理解により、」"}, {"t": 1654.0, "x": "「早期にサリン等による人身被害の防止に関する\n法律を成立をさせていただいたところであります」"}, {"t": 1659.6833333333334, "x": "「サリン使用犯罪の再発を防止するとともに、"}, {"t": 1662.3333333333333, "x": "サリン使用犯罪が発生した\n場合の迅速的確な措置を講ずるために」"}, {"t": 1666.75, "x": "「設置されました\nサリン問題対策関係省庁連絡会議を中心に」"}, {"t": 1670.9833333333333, "x": "どちらも1995年だ。"}, {"t": 1673.0, "x": "松本で人が亡くなった\n1994年6月には、まだ無かった。"}, {"t": 1677.6666666666667, "x": "二つ目は、報道のほうだ。"}, {"t": 1679.4833333333333, "x": "放送局の団体が出している資料に、\nこの流れが年表として載っている。"}, {"t": 1683.9, "x": "そこには、こう書かれている。"}, {"t": 1685.6333333333334, "x": "「1994年6月、松本サリン事件で、新聞・放送など\n各社は第一通報者を容疑者であるかのように報道」"}, {"t": 1693.2333333333333, "x": "「これが重大な誤りであることが判明し、\n政府・捜査当局とマスコミ各社は\n報道被害者として同氏に謝罪」"}, {"t": 1700.1, "x": "業界の側の年表に、そう書いてあるの？"}, {"t": 1702.8333333333333, "x": "ああ。放送の第三者機関の歴史を\n振り返る年表の、いちばん最初がこれだ。"}, {"t": 1707.6333333333334, "x": "そのあとの流れも同じ年表に書いてある。"}, {"t": 1710.1333333333334, "x": "1996年12月、苦情に対応する機関を\n作るかどうかの報告書が出た。"}, {"t": 1715.5833333333333, "x": "1997年6月、放送局側が「放送と人権等権利に\n関する委員会」という仕組みを作った。"}, {"t": 1722.7666666666667, "x": "そして2003年7月、それが\n今の「放送倫理・番組向上機構」になっている。"}, {"t": 1728.3166666666666, "x": "略して、BPOと呼ばれているものだ。"}, {"t": 1730.7666666666667, "x": "視聴者からの苦情を受けて、\n放送の中身を審理する第三者の機関だ。"}, {"t": 1735.2833333333333, "x": "あの1年から始まってるのね。"}, {"t": 1737.3333333333333, "x": "業界自身が、そう記録している。"}, {"t": 1740.2, "x": "ここからは、この回のまとめに入る。"}, {"t": 1742.5, "x": "あの事件から、30年以上がたった。"}, {"t": 1744.9833333333333, "x": "変わったものと、変わっていないものを、\n記録で確かめられる範囲だけ並べる。"}, {"t": 1749.4166666666667, "x": "まず、変わったもの。"}, {"t": 1750.7833333333333, "x": "サリンを作ること自体が罪になった。"}, {"t": 1752.9333333333334, "x": "役所をまたいで動く仕組みができた。"}, {"t": 1755.1833333333334, "x": "放送については、苦情を受けて\n審理する第三者の機関ができた。"}, {"t": 1759.1166666666666, "x": "そして、疑われた段階の人をどう\n扱うかについて、報道の側で議論が起きた。"}, {"t": 1764.1666666666667, "x": "新聞の業界団体も、2001年に、\n取材のやり方についての見解を出している。"}, {"t": 1769.4166666666667, "x": "「いやがる当事者や関係者を集団で強引に\n包囲した状態での取材は行うべきではない」"}, {"t": 1774.45, "x": "ただし、この見解の中に\n松本サリン事件の名前は出てこない。"}, {"t": 1778.2333333333333, "x": "事件名を挙げずに書かれている。"}, {"t": 1780.2833333333333, "x": "名前は出さないのね。"}, {"t": 1781.75, "x": "ああ。だから私も\n「この事件のためにできた」とは言わない。"}, {"t": 1785.2833333333333, "x": "事実だけ置いておく。"}, {"t": 1786.6833333333334, "x": "では、変わっていないものは何か。"}, {"t": 1788.75, "x": "一つ目。報道でひどい目に遭った人を、\n国の制度として救う仕組みは、いまも無い。"}, {"t": 1793.8333333333333, "x": "1997年に総理が「マスコミ自身が自主的に」と答え、"}, {"t": 1798.4, "x": "2000年に別の総理が\n「慎重に考えていくべき」と答えた。"}, {"t": 1802.4166666666667, "x": "その先で答えが変わった\n記録を、私は見つけていない。"}, {"t": 1805.8833333333334, "x": "二つ目。疑われた人が、そのあと\nどうやって生活を取り戻すのか。"}, {"t": 1810.2333333333333, "x": "これについての公の仕組みも、無い。"}, {"t": 1812.5333333333333, "x": "裁判にかけられて無罪になった\n人には、国が補償する制度がある。"}, {"t": 1816.5666666666666, "x": "だが、起訴もされず、報道と捜索だけを\n受けた人は、その外にいる。"}, {"t": 1821.1166666666666, "x": "河野さんは起訴されてない。"}, {"t": 1822.85, "x": "ああ。だから、この制度には最初から当てはまらない。"}, {"t": 1826.5166666666667, "x": "ここからは私の見方だ。"}, {"t": 1828.1, "x": "事実と分けて聞いてほしい。"}, {"t": 1829.8333333333333, "x": "三つある。"}, {"t": 1830.6, "x": "一つ目。なぜ最初の通報者が\n疑われたのか、という問いだ。"}, {"t": 1834.4666666666667, "x": "いちばん近くにいた人が、いちばん\n最初に気づく。だから最初に通報する。"}, {"t": 1839.0666666666666, "x": "それは当たり前のことだ。"}, {"t": 1840.6, "x": "一方で、捜査はいちばん近くにいた人から見ていく。\nそれも、やり方としては当たり前だ。"}, {"t": 1846.1166666666666, "x": "この二つの当たり前が重なる\n場所に、この人が立っていた。"}, {"t": 1849.8666666666666, "x": "仕組みの問題？"}, {"t": 1851.0833333333333, "x": "私はそう思っている。"}, {"t": 1852.3666666666666, "x": "誰か一人が意地悪をした、という話ではないと思う。"}, {"t": 1855.6833333333334, "x": "だから、同じことはまた起きうる。"}, {"t": 1857.75, "x": "二つ目。「適法だが、\n迷惑をかけた」という形についてだ。"}, {"t": 1861.8, "x": "さっき読んだとおり、政府の説明は一貫している。"}, {"t": 1864.8166666666666, "x": "手続きは適法だった。"}, {"t": 1866.25, "x": "結果として心労をかけたことは申し訳ない。"}, {"t": 1869.0, "x": "この形だと、誰も嘘をついていないのに、\n誰も間違えたことにならない。"}, {"t": 1873.4333333333334, "x": "私はそこが引っかかる。"}, {"t": 1875.05, "x": "ただ、では代わりにどうすればいいのかと\n聞かれると、私にも答えは無い。"}, {"t": 1879.25, "x": "令状は裁判官が出している。"}, {"t": 1880.9666666666667, "x": "現場の判断だけの話でもない。"}, {"t": 1883.1666666666667, "x": "これは私の中でも、まだ答えが出ていない。"}, {"t": 1885.9333333333334, "x": "三つ目。この番組そのものについてだ。"}, {"t": 1888.4833333333333, "x": "私はここで、事件の解説をしている。"}, {"t": 1891.1, "x": "解説というのは、まだ分かっていないことに\n言葉を与える仕事でもある。"}, {"t": 1895.1833333333334, "x": "1994年の夏、それをやったのが当時の報道だった。"}, {"t": 1899.2166666666667, "x": "だから私は、この回を作りながらずっと、\n自分がやっていることと同じだと思っていた。"}, {"t": 1904.5833333333333, "x": "同じ？"}, {"t": 1905.2666666666667, "x": "違うのは、私が扱っているのが、\nもう終わった事件だということだけだ。"}, {"t": 1909.65, "x": "終わっていない事件に言葉を\n与えるのが、どれだけ危ういか。"}, {"t": 1913.0666666666666, "x": "この回は、その見本として残っていると思う。"}, {"t": 1915.9166666666667, "x": "最後に、一つだけ付け加えておく。"}, {"t": 1918.25, "x": "この回を作るとき、私は\nタイトルの付け方をずいぶん迷った。"}, {"t": 1922.0833333333333, "x": "「犯人にされた男」という\n書き方をすれば、たぶん人はもっと見る。"}, {"t": 1926.1833333333334, "x": "だが、その言い方は、この人をもう一度\n「犯人」という言葉の隣に置くことになる。"}, {"t": 1931.5666666666666, "x": "言葉の並びの話ね。"}, {"t": 1933.3166666666666, "x": "さっき見たとおりだ。"}, {"t": 1934.5666666666666, "x": "1995年の国会では「被害者である第一通報者」という\n順番で書かれていた。"}, {"t": 1940.2, "x": "どちらを先に置くかで、受け取り方はまるで変わる。"}, {"t": 1943.2, "x": "私がこの回でいちばん気をつけたのは、そこだ。"}, {"t": 1946.8333333333333, "x": "最後に、記録の話をして終わる。"}, {"t": 1949.05, "x": "この回で読んだ国会のやりとりは、全部、\n国会会議録検索システムで公開されている。"}, {"t": 1954.5666666666666, "x": "1995年5月24日の参議院本会議。"}, {"t": 1958.1333333333334, "x": "1995年11月28日の衆議院、\n宗教法人等に関する特別委員会。"}, {"t": 1964.1, "x": "1996年5月22日の参議院本会議。"}, {"t": 1967.8, "x": "1996年5月23日の参議院地方行政委員会。"}, {"t": 1972.1166666666666, "x": "1997年1月24日の参議院本会議。"}, {"t": 1975.9, "x": "1998年5月20日の衆議院法務委員会。"}, {"t": 1979.5333333333333, "x": "1999年8月4日の参議院法務委員会公聴会。"}, {"t": 1983.75, "x": "1999年11月30日の参議院法務委員会。"}, {"t": 1987.85, "x": "2000年9月27日の参議院本会議。"}, {"t": 1990.7666666666667, "x": "どなたでも無料で読める。"}, {"t": 1992.1166666666666, "x": "「松本サリン」と入れて検索すれば出てくる。"}, {"t": 1994.9, "x": "事件そのものの記録は、\n警察庁の警察白書の平成7年版にある。\nこれも無料で読める。"}, {"t": 2000.75, "x": "私がこの番組で何度も\n言っていることを、最後にもう一度言う。"}, {"t": 2004.5166666666667, "x": "記録は残る。"}, {"t": 2005.55, "x": "あの1年に何が報じられたかも残っているし、"}, {"t": 2008.35, "x": "国会で誰が何を質して、誰が\n何を答えたかも残っている。"}, {"t": 2020.1166666666666, "x": "動画で見た話が本当かどうかを、\n自分で確かめる手段がある。"}, {"t": 2024.05, "x": "よかったら、一度自分で開いてみてほしい。"}, {"t": 2026.6666666666667, "x": "この回について、あなたはどう考えるか。"}, {"t": 2029.05, "x": "コメントで聞かせてほしい。"}, {"t": 2030.6333333333334, "x": "最後まで見てくれて、ありがとう。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
