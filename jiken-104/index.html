<script>
const D={"name": "104", "file": "104_編集用", "dur": 1993.4, "segs": [], "subs": [{"t": 0.0, "x": "2007年5月3日。"}, {"t": 1.6833333333333333, "x": "ポルトガルの南の海辺の村で、3歳の子どもが、\n寝ていた部屋からいなくなった。"}, {"t": 6.6, "x": "ポルトガルの検察には、その日に\n受け付けられた番号がある。"}, {"t": 10.216666666666667, "x": "頭の3桁が、その年の何件目か。"}, {"t": 12.8, "x": "次の2桁が、2007年だ。"}, {"t": 15.266666666666667, "x": "その番号、まだ生きてるの？"}, {"t": 17.216666666666665, "x": "生きている。19年、一度も閉じていない。"}, {"t": 19.933333333333334, "x": "いなくなったのは、マデリン・マッキャンさん。"}, {"t": 22.2, "x": "イギリスの家族の、上の子だ。"}, {"t": 24.25, "x": "4歳の誕生日の、9日前だった。"}, {"t": 26.8, "x": "いまも見つかっていない。"}, {"t": 28.183333333333334, "x": "そして、この事件で起訴された\n人は、いまのところ一人もいない。"}, {"t": 32.25, "x": "一人も？"}, {"t": 33.13333333333333, "x": "一人もだ。ポルトガルでも、\nイギリスでも、ドイツでも。"}, {"t": 36.46666666666667, "x": "今回は、19年のあいだに3つの国の役所が\n実際に何をしたのかを、順番に追いかける。"}, {"t": 42.31666666666667, "x": "先に断っておく。この動画では、\n誰かを犯人だと言わない。"}, {"t": 46.11666666666667, "x": "噂も、想像も、載せない。"}, {"t": 48.15, "x": "喋るのは、警察と検察が公式に出した\n文書に書いてあることだけだ。"}, {"t": 52.583333333333336, "x": "この事件は、世界でいちばん多くの人が\n知っている行方不明の事件だと言われている。"}, {"t": 57.46666666666667, "x": "それなのに、役所が出した文書だけを\n並べると、驚くほど短くなる。"}, {"t": 61.95, "x": "その短さを、そのまま見てほしい。"}, {"t": 64.78333333333333, "x": "場所の話から始める。"}, {"t": 66.41666666666667, "x": "ポルトガルの南の端に、\nアルガルベと呼ばれる地方がある。"}, {"t": 69.76666666666667, "x": "大西洋に面していて、冬でも暖かい。"}, {"t": 72.3, "x": "ヨーロッパ中から人が休みに来る海岸だ。"}, {"t": 75.03333333333333, "x": "その中のラゴスという市の外れに、\nプライア・ダ・ルースという村がある。"}, {"t": 79.33333333333333, "x": "どれくらいの大きさ？"}, {"t": 80.73333333333333, "x": "歩いて回れる。坂道が\n何本かあるだけの、小さな村だ。"}, {"t": 84.45, "x": "崖の下に砂浜があって、\n坂の上に白い家が並んでいる。"}, {"t": 88.18333333333334, "x": "その村に、オーシャンクラブという滞在型の宿がある。"}, {"t": 91.3, "x": "プールとテニスコートがあって、部屋は\n台所つきのアパートになっている。"}, {"t": 95.3, "x": "家族連れが一週間くらい借りて\n過ごす、そういう作りだ。"}, {"t": 98.88333333333334, "x": "ホテルというより、部屋を借りる感じなのね。"}, {"t": 101.53333333333333, "x": "そうだ。そして、ここがこの事件の大事なところになる。"}, {"t": 104.98333333333333, "x": "この宿は、一つの建物ではない。"}, {"t": 107.15, "x": "道をはさんで、いくつもの棟に分かれている。"}, {"t": 109.88333333333334, "x": "2007年の春、イギリスから来た家族がここに着いた。"}, {"t": 113.41666666666667, "x": "両親と、子どもが3人。"}, {"t": 115.05, "x": "上が3歳で、下が双子の2歳だった。"}, {"t": 117.78333333333333, "x": "泊まったのは5A号室。一階の角部屋だ。"}, {"t": 120.68333333333334, "x": "一階なのね。"}, {"t": 121.83333333333333, "x": "一階だ。道路に面していて、\n寝室の窓は外の通りに向いていた。"}, {"t": 126.1, "x": "ロンドン警視庁は、後にこの部屋を、資料の中で\n「アルガルベの保養地の5A号室」と書いている。"}, {"t": 132.13333333333333, "x": "この番号が、この事件の住所のように\n使われることになる。"}, {"t": 136.31666666666666, "x": "2007年5月3日。"}, {"t": 138.0, "x": "この日の夜のことは、\nポルトガルの捜査記録に細かく残っている。"}, {"t": 142.1, "x": "捜査記録って、外から見られるものなの？"}, {"t": 144.88333333333333, "x": "この事件は、見られる。"}, {"t": 146.41666666666666, "x": "2008年に手続きがいったん終わったとき、\n記録の多くが外に出たからだ。その話は後でする。"}, {"t": 152.45, "x": "さて、その夜だ。"}, {"t": 153.76666666666668, "x": "午後8時半ごろ、両親は3人の子どもを\n寝かせて、部屋を出た。"}, {"t": 157.86666666666667, "x": "行き先は、同じ敷地の中にあるタパスの店だ。"}, {"t": 160.86666666666667, "x": "友人たちと夕食をとっていた。"}, {"t": 163.05, "x": "子どもだけ置いていったの？"}, {"t": 164.68333333333334, "x": "置いていった。"}, {"t": 165.53333333333333, "x": "宿には子どもを預かる仕組みもあったが、\nこの夜は使っていない。"}, {"t": 169.2, "x": "かわりに、大人が交代で部屋を見に\n戻る、という形をとっていた。"}, {"t": 173.2, "x": "歩いて1分ほどの距離だ。"}, {"t": 174.71666666666667, "x": "プールの向こう側に部屋がある。"}, {"t": 176.48333333333332, "x": "午後9時5分ごろ、父親が見に行った。"}, {"t": 178.76666666666668, "x": "3人とも眠っていた。"}, {"t": 180.38333333333333, "x": "午後9時半ごろ、友人の一人が様子を見ている。"}, {"t": 183.38333333333333, "x": "そして午後10時ごろ、母親が見に行った。"}, {"t": 185.81666666666666, "x": "……。"}, {"t": 186.75, "x": "上の子がいなかった。"}, {"t": 188.05, "x": "双子の2人は、簡易ベッドで眠ったままだった。"}, {"t": 191.16666666666666, "x": "その子だけ、いなくなってたの？"}, {"t": 193.28333333333333, "x": "その子だけだ。"}, {"t": 194.31666666666666, "x": "母親は、寝室の窓とよろい戸が\n開いていた、と話している。"}, {"t": 198.23333333333332, "x": "ただし、ポルトガルの警察は、\nこじ開けた跡を見つけていない。"}, {"t": 202.0, "x": "跡が無い。"}, {"t": 202.86666666666667, "x": "無い。ここは、後で大きな意味を持つことになる。"}, {"t": 205.73333333333332, "x": "ドイツの捜査当局は、のちに\n犯行の時刻をこう推定している。"}, {"t": 209.66666666666666, "x": "午後9時10分から午後10時までのあいだ。"}, {"t": 212.06666666666666, "x": "父親が見に行ってから、\n母親が見に行くまでの、50分だ。"}, {"t": 216.46666666666667, "x": "午後10時ごろ、店に知らせが走った。"}, {"t": 218.91666666666666, "x": "宿の従業員と、泊まっていた客が、\n手分けして敷地を探し始めた。"}, {"t": 223.45, "x": "警察は？"}, {"t": 224.38333333333333, "x": "呼ばれている。ただ、村に警察署は無い。"}, {"t": 227.01666666666668, "x": "ポルトガルには二つの警察がある。"}, {"t": 229.01666666666668, "x": "制服で町を回る国家共和警備隊と、\n事件を捜査する司法警察だ。"}, {"t": 233.78333333333333, "x": "最初に来たのは、共和警備隊のほうだった。"}, {"t": 236.55, "x": "捜査を担当する司法警察が現場に\n入るのは、そのあとになる。"}, {"t": 240.61666666666667, "x": "その間、部屋はどうなってたの？"}, {"t": 242.78333333333333, "x": "人が出入りしていた。"}, {"t": 244.1, "x": "家族、友人、宿の従業員、近所の人。"}, {"t": 247.0, "x": "探すために、みんなが中に入った。"}, {"t": 249.6, "x": "……あ。"}, {"t": 250.05, "x": "そうだ。指紋も、足跡も、混ざる。"}, {"t": 252.6, "x": "後になって、この最初の数時間が\n何度も問題にされることになる。"}, {"t": 256.71666666666664, "x": "ただ、その場にいた人たちを責める話ではない。"}, {"t": 259.68333333333334, "x": "3歳の子がいない。まず探す。\nそれは当たり前のことだ。"}, {"t": 263.18333333333334, "x": "問題は、村の側に、そういうときの仕組みが\n用意されていなかったことのほうだ。"}, {"t": 267.8333333333333, "x": "それと、もう一つ。この村は、国境から遠くない。"}, {"t": 271.23333333333335, "x": "ヨーロッパの中は、シェンゲン協定という決まりで、\nパスポートを見せずに国境を越えられる。"}, {"t": 276.3, "x": "ポルトガルもスペインも、その中に入っている。"}, {"t": 279.18333333333334, "x": "車で走り出したら、記録が残らないってこと？"}, {"t": 282.3666666666667, "x": "そういう作りだ。しかも5月は、\n観光の人がいちばん増える時期だった。"}, {"t": 286.73333333333335, "x": "知らない車が走っていても、誰も気に留めない。"}, {"t": 289.73333333333335, "x": "それが、この事件の最初の壁になった。"}, {"t": 292.93333333333334, "x": "ここで、ポルトガルの法律の言葉を一つ覚えてもらう。"}, {"t": 296.26666666666665, "x": "アルギードという。"}, {"t": 297.35, "x": "それ、容疑者ってこと？"}, {"t": 299.06666666666666, "x": "違う。そこが、この事件でいちばん\n誤解されてきたところだ。"}, {"t": 302.75, "x": "アルギードは、捜査の対象になった\n人に与えられる、手続き上の地位だ。"}, {"t": 307.1166666666667, "x": "この地位が付くと、弁護士を呼べる。"}, {"t": 309.1, "x": "答えたくないことに答えなくてよくなる。"}, {"t": 311.6666666666667, "x": "……守るための地位なの？"}, {"t": 313.15, "x": "守るための地位だ。\n日本の言い方だと、被疑者に近い。"}, {"t": 316.6, "x": "ただし、捕まるわけではない。"}, {"t": 318.26666666666665, "x": "日本の「逮捕された人」とは全く違う。"}, {"t": 321.28333333333336, "x": "そして、これが付いたからといって、\n罪があると認められたわけでもない。"}, {"t": 325.3833333333333, "x": "起訴でもない。ここを間違えると、\nこの事件の話は全部ずれる。"}, {"t": 329.3666666666667, "x": "じゃあ、どうして付けるの？"}, {"t": 330.98333333333335, "x": "ポルトガルでは、誰かに疑いを\n前提にした質問をするときは、先に\nこの地位を与えることになっている。"}, {"t": 337.1, "x": "ただの参考人のまま踏み込んだ\n質問をしてはいけない、という考え方だ。"}, {"t": 341.5, "x": "つまり、アルギードにされたという事実は、\nその人が疑われたことを意味する。"}, {"t": 345.96666666666664, "x": "だが、その人がやったことを意味しない。"}, {"t": 348.3666666666667, "x": "この事件では、2007年のうちに、\n3人がこの地位を与えられた。"}, {"t": 352.51666666666665, "x": "一人は5月に。ご両親は9月に。"}, {"t": 354.9166666666667, "x": "そして、その3人とも、あとで外されている。"}, {"t": 358.01666666666665, "x": "外れることがあるんだ。"}, {"t": 359.51666666666665, "x": "ある。次の章が、その日の話だ。"}, {"t": 362.6166666666667, "x": "2008年7月21日。"}, {"t": 364.81666666666666, "x": "ポルトガルの検察総長府が、\nこの事件の捜査をいったん打ち切ると発表した。"}, {"t": 369.6666666666667, "x": "打ち切り。"}, {"t": 370.45, "x": "ポルトガル語で、書類を棚にしまう、という\n意味の言葉が使われている。"}, {"t": 374.55, "x": "不起訴で手続きを止める、ということだ。"}, {"t": 376.96666666666664, "x": "その日に出された決定文には、\nこう書いてある。訳して読む。"}, {"t": 380.65, "x": "「本日付で、本件を担当する\n検察官2名が出した決定により」"}, {"t": 385.03333333333336, "x": "「マデリン・マッキャンさんの失踪に\n関する捜査手続の打ち切りが決まった」"}, {"t": 389.31666666666666, "x": "「アルギードとされた者による、\nいかなる犯罪の証拠も得られなかったためである」"}, {"t": 393.78333333333336, "x": "証拠が、得られなかった。"}, {"t": 395.5833333333333, "x": "そう書いてある。そして、この後に名前が3つ並ぶ。"}, {"t": 398.8666666666667, "x": "当時この村に住んでいた男性が\n一人と、ご両親の2人だ。"}, {"t": 402.6166666666667, "x": "決定文は、こう続く。"}, {"t": 404.26666666666665, "x": "「これにより、\n3人のアルギードとしての地位は終了する」"}, {"t": 407.48333333333335, "x": "「3人に課されていた処分も、これで消滅する」"}, {"t": 410.6, "x": "全員、疑いが解けたのね。"}, {"t": 412.6166666666667, "x": "正式に解かれた。"}, {"t": 413.9, "x": "この決定は、いまも生きている。"}, {"t": 415.8666666666667, "x": "だから、この動画では、ご両親を疑う話は扱わない。"}, {"t": 419.5, "x": "扱わないというのは、\n遠慮しているという意味ではない。"}, {"t": 422.48333333333335, "x": "検察が正式な文書で、証拠は得られなかったと\n書いた。それが記録だ。"}, {"t": 427.01666666666665, "x": "記録の外にあるものを、記録のように\n喋らない。それだけのことだ。"}, {"t": 431.06666666666666, "x": "それから、もう一人の男性の名前も、\nこの動画では読み上げない。"}, {"t": 434.96666666666664, "x": "同じ日に、同じように疑いを解かれた人だからだ。"}, {"t": 438.8, "x": "さっき、2008年に記録が外に出たって言ってたよね。"}, {"t": 442.45, "x": "出た。ポルトガルでは、不起訴で終わった\n手続きの記録は、関係者が見られるようになる。"}, {"t": 447.6666666666667, "x": "それがきっかけで、2007年の1年分については、\n驚くほど細かいことが世の中に出た。"}, {"t": 453.43333333333334, "x": "あの夜の時刻も、部屋の間取りも、誰が\nいつ何を話したかも、そこから来ている。"}, {"t": 458.5833333333333, "x": "じゃあ、それより後は？"}, {"t": 460.1166666666667, "x": "ほとんど出ていない。"}, {"t": 461.23333333333335, "x": "ポルトガルには、\nセグレド・デ・ジュスティサという仕組みがある。"}, {"t": 464.75, "x": "訳すと、司法上の秘密だ。"}, {"t": 466.65, "x": "捜査の中身を外に出してはいけない状態にする。"}, {"t": 469.8333333333333, "x": "日本にもあるの？"}, {"t": 471.06666666666666, "x": "日本は、捜査の中身を出さないのが当たり前で、\n法律で状態を作るという形ではない。"}, {"t": 476.4, "x": "ポルトガルは違う。検察が裁判官に求めて、\n裁判官が認めると、正式にその状態になる。"}, {"t": 482.6666666666667, "x": "この事件では、後の再開のときに、\nそれが掛けられている。"}, {"t": 486.3333333333333, "x": "結果として、こういう形になった。"}, {"t": 488.65, "x": "最初の1年分だけ、材料が異常に\n多い。それ以降は、ほとんど何も無い。"}, {"t": 493.45, "x": "……偏ってるのね。"}, {"t": 494.71666666666664, "x": "偏っている。そして、この偏りが、\nこの事件の語られ方を歪めてきた。"}, {"t": 499.55, "x": "材料があるのは最初の1年ぶんだけなのに、\nそこだけでいくらでも話が作れてしまう。"}, {"t": 504.6333333333333, "x": "この動画が、後半で急に\n役所の発表ばかりになるのは、そのせいだ。"}, {"t": 508.98333333333335, "x": "材料がそれしか無い。"}, {"t": 510.21666666666664, "x": "無いものを、あるように話さない。"}, {"t": 512.8, "x": "ここからイギリスの話に移る。"}, {"t": 514.7833333333333, "x": "2011年5月12日。"}, {"t": 516.65, "x": "事件から4年後だ。"}, {"t": 518.1, "x": "ロンドン警視庁が、この事件に関わることを発表した。"}, {"t": 521.6166666666667, "x": "いまも公式のページに、そのときの経緯が\n残っている。訳して読む。"}, {"t": 525.7666666666667, "x": "「2011年5月12日、ロンドン警視庁は、\n内務大臣の要請を受けて」"}, {"t": 530.7166666666667, "x": "「マデリン・マッキャンの件に自分たちの専門知識を\n持ち込むことに同意したと発表した」"}, {"t": 535.9833333333333, "x": "内務大臣が頼んだの？"}, {"t": 537.7, "x": "頼んだ。そして、その続きにこう書いてある。"}, {"t": 540.5833333333334, "x": "「当時の警視総監はその要請を検討し、\n差し引きで見て、それが正しいことだと判断した」"}, {"t": 546.2666666666667, "x": "「ただしこれは、内務省が\n資金を出すことが条件だった」"}, {"t": 549.6666666666666, "x": "「この事件は、\nロンドン警視庁の管轄の外にあるからだ」"}, {"t": 553.3166666666667, "x": "管轄の外。"}, {"t": 554.55, "x": "ロンドンの警察が、ポルトガルの事件を\n捜査する権限は、本来は無い。"}, {"t": 558.9166666666666, "x": "だから、最初にやったのは捜査ではなかった。"}, {"t": 561.6333333333333, "x": "公式ページの言葉では、\n捜査の見直し、と書かれている。"}, {"t": 565.2333333333333, "x": "2007年から積み上がった全部の捜査を、\n頭からもう一度読み直す。それだけの作業だ。"}, {"t": 570.9, "x": "自分たちで動くわけじゃないのね。"}, {"t": 572.9666666666667, "x": "この段階では動かない。"}, {"t": 574.5166666666667, "x": "それが変わったのが、2013年7月だ。"}, {"t": 577.45, "x": "公式ページにはこう書いてある。"}, {"t": 579.3, "x": "「2013年7月、ロンドン警視庁の活動は、\n捜査そのものへと位置づけが変わった」"}, {"t": 584.8, "x": "「ポルトガル当局と協力して、\n具体的な筋を追いかけることになった」"}, {"t": 589.1, "x": "読み直す人から、追いかける人になった。"}, {"t": 591.6666666666666, "x": "事件から6年2か月後のことだ。"}, {"t": 594.0, "x": "この捜査には名前が付いている。"}, {"t": 595.75, "x": "オペレーション・グレンジという。"}, {"t": 598.1, "x": "位置づけが変わった2013年7月4日に、\nロンドン警視庁は数字を出している。"}, {"t": 603.1333333333333, "x": "この事件で公的機関が出した数字としては、\nいちばん細かいものだ。順番に言う。"}, {"t": 608.1666666666666, "x": "「これまでに、およそ3万500件の書類が手続きに\n入り、3800件を超える作業が生まれた」"}, {"t": 614.25, "x": "3万500件。"}, {"t": 615.5166666666667, "x": "2007年からの6年分の、あらゆる記録だ。\nそれを1件ずつ読み直した。"}, {"t": 620.35, "x": "「ロンドン警視庁は、ポルトガルを16回訪問した」"}, {"t": 623.5333333333333, "x": "「ポルトガル司法警察と司法当局の主だった\n人たちに会い、分かったことを共有した」"}, {"t": 628.7333333333333, "x": "そして、この日の発表でいちばん\n重いのが、次の一行だ。"}, {"t": 632.4666666666667, "x": "「見直しは、38人の関心人物を\n特定するところまで進んだ」"}, {"t": 637.0, "x": "38人？"}, {"t": 638.15, "x": "38人だ。ヨーロッパのいくつもの国の人たちで、\nそのうち12人はイギリス国民だった。"}, {"t": 644.0333333333333, "x": "「この12人は、マデリンさんがいなくなった\n時点でポルトガルにいたと考えられる」"}, {"t": 648.7166666666667, "x": "それ、疑われてるってこと？"}, {"t": 650.7, "x": "関心人物という言い方は、\n疑いの段階にすら入っていない。"}, {"t": 654.5833333333334, "x": "話を聞く価値がある、というだけの区分だ。\nそこは混ぜないでほしい。"}, {"t": 658.55, "x": "それから4年後、2017年の発表では、\n数字がもっと増えている。"}, {"t": 662.9333333333333, "x": "読み直した書類が4万件を超えた。"}, {"t": 665.0833333333334, "x": "調べた人物が600人を超えた。"}, {"t": 667.4333333333333, "x": "イギリスの公開捜査番組にも、\n2012年4月から4回出ている。"}, {"t": 671.8333333333334, "x": "視聴者から届いた、現地で撮られた\n旅行の写真が3000枚を超えた。"}, {"t": 676.15, "x": "旅行の写真？"}, {"t": 677.2333333333333, "x": "あの村は観光地だ。同じ時期に同じ場所にいた\n人の写真に、誰かが写っているかもしれない。"}, {"t": 682.9833333333333, "x": "そういう探し方をした。"}, {"t": 684.55, "x": "そして2017年の発表には、こう書かれている。"}, {"t": 687.8, "x": "「2013年に、捜査班は4人を、\nこの事件の容疑者と位置づけた」"}, {"t": 692.2, "x": "「その後の調べで、この4人を事件に結びつける証拠は\n見つからなかった。だから、もう対象ではない」"}, {"t": 698.3166666666667, "x": "……4人とも、外れたんだ。"}, {"t": 700.1166666666667, "x": "外れた。"}, {"t": 700.8666666666667, "x": "そして同じ文の最後に、こう書いてある。"}, {"t": 703.3166666666667, "x": "「マデリンさんが生きているのか亡くなっているのかを\n示す証拠を、われわれは持っていない」"}, {"t": 708.5166666666667, "x": "ここで金の話をする。"}, {"t": 709.9666666666667, "x": "数字がまとまって残っているのは、\nこの部分だけだからだ。"}, {"t": 713.4666666666667, "x": "イギリスの警察の予算は、ふつう、\nその警察の管轄の中の仕事に使われる。"}, {"t": 718.55, "x": "ロンドン警視庁の予算は、\nロンドンの治安のためのものだ。"}, {"t": 721.95, "x": "ポルトガルで起きた事件を19年追いかける\n金は、そこには入っていない。"}, {"t": 726.35, "x": "じゃあ、どこから出てるの？"}, {"t": 728.0, "x": "内務省だ。特別補助金という枠がある。"}, {"t": 730.7, "x": "ある警察が、桁の違う例外的な費用を\n抱えたときに、国が別枠で出す仕組みだ。"}, {"t": 736.0833333333334, "x": "2019年6月5日、イギリス内務省が、\nこの件について短い発表を出している。"}, {"t": 741.6666666666666, "x": "「ロンドン警視庁から、"}, {"t": 742.9, "x": "オペレーション・グレンジの資金を2020年3月31日まで"}, {"t": 746.9333333333333, "x": "延長したいという要請を受けた」"}, {"t": 748.7, "x": "「この資金は特別補助金であり、警察が重大または\n例外的な費用に直面したときに使えるものである」"}, {"t": 755.1, "x": "そして、この発表には金額も入っている。"}, {"t": 757.9, "x": "前の年に出した額が30万ポンド。\nこの時点までの総額が1175万ポンドだ。"}, {"t": 763.5666666666667, "x": "そのあとは？"}, {"t": 764.5166666666667, "x": "2025年2月4日、イギリスの議会で、\n内務省が正式に答えている。"}, {"t": 769.4, "x": "「2024年度について、最大19万2000\nポンドの特別補助金を出すことで合意した」"}, {"t": 775.0, "x": "「2011年以降、2023年度末までのオペレーション・"}, {"t": 778.5833333333334, "x": "グレンジの総支出は1320万ポンドである」"}, {"t": 781.8833333333333, "x": "1320万ポンドって、日本円だと？"}, {"t": 784.8, "x": "為替で変わるから、はっきりした円は\n言わない。けたで言うと、数十億円の世界だ。"}, {"t": 789.7666666666667, "x": "一人の子どもを探すために、\n一つの国がそれを出し続けてきた。"}, {"t": 793.8666666666667, "x": "そして、2019年の発表には、もう\n一行、大事なことが書いてある。"}, {"t": 798.5333333333333, "x": "「内務省は、捜査を続けるべきか\nどうかについて意見を持たない」"}, {"t": 802.2333333333333, "x": "「それは警察が判断する事柄である」"}, {"t": 804.7833333333333, "x": "……お金は出すけど、やめろとは言わないんだ。"}, {"t": 807.3666666666667, "x": "言わない。"}, {"t": 807.9833333333333, "x": "やめるかどうかを決めるのは、政治ではなく、\n捜査をしている側だ。そういう形にしてある。"}, {"t": 813.35, "x": "だからこの捜査は、19年たっても、\n外から止められていない。"}, {"t": 817.3, "x": "人数も分かっている。"}, {"t": 818.4666666666667, "x": "2019年にイギリス警察が開示した\n文書によると、専従は刑事4人。"}, {"t": 823.3333333333334, "x": "巡査部長が1人、巡査が3人。"}, {"t": 825.5333333333333, "x": "指揮官は別の殺人捜査班と兼務だった。"}, {"t": 828.6, "x": "4人で？"}, {"t": 829.4333333333333, "x": "4人だ。1320万ポンドという\n額の内側は、そういう規模だった。"}, {"t": 834.6166666666667, "x": "2013年10月14日。"}, {"t": 836.55, "x": "ロンドン警視庁が、公開捜査に踏み切る。"}, {"t": 839.3166666666667, "x": "イギリスの公開捜査番組と、ドイツと\nオランダの同じような番組で、同時に流した。"}, {"t": 844.6166666666667, "x": "3つの国で同時に？"}, {"t": 846.1166666666667, "x": "同時にだ。そのときの発表文が、\nいまも読める。訳して読む。"}, {"t": 850.1833333333333, "x": "「ロンドン警視庁は、2007年5月3日に\nポルトガルのプライア・ダ・ルースの保養地で起きた」"}, {"t": 855.85, "x": "「3歳のイギリス人の女の子、マデリン・\nマッキャンの連れ去りを捜査している」"}, {"t": 860.3, "x": "「あの晩の出来事について新しい理解が得られた\n結果、ある目撃情報に焦点が戻った」"}, {"t": 865.6666666666666, "x": "「午後10時ごろ、子どもを抱えて\n海のほう、あるいは町の中心のほうへ\n歩いていった男だ」"}, {"t": 870.9166666666666, "x": "子どもを抱えた男。"}, {"t": 872.4666666666667, "x": "同じ男についての似顔絵が2枚、このとき公開された。"}, {"t": 876.0, "x": "発表文には、目撃した\n方たちの説明がそのまま載っている。"}, {"t": 880.0333333333333, "x": "「白人で、30代くらい。"}, {"t": 881.75, "x": "短い茶色の髪。中肉、中背。ひげは剃っていた」"}, {"t": 885.45, "x": "それだけだ。それ以上のことは、\n19年たっても分かっていない。"}, {"t": 889.3166666666667, "x": "似顔絵は、他にもある。"}, {"t": 890.9, "x": "現場の近くで見られた、金髪または\n明るい髪の男についての2枚。"}, {"t": 895.1833333333333, "x": "それと、同じ日の午後に村を回っていた、\n寄付を集める男についての2枚。"}, {"t": 899.9166666666666, "x": "全部で6枚？"}, {"t": 901.0666666666667, "x": "この発表に出ているのは、そういう構成だ。"}, {"t": 903.7166666666667, "x": "ただ、ロンドン警視庁は、この似顔絵の男たちを\n本文で犯人とは書いていない。"}, {"t": 908.5166666666667, "x": "書いてあるのは「この人たちを特定して、話を\n聞きたい」だ。そこは正確に受け取ってほしい。"}, {"t": 914.3833333333333, "x": "この発表には、もう一つ、\n地味だが重い数字が入っている。"}, {"t": 918.15, "x": "「この保養地では、空き巣が4倍に増えていて、\n2007年4月にいちばん多くなった」"}, {"t": 923.25, "x": "「4月に起きたうち2件は、\nマデリンさんがいなくなった5号棟で起きていた」"}, {"t": 927.6, "x": "同じ棟で。"}, {"t": 928.65, "x": "同じ棟だ。"}, {"t": 929.5833333333334, "x": "そして、この発表と同時に、懸賞金が出されている。"}, {"t": 932.9166666666666, "x": "最大2万ポンドだ。"}, {"t": 934.3666666666667, "x": "条件はこう書かれている。"}, {"t": 935.7666666666667, "x": "「連れ去りの責任者の特定、逮捕、\n訴追につながる情報に対して」"}, {"t": 940.1833333333333, "x": "この懸賞金は、いまも取り下げられていない。"}, {"t": 943.4833333333333, "x": "同じ2013年の10月。"}, {"t": 945.3333333333334, "x": "今度はポルトガル側が動く。"}, {"t": 947.1833333333333, "x": "10月24日、ポルトガルの検察が、\n棚にしまった捜査記録をもう一度出した。"}, {"t": 952.5, "x": "5年ぶり？"}, {"t": 953.3666666666667, "x": "5年3か月ぶりだ。"}, {"t": 954.8333333333334, "x": "この判断の理由は、後にポルトガル検察が出した\n説明の文書に、はっきり書いてある。"}, {"t": 960.1666666666666, "x": "「マディ事件と呼ばれる手続は、\n2008年にいったん打ち切られた」"}, {"t": 964.1, "x": "「その後、検察は2013年に再開を決めた」"}, {"t": 967.3166666666667, "x": "「捜査を続ける理由となる新しい\n資料が出てきたためである」"}, {"t": 970.8833333333333, "x": "新しい資料。中身は？"}, {"t": 972.65, "x": "出ていない。"}, {"t": 973.3833333333333, "x": "ここで、さっきの司法上の秘密が効いてくる。"}, {"t": 976.1833333333333, "x": "ポルトガルの検察は、この捜査を\n秘密の状態に置くことを裁判官に\n求めて、認められている。"}, {"t": 982.0666666666667, "x": "だから、何が出てきたのかは、\nいまも公表されていない。"}, {"t": 985.5666666666667, "x": "13年ずっと？"}, {"t": 986.9, "x": "ずっとだ。"}, {"t": 987.6333333333333, "x": "ただ、時期を並べると、見えてくるものはある。"}, {"t": 990.4166666666666, "x": "イギリスが見直しから捜査に\n変わったのが、2013年7月。"}, {"t": 994.4833333333333, "x": "イギリスが3つの国で似顔絵を\n流したのが、2013年10月14日。"}, {"t": 999.1333333333333, "x": "ポルトガルが再開したのが、その10日後だ。"}, {"t": 1001.9833333333333, "x": "……つながってるのね。"}, {"t": 1003.2666666666667, "x": "つながっているとは、どちらの役所も言っていない。"}, {"t": 1006.0333333333333, "x": "だが、この3つが同じ年の同じ季節に\n並んでいることは、記録の上の事実だ。"}, {"t": 1011.7, "x": "2020年6月3日。この事件は、\n13年目にして、いちばん大きく動く。"}, {"t": 1016.9166666666666, "x": "動かしたのは、ポルトガルでも\nイギリスでもない。ドイツだ。"}, {"t": 1020.35, "x": "ドイツ？"}, {"t": 1021.0833333333334, "x": "ドイツの北部に、ブラウンシュバイクという町がある。"}, {"t": 1023.9666666666667, "x": "その町の検察庁が、この日、短い文書を出した。"}, {"t": 1027.5333333333333, "x": "同じ日に、ドイツ連邦刑事警察庁も、まったく\n同じ文面を公表している。訳して読む。"}, {"t": 1033.3, "x": "「2007年5月3日に、ポルトガルのプライア・\nダ・ルースの集合住宅から」"}, {"t": 1038.1166666666666, "x": "「当時3歳のイギリス人の女の子、マデリン・ベス・\nマッキャンが行方不明になった件に関連して」"}, {"t": 1044.0333333333333, "x": "「ブラウンシュバイク検察庁は、\n43歳のドイツ国籍の男性に対し、\n殺人の疑いで捜査を行っている」"}, {"t": 1051.0, "x": "……殺人の疑い。"}, {"t": 1052.3166666666666, "x": "そう書いてある。ここは正確に受け取ってほしい。"}, {"t": 1055.0666666666666, "x": "検察が言ったのは「捜査を行っている」だ。"}, {"t": 1057.8, "x": "「この男がやった」ではない。"}, {"t": 1059.6333333333334, "x": "ドイツ語の文書では、この男性は\n被疑者という言葉で書かれている。"}, {"t": 1063.4666666666667, "x": "捜査の対象になっている人、という意味しかない。"}, {"t": 1066.4166666666667, "x": "起訴された人は、ドイツ語では別の言葉になる。\nこの文書に、その言葉は出てこない。"}, {"t": 1071.7333333333333, "x": "まだ、起訴じゃないのね。"}, {"t": 1073.3666666666666, "x": "起訴じゃない。そして、2026年の\nいまも起訴されていない。"}, {"t": 1077.2, "x": "この動画では、この男性の名前も顔も出さない。"}, {"t": 1080.15, "x": "ドイツの発表自体が、\n43歳のドイツ国籍の男性、としか\n書いていないからだ。"}, {"t": 1085.5, "x": "なぜこの町の検察が担当なのかも、\n文書に理由が書いてある。"}, {"t": 1089.4166666666667, "x": "「被疑者が国外に出る前の最後の住所が、\nこの管区にあったため」"}, {"t": 1093.3833333333334, "x": "住民票の話で、事件の中身とは関係がない。"}, {"t": 1097.2666666666667, "x": "その発表には、もう一つ大事なことが書いてある。"}, {"t": 1100.4, "x": "「捜査中のため、現時点では\n事実関係についてこれ以上の情報は出せない」"}, {"t": 1104.9833333333333, "x": "「とくに、具体的な容疑の中身や、\nこれまでの捜査結果については出せない」"}, {"t": 1109.65, "x": "……中身は言わないんだ。"}, {"t": 1111.05, "x": "言わない。"}, {"t": 1111.65, "x": "つまり、この日ドイツが\n公にしたのは、次の3つだけだ。"}, {"t": 1115.4166666666667, "x": "一つ、43歳のドイツ国籍の男性を捜査している。"}, {"t": 1119.2, "x": "二つ、罪名は殺人の疑いである。"}, {"t": 1121.7, "x": "三つ、それ以上は言えない。"}, {"t": 1123.55, "x": "それだけ？"}, {"t": 1124.45, "x": "それだけだ。記者会見も開いていない。"}, {"t": 1126.9166666666667, "x": "ただし、その男性の経歴については、\n少し書かれている。"}, {"t": 1130.5666666666666, "x": "前科が複数ある性犯罪者で、子どもへの性的な\n虐待でも有罪判決を受けていること。"}, {"t": 1136.0666666666666, "x": "そして、この発表の時点で、\n別の事件の長い刑に服していること。"}, {"t": 1140.65, "x": "もう刑務所にいたの？"}, {"t": 1142.05, "x": "いた。この事件とは関係のない、別の罪でだ。"}, {"t": 1145.1333333333334, "x": "この発表のあと、世界中の報道が、\nこの人物の名前と顔を出した。"}, {"t": 1149.6, "x": "だが、ドイツ当局が出した\n文書には、名前も顔も無い。"}, {"t": 1153.1333333333334, "x": "この動画は、文書のほうに合わせる。"}, {"t": 1155.9333333333334, "x": "同じ日に、ドイツ連邦刑事警察庁が、\n目撃者を探すページを公開している。"}, {"t": 1161.0, "x": "これが、この事件で今いちばん\n具体的な情報提供のお願いだ。"}, {"t": 1164.9333333333334, "x": "まず、時刻だ。"}, {"t": 1166.1666666666667, "x": "「犯行時刻とみられる、当日の午後9時10分から\n午後10時の間における」"}, {"t": 1170.65, "x": "「被疑者の実際の居場所の特定が、\nとくに重要である」"}, {"t": 1174.0833333333333, "x": "あの50分ね。"}, {"t": 1175.3166666666666, "x": "そうだ。次が、車だ。2台ある。"}, {"t": 1177.7833333333333, "x": "1台は、濃い赤の、\nいわゆる茄子色のジャガーの乗用車。"}, {"t": 1181.2833333333333, "x": "もう1台は、白と黄色の、\nフォルクスワーゲンのキャンピングカーだ。"}, {"t": 1185.1166666666666, "x": "2007年5月の時点で、\nポルトガルのナンバーが付いていた。"}, {"t": 1188.9, "x": "その車の持ち主は？"}, {"t": 1190.5166666666667, "x": "ドイツ連邦刑事警察庁は、そこもはっきり書いている。"}, {"t": 1193.9666666666667, "x": "「被疑者はこの車の名義人ではない。"}, {"t": 1196.0333333333333, "x": "名義人は容疑者から除外される」"}, {"t": 1198.15, "x": "関係のない人が巻き込まれないように、\nわざわざそう書いてある。"}, {"t": 1201.7666666666667, "x": "そして、電話だ。ここがいちばん具体的だ。"}, {"t": 1204.6166666666666, "x": "「被疑者は、\n当該の時間帯に、あるポルトガルの携帯電話の番号を\n使っていたとほぼ確実に言える」"}, {"t": 1210.5333333333333, "x": "「2007年5月3日、犯行に関係する時刻に、"}, {"t": 1213.8333333333333, "x": "プライア・ダ・ルース一帯で、\n身元不明の人物との通話が行われた」"}, {"t": 1218.3833333333334, "x": "「相手は、別のポルトガルの番号を使っていた」"}, {"t": 1221.2333333333333, "x": "「この番号の使用者は、重要な証人となりうる。\nただし通話の時点で、その地域にはいなかった」"}, {"t": 1227.15, "x": "かけた相手が、まだ分かってないの？"}, {"t": 1229.45, "x": "分かっていない。19年たっても分かっていない。"}, {"t": 1232.2666666666667, "x": "番号は2つとも、ドイツ連邦刑事警察庁のページに、\nいまも公開されている。"}, {"t": 1237.25, "x": "どちらも、351から始まる\nポルトガルの携帯電話の番号だ。"}, {"t": 1241.5666666666666, "x": "懸賞金も出ている。1万ユーロだ。"}, {"t": 1243.9166666666667, "x": "条件は、犯人の逮捕につながる決定的な\n情報に対して、と書かれている。"}, {"t": 1248.8, "x": "そして、このページには、こういう一文も入っている。"}, {"t": 1251.9666666666667, "x": "「犯人本人のほかにも、犯行の経緯や、\n場合によっては遺体の遺棄場所について」"}, {"t": 1256.8666666666666, "x": "「具体的な知識を持つ\n人物がいると考える理由がある」"}, {"t": 1260.3666666666666, "x": "……遺体って書いてあるの。"}, {"t": 1261.8166666666666, "x": "書いてある。ドイツの当局は、\n亡くなっているという前提で動いている。"}, {"t": 1265.8166666666666, "x": "ただし、検察が出した文書の本文に、\n亡くなったという言葉は一度も使われていない。"}, {"t": 1271.05, "x": "使われているのは、\n殺人の疑い、という言い方だけだ。"}, {"t": 1274.55, "x": "そして、遺体は見つかっていない。"}, {"t": 1276.55, "x": "だからこの動画でも、生死は決めない。"}, {"t": 1278.7666666666667, "x": "見つかっていない、で通す。"}, {"t": 1281.15, "x": "ドイツの発表から6日後。"}, {"t": 1282.75, "x": "2020年6月9日だ。"}, {"t": 1284.9333333333334, "x": "今度はポルトガルの検察が、\nわざわざ説明の文書を出している。"}, {"t": 1288.9166666666667, "x": "どうして？"}, {"t": 1289.7666666666667, "x": "報道が、混ざり始めたからだ。"}, {"t": 1291.8333333333333, "x": "この男性の名前が出た途端、\nポルトガルの過去の事件と次々に結びつけられた。"}, {"t": 1296.75, "x": "それで検察が、手元の記録を洗い直して、\n事実だけを並べた。訳して読む。"}, {"t": 1301.8666666666666, "x": "「現在の容疑者は、命令不服従の事件と、\n窃盗の事件で、それぞれ有罪となっている」"}, {"t": 1307.4666666666667, "x": "「名前が出てくる\n国際司法共助の要請が、5件見つかった」"}, {"t": 1311.25, "x": "「うち1件は、犯人が分からないまま2006年2月に\n打ち切られた別の事件に関するものである」"}, {"t": 1317.0333333333333, "x": "「残る4件が、マデリン・マッキャンさんの失踪を\n捜査している事件に関するものである」"}, {"t": 1322.2, "x": "……ややこしい。"}, {"t": 1323.0833333333333, "x": "ややこしい。だが、この文書が言いたいことは一つだ。"}, {"t": 1326.25, "x": "この男性がポルトガルで有罪になっているのは、\n命令不服従と窃盗の2件だけだ。"}, {"t": 1331.3166666666666, "x": "それ以外の結びつけは、\n記録の上ではそうなっていない。"}, {"t": 1334.6666666666667, "x": "検察が、報道を止めに来たのね。"}, {"t": 1337.1, "x": "そう読める。"}, {"t": 1337.9, "x": "そして同じ文書に、こう書いてある。"}, {"t": 1340.0833333333333, "x": "「手続きの再開後、アルギードとされた者はいない」"}, {"t": 1343.0666666666666, "x": "2013年に再開してから2020年6月まで、\n誰一人、その地位を与えられていない。"}, {"t": 1348.9833333333333, "x": "7年間、ゼロ？"}, {"t": 1350.4, "x": "ゼロだ。捜査は動いていたが、正式に\n名前が載った人は一人もいなかった。"}, {"t": 1355.7666666666667, "x": "それが変わったのが、2022年4月21日だ。"}, {"t": 1359.3333333333333, "x": "ポルトガルの検察が、4行の発表を出した。全部読む。"}, {"t": 1363.0833333333333, "x": "「2007年のマデリン・"}, {"t": 1364.4, "x": "マッキャンさんの失踪をめぐる捜査手続に\nおいて、この水曜日に1名がアルギードとされた」"}, {"t": 1369.65, "x": "「アルギードの指定は、\nポルトガル検察が出した国際司法共助の要請を\n受けて、ドイツ当局が実施した」"}, {"t": 1375.8833333333334, "x": "「この捜査は、ファロ地区検察のポルティマン支部が\n指揮し、司法警察が補助している」"}, {"t": 1380.9666666666667, "x": "「捜査は、イギリスと\nドイツの当局の協力を得て進められてきた」"}, {"t": 1385.0166666666667, "x": "これって、あのドイツの男性？"}, {"t": 1387.0166666666667, "x": "発表に名前は無い。だが、ドイツ当局が\n手続きをしたと書いてある。"}, {"t": 1391.2, "x": "つまり、ドイツ国内にいる人だ。"}, {"t": 1393.3166666666666, "x": "ここで、さっきのアルギードの話を\nもう一度思い出してほしい。"}, {"t": 1396.9666666666667, "x": "起訴じゃない、だったよね。"}, {"t": 1398.65, "x": "起訴じゃない。"}, {"t": 1399.4666666666667, "x": "それどころか、そもそもこの地位は、\n質問される側を守るために付けるものだった。"}, {"t": 1404.4, "x": "ご両親も一度これを与えられ、\nその翌年に外されている。"}, {"t": 1408.0, "x": "だから、2022年4月21日に\n起きたのは、こういうことだ。"}, {"t": 1412.3333333333333, "x": "ポルトガルの捜査に、正式に名前が\n載る人が、14年ぶりに1人できた。"}, {"t": 1417.0833333333333, "x": "それ以上でも、それ以下でもない。"}, {"t": 1419.1833333333334, "x": "14年ぶり。"}, {"t": 1420.2666666666667, "x": "14年ぶりだ。"}, {"t": 1421.9666666666667, "x": "ここで、仕組みの話を一つしておく。"}, {"t": 1424.45, "x": "この事件は、ポルトガルで起きた。"}, {"t": 1426.3666666666666, "x": "被害者はイギリスの家族だ。"}, {"t": 1428.1, "x": "捜査対象の男性はドイツ人だ。"}, {"t": 1430.45, "x": "全部ばらばらの国ね。"}, {"t": 1432.0166666666667, "x": "ばらばらだ。ふつうなら、ここで手続きが止まる。"}, {"t": 1434.9833333333333, "x": "ある国の警察が、別の国にいる人を\n勝手に調べることはできないからだ。"}, {"t": 1439.55, "x": "それを繋ぐ仕組みが、ヨーロッパにはある。"}, {"t": 1441.9666666666667, "x": "ポルトガルの検察が2020年に出した\n説明の文書に、こう書いてある。"}, {"t": 1446.45, "x": "「捜査は、刑事に関する欧州相互援助条約と、\n欧州議会および理事会の指令に定められた形で」"}, {"t": 1452.6333333333334, "x": "「ドイツおよびイギリスの司法当局と、\n密接に協力して進めてきた」"}, {"t": 1457.0833333333333, "x": "条約と、指令。"}, {"t": 1458.5, "x": "2014年に作られたほうの指令は、\n欧州捜査命令と呼ばれている。"}, {"t": 1462.7166666666667, "x": "ある国の検察が出した捜査の要請を、別の国が\n自分の国の手続きとして実行する、という決まりだ。"}, {"t": 1469.1833333333334, "x": "たとえば、ドイツの検察が「ポルトガルの\nこの土地を調べたい」と言う。"}, {"t": 1473.3333333333333, "x": "ポルトガルの検察がそれを受けて、\nポルトガルの司法警察が実際に動く。"}, {"t": 1477.95, "x": "じゃあ、逆もあるの？"}, {"t": 1479.3666666666666, "x": "ある。2022年に、ドイツにいる男性を\nポルトガルのアルギードにしたのが、その逆向きだ。"}, {"t": 1484.9833333333333, "x": "ポルトガルが要請を出して、\nドイツの当局が代わりに手続きをした。"}, {"t": 1488.9666666666667, "x": "だから、この事件では、どの国が\n何をしたのかが見えにくい。"}, {"t": 1492.6166666666666, "x": "掘っているのはポルトガルの警察でも、\n頼んだのはドイツの検察だったりする。"}, {"t": 1497.1166666666666, "x": "19年続いているのは、\nこの仕組みがあるからでもある。"}, {"t": 1500.3333333333333, "x": "誰か一人がやめると言っても、\n止まらない形になっている。"}, {"t": 1504.4833333333333, "x": "その仕組みで、ポルトガルでは\n実際に何度か、土が掘られている。"}, {"t": 1508.3833333333334, "x": "一つは、2023年5月だ。"}, {"t": 1510.8166666666666, "x": "場所は、アラーデダムという貯水池のほとりだった。"}, {"t": 1513.5333333333333, "x": "あの村から50キロほど離れている。"}, {"t": 1515.9333333333334, "x": "どうしてそこを？"}, {"t": 1517.0333333333333, "x": "ドイツ側の要請だ。ブラウンシュバイク検察は、\n5月23日にこう発表している。"}, {"t": 1522.3, "x": "「マデリン・マッキャン事件の捜査の一環として、\n現在ポルトガルで刑事手続上の措置が行われている」"}, {"t": 1528.3833333333334, "x": "ポルトガルの司法警察が、3日間そこを調べた。"}, {"t": 1531.6166666666666, "x": "ポルトガル警察の発表はこうだ。"}, {"t": 1533.7333333333333, "x": "「回収した資料は、国際司法共助の規則に\n従い、ドイツ当局に引き渡す」"}, {"t": 1538.9666666666667, "x": "それで、何か出たの？"}, {"t": 1540.5833333333333, "x": "この事件に結びつくものが\n見つかった、という発表は無い。"}, {"t": 1544.1166666666666, "x": "その1週間後、6月1日に、\nドイツ検察はこう言っている。"}, {"t": 1548.15, "x": "「当地で行っている容疑者に対する捜査は、\nなお相当長い期間続く見込みである」"}, {"t": 1553.1, "x": "もう一つの捜索は、2025年6月だ。"}, {"t": 1556.1, "x": "今度は、村のすぐ近くだった。"}, {"t": 1558.2666666666667, "x": "プライア・ダ・ルースと、隣のラゴスの町のあいだに、\nアタライアという原っぱがある。"}, {"t": 1563.2833333333333, "x": "廃屋と、使われなくなった井戸と、\n貯水槽が点々としている土地だ。"}, {"t": 1567.6166666666666, "x": "6月2日から5日まで、ポルトガル司法警察の\nおよそ30人と、ドイツ連邦刑事警察庁が入った。"}, {"t": 1574.4, "x": "地面の下を見る装置を持ち込んで、\n20を超える区画を調べている。"}, {"t": 1578.3833333333334, "x": "終わったのは、6月5日の午後5時だ。"}, {"t": 1580.9833333333333, "x": "これも、何も出なかったの？"}, {"t": 1582.9333333333334, "x": "押収したものはドイツに送られた。\nそこまでが発表されていることだ。"}, {"t": 1587.0333333333333, "x": "6月10日、ドイツ検察はこう発表している。"}, {"t": 1590.1166666666666, "x": "「捜査の結果については、現時点で\nまだ何も申し上げられない」"}, {"t": 1593.8666666666666, "x": "18年たった土地を掘って、その一行で終わる。"}, {"t": 1596.9333333333334, "x": "それを、まだやっている。"}, {"t": 1599.0333333333333, "x": "ここからは、混ぜてはいけない話をする。"}, {"t": 1601.5, "x": "ドイツで捜査対象になっている男性は、\nこの事件とは別に、一度法廷に立っている。"}, {"t": 1606.75, "x": "この事件で？"}, {"t": 1607.7833333333333, "x": "違う。別の事件でだ。そこを間違えないでほしい。"}, {"t": 1610.9333333333334, "x": "2022年10月11日、ブラウンシュバイク検察は、\nこの男性を起訴した。"}, {"t": 1616.0333333333333, "x": "罪名は、2000年から2017年のあいだに\nポルトガルで行ったとされる、複数の性犯罪だ。"}, {"t": 1622.1166666666666, "x": "そして、同じ発表の中に、はっきりこう書いてある。"}, {"t": 1625.45, "x": "「マデリン・マッキャンの失踪の捜査は、\nこの起訴とは無関係に、引き続き継続している」"}, {"t": 1630.85, "x": "この事件では起訴してないってことね。"}, {"t": 1633.25, "x": "していない。検察自身がそう書いている。"}, {"t": 1635.7333333333333, "x": "裁判は2年かかった。"}, {"t": 1637.1166666666666, "x": "判決が出たのが、2024年10月8日だ。"}, {"t": 1640.4, "x": "ブラウンシュバイク地方裁判所は、\n5件すべてについて、無罪を言い渡した。"}, {"t": 1644.95, "x": "無罪。"}, {"t": 1645.6333333333334, "x": "無罪だ。裁判長は、法廷でこう述べている。"}, {"t": 1648.5333333333333, "x": "「我々が持っていた証拠は、被告人を\n有罪とするには足りなかった」"}, {"t": 1652.6, "x": "「我々は、信用できない証人を相手にしていた。"}, {"t": 1655.45, "x": "一部は法廷に故意に嘘をついていた」"}, {"t": 1657.7166666666667, "x": "そして、こうも述べている。"}, {"t": 1659.3666666666666, "x": "「被告人はメディアで、性の怪物、\n子ども殺し、に仕立て上げられていた」"}, {"t": 1663.9666666666667, "x": "……裁判長が、そう言ったの。"}, {"t": 1665.9, "x": "言った。この言葉は、そのまま記録に残っている。"}, {"t": 1669.0333333333333, "x": "この判決は、まだ確定していない。"}, {"t": 1671.25, "x": "検察が上告している。"}, {"t": 1672.9, "x": "ドイツの連邦通常裁判所が、2027年の初めに\nこの件を扱う予定だと報じられている。"}, {"t": 1678.9166666666667, "x": "この章の線を、もう一度引いておく。"}, {"t": 1681.15, "x": "この無罪判決は、\nマデリンさんの事件についてのものではない。"}, {"t": 1684.8166666666666, "x": "有罪であっても、無罪であっても、\nこの事件の答えにはならない。"}, {"t": 1688.65, "x": "別の法廷の話を、この事件の材料に使わない。"}, {"t": 1692.6, "x": "2025年9月17日。"}, {"t": 1694.75, "x": "この男性は、刑務所を出た。"}, {"t": 1696.7333333333333, "x": "出た？"}, {"t": 1697.3833333333334, "x": "出た。2019年に言い渡された\n刑を、務め終えたからだ。"}, {"t": 1701.2, "x": "2005年にポルトガルで起きた\n事件についての、7年の刑だった。"}, {"t": 1705.25, "x": "これも、マデリンさんの事件とは別の事件だ。"}, {"t": 1708.0666666666666, "x": "刑期が終われば、出る。それが刑罰の仕組みだ。"}, {"t": 1711.15, "x": "でも、捜査は続いてるんでしょ？"}, {"t": 1713.2333333333333, "x": "続いている。だが、捜査と身柄は別の話だ。"}, {"t": 1716.3833333333334, "x": "ドイツの検察は、この人物について\n勾留状を持っていない。"}, {"t": 1720.0, "x": "起訴もしていない。だから、身柄を\n押さえておく法的な理由が無い。"}, {"t": 1723.85, "x": "出所後は、電子的な\n足輪を着けることになっている。5年間だ。"}, {"t": 1727.9, "x": "その後、高等裁判所が、国内に\n住所を置く義務のほうは取り消している。"}, {"t": 1732.1, "x": "足輪と、保護観察は残った。"}, {"t": 1734.4166666666667, "x": "……なんだか、宙ぶらりんね。"}, {"t": 1736.1666666666667, "x": "宙ぶらりんだ。"}, {"t": 1737.1666666666667, "x": "2026年8月、ドイツの公共放送が、\nこの事件の現状を一行でまとめている。"}, {"t": 1742.7, "x": "「彼は自由の身である。"}, {"t": 1743.8833333333334, "x": "マデリン・マッキャンの失踪事件で\n殺人の疑いをかけられている」"}, {"t": 1747.75, "x": "「起訴は存在しない。"}, {"t": 1748.9166666666667, "x": "無罪推定が適用される」"}, {"t": 1750.8333333333333, "x": "起訴は、存在しない。"}, {"t": 1752.4833333333333, "x": "これが、2026年の時点でのドイツ側の状態だ。"}, {"t": 1756.0333333333333, "x": "疑いはある。証拠は出ていない。"}, {"t": 1757.8333333333333, "x": "起訴は無い。だから自由の身でいる。"}, {"t": 1759.95, "x": "この3つは、全部同時に成り立つ。"}, {"t": 1762.2333333333333, "x": "気持ちの上で納得できるかどうかは、また別の話だ。"}, {"t": 1765.6833333333334, "x": "だが、記録の上ではそうなっている。"}, {"t": 1768.45, "x": "ここまでを、数で並べ直してみる。"}, {"t": 1770.6666666666667, "x": "いなくなった日から、今日まで19年。"}, {"t": 1773.0333333333333, "x": "関わった国が3つ。ポルトガル、イギリス、ドイツ。"}, {"t": 1776.3666666666666, "x": "ポルトガルの捜査が打ち切られてから\n再開されるまで、5年3か月。"}, {"t": 1780.4833333333333, "x": "イギリスの専従班ができたのが、事件から4年後。"}, {"t": 1783.7166666666667, "x": "読み直された書類が4万件超。"}, {"t": 1785.7333333333333, "x": "調べられた人物が600人超。"}, {"t": 1788.0333333333333, "x": "イギリスが出した金が1320万ポンド。"}, {"t": 1790.75, "x": "専従の刑事は4人。"}, {"t": 1792.2166666666667, "x": "ドイツが出している懸賞金が1万ユーロ。"}, {"t": 1794.6333333333334, "x": "イギリスの懸賞金が最大2万ポンド。"}, {"t": 1797.1666666666667, "x": "そして、この事件で起訴された人の数が、ゼロ。"}, {"t": 1800.5333333333333, "x": "ゼロ。"}, {"t": 1801.1666666666667, "x": "ゼロだ。"}, {"t": 1801.8, "x": "これだけの人と、これだけの金と、\nこれだけの年数をかけて、\n法廷は一度も開かれていない。"}, {"t": 1807.5666666666666, "x": "次に、数えられないほうを並べる。"}, {"t": 1809.6833333333334, "x": "あの夜、部屋から誰が\n連れ出したのか。分かっていない。"}, {"t": 1812.9666666666667, "x": "どうやって外に出たのか。分かっていない。"}, {"t": 1815.4166666666667, "x": "午後9時10分から10時までの50分に、\n何があったのか。分かっていない。"}, {"t": 1819.9333333333334, "x": "あの日の通話の相手が誰なのか。分かっていない。"}, {"t": 1822.8333333333333, "x": "そして、いまどこにいるのか。分かっていない。"}, {"t": 1825.6333333333334, "x": "……19年、そこは1つも動いてないのね。"}, {"t": 1828.4166666666667, "x": "動いていない。"}, {"t": 1829.2833333333333, "x": "ただ、動いていないことと、諦められたことは、別だ。"}, {"t": 1832.85, "x": "3つの国の役所が、いまも\n同じ番号の書類を開いている。"}, {"t": 1837.1666666666667, "x": "最後に、整理しておく。"}, {"t": 1838.7666666666667, "x": "2007年5月3日の夜、ポルトガルのプライア・ダ・\nルースで、3歳の子どもが部屋からいなくなった。"}, {"t": 1845.15, "x": "マデリン・マッキャンさん。"}, {"t": 1846.3833333333334, "x": "4歳の誕生日の、9日前だった。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
