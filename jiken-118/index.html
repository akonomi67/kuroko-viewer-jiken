<script>
const D={"name": "118", "file": "118_編集用", "dur": 2069.2333125, "segs": [], "subs": [{"t": 0.0, "x": "大阪市の銀行で、シャッターが\n42時間下りたままだった。"}, {"t": 3.683333333333333, "x": "1979年1月。住吉区にあった三菱銀行の北畠支店だ。"}, {"t": 9.066666666666666, "x": "42時間ってまる2日近くじゃない？"}, {"t": 11.65, "x": "そうだ。中には猟銃を持った男と、大勢の人質がいた。"}, {"t": 15.5, "x": "外には警察がいた。人数は644人。車は113台だ。"}, {"t": 20.316666666666666, "x": "それだけいて入れなかったの？"}, {"t": 22.183333333333334, "x": "入れなかった。入るのを待った、とも言える。"}, {"t": 24.866666666666667, "x": "そして1月28日の午前8時41分。"}, {"t": 28.116666666666667, "x": "警察は行内の事務室へ突入した。"}, {"t": 30.716666666666665, "x": "その時刻まで何を待ってたの？"}, {"t": 32.733333333333334, "x": "答えは国会の記録に残っている。"}, {"t": 34.95, "x": "事件の数日後、警察庁の刑事局長が経過を報告した。"}, {"t": 38.983333333333334, "x": "その中に「人質の数が減じた」という一言がある。"}, {"t": 42.766666666666666, "x": "人質が減った？"}, {"t": 44.13333333333333, "x": "犯人を取り巻く人質が、その朝に少なくなった。"}, {"t": 47.5, "x": "その一瞬に警察は動いた。"}, {"t": 49.38333333333333, "x": "今回は、この42時間に警察が下した判断を順に追う。"}, {"t": 53.36666666666667, "x": "中が見えない。犯人が誰かも\n分からない。説得は拒まれる。"}, {"t": 57.2, "x": "その中で何を決め何を待ったのか。"}, {"t": 59.583333333333336, "x": "判断の記録を読むのね。"}, {"t": 61.35, "x": "そうだ。後半ではもう一つ別の判断も見る。"}, {"t": 64.28333333333333, "x": "1973年に、この男へ猟銃の許可を出した判断だ。"}, {"t": 68.63333333333334, "x": "えっ、あの銃は許可されたものだったの？"}, {"t": 71.13333333333334, "x": "許可されていた。それがのちに法律を変える。"}, {"t": 73.81666666666666, "x": "先に一つだけ断っておく。"}, {"t": 75.8, "x": "人質だった人たちの名前と、\n行内のむごい場面は話さない。"}, {"t": 79.75, "x": "残すのは時刻と数、そして判断の記録だ。"}, {"t": 83.41666666666667, "x": "時計を1月26日の午後に戻そう。"}, {"t": 86.01666666666667, "x": "金曜日の午後2時30分ごろだ。"}, {"t": 88.33333333333333, "x": "平日の昼間ね。"}, {"t": 89.75, "x": "そのころ、若い男が北畠支店に押し入った。"}, {"t": 92.9, "x": "手には猟銃。撃ちながら入ってきたと報告にある。"}, {"t": 95.96666666666667, "x": "男は行員に向かって、5000万円を出せと迫った。"}, {"t": 99.4, "x": "昼間の銀行強盗ってこと？"}, {"t": 101.38333333333334, "x": "始まりはそうだ。だが、そこで終わらなかった。"}, {"t": 104.23333333333333, "x": "抵抗した支店長を含む行員2人が撃たれ、亡くなった。"}, {"t": 107.76666666666667, "x": "通報で駆けつけた警察官2人も、撃たれて亡くなった。"}, {"t": 111.35, "x": "ほかに行員3人が、重いけがや軽いけがを負っている。"}, {"t": 114.76666666666667, "x": "……始まってすぐに4人も？"}, {"t": 116.5, "x": "何分の出来事だったかは、報告に書かれていない。"}, {"t": 119.63333333333334, "x": "書かれているのは、そのあと男が何をしたかだ。"}, {"t": 122.53333333333333, "x": "行員と客を人質にとり、1階の事務室に立てこもった。"}, {"t": 126.43333333333334, "x": "逃げずに中に残ったのね。"}, {"t": 128.28333333333333, "x": "残った。銀行の外は、すぐに囲まれていく。"}, {"t": 131.36666666666667, "x": "ここで一つ時刻の計算をしておく。"}, {"t": 133.7, "x": "26日の午後2時30分ごろから、\n28日の午前8時41分まで。"}, {"t": 139.03333333333333, "x": "何時間になるの？"}, {"t": 140.4, "x": "42時間と11分ほどだ。"}, {"t": 142.48333333333332, "x": "報告の言葉では「四十二時間余」。"}, {"t": 144.91666666666666, "x": "警察白書にも「42時間にわたって\n立てこもった」とある。"}, {"t": 149.05, "x": "数字は記録どうしで合ってるのね。"}, {"t": 151.16666666666666, "x": "時間は合っている。ただ、合わない数字もある。"}, {"t": 154.51666666666668, "x": "人質の数だ。"}, {"t": 155.73333333333332, "x": "国会で警察庁が報告した数は、49人だった。"}, {"t": 159.5, "x": "翌年の警察白書には\n「行員及び客43人」と書かれている。"}, {"t": 164.1, "x": "6人も違うじゃない。"}, {"t": 165.6, "x": "違う。どちらが正しいかを決める資料が無い。"}, {"t": 168.26666666666668, "x": "だからこの回では、両方の数字を並べておく。"}, {"t": 171.28333333333333, "x": "数え方が違うのかしら？"}, {"t": 173.08333333333334, "x": "かもしれない。ただ、それも書かれていない。"}, {"t": 175.61666666666667, "x": "書かれていないことは、ここでは埋めない。"}, {"t": 177.9, "x": "白書にはもう一つの数字がある。"}, {"t": 179.96666666666667, "x": "801万円だ。"}, {"t": 181.5, "x": "それは何の額？"}, {"t": 182.76666666666668, "x": "男が行内で奪った現金の額だ。"}, {"t": 185.13333333333333, "x": "求めたのは5000万円。"}, {"t": 186.53333333333333, "x": "手にしたのは801万円。"}, {"t": 188.56666666666666, "x": "でもそのお金、持って出られないわよね。"}, {"t": 191.05, "x": "出られない。外はもう警察が囲んでいた。"}, {"t": 193.68333333333334, "x": "つまり、金はこの事件の中で意味を失っていく。"}, {"t": 196.71666666666667, "x": "残ったのは、銃と人質と、閉ざされた事務室だ。"}, {"t": 200.21666666666667, "x": "閉ざされたってシャッター？"}, {"t": 201.75, "x": "そうだ。犯人は行員にシャッターを下ろさせた。"}, {"t": 204.51666666666668, "x": "外からの目はそこで止まった。"}, {"t": 206.51666666666668, "x": "中で何が起きているか、分からなくなるのね。"}, {"t": 209.41666666666666, "x": "それが、この42時間を通した一番の壁になる。"}, {"t": 212.73333333333332, "x": "壁の話をする前に、警察の側の動きを見ておこう。"}, {"t": 216.76666666666668, "x": "事件を知った大阪府警察本部は、\n特別捜査本部を立てた。"}, {"t": 220.78333333333333, "x": "置いた場所が少し変わっている。"}, {"t": 222.7, "x": "どこ？"}, {"t": 223.38333333333333, "x": "同じ銀行の3階の事務室だ。"}, {"t": 225.63333333333333, "x": "えっ同じ建物の中に？"}, {"t": 227.46666666666667, "x": "そうだ。犯人は1階。捜査本部は3階。"}, {"t": 230.38333333333333, "x": "長は大阪府警の本部長が務めた。"}, {"t": 232.81666666666666, "x": "その下に刑事部長と警備部長がいる。"}, {"t": 235.33333333333334, "x": "刑事と警備両方なのね。"}, {"t": 237.11666666666667, "x": "そうだ。その両方の部長以下、644人が出た。"}, {"t": 240.78333333333333, "x": "車両は113台。これで現場を包囲した。"}, {"t": 243.7, "x": "まわりはすごい人だったでしょうね。"}, {"t": 245.75, "x": "だろう。ただ、人数は中の様子を教えてくれない。"}, {"t": 248.83333333333334, "x": "犯人とのあいだはほんの2つの階だ。"}, {"t": 251.18333333333334, "x": "それでも、1階で何が起きているかは見えない。"}, {"t": 254.06666666666666, "x": "捜査本部が上にあるって、犯人は知ってたの？"}, {"t": 257.0833333333333, "x": "それは記録に無い。分かるのは、\n電話がつながっていたことだ。"}, {"t": 260.81666666666666, "x": "近いのに遠いのね。"}, {"t": 262.26666666666665, "x": "うまい言い方だ。"}, {"t": 263.28333333333336, "x": "のちに国会で、ある議員がこんなことを言っている。"}, {"t": 266.1333333333333, "x": "銀行の建物は、外からの侵入には\n大変堅固に作られている。"}, {"t": 270.31666666666666, "x": "だが中に入り込んで立てこもられると、\n逮捕しがたい構造だ、と。"}, {"t": 274.4, "x": "外からは守れて、中からは守れないのね。"}, {"t": 277.31666666666666, "x": "警察庁の保安部長も、そこを認めている。"}, {"t": 280.1166666666667, "x": "これまでは侵入を防ぐ考え方で指導してきた、と。"}, {"t": 283.43333333333334, "x": "事件を機に、発生したあとの早期鎮圧という\n立場から見直す、と答えた。"}, {"t": 288.81666666666666, "x": "1階の事務室の中を、報告はこう書いている。"}, {"t": 291.76666666666665, "x": "犯人は支店長の席に陣取った。"}, {"t": 294.15, "x": "一番奥の席？"}, {"t": 295.5, "x": "位置までは書かれていない。"}, {"t": 296.8, "x": "書かれているのは、その前だ。"}, {"t": 298.71666666666664, "x": "人質を扇形に並ばせて、人垣を作らせた。"}, {"t": 302.15, "x": "人を盾にしたってこと？"}, {"t": 303.9, "x": "報告の言葉では「人がきをつくらせて」だ。"}, {"t": 306.9, "x": "そして銃口は、いつも人質に向けられていた。"}, {"t": 309.8666666666667, "x": "報告はこう結ぶ。"}, {"t": 311.1333333333333, "x": "「警察は容易に突入できない状況でございました」"}, {"t": 314.31666666666666, "x": "入れば前の人が撃たれるってことね。"}, {"t": 316.68333333333334, "x": "そうなる。入る側の銃が届く前に、人垣がある。"}, {"t": 320.01666666666665, "x": "ここが、この事件の最初の判断の分かれ目だ。"}, {"t": 323.1, "x": "判断？"}, {"t": 323.85, "x": "入るか入らないか。"}, {"t": 325.1666666666667, "x": "入らないならその間に何をするか。"}, {"t": 327.3833333333333, "x": "警察が選んだのは、まず話すことだった。"}, {"t": 330.25, "x": "話すって犯人と？"}, {"t": 331.75, "x": "説得だ。それは少しあとで見る。"}, {"t": 333.96666666666664, "x": "その前に、警察が一番困ったことを聞いておこう。"}, {"t": 337.1166666666667, "x": "刑事局長が、自分の言葉で振り返った場面がある。"}, {"t": 340.6, "x": "役所の報告で振り返り？"}, {"t": 342.4166666666667, "x": "経過を読み上げたあと、局長は\n少し話し方を変えている。"}, {"t": 345.98333333333335, "x": "そこに42時間の空気が出ている。"}, {"t": 348.9, "x": "局長はまずこう言った。"}, {"t": 350.3833333333333, "x": "「非常に困難であった、困ったという点は」"}, {"t": 353.06666666666666, "x": "「シャッターがおりてしまった銀行の内部が」"}, {"t": 355.4166666666667, "x": "「銀行の内部の事情が全く\nわからなくなってしまったということでございます」"}, {"t": 359.9, "x": "一番困ったのは、見えないことだったのね。"}, {"t": 362.7, "x": "建物の作りの問題もあった、と付け足している。"}, {"t": 365.8333333333333, "x": "そしてこう続ける。"}, {"t": 367.1166666666667, "x": "「中でボンボン鉄砲を撃たれるわけでございまして」"}, {"t": 369.8, "x": "「その都度悲鳴が聞こえる」"}, {"t": 371.48333333333335, "x": "……外にいる人には、音しか分からないのね。"}, {"t": 374.26666666666665, "x": "音だけだ。撃たれたのか。"}, {"t": 375.81666666666666, "x": "誰かが倒れたのか。"}, {"t": 377.23333333333335, "x": "報告の言葉では\n「犠牲者が出たのではないか」と毎回思う。"}, {"t": 381.18333333333334, "x": "それが何度も続いたの？"}, {"t": 382.8666666666667, "x": "「その都度」とある。一度ではない。"}, {"t": 384.95, "x": "局長は事件の夜のことをこう言った。"}, {"t": 387.23333333333335, "x": "「当夜はまんじりともできませんでした」"}, {"t": 389.5, "x": "一睡もできなかったってことね。"}, {"t": 391.6, "x": "そういう言葉だ。国会の答弁としては珍しい。"}, {"t": 394.65, "x": "役所の報告は、ふつう数字と時刻で進む。"}, {"t": 397.6333333333333, "x": "その中でここだけ人の声がする。"}, {"t": 399.95, "x": "見えない間ってこわいわね。"}, {"t": 401.6666666666667, "x": "こわい。そして何も決められない。"}, {"t": 403.73333333333335, "x": "中が分からなければ、入る時を選べない。"}, {"t": 406.3333333333333, "x": "だから警察はまず中を知ろうとした。"}, {"t": 408.73333333333335, "x": "どうやって知ったの？"}, {"t": 410.05, "x": "報告には「その後の捜査により」としか\n書かれていない。"}, {"t": 414.0833333333333, "x": "方法は書かれていない。だが、\n分かったことは書かれている。"}, {"t": 417.5, "x": "事務室は密室の状態だった。"}, {"t": 419.56666666666666, "x": "その中で、7人ぐらいが撃たれて倒れている。"}, {"t": 422.4166666666667, "x": "そのうち4人は、すでに亡くなっているようだ。"}, {"t": 425.2, "x": "「ようだ」って、はっきりしないのね。"}, {"t": 427.4, "x": "外からの見立てだからだ。"}, {"t": 428.9, "x": "確かめに入れない。"}, {"t": 430.26666666666665, "x": "報告もそこは「状況が判明した」という\n言い方にとどめている。"}, {"t": 434.3666666666667, "x": "倒れてる人がそのままってこと？"}, {"t": 436.51666666666665, "x": "そのままだ。ここが、あとで大きな批判につながる。"}, {"t": 439.8, "x": "批判？"}, {"t": 440.48333333333335, "x": "けが人を早く出していれば\n助かったのではないか、という声だ。"}, {"t": 444.1666666666667, "x": "それは後半で、国会の言葉のまま紹介する。"}, {"t": 447.18333333333334, "x": "ここで言っておきたいのは、別のことだ。"}, {"t": 449.56666666666666, "x": "中の人数も、倒れた人の数も、\n「ぐらい」と「ようだ」で語られている。"}, {"t": 454.3333333333333, "x": "確かな数が分からないまま？"}, {"t": 456.26666666666665, "x": "分からないまま、判断を重ねていくしかなかった。"}, {"t": 459.3333333333333, "x": "報告はさらに、行内の様子にも触れている。"}, {"t": 462.06666666666666, "x": "犯人の行為を「きわめて残虐」と書いている。"}, {"t": 465.0833333333333, "x": "……どんなことがあったの？"}, {"t": 466.51666666666665, "x": "記録には、具体的なことも書かれている。"}, {"t": 469.1333333333333, "x": "だがそこはこの回では話さない。"}, {"t": 471.1166666666667, "x": "中にいた人たちが、いまもどこかで\n暮らしているかもしれないからだ。"}, {"t": 475.15, "x": "……うん。それでいいと思う。"}, {"t": 476.6666666666667, "x": "ここでは「人質にむごい命令が出された」とだけ\n言っておく。"}, {"t": 480.3333333333333, "x": "警察は、それを外で知っていく立場にいた。"}, {"t": 483.76666666666665, "x": "入れない警察が、最初に選んだ手を見よう。"}, {"t": 486.53333333333336, "x": "報告の言葉では「説得活動を繰り返し行いました」。"}, {"t": 490.31666666666666, "x": "繰り返しってことは何回も？"}, {"t": 492.25, "x": "回数は書かれていない。"}, {"t": 493.53333333333336, "x": "「繰り返し」だけだ。"}, {"t": 494.96666666666664, "x": "犯人の答えも報告に残っている。"}, {"t": 497.25, "x": "警察が来たら、人質を一人ずつ\n順番に手にかける、と。"}, {"t": 501.23333333333335, "x": "……それじゃ近づけないじゃない。"}, {"t": 502.8666666666667, "x": "近づけない。犯人はこれで説得を拒み続けた。"}, {"t": 506.06666666666666, "x": "ここで警察の判断を整理してみる。"}, {"t": 508.35, "x": "入れば人垣の誰かが撃たれる。"}, {"t": 510.3833333333333, "x": "近づくだけでも、犯人は人質を狙うと言っている。"}, {"t": 513.6666666666666, "x": "かといって、何もしなければ、\n中の時間だけが過ぎる。"}, {"t": 517.2166666666667, "x": "どれを選んでも危ないのね。"}, {"t": 518.9666666666667, "x": "そうだ。だから説得は続けるしかなかった。"}, {"t": 521.7666666666667, "x": "ただ、説得には一つ足りないものがあった。"}, {"t": 524.6833333333333, "x": "何が足りないの？"}, {"t": 525.95, "x": "相手が誰なのかが分からない。"}, {"t": 527.7166666666667, "x": "名前も、年も、どんな人生を送ってきたかも。"}, {"t": 530.9166666666666, "x": "知らない人を説得するのって、難しそう。"}, {"t": 533.8666666666667, "x": "難しい。何に触れれば話が\n通じるのか、手がかりが無い。"}, {"t": 537.55, "x": "その手がかりは、思いがけない所からやってくる。"}, {"t": 540.55, "x": "大阪から遠く離れた岐阜県の駅前だ。"}, {"t": 543.2833333333333, "x": "岐阜？ どうしてそんな所から？"}, {"t": 545.4166666666666, "x": "一人の男がテレビを見ていたからだ。"}, {"t": 548.3, "x": "事件の夜名古屋に一人の男がいた。"}, {"t": 550.7166666666667, "x": "犯人の友人だ。"}, {"t": 552.0, "x": "その友人がテレビで事件を知った。"}, {"t": 554.2333333333333, "x": "画面に映ってたのが、知り合いだって分かったのね。"}, {"t": 557.35, "x": "そういうことだろう。"}, {"t": 558.3333333333334, "x": "報告では、こうなっている。"}, {"t": 560.1333333333333, "x": "友人は動転のあまり中央線に乗った。"}, {"t": 562.7, "x": "どこへ行くつもりだったの？"}, {"t": 564.3666666666667, "x": "それは書かれていない。"}, {"t": 565.5, "x": "降りたのは多治見の駅だ。"}, {"t": 567.1166666666667, "x": "駅前をうろうろしているところを、\n警察官が呼び止めた。"}, {"t": 570.5666666666667, "x": "職務質問ね。"}, {"t": 571.9166666666666, "x": "そうだ。そこで友人は言った。"}, {"t": 573.85, "x": "「いま銀行強盗やっているのはわしの知った友だち」"}, {"t": 576.85, "x": "……びっくりしたでしょうね、その警察官。"}, {"t": 579.35, "x": "だろうな。多治見署から、すぐ警察庁へ連絡が入った。"}, {"t": 582.95, "x": "これで夜中のうちに、犯人が誰か分かった。"}, {"t": 585.8833333333333, "x": "名前が分かったのね。"}, {"t": 587.35, "x": "名前と、30歳という年と、性格まで分かった。"}, {"t": 590.7333333333333, "x": "局長はこれを\n「大変ありがたかったこと」と言っている。"}, {"t": 594.1166666666667, "x": "説得のつながり、予備知識が得られた、と。"}, {"t": 597.0833333333334, "x": "相手が分かれば、話し方も選べるものね。"}, {"t": 599.9, "x": "そういうことだ。"}, {"t": 600.9, "x": "局長はこれを「非常によかった点」として\n振り返っている。"}, {"t": 604.45, "x": "困った点とよかった点。"}, {"t": 606.05, "x": "報告がこの二つを並べているのは、珍しい。"}, {"t": 609.0833333333334, "x": "反省の報告なのね。"}, {"t": 610.7333333333333, "x": "局長は自分で\n「反省をいたしております」と結んでいる。"}, {"t": 614.2833333333333, "x": "では、分かった相手に警察は何をしたか。"}, {"t": 617.6333333333333, "x": "犯人の身元が分かると、警察は母親を呼び寄せた。"}, {"t": 621.1666666666666, "x": "お母さんに説得してもらうの？"}, {"t": 623.2, "x": "そうだ。報告の言葉では\n「母親による説得を試みました」。"}, {"t": 627.2833333333333, "x": "結果も一行で書かれている。"}, {"t": 629.05, "x": "「これも一切拒否をしたわけでございます」"}, {"t": 631.5166666666667, "x": "……お母さんの声でも、だめだったのね。"}, {"t": 633.8833333333333, "x": "だめだった。"}, {"t": 634.7333333333333, "x": "どんな言葉で、どこから\n呼びかけたのかは、報告に無い。"}, {"t": 638.1833333333333, "x": "だからここは、記録にある二行だけにしておく。"}, {"t": 641.1333333333333, "x": "呼んで断られた。それだけ？"}, {"t": 643.1833333333333, "x": "それだけだ。ただ、この二行の重さは分かる。"}, {"t": 645.9666666666667, "x": "家族の声は説得の最後の手に近い。"}, {"t": 648.4333333333333, "x": "それが拒まれたとき、警察に残る手は何か。"}, {"t": 651.5666666666667, "x": "……入るしかなくなる？"}, {"t": 652.9166666666666, "x": "報告は、ここで警察の構えを書いている。"}, {"t": 655.6, "x": "説得をやめたとは書いていない。"}, {"t": 657.6, "x": "やめなかったの？"}, {"t": 658.8166666666667, "x": "やめていない。説得は最後まで続いている。"}, {"t": 661.4833333333333, "x": "その一方で、もう一つの道も用意していた。"}, {"t": 664.3333333333334, "x": "報告の言葉で言うとこうなる。"}, {"t": 666.2, "x": "「説得活動と並行いたしまして」"}, {"t": 668.45, "x": "「武器使用による犯人の制圧、\n逮捕の機会もうかがっておりました」"}, {"t": 672.6333333333333, "x": "話しながら、撃つ準備もしてたってこと？"}, {"t": 675.3166666666667, "x": "機会をうかがっていた、という書き方だ。"}, {"t": 677.7333333333333, "x": "ここが、この事件で一番大きな判断だと私は思う。"}, {"t": 681.8666666666667, "x": "話すのと、撃つ準備。"}, {"t": 683.3, "x": "どうして両方なの？"}, {"t": 684.7166666666667, "x": "片方だけにすると、もう片方が使えなくなるからだ。"}, {"t": 688.1333333333333, "x": "説得だけに絞れば、相手が\n乗ってこない限り終わらない。"}, {"t": 691.5333333333333, "x": "突入だけに絞れば人垣の前で止まる。"}, {"t": 694.25, "x": "どっちも一本だと行き止まりなのね。"}, {"t": 696.5166666666667, "x": "そうだ。だから二本を同時に持つ。"}, {"t": 698.7, "x": "話して時間をつなぐ。その間に、入れる瞬間を探す。"}, {"t": 702.5833333333334, "x": "入れる瞬間ってどんなとき？"}, {"t": 704.5333333333333, "x": "報告を読むと、条件は一つに絞られている。"}, {"t": 707.4666666666667, "x": "犯人を取り巻く人質の数だ。"}, {"t": 709.7, "x": "人垣が薄くなったとき？"}, {"t": 711.5833333333334, "x": "そういうことになる。"}, {"t": 712.7666666666667, "x": "人垣が厚いうちは、入れば前の人が危ない。"}, {"t": 715.75, "x": "薄くなれば犯人に届く。"}, {"t": 717.6166666666667, "x": "じゃあずっとそれを待ってたのね。"}, {"t": 719.4666666666667, "x": "待っていたとは書かれていない。"}, {"t": 721.1166666666667, "x": "「機会もうかがっておりました」だ。"}, {"t": 723.1666666666666, "x": "ここは記録の言葉のまま受け取っておく。"}, {"t": 725.6666666666666, "x": "でも42時間よ。長すぎない？"}, {"t": 728.05, "x": "長い。外にいる人にとっても長かった。"}, {"t": 730.7, "x": "中にいる人には、さらに長かったはずだ。"}, {"t": 733.5166666666667, "x": "中の人のこと警察はどう見てたの？"}, {"t": 735.9833333333333, "x": "それは、突入の理由のところで出てくる。"}, {"t": 738.5, "x": "その前に、28日の夜明け前に一本の電話があった。"}, {"t": 742.2, "x": "電話？ 誰から？"}, {"t": 743.55, "x": "1階の犯人から3階の捜査本部へだ。"}, {"t": 746.8333333333334, "x": "28日の午前4時30分ごろ。"}, {"t": 749.3, "x": "犯人が、銀行内の捜査本部に電話をかけてきた。"}, {"t": 752.7666666666667, "x": "同じ建物の中なのに電話なのね。"}, {"t": 755.2333333333333, "x": "そうだ。顔は見えない。声だけが届く。"}, {"t": 757.85, "x": "何を言ってきたの？"}, {"t": 759.2, "x": "犯人は、亡くなった警察官2人の拳銃を奪っていた。"}, {"t": 762.8166666666667, "x": "その1丁についてこう言った。"}, {"t": 764.6, "x": "「おまえのとこの拳銃はいかれているやないか」"}, {"t": 767.1333333333333, "x": "……壊れてるって言いたいの？"}, {"t": 768.6833333333333, "x": "そういう意味だ。"}, {"t": 769.6166666666667, "x": "この話は、事件のあと一部の新聞にも出た。"}, {"t": 772.65, "x": "警察官の拳銃が、撃てない\n欠陥品だったのではないか、と。"}, {"t": 776.7333333333333, "x": "それって本当だったの？"}, {"t": 778.35, "x": "警察は確かめている。"}, {"t": 779.8833333333333, "x": "2月1日、大阪府警本部の科学捜査研究所が鑑定した。"}, {"t": 784.1166666666667, "x": "答えは国会でこう報告された。"}, {"t": 786.2333333333333, "x": "「発射機能に何ら異常は認められなかった」"}, {"t": 788.95, "x": "壊れてなかったのね。"}, {"t": 790.4333333333333, "x": "壊れていなかった。質問した\n議員も「一安心」と言っている。"}, {"t": 794.5666666666667, "x": "じゃあ、なんで犯人はそんなことを言ったの？"}, {"t": 797.15, "x": "理由は記録に無い。だから推し量らない。"}, {"t": 799.6166666666667, "x": "ここで分かるのは時刻のほうだ。"}, {"t": 801.4833333333333, "x": "午前4時30分。突入まで、あと4時間ほど。"}, {"t": 804.7, "x": "犯人はその時刻にも、外へ話しかけていた。"}, {"t": 807.7666666666667, "x": "そして外の側もその声を聞いていた。"}, {"t": 810.2166666666667, "x": "夜が明けたらどうなったの？"}, {"t": 811.9333333333333, "x": "報告は、ここから突入の理由を書き始める。"}, {"t": 815.5, "x": "突入の理由として、報告は二つの言葉を挙げている。"}, {"t": 818.9333333333333, "x": "一つ目はこれだ。"}, {"t": 820.1166666666667, "x": "「これ以上放置すると人質の中に\n新たな犠牲が生じるおそれ」"}, {"t": 823.9833333333333, "x": "次の人が撃たれるかもしれない、ってことね。"}, {"t": 826.7333333333333, "x": "そうだ。犯人は気に入らないことがあると撃っていた。"}, {"t": 829.7166666666667, "x": "報告には、脅すための発砲が続いたと書かれている。"}, {"t": 833.0666666666667, "x": "「凶暴の限りを尽くした」とまで書いてある。"}, {"t": 835.7833333333333, "x": "撃つことで、言うことを聞かせてたのね。"}, {"t": 838.2333333333333, "x": "そういう書き方だ。"}, {"t": 839.5, "x": "二つ目は人質の体と心のことだ。"}, {"t": 842.1833333333333, "x": "報告は事務室の状態にも触れている。"}, {"t": 844.5833333333334, "x": "亡くなった同僚が、同じ部屋にそのままにされていた。"}, {"t": 847.95, "x": "……その部屋で2日近く？"}, {"t": 849.65, "x": "報告の言葉では「四十二時間余に及びます監禁」だ。"}, {"t": 853.3833333333333, "x": "そしてこう続く。"}, {"t": 854.5666666666667, "x": "「人質の精神的、肉体的な限界に達している」"}, {"t": 858.2, "x": "限界ね。"}, {"t": 859.1333333333333, "x": "この「限界」が、判断を変えた言葉だと私は読む。"}, {"t": 862.7166666666667, "x": "それまでは、待つことが人質を守ることだった。"}, {"t": 865.75, "x": "だが待つこと自体が、人質を傷つけはじめていた。"}, {"t": 869.2333333333333, "x": "待つのも危なくなったのね。"}, {"t": 871.05, "x": "報告はこの状況を\n「きわめて緊迫した事態」と呼んでいる。"}, {"t": 874.7666666666667, "x": "ただし、ここは私の読み方として言っている。"}, {"t": 877.5666666666667, "x": "報告そのものは、理由を並べているだけだ。"}, {"t": 880.3333333333334, "x": "説得と、制圧の機会。その二本は、まだ並んでいる。"}, {"t": 884.1833333333333, "x": "最後にどっちを選んだの？"}, {"t": 885.8666666666667, "x": "選んだというより条件がそろった。"}, {"t": 888.5333333333333, "x": "1979年1月28日、午前8時41分。"}, {"t": 892.9666666666667, "x": "報告はこの瞬間をこう書いている。"}, {"t": 895.1, "x": "「犯人を取り巻く人質の数が減じましたために」"}, {"t": 898.3, "x": "人垣が薄くなったのね。"}, {"t": 900.1833333333333, "x": "そうだ。最初に話した、あの一言がここで出てくる。"}, {"t": 903.65, "x": "警察は、数名の警察官を事務室に入れた。"}, {"t": 906.8166666666667, "x": "何人？"}, {"t": 907.5666666666667, "x": "「数名」とだけある。"}, {"t": 908.7666666666667, "x": "人数は書かれていない。"}, {"t": 910.25, "x": "犯人はそのとき、銃口を人質に向けていた。"}, {"t": 913.2833333333333, "x": "警察官はその犯人を拳銃で狙撃した。"}, {"t": 916.2, "x": "撃ったのね警察が。"}, {"t": 917.6666666666666, "x": "撃った。そしてその場で、現行犯で逮捕した。"}, {"t": 920.7166666666667, "x": "罪名は強盗殺人と逮捕監禁だ。"}, {"t": 923.3166666666667, "x": "撃って逮捕？"}, {"t": 924.3166666666667, "x": "報告はその順番で書いている。"}, {"t": 926.2666666666667, "x": "ここでもう一度だけ計算をしておく。"}, {"t": 928.4333333333333, "x": "始まりは26日の午後2時30分ごろ。"}, {"t": 931.3166666666667, "x": "終わりは28日の午前8時41分。"}, {"t": 934.2333333333333, "x": "さっきの42時間と11分ね。"}, {"t": 936.6666666666666, "x": "そうだ。説得を続け、二本の道を持ち、\n人垣が薄くなるのを待った時間だ。"}, {"t": 941.8833333333333, "x": "結局何がきっかけだったの？"}, {"t": 943.9666666666667, "x": "記録の言葉では\n「人質の数が減じた」。それに尽きる。"}, {"t": 947.7, "x": "なぜその朝に減ったのかは、報告に書かれていない。"}, {"t": 950.95, "x": "知りたいけど書いてないのね。"}, {"t": 952.7, "x": "書いていない。だから、ここも埋めない。"}, {"t": 954.95, "x": "突入のあと、中に残っていた人たちはどうなったか。"}, {"t": 958.9666666666667, "x": "報告はこう書いている。"}, {"t": 960.4, "x": "「残る人質、二十五名でございましたが、を\n無事に救出」"}, {"t": 964.3333333333334, "x": "25人。最初は49人だったのよね。"}, {"t": 967.3, "x": "国会の報告ではそうだ。"}, {"t": 969.1, "x": "じゃあ残りの24人は？"}, {"t": 970.7833333333333, "x": "ここが記録で言えないところだ。"}, {"t": 972.5833333333334, "x": "途中で外に出た人が何人で、それがいつだったか。"}, {"t": 975.9166666666666, "x": "一次資料には、その内訳が書かれていない。"}, {"t": 978.8, "x": "亡くなった人やけがをした人も、その中に入るのよね。"}, {"t": 982.45, "x": "入るはずだが内訳は分からない。"}, {"t": 984.4166666666666, "x": "だから言えるのはここまでだ。"}, {"t": 986.0666666666667, "x": "最後の突入のとき、犯人の\nそばにいたのは25人だった。"}, {"t": 989.8666666666667, "x": "その25人は無事に救い出された。"}, {"t": 992.2833333333333, "x": "……よかった、って言っていいのかしら。"}, {"t": 994.3, "x": "救出は救出だ。そこは言っていい。"}, {"t": 996.6666666666666, "x": "ただその前に4人が亡くなっている。"}, {"t": 998.8166666666667, "x": "支店長を含む行員2人と、警察官2人だ。"}, {"t": 1002.15, "x": "最初に駆けつけた、あのお巡りさんたちね。"}, {"t": 1004.9666666666667, "x": "そうだ。国会では複数の議員が、\n2人の殉職を悼む言葉を述べている。"}, {"t": 1009.5666666666667, "x": "ある議員は、人質を救うための殉職だったと言った。"}, {"t": 1013.0666666666667, "x": "名前は出さないのよね。"}, {"t": 1014.6166666666667, "x": "出さない。ご家族がいまも暮らしているかもしれない。"}, {"t": 1017.55, "x": "25人も同じだ。名前は記録の外に置いておく。"}, {"t": 1020.9166666666666, "x": "じゃあ撃たれた犯人はどうなったの？"}, {"t": 1022.9833333333333, "x": "それも報告に、時刻つきで書かれている。"}, {"t": 1026.2666666666667, "x": "犯人はすぐに、天王寺の警察病院へ運ばれた。"}, {"t": 1029.55, "x": "そして9時間後の、午後5時43分に死亡した。"}, {"t": 1032.9833333333333, "x": "逮捕されたけど亡くなったのね。"}, {"t": 1035.0333333333333, "x": "そうだ。だからこの事件には裁判が無い。"}, {"t": 1037.7166666666667, "x": "裁判が無いとどうなるの？"}, {"t": 1039.4, "x": "判決文が残らない。"}, {"t": 1040.9166666666667, "x": "ふつうなら、判決が事件の経過を確定させる。"}, {"t": 1044.0333333333333, "x": "何時に何があったか。誰が何をしたか。"}, {"t": 1046.65, "x": "この事件では、それをする場が無かった。"}, {"t": 1049.2166666666667, "x": "じゃあ何が記録になってるの？"}, {"t": 1051.1, "x": "一番まとまっているのが、国会での警察の報告だ。"}, {"t": 1054.5333333333333, "x": "そして翌年と翌々年の警察白書。"}, {"t": 1057.4, "x": "だから今回は国会の言葉が多いのね。"}, {"t": 1060.0333333333333, "x": "そうだ。そしてその報告には、細かな食い違いもある。"}, {"t": 1063.5166666666667, "x": "人質の数が49人と43人。"}, {"t": 1066.3, "x": "白書は「警察官の強行突入に\nより犯人を逮捕し」と書く。"}, {"t": 1070.5, "x": "犯人が亡くなったことは、\n白書の事例欄には書かれていない。"}, {"t": 1074.25, "x": "書き方がいろいろなのね。"}, {"t": 1075.95, "x": "資料ごとに目的が違うからだ。"}, {"t": 1078.0833333333333, "x": "白書は犯罪の傾向を示す本。"}, {"t": 1080.0666666666666, "x": "国会の報告は経過の説明。"}, {"t": 1082.2166666666667, "x": "この回では、それぞれの書き方のまま引いている。"}, {"t": 1085.2166666666667, "x": "記録って一つじゃないのね。"}, {"t": 1087.0833333333333, "x": "一つではない。だから出どころを最後にまとめて言う。"}, {"t": 1090.05, "x": "ここからは事件のあとの話に移る。"}, {"t": 1092.3666666666666, "x": "42時間を、外の人たちはどう見ていたか。"}, {"t": 1096.0166666666667, "x": "事件のあいだ、テレビはこの事件を報じていた。"}, {"t": 1098.8333333333333, "x": "2月2日の衆議院の予算委員会で、ある議員が\nこう話している。"}, {"t": 1102.8, "x": "「四十二時間、二昼夜、この事件が報ぜられました\nテレビの前に私はくぎづけになって」"}, {"t": 1108.1333333333334, "x": "「はらはらしながらとうとう\n二昼夜、朝までこれを見ておった」"}, {"t": 1111.5666666666666, "x": "国会議員が2晩テレビを見てたの？"}, {"t": 1113.9666666666667, "x": "本人がそう言っている。"}, {"t": 1115.3666666666666, "x": "そして「このことは私一人ではない」と続けた。"}, {"t": 1118.7166666666667, "x": "日本中が見てたってことね。"}, {"t": 1120.6166666666666, "x": "そういう意味だろう。"}, {"t": 1121.7, "x": "思い出してほしい。犯人の友人も、\nテレビで事件を知った。"}, {"t": 1125.4833333333333, "x": "あ、多治見の駅の人ね。"}, {"t": 1127.2833333333333, "x": "そうだ。大勢が見ていたから、身元が分かった。"}, {"t": 1130.25, "x": "テレビは、この事件では手がかりにもなっている。"}, {"t": 1132.9666666666667, "x": "突入の翌日、29日には衆議院の本会議が開かれた。"}, {"t": 1137.0166666666667, "x": "ある議員は、亡くなった4人の冥福を祈ると述べた。"}, {"t": 1140.1666666666667, "x": "そして銃の許可をもっと厳しくするよう求めた。"}, {"t": 1143.0333333333333, "x": "答えたのは、大平正芳 内閣総理大臣だ。"}, {"t": 1146.3833333333334, "x": "別の議員にこの事件の受け止めを\n聞かれ、総理はこう答えた。"}, {"t": 1150.0833333333333, "x": "「いわば経済至上主義の\nもたらした痛ましい悲劇である」"}, {"t": 1153.3833333333334, "x": "経済のせいってこと？"}, {"t": 1154.9166666666667, "x": "総理の受け止めとしてそう言った。"}, {"t": 1156.8666666666666, "x": "そのあとに、文化と人間性を重んじる\n必要を痛切に感じる、と続けている。"}, {"t": 1161.8666666666666, "x": "ずいぶん大きな話になったのね。"}, {"t": 1164.0333333333333, "x": "事件はすぐに、社会全体の話として語られはじめた。"}, {"t": 1167.7166666666667, "x": "だがその中に、警察の判断を問う声もあった。"}, {"t": 1171.4333333333334, "x": "2月15日。衆議院の地方行政委員会。"}, {"t": 1174.3666666666666, "x": "ある議員が世間の声をこう紹介した。"}, {"t": 1176.6833333333334, "x": "「なまぬるいとか」"}, {"t": 1177.75, "x": "「なぜもっと早く犯人を射殺しなかったのか」"}, {"t": 1180.55, "x": "「負傷者を早期に救出していれば\n一命を取りとめたのではないか」"}, {"t": 1184.4333333333334, "x": "……厳しい声ね。"}, {"t": 1185.55, "x": "議員はこういう「うわさがたくさんある」と言っている。"}, {"t": 1188.5666666666666, "x": "その議員自身はどう思ってたの？"}, {"t": 1190.6166666666666, "x": "自分の考えも述べている。"}, {"t": 1192.3, "x": "人質の命を守ることを第一にした\n対応は、おおむねやむを得ない。"}, {"t": 1196.35, "x": "「やむを得ざる措置だということで了解ができる」"}, {"t": 1199.0333333333333, "x": "世間の声と議員の考えは違ったのね。"}, {"t": 1201.6666666666667, "x": "違う。この回でも、どちらが正しいかは決めない。"}, {"t": 1204.8333333333333, "x": "決めないの？"}, {"t": 1205.7666666666667, "x": "決める材料が、外にいる私たちには無い。"}, {"t": 1208.5333333333333, "x": "中が見えなかったのは、\nあのときの警察だけではない。"}, {"t": 1211.7333333333333, "x": "いま記録を読む私たちにも、事務室の中は見えない。"}, {"t": 1215.2, "x": "……そうね。"}, {"t": 1215.9333333333334, "x": "ただ、問いそのものは記録に残しておく価値がある。"}, {"t": 1218.9833333333333, "x": "早く入れば助かった人がいたのか。"}, {"t": 1221.35, "x": "早く入れば、人垣の誰かが撃たれたのか。"}, {"t": 1224.3333333333333, "x": "どっちも誰にも確かめられないのね。"}, {"t": 1226.65, "x": "確かめられない。だから問いが消えない。"}, {"t": 1228.9166666666667, "x": "この問いは、1年後の国会でも別の形で出てくる。"}, {"t": 1232.3166666666666, "x": "それは最後のほうで見る。"}, {"t": 1233.7833333333333, "x": "その前にもう一つの判断に移ろう。"}, {"t": 1236.1, "x": "1973年の猟銃の許可だ。"}, {"t": 1239.3833333333334, "x": "犯人が使った猟銃は、盗んだものではない。"}, {"t": 1242.2666666666667, "x": "本人が、正式に所持の許可を受けた銃だった。"}, {"t": 1245.4333333333334, "x": "許可って誰が出すの？"}, {"t": 1246.9333333333334, "x": "都道府県の公安委員会だ。"}, {"t": 1248.6333333333334, "x": "実際の調べは警察が行う。"}, {"t": 1250.7833333333333, "x": "犯人が大阪で申請したのは、1973年の5月29日。"}, {"t": 1255.55, "x": "許可が出たのはその2か月後だった。"}, {"t": 1257.8833333333334, "x": "その2か月で何を調べたの？"}, {"t": 1259.9166666666667, "x": "警察庁の保安部長は、国会でこう答えている。"}, {"t": 1263.0166666666667, "x": "名前で照会すると、少年時代の記録が出てきた。"}, {"t": 1266.3333333333333, "x": "15歳のときの窃盗。そして強盗殺人。"}, {"t": 1269.35, "x": "……15歳で？"}, {"t": 1270.3666666666666, "x": "そうだ。少年院に送られている。"}, {"t": 1272.5, "x": "法務省の矯正局長は、在院は\n合わせて506日だったと述べた。"}, {"t": 1276.9333333333334, "x": "その記録警察は分かってたのね。"}, {"t": 1279.0833333333333, "x": "前歴を知ってて、どうして許可が出るのよ。"}, {"t": 1281.8, "x": "そこが国会で一番問われた点だ。"}, {"t": 1284.0333333333333, "x": "ある議員は、健全な常識からすれば\n当然疑問を抱く、と述べている。"}, {"t": 1288.2833333333333, "x": "警察も前歴は分かっていた。だから\n調べを重ねた、と保安課長は言う。"}, {"t": 1292.7166666666667, "x": "ただ、ほかに出てきたのは\n道路交通法のスピード違反1件だった。"}, {"t": 1296.8333333333333, "x": "それ以外は何も無かったの？"}, {"t": 1298.7, "x": "ふだんの暮らしぶりに、\n目立つものは見つからなかった。"}, {"t": 1301.8166666666666, "x": "そこで窓口はある手を打っている。"}, {"t": 1303.85, "x": "どんな手？"}, {"t": 1304.7166666666667, "x": "申請を取り下げたらどうか、と数回勧めた。"}, {"t": 1307.6, "x": "保安課長の言葉では「取り下げの指導を\n数回やったやに聞いております」。"}, {"t": 1311.8666666666666, "x": "でも取り下げなかったのね。"}, {"t": 1313.6, "x": "取り下げなかった。そして保安課長は、\nこう付け加えている。"}, {"t": 1317.2, "x": "「これは法令上の根拠があるものではございません」"}, {"t": 1320.0166666666667, "x": "勧めることはできても、止められなかったのね。"}, {"t": 1323.45, "x": "止めるには、法律の言葉に当てはめる必要があった。"}, {"t": 1326.7333333333333, "x": "銃刀法の第5条だ。\n許可をしてはならない人を並べている。"}, {"t": 1330.35, "x": "その中にこういう一文がある。"}, {"t": 1332.1833333333334, "x": "「他人の生命若しくは財産又は公共の安全を害する\nおそれがあると認めるに足りる相当な理由がある者」"}, {"t": 1338.45, "x": "長いわね。要するに？"}, {"t": 1340.1166666666666, "x": "危ないと言える、きちんとした理由がある人だ。"}, {"t": 1342.85, "x": "保安部長は、ここで判断がつかなかったと答えた。"}, {"t": 1346.0666666666666, "x": "「相当な理由がある」というところまでは、\n言い切れなかった、と。"}, {"t": 1349.85, "x": "15歳の前歴だけじゃ、足りなかったってこと？"}, {"t": 1352.8666666666666, "x": "当時の大阪の判断ではそうなる。"}, {"t": 1354.9833333333333, "x": "前歴から10年近くたち、ほかに目立つ記録が無い。"}, {"t": 1358.3666666666666, "x": "そこで許可を出した。"}, {"t": 1359.8166666666666, "x": "……あとから見ると怖い判断ね。"}, {"t": 1361.75, "x": "保安部長も、結果から見て\n「きわめて遺憾」と言っている。"}, {"t": 1365.3, "x": "もう一つ、国会で明らかになったことがある。"}, {"t": 1368.15, "x": "少年鑑別所などが作った報告書のことだ。"}, {"t": 1371.25, "x": "鑑別所の報告書？"}, {"t": 1372.8833333333334, "x": "少年時代の性格や見立てを書いたものだ。"}, {"t": 1375.5333333333333, "x": "新聞にはその中身が報じられていた。"}, {"t": 1377.8833333333334, "x": "だが保安部長はこう答えている。"}, {"t": 1379.8166666666666, "x": "その報告書は配る先が限られていて、\n許可の担当者がふつう見る機会は無かった。"}, {"t": 1384.8666666666666, "x": "大阪府警も、この報告は承知していなかった。"}, {"t": 1388.05, "x": "見られない資料があったのね。"}, {"t": 1389.8333333333333, "x": "そうだ。しかもそれには理由があった。"}, {"t": 1392.1, "x": "少年の記録を、少年を守る以外の目的に\n使ってよいのか、という問題だ。"}, {"t": 1397.0333333333333, "x": "2月15日の委員会では、ある議員が\n別の角度から迫っている。"}, {"t": 1401.0833333333333, "x": "銃刀法の第3条は、まず\n「所持してはならない」と書いている。"}, {"t": 1405.0333333333333, "x": "持たせないのが原則で、許可は例外のはずだ、と。"}, {"t": 1408.3333333333333, "x": "断る理由が無ければ許可する、じゃないのね。"}, {"t": 1411.1666666666667, "x": "議員は、警察がそう思い込む傾向が強いと指摘した。"}, {"t": 1414.65, "x": "国家公安委員長は重大な点だと\n受け止め、根本から見直すと答えた。"}, {"t": 1419.8166666666666, "x": "2月20日の衆議院法務委員会で、\nこの点がはっきり語られた。"}, {"t": 1423.8333333333333, "x": "法務省の刑事局長が、線の引き方を説明している。"}, {"t": 1427.45, "x": "少年のときの罪は、刑を終えれば\n大人になってから前科として扱わない。"}, {"t": 1431.9666666666667, "x": "それが少年法の考え方なのね。"}, {"t": 1434.35, "x": "そうだ。人格が固まる前の過ちが、\n立ち直りの邪魔にならないように。"}, {"t": 1438.75, "x": "局長は、だから許可や資格を拒む\n理由にはできない、と言った。"}, {"t": 1442.7666666666667, "x": "じゃあ銃の許可も拒めないの？"}, {"t": 1444.65, "x": "そこで局長は、もう一つの考え方を出した。"}, {"t": 1447.7333333333333, "x": "銃の許可は「今日ただいま危険性を\n有するかどうか」を問うものだと。"}, {"t": 1451.7833333333333, "x": "その判断に、過去の事実を全く\n無視するわけにはいかない。"}, {"t": 1455.55, "x": "前科として扱わないけど、危ないか\nどうかを見るときには見る？"}, {"t": 1459.3333333333333, "x": "そういう線の引き方だ。"}, {"t": 1460.9166666666667, "x": "同じ日の参議院では、法務大臣もこう話している。"}, {"t": 1464.15, "x": "結果論だが、許可を与えたところに\n一番の問題があったのではないか。"}, {"t": 1468.4333333333334, "x": "大臣がそこまで言ったのね。"}, {"t": 1470.3166666666666, "x": "言った。ただ、続けてこうも言っている。"}, {"t": 1472.7333333333333, "x": "少年時代に罪を犯しても、\nまともになる人はたくさんいる。"}, {"t": 1476.45, "x": "なるべくなら社会に戻してやりたい。"}, {"t": 1478.6, "x": "「しょせんケース・バイ・ケース」で、\n良心的に決めるほかない、と。"}, {"t": 1482.8, "x": "……難しいわね。"}, {"t": 1483.95, "x": "難しい。だからこの問いは、法律の形になっていく。"}, {"t": 1487.4166666666667, "x": "ただ、その前に警察は、\nすぐにできることから手をつけた。"}, {"t": 1491.2666666666667, "x": "すぐっていつ？"}, {"t": 1492.3333333333333, "x": "事件の翌日だ。まだ人質が中にいた日のことだ。"}, {"t": 1496.4333333333334, "x": "1月27日。北畠支店のシャッターは、まだ下りていた。"}, {"t": 1500.5166666666667, "x": "その日のうちに、全国の都道府県へ指示が出ている。"}, {"t": 1503.8166666666666, "x": "どんな指示？"}, {"t": 1504.7666666666667, "x": "国家公安委員長は、国会でこう説明した。"}, {"t": 1507.7333333333333, "x": "凶悪な前歴がある人への銃の許可は、\n当分の間留保しなさい。"}, {"t": 1511.7833333333333, "x": "許可のやり方は厳しくしなさい。"}, {"t": 1513.9166666666667, "x": "まだ事件が終わってないのに？"}, {"t": 1515.75, "x": "終わっていない。そこが目を引く。"}, {"t": 1517.65, "x": "保安課長の説明では、指示は三つあった。"}, {"t": 1520.4, "x": "一つ目。27日の時点で出ている\n申請のうち、暴力的な前歴がある人は保留。"}, {"t": 1525.9, "x": "二つ目。すでに許可を持つ\n人の中の前歴者を、調べ直す。"}, {"t": 1529.9666666666667, "x": "三つ目。審査を全体に、いっそう厳しくする。"}, {"t": 1533.15, "x": "持ってる人をもう一度調べるのね。"}, {"t": 1535.35, "x": "数がすごいぞ。"}, {"t": 1536.3666666666666, "x": "国家公安委員長によると、\n散弾銃の許可だけで70万丁を超えていた。"}, {"t": 1541.0666666666666, "x": "70万丁！"}, {"t": 1542.25, "x": "しかも1年に1000丁以上が、\n行方の分からない銃になっていた。"}, {"t": 1546.2, "x": "そっちのほうが怖いじゃない。"}, {"t": 1547.9, "x": "委員長も、許可の基準を厳しくするだけで\n足りるのか、と自分で問うている。"}, {"t": 1552.3333333333333, "x": "では締めた結果はどうだったか。"}, {"t": 1554.2, "x": "翌年2月の国会で、保安課長が数字を出した。"}, {"t": 1557.5333333333333, "x": "許可の規制を厳しくした結果、\n1979年度に2万丁ほど減った。"}, {"t": 1562.6333333333334, "x": "減ったのね。"}, {"t": 1563.65, "x": "白書の数字でも、同じ向きが見える。"}, {"t": 1566.0333333333333, "x": "1979年の末に許可を受けていた猟銃は72万5748丁。"}, {"t": 1571.6, "x": "それまで年々増えていたのが、\nこの年は1975年ごろの数まで戻った。"}, {"t": 1576.65, "x": "減った。その間に、警察はもう\n一つ大きな調べをしている。"}, {"t": 1581.1666666666667, "x": "3月2日の衆議院の予算委員会の分科会だ。"}, {"t": 1584.3333333333333, "x": "警察庁の保安課長が、調べの進み具合を答えている。"}, {"t": 1587.9333333333334, "x": "銃を持っている人はおよそ58万人。"}, {"t": 1590.55, "x": "58万人を全部調べるの？"}, {"t": 1592.75, "x": "手持ちの資料から、前歴のある人を選び出していた。"}, {"t": 1596.0, "x": "ただ、その時点でまだ半分にも届いていない、と言う。"}, {"t": 1599.4166666666667, "x": "数が多すぎるのね。"}, {"t": 1600.85, "x": "そこで、もう一つのやり方を使うことにした。"}, {"t": 1603.7833333333333, "x": "4月1日から30日まで、全国いっせいの検査だ。"}, {"t": 1607.55, "x": "いっせいってどうやるの？"}, {"t": 1608.9666666666667, "x": "持ち主に知らせて、銃を持って警察へ来てもらう。"}, {"t": 1612.0833333333333, "x": "毎年やってきた検査だが、この年は中身を変えた。"}, {"t": 1615.35, "x": "課長は、大阪の事件の反省と\n教訓を踏まえる、と言っている。"}, {"t": 1619.2333333333333, "x": "重点は三つだ。"}, {"t": 1620.4333333333334, "x": "欠格に当たる人の事情を、よく見ること。"}, {"t": 1623.1333333333334, "x": "銃がどう保管されているかを、確かめること。"}, {"t": 1625.85, "x": "そして弾まで調べること。"}, {"t": 1627.7, "x": "弾まで見るのね。"}, {"t": 1628.9666666666667, "x": "課長の言葉では「時節柄相当徹底した形で」。"}, {"t": 1632.4166666666667, "x": "委員長も同じ場で、あの事件を\n「貴重な教訓」と呼んだ。"}, {"t": 1636.1666666666667, "x": "みんな「教訓」って言うのね。"}, {"t": 1638.1333333333334, "x": "言う。だが教訓は、言葉だけでは形にならない。"}, {"t": 1641.25, "x": "検査の結果も使いながら、\n許可の仕組みそのものの見直しが進む。"}, {"t": 1645.3666666666666, "x": "5月の参議院では、保安部長が\n一斉検査も使って調べている、と答えた。"}, {"t": 1650.1666666666667, "x": "そしてもう一つ、\n銃の話だけでは終わらない動きがあった。"}, {"t": 1654.4333333333334, "x": "1979年は、銀行を狙う強盗が続いた年でもある。"}, {"t": 1658.6166666666666, "x": "翌年の警察白書に数字が出ている。"}, {"t": 1661.1166666666666, "x": "金融機関を狙った強盗は、この年121件。"}, {"t": 1664.6166666666666, "x": "多いの？"}, {"t": 1665.3333333333333, "x": "過去10年で最高だ。"}, {"t": 1666.6666666666667, "x": "前の年より53件増えている。"}, {"t": 1668.8666666666666, "x": "そのうち銃を使ったものが8件。"}, {"t": 1670.8333333333333, "x": "人質をとったものが27件。"}, {"t": 1673.1833333333334, "x": "人質の事件が27件も？"}, {"t": 1675.45, "x": "白書は「著しく凶悪化」と書いている。"}, {"t": 1678.35, "x": "国会でも、事件のあと\n連鎖のように続いたと言う議員がいた。"}, {"t": 1682.1166666666666, "x": "まねされたってこと？"}, {"t": 1683.5, "x": "議員の見方としては、そういう言葉が出ている。"}, {"t": 1686.3, "x": "ここは議員の発言として紹介するだけにする。"}, {"t": 1689.1666666666667, "x": "警察の側は銀行の作りに目を向けた。"}, {"t": 1691.75, "x": "2月には、金融機関と関係する\n役所に警備の強化を求めた。"}, {"t": 1695.8666666666666, "x": "5月には、銀行の防犯の基準を全部見直した。"}, {"t": 1699.2, "x": "どう変わったの？"}, {"t": 1700.3166666666666, "x": "専門の警備員を置く。"}, {"t": 1701.6333333333334, "x": "防犯カメラを付ける。"}, {"t": 1703.0833333333333, "x": "非常のときの通報の仕組みを整える。"}, {"t": 1705.4666666666667, "x": "カウンターの作りも変える。"}, {"t": 1707.15, "x": "あの日の見えなかった1階の話ね。"}, {"t": 1709.55, "x": "そうだ。中が見えなかった\n反省が、ここにつながっている。"}, {"t": 1713.0833333333333, "x": "外から守るだけでなく、中で起きたときにどうするか。"}, {"t": 1716.4333333333334, "x": "保安部長が言った「早期鎮圧」の考え方だ。"}, {"t": 1719.8166666666666, "x": "建物の作りまで変えるのね。"}, {"t": 1721.85, "x": "そして法律も変わる。次はその話だ。"}, {"t": 1725.1666666666667, "x": "1980年、銃刀法を改める法案が国会に出された。"}, {"t": 1729.3333333333333, "x": "先に審議したのは参議院だ。"}, {"t": 1731.3, "x": "3月の参議院で、警察庁長官は\n改正の背景をこう述べた。"}, {"t": 1735.3833333333334, "x": "銀行強盗や人質事件という形の凶悪な\n犯罪が、相変わらず絶えない、と。"}, {"t": 1740.4, "x": "3月25日の参議院地方行政委員会で、\n全会一致で可決された。"}, {"t": 1745.1, "x": "5月9日には、衆議院の本会議で\n委員長がこう報告している。"}, {"t": 1749.2333333333333, "x": "「昨年一月の三菱銀行における猟銃強盗殺人事件等」"}, {"t": 1753.4, "x": "事件の名前が、法律の理由に入ったのね。"}, {"t": 1756.3666666666666, "x": "入った。中身は大きく四つある。"}, {"t": 1758.5666666666666, "x": "一つ目。銃などで殺人や傷害などの凶悪な\n行為をした人には、10年間許可しない。"}, {"t": 1764.25, "x": "10年？"}, {"t": 1764.9833333333333, "x": "ここに、この事件の数字が関わっている。"}, {"t": 1767.5666666666666, "x": "保安部長の説明はこうだ。"}, {"t": 1769.3333333333333, "x": "大阪の事件の犯人は、凶悪な前歴から\n10年たたないうちに許可を受けていた。"}, {"t": 1774.35, "x": "だから10年という線なのね。"}, {"t": 1776.3166666666666, "x": "それだけではない。\n一生持たせるべきでない、という意見も出た。"}, {"t": 1779.95, "x": "保安部長の答えはこうだった。"}, {"t": 1781.8166666666666, "x": "死ぬまでだめだという決まりは、\n法律の作りになじまない。"}, {"t": 1785.2, "x": "前科が消える年数との釣り合いもある。"}, {"t": 1787.4333333333334, "x": "だから「最大限十年」で線を引いたと。"}, {"t": 1790.3333333333333, "x": "一生じゃなくて10年。"}, {"t": 1791.8333333333333, "x": "そうだ。二つ目以降も見ておく。"}, {"t": 1793.9333333333334, "x": "銃の不法所持で罰金以上になった\n人などの欠格は、3年から5年に延びた。"}, {"t": 1798.9, "x": "練習用の銃は、射撃場に\n備え付けた物を使うことになった。"}, {"t": 1802.9333333333334, "x": "保管の基準を定め、警察職員が\n立ち入って調べられるようになった。"}, {"t": 1807.2, "x": "そして3年以上使っていない\n「眠り銃」は、許可を取り消せる。"}, {"t": 1811.3666666666666, "x": "持ってるだけの銃もだめになるのね。"}, {"t": 1813.5666666666666, "x": "法律は5月21日に公布された。"}, {"t": 1816.1166666666666, "x": "許可の基準の部分は6月21日、\n残りは11月21日から動き出した。"}, {"t": 1821.6333333333334, "x": "事件から1年ちょっとね。"}, {"t": 1823.45, "x": "シャッターが下りた日から、1年と4か月ほどだ。"}, {"t": 1827.1, "x": "この法案の審議の中で、あの問いがもう一度出てくる。"}, {"t": 1830.3666666666666, "x": "1980年5月8日。"}, {"t": 1832.3833333333334, "x": "衆議院の地方行政委員会だ。"}, {"t": 1834.4833333333333, "x": "ある議員が、警察の構えそのものを問うた。"}, {"t": 1837.2666666666667, "x": "構えって？"}, {"t": 1838.2166666666667, "x": "銃を持つ人を\n減らすことばかりでいいのか、という問いだ。"}, {"t": 1841.4333333333334, "x": "議員はこう言っている。"}, {"t": 1842.65, "x": "これまでの方針は、極力荒っぽいことは\n避けるものだったようだ。"}, {"t": 1846.5, "x": "それが、かえって犠牲を多くしているのではないか。"}, {"t": 1849.3, "x": "銃を使う凶悪犯には、思い切った\n手を打つ方向に変えたらどうか、と。"}, {"t": 1853.7166666666667, "x": "もっと早く撃てってこと？"}, {"t": 1855.4, "x": "そこまでの言葉ではないが、向きはそちらだ。"}, {"t": 1858.1166666666666, "x": "1年前の「なまぬるい」という声と向きが似ている。"}, {"t": 1861.3833333333334, "x": "警察はどう答えたの？"}, {"t": 1863.0, "x": "答えたのは保安部長だ。"}, {"t": 1864.5833333333333, "x": "まず「日本的な社会事情というのも\n背景にある」と言った。"}, {"t": 1868.3166666666666, "x": "「一概にヨーロッパ、アメリカスタイルにはいかない」"}, {"t": 1871.2666666666667, "x": "外国とは違うってことね。"}, {"t": 1873.1833333333334, "x": "続けてこうも言っている。"}, {"t": 1874.6333333333334, "x": "「銃を使うべきときにはこれは当然使うべき」"}, {"t": 1877.3666666666666, "x": "そしてあの事件のことに触れた。"}, {"t": 1879.3333333333333, "x": "「一つの大変貴重な経験と教訓」"}, {"t": 1881.7666666666667, "x": "その後も内部で大変研究し、議論している、と。"}, {"t": 1885.0833333333333, "x": "答えは出なかったのね。"}, {"t": 1886.6666666666667, "x": "はっきりした線は、ここでは出ていない。"}, {"t": 1888.9666666666667, "x": "銃の許可には10年という線が引かれた。"}, {"t": 1891.4166666666667, "x": "だが、いつ入るかという線は、\n法律の文字にはならなかった。"}, {"t": 1895.2666666666667, "x": "それは現場で決めるしかないのね。"}, {"t": 1897.3666666666666, "x": "1979年の1月も、現場が決めた。"}, {"t": 1900.5666666666666, "x": "午前8時41分に。"}, {"t": 1903.0333333333333, "x": "最後に、今回の話の出どころをまとめておく。"}, {"t": 1906.0, "x": "事件の経過の大もとは、\n1979年2月1日の衆議院地方行政委員会 第1号。"}, {"t": 1912.25, "x": "警察庁の刑事局長の報告だ。"}, {"t": 1914.6166666666666, "x": "拳銃の鑑定と「なまぬるい」の声は、\n2月15日の同じ委員会 第3号。"}, {"t": 1919.7333333333333, "x": "許可の申請日と鑑別所の報告書の話は、\n2月14日の参議院決算委員会 第1号。"}, {"t": 1925.7666666666667, "x": "取り下げの指導と法務大臣の言葉は、\n2月20日の参議院法務委員会 第3号。"}, {"t": 1931.0666666666666, "x": "少年法と危険性の話は、\n同じ日の衆議院法務委員会 第2号。"}, {"t": 1935.5833333333333, "x": "テレビの二昼夜は、\n2月2日の衆議院予算委員会 第3号。"}, {"t": 1939.6666666666667, "x": "総理の答弁は、1月29日の衆議院本会議 第3号。"}, {"t": 1943.85, "x": "10年の線と1年後の問いは、\n1980年5月8日の衆議院地方行政委員会 第20号。"}, {"t": 1950.3833333333334, "x": "法案の中身は、5月9日の衆議院本会議 第23号。"}, {"t": 1954.6, "x": "42時間と43人と801万円は、昭和55年の警察白書。"}, {"t": 1959.7166666666667, "x": "公布と施行の日は、昭和56年の警察白書だ。"}, {"t": 1963.3666666666666, "x": "全部国の記録なのね。"}, {"t": 1965.1, "x": "国会会議録と白書は、どちらも誰でも読める。"}, {"t": 1968.2, "x": "話さずにおいたことも、ここで挙げておく。"}, {"t": 1970.6833333333334, "x": "中にいた人の名前。亡くなった\n人の名前。犯人の名前。"}, {"t": 1974.55, "x": "事務室の中で起きたむごい場面。"}, {"t": 1976.5666666666666, "x": "途中で外に出た人の数と時刻。"}, {"t": 1978.7333333333333, "x": "突入した警察官の人数。"}, {"t": 1980.9166666666667, "x": "それは記録に無いから？"}, {"t": 1982.4833333333333, "x": "名前と場面は、配慮で外した。"}, {"t": 1984.5333333333333, "x": "数と時刻は、一次資料で確かめられなかった。"}, {"t": 1987.6333333333334, "x": "警察の判断が正しかったかどうかも、決めていない。"}, {"t": 1991.55, "x": "ねえ、最初のシャッターの話に戻っていい？"}, {"t": 1994.2333333333333, "x": "いいぞ。"}, {"t": 1994.9, "x": "42時間って聞いたとき、長いって思ったの。"}, {"t": 1997.9333333333334, "x": "でも今は、短かったのかもって少し思う。"}, {"t": 2000.85, "x": "どうしてそう思った？"}, {"t": 2002.2333333333333, "x": "だって中が見えないまま、\n二本の道を持って待ってたんでしょ。"}, {"t": 2005.7666666666667, "x": "入るのが1時間早かったら、\nどうなってたか分からない。"}, {"t": 2009.2333333333333, "x": "そうだな。1時間遅くても、分からない。"}, {"t": 2011.9333333333334, "x": "記録に残っているのは、選ばれた一つの時刻だけだ。"}, {"t": 2015.35, "x": "28日の朝の8時41分という時刻だ。"}, {"t": 2018.6, "x": "その手前には、42時間分の「まだ」が\n積み重なっている。"}, {"t": 2022.8, "x": "まだ入らないまだ待つってこと？"}, {"t": 2024.8166666666666, "x": "そうだ。説得が拒まれてもまだ話す。"}, {"t": 2027.4333333333334, "x": "母親の声が届かなくても、まだ機会をうかがう。"}, {"t": 2030.5333333333333, "x": "そして人垣が薄くなった一瞬に、\nそれが「いま」に変わった。"}, {"t": 2034.7333333333333, "x": "……決めた人たちも、眠れない夜を過ごしたのね。"}, {"t": 2037.7833333333333, "x": "局長は、最初の夜をそう振り返っていた。"}, {"t": 2040.5166666666667, "x": "もう一つの判断も同じ形をしている。"}, {"t": 2043.0666666666666, "x": "1973年の初夏、窓口は取り下げを勧めていた。"}, {"t": 2047.0833333333333, "x": "だが法律の上では、そこで止める言葉が無かった。"}, {"t": 2050.3333333333335, "x": "だから、10年という線が引かれたのね。"}, {"t": 2052.983333333333, "x": "そうだ。一つは時刻で、一つは\n年数で、線が引かれた。"}, {"t": 2056.9166666666665, "x": "あなたなら、どちらの判断のほうが\n難しいと思うだろうか。"}, {"t": 2060.4, "x": "あの朝の8時41分か。それとも1973年の許可か。"}, {"t": 2064.95, "x": "どちらだと感じたか、コメント欄で\n教えてもらえるとうれしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
