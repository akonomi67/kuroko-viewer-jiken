<script>
const D={"name": "140", "file": "140_編集用", "dur": 2158.41665625, "segs": [], "subs": [{"t": 0.0, "x": "1948年1月12日の夜、東京の新宿で、\n警察官が1台の自転車に目を留めた。"}, {"t": 6.65, "x": "乗っていたのは葬儀屋の男だ。"}, {"t": 8.55, "x": "後ろの荷台に箱が積んである。"}, {"t": 10.433333333333334, "x": "中にいたのは亡くなった赤ちゃんだった。"}, {"t": 12.85, "x": "赤ちゃん？何人も入ってたの？"}, {"t": 14.966666666666667, "x": "4人とも5人とも書かれている。"}, {"t": 17.033333333333335, "x": "最初の人数から揃わないの？"}, {"t": 19.083333333333332, "x": "揃わない。しかも男は、\n区役所の埋葬許可証を持っていた。"}, {"t": 22.95, "x": "書類に不備は1つもない。"}, {"t": 24.733333333333334, "x": "じゃあその場で捕まえられないのね。"}, {"t": 26.766666666666666, "x": "止める理由が無かった。"}, {"t": 28.2, "x": "赤ちゃんが運び出された先は、牛込柳町の寿産院だ。"}, {"t": 32.28333333333333, "x": "占領軍の報告書にはこう書いてある。"}, {"t": 34.61666666666667, "x": "1947年に預かった100人のうち、\nおよそ85人が亡くなった。"}, {"t": 39.666666666666664, "x": "1年で85人？"}, {"t": 41.2, "x": "この数が、新聞では103人にも169人にもなる。"}, {"t": 45.11666666666667, "x": "検察が殺人だと訴えたのは27人。"}, {"t": 47.96666666666667, "x": "裁判所が認めたのは、5人とも6人とも言われている。"}, {"t": 51.53333333333333, "x": "判決を見れば分かるんじゃないの？"}, {"t": 53.55, "x": "その判決文が読めない。"}, {"t": 55.2, "x": "保管の期間を過ぎ、公開も\n許されなかったと研究者が書いている。"}, {"t": 59.266666666666666, "x": "預けられた子が何人いて、どこへ行ったのか。"}, {"t": 62.016666666666666, "x": "80年近くたった今も確かめようがない。"}, {"t": 64.88333333333334, "x": "本当の数は誰も知らないのね。"}, {"t": 67.01666666666667, "x": "今回はその揃わなかった数の話だ。"}, {"t": 69.6, "x": "赤ちゃんの様子は語らない。"}, {"t": 71.13333333333334, "x": "残された書類だけを、順に開いていく。"}, {"t": 74.4, "x": "まず、あの夜をGHQ、つまり\n占領軍の報告書でたどる。"}, {"t": 78.28333333333333, "x": "日付は1948年1月16日。"}, {"t": 81.31666666666666, "x": "事件の4日後に書かれた3枚の英文だ。"}, {"t": 84.0, "x": "作ったのは、関東を担当する民事局の係官だった。"}, {"t": 87.78333333333333, "x": "占領軍が自分で調べに来たの？"}, {"t": 90.01666666666667, "x": "来た。その話はあとでする。"}, {"t": 91.96666666666667, "x": "報告書によると、警察官は\n産院へ来る葬儀屋を見ていた。"}, {"t": 95.63333333333334, "x": "小さな箱を積んだ自転車で、夜の産院に入っていく。"}, {"t": 99.06666666666666, "x": "箱に入れられたのは4人だったと、この報告書は書く。"}, {"t": 102.36666666666666, "x": "日本の新聞の書き方は少し違う。"}, {"t": 104.76666666666667, "x": "場所は新宿区の弁天町。"}, {"t": 106.43333333333334, "x": "早稲田署の署員2人の職務質問だ。"}, {"t": 109.0, "x": "箱はミカン箱だった、という記事もある。"}, {"t": 111.56666666666666, "x": "見張ってたのか、たまたま止めたのか、どっちなの？"}, {"t": 114.76666666666667, "x": "それも資料で分かれている。"}, {"t": 116.3, "x": "確かなのは許可証の話だ。"}, {"t": 118.3, "x": "報告書の言葉を訳すと、「\n区役所が出した書類は整っていた」。"}, {"t": 122.3, "x": "だから男を引き止める根拠が無い。"}, {"t": 124.58333333333333, "x": "亡くなった理由までは、書類に書いてないの？"}, {"t": 127.3, "x": "書いてある。ただし医者の書いた紙の上の話だ。"}, {"t": 130.23333333333332, "x": "区役所は診断書を見て、許可証を出す。"}, {"t": 132.8, "x": "紙が揃っていれば、それ以上は調べない。"}, {"t": 135.36666666666667, "x": "何十人分もの許可証がこの手順で通っていた。"}, {"t": 138.5, "x": "役所の窓口では気づかれなかったのね。"}, {"t": 141.1, "x": "窓口が見るのは1枚の紙だ。"}, {"t": 143.16666666666666, "x": "同じ産院から何枚出ているか、\n数えた記録は見当たらない。"}, {"t": 147.4, "x": "止める理由は無い。でも、警察官は署長に報告した。"}, {"t": 150.95, "x": "署長は産院の近所を聞いて回るよう命じた。"}, {"t": 153.76666666666668, "x": "そこで何か出てきたの？"}, {"t": 155.43333333333334, "x": "前の年の夏のことが出てきた。"}, {"t": 157.51666666666668, "x": "1947年の夏、近所の数人が産院の中へ入っていた。"}, {"t": 162.05, "x": "そして感じていた。"}, {"t": 163.33333333333334, "x": "子どもたちは、ちゃんと食べていない。"}, {"t": 165.23333333333332, "x": "服も足りていない。"}, {"t": 166.61666666666667, "x": "その人たちはどこかへ知らせなかったの？"}, {"t": 169.13333333333333, "x": "知らせたという記録は見つからなかった。"}, {"t": 171.45, "x": "当時の東京でどこへ言えばよかったかも難しい。"}, {"t": 174.23333333333332, "x": "産院を取り締まる国の法令が無かった、と\n国会で説明されている。"}, {"t": 178.36666666666667, "x": "署長の動きは早かった。"}, {"t": 180.05, "x": "葬儀屋の家にある4人を運び出し、\n解剖に回す手続きを取った。"}, {"t": 184.13333333333333, "x": "許可証があるのに解剖できるの？"}, {"t": 186.23333333333332, "x": "署長が令状を取った、と報告書は書いている。"}, {"t": 189.03333333333333, "x": "ここで署長はもう1つ手を打った。"}, {"t": 191.08333333333334, "x": "副署長を解剖に立ち会わせたんだ。"}, {"t": 193.38333333333333, "x": "立ち会う必要があるの？"}, {"t": 194.95, "x": "公式の解剖の報告は1か月は出てこない。"}, {"t": 197.8, "x": "待っていては調べが進まない。"}, {"t": 199.6, "x": "だから結果をその場で聞いて、持ち帰らせた。"}, {"t": 203.0, "x": "解剖の結果も1つに揃わない。"}, {"t": 205.15, "x": "占領軍の報告書は、全員が\n栄養失調で亡くなったと書く。"}, {"t": 209.1, "x": "行き先は慶應義塾大学だ。"}, {"t": 211.08333333333334, "x": "ところが別の資料では、\n国立東京第一病院になっている。"}, {"t": 214.98333333333332, "x": "病院まで違うの？"}, {"t": 216.35, "x": "違う。人数も、4人だったり6人だったりする。"}, {"t": 219.55, "x": "死因も当時の新聞をもとにした\n論文と、ほかの資料で分かれる。"}, {"t": 223.41666666666666, "x": "この回ではどれが正しいとは言わない。"}, {"t": 225.53333333333333, "x": "はっきりしているのは1つだけだ。"}, {"t": 227.58333333333334, "x": "普通の亡くなり方ではない、と署長が判断したこと。"}, {"t": 230.9, "x": "報告書によると、署長は院長夫婦と\n葬儀屋の身柄を押さえた。"}, {"t": 234.76666666666668, "x": "逮捕は1月15日の朝だった。"}, {"t": 237.01666666666668, "x": "そしてその数時間後、産院にいた\n子がもう1人亡くなった。"}, {"t": 240.78333333333333, "x": "警察が来たあとにも亡くなったのね。"}, {"t": 243.16666666666666, "x": "報告書は「5人目」と書いている。"}, {"t": 245.48333333333332, "x": "ここから先の数は、どれも帳簿の中の話になる。"}, {"t": 249.41666666666666, "x": "逮捕の裏話が5年後の国会に残っている。"}, {"t": 252.31666666666666, "x": "1953年7月21日、衆議院の法務委員会だ。"}, {"t": 256.6666666666667, "x": "逮捕状の出し方を議論する席だった。"}, {"t": 259.26666666666665, "x": "なんでそこで寿産院が出てくるの？"}, {"t": 261.75, "x": "最高裁の刑事局長が例に挙げたんだ。"}, {"t": 264.28333333333336, "x": "局長の説明では、最初の請求は殺人ではなかった。"}, {"t": 267.95, "x": "罪名は詐欺。配給の米をごまかした、という疑いだ。"}, {"t": 271.5833333333333, "x": "赤ちゃんの話じゃなくて、\nお米の話で逮捕しようとしたの？"}, {"t": 275.45, "x": "その方が確実だったらしい、と局長は言っている。"}, {"t": 278.53333333333336, "x": "ところが裁判官が言った。"}, {"t": 280.23333333333335, "x": "この捜査の狙いは、そこではないのではないか、と。"}, {"t": 283.43333333333334, "x": "裁判官に見抜かれたのね。"}, {"t": 285.31666666666666, "x": "警察は請求を取り下げた。"}, {"t": 287.1333333333333, "x": "別の資料によると、次は\n不作為の殺人で請求したという。"}, {"t": 291.03333333333336, "x": "不作為って何？"}, {"t": 292.3, "x": "やるべきことをやらないことだ。"}, {"t": 294.05, "x": "世話をする役目の人が、世話をしないで死なせる。"}, {"t": 296.98333333333335, "x": "この言葉が、のちの裁判で一番の争いになった。"}, {"t": 300.9166666666667, "x": "逮捕のすぐあと、寿産院へ調査団が入った。"}, {"t": 304.15, "x": "占領軍の福祉担当、公衆衛生の担当、\nそれに厚生省の児童局だ。"}, {"t": 309.06666666666666, "x": "逮捕の直後に占領軍が来たの？"}, {"t": 311.35, "x": "新聞の報道を見て動いた、と報告書にある。"}, {"t": 314.21666666666664, "x": "建物は2階建てだった。"}, {"t": 315.9166666666667, "x": "1階の3つか4つの部屋に、\n経営者の夫婦が暮らしている。"}, {"t": 319.56666666666666, "x": "2階には小さな部屋が4つ。"}, {"t": 321.45, "x": "預かった子の部屋は、4フィート×\n8フィートと記録された。"}, {"t": 325.31666666666666, "x": "それってどのくらいの広さ？"}, {"t": 327.1166666666667, "x": "幅1.2メートル、奥行き2.4\nメートルほど。畳2枚くらいだ。"}, {"t": 331.56666666666666, "x": "畳2枚に何人いたの？"}, {"t": 333.4, "x": "調査の時は5人だった。"}, {"t": 334.93333333333334, "x": "別の資料には7人とある。"}, {"t": 336.8, "x": "部屋そのものは清潔だった、と調査団は書く。"}, {"t": 339.75, "x": "ただ2階には水の設備が無かった。"}, {"t": 342.01666666666665, "x": "水はすべて急な階段で下から運ぶ。"}, {"t": 344.51666666666665, "x": "1947年には、100人以上を預かった建物だ。"}, {"t": 348.4166666666667, "x": "5人は16日のうちに、国立の病院へ移された。"}, {"t": 352.43333333333334, "x": "調査団は産院の帳簿も確かめた。"}, {"t": 354.75, "x": "帳簿は細かく付けてあった。"}, {"t": 356.53333333333336, "x": "1947年にここで生まれた子は、多くても10人か12人。"}, {"t": 361.0, "x": "100人以上いたんでしょ？"}, {"t": 362.6, "x": "残りは生まれてから連れて来られた子だ。"}, {"t": 364.8666666666667, "x": "生後数週間から数か月で親が預けに来た。"}, {"t": 367.9166666666667, "x": "産院なのにお産じゃない子ばかりなの？"}, {"t": 370.25, "x": "報告書ははっきりと書いた。"}, {"t": 372.01666666666665, "x": "寿産院という名前は見せかけにすぎない。"}, {"t": 374.75, "x": "実際は子どものあっせん業者を装っていた、と。"}, {"t": 377.68333333333334, "x": "事件の後、助産婦の専門雑誌に医師が書いている。"}, {"t": 380.93333333333334, "x": "産院は産んだ子を必要な間だけ預かる場所だ。"}, {"t": 383.85, "x": "よそで生まれた子を扱う場所ではない。"}, {"t": 385.98333333333335, "x": "でも、法律の上では誰が\n預かっても差し支えなかった。"}, {"t": 389.53333333333336, "x": "誰でも？届け出はしなくていいの？"}, {"t": 391.8, "x": "東京で届け出の決まりができるのは、事件のあとだ。"}, {"t": 395.1166666666667, "x": "それじゃ見つけようがないじゃない。"}, {"t": 396.95, "x": "衆議院の山崎道子議員は、少し違う見方をしている。"}, {"t": 400.6166666666667, "x": "社会に必要だったから、産院が\n預かるようになったのだ、と。"}, {"t": 404.46666666666664, "x": "預ける場所が無かったことこそ\n問題だった、という指摘だ。"}, {"t": 408.6666666666667, "x": "預かる数は年ごとに増えていた。"}, {"t": 410.7, "x": "警察の数字はこうだ。"}, {"t": 412.23333333333335, "x": "1944年が14人か15人。"}, {"t": 414.9166666666667, "x": "1945年は34人か35人。"}, {"t": 418.0, "x": "1946年は40人か41人だ。"}, {"t": 421.3, "x": "そして1947年に、100人を超えた。"}, {"t": 424.6333333333333, "x": "1年で2倍以上？何があったの？"}, {"t": 426.95, "x": "報告書の見立ては広告だ。"}, {"t": 428.8333333333333, "x": "1947年7月に、新聞へ広告を出し始めた。"}, {"t": 432.96666666666664, "x": "主に使ったのは読売新聞だった。"}, {"t": 435.4, "x": "新聞に赤ちゃんの広告？"}, {"t": 437.25, "x": "わずか3行ほどの小さな案内だ。"}, {"t": 439.43333333333334, "x": "男の子と女の子、1か月から3歳まで。"}, {"t": 442.4166666666667, "x": "もらいたい方は相談に応じます。"}, {"t": 444.5, "x": "駅から3分という道案内まで付いていた。"}, {"t": 447.1333333333333, "x": "当時の駅前には産院の看板も立っていた。"}, {"t": 449.9, "x": "事情ある方、ご相談に応じます。"}, {"t": 452.2, "x": "乳児預かります、秘密厳守。"}, {"t": 454.46666666666664, "x": "秘密厳守って、預ける人には大事なことよね。"}, {"t": 457.71666666666664, "x": "そこが肝心だ。"}, {"t": 458.9, "x": "役所を通せば、名前も事情も書類に残る。"}, {"t": 461.75, "x": "名前を残したくない親には、この一言が頼りだった。"}, {"t": 465.8333333333333, "x": "親が払ったお金も資料で揃わない。"}, {"t": 468.0833333333333, "x": "占領軍の報告書は、1人5000円から6000円。"}, {"t": 471.4, "x": "論文は、5000円から8000円としている。"}, {"t": 474.1, "x": "2000円から1万円という記録もある。"}, {"t": 476.55, "x": "当時の5000円ってどのくらいなの？"}, {"t": 478.75, "x": "1948年の国会で、給料の目安に\n3700円という数字が出てくる。"}, {"t": 484.35, "x": "じゃあ1か月の給料より高いのね。"}, {"t": 486.6666666666667, "x": "1人預けるのに月給の1か月半ぶんほどだ。"}, {"t": 489.6166666666667, "x": "ただ、そのお金で親は子への権利を\n手放す形になっていた。"}, {"t": 493.3666666666667, "x": "養子先を探すのは産院の役目、という建前だ。"}, {"t": 496.75, "x": "親はそのあとどうなるの？"}, {"t": 498.3333333333333, "x": "多くは正しい住所も名前も\n残していない、と論文は書く。"}, {"t": 501.8666666666667, "x": "残せない事情のある人が来ていたからだ。"}, {"t": 504.3666666666667, "x": "生活に困った母親や父親もいた。"}, {"t": 506.8666666666667, "x": "未婚で妊娠した女性もいた。"}, {"t": 508.8, "x": "預けた親をここで責めることはできない。"}, {"t": 511.0833333333333, "x": "ほかに頼れる場所がほとんど無かった。"}, {"t": 513.45, "x": "養子に行けた子もいたの？"}, {"t": 515.1, "x": "いた。"}, {"t": 516.2333333333333, "x": "産院はもらい手に1人300円か500円で渡していた。"}, {"t": 519.85, "x": "親から数千円もらって、もらい手からも取るの？"}, {"t": 522.8666666666667, "x": "両方から受け取る形だった。"}, {"t": 524.8166666666667, "x": "ただ、もらい手に渡った子の数ははっきりしない。"}, {"t": 528.35, "x": "占領軍の係官は、産院の収支を計算している。"}, {"t": 531.7833333333333, "x": "1人6000円で100人なら、1947年の収入は60万円。"}, {"t": 536.55, "x": "葬儀屋に払うのが1人300円。"}, {"t": 538.7, "x": "食べ物などの費用が1人700円と見積もった。"}, {"t": 541.9, "x": "合わせて1000円ね。"}, {"t": 543.2, "x": "そうなると、1年の利益はおよそ50万円になる。"}, {"t": 546.4666666666667, "x": "すごい額じゃない。"}, {"t": 547.6833333333333, "x": "報告書には警察の考えも書いてある。"}, {"t": 550.1833333333333, "x": "夫婦はお金のために子どもが亡くなるように仕向けた。"}, {"t": 553.2166666666667, "x": "ただ、これは警察の見方だ。"}, {"t": 555.2333333333333, "x": "裁判で夫婦は、殺すつもりはなかったと\n争うことになる。"}, {"t": 558.7833333333333, "x": "金額も揃わない。"}, {"t": 560.0666666666667, "x": "当時の新聞の見出しは「手数料90万円」。"}, {"t": 563.0, "x": "100万円という本もある。"}, {"t": 564.7, "x": "計算の元の数字がぜんぶ違うのね。"}, {"t": 567.1833333333333, "x": "もう1つ、この計算に入っていないお金がある。"}, {"t": 570.25, "x": "まだあるの？"}, {"t": 571.3833333333333, "x": "配給だ。"}, {"t": 572.8666666666667, "x": "当時の日本は食べ物が配給制だった。"}, {"t": 575.4166666666666, "x": "赤ちゃんの粉ミルクや砂糖も、数に応じて配られる。"}, {"t": 578.6333333333333, "x": "産院を営んでいれば、乳児用の配給が取れた。"}, {"t": 581.8166666666667, "x": "預かった子の分ももらえるのね。"}, {"t": 583.8666666666667, "x": "論文によると、夫婦はそれを\n横流しして利益を上げていた。"}, {"t": 587.5, "x": "亡くなった時に特別に配られる\n酒まで流していたという。"}, {"t": 591.05, "x": "当時のミルクは闇の市場で高く売れた。"}, {"t": 593.4333333333333, "x": "国会でも、1か月2000円から\n3000円かかると言われている。"}, {"t": 597.2333333333333, "x": "では夫婦は何と説明したのか。"}, {"t": 599.3166666666667, "x": "報告書にその言い分が残っている。"}, {"t": 601.5, "x": "最近の5人については、ミルクのせいだと言った。"}, {"t": 604.45, "x": "1月1日から粉ミルクを使うことになった。"}, {"t": 607.4, "x": "作り方が分からず、お腹を壊したのだ、と。"}, {"t": 610.4666666666667, "x": "院長は助産婦でしょ？"}, {"t": 611.7, "x": "作り方が分からないの？"}, {"t": 613.45, "x": "報告書はそこを問い返してはいない。"}, {"t": 615.6, "x": "ほかの80人については、説明がもっと短い。"}, {"t": 618.8166666666667, "x": "登録が無い子で、配給が取りにくかった。"}, {"t": 621.5833333333334, "x": "登録が無い子ってどういうこと？"}, {"t": 623.55, "x": "役所の名簿に載っていない子のことだと見られる。"}, {"t": 626.2833333333333, "x": "この話はもっと大きな数字につながっていく。"}, {"t": 629.65, "x": "区役所の許可証の元になる\n紙を書いたのは、医者だった。"}, {"t": 633.1666666666666, "x": "報告書には2人の医者とあり、\n「2人」は手で書き足してある。"}, {"t": 636.8833333333333, "x": "この時点で警察は、医者の名前を伏せていた。"}, {"t": 639.8, "x": "のちに1人の医師が医師法違反に問われた。"}, {"t": 642.3333333333334, "x": "別の資料によると、偽の診断書は\nおよそ60枚にのぼる。"}, {"t": 646.25, "x": "嘘の診断書ってこと？"}, {"t": 647.9333333333333, "x": "そういう疑いで問われた。"}, {"t": 649.4333333333333, "x": "この医師の刑は、禁錮4か月と伝えられている。"}, {"t": 652.4666666666667, "x": "1枚の紙が区役所へ行き、許可証になる。"}, {"t": 655.2166666666667, "x": "許可証が葬儀屋へ渡り、箱が運ばれる。"}, {"t": 657.9833333333333, "x": "全部の手順が書類で回ってるのね。"}, {"t": 660.3166666666667, "x": "だから1月12日の夜、警察官は止められなかった。"}, {"t": 663.9666666666667, "x": "衆議院の山崎議員は国会で怒っている。"}, {"t": 666.6, "x": "取り扱った警察と医師の無責任、\n役所の怠慢も追及したい、と。"}, {"t": 671.0833333333334, "x": "半年後の厚生委員会でも、別の議員が取り上げた。"}, {"t": 674.4166666666666, "x": "診た医者が自分で死亡診断書を書く仕組みが問題だ。"}, {"t": 677.6333333333333, "x": "死因を調べる専門の医者を置くべきだ、と。"}, {"t": 680.2333333333333, "x": "寿産院事件もこの欠陥から来ている。"}, {"t": 683.0166666666667, "x": "そう言い切った発言が会議録に残っている。"}, {"t": 686.3166666666667, "x": "院長はどんな人物だったのか。"}, {"t": 688.3166666666667, "x": "東京の大学病院の講習を出た、正式な資格の産婆だ。"}, {"t": 692.2333333333333, "x": "院長は東京都産婆会の牛込支部長を務めていた。"}, {"t": 695.55, "x": "牛込産婆会の会長でもある。"}, {"t": 697.7, "x": "えっ、まとめ役の人だったの？"}, {"t": 699.8666666666667, "x": "占領軍の報告書にも、\n新宿区の助産婦会の長と書いてある。"}, {"t": 703.95, "x": "1947年4月には、新宿区議会の選挙にも出た。"}, {"t": 708.2833333333333, "x": "議員になろうとしてたの？"}, {"t": 709.9333333333333, "x": "自由党から立って落選している。"}, {"t": 712.0, "x": "広告を始めた3か月前のことだ。"}, {"t": 714.4333333333333, "x": "夫の経歴も論文に載っている。"}, {"t": 716.5166666666667, "x": "憲兵の軍曹を務めたあと、警視庁の巡査を8年。"}, {"t": 720.0833333333334, "x": "元警察官ってこと？"}, {"t": 721.7833333333333, "x": "そうだ。"}, {"t": 722.9166666666666, "x": "確かなのは、助産婦の会の長という肩書の重さだ。"}, {"t": 726.3666666666667, "x": "この肩書は、事件のあと別の人たちに跳ね返っていく。"}, {"t": 730.05, "x": "全国の助産婦たちだ。"}, {"t": 732.3166666666667, "x": "なぜ産婆が赤ちゃんを預かるようになったのか。"}, {"t": 734.9166666666666, "x": "話は1930年までさかのぼる。"}, {"t": 737.5666666666667, "x": "この年、東京の板橋でもらい子の事件が報じられた。"}, {"t": 741.0, "x": "預かった子が、41人も亡くなった疑いだ。"}, {"t": 744.25, "x": "同じような事件が18年前にもあったの？"}, {"t": 747.0833333333334, "x": "あった。"}, {"t": 748.2166666666667, "x": "これを受けて立ち上がったのが、東京府の産婆会だ。"}, {"t": 751.3166666666667, "x": "九段の産婆会館で\n赤ちゃんの預かりとあっせんを始めた。"}, {"t": 754.8333333333334, "x": "産婆さんたちが自分たちで防ごうとしたのね。"}, {"t": 757.7166666666667, "x": "預かり先の無い子が産院や警察署から送られてくる。"}, {"t": 761.0333333333333, "x": "1940年には、1日15人以上が預けられていたという。"}, {"t": 765.2, "x": "1人の子に10組ほどのもらい手がいた。"}, {"t": 767.6, "x": "当時を知る元助産婦は、こう振り返っている。"}, {"t": 770.3166666666667, "x": "子どもたちを大事に扱っていた、\n誰の子であろうと、と。"}, {"t": 773.85, "x": "ちゃんとした仕組みがあったんじゃない。"}, {"t": 775.8833333333333, "x": "それが1945年の空襲で終わる。"}, {"t": 778.5833333333334, "x": "会館は焼け、事業は\nそこで終わったと研究者は見ている。"}, {"t": 782.0666666666667, "x": "同じ年の春、東京の公立の産院も次々に閉まった。"}, {"t": 785.9666666666667, "x": "預ける先が一気に無くなったのね。"}, {"t": 788.3, "x": "その穴の中で民間の産院が赤ちゃんを預かり続けた。"}, {"t": 791.7333333333333, "x": "寿産院の帳簿の人数が増えていくのも、この時期だ。"}, {"t": 795.9333333333333, "x": "事件の5か月前、国会でこんな発言があった。"}, {"t": 799.1166666666667, "x": "1947年8月13日、衆議院の司法委員会だ。"}, {"t": 803.4833333333333, "x": "民法を新しくする議論で、養子の話になった。"}, {"t": 806.7166666666667, "x": "司法省の担当者は答えた。"}, {"t": 808.65, "x": "養子は子どものための制度として残す。"}, {"t": 811.1, "x": "悪用を防ぐため、家事審判所の許可を必要とする。"}, {"t": 814.5166666666667, "x": "そこで、かつて司法の仕事をしていた\n議員が口を開いた。"}, {"t": 818.0166666666667, "x": "私は司法の仕事で、\nもらい子の事件の裁判をしたことがある。"}, {"t": 821.8666666666667, "x": "一番極端なものは27人だった、と。"}, {"t": 824.8666666666667, "x": "27人？寿産院の検察の数と同じじゃない。"}, {"t": 828.4833333333333, "x": "これは偶然で、戦前の別の裁判の話だ。"}, {"t": 831.5166666666667, "x": "ただ、議員はこう続けている。"}, {"t": 833.3666666666667, "x": "子を手当の道具にする弊害が出てこないとは限らない。"}, {"t": 836.4833333333333, "x": "許可の制度を十分に活用してほしい、と。"}, {"t": 839.2166666666667, "x": "5か月前にちゃんと注意されてたのね。"}, {"t": 841.6666666666666, "x": "注意はあった。"}, {"t": 842.8, "x": "ただ、この許可は養子の話だ。"}, {"t": 844.9666666666667, "x": "お金を受け取って預かるだけなら、\n許可は関係が無い。"}, {"t": 848.15, "x": "国会の議論は、産院の2階には届かなかった。"}, {"t": 851.95, "x": "1947年の日本の赤ちゃんの数字を見ておこう。"}, {"t": 855.5, "x": "この年に生まれたのは、267万8792人。"}, {"t": 859.7666666666667, "x": "戦争から男たちが帰り、出生が一気に増えた。"}, {"t": 863.0333333333333, "x": "同じ年、1歳になる前に\n亡くなった子は20万5360人だ。"}, {"t": 867.7666666666667, "x": "20万人？"}, {"t": 868.9, "x": "生まれた1000人のうち、76.\n7人が亡くなる計算になる。"}, {"t": 873.0333333333333, "x": "寿産院がなくても、それだけ厳しい時代だったのね。"}, {"t": 876.75, "x": "赤ちゃんが亡くなること自体が珍しくない時代だった。"}, {"t": 879.9833333333333, "x": "埋葬許可証が何枚出ても、\n目立ちにくかったと考えられる。"}, {"t": 883.7333333333333, "x": "東京の産院は、この1年で567軒から768軒に増えた。"}, {"t": 889.0, "x": "200軒も増えたの？"}, {"t": 890.4666666666667, "x": "出産の多くは産婆が助ける時代だ。"}, {"t": 892.8833333333333, "x": "産婆の全盛期だった、と論文は書いている。"}, {"t": 895.6333333333333, "x": "一方で、おむつすら手に入らない。"}, {"t": 897.7666666666667, "x": "闇の浴衣でおむつを作ると\n1人分1万円、と国会で語られた。"}, {"t": 902.0, "x": "母親に乳が出なければ、ミルクに頼るしかない。"}, {"t": 905.0166666666667, "x": "児童福祉法ができたのは、この1947年の12月だ。"}, {"t": 909.3333333333334, "x": "4月から全面的に動き出す予定だった。"}, {"t": 912.0833333333334, "x": "事件の発覚は公布の1か月後だった。"}, {"t": 914.8, "x": "法律が動き出す直前に、見つかったのね。"}, {"t": 918.3166666666667, "x": "新聞は連日この事件を大きく載せた。"}, {"t": 920.8333333333334, "x": "鬼夫婦、悪鬼といった言葉が見出しに並んでいる。"}, {"t": 923.9166666666666, "x": "その中にもう1つ別の記事があった。"}, {"t": 926.3166666666667, "x": "産院の玄関に母親たちが来ている。"}, {"t": 928.85, "x": "預けた人たちが？"}, {"t": 930.3, "x": "預けた子の安否を確かめに来た。"}, {"t": 932.4166666666666, "x": "「あの子を返せ」と叫ぶ母親の姿が報じられた。"}, {"t": 935.6166666666667, "x": "当時の記事には、母親の身なりを\n書き立てるものもある。"}, {"t": 938.9, "x": "ダンサー風、女給風といった言い方だ。"}, {"t": 941.3333333333334, "x": "預けたのはそういう女だ、と言いたげな書き方だった。"}, {"t": 944.7, "x": "なんか嫌な書き方ね。"}, {"t": 946.3333333333334, "x": "事件を親の問題にする声は、国会にまで広がっていく。"}, {"t": 949.8833333333333, "x": "ただ、預ける事情はそれぞれ違った。"}, {"t": 952.2666666666667, "x": "正当な結婚から生まれた\n子もいたようだ、と書いた人もいる。"}, {"t": 955.8666666666667, "x": "一人ひとりの事情は記録に残っていない。"}, {"t": 958.4166666666666, "x": "分からないことはここでは語らない。"}, {"t": 960.45, "x": "確かなのは、玄関まで来た親が確かにいたことだ。"}, {"t": 964.35, "x": "1948年1月26日。"}, {"t": 967.0666666666667, "x": "院長と夫、助手の3人が殺人の罪で起訴された。"}, {"t": 970.7333333333333, "x": "葬儀屋は証拠が足りず釈放されている。"}, {"t": 973.1, "x": "起訴には、大きな数字はほとんど入らなかった。"}, {"t": 976.0, "x": "はっきり殺人とされたのは、この時点でわずか3人だ。"}, {"t": 979.5833333333334, "x": "85人じゃないの？"}, {"t": 981.1166666666667, "x": "亡骸を調べられたのは、最近の数人だけだった。"}, {"t": 984.4, "x": "帳簿と許可証と医者の書類が一致しない。"}, {"t": 986.9, "x": "証拠が集まり次第、追加で訴えるとされた。"}, {"t": 989.7666666666667, "x": "そしてこの同じ日の午後、東京で別の事件が起きる。"}, {"t": 993.2, "x": "同じ日に？"}, {"t": 994.3333333333334, "x": "帝銀事件だ。"}, {"t": 995.4, "x": "銀行で12人が毒で命を奪われた、あの事件だ。"}, {"t": 998.8666666666667, "x": "えっ、同じ日なの？"}, {"t": 1000.3666666666667, "x": "同じ1月26日だ。"}, {"t": 1002.2333333333333, "x": "1週間後の国会でも、この2つは並べて語られた。"}, {"t": 1005.7166666666667, "x": "衆議院の本会議で、山崎議員はこう挙げた。"}, {"t": 1008.6666666666666, "x": "まず寿産院事件、帝銀事件、と。"}, {"t": 1011.3666666666667, "x": "なお、占領下の新聞には厳しい検閲があった。"}, {"t": 1014.4166666666666, "x": "占領軍の兵士との間に生まれた子が\n捨てられても、記事にならなかったという。"}, {"t": 1019.1, "x": "じゃあ、寿産院は書いてよかったのね。"}, {"t": 1021.75, "x": "論文の著者もそこに注目している。"}, {"t": 1024.0666666666666, "x": "報道が許された背景には、何があったのか、と。"}, {"t": 1027.8833333333334, "x": "1948年2月2日。衆議院の本会議。"}, {"t": 1031.5833333333333, "x": "質問に立ったのは女性の議員、山崎道子だ。"}, {"t": 1034.6666666666667, "x": "厚生委員として、まず寿産院を取り上げた。"}, {"t": 1037.7166666666667, "x": "生まれた子は、すべて生きる\n権利を持って生まれてきた。"}, {"t": 1040.75, "x": "この一言から始めている。"}, {"t": 1042.55, "x": "続けて赤ちゃんの暮らしを数字で並べた。"}, {"t": 1045.0666666666666, "x": "配給のミルクでは命をつなげない。"}, {"t": 1047.25, "x": "主食が足りないと国中が騒ぐ。"}, {"t": 1049.35, "x": "ところが声なき赤ちゃんの主食は、\n仕方がないで済まされる。"}, {"t": 1053.1, "x": "声なき赤ちゃん、か。"}, {"t": 1054.6166666666666, "x": "そして有名な一言が出る。"}, {"t": 1056.4666666666667, "x": "寿産院は、氷山の一角が波間に現れただけだ。"}, {"t": 1060.2333333333333, "x": "まだ下に大きなものがあるってこと？"}, {"t": 1062.4833333333333, "x": "声なき者の声を聞く耳を、政治は持つべきだ。"}, {"t": 1065.5, "x": "母親に向けた言葉もあった。"}, {"t": 1067.4, "x": "子を産めば不幸になると知りつつ、\n保護もなく産む母親がいる。"}, {"t": 1070.9166666666667, "x": "母子心中か、捨て子か。"}, {"t": 1072.6666666666667, "x": "それもできない母親が、ああいう所へ泣きついたのだ。"}, {"t": 1076.0333333333333, "x": "預けた人を責めてないのね。"}, {"t": 1077.9333333333334, "x": "むしろ預けるしかなかった社会を問うている。"}, {"t": 1080.45, "x": "本会議場には、拍手が起きたと会議録にある。"}, {"t": 1084.1166666666666, "x": "答えに立ったのは厚生大臣の一松定吉だ。"}, {"t": 1087.3333333333333, "x": "大臣はまず法律の不備を認めた。"}, {"t": 1089.5666666666666, "x": "乳児の預かり所が十分に取り締まられていなかった。"}, {"t": 1092.5666666666666, "x": "取り締まりの法規が完全でなかった、と。"}, {"t": 1095.25, "x": "そこは正直に言うのね。"}, {"t": 1096.9333333333334, "x": "問題はそのあとだ。"}, {"t": 1098.2166666666667, "x": "大臣は預けられた子の話に移った。"}, {"t": 1100.6666666666667, "x": "寿産院の場合は、不義の間にできた\n子が多数を占めるように感じられる。"}, {"t": 1105.35, "x": "不義の子って結婚してない人の子ってこと？"}, {"t": 1108.1333333333334, "x": "そういう意味で使われている。"}, {"t": 1109.75, "x": "さらに大臣は続けた。"}, {"t": 1111.35, "x": "母親は世間体のために子を手放し、\nどうなってもかまわない態度だ。"}, {"t": 1115.4166666666667, "x": "それが犯罪を容易にしているのではないか、と。"}, {"t": 1118.25, "x": "えっ、母親のせいにしたの？"}, {"t": 1120.2666666666667, "x": "そう聞こえる答弁だった。"}, {"t": 1121.8333333333333, "x": "この答弁の中に、根拠の数字は出てこない。"}, {"t": 1124.65, "x": "山崎は黙らなかった。"}, {"t": 1126.2666666666667, "x": "もう一度立ってこう言っている。"}, {"t": 1127.9333333333334, "x": "不義という観念が不幸な人間を生むのだ。"}, {"t": 1130.45, "x": "どんな事情でも、生まれた子は保護されるべきだ。"}, {"t": 1133.2166666666667, "x": "不義の子だから起きたのだと、軽く扱わないでほしい。"}, {"t": 1136.5166666666667, "x": "よく言った。"}, {"t": 1137.65, "x": "大臣ももう一度立って、答弁を足した。"}, {"t": 1140.25, "x": "不義の子であっても、育てるのが\n憲法の命ずるところだ、と。"}, {"t": 1143.9166666666667, "x": "ただ、原因の多くが不義の子だという見方は\n取り下げていない。"}, {"t": 1148.0833333333333, "x": "国会の10日前に同じことを書いた人がいる。"}, {"t": 1150.8833333333334, "x": "作家の宮本百合子だ。"}, {"t": 1152.5, "x": "1948年1月23日、新聞アカハタに短い文章が載った。"}, {"t": 1157.7, "x": "題は「生れた権利をうばうな」。"}, {"t": 1159.7666666666667, "x": "事件から10日ちょっとで書いたの？"}, {"t": 1161.8833333333334, "x": "そうだ。"}, {"t": 1163.0, "x": "宮本も数字から入っている。"}, {"t": 1164.8833333333334, "x": "去年は預けられた子が二百余名に上った。"}, {"t": 1167.5833333333333, "x": "そのうち80パーセントが殺された、と。"}, {"t": 1170.3166666666666, "x": "また数が違うのね。"}, {"t": 1171.8333333333333, "x": "発覚から日が浅く、数字はまだ動いていた。"}, {"t": 1174.7166666666667, "x": "宮本が書きたかったのは数の先だ。"}, {"t": 1177.1333333333334, "x": "正当でない子だから\n仕方がない、という空気に怒っている。"}, {"t": 1180.5333333333333, "x": "正当な子、正当でない子。"}, {"t": 1182.4166666666667, "x": "それは子どもにとって、どんな区別があるのか。"}, {"t": 1185.2666666666667, "x": "大臣の答弁より先に、言い返してたのね。"}, {"t": 1188.2, "x": "宮本は言葉そのものも見つめた。"}, {"t": 1190.4166666666667, "x": "生まれた、という言い方は受け身だ。"}, {"t": 1192.4333333333334, "x": "子どもは自分で自分を生んだのではない。"}, {"t": 1194.6166666666666, "x": "受け身にこの世へ送り出された存在だ、と書いた。"}, {"t": 1197.55, "x": "だから子どもはすべて社会の子だ。"}, {"t": 1199.6333333333334, "x": "生命を保証される権利がある。"}, {"t": 1201.4833333333333, "x": "そして大人にはその義務がある。"}, {"t": 1203.3166666666666, "x": "国が育児院、産院、託児所を作らなければならない。"}, {"t": 1206.7, "x": "そのことは寿産院ではっきり示された、と結んでいる。"}, {"t": 1210.9666666666667, "x": "山崎の質問の中心にはミルクがあった。"}, {"t": 1213.65, "x": "当時の配給の目標は1人1日2合5勺だ。"}, {"t": 1216.95, "x": "2合5勺ってどのくらい？"}, {"t": 1218.65, "x": "450ミリリットルほどになる。"}, {"t": 1220.7333333333333, "x": "牛乳、ミルク、乳製品をぜんぶ合わせた目標だ。"}, {"t": 1223.9333333333334, "x": "5月の国会で農林省の担当者が説明している。"}, {"t": 1227.2, "x": "母乳以外に頼る赤ちゃんがおよそ90万人いる。"}, {"t": 1230.1833333333334, "x": "その全員に2合5勺を配ろうとしていた。"}, {"t": 1232.8, "x": "それでも不足は事実だ、と担当者は認めた。"}, {"t": 1235.9333333333334, "x": "足りてないのは分かってたのね。"}, {"t": 1237.8333333333333, "x": "山崎は2月の本会議でこう訴えた。"}, {"t": 1240.3333333333333, "x": "これで赤ちゃんが生きられるのでしょうか。"}, {"t": 1242.45, "x": "しかも街の喫茶店では、ミルクが堂々と売られている。"}, {"t": 1245.8333333333333, "x": "えっ、喫茶店にはあるの？"}, {"t": 1247.6333333333334, "x": "闇に流れていた。"}, {"t": 1248.8833333333334, "x": "板橋の養育院の例も山崎は挙げた。"}, {"t": 1251.3833333333334, "x": "捨て子17人に1日の配給の牛乳が30本。"}, {"t": 1254.7333333333333, "x": "そして6月の国会で別の議員が1ポンドの話をする。"}, {"t": 1258.3166666666666, "x": "配給のミルクは1か月1ポンド。"}, {"t": 1260.5166666666667, "x": "医者に頼み込んでも2ポンド。"}, {"t": 1262.25, "x": "ところが必要なのは、4ポンドか5ポンドだ。"}, {"t": 1265.1666666666667, "x": "1ポンドって何グラム？"}, {"t": 1266.7833333333333, "x": "450グラムほどだ。"}, {"t": 1268.4166666666667, "x": "医者に頼んでも必要な量の半分ほどだ。"}, {"t": 1271.05, "x": "この数字は裁判にも、重くのしかかることになる。"}, {"t": 1274.8, "x": "氷山の一角という言葉は、すぐ数字で確かめられた。"}, {"t": 1278.3, "x": "1948年4月12日の文書が残っている。"}, {"t": 1281.95, "x": "東京都の衛生局から\n占領軍の東京の担当へ出した報告だ。"}, {"t": 1286.0166666666667, "x": "都は事件を受けて、都内の産院を調べていた。"}, {"t": 1288.9166666666667, "x": "表には8つの産院が並ぶ。"}, {"t": 1290.7833333333333, "x": "1947年の初めから登録の無い赤ちゃんがいた産院だ。"}, {"t": 1295.1333333333334, "x": "さっきの登録が無い子ね。"}, {"t": 1296.9166666666667, "x": "左の列が登録のある子、右の列が登録の無い子。"}, {"t": 1300.3666666666666, "x": "合計は登録ありが110人、登録なしが209人だ。"}, {"t": 1304.1666666666667, "x": "登録の無い子の方が多いの？"}, {"t": 1306.0833333333333, "x": "2倍近い。"}, {"t": 1307.2166666666667, "x": "寿産院の行は38人と15人。"}, {"t": 1310.0333333333333, "x": "68人が全員登録なしという産院もある。"}, {"t": 1313.0833333333333, "x": "61人の全員が捨て子、と書かれた産院もあった。"}, {"t": 1316.6833333333334, "x": "寿産院より多いじゃない。"}, {"t": 1318.55, "x": "ただしこの表は亡くなった数ではない。"}, {"t": 1320.7666666666667, "x": "登録の無い子がいた、というだけの表だ。"}, {"t": 1323.2666666666667, "x": "その子たちがどうなったかは、\nこの表からは分からない。"}, {"t": 1326.3333333333333, "x": "産院の名前はここでは読まない。"}, {"t": 1328.2666666666667, "x": "表に載ったからといって、\n悪いことをしたとは限らない。"}, {"t": 1331.5, "x": "捨て子を引き受けていた所かもしれないからだ。"}, {"t": 1334.2333333333333, "x": "役所の帳簿に載らない赤ちゃんが、\n8つの産院だけで209人いた。"}, {"t": 1339.2166666666667, "x": "事件から1か月たたないうちに次の産院が見つかった。"}, {"t": 1342.6666666666667, "x": "同じ新宿区の戸塚町にあった淀橋産院だ。"}, {"t": 1345.7833333333333, "x": "朝日新聞の報道によると、61人が\n栄養不良で亡くなっていた。"}, {"t": 1350.25, "x": "同じ区に、また？"}, {"t": 1351.65, "x": "第二の寿産院事件と呼ばれた。"}, {"t": 1354.0166666666667, "x": "この年、東京地検が受け付けた\n似た事件は12件にのぼる。"}, {"t": 1357.9666666666667, "x": "12件も？"}, {"t": 1359.1, "x": "山崎の言った氷山は、本当に水の下にあった。"}, {"t": 1362.35, "x": "11月の参議院では、児童局長が頭を下げている。"}, {"t": 1365.9, "x": "前には寿産院があり、今度は\n大阪の事件があり、里親の事件もある。"}, {"t": 1370.55, "x": "事件のたびに、申し訳ない責任を感じている、と。"}, {"t": 1374.0, "x": "この年だけでそんなに続いたのね。"}, {"t": 1376.3, "x": "12件のそれぞれがどう裁かれたかは、\n調べても出てこなかった。"}, {"t": 1380.1666666666667, "x": "東京の外の数はもっと分からない。"}, {"t": 1382.3666666666666, "x": "今回の調べでは、まとめた記録が見つからなかった。"}, {"t": 1385.6833333333334, "x": "揃わないどころか、最初から\n数えられていない数もある。"}, {"t": 1389.65, "x": "取り締まりは急いで始まった。"}, {"t": 1391.5, "x": "1948年3月19日、厚生省が\n助産婦の広告を取り締まる。"}, {"t": 1396.5, "x": "広告に書けるのは、場所と名前と時間と設備の有無。"}, {"t": 1399.8833333333334, "x": "事情ある方ご相談に応ず、は禁止された。"}, {"t": 1402.7166666666667, "x": "乳児預かります秘密厳守、も禁止だ。"}, {"t": 1405.5333333333333, "x": "あの三行広告が消えたのね。"}, {"t": 1407.5666666666666, "x": "その春には、東京都が独自の条例を作っている。"}, {"t": 1410.7333333333333, "x": "乳児委託養育取締条例だ。"}, {"t": 1412.8833333333334, "x": "赤ちゃんを預かったら、\n48時間以内に保健所へ届ける。"}, {"t": 1416.7166666666667, "x": "そのあとは毎月、保健所の健康診断を受ける。"}, {"t": 1419.8333333333333, "x": "3人以上預かるなら、前もって許可が要る。"}, {"t": 1422.7166666666667, "x": "やっと誰かが数える仕組みができたのね。"}, {"t": 1425.2833333333333, "x": "6月には国会でも説明があった。"}, {"t": 1427.6166666666666, "x": "厚生政務次官が衆議院でこう言っている。"}, {"t": 1430.0833333333333, "x": "産院や妊産婦預かり所には、\n中央の法令で取り締まる道が無かった。"}, {"t": 1434.4166666666667, "x": "最近の事例を見ても、至急に規制が必要だ、と。"}, {"t": 1437.7833333333333, "x": "こうして助産に関わる施設は、\n助産所という名前に揃えられた。"}, {"t": 1441.7333333333333, "x": "受け入れる人数にも上限がかかる。"}, {"t": 1443.8333333333333, "x": "医師法、医療法、保健婦助産婦看護婦法が\n7月に国会を通った。"}, {"t": 1448.4333333333334, "x": "事件から半年でここまで変わったの？"}, {"t": 1450.8833333333334, "x": "ただ、都の担当の係長は心配も書き残している。"}, {"t": 1454.25, "x": "取り締まりが厳しすぎると、預かる人がいなくなる。"}, {"t": 1457.4166666666667, "x": "捨て子が多くなるのではないか、と。"}, {"t": 1459.5166666666667, "x": "数える仕組みと預ける場所は、別の問題だった。"}, {"t": 1463.25, "x": "裁判が始まったのは、1948年6月2日だ。"}, {"t": 1467.3333333333333, "x": "場所は東京地裁。被告の全員が殺意を否定した。"}, {"t": 1470.8, "x": "殺すつもりはなかったってこと？"}, {"t": 1472.85, "x": "そうだ。"}, {"t": 1473.9833333333333, "x": "9月3日、検察が求めた刑が明らかになる。"}, {"t": 1477.1666666666667, "x": "院長は懲役15年、夫は懲役7年。"}, {"t": 1480.0166666666667, "x": "検察の数字はこうだ。"}, {"t": 1481.5666666666666, "x": "1946年4月から1948年1月までに、\n84人が亡くなった。"}, {"t": 1487.5666666666666, "x": "そのうち27人は、殺人の証拠がはっきりしている。"}, {"t": 1491.1, "x": "84という数字は許可証の枚数と同じだ。"}, {"t": 1494.05, "x": "許可証は、紙として残っている証拠だからだ。"}, {"t": 1497.1166666666666, "x": "じゃあ、許可証の無い子は数に入らないの？"}, {"t": 1499.75, "x": "入らない。"}, {"t": 1500.8833333333334, "x": "許可証の無い子がいたとしても、\n裁判の場には上がってこない。"}, {"t": 1504.4333333333334, "x": "起訴の時点で、遺体の無い子は\n80人から100人と見られていた。"}, {"t": 1508.45, "x": "しかし体が無ければ、死因は調べられない。"}, {"t": 1511.1833333333334, "x": "残っているのは、書類と火葬のあとの灰だ。"}, {"t": 1513.9333333333334, "x": "灰から死因は分からない。"}, {"t": 1515.4333333333334, "x": "ここで検察は難しい問題にぶつかる。"}, {"t": 1518.0166666666667, "x": "世話をしなかったことを殺人として証明する。"}, {"t": 1520.7833333333333, "x": "しかも相手は、配給が足りない時代の赤ちゃんだ。"}, {"t": 1524.4833333333333, "x": "その難しさを示す発言が国会に残っている。"}, {"t": 1527.6333333333334, "x": "1948年6月15日、ちょうど公判が始まった月のことだ。"}, {"t": 1532.5, "x": "経済の統制をめぐる審議で、ある議員が\n寿産院を持ち出した。"}, {"t": 1536.5833333333333, "x": "あれは殺したのではない。"}, {"t": 1538.0333333333333, "x": "配給だけくれておいたので、栄養失調で死んだのだ。"}, {"t": 1541.2666666666667, "x": "そう説明する者がいた、と言う。"}, {"t": 1543.4833333333333, "x": "えっ、誰がそんなこと言ったの？"}, {"t": 1545.55, "x": "誰かは言っていない。"}, {"t": 1546.7833333333333, "x": "そして議員は続けた。なるほど、その通りなのだ、と。"}, {"t": 1550.4, "x": "その通りって、殺人じゃないってこと？"}, {"t": 1552.9166666666667, "x": "議員が言いたかったのは、裁判のことではない。"}, {"t": 1555.65, "x": "政府の配給の量では赤ちゃんは\n育たない、という批判だ。"}, {"t": 1559.0833333333333, "x": "統制を守って闇で買わない人は、生きていけない。"}, {"t": 1562.1333333333334, "x": "その例として持ち出した。"}, {"t": 1563.7666666666667, "x": "配給どおりに与えても足りない。"}, {"t": 1565.6333333333334, "x": "では足りなかったのは世話か、それとも国の配給か。"}, {"t": 1568.8666666666666, "x": "殺意が争われた背景には、こういう時代があった。"}, {"t": 1571.9666666666667, "x": "もちろん、夫婦は配給の横流しでも調べられている。"}, {"t": 1575.2333333333333, "x": "普通の家庭なら、親が闇で買ってでも飲ませる。"}, {"t": 1578.1666666666667, "x": "親の代わりに預かった者も、同じ役目を負うのか。"}, {"t": 1581.2833333333333, "x": "不作為の殺人という言葉の中身は、そこだった。"}, {"t": 1585.15, "x": "判決は1948年10月11日に出た。"}, {"t": 1588.7333333333333, "x": "院長は懲役8年、夫は懲役4年。"}, {"t": 1591.45, "x": "求められた刑のおよそ半分だ。"}, {"t": 1593.5833333333333, "x": "85人でも8年なの？"}, {"t": 1595.5666666666666, "x": "85人の判決ではなかった。"}, {"t": 1597.7833333333333, "x": "27人のうちほとんどが証拠不十分とされた。"}, {"t": 1600.8333333333333, "x": "残りの数がまた揃わない。"}, {"t": 1602.5833333333333, "x": "論文は、27人のうち21人が無罪だと書いている。"}, {"t": 1606.45, "x": "じゃあ残りは6人ね。"}, {"t": 1607.9666666666667, "x": "ところが別の資料では、\n認められたのは5人、無罪は22人だ。"}, {"t": 1612.2166666666667, "x": "判決の数まで違うの？"}, {"t": 1614.0166666666667, "x": "判決文を見れば1分で済む話だ。"}, {"t": 1616.45, "x": "それができない。"}, {"t": 1617.4333333333334, "x": "起訴された3人のうち、助手は\n無罪だったと伝えられている。"}, {"t": 1621.05, "x": "のちに国から補償も受けた、という記録もある。"}, {"t": 1623.9333333333334, "x": "医師には禁錮4か月。"}, {"t": 1625.5, "x": "診断書に関わった保険の外交員には、\n懲役8か月と伝わる。"}, {"t": 1629.8833333333334, "x": "亡くなった子の数を考えると軽く感じるね。"}, {"t": 1632.7833333333333, "x": "ただ、裁判所が裁けるのは証明できた分だけだ。"}, {"t": 1636.0, "x": "数えられなかった子は、判決の中に現れない。"}, {"t": 1639.0166666666667, "x": "確かめられない子を確かめられないまま残す。"}, {"t": 1641.7333333333333, "x": "それが裁判の出した答えだった。"}, {"t": 1644.4333333333334, "x": "ここで揃わなかった数を並べてみる。"}, {"t": 1646.7, "x": "1つ目は預かった子の帳簿。"}, {"t": 1648.4166666666667, "x": "合計211人という数字がある。"}, {"t": 1650.8166666666666, "x": "論文では預けられた子は240人だ。"}, {"t": 1653.4666666666667, "x": "2つ目は埋葬許可証。合計84枚だ。"}, {"t": 1656.5666666666666, "x": "1945年が1枚、1946年が24枚。"}, {"t": 1660.95, "x": "1947年が53枚、1948年が6枚だった。"}, {"t": 1665.9833333333333, "x": "1947年は53枚？"}, {"t": 1668.25, "x": "報告書の85人と合わないよ？"}, {"t": 1670.6666666666667, "x": "合わない。100人の85人と53枚。"}, {"t": 1673.4833333333333, "x": "差の32人は、この表だけでは説明が付かない。"}, {"t": 1676.85, "x": "じゃあどっちかが間違ってるの？"}, {"t": 1678.7, "x": "どちらも間違っていないのかもしれない。"}, {"t": 1680.9166666666667, "x": "帳簿と許可証では、数えているものが違う。"}, {"t": 1683.6166666666666, "x": "そして3つ目が当時の推定だ。"}, {"t": 1685.7166666666667, "x": "論文の103人は、よく引かれる数字だ。"}, {"t": 1688.5, "x": "新聞の見出しは85人だった。"}, {"t": 1690.75, "x": "169人という数字も、今の記事に残っている。"}, {"t": 1694.1666666666667, "x": "親が本当の名前を残さなければ、\n同じ子かどうかも確かめにくい。"}, {"t": 1698.35, "x": "だから数えようがないのね。"}, {"t": 1700.0833333333333, "x": "数える仕組みの外で、預かっていたからだ。"}, {"t": 1702.7833333333333, "x": "秘密厳守の中では数は残らない。"}, {"t": 1705.1, "x": "最初の広告の一言がここで返ってくる。"}, {"t": 1708.4666666666667, "x": "裁判はそこで終わらなかった。"}, {"t": 1710.3, "x": "1952年4月28日、東京高裁が刑を下げた。"}, {"t": 1714.5666666666666, "x": "院長は懲役4年、夫は懲役2年。"}, {"t": 1717.25, "x": "半分になったの？"}, {"t": 1718.6, "x": "半分だ。"}, {"t": 1719.7333333333333, "x": "そして1953年9月15日、最高裁が上告を退けた。"}, {"t": 1724.4666666666667, "x": "事件の発覚から5年8か月がたっていた。"}, {"t": 1727.4666666666667, "x": "そこで読めない判決文の話ね。"}, {"t": 1729.85, "x": "2013年に論文を書いた研究者が実際に当たっている。"}, {"t": 1733.5166666666667, "x": "第一審も第二審も、判決文は手に入らなかった。"}, {"t": 1736.9666666666667, "x": "重要な判例集にも載っていない。"}, {"t": 1739.0, "x": "検察庁の担当者の答えはこうだった。"}, {"t": 1741.5666666666666, "x": "有名な事件ではある。"}, {"t": 1742.9666666666667, "x": "しかし有期刑の判決の保管期間は、\n50年を超えている。"}, {"t": 1746.7, "x": "関係者のプライバシーの保護も必要だ。"}, {"t": 1749.1333333333334, "x": "公開は許可できない。"}, {"t": 1750.6333333333334, "x": "有名な事件なのに？"}, {"t": 1752.15, "x": "有名でも決まりは決まりだ。"}, {"t": 1753.85, "x": "関係者を守る意味もある。"}, {"t": 1755.4666666666667, "x": "ただ、その結果、裁判所が\n何人を認めたかが分からない。"}, {"t": 1759.2833333333333, "x": "今の私たちが読めるのは、\n当時の新聞と専門誌の要約だけだ。"}, {"t": 1763.45, "x": "この回で数を言い切らなかったのは、そのためだ。"}, {"t": 1767.0, "x": "事件のあと変わったものを見ていこう。"}, {"t": 1769.05, "x": "1つ目は死因を調べる仕組みだ。"}, {"t": 1771.0833333333333, "x": "監察医という医者がいる。"}, {"t": 1772.6333333333334, "x": "死因のはっきりしない遺体を専門に調べる医者だ。"}, {"t": 1775.55, "x": "この制度は、1947年1月の省令で始まった。"}, {"t": 1779.7333333333333, "x": "じゃあ事件の前からあったの？"}, {"t": 1781.5333333333333, "x": "あった。寿産院のために作られたものではない。"}, {"t": 1784.6666666666667, "x": "きっかけは、1946年の上野駅の地下道だ。"}, {"t": 1788.3166666666666, "x": "飢えで亡くなる人が出ていると新聞が書いた。"}, {"t": 1790.9333333333334, "x": "占領軍が自分で解剖すると、別の死因が見つかった。"}, {"t": 1794.45, "x": "死因の調べが甘いと見た\n占領軍が制度を作れと命じた。"}, {"t": 1797.9333333333334, "x": "東京都の監察医務院が\n開いたのは、1948年3月21日だ。"}, {"t": 1803.35, "x": "事件の2か月あと？"}, {"t": 1804.9, "x": "そうだ。"}, {"t": 1806.0166666666667, "x": "6月の厚生委員会で議員は言った。"}, {"t": 1808.35, "x": "死について、本当の原因を\n究明することは絶対に必要だ。"}, {"t": 1812.25, "x": "死体解剖保存法ができたのは、1949年6月だった。"}, {"t": 1816.7, "x": "もし1947年に東京の赤ちゃんの死亡を\n数える目があったら。"}, {"t": 1821.0166666666667, "x": "1つの産院から53枚という\n許可証に気づけたかもしれない。"}, {"t": 1824.8666666666666, "x": "ただ、それは今だから言えることだ。"}, {"t": 1827.0166666666667, "x": "当時は20万人が亡くなる時代だった。"}, {"t": 1830.1666666666667, "x": "2つ目は助産婦という仕事だ。"}, {"t": 1832.1666666666667, "x": "1930年代から40年代まで、\nお産の約9割は産婆が助けていた。"}, {"t": 1837.3833333333334, "x": "産婆は、妊婦も赤ちゃんも続けて見る人だった。"}, {"t": 1840.4833333333333, "x": "母乳の相談も預かりも、もらい手探しも担っていた。"}, {"t": 1843.8666666666666, "x": "占領軍はこの産婆の制度を理解しにくかった。"}, {"t": 1846.75, "x": "アメリカには、同じ仕組みが無かったからだ。"}, {"t": 1849.3833333333334, "x": "占領軍は看護婦、保健婦と一本にまとめようとした。"}, {"t": 1852.8333333333333, "x": "産婆の側は強く反発していた。"}, {"t": 1855.0666666666666, "x": "そこへ寿産院が起きた。"}, {"t": 1857.05, "x": "産婆の会の長が起こした事件だもんね。"}, {"t": 1859.65, "x": "1948年5月、日本助産婦会は統合を余儀なくされた。"}, {"t": 1864.1333333333334, "x": "預かりもあっせんも、産院の仕事から外された。"}, {"t": 1867.1666666666667, "x": "代わりに置かれたのが児童相談所だ。"}, {"t": 1869.3666666666666, "x": "10月の国の要綱で、養子の仲介も\n相談所が担うことになる。"}, {"t": 1873.5166666666667, "x": "赤ちゃんの健康の指導は、保健婦へ移っていく。"}, {"t": 1876.6166666666666, "x": "じゃあ産婆さんはお産だけになったの？"}, {"t": 1878.8666666666666, "x": "そのお産も、1950年代に病院へ移っていった。"}, {"t": 1882.5166666666667, "x": "論文の著者は大事な指摘をしている。"}, {"t": 1884.8666666666666, "x": "産婆のあっせんは、子どもの命を守る\n仕組みとして実際に働いていた。"}, {"t": 1889.2166666666667, "x": "事件のあと、妊婦と赤ちゃんは\n別々の窓口に分けられた、と。"}, {"t": 1893.8833333333334, "x": "3つ目は優生保護法だ。"}, {"t": 1895.5333333333333, "x": "1948年6月19日、参議院の厚生委員会で提案された。"}, {"t": 1900.4666666666667, "x": "この法律で医師による中絶が認められるようになる。"}, {"t": 1903.6666666666667, "x": "寿産院がきっかけでできたの？"}, {"t": 1906.0, "x": "そう書く本は多い。"}, {"t": 1907.1666666666667, "x": "研究者も、成立を促す材料に使われたと書いている。"}, {"t": 1910.8166666666666, "x": "早稲田の署長も、事件のあとの文章で提案した。"}, {"t": 1914.0, "x": "乳児院を作るより、中絶を認める方が現実的だ、と。"}, {"t": 1917.75, "x": "ただ、提案の説明を読むと印象が変わる。"}, {"t": 1920.4333333333334, "x": "語られているのは、国土と食べ物と人口だ。"}, {"t": 1923.3, "x": "寿産院という言葉は1回も出てこない。"}, {"t": 1926.1666666666667, "x": "えっ、出てこないの？"}, {"t": 1927.6166666666666, "x": "出てこない。"}, {"t": 1928.7333333333333, "x": "会議録の検索でも、この審議に\n寿産院の発言は無かった。"}, {"t": 1933.0166666666667, "x": "52年後の2000年、参議院である議員がこう語った。"}, {"t": 1936.4833333333333, "x": "戦後に寿産院事件があり、\n優生保護法は国会を一晩で通った、と。"}, {"t": 1941.2833333333333, "x": "記録の上では、6月19日に\n提案され、7月13日に公布された。"}, {"t": 1946.2166666666667, "x": "翌年には経済的な理由も認められた。"}, {"t": 1948.9, "x": "1952年には審査の仕組みが\n無くなり、中絶は大きく増える。"}, {"t": 1953.25, "x": "そしてこの法律には、別の重い面があった。"}, {"t": 1956.1166666666666, "x": "障害のある人などに不妊の手術を強いた規定だ。"}, {"t": 1959.2, "x": "2024年7月3日、最高裁は\nその規定を憲法違反と判断した。"}, {"t": 1964.0833333333333, "x": "法律は1996年に改められ、母体保護法になっている。"}, {"t": 1968.4333333333334, "x": "産まれる前の命か、産まれたあとの命か。"}, {"t": 1971.1333333333334, "x": "親が育てられない子の行き先は、\nこの2つに分けられた。"}, {"t": 1975.2166666666667, "x": "では預ける場所はできたのか。"}, {"t": 1976.9833333333333, "x": "山崎は2月の本会議で、計画の数を言っていた。"}, {"t": 1980.3666666666666, "x": "来年度に産院60か所、乳児院30か所。"}, {"t": 1983.7166666666667, "x": "その30か所はできたの？"}, {"t": 1985.5666666666666, "x": "5月の参議院の厚生委員会で報告があった。"}, {"t": 1988.5, "x": "乳児院30か所の国の補助、\n1500万円以上が行き悩んでいる。"}, {"t": 1992.7333333333333, "x": "保育所165か所と母子寮66\nか所も、予算から削られそうだ。"}, {"t": 1997.2833333333333, "x": "別の女性議員はこう言っている。"}, {"t": 1999.1333333333334, "x": "施設が無くて児童保護とは、空に\n向かって夢を画くようなものだ。"}, {"t": 2003.1333333333334, "x": "それでも東京の数字は動いた。"}, {"t": 2005.0833333333333, "x": "都の乳児院にいる子は、\n1947年9月の109人から増えた。"}, {"t": 2009.7333333333333, "x": "1948年9月には、231人。1年で2倍だ。"}, {"t": 2014.5333333333333, "x": "受け皿が少しはできたのね。"}, {"t": 2016.4833333333333, "x": "産院の預かりが止まり、行き先が移った数でもある。"}, {"t": 2019.7833333333333, "x": "12月には施設の最低基準ができた。"}, {"t": 2022.4, "x": "監督の係が6か月に1回は\n施設へ行き、責任者の名前を残す。"}, {"t": 2026.9666666666667, "x": "ただ、翌年の3月になっても\n児童局長はこう答えている。"}, {"t": 2030.8166666666666, "x": "乳児院は非常に少ない。"}, {"t": 2032.4166666666667, "x": "牛乳も人手も医療もかかり、経営が一番難しい。"}, {"t": 2035.7166666666667, "x": "全国の乳児院の子は、約2000人だった。"}, {"t": 2038.5833333333333, "x": "預ける場所はすぐには生まれなかった。"}, {"t": 2041.3666666666666, "x": "寿産院の名前は、25年後の国会にもう一度現れる。"}, {"t": 2045.3666666666666, "x": "1973年4月24日、参議院の法務委員会だ。"}, {"t": 2049.633333333333, "x": "この4日前、新聞に小さくない記事が載った。"}, {"t": 2052.633333333333, "x": "宮城県石巻の産婦人科医の話だ。"}, {"t": 2055.3333333333335, "x": "中絶を望む母親を説得して、産んでもらう。"}, {"t": 2058.35, "x": "その子を別の夫婦の実の子として渡す。"}, {"t": 2060.95, "x": "10年で100人にのぼるという。"}, {"t": 2062.9, "x": "それって法律違反じゃないの？"}, {"t": 2064.8166666666666, "x": "医師も違法を承知だと言っている。"}, {"t": 2066.6666666666665, "x": "お金は受け取っていなかった。"}, {"t": 2068.383333333333, "x": "引き取り手は新聞広告で探した。"}, {"t": 2070.8333333333335, "x": "新聞広告？寿産院と同じね。"}, {"t": 2073.5833333333335, "x": "同じ手段でも中身はまるで違う。"}, {"t": 2075.7, "x": "この委員会に医師本人が呼ばれて話した。"}, {"t": 2078.266666666667, "x": "質問した議員が、途中でこう言っている。"}, {"t": 2080.8166666666666, "x": "例の寿産院事件のような\n問題にならないとも限らない、と。"}, {"t": 2084.883333333333, "x": "25年たっても、例の、で通じたのね。"}, {"t": 2087.766666666667, "x": "赤ちゃんを誰かに託す話が出る\nたび、この名前が呼ばれた。"}, {"t": 2091.4, "x": "議員は言っている。"}, {"t": 2092.45, "x": "こういう問題は、時間がたてば忘れられてしまうと。"}, {"t": 2096.2, "x": "最後に1948年1月12日の夜へ戻ろう。"}, {"t": 2099.983333333333, "x": "自転車を止めた警察官の手には、許可証があった。"}, {"t": 2103.35, "x": "不備の無い書類ね。"}, {"t": 2104.7166666666667, "x": "書類は整っていた。数だけがどこにも無かった。"}, {"t": 2107.766666666667, "x": "区役所は1枚ずつ見ていた。"}, {"t": 2109.633333333333, "x": "医者は1人ずつ書いていた。"}, {"t": 2111.3166666666666, "x": "葬儀屋は1箱ずつ運んでいた。"}, {"t": 2113.4166666666665, "x": "足し算をした記録が、どこにも見当たらない。"}, {"t": 2116.2, "x": "誰かが数えていれば、止められたのかな。"}, {"t": 2118.8166666666666, "x": "動いたのは、近所の声を聞いた1人の署長だった。"}, {"t": 2121.95, "x": "翌1948年、全国の乳児死亡率は\n76.7から61.7へ下がった。"}, {"t": 2128.15, "x": "国全体の数はそうして良くなっていく。"}, {"t": 2130.5666666666666, "x": "でも、寿産院の子の数は良くも悪くもならない。"}, {"t": 2133.8333333333335, "x": "確定しないまま、ここで止まっている。"}, {"t": 2136.1833333333334, "x": "85人か、103人か、169人か。"}, {"t": 2139.65, "x": "5人か、6人か。"}, {"t": 2141.266666666667, "x": "結局、何人だったの？"}, {"t": 2143.1833333333334, "x": "分からない。"}, {"t": 2144.3, "x": "これが、この事件の一番正確な答えだ。"}, {"t": 2147.1, "x": "分からないと言えるのは、記録が残っているからだ。"}, {"t": 2150.0333333333333, "x": "占領軍の3枚の報告書。"}, {"t": 2151.866666666667, "x": "都の1枚の表。国会の発言。"}, {"t": 2154.133333333333, "x": "声を上げられなかった\n子どもの数は、今も揃わないままだ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
