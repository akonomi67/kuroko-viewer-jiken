<script>
const D={"name": "136", "file": "136_編集用", "dur": 2080.05, "segs": [], "subs": [{"t": 0.0, "x": "1964年3月24日。東京・虎ノ門。"}, {"t": 3.8666666666666667, "x": "昼の12時5分ごろのことだ。"}, {"t": 5.833333333333333, "x": "アメリカ大使館のロビーで、1人の大使が刺された。"}, {"t": 9.133333333333333, "x": "大使って、アメリカの？"}, {"t": 10.816666666666666, "x": "そうだ。駐日アメリカ大使のライシャワーさん。"}, {"t": 13.466666666666667, "x": "刃物は1本で、傷は右のももだった。"}, {"t": 16.016666666666666, "x": "傷は深く、出血も多かったと報告されている。"}, {"t": 19.183333333333334, "x": "虎の門病院に運ばれて、手術が始まった。"}, {"t": 22.266666666666666, "x": "そして血が足された。輸血だ。"}, {"t": 24.45, "x": "命は助かったの？"}, {"t": 25.933333333333334, "x": "助かった。でも話はそこで終わらない。"}, {"t": 28.45, "x": "ちょうど3か月後、国会にこんな質問が出る。"}, {"t": 31.383333333333333, "x": "大使の肝炎は「黄色い血」のせいではないのか。"}, {"t": 34.45, "x": "黄色い血？　血は赤いでしょ？"}, {"t": 36.21666666666667, "x": "血を売り続けた人の血を指す言葉だ。"}, {"t": 38.43333333333333, "x": "中身はあとで話す。"}, {"t": 39.86666666666667, "x": "当時の日本で手術に使う血は、\n97％が買った血だった。"}, {"t": 44.266666666666666, "x": "97％も？"}, {"t": 45.86666666666667, "x": "厚生省の局長が国会で答えた数字だ。"}, {"t": 48.65, "x": "では、大使に入った血はどうだったのか。"}, {"t": 51.06666666666667, "x": "局長の答えは「結論はつけにくい」だった。"}, {"t": 54.21666666666667, "x": "分からないってこと？"}, {"t": 55.583333333333336, "x": "分からないまま、国はこの年の8月に動いた。"}, {"t": 58.65, "x": "今回は、1本の刃物のあとに残った血の記録を追う。"}, {"t": 62.03333333333333, "x": "主役は刺した少年ではなく、輸血の血のほうだ。"}, {"t": 65.15, "x": "少年は当時19歳。名前はこの回では出さない。"}, {"t": 68.96666666666667, "x": "まず、刺された人の話からだ。"}, {"t": 71.2, "x": "ライシャワーさんは1910年10月15日の生まれ。"}, {"t": 74.53333333333333, "x": "生まれた場所は東京だった。"}, {"t": 76.35, "x": "アメリカの大使なのに、東京生まれ？"}, {"t": 78.71666666666667, "x": "両親が日本で働いていた。"}, {"t": 80.6, "x": "父は日本の歴史を学ぶ学者で、\n東京の女子大学の創立に関わった。"}, {"t": 85.28333333333333, "x": "母は日本で耳の聞こえない子の学校を開いた人だ。"}, {"t": 88.66666666666667, "x": "日本にずっと縁があった家なのね。"}, {"t": 90.81666666666666, "x": "本人もハーバード大学で\n東アジアを教える学者になった。"}, {"t": 94.36666666666666, "x": "奥さんの松方ハルさんは日本人だ。"}, {"t": 96.76666666666667, "x": "1961年、ケネディ大統領が駐日大使に選んだ。"}, {"t": 100.8, "x": "任命は3月29日。信任状を出したのは4月27日。"}, {"t": 105.21666666666667, "x": "事件までに、もう3年近くいたのね。"}, {"t": 107.85, "x": "そういうことになる。"}, {"t": 109.03333333333333, "x": "事件の3日後、官房長官は国会でこう言っている。"}, {"t": 112.3, "x": "「非常に日本人から親近感を持たれておる」。"}, {"t": 115.0, "x": "政府の側から見ても、そういう大使だった。"}, {"t": 117.8, "x": "よりによって、そんな人が刺されたのね。"}, {"t": 120.46666666666667, "x": "しかも時期が悪かった。"}, {"t": 122.0, "x": "4か月前には、ケネディ大統領が銃で撃たれている。"}, {"t": 125.21666666666667, "x": "半年後の10月には、東京オリンピックが控えていた。"}, {"t": 128.6, "x": "国会の議員はその2つを並べて心配している。"}, {"t": 131.56666666666666, "x": "外務大臣は、この種の事件は初めてだと答えた。"}, {"t": 134.95, "x": "国と国の問題になるのね。"}, {"t": 136.98333333333332, "x": "なる。当日の国会は、そこから大騒ぎになった。"}, {"t": 140.86666666666667, "x": "時計を1か月戻そう。"}, {"t": 142.43333333333334, "x": "1964年2月24日。"}, {"t": 144.85, "x": "静岡県の沼津から、少年が東京へ出てきた。"}, {"t": 148.1, "x": "これは警察庁の後藤田正晴 警備局長の報告だ。"}, {"t": 151.75, "x": "少年が行ったのは、旧満鉄ビルにある\n大使館の別館だった。"}, {"t": 155.75, "x": "大使館の別の建物？"}, {"t": 157.56666666666666, "x": "そう。受付で聞いたのは、大使に会う方法だ。"}, {"t": 160.55, "x": "受付の答えは、手紙を持ってくれば\n用件によっては会える。"}, {"t": 164.06666666666666, "x": "その日、少年は帰っている。"}, {"t": 165.98333333333332, "x": "翌25日、また別館に来て、\n本館に入れてほしいと頼んだ。"}, {"t": 170.25, "x": "頼みは聞き入れられ、本館の受付で手紙を渡した。"}, {"t": 173.75, "x": "手紙には何が書いてあったの？"}, {"t": 175.7, "x": "大使に会いたいこと。そして近視のことだ。"}, {"t": 178.45, "x": "近視？　目の話？"}, {"t": 179.95, "x": "近視を直す話と、学校の決まりについての訴えだった。"}, {"t": 183.65, "x": "少年は入院したことがあった。"}, {"t": 185.58333333333334, "x": "ただ、病名や訴えの中身に、この回は深入りしない。"}, {"t": 189.03333333333333, "x": "大事なのは、3日も通っていたという点だ。"}, {"t": 191.86666666666667, "x": "その時点で、大使館は気づいていたの？"}, {"t": 194.41666666666666, "x": "気づいた人が1人だけいた。"}, {"t": 196.23333333333332, "x": "大使館の守衛だ。"}, {"t": 197.53333333333333, "x": "少年を見て、別の件の男に似ていると警察へ伝えた。"}, {"t": 201.35, "x": "別の件？"}, {"t": 202.48333333333332, "x": "1月20日に起きた出来事だ。"}, {"t": 204.56666666666666, "x": "少年の仕業だとは断定されていないので、\n詳しくは言わない。"}, {"t": 208.16666666666666, "x": "ともかく、警察はあすも来ると読んで待った。"}, {"t": 211.48333333333332, "x": "読みは当たった。2月26日。"}, {"t": 213.76666666666668, "x": "午後2時30分ごろ、少年は大使館の近くに現れた。"}, {"t": 217.55, "x": "警戒中の警察官が声をかけ、\n赤坂警察署へ同行を求めた。"}, {"t": 221.93333333333334, "x": "調べは約3時間に及んだ。"}, {"t": 223.98333333333332, "x": "じゃあ、ここで止められたんじゃないの？"}, {"t": 226.1, "x": "そう考えるのが普通だ。でも結果は逆だった。"}, {"t": 229.06666666666666, "x": "別の件の目撃者を集めて、顔を見てもらった。"}, {"t": 232.2, "x": "5人ほどのうち、守衛は五分五分だと答えた。"}, {"t": 234.96666666666667, "x": "ほかの人は、どうも違うと答えている。"}, {"t": 237.43333333333334, "x": "少年本人も認めなかった。"}, {"t": 239.4, "x": "母親に電話で聞くと、その日は\n家にいたという返事だった。"}, {"t": 243.11666666666667, "x": "それで人違いってことになったのね。"}, {"t": 245.5, "x": "なった。警察は夕方、少年を帰している。"}, {"t": 248.5, "x": "それでも少し気になったらしい。"}, {"t": 250.36666666666667, "x": "調べた人は母親に、迎えに来ないかと電話した。"}, {"t": 253.65, "x": "母親は行けないから帰してくれと答えた。"}, {"t": 256.35, "x": "そのあと、沼津の警察には知らせたの？"}, {"t": 259.0833333333333, "x": "そこが問題になった。"}, {"t": 260.56666666666666, "x": "事件のあと、静岡県に問い合わせると何も分からない。"}, {"t": 263.93333333333334, "x": "住んでいる事実しか、つかんでいなかった。"}, {"t": 266.46666666666664, "x": "3月27日、警察庁長官は国会でこう答えている。"}, {"t": 270.45, "x": "「手落ちといえば手落ちになるのかなという気持ち」。"}, {"t": 273.1, "x": "認めたようで、認めてないような言い方ね。"}, {"t": 275.81666666666666, "x": "長官は「普通しないということになるかも\nしれません」とも足した。"}, {"t": 279.7, "x": "これが刺される27日前の話だ。"}, {"t": 282.85, "x": "ここからは少年の供述になる。"}, {"t": 284.9, "x": "警察自身が裏づけを取っていた\n内容だから、断定はできない。"}, {"t": 288.71666666666664, "x": "本人の話には前後で合わない\n所があると、大臣も報告している。"}, {"t": 293.1166666666667, "x": "そのつもりで聞くのね。"}, {"t": 294.68333333333334, "x": "そうしてくれ。"}, {"t": 295.8, "x": "少年はこう話した。4月には成年になる。"}, {"t": 298.7, "x": "未成年のうちなら、罪は軽いだろうと考えたという。"}, {"t": 301.9, "x": "新聞やラジオに載る、とも考えた。"}, {"t": 304.35, "x": "自分の訴えを世の中に広めるため？"}, {"t": 306.8, "x": "供述ではそうなっている。"}, {"t": 308.3666666666667, "x": "普通のやり方では、聞いてもらえないと思ったらしい。"}, {"t": 311.3666666666667, "x": "前の日の3月23日、切り出しナイフを買った。"}, {"t": 314.7, "x": "さらに沼津の市内で、大きな石を拾っている。"}, {"t": 317.7, "x": "石？　なんで石なの？"}, {"t": 319.25, "x": "重さは約1貫目。3.75キロほどだ。"}, {"t": 322.1666666666667, "x": "大使館の塀の内側に、落とし穴があると思ったらしい。"}, {"t": 325.56666666666666, "x": "先に石を投げ込めば、穴があるか分かると考えた。"}, {"t": 328.8666666666667, "x": "落とし穴……。"}, {"t": 330.0, "x": "そして日付は、家の暦で決めた。"}, {"t": 332.3833333333333, "x": "3月24日の昼が、大吉だと書いてあったという。"}, {"t": 335.8333333333333, "x": "大使の予定を知っていたわけではないようだ。"}, {"t": 338.23333333333335, "x": "警察が疑ったのはそこだった。"}, {"t": 340.31666666666666, "x": "外国の要人と会う日に、なぜ重なったのか。"}, {"t": 343.25, "x": "調べの答えは、暦だった。"}, {"t": 345.3333333333333, "x": "偶然ってこと？"}, {"t": 346.55, "x": "供述の上ではそうなる。"}, {"t": 348.71666666666664, "x": "3月24日の朝。"}, {"t": 350.3833333333333, "x": "少年はパンと石を風呂敷に包んで家を出た。"}, {"t": 353.1666666666667, "x": "沼津駅を6時53分に出る上りの列車に乗っている。"}, {"t": 356.56666666666666, "x": "ここで動いた人がいた。母親だ。"}, {"t": 359.0, "x": "お母さんが気づいたの？"}, {"t": 360.5, "x": "前の日に大きな石を部屋へ持ち込むのを見ていた。"}, {"t": 363.31666666666666, "x": "胸騒ぎがして、あとを追ったと国会で語られている。"}, {"t": 366.5, "x": "そして鉄道公安官に届け出た。"}, {"t": 368.8666666666667, "x": "列車の警察みたいな人ね。"}, {"t": 370.9166666666667, "x": "そうだ。届け出は8時ごろだったと長官が答えている。"}, {"t": 374.26666666666665, "x": "公安官は車掌に連絡し、横浜と\n東京の公安官室にも伝えた。"}, {"t": 378.93333333333334, "x": "じゃあ、つかまえられたんじゃないの？"}, {"t": 380.95, "x": "見つからなかった。列車は混んでいたという。"}, {"t": 383.48333333333335, "x": "少年は新橋で降りて地下鉄に乗り換えた。"}, {"t": 386.15, "x": "虎ノ門で降り、大使館の塀の外から石を投げ入れた。"}, {"t": 389.55, "x": "穴が無いと確かめて、いったん離れている。"}, {"t": 392.18333333333334, "x": "大蔵省の印刷局の電気時計で、\n時間を見ていたそうだ。"}, {"t": 395.8833333333333, "x": "この日の国会で、議員は運輸大臣に聞いた。"}, {"t": 398.71666666666664, "x": "公安官は何をしていたのか、と。"}, {"t": 400.8833333333333, "x": "大臣の答えは「詳細な報告は受けておりません」。"}, {"t": 404.1333333333333, "x": "大臣も今聞いたってこと？"}, {"t": 405.98333333333335, "x": "本人が、委員会の席にずっといたと答えている。"}, {"t": 409.05, "x": "母親の届けは、公安官の中だけで止まっていた。"}, {"t": 412.31666666666666, "x": "国家公安委員長は、政治的な\n情報は無かったと説明した。"}, {"t": 416.25, "x": "母親の胸騒ぎだけが、一番早い知らせだった。"}, {"t": 420.1333333333333, "x": "12時少し前。少年は塀を乗り越えた。"}, {"t": 422.8666666666667, "x": "植え込みを伝って本館の裏のロビーへ向かう。"}, {"t": 425.4, "x": "ドアを押して入ると、大使が\n館員と出てくるところだった。"}, {"t": 428.8, "x": "すれ違った直後に、少年は斜め後ろから刺した。"}, {"t": 432.06666666666666, "x": "場面の話はここまでにする。"}, {"t": 434.0833333333333, "x": "この知らせは、すぐ国会に届いたの？"}, {"t": 436.6333333333333, "x": "届いた。ここに面白い記録が残っている。"}, {"t": 439.3666666666667, "x": "同じ日の参議院予算委員会で、第一報が読まれた。"}, {"t": 442.7, "x": "読んだのは早川崇 国家公安委員長だ。"}, {"t": 445.6166666666667, "x": "傷は「左大腿部」。つまり左のももだと言った。"}, {"t": 449.06666666666666, "x": "あれ？　最初は右って言ってなかった？"}, {"t": 451.43333333333334, "x": "言った。2日後の報告では「右大腿部」に直っている。"}, {"t": 455.2, "x": "同じ日の外務大臣は、もう右ももと話していた。"}, {"t": 458.4166666666667, "x": "ナイフの呼び方も違う。"}, {"t": 459.93333333333334, "x": "第一報は飛び出しナイフ。"}, {"t": 461.4, "x": "刃渡りは13センチ。"}, {"t": 462.98333333333335, "x": "のちの報告は切り出しナイフだ。"}, {"t": 464.96666666666664, "x": "時刻も、早川 委員長は12時5分。"}, {"t": 467.75, "x": "大平正芳 外務大臣は零時8分と答えている。"}, {"t": 471.28333333333336, "x": "同じ政府なのに、話がばらばらね。"}, {"t": 473.8, "x": "第一報とはそういうものだ。"}, {"t": 475.5, "x": "責めたいわけではない。"}, {"t": 476.76666666666665, "x": "このあとの話で、この「ずれ」が大事になる。"}, {"t": 479.8, "x": "確かな記録と、急いで広まった話は違う。"}, {"t": 482.8666666666667, "x": "大使の血の話でも、同じことが起きるからだ。"}, {"t": 486.46666666666664, "x": "そもそも大使館に、警備はいなかったの？"}, {"t": 489.18333333333334, "x": "少年を押さえたのは、居合わせた大使館員2人だった。"}, {"t": 492.51666666666665, "x": "非常ベルが鳴った。"}, {"t": 493.73333333333335, "x": "大使館の前の派出所から、警察官が駆けつけた。"}, {"t": 497.21666666666664, "x": "少年はそこで引き渡されている。"}, {"t": 499.3666666666667, "x": "警察は外にいたのね。"}, {"t": 501.0833333333333, "x": "外にいた。ここが議論になる。"}, {"t": 503.0833333333333, "x": "早川 委員長の説明はこうだ。"}, {"t": 505.31666666666666, "x": "大使館の中の警備は、大使館がやることになっている。"}, {"t": 508.73333333333335, "x": "頼まれれば、いつでも中に入れる態勢だった。"}, {"t": 511.65, "x": "今回は頼まれる前に起きてしまった。"}, {"t": 514.1166666666667, "x": "それって、中のことは知りませんってこと？"}, {"t": 516.8, "x": "議員もそう受け取った。"}, {"t": 518.2, "x": "3日後、後任の大臣はこう言い直している。"}, {"t": 520.9, "x": "警備と警護の全責任は、警察当局にある。"}, {"t": 524.0166666666667, "x": "防ぐ手を打つことも、警察の仕事だと認めた。"}, {"t": 527.1333333333333, "x": "ただ大臣は、十分な手が打てたかは\nまだ調べ中だとも言った。"}, {"t": 531.0333333333333, "x": "後任って、早川さんは？"}, {"t": 533.0, "x": "そこが次の話になる。"}, {"t": 535.2833333333333, "x": "その前に、病院の様子を見ておこう。"}, {"t": 537.5833333333334, "x": "大平 外務大臣は、零時40分に虎の門病院へ向かった。"}, {"t": 541.7333333333333, "x": "着いたとき、手術は始まったばかりだった。"}, {"t": 544.45, "x": "大使は麻酔の下で、本人には会えていない。"}, {"t": 547.3, "x": "話もできなかったのね。"}, {"t": 549.05, "x": "大使館の公使から、経過は良いと聞いただけだ。"}, {"t": 552.0, "x": "その日の夕方までに、知らせが入った。"}, {"t": 554.5833333333334, "x": "手術の結果は良好で、数週間で治る見込みだという。"}, {"t": 558.2, "x": "よかった。"}, {"t": 559.3333333333334, "x": "政府の動きは速かった。"}, {"t": 560.9666666666667, "x": "外務大臣はすぐ、ワシントンの大使に指示を出した。"}, {"t": 564.1833333333333, "x": "アメリカの国務省へ、遺憾の意を伝えるためだ。"}, {"t": 567.0666666666667, "x": "ワシントン時間の11時半に、伝え終えた報告が来た。"}, {"t": 570.6166666666667, "x": "池田勇人 首相は夕方、大使館を訪ねた。"}, {"t": 573.8666666666667, "x": "ジョンソン大統領には、首相から電報を打った。"}, {"t": 576.8666666666667, "x": "かなり慌ててるのが分かるわね。"}, {"t": 578.8333333333334, "x": "無理もない。半年後にはオリンピックだ。"}, {"t": 581.2166666666667, "x": "ただ会議録を見る限り、この時点で\n血の話をする人はいない。"}, {"t": 585.05, "x": "手術の報告に、輸血の中身は出てこなかった。"}, {"t": 588.2666666666667, "x": "手術がうまくいった。それだけが知らせだった。"}, {"t": 591.2, "x": "血はまだ、話題になってないのね。"}, {"t": 593.4333333333333, "x": "まだだ。国会が血の話を始めるまで、\n少し時間がかかる。"}, {"t": 598.0333333333333, "x": "ジョンソン大統領の返事は、\n翌25日に国会で読まれた。"}, {"t": 601.9, "x": "読み上げたのは大平 外務大臣だ。"}, {"t": 604.2833333333333, "x": "大統領は、大使が全快する見込みと\n聞いて喜んでいると書いた。"}, {"t": 608.35, "x": "怒ってはいないの？"}, {"t": 609.6, "x": "文面ではまったく逆だった。"}, {"t": 611.45, "x": "事件を「一個人の行為」と呼んでいる。"}, {"t": 613.9166666666666, "x": "そして両国の友好は、この行為と関係がないと続けた。"}, {"t": 617.5666666666667, "x": "アメリカの記録にも、同じ電報の英文が残っている。"}, {"t": 620.8833333333333, "x": "発表は事件と同じ3月24日だった。"}, {"t": 623.8666666666667, "x": "ほっとしたでしょうね、政府は。"}, {"t": 625.8666666666667, "x": "池田 首相は本会議で\n「非常にありがたいお返事」と言った。"}, {"t": 629.85, "x": "ある議員は、首相がテレビで\n謝ったことにも触れている。"}, {"t": 633.0833333333334, "x": "アメリカの新聞の反応も、\n悪くなかったと首相は紹介した。"}, {"t": 636.95, "x": "つまり外交の面では、大きな傷にならずに済んだ。"}, {"t": 640.2, "x": "じゃあ、もう一件落着じゃないの？"}, {"t": 642.4, "x": "外交はな。国内は違った。"}, {"t": 644.45, "x": "ある議員は、ワシントンの声をこう紹介している。"}, {"t": 647.2666666666667, "x": "現職の大使が刺されるのは、まれな事件だ。"}, {"t": 650.1333333333333, "x": "背後に何があるのかと、強い関心を持たれている。"}, {"t": 653.2166666666667, "x": "友好は壊れない。でも、説明は要る。"}, {"t": 655.75, "x": "政府が最初に差し出したのが、大臣の辞任だった。"}, {"t": 659.65, "x": "3月26日の衆議院本会議。"}, {"t": 662.1333333333333, "x": "事件の報告に立ったのは、早川 委員長ではなかった。"}, {"t": 665.8333333333334, "x": "新しい国家公安委員長、赤澤正道だ。"}, {"t": 668.9333333333333, "x": "2日で交代したの？"}, {"t": 670.5166666666667, "x": "早川 委員長はこの時点で辞めていた。"}, {"t": 673.1, "x": "池田 首相は、辞任を認めた理由を説明している。"}, {"t": 676.55, "x": "政治的に関係の深い人が辞めることで、\n二度と起こさない気持ちを示す。"}, {"t": 681.2166666666667, "x": "辞めれば済むの？"}, {"t": 682.4, "x": "野党も同じことを聞いた。"}, {"t": 684.0, "x": "社会党の議員は言った。"}, {"t": 685.3833333333333, "x": "辞任で解決とするのは責任回避に等しい。"}, {"t": 688.4166666666666, "x": "民社党の議員は、辞任は\n行政の責任がある証拠だと迫った。"}, {"t": 692.4166666666666, "x": "翌日、官房長官はこう答えている。"}, {"t": 694.9666666666667, "x": "辞職で責任が終わったとは決して考えていない。"}, {"t": 698.0, "x": "政府全体の責任だ、と。"}, {"t": 700.05, "x": "じゃあ、誰がどう責任を取るの？"}, {"t": 702.1333333333333, "x": "法制局長官の説明が分かりやすい。"}, {"t": 704.6, "x": "防げなかったのが不可抗力なら、責任は無い。"}, {"t": 707.6333333333333, "x": "ただ大臣の責任は、政治の責任だという。"}, {"t": 710.7166666666667, "x": "難しいわね。"}, {"t": 711.85, "x": "要するに、線の引き方は誰にも決められなかった。"}, {"t": 715.0333333333333, "x": "新しい委員長には、もっと切実な事情もあった。"}, {"t": 718.2, "x": "就任したばかりで、公安委員にまだ会えていない。"}, {"t": 721.0666666666667, "x": "3月27日の委員会で、本人がそう話している。"}, {"t": 724.7833333333333, "x": "大臣も大変ね。"}, {"t": 726.2333333333333, "x": "答弁の席で、できればあすにも\n集まってもらうと話した。"}, {"t": 730.35, "x": "当時の人が一番気にしたのは、\n誰かに頼まれたのかだ。"}, {"t": 733.9833333333333, "x": "事件の当日、参議院の議員はこう話している。"}, {"t": 737.05, "x": "右翼にしろ、左翼にしろ、どちらか分からない。"}, {"t": 740.0833333333334, "x": "4年前の浅沼さんの事件もあったものね。"}, {"t": 742.8833333333333, "x": "そうだ。国会でも、その名前が何度も出た。"}, {"t": 745.7833333333333, "x": "警察は翌朝から、刑事10人ほどを静岡へ送っている。"}, {"t": 749.35, "x": "出てきた答えが「特段の背後関係もない」だった。"}, {"t": 752.8666666666667, "x": "じゃあ、1人でやったのね。"}, {"t": 754.65, "x": "そう報告された。ところが議員が納得しない。"}, {"t": 757.55, "x": "別の議員は、足をねらう手口は\n右翼のものではないかと聞いた。"}, {"t": 761.2333333333333, "x": "断定は早いと、本会議で疑いを述べている。"}, {"t": 764.1333333333333, "x": "長官は言葉の定義から説明した。"}, {"t": 766.4833333333333, "x": "頼んだ人、手伝った人、属する団体。"}, {"t": 769.4666666666667, "x": "そういう直接の関係が背後関係だという。"}, {"t": 772.2333333333333, "x": "それが今の時点では出ていない、という答え方だ。"}, {"t": 775.3333333333334, "x": "じゃあ、広い意味ではどうなの？"}, {"t": 777.1666666666666, "x": "そこで話が変わっていく。"}, {"t": 778.8833333333333, "x": "「広い意味の背景」があるのではないか。"}, {"t": 781.1833333333333, "x": "少年を支える仕組みは足りていたのか。"}, {"t": 783.5166666666667, "x": "官房長官も、厚生の問題として考え直すと答えた。"}, {"t": 787.2833333333333, "x": "こうして翌日から、話は警察の外へ広がった。"}, {"t": 790.8333333333334, "x": "今度は厚生省の出番なのね。"}, {"t": 792.9, "x": "そうだ。ただし血の話ではなく、\n最初は別の法律の話だった。"}, {"t": 797.85, "x": "事件の翌日、衆議院の社会労働委員会。"}, {"t": 800.8333333333334, "x": "ある議員が精神の病気への対策を厚生省にただした。"}, {"t": 804.2166666666667, "x": "4月2日には、厚生大臣が数字を出している。"}, {"t": 807.3333333333334, "x": "精神の病気がある人は、およそ120万人。"}, {"t": 810.3833333333333, "x": "そのうち治療が必要なのは28万から30万人。"}, {"t": 813.85, "x": "ところが専門の病床は13万と少ししかない。"}, {"t": 817.0666666666667, "x": "足りないじゃない。"}, {"t": 818.2166666666667, "x": "半分以上が足りない計算になる。"}, {"t": 820.3, "x": "行政の責任で入院している人は5万数千人だった。"}, {"t": 823.85, "x": "入院の費用は、1人で年に30万円ほどかかるという。"}, {"t": 827.5666666666667, "x": "でも、120万って正確な数字なの？"}, {"t": 830.4, "x": "いい質問だ。大臣自身が\n「ある程度推定」と言っている。"}, {"t": 834.1666666666666, "x": "なぜ数えられなかったのか。"}, {"t": 835.8333333333334, "x": "当時の仕組みで、役所に知らせるのは\n警察官と検察官だけだった。"}, {"t": 840.2, "x": "家族や学校の先生には、知らせる決まりが無い。"}, {"t": 843.2166666666667, "x": "社会の目を恐れて、家族が隠してしまうこともあった。"}, {"t": 846.7166666666667, "x": "じゃあ、知らせる決まりを作ればいいの？"}, {"t": 848.9833333333333, "x": "大臣もそこで止まった。"}, {"t": 850.4333333333333, "x": "人権の問題があるからだ。"}, {"t": 852.2833333333333, "x": "ここで念を押しておく。"}, {"t": 853.6166666666667, "x": "病気がある人が危ないという話では、まったくない。"}, {"t": 856.8, "x": "のちに東京大学の教授が国会で話している。"}, {"t": 859.8166666666667, "x": "ああいう事件を起こすのは「ごく一部」だ。"}, {"t": 862.3333333333334, "x": "社会の条件も重なって起きる、と。"}, {"t": 864.65, "x": "この回も、その立場で話を進める。"}, {"t": 867.9, "x": "事件のあと、新聞と雑誌に1つの言葉が広がった。"}, {"t": 871.45, "x": "「野放し」だ。"}, {"t": 872.6166666666667, "x": "ひどい言い方ね。人に向けて。"}, {"t": 874.75, "x": "厚生大臣も5月7日の委員会で言っている。"}, {"t": 877.5833333333334, "x": "そういう言葉で表現するのは「不適当」だ。"}, {"t": 880.4833333333333, "x": "ただ世間では、この言葉が受け入れられやすい。"}, {"t": 883.1666666666666, "x": "大臣はそこも認めていた。"}, {"t": 884.9666666666667, "x": "そして心配が1つ出てくる。"}, {"t": 886.9, "x": "警察が入ってくるのではないか。"}, {"t": 889.0333333333333, "x": "どういうこと？"}, {"t": 890.1666666666666, "x": "公安委員会から、病気の人の調べを\n求める声があった。"}, {"t": 893.7833333333333, "x": "議員は、法律の改正で警察の力が入ることを恐れた。"}, {"t": 897.5666666666667, "x": "戦争中のあの状態が戻るのではないか、と。"}, {"t": 900.4, "x": "関係者が隠すようになり、隠れた\n患者が増えるとも言った。"}, {"t": 904.0833333333334, "x": "厚生大臣はなんて答えたの？"}, {"t": 906.1666666666666, "x": "はっきり否定した。"}, {"t": 907.45, "x": "法律の目的は治療と予防で、\n警察の目的とは関係ない。"}, {"t": 911.45, "x": "通報するとしても、専門の医者から保健所へだ。"}, {"t": 914.55, "x": "警察の文字がどこかへ出るはずもない、と。"}, {"t": 917.0833333333334, "x": "さらに大臣はこう続けた。"}, {"t": 918.85, "x": "おそろしいものだという\n考え方は、なくさなければならない。"}, {"t": 922.2833333333333, "x": "事件の6週間後の言葉だ。"}, {"t": 924.2666666666667, "x": "「改正はあの事件に関係なく\n進んでいた」とも言っている。"}, {"t": 927.8333333333334, "x": "事件のせいで急に決まったわけじゃないの？"}, {"t": 930.3666666666667, "x": "本人はそう言った。この話は最後にもう一度戻る。"}, {"t": 934.25, "x": "では、血の話に入ろう。"}, {"t": 935.9833333333333, "x": "1964年6月25日。"}, {"t": 938.5, "x": "衆議院の社会労働委員会。"}, {"t": 940.4333333333333, "x": "事件からちょうど3か月後だ。"}, {"t": 942.35, "x": "ある議員が、ついでに伺いたいと切り出した。"}, {"t": 945.1333333333333, "x": "ついでなの？"}, {"t": 946.25, "x": "言葉の上ではな。"}, {"t": 947.4333333333333, "x": "電車の中に週刊現代の広告が出ているという。"}, {"t": 950.4833333333333, "x": "大使の血清肝炎は黄色い血によったものだ、と。"}, {"t": 953.6333333333333, "x": "大使、肝炎になってたの？"}, {"t": 955.55, "x": "なっていた。輸血のあとにかかる肝臓の病気だ。"}, {"t": 958.5833333333334, "x": "議員は前の日に雑誌を買わせた。"}, {"t": 960.5666666666667, "x": "でもまだ読んでいない。そう正直に言っている。"}, {"t": 963.2666666666667, "x": "広告の見出しだけで質問したの？"}, {"t": 965.6333333333333, "x": "それだけ気になる見出しだったのだろう。"}, {"t": 967.7833333333333, "x": "議員はこう続けた。"}, {"t": 969.1, "x": "もしそうなら、何とも\n相済まぬことで、気の毒なことだ。"}, {"t": 972.6, "x": "そして厚生省に聞いた。調べたのか、と。"}, {"t": 975.4166666666666, "x": "ここで大事なのは順番だ。"}, {"t": 977.15, "x": "刃物の話は3月だった。"}, {"t": 979.1, "x": "血の話が大使と結びついて国会に出たのは6月になる。"}, {"t": 982.7833333333333, "x": "間には週刊誌の見出しが1つ挟まっている。"}, {"t": 985.8, "x": "まさか、それまで誰も言ってなかったの？"}, {"t": 988.3333333333334, "x": "会議録で大使と輸血を結ぶ\n発言は、これが最初の1件だ。"}, {"t": 992.3333333333334, "x": "今回取った発言の範囲では、そうなっている。"}, {"t": 995.2, "x": "では厚生省は、どう答えたのか。"}, {"t": 998.0, "x": "答えたのは厚生省の薬務局長だ。"}, {"t": 1000.5, "x": "局長はまず、肝炎の一般論から入った。"}, {"t": 1003.3333333333334, "x": "売血の人の血でなくても、肝炎は起こることがある。"}, {"t": 1006.6, "x": "普通の健康な人の血でも、3％から5％は出るという。"}, {"t": 1010.8666666666667, "x": "売血だけのせいじゃないってこと？"}, {"t": 1012.9833333333333, "x": "そう言いたかったのだろう。"}, {"t": 1014.4, "x": "そして大使について、調べた結果を話した。"}, {"t": 1017.35, "x": "大部分は、病院の中の人や\n外国人が出した血のようだという。"}, {"t": 1021.4833333333333, "x": "じゃあ売血じゃなかったのね。"}, {"t": 1023.2666666666667, "x": "局長はそこで止まらない。"}, {"t": 1024.9, "x": "医療の中でどの血がどれだけ\n使われたか、あとでは分かりにくい。"}, {"t": 1028.5833333333333, "x": "応急のときに売血の保存血が使われたかもしれない。"}, {"t": 1032.0833333333333, "x": "かもしれない？"}, {"t": 1033.2166666666667, "x": "そして、記録に残るのがこの言葉だ。"}, {"t": 1035.7333333333333, "x": "「どちらによるかという結論はつけにくい」。"}, {"t": 1038.2, "x": "なんだか、もやもやするわね。"}, {"t": 1040.1166666666666, "x": "ところがだ。2日後の決算委員会で、\n別の議員が言い切る。"}, {"t": 1043.9, "x": "「山谷から持ってきた血を輸血する」。"}, {"t": 1046.0166666666667, "x": "「それがライシャワー大使のように肝炎を起こす」。"}, {"t": 1048.65, "x": "えっ。局長の話と違うじゃない。"}, {"t": 1051.0166666666667, "x": "違う。そして時代が下るとさらに変わる。"}, {"t": 1053.6333333333334, "x": "2009年、厚生労働省の委員会に\n出た資料はこう書いた。"}, {"t": 1057.3, "x": "大使は「売血の輸血後に肝炎を発症」。"}, {"t": 1060.0833333333333, "x": "アメリカの大学新聞は\n「肝炎に汚染された血」と書いた。"}, {"t": 1063.7666666666667, "x": "どの血だったのかは、局長の答えのまま揃っていない。"}, {"t": 1067.0333333333333, "x": "第一報の左と右を、思い出してほしい。"}, {"t": 1069.8666666666666, "x": "急いで広まった話と、確かな記録は違う。"}, {"t": 1073.0333333333333, "x": "そうだ。この回は、どちらとも言い切らない。"}, {"t": 1076.25, "x": "では、なぜ週刊誌の見出しがそこまで効いたのか。"}, {"t": 1079.25, "x": "答えは、その少し前の国会にある。"}, {"t": 1081.7166666666667, "x": "6月2日の参議院の社会労働委員会。"}, {"t": 1084.4833333333333, "x": "ある女性議員が、血を売る現場へ行った話をした。"}, {"t": 1087.5333333333333, "x": "現場？"}, {"t": 1088.6666666666667, "x": "議員の発言によると、舞台は\n東京の山谷と大阪の釜ケ崎だ。"}, {"t": 1092.8333333333333, "x": "食べていけないから血を売る。"}, {"t": 1094.3833333333334, "x": "「きょうもおれは八本目を抜いてきた」と\n言う人がいたという。"}, {"t": 1097.7166666666667, "x": "8本？　1日で？"}, {"t": 1099.2166666666667, "x": "議員は、ひどい例としてそう話している。"}, {"t": 1101.6833333333334, "x": "別の日には、2本取ったと喜ぶ人の話もした。"}, {"t": 1105.1, "x": "顔色も、人のものとは思えないほどだったという。"}, {"t": 1108.0833333333333, "x": "場所の様子も語られた。"}, {"t": 1109.6833333333334, "x": "寝かされて、窓から腕だけを出す。"}, {"t": 1111.9, "x": "許可の判こを見せれば、顔色も見ずに血を抜く。"}, {"t": 1114.8666666666666, "x": "顔も見ないの？"}, {"t": 1115.9666666666667, "x": "議員の言葉ではそうだ。"}, {"t": 1117.3166666666666, "x": "「身ぶるいがいたしました」と続く。"}, {"t": 1119.45, "x": "別の議員は、集まる血の流れをこう説明した。"}, {"t": 1122.5, "x": "血の8割は、株式会社を通して集められる。"}, {"t": 1125.5666666666666, "x": "その大部分が、山谷や釜ケ崎から来ている。"}, {"t": 1128.6166666666666, "x": "売る人が悪いんじゃないわよね。"}, {"t": 1130.5166666666667, "x": "もちろんだ。議員たちもそう言っている。"}, {"t": 1132.75, "x": "貧しさから血を売り、体を壊し、また貧しくなる。"}, {"t": 1136.05, "x": "ある議員はその輪を指摘した。"}, {"t": 1137.8333333333333, "x": "血を売った人も、手術を受ける人と同じ人間だ、と。"}, {"t": 1141.3666666666666, "x": "問題にされたのは、それで回っていた\n仕組みのほうだった。"}, {"t": 1145.3833333333334, "x": "そろそろ教えて。黄色い血って何なの？"}, {"t": 1147.9, "x": "比べる話からしよう。"}, {"t": 1149.3833333333334, "x": "厚生省の決まりでは、採血は月に1回までだった。"}, {"t": 1152.8333333333333, "x": "1回の目安は200ccの1本だ。"}, {"t": 1155.2666666666667, "x": "血の濃さを測る比重の基準もあった。"}, {"t": 1157.5666666666666, "x": "1.052より薄い人からは取ってはいけない。"}, {"t": 1160.5333333333333, "x": "決まりだけは立派だったのね。"}, {"t": 1162.45, "x": "あった。でも守る仕組みが弱かった。"}, {"t": 1164.7333333333333, "x": "局長が国会で認めている。"}, {"t": 1166.65, "x": "名前を変え、場所を変えて血を売る人がいる。"}, {"t": 1169.1833333333334, "x": "それを登録して管理する組織が、まだ無い。"}, {"t": 1172.0, "x": "ある議員の手元の資料には、こんな人が出てくる。"}, {"t": 1175.0, "x": "1か月に200ccを40本。"}, {"t": 1177.2833333333333, "x": "月に1本の決まりで、40本？"}, {"t": 1179.6833333333334, "x": "資料の上の話だが、議員はそう指摘した。"}, {"t": 1182.55, "x": "間を空けずに抜き続けると、血が回復しない。"}, {"t": 1185.5, "x": "女性議員の言葉を借りると、こうなる。"}, {"t": 1187.8166666666666, "x": "「血が黄色い血になって、\n血球のないような血が売られている」。"}, {"t": 1191.2833333333333, "x": "それで黄色い血なのね。"}, {"t": 1192.8166666666666, "x": "血の赤い成分が足りなくなった血、という意味だ。"}, {"t": 1195.6666666666667, "x": "厚生労働省の年表は、この問題の発生を\n1959年の欄に置いている。"}, {"t": 1200.85, "x": "保存血が広まり、繰り返しの採血が\n問題になった時期だ。"}, {"t": 1204.85, "x": "じゃあ事件の5年も前からあったのね。"}, {"t": 1207.2, "x": "あった。事件が作った問題ではない。"}, {"t": 1210.2166666666667, "x": "では97％という数字の中身を見よう。"}, {"t": 1213.1333333333334, "x": "民間の血液銀行が認められたのは\n昭和26年ごろ。1951年だ。"}, {"t": 1218.45, "x": "それ以前、手術に町の銀行の血を\n使うことは少なかった。"}, {"t": 1222.2333333333333, "x": "医学が進み、手術と輸血が増えていく。"}, {"t": 1224.9666666666667, "x": "1956年から57年ごろ、保存血は\n22万から23万リットルだった。"}, {"t": 1230.7166666666667, "x": "1964年には58万リットルになっている。"}, {"t": 1234.3166666666666, "x": "2倍半！"}, {"t": 1235.4333333333334, "x": "局長はもう1つ、意外な理由を挙げた。"}, {"t": 1238.0166666666667, "x": "健康保険だ。"}, {"t": 1239.25, "x": "保険？　血と関係あるの？"}, {"t": 1241.05, "x": "昔の血は自己負担で、親戚や\n知人に頼んで出してもらった。"}, {"t": 1245.0166666666667, "x": "保険で保存血が使えるようになると、頼まなくなった。"}, {"t": 1248.4666666666667, "x": "簡単に手に入るからだ。"}, {"t": 1250.2166666666667, "x": "便利になった分、買った血に頼るようになったのね。"}, {"t": 1253.3666666666666, "x": "民間の血液銀行は22社あった。"}, {"t": 1255.8666666666666, "x": "日赤などが17か所で、こちらは献血と預血が中心だ。"}, {"t": 1259.95, "x": "預血って？"}, {"t": 1261.0833333333333, "x": "先に血を預けておき、\n必要なときに返してもらう方法だ。"}, {"t": 1264.8, "x": "献血の割合は、昭和31、2年ごろで0.05％ほど。"}, {"t": 1269.3666666666666, "x": "1964年でやっと3％に届くくらいだった。"}, {"t": 1273.1166666666666, "x": "残りのほぼ全部が売血になる。"}, {"t": 1275.15, "x": "計60万リットルの97％。"}, {"t": 1277.9, "x": "手術を受ける人は、知らなかったのよね。"}, {"t": 1280.6166666666666, "x": "普通は知らないだろう。"}, {"t": 1281.95, "x": "ある議員は話を聞いて\n「寒けがするような思い」と語った。"}, {"t": 1285.65, "x": "自分なら親戚か友だちの血をもらいたい、と続けた。"}, {"t": 1289.65, "x": "比重の検査についても、妙な数字が国会に出ている。"}, {"t": 1293.0166666666667, "x": "6月9日、女性議員が\n日本輸血学会の雑誌を読み上げた。"}, {"t": 1297.1666666666667, "x": "役所が調べに来る日と、来ない日の合格率だ。"}, {"t": 1300.4, "x": "同じ検査で違うの？"}, {"t": 1301.95, "x": "調べに来る日は31.1％。"}, {"t": 1304.5166666666667, "x": "来ない日は62.8％だ。"}, {"t": 1307.05, "x": "倍じゃない！"}, {"t": 1308.1833333333334, "x": "日赤の冊子の数字はさらに開いている。"}, {"t": 1310.7166666666667, "x": "調べに来る日は16.6％、来ない日は47.1％。"}, {"t": 1315.4666666666667, "x": "来ない日だけ、血が濃くなるわけないわよね。"}, {"t": 1318.15, "x": "ない。議員も同じことを言った。"}, {"t": 1320.0333333333333, "x": "合格しないはずの人を通している、と。"}, {"t": 1322.5166666666667, "x": "しかも調べの日は、役所の黒板を見れば分かる。"}, {"t": 1325.5833333333333, "x": "そう言う人がいると、議員は紹介している。"}, {"t": 1328.3, "x": "抜き打ちじゃないのね。"}, {"t": 1329.6833333333334, "x": "週に2回は調べている、というのが役所の説明だった。"}, {"t": 1333.1166666666666, "x": "議員はさらに聞いた。処罰はしたのか。"}, {"t": 1335.5666666666666, "x": "違反はあるけれど処罰したことはない。"}, {"t": 1337.7333333333333, "x": "議員はそう受け止めて、納得がいかないと述べた。"}, {"t": 1340.7, "x": "局長も、監視が行き届かないことは認めた。"}, {"t": 1343.6666666666667, "x": "局長の別の日の言葉は、なお正直だ。"}, {"t": 1346.4666666666667, "x": "実際にどれだけ血を出しているかは、\nきわめてつかみにくい。"}, {"t": 1349.9666666666667, "x": "役所も分かってなかったのね。"}, {"t": 1351.95, "x": "把握できていないことを、役所が自分で認めた。"}, {"t": 1355.55, "x": "どうして、そこまでして集めたの？"}, {"t": 1357.8333333333333, "x": "お金の話がある。"}, {"t": 1359.1333333333334, "x": "議員が国会で紹介した数字はこうだ。"}, {"t": 1361.5666666666666, "x": "業者が500円で買った血が、1650円で売れる。"}, {"t": 1365.15, "x": "3倍以上じゃない。"}, {"t": 1366.45, "x": "12月の委員会でも、200ccが\n1650円という話が出ている。"}, {"t": 1371.1333333333334, "x": "保険の支払いと同じ額だそうだ。"}, {"t": 1373.3166666666666, "x": "新聞には、血液銀行の技師の話も出ていた。"}, {"t": 1376.5, "x": "この血は危ないと思っても、\n捨てれば損になると言われる。"}, {"t": 1379.8, "x": "技師は身ぶるいする思いだという。"}, {"t": 1381.6, "x": "議員は記事のこんな一節も読んだ。"}, {"t": 1383.7166666666667, "x": "「シモタ屋で、台所か、フロ場に冷蔵庫を一つ置き」。"}, {"t": 1387.2166666666667, "x": "えっ、お風呂場に血を？"}, {"t": 1388.7166666666667, "x": "これは新聞が伝えた話で、議員の紹介だ。"}, {"t": 1391.7166666666667, "x": "局長の説明はまったく違う。"}, {"t": 1393.7666666666667, "x": "民間の血液銀行の設備は、\nきわめて優秀だと答えていた。"}, {"t": 1397.75, "x": "むしろ日赤より技術は上ではないか、とまで言った。"}, {"t": 1400.8833333333334, "x": "問題は設備ではなく、血の取り方だという。"}, {"t": 1403.7333333333333, "x": "どっちが本当なの？"}, {"t": 1405.1833333333334, "x": "全部の店が同じだったわけではないだろう。"}, {"t": 1407.6333333333334, "x": "ただ1つ言えることがある。"}, {"t": 1409.2166666666667, "x": "血は商品として動いていた。"}, {"t": 1411.0333333333333, "x": "売る人には生活がかかり、\n買う会社には利益がかかる。"}, {"t": 1414.4166666666667, "x": "間に立つはずの検査が、弱かった。"}, {"t": 1417.5, "x": "ここで厚生省の答えの移り変わりを見てみよう。"}, {"t": 1420.3, "x": "同じ薬務局長の答弁を、順に並べる。"}, {"t": 1423.1833333333334, "x": "まず事件の9日後、4月2日の決算委員会。"}, {"t": 1426.4666666666667, "x": "局長は輸血の事故について聞かれてこう言った。"}, {"t": 1429.3166666666666, "x": "「保存血液の品質が云々されるということは、\n最近では全然ない」。"}, {"t": 1433.7333333333333, "x": "全然ない、って言い切ったの？"}, {"t": 1435.5833333333333, "x": "言い切った。肝炎は世界で\n研究中とも付け加えている。"}, {"t": 1439.0166666666667, "x": "買った血でも、決して\n中身の悪いものにはならないと答えた。"}, {"t": 1442.65, "x": "次は6月2日。厚生大臣が一歩踏み込む。"}, {"t": 1445.8, "x": "「厚生省の行政の一つの弱点」。"}, {"t": 1448.0, "x": "局長も、売血のほうが肝炎が\n多いという一部のデータを認めた。"}, {"t": 1452.1166666666666, "x": "だんだん変わってきたわね。"}, {"t": 1453.8166666666666, "x": "そして6月27日の決算委員会だ。"}, {"t": 1456.6833333333334, "x": "議員は北海道の例を持ち出した。"}, {"t": 1458.8, "x": "北海道には民間の血液銀行が1つも無かった。"}, {"t": 1462.1666666666667, "x": "献血が中心で、肝炎は百人に2、\n3人だと議員は調べたという。"}, {"t": 1466.65, "x": "血液銀行の血では20％から30％に及ぶ、とも言った。"}, {"t": 1471.3166666666666, "x": "そんなに違うの？"}, {"t": 1472.5833333333333, "x": "議員の調べなので、数字はそのまま置いておく。"}, {"t": 1475.4, "x": "議員は問いつめた。売血の血が\n肝炎につながるのは分かるはずだ。"}, {"t": 1479.3, "x": "局長の答えは「おっしゃるとおりでございます」。"}, {"t": 1482.1333333333334, "x": "4月の答えと全然違うじゃない！"}, {"t": 1484.3833333333334, "x": "3か月で、ここまで動いた。"}, {"t": 1486.3333333333333, "x": "局長の理由はこうだ。"}, {"t": 1487.8166666666666, "x": "多くの人から少しずつ集めれば、\n危ない血の割合は下がる。"}, {"t": 1491.5333333333333, "x": "限られた人から何度も取れば、回数は増えていく。"}, {"t": 1494.7, "x": "理屈は事件の前から同じだったはずだ。"}, {"t": 1497.2, "x": "変わったのは、世の中の見る目のほうだった。"}, {"t": 1499.95, "x": "その間に、何があったの？"}, {"t": 1501.9, "x": "それを数字で見てみよう。"}, {"t": 1503.9666666666667, "x": "国会会議録を検索して、発言の数を数えた。"}, {"t": 1507.4, "x": "1962年の1月から、事件の前の日までの2年あまり。"}, {"t": 1511.7166666666667, "x": "「売血」という言葉が出る発言は1件だけだった。"}, {"t": 1515.1166666666666, "x": "1件？　それも見たの？"}, {"t": 1516.75, "x": "見た。外国の車の話で「販売血」と\n文字が並んだだけだった。"}, {"t": 1521.35, "x": "つまり血の話としては0件になる。"}, {"t": 1523.8166666666666, "x": "じゃあ事件のあとは？"}, {"t": 1525.1333333333334, "x": "事件の日から、その年の末まで。"}, {"t": 1527.4166666666667, "x": "9か月ほどで71件だ。"}, {"t": 1529.45, "x": "「黄色い血」という言葉は、事件の前は1件も無い。"}, {"t": 1532.6666666666667, "x": "それが8件に増えている。"}, {"t": 1534.3833333333334, "x": "一気に増えたのね。"}, {"t": 1535.7333333333333, "x": "ただし、ここで早合点してはいけない。"}, {"t": 1538.0833333333333, "x": "事件だけが国会を動かしたわけではない。"}, {"t": 1540.6166666666666, "x": "女性議員は昭和23年から輸血を\n取り上げてきたと言っている。"}, {"t": 1544.4166666666667, "x": "1961年までの国会にも、売血の発言は9件あった。"}, {"t": 1549.0166666666667, "x": "読売新聞は、黄色い\n血の追放キャンペーンを張っていた。"}, {"t": 1552.3666666666666, "x": "記者自身も血を売って調べたと伝えられている。"}, {"t": 1555.1166666666666, "x": "ある議員は言った。「昨年から」\n週刊誌や新聞が叫んでいた。"}, {"t": 1559.0333333333333, "x": "局長は動きの始まりを「ことしの三、\n四月ごろから」と答えた。"}, {"t": 1563.4166666666667, "x": "火種はあって、そこに事件が重なったのね。"}, {"t": 1566.3833333333334, "x": "そういう見方が、記録には合っている。"}, {"t": 1568.6333333333334, "x": "年表も「契機」と書くだけだ。"}, {"t": 1570.85, "x": "大使が売血の問題を作ったのではない。"}, {"t": 1573.4333333333334, "x": "見ないふりができない形にした、というのが近い。"}, {"t": 1577.0166666666667, "x": "国会の外でも動いていた人たちがいる。"}, {"t": 1579.5333333333333, "x": "学生だ。"}, {"t": 1580.6666666666667, "x": "6月27日の決算委員会で、議員がこう明かした。"}, {"t": 1584.3333333333333, "x": "学生の奉仕団と千葉大学の先生から話を聞いた。"}, {"t": 1587.7833333333333, "x": "場所は第一議員会館の会議室で、\n非公式だったという。"}, {"t": 1591.5833333333333, "x": "学生が国会議員に説明したの？"}, {"t": 1594.0333333333333, "x": "そうらしい。議員はこう言っている。"}, {"t": 1595.8833333333334, "x": "厚生省の資料と学生の資料を比べた。"}, {"t": 1598.4833333333333, "x": "「学生の奉仕団の資料のほうが上なんです」。"}, {"t": 1601.2333333333333, "x": "厚生省より学生のほうが詳しかったの？"}, {"t": 1603.9, "x": "議員は「残念なこと」と言い、\n涙の出るような思いとも語った。"}, {"t": 1607.9666666666667, "x": "ここで議員が持ち出したのが、予算の数字だ。"}, {"t": 1610.7833333333333, "x": "献血を進めるお金は、昭和37年度に1700万円。"}, {"t": 1614.9, "x": "次の年度は1000万円になっている。"}, {"t": 1617.05, "x": "昭和39年度は2000万円が1600万円に減らされた。"}, {"t": 1621.0833333333333, "x": "血の問題に、それだけ？"}, {"t": 1622.8833333333334, "x": "議員は「こんなはした金」とまで言った。"}, {"t": 1625.4666666666667, "x": "移動採血車は全国で22台しかない。"}, {"t": 1628.1333333333334, "x": "1台で1日に集められるのは100人から150人ほどだ。"}, {"t": 1631.8666666666666, "x": "10日ほど前には新潟地震が起きていた。"}, {"t": 1634.3833333333334, "x": "別の議員も、地震と同じくらい急ぐ話だと迫った。"}, {"t": 1637.9333333333334, "x": "予備費を使ってでもやれ。それが議員たちの声だった。"}, {"t": 1641.25, "x": "厚生省は動いたの？"}, {"t": 1642.7833333333333, "x": "その夏、厚生大臣が交代した。"}, {"t": 1645.2333333333333, "x": "新しい大臣は、予備費を\n使ってでも対策を立てると話した。"}, {"t": 1649.7833333333333, "x": "1964年8月21日。"}, {"t": 1652.4166666666667, "x": "事件から150日後。"}, {"t": 1654.15, "x": "閣議で1つの文書が決まった。"}, {"t": 1656.0833333333333, "x": "題名は「献血の推進について」。"}, {"t": 1658.5, "x": "読むと短い。"}, {"t": 1659.5, "x": "「可及的速やかに保存血液を献血に\nより確保する体制を確立する」。"}, {"t": 1664.25, "x": "可及的速やかに、ってどういう意味？"}, {"t": 1666.55, "x": "できるだけ早く、という意味だ。"}, {"t": 1668.4833333333333, "x": "国と地方が献血の考えを広める。"}, {"t": 1670.95, "x": "日本赤十字社と自治体が、受け入れの体制を作る。"}, {"t": 1674.3166666666666, "x": "文面はそれだけだった。"}, {"t": 1675.9833333333333, "x": "大使の名前は書いてあるの？"}, {"t": 1677.7833333333333, "x": "資料に載った文面には無い。"}, {"t": 1679.5, "x": "売血という字も、そこには無かった。"}, {"t": 1681.9, "x": "それでも厚生省の資料は、\n大使の件を契機に数えている。"}, {"t": 1685.5166666666667, "x": "すぐにお金も動いた。"}, {"t": 1686.9666666666667, "x": "予備費から約8000万円。"}, {"t": 1688.7166666666667, "x": "それまでの年の予算は1666万円ほどだ。"}, {"t": 1692.2833333333333, "x": "一気に5倍近くじゃない！"}, {"t": 1693.9666666666667, "x": "当時、血液銀行も移動採血車も無い\n県が26都道府県あった。"}, {"t": 1698.45, "x": "そこへ26台分の車を出すことになった。"}, {"t": 1701.3333333333333, "x": "3月の国会にほとんど出なかった\n血の話が、ここまで来た。"}, {"t": 1705.2166666666667, "x": "もちろん、大使の血の答えは出ていない。"}, {"t": 1707.65, "x": "答えが出ないまま、仕組みだけ変わったのね。"}, {"t": 1710.4333333333334, "x": "そこがこの話の不思議なところだ。"}, {"t": 1712.65, "x": "どの血だったのか分からなくても、\n変えるべき理由はそろっていた。"}, {"t": 1716.25, "x": "局長自身が「対策を急ぎたい」と言っていた。"}, {"t": 1719.9666666666667, "x": "結果はすぐ数字に出た。"}, {"t": 1721.55, "x": "献血と預血を足した割合を見る。"}, {"t": 1723.7833333333333, "x": "1963年の1月から11月までは2.3％だった。"}, {"t": 1728.5166666666667, "x": "1964年の同じ期間では12.4％になる。"}, {"t": 1732.65, "x": "5倍以上！"}, {"t": 1733.7666666666667, "x": "月ごとに見るとさらにはっきりする。"}, {"t": 1735.9, "x": "9月が25.4％。10月が25.8％。"}, {"t": 1740.1, "x": "11月は28.0％だ。"}, {"t": 1742.7, "x": "閣議決定の翌月から、そんなに？"}, {"t": 1745.25, "x": "局長は、組織化の効果が上がっていると答えた。"}, {"t": 1748.3833333333334, "x": "ただ良い話ばかりではない。"}, {"t": 1750.05, "x": "売血が急に減ると、今度は血が足りなくなる。"}, {"t": 1753.0, "x": "10月の委員会で、ある議員が厳しく言っている。"}, {"t": 1755.9166666666667, "x": "血が無くて手術できない病院が、たくさんあると。"}, {"t": 1759.05, "x": "えっ、逆に困ってるじゃない。"}, {"t": 1760.9666666666667, "x": "局長も、若干不足していると認めた。"}, {"t": 1763.7666666666667, "x": "翌年3月にも、血が足りないと新聞に出ている。"}, {"t": 1766.9833333333333, "x": "12月には、厚生大臣が山谷を訪ねた話をした。"}, {"t": 1770.5333333333333, "x": "売血が7割5分ほど減ったと聞いたという。"}, {"t": 1773.2666666666667, "x": "別の議員は、業者が預血で\n巻き返していると警告した。"}, {"t": 1776.9166666666667, "x": "一方で、1人の議員はこうも言った。"}, {"t": 1779.2, "x": "献血でも足りないなら、検査を強めて買う血も認めよ。"}, {"t": 1782.7833333333333, "x": "いろんな意見があったのね。"}, {"t": 1784.45, "x": "あった。切り替えは一直線には進まなかった。"}, {"t": 1787.9666666666667, "x": "では、売血はいつ終わったのか。"}, {"t": 1790.0166666666667, "x": "行政の年表によると、1969年。"}, {"t": 1793.2, "x": "民間の血液銀行が、\n売血での輸血用の保存血の製造をやめた。"}, {"t": 1797.8833333333334, "x": "事件から5年後ね。"}, {"t": 1799.3833333333334, "x": "そうだ。ただ、これで全部が\n献血になったわけではない。"}, {"t": 1802.7666666666667, "x": "預血の仕組みがまだ残っていた。"}, {"t": 1804.8333333333333, "x": "民間の銀行がそれもやめたのは1974年だ。"}, {"t": 1808.3666666666666, "x": "この年、輸血用の血はすべて\n献血で確保する体制になった。"}, {"t": 1812.5666666666666, "x": "事件から10年かかったのね。"}, {"t": 1814.6, "x": "10年だ。最初の閣議決定の「可及的速やかに」から\n数えても同じになる。"}, {"t": 1819.7, "x": "局長の話していた\n「半分は売血のまま」という目標も超えた。"}, {"t": 1824.0833333333333, "x": "半分でいいと思ってたの？"}, {"t": 1825.8166666666666, "x": "6月の時点の目標は、売血と献血で半分ずつだった。"}, {"t": 1829.8166666666666, "x": "一度に全部やめれば命に\n関わる、というのがその理由だ。"}, {"t": 1833.3166666666666, "x": "ただ、献血に変わっても肝炎が\nすぐ消えたわけではない。"}, {"t": 1836.6666666666667, "x": "当時、肝炎の原因を見つける\n検査は確立していなかった。"}, {"t": 1840.3833333333334, "x": "医務局長は、献血でも黄疸は防げないと答えている。"}, {"t": 1843.8333333333333, "x": "国立病院の調べでは、\n7463例のうち5.2％に肝炎が出た。"}, {"t": 1849.4333333333334, "x": "売血をやめただけじゃ足りないのね。"}, {"t": 1851.6333333333334, "x": "足りない。翌年の予算で、\n肝炎の研究に約500万円が回された。"}, {"t": 1856.1833333333334, "x": "血の安全の話は、ここから長い道のりになる。"}, {"t": 1859.2666666666667, "x": "もう1つ、年表には続きがある。"}, {"t": 1861.5333333333333, "x": "売血が終わったと言えるのは、輸血用の血の話だ。"}, {"t": 1864.8333333333333, "x": "血から作る別の薬の原料は、\n1974年の時点でも買った血が多かった。"}, {"t": 1870.3166666666666, "x": "まだ買ってたの？"}, {"t": 1871.5, "x": "年表には「売血由来」と書いてある。"}, {"t": 1874.0833333333333, "x": "有料の採血が完全に無くなるのは1990年。"}, {"t": 1877.6333333333334, "x": "刃物の日から数えると、26年がたっていた。"}, {"t": 1880.9166666666667, "x": "10年でも長いのに、26年なのね。"}, {"t": 1883.6833333333334, "x": "その先の話は別の回の題材になるので、\nここでは踏み込まない。"}, {"t": 1888.3833333333334, "x": "さて、途中で置いてきた話に戻ろう。"}, {"t": 1890.85, "x": "精神の病気についての法律だ。"}, {"t": 1892.9833333333333, "x": "1965年3月18日、厚生大臣が改正の説明に立った。"}, {"t": 1898.05, "x": "柱は6つあった。"}, {"t": 1899.3666666666666, "x": "都道府県に相談と研究の拠点を作ること。"}, {"t": 1902.3333333333333, "x": "保健所の訪問の体制を強くすること。"}, {"t": 1904.8666666666666, "x": "通院の医療費の半分を、公費で持つこと。"}, {"t": 1907.7, "x": "通院でいいようになったのね。"}, {"t": 1909.4666666666667, "x": "薬が進んで、入院しなくても\n治療できる人が増えていた。"}, {"t": 1913.2, "x": "一方で、緊急のときに\n48時間入院させる制度もできた。"}, {"t": 1917.2833333333333, "x": "そして、もう1つ大きな変更がある。"}, {"t": 1919.7166666666667, "x": "大臣の言葉では「私宅監置制度たる\n保護拘束制度」の廃止だ。"}, {"t": 1924.2166666666667, "x": "したくかんち？"}, {"t": 1925.35, "x": "病気の人を、家の中にとどめて\n見張ることを認めた古い決まりだ。"}, {"t": 1929.4166666666667, "x": "法律の条文では、第43条が丸ごと削られている。"}, {"t": 1933.1833333333334, "x": "1965年まで残ってたの？"}, {"t": 1935.7666666666667, "x": "残っていた。"}, {"t": 1936.9, "x": "法案は6月1日の参議院本会議に上がった。"}, {"t": 1940.0166666666667, "x": "公布は1965年6月30日。"}, {"t": 1942.8833333333334, "x": "法律第139号だ。"}, {"t": 1944.8666666666666, "x": "ただ、専門家が満足したわけではない。"}, {"t": 1947.45, "x": "東京大学の教授は5月の委員会でこう話した。"}, {"t": 1950.6, "x": "欧米に比べて非常に遅れている。"}, {"t": 1952.6833333333334, "x": "事件が起きると、危険だという考えが強くなる。"}, {"t": 1955.7333333333333, "x": "家族は肩身が狭くなり、隠すようになる。"}, {"t": 1958.4333333333334, "x": "教授は、この法案では不十分だと述べた。"}, {"t": 1961.2166666666667, "x": "事件が法律を変えて、事件が偏見も強めたのね。"}, {"t": 1964.7333333333333, "x": "大臣は「事件に関係なく進んでいた」と言った。"}, {"t": 1968.0333333333333, "x": "議員は「事件が起こってからあわてて」と言った。"}, {"t": 1970.95, "x": "ここでも答えは揃わない。"}, {"t": 1973.1833333333334, "x": "最後に、ライシャワーさんのその後を話す。"}, {"t": 1975.6166666666666, "x": "伝記によると、ハワイの病院に7月1日まで入っていた。"}, {"t": 1979.4166666666667, "x": "足の回復と、肝炎の治療のためだ。"}, {"t": 1982.0833333333333, "x": "日本には戻ってきたの？"}, {"t": 1983.7833333333333, "x": "戻った。大使の仕事を続けている。"}, {"t": 1986.1333333333334, "x": "アメリカ国務省の記録では、離任は1966年8月19日。"}, {"t": 1990.9833333333333, "x": "ハーバードへ戻り、1981年まで教えた。"}, {"t": 1994.2833333333333, "x": "大学新聞は1983年に、肝臓の病気は\n1964年からだと書いた。"}, {"t": 2000.15, "x": "亡くなったのは1990年9月1日。79歳だった。"}, {"t": 2004.5, "x": "百科事典は、輸血でかかった\n慢性肝炎の合併症と記している。"}, {"t": 2008.85, "x": "26年も、あの日が続いていたのね。"}, {"t": 2011.5666666666666, "x": "そうなる。"}, {"t": 2012.7, "x": "ここで1つ、言っておくことがある。"}, {"t": 2014.85, "x": "この事件には、大使の名ゼリフとして\n語られる言葉がある。"}, {"t": 2018.4166666666667, "x": "血についての有名な言葉だ。"}, {"t": 2020.2333333333333, "x": "今回、会議録と公文書で原典を探した。"}, {"t": 2023.2, "x": "でも確かめられなかったので、読み上げない。"}, {"t": 2025.9, "x": "第一報の左と右、と同じ気持ちで？"}, {"t": 2028.6333333333334, "x": "そのとおりだ。"}, {"t": 2029.7666666666667, "x": "確かめられたことだけ、もう一度並べよう。"}, {"t": 2032.45, "x": "刃物は1本。少年は19歳で、名前はここでも言わない。"}, {"t": 2036.1666666666667, "x": "局長は「結論はつけにくい」と答えた。"}, {"t": 2038.9833333333333, "x": "それでも輸血用の血の97％だった\n売血は、10年後に0になった。"}, {"t": 2043.9333333333334, "x": "3月に国会で血の話をした人は、ほとんどいなかった。"}, {"t": 2047.6666666666667, "x": "8月には閣議決定になっていた。"}, {"t": 2050.0833333333335, "x": "誰の血だったのかは分からないのね。"}, {"t": 2052.3, "x": "分からない。"}, {"t": 2053.4333333333334, "x": "大使が亡くなった1990年は、有料の採血が\n完全に無くなった年でもある。"}, {"t": 2058.9333333333334, "x": "同じ年なのね。"}, {"t": 2060.25, "x": "年表と伝記を並べると、そうなる。"}, {"t": 2062.55, "x": "偶然だ。そこに意味を足すことはしない。"}, {"t": 2065.0, "x": "ただ、血を買う仕組みが国から\n消えたことは記録にある。"}, {"t": 2068.233333333333, "x": "窓から腕だけを出す場所は、\n輸血の世界から無くなった。"}, {"t": 2071.883333333333, "x": "どの血か分からなくても、それは確かなのね。"}, {"t": 2074.766666666667, "x": "確かだ。今日の献血の針の先に、\nあの150日がつながっている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
