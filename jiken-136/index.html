<script>
const D={"name": "136", "file": "136_編集用", "dur": 2079.76665625, "segs": [], "subs": [{"t": 0.0, "x": "1964年3月24日。東京・虎ノ門。"}, {"t": 3.683333333333333, "x": "昼の12時5分ごろのことだ。"}, {"t": 5.65, "x": "アメリカ大使館のロビーで、1人の大使が刺された。"}, {"t": 8.95, "x": "大使って、アメリカの？"}, {"t": 10.633333333333333, "x": "そうだ。駐日アメリカ大使のライシャワーさん。"}, {"t": 13.283333333333333, "x": "刃物は1本で、傷は右のももだった。"}, {"t": 15.833333333333334, "x": "傷は深く、出血も多かったと報告されている。"}, {"t": 19.0, "x": "虎の門病院に運ばれて、手術が始まった。"}, {"t": 22.1, "x": "そして血が足された。輸血だ。"}, {"t": 24.266666666666666, "x": "命は助かったの？"}, {"t": 25.75, "x": "助かった。でも話はそこで終わらない。"}, {"t": 28.266666666666666, "x": "ちょうど3か月後、国会にこんな質問が出る。"}, {"t": 31.2, "x": "大使の肝炎は「黄色い血」のせいではないのか。"}, {"t": 34.266666666666666, "x": "黄色い血？　血は赤いでしょ？"}, {"t": 36.03333333333333, "x": "血を売り続けた人の血を指す言葉だ。"}, {"t": 38.25, "x": "中身はあとで話す。"}, {"t": 39.68333333333333, "x": "当時の日本で手術に使う血は、\n97％が買った血だった。"}, {"t": 44.083333333333336, "x": "97％も？"}, {"t": 45.7, "x": "厚生省の局長が国会で答えた数字だ。"}, {"t": 48.46666666666667, "x": "では、大使に入った血はどうだったのか。"}, {"t": 50.9, "x": "局長の答えは「結論はつけにくい」だった。"}, {"t": 54.03333333333333, "x": "分からないってこと？"}, {"t": 55.4, "x": "分からないまま、国はこの年の8月に動いた。"}, {"t": 58.46666666666667, "x": "今回は、1本の刃物のあとに残った血の記録を追う。"}, {"t": 61.85, "x": "主役は刺した少年ではなく、輸血の血のほうだ。"}, {"t": 64.96666666666667, "x": "少年は当時19歳。名前はこの回では出さない。"}, {"t": 68.78333333333333, "x": "まず、刺された人の話からだ。"}, {"t": 71.01666666666667, "x": "ライシャワーさんは1910年10月15日の生まれ。"}, {"t": 74.35, "x": "生まれた場所は東京だった。"}, {"t": 76.16666666666667, "x": "アメリカの大使なのに、東京生まれ？"}, {"t": 78.53333333333333, "x": "両親が日本で働いていた。"}, {"t": 80.41666666666667, "x": "父は日本の歴史を学ぶ学者で、\n東京の女子大学の創立に関わった。"}, {"t": 85.1, "x": "母は日本で耳の聞こえない子の学校を開いた人だ。"}, {"t": 88.48333333333333, "x": "日本にずっと縁があった家なのね。"}, {"t": 90.63333333333334, "x": "本人もハーバード大学で\n東アジアを教える学者になった。"}, {"t": 94.18333333333334, "x": "奥さんの松方ハルさんは日本人だ。"}, {"t": 96.58333333333333, "x": "1961年、ケネディ大統領が駐日大使に選んだ。"}, {"t": 100.63333333333334, "x": "任命は3月29日。信任状を出したのは4月27日。"}, {"t": 105.03333333333333, "x": "事件までに、もう3年近くいたのね。"}, {"t": 107.66666666666667, "x": "そういうことになる。"}, {"t": 108.86666666666666, "x": "事件の3日後、官房長官は国会でこう言っている。"}, {"t": 112.13333333333334, "x": "「非常に日本人から親近感を持たれておる」。"}, {"t": 114.81666666666666, "x": "政府の側から見ても、そういう大使だった。"}, {"t": 117.61666666666666, "x": "よりによって、そんな人が刺されたのね。"}, {"t": 120.28333333333333, "x": "しかも時期が悪かった。"}, {"t": 121.81666666666666, "x": "4か月前には、ケネディ大統領が銃で撃たれている。"}, {"t": 125.03333333333333, "x": "半年後の10月には、東京オリンピックが控えていた。"}, {"t": 128.41666666666666, "x": "国会の議員はその2つを並べて心配している。"}, {"t": 131.4, "x": "外務大臣は、この種の事件は初めてだと答えた。"}, {"t": 134.78333333333333, "x": "国と国の問題になるのね。"}, {"t": 136.8, "x": "なる。当日の国会は、そこから大騒ぎになった。"}, {"t": 140.7, "x": "時計を1か月戻そう。"}, {"t": 142.26666666666668, "x": "1964年2月24日。"}, {"t": 144.66666666666666, "x": "静岡県の沼津から、少年が東京へ出てきた。"}, {"t": 147.93333333333334, "x": "これは警察庁の後藤田正晴 警備局長の報告だ。"}, {"t": 151.58333333333334, "x": "少年が行ったのは、旧満鉄ビルにある\n大使館の別館だった。"}, {"t": 155.56666666666666, "x": "大使館の別の建物？"}, {"t": 157.4, "x": "そう。受付で聞いたのは、大使に会う方法だ。"}, {"t": 160.36666666666667, "x": "受付の答えは、手紙を持ってくれば\n用件によっては会える。"}, {"t": 163.88333333333333, "x": "その日、少年は帰っている。"}, {"t": 165.81666666666666, "x": "翌25日、また別館に来て、\n本館に入れてほしいと頼んだ。"}, {"t": 169.95, "x": "頼みは聞き入れられ、本館の受付で手紙を渡した。"}, {"t": 173.45, "x": "手紙には何が書いてあったの？"}, {"t": 175.4, "x": "大使に会いたいこと。そして近視のことだ。"}, {"t": 178.15, "x": "近視？　目の話？"}, {"t": 179.65, "x": "近視を直す話と、学校の決まりについての訴えだった。"}, {"t": 183.35, "x": "少年は入院したことがあった。"}, {"t": 185.28333333333333, "x": "ただ、病名や訴えの中身に、この回は深入りしない。"}, {"t": 188.73333333333332, "x": "大事なのは、3日も通っていたという点だ。"}, {"t": 191.61666666666667, "x": "その時点で、大使館は気づいていたの？"}, {"t": 194.16666666666666, "x": "気づいた人が1人だけいた。"}, {"t": 195.98333333333332, "x": "大使館の守衛だ。"}, {"t": 197.28333333333333, "x": "少年を見て、別の件の男に似ていると警察へ伝えた。"}, {"t": 201.1, "x": "別の件？"}, {"t": 202.23333333333332, "x": "1月20日に起きた出来事だ。"}, {"t": 204.31666666666666, "x": "少年の仕業だとは断定されていないので、\n詳しくは言わない。"}, {"t": 207.9, "x": "ともかく、警察はあすも来ると読んで待った。"}, {"t": 211.23333333333332, "x": "読みは当たった。2月26日。"}, {"t": 213.51666666666668, "x": "午後2時30分ごろ、少年は大使館の近くに現れた。"}, {"t": 217.3, "x": "警戒中の警察官が声をかけ、\n赤坂警察署へ同行を求めた。"}, {"t": 221.68333333333334, "x": "調べは約3時間に及んだ。"}, {"t": 223.73333333333332, "x": "じゃあ、ここで止められたんじゃないの？"}, {"t": 225.85, "x": "そう考えるのが普通だ。でも結果は逆だった。"}, {"t": 228.81666666666666, "x": "別の件の目撃者を集めて、顔を見てもらった。"}, {"t": 231.95, "x": "5人ほどのうち、守衛は五分五分だと答えた。"}, {"t": 234.71666666666667, "x": "ほかの人は、どうも違うと答えている。"}, {"t": 237.18333333333334, "x": "少年本人も認めなかった。"}, {"t": 239.15, "x": "母親に電話で聞くと、その日は\n家にいたという返事だった。"}, {"t": 242.86666666666667, "x": "それで人違いってことになったのね。"}, {"t": 245.25, "x": "なった。警察は夕方、少年を帰している。"}, {"t": 248.25, "x": "それでも少し気になったらしい。"}, {"t": 250.11666666666667, "x": "調べた人は母親に、迎えに来ないかと電話した。"}, {"t": 253.4, "x": "母親は行けないから帰してくれと答えた。"}, {"t": 256.1, "x": "そのあと、沼津の警察には知らせたの？"}, {"t": 258.8333333333333, "x": "そこが問題になった。"}, {"t": 260.31666666666666, "x": "事件のあと、静岡県に問い合わせると何も分からない。"}, {"t": 263.68333333333334, "x": "住んでいる事実しか、つかんでいなかった。"}, {"t": 266.21666666666664, "x": "3月27日、警察庁長官は国会でこう答えている。"}, {"t": 270.2, "x": "「手落ちといえば手落ちになるのかなという気持ち」。"}, {"t": 272.85, "x": "認めたようで、認めてないような言い方ね。"}, {"t": 275.56666666666666, "x": "長官は「普通しないということになるかも\nしれません」とも足した。"}, {"t": 279.45, "x": "これが刺される27日前の話だ。"}, {"t": 282.6, "x": "ここからは少年の供述になる。"}, {"t": 284.65, "x": "警察自身が裏づけを取っていた\n内容だから、断定はできない。"}, {"t": 288.46666666666664, "x": "本人の話には前後で合わない\n所があると、大臣も報告している。"}, {"t": 292.8666666666667, "x": "そのつもりで聞くのね。"}, {"t": 294.43333333333334, "x": "そうしてくれ。"}, {"t": 295.55, "x": "少年はこう話した。4月には成年になる。"}, {"t": 298.45, "x": "未成年のうちなら、罪は軽いだろうと考えたという。"}, {"t": 301.65, "x": "新聞やラジオに載る、とも考えた。"}, {"t": 304.0833333333333, "x": "自分の訴えを世の中に広めるため？"}, {"t": 306.55, "x": "供述ではそうなっている。"}, {"t": 308.1166666666667, "x": "普通のやり方では、聞いてもらえないと思ったらしい。"}, {"t": 311.1166666666667, "x": "前の日の3月23日、切り出しナイフを買った。"}, {"t": 314.45, "x": "さらに沼津の市内で、大きな石を拾っている。"}, {"t": 317.45, "x": "石？　なんで石なの？"}, {"t": 319.0, "x": "重さは約1貫目。3.75キロほどだ。"}, {"t": 321.9166666666667, "x": "大使館の塀の内側に、落とし穴があると思ったらしい。"}, {"t": 325.31666666666666, "x": "先に石を投げ込めば、穴があるか分かると考えた。"}, {"t": 328.6166666666667, "x": "落とし穴……。"}, {"t": 329.75, "x": "そして日付は、家の暦で決めた。"}, {"t": 332.1333333333333, "x": "3月24日の昼が、大吉だと書いてあったという。"}, {"t": 335.5833333333333, "x": "大使の予定を知っていたわけではないようだ。"}, {"t": 337.98333333333335, "x": "警察が疑ったのはそこだった。"}, {"t": 340.06666666666666, "x": "外国の要人と会う日に、なぜ重なったのか。"}, {"t": 343.0, "x": "調べの答えは、暦だった。"}, {"t": 345.0833333333333, "x": "偶然ってこと？"}, {"t": 346.3, "x": "供述の上ではそうなる。"}, {"t": 348.46666666666664, "x": "3月24日の朝。"}, {"t": 350.1333333333333, "x": "少年はパンと石を風呂敷に包んで家を出た。"}, {"t": 352.9166666666667, "x": "沼津駅を6時53分に出る上りの列車に乗っている。"}, {"t": 356.31666666666666, "x": "ここで動いた人がいた。母親だ。"}, {"t": 358.75, "x": "お母さんが気づいたの？"}, {"t": 360.25, "x": "前の日に大きな石を部屋へ持ち込むのを見ていた。"}, {"t": 363.06666666666666, "x": "胸騒ぎがして、あとを追ったと国会で語られている。"}, {"t": 366.25, "x": "そして鉄道公安官に届け出た。"}, {"t": 368.6166666666667, "x": "列車の警察みたいな人ね。"}, {"t": 370.6666666666667, "x": "そうだ。届け出は8時ごろだったと長官が答えている。"}, {"t": 374.01666666666665, "x": "公安官は車掌に連絡し、横浜と\n東京の公安官室にも伝えた。"}, {"t": 378.68333333333334, "x": "じゃあ、つかまえられたんじゃないの？"}, {"t": 380.68333333333334, "x": "見つからなかった。列車は混んでいたという。"}, {"t": 383.23333333333335, "x": "少年は新橋で降りて地下鉄に乗り換えた。"}, {"t": 385.9, "x": "虎ノ門で降り、大使館の塀の外から石を投げ入れた。"}, {"t": 389.28333333333336, "x": "穴が無いと確かめて、いったん離れている。"}, {"t": 391.93333333333334, "x": "大蔵省の印刷局の電気時計で、\n時間を見ていたそうだ。"}, {"t": 395.6333333333333, "x": "この日の国会で、議員は運輸大臣に聞いた。"}, {"t": 398.46666666666664, "x": "公安官は何をしていたのか、と。"}, {"t": 400.6333333333333, "x": "大臣の答えは「詳細な報告は受けておりません」。"}, {"t": 403.8833333333333, "x": "大臣も今聞いたってこと？"}, {"t": 405.73333333333335, "x": "本人が、委員会の席にずっといたと答えている。"}, {"t": 408.8, "x": "母親の届けは、公安官の中だけで止まっていた。"}, {"t": 412.06666666666666, "x": "国家公安委員長は、政治的な\n情報は無かったと説明した。"}, {"t": 416.0, "x": "母親の胸騒ぎだけが、一番早い知らせだった。"}, {"t": 419.8833333333333, "x": "12時少し前。少年は塀を乗り越えた。"}, {"t": 422.6166666666667, "x": "植え込みを伝って本館の裏のロビーへ向かう。"}, {"t": 425.15, "x": "ドアを押して入ると、大使が\n館員と出てくるところだった。"}, {"t": 428.55, "x": "すれ違った直後に、少年は斜め後ろから刺した。"}, {"t": 431.81666666666666, "x": "場面の話はここまでにする。"}, {"t": 433.8333333333333, "x": "この知らせは、すぐ国会に届いたの？"}, {"t": 436.3666666666667, "x": "届いた。ここに面白い記録が残っている。"}, {"t": 439.1166666666667, "x": "同じ日の参議院予算委員会で、第一報が読まれた。"}, {"t": 442.45, "x": "読んだのは早川崇 国家公安委員長だ。"}, {"t": 445.3666666666667, "x": "傷は「左大腿部」。つまり左のももだと言った。"}, {"t": 448.81666666666666, "x": "あれ？　最初は右って言ってなかった？"}, {"t": 451.18333333333334, "x": "言った。2日後の報告では「右大腿部」に直っている。"}, {"t": 454.95, "x": "同じ日の外務大臣は、もう右ももと話していた。"}, {"t": 458.1666666666667, "x": "ナイフの呼び方も違う。"}, {"t": 459.6666666666667, "x": "第一報は飛び出しナイフ。"}, {"t": 461.15, "x": "刃渡りは13センチ。"}, {"t": 462.73333333333335, "x": "のちの報告は切り出しナイフだ。"}, {"t": 464.71666666666664, "x": "時刻も、早川 委員長は12時5分。"}, {"t": 467.5, "x": "大平正芳 外務大臣は零時8分と答えている。"}, {"t": 471.03333333333336, "x": "同じ政府なのに、話がばらばらね。"}, {"t": 473.55, "x": "第一報とはそういうものだ。"}, {"t": 475.25, "x": "責めたいわけではない。"}, {"t": 476.51666666666665, "x": "このあとの話で、この「ずれ」が大事になる。"}, {"t": 479.55, "x": "確かな記録と、急いで広まった話は違う。"}, {"t": 482.6166666666667, "x": "大使の血の話でも、同じことが起きるからだ。"}, {"t": 486.21666666666664, "x": "そもそも大使館に、警備はいなかったの？"}, {"t": 488.93333333333334, "x": "少年を押さえたのは、居合わせた大使館員2人だった。"}, {"t": 492.26666666666665, "x": "非常ベルが鳴った。"}, {"t": 493.48333333333335, "x": "大使館の前の派出所から、警察官が駆けつけた。"}, {"t": 496.96666666666664, "x": "少年はそこで引き渡されている。"}, {"t": 499.1166666666667, "x": "警察は外にいたのね。"}, {"t": 500.8333333333333, "x": "外にいた。ここが議論になる。"}, {"t": 502.8333333333333, "x": "早川 委員長の説明はこうだ。"}, {"t": 505.06666666666666, "x": "大使館の中の警備は、大使館がやることになっている。"}, {"t": 508.48333333333335, "x": "頼まれれば、いつでも中に入れる態勢だった。"}, {"t": 511.4, "x": "今回は頼まれる前に起きてしまった。"}, {"t": 513.8666666666667, "x": "それって、中のことは知りませんってこと？"}, {"t": 516.55, "x": "議員もそう受け取った。"}, {"t": 517.95, "x": "3日後、後任の大臣はこう言い直している。"}, {"t": 520.65, "x": "警備と警護の全責任は、警察当局にある。"}, {"t": 523.7666666666667, "x": "防ぐ手を打つことも、警察の仕事だと認めた。"}, {"t": 526.8666666666667, "x": "ただ大臣は、十分な手が打てたかは\nまだ調べ中だとも言った。"}, {"t": 530.7833333333333, "x": "後任って、早川さんは？"}, {"t": 532.75, "x": "そこが次の話になる。"}, {"t": 535.0333333333333, "x": "その前に、病院の様子を見ておこう。"}, {"t": 537.3333333333334, "x": "大平 外務大臣は、零時40分に虎の門病院へ向かった。"}, {"t": 541.4833333333333, "x": "着いたとき、手術は始まったばかりだった。"}, {"t": 544.2, "x": "大使は麻酔の下で、本人には会えていない。"}, {"t": 547.05, "x": "話もできなかったのね。"}, {"t": 548.8, "x": "大使館の公使から、経過は良いと聞いただけだ。"}, {"t": 551.75, "x": "その日の夕方までに、知らせが入った。"}, {"t": 554.3333333333334, "x": "手術の結果は良好で、数週間で治る見込みだという。"}, {"t": 557.95, "x": "よかった。"}, {"t": 559.0833333333334, "x": "政府の動きは速かった。"}, {"t": 560.7166666666667, "x": "外務大臣はすぐ、ワシントンの大使に指示を出した。"}, {"t": 563.9333333333333, "x": "アメリカの国務省へ、遺憾の意を伝えるためだ。"}, {"t": 566.8166666666667, "x": "ワシントン時間の11時半に、伝え終えた報告が来た。"}, {"t": 570.3666666666667, "x": "池田勇人 首相は夕方、大使館を訪ねた。"}, {"t": 573.6166666666667, "x": "ジョンソン大統領には、首相から電報を打った。"}, {"t": 576.6166666666667, "x": "かなり慌ててるのが分かるわね。"}, {"t": 578.5833333333334, "x": "無理もない。半年後にはオリンピックだ。"}, {"t": 580.9666666666667, "x": "ただ会議録を見る限り、この時点で\n血の話をする人はいない。"}, {"t": 584.8, "x": "手術の報告に、輸血の中身は出てこなかった。"}, {"t": 588.0166666666667, "x": "手術がうまくいった。それだけが知らせだった。"}, {"t": 590.95, "x": "血はまだ、話題になってないのね。"}, {"t": 593.1666666666666, "x": "まだだ。国会が血の話を始めるまで、\n少し時間がかかる。"}, {"t": 597.7833333333333, "x": "ジョンソン大統領の返事は、\n翌25日に国会で読まれた。"}, {"t": 601.65, "x": "読み上げたのは大平 外務大臣だ。"}, {"t": 604.0166666666667, "x": "大統領は、大使が全快する見込みと\n聞いて喜んでいると書いた。"}, {"t": 608.1, "x": "怒ってはいないの？"}, {"t": 609.35, "x": "文面ではまったく逆だった。"}, {"t": 611.2, "x": "事件を「一個人の行為」と呼んでいる。"}, {"t": 613.65, "x": "そして両国の友好は、この行為と関係がないと続けた。"}, {"t": 617.3166666666667, "x": "アメリカの記録にも、同じ電報の英文が残っている。"}, {"t": 620.6333333333333, "x": "発表は事件と同じ3月24日だった。"}, {"t": 623.6166666666667, "x": "ほっとしたでしょうね、政府は。"}, {"t": 625.6166666666667, "x": "池田 首相は本会議で\n「非常にありがたいお返事」と言った。"}, {"t": 629.5833333333334, "x": "ある議員は、首相がテレビで\n謝ったことにも触れている。"}, {"t": 632.8333333333334, "x": "アメリカの新聞の反応も、\n悪くなかったと首相は紹介した。"}, {"t": 636.7, "x": "つまり外交の面では、大きな傷にならずに済んだ。"}, {"t": 639.95, "x": "じゃあ、もう一件落着じゃないの？"}, {"t": 642.15, "x": "外交はな。国内は違った。"}, {"t": 644.2, "x": "ある議員は、ワシントンの声をこう紹介している。"}, {"t": 647.0166666666667, "x": "現職の大使が刺されるのは、まれな事件だ。"}, {"t": 649.8833333333333, "x": "背後に何があるのかと、強い関心を持たれている。"}, {"t": 652.9666666666667, "x": "友好は壊れない。でも、説明は要る。"}, {"t": 655.5, "x": "政府が最初に差し出したのが、大臣の辞任だった。"}, {"t": 659.4, "x": "3月26日の衆議院本会議。"}, {"t": 661.8833333333333, "x": "事件の報告に立ったのは、早川 委員長ではなかった。"}, {"t": 665.5833333333334, "x": "新しい国家公安委員長、赤澤正道だ。"}, {"t": 668.6833333333333, "x": "2日で交代したの？"}, {"t": 670.25, "x": "早川 委員長はこの時点で辞めていた。"}, {"t": 672.85, "x": "池田 首相は、辞任を認めた理由を説明している。"}, {"t": 676.3, "x": "政治的に関係の深い人が辞めることで、\n二度と起こさない気持ちを示す。"}, {"t": 680.9666666666667, "x": "辞めれば済むの？"}, {"t": 682.15, "x": "野党も同じことを聞いた。"}, {"t": 683.75, "x": "社会党の議員は言った。"}, {"t": 685.1333333333333, "x": "辞任で解決とするのは責任回避に等しい。"}, {"t": 688.1666666666666, "x": "民社党の議員は、辞任は\n行政の責任がある証拠だと迫った。"}, {"t": 692.1666666666666, "x": "翌日、官房長官はこう答えている。"}, {"t": 694.7166666666667, "x": "辞職で責任が終わったとは決して考えていない。"}, {"t": 697.75, "x": "政府全体の責任だ、と。"}, {"t": 699.8, "x": "じゃあ、誰がどう責任を取るの？"}, {"t": 701.8833333333333, "x": "法制局長官の説明が分かりやすい。"}, {"t": 704.35, "x": "防げなかったのが不可抗力なら、責任は無い。"}, {"t": 707.3833333333333, "x": "ただ大臣の責任は、政治の責任だという。"}, {"t": 710.4666666666667, "x": "難しいわね。"}, {"t": 711.6, "x": "要するに、線の引き方は誰にも決められなかった。"}, {"t": 714.8166666666667, "x": "新しい委員長には、もっと切実な事情もあった。"}, {"t": 717.9833333333333, "x": "就任したばかりで、公安委員にまだ会えていない。"}, {"t": 720.85, "x": "3月27日の委員会で、本人がそう話している。"}, {"t": 724.5666666666667, "x": "大臣も大変ね。"}, {"t": 726.0166666666667, "x": "答弁の席で、できればあすにも\n集まってもらうと話した。"}, {"t": 730.15, "x": "当時の人が一番気にしたのは、\n誰かに頼まれたのかだ。"}, {"t": 733.7666666666667, "x": "事件の当日、参議院の議員はこう話している。"}, {"t": 736.8333333333334, "x": "右翼にしろ、左翼にしろ、どちらか分からない。"}, {"t": 739.8666666666667, "x": "4年前の浅沼さんの事件もあったものね。"}, {"t": 742.6666666666666, "x": "そうだ。国会でも、その名前が何度も出た。"}, {"t": 745.5666666666667, "x": "警察は翌朝から、刑事10人ほどを静岡へ送っている。"}, {"t": 749.1333333333333, "x": "出てきた答えが「特段の背後関係もない」だった。"}, {"t": 752.65, "x": "じゃあ、1人でやったのね。"}, {"t": 754.4333333333333, "x": "そう報告された。ところが議員が納得しない。"}, {"t": 757.3333333333334, "x": "別の議員は、足をねらう手口は\n右翼のものではないかと聞いた。"}, {"t": 761.0166666666667, "x": "断定は早いと、本会議で疑いを述べている。"}, {"t": 763.9166666666666, "x": "長官は言葉の定義から説明した。"}, {"t": 766.2666666666667, "x": "頼んだ人、手伝った人、属する団体。"}, {"t": 769.25, "x": "そういう直接の関係が背後関係だという。"}, {"t": 772.0166666666667, "x": "それが今の時点では出ていない、という答え方だ。"}, {"t": 775.1166666666667, "x": "じゃあ、広い意味ではどうなの？"}, {"t": 776.95, "x": "そこで話が変わっていく。"}, {"t": 778.6666666666666, "x": "「広い意味の背景」があるのではないか。"}, {"t": 780.9666666666667, "x": "少年を支える仕組みは足りていたのか。"}, {"t": 783.3, "x": "官房長官も、厚生の問題として考え直すと答えた。"}, {"t": 787.0666666666667, "x": "こうして翌日から、話は警察の外へ広がった。"}, {"t": 790.6166666666667, "x": "今度は厚生省の出番なのね。"}, {"t": 792.7, "x": "そうだ。ただし血の話ではなく、\n最初は別の法律の話だった。"}, {"t": 797.6333333333333, "x": "事件の翌日、衆議院の社会労働委員会。"}, {"t": 800.6166666666667, "x": "ある議員が精神の病気への対策を厚生省にただした。"}, {"t": 804.0, "x": "4月2日には、厚生大臣が数字を出している。"}, {"t": 807.1166666666667, "x": "精神の病気がある人は、およそ120万人。"}, {"t": 810.1666666666666, "x": "そのうち治療が必要なのは28万から30万人。"}, {"t": 813.6333333333333, "x": "ところが専門の病床は13万と少ししかない。"}, {"t": 816.85, "x": "足りないじゃない。"}, {"t": 818.0, "x": "半分以上が足りない計算になる。"}, {"t": 820.0833333333334, "x": "行政の責任で入院している人は5万数千人だった。"}, {"t": 823.6333333333333, "x": "入院の費用は、1人で年に30万円ほどかかるという。"}, {"t": 827.3166666666667, "x": "でも、120万って正確な数字なの？"}, {"t": 830.1333333333333, "x": "いい質問だ。大臣自身が\n「ある程度推定」と言っている。"}, {"t": 833.9166666666666, "x": "なぜ数えられなかったのか。"}, {"t": 835.5833333333334, "x": "当時の仕組みで、役所に知らせるのは\n警察官と検察官だけだった。"}, {"t": 839.95, "x": "家族や学校の先生には、知らせる決まりが無い。"}, {"t": 842.9666666666667, "x": "社会の目を恐れて、家族が隠してしまうこともあった。"}, {"t": 846.45, "x": "じゃあ、知らせる決まりを作ればいいの？"}, {"t": 848.7333333333333, "x": "大臣もそこで止まった。"}, {"t": 850.1833333333333, "x": "人権の問題があるからだ。"}, {"t": 852.0333333333333, "x": "ここで念を押しておく。"}, {"t": 853.3666666666667, "x": "病気がある人が危ないという話では、まったくない。"}, {"t": 856.5333333333333, "x": "のちに東京大学の教授が国会で話している。"}, {"t": 859.5666666666667, "x": "ああいう事件を起こすのは「ごく一部」だ。"}, {"t": 862.0833333333334, "x": "社会の条件も重なって起きる、と。"}, {"t": 864.4, "x": "この回も、その立場で話を進める。"}, {"t": 867.65, "x": "事件のあと、新聞と雑誌に1つの言葉が広がった。"}, {"t": 871.1833333333333, "x": "「野放し」だ。"}, {"t": 872.3666666666667, "x": "ひどい言い方ね。人に向けて。"}, {"t": 874.5, "x": "厚生大臣も5月7日の委員会で言っている。"}, {"t": 877.3333333333334, "x": "そういう言葉で表現するのは「不適当」だ。"}, {"t": 880.2333333333333, "x": "ただ世間では、この言葉が受け入れられやすい。"}, {"t": 882.9166666666666, "x": "大臣はそこも認めていた。"}, {"t": 884.7166666666667, "x": "そして心配が1つ出てくる。"}, {"t": 886.65, "x": "警察が入ってくるのではないか。"}, {"t": 888.7833333333333, "x": "どういうこと？"}, {"t": 889.9166666666666, "x": "公安委員会から、病気の人の調べを\n求める声があった。"}, {"t": 893.5333333333333, "x": "議員は、法律の改正で警察の力が入ることを恐れた。"}, {"t": 897.3166666666667, "x": "戦争中のあの状態が戻るのではないか、と。"}, {"t": 900.15, "x": "関係者が隠すようになり、隠れた\n患者が増えるとも言った。"}, {"t": 903.8333333333334, "x": "厚生大臣はなんて答えたの？"}, {"t": 905.9166666666666, "x": "はっきり否定した。"}, {"t": 907.1833333333333, "x": "法律の目的は治療と予防で、\n警察の目的とは関係ない。"}, {"t": 911.2, "x": "通報するとしても、専門の医者から保健所へだ。"}, {"t": 914.3, "x": "警察の文字がどこかへ出るはずもない、と。"}, {"t": 916.8333333333334, "x": "さらに大臣はこう続けた。"}, {"t": 918.6, "x": "おそろしいものだという\n考え方は、なくさなければならない。"}, {"t": 922.0333333333333, "x": "事件の6週間後の言葉だ。"}, {"t": 924.0166666666667, "x": "「改正はあの事件に関係なく\n進んでいた」とも言っている。"}, {"t": 927.5833333333334, "x": "事件のせいで急に決まったわけじゃないの？"}, {"t": 930.1, "x": "本人はそう言った。この話は最後にもう一度戻る。"}, {"t": 934.0, "x": "では、血の話に入ろう。"}, {"t": 935.7333333333333, "x": "1964年6月25日。"}, {"t": 938.2333333333333, "x": "衆議院の社会労働委員会。"}, {"t": 940.1833333333333, "x": "事件からちょうど3か月後だ。"}, {"t": 942.1, "x": "ある議員が、ついでに伺いたいと切り出した。"}, {"t": 944.8666666666667, "x": "ついでなの？"}, {"t": 946.0, "x": "言葉の上ではな。"}, {"t": 947.1833333333333, "x": "電車の中に週刊現代の広告が出ているという。"}, {"t": 950.2333333333333, "x": "大使の血清肝炎は黄色い血によったものだ、と。"}, {"t": 953.3833333333333, "x": "大使、肝炎になってたの？"}, {"t": 955.3, "x": "なっていた。輸血のあとにかかる肝臓の病気だ。"}, {"t": 958.3166666666667, "x": "議員は前の日に雑誌を買わせた。"}, {"t": 960.3166666666667, "x": "でもまだ読んでいない。そう正直に言っている。"}, {"t": 963.0166666666667, "x": "広告の見出しだけで質問したの？"}, {"t": 965.3833333333333, "x": "それだけ気になる見出しだったのだろう。"}, {"t": 967.5333333333333, "x": "議員はこう続けた。"}, {"t": 968.85, "x": "もしそうなら、何とも\n相済まぬことで、気の毒なことだ。"}, {"t": 972.35, "x": "そして厚生省に聞いた。調べたのか、と。"}, {"t": 975.1666666666666, "x": "ここで大事なのは順番だ。"}, {"t": 976.9, "x": "刃物の話は3月だった。"}, {"t": 978.85, "x": "血の話が大使と結びついて国会に出たのは6月になる。"}, {"t": 982.5333333333333, "x": "間には週刊誌の見出しが1つ挟まっている。"}, {"t": 985.5333333333333, "x": "まさか、それまで誰も言ってなかったの？"}, {"t": 988.0833333333334, "x": "会議録で大使と輸血を結ぶ\n発言は、これが最初の1件だ。"}, {"t": 992.0833333333334, "x": "今回取った発言の範囲では、そうなっている。"}, {"t": 994.95, "x": "では厚生省は、どう答えたのか。"}, {"t": 997.75, "x": "答えたのは厚生省の薬務局長だ。"}, {"t": 1000.15, "x": "局長はまず、肝炎の一般論から入った。"}, {"t": 1002.9833333333333, "x": "売血の人の血でなくても、肝炎は起こることがある。"}, {"t": 1006.2666666666667, "x": "普通の健康な人の血でも、3％から5％は出るという。"}, {"t": 1010.5166666666667, "x": "売血だけのせいじゃないってこと？"}, {"t": 1012.6333333333333, "x": "そう言いたかったのだろう。"}, {"t": 1014.05, "x": "そして大使について、調べた結果を話した。"}, {"t": 1017.0, "x": "大部分は、病院の中の人や\n外国人が出した血のようだという。"}, {"t": 1021.1333333333333, "x": "じゃあ売血じゃなかったのね。"}, {"t": 1022.9166666666666, "x": "局長はそこで止まらない。"}, {"t": 1024.5666666666666, "x": "医療の中でどの血がどれだけ\n使われたか、あとでは分かりにくい。"}, {"t": 1028.2333333333333, "x": "応急のときに売血の保存血が使われたかもしれない。"}, {"t": 1031.7333333333333, "x": "かもしれない？"}, {"t": 1032.8666666666666, "x": "そして、記録に残るのがこの言葉だ。"}, {"t": 1035.3833333333334, "x": "「どちらによるかという結論はつけにくい」。"}, {"t": 1037.85, "x": "なんだか、もやもやするわね。"}, {"t": 1039.7833333333333, "x": "ところがだ。2日後の決算委員会で、\n別の議員が言い切る。"}, {"t": 1043.55, "x": "「山谷から持ってきた血を輸血する」。"}, {"t": 1045.6833333333334, "x": "「それがライシャワー大使のように肝炎を起こす」。"}, {"t": 1048.3, "x": "えっ。局長の話と違うじゃない。"}, {"t": 1050.6666666666667, "x": "違う。そして時代が下るとさらに変わる。"}, {"t": 1053.3, "x": "2009年、厚生労働省の委員会に\n出た資料はこう書いた。"}, {"t": 1056.95, "x": "大使は「売血の輸血後に肝炎を発症」。"}, {"t": 1059.75, "x": "アメリカの大学新聞は\n「肝炎に汚染された血」と書いた。"}, {"t": 1063.4166666666667, "x": "どの血だったのかは、局長の答えのまま揃っていない。"}, {"t": 1066.7, "x": "第一報の左と右を、思い出してほしい。"}, {"t": 1069.5166666666667, "x": "急いで広まった話と、確かな記録は違う。"}, {"t": 1072.7, "x": "そうだ。この回は、どちらとも言い切らない。"}, {"t": 1075.9166666666667, "x": "では、なぜ週刊誌の見出しがそこまで効いたのか。"}, {"t": 1078.9, "x": "答えは、その少し前の国会にある。"}, {"t": 1081.3666666666666, "x": "6月2日の参議院の社会労働委員会。"}, {"t": 1084.1333333333334, "x": "ある女性議員が、血を売る現場へ行った話をした。"}, {"t": 1087.2, "x": "現場？"}, {"t": 1088.3333333333333, "x": "議員の発言によると、舞台は\n東京の山谷と大阪の釜ケ崎だ。"}, {"t": 1092.4833333333333, "x": "食べていけないから血を売る。"}, {"t": 1094.0333333333333, "x": "「きょうもおれは八本目を抜いてきた」と\n言う人がいたという。"}, {"t": 1097.3833333333334, "x": "8本？　1日で？"}, {"t": 1098.8666666666666, "x": "議員は、ひどい例としてそう話している。"}, {"t": 1101.3333333333333, "x": "別の日には、2本取ったと喜ぶ人の話もした。"}, {"t": 1104.75, "x": "顔色も、人のものとは思えないほどだったという。"}, {"t": 1107.7333333333333, "x": "場所の様子も語られた。"}, {"t": 1109.3333333333333, "x": "寝かされて、窓から腕だけを出す。"}, {"t": 1111.5666666666666, "x": "許可の判こを見せれば、顔色も見ずに血を抜く。"}, {"t": 1114.5166666666667, "x": "顔も見ないの？"}, {"t": 1115.6333333333334, "x": "議員の言葉ではそうだ。"}, {"t": 1116.9666666666667, "x": "「身ぶるいがいたしました」と続く。"}, {"t": 1119.1166666666666, "x": "別の議員は、集まる血の流れをこう説明した。"}, {"t": 1122.15, "x": "血の8割は、株式会社を通して集められる。"}, {"t": 1125.2166666666667, "x": "その大部分が、山谷や釜ケ崎から来ている。"}, {"t": 1128.2666666666667, "x": "売る人が悪いんじゃないわよね。"}, {"t": 1130.1666666666667, "x": "もちろんだ。議員たちもそう言っている。"}, {"t": 1132.4166666666667, "x": "貧しさから血を売り、体を壊し、また貧しくなる。"}, {"t": 1135.7, "x": "ある議員はその輪を指摘した。"}, {"t": 1137.4833333333333, "x": "血を売った人も、手術を受ける人と同じ人間だ、と。"}, {"t": 1141.0333333333333, "x": "問題にされたのは、それで回っていた\n仕組みのほうだった。"}, {"t": 1145.0333333333333, "x": "そろそろ教えて。黄色い血って何なの？"}, {"t": 1147.55, "x": "比べる話からしよう。"}, {"t": 1149.05, "x": "厚生省の決まりでは、採血は月に1回までだった。"}, {"t": 1152.4833333333333, "x": "1回の目安は200ccの1本だ。"}, {"t": 1154.9166666666667, "x": "血の濃さを測る比重の基準もあった。"}, {"t": 1157.2333333333333, "x": "1.052より薄い人からは取ってはいけない。"}, {"t": 1160.1833333333334, "x": "決まりだけは立派だったのね。"}, {"t": 1162.1, "x": "あった。でも守る仕組みが弱かった。"}, {"t": 1164.3833333333334, "x": "局長が国会で認めている。"}, {"t": 1166.3166666666666, "x": "名前を変え、場所を変えて血を売る人がいる。"}, {"t": 1168.85, "x": "それを登録して管理する組織が、まだ無い。"}, {"t": 1171.65, "x": "ある議員の手元の資料には、こんな人が出てくる。"}, {"t": 1174.65, "x": "1か月に200ccを40本。"}, {"t": 1176.95, "x": "月に1本の決まりで、40本？"}, {"t": 1179.3333333333333, "x": "資料の上の話だが、議員はそう指摘した。"}, {"t": 1182.2, "x": "間を空けずに抜き続けると、血が回復しない。"}, {"t": 1185.15, "x": "女性議員の言葉を借りると、こうなる。"}, {"t": 1187.4833333333333, "x": "「血が黄色い血になって、\n血球のないような血が売られている」。"}, {"t": 1190.9333333333334, "x": "それで黄色い血なのね。"}, {"t": 1192.4666666666667, "x": "血の赤い成分が足りなくなった血、という意味だ。"}, {"t": 1195.3333333333333, "x": "厚生労働省の年表は、この問題の発生を\n1959年の欄に置いている。"}, {"t": 1200.5, "x": "保存血が広まり、繰り返しの採血が\n問題になった時期だ。"}, {"t": 1204.5166666666667, "x": "じゃあ事件の5年も前からあったのね。"}, {"t": 1206.85, "x": "あった。事件が作った問題ではない。"}, {"t": 1209.8666666666666, "x": "では97％という数字の中身を見よう。"}, {"t": 1212.7833333333333, "x": "民間の血液銀行が認められたのは\n昭和26年ごろ。1951年だ。"}, {"t": 1218.1166666666666, "x": "それ以前、手術に町の銀行の血を\n使うことは少なかった。"}, {"t": 1221.9, "x": "医学が進み、手術と輸血が増えていく。"}, {"t": 1224.6166666666666, "x": "1956年から57年ごろ、保存血は\n22万から23万リットルだった。"}, {"t": 1230.3833333333334, "x": "1964年には58万リットルになっている。"}, {"t": 1233.9666666666667, "x": "2倍半！"}, {"t": 1235.1, "x": "局長はもう1つ、意外な理由を挙げた。"}, {"t": 1237.6666666666667, "x": "健康保険だ。"}, {"t": 1238.9166666666667, "x": "保険？　血と関係あるの？"}, {"t": 1240.7, "x": "昔の血は自己負担で、親戚や\n知人に頼んで出してもらった。"}, {"t": 1244.6666666666667, "x": "保険で保存血が使えるようになると、頼まなくなった。"}, {"t": 1248.1166666666666, "x": "簡単に手に入るからだ。"}, {"t": 1249.8833333333334, "x": "便利になった分、買った血に頼るようになったのね。"}, {"t": 1253.0166666666667, "x": "民間の血液銀行は22社あった。"}, {"t": 1255.5166666666667, "x": "日赤などが17か所で、こちらは献血と預血が中心だ。"}, {"t": 1259.6, "x": "預血って？"}, {"t": 1260.7333333333333, "x": "先に血を預けておき、\n必要なときに返してもらう方法だ。"}, {"t": 1264.45, "x": "献血の割合は、昭和31、2年ごろで0.05％ほど。"}, {"t": 1269.0166666666667, "x": "1964年でやっと3％に届くくらいだった。"}, {"t": 1272.7666666666667, "x": "残りのほぼ全部が売血になる。"}, {"t": 1274.8, "x": "計60万リットルの97％。"}, {"t": 1277.55, "x": "手術を受ける人は、知らなかったのよね。"}, {"t": 1280.2666666666667, "x": "普通は知らないだろう。"}, {"t": 1281.6, "x": "ある議員は話を聞いて\n「寒けがするような思い」と語った。"}, {"t": 1285.3, "x": "自分なら親戚か友だちの血をもらいたい、と続けた。"}, {"t": 1289.3, "x": "比重の検査についても、妙な数字が国会に出ている。"}, {"t": 1292.6833333333334, "x": "6月9日、女性議員が\n日本輸血学会の雑誌を読み上げた。"}, {"t": 1296.8333333333333, "x": "役所が調べに来る日と、来ない日の合格率だ。"}, {"t": 1300.0666666666666, "x": "同じ検査で違うの？"}, {"t": 1301.6166666666666, "x": "調べに来る日は31.1％。"}, {"t": 1304.1833333333334, "x": "来ない日は62.8％だ。"}, {"t": 1306.7166666666667, "x": "倍じゃない！"}, {"t": 1307.85, "x": "日赤の冊子の数字はさらに開いている。"}, {"t": 1310.3833333333334, "x": "調べに来る日は16.6％、来ない日は47.1％。"}, {"t": 1315.1166666666666, "x": "来ない日だけ、血が濃くなるわけないわよね。"}, {"t": 1317.8166666666666, "x": "ない。議員も同じことを言った。"}, {"t": 1319.6833333333334, "x": "合格しないはずの人を通している、と。"}, {"t": 1322.1833333333334, "x": "しかも調べの日は、役所の黒板を見れば分かる。"}, {"t": 1325.25, "x": "そう言う人がいると、議員は紹介している。"}, {"t": 1327.95, "x": "抜き打ちじゃないのね。"}, {"t": 1329.3333333333333, "x": "週に2回は調べている、というのが役所の説明だった。"}, {"t": 1332.7666666666667, "x": "議員はさらに聞いた。処罰はしたのか。"}, {"t": 1335.2333333333333, "x": "違反はあるけれど処罰したことはない。"}, {"t": 1337.3833333333334, "x": "議員はそう受け止めて、納得がいかないと述べた。"}, {"t": 1340.35, "x": "局長も、監視が行き届かないことは認めた。"}, {"t": 1343.3166666666666, "x": "局長の別の日の言葉は、なお正直だ。"}, {"t": 1346.1333333333334, "x": "実際にどれだけ血を出しているかは、\nきわめてつかみにくい。"}, {"t": 1349.6333333333334, "x": "役所も分かってなかったのね。"}, {"t": 1351.6, "x": "把握できていないことを、役所が自分で認めた。"}, {"t": 1355.2, "x": "どうして、そこまでして集めたの？"}, {"t": 1357.4833333333333, "x": "お金の話がある。"}, {"t": 1358.7833333333333, "x": "議員が国会で紹介した数字はこうだ。"}, {"t": 1361.2166666666667, "x": "業者が500円で買った血が、1650円で売れる。"}, {"t": 1364.8, "x": "3倍以上じゃない。"}, {"t": 1366.1, "x": "12月の委員会でも、200ccが\n1650円という話が出ている。"}, {"t": 1370.7833333333333, "x": "保険の支払いと同じ額だそうだ。"}, {"t": 1372.9666666666667, "x": "新聞には、血液銀行の技師の話も出ていた。"}, {"t": 1376.15, "x": "この血は危ないと思っても、\n捨てれば損になると言われる。"}, {"t": 1379.45, "x": "技師は身ぶるいする思いだという。"}, {"t": 1381.25, "x": "議員は記事のこんな一節も読んだ。"}, {"t": 1383.3666666666666, "x": "「シモタ屋で、台所か、フロ場に冷蔵庫を一つ置き」。"}, {"t": 1386.8833333333334, "x": "えっ、お風呂場に血を？"}, {"t": 1388.3666666666666, "x": "これは新聞が伝えた話で、議員の紹介だ。"}, {"t": 1391.3833333333334, "x": "局長の説明はまったく違う。"}, {"t": 1393.4166666666667, "x": "民間の血液銀行の設備は、\nきわめて優秀だと答えていた。"}, {"t": 1397.4, "x": "むしろ日赤より技術は上ではないか、とまで言った。"}, {"t": 1400.5333333333333, "x": "問題は設備ではなく、血の取り方だという。"}, {"t": 1403.3833333333334, "x": "どっちが本当なの？"}, {"t": 1404.8333333333333, "x": "全部の店が同じだったわけではないだろう。"}, {"t": 1407.2833333333333, "x": "ただ1つ言えることがある。"}, {"t": 1408.8666666666666, "x": "血は商品として動いていた。"}, {"t": 1410.6833333333334, "x": "売る人には生活がかかり、\n買う会社には利益がかかる。"}, {"t": 1414.0666666666666, "x": "間に立つはずの検査が、弱かった。"}, {"t": 1417.15, "x": "ここで厚生省の答えの移り変わりを見てみよう。"}, {"t": 1419.95, "x": "同じ薬務局長の答弁を、順に並べる。"}, {"t": 1422.7333333333333, "x": "まず事件の9日後、4月2日の決算委員会。"}, {"t": 1426.0166666666667, "x": "局長は輸血の事故について聞かれてこう言った。"}, {"t": 1428.8666666666666, "x": "「保存血液の品質が云々されるということは、\n最近では全然ない」。"}, {"t": 1433.2833333333333, "x": "全然ない、って言い切ったの？"}, {"t": 1435.1333333333334, "x": "言い切った。肝炎は世界で\n研究中とも付け加えている。"}, {"t": 1438.5833333333333, "x": "買った血でも、決して\n中身の悪いものにはならないと答えた。"}, {"t": 1442.2, "x": "次は6月2日。厚生大臣が一歩踏み込む。"}, {"t": 1445.35, "x": "「厚生省の行政の一つの弱点」。"}, {"t": 1447.5666666666666, "x": "局長も、売血のほうが肝炎が\n多いという一部のデータを認めた。"}, {"t": 1451.6666666666667, "x": "だんだん変わってきたわね。"}, {"t": 1453.3666666666666, "x": "そして6月27日の決算委員会だ。"}, {"t": 1456.2333333333333, "x": "議員は北海道の例を持ち出した。"}, {"t": 1458.35, "x": "北海道には民間の血液銀行が1つも無かった。"}, {"t": 1461.7333333333333, "x": "献血が中心で、肝炎は百人に2、\n3人だと議員は調べたという。"}, {"t": 1466.2166666666667, "x": "血液銀行の血では20％から30％に及ぶ、とも言った。"}, {"t": 1470.8666666666666, "x": "そんなに違うの？"}, {"t": 1472.1333333333334, "x": "議員の調べなので、数字はそのまま置いておく。"}, {"t": 1474.95, "x": "議員は問いつめた。売血の血が\n肝炎につながるのは分かるはずだ。"}, {"t": 1478.8666666666666, "x": "局長の答えは「おっしゃるとおりでございます」。"}, {"t": 1481.7, "x": "4月の答えと全然違うじゃない！"}, {"t": 1483.9333333333334, "x": "3か月で、ここまで動いた。"}, {"t": 1485.9, "x": "局長の理由はこうだ。"}, {"t": 1487.3666666666666, "x": "多くの人から少しずつ集めれば、\n危ない血の割合は下がる。"}, {"t": 1491.1, "x": "限られた人から何度も取れば、回数は増えていく。"}, {"t": 1494.25, "x": "理屈は事件の前から同じだったはずだ。"}, {"t": 1496.75, "x": "変わったのは、世の中の見る目のほうだった。"}, {"t": 1499.5, "x": "その間に、何があったの？"}, {"t": 1501.4666666666667, "x": "それを数字で見てみよう。"}, {"t": 1503.5166666666667, "x": "国会会議録を検索して、発言の数を数えた。"}, {"t": 1506.95, "x": "1962年の1月から、事件の前の日までの2年あまり。"}, {"t": 1511.2666666666667, "x": "「売血」という言葉が出る発言は1件だけだった。"}, {"t": 1514.6666666666667, "x": "1件？　それも見たの？"}, {"t": 1516.3166666666666, "x": "見た。外国の車の話で「販売血」と\n文字が並んだだけだった。"}, {"t": 1520.9, "x": "つまり血の話としては0件になる。"}, {"t": 1523.3666666666666, "x": "じゃあ事件のあとは？"}, {"t": 1524.6833333333334, "x": "事件の日から、その年の末まで。"}, {"t": 1526.9833333333333, "x": "9か月ほどで71件だ。"}, {"t": 1529.0, "x": "「黄色い血」という言葉は、事件の前は1件も無い。"}, {"t": 1532.2166666666667, "x": "それが8件に増えている。"}, {"t": 1533.95, "x": "一気に増えたのね。"}, {"t": 1535.2833333333333, "x": "ただし、ここで早合点してはいけない。"}, {"t": 1537.65, "x": "事件だけが国会を動かしたわけではない。"}, {"t": 1540.1666666666667, "x": "女性議員は昭和23年から輸血を\n取り上げてきたと言っている。"}, {"t": 1543.9666666666667, "x": "1961年までの国会にも、売血の発言は9件あった。"}, {"t": 1548.5666666666666, "x": "読売新聞は、黄色い\n血の追放キャンペーンを張っていた。"}, {"t": 1551.9166666666667, "x": "記者自身も血を売って調べたと伝えられている。"}, {"t": 1554.6666666666667, "x": "ある議員は言った。「昨年から」\n週刊誌や新聞が叫んでいた。"}, {"t": 1558.5833333333333, "x": "局長は動きの始まりを「ことしの三、\n四月ごろから」と答えた。"}, {"t": 1562.9666666666667, "x": "火種はあって、そこに事件が重なったのね。"}, {"t": 1565.9333333333334, "x": "そういう見方が、記録には合っている。"}, {"t": 1568.2, "x": "年表も「契機」と書くだけだ。"}, {"t": 1570.4, "x": "大使が売血の問題を作ったのではない。"}, {"t": 1572.9833333333333, "x": "見ないふりができない形にした、というのが近い。"}, {"t": 1576.5666666666666, "x": "国会の外でも動いていた人たちがいる。"}, {"t": 1579.1, "x": "学生だ。"}, {"t": 1580.2166666666667, "x": "6月27日の決算委員会で、議員がこう明かした。"}, {"t": 1583.8833333333334, "x": "学生の奉仕団と千葉大学の先生から話を聞いた。"}, {"t": 1587.35, "x": "場所は第一議員会館の会議室で、\n非公式だったという。"}, {"t": 1591.1333333333334, "x": "学生が国会議員に説明したの？"}, {"t": 1593.6, "x": "そうらしい。議員はこう言っている。"}, {"t": 1595.45, "x": "厚生省の資料と学生の資料を比べた。"}, {"t": 1598.0333333333333, "x": "「学生の奉仕団の資料のほうが上なんです」。"}, {"t": 1600.7833333333333, "x": "厚生省より学生のほうが詳しかったの？"}, {"t": 1603.45, "x": "議員は「残念なこと」と言い、\n涙の出るような思いとも語った。"}, {"t": 1607.5166666666667, "x": "ここで議員が持ち出したのが、予算の数字だ。"}, {"t": 1610.3333333333333, "x": "献血を進めるお金は、昭和37年度に1700万円。"}, {"t": 1614.4666666666667, "x": "次の年度は1000万円になっている。"}, {"t": 1616.75, "x": "昭和39年度は2000万円が1600万円に減らされた。"}, {"t": 1620.7833333333333, "x": "血の問題に、それだけ？"}, {"t": 1622.5833333333333, "x": "議員は「こんなはした金」とまで言った。"}, {"t": 1625.1666666666667, "x": "移動採血車は全国で22台しかない。"}, {"t": 1627.8333333333333, "x": "1台で1日に集められるのは100人から150人ほどだ。"}, {"t": 1631.5666666666666, "x": "10日ほど前には新潟地震が起きていた。"}, {"t": 1634.0666666666666, "x": "別の議員も、地震と同じくらい急ぐ話だと迫った。"}, {"t": 1637.6333333333334, "x": "予備費を使ってでもやれ。それが議員たちの声だった。"}, {"t": 1640.95, "x": "厚生省は動いたの？"}, {"t": 1642.4833333333333, "x": "その夏、厚生大臣が交代した。"}, {"t": 1644.9166666666667, "x": "新しい大臣は、予備費を\n使ってでも対策を立てると話した。"}, {"t": 1649.4833333333333, "x": "1964年8月21日。"}, {"t": 1652.1166666666666, "x": "事件から150日後。"}, {"t": 1653.85, "x": "閣議で1つの文書が決まった。"}, {"t": 1655.7666666666667, "x": "題名は「献血の推進について」。"}, {"t": 1658.2, "x": "読むと短い。"}, {"t": 1659.2, "x": "「可及的速やかに保存血液を献血に\nより確保する体制を確立する」。"}, {"t": 1663.9333333333334, "x": "可及的速やかに、ってどういう意味？"}, {"t": 1666.2333333333333, "x": "できるだけ早く、という意味だ。"}, {"t": 1668.1666666666667, "x": "国と地方が献血の考えを広める。"}, {"t": 1670.65, "x": "日本赤十字社と自治体が、受け入れの体制を作る。"}, {"t": 1674.0, "x": "文面はそれだけだった。"}, {"t": 1675.6666666666667, "x": "大使の名前は書いてあるの？"}, {"t": 1677.4833333333333, "x": "資料に載った文面には無い。"}, {"t": 1679.2, "x": "売血という字も、そこには無かった。"}, {"t": 1681.5833333333333, "x": "それでも厚生省の資料は、\n大使の件を契機に数えている。"}, {"t": 1685.2, "x": "すぐにお金も動いた。"}, {"t": 1686.6666666666667, "x": "予備費から約8000万円。"}, {"t": 1688.4166666666667, "x": "それまでの年の予算は1666万円ほどだ。"}, {"t": 1691.9333333333334, "x": "一気に5倍近くじゃない！"}, {"t": 1693.6166666666666, "x": "当時、血液銀行も移動採血車も無い\n県が26都道府県あった。"}, {"t": 1698.1, "x": "そこへ26台分の車を出すことになった。"}, {"t": 1700.9833333333333, "x": "3月の国会にほとんど出なかった\n血の話が、ここまで来た。"}, {"t": 1704.8666666666666, "x": "もちろん、大使の血の答えは出ていない。"}, {"t": 1707.2833333333333, "x": "答えが出ないまま、仕組みだけ変わったのね。"}, {"t": 1710.0833333333333, "x": "そこがこの話の不思議なところだ。"}, {"t": 1712.3, "x": "どの血だったのか分からなくても、\n変えるべき理由はそろっていた。"}, {"t": 1715.9, "x": "局長自身が「対策を急ぎたい」と言っていた。"}, {"t": 1719.6166666666666, "x": "結果はすぐ数字に出た。"}, {"t": 1721.2, "x": "献血と預血を足した割合を見る。"}, {"t": 1723.4333333333334, "x": "1963年の1月から11月までは2.3％だった。"}, {"t": 1728.1666666666667, "x": "1964年の同じ期間では12.4％になる。"}, {"t": 1732.2833333333333, "x": "5倍以上！"}, {"t": 1733.4166666666667, "x": "月ごとに見るとさらにはっきりする。"}, {"t": 1735.55, "x": "9月が25.4％。10月が25.8％。"}, {"t": 1739.75, "x": "11月は28.0％だ。"}, {"t": 1742.35, "x": "閣議決定の翌月から、そんなに？"}, {"t": 1744.9, "x": "局長は、組織化の効果が上がっていると答えた。"}, {"t": 1748.0333333333333, "x": "ただ良い話ばかりではない。"}, {"t": 1749.7, "x": "売血が急に減ると、今度は血が足りなくなる。"}, {"t": 1752.65, "x": "10月の委員会で、ある議員が厳しく言っている。"}, {"t": 1755.5666666666666, "x": "血が無くて手術できない病院が、たくさんあると。"}, {"t": 1758.7, "x": "えっ、逆に困ってるじゃない。"}, {"t": 1760.6166666666666, "x": "局長も、若干不足していると認めた。"}, {"t": 1763.4166666666667, "x": "翌年3月にも、血が足りないと新聞に出ている。"}, {"t": 1766.6333333333334, "x": "12月には、厚生大臣が山谷を訪ねた話をした。"}, {"t": 1770.1833333333334, "x": "売血が7割5分ほど減ったと聞いたという。"}, {"t": 1772.8333333333333, "x": "別の議員は、業者が預血で\n巻き返していると警告した。"}, {"t": 1776.4833333333333, "x": "一方で、1人の議員はこうも言った。"}, {"t": 1778.7666666666667, "x": "献血でも足りないなら、検査を強めて買う血も認めよ。"}, {"t": 1782.35, "x": "いろんな意見があったのね。"}, {"t": 1784.0166666666667, "x": "あった。切り替えは一直線には進まなかった。"}, {"t": 1787.5333333333333, "x": "では、売血はいつ終わったのか。"}, {"t": 1789.5833333333333, "x": "行政の年表によると、1969年。"}, {"t": 1792.7666666666667, "x": "民間の血液銀行が、\n売血での輸血用の保存血の製造をやめた。"}, {"t": 1797.45, "x": "事件から5年後ね。"}, {"t": 1798.95, "x": "そうだ。ただ、これで全部が\n献血になったわけではない。"}, {"t": 1802.3333333333333, "x": "預血の仕組みがまだ残っていた。"}, {"t": 1804.4, "x": "民間の銀行がそれもやめたのは1974年だ。"}, {"t": 1807.9333333333334, "x": "この年、輸血用の血はすべて\n献血で確保する体制になった。"}, {"t": 1812.1333333333334, "x": "事件から10年かかったのね。"}, {"t": 1814.1666666666667, "x": "10年だ。最初の閣議決定の「可及的速やかに」から\n数えても同じになる。"}, {"t": 1819.2666666666667, "x": "局長の話していた\n「半分は売血のまま」という目標も超えた。"}, {"t": 1823.65, "x": "半分でいいと思ってたの？"}, {"t": 1825.3666666666666, "x": "6月の時点の目標は、売血と献血で半分ずつだった。"}, {"t": 1829.3833333333334, "x": "一度に全部やめれば命に\n関わる、というのがその理由だ。"}, {"t": 1832.8833333333334, "x": "ただ、献血に変わっても肝炎が\nすぐ消えたわけではない。"}, {"t": 1836.2333333333333, "x": "当時、肝炎の原因を見つける\n検査は確立していなかった。"}, {"t": 1839.95, "x": "医務局長は、献血でも黄疸は防げないと答えている。"}, {"t": 1843.3833333333334, "x": "国立病院の調べでは、\n7463例のうち5.2％に肝炎が出た。"}, {"t": 1849.0, "x": "売血をやめただけじゃ足りないのね。"}, {"t": 1851.2, "x": "足りない。翌年の予算で、\n肝炎の研究に約500万円が回された。"}, {"t": 1855.7, "x": "血の安全の話は、ここから長い道のりになる。"}, {"t": 1858.7833333333333, "x": "もう1つ、年表には続きがある。"}, {"t": 1861.05, "x": "売血が終わったと言えるのは、輸血用の血の話だ。"}, {"t": 1864.35, "x": "血から作る別の薬の原料は、\n1974年の時点でも買った血が多かった。"}, {"t": 1869.8333333333333, "x": "まだ買ってたの？"}, {"t": 1871.0166666666667, "x": "年表には「売血由来」と書いてある。"}, {"t": 1873.6, "x": "有料の採血が完全に無くなるのは1990年。"}, {"t": 1877.15, "x": "刃物の日から数えると、26年がたっていた。"}, {"t": 1880.4333333333334, "x": "10年でも長いのに、26年なのね。"}, {"t": 1883.2166666666667, "x": "その先の話は別の回の題材になるので、\nここでは踏み込まない。"}, {"t": 1887.9, "x": "さて、途中で置いてきた話に戻ろう。"}, {"t": 1890.3666666666666, "x": "精神の病気についての法律だ。"}, {"t": 1892.5, "x": "1965年3月18日、厚生大臣が改正の説明に立った。"}, {"t": 1897.5666666666666, "x": "柱は6つあった。"}, {"t": 1898.8833333333334, "x": "都道府県に相談と研究の拠点を作ること。"}, {"t": 1901.85, "x": "保健所の訪問の体制を強くすること。"}, {"t": 1904.3833333333334, "x": "通院の医療費の半分を、公費で持つこと。"}, {"t": 1907.2166666666667, "x": "通院でいいようになったのね。"}, {"t": 1908.9833333333333, "x": "薬が進んで、入院しなくても\n治療できる人が増えていた。"}, {"t": 1912.7166666666667, "x": "一方で、緊急のときに\n48時間入院させる制度もできた。"}, {"t": 1916.8, "x": "そして、もう1つ大きな変更がある。"}, {"t": 1919.2333333333333, "x": "大臣の言葉では「私宅監置制度たる\n保護拘束制度」の廃止だ。"}, {"t": 1923.7333333333333, "x": "したくかんち？"}, {"t": 1924.8833333333334, "x": "病気の人を、家の中にとどめて\n見張ることを認めた古い決まりだ。"}, {"t": 1928.9333333333334, "x": "法律の条文では、第43条が丸ごと削られている。"}, {"t": 1932.7, "x": "1965年まで残ってたの？"}, {"t": 1935.2833333333333, "x": "残っていた。"}, {"t": 1936.4166666666667, "x": "法案は6月1日の参議院本会議に上がった。"}, {"t": 1939.55, "x": "公布は1965年6月30日。"}, {"t": 1942.4, "x": "法律第139号だ。"}, {"t": 1944.4, "x": "ただ、専門家が満足したわけではない。"}, {"t": 1946.9666666666667, "x": "東京大学の教授は5月の委員会でこう話した。"}, {"t": 1950.1333333333334, "x": "欧米に比べて非常に遅れている。"}, {"t": 1952.2, "x": "事件が起きると、危険だという考えが強くなる。"}, {"t": 1955.25, "x": "家族は肩身が狭くなり、隠すようになる。"}, {"t": 1957.95, "x": "教授は、この法案では不十分だと述べた。"}, {"t": 1960.7333333333333, "x": "事件が法律を変えて、事件が偏見も強めたのね。"}, {"t": 1964.25, "x": "大臣は「事件に関係なく進んでいた」と言った。"}, {"t": 1967.55, "x": "議員は「事件が起こってからあわてて」と言った。"}, {"t": 1970.4666666666667, "x": "ここでも答えは揃わない。"}, {"t": 1972.7, "x": "最後に、ライシャワーさんのその後を話す。"}, {"t": 1975.15, "x": "伝記によると、ハワイの病院に7月1日まで入っていた。"}, {"t": 1978.9333333333334, "x": "足の回復と、肝炎の治療のためだ。"}, {"t": 1981.6, "x": "日本には戻ってきたの？"}, {"t": 1983.3, "x": "戻った。大使の仕事を続けている。"}, {"t": 1985.6666666666667, "x": "アメリカ国務省の記録では、離任は1966年8月19日。"}, {"t": 1990.5, "x": "ハーバードへ戻り、1981年まで教えた。"}, {"t": 1993.8166666666666, "x": "大学新聞は1983年に、肝臓の病気は\n1964年からだと書いた。"}, {"t": 1999.6666666666667, "x": "亡くなったのは1990年9月1日。79歳だった。"}, {"t": 2004.0166666666667, "x": "百科事典は、輸血でかかった\n慢性肝炎の合併症と記している。"}, {"t": 2008.3833333333334, "x": "26年も、あの日が続いていたのね。"}, {"t": 2011.0833333333333, "x": "そうなる。"}, {"t": 2012.2166666666667, "x": "ここで1つ、言っておくことがある。"}, {"t": 2014.3833333333334, "x": "この事件には、大使の名ゼリフとして\n語られる言葉がある。"}, {"t": 2017.9333333333334, "x": "血についての有名な言葉だ。"}, {"t": 2019.75, "x": "今回、会議録と公文書で原典を探した。"}, {"t": 2022.7166666666667, "x": "でも確かめられなかったので、読み上げない。"}, {"t": 2025.4166666666667, "x": "第一報の左と右、と同じ気持ちで？"}, {"t": 2028.15, "x": "そのとおりだ。"}, {"t": 2029.2833333333333, "x": "確かめられたことだけ、もう一度並べよう。"}, {"t": 2031.9666666666667, "x": "刃物は1本。少年は19歳で、名前はここでも言わない。"}, {"t": 2035.6833333333334, "x": "局長は「結論はつけにくい」と答えた。"}, {"t": 2038.5, "x": "それでも輸血用の血の97％だった\n売血は、10年後に0になった。"}, {"t": 2043.4666666666667, "x": "3月に国会で血の話をした人は、ほとんどいなかった。"}, {"t": 2047.1833333333334, "x": "8月には閣議決定になっていた。"}, {"t": 2049.6, "x": "誰の血だったのかは分からないのね。"}, {"t": 2051.8166666666666, "x": "分からない。"}, {"t": 2052.95, "x": "大使が亡くなった1990年は、有料の採血が\n完全に無くなった年でもある。"}, {"t": 2058.45, "x": "同じ年なのね。"}, {"t": 2059.766666666667, "x": "年表と伝記を並べると、そうなる。"}, {"t": 2062.0833333333335, "x": "偶然だ。そこに意味を足すことはしない。"}, {"t": 2064.516666666667, "x": "ただ、血を買う仕組みが国から\n消えたことは記録にある。"}, {"t": 2067.75, "x": "窓から腕だけを出す場所は、\n輸血の世界から無くなった。"}, {"t": 2071.4, "x": "どの血か分からなくても、それは確かなのね。"}, {"t": 2074.2833333333333, "x": "確かだ。今日の献血の針の先に、\nあの150日がつながっている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
