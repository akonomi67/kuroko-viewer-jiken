<style>

<script>
const D={"name": "160", "file": "160_編集用", "dur": 1927.05, "segs": [], "subs": [{"t": 0.0, "x": "2026年10月、65年前の紙切れを\n調べることが決まった。"}, {"t": 4.6, "x": "報道によると、名古屋高等裁判所が\n鑑定すると決めたんだ。"}, {"t": 8.516666666666667, "x": "どんな紙なの？"}, {"t": 9.666666666666666, "x": "ぶどう酒の瓶の口に巻かれていた\n封かん紙という紙だ。"}, {"t": 12.816666666666666, "x": "そのぶどう酒が出されたのは、\n1961年3月28日の夜だった。"}, {"t": 17.966666666666665, "x": "三重県名張市の山あいの公民館で、\n懇親会が開かれていた。"}, {"t": 21.9, "x": "1本のぶどう酒が、\n20人の女性の湯飲みに分けられた。"}, {"t": 25.333333333333332, "x": "飲んだ17人のうち、5人が亡くなり12人がけがをした。"}, {"t": 29.116666666666667, "x": "ぶどう酒に何かが入っていたの？"}, {"t": 31.2, "x": "農薬が入っていた。"}, {"t": 32.56666666666667, "x": "裁判所はぶどう酒を運んだ男性が\n公民館で農薬を混ぜたと認めた。"}, {"t": 36.833333333333336, "x": "男性は無実を訴え続け、\n死刑囚のまま2015年に亡くなった。"}, {"t": 41.36666666666667, "x": "なぜいまになって紙を調べるの？"}, {"t": 43.4, "x": "弁護側は、瓶が別の場所で\n開けられた可能性を言い続けている。"}, {"t": 47.2, "x": "紙の裏ののりが何なのか、\n確かなことはまだ分かっていない。"}, {"t": 50.8, "x": "有罪の柱の1つだった歯形の鑑定は、\n1997年に力を失った。"}, {"t": 56.31666666666667, "x": "それでも死刑は動かなかったんだ。"}, {"t": 58.483333333333334, "x": "柱が1本崩れたのに、どうして変わらなかったの？"}, {"t": 61.75, "x": "答えは「10分」と「自白」にある。"}, {"t": 64.38333333333334, "x": "今回は、最高裁の決定と国会の記録を、\n日付の順に読んでいこう。"}, {"t": 69.56666666666666, "x": "どんな資料を使うの？"}, {"t": 71.05, "x": "中心は最高裁判所の決定4本だ。"}, {"t": 73.7, "x": "1997年、2010年、2013年、\n2024年に出されたものだ。"}, {"t": 79.25, "x": "どの決定も、裁判所が認めた\n事実を最初にまとめている。"}, {"t": 83.05, "x": "もう1つは、1961年からの国会の会議録だ。"}, {"t": 87.15, "x": "国会でもこの事件が話されたのね。"}, {"t": 89.61666666666666, "x": "事件の1週間後にはもう取り上げられている。"}, {"t": 92.2, "x": "有罪とされた男性の名前はこの動画では言わない。"}, {"t": 95.11666666666666, "x": "「ぶどう酒を運んだ男性」か、ただ「男性」と呼ぶ。"}, {"t": 98.5, "x": "亡くなった5人と、けがをした\n人たちの名前も言わない。"}, {"t": 101.81666666666666, "x": "裁判官や鑑定をした人も役目で呼ぶことにする。"}, {"t": 105.1, "x": "男性が毒を入れたかどうかはどう言うの？"}, {"t": 107.46666666666667, "x": "裁判所がそう認めた、という形でだけ言う。"}, {"t": 110.28333333333333, "x": "男性が無実を訴えていたことも必ず一緒に並べる。"}, {"t": 114.28333333333333, "x": "舞台は名張市の葛尾という集落だ。"}, {"t": 116.58333333333333, "x": "三重県と、となりの奈良県の山添村に\nまたがる地区だった。"}, {"t": 120.31666666666666, "x": "県のさかいの村なのね。"}, {"t": 122.0, "x": "この地区には生活改善クラブという集まりがあった。"}, {"t": 125.1, "x": "暮らしを良くするための勉強会のような会だ。"}, {"t": 127.8, "x": "この日はその年に一度の総会で、\n役員を選び直す日だった。"}, {"t": 131.7, "x": "総会のあとに、懇親会が開かれることになっていた。"}, {"t": 135.18333333333334, "x": "男の人も女の人も入っている会なの？"}, {"t": 138.06666666666666, "x": "そうだ。"}, {"t": 139.2, "x": "女性の会員にはぶどう酒、\n男性には日本酒が用意された。"}, {"t": 142.75, "x": "会場は地区の公民館だった。"}, {"t": 144.73333333333332, "x": "中には囲炉裏のある部屋と、\n会合を開く部屋が並んでいた。"}, {"t": 148.85, "x": "ここからは裁判所が認めた事実の流れだ。"}, {"t": 151.63333333333333, "x": "3月28日の夕方、会長の家の玄関に\n酒が置かれていた。"}, {"t": 156.03333333333333, "x": "1.8リットル入りのぶどう酒が1本と、日本酒が2本だ。"}, {"t": 159.88333333333333, "x": "一升瓶のぶどう酒ね。"}, {"t": 161.43333333333334, "x": "銘柄は三線ポートワインという甘いぶどう酒だった。"}, {"t": 164.35, "x": "会長の家に立ち寄ったのが、\nぶどう酒を運んだ男性だ。"}, {"t": 167.73333333333332, "x": "会長の妻に頼まれて、男性は\n3本を一人で公民館へ運んだ。"}, {"t": 172.03333333333333, "x": "そして囲炉裏の部屋の、流しの前の板の間に置いた。"}, {"t": 175.28333333333333, "x": "一人で運んだのね。"}, {"t": 176.76666666666668, "x": "途中まで一緒だった女性の会員がいた。"}, {"t": 179.2, "x": "その人は机をふく雑巾を取りに、\n会長の家へ引き返した。"}, {"t": 183.66666666666666, "x": "そのあいだ公民館には誰がいたの？"}, {"t": 185.95, "x": "裁判所の認定では男性が一人きりだった。"}, {"t": 188.76666666666668, "x": "時間はおよそ10分だ。"}, {"t": 190.31666666666666, "x": "雑巾を取りに戻った会員は、\n捜査の最初から同じことを述べていた。"}, {"t": 194.51666666666668, "x": "公民館の前で電気の工事をしていた\n人の話も、それに合っていた。"}, {"t": 198.9, "x": "その10分が大事なのね。"}, {"t": 200.7, "x": "この事件の裁判は、最後までこの10分をめぐって続く。"}, {"t": 204.28333333333333, "x": "男性のほうは、雑巾を持って戻ってきた\n時に一緒に入ったと述べていた。"}, {"t": 208.7, "x": "つまり一人になった時間は無い、という言い分だ。"}, {"t": 211.65, "x": "話が食い違っているのね。"}, {"t": 213.55, "x": "裁判所は会員の話のほうを信用できると判断した。"}, {"t": 217.61666666666667, "x": "夕方の5時30分ごろから、\n会員が公民館に集まり始めた。"}, {"t": 221.85, "x": "みんな囲炉裏のまわりで、雑談をしながら待っていた。"}, {"t": 224.85, "x": "夜7時ごろとなりの部屋で総会が始まった。"}, {"t": 227.8, "x": "ぶどう酒はどこに置いてあったの？"}, {"t": 229.71666666666667, "x": "囲炉裏の部屋の板の間に置かれたままだった。"}, {"t": 232.18333333333334, "x": "総会の部屋と囲炉裏の部屋の間は、\n障子が1枚ほど開いていた。"}, {"t": 236.21666666666667, "x": "そこから、ぶどう酒の置き場所が\nよく見えたと認められている。"}, {"t": 239.76666666666668, "x": "遅れてきた人はどこを歩いたの？"}, {"t": 241.88333333333333, "x": "囲炉裏の部屋を抜けて、総会の部屋に入っていった。"}, {"t": 244.96666666666667, "x": "そして8時ごろ、総会が終わって懇親会に移った。"}, {"t": 249.0, "x": "懇親会が始まるころ、会員の一人が\nぶどう酒の包み紙を取った。"}, {"t": 253.16666666666666, "x": "包み紙は囲炉裏に捨てられた。"}, {"t": 255.05, "x": "栓を抜いたのは会長だった。"}, {"t": 256.81666666666666, "x": "妻に頼まれて、栓をねじるようにして抜いたという。"}, {"t": 259.98333333333335, "x": "かたい栓じゃなかったのね。"}, {"t": 261.68333333333334, "x": "この時、瓶の口には内側の栓が\n1つ付いているだけだった。"}, {"t": 265.6, "x": "外側の金具も瓶の口に巻く紙も、もう無かった。"}, {"t": 269.0833333333333, "x": "それって誰かが先に開けていたということ？"}, {"t": 271.71666666666664, "x": "そこがあとで大きな争いになる。"}, {"t": 273.6333333333333, "x": "ぶどう酒は女性の会員20人の湯飲みに、\n全部分けてつがれた。"}, {"t": 278.1333333333333, "x": "20人のうち、ぶどう酒を飲んだのは17人だった。"}, {"t": 281.31666666666666, "x": "飲んだ人たちは次々に苦しみ始めた。"}, {"t": 283.95, "x": "最高裁の決定では、亡くなったのは\n5人、けがをしたのは12人だ。"}, {"t": 288.25, "x": "残りの3人は飲まなかった。"}, {"t": 290.21666666666664, "x": "楽しいはずの席だったのに。"}, {"t": 292.1333333333333, "x": "1週間後の国会で、議員が被害の様子を述べている。"}, {"t": 295.48333333333335, "x": "その時点では、5人が亡くなり、\n10人が重い症状だと話していた。"}, {"t": 299.8666666666667, "x": "家族の人たちはどんな思いだったのかしら。"}, {"t": 302.5833333333333, "x": "小さな集落で同じ夜に5人が亡くなったんだ。"}, {"t": 305.5, "x": "この動画では、亡くなった\n人たちの名前や暮らしには触れない。"}, {"t": 309.0833333333333, "x": "5人の女性が亡くなった\n事件だということを、忘れずに進めよう。"}, {"t": 313.56666666666666, "x": "毒の正体はすぐに分かったの？"}, {"t": 315.6666666666667, "x": "4月4日の国会で、警察庁の長官が説明している。"}, {"t": 319.43333333333334, "x": "事件の当日警察はすぐに医者を呼んだ。"}, {"t": 322.03333333333336, "x": "翌日の29日には、\n三重県の医科大学で解剖が行われた。"}, {"t": 326.18333333333334, "x": "結果は有機燐の毒による中毒死だった。"}, {"t": 328.95, "x": "有機燐って何？"}, {"t": 330.25, "x": "農薬によく使われていた成分のなかまだ。"}, {"t": 332.9, "x": "残ったぶどう酒は、県警の鑑識と\n県の衛生研究所が調べた。"}, {"t": 337.03333333333336, "x": "出てきたのは有機燐の農薬の一種テップ剤だった。"}, {"t": 340.1166666666667, "x": "長官は、被疑者の供述では\nニッカリンという商品だとも述べている。"}, {"t": 344.28333333333336, "x": "もう容疑者がいたのね。"}, {"t": 345.81666666666666, "x": "事件から1週間後にはもうそう答えているんだ。"}, {"t": 349.28333333333336, "x": "同じ日の国会では農薬の扱いも問題になった。"}, {"t": 352.48333333333335, "x": "農林省の課長は、テップ剤は\n特定毒物ではないと答えている。"}, {"t": 356.46666666666664, "x": "毒物を買う手続きをすれば、\n誰でも買って持てる農薬だった。"}, {"t": 360.4, "x": "そんなに強い毒なのに？"}, {"t": 362.0833333333333, "x": "厚生省の局長は、毒はとても強く、\nそれでいて分解しやすいと説明した。"}, {"t": 367.03333333333336, "x": "畑にまいたあと、長く残らない性質があったんだ。"}, {"t": 370.31666666666666, "x": "議員は、杯1杯で50人以上の命を\n奪える毒だと述べている。"}, {"t": 374.5, "x": "警察の答弁では、男性はこの農薬を\n前の年の8月に買っていた。"}, {"t": 378.95, "x": "お茶の木の消毒に使うためだった。"}, {"t": 381.31666666666666, "x": "農家なら持っていてもおかしくないのね。"}, {"t": 383.65, "x": "ただ、最高裁の決定では、地区でこの種類の農薬を\n持っていた人はほかに見つかっていない。"}, {"t": 389.8333333333333, "x": "農薬を使った事件はほかにもあったの？"}, {"t": 392.4166666666667, "x": "4月4日の国会で長官が数字を出している。"}, {"t": 395.31666666666666, "x": "農薬を使った犯罪の被害者は、1959年に98人いた。"}, {"t": 400.18333333333334, "x": "そのうち20人が亡くなっている。"}, {"t": 402.31666666666666, "x": "毎年そんなにいたのね。"}, {"t": 403.98333333333335, "x": "毒物や劇物の法律に違反して\n捕まった人も増えていた。"}, {"t": 407.8, "x": "1960年には266件、317人だった。"}, {"t": 412.1333333333333, "x": "農薬で自ら命を絶つ人も、1958年に\n1515人いたと長官は述べた。"}, {"t": 418.23333333333335, "x": "農薬がとても身近だった時代なのね。"}, {"t": 420.78333333333336, "x": "そうだ。"}, {"t": 421.9, "x": "どこの農家にも強い毒が置いてあった。"}, {"t": 424.8333333333333, "x": "議員は農薬の扱いがあまりに雑だと訴えた。"}, {"t": 427.76666666666665, "x": "農林省の課長は、むずかしさも正直に答えている。"}, {"t": 431.1, "x": "全国には農家が約600万戸ある。"}, {"t": 433.51666666666665, "x": "その全部に、鍵をかけて\n保管させるのはむずかしい、とな。"}, {"t": 437.1666666666667, "x": "数が多すぎるのね。"}, {"t": 438.6, "x": "課長は、強い農薬は少しずつ規制を強めると述べた。"}, {"t": 442.1, "x": "そして毒の弱い農薬に、切りかえていく方針を示した。"}, {"t": 445.6333333333333, "x": "組合や防除の班でまとめて保管させる案も出ている。"}, {"t": 448.9, "x": "この事件が、農薬の扱いを\n見直すきっかけになったのね。"}, {"t": 452.68333333333334, "x": "少なくとも国会では、すぐにその話が始まっている。"}, {"t": 456.8333333333333, "x": "男性はどうして疑われたの？"}, {"t": 458.81666666666666, "x": "最高裁の決定によると、男性は\n身柄を取られる前に自白をしている。"}, {"t": 463.1333333333333, "x": "その中身はかなり細かいものだった。"}, {"t": 465.4, "x": "前の晩に、節のある竹の筒に農薬を入れて用意した。"}, {"t": 468.9, "x": "新聞紙でふたをして、\n上着のポケットに入れて持っていった。"}, {"t": 472.45, "x": "竹の筒に入れたの？"}, {"t": 473.95, "x": "自白ではそうなっている。"}, {"t": 475.43333333333334, "x": "公民館で一人になったすきに、ぶどう酒の栓を開けた。"}, {"t": 478.8333333333333, "x": "外側の金具は囲炉裏の火挟みで開けた。"}, {"t": 481.3666666666667, "x": "内側の栓は自分の歯でかんで開けた。"}, {"t": 483.71666666666664, "x": "そして農薬を4から5ミリリットルほど\n注いで、栓を元に戻した。"}, {"t": 487.98333333333335, "x": "それが本当なら歯の跡が残っているはずね。"}, {"t": 490.76666666666665, "x": "そのとおりだ。"}, {"t": 491.9, "x": "その歯の跡が、この事件の大きな柱になっていく。"}, {"t": 495.75, "x": "動機は何だったとされているの？"}, {"t": 497.76666666666665, "x": "裁判所は男性の家庭の事情を動機と認めた。"}, {"t": 500.75, "x": "亡くなった5人の中に男性の妻もいた。"}, {"t": 503.46666666666664, "x": "自分の妻も亡くなっていたのね。"}, {"t": 505.6, "x": "この動画ではその事情にはこれ以上入らない。"}, {"t": 508.1666666666667, "x": "大事なのは、男性が自白をすぐに取り消したことだ。"}, {"t": 511.46666666666664, "x": "4月24日の検察の調書では、もう否認している。"}, {"t": 514.9666666666667, "x": "そして起訴されてからは、ずっと無実を訴え続けた。"}, {"t": 518.4166666666666, "x": "自白したのに取り消したのね。"}, {"t": 520.4666666666667, "x": "そうだ。"}, {"t": 521.6, "x": "自白が本当かどうかも、このあと何十年も争われる。"}, {"t": 525.7166666666667, "x": "ここでぶどう酒の瓶の口の作りを見ておこう。"}, {"t": 528.3166666666667, "x": "栓は内側と外側の2つあった。"}, {"t": 530.6333333333333, "x": "内側は足が4本ついた替栓という栓だ。"}, {"t": 533.3666666666667, "x": "外側は、耳のついた金具で、\n替栓の上から押さえていた。"}, {"t": 537.2666666666667, "x": "二重のふたなのね。"}, {"t": 538.6666666666666, "x": "さらにその上から、封かん紙という紙が巻かれていた。"}, {"t": 541.8333333333334, "x": "紙は瓶の口をぐるりと回り、両はしが\nのりで貼り合わされていた。"}, {"t": 545.6333333333333, "x": "外側の金具を外さないと、内側の栓は開けられない。"}, {"t": 549.0833333333334, "x": "そして金具を外すと、紙はやぶれる仕組みだった。"}, {"t": 552.2833333333333, "x": "だれかが開けたら紙で分かるのね。"}, {"t": 554.4, "x": "そうだ。"}, {"t": 555.5333333333333, "x": "この紙が、60年後にもう一度調べられることになる。"}, {"t": 559.6333333333333, "x": "栓や紙は見つかったの？"}, {"t": 561.35, "x": "3月29日、囲炉裏の部屋のあたりで\n替栓と外側の金具が見つかった。"}, {"t": 566.05, "x": "包み紙のかけらも同じ日に見つかっている。"}, {"t": 568.7166666666667, "x": "封かん紙は大きいかけらが\n30日、小さいかけらが31日だ。"}, {"t": 572.8833333333333, "x": "大きいかけらは、囲炉裏の部屋の壁際から見つかった。"}, {"t": 576.1666666666666, "x": "紙はばらばらになっていたのね。"}, {"t": 578.15, "x": "2つのかけらと、瓶の口に残った\n紙は、やぶれ目がぴったり合った。"}, {"t": 582.4166666666666, "x": "印刷の文字や模様もつながっていた。"}, {"t": 584.6666666666666, "x": "公民館のまわりを徹底的に探しても、\nほかの栓や紙は出てこなかった。"}, {"t": 589.35, "x": "じゃあ瓶はその部屋で開けられたということ？"}, {"t": 591.7833333333333, "x": "裁判所はそう認めた。"}, {"t": 593.3166666666667, "x": "金具の耳の付け根が、\n鋭く切れていたことも理由に挙げている。"}, {"t": 597.8, "x": "工場や店で毒が入った可能性は無いの？"}, {"t": 600.55, "x": "1997年の最高裁はそれは無いとしている。"}, {"t": 604.0, "x": "毒が入ったのは、作られる\n途中でも運ばれる途中でもない。"}, {"t": 607.65, "x": "事件の当日だったことは明らかだと書いている。"}, {"t": 610.6333333333333, "x": "栓や紙を見つけた警察が、何か細工した可能性は？"}, {"t": 614.3166666666667, "x": "最高裁はそれも退けた。"}, {"t": 616.1666666666666, "x": "見つかった時、犯人もやり方も\nほとんど分かっていなかった。"}, {"t": 619.8666666666667, "x": "だから警察が手を加える\n余地は無かった、という理由だ。"}, {"t": 623.1833333333333, "x": "栓と紙は、どれもこのぶどう酒と\n同じ醸造所の同じ銘柄の物だった。"}, {"t": 627.6666666666666, "x": "証拠の物そのものは確かだということね。"}, {"t": 630.3666666666667, "x": "争いになるのは、それがいつ、どこで開けられたかだ。"}, {"t": 634.2, "x": "男性は殺人の罪で裁判にかけられた。"}, {"t": 636.8833333333333, "x": "1964年12月23日、\n津地方裁判所の判決は無罪だった。"}, {"t": 642.25, "x": "無罪だったの？"}, {"t": 643.3833333333333, "x": "そうだ。"}, {"t": 644.5166666666667, "x": "判決の考えはこうだ。"}, {"t": 646.1166666666667, "x": "男性のほかにも、ぶどう酒に毒を混ぜる機会があった。"}, {"t": 649.4, "x": "状況の証拠だけでは、男性を犯人と決められない。"}, {"t": 652.65, "x": "そして自白も信用できない。"}, {"t": 654.6166666666667, "x": "自白があっても無罪になることがあるのね。"}, {"t": 657.2, "x": "ある。"}, {"t": 658.3333333333334, "x": "ただ、検察はこの判決に納得せず、\n高等裁判所へ持ち込んだ。"}, {"t": 663.3333333333334, "x": "1969年9月10日、名古屋高等裁判所の判決が出た。"}, {"t": 667.95, "x": "結果は無罪から一転して死刑だった。"}, {"t": 670.5, "x": "無罪からいきなり死刑なの？"}, {"t": 672.35, "x": "そうだ。"}, {"t": 673.4833333333333, "x": "分かれ目は、ぶどう酒が葛尾に届いた時刻だった。"}, {"t": 676.5, "x": "最初の判決は、当日の午後4時ごろに\n届いたと見ていた。"}, {"t": 680.1666666666666, "x": "それなら、ほかの人にも毒を\n入れる時間があったことになる。"}, {"t": 683.6666666666666, "x": "高等裁判所は届いたのは5時過ぎだと見た。"}, {"t": 686.55, "x": "1時間ちがうとどう変わるの？"}, {"t": 688.45, "x": "5時過ぎなら、ほかの人が触れる時間はほとんど無い。"}, {"t": 691.6166666666667, "x": "残るのは、公民館で男性が\n一人だった約10分だけになる。"}, {"t": 696.15, "x": "男性は最高裁判所に訴えたが、1972年に退けられた。"}, {"t": 700.8833333333333, "x": "これで死刑が確定した。"}, {"t": 702.65, "x": "事件から11年後ね。"}, {"t": 704.4333333333333, "x": "のちの最高裁の決定は、有罪の根拠を\n3本の柱にまとめている。"}, {"t": 708.8, "x": "1本目は、公民館で一人だった約10分という機会だ。"}, {"t": 712.45, "x": "2本目は、替栓の傷が男性の歯の跡だという鑑定だ。"}, {"t": 716.05, "x": "3本目は捜査の段階での自白だ。"}, {"t": 718.5166666666667, "x": "歯の跡の鑑定もあったのね。"}, {"t": 720.45, "x": "鑑定は3つあった。"}, {"t": 721.8166666666667, "x": "2つは男性の歯でついたと判定し、\n1つは似ていると判定した。"}, {"t": 726.6, "x": "死刑が確定してから男性はどうしたの？"}, {"t": 729.2333333333333, "x": "裁判のやり直し、つまり再審を求め始めた。"}, {"t": 732.3166666666667, "x": "再審が開かれるには、無罪を\n言い渡すべき明らかな新しい証拠が要る。"}, {"t": 736.75, "x": "そう簡単には開かないのね。"}, {"t": 738.75, "x": "1978年8月11日の国会で、\n法務省の刑事局長が答えている。"}, {"t": 744.3666666666667, "x": "いま再審を求めている有名な\n事件の名前を、いくつか挙げた。"}, {"t": 748.1, "x": "帝銀事件や財田川事件と並んで、\n名張ブドウ酒事件の名前があった。"}, {"t": 752.6333333333333, "x": "帝銀事件はこの番組でも取り上げたわね。"}, {"t": 755.3833333333333, "x": "ああ。"}, {"t": 756.5166666666667, "x": "名張の再審請求は、このあと男性が\n亡くなるまでに9回を数える。"}, {"t": 761.3833333333333, "x": "大きな動きがあったのは、5回目の請求だ。"}, {"t": 764.15, "x": "1997年1月28日、\n最高裁の第三小法廷が決定を出した。"}, {"t": 769.7666666666667, "x": "テーマは2本目の柱、替栓の歯の跡だった。"}, {"t": 772.85, "x": "鑑定はどうなったの？"}, {"t": 774.3166666666667, "x": "最高裁はこう書いている。"}, {"t": 775.9, "x": "3つの鑑定は、傷が男性の歯でついたと\n特定するだけの力を失った。"}, {"t": 780.6, "x": "鑑定の力は大きく減ったことが明らかだ、とな。"}, {"t": 783.9333333333333, "x": "歯形の柱が崩れたのね。"}, {"t": 785.9, "x": "そうだ。"}, {"t": 787.0333333333333, "x": "ところが、この決定の結論は\n「再審は開かない」だった。"}, {"t": 791.5833333333334, "x": "鑑定が崩れたのにどうして？"}, {"t": 793.5166666666667, "x": "最高裁は傷についてもう1つのことを認めた。"}, {"t": 796.4833333333333, "x": "替栓の傷は人の歯の跡か、その可能性が高い。"}, {"t": 799.85, "x": "そして、男性の歯でついたとしても矛盾はしない。"}, {"t": 802.9666666666667, "x": "男性の歯だとは言えないけど、\nちがうとも言えないのね。"}, {"t": 806.1666666666666, "x": "そういうことだ。"}, {"t": 807.1666666666666, "x": "だから2本目の柱が細くなっても、\nほかの2本は倒れない。"}, {"t": 810.9666666666667, "x": "最高裁は、残りの証拠をまとめて見直すと言った。"}, {"t": 814.3166666666667, "x": "残りの2本って、10分と自白ね。"}, {"t": 816.9166666666666, "x": "そうだ。"}, {"t": 818.0333333333333, "x": "ここがこの回の謎の答えになる部分だ。"}, {"t": 821.1833333333333, "x": "最高裁は、男性のほかに毒を\n入れられる人がいたかを調べた。"}, {"t": 825.05, "x": "瓶が公民館に来てから総会までは、\nすぐそばに男性が座っていた。"}, {"t": 829.3666666666667, "x": "そのあとは、会員たちが囲炉裏の\nまわりで雑談していた。"}, {"t": 832.7833333333333, "x": "総会のあいだはどうなの？"}, {"t": 834.4333333333333, "x": "開いた障子から瓶のあたりが十分に見えた。"}, {"t": 837.1, "x": "遅れてきた人たちも、次々に\n囲炉裏の部屋を抜けていった。"}, {"t": 840.6666666666666, "x": "懇親会の準備では、何人もの男女が立ち働いていた。"}, {"t": 844.4333333333333, "x": "こっそり近づくのはむずかしそうね。"}, {"t": 846.6666666666666, "x": "最高裁は、人に知られずに毒を\n入れるのは無理だったと書いた。"}, {"t": 850.4, "x": "そして、農薬を持っていて\n一人になれたのは男性だけだとした。"}, {"t": 854.8833333333333, "x": "弁護する側はどう反論したの？"}, {"t": 856.9666666666667, "x": "瓶は公民館に来る前に、別の場所で\n開けられたのではないか。"}, {"t": 860.6833333333333, "x": "毒を入れて栓を戻し、紙も貼り直したのではないか。"}, {"t": 863.9166666666666, "x": "そうすれば、10分は関係なくなるという主張だ。"}, {"t": 867.1, "x": "それなら話が全然変わるわね。"}, {"t": 869.3, "x": "だが1997年の最高裁はこの主張を退けた。"}, {"t": 873.1833333333333, "x": "封かん紙を調べても、貼り直した跡は見つからない。"}, {"t": 876.3, "x": "栓が2回開けられたことを示す証拠も無い、とな。"}, {"t": 879.5, "x": "自白のほうはどう見られたの？"}, {"t": 881.3333333333334, "x": "自白の中身は、見つかった物の状態と\nよく合っていると判断された。"}, {"t": 885.5833333333334, "x": "紙のかけらが一体だったこと、切れた\n金具、あとで見つかった火挟みだ。"}, {"t": 890.6833333333333, "x": "2004年5月13日、参議院の委員会に\n1人の弁護士が呼ばれた。"}, {"t": 895.1833333333333, "x": "裁判員制度について意見を述べるためだった。"}, {"t": 897.9166666666666, "x": "その弁護士は名張の事件の弁護人でもあった。"}, {"t": 900.8666666666667, "x": "国会でどんなことを話したの？"}, {"t": 902.9333333333333, "x": "最初の裁判で無罪だった人が、\n高裁で逆転の死刑を受けた。"}, {"t": 906.9666666666667, "x": "以来40年以上、獄中から無実を\n叫び続けている、と述べた。"}, {"t": 911.15, "x": "そして取り調べを録画するよう求めた。"}, {"t": 913.6833333333333, "x": "自白をめぐる争いをくり返さないためね。"}, {"t": 916.35, "x": "そうだ。"}, {"t": 917.4833333333333, "x": "これは弁護人としての意見で、\n裁判所の判断とは別の話だ。"}, {"t": 922.2333333333333, "x": "7回目の請求でついに扉が開いた。"}, {"t": 924.7833333333333, "x": "2005年4月5日、名古屋高等裁判所が\n再審を開始すると決めた。"}, {"t": 929.45, "x": "やり直しが認められたのね！"}, {"t": 931.35, "x": "翌日の国会で議員がこの決定にふれている。"}, {"t": 934.2333333333333, "x": "状況の証拠からは犯人と推し量れない。"}, {"t": 936.7833333333333, "x": "自白の信用性に疑問がある。"}, {"t": 938.7333333333333, "x": "裁判長はそう述べたと議員は紹介した。"}, {"t": 941.4, "x": "最初の裁判と同じ考え方ね。"}, {"t": 943.7666666666667, "x": "別の議員は、死刑が確定した事件の再審は\nしばらく止まっていたと述べた。"}, {"t": 948.4, "x": "だから大きなニュースとして受けとめた、とな。"}, {"t": 951.6833333333333, "x": "再審が開かれることはめったに無いの？"}, {"t": 954.1666666666666, "x": "2005年6月の国会で、議員が\n最高裁の数字を読み上げている。"}, {"t": 958.3666666666667, "x": "1970年代は、請求908件に\n対して開始が300件だった。"}, {"t": 963.5, "x": "1980年代は946件に対して167件だ。"}, {"t": 968.1666666666666, "x": "1990年代は790件に対して96件になった。"}, {"t": 972.8333333333334, "x": "だんだん減っているのね。"}, {"t": 974.3666666666667, "x": "議員は、70年代の3分の1から\n90年代は8分の1だと言った。"}, {"t": 979.1, "x": "議員は、この減り方を\nどう見ているのかと最高裁に尋ねた。"}, {"t": 982.8166666666667, "x": "だから2005年の決定は、大きなニュースだったのね。"}, {"t": 986.7166666666667, "x": "それでやり直しの裁判は開かれたの？"}, {"t": 989.1666666666666, "x": "開かれなかった。"}, {"t": 990.35, "x": "検察が、再審開始の決定に異議を申し立てたんだ。"}, {"t": 993.8, "x": "2006年、名古屋高等裁判所の別の部が、\n開始決定を取り消した。"}, {"t": 998.4666666666667, "x": "同じ裁判所の中でひっくり返ったの？"}, {"t": 1001.05, "x": "そうだ。"}, {"t": 1002.1666666666666, "x": "今度は弁護する側が最高裁に特別抗告をした。"}, {"t": 1005.5, "x": "2011年の国会で、議員が\nこの流れを短くまとめている。"}, {"t": 1009.5, "x": "最初の再審開始決定が取り消され、\n最高裁がそれをまた取り消した、とな。"}, {"t": 1014.4833333333333, "x": "決定がひっくり返り続けたのね。"}, {"t": 1016.8, "x": "その最高裁の決定が、2010年に出る。"}, {"t": 1020.3166666666667, "x": "2011年12月の国会では、\n裁判官の勉強の本が話題になった。"}, {"t": 1025.1166666666666, "x": "自白をどう信用するかを学ぶための本だ。"}, {"t": 1027.8666666666666, "x": "そこに名張の事件が出てくるの？"}, {"t": 1029.9833333333333, "x": "議員によると、有罪の例として\n名張の事件が載っていた。"}, {"t": 1033.5, "x": "同じ本には、すでに再審で無罪が\n確定した布川事件も入っていた。"}, {"t": 1037.9166666666667, "x": "議員は、本そのものを見直すべきだと最高裁に求めた。"}, {"t": 1041.6333333333334, "x": "教科書に載っている事件が、まだ争われているのね。"}, {"t": 1044.9166666666667, "x": "そうだ。"}, {"t": 1046.0333333333333, "x": "議員の意見であって、本の中身を\n裁判所が変えたわけではない。"}, {"t": 1049.75, "x": "ただ、国会でそう問われたことは記録に残っている。"}, {"t": 1053.5333333333333, "x": "2010年4月5日、最高裁の第三小法廷の決定だ。"}, {"t": 1057.6, "x": "弁護する側の新しい証拠は、\n5つのグループに分けられていた。"}, {"t": 1061.4333333333334, "x": "最高裁は、そのうち4つは明らかな\n新証拠に当たらないとした。"}, {"t": 1065.5166666666667, "x": "残りの1つは？"}, {"t": 1066.8166666666666, "x": "毒の種類についての鑑定だ。"}, {"t": 1068.7666666666667, "x": "これについては調べ方が足りないと判断した。"}, {"t": 1071.5833333333333, "x": "そして事件を名古屋高等裁判所に差し戻した。"}, {"t": 1074.7333333333333, "x": "もう一度、高等裁判所で調べなさいということね。"}, {"t": 1077.9833333333333, "x": "そうだ。"}, {"t": 1079.1166666666666, "x": "先に退けられた4つの中身を見ておこう。"}, {"t": 1082.4166666666667, "x": "1つ目は、封かん紙を破らずに瓶を開ける実験だ。"}, {"t": 1085.65, "x": "同じ形の栓と瓶で試すと、開けたと\n分からないように開けられた。"}, {"t": 1089.8333333333333, "x": "じゃあ別の場所で開けることもできたのね。"}, {"t": 1092.2833333333333, "x": "最高裁は、それは抽象的な可能性にとどまると書いた。"}, {"t": 1095.95, "x": "そうしたことをうかがわせる\n証拠は無い、という意味だ。"}, {"t": 1098.8666666666666, "x": "さらに最高裁は懇親会の準備を振り返った。"}, {"t": 1101.8166666666666, "x": "準備の時に紙をやぶって金具を\n外したという話は、誰からも出ていない。"}, {"t": 1106.4166666666667, "x": "紙がやぶれたのはいつになるの？"}, {"t": 1108.3833333333334, "x": "最高裁は、人が集まる5時30分より前だと推し量った。"}, {"t": 1112.3333333333333, "x": "準備のために開ける必要は無い時間だから、\nその時に毒が入ったと見たんだ。"}, {"t": 1117.7333333333333, "x": "2010年の最高裁は、\n外側の金具の形も細かく見ている。"}, {"t": 1122.0, "x": "耳の付け根の両側が切れて口が開いていた。"}, {"t": 1124.8166666666666, "x": "耳の部分はほぼまっすぐに伸びていた。"}, {"t": 1127.1833333333334, "x": "それで何が分かるの？"}, {"t": 1128.65, "x": "紙が巻かれたままの時に、\n下から上へ大きな力がかかった。"}, {"t": 1132.5333333333333, "x": "耳が紙を引きやぶりながら\n外れた、と見ることができる。"}, {"t": 1135.8833333333334, "x": "封かん紙のやぶれ目も、\n耳の左側に沿って弧を描いていた。"}, {"t": 1139.65, "x": "紙を巻いたままむりやり開けたということね。"}, {"t": 1142.2, "x": "そうだ。"}, {"t": 1143.3166666666666, "x": "最高裁は、宴会の準備で\nこんな開け方をするとは考えられないとした。"}, {"t": 1148.3, "x": "2つ目は、替栓の足の1本が\n極端に折れ曲がっている点だ。"}, {"t": 1152.2, "x": "鑑定人は、人の歯ではこの形にならないと述べた。"}, {"t": 1155.7166666666667, "x": "歯でかんだという自白と合わないのね。"}, {"t": 1157.9666666666667, "x": "最高裁は、昔の鑑定では足に\n歯の跡が2つ見えていたと指摘した。"}, {"t": 1162.5166666666667, "x": "いまは錆で黒ずんで、跡が\n見えにくくなっているだけだという。"}, {"t": 1165.9833333333333, "x": "歯と指の力が重なって、曲がった\n可能性も否定できないとした。"}, {"t": 1170.1166666666666, "x": "3つ目は封かん紙のやぶれ方の鑑定だ。"}, {"t": 1172.65, "x": "火挟みで突き上げても、\nこんなやぶれ方にはならないという主張だった。"}, {"t": 1176.8, "x": "それも退けられたの？"}, {"t": 1178.4166666666667, "x": "最高裁は、大きいかけらは手で\nはがしたほうが自然だと認めた。"}, {"t": 1182.2833333333333, "x": "それでも、紙をどうしたか覚えていないという\n自白とは矛盾しないとした。"}, {"t": 1187.0333333333333, "x": "4つ目は色の話だ。"}, {"t": 1188.6166666666666, "x": "ニッカリンTには、フクシンという\n赤い色がつけられていた。"}, {"t": 1191.9333333333334, "x": "これを入れたら、ぶどう酒は\n赤くなったはずだという主張だ。"}, {"t": 1195.3333333333333, "x": "現場のぶどう酒は赤くなかったの？"}, {"t": 1197.5, "x": "赤くなった形跡は無かった。"}, {"t": 1199.3666666666666, "x": "だが最初の裁判ですでに実験が行われていた。"}, {"t": 1202.45, "x": "自白どおりの量を入れても、色は\n変わらなかったという結果だ。"}, {"t": 1206.1166666666666, "x": "同じ農薬で実験したの？"}, {"t": 1208.0666666666666, "x": "最高裁は、色のついた農薬が\n使われたと見るのが相当だとした。"}, {"t": 1212.2, "x": "昔の実験では白く濁り、新しい実験では赤くなった。"}, {"t": 1216.0333333333333, "x": "条件が根本からちがう、というのが最高裁の判断だ。"}, {"t": 1220.2, "x": "残った毒の鑑定ってどんなものなの？"}, {"t": 1222.6833333333334, "x": "事件のあと、三重県の衛生研究所が\nおこなった試験がもとになっている。"}, {"t": 1226.9833333333333, "x": "紙に薬をしみこませて、成分ごとに分ける試験だ。"}, {"t": 1230.3833333333334, "x": "分かれた成分は、紙の上に\n色のついた点になって出る。"}, {"t": 1233.8166666666666, "x": "点の数で中身が分かるのね。"}, {"t": 1235.8166666666666, "x": "ぶどう酒にニッカリンTを\n入れて試すと、点は3つ出た。"}, {"t": 1239.1166666666666, "x": "ところが、現場の飲み残しの\nぶどう酒では2つしか出なかった。"}, {"t": 1242.85, "x": "出なかったのは、\nトリエチルピロホスフェートという成分だ。"}, {"t": 1246.1833333333334, "x": "ニッカリンTに入っている\n成分なのに、出なかったのね。"}, {"t": 1249.55, "x": "弁護する側は、そもそも\n別のテップ剤だったと主張した。"}, {"t": 1253.2, "x": "それなら、男性が持っていた\nニッカリンTとは話が合わなくなる。"}, {"t": 1257.6166666666666, "x": "取り消した側の高等裁判所は、こう説明していた。"}, {"t": 1260.95, "x": "1.8リットルに4から5ミリリットルなら、\n360倍から450倍に薄まる。"}, {"t": 1266.3666666666666, "x": "量が少なすぎて、試験で\n見えなかっただけだ、というわけだ。"}, {"t": 1270.2, "x": "それなら筋は通りそうね。"}, {"t": 1271.9833333333333, "x": "最高裁はその説明に疑問を示した。"}, {"t": 1274.55, "x": "同じように薄まっている\nほかの成分は、ちゃんと出ている。"}, {"t": 1277.75, "x": "この成分だけが見えなかった\n理由を、うまく説明できていない。"}, {"t": 1281.4833333333333, "x": "だから差し戻しになったのね。"}, {"t": 1283.4833333333333, "x": "そうだ。"}, {"t": 1284.6166666666666, "x": "決定に付いた裁判官の意見は、学者の見方が\n真っ向から分かれていると書いた。"}, {"t": 1289.4833333333333, "x": "そして差し戻した先で、早く確かめるよう求めた。"}, {"t": 1293.5333333333333, "x": "差し戻された名古屋高等裁判所は、\n新しく鑑定をおこなった。"}, {"t": 1297.5333333333333, "x": "当時の作り方で、ニッカリンTを作り直したんだ。"}, {"t": 1300.9, "x": "農薬を作り直したの？"}, {"t": 1302.6166666666666, "x": "そうだ。"}, {"t": 1303.75, "x": "そしてエーテルという液で成分を\n取り出す手順を、実際に試した。"}, {"t": 1307.7333333333333, "x": "するとトリエチルピロホスフェートは、\nこの手順では取り出されなかった。"}, {"t": 1311.7166666666667, "x": "じゃあ現場の試料から出なくても当然なのね。"}, {"t": 1314.4333333333334, "x": "高等裁判所はそう判断した。"}, {"t": 1316.5, "x": "2012年5月25日、高等裁判所はもう\n一度、再審の開始を取り消した。"}, {"t": 1321.95, "x": "また閉じてしまったのね。"}, {"t": 1324.1, "x": "弁護する側はまた最高裁に訴えた。"}, {"t": 1326.5666666666666, "x": "当時は塩を加えてから成分を\n取り出す方法が行われていた。"}, {"t": 1330.2, "x": "その方法なら、問題の成分は\n取り出せるはずだという主張だ。"}, {"t": 1334.15, "x": "やり方が違ったと言いたいのね。"}, {"t": 1336.2333333333333, "x": "2013年10月16日、\n最高裁の第一小法廷が決定を出した。"}, {"t": 1341.0666666666666, "x": "当時の研究所で塩を加えた\n形跡はうかがえない、と退けた。"}, {"t": 1344.9166666666667, "x": "作り直した農薬での鑑定には、\n科学的な根拠があると認めた。"}, {"t": 1349.2666666666667, "x": "結論は？"}, {"t": 1350.4, "x": "裁判官全員一致で訴えを退けた。"}, {"t": 1352.9666666666667, "x": "2005年に開いた扉は、8年かけて\n完全に閉じたことになる。"}, {"t": 1357.8333333333333, "x": "男性はその後も請求を続けた。"}, {"t": 1360.0, "x": "8回目、そして9回目の請求だ。"}, {"t": 1362.5, "x": "9回目の請求の途中、\n2015年10月4日に男性は亡くなった。"}, {"t": 1367.15, "x": "再審を待ったまま？"}, {"t": 1368.5833333333333, "x": "そうだ。"}, {"t": 1369.7166666666667, "x": "国会での議員の話では、\n八王子の医療刑務所で、89歳だった。"}, {"t": 1374.4166666666667, "x": "別の議員は、35歳で身柄を取られたと述べている。"}, {"t": 1377.8833333333334, "x": "人生のほとんどを拘置されて過ごしたのね。"}, {"t": 1380.5666666666666, "x": "議員たちは、死刑が確定したまま\n43年がたったと述べた。"}, {"t": 1384.5666666666666, "x": "最後まで無実を訴えたままだった。"}, {"t": 1387.4166666666667, "x": "再審の開始が決まっても、取り消せるものなのね。"}, {"t": 1390.6166666666666, "x": "検察には、開始決定に不服を申し立てる道がある。"}, {"t": 1394.05, "x": "2019年の国会で、議員がこの点を取り上げた。"}, {"t": 1397.4, "x": "名張では、開始決定が取り消された\nあと、男性は9回目の途中で亡くなった。"}, {"t": 1402.2666666666667, "x": "議員は、検察の不服申し立てを\nやめるべきだと述べた。"}, {"t": 1405.7833333333333, "x": "検察の側の考えもあるのよね。"}, {"t": 1408.0666666666666, "x": "ああ。"}, {"t": 1409.2, "x": "2023年の国会でも、別の議員が\n同じことを問うている。"}, {"t": 1413.1333333333334, "x": "議員によると、法務省はむずかしいという答えだった。"}, {"t": 1416.2666666666667, "x": "この議論は、3年後の法律の改正につながっていく。"}, {"t": 1420.35, "x": "本人が亡くなったらもう終わりなの？"}, {"t": 1422.5333333333333, "x": "そうではない。"}, {"t": 1423.6666666666667, "x": "家族が、亡くなった人に代わって\n再審を求めることができる。"}, {"t": 1427.5, "x": "2015年11月、男性の妹が10回目の請求をした。"}, {"t": 1431.7666666666667, "x": "妹さんが引き継いだのね。"}, {"t": 1433.6666666666667, "x": "新しい証拠の中心はまたあの封かん紙だった。"}, {"t": 1436.5, "x": "今度は紙の裏についたのりが調べられたんだ。"}, {"t": 1439.3666666666666, "x": "のりなんて何十年もたって分かるの？"}, {"t": 1441.6833333333334, "x": "そこが、このあと最高裁で\n正面から争われることになる。"}, {"t": 1445.9166666666667, "x": "鑑定をしたのは大学の教授だ。"}, {"t": 1448.0166666666667, "x": "赤外線を当てて、表面の成分を調べる方法を使った。"}, {"t": 1451.7333333333333, "x": "結果は、紙の裏から2種類ののりが\n見つかったというものだった。"}, {"t": 1455.55, "x": "1つは、工場で紙を瓶に貼る時に使われたのりだ。"}, {"t": 1458.95, "x": "もう1つは、家庭用の洗濯のりにも\n使われる成分だった。"}, {"t": 1462.8, "x": "工場では使っていないのりなのね。"}, {"t": 1465.0, "x": "そうだ。"}, {"t": 1466.1166666666666, "x": "もし本当なら、誰かが紙をはがして毒を\n入れ、別ののりで貼り直したことになる。"}, {"t": 1471.2, "x": "それなら、公民館で開けたとは限らなくなるわね。"}, {"t": 1474.4, "x": "10分の柱が揺らぐ、という主張だ。"}, {"t": 1477.5166666666667, "x": "名古屋高等裁判所は、\n2017年12月8日に請求を退けた。"}, {"t": 1482.1, "x": "妹の異議も、2022年3月3日に退けられた。"}, {"t": 1486.0333333333333, "x": "のりの鑑定はどう見られたの？"}, {"t": 1487.8833333333334, "x": "のりがあるかどうかを見分ける\n目印を、教授が途中で変えている。"}, {"t": 1491.5, "x": "判断の根拠も十分に示していない。"}, {"t": 1493.8666666666666, "x": "だから科学的な根拠のある\n鑑定とは言えない、とされた。"}, {"t": 1497.4333333333334, "x": "教授から直接話を聞いたの？"}, {"t": 1499.6666666666667, "x": "教授を証人として呼ぶことはしなかった。"}, {"t": 1502.1666666666667, "x": "最高裁はそれでも違法ではないとしている。"}, {"t": 1505.2833333333333, "x": "10回目の請求では、自白についての鑑定も出された。"}, {"t": 1508.8, "x": "心理学の立場から、自白の信用性に\n疑問があるという内容だ。"}, {"t": 1512.9833333333333, "x": "心の動きから自白を調べるのね。"}, {"t": 1515.4166666666667, "x": "2024年の最高裁はこれも退けた。"}, {"t": 1518.25, "x": "理由は、1997年の決定と同じだった。"}, {"t": 1521.75, "x": "男性は身柄を取られる前に、\nとても具体的な自白をしている。"}, {"t": 1525.5333333333333, "x": "警察が持っていた資料から作れる中身ではない。"}, {"t": 1528.4333333333334, "x": "そして見つかった物の状態と、\n矛盾なく合っている、とな。"}, {"t": 1532.2166666666667, "x": "自白の柱は、ずっと同じ理由で支えられてきたのね。"}, {"t": 1535.7833333333333, "x": "そうだ。"}, {"t": 1537.0666666666666, "x": "2024年1月29日、\n最高裁の第三小法廷が決定を出した。"}, {"t": 1542.0333333333333, "x": "結論は妹の訴えを退けるものだった。"}, {"t": 1544.9166666666667, "x": "理由は何だったの？"}, {"t": 1546.3, "x": "まずこの調べ方には限界があると書いた。"}, {"t": 1548.8666666666666, "x": "何がついているか分からない\n物では、成分を言い当てにくい。"}, {"t": 1552.2333333333333, "x": "それに封かん紙は、事件の翌々日に\n壁際で見つかった物だ。"}, {"t": 1556.3166666666666, "x": "見つかるまでや保管のあいだに、\n何かがついた可能性もある。"}, {"t": 1559.95, "x": "60年以上たっているものね。"}, {"t": 1562.0333333333333, "x": "長い年月で、成分が変わったことも\n十分考えられるとした。"}, {"t": 1565.95, "x": "だから、貼り直しの可能性を示すこと\n自体、相当にむずかしいと書いた。"}, {"t": 1571.0833333333333, "x": "ただこの決定は全員一致ではなかった。"}, {"t": 1573.5333333333333, "x": "5人の裁判官のうち1人が、反対意見を書いている。"}, {"t": 1577.1166666666666, "x": "反対意見って？"}, {"t": 1578.3666666666666, "x": "結論に反対する裁判官が、\n自分の考えを書き残すものだ。"}, {"t": 1582.5333333333333, "x": "その裁判官は再審を開始すべきだと書いた。"}, {"t": 1585.4166666666667, "x": "のりの鑑定には、高い信用性が認められると考えた。"}, {"t": 1589.0833333333333, "x": "どうしてそう言えるの？"}, {"t": 1590.45, "x": "測定は裁判所で、裁判官や\n書記官の立ち会いのもとで行われた。"}, {"t": 1594.7333333333333, "x": "調べ方そのものも、物質を見分ける\n標準的な方法だと書いている。"}, {"t": 1599.0166666666667, "x": "比べるための紙も、当時ぶどう酒を\n造っていた所から手に入れていた。"}, {"t": 1603.8333333333333, "x": "反対意見は毒の臭いにも触れている。"}, {"t": 1606.1166666666666, "x": "ぶどう酒から石油のような臭いがしたと\n述べた人が、少なくとも6人いた。"}, {"t": 1610.8166666666666, "x": "それがどうして問題なの？"}, {"t": 1612.5666666666666, "x": "ニッカリンTには強い臭いが無く、\n弱いフルーツのような臭いだという。"}, {"t": 1616.45, "x": "別のテップ剤には、石油のような\n臭いを感じさせるものがあった。"}, {"t": 1620.3333333333333, "x": "それならニッカリンTを使ったという\n自白に疑問が出る、という考えだ。"}, {"t": 1624.6166666666666, "x": "自白そのものについては？"}, {"t": 1626.35, "x": "暴力をふるわれたことは無いと認めている。"}, {"t": 1628.8, "x": "ただ取り調べはとても長い時間に及んだ。"}, {"t": 1631.35, "x": "逮捕前の自白だから本当だと、\nすぐ決めるべきではないと書いた。"}, {"t": 1635.35, "x": "反対意見の結論は、有罪に合理的な\n疑いが生じている、というものだった。"}, {"t": 1640.9, "x": "反対意見は、自白の中身にも\n多くの疑問を挙げている。"}, {"t": 1644.35, "x": "自白では、竹の筒は囲炉裏で\n燃やしたことになっている。"}, {"t": 1647.6666666666667, "x": "だがそれらしい物は見つかっていない。"}, {"t": 1649.7666666666667, "x": "囲炉裏の灰からは、農薬に含まれる燐も出なかった。"}, {"t": 1653.1, "x": "燃やしても燐は残るものなの？"}, {"t": 1655.0833333333333, "x": "農薬を作った会社は、燃やしても\n燐は見つけられると答えていた。"}, {"t": 1659.0833333333333, "x": "最初の裁判では、夜に竹の筒へ水を注ぐ実験もした。"}, {"t": 1663.0, "x": "暗くてあふれてしまい、うまく\n入れられなかったという。"}, {"t": 1666.0166666666667, "x": "前の晩から準備したというのも変なのかしら？"}, {"t": 1668.8833333333334, "x": "ぶどう酒を出すと最終的に\n決まったのは、事件の当日だった。"}, {"t": 1672.8166666666666, "x": "一人になる時間ができることも、\n前もって分かるはずがない。"}, {"t": 1676.3333333333333, "x": "反対意見は、あやふやな見込みで\n計画したことになると書いた。"}, {"t": 1680.7833333333333, "x": "それで終わってしまったの？"}, {"t": 1682.4166666666667, "x": "いや、まだ続いている。"}, {"t": 1683.8833333333334, "x": "ここからは報道による話だ。"}, {"t": 1685.8333333333333, "x": "2026年1月、妹と弁護団が11回目の請求をした。"}, {"t": 1690.2833333333333, "x": "報道では妹はこの時96歳だった。"}, {"t": 1693.2333333333333, "x": "ずっと兄のために闘ってきたのね。"}, {"t": 1695.6333333333334, "x": "新しい証拠はやはり封かん紙ののりだ。"}, {"t": 1698.0, "x": "年月による変化も考えに入れて、\n再現の実験をしたという。"}, {"t": 1701.8833333333334, "x": "工場ののりとはちがう、市販の\nのりの可能性が高いという鑑定だ。"}, {"t": 1706.05, "x": "最高裁が言った弱点を埋めようとしたのね。"}, {"t": 1709.3333333333333, "x": "2026年10月、新しい動きが報じられた。"}, {"t": 1712.7333333333333, "x": "名古屋高等裁判所が、封かん紙の\nのりを鑑定すると決めたんだ。"}, {"t": 1716.7666666666667, "x": "裁判所が自分で調べることにしたのね。"}, {"t": 1719.4, "x": "弁護団が記者会見でそれを明らかにした。"}, {"t": 1722.1, "x": "報道の見出しには、封かん紙を\n切り取って鑑定するとあった。"}, {"t": 1725.8, "x": "65年前の紙をいま切り取るのね。"}, {"t": 1728.3333333333333, "x": "そうだ。"}, {"t": 1729.4666666666667, "x": "結果がどうなるかはまだ分からない。"}, {"t": 1731.4333333333334, "x": "ここで言えるのは、裁判所が紙を\n調べ始めたということだけだ。"}, {"t": 1735.8833333333334, "x": "2026年の国会では、再審の手続きを\n決める法律の改正が議論された。"}, {"t": 1741.05, "x": "その審議の中で、名張の事件は\n何度も名前が出ている。"}, {"t": 1744.65, "x": "どんなふうに話されたの？"}, {"t": 1746.3333333333333, "x": "ある議員は、最初の裁判が\n無罪だった例として挙げた。"}, {"t": 1749.6666666666667, "x": "三審制で確定したといっても、\n3回有罪になったわけではないと述べた。"}, {"t": 1754.2166666666667, "x": "別の議員は、兄の無罪を訴え続けてきた\n妹が96歳になったと述べた。"}, {"t": 1759.2333333333333, "x": "参議院の委員会では、裁判所が\n証拠を出させる命令の新設が説明された。"}, {"t": 1764.0166666666667, "x": "検察が再審開始に不服を言うことを、\n原則禁止にする内容も入った。"}, {"t": 1768.8, "x": "法律は変わったの？"}, {"t": 1770.2166666666667, "x": "10月の本会議で、議員がさきの国会で\n改正されたと述べている。"}, {"t": 1774.9333333333334, "x": "ここで、3本の柱をもう一度並べてみよう。"}, {"t": 1777.8166666666666, "x": "2本目の歯形は、1997年に\n男性の歯と特定する力を失った。"}, {"t": 1783.0833333333333, "x": "毒の種類は、2010年に疑問が出て、\n2013年に矛盾しないとされた。"}, {"t": 1788.0333333333333, "x": "封かん紙ののりは、2024年に\n5人中4人が退け、1人が再審を求めた。"}, {"t": 1793.5333333333333, "x": "残っているのは？"}, {"t": 1794.75, "x": "1本目の10分と、3本目の自白だ。"}, {"t": 1797.45, "x": "最高裁は、この2本があれば有罪に\n合理的な疑いは無いとしてきた。"}, {"t": 1801.8833333333334, "x": "だから歯形が崩れても、死刑は動かなかったのね。"}, {"t": 1805.2333333333333, "x": "そうだ。"}, {"t": 1806.35, "x": "そして今、のりの鑑定は、\nその10分そのものを問い直している。"}, {"t": 1810.9666666666667, "x": "最後に要点をまとめよう。"}, {"t": 1812.5833333333333, "x": "1961年3月28日、公民館の懇親会で\nぶどう酒に農薬が入っていた。"}, {"t": 1818.6, "x": "17人が飲み、5人の女性が\n亡くなり、12人がけがをした。"}, {"t": 1822.6, "x": "ぶどう酒を運んだ男性は、自白のあと否認に転じた。"}, {"t": 1826.0333333333333, "x": "最初の裁判は無罪、高等裁判所は\n死刑で、1972年に確定した。"}, {"t": 1831.4833333333333, "x": "歯形の鑑定が崩れたのは1997年だったわね。"}, {"t": 1835.3833333333334, "x": "再審の開始が決まったのは2005年、\n取り消されたのは2006年だ。"}, {"t": 1839.6833333333334, "x": "2013年に扉は閉じ、男性は\n2015年に89歳で亡くなった。"}, {"t": 1844.6333333333334, "x": "妹の請求は2024年に退けられたが、\n1人の裁判官が反対した。"}, {"t": 1849.8166666666666, "x": "そして11回目の請求がいま続いているのね。"}, {"t": 1853.3166666666666, "x": "記録を読み終えても、\n答えの出ていない問いが3つ残る。"}, {"t": 1856.5833333333333, "x": "1つ目は、ぶどう酒は本当に公民館で開けられたのか。"}, {"t": 1860.05, "x": "2つ目は、身柄を取られる前の自白を\nどこまで信じられるのか。"}, {"t": 1863.8666666666666, "x": "3つ目は、封かん紙の裏に何がついているのかだ。"}, {"t": 1867.05, "x": "3つ目はいま裁判所が調べているのね。"}, {"t": 1869.6166666666666, "x": "そうだ。"}, {"t": 1870.75, "x": "裁判所は60年以上、10分と自白で有罪を支えてきた。"}, {"t": 1874.7333333333333, "x": "一方で、最初の裁判所と、\n最高裁の1人の裁判官は疑問を書き残した。"}, {"t": 1879.95, "x": "同じ証拠を見て結論が分かれたのね。"}, {"t": 1882.4166666666667, "x": "その両方が記録として並んで残っている。"}, {"t": 1885.6666666666667, "x": "最後に、1961年の春の夜を思い浮かべてみよう。"}, {"t": 1889.55, "x": "役員を選び終えて、ほっとした懇親会の席だった。"}, {"t": 1892.8833333333334, "x": "湯飲みについだ1杯のぶどう酒で、\n5人の女性が亡くなった。"}, {"t": 1896.5666666666666, "x": "けがをした人たちも、つらい思いをしたでしょうね。"}, {"t": 1899.5666666666666, "x": "小さな集落に深い傷が残ったはずだ。"}, {"t": 1902.2, "x": "死刑とされた男性は、無実を\n訴えたまま89歳で亡くなった。"}, {"t": 1906.4833333333333, "x": "いまはその妹が、90歳を超えて裁判を続けている。"}, {"t": 1910.1, "x": "古い決定を読む意味って何なのかしら？"}, {"t": 1912.5833333333333, "x": "裁判所が何を根拠に結論を出したのかを、\n自分の目で確かめられる。"}, {"t": 1916.9333333333334, "x": "何が崩れて何が残ったのかも分かる。"}, {"t": 1919.4833333333333, "x": "亡くなった5人のためにも、\n確かな答えが出てほしいわね。"}, {"t": 1923.1, "x": "名張毒ぶどう酒事件の記録は、いまも閉じていない。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
