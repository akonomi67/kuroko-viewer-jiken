<script>
const D={"name": "067", "file": "067_編集用", "dur": 2164.71665625, "segs": [], "subs": [{"t": 0.0, "x": "一九七七年十一月十五日。新潟市。"}, {"t": 3.566666666666667, "x": "中学一年生の女の子が、部活動を終えて学校を出た。"}, {"t": 7.2, "x": "バドミントンの練習のあとだった。"}, {"t": 9.183333333333334, "x": "同じ部の友達二人と、\n午後六時三十五分ごろ、正門を出ている。"}, {"t": 13.533333333333333, "x": "一人は正門を出てすぐ別れた。"}, {"t": 15.55, "x": "もう一人とは、学校から\n約二百メートル離れた十字路で別れた。"}, {"t": 19.633333333333333, "x": "そこから先を、誰も見ていない。"}, {"t": 21.8, "x": "二百メートル？"}, {"t": 22.916666666666668, "x": "ああ。学校から二百メートルだ。"}, {"t": 24.966666666666665, "x": "警察庁は、この地点を別の言い方で書いている。"}, {"t": 28.0, "x": "「海岸から数百メートル離れた地点で\n友人と別れた後、消息を絶ち」。"}, {"t": 32.55, "x": "その日の午後十時ごろ、母親から\n警察署に通報があった。"}, {"t": 36.25, "x": "警察犬が出た。機動隊が出た。"}, {"t": 38.36666666666667, "x": "海上保安部が海から捜した。"}, {"t": 40.43333333333333, "x": "見つからなかった。"}, {"t": 41.75, "x": "その日のうちに、そこまでやったのね。"}, {"t": 44.18333333333333, "x": "ああ。やっている。"}, {"t": 45.28333333333333, "x": "この子の名前が、国会の記録に\n出てくるのは、二十年後だ。"}, {"t": 49.233333333333334, "x": "二十年？"}, {"t": 50.083333333333336, "x": "そうだ。一九九七年二月三日の衆議院予算委員会。"}, {"t": 54.233333333333334, "x": "先に断っておく。"}, {"t": 55.6, "x": "私は、この人が今どうしているかを言わない。"}, {"t": 58.36666666666667, "x": "生きているとも、亡くなっているとも、\n私の口では言わない。"}, {"t": 61.916666666666664, "x": "北朝鮮側が何を伝えてきたか、日本政府が\n何と言っているか。その二つを並べるだけだ。"}, {"t": 67.75, "x": "ご家族はご存命で、今も情報提供を呼びかけている。"}, {"t": 71.11666666666666, "x": "だから私は、煽らない。"}, {"t": 72.65, "x": "想像で気持ちを代弁もしない。"}, {"t": 74.63333333333334, "x": "使うのは、国会の会議録と、政府と\n警察庁が公表している文章だけだ。"}, {"t": 79.58333333333333, "x": "何が質されて、何が答弁されたか。\nそれだけを順番にたどる。"}, {"t": 84.3, "x": "一九九七年五月一日、参議院決算委員会。"}, {"t": 88.23333333333333, "x": "ある議員が、この事件の経緯を通して説明している。"}, {"t": 91.43333333333334, "x": "「その日の午後十時ごろ、母親の早紀江さんから\n新潟中央署に通報がありまして」"}, {"t": 96.28333333333333, "x": "「中央署では警察犬も投入して\n大がかりな捜索を行い」"}, {"t": 99.93333333333334, "x": "「また県警本部の機動隊、近隣の警察署も\n応援して広範囲にわたる海岸線の捜索を行い」"}, {"t": 105.88333333333334, "x": "「新潟海上保安部による海からの捜索も行われた」"}, {"t": 109.33333333333333, "x": "海からも捜したの？"}, {"t": 110.85, "x": "ああ。海上保安部が出ている。"}, {"t": 112.66666666666667, "x": "「めぐみさんの行方は杳として\nわからないままでありました」"}, {"t": 115.8, "x": "二〇二四年四月八日、衆議院の拉致問題特別委員会。"}, {"t": 119.83333333333333, "x": "質問した議員は、当時、同じ中学校の二年生だった。"}, {"t": 123.65, "x": "「今から四十六年前、私が十四歳、\n新潟市立寄居中学校の二年生に在学していたときに」"}, {"t": 130.1, "x": "「一つ下の学年に横田めぐみさんが\n十三歳で在学されていらっしゃいました」"}, {"t": 134.75, "x": "「当時、新潟県警の大捜索がありまして」"}, {"t": 137.65, "x": "「私も同じ通学路を通っておりましたので、警察の方に\n事情を聞かれたことを今でもよく覚えております」"}, {"t": 143.95, "x": "同じ通学路を通ってた人が、いま国会議員なのね。"}, {"t": 147.45, "x": "そうだ。四十六年たって、そういうことが起きる。"}, {"t": 150.58333333333334, "x": "だが、その日を最後に、手がかりは出なかった。"}, {"t": 153.46666666666667, "x": "所持していたものが見つかったという記録も、\n目撃の記録も、私が読んだ会議録には出てこない。"}, {"t": 159.53333333333333, "x": "何も残らなかったということ？"}, {"t": 161.53333333333333, "x": "少なくとも、国会の記録の中に、\nそのとき何が出たという答弁はない。"}, {"t": 166.11666666666667, "x": "だから私は「何も残らなかった」とは言わない。"}, {"t": 169.86666666666667, "x": "会議録の中で、この事件はずっと\n「少女行方不明事案」と呼ばれている。"}, {"t": 174.56666666666666, "x": "行方不明事案。"}, {"t": 175.78333333333333, "x": "ああ。一九九七年五月一日の警察庁の答弁でも、\nそう呼ばれている。"}, {"t": 180.96666666666667, "x": "「御指摘の新潟県における少女行方不明事案」。"}, {"t": 183.93333333333334, "x": "拉致という言葉ではない。"}, {"t": 185.23333333333332, "x": "行方不明という言葉だ。"}, {"t": 186.91666666666666, "x": "今の警察庁のウェブサイトでは、\nこの事件はこう書かれている。"}, {"t": 190.53333333333333, "x": "「少女拉致容疑事案」。"}, {"t": 191.93333333333334, "x": "名前が変わったのね。"}, {"t": 193.41666666666666, "x": "そうだ。そして、名前が変わるまでのあいだ、\nこの件は行方不明の一件だった。"}, {"t": 198.21666666666667, "x": "警察庁の現在の説明文を読む。"}, {"t": 200.58333333333334, "x": "「昭和五十二年十一月十五日夕刻、\n横田めぐみさん、当時十三歳が」"}, {"t": 205.46666666666667, "x": "「新潟市内においてクラブ活動を終えて\n中学校から帰宅する途中」"}, {"t": 209.45, "x": "「海岸から数百メートル離れた地点で\n友人と別れた後、消息を絶ち」"}, {"t": 213.98333333333332, "x": "「現在に至るまで行方不明となっている事案です」"}, {"t": 216.86666666666667, "x": "「警察では、関係者から事情を聴取し、\n付近の聞き込みや類似事件との比較等を行い」"}, {"t": 222.45, "x": "「さらに韓国に亡命した\n元北朝鮮工作員からの事情聴取や\n関係各機関との情報交換など」"}, {"t": 228.7, "x": "「必要な捜査を行った結果、北朝鮮に\nよる拉致容疑事案と判断しています」"}, {"t": 233.78333333333333, "x": "類似事件との比較。"}, {"t": 235.4, "x": "ああ。この「類似事件」というのが、あとで出てくる。"}, {"t": 238.63333333333333, "x": "一九七八年に、日本海側で似た失踪が続いている。"}, {"t": 242.78333333333333, "x": "一九七七年の時点では、まだ\n誰もそれを並べていない。"}, {"t": 247.46666666666667, "x": "一九七七年から一九九七年まで。"}, {"t": 251.05, "x": "私は国会会議録検索システムで実際に数えた。"}, {"t": 254.58333333333334, "x": "「横田めぐみ」を含む発言は、\n全期間で八百五十件ある。"}, {"t": 258.6333333333333, "x": "そのうち一番古いものが、一九九七年二月三日だ。"}, {"t": 262.8833333333333, "x": "八百五十件のうち、最初が一九九七年。"}, {"t": 266.5833333333333, "x": "ああ。それより前は、ゼロだ。"}, {"t": 268.46666666666664, "x": "ただし、「拉致」という言葉自体は、\nそれより前から国会に出ている。"}, {"t": 272.6333333333333, "x": "一九九〇年六月二十五日、参議院地方行政委員会。"}, {"t": 276.85, "x": "この日、ある議員が、大韓航空機事件に\n関連して、こう述べている。"}, {"t": 281.2, "x": "「金賢姫が日本語の教育を受けたという\n李恩恵、この問題について」"}, {"t": 285.23333333333335, "x": "「新聞では百四十五万枚のポスター、\nチラシが配られたということになっています」"}, {"t": 290.15, "x": "百四十五万枚？"}, {"t": 291.6, "x": "ああ。ただし、これは議員が\n「新聞ではそうなっている」と言った形だ。"}, {"t": 295.9166666666667, "x": "政府がその枚数を答弁したわけではない。\nそこは区別しておく。"}, {"t": 299.76666666666665, "x": "同じ日、警察庁の警備局長がこう答えている。"}, {"t": 302.95, "x": "「これまで家出人で不明になっている\n人たちのデータとか」"}, {"t": 306.1166666666667, "x": "「ポスター、チラシなどを配布した結果"}, {"t": 308.05, "x": "寄せられた情報、そういったものを\nずっとクリアしてまいってきておる」"}, {"t": 311.98333333333335, "x": "家出人のデータと突き合わせていたのね。"}, {"t": 314.4, "x": "そうだ。一九九〇年の時点で、警察は\n行方不明者のデータを拉致の疑いと突き合わせていた。"}, {"t": 320.53333333333336, "x": "だが、新潟の少女行方不明事案の名前は、\nまだそこに現れない。"}, {"t": 324.73333333333335, "x": "私は、ここで誰かを責めるつもりはない。"}, {"t": 327.25, "x": "当時、その二つを結びつける材料が\n公にあったかどうかを、私は知らない。"}, {"t": 332.0833333333333, "x": "分かるのは、記録に出てくる順番だけだ。"}, {"t": 334.8, "x": "順番だけ。"}, {"t": 335.8833333333333, "x": "ああ。一九九〇年に拉致の話があり、\n一九九七年にこの名前が出た。"}, {"t": 341.3666666666667, "x": "そのあいだの七年に何があったかは、\n会議録には書かれていない。"}, {"t": 345.81666666666666, "x": "二〇二五年十一月二十八日、\n参議院の拉致問題特別委員会。"}, {"t": 350.53333333333336, "x": "この年の十一月十五日に、\n担当大臣が現場を歩いている。"}, {"t": 354.5, "x": "「当時その御本人も通われていた\n中学校から、それから御自宅までの」"}, {"t": 358.85, "x": "「そして御自宅から海岸まで一緒に\n歩いていただいて、状況の説明をいただいた」"}, {"t": 363.78333333333336, "x": "家から海岸まで歩ける距離なのね。"}, {"t": 366.1, "x": "歩ける距離だ、ということがこの答弁から分かる。"}, {"t": 369.0, "x": "「その周辺というのは、学校も多い、\nいわゆる文教地区であります」"}, {"t": 372.96666666666664, "x": "「閑静な住宅街と言ってもいいかもしれません」"}, {"t": 375.76666666666665, "x": "住宅街のすぐ先が海なのね。"}, {"t": 378.01666666666665, "x": "ああ。そこから海岸まで、数百メートルだ。"}, {"t": 380.85, "x": "二〇一七年六月九日、参議院の拉致問題特別委員会。"}, {"t": 385.1666666666667, "x": "ある議員が、参考人の発言を引いてこう言っている。"}, {"t": 388.3, "x": "「日本の海岸線は約三万四千キロある、\nどこからでも入れる」"}, {"t": 392.1166666666667, "x": "「表に出ていない工作員の侵入、\n脱出は限りなくある」"}, {"t": 395.85, "x": "三万四千キロ？"}, {"t": 397.26666666666665, "x": "ああ。参考人がそう述べた、と\n議員が紹介している数字だ。"}, {"t": 400.95, "x": "警察庁の説明でも、拉致容疑事案は\n「海岸付近で発生した」という書き方が並ぶ。"}, {"t": 406.6333333333333, "x": "福井県の海岸付近。新潟県の海岸付近。"}, {"t": 409.6166666666667, "x": "鹿児島県の海岸付近。"}, {"t": 411.21666666666664, "x": "富山県の海岸付近。"}, {"t": 412.8333333333333, "x": "この事件も、そうだった。"}, {"t": 414.56666666666666, "x": "新潟県で消えたのは、この人だけではない。"}, {"t": 417.31666666666666, "x": "二〇二四年六月七日、参議院。"}, {"t": 419.78333333333336, "x": "新潟県選出の議員が名前を挙げている。"}, {"t": 422.48333333333335, "x": "政府が認定した拉致被害者が二人。"}, {"t": 424.85, "x": "拉致の可能性を排除できない行方不明者として、\nさらに六人の名前を読み上げている。"}, {"t": 430.0, "x": "新潟だけで八人。"}, {"t": 431.51666666666665, "x": "ああ。同じ県から、それだけの人がいなくなっている。"}, {"t": 434.9166666666667, "x": "一件だけ見ていても分からないのね。"}, {"t": 437.1666666666667, "x": "ああ。一件だけなら、海の近くで\n人がいなくなった、で終わる。"}, {"t": 441.76666666666665, "x": "一九九七年五月一日、\n参議院決算委員会での議員の発言を読む。"}, {"t": 446.98333333333335, "x": "「横田めぐみさんが消息を絶った\n翌年の昭和五十三年夏には」"}, {"t": 450.98333333333335, "x": "「青年男女のカップルが連続して\n行方不明になるという事件が\n相次いでいるのでございます」"}, {"t": 456.05, "x": "「七月七日には福井県小浜市で、三十一日には"}, {"t": 459.5833333333333, "x": "新潟県の柏崎市で、八月十二日には\n鹿児島県で起こっております」"}, {"t": 464.1333333333333, "x": "三件？"}, {"t": 464.93333333333334, "x": "ああ。一九七八年の七月と八月に、三件だ。"}, {"t": 469.06666666666666, "x": "そして、四件目がある。"}, {"t": 470.73333333333335, "x": "「八月十五日には富山県高岡市の海岸で\nやはり若いカップルが四人組の男に襲われて」"}, {"t": 476.48333333333335, "x": "「猿ぐつわや手錠などで縛り上げられた\n上に布袋をかぶせられて」"}, {"t": 480.28333333333336, "x": "「数十メートル離れた松林の中に\n運び込まれたけれども」"}, {"t": 483.93333333333334, "x": "「犬の鳴き声に驚いた男たちはそのまま\n逃走したという事件が起きている」"}, {"t": 488.31666666666666, "x": "この件では、現場に物が残った。"}, {"t": 490.6333333333333, "x": "一九九七年四月十八日、\n衆議院外務委員会での警察庁の答弁だ。"}, {"t": 496.0833333333333, "x": "「現場にゴム製の猿くつわ、それから\n手錠、タオル等が遺留されておりまして」"}, {"t": 500.56666666666666, "x": "「そのうちのタオルの一本が大阪府下で\n製造されたものであることが判明しております」"}, {"t": 505.43333333333334, "x": "「しかしながら、他のものは\nいずれも極めて粗悪品である」"}, {"t": 508.8833333333333, "x": "「製造場所、販売ルートとも不明ということに、\nその当時の捜査ではなっております」"}, {"t": 513.9333333333333, "x": "一本だけ分かって、あとは分からない。"}, {"t": 516.35, "x": "そうだ。それ以上は分からなかった。"}, {"t": 518.5166666666667, "x": "全部、海岸だ。全部、夕方だ。"}, {"t": 520.95, "x": "全部、若い男女の組だ。"}, {"t": 522.8833333333333, "x": "議員は、そこからこう述べている。"}, {"t": 524.8666666666667, "x": "「同一のグループあるいは同一の訓練を受けた\n者のしわざとしか思えないのであります」"}, {"t": 529.5666666666667, "x": "これは議員の見方であって、\n政府の答弁ではない。そこは分けておく。"}, {"t": 533.6166666666667, "x": "ただ、警察庁は現在、この四件をまとめて\n拉致容疑事案として整理している。"}, {"t": 539.1, "x": "一九九七年の国会で、二人の議員が\n同じ答弁を引用している。"}, {"t": 543.85, "x": "一人は一九九七年五月一日、参議院決算委員会で。"}, {"t": 548.3333333333334, "x": "もう一人は一九九七年十一月十三日、\n参議院法務委員会で。"}, {"t": 553.2666666666667, "x": "どちらも、昭和六十三年、つまり\n一九八八年三月の参議院予算委員会を引いている。"}, {"t": 559.5666666666667, "x": "九年前の答弁を持ち出したのね。"}, {"t": 561.9, "x": "ああ。そのときの国家公安委員長の言葉だ。"}, {"t": 564.7333333333333, "x": "「五十三年以来の一連のアベック行方不明事犯」"}, {"t": 567.7333333333333, "x": "「恐らくは北朝鮮による拉致の疑いが十分濃厚」"}, {"t": 570.95, "x": "「事態の重大性にかんがみ、\n今後とも真相究明のために\n全力を尽くしていかなければならない」"}, {"t": 576.6833333333333, "x": "一九八八年に、もうそう言ってたの？"}, {"t": 579.7666666666667, "x": "ああ。国会の場で、そう述べられている。"}, {"t": 582.15, "x": "一九九七年十一月十三日の質問では、\nこういう補足もある。"}, {"t": 586.95, "x": "当時の警察庁警備局長も「拉致された疑いがある」と\nはっきり述べていた、と。"}, {"t": 592.0, "x": "北朝鮮工作員が上部から日本人男性と"}, {"t": 594.65, "x": "日本人女性を連れてくるよう指示を\n受けていたことを承知している、と。"}, {"t": 598.7833333333333, "x": "一九八八年の時点で、そこまで。"}, {"t": 601.8833333333333, "x": "会議録ではそう引用されている。"}, {"t": 603.8166666666667, "x": "ただし、そこに新潟の少女行方不明事案は\n入っていない。"}, {"t": 607.3666666666667, "x": "入っているのは、一九七八年の一連の事件だ。"}, {"t": 611.25, "x": "まだ別々に扱われてたのね。"}, {"t": 613.4166666666666, "x": "そうだ。同じ「行方不明」でも、\n疑いの対象になっている\n件と、なっていない件があった。"}, {"t": 619.2166666666667, "x": "つながった理由は、日本国内で\n新しい証拠が出たからではない。"}, {"t": 623.05, "x": "国外から来た証言だった。"}, {"t": 625.0333333333333, "x": "国外から？"}, {"t": 626.0833333333334, "x": "ああ。それが次の章の話だ。"}, {"t": 628.8, "x": "一九九七年二月三日。"}, {"t": 631.05, "x": "衆議院予算委員会。"}, {"t": 632.5333333333333, "x": "「そして、ここで私は質問主意書を」"}, {"t": 634.9666666666667, "x": "「横田めぐみという一人の十三歳の少女が拉致された\nむごい事件に関して質問主意書を提出しております」"}, {"t": 641.2833333333333, "x": "これが、国会の会議録にこの名前が出てくる最初だ。"}, {"t": 644.8, "x": "質問主意書？"}, {"t": 646.0333333333333, "x": "ああ。文書で政府に質問して、\n文書で答えをもらう仕組みだ。"}, {"t": 649.85, "x": "議員は、こう続けている。"}, {"t": 651.4833333333333, "x": "「一月二十三日に提出しまして」"}, {"t": 653.95, "x": "「本来ならその回答を待ってこの予算委員会で\n御質問するのが筋でございますけれども」"}, {"t": 659.05, "x": "「政府の方から延期してくれと\n言われて、まだ回答を得ておりません」"}, {"t": 662.9, "x": "答えが返ってきてない状態で聞いたのね。"}, {"t": 665.5333333333333, "x": "そうだ。答えを待たずに、この日、名前を出している。"}, {"t": 668.7833333333333, "x": "なぜこの時期だったのか。"}, {"t": 670.1833333333333, "x": "議員自身が理由を述べている。"}, {"t": 672.0, "x": "「なぜわかったかと言えば、これが最近わかった」"}, {"t": 674.75, "x": "「北朝鮮から亡命した工作員が、\n十三歳の女の子を拉致したらしい」"}, {"t": 679.2333333333333, "x": "「その子は頭のいい子で、\nバドミントンのクラブの帰りしな」"}, {"t": 682.55, "x": "「工作員が脱出しようとするのを\n目撃したので連れて帰った」"}, {"t": 686.3333333333334, "x": "「その証言と、バドミントンの帰りに\n拉致されたという日本の新潟日報の記事が、"}, {"t": 690.9666666666667, "x": "見事に符合しているわけです」"}, {"t": 692.9833333333333, "x": "バドミントンの帰り、で一致した。"}, {"t": 695.2166666666667, "x": "ああ。二十年前の地方紙の記事と、\n亡命した人物の証言が合った。"}, {"t": 699.5833333333334, "x": "実名を出すことについて、議員はこうも言っている。"}, {"t": 702.5333333333333, "x": "「きょう、アエラ、また産経に実名が出ました」"}, {"t": 705.3833333333333, "x": "「私も相当悩みましたけれども、そういう\nマスコミに出た以上、実名を申し上げ」"}, {"t": 710.3666666666667, "x": "実名を出すかどうかを、この人は\n迷っている。それが記録に残っている。"}, {"t": 714.7166666666667, "x": "この日、名前が国会の記録に入った。"}, {"t": 717.9833333333333, "x": "では、そのとき政府は何と答えたか。"}, {"t": 720.45, "x": "同じ一九九七年二月三日、総理大臣の答弁だ。"}, {"t": 724.6333333333333, "x": "「私は、今議員が引用されました以外にも」"}, {"t": 727.45, "x": "「あるいは北朝鮮による拉致の疑いの持たれている\n事件があるのかどうかを存じませんが」"}, {"t": 732.25, "x": "「当然ながら、その疑いの持たれております\n事件に対しましては」"}, {"t": 736.1666666666666, "x": "「捜査当局において所要の捜査が厳重に\n進められていると思っております」"}, {"t": 740.6833333333333, "x": "あるのかどうかを存じません。"}, {"t": 742.4166666666666, "x": "そう答弁している。会議録の文言のままだ。"}, {"t": 745.2333333333333, "x": "続けて「関係機関におきましても、\n関連情報の収集に努めておるところ」と述べている。"}, {"t": 751.0333333333333, "x": "同じ日、外務大臣も答えている。"}, {"t": 753.3, "x": "「外務省としてもその情報の収集に\n努めてまいりたいと存じます」"}, {"t": 757.3333333333334, "x": "日本人女性である可能性が高いと警察当局が\n判断したのが「平成三年」、つまり一九九一年。"}, {"t": 764.3333333333334, "x": "「それを踏まえて、我が国といたしまして、\n日朝国交正常化交渉の場で持ち出して」"}, {"t": 769.4666666666667, "x": "「北朝鮮に対していろいろ調査方そして情報提供方を\n求めてきたところでございますが」"}, {"t": 774.9, "x": "「それが向こうの入れるところとならなくて」"}, {"t": 777.15, "x": "「結局、このことが原因となって\n正常化交渉そのものがとんざした状態になっている」"}, {"t": 782.3833333333333, "x": "交渉が止まったの？"}, {"t": 783.8166666666667, "x": "ああ。この件を持ち出したことが原因で\n止まった、と外務大臣が述べている。"}, {"t": 788.2833333333333, "x": "政府の資料にも、同じことが書かれている。"}, {"t": 790.95, "x": "「一九九一年以来、政府は、機会あるごとに\n北朝鮮に対して拉致問題を提起したが」"}, {"t": 796.9166666666666, "x": "「北朝鮮側は頑なに否定し続けた」"}, {"t": 799.7333333333333, "x": "六年間、否定され続けたのね。"}, {"t": 802.15, "x": "そうだ。そういう状態の中で、\n一九九七年二月三日の質問があった。"}, {"t": 807.35, "x": "この時点で、新潟の件はまだ\n「拉致の疑いのある事件」には入っていない。"}, {"t": 812.0666666666667, "x": "入るまでに、あと三か月かかる。"}, {"t": 814.85, "x": "一九九七年四月十八日、衆議院外務委員会。"}, {"t": 818.8833333333333, "x": "議員が、政府から返ってきた\n答弁書の中身を要約している。"}, {"t": 822.6666666666666, "x": "「横田めぐみさんの失踪が拉致か否かは\nまだ調査中で結論は出ていない」"}, {"t": 826.9166666666666, "x": "「それで、これまでに拉致されたと\n確認されるのは六組、九人であること」"}, {"t": 831.4166666666666, "x": "六組九人。"}, {"t": 832.5833333333334, "x": "ああ。その時点の政府の数字だ。\nこの件は入っていない。"}, {"t": 836.05, "x": "同じ日、警察庁の担当者がこう答弁している。"}, {"t": 839.2, "x": "「現在までのところ、同人が拉致されたか\n否かについては確認されておりませんが」"}, {"t": 844.0, "x": "「いずれにせよ、本件につきましては、\n拉致の可能性ということも\n含めまして、所要の捜査をしておる」"}, {"t": 850.0, "x": "「先生御指摘の、いわゆる拉致の疑いのある六件、"}, {"t": 852.9666666666667, "x": "九名という観点とは若干異なった\n今の状況ではございます」"}, {"t": 856.9666666666667, "x": "まだ別枠なのね。"}, {"t": 858.3833333333333, "x": "それが変わるのが、一九九七年五月一日だ。"}, {"t": 862.1, "x": "参議院決算委員会。警察庁警備局長の答弁を読む。"}, {"t": 865.85, "x": "「北朝鮮による拉致の疑いのある事件は、従来、\n六件九人と判断していたところでございますが」"}, {"t": 871.95, "x": "「これまでの捜査を総合的に検討した結果」"}, {"t": 874.7833333333333, "x": "「御指摘の新潟県における少女行方不明事案も\n拉致の疑いがあると判断し」"}, {"t": 879.45, "x": "「全体で七件十人と判断するに\n至ったところでございます」"}, {"t": 883.3, "x": "六件九人が、七件十人になった。"}, {"t": 886.0833333333334, "x": "ああ。増えた一件が、この事件だ。"}, {"t": 888.3833333333333, "x": "同じ日、国家公安委員長がこう補っている。"}, {"t": 891.2666666666667, "x": "「今まではその辺については"}, {"t": 892.5833333333334, "x": "必ずしも北朝鮮による拉致の疑いがあるという\n断定はできなかったわけでございますが」"}, {"t": 897.9, "x": "「そういう疑いが濃厚であるということで」\n「七件、十人」とした、と。"}, {"t": 902.1833333333333, "x": "外務大臣も、同じ日にこう述べている。"}, {"t": 904.7, "x": "「従来必ずしも北朝鮮による誘拐というふうには\n考えていなかった本件につきましても」"}, {"t": 910.1333333333333, "x": "「その疑惑が非常に濃厚であるということが\n現在までの時点で出てまいりましたので」"}, {"t": 914.8, "x": "「政府としてもこれを従来の六件に\n加え疑惑案件に入れた」"}, {"t": 918.4, "x": "失踪から十九年半。国会に名前が出てから三か月。"}, {"t": 922.0833333333334, "x": "この日、扱いが変わった。"}, {"t": 924.5166666666667, "x": "ここから、言葉を三つに分ける。"}, {"t": 926.6, "x": "一つ目。政府が認定した拉致被害者。"}, {"t": 929.3, "x": "二つ目。拉致の可能性を排除できない行方不明者。"}, {"t": 932.6333333333333, "x": "三つ目。特定失踪者。"}, {"t": 934.6333333333333, "x": "全部違うの？"}, {"t": 935.7833333333333, "x": "ああ。全部違う。順番に言う。"}, {"t": 937.85, "x": "政府の拉致問題対策本部は、こう書いている。"}, {"t": 940.7833333333333, "x": "「日本政府は、これまでに、"}, {"t": 942.3333333333334, "x": "帰国した五名を含む十七名を北朝鮮当局に\nよる拉致被害者として認定している」"}, {"t": 947.65, "x": "件数でいうと「これまでに十二件十七名」だ。"}, {"t": 950.7333333333333, "x": "これとは別に、警察庁が公表している数字がある。"}, {"t": 953.95, "x": "「これまでに十三件発生しており、これらの事案に\nおいて北朝鮮に拉致された被害者は、"}, {"t": 958.9666666666667, "x": "十九人に上っています」"}, {"t": 960.8833333333333, "x": "十三件で十九人。"}, {"t": 962.4833333333333, "x": "ああ。警察が拉致容疑事案と判断した件数だ。"}, {"t": 965.4833333333333, "x": "政府が認定した十二件十七名とは、数え方が違う。"}, {"t": 969.3, "x": "北朝鮮当局によって拉致された\n被害者等の支援に関する法律。"}, {"t": 973.5166666666667, "x": "その第二条にこう書いてある。"}, {"t": 975.2666666666667, "x": "「被害者　北朝鮮当局によって拉致された\n日本国民として内閣総理大臣が認定した者をいう」"}, {"t": 981.5833333333334, "x": "総理大臣が認定した人、なのね。"}, {"t": 984.2, "x": "そうだ。認定という行為があって、\nはじめて「被害者」になる。"}, {"t": 988.2166666666667, "x": "認定の基準について、二〇\n一七年六月九日の参議院で大臣が答えている。"}, {"t": 993.45, "x": "「関係省庁・機関による捜査、調査の結果を基に」"}, {"t": 996.9666666666667, "x": "「北朝鮮当局によって実行された\n拉致行為の有無、これを判断基準として行う」"}, {"t": 1002.0, "x": "この数字は、時期によって動いている。"}, {"t": 1004.3166666666667, "x": "一九九七年四月は六組九人。"}, {"t": 1007.0666666666667, "x": "同年五月に七件十人。"}, {"t": 1008.9666666666667, "x": "二〇〇六年一月の答弁では十一件十六人。"}, {"t": 1012.1, "x": "二〇一二年八月の答弁で十二件十七名。"}, {"t": 1015.2666666666667, "x": "そこから今日まで、十七人のまま動いていない。"}, {"t": 1018.3166666666667, "x": "二〇一二年から増えていないのね。"}, {"t": 1020.5333333333333, "x": "正確に言うと、最後に認定されたのは\n二〇〇六年十一月だ。"}, {"t": 1024.5666666666666, "x": "二〇〇五年四月に一人、二〇〇六年十一月に\n一人。それが最後になっている。"}, {"t": 1030.2666666666667, "x": "二つ目の言葉に行く。"}, {"t": 1031.75, "x": "「北朝鮮による拉致の可能性を\n排除できない行方不明者」。"}, {"t": 1035.3833333333334, "x": "長いわね。"}, {"t": 1036.3333333333333, "x": "ああ。だが、この長さに意味がある。"}, {"t": 1038.4833333333333, "x": "政府の説明を読む。"}, {"t": 1039.8666666666666, "x": "「政府は、支援法第二条の"}, {"t": 1041.6333333333334, "x": "規定により北朝鮮当局によって拉致された\n日本国民として認定された人以外にも」"}, {"t": 1046.8666666666666, "x": "「北朝鮮によって拉致された可能性を\n排除できない人が存在しているとの認識の下」"}, {"t": 1052.0833333333333, "x": "「国内外からの情報収集や関連する\n捜査・調査を強力に推し進めるなど、\n全力で真相究明に努めている」"}, {"t": 1059.2166666666667, "x": "「その結果、北朝鮮当局による\n拉致行為があったと確認された場合には」"}, {"t": 1063.7833333333333, "x": "「速やかに、支援法に定める\n被害者として認定することとしている」"}, {"t": 1068.05, "x": "確認できたら認定する、ということね。"}, {"t": 1070.7333333333333, "x": "そうだ。確認できるまでは、この長い名前で呼ばれる。"}, {"t": 1074.0166666666667, "x": "警察庁は、この人数を公表している。"}, {"t": 1076.5833333333333, "x": "「北朝鮮による拉致の可能性を\n排除できない行方不明者八百六十九人」。"}, {"t": 1081.35, "x": "八百六十九人？"}, {"t": 1082.9333333333334, "x": "ああ。八百六十九人だ。"}, {"t": 1084.9166666666667, "x": "そのうち「都道府県警察のウェブサイトに\n家族等の同意を得て掲載されている\n方々」が四百四十七人。"}, {"t": 1091.5666666666666, "x": "残りは、ご家族の同意がないので公表されていない。"}, {"t": 1094.65, "x": "この数字は、時期によって違う。"}, {"t": 1096.75, "x": "二〇一四年の国会では八百六十人、\n二〇一七年では八百八十三名。"}, {"t": 1101.9833333333333, "x": "二〇二一年では八百七十五名、\n二〇二四年では八百七十一名。"}, {"t": 1107.0333333333333, "x": "そして現在、警察庁のページでは八百六十九人だ。"}, {"t": 1110.8833333333334, "x": "増えたり減ったりしてるのね。"}, {"t": 1112.7, "x": "ああ。ただ、なぜ動いたのかを説明した\n答弁は、私が読んだ範囲では見つからなかった。"}, {"t": 1118.15, "x": "二〇二一年六月十一日、衆議院。"}, {"t": 1120.9333333333334, "x": "国家公安委員長の答弁だ。"}, {"t": 1122.9, "x": "「拉致の可能性を含め、事件、\n事故等あらゆる可能性を念頭に、\n捜査、調査を継続している」"}, {"t": 1128.8666666666666, "x": "拉致とは決めていない。"}, {"t": 1130.0333333333333, "x": "事件も事故も、全部の可能性を残したまま調べている。"}, {"t": 1133.6333333333334, "x": "政府は二〇一三年三月に、\n警察庁の外事課に「特別指導班」を置いた。"}, {"t": 1138.7833333333333, "x": "海難事案として処理されたものについても、\n警察と海上保安庁が連携して調べている。"}, {"t": 1144.8166666666666, "x": "三つ目の言葉が「特定失踪者」だ。"}, {"t": 1147.5333333333333, "x": "これは、政府の言葉ではない。"}, {"t": 1149.55, "x": "政府の言葉じゃないの？"}, {"t": 1151.1166666666666, "x": "ああ。政府自身がそう書いている。"}, {"t": 1153.1333333333334, "x": "拉致問題対策本部のページに、こういう注がある。"}, {"t": 1156.2, "x": "「特定失踪者とは、民間団体である\n特定失踪者問題調査会が」"}, {"t": 1160.7333333333333, "x": "「北朝鮮による拉致かもしれない、という\n御家族の届出等を受けて」"}, {"t": 1164.7333333333333, "x": "「独自に調査の対象としている失踪者のこと」"}, {"t": 1167.75, "x": "政府が決めた区分じゃないのね。"}, {"t": 1169.75, "x": "そうだ。だから、政府認定の十七人とは\n全く別の話になる。"}, {"t": 1174.1166666666666, "x": "ただし、政府もこの言葉を使って\n北朝鮮に情報提供を求めてきた。"}, {"t": 1178.65, "x": "「いわゆる特定失踪者も"}, {"t": 1180.3666666666666, "x": "含め北朝鮮による拉致の可能性を排除できない\n事案に係る関連情報の提供についても"}, {"t": 1185.25, "x": "繰り返し要求してきている」"}, {"t": 1187.0333333333333, "x": "二〇〇四年十一月の協議では、五名の氏名を\n示して情報の提供を求めている。"}, {"t": 1192.0166666666667, "x": "その回答は「当該五名について入境は\n確認できなかった」というものだった。"}, {"t": 1196.9166666666667, "x": "来ていない、と言われたのね。"}, {"t": 1198.7333333333333, "x": "そう回答があった、と政府は記録している。"}, {"t": 1201.4, "x": "二〇二二年六月八日、参議院の拉致問題特別委員会。"}, {"t": 1205.5166666666667, "x": "特定失踪者家族会の参考人が、\n妹について話している。"}, {"t": 1209.65, "x": "「私の妹は、今から\n四十九年前の一九七三年七月七日に、十八歳のとき」"}, {"t": 1215.9666666666667, "x": "「千葉県市原市の家族の前から姿を消しました」"}, {"t": 1219.2, "x": "「一九九七年三月、横田めぐみさんの北朝鮮に\nよる拉致情報をテレビ番組で見た母が」"}, {"t": 1225.4666666666667, "x": "「もしかしたらうちの娘も拉致をされたのではないかと\n写真を一枚添えた手紙をテレビ局に送りました」"}, {"t": 1231.4, "x": "一九九七年に、他の家族も動き出したのね。"}, {"t": 1235.25, "x": "ああ。一つの名前が出たことで、\n二十四年前の失踪を、もう一度見直した家族がいた。"}, {"t": 1240.6333333333334, "x": "この参考人は、二〇〇五年に、拉致認定を\n求める行政訴訟を起こしている。"}, {"t": 1245.35, "x": "二年後、政府側が法廷で声明文を\n読み上げ、訴訟を取り下げた。"}, {"t": 1249.5, "x": "その理由を、こう述べている。"}, {"t": 1251.2, "x": "「認定という名を取るよりも、救出という\n実を取りたいと思ったからです」"}, {"t": 1256.0166666666667, "x": "二〇〇二年九月十七日。"}, {"t": 1257.7666666666667, "x": "第一回の日朝首脳会談が行われた。"}, {"t": 1260.5333333333333, "x": "政府の資料には、こう書かれている。"}, {"t": 1262.6666666666667, "x": "「北朝鮮は、二〇〇\n二年九月の第一回日朝首脳会談において」"}, {"t": 1266.9333333333334, "x": "「ようやく初めて拉致を認め、\n謝罪し、再発防止を約束した」"}, {"t": 1271.2, "x": "一九九一年からずっと否定してたのに。"}, {"t": 1274.4, "x": "ああ。十一年間否定していたものを、\nこの日に認めている。"}, {"t": 1278.0666666666666, "x": "そのとき、北朝鮮側が伝えてきた内容がある。"}, {"t": 1281.2166666666667, "x": "「当時日本政府が北朝鮮による\n拉致の疑いがあるとしていた十三名のうち」"}, {"t": 1285.75, "x": "「四名は生存、八名は死亡、一名は\n北朝鮮入境が確認できない旨伝えた」"}, {"t": 1291.05, "x": "この八名の中に、横田めぐみさんの名前が入っている。"}, {"t": 1294.4166666666667, "x": "……。"}, {"t": 1295.35, "x": "ここで、はっきり言っておく。"}, {"t": 1297.05, "x": "これは、北朝鮮側が「そう伝えた」という記録だ。"}, {"t": 1300.5666666666666, "x": "日本政府は、それを事実として受け入れていない。"}, {"t": 1303.4666666666667, "x": "同じ資料に、日本政府の立場がこう書いてある。"}, {"t": 1306.4333333333334, "x": "「北朝鮮側から納得のいく\n説明や証拠の提示がない以上」"}, {"t": 1310.1833333333334, "x": "「安否不明の拉致被害者は全て\n生存しているとの前提に立ち」"}, {"t": 1313.9, "x": "「引き続き、拉致被害者としての認定の有無に\nかかわらず」"}, {"t": 1317.4333333333334, "x": "「全ての拉致被害者の安全確保及び即時帰国のために\n全力を尽くす」"}, {"t": 1322.05, "x": "全員生きている前提なのね。"}, {"t": 1324.0, "x": "ああ。それが日本政府の立場だ。だから\n私も、その形で話す。"}, {"t": 1328.4166666666667, "x": "二〇〇二年九月二十八日から十月一日にかけて、\n政府が事実調査チームを送っている。"}, {"t": 1334.1333333333334, "x": "「北朝鮮提供の情報がそもそも限られていた上、"}, {"t": 1337.15, "x": "内容的にも一貫性に欠け、\n疑わしい点が多々含まれていた」"}, {"t": 1341.2833333333333, "x": "同じ年の十月、クアラルンプールでの交渉で、\n政府は百五十項目にわたる疑問点を指摘した。"}, {"t": 1347.3833333333334, "x": "それに対して「北朝鮮側からの\nまとまった回答はなかった」。"}, {"t": 1351.2333333333333, "x": "そして、二〇〇二年十月十五日。"}, {"t": 1353.65, "x": "五人の拉致被害者が帰国した。"}, {"t": 1355.6, "x": "二十四年ぶりだった。"}, {"t": 1357.1833333333334, "x": "二十四年。"}, {"t": 1358.15, "x": "ああ。この五人が、いまのところ最後の帰国だ。"}, {"t": 1361.7333333333333, "x": "二〇〇四年十一月九日から十四日。"}, {"t": 1364.2666666666667, "x": "第三回の日朝実務者協議が平壌で開かれた。"}, {"t": 1367.65, "x": "政府の資料には、こう書いてある。"}, {"t": 1369.65, "x": "「第三回協議は五十時間余りに及び」"}, {"t": 1372.1333333333334, "x": "「北朝鮮側の調査委員会との質疑応答の他、\n合計十六名の証人からの直接の聴取」"}, {"t": 1378.15, "x": "「横田めぐみさんの遺骨とされるもの等の\n物的証拠の収集が行われた」"}, {"t": 1382.6, "x": "二〇二五年十二月五日、衆議院の\n拉致問題特別委員会での官房長官の答弁を読む。"}, {"t": 1388.5333333333333, "x": "「新潟県警が委嘱して行った\nＤＮＡ型鑑定については」"}, {"t": 1392.1166666666666, "x": "「ＤＮＡ型を検出できる可能性のある\n骨片十個を慎重に選定し」"}, {"t": 1396.45, "x": "「帝京大学及び警察庁の科学警察研究所に\nおいてそれぞれ五個ずつＤＮＡ型鑑定を行い」"}, {"t": 1402.4833333333333, "x": "「その結果、科学警察研究所では\nＤＮＡ型検出には至らなかったけれども」"}, {"t": 1407.5833333333333, "x": "「帝京大学では骨片五個中四個から\n同一のＤＮＡ型が、また、他の一個から\n別のＤＮＡ型が検出されて」"}, {"t": 1414.9333333333334, "x": "「いずれのＤＮＡ型も横田めぐみさんのＤＮＡ型とは\n異なっているとの鑑定結果を得た」"}, {"t": 1420.3166666666666, "x": "別の人のＤＮＡが出たということ？"}, {"t": 1422.7666666666667, "x": "本人のものとは違うＤＮＡ型が\n検出された、という鑑定結果だ。"}, {"t": 1427.1833333333334, "x": "政府の資料の言い方はこうだ。"}, {"t": 1429.0333333333333, "x": "「めぐみさんのものとは異なるＤＮＡが\n検出されたとの鑑定結果を得た」"}, {"t": 1433.4, "x": "「日本政府は、これらの点を\n北朝鮮側に申し入れ、強く抗議した」"}, {"t": 1437.6833333333334, "x": "この表現をめぐって、国会で議論がある。"}, {"t": 1440.2833333333333, "x": "同じ二〇二五年十二月五日、ある議員が\nこう質している。"}, {"t": 1444.1166666666666, "x": "当時の官房長官が「\n横田めぐみさんのものではないという\n結論が出ました」と断言したが、"}, {"t": 1449.75, "x": "「本来であれば、正しくは、"}, {"t": 1451.3666666666666, "x": "本件については横田めぐみさんのものであるという\n結論は出なかったと表現すべきであった」"}, {"t": 1456.7333333333333, "x": "言い方が違うのね。"}, {"t": 1458.1833333333334, "x": "ああ。「違う人のものだ」と\n「本人のものだとは言えない」は、意味が違う。"}, {"t": 1462.7333333333333, "x": "これは議員の見方だ。"}, {"t": 1463.9833333333333, "x": "政府側は、先ほどの鑑定結果を\n説明するにとどめている。"}, {"t": 1467.85, "x": "なお、別の方の遺骨とされたものについては、\n政府はこう書いている。"}, {"t": 1471.95, "x": "「法医学的鑑定の結果、\n別人のものであることが確認された」"}, {"t": 1476.1, "x": "そして、この協議全体について、政府の結論はこうだ。"}, {"t": 1479.75, "x": "「八名は死亡、二名は\n入境確認せず、との北朝鮮側の説明を\n裏付けるものはなかった」"}, {"t": 1486.1166666666666, "x": "二〇一四年五月。ストックホルムで\n日朝の政府間協議が開かれた。"}, {"t": 1490.5333333333333, "x": "政府の資料を読む。"}, {"t": 1491.7666666666667, "x": "「北朝鮮側は、拉致被害者を含む全ての日本人に\n関する包括的かつ全面的な調査の実施を約束した」"}, {"t": 1498.8666666666666, "x": "これがストックホルム合意と呼ばれているものだ。"}, {"t": 1501.5833333333333, "x": "全ての日本人、というのはどこまで？"}, {"t": 1504.1333333333334, "x": "それが、当時の国会で問われている。"}, {"t": 1506.4, "x": "二〇一四年六月十七日、\n衆議院の拉致問題特別委員会。"}, {"t": 1510.6, "x": "外務省の局長の答弁だ。"}, {"t": 1512.5333333333333, "x": "「今回の合意文書にございます、\n拉致被害者及び行方不明者、というときの\n行方不明者の中に」"}, {"t": 1518.3166666666666, "x": "「これまで日本側が協議の中で\n提起してきておりますような」"}, {"t": 1521.7833333333333, "x": "「特定失踪者等の拉致の疑いのある\n方々が含まれているということは」"}, {"t": 1526.05, "x": "「当然、北朝鮮も認識をしているという\nふうに思っております」"}, {"t": 1529.8166666666666, "x": "同じ日、外務副大臣は\n全面解決の中身をこう説明している。"}, {"t": 1534.05, "x": "「全員の帰国、事件の全容の解明、\nそして実行犯の引き渡し」"}, {"t": 1538.4666666666667, "x": "「北朝鮮が実際に拉致した人間全員の帰国を果たす、\nこういうことが最終的な目標でございます」"}, {"t": 1544.8166666666666, "x": "それで、調査はどうなったの？"}, {"t": 1546.7333333333333, "x": "二〇一四年十月、平壌で\n特別調査委員会との協議が行われている。"}, {"t": 1551.45, "x": "日本側は「調査を迅速に行い、その結果を\n一刻も早く通報するよう」求めた。"}, {"t": 1556.95, "x": "政府の資料を読む。"}, {"t": 1558.1666666666667, "x": "「北朝鮮による二〇\n一六年一月の核実験及び二月の人工衛星と\n称する弾道ミサイル発射等を受け」"}, {"t": 1564.8333333333333, "x": "「同月に日本が独自の対北朝鮮措置の実施を\n発表したことに対し」"}, {"t": 1569.3333333333333, "x": "「北朝鮮は拉致被害者を含む全ての日本人に\n関する包括的調査の全面中止及び」"}, {"t": 1574.8666666666666, "x": "「特別調査委員会の解体を一方的に宣言した」"}, {"t": 1578.1666666666667, "x": "これに対して、日本政府はこうしている。"}, {"t": 1580.6833333333334, "x": "「日本は北朝鮮に対し厳重に抗議し、\nストックホルム合意を破棄する考えはないこと」"}, {"t": 1585.9, "x": "「北朝鮮が同合意に基づき、一日も早く\n全ての拉致被害者を帰国させるべきことについて、"}, {"t": 1591.5833333333333, "x": "強く要求した」"}, {"t": 1592.85, "x": "合意は生きている、というのが日本政府の立場だ。"}, {"t": 1595.8, "x": "二〇一四年に始まった調査は、\n報告されないまま止まっている。"}, {"t": 1600.3666666666666, "x": "政府の資料には、こう書かれている。"}, {"t": 1602.5166666666667, "x": "「日本国内では、一九九七年に\n拉致被害者の御家族により」"}, {"t": 1606.95, "x": "「北朝鮮による拉致被害者家族連絡会、\n家族会が結成されるなど」"}, {"t": 1611.4333333333334, "x": "「被害者の救出を求める運動が活発に展開され」"}, {"t": 1614.8166666666666, "x": "「二〇二六年一月末現在で千九百三十万筆を\n超える署名が総理大臣に提出されている」"}, {"t": 1621.1833333333334, "x": "千九百三十万筆？"}, {"t": 1623.0333333333333, "x": "ああ。二十九年かけて、それだけ集まっている。"}, {"t": 1626.0833333333333, "x": "二〇二一年六月十一日、\n衆議院。ある議員がこう述べている。"}, {"t": 1630.35, "x": "「当初は、横田滋さんが娘は北朝鮮に\nさらわれたと言って街頭でビラをまくと」"}, {"t": 1635.3833333333334, "x": "「それを道行く人にはたき落とされるような\n映像を私は見ました」"}, {"t": 1639.1166666666666, "x": "「最初は、それこそ何をおかしなことを\n言っているのかぐらいに思われた」"}, {"t": 1643.2, "x": "はたき落とされた。"}, {"t": 1644.5, "x": "そう述べられている。"}, {"t": 1645.65, "x": "「ところが、それが二代にわたる政権の最重要課題と\n言われるまでになったわけでございます」"}, {"t": 1650.8833333333334, "x": "同じ二〇二一年六月十一日の冒頭に、\nこういう記録がある。委員長の発言だ。"}, {"t": 1656.4166666666667, "x": "「昨年六月、横田滋さんがお亡くなりになりました」"}, {"t": 1659.9666666666667, "x": "「横田めぐみさんが北朝鮮に拉致されてから\n既に四十三年が経過しており」"}, {"t": 1664.6, "x": "「横田滋さんが御存命の間に\nめぐみさんの御帰国が果たせなかったことは、\n誠に痛恨の極みであります」"}, {"t": 1671.0833333333333, "x": "そして、この日、委員会は黙祷をしている。"}, {"t": 1673.8833333333334, "x": "同じ日、政府側の説明にこういう一節がある。"}, {"t": 1676.9166666666667, "x": "「横田滋さんの一周忌の御命日でありました\n今月五日に」"}, {"t": 1680.7166666666667, "x": "「めぐみさんが通われていた\n新潟県の寄居中学校で行われました」"}, {"t": 1684.7833333333333, "x": "「横田めぐみさんとの再会を誓う同級生の会に\nよる、翼をください、の合唱に」"}, {"t": 1689.8666666666666, "x": "「加藤大臣もオンラインで参加いたしました」"}, {"t": 1692.5, "x": "同級生の会があるの？"}, {"t": 1694.15, "x": "ああ。同じ中学にいた人たちが、\nいまも集まって歌っている。"}, {"t": 1697.9666666666667, "x": "二〇二四年六月七日、参議院。"}, {"t": 1700.4333333333334, "x": "弟にあたる方が参考人として述べている。"}, {"t": 1703.2666666666667, "x": "「私の姉、横田めぐみは、昭和五十二年、\n西暦で言えば一九七七年になりますけれども」"}, {"t": 1709.65, "x": "「十一月十五日に新潟で突如姿を消しました」"}, {"t": 1713.05, "x": "「姉は当時中学一年生の子供ですけれども、現在は\nもう既に五十九歳、間もなく還暦になります」"}, {"t": 1720.0833333333333, "x": "なぜ解決しないのか。ここからは、\n記録から見える壁を二つ挙げる。"}, {"t": 1724.2666666666667, "x": "一つ目は、相手が国家だということだ。"}, {"t": 1726.7833333333333, "x": "普通の失踪事件なら、日本の警察が\n捜査をして、証拠を集めて、事件にする。"}, {"t": 1732.0833333333333, "x": "この件は、それができない。"}, {"t": 1733.9833333333333, "x": "日本の中に証拠がないから？"}, {"t": 1735.9833333333333, "x": "それもある。だが、もっと具体的な\n言葉が国会に残っている。"}, {"t": 1739.9166666666667, "x": "二〇二四年六月七日、参議院。"}, {"t": 1742.3833333333334, "x": "特定失踪者家族会の参考人の発言だ。"}, {"t": 1745.5, "x": "「向こうは人をさらっていくのが\nプロですから、証拠を残すわけがない」"}, {"t": 1749.35, "x": "「日本の警察が何かありませんかと\n私たちに聞くくらいですから、\n日本で証拠がつかめるわけがない」"}, {"t": 1755.3166666666666, "x": "警察が家族に聞くのね。"}, {"t": 1757.2, "x": "そういうことが起きている、\nとこの参考人は述べている。"}, {"t": 1760.3333333333333, "x": "二〇一七年六月九日の参議院でも、\n同じ趣旨の請願書が引かれている。"}, {"t": 1765.2833333333333, "x": "「何十年もたった今では\n拉致の証拠探しは全く困難です」"}, {"t": 1769.0333333333333, "x": "「証拠主義にとらわれず拉致の疑いが認められるものは\n被害者に認定してくれるよう御支援ください」"}, {"t": 1774.5166666666667, "x": "これに対して、政府側の答えは一貫している。"}, {"t": 1777.5, "x": "確認できるまでは、認定はしない。"}, {"t": 1779.8, "x": "二〇一七年の答弁には、その理由も述べられている。"}, {"t": 1783.15, "x": "「先方と議論するときにもやはりしっかりとした\n基準で対応していくという必要性も"}, {"t": 1787.9166666666667, "x": "別途あるわけでありますので」"}, {"t": 1789.5166666666667, "x": "基準を緩めると、交渉で不利になるということね。"}, {"t": 1792.65, "x": "そういう趣旨のことを、大臣が述べている。"}, {"t": 1795.1166666666666, "x": "もう一つ、政府の資料にはこう書かれている。"}, {"t": 1797.8166666666666, "x": "「北朝鮮工作員等拉致に関与した十人について、\n逮捕状の発付を得て国際手配を行っている」"}, {"t": 1803.9, "x": "だが、身柄は日本に来ていない。"}, {"t": 1805.95, "x": "二〇〇六年二月の協議で、日本側は\n被疑者の引渡しを求めている。"}, {"t": 1810.3666666666666, "x": "政府の記録では「北朝鮮側は…\n被疑者の引渡しは拒否した」となっている。"}, {"t": 1815.4666666666667, "x": "手配はしても、届かないのね。"}, {"t": 1817.6, "x": "ああ。そこが、国内の事件と決定的に違う。"}, {"t": 1821.4166666666667, "x": "二つ目の壁は、時間だ。"}, {"t": 1823.3, "x": "二〇二四年四月八日、衆議院。ある議員の発言だ。"}, {"t": 1827.05, "x": "「拉致のいずれの事案も発生から\n既に四十年以上が経過し」"}, {"t": 1830.65, "x": "「被害者御本人も高齢化し、平均年齢は\n七十五歳に迫っているという現状です」"}, {"t": 1835.8333333333333, "x": "同じ日、家族会代表の言葉が引用されている。"}, {"t": 1838.9666666666667, "x": "「拉致された自分の家族や\nきょうだいとの再会を果たせず\n他界された親世代が何人もいます」"}, {"t": 1844.15, "x": "「家族会が結成された当時、最前線で\n声を上げていた親世代で存命なのは」"}, {"t": 1848.95, "x": "「有本恵子さんの父親、明弘さんと、めぐみの母、\n早紀江の二人だけとなり、厳しい状況です」"}, {"t": 1855.2333333333333, "x": "「残された時間がないのです」"}, {"t": 1857.0333333333333, "x": "二〇二五年十一月二十八日、参議院。"}, {"t": 1860.0333333333333, "x": "官房長官がこう述べている。"}, {"t": 1861.8666666666666, "x": "「親の世代というのは、もう横田めぐみさんの\nお母様の横田早紀江さんのみとなってしまいました」"}, {"t": 1867.4, "x": "一人になったのね。"}, {"t": 1868.8, "x": "家族会が結成された当時から声を上げてきた\n親の世代は、そうなったと述べられている。"}, {"t": 1873.9666666666667, "x": "同じ日、ある議員が、電話で\n聞いた言葉を紹介している。"}, {"t": 1877.4833333333333, "x": "「拉致から二十年経過した一九九七年に、\n公に拉致が北朝鮮の仕業だと分かったら」"}, {"t": 1883.55, "x": "「これですぐに日本国政府が助けてくれると思った」"}, {"t": 1886.6833333333334, "x": "「国内であれば警察がもっと動いてくれるのに\nどうしてという思いを抱いた」"}, {"t": 1890.8, "x": "「政府にはどのような計画があって、"}, {"t": 1892.7166666666667, "x": "どう実行しているのか、伝えられる\n範囲で自分だけでも教えてくれないか」"}, {"t": 1897.0, "x": "「そうすれば、やっぱり国は\n動いていただいているんだと、\nほんの少しは気が休まる」"}, {"t": 1901.8166666666666, "x": "計画を教えてほしい、なのね。"}, {"t": 1903.9, "x": "ああ。返してくれ、ではなく、いま\n何をしているのかを教えてくれ、という言い方だ。"}, {"t": 1908.6666666666667, "x": "二〇二五年十二月五日、衆議院。ある議員の発言だ。"}, {"t": 1912.6166666666666, "x": "「今の若い人たちにとっては、横田めぐみって\n誰という、そういう世代が出てきている」"}, {"t": 1917.6, "x": "二〇二二年六月八日の参考人も、\n同じことを述べている。"}, {"t": 1921.6, "x": "二〇〇二年当時に二十歳以下だった\n人たち、つまり現在四十歳までの人たちは、"}, {"t": 1926.7166666666667, "x": "「その方たちが拉致ということを\n覚えていないんですよ、知らないんですよ」"}, {"t": 1931.2666666666667, "x": "この事件は、いまも情報提供を受け付けている。"}, {"t": 1934.1666666666667, "x": "警察庁のウェブサイトに、そう書いてある。"}, {"t": 1936.65, "x": "「これらの事案につき、情報をお持ちの方は」"}, {"t": 1939.3166666666666, "x": "「警察庁または関係都道府県警察本部まで\nEメール又は電話でお知らせください」"}, {"t": 1944.4, "x": "いまも受け付けてるの？"}, {"t": 1945.8833333333334, "x": "ああ。ページに電話番号と\nメールアドレスが載っている。"}, {"t": 1948.8166666666666, "x": "警察庁は、〇三、三五八一、〇一四一。"}, {"t": 1952.2166666666667, "x": "内線が五八一三だ。"}, {"t": 1953.9166666666667, "x": "メールアドレスも公開されている。"}, {"t": 1955.7833333333333, "x": "この回の現場である新潟県警察本部は、〇\n二五、二八五、〇一一〇。内線五八四一。"}, {"t": 1962.2166666666667, "x": "ほかに、警視庁、埼玉県警察本部、\n福井県警察本部が載っている。"}, {"t": 1967.1166666666666, "x": "兵庫県警察本部、鳥取県警察本部、\n鹿児島県警察本部も載っている。"}, {"t": 1972.3833333333334, "x": "どれも拉致容疑事案があった県ね。"}, {"t": 1974.5666666666666, "x": "そうだ。事案が起きた場所の県警が並んでいる。"}, {"t": 1977.4833333333333, "x": "もう一つ、見られるページがある。"}, {"t": 1979.45, "x": "警察庁の「拉致の可能性を排除できない\n事案に係る方々」というページだ。"}, {"t": 1984.3333333333333, "x": "さっき言った八百六十九人のうち、\n四百四十七人の名前が出ている。"}, {"t": 1989.0, "x": "ご家族の同意を得て掲載されている方々だ。"}, {"t": 1991.7666666666667, "x": "都道府県別に並んでいて、\n名前と、いなくなった当時の年齢が書いてある。"}, {"t": 1996.4333333333334, "x": "当時の年齢？"}, {"t": 1997.5833333333333, "x": "ああ。三歳。六歳。十四歳。"}, {"t": 1999.8166666666666, "x": "十六歳。そういう数字が並んでいる。"}, {"t": 2002.2666666666667, "x": "北海道の欄だけで、四十九人いる。"}, {"t": 2004.8666666666666, "x": "私は、この動画で個別のお名前は読み上げない。"}, {"t": 2007.8166666666666, "x": "だが、ページは誰でも開ける。"}, {"t": 2009.6333333333334, "x": "政府の拉致問題対策本部のサイトも、誰でも開ける。"}, {"t": 2013.0666666666666, "x": "そこに、この問題の経緯が、\n日付つきで全部書いてある。"}, {"t": 2016.6833333333334, "x": "もし何か心当たりがあるなら、警察庁か、\nお住まいの県の警察本部に連絡してほしい。"}, {"t": 2022.2833333333333, "x": "それが、この回で私が言いたい実際的なことだ。"}, {"t": 2026.1, "x": "最後に、この回で確かめたことを並べておく。"}, {"t": 2029.0, "x": "一九七七年十一月十五日の夕方、\n十三歳の中学一年生が、学校からの帰りに消えた。"}, {"t": 2036.0, "x": "友達と別れたのは、学校から約二百メートル、\n海岸から数百メートルの十字路だった。"}, {"t": 2041.6, "x": "その夜、警察犬と機動隊と海上保安部が出た。"}, {"t": 2044.7833333333333, "x": "見つからなかった。"}, {"t": 2046.0333333333333, "x": "この名前が国会の記録に出てくるのは、\n二十年後の一九九七年二月三日だ。"}, {"t": 2051.633333333333, "x": "三か月後の五月一日、拉致の疑いのある\n事件は、六件九人から七件十人になった。"}, {"t": 2057.5333333333333, "x": "二〇〇二年十月十五日に五人が帰国した。\nそれ以降、帰国は実現していない。"}, {"t": 2062.6833333333334, "x": "政府が認定した拉致被害者は、十二件十七名。"}, {"t": 2065.866666666667, "x": "最後の認定は二〇〇六年十一月だ。"}, {"t": 2068.5333333333333, "x": "拉致の可能性を排除できない\n行方不明者は、八百六十九人。"}, {"t": 2072.5666666666666, "x": "北朝鮮側が「死亡している」と伝えた\n八名の中に、この人の名前がある。"}, {"t": 2077.5833333333335, "x": "だが日本政府は、その説明を\n裏付けるものはなかったとしている。"}, {"t": 2081.483333333333, "x": "そして「安否不明の拉致被害者は全て\n生存しているとの前提に立つ」と書いている。"}, {"t": 2086.7166666666667, "x": "政府の言い方のまま、なのね。"}, {"t": 2088.8333333333335, "x": "ああ。ここで私が何かを付け足したら、\nそれはもう記録の話ではなくなる。"}, {"t": 2093.4166666666665, "x": "この回で紹介した質問も、答弁も、\n参考人の言葉も、全部残っている。"}, {"t": 2098.5, "x": "誰でも読める。今すぐ読める。"}, {"t": 2100.45, "x": "それが、国会会議録検索システムだ。"}, {"t": 2103.2, "x": "今回使った資料も、そこで公開されている。"}, {"t": 2106.116666666667, "x": "中心にしたのは、次の記録だ。"}, {"t": 2108.35, "x": "一九九七年二月三日、衆議院予算委員会。\nこの名前が国会に出た最初の日。"}, {"t": 2114.2, "x": "一九九七年四月十八日、衆議院外務委員会。\nまだ六組九人だった時点の答弁。"}, {"t": 2120.5, "x": "一九九七年五月一日、参議院決算委員会。"}, {"t": 2124.2833333333333, "x": "七件十人になった日。"}, {"t": 2126.016666666667, "x": "二〇一四年六月十七日、\n衆議院の拉致問題特別委員会。"}, {"t": 2130.2, "x": "ストックホルム合意の直後。"}, {"t": 2132.016666666667, "x": "二〇二二年六月八日と二〇\n二四年六月七日、参議院の同じ委員会。"}, {"t": 2137.0, "x": "ご家族の参考人質疑。"}, {"t": 2138.9, "x": "二〇二五年十一月二十八日、参議院。"}, {"t": 2141.9, "x": "拉致から四十八年の日の質疑。"}, {"t": 2144.2, "x": "二〇二五年十二月五日、衆議院。"}, {"t": 2146.7, "x": "鑑定結果の説明が詳しく述べられた回。"}, {"t": 2149.483333333333, "x": "それから、政府の拉致問題対策本部と、\n警察庁のウェブサイトだ。"}, {"t": 2153.8333333333335, "x": "どなたでも無料で読める。"}, {"t": 2155.3333333333335, "x": "よかったら、一度自分で開いてみてほしい。"}, {"t": 2157.95, "x": "この回について、あなたはどう考えるか。"}, {"t": 2160.3333333333335, "x": "コメントで聞かせてほしい。"}, {"t": 2161.9166666666665, "x": "最後まで見てくれて、ありがとう。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
