<script>
const D={"name": "144", "file": "144_編集用", "dur": 2082.16665625, "segs": [], "subs": [{"t": 0.0, "x": "1982年2月10日。"}, {"t": 2.283333333333333, "x": "東京・永田町の大きなホテルで、\n工事が始まる予定だった。"}, {"t": 6.166666666666667, "x": "スプリンクラーを中心にした防災の工事だ。"}, {"t": 8.816666666666666, "x": "業者との契約ももう終わっていた。"}, {"t": 11.016666666666667, "x": "いい話じゃない。"}, {"t": 12.166666666666666, "x": "その工事は始まらなかった。"}, {"t": 14.0, "x": "2日前の2月8日、午前3時すぎに火が出たからだ。"}, {"t": 17.55, "x": "ホテルの名前はホテルニュージャパン。"}, {"t": 19.416666666666668, "x": "火が出たのは9階。工事が\n始まるはずの地下1階の、ずっと上だ。"}, {"t": 23.583333333333332, "x": "33人が亡くなり、34人がけがをした。"}, {"t": 26.833333333333332, "x": "工事があと2日だけ間に合わなかったの？"}, {"t": 29.35, "x": "そう聞こえるだろう。"}, {"t": 30.45, "x": "だが記録を並べると、2日の話ではなくなる。"}, {"t": 33.56666666666667, "x": "消防がホテルへ出した文書が4通。"}, {"t": 35.8, "x": "ホテルが消防へ出した報告が8回。"}, {"t": 38.15, "x": "最初の文書の日付は、1977年2月28日だ。"}, {"t": 42.78333333333333, "x": "それって、火事の5年も前じゃない。"}, {"t": 45.05, "x": "そうだ。"}, {"t": 46.18333333333333, "x": "今回は、この5年間の日付を順番に追っていく。"}, {"t": 49.38333333333333, "x": "亡くなった方の最後の様子は\n語らない。お名前も出さない。"}, {"t": 52.9, "x": "見ていくのは、日付と数字だけだ。"}, {"t": 64.3, "x": "まず、場所と建物を見ておこう。"}, {"t": 66.31666666666666, "x": "住所は東京都千代田区永田町。"}, {"t": 68.45, "x": "ある議員は国会で、この場所を\n「隣組のようなところ」と呼んだ。"}, {"t": 72.56666666666666, "x": "国会のご近所さんなのね。"}, {"t": 74.46666666666667, "x": "同じ質問の中で、\n「議事堂のおひざ元」とも言われている。"}, {"t": 78.1, "x": "建物は地上10階、地下2階。"}, {"t": 80.31666666666666, "x": "最高裁の決定は、形を「Ｙ字三差型」と書いている。"}, {"t": 84.25, "x": "3つの翼が真ん中でつながる形だ。"}, {"t": 86.96666666666667, "x": "廊下が三つまたになってるの？"}, {"t": 88.85, "x": "そうだ。国会でも逃げ場が\n分かりにくい形だと言われた。"}, {"t": 92.25, "x": "客室は約420室で、宿泊定員は約782人。"}, {"t": 96.8, "x": "貸し事務所やアパートとして使う\n部屋も、同じ建物に入っていた。"}, {"t": 100.83333333333333, "x": "そして、ここは政府に登録された\n国際観光ホテルだった。"}, {"t": 104.7, "x": "それって、国のお墨付きみたいなもの？"}, {"t": 107.25, "x": "泊まる側にはそう見えた。"}, {"t": 108.75, "x": "火事のあと、台湾から来た\n人たちの声が国会で紹介された。"}, {"t": 112.7, "x": "「政府登録」の看板を信用して\n泊まったのに、という声だ。"}, {"t": 116.43333333333334, "x": "看板の話はあとでまた出てくる。"}, {"t": 119.16666666666667, "x": "話は1974年までさかのぼる。"}, {"t": 121.95, "x": "その少し前に大きな建物の火事が続いていた。"}, {"t": 125.03333333333333, "x": "1972年の大阪・千日デパート。"}, {"t": 128.06666666666666, "x": "1973年の熊本・大洋デパート。"}, {"t": 131.38333333333333, "x": "それを受けて、1974年に消防法が改められた。"}, {"t": 135.4, "x": "何が変わったの？"}, {"t": 136.7, "x": "すでに建っている建物にも、\nスプリンクラーを求めることになった。"}, {"t": 140.56666666666666, "x": "ふつう法律は、これから建てる物に当てるものだ。"}, {"t": 143.55, "x": "それを前に建てた物にも当てたわけだ。"}, {"t": 145.96666666666667, "x": "いきなり全部つけろって言われても大変よね。"}, {"t": 148.7, "x": "だから5年の猶予がついた。"}, {"t": 150.43333333333334, "x": "期限は1979年3月31日。"}, {"t": 153.8, "x": "消防庁長官はこう説明している。"}, {"t": 156.06666666666666, "x": "「相当大きな資金も\n要りましょうし、あるいは時間的余裕も要る」。"}, {"t": 159.71666666666667, "x": "そこで5年の猶予期間を置いた、と。"}, {"t": 161.96666666666667, "x": "スプリンクラーの代わりに別の道も用意された。"}, {"t": 164.7, "x": "建物を細かく火を通さない壁と扉で区切るやり方だ。"}, {"t": 168.2, "x": "代替防火区画という。"}, {"t": 169.75, "x": "スプリンクラーか、区切りか。"}, {"t": 171.36666666666667, "x": "どちらかをやればよかった。"}, {"t": 172.96666666666667, "x": "長官によれば、大方の旅館・\nホテルは猶予の間に工事を済ませた。"}, {"t": 177.31666666666666, "x": "じゃあ、ニュージャパンは？"}, {"t": 178.7, "x": "ここから日付が始まる。"}, {"t": 180.98333333333332, "x": "1通目の日付は、1977年2月28日だ。"}, {"t": 185.2, "x": "地元の麹町消防署の署長から当時の社長あて。"}, {"t": 188.5, "x": "スプリンクラーなどをつけるようにという文書だった。"}, {"t": 191.35, "x": "5年の猶予のうち、もう3年たってるじゃない。"}, {"t": 194.18333333333334, "x": "火事のあと、国会でも同じことを聞かれている。"}, {"t": 196.98333333333332, "x": "ある議員は「三年間を空費していた」と質した。"}, {"t": 200.2, "x": "長官の答えは短い。"}, {"t": 201.75, "x": "文書で出したのは52年で、それが\n「公式な文書としては初めて」。"}, {"t": 206.31666666666666, "x": "52年って、昭和のこと？"}, {"t": 208.43333333333334, "x": "昭和52年、1977年のことだ。"}, {"t": 211.66666666666666, "x": "その前の3年間のやり取りは、\n長官も詳しくは知らないと答えた。"}, {"t": 215.85, "x": "公式の文書としては、この1通が最初になる。"}, {"t": 219.03333333333333, "x": "ホテルはどう返事したの？"}, {"t": 220.7, "x": "3か月後の5月28日に、報告を出している。"}, {"t": 224.11666666666667, "x": "これが8回ある報告の1回目だ。"}, {"t": 226.36666666666667, "x": "2回目は翌年の4月25日。"}, {"t": 228.68333333333334, "x": "この2回で工事が終わったわけではない。"}, {"t": 230.93333333333334, "x": "残りの時間はそのまま減っていった。"}, {"t": 233.76666666666668, "x": "1979年に入ると、日付の間隔が急に詰まる。"}, {"t": 237.88333333333333, "x": "3月16日に、3回目の報告。"}, {"t": 240.6, "x": "3月28日に、4回目の報告。"}, {"t": 243.55, "x": "12日で2回も？"}, {"t": 245.03333333333333, "x": "そして3月31日が法律の期限だ。"}, {"t": 247.96666666666667, "x": "消防はその日に、2通目の文書を出している。"}, {"t": 250.78333333333333, "x": "宛先はやはり当時の社長だった。"}, {"t": 252.93333333333334, "x": "この日が猶予の最後の日だと、念を押す中身だ。"}, {"t": 256.0833333333333, "x": "それで、その日までに工事は終わったの？"}, {"t": 258.6, "x": "終わっていない。"}, {"t": 259.73333333333335, "x": "ここが大事なところだ。"}, {"t": 261.21666666666664, "x": "3月31日を過ぎたホテルは、\n法律の基準を満たさない建物になった。"}, {"t": 266.1, "x": "ただ、それで営業が止まるわけではない。"}, {"t": 268.45, "x": "お客は昨日までと同じように泊まれる。"}, {"t": 270.81666666666666, "x": "張り紙も何も出ないの？"}, {"t": 272.48333333333335, "x": "この時点では、お客に知らせる仕組みがまだ無かった。"}, {"t": 275.68333333333334, "x": "のちに議員も\n「利用者は何一つ知らない」と言っている。"}, {"t": 279.1, "x": "それから1か月後の5月1日に、5回目の報告が出た。"}, {"t": 282.9, "x": "そしてこの5月、ホテルの社長が替わる。"}, {"t": 286.1166666666667, "x": "1979年5月28日。"}, {"t": 288.93333333333334, "x": "横井英樹 社長がホテルの代表取締役に就いた。"}, {"t": 292.68333333333334, "x": "のちに本人が、国会でいきさつを述べている。"}, {"t": 295.51666666666665, "x": "親会社の経営が悪くなり、\n頼まれて引き受けたのだという。"}, {"t": 299.03333333333336, "x": "資本金は7億2100万円。"}, {"t": 301.2, "x": "累積の赤字は、30数億円あったそうだ。"}, {"t": 304.25, "x": "火の車だったのね。"}, {"t": 305.78333333333336, "x": "本人の言い分ではそうなる。"}, {"t": 307.46666666666664, "x": "消防は社長が替わったとき、すぐに\n新しい計画を出すよう指示した。"}, {"t": 311.6666666666667, "x": "スプリンクラーが無いことも伝えている。"}, {"t": 313.85, "x": "これは消防庁の担当者が国会で答えたことだ。"}, {"t": 317.06666666666666, "x": "じゃあ、新しい社長も知ってたわけね。"}, {"t": 319.55, "x": "最高裁の決定もはっきりそう書いている。"}, {"t": 322.05, "x": "工事が終わっていないことを、\n「社長就任当時から」認識していた、と。"}, {"t": 326.46666666666664, "x": "別の議員はもう1つ共通点を指摘した。"}, {"t": 329.2, "x": "川治のホテルも、経営者が\n替わって間もない火事だった、と。"}, {"t": 332.76666666666665, "x": "工事のお金を負いきれない建物が、売りに出る。"}, {"t": 335.56666666666666, "x": "買った側は資産として持つ。"}, {"t": 337.3666666666667, "x": "議員はそういう形を心配した。"}, {"t": 339.43333333333334, "x": "これは議員の見方で、決まった事実ではない。"}, {"t": 342.76666666666665, "x": "お金が無いなら、どこかで借りられなかったの？"}, {"t": 345.6, "x": "社長はそこを国会でこう説明した。"}, {"t": 347.93333333333334, "x": "工事のために政府系の日本開発銀行へ頼みに行った。"}, {"t": 351.4166666666667, "x": "ところが、自分が社長になる3\nか月前に猶予が切れていた。"}, {"t": 355.18333333333334, "x": "そのため特別融資の道が完全に閉ざされてしまった。"}, {"t": 358.6166666666667, "x": "普通の銀行も、成績が悪いので思うように貸さない。"}, {"t": 361.93333333333334, "x": "本人の言葉では「悪戦苦闘の連続」だった。"}, {"t": 365.3333333333333, "x": "3か月の差か。なんだか気の毒な気も……"}, {"t": 368.1333333333333, "x": "そう聞こえる話し方ではある。"}, {"t": 369.9166666666667, "x": "別の議員がすぐ2つの例を出した。"}, {"t": 372.18333333333334, "x": "1つは近くの都市センターホテル。"}, {"t": 374.3, "x": "こちらは防災の設備に約4億円をかけて工事をした。"}, {"t": 377.7, "x": "もう1つは横浜のシルクホテル。"}, {"t": 379.81666666666666, "x": "スプリンクラーをつける\nお金が無いので廃業したという。"}, {"t": 382.96666666666664, "x": "やれないならやめたホテルもあったのね。"}, {"t": 385.23333333333335, "x": "議員の言い方はこうだ。"}, {"t": 386.6666666666667, "x": "資金難だからといって、「経営者として\n絶対許されることではないのではないか」。"}, {"t": 391.25, "x": "工事の費用について、社長は約10億円と答えている。"}, {"t": 394.68333333333334, "x": "買収の費用を議員は約100億円と言い、\n社長はそんなに少なくないと答えた。"}, {"t": 399.4166666666667, "x": "のちの最高裁は、この点をひとことで書いた。"}, {"t": 402.28333333333336, "x": "工事は「資金的にもその実施が十分可能であった」。"}, {"t": 406.26666666666665, "x": "では社長は、工事を全くしなかったのか。"}, {"t": 408.93333333333334, "x": "これも本人の陳述を並べてみよう。"}, {"t": 411.21666666666664, "x": "1979年に、スプリンクラー用の本管と\n4階・7階の隔壁。"}, {"t": 416.3333333333333, "x": "1980年に、スプリンクラーを1階と2階へ一部設置。"}, {"t": 420.4166666666667, "x": "1981年に、2階の大宴会場と廊下の防災工事。"}, {"t": 424.8, "x": "けっこうやってるじゃない。"}, {"t": 426.25, "x": "下の階はそうだな。"}, {"t": 427.5833333333333, "x": "ただ客室のある4階から上で区切りが\n済んだのは、4階と7階だけだ。"}, {"t": 432.1, "x": "9階と10階にはスプリンクラーも区切りも無かった。"}, {"t": 435.3, "x": "火が出たのは、9階だったわよね。"}, {"t": 437.6, "x": "そうだ。"}, {"t": 438.73333333333335, "x": "消防庁長官は、当時の工事の様子をこう答えている。"}, {"t": 442.1166666666667, "x": "「警告をいたしますとちょっと工事が始まる」。"}, {"t": 444.7, "x": "「始まってやがてまた見に行くと\n工事がとまっておる」。"}, {"t": 447.55, "x": "「また警告する、またやり出す」。"}, {"t": 449.68333333333334, "x": "ちょっとずつ動いては止まるのね。"}, {"t": 451.6333333333333, "x": "議員は同じことをもっと硬い言葉で言った。"}, {"t": 454.21666666666664, "x": "「指導書に対する回答を小出しにしていて\n時間稼ぎをしていた」。"}, {"t": 457.8833333333333, "x": "そのやり方に消防署が乗ってしまったという批判だ。"}, {"t": 460.98333333333335, "x": "もう1つ、国会で取り上げられた話がある。"}, {"t": 463.78333333333336, "x": "2階のスプリンクラーの多くが、水の管に\nつながっていないという指摘だ。"}, {"t": 468.03333333333336, "x": "社長は「ちゃんとパイプに\n直結しております」と答えた。"}, {"t": 471.55, "x": "つながっていないのは、\n1階のテナントの分だと説明している。"}, {"t": 475.23333333333335, "x": "どちらが正しいかは、\nこの日の会議録だけでは決められない。"}, {"t": 479.3666666666667, "x": "工事と並んで、もう1つ細っていった物がある。"}, {"t": 482.3833333333333, "x": "防火のための毎年のお金と人だ。"}, {"t": 484.71666666666664, "x": "最高裁の決定にはこう書かれている。"}, {"t": 487.03333333333336, "x": "「少額の支出に至るまで社長決裁を要求」。"}, {"t": 489.8833333333333, "x": "「極端な支出削減方針を採っていた」。"}, {"t": 492.6333333333333, "x": "少額って、どのくらいなの？"}, {"t": 494.5833333333333, "x": "議員は、1万円以上は社長の決裁だったと述べている。"}, {"t": 498.05, "x": "そのため、専門の業者による\n点検や修理が行われなかった。"}, {"t": 501.98333333333335, "x": "防火戸は、火事のときに自動で\n閉まらない物が多くなった。"}, {"t": 505.45, "x": "非常放送の設備も一部が使えなくなっていた。"}, {"t": 508.51666666666665, "x": "壊れたまま放っておかれたのね。"}, {"t": 510.56666666666666, "x": "人も減っている。"}, {"t": 511.71666666666664, "x": "社長が雑誌に語った数字が国会で読み上げられた。"}, {"t": 514.8666666666667, "x": "自分が来てから、従業員は350人から150人になった。"}, {"t": 519.1, "x": "これからも少数精鋭でいく、と。"}, {"t": 521.15, "x": "消防庁によれば、火事のころの従業員は140人。"}, {"t": 524.5666666666667, "x": "少し大きい都内のホテルは約600人だった。"}, {"t": 527.6333333333333, "x": "4分の1じゃない。"}, {"t": 529.0, "x": "消防庁の担当者も、4分の1と答えている。"}, {"t": 532.15, "x": "社長は、足りない分はガードマンや\nアルバイトで補ったと述べた。"}, {"t": 535.7333333333333, "x": "ただ、消防に出した計画は、減った\n人数に合わせて直されなかった。"}, {"t": 540.05, "x": "訓練もほとんど行われなくなった。"}, {"t": 542.25, "x": "1980年は1度もやっていない。"}, {"t": 545.4333333333333, "x": "時計を、1980年に戻そう。"}, {"t": 548.0666666666667, "x": "3通目の文書は、2月16日に出された。"}, {"t": 551.0833333333334, "x": "今度の宛先は横井英樹 社長だ。"}, {"t": 553.7833333333333, "x": "計画がかなり遅れているので、\n新しい計画を出せという内容だった。"}, {"t": 558.1166666666667, "x": "返事は来たの？"}, {"t": 559.3333333333334, "x": "すぐには来ない。"}, {"t": 560.35, "x": "4通目は同じ年の8月に出た。"}, {"t": 562.6833333333333, "x": "古い建物に求められた設備について、\n具体的な計画を立てろと求めた。"}, {"t": 567.5, "x": "それでようやく、6回目の報告が8月25日に出る。"}, {"t": 571.2, "x": "前の報告から、1年3か月あまりあいていた。"}, {"t": 574.4333333333333, "x": "その間は、消防も見に来てたんでしょ？"}, {"t": 577.0, "x": "検査は年に2回、続いていた。"}, {"t": 579.1666666666666, "x": "最高裁の決定によれば、1979年7月からは\n毎月のように工事を促している。"}, {"t": 585.1666666666666, "x": "ある議員の数え方では、\n社長の就任から立入検査が5回あった。"}, {"t": 589.3333333333334, "x": "文書と検査を合わせると、消防は\nかなりの回数、足を運んでいる。"}, {"t": 593.5833333333334, "x": "なのに、何も変わらなかったの？"}, {"t": 595.7333333333333, "x": "文書には強い力が無かった。"}, {"t": 597.7666666666667, "x": "指導書には法律で従わせる力が無い。"}, {"t": 600.3833333333333, "x": "これは国会の質問でも言われている。"}, {"t": 602.6166666666667, "x": "強い手続きは別にあったが、まだ使われていない。"}, {"t": 605.7, "x": "そうしている間に、別の場所で火事が起きた。"}, {"t": 609.1166666666667, "x": "1980年11月20日。"}, {"t": 611.4833333333333, "x": "栃木県の川治プリンスホテルで火事が起きた。"}, {"t": 614.3166666666667, "x": "死者は45人だった。"}, {"t": 615.95, "x": "消防庁は全国の旅館とホテルの一斉点検に動いた。"}, {"t": 619.45, "x": "翌年の1月にも調査をして、その結果を\n踏まえて強く指導している。"}, {"t": 623.85, "x": "命令に従わない悪質なところには、\n告発も辞さない、という中身だ。"}, {"t": 628.4666666666667, "x": "今度こそ本気になったのね。"}, {"t": 630.4166666666666, "x": "もう1つ、新しい仕組みもできた。"}, {"t": 632.75, "x": "1981年5月に始まった「適マーク」だ。"}, {"t": 636.55, "x": "消防の基準を満たす旅館・\nホテルに、マークを交付する。"}, {"t": 639.9833333333333, "x": "設備だけでなく、訓練や管理の中身も見る。"}, {"t": 643.0, "x": "お客さんから見て、安心の印ね。"}, {"t": 645.5, "x": "これでようやく、お客に見える形ができたわけだ。"}, {"t": 648.5, "x": "ニュージャパンの答えは、もう分かるだろう。"}, {"t": 650.8333333333334, "x": "もらえなかった？"}, {"t": 651.9666666666667, "x": "交付されなかった。"}, {"t": 653.2, "x": "火事のあった日の国会で、\n東京の数字が読み上げられている。"}, {"t": 656.7333333333333, "x": "対象が961軒。マークを受けたのが\n620軒。残りが341軒。"}, {"t": 662.3166666666667, "x": "その341軒の中にニュージャパンも入る。"}, {"t": 665.4333333333333, "x": "じゃあ、マークが無いホテルはすぐ分かったのね。"}, {"t": 668.1333333333333, "x": "そこが難しいところだ。"}, {"t": 669.75, "x": "341軒の中には、作業の途中という所もあった。"}, {"t": 673.65, "x": "長官は、不適の所を一律に\n公表するのは難しいと答えている。"}, {"t": 677.9666666666667, "x": "そして、政府登録の看板はそのままだった。"}, {"t": 681.55, "x": "1981年6月3日、7回目の報告が出た。"}, {"t": 685.65, "x": "そしてこの年の8月20日。"}, {"t": 687.7333333333333, "x": "社長は消防署長に会っている。"}, {"t": 689.6166666666667, "x": "これものちに、国会で本人が語った日付だ。"}, {"t": 692.7833333333333, "x": "社長が、初めて直接聞いたってこと？"}, {"t": 695.5666666666667, "x": "本人はそのときに聞いたと答えた。"}, {"t": 697.8, "x": "ある議員がここを細かく問い詰めている。"}, {"t": 700.0166666666667, "x": "記者会見では、知ったのは\n1981年7月ごろと言ったそうですね、と。"}, {"t": 705.2166666666667, "x": "社長になったのは2年も前なのに、\n知らなかったのか、と。"}, {"t": 708.7833333333333, "x": "立入検査が5回、指導書が2回あったでしょう、と。"}, {"t": 712.1666666666666, "x": "社長は何て答えたの？"}, {"t": 713.8333333333334, "x": "回数は分からないと言った。"}, {"t": 715.35, "x": "書類は全部押収されている、と。"}, {"t": 717.5, "x": "そして「昨年の八月二十日」と答えた。"}, {"t": 720.55, "x": "議員は「いつ知ったかと\n聞いているのです」と重ねた。"}, {"t": 723.8, "x": "先に見た最高裁の決定はこの言い分を取っていない。"}, {"t": 727.0833333333334, "x": "その8月20日には何を話したの？"}, {"t": 729.65, "x": "これも社長の言い分だが、\n署長の話はこうだったという。"}, {"t": 733.0333333333333, "x": "おたくは上の方に、火が出るところはない。"}, {"t": 735.4666666666667, "x": "まず地下の大きなキッチン、次に\n2階・3階のキッチンをやるように。"}, {"t": 739.5833333333334, "x": "9階も、その上の方よね……"}, {"t": 741.65, "x": "そうだ。客室の階から火が出た。"}, {"t": 743.9333333333333, "x": "署長が本当にそう言ったのかは、\nこの答弁だけでは確かめられない。"}, {"t": 747.9166666666666, "x": "ただ社長は、地下から手をつけると説明している。"}, {"t": 750.9333333333333, "x": "2月10日の工事が地下1階なのは、\n社長の説明ではそのためだ。"}, {"t": 755.75, "x": "1981年9月11日。"}, {"t": 758.4, "x": "ついに東京消防庁は、指導ではなく命令を出す。"}, {"t": 761.5333333333333, "x": "消防法第17条の4にもとづく措置命令だ。"}, {"t": 764.6166666666667, "x": "スプリンクラーをつけなさいという命令書だった。"}, {"t": 767.3666666666667, "x": "やっと強い手が出たわけね。"}, {"t": 769.1833333333333, "x": "1通目から4年半が過ぎていた。"}, {"t": 771.3, "x": "そして命令には履行の期限がついた。"}, {"t": 773.6, "x": "1982年9月11日。"}, {"t": 776.3, "x": "ちょうど1年後？"}, {"t": 777.5, "x": "そうだ。1年の猶予だ。"}, {"t": 779.2333333333333, "x": "消防総監によれば、署長と本庁の査察課長が\nオーナーに直接会って指示もした。"}, {"t": 784.35, "x": "もしこの期限を破れば、次は公表か告発に進む。"}, {"t": 787.8, "x": "逆に言えば、期限の前なので、\n公表も告発もしていない。"}, {"t": 791.5, "x": "長官は火事の翌日にこう答えている。"}, {"t": 793.9166666666666, "x": "「まだ一年間の猶予期間の中でございました」。"}, {"t": 796.9, "x": "じゃあ、火事の日はまだ猶予の途中だったの？"}, {"t": 799.5833333333334, "x": "そうなる。"}, {"t": 800.7166666666667, "x": "ある議員はこのことを鋭く突いた。"}, {"t": 802.7833333333333, "x": "命令が出ると、そのホテルは1年間、\n公表される立場でなくなる、と。"}, {"t": 807.1833333333333, "x": "もう1つ、後の国会で出た数字がある。"}, {"t": 809.8333333333334, "x": "スプリンクラーの工事が残っていたのは、\n東京消防庁の管内に43軒。"}, {"t": 814.5, "x": "これは議員の調べだ。"}, {"t": 815.8833333333333, "x": "そのうち42軒は工事を終え、\n残ったのは1軒だけだという。"}, {"t": 819.7666666666667, "x": "その1軒が……"}, {"t": 820.9333333333333, "x": "ニュージャパンだ。"}, {"t": 822.5166666666667, "x": "命令から1か月あまりたった、10月22日。"}, {"t": 825.7333333333333, "x": "ホテルから、8回目の報告が届いた。"}, {"t": 828.3333333333334, "x": "これが火事の前の最後の文書になる。"}, {"t": 830.5666666666667, "x": "今度の中身はこれまでと少し違っていた。"}, {"t": 833.1833333333333, "x": "工事をする予定の業者が\n見積もりを出し、打ち合わせもしていた。"}, {"t": 836.9, "x": "今度こそ本当にやる、ってこと？"}, {"t": 839.0666666666667, "x": "東京消防庁もそう見た。"}, {"t": 840.7833333333333, "x": "長官の答弁では、「かなり実現性が\n高いという感触」を得ていた。"}, {"t": 845.0333333333333, "x": "火事の翌日の答弁はこうだ。"}, {"t": 846.95, "x": "「この二月からいよいよ\n着工するというところへ来ておった」。"}, {"t": 850.1666666666666, "x": "9月を完成のめどにしたい、という\n話も来ていたという。"}, {"t": 853.6833333333333, "x": "それが2月10日の工事なのね。"}, {"t": 855.8333333333334, "x": "そうだ。"}, {"t": 856.9666666666667, "x": "ここで、もう一度8回の報告を並べてみる。"}, {"t": 859.8666666666667, "x": "1977年5月。1978年4月。"}, {"t": 864.0, "x": "1979年3月に2回。同じ年の5月。"}, {"t": 867.7833333333333, "x": "1980年8月。1981年6月。"}, {"t": 871.7666666666667, "x": "1981年10月。"}, {"t": 874.1, "x": "5年で8回。"}, {"t": 875.2833333333333, "x": "長官は「内容的には見るべき\n進捗をいたしておりません」と答えた。"}, {"t": 879.5833333333334, "x": "ある議員は、この数字を逆の意味に読んだ。"}, {"t": 882.0666666666667, "x": "回数が多く出たということは、\n「それだけ信憑性がない」。"}, {"t": 885.4166666666666, "x": "同じ10月、消防の再三の指摘で、\nようやく訓練が1回行われた。"}, {"t": 890.0833333333334, "x": "最高裁はこの訓練を、\n「形式的な訓練」と書いている。"}, {"t": 894.3333333333334, "x": "ここで、社長の側の記録も見ておこう。"}, {"t": 896.8166666666667, "x": "4月の国会で、社長は\n工事の経過を日付で読み上げた。"}, {"t": 900.4333333333333, "x": "1981年7月23日に工事の現場事務所を開いた。"}, {"t": 904.9833333333333, "x": "8月20日に工事の着工届を麹町消防署へ出した。"}, {"t": 908.9666666666667, "x": "署長に会ったのと同じ日ね。"}, {"t": 910.8666666666667, "x": "そうなる。"}, {"t": 912.0, "x": "9月末に、2階の大宴会場の工事が完了。"}, {"t": 915.15, "x": "10月には2階の廊下の工事を終えて、\n消防の立会検査に合格した。"}, {"t": 919.6166666666667, "x": "11月には階段の下のシャッター、\n12月には空調のダンパーの工事。"}, {"t": 924.1166666666667, "x": "消防はその間も毎月のように立ち会っている。"}, {"t": 927.0333333333333, "x": "命令のあとは本当に進んでたのね。"}, {"t": 929.4166666666666, "x": "1階と2階の話としては、そうだ。"}, {"t": 931.9333333333333, "x": "そして1982年1月9日に、\n地下1階の防災工事の契約が結ばれた。"}, {"t": 937.6333333333333, "x": "中身はスプリンクラーと防火区画、\n非常照明と誘導灯の設備だ。"}, {"t": 941.8, "x": "着工の予定は2月10日。"}, {"t": 943.75, "x": "社長の言ってた工事は、本当にあったんだ。"}, {"t": 946.55, "x": "あった。そこは記録どおりだ。"}, {"t": 948.4, "x": "ただ読み上げられた工事の中に、\n客室の階の日付は1つも無い。"}, {"t": 952.4833333333333, "x": "9階と10階の順番は、この表ではまだ来ていない。"}, {"t": 955.75, "x": "社長の陳述はこういう言い方だった。"}, {"t": 958.0333333333333, "x": "「本年の九月までにはできる\n限りの防災工事をやり終える予定でありました」。"}, {"t": 962.4166666666666, "x": "できる限り、なのね。"}, {"t": 964.05, "x": "命令の期限までに客室の階がどこまで\n進んだのかは、もう分からない。"}, {"t": 968.9333333333333, "x": "ここで、もう1つの数字を見ておこう。"}, {"t": 971.2333333333333, "x": "夜のホテルに、何人いたのかという数字だ。"}, {"t": 974.0, "x": "ホテルが1976年に消防へ出した\n計画では、夜の自衛消防隊は45人。"}, {"t": 979.6, "x": "知らせる係、誘導する係、消す\n係が、それぞれ決まっていた。"}, {"t": 984.0166666666667, "x": "45人いれば、なんとかなりそうね。"}, {"t": 986.5333333333333, "x": "人が減っても、この計画は書き換えられなかった。"}, {"t": 989.6333333333333, "x": "では火事の夜、実際には何人いたのか。"}, {"t": 992.2833333333333, "x": "長官の報告はこうだ。"}, {"t": 993.8666666666667, "x": "ホテルの従業員が8人。"}, {"t": 995.4333333333333, "x": "委託の警備員が5人。"}, {"t": 996.9666666666667, "x": "テナントで宿直していた人が18人。合わせて31人。"}, {"t": 1001.0166666666667, "x": "テナントの人って、ホテルの係じゃないわよね。"}, {"t": 1004.0333333333333, "x": "そうだ。議員も「問題にならぬ」と言っている。"}, {"t": 1006.9666666666667, "x": "別の議員は、8人のうち\n起きていたのは4人だと述べた。"}, {"t": 1010.4666666666667, "x": "ほかの委員会では別の人数も挙げられている。"}, {"t": 1013.1, "x": "数え方によって、数字は少し揺れる。"}, {"t": 1015.6, "x": "ただ、どの数え方でも、ホテルの人は\n届け出の45人に届かない。"}, {"t": 1020.0833333333334, "x": "1981年10月に従業員が人員表を\n消防署へ持っていった、という話も出た。"}, {"t": 1025.8166666666666, "x": "受け取ってもらえなかったという指摘だ。"}, {"t": 1028.0333333333333, "x": "長官は承知していないと答え、確認すると述べた。"}, {"t": 1031.3333333333333, "x": "さらに議員は、もう1つの話を出している。"}, {"t": 1034.0833333333333, "x": "夜11時から朝5時半まで、\n客室の見回りが止められていた、と。"}, {"t": 1038.4, "x": "社長の命令だった、という説明だ。"}, {"t": 1040.8833333333334, "x": "それ、本当なの？"}, {"t": 1042.3166666666666, "x": "議員の発言だ。次の答弁で、\n長官はこの点に触れていない。"}, {"t": 1046.2666666666667, "x": "だから、そういう指摘があった、とだけ言っておく。"}, {"t": 1049.25, "x": "最高裁の決定が認めているのはこうだ。"}, {"t": 1051.7833333333333, "x": "当直の人たちは「自衛消防組織として\n編成されて」いなかった。"}, {"t": 1056.1833333333334, "x": "これは当直の人の責任ではない。組む側の話だ。"}, {"t": 1060.2666666666667, "x": "1982年2月8日、月曜日の未明。"}, {"t": 1063.6166666666666, "x": "工事の予定日まで、あと2日。"}, {"t": 1065.6833333333334, "x": "命令の期限まであと7か月。"}, {"t": 1067.6833333333334, "x": "最高裁の決定によれば、午前3時16分から17分ごろ。"}, {"t": 1071.7833333333333, "x": "9階の938号室のベッドから火が出た。"}, {"t": 1074.7, "x": "原因は、宿泊客のたばこの不始末とされている。"}, {"t": 1078.1166666666666, "x": "たばこ1本から……"}, {"t": 1079.45, "x": "火は、すぐに見つかった。"}, {"t": 1081.1, "x": "駆けつけた当直の従業員が消火器を使っている。"}, {"t": 1084.2, "x": "ベッドの表面の炎はいったん消えた。"}, {"t": 1086.4666666666667, "x": "しかし約1分後に、また燃え上がった。"}, {"t": 1089.0333333333333, "x": "一度は消えたのね。"}, {"t": 1090.4, "x": "そして部屋のドアは、開いたままだった。"}, {"t": 1092.85, "x": "ここで、5年間の話がつながってくる。"}, {"t": 1095.5, "x": "スプリンクラーがあれば、水が出たはずの部屋だ。"}, {"t": 1098.2333333333333, "x": "客室の扉の多くは木でできていた。"}, {"t": 1100.6, "x": "客室や廊下の壁には、ベニヤ板や\n燃えるクロスが使われていた。"}, {"t": 1104.5166666666667, "x": "管が通る穴の埋め戻しも不完全なままだった。"}, {"t": 1107.4833333333333, "x": "火は天井裏や壁のすき間を\n伝って9階と10階へ広がった。"}, {"t": 1111.4833333333333, "x": "それって、全部、検査で言われてたこと？"}, {"t": 1114.2, "x": "消防総監は、スプリンクラーや防火戸のことは\n査察で指摘していたと答えた。"}, {"t": 1118.9166666666667, "x": "火の通り道になった区画の不備は、\n認識していなかった項目に挙げている。"}, {"t": 1123.45, "x": "ただ最高裁の決定は、管の周りの埋め戻しも\n指摘されていたと書く。"}, {"t": 1127.85, "x": "どこまで見えていたのかは、資料で言い方が少し違う。"}, {"t": 1131.1166666666666, "x": "はっきりしているのは、この階に\n水の出る設備が無かったことだ。"}, {"t": 1135.5, "x": "では、警報はどうなっていたのか。"}, {"t": 1137.5333333333333, "x": "火災報知の設備そのものは各階についていた。"}, {"t": 1140.4833333333333, "x": "受信盤は、1階の警備員室にあった。"}, {"t": 1143.1, "x": "警察庁の担当者の説明はこうだ。"}, {"t": 1145.5, "x": "「警報スイッチが停止状態となっておりました」。"}, {"t": 1148.25, "x": "各階のベルは、手でスイッチを\n入れないと鳴らない状態だった。"}, {"t": 1151.8833333333334, "x": "どうしてそんなことに？"}, {"t": 1153.35, "x": "誤作動でベルが鳴るのを嫌う、という話が国会で出た。"}, {"t": 1156.7, "x": "ある議員は、別の大きなホテルの例を挙げて\nそう質している。"}, {"t": 1160.1333333333334, "x": "ニュージャパンの場合の理由は、\n当時まだ調べの途中だった。"}, {"t": 1163.45, "x": "ここは推測で言わないでおく。"}, {"t": 1165.25, "x": "非常放送の設備も見ておこう。"}, {"t": 1167.1833333333334, "x": "テープレコーダーが2台あった。"}, {"t": 1168.8833333333334, "x": "1台は故障していた。"}, {"t": 1170.3833333333334, "x": "もう1台には、テープが入っていなかった。"}, {"t": 1173.0666666666666, "x": "えっ、入ってない？"}, {"t": 1174.4333333333334, "x": "第一発見者はマイクで知らせたと話している。"}, {"t": 1177.3166666666666, "x": "しかし、それを聞いたという人は\n当時見つかっていなかった。"}, {"t": 1180.7333333333333, "x": "消防総監は、警報ベルの操作を\n従業員が知らなかったとも述べている。"}, {"t": 1185.0166666666667, "x": "これも従業員を責める話ではない。"}, {"t": 1187.2166666666667, "x": "教える訓練が無かった、という話だ。"}, {"t": 1189.85, "x": "45人は、届け出の中だけの人数だったのね。"}, {"t": 1193.25, "x": "最高裁は「組織的な対応ができなかった」と\n書いている。"}, {"t": 1197.65, "x": "消防が119番で火事を知ったのは、午前3時39分だ。"}, {"t": 1201.7833333333333, "x": "出火から、20分以上たっていた。"}, {"t": 1204.2833333333333, "x": "そんなに遅かったの？"}, {"t": 1205.7833333333333, "x": "最高裁は「一一九番通報も大幅に遅れる」と書いた。"}, {"t": 1209.6166666666666, "x": "消防は第4出場を命じ、100台を超える車を出した。"}, {"t": 1213.2, "x": "はしご車は、正面と西側から11台が伸ばされた。"}, {"t": 1216.6166666666666, "x": "ただ正面には、3階と5階の低い\n屋根が張り出していた。"}, {"t": 1220.25, "x": "そのため、9階と10階にぴったり\n寄せることができなかった。"}, {"t": 1223.95, "x": "これは消防庁の担当者の答弁だ。"}, {"t": 1226.2333333333333, "x": "現場を指揮したのは、\n東京消防庁のトップである消防総監だった。"}, {"t": 1230.4166666666667, "x": "総監はのちに国会で、この火事を\n「人災」と呼んでいる。"}, {"t": 1234.0666666666666, "x": "鎮火は、昼の12時36分。"}, {"t": 1236.45, "x": "焼けた床は4380平方メートル。"}, {"t": 1239.2333333333333, "x": "9階と10階が、ほとんどだ。"}, {"t": 1241.3666666666666, "x": "亡くなった方は33人を数えた。"}, {"t": 1243.9166666666667, "x": "外国の方も多かったのよね。"}, {"t": 1246.0, "x": "社長の陳述の中に、台湾の方12人、\n韓国の方8人とある。"}, {"t": 1250.5833333333333, "x": "観光で来日した方の被害が\n大きかったと、国会でも語られた。"}, {"t": 1254.7833333333333, "x": "ここで、その夜のことを語るのはやめておく。"}, {"t": 1257.6166666666666, "x": "うん。"}, {"t": 1258.75, "x": "ご遺族のいる話なので、数字だけを置いておく。"}, {"t": 1261.6166666666666, "x": "火事の翌朝には、羽田沖で日本航空の事故が起きた。"}, {"t": 1265.1333333333334, "x": "続けて起きた事故として国会でも並べて語られている。"}, {"t": 1268.4833333333333, "x": "そちらは別の回で扱ったのでここでは日付だけにする。"}, {"t": 1271.8666666666666, "x": "この回の舞台はホテルのとなりの国会へ移る。"}, {"t": 1275.2833333333333, "x": "2月8日の朝。となりの国会で、\n予算委員会が開かれていた。"}, {"t": 1279.4166666666667, "x": "議題は別の話だったが、質問の前に\nこの火事が取り上げられた。"}, {"t": 1283.5333333333333, "x": "9階と10階に\nスプリンクラーが無かったという話がある。"}, {"t": 1286.9166666666667, "x": "設置の命令は出していたのか。"}, {"t": 1288.8333333333333, "x": "消防庁長官は答えた。"}, {"t": 1290.5666666666666, "x": "「昨年の九月十一日に消防法の規定に\n基づきます措置命令を発しております」。"}, {"t": 1295.75, "x": "火事の当日にもう命令の話が出たのね。"}, {"t": 1298.55, "x": "総理大臣も原因を調べて厳正な措置をとると述べた。"}, {"t": 1301.9166666666667, "x": "翌9日の委員会で長官は詳しい経過を報告した。"}, {"t": 1305.3666666666666, "x": "ここで4回と8回の数字が出た。"}, {"t": 1307.6333333333334, "x": "ある議員がすぐに質問した。"}, {"t": 1309.4666666666667, "x": "命令を出しっ放しで罰則を使わないのはどうなのか。"}, {"t": 1312.6, "x": "長官の答えはさっきの猶予の話だ。"}, {"t": 1315.05, "x": "そして、出しっ放しでは\n「もとよりこれはいけない」と言った。"}, {"t": 1318.8, "x": "でも、出しっ放しに見えるわよね。"}, {"t": 1321.0333333333333, "x": "見えるだろう。"}, {"t": 1322.1666666666667, "x": "別の議員は公表はしたのかと尋ねた。"}, {"t": 1324.6166666666666, "x": "答えは、まだ猶予の中だから、していない。"}, {"t": 1327.35, "x": "こうして公表の仕組みは、\nこのホテルには1度も使われなかった。"}, {"t": 1331.1666666666667, "x": "委員会の議員たちは、2月11日に\n現場も見に行っている。"}, {"t": 1334.8666666666666, "x": "そして2月16日、長い質疑が始まった。"}, {"t": 1338.6666666666667, "x": "2月16日の衆議院地方行政委員会。"}, {"t": 1341.4666666666667, "x": "最初の議員がこう切り出した。"}, {"t": 1343.3166666666666, "x": "措置命令に至るまでの期間を、\nもう少し短くできなかったのか。"}, {"t": 1347.35, "x": "それがあれば防げたかもしれない。"}, {"t": 1349.3833333333334, "x": "野党の議員さん？"}, {"t": 1350.5833333333333, "x": "いや、与党の議員だ。"}, {"t": 1352.0333333333333, "x": "長官は消防は法の中で努力したと答えた。"}, {"t": 1354.95, "x": "そのうえでこう続けた。"}, {"t": 1356.4, "x": "「余りにもその期間が長過ぎたではないかという\n御批判は、厳しく受けとめなければならぬ」。"}, {"t": 1361.6333333333334, "x": "認めたのね。"}, {"t": 1362.8, "x": "別の議員の質問にはもっと強い言葉も出た。"}, {"t": 1365.7166666666667, "x": "「のんべんだらりと指示のしっ放しというのは、\n私は行政措置としては最もいけない」。"}, {"t": 1370.6666666666667, "x": "これは長官自身の言葉だ。"}, {"t": 1372.65, "x": "のんべんだらりって国会で言うんだ。"}, {"t": 1374.75, "x": "会議録にそのまま残っている。"}, {"t": 1376.6666666666667, "x": "別の議員はもっと具体的に並べた。"}, {"t": 1379.0333333333333, "x": "防火区画が無い。カーテンに\n防炎の加工が無い。訓練が無い。"}, {"t": 1382.7, "x": "ベルが鳴らない。放送も使えない。"}, {"t": 1384.8166666666666, "x": "議員はこれを「一から十まで人災」と呼んだ。"}, {"t": 1387.7166666666667, "x": "消防総監が挙げた法令違反もほぼ重なっている。"}, {"t": 1390.75, "x": "スプリンクラーが無いことは早くから分かっていた。"}, {"t": 1393.5166666666667, "x": "分かっていて、5年かかっても直らなかった。"}, {"t": 1396.2333333333333, "x": "では消防にはほかの手が無かったのか。"}, {"t": 1399.1666666666667, "x": "消防法の第5条という条文がある。"}, {"t": 1401.3666666666666, "x": "火事になれば人の命が危ないと\n認めたとき、消防長や署長が命令できる。"}, {"t": 1406.0833333333333, "x": "使用の停止まで命じられる条文だ。"}, {"t": 1408.2666666666667, "x": "議員はこれを「伝家の宝刀」と呼んだ。"}, {"t": 1410.8666666666666, "x": "それを使えば、9階と10階を閉められたの？"}, {"t": 1413.8, "x": "議員はそう質問した。"}, {"t": 1415.3166666666666, "x": "あの2つの階を、使用禁止にできたのではないか、と。"}, {"t": 1418.6666666666667, "x": "長官の答えには、2つの点があった。"}, {"t": 1421.25, "x": "1つ目は手順だ。"}, {"t": 1422.55, "x": "東京消防庁は、警告から命令、\n公表、告発へ進む順番を選んだ。"}, {"t": 1427.4, "x": "2つ目は解釈だ。"}, {"t": 1428.8, "x": "この条文は、差しかかった具体的な\n危険があるときに使うものだ、と。"}, {"t": 1433.2, "x": "スプリンクラーが無いだけで\n当てはまるのか、という判断があった。"}, {"t": 1436.9, "x": "火事が起きそうじゃないとダメってこと？"}, {"t": 1439.1166666666666, "x": "そういう読み方が制定のころから続いていた。"}, {"t": 1441.8166666666666, "x": "もう1つ、消防庁の担当者が\n別の委員会で明かした事情がある。"}, {"t": 1445.9, "x": "もし命令が裁判で取り消されると、\n自治体が補償しなければならない。"}, {"t": 1450.0166666666667, "x": "だから現場は、「かなりちゅうちょせざるを得ない」。"}, {"t": 1452.6333333333334, "x": "止めたらお金を払うことになるかもしれないのね。"}, {"t": 1455.5666666666666, "x": "そして長官はこう言った。"}, {"t": 1457.1666666666667, "x": "「この五条は決して飾り物ではない」。"}, {"t": 1459.3333333333333, "x": "別の質問では、雑誌の論文の数字も読み上げられた。"}, {"t": 1462.8166666666666, "x": "1980年版の消防白書には、第5条の命令が\n29件、第17条の4の命令が410件とある。"}, {"t": 1470.3166666666666, "x": "最初の議員は、第5条は一度も\n使われていないと言っていた。"}, {"t": 1474.0666666666666, "x": "数字が合わないじゃない。"}, {"t": 1475.5, "x": "合わない。どちらの言い方が\n正しいのかは確かめていない。"}, {"t": 1478.7666666666667, "x": "同じ論文は、夜の人員が足りなければ\n第8条で命じられるはずだとも書いた。"}, {"t": 1483.5333333333333, "x": "第8条の命令は、その白書に載っていなかったという。"}, {"t": 1486.9166666666667, "x": "ただ判断がよかったかどうかは、\n「大きな問題が残る」とも認めた。"}, {"t": 1491.1333333333334, "x": "命令の1年と、第5条の間に、すき間があった。"}, {"t": 1494.4666666666667, "x": "火が出たのはそのすき間の中だった。"}, {"t": 1497.3, "x": "この日の質疑でいちばん記録に残したい場面がある。"}, {"t": 1500.3833333333334, "x": "ある議員が古い会議録の束を持ち出した。"}, {"t": 1502.9666666666667, "x": "有馬温泉、磐光ホテル、\n千日デパート、大洋デパート、川治。"}, {"t": 1507.2166666666667, "x": "これらの火事のあとの国会の記録を、\n全部読んできたのだという。"}, {"t": 1511.0833333333333, "x": "全部？"}, {"t": 1512.2166666666667, "x": "全部だ。そしてこう言った。"}, {"t": 1514.0, "x": "「ほとんど同じ質問をみんながやって、\nそして同じ答えを当局が答えておる」。"}, {"t": 1518.7166666666667, "x": "同じ質問と同じ答え……"}, {"t": 1520.55, "x": "煙で亡くなる人が多い。"}, {"t": 1522.05, "x": "誘導が足りない。設備が足りない。"}, {"t": 1524.2666666666667, "x": "そのあとの手当てをしていない。"}, {"t": 1525.8, "x": "全部に共通していたと。"}, {"t": 1527.4833333333333, "x": "議員はこれを、「条件反射」と呼んだ。"}, {"t": 1529.9666666666667, "x": "大丈夫だと言うと火事が起きる。\nまた大丈夫だと言うと、また起きる。"}, {"t": 1533.95, "x": "川治とニュージャパンは、名前を\n替えるだけで同じ質問が通るとも言った。"}, {"t": 1538.1833333333334, "x": "川治から、1年3か月しかたってないのよね。"}, {"t": 1541.4, "x": "そうだ。"}, {"t": 1542.5333333333333, "x": "長官も、「どこかに\n問題があるということは事実」と認めた。"}, {"t": 1546.35, "x": "この場面には新しい数字が何も出ない。"}, {"t": 1548.8, "x": "それでも、1968年から14年分の会議録が、\nここで1本につながった。"}, {"t": 1554.3666666666666, "x": "今こうして読めるのもその記録が残っているからだ。"}, {"t": 1557.35, "x": "では当の社長は何を語ったのか。"}, {"t": 1560.15, "x": "1982年4月16日。"}, {"t": 1562.7666666666667, "x": "衆議院地方行政委員会に参考人が3人呼ばれた。"}, {"t": 1566.15, "x": "日本ホテル協会の会長国際観光旅館連盟の会長。"}, {"t": 1570.0166666666667, "x": "そして横井英樹 社長だ。"}, {"t": 1572.1833333333334, "x": "ホテル協会の会長はまずおわびを述べた。"}, {"t": 1574.6166666666666, "x": "協会の76年の歴史で、こういう\n火災の死傷者は知る限り初めてだ、と。"}, {"t": 1579.7166666666667, "x": "社長は何を話したの？"}, {"t": 1581.4333333333334, "x": "社長も最初におわびを述べた。"}, {"t": 1583.2666666666667, "x": "「三十三名ものお客様方の\nとうといとうといお命が失われ」。"}, {"t": 1587.0833333333333, "x": "そのあと、ここまで見てきた経緯を話した。"}, {"t": 1589.7166666666667, "x": "赤字のこと、融資のこと、順に進めた工事のことだ。"}, {"t": 1593.35, "x": "2月10日に工事を始める\n予定だったと語ったのも、この日だ。"}, {"t": 1597.3333333333333, "x": "議員さんは納得したの？"}, {"t": 1599.0833333333333, "x": "していない。"}, {"t": 1600.2, "x": "43軒のうち42軒が終わっていた、という\n話が出たのもこの日だ。"}, {"t": 1604.75, "x": "社長は消防の指導にのっとって\n逐次やってきたと答えた。"}, {"t": 1608.2166666666667, "x": "議員は「それが誠意というものか」と返している。"}, {"t": 1611.2, "x": "そして、同じ日にもう1つ、書類の話が出た。"}, {"t": 1614.5166666666667, "x": "ホテルの1981年分の有価証券報告書だ。"}, {"t": 1618.2833333333333, "x": "その朝に大蔵省へ出されたものだった。"}, {"t": 1620.8333333333333, "x": "それに何か書いてあったの？"}, {"t": 1622.6166666666666, "x": "「設備の新設・\n拡充若しくは改修等の計画」という欄がある。"}, {"t": 1626.8333333333333, "x": "そこに書かれた言葉は、「該当事項はありません」。"}, {"t": 1629.85, "x": "えっ工事の予定があったんでしょ？"}, {"t": 1632.0, "x": "議員もそこを突いた。"}, {"t": 1633.3166666666666, "x": "消防への報告は8回。"}, {"t": 1634.85, "x": "投資家への書類は「該当事項はありません」だ。"}, {"t": 1637.85, "x": "社長は書類を押収されたので\n仮決算で出したと説明した。"}, {"t": 1641.5333333333333, "x": "議員はその前の年の報告書も同じ言葉だと重ねた。"}, {"t": 1645.0166666666667, "x": "ただ、この報告書が扱うのは\n1981年の12月31日までだ。"}, {"t": 1650.35, "x": "地下1階の契約は年が明けた1月9日だった。"}, {"t": 1653.6666666666667, "x": "この欄だけで社長の胸の内までは決められない。"}, {"t": 1656.4833333333333, "x": "それでも命令を受けた年の書類に\nその言葉が残っている。"}, {"t": 1660.5166666666667, "x": "この日の質疑にはご遺族の話も出た。"}, {"t": 1663.0, "x": "1982年3月10日に、社長は\n1枚の確認書にサインをしている。"}, {"t": 1667.9833333333333, "x": "個人の財産を処分しても損害を\n賠償すると約束する、という文書だ。"}, {"t": 1672.6166666666666, "x": "私財を投げ出すっていう約束ね。"}, {"t": 1674.7833333333333, "x": "議員がその写しを読み上げ\n社長はサインをしたと認めた。"}, {"t": 1678.0, "x": "このときまでに補償が済んだのは、\n7割以上と社長は述べた。"}, {"t": 1681.7166666666667, "x": "台湾の方12人と韓国の方8人の全員、\n日本のご遺族の約3分の1だという。"}, {"t": 1687.4166666666667, "x": "残りの方は？"}, {"t": 1688.5833333333333, "x": "遺族会が社長を告訴していた。"}, {"t": 1690.65, "x": "社長は自分の不徳のいたすところだと答えている。"}, {"t": 1693.6666666666667, "x": "ある議員は、不動産だけで\n410億円以上の資産があると指摘した。"}, {"t": 1698.05, "x": "社長は、収入はほとんど無く、私財と\n関係会社のお金で払っていると述べた。"}, {"t": 1702.95, "x": "賠償の保険についても、\n2月の委員会で質問が出ていた。"}, {"t": 1706.7166666666667, "x": "入っていたのは1億5800万円ほどだという。"}, {"t": 1709.8, "x": "これは新聞の報道をもとにした\n質問で、議員もそう断っている。"}, {"t": 1713.7833333333333, "x": "別の議員は社長にこう言った。"}, {"t": 1715.6666666666667, "x": "「あなたの残念無念と\n遺族の残念無念、これは質が違う」。"}, {"t": 1719.45, "x": "……そうね。"}, {"t": 1720.5833333333333, "x": "補償の最後の金額は\n確かめていないので、ここでは言わない。"}, {"t": 1724.8, "x": "この4月にはもう1つ結果が出ていた。"}, {"t": 1727.25, "x": "捜査本部から鑑定を頼まれた東京理科大学の実験だ。"}, {"t": 1730.95, "x": "同じ条件で同じ部屋を作り燃やしてみた。"}, {"t": 1733.75, "x": "同じ部屋を作ったの？"}, {"t": 1735.3333333333333, "x": "そう国会で紹介されている。"}, {"t": 1737.15, "x": "スプリンクラーをつけた条件では\nまず報知機が作動した。"}, {"t": 1740.3666666666666, "x": "天井のスプリンクラーから水が出た。"}, {"t": 1742.5666666666666, "x": "火はシーツを焦がしただけで消えた。"}, {"t": 1744.6833333333334, "x": "シーツだけ？"}, {"t": 1745.8166666666666, "x": "議員の説明ではそういう結果だった。"}, {"t": 1748.1, "x": "報知機の配管が外れていなければ、\n早く気づけたことも分かった。"}, {"t": 1752.1333333333334, "x": "参考人席の社長は、まだその話を\n聞いていないと答えている。"}, {"t": 1756.1, "x": "この実験の中身は後の判断にも重なってくる。"}, {"t": 1759.25, "x": "最高裁の決定はこう書いた。"}, {"t": 1761.2, "x": "スプリンクラーがあれば、炎が天井を\n伝い始めたころに作動し、火を鎮める。"}, {"t": 1765.8666666666666, "x": "「同室以外の区域に火災が\n拡大することはなかった」。"}, {"t": 1769.1833333333334, "x": "特段の事情がない限り、という\n前置きつきで、そう認めた。"}, {"t": 1772.9333333333334, "x": "区切りの工事でも同じだ。"}, {"t": 1774.55, "x": "出火した部屋を含む3室ほどが、\n燃えない壁で囲まれていたはずだ。"}, {"t": 1778.9, "x": "どちらか1つでよかったのよね。"}, {"t": 1781.0, "x": "1974年の法律が求めたのは、\nまさにその「どちらか」だった。"}, {"t": 1785.9166666666667, "x": "5年の猶予と、さらに3年近い時間があった。"}, {"t": 1789.0, "x": "火が出たのはその8年目の冬だ。"}, {"t": 1791.8, "x": "社長は業務上過失致死傷の罪に問われた。"}, {"t": 1794.6166666666666, "x": "火を出したのは本人ではない。"}, {"t": 1796.3666666666666, "x": "問われたのは会社のトップとしての責任だ。"}, {"t": 1799.1666666666667, "x": "火をつけてなくても責任を問われるの？"}, {"t": 1801.6, "x": "そこが争われた。"}, {"t": 1802.8666666666666, "x": "1987年5月20日、東京地裁の判決があった。"}, {"t": 1807.1666666666667, "x": "1990年に東京高裁も禁錮3年の実刑を支持した。"}, {"t": 1811.4, "x": "そして1993年11月25日、\n最高裁第二小法廷が上告を退けた。"}, {"t": 1817.3833333333334, "x": "火事から11年9か月がたっていた。"}, {"t": 1819.8666666666666, "x": "決定の理由はここまで見た事実をそのまま使っている。"}, {"t": 1823.1166666666666, "x": "社長は実質的な権限を持っていた。"}, {"t": 1825.5666666666666, "x": "防火の仕事を人に任せていても\n指揮監督する立場にある。"}, {"t": 1829.2666666666667, "x": "不備を知っていたので、危険を\n「容易に予見できた」。"}, {"t": 1832.3666666666666, "x": "工事や訓練をしていれば結果を避けられた。"}, {"t": 1835.0333333333333, "x": "知らなかったとは言えないのね。"}, {"t": 1836.8833333333334, "x": "文書と報告が残っていたからだ。"}, {"t": 1839.0833333333333, "x": "4通の文書と8回の報告は、\n火事の前には工事を終わらせなかった。"}, {"t": 1843.4, "x": "火事のあとには社長の認識を示す記録になった。"}, {"t": 1846.4666666666667, "x": "防火管理者だった人にも\n執行猶予つきの判決が出ている。"}, {"t": 1850.15, "x": "その人の名前は出さない。"}, {"t": 1851.8166666666666, "x": "社長が命令書を受けたのは1981年だが、\n認識の起点はそこではない。"}, {"t": 1856.9833333333333, "x": "就任した1979年の時点からという判断だった。"}, {"t": 1860.95, "x": "社長はその後亡くなり、\n2000年の会議録には「故」とついている。"}, {"t": 1865.6333333333334, "x": "では火事のあと、仕組みは変わったのか。"}, {"t": 1868.0166666666667, "x": "消防庁は2月10日付で全国の消防へ通達を出した。"}, {"t": 1871.65, "x": "工事が始まるはずだったあの日付だ。"}, {"t": 1874.0666666666666, "x": "同じ日なのね。"}, {"t": 1875.2666666666667, "x": "偶然だ。そこに意味は足さない。"}, {"t": 1877.2833333333333, "x": "中身は、ためらわずに命令し、\n公表し、告発しろというもの。"}, {"t": 1881.3, "x": "4月8日には緊急是正要綱という通達も出た。"}, {"t": 1884.4833333333333, "x": "マークの無い宿に早く法の手続きを取れという内容だ。"}, {"t": 1887.7333333333333, "x": "全国の数字も、4月に発表された。"}, {"t": 1890.4166666666667, "x": "対象は1万6354軒。"}, {"t": 1892.8333333333333, "x": "マークがあるのは6991軒。"}, {"t": 1895.5666666666666, "x": "半分もないの？"}, {"t": 1896.7833333333333, "x": "3月末の時点で、42.7％だ。"}, {"t": 1900.0666666666666, "x": "消防庁は交付の済んだ所に限れば約53％と説明した。"}, {"t": 1904.5166666666667, "x": "それでも半分近くに何かの不備があった。"}, {"t": 1907.1166666666666, "x": "防火の区切りの不備が約29％。"}, {"t": 1909.5833333333333, "x": "訓練の違反が26％。"}, {"t": 1911.7833333333333, "x": "ニュージャパンの問題点と、\n同じ項目が上位に並んでいる。"}, {"t": 1915.4, "x": "1軒だけの話じゃなかったのね。"}, {"t": 1917.65, "x": "そうだ。43軒のうちの1軒というのは、\nスプリンクラーの工事の話だ。"}, {"t": 1922.4, "x": "どちらの数字も当時の国会の記録に残っている。"}, {"t": 1926.0833333333333, "x": "最初に出てきた看板の話に戻ろう。"}, {"t": 1928.55, "x": "政府登録の国際観光ホテルは\n当時全国に439軒あった。"}, {"t": 1933.1, "x": "泊まる人は年間420万人と、国会で言われている。"}, {"t": 1936.8333333333333, "x": "議員は、登録を取り消すべきではないかと\n運輸大臣に迫った。"}, {"t": 1940.7166666666667, "x": "国が登録したんだから取り消せるんでしょ？"}, {"t": 1943.3333333333333, "x": "それがすぐにはできなかった。"}, {"t": 1945.0666666666666, "x": "この法律は戦後、外国のお客を迎える\nホテルを増やすために作られた。"}, {"t": 1949.45, "x": "登録の中心は部屋の広さや\n外国のお客に向いた設備だ。"}, {"t": 1953.1666666666667, "x": "防災は消防法や建築基準法に任せる形になっていた。"}, {"t": 1957.0, "x": "運輸省の担当者はこう認めている。"}, {"t": 1959.2166666666667, "x": "消防法に合わない状態が\n長く続くことは、法律の前提に無かった。"}, {"t": 1963.5833333333333, "x": "しかし現実には、そのままの状態が長くあった、と。"}, {"t": 1967.1666666666667, "x": "看板と消防は別々に動いてたのね。"}, {"t": 1969.8, "x": "そうだ。"}, {"t": 1970.9333333333334, "x": "消防法に合わないというだけでは、\n取り消す作りになっていない。"}, {"t": 1974.5166666666667, "x": "法律が見ているのは経営が\n確実で健全かどうかだった。"}, {"t": 1977.95, "x": "だから大臣も、経営の問題として\n取り消しを考えると答えた。"}, {"t": 1981.9333333333334, "x": "登録で国に損害賠償の問題が特に生まれるとは\n考えていない、という答弁もある。"}, {"t": 1987.0666666666666, "x": "泊まる人から見れば看板は1枚だ。"}, {"t": 1989.4, "x": "役所の中では別々の法律の仕事だった。"}, {"t": 1992.9333333333334, "x": "最後に確かめられた日付だけを並べ直そう。"}, {"t": 1995.7166666666667, "x": "1974年、法律が変わる。"}, {"t": 1998.3, "x": "1977年2月28日、消防の1通目。"}, {"t": 2002.3, "x": "1979年3月31日、法律の期限と2通目。"}, {"t": 2006.8166666666666, "x": "1979年5月28日、社長の就任。"}, {"t": 2010.6166666666666, "x": "1980年2月16日と8月、3通目と4通目。"}, {"t": 2015.0333333333333, "x": "1981年5月、適マークの開始。"}, {"t": 2018.25, "x": "1981年9月11日、措置命令。"}, {"t": 2021.7, "x": "1981年10月22日、8回目の報告。"}, {"t": 2025.7, "x": "1982年2月8日、午前3時16分ごろの出火。"}, {"t": 2030.05, "x": "1982年2月10日、工事の予定日。"}, {"t": 2033.3166666666666, "x": "1982年9月11日、命令の期限。"}, {"t": 2036.8, "x": "1993年11月25日、最高裁の決定。"}, {"t": 2041.0833333333333, "x": "火事のあとにも予定の日付が残ってるのね。"}, {"t": 2043.85, "x": "2月10日と9月11日は誰も使わなかった日付だ。"}, {"t": 2047.4666666666667, "x": "5年の間に工事が進む機会は何度もあった。"}, {"t": 2050.4, "x": "止める手もあった。その手は、\nこのホテルには抜かれなかった。"}, {"t": 2053.9, "x": "断っておくが消防を責めて終わりたいわけではない。"}, {"t": 2056.75, "x": "最高裁が責任を認めたのは経営者だ。"}, {"t": 2059.4166666666665, "x": "消防は何度も足を運び文書を残した。"}, {"t": 2062.0, "x": "その文書があったから今この順番をたどれる。"}, {"t": 2064.766666666667, "x": "でも文書があっても火は止まらなかった。"}, {"t": 2067.1833333333334, "x": "止まらなかった。"}, {"t": 2068.233333333333, "x": "泊まる人に見えない約束は泊まる人を守らなかった。"}, {"t": 2071.5, "x": "スプリンクラーはふだんは\n天井の小さな金具でしかない。"}, {"t": 2074.65, "x": "旅先でそれを見かけたら誰かが工事を終わらせた印だ。"}, {"t": 2078.05, "x": "亡くなった33人の方のご冥福をお祈りします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
