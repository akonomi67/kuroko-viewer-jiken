<script>
const D={"name": "144", "file": "144_編集用", "dur": 2080.91665625, "segs": [], "subs": [{"t": 0.0, "x": "1982年2月10日。"}, {"t": 2.283333333333333, "x": "東京・永田町の大きなホテルで、\n工事が始まる予定だった。"}, {"t": 5.966666666666667, "x": "スプリンクラーを中心にした防災の工事だ。"}, {"t": 8.616666666666667, "x": "業者との契約ももう終わっていた。"}, {"t": 10.8, "x": "いい話じゃない。"}, {"t": 11.966666666666667, "x": "その工事は始まらなかった。"}, {"t": 13.8, "x": "2日前の2月8日、午前3時すぎに火が出たからだ。"}, {"t": 17.35, "x": "ホテルの名前はホテルニュージャパン。"}, {"t": 19.216666666666665, "x": "火が出たのは9階。工事が\n始まるはずの地下1階の、ずっと上だ。"}, {"t": 23.383333333333333, "x": "33人が亡くなり、34人がけがをした。"}, {"t": 26.633333333333333, "x": "工事があと2日だけ間に合わなかったの？"}, {"t": 29.15, "x": "そう聞こえるだろう。"}, {"t": 30.25, "x": "だが記録を並べると、2日の話ではなくなる。"}, {"t": 33.36666666666667, "x": "消防がホテルへ出した文書が4通。"}, {"t": 35.6, "x": "ホテルが消防へ出した報告が8回。"}, {"t": 37.95, "x": "最初の文書の日付は、1977年2月28日だ。"}, {"t": 42.583333333333336, "x": "それって、火事の5年も前じゃない。"}, {"t": 44.85, "x": "そうだ。"}, {"t": 45.983333333333334, "x": "今回は、この5年間の日付を順番に追っていく。"}, {"t": 49.166666666666664, "x": "亡くなった方の最後の様子は\n語らない。お名前も出さない。"}, {"t": 52.7, "x": "見ていくのは、日付と数字だけだ。"}, {"t": 64.3, "x": "まず、場所と建物を見ておこう。"}, {"t": 66.31666666666666, "x": "住所は東京都千代田区永田町。"}, {"t": 68.45, "x": "ある議員は国会で、この場所を\n「隣組のようなところ」と呼んだ。"}, {"t": 72.56666666666666, "x": "国会のご近所さんなのね。"}, {"t": 74.46666666666667, "x": "同じ質問の中で、\n「議事堂のおひざ元」とも言われている。"}, {"t": 78.1, "x": "建物は地上10階、地下2階。"}, {"t": 80.31666666666666, "x": "最高裁の決定は、形を「Ｙ字三差型」と書いている。"}, {"t": 84.25, "x": "3つの翼が真ん中でつながる形だ。"}, {"t": 86.96666666666667, "x": "廊下が三つまたになってるの？"}, {"t": 88.85, "x": "そうだ。国会でも逃げ場が\n分かりにくい形だと言われた。"}, {"t": 92.25, "x": "客室は約420室で、宿泊定員は約782人。"}, {"t": 96.8, "x": "貸し事務所やアパートとして使う\n部屋も、同じ建物に入っていた。"}, {"t": 100.83333333333333, "x": "そして、ここは政府に登録された\n国際観光ホテルだった。"}, {"t": 104.7, "x": "それって、国のお墨付きみたいなもの？"}, {"t": 107.25, "x": "泊まる側にはそう見えた。"}, {"t": 108.75, "x": "火事のあと、台湾から来た\n人たちの声が国会で紹介された。"}, {"t": 112.7, "x": "「政府登録」の看板を信用して\n泊まったのに、という声だ。"}, {"t": 116.43333333333334, "x": "看板の話はあとでまた出てくる。"}, {"t": 119.16666666666667, "x": "話は1974年までさかのぼる。"}, {"t": 121.95, "x": "その少し前に大きな建物の火事が続いていた。"}, {"t": 125.03333333333333, "x": "1972年の大阪・千日デパート。"}, {"t": 128.1, "x": "1973年の熊本・大洋デパート。"}, {"t": 130.93333333333334, "x": "それを受けて、1974年に消防法が改められた。"}, {"t": 134.95, "x": "何が変わったの？"}, {"t": 136.23333333333332, "x": "すでに建っている建物にも、\nスプリンクラーを求めることになった。"}, {"t": 140.11666666666667, "x": "ふつう法律は、これから建てる物に当てるものだ。"}, {"t": 143.08333333333334, "x": "それを前に建てた物にも当てたわけだ。"}, {"t": 145.51666666666668, "x": "いきなり全部つけろって言われても大変よね。"}, {"t": 148.25, "x": "だから5年の猶予がついた。"}, {"t": 149.98333333333332, "x": "期限は1979年3月31日。"}, {"t": 153.33333333333334, "x": "消防庁長官はこう説明している。"}, {"t": 155.61666666666667, "x": "「相当大きな資金も\n要りましょうし、あるいは時間的余裕も要る」。"}, {"t": 159.25, "x": "そこで5年の猶予期間を置いた、と。"}, {"t": 161.51666666666668, "x": "スプリンクラーの代わりに別の道も用意された。"}, {"t": 164.23333333333332, "x": "建物を細かく火を通さない壁と扉で区切るやり方だ。"}, {"t": 167.73333333333332, "x": "代替防火区画という。"}, {"t": 169.3, "x": "スプリンクラーか、区切りか。"}, {"t": 170.91666666666666, "x": "どちらかをやればよかった。"}, {"t": 172.5, "x": "長官によれば、大方の旅館・\nホテルは猶予の間に工事を済ませた。"}, {"t": 176.7, "x": "じゃあ、ニュージャパンは？"}, {"t": 178.08333333333334, "x": "ここから日付が始まる。"}, {"t": 180.36666666666667, "x": "1通目の日付は、1977年2月28日だ。"}, {"t": 184.58333333333334, "x": "地元の麹町消防署の署長から当時の社長あて。"}, {"t": 187.88333333333333, "x": "スプリンクラーなどをつけるようにという文書だった。"}, {"t": 190.73333333333332, "x": "5年の猶予のうち、もう3年たってるじゃない。"}, {"t": 193.56666666666666, "x": "火事のあと、国会でも同じことを聞かれている。"}, {"t": 196.36666666666667, "x": "ある議員は「三年間を空費していた」と質した。"}, {"t": 199.58333333333334, "x": "長官の答えは短い。"}, {"t": 201.13333333333333, "x": "文書で出したのは52年で、それが\n「公式な文書としては初めて」。"}, {"t": 205.7, "x": "52年って、昭和のこと？"}, {"t": 207.81666666666666, "x": "昭和52年、1977年のことだ。"}, {"t": 211.05, "x": "その前の3年間のやり取りは、\n長官も詳しくは知らないと答えた。"}, {"t": 215.23333333333332, "x": "公式の文書としては、この1通が最初になる。"}, {"t": 218.41666666666666, "x": "ホテルはどう返事したの？"}, {"t": 220.08333333333334, "x": "3か月後の5月28日に、報告を出している。"}, {"t": 223.5, "x": "これが8回ある報告の1回目だ。"}, {"t": 225.76666666666668, "x": "2回目は翌年の4月25日。"}, {"t": 228.06666666666666, "x": "この2回で工事が終わったわけではない。"}, {"t": 230.31666666666666, "x": "残りの時間はそのまま減っていった。"}, {"t": 233.16666666666666, "x": "1979年に入ると、日付の間隔が急に詰まる。"}, {"t": 237.26666666666668, "x": "3月16日に、3回目の報告。"}, {"t": 239.98333333333332, "x": "3月28日に、4回目の報告。"}, {"t": 242.93333333333334, "x": "12日で2回も？"}, {"t": 244.41666666666666, "x": "そして3月31日が法律の期限だ。"}, {"t": 247.35, "x": "消防はその日に、2通目の文書を出している。"}, {"t": 250.16666666666666, "x": "宛先はやはり当時の社長だった。"}, {"t": 252.31666666666666, "x": "この日が猶予の最後の日だと、念を押す中身だ。"}, {"t": 255.46666666666667, "x": "それで、その日までに工事は終わったの？"}, {"t": 257.98333333333335, "x": "終わっていない。"}, {"t": 259.1166666666667, "x": "ここが大事なところだ。"}, {"t": 260.6, "x": "3月31日を過ぎたホテルは、\n法律の基準を満たさない建物になった。"}, {"t": 265.48333333333335, "x": "ただ、それで営業が止まるわけではない。"}, {"t": 267.8333333333333, "x": "お客は昨日までと同じように泊まれる。"}, {"t": 270.2, "x": "張り紙も何も出ないの？"}, {"t": 271.8666666666667, "x": "この時点では、お客に知らせる仕組みがまだ無かった。"}, {"t": 275.06666666666666, "x": "のちに議員も\n「利用者は何一つ知らない」と言っている。"}, {"t": 278.48333333333335, "x": "それから1か月後の5月1日に、5回目の報告が出た。"}, {"t": 282.28333333333336, "x": "そしてこの5月、ホテルの社長が替わる。"}, {"t": 285.5, "x": "1979年5月28日。"}, {"t": 288.31666666666666, "x": "横井英樹 社長がホテルの代表取締役に就いた。"}, {"t": 292.06666666666666, "x": "のちに本人が、国会でいきさつを述べている。"}, {"t": 294.9, "x": "親会社の経営が悪くなり、\n頼まれて引き受けたのだという。"}, {"t": 298.4166666666667, "x": "資本金は7億2100万円。"}, {"t": 300.5833333333333, "x": "累積の赤字は、30数億円あったそうだ。"}, {"t": 303.65, "x": "火の車だったのね。"}, {"t": 305.1666666666667, "x": "本人の言い分ではそうなる。"}, {"t": 306.85, "x": "消防は社長が替わったとき、すぐに\n新しい計画を出すよう指示した。"}, {"t": 311.05, "x": "スプリンクラーが無いことも伝えている。"}, {"t": 313.23333333333335, "x": "これは消防庁の担当者が国会で答えたことだ。"}, {"t": 316.45, "x": "じゃあ、新しい社長も知ってたわけね。"}, {"t": 318.93333333333334, "x": "最高裁の決定もはっきりそう書いている。"}, {"t": 321.45, "x": "工事が終わっていないことを、\n「社長就任当時から」認識していた、と。"}, {"t": 325.85, "x": "別の議員はもう1つ共通点を指摘した。"}, {"t": 328.5833333333333, "x": "川治のホテルも、経営者が\n替わって間もない火事だった、と。"}, {"t": 332.15, "x": "工事のお金を負いきれない建物が、売りに出る。"}, {"t": 334.95, "x": "買った側は資産として持つ。"}, {"t": 336.75, "x": "議員はそういう形を心配した。"}, {"t": 338.81666666666666, "x": "これは議員の見方で、決まった事実ではない。"}, {"t": 342.15, "x": "お金が無いなら、どこかで借りられなかったの？"}, {"t": 344.98333333333335, "x": "社長はそこを国会でこう説明した。"}, {"t": 347.31666666666666, "x": "工事のために政府系の日本開発銀行へ頼みに行った。"}, {"t": 350.8, "x": "ところが、自分が社長になる3\nか月前に猶予が切れていた。"}, {"t": 354.56666666666666, "x": "そのため特別融資の道が完全に閉ざされてしまった。"}, {"t": 358.0, "x": "普通の銀行も、成績が悪いので思うように貸さない。"}, {"t": 361.31666666666666, "x": "本人の言葉では「悪戦苦闘の連続」だった。"}, {"t": 364.71666666666664, "x": "3か月の差か。なんだか気の毒な気も……"}, {"t": 367.51666666666665, "x": "そう聞こえる話し方ではある。"}, {"t": 369.3, "x": "別の議員がすぐ2つの例を出した。"}, {"t": 371.56666666666666, "x": "1つは近くの都市センターホテル。"}, {"t": 373.68333333333334, "x": "こちらは防災の設備に約4億円をかけて工事をした。"}, {"t": 377.0833333333333, "x": "もう1つは横浜のシルクホテル。"}, {"t": 379.2, "x": "スプリンクラーをつける\nお金が無いので廃業したという。"}, {"t": 382.35, "x": "やれないならやめたホテルもあったのね。"}, {"t": 384.6166666666667, "x": "議員の言い方はこうだ。"}, {"t": 386.05, "x": "資金難だからといって、「経営者として\n絶対許されることではないのではないか」。"}, {"t": 390.6333333333333, "x": "工事の費用について、社長は約10億円と答えている。"}, {"t": 394.06666666666666, "x": "買収の費用を議員は約100億円と言い、\n社長はそんなに少なくないと答えた。"}, {"t": 398.8, "x": "のちの最高裁は、この点をひとことで書いた。"}, {"t": 401.6666666666667, "x": "工事は「資金的にもその実施が十分可能であった」。"}, {"t": 405.65, "x": "では社長は、工事を全くしなかったのか。"}, {"t": 408.31666666666666, "x": "これも本人の陳述を並べてみよう。"}, {"t": 410.6, "x": "1979年に、スプリンクラー用の本管と\n4階・7階の隔壁。"}, {"t": 415.51666666666665, "x": "1980年に、スプリンクラーを1階と2階へ一部設置。"}, {"t": 419.6, "x": "1981年に、2階の大宴会場と廊下の防災工事。"}, {"t": 423.98333333333335, "x": "けっこうやってるじゃない。"}, {"t": 425.43333333333334, "x": "下の階はそうだな。"}, {"t": 426.76666666666665, "x": "ただ客室のある4階から上で区切りが\n済んだのは、4階と7階だけだ。"}, {"t": 431.28333333333336, "x": "9階と10階にはスプリンクラーも区切りも無かった。"}, {"t": 434.48333333333335, "x": "火が出たのは、9階だったわよね。"}, {"t": 436.78333333333336, "x": "そうだ。"}, {"t": 437.9166666666667, "x": "消防庁長官は、当時の工事の様子をこう答えている。"}, {"t": 441.3, "x": "「警告をいたしますとちょっと工事が始まる」。"}, {"t": 443.8833333333333, "x": "「始まってやがてまた見に行くと\n工事がとまっておる」。"}, {"t": 446.73333333333335, "x": "「また警告する、またやり出す」。"}, {"t": 448.8666666666667, "x": "ちょっとずつ動いては止まるのね。"}, {"t": 450.81666666666666, "x": "議員は同じことをもっと硬い言葉で言った。"}, {"t": 453.4, "x": "「指導書に対する回答を小出しにしていて\n時間稼ぎをしていた」。"}, {"t": 457.06666666666666, "x": "そのやり方に消防署が乗ってしまったという批判だ。"}, {"t": 460.15, "x": "もう1つ、国会で取り上げられた話がある。"}, {"t": 462.96666666666664, "x": "2階のスプリンクラーの多くが、水の管に\nつながっていないという指摘だ。"}, {"t": 467.21666666666664, "x": "社長は「ちゃんとパイプに\n直結しております」と答えた。"}, {"t": 470.73333333333335, "x": "つながっていないのは、\n1階のテナントの分だと説明している。"}, {"t": 474.4166666666667, "x": "どちらが正しいかは、\nこの日の会議録だけでは決められない。"}, {"t": 478.55, "x": "工事と並んで、もう1つ細っていった物がある。"}, {"t": 481.56666666666666, "x": "防火のための毎年のお金と人だ。"}, {"t": 483.9, "x": "最高裁の決定にはこう書かれている。"}, {"t": 486.2, "x": "「少額の支出に至るまで社長決裁を要求」。"}, {"t": 489.06666666666666, "x": "「極端な支出削減方針を採っていた」。"}, {"t": 491.81666666666666, "x": "少額って、どのくらいなの？"}, {"t": 493.76666666666665, "x": "議員は、1万円以上は社長の決裁だったと述べている。"}, {"t": 497.23333333333335, "x": "そのため、専門の業者による\n点検や修理が行われなかった。"}, {"t": 501.1666666666667, "x": "防火戸は、火事のときに自動で\n閉まらない物が多くなった。"}, {"t": 504.6333333333333, "x": "非常放送の設備も一部が使えなくなっていた。"}, {"t": 507.7, "x": "壊れたまま放っておかれたのね。"}, {"t": 509.75, "x": "人も減っている。"}, {"t": 510.9, "x": "社長が雑誌に語った数字が国会で読み上げられた。"}, {"t": 514.05, "x": "自分が来てから、従業員は350人から150人になった。"}, {"t": 518.2833333333333, "x": "これからも少数精鋭でいく、と。"}, {"t": 520.3333333333334, "x": "消防庁によれば、火事のころの従業員は140人。"}, {"t": 523.75, "x": "少し大きい都内のホテルは約600人だった。"}, {"t": 526.8166666666667, "x": "4分の1じゃない。"}, {"t": 528.1666666666666, "x": "消防庁の担当者も、4分の1と答えている。"}, {"t": 531.3333333333334, "x": "社長は、足りない分はガードマンや\nアルバイトで補ったと述べた。"}, {"t": 534.9166666666666, "x": "ただ、消防に出した計画は、減った\n人数に合わせて直されなかった。"}, {"t": 539.2333333333333, "x": "訓練もほとんど行われなくなった。"}, {"t": 541.4333333333333, "x": "1980年は1度もやっていない。"}, {"t": 544.6166666666667, "x": "時計を、1980年に戻そう。"}, {"t": 547.25, "x": "3通目の文書は、2月16日に出された。"}, {"t": 550.2666666666667, "x": "今度の宛先は横井英樹 社長だ。"}, {"t": 552.9666666666667, "x": "計画がかなり遅れているので、\n新しい計画を出せという内容だった。"}, {"t": 557.3, "x": "返事は来たの？"}, {"t": 558.5166666666667, "x": "すぐには来ない。"}, {"t": 559.5333333333333, "x": "4通目は同じ年の8月に出た。"}, {"t": 561.8666666666667, "x": "古い建物に求められた設備について、\n具体的な計画を立てろと求めた。"}, {"t": 566.6833333333333, "x": "それでようやく、6回目の報告が8月25日に出る。"}, {"t": 570.3666666666667, "x": "前の報告から、1年3か月あまりあいていた。"}, {"t": 573.6166666666667, "x": "その間は、消防も見に来てたんでしょ？"}, {"t": 576.1833333333333, "x": "検査は年に2回、続いていた。"}, {"t": 578.4833333333333, "x": "最高裁の決定によれば、1979年7月からは\n毎月のように工事を促している。"}, {"t": 584.5, "x": "ある議員の数え方では、\n社長の就任から立入検査が5回あった。"}, {"t": 588.65, "x": "文書と検査を合わせると、消防は\nかなりの回数、足を運んでいる。"}, {"t": 592.9, "x": "なのに、何も変わらなかったの？"}, {"t": 595.05, "x": "文書には強い力が無かった。"}, {"t": 597.0833333333334, "x": "指導書には法律で従わせる力が無い。"}, {"t": 599.7, "x": "これは国会の質問でも言われている。"}, {"t": 601.9333333333333, "x": "強い手続きは別にあったが、まだ使われていない。"}, {"t": 605.0166666666667, "x": "そうしている間に、別の場所で火事が起きた。"}, {"t": 608.4333333333333, "x": "1980年11月20日。"}, {"t": 610.8, "x": "栃木県の川治プリンスホテルで火事が起きた。"}, {"t": 613.6333333333333, "x": "死者は45人だった。"}, {"t": 615.2666666666667, "x": "消防庁は全国の旅館とホテルの一斉点検に動いた。"}, {"t": 618.7666666666667, "x": "翌年の1月にも調査をして、その結果を\n踏まえて強く指導している。"}, {"t": 623.1833333333333, "x": "命令に従わない悪質なところには、\n告発も辞さない、という中身だ。"}, {"t": 627.7833333333333, "x": "今度こそ本気になったのね。"}, {"t": 629.75, "x": "もう1つ、新しい仕組みもできた。"}, {"t": 632.0666666666667, "x": "1981年5月に始まった「適マーク」だ。"}, {"t": 635.8666666666667, "x": "消防の基準を満たす旅館・\nホテルに、マークを交付する。"}, {"t": 639.1666666666666, "x": "設備だけでなく、訓練や管理の中身も見る。"}, {"t": 642.1666666666666, "x": "お客さんから見て、安心の印ね。"}, {"t": 644.6666666666666, "x": "これでようやく、お客に見える形ができたわけだ。"}, {"t": 647.6666666666666, "x": "ニュージャパンの答えは、もう分かるだろう。"}, {"t": 650.0166666666667, "x": "もらえなかった？"}, {"t": 651.15, "x": "交付されなかった。"}, {"t": 652.3666666666667, "x": "火事のあった日の国会で、\n東京の数字が読み上げられている。"}, {"t": 655.9166666666666, "x": "対象が961軒。マークを受けたのが\n620軒。残りが341軒。"}, {"t": 661.4833333333333, "x": "その341軒の中にニュージャパンも入る。"}, {"t": 664.6166666666667, "x": "じゃあ、マークが無いホテルはすぐ分かったのね。"}, {"t": 667.3, "x": "そこが難しいところだ。"}, {"t": 668.9166666666666, "x": "341軒の中には、作業の途中という所もあった。"}, {"t": 672.8333333333334, "x": "長官は、不適の所を一律に\n公表するのは難しいと答えている。"}, {"t": 677.15, "x": "そして、政府登録の看板はそのままだった。"}, {"t": 680.7166666666667, "x": "1981年6月3日、7回目の報告が出た。"}, {"t": 684.8166666666667, "x": "そしてこの年の8月20日。"}, {"t": 686.9166666666666, "x": "社長は消防署長に会っている。"}, {"t": 688.8, "x": "これものちに、国会で本人が語った日付だ。"}, {"t": 691.9666666666667, "x": "社長が、初めて直接聞いたってこと？"}, {"t": 694.75, "x": "本人はそのときに聞いたと答えた。"}, {"t": 696.9666666666667, "x": "ある議員がここを細かく問い詰めている。"}, {"t": 699.2, "x": "記者会見では、知ったのは\n1981年7月ごろと言ったそうですね、と。"}, {"t": 704.3833333333333, "x": "社長になったのは2年も前なのに、\n知らなかったのか、と。"}, {"t": 707.9666666666667, "x": "立入検査が5回、指導書が2回あったでしょう、と。"}, {"t": 711.3333333333334, "x": "社長は何て答えたの？"}, {"t": 713.0, "x": "回数は分からないと言った。"}, {"t": 714.5333333333333, "x": "書類は全部押収されている、と。"}, {"t": 716.6666666666666, "x": "そして「昨年の八月二十日」と答えた。"}, {"t": 719.7166666666667, "x": "議員は「いつ知ったかと\n聞いているのです」と重ねた。"}, {"t": 722.9666666666667, "x": "先に見た最高裁の決定はこの言い分を取っていない。"}, {"t": 726.25, "x": "その8月20日には何を話したの？"}, {"t": 728.8166666666667, "x": "これも社長の言い分だが、\n署長の話はこうだったという。"}, {"t": 732.2166666666667, "x": "おたくは上の方に、火が出るところはない。"}, {"t": 734.6333333333333, "x": "まず地下の大きなキッチン、次に\n2階・3階のキッチンをやるように。"}, {"t": 738.55, "x": "9階も、その上の方よね……"}, {"t": 740.6166666666667, "x": "そうだ。客室の階から火が出た。"}, {"t": 742.9, "x": "署長が本当にそう言ったのかは、\nこの答弁だけでは確かめられない。"}, {"t": 746.8833333333333, "x": "ただ社長は、地下から手をつけると説明している。"}, {"t": 749.9, "x": "2月10日の工事が地下1階なのは、\n社長の説明ではそのためだ。"}, {"t": 754.7166666666667, "x": "1981年9月11日。"}, {"t": 757.3666666666667, "x": "ついに東京消防庁は、指導ではなく命令を出す。"}, {"t": 760.5, "x": "消防法第17条の4にもとづく措置命令だ。"}, {"t": 763.5833333333334, "x": "スプリンクラーをつけなさいという命令書だった。"}, {"t": 766.3333333333334, "x": "やっと強い手が出たわけね。"}, {"t": 768.15, "x": "1通目から4年半が過ぎていた。"}, {"t": 770.2666666666667, "x": "そして命令には履行の期限がついた。"}, {"t": 772.5833333333334, "x": "1982年9月11日。"}, {"t": 775.2666666666667, "x": "ちょうど1年後？"}, {"t": 776.4666666666667, "x": "そうだ。1年の猶予だ。"}, {"t": 778.2166666666667, "x": "消防総監によれば、署長と本庁の査察課長が\nオーナーに直接会って指示もした。"}, {"t": 783.3333333333334, "x": "もしこの期限を破れば、次は公表か告発に進む。"}, {"t": 786.7833333333333, "x": "逆に言えば、期限の前なので、\n公表も告発もしていない。"}, {"t": 790.4666666666667, "x": "長官は火事の翌日にこう答えている。"}, {"t": 792.8833333333333, "x": "「まだ一年間の猶予期間の中でございました」。"}, {"t": 795.8833333333333, "x": "じゃあ、火事の日はまだ猶予の途中だったの？"}, {"t": 798.5666666666667, "x": "そうなる。"}, {"t": 799.7, "x": "ある議員はこのことを鋭く突いた。"}, {"t": 801.75, "x": "命令が出ると、そのホテルは1年間、\n公表される立場でなくなる、と。"}, {"t": 806.1666666666666, "x": "もう1つ、後の国会で出た数字がある。"}, {"t": 808.8, "x": "スプリンクラーの工事が残っていたのは、\n東京消防庁の管内に43軒。"}, {"t": 813.4833333333333, "x": "これは議員の調べだ。"}, {"t": 814.85, "x": "そのうち42軒は工事を終え、\n残ったのは1軒だけだという。"}, {"t": 818.7333333333333, "x": "その1軒が……"}, {"t": 819.9, "x": "ニュージャパンだ。"}, {"t": 821.4833333333333, "x": "命令から1か月あまりたった、10月22日。"}, {"t": 824.7, "x": "ホテルから、8回目の報告が届いた。"}, {"t": 827.3, "x": "これが火事の前の最後の文書になる。"}, {"t": 829.5333333333333, "x": "今度の中身はこれまでと少し違っていた。"}, {"t": 832.15, "x": "工事をする予定の業者が\n見積もりを出し、打ち合わせもしていた。"}, {"t": 835.8833333333333, "x": "今度こそ本当にやる、ってこと？"}, {"t": 838.05, "x": "東京消防庁もそう見た。"}, {"t": 839.75, "x": "長官の答弁では、「かなり実現性が\n高いという感触」を得ていた。"}, {"t": 844.0166666666667, "x": "火事の翌日の答弁はこうだ。"}, {"t": 845.9333333333333, "x": "「この二月からいよいよ\n着工するというところへ来ておった」。"}, {"t": 849.15, "x": "9月を完成のめどにしたい、という\n話も来ていたという。"}, {"t": 852.65, "x": "それが2月10日の工事なのね。"}, {"t": 854.8, "x": "そうだ。"}, {"t": 855.9333333333333, "x": "ここで、もう一度8回の報告を並べてみる。"}, {"t": 858.8333333333334, "x": "1977年5月。1978年4月。"}, {"t": 862.9833333333333, "x": "1979年3月に2回。同じ年の5月。"}, {"t": 866.75, "x": "1980年8月。1981年6月。"}, {"t": 870.7333333333333, "x": "1981年10月。"}, {"t": 873.0666666666667, "x": "5年で8回。"}, {"t": 874.25, "x": "長官は「内容的には見るべき\n進捗をいたしておりません」と答えた。"}, {"t": 878.55, "x": "ある議員は、この数字を逆の意味に読んだ。"}, {"t": 881.0333333333333, "x": "回数が多く出たということは、\n「それだけ信憑性がない」。"}, {"t": 884.3833333333333, "x": "同じ10月、消防の再三の指摘で、\nようやく訓練が1回行われた。"}, {"t": 889.05, "x": "最高裁はこの訓練を、\n「形式的な訓練」と書いている。"}, {"t": 893.3166666666667, "x": "ここで、社長の側の記録も見ておこう。"}, {"t": 895.7833333333333, "x": "4月の国会で、社長は\n工事の経過を日付で読み上げた。"}, {"t": 899.4, "x": "1981年7月23日に工事の現場事務所を開いた。"}, {"t": 903.95, "x": "8月20日に工事の着工届を麹町消防署へ出した。"}, {"t": 907.9333333333333, "x": "署長に会ったのと同じ日ね。"}, {"t": 909.85, "x": "そうなる。"}, {"t": 910.9666666666667, "x": "9月末に、2階の大宴会場の工事が完了。"}, {"t": 914.1333333333333, "x": "10月には2階の廊下の工事を終えて、\n消防の立会検査に合格した。"}, {"t": 918.6, "x": "11月には階段の下のシャッター、\n12月には空調のダンパーの工事。"}, {"t": 923.0833333333334, "x": "消防はその間も毎月のように立ち会っている。"}, {"t": 926.0166666666667, "x": "命令のあとは本当に進んでたのね。"}, {"t": 928.4, "x": "1階と2階の話としては、そうだ。"}, {"t": 930.9, "x": "そして1982年1月9日に、\n地下1階の防災工事の契約が結ばれた。"}, {"t": 936.6, "x": "中身はスプリンクラーと防火区画、\n非常照明と誘導灯の設備だ。"}, {"t": 940.7833333333333, "x": "着工の予定は2月10日。"}, {"t": 942.7166666666667, "x": "社長の言ってた工事は、本当にあったんだ。"}, {"t": 945.5333333333333, "x": "あった。そこは記録どおりだ。"}, {"t": 947.3666666666667, "x": "ただ読み上げられた工事の中に、\n客室の階の日付は1つも無い。"}, {"t": 951.4666666666667, "x": "9階と10階の順番は、この表ではまだ来ていない。"}, {"t": 954.7166666666667, "x": "社長の陳述はこういう言い方だった。"}, {"t": 957.0166666666667, "x": "「本年の九月までにはできる\n限りの防災工事をやり終える予定でありました」。"}, {"t": 961.3833333333333, "x": "できる限り、なのね。"}, {"t": 963.0166666666667, "x": "命令の期限までに客室の階がどこまで\n進んだのかは、もう分からない。"}, {"t": 967.9, "x": "ここで、もう1つの数字を見ておこう。"}, {"t": 970.2166666666667, "x": "夜のホテルに、何人いたのかという数字だ。"}, {"t": 972.9666666666667, "x": "ホテルが1976年に消防へ出した\n計画では、夜の自衛消防隊は45人。"}, {"t": 978.5666666666667, "x": "知らせる係、誘導する係、消す\n係が、それぞれ決まっていた。"}, {"t": 982.9833333333333, "x": "45人いれば、なんとかなりそうね。"}, {"t": 985.5166666666667, "x": "人が減っても、この計画は書き換えられなかった。"}, {"t": 988.6, "x": "では火事の夜、実際には何人いたのか。"}, {"t": 991.25, "x": "長官の報告はこうだ。"}, {"t": 992.85, "x": "ホテルの従業員が8人。"}, {"t": 994.4, "x": "委託の警備員が5人。"}, {"t": 995.9333333333333, "x": "テナントで宿直していた人が18人。合わせて31人。"}, {"t": 999.9833333333333, "x": "テナントの人って、ホテルの係じゃないわよね。"}, {"t": 1003.0, "x": "そうだ。議員も「問題にならぬ」と言っている。"}, {"t": 1005.9333333333333, "x": "別の議員は、8人のうち\n起きていたのは4人だと述べた。"}, {"t": 1009.45, "x": "ほかの委員会では別の人数も挙げられている。"}, {"t": 1012.0666666666667, "x": "数え方によって、数字は少し揺れる。"}, {"t": 1014.5666666666667, "x": "ただ、どの数え方でも、ホテルの人は\n届け出の45人に届かない。"}, {"t": 1019.05, "x": "1981年10月に従業員が人員表を\n消防署へ持っていった、という話も出た。"}, {"t": 1024.7833333333333, "x": "受け取ってもらえなかったという指摘だ。"}, {"t": 1027.0166666666667, "x": "長官は承知していないと答え、確認すると述べた。"}, {"t": 1030.3, "x": "さらに議員は、もう1つの話を出している。"}, {"t": 1033.05, "x": "夜11時から朝5時半まで、\n客室の見回りが止められていた、と。"}, {"t": 1037.3666666666666, "x": "社長の命令だった、という説明だ。"}, {"t": 1039.85, "x": "それ、本当なの？"}, {"t": 1041.3, "x": "議員の発言だ。次の答弁で、\n長官はこの点に触れていない。"}, {"t": 1045.2333333333333, "x": "だから、そういう指摘があった、とだけ言っておく。"}, {"t": 1048.2166666666667, "x": "最高裁の決定が認めているのはこうだ。"}, {"t": 1050.75, "x": "当直の人たちは「自衛消防組織として\n編成されて」いなかった。"}, {"t": 1055.15, "x": "これは当直の人の責任ではない。組む側の話だ。"}, {"t": 1059.2333333333333, "x": "1982年2月8日、月曜日の未明。"}, {"t": 1062.5833333333333, "x": "工事の予定日まで、あと2日。"}, {"t": 1064.65, "x": "命令の期限まであと7か月。"}, {"t": 1066.65, "x": "最高裁の決定によれば、午前3時16分から17分ごろ。"}, {"t": 1070.7666666666667, "x": "9階の938号室のベッドから火が出た。"}, {"t": 1073.6833333333334, "x": "原因は、宿泊客のたばこの不始末とされている。"}, {"t": 1077.0833333333333, "x": "たばこ1本から……"}, {"t": 1078.4166666666667, "x": "火は、すぐに見つかった。"}, {"t": 1080.0833333333333, "x": "駆けつけた当直の従業員が消火器を使っている。"}, {"t": 1083.1833333333334, "x": "ベッドの表面の炎はいったん消えた。"}, {"t": 1085.4333333333334, "x": "しかし約1分後に、また燃え上がった。"}, {"t": 1088.0166666666667, "x": "一度は消えたのね。"}, {"t": 1089.3666666666666, "x": "そして部屋のドアは、開いたままだった。"}, {"t": 1091.8333333333333, "x": "ここで、5年間の話がつながってくる。"}, {"t": 1094.4666666666667, "x": "スプリンクラーがあれば、水が出たはずの部屋だ。"}, {"t": 1097.2166666666667, "x": "客室の扉の多くは木でできていた。"}, {"t": 1099.5666666666666, "x": "客室や廊下の壁には、ベニヤ板や\n燃えるクロスが使われていた。"}, {"t": 1103.4833333333333, "x": "管が通る穴の埋め戻しも不完全なままだった。"}, {"t": 1106.45, "x": "火は天井裏や壁のすき間を\n伝って9階と10階へ広がった。"}, {"t": 1110.45, "x": "それって、全部、検査で言われてたこと？"}, {"t": 1113.1833333333334, "x": "消防総監は、スプリンクラーや防火戸のことは\n査察で指摘していたと答えた。"}, {"t": 1117.8833333333334, "x": "火の通り道になった区画の不備は、\n認識していなかった項目に挙げている。"}, {"t": 1122.4166666666667, "x": "ただ最高裁の決定は、管の周りの埋め戻しも\n指摘されていたと書く。"}, {"t": 1126.8333333333333, "x": "どこまで見えていたのかは、資料で言い方が少し違う。"}, {"t": 1130.1, "x": "はっきりしているのは、この階に\n水の出る設備が無かったことだ。"}, {"t": 1134.4666666666667, "x": "では、警報はどうなっていたのか。"}, {"t": 1136.5, "x": "火災報知の設備そのものは各階についていた。"}, {"t": 1139.45, "x": "受信盤は、1階の警備員室にあった。"}, {"t": 1142.0833333333333, "x": "警察庁の担当者の説明はこうだ。"}, {"t": 1144.4833333333333, "x": "「警報スイッチが停止状態となっておりました」。"}, {"t": 1147.2166666666667, "x": "各階のベルは、手でスイッチを\n入れないと鳴らない状態だった。"}, {"t": 1150.85, "x": "どうしてそんなことに？"}, {"t": 1152.3166666666666, "x": "誤作動でベルが鳴るのを嫌う、という話が国会で出た。"}, {"t": 1155.6666666666667, "x": "ある議員は、別の大きなホテルの例を挙げて\nそう質している。"}, {"t": 1159.1, "x": "ニュージャパンの場合の理由は、\n当時まだ調べの途中だった。"}, {"t": 1162.4166666666667, "x": "ここは推測で言わないでおく。"}, {"t": 1164.2166666666667, "x": "非常放送の設備も見ておこう。"}, {"t": 1166.15, "x": "テープレコーダーが2台あった。"}, {"t": 1167.8666666666666, "x": "1台は故障していた。"}, {"t": 1169.3666666666666, "x": "もう1台には、テープが入っていなかった。"}, {"t": 1172.05, "x": "えっ、入ってない？"}, {"t": 1173.4, "x": "第一発見者はマイクで知らせたと話している。"}, {"t": 1176.2833333333333, "x": "しかし、それを聞いたという人は\n当時見つかっていなかった。"}, {"t": 1179.7, "x": "消防総監は、警報ベルの操作を\n従業員が知らなかったとも述べている。"}, {"t": 1184.0, "x": "これも従業員を責める話ではない。"}, {"t": 1186.2, "x": "教える訓練が無かった、という話だ。"}, {"t": 1188.8333333333333, "x": "45人は、届け出の中だけの人数だったのね。"}, {"t": 1192.2166666666667, "x": "最高裁は「組織的な対応ができなかった」と\n書いている。"}, {"t": 1196.6333333333334, "x": "消防が119番で火事を知ったのは、午前3時39分だ。"}, {"t": 1200.7666666666667, "x": "出火から、20分以上たっていた。"}, {"t": 1203.25, "x": "そんなに遅かったの？"}, {"t": 1204.75, "x": "最高裁は「一一九番通報も大幅に遅れる」と書いた。"}, {"t": 1208.5833333333333, "x": "消防は第4出場を命じ、100台を超える車を出した。"}, {"t": 1212.1666666666667, "x": "はしご車は、正面と西側から11台が伸ばされた。"}, {"t": 1215.5833333333333, "x": "ただ正面には、3階と5階の低い\n屋根が張り出していた。"}, {"t": 1219.2166666666667, "x": "そのため、9階と10階にぴったり\n寄せることができなかった。"}, {"t": 1222.9333333333334, "x": "これは消防庁の担当者の答弁だ。"}, {"t": 1225.2, "x": "現場を指揮したのは、\n東京消防庁のトップである消防総監だった。"}, {"t": 1229.3833333333334, "x": "総監はのちに国会で、この火事を\n「人災」と呼んでいる。"}, {"t": 1233.05, "x": "鎮火は、昼の12時36分。"}, {"t": 1235.4166666666667, "x": "焼けた床は4380平方メートル。"}, {"t": 1238.2, "x": "9階と10階が、ほとんどだ。"}, {"t": 1240.35, "x": "亡くなった方は33人を数えた。"}, {"t": 1242.8833333333334, "x": "外国の方も多かったのよね。"}, {"t": 1244.9666666666667, "x": "社長の陳述の中に、台湾の方12人、\n韓国の方8人とある。"}, {"t": 1249.5666666666666, "x": "観光で来日した方の被害が\n大きかったと、国会でも語られた。"}, {"t": 1253.75, "x": "ここで、その夜のことを語るのはやめておく。"}, {"t": 1256.5833333333333, "x": "うん。"}, {"t": 1257.7166666666667, "x": "ご遺族のいる話なので、数字だけを置いておく。"}, {"t": 1260.6, "x": "火事の翌朝には、羽田沖で日本航空の事故が起きた。"}, {"t": 1264.1166666666666, "x": "続けて起きた事故として国会でも並べて語られている。"}, {"t": 1267.45, "x": "そちらは別の回で扱ったのでここでは日付だけにする。"}, {"t": 1270.8333333333333, "x": "この回の舞台はホテルのとなりの国会へ移る。"}, {"t": 1274.25, "x": "2月8日の朝。となりの国会で、\n予算委員会が開かれていた。"}, {"t": 1278.3833333333334, "x": "議題は別の話だったが、質問の前に\nこの火事が取り上げられた。"}, {"t": 1282.5, "x": "9階と10階に\nスプリンクラーが無かったという話がある。"}, {"t": 1285.9, "x": "設置の命令は出していたのか。"}, {"t": 1287.8, "x": "消防庁長官は答えた。"}, {"t": 1289.55, "x": "「昨年の九月十一日に消防法の規定に\n基づきます措置命令を発しております」。"}, {"t": 1294.7333333333333, "x": "火事の当日にもう命令の話が出たのね。"}, {"t": 1297.5166666666667, "x": "総理大臣も原因を調べて厳正な措置をとると述べた。"}, {"t": 1300.9, "x": "翌9日の委員会で長官は詳しい経過を報告した。"}, {"t": 1304.35, "x": "ここで4回と8回の数字が出た。"}, {"t": 1306.6, "x": "ある議員がすぐに質問した。"}, {"t": 1308.4333333333334, "x": "命令を出しっ放しで罰則を使わないのはどうなのか。"}, {"t": 1311.5666666666666, "x": "長官の答えはさっきの猶予の話だ。"}, {"t": 1314.0333333333333, "x": "そして、出しっ放しでは\n「もとよりこれはいけない」と言った。"}, {"t": 1317.7666666666667, "x": "でも、出しっ放しに見えるわよね。"}, {"t": 1320.0166666666667, "x": "見えるだろう。"}, {"t": 1321.1333333333334, "x": "別の議員は公表はしたのかと尋ねた。"}, {"t": 1323.6, "x": "答えは、まだ猶予の中だから、していない。"}, {"t": 1326.3333333333333, "x": "こうして公表の仕組みは、\nこのホテルには1度も使われなかった。"}, {"t": 1330.15, "x": "委員会の議員たちは、2月11日に\n現場も見に行っている。"}, {"t": 1333.8333333333333, "x": "そして2月16日、長い質疑が始まった。"}, {"t": 1337.6333333333334, "x": "2月16日の衆議院地方行政委員会。"}, {"t": 1340.45, "x": "最初の議員がこう切り出した。"}, {"t": 1342.2833333333333, "x": "措置命令に至るまでの期間を、\nもう少し短くできなかったのか。"}, {"t": 1346.3166666666666, "x": "それがあれば防げたかもしれない。"}, {"t": 1348.3666666666666, "x": "野党の議員さん？"}, {"t": 1349.5666666666666, "x": "いや、与党の議員だ。"}, {"t": 1351.0, "x": "長官は消防は法の中で努力したと答えた。"}, {"t": 1353.9166666666667, "x": "そのうえでこう続けた。"}, {"t": 1355.3666666666666, "x": "「余りにもその期間が長過ぎたではないかという\n御批判は、厳しく受けとめなければならぬ」。"}, {"t": 1360.6, "x": "認めたのね。"}, {"t": 1361.7666666666667, "x": "別の議員の質問にはもっと強い言葉も出た。"}, {"t": 1364.6833333333334, "x": "「のんべんだらりと指示のしっ放しというのは、\n私は行政措置としては最もいけない」。"}, {"t": 1369.65, "x": "これは長官自身の言葉だ。"}, {"t": 1371.6166666666666, "x": "のんべんだらりって国会で言うんだ。"}, {"t": 1373.7166666666667, "x": "会議録にそのまま残っている。"}, {"t": 1375.65, "x": "別の議員はもっと具体的に並べた。"}, {"t": 1378.0166666666667, "x": "防火区画が無い。カーテンに\n防炎の加工が無い。訓練が無い。"}, {"t": 1381.6666666666667, "x": "ベルが鳴らない。放送も使えない。"}, {"t": 1383.7833333333333, "x": "議員はこれを「一から十まで人災」と呼んだ。"}, {"t": 1386.7, "x": "消防総監が挙げた法令違反もほぼ重なっている。"}, {"t": 1389.7333333333333, "x": "スプリンクラーが無いことは早くから分かっていた。"}, {"t": 1392.5, "x": "分かっていて、5年かかっても直らなかった。"}, {"t": 1395.2166666666667, "x": "では消防にはほかの手が無かったのか。"}, {"t": 1398.1333333333334, "x": "消防法の第5条という条文がある。"}, {"t": 1400.3333333333333, "x": "火事になれば人の命が危ないと\n認めたとき、消防長や署長が命令できる。"}, {"t": 1405.0666666666666, "x": "使用の停止まで命じられる条文だ。"}, {"t": 1407.2333333333333, "x": "議員はこれを「伝家の宝刀」と呼んだ。"}, {"t": 1409.8333333333333, "x": "それを使えば、9階と10階を閉められたの？"}, {"t": 1412.7666666666667, "x": "議員はそう質問した。"}, {"t": 1414.3, "x": "あの2つの階を、使用禁止にできたのではないか、と。"}, {"t": 1417.6333333333334, "x": "長官の答えには、2つの点があった。"}, {"t": 1420.2333333333333, "x": "1つ目は手順だ。"}, {"t": 1421.5166666666667, "x": "東京消防庁は、警告から命令、\n公表、告発へ進む順番を選んだ。"}, {"t": 1426.3833333333334, "x": "2つ目は解釈だ。"}, {"t": 1427.7833333333333, "x": "この条文は、差しかかった具体的な\n危険があるときに使うものだ、と。"}, {"t": 1432.1833333333334, "x": "スプリンクラーが無いだけで\n当てはまるのか、という判断があった。"}, {"t": 1435.8666666666666, "x": "火事が起きそうじゃないとダメってこと？"}, {"t": 1438.0833333333333, "x": "そういう読み方が制定のころから続いていた。"}, {"t": 1440.7833333333333, "x": "もう1つ、消防庁の担当者が\n別の委員会で明かした事情がある。"}, {"t": 1444.8833333333334, "x": "もし命令が裁判で取り消されると、\n自治体が補償しなければならない。"}, {"t": 1448.9833333333333, "x": "だから現場は、「かなりちゅうちょせざるを得ない」。"}, {"t": 1451.6, "x": "止めたらお金を払うことになるかもしれないのね。"}, {"t": 1454.5333333333333, "x": "そして長官はこう言った。"}, {"t": 1456.1333333333334, "x": "「この五条は決して飾り物ではない」。"}, {"t": 1458.3, "x": "別の質問では、雑誌の論文の数字も読み上げられた。"}, {"t": 1461.7833333333333, "x": "1980年版の消防白書には、第5条の命令が\n29件、第17条の4の命令が410件とある。"}, {"t": 1469.3, "x": "最初の議員は、第5条は一度も\n使われていないと言っていた。"}, {"t": 1473.0333333333333, "x": "数字が合わないじゃない。"}, {"t": 1474.4666666666667, "x": "合わない。どちらの言い方が\n正しいのかは確かめていない。"}, {"t": 1477.7333333333333, "x": "同じ論文は、夜の人員が足りなければ\n第8条で命じられるはずだとも書いた。"}, {"t": 1482.5, "x": "第8条の命令は、その白書に載っていなかったという。"}, {"t": 1485.9, "x": "ただ判断がよかったかどうかは、\n「大きな問題が残る」とも認めた。"}, {"t": 1490.1, "x": "命令の1年と、第5条の間に、すき間があった。"}, {"t": 1493.45, "x": "火が出たのはそのすき間の中だった。"}, {"t": 1496.2833333333333, "x": "この日の質疑でいちばん記録に残したい場面がある。"}, {"t": 1499.3666666666666, "x": "ある議員が古い会議録の束を持ち出した。"}, {"t": 1501.9333333333334, "x": "有馬温泉、磐光ホテル、\n千日デパート、大洋デパート、川治。"}, {"t": 1506.2, "x": "これらの火事のあとの国会の記録を、\n全部読んできたのだという。"}, {"t": 1510.05, "x": "全部？"}, {"t": 1511.1833333333334, "x": "全部だ。そしてこう言った。"}, {"t": 1512.9833333333333, "x": "「ほとんど同じ質問をみんながやって、\nそして同じ答えを当局が答えておる」。"}, {"t": 1517.6833333333334, "x": "同じ質問と同じ答え……"}, {"t": 1519.5166666666667, "x": "煙で亡くなる人が多い。"}, {"t": 1521.0333333333333, "x": "誘導が足りない。設備が足りない。"}, {"t": 1523.25, "x": "そのあとの手当てをしていない。"}, {"t": 1524.7666666666667, "x": "全部に共通していたと。"}, {"t": 1526.4666666666667, "x": "議員はこれを、「条件反射」と呼んだ。"}, {"t": 1528.95, "x": "大丈夫だと言うと火事が起きる。\nまた大丈夫だと言うと、また起きる。"}, {"t": 1532.9166666666667, "x": "川治とニュージャパンは、名前を\n替えるだけで同じ質問が通るとも言った。"}, {"t": 1537.15, "x": "川治から、1年3か月しかたってないのよね。"}, {"t": 1540.3666666666666, "x": "そうだ。"}, {"t": 1541.5, "x": "長官も、「どこかに\n問題があるということは事実」と認めた。"}, {"t": 1545.3166666666666, "x": "この場面には新しい数字が何も出ない。"}, {"t": 1547.7666666666667, "x": "それでも、1968年から14年分の会議録が、\nここで1本につながった。"}, {"t": 1553.3333333333333, "x": "今こうして読めるのもその記録が残っているからだ。"}, {"t": 1556.3166666666666, "x": "では当の社長は何を語ったのか。"}, {"t": 1559.1166666666666, "x": "1982年4月16日。"}, {"t": 1561.7333333333333, "x": "衆議院地方行政委員会に参考人が3人呼ばれた。"}, {"t": 1565.1166666666666, "x": "日本ホテル協会の会長国際観光旅館連盟の会長。"}, {"t": 1568.9833333333333, "x": "そして横井英樹 社長だ。"}, {"t": 1571.1666666666667, "x": "ホテル協会の会長はまずおわびを述べた。"}, {"t": 1573.6, "x": "協会の76年の歴史で、こういう\n火災の死傷者は知る限り初めてだ、と。"}, {"t": 1578.7, "x": "社長は何を話したの？"}, {"t": 1580.4, "x": "社長も最初におわびを述べた。"}, {"t": 1582.25, "x": "「三十三名ものお客様方の\nとうといとうといお命が失われ」。"}, {"t": 1586.05, "x": "そのあと、ここまで見てきた経緯を話した。"}, {"t": 1588.7, "x": "赤字のこと、融資のこと、順に進めた工事のことだ。"}, {"t": 1592.3166666666666, "x": "2月10日に工事を始める\n予定だったと語ったのも、この日だ。"}, {"t": 1596.3, "x": "議員さんは納得したの？"}, {"t": 1598.05, "x": "していない。"}, {"t": 1599.1833333333334, "x": "43軒のうち42軒が終わっていた、という\n話が出たのもこの日だ。"}, {"t": 1603.7333333333333, "x": "社長は消防の指導にのっとって\n逐次やってきたと答えた。"}, {"t": 1607.1833333333334, "x": "議員は「それが誠意というものか」と返している。"}, {"t": 1610.1666666666667, "x": "そして、同じ日にもう1つ、書類の話が出た。"}, {"t": 1613.4833333333333, "x": "ホテルの1981年分の有価証券報告書だ。"}, {"t": 1617.25, "x": "その朝に大蔵省へ出されたものだった。"}, {"t": 1619.8, "x": "それに何か書いてあったの？"}, {"t": 1621.5833333333333, "x": "「設備の新設・\n拡充若しくは改修等の計画」という欄がある。"}, {"t": 1625.6, "x": "そこに書かれた言葉は、「該当事項はありません」。"}, {"t": 1628.6, "x": "えっ工事の予定があったんでしょ？"}, {"t": 1630.7666666666667, "x": "議員もそこを突いた。"}, {"t": 1632.0833333333333, "x": "消防への報告は8回。"}, {"t": 1633.6, "x": "投資家への書類は「該当事項はありません」だ。"}, {"t": 1636.6166666666666, "x": "社長は書類を押収されたので\n仮決算で出したと説明した。"}, {"t": 1640.3, "x": "議員はその前の年の報告書も同じ言葉だと重ねた。"}, {"t": 1643.7833333333333, "x": "ただ、この報告書が扱うのは\n1981年の12月31日までだ。"}, {"t": 1649.1, "x": "地下1階の契約は年が明けた1月9日だった。"}, {"t": 1652.4166666666667, "x": "この欄だけで社長の胸の内までは決められない。"}, {"t": 1655.25, "x": "それでも命令を受けた年の書類に\nその言葉が残っている。"}, {"t": 1659.2666666666667, "x": "この日の質疑にはご遺族の話も出た。"}, {"t": 1661.7666666666667, "x": "1982年3月10日に、社長は\n1枚の確認書にサインをしている。"}, {"t": 1666.7333333333333, "x": "個人の財産を処分しても損害を\n賠償すると約束する、という文書だ。"}, {"t": 1671.3833333333334, "x": "私財を投げ出すっていう約束ね。"}, {"t": 1673.55, "x": "議員がその写しを読み上げ\n社長はサインをしたと認めた。"}, {"t": 1676.7666666666667, "x": "このときまでに補償が済んだのは、\n7割以上と社長は述べた。"}, {"t": 1680.4833333333333, "x": "台湾の方12人と韓国の方8人の全員、\n日本のご遺族の約3分の1だという。"}, {"t": 1686.1833333333334, "x": "残りの方は？"}, {"t": 1687.35, "x": "遺族会が社長を告訴していた。"}, {"t": 1689.4166666666667, "x": "社長は自分の不徳のいたすところだと答えている。"}, {"t": 1692.4166666666667, "x": "ある議員は、不動産だけで\n410億円以上の資産があると指摘した。"}, {"t": 1696.8166666666666, "x": "社長は、収入はほとんど無く、私財と\n関係会社のお金で払っていると述べた。"}, {"t": 1701.7, "x": "賠償の保険についても、\n2月の委員会で質問が出ていた。"}, {"t": 1705.4833333333333, "x": "入っていたのは1億5800万円ほどだという。"}, {"t": 1708.5666666666666, "x": "これは新聞の報道をもとにした\n質問で、議員もそう断っている。"}, {"t": 1712.5333333333333, "x": "別の議員は社長にこう言った。"}, {"t": 1714.4166666666667, "x": "「あなたの残念無念と\n遺族の残念無念、これは質が違う」。"}, {"t": 1718.2166666666667, "x": "……そうね。"}, {"t": 1719.3333333333333, "x": "補償の最後の金額は\n確かめていないので、ここでは言わない。"}, {"t": 1723.55, "x": "この4月にはもう1つ結果が出ていた。"}, {"t": 1726.0166666666667, "x": "捜査本部から鑑定を頼まれた東京理科大学の実験だ。"}, {"t": 1729.7166666666667, "x": "同じ条件で同じ部屋を作り燃やしてみた。"}, {"t": 1732.5166666666667, "x": "同じ部屋を作ったの？"}, {"t": 1734.1, "x": "そう国会で紹介されている。"}, {"t": 1735.9166666666667, "x": "スプリンクラーをつけた条件では\nまず報知機が作動した。"}, {"t": 1739.1333333333334, "x": "天井のスプリンクラーから水が出た。"}, {"t": 1741.3333333333333, "x": "火はシーツを焦がしただけで消えた。"}, {"t": 1743.45, "x": "シーツだけ？"}, {"t": 1744.5833333333333, "x": "議員の説明ではそういう結果だった。"}, {"t": 1746.8666666666666, "x": "報知機の配管が外れていなければ、\n早く気づけたことも分かった。"}, {"t": 1750.9, "x": "参考人席の社長は、まだその話を\n聞いていないと答えている。"}, {"t": 1754.8666666666666, "x": "この実験の中身は後の判断にも重なってくる。"}, {"t": 1758.0166666666667, "x": "最高裁の決定はこう書いた。"}, {"t": 1759.9666666666667, "x": "スプリンクラーがあれば、炎が天井を\n伝い始めたころに作動し、火を鎮める。"}, {"t": 1764.6333333333334, "x": "「同室以外の区域に火災が\n拡大することはなかった」。"}, {"t": 1767.95, "x": "特段の事情がない限り、という\n前置きつきで、そう認めた。"}, {"t": 1771.6833333333334, "x": "区切りの工事でも同じだ。"}, {"t": 1773.3, "x": "出火した部屋を含む3室ほどが、\n燃えない壁で囲まれていたはずだ。"}, {"t": 1777.6666666666667, "x": "どちらか1つでよかったのよね。"}, {"t": 1779.7666666666667, "x": "1974年の法律が求めたのは、\nまさにその「どちらか」だった。"}, {"t": 1784.6666666666667, "x": "5年の猶予と、さらに3年近い時間があった。"}, {"t": 1787.75, "x": "火が出たのはその8年目の冬だ。"}, {"t": 1790.5666666666666, "x": "社長は業務上過失致死傷の罪に問われた。"}, {"t": 1793.3833333333334, "x": "火を出したのは本人ではない。"}, {"t": 1795.1333333333334, "x": "問われたのは会社のトップとしての責任だ。"}, {"t": 1797.9166666666667, "x": "火をつけてなくても責任を問われるの？"}, {"t": 1800.3666666666666, "x": "そこが争われた。"}, {"t": 1801.6333333333334, "x": "1987年5月20日、東京地裁の判決があった。"}, {"t": 1805.9333333333334, "x": "1990年に東京高裁も禁錮3年の実刑を支持した。"}, {"t": 1810.15, "x": "そして1993年11月25日、\n最高裁第二小法廷が上告を退けた。"}, {"t": 1816.15, "x": "火事から11年9か月がたっていた。"}, {"t": 1818.6333333333334, "x": "決定の理由はここまで見た事実をそのまま使っている。"}, {"t": 1821.8666666666666, "x": "社長は実質的な権限を持っていた。"}, {"t": 1824.3333333333333, "x": "防火の仕事を人に任せていても\n指揮監督する立場にある。"}, {"t": 1828.0333333333333, "x": "不備を知っていたので、危険を\n「容易に予見できた」。"}, {"t": 1831.1333333333334, "x": "工事や訓練をしていれば結果を避けられた。"}, {"t": 1833.8, "x": "知らなかったとは言えないのね。"}, {"t": 1835.6333333333334, "x": "文書と報告が残っていたからだ。"}, {"t": 1837.85, "x": "4通の文書と8回の報告は、\n火事の前には工事を終わらせなかった。"}, {"t": 1842.15, "x": "火事のあとには社長の認識を示す記録になった。"}, {"t": 1845.2333333333333, "x": "防火管理者だった人にも\n執行猶予つきの判決が出ている。"}, {"t": 1848.9166666666667, "x": "その人の名前は出さない。"}, {"t": 1850.5833333333333, "x": "社長が命令書を受けたのは1981年だが、\n認識の起点はそこではない。"}, {"t": 1855.75, "x": "就任した1979年の時点からという判断だった。"}, {"t": 1859.7, "x": "社長はその後亡くなり、\n2000年の会議録には「故」とついている。"}, {"t": 1864.4, "x": "では火事のあと、仕組みは変わったのか。"}, {"t": 1866.7833333333333, "x": "消防庁は2月10日付で全国の消防へ通達を出した。"}, {"t": 1870.4166666666667, "x": "工事が始まるはずだったあの日付だ。"}, {"t": 1872.8333333333333, "x": "同じ日なのね。"}, {"t": 1874.0333333333333, "x": "偶然だ。そこに意味は足さない。"}, {"t": 1876.05, "x": "中身は、ためらわずに命令し、\n公表し、告発しろというもの。"}, {"t": 1880.0666666666666, "x": "4月8日には緊急是正要綱という通達も出た。"}, {"t": 1883.25, "x": "マークの無い宿に早く法の手続きを取れという内容だ。"}, {"t": 1886.4833333333333, "x": "全国の数字も、4月に発表された。"}, {"t": 1889.1666666666667, "x": "対象は1万6354軒。"}, {"t": 1891.6, "x": "マークがあるのは6991軒。"}, {"t": 1894.3333333333333, "x": "半分もないの？"}, {"t": 1895.5333333333333, "x": "3月末の時点で、42.7％だ。"}, {"t": 1898.8333333333333, "x": "消防庁は交付の済んだ所に限れば約53％と説明した。"}, {"t": 1903.2666666666667, "x": "それでも半分近くに何かの不備があった。"}, {"t": 1905.8833333333334, "x": "防火の区切りの不備が約29％。"}, {"t": 1908.35, "x": "訓練の違反が26％。"}, {"t": 1910.55, "x": "ニュージャパンの問題点と、\n同じ項目が上位に並んでいる。"}, {"t": 1914.1666666666667, "x": "1軒だけの話じゃなかったのね。"}, {"t": 1916.4166666666667, "x": "そうだ。43軒のうちの1軒というのは、\nスプリンクラーの工事の話だ。"}, {"t": 1921.15, "x": "どちらの数字も当時の国会の記録に残っている。"}, {"t": 1924.85, "x": "最初に出てきた看板の話に戻ろう。"}, {"t": 1927.3166666666666, "x": "政府登録の国際観光ホテルは\n当時全国に439軒あった。"}, {"t": 1931.8666666666666, "x": "泊まる人は年間420万人と、国会で言われている。"}, {"t": 1935.5833333333333, "x": "議員は、登録を取り消すべきではないかと\n運輸大臣に迫った。"}, {"t": 1939.4666666666667, "x": "国が登録したんだから取り消せるんでしょ？"}, {"t": 1942.1, "x": "それがすぐにはできなかった。"}, {"t": 1943.8166666666666, "x": "この法律は戦後、外国のお客を迎える\nホテルを増やすために作られた。"}, {"t": 1948.2166666666667, "x": "登録の中心は部屋の広さや\n外国のお客に向いた設備だ。"}, {"t": 1951.9333333333334, "x": "防災は消防法や建築基準法に任せる形になっていた。"}, {"t": 1955.75, "x": "運輸省の担当者はこう認めている。"}, {"t": 1957.9666666666667, "x": "消防法に合わない状態が\n長く続くことは、法律の前提に無かった。"}, {"t": 1962.35, "x": "しかし現実には、そのままの状態が長くあった、と。"}, {"t": 1965.9333333333334, "x": "看板と消防は別々に動いてたのね。"}, {"t": 1968.55, "x": "そうだ。"}, {"t": 1969.6833333333334, "x": "消防法に合わないというだけでは、\n取り消す作りになっていない。"}, {"t": 1973.2833333333333, "x": "法律が見ているのは経営が\n確実で健全かどうかだった。"}, {"t": 1976.7166666666667, "x": "だから大臣も、経営の問題として\n取り消しを考えると答えた。"}, {"t": 1980.7, "x": "登録で国に損害賠償の問題が特に生まれるとは\n考えていない、という答弁もある。"}, {"t": 1985.8333333333333, "x": "泊まる人から見れば看板は1枚だ。"}, {"t": 1988.1666666666667, "x": "役所の中では別々の法律の仕事だった。"}, {"t": 1991.6833333333334, "x": "最後に確かめられた日付だけを並べ直そう。"}, {"t": 1994.4833333333333, "x": "1974年、法律が変わる。"}, {"t": 1997.0666666666666, "x": "1977年2月28日、消防の1通目。"}, {"t": 2001.0666666666666, "x": "1979年3月31日、法律の期限と2通目。"}, {"t": 2005.5666666666666, "x": "1979年5月28日、社長の就任。"}, {"t": 2009.3833333333334, "x": "1980年2月16日と8月、3通目と4通目。"}, {"t": 2013.8, "x": "1981年5月、適マークの開始。"}, {"t": 2017.0166666666667, "x": "1981年9月11日、措置命令。"}, {"t": 2020.4666666666667, "x": "1981年10月22日、8回目の報告。"}, {"t": 2024.4666666666667, "x": "1982年2月8日、午前3時16分ごろの出火。"}, {"t": 2028.8, "x": "1982年2月10日、工事の予定日。"}, {"t": 2032.0666666666666, "x": "1982年9月11日、命令の期限。"}, {"t": 2035.5666666666666, "x": "1993年11月25日、最高裁の決定。"}, {"t": 2039.85, "x": "火事のあとにも予定の日付が残ってるのね。"}, {"t": 2042.6166666666666, "x": "2月10日と9月11日は誰も使わなかった日付だ。"}, {"t": 2046.2333333333333, "x": "5年の間に工事が進む機会は何度もあった。"}, {"t": 2049.1666666666665, "x": "止める手もあった。その手は、\nこのホテルには抜かれなかった。"}, {"t": 2052.6666666666665, "x": "断っておくが消防を責めて終わりたいわけではない。"}, {"t": 2055.516666666667, "x": "最高裁が責任を認めたのは経営者だ。"}, {"t": 2058.1833333333334, "x": "消防は何度も足を運び文書を残した。"}, {"t": 2060.766666666667, "x": "その文書があったから今この順番をたどれる。"}, {"t": 2063.5333333333333, "x": "でも文書があっても火は止まらなかった。"}, {"t": 2065.95, "x": "止まらなかった。"}, {"t": 2067.0, "x": "泊まる人に見えない約束は泊まる人を守らなかった。"}, {"t": 2070.266666666667, "x": "スプリンクラーはふだんは\n天井の小さな金具でしかない。"}, {"t": 2073.4, "x": "旅先でそれを見かけたら誰かが工事を終わらせた印だ。"}, {"t": 2076.8166666666666, "x": "亡くなった33人の方のご冥福をお祈りします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
