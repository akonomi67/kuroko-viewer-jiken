<script>
const D={"name": "126", "file": "126_編集用", "dur": 2073.5, "segs": [], "subs": [{"t": 0.0, "x": "屋根の上の金色の鳳凰と1枚の額。"}, {"t": 2.466666666666667, "x": "1950年7月2日の朝、京都の金閣から、\nこの2つだけは焼けずに残った。"}, {"t": 8.266666666666667, "x": "その時は建物から外されて、しまってあったからだ。"}, {"t": 11.75, "x": "じゃあ建物のほうは？"}, {"t": 13.166666666666666, "x": "金閣そのものは、焼けてなくなった。"}, {"t": 15.6, "x": "中にあった足利義満の像も一緒にだ。"}, {"t": 18.216666666666665, "x": "どちらも国宝だった。"}, {"t": 19.8, "x": "雷とか漏電とか？"}, {"t": 21.433333333333334, "x": "違う。"}, {"t": 22.566666666666666, "x": "火を付けたのは、同じ寺に\n住んでいた見習いの僧だった。"}, {"t": 25.966666666666665, "x": "年は21歳。"}, {"t": 27.166666666666668, "x": "京都の大学に通う学生でもあった。"}, {"t": 29.7, "x": "お寺の中の人が、自分のお寺に？"}, {"t": 32.233333333333334, "x": "そうだ。"}, {"t": 33.36666666666667, "x": "つかまった後でその学生は「動機は、\n落ちついてからにしてくれ」と\n言ったと伝えられている。"}, {"t": 38.88333333333333, "x": "理由は言わなかったの？"}, {"t": 40.38333333333333, "x": "はっきりとは言い切らなかった。"}, {"t": 42.083333333333336, "x": "今回はその学生の言葉と、焼けた金閣が5年で\nもう一度建つまでを、記録の順に追っていく。"}, {"t": 48.016666666666666, "x": "理由をこちらで決めつけることはしない。"}, {"t": 50.38333333333333, "x": "21歳って、大学生くらいよね？"}, {"t": 52.95, "x": "そうだ。寺に住み込みながら大学にも通っていた。"}, {"t": 56.05, "x": "その人が、自分の暮らす寺の国宝に火を付けた。"}, {"t": 59.5, "x": "残った鳳凰と額の話も、あとで出てくるのね？"}, {"t": 62.68333333333333, "x": "もちろんだ。"}, {"t": 63.81666666666667, "x": "まずは、火が見つかった時刻から始めよう。"}, {"t": 67.11666666666666, "x": "記録では火が出たのは7月2日の午前3時ごろだ。"}, {"t": 70.43333333333334, "x": "最初に見つけたのは、寺の人ではなかった。"}, {"t": 73.36666666666666, "x": "じゃあ誰が見つけたの？"}, {"t": 74.85, "x": "消防の出張所の、望楼にいた人だ。"}, {"t": 77.41666666666667, "x": "望楼は町を見張るための高い見張り台のことだ。"}, {"t": 80.33333333333333, "x": "そこから火が見えたのが、午前3時7分。"}, {"t": 83.16666666666667, "x": "寺の中では誰も気づかなかったのね。"}, {"t": 85.63333333333334, "x": "そういうことになる。"}, {"t": 86.83333333333333, "x": "知らせから6分後には、最初の消防車が着いた。"}, {"t": 89.93333333333334, "x": "ところが金閣は、衣笠山のふもとの林の中にある。"}, {"t": 93.56666666666666, "x": "道が悪く火の様子をつかめたのは\n午前3時17分ごろだった。"}, {"t": 97.56666666666666, "x": "着いてからさらに4分。"}, {"t": 99.16666666666667, "x": "そうだ。"}, {"t": 100.3, "x": "午前3時40分ごろには、\n3階の柱が燃えて屋根が落ちた。"}, {"t": 104.3, "x": "火がほぼおさまったのは、午前3時50分ごろだ。"}, {"t": 107.5, "x": "見つかってから、1時間もたっていないじゃない。"}, {"t": 110.36666666666666, "x": "木でできた3階建てだ。"}, {"t": 111.93333333333334, "x": "一度火が回ると、止めようがなかった。"}, {"t": 114.35, "x": "夜が明けるころには、金閣は焼け落ちていた。"}, {"t": 117.23333333333333, "x": "池って金閣が映るあの池？"}, {"t": 119.25, "x": "鏡湖池だ。"}, {"t": 120.38333333333334, "x": "庭も国の名勝で、木の何本かが\n焼けたと国会で報告されている。"}, {"t": 125.26666666666667, "x": "そもそも金閣って、どういう建物だったの？"}, {"t": 128.23333333333332, "x": "正しくは舎利殿という。"}, {"t": 129.71666666666667, "x": "お釈迦さまの骨を納めるための建物だ。"}, {"t": 132.25, "x": "建てたのは室町幕府の3代将軍足利義満。"}, {"t": 135.56666666666666, "x": "1398年ごろ、北山殿という屋敷の中に建てられた。"}, {"t": 140.06666666666666, "x": "今から600年以上も前ね。"}, {"t": 142.18333333333334, "x": "3つの階でつくりが全部違う。"}, {"t": 144.2, "x": "1階は法水院といって、貴族の屋敷のようなつくり。"}, {"t": 147.53333333333333, "x": "2階は潮音洞で、武家の屋敷のようなつくり。"}, {"t": 150.38333333333333, "x": "3階は究竟頂で、禅宗のお寺の仏間のつくりだ。"}, {"t": 153.91666666666666, "x": "階ごとに別の建物みたいなのね。"}, {"t": 156.3, "x": "そうだ。"}, {"t": 157.41666666666666, "x": "2階と3階には、金箔が張られていた。"}, {"t": 160.08333333333334, "x": "だから「金閣」と呼ばれるようになった。"}, {"t": 162.8, "x": "最初から金閣って名前じゃなかったの？"}, {"t": 165.31666666666666, "x": "京都市の資料では、「金閣」の名が\n初めて見えるのは1484年だ。"}, {"t": 170.16666666666666, "x": "応仁の乱で周りの建物はほとんど焼けた。"}, {"t": 172.86666666666667, "x": "それでも金閣だけは焼けずに残った。"}, {"t": 175.35, "x": "戦の火もくぐり抜けたのね。"}, {"t": 177.35, "x": "1897年には国の特別保護建造物に指定された。"}, {"t": 181.6, "x": "国が守るべき建物として名前が挙がったわけだ。"}, {"t": 184.66666666666666, "x": "明治の終わりには、大きな修理も受けている。"}, {"t": 187.26666666666668, "x": "1903年から1906年にかけて、\n一度ばらしてから組み直した。"}, {"t": 192.11666666666667, "x": "北山殿ができたころから残っていた、\nただ1つの建物だった。"}, {"t": 196.86666666666667, "x": "あの夜何が焼けたの？"}, {"t": 198.41666666666666, "x": "当時の美術の年鑑には、こう書かれている。"}, {"t": 201.11666666666667, "x": "「国宝三層楼金閣から出火、同閣および閣中に\n安置された国宝義満像はじめ\n古美術品などを全焼した」。"}, {"t": 208.43333333333334, "x": "義満の像も国宝だったのね。"}, {"t": 210.63333333333333, "x": "座った姿の木の像だ。"}, {"t": 212.31666666666666, "x": "記録では焼けた胴体の部分だけが見つかったという。"}, {"t": 215.33333333333334, "x": "ほかにも観音や阿弥陀などの像が焼けた。"}, {"t": 217.78333333333333, "x": "義満はこの北山の地で政治をとり、\n1408年にここで亡くなった人だ。"}, {"t": 222.8, "x": "その人の姿を写した像が、自分の建てた\n建物と一緒に焼けたことになる。"}, {"t": 227.75, "x": "建てた人の像まで、なくなったのね。"}, {"t": 230.11666666666667, "x": "じゃあ最初に言った鳳凰と額は？"}, {"t": 232.11666666666667, "x": "京都市の歴史資料館の説明ではこうだ。"}, {"t": 234.75, "x": "鳳凰と後小松天皇が書いた「究竟頂」の額は\n焼けた時、金閣から取り外されて保存されていた。"}, {"t": 241.2, "x": "外してしまってあったのね？"}, {"t": 243.0, "x": "そうだ。"}, {"t": 244.13333333333333, "x": "なぜ外してあったのかまでは、\nこの資料には書かれていない。"}, {"t": 247.46666666666667, "x": "屋根には代わりの鳳凰が付いていたと\n伝えられている。"}, {"t": 250.36666666666667, "x": "本物はしまわれていたおかげで残った。"}, {"t": 252.85, "x": "その鳳凰は今どうなってるの？"}, {"t": 254.73333333333332, "x": "1999年に京都市の文化財に指定された。"}, {"t": 258.28333333333336, "x": "寺の古い日記『隔蓂記』も、\n別の文庫にあって無事だった。"}, {"t": 262.45, "x": "建物の外にあったものは、助かったのね。"}, {"t": 265.35, "x": "逆に言えばあの夜に建物の中にあったものは、\nほとんど残らなかった。"}, {"t": 269.56666666666666, "x": "では建物の中で何が起きたのか。"}, {"t": 271.8333333333333, "x": "鍵になったのは、1台の機械だった。"}, {"t": 274.95, "x": "機械って？"}, {"t": 276.0833333333333, "x": "火災報知器だ。"}, {"t": 277.21666666666664, "x": "金閣には火が出たら知らせる装置が付いていた。"}, {"t": 280.1666666666667, "x": "じゃあなんで寺の人は気づかなかったの？"}, {"t": 282.6, "x": "その報知器の電源が、何日か前から故障していた。"}, {"t": 286.03333333333336, "x": "記録では6月29日の夜に壊れたという。"}, {"t": 288.98333333333335, "x": "修理は7月2日に来る予定だった。"}, {"t": 291.51666666666665, "x": "7月2日って火が出た日じゃない。"}, {"t": 293.81666666666666, "x": "そうだ。"}, {"t": 294.95, "x": "直る予定の日の、未明だった。"}, {"t": 297.0833333333333, "x": "偶然なの？"}, {"t": 298.2, "x": "のちの記録では、見習いの僧は\n故障していることを確かめていたとされる。"}, {"t": 302.5, "x": "報知器の電源は、寺の台所に\nあたる庫裡の部屋にあった。"}, {"t": 306.1333333333333, "x": "そこで電源が直っていないことを見てから、\n金閣へ向かった、という書き方だ。"}, {"t": 310.95, "x": "知っていたのね。"}, {"t": 312.1166666666667, "x": "寺に住む者なら、そういうことも耳に入る。"}, {"t": 314.93333333333334, "x": "報知器が鳴らなかったのは、\n偶然とは言えないかもしれない。"}, {"t": 318.4, "x": "知っていてその夜を選んだってこと？"}, {"t": 320.6166666666667, "x": "記録の書き方からは、そう読める。"}, {"t": 322.8666666666667, "x": "火を付けたのは午前2時ごろとされる。"}, {"t": 325.03333333333336, "x": "望楼が火を見つけるまで、およそ1時間あった。"}, {"t": 327.93333333333334, "x": "その間に本人は寺の裏の山へ向かっていた。"}, {"t": 331.46666666666664, "x": "裏の山って？"}, {"t": 332.5833333333333, "x": "左大文字山だ。"}, {"t": 334.01666666666665, "x": "お盆の送り火で、「大」の字がともる山の一つだ。"}, {"t": 337.1666666666667, "x": "金閣のすぐ北にある。"}, {"t": 338.8666666666667, "x": "そこに逃げたの？"}, {"t": 340.1166666666667, "x": "7月2日のうちに、その山の中腹で見つかった。"}, {"t": 343.55, "x": "見つかった時刻は、資料によって違う。"}, {"t": 346.03333333333336, "x": "本人は眠り薬をたくさん飲んでいた。"}, {"t": 348.43333333333334, "x": "刃物で自分の胸も傷つけていた。"}, {"t": 350.81666666666666, "x": "自分も死ぬつもりだったのね。"}, {"t": 352.76666666666665, "x": "そう伝えられている。"}, {"t": 354.01666666666665, "x": "命は助かりそのまま警察に連れて行かれた。"}, {"t": 356.9, "x": "最初に口にした言葉は\n「火をつけた」だったと記録にある。"}, {"t": 360.81666666666666, "x": "それだけ？"}, {"t": 361.95, "x": "それだけだ。"}, {"t": 363.0833333333333, "x": "名前は 林養賢。"}, {"t": 364.6333333333333, "x": "美術の年鑑にも「同寺徒弟林養賢の放火に\nよるものであった」と書かれている。"}, {"t": 369.8333333333333, "x": "徒弟ってお弟子さんのこと？"}, {"t": 371.5833333333333, "x": "そうだ。"}, {"t": 372.71666666666664, "x": "寺に住み込んで、修行をしながら\n学校にも通う立場だ。"}, {"t": 376.23333333333335, "x": "翌日の新聞の見出しには、大谷大学の学生だと出た。"}, {"t": 380.6666666666667, "x": "警察では何て言ったの？"}, {"t": 382.4, "x": "7月3日の朝日新聞に、取り調べで\n話したとされる言葉が載っている。"}, {"t": 386.95, "x": "「金閣と心中する覚悟で、午前二時ごろ布団と衣類と\nカヤを金閣に持ち込み、マッチで火をつけた」。"}, {"t": 393.1, "x": "カヤって蚊帳？"}, {"t": 394.23333333333335, "x": "そうだ。夏に寝床を囲う網だ。"}, {"t": 396.4, "x": "続けてこう言ったとされる。"}, {"t": 397.98333333333335, "x": "「こわくなってすぐ裏山に逃げた」。"}, {"t": 400.0833333333333, "x": "一緒に死ぬつもりだったのに、逃げたのね。"}, {"t": 402.75, "x": "記者に向けては、別の言い方もしている。"}, {"t": 405.26666666666665, "x": "ズボンが焼けはじめると熱くなって、\n恐ろしくなって山へ逃げたと。"}, {"t": 409.3, "x": "理由のほうは？"}, {"t": 410.43333333333334, "x": "そこがこの回の一番大事なところだ。"}, {"t": 412.85, "x": "本人は「動機は、\n落ちついてからにしてくれ」と言った。"}, {"t": 416.31666666666666, "x": "読売新聞には「頭を整理してから話をする」という\n言葉が載った。"}, {"t": 420.8666666666667, "x": "まだ自分でもまとまっていなかったのかしら。"}, {"t": 423.48333333333335, "x": "それは分からない。"}, {"t": 424.56666666666666, "x": "住職に恨みは無い、とも話したと伝えられている。"}, {"t": 427.81666666666666, "x": "じゃあなぜ。"}, {"t": 428.95, "x": "その「なぜ」を、たくさんの人が\nこのあと考えることになる。"}, {"t": 432.73333333333335, "x": "新聞も国会も作家たちもだ。"}, {"t": 434.81666666666666, "x": "ただ本人の口から一つの答えが\n出ることは、最後までなかった。"}, {"t": 439.48333333333335, "x": "その人はどこで生まれたの？"}, {"t": 441.28333333333336, "x": "1929年3月19日、\n京都府の北今の舞鶴市にある成生という村だ。"}, {"t": 446.71666666666664, "x": "日本海に面した小さな集落だ。"}, {"t": 448.98333333333335, "x": "家は寺で父親はその寺の住職だった。"}, {"t": 451.75, "x": "お寺の子だったのね。"}, {"t": 453.2, "x": "父親は1942年、結核で亡くなった。"}, {"t": 456.53333333333336, "x": "本人が13歳のときだ。"}, {"t": 458.48333333333335, "x": "それで京都のお寺に？"}, {"t": 459.98333333333335, "x": "父親の縁で鹿苑寺に入ることになった。"}, {"t": 462.6, "x": "1943年3月に鹿苑寺で得度した。"}, {"t": 466.06666666666666, "x": "得度？"}, {"t": 467.2, "x": "髪をそって正式に僧になる儀式のことだ。"}, {"t": 469.96666666666664, "x": "1944年の春からは、鹿苑寺に住み込む徒弟になった。"}, {"t": 474.21666666666664, "x": "戦争の終わりがけの年だ。"}, {"t": 476.06666666666666, "x": "まだ15歳くらいね。"}, {"t": 477.55, "x": "中学を出たあと、寺から\n大谷大学の予科に通い、本科に進んだ。"}, {"t": 481.9166666666667, "x": "つかまったときは、大学で中国語を学ぶ学生だった。"}, {"t": 485.55, "x": "勉強はうまくいってたの？"}, {"t": 487.23333333333335, "x": "のちの記録では、成績は下がり続け、\n休みがちになっていたとされる。"}, {"t": 491.6, "x": "ただここで言えるのは記録にある事実だけだ。"}, {"t": 494.2, "x": "それが火を付けた理由だったとは、\nこの回では言わない。"}, {"t": 497.4166666666667, "x": "生い立ちを理由に結びつけないのね。"}, {"t": 499.65, "x": "そうだ。そこはつなげないで聞いてほしい。"}, {"t": 502.65, "x": "お寺の住職さんは、どうしてたの？"}, {"t": 505.0, "x": "住職は 村上慈海。"}, {"t": 506.76666666666665, "x": "自分の弟子が自分の寺の国宝に\n火を付けたことになる。"}, {"t": 510.1333333333333, "x": "朝日新聞にはこう話したと載っている。"}, {"t": 512.55, "x": "「私の指導のいたらなかったためで申訳ない」。"}, {"t": 515.4833333333333, "x": "自分のせいだってことね。"}, {"t": 517.1833333333333, "x": "本人については、こうも話している。"}, {"t": 519.4666666666667, "x": "同僚ともなじまず、日ごろから寺や\n世間に不満を持っていたのは事実だと。"}, {"t": 524.0666666666667, "x": "前から何か感じていたのかしら。"}, {"t": 526.2833333333333, "x": "そうとも読めるし、事件のあとで\n振り返った言葉とも読める。"}, {"t": 529.8, "x": "その年の8月には、雑誌の座談会でもおわびを述べた。"}, {"t": 533.3666666666667, "x": "「もっと私に道力と徳があれば、間違いなく\n弟子を導くことも出来たのでありましょう」。"}, {"t": 538.4666666666667, "x": "道力って？"}, {"t": 539.6, "x": "仏の道を歩む力、修行で身につく力のことだ。"}, {"t": 543.05, "x": "前の晩も本人は住職の肩をもんだり、\nお灸をすえたりしていたと伝えられる。"}, {"t": 547.8833333333333, "x": "いつも通りの夜だったのね。"}, {"t": 549.7333333333333, "x": "仲間の僧と夜中まで碁を\n打っていた、という記録もある。"}, {"t": 553.0, "x": "その仲間は火を付けるような様子は\n何も無かったと話している。"}, {"t": 556.8, "x": "周りの人には何も見えていなかった。"}, {"t": 559.2166666666667, "x": "住職はこのあと、焼け跡の前でもう\n一つの役目を背負うことになる。"}, {"t": 563.3, "x": "金閣を建て直すための、お金集めだ。"}, {"t": 565.9666666666667, "x": "その話はもう少しあとでしよう。"}, {"t": 568.6333333333333, "x": "家族はどうしたの？"}, {"t": 569.9833333333333, "x": "舞鶴にいた母親が、火事を知って京都へ出てきた。"}, {"t": 573.1166666666667, "x": "京都の駅に着いてから、火を付けたのが\n自分の息子だと知ったという。"}, {"t": 577.3, "x": "着いてから知ったのね。"}, {"t": 578.8, "x": "母親は警察署で面会を求めた。"}, {"t": 581.15, "x": "だが本人は会おうとしなかったと伝えられている。"}, {"t": 584.0166666666667, "x": "会わなかったの？"}, {"t": 585.15, "x": "そうだ。"}, {"t": 586.2833333333333, "x": "母親はその夜警察に保護されて過ごした。"}, {"t": 589.05, "x": "そして7月3日の夕方、舞鶴へ帰る\n道の途中で、自ら命を絶ったと報じられた。"}, {"t": 594.8666666666667, "x": "……事件の次の日に。"}, {"t": 596.2833333333333, "x": "この回では場所や様子には触れない。"}, {"t": 598.35, "x": "名前も出さない。"}, {"t": 599.4333333333333, "x": "記録に残っているのは、\n7月4日の新聞が伝えた事実だけだ。"}, {"t": 603.8166666666667, "x": "本人はそのことをどう受け止めたの？"}, {"t": 606.0666666666667, "x": "それは記録からは分からない。"}, {"t": 607.9166666666666, "x": "分からないところは、分からないままなのね。"}, {"t": 610.5833333333334, "x": "のちに本人が亡くなったとき、\n墓は母親の墓のそばに作られた。"}, {"t": 614.7833333333333, "x": "場所は舞鶴の村だ。"}, {"t": 616.35, "x": "最後は母親の隣に戻ったのね。"}, {"t": 618.75, "x": "ここから先は国の側の動きを見ていこう。"}, {"t": 621.9, "x": "金閣が焼けたのは、国会が開かれている最中だった。"}, {"t": 625.5333333333333, "x": "じゃあすぐに話題になった？"}, {"t": 627.2, "x": "2週間ほどあとの7月17日、\n衆議院の本会議で、ある議員がこう言った。"}, {"t": 632.2, "x": "三鷹事件の被告と並べて、「\n金閣寺放火の青年僧侶のごとき」と。"}, {"t": 636.8666666666667, "x": "三鷹事件って前の年の、電車が暴走した事件ね。"}, {"t": 640.45, "x": "そうだ。"}, {"t": 641.5666666666667, "x": "その議員は今の若者の心は、\nとうてい分からないと嘆いた。"}, {"t": 645.3, "x": "戦争中の学生と、今の学生はどう違うのか、と\n問いかける演説の中での一言だった。"}, {"t": 651.1166666666667, "x": "戦争の後と前の世代の違いだろうと簡単に\n片づけるわけにはいかない、とも言っている。"}, {"t": 656.3833333333333, "x": "若い人のことが、分からなくなっていたのね。"}, {"t": 659.3166666666667, "x": "当時は「アプレゲール」という言葉がはやっていた。"}, {"t": 662.2666666666667, "x": "フランス語で「戦争の後」という意味だ。"}, {"t": 664.8666666666667, "x": "戦後の若者が起こした事件を、\nまとめてそう呼ぶことがあった。"}, {"t": 668.7166666666667, "x": "金閣の事件もそう呼ばれたの？"}, {"t": 670.8166666666667, "x": "記録ではそう分けられたこともあった。"}, {"t": 672.9666666666667, "x": "7月26日の参議院では、別の議員がこう言っている。"}, {"t": 676.7, "x": "古いものは封建的だから亡ぼしてもいい、という\n誤った考えが若い人の一部にある。"}, {"t": 681.85, "x": "「で、金閣寺が焼けた」。"}, {"t": 683.5833333333334, "x": "考え方のせいにしたのね。"}, {"t": 685.4833333333333, "x": "でも本人はそういう考えを話したわけではない。"}, {"t": 688.2833333333333, "x": "国会の言葉はその時代の大人たちが\n事件をどう受け止めたかの記録だ。"}, {"t": 692.5333333333333, "x": "本人の動機を説明したものではない、と\n分けて聞いてほしい。"}, {"t": 696.7, "x": "京都の町にはどんな影響があったの？"}, {"t": 699.05, "x": "7月22日衆議院の建設委員会で、\n京都選出の議員がこう話している。"}, {"t": 704.1333333333333, "x": "「金閣寺が焼失になりましたが、\nこの金閣寺はすみやかに復興したい」。"}, {"t": 708.6833333333333, "x": "やっぱり早く建て直したいのね。"}, {"t": 710.8166666666667, "x": "理由が具体的だった。"}, {"t": 712.3333333333334, "x": "建て直さないと、京都市のバスと電車の収入が、\n3分の1減るのではないかと言われていると。"}, {"t": 718.0666666666667, "x": "3分の1も？"}, {"t": 719.3, "x": "そう言われるほどの影響だ、という言い方だ。"}, {"t": 721.8333333333334, "x": "金閣を見に来る人が、それだけ\n市のバスや電車に乗っていた。"}, {"t": 725.7, "x": "お寺が一つ焼けて、町のお財布まで響くのね。"}, {"t": 728.9333333333333, "x": "戦後5年目で京都は観光で立ち直ろうとしていた。"}, {"t": 732.0166666666667, "x": "この議員は恒久的な施設は後回しにして、すぐ\n収入になる観光に力を注ぐ、とも言っている。"}, {"t": 738.25, "x": "その一番の目玉が、金閣だったのね。"}, {"t": 741.0333333333333, "x": "そうだ。"}, {"t": 742.1666666666666, "x": "同じ7月26日には、別の議員がこう聞いた。"}, {"t": 745.5333333333333, "x": "金閣寺を作れと言っても作れないだろうが、"}, {"t": 748.0, "x": "元に戻させるくらいの強い\n決まりがあってもいいのではないかと。"}, {"t": 751.7, "x": "元に戻させる？"}, {"t": 752.9666666666667, "x": "壊した人に元の姿へ戻させるという意味だ。"}, {"t": 755.9166666666666, "x": "答えた議員は金閣寺は寺の持ち物だと説明した。"}, {"t": 759.2666666666667, "x": "建て直すにはまず寺そのものが重大な\n決意をしなければならないと。"}, {"t": 763.3, "x": "国が勝手に建てるわけには、いかないのね。"}, {"t": 766.0666666666667, "x": "その上で前よりも力を入れた立派な\n姿に建て直したい、と言っている。"}, {"t": 770.95, "x": "その委員会では、何の話をしていたの？"}, {"t": 773.6666666666666, "x": "京都と奈良を外国からも人を呼べる\n観光の町にするための法案だ。"}, {"t": 777.8166666666667, "x": "京都の分は京都国際文化観光都市建設法という。"}, {"t": 781.4166666666666, "x": "名前が長いわね。"}, {"t": 782.7333333333333, "x": "金閣が焼けたちょうどその月に、\n国会で話し合われていた。"}, {"t": 786.3833333333333, "x": "7月25日の本会議では、\n反対する議員がこう言っている。"}, {"t": 790.35, "x": "「法隆寺の壁画も焼いたではないか。"}, {"t": 792.3166666666667, "x": "金閣寺も焼いてしまったではないか」。"}, {"t": 794.6666666666666, "x": "守れていないのに、観光の町なんて、ってことね。"}, {"t": 797.8833333333333, "x": "古い文化を本当に守れるのは\n誰なのか、と問う反対だった。"}, {"t": 801.6833333333333, "x": "それでも法案は通った。"}, {"t": 803.2, "x": "京都の法律は1950年10月22日に公布された。"}, {"t": 807.3666666666667, "x": "金閣が焼けてから、3か月半後ね。"}, {"t": 810.0833333333334, "x": "この法律にはほかとは違う点がある。"}, {"t": 812.35, "x": "京都市だけに当てはまる法律なので、\n憲法の決まりで、住民の投票が必要だった。"}, {"t": 817.7333333333333, "x": "住民が決める法律なのね。"}, {"t": 819.6666666666666, "x": "公布の文にも憲法第95条による\n法律だとはっきり書かれている。"}, {"t": 823.85, "x": "第1条の目的は、京都市を\n国際文化観光都市として建設すること。"}, {"t": 828.6166666666667, "x": "京都の町と寺を、外国からも\n人を呼べる宝として見せていく。"}, {"t": 832.7, "x": "その考えの真ん中にあった建物の一つが、\n焼けたばかりだったわけだ。"}, {"t": 837.25, "x": "焼けた金閣と観光の町の法律が、\n同じ夏に並んでいたのね。"}, {"t": 841.5833333333334, "x": "そうだ。"}, {"t": 842.7, "x": "ただしこの法律が金閣を建て直す\nお金を出したわけではない。"}, {"t": 846.4, "x": "その話は国宝かどうかという問題につながっていく。"}, {"t": 850.2666666666667, "x": "文化財を守る仕組みは、どうなってたの？"}, {"t": 852.9, "x": "ちょうど切り替わりの時期だった。"}, {"t": 854.6666666666666, "x": "前の国会で文化財保護法という\n新しい法律ができていた。"}, {"t": 858.35, "x": "実際に動き出すのは、8月29日からだった。"}, {"t": 861.8666666666667, "x": "金閣が焼けたのは7月2日。"}, {"t": 864.2166666666667, "x": "そうだ。"}, {"t": 865.35, "x": "7月24日の衆議院の文部委員会で、ある議員が\nこう言っている。"}, {"t": 869.4833333333333, "x": "「残念なことに保護委員が任命される\n前に、金閣寺がああいう火災にあう」。"}, {"t": 873.9, "x": "守る係が決まる前だったのね。"}, {"t": 876.1, "x": "その法律で新しく作られる、\n文化財保護委員会のことだ。"}, {"t": 879.9333333333333, "x": "委員会ができたあと、10月6日の参議院で、\n事務局長はこう答えた。"}, {"t": 884.4166666666666, "x": "「今度金閣寺がそのお寺の中の坊さんに\nよって焼かれた」。"}, {"t": 887.8, "x": "文化財を大切にする気持ちさえあれば、\nそういうことはありえない、と"}, {"t": 891.55, "x": "続けている。"}, {"t": 892.5833333333334, "x": "外からの火じゃなくて、\n中の人だったから、余計に重かったのね。"}, {"t": 896.9, "x": "委員会は国民の意識を\n高めることに重点を置くと言った。"}, {"t": 900.4, "x": "同じ日の委員会では、別の議員が\n外国の目にも触れている。"}, {"t": 904.0333333333333, "x": "日本の古い文化財は、\n日本だけでなく世界のものでもある。"}, {"t": 907.6833333333333, "x": "法隆寺の壁画や金閣寺のようなものは、\n戦後の破壊の一つとして投げてしまわず、"}, {"t": 912.6333333333333, "x": "世界の声にも耳を貸してほしいと。"}, {"t": 915.0166666666667, "x": "世界からも見られていたのね。"}, {"t": 916.9, "x": "フランスやイタリアの美術界も\n心配している、と話している。"}, {"t": 920.5333333333333, "x": "のちの委員長も、金閣の火事は委員会ができる\n前のことだった、と振り返っている。"}, {"t": 925.45, "x": "だからまず火事を防ぐことを第一にしたと。"}, {"t": 928.1666666666666, "x": "金閣の火事が守り方を変えたのね。"}, {"t": 930.6333333333333, "x": "1953年の予算の説明では、こう言われている。"}, {"t": 934.2333333333333, "x": "金閣や法隆寺の火災もあって修理から、\n火災を防ぐことへ重点を移す。"}, {"t": 938.8166666666667, "x": "そのための経費を、\n約2千万円増やすという説明だった。"}, {"t": 943.1333333333333, "x": "金閣の火事はそのあとも国会で話に出たの？"}, {"t": 946.25, "x": "何年にもわたって、何度も出てくる。"}, {"t": 948.6166666666667, "x": "焼けて1か月もたたない7月31日、\n参議院の本会議でこんな質問があった。"}, {"t": 954.0333333333333, "x": "軍閥や官僚の時代でさえ無事だった法隆寺や\n金閣寺が、この内閣ができてから次々に焼けていく。"}, {"t": 960.3166666666667, "x": "「一体どうした皮肉であるか」と。"}, {"t": 962.5166666666667, "x": "政府を責める材料にもなったのね。"}, {"t": 964.75, "x": "そうだ。"}, {"t": 965.8666666666667, "x": "ただ法隆寺の金堂の火事は、\n出火の原因が今も一つに決まっていない。"}, {"t": 970.2833333333333, "x": "金閣は寺の中の人が火を付けた事件だ。"}, {"t": 973.15, "x": "二つは同じ「焼けた国宝」として\n並べられたが、中身はまるで違う。"}, {"t": 977.7666666666667, "x": "まとめて言われると、違いが見えなくなるのね。"}, {"t": 980.55, "x": "4年後1954年の予算の分科会では、\n滋賀県の彦根城の傷みを訴えた議員がこう言っている。"}, {"t": 986.8833333333333, "x": "「京都の金閣寺のごとく、一ぺん焼かれてしまうと、\n何を言ったってだめなんですから」。"}, {"t": 991.9833333333333, "x": "焼けてからでは遅い、ってことね。"}, {"t": 994.0666666666667, "x": "金閣はほかの文化財を守るための、\nたとえ話になっていった。"}, {"t": 998.0, "x": "1957年の参議院の予算委員会では、\n別の議員がこう並べた。"}, {"t": 1002.7, "x": "「最近は法隆寺、金閣寺、\n延暦寺が焼けております」。"}, {"t": 1006.35, "x": "延暦寺も？"}, {"t": 1007.4833333333333, "x": "1956年の秋に、\n比叡山の延暦寺の大講堂が焼けている。"}, {"t": 1011.9833333333333, "x": "そのときも金閣の名前がまた引き合いに出された。"}, {"t": 1015.0166666666667, "x": "お金では償えない宝だ、という言葉と一緒にだ。"}, {"t": 1018.3666666666667, "x": "金閣は焼けたあとも、ずっと呼び出されていたのね。"}, {"t": 1022.05, "x": "裁判はいつ始まったの？"}, {"t": 1023.8, "x": "火事から11日後の7月13日に、起訴された。"}, {"t": 1027.3, "x": "罪は放火と当時の国宝を守る法律に\n反したことだと、新聞は伝えている。"}, {"t": 1032.2833333333333, "x": "二つの罪なのね。"}, {"t": 1033.75, "x": "建物を焼いたことと、国宝を壊したことだ。"}, {"t": 1036.6333333333334, "x": "第一回の公判は、\n7月24日京都地方裁判所で開かれた。"}, {"t": 1041.0666666666666, "x": "美術の年鑑にも、その日付が残っている。"}, {"t": 1044.1, "x": "本人は何て言ったの？"}, {"t": 1045.6666666666667, "x": "起訴された事実は、認めたと伝えられている。"}, {"t": 1048.6666666666667, "x": "火を付けたことは、認めたのね。"}, {"t": 1050.9166666666667, "x": "そうだ。そこは最初から争っていない。"}, {"t": 1053.35, "x": "争点になったのは、なぜ火を付けたのかと、\n本人に責任を問えるかどうかだった。"}, {"t": 1058.4, "x": "責任を問えるかどうか？"}, {"t": 1060.05, "x": "自分のしたことが分かって、やめることもできる\n状態だったか、ということだ。"}, {"t": 1064.5833333333333, "x": "それを調べるため、京都大学の医師が\n何回かに分けて本人に会った。"}, {"t": 1068.8666666666666, "x": "8月から10月にかけて、5回だったと記録にある。"}, {"t": 1072.3833333333334, "x": "結果は？"}, {"t": 1073.5, "x": "裁判所はその結果をもとに、責任を問えると判断した。"}, {"t": 1077.1333333333334, "x": "この回では医師がつけた見立ての名前は言わない。"}, {"t": 1079.8333333333333, "x": "名前で人を説明した気になってしまうからだ。"}, {"t": 1082.7666666666667, "x": "分かった。"}, {"t": 1083.9, "x": "法廷で本人が口にした、ある言葉のほうを見ておこう。"}, {"t": 1087.85, "x": "法廷では理由を話したの？"}, {"t": 1089.6666666666667, "x": "検察がこういう動機だと述べた場面がある。"}, {"t": 1092.2166666666667, "x": "それに対して本人はこう答えたと記録されている。"}, {"t": 1095.2666666666667, "x": "「本当といえば本当、本当でないと\nいえば本当でない」。"}, {"t": 1098.6, "x": "えどっちなの？"}, {"t": 1099.7333333333333, "x": "どっちとも取れる。"}, {"t": 1100.9833333333333, "x": "はぐらかしたのかしら。"}, {"t": 1102.5333333333333, "x": "そう聞こえるかもしれない。"}, {"t": 1104.0, "x": "でも自分でも一つにまとめられなかった、とも読める。"}, {"t": 1107.1833333333334, "x": "逮捕の日の「落ちついてから」と、\nつながっている気もする。"}, {"t": 1110.8166666666666, "x": "結局落ちついても答えは一つにならなかったのね。"}, {"t": 1114.05, "x": "検察の締めくくりの言葉は、厳しかった。"}, {"t": 1116.85, "x": "金閣を焼く理由は何も無く、\nまったくの独りよがりの犯罪だと。"}, {"t": 1120.8666666666666, "x": "自分の満足のために、社会を\n犠牲にしたとも言っている。"}, {"t": 1124.4333333333334, "x": "検察は理由が無いと言い切ったのね。"}, {"t": 1126.75, "x": "本人の側は理由をはっきり言わない。"}, {"t": 1128.8666666666666, "x": "検察は理由など無いと言う。"}, {"t": 1130.5833333333333, "x": "この二つのあいだに、たくさんの人が\n自分の答えを入れていった。"}, {"t": 1134.4833333333333, "x": "作家たちも？"}, {"t": 1135.6666666666667, "x": "そうだ。"}, {"t": 1136.8, "x": "その話は終わりのほうで、少しだけ触れる。"}, {"t": 1139.5166666666667, "x": "まずは判決の日だ。"}, {"t": 1141.5666666666666, "x": "12月20日検察は懲役10年を求めた。"}, {"t": 1144.7166666666667, "x": "10年。"}, {"t": 1145.85, "x": "判決はその8日後の12月28日だった。"}, {"t": 1149.0, "x": "美術の年鑑には、こう残っている。"}, {"t": 1151.3166666666666, "x": "「28日の京都地裁における最終公判で\n懲役7年の判決を言い渡された」。"}, {"t": 1156.5666666666666, "x": "7年なのね。"}, {"t": 1157.75, "x": "つかまってから判決までの日数のうち、\n150日は刑から差し引かれた。"}, {"t": 1162.3833333333334, "x": "判決の前に閉じ込められていた日の一部を、\n刑をつとめた日として数える仕組みだ。"}, {"t": 1167.4, "x": "控訴はしたの？"}, {"t": 1168.5666666666666, "x": "しなかった。"}, {"t": 1169.7, "x": "本人も検察も上の裁判所へは進まず、7年で確定した。"}, {"t": 1173.9333333333334, "x": "火事から半年足らずで決まったのね。"}, {"t": 1176.3166666666666, "x": "12月28日という日には、もう一つ重なりがある。"}, {"t": 1179.9166666666667, "x": "金閣が今の国宝のもとになる「特別保護建造物」に\n指定されたのは、1897年の12月28日だった。"}, {"t": 1188.2, "x": "同じ日付なの？"}, {"t": 1189.4833333333333, "x": "53年後の同じ日に、それを焼いた\n人の判決が出たことになる。"}, {"t": 1193.6666666666667, "x": "もちろん狙ってそうなったわけではない。"}, {"t": 1195.95, "x": "偶然ね。"}, {"t": 1197.0666666666666, "x": "その後1952年の恩赦で、刑は5年3か月に縮められた。"}, {"t": 1201.6166666666666, "x": "恩赦って？"}, {"t": 1202.75, "x": "国の節目に刑を軽くしたり許したりすることだ。"}, {"t": 1205.7833333333333, "x": "この年は日本が独立を取り戻した年だった。"}, {"t": 1208.7666666666667, "x": "本人は刑務所で過ごす年月に入っていく。"}, {"t": 1212.1666666666667, "x": "焼けた金閣は国宝のままなの？"}, {"t": 1214.4333333333334, "x": "そこが建て直しの大きな問題になった。"}, {"t": 1216.9, "x": "11月13日の衆議院の文部委員会で、ある議員が\nこう尋ねた。"}, {"t": 1221.2166666666667, "x": "国宝になるなら寄付がたくさん\n集まるらしいが、ならないなら"}, {"t": 1224.8333333333333, "x": "あまり集まらないらしいと新聞に出ていると。"}, {"t": 1227.1, "x": "国宝になるかどうかで、寄付が変わるの？"}, {"t": 1229.7, "x": "そう言われていた。"}, {"t": 1230.7333333333333, "x": "議員はこうも言っている。"}, {"t": 1232.1, "x": "なるつもりで集めて、だめになったら、\n詐欺の罪に問われかねない。"}, {"t": 1236.1166666666666, "x": "それは困るわね。"}, {"t": 1237.3666666666666, "x": "文化財保護委員会の事務局長の答えは、\nはっきりしていた。"}, {"t": 1241.1, "x": "建物は完全に焼けていて、同じ形のものができても、\n国宝としての指定は不可能ではないか。"}, {"t": 1247.2, "x": "同じ形に建ててもだめなの？"}, {"t": 1249.2666666666667, "x": "国宝はその時代に作られた\n本物であることに重みがある。"}, {"t": 1252.8, "x": "新しく建てたものは、形が同じでも\n同じものではない、という考え方だ。"}, {"t": 1257.6, "x": "なるほどね。"}, {"t": 1258.7333333333333, "x": "ただ事務局長は庭のほうは守ると言った。"}, {"t": 1261.3, "x": "池の中の島も含めた庭は名勝に\n指定されていて、木の被害は元に戻せると。"}, {"t": 1266.3166666666666, "x": "だからできれば前のような景色で\n金閣が建て直されるのが望ましい。"}, {"t": 1270.2833333333333, "x": "でも国宝と同じ立場で国が助けるのは\n無理だろう、という答えだった。"}, {"t": 1274.65, "x": "国宝のお金は出ないのね。"}, {"t": 1276.4666666666667, "x": "代わりに観光の方面で大いに力を\n入れてほしい、と付け加えている。"}, {"t": 1280.5666666666666, "x": "また観光なのね。"}, {"t": 1281.9333333333334, "x": "建て直しのお金は寺と寄付と、観光にかかっていた。"}, {"t": 1285.9, "x": "お寺の責任はどう見られていたの？"}, {"t": 1288.0833333333333, "x": "1952年12月、参議院の文部委員会に、\n京都の古い寺を代表する団体の会長が呼ばれた。"}, {"t": 1294.8833333333334, "x": "京都古文化保存協会という団体だ。"}, {"t": 1297.3333333333333, "x": "会長は法隆寺と金閣寺をはっきり分けて話した。"}, {"t": 1300.5166666666667, "x": "法隆寺は修理を国にまかせている最中に焼けた。"}, {"t": 1303.5, "x": "だから寺だけを責めるのは気の毒だ、という立場だ。"}, {"t": 1306.7666666666667, "x": "金閣のほうは？"}, {"t": 1308.0, "x": "「あれなどは法隆寺の場合などとは非常に違う」。"}, {"t": 1310.6666666666667, "x": "「社寺みずからが、社寺の責任者の責任を\nとらなければならない問題だと私は考える」。"}, {"t": 1316.15, "x": "寺の仲間からも、厳しく見られていたのね。"}, {"t": 1319.0333333333333, "x": "同じ京都の寺の側から出た言葉だ。"}, {"t": 1321.45, "x": "住職の監督が行き届かなかった、という見方だった。"}, {"t": 1325.0666666666666, "x": "住職さんがおわびを繰り返したのも、そういうことね。"}, {"t": 1328.35, "x": "住職本人も自分の指導が至らなかったと言っていた。"}, {"t": 1331.65, "x": "国からも寺の仲間からも、そして住職自身からも、\n責任は寺にあると言われた。"}, {"t": 1337.0166666666667, "x": "だから建て直すのも寺が中心になったのね。"}, {"t": 1339.9333333333334, "x": "1950年の国会でも、金閣寺は寺の持ち物で、\n寺の決意がなければ建て直せないと言われていた。"}, {"t": 1346.5833333333333, "x": "国宝に戻らない以上、国が全部を出すこともない。"}, {"t": 1349.7166666666667, "x": "寺がまず動くしかなかった。"}, {"t": 1352.1333333333334, "x": "じゃあお金はどうやって集めたの？"}, {"t": 1354.1333333333334, "x": "住職の村上慈海は、托鉢に出たと伝えられている。"}, {"t": 1357.7666666666667, "x": "托鉢ってお坊さんがお椀を持って回るあれ？"}, {"t": 1360.4666666666667, "x": "そうだ。"}, {"t": 1361.6, "x": "家々を回ってお布施を受ける修行だ。"}, {"t": 1363.75, "x": "その托鉢で再建のためのお金を集めて回った。"}, {"t": 1367.0166666666667, "x": "弟子のしたことを、自分の足で埋め合わせたのね。"}, {"t": 1370.0166666666667, "x": "そういう形になった。"}, {"t": 1371.4833333333333, "x": "全国からも寄付が寄せられた。"}, {"t": 1373.4333333333334, "x": "1950年の国会では寄付が国宝になるか\nどうかで変わると言われていた。"}, {"t": 1378.0166666666667, "x": "国宝に戻らないという答えが出たあとも、\n起工できるだけのお金は集まっていった。"}, {"t": 1382.9166666666667, "x": "国宝かどうかより、金閣そのものを\n取り戻したい人が多かったのね。"}, {"t": 1387.2166666666667, "x": "そう受け取れる。"}, {"t": 1388.3333333333333, "x": "ただ集まった額や人数は、資料によって数え方が違う。"}, {"t": 1391.9333333333334, "x": "この回では確かめられた数字だけを言う。"}, {"t": 1394.45, "x": "確かめられた数字って？"}, {"t": 1396.15, "x": "1952年3月の時点で、美術の年鑑はこう書いている。"}, {"t": 1400.3833333333334, "x": "「再建資金の一部がまとまったので、\n22日午前10時から起工式を\n行い、再建にとりかかった」。"}, {"t": 1406.7666666666667, "x": "一部なのね。"}, {"t": 1407.9166666666667, "x": "全部そろってから、ではなかった。"}, {"t": 1410.0333333333333, "x": "集まった分でまず始めた。"}, {"t": 1411.9, "x": "火事から1年8か月ちょっとね。"}, {"t": 1414.1833333333334, "x": "1950年の国会で、寺が重大な\n決意をしなければ、と言われていた。"}, {"t": 1418.9833333333333, "x": "その決意がこの起工式だったと言っていい。"}, {"t": 1421.5166666666667, "x": "そしてこの時の計画には、一つ特徴があった。"}, {"t": 1425.3833333333334, "x": "特徴って？"}, {"t": 1426.5166666666667, "x": "年鑑の続きはこうだ。"}, {"t": 1428.0666666666666, "x": "「予算1500万円で3か年計画とし、原型どおり、\nとりあえず白木造りのものを造る」。"}, {"t": 1433.7166666666667, "x": "白木って色を塗らない木のままってこと？"}, {"t": 1436.1833333333334, "x": "そうだ。"}, {"t": 1437.3166666666666, "x": "金箔を張る前の、木の地のままの金閣だ。"}, {"t": 1440.2833333333333, "x": "金色じゃない金閣を、まず建てるつもりだったの？"}, {"t": 1443.35, "x": "「とりあえず」と書いてある。"}, {"t": 1444.8833333333334, "x": "お金がそろっていなかったから、まず\n形を戻すことを先にしたと読める。"}, {"t": 1449.3333333333333, "x": "予算は1500万円。"}, {"t": 1451.0, "x": "そして3か年の計画だ。"}, {"t": 1452.8, "x": "寺の報告書では、工事に取りかかったのは\n1952年4月1日とされている。"}, {"t": 1458.2666666666667, "x": "起工式の10日後ね。"}, {"t": 1459.85, "x": "建物の形は創建されたころの姿に戻すことを目指した。"}, {"t": 1463.7166666666667, "x": "記録では江戸時代や明治に手が加えられた\n部分を、元に戻したところもあったという。"}, {"t": 1468.7, "x": "焼ける前より昔の形に近づけたのね。"}, {"t": 1471.55, "x": "1950年の国会でも、前よりも\n立派な姿に、と言われていた。"}, {"t": 1476.1333333333334, "x": "問題は金をどうするかだった。"}, {"t": 1478.0166666666667, "x": "白木のまま終わるのか、それとも金色に戻せるのか。"}, {"t": 1481.4333333333334, "x": "結局どうなったの？"}, {"t": 1482.8833333333334, "x": "それは5年目の秋に分かる。"}, {"t": 1484.6166666666666, "x": "その前に刑務所に入った本人のほうを見ておこう。"}, {"t": 1488.1666666666667, "x": "判決のあと本人はどこにいたの？"}, {"t": 1490.4166666666667, "x": "記録では1951年1月18日に、\n兵庫県の加古川刑務所に入った。"}, {"t": 1495.85, "x": "金閣の起工式が開かれたとき、\n本人はそこにいたことになる。"}, {"t": 1500.0, "x": "自分が焼いた建物が、建て直され始めたころね。"}, {"t": 1503.3333333333333, "x": "そうだ。"}, {"t": 1504.4666666666667, "x": "本人がそれを知っていたか\nどうかは、記録では分からない。"}, {"t": 1507.7166666666667, "x": "1953年3月12日、\n東京の八王子医療刑務所へ移された。"}, {"t": 1512.8, "x": "医療刑務所？"}, {"t": 1513.9166666666667, "x": "病気の手当てが必要な人が入る刑務所だ。"}, {"t": 1516.7333333333333, "x": "体を結核にむしばまれていた。"}, {"t": 1518.9333333333334, "x": "結核ってお父さんと同じ病気ね。"}, {"t": 1521.2666666666667, "x": "そうだ。"}, {"t": 1522.4, "x": "父親も結核で44歳で亡くなっている。"}, {"t": 1525.25, "x": "本人は心の具合も悪くしていたと記録にある。"}, {"t": 1528.35, "x": "刑務所の中で病気が重くなっていったのね。"}, {"t": 1531.1333333333334, "x": "1955年の10月、京都の刑務所へ移された。"}, {"t": 1534.8, "x": "そして10月30日に、刑期を終えて外へ出た。"}, {"t": 1538.0833333333333, "x": "10月30日。"}, {"t": 1539.5166666666667, "x": "出てすぐ京都府立の洛南病院に入院した。"}, {"t": 1542.55, "x": "外に出てもそのまま病院なのね。"}, {"t": 1544.7833333333333, "x": "刑務所に入ってから4年9か月がたっていた。"}, {"t": 1547.6666666666667, "x": "この日付を少し覚えておいてほしい。"}, {"t": 1549.8166666666666, "x": "金閣のほうも同じ10月に大きな日を迎えていた。"}, {"t": 1553.5666666666666, "x": "1955年9月30日、新しい金閣の工事が終わった。"}, {"t": 1558.0333333333333, "x": "そして10月10日、落慶供養が開かれた。"}, {"t": 1561.1, "x": "落慶供養って？"}, {"t": 1562.3833333333334, "x": "建物ができあがったことを、\n仏さまに報告して祝う儀式だ。"}, {"t": 1566.2166666666667, "x": "美術の年鑑にはこうある。"}, {"t": 1567.9166666666667, "x": "「再建成って五年ぶりに秀麗な姿をみせ、\n10日盛大に落慶供養を行った」。"}, {"t": 1572.9333333333334, "x": "5年ぶり。"}, {"t": 1574.0666666666666, "x": "焼けた日から数えて、5年と3か月あまりだ。"}, {"t": 1577.1833333333334, "x": "白木のままだったの？"}, {"t": 1578.7, "x": "いや。"}, {"t": 1579.8166666666666, "x": "続きにこう書いてある。"}, {"t": 1581.2166666666667, "x": "総ひのき造りで、1階は白木のまま、\n2階と3階は内も外も金箔押し。"}, {"t": 1586.2333333333333, "x": "屋上には金色の鳳凰がはばたく、\n創建当初の形に戻したと。"}, {"t": 1590.5833333333333, "x": "金色に戻ったのね。"}, {"t": 1592.1166666666666, "x": "「とりあえず白木で」と言っていた\n計画は、金色の金閣で終わった。"}, {"t": 1596.15, "x": "建て直された金閣は、2階と\n3階が内も外も金色になった。"}, {"t": 1600.3166666666666, "x": "美術の年鑑が「創建当初の形」と\n書いたのは、そういう意味だ。"}, {"t": 1604.8166666666666, "x": "焼ける前よりまぶしくなって戻ってきたのね。"}, {"t": 1607.45, "x": "鳳凰はあの焼けずに残った鳳凰？"}, {"t": 1609.5, "x": "京都市の文化財に指定されたのは、\n焼けずに残ったほうの鳳凰だ。"}, {"t": 1613.5166666666667, "x": "屋根の上の鳳凰とは別に、大切に守られている。"}, {"t": 1616.7666666666667, "x": "焼けなかった鳳凰は、屋根とは別の場所にいるのね。"}, {"t": 1619.95, "x": "そういうことだ。"}, {"t": 1620.9666666666667, "x": "そして落慶供養の20日後が、10月30日だ。"}, {"t": 1624.4666666666667, "x": "本人が刑務所を出た日ね。"}, {"t": 1626.3166666666666, "x": "金閣が戻ってきた同じ月に、焼いた人も外へ出てきた。"}, {"t": 1630.1166666666666, "x": "ただその人に残された時間は短かった。"}, {"t": 1633.5, "x": "病院に入ってから、どうなったの？"}, {"t": 1635.7833333333333, "x": "記録では1956年3月7日の午前に亡くなった。"}, {"t": 1639.7166666666667, "x": "結核だった。"}, {"t": 1640.8, "x": "26歳だった。"}, {"t": 1642.2333333333333, "x": "外に出てから半年もたってないじゃない。"}, {"t": 1644.7333333333333, "x": "4か月と少しだ。"}, {"t": 1646.3166666666666, "x": "新しい金閣は見たのかしら。"}, {"t": 1648.3833333333334, "x": "見たかどうかは、記録では確かめられない。"}, {"t": 1650.9, "x": "この回では見たとも見なかったとも言わない。"}, {"t": 1653.45, "x": "最後まで動機は話さなかったの？"}, {"t": 1655.65, "x": "本人の口から一つの答えが\nまとまって出ることはなかった。"}, {"t": 1659.25, "x": "逮捕の日は「落ちついてから」。"}, {"t": 1661.15, "x": "法廷では「本当といえば本当、\n本当でないといえば本当でない」。"}, {"t": 1665.25, "x": "落ちつく時は来なかったのね。"}, {"t": 1667.2, "x": "来なかったのか、来ても\n言わなかったのか、それも分からない。"}, {"t": 1670.7333333333333, "x": "墓は舞鶴の村の、母親の墓の隣にある。"}, {"t": 1673.95, "x": "事件から6年もたっていないのね。"}, {"t": 1676.2166666666667, "x": "金閣が焼けてから、本人が\n亡くなるまで、5年8か月だった。"}, {"t": 1680.3666666666666, "x": "その間に母親が亡くなり、金閣は建て直された。"}, {"t": 1683.8, "x": "本人だけがいなくなったのね。"}, {"t": 1685.8166666666666, "x": "本人が亡くなった1956年、三島由紀夫がこの事件を\n題材にした小説『金閣寺』を出している。"}, {"t": 1692.7333333333333, "x": "のちに水上勉も、『金閣炎上』という本を書いた。"}, {"t": 1696.2666666666667, "x": "ただそれは作家がそれぞれに考えた答えだ。"}, {"t": 1698.9666666666667, "x": "本人の答えではないことは、分けておきたい。"}, {"t": 1702.3, "x": "建て直したあとの金閣は、どうなったの？"}, {"t": 1704.9833333333333, "x": "意外な話が一つ、国会に残っている。"}, {"t": 1707.75, "x": "建て直しから9か月後、\n1956年7月27日の衆議院の地方行政委員会だ。"}, {"t": 1714.0, "x": "ある議員がこう言っている。"}, {"t": 1715.4, "x": "「金閣寺、苔寺その他はそれぞれ観光客が\n入場することを断っておる状態です」。"}, {"t": 1720.6666666666667, "x": "え見せるのを断ったの？"}, {"t": 1722.2666666666667, "x": "そうだ。"}, {"t": 1723.4, "x": "「現在ストライキを決行しておるというような\n状態」とまで言っている。"}, {"t": 1727.3833333333334, "x": "お寺がストライキ？"}, {"t": 1728.7, "x": "京都市がお寺の拝観料に税をかけようとしたからだ。"}, {"t": 1731.8833333333334, "x": "文化観光施設税という税だった。"}, {"t": 1734.1666666666667, "x": "同じ年の9月国の担当者は国会で\nその中身を説明している。"}, {"t": 1738.3166666666666, "x": "お金を取って見せている所だけに、\n1回10円中学生以下は5円をかける。"}, {"t": 1742.9, "x": "無料で見せている所には、かけない仕組みだった。"}, {"t": 1746.0, "x": "10円でもお寺は反対したのね。"}, {"t": 1748.1833333333334, "x": "お参りに来た人に直接税をかけるのは、\n宗教の上から受け入れられない、という反対だった。"}, {"t": 1753.85, "x": "観光の町のお金の話ね。"}, {"t": 1755.95, "x": "建て直しのとき、国は観光で\n力を入れてほしいと言った。"}, {"t": 1759.4666666666667, "x": "京都の議員は金閣が無いとバスと\n電車の収入が減ると言った。"}, {"t": 1763.35, "x": "そして今度はその観光に税をかける。"}, {"t": 1765.8, "x": "建て直した金閣が、また\n町の財布の真ん中に置かれたわけだ。"}, {"t": 1769.8666666666666, "x": "金閣はただのお寺じゃいられなかったのね。"}, {"t": 1772.45, "x": "同じ年の衆議院の文教委員会では、\n文部大臣が遠足の話もしている。"}, {"t": 1777.2333333333333, "x": "遠足で京都に来れば金閣寺銀閣寺清水と、\n十も十五も見て回る。"}, {"t": 1781.7666666666667, "x": "拝観料が高くなれば、\n子どもの負担が増える、と心配した。"}, {"t": 1785.7833333333333, "x": "焼けて建て直されて、すぐに\nみんなが見たい場所に戻ったのね。"}, {"t": 1789.5833333333333, "x": "それだけ多くの人にとって大事な建物だった。"}, {"t": 1793.1833333333334, "x": "作家の話は聞いたけど、絵にした人もいるの？"}, {"t": 1796.2833333333333, "x": "いる。"}, {"t": 1797.4166666666667, "x": "日本画家の 川端龍子 だ。"}, {"t": 1799.6, "x": "焼けたその年に、「金閣炎上」という\n大きな絵を描いた。"}, {"t": 1803.2333333333333, "x": "その年に？"}, {"t": 1804.3666666666666, "x": "文化遺産オンラインの説明では、\n事件の約2か月後に描かれた。"}, {"t": 1808.4166666666667, "x": "縦およそ1.4メートル、横およそ2.\n4メートルの掛け軸だ。"}, {"t": 1812.6166666666666, "x": "大きいわね。"}, {"t": 1813.75, "x": "その年の青龍展という展覧会に出された。"}, {"t": 1816.55, "x": "現場で写生することはできず、\n思い描いて描いたという。"}, {"t": 1819.9666666666667, "x": "見ていない火事を描いたのね。"}, {"t": 1821.8, "x": "あまりに早く描いたことに、批判も出たとされる。"}, {"t": 1824.9, "x": "まだ生々しいのに、ってことね。"}, {"t": 1827.05, "x": "墨と朱と金で炎に包まれる金閣を描いている。"}, {"t": 1830.2166666666667, "x": "そして川端龍子は、1956年にもう一枚描いた。"}, {"t": 1834.3833333333334, "x": "もう一枚？"}, {"t": 1835.5166666666667, "x": "「金閣再現」という絵だ。"}, {"t": 1837.2166666666667, "x": "建て直された金閣を描いたものだ。"}, {"t": 1839.6, "x": "焼けるところと、戻ったところを、両方描いたのね。"}, {"t": 1842.9666666666667, "x": "一人の画家が6年のあいだに\n同じ建物を2回描いたことになる。"}, {"t": 1846.9333333333334, "x": "燃える金閣と建て直された金閣だ。"}, {"t": 1849.3166666666666, "x": "この回で追ってきた5年を、\n絵の上でもたどった人がいた。"}, {"t": 1853.3333333333333, "x": "金閣の火事のあと、京都では何か変わったの？"}, {"t": 1856.4166666666667, "x": "今も続いているものがある。"}, {"t": 1858.0333333333333, "x": "京都市消防局が、毎年7月に行っている\n「夏の文化財防火運動」だ。"}, {"t": 1863.1, "x": "夏に？"}, {"t": 1864.2333333333333, "x": "消防局の資料には、こう書かれている。"}, {"t": 1866.6833333333334, "x": "「昭和25年7月2日に発生した鹿苑寺\n（金閣）の火災を契機として」。"}, {"t": 1871.8666666666666, "x": "全国いっせいの火災予防運動とは別に、\n毎年行っている京都市だけの取り組みだ。"}, {"t": 1876.9, "x": "金閣の火事がきっかけなのね。"}, {"t": 1879.0166666666667, "x": "2026年は7月12日から18日までの1週間だった。"}, {"t": 1883.55, "x": "何をするの？"}, {"t": 1884.6666666666667, "x": "消防が文化財のある寺や神社に\n立ち入って、火の扱いを調べる。"}, {"t": 1888.7333333333333, "x": "消火栓や放水銃の使い方を、寺の人に教える。"}, {"t": 1892.1, "x": "寺の人と消防が一緒に、火を消す\n訓練や、文化財を運び出す訓練もする。"}, {"t": 1897.2, "x": "放水銃って？"}, {"t": 1898.3666666666666, "x": "建物に向けて遠くから水を勢いよく出す装置だ。"}, {"t": 1901.5333333333333, "x": "金閣寺にものちにそうした設備が整えられた。"}, {"t": 1904.55, "x": "1987年の秋、金閣は漆と金箔を\n塗り直す大きな修理を受けた。"}, {"t": 1909.8166666666666, "x": "それをきっかけに、古くなった\n防災の設備も作り直すことになった。"}, {"t": 1914.15, "x": "火事から40年近くたってから？"}, {"t": 1916.45, "x": "そうだ。"}, {"t": 1917.5833333333333, "x": "寺の報告書には貯水槽、\n防災センター放水銃の予定地が並んでいる。"}, {"t": 1922.0333333333333, "x": "工事の前に地面を調べたところ、\n北山殿の時代の跡も出てきたという。"}, {"t": 1926.5, "x": "火を防ぐための工事が、\n600年前の屋敷の跡を掘り当てたわけだ。"}, {"t": 1930.8833333333334, "x": "守るための工事で、昔のことが分かったのね。"}, {"t": 1933.9666666666667, "x": "金閣の火事から始まった運動は、\n70年以上たった今も、毎年7月に続いている。"}, {"t": 1940.3, "x": "ここまでの話は、何をもとにしてるの？"}, {"t": 1942.9833333333333, "x": "国会会議録と美術の年鑑の記録が中心だ。"}, {"t": 1946.1833333333334, "x": "それに寺の報告書、京都市と消防局の資料だ。"}, {"t": 1949.5166666666667, "x": "時刻や供述の言葉は、当時の新聞や\n本を引いた資料から使った。"}, {"t": 1953.8166666666666, "x": "だから「記録では」「伝えられている」と言ってきた。"}, {"t": 1957.1166666666666, "x": "話さなかったことは？"}, {"t": 1958.65, "x": "まず動機だ。"}, {"t": 1959.7833333333333, "x": "「美しさへの何とか」という言い方を\n聞いたことがあるかもしれない。"}, {"t": 1963.5, "x": "でもそれは本人の言葉として確かめられなかった。"}, {"t": 1966.7166666666667, "x": "だから使わなかったのね。"}, {"t": 1968.4833333333333, "x": "医師の見立ての名前も言っていない。"}, {"t": 1970.4333333333334, "x": "母親の名前と亡くなった場所も言っていない。"}, {"t": 1973.0333333333333, "x": "本人がふだんどこへ出かけていたか、といった\n私生活も話していない。"}, {"t": 1977.2333333333333, "x": "数字で言わなかったものは？"}, {"t": 1978.95, "x": "建て直しにかかった全部の費用と、\n寄付をした人の数だ。"}, {"t": 1982.5666666666666, "x": "出どころごとに数字がばらつき、\n元の記録で一つに決められなかった。"}, {"t": 1986.8, "x": "国宝の指定が外された日付も、確かめられなかった。"}, {"t": 1990.4166666666667, "x": "京都の法律の住民投票の結果も？"}, {"t": 1993.0166666666667, "x": "そうだ。"}, {"t": 1994.15, "x": "日付と結果を一次資料で\n確かめられなかったので言っていない。"}, {"t": 1997.8833333333334, "x": "分からないことは、分からないと言うのね。"}, {"t": 2000.4, "x": "それがこの回の決まりだった。"}, {"t": 2002.85, "x": "ねえ最初の鳳凰の話に戻っていい？"}, {"t": 2005.2166666666667, "x": "いいぞ。"}, {"t": 2006.35, "x": "あの鳳凰は外されていたから残ったのよね。"}, {"t": 2009.0166666666667, "x": "そうだ。"}, {"t": 2010.15, "x": "報知器は直る予定の日の未明に、鳴らなかった。"}, {"t": 2013.1, "x": "鳳凰は外されてしまわれていて、焼けなかった。"}, {"t": 2016.0666666666666, "x": "残ったものと残らなかったものが紙一重ね。"}, {"t": 2019.0, "x": "550年あまり残った建物が、1時間足らずで焼けた。"}, {"t": 2022.8833333333334, "x": "そして5年かけて、もう一度建った。"}, {"t": 2025.35, "x": "でも国宝には戻らなかった。"}, {"t": 2027.3666666666666, "x": "同じ形でも同じものではないからだ。"}, {"t": 2029.7166666666667, "x": "ただ建て直された金閣も、もう\n70年以上そこに立っている。"}, {"t": 2033.7, "x": "今の金閣にももう長い歴史があるのね。"}, {"t": 2036.3666666666666, "x": "1994年には、世界文化遺産にも登録された。"}, {"t": 2040.2166666666667, "x": "2003年の春にも、金箔の張り替えが行われている。"}, {"t": 2043.9, "x": "本人の「なぜ」は、結局分からないままね。"}, {"t": 2047.1166666666666, "x": "分からないままだ。"}, {"t": 2048.266666666667, "x": "本人は「落ちついてから」と言い、\nその答えを残さずに亡くなった。"}, {"t": 2052.383333333333, "x": "残ったのは記録と、建て直された\n金閣と、屋根から外されていた鳳凰だ。"}, {"t": 2057.2, "x": "鳳凰は全部を見ていたのかもしれないわね。"}, {"t": 2059.7166666666667, "x": "あの夜はしまわれていて見ていない。"}, {"t": 2061.6, "x": "だからこそ残った。"}, {"t": 2062.95, "x": "1950年7月2日、午前3時7分。"}, {"t": 2066.35, "x": "望楼の人が林の向こうに火を見つけた。"}, {"t": 2068.9333333333334, "x": "今回はその火から5年後の秋までを、\n記録で読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
