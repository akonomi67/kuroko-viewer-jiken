<script>
const D={"name": "126", "file": "126_編集用", "dur": 2054.2833125, "segs": [], "subs": [{"t": 0.0, "x": "屋根の上の金色の鳳凰と1枚の額。"}, {"t": 2.466666666666667, "x": "1950年7月2日の朝、京都の金閣から、\nこの2つだけは焼けずに残った。"}, {"t": 8.266666666666667, "x": "その時は建物から外されて、しまってあったからだ。"}, {"t": 11.75, "x": "じゃあ建物のほうは？"}, {"t": 13.166666666666666, "x": "金閣そのものは、焼けてなくなった。"}, {"t": 15.6, "x": "中にあった足利義満の像も一緒にだ。"}, {"t": 18.216666666666665, "x": "どちらも国宝だった。"}, {"t": 19.8, "x": "雷とか漏電とか？"}, {"t": 21.433333333333334, "x": "違う。"}, {"t": 22.016666666666666, "x": "火を付けたのは、同じ寺に\n住んでいた見習いの僧だった。"}, {"t": 25.416666666666668, "x": "年は21歳。"}, {"t": 26.616666666666667, "x": "京都の大学に通う学生でもあった。"}, {"t": 29.15, "x": "お寺の中の人が、自分のお寺に？"}, {"t": 31.7, "x": "そうだ。"}, {"t": 32.3, "x": "つかまった後でその学生は「動機は、\n落ちついてからにしてくれ」と\n言ったと伝えられている。"}, {"t": 37.81666666666667, "x": "理由は言わなかったの？"}, {"t": 39.3, "x": "はっきりとは言い切らなかった。"}, {"t": 41.016666666666666, "x": "今回はその学生の言葉と、焼けた金閣が5年で\nもう一度建つまでを、記録の順に追っていく。"}, {"t": 46.95, "x": "理由をこちらで決めつけることはしない。"}, {"t": 49.3, "x": "21歳って、大学生くらいよね？"}, {"t": 51.86666666666667, "x": "そうだ。寺に住み込みながら大学にも通っていた。"}, {"t": 54.983333333333334, "x": "その人が、自分の暮らす寺の国宝に火を付けた。"}, {"t": 58.416666666666664, "x": "残った鳳凰と額の話も、あとで出てくるのね？"}, {"t": 61.61666666666667, "x": "もちろんだ。"}, {"t": 62.45, "x": "まずは、火が見つかった時刻から始めよう。"}, {"t": 65.73333333333333, "x": "記録では火が出たのは7月2日の午前3時ごろだ。"}, {"t": 69.06666666666666, "x": "最初に見つけたのは、寺の人ではなかった。"}, {"t": 72.0, "x": "じゃあ誰が見つけたの？"}, {"t": 73.48333333333333, "x": "消防の出張所の、望楼にいた人だ。"}, {"t": 76.05, "x": "望楼は町を見張るための高い見張り台のことだ。"}, {"t": 78.96666666666667, "x": "そこから火が見えたのが、午前3時7分。"}, {"t": 81.8, "x": "寺の中では誰も気づかなかったのね。"}, {"t": 84.26666666666667, "x": "そういうことになる。"}, {"t": 85.46666666666667, "x": "知らせから6分後には、最初の消防車が着いた。"}, {"t": 88.55, "x": "ところが金閣は、衣笠山のふもとの林の中にある。"}, {"t": 92.2, "x": "道が悪く火の様子をつかめたのは\n午前3時17分ごろだった。"}, {"t": 96.2, "x": "着いてからさらに4分。"}, {"t": 97.8, "x": "そうだ。"}, {"t": 98.4, "x": "午前3時40分ごろには、\n3階の柱が燃えて屋根が落ちた。"}, {"t": 102.41666666666667, "x": "火がほぼおさまったのは、午前3時50分ごろだ。"}, {"t": 105.61666666666666, "x": "見つかってから、1時間もたっていないじゃない。"}, {"t": 108.46666666666667, "x": "木でできた3階建てだ。"}, {"t": 110.05, "x": "一度火が回ると、止めようがなかった。"}, {"t": 112.45, "x": "夜が明けるころには、金閣は焼け落ちていた。"}, {"t": 115.33333333333333, "x": "池って金閣が映るあの池？"}, {"t": 117.35, "x": "鏡湖池だ。"}, {"t": 118.21666666666667, "x": "庭も国の名勝で、木の何本かが\n焼けたと国会で報告されている。"}, {"t": 123.1, "x": "そもそも金閣って、どういう建物だったの？"}, {"t": 126.06666666666666, "x": "正しくは舎利殿という。"}, {"t": 127.55, "x": "お釈迦さまの骨を納めるための建物だ。"}, {"t": 130.08333333333334, "x": "建てたのは室町幕府の3代将軍足利義満。"}, {"t": 133.4, "x": "1398年ごろ、北山殿という屋敷の中に建てられた。"}, {"t": 137.9, "x": "今から600年以上も前ね。"}, {"t": 140.01666666666668, "x": "3つの階でつくりが全部違う。"}, {"t": 142.03333333333333, "x": "1階は法水院といって、貴族の屋敷のようなつくり。"}, {"t": 145.36666666666667, "x": "2階は潮音洞で、武家の屋敷のようなつくり。"}, {"t": 148.21666666666667, "x": "3階は究竟頂で、禅宗のお寺の仏間のつくりだ。"}, {"t": 151.75, "x": "階ごとに別の建物みたいなのね。"}, {"t": 154.11666666666667, "x": "そうだ。"}, {"t": 154.75, "x": "2階と3階には、金箔が張られていた。"}, {"t": 157.41666666666666, "x": "だから「金閣」と呼ばれるようになった。"}, {"t": 160.11666666666667, "x": "最初から金閣って名前じゃなかったの？"}, {"t": 162.65, "x": "京都市の資料では、「金閣」の名が\n初めて見えるのは1484年だ。"}, {"t": 167.48333333333332, "x": "応仁の乱で周りの建物はほとんど焼けた。"}, {"t": 170.2, "x": "それでも金閣だけは焼けずに残った。"}, {"t": 172.68333333333334, "x": "戦の火もくぐり抜けたのね。"}, {"t": 174.66666666666666, "x": "1897年には国の特別保護建造物に指定された。"}, {"t": 178.93333333333334, "x": "国が守るべき建物として名前が挙がったわけだ。"}, {"t": 182.0, "x": "明治の終わりには、大きな修理も受けている。"}, {"t": 184.6, "x": "1903年から1906年にかけて、\n一度ばらしてから組み直した。"}, {"t": 189.45, "x": "北山殿ができたころから残っていた、\nただ1つの建物だった。"}, {"t": 194.2, "x": "あの夜何が焼けたの？"}, {"t": 195.75, "x": "当時の美術の年鑑には、こう書かれている。"}, {"t": 198.43333333333334, "x": "「国宝三層楼金閣から出火、同閣および閣中に\n安置された国宝義満像はじめ\n古美術品などを全焼した」。"}, {"t": 205.75, "x": "義満の像も国宝だったのね。"}, {"t": 207.96666666666667, "x": "座った姿の木の像だ。"}, {"t": 209.65, "x": "記録では焼けた胴体の部分だけが見つかったという。"}, {"t": 212.65, "x": "ほかにも観音や阿弥陀などの像が焼けた。"}, {"t": 215.11666666666667, "x": "義満はこの北山の地で政治をとり、\n1408年にここで亡くなった人だ。"}, {"t": 220.11666666666667, "x": "その人の姿を写した像が、自分の建てた\n建物と一緒に焼けたことになる。"}, {"t": 225.08333333333334, "x": "建てた人の像まで、なくなったのね。"}, {"t": 227.45, "x": "じゃあ最初に言った鳳凰と額は？"}, {"t": 229.45, "x": "京都市の歴史資料館の説明ではこうだ。"}, {"t": 232.08333333333334, "x": "鳳凰と後小松天皇が書いた「究竟頂」の額は\n焼けた時、金閣から取り外されて保存されていた。"}, {"t": 238.53333333333333, "x": "外してしまってあったのね？"}, {"t": 240.33333333333334, "x": "そうだ。"}, {"t": 240.96666666666667, "x": "なぜ外してあったのかまでは、\nこの資料には書かれていない。"}, {"t": 244.3, "x": "屋根には代わりの鳳凰が付いていたと\n伝えられている。"}, {"t": 247.2, "x": "本物はしまわれていたおかげで残った。"}, {"t": 249.66666666666666, "x": "その鳳凰は今どうなってるの？"}, {"t": 251.55, "x": "1999年に京都市の文化財に指定された。"}, {"t": 255.1, "x": "寺の古い日記『隔蓂記』も、\n別の文庫にあって無事だった。"}, {"t": 259.26666666666665, "x": "建物の外にあったものは、助かったのね。"}, {"t": 262.18333333333334, "x": "逆に言えばあの夜に建物の中にあったものは、\nほとんど残らなかった。"}, {"t": 266.4, "x": "では建物の中で何が起きたのか。"}, {"t": 268.6666666666667, "x": "鍵になったのは、1台の機械だった。"}, {"t": 271.76666666666665, "x": "機械って？"}, {"t": 272.71666666666664, "x": "火災報知器だ。"}, {"t": 273.85, "x": "金閣には火が出たら知らせる装置が付いていた。"}, {"t": 276.8, "x": "じゃあなんで寺の人は気づかなかったの？"}, {"t": 279.23333333333335, "x": "その報知器の電源が、何日か前から故障していた。"}, {"t": 282.6666666666667, "x": "記録では6月29日の夜に壊れたという。"}, {"t": 285.6166666666667, "x": "修理は7月2日に来る予定だった。"}, {"t": 288.15, "x": "7月2日って火が出た日じゃない。"}, {"t": 290.45, "x": "そうだ。"}, {"t": 291.06666666666666, "x": "直る予定の日の、未明だった。"}, {"t": 293.2, "x": "偶然なの？"}, {"t": 294.23333333333335, "x": "のちの記録では、見習いの僧は\n故障していることを確かめていたとされる。"}, {"t": 298.53333333333336, "x": "報知器の電源は、寺の台所に\nあたる庫裡の部屋にあった。"}, {"t": 302.15, "x": "そこで電源が直っていないことを見てから、\n金閣へ向かった、という書き方だ。"}, {"t": 306.96666666666664, "x": "知っていたのね。"}, {"t": 308.1333333333333, "x": "寺に住む者なら、そういうことも耳に入る。"}, {"t": 310.95, "x": "報知器が鳴らなかったのは、\n偶然とは言えないかもしれない。"}, {"t": 314.43333333333334, "x": "知っていてその夜を選んだってこと？"}, {"t": 316.6333333333333, "x": "記録の書き方からは、そう読める。"}, {"t": 318.8833333333333, "x": "火を付けたのは午前2時ごろとされる。"}, {"t": 321.05, "x": "望楼が火を見つけるまで、およそ1時間あった。"}, {"t": 323.96666666666664, "x": "その間に本人は寺の裏の山へ向かっていた。"}, {"t": 327.48333333333335, "x": "裏の山って？"}, {"t": 328.6, "x": "左大文字山だ。"}, {"t": 330.05, "x": "お盆の送り火で、「大」の字がともる山の一つだ。"}, {"t": 333.18333333333334, "x": "金閣のすぐ北にある。"}, {"t": 334.9, "x": "そこに逃げたの？"}, {"t": 336.15, "x": "7月2日のうちに、その山の中腹で見つかった。"}, {"t": 339.56666666666666, "x": "見つかった時刻は、資料によって違う。"}, {"t": 342.06666666666666, "x": "本人は眠り薬をたくさん飲んでいた。"}, {"t": 344.45, "x": "刃物で自分の胸も傷つけていた。"}, {"t": 346.8333333333333, "x": "自分も死ぬつもりだったのね。"}, {"t": 348.8, "x": "そう伝えられている。"}, {"t": 350.05, "x": "命は助かりそのまま警察に連れて行かれた。"}, {"t": 352.9166666666667, "x": "最初に口にした言葉は\n「火をつけた」だったと記録にある。"}, {"t": 356.85, "x": "それだけ？"}, {"t": 357.75, "x": "それだけだ。"}, {"t": 358.6333333333333, "x": "名前は 林養賢。"}, {"t": 360.18333333333334, "x": "美術の年鑑にも「同寺徒弟林養賢の放火に\nよるものであった」と書かれている。"}, {"t": 365.3833333333333, "x": "徒弟ってお弟子さんのこと？"}, {"t": 367.1333333333333, "x": "そうだ。"}, {"t": 367.75, "x": "寺に住み込んで、修行をしながら\n学校にも通う立場だ。"}, {"t": 371.26666666666665, "x": "翌日の新聞の見出しには、大谷大学の学生だと出た。"}, {"t": 375.7, "x": "警察では何て言ったの？"}, {"t": 377.43333333333334, "x": "7月3日の朝日新聞に、取り調べで\n話したとされる言葉が載っている。"}, {"t": 381.98333333333335, "x": "「金閣と心中する覚悟で、午前二時ごろ布団と衣類と\nカヤを金閣に持ち込み、マッチで火をつけた」。"}, {"t": 388.1333333333333, "x": "カヤって蚊帳？"}, {"t": 389.2, "x": "そうだ。夏に寝床を囲う網だ。"}, {"t": 391.3666666666667, "x": "続けてこう言ったとされる。"}, {"t": 392.95, "x": "「こわくなってすぐ裏山に逃げた」。"}, {"t": 395.05, "x": "一緒に死ぬつもりだったのに、逃げたのね。"}, {"t": 397.71666666666664, "x": "記者に向けては、別の言い方もしている。"}, {"t": 400.23333333333335, "x": "ズボンが焼けはじめると熱くなって、\n恐ろしくなって山へ逃げたと。"}, {"t": 404.26666666666665, "x": "理由のほうは？"}, {"t": 405.3333333333333, "x": "そこがこの回の一番大事なところだ。"}, {"t": 407.73333333333335, "x": "本人は「動機は、\n落ちついてからにしてくれ」と言った。"}, {"t": 411.21666666666664, "x": "読売新聞には「頭を整理してから話をする」という\n言葉が載った。"}, {"t": 415.75, "x": "まだ自分でもまとまっていなかったのかしら。"}, {"t": 418.3833333333333, "x": "それは分からない。"}, {"t": 419.46666666666664, "x": "住職に恨みは無い、とも話したと伝えられている。"}, {"t": 422.7, "x": "じゃあなぜ。"}, {"t": 423.53333333333336, "x": "その「なぜ」を、たくさんの人が\nこのあと考えることになる。"}, {"t": 427.3333333333333, "x": "新聞も国会も作家たちもだ。"}, {"t": 429.4, "x": "ただ本人の口から一つの答えが\n出ることは、最後までなかった。"}, {"t": 434.0833333333333, "x": "その人はどこで生まれたの？"}, {"t": 435.8833333333333, "x": "1929年3月19日、\n京都府の北今の舞鶴市にある成生という村だ。"}, {"t": 441.3, "x": "日本海に面した小さな集落だ。"}, {"t": 443.5833333333333, "x": "家は寺で父親はその寺の住職だった。"}, {"t": 446.35, "x": "お寺の子だったのね。"}, {"t": 447.8, "x": "父親は1942年、結核で亡くなった。"}, {"t": 451.1166666666667, "x": "本人が13歳のときだ。"}, {"t": 453.0833333333333, "x": "それで京都のお寺に？"}, {"t": 454.5833333333333, "x": "父親の縁で鹿苑寺に入ることになった。"}, {"t": 457.2, "x": "1943年3月に鹿苑寺で得度した。"}, {"t": 460.6666666666667, "x": "得度？"}, {"t": 461.4, "x": "髪をそって正式に僧になる儀式のことだ。"}, {"t": 464.1666666666667, "x": "1944年の春からは、鹿苑寺に住み込む徒弟になった。"}, {"t": 468.4, "x": "戦争の終わりがけの年だ。"}, {"t": 470.26666666666665, "x": "まだ15歳くらいね。"}, {"t": 471.75, "x": "中学を出たあと、寺から\n大谷大学の予科に通い、本科に進んだ。"}, {"t": 476.1166666666667, "x": "つかまったときは、大学で中国語を学ぶ学生だった。"}, {"t": 479.75, "x": "勉強はうまくいってたの？"}, {"t": 481.43333333333334, "x": "のちの記録では、成績は下がり続け、\n休みがちになっていたとされる。"}, {"t": 485.8, "x": "ただここで言えるのは記録にある事実だけだ。"}, {"t": 488.4, "x": "それが火を付けた理由だったとは、\nこの回では言わない。"}, {"t": 491.6166666666667, "x": "生い立ちを理由に結びつけないのね。"}, {"t": 493.85, "x": "そうだ。そこはつなげないで聞いてほしい。"}, {"t": 496.8333333333333, "x": "お寺の住職さんは、どうしてたの？"}, {"t": 499.2, "x": "住職は 村上慈海。"}, {"t": 500.96666666666664, "x": "自分の弟子が自分の寺の国宝に\n火を付けたことになる。"}, {"t": 504.3333333333333, "x": "朝日新聞にはこう話したと載っている。"}, {"t": 506.73333333333335, "x": "「私の指導のいたらなかったためで申訳ない」。"}, {"t": 509.68333333333334, "x": "自分のせいだってことね。"}, {"t": 511.3833333333333, "x": "本人については、こうも話している。"}, {"t": 513.6666666666666, "x": "同僚ともなじまず、日ごろから寺や\n世間に不満を持っていたのは事実だと。"}, {"t": 518.2666666666667, "x": "前から何か感じていたのかしら。"}, {"t": 520.4833333333333, "x": "そうとも読めるし、事件のあとで\n振り返った言葉とも読める。"}, {"t": 524.0, "x": "その年の8月には、雑誌の座談会でもおわびを述べた。"}, {"t": 527.5666666666667, "x": "「もっと私に道力と徳があれば、間違いなく\n弟子を導くことも出来たのでありましょう」。"}, {"t": 532.6666666666666, "x": "道力って？"}, {"t": 533.6833333333333, "x": "仏の道を歩む力、修行で身につく力のことだ。"}, {"t": 537.1333333333333, "x": "前の晩も本人は住職の肩をもんだり、\nお灸をすえたりしていたと伝えられる。"}, {"t": 541.9666666666667, "x": "いつも通りの夜だったのね。"}, {"t": 543.8166666666667, "x": "仲間の僧と夜中まで碁を\n打っていた、という記録もある。"}, {"t": 547.1, "x": "その仲間は火を付けるような様子は\n何も無かったと話している。"}, {"t": 550.8833333333333, "x": "周りの人には何も見えていなかった。"}, {"t": 553.3, "x": "住職はこのあと、焼け跡の前でもう\n一つの役目を背負うことになる。"}, {"t": 557.4, "x": "金閣を建て直すための、お金集めだ。"}, {"t": 560.05, "x": "その話はもう少しあとでしよう。"}, {"t": 562.7166666666667, "x": "家族はどうしたの？"}, {"t": 564.0666666666667, "x": "舞鶴にいた母親が、火事を知って京都へ出てきた。"}, {"t": 567.2, "x": "京都の駅に着いてから、火を付けたのが\n自分の息子だと知ったという。"}, {"t": 571.3833333333333, "x": "着いてから知ったのね。"}, {"t": 572.8833333333333, "x": "母親は警察署で面会を求めた。"}, {"t": 575.2333333333333, "x": "だが本人は会おうとしなかったと伝えられている。"}, {"t": 578.1, "x": "会わなかったの？"}, {"t": 579.2333333333333, "x": "そうだ。"}, {"t": 579.8666666666667, "x": "母親はその夜警察に保護されて過ごした。"}, {"t": 582.6333333333333, "x": "そして7月3日の夕方、舞鶴へ帰る\n道の途中で、自ら命を絶ったと報じられた。"}, {"t": 588.45, "x": "……事件の次の日に。"}, {"t": 589.8666666666667, "x": "この回では場所や様子には触れない。"}, {"t": 591.9333333333333, "x": "名前も出さない。"}, {"t": 593.0166666666667, "x": "記録に残っているのは、\n7月4日の新聞が伝えた事実だけだ。"}, {"t": 597.4, "x": "本人はそのことをどう受け止めたの？"}, {"t": 599.65, "x": "それは記録からは分からない。"}, {"t": 601.5, "x": "分からないところは、分からないままなのね。"}, {"t": 604.1666666666666, "x": "のちに本人が亡くなったとき、\n墓は母親の墓のそばに作られた。"}, {"t": 608.3666666666667, "x": "場所は舞鶴の村だ。"}, {"t": 609.9333333333333, "x": "最後は母親の隣に戻ったのね。"}, {"t": 612.3333333333334, "x": "ここから先は国の側の動きを見ていこう。"}, {"t": 615.4833333333333, "x": "金閣が焼けたのは、国会が開かれている最中だった。"}, {"t": 619.1166666666667, "x": "じゃあすぐに話題になった？"}, {"t": 620.7833333333333, "x": "2週間ほどあとの7月17日、\n衆議院の本会議で、ある議員がこう言った。"}, {"t": 625.7833333333333, "x": "三鷹事件の被告と並べて、「\n金閣寺放火の青年僧侶のごとき」と。"}, {"t": 630.45, "x": "三鷹事件って前の年の、電車が暴走した事件ね。"}, {"t": 634.0333333333333, "x": "そうだ。"}, {"t": 634.65, "x": "その議員は今の若者の心は、\nとうてい分からないと嘆いた。"}, {"t": 638.3833333333333, "x": "戦争中の学生と、今の学生はどう違うのか、と\n問いかける演説の中での一言だった。"}, {"t": 644.2, "x": "戦争の後と前の世代の違いだろうと簡単に\n片づけるわけにはいかない、とも言っている。"}, {"t": 649.4666666666667, "x": "若い人のことが、分からなくなっていたのね。"}, {"t": 652.4, "x": "当時は「アプレゲール」という言葉がはやっていた。"}, {"t": 655.35, "x": "フランス語で「戦争の後」という意味だ。"}, {"t": 657.95, "x": "戦後の若者が起こした事件を、\nまとめてそう呼ぶことがあった。"}, {"t": 661.8, "x": "金閣の事件もそう呼ばれたの？"}, {"t": 663.8833333333333, "x": "記録ではそう分けられたこともあった。"}, {"t": 666.05, "x": "7月26日の参議院では、別の議員がこう言っている。"}, {"t": 669.7833333333333, "x": "古いものは封建的だから亡ぼしてもいい、という\n誤った考えが若い人の一部にある。"}, {"t": 674.9333333333333, "x": "「で、金閣寺が焼けた」。"}, {"t": 676.6666666666666, "x": "考え方のせいにしたのね。"}, {"t": 678.5666666666667, "x": "でも本人はそういう考えを話したわけではない。"}, {"t": 681.3666666666667, "x": "国会の言葉はその時代の大人たちが\n事件をどう受け止めたかの記録だ。"}, {"t": 685.6166666666667, "x": "本人の動機を説明したものではない、と\n分けて聞いてほしい。"}, {"t": 689.7833333333333, "x": "京都の町にはどんな影響があったの？"}, {"t": 692.1333333333333, "x": "7月22日衆議院の建設委員会で、\n京都選出の議員がこう話している。"}, {"t": 697.2, "x": "「金閣寺が焼失になりましたが、\nこの金閣寺はすみやかに復興したい」。"}, {"t": 701.7666666666667, "x": "やっぱり早く建て直したいのね。"}, {"t": 703.9, "x": "理由が具体的だった。"}, {"t": 705.4166666666666, "x": "建て直さないと、京都市のバスと電車の収入が、\n3分の1減るのではないかと言われていると。"}, {"t": 711.15, "x": "3分の1も？"}, {"t": 712.3833333333333, "x": "そう言われるほどの影響だ、という言い方だ。"}, {"t": 714.9166666666666, "x": "金閣を見に来る人が、それだけ\n市のバスや電車に乗っていた。"}, {"t": 718.7666666666667, "x": "お寺が一つ焼けて、町のお財布まで響くのね。"}, {"t": 722.0166666666667, "x": "戦後5年目で京都は観光で立ち直ろうとしていた。"}, {"t": 725.0833333333334, "x": "この議員は恒久的な施設は後回しにして、すぐ\n収入になる観光に力を注ぐ、とも言っている。"}, {"t": 731.3333333333334, "x": "その一番の目玉が、金閣だったのね。"}, {"t": 734.1166666666667, "x": "そうだ。"}, {"t": 734.7333333333333, "x": "同じ7月26日には、別の議員がこう聞いた。"}, {"t": 738.1, "x": "金閣寺を作れと言っても作れないだろうが、"}, {"t": 740.5666666666667, "x": "元に戻させるくらいの強い\n決まりがあってもいいのではないかと。"}, {"t": 744.2833333333333, "x": "元に戻させる？"}, {"t": 745.55, "x": "壊した人に元の姿へ戻させるという意味だ。"}, {"t": 748.5, "x": "答えた議員は金閣寺は寺の持ち物だと説明した。"}, {"t": 751.8333333333334, "x": "建て直すにはまず寺そのものが重大な\n決意をしなければならないと。"}, {"t": 755.8833333333333, "x": "国が勝手に建てるわけには、いかないのね。"}, {"t": 758.65, "x": "その上で前よりも力を入れた立派な\n姿に建て直したい、と言っている。"}, {"t": 763.5166666666667, "x": "その委員会では、何の話をしていたの？"}, {"t": 766.25, "x": "京都と奈良を外国からも人を呼べる\n観光の町にするための法案だ。"}, {"t": 770.3833333333333, "x": "京都の分は京都国際文化観光都市建設法という。"}, {"t": 773.9833333333333, "x": "名前が長いわね。"}, {"t": 775.3166666666667, "x": "金閣が焼けたちょうどその月に、\n国会で話し合われていた。"}, {"t": 778.9666666666667, "x": "7月25日の本会議では、\n反対する議員がこう言っている。"}, {"t": 782.9166666666666, "x": "「法隆寺の壁画も焼いたではないか。"}, {"t": 784.9, "x": "金閣寺も焼いてしまったではないか」。"}, {"t": 787.25, "x": "守れていないのに、観光の町なんて、ってことね。"}, {"t": 790.45, "x": "古い文化を本当に守れるのは\n誰なのか、と問う反対だった。"}, {"t": 794.25, "x": "それでも法案は通った。"}, {"t": 795.7833333333333, "x": "京都の法律は1950年10月22日に公布された。"}, {"t": 799.9333333333333, "x": "金閣が焼けてから、3か月半後ね。"}, {"t": 802.65, "x": "この法律にはほかとは違う点がある。"}, {"t": 804.9166666666666, "x": "京都市だけに当てはまる法律なので、\n憲法の決まりで、住民の投票が必要だった。"}, {"t": 810.3, "x": "住民が決める法律なのね。"}, {"t": 812.25, "x": "公布の文にも憲法第95条による\n法律だとはっきり書かれている。"}, {"t": 816.4333333333333, "x": "第1条の目的は、京都市を\n国際文化観光都市として建設すること。"}, {"t": 821.2, "x": "京都の町と寺を、外国からも\n人を呼べる宝として見せていく。"}, {"t": 825.2666666666667, "x": "その考えの真ん中にあった建物の一つが、\n焼けたばかりだったわけだ。"}, {"t": 829.8166666666667, "x": "焼けた金閣と観光の町の法律が、\n同じ夏に並んでいたのね。"}, {"t": 834.15, "x": "そうだ。"}, {"t": 834.7666666666667, "x": "ただしこの法律が金閣を建て直す\nお金を出したわけではない。"}, {"t": 838.45, "x": "その話は国宝かどうかという問題につながっていく。"}, {"t": 842.3166666666667, "x": "文化財を守る仕組みは、どうなってたの？"}, {"t": 844.95, "x": "ちょうど切り替わりの時期だった。"}, {"t": 846.7333333333333, "x": "前の国会で文化財保護法という\n新しい法律ができていた。"}, {"t": 850.4, "x": "実際に動き出すのは、8月29日からだった。"}, {"t": 853.9166666666666, "x": "金閣が焼けたのは7月2日。"}, {"t": 856.2666666666667, "x": "そうだ。"}, {"t": 856.8833333333333, "x": "7月24日の衆議院の文部委員会で、ある議員が\nこう言っている。"}, {"t": 861.0333333333333, "x": "「残念なことに保護委員が任命される\n前に、金閣寺がああいう火災にあう」。"}, {"t": 865.45, "x": "守る係が決まる前だったのね。"}, {"t": 867.65, "x": "その法律で新しく作られる、\n文化財保護委員会のことだ。"}, {"t": 871.4666666666667, "x": "委員会ができたあと、10月6日の参議院で、\n事務局長はこう答えた。"}, {"t": 875.9666666666667, "x": "「今度金閣寺がそのお寺の中の坊さんに\nよって焼かれた」。"}, {"t": 879.35, "x": "文化財を大切にする気持ちさえあれば、\nそういうことはありえない、と"}, {"t": 883.1, "x": "続けている。"}, {"t": 884.1333333333333, "x": "外からの火じゃなくて、\n中の人だったから、余計に重かったのね。"}, {"t": 888.45, "x": "委員会は国民の意識を\n高めることに重点を置くと言った。"}, {"t": 891.9333333333333, "x": "同じ日の委員会では、別の議員が\n外国の目にも触れている。"}, {"t": 895.5833333333334, "x": "日本の古い文化財は、\n日本だけでなく世界のものでもある。"}, {"t": 899.2333333333333, "x": "法隆寺の壁画や金閣寺のようなものは、\n戦後の破壊の一つとして投げてしまわず、"}, {"t": 904.1666666666666, "x": "世界の声にも耳を貸してほしいと。"}, {"t": 906.5666666666667, "x": "世界からも見られていたのね。"}, {"t": 908.45, "x": "フランスやイタリアの美術界も\n心配している、と話している。"}, {"t": 912.0833333333334, "x": "のちの委員長も、金閣の火事は委員会ができる\n前のことだった、と振り返っている。"}, {"t": 917.0, "x": "だからまず火事を防ぐことを第一にしたと。"}, {"t": 919.7166666666667, "x": "金閣の火事が守り方を変えたのね。"}, {"t": 922.1833333333333, "x": "1953年の予算の説明では、こう言われている。"}, {"t": 925.7833333333333, "x": "金閣や法隆寺の火災もあって修理から、\n火災を防ぐことへ重点を移す。"}, {"t": 930.3666666666667, "x": "そのための経費を、\n約2千万円増やすという説明だった。"}, {"t": 934.6833333333333, "x": "金閣の火事はそのあとも国会で話に出たの？"}, {"t": 937.8, "x": "何年にもわたって、何度も出てくる。"}, {"t": 940.1666666666666, "x": "焼けて1か月もたたない7月31日、\n参議院の本会議でこんな質問があった。"}, {"t": 945.5833333333334, "x": "軍閥や官僚の時代でさえ無事だった法隆寺や\n金閣寺が、この内閣ができてから次々に焼けていく。"}, {"t": 951.8666666666667, "x": "「一体どうした皮肉であるか」と。"}, {"t": 954.05, "x": "政府を責める材料にもなったのね。"}, {"t": 956.2833333333333, "x": "そうだ。"}, {"t": 956.9, "x": "ただ法隆寺の金堂の火事は、\n出火の原因が今も一つに決まっていない。"}, {"t": 961.3166666666667, "x": "金閣は寺の中の人が火を付けた事件だ。"}, {"t": 964.1666666666666, "x": "二つは同じ「焼けた国宝」として\n並べられたが、中身はまるで違う。"}, {"t": 968.7833333333333, "x": "まとめて言われると、違いが見えなくなるのね。"}, {"t": 971.5666666666667, "x": "4年後1954年の予算の分科会では、\n滋賀県の彦根城の傷みを訴えた議員がこう言っている。"}, {"t": 977.9166666666666, "x": "「京都の金閣寺のごとく、一ぺん焼かれてしまうと、\n何を言ったってだめなんですから」。"}, {"t": 983.0, "x": "焼けてからでは遅い、ってことね。"}, {"t": 985.0833333333334, "x": "金閣はほかの文化財を守るための、\nたとえ話になっていった。"}, {"t": 989.0166666666667, "x": "1957年の参議院の予算委員会では、\n別の議員がこう並べた。"}, {"t": 993.7166666666667, "x": "「最近は法隆寺、金閣寺、\n延暦寺が焼けております」。"}, {"t": 997.3833333333333, "x": "延暦寺も？"}, {"t": 998.4166666666666, "x": "1956年の秋に、\n比叡山の延暦寺の大講堂が焼けている。"}, {"t": 1002.9166666666666, "x": "そのときも金閣の名前がまた引き合いに出された。"}, {"t": 1005.95, "x": "お金では償えない宝だ、という言葉と一緒にだ。"}, {"t": 1009.3, "x": "金閣は焼けたあとも、ずっと呼び出されていたのね。"}, {"t": 1012.9833333333333, "x": "裁判はいつ始まったの？"}, {"t": 1014.7166666666667, "x": "火事から11日後の7月13日に、起訴された。"}, {"t": 1018.2333333333333, "x": "罪は放火と当時の国宝を守る法律に\n反したことだと、新聞は伝えている。"}, {"t": 1023.2166666666667, "x": "二つの罪なのね。"}, {"t": 1024.6666666666667, "x": "建物を焼いたことと、国宝を壊したことだ。"}, {"t": 1027.5666666666666, "x": "第一回の公判は、\n7月24日京都地方裁判所で開かれた。"}, {"t": 1032.0, "x": "美術の年鑑にも、その日付が残っている。"}, {"t": 1035.0166666666667, "x": "本人は何て言ったの？"}, {"t": 1036.6, "x": "起訴された事実は、認めたと伝えられている。"}, {"t": 1039.5833333333333, "x": "火を付けたことは、認めたのね。"}, {"t": 1041.8333333333333, "x": "そうだ。そこは最初から争っていない。"}, {"t": 1044.2833333333333, "x": "争点になったのは、なぜ火を付けたのかと、\n本人に責任を問えるかどうかだった。"}, {"t": 1049.3333333333333, "x": "責任を問えるかどうか？"}, {"t": 1050.9666666666667, "x": "自分のしたことが分かって、やめることもできる\n状態だったか、ということだ。"}, {"t": 1055.5, "x": "それを調べるため、京都大学の医師が\n何回かに分けて本人に会った。"}, {"t": 1059.8, "x": "8月から10月にかけて、5回だったと記録にある。"}, {"t": 1063.3, "x": "結果は？"}, {"t": 1064.15, "x": "裁判所はその結果をもとに、責任を問えると判断した。"}, {"t": 1067.7833333333333, "x": "この回では医師がつけた見立ての名前は言わない。"}, {"t": 1070.4833333333333, "x": "名前で人を説明した気になってしまうからだ。"}, {"t": 1073.4166666666667, "x": "分かった。"}, {"t": 1074.3, "x": "法廷で本人が口にした、ある言葉のほうを見ておこう。"}, {"t": 1078.2333333333333, "x": "法廷では理由を話したの？"}, {"t": 1080.05, "x": "検察がこういう動機だと述べた場面がある。"}, {"t": 1082.6, "x": "それに対して本人はこう答えたと記録されている。"}, {"t": 1085.65, "x": "「本当といえば本当、本当でないと\nいえば本当でない」。"}, {"t": 1089.0, "x": "えどっちなの？"}, {"t": 1090.0166666666667, "x": "どっちとも取れる。"}, {"t": 1091.2666666666667, "x": "はぐらかしたのかしら。"}, {"t": 1092.8166666666666, "x": "そう聞こえるかもしれない。"}, {"t": 1094.2666666666667, "x": "でも自分でも一つにまとめられなかった、とも読める。"}, {"t": 1097.45, "x": "逮捕の日の「落ちついてから」と、\nつながっている気もする。"}, {"t": 1101.0833333333333, "x": "結局落ちついても答えは一つにならなかったのね。"}, {"t": 1104.3166666666666, "x": "検察の締めくくりの言葉は、厳しかった。"}, {"t": 1107.1166666666666, "x": "金閣を焼く理由は何も無く、\nまったくの独りよがりの犯罪だと。"}, {"t": 1111.1333333333334, "x": "自分の満足のために、社会を\n犠牲にしたとも言っている。"}, {"t": 1114.7166666666667, "x": "検察は理由が無いと言い切ったのね。"}, {"t": 1117.0333333333333, "x": "本人の側は理由をはっきり言わない。"}, {"t": 1119.15, "x": "検察は理由など無いと言う。"}, {"t": 1120.8666666666666, "x": "この二つのあいだに、たくさんの人が\n自分の答えを入れていった。"}, {"t": 1124.75, "x": "作家たちも？"}, {"t": 1125.8833333333334, "x": "そうだ。"}, {"t": 1126.5, "x": "その話は終わりのほうで、少しだけ触れる。"}, {"t": 1129.2333333333333, "x": "まずは判決の日だ。"}, {"t": 1131.2666666666667, "x": "12月20日検察は懲役10年を求めた。"}, {"t": 1134.4333333333334, "x": "10年。"}, {"t": 1135.1833333333334, "x": "判決はその8日後の12月28日だった。"}, {"t": 1138.3333333333333, "x": "美術の年鑑には、こう残っている。"}, {"t": 1140.65, "x": "「28日の京都地裁における最終公判で\n懲役7年の判決を言い渡された」。"}, {"t": 1145.9166666666667, "x": "7年なのね。"}, {"t": 1147.0833333333333, "x": "つかまってから判決までの日数のうち、\n150日は刑から差し引かれた。"}, {"t": 1151.7166666666667, "x": "判決の前に閉じ込められていた日の一部を、\n刑をつとめた日として数える仕組みだ。"}, {"t": 1156.75, "x": "控訴はしたの？"}, {"t": 1157.9, "x": "しなかった。"}, {"t": 1158.7833333333333, "x": "本人も検察も上の裁判所へは進まず、7年で確定した。"}, {"t": 1163.0333333333333, "x": "火事から半年足らずで決まったのね。"}, {"t": 1165.4, "x": "12月28日という日には、もう一つ重なりがある。"}, {"t": 1169.0166666666667, "x": "金閣が今の国宝のもとになる「特別保護建造物」に\n指定されたのは、1897年の12月28日だった。"}, {"t": 1177.3, "x": "同じ日付なの？"}, {"t": 1178.5833333333333, "x": "53年後の同じ日に、それを焼いた\n人の判決が出たことになる。"}, {"t": 1182.7666666666667, "x": "もちろん狙ってそうなったわけではない。"}, {"t": 1185.0333333333333, "x": "偶然ね。"}, {"t": 1185.95, "x": "その後1952年の恩赦で、刑は5年3か月に縮められた。"}, {"t": 1190.5, "x": "恩赦って？"}, {"t": 1191.4, "x": "国の節目に刑を軽くしたり許したりすることだ。"}, {"t": 1194.45, "x": "この年は日本が独立を取り戻した年だった。"}, {"t": 1197.4333333333334, "x": "本人は刑務所で過ごす年月に入っていく。"}, {"t": 1200.8166666666666, "x": "焼けた金閣は国宝のままなの？"}, {"t": 1203.0833333333333, "x": "そこが建て直しの大きな問題になった。"}, {"t": 1205.5666666666666, "x": "11月13日の衆議院の文部委員会で、ある議員が\nこう尋ねた。"}, {"t": 1209.8666666666666, "x": "国宝になるなら寄付がたくさん\n集まるらしいが、ならないなら"}, {"t": 1213.5, "x": "あまり集まらないらしいと新聞に出ていると。"}, {"t": 1215.7666666666667, "x": "国宝になるかどうかで、寄付が変わるの？"}, {"t": 1218.35, "x": "そう言われていた。"}, {"t": 1219.4, "x": "議員はこうも言っている。"}, {"t": 1220.7666666666667, "x": "なるつもりで集めて、だめになったら、\n詐欺の罪に問われかねない。"}, {"t": 1224.7833333333333, "x": "それは困るわね。"}, {"t": 1226.0333333333333, "x": "文化財保護委員会の事務局長の答えは、\nはっきりしていた。"}, {"t": 1229.7666666666667, "x": "建物は完全に焼けていて、同じ形のものができても、\n国宝としての指定は不可能ではないか。"}, {"t": 1235.8666666666666, "x": "同じ形に建ててもだめなの？"}, {"t": 1237.9333333333334, "x": "国宝はその時代に作られた\n本物であることに重みがある。"}, {"t": 1241.4666666666667, "x": "新しく建てたものは、形が同じでも\n同じものではない、という考え方だ。"}, {"t": 1246.2666666666667, "x": "なるほどね。"}, {"t": 1247.2166666666667, "x": "ただ事務局長は庭のほうは守ると言った。"}, {"t": 1249.7833333333333, "x": "池の中の島も含めた庭は名勝に\n指定されていて、木の被害は元に戻せると。"}, {"t": 1254.8166666666666, "x": "だからできれば前のような景色で\n金閣が建て直されるのが望ましい。"}, {"t": 1258.7666666666667, "x": "でも国宝と同じ立場で国が助けるのは\n無理だろう、という答えだった。"}, {"t": 1263.1333333333334, "x": "国宝のお金は出ないのね。"}, {"t": 1264.95, "x": "代わりに観光の方面で大いに力を\n入れてほしい、と付け加えている。"}, {"t": 1269.0666666666666, "x": "また観光なのね。"}, {"t": 1270.4166666666667, "x": "建て直しのお金は寺と寄付と、観光にかかっていた。"}, {"t": 1274.3833333333334, "x": "お寺の責任はどう見られていたの？"}, {"t": 1276.5666666666666, "x": "1952年12月、参議院の文部委員会に、\n京都の古い寺を代表する団体の会長が呼ばれた。"}, {"t": 1283.3833333333334, "x": "京都古文化保存協会という団体だ。"}, {"t": 1285.8166666666666, "x": "会長は法隆寺と金閣寺をはっきり分けて話した。"}, {"t": 1289.0, "x": "法隆寺は修理を国にまかせている最中に焼けた。"}, {"t": 1292.0, "x": "だから寺だけを責めるのは気の毒だ、という立場だ。"}, {"t": 1295.2666666666667, "x": "金閣のほうは？"}, {"t": 1296.5, "x": "「あれなどは法隆寺の場合などとは非常に違う」。"}, {"t": 1299.1666666666667, "x": "「社寺みずからが、社寺の責任者の責任を\nとらなければならない問題だと私は考える」。"}, {"t": 1304.6333333333334, "x": "寺の仲間からも、厳しく見られていたのね。"}, {"t": 1307.5333333333333, "x": "同じ京都の寺の側から出た言葉だ。"}, {"t": 1309.95, "x": "住職の監督が行き届かなかった、という見方だった。"}, {"t": 1313.55, "x": "住職さんがおわびを繰り返したのも、そういうことね。"}, {"t": 1316.8333333333333, "x": "住職本人も自分の指導が至らなかったと言っていた。"}, {"t": 1320.15, "x": "国からも寺の仲間からも、そして住職自身からも、\n責任は寺にあると言われた。"}, {"t": 1325.5, "x": "だから建て直すのも寺が中心になったのね。"}, {"t": 1328.4166666666667, "x": "1950年の国会でも、金閣寺は寺の持ち物で、\n寺の決意がなければ建て直せないと言われていた。"}, {"t": 1335.0666666666666, "x": "国宝に戻らない以上、国が全部を出すこともない。"}, {"t": 1338.2, "x": "寺がまず動くしかなかった。"}, {"t": 1340.6166666666666, "x": "じゃあお金はどうやって集めたの？"}, {"t": 1342.6166666666666, "x": "住職の村上慈海は、托鉢に出たと伝えられている。"}, {"t": 1346.25, "x": "托鉢ってお坊さんがお椀を持って回るあれ？"}, {"t": 1348.95, "x": "そうだ。"}, {"t": 1349.5833333333333, "x": "家々を回ってお布施を受ける修行だ。"}, {"t": 1351.7333333333333, "x": "その托鉢で再建のためのお金を集めて回った。"}, {"t": 1355.0, "x": "弟子のしたことを、自分の足で埋め合わせたのね。"}, {"t": 1358.0, "x": "そういう形になった。"}, {"t": 1359.4666666666667, "x": "全国からも寄付が寄せられた。"}, {"t": 1361.4166666666667, "x": "1950年の国会では寄付が国宝になるか\nどうかで変わると言われていた。"}, {"t": 1366.0166666666667, "x": "国宝に戻らないという答えが出たあとも、\n起工できるだけのお金は集まっていった。"}, {"t": 1370.9, "x": "国宝かどうかより、金閣そのものを\n取り戻したい人が多かったのね。"}, {"t": 1375.2, "x": "そう受け取れる。"}, {"t": 1376.15, "x": "ただ集まった額や人数は、資料によって数え方が違う。"}, {"t": 1379.75, "x": "この回では確かめられた数字だけを言う。"}, {"t": 1382.25, "x": "確かめられた数字って？"}, {"t": 1383.95, "x": "1952年3月の時点で、美術の年鑑はこう書いている。"}, {"t": 1388.2, "x": "「再建資金の一部がまとまったので、\n22日午前10時から起工式を\n行い、再建にとりかかった」。"}, {"t": 1394.5833333333333, "x": "一部なのね。"}, {"t": 1395.65, "x": "全部そろってから、ではなかった。"}, {"t": 1397.7666666666667, "x": "集まった分でまず始めた。"}, {"t": 1399.65, "x": "火事から1年8か月ちょっとね。"}, {"t": 1401.9333333333334, "x": "1950年の国会で、寺が重大な\n決意をしなければ、と言われていた。"}, {"t": 1406.7333333333333, "x": "その決意がこの起工式だったと言っていい。"}, {"t": 1409.2666666666667, "x": "そしてこの時の計画には、一つ特徴があった。"}, {"t": 1413.1333333333334, "x": "特徴って？"}, {"t": 1414.1833333333334, "x": "年鑑の続きはこうだ。"}, {"t": 1415.7333333333333, "x": "「予算1500万円で3か年計画とし、原型どおり、\nとりあえず白木造りのものを造る」。"}, {"t": 1421.3833333333334, "x": "白木って色を塗らない木のままってこと？"}, {"t": 1423.85, "x": "そうだ。"}, {"t": 1424.4666666666667, "x": "金箔を張る前の、木の地のままの金閣だ。"}, {"t": 1427.4333333333334, "x": "金色じゃない金閣を、まず建てるつもりだったの？"}, {"t": 1430.5, "x": "「とりあえず」と書いてある。"}, {"t": 1432.0166666666667, "x": "お金がそろっていなかったから、まず\n形を戻すことを先にしたと読める。"}, {"t": 1436.4833333333333, "x": "予算は1500万円。"}, {"t": 1438.1333333333334, "x": "そして3か年の計画だ。"}, {"t": 1439.95, "x": "寺の報告書では、工事に取りかかったのは\n1952年4月1日とされている。"}, {"t": 1445.4166666666667, "x": "起工式の10日後ね。"}, {"t": 1446.9833333333333, "x": "建物の形は創建されたころの姿に戻すことを目指した。"}, {"t": 1450.85, "x": "記録では江戸時代や明治に手が加えられた\n部分を、元に戻したところもあったという。"}, {"t": 1455.85, "x": "焼ける前より昔の形に近づけたのね。"}, {"t": 1458.7, "x": "1950年の国会でも、前よりも\n立派な姿に、と言われていた。"}, {"t": 1463.2666666666667, "x": "問題は金をどうするかだった。"}, {"t": 1465.1666666666667, "x": "白木のまま終わるのか、それとも金色に戻せるのか。"}, {"t": 1468.5666666666666, "x": "結局どうなったの？"}, {"t": 1470.0333333333333, "x": "それは5年目の秋に分かる。"}, {"t": 1471.7666666666667, "x": "その前に刑務所に入った本人のほうを見ておこう。"}, {"t": 1475.3166666666666, "x": "判決のあと本人はどこにいたの？"}, {"t": 1477.5666666666666, "x": "記録では1951年1月18日に、\n兵庫県の加古川刑務所に入った。"}, {"t": 1483.0, "x": "金閣の起工式が開かれたとき、\n本人はそこにいたことになる。"}, {"t": 1487.15, "x": "自分が焼いた建物が、建て直され始めたころね。"}, {"t": 1490.4833333333333, "x": "そうだ。"}, {"t": 1491.1, "x": "本人がそれを知っていたか\nどうかは、記録では分からない。"}, {"t": 1494.35, "x": "1953年3月12日、\n東京の八王子医療刑務所へ移された。"}, {"t": 1499.4333333333334, "x": "医療刑務所？"}, {"t": 1500.5, "x": "病気の手当てが必要な人が入る刑務所だ。"}, {"t": 1503.3166666666666, "x": "体を結核にむしばまれていた。"}, {"t": 1505.5166666666667, "x": "結核ってお父さんと同じ病気ね。"}, {"t": 1507.85, "x": "そうだ。"}, {"t": 1508.4666666666667, "x": "父親も結核で44歳で亡くなっている。"}, {"t": 1511.3166666666666, "x": "本人は心の具合も悪くしていたと記録にある。"}, {"t": 1514.4, "x": "刑務所の中で病気が重くなっていったのね。"}, {"t": 1517.2, "x": "1955年の10月、京都の刑務所へ移された。"}, {"t": 1520.8666666666666, "x": "そして10月30日に、刑期を終えて外へ出た。"}, {"t": 1524.15, "x": "10月30日。"}, {"t": 1525.5833333333333, "x": "出てすぐ京都府立の洛南病院に入院した。"}, {"t": 1528.6166666666666, "x": "外に出てもそのまま病院なのね。"}, {"t": 1530.85, "x": "刑務所に入ってから4年9か月がたっていた。"}, {"t": 1533.7333333333333, "x": "この日付を少し覚えておいてほしい。"}, {"t": 1535.8833333333334, "x": "金閣のほうも同じ10月に大きな日を迎えていた。"}, {"t": 1539.6166666666666, "x": "1955年9月30日、新しい金閣の工事が終わった。"}, {"t": 1544.0833333333333, "x": "そして10月10日、落慶供養が開かれた。"}, {"t": 1547.15, "x": "落慶供養って？"}, {"t": 1548.4333333333334, "x": "建物ができあがったことを、\n仏さまに報告して祝う儀式だ。"}, {"t": 1552.2833333333333, "x": "美術の年鑑にはこうある。"}, {"t": 1553.9833333333333, "x": "「再建成って五年ぶりに秀麗な姿をみせ、\n10日盛大に落慶供養を行った」。"}, {"t": 1559.0, "x": "5年ぶり。"}, {"t": 1559.9, "x": "焼けた日から数えて、5年と3か月あまりだ。"}, {"t": 1563.0166666666667, "x": "白木のままだったの？"}, {"t": 1564.5333333333333, "x": "いや。"}, {"t": 1565.0, "x": "続きにこう書いてある。"}, {"t": 1566.3833333333334, "x": "総ひのき造りで、1階は白木のまま、\n2階と3階は内も外も金箔押し。"}, {"t": 1571.4, "x": "屋上には金色の鳳凰がはばたく、\n創建当初の形に戻したと。"}, {"t": 1575.75, "x": "金色に戻ったのね。"}, {"t": 1577.2833333333333, "x": "「とりあえず白木で」と言っていた\n計画は、金色の金閣で終わった。"}, {"t": 1581.3166666666666, "x": "建て直された金閣は、2階と\n3階が内も外も金色になった。"}, {"t": 1585.4833333333333, "x": "美術の年鑑が「創建当初の形」と\n書いたのは、そういう意味だ。"}, {"t": 1589.9833333333333, "x": "焼ける前よりまぶしくなって戻ってきたのね。"}, {"t": 1592.6166666666666, "x": "鳳凰はあの焼けずに残った鳳凰？"}, {"t": 1594.6833333333334, "x": "京都市の文化財に指定されたのは、\n焼けずに残ったほうの鳳凰だ。"}, {"t": 1598.6833333333334, "x": "屋根の上の鳳凰とは別に、大切に守られている。"}, {"t": 1601.9333333333334, "x": "焼けなかった鳳凰は、屋根とは別の場所にいるのね。"}, {"t": 1605.1333333333334, "x": "そういうことだ。"}, {"t": 1606.15, "x": "そして落慶供養の20日後が、10月30日だ。"}, {"t": 1609.65, "x": "本人が刑務所を出た日ね。"}, {"t": 1611.4833333333333, "x": "金閣が戻ってきた同じ月に、焼いた人も外へ出てきた。"}, {"t": 1615.2833333333333, "x": "ただその人に残された時間は短かった。"}, {"t": 1618.6666666666667, "x": "病院に入ってから、どうなったの？"}, {"t": 1620.95, "x": "記録では1956年3月7日の午前に亡くなった。"}, {"t": 1624.8833333333334, "x": "結核だった。"}, {"t": 1625.9666666666667, "x": "26歳だった。"}, {"t": 1627.4, "x": "外に出てから半年もたってないじゃない。"}, {"t": 1629.9166666666667, "x": "4か月と少しだ。"}, {"t": 1631.4833333333333, "x": "新しい金閣は見たのかしら。"}, {"t": 1633.5666666666666, "x": "見たかどうかは、記録では確かめられない。"}, {"t": 1636.0666666666666, "x": "この回では見たとも見なかったとも言わない。"}, {"t": 1638.6166666666666, "x": "最後まで動機は話さなかったの？"}, {"t": 1640.8166666666666, "x": "本人の口から一つの答えが\nまとまって出ることはなかった。"}, {"t": 1644.4166666666667, "x": "逮捕の日は「落ちついてから」。"}, {"t": 1646.3166666666666, "x": "法廷では「本当といえば本当、\n本当でないといえば本当でない」。"}, {"t": 1650.4166666666667, "x": "落ちつく時は来なかったのね。"}, {"t": 1652.3666666666666, "x": "来なかったのか、来ても\n言わなかったのか、それも分からない。"}, {"t": 1655.9, "x": "墓は舞鶴の村の、母親の墓の隣にある。"}, {"t": 1659.1166666666666, "x": "事件から6年もたっていないのね。"}, {"t": 1661.3833333333334, "x": "金閣が焼けてから、本人が\n亡くなるまで、5年8か月だった。"}, {"t": 1665.5333333333333, "x": "その間に母親が亡くなり、金閣は建て直された。"}, {"t": 1668.9833333333333, "x": "本人だけがいなくなったのね。"}, {"t": 1670.9833333333333, "x": "本人が亡くなった1956年、三島由紀夫がこの事件を\n題材にした小説『金閣寺』を出している。"}, {"t": 1677.9166666666667, "x": "のちに水上勉も、『金閣炎上』という本を書いた。"}, {"t": 1681.4333333333334, "x": "ただそれは作家がそれぞれに考えた答えだ。"}, {"t": 1684.1333333333334, "x": "本人の答えではないことは、分けておきたい。"}, {"t": 1687.4666666666667, "x": "建て直したあとの金閣は、どうなったの？"}, {"t": 1690.15, "x": "意外な話が一つ、国会に残っている。"}, {"t": 1692.9166666666667, "x": "建て直しから9か月後、\n1956年7月27日の衆議院の地方行政委員会だ。"}, {"t": 1699.1666666666667, "x": "ある議員がこう言っている。"}, {"t": 1700.5666666666666, "x": "「金閣寺、苔寺その他はそれぞれ観光客が\n入場することを断っておる状態です」。"}, {"t": 1705.8333333333333, "x": "え見せるのを断ったの？"}, {"t": 1707.45, "x": "そうだ。"}, {"t": 1708.05, "x": "「現在ストライキを決行しておるというような\n状態」とまで言っている。"}, {"t": 1712.0333333333333, "x": "お寺がストライキ？"}, {"t": 1713.35, "x": "京都市がお寺の拝観料に税をかけようとしたからだ。"}, {"t": 1716.5333333333333, "x": "文化観光施設税という税だった。"}, {"t": 1718.8166666666666, "x": "同じ年の9月国の担当者は国会で\nその中身を説明している。"}, {"t": 1722.95, "x": "お金を取って見せている所だけに、\n1回10円中学生以下は5円をかける。"}, {"t": 1727.55, "x": "無料で見せている所には、かけない仕組みだった。"}, {"t": 1730.65, "x": "10円でもお寺は反対したのね。"}, {"t": 1732.8333333333333, "x": "お参りに来た人に直接税をかけるのは、\n宗教の上から受け入れられない、という反対だった。"}, {"t": 1738.5, "x": "観光の町のお金の話ね。"}, {"t": 1740.6, "x": "建て直しのとき、国は観光で\n力を入れてほしいと言った。"}, {"t": 1744.1166666666666, "x": "京都の議員は金閣が無いとバスと\n電車の収入が減ると言った。"}, {"t": 1748.0, "x": "そして今度はその観光に税をかける。"}, {"t": 1750.4333333333334, "x": "建て直した金閣が、また\n町の財布の真ん中に置かれたわけだ。"}, {"t": 1754.5, "x": "金閣はただのお寺じゃいられなかったのね。"}, {"t": 1757.0833333333333, "x": "同じ年の衆議院の文教委員会では、\n文部大臣が遠足の話もしている。"}, {"t": 1761.8666666666666, "x": "遠足で京都に来れば金閣寺銀閣寺清水と、\n十も十五も見て回る。"}, {"t": 1766.4166666666667, "x": "拝観料が高くなれば、\n子どもの負担が増える、と心配した。"}, {"t": 1770.4333333333334, "x": "焼けて建て直されて、すぐに\nみんなが見たい場所に戻ったのね。"}, {"t": 1774.2333333333333, "x": "それだけ多くの人にとって大事な建物だった。"}, {"t": 1777.8166666666666, "x": "作家の話は聞いたけど、絵にした人もいるの？"}, {"t": 1780.9333333333334, "x": "いる。"}, {"t": 1781.4, "x": "日本画家の 川端龍子 だ。"}, {"t": 1783.5666666666666, "x": "焼けたその年に、「金閣炎上」という\n大きな絵を描いた。"}, {"t": 1787.2166666666667, "x": "その年に？"}, {"t": 1788.2, "x": "文化遺産オンラインの説明では、\n事件の約2か月後に描かれた。"}, {"t": 1792.25, "x": "縦およそ1.4メートル、横およそ2.\n4メートルの掛け軸だ。"}, {"t": 1796.45, "x": "大きいわね。"}, {"t": 1797.4, "x": "その年の青龍展という展覧会に出された。"}, {"t": 1800.2, "x": "現場で写生することはできず、\n思い描いて描いたという。"}, {"t": 1803.6333333333334, "x": "見ていない火事を描いたのね。"}, {"t": 1805.45, "x": "あまりに早く描いたことに、批判も出たとされる。"}, {"t": 1808.55, "x": "まだ生々しいのに、ってことね。"}, {"t": 1810.7, "x": "墨と朱と金で炎に包まれる金閣を描いている。"}, {"t": 1813.8833333333334, "x": "そして川端龍子は、1956年にもう一枚描いた。"}, {"t": 1818.05, "x": "もう一枚？"}, {"t": 1818.95, "x": "「金閣再現」という絵だ。"}, {"t": 1820.65, "x": "建て直された金閣を描いたものだ。"}, {"t": 1823.0333333333333, "x": "焼けるところと、戻ったところを、両方描いたのね。"}, {"t": 1826.4, "x": "一人の画家が6年のあいだに\n同じ建物を2回描いたことになる。"}, {"t": 1830.3666666666666, "x": "燃える金閣と建て直された金閣だ。"}, {"t": 1832.75, "x": "この回で追ってきた5年を、\n絵の上でもたどった人がいた。"}, {"t": 1836.7666666666667, "x": "金閣の火事のあと、京都では何か変わったの？"}, {"t": 1839.85, "x": "今も続いているものがある。"}, {"t": 1841.4666666666667, "x": "京都市消防局が、毎年7月に行っている\n「夏の文化財防火運動」だ。"}, {"t": 1846.55, "x": "夏に？"}, {"t": 1847.3166666666666, "x": "消防局の資料には、こう書かれている。"}, {"t": 1849.75, "x": "「昭和25年7月2日に発生した鹿苑寺\n（金閣）の火災を契機として」。"}, {"t": 1854.9333333333334, "x": "全国いっせいの火災予防運動とは別に、\n毎年行っている京都市だけの取り組みだ。"}, {"t": 1859.9666666666667, "x": "金閣の火事がきっかけなのね。"}, {"t": 1862.0833333333333, "x": "2026年は7月12日から18日までの1週間だった。"}, {"t": 1866.6166666666666, "x": "何をするの？"}, {"t": 1867.6666666666667, "x": "消防が文化財のある寺や神社に\n立ち入って、火の扱いを調べる。"}, {"t": 1871.7333333333333, "x": "消火栓や放水銃の使い方を、寺の人に教える。"}, {"t": 1875.1, "x": "寺の人と消防が一緒に、火を消す\n訓練や、文化財を運び出す訓練もする。"}, {"t": 1880.2, "x": "放水銃って？"}, {"t": 1881.3666666666666, "x": "建物に向けて遠くから水を勢いよく出す装置だ。"}, {"t": 1884.5333333333333, "x": "金閣寺にものちにそうした設備が整えられた。"}, {"t": 1887.55, "x": "1987年の秋、金閣は漆と金箔を\n塗り直す大きな修理を受けた。"}, {"t": 1892.8166666666666, "x": "それをきっかけに、古くなった\n防災の設備も作り直すことになった。"}, {"t": 1897.1333333333334, "x": "火事から40年近くたってから？"}, {"t": 1899.45, "x": "そうだ。"}, {"t": 1900.0666666666666, "x": "寺の報告書には貯水槽、\n防災センター放水銃の予定地が並んでいる。"}, {"t": 1904.5, "x": "工事の前に地面を調べたところ、\n北山殿の時代の跡も出てきたという。"}, {"t": 1908.9666666666667, "x": "火を防ぐための工事が、\n600年前の屋敷の跡を掘り当てたわけだ。"}, {"t": 1913.35, "x": "守るための工事で、昔のことが分かったのね。"}, {"t": 1916.45, "x": "金閣の火事から始まった運動は、\n70年以上たった今も、毎年7月に続いている。"}, {"t": 1922.7666666666667, "x": "ここまでの話は、何をもとにしてるの？"}, {"t": 1925.45, "x": "国会会議録と美術の年鑑の記録が中心だ。"}, {"t": 1928.6666666666667, "x": "それに寺の報告書、京都市と消防局の資料だ。"}, {"t": 1931.9833333333333, "x": "時刻や供述の言葉は、当時の新聞や\n本を引いた資料から使った。"}, {"t": 1936.3, "x": "だから「記録では」「伝えられている」と言ってきた。"}, {"t": 1939.6, "x": "話さなかったことは？"}, {"t": 1941.1333333333334, "x": "まず動機だ。"}, {"t": 1942.05, "x": "「美しさへの何とか」という言い方を\n聞いたことがあるかもしれない。"}, {"t": 1945.7666666666667, "x": "でもそれは本人の言葉として確かめられなかった。"}, {"t": 1948.9833333333333, "x": "だから使わなかったのね。"}, {"t": 1950.75, "x": "医師の見立ての名前も言っていない。"}, {"t": 1952.7, "x": "母親の名前と亡くなった場所も言っていない。"}, {"t": 1955.3, "x": "本人がふだんどこへ出かけていたか、といった\n私生活も話していない。"}, {"t": 1959.5, "x": "数字で言わなかったものは？"}, {"t": 1961.2166666666667, "x": "建て直しにかかった全部の費用と、\n寄付をした人の数だ。"}, {"t": 1964.8333333333333, "x": "出どころごとに数字がばらつき、\n元の記録で一つに決められなかった。"}, {"t": 1969.05, "x": "国宝の指定が外された日付も、確かめられなかった。"}, {"t": 1972.6833333333334, "x": "京都の法律の住民投票の結果も？"}, {"t": 1975.2666666666667, "x": "そうだ。"}, {"t": 1975.9, "x": "日付と結果を一次資料で\n確かめられなかったので言っていない。"}, {"t": 1979.65, "x": "分からないことは、分からないと言うのね。"}, {"t": 1982.15, "x": "それがこの回の決まりだった。"}, {"t": 1984.6, "x": "ねえ最初の鳳凰の話に戻っていい？"}, {"t": 1986.9666666666667, "x": "いいぞ。"}, {"t": 1987.6333333333334, "x": "あの鳳凰は外されていたから残ったのよね。"}, {"t": 1990.3166666666666, "x": "そうだ。"}, {"t": 1990.9333333333334, "x": "報知器は直る予定の日の未明に、鳴らなかった。"}, {"t": 1993.8833333333334, "x": "鳳凰は外されてしまわれていて、焼けなかった。"}, {"t": 1996.85, "x": "残ったものと残らなかったものが紙一重ね。"}, {"t": 1999.7833333333333, "x": "550年あまり残った建物が、1時間足らずで焼けた。"}, {"t": 2003.6666666666667, "x": "そして5年かけて、もう一度建った。"}, {"t": 2006.1333333333334, "x": "でも国宝には戻らなかった。"}, {"t": 2008.15, "x": "同じ形でも同じものではないからだ。"}, {"t": 2010.5, "x": "ただ建て直された金閣も、もう\n70年以上そこに立っている。"}, {"t": 2014.4833333333333, "x": "今の金閣にももう長い歴史があるのね。"}, {"t": 2017.15, "x": "1994年には、世界文化遺産にも登録された。"}, {"t": 2021.0, "x": "2003年の春にも、金箔の張り替えが行われている。"}, {"t": 2024.6833333333334, "x": "本人の「なぜ」は、結局分からないままね。"}, {"t": 2027.9, "x": "分からないままだ。"}, {"t": 2029.05, "x": "本人は「落ちついてから」と言い、\nその答えを残さずに亡くなった。"}, {"t": 2033.1666666666667, "x": "残ったのは記録と、建て直された\n金閣と、屋根から外されていた鳳凰だ。"}, {"t": 2037.9833333333333, "x": "鳳凰は全部を見ていたのかもしれないわね。"}, {"t": 2040.5, "x": "あの夜はしまわれていて見ていない。"}, {"t": 2042.3833333333334, "x": "だからこそ残った。"}, {"t": 2043.7333333333333, "x": "1950年7月2日、午前3時7分。"}, {"t": 2047.1333333333334, "x": "望楼の人が林の向こうに火を見つけた。"}, {"t": 2049.7166666666667, "x": "今回はその火から5年後の秋までを、\n記録で読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
