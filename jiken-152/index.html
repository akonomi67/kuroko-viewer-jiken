<script>
const D={"name": "152", "file": "152_編集用", "dur": 1989.66665625, "segs": [], "subs": [{"t": 0.0, "x": "1980年9月3日、午後2時26分。"}, {"t": 3.45, "x": "空港の建物の中で、警視庁の係員が\n1人の男に話を聞いた。"}, {"t": 8.0, "x": "聞き取りはわずか9分間で終わった。"}, {"t": 10.333333333333334, "x": "9分？ずいぶん短いのね？"}, {"t": 12.35, "x": "男が答えたのはたった1つだけだった。"}, {"t": 14.95, "x": "昭和26年9月に出国した、という一言だ。"}, {"t": 18.416666666666668, "x": "どこから、どうやって、何のために\n出たのかは、申しかねると答えた。"}, {"t": 22.766666666666666, "x": "その人はどこから帰ってきたの？"}, {"t": 24.933333333333334, "x": "北京だ。29年ぶりに日本へ戻ってきた。"}, {"t": 27.933333333333334, "x": "男の名前は伊藤律で、かつて\n日本共産党の幹部だった人物だ。"}, {"t": 32.38333333333333, "x": "29年も外国にいたの？"}, {"t": 34.416666666666664, "x": "そうだ。しかも日本では、逮捕状が出たままだった。"}, {"t": 37.65, "x": "1950年6月30日から、行方が\n分からなくなっていたんだ。"}, {"t": 42.3, "x": "30年近くどこにいるか誰も知らなかったのね？"}, {"t": 45.45, "x": "そうだ。出国の場所も方法も、中国でどう\n扱われていたかも、国会の答弁では分かっていない。"}, {"t": 51.5, "x": "今回は、国会会議録に残った\n言葉だけでこの29年を追う。"}, {"t": 55.63333333333333, "x": "外務省と警察の答弁、それに証人の証言が中心だ。"}, {"t": 59.43333333333333, "x": "スパイだったという話も何度も国会に出てくる。"}, {"t": 62.5, "x": "それは本当だったの？"}, {"t": 64.01666666666667, "x": "この回では決めずに、誰がそう言ったかだけを言う。"}, {"t": 67.01666666666667, "x": "じゃあ、まず消える前の話からね。"}, {"t": 69.83333333333333, "x": "伊藤律の名前が国会会議録に\n出てくるのは、1949年の夏からだ。"}, {"t": 75.0, "x": "衆議院の考査特別委員会という場所だった。"}, {"t": 77.91666666666667, "x": "考査って何を調べる委員会なの？"}, {"t": 80.11666666666666, "x": "この年は広島の工場の争議が取り上げられていた。"}, {"t": 83.25, "x": "争議の指導に共産党の中央から\n5人が来た、といううわさがあった。"}, {"t": 87.35, "x": "その5人の中に伊藤律の名前も入っていた。"}, {"t": 90.31666666666666, "x": "うわさなのね？"}, {"t": 91.43333333333334, "x": "そうだ。議員が証人に、そういう\n話を聞いたかと尋ねた形だ。"}, {"t": 95.58333333333333, "x": "名前を挙げられた議員の1人はこう言っている。"}, {"t": 98.1, "x": "本人の知らぬうちに、自分の名前が出ている。"}, {"t": 101.01666666666667, "x": "名前だけが独り歩きしていたのね。"}, {"t": 103.33333333333333, "x": "このころから、伊藤律の名前は\n国会でたびたび話題になる。"}, {"t": 106.93333333333334, "x": "党の中央委員としてよく知られていたからだ。"}, {"t": 109.65, "x": "どんな話で出てきたの？"}, {"t": 111.36666666666666, "x": "次はシベリアからの引き揚げの話だ。"}, {"t": 114.33333333333333, "x": "1950年3月24日、参議院の引き揚げの特別委員会。"}, {"t": 118.93333333333334, "x": "ソ連の収容所から帰った人が証人として呼ばれた。"}, {"t": 122.21666666666667, "x": "問題になったのはある新聞記事だった。"}, {"t": 124.6, "x": "伊藤律が、引揚者をかえさないでと\n頼んだといううわさだ。"}, {"t": 128.23333333333332, "x": "えっ、そんなうわさがあったの？"}, {"t": 130.18333333333334, "x": "証人は、自分が話した中身は違うと言った。"}, {"t": 133.2, "x": "自分が聞いたのは、伊藤律が\n手紙で伝えたという話だった。"}, {"t": 136.98333333333332, "x": "共産主義者になって帰っても、\n監獄に入る心配は要らない。"}, {"t": 140.78333333333333, "x": "党はもう合法の活動に入った、という中身だ。"}, {"t": 143.91666666666666, "x": "うわさと全然違う話じゃない？"}, {"t": 146.03333333333333, "x": "そうだ。証人は記事の撤回と\n謝罪を求める文を読み上げた。"}, {"t": 149.8, "x": "4月3日には別の引揚者がこう証言している。"}, {"t": 152.9, "x": "収容所で、伊藤律から手紙が来たと何回も聞いた。"}, {"t": 156.38333333333333, "x": "遠いシベリアでも名前が知られていたのね。"}, {"t": 159.38333333333333, "x": "収容所では日本語の新聞が配られていた。"}, {"t": 162.03333333333333, "x": "日本新聞という名前の新聞だ。"}, {"t": 164.3, "x": "ソ連の中で日本語の新聞があったの？"}, {"t": 166.83333333333334, "x": "そうだ。引揚者の証言では、\n収容所の人たちがよく読んでいた。"}, {"t": 170.96666666666667, "x": "議員は、その新聞に載っていた原稿のことを尋ねた。"}, {"t": 174.31666666666666, "x": "党の幹部たちの原稿がよく載っていたという話だ。"}, {"t": 177.45, "x": "その中に、伊藤律の名前もあった。"}, {"t": 179.93333333333334, "x": "どうやってシベリアまで原稿が届いたのかしら？"}, {"t": 182.68333333333334, "x": "議員も、まさにそこを問いただした。"}, {"t": 184.88333333333333, "x": "ただ、会議録の中で届いた\n道筋ははっきりしていない。"}, {"t": 188.4, "x": "4月10日には別の議員がこう念を押している。"}, {"t": 191.11666666666667, "x": "伊藤律氏の声明などが多く\n載っていたことは、否定しないですね。"}, {"t": 195.11666666666667, "x": "名前が新聞にまで出ていたのね。"}, {"t": 197.26666666666668, "x": "それだけ名前の知られた幹部だった、ということだ。"}, {"t": 200.28333333333333, "x": "そして、この3か月後に姿を消すことになる。"}, {"t": 203.98333333333332, "x": "1950年6月6日。"}, {"t": 206.13333333333333, "x": "共産党の中央の幹部たちが追放になった。"}, {"t": 209.1, "x": "追放って党から？"}, {"t": 210.46666666666667, "x": "違う。公の仕事や政治の活動から外される追放だ。"}, {"t": 214.18333333333334, "x": "占領の時代に勅令で決められていた仕組みだ。"}, {"t": 217.0, "x": "追放になった人は、特別な\n審査の役所が動きを見る決まりだった。"}, {"t": 221.41666666666666, "x": "見張られる立場になったのね。"}, {"t": 223.3, "x": "ところが、追放の前から姿を消した人がいた。"}, {"t": 226.46666666666667, "x": "書記長の徳田球一だ。"}, {"t": 228.16666666666666, "x": "6月4日、追放の2日前から所在が分からなくなった。"}, {"t": 232.06666666666666, "x": "追放の前にもういなくなったの？"}, {"t": 234.15, "x": "そうだ。そして6月30日に伊藤律も所在不明になる。"}, {"t": 237.96666666666667, "x": "同じ日に、もう1人の幹部も姿を消している。"}, {"t": 241.11666666666667, "x": "みんな次々にいなくなったのね。"}, {"t": 243.23333333333332, "x": "法務総裁は、幹部たちが\n所在不明になった日を国会で答えている。"}, {"t": 247.41666666666666, "x": "早い人は6月4日、遅い人は7月11日だ。"}, {"t": 251.23333333333332, "x": "1か月ちょっとの間に次々といなくなったのね。"}, {"t": 254.9, "x": "政府は、追放した幹部たちに出頭を命じた。"}, {"t": 257.9, "x": "使ったのは団体等規正令という政令だ。"}, {"t": 260.6333333333333, "x": "だんたいとうきせいれい？"}, {"t": 262.03333333333336, "x": "団体の届け出や、当局への出頭を決めた決まりだ。"}, {"t": 265.4166666666667, "x": "出頭命令は20人に出された。"}, {"t": 267.56666666666666, "x": "そのうち9人が命令に応じなかった。"}, {"t": 270.05, "x": "伊藤律もその9人に入っていたのね？"}, {"t": 272.6, "x": "そうだ。ただ、伊藤律の届け出は出ていた。"}, {"t": 275.51666666666665, "x": "えっ、届け出はしていたの？"}, {"t": 277.3833333333333, "x": "家族が本人に代わって届け出ていたんだ。"}, {"t": 279.95, "x": "家族が代わりに出したのは7人。"}, {"t": 282.03333333333336, "x": "全く出さなかったのは、\n徳田球一ともう1人の2人だった。"}, {"t": 286.03333333333336, "x": "家族が代わりに出すしかなかったのね。"}, {"t": 288.45, "x": "法務総裁は、ここで珍しいことを言っている。"}, {"t": 291.21666666666664, "x": "出頭要求に応じなかった追放者は、\nそれまで1人もいなかった。"}, {"t": 295.3, "x": "むしろ自分から相談に来る人が大部分だった。"}, {"t": 298.3833333333333, "x": "じゃあ、この9人が初めての例なの？"}, {"t": 300.8333333333333, "x": "そうだ。告発したのもこの9人だけだった。"}, {"t": 304.4, "x": "1950年7月15日。"}, {"t": 306.75, "x": "9人全員に逮捕状が出た。"}, {"t": 308.8, "x": "罪は何だったの？"}, {"t": 310.15, "x": "団体等規正令の出頭の義務を怠った疑いだ。"}, {"t": 313.3333333333333, "x": "命令に応じなかったことそのものが罪とされた。"}, {"t": 316.31666666666666, "x": "でも、本人たちは命令を知っていたの？"}, {"t": 318.9166666666667, "x": "そこも国会で問われた。"}, {"t": 320.5, "x": "命令を出したとき、本人たちはもう家にいなかった。"}, {"t": 323.6333333333333, "x": "法務総裁は、初めの1日2日は\n知らなかったかもしれないと認めた。"}, {"t": 328.05, "x": "ただ新聞やラジオでも報じられている。"}, {"t": 330.26666666666665, "x": "家族も、命令を伝えようと手を尽くしている。"}, {"t": 333.0, "x": "それでも、長く行き先を告げずに姿をくらましている。"}, {"t": 336.3666666666667, "x": "だから、命令を拒んだものと\n認めざるを得ない、と答えた。"}, {"t": 340.06666666666666, "x": "知らなかったでは済まないということね。"}, {"t": 342.3666666666667, "x": "所在不明の日が分かったのも、\n逮捕状が出たあとの調べだった。"}, {"t": 346.1666666666667, "x": "それより前に尾行や\n監視はしていなかったと答えている。"}, {"t": 349.48333333333335, "x": "いなくなったことにあとから気づいたのね。"}, {"t": 352.4166666666667, "x": "1950年9月19日、衆議院の法務委員会。"}, {"t": 356.0833333333333, "x": "この日の議題は追放幹部の逮捕の問題だった。"}, {"t": 359.1166666666667, "x": "委員長は、傍聴人が多いので\n審議は慎重にと前置きした。"}, {"t": 362.93333333333334, "x": "それだけ注目されていたのね。"}, {"t": 364.96666666666664, "x": "議員は、こう切り出した。"}, {"t": 366.55, "x": "逮捕状が請求されてから、もう3か月がたっている。"}, {"t": 369.8833333333333, "x": "それなのにまだ逮捕されていない。"}, {"t": 371.78333333333336, "x": "国民は捜査の当局の無能をなじっている。"}, {"t": 374.55, "x": "3か月も見つからないなんて確かに不思議ね？"}, {"t": 377.48333333333335, "x": "議員は、当局の中に通じている\n者がいるかどうかまで尋ねた。"}, {"t": 381.3, "x": "議場からは、共産党は\n天下の公党だという声も飛んだ。"}, {"t": 384.9166666666667, "x": "かなり荒れた委員会だったのね。"}, {"t": 386.8833333333333, "x": "法務総裁は、幹部の名前と\n所在不明の日を1人ずつ答えた。"}, {"t": 390.85, "x": "伊藤は6月30日、とだけ記録に残っている。"}, {"t": 394.21666666666664, "x": "その日から、本当に行方が分からないのね。"}, {"t": 397.06666666666666, "x": "そうだ。警察の記録でも\n昭和25年7月以降は所在不明だ。"}, {"t": 401.3, "x": "この所在不明がそのあと29年続くことになる。"}, {"t": 405.1166666666667, "x": "次の日の9月20日も、同じ委員会でこの話が続いた。"}, {"t": 408.93333333333334, "x": "ある議員が地方の新聞に載った記事を持ち出した。"}, {"t": 411.8333333333333, "x": "書いたのは昔の共産党の幹部だった人物だという。"}, {"t": 415.23333333333335, "x": "どんな記事だったの？"}, {"t": 416.6166666666667, "x": "幹部たちが捕まらないのには裏の裏がある。"}, {"t": 419.2, "x": "伊藤律なら24時間あれば捕まえられる。"}, {"t": 421.81666666666666, "x": "それでも捕まえないのは、\nほかの幹部の動きを知るためだ。"}, {"t": 425.26666666666665, "x": "そんな中身だった、と議員は紹介した。"}, {"t": 427.96666666666664, "x": "えっ、わざと捕まえていないってこと？"}, {"t": 430.3666666666667, "x": "議員も、そういう事実があるのかと尋ねた。"}, {"t": 433.05, "x": "民衆はおそらくこれを信じている、とまで言っている。"}, {"t": 436.1333333333333, "x": "法務総裁は何て答えたの？"}, {"t": 438.1333333333333, "x": "答えはひと言だった。"}, {"t": 439.65, "x": "裏の裏はございません。"}, {"t": 441.15, "x": "短い答えね。"}, {"t": 442.4, "x": "議員は、それならなぜ記事を\n取り締まらないのかと迫った。"}, {"t": 445.75, "x": "総裁は、その記事の報告は\nまだ受けていないと答えた。"}, {"t": 449.31666666666666, "x": "うわさだけがどんどん広がっていたのね。"}, {"t": 452.1666666666667, "x": "9月19日の委員会では家族の話も出ている。"}, {"t": 455.26666666666665, "x": "議員は、留守の家の張り込みについて尋ねた。"}, {"t": 458.03333333333336, "x": "家族まで後をつけるのは、\n個人の自由を縛るのではないか。"}, {"t": 461.6666666666667, "x": "本人がいないのに家族が見張られていたの？"}, {"t": 464.3333333333333, "x": "法務総裁の答えはこうだ。"}, {"t": 466.06666666666666, "x": "追放者の動きを見るのは役所の決まった仕事だ。"}, {"t": 469.06666666666666, "x": "本人と特に近い人には、\n参考人として来てもらうこともある。"}, {"t": 473.1333333333333, "x": "留守の家の出入りを外から見張ることもある。"}, {"t": 475.75, "x": "やっぱり、家も見張っていたのね。"}, {"t": 477.8666666666667, "x": "ただし総裁はこうも付け加えている。"}, {"t": 480.03333333333336, "x": "関係者にはできるだけ迷惑がかからないように。"}, {"t": 482.8333333333333, "x": "調べる係にはそう厳しく指導している。"}, {"t": 485.5, "x": "残された家族は大変だったでしょうね。"}, {"t": 487.98333333333335, "x": "会議録には、家族の名前は出てこない。"}, {"t": 490.48333333333335, "x": "この回でも、家族の名前は言わないでおく。"}, {"t": 493.7, "x": "姿を消したあとも、伊藤律の名前は国会に出てくる。"}, {"t": 497.15, "x": "1951年の行政監察の特別委員会だ。"}, {"t": 500.73333333333335, "x": "ソ連からの秘密の文書を、\n伊藤律に渡したという証言が出た。"}, {"t": 504.81666666666666, "x": "えっ、本当に渡したの？"}, {"t": 506.6666666666667, "x": "別の証人はそんなことは全然ないと否定した。"}, {"t": 509.65, "x": "外国から文書を持ってくるのに、\n一々立会人を通して渡す。"}, {"t": 513.6666666666666, "x": "そんなことは常識で考えられない、と言っている。"}, {"t": 516.7, "x": "証言どうしがまるで食い違っているのね。"}, {"t": 519.1833333333333, "x": "そうだ。どちらが正しいかは\n会議録からは決められない。"}, {"t": 522.45, "x": "本人がいないところで名前だけが語られていたわけだ。"}, {"t": 525.7166666666667, "x": "本人は、そのころどこにいたの？"}, {"t": 527.9333333333333, "x": "そこがこの事件で一番分からないところだ。"}, {"t": 530.5333333333333, "x": "ただ、1つだけ本人が語ったことがある。"}, {"t": 533.3166666666667, "x": "それが冒頭の昭和26年9月という一言だ。"}, {"t": 536.6833333333333, "x": "1951年の9月に日本を出たってことね？"}, {"t": 540.1166666666667, "x": "そうだ。1980年に帰ってきたとき、そう答えている。"}, {"t": 544.15, "x": "場所も方法も目的も答えなかったけどな。"}, {"t": 547.5666666666667, "x": "1953年9月15日。"}, {"t": 550.0, "x": "共産党の機関紙アカハタにある発表が載った。"}, {"t": 552.95, "x": "伊藤律を追放するという発表だ。"}, {"t": 555.2666666666667, "x": "今度は、党から追い出されたのね？"}, {"t": 557.4833333333333, "x": "そうだ。11月20日の参議院の法務委員会で\nこの話が出た。"}, {"t": 561.6166666666667, "x": "答えたのは公安調査庁の次長だ。"}, {"t": 563.8833333333333, "x": "発表された理由だけでは、\n要点がはっきりしないと言った。"}, {"t": 567.5333333333333, "x": "理由がよく分からなかったの？"}, {"t": 569.3833333333333, "x": "ただ、こうも言っている。"}, {"t": 570.8166666666667, "x": "アカハタの記事でも、決め手は\nスパイ行為だと言っている。"}, {"t": 574.0833333333334, "x": "スパイ？"}, {"t": 575.2166666666667, "x": "あくまで党がそう発表したという話だ。"}, {"t": 577.7333333333333, "x": "次長は、これを党の中の引き締めの1つとも見ていた。"}, {"t": 581.1666666666666, "x": "ソ連でも同じころに大物の幹部が追放されていた。"}, {"t": 584.3166666666667, "x": "関連はあるが、\n直接どうこうということはないと答えている。"}, {"t": 587.9166666666666, "x": "外国の動きともつながって見られていたのね。"}, {"t": 590.7666666666667, "x": "伊藤律は、農民の問題に\n関わりが深い幹部だったという。"}, {"t": 594.4666666666667, "x": "次長は、党の方針への影響は\nまずないだろうと見ていた。"}, {"t": 598.45, "x": "同じ1953年の夏、\n衆議院の法務委員会にも名前が出ている。"}, {"t": 603.1333333333333, "x": "8月5日に、ある証人が受けた指令について話した。"}, {"t": 606.6666666666666, "x": "その中に、ゾルゲ事件という言葉が出てくる。"}, {"t": 609.6333333333333, "x": "ゾルゲ事件って戦争の前のスパイ事件よね？"}, {"t": 612.55, "x": "そうだ。証人はこう言われたと話した。"}, {"t": 615.0166666666667, "x": "ゾルゲ事件のとき、伊藤律の線で\n浮かび上がった女性がいる。"}, {"t": 618.5833333333334, "x": "北林という女性のめいを調べろという指令だった。"}, {"t": 621.7, "x": "伊藤律の線って言われていたのね。"}, {"t": 623.8833333333333, "x": "同じ場で、別の人は鹿地亘を調べろと言われた。"}, {"t": 627.0833333333334, "x": "証人は、鹿地亘の名前を聞いたのは\nそれが最初だと話している。"}, {"t": 631.15, "x": "鹿地亘って前に別の回で見た人じゃない？"}, {"t": 633.9333333333333, "x": "そうだ。同じ証言の中に2つの名前が並んでいる。"}, {"t": 637.2833333333333, "x": "ただ、これは証人が聞いた指令の言葉だ。"}, {"t": 639.9166666666666, "x": "伊藤律の線が何を指すのかは\nこの証言では分からない。"}, {"t": 643.3, "x": "でも、スパイの話はここから何度も出てくるのね？"}, {"t": 646.55, "x": "そうだ。次はその話の出どころを見ていく。"}, {"t": 649.8666666666667, "x": "時代は少し飛んで1979年3月10日。"}, {"t": 653.4, "x": "参議院の予算委員会で、ある議員が\n資料を読み上げた。"}, {"t": 656.6, "x": "外務省から受け取った資料だと言っている。"}, {"t": 659.1666666666666, "x": "何が書いてあったの？"}, {"t": 660.6166666666667, "x": "昭和15年、警視庁が共産党の事件で検挙を始めた。"}, {"t": 664.3666666666667, "x": "その中心とされたのが当時29歳の伊藤律だった。"}, {"t": 667.8166666666667, "x": "資料には、こう書かれていた。"}, {"t": 669.6166666666667, "x": "検挙後数か月にわたっても自供しなかった。"}, {"t": 672.3666666666667, "x": "取り調べは困難を極めた。"}, {"t": 674.2, "x": "しかし、ついに転向を決意して\n少しずつ自供するに至った。"}, {"t": 678.05, "x": "転向って考えを変えたってこと？"}, {"t": 680.25, "x": "そうだ。取り調べの中で考えを\n改めることを当時そう呼んだ。"}, {"t": 684.0, "x": "議員は、これをもとに次々と\n検挙が続いたと言っている。"}, {"t": 687.55, "x": "それがスパイと言われるもとになったのね？"}, {"t": 689.95, "x": "これは議員が読み上げた、昔の警察の側の書き方だ。"}, {"t": 693.5166666666667, "x": "この資料だけで何があったかを決めることはできない。"}, {"t": 696.5333333333333, "x": "警察の書き方だからってことね。"}, {"t": 698.8666666666667, "x": "そうだ。言い分の1つとして聞いておく。"}, {"t": 701.95, "x": "1980年11月5日、衆議院の外務委員会。"}, {"t": 705.85, "x": "議員がソ連で書かれた本を読み上げた。"}, {"t": 708.1333333333333, "x": "ゾルゲのことを書いた本だ。"}, {"t": 709.7666666666667, "x": "そこには、匿名の男が1人の日本人を密告したとある。"}, {"t": 713.55, "x": "匿名の男には、カッコ書きで伊藤律と書いてあった。"}, {"t": 717.0, "x": "密告された日本人は誰なの？"}, {"t": 719.15, "x": "北林トモという女性だ。\nさっきの証言の北林と同じ名字だ。"}, {"t": 723.4166666666666, "x": "本では、そこから逮捕が広がったと書いている。"}, {"t": 726.4333333333333, "x": "じゃあ、やっぱり伊藤律が？"}, {"t": 728.2166666666667, "x": "待て。これはソ連の本にそう書いてある、という話だ。"}, {"t": 731.5333333333333, "x": "同じ議員は、本人の様子もこう紹介している。"}, {"t": 734.5, "x": "テレビで、私がスパイだなんてと笑っていた。"}, {"t": 737.4333333333333, "x": "本人は、否定していたのね。"}, {"t": 739.5166666666667, "x": "そうだ。議員は、本人を証人として\n国会に呼ぶよう求めた。"}, {"t": 743.4166666666666, "x": "ただ、会議録の中で本人が国会に来た記録は無い。"}, {"t": 746.9166666666666, "x": "法務大臣も、ゾルゲ事件のいろいろな\nうわさがあると言っている。"}, {"t": 750.5833333333334, "x": "うわさという言い方なのね。"}, {"t": 752.2666666666667, "x": "そうだ。政府の答弁にスパイだったと答えた所は無い。"}, {"t": 755.7333333333333, "x": "スパイでなかったと答えた所も無い。"}, {"t": 758.1166666666667, "x": "どちらとも言わなかったのね。"}, {"t": 760.4333333333333, "x": "ここから1980年の帰国の話に入る。"}, {"t": 763.7, "x": "始まりは、7月の末に届いた\n北京からのニュースだった。"}, {"t": 767.3333333333334, "x": "伊藤律が北京にいるという時事通信の記事だ。"}, {"t": 770.1166666666667, "x": "伊藤律を見かけた日本人がいる、とも伝えていた。"}, {"t": 773.3666666666667, "x": "29年も行方が分からなかった人が北京に？"}, {"t": 776.5, "x": "そうだ。外務省は、北京の大使館に指示を出した。"}, {"t": 779.7833333333333, "x": "中国側に問い合わせるようにという指示だ。"}, {"t": 782.3666666666667, "x": "中国のどこに問い合わせたの？"}, {"t": 784.3333333333334, "x": "中国紅十字会だ。"}, {"t": 785.8166666666667, "x": "中国にいる外国人の世話をしている\n団体だ、と答弁は説明している。"}, {"t": 790.35, "x": "赤十字みたいな団体ね。"}, {"t": 792.2, "x": "ところが、なかなか返事が来なかった。"}, {"t": 794.65, "x": "その間にまた北京からニュースが届く。"}, {"t": 797.1666666666666, "x": "今度は、何だったの？"}, {"t": 798.8166666666667, "x": "8月23日の共同通信の記事だ。"}, {"t": 801.6, "x": "中国の外交部が、伊藤律の生存を\n確認したという内容だった。"}, {"t": 806.4333333333333, "x": "8月23日、大使館はすぐに外交部へ問い合わせた。"}, {"t": 810.1833333333333, "x": "返事をよこしたのは紅十字会だった。"}, {"t": 812.5, "x": "伝えられたことは2つ。"}, {"t": 814.0833333333334, "x": "伊藤律が北京に住んでいること。"}, {"t": 816.1, "x": "そして、日本へ帰ることを強く望んでいること。"}, {"t": 819.2166666666667, "x": "本当に、生きていたのね。"}, {"t": 821.0666666666667, "x": "そうだ。1950年6月30日から30年がたっていた。"}, {"t": 825.45, "x": "大使館は、その日のうちに本人に会っている。"}, {"t": 828.4, "x": "会えたの？"}, {"t": 829.5333333333333, "x": "会えた。そして本人であることをほぼ確かめた。"}, {"t": 832.4166666666666, "x": "帰りたいという気持ちも確かめた。"}, {"t": 834.6333333333333, "x": "ほぼなのね？"}, {"t": 835.7666666666667, "x": "29年も会っていない人だ。すぐには決められない。"}, {"t": 838.9666666666667, "x": "だから、大使館はこのあと2回続けて会っている。"}, {"t": 842.6166666666667, "x": "外務省の答弁によると会ったのは3回だ。"}, {"t": 845.2833333333333, "x": "1回目が8月23日。"}, {"t": 847.1833333333333, "x": "本人の確認と帰国の意思の確認だ。"}, {"t": 849.8833333333333, "x": "2回目が8月26日。"}, {"t": 851.75, "x": "帰る手続きの説明と事情の聞き取りだ。"}, {"t": 854.45, "x": "3回目が8月29日。"}, {"t": 856.3, "x": "本人から確認書を出してもらった。"}, {"t": 858.7666666666667, "x": "本人だってどうやって確かめたの？"}, {"t": 861.0333333333333, "x": "本人が話した中身と戸籍謄本だ。"}, {"t": 863.6, "x": "本人の口から、帰国を強く望むことも聞き取った。"}, {"t": 867.1666666666666, "x": "戸籍まで使ったのね。"}, {"t": 868.8166666666667, "x": "ただ、困ったこともあった。"}, {"t": 870.6166666666667, "x": "伊藤律は、旅券を持っていなかったんだ。"}, {"t": 873.2333333333333, "x": "パスポートが無いの？"}, {"t": 874.6, "x": "そうだ。大使館は、持っていない理由も尋ねた。"}, {"t": 877.6166666666667, "x": "答えは、昭和26年9月に出国して\n中国に渡った、だけだった。"}, {"t": 882.3833333333333, "x": "それ以外のことは多くを語りたがらなかったという。"}, {"t": 885.35, "x": "3回会っても話してくれなかったのね。"}, {"t": 887.8666666666667, "x": "外務省は、聞き取った中身を\n明らかにするのは難しいとも答えている。"}, {"t": 892.7833333333333, "x": "旅券が無い人をどうやって帰したのか。"}, {"t": 895.1166666666667, "x": "外務省は、11月の国会でこう答えている。"}, {"t": 898.1666666666666, "x": "北京にいるほかの日本人と同じように扱った。"}, {"t": 901.1, "x": "本人の確認と意思の確認をして、\n帰国の手続きをした。"}, {"t": 905.0166666666667, "x": "特別扱いはしなかったのね。"}, {"t": 907.15, "x": "アジア局長も同じことを言っている。"}, {"t": 909.2333333333333, "x": "長く外国にいた日本人への手助けとして扱った、と。"}, {"t": 912.9, "x": "ある議員は、10月の国会で\n外務省の務めを問いただした。"}, {"t": 916.5833333333334, "x": "外国にいる日本人の命や財産を守る義務がある。"}, {"t": 919.7833333333333, "x": "それは旅券を持って出た人も、\nひそかに出た人も同じはずだ。"}, {"t": 923.6833333333333, "x": "パスポートが無くても日本人は日本人ってことね。"}, {"t": 926.85, "x": "アジア局長は旅券を持っていなかったことを認めた。"}, {"t": 929.8833333333333, "x": "そのうえで、帰国した今は国内で\nどう尋ねるかの問題だと答えた。"}, {"t": 934.1833333333333, "x": "外国のことは外務省で国内のことは国内でってこと？"}, {"t": 937.8166666666667, "x": "そういう分け方の答弁だな。"}, {"t": 940.2333333333333, "x": "では、中国はどう説明したのか。"}, {"t": 942.4833333333333, "x": "外務省の答弁では、伊藤律は年を\n取って体もとても弱っている。"}, {"t": 946.6166666666667, "x": "中国側も、そのことを認めていたという。"}, {"t": 949.4, "x": "体が弱っていたのね。"}, {"t": 951.0666666666667, "x": "中国側の立場は、伊藤律は長く\n亡命していたというものだ。"}, {"t": 954.9666666666667, "x": "紅十字会の記者会見でもそう\n言っていた、と答弁にある。"}, {"t": 958.5833333333334, "x": "亡命なのね。"}, {"t": 959.7666666666667, "x": "それから、こんな答弁もある。"}, {"t": 961.6333333333333, "x": "伊藤律は、この年の1月に\n紅十字会の管理の下に置かれた。"}, {"t": 965.7, "x": "それより前のことは本人も\n中国側もはっきり言っていない。"}, {"t": 969.2833333333333, "x": "1月より前のことは空白なの？"}, {"t": 971.5666666666667, "x": "そうだ。政府の記録の上では\n29年のほとんどが空白だ。"}, {"t": 975.4, "x": "外務省の担当者は、全くの推測と\n断ってこう話している。"}, {"t": 979.4833333333333, "x": "外国の人を食客として\n長く置いておくのは好ましくない。"}, {"t": 983.0833333333334, "x": "中国がそう考えて帰したのかもしれない。"}, {"t": 985.8333333333334, "x": "しょっかくって何？"}, {"t": 987.1166666666667, "x": "よその家で食べさせてもらって暮らす客のことだ。"}, {"t": 990.15, "x": "その言葉があとで問題になりそうね。"}, {"t": 993.0333333333333, "x": "9月4日の衆議院の決算委員会では、\nこんなやりとりもあった。"}, {"t": 996.8833333333333, "x": "議員は、こう尋ねた。"}, {"t": 998.3833333333333, "x": "今なら帰しても日中の関係にひびは入らない。"}, {"t": 1001.3666666666667, "x": "中国は、そう判断したのではないか。"}, {"t": 1003.9666666666667, "x": "日本と中国の関係が良くなったからってこと？"}, {"t": 1007.0, "x": "そうだ。外務省の担当者は、\nそういうことも当然あろうと答えた。"}, {"t": 1011.0833333333334, "x": "日中の関係がここまで着実に進んできた。"}, {"t": 1014.1, "x": "それが帰国を実現させた\n1つの要因、という考えは十分あり得る。"}, {"t": 1018.4, "x": "なるほどね。"}, {"t": 1019.5333333333333, "x": "ところが、10月30日に、参議院で\nこの答弁が取り上げられた。"}, {"t": 1023.7666666666667, "x": "別の議員は、こう読み解いた。"}, {"t": 1025.6666666666667, "x": "今なら帰してもひびが入らない、ということは。"}, {"t": 1028.45, "x": "前ならひびが入ったという意味にならないか。"}, {"t": 1031.0833333333333, "x": "するどい読み方ね。"}, {"t": 1032.4833333333333, "x": "アジア局長は、担当者が中国の考えを\n推し量って答えたのだろうと言った。"}, {"t": 1037.1333333333334, "x": "国交が正常になり対話の道が\n開けた上での判断もあり得る、と。"}, {"t": 1041.3166666666666, "x": "はっきりした理由は分からないままなのね。"}, {"t": 1044.2833333333333, "x": "帰国の1週間前、8月27日の衆議院の法務委員会。"}, {"t": 1048.5166666666667, "x": "2人の議員が同じことを尋ねている。"}, {"t": 1050.7833333333333, "x": "伊藤律があすかあさってにも帰ってくるらしい。"}, {"t": 1053.3666666666666, "x": "法務省や警察はどう向き合うのか。"}, {"t": 1055.6333333333334, "x": "逮捕状が出ていた人だものね。"}, {"t": 1057.7, "x": "警察庁の課長はこう答えた。"}, {"t": 1059.7333333333333, "x": "法律の手続きを経ずに日本を出国している。"}, {"t": 1062.6166666666666, "x": "出入国の決まりに反した疑いもある。"}, {"t": 1065.1666666666667, "x": "帰国したら、出国の事情を\n本人から聞かなければならない。"}, {"t": 1069.0333333333333, "x": "だから、空港で話を聞いたのね。"}, {"t": 1071.3833333333334, "x": "そうだ。課長は聞く中身もはっきり言っていた。"}, {"t": 1074.15, "x": "出国が昭和26年11月1日より後か前か。"}, {"t": 1077.8333333333333, "x": "それを本人の話などで明らかにする必要がある。"}, {"t": 1081.1, "x": "11月1日ってなにか意味があるの？"}, {"t": 1083.65, "x": "ある。そこが罪に問えるかどうかの分かれ目だった。"}, {"t": 1087.1666666666667, "x": "1980年9月3日、伊藤律は成田に帰ってきた。"}, {"t": 1091.2333333333333, "x": "国会では議員たちが29年ぶりの帰国と言っている。"}, {"t": 1094.65, "x": "逮捕状が出ていた人よね。"}, {"t": 1096.25, "x": "空港で捕まったの？"}, {"t": 1097.8333333333333, "x": "いや、逮捕はされていない。"}, {"t": 1099.4333333333334, "x": "空港の建物の中で、\n警視庁の係員が話を聞いただけだ。"}, {"t": 1103.5, "x": "時間は午後2時26分から35分までの9分間。"}, {"t": 1107.0333333333333, "x": "1人の立ち会いのもとでおこなわれた。"}, {"t": 1109.3166666666666, "x": "何を聞いたの？"}, {"t": 1110.45, "x": "出国した日と、出国の場所と方法と目的だ。"}, {"t": 1113.8666666666666, "x": "答えは冒頭のとおりだ。"}, {"t": 1115.3833333333334, "x": "出国したのは昭和26年9月。"}, {"t": 1117.9, "x": "あとは申しかねる、と。"}, {"t": 1119.4666666666667, "x": "9月なら11月1日より前ね？"}, {"t": 1121.9666666666667, "x": "そうだ。次はなぜその日付が大事なのかを見ていく。"}, {"t": 1125.7666666666667, "x": "まず1950年の逮捕状の罪だ。"}, {"t": 1128.3833333333334, "x": "団体等規正令の出頭命令に\n応じなかった、という疑いだった。"}, {"t": 1132.45, "x": "ところが、この政令はもう無くなっていた。"}, {"t": 1135.05, "x": "無くなったの？"}, {"t": 1136.1833333333334, "x": "昭和27年7月にできた\n破壊活動防止法で廃止されたんだ。"}, {"t": 1140.45, "x": "廃止の前の行いには前の例に\nよる、という決まりもあった。"}, {"t": 1144.05, "x": "じゃあ、罪には問えるんじゃない？"}, {"t": 1145.9, "x": "それが違う。最高裁の判例がすでに固まっていた。"}, {"t": 1149.25, "x": "平和条約が効力を持ったあとは、\n刑が廃止されたのと同じ。"}, {"t": 1152.9666666666667, "x": "だから、裁判を打ち切る\n免訴にするべきだ、という判例だ。"}, {"t": 1156.7333333333333, "x": "めんそ？"}, {"t": 1157.8666666666666, "x": "有罪か無罪かを決めずに裁判を終わらせることだ。"}, {"t": 1160.8, "x": "警察庁はこう答えている。"}, {"t": 1162.55, "x": "伊藤氏を団体等規正令の違反で罰することはできない。"}, {"t": 1165.95, "x": "30年前の逮捕状はもう使えないのね。"}, {"t": 1168.7166666666667, "x": "そうだ。残ったのは出国のしかたの問題だった。"}, {"t": 1172.5333333333333, "x": "伊藤律は、旅券を持たずに国を出ている。"}, {"t": 1175.1166666666666, "x": "法律の手続きを経ずに出国した、と警察は見ていた。"}, {"t": 1178.75, "x": "今それを罰しているのは、国を\n出る手続きを決めた政令だ。"}, {"t": 1182.2666666666667, "x": "この政令ができたのは昭和26年11月1日だった。"}, {"t": 1186.2, "x": "本人が出たのは昭和26年9月よね？"}, {"t": 1189.05, "x": "そうだ。11月1日より2か月早い。"}, {"t": 1191.9666666666667, "x": "その前はどんな決まりだったの？"}, {"t": 1193.95, "x": "連合国の最高司令官の覚書と、\n昭和25年の政令が規制していた。"}, {"t": 1198.7666666666667, "x": "ところが、その覚書も昭和26年12月1日に廃止された。"}, {"t": 1203.2166666666667, "x": "ここでも、免訴にするという\n最高裁の判例が固まっていた。"}, {"t": 1207.0833333333333, "x": "じゃあ、9月に出たなら罪にならないの？"}, {"t": 1209.6, "x": "そうだ。警察庁は、はっきり答えている。"}, {"t": 1212.35, "x": "11月1日より前の出国なら処罰はできない。"}, {"t": 1215.75, "x": "だから、出国の日を聞いたのね。"}, {"t": 1218.05, "x": "そうだ。答えは9月。それ以上は語らなかった。"}, {"t": 1221.2, "x": "ある議員は、本人の言うことを\nそのまま聞いただけだと批判した。"}, {"t": 1225.0333333333333, "x": "でも、確かめようもないのね？"}, {"t": 1227.0333333333333, "x": "場所も方法も本人は語らなかったからな。"}, {"t": 1230.3333333333333, "x": "帰ってきた伊藤律はすぐに入院した。"}, {"t": 1232.7166666666667, "x": "警察庁の警備局長は、11月の国会でこう答えている。"}, {"t": 1236.6833333333334, "x": "9月3日の聞き取りのあと、それ以上の進展はない。"}, {"t": 1239.9166666666667, "x": "健康の状態から見て、今また\n聞き取りをする状況ではない。"}, {"t": 1243.6833333333334, "x": "体のほうが先ということね。"}, {"t": 1245.6666666666667, "x": "局長は、こうも言っている。"}, {"t": 1247.4, "x": "全部を話したいという気持ちになるかどうか。"}, {"t": 1249.9666666666667, "x": "最後は本人の心の問題にかかっている。"}, {"t": 1252.7666666666667, "x": "無理には聞けないのね。"}, {"t": 1254.2666666666667, "x": "そうだ。局長は、本人が事実を\n語ることを期待すると話した。"}, {"t": 1258.4833333333333, "x": "個人としての期待だと断ってな。"}, {"t": 1260.85, "x": "警察も、続きを知りたかったのね。"}, {"t": 1263.8333333333333, "x": "1980年10月30日、参議院の法務委員会。"}, {"t": 1267.8166666666666, "x": "ある議員があの食客という言葉を取り上げた。"}, {"t": 1270.4, "x": "議員は、こう言った。"}, {"t": 1271.7166666666667, "x": "何人の目にも触れない。"}, {"t": 1273.0666666666666, "x": "何人にも会わない。"}, {"t": 1274.4, "x": "手紙一つさえ出せない\n食客なんて、あるんでしょうかね。"}, {"t": 1277.8666666666666, "x": "確かに、変な食客よね？"}, {"t": 1279.95, "x": "答えたのは外務省のアジア局長だ。"}, {"t": 1282.2666666666667, "x": "本人に尋ねなかったわけではないと言った。"}, {"t": 1284.8333333333333, "x": "しかし本人は口をつぐみ、\n過去のことは話したくないと言った。"}, {"t": 1288.6333333333334, "x": "外務省としてそれ以上の追及はしていない。"}, {"t": 1291.4, "x": "話したくないなら仕方ないのかしら？"}, {"t": 1293.75, "x": "議員は、中国でどう扱われていたと思うかとも尋ねた。"}, {"t": 1297.2, "x": "局長の答えは、承知していない、だった。"}, {"t": 1299.9833333333333, "x": "どういう資格でいたのか。"}, {"t": 1301.3333333333333, "x": "どんな待遇だったのか。"}, {"t": 1302.9, "x": "中国側からは、北京にいることと\n帰国の希望しか聞いていない。"}, {"t": 1306.8666666666666, "x": "本当に、何も分からないのね。"}, {"t": 1309.0333333333333, "x": "局長は、中国側が\n面倒を見ていたのだろう、とだけ答えた。"}, {"t": 1312.9333333333334, "x": "政府から中国に重ねて聞く必要は、\n今はないとも答えている。"}, {"t": 1317.6, "x": "1980年11月26日、衆議院の法務委員会。"}, {"t": 1321.9, "x": "民社党の議員が長い質問をおこなった。"}, {"t": 1324.4333333333334, "x": "議員は、帰国した姿を新聞の写真で見たと話した。"}, {"t": 1328.0166666666667, "x": "昔の写真と比べてすっかり変わっていた。"}, {"t": 1330.7833333333333, "x": "体が弱っていたのよね。"}, {"t": 1332.55, "x": "報道では、目も耳も十分ではないと伝えられていた。"}, {"t": 1335.7833333333333, "x": "大使館とも筆談でしか話していないという話だった。"}, {"t": 1339.3666666666666, "x": "筆談でしか話せなかったの？"}, {"t": 1341.4333333333334, "x": "議員は、これは\n日本国籍の人の人権の問題だと言った。"}, {"t": 1345.2166666666667, "x": "考え方は違っても、放っておくわけにはいかない。"}, {"t": 1348.4, "x": "中国でどこにいたのか聞いたのね？"}, {"t": 1350.6, "x": "そうだ。北京のどこにいたのか\n説明してほしいと求めた。"}, {"t": 1354.0833333333333, "x": "外務省の答えはこれまでと変わらなかった。"}, {"t": 1356.6333333333334, "x": "年の初めより前のことは本人も中国も語っていない。"}, {"t": 1360.25, "x": "やっぱり、空白のままなのね。"}, {"t": 1362.8333333333333, "x": "議員は、1冊の本を読み上げた。"}, {"t": 1364.9833333333333, "x": "北京で伊藤律と一緒に働いていた、\n元党員が書いた本だ。"}, {"t": 1368.8666666666666, "x": "帰国のすぐあとの9月29日に出たばかりの本だった。"}, {"t": 1372.5, "x": "どんなことが書いてあったの？"}, {"t": 1374.2666666666667, "x": "ある日、建物の入り口に\n中国の公安部隊の兵士が立っていた。"}, {"t": 1378.2833333333333, "x": "そこへ兵士に両腕を抱えられた伊藤律が出てきた。"}, {"t": 1381.35, "x": "紙のように青白い顔だったと書いてある。"}, {"t": 1383.75, "x": "そのまま黒い車に乗せられて連れていかれた。"}, {"t": 1386.6, "x": "えっ、連れていかれたの？"}, {"t": 1388.2333333333333, "x": "著者は、それが最後に見た姿だったと書いている。"}, {"t": 1391.3166666666666, "x": "その夜の会議ではこんな報告があったという。"}, {"t": 1393.9666666666667, "x": "スパイの疑いがあるので、身柄を\n中国の機関に預けて調べる。"}, {"t": 1398.0166666666667, "x": "調べるって？"}, {"t": 1399.15, "x": "党の中で問いただす査問のことだ。"}, {"t": 1401.3666666666666, "x": "ただし、これは本の文を議員が読み上げたものだ。"}, {"t": 1404.35, "x": "本に書いてあることなのね。"}, {"t": 1406.1333333333334, "x": "そうだ。公安調査庁の長官は、\n評価のコメントは控えると答えた。"}, {"t": 1411.1, "x": "同じ質問の中で、議員は新聞の記事も紹介している。"}, {"t": 1414.7, "x": "9月6日の新聞に中国の高官の言葉が載ったという。"}, {"t": 1418.3166666666666, "x": "中国の高官は何て言ったの？"}, {"t": 1420.4166666666667, "x": "議員が紹介した記事ではこうだ。"}, {"t": 1422.3833333333334, "x": "中国は、当時の日本の共産党から頼まれて預かった。"}, {"t": 1426.0, "x": "当時は関係があったので、頼まれれば\n預かるのが当たり前だった。"}, {"t": 1429.8833333333334, "x": "頼まれて預かったなのね。"}, {"t": 1431.6666666666667, "x": "議員は問題は預かり方ではないかと言った。"}, {"t": 1434.2666666666667, "x": "本人は、いた場所を監獄と\n表現していた、とも紹介している。"}, {"t": 1438.4, "x": "その記事は本当なの？"}, {"t": 1439.9833333333333, "x": "外務省は、報道の1つ1つを確かめたり\n打ち消したりはしないと答えた。"}, {"t": 1444.5666666666666, "x": "共産党の議員は、中国の言うことを\n真に受けてよいのかと反論した。"}, {"t": 1448.8, "x": "ここでも言い分がぶつかっているのね。"}, {"t": 1451.0333333333333, "x": "そうだ。議員が紹介した\n新聞の記事という形で聞いておく。"}, {"t": 1455.35, "x": "帰国のあと、新聞や週刊誌は\nたくさんの記事を出した。"}, {"t": 1458.8, "x": "外務省の担当者も、大変な\n量の報道がされていると答えている。"}, {"t": 1463.0166666666667, "x": "記事がそんなにたくさん出ていたのね。"}, {"t": 1465.2833333333333, "x": "民社党の議員はある記事の中身を確かめようとした。"}, {"t": 1468.4, "x": "1962年まで調べに来ていたが、\nその後は来なくなった。"}, {"t": 1472.5166666666667, "x": "本人がそう話したという記事だ。"}, {"t": 1474.7, "x": "誰が調べに来ていたの？"}, {"t": 1476.3833333333334, "x": "記事では当時の党の幹部だとされていた。"}, {"t": 1478.8166666666666, "x": "議員は、外務省が会ったときに本人が\n書いて伝えたのではと尋ねた。"}, {"t": 1482.9833333333333, "x": "最初に本人と会ったのは政府だけのはずだ、と。"}, {"t": 1486.0666666666666, "x": "外務省は何て答えたの？"}, {"t": 1487.9166666666667, "x": "中身を明らかにするのは難しい、だった。"}, {"t": 1490.55, "x": "記事の1つ1つを認めたり\n否定したりするのは控えたい。"}, {"t": 1494.1833333333334, "x": "外務省は最後まで中身を言わなかったのね。"}, {"t": 1496.9333333333334, "x": "そうだ。9月にもこう答えている。"}, {"t": 1499.0666666666666, "x": "報道のどこが正確で、どこが\n不正確かを言う立場にない。"}, {"t": 1502.7666666666667, "x": "政府は、記事に乗らなかったってことね。"}, {"t": 1505.8333333333333, "x": "11月26日の質問に、奥野誠亮法務大臣はこう答えた。"}, {"t": 1510.4166666666667, "x": "目を悪くしている。耳を悪くしている。"}, {"t": 1512.75, "x": "中国にいる\n間ただごとでなかったんだな、という印象だ。"}, {"t": 1516.15, "x": "気の毒だという気持ちと一緒にそう感じた。"}, {"t": 1518.85, "x": "大臣も、心配していたのね。"}, {"t": 1521.0666666666666, "x": "帰国の前、記者から入国を\n許すのかと聞かれたこともあった。"}, {"t": 1524.8666666666666, "x": "大臣は、こう答えたという。"}, {"t": 1526.7166666666667, "x": "日本人が日本に帰ってくるのですから、\n何のとがめもいたしません。"}, {"t": 1530.8166666666666, "x": "帰ってくるのは当たり前ということね。"}, {"t": 1533.0666666666666, "x": "ただ、大臣はもう一言付け加えた。"}, {"t": 1535.6, "x": "日本に帰っても、自由に物を\n言える立場にないように推測する。"}, {"t": 1539.5166666666667, "x": "身の回りが必ずしも好ましい\n環境でないと心配している。"}, {"t": 1543.2666666666667, "x": "その言葉は大丈夫だったの？"}, {"t": 1545.2166666666667, "x": "いや。この一言が次の国会で問題になる。"}, {"t": 1548.85, "x": "同じ日に、共産党の議員が反論した。"}, {"t": 1551.5, "x": "拘禁されたとか拘禁を頼んだというのは、\n根拠のない作り話だ。"}, {"t": 1555.7666666666667, "x": "全く逆の言い分なのね？"}, {"t": 1557.5833333333333, "x": "そうだ。議員は、当時の幹部の文章を\n引いて説明した。"}, {"t": 1561.1333333333334, "x": "北京にいたグループが、\n伊藤律の素行や過去の疑いを調べた。"}, {"t": 1564.9333333333334, "x": "そのために住む所を中国側に頼んだという話だ。"}, {"t": 1568.3166666666666, "x": "上流の下ぐらいの邸宅で、料理人や使用人もいた。"}, {"t": 1571.8333333333333, "x": "監獄とは全然違う話ね。"}, {"t": 1574.05, "x": "そのあと伊藤律はグループから除名された。"}, {"t": 1576.5, "x": "当時は党が分かれていた\n時期で、今の党とは関係ない。"}, {"t": 1579.8166666666666, "x": "それから、先の暮らしは本人と\n中国のことだとも言った。"}, {"t": 1583.5833333333333, "x": "1962年まで調べに来たっていう記事はどうなの？"}, {"t": 1587.2333333333333, "x": "議員はそれはとんでもない作り話だと言った。"}, {"t": 1589.95, "x": "本人も否定していると伝え聞いている。"}, {"t": 1592.4333333333334, "x": "同じ出来事なのに言うことがこんなに違うのね。"}, {"t": 1595.35, "x": "そうだ。この回ではどちらが正しいとも言わない。"}, {"t": 1598.1166666666666, "x": "会議録には、両方の言葉がそのまま残っている。"}, {"t": 1601.9, "x": "1980年12月18日、参議院の法務委員会。"}, {"t": 1606.0, "x": "共産党の議員が大臣のあの一言を問いただした。"}, {"t": 1609.1833333333334, "x": "自由に物を言える立場にない、という言葉だ。"}, {"t": 1612.0166666666667, "x": "どう問いただしたの？"}, {"t": 1613.3666666666666, "x": "議員は、帰国してからの日々を日付順に読み上げた。"}, {"t": 1616.5833333333333, "x": "9月3日に帰国してすぐに病院に入った。"}, {"t": 1619.45, "x": "5日に長男の夫婦が見舞い、6日に妻が会いに来た。"}, {"t": 1622.75, "x": "9日には孫の顔を見た。"}, {"t": 1624.5333333333333, "x": "14日には弟と妹が会いに来た。"}, {"t": 1627.0666666666666, "x": "家族とちゃんと会えていたのね。"}, {"t": 1628.95, "x": "10月11日には記者会見も開いている。"}, {"t": 1631.8166666666666, "x": "11月11日に退院して長男の家に住んだ。"}, {"t": 1635.0333333333333, "x": "テレビでは孫と散歩する姿も流れた、と議員は言った。"}, {"t": 1638.6333333333334, "x": "自由がないようには見えないってことね？"}, {"t": 1640.9166666666667, "x": "そうだ。議員は、何を根拠にそう言ったのかと迫った。"}, {"t": 1644.95, "x": "奥野法務大臣は、こう答えた。"}, {"t": 1647.1, "x": "伊藤律さんが何もおっしゃらない。"}, {"t": 1649.0166666666667, "x": "人に会おうとされない。"}, {"t": 1650.2, "x": "何が原因だろうかと疑問に思っている。"}, {"t": 1652.7833333333333, "x": "大臣も、理由を知らなかったのね。"}, {"t": 1655.1833333333334, "x": "そうだ。何が原因か私にもわからないと言っている。"}, {"t": 1658.4, "x": "体の状態かもしれない。"}, {"t": 1659.9166666666667, "x": "家族のことかもしれない。"}, {"t": 1661.5166666666667, "x": "中国での扱いのことかもしれない。"}, {"t": 1663.7333333333333, "x": "どれか分からないと大臣は並べた。"}, {"t": 1665.9666666666667, "x": "決めつけたわけじゃないってこと？"}, {"t": 1667.95, "x": "そうだ。共産党だとか誰だとか一つも言っていない。"}, {"t": 1671.2, "x": "身の自由のことではなく、物を\n言わない様子からの推測だ。"}, {"t": 1674.8666666666666, "x": "言葉の受け取り方がすれ違っていたのね。"}, {"t": 1677.5166666666667, "x": "大臣は、こうも言っている。"}, {"t": 1679.2, "x": "客観的な事実がはっきりすれば、\n憶測が憶測を生むことは避けられる。"}, {"t": 1683.85, "x": "本人が話さないからうわさが増えていくのね。"}, {"t": 1686.6166666666666, "x": "そうだ。中国も話さない。本人も話さない。"}, {"t": 1689.7, "x": "その空白を国会の言葉が埋めようとしていた。"}, {"t": 1693.1666666666667, "x": "年が明けて、1981年2月13日の参議院の予算委員会。"}, {"t": 1698.0666666666666, "x": "民社党の議員がこう切り出した。"}, {"t": 1700.0666666666666, "x": "その後、伊藤氏は新聞と週刊誌を\n通じて証言をおこなった。"}, {"t": 1703.8166666666666, "x": "かなりの部分が明らかになってきている。"}, {"t": 1706.2333333333333, "x": "とうとう本人が話したのね？"}, {"t": 1708.2166666666667, "x": "そうだ。議員は、その証言の中身を国会で紹介した。"}, {"t": 1711.85, "x": "ここからは議員が伝えた本人の話だ。"}, {"t": 1714.55, "x": "本人の言い分ということね。"}, {"t": 1716.4, "x": "1952年の12月に幹部の会議が急に開かれた。"}, {"t": 1720.35, "x": "伊藤律を隔離して審査せよという話が出た。"}, {"t": 1723.2, "x": "すぐに別の場所へ移され、\n見張りがついて外出も禁じられた。"}, {"t": 1727.1333333333334, "x": "閉じ込められたってこと？"}, {"t": 1728.7666666666667, "x": "本人の話ではな。そしてその1年後だ。"}, {"t": 1731.6666666666667, "x": "1953年の12月に中国の公安が飛び出してきた。"}, {"t": 1735.75, "x": "ピストルを突きつけられて体を調べられた。"}, {"t": 1738.3833333333334, "x": "そのまま車で監獄に連れていかれた。"}, {"t": 1741.4166666666667, "x": "監獄では名前も取り上げられたという。"}, {"t": 1743.6333333333334, "x": "本名の伊藤も、中国で使っていた名前もだ。"}, {"t": 1746.7666666666667, "x": "じゃあ、何と呼ばれていたの？"}, {"t": 1748.6, "x": "三号罪犯。その記名だけだったという。"}, {"t": 1751.2333333333333, "x": "番号で呼ばれていたのね。"}, {"t": 1752.9333333333334, "x": "本人の話では、その日から\n27年間の獄中の生活だった。"}, {"t": 1757.3666666666666, "x": "1953年から1980年まで。"}, {"t": 1760.75, "x": "1953年9月の除名の発表と時期が近いわね？"}, {"t": 1764.7166666666667, "x": "そうだな。ただ、つながりを\n決めるのはこの回ではやめておく。"}, {"t": 1768.2166666666667, "x": "これは議員が新聞などから紹介した本人の話だ。"}, {"t": 1771.5166666666667, "x": "当時の幹部の話とは食い違いがある。"}, {"t": 1774.0333333333333, "x": "住む所を頼んだという話だったわね。"}, {"t": 1776.6333333333334, "x": "そうだ。奥野法務大臣も\nその食い違いを国会で認めている。"}, {"t": 1780.4, "x": "大臣は、まことに気の毒な\n状態であったと思うとも述べた。"}, {"t": 1784.1666666666667, "x": "どちらが本当かは分からないままなのね。"}, {"t": 1787.1833333333334, "x": "議員は、法律のことも尋ねた。"}, {"t": 1789.3666666666666, "x": "日本人が国の外で犯した罪でも罰せられるのか。"}, {"t": 1792.6, "x": "奥野法務大臣は、罰せられるものがあると答えた。"}, {"t": 1795.7333333333333, "x": "監禁の罪は国の外でも処罰の対象になる。"}, {"t": 1798.9, "x": "じゃあ、罪に問えるのね？"}, {"t": 1800.55, "x": "条件がある。"}, {"t": 1801.6833333333334, "x": "日本人が捕まえて閉じ込めたなら罪が成り立つ。"}, {"t": 1804.7, "x": "しかし、外国の国家としての行いなら罪は問えない。"}, {"t": 1808.2, "x": "中国がやったなら日本の法律では裁けないのね。"}, {"t": 1811.4, "x": "そうだ。法務省の刑事局長は時効のことも答えている。"}, {"t": 1814.95, "x": "犯人が国の外にいる間は時効は進まない。"}, {"t": 1817.9333333333334, "x": "だったら、今からでも調べられるんじゃない？"}, {"t": 1820.5166666666667, "x": "大臣は、まず中国が\nはっきりさせることが大切だと答えた。"}, {"t": 1824.4166666666667, "x": "捕まえた理由も、捕まえたのが誰かも明確でない。"}, {"t": 1827.6666666666667, "x": "それが分からないと、罪に当たるかどうか言えない。"}, {"t": 1830.5333333333333, "x": "結局は、中国の説明待ちなのね。"}, {"t": 1833.2333333333333, "x": "法務の当局が調べに乗り出すのは\n無理がある、とも言っている。"}, {"t": 1836.7666666666667, "x": "肝心の中国が口を閉ざしている、と大臣は話した。"}, {"t": 1840.25, "x": "国会会議録で伊藤律の名前が\n出るのは、この日が最後だ。"}, {"t": 1844.5666666666666, "x": "帰国のあと国会では何回くらい取り上げられたの？"}, {"t": 1847.65, "x": "会議録で数えてみた。"}, {"t": 1849.1833333333334, "x": "1980年8月27日の衆議院の法務委員会から始まる。"}, {"t": 1853.9166666666667, "x": "9月4日の決算委員会、\n10月30日の参議院の法務委員会。"}, {"t": 1858.2833333333333, "x": "11月5日の外務委員会と11月26日の法務委員会。"}, {"t": 1862.5, "x": "12月18日の参議院の法務委員会。"}, {"t": 1865.3, "x": "最後が、年明けの2月13日に\n開かれた参議院の予算委員会だ。"}, {"t": 1869.85, "x": "全部で7回なのね。"}, {"t": 1871.45, "x": "そうだ。帰国の前から数えて、半年ほどの間に7回だ。"}, {"t": 1875.45, "x": "質問したのは4つの政党の議員だった。"}, {"t": 1878.1833333333334, "x": "それでも答えは変わらなかったのね？"}, {"t": 1880.4166666666667, "x": "そうだ。承知していない。"}, {"t": 1881.8666666666666, "x": "中国側も説明していない。"}, {"t": 1883.8166666666666, "x": "本人は、話したがらない。"}, {"t": 1885.5, "x": "政府の答えはこの3つに尽きた。"}, {"t": 1887.8333333333333, "x": "7回聞いても同じ答えだったのね。"}, {"t": 1890.7333333333333, "x": "ねえ、ここまでで分かったことを整理して？"}, {"t": 1893.25, "x": "いいぞ。まず分かっていることからだ。"}, {"t": 1895.3666666666666, "x": "1950年6月30日に所在不明になった。"}, {"t": 1898.95, "x": "7月15日に逮捕状が出た。"}, {"t": 1901.1666666666667, "x": "本人の話では昭和26年9月に国を出た。"}, {"t": 1904.4333333333334, "x": "1953年9月15日、アカハタで\n党からの追放が発表された。"}, {"t": 1909.3666666666666, "x": "1980年の1月からは中国紅十字会の管理の下にいた。"}, {"t": 1913.85, "x": "8月23日に生存が確かめられ、9月3日に帰国した。"}, {"t": 1918.2666666666667, "x": "日付ははっきりしているのね。"}, {"t": 1920.15, "x": "では、分かっていないことだ。"}, {"t": 1921.9166666666667, "x": "どうやって国を出たのか。"}, {"t": 1923.4166666666667, "x": "北京で29年間どう暮らしていたのか。"}, {"t": 1926.05, "x": "スパイだったのかどうか。"}, {"t": 1927.6166666666666, "x": "一番知りたいところが全部分からないのね。"}, {"t": 1930.2666666666667, "x": "そうだ。言い分は会議録に\n残っているが、食い違ったままだ。"}, {"t": 1933.9833333333333, "x": "政府も、最後まで決めつけなかった。"}, {"t": 1936.5, "x": "それで、ここでも白黒をつけずに並べるのね。"}, {"t": 1939.45, "x": "そうだ。残っている言葉だけを並べた。"}, {"t": 1942.5833333333333, "x": "最後にもう一度9月3日の空港に戻ろう。"}, {"t": 1945.3, "x": "9分間の聞き取りで、伊藤律が\n答えたのは1つだけだった。"}, {"t": 1949.3166666666666, "x": "あの日付の一言ね。"}, {"t": 1951.0, "x": "そうだ。その1行で罪に問えるかどうかが分かれた。"}, {"t": 1954.0833333333333, "x": "場所も方法も目的も申しかねると答えた。"}, {"t": 1957.0666666666666, "x": "話せない理由があったのかしら？"}, {"t": 1959.0833333333333, "x": "それも分からない。大臣も何が\n原因かわからないと言った。"}, {"t": 1962.6, "x": "1950年の夏、党の幹部たちが次々に姿を消した。"}, {"t": 1966.85, "x": "その1人が、29年後に旅券を持たずに帰ってきた。"}, {"t": 1970.55, "x": "帰ってきても空白は消えなかったのね。"}, {"t": 1973.05, "x": "国会は何度も問い、政府は\n承知していないと答え続けた。"}, {"t": 1976.7166666666667, "x": "その問いと答えが今も会議録に残っている。"}, {"t": 1979.5666666666666, "x": "決めつけずに残っている言葉だけを見るってことね。"}, {"t": 1982.65, "x": "そうだ。それがこの事件を追うときの約束だ。"}, {"t": 1985.5166666666667, "x": "伊藤律事件は、こうして国会会議録に残っている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
