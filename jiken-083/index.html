<script>
const D={"name": "083", "file": "083_編集用", "dur": 2164.16665625, "segs": [], "subs": [{"t": 0.0, "x": "1959年5月28日、ソ連のスヴェルドロフスク州で、\n一人の検事捜査官が一通の決定書に署名した。"}, {"t": 7.783333333333333, "x": "ある事件の捜査を、ここで打ち切るという書類だ。"}, {"t": 10.65, "x": "その結論の部分には、こう書かれている。"}, {"t": 13.183333333333334, "x": "「遺体に外部からの傷も、争った形跡もないこと、"}, {"t": 16.35, "x": "グループの貴重品がすべて残っていたこと、\nおよび死因に関する法医学鑑定の結論を考慮すると、"}, {"t": 22.166666666666668, "x": "登山者たちの死因は、彼らが\n克服することのできなかった\n自然の力であったと考えるべきである」"}, {"t": 28.2, "x": "克服することのできなかった、自然の力。"}, {"t": 31.3, "x": "それが、国が出した結論だ。ただし、\nその「自然の力」が何だったのかは、\nこの決定書のどこにも書かれていない。"}, {"t": 38.71666666666667, "x": "ディアトロフ峠事件。"}, {"t": 39.93333333333333, "x": "1959年2月、ウラル山脈の北部で、スキーで\n山を歩いていた9人が、全員亡くなった事件だ。"}, {"t": 47.03333333333333, "x": "名前は聞いたことがあるわ。"}, {"t": 48.45, "x": "テントを内側から切って逃げた、っていう話よね。"}, {"t": 51.61666666666667, "x": "ああ。そこだけは、はっきりしている。"}, {"t": 53.7, "x": "切り口が内側からだということは、鑑定人が\n顕微鏡で調べて、鑑定書に書いている。"}, {"t": 59.166666666666664, "x": "分かっていないのは、なぜ切ったのかのほうだ。"}, {"t": 61.71666666666667, "x": "この事件については、本も番組も山ほどある。"}, {"t": 64.53333333333333, "x": "UFOだ、秘密兵器だ、雪男だ。"}, {"t": 67.15, "x": "日本語で読めるものも多い。だが、そのほとんどは、\n確かめられていない話をつなぎ直したものだ。"}, {"t": 73.03333333333333, "x": "だから今回は、材料を絞る。"}, {"t": 74.93333333333334, "x": "1959年にソ連が自分で作った捜査記録と、\n2020年にロシアの検察が公表した内容と、"}, {"t": 81.66666666666667, "x": "2021年にスイスの研究者が出した\n論文。この3つだけで追いかける。"}, {"t": 86.53333333333333, "x": "60年以上前のソ連の捜査記録なんて、\n読めるものなの。"}, {"t": 90.41666666666667, "x": "読める。捜査記録は全2巻、およそ400ページある。"}, {"t": 93.65, "x": "1974年に検察庁の保管庫から\n州の公文書館に移された。そして2012年に、"}, {"t": 99.83333333333333, "x": "遺族らの財団が公文書館から正式な写しを\n受け取り、2013年に本として公開した。"}, {"t": 105.81666666666666, "x": "いま、この事件の鑑定書も、検死の結論も、事件を\n閉じた決定書も、ページ番号つきで誰でも読める。"}, {"t": 112.5, "x": "先に断っておく。この動画では、\n9人の死因を決めつけない。"}, {"t": 116.26666666666667, "x": "犯人がいたとも言わない。"}, {"t": 117.73333333333333, "x": "事実と、私の見方は分けて話す。"}, {"t": 121.03333333333333, "x": "まず、山に入った人たちの話からする。"}, {"t": 123.86666666666666, "x": "出発したのは10人だ。ほとんどが、"}, {"t": 126.16666666666667, "x": "スヴェルドロフスクにある\nウラル工科大学の学生と、その卒業生だった。"}, {"t": 130.71666666666667, "x": "隊長はイーゴリ・ディアトロフさん、23歳。"}, {"t": 133.36666666666667, "x": "大学5年生で、無線機を自作するような学生だった。\nこの事件が彼の名前で呼ばれているのは、"}, {"t": 139.15, "x": "隊長だったからだ。"}, {"t": 140.6, "x": "ジナイダ・コルモゴロワさん、22歳。"}, {"t": 142.93333333333334, "x": "大学5年生。リュドミラ・\nドゥビニナさん、20歳。大学4年生。"}, {"t": 147.43333333333334, "x": "アレクサンドル・コレヴァトフさん、24歳。"}, {"t": 150.03333333333333, "x": "ユーリ・ドロシェンコさん、21歳。"}, {"t": 152.2, "x": "どちらも大学4年生だ。"}, {"t": 154.08333333333334, "x": "ルステム・スロボディンさん、23歳。"}, {"t": 156.45, "x": "ユーリ・クリヴォニシチェンコさん、23歳。"}, {"t": 159.08333333333334, "x": "ニコライ・チボー・ブリニョールさん、23歳。\nこの3人は大学を出て、もう技師として働いていた。"}, {"t": 165.38333333333333, "x": "みんな若いのね。"}, {"t": 166.61666666666667, "x": "ああ。そして、一人だけ年が離れている人がいる。"}, {"t": 169.88333333333333, "x": "セミョン・ゾロタリョフさん、1921年生まれ。"}, {"t": 173.01666666666668, "x": "観光基地でインストラクターをしていた人で、\n戦争に行っている世代だ。ほかの9人より、"}, {"t": 178.23333333333332, "x": "15歳から18歳ほど上になる。"}, {"t": 180.6, "x": "そして10人目が、ユーリ・\nユーディンさん、21歳。大学4年生だ。"}, {"t": 185.11666666666667, "x": "目的地はオトルテン山。"}, {"t": 186.61666666666667, "x": "ウラル山脈の北のほうにある山だ。"}, {"t": 188.75, "x": "行程はおよそ300キロ。"}, {"t": 190.3, "x": "当時の区分でいちばん上の等級に\nあたる、重い山行だった。"}, {"t": 194.11666666666667, "x": "300キロ。冬の山を。"}, {"t": 195.98333333333332, "x": "そうだ。全員がその前の等級を持っていて、\nこの山行を終えれば最上級の資格が"}, {"t": 200.76666666666668, "x": "取れる。そういう挑戦だった。"}, {"t": 202.71666666666667, "x": "1959年1月23日、10人はルートブックを\n受け取り、スヴェルドロフスクを列車で出発した。"}, {"t": 210.05, "x": "1月24日、セロフに着いた。"}, {"t": 212.23333333333332, "x": "学校に泊めてもらい、その夜イヴデリへ向かう。"}, {"t": 215.05, "x": "1月25日、イヴデリからバスで、\nヴィジャイという集落に入った。"}, {"t": 219.11666666666667, "x": "午後2時ごろだ。ここが\n人の住んでいる最後の場所になる。"}, {"t": 222.6, "x": "1月26日、トラックの荷台に乗って、\n第41番地区という林業の作業場へ。"}, {"t": 227.86666666666667, "x": "着いたのは夕方4時半ごろで、\n作業員の宿舎に泊まっている。"}, {"t": 231.75, "x": "1月27日、ここからスキーに履き替えた。"}, {"t": 234.71666666666667, "x": "無人になった第2北部鉱山の跡へ\n入り、夜11時ごろに着いた。"}, {"t": 239.1, "x": "もう人はいないのね。"}, {"t": 240.53333333333333, "x": "ああ。ここから先は、\nマンシの人たちの猟の道しかない。"}, {"t": 244.05, "x": "そして1月28日。ここで、10人が9人になる。"}, {"t": 247.83333333333334, "x": "ユーリ・ユーディンが、\n脚の痛みで先へ進めなくなった。"}, {"t": 251.1, "x": "前から持っていた持病が出たんだ。"}, {"t": 253.25, "x": "彼は荷物を隊に渡し、来た道を引き返した。"}, {"t": 256.1666666666667, "x": "馬車に乗せてもらって、ヴィジャイへ戻っている。"}, {"t": 258.98333333333335, "x": "その人だけ、助かったってこと。"}, {"t": 261.3666666666667, "x": "そういうことになる。"}, {"t": 262.4, "x": "ユーディンは、この事件のただ\n一人の生存者と呼ばれることになった。"}, {"t": 266.48333333333335, "x": "彼は2013年に75歳で亡くなるまで、\nこの事件のことを語り続けた。"}, {"t": 271.4, "x": "後年、別れたときの写真が残っている。"}, {"t": 273.8666666666667, "x": "仲間の一人と抱き合っている、あの1月28日の写真だ。"}, {"t": 278.01666666666665, "x": "ユーディンが書いていた日記も、このあと\n捜査記録に綴じられることになる。"}, {"t": 281.96666666666664, "x": "隊の共同日記と一緒に、いま読める形で残っている。"}, {"t": 285.6166666666667, "x": "自分だけが途中で降りた日のことも、書いてあるのね。"}, {"t": 288.9, "x": "ああ。"}, {"t": 289.31666666666666, "x": "残った9人は、その日のうちに出発した。"}, {"t": 292.1166666666667, "x": "最初の夜は、ロズヴァ川の岸でテントを張っている。"}, {"t": 295.9, "x": "ここから2月1日までの動きは、隊が自分たちで\n書いた日記と、カメラのフィルムから分かっている。"}, {"t": 301.8666666666667, "x": "日記も残ってるの。"}, {"t": 303.35, "x": "残っている。隊の共同日記が1冊と、\nコルモゴロワ、ドゥビニナ、スロボディン、"}, {"t": 307.98333333333335, "x": "ユーディンの個人の日記。"}, {"t": 309.43333333333334, "x": "全部で6冊が捜査記録に綴じられた。"}, {"t": 312.1, "x": "カメラも7台分のフィルムが残った。"}, {"t": 314.26666666666665, "x": "行程の写真がそのまま残っているんだ。"}, {"t": 316.75, "x": "1月29日。アウスピヤ川に沿って、\nマンシの人たちの道をたどっている。"}, {"t": 321.55, "x": "1月30日。今度はトナカイの橇の跡に\n沿って、同じ川を上流へ進んだ。"}, {"t": 326.65, "x": "1月31日。ホラート・シャフイルという\n山に近づき、いったん登ろうとした。だが\n風が強くて、その日は断念している。"}, {"t": 334.06666666666666, "x": "谷へ下りて、アウスピヤ川の岸でもう一泊した。"}, {"t": 337.28333333333336, "x": "ホラート・シャフイル。"}, {"t": 338.21666666666664, "x": "聞き慣れない名前ね。"}, {"t": 339.73333333333335, "x": "マンシ語の地名だ。「死の山」と\n訳されることが多い。"}, {"t": 342.95, "x": "ただ、この名前についてはよく誤解される。もともとは"}, {"t": 346.1333333333333, "x": "「獲物がいない山」という意味だったとされていて、\n「死」にあたる言葉を含む地名は、"}, {"t": 350.85, "x": "マンシの土地にほかにも3つ以上ある。"}, {"t": 353.23333333333335, "x": "9人が死ぬことを予言していた\n名前ではない。先に言っておく。"}, {"t": 356.8833333333333, "x": "ちなみに目的地のオトルテン山のほうも、マンシ語では"}, {"t": 360.05, "x": "「そこへ行くな」という意味だと\n言われている。だが、これも地名の話でしかない。"}, {"t": 365.26666666666665, "x": "2月1日。この日が、9人の最後の一日になる。"}, {"t": 368.85, "x": "朝、彼らはまず「ラバズ」と呼ばれる食料庫を作った。"}, {"t": 372.53333333333336, "x": "食料庫。"}, {"t": 373.5, "x": "雪の中に穴を掘って、荷物を置いていくんだ。"}, {"t": 376.21666666666664, "x": "オトルテン山を往復するあいだ、\n要らないものを預けておく。"}, {"t": 379.45, "x": "帰りにここへ寄って回収する。"}, {"t": 381.48333333333335, "x": "置いていったのは、食料のほかに、\n予備のスキーが1組、予備の登山靴が2足、"}, {"t": 386.3, "x": "救急箱、そしてマンドリンだ。"}, {"t": 388.5833333333333, "x": "マンドリン。山に持ってきてたのね。"}, {"t": 390.8666666666667, "x": "持ってきていた。日記には、夜に\nそれを弾いていたことが書かれている。"}, {"t": 394.9166666666667, "x": "荷を軽くした9人は、そこから峠へ登っていった。"}, {"t": 398.18333333333334, "x": "そして、フィルムに残った写真から、午後5時ごろ、"}, {"t": 401.1666666666667, "x": "ホラート・シャフイルの東側の斜面に\nテントを張ったと判定されている。"}, {"t": 405.25, "x": "ここが、あとで問題になる。"}, {"t": 407.18333333333334, "x": "どうして。"}, {"t": 408.03333333333336, "x": "森から出た、何もない斜面だからだ。"}, {"t": 410.3333333333333, "x": "1キロ半ほど下れば森があって、風も\nしのげるし薪もある。そこまで下りずに、"}, {"t": 415.1, "x": "吹きさらしの斜面で泊まっている。"}, {"t": 417.21666666666664, "x": "テントを水平にするために、斜面を\n雪ごと掘って、そこに張っていた。"}, {"t": 421.45, "x": "この「斜面を掘った」という一点が、\n60年後に持ち出されることになる。"}, {"t": 426.06666666666666, "x": "それから、もう一つ。"}, {"t": 427.45, "x": "あとで事件を閉じる決定書は、\nこの日の隊長の判断を2点、名指しで指摘している。"}, {"t": 432.75, "x": "登りを始めたのが\n午後3時になってからだったこと。そして下りで、"}, {"t": 436.65, "x": "進路を500メートルから600メートル左へ外したこと。"}, {"t": 440.26666666666665, "x": "国の書類が、そこは間違いだったと書いたのね。"}, {"t": 443.3666666666667, "x": "書いた。山の判断については、はっきり書いている。"}, {"t": 446.4, "x": "書けなかったのは、そのあとに起きたことのほうだ。"}, {"t": 449.96666666666664, "x": "テントの中から見つかったもので、私が\nいちばん引っかかったのは、一枚の紙だ。"}, {"t": 454.95, "x": "手書きの壁新聞だ。題は「夕刊オトルテン」。"}, {"t": 457.76666666666665, "x": "第1号、日付は1959年2月1日と入っている。"}, {"t": 462.15, "x": "壁新聞って、学校でやるあれ。"}, {"t": 464.4, "x": "そうだ。学生がふざけて作る、あれだ。"}, {"t": 466.8666666666667, "x": "書いてあるのは冗談ばかりだった。"}, {"t": 468.8666666666667, "x": "「哲学ゼミナール『愛と観光』を\n毎日テント内で開催」。"}, {"t": 472.4166666666667, "x": "講師の名前のところには、隊員の名前が\nふざけた肩書きつきで並べてある。"}, {"t": 477.03333333333336, "x": "北ウラルに雪男はいるのか、という\n話題も、笑い話として載っている。"}, {"t": 481.45, "x": "見出しの一つはこうだ。"}, {"t": 482.8, "x": "「観光客の出生率を上げて、\n第21回党大会を迎えよう」。"}, {"t": 487.05, "x": "党大会。時代ね。"}, {"t": 488.65, "x": "この山行そのものが、共産党の第21回大会に\nちなんで企画されたものだった。"}, {"t": 493.76666666666665, "x": "当時のソ連では、そういうやり方が普通だったんだ。"}, {"t": 497.0, "x": "発行元のところには、\nこの隊の労働組合組織の機関紙、と書いてある。"}, {"t": 501.46666666666664, "x": "全部ふざけている。"}, {"t": 502.8833333333333, "x": "雪男の話、自分たちで書いてたのね。"}, {"t": 505.81666666666666, "x": "書いていた。あとでこの事件に"}, {"t": 507.5833333333333, "x": "雪男の説がくっつくのは、たぶんこの紙が\n発見されたことと無関係じゃない。"}, {"t": 512.35, "x": "だが、この紙が本当に\n意味しているのは、そこじゃない。"}, {"t": 515.6333333333333, "x": "2月1日の夕方、あの斜面のテントの中で、9人は\n冗談を書く余裕があった。それが分かるということだ。"}, {"t": 522.3333333333334, "x": "この紙は1959年2月26日、日記や\n所持品と一緒にテントの中から見つかり、"}, {"t": 528.25, "x": "刑事事件の記録に綴じられた。"}, {"t": 530.1666666666666, "x": "スキャンされた原本が、今でも見られる。"}, {"t": 532.75, "x": "9人が生きているあいだに残した、最後の紙だ。"}, {"t": 536.45, "x": "帰着の予定日は2月12日だった。"}, {"t": 538.8666666666667, "x": "だが、この予定日は、隊の中でも\nはっきり決まっていなかったらしい。"}, {"t": 542.6666666666666, "x": "山行は遅れることもある。"}, {"t": 544.2166666666667, "x": "数日の遅れで騒ぐ人はいなかった。"}, {"t": 546.7666666666667, "x": "それで、いつ気づいたの。"}, {"t": 548.4666666666667, "x": "本格的に動き出したのは2月20日ごろだ。"}, {"t": 551.25, "x": "家族が大学に押しかけて、捜索を要求した。"}, {"t": 554.5166666666667, "x": "ところが、ここで問題が起きる。"}, {"t": 556.3833333333333, "x": "9人がどこを歩いているのか、大学の側が\n正確に把握していなかったんだ。"}, {"t": 561.1333333333333, "x": "2月17日から19日にかけて、まず\nルートを復元する作業をしている。"}, {"t": 565.5833333333334, "x": "どの川をたどったのかを、\n残された書類から割り出した。"}, {"t": 569.05, "x": "2月20日、飛行機での偵察のために\nイヴデリへ人を送った。"}, {"t": 572.9, "x": "そこから先は早い。2月21日から25日にかけて、\n学生の隊がいくつも編成されて、現地へ投入された。"}, {"t": 580.15, "x": "スロプツォフの隊、\nグレベンニクの隊、アクセリロドの隊。"}, {"t": 583.6333333333333, "x": "さらに、イヴデリの収容所の看守隊、内務省の職員、\nそして地元のマンシの猟師たちも加わった。"}, {"t": 589.9166666666666, "x": "ずいぶん大きくなったのね。"}, {"t": 591.6333333333333, "x": "ああ。飛行機が飛び、\nヘリコプターが人と物資を運んだ。"}, {"t": 594.9666666666667, "x": "国が本気で人を出した捜索だった。"}, {"t": 597.5333333333333, "x": "公式の捜索の指揮を執ったのは軍の大佐だった。"}, {"t": 600.5, "x": "国の側が現場を仕切る形になっている。"}, {"t": 603.1666666666666, "x": "ちなみに、このときに作られた書類も、\nそのまま捜査記録に綴じられている。"}, {"t": 607.6, "x": "出発前に提出されたルートの書類、捜索中に\nやりとりされた無線の電報、現場から送られた報告。"}, {"t": 614.2833333333333, "x": "捜索の記録まで残ってるのね。"}, {"t": 616.5166666666667, "x": "残っている。だからこの事件は、"}, {"t": 618.4166666666666, "x": "9人が消えてから見つかるまでの20日間についても、\n日付を追って確かめられる。"}, {"t": 623.9, "x": "1959年2月26日。"}, {"t": 626.4166666666666, "x": "スロプツォフの隊が、\nホラート・シャフイルの斜面でテントを見つけた。"}, {"t": 630.25, "x": "見つけたのは、ボリス・スロプツォフさんと\nミハイル・シャラヴィンさんの2人だ。"}, {"t": 634.6833333333333, "x": "シャラヴィンさんは、そのときの様子をこう語っている。"}, {"t": 637.6, "x": "「テントは半分倒れ、雪をかぶっていた。"}, {"t": 639.9666666666667, "x": "中は空で、グループの持ち物と\n靴はすべて残されていた」"}, {"t": 643.7833333333333, "x": "靴も。"}, {"t": 644.55, "x": "靴も、上着も、斧も、食料も、カメラも、\n日記も、全部そのまま入っていた。"}, {"t": 650.1166666666667, "x": "逃げるときに何も持たなかったのね。"}, {"t": 652.45, "x": "持っていない。というより、持つ\n時間が無かったように見える。"}, {"t": 655.75, "x": "あとで行われた検死では、9人は最後の食事から\n6時間か8時間後に亡くなったと判定されている。"}, {"t": 661.8333333333334, "x": "テントを張ったのが夕方5時ごろだから、事件が\n起きたのはその日の夜ということになる。"}, {"t": 666.95, "x": "そして、屋根にあたる部分の右側に、\n大きな裂け目が入っていた。"}, {"t": 671.0333333333333, "x": "発見した2人は、この時点では何が起きたのか"}, {"t": 673.9666666666667, "x": "分からない。ただ、テントの中に\n誰もいないことだけが分かった。"}, {"t": 677.6666666666666, "x": "この日のうちに、イヴデリ市のテンパロフ検事が\n現場へ入り、刑事事件として立件している。"}, {"t": 682.85, "x": "事件を開く決定書の日付は、1959年2月26日だ。"}, {"t": 687.8833333333333, "x": "それはつまり、犯罪かもしれないと思ったってこと。"}, {"t": 691.0833333333334, "x": "そう考えるのが普通だろうな。"}, {"t": 692.7833333333333, "x": "9人が装備を全部置いて、テントを\n破って消えているんだから。"}, {"t": 696.4666666666667, "x": "ただ、このあと出てくる証拠は、\n全部その逆を指すことになる。"}, {"t": 700.85, "x": "テントのまわりの雪に、足あとが残っていた。"}, {"t": 703.6166666666667, "x": "捜査の記録では、8人分ないし9人分。\nその足あとは、テントから斜面を下る方向へ、"}, {"t": 708.9333333333333, "x": "一列になって続いていた。"}, {"t": 711.2, "x": "500メートルほど下ったところで、新しく\n降った雪に埋もれて見えなくなっている。"}, {"t": 716.0333333333333, "x": "全員が同じ方向に下りていったのね。"}, {"t": 718.4666666666667, "x": "そうだ。そして、ここが不可解なところなんだが、\n足あとの形が普通じゃない。"}, {"t": 723.2333333333333, "x": "靴下だけの足あと、素足の足あと、片方だけ靴を\n履いた足あと。そういうものが混じっていた。"}, {"t": 729.2333333333333, "x": "氷点下の斜面を、靴を置いたまま\n下りていったということになる。"}, {"t": 732.9333333333333, "x": "どうしてそんなことに。"}, {"t": 734.4166666666666, "x": "分からない。それが、この事件の中心にある問いだ。"}, {"t": 737.6, "x": "もう一つ、捜索に加わった人たちが\n揃って言っていることがある。"}, {"t": 741.6166666666667, "x": "足あとの形が、\n走ったものではなかった、ということだ。"}, {"t": 745.0666666666667, "x": "歩幅が乱れていない。"}, {"t": 746.3666666666667, "x": "普通に歩いたときの間隔で並んでいた。"}, {"t": 749.0333333333333, "x": "パニックで散らばったのではなく、9人が\nまとまって、同じ方向へ、歩いて下りていった。"}, {"t": 754.0666666666667, "x": "雪の上に残っていたのは、そういう形だった。"}, {"t": 757.2166666666667, "x": "もう一つ。この足あとは、そうとう長く残っていた。"}, {"t": 760.5166666666667, "x": "のちに雪崩説を検討した研究者たちが\n指摘しているのが、まさにそこだ。"}, {"t": 765.0333333333333, "x": "捜索隊が現場に入ったのは事件から\n3週間以上あとなのに、足あとが\nまだ見える状態で残っていた。"}, {"t": 771.4, "x": "雪崩が起きたなら、埋まってるはずよね。"}, {"t": 773.9166666666666, "x": "そういう反論になる。ここは、あとでもう\n一度出てくるから覚えておいてほしい。"}, {"t": 778.2166666666667, "x": "それから、争った跡はどこにもなかった。\nほかの誰かの足あとも見つかっていない。"}, {"t": 783.1, "x": "捜査ではマンシの人たちが疑われて、\n何人も取り調べを受けている。だが、"}, {"t": 787.5666666666667, "x": "他人の足あとが一つも無い以上、\n外から誰かが来た形にはならなかった。"}, {"t": 792.9166666666666, "x": "足あとをたどった先、テントから北東へおよそ1.5キロ。"}, {"t": 796.3, "x": "大きな杉の木の下に、焚き火の跡があった。"}, {"t": 799.25, "x": "その場所で、2月26日から27日にかけて、\nクリヴォニシチェンコとドロシェンコが見つかった。"}, {"t": 805.4166666666666, "x": "2人とも、上着も靴も身につけていなかった。"}, {"t": 808.1666666666666, "x": "検死の結論は、どちらも凍死だ。"}, {"t": 810.65, "x": "火は、つけられたのね。"}, {"t": 812.2833333333333, "x": "つけられていた。だが長くはもたなかった。"}, {"t": 814.8666666666667, "x": "そして2月27日、杉の木からテントのほうへ戻る\n途中の斜面で、ディアトロフが見つかった。"}, {"t": 820.6, "x": "杉の木から300メートルほど上だ。"}, {"t": 823.0333333333333, "x": "同じ日の夕方、そこからさらに330\nメートル上で、コルモゴロワが見つかった。"}, {"t": 828.1666666666666, "x": "3月5日には、ゾンデ棒を突き刺して探していた隊が、"}, {"t": 831.55, "x": "雪の15センチから20センチ下でスロボディンを\n見つけた。この3人も、同じ斜面の、"}, {"t": 836.8333333333334, "x": "同じ線の上にいた。"}, {"t": 838.3833333333333, "x": "3人とも、テントのほうを向いてたってこと。"}, {"t": 841.1333333333333, "x": "そうだ。下から上へ、テントへ戻ろうとする形だった。"}, {"t": 844.5666666666667, "x": "この3人の死因も、検死では凍死とされている。"}, {"t": 847.4, "x": "スロボディンさんには前頭部の骨にひびがあったが、\nそれが死につながる傷ではないと判定された。"}, {"t": 853.0, "x": "ここまでで5人。全員、凍死だ。"}, {"t": 855.1666666666666, "x": "この時点での捜査の見立ては、こうなる。"}, {"t": 857.45, "x": "9人はテントを出て、下の森まで行き、\nそこから戻ろうとして、戻りきれなかった。"}, {"t": 863.2666666666667, "x": "3月2日、捜索隊は、9人が2月1日に\n作ったあの食料庫を見つけた。"}, {"t": 868.5666666666667, "x": "テントから300メートルから400\nメートルほど離れた、森の中にあった。"}, {"t": 873.0166666666667, "x": "中身は、置いていったときのままだった。"}, {"t": 875.25, "x": "食料も、予備のスキーも、予備の登山靴2足も、\n救急箱も、マンドリンも、手つかずで残っていた。"}, {"t": 881.9333333333333, "x": "誰も、取りに来てないのね。"}, {"t": 883.85, "x": "来ていない。これは、地味だが重い事実だ。"}, {"t": 886.5333333333333, "x": "もし外から誰かが襲ってきて、9人が\nテントから逃げたのだとしよう。"}, {"t": 890.5833333333334, "x": "逃げるなら、装備のある場所へ行くのが当たり前だ。"}, {"t": 893.3666666666667, "x": "予備の靴が2足もあるんだからな。"}, {"t": 895.65, "x": "それに、その食料庫は森の中にある。"}, {"t": 898.0333333333333, "x": "風がしのげる。火も焚ける。"}, {"t": 899.9, "x": "だが、9人はそこへ行っていない。"}, {"t": 901.9666666666667, "x": "食料庫があったのは、\n峠の手前、アウスピヤ川の側だ。"}, {"t": 905.4, "x": "9人が下りたのは、その反対側の斜面だった。"}, {"t": 908.6666666666666, "x": "来た道を戻れば、装備があったのね。"}, {"t": 911.15, "x": "あった。だが9人は、来た\n道ではないほうへ、まとまって下りていった。"}, {"t": 915.2666666666667, "x": "もう一つ。1959年の捜査で、"}, {"t": 918.0, "x": "グループの貴重品はすべてテントの中に\n残っていたことが確認されている。"}, {"t": 922.2333333333333, "x": "金も、時計も、カメラも。"}, {"t": 924.3, "x": "物取りではない。争った跡もない。"}, {"t": 926.3666666666667, "x": "他人の足あともない。"}, {"t": 927.7666666666667, "x": "この事件が、犯罪としては早い段階で\n行き止まりになったのは、そういう理由だ。"}, {"t": 933.2333333333333, "x": "ここからが、この回の芯だ。"}, {"t": 935.1333333333333, "x": "1959年4月16日、鑑定人が\n一通の鑑定書を出している。"}, {"t": 939.9, "x": "第199号。テントの布を調べたものだ。"}, {"t": 943.1166666666667, "x": "鑑定したのはゲンリエッタ・チュルキナ鑑定人だ。"}, {"t": 946.0, "x": "1954年から鑑定の仕事をしている人だった。"}, {"t": 949.7166666666667, "x": "調べたのは、屋根にあたる\n天幕の右斜面に入っていた損傷だ。"}, {"t": 953.7333333333333, "x": "結論はこう書かれている。"}, {"t": 955.3166666666667, "x": "「長さおよそ32センチ、89センチ、"}, {"t": 958.05, "x": "42センチの3つの損傷は、"}, {"t": 960.1, "x": "何らかの鋭い凶器、すなわちナイフに\nよって作られたものであり、"}, {"t": 963.9, "x": "切創である。これらの切り口はすべて、\nテントの内側から入れられている」"}, {"t": 968.35, "x": "内側から。はっきりそう書いてあるのね。"}, {"t": 970.9166666666666, "x": "書いてある。しかも、この判定には根拠がある。"}, {"t": 973.8333333333334, "x": "チュルキナは布を顕微鏡で見ている。"}, {"t": 975.7666666666667, "x": "内側の面にだけ、細かい刺し跡と、繊維が切れた\n跡と、非常に細い擦り傷が残っていた。"}, {"t": 981.6, "x": "刃が内側から布に当たったときの痕だ。"}, {"t": 984.0333333333333, "x": "外側にはそれが無い。"}, {"t": 985.6333333333333, "x": "3つの切り口のほかに、2.2\nセンチの小さな刺し傷も一つあった。"}, {"t": 990.0166666666667, "x": "もう一つ、この鑑定書で\n大事なのは、区別のしかただ。"}, {"t": 993.5833333333334, "x": "テントには、この3つのほかにも"}, {"t": 995.0666666666667, "x": "損傷がたくさんあった。だがチュルキナは、\nそれらを「裂けたもの」と判定して、"}, {"t": 1000.15, "x": "切り口とは別に扱っている。"}, {"t": 1002.2333333333333, "x": "刃物で切られたのは3か所だけ。"}, {"t": 1004.15, "x": "残りは、風や雪や、倒れたときに裂けたものだ、と。"}, {"t": 1007.8166666666667, "x": "ちゃんと分けて調べてるのね。"}, {"t": 1009.6666666666666, "x": "分けている。1959年の捜査は、"}, {"t": 1012.35, "x": "あとの時代に「素人の水準だった」と"}, {"t": 1014.7333333333333, "x": "批判されているんだが、この鑑定だけは、\nいま読んでも手続きがはっきりしている。"}, {"t": 1019.6666666666666, "x": "そしてこの89センチというのが、いちばん大きい。"}, {"t": 1022.7, "x": "人が通れる大きさだ。"}, {"t": 1024.25, "x": "つまり、誰かが外からテントを\n裂いて引きずり出したのではない。"}, {"t": 1027.7, "x": "中にいた人間が、中からナイフを\n入れて、布を切って出た。"}, {"t": 1031.5833333333333, "x": "入口があるのに。"}, {"t": 1032.85, "x": "あるんだ。テントには普通に出入り口がある。\nそれを使わずに、布を切って出ている。"}, {"t": 1037.5833333333333, "x": "私は、この事件で確実なことは、\n突き詰めるとここだけだと思っている。"}, {"t": 1042.0166666666667, "x": "あとは全部、説明の候補だ。"}, {"t": 1044.75, "x": "残る4人は、長いこと見つからなかった。"}, {"t": 1047.4, "x": "見つかったのは、雪が解け始めた5月だ。"}, {"t": 1050.0333333333333, "x": "1959年5月4日から5日にかけて。"}, {"t": 1053.35, "x": "きっかけは、捜索に加わっていた\nマンシの人たちの気づきだった。"}, {"t": 1057.1666666666667, "x": "杉の木と、70メートルほど離れた沢のあいだで、"}, {"t": 1060.3, "x": "雪の下から木の枝と布の切れ端が\n出てきているのに気づき、掘ってみようと言った。"}, {"t": 1065.35, "x": "掘って出てきたのは、枝で作った敷物だった。"}, {"t": 1068.45, "x": "敷物。"}, {"t": 1069.35, "x": "杉の近くで切った若いモミの木14本と、\nシラカバ1本。その先端を並べて、"}, {"t": 1074.35, "x": "3平方メートルほどの敷物にしてある。"}, {"t": 1076.8, "x": "雪の2.5メートル下にあった。"}, {"t": 1079.0833333333333, "x": "寒さをしのぐために、誰かが作ったものだ。"}, {"t": 1081.8833333333334, "x": "そしてその近く、沢の中から、ドゥビニナ、\nチボー・ブリニョール、コレヴァトフ、"}, {"t": 1086.55, "x": "ゾロタリョフの4人が見つかった。"}, {"t": 1088.4, "x": "雪の2メートルから2.5メートル下だった。"}, {"t": 1091.2833333333333, "x": "ここで、それまでの前提が崩れる。"}, {"t": 1093.4833333333333, "x": "この4人のうち3人に、大きな外傷があった。"}, {"t": 1096.4166666666667, "x": "検死の結論は、ドゥビニナが胸の骨折にともなう出血、"}, {"t": 1100.0166666666667, "x": "ゾロタリョフが右側の多発肋骨骨折、\nチボー・ブリニョールが頭蓋骨の陥没骨折。"}, {"t": 1105.1, "x": "コレヴァトフの死因は凍死とされた。"}, {"t": 1107.6166666666666, "x": "さっきの5人とは、全然違うのね。"}, {"t": 1110.1166666666666, "x": "違う。だから、この事件の話は\nここで一気にややこしくなる。"}, {"t": 1113.9666666666667, "x": "検死をしたヴォズロジデンヌイ医師は、\n取り調べでこう述べている。この外傷は、"}, {"t": 1118.1833333333334, "x": "自分の身長から転んだ程度では生じない。"}, {"t": 1120.7333333333333, "x": "明らかにそれを超える力による、と。"}, {"t": 1123.2, "x": "例として挙げたのが、高速で\n走る自動車の衝突と、爆風だ。"}, {"t": 1127.3333333333333, "x": "そして、彼はこうも言っている。これほどの力が\n加わっているのに、それをやったのが人間の手だとは"}, {"t": 1132.9166666666667, "x": "考えにくい、と。"}, {"t": 1134.2333333333333, "x": "なお、この判定には後年、異論も出ている。"}, {"t": 1136.8, "x": "別の法医学者は、スロボディンさんと\nチボー・ブリニョールさんの頭の損傷は"}, {"t": 1141.1666666666667, "x": "生きているあいだのものではなく、\n死んだあとに生じたものだとしている。"}, {"t": 1144.9833333333333, "x": "1959年の捜査そのものを、低い\n水準のものだったと評価する専門家もいる。"}, {"t": 1151.1, "x": "5月に見つかった4人については、\nもう一つ検査が行われている。"}, {"t": 1155.15, "x": "1959年5月18日から27日にかけて、\nスヴェルドロフスク市の主任放射線医、"}, {"t": 1161.2333333333333, "x": "レヴァショフ医師が、衣服と組織の放射能を測った。"}, {"t": 1164.65, "x": "放射線。なんでそんなものを測ったの。"}, {"t": 1167.1833333333334, "x": "記録には理由が書かれていない。"}, {"t": 1168.8666666666666, "x": "検事捜査官が指示したことだけが残っている。"}, {"t": 1171.7833333333333, "x": "数字を言う。衣服は全般に、"}, {"t": 1173.55, "x": "周りの環境より毎分200から300\nカウント高かった。ある一着のセーターは、"}, {"t": 1178.4166666666667, "x": "150平方センチあたり毎分9900カウント。"}, {"t": 1181.65, "x": "別の一点は5600カウントだった。"}, {"t": 1184.55, "x": "一方で、組織のほうの数値は、\n1キログラムあたり10億分の0.\n4から3.8キュリーの範囲だ。"}, {"t": 1190.75, "x": "鑑定人の結論はこうだ。"}, {"t": 1192.3666666666666, "x": "組織の放射能は「自然のレベルの範囲内であり、"}, {"t": 1195.3666666666666, "x": "カリウム40という同位体の存在に\nよるもの」。つまり普通だ。"}, {"t": 1199.15, "x": "だが衣服については「わずかに\n過剰な量の放射性物質」があり、\nベータ線を出していた、と書いている。"}, {"t": 1205.4, "x": "衣服だけ高かったのね。"}, {"t": 1207.15, "x": "そうだ。そして、ここが大事なんだが、\nこの鑑定書は、なぜ高いのかを書いていない。"}, {"t": 1212.2333333333333, "x": "原因は特定されていない。"}, {"t": 1213.7666666666667, "x": "特定されないまま、数字だけが記録に残った。"}, {"t": 1216.9166666666667, "x": "それに、測られたのは5月に見つかった4人だけだ。"}, {"t": 1220.0, "x": "2月と3月に見つかった5人は、\nこの検査を受けていない。"}, {"t": 1223.8, "x": "じゃあ、9人全員が高かったのか\nどうかも、分からないのね。"}, {"t": 1227.5666666666666, "x": "分からない。記録に残っているのは、\n4人分の数字だけだ。"}, {"t": 1231.2333333333333, "x": "この「衣服から放射線」という一行が、あとで\n核実験だの秘密兵器だのという話に使われていく。"}, {"t": 1237.65, "x": "だが、鑑定書が言っているのは、わずかに\n過剰だった、というところまでだ。それ以上のことは"}, {"t": 1242.8666666666666, "x": "書いていない。私もそれ以上は言わない。"}, {"t": 1245.8833333333334, "x": "1959年5月28日。"}, {"t": 1248.4166666666667, "x": "冒頭に出した、あの決定書だ。"}, {"t": 1250.6, "x": "作ったのはレフ・イワノフ検事。"}, {"t": 1252.5166666666667, "x": "スヴェルドロフスク州のクリノフ検事が\n承認し、捜査部の副部長が合意している。"}, {"t": 1257.4166666666667, "x": "結論は、さっき読んだとおりだ。"}, {"t": 1259.3333333333333, "x": "「登山者たちの死因は、彼らが\n克服することのできなかった自然の力であった」。"}, {"t": 1264.3, "x": "犯罪の事実はない。だから事件は\n終わりだ。そういう決定だった。"}, {"t": 1268.4166666666667, "x": "その「自然の力」が何なのかは、\nやっぱり書いてないのね。"}, {"t": 1272.4, "x": "書いていない。そして、\n書いていないことは、ほかにもある。"}, {"t": 1275.75, "x": "この決定書には、こういう一行もある。"}, {"t": 1278.0, "x": "テントは、全員によって、\n突然、同時に放棄された、と。"}, {"t": 1281.9666666666667, "x": "その原因は特定されていない、とも書いてある。"}, {"t": 1284.75, "x": "国自身が、「なぜ出たのかは分からない」と\n書いたまま、事件を閉じたんだ。"}, {"t": 1289.1833333333334, "x": "さっき言ったとおり、この決定書は\n隊長の山の判断については\n2点、はっきり指摘している。"}, {"t": 1294.4833333333333, "x": "登り始めた時刻と、進路のずれだ。"}, {"t": 1297.1, "x": "山の判断のミスは書けるのに、テントを\n出た理由だけは書けなかった。"}, {"t": 1301.2666666666667, "x": "日付を見ると、ずいぶん早いのね。"}, {"t": 1303.55, "x": "気づいたか。最後の4人が見つかったのが\n5月5日だ。この決定書は5月28日。"}, {"t": 1308.9333333333334, "x": "23日しかたっていない。"}, {"t": 1310.8666666666666, "x": "検死の鑑定も、放射線の鑑定も、\n5月の下旬に出ている。それを\n受け取って、その月のうちに閉じている。"}, {"t": 1317.5833333333333, "x": "記録はこのあと特別保管に回され、\n1974年に州の公文書館へ移された。"}, {"t": 1323.2666666666667, "x": "そこから40年近く、ほとんど\n誰も読めない状態が続いた。"}, {"t": 1327.7666666666667, "x": "ここで一つ、公式の記録ではない話をする。だから、\nそういうものとして聞いてほしい。"}, {"t": 1333.15, "x": "1990年11月、カザフスタンのクスタナイという\n町の地方紙に、二回に分けて記事が載った。"}, {"t": 1339.3666666666666, "x": "題は「火の玉の謎」。"}, {"t": 1341.1, "x": "書いたのは、レフ・イワノフだ。"}, {"t": 1342.9333333333334, "x": "31年前にあの決定書を書いた、その本人だ。"}, {"t": 1346.5333333333333, "x": "捜査した人が、自分で書いたの。"}, {"t": 1348.9166666666667, "x": "書いた。ソ連が終わりかけていた時期で、\nそれまで言えなかったことを言う人が増えていた。"}, {"t": 1353.9, "x": "イワノフは、報告に行ったときに州の党の幹部から\n受けた指示を、こう書いている。"}, {"t": 1358.4166666666667, "x": "「すべてを機密にし、封をして、\n特別部門に引き渡し、そして忘れろ」。"}, {"t": 1363.2, "x": "もう一人の幹部からは、作業をすべて機密扱いにし、"}, {"t": 1366.4666666666667, "x": "情報を一言も漏らすな、という\n命令があったとも書いている。"}, {"t": 1370.2, "x": "そして彼は、光る球体の目撃が\n複数あったことを挙げて、9人は\n未知の飛行物体に遭遇したのだと自分は"}, {"t": 1376.8833333333334, "x": "考えている、と書いた。"}, {"t": 1378.6, "x": "捜査した本人が、そう言ったのね。"}, {"t": 1381.0166666666667, "x": "言った。だが、ここは分けて聞いてほしい。これは"}, {"t": 1383.85, "x": "1990年の新聞記事であって、\n捜査記録ではない。彼の考えだ。"}, {"t": 1388.55, "x": "私が引っかかったのは、その先だ。"}, {"t": 1391.0, "x": "イワノフは記事の中で、記者に\nこう頼んだと書いている。"}, {"t": 1394.0333333333333, "x": "被害者の遺族に対して、真実を歪め、真実を\n隠したことについての謝罪を載せてほしい、と。"}, {"t": 1400.1833333333334, "x": "そして、ドゥビニナ、チボー・ブリニョール、\nゾロタリョフの遺族に、名前を挙げて謝っている。"}, {"t": 1405.4833333333333, "x": "事件を閉じた本人が、31年後にそう\n書いた。それは事実として残っている。"}, {"t": 1411.2166666666667, "x": "時間を飛ばす。2018年の秋だ。"}, {"t": 1413.85, "x": "遺族と世論の求めを受けて、ロシア連邦検察庁が、"}, {"t": 1417.1333333333334, "x": "60年前のこの刑事事件記録を\n点検し直す作業を始めた。"}, {"t": 1421.3166666666666, "x": "公表されたのは2019年2月1日。"}, {"t": 1423.9833333333333, "x": "当時のユーリ・チャイカ検事総長の承認のもとだった。"}, {"t": 1427.4, "x": "検察庁の報道官はこう言っている。"}, {"t": 1429.5, "x": "「刑事事件記録はすでに\n分析済みで、400ページを超える。"}, {"t": 1433.1, "x": "多くの鑑定も行われている」"}, {"t": 1435.15, "x": "もう一度、全部読み直したってこと。"}, {"t": 1437.6333333333334, "x": "そうだ。そして、このとき検察は、\n検討する説を3つに絞ると発表した。"}, {"t": 1442.6833333333334, "x": "雪崩。いわゆる「雪の板」、つまり固まった雪の層が\n滑り落ちるもの。そして、ハリケーン級の吹雪。"}, {"t": 1449.1666666666667, "x": "この3つだけだ、と。"}, {"t": 1450.65, "x": "理由も言っている。「検討したすべての説は\n自然現象に関わるものであり、\n犯罪は完全に除外されている」"}, {"t": 1457.0833333333333, "x": "最初から、犯罪の線は見ないって決めたのね。"}, {"t": 1460.15, "x": "そうだ。ここは覚えておいてほしい。"}, {"t": 1462.0, "x": "60年前の捜査も、今回の点検も、最初から\n犯罪ではないという前提に立っている。"}, {"t": 1467.6666666666667, "x": "担当したのは、アンドレイ・クリヤコフ検察官だ。"}, {"t": 1470.85, "x": "彼はこう言っている。"}, {"t": 1471.9, "x": "「終止符を打たない限り、このような\n状況はまた繰り返されうる」"}, {"t": 1475.55, "x": "クリヤコフたちは現地へ行った。"}, {"t": 1477.2333333333333, "x": "地形の3次元モデルを作るためのデータを\n集め、いくつかの実験もやっている。"}, {"t": 1481.9833333333333, "x": "1959年の決定書には、雪崩という\n言葉は一度も出てこない。"}, {"t": 1486.35, "x": "「克服できない自然の力」としか書かれていない。"}, {"t": 1489.6166666666666, "x": "60年後の点検は、その中身を\n自分たちで決めにいったことになる。"}, {"t": 1493.95, "x": "でも、60年たってるのよね。"}, {"t": 1495.8833333333334, "x": "現場に何が残ってるのかしら。"}, {"t": 1498.0666666666666, "x": "いい質問だ。雪はとっくに無い。"}, {"t": 1500.0333333333333, "x": "当時の斜面は、写真と図面でしか残っていない。"}, {"t": 1503.1333333333334, "x": "だから、この点検が使えた材料も、結局は\nあの400ページの記録と、いまの地形そのものだ。"}, {"t": 1509.0333333333333, "x": "新しい物証が出てきたわけではない。"}, {"t": 1511.95, "x": "2020年7月11日、検察は結論を公表した。"}, {"t": 1515.9333333333334, "x": "死因は雪崩だ、というものだった。"}, {"t": 1518.0, "x": "クリヤコフが説明した経過は、こうだ。"}, {"t": 1520.4666666666667, "x": "天候が急に悪化して、テントの上の雪が崩れた。"}, {"t": 1523.55, "x": "9人はテントを切って緊急に脱出した。"}, {"t": 1526.35, "x": "全員で50メートルほど下り、雪を\n止める岩の連なりのところまで離れた。"}, {"t": 1530.8833333333334, "x": "そこで振り返ったとき、テントが見えなくなっていた。"}, {"t": 1534.0166666666667, "x": "見えなくなった。すぐそこなのに。"}, {"t": 1536.2, "x": "検察が挙げた数字がある。\nそのときの見通しは6メートルから16メートル。"}, {"t": 1540.55, "x": "気温は氷点下40度から45度で、\n身を切る風が吹いていた、と。"}, {"t": 1544.9, "x": "断っておくと、この氷点下40度という\n数字は、2020年に検察が公表したものだ。"}, {"t": 1550.5, "x": "1959年の実測値ではない。"}, {"t": 1553.25, "x": "50メートル離れたら、16メートル先までしか見えない。"}, {"t": 1556.6, "x": "テントはもう無いのと同じだ。"}, {"t": 1558.4, "x": "検察は、この点を実験で確かめたと言っている。"}, {"t": 1561.4, "x": "現地で、目を閉じた状態では、だいたい"}, {"t": 1563.5666666666666, "x": "どの方向にあるかを知っていても\nテントを見つけることはできない、と。"}, {"t": 1567.5666666666666, "x": "その先はこうだ。9人は\n下の杉の木まで下りて、火を焚いた。"}, {"t": 1571.3166666666666, "x": "火は1時間半しかもたなかった。\nそこで2人が凍死した。"}, {"t": 1575.1666666666667, "x": "残りは分かれた。一方は足あとをたどって\nテントへ戻ろうとして、斜面の途中で力尽きた。"}, {"t": 1580.75, "x": "もう一方は、雪を掘って身を隠す場所を\n作ろうとし、そのときに雪が動いて、"}, {"t": 1585.3, "x": "3メートルの雪の下になった。"}, {"t": 1587.45, "x": "クリヤコフは、こう締めくくった。"}, {"t": 1589.4333333333334, "x": "「英雄的な闘いだった。"}, {"t": 1590.9666666666667, "x": "パニックはなかった。だがこの状況で\n助かる見込みは、彼らにはなかった」"}, {"t": 1595.45, "x": "そして、こう言った。"}, {"t": 1596.65, "x": "「形式的にはこれが最終だ。"}, {"t": 1598.5333333333333, "x": "問題は閉じられた」"}, {"t": 1600.5333333333333, "x": "ところが、閉じられなかった。"}, {"t": 1602.35, "x": "発表の直後から、遺族らの財団が反発した。"}, {"t": 1605.4666666666667, "x": "ディアトロフ財団という、公的な記念団体だ。"}, {"t": 1608.5666666666666, "x": "財団は、この結論に同意しないと\n表明した。さらに2020年8月、"}, {"t": 1613.2333333333333, "x": "検察庁に対して、\nクリヤコフの行為についての服務監査を求め、"}, {"t": 1617.3, "x": "検察庁の公式サイトに訂正を載せるよう要求した。"}, {"t": 1620.8333333333333, "x": "遺族が、国の結論に正面から反対したのね。"}, {"t": 1624.1833333333334, "x": "した。そして、その3か月後に\n起きたことが、私には引っかかっている。"}, {"t": 1628.8333333333333, "x": "2020年11月2日、クリヤコフが検察庁を解任された。"}, {"t": 1633.25, "x": "結論を出した人が。"}, {"t": 1634.8666666666666, "x": "そうだ。イーゴリ・\nクラスノフ検事総長の処分命令には、\n理由がこう書かれている。"}, {"t": 1639.75, "x": "「職務上の権限の範囲外で、上司の指示なく、"}, {"t": 1642.65, "x": "法学の学位論文の準備という個人的な目的のために、"}, {"t": 1646.25, "x": "1959年の登山グループの死亡をめぐる状況について、"}, {"t": 1650.0666666666666, "x": "スヴェルドロフスク州検察庁の活動に\n関する公的な発言と評価を行った」"}, {"t": 1655.1166666666666, "x": "ここは正確に受け取ってほしい。"}, {"t": 1656.8666666666666, "x": "雪崩という結論が間違っていた、と\n言われたわけではない。"}, {"t": 1660.4, "x": "問題にされたのは、彼が権限の外で\n公に発言したことだ。そう書いてある。"}, {"t": 1665.3833333333334, "x": "ただ、結果として何が起きたか。"}, {"t": 1667.4333333333334, "x": "国が公式に発表した結論なのに、その発表をした\n人物が処分され、遺族はその結論を認めていない。"}, {"t": 1674.3166666666666, "x": "60年前は、捜査記録が機密にされて表に出なかった。"}, {"t": 1678.05, "x": "60年後は、結論が出たのに、国の中でも\n遺族の側でも決着していない。"}, {"t": 1683.1166666666666, "x": "この事件は、そういう形をしている。"}, {"t": 1686.0666666666666, "x": "検察の発表の半年後、\n別の場所から別の答えが出てきた。"}, {"t": 1690.1833333333334, "x": "2021年1月28日、スイスの研究者2人が、\n科学雑誌に論文を出した。"}, {"t": 1696.0, "x": "ヨハン・ゴーム教授と、\nアレクサンダー・プズリン教授。"}, {"t": 1698.8166666666666, "x": "雪崩と地盤の専門家だ。"}, {"t": 1700.5666666666666, "x": "雑誌はコミュニケーションズ・\nアース・アンド・エンバイロメント。"}, {"t": 1704.55, "x": "ちなみにこの公開日は、9人が出発した\n1959年1月28日の、ちょうど62年後にあたる。"}, {"t": 1711.8333333333333, "x": "わざと合わせたのかしら。"}, {"t": 1713.4333333333334, "x": "そうらしいな。"}, {"t": 1714.3166666666666, "x": "彼らがやったのは、数値の計算だ。"}, {"t": 1716.5, "x": "雪の層がどう崩れるかを計算する模型を\n作って、あの斜面の条件を入れた。"}, {"t": 1721.3166666666666, "x": "出てきた筋書きはこうだ。"}, {"t": 1722.7833333333333, "x": "テントの上の斜面は傾き28度。そこに\nカタバ風という、斜面を吹き下ろす風が雪を運んで、"}, {"t": 1728.7166666666667, "x": "少しずつ積み増していく。\nそれが固い「雪の板」になる。"}, {"t": 1732.65, "x": "そして9人は、テントを水平にするために斜面を\n掘った。この切り込みが、板を不安定にした。"}, {"t": 1738.5, "x": "崩れた板は、5メートル四方ほどしかない。"}, {"t": 1740.9333333333334, "x": "走った距離も、テントの1、2メートル下までだ。"}, {"t": 1744.3, "x": "そんなに小さいの。捜索の人たちが\n雪崩の跡に気づかないくらい。"}, {"t": 1748.5, "x": "そこが、この論文の主張のかなめだ。"}, {"t": 1750.8, "x": "小さいから跡が残らない。そして小さくても、\n寝ている人の上に乗れば、"}, {"t": 1755.1, "x": "胸や頭の骨が折れるだけの力にはなる。"}, {"t": 1757.8833333333334, "x": "ただし、著者自身が留保をつけている。"}, {"t": 1760.1, "x": "ゴームはこう言っている。"}, {"t": 1761.4166666666667, "x": "「われわれは、外傷がテントの中で\n生じたと主張しているわけではない。"}, {"t": 1765.2666666666667, "x": "板がそれを起こすだけの重さだったと\n言っているだけで、他の可能性にも開かれている」"}, {"t": 1770.25, "x": "この論文には反論も多い。"}, {"t": 1771.8333333333333, "x": "現場に雪崩の堆積の跡が見当たらないこと。\nその後100回を超える遠征で、この場所で"}, {"t": 1777.4166666666667, "x": "雪崩の条件が報告されていないこと。"}, {"t": 1779.3166666666666, "x": "ディアトロフとゾロタリョフは経験のある\n登山者で、雪崩の通り道にテントを張るとは"}, {"t": 1783.7666666666667, "x": "考えにくいこと。そして、足あとが\n走った形ではなかったこと。"}, {"t": 1788.0333333333333, "x": "2人はその後、現地へ3回の遠征に出ている。"}, {"t": 1790.8333333333333, "x": "2022年に出した2本目の論文では、\nこの地域が実際に雪崩を起こしやすいこと、"}, {"t": 1796.0166666666667, "x": "斜面の傾きが雪崩を起こすのに\n足りていることを確かめたと書いている。"}, {"t": 1800.8333333333333, "x": "ここまで、公的な記録と論文だけで話してきた。"}, {"t": 1804.1166666666666, "x": "だが、この事件を有名にしたのは、そっちじゃない。"}, {"t": 1807.0333333333333, "x": "UFOだ、秘密兵器だ、雪男だ、という話のほうだ。"}, {"t": 1811.1333333333334, "x": "私も、そっちで名前を知ったわ。"}, {"t": 1813.45, "x": "だろうな。だから、その説そのものの中身は話さない。"}, {"t": 1816.7666666666667, "x": "確かめられていないからだ。"}, {"t": 1818.45, "x": "代わりに、なぜそういう説が出てきたのかを話す。"}, {"t": 1821.2666666666667, "x": "出どころは、だいたい記録の中にある。"}, {"t": 1823.75, "x": "まず、光る球体だ。1959年4月15日、"}, {"t": 1827.5666666666666, "x": "ウラジスラフ・カレリンさんという\n証人が取り調べを受けている。"}, {"t": 1830.9666666666667, "x": "彼の隊は、ディアトロフ隊と同じ地域の50\nキロから60キロ南を歩いていた。"}, {"t": 1836.0, "x": "カレリンさんはこう証言した。"}, {"t": 1837.6, "x": "1959年2月17日の朝7時半ごろ、"}, {"t": 1841.1666666666667, "x": "大きな明るい光の斑点が空に現れて大きくなり、\nその中心に小さな星が現れてそれも大きくなった。"}, {"t": 1847.5666666666666, "x": "斑点は北東から南西へ動いて、下へ落ちていった。"}, {"t": 1851.1, "x": "2月17日。事件の夜じゃないのね。"}, {"t": 1853.8833333333334, "x": "そこが大事なところだ。"}, {"t": 1855.25, "x": "9人がテントを張ったのは2月1日だ。\nこの目撃は、2週間以上あとの話になる。"}, {"t": 1860.85, "x": "だが、こういう証言が記録に"}, {"t": 1862.6666666666667, "x": "残っていて、それを1990年にイワノフ本人が\n自分の記事で持ち出した。だからUFOの話が残った。"}, {"t": 1869.45, "x": "次に、秘密兵器の説。これは、\nさっきの放射線の鑑定書の数字と、"}, {"t": 1874.0, "x": "ヴォズロジデンヌイが外傷の例として\n爆風を挙げたこと、この2つが元になっている。"}, {"t": 1879.0, "x": "どちらも記録にある事実だ。だが、\n記録はそこから先を何も書いていない。"}, {"t": 1883.55, "x": "雪男の説の出どころは、たぶん\nテントの中から見つかった、あの壁新聞だ。"}, {"t": 1888.25, "x": "9人が自分で書いた冗談だ。"}, {"t": 1890.3666666666666, "x": "それから、超低周波音の説というのもある。"}, {"t": 1893.0, "x": "山の形が風で渦を作り、人が不安になる\n音を出したというものだ。これは2013年に本で"}, {"t": 1899.0333333333333, "x": "発表された説で、査読を受けた論文ではない。"}, {"t": 1901.9333333333334, "x": "もう一つ言っておく。"}, {"t": 1903.0833333333333, "x": "捜査記録の表紙には\n1959年2月6日という日付があって、"}, {"t": 1907.5, "x": "遺体が見つかる前に事件が\n立件されていた証拠だ、と言われてきた。"}, {"t": 1911.7166666666667, "x": "だが、これは証人の供述書の日付の書き誤りが\n表紙に引き継がれたものだとされている。"}, {"t": 1916.9333333333334, "x": "3月6日を2月6日と書いた。"}, {"t": 1919.0333333333333, "x": "テンパロフは他にも日付を書き誤っている。"}, {"t": 1921.85, "x": "私はこれらの説を\n否定はしない。だが、肯定もしない。"}, {"t": 1925.1833333333334, "x": "公的な記録で確かめられないからだ。"}, {"t": 1928.2666666666667, "x": "ここからは、私の見方だ。"}, {"t": 1930.1, "x": "事実と分けて聞いてほしい。"}, {"t": 1931.8166666666666, "x": "この事件を記録だけで追ってみて、\n引っかかったことが三つある。"}, {"t": 1935.5833333333333, "x": "一つ目。確実なことは、思っているより\nずっと少ない、ということだ。"}, {"t": 1939.9333333333334, "x": "この事件で、書類で確定していることは何か。"}, {"t": 1942.8, "x": "テントの切り口が内側から入れられていること。"}, {"t": 1945.4333333333334, "x": "食料庫が手つかずだったこと。"}, {"t": 1947.3, "x": "貴重品が全部残っていたこと。"}, {"t": 1949.2666666666667, "x": "他人の足あとが無かったこと。"}, {"t": 1951.05, "x": "足あとが走った形ではなかったこと。"}, {"t": 1953.4, "x": "5人が凍死で、3人に大きな外傷があったこと。"}, {"t": 1956.7666666666667, "x": "それだけ。"}, {"t": 1957.6666666666667, "x": "それだけだ。あとは全部、その事実を\nどう並べるかという話になる。"}, {"t": 1961.6666666666667, "x": "雪崩も、雪の板も、吹雪も、並べ方の候補だ。"}, {"t": 1965.4166666666667, "x": "二つ目。60年たっても、\n結論のほうが割れていることだ。"}, {"t": 1969.2666666666667, "x": "1959年、国は「克服できない自然の力」と書いた。"}, {"t": 1973.6333333333334, "x": "中身は書かなかった。"}, {"t": 1974.9833333333333, "x": "2020年、国は雪崩だと発表した。その3か月後、\n発表した検察官が権限外だとして外された。"}, {"t": 1981.9666666666667, "x": "遺族の財団は、いまも同意していない。"}, {"t": 1984.5, "x": "2021年、スイスの研究者が計算で\n説明を出した。だが著者自身が、"}, {"t": 1989.3333333333333, "x": "外傷がテントの中で起きたと\n主張しているわけではない、と言っている。"}, {"t": 1993.4166666666667, "x": "誰も、最後まで言い切っていない。"}, {"t": 1995.4666666666667, "x": "三つ目。これがいちばん引っかかる。"}, {"t": 1997.6166666666666, "x": "1959年の決定書は、「テントは全員によって突然、"}, {"t": 2001.5, "x": "同時に放棄された」と書いたうえで、\n「その原因は特定されていない」と書いた。"}, {"t": 2006.3166666666666, "x": "60年後の点検でも、この一行は埋まっていない。"}, {"t": 2009.3833333333334, "x": "雪崩だとされても、なぜ靴を置いたままだったのかは"}, {"t": 2012.4, "x": "説明されない。なぜ全員が同じ方向へ、普通に\n歩いて下りていったのかも説明されない。"}, {"t": 2017.65, "x": "下山事件のときと違って、\nこの事件の記録は隠されていない。"}, {"t": 2021.5, "x": "開いている。誰でも読める。"}, {"t": 2023.45, "x": "読めるのに、決まらない。そこが、この事件が\nいまだに語られ続けている理由だと思う。"}, {"t": 2028.6166666666666, "x": "確かなことが少ないところには、\nいくらでも物語が入り込む。"}, {"t": 2032.3833333333334, "x": "UFOも、兵器も、雪男も、そこへ入ってきた。"}, {"t": 2036.05, "x": "ただ、入り込む余地がある\n理由は、記録を読めば分かる。"}, {"t": 2039.1833333333334, "x": "国自身が「分からない」と書いているからだ。"}, {"t": 2042.6666666666667, "x": "最後に、一つだけ言っておきたいことがある。"}, {"t": 2045.3, "x": "この事件は、世界一有名な未解決の遭難として、\n謎の題材として扱われてきた。"}, {"t": 2050.9, "x": "だが、あの斜面にいたのは、20歳から38歳の9人だ。"}, {"t": 2054.9333333333334, "x": "大学5年生が2人、4年生が3人、"}, {"t": 2057.55, "x": "卒業して働き始めた技師が3人。\nそして観光基地のインストラクターが1人。"}, {"t": 2062.766666666667, "x": "最年長のゾロタリョフの誕生日は2月2日だった。"}, {"t": 2065.8166666666666, "x": "テントを張った2月1日の、翌日だ。"}, {"t": 2068.65, "x": "クリヴォニシチェンコの誕生日は2月7日だった。"}, {"t": 2071.4, "x": "テントを張った日の、6日後だ。"}, {"t": 2073.4166666666665, "x": "彼らは重い山行の途中で、その日の夕方には、\nテントの中で冗談を書いた壁新聞を作っていた。"}, {"t": 2079.6833333333334, "x": "あの「夕刊オトルテン」ね。"}, {"t": 2081.633333333333, "x": "そうだ。あれが、9人が生きているあいだに\n残した最後の紙になった。"}, {"t": 2085.8166666666666, "x": "そして、1月28日に脚を痛めて\n引き返した、ユーリ・ユーディン。"}, {"t": 2090.366666666667, "x": "彼はそのあと54年生き、2013年に75歳で亡くなった。"}, {"t": 2094.55, "x": "自分だけが帰ってきたことを、\n最後まで語り続けた人だった。"}, {"t": 2098.65, "x": "今回の話で使った資料は、全部公開されている。"}, {"t": 2101.9, "x": "1959年の刑事事件記録は、\n州の公文書館から写しが出ていて、"}, {"t": 2106.8333333333335, "x": "鑑定書も検死の結論も事件終結の決定書も、\nページ番号つきでネット上に上がっている。"}, {"t": 2112.616666666667, "x": "2020年の検察の発表は、ロシアの主な通信社が\n全文に近い形で報じている。"}, {"t": 2118.05, "x": "2021年と2022年の論文は、誰でも\n読める形で公開されている。"}, {"t": 2123.233333333333, "x": "興味を持った人は、ぜひ自分で見てみてほしい。"}, {"t": 2125.95, "x": "60年以上前の手書きの鑑定書が、そのまま残っている。"}, {"t": 2129.85, "x": "私は今回、死因を決めなかった。"}, {"t": 2132.05, "x": "国自身が2度結論を出そうとして、\n2度とも決着していない事件で、\n私が決める理由がないからだ。"}, {"t": 2138.366666666667, "x": "ただ、一つだけ確かなことがある。\nこの事件の記録は、開いている、ということだ。"}, {"t": 2143.6833333333334, "x": "開いているのに、決まらないのね。"}, {"t": 2145.85, "x": "ああ。隠されていたころは、隠されているから\n分からないのだと言えた。いまは、それが言えない。"}, {"t": 2150.95, "x": "読めるのに決まらない。"}, {"t": 2152.2, "x": "私はそのことのほうが、この事件の本当に\n厄介なところだと思っている。"}, {"t": 2156.8166666666666, "x": "この事件について、あなたはどう\n考えるか。よかったらコメントで教えてほしい。"}, {"t": 2161.383333333333, "x": "最後まで見てくれて、ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
