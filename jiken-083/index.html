<script>
const D={"name": "083", "file": "083_編集用", "dur": 2152.8, "segs": [], "subs": [{"t": 0.0, "x": "1959年5月28日、ソ連のスヴェルドロフスク州で、\n一人の検事捜査官が一通の決定書に署名した。"}, {"t": 7.783333333333333, "x": "ある事件の捜査を、ここで打ち切るという書類だ。"}, {"t": 10.766666666666667, "x": "犯人も、事故の原因も、決まらないまま打ち切ったの？"}, {"t": 14.3, "x": "ああ。その結論の部分には、こう書かれている。"}, {"t": 17.15, "x": "「登山者たちの死因は、彼らが\n克服することのできなかった\n自然の力であったと考えるべきである」"}, {"t": 23.1, "x": "克服することのできなかった、自然の力。"}, {"t": 26.2, "x": "それが、国が出した結論だ。ただし、\nその「自然の力」が何だったのかは、"}, {"t": 31.266666666666666, "x": "決定書のどこにも書かれていない。"}, {"t": 33.38333333333333, "x": "ディアトロフ峠事件。"}, {"t": 34.6, "x": "1959年2月、ウラル山脈の北部で、スキーで\n山を歩いていた9人が、全員亡くなった事件だ。"}, {"t": 41.7, "x": "テントを内側から切って逃げた、っていう話よね？"}, {"t": 44.8, "x": "ああ。そこだけは、はっきりしている。"}, {"t": 46.9, "x": "切り口が内側からだということは、鑑定人が\n顕微鏡で調べて、鑑定書に書いている。"}, {"t": 52.36666666666667, "x": "分かっていないのは、なぜ切ったのかのほうだ。"}, {"t": 54.916666666666664, "x": "今回は、その「なぜ」を、\n確かめられる記録だけで追いかける。"}, {"t": 58.96666666666667, "x": "1959年にソ連が自分で作った捜査記録と、\n2020年にロシアの検察が公表した内容と、"}, {"t": 65.65, "x": "2021年にスイスの研究者が出した\n論文。この3つだけだ。"}, {"t": 70.06666666666666, "x": "UFOだとか、雪男だとかっていう話も聞くけど？"}, {"t": 73.58333333333333, "x": "ああ、本も番組も山ほどある。ただ、そのほとんどは、"}, {"t": 76.86666666666666, "x": "確かめられていない話を\nつなぎ直したものだ。だから、\n記録のほうから見ていく。"}, {"t": 81.85, "x": "60年以上前のソ連の捜査記録なんて、\n読めるものなの？"}, {"t": 85.73333333333333, "x": "読める。捜査記録は全2巻、およそ400ページある。"}, {"t": 88.96666666666667, "x": "1974年に検察庁の保管庫から\n州の公文書館に移された。そして2012年に、"}, {"t": 95.15, "x": "遺族らの財団が公文書館から正式な写しを\n受け取り、2013年に本として公開した。"}, {"t": 101.13333333333334, "x": "先に断っておく。この動画では、\n9人の死因を決めつけない。"}, {"t": 104.9, "x": "犯人がいたとも言わない。"}, {"t": 106.35, "x": "事実と、私の見方は分けて話す。"}, {"t": 109.66666666666667, "x": "まず、山に入った人たちの話からする。"}, {"t": 112.5, "x": "出発したのは10人だ。ほとんどが、"}, {"t": 114.8, "x": "スヴェルドロフスクにある\nウラル工科大学の学生と、その卒業生だった。"}, {"t": 119.35, "x": "隊長はイーゴリ・ディアトロフさん、23歳。"}, {"t": 122.0, "x": "大学5年生で、無線機を自作するような学生だった。\nこの事件が彼の名前で呼ばれているのは、"}, {"t": 127.76666666666667, "x": "隊長だったからだ。"}, {"t": 129.23333333333332, "x": "ジナイダ・コルモゴロワさん、22歳。"}, {"t": 131.55, "x": "大学5年生。リュドミラ・\nドゥビニナさん、20歳。大学4年生。"}, {"t": 136.06666666666666, "x": "アレクサンドル・コレヴァトフさん、24歳。"}, {"t": 138.65, "x": "ユーリ・ドロシェンコさん、21歳。"}, {"t": 140.83333333333334, "x": "どちらも大学4年生だ。"}, {"t": 142.71666666666667, "x": "ルステム・スロボディンさん、23歳。"}, {"t": 145.06666666666666, "x": "ユーリ・クリヴォニシチェンコさん、23歳。"}, {"t": 147.71666666666667, "x": "ニコライ・チボー・ブリニョールさん、23歳。\nこの3人は大学を出て、もう技師として働いていた。"}, {"t": 154.01666666666668, "x": "みんな若いのね。"}, {"t": 155.25, "x": "ああ。そして、一人だけ年が離れている人がいる。"}, {"t": 158.5, "x": "セミョン・ゾロタリョフさん、1921年生まれ。"}, {"t": 161.65, "x": "観光基地でインストラクターをしていた人で、\n戦争に行っている世代だ。ほかの9人より、"}, {"t": 166.85, "x": "15歳から18歳ほど上になる。"}, {"t": 169.23333333333332, "x": "そして10人目が、ユーリ・\nユーディンさん、21歳。大学4年生だ。"}, {"t": 173.73333333333332, "x": "目的地はオトルテン山。"}, {"t": 175.25, "x": "ウラル山脈の北のほうにある山だ。"}, {"t": 177.38333333333333, "x": "行程はおよそ300キロ。"}, {"t": 178.93333333333334, "x": "当時の区分でいちばん上の等級に\nあたる、重い山行だった。"}, {"t": 182.75, "x": "300キロ。冬の山を。"}, {"t": 184.61666666666667, "x": "そうだ。全員がその前の等級を持っていて、\nこの山行を終えれば最上級の資格が"}, {"t": 189.4, "x": "取れる。そういう挑戦だった。"}, {"t": 191.35, "x": "1959年1月23日、10人はルートブックを\n受け取り、スヴェルドロフスクを列車で出発した。"}, {"t": 198.68333333333334, "x": "1月24日、セロフに着いた。"}, {"t": 200.86666666666667, "x": "学校に泊めてもらい、その夜イヴデリへ向かう。"}, {"t": 203.66666666666666, "x": "1月25日、イヴデリからバスで、\nヴィジャイという集落に入った。"}, {"t": 207.75, "x": "午後2時ごろだ。ここが\n人の住んでいる最後の場所になる。"}, {"t": 211.23333333333332, "x": "1月26日、トラックの荷台に乗って、\n第41番地区という林業の作業場へ。"}, {"t": 216.48333333333332, "x": "着いたのは夕方4時半ごろで、\n作業員の宿舎に泊まっている。"}, {"t": 220.38333333333333, "x": "1月27日、ここからスキーに履き替えた。"}, {"t": 223.35, "x": "無人になった第2北部鉱山の跡へ\n入り、夜11時ごろに着いた。"}, {"t": 227.73333333333332, "x": "もう人はいないのね。"}, {"t": 229.16666666666666, "x": "ああ。ここから先は、\nマンシの人たちの猟の道しかない。"}, {"t": 232.68333333333334, "x": "そして1月28日。ここで、10人が9人になる。"}, {"t": 236.46666666666667, "x": "ユーリ・ユーディンが、\n脚の痛みで先へ進めなくなった。"}, {"t": 239.73333333333332, "x": "前から持っていた持病が出たんだ。"}, {"t": 241.88333333333333, "x": "彼は荷物を隊に渡し、来た道を引き返した。"}, {"t": 244.8, "x": "馬車に乗せてもらって、ヴィジャイへ戻っている。"}, {"t": 247.61666666666667, "x": "その人だけ、助かったってこと。"}, {"t": 249.98333333333332, "x": "そういうことになる。"}, {"t": 251.03333333333333, "x": "ユーディンは、この事件のただ\n一人の生存者と呼ばれることになった。"}, {"t": 255.11666666666667, "x": "彼は2013年に75歳で亡くなるまで、\nこの事件のことを語り続けた。"}, {"t": 260.03333333333336, "x": "後年、別れたときの写真が残っている。"}, {"t": 262.5, "x": "仲間の一人と抱き合っている、あの1月28日の写真だ。"}, {"t": 266.65, "x": "ユーディンが書いていた日記も、このあと\n捜査記録に綴じられることになる。"}, {"t": 270.6, "x": "隊の共同日記と一緒に、いま読める形で残っている。"}, {"t": 274.25, "x": "自分だけが途中で降りた日のことも、書いてあるのね。"}, {"t": 277.51666666666665, "x": "ああ。"}, {"t": 277.95, "x": "残った9人は、その日のうちに出発した。"}, {"t": 280.75, "x": "最初の夜は、ロズヴァ川の岸でテントを張っている。"}, {"t": 284.53333333333336, "x": "ここから2月1日までの動きは、隊が自分たちで\n書いた日記と、カメラのフィルムから分かっている。"}, {"t": 290.5, "x": "日記も残ってるの。"}, {"t": 291.98333333333335, "x": "残っている。隊の共同日記が1冊と、\nコルモゴロワ、ドゥビニナ、スロボディン、"}, {"t": 296.6166666666667, "x": "ユーディンの個人の日記。"}, {"t": 298.05, "x": "全部で6冊が捜査記録に綴じられた。"}, {"t": 300.73333333333335, "x": "カメラも7台分のフィルムが残った。"}, {"t": 302.9, "x": "行程の写真がそのまま残っているんだ。"}, {"t": 305.3666666666667, "x": "1月29日。アウスピヤ川に沿って、\nマンシの人たちの道をたどっている。"}, {"t": 310.18333333333334, "x": "1月30日。今度はトナカイの橇の跡に\n沿って、同じ川を上流へ進んだ。"}, {"t": 315.28333333333336, "x": "1月31日。ホラート・シャフイルという\n山に近づき、いったん登ろうとした。だが\n風が強くて、その日は断念している。"}, {"t": 322.7, "x": "谷へ下りて、アウスピヤ川の岸でもう一泊した。"}, {"t": 325.9166666666667, "x": "ホラート・シャフイル。"}, {"t": 326.85, "x": "聞き慣れない名前ね。"}, {"t": 328.3666666666667, "x": "マンシ語の地名だ。「死の山」と\n訳されることが多い。"}, {"t": 331.56666666666666, "x": "ただ、この名前についてはよく誤解される。もともとは"}, {"t": 334.75, "x": "「獲物がいない山」という意味だったとされていて、\n「死」にあたる言葉を含む地名は、"}, {"t": 339.48333333333335, "x": "マンシの土地にほかにも3つ以上ある。"}, {"t": 341.85, "x": "9人が死ぬことを予言していた\n名前ではない。先に言っておく。"}, {"t": 345.51666666666665, "x": "ちなみに目的地のオトルテン山のほうも、マンシ語では"}, {"t": 348.6666666666667, "x": "「そこへ行くな」という意味だと\n言われている。だが、これも地名の話でしかない。"}, {"t": 353.9, "x": "2月1日。この日が、9人の最後の一日になる。"}, {"t": 357.48333333333335, "x": "朝、彼らはまず「ラバズ」と呼ばれる食料庫を作った。"}, {"t": 361.1666666666667, "x": "食料庫。"}, {"t": 362.1333333333333, "x": "雪の中に穴を掘って、荷物を置いていくんだ。"}, {"t": 364.8333333333333, "x": "オトルテン山を往復するあいだ、\n要らないものを預けておく。"}, {"t": 368.0833333333333, "x": "帰りにここへ寄って回収する。"}, {"t": 370.1166666666667, "x": "置いていったのは、食料のほかに、\n予備のスキーが1組、予備の登山靴が2足、"}, {"t": 374.93333333333334, "x": "救急箱、そしてマンドリンだ。"}, {"t": 377.21666666666664, "x": "マンドリン。山に持ってきてたのね。"}, {"t": 379.5, "x": "持ってきていた。日記には、夜に\nそれを弾いていたことが書かれている。"}, {"t": 383.55, "x": "荷を軽くした9人は、そこから峠へ登っていった。"}, {"t": 386.8, "x": "そして、フィルムに残った写真から、午後5時ごろ、"}, {"t": 389.8, "x": "ホラート・シャフイルの東側の斜面に\nテントを張ったと判定されている。"}, {"t": 393.8666666666667, "x": "ここが、あとで問題になる。"}, {"t": 395.8, "x": "どうして。"}, {"t": 396.65, "x": "森から出た、何もない斜面だからだ。"}, {"t": 398.95, "x": "1キロ半ほど下れば森があって、風も\nしのげるし薪もある。そこまで下りずに、"}, {"t": 403.73333333333335, "x": "吹きさらしの斜面で泊まっている。"}, {"t": 405.85, "x": "テントを水平にするために、斜面を\n雪ごと掘って、そこに張っていた。"}, {"t": 410.0833333333333, "x": "この「斜面を掘った」という一点が、\n60年後に持ち出されることになる。"}, {"t": 414.7, "x": "それから、もう一つ。"}, {"t": 416.06666666666666, "x": "あとで事件を閉じる決定書は、\nこの日の隊長の判断を2点、名指しで指摘している。"}, {"t": 421.3833333333333, "x": "登りを始めたのが\n午後3時になってからだったこと。そして下りで、"}, {"t": 425.28333333333336, "x": "進路を500メートルから600メートル左へ外したこと。"}, {"t": 428.9, "x": "国の書類が、そこは間違いだったと書いたのね。"}, {"t": 431.98333333333335, "x": "書いた。山の判断については、はっきり書いている。"}, {"t": 435.03333333333336, "x": "書けなかったのは、そのあとに起きたことのほうだ。"}, {"t": 438.5833333333333, "x": "テントの中から見つかったもので、私が\nいちばん引っかかったのは、一枚の紙だ。"}, {"t": 443.56666666666666, "x": "手書きの壁新聞だ。題は「夕刊オトルテン」。"}, {"t": 446.4, "x": "第1号、日付は1959年2月1日と入っている。"}, {"t": 450.76666666666665, "x": "壁新聞って、学校でやるあれ。"}, {"t": 453.03333333333336, "x": "そうだ。学生がふざけて作る、あれだ。"}, {"t": 455.48333333333335, "x": "書いてあるのは冗談ばかりだった。"}, {"t": 457.48333333333335, "x": "「哲学ゼミナール『愛と観光』を\n毎日テント内で開催」。"}, {"t": 461.03333333333336, "x": "講師の名前のところには、隊員の名前が\nふざけた肩書きつきで並べてある。"}, {"t": 465.6666666666667, "x": "北ウラルに雪男はいるのか、という\n話題も、笑い話として載っている。"}, {"t": 470.0833333333333, "x": "見出しの一つはこうだ。"}, {"t": 471.43333333333334, "x": "「観光客の出生率を上げて、\n第21回党大会を迎えよう」。"}, {"t": 475.68333333333334, "x": "党大会。時代ね。"}, {"t": 477.28333333333336, "x": "この山行そのものが、共産党の第21回大会に\nちなんで企画されたものだった。"}, {"t": 482.4, "x": "当時のソ連では、そういうやり方が普通だったんだ。"}, {"t": 485.6333333333333, "x": "発行元のところには、\nこの隊の労働組合組織の機関紙、と書いてある。"}, {"t": 490.1, "x": "全部ふざけている。"}, {"t": 491.51666666666665, "x": "雪男の話、自分たちで書いてたのね。"}, {"t": 494.43333333333334, "x": "書いていた。あとでこの事件に"}, {"t": 496.21666666666664, "x": "雪男の説がくっつくのは、たぶんこの紙が\n発見されたことと無関係じゃない。"}, {"t": 500.96666666666664, "x": "だが、この紙が本当に\n意味しているのは、そこじゃない。"}, {"t": 504.25, "x": "2月1日の夕方、あの斜面のテントの中で、9人は\n冗談を書く余裕があった。それが分かるということだ。"}, {"t": 510.95, "x": "この紙は1959年2月26日、日記や\n所持品と一緒にテントの中から見つかり、"}, {"t": 516.8666666666667, "x": "刑事事件の記録に綴じられた。"}, {"t": 518.7833333333333, "x": "スキャンされた原本が、今でも見られる。"}, {"t": 521.3666666666667, "x": "9人が生きているあいだに残した、最後の紙だ。"}, {"t": 525.0833333333334, "x": "帰着の予定日は2月12日だった。"}, {"t": 527.5, "x": "だが、この予定日は、隊の中でも\nはっきり決まっていなかったらしい。"}, {"t": 531.3, "x": "山行は遅れることもある。"}, {"t": 532.85, "x": "数日の遅れで騒ぐ人はいなかった。"}, {"t": 535.4, "x": "それで、いつ気づいたの。"}, {"t": 537.1, "x": "本格的に動き出したのは2月20日ごろだ。"}, {"t": 539.8833333333333, "x": "家族が大学に押しかけて、捜索を要求した。"}, {"t": 543.15, "x": "ところが、ここで問題が起きる。"}, {"t": 545.0166666666667, "x": "9人がどこを歩いているのか、大学の側が\n正確に把握していなかったんだ。"}, {"t": 549.7666666666667, "x": "2月17日から19日にかけて、まず\nルートを復元する作業をしている。"}, {"t": 554.2, "x": "どの川をたどったのかを、\n残された書類から割り出した。"}, {"t": 557.6666666666666, "x": "2月20日、飛行機での偵察のために\nイヴデリへ人を送った。"}, {"t": 561.5333333333333, "x": "そこから先は早い。2月21日から25日にかけて、\n学生の隊がいくつも編成されて、現地へ投入された。"}, {"t": 568.7833333333333, "x": "スロプツォフの隊、\nグレベンニクの隊、アクセリロドの隊。"}, {"t": 572.2666666666667, "x": "さらに、イヴデリの収容所の看守隊、内務省の職員、\nそして地元のマンシの猟師たちも加わった。"}, {"t": 578.5333333333333, "x": "ずいぶん大きくなったのね。"}, {"t": 580.25, "x": "ああ。飛行機が飛び、\nヘリコプターが人と物資を運んだ。"}, {"t": 583.6, "x": "国が本気で人を出した捜索だった。"}, {"t": 586.1666666666666, "x": "公式の捜索の指揮を執ったのは軍の大佐だった。"}, {"t": 589.1166666666667, "x": "国の側が現場を仕切る形になっている。"}, {"t": 591.8, "x": "ちなみに、このときに作られた書類も、\nそのまま捜査記録に綴じられている。"}, {"t": 596.2333333333333, "x": "出発前に提出されたルートの書類、捜索中に\nやりとりされた無線の電報、現場から送られた報告。"}, {"t": 602.9, "x": "捜索の記録まで残ってるのね。"}, {"t": 605.1333333333333, "x": "残っている。だからこの事件は、"}, {"t": 607.05, "x": "9人が消えてから見つかるまでの20日間についても、\n日付を追って確かめられる。"}, {"t": 612.5333333333333, "x": "1959年2月26日。"}, {"t": 615.05, "x": "スロプツォフの隊が、\nホラート・シャフイルの斜面でテントを見つけた。"}, {"t": 618.8833333333333, "x": "見つけたのは、ボリス・スロプツォフさんと\nミハイル・シャラヴィンさんの2人だ。"}, {"t": 623.3, "x": "シャラヴィンさんは、そのときの様子をこう語っている。"}, {"t": 626.2333333333333, "x": "「テントは半分倒れ、雪をかぶっていた。"}, {"t": 628.6, "x": "中は空で、グループの持ち物と\n靴はすべて残されていた」"}, {"t": 632.4166666666666, "x": "靴も。"}, {"t": 633.1833333333333, "x": "靴も、上着も、斧も、食料も、カメラも、\n日記も、全部そのまま入っていた。"}, {"t": 638.75, "x": "逃げるときに何も持たなかったのね。"}, {"t": 641.0833333333334, "x": "持っていない。というより、持つ\n時間が無かったように見える。"}, {"t": 644.3833333333333, "x": "あとで行われた検死では、9人は最後の食事から\n6時間か8時間後に亡くなったと判定されている。"}, {"t": 650.4666666666667, "x": "テントを張ったのが夕方5時ごろだから、事件が\n起きたのはその日の夜ということになる。"}, {"t": 655.5833333333334, "x": "そして、屋根にあたる部分の右側に、\n大きな裂け目が入っていた。"}, {"t": 659.65, "x": "発見した2人は、この時点では何が起きたのか"}, {"t": 662.6, "x": "分からない。ただ、テントの中に\n誰もいないことだけが分かった。"}, {"t": 666.2833333333333, "x": "この日のうちに、イヴデリ市のテンパロフ検事が\n現場へ入り、刑事事件として立件している。"}, {"t": 671.4833333333333, "x": "事件を開く決定書の日付は、1959年2月26日だ。"}, {"t": 676.5166666666667, "x": "それはつまり、犯罪かもしれないと思ったってこと。"}, {"t": 679.7166666666667, "x": "そう考えるのが普通だろうな。"}, {"t": 681.4166666666666, "x": "9人が装備を全部置いて、テントを\n破って消えているんだから。"}, {"t": 685.0833333333334, "x": "ただ、このあと出てくる証拠は、\n全部その逆を指すことになる。"}, {"t": 689.4833333333333, "x": "テントのまわりの雪に、足あとが残っていた。"}, {"t": 692.25, "x": "捜査の記録では、8人分ないし9人分。\nその足あとは、テントから斜面を下る方向へ、"}, {"t": 697.5666666666667, "x": "一列になって続いていた。"}, {"t": 699.8333333333334, "x": "500メートルほど下ったところで、新しく\n降った雪に埋もれて見えなくなっている。"}, {"t": 704.65, "x": "全員が同じ方向に下りていったのね。"}, {"t": 707.0833333333334, "x": "そうだ。そして、ここが不可解なところなんだが、\n足あとの形が普通じゃない。"}, {"t": 711.85, "x": "靴下だけの足あと、素足の足あと、片方だけ靴を\n履いた足あと。そういうものが混じっていた。"}, {"t": 717.8666666666667, "x": "氷点下の斜面を、靴を置いたまま\n下りていったということになる。"}, {"t": 721.5666666666667, "x": "どうしてそんなことに。"}, {"t": 723.05, "x": "分からない。それが、この事件の中心にある問いだ。"}, {"t": 726.2333333333333, "x": "もう一つ、捜索に加わった人たちが\n揃って言っていることがある。"}, {"t": 730.25, "x": "足あとの形が、\n走ったものではなかった、ということだ。"}, {"t": 733.7, "x": "歩幅が乱れていない。"}, {"t": 735.0, "x": "普通に歩いたときの間隔で並んでいた。"}, {"t": 737.6666666666666, "x": "パニックで散らばったのではなく、9人が\nまとまって、同じ方向へ、歩いて下りていった。"}, {"t": 742.7, "x": "雪の上に残っていたのは、そういう形だった。"}, {"t": 745.85, "x": "もう一つ。この足あとは、そうとう長く残っていた。"}, {"t": 749.15, "x": "のちに雪崩説を検討した研究者たちが\n指摘しているのが、まさにそこだ。"}, {"t": 753.65, "x": "捜索隊が現場に入ったのは事件から\n3週間以上あとなのに、足あとが\nまだ見える状態で残っていた。"}, {"t": 760.0333333333333, "x": "雪崩が起きたなら、埋まってるはずよね。"}, {"t": 762.5333333333333, "x": "そういう反論になる。ここは、あとでもう\n一度出てくるから覚えておいてほしい。"}, {"t": 766.8333333333334, "x": "それから、争った跡はどこにもなかった。\nほかの誰かの足あとも見つかっていない。"}, {"t": 771.7333333333333, "x": "捜査ではマンシの人たちが疑われて、\n何人も取り調べを受けている。だが、"}, {"t": 776.2, "x": "他人の足あとが一つも無い以上、\n外から誰かが来た形にはならなかった。"}, {"t": 781.5333333333333, "x": "足あとをたどった先、テントから北東へおよそ1.5キロ。"}, {"t": 784.9333333333333, "x": "大きな杉の木の下に、焚き火の跡があった。"}, {"t": 787.8833333333333, "x": "その場所で、2月26日から27日にかけて、\nクリヴォニシチェンコとドロシェンコが見つかった。"}, {"t": 794.0333333333333, "x": "2人とも、上着も靴も身につけていなかった。"}, {"t": 796.8, "x": "検死の結論は、どちらも凍死だ。"}, {"t": 799.2833333333333, "x": "火は、つけられたのね。"}, {"t": 800.9, "x": "つけられていた。だが長くはもたなかった。"}, {"t": 803.5, "x": "そして2月27日、杉の木からテントのほうへ戻る\n途中の斜面で、ディアトロフが見つかった。"}, {"t": 809.2333333333333, "x": "杉の木から300メートルほど上だ。"}, {"t": 811.65, "x": "同じ日の夕方、そこからさらに330\nメートル上で、コルモゴロワが見つかった。"}, {"t": 816.8, "x": "3月5日には、ゾンデ棒を突き刺して探していた隊が、"}, {"t": 820.1833333333333, "x": "雪の15センチから20センチ下でスロボディンを\n見つけた。この3人も、同じ斜面の、"}, {"t": 825.4666666666667, "x": "同じ線の上にいた。"}, {"t": 827.0, "x": "3人とも、テントのほうを向いてたってこと。"}, {"t": 829.7666666666667, "x": "そうだ。下から上へ、テントへ戻ろうとする形だった。"}, {"t": 833.2, "x": "この3人の死因も、検死では凍死とされている。"}, {"t": 836.0333333333333, "x": "スロボディンさんには前頭部の骨にひびがあったが、\nそれが死につながる傷ではないと判定された。"}, {"t": 841.6333333333333, "x": "ここまでで5人。全員、凍死だ。"}, {"t": 843.8, "x": "この時点での捜査の見立ては、こうなる。"}, {"t": 846.0833333333334, "x": "9人はテントを出て、下の森まで行き、\nそこから戻ろうとして、戻りきれなかった。"}, {"t": 851.9, "x": "3月2日、捜索隊は、9人が2月1日に\n作ったあの食料庫を見つけた。"}, {"t": 857.2, "x": "テントから300メートルから400\nメートルほど離れた、森の中にあった。"}, {"t": 861.65, "x": "中身は、置いていったときのままだった。"}, {"t": 863.8666666666667, "x": "食料も、予備のスキーも、予備の登山靴2足も、\n救急箱も、マンドリンも、手つかずで残っていた。"}, {"t": 870.5666666666667, "x": "誰も、取りに来てないのね。"}, {"t": 872.4833333333333, "x": "来ていない。これは、地味だが重い事実だ。"}, {"t": 875.15, "x": "もし外から誰かが襲ってきて、9人が\nテントから逃げたのだとしよう。"}, {"t": 879.2, "x": "逃げるなら、装備のある場所へ行くのが当たり前だ。"}, {"t": 882.0, "x": "予備の靴が2足もあるんだからな。"}, {"t": 884.2833333333333, "x": "それに、その食料庫は森の中にある。"}, {"t": 886.65, "x": "風がしのげる。火も焚ける。"}, {"t": 888.5333333333333, "x": "だが、9人はそこへ行っていない。"}, {"t": 890.5833333333334, "x": "食料庫があったのは、\n峠の手前、アウスピヤ川の側だ。"}, {"t": 894.0333333333333, "x": "9人が下りたのは、その反対側の斜面だった。"}, {"t": 897.3, "x": "来た道を戻れば、装備があったのね。"}, {"t": 899.7833333333333, "x": "あった。だが9人は、来た\n道ではないほうへ、まとまって下りていった。"}, {"t": 903.8833333333333, "x": "もう一つ。1959年の捜査で、"}, {"t": 906.6333333333333, "x": "グループの貴重品はすべてテントの中に\n残っていたことが確認されている。"}, {"t": 910.8666666666667, "x": "金も、時計も、カメラも。"}, {"t": 912.9333333333333, "x": "物取りではない。争った跡もない。"}, {"t": 915.0, "x": "他人の足あともない。"}, {"t": 916.4, "x": "この事件が、犯罪としては早い段階で\n行き止まりになったのは、そういう理由だ。"}, {"t": 921.85, "x": "ここからが、この回の芯だ。"}, {"t": 923.7666666666667, "x": "1959年4月16日、鑑定人が\n一通の鑑定書を出している。"}, {"t": 928.5333333333333, "x": "第199号。テントの布を調べたものだ。"}, {"t": 931.75, "x": "鑑定したのはゲンリエッタ・チュルキナ鑑定人だ。"}, {"t": 934.6333333333333, "x": "1954年から鑑定の仕事をしている人だった。"}, {"t": 938.3333333333334, "x": "調べたのは、屋根にあたる\n天幕の右斜面に入っていた損傷だ。"}, {"t": 942.3666666666667, "x": "結論はこう書かれている。"}, {"t": 943.9333333333333, "x": "「長さおよそ32センチ、89センチ、"}, {"t": 946.6666666666666, "x": "42センチの3つの損傷は、"}, {"t": 948.7333333333333, "x": "何らかの鋭い凶器、すなわちナイフに\nよって作られたものであり、"}, {"t": 952.5333333333333, "x": "切創である。これらの切り口はすべて、\nテントの内側から入れられている」"}, {"t": 956.9833333333333, "x": "内側から。はっきりそう書いてあるのね。"}, {"t": 959.55, "x": "書いてある。しかも、この判定には根拠がある。"}, {"t": 962.45, "x": "チュルキナは布を顕微鏡で見ている。"}, {"t": 964.4, "x": "内側の面にだけ、細かい刺し跡と、繊維が切れた\n跡と、非常に細い擦り傷が残っていた。"}, {"t": 970.2166666666667, "x": "刃が内側から布に当たったときの痕だ。"}, {"t": 972.65, "x": "外側にはそれが無い。"}, {"t": 974.2666666666667, "x": "3つの切り口のほかに、2.2\nセンチの小さな刺し傷も一つあった。"}, {"t": 978.65, "x": "もう一つ、この鑑定書で\n大事なのは、区別のしかただ。"}, {"t": 982.2166666666667, "x": "テントには、この3つのほかにも"}, {"t": 983.7, "x": "損傷がたくさんあった。だがチュルキナは、\nそれらを「裂けたもの」と判定して、"}, {"t": 988.7666666666667, "x": "切り口とは別に扱っている。"}, {"t": 990.8666666666667, "x": "刃物で切られたのは3か所だけ。"}, {"t": 992.7666666666667, "x": "残りは、風や雪や、倒れたときに裂けたものだ、と。"}, {"t": 996.45, "x": "ちゃんと分けて調べてるのね。"}, {"t": 998.3, "x": "分けている。1959年の捜査は、"}, {"t": 1000.9833333333333, "x": "あとの時代に「素人の水準だった」と"}, {"t": 1003.35, "x": "批判されているんだが、この鑑定だけは、\nいま読んでも手続きがはっきりしている。"}, {"t": 1008.3, "x": "そしてこの89センチというのが、いちばん大きい。"}, {"t": 1011.3333333333334, "x": "人が通れる大きさだ。"}, {"t": 1012.8833333333333, "x": "つまり、誰かが外からテントを\n裂いて引きずり出したのではない。"}, {"t": 1016.3333333333334, "x": "中にいた人間が、中からナイフを\n入れて、布を切って出た。"}, {"t": 1020.2, "x": "入口があるのに。"}, {"t": 1021.4666666666667, "x": "あるんだ。テントには普通に出入り口がある。\nそれを使わずに、布を切って出ている。"}, {"t": 1026.2166666666667, "x": "私は、この事件で確実なことは、\n突き詰めるとここだけだと思っている。"}, {"t": 1030.65, "x": "あとは全部、説明の候補だ。"}, {"t": 1033.3833333333334, "x": "残る4人は、長いこと見つからなかった。"}, {"t": 1036.0333333333333, "x": "見つかったのは、雪が解け始めた5月だ。"}, {"t": 1038.6666666666667, "x": "1959年5月4日から5日にかけて。"}, {"t": 1041.9833333333333, "x": "きっかけは、捜索に加わっていた\nマンシの人たちの気づきだった。"}, {"t": 1045.8, "x": "杉の木と、70メートルほど離れた沢のあいだで、"}, {"t": 1048.9333333333334, "x": "雪の下から木の枝と布の切れ端が\n出てきているのに気づき、掘ってみようと言った。"}, {"t": 1053.9666666666667, "x": "掘って出てきたのは、枝で作った敷物だった。"}, {"t": 1057.0666666666666, "x": "敷物。"}, {"t": 1057.9833333333333, "x": "杉の近くで切った若いモミの木14本と、\nシラカバ1本。その先端を並べて、"}, {"t": 1062.9666666666667, "x": "3平方メートルほどの敷物にしてある。"}, {"t": 1065.4166666666667, "x": "雪の2.5メートル下にあった。"}, {"t": 1067.7, "x": "寒さをしのぐために、誰かが作ったものだ。"}, {"t": 1070.5, "x": "そしてその近く、沢の中から、ドゥビニナ、\nチボー・ブリニョール、コレヴァトフ、"}, {"t": 1075.1833333333334, "x": "ゾロタリョフの4人が見つかった。"}, {"t": 1077.0333333333333, "x": "雪の2メートルから2.5メートル下だった。"}, {"t": 1079.9166666666667, "x": "ここで、それまでの前提が崩れる。"}, {"t": 1082.1166666666666, "x": "この4人のうち3人に、大きな外傷があった。"}, {"t": 1085.05, "x": "検死の結論は、ドゥビニナが胸の骨折にともなう出血、"}, {"t": 1088.65, "x": "ゾロタリョフが右側の多発肋骨骨折、\nチボー・ブリニョールが頭蓋骨の陥没骨折。"}, {"t": 1093.7333333333333, "x": "コレヴァトフの死因は凍死とされた。"}, {"t": 1096.2333333333333, "x": "さっきの5人とは、全然違うのね。"}, {"t": 1098.7333333333333, "x": "違う。だから、この事件の話は\nここで一気にややこしくなる。"}, {"t": 1102.5833333333333, "x": "検死をしたヴォズロジデンヌイ医師は、\n取り調べでこう述べている。この外傷は、"}, {"t": 1106.8, "x": "自分の身長から転んだ程度では生じない。"}, {"t": 1109.35, "x": "明らかにそれを超える力による、と。"}, {"t": 1111.8333333333333, "x": "例として挙げたのが、高速で\n走る自動車の衝突と、爆風だ。"}, {"t": 1115.9666666666667, "x": "そして、彼はこうも言っている。これほどの力が\n加わっているのに、それをやったのが人間の手だとは"}, {"t": 1121.55, "x": "考えにくい、と。"}, {"t": 1122.85, "x": "なお、この判定には後年、異論も出ている。"}, {"t": 1125.4333333333334, "x": "別の法医学者は、スロボディンさんと\nチボー・ブリニョールさんの頭の損傷は"}, {"t": 1129.7833333333333, "x": "生きているあいだのものではなく、\n死んだあとに生じたものだとしている。"}, {"t": 1133.6166666666666, "x": "1959年の捜査そのものを、低い\n水準のものだったと評価する専門家もいる。"}, {"t": 1139.7333333333333, "x": "5月に見つかった4人については、\nもう一つ検査が行われている。"}, {"t": 1143.7833333333333, "x": "1959年5月18日から27日にかけて、\nスヴェルドロフスク市の主任放射線医、"}, {"t": 1149.85, "x": "レヴァショフ医師が、衣服と組織の放射能を測った。"}, {"t": 1153.2833333333333, "x": "放射線。なんでそんなものを測ったの。"}, {"t": 1155.8, "x": "記録には理由が書かれていない。"}, {"t": 1157.5, "x": "検事捜査官が指示したことだけが残っている。"}, {"t": 1160.4, "x": "数字を言う。衣服は全般に、"}, {"t": 1162.1833333333334, "x": "周りの環境より毎分200から300\nカウント高かった。ある一着のセーターは、"}, {"t": 1167.0333333333333, "x": "150平方センチあたり毎分9900カウント。"}, {"t": 1170.2666666666667, "x": "別の一点は5600カウントだった。"}, {"t": 1173.1833333333334, "x": "一方で、組織のほうの数値は、\n1キログラムあたり10億分の0.\n4から3.8キュリーの範囲だ。"}, {"t": 1179.3666666666666, "x": "鑑定人の結論はこうだ。"}, {"t": 1181.0, "x": "組織の放射能は「自然のレベルの範囲内であり、"}, {"t": 1184.0, "x": "カリウム40という同位体の存在に\nよるもの」。つまり普通だ。"}, {"t": 1187.7833333333333, "x": "だが衣服については「わずかに\n過剰な量の放射性物質」があり、\nベータ線を出していた、と書いている。"}, {"t": 1194.0166666666667, "x": "衣服だけ高かったのね。"}, {"t": 1195.7833333333333, "x": "そうだ。そして、ここが大事なんだが、\nこの鑑定書は、なぜ高いのかを書いていない。"}, {"t": 1200.8666666666666, "x": "原因は特定されていない。"}, {"t": 1202.4, "x": "特定されないまま、数字だけが記録に残った。"}, {"t": 1205.55, "x": "それに、測られたのは5月に見つかった4人だけだ。"}, {"t": 1208.6333333333334, "x": "2月と3月に見つかった5人は、\nこの検査を受けていない。"}, {"t": 1212.4166666666667, "x": "じゃあ、9人全員が高かったのか\nどうかも、分からないのね。"}, {"t": 1216.2, "x": "分からない。記録に残っているのは、\n4人分の数字だけだ。"}, {"t": 1219.8666666666666, "x": "この「衣服から放射線」という一行が、あとで\n核実験だの秘密兵器だのという話に使われていく。"}, {"t": 1226.2833333333333, "x": "だが、鑑定書が言っているのは、わずかに\n過剰だった、というところまでだ。それ以上のことは"}, {"t": 1231.5, "x": "書いていない。私もそれ以上は言わない。"}, {"t": 1234.5, "x": "1959年5月28日。"}, {"t": 1237.0333333333333, "x": "冒頭に出した、あの決定書だ。"}, {"t": 1239.2166666666667, "x": "作ったのはレフ・イワノフ検事。"}, {"t": 1241.1333333333334, "x": "スヴェルドロフスク州のクリノフ検事が\n承認し、捜査部の副部長が合意している。"}, {"t": 1246.05, "x": "結論は、さっき読んだとおりだ。"}, {"t": 1247.95, "x": "「登山者たちの死因は、彼らが\n克服することのできなかった自然の力であった」。"}, {"t": 1252.9166666666667, "x": "犯罪の事実はない。だから事件は\n終わりだ。そういう決定だった。"}, {"t": 1257.0333333333333, "x": "その「自然の力」が何なのかは、\nやっぱり書いてないのね。"}, {"t": 1261.0333333333333, "x": "書いていない。そして、\n書いていないことは、ほかにもある。"}, {"t": 1264.3666666666666, "x": "この決定書には、こういう一行もある。"}, {"t": 1266.6333333333334, "x": "テントは、全員によって、\n突然、同時に放棄された、と。"}, {"t": 1270.6, "x": "その原因は特定されていない、とも書いてある。"}, {"t": 1273.3666666666666, "x": "国自身が、「なぜ出たのかは分からない」と\n書いたまま、事件を閉じたんだ。"}, {"t": 1277.8, "x": "さっき言ったとおり、この決定書は\n隊長の山の判断については\n2点、はっきり指摘している。"}, {"t": 1283.1166666666666, "x": "登り始めた時刻と、進路のずれだ。"}, {"t": 1285.7333333333333, "x": "山の判断のミスは書けるのに、テントを\n出た理由だけは書けなかった。"}, {"t": 1289.9, "x": "日付を見ると、ずいぶん早いのね。"}, {"t": 1292.1833333333334, "x": "気づいたか。最後の4人が見つかったのが\n5月5日だ。この決定書は5月28日。"}, {"t": 1297.55, "x": "23日しかたっていない。"}, {"t": 1299.4833333333333, "x": "検死の鑑定も、放射線の鑑定も、\n5月の下旬に出ている。それを\n受け取って、その月のうちに閉じている。"}, {"t": 1306.2, "x": "記録はこのあと特別保管に回され、\n1974年に州の公文書館へ移された。"}, {"t": 1311.9, "x": "そこから40年近く、ほとんど\n誰も読めない状態が続いた。"}, {"t": 1316.4, "x": "ここで一つ、公式の記録ではない話をする。だから、\nそういうものとして聞いてほしい。"}, {"t": 1321.7833333333333, "x": "1990年11月、カザフスタンのクスタナイという\n町の地方紙に、二回に分けて記事が載った。"}, {"t": 1328.0, "x": "題は「火の玉の謎」。"}, {"t": 1329.7333333333333, "x": "書いたのは、レフ・イワノフだ。"}, {"t": 1331.55, "x": "31年前にあの決定書を書いた、その本人だ。"}, {"t": 1335.1666666666667, "x": "捜査した人が、自分で書いたの。"}, {"t": 1337.55, "x": "書いた。ソ連が終わりかけていた時期で、\nそれまで言えなかったことを言う人が増えていた。"}, {"t": 1342.5333333333333, "x": "イワノフは、報告に行ったときに州の党の幹部から\n受けた指示を、こう書いている。"}, {"t": 1347.0333333333333, "x": "「すべてを機密にし、封をして、\n特別部門に引き渡し、そして忘れろ」。"}, {"t": 1351.8333333333333, "x": "もう一人の幹部からは、作業をすべて機密扱いにし、"}, {"t": 1355.1, "x": "情報を一言も漏らすな、という\n命令があったとも書いている。"}, {"t": 1358.8333333333333, "x": "そして彼は、光る球体の目撃が\n複数あったことを挙げて、9人は\n未知の飛行物体に遭遇したのだと自分は"}, {"t": 1365.5166666666667, "x": "考えている、と書いた。"}, {"t": 1367.2166666666667, "x": "捜査した本人が、そう言ったのね。"}, {"t": 1369.65, "x": "言った。だが、ここは分けて聞いてほしい。これは"}, {"t": 1372.4833333333333, "x": "1990年の新聞記事であって、\n捜査記録ではない。彼の考えだ。"}, {"t": 1377.1833333333334, "x": "私が引っかかったのは、その先だ。"}, {"t": 1379.6333333333334, "x": "イワノフは記事の中で、記者に\nこう頼んだと書いている。"}, {"t": 1382.6666666666667, "x": "被害者の遺族に対して、真実を歪め、真実を\n隠したことについての謝罪を載せてほしい、と。"}, {"t": 1388.8166666666666, "x": "そして、ドゥビニナ、チボー・ブリニョール、\nゾロタリョフの遺族に、名前を挙げて謝っている。"}, {"t": 1394.1166666666666, "x": "事件を閉じた本人が、31年後にそう\n書いた。それは事実として残っている。"}, {"t": 1399.85, "x": "時間を飛ばす。2018年の秋だ。"}, {"t": 1402.4833333333333, "x": "遺族と世論の求めを受けて、ロシア連邦検察庁が、"}, {"t": 1405.75, "x": "60年前のこの刑事事件記録を\n点検し直す作業を始めた。"}, {"t": 1409.95, "x": "公表されたのは2019年2月1日。"}, {"t": 1412.6166666666666, "x": "当時のユーリ・チャイカ検事総長の承認のもとだった。"}, {"t": 1416.0333333333333, "x": "検察庁の報道官はこう言っている。"}, {"t": 1418.1333333333334, "x": "「刑事事件記録はすでに\n分析済みで、400ページを超える。"}, {"t": 1421.7333333333333, "x": "多くの鑑定も行われている」"}, {"t": 1423.7833333333333, "x": "もう一度、全部読み直したってこと。"}, {"t": 1426.25, "x": "そうだ。そして、このとき検察は、\n検討する説を3つに絞ると発表した。"}, {"t": 1431.3166666666666, "x": "雪崩。いわゆる「雪の板」、つまり固まった雪の層が\n滑り落ちるもの。そして、ハリケーン級の吹雪。"}, {"t": 1437.8, "x": "この3つだけだ、と。"}, {"t": 1439.2833333333333, "x": "理由も言っている。「検討したすべての説は\n自然現象に関わるものであり、\n犯罪は完全に除外されている」"}, {"t": 1445.7166666666667, "x": "最初から、犯罪の線は見ないって決めたのね。"}, {"t": 1448.7666666666667, "x": "そうだ。ここは覚えておいてほしい。"}, {"t": 1450.6333333333334, "x": "60年前の捜査も、今回の点検も、最初から\n犯罪ではないという前提に立っている。"}, {"t": 1456.2833333333333, "x": "担当したのは、アンドレイ・クリヤコフ検察官だ。"}, {"t": 1459.4833333333333, "x": "彼はこう言っている。"}, {"t": 1460.5333333333333, "x": "「終止符を打たない限り、このような\n状況はまた繰り返されうる」"}, {"t": 1464.1666666666667, "x": "クリヤコフたちは現地へ行った。"}, {"t": 1465.85, "x": "地形の3次元モデルを作るためのデータを\n集め、いくつかの実験もやっている。"}, {"t": 1470.6166666666666, "x": "1959年の決定書には、雪崩という\n言葉は一度も出てこない。"}, {"t": 1474.9833333333333, "x": "「克服できない自然の力」としか書かれていない。"}, {"t": 1478.25, "x": "60年後の点検は、その中身を\n自分たちで決めにいったことになる。"}, {"t": 1482.5833333333333, "x": "でも、60年たってるのよね。"}, {"t": 1484.5166666666667, "x": "現場に何が残ってるのかしら。"}, {"t": 1486.7, "x": "いい質問だ。雪はとっくに無い。"}, {"t": 1488.6666666666667, "x": "当時の斜面は、写真と図面でしか残っていない。"}, {"t": 1491.75, "x": "だから、この点検が使えた材料も、結局は\nあの400ページの記録と、いまの地形そのものだ。"}, {"t": 1497.65, "x": "新しい物証が出てきたわけではない。"}, {"t": 1500.5833333333333, "x": "2020年7月11日、検察は結論を公表した。"}, {"t": 1504.5666666666666, "x": "死因は雪崩だ、というものだった。"}, {"t": 1506.6333333333334, "x": "クリヤコフが説明した経過は、こうだ。"}, {"t": 1509.0833333333333, "x": "天候が急に悪化して、テントの上の雪が崩れた。"}, {"t": 1512.1666666666667, "x": "9人はテントを切って緊急に脱出した。"}, {"t": 1514.9833333333333, "x": "全員で50メートルほど下り、雪を\n止める岩の連なりのところまで離れた。"}, {"t": 1519.5166666666667, "x": "そこで振り返ったとき、テントが見えなくなっていた。"}, {"t": 1522.65, "x": "見えなくなった。すぐそこなのに。"}, {"t": 1524.8166666666666, "x": "検察が挙げた数字がある。\nそのときの見通しは6メートルから16メートル。"}, {"t": 1529.1833333333334, "x": "気温は氷点下40度から45度で、\n身を切る風が吹いていた、と。"}, {"t": 1533.5333333333333, "x": "断っておくと、この氷点下40度という\n数字は、2020年に検察が公表したものだ。"}, {"t": 1539.1333333333334, "x": "1959年の実測値ではない。"}, {"t": 1541.8833333333334, "x": "50メートル離れたら、16メートル先までしか見えない。"}, {"t": 1545.2333333333333, "x": "テントはもう無いのと同じだ。"}, {"t": 1547.0333333333333, "x": "検察は、この点を実験で確かめたと言っている。"}, {"t": 1550.0333333333333, "x": "現地で、目を閉じた状態では、だいたい"}, {"t": 1552.2, "x": "どの方向にあるかを知っていても\nテントを見つけることはできない、と。"}, {"t": 1556.2, "x": "その先はこうだ。9人は\n下の杉の木まで下りて、火を焚いた。"}, {"t": 1559.95, "x": "火は1時間半しかもたなかった。\nそこで2人が凍死した。"}, {"t": 1563.7833333333333, "x": "残りは分かれた。一方は足あとをたどって\nテントへ戻ろうとして、斜面の途中で力尽きた。"}, {"t": 1569.3666666666666, "x": "もう一方は、雪を掘って身を隠す場所を\n作ろうとし、そのときに雪が動いて、"}, {"t": 1573.9333333333334, "x": "3メートルの雪の下になった。"}, {"t": 1576.0833333333333, "x": "クリヤコフは、こう締めくくった。"}, {"t": 1578.05, "x": "「英雄的な闘いだった。"}, {"t": 1579.6, "x": "パニックはなかった。だがこの状況で\n助かる見込みは、彼らにはなかった」"}, {"t": 1584.0666666666666, "x": "そして、こう言った。"}, {"t": 1585.2666666666667, "x": "「形式的にはこれが最終だ。"}, {"t": 1587.15, "x": "問題は閉じられた」"}, {"t": 1589.15, "x": "ところが、閉じられなかった。"}, {"t": 1590.9833333333333, "x": "発表の直後から、遺族らの財団が反発した。"}, {"t": 1594.1, "x": "ディアトロフ財団という、公的な記念団体だ。"}, {"t": 1597.2, "x": "財団は、この結論に同意しないと\n表明した。さらに2020年8月、"}, {"t": 1601.8666666666666, "x": "検察庁に対して、\nクリヤコフの行為についての服務監査を求め、"}, {"t": 1605.9333333333334, "x": "検察庁の公式サイトに訂正を載せるよう要求した。"}, {"t": 1609.4666666666667, "x": "遺族が、国の結論に正面から反対したのね。"}, {"t": 1612.8166666666666, "x": "した。そして、その3か月後に\n起きたことが、私には引っかかっている。"}, {"t": 1617.4666666666667, "x": "2020年11月2日、クリヤコフが検察庁を解任された。"}, {"t": 1621.8666666666666, "x": "結論を出した人が。"}, {"t": 1623.5, "x": "そうだ。イーゴリ・\nクラスノフ検事総長の処分命令には、\n理由がこう書かれている。"}, {"t": 1628.3666666666666, "x": "「職務上の権限の範囲外で、上司の指示なく、"}, {"t": 1631.2833333333333, "x": "法学の学位論文の準備という個人的な目的のために、"}, {"t": 1634.8666666666666, "x": "1959年の登山グループの死亡をめぐる状況について、"}, {"t": 1638.7, "x": "スヴェルドロフスク州検察庁の活動に\n関する公的な発言と評価を行った」"}, {"t": 1643.75, "x": "ここは正確に受け取ってほしい。"}, {"t": 1645.5, "x": "雪崩という結論が間違っていた、と\n言われたわけではない。"}, {"t": 1649.0166666666667, "x": "問題にされたのは、彼が権限の外で\n公に発言したことだ。そう書いてある。"}, {"t": 1654.0166666666667, "x": "ただ、結果として何が起きたか。"}, {"t": 1656.05, "x": "国が公式に発表した結論なのに、その発表をした\n人物が処分され、遺族はその結論を認めていない。"}, {"t": 1662.95, "x": "60年前は、捜査記録が機密にされて表に出なかった。"}, {"t": 1666.6666666666667, "x": "60年後は、結論が出たのに、国の中でも\n遺族の側でも決着していない。"}, {"t": 1671.75, "x": "この事件は、そういう形をしている。"}, {"t": 1674.6833333333334, "x": "検察の発表の半年後、\n別の場所から別の答えが出てきた。"}, {"t": 1678.8, "x": "2021年1月28日、スイスの研究者2人が、\n科学雑誌に論文を出した。"}, {"t": 1684.6333333333334, "x": "ヨハン・ゴーム教授と、\nアレクサンダー・プズリン教授。"}, {"t": 1687.45, "x": "雪崩と地盤の専門家だ。"}, {"t": 1689.1833333333334, "x": "雑誌はコミュニケーションズ・\nアース・アンド・エンバイロメント。"}, {"t": 1693.1666666666667, "x": "ちなみにこの公開日は、9人が出発した\n1959年1月28日の、ちょうど62年後にあたる。"}, {"t": 1700.4666666666667, "x": "わざと合わせたのかしら。"}, {"t": 1702.0666666666666, "x": "そうらしいな。"}, {"t": 1702.9333333333334, "x": "彼らがやったのは、数値の計算だ。"}, {"t": 1705.1333333333334, "x": "雪の層がどう崩れるかを計算する模型を\n作って、あの斜面の条件を入れた。"}, {"t": 1709.9333333333334, "x": "出てきた筋書きはこうだ。"}, {"t": 1711.4166666666667, "x": "テントの上の斜面は傾き28度。そこに\nカタバ風という、斜面を吹き下ろす風が雪を運んで、"}, {"t": 1717.3333333333333, "x": "少しずつ積み増していく。\nそれが固い「雪の板」になる。"}, {"t": 1721.2833333333333, "x": "そして9人は、テントを水平にするために斜面を\n掘った。この切り込みが、板を不安定にした。"}, {"t": 1727.1333333333334, "x": "崩れた板は、5メートル四方ほどしかない。"}, {"t": 1729.5666666666666, "x": "走った距離も、テントの1、2メートル下までだ。"}, {"t": 1732.9166666666667, "x": "そんなに小さいの。捜索の人たちが\n雪崩の跡に気づかないくらい。"}, {"t": 1737.1333333333334, "x": "そこが、この論文の主張のかなめだ。"}, {"t": 1739.4333333333334, "x": "小さいから跡が残らない。そして小さくても、\n寝ている人の上に乗れば、"}, {"t": 1743.7333333333333, "x": "胸や頭の骨が折れるだけの力にはなる。"}, {"t": 1746.5166666666667, "x": "ただし、著者自身が留保をつけている。"}, {"t": 1748.7333333333333, "x": "ゴームはこう言っている。"}, {"t": 1750.0333333333333, "x": "「われわれは、外傷がテントの中で\n生じたと主張しているわけではない。"}, {"t": 1753.8833333333334, "x": "板がそれを起こすだけの重さだったと\n言っているだけで、他の可能性にも開かれている」"}, {"t": 1758.8833333333334, "x": "この論文には反論も多い。"}, {"t": 1760.45, "x": "現場に雪崩の堆積の跡が見当たらないこと。\nその後100回を超える遠征で、この場所で"}, {"t": 1766.05, "x": "雪崩の条件が報告されていないこと。"}, {"t": 1767.9333333333334, "x": "ディアトロフとゾロタリョフは経験のある\n登山者で、雪崩の通り道にテントを張るとは"}, {"t": 1772.4, "x": "考えにくいこと。そして、足あとが\n走った形ではなかったこと。"}, {"t": 1776.65, "x": "2人はその後、現地へ3回の遠征に出ている。"}, {"t": 1779.4666666666667, "x": "2022年に出した2本目の論文では、\nこの地域が実際に雪崩を起こしやすいこと、"}, {"t": 1784.65, "x": "斜面の傾きが雪崩を起こすのに\n足りていることを確かめたと書いている。"}, {"t": 1789.4666666666667, "x": "ここまで、公的な記録と論文だけで話してきた。"}, {"t": 1792.75, "x": "だが、この事件を有名にしたのは、そっちじゃない。"}, {"t": 1795.6666666666667, "x": "UFOだ、秘密兵器だ、雪男だ、という話のほうだ。"}, {"t": 1799.75, "x": "私も、そっちで名前を知ったわ。"}, {"t": 1802.0833333333333, "x": "だろうな。だから、その説そのものの中身は話さない。"}, {"t": 1805.4, "x": "確かめられていないからだ。"}, {"t": 1807.0833333333333, "x": "代わりに、なぜそういう説が出てきたのかを話す。"}, {"t": 1809.9, "x": "出どころは、だいたい記録の中にある。"}, {"t": 1812.3666666666666, "x": "まず、光る球体だ。1959年4月15日、"}, {"t": 1816.1833333333334, "x": "ウラジスラフ・カレリンさんという\n証人が取り調べを受けている。"}, {"t": 1819.6, "x": "彼の隊は、ディアトロフ隊と同じ地域の50\nキロから60キロ南を歩いていた。"}, {"t": 1824.6166666666666, "x": "カレリンさんはこう証言した。"}, {"t": 1826.2333333333333, "x": "1959年2月17日の朝7時半ごろ、"}, {"t": 1829.8, "x": "大きな明るい光の斑点が空に現れて大きくなり、\nその中心に小さな星が現れてそれも大きくなった。"}, {"t": 1836.1833333333334, "x": "斑点は北東から南西へ動いて、下へ落ちていった。"}, {"t": 1839.7166666666667, "x": "2月17日。事件の夜じゃないのね。"}, {"t": 1842.5166666666667, "x": "そこが大事なところだ。"}, {"t": 1843.8833333333334, "x": "9人がテントを張ったのは2月1日だ。\nこの目撃は、2週間以上あとの話になる。"}, {"t": 1849.4833333333333, "x": "だが、こういう証言が記録に"}, {"t": 1851.3, "x": "残っていて、それを1990年にイワノフ本人が\n自分の記事で持ち出した。だからUFOの話が残った。"}, {"t": 1858.0666666666666, "x": "次に、秘密兵器の説。これは、\nさっきの放射線の鑑定書の数字と、"}, {"t": 1862.6333333333334, "x": "ヴォズロジデンヌイが外傷の例として\n爆風を挙げたこと、この2つが元になっている。"}, {"t": 1867.6333333333334, "x": "どちらも記録にある事実だ。だが、\n記録はそこから先を何も書いていない。"}, {"t": 1872.1666666666667, "x": "雪男の説の出どころは、たぶん\nテントの中から見つかった、あの壁新聞だ。"}, {"t": 1876.8833333333334, "x": "9人が自分で書いた冗談だ。"}, {"t": 1879.0, "x": "それから、超低周波音の説というのもある。"}, {"t": 1881.6333333333334, "x": "山の形が風で渦を作り、人が不安になる\n音を出したというものだ。これは2013年に本で"}, {"t": 1887.6666666666667, "x": "発表された説で、査読を受けた論文ではない。"}, {"t": 1890.5666666666666, "x": "もう一つ言っておく。"}, {"t": 1891.7166666666667, "x": "捜査記録の表紙には\n1959年2月6日という日付があって、"}, {"t": 1896.1333333333334, "x": "遺体が見つかる前に事件が\n立件されていた証拠だ、と言われてきた。"}, {"t": 1900.35, "x": "だが、これは証人の供述書の日付の書き誤りが\n表紙に引き継がれたものだとされている。"}, {"t": 1905.55, "x": "3月6日を2月6日と書いた。"}, {"t": 1907.6666666666667, "x": "テンパロフは他にも日付を書き誤っている。"}, {"t": 1910.4666666666667, "x": "私はこれらの説を\n否定はしない。だが、肯定もしない。"}, {"t": 1913.8166666666666, "x": "公的な記録で確かめられないからだ。"}, {"t": 1916.8833333333334, "x": "ここからは、私の見方だ。"}, {"t": 1918.7333333333333, "x": "事実と分けて聞いてほしい。"}, {"t": 1920.45, "x": "この事件を記録だけで追ってみて、\n引っかかったことが三つある。"}, {"t": 1924.2166666666667, "x": "一つ目。確実なことは、思っているより\nずっと少ない、ということだ。"}, {"t": 1928.5666666666666, "x": "この事件で、書類で確定していることは何か。"}, {"t": 1931.4333333333334, "x": "テントの切り口が内側から入れられていること。"}, {"t": 1934.0666666666666, "x": "食料庫が手つかずだったこと。"}, {"t": 1935.9333333333334, "x": "貴重品が全部残っていたこと。"}, {"t": 1937.9, "x": "他人の足あとが無かったこと。"}, {"t": 1939.6666666666667, "x": "足あとが走った形ではなかったこと。"}, {"t": 1942.0333333333333, "x": "5人が凍死で、3人に大きな外傷があったこと。"}, {"t": 1945.3833333333334, "x": "それだけ。"}, {"t": 1946.3, "x": "それだけだ。あとは全部、その事実を\nどう並べるかという話になる。"}, {"t": 1950.3, "x": "雪崩も、雪の板も、吹雪も、並べ方の候補だ。"}, {"t": 1954.0333333333333, "x": "二つ目。60年たっても、\n結論のほうが割れていることだ。"}, {"t": 1957.9, "x": "1959年、国は「克服できない自然の力」と書いた。"}, {"t": 1962.2666666666667, "x": "中身は書かなかった。"}, {"t": 1963.6, "x": "2020年、国は雪崩だと発表した。その3か月後、\n発表した検察官が権限外だとして外された。"}, {"t": 1970.6, "x": "遺族の財団は、いまも同意していない。"}, {"t": 1973.1333333333334, "x": "2021年、スイスの研究者が計算で\n説明を出した。だが著者自身が、"}, {"t": 1977.9666666666667, "x": "外傷がテントの中で起きたと\n主張しているわけではない、と言っている。"}, {"t": 1982.05, "x": "誰も、最後まで言い切っていない。"}, {"t": 1984.0833333333333, "x": "三つ目。これがいちばん引っかかる。"}, {"t": 1986.25, "x": "1959年の決定書は、「テントは全員によって突然、"}, {"t": 1990.1333333333334, "x": "同時に放棄された」と書いたうえで、\n「その原因は特定されていない」と書いた。"}, {"t": 1994.95, "x": "60年後の点検でも、この一行は埋まっていない。"}, {"t": 1998.0, "x": "雪崩だとされても、なぜ靴を置いたままだったのかは"}, {"t": 2001.0166666666667, "x": "説明されない。なぜ全員が同じ方向へ、普通に\n歩いて下りていったのかも説明されない。"}, {"t": 2006.2666666666667, "x": "下山事件のときと違って、\nこの事件の記録は隠されていない。"}, {"t": 2010.1333333333334, "x": "開いている。誰でも読める。"}, {"t": 2012.0833333333333, "x": "読めるのに、決まらない。そこが、この事件が\nいまだに語られ続けている理由だと思う。"}, {"t": 2017.25, "x": "確かなことが少ないところには、\nいくらでも物語が入り込む。"}, {"t": 2021.0, "x": "UFOも、兵器も、雪男も、そこへ入ってきた。"}, {"t": 2024.6666666666667, "x": "ただ、入り込む余地がある\n理由は、記録を読めば分かる。"}, {"t": 2027.8166666666666, "x": "国自身が「分からない」と書いているからだ。"}, {"t": 2031.3, "x": "最後に、一つだけ言っておきたいことがある。"}, {"t": 2033.9333333333334, "x": "この事件は、世界一有名な未解決の遭難として、\n謎の題材として扱われてきた。"}, {"t": 2039.5166666666667, "x": "だが、あの斜面にいたのは、20歳から38歳の9人だ。"}, {"t": 2043.5666666666666, "x": "大学5年生が2人、4年生が3人、"}, {"t": 2046.1666666666667, "x": "卒業して働き始めた技師が3人。\nそして観光基地のインストラクターが1人。"}, {"t": 2051.4, "x": "最年長のゾロタリョフの誕生日は2月2日だった。"}, {"t": 2054.45, "x": "テントを張った2月1日の、翌日だ。"}, {"t": 2057.266666666667, "x": "クリヴォニシチェンコの誕生日は2月7日だった。"}, {"t": 2060.0333333333333, "x": "テントを張った日の、6日後だ。"}, {"t": 2062.05, "x": "彼らは重い山行の途中で、その日の夕方には、\nテントの中で冗談を書いた壁新聞を作っていた。"}, {"t": 2068.3166666666666, "x": "あの「夕刊オトルテン」ね。"}, {"t": 2070.266666666667, "x": "そうだ。あれが、9人が生きているあいだに\n残した最後の紙になった。"}, {"t": 2074.4333333333334, "x": "そして、1月28日に脚を痛めて\n引き返した、ユーリ・ユーディン。"}, {"t": 2078.983333333333, "x": "彼はそのあと54年生き、2013年に75歳で亡くなった。"}, {"t": 2083.1833333333334, "x": "自分だけが帰ってきたことを、\n最後まで語り続けた人だった。"}, {"t": 2087.2833333333333, "x": "今回の話で使った資料は、全部公開されている。"}, {"t": 2090.5333333333333, "x": "1959年の刑事事件記録は、\n州の公文書館から写しが出ていて、"}, {"t": 2095.4666666666667, "x": "鑑定書も検死の結論も事件終結の決定書も、\nページ番号つきでネット上に上がっている。"}, {"t": 2101.25, "x": "2020年の検察の発表は、ロシアの主な通信社が\n全文に近い形で報じている。"}, {"t": 2106.6833333333334, "x": "2021年と2022年の論文は、誰でも\n読める形で公開されている。"}, {"t": 2111.866666666667, "x": "興味を持った人は、ぜひ自分で見てみてほしい。"}, {"t": 2114.5666666666666, "x": "60年以上前の手書きの鑑定書が、そのまま残っている。"}, {"t": 2118.483333333333, "x": "私は今回、死因を決めなかった。"}, {"t": 2120.6833333333334, "x": "国自身が2度結論を出そうとして、\n2度とも決着していない事件で、\n私が決める理由がないからだ。"}, {"t": 2127.0, "x": "ただ、一つだけ確かなことがある。\nこの事件の記録は、開いている、ということだ。"}, {"t": 2132.3166666666666, "x": "開いているのに、決まらないのね。"}, {"t": 2134.483333333333, "x": "ああ。隠されていたころは、隠されているから\n分からないのだと言えた。いまは、それが言えない。"}, {"t": 2139.5666666666666, "x": "読めるのに決まらない。"}, {"t": 2140.8166666666666, "x": "私はそのことのほうが、この事件の本当に\n厄介なところだと思っている。"}, {"t": 2145.45, "x": "この事件について、あなたはどう\n考えるか。よかったらコメントで教えてほしい。"}, {"t": 2150.0, "x": "最後まで見てくれて、ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
