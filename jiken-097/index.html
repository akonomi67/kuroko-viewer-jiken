<script>
const D={"name": "097", "file": "097_編集用", "dur": 2120.95, "segs": [], "subs": [{"t": 0.0, "x": "1970年3月31日の朝、国会の一室で、\n一人の男が報告を読み上げている。"}, {"t": 6.433333333333334, "x": "衆議院の運輸委員会だ。"}, {"t": 8.066666666666666, "x": "読んでいるのは、山村新治郎 運輸政務次官。"}, {"t": 11.166666666666666, "x": "内容は、その朝に\n起きたばかりの飛行機の乗っ取りについてだ。"}, {"t": 15.0, "x": "起きたばかりのことを、もう国会で話してるの？"}, {"t": 17.966666666666665, "x": "話している。まだ全部が動いている最中だ。"}, {"t": 20.733333333333334, "x": "会議録に、こう残っている。"}, {"t": 22.566666666666666, "x": "「東京発七時十分、\n福岡行きのボーイング727でございます」"}, {"t": 26.716666666666665, "x": "「日航の351便でございます」"}, {"t": 28.85, "x": "そのあと、乗客が何人で、乗員が何人で、\n犯人が何を持っているかを、順番に読んでいく。"}, {"t": 34.93333333333333, "x": "最後に、こう締めている。"}, {"t": 36.483333333333334, "x": "「これが九時三十分現在でございます」"}, {"t": 39.016666666666666, "x": "現在、って。"}, {"t": 40.06666666666667, "x": "現在だ。まだ飛行機は福岡の地面にいる。"}, {"t": 42.9, "x": "この報告を読み上げているとき、山村政務次官は、\n自分がこの先どうなるかを知らない。"}, {"t": 48.25, "x": "……どうなるの？"}, {"t": 49.166666666666664, "x": "2日後、この人は、乗客全員と自分を\n取り替えてくれと、犯人に申し入れる。"}, {"t": 54.25, "x": "そして自分が飛行機に乗り込んで、北へ飛ぶ。"}, {"t": 57.2, "x": "その本人が、事件の朝に国会で報告してたのね。"}, {"t": 60.833333333333336, "x": "そうだ。"}, {"t": 61.45, "x": "今回は、よど号ハイジャック事件を、\n国会の記録だけで追いかける。"}, {"t": 65.53333333333333, "x": "この事件は、名前を知っている人がとても多い。"}, {"t": 68.38333333333334, "x": "そのわりに、4日間で何が起きたのかを\n最後まで説明できる人は、あまりいない。"}, {"t": 73.25, "x": "だから、会議録に残っている\n言葉を、順番に並べていく。"}, {"t": 77.65, "x": "機体はボーイング727。"}, {"t": 79.38333333333334, "x": "日本航空の351便。"}, {"t": 80.96666666666667, "x": "羽田を出て、福岡へ向かう便だ。"}, {"t": 83.28333333333333, "x": "出発は7時10分。"}, {"t": 84.96666666666667, "x": "通勤の時間帯ね。"}, {"t": 86.51666666666667, "x": "そうだ。月曜日の朝の便だ。"}, {"t": 88.53333333333333, "x": "機長は石田真二さん。"}, {"t": 89.83333333333333, "x": "会議録に名前が出ている。"}, {"t": 91.55, "x": "乗員は7人。機長から\nスチュワーデスまでを含めて7人だ。"}, {"t": 95.28333333333333, "x": "乗客の数は、山村政務次官がこう報告している。"}, {"t": 98.73333333333333, "x": "「乗客は百二十九人、\n満席でございます。計百三十六人」"}, {"t": 103.01666666666667, "x": "それに加えて、子どもが2人乗っていた。"}, {"t": 105.63333333333334, "x": "満席なんだ。"}, {"t": 106.81666666666666, "x": "満席だ。"}, {"t": 107.63333333333334, "x": "この数字は、あとでもう一度出てくる。"}, {"t": 109.76666666666667, "x": "覚えておいてほしい。"}, {"t": 111.0, "x": "というのも、この朝の報告の数と、\n後から足した数が、合わないんだ。"}, {"t": 115.6, "x": "合わないの。"}, {"t": 116.48333333333333, "x": "合わない。そこは最後の方の章でやる。"}, {"t": 118.8, "x": "この機体には「よど号」という名前が付いていた。"}, {"t": 121.81666666666666, "x": "日本航空は当時、727の機体に\n川の名前を付けていた。"}, {"t": 125.76666666666667, "x": "淀川の「よど」だ。"}, {"t": 127.5, "x": "それで、よど号。"}, {"t": 128.81666666666666, "x": "そうだ。"}, {"t": 129.43333333333334, "x": "この名前が、このあと何十年も残ることになる。"}, {"t": 133.13333333333333, "x": "離陸してから、そう長くは経っていない。"}, {"t": 135.56666666666666, "x": "機内で、刃物が上がった。"}, {"t": 137.33333333333334, "x": "ここで、会議録の中に言い方が2通りある。"}, {"t": 140.33333333333334, "x": "2通り。"}, {"t": 141.23333333333332, "x": "山村政務次官の当日の報告では、こうだ。"}, {"t": 144.26666666666668, "x": "「七時四十九分、名古屋上空で、赤軍派と称する\n学生約十五人に、北鮮に行くように脅迫されました」"}, {"t": 151.2, "x": "離陸から39分後だ。"}, {"t": 153.0, "x": "ところが、2週間後の連合審査会で、\n日本航空の斎藤進 参考人はこう言っている。"}, {"t": 158.8, "x": "「富士山上で犯人が日本刀を掲げまして、\nそれで乗員をおどかしたとき」"}, {"t": 163.35, "x": "富士山と名古屋じゃ、けっこう離れてるわよ。"}, {"t": 166.01666666666668, "x": "どちらが正しいかを、この回では決めない。"}, {"t": 168.36666666666667, "x": "会議録に両方載っている、とだけ言っておく。"}, {"t": 171.21666666666667, "x": "人数も、当日の報告では「約十五人」だ。"}, {"t": 174.48333333333332, "x": "実際には9人だった。"}, {"t": 176.23333333333332, "x": "それも、朝の時点では分かっていなかったのね。"}, {"t": 179.16666666666666, "x": "分かっていない。"}, {"t": 180.13333333333333, "x": "飛行機の中で起きていることは、外からは見えない。"}, {"t": 183.21666666666667, "x": "斎藤参考人も、こう言っている。"}, {"t": 185.36666666666667, "x": "「飛行機からの通信が非常にとぎれとぎれで、何が\n起こったのか、若干われわれも不安に思っていた」"}, {"t": 191.28333333333333, "x": "最初に分かったのは、\n乗っ取られた、という一行だけだった。"}, {"t": 195.53333333333333, "x": "先に、彼らが何を持ち込んだかを片づけておく。"}, {"t": 198.58333333333334, "x": "4月13日の連合審査会で、\n荒木萬壽夫 国家公安委員長が、\n押収した物を読み上げている。"}, {"t": 204.8, "x": "「鉄パイプ爆弾一本」"}, {"t": 206.33333333333334, "x": "「短刀、白さや入りの全長三十三・七センチ一本」"}, {"t": 209.85, "x": "「試験管十一本、うち濃硫酸入り二本」"}, {"t": 212.61666666666667, "x": "試験管？"}, {"t": 213.48333333333332, "x": "爆弾とセットで使うものだ。"}, {"t": 215.38333333333333, "x": "鉄パイプの中に火薬が入っている。"}, {"t": 217.5, "x": "塩素酸カリと黄血塩と砂糖を混ぜたものだ。"}, {"t": 220.36666666666667, "x": "そこへ濃硫酸の入った試験管を\nセットして投げると、爆発する。"}, {"t": 224.48333333333332, "x": "荒木委員長は、こう言っている。"}, {"t": 226.18333333333334, "x": "「数十メートル以内は殺傷の危険がある状態のもの」"}, {"t": 229.38333333333333, "x": "この鉄パイプ爆弾は、前の年に\n押収されたものと同じ形だった。"}, {"t": 233.75, "x": "1969年10月21日の東京薬科大学の事件。"}, {"t": 238.11666666666667, "x": "それと、同じ年の11月5日の大菩薩峠の事件だ。"}, {"t": 242.11666666666667, "x": "前から出回ってた物だったのね。"}, {"t": 244.31666666666666, "x": "そうだ。"}, {"t": 244.91666666666666, "x": "短刀の方は、こう説明されている。"}, {"t": 247.23333333333332, "x": "「玩具の短刀のやいばをグラインダーで研磨してあり、\n人を殺傷することができるようになっております」"}, {"t": 252.93333333333334, "x": "……おもちゃを削ったのね。"}, {"t": 254.41666666666666, "x": "そして、機内にあった物は、それだけではない。"}, {"t": 257.3333333333333, "x": "乗客と乗員の話を合わせると、\nこうなると荒木委員長は述べている。"}, {"t": 261.43333333333334, "x": "拳銃が1丁か2丁。本物かどうかは不明。"}, {"t": 264.35, "x": "日本刀が3本か4本。こちらは本物と思われる。"}, {"t": 267.6166666666667, "x": "登山ナイフが9本。爆弾が9本。"}, {"t": 270.1666666666667, "x": "一人一本ずつ持ってた計算になるわね。"}, {"t": 272.8333333333333, "x": "そうなる。"}, {"t": 274.15, "x": "犯人たちの要求は、北へ行け、というものだった。"}, {"t": 277.3666666666667, "x": "機長は断っている。燃料が足りないからだ。"}, {"t": 280.15, "x": "山村政務次官の報告にはこうある。"}, {"t": 282.51666666666665, "x": "「燃料がないので北鮮までは行けないと\n断わりましたところ」"}, {"t": 285.93333333333334, "x": "「この学生たちは、福岡で給油してから\n北朝鮮へ向かうように脅迫しておる」"}, {"t": 290.8666666666667, "x": "それで、いったん福岡に降りたのね。"}, {"t": 293.23333333333335, "x": "降りた。"}, {"t": 293.8, "x": "ただ、これは機長が一人で決めたことではない。"}, {"t": 296.6, "x": "日本航空の斎藤参考人が、\n地上から指示を出している。"}, {"t": 300.2, "x": "理由は、この機体が国内線専用だったことだ。"}, {"t": 303.3333333333333, "x": "東京から福岡へ飛ぶときは、福岡に降りられなかった\n場合に備えて、余分の燃料を積む。"}, {"t": 308.9, "x": "逆に言えば、それ以上は積んでいない。"}, {"t": 311.0833333333333, "x": "斎藤参考人の言葉だ。"}, {"t": 312.9, "x": "「あれを北鮮に持っていくということは、\nお客全部の安全からいって非常に\n不安定があると感じました」"}, {"t": 318.6666666666667, "x": "「機長と交信いたしまして、福岡に着陸するようにと、\nガソリンの問題があるからということを指示した」"}, {"t": 324.96666666666664, "x": "安全のために降ろした、ってことね。"}, {"t": 327.26666666666665, "x": "そういう説明だ。"}, {"t": 328.46666666666664, "x": "8時59分、機体は福岡に着いた。板付空港だ。"}, {"t": 332.31666666666666, "x": "離陸から、1時間49分が経っていた。"}, {"t": 335.8666666666667, "x": "ここから、地面の上で5時間が始まる。"}, {"t": 338.46666666666664, "x": "山村政務次官の報告に、その朝の状況が残っている。"}, {"t": 342.21666666666664, "x": "「そのまま飛行機はドアをあけさせずに、乗客、\n乗務員は機内にかん詰め状態でございます」"}, {"t": 347.6166666666667, "x": "福岡の県警本部長以下が空港で待機した。"}, {"t": 350.6, "x": "報告はこう続く。"}, {"t": 351.9166666666667, "x": "「犯人をできるだけ刺激しないように、"}, {"t": 353.96666666666664, "x": "乗客を安全に飛行機からおろさせるように\n全力を尽くしております」"}, {"t": 358.05, "x": "板付空港の警察署長が、機内に\n向かって説得をしている。"}, {"t": 362.0, "x": "内容は一つだ。乗客を\n降ろさなければ、給油はできない。"}, {"t": 365.75, "x": "燃料を人質にしたのね。"}, {"t": 367.65, "x": "そういう形だ。"}, {"t": 368.75, "x": "ただ、相手は聞かなかった。"}, {"t": 370.56666666666666, "x": "報告の言葉はこうだ。"}, {"t": 371.95, "x": "「しかし、向こうは言うことを\n聞かないわけでございます」"}, {"t": 374.96666666666664, "x": "そして、脅迫が強くなったので、乗客を\n乗せたまま、少しずつ給油が始まった。"}, {"t": 380.31666666666666, "x": "この時点での航空局の方針も、報告に書いてある。"}, {"t": 383.71666666666664, "x": "「絶対に飛ばさせないという態度で\n臨んでまいるつもりでございます」"}, {"t": 387.5, "x": "飛ばさせない。"}, {"t": 388.53333333333336, "x": "そうだ。国内で終わらせる、という考え方だ。"}, {"t": 391.51666666666665, "x": "最後に、山村政務次官は\n参考になる数字を一つ挙げている。"}, {"t": 395.43333333333334, "x": "1969年の1月から11月までに、世界で\n乗っ取りが50件起きている、と。"}, {"t": 401.31666666666666, "x": "日本では初めてでも、外では起きてたのね。"}, {"t": 404.23333333333335, "x": "起きていた。"}, {"t": 405.68333333333334, "x": "板付で何が行われていたか。"}, {"t": 407.71666666666664, "x": "これを一番細かく話しているのは、\n日本航空の長野英麿 参考人だ。"}, {"t": 412.6166666666667, "x": "運航基準部長という立場で、\n4月13日の連合審査会に出ている。"}, {"t": 417.1166666666667, "x": "まず、日本航空が最初に考えた方法がこれだ。"}, {"t": 420.31666666666666, "x": "「エンジンのファイアウォーニングと申しまして、\n火災警報機を鳴らす方法を考えました」"}, {"t": 425.1666666666667, "x": "火事が起きてないのに鳴らすの？"}, {"t": 427.1, "x": "鳴らす。"}, {"t": 427.76666666666665, "x": "エンジンを始動するときに、操縦席で\nベルが鳴って、ライトがつくようにする。"}, {"t": 432.21666666666664, "x": "長野参考人の言葉だ。"}, {"t": 433.81666666666666, "x": "「これは、しろうとでもこれはわかる」"}, {"t": 435.85, "x": "つまり、犯人にも見える。"}, {"t": 437.53333333333336, "x": "それで飛べないことにして、ここで\n乗客を降ろしてくれ、と言う。"}, {"t": 441.3, "x": "芝居をするってことね。"}, {"t": 442.8666666666667, "x": "そうだ。"}, {"t": 443.5, "x": "日本航空の本部長の指示は、\nこうだったと長野参考人は言っている。"}, {"t": 447.6666666666667, "x": "犯人と乗員は北へ飛ばさざるを得ないだろう。"}, {"t": 450.3, "x": "しかし、乗客はできるだけ福岡で\n降ろすことに説得しよう、と。"}, {"t": 454.3333333333333, "x": "ところが、この火災警報の計画は実行されなかった。"}, {"t": 457.81666666666666, "x": "説得が、少しだけ通ったからだ。"}, {"t": 460.26666666666665, "x": "犯人が、婦人と子どもを降ろすことに応じた。"}, {"t": 463.1333333333333, "x": "長野参考人はこう言っている。"}, {"t": 464.98333333333335, "x": "「これではむしろ婦人、"}, {"t": 466.1, "x": "子供をまずおろしたほうが安全であるという観点に\n立ちまして、この操作はやめにいたしました」"}, {"t": 472.06666666666666, "x": "もう一つ、別の工作が動いていた。"}, {"t": 474.53333333333336, "x": "こちらは警察からの要請だ。"}, {"t": 476.46666666666664, "x": "荒木 国家公安委員長が、国会でそのまま認めている。"}, {"t": 480.1333333333333, "x": "「タイヤの空気を抜く、あるいはオイルのコックを\n締めるということは、"}, {"t": 483.43333333333334, "x": "警察庁として航空会社に要請をいたしました」"}, {"t": 486.7, "x": "飛行機のコックを締める。"}, {"t": 488.35, "x": "締める。燃料が行かなくなる。"}, {"t": 490.26666666666665, "x": "荒木委員長の説明はこうだ。"}, {"t": 492.1333333333333, "x": "空気は抜かない。それよりも確実に発進を\n止められる方法として、オイルのコックを締める。"}, {"t": 497.53333333333336, "x": "そして、こう続けている。"}, {"t": 499.05, "x": "「最後までの努力をしましたが、\n不幸にして失敗に帰しました」"}, {"t": 503.01666666666665, "x": "ここに、社会党の畑和 委員が噛みついた。"}, {"t": 506.1333333333333, "x": "畑委員が言ったのは、こういうことだ。"}, {"t": 508.3333333333333, "x": "コックを締めても、すでに先へ\n送られている燃料がある。"}, {"t": 511.6, "x": "機長がそれを知らずに飛んだら、\n途中で失速するかもしれない。"}, {"t": 515.2666666666667, "x": "中途半端に締まっていたら、上がってから\n燃料が切れるかもしれない。"}, {"t": 519.3333333333334, "x": "……乗客ごと落ちるかもしれない、ってこと。"}, {"t": 521.8166666666667, "x": "畑委員はそう言っている。"}, {"t": 523.2333333333333, "x": "これに対して、長野参考人は\n技術的な説明をしている。"}, {"t": 527.0333333333333, "x": "締めた地点から離陸の位置に\n着くまでに、そのエンジンは止まる。"}, {"t": 530.6666666666666, "x": "そして、仮にエンジンが1つ\n止まっても、飛行機は落ちない。"}, {"t": 534.3, "x": "これが日本航空側の答えだ。"}, {"t": 536.3, "x": "もう一人、社会党の大出俊 委員が、\n別の話を持ち出している。"}, {"t": 540.6166666666667, "x": "大出委員によれば、その最中に\n第二エンジンのケーブルが1本切られていた。"}, {"t": 545.0, "x": "それで、火災警報機が鳴らなくなった。"}, {"t": 547.4666666666667, "x": "そのまま飛んで、金浦に\n着いてから、韓国側に指摘された。"}, {"t": 551.3166666666667, "x": "鳴らしてみろと言われて、鳴らなかった。"}, {"t": 553.6333333333333, "x": "それで、金浦で修理している。"}, {"t": 555.65, "x": "……福岡から金浦までの間は、火事が\n起きても分からない状態だったのね。"}, {"t": 560.0333333333333, "x": "大出委員はそこを問題にした。"}, {"t": 561.95, "x": "警察庁の川島広守 警備局長は、こう答えている。"}, {"t": 565.7666666666667, "x": "「技術的な安全につきましては、警察としては"}, {"t": 568.8333333333334, "x": "全く門外漢でございまするので、それは日航の責任者に\nおまかせしたというのが真相でございます」"}, {"t": 574.6833333333333, "x": "荒木委員長は、板付での措置については\nこう言い切っている。"}, {"t": 578.1166666666667, "x": "警察としてはベストを尽くした、と。"}, {"t": 580.45, "x": "ただし、事件そのものについては、こう述べている。"}, {"t": 583.4666666666667, "x": "「赤軍派の企てを事前にキャッチし得なかったことは、\nまことに遺憾であると思っております」"}, {"t": 589.3, "x": "板付で、実際に降りた人がいる。"}, {"t": 591.6166666666667, "x": "長野参考人の説明では、降ろすのも\n一度では済んでいない。"}, {"t": 595.2666666666667, "x": "最初に降ろそうとしたとき、犯人が気づいた。"}, {"t": 598.1166666666667, "x": "それで、その場所では降ろせなかった。"}, {"t": 600.3333333333334, "x": "機体を、人のいない方へ移動させてから、\nあらためて降ろしている。"}, {"t": 604.2833333333333, "x": "見られないところまで動かしたのね。"}, {"t": 606.4833333333333, "x": "そうだ。"}, {"t": 607.1, "x": "降りたのは、婦人と子どもだ。"}, {"t": 608.9833333333333, "x": "長野参考人の言葉は、こうなっている。"}, {"t": 611.55, "x": "「婦人、子供の方約二十三名をおろしましたあと」"}, {"t": 614.65, "x": "約23名。会議録に残っている数はこれだ。"}, {"t": 617.95, "x": "まだ百人以上、中に残ってるってことよね。"}, {"t": 620.9666666666667, "x": "残っている。"}, {"t": 621.85, "x": "そして、この直後に、\n板付での最後の試みが動いている。"}, {"t": 625.6666666666666, "x": "離陸するまでに、なんとかエンジンを止めたい。"}, {"t": 628.2666666666667, "x": "整備員がそのつもりで動こうとした。"}, {"t": 630.4333333333333, "x": "ところが、機長がその意図を知らなかった。"}, {"t": 632.9666666666667, "x": "婦人と子どもを降ろしたあと、\n機長は急に機体を発進させている。"}, {"t": 636.8166666666667, "x": "それで整備員は諦めた、と長野参考人は述べている。"}, {"t": 640.3333333333334, "x": "……機長は、外で何をやろうとしてるか\n知らされてなかったの。"}, {"t": 643.9166666666666, "x": "知らされていない。"}, {"t": 644.9666666666667, "x": "あとで大出委員が国会で一番怒っていたのも、そこだ。"}, {"t": 648.4, "x": "機内には犯人がいる。"}, {"t": 649.7166666666667, "x": "機長は自由に喋れない。"}, {"t": 651.3333333333334, "x": "外の判断が中に伝わらないまま、\n外だけで工作が進んでいた。"}, {"t": 656.25, "x": "13時59分。よど号は板付を離陸した。"}, {"t": 659.35, "x": "着陸してから、5時間が経っていた。"}, {"t": 661.8166666666667, "x": "ここから先が、この事件のいちばん妙なところだ。"}, {"t": 665.0166666666667, "x": "妙なところ。"}, {"t": 666.0666666666667, "x": "飛行機は、平壌へ向かった。"}, {"t": 668.0166666666667, "x": "しかし、降りたのはソウルだった。"}, {"t": 669.9666666666667, "x": "北朝鮮へ行くには、韓国の上を\n通らずに回り込む方法が考えられた。"}, {"t": 674.45, "x": "長野参考人はこう説明している。"}, {"t": 676.7, "x": "「韓国領をまっすぐに突っ切ることは\n当然問題がございますので、\n迂回コースを指示いたしました」"}, {"t": 682.1833333333333, "x": "ところが、その回り道は遠すぎた。"}, {"t": 684.5333333333333, "x": "「これは遠過ぎまして、727の性能上少し無理である」"}, {"t": 688.15, "x": "そこで日本航空は、北へ行くのを\n諦めろ、と機長を通して伝えている。"}, {"t": 692.6833333333333, "x": "それでも行くって言ったのね。"}, {"t": 694.4, "x": "機長から返ってきたのは、別の案だった。"}, {"t": 697.1, "x": "板付を出てまっすぐ北上して、\n朝鮮半島の東の海岸を見ながら三十八度線を越える。"}, {"t": 702.7666666666667, "x": "越えたところで北側に入り、\nそこから平壌へ向きを変える。"}, {"t": 706.3333333333334, "x": "日本航空は、そのコースを飛ぶだけの燃料を積ませた。"}, {"t": 709.7, "x": "離陸したあとの数字も、\n長野参考人が読み上げている。"}, {"t": 713.1, "x": "機首の向きは355度。"}, {"t": 714.8666666666667, "x": "高度は2万500フィート。"}, {"t": 716.5166666666667, "x": "三十八度線に着くのが14時45分の見込み。"}, {"t": 719.75, "x": "平壌に着くのが15時16分の見込み。"}, {"t": 722.35, "x": "この見込み時刻は、機体から\n会社の航務室へ通報されている。"}, {"t": 726.3166666666667, "x": "ちゃんと平壌に向かってたのね。"}, {"t": 728.3833333333333, "x": "長野参考人はこう言っている。"}, {"t": 730.2333333333333, "x": "「これは機長が明らかに平壌に向かっておったという\nふうに私どもは受け取りました」"}, {"t": 735.5333333333333, "x": "三十八度線を越えて、2分ほど飛んだ。"}, {"t": 738.2166666666667, "x": "そこで機長は、機首を左へ30度振っている。"}, {"t": 741.1166666666667, "x": "平壌の方角だ。"}, {"t": 742.45, "x": "向きを変えて、しばらく飛んだとき、\n右の窓のすぐそばに戦闘機が1機出てきた。"}, {"t": 747.4666666666667, "x": "戦闘機。"}, {"t": 748.3833333333333, "x": "副操縦士の江崎さんが、それを確認している。"}, {"t": 751.45, "x": "江崎さんは、耳に手をやる仕草をした。"}, {"t": 753.7666666666667, "x": "無線で話そう、という合図だ。"}, {"t": 755.7666666666667, "x": "ところが、相手は同じ仕草を返せなかった。"}, {"t": 758.5833333333334, "x": "長野参考人の言葉だ。"}, {"t": 760.1666666666666, "x": "「江崎が耳をこうやりましたときに、向こうは\n耳ができない。これは交信ができない」"}, {"t": 765.0333333333333, "x": "話せないの？"}, {"t": 766.1, "x": "無線の種類が違った。"}, {"t": 767.6833333333333, "x": "よど号が積んでいたのはVHF。"}, {"t": 769.6333333333333, "x": "相手が使っていたのはUHFだ。"}, {"t": 771.9166666666666, "x": "そこで、戦闘機のパイロットは手で合図をした。"}, {"t": 774.7333333333333, "x": "高度を下げろ、という合図だと\n長野参考人は説明している。"}, {"t": 778.3666666666667, "x": "機長は高度を下げた。"}, {"t": 779.7666666666667, "x": "江崎副操縦士は、その機種を見て、\nどこの飛行機かが分かっていた。"}, {"t": 784.0166666666667, "x": "ただ、機長の方は、反対側に\n飛行機がついていたので、正確には確認していない。"}, {"t": 789.3166666666667, "x": "そして、江崎さんはそれを機長に\n十分に説明できなかった。"}, {"t": 793.1833333333333, "x": "どうして。"}, {"t": 794.0333333333333, "x": "犯人がすぐ後ろにいたからだ。"}, {"t": 795.95, "x": "長野参考人はそう証言している。"}, {"t": 798.1833333333333, "x": "操縦席の中で、二人が自由に\n話せる状態ではなかった。"}, {"t": 802.6166666666667, "x": "ここが、この回のいちばんの山だ。"}, {"t": 804.8, "x": "三十八度線を越えたあと、\n江崎副操縦士は無線でこう呼びかけた。"}, {"t": 809.0333333333333, "x": "「エニー・ステーション・イン・ノースコリア」"}, {"t": 811.35, "x": "「ジス・イズ・ジャパン・エア8315」"}, {"t": 813.9333333333333, "x": "「リクエスト・ピョンヤン・フリーケンシー」"}, {"t": 816.2666666666667, "x": "北朝鮮の誰でもいいから応えてくれ、\n平壌の周波数を教えてくれ、ってこと？"}, {"t": 821.15, "x": "そういう意味だ。"}, {"t": 822.0833333333334, "x": "ところが、応えてきたのは韓国の大邱の無線だった。"}, {"t": 825.5666666666667, "x": "江崎さんは、それを断っている。"}, {"t": 827.6666666666666, "x": "自分が呼んでいるのは\n北のステーションであって、大邱ではない。"}, {"t": 831.1833333333333, "x": "無線でよく使う「ディスリガード」という\n言葉を返している。"}, {"t": 834.65, "x": "あなたに言っているのではない、という意味だ。"}, {"t": 836.9833333333333, "x": "そして何度も呼び続けた。"}, {"t": 838.85, "x": "ちゃんと断ってるのね。"}, {"t": 840.4333333333333, "x": "断っている。ここが大事なところだ。"}, {"t": 842.8, "x": "機長も副操縦士も、この時点では\n平壌に行くつもりでいる。"}, {"t": 846.5166666666667, "x": "そして、その呼びかけの最中に、\n下から答えが返ってきた。"}, {"t": 850.4166666666666, "x": "平壌の周波数は、134.1である、と。"}, {"t": 853.8666666666667, "x": "……それ、本当に平壌の周波数だったの。"}, {"t": 856.6333333333333, "x": "違った。"}, {"t": 857.3833333333333, "x": "江崎副操縦士は、言われたとおり134.1に切り替えた。"}, {"t": 861.4666666666667, "x": "そして「ピョンヤン・アプローチ」と呼びかけた。"}, {"t": 864.2833333333333, "x": "下からは「日航の8315号機」という\n応答が返ってきている。"}, {"t": 868.6333333333333, "x": "名前を呼び返してきたのね。"}, {"t": 870.5166666666667, "x": "呼び返してきた。"}, {"t": 871.7, "x": "そのあと、江崎さんは飛行場の情報を要求した。"}, {"t": 874.85, "x": "返ってきたのは、こういう数字だ。"}, {"t": 876.9333333333333, "x": "滑走路は114と32。"}, {"t": 879.05, "x": "長さ8100フィート。"}, {"t": 880.55, "x": "幅150フィート。標高62フィート。"}, {"t": 883.4666666666667, "x": "識別の番号は4350。"}, {"t": 885.6, "x": "細かいわね。"}, {"t": 886.65, "x": "細かい。そこが問題なんだ。"}, {"t": 888.6166666666667, "x": "長野参考人は、こう言っている。"}, {"t": 890.7, "x": "「あとで考えますと、確かにソウルの飛行場の\nインフォメーションになっておりました」"}, {"t": 895.25, "x": "そして、こう続けている。"}, {"t": 896.9333333333333, "x": "「そういうふうにこまかい\nインフォメーションが参りましたので」"}, {"t": 899.8333333333334, "x": "「江崎及び石田両パイロットは、これが\nピョンヤンの飛行場からの呼びかけであると完全に"}, {"t": 904.8, "x": "思ったそうであります」"}, {"t": 906.5833333333334, "x": "なぜ、気づかなかったのか。"}, {"t": 908.3166666666667, "x": "これも長野参考人が説明している。"}, {"t": 910.7333333333333, "x": "普通、パイロットは自分の位置を、\n地上の電波の施設からの角度で確かめる。"}, {"t": 915.3833333333333, "x": "ところが、北朝鮮の施設の周波数は、\n一つも分かっていなかった。"}, {"t": 919.75, "x": "だから、そのやり方が使えない。"}, {"t": 922.0, "x": "じゃあ、何を頼りにしてたの。"}, {"t": 923.9666666666667, "x": "地上からのレーダー誘導だ。"}, {"t": 925.6333333333333, "x": "レーダーの指示のとおりに飛ぶ。それしかない。"}, {"t": 928.1166666666667, "x": "そして、その地上は、ずっと自分を\n「ピョンヤン・アプローチ」と名乗り続けていた。"}, {"t": 933.0833333333334, "x": "長野参考人の言葉だ。"}, {"t": 934.8333333333334, "x": "「その間に終始、レーダーはピョンヤン・\nアプローチと呼んでおりますので」"}, {"t": 938.6333333333333, "x": "「機長はほとんど疑いもなく、\nこれがピョンヤンの飛行場に\n誘導されているものだと考えておりました」"}, {"t": 944.3, "x": "手元にあった地図についても、\n参考人はこう言っている。"}, {"t": 947.5666666666667, "x": "「本人が持っておりますのは、\nこのような貧弱な地図でございます」"}, {"t": 951.45, "x": "地図も無いのね。"}, {"t": 952.6333333333333, "x": "ほとんど無い。斎藤参考人もこう言っている。"}, {"t": 955.3833333333333, "x": "「北鮮なり中共の地図その他は、絶対に\nわれわれのところにはございません」"}, {"t": 959.7333333333333, "x": "最後に、機体は南へ向きを変えている。"}, {"t": 962.2, "x": "普通なら、そこで疑う。"}, {"t": 963.7833333333333, "x": "北へ行くはずの飛行機が南を向いているからだ。"}, {"t": 966.65, "x": "ところが、下から言われていた\n滑走路の向きは140度だった。"}, {"t": 970.55, "x": "南東を向いた滑走路だ。"}, {"t": 972.1333333333333, "x": "だから機長は、滑走路の延長線に\n乗せられているだけだと思った。"}, {"t": 976.1333333333333, "x": "長野参考人の言葉だ。"}, {"t": 977.8666666666667, "x": "「これは滑走路が百四十度である、\nランウエー14であるということから」"}, {"t": 981.8666666666667, "x": "「機首をだんだんランウエーの方向に\n向けられつつあるのだという\nふうに思い込んでおりました」"}, {"t": 986.4666666666667, "x": "副操縦士の江崎さんだけは、南を\n向いた時点で少し疑っている。"}, {"t": 990.7333333333333, "x": "前にソウルへ行った経験があったからだ。"}, {"t": 993.05, "x": "それでも、機長には伝えられなかった。"}, {"t": 995.2833333333333, "x": "犯人が後ろにいたからだ。"}, {"t": 997.0833333333334, "x": "そして、長野参考人はこう締めている。"}, {"t": 999.6333333333333, "x": "「少なくとも石田機長は、\n最終の飛行場へ着陸するまで」"}, {"t": 1003.45, "x": "「ここがソウルであるということに気がつかなかった」"}, {"t": 1006.3, "x": "……降りるまで分からなかったのね。"}, {"t": 1008.15, "x": "15時16分、よど号は着陸した。"}, {"t": 1010.7166666666667, "x": "平壌に着く予定だった時刻と、ほぼ同じだ。"}, {"t": 1013.6666666666666, "x": "降りた場所は、ソウルの金浦空港だった。"}, {"t": 1016.7833333333333, "x": "この一件を、国会ではこう呼んでいた。"}, {"t": 1019.1333333333333, "x": "擬装誘導。"}, {"t": 1020.05, "x": "偽の電波と偽の情報で、行き先を変えさせることだ。"}, {"t": 1023.5, "x": "4月13日の連合審査会で、大出委員はこう言っている。"}, {"t": 1027.2166666666667, "x": "「おりた結果としては、みごとに擬装工作が\n行なわれたことは、これは明らかだ」"}, {"t": 1031.9333333333334, "x": "「国民周知の事実だ」"}, {"t": 1033.55, "x": "そして、こう続けた。"}, {"t": 1034.9333333333334, "x": "「だれがやらしたかということは明確になっていない」"}, {"t": 1037.9, "x": "分かってないの。"}, {"t": 1039.05, "x": "分かっていない。少なくとも\n国会の記録の上では、答えが出ていない。"}, {"t": 1043.2666666666667, "x": "日本政府も日本航空も、頼んだことはない、\n指示はしていない、と答えている。"}, {"t": 1048.0166666666667, "x": "中曽根康弘 防衛庁長官は、こう答えている。"}, {"t": 1051.35, "x": "「われわれのほうは、"}, {"t": 1052.25, "x": "安全航行を米軍を通じて依頼しただけでありまして、\nそれ以上は全く関知いたしません」"}, {"t": 1057.5666666666666, "x": "そこで、共産党の不破哲三 委員が、\n最後にこう聞いた。"}, {"t": 1061.35, "x": "この擬装誘導は、韓国側が自分から行ったことだと\n考えざるを得ないが、どうか。"}, {"t": 1066.2833333333333, "x": "答えたのは橋本登美三郎 運輸大臣だ。"}, {"t": 1069.2333333333333, "x": "「その点は、私は現地におりましたが、\n韓国側の自発的行為かどうかは」"}, {"t": 1074.05, "x": "「これは機長及び運航部長が答えた\n点において御了承願いたいと思います」"}, {"t": 1078.5333333333333, "x": "……答えてないわね、それ。"}, {"t": 1080.2166666666667, "x": "答えていない。"}, {"t": 1081.15, "x": "不破委員は、もう一つ聞いている。"}, {"t": 1083.1666666666667, "x": "平壌へ行くつもりの飛行機を、偽の電波で\n誘導して別の飛行場に降ろす。"}, {"t": 1087.75, "x": "それは国際的な航空法の上で\n許される行為なのか、と。"}, {"t": 1091.3666666666666, "x": "橋本大臣の答えはこうだ。"}, {"t": 1093.3166666666666, "x": "「私にはわからないことでありますから、\nお答えのしようがありません」"}, {"t": 1097.0666666666666, "x": "誰が決めたかは、記録の上では決まっていない。"}, {"t": 1099.9, "x": "大出委員は、この状況を国民が\nどう呼んでいるかも紹介している。"}, {"t": 1103.7333333333333, "x": "「世間一般の方が世界大魔術だなんて言っている」"}, {"t": 1107.4666666666667, "x": "ここから、金浦空港で3日間が始まる。"}, {"t": 1110.1833333333334, "x": "機内には、乗客と乗員がそのまま残っている。"}, {"t": 1113.2166666666667, "x": "外では、韓国政府と日本政府が動いていた。"}, {"t": 1116.2666666666667, "x": "橋本 運輸大臣が現地に飛んでいる。"}, {"t": 1118.8833333333334, "x": "そして、山村新治郎 運輸政務次官も金浦にいた。"}, {"t": 1122.5833333333333, "x": "朝、国会で報告してた人ね。"}, {"t": 1125.0166666666667, "x": "そうだ。"}, {"t": 1125.65, "x": "4月3日、衆議院の運輸委員会は、\n会議の冒頭でこう決めている。"}, {"t": 1129.85, "x": "現地へ行っている橋本大臣と\n山村次官に、激励の電報を打つ。"}, {"t": 1134.0666666666666, "x": "委員長の福井勇さんが提案して、\n異議なしで決まっている。"}, {"t": 1137.7166666666667, "x": "国会から電報を打つのね。"}, {"t": 1139.5833333333333, "x": "打っている。会議録の1ページ目に残っている。"}, {"t": 1142.4, "x": "社会党の畑委員は、後でこう言っている。"}, {"t": 1144.95, "x": "「福岡で一部の婦人や子供がおろされ、\nそれから金浦で三日間ねばった結果」"}, {"t": 1149.7333333333333, "x": "「身がわりを山村君がすることに\nよって乗客がおろされた」"}, {"t": 1153.0666666666666, "x": "ねばった、という言葉が使われている。"}, {"t": 1155.5166666666667, "x": "3日間、ずっと飛行機の中にいたのね。"}, {"t": 1158.2333333333333, "x": "いた。"}, {"t": 1158.75, "x": "そして、3日目に、状況を動かす申し入れが出る。"}, {"t": 1162.5833333333333, "x": "4月3日の衆議院運輸委員会で、\n政府が経過を報告している。"}, {"t": 1166.6333333333334, "x": "読んだのは井出一太郎 国務大臣だ。"}, {"t": 1168.9166666666667, "x": "運輸大臣の臨時代理という立場だった。"}, {"t": 1171.5166666666667, "x": "その報告の一行目が、これだ。"}, {"t": 1173.7, "x": "「四月の二日十七時、\n山村運輸政務次官から、犯人に対し」"}, {"t": 1178.1166666666666, "x": "「全乗客をおろすことと"}, {"t": 1179.5666666666666, "x": "引きかえに、みずからが搭乗して犯人とともに\n飛び立つことを申し入れられたわけであります」"}, {"t": 1184.75, "x": "自分と、乗客全員を取り替えてくれ、って言ったのね。"}, {"t": 1188.2, "x": "言った。"}, {"t": 1188.8, "x": "井出大臣は、そのあとに一行付け足している。"}, {"t": 1191.6, "x": "「まさに犠牲的な行動でございます」"}, {"t": 1193.8333333333333, "x": "犯人からの返事は、1時間10分後に来た。"}, {"t": 1196.9666666666667, "x": "「十八時十分、犯人より、これを了承するが」"}, {"t": 1200.05, "x": "「社会党の阿部助哉代議士による山村氏本人の確認を\n求めたい、こういう旨の回答があった」"}, {"t": 1205.9333333333334, "x": "本人確認？"}, {"t": 1207.1166666666666, "x": "そうだ。目の前にいる人物が、本当に\n運輸政務次官の山村新治郎なのか。"}, {"t": 1212.0666666666666, "x": "それを、自分たちが知っている国会議員に\n確かめさせろ、という条件だ。"}, {"t": 1216.5166666666667, "x": "政府は阿部助哉 衆議院議員に要請した。"}, {"t": 1219.3166666666666, "x": "井出大臣の報告では、阿部議員は快く応じている。"}, {"t": 1222.6333333333334, "x": "「四月二日二十二時四十九分羽田発日航特別機ひだ\n号でもって韓国へ向け出発をされました」"}, {"t": 1229.05, "x": "「今朝未明零時四十分金浦空港に到着をされました」"}, {"t": 1232.65, "x": "真夜中に飛んでるのね。"}, {"t": 1234.2333333333333, "x": "飛んでいる。日本航空が特別機を出している。"}, {"t": 1237.0666666666666, "x": "この身代わりの申し入れについて、もう\n一つ会議録に残っていることがある。"}, {"t": 1241.3666666666666, "x": "4月2日22時35分、橋本 運輸大臣が\n現地で記者会見をしている。"}, {"t": 1246.6666666666667, "x": "そこで、こう説明した。"}, {"t": 1248.3333333333333, "x": "韓国政府の事前の了解は得ていなかった。"}, {"t": 1251.0166666666667, "x": "ただし、最終的に韓国政府は快く了承した。"}, {"t": 1254.6833333333334, "x": "……先に言ってなかったのね。"}, {"t": 1256.4, "x": "言っていない。井出大臣の報告にそう書いてある。"}, {"t": 1259.2333333333333, "x": "そして日本政府は、同じ夜、\n外務省に別の依頼をしている。"}, {"t": 1263.1333333333334, "x": "4月2日21時55分だ。"}, {"t": 1265.4166666666667, "x": "内容は、平壌まで飛ぶために必要な\n技術のデータを取ってほしい、というものだった。"}, {"t": 1270.4, "x": "井出大臣は、その中身を並べている。"}, {"t": 1272.7833333333333, "x": "通信用電波の周波数。"}, {"t": 1274.35, "x": "管制用語。航空路と航空路の援助施設の状況。"}, {"t": 1277.6833333333334, "x": "地上の電源装置があるかどうか。"}, {"t": 1279.55, "x": "空気の始動装置があるかどうか。"}, {"t": 1281.6833333333334, "x": "……それ、飛ぶ前に普通は持ってるものよね。"}, {"t": 1284.2833333333333, "x": "持っていない。ここまで何も無いまま飛んできた。"}, {"t": 1287.0166666666667, "x": "外務省は、韓国にある\n日本大使館に訓令を出している。"}, {"t": 1291.25, "x": "4月3日。金浦で、乗客が降りた。"}, {"t": 1293.8666666666666, "x": "この日の参議院予算委員会で、\n愛知揆一 外務大臣が数字を読み上げている。"}, {"t": 1298.6666666666667, "x": "「乗客九十九名、スチュワーデス四名、合計百三名を\n韓国側でも確認いたしたそうでございます」"}, {"t": 1305.05, "x": "そして、こう付け足している。"}, {"t": 1306.85, "x": "「そうでございますれば、全員プラス・\nスチュワーデスということに相なります」"}, {"t": 1311.2833333333333, "x": "乗客は全員降りたのね。"}, {"t": 1313.0833333333333, "x": "全員だ。"}, {"t": 1313.8666666666666, "x": "降りた人たちの様子についても、\n愛知大臣は報告している。"}, {"t": 1317.6, "x": "「乗客は意外に健康状態がよかったと\n申しますか、さほど心配すべき状態ではなかった」"}, {"t": 1323.1166666666666, "x": "救急車に乗った方が1人いた。"}, {"t": 1325.2333333333333, "x": "それ以外の人は、降りたその瞬間も足取りが\nしっかりしていた、と伝えられている。"}, {"t": 1330.1333333333334, "x": "4日間、ほとんど機内から出られなかった人たちだ。"}, {"t": 1333.5, "x": "3月31日の朝からだもの。"}, {"t": 1336.0166666666667, "x": "そうだ。"}, {"t": 1336.6333333333334, "x": "日本側では、帰ってくる\n人たちの受け入れが用意されていた。"}, {"t": 1340.2166666666667, "x": "これも井出大臣の報告に出てくる。"}, {"t": 1342.4, "x": "福岡と羽田で、病院の手配と\nホテルの手配はもう終わっている。"}, {"t": 1346.2333333333333, "x": "検疫と入国の手続きは、ごく簡単にする。"}, {"t": 1349.2666666666667, "x": "そして、こういう言い方をしている。"}, {"t": 1351.2833333333333, "x": "「乗客をいたわりつつお迎えを申し上げる」"}, {"t": 1354.3333333333333, "x": "乗客が降りて、山村政務次官が乗り込んだ。"}, {"t": 1357.2833333333333, "x": "ただ、日本側にはもう一つ、通したい条件があった。"}, {"t": 1360.75, "x": "乗員の交代だ。"}, {"t": 1361.9666666666667, "x": "ここまで4日間、石田機長たちはずっと操縦席にいる。"}, {"t": 1365.45, "x": "そこから、知らない土地の飛行場へ降りることになる。"}, {"t": 1368.65, "x": "疲れてるでしょうね。"}, {"t": 1370.0, "x": "愛知外務大臣が、そこをこう説明している。"}, {"t": 1372.8833333333334, "x": "「日航の当局においても精密な知識、\n経験、あるいは心身の状態が」"}, {"t": 1377.4833333333333, "x": "「きわめて健全な状態でなければ\nジェット機の運転はむずかしい」"}, {"t": 1381.0333333333333, "x": "「ことに知らない土地に行くのでありますから」"}, {"t": 1383.4166666666667, "x": "それで、日本側は最後まで交代を求めた。"}, {"t": 1386.2666666666667, "x": "しかし、通らなかった。"}, {"t": 1387.85, "x": "愛知大臣の言葉だ。"}, {"t": 1389.3166666666666, "x": "「どうしてもパイロットの交換については\n赤軍派のいれるところになりませんでして」"}, {"t": 1393.7833333333333, "x": "「そのために予定の時間が\n延びたのでありますけれども」"}, {"t": 1396.7833333333333, "x": "協議を重ねた末、日本側が折れている。"}, {"t": 1399.3666666666666, "x": "「ついにこれについては\n赤軍派の言うことを聞かざるを得なかった」"}, {"t": 1402.7666666666667, "x": "「現在まで乗っておりました機長、\nクルーがそのまま操縦をすることになって」"}, {"t": 1407.2166666666667, "x": "……そのまま飛んだのね。"}, {"t": 1408.6333333333334, "x": "飛んだ。"}, {"t": 1409.2666666666667, "x": "愛知大臣は、その判断をこう言っている。"}, {"t": 1411.8166666666666, "x": "「大所高所から立ってやはり乗客をおろすということ」"}, {"t": 1414.8166666666666, "x": "「この多くの方々の人命の尊重ということから\n考えまして」"}, {"t": 1418.55, "x": "「やむを得ず、ほんとうに忍びがたきを\n忍んでこの条件を受け入れた」"}, {"t": 1422.3, "x": "出発までに、まだ時間がかかっている。"}, {"t": 1424.8333333333333, "x": "そこは橋本 運輸大臣が、後で\n国会で細かく説明している。"}, {"t": 1429.1666666666667, "x": "整備に最低3時間かかると言われた。"}, {"t": 1431.5666666666666, "x": "そして、行き先の天気の情報が、\n日本にも韓国にも無い。"}, {"t": 1435.45, "x": "当時、天気は悪かった。"}, {"t": 1437.1666666666667, "x": "橋本大臣の言葉だ。"}, {"t": 1438.85, "x": "「午前八時から始まりまして、\n夕方の四時過ぎでなければ出発して\nよろしいという条件が整わなかった」"}, {"t": 1445.3166666666666, "x": "8時間以上かかってるのね。"}, {"t": 1447.2833333333333, "x": "かかっている。"}, {"t": 1448.1666666666667, "x": "橋本大臣は、板付でもっと\n早く出せたはずだという意見に、こう答えている。"}, {"t": 1453.05, "x": "30分や1時間で出発させられる、というのは\n人命を尊重しないやり方だ、と。"}, {"t": 1458.2666666666667, "x": "そして、山村政務次官の申し入れについては、\nこう言っている。"}, {"t": 1462.0333333333333, "x": "「山村政務次官の勇気ある行動を\nきっかけにして百八十度の転換をした」"}, {"t": 1466.65, "x": "そのうえで、自分の責任をこう述べている。"}, {"t": 1469.2166666666667, "x": "機長を含めた4人の生命を、安全に\n見知らぬ飛行場へ送り届けること。"}, {"t": 1473.7, "x": "この4人というのが、山村政務次官と、\n残った乗員のことだ。"}, {"t": 1478.45, "x": "よど号は金浦を出て、平壌へ向かった。"}, {"t": 1480.9333333333334, "x": "そして、着いた。"}, {"t": 1482.15, "x": "そのあと、機体と乗員と\n山村政務次官は日本へ戻っている。"}, {"t": 1486.0, "x": "畑委員が、その全体をこう言っている。"}, {"t": 1488.3833333333334, "x": "「山村君たちも含めて操縦士などが飛行機ごと北鮮の\nはからいですぐさまこちらに帰ったということで」"}, {"t": 1494.45, "x": "「百二十二時間という長い間であったけれども」"}, {"t": 1497.2666666666667, "x": "「ともかく結果的にはラッキーに終わった」"}, {"t": 1499.7833333333333, "x": "122時間。"}, {"t": 1501.1, "x": "5日と2時間だ。"}, {"t": 1502.4, "x": "3月31日の朝7時10分に羽田を\n出てから、そこまでの時間だ。"}, {"t": 1507.1333333333334, "x": "この事件で、乗客と乗員に死者は出ていない。"}, {"t": 1510.0333333333333, "x": "ここは、この事件の一番大事な結果だ。"}, {"t": 1512.7166666666667, "x": "ただし、畑委員はそのあとに、\nこういうことも言っている。"}, {"t": 1515.95, "x": "ラッキーに終わったとはいえ、\n世界中が見ていた事件だ。"}, {"t": 1519.1166666666666, "x": "政府の側で、誰かが責任を負うべきではないか、と。"}, {"t": 1522.4166666666667, "x": "荒木 国家公安委員長は、こう答えている。"}, {"t": 1525.2833333333333, "x": "事前に企てをつかめなかったことは、\nまことに遺憾である。"}, {"t": 1528.8166666666666, "x": "板付でとった措置については、\n警察としては万全を尽くした。"}, {"t": 1532.8333333333333, "x": "……遺憾、で終わってるのね。"}, {"t": 1534.45, "x": "会議録の上ではそうなっている。"}, {"t": 1536.9666666666667, "x": "事件のあと、国会は法律を一本作った。"}, {"t": 1539.85, "x": "名前は、航空機の強取等の処罰に関する法律。"}, {"t": 1543.15, "x": "作るまでが早い。事件が3月末で、\n5月には国会を通っている。"}, {"t": 1547.4833333333333, "x": "5月6日、参議院の法務委員会で、\n小林武治 法務大臣が提案理由を説明している。"}, {"t": 1553.4166666666667, "x": "その説明の中に、この事件の名前がそのまま出てくる。"}, {"t": 1556.9333333333334, "x": "「去る三月末に発生したいわゆる日航機乗っ取り\n事件が国民に大きな衝撃を与え」"}, {"t": 1562.1166666666666, "x": "「ハイジャッキングに対処する立法措置を要望する\n声が各方面から聞かれるに至っております」"}, {"t": 1567.45, "x": "この事件のために作った法律なのね。"}, {"t": 1570.0333333333333, "x": "きっかけは、はっきりそう言っている。"}, {"t": 1572.1, "x": "では、それまでは何の罪になったのか。"}, {"t": 1574.55, "x": "法務省の辻辰三郎 刑事局長が、\n事件の直後に国会で並べている。"}, {"t": 1579.5, "x": "刑法の強盗罪。不法監禁罪。"}, {"t": 1581.65, "x": "国外移送目的の略取罪。威力業務妨害罪。"}, {"t": 1585.0333333333333, "x": "出入国管理令違反。場合によっては航空法違反。"}, {"t": 1588.3333333333333, "x": "持っていた物については、爆発物取締罰則違反、\n銃砲刀剣類所持等取締法違反、火薬類取締法違反。"}, {"t": 1596.0666666666666, "x": "けっこうあるじゃない。"}, {"t": 1597.3, "x": "あるが、足りないと考えられた。"}, {"t": 1599.2666666666667, "x": "小林法務大臣は、足りない理由を2つ挙げている。"}, {"t": 1602.4333333333334, "x": "一つ。既存の罰則では刑が軽すぎる。"}, {"t": 1605.1833333333334, "x": "もう一つ。日本の外での行為を\n処罰できない場合がある。"}, {"t": 1608.6333333333334, "x": "この2つ目が大きい。"}, {"t": 1609.85, "x": "飛行機は、あっという間に国の外へ出てしまう。"}, {"t": 1612.7666666666667, "x": "新しい法律の骨子は4つだ。"}, {"t": 1614.8333333333333, "x": "一つ目。航行中の航空機を奪い、その運行を\n支配した者を、強盗罪より重く罰する。"}, {"t": 1620.4833333333333, "x": "無期、または7年以上の懲役。未遂も罰する。"}, {"t": 1623.7333333333333, "x": "人を死亡させた場合は、死刑または無期懲役。"}, {"t": 1626.75, "x": "二つ目。予備を罰する。つまり、準備の段階で罰する。"}, {"t": 1630.4, "x": "ただし、実行に取りかかる前に自首した\n者は、必ず刑を軽くするか、免除する。"}, {"t": 1635.7833333333333, "x": "やめた人は助ける、ってことね。"}, {"t": 1638.0166666666667, "x": "そういう作りだ。"}, {"t": 1639.1166666666666, "x": "三つ目。偽計または威力を使って\n航空機の針路を変えさせる行為を罰する。"}, {"t": 1643.6166666666666, "x": "四つ目。これらの罪を、国外で\n犯した場合も広く罰する。"}, {"t": 1647.4333333333334, "x": "小林法務大臣は、\nこの種の犯罪の性質についても述べている。"}, {"t": 1651.5, "x": "「一般社会から隔絶した航行中の航空機内という\n特殊な環境を巧みに利用して行なわれる」"}, {"t": 1657.35, "x": "「多数の乗客及び乗り組み員が恐怖と不安の伴う\n監禁状態のまま遠隔の地に連れ去られる」"}, {"t": 1662.9666666666667, "x": "この言葉は、よど号で\n起きたことをそのまま書いている。"}, {"t": 1666.7333333333333, "x": "この法律には、入らなかったものがある。"}, {"t": 1669.2666666666667, "x": "船だ。"}, {"t": 1669.9166666666667, "x": "5月16日、衆議院の地方行政委員会で、\n運輸省の澤雄次 海運局長がこう述べている。"}, {"t": 1676.1666666666667, "x": "「先般の「よど号」の奪取事件のあと、\n例の特別法案が起草されましたときに」"}, {"t": 1681.4666666666667, "x": "「運輸省といたしましては、船舶についても\n同様にこれを規定してもらいたい」"}, {"t": 1685.9, "x": "「こういうことを関係省に申し出たわけでございます」"}, {"t": 1688.9333333333334, "x": "申し出たのに、入らなかったの。"}, {"t": 1691.1333333333334, "x": "入らなかった。"}, {"t": 1692.1833333333334, "x": "理由は、船の種類が多すぎることだった。"}, {"t": 1694.8, "x": "トン数も違う。旅客船も貨物船も漁船もある。"}, {"t": 1698.0166666666667, "x": "澤局長の言葉だ。"}, {"t": 1699.55, "x": "「あのような倉卒の間にいきなり\n船舶ということで入れることは若干無理がある」"}, {"t": 1704.0333333333333, "x": "倉卒、というのは、急いでいて\n余裕がないという意味だ。"}, {"t": 1707.35, "x": "そのかわり、後で関係する省で\n詰めて、改正案を出すことにした。"}, {"t": 1711.5333333333333, "x": "この答弁が出たのが5月16日だ。"}, {"t": 1714.0166666666667, "x": "そして、この委員会が開かれた\n理由は、よど号ではない。"}, {"t": 1717.5666666666666, "x": "違うの。"}, {"t": 1718.3833333333334, "x": "5月12日、瀬戸内海で、旅客船が乗っ取られている。"}, {"t": 1722.1166666666666, "x": "猟銃を持った男が桟橋に現れて、\n停まっていた船に乗り込んだ。"}, {"t": 1726.2333333333333, "x": "船長と乗員と乗客を人質にして、船を出させた。"}, {"t": 1729.8, "x": "乗客33人と乗員の一部4人は、途中の港で降りている。"}, {"t": 1733.9833333333333, "x": "この事件は、船が停まっているところに\n乗り込んだものだった。"}, {"t": 1737.65, "x": "だから、航行中の航空機を対象にした\n新しい法律には、そもそも当てはまらない。"}, {"t": 1742.8166666666666, "x": "同じ委員会で、小澤太郎 委員がこう言っている。"}, {"t": 1745.7666666666667, "x": "「「よど号」の事件以来、人質にするという\n犯罪がどんどん出てまいりまして」"}, {"t": 1750.25, "x": "「今回の事件を含めて六件になるそうであります」"}, {"t": 1753.4, "x": "……6件目。1か月半で。"}, {"t": 1755.3666666666666, "x": "そういう数字が国会で出ている。"}, {"t": 1757.2666666666667, "x": "法律を1本作ったところで、\nそれで止まるものではなかった。"}, {"t": 1761.55, "x": "ここで、最初に預けておいた話を回収する。"}, {"t": 1764.5166666666667, "x": "人数だ。"}, {"t": 1765.3, "x": "事件当日、山村政務次官が\n国会で読んだ数はこうだった。"}, {"t": 1769.3166666666666, "x": "乗員7人。乗客129人。"}, {"t": 1771.65, "x": "合わせて136人。ほかに子どもが2人。"}, {"t": 1774.65, "x": "では、実際に降りた人を足してみる。"}, {"t": 1776.9833333333333, "x": "板付で降りたのが、婦人と子どもの約23名。"}, {"t": 1780.2333333333333, "x": "金浦で降りたのが、乗客99名と\nスチュワーデス4名の合わせて103名。"}, {"t": 1785.05, "x": "乗客だけを足すと、23と99で、122人になる。"}, {"t": 1789.4, "x": "……129人じゃなくて、122人。"}, {"t": 1792.1833333333334, "x": "そうなる。"}, {"t": 1792.8666666666666, "x": "そこへ乗員の7人を足すと、129人だ。"}, {"t": 1796.0333333333333, "x": "今日、この事件の人質の数が129人と\n言われるのは、この合計のことだ。"}, {"t": 1801.0333333333333, "x": "当日の報告にあった「乗客129人」とは、中身が違う。"}, {"t": 1805.65, "x": "数字は同じなのに、指してるものが違うのね。"}, {"t": 1808.6166666666666, "x": "違う。"}, {"t": 1809.1833333333334, "x": "どちらが正しいかを、この回では決めない。"}, {"t": 1811.6833333333334, "x": "当日の報告は、朝9時半の時点で\n分かっていたことだ。まだ動いている最中だった。"}, {"t": 1816.9833333333333, "x": "後の数字は、降りた人を1人ずつ数えた結果だ。"}, {"t": 1820.2, "x": "会議録には両方が残っている。"}, {"t": 1822.2166666666667, "x": "最初に出た数を、そのまま\n何十年も使ってしまうことがある。"}, {"t": 1826.0, "x": "だから、元の記録に戻って\n足し直す。それだけの話だ。"}, {"t": 1830.4833333333333, "x": "ここからは、いまの話をする。"}, {"t": 1832.4666666666667, "x": "ただし、公に発表されている範囲だけを並べる。"}, {"t": 1835.6333333333334, "x": "飛行機に乗り込んだのは9人だ。"}, {"t": 1837.6666666666667, "x": "警察白書は、そのうちの一人の名前を挙げている。"}, {"t": 1840.85, "x": "「故田宮高麿ら九人が、\n東京発福岡行き日本航空351便、\n通称「よど号」をハイジャックし」"}, {"t": 1847.3666666666666, "x": "「北朝鮮に入境した」"}, {"t": 1848.9833333333333, "x": "故、と書かれているとおり、\nこの人はすでに亡くなっている。"}, {"t": 1852.3333333333333, "x": "2004年版の警察白書には、当時の内訳が書いてある。"}, {"t": 1856.1, "x": "2人が逮捕されている。"}, {"t": 1857.45, "x": "2人が死亡している。"}, {"t": 1858.8833333333334, "x": "北朝鮮に留まっているとみられるのが5人。"}, {"t": 1861.55, "x": "そのうち1人は死亡したとされているが、\n真偽は確認できていない、とある。"}, {"t": 1866.1, "x": "確認できないのね。"}, {"t": 1867.5666666666666, "x": "できていない。"}, {"t": 1868.4333333333334, "x": "逮捕された2人のうち、一人は田中義三さんだ。"}, {"t": 1871.6166666666666, "x": "報道では、2002年に東京地裁で\n懲役12年の判決を受け、その後に確定した。"}, {"t": 1877.2, "x": "そして2007年に亡くなっている。"}, {"t": 1879.4166666666667, "x": "判決文そのものは裁判所のページで\n見つけられなかったので、\n報道の範囲として言っておく。"}, {"t": 1884.8666666666666, "x": "2016年版の警察白書では、こうなっている。"}, {"t": 1888.15, "x": "ハイジャックに関わった5人と、その妻3人が\n北朝鮮に滞在しているとみられる。"}, {"t": 1893.1833333333334, "x": "そのうち3人については、日本人の拉致容疑で\n逮捕状が出て、国際手配されている。"}, {"t": 1898.55, "x": "拉致。"}, {"t": 1899.2, "x": "2013年、有田芳生 参議院議員が、よど\n号グループについての質問主意書を出している。"}, {"t": 1905.0833333333333, "x": "それに対する政府の答弁書に、\n逮捕状の中身が書いてある。"}, {"t": 1908.8, "x": "名前が出ているのは7人だ。"}, {"t": 1910.6, "x": "4人は、この事件に関して逮捕状が出ている。"}, {"t": 1913.5333333333333, "x": "うち1人は、それに加えて警視庁の警察署を\n襲った事件についても出ている。"}, {"t": 1918.2, "x": "そして3人は、ヨーロッパで起きた\n日本人の拉致容疑事案に関して逮捕状が出ている。"}, {"t": 1923.3166666666666, "x": "有本恵子さんの事案。"}, {"t": 1924.6833333333334, "x": "石岡亨さんと松木薰さんの事案だ。"}, {"t": 1927.3333333333333, "x": "警察は、国際刑事警察機構を通じて、\n各国の警察に所在の発見と情報提供を求めている。"}, {"t": 1933.95, "x": "……逮捕状が出ている、というところまでなのね。"}, {"t": 1936.65, "x": "そこまでだ。"}, {"t": 1937.5333333333333, "x": "裁判はまだ開かれていない。判決も無い。"}, {"t": 1940.2166666666667, "x": "だから、この回では、逮捕状が出ている、\n国際手配されている、と言うにとどめる。"}, {"t": 1945.1833333333334, "x": "石岡亨さんと松木薰さんは、1980年に\nヨーロッパに滞在中に消息を絶っている。"}, {"t": 1951.1833333333334, "x": "有本恵子さんは、1983年10月ごろ、"}, {"t": 1954.6, "x": "デンマークのコペンハーゲンからの手紙を\n最後に消息を絶っている。"}, {"t": 1958.35, "x": "警察庁は、拉致に関与した工作員とよど\n号の関係者、合わせて10人について、"}, {"t": 1963.4166666666667, "x": "逮捕状を得て国際手配していると発表している。"}, {"t": 1966.5833333333333, "x": "飛行機が羽田を出たのが1970年3月31日。"}, {"t": 1970.6833333333334, "x": "今年が2026年だ。"}, {"t": 1972.55, "x": "56年が経っている。"}, {"t": 1974.7333333333333, "x": "最後に、整理しておく。"}, {"t": 1976.35, "x": "1970年3月31日の朝、\n羽田発福岡行きの日本航空351便が乗っ取られた。"}, {"t": 1983.05, "x": "機体の名前はよど号。"}, {"t": 1984.3333333333333, "x": "乗り込んだのは9人だ。"}, {"t": 1985.9166666666667, "x": "機体は8時59分に板付に降り、\n婦人と子ども約23名が降ろされた。"}, {"t": 1990.9166666666667, "x": "13時59分に板付を出て、平壌へ向かった。"}, {"t": 1994.2833333333333, "x": "ところが、下から返ってきた周波数も、\n飛行場の情報も、平壌のものではなかった。"}, {"t": 1999.8, "x": "降りたのは、ソウルの金浦空港だった。"}, {"t": 2002.1833333333334, "x": "誰がそうさせたのかは、国会で\n聞かれたが、答えが出ていない。"}, {"t": 2005.9333333333334, "x": "金浦で3日間動かなかったあと、4月2日17時、\n山村新治郎 運輸政務次官が申し入れた。"}, {"t": 2012.45, "x": "全乗客を降ろすことと引きかえに、自分が乗り込む。"}, {"t": 2015.6666666666667, "x": "18時10分、条件付きで了承の返事が来た。"}, {"t": 2018.8166666666666, "x": "国会議員による本人確認だ。"}, {"t": 2021.0333333333333, "x": "4月3日、乗客99名とスチュワーデス\n4名、合わせて103名が降りた。"}, {"t": 2026.15, "x": "乗員の交代は認められず、\n機長たちはそのまま平壌へ飛んだ。"}, {"t": 2030.0333333333333, "x": "死者は出ていない。"}, {"t": 2031.1333333333334, "x": "全体で122時間だった、と国会では言われている。"}, {"t": 2034.5666666666666, "x": "5月には、航空機の強取等の処罰に\n関する法律ができた。"}, {"t": 2038.4833333333333, "x": "ただし、船は入らなかった。その間にも、\n人質を取る事件は6件目まで来ていた。"}, {"t": 2043.9666666666667, "x": "……そして、9人はまだ帰ってきていないのね。"}, {"t": 2046.8, "x": "公に発表されている範囲では、\n5人が北朝鮮にいるとみられている。"}, {"t": 2051.0833333333335, "x": "そのうち3人には、拉致容疑で\n逮捕状が出て、国際手配されている。"}, {"t": 2055.4333333333334, "x": "出典を挙げておく。"}, {"t": 2056.7166666666667, "x": "全部、国立国会図書館の\n国会会議録検索システムで読める。"}, {"t": 2061.0833333333335, "x": "事件当日の状況は、\n1970年3月31日の衆議院運輸委員会。"}, {"t": 2066.5333333333333, "x": "機内の物と、板付での工作、金浦への飛行の詳細は、\n1970年4月13日の衆議院の連合審査会。"}, {"t": 2074.366666666667, "x": "山村政務次官の申し入れは"}, {"t": 2076.233333333333, "x": "4月3日の衆議院運輸委員会、降りた人数と\n機長の交代は同じ日の参議院予算委員会。"}, {"t": 2081.6833333333334, "x": "法律は5月6日の参議院法務委員会、船が入らなかった\n経緯は5月16日の衆議院地方行政委員会。"}, {"t": 2088.5, "x": "いまの状況は、2013年の参議院の質問主意書に\n対する政府の答弁書と、"}, {"t": 2093.45, "x": "警察白書、そして警察庁の発表だ。"}, {"t": 2096.5333333333333, "x": "最後に、一つだけ。"}, {"t": 2098.0666666666666, "x": "この事件は、記録の量がとても多い。"}, {"t": 2100.4166666666665, "x": "それでも、いちばん知りたい\nところが記録に残っていない。"}, {"t": 2103.65, "x": "誰が、あの周波数を返したのか。"}, {"t": 2105.9333333333334, "x": "それを国会で聞かれた大臣は、こう答えている。"}, {"t": 2108.883333333333, "x": "「私にはわからないことでありますから、\nお答えのしようがありません」"}, {"t": 2112.766666666667, "x": "……56年たっても、そこは動いていないのね。"}, {"t": 2115.75, "x": "動いていない。"}, {"t": 2116.6, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
