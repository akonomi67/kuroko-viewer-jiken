<style>

<script>
const D={"name": "100", "file": "100_編集用", "dur": 2162.11665625, "segs": [], "subs": [{"t": 0.0, "x": "沖縄県の大学の冷凍庫に、\n5年ものあいだ置かれていた血液がある。"}, {"t": 4.3, "x": "マイナス20度で、ずっと凍らせたままだ。"}, {"t": 6.983333333333333, "x": "5年って、なんで？"}, {"t": 8.466666666666667, "x": "捨てられなかったからだ。"}, {"t": 9.95, "x": "取ったのは、1986年、昭和61年の5月20日。"}, {"t": 14.483333333333333, "x": "石垣島で急に亡くなった、\n33歳の女性の解剖のときだ。"}, {"t": 18.733333333333334, "x": "旅行の初日だった。ホテルに\n着いて、部屋に入ってすぐに倒れた。"}, {"t": 22.766666666666666, "x": "救急車が呼ばれて、病院に運ばれて、\nその日のうちに亡くなった。"}, {"t": 26.9, "x": "死因は、急性心筋梗塞とされた。"}, {"t": 29.516666666666666, "x": "若いのに、心臓なの？"}, {"t": 31.283333333333335, "x": "最初はそう考えられた。"}, {"t": 32.86666666666667, "x": "ただ解剖を担当した医師が、\nどうにも納得できなかった。"}, {"t": 36.4, "x": "目で見ても、顕微鏡で見ても、\n死ぬ理由が見つからないんだ。"}, {"t": 39.983333333333334, "x": "だからその医師は、血液を取っておいた。"}, {"t": 42.46666666666667, "x": "そのまま、冷凍庫に入れた。"}, {"t": 44.31666666666667, "x": "その血液が動き出すのは、5年後だ。"}, {"t": 46.88333333333333, "x": "今回は、その5年分の話をする。"}, {"t": 49.333333333333336, "x": "トリカブト保険金殺人事件。"}, {"t": 51.416666666666664, "x": "名前を聞いたことがある人は多いと思う。"}, {"t": 53.733333333333334, "x": "植物の毒で人が亡くなった、という話だ。"}, {"t": 56.75, "x": "だがこの事件が本当に難しいのは、そこじゃない。"}, {"t": 60.0, "x": "じゃあ、どこなの。"}, {"t": 61.25, "x": "時間だ。"}, {"t": 61.96666666666667, "x": "毒を飲まされたとされる人と、\n亡くなった場所が、離れているんだ。"}, {"t": 66.01666666666667, "x": "那覇空港で別れて、そのあと飛行機に\n乗って、石垣島に着いて、それから倒れた。"}, {"t": 71.28333333333333, "x": "普通に考えれば、その場にいなかった\n人には手が出せない。"}, {"t": 74.8, "x": "この「時間のずれ」をどう説明するか。"}, {"t": 77.4, "x": "それだけのために、法医学の教室が\n何年も実験を続けることになる。"}, {"t": 81.86666666666666, "x": "先に言っておく。"}, {"t": 82.95, "x": "この事件は、有罪が確定している。"}, {"t": 85.35, "x": "ただ有罪になった人は、最後まで\n自分はやっていないと言い続けた。"}, {"t": 89.36666666666666, "x": "そしてその主張を変えないまま、亡くなっている。"}, {"t": 92.28333333333333, "x": "……決着はついているけど、\n本人は認めていないのね。"}, {"t": 95.6, "x": "そういうことだ。"}, {"t": 96.6, "x": "では1986年の5月から順番に見ていく。"}, {"t": 100.71666666666667, "x": "1986年5月19日。"}, {"t": 103.3, "x": "ある夫婦が、沖縄旅行のために那覇市に着いた。"}, {"t": 106.28333333333333, "x": "結婚したのは、その年の2月だと伝えられている。"}, {"t": 109.66666666666667, "x": "結婚して、3か月くらい。"}, {"t": 111.78333333333333, "x": "そうだ。"}, {"t": 112.4, "x": "翌日の20日、2人に誘われた\n妻の友人3人が、那覇空港で合流した。"}, {"t": 117.48333333333333, "x": "妻が以前、店で働いていたころの知り合いだ。"}, {"t": 120.35, "x": "この日の予定は、那覇から石垣島へ飛ぶことだった。"}, {"t": 123.76666666666667, "x": "全員で行くはずだったのね。"}, {"t": 125.58333333333333, "x": "はずだった。"}, {"t": 126.43333333333334, "x": "この旅行の細かい流れは、報道と、\nそれをまとめた本が出どころだ。"}, {"t": 130.61666666666667, "x": "公的な記録として残っているものではない。"}, {"t": 133.21666666666667, "x": "だからここから先の時刻は\n「そう伝えられている」という前提で聞いてほしい。"}, {"t": 137.75, "x": "それでも、時刻が残っていること\n自体が、この事件では大きい。"}, {"t": 141.71666666666667, "x": "どうして。"}, {"t": 142.56666666666666, "x": "あとで、その時刻が争点そのものになるからだ。"}, {"t": 145.58333333333334, "x": "何時に別れて、何時に倒れたか。"}, {"t": 147.9, "x": "その差が、有罪か無罪かを分ける。"}, {"t": 150.13333333333333, "x": "だから、ここは丁寧に見ておく。"}, {"t": 152.15, "x": "5月19日、那覇に到着。"}, {"t": 154.28333333333333, "x": "5月20日、那覇空港で友人3人と合流。"}, {"t": 157.33333333333334, "x": "ここまでは、5人で動いている。"}, {"t": 159.4, "x": "それが、崩れるわけね。"}, {"t": 161.08333333333334, "x": "崩れる。"}, {"t": 161.75, "x": "崩れたのは、飛行機に乗る直前だ。"}, {"t": 164.18333333333334, "x": "もう一つ、先に言っておきたいことがある。"}, {"t": 166.71666666666667, "x": "この回では、亡くなった方の名前を出さない。"}, {"t": 169.45, "x": "ご遺族も、前の妻たちのご親族も、\n今も暮らしていらっしゃる。"}, {"t": 173.53333333333333, "x": "それでいいと思うわ。"}, {"t": 174.86666666666667, "x": "友人3人の名前も出さない。"}, {"t": 176.83333333333334, "x": "呼び方は、妻、友人、夫。それで通す。"}, {"t": 180.66666666666666, "x": "報道によれば、11時40分。"}, {"t": 182.93333333333334, "x": "夫が、急用を思い出した、と言った。"}, {"t": 185.45, "x": "そして大阪の自宅へ帰ることになった。"}, {"t": 188.06666666666666, "x": "この日に？"}, {"t": 188.93333333333334, "x": "この日にだ。"}, {"t": 189.83333333333334, "x": "石垣島へは行かず、那覇空港に残った。"}, {"t": 192.53333333333333, "x": "妻と友人3人は、予定通り\n石垣島行きの飛行機に乗った。"}, {"t": 196.71666666666667, "x": "新婚旅行の途中で、片方だけ帰るの。"}, {"t": 199.58333333333334, "x": "そこは、後から見れば不自然に見える。"}, {"t": 201.93333333333334, "x": "だがその場で誰かが止めたという話は残っていない。"}, {"t": 205.0, "x": "急用と言われれば、そういうこともあると思う。"}, {"t": 207.6, "x": "この11時40分という時刻が、\nのちに弁護側の一番の武器になる。"}, {"t": 212.16666666666666, "x": "どういうこと。"}, {"t": 213.16666666666666, "x": "ここで別れたあと、夫は妻に近づいていない。"}, {"t": 216.05, "x": "つまり妻が倒れた時、夫はその場にいない。"}, {"t": 218.9, "x": "普通に考えれば、何かを飲ませることはできない。"}, {"t": 221.91666666666666, "x": "これは、かなり強い言い分だ。"}, {"t": 223.75, "x": "時刻の記録が残っている分だけ、強い。"}, {"t": 226.45, "x": "飛行機の便も、到着時刻も、動かしようがないからな。"}, {"t": 230.21666666666667, "x": "その場にいない人は、疑いようがないものね。"}, {"t": 233.08333333333334, "x": "そう、普通はな。"}, {"t": 234.3, "x": "この「普通は」を崩すのに、5年と、\nそれから何年もの裁判がかかる。"}, {"t": 239.65, "x": "正午過ぎ、4人を乗せた飛行機が石垣島に着いた。"}, {"t": 243.03333333333333, "x": "一行はホテルに入り、チェックインをした。"}, {"t": 245.51666666666668, "x": "その直後だ。"}, {"t": 246.51666666666668, "x": "妻が、大量の汗をかき始めた。"}, {"t": 248.83333333333334, "x": "寒気がして、手足がしびれる、と訴えた。"}, {"t": 251.75, "x": "いきなり？"}, {"t": 252.55, "x": "いきなりだ。"}, {"t": 253.36666666666667, "x": "友人たちが救急車を呼んだ。"}, {"t": 255.3, "x": "運ばれた先は、八重山病院。"}, {"t": 257.3666666666667, "x": "ただ救急車の中で心臓が止まった。"}, {"t": 259.75, "x": "病院に着いてからも、戻らなかった。"}, {"t": 262.15, "x": "亡くなったのは、15時4分と記録されている。"}, {"t": 265.23333333333335, "x": "……ホテルに着いて、2時間くらい。"}, {"t": 267.3, "x": "そのくらいだ。"}, {"t": 268.23333333333335, "x": "ここで一つ確認しておきたいことがある。"}, {"t": 270.73333333333335, "x": "この場面については、報道だけではなく、\n法医学の論文にも記述が残っている。"}, {"t": 275.8, "x": "論文？"}, {"t": 276.53333333333336, "x": "1992年に出た、東北大学の医学雑誌に載った論文だ。"}, {"t": 281.0833333333333, "x": "英語で書かれているので、そのまま\n日本語にすると、こうなる。"}, {"t": 284.6333333333333, "x": "33歳の女性が、ホテルで\n突然吐き気を訴え、激しく吐いた。"}, {"t": 289.06666666666666, "x": "救急車の中で意識を失った。"}, {"t": 291.21666666666664, "x": "病院に運ばれて間もなく、心室細動で亡くなった。"}, {"t": 294.6166666666667, "x": "当初、死因は心臓発作だと考えられた。"}, {"t": 297.51666666666665, "x": "報道と、同じ内容ね。"}, {"t": 299.4, "x": "同じだ。"}, {"t": 300.1166666666667, "x": "そしてこの論文には続きがある。"}, {"t": 302.15, "x": "解剖をして、目で見ても、顕微鏡で見ても、\n死因ははっきりしなかった。"}, {"t": 306.53333333333336, "x": "そう書いてある。"}, {"t": 307.6166666666667, "x": "なんで、論文にそんなことが書いてあるの。"}, {"t": 310.25, "x": "この論文を書いた人が、解剖をした本人だからだ。"}, {"t": 313.53333333333336, "x": "自分が担当した一件について、そのまま\n研究の入り口として書いている。"}, {"t": 318.03333333333336, "x": "だからこの回で一番あてになる\n資料が、その論文になる。"}, {"t": 321.5833333333333, "x": "報道より先に、まず論文の記述を置く。"}, {"t": 324.25, "x": "そういう順番で見ていく。"}, {"t": 325.9, "x": "本人が書いたものが残っているのは、大きいわね。"}, {"t": 329.0, "x": "大きい。"}, {"t": 329.55, "x": "この事件は報道の量がとても多くて、どこまでが\n確かめられた話なのか分かりにくい。"}, {"t": 335.26666666666665, "x": "沖縄県警は、遺族の承諾を得て、解剖を行った。"}, {"t": 338.85, "x": "犯罪の疑いがある時の司法解剖ではない。"}, {"t": 341.5833333333333, "x": "死因をはっきりさせるための、行政解剖のほうだ。"}, {"t": 344.75, "x": "この時点では、事件だと思われていないのね。"}, {"t": 347.6333333333333, "x": "思われていない。"}, {"t": 348.6166666666667, "x": "担当したのは、大野曜吉医師。"}, {"t": 350.75, "x": "当時、琉球大学医学部の助教授だった方だ。"}, {"t": 353.9166666666667, "x": "本人が後に書いたものによると、\nこの時の肩書きは1985年11月からのものだ。"}, {"t": 359.68333333333334, "x": "沖縄に来て、まだ1年経っていない。"}, {"t": 362.1166666666667, "x": "大野は、死因を急性心筋梗塞と診断した。"}, {"t": 365.3833333333333, "x": "じゃあ、それで終わりのはずよね。"}, {"t": 367.3333333333333, "x": "終わりのはずだった。"}, {"t": 368.55, "x": "心臓の一部に、小さな鬱血があった。"}, {"t": 371.1, "x": "だが内臓には病的な異常が無かった。"}, {"t": 373.5, "x": "急に亡くなる理由になるような\n所見が、どこにも出てこない。"}, {"t": 376.95, "x": "石垣島まで旅行に来られるほど若くて、健康な人だ。"}, {"t": 380.71666666666664, "x": "理由が無いのに、亡くなっている。"}, {"t": 382.81666666666666, "x": "そういう状態だ。"}, {"t": 383.95, "x": "診断は書いた。書いたが、納得はしていない。"}, {"t": 386.8666666666667, "x": "ここが、この事件の分かれ目になる。"}, {"t": 389.0833333333333, "x": "大野は後に、こう振り返っている。"}, {"t": 391.1166666666667, "x": "1978年に東北大学を出て、大学院を\n経て、助教授になっていた1986年5月。"}, {"t": 398.23333333333335, "x": "その後の人生に大きな影響を与えた、\n一つの解剖例と出会った、と。"}, {"t": 402.71666666666664, "x": "……人生に、影響を与えた。"}, {"t": 404.6166666666667, "x": "本人の言葉だ。"}, {"t": 405.8666666666667, "x": "2019年に、定年退職の記念講演として\n書かれたものに載っている。"}, {"t": 410.48333333333335, "x": "33年後に、まだこの一件のことを書いている。"}, {"t": 413.75, "x": "それだけ、引っかかっていたのね。"}, {"t": 415.95, "x": "この方は、1985年6月に琉球大学へ移り、\n同じ年の11月に助教授になっている。"}, {"t": 422.3833333333333, "x": "そして翌年の5月に、この解剖だ。"}, {"t": 425.03333333333336, "x": "来てすぐね。"}, {"t": 426.05, "x": "すぐだ。"}, {"t": 426.71666666666664, "x": "その後、1990年に日本大学、1992年に\n日本医科大学の教授になっている。"}, {"t": 433.1166666666667, "x": "この後の話に出てくる実験は、\nその先々の教室でずっと続けられたものだ。"}, {"t": 438.1666666666667, "x": "一つの解剖から始まって、定年まで続いた。"}, {"t": 441.9, "x": "大野は、解剖の時に、心臓と血液を保存した。"}, {"t": 445.3, "x": "冷凍庫に入れて、そのまま置いておいた。"}, {"t": 447.73333333333335, "x": "どうして。"}, {"t": 448.5833333333333, "x": "死因に納得できなかったからだ。"}, {"t": 450.6666666666667, "x": "あとで調べ直せるように、材料を残しておいた。"}, {"t": 453.56666666666666, "x": "これは、当時としては当たり前のことではない。"}, {"t": 456.31666666666666, "x": "残さないものなの？"}, {"t": 457.71666666666664, "x": "残さないことのほうが多い。"}, {"t": 459.3333333333333, "x": "解剖が終われば、普通は処理される。"}, {"t": 461.53333333333336, "x": "この判断について、後から国会でも触れられている。"}, {"t": 464.75, "x": "2006年6月6日、\n衆議院の決算行政監視委員会の第二分科会だ。"}, {"t": 469.76666666666665, "x": "発言したのは、冨岡勉委員だ。"}, {"t": 472.21666666666664, "x": "この方は、この事件を\n解剖率の話の例として取り上げている。"}, {"t": 476.25, "x": "解剖率。"}, {"t": 477.25, "x": "亡くなった人のうち、どれだけ\n解剖されているか、という割合だ。"}, {"t": 481.1, "x": "会議録には、こう残っている。"}, {"t": 483.05, "x": "三例目は、どうも\nおかしいからということで解剖されて。"}, {"t": 486.23333333333335, "x": "たまたま、その解剖した人が血液と\n胃の内容物をとっておられたんですね。"}, {"t": 490.8833333333333, "x": "それでトリカブトということで足がついた。"}, {"t": 493.35, "x": "……たまたま。"}, {"t": 494.21666666666664, "x": "国会の場で、たまたま、という言葉が使われている。"}, {"t": 497.43333333333334, "x": "逆に言えば、取っておかなければ、\n何も出なかったということだ。"}, {"t": 501.15, "x": "この血液が、5年後に意味を持つ。"}, {"t": 503.45, "x": "その5年の間、事件は事件として扱われていない。"}, {"t": 506.93333333333334, "x": "同じ委員会で、他には何を言っているの。"}, {"t": 509.6166666666667, "x": "この方は、制度そのものの話をしている。"}, {"t": 512.35, "x": "解剖が行われなくても、それを補える\n仕組みが要るのではないか、と。"}, {"t": 516.4833333333333, "x": "たとえば、血清を残しておく。"}, {"t": 518.3333333333334, "x": "胃の中身を残しておく。尿を残しておく。"}, {"t": 521.0333333333333, "x": "全部の変死体は無理でも、多くのもので\nそれができていたら、と述べている。"}, {"t": 525.4833333333333, "x": "残しておけば、あとから調べられるものね。"}, {"t": 528.2166666666667, "x": "この件が、まさにそれだった。"}, {"t": 530.1666666666666, "x": "この件で残っていたのは、\n制度ではなく、一人の判断だ。"}, {"t": 533.8666666666667, "x": "決まりがあったから残したのではない。"}, {"t": 535.9666666666667, "x": "納得できなかったから残した。それだけだ。"}, {"t": 538.95, "x": "……その人がいなかったら、なのね。"}, {"t": 541.1666666666666, "x": "そういうことになる。"}, {"t": 542.9666666666667, "x": "ここから、話が別の方向に動く。"}, {"t": 545.4833333333333, "x": "妻には、生命保険が掛かっていた。"}, {"t": 547.9, "x": "受取人は夫。"}, {"t": 549.1833333333333, "x": "報じられている額は、4社を\n合わせて1億8,500万円だ。"}, {"t": 553.2333333333333, "x": "1億8,500万円。"}, {"t": 555.0166666666667, "x": "掛金は、月に18万円と伝えられている。"}, {"t": 558.05, "x": "そして加入したのは、亡くなる20日前だ。"}, {"t": 560.8666666666667, "x": "20日前？"}, {"t": 561.8166666666667, "x": "20日前だ。"}, {"t": 562.75, "x": "掛金は、1度しか払われていない。"}, {"t": 565.0833333333334, "x": "これは、保険会社から見れば、\nかなり目立つ形になる。"}, {"t": 568.7, "x": "それは、そうよね。"}, {"t": 570.0666666666667, "x": "ただここで気をつけたいことがある。"}, {"t": 572.0166666666667, "x": "この金額と時期は、報道と、それを\nまとめた本から来ている数字だ。"}, {"t": 576.3166666666667, "x": "裁判所が認定した金額として、\n公式の文書で確かめられたものではない。"}, {"t": 581.0166666666667, "x": "ちなみに国会では別の数字が出ている。"}, {"t": 583.45, "x": "2008年4月18日、衆議院の法務委員会。"}, {"t": 586.9, "x": "滝実委員が、こう述べている。"}, {"t": 588.9333333333333, "x": "トリカブト事件なんというと、次から次へと\n三億とか九億の保険金を掛けておいて。"}, {"t": 594.2, "x": "三億とか九億。さっきの額と違うわ。"}, {"t": 597.0166666666667, "x": "違う。"}, {"t": 597.5833333333334, "x": "ただこの発言は、保険金の掛かった事件を\n一般論として並べている場面のものだ。"}, {"t": 602.7333333333333, "x": "この事件の保険金額として言っているわけではない。"}, {"t": 605.7333333333333, "x": "だからこの回では1億8,500万円のほうを使う。"}, {"t": 609.05, "x": "報道で、複数の出どころが同じ額を書いているからだ。"}, {"t": 612.55, "x": "数字が違う時は、どっちを取るか決めておくのね。"}, {"t": 615.7, "x": "決めておく。そうしないと、話すたびに変わる。"}, {"t": 618.6, "x": "論文に書いてあるのか、\n国会の会議録にあるのか、報道なのか。"}, {"t": 622.7166666666667, "x": "そこを混ぜない。"}, {"t": 623.8166666666667, "x": "面倒だけど、そのほうが安心ね。"}, {"t": 626.1333333333333, "x": "ちなみに保険に入った\n時期については、もう一つ見方がある。"}, {"t": 629.7833333333333, "x": "結婚したのがその年の2月だ。"}, {"t": 631.9833333333333, "x": "そして亡くなったのが5月20日。"}, {"t": 634.1333333333333, "x": "保険に入ったのが、その20日前ということになる。"}, {"t": 637.3833333333333, "x": "結婚してから、3か月足らずの間の出来事なのね。"}, {"t": 641.0166666666667, "x": "全部が、その中に入っている。"}, {"t": 643.75, "x": "夫は、保険会社に支払いを求めた。"}, {"t": 646.3, "x": "だが保険会社は支払いを保留した。"}, {"t": 648.6833333333333, "x": "理由は。"}, {"t": 649.45, "x": "告知義務違反だ。"}, {"t": 650.7, "x": "保険に入る時、自分の健康状態を\n正しく伝える決まりがある。"}, {"t": 654.8166666666667, "x": "それを伝えていなかったのではないか、という主張だ。"}, {"t": 657.85, "x": "妻には、以前、神経の病気で通院した\n記録があったと伝えられている。"}, {"t": 662.2666666666667, "x": "それが契約の時に伝えられていなかった、というのが\n保険会社側の言い分だった。"}, {"t": 667.25, "x": "それで話し合いでは終わらなかったのね。"}, {"t": 669.6, "x": "終わらなかった。"}, {"t": 670.6166666666667, "x": "夫は、支払いを求めて民事の裁判を起こした。"}, {"t": 673.7, "x": "この時点では、刑事の事件ではない。"}, {"t": 676.0, "x": "お金を払う、払わない、という争いだ。"}, {"t": 678.6, "x": "そして一審の東京地裁は、\n告知義務違反は無かったと判断した。"}, {"t": 682.9, "x": "勝ったの。"}, {"t": 683.75, "x": "一審では、夫が勝っている。"}, {"t": 685.65, "x": "ここが、この事件の分かりにくいところだ。"}, {"t": 688.1833333333333, "x": "誰も、この時点では毒の話をしていない。"}, {"t": 690.9333333333333, "x": "亡くなった原因は心臓だ、という前提で進んでいる。"}, {"t": 694.1666666666666, "x": "保険会社が争っていたのも、書類の話だった。"}, {"t": 697.55, "x": "じゃあ、このまま終わるはずだったのね。"}, {"t": 699.8, "x": "終わるはずだった。"}, {"t": 700.9166666666666, "x": "保険会社は、この判断に納得せず、控訴した。"}, {"t": 704.2666666666667, "x": "二審が始まる。"}, {"t": 705.5166666666667, "x": "この裁判、どれくらい注目されていたの。"}, {"t": 708.1833333333333, "x": "この時点では、大きな事件としては扱われていない。"}, {"t": 711.3666666666667, "x": "保険金の支払いをめぐる、民事の裁判の一つだ。"}, {"t": 714.6666666666666, "x": "ただ夫の側は、自分で書いた手記を\n報道機関に配っていたと伝えられている。"}, {"t": 719.4833333333333, "x": "自分から、外に出していたのね。"}, {"t": 721.8166666666667, "x": "そう伝えられている。"}, {"t": 723.05, "x": "この時点では、その言い分のほうが通っている。"}, {"t": 725.7666666666667, "x": "一審では勝っているんだからな。"}, {"t": 727.7166666666667, "x": "……見え方が、全部ひっくり返るのね。"}, {"t": 730.1333333333333, "x": "ひっくり返る。"}, {"t": 731.1333333333333, "x": "ひっくり返したのは、一人の証人だ。"}, {"t": 734.2833333333333, "x": "時間を少し戻す。"}, {"t": 735.7166666666667, "x": "石垣島に一緒に行った、妻の友人たちのことだ。"}, {"t": 739.0, "x": "この人たちは、夫のことをおかしいと感じていた。"}, {"t": 742.2, "x": "どこが。"}, {"t": 742.9666666666667, "x": "出会ってから結婚を申し込むまでが、\n極端に早かったことだ。"}, {"t": 746.7833333333333, "x": "テレビ局のアーカイブ記事の見出しには、\n会って6日でプロポーズしたと書かれている。"}, {"t": 751.4, "x": "それから夫は妻に多くの金品を\n贈っていた、と伝えられている。"}, {"t": 755.3166666666667, "x": "さらに仕事を公認会計士だと言っていた。"}, {"t": 758.0333333333333, "x": "本当に会計士だったの。"}, {"t": 759.8166666666667, "x": "公認会計士の名簿に、その名前が載っていなかった。"}, {"t": 763.1833333333333, "x": "友人たちは、それらを警察や新聞社に訴えた。"}, {"t": 766.4333333333333, "x": "最初は、ほとんど\n取り合ってもらえなかったと言われている。"}, {"t": 769.6, "x": "だがそのうち一部の週刊誌と新聞が反応した。"}, {"t": 772.6833333333333, "x": "そして、記事が出るようになる。"}, {"t": 774.6666666666666, "x": "友人たちが、動かしたのね。"}, {"t": 776.8, "x": "ここは、はっきりさせておきたい。"}, {"t": 778.75, "x": "この事件が事件として扱われるまでに、\n二つの偶然が要った。"}, {"t": 782.7, "x": "一つは、解剖した医師が血液を残していたこと。"}, {"t": 785.9333333333333, "x": "もう一つは、友人たちが黙らなかったことだ。"}, {"t": 788.9, "x": "どちらか片方でも欠けていたら、\n心臓の病気として終わっていた。"}, {"t": 792.9666666666667, "x": "……それは、こわい話ね。"}, {"t": 794.65, "x": "こわい話だ。"}, {"t": 795.7, "x": "そして実際、そういう終わり方をしている件が\nどれだけあるのかは、誰にも分からない。"}, {"t": 800.6833333333333, "x": "友人たちは、どんな気持ちだったのかしら。"}, {"t": 803.4333333333333, "x": "そこは、想像で書かない。"}, {"t": 805.1666666666666, "x": "残っているのは、訴え続けたという事実だけだ。"}, {"t": 808.2333333333333, "x": "ただ、一つ言えることはある。"}, {"t": 810.05, "x": "この人たちは、その日、一緒に飛行機に乗っていた。"}, {"t": 813.4333333333333, "x": "ホテルで倒れるところを、すぐ横で見ている。"}, {"t": 816.1166666666667, "x": "……その場にいたのね。"}, {"t": 817.4166666666666, "x": "いた。"}, {"t": 817.9166666666666, "x": "救急車を呼んだのも、この人たちだ。"}, {"t": 820.3333333333334, "x": "だから心臓の病気でしたと言われても、\n収まらなかったんだと思う。"}, {"t": 824.8833333333333, "x": "保険金をめぐる民事の裁判、\nその二審で、状況が変わった。"}, {"t": 828.8333333333334, "x": "法廷に、解剖を担当した大野が出た。"}, {"t": 831.3333333333334, "x": "そして妻の死因について、毒物に\nよる可能性があると述べた。"}, {"t": 835.2833333333333, "x": "それまで、心筋梗塞と書いていた人が。"}, {"t": 838.15, "x": "そうだ。"}, {"t": 838.75, "x": "取っておいた血液を調べた\n結果が、出ていたということだ。"}, {"t": 842.2333333333333, "x": "この証言のあと、夫は訴えを取り下げた。"}, {"t": 845.1, "x": "取り下げ……。お金を求めるのをやめたのね。"}, {"t": 847.7333333333333, "x": "やめた。"}, {"t": 848.3666666666667, "x": "ここで、はっきり言っておく。"}, {"t": 850.0833333333334, "x": "訴えを取り下げたことは、罪を認めたことではない。"}, {"t": 853.2, "x": "裁判ではよくあることで、それ\n自体は何の認定でもない。"}, {"t": 856.65, "x": "本人は、この時も、その後も、一貫して\n自分はやっていないと言い続けている。"}, {"t": 861.5, "x": "最後まで否認したままだ。"}, {"t": 863.2, "x": "それは、この先の話でも変わらない。"}, {"t": 865.7333333333333, "x": "分かったわ。"}, {"t": 866.6666666666666, "x": "ただこの証言がきっかけになって、\n警察の見方が変わった。"}, {"t": 870.4, "x": "民事の法廷で出た話が、刑事の捜査を\n動かしたということになる。"}, {"t": 874.5166666666667, "x": "順番が、普通と逆なんだ。"}, {"t": 876.6166666666667, "x": "普通は、警察が先よね。"}, {"t": 878.65, "x": "先だ。"}, {"t": 879.3166666666667, "x": "この事件では、保険金の裁判のほうが\n先に毒にたどり着いている。"}, {"t": 884.0166666666667, "x": "ここでどうしても\n触れておかないといけないことがある。"}, {"t": 886.7833333333333, "x": "この夫には、前に2人の妻がいた。"}, {"t": 889.25, "x": "2人とも、亡くなっている。"}, {"t": 891.15, "x": "……2人とも。"}, {"t": 892.1333333333333, "x": "そうだ。"}, {"t": 892.7333333333333, "x": "ただしここから先は、注意して聞いてほしい。"}, {"t": 895.4, "x": "刑事の裁判で罪に問われたのは、\n3人目の妻の件だけだ。"}, {"t": 899.2666666666667, "x": "前の2人については、起訴もされていないし、\n有罪の認定もされていない。"}, {"t": 903.6333333333333, "x": "だからこの2人が何かの被害に\n遭ったとは、この回では言わない。"}, {"t": 907.5, "x": "決まっていないことは、決まっていないのね。"}, {"t": 910.05, "x": "決まっていない。"}, {"t": 911.0166666666667, "x": "その上で、記録に残っている形だけを並べる。"}, {"t": 914.0833333333334, "x": "1人目の妻は、1965年に結婚したと伝えられている。"}, {"t": 918.4166666666666, "x": "そして1981年に、心筋梗塞で\n亡くなった。38歳だった。"}, {"t": 923.6, "x": "この時、保険は掛かっていなかったとされている。"}, {"t": 926.5333333333333, "x": "2人目の妻には、1000万円の保険が掛けられていたと\n伝えられている。"}, {"t": 930.85, "x": "1985年に、急性心不全で亡くなっている。"}, {"t": 934.5833333333334, "x": "3人とも、心臓なのね。"}, {"t": 936.6, "x": "診断の名前としては、そうなっている。"}, {"t": 939.0166666666667, "x": "2006年の国会でも、この点が取り上げられている。"}, {"t": 942.2833333333333, "x": "冨岡委員は、こう述べている。"}, {"t": 944.15, "x": "調べていくと、三度、奥さんを心筋梗塞で\n亡くしている。その死因も、みんな心筋梗塞。"}, {"t": 950.1666666666666, "x": "これは、国会の委員会で議員が説明した内容だ。"}, {"t": 953.4, "x": "判決がそう認定した、という意味ではない。"}, {"t": 956.05, "x": "そこは、混ぜないでほしい。"}, {"t": 957.6666666666666, "x": "同じ発言の中では、保険についても\nこう述べられている。"}, {"t": 961.1333333333333, "x": "二例目で保険金は一千万、三例目は\n億という金が掛かっていた。"}, {"t": 965.25, "x": "そこでおかしいということに\n初めて気づくわけなんです。"}, {"t": 968.4, "x": "金額が、桁違いに増えているのね。"}, {"t": 970.9166666666666, "x": "そう述べられている。"}, {"t": 972.0666666666667, "x": "ただ繰り返すが、これは議員の説明だ。"}, {"t": 974.6, "x": "2人目の妻の件で、誰かが罪に問われた事実は無い。"}, {"t": 978.0666666666667, "x": "起訴されていないものを、起訴されたように語らない。"}, {"t": 981.1166666666667, "x": "分かったわ。"}, {"t": 982.05, "x": "この回で一番気をつけているのが、ここだ。"}, {"t": 984.75, "x": "3人分をひとまとめにして語ると、\n決まっていないことまで決まったように聞こえる。"}, {"t": 989.4833333333333, "x": "裁判で決まったのは、3人目の件だけだ。"}, {"t": 992.9333333333333, "x": "1991年6月9日。"}, {"t": 995.5333333333333, "x": "警視庁が、この夫を逮捕した。"}, {"t": 997.8333333333334, "x": "やっと、ね。"}, {"t": 998.9, "x": "ただしこの時の容疑は、殺人ではない。"}, {"t": 1001.5833333333334, "x": "違うの？"}, {"t": 1002.4333333333333, "x": "横領だ。別の事件だ。"}, {"t": 1004.1333333333333, "x": "いわゆる別件での逮捕になる。"}, {"t": 1006.0, "x": "事件から、5年が過ぎている。"}, {"t": 1007.9666666666667, "x": "5年前の出来事について、証拠は\n残っていないだろうと考えられていた。"}, {"t": 1012.2666666666667, "x": "現場は沖縄で、亡くなった方の体はもう無い。"}, {"t": 1015.4333333333333, "x": "手がかりが無いものね。"}, {"t": 1016.9166666666666, "x": "普通は無い。"}, {"t": 1017.75, "x": "この「普通は無い」という感覚については、\n後の国会でも語られている。"}, {"t": 1022.25, "x": "2008年4月18日、衆議院の法務委員会。"}, {"t": 1025.5666666666666, "x": "滝実委員の発言だ。"}, {"t": 1027.3666666666666, "x": "トリカブトというのは、後に何も\n残らない、心不全という結果だけが残る。"}, {"t": 1031.95, "x": "こういう事件でございましたから、捜査当局も\nほとんど最初は手がつかなかった。"}, {"t": 1036.75, "x": "手がつかなかった。"}, {"t": 1038.1, "x": "残らない、と言われている。"}, {"t": 1039.6833333333334, "x": "だが、この件では残っていた。"}, {"t": 1041.6833333333334, "x": "冷凍庫の中に、5年前の血液があったからだ。"}, {"t": 1044.8166666666666, "x": "その間に、大野は毒物の資料を読み続けていた。"}, {"t": 1047.9833333333333, "x": "そして犯行に使われた毒がトリカブトの毒であることを\n突き止めた、と伝えられている。"}, {"t": 1053.15, "x": "保存していた心臓と血液を、\n東北大学と琉球大学で分析した。"}, {"t": 1057.8, "x": "そこから、トリカブトの毒が検出された。"}, {"t": 1061.1833333333334, "x": "1991年7月1日。"}, {"t": 1063.75, "x": "警視庁は、殺人と詐欺未遂で再逮捕した。"}, {"t": 1066.7833333333333, "x": "ここで、ようやく事件になる。"}, {"t": 1068.75, "x": "5年かかったのね。"}, {"t": 1070.15, "x": "5年と、1か月と少しだ。"}, {"t": 1072.2, "x": "この逮捕の時期は、大野本人が\n書いたものにも残っている。"}, {"t": 1075.7666666666667, "x": "被疑者、つまり被害者の夫の逮捕が、1991年7月。"}, {"t": 1080.4333333333334, "x": "そう書かれている。"}, {"t": 1081.5166666666667, "x": "そして、その続きにこうある。"}, {"t": 1083.4333333333334, "x": "逮捕のあと、トリカブトの毒とともに、\nフグの毒も使われたことが判明した。"}, {"t": 1088.35, "x": "フグ？"}, {"t": 1089.0, "x": "フグだ。"}, {"t": 1089.6333333333334, "x": "ここが、この事件の一番の山になる。"}, {"t": 1092.1, "x": "血液から出たのは、トリカブトの毒だけではなかった。"}, {"t": 1095.4, "x": "1992年の論文には、こう書いてある。"}, {"t": 1098.5166666666667, "x": "冷凍庫に保存された被害者の血液から、アコニチン、\nメサコニチン、ヒパコニチンが検出された。"}, {"t": 1104.6, "x": "これはすべて、トリカブトに含まれる毒の成分だ。"}, {"t": 1107.7, "x": "そして後に、同じ血液から\nフグ毒のテトロドトキシンも検出された。"}, {"t": 1112.1833333333334, "x": "同じ血から、2種類の毒が。"}, {"t": 1114.3333333333333, "x": "2種類だ。"}, {"t": 1115.1666666666667, "x": "普通に考えれば、意味が分からない。"}, {"t": 1117.4166666666667, "x": "どちらか一方でも、十分に危ない毒だからだ。"}, {"t": 1120.4166666666667, "x": "なぜ、わざわざ2つなのか。"}, {"t": 1122.3, "x": "この問いに答えるのに、\n何年もの実験が要ることになる。"}, {"t": 1126.3833333333334, "x": "ここでトリカブトそのものの話をしておく。"}, {"t": 1128.9333333333334, "x": "キンポウゲ科の植物だ。"}, {"t": 1130.55, "x": "紫や青の、変わった形の花をつける。"}, {"t": 1133.45, "x": "山で見る花よね。"}, {"t": 1134.85, "x": "日本の山にも普通に生えている。"}, {"t": 1136.8333333333333, "x": "厚生労働省が、\n自然の毒についての資料を出している。"}, {"t": 1140.3, "x": "その中で、トリカブト類は、こう書かれている。"}, {"t": 1143.15, "x": "有毒成分は、アルカロイド。"}, {"t": 1144.9333333333334, "x": "アコニチン、メサコニチン、ヒパコニチンなど。"}, {"t": 1147.8, "x": "……血液から出たのと、同じ名前ね。"}, {"t": 1150.2833333333333, "x": "同じだ。"}, {"t": 1150.9833333333333, "x": "厚生労働省の表では、毒性の欄がこうなっている。"}, {"t": 1154.2, "x": "茎、葉、花、地下部。そのすべてが、強毒。"}, {"t": 1157.6333333333334, "x": "全部だ。どこを取っても毒がある。"}, {"t": 1159.85, "x": "全部なの。"}, {"t": 1160.8, "x": "全部だ。"}, {"t": 1161.5166666666667, "x": "ちなみにこの資料の概要版には、致死量も、\n症状も、時間も書かれていない。"}, {"t": 1166.3666666666666, "x": "この回では、そこには踏み込まない。"}, {"t": 1168.55, "x": "分量の話も、手に入れ方の話も、\nこの動画ではしない。"}, {"t": 1172.3166666666666, "x": "それは調べれば分かる、という\n種類の話ではないからだ。"}, {"t": 1175.7666666666667, "x": "それでいいと思うわ。"}, {"t": 1177.0833333333333, "x": "一つだけ言えるのは、ごくわずかな\n量で命に関わる、ということだ。"}, {"t": 1181.1833333333334, "x": "そして山菜と間違えて口にする\n事故が、今でも毎年起きている。"}, {"t": 1185.2666666666667, "x": "この事件のあと、トリカブトという\n名前は全国に知られることになった。"}, {"t": 1189.5166666666667, "x": "フグのほうは、どうなの。"}, {"t": 1191.15, "x": "フグ毒は、テトロドトキシンという名前だ。"}, {"t": 1193.7166666666667, "x": "フグの卵巣や肝臓、皮などに含まれている。"}, {"t": 1196.55, "x": "こちらも、ごく少ない量で\n危ない毒として知られている。"}, {"t": 1199.9833333333333, "x": "どっちも、聞いたことがある名前ね。"}, {"t": 1202.25, "x": "日本では、どちらもよく知られている。"}, {"t": 1204.4833333333333, "x": "普通は、この2つが一つの話の中に\n出てくることはない。"}, {"t": 1208.35, "x": "それが、同じ血から出たのね。"}, {"t": 1210.4166666666667, "x": "出た。"}, {"t": 1210.95, "x": "だからこの事件は法医学の世界でも\n特別な一件になった。"}, {"t": 1214.7, "x": "それまで、2つの毒を一緒に人に入れた\n例が知られていなかったからだ。"}, {"t": 1219.5333333333333, "x": "捜査が進むと、買い物の記録が出てきた。"}, {"t": 1222.3666666666666, "x": "福島県の西白河郡にある、高山植物の店。"}, {"t": 1225.9, "x": "そこの店主が、この人物にトリカブトを\n69鉢売った、と証言している。"}, {"t": 1230.85, "x": "69鉢。園芸にしては、多すぎない？"}, {"t": 1233.8, "x": "多い。"}, {"t": 1234.25, "x": "ただし本人の説明は、観賞用に\n買ったというものだった。"}, {"t": 1237.8833333333334, "x": "花がきれいだから育てていた、という言い分だ。"}, {"t": 1240.6666666666667, "x": "この数字は、公判で証言として出たものだ。"}, {"t": 1243.5166666666667, "x": "そこは、押さえておいてほしい。"}, {"t": 1245.2833333333333, "x": "それから借りていたアパートについても話が出ている。"}, {"t": 1248.2166666666667, "x": "大家が、水道代と電気代が異常に高い\n月があったと話した、と伝えられている。"}, {"t": 1253.4, "x": "部屋で、何かしていた。"}, {"t": 1255.15, "x": "そこは決めつけない。"}, {"t": 1256.4333333333334, "x": "ただ警察がその部屋を調べたところ、畳から\nトリカブトの毒が検出されたとされている。"}, {"t": 1261.9333333333334, "x": "これも、報道と、それをまとめた本から来ている話だ。"}, {"t": 1265.4666666666667, "x": "公式の記録で確かめられたものではない。"}, {"t": 1268.1333333333334, "x": "出どころは、はっきりさせておくのね。"}, {"t": 1270.5, "x": "はっきりさせておく。"}, {"t": 1271.7333333333333, "x": "この回では、そこを曖昧にしない。"}, {"t": 1273.8833333333334, "x": "確定しているのは、有罪になったという\n結論のところだけだ。"}, {"t": 1277.65, "x": "その手前の細かい話は、ほとんどが報道由来になる。"}, {"t": 1281.7333333333333, "x": "そしてもう一つの買い物が出てくる。"}, {"t": 1283.95, "x": "漁師が、クサフグを1000匹以上売った、と\n話したと伝えられている。"}, {"t": 1288.1, "x": "1000匹以上のフグ。"}, {"t": 1289.4833333333333, "x": "クサフグは、小さいフグだ。"}, {"t": 1291.2333333333333, "x": "食用として大量に売れるような魚ではない。"}, {"t": 1293.9333333333334, "x": "本人の説明は、食品会社を起こすために\n買った、というものだった。"}, {"t": 1298.4333333333334, "x": "フグの会社。"}, {"t": 1299.5333333333333, "x": "そういう言い分だ。"}, {"t": 1300.6166666666666, "x": "この証言を受けて、警視庁は\n血液をもう一度調べることにした。"}, {"t": 1304.65, "x": "琉球大学に保存されていた血液を、\n東北大学の協力で改めて分析した。"}, {"t": 1309.9333333333334, "x": "そこから、フグ毒のテトロドトキシンが出た。"}, {"t": 1312.75, "x": "買っていたものと、血から出たものが合っているのね。"}, {"t": 1315.7666666666667, "x": "合っている。"}, {"t": 1316.4666666666667, "x": "トリカブトを買い、フグを買い、\n亡くなった方の血液からその両方が出た。"}, {"t": 1320.8666666666666, "x": "ここまでが、いわゆる状況証拠と呼ばれるものだ。"}, {"t": 1323.7666666666667, "x": "ただしこの段階でも、決定的なものは何も無い。"}, {"t": 1327.0666666666666, "x": "どうして。"}, {"t": 1327.9166666666667, "x": "飲ませたところを誰も見ていないからだ。"}, {"t": 1330.1666666666667, "x": "残っている物もない。"}, {"t": 1331.3833333333334, "x": "器も、容器も、薬も出ていない。"}, {"t": 1333.9, "x": "そして何より、11時40分に\n別れて以降、その場にいない。"}, {"t": 1337.9, "x": "時間の壁が、まだ立ったままなんだ。"}, {"t": 1340.8833333333334, "x": "公判で焦点になったのは、いつ、\nどうやって飲ませたのか、だった。"}, {"t": 1344.9833333333333, "x": "弁護側の主張は、はっきりしていた。"}, {"t": 1347.4, "x": "アコニチンは、効き始めるのが早い毒だ。"}, {"t": 1350.0166666666667, "x": "飲めば、すぐに症状が出る。"}, {"t": 1351.9666666666667, "x": "じゃあ、別れる前に飲ませていたら。"}, {"t": 1354.2333333333333, "x": "那覇空港で、その場で倒れているはずだ。"}, {"t": 1356.7, "x": "ところが実際に倒れたのは、石垣島のホテルだった。"}, {"t": 1360.15, "x": "別れてから、おおよそ1時間半ほど後になる。"}, {"t": 1363.2166666666667, "x": "その時間、どう説明するの。"}, {"t": 1365.2833333333333, "x": "説明できない、というのが弁護側の言い分だった。"}, {"t": 1368.25, "x": "つまり、これはアリバイだ。"}, {"t": 1369.7666666666667, "x": "ちなみにこの時間の長さは、\n資料によって書き方が違う。"}, {"t": 1373.3666666666666, "x": "テレビ番組では1時間40分と言われ、\n別の番組では1時間35分とされている。"}, {"t": 1378.9833333333333, "x": "数字が揺れているのね。"}, {"t": 1380.5333333333333, "x": "揺れている。だから、この回では時刻のほうで言う。"}, {"t": 1383.5, "x": "11時40分に別れ、15時4分に\n亡くなった。ここは動かない。"}, {"t": 1387.9333333333334, "x": "さて、検察側も黙って見ていたわけではない。"}, {"t": 1390.8, "x": "薬をカプセルに入れれば、溶けるまで時間がかかる。"}, {"t": 1393.8666666666666, "x": "それなら、効き始めを遅らせられるのではないか。"}, {"t": 1396.75, "x": "そこで千葉大学に、カプセルで\n遅らせられるかどうかの検証を頼んだ。"}, {"t": 1401.0, "x": "結果は。"}, {"t": 1401.8666666666666, "x": "二重にしても、三重にしても、5分から10分だった。"}, {"t": 1405.2333333333333, "x": "1時間半には、まったく足りない。"}, {"t": 1407.5666666666666, "x": "じゃあ、弁護側が正しいことに……。"}, {"t": 1409.6833333333334, "x": "この時点では、そう見えた。"}, {"t": 1411.45, "x": "那覇空港で別れたあと、夫は妻に近づいていない。"}, {"t": 1414.6333333333334, "x": "妻は飛行機に乗り、友人3人と一緒にいた。"}, {"t": 1417.6333333333334, "x": "つまり途中で誰かが何かを渡すこともできない。"}, {"t": 1420.6833333333334, "x": "ずっと、人の目があったのね。"}, {"t": 1422.7333333333333, "x": "あった。"}, {"t": 1423.3166666666666, "x": "そして毒はすぐ効くものとされていた。"}, {"t": 1425.6, "x": "だから飲んだのは倒れる直前でなければならない。"}, {"t": 1428.3833333333334, "x": "だがその時間帯に夫はその場にいない。"}, {"t": 1430.8, "x": "この形を崩すには、毒が遅れて\n効いたことを示すしかない。"}, {"t": 1434.6666666666667, "x": "そんなこと、できるの。"}, {"t": 1436.3166666666666, "x": "普通は、できない。"}, {"t": 1437.5833333333333, "x": "カプセルでも、5分から10分だったからな。"}, {"t": 1440.3, "x": "ところがこの事件では、\nその「普通は」の外側に答えがあった。"}, {"t": 1445.0666666666666, "x": "ここで、大野が法廷に立つ。"}, {"t": 1446.9666666666667, "x": "そして2つの毒の組み合わせについて述べた。"}, {"t": 1449.6833333333334, "x": "量のつり合いを調整すれば、互いの効き目を\n弱め合うことがある、という内容だ。"}, {"t": 1454.3666666666666, "x": "毒どうしが、打ち消し合うの？"}, {"t": 1456.35, "x": "仕組みを、できるだけ簡単に言う。"}, {"t": 1458.4333333333334, "x": "人の細胞の膜には、ナトリウムが\n出入りする通り道がある。"}, {"t": 1462.0, "x": "ナトリウムチャネルと呼ばれる。"}, {"t": 1463.6166666666666, "x": "神経や心臓が動くとき、この通り道が\n開いたり閉じたりしている。"}, {"t": 1467.8333333333333, "x": "門みたいなものね。"}, {"t": 1469.2166666666667, "x": "そう思っていい。"}, {"t": 1470.1666666666667, "x": "大野が書いているところによると、\n2つの毒は、どちらもこの門に作用する。"}, {"t": 1474.6666666666667, "x": "ただし、向きが逆だ。"}, {"t": 1476.2, "x": "フグ毒のテトロドトキシンは、\nナトリウムが流れ込むのを邪魔する。"}, {"t": 1479.9333333333334, "x": "トリカブトのアコニチンは、逆に\n門を開いて、流れ込むのを進める。"}, {"t": 1484.1833333333334, "x": "閉める側と、開ける側。"}, {"t": 1485.9666666666667, "x": "そうだ。"}, {"t": 1486.5833333333333, "x": "だから両方が同時に体の中にあると、\n互いに打ち消し合う形になる。"}, {"t": 1490.9333333333334, "x": "この打ち消し合いのことを、拮抗作用と呼ぶ。"}, {"t": 1493.6, "x": "そして大野は、こう考えた。"}, {"t": 1495.5, "x": "2つがぶつかっている間は、症状が出ない。"}, {"t": 1498.2333333333333, "x": "だが片方が先に体から消えれば、つり合いが崩れる。"}, {"t": 1501.75, "x": "残ったほうが、効き始めるのね。"}, {"t": 1504.0166666666667, "x": "そういう説明になる。"}, {"t": 1505.3666666666666, "x": "この説明なら、遅れて倒れたことに説明がつく。"}, {"t": 1508.7, "x": "どうして、片方だけ先に消えるの。"}, {"t": 1511.1333333333334, "x": "体から抜けていく速さが、毒によって違うからだ。"}, {"t": 1514.4333333333334, "x": "血の中の量が半分になるまでの時間を、\n半減期と言う。"}, {"t": 1517.9, "x": "この2つは、その半減期が違うとされている。"}, {"t": 1520.8666666666666, "x": "フグ毒のほうが、先に減っていく。"}, {"t": 1523.2333333333333, "x": "閉める側が、先にいなくなるのね。"}, {"t": 1525.6166666666666, "x": "そうなる。"}, {"t": 1526.3, "x": "閉める力が弱まると、開ける側だけが残る。"}, {"t": 1529.2333333333333, "x": "そこから、症状が出始める。"}, {"t": 1531.2166666666667, "x": "つまり飲んだ時ではなく、\nつり合いが崩れた時に倒れる。"}, {"t": 1534.6833333333334, "x": "……時間を、ずらせるということね。"}, {"t": 1536.7666666666667, "x": "理屈の上では、そうなる。"}, {"t": 1539.0833333333333, "x": "ただし説明がつくことと、それが起きることは別だ。"}, {"t": 1542.35, "x": "本当にそうなるのかを、確かめないといけない。"}, {"t": 1545.2333333333333, "x": "どうやって確かめるの。"}, {"t": 1546.7833333333333, "x": "実験だ。"}, {"t": 1547.6333333333334, "x": "大野たちは、マウスを使って調べた。"}, {"t": 1550.0, "x": "その結果が、1992年に医学雑誌に載っている。"}, {"t": 1553.7833333333333, "x": "英語の論文で、受け付けられたのが\n1992年の3月31日だ。"}, {"t": 1558.8166666666666, "x": "中身を、数字を伏せた形で言う。"}, {"t": 1561.05, "x": "まずトリカブトの毒だけを与えた群。"}, {"t": 1563.2166666666667, "x": "これは、全部のマウスが死んだ。"}, {"t": 1565.3, "x": "全部。"}, {"t": 1566.0166666666667, "x": "全部だ。"}, {"t": 1566.7333333333333, "x": "次に、同じ量のトリカブトの毒に、\nフグ毒を混ぜて与えた群。"}, {"t": 1570.6666666666667, "x": "こちらは、5匹のうち2匹が生き残った。"}, {"t": 1573.5166666666667, "x": "生き残った？"}, {"t": 1574.5833333333333, "x": "生き残った。"}, {"t": 1575.5333333333333, "x": "そして死んだ個体についても、\n死ぬまでの時間が延びていた。"}, {"t": 1579.0833333333333, "x": "論文には、フグ毒の量に比例して、\n死亡までの時間が有意に遅れたと書かれている。"}, {"t": 1584.1833333333334, "x": "さらに、こういう記述もある。"}, {"t": 1585.9833333333333, "x": "フグ毒を多めに混ぜた群では、1時間以内に\n中毒の症状がほとんど完全に消えた個体があった。"}, {"t": 1591.9333333333334, "x": "消えた。治ったように見えたのね。"}, {"t": 1594.1, "x": "見えただけだ。"}, {"t": 1595.0666666666666, "x": "論文の続きは、こうなっている。"}, {"t": 1597.1166666666666, "x": "しばらく時間が経ったあと、これらのマウスは\n突然吐き、けいれんを起こして死んだ。"}, {"t": 1601.9166666666667, "x": "……いったん良くなって、あとから。"}, {"t": 1603.8833333333334, "x": "あとからだ。"}, {"t": 1604.7, "x": "この観察が、そのまま、\n1時間半の壁に対する答えになった。"}, {"t": 1609.1333333333334, "x": "あの、一つ聞いていい。"}, {"t": 1610.7333333333333, "x": "なんだ。"}, {"t": 1611.4666666666667, "x": "マウスで起きたことが、人でも起きるって言えるの。"}, {"t": 1614.45, "x": "いい質問だ。そこは、慎重に扱われている。"}, {"t": 1617.5, "x": "論文の結論は、生き物の体の中で、フグ毒が\nトリカブトの毒の働きを弱めると考えられる。"}, {"t": 1623.8, "x": "そういう形になっている。"}, {"t": 1625.35, "x": "断定はしていない。"}, {"t": 1626.5833333333333, "x": "そして大野自身も、\n2019年の文章の最後でこう書いている。"}, {"t": 1630.6333333333334, "x": "2つの毒を混ぜた時に死に至る仕組みや、\n互いの影響には、まだ分からない部分が残っている。"}, {"t": 1636.4333333333334, "x": "本人が、まだ分からないと書いているのね。"}, {"t": 1639.1, "x": "書いている。"}, {"t": 1639.8666666666666, "x": "30年近く研究を続けて、それでも、そう書いている。"}, {"t": 1643.5666666666666, "x": "この回でも、そこは同じように扱う。"}, {"t": 1646.0166666666667, "x": "そう考えれば説明がつく、という説明が出された。"}, {"t": 1649.2666666666667, "x": "そして裁判所はその説明を採った。"}, {"t": 1651.6, "x": "私が言えるのは、そこまでだ。"}, {"t": 1654.2, "x": "この事件の裁判は、\n直接の証拠が無いまま進んでいる。"}, {"t": 1657.9, "x": "直接の証拠って、どういうもの。"}, {"t": 1660.2, "x": "飲ませる場面を見た人。"}, {"t": 1661.6333333333334, "x": "認めた言葉。使った器。そういうものだ。"}, {"t": 1664.6333333333334, "x": "この件では、どれも出ていない。"}, {"t": 1666.5166666666667, "x": "本人は、最初から最後まで否認し続けている。"}, {"t": 1669.6, "x": "だから残るのは、状況証拠の積み重ねになる。"}, {"t": 1672.65, "x": "保険の入り方。前の妻たちのこと。"}, {"t": 1674.9666666666667, "x": "買っていたもの。血液から出た2つの毒。"}, {"t": 1677.8, "x": "そして時間のずれを説明できる仕組みがあったこと。"}, {"t": 1680.9333333333334, "x": "一つ一つは、決め手にならないのね。"}, {"t": 1683.5, "x": "ならない。"}, {"t": 1684.1333333333334, "x": "トリカブトを買っていただけなら、罪にはならない。"}, {"t": 1687.1, "x": "フグも同じよね。"}, {"t": 1688.3666666666666, "x": "同じだ。保険に入ることだって、\nそれだけなら誰でもやっている。"}, {"t": 1692.3166666666666, "x": "それを全部並べた時に、他の説明が成り立つかどうか。"}, {"t": 1695.9, "x": "裁判で問われたのは、そこだ。"}, {"t": 1698.0166666666667, "x": "全部が偶然だったかもしれない、とは考えないの。"}, {"t": 1701.1666666666667, "x": "そこを争ったのが、この裁判だ。"}, {"t": 1703.4166666666667, "x": "弁護側は、どれも別々の理由で\n説明できると主張した。"}, {"t": 1707.1333333333334, "x": "観賞用、起業のため、健康のための保険。"}, {"t": 1710.0833333333333, "x": "一つずつ見れば、そう言えなくもない。"}, {"t": 1712.35, "x": "状況証拠だけで有罪にする、というのは、\nそういう作業だ。"}, {"t": 1715.9333333333334, "x": "だからこの事件は今でも\n法律の教科書で取り上げられる。"}, {"t": 1719.3833333333334, "x": "それで、間違えることは無いの。"}, {"t": 1721.4666666666667, "x": "ある。"}, {"t": 1721.9166666666667, "x": "状況証拠だけで有罪になった件が、\n後から覆ったことは実際にある。"}, {"t": 1726.2166666666667, "x": "このチャンネルでも、そういう回を扱ってきた。"}, {"t": 1728.9666666666667, "x": "だから状況証拠は\n危ないものだ、という見方はずっとある。"}, {"t": 1732.4833333333333, "x": "この件も、そう言われているの。"}, {"t": 1734.5, "x": "言われている。"}, {"t": 1735.3333333333333, "x": "本人が最後まで否認していて、\n直接の証拠が無いからだ。"}, {"t": 1739.0833333333333, "x": "無実だったのではないか、という指摘は今もある。"}, {"t": 1742.0166666666667, "x": "私は、どちらが正しいかを決めない。"}, {"t": 1744.3666666666666, "x": "この回でできるのは、何が確定していて、\n何が確定していないかを並べることだけだ。"}, {"t": 1749.8, "x": "……決めないのね。"}, {"t": 1750.8666666666666, "x": "決めない。"}, {"t": 1751.5333333333333, "x": "ただ確定しているものは、確定していると言う。"}, {"t": 1754.4, "x": "無期懲役は確定している。そこは動かない。"}, {"t": 1757.8, "x": "ここで一度だけ名前を出しておく。"}, {"t": 1759.8333333333333, "x": "起訴され、有罪が確定したのは、神谷力受刑者だ。"}, {"t": 1763.5333333333333, "x": "この方は、獄中で\n自分の名前を出して本を書いている。"}, {"t": 1766.9166666666667, "x": "だから名前を伏せる理由がない。"}, {"t": 1768.8833333333334, "x": "亡くなった方のほうは、出さないのね。"}, {"t": 1771.3166666666666, "x": "出さない。そこは変えない。"}, {"t": 1772.9333333333334, "x": "1994年、平成6年。"}, {"t": 1775.4, "x": "東京地裁は、求刑通りの無期懲役を言い渡した。"}, {"t": 1778.7833333333333, "x": "求刑通り。"}, {"t": 1779.8166666666666, "x": "検察が求めた通りの重さだ。"}, {"t": 1781.9166666666667, "x": "本人は控訴した。"}, {"t": 1783.2333333333333, "x": "二審の東京高裁も、一審の判断を支持した。"}, {"t": 1786.4166666666667, "x": "そして上告。"}, {"t": 1787.4833333333333, "x": "2000年、平成12年の2月21日。"}, {"t": 1790.4666666666667, "x": "最高裁が上告を棄却した。"}, {"t": 1792.5, "x": "これで、無期懲役が確定した。"}, {"t": 1794.8166666666666, "x": "事件からだと、どれくらい。"}, {"t": 1796.6833333333334, "x": "1986年5月から2000年2月まで。13年9か月だ。"}, {"t": 1801.4833333333333, "x": "逮捕からでも、8年を超えている。"}, {"t": 1803.8166666666666, "x": "長いわね。"}, {"t": 1804.7666666666667, "x": "長い。"}, {"t": 1805.3, "x": "ただここで一つ、断っておきたいことがある。"}, {"t": 1808.1, "x": "この判決文そのものを、公のデータベースで\n読むことはできなかった。"}, {"t": 1812.2666666666667, "x": "古い刑事事件は、裁判所の裁判例検索に\n載っていないことが多い。"}, {"t": 1816.5, "x": "だからこの回では判決の中身に踏み込まない。"}, {"t": 1819.35, "x": "無期懲役が言い渡され、\n支持され、確定した。そこまでだ。"}, {"t": 1823.35, "x": "中を読めていないなら、そうするしかないわね。"}, {"t": 1826.15, "x": "そうするしかない。"}, {"t": 1827.2333333333333, "x": "ちなみに検索するとよく似た判決文が\n出てくるので、一つ注意しておく。"}, {"t": 1831.8333333333333, "x": "主文が無期懲役で、毒を使った\n保険金の事件の判決文がある。"}, {"t": 1836.15, "x": "中を開くと、埼玉県で起きた別の事件のものだった。"}, {"t": 1839.9, "x": "紛らわしいわね。"}, {"t": 1841.1333333333334, "x": "紛らわしい。だから、中を\n開いて確かめないといけない。"}, {"t": 1845.2, "x": "この事件は、その後も国会で何度か名前が出ている。"}, {"t": 1848.45, "x": "確認できたのは、8回分の発言だ。"}, {"t": 1851.3166666666666, "x": "何の話で出てくるの。"}, {"t": 1853.0166666666667, "x": "ほとんどが、解剖の話だ。"}, {"t": 1854.9833333333333, "x": "2006年6月6日、冨岡委員の発言。"}, {"t": 1858.0333333333333, "x": "この方は、都道府県ごとの解剖率の差を\n問題にしている。"}, {"t": 1861.7166666666667, "x": "会議録には、こうある。"}, {"t": 1863.2166666666667, "x": "トップの解剖率は、都道府県別で\n言うと、神奈川県が一番ですね。"}, {"t": 1867.5, "x": "二九％ぐらいあります。"}, {"t": 1869.5833333333333, "x": "ただし鹿児島では一・九八、二％に行かない。"}, {"t": 1872.8833333333334, "x": "何と十五倍の解剖率の差がございます。"}, {"t": 1875.6, "x": "十五倍。"}, {"t": 1876.45, "x": "住んでいる場所で、そこまで違う。"}, {"t": 1878.4833333333333, "x": "ちなみにこの事件が起きた\n沖縄については、こう述べている。"}, {"t": 1881.9333333333334, "x": "トリカブト事件が起こった沖縄は、ちなみに\n第五位ですね、二〇％ぐらいの解剖率。"}, {"t": 1887.4166666666667, "x": "2005年3月30日には、\n樽井良和委員がこう述べている。"}, {"t": 1891.4666666666667, "x": "石垣島で旅行中の妻が殺害された\nトリカブト事件というのは。"}, {"t": 1895.5, "x": "これは最初は発見されずに二件目で発見された。"}, {"t": 1898.7166666666667, "x": "二件目で。"}, {"t": 1899.65, "x": "この発言も、議員が委員会で説明した内容だ。"}, {"t": 1902.7333333333333, "x": "判決の認定ではない。"}, {"t": 1904.3666666666666, "x": "同じ発言の中で、費用の話もされている。"}, {"t": 1907.3833333333334, "x": "薬物を調べるのに、民間に頼むと二十万ぐらいかかる。"}, {"t": 1911.05, "x": "だが実際には二万円ぐらいでやられている、と\n述べられている。"}, {"t": 1914.4666666666667, "x": "立ち会った医師への謝礼は、\n三千円ぐらいだとも言っている。"}, {"t": 1917.9333333333334, "x": "……お金の話になるのね。"}, {"t": 1919.6833333333334, "x": "なる。"}, {"t": 1920.1833333333334, "x": "2006年6月13日には、\n警察庁の刑事局長がこう答えている。"}, {"t": 1924.9166666666667, "x": "瞳孔の状態、口臭、死斑の色。\nそういう所見をまず綿密に観察する。"}, {"t": 1929.75, "x": "疑いがあれば、血液や尿を採って、\n科学警察研究所で検査をする。"}, {"t": 1934.2833333333333, "x": "今は、そういう手順が答弁として語られている。"}, {"t": 1937.2333333333333, "x": "1986年の石垣島には、\nその手順が回っていなかった、ということでもある。"}, {"t": 1942.9333333333334, "x": "もっと前の記録もあるの。"}, {"t": 1944.6666666666667, "x": "ある。一番古いのは1992年3月12日、\n参議院の法務委員会だ。"}, {"t": 1950.0, "x": "逮捕の8か月後で、まだ判決も出ていないころだ。"}, {"t": 1953.3, "x": "中野鉄造委員が、保険金がからんだ\n事件をいくつも並べている。"}, {"t": 1957.3166666666666, "x": "その中に、沖縄のトリカブト事件という\n言い方で出てくる。"}, {"t": 1961.0, "x": "この時点では、まだ決まっていないのね。"}, {"t": 1963.4833333333333, "x": "決まっていない。"}, {"t": 1964.4333333333334, "x": "ついでに言うと、その並びの中には、\nロサンゼルスの三浦事件も入っている。"}, {"t": 1968.9166666666667, "x": "この件は、その後、銃で\n撃たれたほうについては無罪が確定している。"}, {"t": 1973.1833333333334, "x": "……並んでいたけど、結果は違ったのね。"}, {"t": 1975.6833333333334, "x": "違った。"}, {"t": 1976.4166666666667, "x": "だから並べられていたという事実だけを言う。"}, {"t": 1978.9, "x": "同じ種類の事件だった、とは言わない。"}, {"t": 1981.3, "x": "1992年の国会では、そう並んでいた。それだけだ。"}, {"t": 1985.4166666666667, "x": "こういうところで、後から見ると\n危ない言い方が残ってしまう。"}, {"t": 1989.55, "x": "最後に、並べ直しておく。"}, {"t": 1991.3833333333334, "x": "1986年5月20日、沖縄県の石垣島で、\n33歳の女性が亡くなった。"}, {"t": 1997.5833333333333, "x": "旅行の初日、ホテルに入った直後だった。"}, {"t": 2000.3666666666666, "x": "死因は、当初、急性心筋梗塞とされた。"}, {"t": 2003.3666666666666, "x": "解剖した医師が納得せず、血液を冷凍庫に保存した。"}, {"t": 2006.9833333333333, "x": "その血液から、5年後に、\nトリカブトの毒とフグの毒が検出された。"}, {"t": 2011.5333333333333, "x": "妻には、4社合わせて\n1億8,500万円の生命保険が掛けられていたと\n報じられている。"}, {"t": 2017.2166666666667, "x": "1991年6月9日に別件で逮捕、\n7月1日に殺人と詐欺未遂で再逮捕。"}, {"t": 2023.6333333333334, "x": "1994年に東京地裁が無期懲役、東京高裁も支持。"}, {"t": 2028.0, "x": "2000年2月21日、最高裁が上告を棄却して確定した。"}, {"t": 2032.4666666666667, "x": "そして2012年11月17日、神谷力受刑者は\n大阪医療刑務所で病死した。73歳だった。"}, {"t": 2039.6833333333334, "x": "最後まで、認めなかったのね。"}, {"t": 2041.85, "x": "認めていない。"}, {"t": 2042.8166666666666, "x": "服役中に2冊の本を出して、無実を訴え続けている。"}, {"t": 2046.5166666666667, "x": "中身は読んでいないので、この回では触れない。"}, {"t": 2049.116666666667, "x": "ただそういう本が出ていることは、\n事実として言っておく。"}, {"t": 2052.35, "x": "ここまで話したことが、\nどこから来ているのかも書いておく。"}, {"t": 2055.766666666667, "x": "毒の検出と動物実験は、\n東北大学の医学雑誌の1992年の論文。"}, {"t": 2061.4, "x": "それと、日本医科大学の医学会雑誌に\n載った2019年の記念講演だ。"}, {"t": 2066.1833333333334, "x": "どちらも、解剖を担当した\n大野曜吉医師が書いたものだ。"}, {"t": 2069.6833333333334, "x": "国会での発言は、\n国立国会図書館の国会会議録検索システムから。"}, {"t": 2074.7, "x": "1992年3月12日の参議院法務委員会。"}, {"t": 2078.4666666666667, "x": "2005年3月30日と、2006年6月13日と、\n2008年4月18日の衆議院法務委員会。"}, {"t": 2085.9, "x": "それから2006年6月6日の\n衆議院決算行政監視委員会第二分科会。"}, {"t": 2090.8333333333335, "x": "トリカブトの成分は、厚生労働省の自然毒の資料だ。"}, {"t": 2094.4, "x": "事件の経過と、保険の金額と、裁判の年は、\n報道と、それをまとめた本から取っている。"}, {"t": 2100.4333333333334, "x": "そのうえで、決まっていないことを数えておく。"}, {"t": 2103.0, "x": "一つ。飲ませた場面を見た人は、いない。"}, {"t": 2105.75, "x": "二つ。使われた器も、容器も、出ていない。"}, {"t": 2108.866666666667, "x": "三つ。前の2人の妻については、\n罪に問われていない。"}, {"t": 2112.366666666667, "x": "四つ。本人の言い分と、裁判所の判断は、\n最後まで噛み合わなかった。"}, {"t": 2117.1666666666665, "x": "確定はしているけれど、\n本人の中では終わっていないのね。"}, {"t": 2120.766666666667, "x": "そういう終わり方だ。"}, {"t": 2122.016666666667, "x": "この事件が残したものも、一つだけ言っておく。"}, {"t": 2125.0333333333333, "x": "解剖した医師が血液を\n取っておかなければ、何も出なかった。"}, {"t": 2128.75, "x": "友人たちが黙っていたら、誰も調べ直さなかった。"}, {"t": 2132.0666666666666, "x": "どちらも、決まった手順でやったことではない。"}, {"t": 2134.8333333333335, "x": "……偶然が二つ、重なったのね。"}, {"t": 2137.05, "x": "重なった。"}, {"t": 2137.9, "x": "だから国会では、20年経っても\nまだ解剖率の話として出てくる。"}, {"t": 2142.25, "x": "私がこの回で一番こわいと\n思ったのは、毒の名前ではない。"}, {"t": 2146.016666666667, "x": "心臓の病気として、そのまま終わっていたかも\nしれない、というところだ。"}, {"t": 2150.1833333333334, "x": "終わっていたら、この話は誰も知らないままだった。"}, {"t": 2153.35, "x": "……取っておいた血液だけが、残したのね。"}, {"t": 2156.0666666666666, "x": "それだけだ。"}, {"t": 2156.9333333333334, "x": "気づいたことや、あたれる資料を知っている\n人がいたら、コメントで教えてくれ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
