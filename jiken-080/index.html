<script>
const D={"name": "080", "file": "080_編集用", "dur": 2038.55, "segs": [], "subs": [{"t": 0.0, "x": "1993年、平成5年。"}, {"t": 2.4833333333333334, "x": "埼玉県の北のほう、熊谷市と行田市を\n中心とした狭い範囲で、四人が消えた。"}, {"t": 7.75, "x": "4月に一人。7月に二人。8月に一人。"}, {"t": 11.2, "x": "四か月で四人。"}, {"t": 12.5, "x": "全員、ある一人の男と関わりがあった。"}, {"t": 15.133333333333333, "x": "犬猫の繁殖と販売を手がけていた、\n関根元という人物だ。"}, {"t": 19.35, "x": "この人は後に殺人罪などで死刑が確定し、\n2017年に東京拘置所で亡くなっている。"}, {"t": 25.133333333333333, "x": "今回扱うのは、その四人がどう\n消えたか、という話ではない。"}, {"t": 29.033333333333335, "x": "扱うのは、こっちだ。"}, {"t": 30.583333333333332, "x": "なぜ、四人も消えて、すぐには\n事件にならなかったのか。"}, {"t": 34.2, "x": "四人でしょ。さすがに気づくんじゃないの。"}, {"t": 36.68333333333333, "x": "気づいていた。"}, {"t": 37.56666666666667, "x": "警察は、一人目が消えた直後から事件性を\n疑って、この人物の監視と尾行まで始めている。"}, {"t": 43.68333333333333, "x": "それでも、二人目も、三人目も、\n四人目も止められなかった。"}, {"t": 47.666666666666664, "x": "逮捕できたのは、一人目が\n消えてから一年八か月あとだ。"}, {"t": 51.5, "x": "その間、何をしていたの。"}, {"t": 53.35, "x": "何もしなかったわけじゃない。できなかったんだ。"}, {"t": 56.083333333333336, "x": "理由は一つ。物証が無かった。"}, {"t": 58.25, "x": "この回は、そこだけを最初から最後まで追う。"}, {"t": 61.0, "x": "疑っているのに手が出せない、という\n状態が、一年八か月続いたらどうなるか。"}, {"t": 65.9, "x": "そして、それが最後にどうやって崩れたのか。"}, {"t": 68.65, "x": "先に断っておくことが二つある。"}, {"t": 70.86666666666666, "x": "一つ。この動画では、被害者のお名前は出さない。"}, {"t": 73.86666666666666, "x": "遺体がどう扱われたかも話さない。"}, {"t": 76.11666666666666, "x": "話さない、というのは、ぼかすという意味じゃない。"}, {"t": 78.71666666666667, "x": "一行も書かないという意味だ。"}, {"t": 80.58333333333333, "x": "二つ。この事件は、映画や\n小説の題材にもなっている。だが作品は作品だ。"}, {"t": 85.75, "x": "ここで話すのは、判決と、当時の報道と、\n国会の記録に残っていることだけにする。"}, {"t": 91.41666666666667, "x": "分かったわ。"}, {"t": 92.88333333333334, "x": "1993年4月20日。"}, {"t": 95.31666666666666, "x": "埼玉県行田市に住む会社役員の男性が、\n勤め先から帰る途中で行方が分からなくなった。"}, {"t": 101.31666666666666, "x": "兄が経営する会社の先行きが厳しく、\n新しい商売を探していた人だった。"}, {"t": 106.21666666666667, "x": "翌日の4月21日、家族が\n行田警察署に捜索願を出している。"}, {"t": 111.15, "x": "すぐ出したのね。"}, {"t": 112.38333333333334, "x": "ああ。次の日だ。"}, {"t": 113.58333333333333, "x": "だが、この時点での扱いは、単なる家出人だった。"}, {"t": 116.88333333333334, "x": "これは当時の警察が怠けていた、という話ではない。"}, {"t": 120.23333333333333, "x": "大人が一人、連絡もなくいなくなる。\nそれ自体は毎日どこかで起きている。"}, {"t": 124.85, "x": "借金、家庭の事情、仕事。"}, {"t": 126.81666666666666, "x": "理由はいくらでもある。"}, {"t": 128.18333333333334, "x": "そして、自分の意思でいなくなった\n人を、警察が連れ戻すことはできない。"}, {"t": 132.66666666666666, "x": "事件だと分かるのは、たいてい、\n遺体が見つかったときだ。"}, {"t": 136.06666666666666, "x": "遺体が無ければ、行方不明者のままになる。"}, {"t": 138.86666666666667, "x": "捜索願を出しても、そこで止まるのね。"}, {"t": 141.65, "x": "この事件の構造は、もうここに全部入っている。"}, {"t": 144.6, "x": "動いたのは、10日後だ。"}, {"t": 146.18333333333334, "x": "1993年4月30日。"}, {"t": 148.83333333333334, "x": "いなくなった男性の車が、東京駅の八重洲にある\n地下駐車場で見つかった。"}, {"t": 153.5, "x": "乗り捨てられた状態だった。"}, {"t": 155.31666666666666, "x": "行田から東京駅。"}, {"t": 156.81666666666666, "x": "家出をした人が、わざわざ都心の\nど真ん中の地下駐車場に車を置いていく。"}, {"t": 161.38333333333333, "x": "しかも、その後、本人はどこにも現れない。"}, {"t": 164.28333333333333, "x": "不自然だ。"}, {"t": 165.13333333333333, "x": "埼玉県警はここで事件性を\n察知して、捜査に乗り出している。"}, {"t": 169.1, "x": "家族から話を聞くと、この男性が、ある人物と\n犬の取引でもめていたことが分かった。"}, {"t": 174.71666666666667, "x": "それが、関根元だった。"}, {"t": 176.76666666666668, "x": "もう名前が出てるじゃない。"}, {"t": 178.28333333333333, "x": "出ている。一人目の段階で、もう出ているんだ。"}, {"t": 181.18333333333334, "x": "しかも、県警が調べると、もう\n一つ引っかかることが出てきた。"}, {"t": 185.18333333333334, "x": "その九年前にも、この人物の周りで人が消えていた。"}, {"t": 188.73333333333332, "x": "この二つが重なって、県警は監視と尾行を始める。"}, {"t": 192.13333333333333, "x": "ここまで、男性がいなくなってから、わずか数週間だ。"}, {"t": 196.26666666666668, "x": "ここで、舞台になった店の話をしておく。"}, {"t": 199.0, "x": "埼玉県熊谷市にあった、\n犬猫の繁殖販売業「アフリカケンネル」。"}, {"t": 203.6, "x": "開業は1982年だ。"}, {"t": 205.83333333333334, "x": "関根元は、この店の創業者で、\n実質的な経営者だった。"}, {"t": 210.05, "x": "犬の扱いにかけては腕がよく、\n業界では名前の知られた人だった。"}, {"t": 214.36666666666667, "x": "有名だったの。"}, {"t": 215.56666666666666, "x": "アラスカン・マラミュートという\n犬種の繁殖では、第一人者と言われていた。"}, {"t": 219.93333333333334, "x": "シベリアン・ハスキーの流行を\n作った一人だ、とも言われている。"}, {"t": 223.63333333333333, "x": "1990年代の初めにハスキーを飼っていた人なら、\nこの名前を聞いたことがあるかもしれない。"}, {"t": 229.58333333333334, "x": "テレビの対談番組にも出ている。"}, {"t": 231.46666666666667, "x": "1987年と1988年だ。"}, {"t": 235.03333333333333, "x": "そこでは、若いころにアフリカやアラスカで\n十九年暮らしたという経歴を語っていた。"}, {"t": 239.96666666666667, "x": "この経歴は、事実ではない。"}, {"t": 242.01666666666668, "x": "嘘だったの。"}, {"t": 243.08333333333334, "x": "1988年の番組では、年齢まで詐称している。"}, {"t": 246.83333333333334, "x": "実年齢は四十六歳だったが、六十二歳と名乗った。"}, {"t": 250.61666666666667, "x": "このときの対談相手だった作家は、\nのちにこう振り返っている。"}, {"t": 254.3, "x": "途中から、これはなんなんだ、と\n思いながら聞いていた、と。"}, {"t": 257.8, "x": "つまり、話している相手にも違和感はあった。"}, {"t": 260.45, "x": "それでも、番組は成立してしまう。"}, {"t": 262.78333333333336, "x": "もう一人、この店には登記上の社長がいた。"}, {"t": 265.6166666666667, "x": "風間博子。関根元の妻で、\n1957年に熊谷市で生まれている。"}, {"t": 270.78333333333336, "x": "この人については、あとで必ずもう一度話す。"}, {"t": 273.6666666666667, "x": "今は名前だけ覚えておいてほしい。"}, {"t": 275.8333333333333, "x": "社長は別にいたのね。"}, {"t": 277.95, "x": "1990年代の初め、この店は行き詰まっていた。"}, {"t": 281.6166666666667, "x": "バブルが崩壊して、犬の売上が落ちた。"}, {"t": 284.23333333333335, "x": "その一方で、新しい犬舎と住宅を\n建てている。かかった費用は、およそ二億円だ。"}, {"t": 289.55, "x": "二億。"}, {"t": 290.28333333333336, "x": "1993年の7月に四千万円の抵当権が、11月に\n三千万円の根抵当権が設定されている。"}, {"t": 297.6333333333333, "x": "判決は、この経営状態を\n犯行の背景として認定している。"}, {"t": 301.56666666666666, "x": "そして、商売のやり方のほうにも問題があった。"}, {"t": 304.6166666666667, "x": "客とのトラブルが絶えなかったんだ。"}, {"t": 306.68333333333334, "x": "たとえば、子犬が生まれたら高く引き取ると\n言って、犬のつがいを法外な値段で売る。"}, {"t": 311.6166666666667, "x": "そして、実際に子犬が\n持ち込まれると、難癖をつけて値切る。"}, {"t": 315.68333333333334, "x": "それ、商売って言えるの。"}, {"t": 317.46666666666664, "x": "一人目の被害者になった男性は、犬の\nつがいを、合わせて千百万円で買っている。"}, {"t": 322.5, "x": "あとで、この犬種の相場が数十万円だと知らされた。"}, {"t": 325.8333333333333, "x": "さらに、繁殖に向かない\n年齢だということも知らされている。"}, {"t": 329.3666666666667, "x": "男性は、残りの犬のキャンセルと、\n代金の返還を求めた。"}, {"t": 333.3, "x": "判決が認定した一人目の直接の動機は、\nこの金銭トラブルだ。"}, {"t": 337.6, "x": "ここで、一つ言っておきたいことがある。"}, {"t": 339.93333333333334, "x": "この事件は、よく\n「犬の売買のトラブルが動機」とまとめられる。"}, {"t": 344.0, "x": "だが、それが直接の動機なのは、一人目だけだ。"}, {"t": 347.4166666666667, "x": "残りの三人は違うの。"}, {"t": 349.15, "x": "違う。二人目と三人目は、\n一人目を隠すために消えている。"}, {"t": 353.03333333333336, "x": "四人目は、また別の金の話だ。"}, {"t": 355.43333333333334, "x": "一件目を隠すために二件目が起きる。\nこの形は、この先ずっと出てくる。"}, {"t": 360.03333333333336, "x": "そして、隠すためにやったことが、\n次の動機を作っていく。"}, {"t": 364.4, "x": "さっき、九年前にも人が\n消えていた、と言った。そこを話す。"}, {"t": 368.45, "x": "1984年、昭和59年。"}, {"t": 371.15, "x": "秩父市と深谷市で、少なくとも\n三人の男女が行方不明になっている。"}, {"t": 375.51666666666665, "x": "三人とも、関根元と金銭のトラブルを\n抱えていた人たちだった。"}, {"t": 380.06666666666666, "x": "また金なのね。"}, {"t": 381.28333333333336, "x": "一人は、秩父市の男性。"}, {"t": 382.98333333333335, "x": "近所には「近く、でかい金が動く」と\n話していたという。"}, {"t": 386.76666666666665, "x": "自宅に迎えに来た車に乗って\n出かけたまま、戻らなかった。"}, {"t": 390.6, "x": "一人は、秩父市のトラック運転手の男性。"}, {"t": 393.26666666666665, "x": "立て替えた看板代金の返済を求めていた。"}, {"t": 396.1666666666667, "x": "近所のガソリンスタンドで電話を受けて、返済を\n約束されて出かけたまま、戻らなかった。"}, {"t": 401.71666666666664, "x": "もう一人は、深谷市でスナックを経営していた女性だ。"}, {"t": 405.0, "x": "周りの知人が気づかないうちに、いなくなっていた。"}, {"t": 407.96666666666664, "x": "ここで、はっきり言っておく。"}, {"t": 409.6666666666667, "x": "この三件は、立件されていない。"}, {"t": 411.96666666666664, "x": "立件されていない。"}, {"t": 413.3333333333333, "x": "1995年に、供述にもとづいて\n埼玉県警が大がかりな捜索をしている。"}, {"t": 418.65, "x": "荒川の川底も、古い犬舎も調べた。"}, {"t": 421.3666666666667, "x": "だが、遺体は見つからなかった。"}, {"t": 423.3833333333333, "x": "十一年が経っていて、遺棄現場とされた\n橋は1991年に取り壊されていた。"}, {"t": 428.8, "x": "橋を壊すときに、川底をさらっていたんだ。"}, {"t": 431.7, "x": "先に無くなっていたのね。"}, {"t": 433.43333333333334, "x": "だから、この三人については、\n誰も罪に問われていない。"}, {"t": 436.9166666666667, "x": "今も未解決のままだ。"}, {"t": 438.5, "x": "この回で、この三人を犯罪の被害者だと\n決めつけることはしない。"}, {"t": 442.53333333333336, "x": "分かっているのは、消えた、ということと、\n立件できなかった、ということだけだ。"}, {"t": 447.31666666666666, "x": "そして、ここで大事なのは、\n九年前に何が起きたかではない。"}, {"t": 451.1333333333333, "x": "1993年の春、埼玉県警は、この三件を\n知ったうえで捜査を始めた、ということだ。"}, {"t": 457.51666666666665, "x": "知っていて、それでも。"}, {"t": 459.1333333333333, "x": "そうだ。知っていて、それでも止められなかった。"}, {"t": 462.65, "x": "1993年の春から、埼玉県警は関根元と、\nその周辺の人物の監視と尾行を始めた。"}, {"t": 469.5833333333333, "x": "これは、疑っていたという話ではない。"}, {"t": 471.8833333333333, "x": "行動を実際に見張っていた、ということだ。"}, {"t": 474.68333333333334, "x": "見張られていたのに。"}, {"t": 476.01666666666665, "x": "ああ。見張られていたのに、犯行は続いた。"}, {"t": 478.68333333333334, "x": "ここが、この事件でいちばん\n理解しにくいところだと思う。"}, {"t": 482.01666666666665, "x": "私も、最初はここで引っかかった。"}, {"t": 484.43333333333334, "x": "尾行がついていて、なぜ次が起きるのか。"}, {"t": 486.9166666666667, "x": "答えは、身も蓋もない。"}, {"t": 488.55, "x": "見張るのと、身柄を取るのは、まったく別だからだ。"}, {"t": 491.71666666666664, "x": "警察は、怪しいという理由だけで人を逮捕できない。"}, {"t": 494.9, "x": "逮捕には、罪を犯したと疑うに\n足りる相当な理由がいる。"}, {"t": 498.46666666666664, "x": "ここでいう理由というのは、\n警察官の心証のことではない。"}, {"t": 501.95, "x": "裁判官に見せて、令状を出させられるだけの、\n形になった材料のことだ。"}, {"t": 506.65, "x": "そして、この事件には、その材料が何ひとつ無かった。"}, {"t": 510.25, "x": "遺体が無い。凶器も無い。"}, {"t": 511.71666666666664, "x": "現場も分からない。亡くなったことすら\n確かめられていない。"}, {"t": 515.2666666666667, "x": "見ているだけしかできないのね。"}, {"t": 517.1833333333333, "x": "しかも、監視というのは二十四時間ぴったり\n張り付けるものでもない。"}, {"t": 521.0666666666667, "x": "一人を丸一日見張るには、交代の人数がいる。"}, {"t": 524.0333333333333, "x": "人手には限りがある。"}, {"t": 525.5166666666667, "x": "秋ごろには、県警は本格的な捜査に\n着手して、監視を強めている。"}, {"t": 530.1166666666667, "x": "関根元の知り合いを回って、一人で\n会わないように、と忠告もしている。"}, {"t": 534.7166666666667, "x": "そこまでやったの。"}, {"t": 536.0166666666667, "x": "そこまでやって、それでも逮捕状は取れなかった。"}, {"t": 539.5833333333334, "x": "1993年7月21日。"}, {"t": 542.4666666666667, "x": "大里郡江南町、今の熊谷市にあたる場所だ。"}, {"t": 545.7, "x": "ここに住んでいた暴力団の幹部の男性と、\n住み込みの運転手の男性が、自宅から消えた。"}, {"t": 551.5166666666667, "x": "二人同時に。"}, {"t": 552.6333333333333, "x": "この幹部の男性は、関根元と付き合いがあった。"}, {"t": 555.85, "x": "店で客とトラブルが起きたときに、\n仲裁に入るような立場の人だった。"}, {"t": 560.25, "x": "判決によれば、一人目の男性がいなくなった\nあと、その家族との話し合いに同席している。"}, {"t": 565.95, "x": "そこで、関根元が\n関わっているのではないか、と察したという。"}, {"t": 569.9333333333333, "x": "そして、多額の金銭などを要求するようになった。"}, {"t": 573.1, "x": "新しい犬舎の土地と建物の権利証まで求められた。"}, {"t": 576.5333333333333, "x": "このままでは全財産を取られる。"}, {"t": 578.3166666666667, "x": "判決は、そこを動機として認定している。"}, {"t": 581.2666666666667, "x": "一人目を隠すために、二人目。"}, {"t": 583.5666666666667, "x": "ああ。そして運転手の男性は、口封じのために\n巻き込まれたと認定されている。"}, {"t": 588.3666666666667, "x": "この人は組員ではない。"}, {"t": 589.7666666666667, "x": "事情があって預けられていただけで、\n金のもめごととも関係が無い。"}, {"t": 593.85, "x": "常に一緒に行動していた、というだけの理由だ。"}, {"t": 596.8, "x": "巻き添えで命を落とした、ということになる。"}, {"t": 599.4, "x": "そして1993年8月26日。"}, {"t": 602.6333333333333, "x": "行田市の女性が、買い物に出たまま戻らなかった。"}, {"t": 605.75, "x": "この人は、次男が店で働いていたことから\n関根元と知り合っていた。"}, {"t": 610.25, "x": "店の株主にならないか、と出資を持ちかけられている。"}, {"t": 613.6, "x": "そして、当時の一家のほぼ全財産に\nあたる二百七十万円を渡していた。"}, {"t": 618.2333333333333, "x": "出資の話は、嘘だった。"}, {"t": 620.3, "x": "それが、ばれる前に。"}, {"t": 621.85, "x": "判決は、そう認定している。"}, {"t": 623.8333333333334, "x": "この人は、最後まで関根元を信じていたという。"}, {"t": 626.9333333333333, "x": "四か月で、四人だ。"}, {"t": 629.1666666666666, "x": "1993年の秋。"}, {"t": 631.1833333333333, "x": "埼玉県警は、四人が消えたことと\n関根元の関わりを、ほぼつかんでいた。"}, {"t": 636.05, "x": "いなくなった人が、直前にこの人物と\n会っている。それが四件続いた。"}, {"t": 640.75, "x": "状況としては真っ黒じゃない。"}, {"t": 642.65, "x": "状況は真っ黒だ。だが、状況だけでは起訴できない。"}, {"t": 646.0, "x": "県警は別の手も考えている。"}, {"t": 647.9833333333333, "x": "新しい犬舎の建設費を建設業者に\n払わなかったことについて、詐欺の容疑があった。"}, {"t": 653.3166666666667, "x": "捜査二課が、この件で\n別件逮捕することを検討している。"}, {"t": 657.0833333333334, "x": "まず詐欺で捕まえて、その間に調べるってこと。"}, {"t": 660.2166666666667, "x": "そういう手だ。だが、見送られた。"}, {"t": 662.35, "x": "この時点では、殺人事件としての立証が\n難しいと判断されたからだ。"}, {"t": 666.9333333333333, "x": "詐欺で捕まえても、勾留できる期間は限られている。"}, {"t": 670.1333333333333, "x": "その間に殺人の証拠が出てこなければ、\nそのまま出すしかない。"}, {"t": 674.0333333333333, "x": "そして、出したあとは、相手は\nもう全部分かった状態になる。"}, {"t": 677.6333333333333, "x": "どこまで調べられているか。"}, {"t": 679.1166666666667, "x": "誰が何を話したか。"}, {"t": 680.7, "x": "証拠が残っていたとしても、その後で処分される。"}, {"t": 683.85, "x": "一回しか撃てない弾なのね。"}, {"t": 685.8, "x": "そういうことだ。だから撃たなかった。"}, {"t": 687.9833333333333, "x": "この判断が正しかったのか\nどうかは、私には分からない。"}, {"t": 691.4833333333333, "x": "結果だけを見れば、逮捕は\nさらに一年以上あとになった。"}, {"t": 694.8666666666667, "x": "ただ、この時点で県警の手元には、\n本当に何も無かった。"}, {"t": 698.75, "x": "疑いだけがある。それを形にする材料が一つも無い。"}, {"t": 702.1666666666666, "x": "この状態が、事件が表に出たあとも、\nまだ一年近く続くことになる。"}, {"t": 707.4333333333333, "x": "事態が動いたきっかけは、捜査ではなかった。"}, {"t": 710.2666666666667, "x": "1994年1月26日。"}, {"t": 713.0, "x": "大阪府警と長野県警の共同捜査本部が、ある男を\n死体遺棄の容疑で逮捕した。"}, {"t": 718.2166666666667, "x": "大阪愛犬家連続殺人事件と呼ばれている事件だ。"}, {"t": 721.7, "x": "愛犬家。同じ言葉。"}, {"t": 723.5, "x": "そうだ。だが、埼玉の事件とは一切関係が無い。"}, {"t": 726.8333333333334, "x": "犯人も違う。組織的な\nつながりも無い。まったくの別件だ。"}, {"t": 730.8166666666667, "x": "こちらは、犬の訓練士を名乗っていた男が、\n出資などのトラブルから五人を殺していた事件だ。"}, {"t": 736.6166666666667, "x": "この男も、後に死刑が確定している。"}, {"t": 739.25, "x": "偶然に、犬をめぐる金銭トラブルで\n人が消える、という形が重なった。"}, {"t": 743.8166666666667, "x": "この大阪の事件が大きく\n報道される中で、話が広がった。"}, {"t": 747.7833333333333, "x": "埼玉でも、同じように愛犬家が消えているらしい。"}, {"t": 750.9166666666666, "x": "噂として。"}, {"t": 751.9833333333333, "x": "ああ。噂としてだ。"}, {"t": 753.3833333333333, "x": "そして1994年2月の中ごろ、\n報道各社が熊谷の店に押しかけた。"}, {"t": 758.65, "x": "ここで、この事件は一気に表に出る。"}, {"t": 761.0833333333334, "x": "捜査が進んだからではない。"}, {"t": 762.6666666666666, "x": "無関係の別の事件が報じられたからだ。"}, {"t": 765.3166666666667, "x": "そして、関根元はカメラの前に出てきた。"}, {"t": 768.3333333333334, "x": "逃げなかったの。"}, {"t": 769.5333333333333, "x": "逃げなかった。自分は潔白だ、と主張している。"}, {"t": 772.7166666666667, "x": "ワイドショーで連日扱われ、\n犬舎の前にカメラが並んだ。"}, {"t": 776.2666666666667, "x": "一方で、いなくなった人たちの家族は、\nこれは事件だ、と訴え続けていた。"}, {"t": 781.0833333333334, "x": "だが、証拠が無い。"}, {"t": 782.4333333333333, "x": "報道は疑惑を伝えることはできる。だが、\n疑惑は疑惑のままだ。"}, {"t": 786.35, "x": "この時期のことを、事件の記録はこう書いている。"}, {"t": 789.1833333333333, "x": "疑惑の域を出なかった、と。"}, {"t": 791.15, "x": "まだ逮捕もされていないのよね。"}, {"t": 793.1166666666667, "x": "されていない。それで顔も名前も出ていた。"}, {"t": 795.6333333333333, "x": "報道が先に走って、捜査が\nあとから追いかける形になった。"}, {"t": 800.1, "x": "ここで、少し立ち止まりたい。"}, {"t": 802.0166666666667, "x": "世間が注目すれば事件は解決に\n近づく、と思われがちだ。"}, {"t": 805.9166666666666, "x": "この事件は、そうならなかった例だ。"}, {"t": 808.1833333333333, "x": "1994年2月に大騒ぎになってから、\n逮捕までさらに十一か月かかっている。"}, {"t": 813.75, "x": "騒ぎになっても、進まなかったのね。"}, {"t": 816.3166666666667, "x": "進まなかった。"}, {"t": 817.45, "x": "報道が集められるのは、話と、証言と、疑惑だ。"}, {"t": 821.0333333333333, "x": "裁判所が求めるのは、証拠だ。"}, {"t": 823.2333333333333, "x": "この二つは、似ているようで別のものだ。"}, {"t": 825.7333333333333, "x": "そして、ここからが厄介なところで、\n報道は相手にも情報を与える。"}, {"t": 829.9166666666666, "x": "どこまで知られているのか。"}, {"t": 831.3, "x": "誰が話しているのか。それが相手にも見える。"}, {"t": 834.1166666666667, "x": "実際、この時期、関根元は自分ではなく、\n知り合いの元自衛官にマスコミ対応をさせている。"}, {"t": 840.05, "x": "疑惑を否定する役を、人にやらせていたわけだ。"}, {"t": 843.2, "x": "矢面に立たせたのね。"}, {"t": 844.85, "x": "そして、この人選が、結果的に捜査の入口になった。"}, {"t": 848.6166666666667, "x": "1994年9月22日。"}, {"t": 851.1833333333333, "x": "埼玉県警は、この元自衛官を詐欺の容疑で逮捕する。"}, {"t": 854.7333333333333, "x": "この人は、事件について何か\n知っているとみられていた。"}, {"t": 858.1, "x": "取り調べの中で、この人は\n九年前の件への関与を一部認めた。"}, {"t": 862.3166666666667, "x": "そして、1993年の件について、ある人物の名前を\nほのめかした。"}, {"t": 867.35, "x": "山崎永幸という人だ。"}, {"t": 869.3333333333334, "x": "ようやく、名前が出たのね。"}, {"t": 871.2, "x": "ここから、一年八か月動かなかったものが、\n二か月半で崩れる。"}, {"t": 876.1833333333333, "x": "山崎永幸さんは、1956年に富山県で生まれた人だ。"}, {"t": 880.6833333333333, "x": "ブルドッグのブリーダーで、\nアフリカケンネルの役員という肩書きを持っていた。"}, {"t": 884.9166666666666, "x": "もっとも、実際にやっていたのは、運転手や\n手伝いに近いことだったとされている。"}, {"t": 889.8333333333334, "x": "住んでいたのは、群馬県の片品村。"}, {"t": 892.1833333333333, "x": "貨車を改造した家に、一人で暮らしていた。"}, {"t": 895.1, "x": "埼玉じゃないのね。"}, {"t": 896.4666666666667, "x": "群馬だ。山の中で、周りに家が無かった。"}, {"t": 899.3833333333333, "x": "この人は、後に死体損壊・遺棄の罪で\n起訴され、懲役三年の実刑が確定している。"}, {"t": 905.1166666666667, "x": "殺人では起訴されていない。"}, {"t": 906.7, "x": "刑期は満期まで務めて、1998年に出所した。"}, {"t": 910.8, "x": "1994年10月17日、埼玉県警は\nこの人に事情聴取を行った。"}, {"t": 916.3, "x": "突破口にしようとしたわけだ。"}, {"t": 918.1666666666666, "x": "だが、このときは関与を否定されている。"}, {"t": 920.6, "x": "そして、その後、姿を消した。"}, {"t": 923.0166666666667, "x": "逃げたの。"}, {"t": 923.8833333333333, "x": "奥さんと一緒に、行方をくらませている。"}, {"t": 926.3333333333334, "x": "県警は、奥さんに対して詐欺容疑で\n逮捕状を取って、二人を追った。"}, {"t": 930.5833333333334, "x": "1994年11月24日、都内の病院に現れた\nところで、奥さんのほうが逮捕される。"}, {"t": 936.9166666666666, "x": "本人には逃げられた。"}, {"t": 938.3333333333334, "x": "ところが、そのあと妙なことが起きる。"}, {"t": 940.6666666666666, "x": "逃げていた本人が、前の月に自分を聴取した\n捜査員に、自分から電話をかけてきたんだ。"}, {"t": 946.3666666666667, "x": "自分から。"}, {"t": 947.3333333333334, "x": "話しているうちに、出頭を決めた。"}, {"t": 949.5833333333334, "x": "追い詰めて落としたのでも、\n証拠を突きつけたのでもない。"}, {"t": 952.8, "x": "一年八か月、動かなかった\n壁が、電話一本から動き始めた。"}, {"t": 957.8166666666667, "x": "1994年12月3日。"}, {"t": 960.2666666666667, "x": "山崎永幸さんへの事情聴取が再開された。"}, {"t": 963.3, "x": "そして、この人は自分が関わったことを認める。"}, {"t": 966.5, "x": "何が変わったの。"}, {"t": 967.8, "x": "知っている人が、話し始めた。それだけだ。"}, {"t": 970.7833333333333, "x": "科学捜査でもない。新しい物証でもない。"}, {"t": 973.4666666666667, "x": "この事件を動かしたのは、人の口だ。"}, {"t": 976.0666666666667, "x": "そして1994年12月13日。"}, {"t": 979.1333333333333, "x": "この人が捜査員を案内して、\n群馬県利根郡片品村の山林に入った。"}, {"t": 983.9333333333333, "x": "そこから、遺骨と遺留品が見つかった。"}, {"t": 986.4833333333333, "x": "一人目の男性が消えてから、一年七か月あまり。"}, {"t": 989.7666666666667, "x": "ここで初めて、行方不明が事件になった。"}, {"t": 992.6833333333333, "x": "そこまで来ないと、事件じゃなかったのね。"}, {"t": 995.3166666666667, "x": "そうだ。"}, {"t": 995.9166666666666, "x": "年が明けて1995年1月5日。"}, {"t": 998.9166666666666, "x": "埼玉県警の捜査一課と行田署は、関根元と\n風間博子を、一人目の男性に対する"}, {"t": 1004.7666666666667, "x": "最初の容疑は、殺人ではない。"}, {"t": 1006.9666666666667, "x": "どうして。"}, {"t": 1007.8, "x": "この時点で形になっていたのが、遺体が壊され、\n捨てられたという部分までだったからだ。"}, {"t": 1013.1666666666666, "x": "殺人での逮捕は、この三週間あとになる。"}, {"t": 1016.0166666666667, "x": "そして1995年1月8日には、山崎永幸さんも\n同じ容疑で逮捕されている。"}, {"t": 1022.3833333333333, "x": "1995年の1月から2月にかけて、埼玉県警と\n群馬県警の合同捜査本部が、大規模な捜索を行った。"}, {"t": 1030.35, "x": "捜索した場所は、群馬県の片品村、\n川場村、白沢村、利根村。"}, {"t": 1035.35, "x": "埼玉県の熊谷市、江南町、川越市、新座市。"}, {"t": 1039.1333333333334, "x": "ずいぶん広いのね。"}, {"t": 1040.4666666666667, "x": "広い。そして、捜すものが小さかった。"}, {"t": 1043.2166666666667, "x": "山林から出てきたのは、骨の破片、\n歯の破片、お守り、腕時計。"}, {"t": 1047.55, "x": "川から出てきたのは、骨の破片、\n携帯電話の基板、家や車の鍵、入れ歯。"}, {"t": 1052.5166666666667, "x": "どれも焼け残ったものだ。"}, {"t": 1054.1, "x": "ここで問題が起きた。"}, {"t": 1055.5333333333333, "x": "骨の破片は、高温で焼かれていたために、\nDNA鑑定ができなかった。"}, {"t": 1060.0833333333333, "x": "誰のものか分からないの。"}, {"t": 1061.7833333333333, "x": "骨からは分からない。"}, {"t": 1063.0666666666666, "x": "だから、身元を決めたのは、骨のほうではなく、\n一緒に出てきた品物のほうだった。"}, {"t": 1068.1166666666666, "x": "治療の痕がある歯。登録番号が刻まれた腕時計。"}, {"t": 1071.3833333333334, "x": "そして、一人目の男性がいつも\n持っていた、銭形のお守りだ。"}, {"t": 1075.4, "x": "これは、兄とお揃いで持っていたものだった。"}, {"t": 1078.15, "x": "お兄さんが同じものを持っていたから、分かったのね。"}, {"t": 1081.3166666666666, "x": "捜索そのものも、地味な仕事だった。"}, {"t": 1083.8666666666666, "x": "多くの捜査員が真冬の川に入って、\n川底の砂利をすくい、ふるいにかけた。"}, {"t": 1088.5333333333333, "x": "探していたのは、数ミリから数センチの破片だ。"}, {"t": 1091.5833333333333, "x": "このとき、群馬県警の捜査員から、\nこんな助言があったという。"}, {"t": 1095.4333333333334, "x": "金属などは、意外と水に流れず、\n現場にとどまっている、と。"}, {"t": 1099.3666666666666, "x": "実際、そのとおりだった。"}, {"t": 1101.1, "x": "一年半から二年近く経っていたのに、\n物証は川底に残っていた。"}, {"t": 1105.5333333333333, "x": "残っていたのね。"}, {"t": 1106.7833333333333, "x": "起訴は、その捜索の進み方に合わせて、\n少しずつ積み上げられていった。"}, {"t": 1111.3666666666666, "x": "1月26日に、三人を最初の分で起訴。"}, {"t": 1114.6, "x": "その翌日の1月27日に、二人を\n一人目の男性に対する殺人容疑で再逮捕。"}, {"t": 1120.35, "x": "2月17日に追起訴。"}, {"t": 1122.0666666666666, "x": "2月18日に、二人目と三人目の事件で再逮捕。"}, {"t": 1125.85, "x": "3月11日に追起訴。"}, {"t": 1127.6166666666666, "x": "3月15日に、四人目の事件で再逮捕。"}, {"t": 1130.7166666666667, "x": "そして4月4日に、最後の追起訴だ。"}, {"t": 1133.35, "x": "三か月かけて、一件ずつ、証拠が\n固まった順に積んでいった。"}, {"t": 1138.1, "x": "ここで、この事件の知名度の話をしておきたい。"}, {"t": 1141.0833333333333, "x": "四人が亡くなった連続殺人で、\n容疑者は連日テレビに映っていた。"}, {"t": 1145.3833333333334, "x": "それなのに、この事件は、他の大きな事件に\n比べて語られることが少ない。"}, {"t": 1150.1833333333334, "x": "どうして。"}, {"t": 1151.0, "x": "逮捕されたのが1995年1月5日だ。"}, {"t": 1154.3166666666666, "x": "その十二日後の、1995年1月17日。"}, {"t": 1158.1666666666667, "x": "阪神・淡路大震災が起きた。"}, {"t": 1160.45, "x": "……ああ。"}, {"t": 1161.0, "x": "報道の量は、そこから一気に減った。"}, {"t": 1163.4333333333334, "x": "そして、その二か月後の3月20日には、\n地下鉄サリン事件が起きる。"}, {"t": 1167.95, "x": "1995年という年は、日本の事件報道が\nまるごとそちらに向いた年だ。"}, {"t": 1173.0166666666667, "x": "この事件は、そのはざまに落ちた。"}, {"t": 1175.2, "x": "もう一つ、名前の問題もある。"}, {"t": 1177.3166666666666, "x": "さっき話した大阪の事件と、\n今も混同されることが多い。"}, {"t": 1181.0, "x": "どちらも「愛犬家」という言葉が付いているからだ。"}, {"t": 1184.1833333333334, "x": "まったく別の事件なのに、\n区別されないまま語られてきた。"}, {"t": 1187.9, "x": "規模のわりに、知られていないのね。"}, {"t": 1190.0833333333333, "x": "そういうことだ。"}, {"t": 1191.1, "x": "そして、この後、裁判は十四年続くことになる。"}, {"t": 1194.45, "x": "その十四年のあいだ、この事件が大きく\n報じられることは、ほとんどなかった。"}, {"t": 1199.65, "x": "ここで、この事件を象徴する言葉に触れる。"}, {"t": 1202.3833333333334, "x": "ボディを透明にする。"}, {"t": 1203.75, "x": "透明に。"}, {"t": 1204.6166666666666, "x": "関根元の口ぐせだったと伝えられている言葉だ。"}, {"t": 1207.8166666666666, "x": "出どころは、共犯者として有罪が確定した\n山崎永幸さんが、出所後に出した手記だ。"}, {"t": 1213.5, "x": "1999年に新潮社から出た『共犯者』という\n本に、この言葉が出てくる。"}, {"t": 1219.0166666666667, "x": "当時の報道でも繰り返し使われて、\nこの事件を表す言葉として残った。"}, {"t": 1223.6333333333334, "x": "意味は一つだけだ。遺体を残さない、ということだ。"}, {"t": 1226.8, "x": "どうやったのかは、話さない。"}, {"t": 1228.6166666666666, "x": "この動画では一行も書かないと\n最初に言った。そこは守る。"}, {"t": 1232.5666666666666, "x": "それでいいと思う。"}, {"t": 1233.75, "x": "だから、ここで扱うのは、この言葉が\n捜査にとって何を意味したか、のほうだ。"}, {"t": 1238.5833333333333, "x": "遺体が見つからなければ、その人は\n死亡した人ではない。行方不明者だ。"}, {"t": 1243.1, "x": "行方不明者に対しては、殺人の捜査は始まらない。"}, {"t": 1246.5333333333333, "x": "死因が分からない。死亡した時刻も分からない。"}, {"t": 1249.3, "x": "どこで何が起きたのかも分からない。"}, {"t": 1251.3833333333334, "x": "捜査の土台になるものが、全部無くなる。"}, {"t": 1253.9833333333333, "x": "解剖もできない。鑑定に回すものも無い。"}, {"t": 1256.5833333333333, "x": "この人物が言っていたとされる言葉が、もう一つある。"}, {"t": 1259.8666666666666, "x": "死体がなければ、ただの行方不明だ。"}, {"t": 1262.35, "x": "……そこを狙っていたのね。"}, {"t": 1263.9166666666667, "x": "この言葉が本当に本人のものなのかは、手記に\n書かれていることであって、判決の認定ではない。"}, {"t": 1269.8833333333334, "x": "ただ、結果として、捜査は\nそのとおりの壁にぶつかっている。"}, {"t": 1273.5833333333333, "x": "一年八か月、逮捕できなかった\n理由が、この一文に詰まっている。"}, {"t": 1278.4666666666667, "x": "では、遺体が見つからなければ、\n殺人事件として裁けないのか。"}, {"t": 1282.5666666666666, "x": "そうではない。"}, {"t": 1283.3833333333334, "x": "この点について、ちょうど同じ時期の国会に、\nはっきりした記録が残っている。"}, {"t": 1288.0333333333333, "x": "1995年6月7日、衆議院法務委員会だ。"}, {"t": 1291.9, "x": "先に断っておく。この日のやり取りは、\nこの事件についてのものではない。"}, {"t": 1296.25, "x": "同じ年に起きていた、別の事件について\n議論する中で出てきたものだ。"}, {"t": 1300.7, "x": "別の事件の話なのね。"}, {"t": 1302.6, "x": "ああ。ただ、答えているのは一般論としての扱いだ。"}, {"t": 1305.9166666666667, "x": "坂上富男議員が、こう聞いている。"}, {"t": 1308.1666666666667, "x": "「殺人罪の場合、仮に死体が\n発見されないということが出てきた場合、これは"}, {"t": 1312.6833333333334, "x": "一般的なことでございますが、"}, {"t": 1314.5333333333333, "x": "法務省刑事局長の則定衛さんは、こう答えている。"}, {"t": 1318.1, "x": "「いわゆる死体なき殺人について、殺人罪として\n起訴することが可能かということでございますが、"}, {"t": 1323.8166666666666, "x": "そして、こう続けている。"}, {"t": 1325.4833333333333, "x": "「過去にそういったものにつきまして\n起訴した例もございます」"}, {"t": 1328.8666666666666, "x": "起訴はできるのね。"}, {"t": 1330.1833333333334, "x": "同じ日に、警察庁の担当者もこう言っている。"}, {"t": 1333.15, "x": "「死体なきままという\n可能性の問題でございますけれども、\n私どもの方につきましては、"}, {"t": 1338.35, "x": "つまり、遺体が無いこと\nそのものは、法律上の壁ではない。"}, {"t": 1341.9666666666667, "x": "問題は、その代わりに何を証拠として立てるか、だ。"}, {"t": 1345.45, "x": "何を立てたの。"}, {"t": 1346.6, "x": "この事件で証拠の中心になったのは、\n一人の共犯者の供述だった。"}, {"t": 1351.0333333333333, "x": "焼け残った小さな物証が、\nその供述を裏づける形になった。"}, {"t": 1355.1166666666666, "x": "逆に言うと、供述が崩れれば、全部が崩れる。"}, {"t": 1358.25, "x": "ここから、裁判が十四年かかることになる。"}, {"t": 1361.6833333333334, "x": "1995年7月、浦和地裁で裁判が始まった。"}, {"t": 1365.55, "x": "今のさいたま地裁だ。"}, {"t": 1367.05, "x": "最初に開かれたのは、\n7月7日の山崎永幸さんの初公判。"}, {"t": 1371.3166666666666, "x": "起訴された事実を大筋で認めている。"}, {"t": 1373.7833333333333, "x": "7月24日には、関根元と\n風間博子の初公判が開かれた。"}, {"t": 1378.5, "x": "関根元は、罪状認否を留保した。"}, {"t": 1380.95, "x": "認めるとも否認するとも言わなかった。"}, {"t": 1383.3333333333333, "x": "風間博子は、二人分の遺体の運搬については、\n脅されて手伝ったと認めた。"}, {"t": 1388.3, "x": "だが、殺害と、残る\n一人の死体遺棄については否認している。"}, {"t": 1392.4333333333334, "x": "最初から争っていたのね。"}, {"t": 1394.3, "x": "そして、10月6日。"}, {"t": 1395.95, "x": "山崎永幸さんが、\n自分の裁判の第三回公判で、こう証言した。"}, {"t": 1400.65, "x": "自分が自供したのは、検察官との間に\n密約があったからだ、と。"}, {"t": 1404.9666666666667, "x": "取り調べの際に、証拠を出せば何でも言うことを\n聞く、すぐに釈放する、と言われたという。"}, {"t": 1410.3833333333334, "x": "さらに、勾留されていた奥さんの保釈や、\n検察庁の中での面会のことにも触れた。"}, {"t": 1415.7833333333333, "x": "本当だとしたら、まずいわよね。"}, {"t": 1417.9666666666667, "x": "浦和地検は会見を開いて、密約の存在を否定した。"}, {"t": 1421.6166666666666, "x": "保釈は正当な手続きを経たものだ、という説明だ。"}, {"t": 1424.95, "x": "翌年の7月19日には、担当した\n検察官が証人として法廷に立っている。"}, {"t": 1430.2166666666667, "x": "面会があったこと自体は認めたが、便宜を\n図る意図も、密約も無かった、と否定した。"}, {"t": 1435.75, "x": "どちらが本当なのかを、私は決められない。"}, {"t": 1438.4666666666667, "x": "ここで押さえておきたいのは、こういうことだ。"}, {"t": 1440.9333333333334, "x": "物証が乏しい事件では、供述が柱になる。"}, {"t": 1443.9833333333333, "x": "そして、柱が供述だけだと、その供述が\nどうやって得られたかが、そのまま争点になる。"}, {"t": 1449.7333333333333, "x": "元夫婦の弁護人は、ここを突いた。"}, {"t": 1452.0166666666667, "x": "検察の立証の柱になっている供述は、便宜を\n図られて誘導されたものではないか、と。"}, {"t": 1457.5166666666667, "x": "山崎永幸さんのほうも、約束を反故にされたとして、\n元夫婦の裁判では証言を拒否する構えを見せた。"}, {"t": 1464.25, "x": "そして1995年11月20日、実際に\n法廷に立って、証言を拒否した。"}, {"t": 1470.0, "x": "検察の柱が、法廷でしゃべらなくなったのね。"}, {"t": 1473.1666666666667, "x": "検察は、法廷で証言させて立証する計画だった。"}, {"t": 1476.7, "x": "それができなくなり、取り調べの段階で作られた\n供述調書のほうが、証拠として採用された。"}, {"t": 1483.1166666666666, "x": "山崎永幸さんに対する判決は、\n1995年12月15日に出ている。"}, {"t": 1488.4666666666667, "x": "懲役三年の実刑だ。"}, {"t": 1490.2666666666667, "x": "弁護側は、脅されてやったことで、適法な行為を\n期待できる状況ではなかった、と主張した。"}, {"t": 1496.1333333333334, "x": "法律の世界では、期待可能性という言い方をする。"}, {"t": 1499.3166666666666, "x": "判決は、それを認めなかった。"}, {"t": 1501.45, "x": "暴力を受けていたわけでも、\n監視されていたわけでもない。"}, {"t": 1504.5833333333333, "x": "警察に駆け込む手段はあった。"}, {"t": 1506.7166666666667, "x": "そう判断された。"}, {"t": 1507.9166666666667, "x": "控訴も棄却され、この判断は\n判例の雑誌にも載っている。"}, {"t": 1511.65, "x": "怖かった、では通らないのね。"}, {"t": 1513.7166666666667, "x": "一方、元夫婦の裁判は長引いた。"}, {"t": 1516.1333333333334, "x": "関根元が罪状認否を\n留保したまま、三年が過ぎている。"}, {"t": 1519.9666666666667, "x": "ようやく認めたのは、1998年9月3日。"}, {"t": 1523.5, "x": "第五十七回公判だ。"}, {"t": 1525.3333333333333, "x": "五十七回。"}, {"t": 1526.45, "x": "被告人質問で、四人に対する殺人と\n死体遺棄に関わっていたことを認めた。"}, {"t": 1531.4666666666667, "x": "ただし、主犯は風間博子だ、\n実行犯は山崎永幸だ、と主張した。"}, {"t": 1536.3833333333334, "x": "一方の風間博子は、\n共謀そのものを否認し続けている。"}, {"t": 1539.9666666666667, "x": "つまり、二人が互いに相手を\n主犯だと言い合う形になった。"}, {"t": 1543.6, "x": "三人の言い分が、三方向に食い違う状態だ。"}, {"t": 1546.7, "x": "2000年7月6日、検察は二人に死刑を求刑する。"}, {"t": 1550.4166666666667, "x": "同じ年の10月、四日間にわたって\n最終弁論が行われた。"}, {"t": 1554.5, "x": "関根元側は死刑を避けるよう求め、\n風間博子側は無罪を主張した。"}, {"t": 1559.1, "x": "結審したのは2000年10月14日。"}, {"t": 1561.6333333333334, "x": "初公判から、五年二か月。"}, {"t": 1563.7833333333333, "x": "開かれた公判は、百五回だった。"}, {"t": 1566.8166666666666, "x": "2001年3月21日、浦和地裁が判決を\n言い渡した。二人とも死刑だ。"}, {"t": 1572.15, "x": "判決が向き合ったのは、三人の言い分が\nまるごと食い違っている、という状態だった。"}, {"t": 1577.1666666666667, "x": "判決は、最も信用できるのは\n山崎永幸さんの供述だと判断した。"}, {"t": 1582.15, "x": "密約を主張した人の供述を。"}, {"t": 1584.4833333333333, "x": "理由として挙げられたのは、犯人しか\n知りえない秘密の暴露が多数含まれていること。"}, {"t": 1589.5, "x": "秘密の暴露というのは、その人が関わっていなければ\n知りようがないことを話す、ということだ。"}, {"t": 1595.1166666666666, "x": "遺留品がどこにあるか、といった話がそれにあたる。"}, {"t": 1598.2333333333333, "x": "内容が具体的で、不自然な\n点がほとんど見られないこと。"}, {"t": 1601.7833333333333, "x": "一部に誇張があっても、全体としては\n信用できる、という判断だ。"}, {"t": 1605.95, "x": "そして密約があったかどうかについては、\n判決は積極的に触れなかった。"}, {"t": 1610.55, "x": "実行犯は山崎永幸だ、という\n元夫婦の主張は退けられた。"}, {"t": 1614.7833333333333, "x": "被害者との利害関係が無く、動機が無い。"}, {"t": 1617.35, "x": "報酬が支払われた形跡も全く無い。それが理由だ。"}, {"t": 1620.95, "x": "認定はこうなった。"}, {"t": 1622.2166666666667, "x": "一件目と二件目については、\n元夫婦が対等の立場で共謀した。"}, {"t": 1626.3833333333334, "x": "検察は、風間博子が持ちかけて\n関根元が同意した、と主張していた。"}, {"t": 1631.1666666666667, "x": "判決はそこまでは踏み込まず、どちらが先に\n持ちかけたにせよ共同で及んだ、とした。"}, {"t": 1636.4, "x": "四人目については、\n関根元の単独犯と認定されている。"}, {"t": 1640.2333333333333, "x": "風間博子については、関与していた疑いは\n相当強いが、認定するには至らない、とされた。"}, {"t": 1646.05, "x": "状況証拠にとどまる、という判断だ。"}, {"t": 1648.5, "x": "同時に、判決は関根元についても、背後に\n共犯者がいる可能性は否定できない、と述べている。"}, {"t": 1654.7333333333333, "x": "それは量刑を考えるうえで考慮すべき事情だ、とした。"}, {"t": 1658.1833333333334, "x": "はっきりしないまま終わったのね。"}, {"t": 1660.15, "x": "二人とも控訴した。"}, {"t": 1661.55, "x": "控訴審では、2005年2月14日に、風間博子が\n遺体の損壊について一部の関与を初めて認めている。"}, {"t": 1668.3666666666666, "x": "2005年7月11日、東京高裁は控訴を棄却した。"}, {"t": 1672.3333333333333, "x": "二人とも上告し、2009年6月5日、最高裁第二小法廷が\n上告を棄却する判決を言い渡した。"}, {"t": 1679.35, "x": "同じ月の22日付の決定で、死刑が確定した。"}, {"t": 1683.0333333333333, "x": "一人目の男性がいなくなった1993年4月20日から、\n十六年二か月が経っていた。"}, {"t": 1689.8166666666666, "x": "確定したあとのことも話しておく。"}, {"t": 1692.0166666666667, "x": "関根元死刑囚は、2016年の11月ごろから体調を\n崩し、拘置所の病舎で治療を受けていた。"}, {"t": 1698.55, "x": "そして2017年3月27日、東京拘置所で\n亡くなった。七十五歳だった。"}, {"t": 1704.1666666666667, "x": "死因は多臓器不全と報じられている。"}, {"t": 1706.35, "x": "刑は執行されていない。"}, {"t": 1707.9666666666667, "x": "もう一人は。"}, {"t": 1708.9666666666667, "x": "風間博子死刑囚は、東京拘置所に収監されている。"}, {"t": 1712.5, "x": "そして、一貫して無罪を主張している。"}, {"t": 1715.0166666666667, "x": "ここは、この回でいちばん丁寧に\n言わないといけないところだ。"}, {"t": 1718.4666666666667, "x": "死刑は確定している。"}, {"t": 1719.8, "x": "判決は、二件について共謀があったと認定した。"}, {"t": 1723.1, "x": "だが、本人はそれを認めていない。"}, {"t": 1725.3166666666666, "x": "再審の請求も続いている。"}, {"t": 1727.1666666666667, "x": "一度目は2012年1月にさいたま地裁に\n請求し、2015年12月に最高裁で退けられた。"}, {"t": 1733.7333333333333, "x": "二度目は2015年12月に請求し、2017年1月に\n退けられて、即時抗告している。"}, {"t": 1740.1833333333334, "x": "2025年の時点でも、さいたま地裁に\n再審を請求していると報じられている。"}, {"t": 1745.2666666666667, "x": "三十年以上。"}, {"t": 1746.4833333333333, "x": "弁護団は、警察の監視記録の中身や、\n取り調べ調書の金額の食い違いを\n新しい証拠として挙げている。"}, {"t": 1753.1166666666666, "x": "共謀が成り立つ前提が崩れる、という主張だ。"}, {"t": 1756.0333333333333, "x": "これは弁護団の主張であって、\n裁判所が認めたものではない。"}, {"t": 1759.75, "x": "もう一つ、付け加えておく。"}, {"t": 1761.6333333333334, "x": "判決が最も信用できるとした山崎永幸さんは、\n後になって主張を変えている。"}, {"t": 1766.7666666666667, "x": "風間博子は主犯ではなく、自分と同じく\n脅されて手伝った立場だ、と言うようになった。"}, {"t": 1772.25, "x": "ただし、その具体的な根拠は述べていない。"}, {"t": 1775.0833333333333, "x": "柱になった人が、後から。"}, {"t": 1777.2833333333333, "x": "私はここで、どちらが正しいとは言わない。言えない。"}, {"t": 1780.4166666666667, "x": "確定した判決があり、それを\n争い続けている人がいる。"}, {"t": 1783.9, "x": "今はそういう状態だ、とだけ言っておく。"}, {"t": 1787.0166666666667, "x": "制度の話を一つだけしておきたい。"}, {"t": 1789.3166666666666, "x": "1993年当時、ペットの販売業を始めるのに、\n届け出は必要なかった。"}, {"t": 1794.8833333333334, "x": "届け出も要らないの。"}, {"t": 1796.3166666666666, "x": "要らなかった。誰が、どこで、\nどんな商売をしているかを、行政が\n把握する仕組みが無かった。"}, {"t": 1801.9833333333333, "x": "犬の取引は現金でやり取りされることが\n多く、帳簿にも残りにくい。"}, {"t": 1806.15, "x": "客とのトラブルがあっても、どこにも記録が残らない。"}, {"t": 1809.3666666666666, "x": "だから、この店がどれだけの客と\nもめていたのかは、外からは見えなかった。"}, {"t": 1813.9, "x": "これは、警察の落ち度という話ではない。"}, {"t": 1816.4666666666667, "x": "そもそも、見るための仕組みが無かったという話だ。"}, {"t": 1819.6166666666666, "x": "届け出制になったのは、事件から六年後だ。"}, {"t": 1822.55, "x": "1999年12月、動物の保護及び管理に\n関する法律が改正された。"}, {"t": 1827.9833333333333, "x": "衆議院本会議での提案の説明は、こうだ。"}, {"t": 1830.85, "x": "「飼養施設を設置して動物取扱業を営もうとする\n者は、飼養施設を設置する事業所ごとに、"}, {"t": 1836.95, "x": "参議院での報告では、\n動物販売業者の届け出義務、という\n言い方をしている。"}, {"t": 1841.9, "x": "この事件がきっかけだったの。"}, {"t": 1843.85, "x": "そこは、はっきりさせておく。違う。"}, {"t": 1846.15, "x": "この改正で挙げられている理由は、\nペットの遺棄や、不適切な飼い方や、虐待だ。"}, {"t": 1851.2333333333333, "x": "この殺人事件が\n理由として挙げられているわけではない。"}, {"t": 1854.4, "x": "私が言いたいのは、\n因果関係ではなく、時期の対比だ。"}, {"t": 1857.9666666666667, "x": "この事件が起きた時代には、\nその仕組みがまだ無かった。それだけだ。"}, {"t": 1862.7333333333333, "x": "ここからは私の見方だ。"}, {"t": 1864.3333333333333, "x": "事実と分けて聞いてほしい。"}, {"t": 1866.05, "x": "引っかかったことが三つある。"}, {"t": 1867.8166666666666, "x": "一つ目。この事件は、警察が気づかなかった\n事件ではない、ということだ。"}, {"t": 1872.45, "x": "一人目が消えた十日後に車が見つかり、\nその数週間後には監視が始まっていた。"}, {"t": 1877.45, "x": "九年前の失踪も把握していた。"}, {"t": 1879.65, "x": "それでも、三人が亡くなるのを止められなかった。"}, {"t": 1882.6833333333334, "x": "気づいていても止められない。"}, {"t": 1884.3833333333334, "x": "疑うことと、身柄を取ることの間には、\n証拠という段差がある。"}, {"t": 1888.3666666666666, "x": "その段差があるのは、無実の人を捕まえないためだ。"}, {"t": 1891.4666666666667, "x": "必要なものだと私は思う。"}, {"t": 1893.45, "x": "だが、その段差を狙って作り出されたとき、\n捜査には手が無くなる。"}, {"t": 1897.6333333333334, "x": "二つ目。この事件を動かしたのは、\n科学でも報道でもなかった。"}, {"t": 1901.6833333333334, "x": "一年八か月、どんな捜査も届かなかった\n壁が、一人が話し始めたことで崩れた。"}, {"t": 1907.2, "x": "だが、その供述が柱になった\nせいで、裁判は十四年かかった。"}, {"t": 1911.4166666666667, "x": "供述がどう得られたのかが、\nそのまま争点になったからだ。"}, {"t": 1914.95, "x": "人の口は、事件を解く唯一の鍵にもなるし、\nいちばん揺れる証拠にもなる。"}, {"t": 1919.6166666666666, "x": "そして、その揺れは、今も終わっていない。"}, {"t": 1922.1666666666667, "x": "柱になった供述をした本人が、\n後から主張を変えているからだ。"}, {"t": 1926.2666666666667, "x": "三つ目。「行方不明」という言葉についてだ。"}, {"t": 1929.1333333333334, "x": "この事件で四人が消えたとき、四人とも、\nしばらくは行方不明者として扱われた。"}, {"t": 1934.2166666666667, "x": "家族は、事件だと訴え続けていた。だが、\n遺体が無いから動かない。"}, {"t": 1938.7166666666667, "x": "家族はずっと言い続けていたのよね。"}, {"t": 1941.0, "x": "一年八か月だ。"}, {"t": 1942.35, "x": "この動画で何度も出てきた「物証が無い」という\n言葉は、捜査する側の言葉だ。"}, {"t": 1947.35, "x": "待たされている側から見ると、それは、\n誰も探してくれないという時間になる。"}, {"t": 1951.8833333333334, "x": "遺体が見つかったから\n事件になった、ということは、裏を返せばこうだ。"}, {"t": 1956.05, "x": "見つからなければ、今も行方不明のままだった。"}, {"t": 1958.9666666666667, "x": "実際、九年前の三人は、今も行方不明のままだ。"}, {"t": 1963.1833333333334, "x": "最後に、忘れてはいけないことを話しておく。"}, {"t": 1965.9333333333334, "x": "この事件で亡くなったのは、四人だ。"}, {"t": 1968.2833333333333, "x": "犬を買いに来た人。その取引を\nめぐって巻き込まれた人。"}, {"t": 1971.9666666666667, "x": "そして、何も関係が無いのに巻き添えになった人。"}, {"t": 1975.2, "x": "全員、1993年の春から夏にかけて、\n普通の日常の途中で消えている。"}, {"t": 1980.6833333333334, "x": "この動画では、お名前も、暮らしぶりも出していない。"}, {"t": 1983.75, "x": "それは、この回で扱うべきなのが、\n四人がどう亡くなったかではなく、"}, {"t": 1988.0333333333333, "x": "そうね。"}, {"t": 1988.7833333333333, "x": "そして、九年前に消えた\n三人は、今も行方不明のままだ。"}, {"t": 1992.7, "x": "その家族にとっては、四十年以上、\n何も終わっていないことになる。"}, {"t": 1996.8, "x": "今回使った資料をまとめておく。"}, {"t": 1998.9, "x": "国会の記録は、国会会議録検索システムで\n公開されている。"}, {"t": 2003.0166666666667, "x": "使ったのは、1995年6月7日の衆議院法務委員会と、"}, {"t": 2007.6333333333334, "x": "裁判の経過と認定の中身は、第一審の判決が\n判例タイムズの千六十四号に、"}, {"t": 2012.9666666666667, "x": "「ボディを透明にする」という言葉の出どころは、"}, {"t": 2015.6166666666666, "x": "日付と経過は、朝日新聞、産経新聞、\n埼玉新聞などの当時の報道で確認した。"}, {"t": 2021.4166666666667, "x": "この事件をもとにした映画もあるが、作品の中で\n描かれていることは、事実とは別のものだ。"}, {"t": 2027.1833333333334, "x": "混ざったまま語られていることが多いので、\nそこは分けて受け取ってほしい。"}, {"t": 2031.2, "x": "この事件について、あなたはどう\n考えるか。よかったらコメントで教えてほしい。"}, {"t": 2035.75, "x": "最後まで見てくれて、ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
