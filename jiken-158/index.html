<script>
const D={"name": "158", "file": "158_編集用", "dur": 2014.01665625, "segs": [], "subs": [{"t": 0.0, "x": "1978年7月7日福井県の小浜でのことだ。"}, {"t": 4.0, "x": "若い男女が急に姿を消した。"}, {"t": 6.116666666666666, "x": "海の見える展望台に、2人が\n乗ってきた車が残っていた。"}, {"t": 9.966666666666667, "x": "2人はどこへ行ったの？"}, {"t": 11.466666666666667, "x": "それきり誰にも分からなくなった。"}, {"t": 13.5, "x": "3週間あまりあと、新潟県の柏崎でも男女が消えた。"}, {"t": 17.3, "x": "8月12日には、鹿児島県の吹上浜でも\n同じことが起きた。"}, {"t": 21.683333333333334, "x": "3組とも海のそばなのね。"}, {"t": 23.633333333333333, "x": "そうだ。"}, {"t": 24.75, "x": "3組6人が、40日たらずのうちに\n海岸からいなくなった。"}, {"t": 28.783333333333335, "x": "8月15日には、富山県の海岸で別の男女が襲われた。"}, {"t": 32.81666666666667, "x": "4人組の男に縛られて、袋の中に入れられたんだ。"}, {"t": 36.43333333333333, "x": "その2人は助かったの？"}, {"t": 38.2, "x": "自分たちで抜け出して、近くの家に助けを求めた。"}, {"t": 41.55, "x": "現場には手錠やさるぐつわが残されていた。"}, {"t": 44.11666666666667, "x": "それでも4人組が誰なのかは分からなかった。"}, {"t": 46.833333333333336, "x": "今回は国会に残った記録と、\n警察庁の公表だけでこの夏を追う。"}, {"t": 51.333333333333336, "x": "記録にはどんなことが書いてあるの？"}, {"t": 53.5, "x": "はじめ警察は、つながりを\n示す証拠は無いと答えている。"}, {"t": 56.983333333333334, "x": "北朝鮮による拉致の疑いが濃いと\n国会で答えたのは、10年後だ。"}, {"t": 61.36666666666667, "x": "10年もかかったのね。"}, {"t": 62.96666666666667, "x": "なぜそれほどかかったのかを、日付の順に見ていこう。"}, {"t": 66.71666666666667, "x": "どんな資料を使うの？"}, {"t": 68.2, "x": "中心は国会の会議録だ。"}, {"t": 70.1, "x": "1980年から、議員が何度も\nこの夏の出来事を取り上げた。"}, {"t": 74.4, "x": "警察庁の局長や長官がそのたびに答えている。"}, {"t": 77.56666666666666, "x": "もう1つは、警察庁がいま公表している事件の説明だ。"}, {"t": 81.41666666666667, "x": "役所が出しているものなのね。"}, {"t": 83.33333333333333, "x": "消えた6人の名前はこの動画では言わない。"}, {"t": 85.83333333333333, "x": "福井の2人、新潟の2人、鹿児島の2人と土地で呼ぶ。"}, {"t": 89.55, "x": "富山で襲われた2人も名前は出さない。"}, {"t": 91.93333333333334, "x": "大臣や局長は役職で議員は「議員」と呼ぶ。"}, {"t": 95.15, "x": "だれかが述べただけの話はどう扱うの？"}, {"t": 97.76666666666667, "x": "述べた人の話として紹介して、\n事実としては言わない。"}, {"t": 102.05, "x": "最初は7月7日の福井県小浜市だ。"}, {"t": 104.68333333333334, "x": "結婚の約束をしていた男女が車で出かけた。"}, {"t": 107.71666666666667, "x": "家の人にはデートに行くと話していたそうだ。"}, {"t": 110.45, "x": "七夕の日のデートだったのね。"}, {"t": 112.46666666666667, "x": "警察の答弁では、場所は\n小浜市の郊外、青井海岸の展望台だ。"}, {"t": 116.78333333333333, "x": "2人は車を残したまま消えてしまった。"}, {"t": 119.28333333333333, "x": "警察庁の説明では、車にはキーがついたままだった。"}, {"t": 122.86666666666666, "x": "キーをつけたまま車を離れるかしら？"}, {"t": 125.25, "x": "ふつうは、すぐに戻るつもりの時くらいだろうな。"}, {"t": 128.18333333333334, "x": "3日後の7月10日、2人の父親が\n警察署へ捜索の願いを出した。"}, {"t": 132.81666666666666, "x": "警察は家出をした人として\n手配し、車の周りを調べた。"}, {"t": 136.6, "x": "家出か自殺か事故か事件か。"}, {"t": 138.55, "x": "そのどれなのかも分からないままだった。"}, {"t": 141.38333333333333, "x": "警察はどこを探したの？"}, {"t": 143.15, "x": "車が見つかった小浜公園のあたりを中心に探した。"}, {"t": 146.43333333333334, "x": "県の本部からも応援が来て聞き込みを続けた。"}, {"t": 149.28333333333333, "x": "年が明けて1979年1月23日になった。"}, {"t": 153.21666666666667, "x": "この日全国のテレビ番組で取り上げられた。"}, {"t": 155.86666666666667, "x": "2月9日には、福井の放送局でも呼びかけている。"}, {"t": 159.45, "x": "見た人から知らせは来なかったの？"}, {"t": 161.63333333333333, "x": "国会での答弁では、\n何の手がかりも無いということだった。"}, {"t": 165.13333333333333, "x": "2人の行き先を示すものは、\n何一つ出てこなかったんだ。"}, {"t": 169.46666666666667, "x": "2組目は7月31日の新潟県柏崎市だ。"}, {"t": 173.16666666666666, "x": "大学生の男性と友人の女性がいなくなった。"}, {"t": 176.11666666666667, "x": "男性は家族から自転車を借りて出かけていた。"}, {"t": 178.93333333333334, "x": "女性は仕事を終えたあと、同僚に\nデートの予定を話していた。"}, {"t": 182.48333333333332, "x": "1997年の議員の話では、女性は美容師だったという。"}, {"t": 186.86666666666667, "x": "2人とも帰るつもりで出かけたのね。"}, {"t": 189.23333333333332, "x": "そうだ。"}, {"t": 190.35, "x": "自転車は、市立図書館の前に置かれたままだった。"}, {"t": 193.53333333333333, "x": "警察庁の説明では、図書館は\n海岸から数百メートルの所だ。"}, {"t": 197.95, "x": "海までは歩いて行ける距離ね。"}, {"t": 199.78333333333333, "x": "答弁では、2人がいた場所は\n柏崎の中央海岸とされている。"}, {"t": 203.75, "x": "8月3日に男性の父親が届けを出した。"}, {"t": 206.71666666666667, "x": "8月7日には女性の父親も届けを出している。"}, {"t": 210.45, "x": "柏崎の警察署も、自転車の周りから探していった。"}, {"t": 214.15, "x": "目撃した人を探し、いろいろな場合を考えて調べた。"}, {"t": 217.8, "x": "それほど探しても、だめだったの？"}, {"t": 220.1, "x": "見つからなかった。"}, {"t": 221.3, "x": "1979年6月19日には、\n2人の両親がテレビ番組に出た。"}, {"t": 226.31666666666666, "x": "自分たちで情報をくださいと訴えたんだ。"}, {"t": 228.96666666666667, "x": "親が自分で訴えるのは、どれほどつらかったかしら。"}, {"t": 232.2, "x": "それでも役に立つ知らせは入らなかったと答弁にある。"}, {"t": 235.98333333333332, "x": "3組目は8月12日の鹿児島県だ。"}, {"t": 238.75, "x": "男性が女性を誘って吹上浜へ出かけた。"}, {"t": 241.66666666666666, "x": "何をしに行ったの？"}, {"t": 243.0, "x": "夕日を見に行くと家族に言っていた。"}, {"t": 245.1, "x": "女性も家族に同じことを話して家を出ている。"}, {"t": 247.85, "x": "男性は電電公社、いまで言う電話会社の職員だった。"}, {"t": 251.35, "x": "2人はその夜から戻らなかった。"}, {"t": 253.48333333333332, "x": "8月14日、男性の義理の兄が\n地元の警察署に知らせた。"}, {"t": 257.73333333333335, "x": "車はどこで見つかったの？"}, {"t": 259.5, "x": "警察庁の説明では、吹上浜のキャンプ場の近くだ。"}, {"t": 263.1666666666667, "x": "車のドアには鍵がかかっていた。"}, {"t": 265.85, "x": "鹿児島の警察は特別の捜索班を作った。"}, {"t": 268.93333333333334, "x": "地元の漁船や、海上保安部の巡視艇も海を探した。"}, {"t": 272.46666666666664, "x": "営林署の職員も手伝って広い範囲を歩いた。"}, {"t": 275.48333333333335, "x": "そのとき浜に人はいなかったの？"}, {"t": 277.68333333333334, "x": "近くのキャンプ場には、600人ほどが来ていたそうだ。"}, {"t": 281.05, "x": "2人がいなくなったのは、18時40分ごろとされている。"}, {"t": 284.71666666666664, "x": "その時間にも、\n20人ほどのキャンパーがいたはずだという。"}, {"t": 288.21666666666664, "x": "それなら誰か見ていそうなものだけど。"}, {"t": 290.51666666666665, "x": "警察はその人たちにも話を聞いた。"}, {"t": 293.01666666666665, "x": "それでも2人が消える所を見た人は出てこなかった。"}, {"t": 296.1666666666667, "x": "9月には鹿児島のテレビが、\nのちに全国の番組も取り上げた。"}, {"t": 300.71666666666664, "x": "1980年3月、この件を国会で取り上げた議員がいる。"}, {"t": 304.8666666666667, "x": "議員は吹上浜で見つかったのは\nサンダルの片方だけだったと述べた。"}, {"t": 309.05, "x": "残っていたのはそれだけなの？"}, {"t": 310.93333333333334, "x": "議員の言葉ではそうなる。"}, {"t": 312.46666666666664, "x": "会社の人や青年団、巡視艇まで\n出て、何日も探したそうだ。"}, {"t": 316.7, "x": "議員はきわめて奇々怪々な事件だと述べている。"}, {"t": 319.68333333333334, "x": "海で何かあったのなら、もっと何か見つかりそうよね。"}, {"t": 323.03333333333336, "x": "そこがのちのち問われていくことになる。"}, {"t": 325.8833333333333, "x": "鹿児島の3日後、8月15日の富山県高岡市に移ろう。"}, {"t": 329.93333333333334, "x": "場所は通称で島尾海水浴場と呼ばれる浜だ。"}, {"t": 332.93333333333334, "x": "時刻は、18時30分から\n19時ごろのあいだとされている。"}, {"t": 336.95, "x": "夏の夕方の海水浴場ね。"}, {"t": 339.0833333333333, "x": "結婚を前提につき合っていた\n男女が、泳ぎに来ていた。"}, {"t": 342.51666666666665, "x": "泳ぎ終えて、車を止めた所へ歩いて戻るところだった。"}, {"t": 345.98333333333335, "x": "前から4人組の男が歩いてきた。"}, {"t": 348.28333333333336, "x": "ステテコやシャツ姿で、30歳前後に見えたという。"}, {"t": 351.71666666666664, "x": "海水浴場ならよくいそうな格好よね。"}, {"t": 354.3, "x": "すれ違ったとたん、4人は\n後ろから2人に襲いかかった。"}, {"t": 358.45, "x": "襲って何をしたの？"}, {"t": 359.9, "x": "持ってきたタオルと、ゴムで\n作ったさるぐつわを使った。"}, {"t": 363.1666666666667, "x": "手錠もかけて2人を縛り上げた。"}, {"t": 365.21666666666664, "x": "そのうえで1人ずつ寝袋のような布の袋に押し込んだ。"}, {"t": 368.73333333333335, "x": "最初から道具を用意していたのね。"}, {"t": 370.9, "x": "答弁を読むかぎりそう見える。"}, {"t": 372.5833333333333, "x": "4人は2人を、数十メートル離れた松林の中へ運んだ。"}, {"t": 376.43333333333334, "x": "そしてそこに置いたまま立ち去ってしまった。"}, {"t": 379.06666666666666, "x": "お金を取られたりはしなかったの？"}, {"t": 381.1166666666667, "x": "取られた物の話は答弁に出てこない。"}, {"t": 383.53333333333336, "x": "のちの警備局長は、強盗などの目的とは\n考えられないと述べた。"}, {"t": 388.35, "x": "袋の中の2人は少し薄暗くなるまで待った。"}, {"t": 391.45, "x": "それから自分たちの力で、近くの家に助けを求めた。"}, {"t": 395.0833333333333, "x": "その家から110番をして、事件が分かったんだ。"}, {"t": 398.26666666666665, "x": "怖くてすぐには動けなかったのね。"}, {"t": 400.51666666666665, "x": "富山県警察は、すぐに\n緊急配備をして、車の検問もした。"}, {"t": 404.8333333333333, "x": "浜の聞き込みや旅館や民宿の調べもした。"}, {"t": 407.78333333333336, "x": "4人組はつかまったの？"}, {"t": 409.46666666666664, "x": "つかまらなかった。"}, {"t": 410.6666666666667, "x": "2人はけがをしていて、事件は\n逮捕、監禁、致傷とされた。"}, {"t": 414.5833333333333, "x": "ここがほかの3組とは大きく違う点だ。"}, {"t": 417.1666666666667, "x": "富山の2人は生きて戻り、何が\n起きたかを話すことができた。"}, {"t": 421.6333333333333, "x": "残された道具からは何か分かったの？"}, {"t": 424.03333333333336, "x": "1980年11月に、保安部長がくわしく答えている。"}, {"t": 428.15, "x": "まず2人を入れた寝袋は、\n昭和30年ごろの品と見られた。"}, {"t": 431.96666666666664, "x": "作っていた会社として、\n東洋レーヨンなど7社を調べた。"}, {"t": 435.5, "x": "関係する業者も150社にあたっている。"}, {"t": 438.23333333333335, "x": "ずいぶん古い寝袋だったのね。"}, {"t": 440.26666666666665, "x": "事件の20年以上前の品ということになる。"}, {"t": 443.03333333333336, "x": "手錠については作る会社6社を調べた。"}, {"t": 445.6166666666667, "x": "さるぐつわのゴムでは、\nゴムの業界の850社にあたった。"}, {"t": 449.95, "x": "タオルは3本残っていた。"}, {"t": 451.6333333333333, "x": "そのうち1本だけ、大阪市の会社で\n作られたと分かった。"}, {"t": 455.3833333333333, "x": "それなら売った店をたどれそうね？"}, {"t": 457.4166666666667, "x": "ところがたくさん売られていた\n品で、売り先は分からなかった。"}, {"t": 460.95, "x": "ほかの品は、作った所さえ分からないままだった。"}, {"t": 464.23333333333335, "x": "850社も調べて分からなかったの？"}, {"t": 466.9, "x": "そういう答弁だ。"}, {"t": 468.03333333333336, "x": "のちの警備局長は、どれも\n粗悪な品だったと述べている。"}, {"t": 471.55, "x": "犯人に結びつく知らせは何も得られなかった。"}, {"t": 475.0, "x": "では、国会で初めてこの夏が問われた日を見よう。"}, {"t": 478.0833333333333, "x": "1980年3月24日参議院の決算委員会だ。"}, {"t": 482.1166666666667, "x": "1人の議員が、若い男女の蒸発の件を取り上げた。"}, {"t": 485.5833333333333, "x": "蒸発という言葉を使っていたのね。"}, {"t": 487.95, "x": "当時はその言い方がよく使われていた。"}, {"t": 490.26666666666665, "x": "議員はある両親から直接手紙をもらったと述べた。"}, {"t": 493.3666666666667, "x": "警察庁の保安部長が、3組の経過を順に説明している。"}, {"t": 497.26666666666665, "x": "小浜、柏崎、吹上浜、どれも\n結果は出ていないという内容だ。"}, {"t": 501.76666666666665, "x": "1年半たっても何も分かっていなかったのね。"}, {"t": 505.18333333333334, "x": "議員は3組には似ている所が多いと述べた。"}, {"t": 507.93333333333334, "x": "1つ目は、親も認めていた\n20代の男女のデート中だったこと。"}, {"t": 511.95, "x": "2つ目は、家出や自殺、水の事故の気配が無いこと。"}, {"t": 515.4833333333333, "x": "3つ目は、40日のうちに、人けの無い所で起きたこと。"}, {"t": 519.5166666666667, "x": "4つ目は何なの？"}, {"t": 520.8833333333333, "x": "1977年と1979年には、\n同じことが起きていないことだ。"}, {"t": 526.1666666666666, "x": "議員は計画的な犯罪かと思われると述べている。"}, {"t": 529.3333333333334, "x": "並べてみると偶然には見えないわね。"}, {"t": 531.6166666666667, "x": "議員は続けて富山の事件のことも尋ねた。"}, {"t": 534.3833333333333, "x": "刑事局長が、さっきの4人組の経過を説明している。"}, {"t": 538.5833333333334, "x": "警察は4つの件をつなげて考えていたの？"}, {"t": 541.45, "x": "刑事局長は、迷いのない言い方で答えた。"}, {"t": 544.2166666666667, "x": "富山の事件とほかの3件をつなぐ\n客観的な証拠は、何も無い。"}, {"t": 548.4166666666666, "x": "3件は事件か事故かも分からず、\n現場に証拠が残っていない。"}, {"t": 552.1833333333333, "x": "だから、事件だとはっきりしている\n富山の解明がまず第一だ。"}, {"t": 556.1333333333333, "x": "疑いはあっても証拠が無いということね。"}, {"t": 558.6, "x": "捜査の立場で言えばそうなる、という答え方だった。"}, {"t": 561.6833333333333, "x": "ただし富山県警には指示も出していた。"}, {"t": 564.1166666666667, "x": "3件とのつながりも含めて\n調べるように、という指示だ。"}, {"t": 567.5, "x": "手がかりは、残された品を\nたどることだと局長は述べた。"}, {"t": 571.6333333333333, "x": "議員はここでもう1歩踏み込んだ。"}, {"t": 573.55, "x": "手錠は国内で作られた記録が無いと、議員は述べた。"}, {"t": 576.9, "x": "さるぐつわや袋も、\n日本製ではないのではないかと尋ねている。"}, {"t": 580.7666666666667, "x": "外国の手が回った犯罪じゃないか、ということね。"}, {"t": 583.9833333333333, "x": "そうだ。"}, {"t": 585.1, "x": "刑事局長は、手錠は外国製とは言えないと答えた。"}, {"t": 588.4666666666667, "x": "かなり古くて、程度のよくない\n手錠だと言えるだけだという。"}, {"t": 591.9166666666666, "x": "どこで作られたかは？"}, {"t": 593.4166666666666, "x": "それを裏づける証拠は何も無い、という答えだった。"}, {"t": 596.45, "x": "局長は手口が大胆で荒っぽいとも述べている。"}, {"t": 599.3166666666667, "x": "政治的な目的の犯罪かもしれない。"}, {"t": 601.8, "x": "そういう見方も含めて調べている、と局長は答えた。"}, {"t": 605.8166666666667, "x": "テレビで呼びかけた反応はどうだったの？"}, {"t": 608.2166666666667, "x": "1980年1月30日には、\n全国の番組でも取り上げられた。"}, {"t": 613.05, "x": "そのときは反応があったと聞く、と議員は尋ねた。"}, {"t": 616.1333333333333, "x": "保安部長の答えは短かった。"}, {"t": 618.1666666666666, "x": "ことしの反応は、詳しいことはまだ入っていない。"}, {"t": 621.2333333333333, "x": "それだけなのね。"}, {"t": 622.4666666666667, "x": "議員は最後に、マスコミの力も\n借りて解明すべきだと求めた。"}, {"t": 626.4666666666667, "x": "家族にもテレビに出てもらっている。"}, {"t": 628.4833333333333, "x": "そうして情報を求めている、と刑事局長は答えた。"}, {"t": 631.7833333333333, "x": "一日も早い解明に当たりたい、という\n言葉で終わっている。"}, {"t": 635.8333333333334, "x": "8か月後の1980年11月25日、同じ議員がまた尋ねた。"}, {"t": 640.9, "x": "議員は前の質問をまず振り返った。"}, {"t": 643.15, "x": "富山の残された品はほとんど\n外国製だと指摘した、という内容だ。"}, {"t": 647.6166666666667, "x": "その後何か進んだの？"}, {"t": 649.3, "x": "さっきの、寝袋や手錠の会社を\n調べた答弁がこの日のものだ。"}, {"t": 653.25, "x": "結局分かったのはタオル1本の作り手だけだった。"}, {"t": 656.3166666666667, "x": "議員はこの日ある雑誌の記事も持ち出した。"}, {"t": 658.8166666666667, "x": "外国の人をスパイに育てているという内容だ。"}, {"t": 661.8666666666667, "x": "日本の事件とどう関係するの？"}, {"t": 663.9833333333333, "x": "警備局長はその雑誌は知らないと答えた。"}, {"t": 666.65, "x": "代わりに前の年の新聞記事を紹介している。"}, {"t": 669.4333333333333, "x": "レバノンの大学生が、日本で働けると誘われた話だ。"}, {"t": 673.2333333333333, "x": "行き先は日本ではなく、\n北朝鮮の訓練所だったという記事だった。"}, {"t": 677.9666666666667, "x": "そこから数年、会議録にこの件はあまり出てこない。"}, {"t": 681.1333333333333, "x": "1986年2月衆議院の予算委員会だ。"}, {"t": 684.6, "x": "ある議員がこの件に触れている。"}, {"t": 686.4, "x": "北朝鮮に渡った日本人の妻の里帰りを\n求める質問の中だった。"}, {"t": 691.0333333333333, "x": "アベックの件とは別の話だったの？"}, {"t": 693.4333333333333, "x": "本題は別だが議員はこう述べた。"}, {"t": 695.4833333333333, "x": "日本海のアベックの拉致事件。"}, {"t": 697.3666666666667, "x": "灰色の霧のように疑いがこもっている。"}, {"t": 699.8833333333333, "x": "灰色の霧という言い方なのね。"}, {"t": 701.95, "x": "疑いはあるのに誰もはっきり言えない。"}, {"t": 704.0833333333334, "x": "その頃の空気を表した言葉だと言える。"}, {"t": 706.5833333333334, "x": "政府の側からは、まだ北朝鮮という名前は出ていない。"}, {"t": 710.5833333333334, "x": "何が変わるきっかけになったの？"}, {"t": 712.6333333333333, "x": "のちの国家公安委員長はこう説明している。"}, {"t": 715.3333333333334, "x": "捕まった北朝鮮の元工作員の女性から、\n事情を聞いた。"}, {"t": 719.2333333333333, "x": "その聞き取りを含めて、証拠を\n1つずつ積み重ねたという。"}, {"t": 723.0333333333333, "x": "その女性は何を話したの？"}, {"t": 724.95, "x": "1988年の答弁に、伝え聞いた話として出てくる。"}, {"t": 729.2, "x": "女性は、李恩恵と呼ばれる\n日本人の女性と一緒にいた時期がある。"}, {"t": 732.95, "x": "その日本人女性からある話を聞いたという。"}, {"t": 735.6166666666667, "x": "自分と同じように、さらわれてきた\n日本人の男女を見たという話だ。"}, {"t": 739.9, "x": "アベックの件ともつながっていくのね。"}, {"t": 742.1833333333333, "x": "1988年の国会では、その2つが続けて\n取り上げられていく。"}, {"t": 747.55, "x": "1988年2月17日、衆議院の地方行政委員会だ。"}, {"t": 752.2333333333333, "x": "議員が富山の事件について尋ねた。"}, {"t": 754.5166666666667, "x": "答えたのは警察庁の警備局長だった。"}, {"t": 757.3166666666667, "x": "8年前に答えていたのは、刑事局長だったわよね？"}, {"t": 760.8166666666667, "x": "このころからは、警備局長が答えるようになっている。"}, {"t": 763.9833333333333, "x": "局長は富山の前に起きた3件の日付をまず並べた。"}, {"t": 767.4, "x": "どれを調べても、いなくなる\n原因や動機が見当たらない。"}, {"t": 770.6, "x": "海岸のそばで、突然行方が分からなくなっている。"}, {"t": 773.7166666666667, "x": "だから、拉致された疑いを\n持っていた、と述べたんだ。"}, {"t": 777.0666666666667, "x": "8年前とはずいぶん言い方が違うわね。"}, {"t": 779.6333333333333, "x": "ただこの日はまだ北朝鮮という言葉は使っていない。"}, {"t": 783.4166666666666, "x": "5週間あまりあとの3月26日、参議院の予算委員会だ。"}, {"t": 787.5333333333333, "x": "別の議員が、時間をかけてこの問題を問いただした。"}, {"t": 790.8333333333334, "x": "議員は元工作員の女性の件から話を始めている。"}, {"t": 794.3333333333334, "x": "どんなことを聞いたの？"}, {"t": 795.75, "x": "ある北朝鮮の工作員が、1978年に\n受けていた指示についてだ。"}, {"t": 800.6833333333333, "x": "警備局長はその中身を承知していると答えた。"}, {"t": 803.6833333333333, "x": "1つは、45歳から50歳の独身の日本人の男性だ。"}, {"t": 807.75, "x": "その人を北朝鮮へ連れてくること。"}, {"t": 810.0666666666667, "x": "それに、20代の未婚の日本人の女性も連れてくること。"}, {"t": 813.8, "x": "1978年ってアベックが消えた年じゃない？"}, {"t": 817.1666666666666, "x": "そうだ。"}, {"t": 818.3, "x": "議員も同じ年だということを強く言っている。"}, {"t": 820.9166666666666, "x": "事実なら、許しがたい国際的な\n謀略だと議員は述べた。"}, {"t": 825.3, "x": "議員は続けて外務省にも尋ねた。"}, {"t": 827.5833333333334, "x": "同じ1978年に、レバノンでも\n女性の誘拐が報じられていた。"}, {"t": 832.1833333333333, "x": "外務省の局長は、\nレバノンの新聞の報道として答えている。"}, {"t": 836.05, "x": "1978年の春、レバノンの女性5人が国を出た。"}, {"t": 840.0333333333333, "x": "東京か香港のホテルで\n働くためだと言われていたという。"}, {"t": 843.5166666666667, "x": "でも着いた先は違ったのね？"}, {"t": 845.4833333333333, "x": "報道では、最後は平壌へ連れて行かれたとされた。"}, {"t": 848.5333333333333, "x": "訓練所で、空手や諜報の技術を学ばされたという。"}, {"t": 851.8333333333334, "x": "1979年の秋までに、全員が\nレバノンへ帰ったと報じられた。"}, {"t": 856.5333333333333, "x": "同じ年に遠い国でも似たことがあったのね。"}, {"t": 859.3333333333334, "x": "さらに議員は、韓国の映画監督と女優の件も挙げた。"}, {"t": 862.8166666666667, "x": "外務省の局長は2人のことを承知していた。"}, {"t": 865.7, "x": "1978年に香港で北朝鮮に拉致された、という答えだ。"}, {"t": 870.25, "x": "2人はのちに、オーストリアで\nアメリカの大使館へ逃げ込んでいる。"}, {"t": 874.0166666666667, "x": "その2人のことも、日本の警察は調べたの？"}, {"t": 877.1333333333333, "x": "警備局長は、日本の法律に\n反した件ではないと答えた。"}, {"t": 880.9166666666666, "x": "だから捜査の対象ではないが、\n強い関心は持っているという。"}, {"t": 885.15, "x": "議員はそのあと家族の様子を話し始めた。"}, {"t": 887.8666666666667, "x": "6人のうち、2人の母親に会って話を聞いたという。"}, {"t": 891.2666666666667, "x": "子どもの名前が出ると、急に\n泣き出してしまう母親がいた。"}, {"t": 894.8333333333334, "x": "夜中に小さな物音がすると、\n戸口まで見に行く人もいた。"}, {"t": 898.6333333333333, "x": "帰ってきたんじゃないかと思うのね。"}, {"t": 900.7833333333333, "x": "そうしないと眠れないのだという。"}, {"t": 902.65, "x": "ある父親は、息子の下宿代と学費を払い続けていた。"}, {"t": 906.35, "x": "いつか帰ると思って払っていたそうだ。"}, {"t": 908.7666666666667, "x": "あきらめられないのね。"}, {"t": 910.1833333333333, "x": "柏崎では、親が長い海岸を歩いて探し続けたという。"}, {"t": 913.8833333333333, "x": "列車で2時間もかかる長さの海岸だ、と議員は述べた。"}, {"t": 917.3833333333333, "x": "新聞や週刊誌を集めて、真っ黒になるほど\n読み返した家族もいた。"}, {"t": 921.6, "x": "議員はそのうえで、国家公安委員長に考えを求めた。"}, {"t": 925.6333333333333, "x": "国家公安委員長はどう答えたの？"}, {"t": 927.85, "x": "答弁は短いものだった。"}, {"t": 929.5666666666667, "x": "昭和53年以来の一連のアベック行方不明事犯。"}, {"t": 932.8333333333334, "x": "恐らくは、北朝鮮による拉致の疑いが\n十分濃厚でございます。"}, {"t": 936.9666666666667, "x": "とうとう北朝鮮という言葉が出たのね。"}, {"t": 939.5, "x": "解明はとても難しいが、\n全力を尽くしていかなければならない。"}, {"t": 943.35, "x": "本人と家族に深い同情を申し上げる、とも述べている。"}, {"t": 946.7333333333333, "x": "1978年の夏から、9年半あまりがたっていた。"}, {"t": 950.8666666666667, "x": "これが政府の最初の答えになったの？"}, {"t": 953.2833333333333, "x": "のちの答弁で政府はそう説明している。"}, {"t": 955.7333333333333, "x": "政府が国会でこの問題に\n触れたのは、これが初めてだった。"}, {"t": 959.45, "x": "2004年に、外務省の審議官がそう答えている。"}, {"t": 963.25, "x": "翌月の4月20日には、\n衆議院の決算委員会でも取り上げられた。"}, {"t": 967.5, "x": "警備局長は、海岸のそばで\n突然いなくなったことを理由に挙げた。"}, {"t": 971.5833333333334, "x": "だから、拉致されたという\n疑いが持たれるのだと述べた。"}, {"t": 974.9333333333333, "x": "日本の海岸は守れなかったの？"}, {"t": 977.0833333333334, "x": "局長は海岸線がとても長いと述べている。"}, {"t": 979.8166666666667, "x": "全部を完全に見張るのは、おのずと無理だという。"}, {"t": 982.6666666666666, "x": "見回りや、海辺に住む\n人からの知らせで警戒しているとした。"}, {"t": 986.5666666666667, "x": "見張りにも限りがあるのね。"}, {"t": 988.3, "x": "局長は石川県や宮崎県の海岸で\n起きた別の件にも触れていた。"}, {"t": 992.6, "x": "どちらも、人が海岸から\n運び出された件だとされている。"}, {"t": 996.8333333333334, "x": "1989年10月31日、衆議院の予算委員会だ。"}, {"t": 1001.35, "x": "鹿児島を地元とする議員が、\n吹上浜の件を取り上げた。"}, {"t": 1004.9666666666667, "x": "単なる失踪事件ではありません、と議員は強く述べた。"}, {"t": 1008.3833333333333, "x": "地元の議員にとっては身近な話だったのね。"}, {"t": 1011.3833333333333, "x": "家出をする理由も、自殺をする\n事情も全く無かったという。"}, {"t": 1014.9333333333333, "x": "議員は4つの件のその後の捜査の経過を尋ねた。"}, {"t": 1018.0, "x": "警備局長は、国内では全く手がかりが\nつかめていないと答えた。"}, {"t": 1022.1166666666667, "x": "公開の手配もしたが、手がかりが\n少ないとも述べている。"}, {"t": 1026.1333333333334, "x": "その答弁ではどこまで言ったの？"}, {"t": 1028.1333333333334, "x": "局長は状況や手口から拉致または\n拉致未遂と考えられると述べた。"}, {"t": 1032.25, "x": "起きた場所が海岸だから、海外に\n連れ去られた疑いもある。"}, {"t": 1035.8333333333333, "x": "議員はさらにその国はどこかと問いただした。"}, {"t": 1038.5833333333333, "x": "答えはどうだったの？"}, {"t": 1039.9666666666667, "x": "結論から申し上げればと局長は切り出した。"}, {"t": 1042.7666666666667, "x": "一連の件は、北朝鮮による\n拉致という疑いが濃厚だと答えた。"}, {"t": 1046.9, "x": "そうした角度から捜査している、とも述べている。"}, {"t": 1049.8833333333334, "x": "1年半あまりで言い方がまた強くなったわね。"}, {"t": 1052.8333333333333, "x": "1991年6月にも、警察庁の課長が同じ考えを述べた。"}, {"t": 1057.6, "x": "北朝鮮による拉致という疑いが強い、という言い方だ。"}, {"t": 1061.6, "x": "1997年になると、国会での扱いが大きく変わる。"}, {"t": 1065.7166666666667, "x": "1977年に新潟で少女がいなくなっていた。"}, {"t": 1069.2833333333333, "x": "その件が拉致の疑いとして新たに分かったからだ。"}, {"t": 1072.4333333333334, "x": "その少女の件は前に別の回で取り上げたわね。"}, {"t": 1075.4333333333334, "x": "そうだ。"}, {"t": 1076.5666666666666, "x": "1998年3月、警察庁は\n疑いのある件をまとめて示した。"}, {"t": 1081.4833333333333, "x": "全部で7件10人それに未遂が1件2人だ。"}, {"t": 1084.65, "x": "アベックの3組はその中に入っているの？"}, {"t": 1087.3, "x": "入っている。"}, {"t": 1088.4166666666667, "x": "福井、新潟、鹿児島の3件6人と、\n富山の未遂の1件2人だ。"}, {"t": 1093.15, "x": "2000年11月には、警察庁長官も答えている。"}, {"t": 1096.65, "x": "アベックの件は3件6名だという答えだった。"}, {"t": 1100.1166666666666, "x": "富山の4人組の件はその後どうなったの？"}, {"t": 1102.8, "x": "1998年3月、法務省の刑事局長が答えている。"}, {"t": 1107.1666666666667, "x": "昭和60年7月15日、\n富山地方検察庁の高岡支部に送られた。"}, {"t": 1112.1166666666666, "x": "容疑者が誰か分からないまま、\n逮捕監禁致傷の罪で送られたんだ。"}, {"t": 1116.4166666666667, "x": "犯人が分からないまま、検察に\n送られることがあるのね。"}, {"t": 1120.0, "x": "前の年の秋には、議員がこの件は\n不起訴になったと述べている。"}, {"t": 1123.8, "x": "多くの証拠の品が残されていたのは\n明らかだ、とも議員は言った。"}, {"t": 1127.8166666666666, "x": "品物はあるのに、相手にたどり着けなかったのね。"}, {"t": 1130.9666666666667, "x": "事件から7年近くたってからの送致だった。"}, {"t": 1133.85, "x": "議員は、7件の疑いの中で送られた\n例はあるかとも尋ねていた。"}, {"t": 1137.9166666666667, "x": "刑事局長の答えは、富山の1件だけというものだった。"}, {"t": 1141.6, "x": "ほかの件は、検察まで届いてもいないのね。"}, {"t": 1144.5, "x": "答弁を読むかぎりでは、そうなる。"}, {"t": 1147.1833333333334, "x": "1999年には、鹿児島の議員たちが\n国会で続けて触れている。"}, {"t": 1151.8333333333333, "x": "6月の議員は、2人は結婚を\n前提につき合っていたと述べた。"}, {"t": 1155.7666666666667, "x": "警察の白書でも、拉致の疑いが\n強いとされていると紹介している。"}, {"t": 1159.9833333333333, "x": "地元の議会も、外務省へ意見書を出していたという。"}, {"t": 1163.2666666666667, "x": "地元でもずっと気にかけられていたのね。"}, {"t": 1165.7666666666667, "x": "12月には、別の議員が近所の家族のことを話した。"}, {"t": 1169.3333333333333, "x": "鹿児島の女性の両親は、\n議員の家の二軒下に住んでいたという。"}, {"t": 1173.2166666666667, "x": "父親は年を重ねていた。"}, {"t": 1175.0, "x": "それでも毎朝、小学校の子どもの通学を\n見守っていたという。"}, {"t": 1178.9666666666667, "x": "地域のために動いていたのね。"}, {"t": 1180.9166666666667, "x": "それでも話をすると、顔に深い\n憂いが浮かぶと議員は述べた。"}, {"t": 1184.65, "x": "生きているうちに元気な姿が見たい、と\n父親は話していたという。"}, {"t": 1188.55, "x": "議員はこのとき、あえて拉致とは\n言わず、行方不明と言い表した。"}, {"t": 1193.0333333333333, "x": "2000年11月9日、参議院の委員会でのことだ。"}, {"t": 1196.6166666666666, "x": "警察庁長官がこう述べた。"}, {"t": 1198.5166666666667, "x": "富山の件は、証拠に基づいて\n監禁致傷と判断している。"}, {"t": 1202.2833333333333, "x": "被害にあった2人は無事で話も聞けている。"}, {"t": 1205.0666666666666, "x": "外国へ連れ出されたわけではないから、ということね。"}, {"t": 1208.2666666666667, "x": "そうだ。"}, {"t": 1209.4, "x": "ただ長官は、そのうえでもう1つの判断を述べた。"}, {"t": 1212.5666666666666, "x": "2人の話、聞き込み、残された\n品の鑑定、そして直前の3件。"}, {"t": 1217.2333333333333, "x": "これらを合わせて考えると、北朝鮮に\nよる拉致未遂の疑いがある。"}, {"t": 1221.2333333333333, "x": "富山の件は、そういう疑いのある\n件だと認めたと述べている。"}, {"t": 1225.05, "x": "22年たって富山の件にも名前がついたのね。"}, {"t": 1228.6833333333334, "x": "2001年3月、福井を地元とする\n議員が国会で質問した。"}, {"t": 1232.9333333333334, "x": "2月25日の話から議員は始めた。"}, {"t": 1235.6833333333334, "x": "拉致の疑いのある家族が、成田から\nアメリカへ向かったという。"}, {"t": 1239.2833333333333, "x": "アメリカの政府に、協力を頼みに行くための旅だった。"}, {"t": 1242.75, "x": "その中に福井の家族もいたの？"}, {"t": 1244.9, "x": "議員の話では、小浜の2人の家族も加わっていた。"}, {"t": 1248.2833333333333, "x": "家族がアメリカの政府と会うのは、\nこれが初めてだと議員は述べた。"}, {"t": 1252.25, "x": "日本だけでは解決できないと思ったのね。"}, {"t": 1254.95, "x": "議員は地元の新聞の記事も読み上げている。"}, {"t": 1257.55, "x": "福井の男性の父親は、年齢的にもう\n限界を感じていると話していた。"}, {"t": 1262.1166666666666, "x": "柏崎の男性の母親は、待って\n待って23年たったと話していた。"}, {"t": 1266.6666666666667, "x": "胸が張り裂ける思いだ、という言葉も紹介されている。"}, {"t": 1270.0833333333333, "x": "せめて、生きているかどうかだけでも知りたいわよね。"}, {"t": 1273.1166666666666, "x": "議員も、最低限、安否や居場所が\n分かる手を打ってほしいと求めた。"}, {"t": 1277.7666666666667, "x": "2002年7月25日、衆議院の委員会に\n参考人が呼ばれた。"}, {"t": 1282.1166666666666, "x": "朝鮮半島を扱う雑誌の編集長で、\n大学の教授でもある人だ。"}, {"t": 1286.4833333333333, "x": "参考人は福井の件についてこう述べた。"}, {"t": 1288.9833333333333, "x": "家族の父親が、舞鶴の海上保安庁へ行ったという。"}, {"t": 1292.35, "x": "すると7月10日と11日に、小浜湾に\n不審な船がいたと聞いた。"}, {"t": 1296.85, "x": "それは確かめられた話なの？"}, {"t": 1298.9333333333334, "x": "参考人がそう述べたというところまでだ。"}, {"t": 1301.3166666666666, "x": "海上保安庁の記録そのものは、今回の資料には無い。"}, {"t": 1304.75, "x": "参考人は福井の2人が\nアベックの件の1組目だとも述べた。"}, {"t": 1308.5, "x": "その年の4月には、\n福井の男性の母親が亡くなったという。"}, {"t": 1312.45, "x": "帰りを待ったまま亡くなってしまったのね。"}, {"t": 1315.45, "x": "2002年9月17日首相が北朝鮮を訪れた。"}, {"t": 1318.95, "x": "この場で北朝鮮は、日本人を拉致したことを認めた。"}, {"t": 1322.4166666666667, "x": "1978年の夏から、24年あまりがたっていた。"}, {"t": 1326.5666666666666, "x": "とうとう相手の国が認めたのね。"}, {"t": 1328.7166666666667, "x": "あわせて拉致した人たちの安否も伝えてきた。"}, {"t": 1331.4833333333333, "x": "議員の言い方を借りれば5名は生きている。"}, {"t": 1333.8166666666666, "x": "そして8名は亡くなったというものだ。"}, {"t": 1336.25, "x": "8人も亡くなったというの？"}, {"t": 1338.1166666666666, "x": "北朝鮮の説明ではそうなっていた。"}, {"t": 1340.45, "x": "ある議員は、余りに残酷で\n信じがたい知らせだったと述べている。"}, {"t": 1344.2, "x": "8人のうち6人は20代から30代で亡くなったとされた。"}, {"t": 1348.0166666666667, "x": "議員はその若さにも触れている。"}, {"t": 1350.55, "x": "8人も亡くなったという説明は、本当にありえるの？"}, {"t": 1353.9666666666667, "x": "2002年11月、ある議員が数字で確かめようとした。"}, {"t": 1357.6166666666666, "x": "拉致されたときの年齢の人が、\n同じ年数でどれだけ亡くなるか。"}, {"t": 1361.6, "x": "日本の人口の数字を使って、\nその割合を計算したんだ。"}, {"t": 1365.4166666666667, "x": "結果はどうだったの？"}, {"t": 1366.8166666666666, "x": "議員の計算では、\n鹿児島の男性の場合は0.18％だった。"}, {"t": 1371.2, "x": "13人のうち8人がその通りに\n亡くなる確率も出している。"}, {"t": 1375.0166666666667, "x": "小数点のあとにゼロが14個も\n並ぶほど小さい、と議員は述べた。"}, {"t": 1379.15, "x": "ほとんど起こりえないということね。"}, {"t": 1381.1, "x": "議員は北朝鮮の伝えた死因の内訳も並べている。"}, {"t": 1384.35, "x": "交通事故が2人、石炭のガスの事故が\n2人、溺死が1人。"}, {"t": 1388.3833333333334, "x": "自殺が1人で、病気で\n亡くなったのは2人だけだという。"}, {"t": 1391.85, "x": "溺死とされた日は9月4日だった。"}, {"t": 1394.1166666666666, "x": "北朝鮮では9月に海では泳がない、と議員は述べた。"}, {"t": 1397.6, "x": "あとで外務省の局長が言った疑問と同じ所ね。"}, {"t": 1401.35, "x": "1か月後の10月15日、生きていると\n伝えられた5人が帰国した。"}, {"t": 1405.8166666666666, "x": "アベックの3組はどうだったの？"}, {"t": 1407.7833333333333, "x": "警察庁の説明では、福井の2人がこの日に帰国した。"}, {"t": 1411.5333333333333, "x": "新潟の2人も、同じ10月15日に帰国している。"}, {"t": 1415.0333333333333, "x": "どちらの2人も、帰国のあとで\n婚姻の届けを出したという。"}, {"t": 1418.7333333333333, "x": "24年ぶりに日本の土を踏んだのね。"}, {"t": 1421.3, "x": "1978年の夏から24年と3か月だ。"}, {"t": 1424.9833333333333, "x": "ただし鹿児島の2人は帰ってこなかった。"}, {"t": 1427.65, "x": "鹿児島の2人はどうなっていたの？"}, {"t": 1429.7833333333333, "x": "北朝鮮は2人とも亡くなったと説明してきた。"}, {"t": 1433.5333333333333, "x": "2004年11月、外務省の局長が\n北朝鮮の説明を紹介した。"}, {"t": 1438.2166666666667, "x": "鹿児島の男性は、1979年9月4日に\n亡くなったという説明だ。"}, {"t": 1443.25, "x": "場所は元山の海水浴場とされた。"}, {"t": 1445.5666666666666, "x": "午後3時ごろに泳いでいて、\n心臓麻痺で亡くなったという。"}, {"t": 1449.0666666666666, "x": "その説明を日本はそのまま受け取ったの？"}, {"t": 1451.7, "x": "局長は疑問を口にしている。"}, {"t": 1453.5833333333333, "x": "9月に北朝鮮の海水浴場で泳ぐのだろうか。"}, {"t": 1456.7166666666667, "x": "それに男性は泳ぎが好きでなく、\nほとんど泳げなかった。"}, {"t": 1460.2333333333333, "x": "泳げない人が海で泳いでいたことになるのね。"}, {"t": 1463.05, "x": "北朝鮮は、その日の最高気温は\n22.5度だったと説明していた。"}, {"t": 1467.6333333333334, "x": "水は冷たくなく、泳いでいる人は\n少なくなかったという説明だ。"}, {"t": 1471.6666666666667, "x": "2004年11月には、\n外務省の審議官がそう紹介している。"}, {"t": 1475.8333333333333, "x": "天気の数字まで、持ってきていたのね。"}, {"t": 1478.35, "x": "議員は、海岸から\nどれくらいの所だったのかと問いただした。"}, {"t": 1482.0, "x": "今回読んだ答弁には、その距離の数字は出てこない。"}, {"t": 1485.1833333333334, "x": "局長は非常に大きな疑問が\n残っているのが正直な感想だと述べた。"}, {"t": 1490.0833333333333, "x": "鹿児島の女性についても、北朝鮮は説明をしている。"}, {"t": 1493.55, "x": "2012年の国会で、女性の弟が参考人として述べた。"}, {"t": 1497.55, "x": "北朝鮮の説明では、亡くなったのは1981年8月17日。"}, {"t": 1502.6666666666667, "x": "突然の心臓麻痺だったとされている。"}, {"t": 1505.1, "x": "2人とも心臓麻痺なの？"}, {"t": 1506.9166666666667, "x": "弟もそこを指摘した。"}, {"t": 1508.6, "x": "1人が心臓麻痺だから、もう1人も\nそうしたのだろうと述べている。"}, {"t": 1512.4833333333333, "x": "説明の中の日付にも、\nつじつまの合わない所があるという。"}, {"t": 1516.3, "x": "家族はその説明を信じていないのね。"}, {"t": 1518.7833333333333, "x": "弟は信頼に足らない情報だと思っていると述べた。"}, {"t": 1521.9666666666667, "x": "亡くなったという日付も、新聞で\n先に知ったと弟は述べている。"}, {"t": 1526.5666666666666, "x": "2005年7月には、国会に元工作員が呼ばれた。"}, {"t": 1530.1666666666667, "x": "北朝鮮から韓国に渡った人だ。"}, {"t": 1532.6, "x": "鹿児島の男性と、1991年まで\n話を交わしていたという。"}, {"t": 1537.05, "x": "女性の姿も、1990年代のころまで見たと述べている。"}, {"t": 1541.3, "x": "それが本当なら、北朝鮮の説明とは合わないわね。"}, {"t": 1544.75, "x": "合わない。"}, {"t": 1545.8833333333334, "x": "ただこれは元工作員がそう述べたという話だ。"}, {"t": 1548.8166666666666, "x": "国がこの証言を確かめたという\n記録は、今回の資料には無い。"}, {"t": 1552.85, "x": "はっきりしないことは、はっきりしないままなのね。"}, {"t": 1555.8333333333333, "x": "2004年12月の話も参考人が述べている。"}, {"t": 1558.9666666666667, "x": "日本政府の立場がはっきりしたという話だ。"}, {"t": 1561.7833333333333, "x": "北朝鮮の説明を裏づけるものは\n皆無だ、という立場だという。"}, {"t": 1566.2666666666667, "x": "ここで最初の疑問に戻りたいわ。"}, {"t": 1568.3, "x": "どうして答えが出るまで10年もかかったの？"}, {"t": 1570.95, "x": "2002年の秋から、国会でもそこが問われ始めた。"}, {"t": 1574.3166666666666, "x": "11月5日、国家公安委員長が年表のように答えている。"}, {"t": 1578.2666666666667, "x": "1980年には、3件と\n富山の未遂について質問があった。"}, {"t": 1582.75, "x": "そのときは、当時の捜査の様子を\n警察から答えただけだった。"}, {"t": 1586.6, "x": "北朝鮮による拉致の疑いと初めて\n答えた日もはっきりしている。"}, {"t": 1590.55, "x": "1988年3月26日だ。"}, {"t": 1593.75, "x": "政府もその8年の空白を認めているのね。"}, {"t": 1596.6666666666667, "x": "別の議員がここで念を押した。"}, {"t": 1598.5666666666666, "x": "1980年に警察は疑いを\n知った、と受け止めてよいのか。"}, {"t": 1602.8, "x": "委員長は当時は全体像がまだはっきり\nつかめていなかったと答えた。"}, {"t": 1606.7666666666667, "x": "それでも警察として比べたりして、\n関心を示していたという。"}, {"t": 1611.2166666666667, "x": "2005年7月21日のことだ。"}, {"t": 1613.75, "x": "別の国家公安委員長がくわしく説明した。"}, {"t": 1616.6333333333334, "x": "当時の警察は、事件と\n事故の両方の面から捜査を尽くしていた。"}, {"t": 1620.7833333333333, "x": "それでも当時は、北朝鮮による\n拉致と判断するには至らなかった。"}, {"t": 1625.0166666666667, "x": "判断できなかった理由は何だったの？"}, {"t": 1627.4166666666667, "x": "答弁を合わせると理由は大きく2つになる。"}, {"t": 1629.9833333333333, "x": "1つ目は、3件の現場に証拠が\nほとんど残っていなかったこと。"}, {"t": 1634.0, "x": "2002年の警備局長も同じことを述べている。"}, {"t": 1636.9, "x": "目撃者がいない、証拠品も\nほとんど無い、という言葉だ。"}, {"t": 1640.4666666666667, "x": "2つ目は、外から届く情報がまだ無かったことだ。"}, {"t": 1643.9333333333334, "x": "元工作員の女性の話が出てくるまで、ということね。"}, {"t": 1647.5333333333333, "x": "そうだ。"}, {"t": 1648.6666666666667, "x": "委員長はその聞き取りを含めて証拠を\n一つ一つ積み重ねたと述べた。"}, {"t": 1652.9333333333334, "x": "その結果として、\n1988年の答弁になったという説明だ。"}, {"t": 1657.5666666666666, "x": "2003年2月の国家公安委員長も、\n近い言い方をしている。"}, {"t": 1661.5, "x": "資料の少ない中で証拠を集め、\n1988年に判断に至ったという。"}, {"t": 1666.6833333333334, "x": "少ない資料で、時間がかかったということね。"}, {"t": 1669.6333333333334, "x": "2004年には、別の参考人がこう述べている。"}, {"t": 1672.6333333333334, "x": "アベックの3件6人は、ジャーナリストが\n調べて明らかにしたものだ。"}, {"t": 1676.7666666666667, "x": "これも参考人の見方として、そのまま紹介しておく。"}, {"t": 1680.85, "x": "議員たちはその説明に納得していたの？"}, {"t": 1683.5833333333333, "x": "納得していない声も会議録には多い。"}, {"t": 1685.9666666666667, "x": "2003年2月には、ある議員がこう述べている。"}, {"t": 1688.9, "x": "日本の警察は県ごとに動いていて、\n全国をまとめる組織が無い。"}, {"t": 1693.0, "x": "新潟でさらい、鹿児島で\nさらうような動きには無力だった。"}, {"t": 1696.6166666666666, "x": "4つの県で起きたから、\nつながりが見えにくかったのね。"}, {"t": 1700.0, "x": "それは議員の見方で、国がそう認めたわけではない。"}, {"t": 1703.1166666666666, "x": "ただ1980年の刑事局長の答えを思い出してほしい。"}, {"t": 1707.0166666666667, "x": "4つの件をつなぐ客観的な証拠は、\n何も無いという答えだった。"}, {"t": 1711.15, "x": "県をまたいだ4つの件を、証拠で\nつなげなかったのは確かだ。"}, {"t": 1715.5, "x": "2004年2月には、別の議員が\n福井で聞いた話を紹介した。"}, {"t": 1719.6, "x": "福井県の知事が、悔しそうにこう話していたという。"}, {"t": 1722.7666666666667, "x": "当時、フグの養殖がいまのように\n盛んだったらどうだったか。"}, {"t": 1726.4, "x": "フグとどう関係するの？"}, {"t": 1728.0166666666667, "x": "海岸に網がたくさん張られ、\n漁業の人が海で働いている。"}, {"t": 1731.7333333333333, "x": "そういう海なら、\n拉致にはならなかったのではないかという話だ。"}, {"t": 1735.5, "x": "人の目があればということね。"}, {"t": 1737.3666666666666, "x": "あくまで議員が伝えた知事の言葉だ。"}, {"t": 1739.6333333333334, "x": "それでもあの夏の海辺がどれほど\n静かだったかが伝わってくる。"}, {"t": 1743.9, "x": "捜査は帰国のあとも続いた。"}, {"t": 1745.8, "x": "2006年1月6日、警察庁長官が\n3つの警察に指示を出した。"}, {"t": 1750.4833333333333, "x": "福井県警と新潟県警、それに警視庁だ。"}, {"t": 1753.5, "x": "共同で捜査するようにという指示だった。"}, {"t": 1755.9833333333333, "x": "28年前の事件をまだ調べていたの？"}, {"t": 1758.7333333333333, "x": "前の年の暮れに、実行した者を\n特定する新しい証拠を得たという。"}, {"t": 1762.95, "x": "2006年1月の国会で、警備局長がそう述べている。"}, {"t": 1766.65, "x": "警察庁の説明では逮捕状も出されている。"}, {"t": 1769.4166666666667, "x": "福井の件は、北朝鮮の工作員とされる1人だ。"}, {"t": 1772.8, "x": "実行した者として逮捕状が出ている。"}, {"t": 1775.2333333333333, "x": "新潟の件では、工作員とされる\n人物ら3人に逮捕状が出た。"}, {"t": 1779.5333333333333, "x": "その人たちはつかまったの？"}, {"t": 1781.4166666666667, "x": "国際手配をして、北朝鮮に\n引き渡しを求めているという段階だ。"}, {"t": 1786.35, "x": "いまの国の数え方はどうなっているの？"}, {"t": 1788.75, "x": "警察庁は、北朝鮮による\n拉致の件を13件19人としている。"}, {"t": 1793.1166666666666, "x": "福井、新潟、鹿児島のアベックの件も、\nその中に入っている。"}, {"t": 1797.2166666666667, "x": "富山の件は、拉致が未遂だったとみられる\n事件と書かれている。"}, {"t": 1800.9166666666667, "x": "工作員らあわせて10人に逮捕状を\n取り、国際手配したともある。"}, {"t": 1805.0666666666666, "x": "鹿児島の件には逮捕状のことは書いてあるの？"}, {"t": 1807.9166666666667, "x": "警察庁の鹿児島の件の説明には、\n逮捕状の記載は無い。"}, {"t": 1811.75, "x": "鹿児島の件の説明は短い。"}, {"t": 1813.7833333333333, "x": "北朝鮮による拉致の容疑の件と\n判断している、という所で終わる。"}, {"t": 1818.0, "x": "誰がさらったのかもまだ書かれていないのね。"}, {"t": 1820.6333333333334, "x": "警察は、いまも当時の写真をのせて情報を求めている。"}, {"t": 1824.7333333333333, "x": "2009年6月、警察の出身の議員が\n鹿児島の思い出を話した。"}, {"t": 1829.2166666666667, "x": "その議員は、\n鹿児島県警の本部長をしていたことがあった。"}, {"t": 1832.8166666666666, "x": "歴代の本部長が着任すると、\n必ずまず行く所があったという。"}, {"t": 1837.0666666666666, "x": "どこへ行くの？"}, {"t": 1838.2, "x": "鹿児島の2人がいなくなった吹上浜だ。"}, {"t": 1840.8333333333333, "x": "議員も、平成10年ごろに\n着任して、まず浜へ行ったという。"}, {"t": 1844.8, "x": "どんな浜だったの？"}, {"t": 1846.1833333333334, "x": "白い砂と松の並ぶ、とてもきれいな\n海岸だったと述べている。"}, {"t": 1849.9666666666667, "x": "季節によっては、ウミガメが卵を産みに来るそうだ。"}, {"t": 1853.0666666666666, "x": "本当にこんな所で拉致があったのかと\n思った、と議員は振り返った。"}, {"t": 1857.25, "x": "きれいな浜だからこそ信じにくいのね。"}, {"t": 1860.2, "x": "帰ってこない2人の家族は年を重ねていった。"}, {"t": 1863.1, "x": "2008年11月、鹿児島の男性の母親が\n91歳で亡くなった。"}, {"t": 1867.8666666666666, "x": "何人もの議員が国会でそのことに触れている。"}, {"t": 1870.7666666666667, "x": "息子が帰るのを待ち続けていたのね。"}, {"t": 1873.2166666666667, "x": "2011年4月には、国家公安委員長も\n家族の死に触れた。"}, {"t": 1877.2833333333333, "x": "鹿児島の女性の父親も、もう\n亡くなっていると述べている。"}, {"t": 1880.85, "x": "帰りを待つ人が少しずつ減っていくのね。"}, {"t": 1883.55, "x": "2010年の国会では、女性の弟が参考人として話した。"}, {"t": 1887.6833333333334, "x": "弟は姉が1978年に北朝鮮に\n拉致されたと、はっきり述べている。"}, {"t": 1893.4166666666667, "x": "ここまでを短くまとめてもらえる？"}, {"t": 1895.6, "x": "いいだろう。"}, {"t": 1896.7166666666667, "x": "1978年7月7日、福井の小浜で男女2人が消えた。"}, {"t": 1901.3833333333334, "x": "7月31日には新潟の柏崎、\n8月12日には鹿児島の吹上浜だ。"}, {"t": 1906.9333333333334, "x": "8月15日、富山の高岡で2人が\n4人組に袋へ押し込まれた。"}, {"t": 1911.4166666666667, "x": "1980年、警察は4つをつなぐ\n客観的な証拠は無いと答えた。"}, {"t": 1916.2333333333333, "x": "1988年、国家公安委員長が\n拉致の疑いが十分濃厚と答えた。"}, {"t": 1921.3666666666666, "x": "2002年、北朝鮮が拉致を認め、\n福井と新潟の4人が帰国した。"}, {"t": 1926.05, "x": "帰れていない2人が、まだいるのね。"}, {"t": 1928.3666666666666, "x": "北朝鮮の死亡の説明には、\n外務省も大きな疑問を述べている。"}, {"t": 1933.0, "x": "記録を読み終えても、答えの無い問いが3つ残る。"}, {"t": 1936.0, "x": "1つ目は、鹿児島の2人がいまどうしているのか。"}, {"t": 1939.05, "x": "2つ目は、富山で袋を用意していた\n4人組が誰だったのか。"}, {"t": 1942.9, "x": "3つ目は、1980年から\n1988年までに何ができたのかだ。"}, {"t": 1948.3166666666666, "x": "3つ目は、国会でも何度も問われていたわね。"}, {"t": 1951.2666666666667, "x": "国の答えは、当時は判断に\n至らなかった、というものだ。"}, {"t": 1954.9166666666667, "x": "証拠が少なく、外からの情報も\nまだ無かったという説明になる。"}, {"t": 1958.9833333333333, "x": "一方で議員たちは、もっと早く\n気づけたはずだと述べ続けた。"}, {"t": 1962.85, "x": "国の説明と議員の言葉が、両方残っているのね。"}, {"t": 1966.3166666666666, "x": "その2つは並んだまま残っている。"}, {"t": 1969.1333333333334, "x": "最後に1978年の夏の海辺を思い浮かべてみよう。"}, {"t": 1972.9833333333333, "x": "七夕の夜の展望台、図書館の前の自転車、\n夕日を見に行った浜。"}, {"t": 1977.4333333333334, "x": "どれも若い2人がふつうに出かけた先だった。"}, {"t": 1980.2833333333333, "x": "誰も、帰れなくなるなんて思っていなかったのね。"}, {"t": 1983.35, "x": "富山の2人は袋の中から生きて戻ってきた。"}, {"t": 1986.3, "x": "長官は残された品の鑑定も判断の材料に挙げていた。"}, {"t": 1990.0, "x": "古い会議録を読む意味って、何なのかしら？"}, {"t": 1992.8666666666666, "x": "ある。"}, {"t": 1993.9833333333333, "x": "「証拠は無い」から「疑い濃厚」まで。"}, {"t": 1996.5833333333333, "x": "国の言葉がどう変わったかを、日付で確かめられる。"}, {"t": 1999.8, "x": "その10年のあいだも家族は海岸を歩いた。"}, {"t": 2002.4166666666667, "x": "下宿代を払い続けた父親もいた。"}, {"t": 2004.9333333333334, "x": "鹿児島の2人が帰ってくる日を待ちたいわね。"}, {"t": 2007.75, "x": "鹿児島の2人はまだ帰っていない。"}, {"t": 2009.8333333333333, "x": "アベック連続失踪事件の記録は、\nいまも閉じていない。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
