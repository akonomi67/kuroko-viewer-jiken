<script>
const D={"name": "094", "file": "094_編集用", "dur": 2148.3, "segs": [], "subs": [{"t": 0.0, "x": "1982年の、ある事故調査報告書。\nその最後の一文から始める。"}, {"t": 5.1, "x": "こう書いてある。"}, {"t": 6.05, "x": "事故防止のために幾重にも\n設けられているチェック・ポイントが、"}, {"t": 9.566666666666666, "x": "すべてすり抜けられてしまった、\nその最終の結果であり、"}, {"t": 12.95, "x": "本事故は、不可抗力によるものではない。"}, {"t": 15.6, "x": "……不可抗力ではない。"}, {"t": 17.0, "x": "役所が作る文章としては、かなり強い言い方だ。"}, {"t": 20.2, "x": "防ぐしくみは、いくつもあった。\nそのどれもが働かなかった。"}, {"t": 23.983333333333334, "x": "しかたのないことではなかった、と\n国が自分で書いている。"}, {"t": 27.3, "x": "1982年、昭和57年2月9日の朝。"}, {"t": 31.216666666666665, "x": "羽田の沖で、旅客機が海に落ちた。"}, {"t": 33.666666666666664, "x": "日本航空350便。福岡発、東京行き。"}, {"t": 37.083333333333336, "x": "乗っていたのは174名。"}, {"t": 38.88333333333333, "x": "亡くなったのは24名だ。"}, {"t": 40.86666666666667, "x": "機体の故障？"}, {"t": 42.0, "x": "いや。調べた範囲で、機体に\n壊れていたところは見つかっていない。"}, {"t": 45.916666666666664, "x": "整備の落ち度も、金属の疲れも出てこなかった。"}, {"t": 48.95, "x": "それでも落ちた。"}, {"t": 50.11666666666667, "x": "じゃあ、誰かが責任を取ったの？"}, {"t": 52.266666666666666, "x": "誰も起訴されていない。"}, {"t": 53.53333333333333, "x": "機長も、会社の人も、一人もだ。"}, {"t": 56.25, "x": "……一人も。"}, {"t": 57.11666666666667, "x": "この事故は、世の中では別の言葉で覚えられている。"}, {"t": 60.28333333333333, "x": "私は今日、その言葉を主役にしない。"}, {"t": 62.8, "x": "今回は代わりに、すり抜けられた\nチェックを一つずつ数えていく。"}, {"t": 67.18333333333334, "x": "本題の前に、この回で言わないことを決めておく。"}, {"t": 70.26666666666667, "x": "先に言うのね。"}, {"t": 71.4, "x": "この回は、扱い方を一つ間違えると、\n事故そのものより大きな害を出す。だから先に言う。"}, {"t": 77.2, "x": "一つ目。機長の名前を言わない。顔も出さない。"}, {"t": 80.18333333333334, "x": "記録には名前が残っているが、\nこの方は起訴されていない。"}, {"t": 83.68333333333334, "x": "裁判で何かが決まったわけではないんだ。"}, {"t": 86.1, "x": "だから最後まで「機長」とだけ呼ぶ。"}, {"t": 88.6, "x": "副操縦士や航空機関士は？"}, {"t": 90.7, "x": "同じだ。役職だけで呼ぶ。"}, {"t": 92.48333333333333, "x": "責める形にもしない。"}, {"t": 94.03333333333333, "x": "二つ目。病気の名前について。"}, {"t": 96.18333333333334, "x": "報告書には病名が書いてあるが、それは\n当時の呼び方で、いまは使われていない。"}, {"t": 100.96666666666667, "x": "この回では、古いほうの呼び名を一度も口に出さない。"}, {"t": 104.03333333333333, "x": "理由はあとの章で説明する。"}, {"t": 105.95, "x": "三つ目。これがいちばん大事だ。"}, {"t": 107.96666666666667, "x": "この回は、病気のある人が\n危ない、という話では、まったくない。"}, {"t": 112.16666666666667, "x": "……そこは、はっきりさせておかないとね。"}, {"t": 114.56666666666666, "x": "はっきりさせる。私が今日追いかけるのは、\n人ではなく、しくみのほうだ。"}, {"t": 118.98333333333333, "x": "四つ目。落ちたときの様子や、\nけがの状態を話さない。"}, {"t": 122.5, "x": "亡くなった24名の名前も読まない。"}, {"t": 124.7, "x": "ご遺族は今も生きておられる。"}, {"t": 126.48333333333333, "x": "五つ目。機長がいま\nどうしているかには、一切触れない。"}, {"t": 129.81666666666666, "x": "調べたが、確かな記録に行き着けなかった。"}, {"t": 132.5, "x": "分からないものは言わない。"}, {"t": 134.01666666666668, "x": "この回で使うのは、報告書と、国会の会議録だ。"}, {"t": 137.38333333333333, "x": "どちらも誰でも読める。"}, {"t": 138.88333333333333, "x": "報告書の番号は58-3。"}, {"t": 140.86666666666667, "x": "運輸安全委員会のサイトに置いてある。"}, {"t": 143.78333333333333, "x": "では、その日の飛行を追う。"}, {"t": 145.46666666666667, "x": "1982年2月9日、火曜日。"}, {"t": 148.36666666666667, "x": "日本航空350便。"}, {"t": 150.21666666666667, "x": "福岡を7時25分に出て、東京に8時55分に着く便だ。"}, {"t": 154.48333333333332, "x": "機種はDC8。登録記号はJA8061。"}, {"t": 158.06666666666666, "x": "ジャンボより前の飛行機ね。"}, {"t": 159.83333333333334, "x": "4つのエンジンを翼の下に吊った、細長い機体だ。"}, {"t": 163.33333333333334, "x": "離陸は7時34分。乗組員8名、乗客166名。"}, {"t": 167.7, "x": "合わせて174名。"}, {"t": 169.41666666666666, "x": "滑走路16から、機長の操縦で上がっている。"}, {"t": 172.41666666666666, "x": "7時51分ごろ、高度29,000フィートで巡航に入った。"}, {"t": 176.35, "x": "8時22分、大島の航法無線の西およそ45海里で、\n降下を始める。"}, {"t": 181.35, "x": "8時35分、管制から許可が出た。"}, {"t": 183.96666666666667, "x": "滑走路33Rへの計器着陸装置による進入を許可する。"}, {"t": 188.1, "x": "計器着陸装置。"}, {"t": 189.56666666666666, "x": "地上から電波を出して、正しい\n降り方の線を示す装置だ。"}, {"t": 193.28333333333333, "x": "8時39分、着陸装置を下ろした。"}, {"t": 195.93333333333334, "x": "木更津の電波標識を通過。"}, {"t": 197.93333333333334, "x": "8時42分、対気速度およそ135\nノットで高度1,000フィートを通過。"}, {"t": 202.56666666666666, "x": "この時点まで、副操縦士の読み上げに\n対する機長の応答は、手順どおりだった。"}, {"t": 207.55, "x": "じゃあ、ここまでは普通なのね。"}, {"t": 209.51666666666668, "x": "普通だ。ここから42秒だけ、時計を細かく刻む。"}, {"t": 213.78333333333333, "x": "8時43分25秒。"}, {"t": 215.75, "x": "副操縦士が「ファイブ・ハンドレッド」と読み上げた。"}, {"t": 218.9, "x": "高度500フィートだ。"}, {"t": 220.26666666666668, "x": "ここで機長は、応答しなかった。"}, {"t": 222.48333333333332, "x": "……決まりでは、返すの？"}, {"t": 224.05, "x": "返すことになっている。"}, {"t": 225.46666666666667, "x": "報告書は、この時点を区切りとして書いている。"}, {"t": 228.3, "x": "事故当日も起床直後から心身の調子は良くなかったが、"}, {"t": 231.88333333333333, "x": "事故発生の42秒前にコール・\nアウトをしなかったころから、"}, {"t": 235.6, "x": "顕著に悪くなり始めたものと思われる。"}, {"t": 238.18333333333334, "x": "42秒前。"}, {"t": 239.46666666666667, "x": "そうだ。そこから先を続ける。"}, {"t": 241.51666666666668, "x": "8時43分50秒。高度300フィート。"}, {"t": 244.56666666666666, "x": "「アプローチング・ミニマム」の読み上げに、\n機長は「チェック」と返している。"}, {"t": 249.01666666666668, "x": "ここは手順どおりだ。"}, {"t": 250.31666666666666, "x": "8時43分56秒。高度200フィートに\n達した警報音が3度鳴る。"}, {"t": 255.1, "x": "8時43分59秒。「ツー・ハンドレッド」「ミニマム」。"}, {"t": 258.96666666666664, "x": "規程では、ここで「ランディング」か\n「ゴー・アラウンド」と言わなければならない。"}, {"t": 263.55, "x": "降りるか、やり直すか。"}, {"t": 264.98333333333335, "x": "どちらかを口に出して決める場面だ。"}, {"t": 267.4, "x": "それで、機長は？"}, {"t": 268.76666666666665, "x": "報告書の言葉をそのまま読む。"}, {"t": 270.75, "x": "機長の応答は、小さく沈みがちな\n音声での「チェック」と聞こえるものであった。"}, {"t": 275.53333333333336, "x": "報告書は、この7秒前の時点についてこう書いている。"}, {"t": 278.9166666666667, "x": "機長は、幻覚妄想状態に陥り始めたものと思われる。"}, {"t": 283.28333333333336, "x": "8時44分01秒。高度164\nフィート、対気速度130ノット。"}, {"t": 288.55, "x": "ここで機長は、自動操縦を解除して手動に切り替えた。"}, {"t": 292.01666666666665, "x": "そして、二つのことを続けてやっている。"}, {"t": 294.5833333333333, "x": "操縦輪を前方へ押し込んだ。"}, {"t": 296.4166666666667, "x": "全部のエンジンのパワー・レバーを、\nフォワード・アイドルまで引き戻した。"}, {"t": 300.6166666666667, "x": "……押し込んで、力を抜いた。"}, {"t": 302.43333333333334, "x": "着陸の直前にやることではない。"}, {"t": 304.6, "x": "8時44分02秒。航空機関士が叫んでいる。"}, {"t": 308.1666666666667, "x": "「ウィ・アー・ロー」または「パウアー・ロー」と\n聞こえる、と報告書は書いている。"}, {"t": 312.81666666666666, "x": "低い、あるいは力が足りない、という意味だ。"}, {"t": 315.51666666666665, "x": "同じ秒、機長は第2エンジンと第3\nエンジンのリバース・レバーを引いた。"}, {"t": 319.85, "x": "リバース。逆向きに効かせるほうね。"}, {"t": 322.2, "x": "着陸して地面に着いたあと、止まるために使うものだ。"}, {"t": 325.6166666666667, "x": "8時44分03秒。機首を下げる舵が9度前後まで達する。"}, {"t": 329.93333333333334, "x": "副操縦士が、操縦輪を引き起こし始めた。"}, {"t": 332.93333333333334, "x": "8時44分04秒。逆噴射がきき始めた。"}, {"t": 336.45, "x": "対地接近警報装置の人工音声が\n「グライド・スロープ」と告げている。"}, {"t": 341.06666666666666, "x": "8時44分05秒。副操縦士は、機首上げ\n7度前後まで引き起こすことに成功した。"}, {"t": 346.96666666666664, "x": "だが、それ以上は動かなかった。"}, {"t": 349.01666666666665, "x": "機長を見ると、まだ両手をつっぱって\n操縦輪を押し込んでいた。"}, {"t": 352.5833333333333, "x": "そこで副操縦士は叫んでいる。"}, {"t": 354.43333333333334, "x": "キャプテン、やめて下さい。"}, {"t": 355.95, "x": "……。"}, {"t": 356.8833333333333, "x": "8時44分07秒。滑走路の進入端から510メートル手前。"}, {"t": 361.55, "x": "第14番の進入灯の西側の海面に、前脚から入った。"}, {"t": 365.65, "x": "機首下げおよそ8度、\n右へのバンクおよそ7度、降下角およそ18度。"}, {"t": 370.15, "x": "機体は進入端の360メートル手前まで進んで止まった。"}, {"t": 374.6666666666667, "x": "ここで、言葉のことを一度きちんとしておく。"}, {"t": 377.3666666666667, "x": "この事故は、世の中では\n逆噴射の一語で呼ばれることが多い。"}, {"t": 381.1333333333333, "x": "私も、そう聞いてたわ。"}, {"t": 382.93333333333334, "x": "だが報告書は、そういうまとめ方をしていない。"}, {"t": 385.78333333333336, "x": "推定原因の項を、そのまま読む。"}, {"t": 388.0, "x": "本事故の推定原因は、着陸進入中の低高度に\nおいて、その必要がないのにもかかわらず、"}, {"t": 393.8, "x": "機長が操縦輪を押し込み、"}, {"t": 395.48333333333335, "x": "かつ、全エンジンのパワー・レバーを\nフォワード・アイドル位置まで引き戻し、"}, {"t": 399.6333333333333, "x": "その後さらに、第2及び第3エンジンのリバース・\nレバーをリバース・アイドル位置まで引いた"}, {"t": 404.78333333333336, "x": "ことによるものと認められる。"}, {"t": 406.68333333333334, "x": "……三つ、あるのね。"}, {"t": 408.06666666666666, "x": "三つだ。押し込む。力を抜く。逆に効かせる。"}, {"t": 411.23333333333335, "x": "逆噴射は、そのうちの三つ目にすぎない。\nしかも、いちばん最後だ。"}, {"t": 415.48333333333335, "x": "そして推定原因には、もう一文だけ続きがある。"}, {"t": 418.6666666666667, "x": "なお、機長がかかる操作を行うに至った理由は、"}, {"t": 421.65, "x": "その精神的変調によるものと認められる。"}, {"t": 424.5833333333333, "x": "……それで、全部なの？"}, {"t": 426.0833333333333, "x": "報告書が「原因」として書いたのは、この2文だけだ。"}, {"t": 429.6666666666667, "x": "残りの数百ページは、そこに\n至るまでの話に使われている。"}, {"t": 433.48333333333335, "x": "なぜこの人が、その席に座れてしまったのか。"}, {"t": 436.51666666666665, "x": "報告書がいちばん力を入れて\n調べたのは、そちらのほうなんだ。"}, {"t": 440.95, "x": "被害を数字で置く。報告書の数え方で言う。"}, {"t": 443.8, "x": "搭乗者は174名。乗組員8名と乗客166名。"}, {"t": 448.3, "x": "亡くなったのは24名。全員が乗客だ。"}, {"t": 451.18333333333334, "x": "重傷が95名。乗組員8名と、乗客87名。"}, {"t": 455.46666666666664, "x": "乗務員は、8人とも重傷なのね。"}, {"t": 458.03333333333336, "x": "全員だ。軽傷は54名で、こちらは全員が乗客。"}, {"t": 461.6666666666667, "x": "ここで、数字のことわりを一つ入れておく。"}, {"t": 464.35, "x": "ことわり？"}, {"t": 465.1666666666667, "x": "事故の直後に国会で報告された\n数字と、報告書の数字は違う。"}, {"t": 469.43333333333334, "x": "事故から2週間後、航空局長は\n重傷76名、軽傷66名と報告している。"}, {"t": 475.2, "x": "同じ日の運輸大臣は「150名に上る」と言っている。"}, {"t": 478.8, "x": "3年後の委員会では、ある委員が「\n142名の方が重傷を負われる」と述べている。"}, {"t": 484.15, "x": "……ばらばらじゃない。"}, {"t": 485.26666666666665, "x": "調べが進むにつれて、数え方も数字も動いた。"}, {"t": 488.4166666666667, "x": "だからこの回では、報告書の95名と54名を使う。"}, {"t": 492.3, "x": "ただし、亡くなった方の数だけは違う。"}, {"t": 494.95, "x": "違うって？"}, {"t": 495.9, "x": "24名。これは、事故の2週間後も、1年後も、\n3年後も、報告書も、全部一致している。"}, {"t": 502.43333333333334, "x": "ここだけは一度も動いていない。"}, {"t": 504.26666666666665, "x": "もう一つ、報告書が書いていることがある。"}, {"t": 506.9, "x": "機体は大破したが、火災は発生しなかった。"}, {"t": 509.78333333333336, "x": "だから、助かった方が多かった。\nそれでも24名は帰ってこなかった。"}, {"t": 514.9833333333333, "x": "この事故には、もう一つ大きな特徴がある。"}, {"t": 517.7166666666667, "x": "機体が、ほとんどそのまま手元に残ったことだ。"}, {"t": 520.8833333333333, "x": "海に落ちたのに？"}, {"t": 522.1333333333333, "x": "落ちたのが空港のすぐ前で、水が\n浅かった。だから引き上げられた。"}, {"t": 526.2666666666667, "x": "作業は翌日、2月10日の早朝から始まっている。"}, {"t": 529.6666666666666, "x": "14日までに、機体の大部分と\nエンジンの引き上げが終わった。"}, {"t": 533.35, "x": "残った主翼の部分は、\n23日の朝までに引き上げている。"}, {"t": 537.1666666666666, "x": "24日の早朝、格納庫の中に入れ終わった。"}, {"t": 540.2166666666667, "x": "そして滑走路は、2月14日の午前9時に再開している。"}, {"t": 544.15, "x": "5日で戻したのね。"}, {"t": 545.6833333333333, "x": "深い海や山に落ちた事故だと、こうはいかない。"}, {"t": 548.4666666666667, "x": "調べる物が残っていないから、\n推測でしか語れなくなる。"}, {"t": 552.1333333333333, "x": "この事故は、物が全部そろっていた。だから\n機体に異常が無いと言い切れた。"}, {"t": 556.5333333333333, "x": "調べる側の体制も見ておく。"}, {"t": 558.4333333333333, "x": "事故調査委員会が第一報を受けたのは、\n当日の8時50分ごろ。警視庁からだ。"}, {"t": 563.6333333333333, "x": "その5分後に、運輸大臣からも通報が入っている。"}, {"t": 566.85, "x": "付いた調査官は、主管の1名と、あわせて17名。"}, {"t": 570.5333333333333, "x": "18人。"}, {"t": 571.5166666666667, "x": "そのうち4名は、航空自衛隊の航空医学の専門の医官が\n併任で入っている。"}, {"t": 576.5333333333333, "x": "……お医者さんが、事故調査に。"}, {"t": 578.4166666666666, "x": "この事故の性格を考えれば、当然の人選だ。"}, {"t": 581.5166666666667, "x": "専門委員も4名いた。"}, {"t": 582.95, "x": "東京大学の医学部の教授と工学部の教授。"}, {"t": 586.0, "x": "そして、科学技術庁の航空宇宙技術研究所から2名だ。"}, {"t": 589.9166666666666, "x": "部会は二つに分かれた。"}, {"t": 591.3666666666667, "x": "飛行の経過を調べる部会と、残がいを調べる部会。"}, {"t": 594.6833333333333, "x": "飛行機を作った国であるアメリカにも、\n事故の発生は連絡されている。"}, {"t": 598.9, "x": "ただし報告書には、その代表等による\n調査への参加はなかった、と書いてある。"}, {"t": 603.8166666666667, "x": "……来なかったのね。"}, {"t": 605.0166666666667, "x": "機体に問題が無いと早い段階で分かったからだろう、と\n私は思う。ただし、書かれてはいない。"}, {"t": 610.6666666666666, "x": "聴聞会は1982年12月22日。"}, {"t": 613.95, "x": "運輸省の10階の大会議室で、\n朝10時から夕方4時45分まで開かれた。"}, {"t": 619.2166666666667, "x": "そして1983年3月22日から26日まで、原因に\n関係する人たちから意見を聴いている。"}, {"t": 626.3666666666667, "x": "副操縦士、航空機関士、運航本部長、路線室長。"}, {"t": 630.3, "x": "そして、健康管理室の常勤の内科医師と、\n非常勤の精神神経科の医師だ。"}, {"t": 636.0333333333333, "x": "ここから、時計を24時間巻き戻す。"}, {"t": 638.7666666666667, "x": "前の日？"}, {"t": 639.5833333333334, "x": "この事故は、前の晩にすでに一度起きかけている。"}, {"t": 642.55, "x": "2月8日、月曜日。東京を\n20時に出て福岡へ向かう便だ。"}, {"t": 646.4333333333333, "x": "同じ機長が乗っている。"}, {"t": 647.9833333333333, "x": "出発の10分ほど前、機長は\n操縦室での打ち合わせを短く切り上げている。"}, {"t": 652.6833333333333, "x": "気分が悪くなり、吐き気がしたためだと、\n本人がのちに述べている。"}, {"t": 656.9166666666666, "x": "まわりは気づかなかったの？"}, {"t": 658.6, "x": "副操縦士も航空機関士も、不調を\n感じさせるものはなかったと述べている。"}, {"t": 663.1833333333333, "x": "20時11分ごろ。管制から\n「滑走路に進入して待機せよ」と指示が来た。"}, {"t": 668.2333333333333, "x": "待て、という指示だ。"}, {"t": 669.4333333333333, "x": "離陸の許可はまだ出ていない。"}, {"t": 671.1833333333333, "x": "ところが機長は「管制許可はきているね」と\n言いながら、パワー・レバーを操作しかけた。"}, {"t": 676.4666666666667, "x": "……許可が出てないのに？"}, {"t": 677.85, "x": "副操縦士と航空機関士が、これを中止させている。"}, {"t": 681.1833333333333, "x": "20時13分に離陸。その5分後だ。"}, {"t": 683.8333333333334, "x": "船橋の沖合、東京湾の上空で右へ上昇旋回している\n最中に、傾きが異常に大きくなった。"}, {"t": 690.0666666666667, "x": "最大で70度前後。ふつうの旋回は、\n大きくても30度と言われている。"}, {"t": 694.7833333333333, "x": "70度って、ほとんど横向きじゃない。"}, {"t": 697.25, "x": "機体は内側へすべって、急降下した。"}, {"t": 699.7666666666667, "x": "記録には、15秒間に6,800フィートから\n6,000フィートまで下がったと残っている。"}, {"t": 705.0833333333334, "x": "対気速度は最大311ノット。"}, {"t": 707.45, "x": "副操縦士がすぐ操縦輪を握って直した。"}, {"t": 710.3166666666667, "x": "直後、副操縦士は声をかけている。"}, {"t": 712.6, "x": "キャプテン、大丈夫ですか。"}, {"t": 714.3333333333334, "x": "機長は落ち着いた態度で、大丈夫です、と答えた。"}, {"t": 717.7, "x": "……落ち着いてたのね。"}, {"t": 718.9833333333333, "x": "21時58分に福岡に着陸した。"}, {"t": 721.9, "x": "降りるとき、副操縦士は機長から\n「お見事」と言われている。"}, {"t": 726.3333333333334, "x": "ここが、すり抜けられたチェックの一つ目だ。"}, {"t": 729.0166666666667, "x": "前の晩の異常な旋回は、福岡でも\n東京でも、どこにも報告されなかった。"}, {"t": 733.9833333333333, "x": "誰も上げなかったの？"}, {"t": 735.45, "x": "副操縦士がどう受け止めたかは、\n会社の専務が国会で説明している。"}, {"t": 739.8166666666667, "x": "そのまま引く。"}, {"t": 740.8333333333334, "x": "自分はとっさに修正のかじをした、"}, {"t": 742.9833333333333, "x": "まあこれは一種の機長のポカという程度に\n思いました、というような表現でありまして、"}, {"t": 747.7333333333333, "x": "非常に異常だと考えたら会社に\n報告をしただろうと思うのですけれども、"}, {"t": 752.0, "x": "その辺が、その程度と本人が\n思わなかったのではないか。"}, {"t": 755.75, "x": "うっかりミス、くらいに思ったのね。"}, {"t": 757.9833333333333, "x": "客室乗務員は5名乗っていた。"}, {"t": 760.2666666666667, "x": "そのうち1名は、自分の経験から見て、今まで\n経験したことがない深い傾斜だったと言っている。"}, {"t": 766.2166666666667, "x": "残りの4名は、特に異常という\n記憶がない、と言っている。"}, {"t": 769.8166666666667, "x": "……5人のうち1人だけ。"}, {"t": 771.4333333333333, "x": "翌朝、機内の点検をしているとき、\n航空機関士が副操縦士に聞いている。"}, {"t": 776.25, "x": "あの傾きは、どのくらいだったのか。"}, {"t": 778.5666666666667, "x": "副操縦士はこう答えた。ほっておけば\n90度位まで行ったかも知れない。"}, {"t": 783.0333333333333, "x": "……その会話が、事故の朝にあったのね。"}, {"t": 785.5166666666667, "x": "あった。ただし、ここで副操縦士を責めるのは違う。"}, {"t": 788.75, "x": "報告書自身が、こう書いている。"}, {"t": 790.85, "x": "事故前日の異常旋回について福岡で\n関係者に報告がなされていたならば、"}, {"t": 795.55, "x": "ただし、当時の諸事情を考えるならば、これを\n期待することは無理であったと思われる。"}, {"t": 800.5333333333333, "x": "報告しなかったことを責めてはいない。"}, {"t": 802.5666666666667, "x": "無理だった、と書いている。"}, {"t": 804.8666666666667, "x": "事故の当日の朝に戻る。ここも報告書に書かれている。"}, {"t": 808.3833333333333, "x": "機長が起きたのは、5時から5時35分ごろだ。"}, {"t": 811.4833333333333, "x": "そして起床の直後に、実の母親へ電話をしている。"}, {"t": 814.9166666666666, "x": "……お母さんに？"}, {"t": 815.9, "x": "報告書は、機長がこう訴えたと\n述べている、という書き方をしている。"}, {"t": 820.0166666666667, "x": "どうも最近、自分の周囲に変なことが\n起っている。仕事をやめたい。"}, {"t": 824.2833333333333, "x": "……仕事をやめたい。"}, {"t": 825.4666666666667, "x": "事故の3時間半前だ。"}, {"t": 827.15, "x": "6時20分ごろ、福岡空港に着いた。"}, {"t": 829.9, "x": "駐機場へ歩いていく途中、気持ちが悪くなって\n吐き気を感じたと、本人が述べている。"}, {"t": 835.0333333333333, "x": "前の晩も、出発前の打ち合わせのときに\n同じことが起きている。"}, {"t": 839.0666666666667, "x": "二晩続けてね。"}, {"t": 840.5, "x": "報告書は、当日についてこうまとめている。"}, {"t": 843.25, "x": "事故当日も、起床直後から、\nその心身の調子は良くなかった。"}, {"t": 847.4333333333333, "x": "そして7時34分、機長の操縦で離陸した。"}, {"t": 850.8833333333333, "x": "……その電話のことは、誰かに伝わったの？"}, {"t": 853.5166666666667, "x": "伝わっていない。"}, {"t": 854.5833333333334, "x": "母親は、息子からの電話を受けただけだ。"}, {"t": 857.2833333333333, "x": "会社に連絡する道があったわけでもない。"}, {"t": 859.75, "x": "ここも、すり抜けたチェックの一つとして数えられる。"}, {"t": 862.9166666666666, "x": "ただし、責める話ではまったくない。"}, {"t": 865.2, "x": "家族に「変なことが起きている」と言われて、"}, {"t": 867.9833333333333, "x": "それを勤め先に知らせるという発想が\n出てくる人は、そう多くないはずだ。"}, {"t": 872.35, "x": "ことわっておくが、この電話のことは、\n事故のあとに機長本人が述べたこととして"}, {"t": 877.2166666666667, "x": "報告書に書かれている。その場で\n誰かが聞いていた記録ではない。"}, {"t": 881.6, "x": "時計を事故のあとへ戻す。"}, {"t": 883.2166666666667, "x": "1982年2月19日。"}, {"t": 885.5666666666667, "x": "事故から10日目だ。"}, {"t": 886.9333333333333, "x": "事故調査委員会の事務局長が、そのときまでに\n分かった事実を運輸大臣に報告した。"}, {"t": 892.3166666666667, "x": "その中身を、2月23日に国会で説明している。"}, {"t": 896.0666666666667, "x": "まだ2週間もたってないのに。"}, {"t": 898.0, "x": "この説明が、この事故の言葉が世の中に出た最初だ。"}, {"t": 901.4666666666667, "x": "事務局長はまず、前の晩の飛行について述べている。"}, {"t": 904.7166666666667, "x": "羽田を離陸して4分ほどのところで、通常なら\nきわめてスムーズな上昇旋回を行うべきところ、"}, {"t": 910.5, "x": "10秒間に1,100フィートという、\n通常の下降の倍以上の速さで急激な降下を行った。"}, {"t": 915.9833333333333, "x": "……あら、さっきの数字と違う。"}, {"t": 917.95, "x": "この時点は粗い解析だ。"}, {"t": 919.5, "x": "最終の報告書では15秒間に800フィートになっている。"}, {"t": 923.1833333333333, "x": "調べが進むと数字は動く。そういうものだ。"}, {"t": 925.9833333333333, "x": "そして事務局長は、\nボイスレコーダーのことを話している。"}, {"t": 929.3333333333334, "x": "解析が終わっていたのは、\n最後の2秒から3秒だけだった。"}, {"t": 933.0333333333333, "x": "そこにあったのは、対地接近警報装置の人工音声だ。"}, {"t": 936.6333333333333, "x": "グライド・スロープ、という\n言葉が2度繰り返されている。"}, {"t": 939.9333333333333, "x": "その2度目の終わりのほうに、別の声が重なっていた。"}, {"t": 943.25, "x": "……副操縦士の。"}, {"t": 944.5, "x": "そうだ。そして、その直後に短い\n衝撃音で記録が終わっている。"}, {"t": 948.65, "x": "この一言だけが、そのあと\n44年、独り歩きすることになる。"}, {"t": 952.8833333333333, "x": "事務局長は、最後にこう言っている。"}, {"t": 955.15, "x": "今後の調査では、もっと広い\n分野にわたる事実を集めて、"}, {"t": 958.7333333333333, "x": "一切の予断を入れず、その上に\n立って真の事故原因をきわめたい。"}, {"t": 963.1833333333333, "x": "ここからが、この回の山だ。"}, {"t": 965.1, "x": "定期便の操縦士は、6か月ごとに\n体の検査を受けなければならない。"}, {"t": 969.4333333333333, "x": "航空法の第31条と第33条で決まっている。"}, {"t": 972.9666666666667, "x": "これに通らないと、飛べない。"}, {"t": 974.85, "x": "半年に一度ね。"}, {"t": 976.2, "x": "合格の基準は、\n航空法の施行規則の別表に書いてある。"}, {"t": 979.9666666666667, "x": "その総合の欄には、こうある。"}, {"t": 981.8666666666667, "x": "航空業務に支障をきたす\nおそれのある心身の欠陥がないこと。"}, {"t": 985.6166666666667, "x": "さらに航空法の第71条は、\n基準に合わなくなったときは、"}, {"t": 989.5666666666667, "x": "紙の有効期間の中であっても、航空業務を\n行ってはならないと定めている。"}, {"t": 994.35, "x": "紙が残ってても、だめになるのね。"}, {"t": 996.75, "x": "そうだ。しくみとしては、ちゃんとできている。"}, {"t": 999.3833333333333, "x": "検査のやり方を書いたマニュアルもある。"}, {"t": 1001.4166666666666, "x": "1970年、昭和45年9月に運輸省が作ったものだ。"}, {"t": 1005.9833333333333, "x": "その「精神及び神経系」の項には、\n不合格になる病気が具体的に並んでいる。"}, {"t": 1011.3166666666667, "x": "そしてそこには、この事故で報告書が\n書いた病名も、はっきり載っている。"}, {"t": 1015.8333333333334, "x": "……載ってたの？"}, {"t": 1016.8, "x": "載っていた。マニュアルの注意書きには、\nこうも書いてある。"}, {"t": 1019.95, "x": "過去の病歴、遺伝の歴、生活の歴、\n日常の行動についての客観的な資料を、"}, {"t": 1025.3666666666666, "x": "できるだけ集めて、検討されなければならない。"}, {"t": 1028.2166666666667, "x": "紙の上では、これ以上ないほど整っている。"}, {"t": 1030.9, "x": "問題は、この機長がその検査に合格していたことだ。"}, {"t": 1034.9666666666667, "x": "なぜ合格したのか。報告書は、そこを分解している。"}, {"t": 1038.5, "x": "まず、検査を受けるときに出す申請書だ。"}, {"t": 1041.0833333333333, "x": "既往症の欄がある。過去にかかった\n病気を書くところだな。"}, {"t": 1044.5333333333333, "x": "そこには「めまい」「不眠症」「神経症」といった\n項目が並んでいて、丸を付けることになっている。"}, {"t": 1050.6833333333334, "x": "それで？"}, {"t": 1051.4166666666667, "x": "報告書の原文を読む。"}, {"t": 1053.0, "x": "「心身症」「抑うつ状態」\n「自律神経失調症」などの項目はない。"}, {"t": 1057.6666666666667, "x": "……無いの？"}, {"t": 1058.4, "x": "無い。この3つは、まさに\nこの機長が診断されていた名前だ。"}, {"t": 1062.1833333333334, "x": "報告書はこう続ける。"}, {"t": 1063.7166666666667, "x": "法令上明定されてはいないが、いずれの欄についても\n申請者による正直な記入が期待されている。"}, {"t": 1069.5, "x": "機長の最近の申請書中、上記の\nいずれの欄も無記入となっている。"}, {"t": 1073.7666666666667, "x": "書く欄が無いんだから、書きようがないわね。"}, {"t": 1076.4333333333334, "x": "そういう作りだった。"}, {"t": 1077.75, "x": "そして、医師が記入する側にも欄がある。"}, {"t": 1080.15, "x": "「精神神経系」という項目だ。"}, {"t": 1082.4666666666667, "x": "機長の申請書では、そこが「異常なし」となっている。"}, {"t": 1085.95, "x": "報告書の言葉で言えば、\n機長は合格と判定されている。"}, {"t": 1089.4666666666667, "x": "ここが、すり抜けられたチェックの二つ目だ。"}, {"t": 1092.1166666666666, "x": "紙は正しく回っていた。ただ、\nその紙には、書く場所が無かった。"}, {"t": 1096.9833333333333, "x": "では、その「異常なし」と\n書いた医師は、誰だったのか。"}, {"t": 1100.65, "x": "国の指定を受けたお医者さんよね。"}, {"t": 1102.7833333333333, "x": "そうだ。国が指定した\n航空身体検査医。ここは間違いない。"}, {"t": 1106.6166666666666, "x": "ただし、報告書はこう書いている。そのまま読む。"}, {"t": 1109.6, "x": "機長は、運航乗務員健康管理室の\n常勤内科医師であり、"}, {"t": 1113.3666666666666, "x": "同時に航空身体検査指定機関である\n大学附属病院に所属する"}, {"t": 1117.7, "x": "指定航空身体検査医でもある同医師から、"}, {"t": 1120.3333333333333, "x": "継続して航空身体検査証明の交付を受けていた。"}, {"t": 1123.7333333333333, "x": "……会社の中のお医者さんが、\n国の検査もしてたってこと？"}, {"t": 1127.2666666666667, "x": "同じ人だ。"}, {"t": 1128.25, "x": "日ごろ社員として乗員を診ている医師が、\n同時に、国の資格で合否を判定していた。"}, {"t": 1133.2833333333333, "x": "この形について、会社の専務が国会で説明している。"}, {"t": 1136.9166666666667, "x": "航空法によるところの身体検査を行い、同時に、\nその人が会社の産業医ということでもある。"}, {"t": 1142.8, "x": "そういうことでありまして、15年間、\n同じ仕事を続けていただきました。"}, {"t": 1147.4166666666667, "x": "15年。"}, {"t": 1148.2666666666667, "x": "当時、それは珍しい形ではなかった。"}, {"t": 1150.7, "x": "責める言い方をしたいのではない。"}, {"t": 1152.5833333333333, "x": "ただ、飛べなくなるかどうかを決める\n人と、その人を雇っている側が、"}, {"t": 1156.8, "x": "同じ場所にいる形ではあった。"}, {"t": 1158.7, "x": "これが、すり抜けられたチェックの三つ目だ。"}, {"t": 1161.2833333333333, "x": "そして、この形は事故のあとに\n変えられる。そこは終わりのほうで話す。"}, {"t": 1166.1166666666666, "x": "ここで、この事故のいちばん難しいところに入る。"}, {"t": 1169.0666666666666, "x": "この機長には、病名が二つある。"}, {"t": 1171.4166666666667, "x": "二つ？"}, {"t": 1172.1833333333334, "x": "会社と、診ていた医師が\n一貫して言っていた名前が一つ。"}, {"t": 1175.6833333333334, "x": "報告書が事故のあとに認定した名前が、もう一つだ。"}, {"t": 1179.1166666666666, "x": "会社の専務は、国会でこう述べている。"}, {"t": 1181.5666666666666, "x": "担当医師は一貫して心身症ということである。"}, {"t": 1184.3833333333334, "x": "投薬のときの名前も、うつ病、うつ状態、\n抑うつ状態、心身症、自律神経失調症。"}, {"t": 1190.5333333333333, "x": "報告書は、この5つを並べて書いている。"}, {"t": 1193.2666666666667, "x": "それが、事故のあとで変わったのね。"}, {"t": 1195.5666666666666, "x": "報告書の認定は違った。\nそして発病の時期も、ずっと前だとしている。"}, {"t": 1200.2166666666667, "x": "報告書は、発病は1976年、\n昭和51年の秋ごろと書いている。"}, {"t": 1205.6166666666666, "x": "……事故の6年前。"}, {"t": 1206.95, "x": "ただし、なぜ発病したのかは\n判然としない、と正直に書いてある。"}, {"t": 1211.0833333333333, "x": "そして、こう続ける。"}, {"t": 1212.5333333333333, "x": "機長は1981年10月から\n11月にかけて、関係医師により、"}, {"t": 1217.4, "x": "経過も順調で、キャプテン乗務に\n耐え得る程に回復したと診断された。"}, {"t": 1221.7666666666667, "x": "しかしながら、機長の病は継続的な\n経過をたどっていたものと認められる。"}, {"t": 1226.5, "x": "治ったと診断されたけど、続いていた。"}, {"t": 1229.1666666666667, "x": "報告書は、見抜けなかった\n理由の一つとして、こうも書いている。"}, {"t": 1233.1166666666666, "x": "関係医師が、似た症状の心身症等であると\n判断してしまったこと。"}, {"t": 1237.4, "x": "ここが、この事故の芯だ。"}, {"t": 1238.9833333333333, "x": "誰かが嘘をついたのではない。"}, {"t": 1240.65, "x": "判断が届かなかった。"}, {"t": 1242.9333333333334, "x": "ここで、第2章で先送りにしたことを話す。"}, {"t": 1245.9666666666667, "x": "病気の名前ね。"}, {"t": 1247.2666666666667, "x": "報告書が認定した病名は、1983年当時の呼び方だ。"}, {"t": 1251.85, "x": "その呼び名は、2002年に変えられている。"}, {"t": 1254.4, "x": "いまは統合失調症という名前になっている。"}, {"t": 1257.1166666666666, "x": "……名前を変えたの？"}, {"t": 1258.3166666666666, "x": "変えた。古いほうの呼び名に、人を\n遠ざける響きが付いてしまったからだ。"}, {"t": 1262.7, "x": "名前のせいで、診てもらうことをためらう\n人が出ていた。"}, {"t": 1265.85, "x": "だから私は、この回で古いほうの呼び名を\n一度も口に出さない。"}, {"t": 1269.6833333333334, "x": "報告書を引くときも、そこだけは飛ばす。"}, {"t": 1272.4666666666667, "x": "資料に書いてあっても？"}, {"t": 1273.9666666666667, "x": "書いてある。だが、いま口に出す必要が無い。"}, {"t": 1276.85, "x": "そのうえで、この回でいちばん大事なことを言う。"}, {"t": 1279.5166666666667, "x": "病気があることと、人に害を\n与えることは、別のことだ。"}, {"t": 1283.15, "x": "この回は、病気のある人が\n危ないという話では、まったくない。"}, {"t": 1287.1833333333334, "x": "……じゃあ、何の話なの？"}, {"t": 1288.8666666666666, "x": "174名を預かる席に座る人の体と\n心を、会社と国がどう見るか。"}, {"t": 1293.8666666666666, "x": "調子がよくないときに、本人が\n言い出せる場所があるか。"}, {"t": 1297.1166666666666, "x": "周りが気づいたときに、それを上げられる道があるか。"}, {"t": 1300.1166666666666, "x": "足りなかったのは、そこだ。"}, {"t": 1301.8666666666666, "x": "報告書も、まさにそこを調べている。"}, {"t": 1304.1, "x": "人ではなく、道のほうをな。"}, {"t": 1306.6833333333334, "x": "報告書の中で、私がいちばん\n長く読み返した一文がある。"}, {"t": 1310.5833333333333, "x": "そのまま引く。"}, {"t": 1311.6, "x": "なお、機長の心身の状況がおかしいと\n思った者は、少なくない筈である。"}, {"t": 1316.2833333333333, "x": "……いたのね。"}, {"t": 1317.1333333333334, "x": "いた。誰も気づかなかったのではない。"}, {"t": 1319.4, "x": "報告書は、そのあとにこう続ける。"}, {"t": 1321.6833333333334, "x": "機長が病にかかっていて、"}, {"t": 1323.4166666666667, "x": "航空機を墜落せしめるような行為をする程に\nその状況が悪化していたと考えた者は、"}, {"t": 1328.5166666666667, "x": "いなかったもののように思える。"}, {"t": 1330.4, "x": "……そこまでは、思わなかったのね。"}, {"t": 1332.5333333333333, "x": "思わない。ふつうは思わない。"}, {"t": 1334.3, "x": "これは、この事故に限った話ではないと思う。"}, {"t": 1337.15, "x": "職場で誰かの様子がおかしいとき、\nたいていの人は「疲れているんだろう」で止める。"}, {"t": 1342.0833333333333, "x": "そこから先を考えるのは、よほどのことだ。"}, {"t": 1344.85, "x": "国のほうも、あとで同じことを言っている。"}, {"t": 1347.2833333333333, "x": "1985年8月20日、運輸省の航空局長の答弁だ。"}, {"t": 1351.9166666666667, "x": "未然の防止ができなかったことについては、"}, {"t": 1354.3833333333334, "x": "日本航空の中の、職員相互の、都合の悪いことは\n見過ごすというのか見逃すというのか、"}, {"t": 1359.8833333333334, "x": "そういうことが大きな原因だったと考えている。"}, {"t": 1362.6666666666667, "x": "そして、仲間同士のかばい合いというようなことも、"}, {"t": 1365.6, "x": "安全意識が高まればそれは\n克服されていく、と続けている。"}, {"t": 1370.0166666666667, "x": "報告書は、なぜ情報が医師まで\n届かなかったのかを、立場ごとに書き出している。"}, {"t": 1374.8833333333334, "x": "ここは丁寧に読む。責めるためではなく、\n同じことを繰り返さないためだ。"}, {"t": 1379.2, "x": "まず、機長の夫人。"}, {"t": 1380.6, "x": "乗務ができなくなることの懸念。"}, {"t": 1382.3833333333334, "x": "身内の不幸を隠して置きたいという願望。"}, {"t": 1385.0166666666667, "x": "……家族だものね。"}, {"t": 1386.2333333333333, "x": "次に、友人。"}, {"t": 1387.3833333333334, "x": "機長の不利になるようなことは\n考えたくない、言いたくないという願望。"}, {"t": 1391.3, "x": "次に、同僚。"}, {"t": 1392.4333333333334, "x": "奇妙な言動を見聞しても、一時的な\n事象と受け取ってしまった。"}, {"t": 1396.55, "x": "そして、上司だ。ここがいちばん長い。"}, {"t": 1399.05, "x": "ある程度良くないことは知っていたが、\n正常であることを示す情報も入手していた。"}, {"t": 1403.7666666666667, "x": "医師に全部伝えなくても正確な診断ができると考えた。"}, {"t": 1407.3666666666666, "x": "機長の人権やプライバシーに配慮し過ぎた。"}, {"t": 1410.15, "x": "……配慮しすぎた。"}, {"t": 1411.35, "x": "報告書は、そう書いている。"}, {"t": 1413.1666666666667, "x": "そして最後に、こうある。"}, {"t": 1414.7666666666667, "x": "まさか乗機を墜落させるような操作をする\n運航乗務員が部下にいるとは、思いもよらなかった。"}, {"t": 1420.2333333333333, "x": "報告書は、この四者のほかに、\n医師の側の理由も二つ挙げている。"}, {"t": 1424.3, "x": "関係医師が、機長の変調を示す事実を見て\n取り、聞き出すことに成功しなかったこと。"}, {"t": 1429.7166666666667, "x": "そして、似た症状の心身症等であると\n判断してしまったこと。"}, {"t": 1433.8333333333333, "x": "……六つとも、悪意じゃないのね。"}, {"t": 1435.8166666666666, "x": "一つも無い。全部、誰かを\n思ってのことだ。それでもすり抜けた。"}, {"t": 1440.5666666666666, "x": "ここで、誤解されやすいところを一つ潰しておく。"}, {"t": 1443.7, "x": "どこ？"}, {"t": 1444.35, "x": "機長を乗務に戻したときの決め方が、いい\nかげんだったのではないか。"}, {"t": 1448.3833333333334, "x": "そう思う人がいるだろうが、\n報告書はそう書いていない。"}, {"t": 1451.5666666666666, "x": "そのまま読む。"}, {"t": 1452.55, "x": "1981年11月の機長のキャプテン乗務復帰の決定に\n際しては、"}, {"t": 1457.5333333333333, "x": "関係医師から3回意見書を求め、\nライン・モニタを実施し、"}, {"t": 1461.3166666666666, "x": "本来の付議事項でないにも\nかかわらず運航乗務員査定委員会に\n報告した上で決定するという、"}, {"t": 1466.8666666666666, "x": "慎重な手続が取られている。"}, {"t": 1468.9166666666667, "x": "……3回も意見書を取ってるのね。"}, {"t": 1470.95, "x": "ライン・モニタというのは、実際の便に\n医師などが同乗して様子を見ることだ。"}, {"t": 1475.45, "x": "本来なら報告しなくてもいい\n委員会にまで、わざわざ報告している。"}, {"t": 1479.5333333333333, "x": "手続きの数でいえば、多いほうだ。"}, {"t": 1481.6833333333334, "x": "ただし報告書は、そのあとにこう続ける。"}, {"t": 1484.3166666666666, "x": "しかしながら、その決定の基礎資料とされた\n機長の心身の状況に関する関係医師の意見は、"}, {"t": 1490.05, "x": "結果からみて適確でなかったものと認められる。"}, {"t": 1493.1333333333334, "x": "手続きは踏んだけど、その中身が。"}, {"t": 1495.5666666666666, "x": "そうだ。ここが厄介なところでな。"}, {"t": 1497.75, "x": "手続きを増やしても、そこに入る中身が\n違っていれば、結論は変わらない。"}, {"t": 1502.3, "x": "会社は国内線から戻すという配慮もしている。"}, {"t": 1505.0833333333333, "x": "国際線は負担が重いからだ。"}, {"t": 1507.15, "x": "飛行時間も、比較的少ないところから始めている。"}, {"t": 1510.6, "x": "それでも、事故は起きた。"}, {"t": 1512.8833333333334, "x": "もう一つ、潰しておくことがある。"}, {"t": 1515.0333333333333, "x": "あの6秒のあいだに、副操縦士は\n止められなかったのか、という問いだ。"}, {"t": 1519.3833333333334, "x": "……引き起こしては、いたのよね。"}, {"t": 1521.3166666666666, "x": "引き起こしている。7度まで\n戻した。だがそれ以上は動かなかった。"}, {"t": 1525.3833333333334, "x": "報告書は、この点についてはっきり書いている。読む。"}, {"t": 1528.65, "x": "機長が同機を墜落せしめるに至らしめた\n三つの操作を行った後であっても、"}, {"t": 1533.2166666666667, "x": "着陸復行に準じた緊急操作がなされていたならば、"}, {"t": 1536.6, "x": "同機はその性能上、墜落しなかった可能性があるが、"}, {"t": 1540.0, "x": "当時の諸事情を考えるならば、かかる操作をすることを"}, {"t": 1543.35, "x": "副操縦士や航空機関士に期待することは\n不可能であったものと認められる。"}, {"t": 1548.0, "x": "……不可能、って書いてあるのね。"}, {"t": 1549.8166666666666, "x": "可能性はあった。だが期待するのは無理だった。"}, {"t": 1552.4833333333333, "x": "両方を書いている。"}, {"t": 1553.7, "x": "着陸復行というのは、降りるのを\nやめて上昇し直すことだ。"}, {"t": 1557.3666666666666, "x": "それを、隣の席の人間が、6秒のうちに独断でやる。"}, {"t": 1561.1166666666666, "x": "機長が両手で操縦輪を押し込んでいる、その横でだ。"}, {"t": 1564.4333333333334, "x": "……そんなこと、考えられないわ。"}, {"t": 1566.4833333333333, "x": "報告書も、考えられないと書いている。"}, {"t": 1568.95, "x": "私はこの一文を、報告書の良心だと思っている。"}, {"t": 1572.3, "x": "生き残った人を責めない、という\n線を、はっきり引いてある。"}, {"t": 1576.3666666666666, "x": "この事故について、当時から\nずっと言われてきた見方がある。"}, {"t": 1579.8666666666666, "x": "……あれは、わざとだったんじゃないか、っていう。"}, {"t": 1582.35, "x": "それだ。この点について、報告書は\n自分のほうから否定している。"}, {"t": 1586.35, "x": "これは珍しいことだ。ふつう報告書は、\n言われていない説をわざわざ潰さない。"}, {"t": 1590.9833333333333, "x": "原文を読む。"}, {"t": 1591.95, "x": "なお、この機長の操作が滑走路に\n接地したときのものと考えることには無理がある。"}, {"t": 1596.85, "x": "また、その原因を正常人が容易に理解し得るような"}, {"t": 1600.1166666666666, "x": "自殺企図と同種のものと\n考えることはできないであろう。"}, {"t": 1603.5, "x": "……自殺とは違う、と。"}, {"t": 1605.0833333333333, "x": "そう書いてある。"}, {"t": 1606.0333333333333, "x": "前半のほうも大事だ。"}, {"t": 1607.4, "x": "地面に着いたと勘違いして止める\n操作をした、という見方も否定している。"}, {"t": 1611.95, "x": "高度164フィート。およそ50メートルだ。"}, {"t": 1614.7666666666667, "x": "地面に着いたと思える高さではない。"}, {"t": 1617.0333333333333, "x": "報告書が書いたのは、42秒前から始まって7秒前に\n幻覚妄想状態に陥り始めた、という経過だ。"}, {"t": 1624.0333333333333, "x": "意図してやったのでも、勘違いしたのでもない。"}, {"t": 1626.9, "x": "……じゃあ、罪に問えるの？"}, {"t": 1628.4166666666667, "x": "そこが、次の章だ。"}, {"t": 1630.5666666666666, "x": "刑事の手続きは、報告書とは別に走っている。"}, {"t": 1633.7, "x": "1982年8月5日、参議院の法務委員会。"}, {"t": 1637.45, "x": "警察庁の捜査第一課長が説明している。"}, {"t": 1640.3833333333334, "x": "事故前の病状や、事故のときの言動などから\n精神状態に疑問が認められたので、"}, {"t": 1645.45, "x": "目下、専門家による精神鑑定を実施中である。"}, {"t": 1648.8166666666666, "x": "精神鑑定。"}, {"t": 1649.9833333333333, "x": "裁判にかけられる状態か\nどうかを、医師が調べる手続きだ。"}, {"t": 1653.6166666666666, "x": "容疑は、航空の危険を生じさせる\n行為等の処罰に関する法律の違反。"}, {"t": 1658.0666666666666, "x": "この容疑で、東京地方裁判所の裁判官から\n鑑定留置状が出ている。"}, {"t": 1662.5, "x": "そして、その結果がどうなったか。"}, {"t": 1664.7166666666667, "x": "それが国会で説明されたのは、3年以上あとのことだ。"}, {"t": 1668.2833333333333, "x": "1985年11月26日、参議院の法務委員会。"}, {"t": 1672.5333333333333, "x": "法務省の刑事局長の答弁を読む。名前は外す。"}, {"t": 1675.95, "x": "機長につきましては、航空の危険を生じさせる\n行為等の処罰に関する法律違反につき"}, {"t": 1681.4666666666667, "x": "捜査を行いました結果、本件犯行当時、\n心神喪失の状態にあったと認められましたために、"}, {"t": 1687.7, "x": "昭和57年9月17日に不起訴処分に付した。"}, {"t": 1691.3333333333333, "x": "……1982年の9月。"}, {"t": 1693.3, "x": "事故の7か月後ね。"}, {"t": 1694.9666666666667, "x": "報告書が出るより、8か月も前だ。"}, {"t": 1697.4333333333334, "x": "心神喪失というのは、良い悪いを見分ける力と、"}, {"t": 1700.6333333333334, "x": "自分の行いを止める力が、そのときに\n失われていたという判断だ。"}, {"t": 1704.9166666666667, "x": "この場合、刑罰を与えないことになっている。"}, {"t": 1707.5666666666666, "x": "起きたことが無かったことになるのではない。"}, {"t": 1709.9333333333334, "x": "罰を与えても、罰の目的が\n達せられないからだ、という考え方だ。"}, {"t": 1714.4833333333333, "x": "……納得できる人ばかりじゃないでしょうね。"}, {"t": 1716.9, "x": "私もそう思う。24名が亡くなっているんだからな。"}, {"t": 1720.2666666666667, "x": "ただし、これは1982年だけの特別な\n決め方ではない。いまも使われている刑法の基本だ。"}, {"t": 1727.2, "x": "残るのは、会社の側だ。"}, {"t": 1728.9666666666667, "x": "1984年11月9日。"}, {"t": 1731.55, "x": "6人について、不起訴の処分が出た。"}, {"t": 1734.2333333333333, "x": "6人って、誰？"}, {"t": 1735.7, "x": "運航を管理する立場の人が4人。"}, {"t": 1737.7666666666667, "x": "乗員の健康管理をしていた\n医師が2人だ。名前は言わない。"}, {"t": 1741.4833333333333, "x": "容疑は業務上過失致死傷。"}, {"t": 1743.2166666666667, "x": "理由は嫌疑不十分。"}, {"t": 1744.6666666666667, "x": "1985年3月16日、参議院の予算委員会で、\n法務省の刑事局長が説明している。"}, {"t": 1751.3166666666666, "x": "鍵になったのは、予見可能性という言葉だ。"}, {"t": 1754.35, "x": "前もって分かったかどうか、ってこと？"}, {"t": 1756.6333333333334, "x": "そうだ。不注意の罪が成り立つには、二つが要る。"}, {"t": 1759.8333333333333, "x": "悪い結果が起きると前もって分かったかどうか。"}, {"t": 1762.55, "x": "そして、分かったとして、それを避けられたかどうか。"}, {"t": 1765.7166666666667, "x": "どちらか一つでも欠けると、責める余地が無くなる。"}, {"t": 1768.7833333333333, "x": "この件で問われたのは、前のほうだ。"}, {"t": 1771.0, "x": "機長を乗務に戻したとき、この6人は、戻せば\n墜落して人が死傷すると分かっていたか。"}, {"t": 1776.8, "x": "……分かってたの？"}, {"t": 1777.8666666666666, "x": "局長ははっきり言っている。"}, {"t": 1779.35, "x": "御本人たちが予見していなかったことは\n事実である、と。"}, {"t": 1782.8166666666666, "x": "分かっていたなら、何か手を打っていたはずだからだ。"}, {"t": 1785.8166666666666, "x": "問題は、同じ場に他の人を置いたとして、\n分かる可能性があったかどうか。"}, {"t": 1790.35, "x": "捜査の結果として挙げられたのは、三つだ。"}, {"t": 1793.0666666666666, "x": "当時、機長に異常な言動はほとんどなかったこと。"}, {"t": 1796.1333333333334, "x": "医師が十数回、本人に面接して診断していること。"}, {"t": 1799.6666666666667, "x": "そして、医師が3回、機長の操縦する\n飛行機に同乗して観察していること。"}, {"t": 1804.7166666666667, "x": "……見てはいたのね。"}, {"t": 1805.8833333333334, "x": "見ていた。だから、分かる可能性があったと\n認めるだけの証拠が無い。"}, {"t": 1809.9666666666667, "x": "そういう理由で、不起訴になった。"}, {"t": 1812.65, "x": "話はここで終わらない。"}, {"t": 1814.1333333333334, "x": "1985年11月26日の委員会で、ある委員が、\nその前の月のことを述べている。"}, {"t": 1820.3, "x": "10月28日に、東京第一検察審査会が議決を出した。"}, {"t": 1824.6333333333334, "x": "検察官のした処分を\n認めない、という中身だったという。"}, {"t": 1828.2333333333333, "x": "検察審査会って、何をするところ？"}, {"t": 1830.8666666666666, "x": "くじで選ばれた一般の人が集まって、"}, {"t": 1833.25, "x": "検察官が起訴しなかった\n判断を、もう一度見るしくみだ。"}, {"t": 1836.9, "x": "法律の専門家ではない人の目で、\nその判断でよかったのかを確かめる。"}, {"t": 1841.4833333333333, "x": "それで「認めない」と出たのね。"}, {"t": 1843.6833333333334, "x": "ここは慎重に言う。これは\n委員の発言であって、政府の答弁ではない。"}, {"t": 1847.8333333333333, "x": "議決書そのものを、私は見ていない。"}, {"t": 1850.1, "x": "手に入らなかった。"}, {"t": 1851.4, "x": "実際、翌年の1986年4月21日に同じ委員が\n「検察審査会の結論は」と聞いたとき、"}, {"t": 1858.7333333333333, "x": "法務省の担当者はこう答えている。"}, {"t": 1860.9166666666667, "x": "ただいま急なお尋ねで、\n現在私つまびらかにしておりませんので、"}, {"t": 1864.9166666666667, "x": "後ほど調べまして御報告させていただきたい。"}, {"t": 1867.85, "x": "……その場では答えられなかったのね。"}, {"t": 1869.95, "x": "答えられなかった。そして、\nその後どうなったかは、国会の記録に出てこない。"}, {"t": 1874.6666666666667, "x": "だから、この回ではここで止める。"}, {"t": 1876.7333333333333, "x": "議決の中身も、そのあと起訴されたか\nどうかも、私は言わない。"}, {"t": 1880.7166666666667, "x": "はっきりしていることは一つだ。"}, {"t": 1882.6166666666666, "x": "この事故について、法廷が開かれたことは一度も無い。"}, {"t": 1886.5166666666667, "x": "では、何が変わったのか。そこは、きちんと数える。"}, {"t": 1889.8166666666666, "x": "1982年2月12日、運輸大臣から会社に厳重注意。"}, {"t": 1894.45, "x": "2月15日から19日まで、本社と\n福岡空港支店に立入検査。"}, {"t": 1899.1, "x": "2月22日から3月13日まで、\n全部の航空事業者を対象に臨時の安全総点検。"}, {"t": 1905.05, "x": "3月9日、運輸大臣が会社の社長に、抜本的な\n安全対策を作って報告するよう求めた。"}, {"t": 1911.5, "x": "立入検査の結果として、\n7項目の業務改善の勧告が出ている。"}, {"t": 1915.9, "x": "乗員の健康管理、乗員の組織、乗務の管理などだ。"}, {"t": 1919.7, "x": "ずいぶん手広いのね。"}, {"t": 1921.0666666666666, "x": "ここからが本番だ。1982年11月22日。"}, {"t": 1925.2333333333333, "x": "運輸大臣が、航空審議会に\n諮問を出している。題はこうだ。"}, {"t": 1929.0666666666666, "x": "航空機乗組員の健康管理についての改善方策如何。"}, {"t": 1932.6666666666667, "x": "医学に深く関わる話なので、部会を\n作って、医師を委員に入れた。"}, {"t": 1936.9333333333334, "x": "審議に1年余りかけて、1983年11月に答申が出る。"}, {"t": 1941.6833333333334, "x": "そして、その答申を\n受けてできたものが、この回の答えだ。"}, {"t": 1945.5333333333333, "x": "何ができたの？"}, {"t": 1946.7333333333333, "x": "財団法人、航空医学研究センター。"}, {"t": 1949.3, "x": "航空身体検査を、航空会社から\n切り離して実施するための機関だ。"}, {"t": 1953.7666666666667, "x": "1985年11月、運輸省の技術部長が\n国会でこう説明している。"}, {"t": 1958.9666666666667, "x": "これまで各会社の社内の産業医で行っていたものを、"}, {"t": 1962.2166666666667, "x": "東京地区におきましては航空医学研究センターという\n財団法人を設立いたしまして、"}, {"t": 1967.45, "x": "そこにおける中立的な目で、\n乗員の定期検査、身体検査を行う。"}, {"t": 1972.1333333333334, "x": "……会社の中の人が検査する形を、やめたのね。"}, {"t": 1975.45, "x": "やめた。1984年10月には基準の見直しの追加答申が\n出て、1985年4月から新しい基準になった。"}, {"t": 1983.65, "x": "会社の側も、健康管理の部を新しく作り、\n精神科の医師を含めて常勤の医師を増やしている。"}, {"t": 1989.6166666666666, "x": "乗員どうしのミーティングも、常に開く形にした。"}, {"t": 1993.45, "x": "最後に、報告書の一文へ戻る。"}, {"t": 1995.7666666666667, "x": "1983年5月16日、報告書が公表された。"}, {"t": 1999.8333333333333, "x": "事故から1年3か月だ。"}, {"t": 2001.7333333333333, "x": "その2日後、5月18日の衆議院運輸委員会で、\n運輸大臣が感想を述べている。"}, {"t": 2007.1, "x": "航空界としても意外中の意外だ。"}, {"t": 2009.3333333333333, "x": "事故調で研究しても、個人の責任を\n負うような人が出てこない。"}, {"t": 2013.2666666666667, "x": "全体がわけのわからぬと申しますか、"}, {"t": 2015.5833333333333, "x": "原因がはっきりしてこれだという\nふうなことのないような形で、非常に変わった事故だ。"}, {"t": 2020.5833333333333, "x": "……大臣が、わけがわからない、って。"}, {"t": 2022.8666666666666, "x": "投げやりな発言ではないと思う。"}, {"t": 2024.6666666666667, "x": "大臣はこう続けている。"}, {"t": 2026.3, "x": "そういうものに対する管理というものを\nしっかりしなければならぬ。"}, {"t": 2029.7833333333333, "x": "一層心理的に、そしてまた内部にわたって\n追跡しながらがんばっていかなければ、"}, {"t": 2034.65, "x": "むずかしい問題だ。"}, {"t": 2035.95, "x": "そして報告書の解析の最後には、こう書かれている。"}, {"t": 2039.25, "x": "関係医師の航空に対する知識が不十分であったこと。"}, {"t": 2042.6166666666666, "x": "多くの関係者の医学的知識が\n十分でなかったか、これに欠けていたこと。"}, {"t": 2047.1833333333334, "x": "関係者の判断が甘かったこと。"}, {"t": 2049.3, "x": "結果的にみて慎重さに欠ける\nところが関係者にあったこと。"}, {"t": 2053.016666666667, "x": "乗客の安全は何ものにも\nかえられないという基本的な認識が、"}, {"t": 2056.983333333333, "x": "関係者に必ずしも十分に徹底していなかったこと。"}, {"t": 2060.3333333333335, "x": "これらが重なり合って、"}, {"t": 2061.7833333333333, "x": "事故防止のために幾重にも\n設けられているチェック・ポイントが、"}, {"t": 2065.3, "x": "すべてすり抜けられてしまった、\nその最終の結果であり、"}, {"t": 2068.6833333333334, "x": "本事故は、不可抗力によるものではない。"}, {"t": 2071.35, "x": "……最初に読んだ一文ね。"}, {"t": 2072.983333333333, "x": "これを言うために、報告書は数百ページを使っている。"}, {"t": 2076.2166666666667, "x": "今日の話で私が数えたものを、\n指で折ってみてほしい。"}, {"t": 2079.633333333333, "x": "一つ。前の晩の傾きは、どこにも上がらなかった。"}, {"t": 2083.0666666666666, "x": "二つ。用紙には、その病名を書く\n欄が印刷されていなかった。"}, {"t": 2087.1, "x": "三つ。検査をする人と、雇っている\n側が、同じ場所にいた。"}, {"t": 2091.1, "x": "四つ。おかしいと思った人はいたが、\n医師までは届かなかった。"}, {"t": 2094.9666666666667, "x": "五つ。復帰の手続きは多かったが、\n中に入れる材料が違っていた。"}, {"t": 2099.366666666667, "x": "……五つとも、悪意じゃないのよね。"}, {"t": 2101.45, "x": "一つもない。全部、誰かを思ってやったことだ。"}, {"t": 2104.6666666666665, "x": "それでも、24人は帰ってこなかった。"}, {"t": 2107.35, "x": "帰ってこなかった。"}, {"t": 2108.733333333333, "x": "ねえ、一つ聞いていい。"}, {"t": 2110.2833333333333, "x": "どうぞ。"}, {"t": 2110.983333333333, "x": "この事故って、あの一言だけで覚えられてるでしょう。"}, {"t": 2114.15, "x": "覚えられている。シャツにもなったし、\n笑い話にもなった。"}, {"t": 2117.766666666667, "x": "……笑い話に。"}, {"t": 2118.9, "x": "私は今日、その言葉を一度しか出していない。"}, {"t": 2121.8, "x": "副操縦士が叫んだ、その場所で一度だけだ。"}, {"t": 2124.8, "x": "あれは面白い台詞じゃない。"}, {"t": 2126.233333333333, "x": "人を助けようとした声だ。"}, {"t": 2128.116666666667, "x": "報告書はその人について、期待することは\n不可能であった、と書いている。"}, {"t": 2132.5666666666666, "x": "出典を置いておく。報告書は\n運輸安全委員会のサイトの58-3。"}, {"t": 2136.9166666666665, "x": "国会の答弁は、\n国立国会図書館の国会会議録検索システムだ。"}, {"t": 2141.633333333333, "x": "どちらも無料で、誰でも読める。"}, {"t": 2143.65, "x": "この回で気になったところがあれば、\nコメントに書いてもらえるとうれしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
