<script>
const D={"name": "094", "file": "094_編集用", "dur": 2145.61665625, "segs": [], "subs": [{"t": 0.0, "x": "今日は、ある事故調査報告書の\n最後の一文から始める。"}, {"t": 3.55, "x": "こう書いてある。"}, {"t": 4.483333333333333, "x": "事故防止のために幾重にも\n設けられているチェック・ポイントが、"}, {"t": 8.0, "x": "すべてすり抜けられてしまった、\nその最終の結果であり、"}, {"t": 11.383333333333333, "x": "本事故は、不可抗力によるものではない。"}, {"t": 14.05, "x": "……不可抗力ではない。"}, {"t": 15.433333333333334, "x": "役所が作る文章としては、かなり強い言い方だ。"}, {"t": 18.633333333333333, "x": "防ぐしくみは、いくつもあった。\nそのどれもが働かなかった。"}, {"t": 22.416666666666668, "x": "しかたのないことではなかった、と\n国が自分で書いている。"}, {"t": 25.733333333333334, "x": "1982年、昭和57年2月9日の朝。"}, {"t": 29.65, "x": "羽田の沖で、旅客機が海に落ちた。"}, {"t": 32.11666666666667, "x": "日本航空350便。福岡発、東京行き。"}, {"t": 35.38333333333333, "x": "乗っていたのは174名。"}, {"t": 37.18333333333333, "x": "亡くなったのは24名だ。"}, {"t": 39.166666666666664, "x": "機体の故障？"}, {"t": 40.28333333333333, "x": "いや。調べた範囲で、機体に\n壊れていたところは見つかっていない。"}, {"t": 44.2, "x": "整備の落ち度も、金属の疲れも出てこなかった。"}, {"t": 47.25, "x": "それでも落ちた。"}, {"t": 48.4, "x": "じゃあ、誰かが責任を取ったの？"}, {"t": 50.56666666666667, "x": "誰も起訴されていない。"}, {"t": 51.833333333333336, "x": "機長も、会社の人も、一人もだ。"}, {"t": 54.55, "x": "……一人も。"}, {"t": 55.416666666666664, "x": "この事故は、世の中では別の言葉で覚えられている。"}, {"t": 58.583333333333336, "x": "私は今日、その言葉を主役にしない。"}, {"t": 61.083333333333336, "x": "代わりに、すり抜けられた\nチェックを一つずつ数えていく。"}, {"t": 65.0, "x": "本題の前に、この回で言わないことを決めておく。"}, {"t": 68.08333333333333, "x": "先に言うのね。"}, {"t": 69.2, "x": "この回は、扱い方を一つ間違えると、\n事故そのものより大きな害を出す。だから先に言う。"}, {"t": 75.01666666666667, "x": "一つ目。機長の名前を言わない。顔も出さない。"}, {"t": 78.0, "x": "記録には名前が残っているが、\nこの方は起訴されていない。"}, {"t": 81.5, "x": "裁判で何かが決まったわけではないんだ。"}, {"t": 83.91666666666667, "x": "だから最後まで「機長」とだけ呼ぶ。"}, {"t": 86.41666666666667, "x": "副操縦士や航空機関士は？"}, {"t": 88.51666666666667, "x": "同じだ。役職だけで呼ぶ。"}, {"t": 90.3, "x": "責める形にもしない。"}, {"t": 91.85, "x": "二つ目。病気の名前について。"}, {"t": 94.0, "x": "報告書には病名が書いてあるが、それは\n当時の呼び方で、いまは使われていない。"}, {"t": 98.78333333333333, "x": "この回では、古いほうの呼び名を一度も口に出さない。"}, {"t": 101.85, "x": "理由はあとの章で説明する。"}, {"t": 103.76666666666667, "x": "三つ目。これがいちばん大事だ。"}, {"t": 105.78333333333333, "x": "この回は、病気のある人が\n危ない、という話では、まったくない。"}, {"t": 109.98333333333333, "x": "……そこは、はっきりさせておかないとね。"}, {"t": 112.38333333333334, "x": "はっきりさせる。私が今日追いかけるのは、\n人ではなく、しくみのほうだ。"}, {"t": 116.8, "x": "四つ目。落ちたときの様子や、\nけがの状態を話さない。"}, {"t": 120.3, "x": "亡くなった24名の名前も読まない。"}, {"t": 122.51666666666667, "x": "ご遺族は今も生きておられる。"}, {"t": 124.3, "x": "五つ目。機長がいま\nどうしているかには、一切触れない。"}, {"t": 127.63333333333334, "x": "調べたが、確かな記録に行き着けなかった。"}, {"t": 130.31666666666666, "x": "分からないものは言わない。"}, {"t": 131.83333333333334, "x": "この回で使うのは、報告書と、国会の会議録だ。"}, {"t": 135.2, "x": "どちらも誰でも読める。"}, {"t": 136.7, "x": "報告書の番号は58-3。"}, {"t": 138.68333333333334, "x": "運輸安全委員会のサイトに置いてある。"}, {"t": 141.6, "x": "では、その日の飛行を追う。"}, {"t": 143.28333333333333, "x": "1982年2月9日、火曜日。"}, {"t": 146.16666666666666, "x": "日本航空350便。"}, {"t": 147.88333333333333, "x": "福岡を7時25分に出て、東京に8時55分に着く便だ。"}, {"t": 152.15, "x": "機種はDC8。登録記号はJA8061。"}, {"t": 155.73333333333332, "x": "ジャンボより前の飛行機ね。"}, {"t": 157.5, "x": "4つのエンジンを翼の下に吊った、細長い機体だ。"}, {"t": 161.0, "x": "離陸は7時34分。乗組員8名、乗客166名。"}, {"t": 165.36666666666667, "x": "合わせて174名。"}, {"t": 167.1, "x": "滑走路16から、機長の操縦で上がっている。"}, {"t": 170.08333333333334, "x": "7時51分ごろ、高度29,000フィートで巡航に入った。"}, {"t": 174.03333333333333, "x": "8時22分、大島の航法無線の西およそ45海里で、\n降下を始める。"}, {"t": 179.01666666666668, "x": "8時35分、管制から許可が出た。"}, {"t": 181.65, "x": "滑走路33Rへの計器着陸装置による進入を許可する。"}, {"t": 185.76666666666668, "x": "計器着陸装置。"}, {"t": 187.23333333333332, "x": "地上から電波を出して、正しい\n降り方の線を示す装置だ。"}, {"t": 190.96666666666667, "x": "8時39分、着陸装置を下ろした。"}, {"t": 193.6, "x": "木更津の電波標識を通過。"}, {"t": 195.61666666666667, "x": "8時42分、対気速度およそ135\nノットで高度1,000フィートを通過。"}, {"t": 200.25, "x": "この時点まで、副操縦士の読み上げに\n対する機長の応答は、手順どおりだった。"}, {"t": 205.23333333333332, "x": "じゃあ、ここまでは普通なのね。"}, {"t": 207.2, "x": "普通だ。ここから42秒だけ、時計を細かく刻む。"}, {"t": 211.46666666666667, "x": "8時43分25秒。"}, {"t": 213.41666666666666, "x": "副操縦士が「ファイブ・ハンドレッド」と読み上げた。"}, {"t": 216.58333333333334, "x": "高度500フィートだ。"}, {"t": 217.93333333333334, "x": "ここで機長は、応答しなかった。"}, {"t": 220.16666666666666, "x": "……決まりでは、返すの？"}, {"t": 221.71666666666667, "x": "返すことになっている。"}, {"t": 223.15, "x": "報告書は、この時点を区切りとして書いている。"}, {"t": 225.96666666666667, "x": "事故当日も起床直後から心身の調子は良くなかったが、"}, {"t": 229.56666666666666, "x": "事故発生の42秒前にコール・\nアウトをしなかったころから、"}, {"t": 233.28333333333333, "x": "顕著に悪くなり始めたものと思われる。"}, {"t": 235.86666666666667, "x": "42秒前。"}, {"t": 237.13333333333333, "x": "そうだ。そこから先を続ける。"}, {"t": 239.2, "x": "8時43分50秒。高度300フィート。"}, {"t": 242.25, "x": "「アプローチング・ミニマム」の読み上げに、\n機長は「チェック」と返している。"}, {"t": 246.7, "x": "ここは手順どおりだ。"}, {"t": 248.0, "x": "8時43分56秒。高度200フィートに\n達した警報音が3度鳴る。"}, {"t": 252.76666666666668, "x": "8時43分59秒。「ツー・ハンドレッド」「ミニマム」。"}, {"t": 256.6333333333333, "x": "規程では、ここで「ランディング」か\n「ゴー・アラウンド」と言わなければならない。"}, {"t": 261.23333333333335, "x": "降りるか、やり直すか。"}, {"t": 262.65, "x": "どちらかを口に出して決める場面だ。"}, {"t": 265.0833333333333, "x": "それで、機長は？"}, {"t": 266.43333333333334, "x": "報告書の言葉をそのまま読む。"}, {"t": 268.43333333333334, "x": "機長の応答は、小さく沈みがちな\n音声での「チェック」と聞こえるものであった。"}, {"t": 273.2, "x": "報告書は、この7秒前の時点についてこう書いている。"}, {"t": 276.5833333333333, "x": "機長は、幻覚妄想状態に陥り始めたものと思われる。"}, {"t": 280.95, "x": "8時44分01秒。高度164\nフィート、対気速度130ノット。"}, {"t": 286.23333333333335, "x": "ここで機長は、自動操縦を解除して手動に切り替えた。"}, {"t": 289.68333333333334, "x": "そして、二つのことを続けてやっている。"}, {"t": 292.25, "x": "操縦輪を前方へ押し込んだ。"}, {"t": 294.1, "x": "全部のエンジンのパワー・レバーを、\nフォワード・アイドルまで引き戻した。"}, {"t": 298.3, "x": "……押し込んで、力を抜いた。"}, {"t": 300.1, "x": "着陸の直前にやることではない。"}, {"t": 302.26666666666665, "x": "8時44分02秒。航空機関士が叫んでいる。"}, {"t": 305.85, "x": "「ウィ・アー・ロー」または「パウアー・ロー」と\n聞こえる、と報告書は書いている。"}, {"t": 310.48333333333335, "x": "低い、あるいは力が足りない、という意味だ。"}, {"t": 313.18333333333334, "x": "同じ秒、機長は第2エンジンと第3\nエンジンのリバース・レバーを引いた。"}, {"t": 317.53333333333336, "x": "リバース。逆向きに効かせるほうね。"}, {"t": 319.8666666666667, "x": "着陸して地面に着いたあと、止まるために使うものだ。"}, {"t": 323.28333333333336, "x": "8時44分03秒。機首を下げる舵が9度前後まで達する。"}, {"t": 327.6, "x": "副操縦士が、操縦輪を引き起こし始めた。"}, {"t": 330.6166666666667, "x": "8時44分04秒。逆噴射がきき始めた。"}, {"t": 334.1166666666667, "x": "対地接近警報装置の人工音声が\n「グライド・スロープ」と告げている。"}, {"t": 338.75, "x": "8時44分05秒。副操縦士は、機首上げ\n7度前後まで引き起こすことに成功した。"}, {"t": 344.6333333333333, "x": "だが、それ以上は動かなかった。"}, {"t": 346.7, "x": "機長を見ると、まだ両手をつっぱって\n操縦輪を押し込んでいた。"}, {"t": 350.26666666666665, "x": "そこで副操縦士は叫んでいる。"}, {"t": 352.1166666666667, "x": "キャプテン、やめて下さい。"}, {"t": 353.6333333333333, "x": "……。"}, {"t": 354.56666666666666, "x": "8時44分07秒。滑走路の進入端から510メートル手前。"}, {"t": 359.21666666666664, "x": "第14番の進入灯の西側の海面に、前脚から入った。"}, {"t": 363.31666666666666, "x": "機首下げおよそ8度、\n右へのバンクおよそ7度、降下角およそ18度。"}, {"t": 367.8333333333333, "x": "機体は進入端の360メートル手前まで進んで止まった。"}, {"t": 372.35, "x": "ここで、言葉のことを一度きちんとしておく。"}, {"t": 375.05, "x": "この事故は、世の中では\n逆噴射の一語で呼ばれることが多い。"}, {"t": 378.8, "x": "私も、そう聞いてたわ。"}, {"t": 380.6, "x": "だが報告書は、そういうまとめ方をしていない。"}, {"t": 383.45, "x": "推定原因の項を、そのまま読む。"}, {"t": 385.6666666666667, "x": "本事故の推定原因は、着陸進入中の低高度に\nおいて、その必要がないのにもかかわらず、"}, {"t": 391.46666666666664, "x": "機長が操縦輪を押し込み、"}, {"t": 393.15, "x": "かつ、全エンジンのパワー・レバーを\nフォワード・アイドル位置まで引き戻し、"}, {"t": 397.3, "x": "その後さらに、第2及び第3エンジンのリバース・\nレバーをリバース・アイドル位置まで引いた"}, {"t": 402.46666666666664, "x": "ことによるものと認められる。"}, {"t": 404.35, "x": "……三つ、あるのね。"}, {"t": 405.73333333333335, "x": "三つだ。押し込む。力を抜く。逆に効かせる。"}, {"t": 408.9166666666667, "x": "逆噴射は、そのうちの三つ目にすぎない。\nしかも、いちばん最後だ。"}, {"t": 413.1666666666667, "x": "そして推定原因には、もう一文だけ続きがある。"}, {"t": 416.35, "x": "なお、機長がかかる操作を行うに至った理由は、"}, {"t": 419.3333333333333, "x": "その精神的変調によるものと認められる。"}, {"t": 422.26666666666665, "x": "……それで、全部なの？"}, {"t": 423.75, "x": "報告書が「原因」として書いたのは、この2文だけだ。"}, {"t": 427.3333333333333, "x": "残りの数百ページは、そこに\n至るまでの話に使われている。"}, {"t": 431.15, "x": "なぜこの人が、その席に座れてしまったのか。"}, {"t": 434.18333333333334, "x": "報告書がいちばん力を入れて\n調べたのは、そちらのほうなんだ。"}, {"t": 438.6333333333333, "x": "被害を数字で置く。報告書の数え方で言う。"}, {"t": 441.46666666666664, "x": "搭乗者は174名。乗組員8名と乗客166名。"}, {"t": 445.96666666666664, "x": "亡くなったのは24名。全員が乗客だ。"}, {"t": 448.8666666666667, "x": "重傷が95名。乗組員8名と、乗客87名。"}, {"t": 453.15, "x": "乗務員は、8人とも重傷なのね。"}, {"t": 455.71666666666664, "x": "全員だ。軽傷は54名で、こちらは全員が乗客。"}, {"t": 459.3333333333333, "x": "ここで、数字のことわりを一つ入れておく。"}, {"t": 462.03333333333336, "x": "ことわり？"}, {"t": 462.8333333333333, "x": "事故の直後に国会で報告された\n数字と、報告書の数字は違う。"}, {"t": 467.1, "x": "事故から2週間後、航空局長は\n重傷76名、軽傷66名と報告している。"}, {"t": 472.8666666666667, "x": "同じ日の運輸大臣は「150名に上る」と言っている。"}, {"t": 476.46666666666664, "x": "3年後の委員会では、ある委員が「\n142名の方が重傷を負われる」と述べている。"}, {"t": 481.8333333333333, "x": "……ばらばらじゃない。"}, {"t": 482.93333333333334, "x": "調べが進むにつれて、数え方も数字も動いた。"}, {"t": 486.1, "x": "だからこの回では、報告書の95名と54名を使う。"}, {"t": 489.96666666666664, "x": "ただし、亡くなった方の数だけは違う。"}, {"t": 492.6333333333333, "x": "違うって？"}, {"t": 493.56666666666666, "x": "24名。これは、事故の2週間後も、1年後も、\n3年後も、報告書も、全部一致している。"}, {"t": 500.1, "x": "ここだけは一度も動いていない。"}, {"t": 501.95, "x": "もう一つ、報告書が書いていることがある。"}, {"t": 504.5833333333333, "x": "機体は大破したが、火災は発生しなかった。"}, {"t": 507.46666666666664, "x": "だから、助かった方が多かった。\nそれでも24名は帰ってこなかった。"}, {"t": 512.65, "x": "この事故には、もう一つ大きな特徴がある。"}, {"t": 515.4, "x": "機体が、ほとんどそのまま手元に残ったことだ。"}, {"t": 518.5666666666667, "x": "海に落ちたのに？"}, {"t": 519.8, "x": "落ちたのが空港のすぐ前で、水が\n浅かった。だから引き上げられた。"}, {"t": 523.9333333333333, "x": "作業は翌日、2月10日の早朝から始まっている。"}, {"t": 527.35, "x": "14日までに、機体の大部分と\nエンジンの引き上げが終わった。"}, {"t": 531.0333333333333, "x": "残った主翼の部分は、\n23日の朝までに引き上げている。"}, {"t": 534.85, "x": "24日の早朝、格納庫の中に入れ終わった。"}, {"t": 537.9, "x": "そして滑走路は、2月14日の午前9時に再開している。"}, {"t": 541.8333333333334, "x": "5日で戻したのね。"}, {"t": 543.35, "x": "深い海や山に落ちた事故だと、こうはいかない。"}, {"t": 546.15, "x": "調べる物が残っていないから、\n推測でしか語れなくなる。"}, {"t": 549.8166666666667, "x": "この事故は、物が全部そろっていた。だから\n機体に異常が無いと言い切れた。"}, {"t": 554.2, "x": "調べる側の体制も見ておく。"}, {"t": 556.1, "x": "事故調査委員会が第一報を受けたのは、\n当日の8時50分ごろ。警視庁からだ。"}, {"t": 561.3166666666667, "x": "その5分後に、運輸大臣からも通報が入っている。"}, {"t": 564.5166666666667, "x": "付いた調査官は、主管の1名と、あわせて17名。"}, {"t": 568.2, "x": "18人。"}, {"t": 569.2, "x": "そのうち4名は、航空自衛隊の航空医学の専門の医官が\n併任で入っている。"}, {"t": 574.2166666666667, "x": "……お医者さんが、事故調査に。"}, {"t": 576.1, "x": "この事故の性格を考えれば、当然の人選だ。"}, {"t": 579.2, "x": "専門委員も4名いた。"}, {"t": 580.6333333333333, "x": "東京大学の医学部の教授と工学部の教授。"}, {"t": 583.6666666666666, "x": "そして、科学技術庁の航空宇宙技術研究所から2名だ。"}, {"t": 587.6, "x": "部会は二つに分かれた。"}, {"t": 589.05, "x": "飛行の経過を調べる部会と、残がいを調べる部会。"}, {"t": 592.3666666666667, "x": "飛行機を作った国であるアメリカにも、\n事故の発生は連絡されている。"}, {"t": 596.5666666666667, "x": "ただし報告書には、その代表等による\n調査への参加はなかった、と書いてある。"}, {"t": 601.4833333333333, "x": "……来なかったのね。"}, {"t": 602.6833333333333, "x": "機体に問題が無いと早い段階で分かったからだろう、と\n私は思う。ただし、書かれてはいない。"}, {"t": 608.3333333333334, "x": "聴聞会は1982年12月22日。"}, {"t": 611.6333333333333, "x": "運輸省の10階の大会議室で、\n朝10時から夕方4時45分まで開かれた。"}, {"t": 616.8833333333333, "x": "そして1983年3月22日から26日まで、原因に\n関係する人たちから意見を聴いている。"}, {"t": 624.05, "x": "副操縦士、航空機関士、運航本部長、路線室長。"}, {"t": 627.9833333333333, "x": "そして、健康管理室の常勤の内科医師と、\n非常勤の精神神経科の医師だ。"}, {"t": 633.7, "x": "ここから、時計を24時間巻き戻す。"}, {"t": 636.45, "x": "前の日？"}, {"t": 637.2666666666667, "x": "この事故は、前の晩にすでに一度起きかけている。"}, {"t": 640.2166666666667, "x": "2月8日、月曜日。東京を\n20時に出て福岡へ向かう便だ。"}, {"t": 644.1166666666667, "x": "同じ機長が乗っている。"}, {"t": 645.65, "x": "出発の10分ほど前、機長は\n操縦室での打ち合わせを短く切り上げている。"}, {"t": 650.3666666666667, "x": "気分が悪くなり、吐き気がしたためだと、\n本人がのちに述べている。"}, {"t": 654.5833333333334, "x": "まわりは気づかなかったの？"}, {"t": 656.2833333333333, "x": "副操縦士も航空機関士も、不調を\n感じさせるものはなかったと述べている。"}, {"t": 660.8666666666667, "x": "20時11分ごろ。管制から\n「滑走路に進入して待機せよ」と指示が来た。"}, {"t": 665.9, "x": "待て、という指示だ。"}, {"t": 667.1, "x": "離陸の許可はまだ出ていない。"}, {"t": 668.8666666666667, "x": "ところが機長は「管制許可はきているね」と\n言いながら、パワー・レバーを操作しかけた。"}, {"t": 674.15, "x": "……許可が出てないのに？"}, {"t": 675.5333333333333, "x": "副操縦士と航空機関士が、これを中止させている。"}, {"t": 678.85, "x": "20時13分に離陸。その5分後だ。"}, {"t": 681.5, "x": "船橋の沖合、東京湾の上空で右へ上昇旋回している\n最中に、傾きが異常に大きくなった。"}, {"t": 687.7333333333333, "x": "最大で70度前後。ふつうの旋回は、\n大きくても30度と言われている。"}, {"t": 692.4666666666667, "x": "70度って、ほとんど横向きじゃない。"}, {"t": 694.9166666666666, "x": "機体は内側へすべって、急降下した。"}, {"t": 697.45, "x": "記録には、15秒間に6,800フィートから\n6,000フィートまで下がったと残っている。"}, {"t": 702.75, "x": "対気速度は最大311ノット。"}, {"t": 705.1333333333333, "x": "副操縦士がすぐ操縦輪を握って直した。"}, {"t": 708.0, "x": "直後、副操縦士は声をかけている。"}, {"t": 710.2666666666667, "x": "キャプテン、大丈夫ですか。"}, {"t": 712.0166666666667, "x": "機長は落ち着いた態度で、大丈夫です、と答えた。"}, {"t": 715.3833333333333, "x": "……落ち着いてたのね。"}, {"t": 716.6666666666666, "x": "21時58分に福岡に着陸した。"}, {"t": 719.5833333333334, "x": "降りるとき、副操縦士は機長から\n「お見事」と言われている。"}, {"t": 724.0, "x": "ここが、すり抜けられたチェックの一つ目だ。"}, {"t": 726.6833333333333, "x": "前の晩の異常な旋回は、福岡でも\n東京でも、どこにも報告されなかった。"}, {"t": 731.6666666666666, "x": "誰も上げなかったの？"}, {"t": 733.1333333333333, "x": "副操縦士がどう受け止めたかは、\n会社の専務が国会で説明している。"}, {"t": 737.4833333333333, "x": "そのまま引く。"}, {"t": 738.5, "x": "自分はとっさに修正のかじをした、"}, {"t": 740.6666666666666, "x": "まあこれは一種の機長のポカという程度に\n思いました、というような表現でありまして、"}, {"t": 745.4166666666666, "x": "非常に異常だと考えたら会社に\n報告をしただろうと思うのですけれども、"}, {"t": 749.6666666666666, "x": "その辺が、その程度と本人が\n思わなかったのではないか。"}, {"t": 753.4333333333333, "x": "うっかりミス、くらいに思ったのね。"}, {"t": 755.6666666666666, "x": "客室乗務員は5名乗っていた。"}, {"t": 757.95, "x": "そのうち1名は、自分の経験から見て、今まで\n経験したことがない深い傾斜だったと言っている。"}, {"t": 763.8833333333333, "x": "残りの4名は、特に異常という\n記憶がない、と言っている。"}, {"t": 767.5, "x": "……5人のうち1人だけ。"}, {"t": 769.1166666666667, "x": "翌朝、機内の点検をしているとき、\n航空機関士が副操縦士に聞いている。"}, {"t": 773.9166666666666, "x": "あの傾きは、どのくらいだったのか。"}, {"t": 776.2333333333333, "x": "副操縦士はこう答えた。ほっておけば\n90度位まで行ったかも知れない。"}, {"t": 780.5, "x": "……その会話が、事故の朝にあったのね。"}, {"t": 782.9666666666667, "x": "あった。ただし、ここで副操縦士を責めるのは違う。"}, {"t": 786.2, "x": "報告書自身が、こう書いている。"}, {"t": 788.3, "x": "事故前日の異常旋回について福岡で\n関係者に報告がなされていたならば、"}, {"t": 793.0, "x": "ただし、当時の諸事情を考えるならば、これを\n期待することは無理であったと思われる。"}, {"t": 797.9833333333333, "x": "報告しなかったことを責めてはいない。"}, {"t": 800.0333333333333, "x": "無理だった、と書いている。"}, {"t": 802.3166666666667, "x": "事故の当日の朝に戻る。ここも報告書に書かれている。"}, {"t": 805.85, "x": "機長が起きたのは、5時から5時35分ごろだ。"}, {"t": 808.9333333333333, "x": "そして起床の直後に、実の母親へ電話をしている。"}, {"t": 812.3833333333333, "x": "……お母さんに？"}, {"t": 813.35, "x": "報告書は、機長がこう訴えたと\n述べている、という書き方をしている。"}, {"t": 817.4833333333333, "x": "どうも最近、自分の周囲に変なことが\n起っている。仕事をやめたい。"}, {"t": 821.75, "x": "……仕事をやめたい。"}, {"t": 822.9333333333333, "x": "事故の3時間半前だ。"}, {"t": 824.6, "x": "6時20分ごろ、福岡空港に着いた。"}, {"t": 827.35, "x": "駐機場へ歩いていく途中、気持ちが悪くなって\n吐き気を感じたと、本人が述べている。"}, {"t": 832.5, "x": "前の晩も、出発前の打ち合わせのときに\n同じことが起きている。"}, {"t": 836.5333333333333, "x": "二晩続けてね。"}, {"t": 837.9666666666667, "x": "報告書は、当日についてこうまとめている。"}, {"t": 840.7, "x": "事故当日も、起床直後から、\nその心身の調子は良くなかった。"}, {"t": 844.8833333333333, "x": "そして7時34分、機長の操縦で離陸した。"}, {"t": 848.3333333333334, "x": "……その電話のことは、誰かに伝わったの？"}, {"t": 850.9833333333333, "x": "伝わっていない。"}, {"t": 852.0333333333333, "x": "母親は、息子からの電話を受けただけだ。"}, {"t": 854.7333333333333, "x": "会社に連絡する道があったわけでもない。"}, {"t": 857.2166666666667, "x": "ここも、すり抜けたチェックの一つとして数えられる。"}, {"t": 860.3666666666667, "x": "ただし、責める話ではまったくない。"}, {"t": 862.65, "x": "家族に「変なことが起きている」と言われて、"}, {"t": 865.4333333333333, "x": "それを勤め先に知らせるという発想が\n出てくる人は、そう多くないはずだ。"}, {"t": 869.8166666666667, "x": "ことわっておくが、この電話のことは、\n事故のあとに機長本人が述べたこととして"}, {"t": 874.6666666666666, "x": "報告書に書かれている。その場で\n誰かが聞いていた記録ではない。"}, {"t": 879.05, "x": "時計を事故のあとへ戻す。"}, {"t": 880.6833333333333, "x": "1982年2月19日。"}, {"t": 883.0333333333333, "x": "事故から10日目だ。"}, {"t": 884.4, "x": "事故調査委員会の事務局長が、そのときまでに\n分かった事実を運輸大臣に報告した。"}, {"t": 889.7833333333333, "x": "その中身を、2月23日に国会で説明している。"}, {"t": 893.5166666666667, "x": "まだ2週間もたってないのに。"}, {"t": 895.4666666666667, "x": "この説明が、この事故の言葉が世の中に出た最初だ。"}, {"t": 898.9333333333333, "x": "事務局長はまず、前の晩の飛行について述べている。"}, {"t": 902.1833333333333, "x": "羽田を離陸して4分ほどのところで、通常なら\nきわめてスムーズな上昇旋回を行うべきところ、"}, {"t": 907.95, "x": "10秒間に1,100フィートという、\n通常の下降の倍以上の速さで急激な降下を行った。"}, {"t": 913.45, "x": "……あら、さっきの数字と違う。"}, {"t": 915.4, "x": "この時点は粗い解析だ。"}, {"t": 916.95, "x": "最終の報告書では15秒間に800フィートになっている。"}, {"t": 920.65, "x": "調べが進むと数字は動く。そういうものだ。"}, {"t": 923.45, "x": "そして事務局長は、\nボイスレコーダーのことを話している。"}, {"t": 926.7833333333333, "x": "解析が終わっていたのは、\n最後の2秒から3秒だけだった。"}, {"t": 930.4833333333333, "x": "そこにあったのは、対地接近警報装置の人工音声だ。"}, {"t": 934.1, "x": "グライド・スロープ、という\n言葉が2度繰り返されている。"}, {"t": 937.4, "x": "その2度目の終わりのほうに、別の声が重なっていた。"}, {"t": 940.7166666666667, "x": "……副操縦士の。"}, {"t": 941.95, "x": "そうだ。そして、その直後に短い\n衝撃音で記録が終わっている。"}, {"t": 946.1, "x": "この一言だけが、そのあと\n44年、独り歩きすることになる。"}, {"t": 950.3333333333334, "x": "事務局長は、最後にこう言っている。"}, {"t": 952.6166666666667, "x": "今後の調査では、もっと広い\n分野にわたる事実を集めて、"}, {"t": 956.1833333333333, "x": "一切の予断を入れず、その上に\n立って真の事故原因をきわめたい。"}, {"t": 960.65, "x": "ここからが、この回の山だ。"}, {"t": 962.55, "x": "定期便の操縦士は、6か月ごとに\n体の検査を受けなければならない。"}, {"t": 966.9, "x": "航空法の第31条と第33条で決まっている。"}, {"t": 970.4166666666666, "x": "これに通らないと、飛べない。"}, {"t": 972.3, "x": "半年に一度ね。"}, {"t": 973.65, "x": "合格の基準は、\n航空法の施行規則の別表に書いてある。"}, {"t": 977.4333333333333, "x": "その総合の欄には、こうある。"}, {"t": 979.3333333333334, "x": "航空業務に支障をきたす\nおそれのある心身の欠陥がないこと。"}, {"t": 983.0833333333334, "x": "さらに航空法の第71条は、\n基準に合わなくなったときは、"}, {"t": 987.0166666666667, "x": "紙の有効期間の中であっても、航空業務を\n行ってはならないと定めている。"}, {"t": 991.8, "x": "紙が残ってても、だめになるのね。"}, {"t": 994.2166666666667, "x": "そうだ。しくみとしては、ちゃんとできている。"}, {"t": 996.85, "x": "検査のやり方を書いたマニュアルもある。"}, {"t": 998.8666666666667, "x": "1970年、昭和45年9月に運輸省が作ったものだ。"}, {"t": 1003.4333333333333, "x": "その「精神及び神経系」の項には、\n不合格になる病気が具体的に並んでいる。"}, {"t": 1008.7666666666667, "x": "そしてそこには、この事故で報告書が\n書いた病名も、はっきり載っている。"}, {"t": 1013.2833333333333, "x": "……載ってたの？"}, {"t": 1014.25, "x": "載っていた。マニュアルの注意書きには、\nこうも書いてある。"}, {"t": 1017.4166666666666, "x": "過去の病歴、遺伝の歴、生活の歴、\n日常の行動についての客観的な資料を、"}, {"t": 1022.8166666666667, "x": "できるだけ集めて、検討されなければならない。"}, {"t": 1025.6666666666667, "x": "紙の上では、これ以上ないほど整っている。"}, {"t": 1028.3666666666666, "x": "問題は、この機長がその検査に合格していたことだ。"}, {"t": 1032.4333333333334, "x": "なぜ合格したのか。報告書は、そこを分解している。"}, {"t": 1035.95, "x": "まず、検査を受けるときに出す申請書だ。"}, {"t": 1038.55, "x": "既往症の欄がある。過去にかかった\n病気を書くところだな。"}, {"t": 1041.9833333333333, "x": "そこには「めまい」「不眠症」「神経症」といった\n項目が並んでいて、丸を付けることになっている。"}, {"t": 1048.1333333333334, "x": "それで？"}, {"t": 1048.8666666666666, "x": "報告書の原文を読む。"}, {"t": 1050.4666666666667, "x": "「心身症」「抑うつ状態」\n「自律神経失調症」などの項目はない。"}, {"t": 1055.1333333333334, "x": "……無いの？"}, {"t": 1055.85, "x": "無い。この3つは、まさに\nこの機長が診断されていた名前だ。"}, {"t": 1059.65, "x": "報告書はこう続ける。"}, {"t": 1061.1666666666667, "x": "法令上明定されてはいないが、いずれの欄についても\n申請者による正直な記入が期待されている。"}, {"t": 1066.95, "x": "機長の最近の申請書中、上記の\nいずれの欄も無記入となっている。"}, {"t": 1071.2333333333333, "x": "書く欄が無いんだから、書きようがないわね。"}, {"t": 1073.9, "x": "そういう作りだった。"}, {"t": 1075.2166666666667, "x": "そして、医師が記入する側にも欄がある。"}, {"t": 1077.6166666666666, "x": "「精神神経系」という項目だ。"}, {"t": 1079.9166666666667, "x": "機長の申請書では、そこが「異常なし」となっている。"}, {"t": 1083.4, "x": "報告書の言葉で言えば、\n機長は合格と判定されている。"}, {"t": 1086.9333333333334, "x": "ここが、すり抜けられたチェックの二つ目だ。"}, {"t": 1089.5666666666666, "x": "紙は正しく回っていた。ただ、\nその紙には、書く場所が無かった。"}, {"t": 1094.4333333333334, "x": "では、その「異常なし」と\n書いた医師は、誰だったのか。"}, {"t": 1098.1, "x": "国の指定を受けたお医者さんよね。"}, {"t": 1100.2333333333333, "x": "そうだ。国が指定した\n航空身体検査医。ここは間違いない。"}, {"t": 1104.0666666666666, "x": "ただし、報告書はこう書いている。そのまま読む。"}, {"t": 1107.05, "x": "機長は、運航乗務員健康管理室の\n常勤内科医師であり、"}, {"t": 1110.8166666666666, "x": "同時に航空身体検査指定機関である\n大学附属病院に所属する"}, {"t": 1115.1666666666667, "x": "指定航空身体検査医でもある同医師から、"}, {"t": 1117.7833333333333, "x": "継続して航空身体検査証明の交付を受けていた。"}, {"t": 1121.1833333333334, "x": "……会社の中のお医者さんが、\n国の検査もしてたってこと？"}, {"t": 1124.7166666666667, "x": "同じ人だ。"}, {"t": 1125.7, "x": "日ごろ社員として乗員を診ている医師が、\n同時に、国の資格で合否を判定していた。"}, {"t": 1130.75, "x": "この形について、会社の専務が国会で説明している。"}, {"t": 1134.3666666666666, "x": "航空法によるところの身体検査を行い、同時に、\nその人が会社の産業医ということでもある。"}, {"t": 1140.2666666666667, "x": "そういうことでありまして、15年間、\n同じ仕事を続けていただきました。"}, {"t": 1144.8833333333334, "x": "15年。"}, {"t": 1145.7166666666667, "x": "当時、それは珍しい形ではなかった。"}, {"t": 1148.1666666666667, "x": "責める言い方をしたいのではない。"}, {"t": 1150.0333333333333, "x": "ただ、飛べなくなるかどうかを決める\n人と、その人を雇っている側が、"}, {"t": 1154.2666666666667, "x": "同じ場所にいる形ではあった。"}, {"t": 1156.15, "x": "これが、すり抜けられたチェックの三つ目だ。"}, {"t": 1158.7333333333333, "x": "そして、この形は事故のあとに\n変えられる。そこは終わりのほうで話す。"}, {"t": 1163.5666666666666, "x": "ここで、この事故のいちばん難しいところに入る。"}, {"t": 1166.5333333333333, "x": "この機長には、病名が二つある。"}, {"t": 1168.8666666666666, "x": "二つ？"}, {"t": 1169.65, "x": "会社と、診ていた医師が\n一貫して言っていた名前が一つ。"}, {"t": 1173.1333333333334, "x": "報告書が事故のあとに認定した名前が、もう一つだ。"}, {"t": 1176.5833333333333, "x": "会社の専務は、国会でこう述べている。"}, {"t": 1179.0166666666667, "x": "担当医師は一貫して心身症ということである。"}, {"t": 1181.8333333333333, "x": "投薬のときの名前も、うつ病、うつ状態、\n抑うつ状態、心身症、自律神経失調症。"}, {"t": 1187.9833333333333, "x": "報告書は、この5つを並べて書いている。"}, {"t": 1190.7333333333333, "x": "それが、事故のあとで変わったのね。"}, {"t": 1193.0166666666667, "x": "報告書の認定は違った。\nそして発病の時期も、ずっと前だとしている。"}, {"t": 1197.6833333333334, "x": "報告書は、発病は1976年、\n昭和51年の秋ごろと書いている。"}, {"t": 1203.0666666666666, "x": "……事故の6年前。"}, {"t": 1204.4, "x": "ただし、なぜ発病したのかは\n判然としない、と正直に書いてある。"}, {"t": 1208.5333333333333, "x": "そして、こう続ける。"}, {"t": 1210.0, "x": "機長は1981年10月から\n11月にかけて、関係医師により、"}, {"t": 1214.8666666666666, "x": "経過も順調で、キャプテン乗務に\n耐え得る程に回復したと診断された。"}, {"t": 1219.2166666666667, "x": "しかしながら、機長の病は継続的な\n経過をたどっていたものと認められる。"}, {"t": 1223.95, "x": "治ったと診断されたけど、続いていた。"}, {"t": 1226.6333333333334, "x": "報告書は、見抜けなかった\n理由の一つとして、こうも書いている。"}, {"t": 1230.5666666666666, "x": "関係医師が、似た症状の心身症等であると\n判断してしまったこと。"}, {"t": 1234.85, "x": "ここが、この事故の芯だ。"}, {"t": 1236.45, "x": "誰かが嘘をついたのではない。"}, {"t": 1238.1, "x": "判断が届かなかった。"}, {"t": 1240.3833333333334, "x": "ここで、第2章で先送りにしたことを話す。"}, {"t": 1243.4333333333334, "x": "病気の名前ね。"}, {"t": 1244.7166666666667, "x": "報告書が認定した病名は、1983年当時の呼び方だ。"}, {"t": 1249.3166666666666, "x": "その呼び名は、2002年に変えられている。"}, {"t": 1251.85, "x": "いまは統合失調症という名前になっている。"}, {"t": 1254.5833333333333, "x": "……名前を変えたの？"}, {"t": 1255.7666666666667, "x": "変えた。古いほうの呼び名に、人を\n遠ざける響きが付いてしまったからだ。"}, {"t": 1260.15, "x": "名前のせいで、診てもらうことをためらう\n人が出ていた。"}, {"t": 1263.3, "x": "だから私は、この回で古いほうの呼び名を\n一度も口に出さない。"}, {"t": 1267.15, "x": "報告書を引くときも、そこだけは飛ばす。"}, {"t": 1269.9166666666667, "x": "資料に書いてあっても？"}, {"t": 1271.4166666666667, "x": "書いてある。だが、いま口に出す必要が無い。"}, {"t": 1274.3, "x": "そのうえで、この回でいちばん大事なことを言う。"}, {"t": 1276.9666666666667, "x": "病気があることと、人に害を\n与えることは、別のことだ。"}, {"t": 1280.6166666666666, "x": "この回は、病気のある人が\n危ないという話では、まったくない。"}, {"t": 1284.6333333333334, "x": "……じゃあ、何の話なの？"}, {"t": 1286.3333333333333, "x": "174名を預かる席に座る人の体と\n心を、会社と国がどう見るか。"}, {"t": 1291.3333333333333, "x": "調子がよくないときに、本人が\n言い出せる場所があるか。"}, {"t": 1294.5666666666666, "x": "周りが気づいたときに、それを上げられる道があるか。"}, {"t": 1297.5833333333333, "x": "足りなかったのは、そこだ。"}, {"t": 1299.3166666666666, "x": "報告書も、まさにそこを調べている。"}, {"t": 1301.5666666666666, "x": "人ではなく、道のほうをな。"}, {"t": 1304.1333333333334, "x": "報告書の中で、私がいちばん\n長く読み返した一文がある。"}, {"t": 1308.05, "x": "そのまま引く。"}, {"t": 1309.05, "x": "なお、機長の心身の状況がおかしいと\n思った者は、少なくない筈である。"}, {"t": 1313.75, "x": "……いたのね。"}, {"t": 1314.6, "x": "いた。誰も気づかなかったのではない。"}, {"t": 1316.8666666666666, "x": "報告書は、そのあとにこう続ける。"}, {"t": 1319.15, "x": "機長が病にかかっていて、"}, {"t": 1320.8666666666666, "x": "航空機を墜落せしめるような行為をする程に\nその状況が悪化していたと考えた者は、"}, {"t": 1325.9833333333333, "x": "いなかったもののように思える。"}, {"t": 1327.85, "x": "……そこまでは、思わなかったのね。"}, {"t": 1330.0, "x": "思わない。ふつうは思わない。"}, {"t": 1331.75, "x": "これは、この事故に限った話ではないと思う。"}, {"t": 1334.6166666666666, "x": "職場で誰かの様子がおかしいとき、\nたいていの人は「疲れているんだろう」で止める。"}, {"t": 1339.5333333333333, "x": "そこから先を考えるのは、よほどのことだ。"}, {"t": 1342.3, "x": "国のほうも、あとで同じことを言っている。"}, {"t": 1344.75, "x": "1985年8月20日、運輸省の航空局長の答弁だ。"}, {"t": 1349.3666666666666, "x": "未然の防止ができなかったことについては、"}, {"t": 1351.85, "x": "日本航空の中の、職員相互の、都合の悪いことは\n見過ごすというのか見逃すというのか、"}, {"t": 1357.35, "x": "そういうことが大きな原因だったと考えている。"}, {"t": 1360.1166666666666, "x": "そして、仲間同士のかばい合いというようなことも、"}, {"t": 1363.0666666666666, "x": "安全意識が高まればそれは\n克服されていく、と続けている。"}, {"t": 1367.4833333333333, "x": "報告書は、なぜ情報が医師まで\n届かなかったのかを、立場ごとに書き出している。"}, {"t": 1372.3333333333333, "x": "ここは丁寧に読む。責めるためではなく、\n同じことを繰り返さないためだ。"}, {"t": 1376.6666666666667, "x": "まず、機長の夫人。"}, {"t": 1378.05, "x": "乗務ができなくなることの懸念。"}, {"t": 1379.85, "x": "身内の不幸を隠して置きたいという願望。"}, {"t": 1382.4833333333333, "x": "……家族だものね。"}, {"t": 1383.6833333333334, "x": "次に、友人。"}, {"t": 1384.8333333333333, "x": "機長の不利になるようなことは\n考えたくない、言いたくないという願望。"}, {"t": 1388.75, "x": "次に、同僚。"}, {"t": 1389.9, "x": "奇妙な言動を見聞しても、一時的な\n事象と受け取ってしまった。"}, {"t": 1394.0, "x": "そして、上司だ。ここがいちばん長い。"}, {"t": 1396.5, "x": "ある程度良くないことは知っていたが、\n正常であることを示す情報も入手していた。"}, {"t": 1401.2333333333333, "x": "医師に全部伝えなくても正確な診断ができると考えた。"}, {"t": 1404.8166666666666, "x": "機長の人権やプライバシーに配慮し過ぎた。"}, {"t": 1407.6, "x": "……配慮しすぎた。"}, {"t": 1408.8166666666666, "x": "報告書は、そう書いている。"}, {"t": 1410.6333333333334, "x": "そして最後に、こうある。"}, {"t": 1412.2166666666667, "x": "まさか乗機を墜落させるような操作をする\n運航乗務員が部下にいるとは、思いもよらなかった。"}, {"t": 1417.7, "x": "報告書は、この四者のほかに、\n医師の側の理由も二つ挙げている。"}, {"t": 1421.7666666666667, "x": "関係医師が、機長の変調を示す事実を見て\n取り、聞き出すことに成功しなかったこと。"}, {"t": 1427.1833333333334, "x": "そして、似た症状の心身症等であると\n判断してしまったこと。"}, {"t": 1431.2833333333333, "x": "……六つとも、悪意じゃないのね。"}, {"t": 1433.2833333333333, "x": "一つも無い。全部、誰かを\n思ってのことだ。それでもすり抜けた。"}, {"t": 1438.0166666666667, "x": "ここで、誤解されやすいところを一つ潰しておく。"}, {"t": 1441.15, "x": "どこ？"}, {"t": 1441.8, "x": "機長を乗務に戻したときの決め方が、いい\nかげんだったのではないか。"}, {"t": 1445.8333333333333, "x": "そう思う人がいるだろうが、\n報告書はそう書いていない。"}, {"t": 1449.0333333333333, "x": "そのまま読む。"}, {"t": 1450.0, "x": "1981年11月の機長のキャプテン乗務復帰の決定に\n際しては、"}, {"t": 1455.0, "x": "関係医師から3回意見書を求め、\nライン・モニタを実施し、"}, {"t": 1458.7666666666667, "x": "本来の付議事項でないにも\nかかわらず運航乗務員査定委員会に\n報告した上で決定するという、"}, {"t": 1464.3166666666666, "x": "慎重な手続が取られている。"}, {"t": 1466.3666666666666, "x": "……3回も意見書を取ってるのね。"}, {"t": 1468.4, "x": "ライン・モニタというのは、実際の便に\n医師などが同乗して様子を見ることだ。"}, {"t": 1472.9166666666667, "x": "本来なら報告しなくてもいい\n委員会にまで、わざわざ報告している。"}, {"t": 1477.0, "x": "手続きの数でいえば、多いほうだ。"}, {"t": 1479.1333333333334, "x": "ただし報告書は、そのあとにこう続ける。"}, {"t": 1481.7833333333333, "x": "しかしながら、その決定の基礎資料とされた\n機長の心身の状況に関する関係医師の意見は、"}, {"t": 1487.5, "x": "結果からみて適確でなかったものと認められる。"}, {"t": 1490.6, "x": "手続きは踏んだけど、その中身が。"}, {"t": 1493.0333333333333, "x": "そうだ。ここが厄介なところでな。"}, {"t": 1495.2, "x": "手続きを増やしても、そこに入る中身が\n違っていれば、結論は変わらない。"}, {"t": 1499.7666666666667, "x": "会社は国内線から戻すという配慮もしている。"}, {"t": 1502.5333333333333, "x": "国際線は負担が重いからだ。"}, {"t": 1504.6166666666666, "x": "飛行時間も、比較的少ないところから始めている。"}, {"t": 1508.05, "x": "それでも、事故は起きた。"}, {"t": 1510.3333333333333, "x": "もう一つ、潰しておくことがある。"}, {"t": 1512.5, "x": "あの6秒のあいだに、副操縦士は\n止められなかったのか、という問いだ。"}, {"t": 1516.8333333333333, "x": "……引き起こしては、いたのよね。"}, {"t": 1518.7833333333333, "x": "引き起こしている。7度まで\n戻した。だがそれ以上は動かなかった。"}, {"t": 1522.85, "x": "報告書は、この点についてはっきり書いている。読む。"}, {"t": 1526.1166666666666, "x": "機長が同機を墜落せしめるに至らしめた\n三つの操作を行った後であっても、"}, {"t": 1530.7333333333333, "x": "着陸復行に準じた緊急操作がなされていたならば、"}, {"t": 1534.1166666666666, "x": "同機はその性能上、墜落しなかった可能性があるが、"}, {"t": 1537.5166666666667, "x": "当時の諸事情を考えるならば、かかる操作をすることを"}, {"t": 1540.85, "x": "副操縦士や航空機関士に期待することは\n不可能であったものと認められる。"}, {"t": 1545.5166666666667, "x": "……不可能、って書いてあるのね。"}, {"t": 1547.3333333333333, "x": "可能性はあった。だが期待するのは無理だった。"}, {"t": 1550.0, "x": "両方を書いている。"}, {"t": 1551.2, "x": "着陸復行というのは、降りるのを\nやめて上昇し直すことだ。"}, {"t": 1554.8833333333334, "x": "それを、隣の席の人間が、6秒のうちに独断でやる。"}, {"t": 1558.6333333333334, "x": "機長が両手で操縦輪を押し込んでいる、その横でだ。"}, {"t": 1561.95, "x": "……そんなこと、考えられないわ。"}, {"t": 1564.0, "x": "報告書も、考えられないと書いている。"}, {"t": 1566.4666666666667, "x": "私はこの一文を、報告書の良心だと思っている。"}, {"t": 1569.8166666666666, "x": "生き残った人を責めない、という\n線を、はっきり引いてある。"}, {"t": 1573.8666666666666, "x": "この事故について、当時から\nずっと言われてきた見方がある。"}, {"t": 1577.3833333333334, "x": "……あれは、わざとだったんじゃないか、っていう。"}, {"t": 1579.8666666666666, "x": "それだ。この点について、報告書は\n自分のほうから否定している。"}, {"t": 1583.8666666666666, "x": "これは珍しいことだ。ふつう報告書は、\n言われていない説をわざわざ潰さない。"}, {"t": 1588.5, "x": "原文を読む。"}, {"t": 1589.45, "x": "なお、この機長の操作が滑走路に\n接地したときのものと考えることには無理がある。"}, {"t": 1594.35, "x": "また、その原因を正常人が容易に理解し得るような"}, {"t": 1597.65, "x": "自殺企図と同種のものと\n考えることはできないであろう。"}, {"t": 1601.05, "x": "……自殺とは違う、と。"}, {"t": 1602.6166666666666, "x": "そう書いてある。"}, {"t": 1603.5666666666666, "x": "前半のほうも大事だ。"}, {"t": 1604.9333333333334, "x": "地面に着いたと勘違いして止める\n操作をした、という見方も否定している。"}, {"t": 1609.5, "x": "高度164フィート。およそ50メートルだ。"}, {"t": 1612.3, "x": "地面に着いたと思える高さではない。"}, {"t": 1614.5666666666666, "x": "報告書が書いたのは、42秒前から始まって7秒前に\n幻覚妄想状態に陥り始めた、という経過だ。"}, {"t": 1621.5666666666666, "x": "意図してやったのでも、勘違いしたのでもない。"}, {"t": 1624.4333333333334, "x": "……じゃあ、罪に問えるの？"}, {"t": 1625.9666666666667, "x": "そこが、次の章だ。"}, {"t": 1628.1, "x": "刑事の手続きは、報告書とは別に走っている。"}, {"t": 1631.25, "x": "1982年8月5日、参議院の法務委員会。"}, {"t": 1634.9833333333333, "x": "警察庁の捜査第一課長が説明している。"}, {"t": 1637.9166666666667, "x": "事故前の病状や、事故のときの言動などから\n精神状態に疑問が認められたので、"}, {"t": 1642.9833333333333, "x": "目下、専門家による精神鑑定を実施中である。"}, {"t": 1646.35, "x": "精神鑑定。"}, {"t": 1647.5166666666667, "x": "裁判にかけられる状態か\nどうかを、医師が調べる手続きだ。"}, {"t": 1651.15, "x": "容疑は、航空の危険を生じさせる\n行為等の処罰に関する法律の違反。"}, {"t": 1655.6166666666666, "x": "この容疑で、東京地方裁判所の裁判官から\n鑑定留置状が出ている。"}, {"t": 1660.05, "x": "そして、その結果がどうなったか。"}, {"t": 1662.25, "x": "それが国会で説明されたのは、3年以上あとのことだ。"}, {"t": 1665.8333333333333, "x": "1985年11月26日、参議院の法務委員会。"}, {"t": 1670.0666666666666, "x": "法務省の刑事局長の答弁を読む。名前は外す。"}, {"t": 1673.5, "x": "機長につきましては、航空の危険を生じさせる\n行為等の処罰に関する法律違反につき"}, {"t": 1679.0, "x": "捜査を行いました結果、本件犯行当時、\n心神喪失の状態にあったと認められましたために、"}, {"t": 1685.2333333333333, "x": "昭和57年9月17日に不起訴処分に付した。"}, {"t": 1688.8666666666666, "x": "……1982年の9月。"}, {"t": 1690.85, "x": "事故の7か月後ね。"}, {"t": 1692.5, "x": "報告書が出るより、8か月も前だ。"}, {"t": 1694.9833333333333, "x": "心神喪失というのは、良い悪いを見分ける力と、"}, {"t": 1698.1833333333334, "x": "自分の行いを止める力が、そのときに\n失われていたという判断だ。"}, {"t": 1702.45, "x": "この場合、刑罰を与えないことになっている。"}, {"t": 1705.1166666666666, "x": "起きたことが無かったことになるのではない。"}, {"t": 1707.4666666666667, "x": "罰を与えても、罰の目的が\n達せられないからだ、という考え方だ。"}, {"t": 1712.0333333333333, "x": "……納得できる人ばかりじゃないでしょうね。"}, {"t": 1714.4333333333334, "x": "私もそう思う。24名が亡くなっているんだからな。"}, {"t": 1717.8, "x": "ただし、これは1982年だけの特別な\n決め方ではない。いまも使われている刑法の基本だ。"}, {"t": 1724.75, "x": "残るのは、会社の側だ。"}, {"t": 1726.5166666666667, "x": "1984年11月9日。"}, {"t": 1729.0833333333333, "x": "6人について、不起訴の処分が出た。"}, {"t": 1731.7833333333333, "x": "6人って、誰？"}, {"t": 1733.25, "x": "運航を管理する立場の人が4人。"}, {"t": 1735.3166666666666, "x": "乗員の健康管理をしていた\n医師が2人だ。名前は言わない。"}, {"t": 1739.0333333333333, "x": "容疑は業務上過失致死傷。"}, {"t": 1740.75, "x": "理由は嫌疑不十分。"}, {"t": 1742.2166666666667, "x": "1985年3月16日、参議院の予算委員会で、\n法務省の刑事局長が説明している。"}, {"t": 1748.8666666666666, "x": "鍵になったのは、予見可能性という言葉だ。"}, {"t": 1751.8833333333334, "x": "前もって分かったかどうか、ってこと？"}, {"t": 1754.1833333333334, "x": "そうだ。不注意の罪が成り立つには、二つが要る。"}, {"t": 1757.3666666666666, "x": "悪い結果が起きると前もって分かったかどうか。"}, {"t": 1760.1, "x": "そして、分かったとして、それを避けられたかどうか。"}, {"t": 1763.2666666666667, "x": "どちらか一つでも欠けると、責める余地が無くなる。"}, {"t": 1766.3166666666666, "x": "この件で問われたのは、前のほうだ。"}, {"t": 1768.55, "x": "機長を乗務に戻したとき、この6人は、戻せば\n墜落して人が死傷すると分かっていたか。"}, {"t": 1774.3333333333333, "x": "……分かってたの？"}, {"t": 1775.4166666666667, "x": "局長ははっきり言っている。"}, {"t": 1776.9, "x": "御本人たちが予見していなかったことは\n事実である、と。"}, {"t": 1780.3666666666666, "x": "分かっていたなら、何か手を打っていたはずだからだ。"}, {"t": 1783.3666666666666, "x": "問題は、同じ場に他の人を置いたとして、\n分かる可能性があったかどうか。"}, {"t": 1787.8833333333334, "x": "捜査の結果として挙げられたのは、三つだ。"}, {"t": 1790.6, "x": "当時、機長に異常な言動はほとんどなかったこと。"}, {"t": 1793.6666666666667, "x": "医師が十数回、本人に面接して診断していること。"}, {"t": 1797.2, "x": "そして、医師が3回、機長の操縦する\n飛行機に同乗して観察していること。"}, {"t": 1802.25, "x": "……見てはいたのね。"}, {"t": 1803.4166666666667, "x": "見ていた。だから、分かる可能性があったと\n認めるだけの証拠が無い。"}, {"t": 1807.5, "x": "そういう理由で、不起訴になった。"}, {"t": 1810.1666666666667, "x": "話はここで終わらない。"}, {"t": 1811.6666666666667, "x": "1985年11月26日の委員会で、ある委員が、\nその前の月のことを述べている。"}, {"t": 1817.8333333333333, "x": "10月28日に、東京第一検察審査会が議決を出した。"}, {"t": 1822.15, "x": "検察官のした処分を\n認めない、という中身だったという。"}, {"t": 1825.7666666666667, "x": "検察審査会って、何をするところ？"}, {"t": 1828.4, "x": "くじで選ばれた一般の人が集まって、"}, {"t": 1830.7833333333333, "x": "検察官が起訴しなかった\n判断を、もう一度見るしくみだ。"}, {"t": 1834.4333333333334, "x": "法律の専門家ではない人の目で、\nその判断でよかったのかを確かめる。"}, {"t": 1839.0166666666667, "x": "それで「認めない」と出たのね。"}, {"t": 1841.2166666666667, "x": "ここは慎重に言う。これは\n委員の発言であって、政府の答弁ではない。"}, {"t": 1845.3666666666666, "x": "議決書そのものを、私は見ていない。"}, {"t": 1847.6333333333334, "x": "手に入らなかった。"}, {"t": 1848.9333333333334, "x": "実際、翌年の1986年4月21日に同じ委員が\n「検察審査会の結論は」と聞いたとき、"}, {"t": 1856.25, "x": "法務省の担当者はこう答えている。"}, {"t": 1858.45, "x": "ただいま急なお尋ねで、\n現在私つまびらかにしておりませんので、"}, {"t": 1862.4333333333334, "x": "後ほど調べまして御報告させていただきたい。"}, {"t": 1865.3833333333334, "x": "……その場では答えられなかったのね。"}, {"t": 1867.4833333333333, "x": "答えられなかった。そして、\nその後どうなったかは、国会の記録に出てこない。"}, {"t": 1872.2, "x": "だから、この回ではここで止める。"}, {"t": 1874.2666666666667, "x": "議決の中身も、そのあと起訴されたか\nどうかも、私は言わない。"}, {"t": 1878.25, "x": "はっきりしていることは一つだ。"}, {"t": 1880.15, "x": "この事故について、法廷が開かれたことは一度も無い。"}, {"t": 1884.05, "x": "では、何が変わったのか。そこは、きちんと数える。"}, {"t": 1887.35, "x": "1982年2月12日、運輸大臣から会社に厳重注意。"}, {"t": 1891.9833333333333, "x": "2月15日から19日まで、本社と\n福岡空港支店に立入検査。"}, {"t": 1896.6333333333334, "x": "2月22日から3月13日まで、\n全部の航空事業者を対象に臨時の安全総点検。"}, {"t": 1902.5833333333333, "x": "3月9日、運輸大臣が会社の社長に、抜本的な\n安全対策を作って報告するよう求めた。"}, {"t": 1909.0333333333333, "x": "立入検査の結果として、\n7項目の業務改善の勧告が出ている。"}, {"t": 1913.4333333333334, "x": "乗員の健康管理、乗員の組織、乗務の管理などだ。"}, {"t": 1917.2333333333333, "x": "ずいぶん手広いのね。"}, {"t": 1918.6, "x": "ここからが本番だ。1982年11月22日。"}, {"t": 1922.7666666666667, "x": "運輸大臣が、航空審議会に\n諮問を出している。題はこうだ。"}, {"t": 1926.6, "x": "航空機乗組員の健康管理についての改善方策如何。"}, {"t": 1930.2, "x": "医学に深く関わる話なので、部会を\n作って、医師を委員に入れた。"}, {"t": 1934.4666666666667, "x": "審議に1年余りかけて、1983年11月に答申が出る。"}, {"t": 1939.2166666666667, "x": "そして、その答申を\n受けてできたものが、この回の答えだ。"}, {"t": 1943.05, "x": "何ができたの？"}, {"t": 1944.2666666666667, "x": "財団法人、航空医学研究センター。"}, {"t": 1946.8333333333333, "x": "航空身体検査を、航空会社から\n切り離して実施するための機関だ。"}, {"t": 1951.3, "x": "1985年11月、運輸省の技術部長が\n国会でこう説明している。"}, {"t": 1956.5, "x": "これまで各会社の社内の産業医で行っていたものを、"}, {"t": 1959.5333333333333, "x": "東京地区におきましては航空医学研究センターという\n財団法人を設立いたしまして、"}, {"t": 1964.75, "x": "そこにおける中立的な目で、\n乗員の定期検査、身体検査を行う。"}, {"t": 1969.4333333333334, "x": "……会社の中の人が検査する形を、やめたのね。"}, {"t": 1972.7666666666667, "x": "やめた。1984年10月には基準の見直しの追加答申が\n出て、1985年4月から新しい基準になった。"}, {"t": 1980.95, "x": "会社の側も、健康管理の部を新しく作り、\n精神科の医師を含めて常勤の医師を増やしている。"}, {"t": 1986.9166666666667, "x": "乗員どうしのミーティングも、常に開く形にした。"}, {"t": 1990.7666666666667, "x": "最後に、報告書の一文へ戻る。"}, {"t": 1993.0666666666666, "x": "1983年5月16日、報告書が公表された。"}, {"t": 1997.1333333333334, "x": "事故から1年3か月だ。"}, {"t": 1999.05, "x": "その2日後、5月18日の衆議院運輸委員会で、\n運輸大臣が感想を述べている。"}, {"t": 2004.4, "x": "航空界としても意外中の意外だ。"}, {"t": 2006.6333333333334, "x": "事故調で研究しても、個人の責任を\n負うような人が出てこない。"}, {"t": 2010.5666666666666, "x": "全体がわけのわからぬと申しますか、"}, {"t": 2012.8833333333334, "x": "原因がはっきりしてこれだという\nふうなことのないような形で、非常に変わった事故だ。"}, {"t": 2017.9, "x": "……大臣が、わけがわからない、って。"}, {"t": 2020.1666666666667, "x": "投げやりな発言ではないと思う。"}, {"t": 2021.9666666666667, "x": "大臣はこう続けている。"}, {"t": 2023.6, "x": "そういうものに対する管理というものを\nしっかりしなければならぬ。"}, {"t": 2027.0833333333333, "x": "一層心理的に、そしてまた内部にわたって\n追跡しながらがんばっていかなければ、"}, {"t": 2031.95, "x": "むずかしい問題だ。"}, {"t": 2033.25, "x": "そして報告書の解析の最後には、こう書かれている。"}, {"t": 2036.55, "x": "関係医師の航空に対する知識が不十分であったこと。"}, {"t": 2039.9166666666667, "x": "多くの関係者の医学的知識が\n十分でなかったか、これに欠けていたこと。"}, {"t": 2044.4833333333333, "x": "関係者の判断が甘かったこと。"}, {"t": 2046.6, "x": "結果的にみて慎重さに欠ける\nところが関係者にあったこと。"}, {"t": 2050.3166666666666, "x": "乗客の安全は何ものにも\nかえられないという基本的な認識が、"}, {"t": 2054.2833333333333, "x": "関係者に必ずしも十分に徹底していなかったこと。"}, {"t": 2057.65, "x": "これらが重なり合って、"}, {"t": 2059.0833333333335, "x": "事故防止のために幾重にも\n設けられているチェック・ポイントが、"}, {"t": 2062.6, "x": "すべてすり抜けられてしまった、\nその最終の結果であり、"}, {"t": 2065.983333333333, "x": "本事故は、不可抗力によるものではない。"}, {"t": 2068.65, "x": "……最初に読んだ一文ね。"}, {"t": 2070.2833333333333, "x": "これを言うために、報告書は数百ページを使っている。"}, {"t": 2073.5333333333333, "x": "今日の話で私が数えたものを、\n指で折ってみてほしい。"}, {"t": 2076.9333333333334, "x": "一つ。前の晩の傾きは、どこにも上がらなかった。"}, {"t": 2080.383333333333, "x": "二つ。用紙には、その病名を書く\n欄が印刷されていなかった。"}, {"t": 2084.4, "x": "三つ。検査をする人と、雇っている\n側が、同じ場所にいた。"}, {"t": 2088.4, "x": "四つ。おかしいと思った人はいたが、\n医師までは届かなかった。"}, {"t": 2092.266666666667, "x": "五つ。復帰の手続きは多かったが、\n中に入れる材料が違っていた。"}, {"t": 2096.6666666666665, "x": "……五つとも、悪意じゃないのよね。"}, {"t": 2098.75, "x": "一つもない。全部、誰かを思ってやったことだ。"}, {"t": 2101.9666666666667, "x": "それでも、24人は帰ってこなかった。"}, {"t": 2104.65, "x": "帰ってこなかった。"}, {"t": 2106.05, "x": "ねえ、一つ聞いていい。"}, {"t": 2107.5833333333335, "x": "どうぞ。"}, {"t": 2108.2833333333333, "x": "この事故って、あの一言だけで覚えられてるでしょう。"}, {"t": 2111.45, "x": "覚えられている。シャツにもなったし、\n笑い話にもなった。"}, {"t": 2115.0833333333335, "x": "……笑い話に。"}, {"t": 2116.2, "x": "私は今日、その言葉を一度しか出していない。"}, {"t": 2119.1, "x": "副操縦士が叫んだ、その場所で一度だけだ。"}, {"t": 2122.1, "x": "あれは面白い台詞じゃない。"}, {"t": 2123.5333333333333, "x": "人を助けようとした声だ。"}, {"t": 2125.4166666666665, "x": "報告書はその人について、期待することは\n不可能であった、と書いている。"}, {"t": 2129.866666666667, "x": "出典を置いておく。報告書は\n運輸安全委員会のサイトの58-3。"}, {"t": 2134.2166666666667, "x": "国会の答弁は、\n国立国会図書館の国会会議録検索システムだ。"}, {"t": 2138.9333333333334, "x": "どちらも無料で、誰でも読める。"}, {"t": 2140.95, "x": "この回で気になったところがあれば、\nコメントに書いてもらえるとうれしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
