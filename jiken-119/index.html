<script>
const D={"name": "119", "file": "119_編集用", "dur": 2011.05, "segs": [], "subs": [{"t": 0.0, "x": "旅券が1冊。出発まではおよそ15分。"}, {"t": 2.8333333333333335, "x": "1959年6月11日の夜、羽田空港の出国の窓口だ。"}, {"t": 7.883333333333334, "x": "午後7時15分ごろ、1人の神父がそこに現れた。"}, {"t": 11.35, "x": "仲間の神父2、3人と一緒だった。"}, {"t": 13.616666666666667, "x": "国籍はベルギー。手にはベルギーの旅券がある。"}, {"t": 16.316666666666666, "x": "乗るのは午後7時半に出るエールフランス機だ。"}, {"t": 19.066666666666666, "x": "あと15分で飛んじゃう便じゃない？"}, {"t": 21.05, "x": "そうだ。そして窓口の審査官は、その名前に気づいた。"}, {"t": 24.7, "x": "警察から前もって知らせが届いていた人物だった。"}, {"t": 27.916666666666668, "x": "3か月前、東京で27歳の女性が亡くなっている。"}, {"t": 31.5, "x": "神父はその事件の重要参考人だったんだ。"}, {"t": 34.4, "x": "それで窓口で止めたの？"}, {"t": 36.1, "x": "止められなかった。止める条文がどこにも無かった。"}, {"t": 39.15, "x": "神父はそのまま飛行機に乗り、日本へは戻らなかった。"}, {"t": 42.46666666666667, "x": "この夜のことを、国会は1週間後に問いただしている。"}, {"t": 45.766666666666666, "x": "今回はその会議録を軸に、BOAC\nスチュワーデス事件を追う。"}, {"t": 49.63333333333333, "x": "先にこの回の約束を一つ置いておく。"}, {"t": 52.166666666666664, "x": "事件は犯人が分からないまま、\n1974年に時効になった。"}, {"t": 56.5, "x": "神父も2017年に、96歳で亡くなっている。"}, {"t": 59.96666666666667, "x": "国会では、神父を疑うに足る\n資料は無いという答弁が何度も出た。"}, {"t": 64.03333333333333, "x": "だからこの回は、誰がやったかを当てる回ではない。"}, {"t": 67.13333333333334, "x": "じゃあ何を追う回なの？"}, {"t": 68.58333333333333, "x": "あの夜なぜ止められなかったのか。\nその記録を読む回だ。"}, {"t": 72.55, "x": "時計を3か月戻す。1959年3月10日の朝だ。"}, {"t": 76.76666666666667, "x": "東京都杉並区を流れる善福寺川で、\n1人の女性が見つかった。"}, {"t": 81.01666666666667, "x": "当時の新聞によると、時刻は朝7時40分ごろ。"}, {"t": 84.5, "x": "女性は27歳。すでに亡くなっていた。"}, {"t": 87.3, "x": "27歳……。どんな人だったの？"}, {"t": 89.58333333333333, "x": "イギリスの航空会社、BOACのスチュワーデスだ。"}, {"t": 92.75, "x": "いまのブリティッシュ・\nエアウェイズにつながる会社だな。"}, {"t": 95.6, "x": "その年の1月5日に採用されたばかりだった。"}, {"t": 98.66666666666667, "x": "入社してすぐ、ロンドンの本社で講習を受けている。"}, {"t": 101.75, "x": "日本に戻ったのは2月27日。"}, {"t": 104.16666666666667, "x": "そして3月13日には、初めての仕事が決まっていた。"}, {"t": 107.95, "x": "香港行きの飛行機に乗ることになっていたんだ。"}, {"t": 110.85, "x": "初めて乗る日の3日前……？"}, {"t": 112.65, "x": "ああ。その3日前の朝に川で見つかった。"}, {"t": 115.3, "x": "彼女は3月8日に下宿を出たきり、\n行方が分からなくなっていた。"}, {"t": 119.36666666666666, "x": "出かけるときは、教会と\nおじさんの所へ行くと話していた。"}, {"t": 122.96666666666667, "x": "だがそのどちらにも着いていない。"}, {"t": 124.81666666666666, "x": "見つかった直後には、自殺という見方もあった。"}, {"t": 127.83333333333333, "x": "それが解剖のあと、殺人の捜査に切り替わる。"}, {"t": 130.81666666666666, "x": "3月12日、地元の高井戸署に\n特別捜査本部が置かれた。"}, {"t": 135.1, "x": "自殺じゃなくて事件だったのね。"}, {"t": 137.2, "x": "この回では彼女の名前は出さない。"}, {"t": 139.3, "x": "国会の会議録には名前が残っているが、\nここでは27歳の女性と呼ぶ。"}, {"t": 144.05, "x": "うん。それでいいと思う。"}, {"t": 146.06666666666666, "x": "この事件が起きた1959年が、\nどんな年だったかも見ておく。"}, {"t": 150.45, "x": "翌年に日米安保条約の改定を控え、\n反対の運動が表に出始めていた。"}, {"t": 155.51666666666668, "x": "4月10日には、当時の皇太子の結婚式が行われる。"}, {"t": 159.16666666666666, "x": "事件のおよそ1か月後のことだ。"}, {"t": 161.38333333333333, "x": "日本中がお祝いの空気だったころね。"}, {"t": 163.76666666666668, "x": "飛行機の旅はまだ一般的ではなかった。"}, {"t": 166.35, "x": "スチュワーデスは、\n当時あこがれの職業と言われていた。"}, {"t": 169.6, "x": "そのあこがれの仕事に就いたばかりだったのね。"}, {"t": 172.38333333333333, "x": "そういう時代の東京でこの事件は起きた。"}, {"t": 175.5, "x": "捜査本部は、彼女と親しかった人を順に当たっていく。"}, {"t": 179.03333333333333, "x": "その中にベルギー国籍の神父がいた。"}, {"t": 181.48333333333332, "x": "名前はベルメルシュ。当時38歳だ。"}, {"t": 184.05, "x": "当時の新聞によると、彼女の手帳に\n神父の名前があった。"}, {"t": 187.7, "x": "神父は東京の修道院に住んでいた。"}, {"t": 190.0, "x": "修道院が営む出版社、ドン・\nボスコ社で会計を受け持っていた。"}, {"t": 194.15, "x": "出版社にいる神父さんなのね。"}, {"t": 196.26666666666668, "x": "のちの訃報には、日本で教師と\nカトリック雑誌の編集をしたとある。"}, {"t": 200.35, "x": "司祭になったのも東京で、1953年のことだ。"}, {"t": 204.03333333333333, "x": "つまり日本で長く暮らしてきた人だった。"}, {"t": 206.63333333333333, "x": "国会で警察庁の刑事局長が2人の間柄を説明している。"}, {"t": 210.71666666666667, "x": "被害者と「非常に親しい間柄」だったと。"}, {"t": 213.86666666666667, "x": "親しかったから、話を聞く相手になったってこと？"}, {"t": 217.2, "x": "そうだ。局長は同じ答弁でこうも言っている。"}, {"t": 219.98333333333332, "x": "神父が殺したと「疑われるに至る\n資料はいまだ発見されていない」。"}, {"t": 224.06666666666666, "x": "「殺人被疑者だということは言えません」とも続けた。"}, {"t": 227.3, "x": "疑ってるわけじゃないの？"}, {"t": 228.93333333333334, "x": "少なくとも、国会での説明はずっとその線だった。"}, {"t": 232.3, "x": "彼女のことをよく知る人として、話を聞きたい。"}, {"t": 235.4, "x": "それがこの事件での「重要参考人」という\n言葉の中身だ。"}, {"t": 239.21666666666667, "x": "この局長の答弁は、この先も何度も出てくる。"}, {"t": 242.28333333333333, "x": "警察の側の説明は、ほとんどこの人の口から語られた。"}, {"t": 246.8, "x": "神父の存在が世の中に出たのは、\n新聞の記事からだった。"}, {"t": 250.48333333333332, "x": "当時の新聞を読み直した記事に\nよると、4月18日の毎日新聞の朝刊だ。"}, {"t": 255.65, "x": "社会面のトップにこんな見出しが載った。"}, {"t": 258.06666666666666, "x": "「捜査線上に外人浮ぶ」。"}, {"t": 259.95, "x": "まだ名前は出てないの？"}, {"t": 261.45, "x": "このときは「聖職にあるベルギー人」とだけ\n書かれていた。"}, {"t": 264.9166666666667, "x": "名前が出たのは5月6日の夕刊だ。"}, {"t": 267.23333333333335, "x": "各紙が一斉に神父の実名を出して報じた。"}, {"t": 270.2, "x": "被疑者でもないのに、名前が出ちゃったのね。"}, {"t": 272.8833333333333, "x": "そういうことだ。いまなら、ごく\n特別な場合でないと考えにくい。"}, {"t": 276.78333333333336, "x": "前の日の5月5日、捜査員が修道院を訪ねていた。"}, {"t": 280.31666666666666, "x": "話を聞くため、警察まで来てほしいと頼んだんだ。"}, {"t": 283.6, "x": "神父と教会の側はそれを断った。"}, {"t": 285.93333333333334, "x": "教会の中なら構わないが、\n警察へ行くのは困る、という返事だった。"}, {"t": 290.4, "x": "断ったことまで新聞に出ちゃったの？"}, {"t": 292.8, "x": "出た。見出しには\n「任意同行こばむ」という言葉もあった。"}, {"t": 296.43333333333334, "x": "任意の同行は、断っても法に触れるものではない。"}, {"t": 299.48333333333335, "x": "だが見出しになると受け取られ方が変わってしまう。"}, {"t": 302.3, "x": "修道院の側は、事件とは全く関係が無いと\nはっきりしている、と答えた。"}, {"t": 307.1666666666667, "x": "記事の書き方ひとつで、印象が決まっちゃうのね。"}, {"t": 310.8333333333333, "x": "警察庁の局長は、捜査の進め方も\n国会で説明している。"}, {"t": 315.0, "x": "こういう事件では、大きな軸が2本あるという。"}, {"t": 317.76666666666665, "x": "1本目は、被害者の状況を明らかにすること。"}, {"t": 320.81666666666666, "x": "亡くなるまでの行動を、できるだけ細かくたどる。"}, {"t": 323.71666666666664, "x": "2本目は、現場に残った物の証拠を集めることだ。"}, {"t": 327.03333333333336, "x": "その2本から被疑者を割り出していく。"}, {"t": 329.3666666666667, "x": "足どりと物の証拠ね。"}, {"t": 331.01666666666665, "x": "この事件では、2本目の物の証拠が少なかった。"}, {"t": 334.21666666666664, "x": "局長も物的な資料は比較的少ないと認めている。"}, {"t": 337.7, "x": "そのぶん、関係する人たちの話を\n一つずつ突き合わせていった。"}, {"t": 341.8333333333333, "x": "誰が何を言ったかを比べていくのね。"}, {"t": 344.18333333333334, "x": "その中で、いちばん詳しく話を聞く\n相手になったのが神父だった。"}, {"t": 348.28333333333336, "x": "ただ局長は、別の議員の質問にこう答えている。"}, {"t": 351.51666666666665, "x": "被疑事実と結びつけて事情を\n聞いた人は、1人もいない。"}, {"t": 355.1, "x": "神父も含めて、疑いの相手として\n聞いたわけではないということだ。"}, {"t": 359.2, "x": "誰も被疑者にならないまま、捜査が進んでたのね。"}, {"t": 363.0, "x": "神父への聴取は、すんなり始まったわけではない。"}, {"t": 365.95, "x": "警察庁の刑事局長も、最初は警察に行くのは\n困ると言われたと話している。"}, {"t": 370.8833333333333, "x": "間に入ったのは、神父についた弁護人たちだ。"}, {"t": 373.93333333333334, "x": "弁護人の働きかけで、神父は\n日本の捜査に協力すると決めた。"}, {"t": 378.18333333333334, "x": "聴取が始まったのは5月11日。"}, {"t": 380.43333333333334, "x": "合計で5日間になる。"}, {"t": 382.18333333333334, "x": "5日間も？　どこで聞いたの？"}, {"t": 384.18333333333334, "x": "そこにも条件があった。"}, {"t": 385.73333333333335, "x": "新聞に自分の顔がいっぱい\n出るのは、立場の上で困る。"}, {"t": 389.15, "x": "神父の側がそう伝えると警察は\n「大へんもっとも」と受け止めた。"}, {"t": 393.3, "x": "警視庁の庁舎に来ればどうしても目立つ。"}, {"t": 395.76666666666665, "x": "そこで警視庁が管理している別の建物を使った。"}, {"t": 398.95, "x": "局長の言葉では「比較的第三者に\nわかりにくい場所」だ。"}, {"t": 403.03333333333336, "x": "ずいぶん気をつかってるのね。"}, {"t": 404.78333333333336, "x": "実名が新聞に出たあとだから、そこは無理もない。"}, {"t": 407.8333333333333, "x": "当時の新聞によると、聴取は\n5月11日から13日までと、20日と21日。"}, {"t": 413.45, "x": "その間も神父の話は変わらなかったという。"}, {"t": 416.18333333333334, "x": "警察は聴取とあわせて、別の線も追っていた。"}, {"t": 419.1666666666667, "x": "彼女が最後に何を食べたかから、\n足どりを割り出す捜査だ。"}, {"t": 422.81666666666666, "x": "それでも局長は6月の国会でこう言った。"}, {"t": 425.56666666666666, "x": "被疑者が誰か「割り出すことはできない状態」だと。"}, {"t": 428.96666666666664, "x": "5日間聞いても何も決まらなかったのね。"}, {"t": 432.1333333333333, "x": "ここで羽田の夜につながる準備が一つある。"}, {"t": 434.8333333333333, "x": "警察は入国管理局に、ある頼みごとをしていた。"}, {"t": 438.1, "x": "神父が国へ帰りそうになったら、知らせてほしい。"}, {"t": 441.1666666666667, "x": "それって止めてってこと？"}, {"t": 442.78333333333336, "x": "違う。知らせてほしいだけだ。"}, {"t": 444.68333333333334, "x": "しかも局長は国会で\n「口頭でございますが」と付け加えている。"}, {"t": 448.7, "x": "文書ではなく口で頼んだ連絡だった。"}, {"t": 451.18333333333334, "x": "入国管理局長の説明では、手配は\n警視庁の蒲田署から出ていた。"}, {"t": 455.5833333333333, "x": "羽田空港を受け持っていた警察署だ。"}, {"t": 458.1166666666667, "x": "知らせが来たらどうするつもりだったの？"}, {"t": 460.43333333333334, "x": "そこがのちの国会でいちばん問われた所になる。"}, {"t": 463.3, "x": "局長はもう一つ別の方法も考えたと話している。"}, {"t": 466.6666666666667, "x": "本人から承諾書をとるという案だ。"}, {"t": 469.03333333333336, "x": "承諾書？"}, {"t": 470.01666666666665, "x": "犯人が分かるまで日本にいます、と\n判を押してもらう紙だ。"}, {"t": 473.51666666666665, "x": "だが局長はそこまで求めなかった。"}, {"t": 475.81666666666666, "x": "理由を聞かれて「あまり人権上につい」と\n言葉を濁している。"}, {"t": 479.56666666666666, "x": "被疑者でもない人に、日本にいろと判を押させる。"}, {"t": 482.55, "x": "それは行き過ぎだという判断だった。"}, {"t": 484.8, "x": "やさしい判断にも、甘い判断にも聞こえるわね。"}, {"t": 487.95, "x": "どちらに聞こえるか。それが\n国会でぶつかることになる。"}, {"t": 491.8666666666667, "x": "では6月11日の夜を時刻どおりに追おう。"}, {"t": 494.6166666666667, "x": "根拠は6月18日の国会での入国管理局長の報告だ。"}, {"t": 498.85, "x": "午後7時15分ごろ。"}, {"t": 500.23333333333335, "x": "神父は入管の羽田出張所に現れた。"}, {"t": 502.95, "x": "受け持ちの入国審査官は、型どおりに書類を見ていく。"}, {"t": 506.35, "x": "出国記録、旅券それに外国人登録証の3つだ。"}, {"t": 510.03333333333336, "x": "そこで審査官は気づいた。"}, {"t": 511.7, "x": "蒲田署から手配が来ていた、重要参考人の神父だ。"}, {"t": 515.3166666666667, "x": "気づいたのね！"}, {"t": 516.3833333333333, "x": "審査官はすぐ、警察の羽田支所に電話をかけた。"}, {"t": 519.6833333333333, "x": "至急どうするかの返事がほしいと頼んだ。"}, {"t": 522.15, "x": "ところがすぐには返事が来ない。"}, {"t": 524.15, "x": "飛行機は待ってくれないわよね？"}, {"t": 526.1166666666667, "x": "待ってくれなかった。"}, {"t": 527.3666666666667, "x": "エールフランスの係員が、何度も聞いてくる。"}, {"t": 530.1166666666667, "x": "「もう乗客を搭乗させてもよいか」。"}, {"t": 532.15, "x": "局長の報告はこれを「督促」という言葉で書いている。"}, {"t": 535.7666666666667, "x": "審査官は「もうしばらく待ってくれ」と答えた。"}, {"t": 538.7666666666667, "x": "そして自分の足で、警察の羽田支所まで向かった。"}, {"t": 542.2, "x": "審査官さんがんばったのね。"}, {"t": 544.0666666666667, "x": "事の重さを考えて、と報告には書かれている。"}, {"t": 547.7166666666667, "x": "支所には巡査部長がいた。"}, {"t": 549.3833333333333, "x": "巡査部長は、そこからすぐ本署へ連絡を入れた。"}, {"t": 552.45, "x": "返ってきた答えはこうだ。"}, {"t": 554.0666666666667, "x": "「今のところ阻止する手が打てない」。"}, {"t": 556.1333333333333, "x": "……打てないなのね。"}, {"t": 557.2833333333333, "x": "審査官はその答えを持って窓口へ戻る。"}, {"t": 559.9, "x": "ところがここで行き違いが起きる。"}, {"t": 561.8333333333334, "x": "別の巡査が、同じ答えを伝えに\n入管の窓口へ来ていたんだ。"}, {"t": 565.85, "x": "審査官が支所に出ている間に、入れ違いでな。"}, {"t": 568.9, "x": "同じことを2人が伝えに走ってたの？"}, {"t": 571.4333333333333, "x": "報告を読むかぎりそうなる。"}, {"t": 573.0833333333334, "x": "警察からの答えは2回とも同じだった。"}, {"t": 575.6666666666666, "x": "止める手は無い。"}, {"t": 576.65, "x": "神父の側の動きはこう書かれている。"}, {"t": 578.8333333333334, "x": "「若干の時間を入管のデスクで空費したのみ」。"}, {"t": 581.6666666666666, "x": "そして規定どおり、旅券に出国の証印を受けた。"}, {"t": 584.8, "x": "午後7時半発のエールフランス機に乗り込む。"}, {"t": 587.5166666666667, "x": "報告の結びは「正規に出国したもの」だ。"}, {"t": 590.7333333333333, "x": "正規……。ずるをしたわけじゃないのね。"}, {"t": 592.95, "x": "そうだ。手続きの上では何一つ欠けていなかった。"}, {"t": 596.15, "x": "窓口に現れてからおよそ15分のことだ。"}, {"t": 599.5166666666667, "x": "でもどうして止められないの？"}, {"t": 600.9833333333333, "x": "手配まで来てたのに。"}, {"t": 602.5333333333333, "x": "入国管理局長はそのまま条文の話をした。"}, {"t": 605.6166666666667, "x": "出入国管理令の第25条だ。"}, {"t": 607.9666666666667, "x": "外国人は、旅券に出国の証印を\n受けなければ出国できない。"}, {"t": 612.1833333333333, "x": "じゃあ証印を押さなければいいじゃない。"}, {"t": 614.1833333333333, "x": "そうはいかないというのが局長の説明だ。"}, {"t": 616.7, "x": "有効な旅券で、正しく\n手続きをした人には、必ず押す。"}, {"t": 620.5833333333334, "x": "その場で身元を調べたり、捜査の\nまねごとをしたりはできない。"}, {"t": 624.1333333333333, "x": "外国人が実際に出られないのは、\n1つの場合だけだという。"}, {"t": 627.8, "x": "逮捕状か拘引状が出て、身柄が\n押さえられているときだ。"}, {"t": 631.3333333333334, "x": "逮捕状が無ければ、誰でも出られるってこと？"}, {"t": 634.1666666666666, "x": "局長はもっと強い例まで出している。"}, {"t": 636.4333333333333, "x": "保釈中の人でさえ、正しい旅券を\n持っていれば出国を認める。"}, {"t": 640.4166666666666, "x": "保釈が取り消されていない限り、そうなるという。"}, {"t": 643.3666666666667, "x": "保釈中でも……。"}, {"t": 644.55, "x": "局長もそれはおかしいという\n声が出ることは分かっていた。"}, {"t": 647.7166666666667, "x": "ただと続ける。"}, {"t": 648.8, "x": "裁判所を通さずに、役所の判断で\n人の自由を縛ることになる。"}, {"t": 652.8666666666667, "x": "それは「非常に重要な研究を要する問題」だと。"}, {"t": 656.3166666666667, "x": "止めるのも、止めないのも、どっちも重いのね。"}, {"t": 659.75, "x": "同じ委員会で、法務省の刑事局長も条文を説明した。"}, {"t": 663.5333333333333, "x": "こちらもこの先で何度も答弁に立つ人だ。"}, {"t": 666.3166666666667, "x": "法務省の局長は証印を「一種の確認行為」と呼んだ。"}, {"t": 670.0833333333334, "x": "確認行為って何を確認するの？"}, {"t": 672.4333333333333, "x": "旅券が有効かどうか。そして本人に間違いがないか。"}, {"t": 675.8333333333334, "x": "確かめる中身はほぼそれだけだという。"}, {"t": 678.1166666666667, "x": "それが確かめられたらどうするか。"}, {"t": 680.1, "x": "局長の言葉は「ちゅうちょなく、\n遅滞なく」押すべきものだ。"}, {"t": 683.9833333333333, "x": "迷っちゃいけないのね。"}, {"t": 685.4333333333333, "x": "逆に言うと迷える場面は限られている。"}, {"t": 687.75, "x": "本人が来ていない。代わりの人が来た。"}, {"t": 690.2333333333333, "x": "あるいは身柄がすでに押さえられている。"}, {"t": 692.3166666666667, "x": "そういうときだけ、証印を受ける前提が欠ける。"}, {"t": 695.1833333333333, "x": "あの夜の神父はそのどれにも当たらない。"}, {"t": 697.45, "x": "本人が自分の旅券を持って、窓口に立っていた。"}, {"t": 700.7833333333333, "x": "それなら押すしかないわけね。"}, {"t": 702.5833333333334, "x": "局長は25条が「唯一の規制規定」だとも言っている。"}, {"t": 706.3166666666667, "x": "外国人の出国を縛る決まりは、\nほかに無かったということだ。"}, {"t": 710.1833333333333, "x": "この条文が今の時代に合っているかは、検討が要る。"}, {"t": 713.3333333333334, "x": "局長はそうも述べている。"}, {"t": 715.55, "x": "羽田の夜から一夜明けた6月12日。"}, {"t": 718.2333333333333, "x": "この日の夕刊は、各紙そろって\n社会面のトップがこの話だった。"}, {"t": 722.3833333333333, "x": "朝日新聞の見出しは「ベルメルシュ神父が\n帰国　警視庁はショック」。"}, {"t": 726.55, "x": "読売新聞は「スチュワーデス殺し迷宮入りか」。"}, {"t": 729.6666666666666, "x": "警察にも知らされてなかったの？"}, {"t": 731.8166666666667, "x": "毎日新聞の見出しには\n「捜査本部に通知なし」とある。"}, {"t": 735.5, "x": "同じ紙面には、警視庁の刑事部長の談話も載った。"}, {"t": 738.8166666666667, "x": "まだ調べなければならないことが\n残っているので、大変遺憾だ。"}, {"t": 742.6833333333333, "x": "警察のほうも、寝耳に水だったのね。"}, {"t": 745.35, "x": "修道会の側は新聞各社に理由を伝えた。"}, {"t": 748.2333333333333, "x": "「疲労が甚だしいので」。"}, {"t": 749.7666666666667, "x": "神父が属していたのは、サレジオ会という修道会だ。"}, {"t": 753.0833333333334, "x": "さらに偶然が一つ重なっていた。"}, {"t": 755.3, "x": "同じエールフランス機に、\n読売新聞の記者が乗り合わせていたんだ。"}, {"t": 759.3166666666667, "x": "えっ同じ飛行機に？"}, {"t": 760.7833333333333, "x": "外国へ赴任する途中だったという。"}, {"t": 762.95, "x": "記者の問いに神父はこう答えている。"}, {"t": 765.05, "x": "帰国はサレジオ会の命令で、\n病気と両親の見舞いを兼ねている。"}, {"t": 768.85, "x": "日本も日本人も好きで、できたら\n2、3か月のうちに戻りたい。"}, {"t": 772.8333333333334, "x": "戻るつもりだったのね。"}, {"t": 774.4333333333333, "x": "そう話していた。"}, {"t": 775.5666666666667, "x": "だが神父がその後、日本の土を踏むことは無かった。"}, {"t": 778.8333333333334, "x": "少なくとも、それを示す記録は見つからない。"}, {"t": 782.35, "x": "1週間後の6月18日。"}, {"t": 784.3333333333334, "x": "衆議院の法務委員会が開かれた。"}, {"t": 786.5833333333334, "x": "議題は法務行政と外国人の出入国だ。"}, {"t": 789.5333333333333, "x": "最初に質問した議員は、新聞の話から切り出した。"}, {"t": 793.1166666666667, "x": "12日の各紙は一斉に、重要参考人の帰国を伝えた。"}, {"t": 797.0333333333333, "x": "あれを読むと捜査が\n「迷宮に入ったような感じ」がする。"}, {"t": 800.5166666666667, "x": "国民の疑いを解くために、説明してほしい、と。"}, {"t": 803.8666666666667, "x": "みんなが思ってたことを聞いたのね。"}, {"t": 806.0, "x": "ここで警察庁の局長が、長い報告をしている。"}, {"t": 809.2333333333333, "x": "これまでの話の多くは、この報告から取っている。"}, {"t": 812.3333333333334, "x": "報告の終わりで局長はこう認めた。"}, {"t": 814.6, "x": "遠くにいる人から話を聞き直すのは、時間がかかる。"}, {"t": 818.0666666666667, "x": "また聞きになれば、捜査としては難しさも増す。"}, {"t": 821.2666666666667, "x": "そこは認めてるのね。"}, {"t": 822.8166666666667, "x": "認めている。そのうえで、帰国を\n抑える方法は無かったと言った。"}, {"t": 826.65, "x": "議員は食い下がる。"}, {"t": 827.7666666666667, "x": "外国人だからいつ帰るか分からない。"}, {"t": 830.0833333333334, "x": "それなら本国の大使館に\n連絡するとか、手を打てたはずだ。"}, {"t": 833.8, "x": "局長の答えはまたしても資料の話になる。"}, {"t": 836.6, "x": "外交の窓口を通して頼むには、\n相当の疑いを示せないといけない。"}, {"t": 840.9666666666667, "x": "その資料が無いのに頼めば、\n本人にとって大きな迷惑になる。"}, {"t": 844.95, "x": "疑いが無いから頼めないってことね。"}, {"t": 847.3333333333334, "x": "そうだ。この理屈が委員会の最後まで続く。"}, {"t": 850.7666666666667, "x": "委員会では、入国管理局にも厳しい質問が飛んだ。"}, {"t": 854.3, "x": "ある議員は自分の経験と比べている。"}, {"t": 856.5666666666667, "x": "労働組合の人が海外の会議に出るとき、\n役所はなかなか許可しない。"}, {"t": 860.9833333333333, "x": "それなのに、殺人事件の重要参考人は、\nその日の夕方に出してしまう。"}, {"t": 865.8666666666667, "x": "扱いが逆じゃないかってこと？"}, {"t": 867.85, "x": "そういう怒りだ。"}, {"t": 868.9166666666666, "x": "せめて2、3日は手続きを\n止めて、慎重にやるべきだった。"}, {"t": 872.55, "x": "局長に電話で\n問い合わせるくらいは、するべきだった、とも言った。"}, {"t": 876.4, "x": "入国管理局長の答えはこうだ。"}, {"t": 878.6166666666667, "x": "法律に沿った手続きを守ることが、いちばん大事だ。"}, {"t": 881.95, "x": "窓口の係官が一人一人、自分の考えで\n判断するようになると、かえって危ない。"}, {"t": 887.4333333333333, "x": "かえって危ない？"}, {"t": 888.55, "x": "係官によって、止めたり止めなかったりが\nばらつく、ということだろう。"}, {"t": 892.6666666666666, "x": "止めたいなら、条文そのものを変えるしかない。"}, {"t": 895.3666666666667, "x": "疑いの知らせを受けたら止められる、という\n規定があれば別だ、と。"}, {"t": 899.1666666666666, "x": "議員は重ねて、遺憾な点は無かったのかと聞いた。"}, {"t": 902.2833333333333, "x": "局長は「そこまで掘り下げて\n判断をいたすことは遺憾ながらできない」。"}, {"t": 906.5333333333333, "x": "窓口では決められないってことなのね。"}, {"t": 908.95, "x": "そうだ。窓口に決める権限そのものが無かった。"}, {"t": 912.7, "x": "別の議員は、捜査の始め方そのものを問いただした。"}, {"t": 916.0833333333334, "x": "問いは2つあった。"}, {"t": 917.3166666666667, "x": "1つめは、最初から検察と相談して進めていたのか。"}, {"t": 921.0666666666667, "x": "2つめは、外国へ帰る恐れを\n頭に置いて捜査していたのか。"}, {"t": 925.0166666666667, "x": "外国人なんだから、帰っちゃうことも\n考えておけってことね？"}, {"t": 928.8666666666667, "x": "そうだ。警察庁の局長は\n2つともそうしていたと答えた。"}, {"t": 932.6333333333333, "x": "東京地方検察庁とは十分に連絡を\n取り、苦心を重ねて進めた。"}, {"t": 937.05, "x": "局長はまず、これが難しい\n事件だったと前置きしている。"}, {"t": 940.5666666666667, "x": "関係する人の中に、\nカトリックの教団の事情も絡んでいたからだ。"}, {"t": 944.7833333333333, "x": "そのうえでこんなたとえを出した。"}, {"t": 946.6166666666667, "x": "日本人なら、東京の人が鹿児島や\n北海道へ向かう場合も考えておく。"}, {"t": 951.15, "x": "それと同じように、外国へ帰ることも頭に置いていた。"}, {"t": 954.5166666666667, "x": "だから入国管理局に、気配があれば\n教えてほしいと頼んだ。"}, {"t": 958.35, "x": "考えてはいたのね。"}, {"t": 959.7666666666667, "x": "考えてはいた。知らせも実際に羽田から届いた。"}, {"t": 962.9833333333333, "x": "だが知らせが届いても使える手が無かった。"}, {"t": 965.5333333333333, "x": "局長はそれを「不幸にして」という\n言葉でまとめている。"}, {"t": 969.0, "x": "出国の前に、被疑者と疑うに\n足る資料が見つからなかった。"}, {"t": 972.95, "x": "知らせの仕組みは働いたのに、\nその先が無かったのね。"}, {"t": 976.9666666666667, "x": "別の議員たちはもう一つの道を示した。"}, {"t": 979.6, "x": "証人尋問だ。"}, {"t": 980.9166666666666, "x": "証人？　被疑者じゃなくて？"}, {"t": 982.7333333333333, "x": "そうだ。犯人かどうかとは別に、\n知っていることを手続きで残す。"}, {"t": 986.8, "x": "起訴の前でも、裁判所に頼んで\n証人として話を聞く道がある。"}, {"t": 990.95, "x": "うそを言わないと宣誓をさせて、\nその記録を証拠として取っておく。"}, {"t": 994.7833333333333, "x": "議員の1人はそれで\n「時間をかせぐ」ことになると言った。"}, {"t": 998.4166666666666, "x": "手続きの間は、日本にいてもらえるってこと？"}, {"t": 1001.3666666666667, "x": "議員はそう考えていた。"}, {"t": 1002.8833333333333, "x": "これに警察庁の局長はどう答えたか。"}, {"t": 1005.45, "x": "神父の話が証拠として\n「唯一不可欠」とまでは言えなかった。"}, {"t": 1009.5666666666667, "x": "だから証人としての強制の手続きはとらなかった。"}, {"t": 1012.7333333333333, "x": "法務省の局長も別の角度から答えている。"}, {"t": 1015.6, "x": "証人尋問は、本来は証拠を保全するための手続きだ。"}, {"t": 1019.25, "x": "犯人が決まって、その裁判のために\n話を固めておくものだ。"}, {"t": 1023.2, "x": "誰が犯人かを探している\n段階では、必ずしも要らない。"}, {"t": 1026.8666666666666, "x": "手続きの使い方として、ちょっと違うってこと？"}, {"t": 1030.0333333333333, "x": "局長の考えではそうなる。"}, {"t": 1031.8, "x": "ただ局長自身、とってもいいし、\nとらなくてもいい、と言っている。"}, {"t": 1035.55, "x": "議論が分かれる話だ、と認めたうえでの答えだった。"}, {"t": 1039.4833333333333, "x": "証人尋問を求めた議員の1人は、こんな言葉を使った。"}, {"t": 1043.2333333333333, "x": "「長蛇を逸した」。"}, {"t": 1044.3833333333334, "x": "ちょうだ？"}, {"t": 1045.1166666666666, "x": "またとない機会を、目の前で\n逃したという意味の言葉だ。"}, {"t": 1048.4666666666667, "x": "議員は神父の帰国にはそういう感じがあると言った。"}, {"t": 1051.4166666666667, "x": "そしてこのままでは困る理由を3つ並べた。"}, {"t": 1054.1, "x": "被害者の遺族の感情。"}, {"t": 1055.7, "x": "日本の国民全体の感情。"}, {"t": 1057.6666666666667, "x": "それにこれから\n先の外国人の犯罪の取り締まりへの影響だ。"}, {"t": 1061.5333333333333, "x": "遺族のことを最初に言ったのね。"}, {"t": 1063.5666666666666, "x": "そうだ。会議録で最初に出てくるのは遺族だ。"}, {"t": 1066.4166666666667, "x": "議員はさらに続ける。"}, {"t": 1067.8333333333333, "x": "5日間も話を聞いたのは、捜査が\nきわどい所まで来ていたからだ。"}, {"t": 1072.0, "x": "「もう一時間日本に置いたら」と議員は言った。"}, {"t": 1074.7166666666667, "x": "何かの手がかりが得られたかもしれない。"}, {"t": 1077.0833333333333, "x": "1時間……。"}, {"t": 1077.95, "x": "ただしこれは議員の見方だ。"}, {"t": 1079.6833333333334, "x": "1時間あれば何が分かったのか、\n記録には何も書かれていない。"}, {"t": 1083.45, "x": "議員自身も最後にこう言っている。"}, {"t": 1085.4166666666667, "x": "「これはもう取り返しのつかない問題です」。"}, {"t": 1087.8333333333333, "x": "そのぶん、これからの捜査で\n取り戻してほしい、と結んだ。"}, {"t": 1091.8833333333334, "x": "でもベルギーに帰ったあとでも、呼び戻せないの？"}, {"t": 1094.8166666666666, "x": "議員も同じことを聞いた。"}, {"t": 1096.3833333333334, "x": "もし日本の捜査で、疑いが固まったらどうなるのか。"}, {"t": 1099.6833333333334, "x": "法務省の局長の答えは短かった。"}, {"t": 1102.1666666666667, "x": "法律の上では、手段がないのではなかろうか。"}, {"t": 1104.9833333333333, "x": "日本とアメリカの間には、\n犯罪人の引渡し条約がある。"}, {"t": 1108.7666666666667, "x": "だがベルギーとの間には、そういう条約が無い。"}, {"t": 1111.6666666666667, "x": "条約が無いと引き渡してもらえないの？"}, {"t": 1114.1666666666667, "x": "公の力で日本に連れ戻す\n手段は無い、というのが局長の見立てだ。"}, {"t": 1118.55, "x": "残るのは、仲のいい\n国どうしの事実上の協力だけになる。"}, {"t": 1122.2333333333333, "x": "警察庁の局長も、\n国際刑事警察機構の名前を出している。"}, {"t": 1126.3833333333334, "x": "法律の義務ではないが、各国の警察が\n捜査で助け合う仕組みだ。"}, {"t": 1130.5, "x": "ベルギーの警察に頼んで、話を\n聞いてもらうこともありうる。"}, {"t": 1134.0666666666666, "x": "局長は最初の報告で、そういう見通しも話していた。"}, {"t": 1137.55, "x": "局長自身、その会議に出たことがあると話している。"}, {"t": 1140.8166666666666, "x": "ただこうも言った。"}, {"t": 1141.9, "x": "どれだけ協力してもらっても、遠方のことだ。"}, {"t": 1144.7833333333333, "x": "「隔靴掻痒の感がある」。"}, {"t": 1146.4166666666667, "x": "かっかそうよう？"}, {"t": 1147.4666666666667, "x": "靴の上から足をかくような、もどかしさのことだ。"}, {"t": 1150.4833333333333, "x": "自分の手で直に調べられない、という意味になる。"}, {"t": 1153.45, "x": "遠くの国に頼むしかないって、もどかしいわね。"}, {"t": 1157.0333333333333, "x": "委員会の終わり近くある議員が聞いた。"}, {"t": 1159.25, "x": "神父には急いで帰る理由があったのか。"}, {"t": 1161.5666666666666, "x": "警察庁の局長は、警察もそこは\n気にして調べたと答えた。"}, {"t": 1165.6166666666666, "x": "本人の周りから言われていることは、2つあった。"}, {"t": 1168.7666666666667, "x": "2つ？"}, {"t": 1169.5666666666666, "x": "1つは体のことだ。"}, {"t": 1171.1166666666666, "x": "医者に診てもらうと、神経衰弱に\n近い状態だと言われた。"}, {"t": 1174.75, "x": "国へ帰って、母親や親族のもとで静養したほうがいい。"}, {"t": 1178.25, "x": "もう1つは神父の側の言い分だ。"}, {"t": 1180.35, "x": "5日間も調べられて、知っていることはみんな話した。"}, {"t": 1183.8, "x": "これ以上話せることもない。"}, {"t": 1185.6166666666666, "x": "そう言われると引き止めにくいわね。"}, {"t": 1187.6666666666667, "x": "局長は主な理由は前のほう、体のことだろうと言った。"}, {"t": 1191.1, "x": "同じ委員会で、入国管理局長にも問いが飛んだ。"}, {"t": 1194.35, "x": "もし逮捕状がもうすぐ出ると\n連絡が来ていたらどうするのか。"}, {"t": 1197.7666666666667, "x": "飛行機を1便遅らせれば、逮捕できる場面だ。"}, {"t": 1200.95, "x": "それならさすがに待つんじゃない？"}, {"t": 1202.8333333333333, "x": "局長の答えは、それでも法の建前は\n承認だ、というものだった。"}, {"t": 1207.0, "x": "本人の自由と人権を、どこまで止めていいか。"}, {"t": 1209.9, "x": "何時間ならいいとはとても言えない。"}, {"t": 1211.8666666666666, "x": "だからそこまで追い詰められる\n前に片づけてほしい、と。"}, {"t": 1215.65, "x": "1959年の委員会では、法律を変える話も出ていた。"}, {"t": 1219.8, "x": "最初に質問した議員はこう聞いている。"}, {"t": 1222.15, "x": "今の決まりで止められないなら、\nこれからどうするのか。"}, {"t": 1225.1833333333334, "x": "警察庁の局長は、まず国どうしの協力を挙げた。"}, {"t": 1228.5166666666667, "x": "国をまたぐ事件は、これから増えていく時代になる。"}, {"t": 1231.5666666666666, "x": "それなら警察どうしの協力を、\nもっと活発にするしかない。"}, {"t": 1235.4, "x": "法律を変えるって話にはならないの？"}, {"t": 1237.8, "x": "局長は法律を変えることも研究の一つだと言った。"}, {"t": 1241.0833333333333, "x": "ただすぐには変えられない理由も挙げている。"}, {"t": 1243.4166666666667, "x": "証人でも被疑者でも、国に\n帰れないほど縛るのは重いことだ。"}, {"t": 1247.2166666666667, "x": "捜査をやり遂げたいという声もよく分かる。"}, {"t": 1249.5666666666666, "x": "その2つの「調和点」をどこに\n求めるかが難しいという。"}, {"t": 1253.3166666666666, "x": "止めたい気持ちと、縛りすぎない決まりのあいだね。"}, {"t": 1256.4, "x": "そうだ。局長は法務省とよく\n相談して研究したいと答えた。"}, {"t": 1260.4, "x": "法務省の局長も、慎重に研究したいと続けている。"}, {"t": 1263.9666666666667, "x": "その研究の答えが条文になるまで、\nここから22年かかる。"}, {"t": 1268.4833333333333, "x": "国会のやりとりから2日後の6月20日。"}, {"t": 1271.2666666666667, "x": "当時の報道によると、\n高井戸署の捜査本部が解散した。"}, {"t": 1275.05, "x": "えっもうやめちゃったの？"}, {"t": 1276.4666666666667, "x": "警察庁の局長は、その点も国会で先に答えている。"}, {"t": 1280.1833333333334, "x": "捜査本部は、大勢の捜査員を\n一度に動かすための組織だ。"}, {"t": 1284.0, "x": "本部をやめても事件を\n「たな上げ」にするわけではない。"}, {"t": 1287.2, "x": "ほかの事件とも関連させて、捜査は続ける、と。"}, {"t": 1290.5833333333333, "x": "でも見込みはあったの？"}, {"t": 1291.9833333333333, "x": "議員もはっきり聞いている。"}, {"t": 1293.3666666666666, "x": "犯人を見つける見込みはあるのか。"}, {"t": 1295.4333333333334, "x": "局長の答えは「なかなか困難な状況」。"}, {"t": 1298.1833333333334, "x": "局長はこう続けた。警察は\n百パーセントの検挙を目指して努力している。"}, {"t": 1302.75, "x": "それでも証拠が固まらず、\n解決しない事件はほかにもある。"}, {"t": 1306.3833333333334, "x": "この事件も、それに似た点を相当持っている、と。"}, {"t": 1309.6333333333334, "x": "未解決になるかもしれないって、認めちゃったのね。"}, {"t": 1312.9, "x": "そして別の質問にはこうも答えた。"}, {"t": 1315.2666666666667, "x": "あのとき強制処分でやるべきではなかったと、\n今も思っている。"}, {"t": 1319.0666666666666, "x": "やり方を変えるつもりは無かったのね。"}, {"t": 1321.3666666666666, "x": "少なくとも国会ではそう言い切った。"}, {"t": 1323.5833333333333, "x": "議員の1人は、神父のほかに\n被疑者は出ていないのかと聞いた。"}, {"t": 1327.25, "x": "局長は「平たい言葉でいえば割れない」と\n認めている。"}, {"t": 1330.6333333333334, "x": "重要参考人がいなくなり本部が畳まれる。"}, {"t": 1333.3666666666666, "x": "事件はここから長い停滞に入っていく。"}, {"t": 1336.5, "x": "捜査が止まる一方で、世の中の話題は止まらなかった。"}, {"t": 1339.9, "x": "1959年は、週刊誌が次々と生まれた年でもある。"}, {"t": 1343.9833333333333, "x": "その年だけで、二十数誌が創刊されたという。"}, {"t": 1347.0833333333333, "x": "週刊誌がいちばん元気だった時期なのね。"}, {"t": 1349.7166666666667, "x": "その真ん中で起きた事件だった。"}, {"t": 1351.75, "x": "雑誌の上では、神父はシロか\nクロか、という議論が続いた。"}, {"t": 1355.3833333333334, "x": "10月には、事件をもとにした映画まで公開された。"}, {"t": 1358.6333333333334, "x": "題名は『白か黒か』だ。"}, {"t": 1360.6333333333334, "x": "推理作家の松本清張も、\nこの事件をもとに小説を書いた。"}, {"t": 1364.55, "x": "題名は『黒い福音』。"}, {"t": 1365.9666666666667, "x": "週刊誌に連載されて話題を呼んだ。"}, {"t": 1368.4166666666667, "x": "小説や映画になると、それが\n本当みたいに広まりそう……。"}, {"t": 1371.9666666666667, "x": "そこを心配した人もいた。"}, {"t": 1373.7666666666667, "x": "作家の遠藤周作は雑誌\n「世界」の8月号で書いている。"}, {"t": 1377.65, "x": "実名を出し、写真を載せ、\n真犯人のように扱う報道はおかしい、と。"}, {"t": 1382.1666666666667, "x": "遠藤周作自身もカトリックの信徒だった。"}, {"t": 1384.8833333333334, "x": "ベルギーからは、映画の扱いに\n抗議する手紙も新聞社に届いた。"}, {"t": 1388.9, "x": "小説も映画も作り手の推理だ。"}, {"t": 1391.0666666666666, "x": "捜査で確かめられた事実とは、\n分けて聞く必要がある。"}, {"t": 1394.7, "x": "うん。ここごっちゃにしやすい所ね。"}, {"t": 1397.4666666666667, "x": "羽田の夜から1年半後、1960年12月16日。"}, {"t": 1401.8833333333334, "x": "衆議院の法務委員会で、\nこの事件がまた取り上げられた。"}, {"t": 1405.3, "x": "質問した議員は、法務省に資料を出させていた。"}, {"t": 1408.4, "x": "その資料の終わりのほうに、\nこんな一文があったという。"}, {"t": 1411.45, "x": "有効な旅券を持ち、正しく手続きしてきた\n外国人の出国は阻止できない。"}, {"t": 1416.4166666666667, "x": "1年半たっても同じ答えなのね。"}, {"t": 1418.8, "x": "法務省の局長の答弁も、1959年と同じ線だった。"}, {"t": 1423.15, "x": "神父は重要な参考人だった。"}, {"t": 1425.1833333333334, "x": "だが「殺人の容疑というようなものにまでは\n至っていなかった」。"}, {"t": 1428.8333333333333, "x": "そして続けて「今日もその通り」と付け加えた。"}, {"t": 1432.3, "x": "疑いが深まったわけでもないの？"}, {"t": 1434.4333333333334, "x": "局長は容疑が深まったという報告は\n聞いていない、と答えている。"}, {"t": 1438.3, "x": "この日の答弁にはこんな話も出てくる。"}, {"t": 1440.7833333333333, "x": "捜査の側は、本人に日本にとどまるよう頼んでいた。"}, {"t": 1444.1, "x": "強制ではなく、自分から残ってほしいという要請だ。"}, {"t": 1447.3333333333333, "x": "だが本人は、どうしても帰国したいと答えた。"}, {"t": 1450.3, "x": "要請はした。そして断られた。"}, {"t": 1452.6166666666666, "x": "頼むことはできても、止めることはできない……。"}, {"t": 1455.35, "x": "それが1年半後の国会で確かめられた中身だった。"}, {"t": 1459.3166666666666, "x": "この日議員はかなり踏み込んだ聞き方をしている。"}, {"t": 1462.05, "x": "外国人とくに西欧の人に対して、\n一種の劣等感があるのではないか。"}, {"t": 1466.6666666666667, "x": "劣等感？"}, {"t": 1467.6, "x": "遠慮しすぎて、大事な人を\n帰してしまったのでは、という意味だ。"}, {"t": 1471.45, "x": "議員は松本清張の小説にも触れている。"}, {"t": 1474.1166666666666, "x": "この事件をそっくり\nモデルにしたような小説がある、と。"}, {"t": 1477.3, "x": "ただし議員自身、小説は\n小説だと断りながら話している。"}, {"t": 1481.3166666666666, "x": "法務省の局長はなんて答えたの？"}, {"t": 1483.6666666666667, "x": "劣等感は「いささかも持っておりません」。"}, {"t": 1486.1166666666666, "x": "問題は決め手となる証拠を\n集められなかったことにある。"}, {"t": 1489.3166666666666, "x": "それが局長の答えだった。"}, {"t": 1491.1166666666666, "x": "議員はさらにほかの例も挙げる。"}, {"t": 1492.9333333333334, "x": "取り調べ中の外国人が、飛行機で\n本国へ帰ってしまった話だ。"}, {"t": 1497.3, "x": "新聞で見ただけでも3つ、4つ知っている、と。"}, {"t": 1500.2166666666667, "x": "この事件だけじゃなかったのね。"}, {"t": 1502.1833333333334, "x": "議員の言い方を借りれば、少し\nルーズではないか、となる。"}, {"t": 1505.55, "x": "そしてこう求めた。"}, {"t": 1506.8333333333333, "x": "議員はこうも言っている。"}, {"t": 1508.2, "x": "犯人が挙がらないまま終わるのでは、\n国民として納得できない。"}, {"t": 1511.9333333333334, "x": "ベルギー政府に掛け合ってもう\n一度来てもらうとか、方法はあるはずだ。"}, {"t": 1516.0166666666667, "x": "呼び戻すことまで考えてたのね。"}, {"t": 1518.25, "x": "今後そういうことが起きないよう、\n手を打つ決心をしてほしい。"}, {"t": 1522.1833333333334, "x": "この日の答弁の中に、記録で\nいちばん重い一文がある。"}, {"t": 1525.6, "x": "法務省の局長はこう言った。"}, {"t": 1527.45, "x": "人一人が死んでいる。"}, {"t": 1528.8833333333334, "x": "犯人が挙がらないことは、捜査の側に\nとって「借りになっている」。"}, {"t": 1532.8333333333333, "x": "借り……。"}, {"t": 1533.4333333333334, "x": "返さなければならないもの、という言い方だ。"}, {"t": 1536.0166666666667, "x": "局長は真相の究明に努める考えを\n今も固く持っている、と続けた。"}, {"t": 1540.6, "x": "そして出国の決まりについて、こうまとめている。"}, {"t": 1543.5333333333333, "x": "外国人を国に迎えるかどうかは、\n日本が絶対的な権利で決められる。"}, {"t": 1547.9666666666667, "x": "だが出国は旅券を確かめて出すだけだ。"}, {"t": 1550.7, "x": "来るときは選べるのに、出るときは止められない……。"}, {"t": 1553.5166666666667, "x": "局長はそれを「真にやむを得ない盲点」と呼んだ。"}, {"t": 1556.6, "x": "この事件をきっかけに、内部で\n議論もしていると明かしている。"}, {"t": 1560.1, "x": "ただすぐに法律を変えるのは難しい、とも言った。"}, {"t": 1563.1, "x": "出国の扱いには、国どうしの慣行もあるからだ。"}, {"t": 1566.4666666666667, "x": "盲点だって分かってても、すぐには塞げないのね。"}, {"t": 1569.6333333333334, "x": "その盲点に新しい条文が\n入るのは、ずっと先のことになる。"}, {"t": 1574.1, "x": "ここで会議録を年の順に\n引いていて気づいたことがある。"}, {"t": 1577.3, "x": "年がたつほど、国会での言い方が変わっていくんだ。"}, {"t": 1580.5666666666666, "x": "変わる？"}, {"t": 1581.2833333333333, "x": "1964年5月26日、参議院の法務委員会。"}, {"t": 1585.3833333333334, "x": "ある議員が、神父が事件を起こしたと\n決めつけるような聞き方をした。"}, {"t": 1589.4, "x": "答えたのはやはり法務省の刑事局長だ。"}, {"t": 1592.0166666666667, "x": "警察はもう少し日本にいてもらって\n調べを徹底したかった。"}, {"t": 1595.6666666666667, "x": "だが「何としましてもきめ手がない」。"}, {"t": 1597.9166666666667, "x": "そのため、出ていく人を押さえられなかった。"}, {"t": 1600.6333333333334, "x": "政府の答えはずっと同じなのね。"}, {"t": 1602.8, "x": "そうだ。変わったのは質問する側の言い方だ。"}, {"t": 1605.6666666666667, "x": "さらに1970年6月18日。"}, {"t": 1608.45, "x": "沖縄の問題を話し合う委員会だ。"}, {"t": 1610.7666666666667, "x": "大臣の1人が、昔の例としてこの事件に触れた。"}, {"t": 1614.1833333333334, "x": "犯人と目された人が「外交官特権」で帰国したと。"}, {"t": 1618.15, "x": "外交官特権？　それさっきの話と違わない？"}, {"t": 1621.3, "x": "違う。1959年の会議録では、神父は\nベルギーの旅券で正規に出国している。"}, {"t": 1626.9666666666667, "x": "入国管理局長は日本の外務省は\n「全然関係ございません」と答えていた。"}, {"t": 1631.9166666666667, "x": "外交官の特権という言葉は、\n1959年の記録のどこにも無い。"}, {"t": 1636.7666666666667, "x": "11年で話がすり替わっちゃったのね。"}, {"t": 1639.4, "x": "国会の場でさえそうなった。"}, {"t": 1641.1, "x": "だからこの回は、1959年の記録に\n戻って確かめている。"}, {"t": 1645.5833333333333, "x": "言葉って、少しずつ形が変わっていくのね。"}, {"t": 1648.65, "x": "だからこそ、最初の記録に戻る意味がある。"}, {"t": 1652.0, "x": "当時の法律では、殺人罪の時効は15年だった。"}, {"t": 1655.4, "x": "死刑のある罪は15年と、\n刑事訴訟法で決まっていたからだ。"}, {"t": 1659.2333333333333, "x": "1959年3月から数えると、\n15年後は1974年3月になる。"}, {"t": 1664.95, "x": "事件はその月に時効を迎えた。"}, {"t": 1667.1666666666667, "x": "分からないまま終わっちゃったのね。"}, {"t": 1669.15, "x": "法の上ではもう誰も裁けなくなった。"}, {"t": 1671.45, "x": "羽田の夜から数えてもほぼ15年だ。"}, {"t": 1673.9333333333334, "x": "その間神父はカナダで、学校や\n病院、教会の仕事を続けていた。"}, {"t": 1678.25, "x": "国会では「借り」とまで言われた事件だった。"}, {"t": 1681.05, "x": "その借りは返されないまま期限が来た。"}, {"t": 1683.5, "x": "……被害者の家族はどう思ったのかしら。"}, {"t": 1685.8666666666666, "x": "それを伝える一次の記録を、\n今回は見つけられなかった。"}, {"t": 1689.3166666666666, "x": "だからここで想像を語るのはやめておく。"}, {"t": 1691.7, "x": "会議録に残っているのは、議員が\n最初に遺族の感情を挙げたことだけだ。"}, {"t": 1696.2, "x": "うん。分からないことは、\n分からないままでいいと思う。"}, {"t": 1699.8, "x": "ではあの盲点はその後どうなったのか。"}, {"t": 1701.9833333333333, "x": "条文が入ったのは1981年だ。"}, {"t": 1704.75, "x": "羽田の夜から22年後になる。"}, {"t": 1706.9833333333333, "x": "出入国管理令が改められ、\n第25条の2という条文ができた。"}, {"t": 1711.3166666666666, "x": "見出しは「出国確認の留保」。"}, {"t": 1713.55, "x": "いまの法律の名前でいえば、\n出入国管理及び難民認定法の条文だ。"}, {"t": 1718.35, "x": "留保って保留みたいなもの？"}, {"t": 1720.1666666666667, "x": "そうだ。出国を認める\n手続きを、いったん止めておける。"}, {"t": 1723.6666666666667, "x": "止めておける時間は、\n手続きをしたときから24時間までだ。"}, {"t": 1727.45, "x": "1981年6月の参議院で、\n法務省の担当者はこう説明している。"}, {"t": 1732.6166666666666, "x": "今は逮捕状が出ている人が\n出国しようとしても、入管令に手当てが無い。"}, {"t": 1737.1, "x": "審査官は事実を知っていても、\n証印を押さざるを得ない。"}, {"t": 1740.5, "x": "1959年の局長と、同じことを言ってるわね。"}, {"t": 1744.2666666666667, "x": "担当者は、日本人には留保が\n要らない理由も説明している。"}, {"t": 1748.0, "x": "日本人なら、旅券を返させる\n仕組みが旅券法にあるからだ。"}, {"t": 1751.6666666666667, "x": "つまりこの留保は、\n外国人のための決まりとして作られた。"}, {"t": 1755.3666666666666, "x": "22年たっても、同じ穴が空いていたということだ。"}, {"t": 1758.55, "x": "ただここで条文の中身をよく見てほしい。"}, {"t": 1760.9166666666667, "x": "止められるのは、関係機関から\n通知が来ている人だけだ。"}, {"t": 1764.45, "x": "重い罪で訴追されている人。"}, {"t": 1766.4, "x": "あるいは、逮捕状や勾留状などが出ている人だ。"}, {"t": 1769.4833333333333, "x": "じゃああの神父は？"}, {"t": 1770.65, "x": "1959年の神父には、逮捕状も何も出ていなかった。"}, {"t": 1774.7166666666667, "x": "だから今の条文に当てはめても、\n留保の対象には当たらない。"}, {"t": 1778.4833333333333, "x": "今の法律でも止められないってこと？"}, {"t": 1780.8166666666666, "x": "条文どおりに読めばそうなる。"}, {"t": 1782.5166666666667, "x": "止められるのは疑いが固まった\n人だけ。そこは変わっていない。"}, {"t": 1786.2166666666667, "x": "つまりあの夜の答えは、\n法律の穴だけの話ではなかった。"}, {"t": 1789.9333333333334, "x": "止めるだけの疑いを誰も示せなかった。"}, {"t": 1792.4166666666667, "x": "会議録は、最初から最後までその一点を言っている。"}, {"t": 1796.2833333333333, "x": "最後に神父のその後を見ておく。"}, {"t": 1798.2, "x": "根拠は2017年にカナダで出された訃報だ。"}, {"t": 1801.2, "x": "神父は1959年にベルギーへ戻った。"}, {"t": 1804.1666666666667, "x": "翌1960年、修道会の上の人の指示で、\nカナダのモントリオールへ渡る。"}, {"t": 1809.2833333333333, "x": "当時の外電は、オーストラリアに行くと伝えていた。"}, {"t": 1812.4333333333334, "x": "行き先まで違って伝わってたのね。"}, {"t": 1814.8166666666666, "x": "その後は、ニューブランズウィック州の学校や\n病院、教会で務めた。"}, {"t": 1818.8166666666666, "x": "訃報によると、1964年には病院と\nその看護学校の司祭になった。"}, {"t": 1823.8, "x": "1969年からは、教会の主任司祭も務めている。"}, {"t": 1827.8833333333334, "x": "1980年からは、港町セント・\nジョンで港の司祭になる。"}, {"t": 1832.1833333333334, "x": "世界中から来る船員たちのための司祭だ。"}, {"t": 1834.9833333333333, "x": "港で船員さんたちの相手をしてたのね。"}, {"t": 1837.6333333333334, "x": "1981年には、\nその町のフランス語の教会の初代主任司祭になった。"}, {"t": 1842.9166666666667, "x": "1990年には、地元の大学から\n名誉博士号を受けている。"}, {"t": 1847.2333333333333, "x": "そして2017年3月17日、自宅で\n亡くなった。96歳だった。"}, {"t": 1852.5, "x": "96歳……。羽田の夜から58年後ね。"}, {"t": 1855.6833333333334, "x": "訃報には、日本で教えたことも、\n雑誌を編集したことも書いてある。"}, {"t": 1859.8666666666666, "x": "だが1959年の事件のことは一言も書かれていない。"}, {"t": 1863.9333333333334, "x": "どうして書かなかったのかしら。"}, {"t": 1865.8666666666666, "x": "それは記録からは分からない。だから\nここで推し量ることもやめておく。"}, {"t": 1869.8166666666666, "x": "生まれ故郷のベルギーの村でも、\n4月2日に追悼のミサが開かれた。"}, {"t": 1874.0833333333333, "x": "葬儀のミサは、自分が初代の主任司祭を\n務めた教会で開かれた。"}, {"t": 1878.4, "x": "埋葬されたのは、セント・\nジョンの墓地にある司祭の区画だ。"}, {"t": 1881.8, "x": "神父が日本の捜査の場にもう\n一度立つことは、最後まで無かった。"}, {"t": 1886.4, "x": "ここで今回読んだ記録を並べておく。"}, {"t": 1888.7, "x": "国会の会議録は6本だ。"}, {"t": 1890.5833333333333, "x": "1959年6月18日、衆議院の法務委員会。"}, {"t": 1894.5333333333333, "x": "羽田の夜の報告がある。"}, {"t": 1896.3, "x": "1960年12月16日、同じく衆議院の法務委員会。"}, {"t": 1900.6, "x": "「借り」と「盲点」の答弁だ。"}, {"t": 1902.75, "x": "5年後の参議院の委員会。ここで\n「きめ手がない」という答弁が出た。"}, {"t": 1906.9666666666667, "x": "1970年6月18日、沖縄の問題の特別委員会。"}, {"t": 1911.45, "x": "「外交官特権」という食い違い。"}, {"t": 1913.65, "x": "そして1981年の5月と6月。"}, {"t": 1916.6, "x": "24時間の留保ができたときの審議だ。"}, {"t": 1919.3833333333334, "x": "政府の答えは、最初から最後まで変わってないのね。"}, {"t": 1922.7166666666667, "x": "疑うに足る資料は無い。"}, {"t": 1924.0666666666666, "x": "決め手が無い。だから止められない。"}, {"t": 1926.15, "x": "6本の会議録は、その線から一度も外れていない。"}, {"t": 1929.4666666666667, "x": "どの会議録も、国立国会図書館の検索システムで\n誰でも読める。"}, {"t": 1933.8833333333334, "x": "日付と委員会の名前が分かれば、すぐにたどり着く。"}, {"t": 1937.2166666666667, "x": "調べようと思えば、私たちでも読めるのね。"}, {"t": 1940.1333333333334, "x": "それともう一つの記録が2017年の訃報だ。"}, {"t": 1943.4, "x": "事件のことが書かれてない訃報ね。"}, {"t": 1945.6166666666666, "x": "会議録と訃報。どちらにも、\nあの事件の答えは書かれていない。"}, {"t": 1950.1, "x": "ねえ最初の話に戻ってもいい？"}, {"t": 1952.1833333333334, "x": "いいぞ。"}, {"t": 1952.85, "x": "羽田の窓口の15分。"}, {"t": 1954.4, "x": "あそこで止めてたら何か変わったのかな。"}, {"t": 1956.95, "x": "議員はもう1時間あればと言った。"}, {"t": 1958.9166666666667, "x": "局長は止めるだけの疑いが無かった、と言った。"}, {"t": 1961.9166666666667, "x": "どちらが正しかったのか、\n記録だけでは決められない。"}, {"t": 1965.2166666666667, "x": "……そうよね。"}, {"t": 1966.05, "x": "ただ記録の中で動かない事実が一つある。"}, {"t": 1968.8166666666666, "x": "3月13日の香港行きの便に、彼女は乗れなかった。"}, {"t": 1972.5166666666667, "x": "採用されて2か月あまり。"}, {"t": 1974.05, "x": "ロンドンから戻って、まだ2週間もたっていなかった。"}, {"t": 1977.35, "x": "初めての乗務の3日前のことだ。"}, {"t": 1979.6833333333334, "x": "本当なら、羽田から飛び立つ側の人だったのね。"}, {"t": 1983.0166666666667, "x": "ロンドンで講習を受けて、初めての便を待っていた。"}, {"t": 1986.1, "x": "そうだ。その羽田から、3\nか月後に重要参考人が発った。"}, {"t": 1990.0833333333333, "x": "その夜窓口で証印を止める条文は無かった。"}, {"t": 1992.9666666666667, "x": "事件は犯人が分からないまま、\n1974年に時効を迎えた。"}, {"t": 1997.35, "x": "法務省の局長の言葉を借りるなら、\n人一人が亡くなっている。"}, {"t": 2001.2833333333333, "x": "その借りはいまも返されていない。"}, {"t": 2003.2833333333333, "x": "忘れないでいることくらいは、できるわよね。"}, {"t": 2005.9333333333334, "x": "ああ。今回は羽田の15分を\n国会の会議録で読み直した回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
