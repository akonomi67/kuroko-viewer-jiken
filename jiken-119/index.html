<script>
const D={"name": "119", "file": "119_編集用", "dur": 2012.95, "segs": [], "subs": [{"t": 0.0, "x": "旅券が1冊。出発まではおよそ15分。"}, {"t": 2.8333333333333335, "x": "1959年6月11日の夜、羽田空港の出国の窓口だ。"}, {"t": 7.883333333333334, "x": "午後7時15分ごろ、1人の神父がそこに現れた。"}, {"t": 11.35, "x": "仲間の神父2、3人と一緒だった。"}, {"t": 13.616666666666667, "x": "国籍はベルギー。手にはベルギーの旅券がある。"}, {"t": 16.316666666666666, "x": "乗るのは午後7時半に出るエールフランス機だ。"}, {"t": 19.066666666666666, "x": "あと15分で飛んじゃう便じゃない？"}, {"t": 21.05, "x": "そうだ。そして窓口の審査官は、その名前に気づいた。"}, {"t": 24.7, "x": "警察から前もって知らせが届いていた人物だった。"}, {"t": 27.916666666666668, "x": "3か月前、東京で27歳の女性が亡くなっている。"}, {"t": 31.5, "x": "神父はその事件の重要参考人だったんだ。"}, {"t": 34.4, "x": "それで窓口で止めたの？"}, {"t": 36.1, "x": "止められなかった。止める条文がどこにも無かった。"}, {"t": 39.15, "x": "神父はそのまま飛行機に乗り、日本へは戻らなかった。"}, {"t": 42.46666666666667, "x": "この夜のことを、国会は1週間後に問いただしている。"}, {"t": 45.766666666666666, "x": "今回はその会議録を軸に、BOAC\nスチュワーデス事件を追う。"}, {"t": 49.63333333333333, "x": "先にこの回の約束を一つ置いておく。"}, {"t": 52.166666666666664, "x": "事件は犯人が分からないまま、\n1974年に時効になった。"}, {"t": 56.5, "x": "神父も2017年に、96歳で亡くなっている。"}, {"t": 59.96666666666667, "x": "国会では、神父を疑うに足る\n資料は無いという答弁が何度も出た。"}, {"t": 64.03333333333333, "x": "だからこの回は、誰がやったかを当てる回ではない。"}, {"t": 67.13333333333334, "x": "じゃあ何を追う回なの？"}, {"t": 68.58333333333333, "x": "あの夜なぜ止められなかったのか。\nその記録を読む回だ。"}, {"t": 72.55, "x": "時計を3か月戻す。1959年3月10日の朝だ。"}, {"t": 76.76666666666667, "x": "東京都杉並区を流れる善福寺川で、\n1人の女性が見つかった。"}, {"t": 81.01666666666667, "x": "当時の新聞によると、時刻は朝7時40分ごろ。"}, {"t": 84.5, "x": "女性は27歳。すでに亡くなっていた。"}, {"t": 87.3, "x": "27歳……。どんな人だったの？"}, {"t": 89.58333333333333, "x": "イギリスの航空会社、BOACのスチュワーデスだ。"}, {"t": 92.75, "x": "いまのブリティッシュ・\nエアウェイズにつながる会社だな。"}, {"t": 95.6, "x": "その年の1月5日に採用されたばかりだった。"}, {"t": 98.66666666666667, "x": "入社してすぐ、ロンドンの本社で講習を受けている。"}, {"t": 101.75, "x": "日本に戻ったのは2月27日。"}, {"t": 104.16666666666667, "x": "そして3月13日には、初めての仕事が決まっていた。"}, {"t": 107.95, "x": "香港行きの飛行機に乗ることになっていたんだ。"}, {"t": 110.85, "x": "初めて乗る日の3日前……？"}, {"t": 112.65, "x": "ああ。その3日前の朝に川で見つかった。"}, {"t": 115.3, "x": "彼女は3月8日に下宿を出たきり、\n行方が分からなくなっていた。"}, {"t": 119.36666666666666, "x": "出かけるときは、教会と\nおじさんの所へ行くと話していた。"}, {"t": 122.96666666666667, "x": "だがそのどちらにも着いていない。"}, {"t": 124.81666666666666, "x": "見つかった直後には、自殺という見方もあった。"}, {"t": 127.83333333333333, "x": "それが解剖のあと、殺人の捜査に切り替わる。"}, {"t": 130.81666666666666, "x": "3月12日、地元の高井戸署に\n特別捜査本部が置かれた。"}, {"t": 135.1, "x": "自殺じゃなくて事件だったのね。"}, {"t": 137.2, "x": "この回では彼女の名前は出さない。"}, {"t": 139.3, "x": "国会の会議録には名前が残っているが、\nここでは27歳の女性と呼ぶ。"}, {"t": 144.05, "x": "うん。それでいいと思う。"}, {"t": 146.06666666666666, "x": "この事件が起きた1959年が、\nどんな年だったかも見ておく。"}, {"t": 150.45, "x": "翌年に日米安保条約の改定を控え、\n反対の運動が表に出始めていた。"}, {"t": 155.51666666666668, "x": "4月10日には、当時の皇太子の結婚式が行われる。"}, {"t": 159.16666666666666, "x": "事件のおよそ1か月後のことだ。"}, {"t": 161.38333333333333, "x": "日本中がお祝いの空気だったころね。"}, {"t": 163.76666666666668, "x": "飛行機の旅はまだ一般的ではなかった。"}, {"t": 166.35, "x": "スチュワーデスは、\n当時あこがれの職業と言われていた。"}, {"t": 169.6, "x": "そのあこがれの仕事に就いたばかりだったのね。"}, {"t": 172.38333333333333, "x": "そういう時代の東京でこの事件は起きた。"}, {"t": 175.5, "x": "捜査本部は、彼女と親しかった人を順に当たっていく。"}, {"t": 179.03333333333333, "x": "その中にベルギー国籍の神父がいた。"}, {"t": 181.48333333333332, "x": "重要参考人とされた神父で、当時38歳だ。"}, {"t": 184.88333333333333, "x": "当時の新聞によると、彼女の手帳に\n神父の名前があった。"}, {"t": 188.53333333333333, "x": "神父は東京の修道院に住んでいた。"}, {"t": 190.83333333333334, "x": "修道院が営む出版社、ドン・\nボスコ社で会計を受け持っていた。"}, {"t": 194.98333333333332, "x": "出版社にいる神父さんなのね。"}, {"t": 197.1, "x": "のちの訃報には、日本で教師と\nカトリック雑誌の編集をしたとある。"}, {"t": 201.18333333333334, "x": "司祭になったのも東京で、1953年のことだ。"}, {"t": 204.86666666666667, "x": "つまり日本で長く暮らしてきた人だった。"}, {"t": 207.46666666666667, "x": "国会で警察庁の刑事局長が2人の間柄を説明している。"}, {"t": 211.55, "x": "被害者と「非常に親しい間柄」だったと。"}, {"t": 214.7, "x": "親しかったから、話を聞く相手になったってこと？"}, {"t": 218.03333333333333, "x": "そうだ。局長は同じ答弁でこうも言っている。"}, {"t": 220.81666666666666, "x": "神父が殺したと「疑われるに至る\n資料はいまだ発見されていない」。"}, {"t": 224.9, "x": "「殺人被疑者だということは言えません」とも続けた。"}, {"t": 228.13333333333333, "x": "疑ってるわけじゃないの？"}, {"t": 229.76666666666668, "x": "少なくとも、国会での説明はずっとその線だった。"}, {"t": 233.13333333333333, "x": "彼女のことをよく知る人として、話を聞きたい。"}, {"t": 236.25, "x": "それがこの事件での「重要参考人」という\n言葉の中身だ。"}, {"t": 240.05, "x": "この局長の答弁は、この先も何度も出てくる。"}, {"t": 243.11666666666667, "x": "警察の側の説明は、ほとんどこの人の口から語られた。"}, {"t": 247.63333333333333, "x": "神父の存在が世の中に出たのは、\n新聞の記事からだった。"}, {"t": 251.31666666666666, "x": "当時の新聞を読み直した記事に\nよると、4月18日の毎日新聞の朝刊だ。"}, {"t": 256.48333333333335, "x": "社会面のトップにこんな見出しが載った。"}, {"t": 258.9, "x": "「捜査線上に外人浮ぶ」。"}, {"t": 260.78333333333336, "x": "まだ名前は出てないの？"}, {"t": 262.28333333333336, "x": "このときは「聖職にあるベルギー人」とだけ\n書かれていた。"}, {"t": 265.75, "x": "名前が出たのは5月6日の夕刊だ。"}, {"t": 268.06666666666666, "x": "各紙が一斉に神父の実名を出して報じた。"}, {"t": 271.03333333333336, "x": "被疑者でもないのに、名前が出ちゃったのね。"}, {"t": 273.71666666666664, "x": "そういうことだ。いまなら、ごく\n特別な場合でないと考えにくい。"}, {"t": 277.6166666666667, "x": "前の日の5月5日、捜査員が修道院を訪ねていた。"}, {"t": 281.15, "x": "話を聞くため、警察まで来てほしいと頼んだんだ。"}, {"t": 284.43333333333334, "x": "神父と教会の側はそれを断った。"}, {"t": 286.76666666666665, "x": "教会の中なら構わないが、\n警察へ行くのは困る、という返事だった。"}, {"t": 291.23333333333335, "x": "断ったことまで新聞に出ちゃったの？"}, {"t": 293.6333333333333, "x": "出た。見出しには\n「任意同行こばむ」という言葉もあった。"}, {"t": 297.26666666666665, "x": "任意の同行は、断っても法に触れるものではない。"}, {"t": 300.31666666666666, "x": "だが見出しになると受け取られ方が変わってしまう。"}, {"t": 303.1333333333333, "x": "修道院の側は、事件とは全く関係が無いと\nはっきりしている、と答えた。"}, {"t": 308.0, "x": "記事の書き方ひとつで、印象が決まっちゃうのね。"}, {"t": 311.6666666666667, "x": "警察庁の局長は、捜査の進め方も\n国会で説明している。"}, {"t": 315.8333333333333, "x": "こういう事件では、大きな軸が2本あるという。"}, {"t": 318.6, "x": "1本目は、被害者の状況を明らかにすること。"}, {"t": 321.65, "x": "亡くなるまでの行動を、できるだけ細かくたどる。"}, {"t": 324.55, "x": "2本目は、現場に残った物の証拠を集めることだ。"}, {"t": 327.8666666666667, "x": "その2本から被疑者を割り出していく。"}, {"t": 330.2, "x": "足どりと物の証拠ね。"}, {"t": 331.85, "x": "この事件では、2本目の物の証拠が少なかった。"}, {"t": 335.05, "x": "局長も物的な資料は比較的少ないと認めている。"}, {"t": 338.53333333333336, "x": "そのぶん、関係する人たちの話を\n一つずつ突き合わせていった。"}, {"t": 342.6666666666667, "x": "誰が何を言ったかを比べていくのね。"}, {"t": 345.01666666666665, "x": "その中で、いちばん詳しく話を聞く\n相手になったのが神父だった。"}, {"t": 349.1166666666667, "x": "ただ局長は、別の議員の質問にこう答えている。"}, {"t": 352.35, "x": "被疑事実と結びつけて事情を\n聞いた人は、1人もいない。"}, {"t": 355.93333333333334, "x": "神父も含めて、疑いの相手として\n聞いたわけではないということだ。"}, {"t": 360.03333333333336, "x": "誰も被疑者にならないまま、捜査が進んでたのね。"}, {"t": 363.8333333333333, "x": "神父への聴取は、すんなり始まったわけではない。"}, {"t": 366.78333333333336, "x": "警察庁の刑事局長も、最初は警察に行くのは\n困ると言われたと話している。"}, {"t": 371.71666666666664, "x": "間に入ったのは、神父についた弁護人たちだ。"}, {"t": 374.76666666666665, "x": "弁護人の働きかけで、神父は\n日本の捜査に協力すると決めた。"}, {"t": 379.01666666666665, "x": "聴取が始まったのは5月11日。"}, {"t": 381.26666666666665, "x": "合計で5日間になる。"}, {"t": 383.01666666666665, "x": "5日間も？　どこで聞いたの？"}, {"t": 385.01666666666665, "x": "そこにも条件があった。"}, {"t": 386.56666666666666, "x": "新聞に自分の顔がいっぱい\n出るのは、立場の上で困る。"}, {"t": 389.98333333333335, "x": "神父の側がそう伝えると警察は\n「大へんもっとも」と受け止めた。"}, {"t": 394.1333333333333, "x": "警視庁の庁舎に来ればどうしても目立つ。"}, {"t": 396.6, "x": "そこで警視庁が管理している別の建物を使った。"}, {"t": 399.8, "x": "局長の言葉では「比較的第三者に\nわかりにくい場所」だ。"}, {"t": 403.8666666666667, "x": "ずいぶん気をつかってるのね。"}, {"t": 405.6166666666667, "x": "実名が新聞に出たあとだから、そこは無理もない。"}, {"t": 408.6666666666667, "x": "当時の新聞によると、聴取は\n5月11日から13日までと、20日と21日。"}, {"t": 414.28333333333336, "x": "その間も神父の話は変わらなかったという。"}, {"t": 417.01666666666665, "x": "警察は聴取とあわせて、別の線も追っていた。"}, {"t": 420.0, "x": "彼女が最後に何を食べたかから、\n足どりを割り出す捜査だ。"}, {"t": 423.65, "x": "それでも局長は6月の国会でこう言った。"}, {"t": 426.4, "x": "被疑者が誰か「割り出すことはできない状態」だと。"}, {"t": 429.8, "x": "5日間聞いても何も決まらなかったのね。"}, {"t": 432.96666666666664, "x": "ここで羽田の夜につながる準備が一つある。"}, {"t": 435.6666666666667, "x": "警察は入国管理局に、ある頼みごとをしていた。"}, {"t": 438.95, "x": "神父が国へ帰りそうになったら、知らせてほしい。"}, {"t": 442.0, "x": "それって止めてってこと？"}, {"t": 443.6166666666667, "x": "違う。知らせてほしいだけだ。"}, {"t": 445.51666666666665, "x": "しかも局長は国会で\n「口頭でございますが」と付け加えている。"}, {"t": 449.53333333333336, "x": "文書ではなく口で頼んだ連絡だった。"}, {"t": 452.01666666666665, "x": "入国管理局長の説明では、手配は\n警視庁の蒲田署から出ていた。"}, {"t": 456.4166666666667, "x": "羽田空港を受け持っていた警察署だ。"}, {"t": 458.95, "x": "知らせが来たらどうするつもりだったの？"}, {"t": 461.26666666666665, "x": "そこがのちの国会でいちばん問われた所になる。"}, {"t": 464.1333333333333, "x": "局長はもう一つ別の方法も考えたと話している。"}, {"t": 467.51666666666665, "x": "本人から承諾書をとるという案だ。"}, {"t": 469.8666666666667, "x": "承諾書？"}, {"t": 470.85, "x": "犯人が分かるまで日本にいます、と\n判を押してもらう紙だ。"}, {"t": 474.35, "x": "だが局長はそこまで求めなかった。"}, {"t": 476.65, "x": "理由を聞かれて「あまり人権上につい」と\n言葉を濁している。"}, {"t": 480.4, "x": "被疑者でもない人に、日本にいろと判を押させる。"}, {"t": 483.3833333333333, "x": "それは行き過ぎだという判断だった。"}, {"t": 485.6333333333333, "x": "やさしい判断にも、甘い判断にも聞こえるわね。"}, {"t": 488.78333333333336, "x": "どちらに聞こえるか。それが\n国会でぶつかることになる。"}, {"t": 492.7, "x": "では6月11日の夜を時刻どおりに追おう。"}, {"t": 495.45, "x": "根拠は6月18日の国会での入国管理局長の報告だ。"}, {"t": 499.68333333333334, "x": "午後7時15分ごろ。"}, {"t": 501.05, "x": "神父は入管の羽田出張所に現れた。"}, {"t": 503.78333333333336, "x": "受け持ちの入国審査官は、型どおりに書類を見ていく。"}, {"t": 507.18333333333334, "x": "出国記録、旅券それに外国人登録証の3つだ。"}, {"t": 510.8666666666667, "x": "そこで審査官は気づいた。"}, {"t": 512.5333333333333, "x": "蒲田署から手配が来ていた、重要参考人の神父だ。"}, {"t": 516.15, "x": "気づいたのね！"}, {"t": 517.2166666666667, "x": "審査官はすぐ、警察の羽田支所に電話をかけた。"}, {"t": 520.5166666666667, "x": "至急どうするかの返事がほしいと頼んだ。"}, {"t": 522.9833333333333, "x": "ところがすぐには返事が来ない。"}, {"t": 524.9833333333333, "x": "飛行機は待ってくれないわよね？"}, {"t": 526.95, "x": "待ってくれなかった。"}, {"t": 528.2, "x": "エールフランスの係員が、何度も聞いてくる。"}, {"t": 530.95, "x": "「もう乗客を搭乗させてもよいか」。"}, {"t": 532.9833333333333, "x": "局長の報告はこれを「督促」という言葉で書いている。"}, {"t": 536.6, "x": "審査官は「もうしばらく待ってくれ」と答えた。"}, {"t": 539.6, "x": "そして自分の足で、警察の羽田支所まで向かった。"}, {"t": 543.0333333333333, "x": "審査官さんがんばったのね。"}, {"t": 544.9, "x": "事の重さを考えて、と報告には書かれている。"}, {"t": 548.55, "x": "支所には巡査部長がいた。"}, {"t": 550.2333333333333, "x": "巡査部長は、そこからすぐ本署へ連絡を入れた。"}, {"t": 553.2833333333333, "x": "返ってきた答えはこうだ。"}, {"t": 554.9, "x": "「今のところ阻止する手が打てない」。"}, {"t": 556.9666666666667, "x": "……打てないなのね。"}, {"t": 558.1166666666667, "x": "審査官はその答えを持って窓口へ戻る。"}, {"t": 560.7333333333333, "x": "ところがここで行き違いが起きる。"}, {"t": 562.6666666666666, "x": "別の巡査が、同じ答えを伝えに\n入管の窓口へ来ていたんだ。"}, {"t": 566.6833333333333, "x": "審査官が支所に出ている間に、入れ違いでな。"}, {"t": 569.7333333333333, "x": "同じことを2人が伝えに走ってたの？"}, {"t": 572.2666666666667, "x": "報告を読むかぎりそうなる。"}, {"t": 573.9166666666666, "x": "警察からの答えは2回とも同じだった。"}, {"t": 576.5, "x": "止める手は無い。"}, {"t": 577.4833333333333, "x": "神父の側の動きはこう書かれている。"}, {"t": 579.6666666666666, "x": "「若干の時間を入管のデスクで空費したのみ」。"}, {"t": 582.5, "x": "そして規定どおり、旅券に出国の証印を受けた。"}, {"t": 585.6333333333333, "x": "午後7時半発のエールフランス機に乗り込む。"}, {"t": 588.35, "x": "報告の結びは「正規に出国したもの」だ。"}, {"t": 591.5666666666667, "x": "正規……。ずるをしたわけじゃないのね。"}, {"t": 593.7833333333333, "x": "そうだ。手続きの上では何一つ欠けていなかった。"}, {"t": 596.9833333333333, "x": "窓口に現れてからおよそ15分のことだ。"}, {"t": 600.35, "x": "でもどうして止められないの？"}, {"t": 601.8166666666667, "x": "手配まで来てたのに。"}, {"t": 603.3666666666667, "x": "入国管理局長はそのまま条文の話をした。"}, {"t": 606.45, "x": "出入国管理令の第25条だ。"}, {"t": 608.8, "x": "外国人は、旅券に出国の証印を\n受けなければ出国できない。"}, {"t": 613.0166666666667, "x": "じゃあ証印を押さなければいいじゃない。"}, {"t": 615.0166666666667, "x": "そうはいかないというのが局長の説明だ。"}, {"t": 617.5333333333333, "x": "有効な旅券で、正しく\n手続きをした人には、必ず押す。"}, {"t": 621.4166666666666, "x": "その場で身元を調べたり、捜査の\nまねごとをしたりはできない。"}, {"t": 624.9666666666667, "x": "外国人が実際に出られないのは、\n1つの場合だけだという。"}, {"t": 628.6333333333333, "x": "逮捕状か拘引状が出て、身柄が\n押さえられているときだ。"}, {"t": 632.1666666666666, "x": "逮捕状が無ければ、誰でも出られるってこと？"}, {"t": 635.0, "x": "局長はもっと強い例まで出している。"}, {"t": 637.2666666666667, "x": "保釈中の人でさえ、正しい旅券を\n持っていれば出国を認める。"}, {"t": 641.25, "x": "保釈が取り消されていない限り、そうなるという。"}, {"t": 644.2, "x": "保釈中でも……。"}, {"t": 645.3833333333333, "x": "局長もそれはおかしいという\n声が出ることは分かっていた。"}, {"t": 648.55, "x": "ただと続ける。"}, {"t": 649.6333333333333, "x": "裁判所を通さずに、役所の判断で\n人の自由を縛ることになる。"}, {"t": 653.7, "x": "それは「非常に重要な研究を要する問題」だと。"}, {"t": 657.15, "x": "止めるのも、止めないのも、どっちも重いのね。"}, {"t": 660.5833333333334, "x": "同じ委員会で、法務省の刑事局長も条文を説明した。"}, {"t": 664.3666666666667, "x": "こちらもこの先で何度も答弁に立つ人だ。"}, {"t": 667.15, "x": "法務省の局長は証印を「一種の確認行為」と呼んだ。"}, {"t": 670.9166666666666, "x": "確認行為って何を確認するの？"}, {"t": 673.2666666666667, "x": "旅券が有効かどうか。そして本人に間違いがないか。"}, {"t": 676.6666666666666, "x": "確かめる中身はほぼそれだけだという。"}, {"t": 678.95, "x": "それが確かめられたらどうするか。"}, {"t": 680.9333333333333, "x": "局長の言葉は「ちゅうちょなく、\n遅滞なく」押すべきものだ。"}, {"t": 684.8166666666667, "x": "迷っちゃいけないのね。"}, {"t": 686.2666666666667, "x": "逆に言うと迷える場面は限られている。"}, {"t": 688.5833333333334, "x": "本人が来ていない。代わりの人が来た。"}, {"t": 691.0666666666667, "x": "あるいは身柄がすでに押さえられている。"}, {"t": 693.15, "x": "そういうときだけ、証印を受ける前提が欠ける。"}, {"t": 696.0166666666667, "x": "あの夜の神父はそのどれにも当たらない。"}, {"t": 698.3, "x": "本人が自分の旅券を持って、窓口に立っていた。"}, {"t": 701.6166666666667, "x": "それなら押すしかないわけね。"}, {"t": 703.4166666666666, "x": "局長は25条が「唯一の規制規定」だとも言っている。"}, {"t": 707.15, "x": "外国人の出国を縛る決まりは、\nほかに無かったということだ。"}, {"t": 711.0166666666667, "x": "この条文が今の時代に合っているかは、検討が要る。"}, {"t": 714.1666666666666, "x": "局長はそうも述べている。"}, {"t": 716.3833333333333, "x": "羽田の夜から一夜明けた6月12日。"}, {"t": 719.0666666666667, "x": "この日の夕刊は、各紙そろって\n社会面のトップがこの話だった。"}, {"t": 723.2166666666667, "x": "朝日新聞は、重要参考人とされた\n神父の帰国を「警視庁はショック」と伝えた。"}, {"t": 728.5833333333334, "x": "読売新聞は「スチュワーデス殺し迷宮入りか」。"}, {"t": 731.7166666666667, "x": "警察にも知らされてなかったの？"}, {"t": 733.8666666666667, "x": "毎日新聞の見出しには\n「捜査本部に通知なし」とある。"}, {"t": 737.5333333333333, "x": "同じ紙面には、警視庁の刑事部長の談話も載った。"}, {"t": 740.8666666666667, "x": "まだ調べなければならないことが\n残っているので、大変遺憾だ。"}, {"t": 744.7166666666667, "x": "警察のほうも、寝耳に水だったのね。"}, {"t": 747.4, "x": "修道会の側は新聞各社に理由を伝えた。"}, {"t": 750.2666666666667, "x": "「疲労が甚だしいので」。"}, {"t": 751.8, "x": "神父が属していたのは、サレジオ会という修道会だ。"}, {"t": 755.1166666666667, "x": "さらに偶然が一つ重なっていた。"}, {"t": 757.35, "x": "同じエールフランス機に、\n読売新聞の記者が乗り合わせていたんだ。"}, {"t": 761.35, "x": "えっ同じ飛行機に？"}, {"t": 762.8166666666667, "x": "外国へ赴任する途中だったという。"}, {"t": 764.9833333333333, "x": "記者の問いに神父はこう答えている。"}, {"t": 767.0833333333334, "x": "帰国はサレジオ会の命令で、\n病気と両親の見舞いを兼ねている。"}, {"t": 770.8833333333333, "x": "日本も日本人も好きで、できたら\n2、3か月のうちに戻りたい。"}, {"t": 774.8833333333333, "x": "戻るつもりだったのね。"}, {"t": 776.4833333333333, "x": "そう話していた。"}, {"t": 777.6166666666667, "x": "だが神父がその後、日本の土を踏むことは無かった。"}, {"t": 780.8666666666667, "x": "少なくとも、それを示す記録は見つからない。"}, {"t": 784.4, "x": "1週間後の6月18日。"}, {"t": 786.3666666666667, "x": "衆議院の法務委員会が開かれた。"}, {"t": 788.6333333333333, "x": "議題は法務行政と外国人の出入国だ。"}, {"t": 791.5666666666667, "x": "最初に質問した議員は、新聞の話から切り出した。"}, {"t": 795.1666666666666, "x": "12日の各紙は一斉に、重要参考人の帰国を伝えた。"}, {"t": 799.0833333333334, "x": "あれを読むと捜査が\n「迷宮に入ったような感じ」がする。"}, {"t": 802.55, "x": "国民の疑いを解くために、説明してほしい、と。"}, {"t": 805.9, "x": "みんなが思ってたことを聞いたのね。"}, {"t": 808.0333333333333, "x": "ここで警察庁の局長が、長い報告をしている。"}, {"t": 811.2666666666667, "x": "これまでの話の多くは、この報告から取っている。"}, {"t": 814.3666666666667, "x": "報告の終わりで局長はこう認めた。"}, {"t": 816.6333333333333, "x": "遠くにいる人から話を聞き直すのは、時間がかかる。"}, {"t": 820.1166666666667, "x": "また聞きになれば、捜査としては難しさも増す。"}, {"t": 823.3166666666667, "x": "そこは認めてるのね。"}, {"t": 824.8666666666667, "x": "認めている。そのうえで、帰国を\n抑える方法は無かったと言った。"}, {"t": 828.6833333333333, "x": "議員は食い下がる。"}, {"t": 829.8166666666667, "x": "外国人だからいつ帰るか分からない。"}, {"t": 832.1333333333333, "x": "それなら本国の大使館に\n連絡するとか、手を打てたはずだ。"}, {"t": 835.8333333333334, "x": "局長の答えはまたしても資料の話になる。"}, {"t": 838.65, "x": "外交の窓口を通して頼むには、\n相当の疑いを示せないといけない。"}, {"t": 843.0166666666667, "x": "その資料が無いのに頼めば、\n本人にとって大きな迷惑になる。"}, {"t": 846.9833333333333, "x": "疑いが無いから頼めないってことね。"}, {"t": 849.3666666666667, "x": "そうだ。この理屈が委員会の最後まで続く。"}, {"t": 852.8166666666667, "x": "委員会では、入国管理局にも厳しい質問が飛んだ。"}, {"t": 856.3333333333334, "x": "ある議員は自分の経験と比べている。"}, {"t": 858.6166666666667, "x": "労働組合の人が海外の会議に出るとき、\n役所はなかなか許可しない。"}, {"t": 863.0333333333333, "x": "それなのに、殺人事件の重要参考人は、\nその日の夕方に出してしまう。"}, {"t": 867.9166666666666, "x": "扱いが逆じゃないかってこと？"}, {"t": 869.9, "x": "そういう怒りだ。"}, {"t": 870.9666666666667, "x": "せめて2、3日は手続きを\n止めて、慎重にやるべきだった。"}, {"t": 874.5833333333334, "x": "局長に電話で\n問い合わせるくらいは、するべきだった、とも言った。"}, {"t": 878.4333333333333, "x": "入国管理局長の答えはこうだ。"}, {"t": 880.65, "x": "法律に沿った手続きを守ることが、いちばん大事だ。"}, {"t": 884.0, "x": "窓口の係官が一人一人、自分の考えで\n判断するようになると、かえって危ない。"}, {"t": 889.4666666666667, "x": "かえって危ない？"}, {"t": 890.6, "x": "係官によって、止めたり止めなかったりが\nばらつく、ということだろう。"}, {"t": 894.7, "x": "止めたいなら、条文そのものを変えるしかない。"}, {"t": 897.4, "x": "疑いの知らせを受けたら止められる、という\n規定があれば別だ、と。"}, {"t": 901.2166666666667, "x": "議員は重ねて、遺憾な点は無かったのかと聞いた。"}, {"t": 904.3333333333334, "x": "局長は「そこまで掘り下げて\n判断をいたすことは遺憾ながらできない」。"}, {"t": 908.5666666666667, "x": "窓口では決められないってことなのね。"}, {"t": 911.0, "x": "そうだ。窓口に決める権限そのものが無かった。"}, {"t": 914.75, "x": "別の議員は、捜査の始め方そのものを問いただした。"}, {"t": 918.1333333333333, "x": "問いは2つあった。"}, {"t": 919.3666666666667, "x": "1つめは、最初から検察と相談して進めていたのか。"}, {"t": 923.1, "x": "2つめは、外国へ帰る恐れを\n頭に置いて捜査していたのか。"}, {"t": 927.05, "x": "外国人なんだから、帰っちゃうことも\n考えておけってことね？"}, {"t": 930.9166666666666, "x": "そうだ。警察庁の局長は\n2つともそうしていたと答えた。"}, {"t": 934.6833333333333, "x": "東京地方検察庁とは十分に連絡を\n取り、苦心を重ねて進めた。"}, {"t": 939.1, "x": "局長はまず、これが難しい\n事件だったと前置きしている。"}, {"t": 942.6166666666667, "x": "関係する人の中に、\nカトリックの教団の事情も絡んでいたからだ。"}, {"t": 946.8333333333334, "x": "そのうえでこんなたとえを出した。"}, {"t": 948.6666666666666, "x": "日本人なら、東京の人が鹿児島や\n北海道へ向かう場合も考えておく。"}, {"t": 953.2, "x": "それと同じように、外国へ帰ることも頭に置いていた。"}, {"t": 956.5666666666667, "x": "だから入国管理局に、気配があれば\n教えてほしいと頼んだ。"}, {"t": 960.4, "x": "考えてはいたのね。"}, {"t": 961.8166666666667, "x": "考えてはいた。知らせも実際に羽田から届いた。"}, {"t": 965.0166666666667, "x": "だが知らせが届いても使える手が無かった。"}, {"t": 967.5666666666667, "x": "局長はそれを「不幸にして」という\n言葉でまとめている。"}, {"t": 971.05, "x": "出国の前に、被疑者と疑うに\n足る資料が見つからなかった。"}, {"t": 975.0, "x": "知らせの仕組みは働いたのに、\nその先が無かったのね。"}, {"t": 979.0, "x": "別の議員たちはもう一つの道を示した。"}, {"t": 981.65, "x": "証人尋問だ。"}, {"t": 982.9666666666667, "x": "証人？　被疑者じゃなくて？"}, {"t": 984.7666666666667, "x": "そうだ。犯人かどうかとは別に、\n知っていることを手続きで残す。"}, {"t": 988.8333333333334, "x": "起訴の前でも、裁判所に頼んで\n証人として話を聞く道がある。"}, {"t": 993.0, "x": "うそを言わないと宣誓をさせて、\nその記録を証拠として取っておく。"}, {"t": 996.8166666666667, "x": "議員の1人はそれで\n「時間をかせぐ」ことになると言った。"}, {"t": 1000.4666666666667, "x": "手続きの間は、日本にいてもらえるってこと？"}, {"t": 1003.4, "x": "議員はそう考えていた。"}, {"t": 1004.9333333333333, "x": "これに警察庁の局長はどう答えたか。"}, {"t": 1007.5, "x": "神父の話が証拠として\n「唯一不可欠」とまでは言えなかった。"}, {"t": 1011.6166666666667, "x": "だから証人としての強制の手続きはとらなかった。"}, {"t": 1014.7833333333333, "x": "法務省の局長も別の角度から答えている。"}, {"t": 1017.65, "x": "証人尋問は、本来は証拠を保全するための手続きだ。"}, {"t": 1021.3, "x": "犯人が決まって、その裁判のために\n話を固めておくものだ。"}, {"t": 1025.2333333333333, "x": "誰が犯人かを探している\n段階では、必ずしも要らない。"}, {"t": 1028.9166666666667, "x": "手続きの使い方として、ちょっと違うってこと？"}, {"t": 1032.0666666666666, "x": "局長の考えではそうなる。"}, {"t": 1033.8333333333333, "x": "ただ局長自身、とってもいいし、\nとらなくてもいい、と言っている。"}, {"t": 1037.5833333333333, "x": "議論が分かれる話だ、と認めたうえでの答えだった。"}, {"t": 1041.5166666666667, "x": "証人尋問を求めた議員の1人は、こんな言葉を使った。"}, {"t": 1045.2666666666667, "x": "「長蛇を逸した」。"}, {"t": 1046.4166666666667, "x": "ちょうだ？"}, {"t": 1047.15, "x": "またとない機会を、目の前で\n逃したという意味の言葉だ。"}, {"t": 1050.5, "x": "議員は神父の帰国にはそういう感じがあると言った。"}, {"t": 1053.45, "x": "そしてこのままでは困る理由を3つ並べた。"}, {"t": 1056.1333333333334, "x": "被害者の遺族の感情。"}, {"t": 1057.75, "x": "日本の国民全体の感情。"}, {"t": 1059.7, "x": "それにこれから\n先の外国人の犯罪の取り締まりへの影響だ。"}, {"t": 1063.5666666666666, "x": "遺族のことを最初に言ったのね。"}, {"t": 1065.6166666666666, "x": "そうだ。会議録で最初に出てくるのは遺族だ。"}, {"t": 1068.4666666666667, "x": "議員はさらに続ける。"}, {"t": 1069.8833333333334, "x": "5日間も話を聞いたのは、捜査が\nきわどい所まで来ていたからだ。"}, {"t": 1074.05, "x": "「もう一時間日本に置いたら」と議員は言った。"}, {"t": 1076.75, "x": "何かの手がかりが得られたかもしれない。"}, {"t": 1079.1166666666666, "x": "1時間……。"}, {"t": 1079.9833333333333, "x": "ただしこれは議員の見方だ。"}, {"t": 1081.7333333333333, "x": "1時間あれば何が分かったのか、\n記録には何も書かれていない。"}, {"t": 1085.5, "x": "議員自身も最後にこう言っている。"}, {"t": 1087.4666666666667, "x": "「これはもう取り返しのつかない問題です」。"}, {"t": 1089.8666666666666, "x": "そのぶん、これからの捜査で\n取り戻してほしい、と結んだ。"}, {"t": 1093.9333333333334, "x": "でもベルギーに帰ったあとでも、呼び戻せないの？"}, {"t": 1096.8666666666666, "x": "議員も同じことを聞いた。"}, {"t": 1098.4333333333334, "x": "もし日本の捜査で、疑いが固まったらどうなるのか。"}, {"t": 1101.7333333333333, "x": "法務省の局長の答えは短かった。"}, {"t": 1104.2166666666667, "x": "法律の上では、手段がないのではなかろうか。"}, {"t": 1107.0166666666667, "x": "日本とアメリカの間には、\n犯罪人の引渡し条約がある。"}, {"t": 1110.8, "x": "だがベルギーとの間には、そういう条約が無い。"}, {"t": 1113.7166666666667, "x": "条約が無いと引き渡してもらえないの？"}, {"t": 1116.2166666666667, "x": "公の力で日本に連れ戻す\n手段は無い、というのが局長の見立てだ。"}, {"t": 1120.6, "x": "残るのは、仲のいい\n国どうしの事実上の協力だけになる。"}, {"t": 1124.2666666666667, "x": "警察庁の局長も、\n国際刑事警察機構の名前を出している。"}, {"t": 1128.4333333333334, "x": "法律の義務ではないが、各国の警察が\n捜査で助け合う仕組みだ。"}, {"t": 1132.55, "x": "ベルギーの警察に頼んで、話を\n聞いてもらうこともありうる。"}, {"t": 1136.1, "x": "局長は最初の報告で、そういう見通しも話していた。"}, {"t": 1139.5833333333333, "x": "局長自身、その会議に出たことがあると話している。"}, {"t": 1142.85, "x": "ただこうも言った。"}, {"t": 1143.95, "x": "どれだけ協力してもらっても、遠方のことだ。"}, {"t": 1146.8333333333333, "x": "「隔靴掻痒の感がある」。"}, {"t": 1148.45, "x": "かっかそうよう？"}, {"t": 1149.5166666666667, "x": "靴の上から足をかくような、もどかしさのことだ。"}, {"t": 1152.5333333333333, "x": "自分の手で直に調べられない、という意味になる。"}, {"t": 1155.5, "x": "遠くの国に頼むしかないって、もどかしいわね。"}, {"t": 1159.0666666666666, "x": "委員会の終わり近くある議員が聞いた。"}, {"t": 1161.3, "x": "神父には急いで帰る理由があったのか。"}, {"t": 1163.6, "x": "警察庁の局長は、警察もそこは\n気にして調べたと答えた。"}, {"t": 1167.6666666666667, "x": "本人の周りから言われていることは、2つあった。"}, {"t": 1170.8, "x": "2つ？"}, {"t": 1171.6, "x": "1つは体のことだ。"}, {"t": 1173.1666666666667, "x": "医者に診てもらうと、神経衰弱に\n近い状態だと言われた。"}, {"t": 1176.8, "x": "国へ帰って、母親や親族のもとで静養したほうがいい。"}, {"t": 1180.3, "x": "もう1つは神父の側の言い分だ。"}, {"t": 1182.4, "x": "5日間も調べられて、知っていることはみんな話した。"}, {"t": 1185.85, "x": "これ以上話せることもない。"}, {"t": 1187.6666666666667, "x": "そう言われると引き止めにくいわね。"}, {"t": 1189.7166666666667, "x": "局長は主な理由は前のほう、体のことだろうと言った。"}, {"t": 1193.15, "x": "同じ委員会で、入国管理局長にも問いが飛んだ。"}, {"t": 1196.4, "x": "もし逮捕状がもうすぐ出ると\n連絡が来ていたらどうするのか。"}, {"t": 1199.8166666666666, "x": "飛行機を1便遅らせれば、逮捕できる場面だ。"}, {"t": 1202.9833333333333, "x": "それならさすがに待つんじゃない？"}, {"t": 1204.8666666666666, "x": "局長の答えは、それでも法の建前は\n承認だ、というものだった。"}, {"t": 1209.05, "x": "本人の自由と人権を、どこまで止めていいか。"}, {"t": 1211.95, "x": "何時間ならいいとはとても言えない。"}, {"t": 1213.9166666666667, "x": "だからそこまで追い詰められる\n前に片づけてほしい、と。"}, {"t": 1217.7, "x": "1959年の委員会では、法律を変える話も出ていた。"}, {"t": 1221.8333333333333, "x": "最初に質問した議員はこう聞いている。"}, {"t": 1224.1833333333334, "x": "今の決まりで止められないなら、\nこれからどうするのか。"}, {"t": 1227.2166666666667, "x": "警察庁の局長は、まず国どうしの協力を挙げた。"}, {"t": 1230.5666666666666, "x": "国をまたぐ事件は、これから増えていく時代になる。"}, {"t": 1233.6166666666666, "x": "それなら警察どうしの協力を、\nもっと活発にするしかない。"}, {"t": 1237.45, "x": "法律を変えるって話にはならないの？"}, {"t": 1239.8333333333333, "x": "局長は法律を変えることも研究の一つだと言った。"}, {"t": 1243.1333333333334, "x": "ただすぐには変えられない理由も挙げている。"}, {"t": 1245.45, "x": "証人でも被疑者でも、国に\n帰れないほど縛るのは重いことだ。"}, {"t": 1249.25, "x": "捜査をやり遂げたいという声もよく分かる。"}, {"t": 1251.6166666666666, "x": "その2つの「調和点」をどこに\n求めるかが難しいという。"}, {"t": 1255.3666666666666, "x": "止めたい気持ちと、縛りすぎない決まりのあいだね。"}, {"t": 1258.45, "x": "そうだ。局長は法務省とよく\n相談して研究したいと答えた。"}, {"t": 1262.4333333333334, "x": "法務省の局長も、慎重に研究したいと続けている。"}, {"t": 1266.0166666666667, "x": "その研究の答えが条文になるまで、\nここから22年かかる。"}, {"t": 1270.5333333333333, "x": "国会のやりとりから2日後の6月20日。"}, {"t": 1273.3166666666666, "x": "当時の報道によると、\n高井戸署の捜査本部が解散した。"}, {"t": 1277.0833333333333, "x": "えっもうやめちゃったの？"}, {"t": 1278.5, "x": "警察庁の局長は、その点も国会で先に答えている。"}, {"t": 1282.2333333333333, "x": "捜査本部は、大勢の捜査員を\n一度に動かすための組織だ。"}, {"t": 1286.05, "x": "本部をやめても事件を\n「たな上げ」にするわけではない。"}, {"t": 1289.25, "x": "ほかの事件とも関連させて、捜査は続ける、と。"}, {"t": 1292.6166666666666, "x": "でも見込みはあったの？"}, {"t": 1294.0333333333333, "x": "議員もはっきり聞いている。"}, {"t": 1295.4, "x": "犯人を見つける見込みはあるのか。"}, {"t": 1297.4666666666667, "x": "局長の答えは「なかなか困難な状況」。"}, {"t": 1300.2333333333333, "x": "局長はこう続けた。警察は\n百パーセントの検挙を目指して努力している。"}, {"t": 1304.8, "x": "それでも証拠が固まらず、\n解決しない事件はほかにもある。"}, {"t": 1308.4166666666667, "x": "この事件も、それに似た点を相当持っている、と。"}, {"t": 1311.6833333333334, "x": "未解決になるかもしれないって、認めちゃったのね。"}, {"t": 1314.9333333333334, "x": "そして別の質問にはこうも答えた。"}, {"t": 1317.3, "x": "あのとき強制処分でやるべきではなかったと、\n今も思っている。"}, {"t": 1321.1166666666666, "x": "やり方を変えるつもりは無かったのね。"}, {"t": 1323.4166666666667, "x": "少なくとも国会ではそう言い切った。"}, {"t": 1325.6333333333334, "x": "議員の1人は、神父のほかに\n被疑者は出ていないのかと聞いた。"}, {"t": 1329.3, "x": "局長は「平たい言葉でいえば割れない」と\n認めている。"}, {"t": 1332.6833333333334, "x": "重要参考人がいなくなり本部が畳まれる。"}, {"t": 1335.4166666666667, "x": "事件はここから長い停滞に入っていく。"}, {"t": 1338.55, "x": "捜査が止まる一方で、世の中の話題は止まらなかった。"}, {"t": 1341.9333333333334, "x": "1959年は、週刊誌が次々と生まれた年でもある。"}, {"t": 1346.0333333333333, "x": "その年だけで、二十数誌が創刊されたという。"}, {"t": 1349.1333333333334, "x": "週刊誌がいちばん元気だった時期なのね。"}, {"t": 1351.75, "x": "その真ん中で起きた事件だった。"}, {"t": 1353.7833333333333, "x": "雑誌の上では、神父はシロか\nクロか、という議論が続いた。"}, {"t": 1357.4166666666667, "x": "10月には、事件をもとにした映画まで公開された。"}, {"t": 1360.6833333333334, "x": "題名は『白か黒か』だ。"}, {"t": 1362.6666666666667, "x": "推理作家の松本清張も、\nこの事件をもとに小説を書いた。"}, {"t": 1366.6, "x": "題名は『黒い福音』。"}, {"t": 1368.0166666666667, "x": "週刊誌に連載されて話題を呼んだ。"}, {"t": 1370.45, "x": "小説や映画になると、それが\n本当みたいに広まりそう……。"}, {"t": 1374.0, "x": "そこを心配した人もいた。"}, {"t": 1375.8, "x": "作家の遠藤周作は雑誌\n「世界」の8月号で書いている。"}, {"t": 1379.7, "x": "実名を出し、写真を載せ、\n真犯人のように扱う報道はおかしい、と。"}, {"t": 1384.2166666666667, "x": "遠藤周作自身もカトリックの信徒だった。"}, {"t": 1386.9166666666667, "x": "ベルギーからは、映画の扱いに\n抗議する手紙も新聞社に届いた。"}, {"t": 1390.95, "x": "小説も映画も作り手の推理だ。"}, {"t": 1393.1166666666666, "x": "捜査で確かめられた事実とは、\n分けて聞く必要がある。"}, {"t": 1396.75, "x": "うん。ここごっちゃにしやすい所ね。"}, {"t": 1399.5166666666667, "x": "羽田の夜から1年半後、1960年12月16日。"}, {"t": 1403.9333333333334, "x": "衆議院の法務委員会で、\nこの事件がまた取り上げられた。"}, {"t": 1407.3333333333333, "x": "質問した議員は、法務省に資料を出させていた。"}, {"t": 1410.45, "x": "その資料の終わりのほうに、\nこんな一文があったという。"}, {"t": 1413.5, "x": "有効な旅券を持ち、正しく手続きしてきた\n外国人の出国は阻止できない。"}, {"t": 1418.45, "x": "1年半たっても同じ答えなのね。"}, {"t": 1420.8333333333333, "x": "法務省の局長の答弁も、1959年と同じ線だった。"}, {"t": 1425.1833333333334, "x": "神父は重要な参考人だった。"}, {"t": 1427.2166666666667, "x": "だが「殺人の容疑というようなものにまでは\n至っていなかった」。"}, {"t": 1430.8833333333334, "x": "そして続けて「今日もその通り」と付け加えた。"}, {"t": 1434.35, "x": "疑いが深まったわけでもないの？"}, {"t": 1436.4833333333333, "x": "局長は容疑が深まったという報告は\n聞いていない、と答えている。"}, {"t": 1440.35, "x": "この日の答弁にはこんな話も出てくる。"}, {"t": 1442.8333333333333, "x": "捜査の側は、本人に日本にとどまるよう頼んでいた。"}, {"t": 1446.1333333333334, "x": "強制ではなく、自分から残ってほしいという要請だ。"}, {"t": 1449.3833333333334, "x": "だが本人は、どうしても帰国したいと答えた。"}, {"t": 1452.3333333333333, "x": "要請はした。そして断られた。"}, {"t": 1454.6666666666667, "x": "頼むことはできても、止めることはできない……。"}, {"t": 1457.4, "x": "それが1年半後の国会で確かめられた中身だった。"}, {"t": 1461.35, "x": "この日議員はかなり踏み込んだ聞き方をしている。"}, {"t": 1464.1, "x": "外国人とくに西欧の人に対して、\n一種の劣等感があるのではないか。"}, {"t": 1468.7166666666667, "x": "劣等感？"}, {"t": 1469.6333333333334, "x": "遠慮しすぎて、大事な人を\n帰してしまったのでは、という意味だ。"}, {"t": 1473.5, "x": "議員は松本清張の小説にも触れている。"}, {"t": 1476.1666666666667, "x": "この事件をそっくり\nモデルにしたような小説がある、と。"}, {"t": 1479.35, "x": "ただし議員自身、小説は\n小説だと断りながら話している。"}, {"t": 1483.3666666666666, "x": "法務省の局長はなんて答えたの？"}, {"t": 1485.7166666666667, "x": "劣等感は「いささかも持っておりません」。"}, {"t": 1488.15, "x": "問題は決め手となる証拠を\n集められなかったことにある。"}, {"t": 1491.3666666666666, "x": "それが局長の答えだった。"}, {"t": 1493.15, "x": "議員はさらにほかの例も挙げる。"}, {"t": 1494.9833333333333, "x": "取り調べ中の外国人が、飛行機で\n本国へ帰ってしまった話だ。"}, {"t": 1499.35, "x": "新聞で見ただけでも3つ、4つ知っている、と。"}, {"t": 1502.2666666666667, "x": "この事件だけじゃなかったのね。"}, {"t": 1504.2333333333333, "x": "議員の言い方を借りれば、少し\nルーズではないか、となる。"}, {"t": 1507.5833333333333, "x": "そしてこう求めた。"}, {"t": 1508.8833333333334, "x": "議員はこうも言っている。"}, {"t": 1510.25, "x": "犯人が挙がらないまま終わるのでは、\n国民として納得できない。"}, {"t": 1513.9833333333333, "x": "ベルギー政府に掛け合ってもう\n一度来てもらうとか、方法はあるはずだ。"}, {"t": 1518.05, "x": "呼び戻すことまで考えてたのね。"}, {"t": 1520.3, "x": "今後そういうことが起きないよう、\n手を打つ決心をしてほしい。"}, {"t": 1524.2333333333333, "x": "この日の答弁の中に、記録で\nいちばん重い一文がある。"}, {"t": 1527.65, "x": "法務省の局長はこう言った。"}, {"t": 1529.5, "x": "人一人が死んでいる。"}, {"t": 1530.9333333333334, "x": "犯人が挙がらないことは、捜査の側に\nとって「借りになっている」。"}, {"t": 1534.8833333333334, "x": "借り……。"}, {"t": 1535.4666666666667, "x": "返さなければならないもの、という言い方だ。"}, {"t": 1538.0666666666666, "x": "局長は真相の究明に努める考えを\n今も固く持っている、と続けた。"}, {"t": 1542.6333333333334, "x": "そして出国の決まりについて、こうまとめている。"}, {"t": 1545.5833333333333, "x": "外国人を国に迎えるかどうかは、\n日本が絶対的な権利で決められる。"}, {"t": 1550.0166666666667, "x": "だが出国は旅券を確かめて出すだけだ。"}, {"t": 1552.75, "x": "来るときは選べるのに、出るときは止められない……。"}, {"t": 1555.55, "x": "局長はそれを「真にやむを得ない盲点」と呼んだ。"}, {"t": 1558.6333333333334, "x": "この事件をきっかけに、内部で\n議論もしていると明かしている。"}, {"t": 1562.15, "x": "ただすぐに法律を変えるのは難しい、とも言った。"}, {"t": 1565.1333333333334, "x": "出国の扱いには、国どうしの慣行もあるからだ。"}, {"t": 1568.5166666666667, "x": "盲点だって分かってても、すぐには塞げないのね。"}, {"t": 1571.6833333333334, "x": "その盲点に新しい条文が\n入るのは、ずっと先のことになる。"}, {"t": 1576.15, "x": "ここで会議録を年の順に\n引いていて気づいたことがある。"}, {"t": 1579.35, "x": "年がたつほど、国会での言い方が変わっていくんだ。"}, {"t": 1582.6166666666666, "x": "変わる？"}, {"t": 1583.3333333333333, "x": "1964年5月26日、参議院の法務委員会。"}, {"t": 1587.4166666666667, "x": "ある議員が、神父が事件を起こしたと\n決めつけるような聞き方をした。"}, {"t": 1591.4333333333334, "x": "答えたのはやはり法務省の刑事局長だ。"}, {"t": 1594.0666666666666, "x": "警察はもう少し日本にいてもらって\n調べを徹底したかった。"}, {"t": 1597.7166666666667, "x": "だが「何としましてもきめ手がない」。"}, {"t": 1599.9666666666667, "x": "そのため、出ていく人を押さえられなかった。"}, {"t": 1602.6666666666667, "x": "政府の答えはずっと同じなのね。"}, {"t": 1604.8333333333333, "x": "そうだ。変わったのは質問する側の言い方だ。"}, {"t": 1607.7166666666667, "x": "さらに1970年6月18日。"}, {"t": 1610.4833333333333, "x": "沖縄の問題を話し合う委員会だ。"}, {"t": 1612.8166666666666, "x": "大臣の1人が、昔の例としてこの事件に触れた。"}, {"t": 1616.2333333333333, "x": "犯人と目された人が「外交官特権」で帰国したと。"}, {"t": 1620.2, "x": "外交官特権？　それさっきの話と違わない？"}, {"t": 1623.35, "x": "違う。1959年の会議録では、神父は\nベルギーの旅券で正規に出国している。"}, {"t": 1629.0, "x": "入国管理局長は日本の外務省は\n「全然関係ございません」と答えていた。"}, {"t": 1633.95, "x": "外交官の特権という言葉は、\n1959年の記録のどこにも無い。"}, {"t": 1638.8166666666666, "x": "11年で話がすり替わっちゃったのね。"}, {"t": 1641.45, "x": "国会の場でさえそうなった。"}, {"t": 1643.1333333333334, "x": "だからこの回は、1959年の記録に\n戻って確かめている。"}, {"t": 1647.6166666666666, "x": "言葉って、少しずつ形が変わっていくのね。"}, {"t": 1650.7, "x": "だからこそ、最初の記録に戻る意味がある。"}, {"t": 1654.05, "x": "当時の法律では、殺人罪の時効は15年だった。"}, {"t": 1657.45, "x": "死刑のある罪は15年と、\n刑事訴訟法で決まっていたからだ。"}, {"t": 1661.2666666666667, "x": "1959年3月から数えると、\n15年後は1974年3月になる。"}, {"t": 1667.0, "x": "事件はその月に時効を迎えた。"}, {"t": 1669.2166666666667, "x": "分からないまま終わっちゃったのね。"}, {"t": 1671.2, "x": "法の上ではもう誰も裁けなくなった。"}, {"t": 1673.4833333333333, "x": "羽田の夜から数えてもほぼ15年だ。"}, {"t": 1675.9666666666667, "x": "その間神父はカナダで、学校や\n病院、教会の仕事を続けていた。"}, {"t": 1680.3, "x": "国会では「借り」とまで言われた事件だった。"}, {"t": 1683.1, "x": "その借りは返されないまま期限が来た。"}, {"t": 1685.55, "x": "……被害者の家族はどう思ったのかしら。"}, {"t": 1687.9166666666667, "x": "それを伝える一次の記録を、\n今回は見つけられなかった。"}, {"t": 1691.3666666666666, "x": "だからここで想像を語るのはやめておく。"}, {"t": 1693.75, "x": "会議録に残っているのは、議員が\n最初に遺族の感情を挙げたことだけだ。"}, {"t": 1698.25, "x": "うん。分からないことは、\n分からないままでいいと思う。"}, {"t": 1701.85, "x": "ではあの盲点はその後どうなったのか。"}, {"t": 1704.0333333333333, "x": "条文が入ったのは1981年だ。"}, {"t": 1706.8, "x": "羽田の夜から22年後になる。"}, {"t": 1709.0333333333333, "x": "出入国管理令が改められ、\n第25条の2という条文ができた。"}, {"t": 1713.35, "x": "見出しは「出国確認の留保」。"}, {"t": 1715.6, "x": "いまの法律の名前でいえば、\n出入国管理及び難民認定法の条文だ。"}, {"t": 1720.4, "x": "留保って保留みたいなもの？"}, {"t": 1722.2166666666667, "x": "そうだ。出国を認める\n手続きを、いったん止めておける。"}, {"t": 1725.7166666666667, "x": "止めておける時間は、\n手続きをしたときから24時間までだ。"}, {"t": 1729.5, "x": "1981年6月の参議院で、\n法務省の担当者はこう説明している。"}, {"t": 1734.65, "x": "今は逮捕状が出ている人が\n出国しようとしても、入管令に手当てが無い。"}, {"t": 1739.1333333333334, "x": "審査官は事実を知っていても、\n証印を押さざるを得ない。"}, {"t": 1742.5333333333333, "x": "1959年の局長と、同じことを言ってるわね。"}, {"t": 1746.3166666666666, "x": "担当者は、日本人には留保が\n要らない理由も説明している。"}, {"t": 1750.0333333333333, "x": "日本人なら、旅券を返させる\n仕組みが旅券法にあるからだ。"}, {"t": 1753.7166666666667, "x": "つまりこの留保は、\n外国人のための決まりとして作られた。"}, {"t": 1757.4166666666667, "x": "22年たっても、同じ穴が空いていたということだ。"}, {"t": 1760.6, "x": "ただここで条文の中身をよく見てほしい。"}, {"t": 1762.9666666666667, "x": "止められるのは、関係機関から\n通知が来ている人だけだ。"}, {"t": 1766.5, "x": "重い罪で訴追されている人。"}, {"t": 1768.45, "x": "あるいは、逮捕状や勾留状などが出ている人だ。"}, {"t": 1771.5166666666667, "x": "じゃああの神父は？"}, {"t": 1772.7, "x": "1959年の神父には、逮捕状も何も出ていなかった。"}, {"t": 1776.75, "x": "だから今の条文に当てはめても、\n留保の対象には当たらない。"}, {"t": 1780.5333333333333, "x": "今の法律でも止められないってこと？"}, {"t": 1782.8666666666666, "x": "条文どおりに読めばそうなる。"}, {"t": 1784.55, "x": "止められるのは疑いが固まった\n人だけ。そこは変わっていない。"}, {"t": 1788.2666666666667, "x": "つまりあの夜の答えは、\n法律の穴だけの話ではなかった。"}, {"t": 1791.9666666666667, "x": "止めるだけの疑いを誰も示せなかった。"}, {"t": 1794.4666666666667, "x": "会議録は、最初から最後までその一点を言っている。"}, {"t": 1798.3333333333333, "x": "最後に神父のその後を見ておく。"}, {"t": 1800.2333333333333, "x": "根拠は2017年にカナダで出された訃報だ。"}, {"t": 1803.2333333333333, "x": "神父は1959年にベルギーへ戻った。"}, {"t": 1806.2166666666667, "x": "翌1960年、修道会の上の人の指示で、\nカナダのモントリオールへ渡る。"}, {"t": 1811.3333333333333, "x": "当時の外電は、オーストラリアに行くと伝えていた。"}, {"t": 1814.4833333333333, "x": "行き先まで違って伝わってたのね。"}, {"t": 1816.85, "x": "その後は、ニューブランズウィック州の学校や\n病院、教会で務めた。"}, {"t": 1820.8666666666666, "x": "訃報によると、1964年には病院と\nその看護学校の司祭になった。"}, {"t": 1825.8333333333333, "x": "1969年からは、教会の主任司祭も務めている。"}, {"t": 1829.9333333333334, "x": "1980年からは、港町セント・\nジョンで港の司祭になる。"}, {"t": 1834.2333333333333, "x": "世界中から来る船員たちのための司祭だ。"}, {"t": 1837.0333333333333, "x": "港で船員さんたちの相手をしてたのね。"}, {"t": 1839.6833333333334, "x": "1981年には、\nその町のフランス語の教会の初代主任司祭になった。"}, {"t": 1844.95, "x": "1990年には、地元の大学から\n名誉博士号を受けている。"}, {"t": 1849.2666666666667, "x": "そして2017年3月17日、自宅で\n亡くなった。96歳だった。"}, {"t": 1854.55, "x": "96歳……。羽田の夜から58年後ね。"}, {"t": 1857.7333333333333, "x": "訃報には、日本で教えたことも、\n雑誌を編集したことも書いてある。"}, {"t": 1861.9166666666667, "x": "だが1959年の事件のことは一言も書かれていない。"}, {"t": 1865.9666666666667, "x": "どうして書かなかったのかしら。"}, {"t": 1867.9166666666667, "x": "それは記録からは分からない。だから\nここで推し量ることもやめておく。"}, {"t": 1871.8666666666666, "x": "生まれ故郷のベルギーの村でも、\n4月2日に追悼のミサが開かれた。"}, {"t": 1876.1333333333334, "x": "葬儀のミサは、自分が初代の主任司祭を\n務めた教会で開かれた。"}, {"t": 1880.4333333333334, "x": "埋葬されたのは、セント・\nジョンの墓地にある司祭の区画だ。"}, {"t": 1883.85, "x": "神父が日本の捜査の場にもう\n一度立つことは、最後まで無かった。"}, {"t": 1888.45, "x": "ここで今回読んだ記録を並べておく。"}, {"t": 1890.7333333333333, "x": "国会の会議録は6本だ。"}, {"t": 1892.6333333333334, "x": "1959年6月18日、衆議院の法務委員会。"}, {"t": 1896.5666666666666, "x": "羽田の夜の報告がある。"}, {"t": 1898.3333333333333, "x": "1960年12月16日、同じく衆議院の法務委員会。"}, {"t": 1902.65, "x": "「借り」と「盲点」の答弁だ。"}, {"t": 1904.7833333333333, "x": "5年後の参議院の委員会。ここで\n「きめ手がない」という答弁が出た。"}, {"t": 1909.0166666666667, "x": "1970年6月18日、沖縄の問題の特別委員会。"}, {"t": 1913.5, "x": "「外交官特権」という食い違い。"}, {"t": 1915.6833333333334, "x": "そして1981年の5月と6月。"}, {"t": 1918.6333333333334, "x": "24時間の留保ができたときの審議だ。"}, {"t": 1921.4333333333334, "x": "政府の答えは、最初から最後まで変わってないのね。"}, {"t": 1924.7666666666667, "x": "疑うに足る資料は無い。"}, {"t": 1926.1166666666666, "x": "決め手が無い。だから止められない。"}, {"t": 1928.2, "x": "6本の会議録は、その線から一度も外れていない。"}, {"t": 1931.5166666666667, "x": "どの会議録も、国立国会図書館の検索システムで\n誰でも読める。"}, {"t": 1935.9333333333334, "x": "日付と委員会の名前が分かれば、すぐにたどり着く。"}, {"t": 1939.2666666666667, "x": "調べようと思えば、私たちでも読めるのね。"}, {"t": 1942.1833333333334, "x": "それともう一つの記録が2017年の訃報だ。"}, {"t": 1945.4333333333334, "x": "事件のことが書かれてない訃報ね。"}, {"t": 1947.6666666666667, "x": "会議録と訃報。どちらにも、\nあの事件の答えは書かれていない。"}, {"t": 1952.1333333333334, "x": "ねえ最初の話に戻ってもいい？"}, {"t": 1954.2333333333333, "x": "いいぞ。"}, {"t": 1954.8833333333334, "x": "羽田の窓口の15分。"}, {"t": 1956.4333333333334, "x": "あそこで止めてたら何か変わったのかな。"}, {"t": 1959.0, "x": "議員はもう1時間あればと言った。"}, {"t": 1960.9666666666667, "x": "局長は止めるだけの疑いが無かった、と言った。"}, {"t": 1963.9666666666667, "x": "どちらが正しかったのか、\n記録だけでは決められない。"}, {"t": 1967.2666666666667, "x": "……そうよね。"}, {"t": 1968.1, "x": "ただ記録の中で動かない事実が一つある。"}, {"t": 1970.85, "x": "3月13日の香港行きの便に、彼女は乗れなかった。"}, {"t": 1974.5666666666666, "x": "採用されて2か月あまり。"}, {"t": 1976.1, "x": "ロンドンから戻って、まだ2週間もたっていなかった。"}, {"t": 1979.4, "x": "初めての乗務の3日前のことだ。"}, {"t": 1981.7166666666667, "x": "本当なら、羽田から飛び立つ側の人だったのね。"}, {"t": 1985.0666666666666, "x": "ロンドンで講習を受けて、初めての便を待っていた。"}, {"t": 1988.1333333333334, "x": "そうだ。その羽田から、3\nか月後に重要参考人が発った。"}, {"t": 1992.1333333333334, "x": "その夜窓口で証印を止める条文は無かった。"}, {"t": 1995.0166666666667, "x": "事件は犯人が分からないまま、\n1974年に時効を迎えた。"}, {"t": 1999.4, "x": "法務省の局長の言葉を借りるなら、\n人一人が亡くなっている。"}, {"t": 2003.3166666666666, "x": "その借りはいまも返されていない。"}, {"t": 2005.3333333333333, "x": "忘れないでいることくらいは、できるわよね。"}, {"t": 2007.9666666666667, "x": "ああ。今回は羽田の15分を\n国会の会議録で読み直した回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
