<script>
const D={"name": "132", "file": "132_編集用", "dur": 2048.4, "segs": [], "subs": [{"t": 0.0, "x": "1972年5月、\n国会の委員会で、ある議員がこう聞いた。"}, {"t": 4.4, "x": "「あの大きなたまをぶち当てて、壁を\n破ったあの車は何と言いましたか」。"}, {"t": 8.533333333333333, "x": "大きなたま？"}, {"t": 9.533333333333333, "x": "鉄のたまだ。"}, {"t": 10.516666666666667, "x": "クレーン車でぶつけて、建物の壁を壊す重いたまだ。"}, {"t": 13.833333333333334, "x": "それが使われたのは同じ年の2月28日。"}, {"t": 16.933333333333334, "x": "長野県の軽井沢、冬の山の上に建つ保養所だった。"}, {"t": 20.466666666666665, "x": "その建物が、あさま山荘だ。"}, {"t": 22.733333333333334, "x": "聞いたことがある呼び名だわ。"}, {"t": 24.433333333333334, "x": "5人が人質を取って立てこもり、\n警察が10日間囲んだ事件だ。"}, {"t": 28.633333333333333, "x": "最後の日、警察はクレーン車で壁を破り、中へ入った。"}, {"t": 32.25, "x": "人質は助け出された。"}, {"t": 33.916666666666664, "x": "ただその日に警察官が2人亡くなっている。"}, {"t": 36.766666666666666, "x": "10日間も待って最後は壁を壊したのね？"}, {"t": 39.46666666666667, "x": "そうだ。"}, {"t": 40.06666666666667, "x": "今回はその10日間を、\n警察の判断の順番で追っていく。"}, {"t": 43.8, "x": "なぜ10日も待ったのか。"}, {"t": 45.416666666666664, "x": "そして最後の日に、何を決めたのか、ね。"}, {"t": 48.3, "x": "そしてなぜ鉄のたまだったのか。"}, {"t": 50.3, "x": "材料は、事件の翌日から国会で\n読み上げられた警察の報告だ。"}, {"t": 54.583333333333336, "x": "立てこもった5人の名前を、この回では出さない。"}, {"t": 57.6, "x": "分かった。"}, {"t": 58.35, "x": "まず、どうして山荘に人がいたのかから聞きたいわ。"}, {"t": 61.6, "x": "そこは山荘より前の話から始まる。"}, {"t": 64.73333333333333, "x": "始まりは山荘から少し離れた群馬県だ。"}, {"t": 67.58333333333333, "x": "1972年2月7日。"}, {"t": 69.91666666666667, "x": "一般の人から警察に届け出があった。"}, {"t": 72.51666666666667, "x": "榛名湖のほとりに怪しい車が置かれている。"}, {"t": 75.06666666666666, "x": "ときどき別の車が来て、2、\n3日そのままになっている、という話だった。"}, {"t": 80.06666666666666, "x": "車が一台置きっぱなし？"}, {"t": 81.9, "x": "それだけの届け出だった。"}, {"t": 83.51666666666667, "x": "ところが警察は、それまでの捜査と突き合わせた。"}, {"t": 86.61666666666666, "x": "そして、榛名山の中で、雪に\n埋もれた隠れ家を見つける。"}, {"t": 90.58333333333333, "x": "山の中に隠れ家があったの？"}, {"t": 92.58333333333333, "x": "警察白書は「雪に埋もれたアジト」と書いている。"}, {"t": 95.9, "x": "そこにいたのは、連合赤軍と\n名乗る組織の人たちだった。"}, {"t": 99.66666666666667, "x": "前の年に、二つの過激な\nグループが組んでできた組織だ。"}, {"t": 103.31666666666666, "x": "警察は、全国の警察に検問と\n捜索を強めるよう指示した。"}, {"t": 107.5, "x": "2月17日には、組織の幹部2人を捕まえている。"}, {"t": 111.08333333333333, "x": "ほかの者はさらに山の奥へ逃げた。"}, {"t": 113.4, "x": "冬の山を？"}, {"t": 114.43333333333334, "x": "そうだ。"}, {"t": 115.03333333333333, "x": "警察庁の警備局長は、ヘリで\n妙義山の上を越えて現地へ向かった。"}, {"t": 119.31666666666666, "x": "国会では、そのとき見た山の様子を\n「雪におおわれた峻険の状況」と言っている。"}, {"t": 124.36666666666666, "x": "警察の見立てでは、彼らは3日ほどかけて、\nかまくらのようなものを作りながら進んだ。"}, {"t": 129.68333333333334, "x": "普通の道ではない道を通った。"}, {"t": 131.68333333333334, "x": "そして19日の夜中ごろ、和美峠の\nあたりに出てきた、という。"}, {"t": 135.71666666666667, "x": "峠を越えた先が軽井沢なのね。"}, {"t": 137.98333333333332, "x": "そういうことだ。"}, {"t": 139.63333333333333, "x": "2月19日は土曜日だった。"}, {"t": 141.53333333333333, "x": "この日の朝8時、信越線の軽井沢駅で、\n4人が捕まっている。"}, {"t": 146.03333333333333, "x": "駅で？"}, {"t": 146.76666666666668, "x": "山を下りてきたうちの一部だ。"}, {"t": 148.55, "x": "きっかけは駅の売店の女性の通報だった。"}, {"t": 151.36666666666667, "x": "警察官が見つけたんじゃないのね。"}, {"t": 153.56666666666666, "x": "国会でもそこが話題になっている。"}, {"t": 155.68333333333334, "x": "ある議員はこう指摘した。"}, {"t": 157.25, "x": "駅には警察官もいたようだが、逮捕は\n売店の女性の通報によるものだった。"}, {"t": 161.93333333333334, "x": "榛名でも、妙義でも、捕まえる\nきっかけは住民の通報が多かった、と。"}, {"t": 166.56666666666666, "x": "住民の目が警察の目より先だったってこと？"}, {"t": 169.48333333333332, "x": "議員はそう言って、警察に反省すべき\n点は反省してほしいと求めた。"}, {"t": 173.83333333333334, "x": "ただ、群馬県警や長野県警の努力が足りなかったと\n言っているのではない、とも付け加えている。"}, {"t": 179.53333333333333, "x": "長野県も、県境の主な道に\n百数十人の警察官を置いていた。"}, {"t": 183.95, "x": "それでも山の道は広すぎた。"}, {"t": 185.88333333333333, "x": "警察庁の説明では、この一連の追跡で\n捕まった者はこうなる。"}, {"t": 190.16666666666666, "x": "妙義山で4人。"}, {"t": 191.25, "x": "軽井沢駅で4人。"}, {"t": 192.56666666666666, "x": "そしてのちに山荘で5人だ。"}, {"t": 194.46666666666667, "x": "駅で4人が捕まったあと残りは5人。"}, {"t": 196.81666666666666, "x": "この5人が、その日の午後、警察と出会うことになる。"}, {"t": 200.28333333333333, "x": "午後に何が起きたの？"}, {"t": 201.76666666666668, "x": "舞台は軽井沢の南の新しく開けた別荘地だ。"}, {"t": 205.55, "x": "19日の午後3時10分ごろ。"}, {"t": 207.56666666666666, "x": "別荘地の中の、空き家になっていた山荘のそばだ。"}, {"t": 210.78333333333333, "x": "捜索していた長野県警の機動隊員が、\n5人を見つけた。"}, {"t": 214.55, "x": "踏み込もうとしたところ激しい銃撃を受けた。"}, {"t": 217.36666666666667, "x": "撃ってきたの？"}, {"t": 218.4, "x": "警察官2人がけがをした。"}, {"t": 220.26666666666668, "x": "5人は銃を乱射しながら、急な坂道を上へ逃げた。"}, {"t": 223.56666666666666, "x": "警察官が身を伏せているあいだに、\n姿が見えなくなった。"}, {"t": 227.18333333333334, "x": "見失ったのね。"}, {"t": 228.46666666666667, "x": "そうだ。"}, {"t": 229.08333333333334, "x": "そのあと、一帯を捜していた\n警察官が、いきなり上の方から撃たれる。"}, {"t": 233.5, "x": "時刻は3時25分から30分くらいのあいだだった。"}, {"t": 236.93333333333334, "x": "撃たれた方向に建物がある。"}, {"t": 238.78333333333333, "x": "それが、さっきの空き家から坂を\n約600メートル上った保養所。"}, {"t": 242.73333333333332, "x": "楽器の会社の保養所で、あさま山荘と呼ばれていた。"}, {"t": 246.15, "x": "上から撃たれて隠れ場所が分かったのね。"}, {"t": 248.61666666666667, "x": "国会ではある議員がこの間を問題にした。"}, {"t": 251.26666666666668, "x": "最初の銃撃から山荘に入るまで、\n約1時間の空白があるのはなぜか、と。"}, {"t": 256.1666666666667, "x": "警察庁の警備局長は地形の話をした。"}, {"t": 259.06666666666666, "x": "あの場所は南軽井沢の一番はずれだ。"}, {"t": 261.56666666666666, "x": "地面から数百メートル高いところに、山荘がある。"}, {"t": 264.8, "x": "その急な坂を、撃たれながら\n追っていた、という答えだった。"}, {"t": 268.35, "x": "それ以上の細かい動きは、裁判があるので\n省かせてほしい、とも言っている。"}, {"t": 272.8666666666667, "x": "答えはそこで止まったのね。"}, {"t": 274.6666666666667, "x": "止まった。"}, {"t": 275.4166666666667, "x": "そして5人は、山荘の中にいた一人の女性と出会う。"}, {"t": 279.43333333333334, "x": "山荘にはそのとき一人だけ人がいた。"}, {"t": 281.93333333333334, "x": "管理人の妻で当時31歳。"}, {"t": 284.0833333333333, "x": "たまたま一人で留守番をしていた。"}, {"t": 286.3, "x": "一人で……。"}, {"t": 287.1333333333333, "x": "警察白書はこのあとのことを短く書いている。"}, {"t": 290.0, "x": "5人は、洗濯用のロープで女性を後ろ手に縛った。"}, {"t": 293.26666666666665, "x": "さらに両足首と両ひざも縛った。"}, {"t": 295.53333333333336, "x": "そして入り口にバリケードを作った。"}, {"t": 297.6666666666667, "x": "壁には銃を出して撃つ穴を開けた。"}, {"t": 299.8833333333333, "x": "撃つ穴？"}, {"t": 300.7, "x": "銃眼という。"}, {"t": 301.6333333333333, "x": "城の壁に開いているのぞき穴のようなものだ。"}, {"t": 304.3833333333333, "x": "建物には3階まであった。"}, {"t": 306.21666666666664, "x": "のちに国会で、警察の担当者は\nこの場所を「千早城」にたとえている。"}, {"t": 310.8666666666667, "x": "千早城って？"}, {"t": 312.0, "x": "昔、山の上で大軍を相手に持ちこたえたと伝わる城だ。"}, {"t": 315.75, "x": "攻めにくく守りやすいという意味で使った。"}, {"t": 318.21666666666664, "x": "この回では女性の名前を出さない。"}, {"t": 320.25, "x": "白書も名前を伏せて「Bさん」と書いている。"}, {"t": 323.1666666666667, "x": "白書の時点でもう伏せてあったのね。"}, {"t": 325.48333333333335, "x": "そうだ。"}, {"t": 326.0833333333333, "x": "ここから山荘を囲む10日間が始まる。"}, {"t": 329.28333333333336, "x": "長野県警は現地に警備本部を置いた。"}, {"t": 331.7, "x": "警視庁などからも応援が来た。"}, {"t": 333.65, "x": "いちばん多いときで、\n約1,400人の警察官が山荘を囲んだ。"}, {"t": 337.95, "x": "1,400人も？"}, {"t": 339.3, "x": "10日間を合わせると、のべ1万4,000人だ。"}, {"t": 342.15, "x": "これは翌年の警察白書の数字だ。"}, {"t": 344.6, "x": "警察が決めた基本の方針は二つだった。"}, {"t": 347.35, "x": "人質の安全を確かめて助け出すこと。"}, {"t": 350.0833333333333, "x": "そして5人を説得して捕まえること。"}, {"t": 352.65, "x": "撃ち合いで決着をつけるじゃないのね。"}, {"t": 354.9166666666667, "x": "最初からそうは決めていなかった。"}, {"t": 356.9166666666667, "x": "指揮をとったのは長野県警の本部長だ。"}, {"t": 359.46666666666664, "x": "ただ応援は関東のほかの県からも来ている。"}, {"t": 362.1166666666667, "x": "そこで警察庁からも職員が送られ、\n各県の調整をする参謀のような役をした。"}, {"t": 367.2, "x": "これは国会での説明だ。"}, {"t": 369.05, "x": "いくつもの県の警察が、一つの山荘を囲んだのね。"}, {"t": 372.6666666666667, "x": "のちに国会で、警察の担当者はこんな話もしている。"}, {"t": 376.25, "x": "幹部は胸に目立たない印を付けていた。"}, {"t": 378.75, "x": "何百人、何千人と動くとき、\n指揮官がだれか分からないと困る。"}, {"t": 383.01666666666665, "x": "警視庁の人は顔を知っていても、\n長野の人は知らないからだ。"}, {"t": 386.81666666666666, "x": "ところが幹部と分かれば撃つ側にも狙われる。"}, {"t": 389.56666666666666, "x": "目印が狙われる理由にもなるのね。"}, {"t": 391.93333333333334, "x": "その両方をどうするかがあとで宿題になった。"}, {"t": 395.25, "x": "包囲のあいだ警察は呼びかけを続けた。"}, {"t": 397.6333333333333, "x": "警察官だけではない。"}, {"t": 399.15, "x": "人質の家族も呼びかけた。"}, {"t": 401.03333333333336, "x": "立てこもった5人の母親たちも呼びかけた。"}, {"t": 403.85, "x": "母親も来たの？"}, {"t": 405.1333333333333, "x": "来た。"}, {"t": 405.68333333333334, "x": "警察庁の警備局長は、のちに国会でこう言っている。"}, {"t": 409.1333333333333, "x": "「あれは百五十回をこえる説得をやり、\n最後の最後まで説得した」。"}, {"t": 413.35, "x": "150回……。"}, {"t": 414.45, "x": "ところが返ってくるのは銃声だった。"}, {"t": 416.6333333333333, "x": "警察白書は、涙ながらに訴える母親に\n対しても発砲した、と書いている。"}, {"t": 421.76666666666665, "x": "母親にまで？"}, {"t": 422.9, "x": "国会の本会議でもある議員がそこに触れた。"}, {"t": 425.6, "x": "呼びかける母親に対して銃弾でこたえたと。"}, {"t": 428.3833333333333, "x": "説得に名乗り出た人はほかにもいた。"}, {"t": 430.75, "x": "ある大学の学長は、自分が山荘まで行こうとした。"}, {"t": 434.05, "x": "けれど、それはかえって危ないという\n意見もあった、と国会で紹介されている。"}, {"t": 438.6333333333333, "x": "だれが呼びかけても届かなかったのね。"}, {"t": 441.05, "x": "28日の当日に国会へ届いた報告では、\n10日間の発射は合計80発。"}, {"t": 446.43333333333334, "x": "その弾で5人がけがをしていた。"}, {"t": 448.43333333333334, "x": "説得の言葉は150回以上。"}, {"t": 450.6166666666667, "x": "返ってきたのは80発の弾。"}, {"t": 452.78333333333336, "x": "それが包囲の9日間の中身だった。"}, {"t": 455.8333333333333, "x": "ねえ5人は何を要求していたの？"}, {"t": 458.0, "x": "そこがこの事件のいちばん変わったところだ。"}, {"t": 460.55, "x": "何も要求しなかった。"}, {"t": 462.25, "x": "え？"}, {"t": 462.7, "x": "警察庁の担当者は国会でこう説明している。"}, {"t": 465.76666666666665, "x": "普通の人質事件ではまず相手に人質を見せる。"}, {"t": 468.9, "x": "自分は人質を持っているぞと示す。"}, {"t": 471.23333333333335, "x": "それを元に取り引きの条件を出してくる。"}, {"t": 473.8333333333333, "x": "お金とか逃げる車とかよね。"}, {"t": 475.8833333333333, "x": "そうだ。"}, {"t": 476.5, "x": "ところが今回は、何を申し入れても、\n何を説得しても、反応が無い。"}, {"t": 481.05, "x": "最後まで、人質がそこにいるという\n様子さえ見せなかった。"}, {"t": 484.73333333333335, "x": "じゃあ、人質が無事かどうかも分からないじゃない。"}, {"t": 487.6166666666667, "x": "そこが警察を一番苦しめた。"}, {"t": 489.7, "x": "担当者は5人の狙いをこう見ていた。"}, {"t": 491.93333333333334, "x": "人質を盾にして、警察の攻めを\n鈍らせることだけが目的だったのではないか。"}, {"t": 496.9, "x": "本会議でも、ある議員が「要求を一切せず、\n無言の威圧」と言っている。"}, {"t": 501.6333333333333, "x": "無言のまま時間だけが過ぎていくのね。"}, {"t": 504.0833333333333, "x": "外では、彼らを支持する別の団体がビラをまいていた。"}, {"t": 507.43333333333334, "x": "わずか5人で、1日千人以上の警察官を\n動かし、10日になる。"}, {"t": 511.73333333333335, "x": "それを自分たちの成功だと書いていた。"}, {"t": 514.15, "x": "囲まれていることを成功だと思っていたの？"}, {"t": 516.7833333333333, "x": "国会では、そういうビラがあったと報告されている。"}, {"t": 520.4333333333333, "x": "何も要求しない人質。"}, {"t": 522.1833333333333, "x": "これは法律の上でも困った問題になった。"}, {"t": 525.0, "x": "法律？"}, {"t": 525.8, "x": "当時の刑法には人質罪という罪は無かった。"}, {"t": 528.7333333333333, "x": "警察庁の後藤田正晴 長官は、\n事件の数日後に国会でこう説明している。"}, {"t": 534.0166666666667, "x": "人質は逮捕監禁罪などで裁くしかない。"}, {"t": 536.8, "x": "その罪の一番重い刑は5年だ。"}, {"t": 538.9833333333333, "x": "ところが、物を盗んだ窃盗罪の一番重い刑は10年。"}, {"t": 542.6666666666666, "x": "人を閉じ込めるより物を盗む方が重いの？"}, {"t": 545.45, "x": "長官も「均衡を失しておる」と言った。"}, {"t": 548.0833333333334, "x": "実は、刑法を作り直す話し合いの中に、\n新しい罪の案はあった。"}, {"t": 552.45, "x": "人質による強要罪という案だ。"}, {"t": 554.5666666666667, "x": "ただその案には条件が付いていた。"}, {"t": 556.6833333333333, "x": "人質を取って、だれかに何かを\n「要求した」場合、という条件だ。"}, {"t": 561.2833333333333, "x": "あ……今回は要求してない。"}, {"t": 563.1666666666666, "x": "そうだ。"}, {"t": 563.7666666666667, "x": "長官は、要求をしない新しい型の事件は、\nこの案では「まかない切れない」と言った。"}, {"t": 569.1166666666667, "x": "法務省の刑事局長も、理屈の上では\n間に合わないと認めた。"}, {"t": 572.9833333333333, "x": "そして、要求の無い場合も\n含めて検討する、と答えている。"}, {"t": 576.8166666666667, "x": "法務大臣は別の見方をした。"}, {"t": 578.85, "x": "この事件はほかの重い罪を\n伴っていて、そちらで重く裁ける。"}, {"t": 582.8, "x": "人質罪を作るなら、人質を放したら\n刑を軽くする、という形になるだろう。"}, {"t": 587.85, "x": "ただそれがどれだけ効くかは分からないと。"}, {"t": 590.3, "x": "同じ事件でも見ている所が違うのね。"}, {"t": 592.9, "x": "法律の議論はこのあとも長く続くことになる。"}, {"t": 596.4166666666666, "x": "そもそも5人はどこで銃を手に入れたの？"}, {"t": 598.85, "x": "国会で警察庁の参事官が、その流れを説明している。"}, {"t": 602.6333333333333, "x": "始まりは事件のちょうど1年前だ。"}, {"t": 604.8666666666667, "x": "1971年2月17日、栃木県真岡市の銃砲店が襲われた。"}, {"t": 609.9833333333333, "x": "奪われたのは猟銃11丁と弾2,380発。"}, {"t": 613.6833333333333, "x": "11丁も？"}, {"t": 614.7666666666667, "x": "そのうち2丁はまもなく捜査で取り戻した。"}, {"t": 617.4166666666666, "x": "1丁は、その年に鳥取県米子市で\n起きた銀行強盗で使われていた。"}, {"t": 621.9333333333333, "x": "もう1丁は広島県福山市で見つかった。"}, {"t": 624.7, "x": "残りは7丁だった。"}, {"t": 626.1166666666667, "x": "警察はその行方をずっと追っていた。"}, {"t": 628.4166666666666, "x": "見つからなかったのね。"}, {"t": 629.9666666666667, "x": "見つける前に山荘の事件が起きた。"}, {"t": 632.25, "x": "参事官によると、残りの7丁は\nこの事件の流れの中で出てきた。"}, {"t": 636.5, "x": "それで全部を取り戻した形になったという。"}, {"t": 639.2666666666667, "x": "1年かけて追っていた銃が、山荘で出てきたのね。"}, {"t": 642.5666666666667, "x": "別の議員はライフル銃の数を問題にした。"}, {"t": 645.2166666666667, "x": "通産省に聞いた数字では、1970年に国内で\n売られたライフル銃は約5,000丁あった。"}, {"t": 651.1, "x": "国内で作った物が330丁で、\n外国から入れた物が4,800丁だ。"}, {"t": 656.3166666666667, "x": "これほどのライフル銃が国内に出回る\n理由があるのか、と議員は問うた。"}, {"t": 660.4166666666666, "x": "銃が手に渡ったところに、殉職者を出した\n大きな原因がある、という考えだった。"}, {"t": 666.0333333333333, "x": "でも1,400人もいたのよね。"}, {"t": 668.0, "x": "なぜ近づけなかったの？"}, {"t": 669.6333333333333, "x": "警察庁の警備局長は理由を二つ挙げている。"}, {"t": 672.5666666666667, "x": "一つ目は人質だ。"}, {"t": 674.05, "x": "犯人が顔を出したら撃てばいい、という\n意見も耳にしていた。"}, {"t": 677.4833333333333, "x": "けれど犯人が複数で人質が一人。"}, {"t": 680.0166666666667, "x": "そういうときは、どうしても\n慎重にならざるを得ない、と。"}, {"t": 683.3333333333334, "x": "一人を撃っても、ほかの4人が人質の\nそばにいるかもしれないものね。"}, {"t": 687.5666666666667, "x": "二つ目が地形だ。"}, {"t": 688.85, "x": "局長はここでテレビの話をしている。"}, {"t": 691.1666666666666, "x": "テレビの望遠のカメラで撮ると、\n地形がすっかり省かれる。"}, {"t": 694.5666666666667, "x": "目の前にぱっとあの家が出てくる。"}, {"t": 696.6333333333333, "x": "画面だとすぐそこにあるように見えるわね。"}, {"t": 699.0833333333334, "x": "ところが本当は、身を隠す所が\nほとんど無い斜面だった。"}, {"t": 702.75, "x": "南軽井沢のいわば一番上に建っている。"}, {"t": 705.3, "x": "中から見れば、近づく者は手に取るように見える。"}, {"t": 708.2666666666667, "x": "そのうえ屋根裏にこもって上から撃ってくる。"}, {"t": 710.7, "x": "いろいろな器材を使っても、短い\n時間では押さえられなかった、という。"}, {"t": 714.9666666666667, "x": "画面で見るのと坂の上に立つのとは別なのね。"}, {"t": 717.9333333333333, "x": "テレビを見ていた人には近くに見えた。"}, {"t": 720.2166666666667, "x": "現場の警察官には遠い坂だった。"}, {"t": 722.5666666666667, "x": "その差が10日間の長さの一つだった。"}, {"t": 725.1, "x": "3月の法務委員会では、ある議員がこう話している。"}, {"t": 728.3333333333334, "x": "山荘の様子をテレビで見ていた。"}, {"t": 730.3, "x": "武器を持った集団がすることの\nすさまじさを、身にしみて感じた、と。"}, {"t": 734.5333333333333, "x": "画面の向こうからでも、怖さは伝わっていたのね。"}, {"t": 737.65, "x": "伝わっていた。"}, {"t": 738.65, "x": "ただ、画面に映らない\n坂の長さまでは、伝わらなかった。"}, {"t": 742.9833333333333, "x": "ではなぜ10日目だったのか。"}, {"t": 744.6666666666666, "x": "事件の翌日、警察庁の官房長は国会でこう報告した。"}, {"t": 748.7333333333333, "x": "銃を撃つ以外には5人の反応は少なかった。"}, {"t": 751.5, "x": "人質の無事を十分に\n確かめられないまま、10日間が過ぎた。"}, {"t": 755.3666666666667, "x": "人質は心も体もとても心配な状態に来ている。"}, {"t": 758.95, "x": "生きているかどうかも分からなかったのね。"}, {"t": 761.3333333333334, "x": "そこで警察は決めた。"}, {"t": 762.8666666666667, "x": "人質を助けるには保養所の中に入るしかない。"}, {"t": 765.9166666666666, "x": "犯人の抵抗を、思い切った手段で取り除くしかない。"}, {"t": 769.25, "x": "実行は2月28日の午前10時から。"}, {"t": 772.1666666666666, "x": "待つ方針から入る方針に変えたのね。"}, {"t": 774.7166666666667, "x": "そうだ。"}, {"t": 775.3166666666667, "x": "ただ壊す建物は会社の保養所だった。"}, {"t": 777.8666666666667, "x": "国会では、建物を持つ楽器の会社が、人質を\n助けるために取り壊しを許した、と紹介されている。"}, {"t": 784.4666666666667, "x": "持ち主が壊していいと言ったのね。"}, {"t": 786.65, "x": "のちに国会では、山荘は\n廃墟のようになったとも言われた。"}, {"t": 790.1666666666666, "x": "壊したあとの片付けは、国会の言葉では\n「村長さんの好意」でできた。"}, {"t": 794.7666666666667, "x": "国の賠償の責任は無いという説明だった。"}, {"t": 797.5666666666667, "x": "議員は、もしこれが普通の人の家だったら\nどうするのか、と問いかけている。"}, {"t": 802.05, "x": "自分の家が舞台になったらってことね。"}, {"t": 804.5166666666667, "x": "そういう問いもこの日から生まれた。"}, {"t": 807.0833333333334, "x": "2月28日。"}, {"t": 808.4666666666667, "x": "この日動いた警察官は約1,000人。"}, {"t": 810.75, "x": "地元の長野県警のほか、警視庁と\n神奈川県警の応援も入った。"}, {"t": 815.0833333333334, "x": "午前9時部隊が持ち場に着いた。"}, {"t": 817.0833333333334, "x": "同時に警告が始まった。"}, {"t": 818.85, "x": "午前9時55分からは、最後の警告を繰り返した。"}, {"t": 822.4333333333333, "x": "返事は？"}, {"t": 823.2833333333333, "x": "何の返事も無かった。"}, {"t": 824.7666666666667, "x": "かえって銃を乱射してきた。"}, {"t": 826.5166666666667, "x": "報告の言葉では、「抵抗の姿勢を変えなかった」。"}, {"t": 829.6166666666667, "x": "最後の最後まで言葉は返ってこなかったのね。"}, {"t": 832.55, "x": "作戦の中身も国会で説明されている。"}, {"t": 835.2166666666667, "x": "まず放水などで壁の銃を撃つ穴を押さえる。"}, {"t": 837.75, "x": "そのあいだに階段や銃眼を壊す。"}, {"t": 839.9333333333333, "x": "中へ入り人質を助け5人を捕まえる。"}, {"t": 842.6, "x": "これが、国家公安委員長の中村寅太が\n当日の国会で読み上げた手順だ。"}, {"t": 847.4666666666667, "x": "壊すのが先なのね。"}, {"t": 849.05, "x": "そうだ。"}, {"t": 849.6833333333333, "x": "銃を構えた相手に、正面の扉から入ることはできない。"}, {"t": 853.1833333333333, "x": "だから壁の方を開けることにした。"}, {"t": 855.35, "x": "そのために呼ばれたのがクレーン車だった。"}, {"t": 858.2666666666667, "x": "午前10時47分。"}, {"t": 859.8666666666667, "x": "クレーン車による作業が始まった。"}, {"t": 862.0, "x": "これが鉄のたま？"}, {"t": 863.3166666666667, "x": "報告の正式な言い方は、ただ\n「クレーン車による作業」だ。"}, {"t": 867.1, "x": "のちの国会で、議員が「大きなたまを\nぶち当てて壁を破った車」と言い、"}, {"t": 871.4666666666667, "x": "人事院総裁が「鉄のたま」と言った。"}, {"t": 874.3, "x": "報道では鉄球と呼ばれている。"}, {"t": 876.1666666666666, "x": "最初に壊したのは、3階から2階へ下りる階段だ。"}, {"t": 879.6166666666667, "x": "階段を？"}, {"t": 880.4833333333333, "x": "ふさいだんだ。"}, {"t": 881.4, "x": "上の階と下の階を行き来できないようにした。"}, {"t": 884.0833333333334, "x": "次に、同じ階のトイレの窓と、管理人室の壁を壊した。"}, {"t": 888.0333333333333, "x": "そして11時40分。"}, {"t": 889.7166666666667, "x": "開いた3階の管理人室へ警察官が入った。"}, {"t": 892.85, "x": "同時に1階と2階にも窓を破って入った。"}, {"t": 895.7166666666667, "x": "上と下からいっしょに入ったのね。"}, {"t": 897.8333333333334, "x": "これが作戦の始まりだった。"}, {"t": 899.7333333333333, "x": "5月の委員会で、ある議員は\nこの車について注文をつけている。"}, {"t": 903.65, "x": "ああいう物はもう少し研究されて、\nもっと賢い方法は無かったのか。"}, {"t": 907.8666666666667, "x": "知恵のある人が警察にいるのに、\n何かもう少し手は無かったか、と。"}, {"t": 912.15, "x": "壁を壊すやり方そのものも問われたのね。"}, {"t": 914.85, "x": "そうだ。"}, {"t": 915.45, "x": "鉄のたまは、あとで褒められた\n道具というより、問いを残した道具だった。"}, {"t": 919.6333333333333, "x": "壁を壊すことで、正面の扉を\n通らずに中へ入る道を作った。"}, {"t": 923.8, "x": "ただ5人はまだ3階の奥にいた。"}, {"t": 925.8666666666667, "x": "そして入ろうとする警察官を待ち構えていた。"}, {"t": 928.85, "x": "ここからが一番危ないところね。"}, {"t": 931.0166666666667, "x": "そうだ。"}, {"t": 931.6166666666667, "x": "この少し前から、玄関の近くで\n撃ち合いが始まっていた。"}, {"t": 935.8666666666667, "x": "午前11時33分から55分ごろまで。"}, {"t": 938.8833333333333, "x": "玄関の近くで、警察官4人が撃たれてけがをした。"}, {"t": 942.3166666666667, "x": "そのうち2人がまもなく亡くなった。"}, {"t": 944.6166666666667, "x": "……2人。"}, {"t": 945.3166666666667, "x": "警視庁第二機動隊の隊長内田尚孝さん。"}, {"t": 948.1833333333333, "x": "警視庁特科車両隊の高見繁光さんだ。"}, {"t": 950.9833333333333, "x": "報告では、5人は中へ入ろうとする\n警察官の頭を狙って撃った、とされている。"}, {"t": 956.1666666666666, "x": "狙って……。"}, {"t": 957.0, "x": "この回ではそれ以上のことは話さない。"}, {"t": 959.3, "x": "午後0時50分にはもう一人撃たれた。"}, {"t": 961.7, "x": "正面の玄関から約100メートル離れた山の上で、\n取材していた放送局のカメラマンだ。"}, {"t": 967.3166666666667, "x": "100メートルも離れた所で？"}, {"t": 969.3, "x": "そうだ。"}, {"t": 969.9333333333333, "x": "坂の上の建物からは、それだけ遠くまで見えていた。"}, {"t": 973.25, "x": "のちに国会である議員はこう言った。"}, {"t": 975.3333333333334, "x": "階級章を見られて、幹部が狙い撃ちにされることのない\n守り方を考えるべきだ、と。"}, {"t": 980.4, "x": "別の答弁では、目印を目立たない\n物にしていたことも説明された。"}, {"t": 984.6833333333333, "x": "それでも2人が亡くなった。"}, {"t": 986.5, "x": "国会の人たちは、その日のことをどうやって知ったの？"}, {"t": 989.8833333333333, "x": "実はこの日国会は開いていた。"}, {"t": 992.0, "x": "そこへ、山荘からの知らせが届き続けていたんだ。"}, {"t": 995.8166666666667, "x": "2月28日、衆議院では予算委員会が開かれていた。"}, {"t": 999.6333333333333, "x": "総理大臣も大臣たちも出席する、大きな委員会だ。"}, {"t": 1003.1833333333333, "x": "この日質問に立った議員の一人は、\n本題の前にこう言った。"}, {"t": 1006.95, "x": "いまテレビ報道を通じて、全国に\n放送されている山荘の事件について。"}, {"t": 1011.3833333333333, "x": "すでに2名の殉職者が出たという情報がある、と。"}, {"t": 1014.5666666666667, "x": "委員会の途中でもう知らせが入っていたのね。"}, {"t": 1017.3333333333334, "x": "別の議員も本題に入る前に山荘の話をした。"}, {"t": 1020.5666666666667, "x": "すでに殉職が認められ、\nカメラマンまでけがをしている。"}, {"t": 1023.8666666666667, "x": "何といっても人命が一番大事だから、これ\n以上の犠牲を防ぎながら解決してほしい、と。"}, {"t": 1029.4, "x": "国会の中からもお願いをしていたのね。"}, {"t": 1031.95, "x": "午後になって委員長代理がこう告げた。"}, {"t": 1034.1833333333334, "x": "国家公安委員長から、山荘の事件について\n中間報告をしたいと申し出がある、と。"}, {"t": 1039.4166666666667, "x": "中村寅太 委員長が立って、\nそれまでの経過を読み上げた。"}, {"t": 1043.1833333333334, "x": "途中でこんなことを言っている。"}, {"t": 1044.9, "x": "これは、自分が午後4時に警察庁を\n出てきたときの報告です。"}, {"t": 1048.8666666666666, "x": "警察庁から国会へ移るあいだにも、\n状況が変わっていたのね。"}, {"t": 1052.8833333333334, "x": "そうだ。"}, {"t": 1053.5166666666667, "x": "委員長は2人目の警察官についてこう続けた。"}, {"t": 1056.5166666666667, "x": "出てくるまでは重体だったが、こちらに\n着いたときに亡くなったと連絡を受けた。"}, {"t": 1061.1833333333334, "x": "移動しているあいだに……。"}, {"t": 1062.5833333333333, "x": "報告の最後はこうだった。"}, {"t": 1064.25, "x": "ベッドルームに、男が3人、\n女が1人いることを確かめた。"}, {"t": 1068.15, "x": "ただ、その女性が人質の人か\nどうかは、まだ分からない。"}, {"t": 1071.8, "x": "今日のうちに解決したいという\n気持ちで続けている、と。"}, {"t": 1075.1833333333334, "x": "まだ、人質が無事かどうか\n分からないまま報告していたのね。"}, {"t": 1079.0333333333333, "x": "委員会ではそのまま質問が続いた。"}, {"t": 1081.3333333333333, "x": "そのころ山荘では、警察が\n建物の大部分を押さえていた。"}, {"t": 1085.6666666666667, "x": "午後1時過ぎ。"}, {"t": 1086.7166666666667, "x": "警察は1階と2階を全部押さえた。"}, {"t": 1089.05, "x": "3階でも管理人室と厨房を押さえた。"}, {"t": 1091.7, "x": "厨房って台所よね。"}, {"t": 1093.4166666666667, "x": "そうだ。"}, {"t": 1094.05, "x": "残ったのは、3階の屋根裏、\n談話室、ベッドルームの三つ。"}, {"t": 1098.0166666666667, "x": "5人はそこにこもって撃ち続けていた。"}, {"t": 1100.35, "x": "午後2時50分。"}, {"t": 1101.5333333333333, "x": "談話室から厨房の中へ爆発物が投げ込まれた。"}, {"t": 1104.9333333333334, "x": "爆発物？"}, {"t": 1106.05, "x": "厨房には警察官がいた。"}, {"t": 1107.85, "x": "ところがその爆発物は、窓側に\n取り付けてあった棚の上に載った。"}, {"t": 1112.1, "x": "そして壁の側で爆発した。"}, {"t": 1114.0666666666666, "x": "壁は吹き飛んだが、警察官3人のけがは軽くて済んだ。"}, {"t": 1117.85, "x": "棚に載ったから助かったのね。"}, {"t": 1119.95, "x": "報告ではわざわざ「幸い」と書いてある。"}, {"t": 1122.5666666666666, "x": "棚一つの位置で結果が変わった。"}, {"t": 1124.7166666666667, "x": "このあと爆発物は1個押収されている。"}, {"t": 1127.2333333333333, "x": "5人はまだ別の物も持っていたということだ。"}, {"t": 1130.05, "x": "中にいるのは銃だけじゃなかったのね。"}, {"t": 1132.3333333333333, "x": "残る3つの部屋をどう攻めるか。"}, {"t": 1134.2666666666667, "x": "ここで使われたのが水とガスだった。"}, {"t": 1137.15, "x": "午後3時30分。"}, {"t": 1138.5166666666667, "x": "警察はガス筒と放水を使い始めた。"}, {"t": 1141.1, "x": "まず天井裏と談話室にいる者を押さえる。"}, {"t": 1143.7166666666667, "x": "ガス筒って？"}, {"t": 1144.7833333333333, "x": "涙や咳が出るガスを出す筒だ。"}, {"t": 1146.9333333333334, "x": "国会では、報道で千発くらい撃ち込んだという\n話も出ていた、と議員が言っている。"}, {"t": 1151.8833333333334, "x": "ただこれは議員が伝えた報道の数字だ。"}, {"t": 1154.3166666666666, "x": "午後4時10分。"}, {"t": 1155.4166666666667, "x": "山荘の北側で、跳ね返った\n弾で警察官2人がけがをした。"}, {"t": 1159.5, "x": "午後4時30分ごろ。"}, {"t": 1161.0, "x": "5人が3階のベッドルームに集まった。"}, {"t": 1163.5333333333333, "x": "最後の部屋に集まったのね。"}, {"t": 1165.4333333333334, "x": "警察は、ガスと放水で押さえながら、\nベッドルームと談話室の間の壁を壊した。"}, {"t": 1170.4833333333333, "x": "同時に、ベッドルームの扉の前のバリケードを\n取り除いた。"}, {"t": 1173.9, "x": "午後5時18分、バリケードを除いていた\n警察官1人が、両目に異物が入ってけがをした。"}, {"t": 1179.5666666666666, "x": "午後6時2分、同じ場所で、\nもう1人が拳銃で撃たれた。"}, {"t": 1183.35, "x": "最後の扉の前が一番危なかったのね。"}, {"t": 1186.0833333333333, "x": "建物の中は真っ暗だった。"}, {"t": 1187.9833333333333, "x": "電気は切られ雨戸がしっかり閉じられていた。"}, {"t": 1190.5, "x": "警察は、中に入ってからは絶対に\n拳銃を使うな、と指示していた。"}, {"t": 1195.0833333333333, "x": "撃たれているのに？"}, {"t": 1196.25, "x": "暗闇の中では、人質と\n見分けがつかないかもしれない。"}, {"t": 1199.75, "x": "人質に男物の上着を着せて盾にされるおそれも\n考えていた、と担当者は国会で話している。"}, {"t": 1206.3333333333333, "x": "午後6時9分。"}, {"t": 1207.5, "x": "壊した壁と、扉の両方から、\n警察官がベッドルームへ入った。"}, {"t": 1211.7333333333333, "x": "中の5人は、ベッドにもぐりながら、なお撃ってきた。"}, {"t": 1214.95, "x": "6時13分警察官3人が散弾でけがをした。"}, {"t": 1218.4333333333334, "x": "最後の最後まで……。"}, {"t": 1219.7666666666667, "x": "そして6時14分。"}, {"t": 1221.25, "x": "人質の女性が助け出された。"}, {"t": 1223.45, "x": "……助かったのね。"}, {"t": 1224.6666666666667, "x": "助かった。"}, {"t": 1225.5333333333333, "x": "ちなみに、別の日の報告では、\nこの時刻は6時15分になっている。"}, {"t": 1229.8833333333334, "x": "1分の違いだが、報告ごとに数字が少しずつずれる。"}, {"t": 1233.3666666666666, "x": "これはこのあとの数字にも出てくる。"}, {"t": 1235.3833333333334, "x": "5人は順に全員が逮捕された。"}, {"t": 1237.4833333333333, "x": "押収されたのは、ライフル銃1丁、\n拳銃1丁、猟銃4丁、爆発物1個。"}, {"t": 1242.85, "x": "10日間、それだけの物が山荘の中にあったのね。"}, {"t": 1246.1833333333334, "x": "同じころ国会の予算委員会。"}, {"t": 1248.1666666666667, "x": "委員長が公安委員長に代わって報告した。"}, {"t": 1250.8666666666666, "x": "山荘の事件は落着したようです。"}, {"t": 1253.15, "x": "午後6時過ぎに犯人5名を全員逮捕しました。"}, {"t": 1256.1833333333334, "x": "人質の人は少しけがをしているが、\n救い出して心配はない、という報告です。"}, {"t": 1261.1833333333334, "x": "会議録にはここに「拍手」と書かれている。"}, {"t": 1264.15, "x": "委員会の部屋で拍手が起きたのね。"}, {"t": 1266.45, "x": "委員会は午後6時35分に散会した。"}, {"t": 1269.7833333333333, "x": "助け出された女性は軽井沢の病院に入院した。"}, {"t": 1272.8833333333334, "x": "医師の診断はこうだった。"}, {"t": 1274.45, "x": "疲れはひどいが心も体も異常は無い。"}, {"t": 1276.9333333333334, "x": "休めば回復する。"}, {"t": 1278.4333333333334, "x": "よかった……。"}, {"t": 1279.3333333333333, "x": "女性の話も翌日の国会で紹介されている。"}, {"t": 1282.3833333333334, "x": "10日間一度もお風呂に入れなかった。"}, {"t": 1284.55, "x": "両手と両足をロープで縛られて、\n3階のベッドルームに閉じ込められていた。"}, {"t": 1288.8833333333334, "x": "26日からは、食事もまったく与えられなかった。"}, {"t": 1292.3333333333333, "x": "助け出される28日まで、何も食べていなかったのね。"}, {"t": 1296.1166666666666, "x": "それからこんな話もあった。"}, {"t": 1297.9166666666667, "x": "犯人は5人だった。"}, {"t": 1299.3166666666666, "x": "5人はお互いを、「富士山」「立山」のような\n山の名前で呼び合っていた。"}, {"t": 1303.7833333333333, "x": "本当の名前じゃなくて？"}, {"t": 1305.4333333333334, "x": "そうだ。"}, {"t": 1306.0666666666666, "x": "人質の前では自分たちの名前を出さなかった。"}, {"t": 1308.9833333333333, "x": "この回でも5人の名前を出さない。"}, {"t": 1311.0666666666666, "x": "残すのは、山の名前で\n呼び合っていたという事実だけにしておく。"}, {"t": 1315.0166666666667, "x": "外にいた人は、中の様子を\n10日間まったく知らなかったのね。"}, {"t": 1319.05, "x": "そうだ。"}, {"t": 1319.6833333333334, "x": "外で150回呼びかけていたあいだ、\n中ではそういう10日間が過ぎていた。"}, {"t": 1324.8166666666666, "x": "さっき時刻が1分ずれていると言った。"}, {"t": 1327.1, "x": "けがをした人の数はもっと大きくずれている。"}, {"t": 1329.8166666666666, "x": "どのくらい？"}, {"t": 1330.7166666666667, "x": "事件の翌日衆議院での報告。"}, {"t": 1332.95, "x": "警察官12人とカメラマン1人で13人。"}, {"t": 1335.9166666666667, "x": "4日後参議院での報告。"}, {"t": 1337.6833333333334, "x": "警察官16人とカメラマン1人。"}, {"t": 1340.1, "x": "5月の委員会での答弁では、殉職者を除いて23人。"}, {"t": 1343.9166666666667, "x": "翌年の警察白書では、重いけがと\n軽いけがを合わせて26人。"}, {"t": 1348.2, "x": "それに一般の人のけがが1人。"}, {"t": 1350.4333333333334, "x": "13人から26人まで倍も違うじゃない。"}, {"t": 1353.3666666666666, "x": "あとから分かったけがを足したのか。"}, {"t": 1355.4, "x": "28日の一日だけか10日間全部か。"}, {"t": 1358.25, "x": "数え方の範囲が違うのかもしれない。"}, {"t": 1360.55, "x": "ただ、どれが正しいかは、記録からは決められない。"}, {"t": 1363.6, "x": "だからこの回では全部並べておく。"}, {"t": 1365.85, "x": "攻防の長さも記録によって違うの？"}, {"t": 1368.3166666666666, "x": "28日の攻防については、ある議員が\n「八時間余」と言った。"}, {"t": 1372.7, "x": "10日間全体は、別の議員が「二百十八時間十五分と\n記されておりました」と読み上げている。"}, {"t": 1378.8333333333333, "x": "本会議でも「恐怖の二百十八時間」という\n言葉が出た。"}, {"t": 1382.7, "x": "10日間を時間で数えた人もいたのね。"}, {"t": 1385.2833333333333, "x": "そうだ。"}, {"t": 1385.9166666666667, "x": "そしてどの記録でも揃っている数字がある。"}, {"t": 1388.4333333333334, "x": "亡くなった警察官は2人だ。"}, {"t": 1391.05, "x": "この事件で亡くなったのは、\n警察官の2人だけではない。"}, {"t": 1394.6666666666667, "x": "ほかにも？"}, {"t": 1395.55, "x": "警察白書は注の中にこう書いている。"}, {"t": 1398.0166666666667, "x": "あさま山荘事件で、人質の身代わりを\n申し出た一般の人がいた。"}, {"t": 1402.2333333333333, "x": "その人が撃たれて亡くなった。"}, {"t": 1404.2, "x": "人質と代わろうとしたの？"}, {"t": 1406.05, "x": "白書の言葉では「人質の身代りを志願し」だ。"}, {"t": 1409.3333333333333, "x": "この回ではその人の名前を出さない。"}, {"t": 1411.55, "x": "国会の本会議ではある議員がこう言った。"}, {"t": 1413.9833333333333, "x": "2人の警察官と民間の1人。"}, {"t": 1416.2666666666667, "x": "3人の惜しんでも余りある命が失われたと。"}, {"t": 1419.1, "x": "佐藤栄作 首相も答えている。"}, {"t": 1421.35, "x": "殉職した2人の警官と1人の市民。"}, {"t": 1423.9333333333334, "x": "残された家族のこれからの暮らしが、\n少しでも明るくなるように助けていく、と。"}, {"t": 1428.9333333333334, "x": "佐藤栄作 首相も「一市民」と言ったのね。"}, {"t": 1432.2333333333333, "x": "言った。"}, {"t": 1432.8166666666666, "x": "けがをした人たちについても、長い期間にわたる\nその後の手当てまで、万全を期すと述べている。"}, {"t": 1438.4333333333334, "x": "この年の警察白書の数字ではこうなる。"}, {"t": 1441.0166666666667, "x": "警察官の殉職2人重軽傷26人。"}, {"t": 1443.9666666666667, "x": "一般の人の死亡1人けが1人。"}, {"t": 1446.35, "x": "白書はそのうえで、銃や爆発物への備えを\n充実させる必要を強く感じさせた、と結んでいる。"}, {"t": 1452.5666666666666, "x": "一人を助けるために3人が亡くなったのね。"}, {"t": 1455.4666666666667, "x": "その重さが、このあと国会の議論の中心になっていく。"}, {"t": 1459.55, "x": "山荘の事件が終わった直後、国家公安委員長は\n全国の警察に指示を出していた。"}, {"t": 1464.8333333333333, "x": "どんな指示？"}, {"t": 1465.7666666666667, "x": "この事件は、国民に大きなショックを与えている。"}, {"t": 1468.7166666666667, "x": "これに刺激された別の勢力が、\n暴力をふるうおそれがある。"}, {"t": 1472.2833333333333, "x": "思いがけない事態が起きないよう、\n急いで手配して用心せよ、という指示だ。"}, {"t": 1476.8333333333333, "x": "事件のあとに、別の騒ぎが\n起きるかもしれないってことね。"}, {"t": 1480.4, "x": "ところが2日後の3月1日、\n東京駅の近くで事件が起きた。"}, {"t": 1484.6166666666666, "x": "春の賃上げを求めるデモの列に、\n右翼団体の宣伝カーが突っ込んだ。"}, {"t": 1488.9, "x": "デモに加わっていた人が重いけがをした。"}, {"t": 1491.5, "x": "山荘の事件とつながりがあったの？"}, {"t": 1493.75, "x": "警察庁の参事官は国会でこう説明している。"}, {"t": 1496.85, "x": "その宣伝カーは、山荘の事件について\n自分たちの立場から宣伝をするために出発した。"}, {"t": 1502.4, "x": "警察はそれを知っていて、\n係員3人があとを追っていた。"}, {"t": 1505.85, "x": "ところが東京駅の南口あたりで道が\n混み、車について行けなくなった。"}, {"t": 1510.3833333333334, "x": "その先で、デモの列と同じ場所を\n通ることになった、という。"}, {"t": 1514.2166666666667, "x": "見張っていたのに見失ったのね。"}, {"t": 1516.3, "x": "委員長はまことに遺憾だと述べた。"}, {"t": 1518.3666666666666, "x": "そして改めて全国の警察に注意を指示した。"}, {"t": 1521.4333333333334, "x": "山荘の10日間が終わっても、\nその影響はすぐには収まらなかった。"}, {"t": 1526.1333333333334, "x": "事件の翌日、衆議院の地方行政委員会は、\nまず全員が起立して2人に黙祷をささげた。"}, {"t": 1532.0833333333333, "x": "その後も国会では残された家族の話が続いた。"}, {"t": 1535.3, "x": "3月2日の委員会では、ある議員が\n新聞の記事を紹介している。"}, {"t": 1539.35, "x": "関西の財界から\n1,000万円の見舞いを出したいという話がある、と。"}, {"t": 1543.45, "x": "お子さんも小さいので、できる限り\n面倒を見てほしい、と議員は求めた。"}, {"t": 1547.65, "x": "同じ日の別の委員会で、国家公安委員長は、今ある\n決まりの中で一番手厚い扱いをしたいと答えた。"}, {"t": 1554.1, "x": "3月9日の委員会で、\n警察庁の官房長が金額を答えている。"}, {"t": 1558.5333333333333, "x": "殉職した2人への一時金は、\n内田尚孝さんが約2,048万円。"}, {"t": 1563.2666666666667, "x": "高見繁光さんが約2,041万円。"}, {"t": 1566.1333333333334, "x": "ほとんど同じ金額なのね。"}, {"t": 1568.0333333333333, "x": "総理大臣から出る特別の褒賞金は、\n最高で500万円と決まっていた。"}, {"t": 1572.7, "x": "これも階級ではなく、手柄の大きさで\n額を決める、という説明だった。"}, {"t": 1576.9833333333333, "x": "5月には人事院の担当者が、2人とも年金を\n受け取る対象になると答えている。"}, {"t": 1582.0166666666667, "x": "議員は、階級で差があるのではないかと聞いていた。"}, {"t": 1584.9166666666667, "x": "答えは、補償の計算は給料が\n元になるので差が出ることはある。"}, {"t": 1588.7833333333333, "x": "けれど一時金については、階級で\n差をつけていない、というものだった。"}, {"t": 1593.0166666666667, "x": "法律の方は何か変わったの？"}, {"t": 1595.1166666666666, "x": "変わった。"}, {"t": 1595.8333333333333, "x": "命に関わる危険な仕事で亡くなった\n公務員への補償を、さらに厚くする改正だ。"}, {"t": 1600.8833333333334, "x": "それまで、普通の補償の100分の125だった\n上乗せを、100分の150にする。"}, {"t": 1606.2333333333333, "x": "その改正は事件のあとに決まったの？"}, {"t": 1608.6333333333334, "x": "そこが国会で問われた。"}, {"t": 1610.1833333333334, "x": "改正の適用は、その年の1月1日まで\nさかのぼることになっていた。"}, {"t": 1614.7166666666667, "x": "ある議員はこう言った。"}, {"t": 1615.9833333333333, "x": "山荘の2人を救うだけなら、3月からでもいいはずだ。"}, {"t": 1619.4833333333333, "x": "前の年に別の事件で亡くなった\n警察官3人は、この線の外になる、と。"}, {"t": 1624.5166666666667, "x": "線をどこに引くかで救われる人が変わるのね。"}, {"t": 1627.4, "x": "人事院総裁の佐藤達夫はこう答えた。"}, {"t": 1629.9666666666667, "x": "意見書を出したのは3月16日で、\n事件の直後に当たる。"}, {"t": 1633.7833333333333, "x": "ただ、事件から急に思い立ったのでは間に合わない。"}, {"t": 1636.8333333333333, "x": "もっと前から研究会を作って調べていたと。"}, {"t": 1639.6666666666667, "x": "鉄のたまの話をしたのもこの人事院総裁だ。"}, {"t": 1642.6833333333334, "x": "危ない職務で、あんな鉄の\nたまでは入れないと断れるか。"}, {"t": 1646.1166666666666, "x": "断れずに身を挺して入る仕事だから、\n補償を厚くする、という説明だった。"}, {"t": 1651.4833333333333, "x": "3月9日の委員会では警察の備えも問われた。"}, {"t": 1654.7666666666667, "x": "ある議員はこの戦いを「城攻め」と呼んだ。"}, {"t": 1657.6666666666667, "x": "城攻め？"}, {"t": 1658.5166666666667, "x": "建物にこもった相手を外から攻める、という意味だ。"}, {"t": 1661.6333333333334, "x": "議員はまず、地方の機動隊の訓練の少なさを挙げた。"}, {"t": 1665.0, "x": "全国の機動隊は6,000人弱という見立てだった。"}, {"t": 1668.15, "x": "しかも専従でない機動隊もあって、\n訓練は月に2回ほどだ、と。"}, {"t": 1672.3833333333334, "x": "いつも訓練している人ばかりではなかったのね。"}, {"t": 1675.2666666666667, "x": "次に装備の話をした。"}, {"t": 1676.95, "x": "部隊として持つ装備と、\n一人一人が身に着ける装備だ。"}, {"t": 1680.5166666666667, "x": "ライフル銃の弾からどう身を守るか。"}, {"t": 1682.7, "x": "人質をできるだけ傷つけずに\n助ける、新しい道具は無いか。"}, {"t": 1686.5833333333333, "x": "催涙ガスも、もっと体に害の少ない\n物は無いのか、と問うた。"}, {"t": 1690.8, "x": "同じ日の失敗を、次に繰り返さないための質問ね。"}, {"t": 1694.3666666666666, "x": "中村寅太 委員長はこう答えた。"}, {"t": 1696.75, "x": "警察はなるべく少ない人数で動くのが基本だ。"}, {"t": 1699.7833333333333, "x": "そのかわり、役に立つ器材を\n使って国民の期待にこたえる。"}, {"t": 1703.55, "x": "ただ実情を見ると、警備の体制を\n急いで強めなければならない、と。"}, {"t": 1707.65, "x": "警察庁の警備局長も、3月3日に\n同じことを言っていた。"}, {"t": 1711.6333333333334, "x": "前もって使うべき器材を、これから\nいろいろ工夫していくべきだ、と。"}, {"t": 1715.7, "x": "鉄のたまもその器材の一つだったのね。"}, {"t": 1718.3833333333334, "x": "そういうことになる。"}, {"t": 1720.2, "x": "最初の章でテレビの望遠カメラの話をした。"}, {"t": 1723.0166666666667, "x": "28日は、そのテレビが長い時間、\n山荘を映し続けた日でもある。"}, {"t": 1727.6333333333334, "x": "どのくらい？"}, {"t": 1728.55, "x": "3月の参議院の委員会で、議員がNHKに聞いている。"}, {"t": 1732.2, "x": "28日、NHKは約10時間近く、現場から生中継をした。"}, {"t": 1736.9, "x": "9時間20分ほどだ。"}, {"t": 1738.4666666666667, "x": "その日の国会では予算の総括質問があった。"}, {"t": 1741.5, "x": "新聞の番組表では国会中継が予定されていた。"}, {"t": 1744.8333333333333, "x": "それを取りやめたのね。"}, {"t": 1746.3166666666666, "x": "そうだ。"}, {"t": 1746.95, "x": "週刊誌には放送評論家の公開質問状が載った。"}, {"t": 1750.3166666666666, "x": "山荘の報道と国会中継は、どちらが\n大事と考えるのか、という題だった。"}, {"t": 1755.1833333333334, "x": "NHKの専務理事はこう答えている。"}, {"t": 1757.5833333333333, "x": "その日の出来事の報道の値打ちで決めた、\n報道としては異例の措置だった、と。"}, {"t": 1762.2666666666667, "x": "子どもが赤軍ごっこをまねするのではないか、という\n批評もあったと認めている。"}, {"t": 1766.8166666666666, "x": "国会議員も見ていたのかしら。"}, {"t": 1768.85, "x": "衆議院の委員会である議員がこんな話をした。"}, {"t": 1771.6833333333334, "x": "その日の夕方、予算委員会の部屋で\n同僚に呼び止められた。"}, {"t": 1775.4166666666667, "x": "NHKが山荘を中継している、\nどうなったか見てきてくれ、と頼まれた。"}, {"t": 1780.0166666666667, "x": "それで下の事務所まで、テレビを見に行ったという。"}, {"t": 1782.9166666666667, "x": "国会の中でもみんな気にしていたのね。"}, {"t": 1785.4666666666667, "x": "のちの委員会でもこんな言葉が出ている。"}, {"t": 1787.7833333333333, "x": "国民は、一日も早く人質が救われるよう、"}, {"t": 1790.7666666666667, "x": "警察官しっかりやってくれという\n気持ちでテレビを見ていたと思う、と。"}, {"t": 1795.3833333333334, "x": "事件はこれで終わらなかった。"}, {"t": 1797.0833333333333, "x": "5人を捕まえたあと取り調べが進んだ。"}, {"t": 1799.5833333333333, "x": "そこで、山の中の隠れ家で\n起きていたことが明らかになる。"}, {"t": 1803.3, "x": "山の中で？"}, {"t": 1804.3833333333334, "x": "同じ組織の中で仲間の命が奪われていた。"}, {"t": 1807.3, "x": "警察白書の数字では、総勢29人のうち12人だ。"}, {"t": 1811.2666666666667, "x": "12人……。"}, {"t": 1812.1, "x": "この回では、それがどのように行われたかは話さない。"}, {"t": 1815.3666666666666, "x": "3月16日の衆議院本会議では、各党の議員が\nこの事件について緊急に質問した。"}, {"t": 1821.1666666666667, "x": "ある議員は、山荘の事件より次々に発覚した\n事件が、全国に深い衝撃を与えていると言った。"}, {"t": 1827.4666666666667, "x": "教育の責任か親の責任か警察の取り締まりか。"}, {"t": 1830.8166666666666, "x": "国会の議論は、山荘の外へ大きく広がっていった。"}, {"t": 1834.3333333333333, "x": "山荘で人質を取ったときには、\nもうその事件のあとだったのね。"}, {"t": 1838.35, "x": "時間の順ではそうなる。"}, {"t": 1839.8666666666666, "x": "委員会では、ある議員が警察の見方も問題にした。"}, {"t": 1843.2166666666667, "x": "事件のあと、現地の指揮官は新聞に\n「人質を大切にする原理があるので\n望みはあった」と話していた。"}, {"t": 1849.8166666666666, "x": "あとで分かったことからすると、見方が\n甘かったのではないか、と。"}, {"t": 1853.7833333333333, "x": "外から見ていた様子と中の実際は違ったのね。"}, {"t": 1856.95, "x": "白書によると、警察は山の隠れ家に\n集まっていた17人全員を逮捕した。"}, {"t": 1861.8666666666666, "x": "押収した物は、397件、1万568点にのぼった。"}, {"t": 1867.3333333333333, "x": "最後に、国会でこの10日間が\nどう評価されたかを並べておく。"}, {"t": 1871.1166666666666, "x": "評価ははっきり二つに分かれた。"}, {"t": 1873.2166666666667, "x": "どう分かれたの？"}, {"t": 1874.3333333333333, "x": "一つ目。"}, {"t": 1875.15, "x": "本会議である議員はこう言った。"}, {"t": 1876.9666666666667, "x": "警察官2名の死亡、十数名の負傷という\n高い代償を払っても、"}, {"t": 1881.0666666666666, "x": "一人の女性の命を救うために、\n人命尊重の方針を貫いた。"}, {"t": 1885.4666666666667, "x": "そのことに無条件に心から敬意を表すると。"}, {"t": 1888.45, "x": "命を守る方を選んだという見方ね。"}, {"t": 1890.95, "x": "二つ目。"}, {"t": 1891.7333333333333, "x": "5月の委員会で別の議員はこう言った。"}, {"t": 1894.1166666666666, "x": "山荘は、警察のやり方によっては、\n警察官の犠牲を出さずに済む道があった。"}, {"t": 1899.1333333333334, "x": "別の議員も、もっと初めのうちにやれば、\nあんなことにはならない、と言っている。"}, {"t": 1903.8833333333334, "x": "やり方の方を問題にしたのね。"}, {"t": 1906.0833333333333, "x": "逆の方向の意見もあった。"}, {"t": 1907.8666666666666, "x": "新聞には、警察はライフル銃でもっと\n重く武装すべきだという声も出ていた。"}, {"t": 1912.4166666666667, "x": "火の力で一気に片付けるべきだという声だ。"}, {"t": 1915.2333333333333, "x": "3月2日の委員会で、ある議員は\nそれを無理な意見だと言った。"}, {"t": 1919.0333333333333, "x": "人質がいる状況で、そういう\n無理なことはすべきでない、と。"}, {"t": 1922.7666666666667, "x": "もっと早くもっと強くもっと慎重に。"}, {"t": 1925.15, "x": "同じ10日間にいろいろな注文が出たのね。"}, {"t": 1927.8333333333333, "x": "これに対する警察庁の担当者の答えは、\n人質の命が先だった。"}, {"t": 1932.3666666666666, "x": "犯人は複数で人質は一人。"}, {"t": 1934.5333333333333, "x": "場所は千早城のような攻めにくい所だった。"}, {"t": 1937.2333333333333, "x": "だから、まず人質の命の安全を\n確保することを考えた、と。"}, {"t": 1941.3833333333334, "x": "中村寅太 委員長は、今回のような凶悪な\n事態は、これまで考えていなかったと認めた。"}, {"t": 1947.3, "x": "そのうえで、器材を整え、新しい情勢に合った\n警備を考えなければならない、と言った。"}, {"t": 1952.7, "x": "どちらの見方が正しいとは言わないのね。"}, {"t": 1955.2, "x": "この回では決めない。"}, {"t": 1956.4666666666667, "x": "記録に残っているのは両方の言葉だ。"}, {"t": 1959.5, "x": "1972年2月19日土曜日の午後。"}, {"t": 1962.6666666666667, "x": "坂を600メートル上った保養所に、5人が入った。"}, {"t": 1966.0333333333333, "x": "留守番をしていた一人の女性が人質になった。"}, {"t": 1968.9833333333333, "x": "警察は最高時1,400人で囲んだ。"}, {"t": 1971.6166666666666, "x": "150回をこえる呼びかけに返事は無かった。"}, {"t": 1974.4166666666667, "x": "要求も最後まで一度も無かった。"}, {"t": 1976.6833333333334, "x": "何も言わない相手と10日間向き合ったのね。"}, {"t": 1979.4, "x": "そうだ。"}, {"t": 1980.0166666666667, "x": "10日目の朝9時55分に最後の警告。"}, {"t": 1982.7333333333333, "x": "10時47分クレーン車が動き出した。"}, {"t": 1985.35, "x": "のちに国会で「鉄のたま」と呼ばれた物だ。"}, {"t": 1988.3166666666666, "x": "11時33分からの22分間で、\n警察官2人が撃たれて亡くなった。"}, {"t": 1993.2666666666667, "x": "午後6時14分人質は助け出された。"}, {"t": 1996.05, "x": "その知らせは、国会の予算委員会にも\n届き、部屋に拍手が起きた。"}, {"t": 2000.4833333333333, "x": "同じ日に、亡くなった人と助かった人がいたのね。"}, {"t": 2003.9333333333334, "x": "そして、身代わりを申し出た\n一般の男性も、命を落としている。"}, {"t": 2007.8666666666666, "x": "テレビは10時間近くそれを映し続けた。"}, {"t": 2010.4666666666667, "x": "望遠のカメラには、山荘がすぐ\n目の前にあるように見えた。"}, {"t": 2013.9333333333334, "x": "けれど、そこまでの坂には、身を\n隠す所がほとんど無かった。"}, {"t": 2017.95, "x": "画面からは見えなかった坂ね。"}, {"t": 2019.9833333333333, "x": "人質を盾にしながら、何も\n要求しない相手に、どこまで待つか。"}, {"t": 2024.2166666666667, "x": "いつ壁を壊すと決めるか。"}, {"t": 2025.9166666666667, "x": "国会の議論は、補償の線の引き方と、\n人質の罪の名前にまで広がった。"}, {"t": 2030.95, "x": "その答えは、この日に一つに決まったわけではない。"}, {"t": 2034.15, "x": "記録には、待った10日間と、壊した\n1日の両方が残っているのね。"}, {"t": 2038.7166666666667, "x": "そういうことだ。"}, {"t": 2039.7333333333333, "x": "最後に、亡くなった内田尚孝さん、高見繁光さん、\nそして一般の男性のご冥福をお祈りする。"}, {"t": 2045.8833333333334, "x": "今回の動画はここまでだ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
