<script>
const D={"name": "132", "file": "132_編集用", "dur": 2067.0333125, "segs": [], "subs": [{"t": 0.0, "x": "1972年5月、\n国会の委員会で、ある議員がこう聞いた。"}, {"t": 4.4, "x": "「あの大きなたまをぶち当てて、壁を\n破ったあの車は何と言いましたか」。"}, {"t": 8.533333333333333, "x": "大きなたま？"}, {"t": 9.666666666666666, "x": "鉄のたまだ。"}, {"t": 10.8, "x": "クレーン車でぶつけて、建物の壁を壊す重いたまだ。"}, {"t": 14.116666666666667, "x": "それが使われたのは同じ年の2月28日。"}, {"t": 17.216666666666665, "x": "長野県の軽井沢、冬の山の上に建つ保養所だった。"}, {"t": 20.75, "x": "その建物が、あさま山荘だ。"}, {"t": 23.016666666666666, "x": "聞いたことがある呼び名だわ。"}, {"t": 24.716666666666665, "x": "5人が人質を取って立てこもり、\n警察が10日間囲んだ事件だ。"}, {"t": 28.916666666666668, "x": "最後の日、警察はクレーン車で壁を破り、中へ入った。"}, {"t": 32.53333333333333, "x": "人質は助け出された。"}, {"t": 34.2, "x": "ただその日に警察官が2人亡くなっている。"}, {"t": 37.05, "x": "10日間も待って最後は壁を壊したのね？"}, {"t": 39.75, "x": "そうだ。"}, {"t": 40.88333333333333, "x": "今回はその10日間を、\n警察の判断の順番で追っていく。"}, {"t": 44.61666666666667, "x": "なぜ10日も待ったのか。"}, {"t": 46.21666666666667, "x": "そして最後の日に、何を決めたのか、ね。"}, {"t": 49.1, "x": "そしてなぜ鉄のたまだったのか。"}, {"t": 51.1, "x": "材料は、事件の翌日から国会で\n読み上げられた警察の報告だ。"}, {"t": 55.38333333333333, "x": "立てこもった5人の名前を、この回では出さない。"}, {"t": 58.4, "x": "分かった。"}, {"t": 59.53333333333333, "x": "まず、どうして山荘に人がいたのかから聞きたいわ。"}, {"t": 62.78333333333333, "x": "そこは山荘より前の話から始まる。"}, {"t": 65.91666666666667, "x": "始まりは山荘から少し離れた群馬県だ。"}, {"t": 68.76666666666667, "x": "1972年2月7日。"}, {"t": 71.1, "x": "一般の人から警察に届け出があった。"}, {"t": 73.7, "x": "榛名湖のほとりに怪しい車が置かれている。"}, {"t": 76.25, "x": "ときどき別の車が来て、2、\n3日そのままになっている、という話だった。"}, {"t": 81.25, "x": "車が一台置きっぱなし？"}, {"t": 83.08333333333333, "x": "それだけの届け出だった。"}, {"t": 84.7, "x": "ところが警察は、それまでの捜査と突き合わせた。"}, {"t": 87.8, "x": "そして、榛名山の中で、雪に\n埋もれた隠れ家を見つける。"}, {"t": 91.76666666666667, "x": "山の中に隠れ家があったの？"}, {"t": 93.76666666666667, "x": "警察白書は「雪に埋もれたアジト」と書いている。"}, {"t": 97.08333333333333, "x": "そこにいたのは、連合赤軍と\n名乗る組織の人たちだった。"}, {"t": 100.85, "x": "前の年に、二つの過激な\nグループが組んでできた組織だ。"}, {"t": 104.5, "x": "警察は、全国の警察に検問と\n捜索を強めるよう指示した。"}, {"t": 108.68333333333334, "x": "2月17日には、組織の幹部2人を捕まえている。"}, {"t": 112.26666666666667, "x": "ほかの者はさらに山の奥へ逃げた。"}, {"t": 114.58333333333333, "x": "冬の山を？"}, {"t": 115.71666666666667, "x": "そうだ。"}, {"t": 116.85, "x": "警察庁の警備局長は、ヘリで\n妙義山の上を越えて現地へ向かった。"}, {"t": 121.13333333333334, "x": "国会では、そのとき見た山の様子を\n「雪におおわれた峻険の状況」と言っている。"}, {"t": 126.18333333333334, "x": "警察の見立てでは、彼らは3日ほどかけて、\nかまくらのようなものを作りながら進んだ。"}, {"t": 131.5, "x": "普通の道ではない道を通った。"}, {"t": 133.5, "x": "そして19日の夜中ごろ、和美峠の\nあたりに出てきた、という。"}, {"t": 137.53333333333333, "x": "峠を越えた先が軽井沢なのね。"}, {"t": 139.8, "x": "そういうことだ。"}, {"t": 141.45, "x": "2月19日は土曜日だった。"}, {"t": 143.35, "x": "この日の朝8時、信越線の軽井沢駅で、\n4人が捕まっている。"}, {"t": 147.85, "x": "駅で？"}, {"t": 148.98333333333332, "x": "山を下りてきたうちの一部だ。"}, {"t": 150.76666666666668, "x": "きっかけは駅の売店の女性の通報だった。"}, {"t": 153.58333333333334, "x": "警察官が見つけたんじゃないのね。"}, {"t": 155.78333333333333, "x": "国会でもそこが話題になっている。"}, {"t": 157.9, "x": "ある議員はこう指摘した。"}, {"t": 159.46666666666667, "x": "駅には警察官もいたようだが、逮捕は\n売店の女性の通報によるものだった。"}, {"t": 164.15, "x": "榛名でも、妙義でも、捕まえる\nきっかけは住民の通報が多かった、と。"}, {"t": 168.78333333333333, "x": "住民の目が警察の目より先だったってこと？"}, {"t": 171.7, "x": "議員はそう言って、警察に反省すべき\n点は反省してほしいと求めた。"}, {"t": 176.05, "x": "ただ、群馬県警や長野県警の努力が足りなかったと\n言っているのではない、とも付け加えている。"}, {"t": 181.75, "x": "長野県も、県境の主な道に\n百数十人の警察官を置いていた。"}, {"t": 186.16666666666666, "x": "それでも山の道は広すぎた。"}, {"t": 188.1, "x": "警察庁の説明では、この一連の追跡で\n捕まった者はこうなる。"}, {"t": 192.38333333333333, "x": "妙義山で4人。"}, {"t": 193.46666666666667, "x": "軽井沢駅で4人。"}, {"t": 194.78333333333333, "x": "そしてのちに山荘で5人だ。"}, {"t": 196.68333333333334, "x": "駅で4人が捕まったあと残りは5人。"}, {"t": 199.03333333333333, "x": "この5人が、その日の午後、警察と出会うことになる。"}, {"t": 202.5, "x": "午後に何が起きたの？"}, {"t": 203.98333333333332, "x": "舞台は軽井沢の南の新しく開けた別荘地だ。"}, {"t": 207.76666666666668, "x": "19日の午後3時10分ごろ。"}, {"t": 209.78333333333333, "x": "別荘地の中の、空き家になっていた山荘のそばだ。"}, {"t": 213.0, "x": "捜索していた長野県警の機動隊員が、\n5人を見つけた。"}, {"t": 216.76666666666668, "x": "踏み込もうとしたところ激しい銃撃を受けた。"}, {"t": 219.58333333333334, "x": "撃ってきたの？"}, {"t": 220.71666666666667, "x": "警察官2人がけがをした。"}, {"t": 222.6, "x": "5人は銃を乱射しながら、急な坂道を上へ逃げた。"}, {"t": 225.88333333333333, "x": "警察官が身を伏せているあいだに、\n姿が見えなくなった。"}, {"t": 229.51666666666668, "x": "見失ったのね。"}, {"t": 230.78333333333333, "x": "そうだ。"}, {"t": 231.91666666666666, "x": "そのあと、一帯を捜していた\n警察官が、いきなり上の方から撃たれる。"}, {"t": 236.33333333333334, "x": "時刻は3時25分から30分くらいのあいだだった。"}, {"t": 239.76666666666668, "x": "撃たれた方向に建物がある。"}, {"t": 241.61666666666667, "x": "それが、さっきの空き家から坂を\n約600メートル上った保養所。"}, {"t": 245.55, "x": "楽器の会社の保養所で、あさま山荘と呼ばれていた。"}, {"t": 248.98333333333332, "x": "上から撃たれて隠れ場所が分かったのね。"}, {"t": 251.45, "x": "国会ではある議員がこの間を問題にした。"}, {"t": 254.1, "x": "最初の銃撃から山荘に入るまで、\n約1時間の空白があるのはなぜか、と。"}, {"t": 258.98333333333335, "x": "警察庁の警備局長は地形の話をした。"}, {"t": 261.8833333333333, "x": "あの場所は南軽井沢の一番はずれだ。"}, {"t": 264.4, "x": "地面から数百メートル高いところに、山荘がある。"}, {"t": 267.6333333333333, "x": "その急な坂を、撃たれながら\n追っていた、という答えだった。"}, {"t": 271.1666666666667, "x": "それ以上の細かい動きは、裁判があるので\n省かせてほしい、とも言っている。"}, {"t": 275.68333333333334, "x": "答えはそこで止まったのね。"}, {"t": 277.48333333333335, "x": "止まった。"}, {"t": 278.6166666666667, "x": "そして5人は、山荘の中にいた一人の女性と出会う。"}, {"t": 282.6333333333333, "x": "山荘にはそのとき一人だけ人がいた。"}, {"t": 285.1333333333333, "x": "管理人の妻で当時31歳。"}, {"t": 287.3, "x": "たまたま一人で留守番をしていた。"}, {"t": 289.5, "x": "一人で……。"}, {"t": 290.6333333333333, "x": "警察白書はこのあとのことを短く書いている。"}, {"t": 293.5, "x": "5人は、洗濯用のロープで女性を後ろ手に縛った。"}, {"t": 296.78333333333336, "x": "さらに両足首と両ひざも縛った。"}, {"t": 299.03333333333336, "x": "そして入り口にバリケードを作った。"}, {"t": 301.1666666666667, "x": "壁には銃を出して撃つ穴を開けた。"}, {"t": 303.3833333333333, "x": "撃つ穴？"}, {"t": 304.51666666666665, "x": "銃眼という。"}, {"t": 305.65, "x": "城の壁に開いているのぞき穴のようなものだ。"}, {"t": 308.4, "x": "建物には3階まであった。"}, {"t": 310.23333333333335, "x": "のちに国会で、警察の担当者は\nこの場所を「千早城」にたとえている。"}, {"t": 314.8666666666667, "x": "千早城って？"}, {"t": 316.01666666666665, "x": "昔、山の上で大軍を相手に持ちこたえたと伝わる城だ。"}, {"t": 319.76666666666665, "x": "攻めにくく守りやすいという意味で使った。"}, {"t": 322.21666666666664, "x": "この回では女性の名前を出さない。"}, {"t": 324.26666666666665, "x": "白書も名前を伏せて「Bさん」と書いている。"}, {"t": 327.18333333333334, "x": "白書の時点でもう伏せてあったのね。"}, {"t": 329.48333333333335, "x": "そうだ。"}, {"t": 330.6166666666667, "x": "ここから山荘を囲む10日間が始まる。"}, {"t": 333.81666666666666, "x": "長野県警は現地に警備本部を置いた。"}, {"t": 336.23333333333335, "x": "警視庁などからも応援が来た。"}, {"t": 338.18333333333334, "x": "いちばん多いときで、\n約1,400人の警察官が山荘を囲んだ。"}, {"t": 342.48333333333335, "x": "1,400人も？"}, {"t": 343.8333333333333, "x": "10日間を合わせると、のべ1万4,000人だ。"}, {"t": 346.68333333333334, "x": "これは翌年の警察白書の数字だ。"}, {"t": 349.1333333333333, "x": "警察が決めた基本の方針は二つだった。"}, {"t": 351.8833333333333, "x": "人質の安全を確かめて助け出すこと。"}, {"t": 354.6166666666667, "x": "そして5人を説得して捕まえること。"}, {"t": 357.2, "x": "撃ち合いで決着をつけるじゃないのね。"}, {"t": 359.45, "x": "最初からそうは決めていなかった。"}, {"t": 361.45, "x": "指揮をとったのは長野県警の本部長だ。"}, {"t": 364.0, "x": "ただ応援は関東のほかの県からも来ている。"}, {"t": 366.65, "x": "そこで警察庁からも職員が送られ、\n各県の調整をする参謀のような役をした。"}, {"t": 371.73333333333335, "x": "これは国会での説明だ。"}, {"t": 373.5833333333333, "x": "いくつもの県の警察が、一つの山荘を囲んだのね。"}, {"t": 377.21666666666664, "x": "のちに国会で、警察の担当者はこんな話もしている。"}, {"t": 380.78333333333336, "x": "幹部は胸に目立たない印を付けていた。"}, {"t": 383.28333333333336, "x": "何百人、何千人と動くとき、\n指揮官がだれか分からないと困る。"}, {"t": 387.55, "x": "警視庁の人は顔を知っていても、\n長野の人は知らないからだ。"}, {"t": 391.3666666666667, "x": "ところが幹部と分かれば撃つ側にも狙われる。"}, {"t": 394.1166666666667, "x": "目印が狙われる理由にもなるのね。"}, {"t": 396.46666666666664, "x": "その両方をどうするかがあとで宿題になった。"}, {"t": 399.78333333333336, "x": "包囲のあいだ警察は呼びかけを続けた。"}, {"t": 402.1666666666667, "x": "警察官だけではない。"}, {"t": 403.68333333333334, "x": "人質の家族も呼びかけた。"}, {"t": 405.56666666666666, "x": "立てこもった5人の母親たちも呼びかけた。"}, {"t": 408.3833333333333, "x": "母親も来たの？"}, {"t": 409.6666666666667, "x": "来た。"}, {"t": 410.8, "x": "警察庁の警備局長は、のちに国会でこう言っている。"}, {"t": 414.26666666666665, "x": "「あれは百五十回をこえる説得をやり、\n最後の最後まで説得した」。"}, {"t": 418.46666666666664, "x": "150回……。"}, {"t": 419.65, "x": "ところが返ってくるのは銃声だった。"}, {"t": 421.8333333333333, "x": "警察白書は、涙ながらに訴える母親に\n対しても発砲した、と書いている。"}, {"t": 426.96666666666664, "x": "母親にまで？"}, {"t": 428.1, "x": "国会の本会議でもある議員がそこに触れた。"}, {"t": 430.8, "x": "呼びかける母親に対して銃弾でこたえたと。"}, {"t": 433.5833333333333, "x": "説得に名乗り出た人はほかにもいた。"}, {"t": 435.95, "x": "ある大学の学長は、自分が山荘まで行こうとした。"}, {"t": 439.25, "x": "けれど、それはかえって危ないという\n意見もあった、と国会で紹介されている。"}, {"t": 443.8333333333333, "x": "だれが呼びかけても届かなかったのね。"}, {"t": 446.25, "x": "28日の当日に国会へ届いた報告では、\n10日間の発射は合計80発。"}, {"t": 451.6333333333333, "x": "その弾で5人がけがをしていた。"}, {"t": 453.6333333333333, "x": "説得の言葉は150回以上。"}, {"t": 455.81666666666666, "x": "返ってきたのは80発の弾。"}, {"t": 457.98333333333335, "x": "それが包囲の9日間の中身だった。"}, {"t": 461.03333333333336, "x": "ねえ5人は何を要求していたの？"}, {"t": 463.2, "x": "そこがこの事件のいちばん変わったところだ。"}, {"t": 465.75, "x": "何も要求しなかった。"}, {"t": 467.45, "x": "え？"}, {"t": 468.5833333333333, "x": "警察庁の担当者は国会でこう説明している。"}, {"t": 471.65, "x": "普通の人質事件ではまず相手に人質を見せる。"}, {"t": 474.78333333333336, "x": "自分は人質を持っているぞと示す。"}, {"t": 477.1, "x": "それを元に取り引きの条件を出してくる。"}, {"t": 479.7, "x": "お金とか逃げる車とかよね。"}, {"t": 481.76666666666665, "x": "そうだ。"}, {"t": 482.9, "x": "ところが今回は、何を申し入れても、\n何を説得しても、反応が無い。"}, {"t": 487.45, "x": "最後まで、人質がそこにいるという\n様子さえ見せなかった。"}, {"t": 491.1166666666667, "x": "じゃあ、人質が無事かどうかも分からないじゃない。"}, {"t": 494.01666666666665, "x": "そこが警察を一番苦しめた。"}, {"t": 496.1, "x": "担当者は5人の狙いをこう見ていた。"}, {"t": 498.3333333333333, "x": "人質を盾にして、警察の攻めを\n鈍らせることだけが目的だったのではないか。"}, {"t": 503.28333333333336, "x": "本会議でも、ある議員が「要求を一切せず、\n無言の威圧」と言っている。"}, {"t": 508.03333333333336, "x": "無言のまま時間だけが過ぎていくのね。"}, {"t": 510.48333333333335, "x": "外では、彼らを支持する別の団体がビラをまいていた。"}, {"t": 513.8166666666667, "x": "わずか5人で、1日千人以上の警察官を\n動かし、10日になる。"}, {"t": 518.1166666666667, "x": "それを自分たちの成功だと書いていた。"}, {"t": 520.55, "x": "囲まれていることを成功だと思っていたの？"}, {"t": 523.1833333333333, "x": "国会では、そういうビラがあったと報告されている。"}, {"t": 526.8166666666667, "x": "何も要求しない人質。"}, {"t": 528.5666666666667, "x": "これは法律の上でも困った問題になった。"}, {"t": 531.4, "x": "法律？"}, {"t": 532.5333333333333, "x": "当時の刑法には人質罪という罪は無かった。"}, {"t": 535.4666666666667, "x": "警察庁の後藤田正晴 長官は、\n事件の数日後に国会でこう説明している。"}, {"t": 540.75, "x": "人質は逮捕監禁罪などで裁くしかない。"}, {"t": 543.55, "x": "その罪の一番重い刑は5年だ。"}, {"t": 545.7166666666667, "x": "ところが、物を盗んだ窃盗罪の一番重い刑は10年。"}, {"t": 549.4, "x": "人を閉じ込めるより物を盗む方が重いの？"}, {"t": 552.2, "x": "長官も「均衡を失しておる」と言った。"}, {"t": 554.8166666666667, "x": "実は、刑法を作り直す話し合いの中に、\n新しい罪の案はあった。"}, {"t": 559.1833333333333, "x": "人質による強要罪という案だ。"}, {"t": 561.3, "x": "ただその案には条件が付いていた。"}, {"t": 563.4166666666666, "x": "人質を取って、だれかに何かを\n「要求した」場合、という条件だ。"}, {"t": 568.0166666666667, "x": "あ……今回は要求してない。"}, {"t": 569.9, "x": "そうだ。"}, {"t": 571.0166666666667, "x": "長官は、要求をしない新しい型の事件は、\nこの案では「まかない切れない」と言った。"}, {"t": 576.3666666666667, "x": "法務省の刑事局長も、理屈の上では\n間に合わないと認めた。"}, {"t": 580.2333333333333, "x": "そして、要求の無い場合も\n含めて検討する、と答えている。"}, {"t": 584.0833333333334, "x": "法務大臣は別の見方をした。"}, {"t": 586.1, "x": "この事件はほかの重い罪を\n伴っていて、そちらで重く裁ける。"}, {"t": 590.05, "x": "人質罪を作るなら、人質を放したら\n刑を軽くする、という形になるだろう。"}, {"t": 595.1166666666667, "x": "ただそれがどれだけ効くかは分からないと。"}, {"t": 597.5666666666667, "x": "同じ事件でも見ている所が違うのね。"}, {"t": 600.15, "x": "法律の議論はこのあとも長く続くことになる。"}, {"t": 603.6833333333333, "x": "そもそも5人はどこで銃を手に入れたの？"}, {"t": 606.1166666666667, "x": "国会で警察庁の参事官が、その流れを説明している。"}, {"t": 609.9, "x": "始まりは事件のちょうど1年前だ。"}, {"t": 612.1333333333333, "x": "1971年2月17日、栃木県真岡市の銃砲店が襲われた。"}, {"t": 617.2333333333333, "x": "奪われたのは猟銃11丁と弾2,380発。"}, {"t": 620.95, "x": "11丁も？"}, {"t": 622.0833333333334, "x": "そのうち2丁はまもなく捜査で取り戻した。"}, {"t": 624.7333333333333, "x": "1丁は、その年に鳥取県米子市で\n起きた銀行強盗で使われていた。"}, {"t": 629.25, "x": "もう1丁は広島県福山市で見つかった。"}, {"t": 632.0166666666667, "x": "残りは7丁だった。"}, {"t": 633.45, "x": "警察はその行方をずっと追っていた。"}, {"t": 635.7333333333333, "x": "見つからなかったのね。"}, {"t": 637.2833333333333, "x": "見つける前に山荘の事件が起きた。"}, {"t": 639.5833333333334, "x": "参事官によると、残りの7丁は\nこの事件の流れの中で出てきた。"}, {"t": 643.8166666666667, "x": "それで全部を取り戻した形になったという。"}, {"t": 646.5833333333334, "x": "1年かけて追っていた銃が、山荘で出てきたのね。"}, {"t": 649.8833333333333, "x": "別の議員はライフル銃の数を問題にした。"}, {"t": 652.5333333333333, "x": "通産省に聞いた数字では、1970年に国内で\n売られたライフル銃は約5,000丁あった。"}, {"t": 658.4166666666666, "x": "国内で作った物が330丁で、\n外国から入れた物が4,800丁だ。"}, {"t": 663.6333333333333, "x": "これほどのライフル銃が国内に出回る\n理由があるのか、と議員は問うた。"}, {"t": 667.7333333333333, "x": "銃が手に渡ったところに、殉職者を出した\n大きな原因がある、という考えだった。"}, {"t": 673.35, "x": "でも1,400人もいたのよね。"}, {"t": 675.3166666666667, "x": "なぜ近づけなかったの？"}, {"t": 676.95, "x": "警察庁の警備局長は理由を二つ挙げている。"}, {"t": 679.8833333333333, "x": "一つ目は人質だ。"}, {"t": 681.3666666666667, "x": "犯人が顔を出したら撃てばいい、という\n意見も耳にしていた。"}, {"t": 684.8, "x": "けれど犯人が複数で人質が一人。"}, {"t": 687.3333333333334, "x": "そういうときは、どうしても\n慎重にならざるを得ない、と。"}, {"t": 690.6666666666666, "x": "一人を撃っても、ほかの4人が人質の\nそばにいるかもしれないものね。"}, {"t": 694.8833333333333, "x": "二つ目が地形だ。"}, {"t": 696.1666666666666, "x": "局長はここでテレビの話をしている。"}, {"t": 698.4833333333333, "x": "テレビの望遠のカメラで撮ると、\n地形がすっかり省かれる。"}, {"t": 701.9, "x": "目の前にぱっとあの家が出てくる。"}, {"t": 703.95, "x": "画面だとすぐそこにあるように見えるわね。"}, {"t": 706.4166666666666, "x": "ところが本当は、身を隠す所が\nほとんど無い斜面だった。"}, {"t": 710.0666666666667, "x": "南軽井沢のいわば一番上に建っている。"}, {"t": 712.6166666666667, "x": "中から見れば、近づく者は手に取るように見える。"}, {"t": 715.5833333333334, "x": "そのうえ屋根裏にこもって上から撃ってくる。"}, {"t": 718.0166666666667, "x": "いろいろな器材を使っても、短い\n時間では押さえられなかった、という。"}, {"t": 722.2833333333333, "x": "画面で見るのと坂の上に立つのとは別なのね。"}, {"t": 725.25, "x": "テレビを見ていた人には近くに見えた。"}, {"t": 727.5333333333333, "x": "現場の警察官には遠い坂だった。"}, {"t": 729.9, "x": "その差が10日間の長さの一つだった。"}, {"t": 732.4333333333333, "x": "3月の法務委員会では、ある議員がこう話している。"}, {"t": 735.6666666666666, "x": "山荘の様子をテレビで見ていた。"}, {"t": 737.6166666666667, "x": "武器を持った集団がすることの\nすさまじさを、身にしみて感じた、と。"}, {"t": 741.85, "x": "画面の向こうからでも、怖さは伝わっていたのね。"}, {"t": 744.9666666666667, "x": "伝わっていた。"}, {"t": 745.9833333333333, "x": "ただ、画面に映らない\n坂の長さまでは、伝わらなかった。"}, {"t": 750.3, "x": "ではなぜ10日目だったのか。"}, {"t": 751.9833333333333, "x": "事件の翌日、警察庁の官房長は国会でこう報告した。"}, {"t": 756.05, "x": "銃を撃つ以外には5人の反応は少なかった。"}, {"t": 758.8166666666667, "x": "人質の無事を十分に\n確かめられないまま、10日間が過ぎた。"}, {"t": 762.7, "x": "人質は心も体もとても心配な状態に来ている。"}, {"t": 766.2666666666667, "x": "生きているかどうかも分からなかったのね。"}, {"t": 768.65, "x": "そこで警察は決めた。"}, {"t": 770.1833333333333, "x": "人質を助けるには保養所の中に入るしかない。"}, {"t": 773.2333333333333, "x": "犯人の抵抗を、思い切った手段で取り除くしかない。"}, {"t": 776.5666666666667, "x": "実行は2月28日の午前10時から。"}, {"t": 779.4833333333333, "x": "待つ方針から入る方針に変えたのね。"}, {"t": 782.0333333333333, "x": "そうだ。"}, {"t": 783.1666666666666, "x": "ただ壊す建物は会社の保養所だった。"}, {"t": 785.7166666666667, "x": "国会では、建物を持つ楽器の会社が、人質を\n助けるために取り壊しを許した、と紹介されている。"}, {"t": 792.3166666666667, "x": "持ち主が壊していいと言ったのね。"}, {"t": 794.4833333333333, "x": "のちに国会では、山荘は\n廃墟のようになったとも言われた。"}, {"t": 798.0166666666667, "x": "壊したあとの片付けは、国会の言葉では\n「村長さんの好意」でできた。"}, {"t": 802.6166666666667, "x": "国の賠償の責任は無いという説明だった。"}, {"t": 805.4166666666666, "x": "議員は、もしこれが普通の人の家だったら\nどうするのか、と問いかけている。"}, {"t": 809.9, "x": "自分の家が舞台になったらってことね。"}, {"t": 812.3666666666667, "x": "そういう問いもこの日から生まれた。"}, {"t": 814.9333333333333, "x": "2月28日。"}, {"t": 816.3166666666667, "x": "この日動いた警察官は約1,000人。"}, {"t": 818.6, "x": "地元の長野県警のほか、警視庁と\n神奈川県警の応援も入った。"}, {"t": 822.9333333333333, "x": "午前9時部隊が持ち場に着いた。"}, {"t": 824.9166666666666, "x": "同時に警告が始まった。"}, {"t": 826.7, "x": "午前9時55分からは、最後の警告を繰り返した。"}, {"t": 830.2833333333333, "x": "返事は？"}, {"t": 831.4, "x": "何の返事も無かった。"}, {"t": 832.8833333333333, "x": "かえって銃を乱射してきた。"}, {"t": 834.6333333333333, "x": "報告の言葉では、「抵抗の姿勢を変えなかった」。"}, {"t": 837.7333333333333, "x": "最後の最後まで言葉は返ってこなかったのね。"}, {"t": 840.6666666666666, "x": "作戦の中身も国会で説明されている。"}, {"t": 843.3333333333334, "x": "まず放水などで壁の銃を撃つ穴を押さえる。"}, {"t": 845.8666666666667, "x": "そのあいだに階段や銃眼を壊す。"}, {"t": 848.05, "x": "中へ入り人質を助け5人を捕まえる。"}, {"t": 850.7166666666667, "x": "これが、国家公安委員長の中村寅太が\n当日の国会で読み上げた手順だ。"}, {"t": 855.5833333333334, "x": "壊すのが先なのね。"}, {"t": 857.1666666666666, "x": "そうだ。"}, {"t": 858.3, "x": "銃を構えた相手に、正面の扉から入ることはできない。"}, {"t": 861.8, "x": "だから壁の方を開けることにした。"}, {"t": 863.9666666666667, "x": "そのために呼ばれたのがクレーン車だった。"}, {"t": 866.8833333333333, "x": "午前10時47分。"}, {"t": 868.4833333333333, "x": "クレーン車による作業が始まった。"}, {"t": 870.6166666666667, "x": "これが鉄のたま？"}, {"t": 871.9333333333333, "x": "報告の正式な言い方は、ただ\n「クレーン車による作業」だ。"}, {"t": 875.7166666666667, "x": "のちの国会で、議員が「大きなたまを\nぶち当てて壁を破った車」と言い、"}, {"t": 880.1, "x": "人事院総裁が「鉄のたま」と言った。"}, {"t": 882.9166666666666, "x": "報道では鉄球と呼ばれている。"}, {"t": 884.7833333333333, "x": "最初に壊したのは、3階から2階へ下りる階段だ。"}, {"t": 888.2333333333333, "x": "階段を？"}, {"t": 889.3666666666667, "x": "ふさいだんだ。"}, {"t": 890.5, "x": "上の階と下の階を行き来できないようにした。"}, {"t": 893.1833333333333, "x": "次に、同じ階のトイレの窓と、管理人室の壁を壊した。"}, {"t": 897.1333333333333, "x": "そして11時40分。"}, {"t": 898.8166666666667, "x": "開いた3階の管理人室へ警察官が入った。"}, {"t": 901.95, "x": "同時に1階と2階にも窓を破って入った。"}, {"t": 904.8166666666667, "x": "上と下からいっしょに入ったのね。"}, {"t": 906.9333333333333, "x": "これが作戦の始まりだった。"}, {"t": 908.8333333333334, "x": "5月の委員会で、ある議員は\nこの車について注文をつけている。"}, {"t": 912.75, "x": "ああいう物はもう少し研究されて、\nもっと賢い方法は無かったのか。"}, {"t": 916.9666666666667, "x": "知恵のある人が警察にいるのに、\n何かもう少し手は無かったか、と。"}, {"t": 921.25, "x": "壁を壊すやり方そのものも問われたのね。"}, {"t": 923.95, "x": "そうだ。"}, {"t": 925.0833333333334, "x": "鉄のたまは、あとで褒められた\n道具というより、問いを残した道具だった。"}, {"t": 929.25, "x": "壁を壊すことで、正面の扉を\n通らずに中へ入る道を作った。"}, {"t": 933.4166666666666, "x": "ただ5人はまだ3階の奥にいた。"}, {"t": 935.5, "x": "そして入ろうとする警察官を待ち構えていた。"}, {"t": 938.4833333333333, "x": "ここからが一番危ないところね。"}, {"t": 940.6333333333333, "x": "そうだ。"}, {"t": 941.7666666666667, "x": "この少し前から、玄関の近くで\n撃ち合いが始まっていた。"}, {"t": 946.0166666666667, "x": "午前11時33分から55分ごろまで。"}, {"t": 949.0333333333333, "x": "玄関の近くで、警察官4人が撃たれてけがをした。"}, {"t": 952.4666666666667, "x": "そのうち2人がまもなく亡くなった。"}, {"t": 954.7666666666667, "x": "……2人。"}, {"t": 955.9, "x": "警視庁第二機動隊の隊長内田尚孝さん。"}, {"t": 958.7666666666667, "x": "警視庁特科車両隊の高見繁光さんだ。"}, {"t": 961.5666666666667, "x": "報告では、5人は中へ入ろうとする\n警察官の頭を狙って撃った、とされている。"}, {"t": 966.75, "x": "狙って……。"}, {"t": 967.8833333333333, "x": "この回ではそれ以上のことは話さない。"}, {"t": 970.1666666666666, "x": "午後0時50分にはもう一人撃たれた。"}, {"t": 972.5666666666667, "x": "正面の玄関から約100メートル離れた山の上で、\n取材していた放送局のカメラマンだ。"}, {"t": 978.1833333333333, "x": "100メートルも離れた所で？"}, {"t": 980.1833333333333, "x": "そうだ。"}, {"t": 981.3166666666667, "x": "坂の上の建物からは、それだけ遠くまで見えていた。"}, {"t": 984.6333333333333, "x": "のちに国会である議員はこう言った。"}, {"t": 986.7, "x": "階級章を見られて、幹部が狙い撃ちにされることのない\n守り方を考えるべきだ、と。"}, {"t": 991.7666666666667, "x": "別の答弁では、目印を目立たない\n物にしていたことも説明された。"}, {"t": 996.05, "x": "それでも2人が亡くなった。"}, {"t": 997.8666666666667, "x": "国会の人たちは、その日のことをどうやって知ったの？"}, {"t": 1001.2666666666667, "x": "実はこの日国会は開いていた。"}, {"t": 1003.3666666666667, "x": "そこへ、山荘からの知らせが届き続けていたんだ。"}, {"t": 1007.2, "x": "2月28日、衆議院では予算委員会が開かれていた。"}, {"t": 1011.0, "x": "総理大臣も大臣たちも出席する、大きな委員会だ。"}, {"t": 1014.55, "x": "この日質問に立った議員の一人は、\n本題の前にこう言った。"}, {"t": 1018.3166666666667, "x": "いまテレビ報道を通じて、全国に\n放送されている山荘の事件について。"}, {"t": 1022.7666666666667, "x": "すでに2名の殉職者が出たという情報がある、と。"}, {"t": 1025.95, "x": "委員会の途中でもう知らせが入っていたのね。"}, {"t": 1028.7, "x": "別の議員も本題に入る前に山荘の話をした。"}, {"t": 1031.9333333333334, "x": "すでに殉職が認められ、\nカメラマンまでけがをしている。"}, {"t": 1035.25, "x": "何といっても人命が一番大事だから、これ\n以上の犠牲を防ぎながら解決してほしい、と。"}, {"t": 1040.7833333333333, "x": "国会の中からもお願いをしていたのね。"}, {"t": 1043.3166666666666, "x": "午後になって委員長代理がこう告げた。"}, {"t": 1045.55, "x": "国家公安委員長から、山荘の事件について\n中間報告をしたいと申し出がある、と。"}, {"t": 1050.7833333333333, "x": "中村寅太 委員長が立って、\nそれまでの経過を読み上げた。"}, {"t": 1054.5666666666666, "x": "途中でこんなことを言っている。"}, {"t": 1056.2833333333333, "x": "これは、自分が午後4時に警察庁を\n出てきたときの報告です。"}, {"t": 1060.2333333333333, "x": "警察庁から国会へ移るあいだにも、\n状況が変わっていたのね。"}, {"t": 1064.2666666666667, "x": "そうだ。"}, {"t": 1065.3833333333334, "x": "委員長は2人目の警察官についてこう続けた。"}, {"t": 1068.3833333333334, "x": "出てくるまでは重体だったが、こちらに\n着いたときに亡くなったと連絡を受けた。"}, {"t": 1073.0666666666666, "x": "移動しているあいだに……。"}, {"t": 1074.4666666666667, "x": "報告の最後はこうだった。"}, {"t": 1076.1333333333334, "x": "ベッドルームに、男が3人、\n女が1人いることを確かめた。"}, {"t": 1080.0333333333333, "x": "ただ、その女性が人質の人か\nどうかは、まだ分からない。"}, {"t": 1083.6833333333334, "x": "今日のうちに解決したいという\n気持ちで続けている、と。"}, {"t": 1087.05, "x": "まだ、人質が無事かどうか\n分からないまま報告していたのね。"}, {"t": 1090.9, "x": "委員会ではそのまま質問が続いた。"}, {"t": 1093.2166666666667, "x": "そのころ山荘では、警察が\n建物の大部分を押さえていた。"}, {"t": 1097.55, "x": "午後1時過ぎ。"}, {"t": 1098.5833333333333, "x": "警察は1階と2階を全部押さえた。"}, {"t": 1100.9333333333334, "x": "3階でも管理人室と厨房を押さえた。"}, {"t": 1103.5833333333333, "x": "厨房って台所よね。"}, {"t": 1105.3, "x": "そうだ。"}, {"t": 1106.4333333333334, "x": "残ったのは、3階の屋根裏、\n談話室、ベッドルームの三つ。"}, {"t": 1110.4, "x": "5人はそこにこもって撃ち続けていた。"}, {"t": 1112.7333333333333, "x": "午後2時50分。"}, {"t": 1113.9166666666667, "x": "談話室から厨房の中へ爆発物が投げ込まれた。"}, {"t": 1117.3166666666666, "x": "爆発物？"}, {"t": 1118.4333333333334, "x": "厨房には警察官がいた。"}, {"t": 1120.2333333333333, "x": "ところがその爆発物は、窓側に\n取り付けてあった棚の上に載った。"}, {"t": 1124.4833333333333, "x": "そして壁の側で爆発した。"}, {"t": 1126.45, "x": "壁は吹き飛んだが、警察官3人のけがは軽くて済んだ。"}, {"t": 1130.2333333333333, "x": "棚に載ったから助かったのね。"}, {"t": 1132.3333333333333, "x": "報告ではわざわざ「幸い」と書いてある。"}, {"t": 1134.95, "x": "棚一つの位置で結果が変わった。"}, {"t": 1137.1, "x": "このあと爆発物は1個押収されている。"}, {"t": 1139.6166666666666, "x": "5人はまだ別の物も持っていたということだ。"}, {"t": 1142.4333333333334, "x": "中にいるのは銃だけじゃなかったのね。"}, {"t": 1144.7166666666667, "x": "残る3つの部屋をどう攻めるか。"}, {"t": 1146.65, "x": "ここで使われたのが水とガスだった。"}, {"t": 1149.5333333333333, "x": "午後3時30分。"}, {"t": 1150.9, "x": "警察はガス筒と放水を使い始めた。"}, {"t": 1153.4666666666667, "x": "まず天井裏と談話室にいる者を押さえる。"}, {"t": 1156.1, "x": "ガス筒って？"}, {"t": 1157.2333333333333, "x": "涙や咳が出るガスを出す筒だ。"}, {"t": 1159.3833333333334, "x": "国会では、報道で千発くらい撃ち込んだという\n話も出ていた、と議員が言っている。"}, {"t": 1164.3333333333333, "x": "ただこれは議員が伝えた報道の数字だ。"}, {"t": 1166.7666666666667, "x": "午後4時10分。"}, {"t": 1167.8666666666666, "x": "山荘の北側で、跳ね返った\n弾で警察官2人がけがをした。"}, {"t": 1171.95, "x": "午後4時30分ごろ。"}, {"t": 1173.4666666666667, "x": "5人が3階のベッドルームに集まった。"}, {"t": 1175.9833333333333, "x": "最後の部屋に集まったのね。"}, {"t": 1177.8833333333334, "x": "警察は、ガスと放水で押さえながら、\nベッドルームと談話室の間の壁を壊した。"}, {"t": 1182.9333333333334, "x": "同時に、ベッドルームの扉の前のバリケードを\n取り除いた。"}, {"t": 1186.35, "x": "午後5時18分、バリケードを除いていた\n警察官1人が、両目に異物が入ってけがをした。"}, {"t": 1192.0333333333333, "x": "午後6時2分、同じ場所で、\nもう1人が拳銃で撃たれた。"}, {"t": 1195.8, "x": "最後の扉の前が一番危なかったのね。"}, {"t": 1198.5333333333333, "x": "建物の中は真っ暗だった。"}, {"t": 1200.4333333333334, "x": "電気は切られ雨戸がしっかり閉じられていた。"}, {"t": 1202.95, "x": "警察は、中に入ってからは絶対に\n拳銃を使うな、と指示していた。"}, {"t": 1207.5333333333333, "x": "撃たれているのに？"}, {"t": 1208.7, "x": "暗闇の中では、人質と\n見分けがつかないかもしれない。"}, {"t": 1212.2, "x": "人質に男物の上着を着せて盾にされるおそれも\n考えていた、と担当者は国会で話している。"}, {"t": 1218.7833333333333, "x": "午後6時9分。"}, {"t": 1219.95, "x": "壊した壁と、扉の両方から、\n警察官がベッドルームへ入った。"}, {"t": 1224.1833333333334, "x": "中の5人は、ベッドにもぐりながら、なお撃ってきた。"}, {"t": 1227.4, "x": "6時13分警察官3人が散弾でけがをした。"}, {"t": 1230.8833333333334, "x": "最後の最後まで……。"}, {"t": 1232.2166666666667, "x": "そして6時14分。"}, {"t": 1233.7, "x": "人質の女性が助け出された。"}, {"t": 1235.9, "x": "……助かったのね。"}, {"t": 1237.1166666666666, "x": "助かった。"}, {"t": 1238.25, "x": "ちなみに、別の日の報告では、\nこの時刻は6時15分になっている。"}, {"t": 1242.6, "x": "1分の違いだが、報告ごとに数字が少しずつずれる。"}, {"t": 1246.0833333333333, "x": "これはこのあとの数字にも出てくる。"}, {"t": 1248.0833333333333, "x": "5人は順に全員が逮捕された。"}, {"t": 1250.1833333333334, "x": "押収されたのは、ライフル銃1丁、\n拳銃1丁、猟銃4丁、爆発物1個。"}, {"t": 1255.55, "x": "10日間、それだけの物が山荘の中にあったのね。"}, {"t": 1258.8833333333334, "x": "同じころ国会の予算委員会。"}, {"t": 1260.8666666666666, "x": "委員長が公安委員長に代わって報告した。"}, {"t": 1263.5666666666666, "x": "山荘の事件は落着したようです。"}, {"t": 1265.85, "x": "午後6時過ぎに犯人5名を全員逮捕しました。"}, {"t": 1268.8833333333334, "x": "人質の人は少しけがをしているが、\n救い出して心配はない、という報告です。"}, {"t": 1273.8833333333334, "x": "会議録にはここに「拍手」と書かれている。"}, {"t": 1276.8666666666666, "x": "委員会の部屋で拍手が起きたのね。"}, {"t": 1279.1666666666667, "x": "委員会は午後6時35分に散会した。"}, {"t": 1282.5, "x": "助け出された女性は軽井沢の病院に入院した。"}, {"t": 1285.5833333333333, "x": "医師の診断はこうだった。"}, {"t": 1287.15, "x": "疲れはひどいが心も体も異常は無い。"}, {"t": 1289.6333333333334, "x": "休めば回復する。"}, {"t": 1291.15, "x": "よかった……。"}, {"t": 1292.2833333333333, "x": "女性の話も翌日の国会で紹介されている。"}, {"t": 1295.3333333333333, "x": "10日間一度もお風呂に入れなかった。"}, {"t": 1297.5, "x": "両手と両足をロープで縛られて、\n3階のベッドルームに閉じ込められていた。"}, {"t": 1301.8333333333333, "x": "26日からは、食事もまったく与えられなかった。"}, {"t": 1305.2833333333333, "x": "助け出される28日まで、何も食べていなかったのね。"}, {"t": 1309.0666666666666, "x": "それからこんな話もあった。"}, {"t": 1310.8666666666666, "x": "犯人は5人だった。"}, {"t": 1312.2666666666667, "x": "5人はお互いを、「富士山」「立山」のような\n山の名前で呼び合っていた。"}, {"t": 1316.7333333333333, "x": "本当の名前じゃなくて？"}, {"t": 1318.3833333333334, "x": "そうだ。"}, {"t": 1319.5166666666667, "x": "人質の前では自分たちの名前を出さなかった。"}, {"t": 1322.45, "x": "この回でも5人の名前を出さない。"}, {"t": 1324.5166666666667, "x": "残すのは、山の名前で\n呼び合っていたという事実だけにしておく。"}, {"t": 1328.4666666666667, "x": "外にいた人は、中の様子を\n10日間まったく知らなかったのね。"}, {"t": 1332.5, "x": "そうだ。"}, {"t": 1333.6333333333334, "x": "外で150回呼びかけていたあいだ、\n中ではそういう10日間が過ぎていた。"}, {"t": 1338.7666666666667, "x": "さっき時刻が1分ずれていると言った。"}, {"t": 1341.0666666666666, "x": "けがをした人の数はもっと大きくずれている。"}, {"t": 1343.7666666666667, "x": "どのくらい？"}, {"t": 1344.9, "x": "事件の翌日衆議院での報告。"}, {"t": 1347.1333333333334, "x": "警察官12人とカメラマン1人で13人。"}, {"t": 1350.1, "x": "4日後参議院での報告。"}, {"t": 1351.8666666666666, "x": "警察官16人とカメラマン1人。"}, {"t": 1354.2833333333333, "x": "5月の委員会での答弁では、殉職者を除いて23人。"}, {"t": 1358.0833333333333, "x": "翌年の警察白書では、重いけがと\n軽いけがを合わせて26人。"}, {"t": 1362.3833333333334, "x": "それに一般の人のけがが1人。"}, {"t": 1364.6166666666666, "x": "13人から26人まで倍も違うじゃない。"}, {"t": 1367.55, "x": "あとから分かったけがを足したのか。"}, {"t": 1369.5833333333333, "x": "28日の一日だけか10日間全部か。"}, {"t": 1372.4333333333334, "x": "数え方の範囲が違うのかもしれない。"}, {"t": 1374.7333333333333, "x": "ただ、どれが正しいかは、記録からは決められない。"}, {"t": 1377.7833333333333, "x": "だからこの回では全部並べておく。"}, {"t": 1380.0333333333333, "x": "攻防の長さも記録によって違うの？"}, {"t": 1382.5, "x": "28日の攻防については、ある議員が\n「八時間余」と言った。"}, {"t": 1386.8833333333334, "x": "10日間全体は、別の議員が「二百十八時間十五分と\n記されておりました」と読み上げている。"}, {"t": 1393.0166666666667, "x": "本会議でも「恐怖の二百十八時間」という\n言葉が出た。"}, {"t": 1396.8666666666666, "x": "10日間を時間で数えた人もいたのね。"}, {"t": 1399.4666666666667, "x": "そうだ。"}, {"t": 1400.6, "x": "そしてどの記録でも揃っている数字がある。"}, {"t": 1403.1166666666666, "x": "亡くなった警察官は2人だ。"}, {"t": 1405.7333333333333, "x": "この事件で亡くなったのは、\n警察官の2人だけではない。"}, {"t": 1409.35, "x": "ほかにも？"}, {"t": 1410.4833333333333, "x": "警察白書は注の中にこう書いている。"}, {"t": 1412.95, "x": "あさま山荘事件で、人質の身代わりを\n申し出た一般の人がいた。"}, {"t": 1417.1666666666667, "x": "その人が撃たれて亡くなった。"}, {"t": 1419.1333333333334, "x": "人質と代わろうとしたの？"}, {"t": 1420.9833333333333, "x": "白書の言葉では「人質の身代りを志願し」だ。"}, {"t": 1424.2666666666667, "x": "この回ではその人の名前を出さない。"}, {"t": 1426.4833333333333, "x": "国会の本会議ではある議員がこう言った。"}, {"t": 1428.9166666666667, "x": "2人の警察官と民間の1人。"}, {"t": 1431.2166666666667, "x": "3人の惜しんでも余りある命が失われたと。"}, {"t": 1434.0333333333333, "x": "佐藤栄作 首相も答えている。"}, {"t": 1436.2833333333333, "x": "殉職した2人の警官と1人の市民。"}, {"t": 1438.8833333333334, "x": "残された家族のこれからの暮らしが、\n少しでも明るくなるように助けていく、と。"}, {"t": 1443.8833333333334, "x": "佐藤栄作 首相も「一市民」と言ったのね。"}, {"t": 1447.1666666666667, "x": "言った。"}, {"t": 1448.3, "x": "けがをした人たちについても、長い期間にわたる\nその後の手当てまで、万全を期すと述べている。"}, {"t": 1453.9166666666667, "x": "この年の警察白書の数字ではこうなる。"}, {"t": 1456.5, "x": "警察官の殉職2人重軽傷26人。"}, {"t": 1459.45, "x": "一般の人の死亡1人けが1人。"}, {"t": 1461.8333333333333, "x": "白書はそのうえで、銃や爆発物への備えを\n充実させる必要を強く感じさせた、と結んでいる。"}, {"t": 1468.05, "x": "一人を助けるために3人が亡くなったのね。"}, {"t": 1470.95, "x": "その重さが、このあと国会の議論の中心になっていく。"}, {"t": 1475.0333333333333, "x": "山荘の事件が終わった直後、国家公安委員長は\n全国の警察に指示を出していた。"}, {"t": 1480.3166666666666, "x": "どんな指示？"}, {"t": 1481.4333333333334, "x": "この事件は、国民に大きなショックを与えている。"}, {"t": 1484.3833333333334, "x": "これに刺激された別の勢力が、\n暴力をふるうおそれがある。"}, {"t": 1487.95, "x": "思いがけない事態が起きないよう、\n急いで手配して用心せよ、という指示だ。"}, {"t": 1492.5, "x": "事件のあとに、別の騒ぎが\n起きるかもしれないってことね。"}, {"t": 1496.0666666666666, "x": "ところが2日後の3月1日、\n東京駅の近くで事件が起きた。"}, {"t": 1500.2833333333333, "x": "春の賃上げを求めるデモの列に、\n右翼団体の宣伝カーが突っ込んだ。"}, {"t": 1504.5666666666666, "x": "デモに加わっていた人が重いけがをした。"}, {"t": 1507.1666666666667, "x": "山荘の事件とつながりがあったの？"}, {"t": 1509.4166666666667, "x": "警察庁の参事官は国会でこう説明している。"}, {"t": 1512.5166666666667, "x": "その宣伝カーは、山荘の事件について\n自分たちの立場から宣伝をするために出発した。"}, {"t": 1518.0666666666666, "x": "警察はそれを知っていて、\n係員3人があとを追っていた。"}, {"t": 1521.5166666666667, "x": "ところが東京駅の南口あたりで道が\n混み、車について行けなくなった。"}, {"t": 1526.05, "x": "その先で、デモの列と同じ場所を\n通ることになった、という。"}, {"t": 1529.8666666666666, "x": "見張っていたのに見失ったのね。"}, {"t": 1531.9666666666667, "x": "委員長はまことに遺憾だと述べた。"}, {"t": 1534.0333333333333, "x": "そして改めて全国の警察に注意を指示した。"}, {"t": 1537.1, "x": "山荘の10日間が終わっても、\nその影響はすぐには収まらなかった。"}, {"t": 1541.8, "x": "事件の翌日、衆議院の地方行政委員会は、\nまず全員が起立して2人に黙祷をささげた。"}, {"t": 1547.7333333333333, "x": "その後も国会では残された家族の話が続いた。"}, {"t": 1550.9666666666667, "x": "3月2日の委員会では、ある議員が\n新聞の記事を紹介している。"}, {"t": 1555.0166666666667, "x": "関西の財界から\n1,000万円の見舞いを出したいという話がある、と。"}, {"t": 1559.1166666666666, "x": "お子さんも小さいので、できる限り\n面倒を見てほしい、と議員は求めた。"}, {"t": 1563.3166666666666, "x": "同じ日の別の委員会で、国家公安委員長は、今ある\n決まりの中で一番手厚い扱いをしたいと答えた。"}, {"t": 1569.7666666666667, "x": "3月9日の委員会で、\n警察庁の官房長が金額を答えている。"}, {"t": 1574.2, "x": "殉職した2人への一時金は、\n内田尚孝さんが約2,048万円。"}, {"t": 1578.9333333333334, "x": "高見繁光さんが約2,041万円。"}, {"t": 1581.8, "x": "ほとんど同じ金額なのね。"}, {"t": 1583.7, "x": "総理大臣から出る特別の褒賞金は、\n最高で500万円と決まっていた。"}, {"t": 1588.3666666666666, "x": "これも階級ではなく、手柄の大きさで\n額を決める、という説明だった。"}, {"t": 1592.65, "x": "5月には人事院の担当者が、2人とも年金を\n受け取る対象になると答えている。"}, {"t": 1597.6833333333334, "x": "議員は、階級で差があるのではないかと聞いていた。"}, {"t": 1600.5833333333333, "x": "答えは、補償の計算は給料が\n元になるので差が出ることはある。"}, {"t": 1604.45, "x": "けれど一時金については、階級で\n差をつけていない、というものだった。"}, {"t": 1608.6833333333334, "x": "法律の方は何か変わったの？"}, {"t": 1610.7666666666667, "x": "変わった。"}, {"t": 1611.9, "x": "命に関わる危険な仕事で亡くなった\n公務員への補償を、さらに厚くする改正だ。"}, {"t": 1616.95, "x": "それまで、普通の補償の100分の125だった\n上乗せを、100分の150にする。"}, {"t": 1622.3, "x": "その改正は事件のあとに決まったの？"}, {"t": 1624.7, "x": "そこが国会で問われた。"}, {"t": 1626.25, "x": "改正の適用は、その年の1月1日まで\nさかのぼることになっていた。"}, {"t": 1630.7833333333333, "x": "ある議員はこう言った。"}, {"t": 1632.05, "x": "山荘の2人を救うだけなら、3月からでもいいはずだ。"}, {"t": 1635.55, "x": "前の年に別の事件で亡くなった\n警察官3人は、この線の外になる、と。"}, {"t": 1640.5833333333333, "x": "線をどこに引くかで救われる人が変わるのね。"}, {"t": 1643.4666666666667, "x": "人事院総裁の佐藤達夫はこう答えた。"}, {"t": 1646.0333333333333, "x": "意見書を出したのは3月16日で、\n事件の直後に当たる。"}, {"t": 1649.85, "x": "ただ、事件から急に思い立ったのでは間に合わない。"}, {"t": 1652.9, "x": "もっと前から研究会を作って調べていたと。"}, {"t": 1655.7333333333333, "x": "鉄のたまの話をしたのもこの人事院総裁だ。"}, {"t": 1658.75, "x": "危ない職務で、あんな鉄の\nたまでは入れないと断れるか。"}, {"t": 1662.1666666666667, "x": "断れずに身を挺して入る仕事だから、\n補償を厚くする、という説明だった。"}, {"t": 1667.55, "x": "3月9日の委員会では警察の備えも問われた。"}, {"t": 1670.8333333333333, "x": "ある議員はこの戦いを「城攻め」と呼んだ。"}, {"t": 1673.7333333333333, "x": "城攻め？"}, {"t": 1674.8666666666666, "x": "建物にこもった相手を外から攻める、という意味だ。"}, {"t": 1677.9833333333333, "x": "議員はまず、地方の機動隊の訓練の少なさを挙げた。"}, {"t": 1681.35, "x": "全国の機動隊は6,000人弱という見立てだった。"}, {"t": 1684.4833333333333, "x": "しかも専従でない機動隊もあって、\n訓練は月に2回ほどだ、と。"}, {"t": 1688.7333333333333, "x": "いつも訓練している人ばかりではなかったのね。"}, {"t": 1691.6166666666666, "x": "次に装備の話をした。"}, {"t": 1693.2833333333333, "x": "部隊として持つ装備と、\n一人一人が身に着ける装備だ。"}, {"t": 1696.85, "x": "ライフル銃の弾からどう身を守るか。"}, {"t": 1699.0333333333333, "x": "人質をできるだけ傷つけずに\n助ける、新しい道具は無いか。"}, {"t": 1702.9166666666667, "x": "催涙ガスも、もっと体に害の少ない\n物は無いのか、と問うた。"}, {"t": 1707.1333333333334, "x": "同じ日の失敗を、次に繰り返さないための質問ね。"}, {"t": 1710.7, "x": "中村寅太 委員長はこう答えた。"}, {"t": 1713.1, "x": "警察はなるべく少ない人数で動くのが基本だ。"}, {"t": 1716.1333333333334, "x": "そのかわり、役に立つ器材を\n使って国民の期待にこたえる。"}, {"t": 1719.8833333333334, "x": "ただ実情を見ると、警備の体制を\n急いで強めなければならない、と。"}, {"t": 1723.9833333333333, "x": "警察庁の警備局長も、3月3日に\n同じことを言っていた。"}, {"t": 1727.9666666666667, "x": "前もって使うべき器材を、これから\nいろいろ工夫していくべきだ、と。"}, {"t": 1732.05, "x": "鉄のたまもその器材の一つだったのね。"}, {"t": 1734.7166666666667, "x": "そういうことになる。"}, {"t": 1736.5333333333333, "x": "最初の章でテレビの望遠カメラの話をした。"}, {"t": 1739.3666666666666, "x": "28日は、そのテレビが長い時間、\n山荘を映し続けた日でもある。"}, {"t": 1743.9833333333333, "x": "どのくらい？"}, {"t": 1745.1166666666666, "x": "3月の参議院の委員会で、議員がNHKに聞いている。"}, {"t": 1748.7666666666667, "x": "28日、NHKは約10時間近く、現場から生中継をした。"}, {"t": 1753.4666666666667, "x": "9時間20分ほどだ。"}, {"t": 1755.0333333333333, "x": "その日の国会では予算の総括質問があった。"}, {"t": 1758.0666666666666, "x": "新聞の番組表では国会中継が予定されていた。"}, {"t": 1761.4, "x": "それを取りやめたのね。"}, {"t": 1762.8833333333334, "x": "そうだ。"}, {"t": 1764.0166666666667, "x": "週刊誌には放送評論家の公開質問状が載った。"}, {"t": 1767.3833333333334, "x": "山荘の報道と国会中継は、どちらが\n大事と考えるのか、という題だった。"}, {"t": 1772.25, "x": "NHKの専務理事はこう答えている。"}, {"t": 1774.65, "x": "その日の出来事の報道の値打ちで決めた、\n報道としては異例の措置だった、と。"}, {"t": 1779.35, "x": "子どもが赤軍ごっこをまねするのではないか、という\n批評もあったと認めている。"}, {"t": 1783.9, "x": "国会議員も見ていたのかしら。"}, {"t": 1785.9166666666667, "x": "衆議院の委員会である議員がこんな話をした。"}, {"t": 1788.75, "x": "その日の夕方、予算委員会の部屋で\n同僚に呼び止められた。"}, {"t": 1792.4833333333333, "x": "NHKが山荘を中継している、\nどうなったか見てきてくれ、と頼まれた。"}, {"t": 1797.0833333333333, "x": "それで下の事務所まで、テレビを見に行ったという。"}, {"t": 1799.9833333333333, "x": "国会の中でもみんな気にしていたのね。"}, {"t": 1802.5333333333333, "x": "のちの委員会でもこんな言葉が出ている。"}, {"t": 1804.8666666666666, "x": "国民は、一日も早く人質が救われるよう、"}, {"t": 1807.8333333333333, "x": "警察官しっかりやってくれという\n気持ちでテレビを見ていたと思う、と。"}, {"t": 1812.45, "x": "事件はこれで終わらなかった。"}, {"t": 1814.1666666666667, "x": "5人を捕まえたあと取り調べが進んだ。"}, {"t": 1816.65, "x": "そこで、山の中の隠れ家で\n起きていたことが明らかになる。"}, {"t": 1820.3666666666666, "x": "山の中で？"}, {"t": 1821.5166666666667, "x": "同じ組織の中で仲間の命が奪われていた。"}, {"t": 1824.4333333333334, "x": "警察白書の数字では、総勢29人のうち12人だ。"}, {"t": 1828.4, "x": "12人……。"}, {"t": 1829.5333333333333, "x": "この回では、それがどのように行われたかは話さない。"}, {"t": 1832.8, "x": "3月16日の衆議院本会議では、各党の議員が\nこの事件について緊急に質問した。"}, {"t": 1838.6, "x": "ある議員は、山荘の事件より次々に発覚した\n事件が、全国に深い衝撃を与えていると言った。"}, {"t": 1844.8833333333334, "x": "教育の責任か親の責任か警察の取り締まりか。"}, {"t": 1848.2333333333333, "x": "国会の議論は、山荘の外へ大きく広がっていった。"}, {"t": 1851.75, "x": "山荘で人質を取ったときには、\nもうその事件のあとだったのね。"}, {"t": 1855.7833333333333, "x": "時間の順ではそうなる。"}, {"t": 1857.2833333333333, "x": "委員会では、ある議員が警察の見方も問題にした。"}, {"t": 1860.6333333333334, "x": "事件のあと、現地の指揮官は新聞に\n「人質を大切にする原理があるので\n望みはあった」と話していた。"}, {"t": 1867.2333333333333, "x": "あとで分かったことからすると、見方が\n甘かったのではないか、と。"}, {"t": 1871.2166666666667, "x": "外から見ていた様子と中の実際は違ったのね。"}, {"t": 1874.3833333333334, "x": "白書によると、警察は山の隠れ家に\n集まっていた17人全員を逮捕した。"}, {"t": 1879.3, "x": "押収した物は、397件、1万568点にのぼった。"}, {"t": 1884.75, "x": "最後に、国会でこの10日間が\nどう評価されたかを並べておく。"}, {"t": 1888.5333333333333, "x": "評価ははっきり二つに分かれた。"}, {"t": 1890.6333333333334, "x": "どう分かれたの？"}, {"t": 1891.7666666666667, "x": "一つ目。"}, {"t": 1892.9, "x": "本会議である議員はこう言った。"}, {"t": 1894.7166666666667, "x": "警察官2名の死亡、十数名の負傷という\n高い代償を払っても、"}, {"t": 1898.8166666666666, "x": "一人の女性の命を救うために、\n人命尊重の方針を貫いた。"}, {"t": 1903.2166666666667, "x": "そのことに無条件に心から敬意を表すると。"}, {"t": 1906.2, "x": "命を守る方を選んだという見方ね。"}, {"t": 1908.7, "x": "二つ目。"}, {"t": 1909.8333333333333, "x": "5月の委員会で別の議員はこう言った。"}, {"t": 1912.2166666666667, "x": "山荘は、警察のやり方によっては、\n警察官の犠牲を出さずに済む道があった。"}, {"t": 1917.2333333333333, "x": "別の議員も、もっと初めのうちにやれば、\nあんなことにはならない、と言っている。"}, {"t": 1921.9833333333333, "x": "やり方の方を問題にしたのね。"}, {"t": 1924.1833333333334, "x": "逆の方向の意見もあった。"}, {"t": 1925.9666666666667, "x": "新聞には、警察はライフル銃でもっと\n重く武装すべきだという声も出ていた。"}, {"t": 1930.5166666666667, "x": "火の力で一気に片付けるべきだという声だ。"}, {"t": 1933.3333333333333, "x": "3月2日の委員会で、ある議員は\nそれを無理な意見だと言った。"}, {"t": 1937.1333333333334, "x": "人質がいる状況で、そういう\n無理なことはすべきでない、と。"}, {"t": 1940.8666666666666, "x": "もっと早くもっと強くもっと慎重に。"}, {"t": 1943.25, "x": "同じ10日間にいろいろな注文が出たのね。"}, {"t": 1945.9333333333334, "x": "これに対する警察庁の担当者の答えは、\n人質の命が先だった。"}, {"t": 1950.4666666666667, "x": "犯人は複数で人質は一人。"}, {"t": 1952.6333333333334, "x": "場所は千早城のような攻めにくい所だった。"}, {"t": 1955.3333333333333, "x": "だから、まず人質の命の安全を\n確保することを考えた、と。"}, {"t": 1959.4833333333333, "x": "中村寅太 委員長は、今回のような凶悪な\n事態は、これまで考えていなかったと認めた。"}, {"t": 1965.4, "x": "そのうえで、器材を整え、新しい情勢に合った\n警備を考えなければならない、と言った。"}, {"t": 1970.8, "x": "どちらの見方が正しいとは言わないのね。"}, {"t": 1973.3, "x": "この回では決めない。"}, {"t": 1974.5666666666666, "x": "記録に残っているのは両方の言葉だ。"}, {"t": 1977.6, "x": "1972年2月19日土曜日の午後。"}, {"t": 1980.7666666666667, "x": "坂を600メートル上った保養所に、5人が入った。"}, {"t": 1984.1333333333334, "x": "留守番をしていた一人の女性が人質になった。"}, {"t": 1987.0833333333333, "x": "警察は最高時1,400人で囲んだ。"}, {"t": 1989.7166666666667, "x": "150回をこえる呼びかけに返事は無かった。"}, {"t": 1992.5166666666667, "x": "要求も最後まで一度も無かった。"}, {"t": 1994.7833333333333, "x": "何も言わない相手と10日間向き合ったのね。"}, {"t": 1997.5, "x": "そうだ。"}, {"t": 1998.6333333333334, "x": "10日目の朝9時55分に最後の警告。"}, {"t": 2001.3666666666666, "x": "10時47分クレーン車が動き出した。"}, {"t": 2003.9666666666667, "x": "のちに国会で「鉄のたま」と呼ばれた物だ。"}, {"t": 2006.95, "x": "11時33分からの22分間で、\n警察官2人が撃たれて亡くなった。"}, {"t": 2011.8833333333334, "x": "午後6時14分人質は助け出された。"}, {"t": 2014.6666666666667, "x": "その知らせは、国会の予算委員会にも\n届き、部屋に拍手が起きた。"}, {"t": 2019.1, "x": "同じ日に、亡くなった人と助かった人がいたのね。"}, {"t": 2022.55, "x": "そして、身代わりを申し出た\n一般の男性も、命を落としている。"}, {"t": 2026.4833333333333, "x": "テレビは10時間近くそれを映し続けた。"}, {"t": 2029.0833333333333, "x": "望遠のカメラには、山荘がすぐ\n目の前にあるように見えた。"}, {"t": 2032.55, "x": "けれど、そこまでの坂には、身を\n隠す所がほとんど無かった。"}, {"t": 2036.5666666666666, "x": "画面からは見えなかった坂ね。"}, {"t": 2038.6, "x": "人質を盾にしながら、何も\n要求しない相手に、どこまで待つか。"}, {"t": 2042.8333333333333, "x": "いつ壁を壊すと決めるか。"}, {"t": 2044.5333333333333, "x": "国会の議論は、補償の線の引き方と、\n人質の罪の名前にまで広がった。"}, {"t": 2049.5833333333335, "x": "その答えは、この日に一つに決まったわけではない。"}, {"t": 2052.766666666667, "x": "記録には、待った10日間と、壊した\n1日の両方が残っているのね。"}, {"t": 2057.3333333333335, "x": "そういうことだ。"}, {"t": 2058.35, "x": "最後に、亡くなった内田尚孝さん、高見繁光さん、\nそして一般の男性のご冥福をお祈りする。"}, {"t": 2064.516666666667, "x": "今回の動画はここまでだ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
