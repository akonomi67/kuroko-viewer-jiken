<script>
const D={"name": "103", "file": "103_編集用", "dur": 2094.9833125, "segs": [], "subs": [{"t": 0.0, "x": "1982年9月29日の朝。"}, {"t": 2.95, "x": "アメリカ、\nイリノイ州のエルクグローブビレッジという町だ。"}, {"t": 6.283333333333333, "x": "シカゴの近く？"}, {"t": 7.516666666666667, "x": "シカゴから北西へ、車で30分ほどの住宅地だ。"}, {"t": 11.0, "x": "12歳の女の子が、のどが痛いと言った。"}, {"t": 13.716666666666667, "x": "両親が、家にあった市販の薬を飲ませた。"}, {"t": 16.533333333333335, "x": "タイレノール。アメリカの\nどの薬局にも置いてある、痛み止めだ。"}, {"t": 20.183333333333334, "x": "その子は、その日の午前中に亡くなった。"}, {"t": 22.916666666666668, "x": "……薬を飲んだだけで？"}, {"t": 24.35, "x": "カプセルの中身が、入れ替えられていた。"}, {"t": 26.733333333333334, "x": "青酸カリだ。"}, {"t": 27.783333333333335, "x": "同じ日、別の町でも人が倒れた。"}, {"t": 30.266666666666666, "x": "その翌日も、そのまた翌日も倒れた。"}, {"t": 33.05, "x": "三日のあいだに、七人が亡くなった。"}, {"t": 35.53333333333333, "x": "七人。"}, {"t": 36.31666666666667, "x": "いちばん下が、さっきの12歳の子だ。"}, {"t": 38.85, "x": "そして、この七人を死なせた\n人間は、いまも分かっていない。"}, {"t": 42.55, "x": "44年たっている。"}, {"t": 43.983333333333334, "x": "容疑者として名前の挙がった人はいた。"}, {"t": 46.333333333333336, "x": "ただ、その人が毒物混入で\n起訴されたことは、一度も無い。"}, {"t": 50.266666666666666, "x": "今回は、この事件を最初から順番に追いかける。"}, {"t": 53.36666666666667, "x": "1982年、シカゴのタイレノール毒物混入事件だ。"}, {"t": 57.416666666666664, "x": "先に断っておく。"}, {"t": 58.766666666666666, "x": "この回では、誰かを犯人だと決めない。"}, {"t": 61.266666666666666, "x": "起訴されていない人を、犯人としては扱わない。"}, {"t": 64.26666666666667, "x": "毒の入れ方も話さない。"}, {"t": 66.03333333333333, "x": "それは、そうしてほしいわ。"}, {"t": 67.8, "x": "もうひとつ。"}, {"t": 68.65, "x": "この事件のあと、薬の包み方が世界中で変わった。"}, {"t": 72.13333333333334, "x": "いま日本の薬局で買う薬にも、その痕が残っている。"}, {"t": 75.65, "x": "箱に巻いてあるフィルムと、瓶の口のアルミだ。"}, {"t": 78.55, "x": "あれって、そういう理由だったの。"}, {"t": 80.6, "x": "そういう理由だ。"}, {"t": 81.63333333333334, "x": "最後に、その話までいく。"}, {"t": 84.18333333333334, "x": "時間の順に見ていく。"}, {"t": 85.63333333333334, "x": "1982年9月29日、水曜日の朝だ。"}, {"t": 89.33333333333333, "x": "午前6時33分。"}, {"t": 90.98333333333333, "x": "エルクグローブビレッジの消防署に、\n救急の要請が入った。"}, {"t": 94.55, "x": "出動の記録には、こう書かれている。"}, {"t": 96.88333333333334, "x": "「娘が気を失ったので救急車を\nお願いしたい、と通報者が要請」"}, {"t": 101.0, "x": "家の名前は、ケラーマン。"}, {"t": 102.55, "x": "倒れたのは、12歳のメアリー・ケラーマンさんだ。"}, {"t": 105.65, "x": "その朝に、何があったの。"}, {"t": 107.53333333333333, "x": "父親が、あとになってこう話している。"}, {"t": 109.96666666666667, "x": "「娘が洗面所に入る音がした。"}, {"t": 112.01666666666667, "x": "ドアが閉まる音がした。そのあと、\n何かが落ちる音がした」"}, {"t": 115.7, "x": "「私はドアの前に行って、メアリー、\n大丈夫かと呼びかけた。返事は無かった」"}, {"t": 120.36666666666666, "x": "警察が着いたのが、5分後の6時38分。"}, {"t": 123.48333333333333, "x": "病院で死亡が確認されたのが、午前9時56分だ。"}, {"t": 127.2, "x": "のどが痛いって言っただけなのに。"}, {"t": 129.23333333333332, "x": "その朝に飲んだのは、大人用の強い\n方のタイレノールだった。"}, {"t": 132.78333333333333, "x": "カプセルの薬だ。粉の入った、\n二つに割れる形のものだな。"}, {"t": 137.05, "x": "そうよね。薬は疑わないわ。"}, {"t": 139.16666666666666, "x": "この時点では、誰も薬を疑っていない。"}, {"t": 141.85, "x": "12歳の子が急に亡くなったのだから、\n病気だと考える。"}, {"t": 145.46666666666667, "x": "その日のうちに、同じことが別の家でも起きる。"}, {"t": 148.98333333333332, "x": "同じ9月29日。"}, {"t": 150.55, "x": "場所はアーリントンハイツ。さっきの町の、すぐ隣だ。"}, {"t": 153.88333333333333, "x": "午後1時33分、また救急の要請が入った。"}, {"t": 157.21666666666667, "x": "倒れたのは、27歳のアダム・ヤヌスさん。"}, {"t": 160.0, "x": "郵便局で働いていた方だ。"}, {"t": 162.1, "x": "午後3時15分、病院で亡くなった。"}, {"t": 164.68333333333334, "x": "まだ27歳。"}, {"t": 165.96666666666667, "x": "家族が、この家に集まった。"}, {"t": 167.91666666666666, "x": "突然のことだったから、みんなで来たわけだな。"}, {"t": 170.81666666666666, "x": "その中に、弟のスタンリー・ヤヌスさんと、\nその奥さんのテレサさんがいた。"}, {"t": 175.51666666666668, "x": "二人はリズルという別の町に住んでいた。"}, {"t": 177.95, "x": "スタンリーさんは25歳。"}, {"t": 179.41666666666666, "x": "テレサさんは19歳だ。"}, {"t": 181.18333333333334, "x": "……何があったの。"}, {"t": 182.31666666666666, "x": "同じ家の中に、開いた\nタイレノールの瓶が置いてあった。"}, {"t": 185.58333333333334, "x": "二人は、そこから飲んだ。"}, {"t": 187.28333333333333, "x": "午後5時40分、スタンリーさんが倒れた。"}, {"t": 189.81666666666666, "x": "テレサさんも同じ症状になった。"}, {"t": 191.88333333333333, "x": "スタンリーさんは、\nその日の午後8時15分に亡くなった。"}, {"t": 195.33333333333334, "x": "テレサさんは、10月1日まで生きた。"}, {"t": 197.86666666666667, "x": "装置を外したのが、10月1日の午後1時15分だ。"}, {"t": 201.61666666666667, "x": "一つの家で、三人……。"}, {"t": 203.33333333333334, "x": "兄が亡くなった日に、弟と\n義理の妹が同じ瓶から飲んだ。"}, {"t": 207.16666666666666, "x": "残された弟のジョーさんは、のちにこう言っている。"}, {"t": 210.11666666666667, "x": "「あいつは俺の人生を奪った。"}, {"t": 211.73333333333332, "x": "俺の人生と、家族の人生を粉々にした」"}, {"t": 214.9, "x": "……そんなことって。"}, {"t": 216.08333333333334, "x": "この「三人」が、事件を見つける手がかりになる。"}, {"t": 219.31666666666666, "x": "同じ家で三人が続けて倒れたからだ。"}, {"t": 222.43333333333334, "x": "ここから、気づいた人の話をする。"}, {"t": 224.78333333333333, "x": "最初に薬にたどり着いたのは、\n警察でも医者でもない。"}, {"t": 228.18333333333334, "x": "非番の消防士が二人だ。"}, {"t": 230.03333333333333, "x": "消防士？"}, {"t": 230.9, "x": "エルクグローブビレッジ消防のリチャード・\nキーワースさん、当時39歳。"}, {"t": 235.1, "x": "それと、アーリントンハイツ消防のフィリップ・\nカパテリさんだ。"}, {"t": 238.6, "x": "キーワースさんは休みの日で、\n朝の救急要請を無線で聞いていた。"}, {"t": 242.51666666666668, "x": "ただ、そのときは気にも留めなかった。"}, {"t": 244.9, "x": "その夜、カパテリさんから電話がかかってきた。"}, {"t": 247.75, "x": "世間話だ。"}, {"t": 248.8, "x": "カパテリさんの義理の母親が、亡くなった\n12歳の子の母親と、同じ職場で働いていた。"}, {"t": 254.58333333333334, "x": "町が小さいのね。"}, {"t": 255.96666666666667, "x": "その電話で、アーリントンハイツで\n一家三人が倒れた話が出た。"}, {"t": 259.8333333333333, "x": "キーワースさんが言ったのが、この一言だ。"}, {"t": 262.4166666666667, "x": "「その話、どこかで聞いた話に似ている」"}, {"t": 265.0833333333333, "x": "彼は自分の消防署に電話をかけて、\n朝の出動記録を読ませた。"}, {"t": 269.1666666666667, "x": "報告書には、その子が「直前にタイレノールを\n飲んでいた」と書かれていた。"}, {"t": 273.81666666666666, "x": "……両方に、同じ薬。"}, {"t": 275.53333333333336, "x": "そういうことだ。"}, {"t": 276.53333333333336, "x": "キーワースさんは、のちにこう話している。"}, {"t": 278.8, "x": "自分でも誇らしいが、あれは偶然と、\n知りたがりの性分のおかげだ、と。"}, {"t": 283.3333333333333, "x": "世間話から、だったのね。"}, {"t": 285.3833333333333, "x": "この電話が無ければ、九月三十日の朝は来ていない。"}, {"t": 289.3666666666667, "x": "もう一人、同じ夜に気づいた方がいる。"}, {"t": 291.8666666666667, "x": "ヘレン・ジェンセンさん。"}, {"t": 293.05, "x": "アーリントンハイツの、村でただ\n一人の公衆衛生の担当者だ。"}, {"t": 296.98333333333335, "x": "看護師の方だな。"}, {"t": 298.3, "x": "ヤヌス家を調べてくれと言われて、その家に入った。"}, {"t": 301.4, "x": "洗面所に、開けられたタイレノールの瓶があった。"}, {"t": 304.23333333333335, "x": "そばに、その日の日付のレシートも落ちていた。"}, {"t": 307.15, "x": "その日に買った薬だったのね。"}, {"t": 309.25, "x": "彼女は、中身を数えた。"}, {"t": 311.06666666666666, "x": "減っているカプセルは六つ。"}, {"t": 312.7, "x": "ところが、倒れたのは三人だ。"}, {"t": 314.8666666666667, "x": "合わないじゃない。"}, {"t": 315.9, "x": "合わない。だから彼女は、薬そのものを疑った。"}, {"t": 319.06666666666666, "x": "そして、こう言った。"}, {"t": 320.4, "x": "「タイレノールよ」"}, {"t": 321.31666666666666, "x": "ただ、その場では取り合ってもらえなかった。"}, {"t": 323.8333333333333, "x": "本人が、あとでこう話している。"}, {"t": 325.78333333333336, "x": "「あのときは、みんな私の話を鼻であしらった。"}, {"t": 328.65, "x": "看護師の、しかも女が気づくとは思わなかったのよ」"}, {"t": 332.06666666666666, "x": "ひどい話だわ。"}, {"t": 333.35, "x": "それでも彼女は、瓶を捜査員に渡した。"}, {"t": 336.01666666666665, "x": "そのうえで、製薬会社にも自分で電話をかけている。"}, {"t": 339.18333333333334, "x": "「棚のタイレノールを全部下げてくれと伝えた」"}, {"t": 341.9166666666667, "x": "一人で、そこまで。"}, {"t": 343.45, "x": "結果はこうだ。"}, {"t": 344.43333333333334, "x": "「午前10時までに、\nアーリントンハイツの全部の店から、\nタイレノールは棚から消えた」"}, {"t": 349.8333333333333, "x": "9月30日。"}, {"t": 351.05, "x": "午前2時45分に、血液の検査で、スタンリーさんと\nテレサさんから青酸が確認された。"}, {"t": 356.8833333333333, "x": "薬だという疑いが、ここで裏づけられた。"}, {"t": 359.5833333333333, "x": "そして午前10時、郡の検視局が記者会見を開いた。"}, {"t": 363.1666666666667, "x": "主任の毒物学者、マイケル・\nシェイファーさんの言葉だ。"}, {"t": 366.68333333333334, "x": "「強い方のタイレノールの容器二つから、\n青酸を確かに確認した。"}, {"t": 370.73333333333335, "x": "五十カプセル入りの瓶だ」"}, {"t": 372.51666666666665, "x": "公に出たのが、そこなのね。"}, {"t": 374.65, "x": "会見では、住民に飲まないよう呼びかけている。"}, {"t": 377.51666666666665, "x": "その日のうちに、二人が亡くなっている。"}, {"t": 379.95, "x": "メアリー・マクファーランドさん、\n31歳。午前3時15分。"}, {"t": 383.73333333333335, "x": "メアリー・ライナーさん、27歳。午前9時3分。"}, {"t": 387.01666666666665, "x": "ライナーさんは、四人目の子を\n産んだ一週間ほどあとだった。"}, {"t": 390.53333333333336, "x": "……一週間。"}, {"t": 391.45, "x": "マクファーランドさんは、職場の休憩室で倒れている。"}, {"t": 394.6166666666667, "x": "この二人が亡くなった時刻は、\n資料によって半日ほどずれている。"}, {"t": 398.55, "x": "9月29日の午後だと書いているものもある。"}, {"t": 401.26666666666665, "x": "だからここでは「29日の夜から\n30日の朝にかけて」と言っておく。"}, {"t": 405.98333333333335, "x": "警告のほうが、遅かったのね。"}, {"t": 408.2, "x": "はっきりしているのは、警告が出た\n朝には、もう手遅れだったということだ。"}, {"t": 413.1333333333333, "x": "ここからのシカゴの動きは、かなり早い。"}, {"t": 415.5833333333333, "x": "9月30日、警察の車と救急車が住宅地を回った。"}, {"t": 419.6333333333333, "x": "屋根に付いた拡声器から、同じ言葉を流し続けた。"}, {"t": 423.06666666666666, "x": "「タイレノールを飲まないでください」"}, {"t": 424.93333333333334, "x": "車で、町中に。"}, {"t": 426.5, "x": "市内では、警察官が一軒ずつ家を回って瓶を集めた。"}, {"t": 430.1333333333333, "x": "何か国語かのチラシも刷って配っている。"}, {"t": 432.6666666666667, "x": "市長のジェーン・バーンさんは、\n市内の店から全部下げると発表した。"}, {"t": 436.8, "x": "家にある分も捨ててくれ、と市民に言っている。"}, {"t": 439.48333333333335, "x": "48時間のうちに、そこまでやった。"}, {"t": 442.1166666666667, "x": "10月1日には、市の保健局が緊急の会議を開いた。"}, {"t": 445.93333333333334, "x": "職員が48時間以上ぶっ通しで、\nカプセルを手で開けて中を見た。"}, {"t": 450.35, "x": "全部、目で。"}, {"t": 451.48333333333335, "x": "機械が無いからな。"}, {"t": 452.73333333333335, "x": "10月4日には、シカゴ市議会が条例を可決している。"}, {"t": 456.18333333333334, "x": "開けられたら分かる包装を義務づける、という内容だ。"}, {"t": 459.35, "x": "もう決めたの。"}, {"t": 460.4166666666667, "x": "最初の死亡から、5日後だ。"}, {"t": 462.4, "x": "この時点では、国の規則はまだ何も出ていない。"}, {"t": 465.3833333333333, "x": "9月30日の夜には、イリノイ州の司法のトップ、\nタイ・ファーナーさんが捜査本部を作っている。"}, {"t": 471.31666666666666, "x": "最初は20人から25人。そこへ、一日に\n300件から400件の情報が入ってきた。"}, {"t": 477.1666666666667, "x": "ファーナーさんは、のちにこう言っている。"}, {"t": 479.26666666666665, "x": "「人が殺されるときは、たいてい\nその人を殺すつもりがある」"}, {"t": 482.75, "x": "「これは完全に無差別だ。"}, {"t": 484.26666666666665, "x": "致死性の毒を流通に置いて、\n誰が倒れるかを見ているだけだ」"}, {"t": 488.06666666666666, "x": "まだ続くの？"}, {"t": 489.15, "x": "そして10月1日、7人目が見つかる。"}, {"t": 491.93333333333334, "x": "ポーラ・プリンスさん、35歳。"}, {"t": 493.98333333333335, "x": "航空会社の客室乗務員だった方だ。"}, {"t": 496.65, "x": "9月29日にシカゴ市内の薬局で買った\nタイレノールを、自宅で飲んでいた。"}, {"t": 501.3666666666667, "x": "10月1日の午後5時45分、部屋で見つかった。"}, {"t": 504.75, "x": "瓶から減っていたカプセルは、一つだけだった。"}, {"t": 508.3, "x": "ここで、一度まとめておく。"}, {"t": 510.0833333333333, "x": "亡くなった方の名前と年齢は、FBIが\n2012年に公表した一覧に合わせる。"}, {"t": 515.2333333333333, "x": "メアリー・ケラーマンさん、12歳。"}, {"t": 517.1666666666666, "x": "エルクグローブビレッジ。"}, {"t": 518.6, "x": "アダム・ヤヌスさん、27歳。"}, {"t": 520.65, "x": "アーリントンハイツ。"}, {"t": 521.8666666666667, "x": "スタンリー・ヤヌスさん、25歳。"}, {"t": 524.0833333333334, "x": "テレサ・ヤヌスさん、19歳。二人ともリズル。"}, {"t": 527.2666666666667, "x": "メアリー・ライナーさん、27歳。"}, {"t": 529.3333333333334, "x": "ウィンフィールド。"}, {"t": 530.2833333333333, "x": "メアリー・マクファーランドさん、\n31歳。エルムハースト。"}, {"t": 533.7166666666667, "x": "ポーラ・プリンスさん、35歳。シカゴ。"}, {"t": 536.6166666666667, "x": "一つの家から、三人も。"}, {"t": 538.6333333333333, "x": "FBIの文書には、こう書いてある。"}, {"t": 540.8833333333333, "x": "「七人全員が、1982年9月29日か、その直後に、"}, {"t": 545.5333333333333, "x": "青酸入りの強い方のタイレノールのカプセルを\n飲んだと判断された」"}, {"t": 549.4333333333333, "x": "この七人は、お互いを知らない。"}, {"t": 551.5166666666667, "x": "ヤヌス家の三人以外は、全員が別の場所で、\n別の店で買った薬を飲んでいる。"}, {"t": 556.6333333333333, "x": "それだけ。"}, {"t": 557.5333333333333, "x": "共通していたのは、飲んだ薬の名前だけだ。"}, {"t": 560.4, "x": "当時の州知事のジェームズ・\nトンプソンさんは、こう言った。"}, {"t": 563.6833333333333, "x": "「どこかに、頭のおかしい人間がいる」"}, {"t": 566.0666666666667, "x": "ウィンフィールドの警察署長のカール・\nソスタさんは、こうだ。"}, {"t": 569.55, "x": "「よほど手の込んだ、悪意のある\n人物が野放しになっている。"}, {"t": 572.85, "x": "相当な時間をかけたはずだ」"}, {"t": 574.7833333333333, "x": "年齢や住んでいた町は、資料に\nよって少しずつ違うものがある。"}, {"t": 578.5833333333334, "x": "この回は、FBIの一覧の数字で通す。"}, {"t": 582.0333333333333, "x": "入っていたのは、青酸カリだ。"}, {"t": 584.05, "x": "正しくは、シアン化カリウムという毒物だな。"}, {"t": 586.95, "x": "それって、飲んだらすぐなの。"}, {"t": 588.9, "x": "資料には、飲んでから15分以内に\n命に関わる、と書かれている。"}, {"t": 592.95, "x": "中身の粉が、抜かれて入れ替えられていた。"}, {"t": 595.6666666666666, "x": "それでいいわ。"}, {"t": 596.6, "x": "どうやったかは、この回では話さない。"}, {"t": 598.9, "x": "量の話も、ひとつだけにしておく。"}, {"t": 601.3, "x": "郡の検視局が調べたのは、ヤヌス家に\n残っていた44個のカプセルだ。"}, {"t": 605.9666666666667, "x": "シカゴの新聞が2022年にまとめた\n記事によると、そのうち4個だった。"}, {"t": 610.6333333333333, "x": "人が亡くなる量の三倍近い青酸が入っていた、とある。"}, {"t": 614.35, "x": "三倍。"}, {"t": 615.1, "x": "これが、公の機関が出した唯一の言い方だ。"}, {"t": 618.1333333333333, "x": "ミリグラムでいくつだった、という\n数字も世の中には出回っている。"}, {"t": 621.8166666666667, "x": "ただ、その数字は資料ごとに桁が違う。"}, {"t": 624.4333333333333, "x": "計算が合わないものもある。"}, {"t": 626.0166666666667, "x": "だから、ここでは言わない。"}, {"t": 627.7333333333333, "x": "合わない数字は、言わない。"}, {"t": 629.45, "x": "そうだ。"}, {"t": 630.0666666666667, "x": "ちなみに、44個のうち毒が入っていたのは4個だった。"}, {"t": 633.7166666666667, "x": "全部に入れたわけではない。"}, {"t": 635.25, "x": "飲んだ人が当たるかどうかは、完全に運だった。"}, {"t": 638.15, "x": "無差別、というのはそういう意味だ。"}, {"t": 640.2166666666667, "x": "もう一つ、厄介なことがある。"}, {"t": 642.25, "x": "この毒は、見ただけでは分からない。"}, {"t": 644.5166666666667, "x": "色が変わったりしないの。"}, {"t": 646.1166666666667, "x": "粉の見た目も、においも、ほとんど変わらない。"}, {"t": 648.9, "x": "最初に亡くなった12歳の子が、\n病気だと思われたのはそのためだ。"}, {"t": 652.9833333333333, "x": "家族も、医者も、疑いようがなかった。"}, {"t": 656.2166666666667, "x": "次は、どこで毒が入れられたかだ。"}, {"t": 658.4, "x": "普通に考えれば、作った工場を疑う。"}, {"t": 661.1666666666666, "x": "作るところで入れるのが、いちばん簡単だものね。"}, {"t": 664.25, "x": "ところが、そうではなかった。"}, {"t": 666.05, "x": "決め手は、瓶に印刷されていた管理番号だ。"}, {"t": 668.9333333333333, "x": "日本でいう製造ロット番号だな。\nいつ、どこで作った分かが分かる。"}, {"t": 673.05, "x": "毒の入っていた瓶の番号は、一種類ではなかった。"}, {"t": 676.3, "x": "最初に見つかったのがエムシー2880。\nほかにも二つの番号が確認されている。"}, {"t": 681.7833333333333, "x": "そして、この番号は同じ工場のものではなかった。"}, {"t": 684.9166666666666, "x": "当時、この薬を作っていた工場は二か所ある。"}, {"t": 687.8666666666667, "x": "ペンシルベニア州のフォートワシントン。"}, {"t": 689.8833333333333, "x": "それと、テキサス州のラウンドロックだ。"}, {"t": 692.4166666666666, "x": "州が違うじゃない。"}, {"t": 693.7166666666667, "x": "アメリカの北東の端と、南の真ん中だ。"}, {"t": 696.55, "x": "別々の工場で作られた瓶に、同じ毒が入っていた。"}, {"t": 700.0833333333334, "x": "工場の誰かがやったとすると、これが説明できない。"}, {"t": 703.2833333333333, "x": "作ってから店に並ぶまでにかかる\n日数も、合わなかった。"}, {"t": 706.85, "x": "だから捜査側は、こう結論を出した。"}, {"t": 709.3, "x": "毒は、工場を出たあと、店の棚の上で入れられた。"}, {"t": 712.5166666666667, "x": "見つかった店は、五つの町の六店舗だ。"}, {"t": 715.3, "x": "スーパーが二つ、薬局が二つ、食料品店が二つ。"}, {"t": 719.0833333333334, "x": "アーリントンハイツと、\nエルクグローブビレッジのスーパー。"}, {"t": 722.05, "x": "シャンバーグの薬局。"}, {"t": 723.3666666666667, "x": "シカゴ市内の薬局と、食料品店。"}, {"t": 725.95, "x": "それと、ウィンフィールドの食料品店だ。"}, {"t": 728.55, "x": "全部ばらばらの店。"}, {"t": 730.0166666666667, "x": "ばらばらだ。"}, {"t": 730.8166666666667, "x": "だから、誰かがそれぞれの店に行ったことになる。"}, {"t": 733.8666666666667, "x": "……戻したの。"}, {"t": 734.8333333333334, "x": "買って、家で中身を入れ替えて、\nまた棚に戻した、と見られている。"}, {"t": 739.5833333333334, "x": "ここからは、作っていた会社の話だ。"}, {"t": 742.15, "x": "ジョンソン・エンド・ジョンソン。"}, {"t": 743.75, "x": "日本でも名前を聞く会社だな。"}, {"t": 745.7666666666667, "x": "9月30日の午後、まず\n一つの番号の分だけを回収した。"}, {"t": 749.8, "x": "エムシー2880。9万3000本だ。"}, {"t": 752.8666666666667, "x": "次に、別の番号の17万1000本を足した。"}, {"t": 756.15, "x": "数だけ聞くと、けっこう出したように見えるけど。"}, {"t": 759.05, "x": "足りなかった。"}, {"t": 760.0, "x": "当時の経済誌によると、この薬は\n会社の利益の15から20パーセントを稼いでいた。"}, {"t": 765.2333333333333, "x": "それが、事件の直後に売り上げが8割落ちている。"}, {"t": 768.45, "x": "8割。"}, {"t": 769.2833333333333, "x": "全国の回収に踏み切るきっかけになったのは、\nカリフォルニアで起きた真似の事件だった。"}, {"t": 774.4, "x": "シカゴの外でも始まった、ということだ。"}, {"t": 776.9833333333333, "x": "10月5日、会社は全国のタイレノールを\n全部回収すると決めた。"}, {"t": 781.1666666666666, "x": "最初の死亡から、七日後だ。"}, {"t": 783.1666666666666, "x": "対象は3,100万本。"}, {"t": 784.8666666666667, "x": "店で売られる値段で、1億ドルを超えていた。"}, {"t": 787.7333333333333, "x": "1億ドル。"}, {"t": 788.7, "x": "当時の記事は、税引き前で\n1億ドルの負担になる見込みだと書いている。"}, {"t": 792.9, "x": "決めたのは、会長のジェームズ・\nバークさんという方だ。"}, {"t": 796.1, "x": "ただ、周りは反対していた。"}, {"t": 798.0833333333334, "x": "FBIも、薬を管理する国の役所も、\n全国回収には最初は難色を示している。"}, {"t": 803.7833333333333, "x": "なんで？"}, {"t": 804.5, "x": "全部下げたら、犯人の思う\nつぼになる、という考え方があった。"}, {"t": 808.5, "x": "それでも会社は下げた。"}, {"t": 810.0, "x": "バークさんは、あとでこう言っている。"}, {"t": 812.0, "x": "「世の中は、大きい会社であることをよく\n責める。だがこれは、大きさが役に立った例だ」"}, {"t": 817.25, "x": "下げたのね。"}, {"t": 818.2666666666667, "x": "無料の電話も二本引いた。"}, {"t": 819.95, "x": "一本は買った人向け、もう一本は\n報道向けで、毎日録音を差し替えた。"}, {"t": 824.6166666666667, "x": "カプセルを持ってきた人には、\n粉の入っていない錠剤と無料で取り替えた。"}, {"t": 828.9666666666667, "x": "1本あたり2ドル50セントまでの値引き券も配っている。"}, {"t": 832.9333333333333, "x": "事件から1か月と少しで、国が動いた。"}, {"t": 835.7666666666667, "x": "1982年11月5日。"}, {"t": 838.3666666666667, "x": "アメリカの官報に、食品医薬品局の規則が載った。"}, {"t": 842.0833333333334, "x": "官報って、法律のこと？"}, {"t": 844.05, "x": "法律ではない。役所が作る決まりだ。"}, {"t": 846.3666666666667, "x": "国が出す公式の新聞に載せる。"}, {"t": 848.6166666666667, "x": "中身は、市販薬の包装の義務づけだ。"}, {"t": 851.2166666666667, "x": "この規則の書き出しに、こう書いてある。"}, {"t": 853.6, "x": "「この措置は、シカゴ地域で七人の死者を出した\n悪意ある混入事件にかんがみ、"}, {"t": 858.0666666666667, "x": "包装の完全性と製品の安全を\n確保するために取られる」"}, {"t": 861.9, "x": "事件の名前が、そのまま理由に書いてあるのね。"}, {"t": 864.9333333333333, "x": "書いてある。"}, {"t": 865.7, "x": "求められたのは、破られたら見て分かる包装だ。"}, {"t": 868.65, "x": "規則の言葉では、こうなっている。"}, {"t": 870.7833333333333, "x": "「破られたり無くなったりしていれば、"}, {"t": 872.65, "x": "混入があったことの目に見える証拠を\n消費者に与えると合理的に期待できる、"}, {"t": 876.9833333333333, "x": "表示または侵入の障壁を備えた包装」"}, {"t": 879.7333333333333, "x": "それと、その仕掛けが何なのかを箱に書くこと。"}, {"t": 882.7666666666667, "x": "対象は、店で売る市販薬のほぼ全部だ。"}, {"t": 885.4833333333333, "x": "外されたのは、塗り薬と歯磨きと、\nインスリンの三つだけだった。"}, {"t": 889.7833333333333, "x": "ほとんど全部ね。"}, {"t": 891.0166666666667, "x": "この規則が実際に効き始めるのは、\n翌1983年の2月7日からだ。"}, {"t": 896.4166666666666, "x": "表示の義務が同じ年の5月5日。"}, {"t": 898.75, "x": "店の棚に残っている古い\n在庫の期限が、1984年の2月6日。"}, {"t": 903.7333333333333, "x": "三段階に分けてある。"}, {"t": 905.2, "x": "ちなみに、この「破られにくい包装」という\n言い方は、1998年に変わっている。"}, {"t": 910.9, "x": "「破られたら分かる包装」だ。"}, {"t": 912.9, "x": "言い方を変えただけ？"}, {"t": 914.3166666666667, "x": "役所の説明が、はっきりしている。"}, {"t": 916.6333333333333, "x": "「『破られたら分かる』という言葉は、その包装が\n破りにくい、あるいは破れないと示すのではなく、"}, {"t": 922.0666666666667, "x": "混入の痕跡に消費者が\n気づくことの大切さを正しく強調する」"}, {"t": 926.4666666666667, "x": "なるほど。"}, {"t": 927.3166666666667, "x": "守るのは包装ではなく、気づく\n人のほうだ、と言い直したわけだ。"}, {"t": 931.8833333333333, "x": "会社のほうも、同じ月に動いている。"}, {"t": 934.3, "x": "1982年11月11日。"}, {"t": 937.15, "x": "最初の死亡から、43日後だ。"}, {"t": 939.6333333333333, "x": "新しい包装が発表された。"}, {"t": 941.7, "x": "どんなものだったの。"}, {"t": 943.1, "x": "三つ重ねだ。"}, {"t": 944.0833333333334, "x": "まず、外の箱のふたを糊で貼る。"}, {"t": 946.1666666666666, "x": "開けたら紙が破れる。"}, {"t": 947.6166666666667, "x": "次に、瓶の首にプラスチックの輪をかぶせる。"}, {"t": 950.4166666666666, "x": "最後に、瓶の口の内側に、厚いアルミの膜を貼る。"}, {"t": 953.9333333333333, "x": "……いま家にある薬と、同じだわ。"}, {"t": 956.4, "x": "同じだ。ここから来ている。"}, {"t": 958.1666666666666, "x": "箱には、明るい黄色で注意書きも入れた。"}, {"t": 960.7666666666667, "x": "封が破れていたら使うな、という一文だ。"}, {"t": 963.4333333333333, "x": "安全の封のことは、六つある面のうち五つに書いた。"}, {"t": 966.7, "x": "この発表は、記者会見を\n29の都市に中継して行っている。"}, {"t": 970.6166666666667, "x": "フィラデルフィア、シカゴ、ロサンゼルス、\nワシントンからは、記者が直接質問できるようにした。"}, {"t": 976.4333333333333, "x": "会社が、そこまで表に出たのね。"}, {"t": 978.8333333333334, "x": "隠したら終わりだ、と考えたんだろう。"}, {"t": 981.2, "x": "売り上げの話も、しておく。"}, {"t": 983.0666666666667, "x": "事件の前、この薬は痛み止め\n市場の35パーセントを持っていた。"}, {"t": 987.2666666666667, "x": "事件の直後、8パーセントまで落ちている。"}, {"t": 989.9833333333333, "x": "そして1年たたないうちに戻った。"}, {"t": 992.1833333333333, "x": "ここは当時のニューヨーク・タイムズが\n1983年9月に書いた記事の数字だ。"}, {"t": 997.45, "x": "戻ったんだ。"}, {"t": 998.45, "x": "会社の動きが早かったからだ、と\n当時の記事は書いている。"}, {"t": 1002.5833333333334, "x": "ここから、手紙の話に入る。"}, {"t": 1004.7166666666667, "x": "1982年10月6日。"}, {"t": 1007.1, "x": "ジョンソン・エンド・ジョンソンに、\n一通の手紙が届いていた。"}, {"t": 1010.7166666666667, "x": "のちに法廷で、判決文の中に全文が載っている。"}, {"t": 1014.1666666666666, "x": "……何が書いてあったの。"}, {"t": 1015.5833333333334, "x": "出だしが、こうだ。"}, {"t": 1016.8333333333334, "x": "「諸君。ご覧のとおり、店の棚に置いてある\nカプセルに青酸を入れるのは簡単だ」"}, {"t": 1021.5666666666667, "x": "そして、こう続く。"}, {"t": 1022.95, "x": "「この小さなカプセルの報道が\n気にならないなら、何もしなくていい」"}, {"t": 1026.7833333333333, "x": "「殺すのをやめさせたいなら、\n100万ドルを口座に振り込め」"}, {"t": 1030.15, "x": "銀行の名前と、口座番号まで書いてあった。"}, {"t": 1032.9833333333333, "x": "シカゴの銀行の、8449597番だ。"}, {"t": 1036.15, "x": "番号まで書いたの。"}, {"t": 1037.55, "x": "書いた。"}, {"t": 1038.1833333333334, "x": "最後は、こうだ。"}, {"t": 1039.35, "x": "「この手紙のことでFBIや\nシカゴの当局を巻き込もうとするな。"}, {"t": 1042.95, "x": "私が何本か電話をかければ、\nそちらのやることは全部無駄になる」"}, {"t": 1047.05, "x": "捜査側は、この手紙から二つのものを追いかけた。"}, {"t": 1050.1666666666667, "x": "一つは、その口座番号だ。"}, {"t": 1052.15, "x": "調べると、シカゴのある会社の経営者の口座だった。"}, {"t": 1055.25, "x": "1981年8月から翌年5月まで開いていた。"}, {"t": 1059.4333333333334, "x": "もう一つは、封筒の郵便料金だ。"}, {"t": 1061.9833333333333, "x": "切手じゃなくて？"}, {"t": 1063.2, "x": "料金メーターだ。会社が自分で\n料金を印字する機械だな。"}, {"t": 1066.8333333333333, "x": "その印字には、機械ごとの番号が入る。"}, {"t": 1069.4, "x": "そこから、シカゴのある会社の機械だと分かった。"}, {"t": 1072.4166666666667, "x": "この二つが、同じ一人の人物につながった。"}, {"t": 1075.6166666666666, "x": "え。"}, {"t": 1076.0666666666666, "x": "ただ、その口座の持ち主が書いたのではなかった。"}, {"t": 1079.7333333333333, "x": "1982年12月13日。"}, {"t": 1082.5, "x": "ニューヨーク市の公立図書館で、\n一人の男性が逮捕された。"}, {"t": 1086.1666666666667, "x": "そのとき読んでいたのは、二冊の資料だった。"}, {"t": 1088.9166666666667, "x": "『アメリカ南西部の新聞』と\n『アメリカの最大企業』だ。"}, {"t": 1092.6, "x": "逃げ先を探していたってこと？"}, {"t": 1094.6333333333334, "x": "そう読める、というだけだ。"}, {"t": 1096.1, "x": "書いてあるのはここまでだ。"}, {"t": 1097.65, "x": "逮捕された人は、ロバート・\nリチャードソンという名前を名乗っていた。"}, {"t": 1101.6166666666666, "x": "本名は、ジェームズ・ルイス氏だった。"}, {"t": 1103.9666666666667, "x": "ここから先を、はっきり言っておく。"}, {"t": 1106.0833333333333, "x": "この方が問われたのは、恐喝の未遂だ。"}, {"t": 1108.7333333333333, "x": "起訴状は一つだけ。毒物混入でも、殺人でもない。"}, {"t": 1112.5333333333333, "x": "手紙の罪だけ。"}, {"t": 1113.85, "x": "手紙の罪だけだ。"}, {"t": 1115.1666666666667, "x": "裁判は6日間で、陪審が有罪と判断した。"}, {"t": 1118.3333333333333, "x": "判決が出たのは、1984年6月14日。禁錮10年だ。"}, {"t": 1123.1, "x": "この裁判の記録には、こう書かれている。"}, {"t": 1125.6, "x": "「被告人が殺人で裁かれているのではないことは、\n十分に明らかにされていた」"}, {"t": 1130.3333333333333, "x": "裁判で争われたのは、手紙を出した目的だった。"}, {"t": 1133.6166666666666, "x": "検察は、金を取るためだと主張した。"}, {"t": 1136.1833333333334, "x": "弁護側は、金を取る気は無かったと主張した。"}, {"t": 1139.1166666666666, "x": "陪審は、検察の側を採った。"}, {"t": 1141.4, "x": "それでも、毒の話は出てこないのね。"}, {"t": 1143.9666666666667, "x": "出てこない。"}, {"t": 1144.7666666666667, "x": "本人は、手紙を書いて出したこと\n自体は否定していない。"}, {"t": 1148.1666666666667, "x": "ただ、目的は金ではなかったと主張した。"}, {"t": 1151.0166666666667, "x": "ある人物の不正な取引を\n表に出させたかったのだ、と述べている。"}, {"t": 1155.1166666666666, "x": "別に郵便を使った詐欺でも10年の判決を\n受けていて、二つは続けて執行された。"}, {"t": 1160.4, "x": "外に出たのは1995年。"}, {"t": 1162.5666666666666, "x": "逮捕から12年あまりだ。"}, {"t": 1164.4333333333334, "x": "それで、毒のほうは。"}, {"t": 1165.9833333333333, "x": "ずっと否定し続けた。"}, {"t": 1167.5, "x": "自分ははめられた、という\n内容のサイトまで作っている。"}, {"t": 1170.75, "x": "そして、毒物混入では最後まで起訴されていない。"}, {"t": 1173.9333333333334, "x": "2023年7月9日、マサチューセッツ州の自宅で\n亡くなった。76歳だった。"}, {"t": 1179.8, "x": "警察は、事件性は無いとしている。"}, {"t": 1182.2333333333333, "x": "……決まらないまま。"}, {"t": 1183.3666666666666, "x": "起訴されないまま、この方は亡くなった。"}, {"t": 1186.4833333333333, "x": "法律の話に戻る。"}, {"t": 1188.0166666666667, "x": "事件の前、アメリカには、この行為を\nきちんと罰する連邦の法律が無かった。"}, {"t": 1192.8333333333333, "x": "無かったの。"}, {"t": 1193.8, "x": "当時の大統領、ロナルド・レーガン氏が、\nそのことをはっきり書き残している。"}, {"t": 1198.4333333333334, "x": "法律に署名したときの声明だ。"}, {"t": 1200.5833333333333, "x": "「FBIはシカゴの惨事の捜査に深く\n関わっていたが、司法省はすぐに気づいた」"}, {"t": 1205.4833333333333, "x": "「こうした事件についての連邦の管轄には"}, {"t": 1207.9, "x": "疑いがあり、連邦法は製品への混入に\n軽い罪しか用意していなかった」"}, {"t": 1212.3166666666666, "x": "声明の書き出しは、こうだ。"}, {"t": 1214.1333333333334, "x": "「ちょうど一年前のいまごろ、この国は\nシカゴのタイレノールの悲劇に揺さぶられた」"}, {"t": 1218.6833333333334, "x": "「七人が、あの卑劣で忌まわしい\n製品混入によって命を失った」"}, {"t": 1222.85, "x": "この法案には、前の年にも一度動きがあった。"}, {"t": 1225.8666666666666, "x": "レーガン氏の声明に、そのことも書いてある。"}, {"t": 1228.4666666666667, "x": "「前の議会で、サーモンド議員は製品混入に\n厳しい連邦の罰を定める法案を上院で通した」"}, {"t": 1234.1333333333334, "x": "「残念ながら、その法案は"}, {"t": 1235.7333333333333, "x": "欠陥のある下院の法案に付け加えられ、私は\n1月にそれを認めないことが必要だと考えた」"}, {"t": 1241.85, "x": "一度は流れたんだ。"}, {"t": 1243.2833333333333, "x": "流れて、一年遅れた。"}, {"t": 1245.0333333333333, "x": "法案を出したのは、\nストロム・サーモンド議員という方だ。"}, {"t": 1248.5, "x": "1983年1月27日に提出。"}, {"t": 1251.8166666666666, "x": "共同提案者は59人。"}, {"t": 1253.6666666666667, "x": "上院を5月9日、下院を9月29日に通った。"}, {"t": 1257.2666666666667, "x": "そして1983年10月13日、\n連邦不正開封防止法として成立した。"}, {"t": 1263.15, "x": "どれくらいの罪になったの。"}, {"t": 1264.9333333333334, "x": "条文の数字を、そのまま言う。"}, {"t": 1266.8833333333334, "x": "未遂で、10年以下の拘禁と、\n2万5000ドル以下の罰金。"}, {"t": 1270.6333333333334, "x": "重い傷を負わせたときは、20年以下と10万ドル以下。"}, {"t": 1273.9666666666667, "x": "人が亡くなったときは、年数に上限が無い。"}, {"t": 1276.6833333333334, "x": "終身もありうる。罰金は10万ドル以下だ。"}, {"t": 1279.5333333333333, "x": "レーガン氏の声明は、こう締めている。"}, {"t": 1281.6833333333334, "x": "「これが連邦法に本物の牙を与え、"}, {"t": 1283.8333333333333, "x": "製品への混入を実際に\n思いとどまらせるものになると、我々は考えている」"}, {"t": 1288.5833333333333, "x": "ひとつ、間違えやすいところがある。"}, {"t": 1290.7333333333333, "x": "この法律に、包装の決まりは一行も無い。"}, {"t": 1293.5166666666667, "x": "包装は、さっきの役所の規則のほうだ。"}, {"t": 1296.2833333333333, "x": "二つで一組なのね。"}, {"t": 1297.8666666666666, "x": "罰と、包み方。事件のあと、別々に作られた。"}, {"t": 1302.1833333333334, "x": "三つの封をしても、終わらなかった。"}, {"t": 1304.4166666666667, "x": "1986年2月8日。"}, {"t": 1306.8166666666666, "x": "ニューヨーク州ピークスキルの、ダイアン・\nエルスロスさんという方が亡くなった。23歳だ。"}, {"t": 1312.2, "x": "飲んだのは、同じ強い\n方のタイレノールのカプセルだった。"}, {"t": 1315.6166666666666, "x": "……封は。"}, {"t": 1316.3166666666666, "x": "あった。"}, {"t": 1316.8833333333334, "x": "買った店はニューヨーク州ブロンクスビル。"}, {"t": 1319.0, "x": "開けたのは、滞在先の家の人だった。"}, {"t": 1321.6166666666666, "x": "国の役所は、27万400カプセルを調べている。"}, {"t": 1325.1, "x": "そこからは、毒は出なかった。"}, {"t": 1327.0333333333333, "x": "どこで入れられたのかは、分かっていない。"}, {"t": 1329.3166666666666, "x": "そして、その9日後だ。"}, {"t": 1331.15, "x": "1986年2月17日、月曜日。"}, {"t": 1334.5833333333333, "x": "ジョンソン・エンド・ジョンソンは、\n市販薬のカプセルをやめると発表した。"}, {"t": 1339.05, "x": "やめる。作るのを。"}, {"t": 1340.4666666666667, "x": "売るのも、作るのも全部だ。"}, {"t": 1342.2833333333333, "x": "当時、この薬の売り上げの3割がカプセルだった。"}, {"t": 1345.45, "x": "やめるのにかかる費用は、最大で\n1億5000万ドルと見込まれていた。"}, {"t": 1349.5666666666666, "x": "会長のジェームズ・\nバークさんの発表の言葉が、残っている。"}, {"t": 1353.3166666666666, "x": "「我々は、大きなためらいと\n重い心で、この決定をする」"}, {"t": 1356.9333333333334, "x": "「しかし、工場を出たあとのカプセルへの無差別な\n混入を我々が防げない以上、"}, {"t": 1361.3333333333333, "x": "カプセルを市場から下げることが、\n消費者に対する我々の務めだと考える」"}, {"t": 1366.05, "x": "同じときに、彼はこうも言っている。"}, {"t": 1368.1833333333334, "x": "「あとから振り返れば何でも見える。"}, {"t": 1369.9666666666667, "x": "カプセルの販売に戻らなければよかった」"}, {"t": 1372.65, "x": "戻らなければよかった……。"}, {"t": 1374.25, "x": "エルスロスさんのお母さんの言葉も、\n記録に残っている。"}, {"t": 1377.5833333333333, "x": "「三年、遅すぎたわ」"}, {"t": 1379.1166666666666, "x": "1982年のあの三日から、三年半だ。"}, {"t": 1382.65, "x": "形ごと、やめたのね。"}, {"t": 1384.4333333333334, "x": "カプセルという形そのものが、店から消えた。"}, {"t": 1387.9833333333333, "x": "この事件には、もう一人、名前の出た方がいる。"}, {"t": 1391.0666666666666, "x": "ロジャー・アーノルド氏。当時48歳だ。"}, {"t": 1393.7333333333333, "x": "1982年に事情を聴かれて、そのあと釈放されている。"}, {"t": 1397.9333333333334, "x": "起訴されなかったの。"}, {"t": 1399.35, "x": "タイレノールの件では、一度も起訴されていない。\nのちに容疑からも外れている。"}, {"t": 1403.8166666666666, "x": "ただ、この方の話には続きがある。"}, {"t": 1406.2833333333333, "x": "1983年6月、別の男性を\n撃って、殺人の罪に問われた。"}, {"t": 1411.2833333333333, "x": "警察は、自分を警察に売った人物だと\n取り違えたのだろう、と見ていた。"}, {"t": 1415.9666666666667, "x": "……関係のない人を。"}, {"t": 1417.3333333333333, "x": "この件では有罪になって、\n禁錮30年の判決を受けている。"}, {"t": 1421.1833333333334, "x": "弁護人は当時、取り違えの見立てを否定していた。"}, {"t": 1424.3, "x": "「それは事実からかけ離れている。"}, {"t": 1426.1666666666667, "x": "タイレノール事件で誰が\n情報提供者だったのか、我々は知らない」"}, {"t": 1430.1833333333334, "x": "私がこの話をしたのは、犯人に近い\n人がいた、と言いたいからではない。"}, {"t": 1434.8, "x": "逆だ。"}, {"t": 1435.45, "x": "名前が出るというのは、それだけで人の生活を壊す。"}, {"t": 1438.7833333333333, "x": "その人が本当にやったかどうかとは、別の話としてだ。"}, {"t": 1442.5666666666666, "x": "……そうね。"}, {"t": 1443.3, "x": "この事件では、44年のあいだに何人もの名前が出た。"}, {"t": 1446.9166666666667, "x": "そして、毒物混入で起訴された人は、一人もいない。"}, {"t": 1450.6666666666667, "x": "一人も。"}, {"t": 1451.55, "x": "一人もだ。"}, {"t": 1453.05, "x": "捜査は、止まってはいない。"}, {"t": 1454.7166666666667, "x": "2007年、新しい合同捜査班が作られた。"}, {"t": 1457.85, "x": "FBIが中心で、イリノイ州警察と、\n事件のあった四つの町の警察が入っている。"}, {"t": 1463.3166666666666, "x": "アーリントンハイツ、エルクグローブビレッジ、\nロンバード、シャンバーグだ。"}, {"t": 1467.0333333333333, "x": "シカゴ市警も協力している。"}, {"t": 1469.0666666666666, "x": "25年たってから、作り直したのね。"}, {"t": 1471.8, "x": "2009年2月4日、FBIシカゴ支局が文書を出している。"}, {"t": 1475.85, "x": "「FBIは、\nイリノイ州警察および複数の地元警察と協力し、"}, {"t": 1479.95, "x": "1982年のタイレノール殺人に関して集められた\n全証拠の完全な再検証を行っている」"}, {"t": 1486.2666666666667, "x": "理由も書いてある。"}, {"t": 1487.3666666666666, "x": "「鑑定技術の最近の多くの進歩を考えれば、"}, {"t": 1490.1166666666666, "x": "事件と回収された証拠をもう\n一度見直すのは当然のことであった」"}, {"t": 1494.1666666666667, "x": "そして、この一文が入っている。"}, {"t": 1496.2833333333333, "x": "「現在までのところ、この再検証によって\n刑事上の訴追が行われたことはない」"}, {"t": 1501.1, "x": "同じ日、FBIはマサチューセッツ州の住宅と\n貸倉庫を捜索している。"}, {"t": 1505.6, "x": "2010年1月には、裁判所の命令で\nDNAと指紋の提出が行われた。"}, {"t": 1510.75, "x": "一致したの。"}, {"t": 1511.8, "x": "しなかった。"}, {"t": 1512.6666666666667, "x": "瓶から取れたDNAは、\n提出されたものと一致していない。"}, {"t": 1516.3166666666666, "x": "2012年、事件から30年のときにも、\nFBIは文書を出している。"}, {"t": 1520.9166666666667, "x": "「これまでに数百件の聞き取りを行い、\n証拠になりうる数千点を再検査した」"}, {"t": 1525.7, "x": "同じ文書に、捜査班が何を\n任されたのかも書いてある。"}, {"t": 1529.2, "x": "「長く休眠していた捜査のすべての面を見直すこと」"}, {"t": 1532.4333333333334, "x": "「証人の聞き直し、すべての書類と"}, {"t": 1534.7333333333333, "x": "証拠品の電子化、そして、これまで\n使えなかった新しい鑑定に物証をかけること」"}, {"t": 1539.8666666666666, "x": "一から、やり直したのね。"}, {"t": 1541.7666666666667, "x": "この捜査班は、連邦の連続殺人の法律に\n基づいて、FBIが束ねている。"}, {"t": 1546.9333333333334, "x": "2013年、事件は\nアーリントンハイツ警察に引き継がれた。"}, {"t": 1550.75, "x": "2022年、40年の節目に、\nそこの巡査部長がこう話している。"}, {"t": 1555.3333333333333, "x": "「我々はこれを、連続殺人の殺人事件として、\nいまも実際に捜査している」"}, {"t": 1560.35, "x": "「40年たって、この犯罪で誰も起訴されていない」"}, {"t": 1563.5333333333333, "x": "「毒の入っていない錠剤も、入っていた錠剤も、\n瓶も箱も、中の綿も、我々は持っている」"}, {"t": 1569.5666666666666, "x": "全部、取ってあるのね。"}, {"t": 1571.1833333333334, "x": "取ってある。"}, {"t": 1572.0666666666666, "x": "いまも続いているのね。"}, {"t": 1573.6, "x": "2025年の時点でも、起訴された人はいない。"}, {"t": 1577.3833333333334, "x": "ここから、日本の話をする。"}, {"t": 1579.4166666666667, "x": "1984年3月。"}, {"t": 1581.5166666666667, "x": "シカゴの事件から、1年半後だ。"}, {"t": 1583.8666666666666, "x": "日本で、食品会社を狙った脅迫事件が始まった。"}, {"t": 1587.45, "x": "グリコ・森永事件だ。\nこのチャンネルでも一度扱っている。"}, {"t": 1591.3166666666666, "x": "お菓子に毒を入れて、店に置いたやつね。"}, {"t": 1593.9166666666667, "x": "青酸入りの菓子が、実際に店頭で見つかっている。"}, {"t": 1597.1166666666666, "x": "狙われた会社がどうなったかは、\n1987年の国会に記録が残っている。"}, {"t": 1602.3666666666666, "x": "食品産業センターの理事長が、\n参考人として数字を挙げている。"}, {"t": 1606.4166666666667, "x": "会社の名前は\n伏せて、ある菓子会社、という言い方だ。"}, {"t": 1609.8, "x": "1984年9月12日に、1億円を\n要求する脅迫状が一通届いた。"}, {"t": 1615.2833333333333, "x": "20日に新聞が報じて、そこから全国の報道になった。"}, {"t": 1618.9666666666667, "x": "その年の10月の売り上げは、\n前の年の同じ月から6割減った。"}, {"t": 1623.2833333333333, "x": "6割。"}, {"t": 1624.0833333333333, "x": "11月は、100億円あった\n月の売り上げが、70億円ほど減っている。"}, {"t": 1628.6333333333334, "x": "スーパーとデパートからは、商品が全部撤去された。"}, {"t": 1631.8, "x": "工場の生産は半分になった。"}, {"t": 1633.8166666666666, "x": "パートの従業員450人が自宅待機になり、\nそのあと全員解雇された。"}, {"t": 1638.6166666666666, "x": "1か月の損失は10億円を\n超えた、と理事長は述べている。"}, {"t": 1642.2166666666667, "x": "ボーナスは2割カット。"}, {"t": 1643.5, "x": "支給日も10日遅れた。"}, {"t": 1645.1, "x": "3年たっても、業績は事件の前の水準に戻らなかった。"}, {"t": 1649.0666666666666, "x": "……毒を入れられた側が、そこまで。"}, {"t": 1651.2666666666667, "x": "入れた側は、捕まっていない。"}, {"t": 1653.1, "x": "ここで、はっきりさせておきたいことがある。"}, {"t": 1655.5666666666666, "x": "この二つの事件は、似ている。"}, {"t": 1657.5666666666666, "x": "店に並んでいる商品に毒が入る。"}, {"t": 1659.7, "x": "誰が食べるか分からない。"}, {"t": 1661.1, "x": "犯人が分からない。"}, {"t": 1662.4333333333334, "x": "ただ、私は「日本の事件が\nアメリカの真似だ」とは言わない。"}, {"t": 1666.3833333333334, "x": "言えないの？"}, {"t": 1667.25, "x": "裏が取れないからだ。"}, {"t": 1668.5666666666666, "x": "私は、日本の国会の記録を1982年から全部あたった。"}, {"t": 1673.0833333333333, "x": "「タイレノール」という言葉が国会に\n出てくるのは、全部で7回だけだ。"}, {"t": 1677.3166666666666, "x": "そして、いちばん古いのが1987年9月2日だった。"}, {"t": 1681.7, "x": "事件のときは、一度も出ていない。"}, {"t": 1683.9333333333334, "x": "出ていない。1982年から1986年まで、ゼロだ。"}, {"t": 1688.6666666666667, "x": "当時の報道で、二つを並べたものは一つ見つけた。"}, {"t": 1692.05, "x": "1985年10月27日、アメリカの通信社が\n東京発で出した記事だ。"}, {"t": 1697.6, "x": "日本で起きていた別の飲み物への毒物混入を\n伝える中で、こう書いている。"}, {"t": 1702.15, "x": "「今回の事件は、1982年にアメリカで七人が\n青酸入りのタイレノールのカプセルを飲んで死亡し、"}, {"t": 1708.3833333333334, "x": "全国的な不安を引き起こして開封防止容器に\nつながった、よく似た事態を思い起こさせる」"}, {"t": 1713.95, "x": "同じ記事は、こうも書いている。"}, {"t": 1715.8166666666666, "x": "「タイレノールの事件では、\nこの人気の痛み止めのカプセル製品が\nすべて全米の店頭から回収されたが、"}, {"t": 1721.7, "x": "犯人は特定されなかった」"}, {"t": 1723.6, "x": "ここまでだ。"}, {"t": 1724.5666666666666, "x": "そこは分けるのね。"}, {"t": 1725.8833333333334, "x": "「思い起こさせる」と書いた記事がある、という\n話であって、つながっているという話ではない。"}, {"t": 1731.7333333333333, "x": "日本の国会が、この事件の名前を\n口にするのは1987年だ。"}, {"t": 1736.5333333333333, "x": "法律を作る審議の中でだった。"}, {"t": 1738.6833333333334, "x": "流通食品への毒物の混入等の防止等に\n関する特別措置法。"}, {"t": 1743.1, "x": "長い名前ね。"}, {"t": 1744.25, "x": "中身は短い。店で売る食べ物に毒を\n入れたら罰する、という法律だ。"}, {"t": 1748.6, "x": "法案を出した側の趣旨説明が、記録に残っている。"}, {"t": 1751.95, "x": "「昭和59年3月、流通食品に毒物を\n混入することにより食品企業を恐喝した、"}, {"t": 1757.75, "x": "警察庁指定第114号事件が発生して以来」"}, {"t": 1761.1166666666666, "x": "「これを模倣した食品企業恐喝事件が\n頻発しております」"}, {"t": 1764.9, "x": "「このような流通食品への毒物の混入は、\n消費者たる国民全体に対する挑戦であります」"}, {"t": 1770.8666666666666, "x": "日本は日本で、真似が続いていたのね。"}, {"t": 1773.5, "x": "それが、この法律を作った理由だ。"}, {"t": 1775.8166666666666, "x": "1987年9月2日、衆議院の農林水産委員会。"}, {"t": 1780.2, "x": "食品産業センターの理事長が、\n参考人としてこう述べている。"}, {"t": 1784.0666666666666, "x": "「ちなみに、アメリカでは"}, {"t": 1785.5166666666667, "x": "1982年に鎮痛剤のタイレノール事件というのが\n起きまして、"}, {"t": 1789.45, "x": "青酸カリを混入したわけでありますけれども、\nこの犯人は今もって逮捕されておりません」"}, {"t": 1794.6666666666667, "x": "「しかし、実は七名の死者が\n出たわけでございまして、翌1983年に\n米国議会では法律改正が行われて、"}, {"t": 1802.1, "x": "重罰規定が導入されたというふうに承っております」"}, {"t": 1805.6, "x": "同じ日、弁護士の参考人は、こう言っている。"}, {"t": 1808.5, "x": "「例えばアメリカで起きたタイレノール事件が\n日本にすぐ波及するというような"}, {"t": 1812.35, "x": "環境がありますので、やはり臨機応変に\n法律で措置をするということが必要になる」"}, {"t": 1817.4833333333333, "x": "日本にも来る、と思っていたのね。"}, {"t": 1819.7333333333333, "x": "そう述べた方がいた、ということだ。"}, {"t": 1821.9166666666667, "x": "法案は1987年9月18日に参議院を通って、成立した。"}, {"t": 1826.95, "x": "公布が9月26日。"}, {"t": 1828.6833333333334, "x": "ただ、この法律には、包装の決まりが無い。"}, {"t": 1831.5, "x": "第三条にあるのは\n「努めなければならない」という言い方だけだ。"}, {"t": 1835.3666666666666, "x": "そして、もうひとつ。"}, {"t": 1836.8, "x": "この法律の対象から、薬が外されている。"}, {"t": 1839.8333333333333, "x": "……薬が？"}, {"t": 1840.7, "x": "第二条の定義に、はっきり書いてある。"}, {"t": 1843.0666666666666, "x": "「流通食品とは、公衆に販売される飲食物をいう」。\nそこから医薬品と医薬部外品が除かれている。"}, {"t": 1849.4666666666667, "x": "この点は、国会でも正面から聞かれている。"}, {"t": 1852.25, "x": "1987年9月17日、参議院の農林水産委員会。"}, {"t": 1856.7333333333333, "x": "刈田貞子議員の質問だ。"}, {"t": 1858.6666666666667, "x": "「アメリカで起きている例のタイレノールの事件で、"}, {"t": 1861.0666666666666, "x": "シアン化カリウムが混入されていたという\n事件がありましたでしょう」"}, {"t": 1864.6333333333334, "x": "「あれで七名死亡していますね。"}, {"t": 1866.4, "x": "あの手の事件だって起こり得るわけで」"}, {"t": 1868.5333333333333, "x": "「この今回の特別措置を食品にだけ\n限った理由は何ですか」"}, {"t": 1872.5666666666666, "x": "もっともな質問だわ。"}, {"t": 1874.1333333333334, "x": "答えたのは、法案を出した\n側の白川勝彦衆議院議員だ。"}, {"t": 1878.05, "x": "「医薬品であるとか\n医薬部外品ということになりますと、これは"}, {"t": 1881.5666666666666, "x": "別の法律がございまして\nきちんと管理をされております」"}, {"t": 1884.7166666666667, "x": "「こん包その他も医薬品あるいは医薬部外品等に\nふさわしいようにいろいろな"}, {"t": 1888.6333333333334, "x": "基準が定められている」"}, {"t": 1890.15, "x": "「あえて流通食品と\n同種にしなくてもいいのではないだろうか」"}, {"t": 1893.6833333333334, "x": "……薬は、別だからと。"}, {"t": 1895.4166666666667, "x": "これが、日本の公式の説明だ。"}, {"t": 1897.7, "x": "では、日本の包み方は誰が変えたのか。"}, {"t": 1900.3833333333334, "x": "同じ委員会で、\n農林水産省の食品流通局の責任者が説明している。"}, {"t": 1905.3333333333333, "x": "「ある菓子企業におきましては容器の開閉部に熱で"}, {"t": 1908.0833333333333, "x": "縮むシュリンク包装というようなものを\n採用いたしましたり」"}, {"t": 1911.3666666666666, "x": "「あるいは飲料企業では"}, {"t": 1912.4833333333333, "x": "開栓と同時にキャップが\n裂けまして復元不可能となるような\nプルトップキャップに転換する」"}, {"t": 1917.65, "x": "そして、こう続く。"}, {"t": 1919.0333333333333, "x": "「これらはそれぞれ\n相応のコストがかかるわけでございますが、"}, {"t": 1922.1333333333334, "x": "各企業におきましてみずからそのコストを吸収して」"}, {"t": 1925.4666666666667, "x": "会社が自分で。法律で決められたんじゃなくて。"}, {"t": 1928.4833333333333, "x": "法律ではない。"}, {"t": 1929.4833333333333, "x": "この責任者は、アメリカの方式を\n取り寄せていたことも述べている。"}, {"t": 1933.4166666666667, "x": "「アメリカにおきまして包装について\nこういうようないろいろな方式をそれぞれの実態に"}, {"t": 1938.0166666666667, "x": "応じて適用したらいいのではないかと」"}, {"t": 1939.9833333333333, "x": "「こういうようなことの検討などがなされて、私どもも\nそれを手に入れまして参考にいたしております」"}, {"t": 1946.1666666666667, "x": "終わりに、二つやっておく。"}, {"t": 1947.75, "x": "出どころの確認と、時間順の並べ直しだ。"}, {"t": 1950.7666666666667, "x": "まず出どころ。捜査については、"}, {"t": 1952.5833333333333, "x": "FBIシカゴ支局が2009年2月4日と\n2012年に出した公式の文書。"}, {"t": 1957.8666666666666, "x": "恐喝の裁判については、\n連邦第7巡回区控訴裁判所の1986年の判決文。"}, {"t": 1964.1, "x": "包装の規則は、1982年11月5日の連邦官報、\n第47巻50442ページ。"}, {"t": 1971.0666666666666, "x": "理由の欄に、この事件が書いてある。"}, {"t": 1973.5, "x": "法律は、アメリカ制定法集の97巻831\nページ、公法98の127号。"}, {"t": 1979.8, "x": "署名時の声明はレーガン大統領図書館。"}, {"t": 1982.45, "x": "被害者の氏名と年齢は、FBIシカゴ支局が\n2012年に公表した一覧に合わせてある。"}, {"t": 1988.25, "x": "日本側は、\n国立国会図書館の国会会議録検索システムから、"}, {"t": 1992.6, "x": "1987年9月2日の衆議院農林水産委員会と、\n9月10日・9月17日の参議院農林水産委員会。"}, {"t": 2000.7166666666667, "x": "法律の条文は、電子政府の法令検索だ。"}, {"t": 2003.5833333333333, "x": "詳しい対応は、リサーチのファイルに残してある。"}, {"t": 2006.5833333333333, "x": "全部、無料で読めるの？"}, {"t": 2008.2833333333333, "x": "読める。気になったところは、\n自分で開いてみてほしい。"}, {"t": 2011.5666666666666, "x": "ここまでを、日付だけで並べ直す。"}, {"t": 2013.9, "x": "1982年9月29日から10月1日、\nシカゴ周辺で七人。いちばん下は12歳。"}, {"t": 2020.3666666666666, "x": "毒は青酸カリ。\n店の棚の市販薬のカプセルに入っていた。"}, {"t": 2024.2166666666667, "x": "瓶の管理番号が別々だったため、\n工場での混入は消えた。"}, {"t": 2028.0833333333333, "x": "10月5日、3,100万本が棚から下りる。"}, {"t": 2031.15, "x": "11月5日、包装の規則。"}, {"t": 2033.3166666666666, "x": "11月11日、三つ重ねの封。"}, {"t": 2035.95, "x": "1983年10月13日、罰の法律。"}, {"t": 2039.5, "x": "1986年2月、カプセルという形が消える。"}, {"t": 2043.3166666666666, "x": "1987年9月18日、日本にも\n同じ種類の法律。薬は対象外。"}, {"t": 2049.1666666666665, "x": "物のほうは、ぜんぶ変わったわけね。"}, {"t": 2051.4666666666667, "x": "変わった。"}, {"t": 2052.3166666666666, "x": "人のほうは？"}, {"t": 2053.366666666667, "x": "44年、起訴ゼロだ。"}, {"t": 2055.0333333333333, "x": "恐喝で有罪になった方はいる。\nそこは確定した事実だ。"}, {"t": 2058.7833333333333, "x": "毒物混入では一度も起訴されていない。"}, {"t": 2061.15, "x": "2023年、そのまま亡くなった。"}, {"t": 2063.8333333333335, "x": "……残ったのは名前だけ。"}, {"t": 2065.4166666666665, "x": "だからこの回は、誰も犯人として扱わなかった。"}, {"t": 2068.6833333333334, "x": "今度、薬局で箱を手に取ってみてくれ。"}, {"t": 2071.2833333333333, "x": "フィルムが巻いてある。"}, {"t": 2072.3166666666666, "x": "瓶の口にはアルミが貼ってある。"}, {"t": 2074.366666666667, "x": "破ると分かるやつね。"}, {"t": 2075.85, "x": "あれは便利のためじゃない。"}, {"t": 2077.133333333333, "x": "七人のあとに付いたものだ。"}, {"t": 2079.1, "x": "……知らずに毎日見てたわ。"}, {"t": 2080.7833333333333, "x": "私もそうだった。"}, {"t": 2082.0666666666666, "x": "物だけが先に変わって、始まりの一点は空いたままだ。"}, {"t": 2085.5, "x": "44年前の秋、誰が、どの店の棚で、何をしたのか。"}, {"t": 2089.6833333333334, "x": "……そこが、まだ。"}, {"t": 2090.95, "x": "まだだ。"}, {"t": 2091.6, "x": "あなたの見方を、コメントに置いていってくれ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
