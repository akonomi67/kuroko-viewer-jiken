<script>
const D={"name": "103", "file": "103_編集用", "dur": 2096.9833125, "segs": [], "subs": [{"t": 0.0, "x": "1982年9月29日の朝。"}, {"t": 2.95, "x": "アメリカ、\nイリノイ州のエルクグローブビレッジという町だ。"}, {"t": 6.283333333333333, "x": "シカゴの近く？"}, {"t": 7.516666666666667, "x": "シカゴから北西へ、車で30分ほどの住宅地だ。"}, {"t": 11.0, "x": "12歳の女の子が、のどが痛いと言った。"}, {"t": 13.716666666666667, "x": "両親が、家にあった市販の薬を飲ませた。"}, {"t": 16.533333333333335, "x": "タイレノール。アメリカの\nどの薬局にも置いてある、痛み止めだ。"}, {"t": 20.183333333333334, "x": "その子は、その日の午前中に亡くなった。"}, {"t": 22.916666666666668, "x": "……薬を飲んだだけで？"}, {"t": 24.35, "x": "カプセルの中身が、入れ替えられていた。"}, {"t": 26.733333333333334, "x": "青酸カリだ。"}, {"t": 27.783333333333335, "x": "同じ日、別の町でも人が倒れた。"}, {"t": 30.266666666666666, "x": "その翌日も、そのまた翌日も倒れた。"}, {"t": 33.05, "x": "三日のあいだに、七人が亡くなった。"}, {"t": 35.53333333333333, "x": "七人。"}, {"t": 36.31666666666667, "x": "いちばん下が、さっきの12歳の子だ。"}, {"t": 38.85, "x": "そして、この七人を死なせた\n人間は、いまも分かっていない。"}, {"t": 42.55, "x": "44年たっている。"}, {"t": 43.983333333333334, "x": "容疑者として名前の挙がった人はいた。"}, {"t": 46.333333333333336, "x": "ただ、その人が毒物混入で\n起訴されたことは、一度も無い。"}, {"t": 50.266666666666666, "x": "今回は、この事件を最初から順番に追いかける。"}, {"t": 53.36666666666667, "x": "1982年、シカゴのタイレノール毒物混入事件だ。"}, {"t": 57.416666666666664, "x": "先に断っておく。"}, {"t": 58.766666666666666, "x": "この回では、誰かを犯人だと決めない。"}, {"t": 61.266666666666666, "x": "起訴されていない人を、犯人としては扱わない。"}, {"t": 64.26666666666667, "x": "毒の入れ方も話さない。"}, {"t": 66.03333333333333, "x": "それは、そうしてほしいわ。"}, {"t": 67.8, "x": "もうひとつ。"}, {"t": 68.65, "x": "この事件のあと、薬の包み方が世界中で変わった。"}, {"t": 72.13333333333334, "x": "いま日本の薬局で買う薬にも、その痕が残っている。"}, {"t": 75.65, "x": "箱に巻いてあるフィルムと、瓶の口のアルミだ。"}, {"t": 78.55, "x": "あれって、そういう理由だったの。"}, {"t": 80.6, "x": "そういう理由だ。"}, {"t": 81.63333333333334, "x": "最後に、その話までいく。"}, {"t": 84.18333333333334, "x": "時間の順に見ていく。"}, {"t": 85.63333333333334, "x": "1982年9月29日、水曜日の朝だ。"}, {"t": 89.33333333333333, "x": "午前6時33分。"}, {"t": 90.98333333333333, "x": "エルクグローブビレッジの消防署に、\n救急の要請が入った。"}, {"t": 94.55, "x": "出動の記録には、こう書かれている。"}, {"t": 96.88333333333334, "x": "「娘が気を失ったので救急車を\nお願いしたい、と通報者が要請」"}, {"t": 101.0, "x": "家の名前は、ケラーマン。"}, {"t": 102.55, "x": "倒れたのは、12歳のメアリー・ケラーマンさんだ。"}, {"t": 105.65, "x": "その朝に、何があったの。"}, {"t": 107.53333333333333, "x": "父親が、あとになってこう話している。"}, {"t": 109.96666666666667, "x": "「娘が洗面所に入る音がした。"}, {"t": 112.01666666666667, "x": "ドアが閉まる音がした。そのあと、\n何かが落ちる音がした」"}, {"t": 115.7, "x": "「私はドアの前に行って、メアリー、\n大丈夫かと呼びかけた。返事は無かった」"}, {"t": 120.36666666666666, "x": "警察が着いたのが、5分後の6時38分。"}, {"t": 123.48333333333333, "x": "病院で死亡が確認されたのが、午前9時56分だ。"}, {"t": 127.2, "x": "のどが痛いって言っただけなのに。"}, {"t": 129.23333333333332, "x": "その朝に飲んだのは、大人用の強い\n方のタイレノールだった。"}, {"t": 132.78333333333333, "x": "カプセルの薬だ。粉の入った、\n二つに割れる形のものだな。"}, {"t": 137.05, "x": "そうよね。薬は疑わないわ。"}, {"t": 139.16666666666666, "x": "この時点では、誰も薬を疑っていない。"}, {"t": 141.85, "x": "12歳の子が急に亡くなったのだから、\n病気だと考える。"}, {"t": 145.46666666666667, "x": "その日のうちに、同じことが別の家でも起きる。"}, {"t": 148.98333333333332, "x": "同じ9月29日。"}, {"t": 150.55, "x": "場所はアーリントンハイツ。さっきの町の、すぐ隣だ。"}, {"t": 153.88333333333333, "x": "午後1時33分、また救急の要請が入った。"}, {"t": 157.21666666666667, "x": "倒れたのは、27歳のアダム・ヤヌスさん。"}, {"t": 160.0, "x": "郵便局で働いていた方だ。"}, {"t": 162.1, "x": "午後3時15分、病院で亡くなった。"}, {"t": 164.68333333333334, "x": "まだ27歳。"}, {"t": 165.96666666666667, "x": "家族が、この家に集まった。"}, {"t": 167.91666666666666, "x": "突然のことだったから、みんなで来たわけだな。"}, {"t": 170.81666666666666, "x": "その中に、弟のスタンリー・ヤヌスさんと、\nその奥さんのテレサさんがいた。"}, {"t": 175.51666666666668, "x": "二人はリズルという別の町に住んでいた。"}, {"t": 177.95, "x": "スタンリーさんは25歳。"}, {"t": 179.41666666666666, "x": "テレサさんは19歳だ。"}, {"t": 181.18333333333334, "x": "……何があったの。"}, {"t": 182.31666666666666, "x": "同じ家の中に、開いた\nタイレノールの瓶が置いてあった。"}, {"t": 185.58333333333334, "x": "二人は、そこから飲んだ。"}, {"t": 187.28333333333333, "x": "午後5時40分、スタンリーさんが倒れた。"}, {"t": 189.81666666666666, "x": "テレサさんも同じ症状になった。"}, {"t": 191.88333333333333, "x": "スタンリーさんは、\nその日の午後8時15分に亡くなった。"}, {"t": 195.33333333333334, "x": "テレサさんは、10月1日まで生きた。"}, {"t": 197.86666666666667, "x": "装置を外したのが、10月1日の午後1時15分だ。"}, {"t": 201.61666666666667, "x": "一つの家で、三人……。"}, {"t": 203.33333333333334, "x": "兄が亡くなった日に、弟と\n義理の妹が同じ瓶から飲んだ。"}, {"t": 207.16666666666666, "x": "残された弟のジョーさんは、のちにこう言っている。"}, {"t": 210.11666666666667, "x": "「あいつは俺の人生を奪った。"}, {"t": 211.73333333333332, "x": "俺の人生と、家族の人生を粉々にした」"}, {"t": 214.9, "x": "……そんなことって。"}, {"t": 216.08333333333334, "x": "この「三人」が、事件を見つける手がかりになる。"}, {"t": 219.31666666666666, "x": "同じ家で三人が続けて倒れたからだ。"}, {"t": 222.43333333333334, "x": "ここから、気づいた人の話をする。"}, {"t": 224.78333333333333, "x": "最初に薬にたどり着いたのは、\n警察でも医者でもない。"}, {"t": 228.18333333333334, "x": "非番の消防士が二人だ。"}, {"t": 230.03333333333333, "x": "消防士？"}, {"t": 230.9, "x": "エルクグローブビレッジ消防のリチャード・\nキーワースさん、当時39歳。"}, {"t": 235.1, "x": "それと、アーリントンハイツ消防のフィリップ・\nカパテリさんだ。"}, {"t": 238.6, "x": "キーワースさんは休みの日で、\n朝の救急要請を無線で聞いていた。"}, {"t": 242.51666666666668, "x": "ただ、そのときは気にも留めなかった。"}, {"t": 244.9, "x": "その夜、カパテリさんから電話がかかってきた。"}, {"t": 247.75, "x": "世間話だ。"}, {"t": 248.8, "x": "カパテリさんの義理の母親が、亡くなった\n12歳の子の母親と、同じ職場で働いていた。"}, {"t": 254.58333333333334, "x": "町が小さいのね。"}, {"t": 255.96666666666667, "x": "その電話で、アーリントンハイツで\n一家三人が倒れた話が出た。"}, {"t": 259.8333333333333, "x": "カパテリさんが言ったのが、この一言だ。"}, {"t": 262.4166666666667, "x": "「その話、どこかで聞いた話に似ている」"}, {"t": 265.06666666666666, "x": "彼は自分の消防署に電話をかけて、\n朝の出動記録を読ませた。"}, {"t": 269.1666666666667, "x": "報告書には、その子が「直前にタイレノールを\n飲んでいた」と書かれていた。"}, {"t": 273.81666666666666, "x": "……両方に、同じ薬。"}, {"t": 275.53333333333336, "x": "そういうことだ。"}, {"t": 276.53333333333336, "x": "キーワースさんは、のちにこう話している。"}, {"t": 278.93333333333334, "x": "自分でも誇らしいが、あれは偶然と、\n知りたがりの性分のおかげだ、と。"}, {"t": 283.48333333333335, "x": "世間話から、だったのね。"}, {"t": 285.53333333333336, "x": "この電話が無ければ、九月三十日の朝は来ていない。"}, {"t": 289.5, "x": "もう一人、同じ夜に気づいた方がいる。"}, {"t": 292.01666666666665, "x": "ヘレン・ジェンセンさん。"}, {"t": 293.18333333333334, "x": "アーリントンハイツの、村でただ\n一人の公衆衛生の担当者だ。"}, {"t": 297.1333333333333, "x": "看護師の方だな。"}, {"t": 298.43333333333334, "x": "ヤヌス家を調べてくれと言われて、その家に入った。"}, {"t": 301.55, "x": "洗面所に、開けられたタイレノールの瓶があった。"}, {"t": 304.3833333333333, "x": "そばに、その日の日付のレシートも落ちていた。"}, {"t": 307.3, "x": "その日に買った薬だったのね。"}, {"t": 309.4, "x": "彼女は、中身を数えた。"}, {"t": 311.2, "x": "減っているカプセルは六つ。"}, {"t": 312.8333333333333, "x": "ところが、倒れたのは三人だ。"}, {"t": 315.01666666666665, "x": "合わないじゃない。"}, {"t": 316.05, "x": "合わない。だから彼女は、薬そのものを疑った。"}, {"t": 319.2, "x": "そして、こう言った。"}, {"t": 320.55, "x": "「タイレノールよ」"}, {"t": 321.45, "x": "ただ、その場では取り合ってもらえなかった。"}, {"t": 323.96666666666664, "x": "本人が、あとでこう話している。"}, {"t": 326.06666666666666, "x": "「あのときは、みんな私の話を鼻であしらった。"}, {"t": 328.95, "x": "看護師の、しかも女が気づくとは思わなかったのよ」"}, {"t": 332.35, "x": "ひどい話だわ。"}, {"t": 333.6333333333333, "x": "それでも彼女は、瓶を捜査員に渡した。"}, {"t": 336.3, "x": "そのうえで、製薬会社にも自分で電話をかけている。"}, {"t": 339.46666666666664, "x": "「棚のタイレノールを全部下げてくれと伝えた」"}, {"t": 342.2, "x": "一人で、そこまで。"}, {"t": 343.73333333333335, "x": "結果はこうだ。"}, {"t": 344.71666666666664, "x": "「午前10時までに、\nアーリントンハイツの全部の店から、\nタイレノールは棚から消えた」"}, {"t": 350.1166666666667, "x": "9月30日。"}, {"t": 351.3333333333333, "x": "午前2時45分に、血液の検査で、スタンリーさんと\nテレサさんから青酸が確認された。"}, {"t": 357.1666666666667, "x": "薬だという疑いが、ここで裏づけられた。"}, {"t": 359.8666666666667, "x": "そして午前10時、郡の検視局が記者会見を開いた。"}, {"t": 363.46666666666664, "x": "主任の毒物学者、マイケル・\nシェイファーさんの言葉だ。"}, {"t": 366.96666666666664, "x": "「強い方のタイレノールの容器二つから、\n青酸を確かに確認した。"}, {"t": 371.01666666666665, "x": "五十カプセル入りの瓶だ」"}, {"t": 372.8, "x": "公に出たのが、そこなのね。"}, {"t": 374.93333333333334, "x": "会見では、住民に飲まないよう呼びかけている。"}, {"t": 377.8, "x": "その日のうちに、二人が亡くなっている。"}, {"t": 380.23333333333335, "x": "メアリー・マクファーランドさん、\n31歳。午前3時15分。"}, {"t": 384.01666666666665, "x": "メアリー・ライナーさん、27歳。午前9時3分。"}, {"t": 387.3, "x": "ライナーさんは、四人目の子を\n産んだ一週間ほどあとだった。"}, {"t": 390.81666666666666, "x": "……一週間。"}, {"t": 391.73333333333335, "x": "マクファーランドさんは、職場の休憩室で倒れている。"}, {"t": 394.9, "x": "この二人が亡くなった時刻は、\n資料によって半日ほどずれている。"}, {"t": 398.8333333333333, "x": "9月29日の午後だと書いているものもある。"}, {"t": 401.55, "x": "だからここでは「29日の夜から\n30日の朝にかけて」と言っておく。"}, {"t": 406.26666666666665, "x": "警告のほうが、遅かったのね。"}, {"t": 408.48333333333335, "x": "はっきりしているのは、警告が出た\n朝には、もう手遅れだったということだ。"}, {"t": 413.4166666666667, "x": "ここからのシカゴの動きは、かなり早い。"}, {"t": 415.8666666666667, "x": "9月30日、警察の車と救急車が住宅地を回った。"}, {"t": 419.9166666666667, "x": "屋根に付いた拡声器から、同じ言葉を流し続けた。"}, {"t": 423.35, "x": "「タイレノールを飲まないでください」"}, {"t": 425.21666666666664, "x": "車で、町中に。"}, {"t": 426.78333333333336, "x": "市内では、警察官が一軒ずつ家を回って瓶を集めた。"}, {"t": 430.4166666666667, "x": "何か国語かのチラシも刷って配っている。"}, {"t": 432.95, "x": "市長のジェーン・バーンさんは、\n市内の店から全部下げると発表した。"}, {"t": 437.0833333333333, "x": "家にある分も捨ててくれ、と市民に言っている。"}, {"t": 439.76666666666665, "x": "48時間のうちに、そこまでやった。"}, {"t": 442.4, "x": "10月1日には、市の保健局が緊急の会議を開いた。"}, {"t": 446.21666666666664, "x": "職員が48時間以上ぶっ通しで、\nカプセルを手で開けて中を見た。"}, {"t": 450.6333333333333, "x": "全部、目で。"}, {"t": 451.76666666666665, "x": "機械が無いからな。"}, {"t": 453.01666666666665, "x": "10月4日には、シカゴ市議会が条例を可決している。"}, {"t": 456.46666666666664, "x": "開けられたら分かる包装を義務づける、という内容だ。"}, {"t": 459.6333333333333, "x": "もう決めたの。"}, {"t": 460.7, "x": "最初の死亡から、5日後だ。"}, {"t": 462.68333333333334, "x": "この時点では、国の規則はまだ何も出ていない。"}, {"t": 465.6666666666667, "x": "9月30日の夜には、イリノイ州の司法のトップ、\nタイ・ファーナーさんが捜査本部を作っている。"}, {"t": 471.6, "x": "最初は20人から25人。そこへ、一日に\n300件から400件の情報が入ってきた。"}, {"t": 477.45, "x": "ファーナーさんは、のちにこう言っている。"}, {"t": 479.55, "x": "「人が殺されるときは、たいていその人か、\nその人に似た誰かを殺すつもりがある」"}, {"t": 484.56666666666666, "x": "「これは完全に無差別だ。"}, {"t": 486.06666666666666, "x": "致死性の毒を流通に置いて、\n誰が倒れるかを見ているだけだ」"}, {"t": 489.8666666666667, "x": "まだ続くの？"}, {"t": 490.96666666666664, "x": "そして10月1日、7人目が見つかる。"}, {"t": 493.75, "x": "ポーラ・プリンスさん、35歳。"}, {"t": 495.8, "x": "航空会社の客室乗務員だった方だ。"}, {"t": 498.46666666666664, "x": "9月29日にシカゴ市内の薬局で買った\nタイレノールを、自宅で飲んでいた。"}, {"t": 503.18333333333334, "x": "10月1日の午後5時45分、部屋で見つかった。"}, {"t": 506.56666666666666, "x": "瓶から減っていたカプセルは、一つだけだった。"}, {"t": 510.1, "x": "ここで、一度まとめておく。"}, {"t": 511.8833333333333, "x": "亡くなった方の名前と年齢は、FBIが\n2012年に公表した一覧に合わせる。"}, {"t": 517.05, "x": "メアリー・ケラーマンさん、12歳。"}, {"t": 518.9666666666667, "x": "エルクグローブビレッジ。"}, {"t": 520.4, "x": "アダム・ヤヌスさん、27歳。"}, {"t": 522.4666666666667, "x": "アーリントンハイツ。"}, {"t": 523.6666666666666, "x": "スタンリー・ヤヌスさん、25歳。"}, {"t": 525.8833333333333, "x": "テレサ・ヤヌスさん、19歳。二人ともリズル。"}, {"t": 529.0833333333334, "x": "メアリー・ライナーさん、27歳。"}, {"t": 531.1333333333333, "x": "ウィンフィールド。"}, {"t": 532.0833333333334, "x": "メアリー・マクファーランドさん、\n31歳。エルムハースト。"}, {"t": 535.5166666666667, "x": "ポーラ・プリンスさん、35歳。シカゴ。"}, {"t": 538.4166666666666, "x": "一つの家から、三人も。"}, {"t": 540.45, "x": "FBIの文書には、こう書いてある。"}, {"t": 542.6833333333333, "x": "「七人全員が、1982年9月29日か、その直後に、"}, {"t": 547.35, "x": "青酸入りの強い方のタイレノールのカプセルを\n飲んだと判断された」"}, {"t": 551.2333333333333, "x": "この七人は、お互いを知らない。"}, {"t": 553.3166666666667, "x": "ヤヌス家の三人以外は、全員が別の場所で、\n別の店で買った薬を飲んでいる。"}, {"t": 558.45, "x": "それだけ。"}, {"t": 559.3333333333334, "x": "共通していたのは、飲んだ薬の名前だけだ。"}, {"t": 562.2166666666667, "x": "当時の州知事のジェームズ・\nトンプソンさんは、こう言った。"}, {"t": 565.5, "x": "「どこかに、頭のおかしい人間がいる」"}, {"t": 567.8666666666667, "x": "ウィンフィールドの警察署長のカール・\nソスタさんは、こうだ。"}, {"t": 571.35, "x": "「よほど手の込んだ、悪意のある\n人物が野放しになっている。"}, {"t": 574.65, "x": "相当な時間をかけたはずだ」"}, {"t": 576.6, "x": "年齢や住んでいた町は、資料に\nよって少しずつ違うものがある。"}, {"t": 580.4, "x": "この回は、FBIの一覧の数字で通す。"}, {"t": 583.85, "x": "入っていたのは、青酸カリだ。"}, {"t": 585.85, "x": "正しくは、シアン化カリウムという毒物だな。"}, {"t": 588.75, "x": "それって、飲んだらすぐなの。"}, {"t": 590.7, "x": "資料には、飲んでから15分以内に\n命に関わる、と書かれている。"}, {"t": 594.75, "x": "中身の粉が、抜かれて入れ替えられていた。"}, {"t": 597.4666666666667, "x": "それでいいわ。"}, {"t": 598.4166666666666, "x": "どうやったかは、この回では話さない。"}, {"t": 600.7166666666667, "x": "量の話も、ひとつだけにしておく。"}, {"t": 603.1166666666667, "x": "郡の検視局が調べたのは、ヤヌス家に\n残っていた44個のカプセルだ。"}, {"t": 607.7833333333333, "x": "シカゴの新聞が2022年にまとめた\n記事によると、そのうち4個だった。"}, {"t": 612.45, "x": "人が亡くなる量の三倍近い青酸が入っていた、とある。"}, {"t": 616.1666666666666, "x": "三倍。"}, {"t": 616.9166666666666, "x": "これが、公の機関が出した唯一の言い方だ。"}, {"t": 619.9333333333333, "x": "ミリグラムでいくつだった、という\n数字も世の中には出回っている。"}, {"t": 623.6166666666667, "x": "ただ、その数字は資料ごとに桁が違う。"}, {"t": 626.2333333333333, "x": "計算が合わないものもある。"}, {"t": 627.8166666666667, "x": "だから、ここでは言わない。"}, {"t": 629.5333333333333, "x": "合わない数字は、言わない。"}, {"t": 631.2666666666667, "x": "そうだ。"}, {"t": 631.8666666666667, "x": "ちなみに、44個のうち毒が入っていたのは4個だった。"}, {"t": 635.5333333333333, "x": "全部に入れたわけではない。"}, {"t": 637.0666666666667, "x": "飲んだ人が当たるかどうかは、完全に運だった。"}, {"t": 639.95, "x": "無差別、というのはそういう意味だ。"}, {"t": 642.0166666666667, "x": "もう一つ、厄介なことがある。"}, {"t": 644.05, "x": "この毒は、見ただけでは分からない。"}, {"t": 646.3333333333334, "x": "色が変わったりしないの。"}, {"t": 647.9166666666666, "x": "粉の見た目も、においも、ほとんど変わらない。"}, {"t": 650.7, "x": "最初に亡くなった12歳の子が、\n病気だと思われたのはそのためだ。"}, {"t": 654.7833333333333, "x": "家族も、医者も、疑いようがなかった。"}, {"t": 658.0333333333333, "x": "次は、どこで毒が入れられたかだ。"}, {"t": 660.2, "x": "普通に考えれば、作った工場を疑う。"}, {"t": 662.9833333333333, "x": "作るところで入れるのが、いちばん簡単だものね。"}, {"t": 666.05, "x": "ところが、そうではなかった。"}, {"t": 667.85, "x": "決め手は、瓶に印刷されていた管理番号だ。"}, {"t": 670.7333333333333, "x": "日本でいう製造ロット番号だな。\nいつ、どこで作った分かが分かる。"}, {"t": 674.8666666666667, "x": "毒の入っていた瓶の番号は、一種類ではなかった。"}, {"t": 678.1, "x": "最初に見つかったのがエムシー2880。\nほかにも二つの番号が確認されている。"}, {"t": 683.6, "x": "そして、この番号は同じ工場のものではなかった。"}, {"t": 686.7166666666667, "x": "当時、この薬を作っていた工場は二か所ある。"}, {"t": 689.6833333333333, "x": "ペンシルベニア州のフォートワシントン。"}, {"t": 691.7, "x": "それと、テキサス州のラウンドロックだ。"}, {"t": 694.2166666666667, "x": "州が違うじゃない。"}, {"t": 695.5166666666667, "x": "アメリカの北東の端と、南の真ん中だ。"}, {"t": 698.3666666666667, "x": "別々の工場で作られた瓶に、同じ毒が入っていた。"}, {"t": 701.9, "x": "工場の誰かがやったとすると、これが説明できない。"}, {"t": 705.1, "x": "作ってから店に並ぶまでにかかる\n日数も、合わなかった。"}, {"t": 708.65, "x": "だから捜査側は、こう結論を出した。"}, {"t": 711.1, "x": "毒は、工場を出たあと、店の棚の上で入れられた。"}, {"t": 714.3166666666667, "x": "見つかった店は、五つの町の六店舗だ。"}, {"t": 717.1, "x": "スーパーが二つ、薬局が二つ、食料品店が二つ。"}, {"t": 720.9, "x": "アーリントンハイツと、\nエルクグローブビレッジのスーパー。"}, {"t": 723.85, "x": "シャンバーグの薬局。"}, {"t": 725.1666666666666, "x": "シカゴ市内の薬局と、食料品店。"}, {"t": 727.75, "x": "それと、ウィンフィールドの食料品店だ。"}, {"t": 730.3666666666667, "x": "全部ばらばらの店。"}, {"t": 731.8166666666667, "x": "ばらばらだ。"}, {"t": 732.6333333333333, "x": "だから、誰かがそれぞれの店に行ったことになる。"}, {"t": 735.6833333333333, "x": "……戻したの。"}, {"t": 736.65, "x": "買って、家で中身を入れ替えて、\nまた棚に戻した、と見られている。"}, {"t": 741.3833333333333, "x": "ここからは、作っていた会社の話だ。"}, {"t": 743.9666666666667, "x": "ジョンソン・エンド・ジョンソン。"}, {"t": 745.5666666666667, "x": "日本でも名前を聞く会社だな。"}, {"t": 747.5833333333334, "x": "9月30日の午後、まず\n一つの番号の分だけを回収した。"}, {"t": 751.6166666666667, "x": "エムシー2880。9万3000本だ。"}, {"t": 754.6833333333333, "x": "次に、別の番号の17万1000本を足した。"}, {"t": 757.95, "x": "数だけ聞くと、けっこう出したように見えるけど。"}, {"t": 760.85, "x": "足りなかった。"}, {"t": 761.8, "x": "当時の経済誌によると、この薬は\n会社の利益の15から20パーセントを稼いでいた。"}, {"t": 767.0333333333333, "x": "それが、事件の直後に売り上げが8割落ちている。"}, {"t": 770.2666666666667, "x": "8割。"}, {"t": 771.1, "x": "全国の回収に踏み切るきっかけになったのは、\nカリフォルニアで起きた真似の事件だった。"}, {"t": 776.2166666666667, "x": "シカゴの外でも始まった、ということだ。"}, {"t": 778.8, "x": "10月5日、会社は全国のタイレノールを\n全部回収すると決めた。"}, {"t": 782.9666666666667, "x": "最初の死亡から、七日後だ。"}, {"t": 784.9833333333333, "x": "対象は3,100万本。"}, {"t": 786.6833333333333, "x": "店で売られる値段で、1億ドルを超えていた。"}, {"t": 789.5333333333333, "x": "1億ドル。"}, {"t": 790.5, "x": "当時の記事は、税引き前で\n1億ドルの負担になる見込みだと書いている。"}, {"t": 794.7, "x": "決めたのは、会長のジェームズ・\nバークさんという方だ。"}, {"t": 797.9166666666666, "x": "ただ、周りは反対していた。"}, {"t": 799.9, "x": "FBIも、薬を管理する国の役所も、\n全国回収には最初は難色を示している。"}, {"t": 805.5833333333334, "x": "なんで？"}, {"t": 806.3, "x": "全部下げたら、犯人の思う\nつぼになる、という考え方があった。"}, {"t": 810.3166666666667, "x": "それでも会社は下げた。"}, {"t": 811.8, "x": "バークさんは、あとでこう言っている。"}, {"t": 813.8, "x": "「世の中は、大きい会社であることをよく\n責める。だがこれは、大きさが役に立った例だ」"}, {"t": 819.05, "x": "下げたのね。"}, {"t": 820.0666666666667, "x": "無料の電話も二本引いた。"}, {"t": 821.75, "x": "一本は買った人向け、もう一本は\n報道向けで、毎日録音を差し替えた。"}, {"t": 826.4166666666666, "x": "カプセルを持ってきた人には、\n粉の入っていない錠剤と無料で取り替えた。"}, {"t": 830.7666666666667, "x": "1本あたり2ドル50セントまでの値引き券も配っている。"}, {"t": 834.7333333333333, "x": "事件から1か月と少しで、国が動いた。"}, {"t": 837.5833333333334, "x": "1982年11月5日。"}, {"t": 840.1833333333333, "x": "アメリカの官報に、食品医薬品局の規則が載った。"}, {"t": 843.9, "x": "官報って、法律のこと？"}, {"t": 845.85, "x": "法律ではない。役所が作る決まりだ。"}, {"t": 848.1666666666666, "x": "国が出す公式の新聞に載せる。"}, {"t": 850.4166666666666, "x": "中身は、市販薬の包装の義務づけだ。"}, {"t": 853.0333333333333, "x": "この規則の書き出しに、こう書いてある。"}, {"t": 855.4166666666666, "x": "「この措置は、シカゴ地域で七人の死者を出した\n悪意ある混入事件にかんがみ、"}, {"t": 859.8666666666667, "x": "包装の完全性と製品の安全を\n確保するために取られる」"}, {"t": 863.7166666666667, "x": "事件の名前が、そのまま理由に書いてあるのね。"}, {"t": 866.7333333333333, "x": "書いてある。"}, {"t": 867.5, "x": "求められたのは、破られたら見て分かる包装だ。"}, {"t": 870.45, "x": "規則の言葉では、こうなっている。"}, {"t": 872.6, "x": "「破られたり無くなったりしていれば、"}, {"t": 874.45, "x": "混入があったことの目に見える証拠を\n消費者に与えると合理的に期待できる、"}, {"t": 878.8, "x": "表示または侵入の障壁を備えた包装」"}, {"t": 881.5333333333333, "x": "それと、その仕掛けが何なのかを箱に書くこと。"}, {"t": 884.5333333333333, "x": "対象は、店で売る市販薬のほぼ全部だ。"}, {"t": 887.2666666666667, "x": "外されたのは、塗り薬と歯磨きと、\nインスリンの三つだけだった。"}, {"t": 891.55, "x": "ほとんど全部ね。"}, {"t": 892.7833333333333, "x": "この規則が実際に効き始めるのは、\n翌1983年の2月7日からだ。"}, {"t": 898.2, "x": "表示の義務が同じ年の5月5日。"}, {"t": 900.5166666666667, "x": "店の棚に残っている古い\n在庫の期限が、1984年の2月6日。"}, {"t": 905.5166666666667, "x": "三段階に分けてある。"}, {"t": 906.9833333333333, "x": "ちなみに、この「破られにくい包装」という\n言い方は、1998年に変わっている。"}, {"t": 912.6666666666666, "x": "「破られたら分かる包装」だ。"}, {"t": 914.6666666666666, "x": "言い方を変えただけ？"}, {"t": 916.0833333333334, "x": "役所の説明が、はっきりしている。"}, {"t": 918.4166666666666, "x": "「『破られたら分かる』という言葉は、その包装が\n破りにくい、あるいは破れないと示すのではなく、"}, {"t": 923.85, "x": "混入の痕跡に消費者が\n気づくことの大切さを正しく強調する」"}, {"t": 928.2333333333333, "x": "なるほど。"}, {"t": 929.0833333333334, "x": "守るのは包装ではなく、気づく\n人のほうだ、と言い直したわけだ。"}, {"t": 933.6666666666666, "x": "会社のほうも、同じ月に動いている。"}, {"t": 936.0833333333334, "x": "1982年11月11日。"}, {"t": 938.9166666666666, "x": "最初の死亡から、43日後だ。"}, {"t": 941.4, "x": "新しい包装が発表された。"}, {"t": 943.4833333333333, "x": "どんなものだったの。"}, {"t": 944.8666666666667, "x": "三つ重ねだ。"}, {"t": 945.8666666666667, "x": "まず、外の箱のふたを糊で貼る。"}, {"t": 947.9333333333333, "x": "開けたら紙が破れる。"}, {"t": 949.3833333333333, "x": "次に、瓶の首にプラスチックの輪をかぶせる。"}, {"t": 952.2, "x": "最後に、瓶の口の内側に、厚いアルミの膜を貼る。"}, {"t": 955.7166666666667, "x": "……いま家にある薬と、同じだわ。"}, {"t": 958.1666666666666, "x": "同じだ。ここから来ている。"}, {"t": 959.9333333333333, "x": "箱には、明るい黄色で注意書きも入れた。"}, {"t": 962.5333333333333, "x": "封が破れていたら使うな、という一文だ。"}, {"t": 965.2, "x": "安全の封のことは、六つある面のうち五つに書いた。"}, {"t": 968.4666666666667, "x": "この発表は、記者会見を\n29の都市に中継して行っている。"}, {"t": 972.4, "x": "フィラデルフィア、シカゴ、ロサンゼルス、\nワシントンからは、記者が直接質問できるようにした。"}, {"t": 978.2166666666667, "x": "会社が、そこまで表に出たのね。"}, {"t": 980.6, "x": "隠したら終わりだ、と考えたんだろう。"}, {"t": 982.9666666666667, "x": "売り上げの話も、しておく。"}, {"t": 984.8333333333334, "x": "事件の前、この薬は痛み止め\n市場の35パーセントを持っていた。"}, {"t": 989.05, "x": "事件の直後、8パーセントまで落ちている。"}, {"t": 991.7666666666667, "x": "そして1年たたないうちに戻った。"}, {"t": 993.9666666666667, "x": "ここは当時のニューヨーク・タイムズが\n1983年9月に書いた記事の数字だ。"}, {"t": 999.2166666666667, "x": "戻ったんだ。"}, {"t": 1000.2333333333333, "x": "会社の動きが早かったからだ、と\n当時の記事は書いている。"}, {"t": 1004.3666666666667, "x": "ここから、手紙の話に入る。"}, {"t": 1006.4833333333333, "x": "1982年10月6日。"}, {"t": 1008.8666666666667, "x": "ジョンソン・エンド・ジョンソンに、\n一通の手紙が届いていた。"}, {"t": 1012.5, "x": "のちに法廷で、判決文の中に全文が載っている。"}, {"t": 1015.95, "x": "……何が書いてあったの。"}, {"t": 1017.3666666666667, "x": "出だしが、こうだ。"}, {"t": 1018.6166666666667, "x": "「諸君。ご覧のとおり、店の棚に置いてある\nカプセルに青酸を入れるのは簡単だ」"}, {"t": 1023.3333333333334, "x": "そして、こう続く。"}, {"t": 1024.7166666666667, "x": "「この小さなカプセルの報道が\n気にならないなら、何もしなくていい」"}, {"t": 1028.5666666666666, "x": "「殺すのをやめさせたいなら、\n100万ドルを口座に振り込め」"}, {"t": 1031.9333333333334, "x": "銀行の名前と、口座番号まで書いてあった。"}, {"t": 1034.75, "x": "シカゴの銀行の、8449597番だ。"}, {"t": 1037.9333333333334, "x": "番号まで書いたの。"}, {"t": 1039.3166666666666, "x": "書いた。"}, {"t": 1039.95, "x": "最後は、こうだ。"}, {"t": 1041.1166666666666, "x": "「この手紙のことでFBIや\nシカゴの当局を巻き込もうとするな。"}, {"t": 1044.7166666666667, "x": "私が何本か電話をかければ、\nそちらのやることは全部無駄になる」"}, {"t": 1048.8166666666666, "x": "捜査側は、この手紙から二つのものを追いかけた。"}, {"t": 1051.95, "x": "一つは、その口座番号だ。"}, {"t": 1053.9333333333334, "x": "調べると、シカゴのある会社の経営者の口座だった。"}, {"t": 1057.0333333333333, "x": "1981年8月から翌年5月まで開いていた。"}, {"t": 1061.2, "x": "もう一つは、封筒の郵便料金だ。"}, {"t": 1063.7666666666667, "x": "切手じゃなくて？"}, {"t": 1064.9666666666667, "x": "料金メーターだ。会社が自分で\n料金を印字する機械だな。"}, {"t": 1068.6, "x": "その印字には、機械ごとの番号が入る。"}, {"t": 1071.1833333333334, "x": "そこから、シカゴのある会社の機械だと分かった。"}, {"t": 1074.1833333333334, "x": "この二つが、同じ一人の人物につながった。"}, {"t": 1077.3833333333334, "x": "え。"}, {"t": 1077.85, "x": "ただ、その口座の持ち主が書いたのではなかった。"}, {"t": 1081.5, "x": "1982年12月13日。"}, {"t": 1084.2833333333333, "x": "ニューヨーク市の公立図書館で、\n一人の男性が逮捕された。"}, {"t": 1087.95, "x": "そのとき読んでいたのは、二冊の資料だった。"}, {"t": 1090.6833333333334, "x": "『アメリカ南西部の新聞』と\n『アメリカの最大企業』だ。"}, {"t": 1094.3666666666666, "x": "逃げ先を探していたってこと？"}, {"t": 1096.4166666666667, "x": "そう読める、というだけだ。"}, {"t": 1097.8666666666666, "x": "書いてあるのはここまでだ。"}, {"t": 1099.4333333333334, "x": "逮捕された人は、ロバート・\nリチャードソンという名前を名乗っていた。"}, {"t": 1103.4, "x": "本名は、ジェームズ・ルイス氏だった。"}, {"t": 1105.75, "x": "ここから先を、はっきり言っておく。"}, {"t": 1107.8666666666666, "x": "この方が問われたのは、恐喝の未遂だ。"}, {"t": 1110.5, "x": "起訴状は一つだけ。毒物混入でも、殺人でもない。"}, {"t": 1114.3166666666666, "x": "手紙の罪だけ。"}, {"t": 1115.6333333333334, "x": "手紙の罪だけだ。"}, {"t": 1116.9333333333334, "x": "裁判は6日間で、陪審が有罪と判断した。"}, {"t": 1120.1, "x": "判決が出たのは、1984年6月14日。禁錮10年だ。"}, {"t": 1124.8666666666666, "x": "この裁判の記録には、こう書かれている。"}, {"t": 1127.3666666666666, "x": "「被告人が殺人で裁かれているのではないことは、\n十分に明らかにされていた」"}, {"t": 1132.1166666666666, "x": "裁判で争われたのは、手紙を出した目的だった。"}, {"t": 1135.4, "x": "検察は、金を取るためだと主張した。"}, {"t": 1137.9666666666667, "x": "弁護側は、金を取る気は無かったと主張した。"}, {"t": 1140.9, "x": "陪審は、検察の側を採った。"}, {"t": 1143.1833333333334, "x": "それでも、毒の話は出てこないのね。"}, {"t": 1145.7333333333333, "x": "出てこない。"}, {"t": 1146.55, "x": "本人は、手紙を書いて出したこと\n自体は否定していない。"}, {"t": 1149.9333333333334, "x": "ただ、目的は金ではなかったと主張した。"}, {"t": 1152.8, "x": "ある人物の不正な取引を\n表に出させたかったのだ、と述べている。"}, {"t": 1156.9, "x": "別に郵便を使った詐欺でも10年の判決を\n受けていて、二つは続けて執行された。"}, {"t": 1162.1666666666667, "x": "外に出たのは1995年。"}, {"t": 1164.35, "x": "逮捕から12年あまりだ。"}, {"t": 1166.2, "x": "それで、毒のほうは。"}, {"t": 1167.75, "x": "ずっと否定し続けた。"}, {"t": 1169.2666666666667, "x": "自分ははめられた、という\n内容のサイトまで作っている。"}, {"t": 1172.5333333333333, "x": "そして、毒物混入では最後まで起訴されていない。"}, {"t": 1175.7166666666667, "x": "2023年7月9日、マサチューセッツ州の自宅で\n亡くなった。76歳だった。"}, {"t": 1181.5666666666666, "x": "警察は、事件性は無いとしている。"}, {"t": 1184.0, "x": "……決まらないまま。"}, {"t": 1185.15, "x": "起訴されないまま、この方は亡くなった。"}, {"t": 1188.25, "x": "法律の話に戻る。"}, {"t": 1189.8, "x": "事件の前、アメリカには、この行為を\nきちんと罰する連邦の法律が無かった。"}, {"t": 1194.6166666666666, "x": "無かったの。"}, {"t": 1195.5666666666666, "x": "当時の大統領、ロナルド・レーガン氏が、\nそのことをはっきり書き残している。"}, {"t": 1200.2166666666667, "x": "法律に署名したときの声明だ。"}, {"t": 1202.35, "x": "「FBIはシカゴの惨事の捜査に深く\n関わっていたが、司法省はすぐに気づいた」"}, {"t": 1207.25, "x": "「こうした事件についての連邦の管轄には"}, {"t": 1209.6666666666667, "x": "疑いがあり、連邦法は製品への混入に\n軽い罪しか用意していなかった」"}, {"t": 1214.1, "x": "声明の書き出しは、こうだ。"}, {"t": 1215.9, "x": "「ちょうど一年前のいまごろ、この国は\nシカゴのタイレノールの悲劇に揺さぶられた」"}, {"t": 1220.4666666666667, "x": "「七人が、あの卑劣で忌まわしい\n製品混入によって命を失った」"}, {"t": 1224.6333333333334, "x": "この法案には、前の年にも一度動きがあった。"}, {"t": 1227.65, "x": "レーガン氏の声明に、そのことも書いてある。"}, {"t": 1230.2333333333333, "x": "「前の議会で、サーモンド議員は製品混入に\n厳しい連邦の罰を定める法案を上院で通した」"}, {"t": 1235.9, "x": "「残念ながら、その法案は"}, {"t": 1237.5166666666667, "x": "欠陥のある下院の法案に付け加えられ、私は\n1月にそれを認めないことが必要だと考えた」"}, {"t": 1243.6166666666666, "x": "一度は流れたんだ。"}, {"t": 1245.0666666666666, "x": "流れて、一年遅れた。"}, {"t": 1246.8166666666666, "x": "法案を出したのは、\nストロム・サーモンド議員という方だ。"}, {"t": 1250.2666666666667, "x": "1983年1月27日に提出。"}, {"t": 1253.6, "x": "共同提案者は59人。"}, {"t": 1255.45, "x": "上院を5月9日、下院を9月29日に通った。"}, {"t": 1259.05, "x": "そして1983年10月13日、\n連邦不正開封防止法として成立した。"}, {"t": 1264.9166666666667, "x": "どれくらいの罪になったの。"}, {"t": 1266.7, "x": "条文の数字を、そのまま言う。"}, {"t": 1268.6666666666667, "x": "未遂で、10年以下の拘禁と、\n2万5000ドル以下の罰金。"}, {"t": 1272.4166666666667, "x": "重い傷を負わせたときは、20年以下と10万ドル以下。"}, {"t": 1275.75, "x": "人が亡くなったときは、年数に上限が無い。"}, {"t": 1278.4666666666667, "x": "終身もありうる。罰金は10万ドル以下だ。"}, {"t": 1281.3, "x": "レーガン氏の声明は、こう締めている。"}, {"t": 1283.45, "x": "「これが連邦法に本物の牙を与え、"}, {"t": 1285.6, "x": "製品への混入を実際に\n思いとどまらせるものになると、我々は考えている」"}, {"t": 1290.3666666666666, "x": "ひとつ、間違えやすいところがある。"}, {"t": 1292.5166666666667, "x": "この法律に、包装の決まりは一行も無い。"}, {"t": 1295.25, "x": "包装は、さっきの役所の規則のほうだ。"}, {"t": 1298.0333333333333, "x": "二つで一組なのね。"}, {"t": 1299.6166666666666, "x": "罰と、包み方。事件のあと、別々に作られた。"}, {"t": 1303.9333333333334, "x": "三つの封をしても、終わらなかった。"}, {"t": 1306.1666666666667, "x": "1986年2月8日。"}, {"t": 1308.5666666666666, "x": "ニューヨーク州ピークスキルの、ダイアン・\nエルスロスさんという方が亡くなった。23歳だ。"}, {"t": 1313.95, "x": "飲んだのは、同じ強い\n方のタイレノールのカプセルだった。"}, {"t": 1317.3666666666666, "x": "……封は。"}, {"t": 1318.0666666666666, "x": "あった。"}, {"t": 1318.6333333333334, "x": "買った店はニューヨーク州ブロンクスビル。"}, {"t": 1320.7333333333333, "x": "開けたのは、滞在先の家の人だった。"}, {"t": 1323.3666666666666, "x": "国の役所は、27万400カプセルを調べている。"}, {"t": 1326.85, "x": "そこからは、毒は出なかった。"}, {"t": 1328.7833333333333, "x": "どこで入れられたのかは、分かっていない。"}, {"t": 1331.0666666666666, "x": "そして、その9日後だ。"}, {"t": 1332.9, "x": "1986年2月17日、月曜日。"}, {"t": 1336.3333333333333, "x": "ジョンソン・エンド・ジョンソンは、\n市販薬のカプセルをやめると発表した。"}, {"t": 1340.8, "x": "やめる。作るのを。"}, {"t": 1342.2166666666667, "x": "売るのも、作るのも全部だ。"}, {"t": 1344.0333333333333, "x": "当時、この薬の売り上げの3割がカプセルだった。"}, {"t": 1347.2, "x": "やめるのにかかる費用は、最大で\n1億5000万ドルと見込まれていた。"}, {"t": 1351.3166666666666, "x": "会長のジェームズ・\nバークさんの発表の言葉が、残っている。"}, {"t": 1355.05, "x": "「我々は、大きなためらいと\n重い心で、この決定をする」"}, {"t": 1358.6666666666667, "x": "「しかし、工場を出たあとのカプセルへの無差別な\n混入を我々が防げない以上、"}, {"t": 1363.0666666666666, "x": "カプセルを市場から下げることが、\n消費者に対する我々の務めだと考える」"}, {"t": 1367.8, "x": "同じときに、彼はこうも言っている。"}, {"t": 1369.9333333333334, "x": "「あとから振り返れば何でも見える。"}, {"t": 1371.7166666666667, "x": "カプセルの販売に戻らなければよかった」"}, {"t": 1374.4, "x": "戻らなければよかった……。"}, {"t": 1376.0, "x": "エルスロスさんのお母さんの言葉も、\n記録に残っている。"}, {"t": 1379.3333333333333, "x": "「三年、遅すぎたわ」"}, {"t": 1380.8666666666666, "x": "1982年のあの三日から、三年半だ。"}, {"t": 1384.3833333333334, "x": "形ごと、やめたのね。"}, {"t": 1386.1833333333334, "x": "カプセルという形そのものが、店から消えた。"}, {"t": 1389.7333333333333, "x": "この事件には、もう一人、名前の出た方がいる。"}, {"t": 1392.8166666666666, "x": "ロジャー・アーノルド氏。当時48歳だ。"}, {"t": 1395.4833333333333, "x": "1982年に事情を聴かれて、そのあと釈放されている。"}, {"t": 1399.6833333333334, "x": "起訴されなかったの。"}, {"t": 1401.1, "x": "タイレノールの件では、一度も起訴されていない。\nのちに容疑からも外れている。"}, {"t": 1405.5666666666666, "x": "ただ、この方の話には続きがある。"}, {"t": 1408.0333333333333, "x": "1983年6月、別の男性を\n撃って、殺人の罪に問われた。"}, {"t": 1413.0333333333333, "x": "警察は、自分を警察に売った人物だと\n取り違えたのだろう、と見ていた。"}, {"t": 1417.7166666666667, "x": "……関係のない人を。"}, {"t": 1419.0833333333333, "x": "この件では有罪になって、\n禁錮30年の判決を受けている。"}, {"t": 1422.9333333333334, "x": "弁護人は当時、取り違えの見立てを否定していた。"}, {"t": 1426.05, "x": "「それは事実からかけ離れている。"}, {"t": 1427.9166666666667, "x": "タイレノール事件で誰が\n情報提供者だったのか、我々は知らない」"}, {"t": 1431.9333333333334, "x": "私がこの話をしたのは、犯人に近い\n人がいた、と言いたいからではない。"}, {"t": 1436.55, "x": "逆だ。"}, {"t": 1437.2, "x": "名前が出るというのは、それだけで人の生活を壊す。"}, {"t": 1440.5333333333333, "x": "その人が本当にやったかどうかとは、別の話としてだ。"}, {"t": 1444.3166666666666, "x": "……そうね。"}, {"t": 1445.05, "x": "この事件では、44年のあいだに何人もの名前が出た。"}, {"t": 1448.6666666666667, "x": "そして、毒物混入で起訴された人は、一人もいない。"}, {"t": 1452.4166666666667, "x": "一人も。"}, {"t": 1453.3, "x": "一人もだ。"}, {"t": 1454.8, "x": "捜査は、止まってはいない。"}, {"t": 1456.45, "x": "2007年、新しい合同捜査班が作られた。"}, {"t": 1459.6, "x": "FBIが中心で、イリノイ州警察と、\n事件のあった四つの町の警察が入っている。"}, {"t": 1465.05, "x": "アーリントンハイツ、エルクグローブビレッジ、\nロンバード、シャンバーグだ。"}, {"t": 1468.7833333333333, "x": "シカゴ市警も協力している。"}, {"t": 1470.8166666666666, "x": "25年たってから、作り直したのね。"}, {"t": 1473.5333333333333, "x": "2009年2月4日、FBIシカゴ支局が文書を出している。"}, {"t": 1477.6, "x": "「FBIは、\nイリノイ州警察および複数の地元警察と協力し、"}, {"t": 1481.7, "x": "1982年のタイレノール殺人に関して集められた\n全証拠の完全な再検証を行っている」"}, {"t": 1488.0166666666667, "x": "理由も書いてある。"}, {"t": 1489.1166666666666, "x": "「鑑定技術の最近の多くの進歩を考えれば、"}, {"t": 1491.85, "x": "事件と回収された証拠をもう\n一度見直すのは当然のことであった」"}, {"t": 1495.9166666666667, "x": "そして、この一文が入っている。"}, {"t": 1498.0333333333333, "x": "「現在までのところ、この再検証によって\n刑事上の訴追が行われたことはない」"}, {"t": 1502.8333333333333, "x": "同じ日、FBIはマサチューセッツ州の住宅と\n貸倉庫を捜索している。"}, {"t": 1507.35, "x": "2010年1月には、裁判所の命令で\nDNAと指紋の提出が行われた。"}, {"t": 1512.5, "x": "一致したの。"}, {"t": 1513.55, "x": "しなかった。"}, {"t": 1514.4166666666667, "x": "瓶から取れたDNAは、\n提出されたものと一致していない。"}, {"t": 1518.0666666666666, "x": "2012年、事件から30年のときにも、\nFBIは文書を出している。"}, {"t": 1522.6666666666667, "x": "「これまでに数百件の聞き取りを行い、\n証拠になりうる数千点を再検査した」"}, {"t": 1527.45, "x": "同じ文書に、捜査班が何を\n任されたのかも書いてある。"}, {"t": 1530.95, "x": "「長く休眠していた捜査のすべての面を見直すこと」"}, {"t": 1534.1666666666667, "x": "「証人の聞き直し、すべての書類と"}, {"t": 1536.4666666666667, "x": "証拠品の電子化、そして、これまで\n使えなかった新しい鑑定に物証をかけること」"}, {"t": 1541.6166666666666, "x": "一から、やり直したのね。"}, {"t": 1543.5166666666667, "x": "この捜査班は、連邦の連続殺人の法律に\n基づいて、FBIが束ねている。"}, {"t": 1548.6833333333334, "x": "2013年、事件は\nアーリントンハイツ警察に引き継がれた。"}, {"t": 1552.5, "x": "2022年、40年の節目に、\nそこの巡査部長がこう話している。"}, {"t": 1557.0833333333333, "x": "「我々はこれを、連続殺人の殺人事件として、\nいまも実際に捜査している」"}, {"t": 1562.0833333333333, "x": "「40年たって、この犯罪で誰も起訴されていない」"}, {"t": 1565.2833333333333, "x": "「毒の入っていない錠剤も、入っていた錠剤も、\n瓶も箱も、中の綿も、我々は持っている」"}, {"t": 1571.3166666666666, "x": "全部、取ってあるのね。"}, {"t": 1572.9333333333334, "x": "取ってある。"}, {"t": 1573.8166666666666, "x": "いまも続いているのね。"}, {"t": 1575.35, "x": "2025年の時点でも、起訴された人はいない。"}, {"t": 1579.1333333333334, "x": "ここから、日本の話をする。"}, {"t": 1581.1666666666667, "x": "1984年3月。"}, {"t": 1583.2666666666667, "x": "シカゴの事件から、1年半後だ。"}, {"t": 1585.6166666666666, "x": "日本で、食品会社を狙った脅迫事件が始まった。"}, {"t": 1589.2, "x": "グリコ・森永事件だ。\nこのチャンネルでも一度扱っている。"}, {"t": 1593.0666666666666, "x": "お菓子に毒を入れて、店に置いたやつね。"}, {"t": 1595.6666666666667, "x": "青酸入りの菓子が、実際に店頭で見つかっている。"}, {"t": 1598.8666666666666, "x": "狙われた会社がどうなったかは、\n1987年の国会に記録が残っている。"}, {"t": 1604.1, "x": "食品産業センターの理事長が、\n参考人として数字を挙げている。"}, {"t": 1608.1666666666667, "x": "会社の名前は\n伏せて、ある菓子会社、という言い方だ。"}, {"t": 1611.55, "x": "1984年9月12日に、1億円を\n要求する脅迫状が一通届いた。"}, {"t": 1617.0333333333333, "x": "20日に新聞が報じて、そこから全国の報道になった。"}, {"t": 1620.7166666666667, "x": "その年の10月の売り上げは、\n前の年の同じ月から6割減った。"}, {"t": 1625.0333333333333, "x": "6割。"}, {"t": 1625.8333333333333, "x": "11月は、100億円あった\n月の売り上げが、70億円ほど減っている。"}, {"t": 1630.3833333333334, "x": "スーパーとデパートからは、商品が全部撤去された。"}, {"t": 1633.55, "x": "工場の生産は半分になった。"}, {"t": 1635.5666666666666, "x": "パートの従業員450人が自宅待機になり、\nそのあと全員解雇された。"}, {"t": 1640.3666666666666, "x": "1か月の損失は10億円を\n超えた、と理事長は述べている。"}, {"t": 1643.9666666666667, "x": "ボーナスは2割カット。"}, {"t": 1645.25, "x": "支給日も10日遅れた。"}, {"t": 1646.85, "x": "3年たっても、業績は事件の前の水準に戻らなかった。"}, {"t": 1650.8166666666666, "x": "……毒を入れられた側が、そこまで。"}, {"t": 1653.0166666666667, "x": "入れた側は、捕まっていない。"}, {"t": 1654.85, "x": "ここで、はっきりさせておきたいことがある。"}, {"t": 1657.3166666666666, "x": "この二つの事件は、似ている。"}, {"t": 1659.3166666666666, "x": "店に並んでいる商品に毒が入る。"}, {"t": 1661.45, "x": "誰が食べるか分からない。"}, {"t": 1662.85, "x": "犯人が分からない。"}, {"t": 1664.1833333333334, "x": "ただ、私は「日本の事件が\nアメリカの真似だ」とは言わない。"}, {"t": 1668.1333333333334, "x": "言えないの？"}, {"t": 1669.0, "x": "裏が取れないからだ。"}, {"t": 1670.3166666666666, "x": "私は、日本の国会の記録を1982年から全部あたった。"}, {"t": 1674.8333333333333, "x": "「タイレノール」という言葉が国会に\n出てくるのは、全部で7回だけだ。"}, {"t": 1679.0666666666666, "x": "そして、いちばん古いのが1987年9月2日だった。"}, {"t": 1683.45, "x": "事件のときは、一度も出ていない。"}, {"t": 1685.6833333333334, "x": "出ていない。1982年から1986年まで、ゼロだ。"}, {"t": 1690.4166666666667, "x": "当時の報道で、二つを並べたものは一つ見つけた。"}, {"t": 1693.8, "x": "1985年10月27日、アメリカの通信社が\n東京発で出した記事だ。"}, {"t": 1699.35, "x": "日本で起きていた別の飲み物への毒物混入を\n伝える中で、こう書いている。"}, {"t": 1703.9, "x": "「今回の事件は、1982年にアメリカで七人が\n青酸入りのタイレノールのカプセルを飲んで死亡し、"}, {"t": 1710.1333333333334, "x": "全国的な不安を引き起こして開封防止容器に\nつながった、よく似た事態を思い起こさせる」"}, {"t": 1715.7, "x": "同じ記事は、こうも書いている。"}, {"t": 1717.5666666666666, "x": "「タイレノールの事件では、\nこの人気の痛み止めのカプセル製品が\nすべて全米の店頭から回収されたが、"}, {"t": 1723.45, "x": "犯人は特定されなかった」"}, {"t": 1725.35, "x": "ここまでだ。"}, {"t": 1726.3166666666666, "x": "そこは分けるのね。"}, {"t": 1727.6333333333334, "x": "「思い起こさせる」と書いた記事がある、という\n話であって、つながっているという話ではない。"}, {"t": 1733.4833333333333, "x": "日本の国会が、この事件の名前を\n口にするのは1987年だ。"}, {"t": 1738.2833333333333, "x": "法律を作る審議の中でだった。"}, {"t": 1740.4333333333334, "x": "流通食品への毒物の混入等の防止等に\n関する特別措置法。"}, {"t": 1744.85, "x": "長い名前ね。"}, {"t": 1745.9833333333333, "x": "中身は短い。店で売る食べ物に毒を\n入れたら罰する、という法律だ。"}, {"t": 1750.35, "x": "法案を出した側の趣旨説明が、記録に残っている。"}, {"t": 1753.7, "x": "「昭和59年3月、流通食品に毒物を\n混入することにより食品企業を恐喝した、"}, {"t": 1759.5, "x": "警察庁指定第114号事件が発生して以来」"}, {"t": 1762.8666666666666, "x": "「これを模倣した食品企業恐喝事件が\n頻発しております」"}, {"t": 1766.6333333333334, "x": "「このような流通食品への毒物の混入は、\n消費者たる国民全体に対する挑戦であります」"}, {"t": 1772.6, "x": "日本は日本で、真似が続いていたのね。"}, {"t": 1775.2333333333333, "x": "それが、この法律を作った理由だ。"}, {"t": 1777.5666666666666, "x": "1987年9月2日、衆議院の農林水産委員会。"}, {"t": 1781.95, "x": "食品産業センターの理事長が、\n参考人としてこう述べている。"}, {"t": 1785.8166666666666, "x": "「ちなみに、アメリカでは"}, {"t": 1787.2666666666667, "x": "1982年に鎮痛剤のタイレノール事件というのが\n起きまして、"}, {"t": 1791.2, "x": "青酸カリを混入したわけでありますけれども、\nこの犯人は今もって逮捕されておりません」"}, {"t": 1796.4166666666667, "x": "「しかし、実は七名の死者が\n出たわけでございまして、翌1983年に\n米国議会では法律改正が行われて、"}, {"t": 1803.85, "x": "重罰規定が導入されたというふうに承っております」"}, {"t": 1807.35, "x": "同じ日、弁護士の参考人は、こう言っている。"}, {"t": 1810.2333333333333, "x": "「例えばアメリカで起きたタイレノール事件が\n日本にすぐ波及するというような"}, {"t": 1814.1, "x": "環境がありますので、やはり臨機応変に\n法律で措置をするということが必要になる」"}, {"t": 1819.2333333333333, "x": "日本にも来る、と思っていたのね。"}, {"t": 1821.4833333333333, "x": "そう述べた方がいた、ということだ。"}, {"t": 1823.6666666666667, "x": "法案は1987年9月18日に参議院を通って、成立した。"}, {"t": 1828.7, "x": "公布が9月26日。"}, {"t": 1830.4333333333334, "x": "ただ、この法律には、包装の決まりが無い。"}, {"t": 1833.25, "x": "第三条にあるのは\n「努めなければならない」という言い方だけだ。"}, {"t": 1837.1166666666666, "x": "そして、もうひとつ。"}, {"t": 1838.55, "x": "この法律の対象から、薬が外されている。"}, {"t": 1841.5833333333333, "x": "……薬が？"}, {"t": 1842.45, "x": "第二条の定義に、はっきり書いてある。"}, {"t": 1844.8166666666666, "x": "「流通食品とは、公衆に販売される飲食物をいう」。\nそこから医薬品と医薬部外品が除かれている。"}, {"t": 1851.2166666666667, "x": "この点は、国会でも正面から聞かれている。"}, {"t": 1854.0, "x": "1987年9月17日、参議院の農林水産委員会。"}, {"t": 1858.4833333333333, "x": "刈田貞子議員の質問だ。"}, {"t": 1860.4166666666667, "x": "「アメリカで起きている例のタイレノールの事件で、"}, {"t": 1862.8166666666666, "x": "シアン化カリウムが混入されていたという\n事件がありましたでしょう」"}, {"t": 1866.3833333333334, "x": "「あれで七名死亡していますね。"}, {"t": 1868.1333333333334, "x": "あの手の事件だって起こり得るわけで」"}, {"t": 1870.2833333333333, "x": "「この今回の特別措置を食品にだけ\n限った理由は何ですか」"}, {"t": 1874.3166666666666, "x": "もっともな質問だわ。"}, {"t": 1875.8833333333334, "x": "答えたのは、法案を出した\n側の白川勝彦衆議院議員だ。"}, {"t": 1879.7833333333333, "x": "「医薬品であるとか\n医薬部外品というようなことになりますと、これは"}, {"t": 1883.5833333333333, "x": "別の法律がございまして\nきちんと管理をされております」"}, {"t": 1886.7333333333333, "x": "「こん包その他も医薬品あるいは医薬部外品等に\nふさわしいようにいろいろな"}, {"t": 1890.65, "x": "基準が定められている」"}, {"t": 1892.1666666666667, "x": "「あえて流通食品と\n同種にしなくてもいいのではないだろうか」"}, {"t": 1895.7, "x": "……薬は、別だからと。"}, {"t": 1897.4333333333334, "x": "これが、日本の公式の説明だ。"}, {"t": 1899.7166666666667, "x": "では、日本の包み方は誰が変えたのか。"}, {"t": 1902.4, "x": "同じ委員会で、\n農林水産省の食品流通局の責任者が説明している。"}, {"t": 1907.35, "x": "「ある菓子企業におきましては容器の開閉部に熱で"}, {"t": 1910.1, "x": "縮むシュリンク包装というようなものを\n採用いたしましたり」"}, {"t": 1913.3833333333334, "x": "「あるいは飲料企業では"}, {"t": 1914.5, "x": "開栓と同時にキャップが\n裂けまして復元不可能となるような\nプルトップキャップに転換する」"}, {"t": 1919.6666666666667, "x": "そして、こう続く。"}, {"t": 1921.05, "x": "「これらはそれぞれ\n相応のコストがかかるわけでございますが、"}, {"t": 1924.1333333333334, "x": "各企業におきましてみずからそのコストを吸収して」"}, {"t": 1927.4833333333333, "x": "会社が自分で。法律で決められたんじゃなくて。"}, {"t": 1930.5, "x": "法律ではない。"}, {"t": 1931.5, "x": "この責任者は、アメリカの方式を\n取り寄せていたことも述べている。"}, {"t": 1935.4333333333334, "x": "「アメリカにおきまして包装について\nこういうようないろいろな方式をそれぞれの実態に"}, {"t": 1940.0333333333333, "x": "応じて適用したらいいのではないかと」"}, {"t": 1942.0, "x": "「こういうようなことの検討などがなされて、私どもも\nそれを手に入れまして参考にいたしております」"}, {"t": 1948.1833333333334, "x": "終わりに、二つやっておく。"}, {"t": 1949.75, "x": "出どころの確認と、時間順の並べ直しだ。"}, {"t": 1952.7833333333333, "x": "まず出どころ。捜査については、"}, {"t": 1954.6, "x": "FBIシカゴ支局が2009年2月4日と\n2012年に出した公式の文書。"}, {"t": 1959.8833333333334, "x": "恐喝の裁判については、\n連邦第7巡回区控訴裁判所の1986年の判決文。"}, {"t": 1966.1166666666666, "x": "包装の規則は、1982年11月5日の連邦官報、\n第47巻50442ページ。"}, {"t": 1973.1, "x": "理由の欄に、この事件が書いてある。"}, {"t": 1975.5166666666667, "x": "法律は、アメリカ制定法集の97巻831\nページ、公法98の127号。"}, {"t": 1981.8, "x": "署名時の声明はレーガン大統領図書館。"}, {"t": 1984.4666666666667, "x": "被害者の氏名と年齢は、FBIシカゴ支局が\n2012年に公表した一覧に合わせてある。"}, {"t": 1990.2666666666667, "x": "日本側は、\n国立国会図書館の国会会議録検索システムから、"}, {"t": 1994.6166666666666, "x": "1987年9月2日の衆議院農林水産委員会と、\n9月10日・9月17日の参議院農林水産委員会。"}, {"t": 2002.7333333333333, "x": "法律の条文は、電子政府の法令検索だ。"}, {"t": 2005.6, "x": "詳しい対応は、リサーチのファイルに残してある。"}, {"t": 2008.6, "x": "全部、無料で読めるの？"}, {"t": 2010.3, "x": "読める。気になったところは、\n自分で開いてみてほしい。"}, {"t": 2013.5833333333333, "x": "ここまでを、日付だけで並べ直す。"}, {"t": 2015.9166666666667, "x": "1982年9月29日から10月1日、\nシカゴ周辺で七人。いちばん下は12歳。"}, {"t": 2022.3833333333334, "x": "毒は青酸カリ。\n店の棚の市販薬のカプセルに入っていた。"}, {"t": 2026.2333333333333, "x": "瓶の管理番号が別々だったため、\n工場での混入は消えた。"}, {"t": 2030.1, "x": "10月5日、3,100万本が棚から下りる。"}, {"t": 2033.1666666666667, "x": "11月5日、包装の規則。"}, {"t": 2035.3333333333333, "x": "11月11日、三つ重ねの封。"}, {"t": 2037.9666666666667, "x": "1983年10月13日、罰の法律。"}, {"t": 2041.5, "x": "1986年2月、カプセルという形が消える。"}, {"t": 2045.3333333333333, "x": "1987年9月18日、日本にも\n同じ種類の法律。薬は対象外。"}, {"t": 2051.1833333333334, "x": "物のほうは、ぜんぶ変わったわけね。"}, {"t": 2053.483333333333, "x": "変わった。"}, {"t": 2054.3333333333335, "x": "人のほうは？"}, {"t": 2055.383333333333, "x": "44年、起訴ゼロだ。"}, {"t": 2057.05, "x": "恐喝で有罪になった方はいる。\nそこは確定した事実だ。"}, {"t": 2060.8, "x": "毒物混入では一度も起訴されていない。"}, {"t": 2063.15, "x": "2023年、そのまま亡くなった。"}, {"t": 2065.85, "x": "……残ったのは名前だけ。"}, {"t": 2067.4333333333334, "x": "だからこの回は、誰も犯人として扱わなかった。"}, {"t": 2070.7, "x": "今度、薬局で箱を手に取ってみてくれ。"}, {"t": 2073.3, "x": "フィルムが巻いてある。"}, {"t": 2074.3333333333335, "x": "瓶の口にはアルミが貼ってある。"}, {"t": 2076.383333333333, "x": "破ると分かるやつね。"}, {"t": 2077.866666666667, "x": "あれは便利のためじゃない。"}, {"t": 2079.133333333333, "x": "七人のあとに付いたものだ。"}, {"t": 2081.116666666667, "x": "……知らずに毎日見てたわ。"}, {"t": 2082.8, "x": "私もそうだった。"}, {"t": 2084.0833333333335, "x": "物だけが先に変わって、始まりの一点は空いたままだ。"}, {"t": 2087.516666666667, "x": "44年前の秋、誰が、どの店の棚で、何をしたのか。"}, {"t": 2091.7, "x": "……そこが、まだ。"}, {"t": 2092.9666666666667, "x": "まだだ。"}, {"t": 2093.616666666667, "x": "あなたの見方を、コメントに置いていってくれ。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
