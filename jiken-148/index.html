<script>
const D={"name": "148", "file": "148_編集用", "dur": 2020.95, "segs": [], "subs": [{"t": 0.0, "x": "1935年10月9日、アメリカ東部のニュージャージー。"}, {"t": 3.966666666666667, "x": "州で一番上の裁判所が1本の判決を出した。"}, {"t": 7.133333333333334, "x": "裁判官は13人。有罪を取り消せと\n言った人は0人だった。"}, {"t": 11.283333333333333, "x": "13対0？何の裁判なの？"}, {"t": 13.616666666666667, "x": "3年前に起きたリンドバーグ愛児誘拐事件だ。"}, {"t": 16.5, "x": "大西洋を休まず飛んだ飛行家の、\n長男が連れ去られた。"}, {"t": 19.983333333333334, "x": "まだ1歳8か月の男の子だった。"}, {"t": 22.5, "x": "あの有名な飛行家の子どもが？"}, {"t": 24.516666666666666, "x": "そうだ。身代金の5万ドルは払われた。"}, {"t": 27.183333333333334, "x": "でも子どもは家に帰らなかった。"}, {"t": 29.133333333333333, "x": "2年半後に大工の男が捕まり、裁判で有罪になった。"}, {"t": 32.85, "x": "判決文は有罪の柱を3つ挙げている。"}, {"t": 35.483333333333334, "x": "家から出た1万4600ドル。"}, {"t": 37.55, "x": "脅迫状の筆跡。はしごの木だ。"}, {"t": 40.1, "x": "それだけそろえばもう決まりじゃないの？"}, {"t": 42.25, "x": "ところが判決文には、\n弁護側の言い分も書き写してある。"}, {"t": 45.85, "x": "銀行に2790ドルを預けた人物がいた。"}, {"t": 49.2, "x": "その人物の字は被告の字ではなかった。"}, {"t": 51.71666666666667, "x": "そこは検察側も争っていない。"}, {"t": 53.96666666666667, "x": "えっ、じゃあ預けたのは誰なの？"}, {"t": 56.0, "x": "最後まで見つかっていない。"}, {"t": 57.7, "x": "そんな人物がいたのに有罪なの？"}, {"t": 59.93333333333333, "x": "今回はこの事件を、\n1935年の判決文1本で読んでいく。"}, {"t": 64.46666666666667, "x": "足りない所は、FBIの公開記録と米国の公文書で補う。"}, {"t": 68.61666666666666, "x": "判決が認めたことと、弁護側が\n言ったことは分けて話す。"}, {"t": 72.51666666666667, "x": "判決文でどこまで分かるの？"}, {"t": 74.48333333333333, "x": "3本の柱とその間に残ったすき間までだ。"}, {"t": 77.43333333333334, "x": "まずは1932年3月1日の夜。"}, {"t": 80.35, "x": "2階の子ども部屋の窓からだ。"}, {"t": 82.95, "x": "1932年3月1日、\nニュージャージーのイーストアムウェル。"}, {"t": 86.98333333333333, "x": "飛行家リンドバーグの家は、\nホープウェルの町の外れにあった。"}, {"t": 90.43333333333334, "x": "敷地の広さが390エーカー。"}, {"t": 92.6, "x": "東京ドームおよそ34個分だ。"}, {"t": 94.96666666666667, "x": "広い所ね。町から離れて暮らしたかったの？"}, {"t": 98.11666666666666, "x": "FBIの記録は、世間の目を避けたかったと書いている。"}, {"t": 101.53333333333333, "x": "その夜8時ごろ、長男は\n2階の子ども部屋で寝かされた。"}, {"t": 105.08333333333333, "x": "10時ごろに子守りの女性が戻ると、ベッドは空だった。"}, {"t": 108.43333333333334, "x": "両親も家にいた。すぐに、家の中と周りが探された。"}, {"t": 112.13333333333334, "x": "部屋には何か残ってたの？"}, {"t": 113.98333333333333, "x": "窓の敷居に手紙が1通置いてあった。"}, {"t": 116.31666666666666, "x": "5万ドルを用意しろ。"}, {"t": 117.46666666666667, "x": "払い方はあとで知らせる。"}, {"t": 119.13333333333334, "x": "そういう中身だ。"}, {"t": 120.23333333333333, "x": "手紙の右下には丸を重ねた印が描いてある。"}, {"t": 123.41666666666667, "x": "差出人のしるしかしら？"}, {"t": 125.26666666666667, "x": "FBIが公開している実物の写真で、その印が見える。"}, {"t": 129.06666666666666, "x": "のちの裁判でこの1通は被告の字だとされた。"}, {"t": 131.96666666666667, "x": "筆跡の柱はこの敷居の手紙から始まっている。"}, {"t": 135.23333333333332, "x": "最初の1枚から裁判の争点だったのね。"}, {"t": 138.08333333333334, "x": "地元の警察が知らせを受け、\n州の警察が捜査を引き受けた。"}, {"t": 142.03333333333333, "x": "最初の夜に残った物は多くなかった。"}, {"t": 145.13333333333333, "x": "家の外には手作りのはしごが残されていた。"}, {"t": 147.86666666666667, "x": "FBIの記録では、2つの部分をつないで使っていた。"}, {"t": 151.36666666666667, "x": "そのつなぎ目の所で片方が割れていた。"}, {"t": 154.05, "x": "登るときか下りるときに壊れたってこと？"}, {"t": 156.55, "x": "記録はそう見ている。"}, {"t": 157.68333333333334, "x": "判決文にもその夜の話がある。"}, {"t": 160.03333333333333, "x": "父親のリンドバーグは、夜に\n木の割れる音を聞いていた。"}, {"t": 163.23333333333332, "x": "子ども部屋の床と敷居には泥の足跡があった。"}, {"t": 166.06666666666666, "x": "窓の下の地面にも足跡。でも大きさは測れなかった。"}, {"t": 169.71666666666667, "x": "指紋は？"}, {"t": 170.85, "x": "出ていない。部屋にも周りにも、血の跡は無かった。"}, {"t": 173.96666666666667, "x": "残ったのは、手紙が1通と割れたはしごと足跡だけだ。"}, {"t": 177.46666666666667, "x": "はしごは、州警察の巡査がその夜のうちに見つけた。"}, {"t": 180.91666666666666, "x": "その場で別の巡査に渡し、そこから\n警察の手元を離れていない。"}, {"t": 185.13333333333333, "x": "裁判まで3年近くあるわよ？"}, {"t": 187.23333333333332, "x": "判決文によると、はしごの番をする\n巡査が決まっていた。"}, {"t": 190.8, "x": "ワシントンで調べていた間は、\n毎晩金庫にしまわれた。"}, {"t": 194.2, "x": "朝に取り出してまた調べる。その繰り返しだ。"}, {"t": 197.18333333333334, "x": "はしごに専属の番人がいたのね。"}, {"t": 199.48333333333332, "x": "調べるために一度ばらされ、\n新しい木が1本足されてもいる。"}, {"t": 203.16666666666666, "x": "その変わり方も、全部説明がつくと判決は書いた。"}, {"t": 207.26666666666668, "x": "父親のチャールズ・リンドバーグは、\n国中で知られた飛行家だった。"}, {"t": 210.95, "x": "1927年5月に、大西洋を休まず飛び越えている。"}, {"t": 215.03333333333333, "x": "その人の子どもだから大騒ぎになったのね。"}, {"t": 217.81666666666666, "x": "FBIの記録も、何か月も新聞の1面だったと書く。"}, {"t": 221.56666666666666, "x": "3月2日、FBIの長官フーバーが州の警察に連絡した。"}, {"t": 225.8, "x": "司法省はできる限り手を貸すという申し出だ。"}, {"t": 228.6, "x": "FBIが捜査するんじゃないの？"}, {"t": 230.6, "x": "この時点では連邦が乗り出す根拠が無かった。"}, {"t": 233.38333333333333, "x": "FBIは、しばらく手伝う立場にとどまっている。"}, {"t": 236.45, "x": "3月11日の日付で州警察は尋ね人の紙を出した。"}, {"t": 240.36666666666667, "x": "上に大きくWANTEDの文字。"}, {"t": 241.95, "x": "写真は2枚並んでいる。"}, {"t": 243.55, "x": "連れ去られたのは、夜8時から10時の間と書いてある。"}, {"t": 246.88333333333333, "x": "年は20か月。髪は金色の巻き毛で、目は濃い青。"}, {"t": 250.36666666666667, "x": "あごの真ん中に、深いくぼみがあるとも書いてある。"}, {"t": 253.36666666666667, "x": "1歳8か月ってそういうことね。"}, {"t": 255.63333333333333, "x": "連絡の先は、\n州警察のトップのシュワルツコフか父親本人。"}, {"t": 259.7, "x": "知らせはすべて秘密にする、という1行も入っている。"}, {"t": 262.9166666666667, "x": "この紙は今も、ミネソタの歴史協会に残っている。"}, {"t": 266.35, "x": "家族は、とにかく早く帰ってきてほしかったはずよね。"}, {"t": 269.8, "x": "父親は友人を通して、\n犯人との話し合いを呼びかけていた。"}, {"t": 274.23333333333335, "x": "3月6日、2通目の手紙がリンドバーグに届いた。"}, {"t": 277.5, "x": "消印はニューヨークのブルックリンで、3月4日だ。"}, {"t": 280.55, "x": "中身は、要求額を7万ドルに上げるというものだった。"}, {"t": 284.1, "x": "上げてきたの？2万ドルも？"}, {"t": 286.01666666666665, "x": "そうだ。州知事はトレントンで会議を開いた。"}, {"t": 288.75, "x": "検察と警察それに国の役所の人が集まった。"}, {"t": 292.01666666666665, "x": "リンドバーグの弁護士は、私立探偵も雇っている。"}, {"t": 295.06666666666666, "x": "3月8日には3通目がその弁護士に届いた。"}, {"t": 298.1666666666667, "x": "今度は何て？"}, {"t": 299.28333333333336, "x": "家族が選んだ仲立ちの人は、\n受け入れないと書いてあった。"}, {"t": 302.75, "x": "代わりに新聞に返事を載せろという求めだ。"}, {"t": 305.51666666666665, "x": "新聞でやり取りするの？"}, {"t": 307.1166666666667, "x": "この事件では、新聞の広告欄が連絡の道になっていく。"}, {"t": 310.8666666666667, "x": "その同じ日に、ブロンクスで1人の元校長が動いた。"}, {"t": 314.9, "x": "ジョン・コンドン。ブロンクスに\n住む、元は学校の校長だった人だ。"}, {"t": 318.8666666666667, "x": "3月8日、地元の新聞に申し出を載せた。"}, {"t": 321.9, "x": "自分が間に立つ。身代金に1000ドルを足してもいい。"}, {"t": 325.3, "x": "知らない人が自分から名乗り出たの？"}, {"t": 327.6333333333333, "x": "そうだ。そして次の日、\n4通目の手紙がコンドンに届いた。"}, {"t": 331.5, "x": "あなたなら仲立ちとして認める、という中身だった。"}, {"t": 334.76666666666665, "x": "犯人が新聞を読んでたってこと？"}, {"t": 336.96666666666664, "x": "そう読める。リンドバーグもコンドンを仲立ちと認めた。"}, {"t": 340.1333333333333, "x": "3月10日ごろ、コンドンは7万ドルの現金を預かった。"}, {"t": 343.7, "x": "広告欄で相手と話すときの名前は、ジャフシーだ。"}, {"t": 347.0, "x": "変わった名前ね。こっそり話すための名前？"}, {"t": 349.8666666666667, "x": "FBIの記録には、暗号の名前として使ったとある。"}, {"t": 353.26666666666665, "x": "名前の由来までは記録に書いていない。"}, {"t": 355.6166666666667, "x": "書いてないことは言わないのね。"}, {"t": 357.43333333333334, "x": "判決文では、コンドンは\n父親の代理人と書かれている。"}, {"t": 360.9166666666667, "x": "そして2回、犯人らしい男と顔を合わせることになる。"}, {"t": 364.95, "x": "3月12日の夜8時半ごろ。"}, {"t": 367.23333333333335, "x": "コンドンの家に名前を言わない電話があった。"}, {"t": 369.6333333333333, "x": "続いてタクシーの運転手が、\n5通目の手紙を届けに来た。"}, {"t": 373.28333333333336, "x": "運転手は知らない男から手紙を渡されていた。"}, {"t": 376.3, "x": "手紙のリレーね。"}, {"t": 377.5, "x": "5通目の指示どおり、\n駅の近くの空き店の石の下に6通目があった。"}, {"t": 381.81666666666666, "x": "その指示で、コンドンはウッドローン墓地へ向かった。"}, {"t": 384.6, "x": "そこでジョンと名乗る男と会っている。"}, {"t": 386.8, "x": "顔を見たのね！"}, {"t": 387.95, "x": "見た。身代金の払い方について話し合った。"}, {"t": 391.03333333333336, "x": "男は、子どもを預かっている\n証拠の品を送ると約束した。"}, {"t": 394.76666666666665, "x": "裁判でのコンドンの証言には、こんなやり取りがある。"}, {"t": 397.85, "x": "あなたはドイツ人かと聞くと、\nスカンジナビア人だと答えた。"}, {"t": 401.56666666666666, "x": "本当かどうかは分からないわね。"}, {"t": 403.55, "x": "そうだな。コンドンは、会えば分かると言い続けた。"}, {"t": 406.46666666666664, "x": "1934年3月には、ジョンの声色を\nまねてレコードに吹き込んだ。"}, {"t": 411.05, "x": "ジョンのなまりや話し方を残すためだ。"}, {"t": 413.55, "x": "声までレコードに残したの？"}, {"t": 415.4, "x": "裁判では、そのレコードを\n法廷に出さなかったことも争われた。"}, {"t": 419.21666666666664, "x": "レコードはワシントンにある、と捜査員が答えている。"}, {"t": 422.81666666666666, "x": "3月16日、コンドンのもとに小包が届いた。"}, {"t": 426.15, "x": "中身は小さな寝間着と7通目の手紙だった。"}, {"t": 429.1666666666667, "x": "寝間着ってもしかして……"}, {"t": 430.71666666666664, "x": "あの夜に長男が着ていた物だ。"}, {"t": 432.6, "x": "父親が本物だと確かめた。"}, {"t": 434.7, "x": "判決文によると手紙にはこう書いてあった。"}, {"t": 437.35, "x": "身代金は7万ドル。寝間着は送る。"}, {"t": 439.75, "x": "新しく買えば3ドルかかるが。"}, {"t": 441.73333333333335, "x": "金は子どもに会う前に払え。"}, {"t": 443.53333333333336, "x": "払って8時間後に居場所を知らせる。"}, {"t": 445.8833333333333, "x": "先にお金を払えってことね。"}, {"t": 447.9, "x": "3月21日の8通目には、1年前から\n計画していたとあった。"}, {"t": 452.4166666666667, "x": "3月29日、子守りの女性が\n敷地の入り口近くで指カバーを見つけた。"}, {"t": 457.1, "x": "長男があの夜に着けていた物だ。"}, {"t": 459.3666666666667, "x": "指カバー？"}, {"t": 460.5, "x": "親指にはめる小さなカバーだ。"}, {"t": 462.25, "x": "作った人は、さびない物だと証言した。"}, {"t": 465.06666666666666, "x": "次の日の9通目は、要求を\n10万ドルに上げるとおどしてきた。"}, {"t": 469.03333333333336, "x": "また上げるの？"}, {"t": 470.15, "x": "この寝間着は後の裁判でも大事な物になる。"}, {"t": 472.96666666666664, "x": "盗んだ物として、\n罪の組み立ての中心に置かれたからだ。"}, {"t": 476.6, "x": "返したのだから盗みではない、と\n弁護側は争っている。"}, {"t": 479.96666666666664, "x": "その話は判決文の論点の所でまた取り上げる。"}, {"t": 483.9, "x": "4月1日の10通目は、金を明日の夜までに\nそろえろという指示だった。"}, {"t": 488.3333333333333, "x": "4月2日、11通目がまたタクシーの運転手から届いた。"}, {"t": 492.18333333333334, "x": "12通目は、ブロンクスの花屋の前の石の下にあった。"}, {"t": 495.8, "x": "また石の下なのね。"}, {"t": 497.3333333333333, "x": "その夜、コンドンはブロンクスの墓地で\nもう一度ジョンに会った。"}, {"t": 500.7, "x": "額を5万ドルに下げさせて金を渡した。"}, {"t": 503.3833333333333, "x": "7万ドルじゃなかったの？"}, {"t": 505.03333333333336, "x": "コンドンが話して下げさせた。"}, {"t": 506.9, "x": "引き換えに、受け取りの紙と13通目を渡された。"}, {"t": 510.1, "x": "13通目には子どもの居場所が書いてあった。"}, {"t": 512.7333333333333, "x": "マーサズ・ヴィニヤードの近くの、ネリーという船だ。"}, {"t": 515.6666666666666, "x": "じゃあすぐに迎えに行ったのよね？"}, {"t": 517.6, "x": "次の日に船を探した。でも見つからなかった。"}, {"t": 520.5833333333334, "x": "何度探しても、ネリーという船は出てこなかった。"}, {"t": 523.6833333333333, "x": "だまされたってこと……？"}, {"t": 525.1, "x": "ただ金には1つ手が打ってあった。"}, {"t": 527.2166666666667, "x": "判決文の言葉では、後で\n見分けがつく紙幣で払われた。"}, {"t": 530.8833333333333, "x": "FBIによると、5万ドルのうち\n4万ドルは金貨証券だった。"}, {"t": 534.8833333333333, "x": "金貨証券？"}, {"t": 536.0333333333333, "x": "金と引き換えられる当時のアメリカの紙幣だ。"}, {"t": 538.6666666666666, "x": "番号が控えてあるこの紙幣が、2年半後に効いてくる。"}, {"t": 542.7333333333333, "x": "ここからはつらい話になる。"}, {"t": 544.4833333333333, "x": "5月12日、トラックの手伝いの男性が、\n偶然に長男を見つけた。"}, {"t": 548.9833333333333, "x": "家から南東におよそ4.5マイル。"}, {"t": 551.0166666666667, "x": "隣のマーサー郡の林だった。"}, {"t": 553.2, "x": "じゃあずっと……"}, {"t": 554.3333333333334, "x": "判決文は、長男はずっと前に\n亡くなっていたと書いている。"}, {"t": 557.9166666666666, "x": "死因は頭のけがだった。"}, {"t": 559.3666666666667, "x": "様子はこれ以上は話さない。"}, {"t": 561.3, "x": "それでいいと思う。"}, {"t": 562.5, "x": "身代金を払ったあと、家族は船を何度も探していた。"}, {"t": 566.1, "x": "そのことだけは覚えておいてほしい。"}, {"t": 568.1666666666666, "x": "5万ドルを払っても帰ってこなかったのね。"}, {"t": 570.85, "x": "5月13日、大統領が\n国の捜査機関すべてに指示を出した。"}, {"t": 575.0166666666667, "x": "州の捜査に力を貸せ。"}, {"t": 576.5666666666667, "x": "取りまとめ役はFBIだ。"}, {"t": 578.3333333333334, "x": "5月23日、FBIはニューヨークの銀行に\n知らせを回した。"}, {"t": 582.3666666666667, "x": "身代金の紙幣が来たら、すぐに\n気づいてほしいという頼みだ。"}, {"t": 586.1333333333333, "x": "5月26日には、州警察が\n最大2万5000ドルの賞金を出した。"}, {"t": 590.85, "x": "手がかりは紙幣の番号だけだったの？"}, {"t": 593.2166666666667, "x": "あとは手紙とはしごだ。この3つが、ずっと残る。"}, {"t": 597.0333333333333, "x": "事件のそばでは別の事件も起きていた。"}, {"t": 599.45, "x": "事件から3日後の3月4日。"}, {"t": 601.4333333333333, "x": "ワシントンの裕福な女性が動いた。"}, {"t": 603.6833333333333, "x": "ガストン・ミーンズという男に、\n子どもを取り戻す手助けを頼んだ。"}, {"t": 607.6666666666666, "x": "その人は何者なの？"}, {"t": 609.35, "x": "以前、女性の夫のことを調べる\n仕事を請け負ったことがある男だ。"}, {"t": 613.3166666666667, "x": "ミーンズは犯人たちとつながれると言った。"}, {"t": 615.7333333333333, "x": "身代金は倍になったと言って、\n女性から10万ドルを受け取った。"}, {"t": 619.7833333333333, "x": "10万ドルも？"}, {"t": 620.9666666666667, "x": "4月17日まで、女性は毎日子どもが\n戻るのを待たされた。"}, {"t": 624.95, "x": "ミーンズは、犯人の頭はキツネと\n呼ばれる男だと話していた。"}, {"t": 628.95, "x": "キツネ？作り話っぽいわね。"}, {"t": 631.0833333333334, "x": "女性が金を返せと言っても返ってこなかった。"}, {"t": 633.8833333333333, "x": "FBIが調べると、キツネは\n資格を失った元弁護士だった。"}, {"t": 637.8333333333334, "x": "ミーンズは横領などで有罪になり、\n懲役15年を言い渡された。"}, {"t": 641.6, "x": "2人は、だます相談をした\n罪でも懲役2年になっている。"}, {"t": 645.3666666666667, "x": "子どもを心配する人の気持ちに、つけこんだのね。"}, {"t": 648.5833333333334, "x": "FBIは、こういううその手がかりも\n全部確かめるしかなかった。"}, {"t": 652.3666666666667, "x": "ネリーという船を探して、\n船の登録も何冊も調べている。"}, {"t": 656.15, "x": "アメリカ中で、何千もの手がかりを\n最後まで追ったという。"}, {"t": 660.1, "x": "1932年6月22日、アメリカで\n1本の連邦の法律ができた。"}, {"t": 665.2, "x": "連れ去った人を、州の境を越えて\n運ぶことを罪にする法律だ。"}, {"t": 669.35, "x": "それまで無かったの？"}, {"t": 670.7166666666667, "x": "この事件でも初めは、連邦が乗り出す根拠が無かった。"}, {"t": 674.2166666666667, "x": "法律は、身代金のために連れ去った\n人を運んだ場合が対象だ。"}, {"t": 678.3666666666667, "x": "罰は刑務所で年数は裁判所が決める。"}, {"t": 680.9, "x": "本文は、連邦議会の法律集の326ページに載っている。"}, {"t": 685.2, "x": "その法律でFBIが動けるようになったの？"}, {"t": 687.9833333333333, "x": "この事件でFBIの立場が\n決まったのは、1933年の秋だ。"}, {"t": 692.6333333333333, "x": "10月19日、国の側の捜査はFBIが\n一手に受け持つと発表された。"}, {"t": 697.3666666666667, "x": "その前の9月には、大統領のルーズベルトが\nフーバーに伝えていた。"}, {"t": 701.3, "x": "この事件の捜査は司法省にまとめるようにと。"}, {"t": 704.1833333333333, "x": "捜査の担当がばらばらだったのね。"}, {"t": 706.4333333333333, "x": "州警察とニューヨーク市警とFBI。"}, {"t": 708.6333333333333, "x": "3つが別々に動いていた。"}, {"t": 710.55, "x": "身代金の紙幣が見つかっても、\n知らせる先が3つあった。"}, {"t": 714.2833333333333, "x": "後で、3つの組織が一緒に調べる形に変えている。"}, {"t": 718.3333333333334, "x": "その間にはしごを調べ直す人がいた。"}, {"t": 720.8333333333334, "x": "アーサー・ケーラー。"}, {"t": 721.6166666666667, "x": "アメリカ農務省の、森林局の木の専門家だ。"}, {"t": 724.75, "x": "1933年の初めに捜査に呼ばれている。"}, {"t": 728.1, "x": "木の専門家がはしごで何を調べるの？"}, {"t": 730.6, "x": "まず、はしごをばらして、\n使われた木の種類を見分けた。"}, {"t": 733.95, "x": "道具でけずった跡も1本ずつ見ている。"}, {"t": 736.2666666666667, "x": "それとくぎの穴だ。"}, {"t": 737.65, "x": "くぎの穴？"}, {"t": 738.7833333333333, "x": "板に残ったくぎの穴の並び方を、細かく見ていった。"}, {"t": 742.2, "x": "そして、前に家の中で使われた木らしいと考えた。"}, {"t": 745.6333333333333, "x": "古い板を使い回して作ったってことね。"}, {"t": 748.3, "x": "ケーラーは、リンドバーグの家や\n木を作る工場にも足を運んだ。"}, {"t": 751.9333333333333, "x": "そして調べたことを報告書にまとめた。"}, {"t": 754.4166666666666, "x": "判決文によると男が捕まるずっと前のことだ。"}, {"t": 757.5166666666667, "x": "ケーラーは、木の一部を\nブロンクスの材木屋まで追っていた。"}, {"t": 760.95, "x": "捕まる前からブロンクスに行き着いてたの？"}, {"t": 763.55, "x": "そうだ。後でその材木屋が、\n被告の家の近くだと分かる。"}, {"t": 767.3666666666667, "x": "はしごの柱はここで地図の上の1点になった。"}, {"t": 770.8666666666667, "x": "紙幣の柱を動かしたのは、事件と\n関係のない大統領の命令だった。"}, {"t": 775.3333333333334, "x": "1933年4月5日に、\nルーズベルト大統領が出した命令だ。"}, {"t": 779.9666666666667, "x": "5月1日までに、金貨や金の延べ棒、\n金貨証券を銀行に渡せ。"}, {"t": 784.5666666666667, "x": "金貨証券って身代金の4万ドルの？"}, {"t": 787.3, "x": "そうだ。当時の張り紙には、\n大きな文字で5月1日とある。"}, {"t": 791.0833333333334, "x": "従わなければ罰金1万ドルか\n懲役10年。またはその両方だ。"}, {"t": 795.3666666666667, "x": "じゃあ、持ってる人はみんな銀行に持っていくのね。"}, {"t": 798.4166666666666, "x": "FBIは、この命令が\n捜査の大きな助けになったと書いている。"}, {"t": 802.2833333333333, "x": "命令の時点で、身代金の金貨証券の多くは\nまだ見つかっていなかった。"}, {"t": 806.7666666666667, "x": "だからFBIは、この金貨証券に\n力を入れて調べたという。"}, {"t": 810.7, "x": "普通の紙幣と見分けはつくの？"}, {"t": 812.7333333333333, "x": "張り紙によると、おもての番号と\n財務省の印が、黄色いインクで刷ってある。"}, {"t": 817.3333333333334, "x": "10ドル札と20ドル札が、事件の中心になった。"}, {"t": 820.7166666666667, "x": "そして締め切りの日、5月1日。"}, {"t": 823.05, "x": "ニューヨークの連邦準備銀行に、\nまとまった金貨証券が持ち込まれた。"}, {"t": 827.8666666666667, "x": "1933年5月2日、連邦準備銀行で\n身代金の紙幣が見つかった。"}, {"t": 833.3, "x": "10ドルの金貨証券が296枚、20ドルが1枚。"}, {"t": 837.1166666666667, "x": "前の日に、1回でまとめて預けられた物らしかった。"}, {"t": 840.55, "x": "預けた人の名前は分かるの？"}, {"t": 842.55, "x": "預け入れの紙が残っていた。"}, {"t": 844.2166666666667, "x": "名前はJ・J・フォークナー。"}, {"t": 845.7833333333333, "x": "住所は、ニューヨークの西149丁目と書いてあった。"}, {"t": 849.4, "x": "住所まで書いてあればすぐ見つかるでしょ？"}, {"t": 851.8, "x": "それがどれだけ調べても見つからなかった。"}, {"t": 854.3, "x": "FBIの記録も、この預け主は\n見つからなかったと書いている。"}, {"t": 858.25, "x": "うその名前と住所だったのかしら。"}, {"t": 860.45, "x": "そこは分からない。記録にあるのは、\n見つからなかった、までだ。"}, {"t": 864.2333333333333, "x": "額にも1つ引っかかる所がある。"}, {"t": 866.5, "x": "FBIの記録では、預け入れの紙の額は2980ドル。"}, {"t": 870.6666666666666, "x": "判決文では2790ドルと書かれている。"}, {"t": 873.9333333333333, "x": "数字が違うじゃない。"}, {"t": 875.3333333333334, "x": "違う。この回では、判決の話に\n判決文の2790ドルを使う。"}, {"t": 880.4, "x": "枚数から計算すると、2980\nドルになることも付け加えておく。"}, {"t": 885.0333333333333, "x": "そして判決文には、もう1つ大事なことが書いてある。"}, {"t": 888.5, "x": "この預け入れの紙の字は、被告の字ではなかった。"}, {"t": 891.7, "x": "最初に言ってた話ね。"}, {"t": 893.4, "x": "この預け入れの後も、捜査は\n紙幣の番号を追い続けた。"}, {"t": 897.4833333333333, "x": "1934年1月17日、\nFBIのニューヨーク事務所が手紙を出した。"}, {"t": 902.6, "x": "あて先は市内の銀行とその支店すべてだ。"}, {"t": 905.3166666666667, "x": "身代金の金貨証券を、とにかく\n見張ってほしいという頼みだった。"}, {"t": 909.5333333333333, "x": "前にも頼んでなかった？"}, {"t": 911.1833333333333, "x": "頼んでいた。今度は道具をつけた。"}, {"t": 913.3833333333333, "x": "2月には、身代金の紙幣の番号を\n並べた冊子を作り直した。"}, {"t": 917.55, "x": "冊子はお金を扱う人に1人ずつ配られた。"}, {"t": 920.4666666666667, "x": "銀行、食料品店、ガソリンスタンド、\n空港、百貨店、郵便局。"}, {"t": 925.3166666666667, "x": "街じゅうに配ったのね。"}, {"t": 926.9166666666666, "x": "持ち歩きやすいように、\n番号の範囲だけのカードも作った。"}, {"t": 930.3833333333333, "x": "銀行の人には何度も会って、\n気持ちが切れないようにした。"}, {"t": 933.9, "x": "それでも1934年8月20日までの7か月。"}, {"t": 937.65, "x": "連邦準備銀行に入った分の\nほかは、1枚も出てこなかった。"}, {"t": 941.6833333333333, "x": "7か月もゼロ？"}, {"t": 942.9833333333333, "x": "ところが8月20日からまた見つかり始めた。"}, {"t": 945.8833333333333, "x": "9月までに16枚。多くは\nヨークビルとハーレムの辺りだった。"}, {"t": 949.5833333333334, "x": "見つかるたびに、大きな地図に\n色つきのピンを刺していった。"}, {"t": 953.0666666666667, "x": "使った人の動きが地図に出てくるのね。"}, {"t": 955.6666666666666, "x": "紙幣が使われた店の多くは、\n町の小さな八百屋だった。"}, {"t": 959.15, "x": "そして使った男の見た目が、\nコンドンの話すジョンと合っていた。"}, {"t": 963.5833333333334, "x": "1934年9月15日、ニューヨークのガソリンスタンド。"}, {"t": 967.65, "x": "1人の男が、ガソリン5ガロンの代金に\n10ドルの金貨証券を出した。"}, {"t": 972.0, "x": "店員はその紙幣を怪しいと思った。"}, {"t": 974.3333333333334, "x": "それでどうしたの？"}, {"t": 975.5833333333334, "x": "男の車の番号を紙幣にそのまま書きつけた。"}, {"t": 978.7166666666667, "x": "紙幣に直接？"}, {"t": 980.0666666666667, "x": "そうだ。その紙幣はそのまま銀行に回った。"}, {"t": 982.9, "x": "9月18日の午後1時20分。"}, {"t": 985.2333333333333, "x": "銀行の窓口の人が身代金の番号に気づいた。"}, {"t": 988.5333333333333, "x": "支店の副支配人が、すぐに\nFBIのニューヨーク事務所へ電話した。"}, {"t": 992.65, "x": "紙幣の出どころをたどると、\nあのガソリンスタンドに行き着いた。"}, {"t": 996.1, "x": "車の番号の持ち主は、ブロンクスに住む男だった。"}, {"t": 999.5333333333333, "x": "名前はブルーノ・リチャード・ハウプトマン。"}, {"t": 1001.6166666666667, "x": "ここで初めて名前が出てくるのね。"}, {"t": 1003.8833333333333, "x": "2年半、手紙、はしご、番号しか無かった事件だ。"}, {"t": 1007.35, "x": "店員が書いた何文字かで、1人の名前に行き着いた。"}, {"t": 1010.75, "x": "店員さんのお手柄ね。"}, {"t": 1012.3333333333334, "x": "FBIの記録も注意深い店員と書いている。"}, {"t": 1015.1666666666666, "x": "その夜から男の家は見張られることになった。"}, {"t": 1018.55, "x": "9月18日の夜、国と地元の捜査員が\n男の家を一晩中見張った。"}, {"t": 1023.3666666666667, "x": "19日の朝9時ごろ、ジョンの特徴に\n近い男が家から出てきた。"}, {"t": 1027.5166666666667, "x": "止めてあった車に乗ったところで、\n3つの組織が取り押さえた。"}, {"t": 1031.4166666666667, "x": "その男がハウプトマンね。"}, {"t": 1033.2333333333333, "x": "そうだ。ドイツ生まれの大工で、\nアメリカに来て11年ほどだった。"}, {"t": 1037.1833333333334, "x": "身につけていた物から、身代金の20\nドルの金貨証券が出てきた。"}, {"t": 1041.5166666666667, "x": "家にあった靴も、身代金の20\nドル札で買った物だと分かった。"}, {"t": 1045.7833333333333, "x": "持ってるお金がもう身代金なのね。"}, {"t": 1048.1666666666667, "x": "その夜、タクシーの運転手が、\n5通目を渡した男だと名指しした。"}, {"t": 1052.4666666666667, "x": "少したって、コンドンも金を渡した\nジョンだと名指ししている。"}, {"t": 1056.0333333333333, "x": "前に作られたジョンの似顔絵とも、\nよく似ていたとFBIは書く。"}, {"t": 1059.9666666666667, "x": "顔も紙幣も合ってたのね。"}, {"t": 1061.7333333333333, "x": "ハウプトマンは、ほかにも身代金で\n買い物をしたことを認めた。"}, {"t": 1065.5833333333333, "x": "ただ、裁判でも事件そのものとの関わりは\n認めていない。"}, {"t": 1069.1333333333334, "x": "判決文によると被告の言い分は一貫していた。"}, {"t": 1072.1166666666666, "x": "現場に行ったことはない。"}, {"t": 1073.4333333333334, "x": "何も知らない。何も関わっていない。"}, {"t": 1075.9333333333334, "x": "じゃあ、身代金はどこで手に入れたって言ったの？"}, {"t": 1078.85, "x": "その答えが、家の中から出てきた金の話につながる。"}, {"t": 1083.0333333333333, "x": "捕まった次の日、家のガレージから\n1万3000ドルを超える金貨証券が出た。"}, {"t": 1087.7666666666667, "x": "FBIの記録には、ガソリン缶の中に\n隠された金貨証券の話もある。"}, {"t": 1092.5666666666666, "x": "ガソリン缶に紙幣？"}, {"t": 1094.0, "x": "ガレージにあった缶だ。"}, {"t": 1095.25, "x": "今はFBIが写真を公開している。"}, {"t": 1097.6333333333334, "x": "判決文がまとめた数字は1万4600ドルだ。"}, {"t": 1100.9833333333333, "x": "ガレージの床の下と、家の垂木に\n隠してあったと書いている。"}, {"t": 1104.7833333333333, "x": "垂木って屋根を支える木のこと？"}, {"t": 1106.9, "x": "そうだ。その垂木のくぼみの1つには、\n小さな拳銃もあった。"}, {"t": 1110.8166666666666, "x": "判決文は、これを有罪の柱の1本目に挙げている。"}, {"t": 1114.2166666666667, "x": "身代金を持っていて使っていたこと。"}, {"t": 1116.6833333333334, "x": "5万ドルのうち、1万4600ドルが家にあったのね。"}, {"t": 1120.3666666666666, "x": "残りの金がどこへ行ったのか、判決文は書いていない。"}, {"t": 1123.7, "x": "書いてあるのは見つかった金のことだけだ。"}, {"t": 1126.25, "x": "残りがどうなったかは、ここでは分からないのね。"}, {"t": 1129.1333333333334, "x": "分からないまま置いておく。"}, {"t": 1130.45, "x": "足すのは記録にある物だけだ。"}, {"t": 1132.4333333333334, "x": "家の中からは、金のほかにも見つかった物がある。"}, {"t": 1135.5666666666666, "x": "押し入れの中の1枚の板だ。"}, {"t": 1138.0666666666666, "x": "家の押し入れの板に、コンドンの住所と\n電話番号が書いてあった。"}, {"t": 1141.7333333333333, "x": "判決文はこれも被告の字だったと書いている。"}, {"t": 1144.6666666666667, "x": "仲立ちの人の住所を家に書いてたの？"}, {"t": 1147.15, "x": "そうだ。FBIの記録では、\n押し入れの戸の枠に走り書きされていた。"}, {"t": 1151.3666666666666, "x": "では、金の出どころについて被告は何と言ったか。"}, {"t": 1154.4, "x": "知人のフィッシュが置いていった物だ、という説明だ。"}, {"t": 1157.45, "x": "被告の話では、フィッシュはドイツに\n帰る前にそれを預けていった。"}, {"t": 1161.4, "x": "フィッシュは結核を患っていて、\n帰国して間もなく亡くなった。"}, {"t": 1165.25, "x": "じゃあ本人に聞くことはできないのね。"}, {"t": 1167.5333333333333, "x": "できない。判決は、この説明を信じられないと退けた。"}, {"t": 1171.25, "x": "裏づける物が少しも無いとも書いている。"}, {"t": 1173.8, "x": "どうしてそう言い切れるの？"}, {"t": 1175.35, "x": "判決は金の使い方を見ている。"}, {"t": 1177.5333333333333, "x": "身代金が払われる前、被告はお金に困っていた。"}, {"t": 1180.95, "x": "大工の仕事で暮らしていたと判決文は書く。"}, {"t": 1183.7666666666667, "x": "ところが払われた後、仕事をすっかりやめた。"}, {"t": 1186.5666666666666, "x": "そしてウォール街で、\nかなりの規模の株の取引を始めている。"}, {"t": 1190.2666666666667, "x": "急にお金持ちになったのね。"}, {"t": 1192.2166666666667, "x": "判決は暮らしの変わり方が、金を\n見つけたという時期より前だと見た。"}, {"t": 1196.4666666666667, "x": "フィッシュの話より先に、金があったということだ。"}, {"t": 1200.15, "x": "判決文には小さな紙幣の話も出てくる。"}, {"t": 1202.95, "x": "1933年11月26日、ある映画館の切符の窓口だ。"}, {"t": 1207.8833333333334, "x": "係の女性の証言では、ハウプトマンが\n40セントの切符を買った。"}, {"t": 1212.1666666666667, "x": "映画を見に来たのね。"}, {"t": 1213.5833333333333, "x": "出したのは5ドル札。"}, {"t": 1214.8333333333333, "x": "小さく8つ折りにたたんであった。"}, {"t": 1216.9666666666667, "x": "変わったたたみ方ね。"}, {"t": 1218.5166666666667, "x": "その紙幣は、ほかのお金と一緒に銀行へ預けられた。"}, {"t": 1221.8333333333333, "x": "次の日、警察の警部補がその紙幣を\n持って女性を訪ねてきた。"}, {"t": 1225.9666666666667, "x": "身代金の番号だったのね。"}, {"t": 1228.0, "x": "裁判で弁護側は別の客を証人に呼ぼうとした。"}, {"t": 1231.1, "x": "その客は釣り銭でもめたのに、\n女性に覚えられていなかった。"}, {"t": 1234.85, "x": "顔を覚える力が弱いって言いたかったのね。"}, {"t": 1237.55, "x": "裁判所は、この証言を\n関係がないとして認めなかった。"}, {"t": 1241.1333333333334, "x": "上の裁判所も、それで正しかったと判断している。"}, {"t": 1244.3833333333334, "x": "8つ折りの紙幣は、次の日に警察の手に渡った物だ。"}, {"t": 1247.9666666666667, "x": "そこが別の客の話とは違うと判決は書いた。"}, {"t": 1251.2666666666667, "x": "1枚のお札でここまで争うのね。"}, {"t": 1253.6, "x": "紙幣の柱は、何枚もの紙幣の積み重ねでできている。"}, {"t": 1257.1333333333334, "x": "次は2本目の柱、手紙の字だ。"}, {"t": 1260.1, "x": "脅迫状は、窓の1通から最後の1通まで13通あった。"}, {"t": 1263.9833333333333, "x": "FBIの記録では、捕まる前から\n筆跡の専門家が見ていた。"}, {"t": 1268.0166666666667, "x": "ほとんど全員が、同じ1人が書いたという意見だった。"}, {"t": 1271.45, "x": "書いた人の手がかりは？"}, {"t": 1273.0333333333333, "x": "ドイツ人で、アメリカにしばらく\n住んでいる人という見立てだ。"}, {"t": 1276.5166666666667, "x": "捕まった後、被告の字の見本が\n飛行機でワシントンへ運ばれた。"}, {"t": 1280.5166666666667, "x": "FBIの研究所が脅迫状と見比べた。"}, {"t": 1283.3833333333334, "x": "結果はどうだったの？"}, {"t": 1284.8166666666666, "x": "目立たない癖や書き方に、よく似た所が多いと出た。"}, {"t": 1288.2166666666667, "x": "裁判では検察側の専門家が何人も証言した。"}, {"t": 1291.5666666666666, "x": "13通は全部被告が書いたという証言だ。"}, {"t": 1294.3666666666666, "x": "その1人は、その結論は\nあらがえない、圧倒的だと言った。"}, {"t": 1298.2333333333333, "x": "反対の意見は無かったの？"}, {"t": 1300.0666666666666, "x": "被告は自分は書いていないと言った。"}, {"t": 1302.1666666666667, "x": "弁護側の専門家も1人同じ証言をした。"}, {"t": 1305.0333333333333, "x": "判事は陪審に、どちらを取るかは\n陪審が決めることだと伝えた。"}, {"t": 1309.0666666666666, "x": "何人対1人って感じね。"}, {"t": 1311.0166666666667, "x": "弁護側は、判事にこう言ってほしいと頼んでいた。"}, {"t": 1314.0166666666667, "x": "筆跡を見比べる証拠は、証拠として弱いものだと。"}, {"t": 1317.3333333333333, "x": "判事は言わなかった。"}, {"t": 1318.5, "x": "上の裁判所も、それを誤りではないとした。"}, {"t": 1322.0, "x": "判決文は筆跡の柱をこうまとめている。"}, {"t": 1324.75, "x": "手紙の言い回しとつづりの間違いには、\n共通の癖がある。"}, {"t": 1328.2166666666667, "x": "その癖が、被告が書いたと認めた本物の字にもある。"}, {"t": 1331.8166666666666, "x": "つづりの間違いまで同じなのね。"}, {"t": 1333.9166666666667, "x": "そしてこう続ける。"}, {"t": 1335.1833333333334, "x": "窓の敷居の手紙を書いた者が、子ども部屋に入った。"}, {"t": 1338.5166666666667, "x": "そう考えるほかないと判決文は書いた。"}, {"t": 1341.1666666666667, "x": "手紙を書いた人と、連れ去った人が同じってこと？"}, {"t": 1344.4833333333333, "x": "そうだ。判決はそこをつないでいる。"}, {"t": 1346.7333333333333, "x": "もう1つ現場には道具が落ちていた。"}, {"t": 1348.9333333333334, "x": "大工の道具箱に入っているような大きさの、のみだ。"}, {"t": 1352.2166666666667, "x": "のみって木をけずる道具ね。"}, {"t": 1353.95, "x": "被告の家にあった道具の一そろいからは、\nそののみが欠けていた。"}, {"t": 1357.8333333333333, "x": "FBIの記録には、はしごの道具の跡も\n被告の道具と合ったとある。"}, {"t": 1362.0833333333333, "x": "大工さんの道具と大工さんの仕事ってことね。"}, {"t": 1365.0, "x": "判決文はここで3本目の柱へ進む。"}, {"t": 1367.7, "x": "はしごの木だ。"}, {"t": 1369.3833333333334, "x": "判決文の3本目の柱はこう書いてある。"}, {"t": 1372.0666666666666, "x": "はしごの木の一部は、\n被告のブロンクスの家から取られた。"}, {"t": 1375.6666666666667, "x": "家の木を使ってたの？"}, {"t": 1377.2, "x": "FBIの記録では、はしごの木が\n屋根裏の床の板と合ったとある。"}, {"t": 1381.1833333333334, "x": "前に話した、使い回しの板の\nくぎの穴を思い出してほしい。"}, {"t": 1385.0333333333333, "x": "家の中で使われてた板らしいっていうあれね。"}, {"t": 1387.7666666666667, "x": "そうだ。そして、判決文が大事だと書く所がある。"}, {"t": 1391.2666666666667, "x": "捕まるずっと前に、ケーラーは\n木の一部を材木屋までたどっていた。"}, {"t": 1395.1166666666666, "x": "その材木屋は被告の家の近くだった。"}, {"t": 1397.7666666666667, "x": "捕まる前に家の近くまで来てたのね。"}, {"t": 1400.3, "x": "事件の後に被告が何日か足を\n引きずっていた、という証拠もある。"}, {"t": 1404.3833333333334, "x": "判決は、これも木の柱のすぐ後に並べて書いている。"}, {"t": 1407.8333333333333, "x": "家の壁にもはしごの跡が残っていた。"}, {"t": 1410.2, "x": "白いペンキがこすれて、下の灰色の石が見えていた。"}, {"t": 1413.6166666666666, "x": "はしごを立てかけた跡ね。"}, {"t": 1415.3, "x": "別の証人は、実際にそのはしごで\n2階の窓まで上り下りしてみせた。"}, {"t": 1419.6833333333334, "x": "子どもを連れて下りることもできた、という試しだ。"}, {"t": 1422.5333333333333, "x": "これで判決文の3本の柱がそろった。"}, {"t": 1425.2333333333333, "x": "紙幣と筆跡とはしごの木だ。"}, {"t": 1427.3333333333333, "x": "じゃあ裁判はどんなふうに進んだの？"}, {"t": 1430.05, "x": "1934年10月8日、\nハンタードン郡の大陪審が被告を起訴した。"}, {"t": 1435.0, "x": "ニューヨーク州は引き渡しを認め、\n被告は郡の拘置所に移された。"}, {"t": 1439.0666666666666, "x": "裁判は1935年1月2日、\nフレミントンの郡の裁判所で始まった。"}, {"t": 1444.4, "x": "どのくらい続いたの？"}, {"t": 1445.8666666666666, "x": "2月13日まで。6週間の裁判だ。"}, {"t": 1448.7666666666667, "x": "判決文も、大きな騒ぎの中の裁判だったと認めている。"}, {"t": 1452.55, "x": "法廷はどの日も人でいっぱいだった。"}, {"t": 1454.7666666666667, "x": "新聞社の使いの若者や助手が、\n法廷を走り回っていた。"}, {"t": 1458.7, "x": "落ち着いて裁判できるのかしら。"}, {"t": 1460.7333333333333, "x": "弁護側も後で法廷の混乱を問題にしている。"}, {"t": 1463.6666666666667, "x": "陪審員は、裁判所の向かいのホテルの3階に泊まった。"}, {"t": 1467.2166666666667, "x": "4人の係官がつき、食事は\n食堂の奥でついたての陰だった。"}, {"t": 1471.4666666666667, "x": "陪審員も大変ね。"}, {"t": 1473.0666666666666, "x": "父親のリンドバーグも、毎日法廷にいた。"}, {"t": 1475.65, "x": "証人でもあったからだ。"}, {"t": 1477.2333333333333, "x": "判事の説明が終わり、陪審が\n話し合いに入ったのは午前11時23分。"}, {"t": 1482.0, "x": "2月13日、評決が出た。"}, {"t": 1484.2, "x": "第1級の罪で有罪。終身刑に\nとどめるという意見も付かなかった。"}, {"t": 1488.55, "x": "つまり……"}, {"t": 1489.6833333333334, "x": "死刑の判決だ。弁護側は、\nすぐに上の裁判所へ訴えた。"}, {"t": 1494.25, "x": "上の裁判所での弁論は、6月20日まで延ばされた。"}, {"t": 1497.7166666666667, "x": "弁護側が頼んだからだ。"}, {"t": 1499.2333333333333, "x": "裁判の記録は、印刷すると10冊になった。"}, {"t": 1502.4666666666667, "x": "10冊！"}, {"t": 1503.6, "x": "弁護側の申し立ては、16の論点にまとめてあった。"}, {"t": 1507.0833333333333, "x": "最後の弁論は、弁護側が100\nページ、検察側が135ページ分ある。"}, {"t": 1511.9333333333334, "x": "論点ってどんなことを言ったの？"}, {"t": 1513.8833333333334, "x": "1つは裁判をする場所が違うという主張だ。"}, {"t": 1516.65, "x": "連れ去られたのはハンタードン郡。"}, {"t": 1518.3, "x": "見つかったのはマーサー郡。"}, {"t": 1519.9, "x": "判決は、けがをさせたのが\nどちらの郡でも起訴できると答えた。"}, {"t": 1523.8666666666666, "x": "法律の細かい話ね。"}, {"t": 1525.6833333333334, "x": "もう1つは罪の組み立てだ。"}, {"t": 1527.5166666666667, "x": "夜に家に押し入って物を盗む罪がある。"}, {"t": 1529.9166666666667, "x": "その最中に命が失われた、という\n組み立てで裁かれた。"}, {"t": 1533.5166666666667, "x": "盗んだ物とされたのがあの寝間着だ。"}, {"t": 1535.85, "x": "子どもじゃなくて寝間着？"}, {"t": 1537.3833333333334, "x": "当時の古い法の考えでは、連れ去りは\n重い罪の類に入らなかった。"}, {"t": 1541.6166666666666, "x": "でも物を盗むことは入る。だから\n寝間着が中心になった。"}, {"t": 1545.2, "x": "弁護側は、寝間着は返したのだから\n盗みではないと言った。"}, {"t": 1548.75, "x": "判決は、金をゆすり取る\n最初の一歩として使われたと退けた。"}, {"t": 1552.85, "x": "弁護人のライリー自身も、法廷で\n世紀の犯罪だと言っている。"}, {"t": 1557.2333333333333, "x": "16番目の論点が一番大きい。"}, {"t": 1559.45, "x": "評決は証拠の重さに反しているという主張だ。"}, {"t": 1562.5, "x": "証拠が足りないってこと？"}, {"t": 1564.1666666666667, "x": "そうだ。弁護側はいくつも並べている。"}, {"t": 1566.55, "x": "子ども部屋からも中の物からも、\n読み取れる指紋は1つも出ていない。"}, {"t": 1570.65, "x": "はしごからも、のみからも、手紙からもだ。"}, {"t": 1573.5, "x": "本当に指紋が無かったの？"}, {"t": 1575.3333333333333, "x": "弁護側の専門家は、指紋を見つけたと言っている。"}, {"t": 1578.4666666666667, "x": "ただしその中に被告の指紋は1つも無かった。"}, {"t": 1581.6166666666666, "x": "それって大事な話じゃない？"}, {"t": 1583.5, "x": "判決は指紋が無いことに意味は無いと答えた。"}, {"t": 1586.2666666666667, "x": "被告は自分で罪を重ねてきたと認めた男だ。"}, {"t": 1589.4166666666667, "x": "そういう人なら、跡を残さないよう\n気をつけるのが自然だと。"}, {"t": 1593.1, "x": "前の罪ってドイツでのこと？"}, {"t": 1594.9666666666667, "x": "そうだ。被告は、ドイツでの罪や\n刑務所からの逃走を認めていた。"}, {"t": 1599.1166666666666, "x": "アメリカにも、3回目でやっと\n不法に入ったと認めている。"}, {"t": 1602.6666666666667, "x": "弁護側はほかにも並べた。"}, {"t": 1604.3, "x": "現場の近くで見たという証人はうそだ。"}, {"t": 1606.7833333333333, "x": "木の専門家も信用できない。"}, {"t": 1608.5, "x": "声で見分けたという話も弱い。"}, {"t": 1610.5333333333333, "x": "判決は、近くで見たという証人の話を\n全部外しても、結論は同じだとした。"}, {"t": 1616.3666666666666, "x": "弁護側の答えの書面にはあの夜の話もある。"}, {"t": 1619.2833333333333, "x": "母親のアンの証言では、ベッドの掛け\n布は安全ピンでとまったままだった。"}, {"t": 1623.6833333333334, "x": "あわてた様子もどこにも無かったという。"}, {"t": 1626.0166666666667, "x": "乱暴に連れ出したなら跡が残りそうね。"}, {"t": 1628.55, "x": "弁護側はこう問うた。"}, {"t": 1629.7833333333333, "x": "どうしてその窓が子ども部屋だと分かったのか。"}, {"t": 1632.5, "x": "しかも、部屋で1つだけかぎがかからない窓だった。"}, {"t": 1635.8333333333333, "x": "外から来た人が知ってたのは変だってことね。"}, {"t": 1638.8333333333333, "x": "あの夜は、時速35マイルの強い風が吹いていた。"}, {"t": 1642.1833333333334, "x": "時速でおよそ56キロだ。"}, {"t": 1644.0333333333333, "x": "壊れやすいはしごの一番上の段は、\n敷居より48インチ低い所だ。"}, {"t": 1648.5833333333333, "x": "そこから片手で雨戸を開けて、\n窓を上げて入った、という筋になる。"}, {"t": 1652.6666666666667, "x": "柔らかい土に、はしごの跡も\n残さずに、と弁護側は言った。"}, {"t": 1656.6166666666666, "x": "強い風の中でそんなことできるの？"}, {"t": 1658.9666666666667, "x": "敷居の端にあった器も、風で倒れずに残っていた。"}, {"t": 1662.3333333333333, "x": "置かれた手紙も風に飛ばされていなかった。"}, {"t": 1664.8666666666666, "x": "判決は窓を選んだことに意味は無いと答えた。"}, {"t": 1667.65, "x": "雨戸はゆがんでいてきちんと閉まらなかった。"}, {"t": 1670.0833333333333, "x": "たまたまか、ほかの窓が\n閉まっていたから選んだと考えていい。"}, {"t": 1673.75, "x": "敷居と床の泥の足跡。"}, {"t": 1675.3333333333333, "x": "窓の下の床のスーツケース。外の足跡。"}, {"t": 1678.2833333333333, "x": "この窓から入らなかったという話には、\n裏づけが無いと判決は書いた。"}, {"t": 1683.3, "x": "そして弁護側はあの預け入れの紙を出した。"}, {"t": 1685.9, "x": "金貨証券を返せという命令の時に、\n2790ドルが預けられた。"}, {"t": 1690.5666666666666, "x": "預けたのはJ・J・フォークナーという人物。"}, {"t": 1693.0, "x": "その紙の字が被告の字ではないことは、\n争いが無かった。"}, {"t": 1696.6666666666667, "x": "それは強い話じゃない？"}, {"t": 1698.3, "x": "弁護側も、とても説得力のある事情だと書いている。"}, {"t": 1701.6333333333334, "x": "身代金を持っていたのは、\nゆすりの罪の証拠にすぎない、とも言った。"}, {"t": 1705.85, "x": "事件の夜と身代金を渡した夜には、\n別の場所にいた、という話もあった。"}, {"t": 1710.85, "x": "判決はそれに何て答えたの？"}, {"t": 1713.0, "x": "判決文の答えはまとめた形だ。"}, {"t": 1715.35, "x": "3つの別々の、互いにほぼ関係のない\n所から、証拠は迷わず有罪を指す。"}, {"t": 1720.3833333333334, "x": "身代金の所持と使用。"}, {"t": 1721.8666666666666, "x": "脅迫状の筆跡。はしごの木。"}, {"t": 1724.2833333333333, "x": "フォークナーの紙については？"}, {"t": 1726.0, "x": "判決文の中で、フォークナーの名前が\n出てくるのは1か所だけだ。"}, {"t": 1729.9333333333334, "x": "弁護側の言い分を書き写したその段落だけ。"}, {"t": 1732.8833333333334, "x": "答えていないってこと？"}, {"t": 1734.4166666666667, "x": "名指しでは答えていない。"}, {"t": 1735.7333333333333, "x": "3本の柱で、まとめて答えた形だ。"}, {"t": 1738.5666666666666, "x": "ここは判決文を全部読んで、\n確かめた事実として言っておく。"}, {"t": 1743.0333333333333, "x": "判決文にはもう1つ大事な線が引いてある。"}, {"t": 1745.8833333333334, "x": "上の裁判所が問うのは、\n疑いが残るかどうかではない。"}, {"t": 1749.2, "x": "評決が、証拠の重さにはっきり反しているかどうかだ。"}, {"t": 1752.7166666666667, "x": "その2つどう違うの？"}, {"t": 1754.3166666666666, "x": "間違いや感情、かたよりで出た\n評決と言えるほどか、ということだ。"}, {"t": 1758.35, "x": "判決は、証拠の重さは検察側にあったと結論した。"}, {"t": 1762.0333333333333, "x": "それどころか、証拠が避けられずに\n導いた評決だと書いた。"}, {"t": 1765.85, "x": "かなり強い言い方ね。"}, {"t": 1767.3833333333334, "x": "ほかの申し立ても退けている。"}, {"t": 1769.2, "x": "陪審をきちんと隔てなかった、という話。"}, {"t": 1772.05, "x": "陪審が虫めがねを使ったのは\nおかしい、という話もあった。"}, {"t": 1775.7833333333333, "x": "虫めがね？そんなことまで問題になるの？"}, {"t": 1778.5666666666666, "x": "判決は、1人の陪審員が\n眼鏡をかけるのと変わらないと答えた。"}, {"t": 1782.7166666666667, "x": "こうした申し立ては、裁判が終わって\n何か月もたってから出された。"}, {"t": 1786.7333333333333, "x": "遅すぎると判決は書いている。"}, {"t": 1788.7833333333333, "x": "それで13対0になったのね。"}, {"t": 1790.95, "x": "有罪を支持したのが13人、取り消しは0人。"}, {"t": 1793.95, "x": "判決を書いたのはパーカー判事だ。"}, {"t": 1796.6833333333334, "x": "弁護側はアメリカの最高裁判所にも訴えた。"}, {"t": 1799.6166666666666, "x": "1935年12月9日、最高裁は取り上げないと決めた。"}, {"t": 1804.1333333333334, "x": "刑の執行は1936年1月17日と決まった。"}, {"t": 1808.35, "x": "それで終わりなの？"}, {"t": 1809.5833333333333, t": 1922.55, "x": "5月12日、長男は隣の郡で見つかった。"}, {"t": 1925.7833333333333, "x": "それから、番号を控えた紙幣を2年半追ったのね。"}, {"t": 1929.1, "x": "そうだ。金貨証券を返せという\n命令と、配った番号の冊子。"}, {"t": 1933.0666666666666, "x": "最後は、ガソリンスタンドの店員が\n書いた車の番号だった。"}, {"t": 1936.7833333333333, "x": "家からは1万4600ドル。"}, {"t": 1938.7333333333333, "x": "押し入れの板には仲立ちの人の住所。"}, {"t": 1941.1666666666667, "x": "手紙の字の癖と欠けていた1本ののみ。"}, {"t": 1943.6666666666667, "x": "屋根裏の床の板とブロンクスの材木屋。"}, {"t": 1946.3666666666666, "x": "それが判決文の3本の柱ね。"}, {"t": 1948.8, "x": "そして柱の外には、弁護側が並べたことが残った。"}, {"t": 1952.3833333333334, "x": "読み取れる指紋は無い。"}, {"t": 1953.6, "x": "強い風の夜のはしご。"}, {"t": 1955.2333333333333, "x": "フォークナーの預け入れの紙の字も、\n被告ではなかった。"}, {"t": 1958.5833333333333, "x": "柱もすき間も同じ判決文に書いてあるのね。"}, {"t": 1961.65, "x": "判決は13対0で3本の柱を重く見た。"}, {"t": 1964.75, "x": "判決文の言葉は、証拠は迷わず有罪を指す、だった。"}, {"t": 1969.1166666666666, "x": "最後に亡くなった子どもの話に戻りたい。"}, {"t": 1971.7, "x": "チャールズ・リンドバーグ・ジュニア。"}, {"t": 1973.05, "x": "1歳8か月だった。"}, {"t": 1974.6833333333334, "x": "尋ね人の紙には、あごの真ん中の\nくぼみまで書いてあった。"}, {"t": 1978.3333333333333, "x": "それだけ見つけてほしかったのよね。"}, {"t": 1980.5666666666666, "x": "両親は、身代金を払ったあとも帰りを待っていた。"}, {"t": 1983.8, "x": "父親は裁判の間、毎日法廷に座っていた。"}, {"t": 1987.15, "x": "つらい6週間だったと思うわ。"}, {"t": 1989.2166666666667, "x": "この回は、子どもが見つかった\n時の様子を描かずに進めた。"}, {"t": 1993.05, "x": "その子のことはずっと覚えておきたいわね。"}, {"t": 1995.5166666666667, "x": "判決文の書き出しにも、その子の名前が書いてある。"}, {"t": 1998.8166666666666, "x": "2歳にならない子どもだったと。"}, {"t": 2000.6833333333334, "x": "紙幣の番号も手紙の字も\nはしごの木も、物として記録に残った。"}, {"t": 2005.0, "x": "物は残っても答えの出ない所もあるのね。"}, {"t": 2007.8, "x": "判決文は分かったことを3本の柱で書いた。"}, {"t": 2010.7333333333333, "x": "弁護側が言ったことも、同じ判決文に書き残された。"}, {"t": 2014.3166666666666, "x": "今回は、1935年の判決文1本で読んだ、\nリンドバーグ愛児誘拐事件だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
