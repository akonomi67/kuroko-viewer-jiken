<script>
const D={"name": "157", "file": "157_編集用", "dur": 2067.19996875, "segs": [], "subs": [{"t": 0.0, "x": "1966年2月4日、金曜日の夕方のことだ。"}, {"t": 3.9833333333333334, "x": "北海道の千歳からジェット旅客機が飛び立った。"}, {"t": 6.966666666666667, "x": "全日空のボーイング727だ。"}, {"t": 9.033333333333333, "x": "行き先は東京の羽田だった。"}, {"t": 11.116666666666667, "x": "どれくらいの人が乗っていたの？"}, {"t": 13.1, "x": "乗客が126人で、乗員が7人。"}, {"t": 15.983333333333333, "x": "あわせて133人だ。"}, {"t": 17.816666666666666, "x": "羽田に着く予定は19時5分だった。"}, {"t": 20.183333333333334, "x": "19時0分30秒、機は管制塔の呼びかけに答えた。"}, {"t": 23.883333333333333, "x": "その30秒後、着陸灯をつけるよう指示が出た。"}, {"t": 27.0, "x": "この指示に返事はなかった。"}, {"t": 28.866666666666667, "x": "それきりなの？"}, {"t": 30.033333333333335, "x": "それきりだ。"}, {"t": 31.15, "x": "機は東京湾に沈み、133人全員が亡くなった。"}, {"t": 34.95, "x": "着く5分前に何があったの？"}, {"t": 36.9, "x": "それが、いまだに分かっていないんだ。"}, {"t": 39.03333333333333, "x": "国の調査団は4年7か月あまり調べた。"}, {"t": 41.833333333333336, "x": "それでも海に入った理由は明らかにできなかった。"}, {"t": 44.75, "x": "この機には飛び方を残す記録計が無かった。"}, {"t": 47.516666666666666, "x": "今回は国会に残った記録だけで、この夜を追っていく。"}, {"t": 51.11666666666667, "x": "記録にも答えの無いところがあるのね。"}, {"t": 53.516666666666666, "x": "ある。"}, {"t": 54.63333333333333, "x": "委員の1人は報告の前に辞表を出している。"}, {"t": 57.31666666666667, "x": "残っている記録を順番に読んでいこう。"}, {"t": 64.3, "x": "その記録は、どこで読めるの？"}, {"t": 66.33333333333333, "x": "中心になるのは国会の会議録だ。"}, {"t": 68.65, "x": "事故の翌日から何度も取り上げられた。"}, {"t": 71.1, "x": "運輸大臣が経過を報告している。"}, {"t": 73.26666666666667, "x": "航空局長も質問に答えた。"}, {"t": 75.4, "x": "海上保安庁の部長が図を広げた日もある。"}, {"t": 78.15, "x": "役所の人が直接話した記録なのね。"}, {"t": 81.03333333333333, "x": "4年後には調査団の団長も呼ばれた。"}, {"t": 83.45, "x": "引き揚げに立ち会った元審査官も来ている。"}, {"t": 86.05, "x": "議員が新聞を引いた所は、議員の言葉として扱う。"}, {"t": 89.51666666666667, "x": "亡くなった人の名前は出さない。"}, {"t": 91.45, "x": "大臣や局長も役職だけで呼ぶ。"}, {"t": 94.38333333333334, "x": "その夜の飛び方は、どこまで分かっているの？"}, {"t": 97.2, "x": "大臣が3日後の本会議でくわしく報告した。"}, {"t": 100.18333333333334, "x": "千歳を離陸したのは17時55分だ。"}, {"t": 102.85, "x": "18時48分に、茨城県の大子ビーコンの上を通過した。"}, {"t": 106.98333333333333, "x": "18時56分には千葉県佐倉の東京VORの上だ。"}, {"t": 110.88333333333334, "x": "ビーコンとかVORって何なの？"}, {"t": 113.05, "x": "飛行機が位置を知るための、地上の無線の目印だ。"}, {"t": 116.25, "x": "団長の説明では、高さは1万4000フィートほど。"}, {"t": 119.58333333333333, "x": "4000メートルを少し超える高さになる。"}, {"t": 122.03333333333333, "x": "18時59分には千葉市の上空あたりにいた。"}, {"t": 125.1, "x": "そこで管制塔から進入の許可が出た。"}, {"t": 127.7, "x": "もう着陸の準備に入っていたのね。"}, {"t": 130.08333333333334, "x": "そうだ。"}, {"t": 131.21666666666667, "x": "着く予定まで残りは6分だった。"}, {"t": 133.95, "x": "19時0分30秒の応答に話を戻そう。"}, {"t": 136.91666666666666, "x": "これが国会で報告された最後の応答だ。"}, {"t": 139.53333333333333, "x": "30秒後の19時1分、管制塔は\n着陸灯の点灯を指示した。"}, {"t": 143.73333333333332, "x": "これに応答は無かった。"}, {"t": 145.18333333333334, "x": "管制塔は何度も呼びかけをくり返した。"}, {"t": 147.66666666666666, "x": "機からは何の応答も無かったという。"}, {"t": 149.9, "x": "その30秒に、何かが起きたってこと？"}, {"t": 152.65, "x": "そこもはっきりしない。"}, {"t": 154.0, "x": "団長は、最後の通報を\n「現在ロングベース」と説明した。"}, {"t": 157.95, "x": "そのあと何が起きたのかは、分からなかったという。"}, {"t": 161.0, "x": "直前まで、ふだん通りに見えるのね。"}, {"t": 163.43333333333334, "x": "少なくとも異変を知らせる通報は、\n国会で報告されていない。"}, {"t": 167.93333333333334, "x": "羽田には航空機救難調整本部が置かれていた。"}, {"t": 171.0, "x": "本部はすぐ下総と木更津の飛行場に問い合わせた。"}, {"t": 174.16666666666666, "x": "どこかに降りていないかを確かめるためだ。"}, {"t": 176.53333333333333, "x": "どちらからも該当する機は無いと返ってきた。"}, {"t": 179.35, "x": "降りた場所が無いってことは……。"}, {"t": 181.1, "x": "本部は捜索と救難を始めた。"}, {"t": 183.25, "x": "警察と海上保安庁と防衛庁に出動を求めている。"}, {"t": 186.65, "x": "海上保安庁が知らせを受けたのは19時25分だ。"}, {"t": 189.86666666666667, "x": "長官は湾内の船23隻と航空機3機に出動を命じた。"}, {"t": 193.98333333333332, "x": "20時には捜索救難の対策本部を開いた。"}, {"t": 197.03333333333333, "x": "湾を通る船にも緊急の通信を流した。"}, {"t": 199.86666666666667, "x": "夜の海で一斉に探し始めたのね。"}, {"t": 202.33333333333334, "x": "部長の説明では、その夜に出た艦艇は54隻だ。"}, {"t": 205.88333333333333, "x": "航空機は9機だ。"}, {"t": 207.16666666666666, "x": "米軍や水上警察の船も加わっていた。"}, {"t": 210.46666666666667, "x": "大臣の報告では、手がかりは23時55分に見つかった。"}, {"t": 214.41666666666666, "x": "場所は木更津の北7海里あたりの海だ。"}, {"t": 217.01666666666668, "x": "捜索機が翼の一部を見つけた。"}, {"t": 219.28333333333333, "x": "その翼には全日空の表示があった。"}, {"t": 221.78333333333333, "x": "それで、あの機だと分かったのね。"}, {"t": 223.91666666666666, "x": "機内の内装の一部も収容された。"}, {"t": 226.21666666666667, "x": "乗客の衣類もあった。"}, {"t": 227.66666666666666, "x": "これで遭難が確かになったと大臣は述べた。"}, {"t": 230.45, "x": "0時5分には捜索船が最初の2人を収容した。"}, {"t": 233.68333333333334, "x": "羽田灯標から東南東へ6.4海里の所だ。"}, {"t": 236.91666666666666, "x": "1時44分には胴体の一部が見つかった。"}, {"t": 239.86666666666667, "x": "千葉灯標の西南西7海里あたりだという。"}, {"t": 242.55, "x": "1時55分、海上自衛隊の水中処分隊に\n出動が求められた。"}, {"t": 247.1, "x": "水にもぐって探す人たちね。"}, {"t": 249.2, "x": "ここから海の底での捜索が始まる。"}, {"t": 252.25, "x": "最初に見つかった時刻は、はっきりしているの？"}, {"t": 255.25, "x": "実は報告によって少しずれる。"}, {"t": 257.31666666666666, "x": "海上保安庁の長官は2月8日にこう説明した。"}, {"t": 260.6166666666667, "x": "23時52分、灯台の見回り船\n「しゅんこう」が見つけた。"}, {"t": 264.65, "x": "見つけたのは1人と翼の一部だ。"}, {"t": 266.93333333333334, "x": "場所は羽田灯標の東南東およそ6.4海里。"}, {"t": 270.03333333333336, "x": "0時15分には巡視船「のじま」が\n機体の一部を見つけた。"}, {"t": 273.9, "x": "大臣の報告とは数分ずつ合わない。"}, {"t": 276.3333333333333, "x": "場所はどうなの？"}, {"t": 277.46666666666664, "x": "6.4海里という場所は同じだ。"}, {"t": 279.6333333333333, "x": "長官の説明には船の名前まで出てくる。"}, {"t": 282.23333333333335, "x": "どちらの時刻が正しいのかは、\n会議録では決められない。"}, {"t": 286.23333333333335, "x": "政府はすぐに関係者を集めた。"}, {"t": 288.3, "x": "総理府に応急対策本部が置かれた。"}, {"t": 290.68333333333334, "x": "本部長は運輸大臣だ。"}, {"t": 292.3, "x": "外務省を通じて米軍にも捜索を頼んでいる。"}, {"t": 295.26666666666665, "x": "大臣はその夜どこにいたの？"}, {"t": 297.21666666666664, "x": "すぐ羽田へ急いだと報告している。"}, {"t": 299.43333333333334, "x": "救難調整本部で話を聞き、捜索に全力をと指示した。"}, {"t": 303.3666666666667, "x": "会合のあと、もう一度羽田に戻ったという。"}, {"t": 306.1333333333333, "x": "翌朝は日の出とともにヘリコプターで現場へ向かった。"}, {"t": 309.25, "x": "海上保安庁の長官や航空局長もいっしょだった。"}, {"t": 312.4166666666667, "x": "航空局は朝4時30分に係官を送り出した。"}, {"t": 315.8333333333333, "x": "夜明け前から調べる人が動いていたのね。"}, {"t": 319.01666666666665, "x": "事故の翌日、総理大臣が予算委員会で弔意を述べた。"}, {"t": 322.6, "x": "一瞬にして133名の命が失われたという言葉だ。"}, {"t": 326.3833333333333, "x": "その2日後、参議院の本会議が開かれた。"}, {"t": 329.3333333333333, "x": "議長は、搭乗者全員の133名が遭難したと述べた。"}, {"t": 333.28333333333336, "x": "議場の全員が起立して黙祷をささげた。"}, {"t": 336.03333333333336, "x": "国会全体で悼んだのね。"}, {"t": 337.95, "x": "予算委員会では、ある議員がこう述べている。"}, {"t": 340.53333333333336, "x": "1機で133名が失われたのは、\n世界の航空史で初めてだそうだ。"}, {"t": 345.1333333333333, "x": "別の議員は、世界史上最大の死者だと言った。"}, {"t": 348.31666666666666, "x": "それは国が調べた数字なの？"}, {"t": 350.31666666666666, "x": "議員の言葉として残っているものだ。"}, {"t": 352.56666666666666, "x": "国の調べとしては出ていない。"}, {"t": 354.3666666666667, "x": "当時の国会の受け止めの重さは伝わってくる。"}, {"t": 357.8333333333333, "x": "事故の翌日、衆議院の運輸委員たちは\n現場へ向かった。"}, {"t": 361.3333333333333, "x": "委員長を先頭に、およそ15人だったという。"}, {"t": 364.1166666666667, "x": "ある議員が、そのときの海の様子を語っている。"}, {"t": 366.95, "x": "風が非常に強かった。"}, {"t": 368.56666666666666, "x": "海の水は土の色をしていたそうだ。"}, {"t": 370.8666666666667, "x": "前の夜の事故を思いながら見たのね。"}, {"t": 373.2, "x": "委員たちは、そこで一同で黙祷をした。"}, {"t": 375.75, "x": "議員はこうした事故は初めてではないとも述べた。"}, {"t": 378.53333333333336, "x": "1952年から1965年までに、\n国内ですでに13件あったという。"}, {"t": 384.0, "x": "しかも、この数年で増えているそうだ。"}, {"t": 386.31666666666666, "x": "議員は航空の進め方を思い切って見直すよう求めた。"}, {"t": 389.81666666666666, "x": "事故が続く中で起きた、いちばん\n大きな事故だったのね。"}, {"t": 393.85, "x": "海からは、どれくらいの人が見つかっていったの？"}, {"t": 396.8333333333333, "x": "大臣は国会のたびに数を報告した。"}, {"t": 399.3833333333333, "x": "2月5日は1日で29人が収容された。"}, {"t": 402.4166666666667, "x": "6日は、自衛艦「のぎく」の水中処分隊が動いた。"}, {"t": 406.0, "x": "海の底で機体の一部を見つけている。"}, {"t": 408.3333333333333, "x": "7日は朝から20メートルを超える風が吹いた。"}, {"t": 411.1166666666667, "x": "波も高く、作業は思うように進まなかった。"}, {"t": 414.01666666666665, "x": "風の弱い時を見て、合間に続けたという。"}, {"t": 416.8833333333333, "x": "冬の海で天気とも戦っていたのね。"}, {"t": 419.4, "x": "午後に天気が戻ると、13人が収容された。"}, {"t": 422.48333333333335, "x": "8日は朝から作業が進んだ。"}, {"t": 424.43333333333334, "x": "同じ8日、海上保安庁の長官は\n参議院で数を追っていた。"}, {"t": 428.2, "x": "資料は朝9時の締めだったが、そのあとも増え続けた。"}, {"t": 431.5, "x": "10時までに53人、10時半までに56人。"}, {"t": 434.7, "x": "10時50分までに60人になったという。"}, {"t": 437.3333333333333, "x": "天気も良く、まだ見つかるはずだと長官は話した。"}, {"t": 440.53333333333336, "x": "大臣の報告では、午後3時までに33人が収容された。"}, {"t": 444.51666666666665, "x": "この時点で合わせて76人になった。"}, {"t": 447.0833333333333, "x": "残った人の収容に最善を尽くすと、大臣は述べた。"}, {"t": 451.23333333333335, "x": "2月10日、海上保安庁の警備救難部長が図を広げた。"}, {"t": 454.98333333333335, "x": "部長は8日に現場へ出ていた。"}, {"t": 456.85, "x": "潜水夫のまとめ役から話を聞いたという。"}, {"t": 459.5, "x": "捜索の範囲は、およそ4マイルの円にしぼられていた。"}, {"t": 462.78333333333336, "x": "船はおよそ70隻。"}, {"t": 464.35, "x": "潜水夫や作業員は100人ほどだった。"}, {"t": 466.9, "x": "海の底はどうなっていたの？"}, {"t": 468.7, "x": "泥が厚くたまっていた。"}, {"t": 470.23333333333335, "x": "潜水夫が歩くと、1歩ごとに30\nセンチから40センチ沈んだ。"}, {"t": 474.4, "x": "その下に、何か硬い物がある感じがしたそうだ。"}, {"t": 477.5833333333333, "x": "太いワイヤーの束を伝って行き来していたという。"}, {"t": 480.31666666666666, "x": "部長は、下に機体の底があるのではと話した。"}, {"t": 483.3666666666667, "x": "ただし潜水夫の報告をもとにした\n見立てだと断っている。"}, {"t": 487.01666666666665, "x": "見えない泥の中を手さぐりで探していたのね。"}, {"t": 490.3, "x": "部長が図で示したのは尾翼のあたりの部分だ。"}, {"t": 493.06666666666666, "x": "この機は、うしろにエンジンが3つ並ぶ形をしていた。"}, {"t": 496.3666666666667, "x": "見つかった部分では、右のエンジンだけが無かった。"}, {"t": 499.3833333333333, "x": "残りの2つはついたままだったという。"}, {"t": 501.75, "x": "右のエンジンはどこへ行ったの？"}, {"t": 503.5833333333333, "x": "尾翼から200メートルほどの所に、\nエンジンが1つあった。"}, {"t": 507.21666666666664, "x": "部長は、たぶんこれだろうと述べた。"}, {"t": 509.3333333333333, "x": "そのそばには車輪も1つあった。"}, {"t": 511.4, "x": "もう1つ目立ったのが尾翼の向きだ。"}, {"t": 513.6333333333333, "x": "羽田とほぼ反対の、千葉県の五井へ向いていた。"}, {"t": 516.7166666666667, "x": "羽田に向かっていたはずなのに？"}, {"t": 518.7333333333333, "x": "部長はそう報告した。"}, {"t": 520.2666666666667, "x": "なぜそうなったのかには触れていない。"}, {"t": 522.8666666666667, "x": "尾翼から30メートルほどの所に、\n主翼のついた胴体があった。"}, {"t": 526.9166666666666, "x": "北へ20メートルほどの所では油が流れ出していた。"}, {"t": 530.2333333333333, "x": "2月9日には、窓が14ほど並んだ\n胴体の一部も見つかった。"}, {"t": 534.4666666666667, "x": "尾翼から50メートルほど離れた場所だ。"}, {"t": 537.0666666666667, "x": "機体はいくつにも分かれていたのね。"}, {"t": 539.25, "x": "破片は200メートルほどの間に、\n扇の形に広がっていた。"}, {"t": 543.1333333333333, "x": "同じような物がまとまって沈んでいたという。"}, {"t": 545.65, "x": "これまではまとまった所から引き上げてきた。"}, {"t": 548.3166666666667, "x": "この先は落ち穂拾いのように難しくなる。"}, {"t": 550.85, "x": "部長はそう心配していた。"}, {"t": 552.7, "x": "見つけるのがどんどん難しくなるのね。"}, {"t": 555.6333333333333, "x": "2月8日の衆議院の本会議でも、引き揚げの話が出た。"}, {"t": 559.3666666666667, "x": "ある議員が、作業にあたる人の報告を紹介した。"}, {"t": 562.55, "x": "海の底の機体には、焼け焦げた様子がほとんど無い。"}, {"t": 565.75, "x": "これまでの海の墜落とは、まったく別の姿だという。"}, {"t": 569.1333333333333, "x": "機体はほとんど元の形に戻せる見通しだそうだ。"}, {"t": 572.4, "x": "それなら組み立て直して調べられるわね。"}, {"t": 574.9, "x": "議員も、原因を調べる上で大きな意味があると言った。"}, {"t": 578.0166666666667, "x": "機体の引き揚げは2月12日に始まった。"}, {"t": 580.8166666666667, "x": "2月の末、大臣は8割から9割を\n引き上げたと思うと答えた。"}, {"t": 585.0, "x": "3月には、見つかった部分は\nすべて引き上げたとされた。"}, {"t": 588.4333333333333, "x": "ただし胴体の底の部分は見つかっていない。"}, {"t": 591.0, "x": "計器の一部も見つかっていない。"}, {"t": 593.0166666666667, "x": "一部は海の底に残ったままなのね。"}, {"t": 595.9833333333333, "x": "3月7日、大臣はその後の経過を報告した。"}, {"t": 599.25, "x": "3月6日までに、収容は合わせて116人になった。"}, {"t": 602.8833333333333, "x": "2月8日からの103人は、男性85人と女性18人だ。"}, {"t": 607.2666666666667, "x": "3月22日には、収容は126人と報告された。"}, {"t": 611.2833333333333, "x": "まだ見つかっていない人は7人になった。"}, {"t": 613.95, "x": "その7人の家族は待ち続けていたのね。"}, {"t": 616.6833333333333, "x": "大臣は、最後の1人まで作業を続けると述べた。"}, {"t": 619.8833333333333, "x": "ある議員も、何年かかっても\n探す体制を崩すなと求めた。"}, {"t": 623.7, "x": "その後の7人のことは、\n国会の記録では確かめられなかった。"}, {"t": 627.7333333333333, "x": "記録がそこで途切れているのね。"}, {"t": 629.7333333333333, "x": "数え方にも、引っかかる所がある。"}, {"t": 632.15, "x": "3月の報告では、2月7日までの収容は13人とされた。"}, {"t": 636.2666666666667, "x": "2月8日の報告では、5日だけで29人だった。"}, {"t": 639.7666666666667, "x": "何を数えた数字なのかは読み取れない。"}, {"t": 642.7166666666667, "x": "残された家族への手当てはどうなったの？"}, {"t": 645.1666666666666, "x": "事故から3日後に、大臣が答えている。"}, {"t": 647.7166666666667, "x": "全日空は、亡くなった人に40万円ずつを渡した。"}, {"t": 651.1666666666666, "x": "弔慰金と葬祭料として、とりあえず渡した分だ。"}, {"t": 654.3333333333334, "x": "運送約款の上限は、亡くなった場合で300万円だった。"}, {"t": 658.2166666666667, "x": "上限が先に決まっていたのね。"}, {"t": 660.3, "x": "大臣は、保険の有無に関わらず\n適切な補償をさせると述べた。"}, {"t": 664.3, "x": "ある議員は、国も責任の一端を負うべきだと求めた。"}, {"t": 667.65, "x": "法の上では、国に責任は無いと\n言われるという前置きつきだ。"}, {"t": 671.25, "x": "別の議員は、遺族の生活を\n立て直す助けが要ると訴えた。"}, {"t": 675.1333333333333, "x": "4年後の国会でも、ある議員がこう述べている。"}, {"t": 677.9333333333333, "x": "補償の額に不満な遺族が、\n民事の裁判を起こしたという。"}, {"t": 681.6, "x": "家族の苦しみは長く続いたのね。"}, {"t": 684.4666666666667, "x": "事故の翌日、国会ではこの機種そのものが問われた。"}, {"t": 687.8666666666667, "x": "ある議員が新聞を引いて述べた。"}, {"t": 689.7666666666667, "x": "727は、半年で4回の事故を起こしているという。"}, {"t": 693.0833333333334, "x": "今回の事故も入れた数だ。"}, {"t": 694.95, "x": "同じ機種で、そんなに続いていたの？"}, {"t": 697.4, "x": "議員はアメリカの報告書のことも新聞から紹介した。"}, {"t": 700.7166666666667, "x": "この機の内装は煙が多く、燃え上がるのも早いという。"}, {"t": 704.0166666666667, "x": "着陸に入ってから落ちていること。"}, {"t": 706.2, "x": "夕方であることも共通するという。"}, {"t": 708.3166666666667, "x": "別の議員は、\n真ん中のエンジンの燃料の送り方を挙げた。"}, {"t": 711.85, "x": "アメリカの航空局が、改良を勧めていたという話だ。"}, {"t": 715.4666666666667, "x": "どれも、議員が新聞などで知った話なのね。"}, {"t": 718.45, "x": "だから議員の言葉として紹介するだけにする。"}, {"t": 721.8833333333333, "x": "航空局長は、アメリカでの3件は\n承知していると答えた。"}, {"t": 725.6166666666667, "x": "日付は1965年の8月16日、11月8日、11月12日だ。"}, {"t": 731.45, "x": "11月の2件は、着陸のときの操作によるものだという。"}, {"t": 735.1666666666666, "x": "8月の1件は機が全部燃えた。"}, {"t": 737.3333333333334, "x": "原因はまだ明らかでないそうだ。"}, {"t": 739.3833333333333, "x": "原因の分からない事故がアメリカにもあったのね。"}, {"t": 742.2166666666667, "x": "アメリカはこの機の使用を止めてはいなかった。"}, {"t": 744.7333333333333, "x": "型式証明で安全が確かめられていたと、\n局長は説明した。"}, {"t": 748.8666666666667, "x": "だから特段の措置はとらなかったと答えている。"}, {"t": 751.8333333333334, "x": "はっきりそう答えたのね。"}, {"t": 753.5, "x": "局長は、まず事故機の調べを急ぐと述べた。"}, {"t": 757.0, "x": "別の議員は、国内にある727の数を確かめた。"}, {"t": 760.5, "x": "全日空が5機で日航が2機、あわせて7機だという。"}, {"t": 763.75, "x": "局長も、事故機を入れてその数だと答えた。"}, {"t": 766.7666666666667, "x": "その7機のうちの1機が落ちたのね。"}, {"t": 769.1, "x": "きっかけは1962年5月の航空審議会だという。"}, {"t": 772.9, "x": "日航と全日空の機種をそろえる考えが出された。"}, {"t": 775.9333333333333, "x": "両社のあいだで機種の競い合いがあったからだ。"}, {"t": 778.55, "x": "両社は共同で研究した。"}, {"t": 780.35, "x": "そして、この機が適当だと報告した。"}, {"t": 782.95, "x": "航空局はそれを了承したと説明している。"}, {"t": 785.8, "x": "国の考えでそろえて選んだ機だったのね。"}, {"t": 788.45, "x": "世界では、すでに221機が引き渡されていた。"}, {"t": 791.8333333333334, "x": "受注は470機にのぼると、局長は資料で示した。"}, {"t": 796.2333333333333, "x": "ある議員は、大臣の発言を新聞で読んだと述べた。"}, {"t": 799.4666666666667, "x": "運航は止めず、点検を\n十分にして飛ばすという発言だ。"}, {"t": 803.0166666666667, "x": "構造の欠陥なら点検では\n済まないと、議員は問いただした。"}, {"t": 806.8166666666667, "x": "止めるべきだという意見ね。"}, {"t": 808.55, "x": "別の議員は、イギリスのコメット機の例を挙げた。"}, {"t": 811.45, "x": "事故が続いたとき、世界中で飛行を止めた例だ。"}, {"t": 814.5333333333333, "x": "局長は、コメット機とは事情が違うと答えた。"}, {"t": 817.5333333333333, "x": "コメット機は、破片から窓の枠の疲労だと分かった。"}, {"t": 820.8166666666667, "x": "機体が原因と分かったので、証明を取り消したという。"}, {"t": 824.2, "x": "727では、まだ原因が分かっていなかったのね。"}, {"t": 827.45, "x": "局長は、だれが聞いても正しい\n判断を出してもらうと述べた。"}, {"t": 831.1333333333333, "x": "それを待ってから手を打つという考えだった。"}, {"t": 834.2166666666667, "x": "技術調査団は、2月7日に最初の会合を開いた。"}, {"t": 837.7333333333333, "x": "大臣は、民間の学識経験者を含む13名だと報告した。"}, {"t": 842.0333333333333, "x": "ところが4年後、団長は委員は17名だったと述べた。"}, {"t": 845.5833333333334, "x": "数がそろっていないじゃない。"}, {"t": 847.2666666666667, "x": "なぜ数が変わったのかは、\n会議録には書かれていない。"}, {"t": 850.4333333333333, "x": "委員は機体やエンジン、操縦の専門家たちだった。"}, {"t": 853.5166666666667, "x": "医学や気象の専門家もいた。"}, {"t": 855.45, "x": "航空局の担当者も入っていた。"}, {"t": 857.6333333333333, "x": "団長は当時、日本大学の教授だった。"}, {"t": 860.3833333333333, "x": "製造国のアメリカからも、政府の調査団が来た。"}, {"t": 863.5833333333334, "x": "日米の共同の調べは、およそ3週間続いたという。"}, {"t": 867.1333333333333, "x": "アメリカといっしょに調べたのね。"}, {"t": 869.1333333333333, "x": "その後も、文書で意見を交わしながら進めたそうだ。"}, {"t": 872.9166666666666, "x": "団長がまず大事にしたのは、\n引き上げた物そのものだ。"}, {"t": 876.35, "x": "破片は海の中に散らばっていた。"}, {"t": 878.4333333333333, "x": "元の散らばり方が分かる形で引き上げたという。"}, {"t": 881.3666666666667, "x": "それを1つの格納庫に集めて調べた。"}, {"t": 884.0333333333333, "x": "散らばっていた場所も手がかりになるのね。"}, {"t": 886.4833333333333, "x": "そのために現物小委員会という部会がつくられた。"}, {"t": 889.5666666666667, "x": "1966年2月19日から始まった。"}, {"t": 892.9166666666666, "x": "開かれたのは、およそ47回だ。"}, {"t": 895.4, "x": "報告がまとまったのは1968年3月28日だった。"}, {"t": 899.8833333333333, "x": "現物の調べは、最初の2年でひと通り終わったという。"}, {"t": 903.4166666666666, "x": "物を調べるだけで2年もかかったのね。"}, {"t": 906.45, "x": "3月31日、団長は衆議院の委員会に呼ばれた。"}, {"t": 910.15, "x": "まだ予備の調査の段階だと前置きした。"}, {"t": 912.6166666666667, "x": "調べていることの1つは、機体やエンジンの故障だ。"}, {"t": 915.8, "x": "もう1つは、計器を1つずつ分解することだった。"}, {"t": 919.1666666666666, "x": "計器って、速さや高さを示すメーターのこと？"}, {"t": 922.2666666666667, "x": "そうだ。"}, {"t": 923.3833333333333, "x": "団長は速度計を例に挙げている。"}, {"t": 925.4666666666667, "x": "針が150ノットで止まっていたとする。"}, {"t": 927.9333333333333, "x": "それが海にぶつかった時の速さとは限らない。"}, {"t": 930.7666666666667, "x": "あとで針が動いたのかもしれないからだ。"}, {"t": 933.0666666666667, "x": "だから分解して傷あとを調べるという。"}, {"t": 935.5333333333333, "x": "止まった針ひとつでも決めつけないのね。"}, {"t": 938.0666666666667, "x": "水に着く時の動きを調べる\n実験も、必要なら頼むと述べた。"}, {"t": 942.1833333333333, "x": "ディッチングテストと呼ぶ実験だ。"}, {"t": 944.8166666666667, "x": "その前日の3月30日、同じ型の機を実際に飛ばした。"}, {"t": 948.95, "x": "団長は事故機の飛び方をこう説明した。"}, {"t": 951.5833333333334, "x": "ふつうは千葉から木更津へ、計器にたよって飛ぶ。"}, {"t": 954.4666666666667, "x": "見通しのよい時は、近道も許されていた。"}, {"t": 957.2666666666667, "x": "事故機は千葉の上空で有視界飛行に切りかえた。"}, {"t": 960.2, "x": "機長の目で外を見ながら空港へ近づく飛び方だ。"}, {"t": 963.4, "x": "そのとき、どれくらいの高さにいたの？"}, {"t": 965.85, "x": "1万フィート、およそ3000メートルだ。"}, {"t": 968.25, "x": "高すぎて無理に降りたのでは、という話が出ていた。"}, {"t": 971.3333333333334, "x": "新聞にもそう書かれていたという。"}, {"t": 973.2666666666667, "x": "計算では、それほど無理ではないと出ていた。"}, {"t": 975.9, "x": "実際の機で確かめるのが、この日の目的だった。"}, {"t": 979.7833333333333, "x": "事故機の速さや降り方は記録が残っていない。"}, {"t": 982.5666666666667, "x": "速さは250ノットから350ノットの間と考えた。"}, {"t": 986.4166666666666, "x": "降りる速さは、1分間に4000\nフィートから6000フィートだ。"}, {"t": 990.15, "x": "それって、かなり急じゃないの？"}, {"t": 992.1166666666667, "x": "団長は、操縦士がよく使う降り方だと述べた。"}, {"t": 995.2, "x": "短い路線のため、すばやく降りられる設計だという。"}, {"t": 998.3833333333333, "x": "現場のそばに、海上保安庁の船「のじま」を置いた。"}, {"t": 1001.9333333333333, "x": "そこへ向けて何通りも降りてみた。"}, {"t": 1003.9666666666667, "x": "スポイラーを立てたり立てなかったりしている。"}, {"t": 1006.3833333333333, "x": "安全のため、2000フィート高い所から始めた。"}, {"t": 1009.65, "x": "高さをずらして同じように試したのね。"}, {"t": 1012.1666666666666, "x": "結果は、無理をせずに降りられるというものだった。"}, {"t": 1014.9333333333333, "x": "気流の悪い日だったが、\n客席で危なさは感じなかった。"}, {"t": 1018.4833333333333, "x": "局長は、この1回では中間の結論も出さないと答えた。"}, {"t": 1022.25, "x": "この時点で、調査団の会議は8回開かれていたという。"}, {"t": 1025.75, "x": "新聞には、試験の結果を\nめぐる推測の記事も出ていた。"}, {"t": 1029.3, "x": "局長は、記録計を積んだ試験をさらに重ねると述べた。"}, {"t": 1033.4833333333333, "x": "ほかの機とくらべて、降り方はどうだったの？"}, {"t": 1036.2166666666667, "x": "2月17日、航空局の技術部長が数字を示した。"}, {"t": 1039.9666666666667, "x": "くらべたのはダグラスのDC8だ。"}, {"t": 1042.15, "x": "速く降りる時、DC8は1分間に2500から3000フィート。"}, {"t": 1046.4, "x": "727は2300から4000フィートだという。"}, {"t": 1049.4, "x": "ゆっくり降りる時は、DC8が2000から2500フィート。"}, {"t": 1053.1, "x": "727は1500から2000フィートだった。"}, {"t": 1055.9166666666667, "x": "速く降りる時の上限は、727が大きいのね。"}, {"t": 1059.2, "x": "部長は、それでも危ない機とは\n承知していないと答えた。"}, {"t": 1062.5833333333333, "x": "降りる速さだけでは、\n事故の説明にならないということだ。"}, {"t": 1066.6333333333334, "x": "3月31日の委員会には、東京大学の教授も来ていた。"}, {"t": 1070.8166666666666, "x": "教授は、飛行記録計をつけるべきだという\n意見を紹介した。"}, {"t": 1074.5, "x": "トラックのタコグラフにたとえている。"}, {"t": 1076.55, "x": "運転手がいやがるのは、役に立つからだという。"}, {"t": 1079.5166666666667, "x": "事故機には、その記録計は無かったの？"}, {"t": 1082.1333333333334, "x": "無かった。"}, {"t": 1083.2666666666667, "x": "団長は4年後、これを分からなかった理由に挙げた。"}, {"t": 1086.3333333333333, "x": "調査団は、試験の機に記録計を積む計画も立てた。"}, {"t": 1089.8166666666666, "x": "のちに、ジェット機には記録計をつけることになった。"}, {"t": 1093.05, "x": "何が起きたかを残す道具が広がったのね。"}, {"t": 1096.3, "x": "調査の途中でも、すぐにとられた対策がある。"}, {"t": 1099.2, "x": "1966年2月26日からの決まりだ。"}, {"t": 1102.7333333333333, "x": "主な空港での夜の着陸は、計器飛行が原則になった。"}, {"t": 1106.5, "x": "航空局の指導で、全日空に実施させたという。"}, {"t": 1109.6166666666666, "x": "2月17日には、アメリカの連邦航空庁が\n勧告を出した。"}, {"t": 1113.6166666666666, "x": "この型の機の降り方と、進入の手順を改める中身だ。"}, {"t": 1117.2666666666667, "x": "操縦士の訓練の項目も見直すよう求めていた。"}, {"t": 1120.4833333333333, "x": "日本ではどうしたの？"}, {"t": 1121.8833333333334, "x": "航空局は勧告を受け入れた。"}, {"t": 1123.85, "x": "主な航空会社に、規定にするよう指導している。"}, {"t": 1126.85, "x": "すべての乗員に知らせるようにということだ。"}, {"t": 1129.45, "x": "原因が分からなくても、できることから\n手を打ったのね。"}, {"t": 1133.2833333333333, "x": "事故の夜の天気も、国会で話に出た。"}, {"t": 1136.05, "x": "ある議員が気象台の発表を紹介している。"}, {"t": 1138.6666666666667, "x": "19時ごろ、東京湾の上空では西の風が吹いていた。"}, {"t": 1142.0833333333333, "x": "高さ1000メートルから1600メートルでのことだ。"}, {"t": 1145.0666666666666, "x": "風は10メートルほどの弱いものだった。"}, {"t": 1147.3666666666666, "x": "空は快晴で、見通しも良かったという。"}, {"t": 1149.95, "x": "天気のせいとは言いにくいわね。"}, {"t": 1151.8333333333333, "x": "ただ、局地的な乱れた気流の話もあったそうだ。"}, {"t": 1155.1333333333334, "x": "雨雲をともなうものだと議員は述べた。"}, {"t": 1157.3833333333334, "x": "どちらが当てはまるかは、会議録では確かめられない。"}, {"t": 1160.5, "x": "調査団には気象の専門家もいた。"}, {"t": 1162.75, "x": "それでも天気が原因という結論にはなっていない。"}, {"t": 1166.2833333333333, "x": "事故の瞬間を見た人はいたのか。"}, {"t": 1168.4333333333334, "x": "2月17日、ある議員がこう述べた。"}, {"t": 1170.95, "x": "青い光を放って、火の玉が2つ落ちた。"}, {"t": 1173.8166666666666, "x": "そう話す目撃者もいるらしいという。"}, {"t": 1176.0333333333333, "x": "議員は、右のエンジンが\n外れていることと結びつけた。"}, {"t": 1179.3, "x": "ただし、断定的には言わないと前置きしている。"}, {"t": 1182.2833333333333, "x": "調査団は、その話をどう見たの？"}, {"t": 1184.65, "x": "団長は、信頼できる目撃証言は\nほとんど無かったと述べた。"}, {"t": 1188.5666666666666, "x": "夜で、しかも海の上の事故だったからだ。"}, {"t": 1191.1666666666667, "x": "局長も、信用できる目撃者は\nあまりいなかったと答えた。"}, {"t": 1195.0, "x": "見た人の話も決め手にはならなかったのね。"}, {"t": 1198.4166666666667, "x": "同じ2月17日、別の議員が新聞の記事を取り上げた。"}, {"t": 1202.2, "x": "アメリカの連邦航空局が、\n墜落の原因について何か発表した。"}, {"t": 1206.5166666666667, "x": "それに日本の航空局が反論したという記事だ。"}, {"t": 1209.6166666666666, "x": "事故から2週間で、原因の話が出ていたの？"}, {"t": 1212.7166666666667, "x": "議員は、それが推定なのかを尋ねている。"}, {"t": 1215.3, "x": "だれかが情報を渡したのか、とも聞いた。"}, {"t": 1217.85, "x": "どういういきさつなのか、説明を求めたわけだ。"}, {"t": 1220.8, "x": "発表の中身は、議員の質問の中にも出てこない。"}, {"t": 1224.2, "x": "記事の話だけが、会議録に残ったのね。"}, {"t": 1227.1333333333334, "x": "調査団はこのあとも、日米で資料を\nやり取りしながら調べを続けた。"}, {"t": 1231.9166666666667, "x": "1か月後、羽田でまた事故が起きた。"}, {"t": 1234.4, "x": "1966年3月4日、カナダ太平洋航空のDC8だ。"}, {"t": 1239.1166666666666, "x": "香港から来た便だった。"}, {"t": 1240.75, "x": "着陸の直前に低く降りすぎ、管制官が2度注意した。"}, {"t": 1244.55, "x": "そのあと急な角度で降り、岸壁にぶつかって燃えた。"}, {"t": 1247.7833333333333, "x": "64人が亡くなり、8人がけがをした。"}, {"t": 1250.7333333333333, "x": "同じ羽田で、たった1か月後に？"}, {"t": 1253.1166666666666, "x": "次の日には、英国海外航空の707が\n富士山のふもとに落ちた。"}, {"t": 1257.5666666666666, "x": "ある議員は、124名が遭難したと述べている。"}, {"t": 1260.7666666666667, "x": "同じ日には、海上保安庁のヘリコプターも落ちた。"}, {"t": 1263.8833333333334, "x": "1か月もたたずに3回の大事故だと、\n別の議員は述べた。"}, {"t": 1267.7166666666667, "x": "立て続けに起きたのね。"}, {"t": 1269.35, "x": "大臣は、2つの事故の連絡本部を\n1つにまとめたと報告した。"}, {"t": 1274.25, "x": "11月13日には、全日空の別の機が\n松山で事故を起こした。"}, {"t": 1278.6166666666666, "x": "機種はYS11で、大阪から松山への便だった。"}, {"t": 1282.05, "x": "乗員5人と乗客45人が乗っていた。"}, {"t": 1284.75, "x": "一度は滑走路のほぼ真ん中に着いた。"}, {"t": 1287.1, "x": "すぐに海側へ、やり直しの上昇をしたという。"}, {"t": 1289.9166666666667, "x": "左へ回ったあと消息を断ったと、大臣は報告した。"}, {"t": 1293.7833333333333, "x": "これも海の上だったのね。"}, {"t": 1295.4833333333333, "x": "この事故には、別の教授を\n団長とする調査団が組まれた。"}, {"t": 1299.1333333333334, "x": "のちに、松山も羽田沖もうやむやだと議員は述べた。"}, {"t": 1302.4333333333334, "x": "この1年、国内の空では大きな事故が続いた。"}, {"t": 1306.1833333333334, "x": "事故から1年4か月の1967年6月28日。"}, {"t": 1310.5833333333333, "x": "衆議院の商工委員会で、\n技術部長が調べの長さを語った。"}, {"t": 1314.55, "x": "アメリカには、大きな組織を持つ調査の役所がある。"}, {"t": 1317.7166666666667, "x": "それでも全員が亡くなった事故は、\nまだ発表されていないという。"}, {"t": 1321.5333333333333, "x": "アメリカでも時間がかかっていたのね。"}, {"t": 1323.85, "x": "同じ727で、ほかに2件の事故があった。"}, {"t": 1326.7666666666667, "x": "そちらは操縦士が生きていた。"}, {"t": 1328.6, "x": "記録計が回収された事故もあった。"}, {"t": 1330.85, "x": "だから、おととしの事故が\n去年発表されたと部長は説明した。"}, {"t": 1334.9333333333334, "x": "生きた証言と記録があるか\nどうかで、そんなに差が出るのね。"}, {"t": 1338.55, "x": "羽田沖の事故には、そのどちらも無かった。"}, {"t": 1341.9, "x": "調査団の話に戻ろう。"}, {"t": 1343.5833333333333, "x": "現物の調べが終わると、報告書の案づくりが始まった。"}, {"t": 1347.2166666666667, "x": "最初の案を話し合ったのは1968年4月26日だ。"}, {"t": 1351.6333333333334, "x": "総会で、もっと調べが要るという意見が出る。"}, {"t": 1354.35, "x": "すると実験をして、結果を入れて次の案をつくる。"}, {"t": 1357.4333333333334, "x": "これをくり返し、案は5つ目までつくられた。"}, {"t": 1360.2833333333333, "x": "一度で決めずに何度も書き直したのね。"}, {"t": 1362.8166666666666, "x": "研究の一部は、航空宇宙技術研究所に頼んだ。"}, {"t": 1366.2166666666667, "x": "金属材料研究所にも頼んでいる。"}, {"t": 1368.5666666666666, "x": "案を話し合うだけで、2年あまりかかったという。"}, {"t": 1371.4166666666667, "x": "総会は全部で33回開かれた。"}, {"t": 1374.5333333333333, "x": "事故から4年たった1970年の1月24日。"}, {"t": 1378.2666666666667, "x": "調査団は中間的な発表をした。"}, {"t": 1380.6166666666666, "x": "ある議員はその中身をこうまとめた。"}, {"t": 1382.7, "x": "事故の推定原因は、不明という公算が大きい。"}, {"t": 1385.8333333333333, "x": "分からないという発表だったのね。"}, {"t": 1387.9666666666667, "x": "議員は雑誌の報道も引いている。"}, {"t": 1389.8833333333334, "x": "これは多数決で決められたという。"}, {"t": 1391.8833333333334, "x": "科学に多数決を持ち込んだと、批判があるそうだ。"}, {"t": 1395.0333333333333, "x": "5月には、航空局の技術部長がこう答えた。"}, {"t": 1398.1333333333334, "x": "1月のものは中間の発表で、\n正式な報告書はまだ出ていない。"}, {"t": 1402.35, "x": "いつ終わるかは見通せないという。"}, {"t": 1404.25, "x": "結論が出たのか出ていないのか、分かりにくいわね。"}, {"t": 1407.8833333333334, "x": "この発表のすぐあと、委員の1人が辞表を出した。"}, {"t": 1411.05, "x": "ある議員によると、出したのは2月2日だ。"}, {"t": 1413.7666666666667, "x": "あて先は運輸大臣だった。"}, {"t": 1415.5333333333333, "x": "次の日の新聞各紙が一斉に伝えたという。"}, {"t": 1418.4666666666667, "x": "やめようとしたのは、どんな人なの？"}, {"t": 1420.8, "x": "東京大学の教授だったと、議員たちは述べている。"}, {"t": 1423.9833333333333, "x": "報告書のまとめ方を批判しての辞表だという。"}, {"t": 1426.85, "x": "航空局長らの引き止めも\n断ったと、記事にあったそうだ。"}, {"t": 1430.5, "x": "ある議員は、雨の日に大学で\n教授と2時間あまり話した。"}, {"t": 1434.25, "x": "調査団の中から反対の声が上がったのね。"}, {"t": 1437.6166666666666, "x": "この辞表について、政府の答えは2つに分かれる。"}, {"t": 1440.7333333333333, "x": "3月7日、運輸大臣はこう答えた。"}, {"t": 1443.3833333333334, "x": "意見の食い違いは聞いているが、\n辞表は手元に来ていない。"}, {"t": 1446.7666666666667, "x": "最終の報告とあわせて検討したいという。"}, {"t": 1449.3833333333334, "x": "5月12日、技術部長はこう答えた。"}, {"t": 1452.0833333333333, "x": "団員をやめたいという辞表は受理している。"}, {"t": 1454.4333333333334, "x": "団長や事務局が、引き止めに努めているという。"}, {"t": 1457.5833333333333, "x": "届いていないのか受け取ったのか、どっちなの？"}, {"t": 1460.4, "x": "会議録には2つの言葉が並んでいるだけだ。"}, {"t": 1463.2, "x": "そのつながりは書かれていない。"}, {"t": 1464.9333333333334, "x": "部長は、最後は団長が大臣に\n相談するだろうと述べた。"}, {"t": 1468.6333333333334, "x": "その辞表は結局どうなったの？"}, {"t": 1470.7166666666667, "x": "会議録の中では、そこから先は確かめられなかった。"}, {"t": 1474.8166666666666, "x": "その教授は何を主張していたのか。"}, {"t": 1477.05, "x": "同じ日、部長は教授の意見のあつかいも語っている。"}, {"t": 1480.2666666666667, "x": "1月24日の会議で、教授の意見が発表された。"}, {"t": 1483.8333333333333, "x": "しかし、可能性が非常に少ないとされた。"}, {"t": 1486.55, "x": "大方の団員の賛成は得られなかったという。"}, {"t": 1489.15, "x": "ただ教授の実験の結果は、参考にしているそうだ。"}, {"t": 1492.55, "x": "意見は通らなかったけれど、実験は使うということね。"}, {"t": 1496.0333333333333, "x": "ある議員は、教授の考えをこう紹介した。"}, {"t": 1498.7, "x": "機体に何か異常が\n起きたのではないかと推理している。"}, {"t": 1501.8, "x": "結論の前に、もっと調べるべきだという立場だ。"}, {"t": 1504.8666666666666, "x": "別の議員は、教授だけが機体の欠陥を\n原因と見ていると述べた。"}, {"t": 1508.9833333333333, "x": "調査団の多くと1人の教授とで、見方が\n割れていたのね。"}, {"t": 1513.2, "x": "教授の説には具体的な\n論点があったと、議員は述べた。"}, {"t": 1516.75, "x": "1つは第3エンジンを取りつけるボルトだ。"}, {"t": 1519.2833333333333, "x": "事故のあと、ボーイング社の指示で\n改められたと聞いたという。"}, {"t": 1522.6833333333334, "x": "予備の金具も改められたと聞いている、と述べた。"}, {"t": 1525.6666666666667, "x": "もう1つはグラウンドスポイラーという部品だ。"}, {"t": 1528.3333333333333, "x": "飛行試験で立てたり\n立てなかったりした部品と、同じもの？"}, {"t": 1532.0833333333333, "x": "名前は近いが、会議録からはそこまで分からない。"}, {"t": 1535.1333333333334, "x": "1968年に、この部品の不具合が\n2件あったと議員は述べた。"}, {"t": 1539.6833333333334, "x": "7月21日の日航の千歳からの便。"}, {"t": 1542.55, "x": "そして8月26日の全日空の大阪からの便だという。"}, {"t": 1546.3166666666666, "x": "議員は、その資料を出すよう政府に求めた。"}, {"t": 1549.1666666666667, "x": "その資料は出てきたの？"}, {"t": 1550.75, "x": "会議録で確かめられたのは、求めたところまでだ。"}, {"t": 1554.5833333333333, "x": "1970年9月29日、調査団は報告書を大臣に出した。"}, {"t": 1559.2833333333333, "x": "結論は原因不明だった。"}, {"t": 1561.05, "x": "10月13日、航空局長はその理由を3つ挙げた。"}, {"t": 1564.6166666666666, "x": "1つ目は、乗っていた人が全員亡くなっていること。"}, {"t": 1567.85, "x": "2つ目は、夜で暗く、目撃者が\nほとんどいなかったこと。"}, {"t": 1571.65, "x": "3つ目は、飛行記録計を積んでいなかったことだ。"}, {"t": 1574.85, "x": "機がたどった道すじが分からなかったのね。"}, {"t": 1577.45, "x": "具体的な証拠が得られなかったと局長は述べた。"}, {"t": 1580.5, "x": "やむを得ずこの結論になったという。"}, {"t": 1582.5666666666666, "x": "機材にも、原因に関わる不具合は見つからなかった。"}, {"t": 1586.4833333333333, "x": "11月9日、団長は衆議院の特別委員会に呼ばれた。"}, {"t": 1590.4833333333333, "x": "報告書ができるまでの経過を説明している。"}, {"t": 1593.1833333333334, "x": "直すべき欠陥の証拠があれば、\n先に勧告する予定だった。"}, {"t": 1597.0333333333333, "x": "報告書の完成を待たずに出すつもりだったという。"}, {"t": 1599.9666666666667, "x": "しかし、そうした欠陥は見つからなかった。"}, {"t": 1602.7666666666667, "x": "だから勧告は出なかったのね。"}, {"t": 1604.8, "x": "団長は、機が夜の東京湾に入ったあとにも触れた。"}, {"t": 1608.1, "x": "ロングベースの通報から先が、\nどうしても分からなかった。"}, {"t": 1611.5, "x": "いちばん知りたいところが\n空白のまま残ったことになる。"}, {"t": 1614.8, "x": "そこが分からないから原因不明なのね。"}, {"t": 1617.7833333333333, "x": "同じ日、もう1人の参考人が正反対の意見を述べた。"}, {"t": 1621.3666666666666, "x": "航空局で首席飛行審査官を務めていた人だ。"}, {"t": 1624.6333333333334, "x": "引き揚げのとき、海の上で立ち会っていた。"}, {"t": 1627.2666666666667, "x": "現場を自分の目で見ていた人ね。"}, {"t": 1629.4666666666667, "x": "元審査官は、こう述べた。"}, {"t": 1631.3333333333333, "x": "海に着く前に何か起きていなければ、\n説明がつかない。"}, {"t": 1634.7333333333333, "x": "機体の壊れ方と、破片の散らばり方のことだ。"}, {"t": 1637.8666666666666, "x": "根拠は、11月3日に\n大田区産業会館で見た説明だった。"}, {"t": 1642.0333333333333, "x": "辞表を出した教授がスライドで説明した場だという。"}, {"t": 1645.0333333333333, "x": "スライドはおよそ500枚あった。"}, {"t": 1646.95, "x": "模型を水に着ける実験は、およそ700回だったそうだ。"}, {"t": 1650.6666666666667, "x": "700回も実験したの？"}, {"t": 1652.5666666666666, "x": "映像では、第3エンジンが\n外れて右へ飛んでいたという。"}, {"t": 1655.8166666666666, "x": "自分の調べとぴったり\n一致したと、元審査官は話した。"}, {"t": 1659.6666666666667, "x": "その人は、なぜ役所を離れていたの？"}, {"t": 1662.25, "x": "本人の説明では、\n松山の事故の鑑定を頼まれたからだ。"}, {"t": 1666.0666666666666, "x": "役所にいながら鑑定を書くのはおかしい。"}, {"t": 1668.4166666666667, "x": "そう考えて、3月1日にやめたという。"}, {"t": 1671.1833333333334, "x": "鑑定は、その年の11月3日付で終えたと述べている。"}, {"t": 1675.4666666666667, "x": "元審査官は、調査団の決め方にも異を唱えた。"}, {"t": 1678.8166666666666, "x": "教授が雑誌に書いた記事を引いている。"}, {"t": 1680.9833333333333, "x": "教授の研究を検討しないまま、審議を打ち切った。"}, {"t": 1684.2333333333333, "x": "そして多数決で採決したという。"}, {"t": 1686.4333333333334, "x": "多数派が正しいとは限らないと、元審査官は述べた。"}, {"t": 1689.8833333333334, "x": "例に挙げたのは、地動説と中間子の理論だ。"}, {"t": 1692.9166666666667, "x": "どちらも、最初は少数派だった考えね。"}, {"t": 1695.7666666666667, "x": "最初に言い出す人は、必ず少数意見だとも話した。"}, {"t": 1699.2666666666667, "x": "格納庫を2、3回回った程度では\n分からない、とも言った。"}, {"t": 1702.8833333333334, "x": "団長らの責任は重いと、強い言葉も残している。"}, {"t": 1706.35, "x": "同じ調査について、ここまで見方が割れていたのね。"}, {"t": 1710.1, "x": "この日、ある議員は団長に別の質問もした。"}, {"t": 1713.1, "x": "727を選ぶとき団長が後押ししたという\n話が、広まっているという。"}, {"t": 1717.5166666666667, "x": "団長は、全日空の技術委員の1人だったと答えた。"}, {"t": 1721.0166666666667, "x": "全日空は、短い路線に合うジェット機を探していた。"}, {"t": 1724.2666666666667, "x": "候補は3つあった。"}, {"t": 1725.5666666666666, "x": "727と、イギリスのトライデントと、\nフランスのカラベルだ。"}, {"t": 1729.3166666666666, "x": "委員会で資料が配られ、意見を求められたという。"}, {"t": 1732.4833333333333, "x": "調べる人と、選ぶのに関わった\n人が重なっていたってこと？"}, {"t": 1736.45, "x": "議員はそこを問題にした。"}, {"t": 1738.1166666666666, "x": "会議録に残るのは、団長が経過を説明した言葉だ。"}, {"t": 1741.7166666666667, "x": "ボーイング社の助言で案を\n変えたのでは、という質問も出た。"}, {"t": 1745.1166666666666, "x": "団長は、案は\n全委員の総会の意見で直していると答えた。"}, {"t": 1748.8666666666666, "x": "ほかからの助言で簡単に変わるものではないという。"}, {"t": 1752.3666666666666, "x": "別の議員は、727はエンジンの事故が\n多いのではと尋ねた。"}, {"t": 1756.1666666666667, "x": "60件という話があるという。"}, {"t": 1758.1833333333334, "x": "団長は、727は世界でいちばん\n多く使われている機だと答えた。"}, {"t": 1762.3833333333334, "x": "自分の記憶では800機以上だという。"}, {"t": 1764.7333333333333, "x": "60件は重大な事故ではなく、\nトラブルの話だろうと述べた。"}, {"t": 1768.6166666666666, "x": "ほかの機より特別多いとは考えられないそうだ。"}, {"t": 1771.6166666666666, "x": "同じ数字でも、見る人で受け取り方が変わるのね。"}, {"t": 1774.8833333333334, "x": "事故の年に221機だった\n引き渡しは、800機を超えていた。"}, {"t": 1779.75, "x": "元審査官は、引き揚げの様子も細かく語った。"}, {"t": 1782.9666666666667, "x": "最後のころに揚がった尾部には、\n水がいっぱい入っていた。"}, {"t": 1786.2666666666667, "x": "引き上げる途中、垂直安定板にロープが食い込んだ。"}, {"t": 1789.5666666666666, "x": "そこは、それまで壊れていなかった所だという。"}, {"t": 1792.5666666666666, "x": "引き上げる時に新しい傷がついたのね。"}, {"t": 1795.1833333333334, "x": "胴体がちぎれそうになったこともあった。"}, {"t": 1797.5333333333333, "x": "いったん水に戻して縛り直したそうだ。"}, {"t": 1799.9666666666667, "x": "あとで、窓を割って\nロープを通したのではと問題になった。"}, {"t": 1803.3, "x": "最初から物を見ていれば\n分かることだと、元審査官は述べた。"}, {"t": 1807.05, "x": "当時は朝5時ごろに家を出ていた。"}, {"t": 1809.0166666666667, "x": "帰りは夜中の1時か2時だったという。"}, {"t": 1811.4666666666667, "x": "眠る時間もほとんど無かったのね。"}, {"t": 1814.2166666666667, "x": "元審査官は、第3エンジンのボルトの話もした const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
