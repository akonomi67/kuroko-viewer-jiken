<style>

<script>
const D={"name": "101", "file": "101_編集用", "dur": 2176.26665625, "segs": [], "subs": [{"t": 0.0, "x": "東京都港区南青山。表参道から少し入った通りだ。"}, {"t": 4.116666666666666, "x": "1995年の春、この通りの一角に、\nテレビカメラが何十台も並んでいた日がある。"}, {"t": 9.966666666666667, "x": "何十台？"}, {"t": 10.9, "x": "新聞社もいた。雑誌もいた。"}, {"t": 12.733333333333333, "x": "通りの向かいには人だかりもできていた。"}, {"t": 15.166666666666666, "x": "そこにある建物を、毎日張り込んでいたんだ。"}, {"t": 18.0, "x": "そして、その建物の前で、人が一人刺された。"}, {"t": 21.483333333333334, "x": "……カメラの前で？"}, {"t": 22.583333333333332, "x": "カメラの前でだ。"}, {"t": 23.7, "x": "これだけカメラが回っている中で\n起きた事件は、ほとんど例が無い。"}, {"t": 27.516666666666666, "x": "映像は残っている。何時何分かも分かっている。"}, {"t": 30.5, "x": "刺した人物も、その場で捕まっている。"}, {"t": 33.166666666666664, "x": "じゃあ、分からないことなんて無いんじゃないの？"}, {"t": 35.7, "x": "ところが、一つだけ残っている。"}, {"t": 37.85, "x": "なぜ刺したのか。誰かに頼まれたのか。"}, {"t": 40.38333333333333, "x": "そこだけが、公の記録の上では、いまも動いていない。"}, {"t": 43.86666666666667, "x": "事件の4日後、警察庁の局長が国会でこう述べている。"}, {"t": 47.56666666666667, "x": "「現在、犯行の動機、\n背景等について捜査中でございます」"}, {"t": 51.65, "x": "それ、いつの話？"}, {"t": 53.18333333333333, "x": "1995年4月27日だ。"}, {"t": 55.86666666666667, "x": "今年が2026年だから、31年前になる。"}, {"t": 59.45, "x": "今回は、その31年前の夜と、そのあと\n国会に残った記録を追いかける。"}, {"t": 64.51666666666667, "x": "村井秀夫刺殺事件だ。"}, {"t": 66.11666666666666, "x": "先に、この回の立ち方を言っておく。"}, {"t": 68.48333333333333, "x": "この動画では、誰かを黒幕だと決めない。"}, {"t": 71.08333333333333, "x": "当局が国会で述べたこと。"}, {"t": 72.8, "x": "議員が国会で述べたこと。"}, {"t": 74.43333333333334, "x": "報道が伝えたこと。"}, {"t": 75.88333333333334, "x": "この三つを、毎回分けて言う。"}, {"t": 77.96666666666667, "x": "混ぜないのね。"}, {"t": 79.03333333333333, "x": "混ぜない。混ぜた瞬間に、この事件は分からなくなる。"}, {"t": 82.96666666666667, "x": "その夜に行く前に、その前の1か月を見ておく。"}, {"t": 86.01666666666667, "x": "1995年3月20日の朝。"}, {"t": 88.58333333333333, "x": "東京の地下鉄で、地下鉄サリン事件が起きた。"}, {"t": 91.8, "x": "月曜の朝ね。"}, {"t": 93.05, "x": "通勤の時間帯だ。複数の路線で同時に起きている。"}, {"t": 96.43333333333334, "x": "この日から、4月23日までが、ちょうど34日だ。"}, {"t": 100.43333333333334, "x": "1か月ちょっと。"}, {"t": 101.71666666666667, "x": "その34日に何が起きたか、順番に並べる。"}, {"t": 105.06666666666666, "x": "出典は公安調査庁の「\nオウム真理教問題デジタルアーカイブ」の年表だ。"}, {"t": 109.83333333333333, "x": "役所が自分で作って、いまも誰でも開ける。"}, {"t": 112.78333333333333, "x": "まず3月19日。地下鉄サリンの前の日だ。"}, {"t": 115.85, "x": "年表には「東京総本部火炎びん\n投てき事件」と書いてある。"}, {"t": 119.83333333333333, "x": "総本部って、さっきの南青山の建物？"}, {"t": 122.86666666666666, "x": "そうだ。教団の東京総本部が、\n火炎びんを投げ込まれている。"}, {"t": 126.65, "x": "そして翌20日の朝に、地下鉄サリン事件だ。"}, {"t": 129.7, "x": "3月22日、警視庁などが\n教団の施設を一斉に捜索している。"}, {"t": 134.31666666666666, "x": "どのくらいの規模だったの。"}, {"t": 136.0, "x": "平成8年の警察白書に数字が書いてある。"}, {"t": 138.81666666666666, "x": "「約2,500人による史上空前の態勢」だ。"}, {"t": 142.03333333333333, "x": "この日、25箇所を捜索している。"}, {"t": 144.53333333333333, "x": "……二千五百人。"}, {"t": 145.73333333333332, "x": "ここから、報道が施設に張り付くようになる。"}, {"t": 148.51666666666668, "x": "3月30日には、警察庁の長官が撃たれた。"}, {"t": 151.73333333333332, "x": "國松長官狙撃事件だ。"}, {"t": 153.71666666666667, "x": "これは一度扱った。ここでは日付だけ置いておく。"}, {"t": 156.78333333333333, "x": "4月19日、サリン等による\n人身被害の防止に関する法律が成立。"}, {"t": 161.56666666666666, "x": "……一日ごとに何か起きてる。"}, {"t": 163.48333333333332, "x": "そういう1か月だった。そして、4月23日が来る。"}, {"t": 167.81666666666666, "x": "なぜ、南青山にあれだけ人が集まっていたのか。"}, {"t": 171.15, "x": "捜索のあとだから？"}, {"t": 172.63333333333333, "x": "それが大きい。一斉捜索から1か月、ここが\n一番人の出入りが見える場所だった。"}, {"t": 177.85, "x": "教団の東京総本部だ。"}, {"t": 179.45, "x": "幹部が出入りし、会見もここでやる。"}, {"t": 181.76666666666668, "x": "テレビ各社が車を停めて、朝から晩まで待っていた。"}, {"t": 185.06666666666666, "x": "これは推測じゃない。"}, {"t": 186.23333333333332, "x": "1年後、国会でその現場の話が出てくる。"}, {"t": 189.26666666666668, "x": "1996年4月2日、参議院の逓信委員会だ。"}, {"t": 193.48333333333332, "x": "逓信って、放送の委員会？"}, {"t": 195.55, "x": "そうだ。この日、テレビ局の社長と\n常務が参考人として呼ばれている。"}, {"t": 199.85, "x": "そこで常務が、あの夜の映像について答えている。"}, {"t": 202.86666666666667, "x": "外の制作会社のカメラマンが撮ったものだ、と。"}, {"t": 205.93333333333334, "x": "そのカメラマンは、三日間ここを取材していた。"}, {"t": 208.98333333333332, "x": "三日間？"}, {"t": 209.85, "x": "青山本部に集まる人たちを撮っていた、という答弁だ。"}, {"t": 213.3, "x": "つまり、あの通りには前から人がいた。"}, {"t": 215.71666666666667, "x": "報道の車。カメラ。取材班。"}, {"t": 217.85, "x": "集まってきた人たち。"}, {"t": 219.46666666666667, "x": "そして、そこに刺した人物も混ざっていた。"}, {"t": 222.35, "x": "……その中にいたの。"}, {"t": 223.66666666666666, "x": "常務はそう答えている。ここは第17章でもう一度やる。"}, {"t": 227.11666666666667, "x": "先に、あの夜そのものを置く。"}, {"t": 229.68333333333334, "x": "1995年4月23日。日曜日だ。"}, {"t": 233.16666666666666, "x": "この日の夜、南青山の東京総本部の前に、\n一台の乗用車が着いた。"}, {"t": 238.05, "x": "誰が乗っていたの。"}, {"t": 239.38333333333333, "x": "教団の幹部だった、村井秀夫という人だ。"}, {"t": 242.13333333333333, "x": "ここから先は、私の言葉では書かない。"}, {"t": 244.9, "x": "どうして？"}, {"t": 245.73333333333332, "x": "この場面には公の記録が一つある。\nそのまま置いたほうが正確だ。"}, {"t": 249.93333333333334, "x": "事件から4日後、1995年4月27日。"}, {"t": 253.66666666666666, "x": "参議院の地方行政委員会。"}, {"t": 255.58333333333334, "x": "答えたのは警察庁の警備局長だ。"}, {"t": 257.9166666666667, "x": "杉田和博 局長という。"}, {"t": 259.95, "x": "この人が、委員会の冒頭でその日の報告をしている。"}, {"t": 263.3333333333333, "x": "読み上げる。"}, {"t": 264.0833333333333, "x": "「次に、オウム真理教の幹部に対する\n殺人事件についてでありますけれども、\n事案の概要は、"}, {"t": 269.56666666666666, "x": "四月二十三日の午後八時三十八分ころ」"}, {"t": 272.6666666666667, "x": "「オウム真理教幹部の村井秀夫氏が乗用車で\nオウム真理教の東京総本部前に到着した際」"}, {"t": 278.18333333333334, "x": "「同所で待ち伏せしておりました\n自称右翼団体の構成員が\n包丁で村井氏の腹部等を刺し」"}, {"t": 283.45, "x": "「被害者は都立広尾病院に収容されましたけれども、\n出血性ショック等によって死亡いたしました」"}, {"t": 289.51666666666665, "x": "……それだけ？"}, {"t": 290.4166666666667, "x": "それだけだ。"}, {"t": 291.31666666666666, "x": "時刻、場所、凶器、運ばれた病院、死因。"}, {"t": 294.4166666666667, "x": "政府の記録に残っているのは、この範囲だ。"}, {"t": 297.15, "x": "この動画でも、この範囲を越えない。"}, {"t": 299.1166666666667, "x": "刺す場面は描かない。"}, {"t": 300.71666666666664, "x": "うん。"}, {"t": 301.23333333333335, "x": "一つ言い添えておく。"}, {"t": 302.3833333333333, "x": "起きた時刻は、資料によって数字が違う。"}, {"t": 305.1, "x": "この動画では、政府が国会で述べた\n「午後八時三十八分ころ」を使う。"}, {"t": 309.9, "x": "そして、この答弁には続きがある。\nそこが、この事件の本体だ。"}, {"t": 314.73333333333335, "x": "続きはこうだ。"}, {"t": 315.76666666666665, "x": "「犯人は現行犯逮捕されまして、現在、犯行の動機、\n背景等について捜査中でございますけれども」"}, {"t": 322.23333333333335, "x": "「今後取り調べ及び裏づけ捜査を徹底いたしまして、\n本件事件の全容解明に努めたいと考えております」"}, {"t": 328.9166666666667, "x": "現行犯逮捕。その場で捕まってるのね。"}, {"t": 331.78333333333336, "x": "その場でだ。逃げていない。"}, {"t": 333.4166666666667, "x": "普通、事件は誰がやったかを探すのに時間がかかる。"}, {"t": 336.73333333333335, "x": "この事件はそこが最初から無い。"}, {"t": 338.71666666666664, "x": "映像もある。時刻も分かっている。"}, {"t": 340.85, "x": "それでも「捜査中」と言われたのは、動機と背景だ。"}, {"t": 344.4166666666667, "x": "捕まえた人に聞けば分かるんじゃないの。"}, {"t": 346.8833333333333, "x": "そう思うよな。"}, {"t": 347.81666666666666, "x": "だが当局は、そこを「捜査中」としか言っていない。"}, {"t": 351.15, "x": "そして公の記録では、ここから先が埋まらない。"}, {"t": 354.23333333333335, "x": "1年半後、「背後関係の解明には\n至っていない」と国会で言う議員が出る。"}, {"t": 359.0, "x": "……1年半たっても？"}, {"t": 360.45, "x": "1年半たってもだ。そこは第20章でやる。"}, {"t": 363.4, "x": "もう一つ、この4月27日の答弁で分かることがある。"}, {"t": 367.0833333333333, "x": "局長は、この報告の直前に、\n別の事件の報告もしている。"}, {"t": 371.23333333333335, "x": "3月30日の長官狙撃事件だ。"}, {"t": 373.73333333333335, "x": "「今日まで犯人の特定には\n至っておりません」と述べている。"}, {"t": 377.21666666666664, "x": "「これまで二百件以上の目撃情報等が\n寄せられて」いる、とも言っている。"}, {"t": 381.75, "x": "同じ日に、二つの事件の報告をしてるのね。"}, {"t": 384.85, "x": "そういう時期だった。"}, {"t": 386.7, "x": "ここで、日付の話をしておく。"}, {"t": 388.85, "x": "事件が起きたのは4月23日の夜だ。"}, {"t": 391.6, "x": "ただ、亡くなったのは、その日ではない。"}, {"t": 394.18333333333334, "x": "日をまたいだの？"}, {"t": 395.3333333333333, "x": "またいだ。翌24日だ。"}, {"t": 397.2, "x": "公安調査庁の年表には、こう書いてある。"}, {"t": 399.8833333333333, "x": "「1995.4.23 幹部構成員・\n村井秀夫刺殺事件（翌24日死亡）」"}, {"t": 405.9, "x": "……一行ね。"}, {"t": 406.8333333333333, "x": "一行だ。役所の年表では、\nこの事件はこれで終わっている。"}, {"t": 410.5833333333333, "x": "時刻まで書いた記録は、1年後に国会に出てくる。"}, {"t": 413.9, "x": "1996年4月2日、参議院逓信委員会。"}, {"t": 417.6, "x": "保坂三蔵 議員の発言だ。"}, {"t": 419.76666666666665, "x": "「このとき幹部中の幹部の村井が刺されて、\nそして翌日の二十四日の午前三時に死亡している」"}, {"t": 425.7, "x": "午前三時。"}, {"t": 426.73333333333335, "x": "ただ、ここは正直に言っておく。\nこの時刻は資料によって食い違う。"}, {"t": 430.78333333333336, "x": "年表は「翌24日」までしか書いていない。"}, {"t": 433.8333333333333, "x": "警察庁の答弁は時刻を述べていない。"}, {"t": 436.23333333333335, "x": "だからこの動画では、\n「翌24日に亡くなった」までにとどめる。"}, {"t": 440.3333333333333, "x": "はっきりしないところは、\nはっきりしないままにするのね。"}, {"t": 443.6333333333333, "x": "そうする。数字は、出どころが言えるものだけ使う。"}, {"t": 446.65, "x": "ここまでが、この事件で決まっていることだ。"}, {"t": 449.26666666666665, "x": "ここから先が、31年間、決まっていない。"}, {"t": 452.98333333333335, "x": "ここからが一つ目の山だ。"}, {"t": 454.73333333333335, "x": "この人が亡くなったことで、捜査はどうなったのか。"}, {"t": 457.8333333333333, "x": "同じ4月27日、局長の報告のあとの質疑だ。"}, {"t": 461.53333333333336, "x": "有働正治 議員が、こう聞いている。"}, {"t": 463.9166666666667, "x": "「オウム真理教の村井氏が刺殺されたことで\nオウム真理教に対する捜査、これは"}, {"t": 468.4, "x": "一定の支障があるのではないかと\n国民は懸念している」"}, {"t": 471.5833333333333, "x": "それは、みんな思うところよね。"}, {"t": 473.65, "x": "思うところだ。"}, {"t": 474.6333333333333, "x": "答えたのは、垣見隆 刑事局長だ。"}, {"t": 477.5, "x": "「現在捜査を進めております個別の事件につきまして、\n特定の個人がどのような立場にあるのか」"}, {"t": 483.3833333333333, "x": "「あるいはその人物を欠いた場合に\n捜査にどのような支障が出るかについては"}, {"t": 487.0, "x": "申し述べることを\n差し控えさせていただきたいと存じます」"}, {"t": 490.65, "x": "……答えていないのね。"}, {"t": 491.96666666666664, "x": "答えていない。"}, {"t": 492.9166666666667, "x": "そこで、議員は聞き直した。"}, {"t": 494.65, "x": "野中広務 国家公安委員長だ。"}, {"t": 497.03333333333336, "x": "この答えが、この日の記録で一番はっきりしている。"}, {"t": 500.23333333333335, "x": "「捜査中の重要な位置づけにあった\n村井氏がかのような刺殺事件で\n死亡をいたしましたことはまことに"}, {"t": 505.3833333333333, "x": "残念でありまして」"}, {"t": 506.9, "x": "「全然支障がないと言ったら\nうそになると私は思いますけれども」"}, {"t": 510.75, "x": "……うそになる。"}, {"t": 511.7, "x": "そう言っている。"}, {"t": 512.6166666666667, "x": "そのうえで、「支障がないようには十分な\n体制をもって取り組んでおる」と続けた。"}, {"t": 517.2166666666667, "x": "ここで確認しておく。これは、誰かが\n口を封じたという話ではない。"}, {"t": 521.4666666666667, "x": "重要な立場の人が亡くなったので\n影響はある、と大臣が認めた。その話だ。"}, {"t": 526.6333333333333, "x": "そこは分けておかないといけないのね。"}, {"t": 528.85, "x": "分けないといけない。"}, {"t": 529.8833333333333, "x": "混ぜると、この事件はすぐ別のものになる。"}, {"t": 533.25, "x": "同じ質疑の中で、議員はもう一つ聞いている。"}, {"t": 536.1666666666666, "x": "「村井氏に対する任意捜査、これをもっと\n早く着手すべきではなかったかという\n指摘があるわけですが」"}, {"t": 542.1166666666667, "x": "生きているうちに話を聞けなかったのか、ってこと？"}, {"t": 545.2, "x": "そういう質問だ。"}, {"t": 546.4, "x": "垣見隆 刑事局長の答えはこうだ。"}, {"t": 549.1333333333333, "x": "「特定の個人が捜査の対象になっているか"}, {"t": 551.7, "x": "どうかについてはお答えを\n差し控えさせていただきたいと存じます」"}, {"t": 555.2666666666667, "x": "そのうえで、一般論としてこう述べた。"}, {"t": 557.65, "x": "誰をいつ、任意で呼ぶか。あるいは強制でやるか。"}, {"t": 560.7, "x": "それは捜査の流れと証拠の集まり方を見て決める、と。"}, {"t": 564.2166666666667, "x": "やっぱり、この人については答えないのね。"}, {"t": 566.9333333333333, "x": "答えない。捜査中だからだ。"}, {"t": 568.8666666666667, "x": "ここまでが、事件から4日後の記録になる。"}, {"t": 571.6166666666667, "x": "この時点で公の記録に残ったのは、二つだ。"}, {"t": 574.7666666666667, "x": "一つ。事実関係は、時刻から\n死因まではっきり述べられた。"}, {"t": 578.7166666666667, "x": "二つ。動機と背景は「捜査中」で、\n先は何も述べられなかった。"}, {"t": 583.35, "x": "この二つが、そのまま残るってこと？"}, {"t": 585.9166666666666, "x": "残る。そこがこの事件の形だ。"}, {"t": 588.8666666666667, "x": "実は、同じ4月27日に、もう一つの委員会でも\nこの事件が話題になっている。"}, {"t": 594.3333333333334, "x": "どこの委員会？"}, {"t": 595.4666666666667, "x": "参議院の逓信委員会だ。"}, {"t": 597.0833333333334, "x": "放送を扱う委員会だな。"}, {"t": 598.9, "x": "中尾則幸 議員が、こう切り出している。"}, {"t": 601.5666666666667, "x": "「この現場を私はテレビの報道で見ました。\nまたテロが起こったなと」"}, {"t": 605.65, "x": "この人も、テレビで見たのね。"}, {"t": 607.7166666666667, "x": "20年以上この現場で仕事をしてきた\n人だ、と自分で言っている。"}, {"t": 611.6833333333333, "x": "そして、こういう言い方をした。"}, {"t": 613.5833333333334, "x": "「あの豊田商事の刺殺事件を重ね合わせますと、\n今大変な事態に立ち入っているなと思います」"}, {"t": 619.3833333333333, "x": "豊田商事……。"}, {"t": 620.4333333333333, "x": "1985年に、報道陣が集まっている\n中で会長が刺された事件だ。"}, {"t": 625.3666666666667, "x": "10年おいて、同じ形のことがまた\n起きた。そう見た議員がいた。"}, {"t": 629.4, "x": "そのうえで、この人はこう言っている。"}, {"t": 631.55, "x": "「殺害当時のあの映像を見まして、\n確かにあれは事実でございます」"}, {"t": 635.55, "x": "「事実であるから真実であると\n私は思わないわけです」"}, {"t": 638.95, "x": "……事実だけど、真実じゃない。"}, {"t": 641.0166666666667, "x": "映っていることが全部だとは\n限らない、という意味だろうな。"}, {"t": 644.3, "x": "この議員は、新聞の読者欄も引いている。"}, {"t": 646.9666666666667, "x": "「法的な裁きの前に報道に名をかりて\nメディアが事実上人を裁いてしまう風潮」"}, {"t": 651.8166666666667, "x": "大臣は何て答えたの？"}, {"t": 653.5666666666667, "x": "大出俊 郵政大臣が答えている。"}, {"t": 655.9666666666667, "x": "「私も見ていて、ほとんど同じような\nやっぱり受け取り方をしております」"}, {"t": 660.05, "x": "事件の4日後に、国会ではもうこの話をしていた。"}, {"t": 663.9333333333333, "x": "ここが、この回で一番中身のある記録だ。"}, {"t": 666.7333333333333, "x": "1995年5月19日。"}, {"t": 669.0333333333333, "x": "参議院の地方行政委員会、第13号。"}, {"t": 671.9, "x": "事件から約1か月後。"}, {"t": 673.4166666666666, "x": "同じ杉田和博 局長が答えている。"}, {"t": 676.1833333333333, "x": "全部読む。"}, {"t": 676.9833333333333, "x": "「御指摘の事件の実行犯につきましては、\n御案内のとおり、既に一名被疑者を\n検挙いたしております」"}, {"t": 683.15, "x": "「これは既に起訴されておりますので\n現時点では被告人でありますけれども」"}, {"t": 687.5166666666667, "x": "もう起訴されてたのね。"}, {"t": 689.05, "x": "1か月で起訴まで行っている。ここは早い。"}, {"t": 691.5833333333334, "x": "続きだ。"}, {"t": 692.35, "x": "「彼はある右翼団体の構成員ということを\n称しておりました」"}, {"t": 695.8166666666667, "x": "「しかし、この団体は活動の実態が\n全くないということが判明をいたしました」"}, {"t": 700.8, "x": "……実態が、全くない？"}, {"t": 702.55, "x": "そう述べている。名乗っていた団体は、\n中身が無かった、ということだ。"}, {"t": 706.7833333333333, "x": "4月27日の答弁で「自称右翼団体」と\n言っていたのは、これのことだな。"}, {"t": 711.8833333333333, "x": "そして、ここからが大事だ。"}, {"t": 713.75, "x": "「また、その後本件の共犯者といたしまして\n暴力団の幹部を逮捕いたしております」"}, {"t": 718.9166666666666, "x": "共犯がいたの。"}, {"t": 720.1333333333333, "x": "当局がそう述べている。もう一人、逮捕されている。"}, {"t": 723.2666666666667, "x": "「この右翼団体と暴力団の関係につきましては、"}, {"t": 726.25, "x": "逮捕したこの暴力団幹部が\n実体のない政治団体の結成に"}, {"t": 729.9666666666667, "x": "関与したものであるということがわかっております」"}, {"t": 732.8166666666667, "x": "……中身の無い団体を、その人が作っていた。"}, {"t": 735.7833333333333, "x": "そう説明されている。"}, {"t": 737.15, "x": "ここでいったん止めて、確認しておく。"}, {"t": 739.5, "x": "この動画では、逮捕された\n人物の名前も、組織の名前も出さない。"}, {"t": 743.75, "x": "裁判の結果を、公的な記録で\n確かめられていないからだ。"}, {"t": 747.55, "x": "じゃあ、どこまでが言えるの？"}, {"t": 749.2166666666667, "x": "「共犯として逮捕された\n人がいる」と当局が国会で述べた。"}, {"t": 752.8833333333333, "x": "言えるのは、そこまでだ。"}, {"t": 755.1166666666667, "x": "5月19日の答弁には、まだ続きがある。"}, {"t": 758.0, "x": "「本事件に関しましては、現在犯行の動機、\n背景その他について鋭意捜査中でございますけれども」"}, {"t": 764.1333333333333, "x": "「いずれにいたしましても今後取り調べ、"}, {"t": 766.2166666666667, "x": "裏づけ捜査を徹底いたしまして\n全容の解明をいたしてまいりたい」"}, {"t": 770.2166666666667, "x": "……4月27日と、ほとんど同じ言い方ね。"}, {"t": 773.2666666666667, "x": "ほとんど同じだ。1か月経って、身柄は二人になった。"}, {"t": 776.8166666666667, "x": "だが動機と背景は、まだ「捜査中」のままだった。"}, {"t": 780.25, "x": "この日の質問者も有働正治 議員だ。"}, {"t": 782.8, "x": "質問のほうも読んでおく。"}, {"t": 784.4666666666667, "x": "「オウム真理教の科学部門の最高責任者と\n言われる村井氏刺殺をめぐりまして」"}, {"t": 789.15, "x": "「暴力団あるいは右翼との\nかかわりなど容疑者の背後関係」"}, {"t": 792.6666666666666, "x": "「報道では刺殺依頼をめぐって\n資金の流れもあったという指摘まで、これは"}, {"t": 796.35, "x": "報道でありますけれども、あるわけであります」"}, {"t": 799.45, "x": "……お金の話まで出てるじゃない。"}, {"t": 801.3833333333333, "x": "出ている。だが、よく聞いてほしい。"}, {"t": 803.5, "x": "この議員は、言いながら自分で断っている。"}, {"t": 805.9333333333333, "x": "「これは報道であります」と。"}, {"t": 807.8166666666667, "x": "……自分で線を引いてるのね。"}, {"t": 809.55, "x": "引いている。1995年の国会で、\n質問する側がすでにそこを分けていた。"}, {"t": 814.7833333333333, "x": "そして政府側は、この「資金の流れ」を\n肯定も否定もしていない。"}, {"t": 819.05, "x": "答えたのはさっきの一文だ。「鋭意捜査中」"}, {"t": 821.8, "x": "この動画でも、同じ線を引く。"}, {"t": 823.8333333333334, "x": "報道がそう伝えた話は、そういう話として置く。"}, {"t": 826.95, "x": "事実の欄には入れない。"}, {"t": 829.1333333333333, "x": "亡くなった村井秀夫という人は、\n教団の中で何をしていたのか。"}, {"t": 833.0, "x": "ここも、公の記録に出てくる範囲でやる。"}, {"t": 835.7166666666667, "x": "まず、平成8年の警察白書だ。"}, {"t": 838.1333333333333, "x": "教団の組織についてこう書いてある。"}, {"t": 840.3833333333333, "x": "「六年六月ころから、教団代表は、\n自らを「神聖法皇」と称し」"}, {"t": 845.2, "x": "「国の行政機関に模した省庁制を導入し」"}, {"t": 848.0, "x": "「「科学技術省」、「建設省」、「自治省」"}, {"t": 850.45, "x": "等合計約二十の省庁を設置し、\n一種の疑似国家の体裁を取るに至った」"}, {"t": 855.3, "x": "……省庁ごっこね。"}, {"t": 856.5333333333333, "x": "役所の文書に「疑似国家」と書いてある。"}, {"t": 859.25, "x": "ただし、どの省庁を誰が\n担当していたかは書かれていない。"}, {"t": 862.8333333333334, "x": "じゃあ、村井さんの役職は？"}, {"t": 864.7666666666667, "x": "政府の答弁にあるのは「幹部」という言葉だけだ。"}, {"t": 867.9666666666667, "x": "それ以外は全部、議員や参考人の言い方になる。"}, {"t": 871.0, "x": "たとえば事件の3日後、\n1995年4月26日の衆議院文教委員会。"}, {"t": 876.4333333333333, "x": "石田勝之 議員が、こう言っている。"}, {"t": 878.8666666666667, "x": "「せんだって刺殺された\nオウム真理教の「科学技術庁長官」の村井氏が」"}, {"t": 883.5166666666667, "x": "カギ括弧付きの、科学技術庁長官。"}, {"t": 886.2666666666667, "x": "有働正治 議員は「科学部門の最高責任者と\n言われる」と言っていた。"}, {"t": 890.9, "x": "保坂三蔵 議員は「幹部中の幹部」。"}, {"t": 893.4333333333333, "x": "呼び方は人によってばらばらだ。"}, {"t": 895.5, "x": "だからこの動画では、政府が\n使った「幹部」を基本にする。"}, {"t": 899.3666666666667, "x": "石田勝之 議員の発言には、続きがある。"}, {"t": 902.4333333333333, "x": "「オウム真理教の総資産というのは\n約一千億あるんだと豪語しておったわけであります」"}, {"t": 907.3, "x": "一千億。"}, {"t": 908.2333333333333, "x": "ただし、石田勝之 議員自身が、すぐこう続けている。"}, {"t": 912.0, "x": "「実際にはそんなにはないと\n私は理解をしておりますが」"}, {"t": 915.3666666666667, "x": "本人も信じてないのね。"}, {"t": 917.1333333333333, "x": "信じていない。だからこの数字は、\n教団の資産額としては使えない。"}, {"t": 921.3666666666667, "x": "使えるのは、この人が\n教団の外向きの顔の一人だった、という部分だけだ。"}, {"t": 926.1833333333333, "x": "この日、与謝野馨 文部大臣は、\n資産についてこう答えている。"}, {"t": 930.4, "x": "「報告を聴取する権限はございませんし」\n「伝聞による現実しかわからない」"}, {"t": 935.0, "x": "……役所も知らないんだ。"}, {"t": 936.4833333333333, "x": "当時の制度では、そうだった。"}, {"t": 938.3666666666667, "x": "この日は、小川元 議員も事件に触れている。"}, {"t": 941.2, "x": "「つい最近は、オウム真理教の最高幹部の一人が\n刺殺されるというような事件も起こっております」"}, {"t": 946.8166666666667, "x": "解散命令の請求を急ぐべきだ、という\n文脈で出てきている。"}, {"t": 951.2333333333333, "x": "事件から3週間ちょっと後。"}, {"t": 952.95, "x": "1995年5月16日。"}, {"t": 955.5833333333334, "x": "衆議院の本会議で、正森成二 議員が\n政府に質問している。"}, {"t": 959.7333333333333, "x": "この日は財政演説に対する質問だった。\nただ、冒頭で教団の話をしている。"}, {"t": 964.85, "x": "その中に、この一文がある。"}, {"t": 966.7666666666667, "x": "「引き続き、残存サリンの所在の有無、\n松本事件ほか多数の関連事件の解明」"}, {"t": 972.0833333333334, "x": "「口封じのため殺されたとも見られる\n村井秀夫幹部の殺害背景」"}, {"t": 976.0333333333333, "x": "「宗教法人の解散、住民の要望にこたえた\n各地の関連施設の撤去、報復テロの防止など」"}, {"t": 982.1333333333333, "x": "「万全の方策を速やかに講ずべきであります」"}, {"t": 985.0666666666667, "x": "……口封じ、って言葉が出てるのね。"}, {"t": 987.2833333333333, "x": "出ている。国会の本会議の記録に、\nはっきり残っている。"}, {"t": 990.9, "x": "ただし、ここが一番大事なところだ。"}, {"t": 993.2833333333333, "x": "これは議員がそう述べたという記録であって、\nそうだったという認定ではない。"}, {"t": 997.5166666666667, "x": "言い方も、「とも見られる」になってる。"}, {"t": 999.9333333333333, "x": "よく見たな。断定していない。"}, {"t": 1001.7, "x": "「口封じのため殺されたとも見られる」だ。"}, {"t": 1004.3166666666667, "x": "そして、この議員が求めたのは、\n「殺害背景」を解明することだ。"}, {"t": 1008.6833333333333, "x": "背景が分かっていない、だから\n調べてくれ、という質問なんだ。"}, {"t": 1012.6, "x": "分かっていない前提なのね。"}, {"t": 1014.4166666666666, "x": "そうだ。"}, {"t": 1015.0166666666667, "x": "この一文は、この事件の見方の出発点として、\nいまでもよく引かれる。"}, {"t": 1019.5833333333334, "x": "引くときは「誰が」「いつ」\n言ったかまで一緒に言う必要がある。"}, {"t": 1023.4333333333333, "x": "そこを落とすと、国が認めた\n話のように聞こえてしまう。"}, {"t": 1027.5, "x": "では、この質問に、政府はどう答えたのか。"}, {"t": 1030.5166666666667, "x": "総理が答えるのよね、本会議だから。"}, {"t": 1033.1, "x": "答えている。村山富市 内閣総理大臣だ。"}, {"t": 1036.3833333333334, "x": "答弁を読む。"}, {"t": 1037.3, "x": "「地下鉄サリン事件につきましては、発生当初から\n警察が総力を挙げて捜査を行ってきたところであり」"}, {"t": 1043.5333333333333, "x": "「その結果、オウム真理教幹部らによる\n組織的犯罪であることを解明し、本日、"}, {"t": 1048.5666666666666, "x": "麻原彰晃を検挙いたしたところでございます」"}, {"t": 1051.5833333333333, "x": "……本日？"}, {"t": 1052.4333333333334, "x": "この日だ。1995年5月16日に、\n教団の代表が逮捕されている。"}, {"t": 1057.7166666666667, "x": "本会議のその日に、逮捕の報告が入っている形だ。"}, {"t": 1061.25, "x": "総理の答弁は、このあとこう続く。"}, {"t": 1063.5166666666667, "x": "「引き続き徹底した捜査を行い、関連する\n事件を含めた事案の全容を早期に解明する」"}, {"t": 1069.25, "x": "……村井さんの話は？"}, {"t": 1070.6833333333334, "x": "出てこない。"}, {"t": 1071.5833333333333, "x": "出てこない。"}, {"t": 1072.4833333333333, "x": "この答弁に「村井」という言葉は一度も出てこない。"}, {"t": 1075.6833333333334, "x": "「関連する事件を含めた」でまとめて答えている形だ。"}, {"t": 1079.25, "x": "はぐらかした、と取ることもできる。"}, {"t": 1081.4, "x": "本会議はまとめて答えるのが\n普通だ、と取ることもできる。"}, {"t": 1084.9, "x": "どちらが正しいかは、私には決められない。"}, {"t": 1087.7333333333333, "x": "じゃあ、どう言えばいいの。"}, {"t": 1089.1833333333334, "x": "事実だけ言う。この質問に対する総理の答弁に、\n村井秀夫の名前は無かった。それだけだ。"}, {"t": 1095.5, "x": "次は、1995年6月7日。"}, {"t": 1098.3, "x": "衆議院の法務委員会だ。"}, {"t": 1100.05, "x": "同じ正森成二 議員が、この日は事件を並べている。"}, {"t": 1103.5666666666666, "x": "読み上げる。"}, {"t": 1104.35, "x": "「オウム真理教の麻原代表も加担し、主導、"}, {"t": 1107.1166666666666, "x": "指示して、地下鉄サリン殺人事件、仮谷氏拉致事件、\n松本サリン事件、坂本弁護士拉致事件」"}, {"t": 1113.5666666666666, "x": "「それから教団内部で行方不明になった多数の事件」"}, {"t": 1116.7333333333333, "x": "「そのほかに、オウム関連と疑われている"}, {"t": 1119.0166666666667, "x": "國松警察庁長官狙撃事件、あるいは\n村井秀夫氏刺殺事件等々」"}, {"t": 1123.55, "x": "「非常にたくさんの事件が\n報道され、あるいは疑惑を招いております」"}, {"t": 1127.6, "x": "この事件が、他の事件と同じ列に並んでるのね。"}, {"t": 1131.0166666666667, "x": "並んでいる。ただし、並べ方が違う。"}, {"t": 1133.5333333333333, "x": "前半の事件は「麻原代表も加担し、主導、\n指示して」という言い方になっている。"}, {"t": 1138.9, "x": "後半の二つ、長官狙撃と村井氏刺殺は、\n「オウム関連と疑われている」だ。"}, {"t": 1144.0666666666666, "x": "……疑われている、止まり。"}, {"t": 1145.7, "x": "止まりだ。1995年6月の時点で、\nこの二つはまだそこにいた。"}, {"t": 1150.5333333333333, "x": "翌日の6月8日、参議院の法務委員会でも\n名前が出ている。"}, {"t": 1154.6, "x": "山崎順子 議員が、資産の話でこう言った。"}, {"t": 1157.8166666666666, "x": "「刺殺された村井さんの発言によれば\n一千億というようなことが出ている」"}, {"t": 1162.0833333333333, "x": "また一千億ね。"}, {"t": 1163.3833333333334, "x": "同じ数字が回っている。"}, {"t": 1164.8, "x": "確かめた人はいない。"}, {"t": 1166.2666666666667, "x": "この章で押さえたいのは一つだけだ。"}, {"t": 1168.45, "x": "1995年の初夏、この事件は\n「疑われている」の箱に入っていた。"}, {"t": 1173.6333333333334, "x": "その箱から、出たの？"}, {"t": 1175.3166666666666, "x": "そこを、このあと見ていく。"}, {"t": 1177.55, "x": "1996年4月2日。"}, {"t": 1179.8333333333333, "x": "参議院の逓信委員会。"}, {"t": 1181.5, "x": "この日、放送局の社長と常務が\n参考人として呼ばれている。"}, {"t": 1185.5, "x": "なんで放送局が呼ばれたの？"}, {"t": 1187.4, "x": "別の問題が起きていたからだ。"}, {"t": 1189.35, "x": "この局が、1989年に取材したテープを、\n放送前に教団側に見せていた。"}, {"t": 1195.0333333333333, "x": "そのテープには、教団を\n追及していた弁護士が映っていた。"}, {"t": 1198.75, "x": "……それって。"}, {"t": 1199.6166666666666, "x": "坂本弁護士一家の事件の、少し前の話だ。"}, {"t": 1202.8, "x": "ep066でやった通りだ。"}, {"t": 1204.8333333333333, "x": "委員会はその問題で開かれた。"}, {"t": 1206.75, "x": "社長は冒頭で謝罪している。"}, {"t": 1208.6666666666667, "x": "そこで保坂三蔵 議員が、図表を出してこう言った。"}, {"t": 1211.95, "x": "「「ＴＢＳとオウム教団 10の疑惑」、\nこうまとめてみたわけでございます」"}, {"t": 1216.25, "x": "十個も並べたのね。"}, {"t": 1217.7833333333333, "x": "並べた。その四番目に、この事件が入っている。"}, {"t": 1220.9666666666667, "x": "「四番目に、これは具体的にお尋ねしたいんですが、\n例の村井秀夫刺殺事件です」"}, {"t": 1226.0166666666667, "x": "ここで議員が問題にしたのは、事件の映像そのものだ。"}, {"t": 1229.45, "x": "亡くなったあと、非常に早い\n時間に放送されている、と。"}, {"t": 1232.95, "x": "そして、こう続けた。"}, {"t": 1234.5, "x": "「その◯という犯人が、\n最初からやりますよというように◯ばかり追って」"}, {"t": 1238.7666666666667, "x": "いまの◯のところは。"}, {"t": 1240.25, "x": "刺した人物の姓が入っている。\nこの番組では伏せて読んでいる。"}, {"t": 1244.0166666666667, "x": "議員は、映像がその人物を最初から\n追っていたように見える、と指摘した。"}, {"t": 1248.4666666666667, "x": "そのうえで、こう問い詰めている。"}, {"t": 1250.3, "x": "「このことは、この情報を\nどうしてＴＢＳが仕入れたのか、\nこのお調べをしたことがありますでしょうか」"}, {"t": 1256.45, "x": "この問いに、常務取締役が答えている。"}, {"t": 1259.0333333333333, "x": "第3章で少し出した答弁だ。"}, {"t": 1261.2166666666667, "x": "今度は全部読む。"}, {"t": 1262.4, "x": "「今、先生が御指摘になりました\n村井幹部殺人事件に、"}, {"t": 1266.0, "x": "事前に情報をつかんでいたんではないかという\nふうな御趣旨かと思いますけれども」"}, {"t": 1270.4, "x": "「これは外部プロダクションのつくっている\nドキュメンタリーのカメラマンが映像を"}, {"t": 1274.0833333333333, "x": "撮ったところでございまして、たまたま\nそこにいたということでございます」"}, {"t": 1278.05, "x": "「オウムの青山本部に"}, {"t": 1279.5166666666667, "x": "群がっている人々を三日間取材いたしまして、それを\nまとめて放送しようということでございましたが」"}, {"t": 1285.0166666666667, "x": "「その中に、いわゆる群衆の中にまじって◯\n容疑者もおったということでございます」"}, {"t": 1289.9833333333333, "x": "……群衆の中に、混ざっていた。"}, {"t": 1292.0833333333333, "x": "そう答えている。"}, {"t": 1293.15, "x": "三日間、あの建物の前に集まる人たちを\n撮っていた。その中にいた、という説明だ。"}, {"t": 1298.6, "x": "議員は、この答えに納得しなかった。"}, {"t": 1301.1, "x": "「そんな偶然なシーンじゃないよ」"}, {"t": 1302.8333333333333, "x": "「暴力団の筋から情報をとったんじゃないかとまで"}, {"t": 1305.5666666666666, "x": "疑われているんですよ。そんな甘い\n調査でこれは済みませんよ」"}, {"t": 1309.1833333333334, "x": "……疑われている、って言い方ね。"}, {"t": 1311.15, "x": "よく見ている。ここも断定じゃない。"}, {"t": 1313.0666666666666, "x": "「疑われている」だ。"}, {"t": 1314.5, "x": "そして、この日の委員会で、この点について\n放送局側からそれ以上の説明は出ていない。"}, {"t": 1319.9833333333333, "x": "1か月後の5月7日、同じ議員が、放送局が出した\n調査報告書についてこう言っている。"}, {"t": 1325.7833333333333, "x": "「オウム幹部村井刺殺事件のスクープや\n暴力団との前後のかかわり、\nこれも一遍も触れられなかった」"}, {"t": 1331.6833333333334, "x": "報告書にも書いていなかったの。"}, {"t": 1333.7666666666667, "x": "議員はそう述べている。"}, {"t": 1335.0666666666666, "x": "この件がその後どう決着したかを書いた\n公的な記録は、見つからなかった。"}, {"t": 1339.6333333333334, "x": "だから、ここも決めない。"}, {"t": 1341.0666666666666, "x": "国会でそう問われ、こう答えられた。そこまでだ。"}, {"t": 1344.2833333333333, "x": "……どっちが本当かは、分からないまま。"}, {"t": 1346.7, "x": "分からないままだ。"}, {"t": 1348.4833333333333, "x": "同じ日、同じ議員が、もう\n一つ別のことを指摘している。"}, {"t": 1352.2333333333333, "x": "ニュース番組で、一瞬だけ画面に\n差し込む手法が使われた、という話だ。"}, {"t": 1357.0333333333333, "x": "一瞬だけ？"}, {"t": 1358.0666666666666, "x": "人が意識して見られないくらい短い時間だ。"}, {"t": 1360.7166666666667, "x": "当時、民放連が禁止している。"}, {"t": 1362.9, "x": "そのうえで、この事件に関わる部分をこう言った。"}, {"t": 1365.7833333333333, "x": "「村井刺殺事件のところでは\nユダの写真が入っておるんですよ」"}, {"t": 1369.5, "x": "……ユダ。"}, {"t": 1370.15, "x": "キリスト教で、裏切りの代名詞になっている人物だ。"}, {"t": 1373.45, "x": "議員は続けてこう言っている。"}, {"t": 1375.1333333333334, "x": "「だれが見たって\n裏切りということですね、ユダというのは」"}, {"t": 1378.4, "x": "番組がそういう意味の絵を混ぜた、って指摘なのね。"}, {"t": 1381.4833333333333, "x": "そういう指摘だ。"}, {"t": 1382.6, "x": "国会の記録で、この事件は「裏切り」と\n一度だけ結び付けられている。"}, {"t": 1387.0833333333333, "x": "ただし、言ったのは議員であって、当局ではない。"}, {"t": 1390.0, "x": "絵を入れた側の意図は、この記録からは分からない。"}, {"t": 1392.9666666666667, "x": "分からないところは、分からないままにするのね。"}, {"t": 1395.8333333333333, "x": "そうする。そこを埋めた瞬間に、\nこの事件は別物になる。"}, {"t": 1399.45, "x": "ここまで来て、気づいたことがある。"}, {"t": 1401.5333333333333, "x": "1年たった時点で、国会で\n語られていたのは映像の話だけなんだ。"}, {"t": 1405.95, "x": "……事件そのものじゃなくて。"}, {"t": 1407.6333333333334, "x": "事件そのものじゃない。そこが、この回の骨だ。"}, {"t": 1411.3, "x": "1996年4月2日の委員会は、\nこういう言葉で終わっている。"}, {"t": 1415.7833333333333, "x": "議員の締めくくりの発言だ。"}, {"t": 1417.6333333333334, "x": "「今日、憲法のもとでも報道の自由は\n絶対的に保障されております」"}, {"t": 1421.7666666666667, "x": "「しかし、万一誤った報道がなされた場合は」"}, {"t": 1424.7, "x": "「報道から社会を守るという\n行為も当然担保されている」"}, {"t": 1428.1166666666666, "x": "報道から、社会を守る。"}, {"t": 1430.0166666666667, "x": "そして、例に挙げたのがこれだ。"}, {"t": 1432.0333333333333, "x": "「松本サリン事件の河野義行氏への汚名、\nこれもマスコミで起こされましたね」"}, {"t": 1436.7833333333333, "x": "……あの人ね。"}, {"t": 1437.7666666666667, "x": "ep072で扱った。"}, {"t": 1439.4166666666667, "x": "第一通報者が犯人扱いされた件だ。"}, {"t": 1442.1666666666667, "x": "そして、こう締めている。"}, {"t": 1443.7166666666667, "x": "「放送ジャーナリストは、右手にマイクを持つとき、"}, {"t": 1446.4333333333334, "x": "左手には自責のつえを\n持っているべきではないでしょうか」"}, {"t": 1449.65, "x": "これに対して、放送局の社長はこう答えた。"}, {"t": 1452.65, "x": "「先生のお言葉を極めて重く\n受けとめさせていただきたいと思います」"}, {"t": 1456.7333333333333, "x": "それで終わり？"}, {"t": 1457.6833333333334, "x": "この日の質疑としては、終わりだ。"}, {"t": 1459.8166666666666, "x": "この委員会で、事件の背景は\n一度も解明されていない。"}, {"t": 1463.25, "x": "問われたのは、映像がなぜ早く\n出たのか。それだけだった。"}, {"t": 1466.8, "x": "さらに5月30日、中尾則幸 議員が\n1年前の自分の発言を引き直している。"}, {"t": 1472.2833333333333, "x": "「これは放送局の自殺行為に\nつながると私は指摘いたしました」"}, {"t": 1476.3833333333334, "x": "……1年前に言ったことを、もう一度言ったのね。"}, {"t": 1479.2166666666667, "x": "言った。1年で、そこは変わらなかったということだ。"}, {"t": 1483.0833333333333, "x": "ここが、この回の二つ目の山だ。"}, {"t": 1485.3666666666666, "x": "1996年10月31日。"}, {"t": 1488.1166666666666, "x": "参議院の地方行政委員打合会。"}, {"t": 1490.6666666666667, "x": "打合会って何？"}, {"t": 1492.1666666666667, "x": "閉会中に開かれる会だ。"}, {"t": 1493.85, "x": "国会が開いていなくても質疑ができる。"}, {"t": 1496.3666666666666, "x": "この日の議題は、國松長官狙撃事件だった。"}, {"t": 1499.55, "x": "現職の警察官が「自分がやった」と\n供述している、という話が出ていた。"}, {"t": 1504.55, "x": "國松孝次 長官本人も出席している。"}, {"t": 1507.5666666666666, "x": "被害者であり、捜査の責任者でもある立場だ。"}, {"t": 1510.7166666666667, "x": "それは、大変な場ね。"}, {"t": 1512.4, "x": "その質疑の終わりで、有働正治 議員が\n捜査全体を並べて批判した。"}, {"t": 1516.95, "x": "その中に、この一文がある。"}, {"t": 1518.8833333333334, "x": "「村井幹部刺殺事件でも、"}, {"t": 1520.5, "x": "実行犯と指示した人物だけを挙げ、\n背後関係の解明には至っていないわけであります」"}, {"t": 1526.0, "x": "……実行犯と、指示した人物。"}, {"t": 1528.2666666666667, "x": "そう言っている。"}, {"t": 1529.1833333333334, "x": "5月19日の答弁で、当局は実行犯と\n共犯の二人を挙げたと述べていた。"}, {"t": 1534.1, "x": "この議員が言っているのは、そこで\n止まっている、ということだ。"}, {"t": 1537.7, "x": "それ、事件から1年半後よね。"}, {"t": 1540.05, "x": "念のため言っておく。これは議員の発言だ。"}, {"t": 1542.5833333333333, "x": "当局の説明ではない。"}, {"t": 1544.2, "x": "この日、政府側はこの部分に直接は答えていない。"}, {"t": 1547.5166666666667, "x": "そして、国会の記録を機械で当たったら、こうなった。"}, {"t": 1550.9166666666667, "x": "「村井秀夫」という四文字を含む\n発言は、全記録で4件しかない。"}, {"t": 1555.3166666666666, "x": "……四件？"}, {"t": 1556.1, "x": "4件だ。4月27日の答弁、5月16日の本会議、\n6月7日、そして1996年4月2日。"}, {"t": 1564.25, "x": "ほかは「村井氏」「村井幹部」\n「村井さん」という呼び方になる。"}, {"t": 1568.1333333333334, "x": "全部足しても、数えられる程度しかない。"}, {"t": 1570.75, "x": "……それだけ？"}, {"t": 1571.65, "x": "それだけだ。国会の記録に\n残っているのは、それだけなんだ。"}, {"t": 1576.0666666666666, "x": "ここから先は、この事件そのものではなく、\nその周りで動いた制度の話だ。"}, {"t": 1580.8333333333333, "x": "公安調査庁の年表に沿って、日付だけ並べる。"}, {"t": 1584.1333333333334, "x": "1995年10月30日、東京地方裁判所が\n宗教法人法に基づく解散命令を決定した。"}, {"t": 1591.2333333333333, "x": "宗教法人としては、そこで終わったのね。"}, {"t": 1594.0333333333333, "x": "法人としては終わった。"}, {"t": 1595.3666666666666, "x": "12月21日に解散の登記がされている。"}, {"t": 1598.45, "x": "ただ、法人格が無くなっても、団体そのものは残る。"}, {"t": 1602.0166666666667, "x": "そこで次に出てきたのが、破壊活動防止法だ。"}, {"t": 1605.3, "x": "破防法。"}, {"t": 1606.1666666666667, "x": "1995年12月20日、公安調査庁が、破防法に\n基づく弁明手続の開始を官報で公示した。"}, {"t": 1613.4166666666667, "x": "1996年7月11日、公安調査庁が、\n破防法に基づく解散指定処分を請求した。"}, {"t": 1620.2333333333333, "x": "そして、1997年1月31日。"}, {"t": 1623.6333333333334, "x": "公安審査委員会が、その請求を棄却している。"}, {"t": 1626.9166666666667, "x": "……棄却。通らなかったの。"}, {"t": 1628.7, "x": "通らなかった。"}, {"t": 1629.7333333333333, "x": "後に国会に呼ばれた参考人が、\nこの決定について「全員一致で請求を棄却する」\n決定だったと述べている。"}, {"t": 1636.6666666666667, "x": "この間、1996年3月28日に\n東京地裁が破産を宣告している。"}, {"t": 1642.25, "x": "4月24日には教団代表の初公判が開かれた。"}, {"t": 1645.8166666666666, "x": "ここまでが、事件から2年のあいだに起きたことだ。"}, {"t": 1648.8666666666666, "x": "この2年、村井秀夫刺殺事件の背景について\n新しい説明が出た記録は、見つけられなかった。"}, {"t": 1654.8833333333334, "x": "制度のほうだけが動いたのね。"}, {"t": 1656.8166666666666, "x": "そう見える。"}, {"t": 1658.2, "x": "破防法の請求が棄却された\nあと、国会は新しい法律を作る。"}, {"t": 1662.3, "x": "1999年12月3日。"}, {"t": 1664.7, "x": "「無差別大量殺人行為を行った\n団体の規制に関する法律」が成立した。"}, {"t": 1669.9166666666667, "x": "長い名前ね。"}, {"t": 1671.0666666666666, "x": "略して団体規制法と呼ばれている。"}, {"t": 1673.35, "x": "12月27日に施行され、その日のうちに\n公安調査庁が観察処分を請求した。"}, {"t": 1678.95, "x": "そして2000年1月28日。"}, {"t": 1681.15, "x": "公安審査委員会が、観察処分を決定した。"}, {"t": 1684.4333333333334, "x": "何が決まったの？"}, {"t": 1685.7166666666667, "x": "団体を3年間、公安調査庁長官の観察に\n付する、というものだ。"}, {"t": 1690.2166666666667, "x": "団体の側には、報告の義務が付いた。"}, {"t": 1692.7833333333333, "x": "構成員が出家か在家か、どの位階か。"}, {"t": 1695.2833333333333, "x": "ホームページの管理責任者の氏名。"}, {"t": 1697.6833333333334, "x": "……名簿を出させるのね。"}, {"t": 1699.1166666666666, "x": "そういう形の規制だ。"}, {"t": 1700.6333333333334, "x": "ここで、決定の文章を読む。"}, {"t": 1702.4333333333334, "x": "何を根拠にしたかが書いてある。"}, {"t": 1704.4666666666667, "x": "「被請求団体は、政治上の目的をもって、\n「松本サリン事件」及び「地下鉄サリン事件」という」"}, {"t": 1710.8, "x": "「多くの犠牲者を生み、"}, {"t": 1711.95, "x": "社会全体に大きな衝撃と不安を及ぼした\n無差別大量殺人行為を団体の活動として行い」"}, {"t": 1718.1166666666666, "x": "……二つだけ？"}, {"t": 1719.15, "x": "二つだけだ。この決定が\n「無差別大量殺人行為」として挙げているのは、\nその2件だけになる。"}, {"t": 1725.4166666666667, "x": "村井さんの事件は？"}, {"t": 1726.8166666666666, "x": "出てこない。"}, {"t": 1727.6166666666666, "x": "当たり前と言えば当たり前だ。"}, {"t": 1729.15, "x": "刺したのは教団の外の人物だとされているんだから。"}, {"t": 1732.5833333333333, "x": "……そうか。教団が起こした事件じゃなくて、\n教団の人が刺された事件なのね。"}, {"t": 1737.3833333333334, "x": "そこがこの事件の位置だ。"}, {"t": 1738.8666666666666, "x": "どの箱にも、きれいに入らない。"}, {"t": 1740.9333333333334, "x": "この法律の審議で、一人だけ\nこの事件に触れた人がいる。"}, {"t": 1744.6166666666666, "x": "1999年11月30日、\n参議院法務委員会の参考人質疑だ。"}, {"t": 1749.9833333333333, "x": "呼ばれた大学の教授が、こう述べている。"}, {"t": 1752.5, "x": "「オウムナンバーツー、スリーと\n言われた村井さんの死についての真相が\nまだ明らかになっていない」"}, {"t": 1757.6, "x": "……学者の人が言ったのね。"}, {"t": 1759.3666666666666, "x": "参考人の意見だ。国の認定ではない。\nそこは分けておく。"}, {"t": 1763.6833333333334, "x": "ここで、少し変わった数え方をしてみる。"}, {"t": 1766.3166666666666, "x": "この事件が、公の資料にどれだけ載っているかだ。"}, {"t": 1769.5666666666666, "x": "数えられるの？"}, {"t": 1770.6666666666667, "x": "数えられる。全部、無料で開ける資料だ。"}, {"t": 1773.3166666666666, "x": "一つ目。平成8年の警察白書。"}, {"t": 1775.9, "x": "教団を扱った章が丸ごとある。"}, {"t": 1778.0666666666666, "x": "成り立ち、省庁制、武器の製造、\nサリンの生成、捜査の経過。"}, {"t": 1782.3666666666666, "x": "その本文を全部取ってきて、\n「村井」と「刺殺」を数えた。"}, {"t": 1786.45, "x": "何件あったの。"}, {"t": 1787.65, "x": "0件だ。"}, {"t": 1788.6, "x": "……0件？"}, {"t": 1789.4, "x": "1件も無い。警察が自分でまとめた\n年次報告に、この事件は出てこない。"}, {"t": 1794.0333333333333, "x": "二つ目。公安調査庁のアーカイブの\n「各事件の概要」というページだ。"}, {"t": 1798.5166666666667, "x": "教団代表が有罪判決を受けた\n13件を、一つずつ説明している。"}, {"t": 1803.2, "x": "そこには？"}, {"t": 1804.1, "x": "載っていない。判決で認定された13件だけだからだ。"}, {"t": 1807.6333333333334, "x": "三つ目。同じアーカイブの\n「キーワードで知る」というページ。"}, {"t": 1811.1, "x": "省庁の数、信者の数、被害額が\n並んでいる。ここにも出てこない。"}, {"t": 1815.4666666666667, "x": "この事件が公的な資料に\n載っているのは、年表の1行だけだ。"}, {"t": 1819.45, "x": "「1995.4.23 幹部構成員・\n村井秀夫刺殺事件（翌24日死亡）」"}, {"t": 1825.4666666666667, "x": "……あれだけカメラが回っていたのに。"}, {"t": 1827.5, "x": "ここが、この事件のいちばん奇妙なところだと思う。"}, {"t": 1830.5666666666666, "x": "よく知られている。映像もある。\nそれなのに、国の側の記録がほとんど無い。"}, {"t": 1835.6666666666667, "x": "決まっていることと、決まっていないことを分けておく。"}, {"t": 1838.6, "x": "決まっていること。日付は1995年4月23日。"}, {"t": 1842.6, "x": "時刻は午後8時38分ごろ。"}, {"t": 1844.95, "x": "場所は東京都港区南青山の、教団の東京総本部前。"}, {"t": 1848.9833333333333, "x": "凶器は包丁。刺した人物は自称右翼団体の構成員で、\nその場で現行犯逮捕された。"}, {"t": 1854.6333333333334, "x": "運ばれたのは都立広尾病院。"}, {"t": 1856.4166666666667, "x": "死因は出血性ショック等。"}, {"t": 1858.1333333333334, "x": "亡くなったのは翌24日だ。"}, {"t": 1860.1666666666667, "x": "名乗っていた右翼団体は\n「活動の実態が全くない」と当局が述べた。"}, {"t": 1864.7666666666667, "x": "共犯として、暴力団の幹部が一人逮捕されている。"}, {"t": 1868.3333333333333, "x": "……そこまでは、はっきりしてるのね。"}, {"t": 1870.5166666666667, "x": "はっきりしている。全部、国会の答弁に残っている。"}, {"t": 1873.85, "x": "次に、決まっていないこと。"}, {"t": 1875.6333333333334, "x": "一つ。なぜ刺したのか。"}, {"t": 1877.2, "x": "答弁の言葉で言えば「犯行の動機」だ。"}, {"t": 1879.9833333333333, "x": "二つ。誰かに頼んだ人がいるのか。"}, {"t": 1882.3333333333333, "x": "答弁の言葉で言えば「背景その他」だ。"}, {"t": 1885.1, "x": "三つ。あの夜、なぜあの時刻に、\nあの場所にいられたのか。"}, {"t": 1888.85, "x": "……三日間、あそこにいたって話だったわね。"}, {"t": 1891.6333333333334, "x": "放送局の説明ではそうだ。それで\n全部説明が付くのかは、分からない。"}, {"t": 1896.1833333333334, "x": "四つ。事件の映像が、なぜ\nあれだけ早く放送されたのか。"}, {"t": 1900.0, "x": "1996年に国会で問われた。そこで\n出た答え以上のものは、無い。"}, {"t": 1904.9833333333333, "x": "……全部、「なぜ」ね。"}, {"t": 1906.5, "x": "全部「なぜ」だ。"}, {"t": 1907.85, "x": "この事件は、「誰が」も「いつ」も\n「どこで」も「何で」も分かっている。"}, {"t": 1912.6833333333334, "x": "分かっていないのは「なぜ」だけなんだ。"}, {"t": 1915.1, "x": "そして、その「なぜ」は、31年間、\n公の記録の上では埋まっていない。"}, {"t": 1920.8666666666666, "x": "最後に、亡くなった人のことを少しだけ。"}, {"t": 1923.5666666666666, "x": "この回では、この人を英雄にも悪魔にもしない。"}, {"t": 1926.6, "x": "どういうこと？"}, {"t": 1927.5833333333333, "x": "この人は、教団の中で重い\n立場にいた。それは記録にある。"}, {"t": 1931.4666666666667, "x": "当時の国家公安委員長の言葉では「\n捜査中の重要な位置づけにあった」人だ。"}, {"t": 1936.55, "x": "一方で、この時点で有罪になっていたわけではない。"}, {"t": 1939.4333333333334, "x": "逮捕もされていない。"}, {"t": 1940.8833333333334, "x": "……事件が起きた時点では、\n調べられている途中だったのね。"}, {"t": 1944.4, "x": "途中だった。捜査は、そこで止まった。"}, {"t": 1947.0, "x": "この人が何をしていて、どこまで関わっていたのか。"}, {"t": 1950.2, "x": "それを一番確かめられる\n立場にいたのは、本人だった。"}, {"t": 1953.7833333333333, "x": "その人がいなくなった。"}, {"t": 1955.4333333333334, "x": "いなくなった。それが捜査にとって\nどうだったかは、第7章の通りだ。"}, {"t": 1959.6333333333334, "x": "「全然支障がないと言ったら\nうそになると私は思いますけれども」"}, {"t": 1963.3666666666666, "x": "大臣が国会でそう言った。それ\n以上のことは、記録に無い。"}, {"t": 1967.1833333333334, "x": "……なんだか、ずっと同じところに戻ってくるわね。"}, {"t": 1970.15, "x": "戻ってくる。どこから入っても、同じ場所に出る。"}, {"t": 1973.2333333333333, "x": "それから、この事件には、世の中に\nいろいろな説が出ている。"}, {"t": 1977.0, "x": "それは、やらないの？"}, {"t": 1978.4666666666667, "x": "やらない。公的に確かめられたものが\n一つも無いからだ。"}, {"t": 1981.9333333333334, "x": "確かめていない話を、確かめた\n顔で並べるのが、いちばんまずい。"}, {"t": 1986.65, "x": "整理しておく。"}, {"t": 1987.6333333333334, "x": "1995年4月23日の午後8時38分ごろ、\n東京都港区南青山で、"}, {"t": 1993.6666666666667, "x": "教団の幹部だった村井秀夫が刺された。"}, {"t": 1996.25, "x": "刺したのは自称右翼団体の構成員で、\nその場で現行犯逮捕された。"}, {"t": 2000.65, "x": "本人は都立広尾病院に運ばれ、翌24日に亡くなった。"}, {"t": 2004.6166666666666, "x": "事件の4日後、警察庁の警備局長が\n国会でここまでを述べた。"}, {"t": 2008.85, "x": "そして、動機と背景は「捜査中」だと言った。"}, {"t": 2012.0833333333333, "x": "同じ日、国家公安委員長は「全然支障がないと\n言ったらうそになる」と述べた。"}, {"t": 2017.0, "x": "5月19日、同じ局長が、実行犯は\n起訴済みで、共犯を逮捕したと述べた。"}, {"t": 2022.35, "x": "名乗っていた右翼団体には、活動の実態が\n全く無かったとも言っている。"}, {"t": 2026.85, "x": "そのうえで、動機と背景は「鋭意捜査中」だと言った。"}, {"t": 2030.3833333333334, "x": "ある議員は「口封じのため\n殺されたとも見られる」として、背景の解明を求めた。"}, {"t": 2035.5333333333333, "x": "総理の答弁に、この人の名前は出てこなかった。"}, {"t": 2038.6166666666666, "x": "1年半後、別の議員は「背後関係の解明には\n至っていない」と述べた。"}, {"t": 2043.3666666666666, "x": "そして、警察白書にも、\n公安調査庁の事件一覧にも、この事件は出てこない。"}, {"t": 2048.75, "x": "……31年たっても、動機だけが残らなかったのね。"}, {"t": 2052.2166666666667, "x": "残らなかった。"}, {"t": 2053.2833333333333, "x": "先に、出どころを全部置いておく。ほとんどが\n国会会議録検索システムで読める。"}, {"t": 2058.266666666667, "x": "事件の事実関係は、1995年4月27日、\n参議院地方行政委員会 第12号。"}, {"t": 2065.0, "x": "身柄と共犯の話は、1995年5月19日、\n参議院地方行政委員会 第13号。"}, {"t": 2071.633333333333, "x": "報道のあり方は、\n同じ4月27日の参議院逓信委員会と、\n1996年4月2日の同じ委員会。"}, {"t": 2079.1, "x": "教団での立場と資産の話は、\n1995年4月26日、衆議院文教委員会 第6号。"}, {"t": 2086.016666666667, "x": "「口封じ」の発言と総理の答弁は、\n1995年5月16日、衆議院本会議 第27号。"}, {"t": 2093.2, "x": "事件の並びは、1995年6月7日、\n衆議院法務委員会 第8号。"}, {"t": 2098.7833333333333, "x": "「背後関係の解明には至っていない」は、\n1996年10月31日、参議院地方行政委員打合会。"}, {"t": 2106.4333333333334, "x": "参考人の発言は、1999年11月30日、\n参議院法務委員会 第7号。"}, {"t": 2112.85, "x": "年表は公安調査庁のアーカイブ、観察処分は\n法務省の公安審査委員会のページ。"}, {"t": 2118.0333333333333, "x": "教団の組織の説明は、平成8年の警察白書だ。"}, {"t": 2121.7, "x": "全部、いま開ける。"}, {"t": 2123.0333333333333, "x": "この回で守ったことも書いておく。"}, {"t": 2125.0666666666666, "x": "誰かを黒幕だと言わなかった。"}, {"t": 2126.883333333333, "x": "言えるだけの記録が無いからだ。"}, {"t": 2128.8, "x": "刺した人物の名前も、共犯とされた\n人物の名前も出さなかった。"}, {"t": 2133.05, "x": "裁判の中身も書かなかった。"}, {"t": 2134.8166666666666, "x": "判決の原文にたどり着けていないからだ。"}, {"t": 2137.5, "x": "刺す場面も描かなかった。"}, {"t": 2139.0666666666666, "x": "答弁より細かいことを、私は知らない。"}, {"t": 2141.6666666666665, "x": "扱ったのは、1995年から2000年までに\n紙に残ったところだけだ。"}, {"t": 2146.7, "x": "いまの団体や、いまそこにいる\n人たちの話ではない。そこは混ぜないでほしい。"}, {"t": 2151.383333333333, "x": "ねえ、一つだけ聞いていい？"}, {"t": 2153.1833333333334, "x": "なんだ。"}, {"t": 2153.9166666666665, "x": "あれだけカメラがあって、どうして\n「なぜ」だけ残らなかったの。"}, {"t": 2157.8333333333335, "x": "カメラは、起きたことしか写せないからな。"}, {"t": 2160.4, "x": "誰かが頼んだのかどうかは、\nあの通りの外側にある話だ。"}, {"t": 2164.233333333333, "x": "……レンズの外なのね。"}, {"t": 2165.65, "x": "外だ。だから、そこを\n埋められるのは公の記録しかない。"}, {"t": 2169.25, "x": "そして31年、その欄は空いたままだ。"}, {"t": 2171.9166666666665, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
