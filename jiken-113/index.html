<script>
const D={"name": "113", "file": "113_編集用", "dur": 2025.81665625, "segs": [], "subs": [{"t": 0.0, "x": "1970年11月25日午前11時。"}, {"t": 3.4833333333333334, "x": "東京の国会では、天皇が開会式の席に着いた。"}, {"t": 6.883333333333334, "x": "第64回国会の始まりの日だ。"}, {"t": 9.433333333333334, "x": "同じ午前11時に、別の場所でも門が開いた。"}, {"t": 12.733333333333333, "x": "別の場所？"}, {"t": 13.75, "x": "新宿区の市ヶ谷にあった、\n陸上自衛隊の東部方面総監部だ。"}, {"t": 17.9, "x": "その正門を5人の男が通った。"}, {"t": 20.083333333333332, "x": "先頭は作家の三島由紀夫。"}, {"t": 21.9, "x": "あとの4人は、三島がつくった楯の会の会員だった。"}, {"t": 25.283333333333335, "x": "それから1時間20分ほどで、\n三島と会員1人が命を絶つ。"}, {"t": 29.433333333333334, "x": "自衛官8人が刀で重いけがを負う。"}, {"t": 31.95, "x": "……名前はよく聞く事件ね。"}, {"t": 33.666666666666664, "x": "そうだ。名前はたぶん誰でも知っている。"}, {"t": 36.05, "x": "ただ、この日の細かいところを言える人は少ない。"}, {"t": 39.0, "x": "たとえば三島が何を要求したのか。"}, {"t": 41.266666666666666, "x": "集められた自衛官が何と返したのか。"}, {"t": 43.833333333333336, "x": "演説を聞かされた側ね。"}, {"t": 45.6, "x": "今回は、1970年11月25日の三島事件を、\n国会の記録から追っていく。"}, {"t": 51.56666666666667, "x": "そこが今回の中心だ。"}, {"t": 53.25, "x": "先に言っておくと、演説の言葉は\nその場でもよく聞き取れなかった。"}, {"t": 57.266666666666666, "x": "国会で防衛庁の幹部がそう答えている。"}, {"t": 59.8, "x": "やじも相当あったそうだ。"}, {"t": 61.38333333333333, "x": "ただどんなやじが飛んだのか。"}, {"t": 63.06666666666667, "x": "その一言一言は、公の記録には\nまとまって残っていない。"}, {"t": 67.08333333333333, "x": "何と叫ばれたのかは、細かくは分かっていない。"}, {"t": 70.06666666666666, "x": "分かっていないのにどう話すの？"}, {"t": 72.01666666666667, "x": "公の記録に残った言葉だけで組み立てる。"}, {"t": 74.81666666666666, "x": "国会の会議録、警察と\n防衛庁の答弁、それと裁判の記録だ。"}, {"t": 79.2, "x": "この動画は、三島の考えが\n正しいかどうかを決めない。"}, {"t": 82.5, "x": "亡くなった場面の様子も話さない。"}, {"t": 84.65, "x": "その代わりに、時計の針を順番に進めていく。"}, {"t": 88.26666666666667, "x": "話は事件の二日前にさかのぼる。"}, {"t": 90.61666666666666, "x": "三島から総監部に電話が入った。"}, {"t": 92.83333333333333, "x": "東部方面総監に会いたい、という申し込みだ。"}, {"t": 95.78333333333333, "x": "総監ってどのくらい偉い人なの？"}, {"t": 97.98333333333333, "x": "国会では、旧軍でいえば東部軍司令官に\nあたる人、と言われている。"}, {"t": 102.16666666666667, "x": "当時の総監は益田兼利という陸将だった。"}, {"t": 105.13333333333334, "x": "面会の理由はこう伝えられていた。"}, {"t": 107.25, "x": "新しい学生を紹介したい。"}, {"t": 108.96666666666667, "x": "あいさつもしたい。"}, {"t": 110.25, "x": "ずいぶん普通の理由ね。"}, {"t": 111.81666666666666, "x": "普通の理由だ。だから誰も疑わなかった。"}, {"t": 114.58333333333333, "x": "これはあとで、防衛庁長官が国会で説明している。"}, {"t": 117.86666666666666, "x": "当時の長官は中曽根康弘だ。"}, {"t": 120.08333333333333, "x": "中曽根長官によると、\n当日の11時ごろにも電話があった。"}, {"t": 123.93333333333334, "x": "これから行くという連絡だ。"}, {"t": 125.58333333333333, "x": "総監は部屋で待っていた。"}, {"t": 127.18333333333334, "x": "玄関で見張りに立つ隊員にも、話が通してあった。"}, {"t": 130.58333333333334, "x": "三島さんが来るからと。"}, {"t": 132.16666666666666, "x": "顔パスみたいなものね。"}, {"t": 133.76666666666668, "x": "近い。三島は、それだけ名の知れた人だった。"}, {"t": 136.78333333333333, "x": "長官も国会でこう言っている。"}, {"t": 138.65, "x": "あれほど世界的に有名な\n人だから、承知して待っていた。"}, {"t": 142.26666666666668, "x": "まさか三島がそんなことをするとは、\n誰も思わなかっただろう、と。"}, {"t": 146.26666666666668, "x": "有名だったことが入口になったのね。"}, {"t": 148.71666666666667, "x": "別の日の答弁では、もう少しはっきり言っている。"}, {"t": 151.71666666666667, "x": "有名人に目をくらまされた\n面も、無いとは言えない、と。"}, {"t": 155.0, "x": "長官自身がそう認めている。"}, {"t": 157.01666666666668, "x": "自分で認めたのね。"}, {"t": 158.53333333333333, "x": "そこは記録にそのまま残っている。"}, {"t": 160.75, "x": "長官は三島とは親しかったの？"}, {"t": 162.95, "x": "国会でそれも聞かれている。"}, {"t": 164.63333333333333, "x": "長官の答えでは会ったのは3回だけだ。"}, {"t": 167.11666666666667, "x": "座談会と研究会と講演会で、\n二人きりで話したことは無い。"}, {"t": 171.15, "x": "ただ、書いたものはよく読んでいた、と答えている。"}, {"t": 174.7, "x": "5人は車で総監部に来た。"}, {"t": 176.65, "x": "三島は楯の会の制服を着ていた。"}, {"t": 178.91666666666666, "x": "腰には刀を下げていた。"}, {"t": 180.71666666666667, "x": "刀？　そのまま入れたの？"}, {"t": 182.56666666666666, "x": "門で一度とがめられている。"}, {"t": 184.23333333333332, "x": "それは軍刀ですかと聞かれた。"}, {"t": 186.13333333333333, "x": "三島はこれは指揮刀だと答えた。"}, {"t": 188.35, "x": "指揮刀って？"}, {"t": 189.4, "x": "部隊の指揮をとる人が持つ刀のことだ。"}, {"t": 192.03333333333333, "x": "その答えでそのまま通された。"}, {"t": 193.93333333333334, "x": "長官の説明では、三島は\nいつも制服に刀を下げていた。"}, {"t": 197.75, "x": "だから見慣れた姿でもあった。"}, {"t": 199.65, "x": "刀は本物の日本刀だった。"}, {"t": 201.7, "x": "長官の説明では、関の孫六と呼ばれる名のある刀だ。"}, {"t": 205.4, "x": "警察庁は国会で、刀の登録の日付まで答えている。"}, {"t": 209.15, "x": "1969年9月20日だ。"}, {"t": 211.75, "x": "登録してあったのね。"}, {"t": 213.3, "x": "してあった。ただ警察の見方は厳しい。"}, {"t": 215.85, "x": "この日の持ち歩き方は、法律の上で\n正当とは言えなかった。"}, {"t": 219.55, "x": "警察庁の担当者はそう答えている。"}, {"t": 222.01666666666668, "x": "登録しててもだめだったの？"}, {"t": 223.88333333333333, "x": "登録は美術品の刀を手元に置くための手続きだ。"}, {"t": 227.26666666666668, "x": "防衛庁の官房長も、国会でそう説明している。"}, {"t": 230.46666666666667, "x": "ただ三島は自宅から車で運んでいる。"}, {"t": 232.9, "x": "途中で警察が刀に気づく機会は、事実上なかった。"}, {"t": 236.56666666666666, "x": "これも警察庁の説明だ。"}, {"t": 238.51666666666668, "x": "誰も止める場面がなかったのね。"}, {"t": 240.65, "x": "門の一度だけだった。"}, {"t": 242.1, "x": "その一度も名前と制服で通ってしまった。"}, {"t": 245.43333333333334, "x": "5人は2階の総監室に通された。"}, {"t": 247.8, "x": "はじめは雑談だったという。"}, {"t": 249.48333333333332, "x": "ここから先は、総監本人が裁判で話している。"}, {"t": 252.76666666666668, "x": "総監は三島の刀が気になっていた。"}, {"t": 255.21666666666667, "x": "そんな物を下げていて、警察にとがめられませんか。"}, {"t": 258.3666666666667, "x": "そう聞くと三島は許可証があると答えた。"}, {"t": 260.8833333333333, "x": "そして刀を見ますかと言った。"}, {"t": 262.96666666666664, "x": "見せるって流れになったのね。"}, {"t": 264.8833333333333, "x": "三島は刀を抜いて学生にこう言った。"}, {"t": 267.3, "x": "ハンカチを持ってこい。"}, {"t": 268.56666666666666, "x": "刀をぬぐうためだ。"}, {"t": 269.9, "x": "総監は、ちり紙のほうがいいかと\n思って机へ数歩歩いた。"}, {"t": 273.46666666666664, "x": "戻ると三島はもう刀をふいていた。"}, {"t": 275.7, "x": "総監は刀を受け取ってよく見た。"}, {"t": 277.8833333333333, "x": "いい刀ですねと言って返した。"}, {"t": 279.93333333333334, "x": "……ほんとにただのお客さんの会話ね。"}, {"t": 282.1333333333333, "x": "返したその直後だった。"}, {"t": 283.73333333333335, "x": "会員たちが総監を押さえた。"}, {"t": 285.53333333333336, "x": "手足を縛り口に手ぬぐいをかませた。"}, {"t": 288.0833333333333, "x": "急に？"}, {"t": 288.78333333333336, "x": "急にだ。長官は国会で、やにわにと言っている。"}, {"t": 291.8833333333333, "x": "総監は裁判でこう振り返っている。"}, {"t": 294.03333333333336, "x": "はじめは何かの訓練かと思った。"}, {"t": 296.21666666666664, "x": "あとで笑い話にでもするのかと思っていた。"}, {"t": 298.81666666666666, "x": "冗談はよしなさいと言った。"}, {"t": 300.5, "x": "だが三島が刀を抜いたままにらんでいた。"}, {"t": 302.98333333333335, "x": "そこでただごとではないと分かった。"}, {"t": 305.1166666666667, "x": "ハンカチが合図みたいなものだったのね。"}, {"t": 307.5, "x": "あとから見ると、そういう\n段取りだったと言われている。"}, {"t": 311.03333333333336, "x": "部屋の外にいた隊員が異変に気づいた。"}, {"t": 313.46666666666664, "x": "最初に見つけたのは3佐の階級の幹部だ。"}, {"t": 316.21666666666664, "x": "防衛庁の官房長が、時刻を国会で答えている。"}, {"t": 319.46666666666664, "x": "異常と声を上げたのは、11時8分か9分ごろ。"}, {"t": 322.8333333333333, "x": "門を通ってから8分か9分？"}, {"t": 324.96666666666664, "x": "そうだ。雑談の時間を入れても、それだけだ。"}, {"t": 327.93333333333334, "x": "その3分か4分あとに、110番がかけられた。"}, {"t": 331.1166666666667, "x": "警察が通報を受けたのは、11時12分ごろ。"}, {"t": 334.25, "x": "これは警察庁の警備局長の答弁だ。"}, {"t": 336.95, "x": "自衛隊が110番したのね。"}, {"t": 339.0, "x": "した。総監部から警察の110番にだ。"}, {"t": 341.85, "x": "部屋の扉は中からふさがれていた。"}, {"t": 344.0833333333333, "x": "外からはすぐには入れなかった。"}, {"t": 346.0, "x": "そして紙が外に出された。"}, {"t": 347.81666666666666, "x": "三島の要求を書いた紙だ。"}, {"t": 349.6166666666667, "x": "長官は国会で、要求書がばらまかれて\n中身が分かったと言っている。"}, {"t": 353.8666666666667, "x": "最初から紙に書いて用意してあったの？"}, {"t": 356.3333333333333, "x": "用意してあった。その場の思いつきではない。"}, {"t": 358.8833333333333, "x": "警察の調べでは、計画はその年の春ごろからだ。"}, {"t": 362.23333333333335, "x": "5人がホテルやサウナで、何度も会って話していた。"}, {"t": 365.43333333333334, "x": "サウナで？"}, {"t": 366.28333333333336, "x": "会う場所としてそう答弁されている。"}, {"t": 368.3, "x": "友人にも、ほかの会員にも知らせていなかった。"}, {"t": 371.28333333333336, "x": "計画を知っていたのは5人だけだった。"}, {"t": 373.6, "x": "これも警察庁の答弁だ。"}, {"t": 376.03333333333336, "x": "要求書には六つの項目があった。"}, {"t": 378.23333333333335, "x": "警察庁の局長が、国会で一つずつ読み上げている。"}, {"t": 381.85, "x": "全部記録に残ってるのね。"}, {"t": 383.76666666666665, "x": "残っている。順番に見ていこう。"}, {"t": 385.8, "x": "一つ目。"}, {"t": 386.6166666666667, "x": "11時30分までに、市ヶ谷の自衛官を\n全員、本館の前に集めること。"}, {"t": 391.5, "x": "二つ目。三島の演説を静かに聞くこと。"}, {"t": 394.35, "x": "演説のときには檄という文書をまく。"}, {"t": 396.68333333333334, "x": "そのあと会員が名乗りを上げる、という\n段取りも書いてある。"}, {"t": 399.9, "x": "三つ目。近くの市ヶ谷会館にいる\nほかの会員を、呼んで並ばせること。"}, {"t": 404.48333333333335, "x": "ほかの会員もいたの？"}, {"t": 406.0, "x": "いた。そこは次の次の章で話す。"}, {"t": 408.4166666666667, "x": "四つ目。11時10分から13時10分まで、\n攻撃も邪魔もしないこと。"}, {"t": 413.3, "x": "それで2時間なのね。"}, {"t": 414.8333333333333, "x": "そうだ。2時間を、まるごと渡せという要求だ。"}, {"t": 417.8833333333333, "x": "五つ目。守られて2時間たったら、\n総監を無事に引き渡す。"}, {"t": 421.8333333333333, "x": "引き渡すときは、縛ったまま本館の正面玄関で。"}, {"t": 425.26666666666665, "x": "かっこ書きで、自決防止のため、と書き添えてある。"}, {"t": 428.48333333333335, "x": "そして六つ目。"}, {"t": 429.6, "x": "条件が守られないときは、三島が\n総監を殺害して自決する。"}, {"t": 433.8, "x": "……人質の命を交換の材料にしたのね。"}, {"t": 436.5833333333333, "x": "そういう紙だった。"}, {"t": 437.78333333333336, "x": "防衛庁はこれを本気だと受け取った。"}, {"t": 440.0, "x": "長官の言葉では覚悟の事件だ。"}, {"t": 442.8333333333333, "x": "総監部の幹部たちは、黙って待ってはいなかった。"}, {"t": 445.93333333333334, "x": "総監室の両わきには幕僚の部屋がある。"}, {"t": 448.51666666666665, "x": "そこから、ふさがれた扉を破って中へ入った。"}, {"t": 451.6666666666667, "x": "助けに入ったのね。"}, {"t": 453.2, "x": "入った。幕僚副長をはじめとする8人だ。"}, {"t": 456.2, "x": "中で刀で切りつけられた。"}, {"t": 458.01666666666665, "x": "長官は国会でこう答えている。"}, {"t": 460.03333333333336, "x": "8人が助けに行ったが、みな重い傷を負わされた。"}, {"t": 463.2, "x": "治るまで2か月から4か月かかる傷だと。"}, {"t": 466.1, "x": "……2か月から4か月。"}, {"t": 467.71666666666664, "x": "答弁の時点でまだ病院にいた。"}, {"t": 469.71666666666664, "x": "長官は翌年にも、このときの様子を話している。"}, {"t": 472.9, "x": "一人は、総監に刀を向けていた\n会員に体当たりをした。"}, {"t": 476.53333333333336, "x": "倒して刀をもぎ取った。"}, {"t": 478.23333333333335, "x": "起き上がろうとした、その瞬間に切りつけられた。"}, {"t": 481.28333333333336, "x": "取り返したのに……。"}, {"t": 482.56666666666666, "x": "窓ガラスはほとんど割れていた。"}, {"t": 484.3833333333333, "x": "警務隊の隊員は、割れた\n窓の外から拳銃を向けていた。"}, {"t": 488.1166666666667, "x": "警務隊って？"}, {"t": 489.23333333333335, "x": "自衛隊の中の警察のような役目の部隊だ。"}, {"t": 492.05, "x": "だが撃ってはいない。"}, {"t": 493.3, "x": "撃てなかったの？"}, {"t": 494.45, "x": "総監が中にいて、刀を突きつけられていたからだ。"}, {"t": 497.71666666666664, "x": "総監は裁判でこう話している。"}, {"t": 499.73333333333335, "x": "これ以上けが人を出したくなかった。"}, {"t": 501.8833333333333, "x": "自分も切られるかもしれないと思った。"}, {"t": 504.1333333333333, "x": "複雑な気持ちだったと。"}, {"t": 505.9166666666667, "x": "けがをした8人は名前も出てこないのね。"}, {"t": 508.53333333333336, "x": "この動画でも出さない。"}, {"t": 509.75, "x": "8人がいた、ということだけは残しておく。"}, {"t": 513.1666666666666, "x": "110番を受けた警察もすぐに動いた。"}, {"t": 515.7, "x": "まずパトカーと近くの機動隊が向かった。"}, {"t": 518.2166666666667, "x": "総監部の近くには、第4機動隊と第5機動隊がいた。"}, {"t": 521.9333333333333, "x": "そのうち第4機動隊から、一つの中隊が出た。"}, {"t": 525.1666666666666, "x": "あとから制服と私服の警察官が加わった。"}, {"t": 528.1833333333333, "x": "どのくらいの人数？"}, {"t": 529.55, "x": "制服の警察官が511人。私服が60人だ。"}, {"t": 533.2833333333333, "x": "現場をまとめたのは、\n地元の牛込警察署の署長だった。"}, {"t": 537.1666666666666, "x": "それだけいたら踏み込めたんじゃない？"}, {"t": 539.2, "x": "国会でもまさにそう聞かれている。"}, {"t": 541.2, "x": "警察庁の局長の答えはこうだ。"}, {"t": 543.45, "x": "無理に総監室へ踏み込めば、総監に危害が及ぶ。"}, {"t": 546.7166666666667, "x": "だから建物を囲んで見張り、自衛隊と話し合った。"}, {"t": 550.0, "x": "説得で終わらせると決めた。"}, {"t": 551.8833333333333, "x": "囲むだけなのね。"}, {"t": 553.25, "x": "野党の議員はこれを手厳しく言っている。"}, {"t": 555.5166666666667, "x": "取り巻いただけでは能のない話だと。"}, {"t": 557.75, "x": "ただ答弁の側は一貫している。"}, {"t": 559.7666666666667, "x": "総監の命を優先したということだ。"}, {"t": 562.1166666666667, "x": "警視庁はすぐに特別捜査本部をつくった。"}, {"t": 564.9333333333333, "x": "牛込警察署に置かれ、約90人の態勢だった。"}, {"t": 568.4166666666666, "x": "その夜から翌日にかけて、現場の検証も行われている。"}, {"t": 572.1333333333333, "x": "長官も同じ理由を話している。"}, {"t": 574.15, "x": "無用な殺傷を避けたと。"}, {"t": 575.85, "x": "どっちの言い分も記録に残ってるのね。"}, {"t": 578.3, "x": "残っている。どちらが正しいかは、\nこの動画では決めない。"}, {"t": 581.6666666666666, "x": "ただ時間はそのあいだも進んでいた。"}, {"t": 583.85, "x": "要求書が書いた集合の時刻は、11時30分だった。"}, {"t": 588.25, "x": "そのころ中曽根長官はどこにいたか。"}, {"t": 590.5666666666667, "x": "国会の開会式に出ていた。"}, {"t": 592.5, "x": "天皇を迎えるあの式だ。"}, {"t": 594.2666666666667, "x": "最初の章の11時の式ね。"}, {"t": 596.4, "x": "そうだ。会議録には、式の時刻も書いてある。"}, {"t": 599.4, "x": "天皇が式場に入ったのが午前11時。"}, {"t": 602.05, "x": "式が終わったのが11時7分。"}, {"t": 604.1166666666667, "x": "長官は式が終わって、事務所で洋服を着替えていた。"}, {"t": 607.3666666666667, "x": "そこへ第一報が入った。"}, {"t": 608.9833333333333, "x": "長官の記憶では11時半ごろだ。"}, {"t": 611.3666666666667, "x": "長官は何て指示したの？"}, {"t": 613.1666666666666, "x": "本人が国会で答えている。三つある。"}, {"t": 615.7, "x": "一つ目。犯人を捕まえろ。"}, {"t": 617.7, "x": "二つ目。警察を表に出したほうがいい。"}, {"t": 620.3, "x": "自衛隊員の事件ではなく、\n民間の有名人の事件だからだ。"}, {"t": 624.1333333333333, "x": "三つ目。隊員に話をさせるな。"}, {"t": 626.5, "x": "演説させるなって言ったのね。"}, {"t": 628.4666666666667, "x": "言った。どうしてもなら、幹部だけに\n聞かせることを考えろ、と。"}, {"t": 632.3333333333334, "x": "ところが長官が防衛庁に着いたとき。"}, {"t": 634.6833333333333, "x": "現場はもう隊員を集め始めていた。"}, {"t": 637.05, "x": "間に合わなかったの？"}, {"t": 638.3666666666667, "x": "長官の答弁では、指示を出した\nころには集め始めていたらしい。"}, {"t": 642.15, "x": "現場の責任者が、その場で決めたことだった。"}, {"t": 645.1333333333333, "x": "長官は話を聞いてやむを得ないと言った。"}, {"t": 647.6666666666666, "x": "止めるつもりだったのに認めたのね。"}, {"t": 649.95, "x": "総監を助けるには、それしかないと判断した。"}, {"t": 652.9833333333333, "x": "長官の説明はそういうことだ。"}, {"t": 655.6, "x": "隊員はどうやって集められたのか。"}, {"t": 657.6, "x": "ここは国会でもめた点だ。"}, {"t": 659.4833333333333, "x": "もめたの？"}, {"t": 660.3666666666667, "x": "犯人の言うとおりに部隊を\n動かしたのか、と聞かれた。"}, {"t": 663.5666666666667, "x": "防衛庁の官房長はこう答えている。"}, {"t": 665.85, "x": "命令で集めたのではない。"}, {"t": 667.4, "x": "部内の放送で呼びかけた。"}, {"t": 669.1166666666667, "x": "部内の言葉で言うと、事務連絡のようなものだ、と。"}, {"t": 672.5, "x": "命令と連絡でそんなに違うの？"}, {"t": 674.65, "x": "違う。命令は、上から部隊に行動を決めて出すものだ。"}, {"t": 678.1333333333333, "x": "この日はそれとは別の形をとった。"}, {"t": 680.4, "x": "あそこには、指揮の系統が違う\n部隊がいくつも入っていた。"}, {"t": 684.0, "x": "その隊員たちが三々五々集まってきた。"}, {"t": 686.6666666666666, "x": "ばらばらに少しずつね。"}, {"t": 688.3166666666667, "x": "そうだ。そして次第に、約1000人になった。"}, {"t": 691.2166666666667, "x": "長官はマイクで呼び集めたと言っている。"}, {"t": 693.6666666666666, "x": "1000人も。"}, {"t": 694.6, "x": "本館の前の広場に集まった。"}, {"t": 696.65, "x": "見上げると、総監室の前にバルコニーがある。"}, {"t": 699.4, "x": "別の野党の議員は、数をもっと多く言っている。"}, {"t": 702.2166666666667, "x": "千数百人を集めて、あの演説を聞かせた、と。"}, {"t": 705.5833333333334, "x": "数が言う人で違うのね。"}, {"t": 707.3333333333334, "x": "この動画では答弁の約1000人を使う。"}, {"t": 709.8666666666667, "x": "そこに上から話しかけるのね。"}, {"t": 711.9333333333333, "x": "そういう場面だった。"}, {"t": 713.85, "x": "要求書の三つ目を覚えているか。"}, {"t": 716.0166666666667, "x": "ほかの会員を呼べってやつね。"}, {"t": 717.9333333333333, "x": "その会員たちは、この日、近くの市ヶ谷会館にいた。"}, {"t": 721.4333333333333, "x": "午前11時から、楯の会の例会を開いていた。"}, {"t": 724.6166666666667, "x": "人数は32人だ。"}, {"t": 726.2833333333333, "x": "その人たちは知ってたの？"}, {"t": 728.0666666666667, "x": "知らなかった。警察庁は国会で、はっきり答えている。"}, {"t": 731.6333333333333, "x": "取り調べても何も知らされていなかった。"}, {"t": 734.05, "x": "会員の一部が事件を知ったのは、午後1時5分ごろ。"}, {"t": 737.3, "x": "総監部へ駆けつけようとした。"}, {"t": 739.1833333333333, "x": "そして会館の近くで、見張っていた\n警察の部隊とぶつかった。"}, {"t": 743.15, "x": "3人が、公務執行妨害の疑いでその場で逮捕された。"}, {"t": 746.9166666666666, "x": "残りの人たちは？"}, {"t": 748.3333333333334, "x": "残りの29人は警察署で事情を聞かれた。"}, {"t": 751.2666666666667, "x": "調べた結果は事件と無関係だった。"}, {"t": 753.8, "x": "呼ばれるはずだった人たちが、何も知らなかったのね。"}, {"t": 757.2, "x": "そうだ。要求書には呼べと書いてある。"}, {"t": 759.5166666666667, "x": "だが当の本人たちには話していなかった。"}, {"t": 762.15, "x": "そもそも楯の会とは、どういう集まりだったのか。"}, {"t": 765.15, "x": "公安調査庁の次長が国会で説明している。"}, {"t": 768.0333333333333, "x": "学生を自衛隊に体験入隊させる。"}, {"t": 770.4333333333333, "x": "月に一回ほど例会を開いて研究会をする。"}, {"t": 773.3333333333334, "x": "そういう活動の団体だったと。"}, {"t": 775.3, "x": "会ができたのは1968年10月ごろ。"}, {"t": 778.45, "x": "会長は三島で主に学生でつくられていた。"}, {"t": 781.2666666666667, "x": "公安も見てはいたのね。"}, {"t": 782.8666666666667, "x": "見ていた。学生の心と体を\nきたえる目的の、右寄りの団体。"}, {"t": 787.2, "x": "それが事件の前の見立てだった。"}, {"t": 789.85, "x": "三島と自衛隊には、事件の前からつながりがあった。"}, {"t": 793.2333333333333, "x": "体験入隊ってさっき出てきたわね。"}, {"t": 795.5833333333334, "x": "それだ。一般の人が、しばらく\n自衛隊で暮らす仕組みだ。"}, {"t": 799.25, "x": "会社や役所の若い人がよく使っていた。"}, {"t": 801.9, "x": "防衛庁は、自衛隊を知ってもらう広報だと考えていた。"}, {"t": 805.3833333333333, "x": "三島本人も体験入隊をしている。"}, {"t": 807.7, "x": "官房長が国会で回数と日数を答えている。"}, {"t": 810.7166666666667, "x": "細かく出てるの？"}, {"t": 811.9833333333333, "x": "出ている。1967年の春に4回だ。"}, {"t": 815.25, "x": "1回目は4月12日から8日間。"}, {"t": 817.6, "x": "場所は前川原の幹部候補生学校。"}, {"t": 819.9333333333333, "x": "2回目は4月24日から、6日間。富士の教導団だ。"}, {"t": 823.8, "x": "3回目は5月2日から、18日間。富士学校だ。"}, {"t": 827.5833333333334, "x": "4回目は5月23日から、5日間。"}, {"t": 830.3, "x": "習志野の第1空挺団。"}, {"t": 832.1833333333333, "x": "あわせると？"}, {"t": 833.1166666666667, "x": "37日だ。官房長は、2\nか月ではないと念を押している。"}, {"t": 837.0666666666667, "x": "合計しても1か月ちょっとだと。"}, {"t": 839.25, "x": "国会で2か月って言われてたのね。"}, {"t": 841.5333333333333, "x": "そう聞いた議員がいたから、訂正したわけだ。"}, {"t": 844.2, "x": "長い体験入隊だったので、陸上幕僚長に\n頼んだのだろう、とも答えている。"}, {"t": 849.1, "x": "そのあとは、楯の会の学生も体験入隊をした。"}, {"t": 852.3333333333334, "x": "楯の会としてではなく、三島を囲む\n学生の集まりとして申し込まれた。"}, {"t": 856.95, "x": "つながりはあったのね。"}, {"t": 858.3833333333333, "x": "あった。ただ首相は、楯の会と\n自衛隊は全然関係がないと答えている。"}, {"t": 862.9166666666666, "x": "長官も体験入隊はやめないと言った。"}, {"t": 865.3333333333334, "x": "長官自身も、3回ほど\n体験入隊をしたことがあるそうだ。"}, {"t": 869.7833333333333, "x": "三島は総監室の前のバルコニーに出た。"}, {"t": 872.3333333333334, "x": "下の広場には約1000人の隊員がいた。"}, {"t": 874.9833333333333, "x": "何を話したの？"}, {"t": 876.2666666666667, "x": "警察庁の局長が、計画の中身として答えている。"}, {"t": 879.8, "x": "集まった隊員に憲法改正の必要を訴える。"}, {"t": 882.7833333333333, "x": "目を覚ますように促す。"}, {"t": 884.3, "x": "計画ではそういう段取りだった。"}, {"t": 886.3666666666667, "x": "聞いた人たちはどうだったの？"}, {"t": 888.2166666666667, "x": "ここが今回の中心だ。"}, {"t": 889.8666666666667, "x": "防衛庁の官房長が国会でこう答えている。"}, {"t": 892.6333333333333, "x": "やじも相当ありまして。"}, {"t": 894.15, "x": "演説そのものも、そう正確には\n聞き取れなかったようです。"}, {"t": 897.85, "x": "やじが相当……。"}, {"t": 898.9333333333333, "x": "記録で確かめられるのはここまでだ。"}, {"t": 901.1333333333333, "x": "やじが多く声が届かなかった。"}, {"t": 903.2333333333333, "x": "最後に、万歳って言ったって聞いたことあるけど。"}, {"t": 906.2166666666667, "x": "その点も国会で聞かれている。"}, {"t": 908.15, "x": "最後に声を張り上げて\n叫んだのではないか、という質問だ。"}, {"t": 911.6666666666666, "x": "官房長の答えは慎重だった。"}, {"t": 913.7166666666667, "x": "自分は直接耳にしていない。"}, {"t": 915.6833333333333, "x": "いろいろなやじが飛んでいたから、\nその中の一つかもしれない、と。"}, {"t": 919.6166666666667, "x": "誰が言ったかもはっきりしないのね。"}, {"t": 921.8166666666667, "x": "そのくらい下の広場は騒がしかった。"}, {"t": 924.1833333333333, "x": "三島は文書もまいている。"}, {"t": 925.7666666666667, "x": "要求書に書いてあった檄だ。"}, {"t": 927.6, "x": "局長は相当長い文だと言っている。"}, {"t": 929.8833333333333, "x": "この動画では檄の文面は読まない。"}, {"t": 932.0333333333333, "x": "中身は、警察の答弁のとおり、\n憲法改正を訴えるものだ。"}, {"t": 936.1166666666667, "x": "上と下で言葉がすれ違ってたのね。"}, {"t": 938.55, "x": "上は訴えていた。下はやじで返していた。"}, {"t": 941.8833333333333, "x": "演説を終えると三島は総監室に戻った。"}, {"t": 944.55, "x": "ここから先は、警察庁の答弁の言葉だけで話す。"}, {"t": 948.05, "x": "12時15分ごろから、12時20分ごろのあいだ。"}, {"t": 951.3666666666667, "x": "三島と、会員の森田必勝の二人が、命を絶った。"}, {"t": 954.8833333333333, "x": "……。"}, {"t": 955.8166666666667, "x": "この動画ではそのときの様子は話さない。"}, {"t": 958.3666666666667, "x": "うん。それでいいと思う。"}, {"t": 959.9, "x": "12時22分ごろ、残った3人の会員が部屋から出てきた。"}, {"t": 963.9, "x": "外で待っていた警察官が、協力して逮捕した。"}, {"t": 967.2666666666667, "x": "抵抗はしなかったの？"}, {"t": 968.7833333333333, "x": "長官の言葉では自首して出てきた形だ。"}, {"t": 971.4833333333333, "x": "スケジュールが終わって出てきたという言い方だ。"}, {"t": 974.1, "x": "最初からそこまで決めてあったのね。"}, {"t": 976.35, "x": "警察の調べではそうだ。"}, {"t": 978.0, "x": "三島は家を出る直前に、3人へ命令書を渡していた。"}, {"t": 981.4833333333333, "x": "そこには、三島と森田が自決することが書かれていた。"}, {"t": 984.8833333333333, "x": "局長はこうまとめている。"}, {"t": 986.4833333333333, "x": "三島は、自衛隊員の前で気持ちを訴えて死んでいく。"}, {"t": 989.7666666666667, "x": "それを最初から心に決めていた。"}, {"t": 991.8833333333333, "x": "それ以上のことは考えていなかった。"}, {"t": 994.2, "x": "クーデターを起こすつもりでは、なかったの？"}, {"t": 996.7, "x": "取り調べでは、その話は全然出ていないと答えている。"}, {"t": 1000.15, "x": "自衛隊が立ち上がることを、\n気持ちの上では期待していた。"}, {"t": 1003.5, "x": "だが、そのための具体的な準備は出てこなかった。"}, {"t": 1006.6333333333333, "x": "ここは、のちに国会で別の見方も\n出る。あとの章で話す。"}, {"t": 1011.0666666666667, "x": "ねえ要求は2時間だったわよね。"}, {"t": 1013.1666666666666, "x": "11時10分から13時10分まで、だった。"}, {"t": 1016.3166666666667, "x": "でも12時22分には終わってる。"}, {"t": 1018.6, "x": "そうだ。求めた2時間のうち、\n実際は1時間ちょっとで終わった。"}, {"t": 1022.6666666666666, "x": "残りの時間は使われなかった。"}, {"t": 1024.8, "x": "演説は長くするつもりじゃなかったの？"}, {"t": 1027.2333333333333, "x": "それは分からない。"}, {"t": 1028.3166666666666, "x": "演説が何分だったのかも、\n一次の記録では確かめられなかった。"}, {"t": 1032.4, "x": "だからここでは言わない。"}, {"t": 1033.7833333333333, "x": "分かっているのは、終わったあとの広場のことだ。"}, {"t": 1036.65, "x": "集められた1000人はどうなったの？"}, {"t": 1038.7166666666667, "x": "官房長が国会でこう話している。"}, {"t": 1040.9333333333334, "x": "三島のことが伝わって、みんなショックを受けた。"}, {"t": 1043.7833333333333, "x": "解散という連絡は、誰かがしたかもしれない。"}, {"t": 1046.6666666666667, "x": "総監も出てきて、少し訓示のようなことを言った。"}, {"t": 1049.7666666666667, "x": "隊員は職場に戻れと注意されたはずだ。"}, {"t": 1052.4166666666667, "x": "それで整列して戻ったの？"}, {"t": 1054.3, "x": "そこが面白いところだ。"}, {"t": 1055.7166666666667, "x": "官房長は、こう言っている。"}, {"t": 1057.5, "x": "いろいろ私語をしながら、\n批判をしながら、自然に解散した。"}, {"t": 1061.3333333333333, "x": "……批判をしながら。"}, {"t": 1062.5666666666666, "x": "答弁の中にそのままある言葉だ。"}, {"t": 1064.7166666666667, "x": "議員は、命令を聞かない自衛隊だと責めた。"}, {"t": 1067.4166666666667, "x": "官房長はそれは少し酷だと答えている。"}, {"t": 1070.05, "x": "あり得ないような事態で、\n隊員もショックを受けていた。"}, {"t": 1072.95, "x": "だから、ざわざわと戻っていったのだろう、と。"}, {"t": 1075.8, "x": "やじで迎えて批判しながら帰ったのね。"}, {"t": 1078.3333333333333, "x": "記録に残った隊員の姿は、それがすべてだ。"}, {"t": 1082.0333333333333, "x": "総監室の中の総監について、\nもう少しだけ記録がある。"}, {"t": 1085.8166666666666, "x": "中曽根長官が国会でこう話している。"}, {"t": 1088.3666666666666, "x": "総監は縛られながらも、とても落ち着いていた。"}, {"t": 1091.3333333333333, "x": "縛られてるのに？"}, {"t": 1092.5833333333333, "x": "そうだ。三島に向かって、命を大事にしろと言った。"}, {"t": 1095.95, "x": "残った会員たちには、自首をしなさいとすすめた。"}, {"t": 1099.1833333333334, "x": "人質にされた人がそう言ったのね。"}, {"t": 1101.55, "x": "長官は、相当に肝のすわった人だと評価している。"}, {"t": 1104.95, "x": "そのうえで、総監の責任を\n問う気持ちは無いとも言った。"}, {"t": 1108.3166666666666, "x": "あれだけ名の知れた人がああいう\n手順で入れば、誰でもやられるだろう。"}, {"t": 1112.15, "x": "ほとんど防ぎようのない事件だったと。"}, {"t": 1114.5, "x": "かばってるのね。"}, {"t": 1115.6666666666667, "x": "かばっている。ただ、それでも\n総監は職を去ることになる。"}, {"t": 1119.1666666666667, "x": "それはもう少しあとの章で話す。"}, {"t": 1121.3833333333334, "x": "命を大事にしろって言葉、あとでも出てきそうね。"}, {"t": 1124.5833333333333, "x": "出てくる。2日後の国会で、長官の口からもう一度だ。"}, {"t": 1128.9166666666667, "x": "ここで国会に戻る。"}, {"t": 1130.3333333333333, "x": "開会式が終わったあと、\n衆議院では本会議が開かれた。"}, {"t": 1133.9, "x": "会議録の時刻は午後1時すぎだ。"}, {"t": 1136.2333333333333, "x": "事件が終わって、1時間もたってないわね。"}, {"t": 1139.0333333333333, "x": "たっていない。"}, {"t": 1139.8666666666666, "x": "この本会議で、佐藤栄作首相が所信表明演説をした。"}, {"t": 1143.85, "x": "所信表明って？"}, {"t": 1145.1833333333334, "x": "首相が、これから何をやるかを国会で話す演説だ。"}, {"t": 1148.55, "x": "この日の冒頭は沖縄の話だった。"}, {"t": 1150.9166666666667, "x": "沖縄から、衆議院議員5人と\n参議院議員2人を初めて迎えた日だった。"}, {"t": 1155.6833333333334, "x": "沖縄が戻る前の年？"}, {"t": 1157.4333333333334, "x": "前の前の年だ。復帰は1972年になる。"}, {"t": 1160.9333333333334, "x": "首相は国連の総会に出た話もしている。"}, {"t": 1163.7, "x": "平和に徹する国の考えを、世界に訴えてきた、と。"}, {"t": 1167.3666666666666, "x": "同じ日のすぐあとなのに。"}, {"t": 1169.05, "x": "この演説に、三島事件の言葉は出てこない。"}, {"t": 1171.9333333333334, "x": "会議録をこの日付で調べても、\n事件の名前は一つも当たらない。"}, {"t": 1176.0833333333333, "x": "原稿は前から決まってたのね。"}, {"t": 1178.15, "x": "そうだろう。演説は予定どおりに読まれた。"}, {"t": 1180.6333333333334, "x": "本会議はその日のうちに散会している。"}, {"t": 1183.0833333333333, "x": "質問は翌日の26日に回された。"}, {"t": 1185.9666666666667, "x": "じゃあ事件の話は次の日なのね。"}, {"t": 1188.2666666666667, "x": "そうだ。次の日の議場で、\nはじめて事件の名前が出る。"}, {"t": 1191.7, "x": "そこでもやじが飛ぶことになる。"}, {"t": 1194.1666666666667, "x": "11月26日。衆議院の本会議だ。"}, {"t": 1197.1833333333334, "x": "最初に質問した社会党の議員が、\n三島事件を取り上げた。"}, {"t": 1201.0, "x": "単なる狂信的な事件として済ませられない、と。"}, {"t": 1204.0833333333333, "x": "政府の政策と同じ根につながる、とまで言った。"}, {"t": 1207.1666666666667, "x": "政府を責めたのね。"}, {"t": 1208.5666666666666, "x": "責めた。首相の答えはこうだ。"}, {"t": 1210.5666666666666, "x": "動機がどうあろうと、暴力は\n絶対に退けなければならない。"}, {"t": 1214.1666666666667, "x": "そう答えている途中で、議場から声が上がった。"}, {"t": 1217.05, "x": "日本刀を持った人を、どうして防衛庁に入れたんだ。"}, {"t": 1220.2333333333333, "x": "国会でもやじ？"}, {"t": 1221.4333333333334, "x": "会議録には、呼ぶ者ありとして残っている。"}, {"t": 1224.1833333333334, "x": "首相はこう返した。"}, {"t": 1225.5, "x": "だから暴力はよくないと言っている。"}, {"t": 1227.5333333333333, "x": "聞こえなかったら、重ねて申し上げておきます、と。"}, {"t": 1230.7833333333333, "x": "……市ヶ谷と同じことが起きてるわね。"}, {"t": 1232.9666666666667, "x": "上で話す人に下から声が飛んだ。"}, {"t": 1235.2666666666667, "x": "ただ、こちらは一言ずつ記録に残っている。"}, {"t": 1238.2833333333333, "x": "ほかの党の人は？"}, {"t": 1239.6833333333334, "x": "自民党の議員は、一人の芸術家が\n起こした孤立した事件だと見た。"}, {"t": 1243.95, "x": "ただ、白昼にこうなった\n警備の責任は軽くない、とも言った。"}, {"t": 1247.8666666666666, "x": "首相は、三島の行動はどうも理解できないと答えた。"}, {"t": 1251.1833333333334, "x": "そしてこう付け加えた。"}, {"t": 1252.6666666666667, "x": "希有の才能を持った文学者を\n失ったことは、まことに遺憾だ。"}, {"t": 1256.6, "x": "責めながら惜しんでもいるのね。"}, {"t": 1258.45, "x": "その日の首相の答えは、ずっとその二つが並んでいる。"}, {"t": 1262.4833333333333, "x": "27日の本会議では、中曽根長官が答えた。"}, {"t": 1265.95, "x": "民社党の議員の質問は厳しかった。"}, {"t": 1268.3833333333334, "x": "刀を持った一般人が、自衛隊の中を歩けた。"}, {"t": 1271.6, "x": "総監が縛られても、誰も身を投げ出して止めなかった。"}, {"t": 1274.9833333333333, "x": "犯人の言うままに、隊員を集めて演説を聞かせた。"}, {"t": 1278.2, "x": "2時間あまり、総監部は踏みにじられた、と。"}, {"t": 1281.1833333333334, "x": "なかなかきつい言い方ね。"}, {"t": 1282.85, "x": "共産党の議員は別の角度から責めた。"}, {"t": 1285.4, "x": "政府と自衛隊が、楯の会を守り育ててきた責任だ、と。"}, {"t": 1289.4666666666667, "x": "右からも左からも責められてるのね。"}, {"t": 1291.9333333333334, "x": "そうだ。長官の答えはこうだ。"}, {"t": 1293.95, "x": "有名な人が、約束をして穏やかに入ってきた。"}, {"t": 1297.2333333333333, "x": "それが突然、手足を縛ってさるぐつわをかませた。"}, {"t": 1300.3, "x": "要求を聞かなければ、総監を\n殺して自決すると書いてあった。"}, {"t": 1304.1333333333334, "x": "これは覚悟の事件だった。"}, {"t": 1305.8, "x": "だから、むやみに飛び込んで\n無駄にけが人を出すことは避けた。"}, {"t": 1309.35, "x": "残念な事態だがやむを得ないと。"}, {"t": 1311.45, "x": "止めなかった理由をそう説明したのね。"}, {"t": 1313.9166666666667, "x": "そして最後にこう付け加えている。"}, {"t": 1315.95, "x": "私はふだん自衛官にこう教えている。"}, {"t": 1318.2, "x": "君らが命を捨てるのは、国を守る出動のときだ。"}, {"t": 1321.5333333333333, "x": "ふだんは命を大事にしろと。"}, {"t": 1323.45, "x": "……バルコニーの言葉とは反対向きね。"}, {"t": 1325.75, "x": "この答弁は議場の拍手で終わっている。"}, {"t": 1328.05, "x": "会議録にはそこまで書いてある。"}, {"t": 1329.9666666666667, "x": "12月9日の委員会では、長官は\nもう一歩ふみこんでいる。"}, {"t": 1333.8166666666666, "x": "どんなふうに？"}, {"t": 1334.8, "x": "どんなにえらい人でも、どんなに\n世界で有名な人でも同じだ。"}, {"t": 1338.5333333333333, "x": "国民としての決まりを守るのが、いちばん大事だ。"}, {"t": 1341.65, "x": "身分や有名さで差があってはならない。"}, {"t": 1343.8166666666666, "x": "法の前の平等は、この際きびしく\n守らなければならない、と。"}, {"t": 1347.7, "x": "有名だから通された人の話の、あとだものね。"}, {"t": 1350.9666666666667, "x": "入口で名前が効いたことは、\n長官自身が別の日に認めている。"}, {"t": 1355.5833333333333, "x": "事件は国の外でも大きく伝えられた。"}, {"t": 1358.0833333333333, "x": "中曽根長官は、外国の受け止めも国会で話している。"}, {"t": 1361.8166666666666, "x": "外国ではどう見られたの？"}, {"t": 1363.5, "x": "地域によって違ったと長官は言う。"}, {"t": 1365.6666666666667, "x": "アメリカでは、はじめは\n三島個人の事件として伝えられた。"}, {"t": 1369.25, "x": "三島をよく知る人に取材した記事が多かったからだ。"}, {"t": 1372.4166666666667, "x": "それが少しずつ、軍国主義と\n結びつける記事に変わっていった。"}, {"t": 1376.45, "x": "だんだん見方が変わったのね。"}, {"t": 1378.3833333333334, "x": "アメリカの大きな雑誌を見ると、\nこういう受け止めだった。"}, {"t": 1381.4666666666667, "x": "経済で近代化した日本に、まだ\nこういうものがあったのか。"}, {"t": 1384.9833333333333, "x": "日本はまだ分からない国だと。"}, {"t": 1386.85, "x": "ヨーロッパでは、古い封建の国という印象を与えた。"}, {"t": 1390.0666666666666, "x": "東南アジアの近くの国では、\n戦争中の日本の記憶を呼び起こした。"}, {"t": 1394.4666666666667, "x": "戦争のことを思い出させたのね。"}, {"t": 1396.6, "x": "長官は、それを日本にとって\n大きなマイナスだと言っている。"}, {"t": 1400.0666666666666, "x": "平和で民主的な今の日本を、\n伝えていかなければならない、と。"}, {"t": 1403.9833333333333, "x": "翌年2月の国会でも、別の議員が\nこの点を心配している。"}, {"t": 1407.95, "x": "東南アジアの国々が、この事件に\nとても敏感だった、と。"}, {"t": 1411.8666666666666, "x": "前の章の、所信表明の話ともつながるわね。"}, {"t": 1415.15, "x": "首相は、平和に徹する国を世界に訴えたと話した。"}, {"t": 1418.6833333333334, "x": "その同じ日に、世界へ伝わったのがこの事件だった。"}, {"t": 1422.6333333333334, "x": "事件のあと、3人の会員は取り調べを受けた。"}, {"t": 1425.65, "x": "送られた罪名は六つある。"}, {"t": 1427.3333333333333, "x": "嘱託殺人、傷害、監禁、建物への侵入。"}, {"t": 1430.7666666666667, "x": "それに暴力行為の法律と、刀剣の法律の違反だ。"}, {"t": 1434.3333333333333, "x": "嘱託殺人って？"}, {"t": 1435.8833333333334, "x": "頼まれて人の命を奪う罪のことだ。"}, {"t": 1438.3833333333334, "x": "中身にはここではこれ以上触れない。"}, {"t": 1440.4166666666667, "x": "警察は事件の夜、三島の家など6か所を捜索した。"}, {"t": 1444.0, "x": "押収した証拠は133件になった。"}, {"t": 1446.8166666666666, "x": "計画は最初から総監が狙いだったの？"}, {"t": 1449.4666666666667, "x": "そこは国会で議員が別の話をしている。"}, {"t": 1452.0833333333333, "x": "3人の取り調べで分かったこととして、こう述べた。"}, {"t": 1455.2166666666667, "x": "最初の計画は、近くの連隊の連隊長を\n押さえることだった。"}, {"t": 1459.0666666666666, "x": "ところが当日その連隊長が留守だった。"}, {"t": 1461.6333333333334, "x": "それで急いで総監に変えたと。"}, {"t": 1463.6833333333334, "x": "相手が変わってたの？"}, {"t": 1465.0833333333333, "x": "議員の発言としてはそう残っている。"}, {"t": 1467.3833333333334, "x": "その連隊と楯の会には、前からつながりがあった。"}, {"t": 1470.5666666666666, "x": "別の議員が国会でこう指摘している。"}, {"t": 1472.9666666666667, "x": "その年の6月29日、楯の会は\n連隊のヘリポートを訓練に使わせてもらった。"}, {"t": 1478.2166666666667, "x": "三島はそのお礼に、連隊長へ\nあいさつに行っている、と。"}, {"t": 1481.6333333333334, "x": "ヘリポートまで借りてたのね。"}, {"t": 1483.4166666666667, "x": "議員は、毎月の例会のあとにも\n使っていたと言っている。"}, {"t": 1486.8333333333333, "x": "これも議員の側の指摘として、記録に残っている。"}, {"t": 1490.0333333333333, "x": "その議員は、もっと前の段階の話もしている。"}, {"t": 1493.0666666666666, "x": "その年の春や秋には、自衛隊と\n立ち上がる話もあった、と。"}, {"t": 1497.1, "x": "警察の答弁と少し違うわね。"}, {"t": 1499.3833333333334, "x": "違う。警察は、具体的な準備は出ていないと答えた。"}, {"t": 1502.9333333333334, "x": "議員はそれ以前に構想はあったと見た。"}, {"t": 1505.2166666666667, "x": "どちらも記録にある。"}, {"t": 1506.4, "x": "どちらかに寄せるのはやめておく。"}, {"t": 1508.45, "x": "最後の形だけはどっちも同じなのね。"}, {"t": 1511.0166666666667, "x": "同じだ。演説をして、命を絶つ。そこは一致している。"}, {"t": 1515.35, "x": "では自衛隊の中はどう受け止めたのか。"}, {"t": 1517.65, "x": "これも国会で聞かれている。"}, {"t": 1519.4666666666667, "x": "アンケートでもしたの？"}, {"t": 1520.8666666666666, "x": "きちんとした数のアンケートではない、と\n官房長は断っている。"}, {"t": 1524.5666666666666, "x": "急いでやったので面接で聞き取った。"}, {"t": 1526.8666666666666, "x": "陸も海も空も調べたそうだ。"}, {"t": 1528.8333333333333, "x": "結果はこう答えている。"}, {"t": 1530.3, "x": "ほとんど全部の者が、\n三島のやり方に共鳴していない。"}, {"t": 1533.7666666666667, "x": "批判的である。"}, {"t": 1534.8666666666666, "x": "ほとんど100%の者が批判している。"}, {"t": 1537.5666666666666, "x": "100%……。"}, {"t": 1538.7333333333333, "x": "理由として出てきたのは、時代錯誤という言葉だった。"}, {"t": 1542.0833333333333, "x": "中曽根長官も似たことを言っている。"}, {"t": 1544.3, "x": "演説に隊員が見せた反応は、とても常識的だった。"}, {"t": 1547.8333333333333, "x": "つり合いのとれた判断力を示している、と。"}, {"t": 1550.6166666666666, "x": "やじはその反応のひとつだったのね。"}, {"t": 1552.9666666666667, "x": "答弁を並べるとそう読める。"}, {"t": 1554.6833333333334, "x": "長官は別の言い方もしている。"}, {"t": 1556.6333333333334, "x": "三島個人の悲劇的な死には、\n哀悼の気持ちを表したい。"}, {"t": 1560.3166666666666, "x": "だが、公の立場では、暴力を\n認めるわけにはいかない。"}, {"t": 1564.0333333333333, "x": "個人としてと、立場としてで、分けてるのね。"}, {"t": 1567.1166666666666, "x": "そうだ。首相の答えとも形が似ている。"}, {"t": 1569.7666666666667, "x": "官房長の答えは、隊内は\n動揺していない、で終わっている。"}, {"t": 1573.9833333333333, "x": "隊員の受け止めについて、もう一つ記録がある。"}, {"t": 1576.9, "x": "12月17日。参議院の委員会だ。"}, {"t": 1579.6666666666667, "x": "共産党の議員が、ある新聞の聞き取りを持ち出した。"}, {"t": 1582.9666666666667, "x": "記者が市ヶ谷の隊員13人に\n話を聞いた、というものだ。"}, {"t": 1586.6666666666667, "x": "そのうち8人が、何らかの形で\n三島の行動に共感を覚えると答えた。"}, {"t": 1591.3333333333333, "x": "議員は6割が共感していると迫った。"}, {"t": 1593.95, "x": "さっきの、ほとんど100%と食い違うわね。"}, {"t": 1596.9666666666667, "x": "食い違う。長官は何て答えたか。"}, {"t": 1599.2833333333333, "x": "その調べ方が分からないと、正しく判断できない。"}, {"t": 1602.5166666666667, "x": "防衛庁が調べた範囲では、\n圧倒的多数が認めていない。"}, {"t": 1606.1666666666667, "x": "そう答えたうえで、隊員の声を一つ紹介している。"}, {"t": 1609.45, "x": "隊員の声？"}, {"t": 1610.4833333333333, "x": "武士道というけれど、ああいうものが\n本当の武士道だろうか。"}, {"t": 1613.8166666666666, "x": "自分の武士道を立てるために、\n人の武士道を踏みにじっていいのか。"}, {"t": 1617.65, "x": "そう言う隊員もいると。"}, {"t": 1619.1333333333334, "x": "……踏みにじられた側の言葉ね。"}, {"t": 1621.05, "x": "ただ、誰が言ったのかは答弁に出てこない。"}, {"t": 1623.65, "x": "名前のない隊員の、一言だけが残っている。"}, {"t": 1626.7, "x": "バルコニーの下の人たちの、数少ない言葉ね。"}, {"t": 1629.9666666666667, "x": "そうだ。やじの中身は残っていない。"}, {"t": 1632.2333333333333, "x": "あとから口にした言葉なら、ここに一つある。"}, {"t": 1635.1166666666666, "x": "長官はこの先のことも気にしていた。"}, {"t": 1637.4666666666667, "x": "これは考えの事件だから、時間が\nたつと人によって受け止めが変わる。"}, {"t": 1641.6833333333334, "x": "特に若い幹部の動きは、いつもよく調べておく。"}, {"t": 1644.7833333333333, "x": "そう答えてこの質問を終えている。"}, {"t": 1647.4333333333334, "x": "益田総監はどうなったか。"}, {"t": 1649.1666666666667, "x": "事件のあと自分から職を辞めている。"}, {"t": 1651.5333333333333, "x": "責任をとって？"}, {"t": 1652.7833333333333, "x": "国会では、自発的な意思で\n辞職した、と言われている。"}, {"t": 1656.3333333333333, "x": "本人は縛られて人質になった側だ。"}, {"t": 1658.85, "x": "それでも、軍の規律の上で責めを問う声があった。"}, {"t": 1661.8333333333333, "x": "旧軍でいえば東部軍の司令官にあたる\n人が、5人の民間人に縛られた。"}, {"t": 1666.4833333333333, "x": "その事実は重いという見方だ。"}, {"t": 1668.5833333333333, "x": "被害を受けた人が、辞めることになったのね。"}, {"t": 1671.5166666666667, "x": "そうだ。そして翌年の2月。"}, {"t": 1673.6333333333334, "x": "中曽根長官が国会で、総監の言葉を紹介している。"}, {"t": 1677.3, "x": "辞めるときに長官にこう言ったそうだ。"}, {"t": 1679.5166666666667, "x": "三島君は自衛隊を知りません。"}, {"t": 1681.2333333333333, "x": "……。"}, {"t": 1682.1666666666667, "x": "理由も続けて言っている。"}, {"t": 1683.7166666666667, "x": "上官を侮辱しておいて、部下が\n言うことを聞くと思ったら大間違いです。"}, {"t": 1687.9833333333333, "x": "上官を縛っておいて、部下に\n立ち上がれって言ったから？"}, {"t": 1691.2833333333333, "x": "総監はそう見ていたということだ。"}, {"t": 1693.2833333333333, "x": "もう一言ある。"}, {"t": 1694.3833333333334, "x": "三島君は武士道を知りません。"}, {"t": 1696.3166666666666, "x": "……縛られた本人の言葉ね。"}, {"t": 1698.2, "x": "長官の口から伝わった言葉だから、\n本人の言い方そのままかは分からない。"}, {"t": 1702.8333333333333, "x": "ただ会議録にはこの形で残っている。"}, {"t": 1705.2833333333333, "x": "バルコニーの下の隊員が、何と返したのか。"}, {"t": 1708.1833333333334, "x": "一言ずつの記録はほとんど無い。"}, {"t": 1710.3, "x": "残っているのは、縛られた総監のこの言葉だ。"}, {"t": 1713.4166666666667, "x": "答えの代わりなのかもしれないわね。"}, {"t": 1716.1166666666666, "x": "自衛隊の警備はそのあと変わったのか。"}, {"t": 1718.4166666666667, "x": "事件から1年4か月たった、1972年3月。"}, {"t": 1722.5166666666667, "x": "防衛庁の人事教育局長が、国会でこう答えている。"}, {"t": 1726.0833333333333, "x": "三島事件などでは、自衛隊にも\n警備の不手ぎわがあった。"}, {"t": 1729.5166666666667, "x": "申しわけないと思っている。"}, {"t": 1731.2666666666667, "x": "はっきり認めたのね。"}, {"t": 1732.8, "x": "認めている。そのあと警備を\n見直して、新しい手を打った、と。"}, {"t": 1736.7, "x": "事件の直後には、長官はほとんど\n防ぎようがなかったと言っていた。"}, {"t": 1740.7, "x": "時間がたって、防衛庁の言い方は少し変わっている。"}, {"t": 1744.05, "x": "体験入隊のほうは？"}, {"t": 1745.6, "x": "事件の直後に官房長はこう説明していた。"}, {"t": 1748.4166666666667, "x": "体験入隊は毎年2000数百件、\n10万人近い人が使っている。"}, {"t": 1752.8833333333334, "x": "自衛隊を知ってもらうのに、とても役に立っている。"}, {"t": 1755.8166666666666, "x": "だから仕組みそのものは続けると。"}, {"t": 1758.0333333333333, "x": "やめはしなかったのね。"}, {"t": 1759.5666666666666, "x": "やめていない。ただ長官は、\n12月の委員会でこう答えている。"}, {"t": 1763.4166666666667, "x": "この事件をふまえて、体験入隊の基準を見直す。"}, {"t": 1766.6333333333334, "x": "二度とああいう事件を\n起こさないように手当てをする、と。"}, {"t": 1769.55, "x": "施設の中の事件でも、\n影響の大きいものは警察に頼む。"}, {"t": 1773.3166666666666, "x": "そういう取り決めがある、と1972年に答弁されている。"}, {"t": 1777.3666666666666, "x": "事件のあとにいろいろ決め直したのね。"}, {"t": 1779.7166666666667, "x": "決め直した。そのきっかけとして、\nこの事件の名前が会議録に何度も出てくる。"}, {"t": 1785.2666666666667, "x": "3人の会員は裁判にかけられた。"}, {"t": 1787.5166666666667, "x": "東京地方裁判所だ。"}, {"t": 1789.1, "x": "判決までに公判は18 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
