<script>
const D={"name": "143", "file": "143_編集用", "dur": 2177.5333125, "segs": [], "subs": [{"t": 0.0, "x": "1960年9月、パリにいた\n陶芸家の言葉が日本に届いた。"}, {"t": 4.4, "x": "「あれはおれが作った」。"}, {"t": 5.683333333333334, "x": "あれ、と呼ばれたのは1本の焼き物だった。"}, {"t": 8.4, "x": "焼き物を作ったって言っただけ？"}, {"t": 10.5, "x": "それだけなら事件にはならない。"}, {"t": 12.35, "x": "その焼き物には、鎌倉時代の年が彫ってあった。"}, {"t": 15.533333333333333, "x": "永仁2年、西暦で言えば1294年だ。"}, {"t": 18.683333333333334, "x": "国は前の年の6月に、これを重要文化財にしていた。"}, {"t": 22.416666666666668, "x": "えっ、昭和の人が作った物を？"}, {"t": 24.7, "x": "作者を名乗った男は加藤唐九郎。"}, {"t": 26.95, "x": "当時、日本の陶芸界で知らない人はいない名前だ。"}, {"t": 30.2, "x": "しかも名乗り出たのは1人じゃなかった。"}, {"t": 32.46666666666667, "x": "その少し前に、息子も「自分が作った」と言っていた。"}, {"t": 36.36666666666667, "x": "親子で取り合いをしてるの？"}, {"t": 38.0, "x": "取り合いと言っていいのか、それも分からない。"}, {"t": 40.45, "x": "指定から解除の告示まで653日。"}, {"t": 43.31666666666667, "x": "国は91個の焼き物を集め、機械で調べた。"}, {"t": 46.55, "x": "そして翌年の国会で局長がこう答えている。"}, {"t": 49.5, "x": "作者がだれかは「二の次」だと。"}, {"t": 51.9, "x": "だれが作ったか調べなかったの？"}, {"t": 54.05, "x": "今回は、死んだ人のいない事件を追う。"}, {"t": 56.46666666666667, "x": "血も出ないし逮捕の話でもない。"}, {"t": 58.5, "x": "それでも答えが出ていないことが1つ残っている。"}, {"t": 61.36666666666667, "x": "国会の記録からその1本を追っていこう。"}, {"t": 64.48333333333333, "x": "まず呼び名の話をしておく。"}, {"t": 66.25, "x": "世間は「永仁の壺」と呼ぶが、実は壺ではない。"}, {"t": 69.75, "x": "じゃあ何なの？"}, {"t": 70.88333333333334, "x": "局長が国会でわざわざ訂正している。"}, {"t": 73.3, "x": "これは壺ではなく瓶子でございます、と。"}, {"t": 75.88333333333334, "x": "へいしって初めて聞いたわ。"}, {"t": 77.65, "x": "神様に酒を供える、細長い器のことだ。"}, {"t": 80.75, "x": "神社の正月飾りで見る、白い\n徳利みたいな形を思えばいい。"}, {"t": 84.66666666666667, "x": "普通は2本1組で供える物だ。"}, {"t": 86.86666666666666, "x": "ここが後でかなり効いてくるから、覚えておいてくれ。"}, {"t": 89.85, "x": "正式な呼び名は永仁銘古瀬戸瓶子。"}, {"t": 92.55, "x": "長いわね、古瀬戸って何？"}, {"t": 94.41666666666667, "x": "鎌倉時代から瀬戸で焼かれた、\n古い焼き物の呼び名だ。"}, {"t": 97.9, "x": "この瓶子には文字が彫ってあった。"}, {"t": 99.86666666666666, "x": "神様に奉る、という言葉と人の名前。"}, {"t": 102.83333333333333, "x": "そこに年が入っていた。"}, {"t": 104.43333333333334, "x": "後の本によれば彫られた年はこうだ。"}, {"t": 106.7, "x": "永仁2年、11月。"}, {"t": 108.43333333333334, "x": "干支の甲午の2文字が斜めに入っている。"}, {"t": 110.98333333333333, "x": "斜めに書いてあると何かあるの？"}, {"t": 113.03333333333333, "x": "それが次の次の話になる。"}, {"t": 115.0, "x": "先に、この文字がどれほど\n大きな意味を持ったかを見る。"}, {"t": 118.73333333333333, "x": "作品の良さで指定されたわけじゃないんだ。"}, {"t": 121.2, "x": "局長はこの点をはっきり説明している。"}, {"t": 123.83333333333333, "x": "きれいだから選ばれたんじゃないの？"}, {"t": 125.81666666666666, "x": "りっぱな作ではある、と局長も認めている。"}, {"t": 128.53333333333333, "x": "でも、むしろ大事なのは銘の古さだった。"}, {"t": 131.15, "x": "それまで年の入った瓶子で\n古いのは、1312年の銘の物だ。"}, {"t": 135.55, "x": "そちらは1937年に重要文化財になっていた。"}, {"t": 139.25, "x": "永仁の銘は1294年だから、18年さかのぼる。"}, {"t": 143.28333333333333, "x": "一番古い記録が更新されたってことね。"}, {"t": 146.03333333333333, "x": "そうだ。答弁の言葉はこうだった。"}, {"t": 148.23333333333332, "x": "わが国最古の銘文のある瓶子である。"}, {"t": 150.58333333333334, "x": "わが国陶磁史上の貴重な資料である。"}, {"t": 152.91666666666666, "x": "つまり値打ちの中心は、1294年という数字だった。"}, {"t": 156.9, "x": "じゃあ数字が違ったら全部崩れるわけね。"}, {"t": 159.46666666666667, "x": "そこがこの事件のいちばん怖いところだ。"}, {"t": 161.86666666666667, "x": "器の見た目がどんなに良くても、関係がなくなる。"}, {"t": 164.95, "x": "局長は後の国会でこう整理した。"}, {"t": 167.26666666666668, "x": "芸術の価値ではなく、歴史の価値で指定したのだと。"}, {"t": 170.61666666666667, "x": "歴史の資料である以上、昭和に\n作られたなら意味がない。"}, {"t": 173.9, "x": "逆に言えば問いはたった1つで済む。"}, {"t": 176.03333333333333, "x": "これは鎌倉の物か、現代の物か。"}, {"t": 178.68333333333334, "x": "簡単そうに聞こえるけど？"}, {"t": 180.43333333333334, "x": "その1問に、国は長い時間をかけることになる。"}, {"t": 184.16666666666666, "x": "話を、世に出た日まで戻そう。"}, {"t": 186.25, "x": "戦争の真っ最中の1943年だ。"}, {"t": 189.2, "x": "局長の説明では、出どころはこうなっている。"}, {"t": 191.98333333333332, "x": "愛知県東春日井郡の志段味村から出土した。"}, {"t": 195.18333333333334, "x": "いまの名古屋市守山区にあたる場所だ。"}, {"t": 197.45, "x": "これを地元の新聞が報道した。"}, {"t": 199.66666666666666, "x": "畑から出てきたってこと？"}, {"t": 201.55, "x": "村のある場所から出た、という話だった。"}, {"t": 204.11666666666667, "x": "局長は「出土したといわれております」と言っている。"}, {"t": 207.51666666666668, "x": "いわれております、なのね。"}, {"t": 209.3, "x": "そこは慎重な言い方をしている。"}, {"t": 211.23333333333332, "x": "この記事で、瓶子は専門家の注目の的になった。"}, {"t": 214.55, "x": "1943年の日本に、焼き物を論じる\n余裕があったのかと思うよな。"}, {"t": 219.3, "x": "それでも学者の雑誌に紹介された、と後の本にある。"}, {"t": 222.73333333333332, "x": "さらに後の本によれば、発掘の話そのものも怪しい。"}, {"t": 226.28333333333333, "x": "関係者の証言で否定された、と書かれている。"}, {"t": 229.35, "x": "掘り出した話がもう違ったの？"}, {"t": 231.45, "x": "国会の答弁は、そこまでは踏み込んでいない。"}, {"t": 234.18333333333334, "x": "ただ、ここに不思議なことが1つある。"}, {"t": 236.56666666666666, "x": "会議録の説明には、発掘の記録が出てこないんだ。"}, {"t": 240.0, "x": "だれが、いつ、どう掘ったのかの話がない。"}, {"t": 242.7, "x": "あるのは新聞に載った、という事実だけだ。"}, {"t": 245.46666666666667, "x": "新聞に出たら本当になっちゃうのね。"}, {"t": 247.81666666666666, "x": "この「だれも疑わなかった」が、ずっと続いていく。"}, {"t": 251.8, "x": "戦争が終わって1946年に話が動く。"}, {"t": 255.2, "x": "窯跡の調査の報告の会で、\n永仁の銘の瓶子が2本出てきた。"}, {"t": 259.48333333333335, "x": "2本？　そういえば普通は2本1組だったわね。"}, {"t": 262.4166666666667, "x": "そう、2本そろって出たんだ。"}, {"t": 264.25, "x": "これがまた、本物らしさを強めたんだろう。"}, {"t": 266.9, "x": "局長の答弁にその後の流れが出てくる。"}, {"t": 269.46666666666664, "x": "1本はある元代議士の手に渡った。"}, {"t": 271.73333333333335, "x": "もう1本は、鳥取県米子市の持ち主のところへ。"}, {"t": 274.95, "x": "後の本では値段も書かれている。"}, {"t": 276.96666666666664, "x": "1本が5万円で、もう1本が7万円だという。"}, {"t": 280.1333333333333, "x": "当時の5万円って大金よね？"}, {"t": 282.21666666666664, "x": "終戦の翌年だから相当な額だろう。"}, {"t": 284.6666666666667, "x": "ところが、元代議士の方の1本の足どりが消える。"}, {"t": 287.8666666666667, "x": "いつのまにか、どこへ行ったか分からなくなった。"}, {"t": 290.71666666666664, "x": "なくなっちゃったの？"}, {"t": 292.0, "x": "局長の言葉をそのまま言うとこうだ。"}, {"t": 294.25, "x": "たぶんこれは外国に出たに違いない。"}, {"t": 296.43333333333334, "x": "そう心配した、と国会で説明している。"}, {"t": 299.1666666666667, "x": "後の本では、1950年の売却で行方が切れたという。"}, {"t": 303.0833333333333, "x": "わが国最古の銘の瓶子が1本消えた。"}, {"t": 305.6333333333333, "x": "残りの1本も外国へ行ったら大変だ。"}, {"t": 308.3, "x": "その焦りが指定につながるわけね。"}, {"t": 310.51666666666665, "x": "局長はあからさまに認めている。"}, {"t": 312.55, "x": "外に出ないようにという理由も、1つの理由だったと。"}, {"t": 315.78333333333336, "x": "急いだのは文化財を守るためだった。"}, {"t": 318.1, "x": "悪い動機ではなかったのが、この話の苦いところだ。"}, {"t": 322.03333333333336, "x": "鎌倉の物なら焼いた窯があるはずだ。"}, {"t": 324.4166666666667, "x": "その窯の名前が「松留窯」。"}, {"t": 326.6, "x": "文化財の役所の技官も、現地へ足を運んでいる。"}, {"t": 329.9, "x": "窯跡をちゃんと見に行ったのね？"}, {"t": 331.81666666666666, "x": "局長の説明を聞いてくれ。"}, {"t": 333.6166666666667, "x": "現地へ行って松留窯はどこかと聞いた。"}, {"t": 336.1166666666667, "x": "すると案内されてこの辺だと言われた。"}, {"t": 338.45, "x": "そして帰ってきた、というんだ。"}, {"t": 340.56666666666666, "x": "それだけ？　掘ったりしないの？"}, {"t": 342.48333333333335, "x": "答弁に出てくるのはそこまでだ。"}, {"t": 344.43333333333334, "x": "それでも疑われなかった理由がある。"}, {"t": 346.53333333333336, "x": "陶磁の辞典の地図に、窯の場所が載っていた。"}, {"t": 349.3333333333333, "x": "鎌倉時代の作品として、永仁銘の瓶子も載っていた。"}, {"t": 353.18333333333334, "x": "辞典に載ってたら信じるわよね。"}, {"t": 355.28333333333336, "x": "ある議員はこの委員会で違う話をしている。"}, {"t": 357.8833333333333, "x": "この問題が起こるまで、そんな窯は\n知られてなかったと聞くと。"}, {"t": 361.56666666666666, "x": "そして別の日に、高津正道という議員が指摘する。"}, {"t": 364.98333333333335, "x": "加藤唐九郎は「陶器辞典」の編さん者でもある、と。"}, {"t": 368.5, "x": "え、辞典を作った人が唐九郎さんなの？"}, {"t": 371.21666666666664, "x": "ここは慎重に言わないといけない。"}, {"t": 373.1333333333333, "x": "局長が言った辞典と議員が言った辞典。"}, {"t": 375.53333333333336, "x": "同じ本かどうかは、会議録だけでは確かめられない。"}, {"t": 378.73333333333335, "x": "ただ、瀬戸の焼き物の知識が、\n1人に集まっていたのは確かだ。"}, {"t": 382.9, "x": "唐九郎は若いころから古い窯跡を調べてきた人だった。"}, {"t": 386.4166666666667, "x": "1929年には、古窯の調査と保存の会を作っている。"}, {"t": 390.46666666666664, "x": "古瀬戸を語るなら、この人に聞くのが普通だった。"}, {"t": 393.5833333333333, "x": "後の本には、松留窯そのものが無かったと\n書かれている。"}, {"t": 397.31666666666666, "x": "窯まで作り話だったってこと？"}, {"t": 399.55, "x": "国の結論ではない、後の本の見方だ。"}, {"t": 402.25, "x": "局長も最後まで「いわゆる松留窯」としか\n呼ばなかった。"}, {"t": 406.68333333333334, "x": "指定の話は、実は1959年が最初じゃない。"}, {"t": 410.4, "x": "11年前の1948年に、一度審議にかかっている。"}, {"t": 414.6, "x": "まだ文化財保護委員会ができる前のことだ。"}, {"t": 417.4, "x": "じゃあ、そのとき通らなかったの？"}, {"t": 419.5, "x": "通らなかった。1人の委員が止めたんだ。"}, {"t": 422.03333333333336, "x": "止めた理由が面白い。"}, {"t": 423.46666666666664, "x": "年の干支、甲午の2文字が斜めになっている。"}, {"t": 426.25, "x": "普通は縦か横に書くものだ。"}, {"t": 428.18333333333334, "x": "委員はこう言ったと記録にある。"}, {"t": 429.95, "x": "斜めになっているのはあまり見たことがない。"}, {"t": 432.31666666666666, "x": "ちょっとおかしいじゃないか。"}, {"t": 433.85, "x": "すごい、見抜いてたの？"}, {"t": 435.4, "x": "見抜いたと言えるかは分からない。"}, {"t": 437.1166666666667, "x": "ただ、ここで一度止まったのは事実だ。"}, {"t": 439.5833333333333, "x": "委員の感じた小さな引っかかりが、\n指定を10年以上遅らせた。"}, {"t": 443.43333333333334, "x": "もっと調査してみるように、ということで\n保留になった。"}, {"t": 446.6666666666667, "x": "じゃあ調べたら、おかしいって分かるはずよね？"}, {"t": 449.3333333333333, "x": "普通はそう思うだろう？"}, {"t": 450.68333333333334, "x": "ここで役所は何を調べたと思う。"}, {"t": 452.9166666666667, "x": "焼き物そのものを調べたんじゃないの？"}, {"t": 455.21666666666664, "x": "違う。調べたのは、斜めに\n書いた例があるかどうかだ。"}, {"t": 458.6666666666667, "x": "えっ、文字の書き方だけ？"}, {"t": 460.56666666666666, "x": "出された問いが、斜めはおかしい、だったからな。"}, {"t": 463.48333333333335, "x": "問いに答えるとしたらそうなるわけだ。"}, {"t": 466.26666666666665, "x": "そして例は見つかった。"}, {"t": 467.71666666666664, "x": "局長は国会で1つずつ読み上げている。"}, {"t": 470.28333333333336, "x": "奈良の興福寺の竜燈鬼像。"}, {"t": 472.0833333333333, "x": "鎌倉時代の仏像に、干支が斜めに入っていた。"}, {"t": 475.28333333333336, "x": "鎌倉の建長寺の鐘にもある。"}, {"t": 477.3333333333333, "x": "こちらは国宝で1255年の銘だ。"}, {"t": 480.03333333333336, "x": "熊本のお寺の仏像には、永仁3年の例まであった。"}, {"t": 483.65, "x": "同じ永仁の時代にも斜めがあったのね。"}, {"t": 486.25, "x": "つり鐘にも、刀にも、墓石にもあった。"}, {"t": 489.3, "x": "じゃあ委員の疑問は解決じゃない。"}, {"t": 491.31666666666666, "x": "そう、解決してしまった。"}, {"t": 493.1, "x": "局長はこの委員会でそう説明している。"}, {"t": 495.6166666666667, "x": "斜めの例がある以上、問題はなくなった、と。"}, {"t": 498.5, "x": "ここが皮肉なところだ。"}, {"t": 500.05, "x": "反対の理由が1つだったから、それを潰せば道が開く。"}, {"t": 503.73333333333335, "x": "丁寧に調べたことが、逆に指定を後押しした。"}, {"t": 506.8666666666667, "x": "丁寧なのに方向が違ったのね。"}, {"t": 509.06666666666666, "x": "鎌倉の字の書き方を知っている人なら、まねもできる。"}, {"t": 512.4666666666667, "x": "これは後から見て言えることで、当時は言えない話だ。"}, {"t": 515.6, "x": "ここまで何年かかったか、もう一度数える。"}, {"t": 518.35, "x": "1943年に記事が出て、1948年に保留。"}, {"t": 522.7333333333333, "x": "そして次に審議に出たのが1959年だ。"}, {"t": 525.9833333333333, "x": "その間、瓶子は展覧会に何度も出ている。"}, {"t": 528.85, "x": "デパートの陶磁の名品展にも並んだ。"}, {"t": 531.25, "x": "局長の言葉ではこうなる。"}, {"t": 532.95, "x": "だれも疑いを持っておらなかった。"}, {"t": 535.5833333333334, "x": "1959年、瓶子は再び審議にかかる。"}, {"t": 538.9166666666666, "x": "工芸を見る部会で説明が行われた。"}, {"t": 541.3166666666667, "x": "結果は局長の言葉によるとこうだ。"}, {"t": 543.6166666666667, "x": "1人の反対者もなく通過した。"}, {"t": 545.8833333333333, "x": "今度は全員賛成なのね。"}, {"t": 547.7666666666667, "x": "6月27日、重要文化財の指定が告示された。"}, {"t": 551.4833333333333, "x": "ここで大事な点がある。"}, {"t": 552.95, "x": "持ち主が申請したわけじゃないんだ。"}, {"t": 555.2333333333333, "x": "頼まれて指定したんじゃないの？"}, {"t": 557.1833333333333, "x": "ある議員もそこを聞いている。"}, {"t": 558.7333333333333, "x": "骨董屋が持ってきたのか、作者が運動したのか、と。"}, {"t": 562.1666666666666, "x": "局長の答えは、申請書は出ていない、だった。"}, {"t": 565.2, "x": "国宝や重要文化財は、国の側が選ぶ仕組みだ。"}, {"t": 568.45, "x": "だから責任も国の側にある。"}, {"t": 570.5333333333333, "x": "で、指定の中心にいたのはだれなの？"}, {"t": 572.9833333333333, "x": "文部技官の小山冨士夫。"}, {"t": 574.5833333333334, "x": "陶磁の研究の第一人者と言っていい人だ。"}, {"t": 577.3333333333334, "x": "中国の陶器に非常に詳しい、と局長も言っている。"}, {"t": 580.5833333333334, "x": "高津正道はまるで元老のようだと呼んだ。"}, {"t": 583.2166666666667, "x": "重要文化財にするか決める\n部署の専門家が、この人だった。"}, {"t": 587.2, "x": "その人が大丈夫と言えば通るわけね。"}, {"t": 589.6333333333333, "x": "局長の説明で分かることがもう1つある。"}, {"t": 592.2833333333333, "x": "鑑定を支えていたのは何だったのか。"}, {"t": 594.5666666666667, "x": "局長は、多年の経験、学識、\nそして最後は直感だと言った。"}, {"t": 599.05, "x": "最後は勘ってこと？"}, {"t": 600.4833333333333, "x": "美術の世界では、それが普通のやり方だった。"}, {"t": 603.4666666666667, "x": "見て分かる人が見て決める。"}, {"t": 605.1666666666666, "x": "その時代の頂点にいた目が見たわけだ。"}, {"t": 607.5666666666667, "x": "そして指定から8か月ほどで、地元から声が上がる。"}, {"t": 611.5666666666667, "x": "1960年2月ごろの話だ。"}, {"t": 614.2, "x": "名古屋で「火と土」という展覧会が開かれた。"}, {"t": 617.3166666666667, "x": "指定されたばかりの瓶子も並んだ。"}, {"t": 619.4666666666667, "x": "これを地元の研究家たちが見たわけだ。"}, {"t": 622.05, "x": "地元の人は初めて見たの？"}, {"t": 624.05, "x": "会議録からは読み取れない。"}, {"t": 625.7, "x": "局長の答弁はこうなっている。"}, {"t": 627.6, "x": "どうもこれはおかしいと言った、と後で聞いた。"}, {"t": 630.1333333333333, "x": "東京の頂点の目が通した物を、地元の人が疑った。"}, {"t": 633.9666666666667, "x": "よく言えたわね。"}, {"t": 635.1, "x": "瀬戸には古瀬戸の研究者が何人もいたんだ。"}, {"t": 637.8333333333334, "x": "局長も「相当りっぱな研究者」と認めている。"}, {"t": 641.15, "x": "彼らは要望書を国へ出した。"}, {"t": 642.9666666666667, "x": "鎌倉時代の物ではないから、解除すべきではないか。"}, {"t": 646.4166666666666, "x": "役所に面と向かって言ったのね。"}, {"t": 648.55, "x": "同じ2月、読売新聞もこの問題を取り上げたという。"}, {"t": 652.0, "x": "ここから世間の目が瓶子に向いていく。"}, {"t": 654.3, "x": "ある議員の紹介では、指摘は個条書きになっていた。"}, {"t": 657.5, "x": "その数、18か条だ。"}, {"t": 659.4166666666666, "x": "18個もおかしな点があるって？"}, {"t": 661.5166666666667, "x": "その議員は読んでこう言っている。"}, {"t": 663.25, "x": "これが分からないはずはないと思うのです。"}, {"t": 665.5333333333333, "x": "中にはレントゲンの話も入っていたらしい。"}, {"t": 668.1, "x": "鎌倉の物は下の方がだんだん厚くなる。"}, {"t": 670.7333333333333, "x": "現代の作品は厚さが一様になる。"}, {"t": 673.1166666666667, "x": "レントゲンをかければ分かる、という内容だ。"}, {"t": 675.75, "x": "じゃあすぐにレントゲンを当てればいいじゃない。"}, {"t": 677.9833333333333, "x": "そこがまた、後で国会で問われることになる。"}, {"t": 681.4166666666666, "x": "ここからの話は取り扱いに注意が要る。"}, {"t": 683.95, "x": "国会で読み上げられた、ある手記の話だからだ。"}, {"t": 686.9833333333333, "x": "1961年4月、高津正道が委員会で読んだ。"}, {"t": 690.95, "x": "瀬戸の研究会の会長が雑誌に書いた文章だ。"}, {"t": 694.1166666666667, "x": "手記に何が書いてあったの？"}, {"t": 695.95, "x": "1960年2月19日、会長の家に人が集まった。"}, {"t": 700.1333333333333, "x": "地元の研究家3人と新聞4社の記者たち。"}, {"t": 703.2166666666667, "x": "そこへ小山冨士夫も出席したという。"}, {"t": 705.6333333333333, "x": "うわ、大勢に囲まれるじゃない。"}, {"t": 707.6166666666667, "x": "手記によれば席でこんな言葉が出た。"}, {"t": 709.9166666666666, "x": "私は責任上帰って役所をやめます。"}, {"t": 712.5, "x": "一同しゅんとなりました、と続く。"}, {"t": 714.8166666666667, "x": "本当にそう言ったの？"}, {"t": 716.3, "x": "そこは言い切れない。"}, {"t": 717.4333333333333, "x": "これは片方の側が書いた手記だからな。"}, {"t": 719.8833333333333, "x": "手記には、会談をテープ2巻に録ったともある。"}, {"t": 722.7166666666667, "x": "ただ、国の答弁にも重なるところはある。"}, {"t": 725.3333333333334, "x": "局長は2月ごろの小山の動きをこう説明した。"}, {"t": 728.4333333333333, "x": "現地に行き、加藤氏の子に会った。"}, {"t": 730.6, "x": "いろいろな人と話をした。"}, {"t": 732.3833333333333, "x": "そして真相を聞いてがく然とした。"}, {"t": 734.5666666666667, "x": "そういう報告を受けている、と。"}, {"t": 736.5333333333333, "x": "がく然としたのね。"}, {"t": 737.9666666666667, "x": "別の日の答弁でも局長はこう言った。"}, {"t": 740.4, "x": "率直に申しますと、がく然としたことも事実だ。"}, {"t": 743.7, "x": "小山は主管の課長に相談したという。"}, {"t": 746.1333333333333, "x": "自分は責任を感じている、どうすればいいか、と。"}, {"t": 749.1666666666666, "x": "進退をどうしたらよいか、という申し出だ。"}, {"t": 751.8, "x": "止めたのはだれなの？"}, {"t": 753.1666666666666, "x": "局長は、結果を明らかにするのが責任だと言った。"}, {"t": 756.5, "x": "あなたも一緒に調査に従事してもらいたいと。"}, {"t": 759.1333333333333, "x": "指定を推した本人が、\n自分の失敗を調べる側に入った。"}, {"t": 762.8166666666667, "x": "局長は、本当に謙虚な態度だったと答弁している。"}, {"t": 766.2166666666667, "x": "この時点で、まだ作者の名前は表に出ていない。"}, {"t": 769.9166666666666, "x": "1960年の夏の終わり、最初の名前が出る。"}, {"t": 773.3166666666667, "x": "後の本では8月、局長の答弁では9月だ。"}, {"t": 776.5666666666667, "x": "名乗ったのは唐九郎の長男、加藤嶺男。"}, {"t": 779.1333333333333, "x": "のちに岡部嶺男の名で知られる陶芸家だ。"}, {"t": 781.75, "x": "息子さんが作ったの？"}, {"t": 783.3666666666667, "x": "答弁の言葉では、あれは自分が作ったものである。"}, {"t": 786.4333333333333, "x": "新聞に出たそうだ。"}, {"t": 787.7333333333333, "x": "嶺男は1919年の生まれ、当時40歳だ。"}, {"t": 791.1666666666666, "x": "後の青い焼き物で高く評価される人でもある。"}, {"t": 794.2, "x": "もう立派な作家じゃない。"}, {"t": 795.7666666666667, "x": "計算してみると話がややこしくなる。"}, {"t": 798.15, "x": "作られたのは1937年ごろという話がある。"}, {"t": 801.7833333333333, "x": "嶺男さんはそのころ10代じゃない？"}, {"t": 803.85, "x": "そう、17歳か18歳の作という話になる。"}, {"t": 807.1, "x": "のちの美術の解説にはこんな説明がある。"}, {"t": 809.7833333333333, "x": "若き日の習作に永仁銘を入れられた、と。"}, {"t": 812.6666666666666, "x": "入れられた？　自分で入れたんじゃなくて？"}, {"t": 815.0, "x": "その書き方だと、銘は別のだれかということになる。"}, {"t": 818.1666666666666, "x": "ただ、それはこの解説の見方の1つだ。"}, {"t": 820.9333333333333, "x": "断定できる材料は公の記録にはない。"}, {"t": 823.4833333333333, "x": "父との関係もこの件で壊れたと伝えられている。"}, {"t": 826.5333333333333, "x": "この親子のあいだに何があったかは、\nだれにも分からない。"}, {"t": 829.8333333333334, "x": "息子が言ったらお父さんはどうしたの？"}, {"t": 832.1166666666667, "x": "そこが、この事件で一番有名な場面になる。"}, {"t": 835.6666666666666, "x": "ひと月ほどあとのことだ。"}, {"t": 837.3, "x": "加藤唐九郎はヨーロッパに渡っていた。"}, {"t": 839.5666666666667, "x": "パリから父の声が届く。"}, {"t": 841.25, "x": "局長が国会で紹介した言葉はこうだ。"}, {"t": 843.9, "x": "あれはせがれじゃない。おれが作ったんである。"}, {"t": 846.4, "x": "息子をかばったってこと？"}, {"t": 848.0666666666667, "x": "かばったのか、本当に作ったのか。"}, {"t": 850.4166666666666, "x": "そこは、いまも書く人によって割れている。"}, {"t": 852.9166666666666, "x": "朝日新聞は9月25日付で、パリでの告白を報じた。"}, {"t": 856.8666666666667, "x": "後の本では、1937年ごろに作ったと言ったとされる。"}, {"t": 861.2, "x": "1937年なら戦争の前よね。"}, {"t": 864.15, "x": "鎌倉時代から数えて643年後だ。"}, {"t": 867.1666666666666, "x": "唐九郎は当時すでに大物だった。"}, {"t": 869.3, "x": "1952年には、織部焼の技術で国から選ばれている。"}, {"t": 873.35, "x": "その人が、国の指定した物を\n自分の作だと言ったわけだ。"}, {"t": 877.15, "x": "国の顔に泥を塗ったようなものじゃない。"}, {"t": 879.5333333333333, "x": "地元の議員は、翌年の国会で怒りをあらわにした。"}, {"t": 882.8666666666667, "x": "昭和の妖怪変化物語のようなことだ。"}, {"t": 885.5, "x": "幽霊みたいに出てきて、私が作りましたと言う。"}, {"t": 888.6833333333333, "x": "ずいぶんな言われようね。"}, {"t": 890.1166666666667, "x": "議員の気持ちとしては、郷土の恥でもあったんだ。"}, {"t": 893.0833333333334, "x": "別の地元の議員は、のちにこうも言っている。"}, {"t": 895.8, "x": "永仁の壺は私の郷里でできたのですから。"}, {"t": 898.5333333333333, "x": "しろうとでもみな知っておることなんです。"}, {"t": 900.9, "x": "地元の人は分かってたって言いたいのね。"}, {"t": 903.4166666666666, "x": "そう言いたいのは分かるが、これは本人の見方だ。"}, {"t": 906.2666666666667, "x": "現に長いあいだ、だれも声を上げなかった。"}, {"t": 909.5, "x": "名乗りは2つでは終わらなかった。"}, {"t": 911.45, "x": "局長の答弁には、もう1つ別の話が出てくる。"}, {"t": 914.7666666666667, "x": "第三者が文化財の役所にやって来た。"}, {"t": 917.3, "x": "そしてこう言ったというんだ。"}, {"t": 918.8833333333333, "x": "あれは加藤唐九郎の弟が作った。"}, {"t": 921.2833333333333, "x": "今度は弟さん？"}, {"t": 922.5666666666667, "x": "これで作者の候補が3人になった。"}, {"t": 924.8666666666667, "x": "後の本には、次男の名前まで挙がっている。"}, {"t": 927.7, "x": "全部家族じゃない。"}, {"t": 929.0, "x": "局長の説明はとても冷静だ。"}, {"t": 931.1166666666667, "x": "これらはすべて、1つの重要な参考資料になる。"}, {"t": 934.25, "x": "参考資料だ、決め手じゃないと言っている。"}, {"t": 936.8333333333334, "x": "本人が作ったと言ってるのに？"}, {"t": 938.8666666666667, "x": "そこが面白いところなんだ。"}, {"t": 940.6333333333333, "x": "国から見るとこういう理屈になる。"}, {"t": 942.65, "x": "あの絵はおれがかいた、と言う人が現れたとする。"}, {"t": 945.4666666666667, "x": "それだけで指定を外していたらどうなるか。"}, {"t": 948.0, "x": "だれでも言えちゃうわね。"}, {"t": 949.4333333333333, "x": "そう、それが局長の答弁だった。"}, {"t": 951.6833333333333, "x": "自分が作ったからということだけで、\n処置するのは軽々だ。"}, {"t": 955.25, "x": "高津正道はこの理屈にかみつく。"}, {"t": 957.5833333333334, "x": "本人は去年の10月にパリから帰っている。"}, {"t": 960.2666666666667, "x": "どうして呼んで聞くことをしないのか、と。"}, {"t": 962.7333333333333, "x": "それは聞けばいいのにって思うわ。"}, {"t": 964.6833333333333, "x": "局長の返事がこの事件の核心に触れる。"}, {"t": 967.4166666666666, "x": "ただ、その前に見ておくものがある。"}, {"t": 969.5833333333334, "x": "名乗りが飛び交うあいだに、瓶子が動いたんだ。"}, {"t": 972.9166666666666, "x": "重要文化財でも、\n個人の持ち物であることは変わらない。"}, {"t": 976.3666666666667, "x": "だから持ち主は売ることができる。"}, {"t": 978.35, "x": "1960年、問題になってから瓶子は人の手に渡った。"}, {"t": 982.4666666666667, "x": "米子の持ち主から名古屋の人へだ。"}, {"t": 984.85, "x": "疑われている最中に売れるの？"}, {"t": 986.8666666666667, "x": "局長の説明では、役所はこう伝えたという。"}, {"t": 989.8333333333334, "x": "いま問題になっていることを承知してもらいたい。"}, {"t": 992.5333333333333, "x": "自分の物をだれに売ろうと、止められない。"}, {"t": 994.95, "x": "売る側も買う側も、知っていたことになる。"}, {"t": 997.6333333333333, "x": "知ってて買う人がいるの？"}, {"t": 999.3166666666667, "x": "後の本には事情が書かれている。"}, {"t": 1001.3166666666667, "x": "買い戻しの形で、3人が150万円を出したという。"}, {"t": 1004.9333333333333, "x": "その3人の中に、加藤唐九郎の名前もある。"}, {"t": 1008.0333333333333, "x": "えっ、自分で買い戻したの？"}, {"t": 1010.0333333333333, "x": "あくまで後の本による話だ。"}, {"t": 1012.0, "x": "会議録には、買い手の事情までは出てこない。"}, {"t": 1014.65, "x": "ただ、高津正道が国会で問題にしたことは残っている。"}, {"t": 1018.3833333333333, "x": "国が指定すると値段が動く。"}, {"t": 1020.35, "x": "重要文化財にすれば10倍にも上がる、と彼は言った。"}, {"t": 1023.6333333333333, "x": "同じ窯の出土品として売られた\n品も、値が上がったという。"}, {"t": 1027.2666666666667, "x": "それが下がれば持ち主は損をする。"}, {"t": 1029.4666666666667, "x": "国の判断ひとつで財産が変わるのね。"}, {"t": 1032.1, "x": "ある骨董屋は国を訴えると\n言っている、という話まで出た。"}, {"t": 1035.6, "x": "局長は値段の話は認めなかった。"}, {"t": 1038.0666666666666, "x": "指定の後の売買は1回だけ、と答えただけだ。"}, {"t": 1041.1666666666667, "x": "鑑定は学問であると同時に、お金の話でもあった。"}, {"t": 1045.2166666666667, "x": "役所はどう動いたのか。"}, {"t": 1046.7166666666667, "x": "1960年の秋、正式な調査を始めた。"}, {"t": 1050.1333333333334, "x": "局長の言葉は「虚心たんかい」だ。"}, {"t": 1052.6833333333334, "x": "きょしんたんかいって、素直な気持ちで、よね？"}, {"t": 1055.6333333333334, "x": "そう。行きがかりにとらわれない、とも言った。"}, {"t": 1058.25, "x": "集まったのは十数名の専門家。"}, {"t": 1060.4166666666667, "x": "役所の技官のほか、東京と京都の国立博物館の人。"}, {"t": 1064.3833333333334, "x": "研究所の人に加えて民間の人も入った。"}, {"t": 1067.3, "x": "調査の回数は、翌年の2月までに8回に及んだ。"}, {"t": 1070.9, "x": "どうやって調べるの？"}, {"t": 1072.3, "x": "やり方がここで大きく変わる。"}, {"t": 1074.1166666666666, "x": "比べるための焼き物を、とにかく集めたんだ。"}, {"t": 1076.9333333333334, "x": "良い物も、怪しい物も、全部だ。"}, {"t": 1079.3166666666666, "x": "指定された物も、されていない物も集めた。"}, {"t": 1082.15, "x": "出土した場所と日が分かっている物も入れた。"}, {"t": 1084.8333333333333, "x": "お寺や神社に長く伝わった物もあった。"}, {"t": 1087.4, "x": "形の完全な物が91個。"}, {"t": 1089.6666666666667, "x": "破片が149件。"}, {"t": 1091.4666666666667, "x": "すごい量ね。"}, {"t": 1092.5833333333333, "x": "永仁の瓶子を中心に、240件を集めたわけだ。"}, {"t": 1096.2, "x": "見方は3つあった。"}, {"t": 1097.5333333333333, "x": "形と作り方、文字の書き方、そして焼き物の中身。"}, {"t": 1101.3666666666666, "x": "ここで初めて、人の目のほかに機械が入ってくる。"}, {"t": 1104.75, "x": "11年前に斜めの文字を調べたのとは大違いね。"}, {"t": 1108.1, "x": "そう、問いがやっと焼き物そのものに向いた。"}, {"t": 1110.6666666666667, "x": "鎌倉の物か、現代の物か。"}, {"t": 1112.9166666666667, "x": "局長の言葉で言えば、問いはそれだけだった。"}, {"t": 1116.3166666666666, "x": "1961年4月の答弁に、結果が細かく出ている。"}, {"t": 1120.3666666666666, "x": "使った調べ方は3つだ。"}, {"t": 1122.2, "x": "1つ目はエックス線の蛍光分析。"}, {"t": 1124.6666666666667, "x": "名前からして難しそう。"}, {"t": 1126.45, "x": "焼き物の表面の釉薬、つまりガラス質の上薬を調べる。"}, {"t": 1130.3, "x": "そこに、ごく少しだけ入っている元素を測るんだ。"}, {"t": 1133.45, "x": "ストロンチウムとルビジウムという2つの元素だ。"}, {"t": 1136.2, "x": "この2つの比率を鎌倉の物と比べた。"}, {"t": 1139.0166666666667, "x": "で、どうだったの？"}, {"t": 1140.3333333333333, "x": "比率が鎌倉の焼き物と違っていた。"}, {"t": 1142.8166666666666, "x": "釉薬の中身の違いが数字に出たわけだ。"}, {"t": 1145.4333333333334, "x": "2つ目は位相差顕微鏡だ。"}, {"t": 1147.2666666666667, "x": "当時これは東大にしか無かったという。"}, {"t": 1149.5, "x": "これで表面を拡大して見る。"}, {"t": 1151.4833333333333, "x": "何を見るの？"}, {"t": 1152.6166666666666, "x": "長い年月で釉薬が傷んだ跡だ。"}, {"t": 1154.8833333333334, "x": "600年以上たてば、表面は風化していくはずだ。"}, {"t": 1158.1166666666666, "x": "局長の説明でも、出土品は特に調べやすいとされた。"}, {"t": 1161.85, "x": "ところが永仁の瓶子には、\n経年の変化が認められなかった。"}, {"t": 1165.7666666666667, "x": "古くないってことじゃない！"}, {"t": 1167.4, "x": "3つ目がエックス線写真だ。"}, {"t": 1169.2833333333333, "x": "外からは見えない内部の作りを写す。"}, {"t": 1171.6333333333334, "x": "成形のしかたが、鎌倉の物と異なっていた。"}, {"t": 1174.7166666666667, "x": "3つの結果が全部同じ向きを指した。"}, {"t": 1177.1, "x": "形と作り方の調査では、\n近代の特徴も見つかっていた。"}, {"t": 1180.9833333333333, "x": "局長は、科学調査はそれを裏づけたと説明している。"}, {"t": 1184.5833333333333, "x": "じゃあ答えは出たのね。"}, {"t": 1186.0166666666667, "x": "出た。でも、機械が言えるのはそこまでだ。"}, {"t": 1188.6166666666666, "x": "機械は「鎌倉の物と違う」とは言える。"}, {"t": 1191.3166666666666, "x": "「だれが作った」とは言わない。"}, {"t": 1193.1, "x": "この区別を覚えておいてほしい。"}, {"t": 1195.5, "x": "この結果は別の問いを呼ぶ。"}, {"t": 1197.2333333333333, "x": "なぜ指定の前にやらなかったのか。"}, {"t": 1199.4333333333334, "x": "それ、私も思った。"}, {"t": 1201.1666666666667, "x": "1961年2月、高津正道が聞いている。"}, {"t": 1204.7833333333333, "x": "事前の調査では、科学的なことは\n一つもやっていなかった。"}, {"t": 1208.5333333333333, "x": "そう受け取っていいですね、と。"}, {"t": 1210.4166666666667, "x": "局長は何て？"}, {"t": 1211.6666666666667, "x": "蛍光分析も表面調査も、いたしておらなかった。"}, {"t": 1214.9, "x": "はっきりそう認めている。"}, {"t": 1216.4, "x": "別の委員会でも、ある議員に言われて答えた。"}, {"t": 1219.2, "x": "指定の時にやるべきだったという\n意見に、全く同感だと。"}, {"t": 1222.9666666666667, "x": "謝るんだ。"}, {"t": 1224.1, "x": "ただ、言い分もある。"}, {"t": 1225.4166666666667, "x": "機械そのものが、当時の役所に無かったんだ。"}, {"t": 1228.3, "x": "表面を調べる分析の装置は、東京に1台あるくらい。"}, {"t": 1231.8166666666666, "x": "だからこれを機に、予算で買うことにしたという。"}, {"t": 1234.5833333333333, "x": "高津正道は容赦がない。"}, {"t": 1236.35, "x": "事件にぶつかって慌てて買うのは間が抜けている。"}, {"t": 1239.1166666666666, "x": "研究所にレントゲンくらいあるだろう。"}, {"t": 1241.1833333333334, "x": "文部省は科学教育を奨励する本場でしょうか、と。"}, {"t": 1244.5, "x": "それは言われちゃうわね。"}, {"t": 1245.9, "x": "局長はここで面白い答えも返している。"}, {"t": 1248.4833333333333, "x": "結果的には、非常にいい勉強の機会を得た。"}, {"t": 1251.4833333333333, "x": "勉強の機会！？"}, {"t": 1252.6833333333334, "x": "さすがに言い方が悪いと思ったのかもしれない。"}, {"t": 1255.35, "x": "何でもかんでも科学に頼ってはいけない、とも続けた。"}, {"t": 1258.6666666666667, "x": "両方一緒にやっていくのだと。"}, {"t": 1260.5166666666667, "x": "この「両方」が、1年後に別の形で出てくる。"}, {"t": 1264.5333333333333, "x": "国会の議論は責任の場所にも及んだ。"}, {"t": 1267.05, "x": "1961年2月24日の衆議院の文教委員会だ。"}, {"t": 1271.2, "x": "高津正道が文部大臣に聞く。"}, {"t": 1273.45, "x": "博物館の信用、国際的な信用の話をした。"}, {"t": 1276.95, "x": "にせ物だと分かれば、海外でどう言われるか。"}, {"t": 1279.6333333333334, "x": "日本の国際信用を落とす、と彼は迫った。"}, {"t": 1282.6666666666667, "x": "壺1本で国際信用？"}, {"t": 1284.4833333333333, "x": "確かに、永仁のつぼは小さい問題に見える。"}, {"t": 1287.3, "x": "高津自身がそう言ったうえで、大きな問題だと言った。"}, {"t": 1290.55, "x": "大臣の答えはこうだった。"}, {"t": 1292.25, "x": "文部大臣としてはいかんともしがたい。"}, {"t": 1294.55, "x": "全然関係のないことでございます。"}, {"t": 1296.75, "x": "感想を述べる以外にない。"}, {"t": 1298.4333333333334, "x": "関係ないの？　文部大臣なのに？"}, {"t": 1300.75, "x": "法律の上ではそういう作りだった。"}, {"t": 1302.8666666666666, "x": "文化財保護委員会は、独立して仕事をする機関だ。"}, {"t": 1306.2833333333333, "x": "大臣の権限も責任も及ばない、という説明になる。"}, {"t": 1309.7333333333333, "x": "後に別の議員が国会でこう嘆いている。"}, {"t": 1312.2666666666667, "x": "文部省の所管でないと逃げる、と。"}, {"t": 1314.5666666666666, "x": "じゃあ責任はどこにあるの？"}, {"t": 1316.2833333333333, "x": "局長の答えは一貫している。"}, {"t": 1318.2666666666667, "x": "良くも悪くも、責任は文化財保護委員会にある。"}, {"t": 1321.45, "x": "審議会は諮問に答えただけ、という立場だ。"}, {"t": 1324.3333333333333, "x": "では委員会を動かしているのはだれか。"}, {"t": 1326.5, "x": "高津正道の見立てはこうだ。"}, {"t": 1328.45, "x": "焼き物の良し悪しは、次官にも大臣にも分からない。"}, {"t": 1331.6666666666667, "x": "分かる人が1人しかいないなら、その人が決めている。"}, {"t": 1335.1333333333334, "x": "それが小山さんってことね。"}, {"t": 1336.9333333333334, "x": "議員はそう主張した。"}, {"t": 1338.35, "x": "そして話は次の疑いへ進む。"}, {"t": 1341.2, "x": "ここも取り扱いに注意が要る章だ。"}, {"t": 1343.3833333333334, "x": "高津正道は国会でこう主張した。"}, {"t": 1345.8333333333333, "x": "陶磁の協会という団体がある。"}, {"t": 1347.7833333333333, "x": "そこには小山冨士夫も唐九郎も理事で入っていた。"}, {"t": 1350.7, "x": "美術商の人たちも理事に並んでいる。"}, {"t": 1353.0666666666666, "x": "鑑定する人、作る人、売る人が同じ団体にいる。"}, {"t": 1356.8, "x": "それはちょっと気になるわね。"}, {"t": 1358.5166666666667, "x": "高津はこの関係をこう表現した。"}, {"t": 1360.75, "x": "同じ穴のムジナと言っては悪い。"}, {"t": 1362.65, "x": "言葉を改めれば同じ森の住人である。"}, {"t": 1365.1666666666667, "x": "なれ合いで事件が起きたのだ、という見立てだ。"}, {"t": 1367.9, "x": "それって本当なの？"}, {"t": 1369.3333333333333, "x": "この回でいちばん大事なところだから、はっきり言う。"}, {"t": 1372.3, "x": "これは議員の主張で、認められた事実ではない。"}, {"t": 1375.2, "x": "局長は同じ委員会で強く否定している。"}, {"t": 1377.7833333333333, "x": "小山技官についてそのようなことは全くない。"}, {"t": 1380.5166666666667, "x": "ここで断言できる、と。"}, {"t": 1382.1166666666666, "x": "4月にも局長は重ねて答えた。"}, {"t": 1384.4, "x": "ぐるになったとか、同じ穴のムジナとか言われたが。"}, {"t": 1387.4666666666667, "x": "さような事実はないものと私は認めております。"}, {"t": 1390.5166666666667, "x": "じゃあ、ただの疑いなのね。"}, {"t": 1392.35, "x": "ただ、局長が訂正した点が1つだけあった。"}, {"t": 1395.3833333333334, "x": "小山は1957年に理事をやめたと答弁していた。"}, {"t": 1399.0166666666667, "x": "ところが、協会の雑誌にはその後も名前が載っていた。"}, {"t": 1402.2833333333333, "x": "高津がそれを突くと、局長はおわびをした。"}, {"t": 1405.0, "x": "本人は、知らぬ間に載っていたので困っていたという。"}, {"t": 1408.1166666666666, "x": "それでこの機会に、名実ともにやめることにした。"}, {"t": 1411.35, "x": "疑われるには十分な形だったわけね。"}, {"t": 1414.0166666666667, "x": "疑われる形とやったことは別だ。"}, {"t": 1416.3, "x": "この区別は、記録を読むときに一番大事だと思う。"}, {"t": 1420.15, "x": "1961年3月27日、専門審議会が開かれた。"}, {"t": 1424.8, "x": "期間は4日間だ。"}, {"t": 1426.1166666666666, "x": "局長の報告はこうだった。"}, {"t": 1427.95, "x": "3件は鎌倉時代の作品とは認めがたい。"}, {"t": 1430.9833333333333, "x": "3件？　1本じゃなかったの？"}, {"t": 1432.9833333333333, "x": "ここが世間を驚かせた点だ。"}, {"t": 1434.9333333333334, "x": "永仁の瓶子のほかに、2件が一緒に外された。"}, {"t": 1438.0166666666667, "x": "1つは古瀬戸の狛犬。"}, {"t": 1439.6666666666667, "x": "もう1つが黄色い釉薬の四耳壺だ。"}, {"t": 1441.9166666666667, "x": "名前の通り、蓮の花と唐草の模様が入った壺だ。"}, {"t": 1445.5666666666666, "x": "その2つも重要文化財だったの？"}, {"t": 1447.9333333333334, "x": "そうだ。しかも四耳壺の持ち主が問題だった。"}, {"t": 1450.85, "x": "東京の国立博物館だ。"}, {"t": 1452.95, "x": "国の博物館が買っていたの！？"}, {"t": 1455.0666666666666, "x": "局長も買い上げられたと認めている。"}, {"t": 1457.2833333333333, "x": "高津の言葉はきつかった。"}, {"t": 1459.05, "x": "国の予算でそういう物を買い入れた、と。"}, {"t": 1461.4333333333334, "x": "調査の報告では、こういう説明になっている。"}, {"t": 1464.25, "x": "3件には鎌倉の古瀬戸にあまり見られない特徴がある。"}, {"t": 1467.5833333333333, "x": "3月31日、委員会は解除を決めた。"}, {"t": 1470.5666666666666, "x": "4月10日に告示し、同じ日に所有者へ知らせた。"}, {"t": 1473.8166666666666, "x": "指定から653日。"}, {"t": 1475.8333333333333, "x": "パリの言葉からだとどのくらい？"}, {"t": 1477.8, "x": "199日だ。"}, {"t": 1479.1833333333334, "x": "作者を名乗った人が現れても、半年以上かかった。"}, {"t": 1482.5833333333333, "x": "局長の言う「慎重」の長さがこれになる。"}, {"t": 1485.4166666666667, "x": "4月の委員会で委員長は頭を下げた。"}, {"t": 1487.85, "x": "解除という事実を招来したことに、\nまずおわびを申し上げる。"}, {"t": 1491.5, "x": "それで終わりなの？"}, {"t": 1492.7166666666667, "x": "終わらない、むしろここからが問いの本体だ。"}, {"t": 1495.95, "x": "次の問いは、だれが責任を取るのか、だ。"}, {"t": 1498.6666666666667, "x": "高津は小山冨士夫をやめさせるのかと迫った。"}, {"t": 1501.4166666666667, "x": "委員長の答えはこうだった。"}, {"t": 1503.1333333333334, "x": "本人はその当時、ただ職務を遂行しただけだ。"}, {"t": 1506.2166666666667, "x": "懲戒処分をするようなことは考えておりません。"}, {"t": 1509.1166666666666, "x": "お咎めなしってこと？"}, {"t": 1510.6, "x": "局長はこう付け足した。"}, {"t": 1512.2166666666667, "x": "法律上の義務違反や懲戒には当たらない。"}, {"t": 1514.75, "x": "ただし、もっと慎重に調査研究すればよかった。"}, {"t": 1518.0, "x": "うーん、それは当たり前じゃない？"}, {"t": 1519.7833333333333, "x": "高津は納得しなかった。"}, {"t": 1521.5166666666667, "x": "国の鑑定の頂点が間違えて、\nだれも責任を取らないのか。"}, {"t": 1525.3166666666666, "x": "2日後の委員会でも同じことを聞き続けた。"}, {"t": 1528.0833333333333, "x": "局長の答えは、責任はあくまで委員会にある、だ。"}, {"t": 1531.4166666666667, "x": "個人ではなく組織の問題だとする考え方だな。"}, {"t": 1534.5666666666666, "x": "これは冷たいようで、実はかばう言葉でもある。"}, {"t": 1537.3666666666666, "x": "国が指定したのだから、1人のせいにはしない。"}, {"t": 1540.4166666666667, "x": "なるほど、そう聞くと違うわね。"}, {"t": 1542.5333333333333, "x": "でも小山本人の気持ちは別だった。"}, {"t": 1544.8666666666666, "x": "懲戒はされなかったが彼は役所を去る。"}, {"t": 1547.25, "x": "解除のあと、みずから職を辞したと伝えられる。"}, {"t": 1550.1666666666667, "x": "役職を失ったのはもう1人いる。"}, {"t": 1552.3333333333333, "x": "加藤唐九郎もすべての公職から退いた。"}, {"t": 1555.0666666666666, "x": "織部の技術で受けていた国の資格も\n失ったと報じられている。"}, {"t": 1558.9166666666667, "x": "作った側も、調べた側も、席を失ったのね。"}, {"t": 1562.35, "x": "刑事事件の話は、この記録には1度も出てこない。"}, {"t": 1565.6666666666667, "x": "委員長も「刑事事件が起これば別問題」と\n言っただけだ。"}, {"t": 1569.2666666666667, "x": "逮捕や裁判があったという記録も見当たらない。"}, {"t": 1571.9333333333334, "x": "だから、法廷で事実が確定することもなかった。"}, {"t": 1575.75, "x": "先ほど後回しにした、局長の返事の話をしよう。"}, {"t": 1579.2333333333333, "x": "本人を呼んで聞かないのか、と問われた場面だ。"}, {"t": 1582.0666666666666, "x": "局長の答えをそのまま読む。"}, {"t": 1583.9166666666667, "x": "正しい姿を発見する。"}, {"t": 1585.65, "x": "これはだれが作ったんだということは\n二の次でございまして。"}, {"t": 1589.0333333333333, "x": "えっ、作者はどうでもいいの？"}, {"t": 1590.9333333333334, "x": "局長の理屈はこうだ。"}, {"t": 1592.4833333333333, "x": "指定したのは、最古の銘という歴史の価値だ。"}, {"t": 1595.3666666666666, "x": "だから調べるのは、鎌倉か現代か、だけでいい。"}, {"t": 1598.5, "x": "当然呼ばなければならないとは考えなかった。"}, {"t": 1601.3333333333333, "x": "理屈は通ってるけど、なんかモヤモヤする。"}, {"t": 1604.0333333333333, "x": "委員会でもそう感じた議員がいた。"}, {"t": 1606.1166666666666, "x": "ある議員はこう切り返した。"}, {"t": 1607.7333333333333, "x": "真実がわかってくるのがおっかないので、\n呼ばないのではないか。"}, {"t": 1611.4333333333334, "x": "すごい言い方ね。"}, {"t": 1612.6333333333334, "x": "局長の答弁は権威を守るように\n聞こえる、というわけだ。"}, {"t": 1616.0333333333333, "x": "その議員はもう1つ、法律の穴を指摘した。"}, {"t": 1619.0166666666667, "x": "文化財の法律には「解除」はあるが\n「取り消し」がない。"}, {"t": 1622.7666666666667, "x": "間違えた物を取り消す、という形が用意されていない。"}, {"t": 1626.15, "x": "間違える前提じゃないのね。"}, {"t": 1627.95, "x": "結局、解除の理由はあの一文に落ち着いた。"}, {"t": 1630.8166666666666, "x": "鎌倉時代の作品とは認めがたい。"}, {"t": 1633.1833333333334, "x": "ここに作者の名前は、1文字も入っていない。"}, {"t": 1636.0666666666666, "x": "父の作とも息子の作とも、国は決めていない。"}, {"t": 1639.3, "x": "国は最後まで、だれかを言わなかったのね。"}, {"t": 1641.9833333333333, "x": "作者を決める役目は国の仕事ではない。"}, {"t": 1644.4666666666667, "x": "そう言えばそれまでだが、問いは宙に残った。"}, {"t": 1647.1, "x": "参考人の話も、理事会の判断に預けられた。"}, {"t": 1650.3833333333334, "x": "唐九郎が国会で発言した\n記録は、検索しても0件だった。"}, {"t": 1655.1166666666666, "x": "解除は3件で止まった。"}, {"t": 1656.7333333333333, "x": "でも高津はそこで止まらなかった。"}, {"t": 1658.8333333333333, "x": "重要文化財の下にもう1つの枠がある。"}, {"t": 1661.5, "x": "重要美術品という、戦前からの認定だ。"}, {"t": 1664.3666666666666, "x": "局長によればその数は約8000件。"}, {"t": 1666.9, "x": "8000件！？"}, {"t": 1668.0333333333333, "x": "その中に古瀬戸も入っていた。"}, {"t": 1669.9666666666667, "x": "高津は本の番号まで挙げて、5点の名前を読み上げた。"}, {"t": 1673.35, "x": "これはどうなのか、調査の結果を言ってほしいと。"}, {"t": 1676.25, "x": "局長は答えたの？"}, {"t": 1677.7166666666667, "x": "答えはこうだ。"}, {"t": 1678.85, "x": "若干模古作と思われるものもあるのでございます。"}, {"t": 1681.9166666666667, "x": "認めたんじゃない！"}, {"t": 1683.1, "x": "続きがある。"}, {"t": 1684.2333333333333, "x": "ここで申し上げることは遠慮申し上げた方がいい。"}, {"t": 1686.95, "x": "持ち主のことを考えて、という理由だった。"}, {"t": 1689.6333333333334, "x": "別の品を聞かれても答えは同じだった。"}, {"t": 1692.15, "x": "どれが良く、どれが悪いとは言わない方がいい。"}, {"t": 1694.8, "x": "じゃあ、まだ残ってるの？"}, {"t": 1696.4666666666667, "x": "残っている可能性を、局長が\n否定しなかったということだ。"}, {"t": 1700.0666666666666, "x": "後の本では、少なくとも7点の偽作があるとされる。"}, {"t": 1703.5333333333333, "x": "認定の解除は行われていないという。"}, {"t": 1705.75, "x": "ここで品名を言う気はない。"}, {"t": 1707.35, "x": "持ち主にとっては大切な\n物だし、確定した話でもない。"}, {"t": 1711.1333333333334, "x": "ただ、数字だけ見ておきたい。"}, {"t": 1713.0, "x": "比べるために集めた物が240件、外された物が3件。"}, {"t": 1717.1166666666666, "x": "残りについて国は口を閉ざした。"}, {"t": 1719.2333333333333, "x": "局長の「遠慮」は、持ち主を守る言葉でもある。"}, {"t": 1722.6166666666666, "x": "同時に、調べた中身を外に出さない言葉でもあった。"}, {"t": 1726.6, "x": "ここで、あの「両方」の話に戻る。"}, {"t": 1729.3, "x": "1962年、また焼き物の真贋が国会に出てきた。"}, {"t": 1733.3333333333333, "x": "江戸時代の陶工の作と言われる、佐野乾山だ。"}, {"t": 1736.3, "x": "大量に見つかったと話題になった焼き物でな。"}, {"t": 1739.0833333333333, "x": "本物か偽物かで大論争になった。"}, {"t": 1741.7, "x": "また同じ話？"}, {"t": 1742.9833333333333, "x": "この回で本物か偽物かの話はしない。"}, {"t": 1745.7166666666667, "x": "見たいのは国の答弁の変化だ。"}, {"t": 1747.75, "x": "高津正道がまた質問に立った。"}, {"t": 1750.0666666666666, "x": "永仁の壺であざやかに威力を発揮した科学調査。"}, {"t": 1753.2, "x": "それを今度も使うべきだ、と。"}, {"t": 1755.2666666666667, "x": "たしかにそう言うわよね。"}, {"t": 1756.8166666666666, "x": "持ち主側からも、科学調査の願いが出ていた。"}, {"t": 1759.85, "x": "局長の答えはこうだ。"}, {"t": 1761.3666666666666, "x": "直ちに科学的調査を実施しようという\n意思は持っておりません。"}, {"t": 1765.0333333333333, "x": "えっ、しないの！？"}, {"t": 1766.2833333333333, "x": "理由はこう説明された。"}, {"t": 1767.85, "x": "鑑識の原則は、学者の多年の経験と勘にある。"}, {"t": 1771.2666666666667, "x": "科学的調査はむしろ補助手段である。"}, {"t": 1773.75, "x": "去年は「勉強になった」って言ってたのに。"}, {"t": 1776.5333333333333, "x": "局長の側にも筋の通った理由はあった。"}, {"t": 1779.1166666666666, "x": "基準になる作品が無ければ、比べる相手がいない。"}, {"t": 1782.2166666666667, "x": "出土品でなければ、表面の傷み方も使えない。"}, {"t": 1785.45, "x": "平たい皿は磁気の調べ方にも向かない。"}, {"t": 1787.9666666666667, "x": "何より国が指定した物ではない。"}, {"t": 1790.0666666666666, "x": "局長はこの理由を重ねて答えた。"}, {"t": 1792.35, "x": "永仁のつぼのように国でもって指定したものでもない。"}, {"t": 1795.5166666666667, "x": "国が印を押してないから動かないのね。"}, {"t": 1798.05, "x": "局長は、永仁の時も補助手段だと\n言ったと付け加えている。"}, {"t": 1801.85, "x": "それでも1年で、機械は表舞台から下がった。"}, {"t": 1804.9, "x": "どちらが正しかったか、ここで決める気はない。"}, {"t": 1807.65, "x": "ただ、鑑定はだれの仕事なのかという\n問いは、そのまま残った。"}, {"t": 1812.1333333333334, "x": "瓶子そのものはその後どうなったのか。"}, {"t": 1814.3666666666666, "x": "2本あったことを思い出してほしい。"}, {"t": 1816.3666666666666, "x": "指定された方の1本は、解除の後も残った。"}, {"t": 1819.3666666666666, "x": "後の本では、持ち主が替わっていったという。"}, {"t": 1822.1, "x": "そして唐九郎の死後の1987年に、記念館へ入った。"}, {"t": 1826.5166666666667, "x": "作ったと言った人の記念館に？"}, {"t": 1828.7333333333333, "x": "そうだ。名古屋の守山区にある記念館だ。"}, {"t": 1831.4333333333334, "x": "1943年に出土したと言われた村と同じ地域になる。"}, {"t": 1835.5166666666667, "x": "1992年には、31年ぶりに公開されたと記されている。"}, {"t": 1840.2333333333333, "x": "なんだか、ぐるっと帰ってきたみたい。"}, {"t": 1842.6, "x": "もう1本はいまも分からない。"}, {"t": 1844.25, "x": "局長は国会で「判明いたしておりません」と答えた。"}, {"t": 1847.7333333333333, "x": "後の本では、1966年の名古屋の真贋展に出たという。"}, {"t": 1852.05, "x": "その後、また足どりが消えている。"}, {"t": 1854.0666666666666, "x": "ひそかに壊されたという話まであるが、確かではない。"}, {"t": 1857.5166666666667, "x": "もう1本の方がミステリーじゃない。"}, {"t": 1859.5833333333333, "x": "2020年1月に、神戸新聞がこんな記事を出している。"}, {"t": 1863.2666666666667, "x": "「永仁の壺」が姫路で発見か、というものだ。"}, {"t": 1866.3166666666666, "x": "骨董の収集家から、情報が寄せられたという。"}, {"t": 1869.2833333333333, "x": "高さ26.5センチの瓶子で、同じ文字が彫られていた。"}, {"t": 1873.1666666666667, "x": "それが消えた1本なの？"}, {"t": 1874.8166666666666, "x": "分からない。そこを考えるとき、知っておくことがある。"}, {"t": 1878.0333333333333, "x": "事件のあと、瓶子の模造品が流行ったんだ。"}, {"t": 1880.8333333333333, "x": "関係者の本では、業者が大量に作ったとある。"}, {"t": 1883.9333333333334, "x": "その数は数万個とも書かれている。"}, {"t": 1886.2166666666667, "x": "数万個！？"}, {"t": 1887.35, "x": "2020年の記事では、\nネットの競売にも出ていたという。"}, {"t": 1890.8333333333333, "x": "騒がれた1本をまねた物が、さらに生まれたわけだ。"}, {"t": 1894.0333333333333, "x": "記事の中で、県の陶磁の美術館の学芸員も\n行方を把握していない。"}, {"t": 1898.3166666666666, "x": "1本が国の指定を受けて1本が消えた。"}, {"t": 1900.85, "x": "そして数万個の影が残った。"}, {"t": 1903.5333333333333, "x": "名前の出た3人の、その後を見ておく。"}, {"t": 1905.9833333333333, "x": "まず小山冨士夫だ。"}, {"t": 1907.2333333333333, "x": "役所を離れたあと、彼は自分で土を触り始めた。"}, {"t": 1910.55, "x": "1966年、鎌倉の自宅に窯を築いた。"}, {"t": 1914.15, "x": "日本工芸会の理事長にもなっている。"}, {"t": 1916.4833333333333, "x": "のちに岐阜県の土岐市にも窯を作っている。"}, {"t": 1919.2333333333333, "x": "見る人から作る人になったのね。"}, {"t": 1921.5166666666667, "x": "陶芸家たちの窯を訪ね歩いた話も残っている。"}, {"t": 1924.6333333333334, "x": "事件の後も、唐九郎を悪く言わなかったという。"}, {"t": 1927.5, "x": "1975年10月7日、75歳で亡くなった。"}, {"t": 1931.4333333333334, "x": "次に、岡部嶺男。"}, {"t": 1932.8666666666666, "x": "後に妻の実家の姓を名乗るようになった。"}, {"t": 1935.45, "x": "1963年には、瓶子の連作を発表したと記されている。"}, {"t": 1940.05, "x": "瓶子を？　あの事件のあとで？"}, {"t": 1941.9833333333333, "x": "そうだ。何を思って作ったのかは\n本人にしか分からない。"}, {"t": 1945.45, "x": "その後は青い焼き物の世界で独自の道を開いた。"}, {"t": 1948.5, "x": "プラハの国際陶芸展で、グランプリも受けている。"}, {"t": 1951.55, "x": "1990年9月4日、70歳で亡くなった。"}, {"t": 1955.3333333333333, "x": "お父さんとはどうなったの？"}, {"t": 1956.9833333333333, "x": "事件で決裂したと伝えられている。"}, {"t": 1959.2833333333333, "x": "そして加藤唐九郎。"}, {"t": 1960.6333333333334, "x": "公職を退いたあとも、作ることはやめなかった。"}, {"t": 1963.7166666666667, "x": "「野の陶人」と呼ばれ、\n創作の意欲は衰えなかったという。"}, {"t": 1967.3166666666666, "x": "1985年12月24日、名古屋で亡くなった。"}, {"t": 1971.2666666666667, "x": "3人とももういない。"}, {"t": 1972.6833333333334, "x": "作った話を最後まで語らなかったの？"}, {"t": 1975.3166666666666, "x": "語ったことはいろいろ残っている。"}, {"t": 1977.2666666666667, "x": "でも語ったことが、確かめられるとは限らない。"}, {"t": 1980.2166666666667, "x": "銘はだれが彫ったのか、という話も本によって違う。"}, {"t": 1983.4166666666667, "x": "国が調べないと決めた問いは、\n本人たちと一緒に消えた。"}, {"t": 1987.6, "x": "事件は、国会の記録からも少しずつ薄れていく。"}, {"t": 1990.8333333333333, "x": "それでも忘れたころに名前が出てくる。"}, {"t": 1993.1, "x": "1982年2月の予算委員会が、その1つだ。"}, {"t": 1996.9833333333333, "x": "ある議員が、美術品の偽物の話の中で触れた。"}, {"t": 2000.35, "x": "国が鎌倉時代と昭和を間違えたのはなぜか。"}, {"t": 2003.2333333333333, "x": "彼の答えは資料が無いからだった。"}, {"t": 2005.4833333333333, "x": "21年たっても言われてるのね。"}, {"t": 2007.7, "x": "真贋は資料に基づくものだ、と議員は言った。"}, {"t": 2010.5833333333333, "x": "比べる物が無いと、外国に聞かれても答えられない。"}, {"t": 2013.9833333333333, "x": "それって91個集めた話と同じじゃない？"}, {"t": 2016.9, "x": "そう、あの調査と同じ考え方だ。"}, {"t": 2019.2333333333333, "x": "ただ、1つだけ注意がある。"}, {"t": 2021.1, "x": "この議員は「加藤唐九郎の作品だと\n分かって解除した」と言った。"}, {"t": 2025.2, "x": "これは解除の時の報告の言葉とは違う。"}, {"t": 2027.8833333333334, "x": "時間がたつと、話は分かりやすい形に変わっていく。"}, {"t": 2031.45, "x": "世間では、もう唐九郎さんの作で決まりなのね。"}, {"t": 2034.5333333333333, "x": "事典の多くもそう書いている。"}, {"t": 2036.2333333333333, "x": "本人が名乗った以上、自然な書き方でもある。"}, {"t": 2039.1833333333334, "x": "1998年には、佐野乾山の話も国会に戻ってきた。"}, {"t": 2043.7166666666667, "x": "いまだに結論が出ず\nうやむやになっている、と議員が言った。"}, {"t": 2047.0333333333333, "x": "そして2002年4月、文部科学委員会だ。"}, {"t": 2050.0666666666666, "x": "話題は、2000年に発覚した\n旧石器の発掘の捏造だった。"}, {"t": 2054.2, "x": "ある議員が、昔の類似の事件として名前を挙げる。"}, {"t": 2057.35, "x": "それが永仁のつぼ事件だった。"}, {"t": 2059.4166666666665, "x": "焼き物と石器で全然違うじゃない？"}, {"t": 2061.75, "x": "議員が重ねたのは、中身より仕組みの方だ。"}, {"t": 2064.5833333333335, "x": "早くから批判の論文が出ていたのに、\n取り上げられなかった。"}, {"t": 2068.1666666666665, "x": "地元の声が届くのに\n時間がかかった、あの構図に近い。"}, {"t": 2071.7166666666667, "x": "この議員は、技官がみずから\n職を辞したことも述べている。"}, {"t": 2075.116666666667, "x": "同じ年の12月にも、議員は\n新聞の見出しを引いて言った。"}, {"t": 2078.85, "x": "その教訓は生かされていなかった。"}, {"t": 2081.016666666667, "x": "41年たって、また同じことを言われたのね。"}, {"t": 2084.15, "x": "権威が決めた物を、だれが、どう疑うのか。"}, {"t": 2086.983333333333, "x": "1本の瓶子が残した問いは、\n形を変えて続いたわけだ。"}, {"t": 2091.2166666666667, "x": "最後に並べてみよう。"}, {"t": 2092.6, "x": "1294年の銘。"}, {"t": 2094.383333333333, "x": "1943年の新聞記事。"}, {"t": 2096.7833333333333, "x": "1948年の斜めの2文字。"}, {"t": 2099.4, "x": "1959年の、反対0の審議会。"}, {"t": 2102.516666666667, "x": "1960年の地元の声とパリの一言。"}, {"t": 2105.6666666666665, "x": "91個と149件、そして3つの機械。"}, {"t": 2108.9666666666667, "x": "1961年4月10日の告示。"}, {"t": 2111.866666666667, "x": "だれも死んでないのに、\nずいぶん大勢が傷ついたのね。"}, {"t": 2115.0666666666666, "x": "そうだな。席を失った人がいて、親子の縁も切れた。"}, {"t": 2118.6, "x": "ただ、悪い人を探す話にはしたくない。"}, {"t": 2121.3333333333335, "x": "技官は外国に出るのを防ごうとした。"}, {"t": 2123.6666666666665, "x": "地元の研究家はおかしいと言い続けた。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
