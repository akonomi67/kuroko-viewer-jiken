<script>
const D={"name": "139", "file": "139_編集用", "dur": 2167.25, "segs": [], "subs": [{"t": 0.0, "x": "1970年5月13日の朝、\n広島の港で1発の銃声が響いた。"}, {"t": 5.383333333333334, "x": "撃ったのは警察官だ。"}, {"t": 6.75, "x": "距離は75.5メートル。"}, {"t": 8.616666666666667, "x": "相手は、乗っ取られた旅客船の甲板に\n立つ20歳の男だった。"}, {"t": 12.85, "x": "船の上の犯人を岸から撃ったの？"}, {"t": 15.166666666666666, "x": "そうだ。船の名前はぷりんす。"}, {"t": 17.016666666666666, "x": "瀬戸内海を走る定期船だ。"}, {"t": 19.016666666666666, "x": "男は1時間33分後に病院で亡くなった。"}, {"t": 22.3, "x": "警察官の弾で人が死んだのね。"}, {"t": 24.666666666666668, "x": "ライフルで犯人の命を奪うのは、\nおそらく初めてだと国会で言われた。"}, {"t": 28.966666666666665, "x": "しかもその瞬間は、テレビに映っていた。"}, {"t": 31.7, "x": "茶の間に流れたの？"}, {"t": 33.11666666666667, "x": "流れた。平日の朝の出来事だ。"}, {"t": 35.483333333333334, "x": "「やむを得ない」と言う人がいた。"}, {"t": 37.31666666666667, "x": "「早まった」と言う人もいた。"}, {"t": 39.18333333333333, "x": "弁護士が告発し、最後は裁判所が調べることになる。"}, {"t": 42.88333333333333, "x": "裁判所は何て言ったの？"}, {"t": 44.56666666666667, "x": "罪にはならない、と決めた。"}, {"t": 46.333333333333336, "x": "ところが同じ決定文の終わりに一言足してある。"}, {"t": 49.333333333333336, "x": "殺さずに捕まえる道を、警察は\nもっと考えるべきだった、と。"}, {"t": 53.416666666666664, "x": "罪にならないのに注文を付けたのね。"}, {"t": 55.85, "x": "今回はその1発を撃つと決めた判断の話だ。"}, {"t": 58.96666666666667, "x": "国会の記録と裁判所の決定文で順番に追っていく。"}, {"t": 64.3, "x": "話は2日前の夜中に戻る。"}, {"t": 66.4, "x": "5月11日の午前0時ごろ、山口県の山陽町の国道だ。"}, {"t": 70.66666666666667, "x": "交通の取り締まりをしていた\n警察官が、1台の乗用車を見つけた。"}, {"t": 75.01666666666667, "x": "何をした車だったの？"}, {"t": 76.7, "x": "追い越し違反だ。よくある違反だな。"}, {"t": 78.86666666666666, "x": "ところが調べると、福岡市内で盗まれた車と分かった。"}, {"t": 82.68333333333334, "x": "それは見逃せないわね。"}, {"t": 84.28333333333333, "x": "乗っていたのは3人だった。"}, {"t": 86.0, "x": "20歳の男と、2人の少年だ。"}, {"t": 88.45, "x": "警察官は3人を検問所へ連れて行こうとした。"}, {"t": 91.46666666666667, "x": "その途中で1人がいきなり猟銃を持ち出した。"}, {"t": 94.36666666666666, "x": "えっ、猟銃を持ってたの？"}, {"t": 96.16666666666667, "x": "別の1人はナイフで切りかかった。"}, {"t": 98.28333333333333, "x": "警察官は胸を刺され、2週間のけがをした。"}, {"t": 101.31666666666666, "x": "3人のうち1人はその場で捕まった。"}, {"t": 103.75, "x": "残る2人は車を奪って逃げた。"}, {"t": 105.96666666666667, "x": "ただの違反から、いきなりそんなことになるの？"}, {"t": 108.81666666666666, "x": "後の決定文によれば、前の晩にも別の計画があった。"}, {"t": 112.46666666666667, "x": "5月10日の夜、福岡市で銃砲店を\n襲おうとして失敗している。"}, {"t": 116.55, "x": "倉敷の方へ向かう途中がこの夜中だった。"}, {"t": 119.88333333333334, "x": "どうして車の中の銃に気づかなかったの？"}, {"t": 122.65, "x": "後で警察庁長官の後藤田正晴が国会で説明している。"}, {"t": 126.51666666666667, "x": "テレビのアンテナをしまう袋があった。"}, {"t": 128.66666666666666, "x": "その中に、折りたたみの猟銃を\n入れて後ろの席に隠していた。"}, {"t": 132.58333333333334, "x": "アンテナの袋に……見ただけじゃ分からないわね。"}, {"t": 135.38333333333333, "x": "長官はこの点を将来の問題だと言った。"}, {"t": 138.0, "x": "もう少し徹底して調べられなかったか、と。"}, {"t": 140.75, "x": "ただし手落ちとは言わなかった。"}, {"t": 142.53333333333333, "x": "もとは交通違反だったからだ。"}, {"t": 144.55, "x": "違反の車を全部調べるわけにはいかないものね。"}, {"t": 147.56666666666666, "x": "山口県警は警察官300人、パトカー60台を出した。"}, {"t": 151.58333333333334, "x": "約12時間、検問と捜索を続けている。"}, {"t": 154.6, "x": "それでも捕まらなかったのね。"}, {"t": 156.58333333333334, "x": "2人は網を抜けた。"}, {"t": 157.88333333333333, "x": "長官は国会でこんな数字を出している。"}, {"t": 160.3, "x": "緊急配備に引っかかるのは、\n過去の例でだいたい30パーセントだと。"}, {"t": 164.56666666666666, "x": "じゃあ7割は抜けていくってこと？"}, {"t": 166.63333333333333, "x": "そうだ。長官自身が、それが実態だと認めた。"}, {"t": 170.53333333333333, "x": "5月12日の午後1時56分ごろ、広島市の尾長町だ。"}, {"t": 174.61666666666667, "x": "銃を持った2人が山の中にいる、と\n民間の人が通報した。"}, {"t": 178.45, "x": "パトカーが向かい、4人の警察官が手分けして探した。"}, {"t": 182.08333333333334, "x": "4人が別々に探したのね。"}, {"t": 184.18333333333334, "x": "そのうちの1人の巡査が道を歩く2人を見つけた。"}, {"t": 187.35, "x": "少し距離があったので、通りかかった\n軽四輪に乗せてもらった。"}, {"t": 191.13333333333333, "x": "10メートルほど手前で降りて、後をつけた。"}, {"t": 193.71666666666667, "x": "ところがその軽四輪が2人の横を通り抜けようとした。"}, {"t": 197.16666666666666, "x": "まさか……。"}, {"t": 198.3, "x": "男は車を止めて、運転手に猟銃を突きつけた。"}, {"t": 201.58333333333334, "x": "そして巡査に叫んだ。"}, {"t": 202.96666666666667, "x": "拳銃を捨てろ、捨てないと撃つぞ。"}, {"t": 205.31666666666666, "x": "巡査はどうしたの？"}, {"t": 206.66666666666666, "x": "思いとどまらせようとして、威嚇の1発を撃った。"}, {"t": 209.66666666666666, "x": "これで男はかえって激しく怒った。"}, {"t": 211.91666666666666, "x": "運転手の頭に銃を当てて、殺すと言った。"}, {"t": 214.85, "x": "それじゃ撃てないじゃない。"}, {"t": 216.23333333333332, "x": "巡査は運転手の命を優先した。"}, {"t": 218.51666666666668, "x": "拳銃も弾も、言われるまま渡すしかなかった。"}, {"t": 221.56666666666666, "x": "警察官の拳銃が犯人の手に渡っちゃったのね。"}, {"t": 224.78333333333333, "x": "男は運転手に銃を向けたまま、車で走り去った。"}, {"t": 228.16666666666666, "x": "もう1人の少年は巡査が格闘して捕まえた。"}, {"t": 231.16666666666666, "x": "これで残りは1人になった。"}, {"t": 232.93333333333334, "x": "長官は後に、功をあせって1人で\n立ち向かった点を問題に挙げた。"}, {"t": 236.93333333333334, "x": "ただ拳銃を渡したこと自体は、\nやむを得なかったとも言っている。"}, {"t": 241.26666666666668, "x": "午後3時25分ごろ、男は\n広島市の立町にある銃砲店に現れた。"}, {"t": 246.01666666666668, "x": "店の人に奪ったばかりの拳銃を突きつけた。"}, {"t": 248.98333333333332, "x": "拳銃で銃砲店を襲うなんて……。"}, {"t": 251.06666666666666, "x": "奪ったのはライフル2丁、猟銃1丁、弾が380発だ。"}, {"t": 255.38333333333333, "x": "380発！"}, {"t": 256.93333333333334, "x": "最初の報告ではライフル3丁とされ、あとで直された。"}, {"t": 260.3333333333333, "x": "弾と銃が同じ店にそろっていたわけだ。"}, {"t": 262.8333333333333, "x": "全国に銃砲火薬店は1200ほどあった。"}, {"t": 265.7, "x": "そのうち約6割が銃と弾の両方を売っていた。"}, {"t": 268.73333333333335, "x": "一度に全部持っていけちゃうのね。"}, {"t": 270.8, "x": "男は人質と車をその場に残して、店を出た。"}, {"t": 274.15, "x": "警察が通報を受けたのは3時32分ごろだ。"}, {"t": 277.21666666666664, "x": "店が襲われてから、7分ほどたっていた。"}, {"t": 280.06666666666666, "x": "その間にもう消えたのね。"}, {"t": 281.8, "x": "このころ県内には約1000人の警察官が出ていた。"}, {"t": 284.96666666666664, "x": "約90か所で検問をしていたという。"}, {"t": 287.3666666666667, "x": "新聞の記事として国会で紹介された話がある。"}, {"t": 290.53333333333336, "x": "男は電車通りに出てタクシーを\n拾い、港まで行ったという。"}, {"t": 294.2, "x": "タクシーで？ 銃を持って？"}, {"t": 295.93333333333334, "x": "何の検問も受けなかった、とその議員は言っている。"}, {"t": 298.98333333333335, "x": "長官も、店を出てから船に乗るまで\n1時間あまりあったと認めた。"}, {"t": 303.1166666666667, "x": "探す場所の判断を\n誤っていたのではないか、とまで述べている。"}, {"t": 307.45, "x": "午後5時ごろ、男は県営の宇品桟橋に現れた。"}, {"t": 310.75, "x": "桟橋には瀬戸内海汽船の定期船、\nぷりんすが止まっていた。"}, {"t": 314.6166666666667, "x": "どこへ行く船だったの？"}, {"t": 316.18333333333334, "x": "宇品と今治を結ぶ航路の船だ。"}, {"t": 318.4, "x": "男は銃を撃ちながら船に乗り込んだ。"}, {"t": 320.7, "x": "船長と乗組員、乗客を脅して人質にした。"}, {"t": 324.0833333333333, "x": "乗客もいたのね……。"}, {"t": 325.46666666666664, "x": "民間の人が1人、1週間のけがをした。"}, {"t": 328.3666666666667, "x": "追いかけた警察官の1人が撃たれて重傷を負った。"}, {"t": 331.4, "x": "国会の報告では3日後もまだ危ない状態だった。"}, {"t": 334.55, "x": "船が港を出たのは午後5時30分だった。"}, {"t": 337.3333333333333, "x": "海の乗っ取り、シージャックの始まりだ。"}, {"t": 339.65, "x": "この年の3月31日にはよど号の乗っ取りが起きていた。"}, {"t": 343.43333333333334, "x": "そのあとの1か月半ほどで人質の事件が続いていた。"}, {"t": 346.9166666666667, "x": "国会では今回を含めて7件という数字が出ている。"}, {"t": 350.26666666666665, "x": "7件も？ 流行みたいに続いたの？"}, {"t": 352.73333333333335, "x": "刑事局長は連鎖反応のようなものかも\nしれないと言った。"}, {"t": 356.75, "x": "第一報はすぐ東京の警察庁に入った。"}, {"t": 359.46666666666664, "x": "長官の後藤田は幹部を集めて、3つの指示を出した。"}, {"t": 362.8333333333333, "x": "1つ目。乗客を無事に救い出すことを基本に考えろ。"}, {"t": 366.4166666666667, "x": "2つ目。粘り強い説得をやれ。"}, {"t": 368.81666666666666, "x": "説得は誰がするの？"}, {"t": 370.3833333333333, "x": "家族がよかろう、と長官は言った。"}, {"t": 372.43333333333334, "x": "手配もすぐにやれと。"}, {"t": 373.85, "x": "3つ目がこの回の話の入り口だ。"}, {"t": 376.1666666666667, "x": "武器の準備もしなさい。"}, {"t": 377.73333333333335, "x": "最初から撃つつもりだったの？"}, {"t": 379.6333333333333, "x": "長官の言い方はこうだ。"}, {"t": 381.1666666666667, "x": "最後の瞬間には、武器を使う\n逮捕しか方法がないかもしれない。"}, {"t": 385.1, "x": "そのときに手がないと、被害が広がる一方だ。"}, {"t": 388.15, "x": "備えだけはしておく、ということね。"}, {"t": 390.48333333333335, "x": "もう1つ、船を動かすなとも命じた。"}, {"t": 393.03333333333336, "x": "宇品で止めて、そこで説得しろと。"}, {"t": 395.43333333333334, "x": "理由は的が動くからだ。"}, {"t": 397.05, "x": "動けば、至るところで大変な事件が起こる。"}, {"t": 399.8666666666667, "x": "だがこの指示は間に合わなかった。"}, {"t": 401.65, "x": "船はもう出ていた。"}, {"t": 402.93333333333334, "x": "夜の12時前、長官はさらに指示を足している。"}, {"t": 405.9166666666667, "x": "警察の説得は忍の一字でやれ。決してあせるな。"}, {"t": 409.3, "x": "忍の一字……。"}, {"t": 410.43333333333334, "x": "説得と銃の準備が最初から同時に動いていたわけだ。"}, {"t": 414.3833333333333, "x": "警察はライフルを持ってたの？"}, {"t": 416.03333333333336, "x": "普通は拳銃よね。"}, {"t": 417.55, "x": "持っていたがごくわずかだった。全国で25丁だ。"}, {"t": 420.85, "x": "たった25丁？"}, {"t": 422.1333333333333, "x": "きっかけは2年前の金嬉老事件だった。"}, {"t": 424.7, "x": "犯人の照準鏡つきライフルに、\n拳銃では勝負にならなかった。"}, {"t": 428.6166666666667, "x": "その反省で東京や大阪などに置くようになった。"}, {"t": 431.55, "x": "長官によれば、手配できるのは\n福岡県警と大阪府警だった。"}, {"t": 435.55, "x": "呼ばれたのは大阪府警のライフルの隊員、5人だ。"}, {"t": 438.75, "x": "大阪からどうやって来たの？"}, {"t": 440.55, "x": "新聞の記事として、海上自衛隊のヘリで\n運んだと国会で紹介された。"}, {"t": 445.1, "x": "ここで大事なのは決まりの話だ。"}, {"t": 447.21666666666664, "x": "拳銃には使い方を細かく決めた規範があった。"}, {"t": 450.21666666666664, "x": "ではライフルには？"}, {"t": 451.4166666666667, "x": "もっと危ないんだから、もっと\n厳しい決まりがあるはずよね？"}, {"t": 454.8833333333333, "x": "無かった。"}, {"t": 456.0, "x": "えっ、無かったの？"}, {"t": 457.3833333333333, "x": "長官は国会で作るかどうか検討したと答えている。"}, {"t": 460.65, "x": "心配したのはほかの警察官の気持ちへの影響だ。"}, {"t": 463.8333333333333, "x": "ライフルの決まりを作ると、\n武器への考えがゆるむのではないか。"}, {"t": 467.5, "x": "そう危ぶんで作らなかった、という説明だった。"}, {"t": 470.51666666666665, "x": "作らない理由も、一応あったのね。"}, {"t": 472.8666666666667, "x": "通達が出たのは事件のあとの6月1日だ。"}, {"t": 475.81666666666666, "x": "現場で本部長らが使用を\n命じたときだけ使える、と決めた。"}, {"t": 479.46666666666664, "x": "つまり5月13日の朝にはまだ無かった決まりだ。"}, {"t": 483.25, "x": "もう1つ、この日に抜けていたものがある。"}, {"t": 485.78333333333336, "x": "船の乗っ取りを裁く法律だ。"}, {"t": 487.85, "x": "飛行機の乗っ取りの法律は作ったんじゃないの？"}, {"t": 490.73333333333335, "x": "よど号のあと、急いで法案が作られていた。"}, {"t": 493.46666666666664, "x": "法務省の担当者は船も入れるつもりだった。"}, {"t": 496.1666666666667, "x": "法制審議会の答申も、船を含める内容だった。"}, {"t": 499.6666666666667, "x": "じゃあ入ったんでしょう？"}, {"t": 501.0, "x": "外された。"}, {"t": 502.1333333333333, "x": "国会の各党に内々で聞くと、船には異議が強かった。"}, {"t": 505.81666666666666, "x": "大型の客船から手こぎの船まで\n入ってしまう、という理由だ。"}, {"t": 509.6, "x": "早く通すために、船だけ削って\n国会に出したと局長は説明した。"}, {"t": 514.2333333333333, "x": "それでその法律はいつ通るはずだったの？"}, {"t": 516.7833333333333, "x": "政務次官は5月13日の国会で、\n今日参議院を通ると思うと述べた。"}, {"t": 521.4, "x": "銃声の日じゃない！"}, {"t": 522.7, "x": "ある議員はこう言っている。"}, {"t": 523.9333333333333, "x": "あまりにも現実となるのが早過ぎた。"}, {"t": 526.3333333333334, "x": "ただし別の議員はこうも指摘した。"}, {"t": 528.5333333333333, "x": "船を入れていても、今回は\n当てはまらなかっただろう、と。"}, {"t": 531.95, "x": "どうして？"}, {"t": 533.0666666666667, "x": "法律が対象にするのは航行中の乗り物だからだ。"}, {"t": 536.2666666666667, "x": "今回は止まっている船に乗り込んで動かした。"}, {"t": 539.0, "x": "人質を取ること自体を罰する決まりも、まだ無かった。"}, {"t": 542.3833333333333, "x": "当てられるのは監禁の罪で3か月から5年の刑だった。"}, {"t": 546.4833333333333, "x": "船に話を戻そう。"}, {"t": 547.9333333333333, "x": "ぷりんすは呉の沖を通り、音戸を過ぎて南へ向かった。"}, {"t": 551.3666666666667, "x": "海の上で警察は何をしてたの？"}, {"t": 553.5666666666667, "x": "海は海上保安庁の担当になる。"}, {"t": 555.75, "x": "巡視艇3隻とヘリコプター1機で、\n間隔を置いて付いて行った。"}, {"t": 559.6333333333333, "x": "近づくと、男は撃ってきた。"}, {"t": 561.65, "x": "男は陸にも銃を向けている。"}, {"t": 563.5166666666667, "x": "音戸の瀬戸では沿岸を走るパトカーを狙った。"}, {"t": 566.3833333333333, "x": "船の上から、陸のパトカーを？"}, {"t": 568.5333333333333, "x": "そうだ。止めたのは船長だった。"}, {"t": 570.6166666666667, "x": "市民に被害が出ると注意して、やめさせている。"}, {"t": 573.6666666666666, "x": "船長がそんなことを言えたの？"}, {"t": 575.5666666666667, "x": "決定文はこの船長のことを特に書いている。"}, {"t": 578.3166666666667, "x": "人間性が豊かで責任感が強く、\n落ち着いた人物だったと。"}, {"t": 582.3833333333333, "x": "怒る男の気分を静め、何度もの危機を乗り切った。"}, {"t": 585.7, "x": "船長がいなければ、男が船員を\n撃つ事態が必ずあっただろう。"}, {"t": 589.7333333333333, "x": "裁判所がそこまで書くのね。"}, {"t": 591.7, "x": "船長はこの後もずっと、男と\n警察の間を行き来することになる。"}, {"t": 595.9, "x": "男の要求を伝える役目を1人で背負わされた。"}, {"t": 599.4833333333333, "x": "午後9時42分ごろ、船は松山の高浜港に入った。"}, {"t": 603.4666666666667, "x": "そこで何が起きたの？"}, {"t": 605.0, "x": "男は給油を要求した。"}, {"t": 606.6666666666666, "x": "給油すれば、乗客を解放するという話だった。"}, {"t": 609.8333333333334, "x": "県警本部長らが話し合って、その条件をのんだ。"}, {"t": 613.1833333333333, "x": "人質が助かるなら、のむわよね。"}, {"t": 615.6333333333333, "x": "乗客全員の33人が降りた。"}, {"t": 617.9666666666667, "x": "乗組員のうち、売店の女性2人と\n見習いの2人も降りた。"}, {"t": 621.7333333333333, "x": "合わせて37人だ。"}, {"t": 623.4666666666667, "x": "よかった……。"}, {"t": 624.6, "x": "ただこの港でも、男は激しく撃っている。"}, {"t": 627.3833333333333, "x": "2人ほどが軽いけがをしたと報告された。"}, {"t": 630.0, "x": "そのころ男の父と姉が岡山から呼ばれていた。"}, {"t": 633.0333333333333, "x": "下津井の港から、巡視艇で高浜へ向かっていた。"}, {"t": 636.5333333333333, "x": "間に合ったの？"}, {"t": 637.6666666666666, "x": "着くのは夜の12時ごろの見込みだった。"}, {"t": 640.0666666666667, "x": "説得を始めようとする直前に船は動き出した。"}, {"t": 643.2166666666667, "x": "出港は午前0時58分だ。"}, {"t": 645.3833333333333, "x": "残った乗組員は船長を入れて7人だった。"}, {"t": 648.3333333333334, "x": "7人でまたあの男と海へ出るのね。"}, {"t": 650.7333333333333, "x": "決定文によると、この港では\n警察側もいろいろ手を考えていた。"}, {"t": 654.9166666666666, "x": "それが男にある程度知られたことが、\n後の判断に響いていく。"}, {"t": 659.3833333333333, "x": "船はいったん今治の方へ向かった。"}, {"t": 661.5166666666667, "x": "ところが今治の沖で向きを変えて北へ走り出す。"}, {"t": 664.4833333333333, "x": "普通の航路ではない、大三島の方向だ。"}, {"t": 667.15, "x": "どこを目指してたの？"}, {"t": 668.5166666666667, "x": "警察にも分からなかった。"}, {"t": 670.2166666666667, "x": "刑事局長は判断に苦しんだと言っている。"}, {"t": 672.8833333333333, "x": "いちばん恐れたのは警察の少ない\n港に上がられることだ。"}, {"t": 676.3666666666667, "x": "民家に押し入って暴れられたら、手がつけられない。"}, {"t": 679.1833333333333, "x": "海の上では狙撃班も巡視艇に乗って追っていた。"}, {"t": 682.1333333333333, "x": "父と姉も巡視船に乗り、マイクで呼びかけ続けた。"}, {"t": 685.4166666666666, "x": "少しでも近寄れば、撃ってくる。"}, {"t": 687.5, "x": "海上保安庁の船に向けて、30発から\n40発近くを撃ったとされる。"}, {"t": 692.3666666666667, "x": "そんなに？"}, {"t": 693.5, "x": "ここで国会に残った、大事な一場面がある。"}, {"t": 696.4333333333333, "x": "追う船の中で、途中で撃つという声が出たらしい。"}, {"t": 699.4666666666667, "x": "海の上で撃とうって？"}, {"t": 700.85, "x": "刑事局長は、いけないと止めたと答えている。"}, {"t": 703.7333333333333, "x": "運輸大臣も、海の上では原則使うなと指示していた。"}, {"t": 707.2666666666667, "x": "説得を続けろ、というのがこの夜の答えだった。"}, {"t": 710.35, "x": "男はこの夜、一睡もしていない。"}, {"t": 712.5833333333334, "x": "そして船は朝の広島へ戻っていく。"}, {"t": 715.5833333333334, "x": "5月13日の朝、男は船の上から要求を出した。"}, {"t": 719.25, "x": "捕まった共犯の少年を広島の港へ連れて来い。"}, {"t": 722.6, "x": "警察はどう答えたの？"}, {"t": 724.2333333333333, "x": "了承した。だが連れて来る気は初めから無かった。"}, {"t": 727.4666666666667, "x": "えっ？"}, {"t": 728.6, "x": "決定文にはっきり書いてある。"}, {"t": 730.4333333333333, "x": "港に着いても少年はいない。"}, {"t": 732.15, "x": "男は怒って何度も船長に交渉させた。"}, {"t": 734.9166666666666, "x": "警察はその度に\n「今連れて来つつある」と嘘をついた。"}, {"t": 738.5666666666667, "x": "嘘って書いてあるの？"}, {"t": 739.95, "x": "書いてある。当否は別だ、とも断っている。"}, {"t": 742.7666666666667, "x": "少年はそのころ山口県警に渡された\nもようで、連れて来られなかった。"}, {"t": 747.0666666666667, "x": "午前8時45分ごろ、大阪の射手たちが港に着いた。"}, {"t": 750.95, "x": "船は第4桟橋に着くと予想して、\n配置の準備をしていた。"}, {"t": 754.7833333333333, "x": "ところが船は突然第3桟橋に向かった。"}, {"t": 757.7333333333333, "x": "予想が外れたの？"}, {"t": 759.1, "x": "外れた。2人は急いで上屋に入った。"}, {"t": 761.65, "x": "もう1人は防潮堤の陰に隠れた。"}, {"t": 763.9833333333333, "x": "上屋というのは桟橋の屋根付きの建物のことだ。"}, {"t": 767.0, "x": "船が着いたのは午前9時の少し前だった。"}, {"t": 769.65, "x": "着いた桟橋の番号は国会の報告と\n決定文で違っている。"}, {"t": 773.4333333333333, "x": "ただ、もやい綱は取らず、いかりも入れなかった。"}, {"t": 776.4333333333333, "x": "いつでも出ていける形ね。"}, {"t": 778.2333333333333, "x": "射手の位置はここで決まってしまった。"}, {"t": 780.4166666666666, "x": "もっと近づこうにも、撃たれるから動けない。"}, {"t": 783.0166666666667, "x": "距離が75.5メートルになった理由の1つが、これだ。"}, {"t": 786.65, "x": "決定文は、事前の検討が\n足りなかったかもしれないと書いている。"}, {"t": 791.1833333333333, "x": "着いてから、男は撃ち始めた。"}, {"t": 793.3, "x": "待合室、パトカー、海上保安庁の巡視船。"}, {"t": 796.4, "x": "巡視船のいぶきとたかなわにも、弾が当たった。"}, {"t": 799.4666666666667, "x": "何発くらい撃ったの？"}, {"t": 800.9833333333333, "x": "ここも数が揃わない。"}, {"t": 802.4166666666666, "x": "警察の課長は当日、約1時間で\n20発ぐらいと報告した。"}, {"t": 806.7166666666667, "x": "3日後の局長の報告では18発だ。"}, {"t": 809.4, "x": "後の決定文は16発としている。"}, {"t": 811.7833333333333, "x": "全部でどれだけ撃ったかも、2つの数がある。"}, {"t": 814.5666666666667, "x": "刑事局長は国会で111発撃った勘定になると言った。"}, {"t": 818.3, "x": "決定文の数を足すと、拳銃2発、\n散弾銃74発、ライフル50発。"}, {"t": 823.75, "x": "足すと126発？"}, {"t": 825.4833333333333, "x": "そうだ。どちらが正しいかは言えない。"}, {"t": 827.6666666666666, "x": "ライフルの弾は2000メートル近くまで\n飛ぶと局長は言っている。"}, {"t": 831.2833333333333, "x": "港の後ろには民家があった。"}, {"t": 833.2, "x": "そこへ見物の人が約600人も集まっていた。"}, {"t": 836.4666666666667, "x": "600人？ 撃ち合いを見に来たの？"}, {"t": 838.6833333333333, "x": "報道の人たちも、テレビが\n撮れる位置から動かなかった。"}, {"t": 842.0333333333333, "x": "警察は人を下げようとしたが、\n全部は無理だったと答えている。"}, {"t": 845.7833333333333, "x": "決定文は男の様子も細かく書いている。"}, {"t": 848.45, "x": "カメラのケースを見て、催涙弾ではないかと疑った。"}, {"t": 851.7, "x": "路面電車の発車の合図を\n弾の発射の命令と聞き違えた。"}, {"t": 855.4333333333333, "x": "発車と発射……そこまで張りつめてたのね。"}, {"t": 858.75, "x": "説得の場面に移ろう。"}, {"t": 860.3, "x": "午前8時58分、巡視船いぶきから\n父の呼びかけが続いていた。"}, {"t": 864.65, "x": "男はそれに振り向いて、また1発撃った。"}, {"t": 867.4333333333333, "x": "お父さんが呼んでるのに？"}, {"t": 868.9666666666667, "x": "弾はいぶきに当たった。"}, {"t": 870.4, "x": "幸い、けが人は出なかった。"}, {"t": 872.2833333333333, "x": "局長の説明では父と姉のいる船へ向けても撃っている。"}, {"t": 875.8, "x": "本当に家族を狙ったの？"}, {"t": 877.65, "x": "そこは国会でも問われた。"}, {"t": 879.3, "x": "議員が聞いた。威嚇で空に撃ったのではないか、と。"}, {"t": 882.4166666666666, "x": "局長の答えはこうだ。"}, {"t": 883.95, "x": "空に向いたものも、地上に向いたものもあった。"}, {"t": 886.7333333333333, "x": "決定文は、弾は危うく肉親の命さえ\n奪うところだったと書いた。"}, {"t": 890.85, "x": "午前9時13分、\nいぶきからの説得はいったん中止された。"}, {"t": 894.5666666666667, "x": "9時19分には船長と乗組員1人が桟橋に降りた。"}, {"t": 898.1833333333333, "x": "船会社の社長と話し合うためだ。"}, {"t": 900.55, "x": "船長は逃げなかったの？"}, {"t": 902.2166666666667, "x": "逃げなかった。男の言葉を伝え、また船に戻っている。"}, {"t": 905.9, "x": "説得に来たいと申し出る人も、ほかにいた。"}, {"t": 908.7666666666667, "x": "男の学校時代の先生や友人だ。"}, {"t": 911.1833333333333, "x": "局長は急いで来てもらう\n手続きをしていたと答えている。"}, {"t": 914.65, "x": "その人たちの話は届いたの？"}, {"t": 916.85, "x": "記録にはその人たちの説得は出てこない。"}, {"t": 919.5166666666667, "x": "男は船長にこうも言っていた。"}, {"t": 921.4833333333333, "x": "説得に応じるくらいなら、\n最初からこんなことはやらない。"}, {"t": 925.5166666666667, "x": "では「撃つしかない」と決まったのはいつか。"}, {"t": 928.1, "x": "国会の答えは1つの時刻に集まっている。"}, {"t": 930.8666666666667, "x": "午前9時20分ごろだ。"}, {"t": 932.65, "x": "撃ったのは9時52分でしょう？"}, {"t": 934.6, "x": "そうだ。判断から引き金まで、32分ある。"}, {"t": 937.8, "x": "現場の幹部から、状況が悪いという声が上がる。"}, {"t": 940.7666666666667, "x": "決定文では午前9時ごろ、現地の刑事部長が\n本部長へ意見を上げている。"}, {"t": 945.1833333333333, "x": "広島県警本部長は自分の目で見ると言った。"}, {"t": 948.1, "x": "本部から桟橋へ向かって、状況を確かめた。"}, {"t": 951.1, "x": "そして現地にいた刑事局長へ連絡した。"}, {"t": 953.7833333333333, "x": "銃器の使用はやむなしと判断する、と。"}, {"t": 956.4, "x": "決めたのは本部長なのね？"}, {"t": 958.2, "x": "そうだ。法律の上で命じる\n立場は県警の本部長にある。"}, {"t": 961.7833333333333, "x": "局長の言葉が会議録に残っている。"}, {"t": 964.25, "x": "いろいろ考えました。いろいろ迷いました。"}, {"t": 966.8166666666667, "x": "説得の効果が期待できるなら、\nもっともっとやったろうと思います。"}, {"t": 970.9166666666666, "x": "迷ったことを国会で言ったのね。"}, {"t": 973.0, "x": "午前9時30分、ライフルの要員が撃てる配置に付いた。"}, {"t": 976.5333333333333, "x": "9時40分すぎ、男は船長を通じてこう言った。"}, {"t": 979.7833333333333, "x": "ラジオで聞いている。"}, {"t": 980.7666666666667, "x": "給油だと言って時間を延ばしているな。"}, {"t": 983.1166666666667, "x": "警察の手を読んでたのね。"}, {"t": 984.9, "x": "そう言いながら、さらに5、6発撃った。"}, {"t": 987.4666666666667, "x": "船員を人質にしてでも出港する、とも言い始めた。"}, {"t": 991.4833333333333, "x": "午前9時47分ごろから、最後の警告が始まった。"}, {"t": 995.2166666666667, "x": "広島南署の署長の名前でマイクから呼びかけた。"}, {"t": 998.4166666666666, "x": "むだな抵抗はやめよ。"}, {"t": 999.6333333333333, "x": "銃を捨てて出てこい。"}, {"t": 1000.9833333333333, "x": "十数回くり返したと、\n海上保安庁の次長が報告している。"}, {"t": 1005.0333333333333, "x": "男は聞いたの？"}, {"t": 1006.2333333333333, "x": "警告のたびに陸に向かって撃った。"}, {"t": 1008.4166666666666, "x": "マイクの方に向けて撃った、という報告もある。"}, {"t": 1011.2833333333333, "x": "返事が銃弾なのね。"}, {"t": 1012.8333333333334, "x": "この警告の長さは後で問題になった。"}, {"t": 1015.3833333333333, "x": "約7分だ。"}, {"t": 1016.5833333333334, "x": "7分って、短くない？"}, {"t": 1018.4666666666667, "x": "短すぎる、という批判が実際にあった。"}, {"t": 1021.0833333333334, "x": "決定文はその批判を取り上げた上でこう判断している。"}, {"t": 1024.3666666666666, "x": "長くしても、もう効き目は期待できなかった。"}, {"t": 1027.1666666666667, "x": "撃つ前に「撃つぞ」と\n言うべきだった、という意見もあった。"}, {"t": 1030.6166666666666, "x": "これにも決定文は答えた。"}, {"t": 1032.4333333333334, "x": "言えば、かえって\n暴発の引き金になったかもしれない。"}, {"t": 1035.6833333333334, "x": "ほかの手はなかったのかしら。"}, {"t": 1037.5166666666667, "x": "決定文は1つずつ検討している。"}, {"t": 1039.8333333333333, "x": "船員に取り押さえてもらう。これは\n民間人に頼むことではない。"}, {"t": 1043.5166666666667, "x": "警察官が忍び込む。見通しが良くて近づけない。"}, {"t": 1046.75, "x": "ガス銃や放水。一瞬で抵抗する\n力を奪えず、怒らせるだけだ。"}, {"t": 1050.9833333333333, "x": "少年を連れて来て話し合う。\nもう山口にいて無理だった。"}, {"t": 1054.3666666666666, "x": "こうして手段が1つずつ消えていく。"}, {"t": 1057.2166666666667, "x": "午前9時50分、状況が変わった。"}, {"t": 1059.6333333333334, "x": "船が後ろへ動き始めた。"}, {"t": 1061.2666666666667, "x": "桟橋を離れようとしたんだ。"}, {"t": 1063.2666666666667, "x": "また海へ出る気なの？"}, {"t": 1064.6833333333334, "x": "男が再び船長に出港を命じていた。"}, {"t": 1067.3833333333334, "x": "船首の方では綱を解く作業が進んでいた。"}, {"t": 1070.05, "x": "ここがこの事件のいちばん大事な一点だ。"}, {"t": 1072.5666666666666, "x": "決定文の理屈はこうなっている。"}, {"t": 1074.5666666666666, "x": "出てしまえば、もう誰も船員を守れない。"}, {"t": 1077.1666666666667, "x": "どうして守れないの？"}, {"t": 1078.6166666666666, "x": "男は近づく船を撃つ。"}, {"t": 1080.1166666666666, "x": "巡視船は数百メートル離れるしかない。"}, {"t": 1082.6833333333334, "x": "動く船から動く船を撃っても、当たるとは限らない。"}, {"t": 1085.9833333333333, "x": "出港の瞬間が最後の機会ってこと？"}, {"t": 1088.6, "x": "そうだ。今を置いてほかにない、と決定文は書いた。"}, {"t": 1091.75, "x": "もう1つの理由が第5桟橋の入り口にあった。"}, {"t": 1094.65, "x": "そこに警察官約20人と報道の人約5人が隠れていた。"}, {"t": 1098.6666666666667, "x": "防潮堤の陰だ。船が桟橋にいる間は隠れられる。"}, {"t": 1102.1166666666666, "x": "ところが船が動くと、見える角度が変わる。"}, {"t": 1104.9333333333334, "x": "隠れてた人たちが丸見えになるのね？"}, {"t": 1107.4, "x": "そうだ。身を隠せるのは\n数人だけ、と裁判所は検証した。"}, {"t": 1111.25, "x": "残りは男の目の前に出てしまう。"}, {"t": 1113.3666666666666, "x": "25人の集団に連発の銃だ。"}, {"t": 1115.65, "x": "撃たなければ、この人たちが\n撃たれると決定文は見た。"}, {"t": 1118.9666666666667, "x": "本部長が狙撃を命じたのは午前9時50分ごろだった。"}, {"t": 1123.0333333333333, "x": "では撃たれた瞬間、男は何をしていたか。"}, {"t": 1125.75, "x": "これが国会でいちばん厳しく問われた点だ。"}, {"t": 1128.3666666666666, "x": "テレビの映像を見た議員がこう質問している。"}, {"t": 1130.95, "x": "武器は持っていなかったのではないか。"}, {"t": 1133.0, "x": "片手を手すりに置き、双眼鏡を持っていたではないか。"}, {"t": 1136.3333333333333, "x": "えっ、銃を持ってなかったの？"}, {"t": 1138.2666666666667, "x": "決定文も、その点は認めている。"}, {"t": 1140.6166666666666, "x": "撃たれた瞬間、男は猟銃を手にしていなかった。"}, {"t": 1143.6833333333334, "x": "外へ向けて撃ってもいなかった。"}, {"t": 1145.6666666666667, "x": "じゃあ無抵抗の人を撃ったってことにならない？"}, {"t": 1148.3, "x": "そこで次の一文が大事になる。"}, {"t": 1150.3333333333333, "x": "拳銃はバンドに差し込んでいた。"}, {"t": 1152.2333333333333, "x": "ライフル2丁と散弾銃1丁は手元に置いていた。"}, {"t": 1155.2333333333333, "x": "船長の椅子までの距離は1.5メートルだった。"}, {"t": 1158.1333333333334, "x": "1.5メートル……。"}, {"t": 1159.3666666666666, "x": "局長は国会でこう答えている。"}, {"t": 1161.4, "x": "向こうが弾を撃っている瞬間でなければ\n撃ってはいけない、とはならない。"}, {"t": 1165.2166666666667, "x": "その前も後も撃つ可能性が強い。"}, {"t": 1167.25, "x": "時間の流れで判断するものだと。"}, {"t": 1169.5, "x": "たまたま撃った瞬間には撃っていなかっただけだと。"}, {"t": 1172.3833333333334, "x": "銃を捨てて出てきたなら話は別だ、とも言っている。"}, {"t": 1175.7, "x": "一服してただけ、という見方ね。"}, {"t": 1178.0333333333333, "x": "決定文も「一時の休憩」と表現している。"}, {"t": 1181.0833333333333, "x": "議員が見た映像も、その瞬間だった。"}, {"t": 1183.6, "x": "局長はこうも言った。"}, {"t": 1184.8333333333333, "x": "テレビの映像は、どうしても部分的だと。"}, {"t": 1187.45, "x": "見た人の印象と現場の判断の間にここで溝ができた。"}, {"t": 1191.65, "x": "撃った側に話を移す。"}, {"t": 1193.3, "x": "射手は大阪府警の巡査部長だ。名前は出さない。"}, {"t": 1196.4333333333334, "x": "国会ではこの人の談話が新聞から読み上げられた。"}, {"t": 1199.5666666666666, "x": "見出しは「無理だった精密な照準」だ。"}, {"t": 1202.3166666666666, "x": "本人が無理だったって言ったの？"}, {"t": 1204.3, "x": "記事によれば、命令から\n10秒ぐらいで引き金を引いた。"}, {"t": 1207.5833333333333, "x": "決定文の証言では5秒から6秒で、ここも揃わない。"}, {"t": 1211.1, "x": "男の腰から下は、ドアの鉄板に隠れていた。"}, {"t": 1214.2333333333333, "x": "足を狙うのが最善だが、仕方がなかった。"}, {"t": 1217.05, "x": "照準器の倍率は4倍だった。"}, {"t": 1219.15, "x": "視野に男の頭からひざまでが、すっぽり入る。"}, {"t": 1222.1666666666667, "x": "肩や腕を正確に狙うのは無理だった、と語っている。"}, {"t": 1225.5833333333333, "x": "名人でも無理なの？"}, {"t": 1227.0, "x": "100メートルから10センチの的に当てる\n腕前だと、国会で言われた人だ。"}, {"t": 1231.3333333333333, "x": "それでも的は紙ではなく、人間だ。"}, {"t": 1233.7166666666667, "x": "決定文は、もっと踏み込んでいる。"}, {"t": 1235.8333333333333, "x": "では2人で同時に撃って、両肩を止められなかったか。"}, {"t": 1239.1166666666666, "x": "班長の証言はこうだ。"}, {"t": 1240.5, "x": "無理に引けば銃がぶれる。"}, {"t": 1242.0833333333333, "x": "75.5メートルで呼吸を合わせて\n同時に当てるのは不可能だと。"}, {"t": 1245.9666666666667, "x": "弱く撃てばいいとも言えない。"}, {"t": 1247.5, "x": "中途半端に当たれば、手負いの男の隣に\n船長がいることになる。"}, {"t": 1251.6333333333334, "x": "1発で動きを止めなきゃいけなかったのね。"}, {"t": 1254.2666666666667, "x": "そうだ。だから狙ったのは\n体の真ん中、みぞおちのあたりだ。"}, {"t": 1258.0166666666667, "x": "局長によると、撃った直後の射手は\n涙を浮かべ暗い顔をしていた。"}, {"t": 1262.7666666666667, "x": "午前9時52分、1発が放たれた。"}, {"t": 1265.4333333333334, "x": "男は甲板に倒れた。"}, {"t": 1267.05, "x": "警察官たちが船に上がり、取り押さえて逮捕した。"}, {"t": 1270.3666666666666, "x": "7人の船員は？"}, {"t": 1271.7833333333333, "x": "全員無事だ。"}, {"t": 1272.9, "x": "船を乗っ取られてから、約17時間たっていた。"}, {"t": 1276.0333333333333, "x": "男は県立の病院へ運ばれた。"}, {"t": 1278.2166666666667, "x": "亡くなったのは午前11時25分とされる。"}, {"t": 1281.0, "x": "11時15分、11時32分と書かれた記録もある。"}, {"t": 1284.7666666666667, "x": "死亡のメモが入ったのは、\n法務委員会の説明の最中だ。"}, {"t": 1288.4, "x": "課長が読み上げている。ただいま\n入りましたメモによりますと、と。"}, {"t": 1292.2833333333333, "x": "国会の真っ最中に知らされたのね。"}, {"t": 1294.65, "x": "長官の後藤田は3日後の国会で、まずこう述べた。"}, {"t": 1297.8333333333333, "x": "罪は罪、人は人。"}, {"t": 1299.5166666666667, "x": "命を落とした犯人はもちろん、親や\n家族の心情を考えると気の毒だった。"}, {"t": 1304.1333333333334, "x": "その上で続けた。今回の結末は\nやむを得ない結果だった、と。"}, {"t": 1308.25, "x": "気の毒と、やむを得ないを両方言ったのね。"}, {"t": 1310.9333333333334, "x": "撃ったあとの方が、話はずっと長い。"}, {"t": 1313.95, "x": "銃声が響いたその日、映像は\n全国の茶の間に入っていた。"}, {"t": 1317.7, "x": "その日の参議院の委員会で、議員が言っている。"}, {"t": 1320.5, "x": "テレビの画面で見たが、ちょっと\n早まったと言われないか。"}, {"t": 1323.8, "x": "その日のうちに国会で言われたのね。"}, {"t": 1326.1, "x": "3日後の委員会でも、別の議員が言った。"}, {"t": 1328.7166666666667, "x": "射殺の瞬間がテレビで茶の間に\n入ったのは、わが国で初めてだろう。"}, {"t": 1332.9166666666667, "x": "国民のショックは非常に大きい、と。"}, {"t": 1335.25, "x": "その映像を流してよかったのかも、問題になったの？"}, {"t": 1338.6166666666666, "x": "なった。関係する役所に順番に見解が聞かれている。"}, {"t": 1342.0833333333333, "x": "文部省の担当者は、\n青少年への影響は大きいと答えた。"}, {"t": 1345.7833333333333, "x": "長官の後藤田はこう答えている。"}, {"t": 1347.7833333333333, "x": "報道の自由との関係で、お答えしにくい問題だ。"}, {"t": 1351.0166666666667, "x": "あえて個人の見解を言えば、好ましくない。"}, {"t": 1353.75, "x": "撃たせた側の長官が、好ましくないって言うのね。"}, {"t": 1357.4166666666667, "x": "5月13日の国会に、もう一度戻ろう。"}, {"t": 1360.2833333333333, "x": "この日はたまたま、首相の佐藤栄作が\n参議院の運輸委員会にいた。"}, {"t": 1364.5333333333333, "x": "たまたま？"}, {"t": 1365.65, "x": "新幹線の法案の審議で呼ばれていたんだ。"}, {"t": 1368.2833333333333, "x": "その席が、そのまま事件の質問の場になった。"}, {"t": 1371.4, "x": "野党の議員が、その場で聞いた。"}, {"t": 1373.4333333333334, "x": "私が直感で感じたのは、目には目を、ということだ。"}, {"t": 1376.8666666666666, "x": "あらかじめ射手を送って、撃ち殺してやるぞという\n姿勢だったのではないか。"}, {"t": 1381.1333333333334, "x": "厳しい言い方ね。"}, {"t": 1382.4, "x": "ただその議員も、自分は現場から\n離れているかもしれないと断っている。"}, {"t": 1386.6666666666667, "x": "首相はこう答えた。"}, {"t": 1387.9666666666667, "x": "とにかく抵抗を止めることが、最初に要求される。"}, {"t": 1391.1166666666666, "x": "足を撃っても、手を撃っても、\nしかるべきではないのか。"}, {"t": 1394.3666666666666, "x": "首相まで手足の話をしたのね。"}, {"t": 1396.6166666666666, "x": "そうだ。この時点で、現場の細かい\n事情はまだ届いていない。"}, {"t": 1400.3166666666666, "x": "足がドアの鉄板に隠れていたことも、\nこの時は分かっていない。"}, {"t": 1404.0833333333333, "x": "それでも、けしからぬから殺してもいいという\n感情で動くべきではない、と言った。"}, {"t": 1408.65, "x": "個人の権利と公の安全が両立する範囲はどこなのか。"}, {"t": 1412.1833333333334, "x": "その問いが、当日のうちに首相の口から出ていた。"}, {"t": 1415.9833333333333, "x": "撃ったあと、もう1つの問題が起きた。"}, {"t": 1418.4, "x": "どこを狙ったのか、説明が揃わなかった。"}, {"t": 1421.3, "x": "撃った場所じゃなくて、狙った場所？"}, {"t": 1423.5666666666666, "x": "そうだ。5月16日の国会で、\n議員が順番に読み上げた。"}, {"t": 1427.5, "x": "5月15日の広島県議会の委員会で、\n本部長は右腕を狙ったと述べた。"}, {"t": 1432.4333333333334, "x": "同じ日の委員会の1時間前には、\n左肩を狙ったと言っていたという。"}, {"t": 1436.75, "x": "別の記者会見では、左腕から\n肩をねらわせたと語っている。"}, {"t": 1440.7166666666667, "x": "5月14日、捜査一課長は左腕から\n肩と記者会見で話した。"}, {"t": 1445.2666666666667, "x": "警察庁の次長は新聞の座談会で、\n左肩のつけ根と語った。"}, {"t": 1449.7166666666667, "x": "右と左が混ざってるじゃない。"}, {"t": 1451.65, "x": "左には心臓がある。議員が問題にしたのはそこだ。"}, {"t": 1454.9333333333334, "x": "利き腕は普通は右だ。"}, {"t": 1456.3, "x": "止めるなら右を狙うはずだろう。"}, {"t": 1458.1833333333334, "x": "なのに告発のあとから、右腕の説明に変わっている。"}, {"t": 1461.7, "x": "告発されたから言い直したように見えるのね。"}, {"t": 1464.4333333333334, "x": "議員はそう指摘した。"}, {"t": 1465.85, "x": "局長の答えはこうだ。"}, {"t": 1467.3833333333334, "x": "本部長は課長に、急所をはずせと指示した。"}, {"t": 1470.1666666666667, "x": "課長は大阪の班長に、できれば右半身と言った。"}, {"t": 1473.4666666666667, "x": "左肩の話は、課長が記者会見で\n右手で左肩を示したためらしい。"}, {"t": 1478.2, "x": "本人は右肩のつもりだった、という説明だ。"}, {"t": 1481.3166666666666, "x": "その説明で、みんな納得したの？"}, {"t": 1483.7833333333333, "x": "議員は時間切れで次の質問に移った。"}, {"t": 1486.3333333333333, "x": "翌年3月の国会で、局長はこう説明している。"}, {"t": 1489.8, "x": "肩というのは、急所をはずす\n例として言っただけだ、と。"}, {"t": 1493.1166666666666, "x": "決定文が認めた狙いは、肩でも腕でもなかった。"}, {"t": 1496.3833333333334, "x": "みぞおちを中心とするあたりだ。"}, {"t": 1498.8833333333334, "x": "5月15日、広島地検に告発が出された。"}, {"t": 1502.15, "x": "出したのは札幌の2人の弁護士だと報じられた。"}, {"t": 1505.2833333333333, "x": "広島の事件を、札幌の人が？"}, {"t": 1507.7833333333333, "x": "そうだ。事件からわずか2日後のことだ。"}, {"t": 1510.4, "x": "対象は、撃った巡査部長と命じた本部長だ。"}, {"t": 1513.3833333333334, "x": "罪名は特別公務員暴行陵虐致死と殺人だった。"}, {"t": 1516.95, "x": "難しい名前ね。"}, {"t": 1518.2666666666667, "x": "警察官のような立場の人が、\n職務で人を傷つけて死なせる罪だ。"}, {"t": 1522.7166666666667, "x": "法律の争点は、警察官職務執行法の7条になる。"}, {"t": 1526.5166666666667, "x": "略して警職法だ。武器を使ってよい\n場面を決めた条文だな。"}, {"t": 1530.4333333333334, "x": "人に危害を与えてよいのは、原則として\n正当防衛か緊急避難のときだ。"}, {"t": 1535.1666666666667, "x": "もう1つ、重い罪の犯人の逮捕で、\nほかに手段がないときがある。"}, {"t": 1539.5166666666667, "x": "今回はどれに当たるの？"}, {"t": 1541.0833333333333, "x": "国会ではそこも食い違った。"}, {"t": 1542.95, "x": "局長は、正当防衛とほかに\n手段がない場合の両方だと答えた。"}, {"t": 1547.0333333333333, "x": "議員の中には、正当防衛ではないと見る人もいた。"}, {"t": 1550.2333333333333, "x": "別の議員は言った。相手がどんなに\n凶悪でも射殺は行き過ぎではないか。"}, {"t": 1554.4833333333333, "x": "長官は別の質問に、こう線を引いた。"}, {"t": 1557.1, "x": "銃器の使用による逮捕は、法律では許されている。"}, {"t": 1560.2333333333333, "x": "しかし実際に使うのは、例外中の例外だ。"}, {"t": 1563.35, "x": "例外中の例外……。"}, {"t": 1564.7, "x": "では広島はその例外に当たるのか。"}, {"t": 1566.9333333333334, "x": "それを判断する役目は、検察へ移った。"}, {"t": 1570.3333333333333, "x": "1970年7月1日、広島地検は2人を不起訴にした。"}, {"t": 1575.0833333333333, "x": "裁判にしないってことね？"}, {"t": 1576.8666666666666, "x": "そうだ。理由は正当防衛の条件を満たし、\n警職法に沿った職務だというものだ。"}, {"t": 1581.9833333333333, "x": "それで終わり？"}, {"t": 1583.1166666666666, "x": "終わらなかった。告発した\n弁護士たちは7月8日に動いた。"}, {"t": 1587.0, "x": "付審判の請求だ。"}, {"t": 1588.55, "x": "ふしんぱん？"}, {"t": 1589.6833333333334, "x": "検察が起訴しなかった事件を、\n裁判にかけるよう裁判所に求める手続きだ。"}, {"t": 1594.6666666666667, "x": "そんな手があるのね。"}, {"t": 1596.0, "x": "ただし使える罪は決まっている。"}, {"t": 1597.95, "x": "殺人は対象にならない、と裁判所は判断した。"}, {"t": 1601.1833333333334, "x": "残ったのは特別公務員暴行陵虐致死だけだ。"}, {"t": 1604.2833333333333, "x": "それでも審理は事件の全体に及んだ。"}, {"t": 1606.6666666666667, "x": "裁判所は3人の裁判官で調べた。"}, {"t": 1609.1666666666667, "x": "現場の桟橋や防潮堤も、自分たちで見ている。"}, {"t": 1612.25, "x": "防潮堤の厚さ、船の甲板の高さ、潮の高さ。"}, {"t": 1615.9, "x": "船が動いたときに、見える角度まで計算した。"}, {"t": 1619.0333333333333, "x": "潮の高さまで？"}, {"t": 1620.3, "x": "この朝は午前9時10分が干潮だった。"}, {"t": 1622.85, "x": "男の肩の高さは、地面から\n約3.8メートルと出している。"}, {"t": 1626.95, "x": "医学の教授にも鑑定を頼んだ。"}, {"t": 1629.05, "x": "班長や船員も、証人として呼んでいる。"}, {"t": 1631.6666666666667, "x": "ここまでやった上で、決定が出た。"}, {"t": 1634.4666666666667, "x": "結論から言う。請求は棄却された。"}, {"t": 1636.9166666666667, "x": "2人は裁判にかけられなかった。"}, {"t": 1639.1333333333334, "x": "じゃあ警察の主張通りだったのね？"}, {"t": 1641.3833333333334, "x": "そこが違う。"}, {"t": 1642.5166666666667, "x": "決定文には、それまで警察が\n言わなかった言葉がある。"}, {"t": 1645.9333333333334, "x": "未必の殺意だ。"}, {"t": 1647.2666666666667, "x": "みひつのさつい？"}, {"t": 1648.45, "x": "死んでも構わない、と分かった\n上でやる気持ちのことだ。"}, {"t": 1651.6, "x": "警察は、殺すつもりはなかったと説明してきた。"}, {"t": 1654.8, "x": "長官も、抵抗を止めるのが目的だと答えていた。"}, {"t": 1658.0333333333333, "x": "ただ長官は、命を落とすかもしれないという\n予測は当然していたとも言った。"}, {"t": 1662.5333333333333, "x": "決定文は、はっきり書いた。"}, {"t": 1664.4666666666667, "x": "2人には未必の殺意が存在した。"}, {"t": 1666.8166666666666, "x": "そして2人は共謀して殺害したものだ、と。"}, {"t": 1669.8833333333334, "x": "えっ、それで罪にならないの？"}, {"t": 1671.8833333333334, "x": "ならない。理由は正当防衛だ。"}, {"t": 1673.8833333333334, "x": "殺意があっても、防衛が\nやむを得なければ違法ではなくなる。"}, {"t": 1677.2, "x": "むしろ弱い場所を狙っていたら、\n船長や警察官が反撃を受けていた。"}, {"t": 1681.5166666666667, "x": "決定文はそこまで言っている。"}, {"t": 1683.4333333333334, "x": "殺すつもりがあったと認めた上で、許したのね。"}, {"t": 1686.5833333333333, "x": "局長は1971年3月の国会で、この決定に触れた。"}, {"t": 1691.0833333333333, "x": "未必の故意はあるが、違法性はないという説示だと。"}, {"t": 1694.1666666666667, "x": "局長はその言葉を、隠さず国会で紹介したわけだ。"}, {"t": 1697.7, "x": "撃つと決めるとは、相手の死を引き受けることだった。"}, {"t": 1700.7166666666667, "x": "それを裁判所が文字にしたことになる。"}, {"t": 1703.65, "x": "決定文には、もう1つ厳しい指摘がある。"}, {"t": 1706.45, "x": "救急車の話だ。"}, {"t": 1707.9666666666667, "x": "救急車？"}, {"t": 1709.1, "x": "国会での局長の答えはこうだった。"}, {"t": 1711.4, "x": "救急車はすでに用意してございました。"}, {"t": 1713.7666666666667, "x": "桟橋に着く前に電話があり、犯人から\n撃たれるおそれもあったからだと。"}, {"t": 1718.05, "x": "準備はしてたのね。"}, {"t": 1719.45, "x": "ところが裁判所の調べは違った。"}, {"t": 1721.6166666666666, "x": "午前9時30分を過ぎて、初めて\n救急車の手配が始まっている。"}, {"t": 1725.9166666666667, "x": "銃を本気で考え始めたのは、午前9時ごろのはずだ。"}, {"t": 1729.3166666666666, "x": "そこから医師の手配や、\n仮の治療の場所を作るべきだった。"}, {"t": 1733.0, "x": "撃つ前から、撃ったあとの準備をしろってことね。"}, {"t": 1735.9333333333334, "x": "そうだ。もっと言えば、射手を呼んだ\n段階から考えるべきだと書いた。"}, {"t": 1740.0333333333333, "x": "ライフルを使えば重傷を負わせることは\n当然予想できるからだ。"}, {"t": 1743.5666666666666, "x": "決定文の言葉はこうだ。"}, {"t": 1745.2333333333333, "x": "極めて遺憾なことに。"}, {"t": 1746.6833333333334, "x": "警察側が命を保つことに、どの程度意を\n払ったのか疑念を抱かざるを得ない。"}, {"t": 1751.5333333333333, "x": "裁判所が「疑念」って書いたのね。"}, {"t": 1753.9, "x": "ただし結論は変わらなかった。"}, {"t": 1755.8, "x": "このときの傷では、治療があっても\n救えなかったと見たからだ。"}, {"t": 1759.4666666666667, "x": "もしすぐの治療で助かる傷だったら、\n別の罪が問題になっただろう。"}, {"t": 1763.7, "x": "決定文は、過失の話にまで触れている。"}, {"t": 1766.4333333333334, "x": "撃つ判断だけでなく、撃った\nあとの備えまでが判断の中身だった。"}, {"t": 1770.4166666666667, "x": "国会で局長の言った「用意」と、\n裁判所が調べた時刻。"}, {"t": 1774.3833333333334, "x": "この2つの間にも、溝が残った。"}, {"t": 1777.4666666666667, "x": "事件のあと、変わったものを数字で見よう。"}, {"t": 1779.9333333333334, "x": "まず民間のライフルだ。"}, {"t": 1781.4166666666667, "x": "当時、ライフルは法律の上で猟銃の扱いだった。"}, {"t": 1784.5833333333333, "x": "全国に3万数千丁が出回っていた。"}, {"t": 1787.3, "x": "そんなに？"}, {"t": 1788.4333333333334, "x": "長官は個人の考えとして、こう答えた。"}, {"t": 1791.1666666666667, "x": "この狭い国土で、\nライフルでなければならない猟があるのか。"}, {"t": 1794.5666666666666, "x": "今日ではライフルは必要ないのではないか。"}, {"t": 1797.0166666666667, "x": "警察のトップがそこまで言ったのね。"}, {"t": 1799.35, "x": "翌1971年、銃刀法が改正された。"}, {"t": 1802.8166666666666, "x": "ライフルの所持の条件が、\n散弾銃よりずっと厳しくなった。"}, {"t": 1806.5333333333333, "x": "銃と弾を別々に、鍵をかけてしまう決まりも入った。"}, {"t": 1809.9666666666667, "x": "効き目は数字に出た。"}, {"t": 1811.3666666666666, "x": "それまでライフルの許可は\n毎年2000丁から3000丁ずつ増えていた。"}, {"t": 1815.4333333333334, "x": "改正のあとは？"}, {"t": 1816.6166666666666, "x": "1971年の1年間で増えたのは91丁だ。"}, {"t": 1820.5833333333333, "x": "2000丁が91丁に？"}, {"t": 1822.4, "x": "警察庁の課長が国会で報告している。"}, {"t": 1825.1, "x": "一方で警察のライフルは増えた。"}, {"t": 1827.1333333333334, "x": "25丁だったものが、1970年度末には50丁だ。"}, {"t": 1831.3833333333334, "x": "民間を減らして、警察は倍にしたのね。"}, {"t": 1834.2166666666667, "x": "1発の前と後で、銃の数字がはっきり変わった。"}, {"t": 1838.0166666666667, "x": "ここで、最初に話した人に戻る。"}, {"t": 1840.4166666666667, "x": "宇品の桟橋で、船を追って撃たれた警察官だ。"}, {"t": 1843.6833333333334, "x": "3日後も危ない状態だった人ね。"}, {"t": 1846.0333333333333, "x": "そうだ。広島南署の警部補だった。"}, {"t": 1848.6166666666666, "x": "名前は出さない。"}, {"t": 1849.6666666666667, "x": "この人は命を取りとめた。"}, {"t": 1851.4666666666667, "x": "しかし重い障害が残った。"}, {"t": 1853.3, "x": "1972年3月の国会で、\n警察庁の官房長が様子を答えている。"}, {"t": 1858.4333333333334, "x": "通常の職務に戻ることができず、療養を続けている。"}, {"t": 1861.8333333333333, "x": "それでも現職の警察官のままだ、と。"}, {"t": 1864.5833333333333, "x": "辞めさせなかったのね。"}, {"t": 1866.15, "x": "そうだ。その2か月後の国会では、\n総理府の総務長官もこの人に触れた。"}, {"t": 1870.9333333333334, "x": "自分の手で表彰状を渡した、と述べている。"}, {"t": 1873.8, "x": "その人には何か補償はあったの？"}, {"t": 1876.0333333333333, "x": "そのときの議題が、まさに補償の話だった。"}, {"t": 1878.9666666666667, "x": "危険な任務でけがをした\n公務員の補償を厚くする制度だ。"}, {"t": 1882.45, "x": "1972年1月1日以降の事件に、\nさかのぼって当てることになった。"}, {"t": 1887.65, "x": "じゃあ1970年の事件は？"}, {"t": 1889.9833333333333, "x": "届かない。"}, {"t": 1891.1166666666666, "x": "えっ……。"}, {"t": 1892.25, "x": "総務長官は、心の中で\n釈然としていない、と答えている。"}, {"t": 1896.1666666666667, "x": "どこで線を引くか、判断に苦しんだと。"}, {"t": 1898.8, "x": "港の1発より先に、この人を撃った弾があった。"}, {"t": 1902.0833333333333, "x": "この事件の被害者は、人質だけではなかった。"}, {"t": 1905.7833333333333, "x": "法律の方はどうなったか。"}, {"t": 1907.45, "x": "事件の日、首相は次の国会までの整備に\n努力すると答えた。"}, {"t": 1911.5, "x": "法務省の局長は、人質の犯罪を研究中だと答えた。"}, {"t": 1915.55, "x": "すぐできたの？"}, {"t": 1916.7333333333333, "x": "人質を取る罪が独立した法律になるのは、8年後だ。"}, {"t": 1920.5666666666666, "x": "1978年の人質による強要行為等の処罰に関する法律。"}, {"t": 1925.4833333333333, "x": "8年もかかったの？"}, {"t": 1926.9833333333333, "x": "提案の理由に挙げられたのは、広島ではない。"}, {"t": 1929.7666666666667, "x": "前の年のダッカ空港の日航機乗っ取り事件だった。"}, {"t": 1933.1333333333334, "x": "広島の事件は出てこないのね。"}, {"t": 1935.2333333333333, "x": "ただ国会の議論の中では、\n広島はくり返し呼び出された。"}, {"t": 1939.1, "x": "1972年のあさま山荘のとき、議員は\nシージャックの反省を読み直した。"}, {"t": 1944.1, "x": "1977年、長崎のバスジャックで\n犯人が撃たれたときも同じだ。"}, {"t": 1948.8666666666666, "x": "議員は、宇品の例を引いて撃ち方の是非を問うた。"}, {"t": 1951.85, "x": "2001年の国会では、ある議員が\n最も代表的な例として挙げている。"}, {"t": 1956.3, "x": "警察庁の幹部は、あのときは\n特殊部隊ではなかったと答えた。"}, {"t": 1960.3833333333334, "x": "30年たっても、物差しにされてたのね。"}, {"t": 1963.2666666666667, "x": "警察が犯人を撃つかどうかを\n語るとき、必ず戻ってくる場所だった。"}, {"t": 1967.5833333333333, "x": "それが1970年の宇品の桟橋だ。"}, {"t": 1971.1333333333334, "x": "もう1つ、人質だった側の話が残っている。"}, {"t": 1974.3333333333333, "x": "事件の直後、ある声が報じられた。"}, {"t": 1976.7166666666667, "x": "船員の中に、そこまでしなくてもと\n語った人がいる、というものだ。"}, {"t": 1981.05, "x": "人質がそう言ったの？"}, {"t": 1982.6333333333334, "x": "国会で議員が取り上げた。"}, {"t": 1984.2833333333333, "x": "おとなしかった。危険を感じなかった。"}, {"t": 1986.7166666666667, "x": "あそこまでやる必要はなかったのではないか。"}, {"t": 1989.2833333333333, "x": "そう言っている船員がいる、と。"}, {"t": 1991.2333333333333, "x": "それって撃った理由がゆらがない？"}, {"t": 1993.15, "x": "局長の答えは慎重だった。"}, {"t": 1995.0833333333333, "x": "金嬉老事件のときも同じことを言う人がいた。"}, {"t": 1997.9166666666667, "x": "後で調べると、実際はかなり違っていた。"}, {"t": 2000.6666666666667, "x": "無事だと分かったあとの気持ちと、\nそのときの気持ちは別だと。"}, {"t": 2004.4333333333334, "x": "怖くなかったはずがない、ということね。"}, {"t": 2006.9, "x": "決定文もこの報道に触れている。"}, {"t": 2008.9666666666667, "x": "語ったのは若い船員で、男とは\nほとんど顔を合わせていなかった。"}, {"t": 2012.95, "x": "年長の船員の証言からは、\nそんな雰囲気とは考えられない。"}, {"t": 2016.75, "x": "裁判所の尋問では、その船員も、\nやむを得なかったと言ったという。"}, {"t": 2020.8333333333333, "x": "ただここで一言足しておく。"}, {"t": 2022.7, "x": "最初の言葉が本心でなかったとも、言い切れない。"}, {"t": 2025.75, "x": "銃のそばで17時間すごした\n人の気持ちは、外からは測れない。"}, {"t": 2029.9166666666667, "x": "この回では、両方の記録をそのまま置いておく。"}, {"t": 2033.4333333333334, "x": "最初に話した、決定文の一節を読もう。"}, {"t": 2036.2, "x": "かっこに入れて、しかし最後に\n一言いうならば、と始まる。"}, {"t": 2039.9833333333333, "x": "かっこの中なの？"}, {"t": 2041.3, "x": "そうだ。結論は別に書いてある。"}, {"t": 2043.2666666666667, "x": "本題の外から足した形だ。"}, {"t": 2045.4, "x": "殺さないで逮捕できるかどうか、\nもっと真剣に検討すべきであったろう。"}, {"t": 2049.5833333333335, "x": "続いて、具体的に並べている。"}, {"t": 2051.733333333333, "x": "県警と射手の間に、狙う\n場所の念入りな話し合いがなかった。"}, {"t": 2055.616666666667, "x": "弾が当たったときの体への影響も、\n深く検討されていない。"}, {"t": 2059.4166666666665, "x": "射手にそういう医学の知識を教えていたようすもない。"}, {"t": 2062.383333333333, "x": "撃ったあとの治療の配慮も足りなかった。"}, {"t": 2064.8166666666666, "x": "全部、撃つ前にできたことね。"}, {"t": 2066.9333333333334, "x": "次の一文が、決定文の芯だ。"}, {"t": 2069.233333333333, "x": "凶悪犯といえども、その生命は尊厳である。"}, {"t": 2072.25, "x": "重い言葉ね。"}, {"t": 2073.383333333333, "x": "そして最後にこう書いている。"}, {"t": 2075.0833333333335, "x": "特殊銃というのは、ここではライフルのことだ。"}, {"t": 2077.8333333333335, "x": "将来、安易に特殊銃を\n使用すべきでないことは当然だ。"}, {"t": 2081.3166666666666, "x": "特殊銃があるからといって、最悪の事態を\n招かない努力がおろそかにされてはなるまい。"}, {"t": 2086.483333333333, "x": "撃ったことを許して、次は撃つなと言ってるみたい。"}, {"t": 2089.483333333333, "x": "撃つなとは言っていない。"}, {"t": 2090.633333333333, "x": "安易に撃つな、だ。"}, {"t": 2091.9666666666667, "x": "局長は国会で、いろいろ迷ったと言った。"}, {"t": 2094.6666666666665, "x": "迷ったことは、記録に残った。"}, {"t": 2096.766666666667, "x": "どこまで考えたかは、後から問われ続けた。"}, {"t": 2100.25, "x": "ねえ最初の話に戻っていい？"}, {"t": 2102.233333333333, "x": "いいぞ。"}, {"t": 2103.366666666667, "x": "撃ったのは1発。でも答えは1つじゃなかったのね。"}, {"t": 2106.65, "x": "そうだ。国会は「やむを得ない」と\n「早まった」に割れた。"}, {"t": 2110.4333333333334, "x": "説明は右腕になり、左肩になり、肩は例えになった。"}, {"t": 2114.25, "x": "救急車は用意していたと言い、\n裁判所は遅かったと書いた。"}, {"t": 2117.95, "x": "裁判所は罪にならないと決めて、注文も付けた。"}, {"t": 2121.266666666667, "x": "船が着いてから撃つまで、およそ57分だった。"}, {"t": 2124.383333333333, "x": "20発前後の銃声と、十数回の警告と、父の声。"}, {"t": 2128.2833333333333, "x": "動き出した船と、隠れた\n25人と、1.5メートル先の船長。"}, {"t": 2132.8, "x": "その全部が、あの1発の前にあったのね。"}, {"t": 2135.6, "x": "テレビに映ったのは最後の一瞬だけだ。"}, {"t": 2137.983333333333, "x": "だから見た人の数だけ、別の答えができた。"}, {"t": 2140.983333333333, "x": "後藤田は言った。罪は罪、人は人。"}, {"t": 2143.65, "x": "裁判所は書いた。生命は尊厳である。"}, {"t": 2146.3, "x": "その2つの間で、撃つと決めた人たちがいたのね。"}, {"t": 2149.7, "x": "銃を手放す機会が男に\n何度あったかは、もう分からない。"}, {"t": 2153.2, "x": "残ったのは、撃たれて職場に戻れなかった\n警察官と、亡くなった20歳だ。"}, {"t": 2158.0333333333333, "x": "1970年5月13日、広島の宇品の桟橋。"}, {"t": 2162.0666666666666, "x": "今回はその75.5メートルの間に置かれた\n判断を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
