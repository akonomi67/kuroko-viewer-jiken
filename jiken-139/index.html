<script>
const D={"name": "139", "file": "139_編集用", "dur": 2024.7333125, "segs": [], "subs": [{"t": 0.0, "x": "1970年5月13日の朝、\n広島の港で1発の銃声が響いた。"}, {"t": 5.383333333333334, "x": "撃ったのは警察官だ。"}, {"t": 6.75, "x": "距離は75.5メートル。"}, {"t": 8.616666666666667, "x": "相手は、乗っ取られた旅客船の甲板に\n立つ20歳の男だった。"}, {"t": 12.716666666666667, "x": "船の上の犯人を岸から撃ったの？"}, {"t": 15.033333333333333, "x": "そうだ。船の名前はぷりんす。"}, {"t": 16.866666666666667, "x": "瀬戸内海を走る定期船だ。"}, {"t": 18.883333333333333, "x": "男は1時間33分後に病院で亡くなった。"}, {"t": 22.166666666666668, "x": "警察官の弾で人が死んだのね。"}, {"t": 24.55, "x": "ライフルで犯人の命を奪うのは、\nおそらく初めてだと国会で言われた。"}, {"t": 28.833333333333332, "x": "しかもその瞬間は、テレビに映っていた。"}, {"t": 31.566666666666666, "x": "茶の間に流れたの？"}, {"t": 32.983333333333334, "x": "流れた。平日の朝の出来事だ。"}, {"t": 35.35, "x": "「やむを得ない」と言う人がいた。"}, {"t": 37.18333333333333, "x": "「早まった」と言う人もいた。"}, {"t": 39.05, "x": "弁護士が告発し、最後は裁判所が調べることになる。"}, {"t": 42.75, "x": "裁判所は何て言ったの？"}, {"t": 44.43333333333333, "x": "罪にはならない、と決めた。"}, {"t": 46.2, "x": "ところが同じ決定文の終わりに一言足してある。"}, {"t": 49.2, "x": "殺さずに捕まえる道を、警察は\nもっと考えるべきだった、と。"}, {"t": 53.3, "x": "罪にならないのに注文を付けたのね。"}, {"t": 55.733333333333334, "x": "今回はその1発を撃つと決めた判断の話だ。"}, {"t": 58.833333333333336, "x": "国会の記録と裁判所の決定文で順番に追っていく。"}, {"t": 64.3, "x": "話は2日前の夜中に戻る。"}, {"t": 66.4, "x": "5月11日の午前0時ごろ、山口県の山陽町の国道だ。"}, {"t": 70.63333333333334, "x": "交通の取り締まりをしていた\n警察官が、1台の乗用車を見つけた。"}, {"t": 75.0, "x": "何をした車だったの？"}, {"t": 76.68333333333334, "x": "追い越し違反だ。"}, {"t": 77.71666666666667, "x": "ところが調べると、福岡市内で盗まれた車と分かった。"}, {"t": 81.41666666666667, "x": "乗っていたのは3人だった。"}, {"t": 83.13333333333334, "x": "20歳の男と、2人の少年だ。"}, {"t": 85.45, "x": "警察官は3人を検問所へ連れて行こうとした。"}, {"t": 88.45, "x": "その途中で1人がいきなり猟銃を持ち出した。"}, {"t": 91.35, "x": "えっ、猟銃を持ってたの？"}, {"t": 93.15, "x": "別の1人はナイフで切りかかった。"}, {"t": 95.26666666666667, "x": "警察官は胸を刺され、2週間のけがをした。"}, {"t": 98.3, "x": "3人のうち1人はその場で捕まった。"}, {"t": 100.73333333333333, "x": "残る2人は車を奪って逃げた。"}, {"t": 102.85, "x": "後の決定文によれば、前の晩にも別の計画があった。"}, {"t": 106.48333333333333, "x": "5月10日の夜、福岡市で銃砲店を\n襲おうとして失敗している。"}, {"t": 110.56666666666666, "x": "倉敷の方へ向かう途中がこの夜中だった。"}, {"t": 113.9, "x": "どうして車の中の銃に気づかなかったの？"}, {"t": 116.66666666666667, "x": "後で警察庁長官の後藤田正晴が国会で説明している。"}, {"t": 120.53333333333333, "x": "テレビのアンテナをしまう袋があった。"}, {"t": 122.68333333333334, "x": "その中に、折りたたみの猟銃を\n入れて後ろの席に隠していた。"}, {"t": 126.6, "x": "アンテナの袋に……見ただけじゃ分からないわね。"}, {"t": 129.4, "x": "長官はこの点を将来の問題だと言った。"}, {"t": 132.01666666666668, "x": "もう少し徹底して調べられなかったか、と。"}, {"t": 134.76666666666668, "x": "ただし手落ちとは言わなかった。"}, {"t": 136.55, "x": "もとは交通違反だったからだ。"}, {"t": 138.45, "x": "山口県警は警察官300人、パトカー60台を出した。"}, {"t": 142.46666666666667, "x": "約12時間、検問と捜索を続けている。"}, {"t": 145.35, "x": "2人は網を抜けた。"}, {"t": 146.66666666666666, "x": "長官は国会でこんな数字を出している。"}, {"t": 149.08333333333334, "x": "緊急配備に引っかかるのは、\n過去の例でだいたい30パーセントだと。"}, {"t": 153.33333333333334, "x": "じゃあ7割は抜けていくってこと？"}, {"t": 155.41666666666666, "x": "そうだ。長官自身が、それが実態だと認めた。"}, {"t": 159.3, "x": "5月12日の午後1時56分ごろ、広島市の尾長町だ。"}, {"t": 163.45, "x": "銃を持った2人が山の中にいる、と\n民間の人が通報した。"}, {"t": 167.28333333333333, "x": "パトカーが向かい、4人の警察官が手分けして探した。"}, {"t": 170.8, "x": "そのうちの1人の巡査が道を歩く2人を見つけた。"}, {"t": 173.95, "x": "少し距離があったので、通りかかった\n軽四輪に乗せてもらった。"}, {"t": 177.73333333333332, "x": "10メートルほど手前で降りて、後をつけた。"}, {"t": 180.31666666666666, "x": "ところがその軽四輪が2人の横を通り抜けようとした。"}, {"t": 183.75, "x": "まさか……。"}, {"t": 184.88333333333333, "x": "男は車を止めて、運転手に猟銃を突きつけた。"}, {"t": 188.16666666666666, "x": "そして巡査に叫んだ。"}, {"t": 189.55, "x": "拳銃を捨てろ、捨てないと撃つぞ。"}, {"t": 191.88333333333333, "x": "巡査はどうしたの？"}, {"t": 193.25, "x": "思いとどまらせようとして、威嚇の1発を撃った。"}, {"t": 196.25, "x": "これで男はかえって激しく怒った。"}, {"t": 198.5, "x": "運転手の頭に銃を当てて、殺すと言った。"}, {"t": 201.43333333333334, "x": "それじゃ撃てないじゃない。"}, {"t": 202.81666666666666, "x": "巡査は運転手の命を優先した。"}, {"t": 205.1, "x": "拳銃も弾も、言われるまま渡すしかなかった。"}, {"t": 208.03333333333333, "x": "男は運転手に銃を向けたまま、車で走り去った。"}, {"t": 211.41666666666666, "x": "もう1人の少年は巡査が格闘して捕まえた。"}, {"t": 214.4, "x": "これで残りは1人になった。"}, {"t": 216.16666666666666, "x": "長官は後に、功をあせって1人で\n立ち向かった点を問題に挙げた。"}, {"t": 220.23333333333332, "x": "ただ拳銃を渡したこと自体は、\nやむを得なかったとも言っている。"}, {"t": 224.56666666666666, "x": "午後3時25分ごろ、男は\n広島市の立町にある銃砲店に現れた。"}, {"t": 229.31666666666666, "x": "店の人に奪ったばかりの拳銃を突きつけた。"}, {"t": 232.28333333333333, "x": "拳銃で銃砲店を襲うなんて……。"}, {"t": 234.36666666666667, "x": "奪ったのはライフル2丁、猟銃1丁、弾が380発だ。"}, {"t": 238.66666666666666, "x": "380発！"}, {"t": 240.23333333333332, "x": "最初の報告ではライフル3丁とされ、あとで直された。"}, {"t": 243.63333333333333, "x": "弾と銃が同じ店にそろっていたわけだ。"}, {"t": 246.13333333333333, "x": "男は人質と車をその場に残して、店を出た。"}, {"t": 249.46666666666667, "x": "警察が通報を受けたのは3時32分ごろだ。"}, {"t": 252.53333333333333, "x": "店が襲われてから、7分ほどたっていた。"}, {"t": 255.25, "x": "このころ県内には約1000人の警察官が出ていた。"}, {"t": 258.4166666666667, "x": "約90か所で検問をしていたという。"}, {"t": 260.8333333333333, "x": "新聞の記事として国会で紹介された話がある。"}, {"t": 263.98333333333335, "x": "男は電車通りに出てタクシーを\n拾い、港まで行ったという。"}, {"t": 267.6666666666667, "x": "タクシーで？ 銃を持って？"}, {"t": 269.3833333333333, "x": "何の検問も受けなかった、とその議員は言っている。"}, {"t": 272.45, "x": "長官も、店を出てから船に乗るまで\n1時間あまりあったと認めた。"}, {"t": 276.56666666666666, "x": "探す場所の判断を\n誤っていたのではないか、とまで述べている。"}, {"t": 280.9, "x": "午後5時ごろ、男は県営の宇品桟橋に現れた。"}, {"t": 284.21666666666664, "x": "桟橋には瀬戸内海汽船の定期船、\nぷりんすが止まっていた。"}, {"t": 288.06666666666666, "x": "どこへ行く船だったの？"}, {"t": 289.6333333333333, "x": "宇品と今治を結ぶ航路の船だ。"}, {"t": 291.85, "x": "男は銃を撃ちながら船に乗り込んだ。"}, {"t": 294.15, "x": "船長と乗組員、乗客を脅して人質にした。"}, {"t": 297.4166666666667, "x": "民間の人が1人、1週間のけがをした。"}, {"t": 300.3, "x": "追いかけた警察官の1人が撃たれて重傷を負った。"}, {"t": 303.3333333333333, "x": "国会の報告では3日後もまだ危ない状態だった。"}, {"t": 306.48333333333335, "x": "船が港を出たのは午後5時30分だった。"}, {"t": 309.28333333333336, "x": "海の乗っ取り、シージャックの始まりだ。"}, {"t": 311.5833333333333, "x": "この年の3月31日にはよど号の乗っ取りが起きていた。"}, {"t": 315.98333333333335, "x": "第一報はすぐ東京の警察庁に入った。"}, {"t": 318.7, "x": "長官の後藤田は幹部を集めて、3つの指示を出した。"}, {"t": 322.06666666666666, "x": "1つ目。乗客を無事に救い出すことを基本に考えろ。"}, {"t": 325.65, "x": "2つ目。粘り強い説得をやれ。"}, {"t": 328.06666666666666, "x": "説得は誰がするの？"}, {"t": 329.6333333333333, "x": "家族がよかろう、と長官は言った。"}, {"t": 331.65, "x": "手配もすぐにやれと。"}, {"t": 333.0833333333333, "x": "3つ目がこの回の話の入り口だ。"}, {"t": 335.3833333333333, "x": "武器の準備もしなさい。"}, {"t": 336.96666666666664, "x": "最初から撃つつもりだったの？"}, {"t": 338.8666666666667, "x": "長官の言い方はこうだ。"}, {"t": 340.4, "x": "最後の瞬間には、武器を使う\n逮捕しか方法がないかもしれない。"}, {"t": 344.3333333333333, "x": "そのときに手がないと、被害が広がる一方だ。"}, {"t": 347.26666666666665, "x": "もう1つ、船を動かすなとも命じた。"}, {"t": 349.8333333333333, "x": "宇品で止めて、そこで説得しろと。"}, {"t": 352.21666666666664, "x": "理由は的が動くからだ。"}, {"t": 353.8333333333333, "x": "動けば、至るところで大変な事件が起こる。"}, {"t": 356.6666666666667, "x": "だがこの指示は間に合わなかった。"}, {"t": 358.43333333333334, "x": "船はもう出ていた。"}, {"t": 359.71666666666664, "x": "夜の12時前、長官はさらに指示を足している。"}, {"t": 362.7, "x": "警察の説得は忍の一字でやれ。決してあせるな。"}, {"t": 366.1, "x": "忍の一字……。"}, {"t": 367.21666666666664, "x": "説得と銃の準備が最初から同時に動いていたわけだ。"}, {"t": 371.18333333333334, "x": "警察はライフルを持ってたの？"}, {"t": 372.8333333333333, "x": "普通は拳銃よね。"}, {"t": 374.3333333333333, "x": "持っていたがごくわずかだった。全国で25丁だ。"}, {"t": 377.65, "x": "たった25丁？"}, {"t": 378.9166666666667, "x": "きっかけは2年前の金嬉老事件だった。"}, {"t": 381.48333333333335, "x": "犯人の照準鏡つきライフルに、\n拳銃では勝負にならなかった。"}, {"t": 385.4, "x": "その反省で東京や大阪などに置くようになった。"}, {"t": 388.3333333333333, "x": "長官によれば、手配できるのは\n福岡県警と大阪府警だった。"}, {"t": 392.3333333333333, "x": "呼ばれたのは大阪府警のライフルの隊員、5人だ。"}, {"t": 395.3833333333333, "x": "ここで大事なのは決まりの話だ。"}, {"t": 397.5, "x": "拳銃には使い方を細かく決めた規範があった。"}, {"t": 400.51666666666665, "x": "ではライフルには？"}, {"t": 401.71666666666664, "x": "もっと厳しい決まりがあるはずよね？"}, {"t": 403.8666666666667, "x": "無かった。"}, {"t": 405.0, "x": "えっ、無かったの？"}, {"t": 406.3833333333333, "x": "長官は国会で作るかどうか検討したと答えている。"}, {"t": 409.65, "x": "心配したのはほかの警察官の気持ちへの影響だ。"}, {"t": 412.8333333333333, "x": "ライフルの決まりを作ると、\n武器への考えがゆるむのではないか。"}, {"t": 416.5, "x": "そう危ぶんで作らなかった、という説明だった。"}, {"t": 419.4, "x": "通達が出たのは事件のあとの6月1日だ。"}, {"t": 422.3333333333333, "x": "現場で本部長らが使用を\n命じたときだけ使える、と決めた。"}, {"t": 425.98333333333335, "x": "つまり5月13日の朝にはまだ無かった決まりだ。"}, {"t": 429.78333333333336, "x": "もう1つ、この日に抜けていたものがある。"}, {"t": 432.3, "x": "船の乗っ取りを裁く法律だ。"}, {"t": 434.3833333333333, "x": "飛行機の乗っ取りの法律は作ったんじゃないの？"}, {"t": 437.25, "x": "よど号のあと、急いで法案が作られていた。"}, {"t": 439.98333333333335, "x": "法制審議会の答申も、船を含める内容だった。"}, {"t": 443.48333333333335, "x": "じゃあ入ったんでしょう？"}, {"t": 444.8333333333333, "x": "外された。"}, {"t": 445.95, "x": "国会の各党に内々で聞くと、船には異議が強かった。"}, {"t": 449.6166666666667, "x": "大型の客船から手こぎの船まで\n入ってしまう、という理由だ。"}, {"t": 453.4, "x": "早く通すために、船だけ削って\n国会に出したと局長は説明した。"}, {"t": 458.03333333333336, "x": "それでその法律はいつ通るはずだったの？"}, {"t": 460.5833333333333, "x": "政務次官は5月13日の国会で、\n今日参議院を通ると思うと述べた。"}, {"t": 465.2, "x": "銃声の日じゃない！"}, {"t": 466.5, "x": "ある議員はこう言っている。"}, {"t": 467.73333333333335, "x": "あまりにも現実となるのが早過ぎた。"}, {"t": 470.15, "x": "人質を取ること自体を罰する決まりも、まだ無かった。"}, {"t": 473.53333333333336, "x": "当てられるのは監禁の罪で3か月から5年の刑だった。"}, {"t": 477.6333333333333, "x": "船に話を戻そう。"}, {"t": 479.06666666666666, "x": "ぷりんすは呉の沖を通り、音戸を過ぎて南へ向かった。"}, {"t": 482.5, "x": "海の上で警察は何をしてたの？"}, {"t": 484.71666666666664, "x": "海は海上保安庁の担当になる。"}, {"t": 486.8833333333333, "x": "巡視艇3隻とヘリコプター1機で、\n間隔を置いて付いて行った。"}, {"t": 490.78333333333336, "x": "近づくと、男は撃ってきた。"}, {"t": 492.8, "x": "男は陸にも銃を向けている。"}, {"t": 494.6666666666667, "x": "音戸の瀬戸では沿岸を走るパトカーを狙った。"}, {"t": 497.53333333333336, "x": "船の上から、陸のパトカーを？"}, {"t": 499.68333333333334, "x": "そうだ。止めたのは船長だった。"}, {"t": 501.76666666666665, "x": "市民に被害が出ると注意して、やめさせている。"}, {"t": 504.8, "x": "船長がそんなことを言えたの？"}, {"t": 506.7, "x": "決定文はこの船長のことを特に書いている。"}, {"t": 509.45, "x": "人間性が豊かで責任感が強く、\n落ち着いた人物だったと。"}, {"t": 513.5333333333333, "x": "怒る男の気分を静め、何度もの危機を乗り切った。"}, {"t": 516.85, "x": "船長がいなければ、男が船員を\n撃つ事態が必ずあっただろう。"}, {"t": 520.75, "x": "船長はこの後もずっと、男と\n警察の間を行き来することになる。"}, {"t": 524.95, "x": "男の要求を伝える役目を1人で背負わされた。"}, {"t": 528.5333333333333, "x": "午後9時42分ごろ、船は松山の高浜港に入った。"}, {"t": 532.5166666666667, "x": "そこで何が起きたの？"}, {"t": 534.0666666666667, "x": "男は給油を要求した。"}, {"t": 535.7333333333333, "x": "給油すれば、乗客を解放するという話だった。"}, {"t": 538.8833333333333, "x": "県警本部長らが話し合って、その条件をのんだ。"}, {"t": 542.1166666666667, "x": "乗客全員の33人が降りた。"}, {"t": 544.4666666666667, "x": "乗組員のうち、売店の女性2人と\n見習いの2人も降りた。"}, {"t": 548.2166666666667, "x": "合わせて37人だ。"}, {"t": 549.9666666666667, "x": "よかった……。"}, {"t": 551.0833333333334, "x": "そのころ男の父と姉が岡山から呼ばれていた。"}, {"t": 554.1166666666667, "x": "下津井の港から、巡視艇で高浜へ向かっていた。"}, {"t": 557.6166666666667, "x": "間に合ったの？"}, {"t": 558.75, "x": "着くのは夜の12時ごろの見込みだった。"}, {"t": 561.15, "x": "説得を始めようとする直前に船は動き出した。"}, {"t": 564.3, "x": "出港は午前0時58分だ。"}, {"t": 566.4666666666667, "x": "残った乗組員は船長を入れて7人だった。"}, {"t": 569.2833333333333, "x": "決定文によると、この港では\n警察側もいろいろ手を考えていた。"}, {"t": 573.45, "x": "それが男にある程度知られたことが、\n後の判断に響いていく。"}, {"t": 577.9666666666667, "x": "船はいったん今治の方へ向かった。"}, {"t": 580.1, "x": "ところが今治の沖で向きを変えて北へ走り出す。"}, {"t": 583.0666666666667, "x": "普通の航路ではない、大三島の方向だ。"}, {"t": 585.7333333333333, "x": "どこを目指してたの？"}, {"t": 587.1, "x": "警察にも分からなかった。"}, {"t": 588.8, "x": "刑事局長は判断に苦しんだと言っている。"}, {"t": 591.4666666666667, "x": "いちばん恐れたのは警察の少ない\n港に上がられることだ。"}, {"t": 594.95, "x": "民家に押し入って暴れられたら、手がつけられない。"}, {"t": 597.7666666666667, "x": "海の上では狙撃班も巡視艇に乗って追っていた。"}, {"t": 600.7166666666667, "x": "父と姉も巡視船に乗り、マイクで呼びかけ続けた。"}, {"t": 604.0, "x": "少しでも近寄れば、撃ってくる。"}, {"t": 606.0833333333334, "x": "海上保安庁の船に向けて、30発から\n40発近くを撃ったとされる。"}, {"t": 610.95, "x": "そんなに？"}, {"t": 612.0833333333334, "x": "ここで国会に残った、大事な一場面がある。"}, {"t": 615.0166666666667, "x": "追う船の中で、途中で撃つという声が出たらしい。"}, {"t": 618.05, "x": "海の上で撃とうって？"}, {"t": 619.4333333333333, "x": "刑事局長は、いけないと止めたと答えている。"}, {"t": 622.3166666666667, "x": "運輸大臣も、海の上では原則使うなと指示していた。"}, {"t": 625.85, "x": "説得を続けろ、というのがこの夜の答えだった。"}, {"t": 628.9333333333333, "x": "男はこの夜、一睡もしていない。"}, {"t": 631.1666666666666, "x": "そして船は朝の広島へ戻っていく。"}, {"t": 634.1666666666666, "x": "5月13日の朝、男は船の上から要求を出した。"}, {"t": 637.8333333333334, "x": "捕まった共犯の少年を広島の港へ連れて来い。"}, {"t": 641.1833333333333, "x": "警察はどう答えたの？"}, {"t": 642.8166666666667, "x": "了承した。だが連れて来る気は初めから無かった。"}, {"t": 646.05, "x": "えっ？"}, {"t": 647.1833333333333, "x": "決定文にはっきり書いてある。"}, {"t": 649.0333333333333, "x": "港に着いても少年はいない。"}, {"t": 650.7333333333333, "x": "男は怒って何度も船長に交渉させた。"}, {"t": 653.5, "x": "警察はその度に\n「今連れて来つつある」と嘘をついた。"}, {"t": 657.15, "x": "嘘って書いてあるの？"}, {"t": 658.5333333333333, "x": "書いてある。当否は別だ、とも断っている。"}, {"t": 661.35, "x": "少年はそのころ山口県警に渡された\nもようで、連れて来られなかった。"}, {"t": 665.65, "x": "午前8時45分ごろ、大阪の射手たちが港に着いた。"}, {"t": 669.55, "x": "船は第4桟橋に着くと予想して、\n配置の準備をしていた。"}, {"t": 673.3666666666667, "x": "ところが船は突然第3桟橋に向かった。"}, {"t": 676.3166666666667, "x": "予想が外れたの？"}, {"t": 677.6833333333333, "x": "外れた。2人は急いで上屋に入った。"}, {"t": 680.2333333333333, "x": "もう1人は防潮堤の陰に隠れた。"}, {"t": 682.55, "x": "上屋というのは桟橋の屋根付きの建物のことだ。"}, {"t": 685.5666666666667, "x": "船が着いたのは午前9時の少し前だった。"}, {"t": 688.2, "x": "着いた桟橋の番号は国会の報告と\n決定文で違っている。"}, {"t": 691.9833333333333, "x": "ただ、もやい綱は取らず、いかりも入れなかった。"}, {"t": 695.0, "x": "いつでも出ていける形ね。"}, {"t": 696.8, "x": "射手の位置はここで決まってしまった。"}, {"t": 698.9833333333333, "x": "もっと近づこうにも、撃たれるから動けない。"}, {"t": 701.5833333333334, "x": "距離が75.5メートルになった理由の1つが、これだ。"}, {"t": 705.2166666666667, "x": "決定文は、事前の検討が\n足りなかったかもしれないと書いている。"}, {"t": 709.7333333333333, "x": "着いてから、男は撃ち始めた。"}, {"t": 711.85, "x": "待合室、パトカー、海上保安庁の巡視船。"}, {"t": 714.9666666666667, "x": "巡視船のいぶきとたかなわにも、弾が当たった。"}, {"t": 718.0333333333333, "x": "何発くらい撃ったの？"}, {"t": 719.55, "x": "ここも数が揃わない。"}, {"t": 720.9666666666667, "x": "警察の課長は当日、約1時間で\n20発ぐらいと報告した。"}, {"t": 725.2666666666667, "x": "3日後の局長の報告では18発だ。"}, {"t": 727.95, "x": "後の決定文は16発としている。"}, {"t": 730.3333333333334, "x": "全部でどれだけ撃ったかも、2つの数がある。"}, {"t": 733.1166666666667, "x": "刑事局長は国会で111発撃った勘定になると言った。"}, {"t": 736.85, "x": "決定文の数を足すと、拳銃2発、\n散弾銃74発、ライフル50発。"}, {"t": 742.3, "x": "足すと126発？"}, {"t": 744.0333333333333, "x": "そうだ。どちらが正しいかは言えない。"}, {"t": 746.2166666666667, "x": "ライフルの弾は2000メートル近くまで\n飛ぶと局長は言っている。"}, {"t": 749.8333333333334, "x": "港の後ろには民家があった。"}, {"t": 751.75, "x": "そこへ見物の人が約600人も集まっていた。"}, {"t": 755.0166666666667, "x": "600人？ 撃ち合いを見に来たの？"}, {"t": 757.2333333333333, "x": "報道の人たちも、テレビが\n撮れる位置から動かなかった。"}, {"t": 760.5833333333334, "x": "警察は人を下げようとしたが、\n全部は無理だったと答えている。"}, {"t": 764.35, "x": "決定文は男の様子も細かく書いている。"}, {"t": 767.0, "x": "カメラのケースを見て、催涙弾ではないかと疑った。"}, {"t": 770.25, "x": "路面電車の発車の合図を\n弾の発射の命令と聞き違えた。"}, {"t": 774.0, "x": "発車と発射……そこまで張りつめてたのね。"}, {"t": 777.3, "x": "説得の場面に移ろう。"}, {"t": 778.8666666666667, "x": "午前8時58分、巡視船いぶきから\n父の呼びかけが続いていた。"}, {"t": 783.2166666666667, "x": "男はそれに振り向いて、また1発撃った。"}, {"t": 785.9833333333333, "x": "お父さんが呼んでるのに？"}, {"t": 787.5166666666667, "x": "弾はいぶきに当たった。"}, {"t": 788.95, "x": "幸い、けが人は出なかった。"}, {"t": 790.8333333333334, "x": "局長の説明では父と姉のいる船へ向けても撃っている。"}, {"t": 794.35, "x": "本当に家族を狙ったの？"}, {"t": 796.2, "x": "そこは国会でも問われた。"}, {"t": 797.8666666666667, "x": "議員が聞いた。威嚇で空に撃ったのではないか、と。"}, {"t": 800.9666666666667, "x": "局長の答えはこうだ。"}, {"t": 802.5, "x": "空に向いたものも、地上に向いたものもあった。"}, {"t": 805.2833333333333, "x": "決定文は、弾は危うく肉親の命さえ\n奪うところだったと書いた。"}, {"t": 809.4, "x": "午前9時13分、\nいぶきからの説得はいったん中止された。"}, {"t": 813.1166666666667, "x": "9時19分には船長と乗組員1人が桟橋に降りた。"}, {"t": 816.7333333333333, "x": "船会社の社長と話し合うためだ。"}, {"t": 819.1, "x": "船長は逃げなかったの？"}, {"t": 820.7666666666667, "x": "逃げなかった。男の言葉を伝え、また船に戻っている。"}, {"t": 824.4333333333333, "x": "男は船長にこうも言っていた。"}, {"t": 826.4, "x": "説得に応じるくらいなら、\n最初からこんなことはやらない。"}, {"t": 830.4333333333333, "x": "では「撃つしかない」と決まったのはいつか。"}, {"t": 833.0166666666667, "x": "国会の答えは1つの時刻に集まっている。"}, {"t": 835.7666666666667, "x": "午前9時20分ごろだ。"}, {"t": 837.5666666666667, "x": "撃ったのは9時52分でしょう？"}, {"t": 839.5166666666667, "x": "そうだ。判断から引き金まで、32分ある。"}, {"t": 842.7, "x": "現場の幹部から、状況が悪いという声が上がる。"}, {"t": 845.6666666666666, "x": "決定文では午前9時ごろ、現地の刑事部長が\n本部長へ意見を上げている。"}, {"t": 850.0833333333334, "x": "広島県警本部長は自分の目で見ると言った。"}, {"t": 853.0, "x": "本部から桟橋へ向かって、状況を確かめた。"}, {"t": 855.9833333333333, "x": "そして現地にいた刑事局長へ連絡した。"}, {"t": 858.6833333333333, "x": "銃器の使用はやむなしと判断する、と。"}, {"t": 861.3, "x": "決めたのは本部長なのね？"}, {"t": 863.1, "x": "そうだ。法律の上で命じる\n立場は県警の本部長にある。"}, {"t": 866.6833333333333, "x": "局長の言葉が会議録に残っている。"}, {"t": 869.15, "x": "いろいろ考えました。いろいろ迷いました。"}, {"t": 871.7166666666667, "x": "説得の効果が期待できるなら、\nもっともっとやったろうと思います。"}, {"t": 875.6666666666666, "x": "午前9時30分、ライフルの要員が撃てる配置に付いた。"}, {"t": 879.2, "x": "9時40分すぎ、男は船長を通じてこう言った。"}, {"t": 882.45, "x": "ラジオで聞いている。"}, {"t": 883.4333333333333, "x": "給油だと言って時間を延ばしているな。"}, {"t": 885.7833333333333, "x": "警察の手を読んでたのね。"}, {"t": 887.5666666666667, "x": "そう言いながら、さらに5、6発撃った。"}, {"t": 890.1333333333333, "x": "船員を人質にしてでも出港する、とも言い始めた。"}, {"t": 894.15, "x": "午前9時47分ごろから、最後の警告が始まった。"}, {"t": 897.8833333333333, "x": "広島南署の署長の名前でマイクから呼びかけた。"}, {"t": 901.0833333333334, "x": "むだな抵抗はやめよ。"}, {"t": 902.3, "x": "銃を捨てて出てこい。"}, {"t": 903.65, "x": "十数回くり返したと、\n海上保安庁の次長が報告している。"}, {"t": 907.6833333333333, "x": "男は聞いたの？"}, {"t": 908.9, "x": "警告のたびに陸に向かって撃った。"}, {"t": 911.0833333333334, "x": "マイクの方に向けて撃った、という報告もある。"}, {"t": 913.8166666666667, "x": "この警告の長さは後で問題になった。"}, {"t": 916.3666666666667, "x": "約7分だ。"}, {"t": 917.55, "x": "7分って、短くない？"}, {"t": 919.4333333333333, "x": "短すぎる、という批判が実際にあった。"}, {"t": 922.05, "x": "決定文はその批判を取り上げた上でこう判断している。"}, {"t": 925.3333333333334, "x": "長くしても、もう効き目は期待できなかった。"}, {"t": 928.1333333333333, "x": "撃つ前に「撃つぞ」と\n言うべきだった、という意見もあった。"}, {"t": 931.5833333333334, "x": "これにも決定文は答えた。"}, {"t": 933.4, "x": "言えば、かえって\n暴発の引き金になったかもしれない。"}, {"t": 936.65, "x": "ほかの手はなかったのかしら。"}, {"t": 938.4833333333333, "x": "決定文は1つずつ検討している。"}, {"t": 940.8, "x": "船員に取り押さえてもらう。これは\n民間人に頼むことではない。"}, {"t": 944.4833333333333, "x": "警察官が忍び込む。見通しが良くて近づけない。"}, {"t": 947.7166666666667, "x": "ガス銃や放水。一瞬で抵抗する\n力を奪えず、怒らせるだけだ。"}, {"t": 951.95, "x": "少年を連れて来て話し合う。\nもう山口にいて無理だった。"}, {"t": 955.35, "x": "こうして手段が1つずつ消えていく。"}, {"t": 958.1833333333333, "x": "午前9時50分、状況が変わった。"}, {"t": 960.6, "x": "船が後ろへ動き始めた。"}, {"t": 962.2333333333333, "x": "桟橋を離れようとしたんだ。"}, {"t": 964.2333333333333, "x": "また海へ出る気なの？"}, {"t": 965.6666666666666, "x": "男が再び船長に出港を命じていた。"}, {"t": 968.3666666666667, "x": "船首の方では綱を解く作業が進んでいた。"}, {"t": 971.0166666666667, "x": "ここがこの事件のいちばん大事な一点だ。"}, {"t": 973.5333333333333, "x": "決定文の理屈はこうなっている。"}, {"t": 975.5333333333333, "x": "出てしまえば、もう誰も船員を守れない。"}, {"t": 978.15, "x": "どうして守れないの？"}, {"t": 979.5833333333334, "x": "男は近づく船を撃つ。"}, {"t": 981.0666666666667, "x": "巡視船は数百メートル離れるしかない。"}, {"t": 983.65, "x": "動く船から動く船を撃っても、当たるとは限らない。"}, {"t": 986.95, "x": "出港の瞬間が最後の機会ってこと？"}, {"t": 989.5666666666667, "x": "そうだ。今を置いてほかにない、と決定文は書いた。"}, {"t": 992.7166666666667, "x": "もう1つの理由が第5桟橋の入り口にあった。"}, {"t": 995.6333333333333, "x": "そこに警察官約20人と報道の人約5人が隠れていた。"}, {"t": 999.6333333333333, "x": "防潮堤の陰だ。船が桟橋にいる間は隠れられる。"}, {"t": 1003.0666666666667, "x": "ところが船が動くと、見える角度が変わる。"}, {"t": 1005.8833333333333, "x": "隠れてた人たちが丸見えになるのね？"}, {"t": 1008.35, "x": "そうだ。身を隠せるのは\n数人だけ、と裁判所は検証した。"}, {"t": 1012.2, "x": "残りは男の目の前に出てしまう。"}, {"t": 1014.3166666666667, "x": "25人の集団に連発の銃だ。"}, {"t": 1016.6, "x": "撃たなければ、この人たちが\n撃たれると決定文は見た。"}, {"t": 1019.9166666666666, "x": "本部長が狙撃を命じたのは午前9時50分ごろだった。"}, {"t": 1023.9833333333333, "x": "では撃たれた瞬間、男は何をしていたか。"}, {"t": 1026.7166666666667, "x": "これが国会でいちばん厳しく問われた点だ。"}, {"t": 1029.3166666666666, "x": "テレビの映像を見た議員がこう質問している。"}, {"t": 1031.9, "x": "武器は持っていなかったのではないか。"}, {"t": 1033.95, "x": "片手を手すりに置き、双眼鏡を持っていたではないか。"}, {"t": 1037.2833333333333, "x": "えっ、銃を持ってなかったの？"}, {"t": 1039.2333333333333, "x": "決定文も、その点は認めている。"}, {"t": 1041.5666666666666, "x": "撃たれた瞬間、男は猟銃を手にしていなかった。"}, {"t": 1044.6333333333334, "x": "外へ向けて撃ってもいなかった。"}, {"t": 1046.6166666666666, "x": "じゃあ無抵抗の人を撃ったってことにならない？"}, {"t": 1049.25, "x": "そこで次の一文が大事になる。"}, {"t": 1051.3, "x": "拳銃はバンドに差し込んでいた。"}, {"t": 1053.1833333333334, "x": "ライフル2丁と散弾銃1丁は手元に置いていた。"}, {"t": 1056.1833333333334, "x": "船長の椅子までの距離は1.5メートルだった。"}, {"t": 1059.0833333333333, "x": "1.5メートル……。"}, {"t": 1060.3166666666666, "x": "局長は国会でこう答えている。"}, {"t": 1062.35, "x": "向こうが弾を撃っている瞬間でなければ\n撃ってはいけない、とはならない。"}, {"t": 1066.1666666666667, "x": "その前も後も撃つ可能性が強い。"}, {"t": 1068.2, "x": "時間の流れで判断するものだと。"}, {"t": 1070.4666666666667, "x": "銃を捨てて出てきたなら話は別だ、とも言っている。"}, {"t": 1073.8, "x": "一服してただけ、という見方ね。"}, {"t": 1076.1333333333334, "x": "決定文も「一時の休憩」と表現している。"}, {"t": 1079.1666666666667, "x": "議員が見た映像も、その瞬間だった。"}, {"t": 1081.6833333333334, "x": "局長はこうも言った。"}, {"t": 1082.9333333333334, "x": "テレビの映像は、どうしても部分的だと。"}, {"t": 1085.5333333333333, "x": "見た人の印象と現場の判断の間にここで溝ができた。"}, {"t": 1089.75, "x": "撃った側に話を移す。"}, {"t": 1091.3833333333334, "x": "射手は大阪府警の巡査部長だ。名前は出さない。"}, {"t": 1094.5333333333333, "x": "国会ではこの人の談話が新聞から読み上げられた。"}, {"t": 1097.6666666666667, "x": "見出しは「無理だった精密な照準」だ。"}, {"t": 1100.4, "x": "本人が無理だったって言ったの？"}, {"t": 1102.4, "x": "記事によれば、命令から\n10秒ぐらいで引き金を引いた。"}, {"t": 1105.6666666666667, "x": "決定文の証言では5秒から6秒で、ここも揃わない。"}, {"t": 1109.1833333333334, "x": "男の腰から下は、ドアの鉄板に隠れていた。"}, {"t": 1112.3333333333333, "x": "足を狙うのが最善だが、仕方がなかった。"}, {"t": 1115.15, "x": "照準器の倍率は4倍だった。"}, {"t": 1117.2333333333333, "x": "視野に男の頭からひざまでが、すっぽり入る。"}, {"t": 1120.25, "x": "肩や腕を正確に狙うのは無理だった、と語っている。"}, {"t": 1123.6666666666667, "x": "名人でも無理なの？"}, {"t": 1125.0833333333333, "x": "100メートルから10センチの的に当てる\n腕前だと、国会で言われた人だ。"}, {"t": 1129.4166666666667, "x": "それでも的は紙ではなく、人間だ。"}, {"t": 1131.8, "x": "決定文は、もっと踏み込んでいる。"}, {"t": 1133.9166666666667, "x": "では2人で同時に撃って、両肩を止められなかったか。"}, {"t": 1137.2, "x": "班長の証言はこうだ。"}, {"t": 1138.6, "x": "無理に引けば銃がぶれる。"}, {"t": 1140.1666666666667, "x": "75.5メートルで呼吸を合わせて\n同時に当てるのは不可能だと。"}, {"t": 1144.05, "x": "弱く撃てばいいとも言えない。"}, {"t": 1145.6, "x": "中途半端に当たれば、手負いの男の隣に\n船長がいることになる。"}, {"t": 1149.7333333333333, "x": "1発で動きを止めなきゃいけなかったのね。"}, {"t": 1152.3666666666666, "x": "そうだ。だから狙ったのは\n体の真ん中、みぞおちのあたりだ。"}, {"t": 1156.1166666666666, "x": "局長によると、撃った直後の射手は\n涙を浮かべ暗い顔をしていた。"}, {"t": 1160.85, "x": "午前9時52分、1発が放たれた。"}, {"t": 1163.5333333333333, "x": "男は甲板に倒れた。"}, {"t": 1165.1333333333334, "x": "警察官たちが船に上がり、取り押さえて逮捕した。"}, {"t": 1168.45, "x": "7人の船員は？"}, {"t": 1169.8666666666666, "x": "全員無事だ。"}, {"t": 1171.0, "x": "船を乗っ取られてから、約17時間たっていた。"}, {"t": 1174.1166666666666, "x": "男は県立の病院へ運ばれた。"}, {"t": 1176.3, "x": "亡くなったのは午前11時25分とされる。"}, {"t": 1179.0833333333333, "x": "11時15分、11時32分と書かれた記録もある。"}, {"t": 1182.8333333333333, "x": "長官の後藤田は3日後の国会で、まずこう述べた。"}, {"t": 1186.0166666666667, "x": "罪は罪、人は人。"}, {"t": 1187.7, "x": "命を落とした犯人はもちろん、親や\n家族の心情を考えると気の毒だった。"}, {"t": 1192.3166666666666, "x": "その上で続けた。今回の結末は\nやむを得ない結果だった、と。"}, {"t": 1196.4333333333334, "x": "気の毒と、やむを得ないを両方言ったのね。"}, {"t": 1199.1166666666666, "x": "撃ったあとの方が、話はずっと長い。"}, {"t": 1202.1333333333334, "x": "銃声が響いたその日、映像は\n全国の茶の間に入っていた。"}, {"t": 1205.9, "x": "その日の参議院の委員会で、議員が言っている。"}, {"t": 1208.7, "x": "テレビの画面で見たが、ちょっと\n早まったと言われないか。"}, {"t": 1211.8666666666666, "x": "3日後の委員会でも、別の議員が言った。"}, {"t": 1214.4833333333333, "x": "射殺の瞬間がテレビで茶の間に\n入ったのは、わが国で初めてだろう。"}, {"t": 1218.6833333333334, "x": "国民のショックは非常に大きい、と。"}, {"t": 1221.0166666666667, "x": "その映像を流してよかったのかも、問題になったの？"}, {"t": 1224.3833333333334, "x": "なった。関係する役所に順番に見解が聞かれている。"}, {"t": 1227.85, "x": "文部省の担当者は、\n青少年への影響は大きいと答えた。"}, {"t": 1231.55, "x": "長官の後藤田はこう答えている。"}, {"t": 1233.55, "x": "報道の自由との関係で、お答えしにくい問題だ。"}, {"t": 1236.7833333333333, "x": "あえて個人の見解を言えば、好ましくない。"}, {"t": 1239.5166666666667, "x": "撃たせた側の長官が、好ましくないって言うのね。"}, {"t": 1243.1833333333334, "x": "5月13日の国会に、もう一度戻ろう。"}, {"t": 1246.05, "x": "この日はたまたま、首相の佐藤栄作が\n参議院の運輸委員会にいた。"}, {"t": 1250.3, "x": "たまたま？"}, {"t": 1251.4166666666667, "x": "新幹線の法案の審議で呼ばれていたんだ。"}, {"t": 1254.05, "x": "野党の議員が、その場で聞いた。"}, {"t": 1256.0833333333333, "x": "私が直感で感じたのは、目には目を、ということだ。"}, {"t": 1259.5, "x": "あらかじめ射手を送って、撃ち殺してやるぞという\n姿勢だったのではないか。"}, {"t": 1263.7666666666667, "x": "厳しい言い方ね。"}, {"t": 1265.05, "x": "ただその議員も、自分は現場から\n離れているかもしれないと断っている。"}, {"t": 1269.3, "x": "首相はこう答えた。"}, {"t": 1270.6166666666666, "x": "とにかく抵抗を止めることが、最初に要求される。"}, {"t": 1273.7666666666667, "x": "足を撃っても、手を撃っても、\nしかるべきではないのか。"}, {"t": 1276.8666666666666, "x": "この時点で、現場の細かい事情はまだ届いていない。"}, {"t": 1280.05, "x": "足がドアの鉄板に隠れていたことも、\nこの時は分かっていない。"}, {"t": 1283.8, "x": "それでも、けしからぬから殺してもいいという\n感情で動くべきではない、と言った。"}, {"t": 1288.3666666666666, "x": "個人の権利と公の安全が両立する範囲はどこなのか。"}, {"t": 1291.9166666666667, "x": "その問いが、当日のうちに首相の口から出ていた。"}, {"t": 1295.7166666666667, "x": "撃ったあと、もう1つの問題が起きた。"}, {"t": 1298.1333333333334, "x": "どこを狙ったのか、説明が揃わなかった。"}, {"t": 1301.0333333333333, "x": "撃った場所じゃなくて、狙った場所？"}, {"t": 1303.3, "x": "そうだ。5月16日の国会で、\n議員が順番に読み上げた。"}, {"t": 1307.2333333333333, "x": "5月15日の広島県議会の委員会で、\n本部長は右腕を狙ったと述べた。"}, {"t": 1312.15, "x": "同じ日の委員会の1時間前には、\n左肩を狙ったと言っていたという。"}, {"t": 1316.4833333333333, "x": "別の記者会見では、左腕から\n肩をねらわせたと語っている。"}, {"t": 1320.4333333333334, "x": "5月14日、捜査一課長は左腕から\n肩と記者会見で話した。"}, {"t": 1325.1, "x": "右と左が混ざってるじゃない。"}, {"t": 1327.0333333333333, "x": "左には心臓がある。議員が問題にしたのはそこだ。"}, {"t": 1330.3166666666666, "x": "利き腕は普通は右だ。"}, {"t": 1331.6666666666667, "x": "止めるなら右を狙うはずだろう。"}, {"t": 1333.5666666666666, "x": "なのに告発のあとから、右腕の説明に変わっている。"}, {"t": 1337.0833333333333, "x": "告発されたから言い直したように見えるのね。"}, {"t": 1339.8166666666666, "x": "議員はそう指摘した。"}, {"t": 1341.25, "x": "局長の答えはこうだ。"}, {"t": 1342.7666666666667, "x": "本部長は課長に、急所をはずせと指示した。"}, {"t": 1345.55, "x": "課長は大阪の班長に、できれば右半身と言った。"}, {"t": 1348.85, "x": "左肩の話は、課長が記者会見で\n右手で左肩を示したためらしい。"}, {"t": 1353.5833333333333, "x": "本人は右肩のつもりだった、という説明だ。"}, {"t": 1356.7, "x": "その説明で、みんな納得したの？"}, {"t": 1359.1666666666667, "x": "議員は時間切れで次の質問に移った。"}, {"t": 1361.7166666666667, "x": "翌年3月の国会で、局長はこう説明している。"}, {"t": 1365.1333333333334, "x": "肩というのは、急所をはずす\n例として言っただけだ、と。"}, {"t": 1368.45, "x": "決定文が認めた狙いは、肩でも腕でもなかった。"}, {"t": 1371.7166666666667, "x": "みぞおちを中心とするあたりだ。"}, {"t": 1374.2166666666667, "x": "5月15日、広島地検に告発が出された。"}, {"t": 1377.4833333333333, "x": "出したのは札幌の2人の弁護士だと報じられた。"}, {"t": 1380.6333333333334, "x": "広島の事件を、札幌の人が？"}, {"t": 1383.1166666666666, "x": "事件からわずか2日後のことだ。"}, {"t": 1385.1666666666667, "x": "対象は、撃った巡査部長と命じた本部長だ。"}, {"t": 1388.1666666666667, "x": "罪名は特別公務員暴行陵虐致死と殺人だった。"}, {"t": 1391.7333333333333, "x": "難しい名前ね。"}, {"t": 1393.05, "x": "警察官のような立場の人が、\n職務で人を傷つけて死なせる罪だ。"}, {"t": 1397.5, "x": "法律の争点は、警察官職務執行法の7条になる。"}, {"t": 1401.3, "x": "略して警職法だ。武器を使ってよい\n場面を決めた条文だな。"}, {"t": 1405.2166666666667, "x": "人に危害を与えてよいのは、原則として\n正当防衛か緊急避難のときだ。"}, {"t": 1409.95, "x": "もう1つ、重い罪の犯人の逮捕で、\nほかに手段がないときがある。"}, {"t": 1414.3, "x": "今回はどれに当たるの？"}, {"t": 1415.8666666666666, "x": "国会ではそこも食い違った。"}, {"t": 1417.7333333333333, "x": "局長は、正当防衛とほかに\n手段がない場合の両方だと答えた。"}, {"t": 1421.8166666666666, "x": "議員の中には、正当防衛ではないと見る人もいた。"}, {"t": 1425.0166666666667, "x": "別の議員は言った。相手がどんなに\n凶悪でも射殺は行き過ぎではないか。"}, {"t": 1429.25, "x": "長官は別の質問に、こう線を引いた。"}, {"t": 1431.8833333333334, "x": "銃器の使用による逮捕は、法律では許されている。"}, {"t": 1435.0166666666667, "x": "しかし実際に使うのは、例外中の例外だ。"}, {"t": 1437.9833333333333, "x": "では広島はその例外に当たるのか。"}, {"t": 1440.2333333333333, "x": "それを判断する役目は、検察へ移った。"}, {"t": 1443.6333333333334, "x": "1970年7月1日、広島地検は2人を不起訴にした。"}, {"t": 1448.3833333333334, "x": "裁判にしないってことね？"}, {"t": 1450.15, "x": "そうだ。理由は正当防衛の条件を満たし、\n警職法に沿った職務だというものだ。"}, {"t": 1455.2666666666667, "x": "それで終わり？"}, {"t": 1456.4, "x": "終わらなかった。告発した\n弁護士たちは7月8日に動いた。"}, {"t": 1460.2833333333333, "x": "付審判の請求だ。"}, {"t": 1461.8333333333333, "x": "ふしんぱん？"}, {"t": 1462.9666666666667, "x": "検察が起訴しなかった事件を、\n裁判にかけるよう裁判所に求める手続きだ。"}, {"t": 1467.8166666666666, "x": "ただし使える罪は決まっている。"}, {"t": 1469.75, "x": "殺人は対象にならない、と裁判所は判断した。"}, {"t": 1472.9833333333333, "x": "残ったのは特別公務員暴行陵虐致死だけだ。"}, {"t": 1476.0833333333333, "x": "それでも審理は事件の全体に及んだ。"}, {"t": 1478.4833333333333, "x": "裁判所は3人の裁判官で調べた。"}, {"t": 1480.9666666666667, "x": "現場の桟橋や防潮堤も、自分たちで見ている。"}, {"t": 1484.0666666666666, "x": "防潮堤の厚さ、船の甲板の高さ、潮の高さ。"}, {"t": 1487.7166666666667, "x": "船が動いたときに、見える角度まで計算した。"}, {"t": 1490.8333333333333, "x": "潮の高さまで？"}, {"t": 1492.1166666666666, "x": "この朝は午前9時10分が干潮だった。"}, {"t": 1494.6666666666667, "x": "男の肩の高さは、地面から\n約3.8メートルと出している。"}, {"t": 1498.75, "x": "医学の教授にも鑑定を頼んだ。"}, {"t": 1500.8666666666666, "x": "班長や船員も、証人として呼んでいる。"}, {"t": 1503.4666666666667, "x": "ここまでやった上で、決定が出た。"}, {"t": 1506.2666666666667, "x": "結論から言う。請求は棄却された。"}, {"t": 1508.7333333333333, "x": "2人は裁判にかけられなかった。"}, {"t": 1510.9333333333334, "x": "じゃあ警察の主張通りだったのね？"}, {"t": 1513.2, "x": "そこが違う。"}, {"t": 1514.3166666666666, "x": "決定文には、それまで警察が\n言わなかった言葉がある。"}, {"t": 1517.75, "x": "未必の殺意だ。"}, {"t": 1519.0833333333333, "x": "みひつのさつい？"}, {"t": 1520.2666666666667, "x": "死んでも構わない、と分かった\n上でやる気持ちのことだ。"}, {"t": 1523.4, "x": "警察は、殺すつもりはなかったと説明してきた。"}, {"t": 1526.6166666666666, "x": "長官も、抵抗を止めるのが目的だと答えていた。"}, {"t": 1529.8333333333333, "x": "ただ長官は、命を落とすかもしれないという\n予測は当然していたとも言った。"}, {"t": 1534.35, "x": "決定文は、はっきり書いた。"}, {"t": 1536.2666666666667, "x": "2人には未必の殺意が存在した。"}, {"t": 1538.6333333333334, "x": "そして2人は共謀して殺害したものだ、と。"}, {"t": 1541.7, "x": "えっ、それで罪にならないの？"}, {"t": 1543.7, "x": "ならない。理由は正当防衛だ。"}, {"t": 1545.7, "x": "殺意があっても、防衛が\nやむを得なければ違法ではなくなる。"}, {"t": 1549.0166666666667, "x": "むしろ弱い場所を狙っていたら、\n船長や警察官が反撃を受けていた。"}, {"t": 1553.3166666666666, "x": "決定文はそこまで言っている。"}, {"t": 1555.25, "x": "殺すつもりがあったと認めた上で、許したのね。"}, {"t": 1558.3833333333334, "x": "局長は1971年3月の国会で、この決定に触れた。"}, {"t": 1562.8833333333334, "x": "未必の故意はあるが、違法性はないという説示だと。"}, {"t": 1565.9833333333333, "x": "撃つと決めるとは、相手の死を引き受けることだった。"}, {"t": 1569.0166666666667, "x": "それを裁判所が文字にしたことになる。"}, {"t": 1571.9333333333334, "x": "決定文には、もう1つ厳しい指摘がある。"}, {"t": 1574.7333333333333, "x": "救急車の話だ。"}, {"t": 1576.25, "x": "救急車？"}, {"t": 1577.3833333333334, "x": "国会での局長の答えはこうだった。"}, {"t": 1579.7, "x": "救急車はすでに用意してございました。"}, {"t": 1582.05, "x": "桟橋に着く前に電話があり、犯人から\n撃たれるおそれもあったからだと。"}, {"t": 1586.3333333333333, "x": "準備はしてたのね。"}, {"t": 1587.7333333333333, "x": "ところが裁判所の調べは違った。"}, {"t": 1589.9, "x": "午前9時30分を過ぎて、初めて\n救急車の手配が始まっている。"}, {"t": 1594.2, "x": "銃を本気で考え始めたのは、午前9時ごろのはずだ。"}, {"t": 1597.6166666666666, "x": "そこから医師の手配や、\n仮の治療の場所を作るべきだった。"}, {"t": 1601.2833333333333, "x": "撃つ前から、撃ったあとの準備をしろってことね。"}, {"t": 1604.2166666666667, "x": "そうだ。もっと言えば、射手を呼んだ\n段階から考えるべきだと書いた。"}, {"t": 1608.3166666666666, "x": "ライフルを使えば重傷を負わせることは\n当然予想できるからだ。"}, {"t": 1611.85, "x": "決定文の言葉はこうだ。"}, {"t": 1613.5166666666667, "x": "極めて遺憾なことに。"}, {"t": 1614.9666666666667, "x": "警察側が命を保つことに、どの程度意を\n払ったのか疑念を抱かざるを得ない。"}, {"t": 1619.8166666666666, "x": "裁判所が「疑念」って書いたのね。"}, {"t": 1622.2, "x": "ただし結論は変わらなかった。"}, {"t": 1624.0833333333333, "x": "このときの傷では、治療があっても\n救えなかったと見たからだ。"}, {"t": 1627.75, "x": "もしすぐの治療で助かる傷だったら、\n別の罪が問題になっただろう。"}, {"t": 1631.9833333333333, "x": "決定文は、過失の話にまで触れている。"}, {"t": 1634.7333333333333, "x": "撃つ判断だけでなく、撃った\nあとの備えまでが判断の中身だった。"}, {"t": 1638.7, "x": "国会で局長の言った「用意」と、\n裁判所が調べた時刻。"}, {"t": 1642.6666666666667, "x": "この2つの間にも、溝が残った。"}, {"t": 1645.75, "x": "事件のあと、変わったものを数字で見よう。"}, {"t": 1648.2333333333333, "x": "まず民間のライフルだ。"}, {"t": 1649.7, "x": "当時、ライフルは法律の上で猟銃の扱いだった。"}, {"t": 1652.8666666666666, "x": "全国に3万数千丁が出回っていた。"}, {"t": 1655.5833333333333, "x": "そんなに？"}, {"t": 1656.7166666666667, "x": "長官は個人の考えとして、こう答えた。"}, {"t": 1659.45, "x": "この狭い国土で、\nライフルでなければならない猟があるのか。"}, {"t": 1662.85, "x": "今日ではライフルは必要ないのではないか。"}, {"t": 1665.4333333333334, "x": "翌1971年、銃刀法が改正された。"}, {"t": 1668.9, "x": "ライフルの所持の条件が、\n散弾銃よりずっと厳しくなった。"}, {"t": 1672.6166666666666, "x": "銃と弾を別々に、鍵をかけてしまう決まりも入った。"}, {"t": 1676.05, "x": "効き目は数字に出た。"}, {"t": 1677.45, "x": "それまでライフルの許可は\n毎年2000丁から3000丁ずつ増えていた。"}, {"t": 1681.5166666666667, "x": "改正のあとは？"}, {"t": 1682.7, "x": "1971年の1年間で増えたのは91丁だ。"}, {"t": 1686.6666666666667, "x": "2000丁が91丁に？"}, {"t": 1688.4833333333333, "x": "警察庁の課長が国会で報告している。"}, {"t": 1691.1833333333334, "x": "一方で警察のライフルは増えた。"}, {"t": 1693.2166666666667, "x": "25丁だったものが、1970年度末には50丁だ。"}, {"t": 1697.45, "x": "民間を減らして、警察は倍にしたのね。"}, {"t": 1700.2833333333333, "x": "1発の前と後で、銃の数字がはっきり変わった。"}, {"t": 1704.0833333333333, "x": "ここで、最初に話した人に戻る。"}, {"t": 1706.5, "x": "宇品の桟橋で、船を追って撃たれた警察官だ。"}, {"t": 1709.7666666666667, "x": "3日後も危ない状態だった人ね。"}, {"t": 1712.1, "x": "そうだ。広島南署の警部補だった。"}, {"t": 1714.7, "x": "名前は出さない。"}, {"t": 1715.75, "x": "この人は命を取りとめた。"}, {"t": 1717.55, "x": "しかし重い障害が残った。"}, {"t": 1719.3833333333334, "x": "1972年3月の国会で、\n警察庁の官房長が様子を答えている。"}, {"t": 1724.5166666666667, "x": "通常の職務に戻ることができず、療養を続けている。"}, {"t": 1727.9166666666667, "x": "それでも現職の警察官のままだ、と。"}, {"t": 1730.6666666666667, "x": "辞めさせなかったのね。"}, {"t": 1732.2166666666667, "x": "その2か月後の国会では、\n総理府の総務長官もこの人に触れた。"}, {"t": 1736.45, "x": "自分の手で表彰状を渡した、と述べている。"}, {"t": 1739.3333333333333, "x": "その人には何か補償はあったの？"}, {"t": 1741.5666666666666, "x": "そのときの議題が、まさに補償の話だった。"}, {"t": 1744.5, "x": "危険な任務でけがをした\n公務員の補償を厚くする制度だ。"}, {"t": 1747.9833333333333, "x": "1972年1月1日以降の事件に、\nさかのぼって当てることになった。"}, {"t": 1753.1833333333 にならないと決めて、注文も付けた。"}, {"t": 1978.8833333333334, "x": "船が着いてから撃つまで、およそ57分だった。"}, {"t": 1982.0, "x": "20発前後の銃声と、十数回の警告と、父の声。"}, {"t": 1985.9, "x": "動き出した船と、隠れた\n25人と、1.5メートル先の船長。"}, {"t": 1990.4166666666667, "x": "その全部が、あの1発の前にあったのね。"}, {"t": 1993.2166666666667, "x": "テレビに映ったのは最後の一瞬だけだ。"}, {"t": 1995.6, "x": "だから見た人の数だけ、別の答えができた。"}, {"t": 1998.6, "x": "後藤田は言った。罪は罪、人は人。"}, {"t": 2001.2666666666667, "x": "裁判所は書いた。生命は尊厳である。"}, {"t": 2003.9333333333334, "x": "その2つの間で、撃つと決めた人たちがいたのね。"}, {"t": 2007.3166666666666, "x": "銃を手放す機会が男に\n何度あったかは、もう分からない。"}, {"t": 2010.8166666666666, "x": "残ったのは、撃たれて職場に戻れなかった\n警察官と、亡くなった20歳だ。"}, {"t": 2015.5333333333333, "x": "1970年5月13日、広島の宇品の桟橋。"}, {"t": 2019.5666666666666, "x": "今回はその75.5メートルの間に置かれた\n判断を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
