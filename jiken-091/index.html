<script>
const D={"name": "091", "file": "091_編集用", "dur": 2119.9, "segs": [], "subs": [{"t": 0.0, "x": "1952年、昭和27年4月9日の朝だ。"}, {"t": 3.8833333333333333, "x": "東京の羽田飛行場から、一機の旅客機が飛び立った。"}, {"t": 7.45, "x": "日本航空の、東京発福岡行き、第301便。"}, {"t": 11.033333333333333, "x": "機の名前を、もく星号という。"}, {"t": 12.95, "x": "離陸は、午前7時42分。"}, {"t": 15.233333333333333, "x": "朝いちばんの便なのね。"}, {"t": 16.866666666666667, "x": "そうだ。乗客が33名、乗員が4名。"}, {"t": 19.8, "x": "合わせて37名が乗っていた。"}, {"t": 21.966666666666665, "x": "15分後の午前7時57分、もく星号は\n千葉の館山の上空を通過したと報告している。"}, {"t": 27.8, "x": "そこまでは、記録がある。"}, {"t": 29.433333333333334, "x": "そのあと、この機からの連絡は途絶えた。"}, {"t": 32.05, "x": "……途絶えた？"}, {"t": 32.916666666666664, "x": "翌10日の朝、伊豆大島の三原山で見つかった。"}, {"t": 36.1, "x": "噴火口の東側、およそ1キロメートル。"}, {"t": 38.71666666666667, "x": "標高でいうと、およそ2,000フィートの地点だ。"}, {"t": 41.56666666666667, "x": "乗っていた37名は、全員が亡くなっていた。"}, {"t": 44.766666666666666, "x": "一人も。"}, {"t": 45.65, "x": "一人もだ。"}, {"t": 46.53333333333333, "x": "戦後の日本で、旅客機が落ちた最初の事故だ。"}, {"t": 49.55, "x": "占領が終わる、わずか3週間前のことでもある。"}, {"t": 52.6, "x": "そして、原因が決まらないまま終わった事故だ。"}, {"t": 55.5, "x": "決まらないまま、っていうのは？"}, {"t": 57.31666666666667, "x": "今日は、その意味だけを丁寧に追いかける。"}, {"t": 59.78333333333333, "x": "74年たった今も、国が持っている\n答えは「推定」の二文字なんだ。"}, {"t": 65.0, "x": "先に、この回で私が守ることを言っておく。"}, {"t": 67.86666666666666, "x": "一つ目。原因を決めつけない。"}, {"t": 69.91666666666667, "x": "この事故については、機長の側に理由を置く見方と、\n管制の側に理由を置く見方がある。"}, {"t": 75.21666666666667, "x": "私はそのどちらにも立たない。"}, {"t": 77.23333333333333, "x": "どちらかに寄せたほうが、話としては\n分かりやすいんじゃないの。"}, {"t": 80.95, "x": "分かりやすい。だが、政府自身が\n断定していないものを、私が\n断定するわけにはいかない。"}, {"t": 86.41666666666667, "x": "二つ目。当時の占領軍を悪者にする形では話さない。"}, {"t": 90.2, "x": "なぜ届かなかったのか、誰かが\n止めたのか。そこは記録に書かれていない。"}, {"t": 94.78333333333333, "x": "……推しはからない、ということね。"}, {"t": 96.71666666666667, "x": "そうだ。三つ目。撃墜されたという説も、\n謀略だったという説もあるが、触れない。"}, {"t": 101.98333333333333, "x": "四つ目。亡くなった方の名前を並べることはしない。"}, {"t": 105.05, "x": "墜落したときの様子も話さない。"}, {"t": 107.41666666666667, "x": "ええ。"}, {"t": 107.95, "x": "この回で使うのは、ほとんどが\n国会の会議録だ。誰でも読める。"}, {"t": 112.06666666666666, "x": "1952年の運輸大臣と航空庁長官が、国会で\n何と答えたか。それを順番に並べていく。"}, {"t": 119.26666666666667, "x": "本題に入る前に、当時の日本に\n何が無かったかを押さえておく。"}, {"t": 123.25, "x": "何が無かったの。"}, {"t": 124.56666666666666, "x": "ほとんど全部だ。"}, {"t": 125.68333333333334, "x": "1945年12月18日、連合国最高司令官から\n一通の覚書が出た。"}, {"t": 131.46666666666667, "x": "日本人の航空活動を禁止する、という中身だ。"}, {"t": 134.6, "x": "これによって、日本人は飛行機を持つことも、\n整備することも、飛ばすこともできなくなった。"}, {"t": 140.28333333333333, "x": "作ることも飛ばすことも、全部だめだったのね。"}, {"t": 143.36666666666667, "x": "全部だ。この状態が7年近く続いた。"}, {"t": 146.03333333333333, "x": "空白の7年と呼ばれる。"}, {"t": 147.8, "x": "1951年、その禁止がわずかに緩んだ。"}, {"t": 151.06666666666666, "x": "日本航空株式会社ができて、\nその年の10月25日から営業を始めた。"}, {"t": 156.1, "x": "ただし、日本側が担当できたのは営業だけだ。"}, {"t": 159.23333333333332, "x": "営業だけ。"}, {"t": 160.2, "x": "切符を売る。荷物を預かる。"}, {"t": 161.91666666666666, "x": "時刻表を作る。そこまでだ。"}, {"t": 164.01666666666668, "x": "飛行機はアメリカの\nノースウエスト航空のものを借りた。"}, {"t": 167.05, "x": "整備も運航も、そのノースウエストが、\n極東空軍の監督のもとで行う。"}, {"t": 171.75, "x": "のちに航空局長自身が、この体制を「不自然な\n形で、自主性のない形で」と国会で言っている。"}, {"t": 178.41666666666666, "x": "……お客さんから見たら、日本の飛行機よね。"}, {"t": 181.16666666666666, "x": "機体に日本航空と書いてあるからな。"}, {"t": 183.45, "x": "だが機体の国籍はアメリカで、\n操縦しているのもアメリカ人だった。"}, {"t": 187.56666666666666, "x": "そして、この時点で日本にはまだ航空法が無い。"}, {"t": 190.58333333333334, "x": "事故が起きたときに誰がどう\n調べるか、という決まりも無かった。"}, {"t": 194.85, "x": "では、飛行機が飛び立つとき、\n高さは誰が決めていたのか。"}, {"t": 198.53333333333333, "x": "ここがこの事故の芯になる。"}, {"t": 200.23333333333332, "x": "4月15日、村上義一 運輸大臣が\n国会で手順を説明している。"}, {"t": 204.95, "x": "まず中央気象台が、その日の気圧と\n雲の状態を図表に書き入れる。"}, {"t": 209.13333333333333, "x": "雲が何フィートから何フィートまで、\nどういう厚みで、どういう形か。"}, {"t": 213.15, "x": "それを口頭ではなく、図表にして機長に手渡す。"}, {"t": 216.33333333333334, "x": "紙で渡すのね。"}, {"t": 217.63333333333333, "x": "そうだ。機長はその図表を見て、自分が\n飛ぶ道を地図の上に線で書き込む。"}, {"t": 222.15, "x": "それをノースウエストの運航担当者に渡し、\n気象と道が合っているかを検討してもらう。"}, {"t": 227.28333333333333, "x": "二人の意見が一致してから、\n羽田の管制官に出して、認可をもらう。"}, {"t": 231.85, "x": "ずいぶん段取りが多いのね。"}, {"t": 233.55, "x": "多い。だが、ここに一つ、日本側に無いものがあった。"}, {"t": 237.03333333333333, "x": "5月7日、同じ大臣がこう説明している。"}, {"t": 240.0, "x": "機長が最後に届け出る相手は、\nコントローラーという役だ。"}, {"t": 243.4, "x": "そしてそのコントローラーは、\nジョンソン基地にいる極東空軍の技術官だった。"}, {"t": 248.03333333333333, "x": "日本の人じゃないのね。"}, {"t": 249.66666666666666, "x": "日本の人じゃない。"}, {"t": 250.9, "x": "羽田を出て、館山の上空、\n大島の上空を通って西へ向かう。"}, {"t": 254.76666666666668, "x": "道そのものは決まっている。"}, {"t": 256.5833333333333, "x": "決まっていないのは、高さだ。"}, {"t": 258.43333333333334, "x": "大臣はこう付け加えている。"}, {"t": 260.1666666666667, "x": "「必ずしもこの命令に従わぬでもよいのだということも\n聞くのでありますから、"}, {"t": 264.4166666666667, "x": "命令とは言えないかもしれませんが」"}, {"t": 266.48333333333335, "x": "「とにかくそういう指示はあるのであります」"}, {"t": 268.78333333333336, "x": "……命令とも言い切れない指示。"}, {"t": 270.46666666666664, "x": "ここを覚えておいてくれ。"}, {"t": 271.68333333333334, "x": "あとでもう一度出てくる。"}, {"t": 273.81666666666666, "x": "機体の話をする。"}, {"t": 275.1666666666667, "x": "もく星号は、アメリカ国籍のN93043号。"}, {"t": 278.81666666666666, "x": "マーチン202という型の双発のプロペラ機だ。"}, {"t": 281.9, "x": "この日、乗員は4名。うち\n2名は日本航空の社員だった。"}, {"t": 285.81666666666666, "x": "残りの2名は。"}, {"t": 287.05, "x": "操縦していた二人だ。"}, {"t": 288.55, "x": "機長はE・G・スチュワート、36歳。"}, {"t": 291.3, "x": "飛行時間は7,698時間49分。"}, {"t": 294.85, "x": "副操縦士はR・クレベンジャー、31歳。4,905時間。"}, {"t": 299.1666666666667, "x": "二人ともアメリカの定期航空運送操縦士の資格を\n持っていた。"}, {"t": 302.98333333333335, "x": "直前の1か月で、機長はこの路線を10回飛んでいる。"}, {"t": 306.56666666666666, "x": "初めての道ではなかったのね。"}, {"t": 308.65, "x": "初めてではない。ここも、あとで効いてくる。"}, {"t": 311.26666666666665, "x": "積んでいたものも記録に残っている。"}, {"t": 313.4, "x": "燃料が2,720キログラム。"}, {"t": 315.6166666666667, "x": "乗客と貨物と郵便物で2,607.4キログラム。"}, {"t": 319.5, "x": "離陸したときの重さは17トンから18トン。"}, {"t": 322.4166666666667, "x": "これは許される最大の重さの範囲内だった。"}, {"t": 325.1666666666667, "x": "前後の釣り合いが取れていたことも確認されている。"}, {"t": 328.2, "x": "重すぎたわけではない、と。"}, {"t": 330.0, "x": "そうだ。ここは調査でもはっきり否定されている。"}, {"t": 332.8, "x": "ただ、この機体には、あとで国会で\n問題にされた点が一つある。"}, {"t": 336.9166666666667, "x": "同じマーチン202が、アメリカで続けて\n事故を起こしていたことだ。"}, {"t": 340.8333333333333, "x": "大臣は、改造が命じられてその後は信用を\n回復している、と答えたうえで、こう付け加えた。"}, {"t": 346.56666666666666, "x": "「科学的にいって劣ったものだとは言えない」"}, {"t": 348.8666666666667, "x": "「ただ気持ちがよくないということは、\n常識的には私も痛感いたしております」"}, {"t": 353.73333333333335, "x": "……正直な言い方ね。"}, {"t": 355.71666666666664, "x": "離陸前、羽田の管制塔が\nもく星号に交通許可を出した。"}, {"t": 359.53333333333336, "x": "中身はこうだ。館山、大島を経由して大阪行き。"}, {"t": 362.76666666666665, "x": "飛行高度は6,000フィート。"}, {"t": 364.51666666666665, "x": "ただし館山を通過した\nあとの10分間は、高度2,000フィート。"}, {"t": 368.4, "x": "いったん低く飛ぶのね。"}, {"t": 370.0, "x": "そうだ。ところが、この許可はすぐに訂正された。"}, {"t": 373.05, "x": "訂正後はこうなる。羽田を出発した\nあとの10分間、高度2,000フィート。"}, {"t": 377.6, "x": "……館山を通過したあと、が、\n羽田を出たあと、に変わったのね。"}, {"t": 381.6, "x": "そこだけが変わった。たった一語の違いだ。"}, {"t": 384.26666666666665, "x": "低く飛ぶ10分間が、飛行の後ろから\n前に移動したことになる。"}, {"t": 388.25, "x": "機長はこの訂正を復唱して、離陸した。"}, {"t": 391.01666666666665, "x": "復唱した、と国会の記録に書いてある。"}, {"t": 393.8333333333333, "x": "じゃあ、伝わっていたのね。"}, {"t": 395.5833333333333, "x": "羽田の管制塔とのやり取りとしては、伝わっている。"}, {"t": 398.81666666666666, "x": "なぜ最初の10分だけ低く\n飛ばせたのかも、記録に理由がある。"}, {"t": 402.6666666666667, "x": "当時、アメリカ空軍の輸送機が1機、\n羽田の上空2,500フィートで空中待機していた。"}, {"t": 408.3833333333333, "x": "さらに、その付近をおよそ10機が飛んでいた。"}, {"t": 411.2, "x": "混んでいたのね。"}, {"t": 412.3333333333333, "x": "混んでいた。だから、もく星号を先に\nその下をくぐらせて、あとから上げる。"}, {"t": 416.8666666666667, "x": "普通なら離陸してすぐに高度を上げていくところを、\nこの日はそうしなかった。"}, {"t": 421.1, "x": "7時42分、もく星号は羽田を離陸した。"}, {"t": 424.81666666666666, "x": "離陸から15分後だ。"}, {"t": 426.31666666666666, "x": "午前7時57分、もく星号は館山の上空を\n通過したと報告している。"}, {"t": 431.1666666666667, "x": "中身は三つ。館山上空を通過した。"}, {"t": 433.65, "x": "高度は6,000フィート。"}, {"t": 434.93333333333334, "x": "午前8時7分に大島上空の予定。"}, {"t": 437.65, "x": "6,000フィートまで上がっていたのね。"}, {"t": 439.81666666666666, "x": "そう記録されている。"}, {"t": 441.0833333333333, "x": "この報告は、東京コントローラー宛のものだ。"}, {"t": 443.9, "x": "そして、8時7分に大島上空という\n予定は、実際には来なかった。"}, {"t": 448.3666666666667, "x": "館山の報告を最後に、\nもく星号からの連絡は途絶えた。"}, {"t": 452.2, "x": "……7時57分から、8時7分の予定まで。10分ね。"}, {"t": 456.23333333333335, "x": "のちに調査会が出した推定では、\n三原山の上空での高度は1,800から2,000フィート。"}, {"t": 461.73333333333335, "x": "6,000フィートって言っていたのに。"}, {"t": 463.75, "x": "そこだ。ここが、この事故が\n74年ほどけない理由の入口になる。"}, {"t": 468.0, "x": "高さが合わない。"}, {"t": 469.0833333333333, "x": "報告どおり6,000フィートで\n飛んでいたなら、三原山には当たらない。"}, {"t": 472.9, "x": "当たったということは、その高さでは\n飛んでいなかったことになる。"}, {"t": 476.65, "x": "じゃあ、報告が間違っていたの。"}, {"t": 478.8, "x": "そこを確かめるために、調査会は\n別の記録を突き合わせた。"}, {"t": 482.46666666666664, "x": "そして、その二つの記録は、食い違っていた。"}, {"t": 486.1333333333333, "x": "この章は、5月9日に村上大臣が国会で\n読み上げた報告をそのまま追う。"}, {"t": 491.01666666666665, "x": "一つ目の記録は、さっき言ったものだ。"}, {"t": 493.48333333333335, "x": "館山通過時の、航空機から\n東京コントローラーへの通信。"}, {"t": 497.0833333333333, "x": "午前7時57分、館山上空通過、高度6,000\nフィート、午前8時7分に大島上空の予定。"}, {"t": 503.7, "x": "二つ目の記録は、\n東京モニターというものが取っていた。"}, {"t": 507.18333333333334, "x": "モニター。"}, {"t": 507.96666666666664, "x": "管制のやり取りを、横で同時に聞いて\n控えておく仕組みだと思ってくれ。"}, {"t": 512.1666666666666, "x": "そのモニターの記録は、こうなっていた。"}, {"t": 514.5166666666667, "x": "午前7時55分、館山上空2,000フィート、計器飛行。"}, {"t": 518.3666666666667, "x": "館山の南方を10分間、高度2,000\nフィートを保持し、次いで上昇する。"}, {"t": 522.8166666666667, "x": "……時刻も違うし、高さも違うじゃない。"}, {"t": 525.35, "x": "時刻が2分違う。高さは3倍違う。"}, {"t": 528.0166666666667, "x": "そして、低く飛ぶ10分間の位置も、\n訂正前の内容に戻っている。"}, {"t": 532.35, "x": "この二つについて、大臣は国会でこう述べた。"}, {"t": 535.35, "x": "「いずれが真実であるか、その後の調査に\nよりましても決定しかねておる次第であります」"}, {"t": 540.4833333333333, "x": "決定しかねている。"}, {"t": 541.8833333333333, "x": "どちらが本当だったのか、調査会は\n最後まで決められなかった。"}, {"t": 545.6833333333333, "x": "ここが「原因が決まらなかった」ということの、\nいちばん具体的な中身になる。"}, {"t": 550.45, "x": "計器飛行というのは、外がまったく\n見えない中を計器だけで飛ぶことだ。"}, {"t": 554.7, "x": "外が見えないから、高さの指示だけが頼りになる。"}, {"t": 557.9166666666666, "x": "その頼りの記録が、二つあって、食い違っていたのね。"}, {"t": 562.0666666666667, "x": "連絡が途絶えて、捜索が始まった。"}, {"t": 564.6166666666667, "x": "政府は米国極東空軍、国家地方警察、\nそのほか関係する各方面に協力を求めた。"}, {"t": 570.6, "x": "海上保安庁の巡視艇が出た。"}, {"t": 572.4666666666667, "x": "付近を航行している船にも連絡した。"}, {"t": 575.0666666666667, "x": "それでも機影は見つからない。"}, {"t": 576.7, "x": "大臣の言葉では「不安、焦慮のうちに\n一夜を徹した」となっている。"}, {"t": 581.0833333333334, "x": "その日の天気はどうだったの。"}, {"t": 582.9833333333333, "x": "悪かった。中央気象台の午前6時の観測が\n記録に残っている。"}, {"t": 587.2166666666667, "x": "紀伊半島の沖に低気圧があって、関東、\n中部、近畿、それに四国の東部は雨。"}, {"t": 592.4666666666667, "x": "東京地方の雲の底は1,500フィート。"}, {"t": 595.05, "x": "そして1,500フィートから15,000\nフィートまでが、びっしりと雲だった。"}, {"t": 599.4666666666667, "x": "1万3,500フィートぶん、ずっと雲の中ってこと。"}, {"t": 602.9666666666667, "x": "そうだ。しかも、そのときの視界は、\n自分の飛行機の両翼がやっと\n見える程度だったとされている。"}, {"t": 608.85, "x": "この日は朝から強風特報も出ていた。"}, {"t": 611.2666666666667, "x": "それでも、飛べない天気ではなかった。"}, {"t": 613.55, "x": "この点は航空庁長官がはっきり答えている。"}, {"t": 616.3666666666667, "x": "大阪を7時半に出た便が、東京に9時に着いている。"}, {"t": 619.75, "x": "もく星号が落ちたとみられる時刻の1時間後には、\n上り便が大島の上を通過している。"}, {"t": 625.05, "x": "……もく星号だけが、帰ってこなかったのね。"}, {"t": 627.7666666666667, "x": "そういうことになる。"}, {"t": 628.9333333333333, "x": "この雲の厚さは、このあとの話にもう一度出てくる。"}, {"t": 632.25, "x": "上から見ても、地上のものが何も\n見えない。それがこの日の空だった。"}, {"t": 637.0333333333333, "x": "そして、その日の午後だ。"}, {"t": 638.75, "x": "全国に、ある情報が流れた。"}, {"t": 640.85, "x": "遭難した人は全員救助された、という内容だ。"}, {"t": 644.15, "x": "……全員。"}, {"t": 644.8666666666667, "x": "全員だ。この話は、うわさとして\n広まっただけではない。"}, {"t": 648.4833333333333, "x": "日本航空会社の責任者から、一応は発表されている。"}, {"t": 652.0, "x": "運輸大臣が国会で認めた事実だ。"}, {"t": 654.5333333333333, "x": "新聞とラジオが、これを全国に流した。"}, {"t": 657.3333333333334, "x": "それ、ご家族はどうなるの。"}, {"t": 659.2, "x": "喜んで、そして翌朝に、逆のことを知らされる。"}, {"t": 662.4333333333333, "x": "国会では「悲喜こもごも至る」という\n言い方で何度も取り上げられた。"}, {"t": 666.4833333333333, "x": "では、この情報はどこから出たのか。"}, {"t": 668.7166666666667, "x": "5月9日、村上大臣が国会で\nその経路を説明している。順に追う。"}, {"t": 673.5, "x": "まず、名古屋の飛行場から飛び立った軍用機があった。"}, {"t": 676.7333333333333, "x": "その機が、浜松の南およそ10マイルの海上に、\n機の翼が浮いているのを認めたと報告した。"}, {"t": 682.7166666666667, "x": "報告先は小牧飛行場だ。"}, {"t": 684.8, "x": "翼が、浮いていた。"}, {"t": 686.3666666666667, "x": "ここから先が、推論の連鎖になる。"}, {"t": 688.7833333333333, "x": "もし墜落したのなら、海に入ると\n同時に飛行機は粉々になるはずだ。"}, {"t": 693.1666666666666, "x": "ところが翼が浮いている。ということは、\n意図して着水したのではないか。"}, {"t": 697.5, "x": "意図して着水したのなら、\n2時間から3時間は浮いていられる。"}, {"t": 701.3, "x": "その報告を受けた極東空軍は、すぐに動いた。"}, {"t": 704.45, "x": "近くを航行していたアメリカの掃海艇2隻と、\n1万2千トンほどのアメリカ籍の貨物船に、"}, {"t": 710.1333333333333, "x": "救助の協力を電報で求めた。"}, {"t": 712.35, "x": "ここまでは、実際にあったことだと大臣は述べている。"}, {"t": 715.6833333333333, "x": "……船まで動いたのなら、助かったと思うわよね。"}, {"t": 718.6833333333333, "x": "そして、極東空軍のある人が、日本航空会社に\n「全員助かっている」と報告した。"}, {"t": 724.5, "x": "大臣の言葉では、これが誤報の起点だ。"}, {"t": 727.15, "x": "私が言えるのはここまでだ。"}, {"t": 728.8833333333333, "x": "誰が悪かったのか、意図があったのか。\nそこは会議録に書かれていない。"}, {"t": 733.1166666666667, "x": "書かれていないことは、話さない。"}, {"t": 735.7833333333333, "x": "ただ、この情報を信じていなかった人たちがいた。"}, {"t": 738.9666666666667, "x": "誰。"}, {"t": 739.6, "x": "運輸省だ。"}, {"t": 740.4333333333333, "x": "大臣はこう考えた。海上で救助があったのなら、\n海上保安庁も出動している。"}, {"t": 745.4833333333333, "x": "保安庁の巡視船が確認できるはずだ。"}, {"t": 747.8833333333333, "x": "現場に急行する命令も出してある。"}, {"t": 750.1666666666666, "x": "そこで大臣は、海上保安庁に何度も問い合わせた。"}, {"t": 753.4, "x": "返ってきた答えは、そのたびに同じだった。"}, {"t": 756.15, "x": "確認できぬ。"}, {"t": 757.3333333333334, "x": "……ずっと。"}, {"t": 758.0833333333334, "x": "終始一貫、確認できぬ、だ。"}, {"t": 760.1166666666667, "x": "大臣自身がそう国会で言っている。"}, {"t": 762.3666666666667, "x": "だから運輸省は、この情報に\n最後まで疑いを持っていた。"}, {"t": 765.8666666666667, "x": "それでも、訂正はすぐには出ていない。"}, {"t": 768.1, "x": "一方で、こういうこともあった。"}, {"t": 770.0, "x": "亡くなった方の中に、八幡製鉄の社長だった\n三鬼隆さんがおられた。"}, {"t": 774.5333333333333, "x": "八幡製鉄には、日本航空にその情報を出した\nGHQの人と個人的に親しい方がいて、直接尋ねた。"}, {"t": 781.7, "x": "返ってきたのは、乗っている人は\nすべて安全だ、という答えだった。"}, {"t": 785.85, "x": "直接聞いても、そうだったのね。"}, {"t": 788.1333333333333, "x": "そうだ。だから誰も、この情報を崩せなかった。"}, {"t": 791.2, "x": "では、この誤報のせいで捜索が遅れたのか。"}, {"t": 793.95, "x": "ここは慎重に言う。\n大臣は、遅れたのではない、と答えている。"}, {"t": 797.8166666666667, "x": "理由は前の章で話した雲だ。"}, {"t": 799.8333333333334, "x": "この情報が嘘だと早く分かっていても、\n予備の日航機が三原山の上を通過していても。"}, {"t": 805.1166666666667, "x": "残骸を見つけることは、しょせん不可能だっただろう。"}, {"t": 808.0, "x": "大臣はそう述べている。"}, {"t": 809.6166666666667, "x": "……見つからなかったのは、雲のせいだったと。"}, {"t": 812.2666666666667, "x": "政府はそう説明した。"}, {"t": 813.6666666666666, "x": "私はそれを、政府の説明として置いておく。"}, {"t": 816.5666666666667, "x": "ここを「誤報のせいだった」と\n断定する材料は、私は持っていない。"}, {"t": 821.4166666666666, "x": "4月10日。"}, {"t": 822.3833333333333, "x": "午前5時半、日本航空の捜索機が羽田を出発した。"}, {"t": 826.1166666666667, "x": "そして午前8時32分、捜索航空機が残骸を発見した。"}, {"t": 830.35, "x": "場所は大島三原山の東側。"}, {"t": 832.3833333333333, "x": "東経139度48分、北緯34度12分の地点だ。"}, {"t": 836.8666666666667, "x": "別の言い方をすると、三原山の噴火口の東側およそ1\nキロメートル、標高およそ2,000フィート。"}, {"t": 842.9833333333333, "x": "……噴火口の、すぐそばね。"}, {"t": 844.85, "x": "すぐそばだ。"}, {"t": 845.7166666666667, "x": "現場は、御神火茶屋というところから\n6キロほど入った場所にある。"}, {"t": 849.5666666666667, "x": "発見の知らせを受けて、大島の国警の捜索隊、\n消防が現地に向かった。"}, {"t": 854.4, "x": "アメリカ空軍からも飛行機が出て、\n海上保安庁の救助艇も向かった。"}, {"t": 858.7, "x": "そして現地の警察本部から報告が上がる。"}, {"t": 861.4666666666667, "x": "乗客と乗員、全員の死亡が確認された。"}, {"t": 864.5333333333333, "x": "……37名。"}, {"t": 865.7166666666667, "x": "37名だ。"}, {"t": 866.9, "x": "現場の作業は、大島の国警と消防、\nそれに元村と近くの方々の力で行われた。"}, {"t": 872.65, "x": "大臣はその働きに、国会で感謝の言葉を述べている。"}, {"t": 876.2333333333333, "x": "ここから先の様子は、話さない。"}, {"t": 878.5666666666667, "x": "ええ。"}, {"t": 879.1166666666667, "x": "一つだけ、記録の食い違いに触れておく。"}, {"t": 881.7666666666667, "x": "4月15日の第一報では、発見は\n午前8時50分と報告されていた。"}, {"t": 886.6, "x": "5月9日の結論報告では、午前8時32分になっている。"}, {"t": 890.7833333333333, "x": "私はあとの数字を採った。"}, {"t": 892.7166666666667, "x": "最初の報告と、あとの報告で違うのね。"}, {"t": 895.6333333333333, "x": "この事故は、そういう小さな食い違いが\nいくつも残っている。"}, {"t": 899.05, "x": "そして、いちばん大きな食い違いが、\nさっきの二つの記録だ。"}, {"t": 903.5, "x": "政府は、遭難機が見つかるとすぐに\n航空庁の係官を現地へ送った。"}, {"t": 907.9333333333333, "x": "現場をそのまま保存させるためだ。"}, {"t": 910.05, "x": "そして4月14日、運輸省の中に\n航空事故調査会が置かれ、第一回の会議が開かれた。"}, {"t": 916.0666666666667, "x": "事故から5日後ね。"}, {"t": 917.5, "x": "早い。ただし、これは常設の組織ではない。"}, {"t": 920.3333333333334, "x": "事故が起きたから、そのつど人を\n集めて作った臨時の調査会だ。"}, {"t": 924.3666666666667, "x": "顔ぶれは9人。5月9日に航空庁長官が\n国会で読み上げている。"}, {"t": 928.7333333333333, "x": "会長は、航空庁長官の大庭哲夫。"}, {"t": 931.2166666666667, "x": "気象の担当として、気象台長。"}, {"t": 933.5166666666667, "x": "無線の担当として、電波監理委員会の長谷という方。"}, {"t": 937.0166666666667, "x": "装備の担当として、疋田という方。"}, {"t": 939.55, "x": "この疋田という方は、昔、海軍で\n事故調査の主任をしていた人だ。"}, {"t": 944.2, "x": "経験者ね。"}, {"t": 945.2833333333333, "x": "そうだ。機体の担当が小川太一郎さん。"}, {"t": 947.7166666666667, "x": "発動機の担当が小川清二さん。"}, {"t": 949.9166666666666, "x": "運航と操縦の担当が中尾さん。この方は、\n昔ニッポン号に乗って世界を一周している。"}, {"t": 955.4166666666666, "x": "これに幹事が2人。合わせて9人だ。"}, {"t": 957.85, "x": "現場の調査には、航空庁の調査課長の市川という\n人と、専門の技術者6名ほどが入った。"}, {"t": 964.1333333333333, "x": "日本人だけなのね。"}, {"t": 965.65, "x": "そこも国会で聞かれた。次の章で話す。"}, {"t": 968.45, "x": "先に、日本航空と\nノースウエストとの関係だけ言っておく。"}, {"t": 972.05, "x": "調査会は、両社から資料を出させ、\n責任者を呼んで説明も聞いている。"}, {"t": 976.4833333333333, "x": "だが、結論については両社と\n何の打ち合わせもしていない。"}, {"t": 979.9, "x": "調査会が独自の判定で下した。"}, {"t": 982.0166666666667, "x": "長官はそう答えている。"}, {"t": 984.2166666666667, "x": "5月9日の委員会で、江崎一治という\n委員が調査会の顔ぶれを問題にした。"}, {"t": 989.2666666666667, "x": "アメリカ側に遠慮しなければならない立場の人が\n多すぎるのではないか、という指摘だ。"}, {"t": 994.3333333333334, "x": "それに対する村上大臣の答えが、この回の中で\nいちばん重い一つだと私は思っている。"}, {"t": 1000.0333333333333, "x": "どんな答えだったの。"}, {"t": 1001.4833333333333, "x": "大臣はこう明かした。"}, {"t": 1002.8833333333333, "x": "実は、ある人からこういう忠告を\n受けていた、というのだ。"}, {"t": 1006.4166666666666, "x": "ジョンソン基地のコントローラーは\nアメリカ空軍に属する人だ。"}, {"t": 1009.85, "x": "その方面の原因も調べなければならないのだから、\nその監督者も調査会に加えたらどうか。"}, {"t": 1015.5333333333333, "x": "管制の側の人を、調べる側に入れるってこと。"}, {"t": 1018.6666666666666, "x": "そういう忠告だ。大臣はこれを採らなかった。"}, {"t": 1021.5, "x": "理由はこうだ。必要なら、\nその部分についてのみ資料を出してもらう。"}, {"t": 1025.6333333333334, "x": "あるいは意見を聞く。それで足りる。"}, {"t": 1027.5166666666667, "x": "全面的に加わってもらう必要はない。"}, {"t": 1030.0666666666666, "x": "そういう見解をとって、\n日本人だけで委員会を構成した。"}, {"t": 1033.7666666666667, "x": "……筋は通っているわね。"}, {"t": 1035.3, "x": "筋は通っている。ただし、\nこの判断には裏返しがある。"}, {"t": 1038.7166666666667, "x": "調べる側の中に、管制の記録を持っている\n人が、一人もいなくなったということだ。"}, {"t": 1043.8666666666666, "x": "資料を出してもらうしかない。"}, {"t": 1045.5333333333333, "x": "そしてこのとき、資料を出させる\n権限は、日本側にはまだ無かった。"}, {"t": 1049.7666666666667, "x": "委員会からは、こういう注文も出ていた。"}, {"t": 1052.2166666666667, "x": "原因の探求は日本側に一任するという話になっている。"}, {"t": 1055.8666666666666, "x": "ならばアメリカ側に多少とも気がねすることなく、\n徹底的にメスを加えてほしい。"}, {"t": 1060.5833333333333, "x": "遭難した方々の霊に報いるために、と。"}, {"t": 1063.4333333333334, "x": "……わざわざ言わなきゃいけない空気だったのね。"}, {"t": 1066.4166666666667, "x": "時間を少し戻す。4月15日の衆議院運輸委員会だ。"}, {"t": 1070.2333333333333, "x": "この日、村上大臣が事故の第一報を国会で行った。"}, {"t": 1073.9333333333334, "x": "離陸の時刻、通過報告、\n発見の状況、調査会を設けたこと。"}, {"t": 1078.4, "x": "そして「事故の性質上、真相を明白にするには\n若干の時間を要する」と述べている。"}, {"t": 1083.8833333333334, "x": "そのあと、委員から質問が続いた。"}, {"t": 1086.1, "x": "高度計、ビーコン、機種、責任の所在。"}, {"t": 1088.9333333333334, "x": "その中で、坪内八郎という委員が、\nあの誤報について質した。"}, {"t": 1093.1, "x": "全員救助の話ね。"}, {"t": 1094.7833333333333, "x": "そうだ。委員の言葉はこうだ。"}, {"t": 1096.6833333333334, "x": "事故の遭難者は全員生きているのだという\nニュースが、まことしやかに報道された。"}, {"t": 1101.3166666666666, "x": "その間違ったニュースは、\nどういう経路で報道されたのか。"}, {"t": 1104.5666666666666, "x": "国民としてもそういう不謹慎な\nニュースは心外にたえない。"}, {"t": 1107.9166666666667, "x": "この際そこもはっきりさせて、\n国民を納得させることが必要だ。"}, {"t": 1112.2166666666667, "x": "まっとうな質問じゃない。"}, {"t": 1113.8, "x": "まっとうだ。そして、この質問に\n対する答えは、会議録に無い。"}, {"t": 1118.0666666666666, "x": "……無い。"}, {"t": 1118.6166666666666, "x": "この質問の直後、委員長がこう言っている。"}, {"t": 1121.3333333333333, "x": "「ちょっと速記をとめて」"}, {"t": 1122.7333333333333, "x": "そのあと、かっこ書きで\n「速記中止」とだけ書いてある。"}, {"t": 1126.2166666666667, "x": "次の行で委員長が「それでは速記を始めて」と\n言い、議論は別の話題に移っている。"}, {"t": 1131.65, "x": "……間に何があったのか、残っていないのね。"}, {"t": 1134.4166666666667, "x": "残っていない。私が言えるのは、そこまでだ。"}, {"t": 1137.3, "x": "なぜ止めたのか。何を話したのか。"}, {"t": 1139.5, "x": "記録が無い以上、私は推測しない。"}, {"t": 1142.0333333333333, "x": "この誤報の経路が国会で説明されるのは、\n3週間以上あとの5月9日になる。"}, {"t": 1147.1833333333334, "x": "さっき話した、翼が浮いていた、という話だ。"}, {"t": 1150.95, "x": "現場から回収されたものの話をする。"}, {"t": 1153.45, "x": "もく星号には高度計が2つ付いていた。"}, {"t": 1155.9333333333334, "x": "1つは機長側の計器盤に、もう\n1つは副操縦士側の計器盤に。"}, {"t": 1160.3666666666666, "x": "2つとも気圧高度計で、\nベンディックスという会社が作ったものだ。"}, {"t": 1164.55, "x": "気圧で高さを測るのね。"}, {"t": 1166.3833333333334, "x": "そうだ。空気の薄さから高さを割り出す。"}, {"t": 1168.9833333333333, "x": "この2つが、現場でいくつを指していたか。"}, {"t": 1171.6333333333334, "x": "一方が5,670フィート。もう一方は、短い\n針だけが残っていて8,000フィート。"}, {"t": 1177.2166666666667, "x": "……えっ。落ちた場所は2,000フィートなんでしょう。"}, {"t": 1179.75, "x": "そうだ。どちらも、三原山より\nはるかに高い数字を指していた。"}, {"t": 1183.6166666666666, "x": "ここは国会でも突っ込まれた。"}, {"t": 1185.4666666666667, "x": "航空庁長官の説明はこうだ。"}, {"t": 1187.5666666666666, "x": "現場から元村まで持って下りる間に、"}, {"t": 1189.7666666666667, "x": "5,670フィートを指していたものが\n7,000フィートに変わった。"}, {"t": 1193.8666666666666, "x": "運んでいる間に動いたの。"}, {"t": 1195.7166666666667, "x": "動いた。さらに分解してみると、\n機械としても壊れていた。"}, {"t": 1199.45, "x": "だから、この指し示す数字は\n衝撃によるものだと判定した。"}, {"t": 1203.2666666666667, "x": "この判定に、江崎委員は納得しなかった。"}, {"t": 1206.0833333333333, "x": "衝撃で狂うなら、高いほうにずれるか\n低いほうにずれるかは、五分五分のはずだ。"}, {"t": 1210.7166666666667, "x": "それなのに2つとも、かけ離れて高いほうを\n指していた。そこが不審だ、と。"}, {"t": 1215.4333333333334, "x": "長官の答えは、担当官が詳細に調べた結果が\nその判定なので、その判定に待つほかない、だった。"}, {"t": 1222.0333333333333, "x": "……押し問答になったのね。"}, {"t": 1223.6666666666667, "x": "なった。もう一つ、委員が持ち出したものがある。"}, {"t": 1226.4833333333333, "x": "4月13日の新聞記事だ。"}, {"t": 1228.6666666666667, "x": "現場からおよそ2キロ手前の場所で、島の人が\n機体の破片らしきものを見つけて届け出た。"}, {"t": 1234.2333333333333, "x": "確認したところ、最大で\n2尺四方のジュラルミンの破片が数個あったという。"}, {"t": 1238.9166666666667, "x": "委員は、これも調査に入れるのかと尋ねている。"}, {"t": 1241.6166666666666, "x": "ただしこれは、委員が新聞記事を読み上げたものだ。"}, {"t": 1244.4833333333333, "x": "政府が確認した事実ではない。"}, {"t": 1246.6166666666666, "x": "私はここを、それ以上には広げない。"}, {"t": 1249.6166666666666, "x": "5月7日。事故から約1か月がたっていた。"}, {"t": 1252.6333333333334, "x": "この日の朝刊に、各紙が大きな見出しを出した。"}, {"t": 1255.6833333333334, "x": "もく星号惨事の原因わかる、という趣旨の見出しだ。"}, {"t": 1258.8666666666666, "x": "中身は、機体にも計器にも異常はなく、\n機長の重大な過失だった、というものだった。"}, {"t": 1264.3333333333333, "x": "……発表されたの。"}, {"t": 1265.6, "x": "されていない。そこが問題になった。"}, {"t": 1267.85, "x": "同じ日の衆議院運輸委員会で、\n坪内委員がこれを質した。"}, {"t": 1271.55, "x": "委員会では慎重に扱ってきたのに、\nなぜ新聞に出るのか。"}, {"t": 1275.2333333333333, "x": "出るということは原因が\n分かっているのではないか。ならば\nこの場で言ってほしい、と。"}, {"t": 1279.8, "x": "村上大臣の答えを、順に追う。"}, {"t": 1282.05, "x": "まず、航空庁として正式な発表は\n何もしていない。まだその段階に達していない。"}, {"t": 1287.2333333333333, "x": "ただ、新聞の記事は真相からそうかけ離れてもいない。"}, {"t": 1290.6166666666666, "x": "委員か関係の事務員から\n漏れたのではないかと思っている、と。"}, {"t": 1294.1333333333334, "x": "大体こういうことが判明してきたのは、10日ほど前だ。"}, {"t": 1297.6666666666667, "x": "じゃあ、もう分かっていたのね。"}, {"t": 1299.4833333333333, "x": "ほぼ分かっていた。だが、大臣はここで、こう続けた。"}, {"t": 1302.95, "x": "「しかしながらなお極東空軍から提供を願う\n資料の提供がまだ願えない部分があるのであります」"}, {"t": 1308.4666666666667, "x": "「この資料の提供を督促もし、実は鶴首して\n待っておるというような次第であります」"}, {"t": 1313.4333333333334, "x": "鶴首というのは、首を長くして待つ、という意味だ。"}, {"t": 1316.6166666666666, "x": "そして、こう言った。"}, {"t": 1317.95, "x": "「この貴重なかぎとも申すべき\n資料が提供されなければ、結論は\n出て来ないはずであります」"}, {"t": 1323.1666666666667, "x": "「今日までのところ、まだこの資料が\n委員会の手に入らないような次第であります」"}, {"t": 1327.7, "x": "……かぎ。"}, {"t": 1328.8166666666666, "x": "この「かぎ」という言葉に、江崎委員が食いついた。"}, {"t": 1331.9666666666667, "x": "極東空軍がこの事件を解くかぎを\n握っている、それは一体どういうことか。"}, {"t": 1336.4166666666667, "x": "大臣の答えはこうだ。"}, {"t": 1337.9, "x": "事故の原因として調べる事項が10あると\n仮定する。そのうち9つまでは判明している。"}, {"t": 1343.2333333333333, "x": "残りの1つが明確になれば、全貌が\nはっきりする。そういう意味でかぎと言った。"}, {"t": 1348.1666666666667, "x": "じゃあ、その1つって何なの。"}, {"t": 1350.2166666666667, "x": "江崎委員も同じことを聞いた。そして大臣が説明した。"}, {"t": 1353.7333333333333, "x": "機長が最後に届け出るのは、ジョンソン基地にいる\n極東空軍の技術官、コントローラーだ。"}, {"t": 1359.1166666666666, "x": "道は決まっている。決まっていないのは高度だ。"}, {"t": 1361.8, "x": "その高度の指示を、機長はジョンソン基地から受ける。"}, {"t": 1364.75, "x": "そして大臣は、こう続けた。"}, {"t": 1366.7333333333333, "x": "「この指示をすると同時に、タイプ・\nレコードにこれが入って来るのであります」"}, {"t": 1371.0, "x": "「そうして一定の指示を与えた後は封印をして\n保存する、こういうことになっておるようであります」"}, {"t": 1376.35, "x": "……指示が、そのまま記録に残る仕組みなのね。"}, {"t": 1379.25, "x": "そして封印される。あとから\n書き換えられない形で保存される。"}, {"t": 1382.9666666666667, "x": "つまり、この日どの高度が指示されたのか、\nその記録は存在している。"}, {"t": 1387.15, "x": "食い違っていた二つの記録の、どちらが\n本当かを決められる可能性のある一点だ。"}, {"t": 1392.05, "x": "大臣の最後の一言はこうだ。"}, {"t": 1394.1, "x": "「このタイプ・レコードの提供を\n希望いたしておるのでありますが、それがまだ"}, {"t": 1398.2666666666667, "x": "提供されない、こういうことなのであります」"}, {"t": 1400.7166666666667, "x": "……まだ提供されない。"}, {"t": 1402.05, "x": "5月7日の時点で、届いていなかった。"}, {"t": 1404.6833333333334, "x": "私が言えるのは、ここまでだ。"}, {"t": 1406.6333333333334, "x": "なぜ届かなかったのかは、会議録に書かれていない。"}, {"t": 1409.7333333333333, "x": "そのあと届いたのかどうかも、\n会議録に書かれていない。"}, {"t": 1413.5833333333333, "x": "5月9日。5月7日の、2日後だ。"}, {"t": 1416.5333333333333, "x": "村上大臣が衆議院運輸委員会で、\n調査会の結論を報告した。"}, {"t": 1420.85, "x": "冒頭で大臣はこう言っている。"}, {"t": 1422.5, "x": "「ようやくにして昨日その調査の結論を得ました」"}, {"t": 1425.5666666666666, "x": "昨日……8日ね。"}, {"t": 1426.9166666666667, "x": "4月14日に始まって、5月8日に結論。3週間と少しだ。"}, {"t": 1431.4666666666667, "x": "報告は、順に否定していく形になっている。"}, {"t": 1434.4333333333334, "x": "機体は、空中分解ではない。"}, {"t": 1436.2666666666667, "x": "斜面にやや上向きの姿勢で当たった痕が残っている。"}, {"t": 1439.4, "x": "操縦できなくなって落ちたとも考えられない。"}, {"t": 1442.0833333333333, "x": "発動機は両方とも故障なし。"}, {"t": 1443.9333333333334, "x": "プロペラの痕から、速度は時速およそ200マイル。"}, {"t": 1447.0, "x": "巡航速度で飛んでいた。"}, {"t": 1448.75, "x": "空中で火が出た形跡もない。"}, {"t": 1450.5, "x": "消火器がまったく使われていなかった。"}, {"t": 1452.9, "x": "無線機は最後まで通信できる状態だった。"}, {"t": 1455.5833333333333, "x": "方向探知機は、大島と\n焼津の無線標識に合わせてあった。"}, {"t": 1459.2, "x": "電源にも異常はない。"}, {"t": 1460.65, "x": "無線標識も、羽田、館山、大島、\n焼津のすべてが正常に動いていた。"}, {"t": 1465.8166666666666, "x": "……全部、異常なし。"}, {"t": 1467.2333333333333, "x": "そのうえで、結論の部分だ。"}, {"t": 1469.0, "x": "私はここを、言葉を変えずに読む。"}, {"t": 1471.2833333333333, "x": "「以上述べましたことを総合いたしますと、"}, {"t": 1473.5333333333333, "x": "機体がこなごなに大破し、かつ乗客並びに乗員が\n全員死亡しましたために、直接原因を確認することは"}, {"t": 1480.1333333333334, "x": "困難でありますが」"}, {"t": 1481.4166666666667, "x": "「詳細な調査の結果から、"}, {"t": 1483.0333333333333, "x": "操縦者が航法上何らかの錯誤を起して、\n計器飛行のために、いわゆる盲目飛行のために」"}, {"t": 1488.8166666666666, "x": "「その航空路に規定されている最低高度"}, {"t": 1491.1, "x": "以下を飛行したため、このような悲惨な\n事故を惹起したと推定するのが、"}, {"t": 1495.1166666666666, "x": "最も妥当な見方であるという結論に\n到達いたした次第であります」"}, {"t": 1499.4333333333334, "x": "……推定するのが、最も妥当な見方。"}, {"t": 1502.05, "x": "断定していない。"}, {"t": 1503.1666666666667, "x": "直接原因を確認することは\n困難である、と先に書いてある。"}, {"t": 1507.1, "x": "そのうえで、いちばんありそうな見方は\nこれだ、と述べている。"}, {"t": 1510.4666666666667, "x": "この形が、74年たっても変わっていない。"}, {"t": 1514.05, "x": "この結論には、もう一つ大事な段落がある。"}, {"t": 1517.0, "x": "管制官と機長の責任の分け方について書いた部分だ。"}, {"t": 1520.5, "x": "大臣はまず、\nアメリカの航空法での管制官の責任を説明する。"}, {"t": 1524.7333333333333, "x": "計器飛行をしている飛行機どうし、\nそして飛行機と障害物がぶつからないように、"}, {"t": 1529.35, "x": "機長に交通許可を与えること。"}, {"t": 1531.4666666666667, "x": "一方で、機長には、交通許可の訂正を\n求める権限も、拒否する権限もある。"}, {"t": 1536.5, "x": "だから機長には、その指示が適切か\nどうかを判断する責務がある。"}, {"t": 1540.7166666666667, "x": "どちらにも役目がある、ということね。"}, {"t": 1543.1, "x": "そうだ。そのうえで、この一文が来る。"}, {"t": 1545.5166666666667, "x": "仮にモニターの記録のほうが正しく、かつ管制官が\n機長の錯誤に注意を促さなかったとしても。"}, {"t": 1551.5333333333333, "x": "それは操縦士の航法の錯誤を\n生じさせた間接原因にはなり得ても、\n事故の直接の原因にはなり得ない。"}, {"t": 1557.9666666666667, "x": "……管制の側は、直接の原因ではない、と。"}, {"t": 1560.9333333333334, "x": "そう書いてある。ここは読み方が難しいところだ。"}, {"t": 1563.8833333333334, "x": "管制の側の関与を否定してはいない。"}, {"t": 1566.0333333333333, "x": "間接原因にはなり得る、と書いてある。"}, {"t": 1568.4833333333333, "x": "だが、直接の原因にはならない、と線を引いた。"}, {"t": 1571.6333333333334, "x": "この報告のあと、5月15日の委員会で\n江崎委員が反論している。"}, {"t": 1575.8666666666666, "x": "報告は、機長が数千時間の経験者で、\nこの航空路も十数回飛んでいると書いている。"}, {"t": 1581.2333333333333, "x": "失速や横滑りを起こすような\n未熟者ではない、とも書いてある。"}, {"t": 1585.0, "x": "ところが結論では、誤って2,000フィートほどで\n三原山の上空を飛んだことが原因だという。"}, {"t": 1590.4166666666667, "x": "あれだけの機長が、三原山の高さを\n知らないはずがない。これは矛盾ではないか、と。"}, {"t": 1595.4166666666667, "x": "委員はこう言っている。"}, {"t": 1596.45, "x": "「どうもわれわれから考えますと、あの事故は\n死人に口なしというような感じがするのです」"}, {"t": 1601.6666666666667, "x": "……反論できる人が、もういないのね。"}, {"t": 1604.0166666666667, "x": "委員はこうも言った。"}, {"t": 1605.05, "x": "彼が生きていたら、この結論に強く\n反発するのではないかとさえ感じられる、と。"}, {"t": 1610.1166666666666, "x": "私は、この委員が正しいとも、\n大臣が正しいとも言わない。"}, {"t": 1613.8666666666666, "x": "ただ、こういうやり取りがあったという\n事実を置いておく。"}, {"t": 1617.4166666666667, "x": "ここからは、この事故のあとに日本が\n何を作っていったかを見ていく。"}, {"t": 1621.3333333333333, "x": "まず航空法だ。"}, {"t": 1622.4833333333333, "x": "事故の1か月後、1952年5月8日に\n航空法案が国会に提出された。"}, {"t": 1627.95, "x": "講和条約に合わせて準備されていたもので、\n事故を受けて作ったものではない。"}, {"t": 1632.3333333333333, "x": "だが、法案を説明する場で、\n航空庁長官はもく星号に触れている。"}, {"t": 1636.6333333333334, "x": "「特に最近のもく星号の遭難はきわめて遺憾な\n事例でありまして、今後再びかかることのないよう」"}, {"t": 1642.5333333333333, "x": "「運輸省といたしましては航空機の安全性の確保には\n万全を期する所存でございます」"}, {"t": 1647.7, "x": "法律に、事故の調査は入ったの。"}, {"t": 1650.1166666666666, "x": "入った。第9章の雑則に、\n事故原因の調査が置かれた。"}, {"t": 1653.9666666666667, "x": "航空事故があったときは、航空庁長官は遅滞なく\nその原因を調査しなければならない、という条文だ。"}, {"t": 1660.1166666666666, "x": "次が管制だ。1952年6月、\n日米合同委員会で合意書が交わされた。"}, {"t": 1665.5666666666666, "x": "日本は自国の空に完全かつ排他的な主権を\n持つ。これはそのとおり書かれている。"}, {"t": 1670.5666666666666, "x": "ただし、航空交通管制組織の管理は、\n在日米軍が持つ。"}, {"t": 1674.8, "x": "……主権はある、でも管制はよそが持つ。"}, {"t": 1677.3, "x": "そういう形だ。そして、いつ\n返ってくるかも書かれていた。"}, {"t": 1680.9333333333334, "x": "日本政府が国際的な基準に従って適当な管制業務を\n提供できると、双方が認めたときに移管する。"}, {"t": 1687.7333333333333, "x": "実際に移ったのは、1959年7月だ。"}, {"t": 1691.2833333333333, "x": "一部の米軍基地内の管制を除いて、\n航空交通管制の業務が米軍から日本に移った。"}, {"t": 1696.9833333333333, "x": "……事故から7年ね。"}, {"t": 1698.4333333333334, "x": "7年だ。もく星号の高度を決めていた\n役目が、日本側に来るまでに7年かかった。"}, {"t": 1703.7166666666667, "x": "もう一つ、時間がかかったものがある。"}, {"t": 1705.9666666666667, "x": "事故を調べる組織だ。"}, {"t": 1708.1666666666667, "x": "もく星号のときの調査会は、事故が\n起きてから人を集めた臨時のものだった。"}, {"t": 1712.85, "x": "この方式が21年続いた。"}, {"t": 1715.1166666666666, "x": "21年も。"}, {"t": 1716.3333333333333, "x": "1973年、\n運輸大臣の新谷寅三郎が、ある法案の提案理由を\n国会で説明している。"}, {"t": 1722.8, "x": "航空事故調査委員会設置法案だ。\nその説明の中に、こういう一節がある。"}, {"t": 1727.6333333333334, "x": "「現在のところ、大規模な"}, {"t": 1729.3666666666666, "x": "航空事故が発生した場合には、そのつど"}, {"t": 1731.7833333333333, "x": "民間有識者からなる調査団を編成して\n航空事故の原因について調査を行なっておりますが」"}, {"t": 1737.2166666666667, "x": "「このような調査体制には、"}, {"t": 1738.7333333333333, "x": "調査をすみやかに開始することが困難であること、"}, {"t": 1741.6166666666666, "x": "平素から調査の実施につき十分な準備を\n整えておくことができないこと等の制約があります」"}, {"t": 1747.4, "x": "……それ、もく星号のやり方そのものじゃない。"}, {"t": 1750.0833333333333, "x": "そのものだ。21年後に、国が\n自分でその弱点を言葉にした。"}, {"t": 1754.4, "x": "そして、常設の委員会を作ることになった。"}, {"t": 1757.3, "x": "この法律で委員会に与えられた\n権限のうち、二つを挙げておく。"}, {"t": 1761.2, "x": "一つ目。委員会は、事故の関係者から\n報告を取り、現場に立ち入って検査できる。"}, {"t": 1766.4166666666667, "x": "そして、事故に関係のある\n物件の提出を求めることができる。"}, {"t": 1770.5, "x": "……物件の、提出を求める。"}, {"t": 1772.5833333333333, "x": "1952年には、その権限が法律に無かった。だから、\n鶴首して待つ、という言葉になった。"}, {"t": 1779.15, "x": "二つ目。委員会は、調査を終えたら報告書を作り、\n大臣に出すとともに、公表しなければならない。"}, {"t": 1785.4333333333334, "x": "もく星号のときは、義務じゃなかったのね。"}, {"t": 1788.05, "x": "義務ではなかった。大臣が国会で\n口頭で報告して、それで終わっている。"}, {"t": 1792.55, "x": "報告書そのものが世に出た\n形跡を、私は確認できていない。"}, {"t": 1796.4666666666667, "x": "この二つの違いが、次の章につながる。"}, {"t": 1799.75, "x": "ここから、この事故がそのあと\n国会でどう語られてきたかを見る。"}, {"t": 1803.4666666666667, "x": "3回だけ取り上げる。"}, {"t": 1804.7166666666667, "x": "1958年、1971年、2019年だ。"}, {"t": 1809.2, "x": "まず1958年10月8日、参議院の決算委員会。"}, {"t": 1813.2666666666667, "x": "別の航空事故をめぐる質疑の中で、もく星号のことを\n聞かれた運輸省の航空局長が、こう答えている。"}, {"t": 1819.7166666666667, "x": "「私、ここに今その資料を持っておりませんので、\n記憶でたいへん失礼でございますが」"}, {"t": 1824.85, "x": "……資料を持っていない。"}, {"t": 1826.1666666666667, "x": "6年半後の政府の答弁だ。そして中身はこうだ。"}, {"t": 1829.45, "x": "当時、管制の面において高度の指示が訂正された。"}, {"t": 1832.6833333333334, "x": "それがパイロットにおいて\n十分に感得されなかったのか。"}, {"t": 1835.9333333333334, "x": "あるいは、されても前の指示に\n固執して、つい失敗をしたのか。"}, {"t": 1839.8, "x": "そういった面が推定されているように\n聞いております、と。"}, {"t": 1842.9666666666667, "x": "そして、こう付け足している。"}, {"t": 1844.7833333333333, "x": "「何を申しましても、"}, {"t": 1845.9666666666667, "x": "当時占領時代でもございましたし、\n正確なる点につきましては"}, {"t": 1849.8333333333333, "x": "私ここで詳しく御答弁できないのでございます」"}, {"t": 1852.8, "x": "……6年たっても、詳しく答えられないのね。"}, {"t": 1855.5833333333333, "x": "次が1971年7月23日、\n衆議院の交通安全対策特別委員会だ。"}, {"t": 1861.6666666666667, "x": "別の航空事故のあと、ある委員が\n航空行政そのものを問い詰めた。"}, {"t": 1865.6666666666667, "x": "事故のたびに、原因は不明か、\nパイロットのミスとされる。これは\n結果としては好都合である。"}, {"t": 1871.1666666666667, "x": "亡くなった方には、死人に口なし。"}, {"t": 1873.5333333333333, "x": "「原因不明、そしてパイロットのミス、\nそのようなことが、"}, {"t": 1876.85, "x": "27年のもく星号事件以来今日まで続いておりまして、\nどうもすっきりしないわけであります」"}, {"t": 1882.5166666666667, "x": "19年たっても、まだ同じことを言っているのね。"}, {"t": 1886.1666666666667, "x": "最後が2019年6月12日、衆議院の国土交通委員会だ。"}, {"t": 1890.6833333333334, "x": "津村啓介という議員が、もく星号を取り上げた。"}, {"t": 1893.7333333333333, "x": "資料その他、まだ原因が非常に不透明だと\n言われている事故である、と述べたうえで。"}, {"t": 1898.5333333333333, "x": "国土交通省はこの事故の原因を\nどう認識しているかと質した。"}, {"t": 1902.5833333333333, "x": "67年後の質問ね。"}, {"t": 1904.5666666666666, "x": "答えたのは、当時の国土交通大臣、石井啓一だ。"}, {"t": 1908.05, "x": "この答弁を、言葉を変えずに読む。"}, {"t": 1910.2, "x": "「もく星号事故につきましては、\n航空事故調査委員会設立前の事故であり、\n記録が残されておりませんが」"}, {"t": 1916.6333333333334, "x": "……記録が、残されていない。"}, {"t": 1918.4833333333333, "x": "続きがある。"}, {"t": 1919.35, "x": "「当時の国会の議事録によりますと、\n事故原因及び飛行の状況につきましては」"}, {"t": 1924.2666666666667, "x": "「飛行中、同機の操縦者が\n航法上何らかの錯誤を起こして、"}, {"t": 1927.95, "x": "航空路に規定をされている\n最低安全高度以下を飛行したことにより」"}, {"t": 1931.9833333333333, "x": "「大島三原山の山腹に衝突したものと\n推定をされております」"}, {"t": 1936.1, "x": "……1952年の答弁と、ほとんど同じ文章じゃない。"}, {"t": 1939.8666666666666, "x": "ほとんど同じだ。それもそのはずで、\n根拠がその答弁そのものなんだ。"}, {"t": 1944.1166666666666, "x": "2019年の国が持っていたのは、報告書ではない。"}, {"t": 1947.3666666666666, "x": "当時の国会の議事録だ。"}, {"t": 1949.15, "x": "この回で私が読み上げてきたものと、\n同じものを読んでいる。"}, {"t": 1952.8, "x": "……報告書は、どこにもないの。"}, {"t": 1954.8166666666666, "x": "少なくとも国は持っていない、と国会で答えている。"}, {"t": 1958.05, "x": "運輸安全委員会の報告書の一覧にも、\nこの事故は入っていない。"}, {"t": 1962.0333333333333, "x": "どこかに現物があるのかどうかは、\n私には確認できなかった。"}, {"t": 1966.5666666666666, "x": "整理する。"}, {"t": 1967.3666666666666, "x": "1952年4月9日、午前7時42分、\nもく星号が羽田を離陸した。"}, {"t": 1973.0166666666667, "x": "離陸前の交通許可は、低く飛ぶ10分間が、\n館山のあとから羽田のあとへ訂正されていた。"}, {"t": 1978.9, "x": "午前7時57分、館山上空、高度6,000\nフィートという報告が記録に残った。"}, {"t": 1984.2833333333333, "x": "モニターの記録には、7時55分、\n館山上空2,000フィートと残っていた。"}, {"t": 1989.0333333333333, "x": "この二つのどちらが本当かは、決められなかった。"}, {"t": 1992.1, "x": "翌10日の午前8時32分、三原山で残骸が見つかった。"}, {"t": 1996.0333333333333, "x": "37名全員が亡くなっていた。"}, {"t": 1998.4333333333334, "x": "5月7日、運輸大臣は、かぎとなる記録が\nまだ提供されないと国会で述べた。"}, {"t": 2003.4833333333333, "x": "その2日後、調査会の結論が報告された。"}, {"t": 2006.4166666666667, "x": "言葉は「推定するのが最も妥当な見方」。"}, {"t": 2009.4166666666667, "x": "そして2019年、国は\n「記録が残されておりません」と答えた。"}, {"t": 2013.9, "x": "……74年たって、まだ推定のままなのね。"}, {"t": 2016.8333333333333, "x": "推定のままだ。"}, {"t": 2017.95, "x": "私は、この事故の原因を言い当てることはできない。"}, {"t": 2020.9666666666667, "x": "村上大臣自身が、こういうことを言っている。"}, {"t": 2023.7166666666667, "x": "交通事故の真因を見つけるのは至難である。"}, {"t": 2026.1666666666667, "x": "多くの場合は複合原因だ。"}, {"t": 2028.05, "x": "4つなら4つの原因が競合して事故が起きる。\nそのうち1つが無ければ、こうはならなかった。"}, {"t": 2033.7166666666667, "x": "そういうことが多いのだ、と。"}, {"t": 2035.5666666666666, "x": "……1つに決めること自体が、\n無理だったのかもしれないのね。"}, {"t": 2039.15, "x": "そうかもしれない。"}, {"t": 2040.2166666666667, "x": "ただ、一つだけ言えることがある。"}, {"t": 2042.3, "x": "あの日、決められなかったのは、\n記録が足りなかったからだ。"}, {"t": 2045.7833333333333, "x": "そして、記録を出させる仕組みも、記録を\n公表させる仕組みも、当時の日本には無かった。"}, {"t": 2051.3333333333335, "x": "それを作るのに、7年と、21年かかった。"}, {"t": 2054.5833333333335, "x": "出典を挙げておく。"}, {"t": 2055.85, "x": "この回の事実はほぼすべて、\n国立国会図書館の国会会議録検索システムから\n取っている。"}, {"t": 2061.8166666666666, "x": "1952年4月15日、5月7日、5月9日、\n5月15日の衆議院運輸委員会と、"}, {"t": 2068.366666666667, "x": "同じ4月15日の衆議院本会議。"}, {"t": 2071.0, "x": "1958年10月8日の参議院決算委員会、\n1971年7月23日の衆議院交通安全対策特別委員会。"}, {"t": 2080.0333333333333, "x": "1973年の航空事故調査委員会設置法案の提案理由、\nそして2019年6月12日の"}, {"t": 2086.45, "x": "衆議院国土交通委員会。"}, {"t": 2088.5333333333333, "x": "確認したものと、確認できなかったものの一覧は、\nリサーチのファイルに全部残してある。"}, {"t": 2094.0, "x": "最後に、一つだけ。"}, {"t": 2095.5333333333333, "x": "この回で私が何度も「言えない」と\n言ったのは、逃げているからじゃない。"}, {"t": 2099.7, "x": "あの日の国会で、大臣自身が、10のうち\n9つまでしか言えないと言った。"}, {"t": 2104.2833333333333, "x": "その1つを持っていなかったからだ。"}, {"t": 2106.4333333333334, "x": "持っていないものを持っているふりをしたら、\n37名の記録は、そこで嘘になる。"}, {"t": 2111.366666666667, "x": "……だから「推定」のままで残したのね。"}, {"t": 2114.0666666666666, "x": "私はそう受け取っている。"}, {"t": 2115.633333333333, "x": "この事故について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
