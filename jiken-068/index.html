<script>
const D={"name": "068", "file": "068_編集用", "dur": 2023.7333125, "segs": [], "subs": [{"t": 0.0, "x": "一九四九年七月十五日、午後九時二十三分。"}, {"t": 3.9166666666666665, "x": "東京の三鷹駅の構内で、誰も\n乗っていない電車が動き出した。"}, {"t": 7.916666666666667, "x": "国会の記録では、この事件は「無人電車轢殺事件」\n「暴走電車の事件」と呼ばれている。"}, {"t": 13.8, "x": "六人が亡くなった。十八人が重軽傷を負った。"}, {"t": 17.1, "x": "誰も乗っていない電車が？"}, {"t": 18.833333333333332, "x": "ああ。運転する人が乗っていない\n電車が、走り出した。"}, {"t": 22.283333333333335, "x": "この事件で九人が起訴された。"}, {"t": 24.333333333333332, "x": "そのうち一人が、一審で無期懲役。控訴審で死刑。"}, {"t": 27.866666666666667, "x": "最高裁の大法廷で上告が\n棄却されて、死刑が確定した。"}, {"t": 31.933333333333334, "x": "その人は再審を求めたまま、\n一九六七年一月十八日の朝、獄中で亡くなった。"}, {"t": 38.4, "x": "獄中で。"}, {"t": 39.36666666666667, "x": "ああ。だから、刑は執行されていない。"}, {"t": 41.71666666666667, "x": "先に断っておく。この回では、\n有罪か無罪かを私は決めない。"}, {"t": 45.86666666666667, "x": "確定した判決があることは事実として話す。"}, {"t": 48.88333333333333, "x": "だが、その人を指して「犯人」という言葉を使わない。"}, {"t": 52.5, "x": "一人でやったのか、\n複数だったのかも、私は決めない。"}, {"t": 56.11666666666667, "x": "亡くなった六人と、けがをした\n十八人については、数字だけを話す。"}, {"t": 60.53333333333333, "x": "どういう亡くなり方をしたかは話さない。"}, {"t": 62.7, "x": "ご遺族がおられる。"}, {"t": 63.9, "x": "それから、この事件は当時の労働運動や\n政治の対立と結びつけて語られてきた。"}, {"t": 68.98333333333333, "x": "私はどちらの側にも味方しない。"}, {"t": 71.16666666666667, "x": "使うのは、国会会議録に\n残っている質問と答弁だけだ。"}, {"t": 75.01666666666667, "x": "この事件で「三鷹事件」を検索すると、\n二百七十三件の発言が出てくる。"}, {"t": 80.26666666666667, "x": "一九四九年から一九七〇年まで、\n二十年以上にわたって国会で問われ続けた事件だ。"}, {"t": 86.75, "x": "その記録だけを頼りに、この七十六年をたどる。"}, {"t": 90.56666666666666, "x": "まず、この数字がどこから来ているかを言っておく。"}, {"t": 93.36666666666666, "x": "一九四九年八月二十四日、衆議院の地方行政委員会。"}, {"t": 97.95, "x": "運輸省の担当者が、列車妨害の統計を報告している。"}, {"t": 101.56666666666666, "x": "その中に、この一文がある。"}, {"t": 103.5, "x": "「三鷹事件は御承知のように六人の死者と\n重軽傷者十八名を出しております」"}, {"t": 108.25, "x": "「最も甚大な被害を見ているような次第でございます」"}, {"t": 111.51666666666667, "x": "この年でいちばん大きかったのね。"}, {"t": 113.66666666666667, "x": "ああ。この年、列車妨害という\n事件が異常な数で起きていた。"}, {"t": 117.46666666666667, "x": "同じ報告から数字を拾う。"}, {"t": 119.35, "x": "前の年度は、月に百二十件から百五十件程度だった。"}, {"t": 123.16666666666667, "x": "ところが一九四九年は、五月が二百六十四件。"}, {"t": 127.06666666666666, "x": "六月が五百十七件。"}, {"t": 128.8, "x": "そして七月が、千五百四十二件。"}, {"t": 131.56666666666666, "x": "千五百件？　一か月で？"}, {"t": 133.5, "x": "ああ。一日で八十件という日もあった。七月七日だ。"}, {"t": 137.28333333333333, "x": "中身も報告されている。"}, {"t": 138.9, "x": "「七月分では線路に石を並置したものは、\n全体の件数の五七％七分を示しております」"}, {"t": 145.0, "x": "投石から、線路に石を並べる方向に\n変わっていた、という説明だ。"}, {"t": 149.28333333333333, "x": "犯人が捕まったのは、\n千五百四十二件のうち二百七十四件。"}, {"t": 153.65, "x": "割合にすると一七・六パーセントだ。"}, {"t": 156.16666666666666, "x": "被害は、脱線が六件。"}, {"t": 157.75, "x": "車両の破損が百十件。"}, {"t": 159.55, "x": "そして、その中で最も\n大きかったのが三鷹の事件だった。"}, {"t": 163.43333333333334, "x": "数の中に埋もれていた\n事件じゃなくて、突出していたのね。"}, {"t": 167.28333333333333, "x": "そうだ。だから国会でも、\nこの事件だけが名前で呼ばれている。"}, {"t": 171.05, "x": "ちなみに、この年の一月からの列車妨害は、\n全国で千六百七十八件と報告されている。"}, {"t": 177.15, "x": "検挙できたのが四百五十八件。"}, {"t": 179.21666666666667, "x": "逮捕された人が六百五十八人だ。"}, {"t": 182.43333333333334, "x": "一九四九年という年に、何が起きていたのか。"}, {"t": 186.01666666666668, "x": "一九四九年八月二十四日、\n国家地方警察本部長官の説明を読む。"}, {"t": 191.48333333333332, "x": "「国鉄の人員整理を皮切りといたしました\n官公庁の人員整理問題に端を発しまして」"}, {"t": 196.95, "x": "「六月の初めにおける国電ストから引続きまして」"}, {"t": 200.36666666666667, "x": "「いろいろの世間を騒がせるような\n事件が起きたのであります」"}, {"t": 203.78333333333333, "x": "人員整理。"}, {"t": 204.81666666666666, "x": "ああ。国鉄が大量に人を辞めさせようとしていた。"}, {"t": 207.9, "x": "どれくらいの規模かは、運輸省の説明から分かる。"}, {"t": 210.91666666666666, "x": "国鉄は七月十三日に退職者を\n援護する委員会をつくった。"}, {"t": 214.98333333333332, "x": "八月二十二日の時点で、\n再就職できた人が二万七千人ほど。"}, {"t": 219.58333333333334, "x": "辞めた人の数は、それより多い。"}, {"t": 221.7, "x": "この夏、鉄道をめぐって\n三つの大きな事件が続けて起きている。"}, {"t": 225.65, "x": "七月、国鉄の総裁が行方不明になり、\n亡くなって見つかった。下山事件だ。"}, {"t": 231.0, "x": "七月十五日、三鷹事件。"}, {"t": 233.11666666666667, "x": "そして八月、福島県で列車が\n脱線転覆した。松川事件だ。"}, {"t": 237.9, "x": "一か月半で三つも？"}, {"t": 239.56666666666666, "x": "ああ。八月二十四日の答弁では、\n松川はまだこう言われている。"}, {"t": 243.6, "x": "「福島県の金谷川、松川の中間に\nおける鉄道事故でありますが」"}, {"t": 247.98333333333332, "x": "「これはただいま捜査中でありまして、まだ\n逮捕検挙というところには参つておりません」"}, {"t": 252.76666666666668, "x": "捜査の体制も、事件ごとに違っていた。"}, {"t": 255.48333333333332, "x": "一九四九年七月二十五日、\n同じ長官がこう説明している。"}, {"t": 260.23333333333335, "x": "「下山事件は警視庁がもつぱら\n検察庁と協力してやつております」"}, {"t": 264.48333333333335, "x": "「三鷹事件の方は応援の要請を\n受けまして、国警が主になりまして」"}, {"t": 268.7, "x": "「自治体警察と検察庁と一緒になつてやつております」"}, {"t": 272.21666666666664, "x": "国警と自治体警察。"}, {"t": 273.96666666666664, "x": "当時は、いまの警察の形とは違う。"}, {"t": 276.4166666666667, "x": "国の警察と、市町村の警察が別にあった。"}, {"t": 279.6666666666667, "x": "三鷹駅は、三鷹町警察署という\n自治体の警察の管轄だった。"}, {"t": 284.01666666666665, "x": "規模の小さい署が、いきなり\nこの事件を受け持つことになった。"}, {"t": 287.6333333333333, "x": "同じ夏の別の事件では、逮捕が百五十人、\n起訴が百二人という報告もある。"}, {"t": 292.68333333333334, "x": "それだけ大きな事件が、いくつも\n同時に動いていた年だった。"}, {"t": 297.01666666666665, "x": "その夜、現場で何が起きていたか。"}, {"t": 299.3333333333333, "x": "一九四九年九月二十日、衆議院法務委員会で、\n警察と検察が捜査経過を報告している。"}, {"t": 305.95, "x": "まず警察側の説明だ。"}, {"t": 307.71666666666664, "x": "「所轄署でありまする三鷹町警察署の署長は、\n事故発生後とりあえず関係方面に連絡をとつた」"}, {"t": 313.8, "x": "「のでありまするが、事故のために\n電話がなかなかかからない。"}, {"t": 317.0, "x": "不通の状態でありまして」"}, {"t": 318.85, "x": "電話が使えなかったの？"}, {"t": 320.53333333333336, "x": "ああ。事故そのもので、回線が使えなくなっていた。"}, {"t": 323.73333333333335, "x": "近くにあった国警の支署から\n連絡をとった、と説明されている。"}, {"t": 327.68333333333334, "x": "国警の本部に連絡が届いたのが、午後十時ごろ。"}, {"t": 330.9166666666667, "x": "捜査員が現場に着いたのが、十一時近く。"}, {"t": 333.8, "x": "刑事部長が現場に入ったのが、午前零時近く。"}, {"t": 336.9166666666667, "x": "検察の側は、もっと大変だ。"}, {"t": 339.1333333333333, "x": "連絡が武蔵野の区検察庁に\n届いたのが、午後十時ごろ。"}, {"t": 342.8666666666667, "x": "そこから八王子支部に届いたのが、午後十時半ごろ。"}, {"t": 346.18333333333334, "x": "理由も説明されている。"}, {"t": 347.6, "x": "当時、検察庁から連絡するには\n交換台を四つ経由する必要があった。"}, {"t": 352.3666666666667, "x": "「どこか一つ話中であればもう通じない」"}, {"t": 355.01666666666665, "x": "三十分かかったのね。"}, {"t": 356.68333333333334, "x": "そうだ。そして、そこからさらに時間がかかる。"}, {"t": 359.68333333333334, "x": "「八王子支部には古い車でありますが、\n一台配置しております」"}, {"t": 363.6, "x": "「が、運転手の宿舎がないために、\n運転手がいない。それで車が動かせない」"}, {"t": 368.56666666666666, "x": "運転手がいない？"}, {"t": 369.81666666666666, "x": "ああ。刑務所に車を借りる交渉をして、\n鉄道の管理部にも頼んでいる。"}, {"t": 374.1333333333333, "x": "検事が現場に着いたのは、午後十一時四十分ごろ。"}, {"t": 377.4, "x": "そして、この一文が続く。"}, {"t": 379.3333333333333, "x": "「新聞社の車はすでに十時ごろには\n現場に到着しているのでありまして」"}, {"t": 383.5833333333333, "x": "「検事はよほど遅れて行つたというような\n状況であつたのであります」"}, {"t": 387.0833333333333, "x": "現場に着いてからも、うまくいかなかった。"}, {"t": 389.6166666666667, "x": "同じ日の検察側の説明を読む。"}, {"t": 391.8833333333333, "x": "「停電して現場は非常にくらい」"}, {"t": 393.8, "x": "「それで結局正確な現場検証も意のごとくならず、\n翌日にまわすということになつた」"}, {"t": 399.18333333333334, "x": "夜のうちに記録できなかったの？"}, {"t": 401.31666666666666, "x": "ああ。夜のうちに現場を記録することができなかった。"}, {"t": 404.5, "x": "そのあと、こう続く。"}, {"t": 405.96666666666664, "x": "「ああいう事件になりますと、\n大勢の者が現場に参りますから」"}, {"t": 409.6, "x": "「警察官としては立入らないようには\n努めておりますけれども」"}, {"t": 413.15, "x": "「どうしても現場がこわれる結果になります」"}, {"t": 415.6166666666667, "x": "これは、批判した議員の言葉ではない。"}, {"t": 417.8833333333333, "x": "捜査した側が自分で述べていることだ。"}, {"t": 420.35, "x": "そのうえで、こう要望している。"}, {"t": 422.18333333333334, "x": "「とにかく夜ただちに現場に\nかけつけて照明の設備もあつて」"}, {"t": 425.8, "x": "「時を移さず検証、現場の保存をやるというような\n設備がなかつたならば」"}, {"t": 429.98333333333335, "x": "「新しい訴訟法のもとでは捜査がなかなか\n困難であるというように考えられる」"}, {"t": 434.56666666666666, "x": "設備が足りなかった。"}, {"t": 436.1, "x": "ああ。当時の警察の力についても、\n長官が同じことを言っている。"}, {"t": 440.21666666666664, "x": "一九四九年八月二十四日の発言だ。"}, {"t": 443.6333333333333, "x": "「私は警察がもつと科学的な捜査の方法、\n施設でありますとか、あるいは機動力でありますとか」"}, {"t": 449.78333333333336, "x": "「警察力がもつと充実、向上しておるならば、\nもつと早く片づくであろう」"}, {"t": 454.5, "x": "そして、こう続けている。"}, {"t": 456.18333333333334, "x": "「また場合によつては事故が\n起らなくても済むかもしれない」"}, {"t": 459.3333333333333, "x": "翌七月十六日の早朝、合同捜査本部が置かれた。"}, {"t": 463.03333333333336, "x": "場所は国警の武蔵野市署。"}, {"t": 464.71666666666664, "x": "三鷹署はまだ仮の庁舎だったからだ。"}, {"t": 467.15, "x": "人員は、五十人から六十人。"}, {"t": 469.96666666666664, "x": "最初に決めなければならないことがあった。"}, {"t": 472.35, "x": "誰かが動かしたのか。それとも、勝手に動いたのか。"}, {"t": 475.76666666666665, "x": "警察側の説明を読む。"}, {"t": 477.48333333333335, "x": "「当初におきまして、事件がはたして\n人為的のものであるかどうかということも研究された」"}, {"t": 482.7, "x": "「のでありますが、一応事件は\n人為的なものであるという結論を得ました」"}, {"t": 487.06666666666666, "x": "いつ決めたの？"}, {"t": 488.1333333333333, "x": "検察側の答弁では、七月十六日だ。"}, {"t": 491.01666666666665, "x": "事故の翌日にあたる。"}, {"t": 492.5833333333333, "x": "そして、その結論から次の判断が出てくる。"}, {"t": 495.6, "x": "「人為的であるならば犯人はどうであるか」"}, {"t": 498.01666666666665, "x": "「少くとも電車の知識なり、現場に\n密接な関連を有する者ではないか」"}, {"t": 502.65, "x": "「というふうに判断をいたしまして、\n根本的な捜査に乗出したのであります」"}, {"t": 507.2, "x": "電車を知っている人。"}, {"t": 508.75, "x": "ああ。ここで捜査の範囲が、\n電車区の人たちに絞られる。"}, {"t": 512.2833333333333, "x": "では、その「人為的だ」という判断は誰がしたのか。"}, {"t": 515.85, "x": "これも国会で聞かれている。"}, {"t": 517.4, "x": "検察側はこう答えている。"}, {"t": 519.2333333333333, "x": "「人は知りませんが、鉄道の係員に\n命じて最初やらせまして」"}, {"t": 523.1666666666666, "x": "「後にたしか高速度交通営団であつたと\n思いますが、第三者に正式に鑑定を依頼しまして」"}, {"t": 528.9166666666666, "x": "「鑑定書ができております」"}, {"t": 530.5666666666667, "x": "最初は鉄道の中の人が調べた。"}, {"t": 532.7833333333333, "x": "あとで外の組織に頼んだ、という説明だ。"}, {"t": 535.6833333333333, "x": "そして、同じ検事が、こんなことも述べている。"}, {"t": 538.65, "x": "「どうも捜査機関の鑑定機関で鑑定したのでは」"}, {"t": 541.6666666666666, "x": "「同じ結論が出ても色めがねで見られるというような\n疑念が私はあると思う」"}, {"t": 546.0333333333333, "x": "捜査した側が鑑定もすると、疑われる。"}, {"t": 548.9, "x": "ああ。捜査した側が、自分でそう言っている。"}, {"t": 551.65, "x": "この検事は、鑑定をする機関は捜査機関と\n別にあったほうがいい、とも述べている。"}, {"t": 556.4833333333333, "x": "昔の刑事訴訟法では、裁判所が鑑定を\n命じる形だった、という説明も付けている。"}, {"t": 562.6666666666666, "x": "起訴された人数は、記録の中で二回出てくる。"}, {"t": 565.6333333333333, "x": "一九四九年八月二十四日、国警本部長官の説明。"}, {"t": 570.1833333333333, "x": "「三鷹事件は御承知の通り\n昨日七名が起訴になりまして、\n合計八名起訴ということになつております」"}, {"t": 576.25, "x": "「またただいま\n逮捕せんといたしておりますのが一名あります」"}, {"t": 579.6, "x": "そして九月二十日、検察側の報告。"}, {"t": 582.3333333333334, "x": "「今日までのところ九名をこの事件の容疑者として\n東京八王子支部は起訴をして」"}, {"t": 587.0, "x": "「その後東京地方裁判所で公判に\n付することに大体決定した」"}, {"t": 591.15, "x": "九人も？"}, {"t": 592.0833333333334, "x": "ああ。一人の事件として始まったのではない。"}, {"t": 594.8166666666667, "x": "この人数が、あとで大きな意味を持つ。"}, {"t": 597.1333333333333, "x": "取り調べのやり方についても、国会で追及されている。"}, {"t": 600.5666666666667, "x": "一九四九年九月二十日、ある議員はこう述べている。"}, {"t": 604.3333333333334, "x": "「検察当局の調べ方をみますと、\nいわゆる民同派と称する人たちの調べは」"}, {"t": 609.25, "x": "「ほとんど全部身柄を拘束して調べておらない」"}, {"t": 612.0, "x": "「共産党員並びに共産党員と目される\n人々は身柄を拘束して調べておる」"}, {"t": 617.05, "x": "所属で扱いが違った、という指摘ね。"}, {"t": 619.8166666666667, "x": "そういう主張だ。私はこの主張の当否を決めない。"}, {"t": 622.9666666666667, "x": "ただ、同じ委員会で検察側はこうも答えている。"}, {"t": 626.1166666666667, "x": "死刑が確定することになる\nその人物について、聞かれてこう答えた。"}, {"t": 630.3166666666667, "x": "「竹内被告が共産党に入党していないと思います」"}, {"t": 633.6, "x": "つまり、党員ではなかった、と\n検察が国会で述べている。"}, {"t": 637.1833333333333, "x": "ここは、記録として押さえておいてほしい。"}, {"t": 640.2, "x": "一九四九年十一月十九日、衆議院法務委員会。"}, {"t": 644.3166666666667, "x": "ある議員が、拷問という言葉を出している。"}, {"t": 646.8333333333334, "x": "「特に憲法が禁止しているところの拷問の問題」"}, {"t": 649.8666666666667, "x": "「これは現在三鷹事件におきまして、非常に\nこれが問題になつているのであります」"}, {"t": 654.7666666666667, "x": "拷問？"}, {"t": 655.5, "x": "ああ。実際に、検察官が告訴されていた。"}, {"t": 658.4666666666667, "x": "議員は、こう続けている。"}, {"t": 660.1, "x": "「その告訴された人々を調べた\n高検の検事の話によると」"}, {"t": 663.9666666666667, "x": "「被害者を調べてみたが、\n被害意識がないというようなことを言つている」"}, {"t": 667.9166666666666, "x": "そして、拷問とは何かについて、こう述べている。"}, {"t": 671.0, "x": "「なぐつたり、ひつぱたいたり、そうすると\nこれはもちろん拷問でありますが」"}, {"t": 675.2166666666667, "x": "「しかしながら人権思想の普及発達に\n伴つて、そういう有形的な暴力だけでなくて」"}, {"t": 680.6333333333333, "x": "「実際身体を拘束したり、\nそれから読書をさせなかつたり」"}, {"t": 684.3, "x": "「あるいは言葉の上で死刑だとか\n無期だとかいうようなことでおどかしたり」"}, {"t": 688.2666666666667, "x": "殴らなくても拷問だ、という考え方。"}, {"t": 691.0, "x": "そういう主張だ。"}, {"t": 692.1, "x": "一方、政府側の答えはこうだ。"}, {"t": 694.25, "x": "「三鷹事件の取調べは、\n現在裁判進行中でありますが」"}, {"t": 698.0666666666667, "x": "「すでに法務総裁が、あの問題については\n検察官に不法はないということを」"}, {"t": 702.6, "x": "「当国会においても言明されておるのでありますから」"}, {"t": 705.5833333333334, "x": "「この具体的問題については、私からは\n何ら触れるつもりはございません」"}, {"t": 710.05, "x": "不法はない。"}, {"t": 711.0166666666667, "x": "ああ。政府はそう言明していた。"}, {"t": 713.0333333333333, "x": "私は、どちらが正しかったかを決めない。"}, {"t": 715.65, "x": "この二つの発言が、同じ日の同じ委員会に\n並んでいる。それが記録だ。"}, {"t": 720.9, "x": "裁判の結果を、記録の範囲で並べる。"}, {"t": 723.4666666666667, "x": "一審の判断について、後年、参考人として\n呼ばれた弁護士が国会でこう述べている。"}, {"t": 728.7333333333333, "x": "一九五五年七月十四日、参議院法務委員会だ。"}, {"t": 732.6833333333333, "x": "「三鷹事件には大きな争点が二つあります。"}, {"t": 735.3166666666667, "x": "一つは、刑法の百二十五条の問題です」"}, {"t": 738.3166666666667, "x": "「あの無人電車を走らせたこと」"}, {"t": 740.3, "x": "そして、一審の認定について、こう言っている。"}, {"t": 743.2333333333333, "x": "「あの場合に竹内景助は、あれを走らせてそして人を\n殺そうなんていうことは毛頭考えていない」"}, {"t": 748.9333333333333, "x": "「原判決の、あれは\n一審判決の認定からいたしましても」"}, {"t": 752.7, "x": "「決してそのものに殺意があるか\nどうか、そういうことは全然ない」"}, {"t": 756.55, "x": "殺意は認定されていない。"}, {"t": 758.3, "x": "一審判決はそうだった、と参考人は述べている。"}, {"t": 761.4166666666666, "x": "だから量刑は無期懲役だった。"}, {"t": 763.4166666666666, "x": "起訴されたほかの被告については、\nこういう発言がある。"}, {"t": 766.7333333333333, "x": "一九五五年六月二十日、衆議院法務委員会。"}, {"t": 770.35, "x": "「現にこの三鷹事件の無罪になった\n他の被告に対しても脅迫等が行われておって」"}, {"t": 775.6, "x": "「ありもしないことが供述されているのでありまして」"}, {"t": 778.4166666666666, "x": "「これについては、裁判長が空中楼閣とさえ\n検察庁に対して言っていることがある」"}, {"t": 783.55, "x": "空中楼閣？"}, {"t": 784.75, "x": "裁判長がそう言った、と議員が述べている。"}, {"t": 787.3166666666667, "x": "ここは正直に言っておく。"}, {"t": 788.9333333333333, "x": "一審の判決の日付と、無罪になった被告が\n何人だったかは、私は確認できなかった。"}, {"t": 794.75, "x": "国会の記録には「無罪になった他の被告」\n「無罪判決をされた人々」という言い方しかない。"}, {"t": 800.8333333333334, "x": "だから、人数は言わない。"}, {"t": 802.4666666666667, "x": "分かるのは、九人が起訴されて、一人だけが\n有罪になった、というところまでだ。"}, {"t": 807.3833333333333, "x": "判決文そのものは、私は読んでいない。"}, {"t": 809.8833333333333, "x": "読んでいないものを読んだように話さない。"}, {"t": 812.7666666666667, "x": "ここが、この事件のいちばん大きな問いだ。"}, {"t": 815.3, "x": "九人が起訴された事件で、一人だけが有罪になった。"}, {"t": 818.7666666666667, "x": "ということは、判決は「一人でやった」と\n認定したことになる。"}, {"t": 822.95, "x": "九人でやったんじゃなくて、一人で。"}, {"t": 825.3333333333334, "x": "そう認定された、ということだ。"}, {"t": 827.3333333333334, "x": "この点について、一九五七年に\n国会の公聴会で意見を述べた人がいる。"}, {"t": 832.4666666666667, "x": "一九五七年四月九日、衆議院法務委員会公聴会。"}, {"t": 836.65, "x": "評論家が公述人として呼ばれている。"}, {"t": 839.0833333333334, "x": "この人は、恩赦を求める署名が広がった\n理由を五つに分けて説明している。"}, {"t": 843.75, "x": "その二つ目が、これだ。"}, {"t": 845.4, "x": "「かりに判決を認めても、\n当時の日本の状況から見まして」"}, {"t": 849.15, "x": "「果してああいう事件が単に個人の、\nたった一人の人間の責任に帰せらるべきものであるか」"}, {"t": 854.7, "x": "「そうならばあまりにかわいそうではないかということ」"}, {"t": 857.45, "x": "判決を認めたとしても、一人の責任なのか。"}, {"t": 860.75, "x": "ああ。これは有罪か無罪かとは別の問いだ。"}, {"t": 863.3666666666667, "x": "ほかの四つも紹介しておく。"}, {"t": 865.2333333333333, "x": "一つ目は「わずか一票の差によって\n死刑の判決が下った」ことへの不審。"}, {"t": 869.95, "x": "三つ目は、本人の無罪を信じている人。"}, {"t": 872.6833333333333, "x": "四つ目は、死刑そのものに反対の人。"}, {"t": 875.4, "x": "五つ目は、家族の貧しさへの人情論だ。"}, {"t": 878.1666666666666, "x": "そして、この公述人はこうまとめている。"}, {"t": 880.75, "x": "「いろいろな疑問の点が\n残されている一番大きな問題は」"}, {"t": 884.1, "x": "「やはりあの判決がどこか不鮮明なところがある」"}, {"t": 886.9333333333333, "x": "「これはたとえ判決を承認しようと思っている\n人でもなお一まつの疑問を抱かざるを得ない」"}, {"t": 892.1, "x": "判決を認める人でも、疑問が残る。"}, {"t": 894.8666666666667, "x": "そういう言い方をしている。"}, {"t": 896.9666666666667, "x": "一九五五年六月二十日、衆議院法務委員会。"}, {"t": 900.6, "x": "ある議員が、この事件の疑問点を\n八つ挙げている。そのまま読む。"}, {"t": 904.4666666666667, "x": "第一点。「三十分前に三鷹駅前の交番に、\n今夜共産党が大事件を起すから警戒せよと」"}, {"t": 910.5833333333334, "x": "「三鷹本署から電話があった。これはすべて\n関係当事者の証言が公判廷で行われておる」"}, {"t": 915.9833333333333, "x": "「当の三鷹電車区にだけは、\nあの暴走電車の事件の起ったところには\n何の前もっての注意がない」"}, {"t": 921.8166666666667, "x": "事件の三十分前に、電話。"}, {"t": 924.0166666666667, "x": "そう証言されている、という主張だ。"}, {"t": 926.2333333333333, "x": "第二点。「証拠の保全が行われなかったという点」"}, {"t": 929.3166666666667, "x": "第三点。「紙ひもが本人の言っているところと\n違っておるのであります」"}, {"t": 933.4833333333333, "x": "「しかもこの紙ひもは、\n日本製のものではないのであります」"}, {"t": 936.9333333333333, "x": "第四点。「検出されたと\n当時検察庁が発表された指紋が」"}, {"t": 941.05, "x": "「審理においては一回も\n証拠として持ち出されておらない」"}, {"t": 944.3166666666667, "x": "指紋が出てこなかった？"}, {"t": 945.9333333333333, "x": "発表はされたのに、法廷には\n出なかった、という指摘だ。"}, {"t": 949.5, "x": "第五点。「パンタグラフが二つ\n上ったということであります」"}, {"t": 952.9333333333333, "x": "「その一つのパンタグラフはだれが上げたかという\n点がはっきりしておりません」"}, {"t": 957.0, "x": "第六点。「事件発生当時電車区構内のふろに\n同僚と一緒に入っておったということが」"}, {"t": 962.3166666666667, "x": "「一緒に入っておった同僚の名前までもあげて証人に\n申請しているのに、それが却下されております」"}, {"t": 968.1666666666666, "x": "風呂に入っていた、という証人。"}, {"t": 970.3, "x": "申請したが却下された、と述べられている。"}, {"t": 972.95, "x": "第七点は、自白が強制に\nよるものではないか、という指摘。"}, {"t": 976.85, "x": "第八点は、会議を中座して犯行に加わったという\n認定が事実無根だ、という指摘だ。"}, {"t": 982.35, "x": "これは一議員の主張であって、\n認定された事実ではない。"}, {"t": 985.7666666666667, "x": "ただし、こういう主張が公開の記録に残っている。"}, {"t": 988.85, "x": "さっきの第一点については、\n一九四九年の時点でも聞かれている。"}, {"t": 993.45, "x": "一九四九年九月二十日、衆議院法務委員会。"}, {"t": 997.15, "x": "議員が、ある文書を読み上げている。"}, {"t": 999.2166666666667, "x": "「事件発生以前より国鉄、警察当局は、\n三鷹駅附近で何か事件が起ることを予知していた」"}, {"t": 1005.4166666666666, "x": "「立川国警支所長は七月二十八日に\n『事件当夜八時半頃、国警本部から\n三鷹附近で何か事件が起るから」"}, {"t": 1013.0833333333334, "x": "「注意して警戒に当るよう通知をうけた』ともらし、\n立川市署長は二十七日に同様のことをもらしておる」"}, {"t": 1019.5833333333334, "x": "八時半に通知。"}, {"t": 1020.9666666666667, "x": "事件は九時二十三分だ。その五十分ほど前になる。"}, {"t": 1024.3333333333333, "x": "これに対する警察隊長の答えを読む。"}, {"t": 1026.85, "x": "「七月に入りまして巷間いろいろな\nうわさが飛びますし」"}, {"t": 1030.1, "x": "「警察としてはあらゆる不法なる事態が起らないように\n警備、警戒をするのが警察の仕事であります」"}, {"t": 1035.9333333333334, "x": "「当日具体的にどういう内容のものが\n出たかは私は存じませんが」"}, {"t": 1039.95, "x": "そして、はっきり否定している。"}, {"t": 1041.9333333333334, "x": "「当日三鷹の事件のようなああいう大きな事件が\n起る、あるいは今晩大きな事件が起る」"}, {"t": 1047.0833333333333, "x": "「そういうふうなことを流したことは\n私は全然承知いたしておりません」"}, {"t": 1051.1166666666666, "x": "全然承知していない。"}, {"t": 1052.6833333333334, "x": "ああ。警察はそう答えている。"}, {"t": 1054.5833333333333, "x": "一方で、六年後の一九五五年には\n「関係当事者の証言が公判廷で\n行われておる」と述べられている。"}, {"t": 1061.5666666666666, "x": "私はこの二つのどちらが正しいかを決めない。"}, {"t": 1064.3666666666666, "x": "当時、鉄道をめぐる事件が一日に\n八十件も起きていた時期だ。"}, {"t": 1068.45, "x": "警戒せよという連絡が回っていたこと\n自体は、不自然ではない。"}, {"t": 1072.2666666666667, "x": "だが、なぜ三鷹電車区にだけ来なかったのか、という\n問いは残る。"}, {"t": 1076.1833333333334, "x": "この点について、答えを出した\n記録を私は見つけられなかった。"}, {"t": 1080.7, "x": "一審の無期懲役は、控訴審でひっくり返る。"}, {"t": 1083.6, "x": "控訴審は、死刑を言い渡した。"}, {"t": 1085.6833333333334, "x": "この点について、参議院法務委員会に\n呼ばれた参考人が強い言い方をしている。"}, {"t": 1090.4666666666667, "x": "一九五五年七月八日の発言だ。"}, {"t": 1093.3666666666666, "x": "「現在では、控訴審において、\n何らの証拠調べもすることなしに」"}, {"t": 1097.45, "x": "「事実の認定や刑の量定を\n変更することが行われております」"}, {"t": 1101.4333333333334, "x": "証拠調べをしないで刑を変える？"}, {"t": 1103.4666666666667, "x": "ああ。当時、それが合法とされていた。"}, {"t": 1105.9, "x": "参考人は、三鷹事件を名指しでこう述べている。"}, {"t": 1108.8833333333334, "x": "「少くとも控訴審においてすでに誤まっている」"}, {"t": 1111.7166666666667, "x": "「一つの証拠調べをすることなしに\n無期刑を死刑に変更したということは」"}, {"t": 1116.0666666666666, "x": "「ひとり刑訴第四百条に違反するばかりではない」"}, {"t": 1119.0, "x": "「憲法の第三十一条、第三十七条等の趣旨に\n反するものである、私は違憲であると思う」"}, {"t": 1125.0166666666667, "x": "違憲。"}, {"t": 1125.6666666666667, "x": "参考人はそう言っている。\nただし、こうも付け加えている。"}, {"t": 1129.05, "x": "「最高裁判所のすることはいかんともいたし方がないと\nいう現状であります」"}, {"t": 1133.3333333333333, "x": "同じ日、別の参考人はもっと慎重だ。"}, {"t": 1136.0833333333333, "x": "「私は今日の問題で三鷹事件の裁判を\n実質的に不当な裁判であったということを」"}, {"t": 1141.2333333333333, "x": "「申しておるつもりは一切ございません」"}, {"t": 1143.3666666666666, "x": "「一応この大きなものは\n一日がかりで見ましたけれども」"}, {"t": 1146.5833333333333, "x": "「実質論をいたすだけの勇気はまだございません」"}, {"t": 1149.4833333333333, "x": "中身の当否は言わない、ということね。"}, {"t": 1151.9, "x": "ああ。手続きの問題だけを言っている。"}, {"t": 1154.1666666666667, "x": "この二人の距離が、当時の議論の幅を表している。"}, {"t": 1158.0, "x": "最高裁の大法廷が判決を言い渡したのは、\n一九五五年六月二十二日だ。"}, {"t": 1163.5, "x": "その二日前の委員会で、議員がこう言っている。"}, {"t": 1166.35, "x": "「三鷹事件の竹内の裁判が明後日に\n迫っていることになっております」"}, {"t": 1170.7166666666667, "x": "そして、その前にも一度、\n判決の言い渡しが止まっていた。"}, {"t": 1174.5333333333333, "x": "「今から半年前に判決言い渡しをしようとして、\nこれを中止したことがあります」"}, {"t": 1179.3166666666666, "x": "「しかるに六カ月たった今日になって、同じような\n手続で判決言い渡しをやるということを通告してきた」"}, {"t": 1185.6, "x": "半年前に一度止めた？"}, {"t": 1187.3666666666666, "x": "ああ。そして半年後に、同じ手続きで\n言い渡すと通告してきた。"}, {"t": 1191.5833333333333, "x": "被告の側は、弁論を開いてほしいと求めていた。"}, {"t": 1194.7333333333333, "x": "「弁論を開いて最終判決をしてくれというのが\n被告の希望になっております」"}, {"t": 1199.2833333333333, "x": "「言いたいことだけは少くとも言わせてということ」"}, {"t": 1202.0333333333333, "x": "結果は、上告棄却だった。死刑が確定した。"}, {"t": 1205.3666666666666, "x": "この判決の内訳が、ずっと議論される。"}, {"t": 1208.0666666666666, "x": "一九五五年六月二十五日、議員はこう述べている。"}, {"t": 1211.8333333333333, "x": "「その判決については八対七ということでありますが」"}, {"t": 1215.0833333333333, "x": "「一人の裁判官は合議に参加しておりながら\n署名捺印をしておりませんが」"}, {"t": 1219.45, "x": "「この署名捺印をしない人を\n除くと七対七になるのであります」"}, {"t": 1223.4666666666667, "x": "七対七。"}, {"t": 1224.5333333333333, "x": "ああ。同数だ、という主張だ。"}, {"t": 1226.5333333333333, "x": "参考人の弁護士も、判決書を\n読んだうえで同じことを言っている。"}, {"t": 1230.4333333333334, "x": "「三鷹事件の判決が上告棄却になっておりますが、\nその多数決の中で七対七になっておる」"}, {"t": 1236.3833333333334, "x": "この弁護士は、十四人の裁判官の経歴も調べている。"}, {"t": 1239.9833333333333, "x": "「民事専門の方が七人、刑事専門の方が\n七人、こういう割り振りになっております」"}, {"t": 1245.25, "x": "上告棄却の意見を持った\n七人のうち、刑事の経験がある人は\n二人だけだった、と述べている。"}, {"t": 1251.15, "x": "なお、後年の議員の発言では\n「七対八」と言っているものもある。"}, {"t": 1255.35, "x": "どちらの言い方も記録に残っている。"}, {"t": 1257.4333333333334, "x": "私はどちらかに直さない。"}, {"t": 1259.8833333333334, "x": "もう一つの争点は、法律の条文の読み方だった。"}, {"t": 1263.25, "x": "参考人の弁護士の説明を読む。"}, {"t": 1265.4, "x": "電車を走らせた行為そのものは、\n刑法の百二十五条にあたる。"}, {"t": 1269.2666666666667, "x": "「汽車又ハ電車ノ往来ノ危険ヲ」生じさせる行為だ。"}, {"t": 1272.5666666666666, "x": "ところが、たまたま電車が転覆した。"}, {"t": 1275.05, "x": "「その点において刑法百二十六条の第一項に\n当てれば当るのです」"}, {"t": 1279.1833333333334, "x": "条文が変わると刑も変わるの？"}, {"t": 1281.2166666666667, "x": "ああ。百二十六条の第三項には、\n死刑まで書いてある。"}, {"t": 1284.8, "x": "問題は、その第三項を適用してよいのかどうかだ。"}, {"t": 1288.0666666666666, "x": "参考人はこう述べている。"}, {"t": 1289.6833333333334, "x": "「少くとも百二十七条にありますように」"}, {"t": 1292.35, "x": "「百二十六条の第三項に規定してあります\n死刑にまで至るという規定は」"}, {"t": 1296.8, "x": "「百二十七条は予定しておらぬという議論が\n少数意見の中に非常に強くなっている」"}, {"t": 1301.95, "x": "死刑までは想定していない、という意見。"}, {"t": 1304.4666666666667, "x": "ああ。それが少数意見だった。"}, {"t": 1306.4166666666667, "x": "そして、こう続けている。"}, {"t": 1308.1, "x": "「三鷹事件のように七対七の問題です。\nそれから法律の解釈にも非常に疑義がある」"}, {"t": 1313.45, "x": "つまり、争われたのは事実だけではない。"}, {"t": 1316.0, "x": "同じ行為に、どの条文をあてるか。それに\nよって死刑になるかどうかが変わった。"}, {"t": 1320.6, "x": "この参考人は、恩赦という制度についても述べている。"}, {"t": 1323.8166666666666, "x": "「刑事学者の中には、あれを\nいわゆる法の安全弁だとこう言うのです」"}, {"t": 1327.8166666666666, "x": "「法律を間違って運用したというような場合には、\n何か安全弁でこれを救う道が要るのだ」"}, {"t": 1333.05, "x": "一九五五年の時点で、そういう\n議論が国会でされていた。"}, {"t": 1337.6833333333334, "x": "死刑が確定してからも、この事件は終わらなかった。"}, {"t": 1340.9166666666667, "x": "一九六五年十二月二十三日、衆議院法務委員会。"}, {"t": 1345.0833333333333, "x": "一人の議員が、本人と面会した記録を残している。"}, {"t": 1348.5166666666667, "x": "この議員は、国鉄の出身だった。"}, {"t": 1350.7333333333333, "x": "用件なしで会いに行った、と述べている。"}, {"t": 1353.15, "x": "「約三、四十分了解を得て彼のいま考えておること、\n並びに何が言いたいかということを」"}, {"t": 1358.5333333333333, "x": "「いろいろの角度から聞いてみたのです」"}, {"t": 1360.8, "x": "本人は何と言ったの？"}, {"t": 1362.3833333333334, "x": "議員の言葉で読む。"}, {"t": 1363.6666666666667, "x": "「彼が言いたいことは、要すれば\n私は無実であるということ」"}, {"t": 1367.15, "x": "「それから同時にいま恩赦の\nお願いをしておるということ」"}, {"t": 1370.15, "x": "そして、議員はこう続ける。"}, {"t": 1372.0, "x": "「無実である者が恩赦の要求をするということには\nもちろん矛盾があります」"}, {"t": 1376.1666666666667, "x": "「矛盾がありますけれども、少なくとも再審を\n要求しておるけれどもなかなか取り上げてもらえない」"}, {"t": 1381.65, "x": "「いまや十数年になんなんとして\n拘置所生活を暮らしておる者にとっては」"}, {"t": 1385.9833333333333, "x": "十数年も？"}, {"t": 1387.1, "x": "ああ。確定から十年が過ぎていた。"}, {"t": 1389.3666666666666, "x": "そして、外の動きについても述べられている。"}, {"t": 1392.1, "x": "「獄外の皆さんの恩赦とそれから再審の署名、\n助命運動が七十万人くらい集まったそうでありますが」"}, {"t": 1398.3166666666666, "x": "「この部外の励ましを受けて、ともあれ\n生き抜かなければ、自分の主張も達成されない」"}, {"t": 1403.3166666666666, "x": "「ということで、矛盾はあるけれども、\n部外の人の激励を受けて恩赦のお願いをしておる」"}, {"t": 1408.4333333333334, "x": "生き抜かなければ、主張が達成されない。"}, {"t": 1411.0833333333333, "x": "ああ。無実を主張しながら、恩赦を願う。\nその矛盾を議員はそのまま書き残している。"}, {"t": 1416.25, "x": "この人には家族がいた。"}, {"t": 1417.7166666666667, "x": "議員の言葉ではこうだ。"}, {"t": 1419.2166666666667, "x": "「彼は五人の家族をかかえて、\nまあ面会人もあまりなくて」"}, {"t": 1422.7666666666667, "x": "「ひたすらに手紙を\n書いたり、あるいはいろいろなものを\n人に送ったりして」"}, {"t": 1426.7666666666667, "x": "翌年の二月には、家族が法務大臣に\n陳情に来たという話が、別の委員会に出てくる。"}, {"t": 1433.1166666666666, "x": "一九六七年一月十八日の午前八時。"}, {"t": 1436.65, "x": "この人は、東京拘置所で亡くなった。"}, {"t": 1439.15, "x": "死刑は執行されていない。病死だった。"}, {"t": 1441.75, "x": "再審を求めたまま。"}, {"t": 1443.3166666666666, "x": "ああ。その状態のままだ。"}, {"t": 1445.0, "x": "この件は、同じ年の四月二十日に\n衆議院の予算委員会で取り上げられた。"}, {"t": 1449.55, "x": "そして六月二日、衆議院法務委員会で\n改めて質疑が行われている。"}, {"t": 1454.1666666666667, "x": "質問した議員は、こう切り出している。"}, {"t": 1456.5333333333333, "x": "「再審の申し立てをしながら、無実を訴えている\n人が獄中で十分な治療を受けることがなくて」"}, {"t": 1462.2833333333333, "x": "「死亡したということは、単に個人の問題ではなくて」"}, {"t": 1465.5166666666667, "x": "「人権擁護という観点から見ましても、\n拘置所の処遇という点から見ましても、\n非常に重大な問題だ」"}, {"t": 1471.7666666666667, "x": "そして、こう付け加えている。"}, {"t": 1473.5833333333333, "x": "「きょうは遺族の方も傍聴に見えております」"}, {"t": 1476.1833333333334, "x": "遺族が傍聴に来ていたの？"}, {"t": 1478.0, "x": "ああ。委員会の傍聴席に来ていた。"}, {"t": 1480.2833333333333, "x": "死因についても、記録が残っている。"}, {"t": 1482.6166666666666, "x": "「死体検案書によりますと、\n脳腫瘍でなくなられたということでありますが」"}, {"t": 1486.8666666666666, "x": "「この腫瘍は鶏卵大のもので、約二、\n三カ月で発育したものということを」"}, {"t": 1491.5666666666666, "x": "「行政解剖に立ち会った医師が申しております」"}, {"t": 1494.3, "x": "法務省側も、この報告を受けたことを認めている。"}, {"t": 1497.45, "x": "「監察医務院からの正式の報告を受けております」"}, {"t": 1501.2, "x": "亡くなる三週間ほど前に、診察が行われている。"}, {"t": 1504.5333333333333, "x": "法務省の担当課長の説明を読む。"}, {"t": 1506.8833333333334, "x": "「昭和四十一年十二月二十七日に\n東京医科歯科大学中田教授の診断のときに」"}, {"t": 1512.3833333333334, "x": "「脳腫瘍の疑いがあるから、その点については\n精密に検査をするようにということを」"}, {"t": 1517.2, "x": "「私から電話で中田教授に連絡いたしました」"}, {"t": 1520.3333333333333, "x": "脳腫瘍の疑いは出ていたのね。"}, {"t": 1522.4166666666667, "x": "ああ。その日のうちに指示は出ている。"}, {"t": 1524.5166666666667, "x": "だが、検査は行われなかった。"}, {"t": 1526.4666666666667, "x": "理由は、こう説明されている。"}, {"t": 1528.45, "x": "「東京拘置所の報告によりますと、\nその日は精密検査を竹内君が拒否した」"}, {"t": 1533.4166666666667, "x": "「眼底検査はいたしましたけれども、\n脳波あるいは脳の血管撮影とか」"}, {"t": 1537.7333333333333, "x": "「あるいは最も重要な検査である脳脊髄液の検査は、\n本人の拒否にあってできなかった」"}, {"t": 1543.25, "x": "本人が断った、という説明。"}, {"t": 1545.5833333333333, "x": "ああ。法務省側はそう説明している。"}, {"t": 1547.9333333333334, "x": "これに対して、議員は食い下がっている。"}, {"t": 1550.3, "x": "法務大臣の答弁が予算委員会と\n食い違っていた点を突いた。"}, {"t": 1554.0333333333333, "x": "「法務大臣勘違いと言われますけれども、\nこれはたいへん重大な問題です」"}, {"t": 1558.4666666666667, "x": "「単なる国会の答弁として済ましていくというような\n問題では絶対にないと思うのです」"}, {"t": 1563.4666666666667, "x": "「一人の人の生命が失われた問題です」"}, {"t": 1566.2333333333333, "x": "そして、医学的な筋にも疑問を出している。"}, {"t": 1569.1, "x": "「精密検査が必要なのは、脳腫瘍と\n判断する場合に必要なんでしょう」"}, {"t": 1573.5666666666666, "x": "「拘禁反応という場合に、どういう\n精密検査が要るのかということは」"}, {"t": 1577.55, "x": "「普通の医療常識から言っても考（えられない）」"}, {"t": 1580.6166666666666, "x": "診断名がずれている、という指摘ね。"}, {"t": 1583.1, "x": "そういう追及だ。"}, {"t": 1584.2666666666667, "x": "私はここでも、どちらが正しいかを決めない。"}, {"t": 1587.0666666666666, "x": "ただ、獄中で亡くなった人について、国会で\nここまでの質疑が行われた。それが記録だ。"}, {"t": 1593.4666666666667, "x": "一九四九年の三つの事件を、記録の上で並べておく。"}, {"t": 1597.5333333333333, "x": "下山事件は、国鉄の総裁が\n亡くなって見つかった事件だ。"}, {"t": 1601.4666666666667, "x": "このチャンネルでは、ep056で扱った。"}, {"t": 1604.3, "x": "自殺なのか他殺なのか、いまも決着していない。"}, {"t": 1607.4833333333333, "x": "松川事件は、福島県で列車が脱線転覆した事件だ。"}, {"t": 1611.4833333333333, "x": "多くの人が起訴され、長い裁判の\nあとに全員の無罪が確定している。"}, {"t": 1616.0, "x": "三つとも鉄道ね。"}, {"t": 1617.5, "x": "ああ。そして三つとも、国鉄の人員整理と\n同じ時期に起きている。"}, {"t": 1621.6666666666667, "x": "一九五〇年の国会には、こんな発言がある。"}, {"t": 1624.95, "x": "「共産党の共同謀議という名目のもとに三鷹事件、\n平事件、松川事件等を経験して参りました」"}, {"t": 1631.4, "x": "「これに対しましては、もはや\n検察当局におきましては、\n共産党の共同謀議であるという認定のもとに」"}, {"t": 1637.6666666666667, "x": "「起訴をいたしまして、現在裁判中であります」"}, {"t": 1640.6833333333334, "x": "共同謀議として起訴されていた。"}, {"t": 1642.8333333333333, "x": "そう述べられている。ただし、\nこの認定はあとで崩れる。"}, {"t": 1646.0333333333333, "x": "松川事件は、全員が無罪になった。"}, {"t": 1648.6166666666666, "x": "三鷹事件も、九人が起訴されて、\n有罪になったのは一人だけだった。"}, {"t": 1653.1, "x": "一方で、これらを結びつけて\n「うしろに黒い手があった」と述べた議員もいる。"}, {"t": 1657.6166666666666, "x": "一九五五年の発言だ。"}, {"t": 1659.7666666666667, "x": "だが、それは推定であって、\n認定された事実ではない。"}, {"t": 1663.2166666666667, "x": "私はその説には乗らない。"}, {"t": 1665.0, "x": "同じ議員は、七月十五日という\n日付が選ばれたのだとも述べている。"}, {"t": 1669.2333333333333, "x": "これも「推定できる」という\n言い方だ。断定していない。"}, {"t": 1672.7, "x": "だから私も、断定しない。"}, {"t": 1675.2666666666667, "x": "ここで、線を引いておく。"}, {"t": 1676.8666666666666, "x": "この回で私が事実として話したことは、次のものだ。"}, {"t": 1680.4833333333333, "x": "一九四九年七月十五日午後九時二十三分、\n三鷹駅構内で電車が動き出した。"}, {"t": 1686.4666666666667, "x": "六人が亡くなり、十八人が重軽傷を負った。"}, {"t": 1689.5166666666667, "x": "翌十六日、捜査側は人為的なものだと判断した。"}, {"t": 1693.1666666666667, "x": "合同捜査本部は五十人から六十人。"}, {"t": 1695.5333333333333, "x": "九人が起訴された。"}, {"t": 1696.9833333333333, "x": "一審で一人が無期懲役になり、\nほかの被告は無罪になった。"}, {"t": 1700.8, "x": "控訴審が死刑に変更し、一九五五年六月二十二日に\n最高裁大法廷が上告を棄却した。"}, {"t": 1707.4833333333333, "x": "その人は再審を求めたまま、\n一九六七年一月十八日午前八時に獄中で亡くなった。"}, {"t": 1714.1666666666667, "x": "ここまでが記録。"}, {"t": 1715.4666666666667, "x": "ああ。ここまでは、国会の議事録に文言がある。"}, {"t": 1718.45, "x": "では、言えないことは何か。"}, {"t": 1720.2, "x": "一つ目。本当は誰がやったのか。"}, {"t": 1722.3666666666666, "x": "私には分からない。"}, {"t": 1723.7666666666667, "x": "二つ目。一人だったのか、\n複数だったのか。これも分からない。"}, {"t": 1727.85, "x": "三つ目。取り調べに問題があったのかどうか。"}, {"t": 1730.5333333333333, "x": "国会には両方の主張が残っている。"}, {"t": 1732.9333333333334, "x": "四つ目。近年の再審請求がどうなっているか。"}, {"t": 1736.0166666666667, "x": "これは国会の記録では\n確認できなかったので、この回では扱わない。"}, {"t": 1740.35, "x": "確認できないことは言わない。"}, {"t": 1742.25, "x": "ああ。それがこのチャンネルの決まりだ。"}, {"t": 1744.4333333333334, "x": "もう一つ言っておく。"}, {"t": 1745.7333333333333, "x": "死刑が確定した判決は、いまも取り消されていない。"}, {"t": 1749.0, "x": "だから私は「無実だった」とも言わない。"}, {"t": 1751.7333333333333, "x": "本人がそう主張していた、という\n事実を紹介しただけだ。"}, {"t": 1755.9333333333334, "x": "ここからは、私が記録を読んで残った\n疑問を二つ挙げる。答えは出さない。"}, {"t": 1760.5166666666667, "x": "一つ目は、人数だ。"}, {"t": 1762.0666666666666, "x": "この事件は、最初から複数犯として扱われていた。"}, {"t": 1765.5333333333333, "x": "一九四九年の八月に八人、\n九月には九人が起訴されている。"}, {"t": 1770.25, "x": "検察は「共同謀議」という枠で起訴した、と\n一九五〇年の国会で述べられている。"}, {"t": 1775.9166666666667, "x": "それが一人になった。"}, {"t": 1777.45, "x": "ああ。裁判の結果、一人だけが残った。"}, {"t": 1780.2833333333333, "x": "ここで問いが二つに割れる。"}, {"t": 1781.9333333333334, "x": "一つは、もともと一人でできたのに、最初の見立てが\n広すぎたのではないか、という見方。"}, {"t": 1787.55, "x": "もう一つは、一人ではできないのに、一人だけが\n残ってしまったのではないか、という見方。"}, {"t": 1793.1, "x": "一九五七年の公聴会で公述人が\n述べたのは、後者に近い問いだ。"}, {"t": 1797.9666666666667, "x": "「果してああいう事件が単に個人の、\nたった一人の人間の責任に帰せらるべきものであるか」"}, {"t": 1803.6, "x": "どっちの見方も成り立つのね。"}, {"t": 1805.5666666666666, "x": "記録だけを見る限り、私にはどちらとも決められない。"}, {"t": 1808.8833333333334, "x": "もう一つ、関連する事実がある。"}, {"t": 1811.1333333333334, "x": "一九五五年に挙げられた\n八点の疑問のうち、第五点だ。"}, {"t": 1815.1, "x": "「パンタグラフが二つ上ったということであります」"}, {"t": 1817.9, "x": "「その一つのパンタグラフはだれが上げたかという\n点がはっきりしておりません」"}, {"t": 1821.9666666666667, "x": "この指摘の当否も、私は確かめられなかった。"}, {"t": 1825.1, "x": "ただ、こういう指摘が公開の記録に\n残っている、ということは言っておく。"}, {"t": 1829.9833333333333, "x": "二つ目の疑問は、時刻だ。"}, {"t": 1831.95, "x": "午後九時二十三分。この時刻に、\nその場には人がいた。"}, {"t": 1835.5166666666667, "x": "だから六人が亡くなり、十八人がけがをした。"}, {"t": 1838.5833333333333, "x": "もし深夜だったら、被害はまったく違っていただろう。"}, {"t": 1841.8333333333333, "x": "時間が違えば、結果も違った。"}, {"t": 1844.2, "x": "ああ。ここで、一審の認定を思い出してほしい。"}, {"t": 1847.0833333333333, "x": "参考人の弁護士は、こう述べていた。"}, {"t": 1849.45, "x": "「あれを走らせてそして人を\n殺そうなんていうことは毛頭考えていない」"}, {"t": 1853.4333333333334, "x": "「一審判決の認定からいたしましても、\n決してそのものに殺意があるか\nどうか、そういうことは全然ない」"}, {"t": 1859.5666666666666, "x": "一審は、人を殺すつもりではなかった、と\n認定していた。"}, {"t": 1863.2333333333333, "x": "だが、控訴審は死刑にした。"}, {"t": 1865.3666666666666, "x": "認定が変わったの？"}, {"t": 1866.7833333333333, "x": "そこが分からない。"}, {"t": 1867.9, "x": "控訴審の判決文を私は読んでいないし、\n国会の記録にもその中身は残っていない。"}, {"t": 1873.15, "x": "分かるのは、参考人が「証拠調べをせずに変えた」と\n国会で述べたことだけだ。"}, {"t": 1878.1833333333334, "x": "そしてもう一つ。"}, {"t": 1879.4, "x": "その五十分ほど前に、警戒せよという\n連絡が回っていたという証言がある。"}, {"t": 1883.8833333333334, "x": "警察は一九四九年の時点で、そういうことを\n流した覚えはない、と否定している。"}, {"t": 1889.3833333333334, "x": "この二つが噛み合わないまま、記録は終わっている。"}, {"t": 1892.3, "x": "時刻をめぐる問いは、七十六年たっても閉じていない。"}, {"t": 1896.2666666666667, "x": "最後に、一九五七年の公聴会に戻る。"}, {"t": 1899.5833333333333, "x": "作家として呼ばれた公述人が、こう述べている。"}, {"t": 1902.5166666666667, "x": "「竹内景助はしょっちゅう手紙をよこしまして」"}, {"t": 1905.2666666666667, "x": "「自分はあのときお湯に入っていたんだということを\nしょっちゅう書いてよこしております」"}, {"t": 1909.55, "x": "そして、こう続けている。"}, {"t": 1911.2333333333333, "x": "「それがほんとうであるかうそであるか、私は\n調べてみないからわからないのでございますけれども」"}, {"t": 1916.4333333333334, "x": "「しかし、少くとも、あの判決において」"}, {"t": 1919.2333333333333, "x": "「竹内景助がおふろに入っていなかったということを\nはっきり証明することができていないと思う」"}, {"t": 1924.7166666666667, "x": "入っていなかったことを証明できていない。"}, {"t": 1927.2333333333333, "x": "ああ。この言い方が、この回の\nいちばん正直な立ち位置だと私は思う。"}, {"t": 1931.4833333333333, "x": "やったと証明されたのか。やっていないと\n証明されたのか。"}, {"t": 1934.95, "x": "どちらとも言い切れない状態のまま、死刑が確定した。"}, {"t": 1938.3333333333333, "x": "そして本人は、獄中で亡くなった。"}, {"t": 1940.7833333333333, "x": "私がこのチャンネルで何度も\n言っていることを、最後にもう一度言う。"}, {"t": 1944.5666666666666, "x": "記録は残る。"}, {"t": 1945.5666666666666, "x": "この回で紹介した質問も、答弁も、\n参考人の意見も、全部国会の議事録に残っている。"}, {"t": 1951.6166666666666, "x": "誰でも読める。今すぐ読める。"}, {"t": 1953.5833333333333, "x": "事件の解説動画は、たくさんある。"}, {"t": 1955.75, "x": "私が作っているものも、その一つだ。"}, {"t": 1958.4666666666667, "x": "だが、動画で見た話が本当か\nどうかを、自分で確かめる手段がある。"}, {"t": 1962.8666666666666, "x": "それが、国会会議録検索システムだ。"}, {"t": 1965.6, "x": "今回使った資料も、そこで公開されている。"}, {"t": 1968.5166666666667, "x": "中心にしたのは、次の記録だ。"}, {"t": 1970.7666666666667, "x": "一九四九年八月二十四日、衆議院地方行政委員会。"}, {"t": 1975.0666666666666, "x": "死傷者数と起訴人数が出てくる回。"}, {"t": 1977.45, "x": "一九四九年九月二十日、衆議院法務委員会。"}, {"t": 1981.0333333333333, "x": "警察と検察が捜査経過を報告した回。"}, {"t": 1983.9666666666667, "x": "一九五五年六月二十日、衆議院法務委員会。"}, {"t": 1987.45, "x": "八点の疑問が挙げられた回。"}, {"t": 1989.3666666666666, "x": "一九五五年七月十四日、参議院法務委員会。"}, {"t": 1993.0, "x": "弁護士が判決書を分析した回。"}, {"t": 1995.3333333333333, "x": "一九五七年四月九日、衆議院法務委員会公聴会。"}, {"t": 1999.5, "x": "恩赦運動について述べられた回。"}, {"t": 2001.5666666666666, "x": "一九六五年十二月二十三日、衆議院法務委員会。"}, {"t": 2005.5833333333333, "x": "議員が本人と面会した記録。"}, {"t": 2007.75, "x": "一九六七年六月二日、衆議院法務委員会。"}, {"t": 2011.4666666666667, "x": "獄死をめぐる質疑。"}, {"t": 2012.85, "x": "どなたでも無料で読める。"}, {"t": 2014.35, "x": "よかったら、一度自分で開いてみてほしい。"}, {"t": 2016.9666666666667, "x": "この回について、あなたはどう考えるか。"}, {"t": 2019.35, "x": "コメントで聞かせてほしい。"}, {"t": 2020.95, "x": "最後まで見てくれて、ありがとう。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
