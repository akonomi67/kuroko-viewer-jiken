<style>

<script>
const D={"name": "120", "file": "120_編集用", "dur": 2031.2, "segs": [], "subs": [{"t": 0.0, "x": "343枚の偽の千円札がある。"}, {"t": 2.75, "x": "1枚目は1961年12月に秋田県で見つかった。"}, {"t": 6.833333333333333, "x": "見つけたのは日本銀行の秋田の支店だ。"}, {"t": 9.533333333333333, "x": "銀行の中で見つかったの？"}, {"t": 11.433333333333334, "x": "そうだ。店でも財布の中でもなく、銀行だった。"}, {"t": 14.7, "x": "そこから2年あまりで、見つかった数は343枚になる。"}, {"t": 18.666666666666668, "x": "額面で数えると、合わせて34万3千円だ。"}, {"t": 22.15, "x": "34万円……思ったより少ないわね。"}, {"t": 24.85, "x": "当時の国会でも、同じことを言った議員がいた。"}, {"t": 27.783333333333335, "x": "ところがこの偽札に、国は桁の違う金を使っている。"}, {"t": 31.366666666666667, "x": "警察の活動費だけで約3200万円。"}, {"t": 34.28333333333333, "x": "新しい千円札を刷る機械に\n35億円、という数字も国会に出た。"}, {"t": 38.8, "x": "額面のほうが、ずっと小さいじゃない。"}, {"t": 41.21666666666667, "x": "そして作った人は、今も分かっていない。"}, {"t": 43.93333333333333, "x": "分かってないの？"}, {"t": 45.1, "x": "分かっていない。警察は\nこの偽札を「三七号」と呼んだ。"}, {"t": 49.083333333333336, "x": "今回はこのチ-37号を、\n当時の国会の記録で追っていく。"}, {"t": 52.983333333333334, "x": "1枚の偽札が、国に何を使わせたのか。"}, {"t": 56.016666666666666, "x": "そして2年あまりのあいだに、何が起きたのか。"}, {"t": 58.95, "x": "国会の記録で？"}, {"t": 60.28333333333333, "x": "この偽札は国会で何度も質問されている。"}, {"t": 63.15, "x": "警察の答えも、議員のいら立ちもそこに残っている。"}, {"t": 67.05, "x": "お札には1枚ずつ、記号と番号が入っている。"}, {"t": 70.05, "x": "これを記番号という。"}, {"t": 71.33333333333333, "x": "最初に見つかった偽札の記号は「WR」だった。"}, {"t": 75.03333333333333, "x": "番号までちゃんと入ってたのね。"}, {"t": 77.1, "x": "入っていた。ただ警察は国会でこう話している。"}, {"t": 80.18333333333334, "x": "「記番号等はあとから押捺されたもの」。"}, {"t": 82.5, "x": "絵柄を刷ったあとで、番号だけを\n別に押したという見立てだ。"}, {"t": 85.96666666666667, "x": "その作業は機械で\n自動にはなっていなかったとも述べている。"}, {"t": 89.41666666666667, "x": "じゃあ、ひとつずつ押してたってこと？"}, {"t": 91.7, "x": "そこまでは言っていない。\nただ大きな機械ではない、とは言った。"}, {"t": 95.2, "x": "「印刷局の持っているような大型のものではない」。"}, {"t": 98.01666666666667, "x": "印刷局というのは、本物の\nお札を刷っている国の役所だ。"}, {"t": 101.91666666666667, "x": "小さな機械で、本物そっくりのお札を作ったの？"}, {"t": 105.25, "x": "そっくりだった。警察の言葉ではこうなる。"}, {"t": 107.93333333333334, "x": "「今までかつて例を見ない程度に\n印刷技術等におきまして精巧なもの」。"}, {"t": 112.06666666666666, "x": "この答弁をしたのは、警察庁で\n刑事の捜査を束ねる局長だ。"}, {"t": 116.11666666666666, "x": "1962年8月28日、\n衆議院の大蔵委員会での答弁になる。"}, {"t": 121.41666666666667, "x": "最初の1枚から、もう8か月もたってるのね。"}, {"t": 124.56666666666666, "x": "今回調べた範囲では、国会がこの偽札を\n正面から取り上げたのはこの日が最初だ。"}, {"t": 129.8, "x": "この日の委員会では、この偽札を\nめぐる質問が次々に続く。"}, {"t": 134.51666666666668, "x": "その日、局長は枚数も出している。"}, {"t": 136.88333333333333, "x": "1962年8月25日の時点で、見つかったのは162枚。"}, {"t": 141.95, "x": "いちばん多いのは東京で60枚だ。"}, {"t": 144.16666666666666, "x": "埼玉が18枚。茨城が12枚。"}, {"t": 146.71666666666667, "x": "関東だけで125枚になる。"}, {"t": 148.93333333333334, "x": "秋田で見つかったのに、関東が多いの？"}, {"t": 151.51666666666668, "x": "最初に出たのは東北だった。"}, {"t": 153.25, "x": "東北の分は33枚だ。"}, {"t": 155.25, "x": "それが止まり、8月に入ってからは\n関東に集まっている。"}, {"t": 158.93333333333334, "x": "作った人が場所を移したのかしら。"}, {"t": 161.28333333333333, "x": "記録から読めるのは、見つかった\n場所が動いたことまでだ。"}, {"t": 164.65, "x": "もう一つ、大事な数字が出ている。"}, {"t": 166.9, "x": "162枚のうち、一般の人が\n気づいて警察に知らせたのは7枚。"}, {"t": 171.4, "x": "残りのほとんどは、日本銀行や\nほかの銀行で見つかった。"}, {"t": 175.1, "x": "お店の人もおつりを受け取った\n人も気づかなかったのね。"}, {"t": 178.5, "x": "気づかなかった。局長はそこが\n捜査の壁だと話している。"}, {"t": 182.13333333333333, "x": "使った人も作った人も、見つけることに\n「著しく困難を感じておる」。"}, {"t": 187.03333333333333, "x": "銀行に戻るまでに、何人もの手を通ってるものね。"}, {"t": 190.35, "x": "銀行で見つかった時点では、誰が\nどこで使ったのかが分からない。"}, {"t": 194.23333333333332, "x": "局長は精巧さの証拠としてもこの7枚を挙げている。"}, {"t": 197.53333333333333, "x": "ふつうの人がちょっと見ただけでは\n見分けがつかない、と。"}, {"t": 201.3, "x": "では本物とどこが違ったのか。"}, {"t": 203.31666666666666, "x": "局長はまず、紙が違うと説明した。"}, {"t": 205.96666666666667, "x": "日本のお札の紙には、ミツマタやコウゾが入っている。"}, {"t": 209.21666666666667, "x": "どちらも和紙の原料になる木の皮だ。"}, {"t": 211.51666666666668, "x": "偽札に使われていた紙は「洋紙」だった。"}, {"t": 214.6, "x": "紙が違うなら、すぐに分かりそうだけど。"}, {"t": 217.28333333333333, "x": "目で見ただけでは分かりにくい。"}, {"t": 218.83333333333334, "x": "違いが出るのは手で持ったときだ。"}, {"t": 220.85, "x": "本物には腰がある。偽物には腰がない。"}, {"t": 223.73333333333332, "x": "腰って紙のはりのこと？"}, {"t": 225.48333333333332, "x": "そうだ。ここで局長の言い方が面白い。"}, {"t": 228.05, "x": "「適当な表現の言葉がないのでございますが」と\n前置きしている。"}, {"t": 231.88333333333333, "x": "そのあとに出てきたのが、この言葉だ。"}, {"t": 234.3, "x": "「何かのりの抜けたゆかた、こういうふうな感じ」。"}, {"t": 237.2, "x": "のりの抜けたゆかた……くたっとしてるのね。"}, {"t": 239.83333333333334, "x": "洗ったきり、のりをきかせていない\nゆかたの手ざわりだ。"}, {"t": 242.86666666666667, "x": "国の役人が手でさわった感じを\n国会で言葉にしている。"}, {"t": 246.41666666666666, "x": "でもさわって比べる人なんてそういないわよ。"}, {"t": 249.06666666666666, "x": "いない。だから7枚しか届かなかった、とも読める。"}, {"t": 252.31666666666666, "x": "一見本物でも、手に取ったら違う。"}, {"t": 254.56666666666666, "x": "局長はそう呼びかけた。"}, {"t": 256.8333333333333, "x": "紙の違いはもう一つの印になって表れた。"}, {"t": 259.73333333333335, "x": "本物の千円札は、使い古しても\n破れないと局長は言った。"}, {"t": 263.68333333333334, "x": "「くたびれた千円札でも\n破れるということは絶対ない」。"}, {"t": 266.9166666666667, "x": "絶対、とまで言うのね。"}, {"t": 268.6, "x": "偽札のほうは、折り目に破れ目が出ていた。"}, {"t": 271.28333333333336, "x": "お札は財布に入れるとき、たいてい折る。"}, {"t": 273.5833333333333, "x": "洋紙はその折り目に耐えられなかったわけだ。"}, {"t": 276.0, "x": "局長はこれを「隠し得ない特徴点」と呼んだ。"}, {"t": 279.1666666666667, "x": "作った人にも、どうにもできないところね。"}, {"t": 281.95, "x": "紙を変えない限りはな。"}, {"t": 283.45, "x": "同じ答弁でもう一つ見落とせないことが出ている。"}, {"t": 286.3333333333333, "x": "偽札は1枚ごとに出来が違い、\n全体で見ると「不ぞろい」だった。"}, {"t": 290.6666666666667, "x": "インクの色が青いとか黒いとか言われる。"}, {"t": 292.8666666666667, "x": "だがそれはその1枚だけの特徴だ、と局長は言う。"}, {"t": 296.28333333333336, "x": "1枚ずつ手で仕上げてるみたいね。"}, {"t": 298.4166666666667, "x": "警察もそう見ていた。"}, {"t": 299.7, "x": "別の答弁ではこう言っている。"}, {"t": 301.53333333333336, "x": "「高度の技術を持った者が手工業的な\n方法によってつくっておるのではないか」。"}, {"t": 306.06666666666666, "x": "大がかりな工場ではなく、少ない\n人数の手仕事という見立てだ。"}, {"t": 310.05, "x": "手仕事で銀行の人しか気づかない出来なのね。"}, {"t": 313.53333333333336, "x": "この日の委員会には、推理小説好きの議員もいた。"}, {"t": 316.78333333333336, "x": "山中貞則議員だ。"}, {"t": 318.31666666666666, "x": "自分で「推理小説の鬼と言われるほど\n乱読する」と名乗っている。"}, {"t": 322.4, "x": "山中議員は局長にいきなりこう聞いた。"}, {"t": 324.9, "x": "松本清張の「黄色い風土」をお読みになりましたか。"}, {"t": 328.4, "x": "国会で小説の話？"}, {"t": 330.18333333333334, "x": "偽札を作る一味を描いた長い小説だ。"}, {"t": 332.9166666666667, "x": "局長の答えは、こうだった。"}, {"t": 334.85, "x": "「ときどき読みますが、記憶しておりません」。"}, {"t": 337.45, "x": "……正直ね。"}, {"t": 338.45, "x": "山中議員は専門家に勧めるのは\nおかしいがぜひ一読を、と返した。"}, {"t": 342.71666666666664, "x": "ただ一味の大きさについては、\n局長と同じ見方だった。"}, {"t": 346.23333333333335, "x": "大きな組織なら、どこかで仲間割れや裏切りが起きる。"}, {"t": 349.46666666666664, "x": "だから今度の偽造は、そう\n大きな団体ではないだろう、と。"}, {"t": 353.05, "x": "小説好きの勘と、警察の見立てが合ったのね。"}, {"t": 356.26666666666665, "x": "そのうえで山中議員は、ある点に目を向けた。"}, {"t": 359.05, "x": "作った人が何を作らなかったかだ。"}, {"t": 362.06666666666666, "x": "山中議員はこう言っている。"}, {"t": 363.73333333333335, "x": "「今度の犯人は非常に頭がよろしい」。"}, {"t": 366.05, "x": "「高額の紙幣といっても千円だけをつくっておる。"}, {"t": 368.73333333333335, "x": "百円はつくらない」。"}, {"t": 370.06666666666666, "x": "「一万円には絶対に手を出しておらぬ」。"}, {"t": 372.53333333333336, "x": "一万円札のほうが、もうけは大きそうなのに。"}, {"t": 375.48333333333335, "x": "当時はもう、一万円札も五千円札も出回っていた。"}, {"t": 378.93333333333334, "x": "それでも狙われたのは千円札だけだ。"}, {"t": 381.4166666666667, "x": "どうして千円なのかしら。"}, {"t": 383.1333333333333, "x": "作った人の考えは記録に無い。"}, {"t": 385.28333333333336, "x": "ただ翌年の国会で、大蔵省の局長がこう話している。"}, {"t": 389.03333333333336, "x": "今出回っている千円札は古いもので、\n印刷の技術も「幼稚」だ。"}, {"t": 393.46666666666664, "x": "一万円札はそれに比べて\n「ある程度進歩した」技術で刷っている。"}, {"t": 397.75, "x": "そして「まだ一万円についての偽造はございません」。"}, {"t": 400.95, "x": "古いほうが狙われた、ってことね。"}, {"t": 403.1333333333333, "x": "狙われたのが古い千円札だった、ということは確かだ。"}, {"t": 406.5833333333333, "x": "ではその千円札はどれくらい古かったのか。"}, {"t": 409.23333333333335, "x": "これは大蔵省の別の人の答弁で、はっきりする。"}, {"t": 413.05, "x": "答えたのは大蔵省の理財局次長だ。"}, {"t": 415.51666666666665, "x": "当時の千円札が発行されたのは、1950年。"}, {"t": 419.06666666666666, "x": "ところが図案を作ったのは、もっと前の1946年だった。"}, {"t": 423.43333333333334, "x": "4年も前に作った絵なの？"}, {"t": 425.3, "x": "占領下でインフレが激しく物も\n足りない時代だったと説明している。"}, {"t": 429.3333333333333, "x": "刷る機械も戦争の前の型のままだった。"}, {"t": 431.96666666666664, "x": "印刷局は戦災を免れて、古い\n機械がそのまま残っていた。"}, {"t": 436.01666666666665, "x": "次長の言葉はこうだ。"}, {"t": 437.45, "x": "「残ったことが\n今日になってみればある程度災いしておる」。"}, {"t": 440.68333333333334, "x": "機械が残ったのが、かえって裏目に出たのね。"}, {"t": 443.6166666666667, "x": "そしてさらにこう続けた。"}, {"t": 445.28333333333336, "x": "「わが方の印刷の技術がそれだけ\n低いということにもなる」。"}, {"t": 448.8333333333333, "x": "自分たちで言っちゃうの？"}, {"t": 450.3666666666667, "x": "山中議員がすぐにとがめている。"}, {"t": 452.43333333333334, "x": "「理財局長はつまらない答弁をする」。"}, {"t": 454.68333333333334, "x": "今のお札ならまねされても仕方がない、と\n言ったのと同じだという怒りだ。"}, {"t": 458.9166666666667, "x": "次長は新しい千円札では15色くらい\n使うつもりだとも話した。"}, {"t": 463.21666666666664, "x": "色を増やして、まねしにくくするのね。"}, {"t": 465.7, "x": "その新しい千円札をめぐって、\nこの日いちばんもめることになる。"}, {"t": 470.18333333333334, "x": "大蔵省は新しい千円札を出すと決めていた。"}, {"t": 473.1166666666667, "x": "そのための機械に35億円をかける、と議員は言った。"}, {"t": 476.68333333333334, "x": "偽札が出たから、お札ごと変えるの？"}, {"t": 479.25, "x": "議員たちはそう受け取った。"}, {"t": 480.8666666666667, "x": "ある議員は国民の受け止めをこう代弁している。"}, {"t": 483.6, "x": "警察は頼りにならないから、\n新しい千円札を出すのだろう。"}, {"t": 487.3833333333333, "x": "それならもったいない話だ、と。"}, {"t": 489.55, "x": "けっこう厳しいわね。"}, {"t": 490.95, "x": "別の議員はさらにたとえで迫った。"}, {"t": 493.1166666666667, "x": "162枚、16万2千円の偽札に35億円を投じる。"}, {"t": 497.48333333333335, "x": "「鶏を料理するのに牛刀を\nふるわんとする真意がどこにあるか」。"}, {"t": 501.18333333333334, "x": "にわとりを、牛を切る包丁で……。"}, {"t": 503.21666666666664, "x": "小さなことに大げさな道具を\n持ち出す、というたとえだ。"}, {"t": 506.43333333333334, "x": "大蔵政務次官は、これを打ち消した。"}, {"t": 508.81666666666666, "x": "新しい千円札は、1961年度からの5\nか年計画で決めていたもの。"}, {"t": 513.9833333333333, "x": "「今度の問題と直接の関係はございません」。"}, {"t": 516.9, "x": "本当に関係ないの？"}, {"t": 518.4666666666667, "x": "ところが同じ日に、理財局次長はこうも言っている。"}, {"t": 521.5666666666667, "x": "「たまたま今回の偽造を契機といたしておりますが」。"}, {"t": 524.4833333333333, "x": "そのうえで準備は前から進めてきた、と続けた。"}, {"t": 527.7, "x": "「関係ない」と「きっかけにした」が両方あるのね。"}, {"t": 531.0333333333333, "x": "両方が同じ日の記録に並んでいる。\nこの回ではどちらとも決めない。"}, {"t": 535.0166666666667, "x": "局長も念を押している。"}, {"t": 536.55, "x": "新しいお札と捜査は「無関係」で、\n偽札を作った者は追い続ける、と。"}, {"t": 542.1333333333333, "x": "この日の委員会では、町のうわさも持ち出された。"}, {"t": 545.1166666666667, "x": "偽札を警察に届けると、証拠として取り上げられる。"}, {"t": 548.55, "x": "届けた人は千円損をする、といううわさだ。"}, {"t": 551.4666666666667, "x": "それじゃ誰も届けないわよ。"}, {"t": 553.2333333333333, "x": "局長の答えはこうだった。"}, {"t": 554.95, "x": "警察が本物と引き換える、と\n申し上げるのは「不適当」。"}, {"t": 558.6333333333333, "x": "ただ協力の度合いに応じて、\n損をかけないよう報奨を考えている。"}, {"t": 562.6666666666666, "x": "取り換えはしないけど、お礼はする、ってことね。"}, {"t": 565.5333333333333, "x": "そういうことだ。山中議員はさらに踏み込んだ。"}, {"t": 568.4166666666666, "x": "偽の千円札を1枚届けたら、1万円を出せばいい。"}, {"t": 571.9166666666666, "x": "そうすれば国民は「血眼になって」届けるだろう、と。"}, {"t": 575.6, "x": "1枚1万円！"}, {"t": 576.8666666666667, "x": "あくまで議員の提案で、国が決めた額ではない。"}, {"t": 579.7666666666667, "x": "山中議員は見つかった枚数は\n「氷山の一角」だとも言った。"}, {"t": 583.8, "x": "届けられないまま、世の中を回っている\n札があるという見方だ。"}, {"t": 587.6666666666666, "x": "警察はどう思ってたの？"}, {"t": 589.3333333333334, "x": "警察はたくさん出回っているとは考えていなかった。"}, {"t": 592.4666666666667, "x": "見つかった状況から見て、多くが\n流れているとは考えられないと答えている。"}, {"t": 596.8833333333333, "x": "同じ偽札を見て、見立てが二つに割れていたわけだ。"}, {"t": 600.2166666666667, "x": "山中議員は、届かない理由をもう一つ挙げている。"}, {"t": 603.35, "x": "偽札の記番号は新聞に出ていた。"}, {"t": 605.6666666666666, "x": "暇なときに自分の札を見比べて、\nその番号を見つけたとする。"}, {"t": 609.6, "x": "それでも使って相手に気づかれないなら、\n届けずに使ってしまうだろう。"}, {"t": 613.8166666666667, "x": "うわ、言っちゃうのね。"}, {"t": 615.2166666666667, "x": "使えてしまうから、かえって不安が広がらない。"}, {"t": 618.0166666666667, "x": "山中議員は、そこに今度の偽札の怖さを見ていた。"}, {"t": 621.5, "x": "翌年の国会では、別の議員がこう触れている。"}, {"t": 624.5, "x": "「にせ札犯人探しにはずいぶん\n報奨金なんか出しておりますね」。"}, {"t": 628.4, "x": "結局、お礼のお金は出すことになったのね。"}, {"t": 631.3333333333334, "x": "届けてもらわないと、始まらない捜査だったからな。"}, {"t": 635.1333333333333, "x": "8月の委員会では、警察の本気も疑われた。"}, {"t": 638.3833333333333, "x": "質問に立った議員は、こんな言い方をした。"}, {"t": 641.0833333333334, "x": "昔なら特別の捜査本部を作って追ったはずだ。"}, {"t": 644.2333333333333, "x": "それが今度は作っていない、と。"}, {"t": 646.3166666666667, "x": "本部を作らないで追ってたの？"}, {"t": 648.2, "x": "局長の答えはこうだった。"}, {"t": 649.9166666666666, "x": "警察庁はその性格から\n特捜本部という形は作っていない。"}, {"t": 653.8333333333334, "x": "だが警察庁の持つ事件の中で\n「最も重要な事件の一つ」として力を入れている。"}, {"t": 659.45, "x": "形は無いけど本気だ、ってことね。"}, {"t": 661.8666666666667, "x": "見つかった場所が東北と関東に\n広がっていたことも理由に挙げている。"}, {"t": 665.9166666666666, "x": "一つの県に任せられる捜査ではない。"}, {"t": 668.2666666666667, "x": "だから各県に専従の捜査員を置き、\n外回りの警察官まで動かしていた。"}, {"t": 673.05, "x": "局長は162枚という枚数についても触れている。"}, {"t": 676.3666666666667, "x": "金額に直せば十数万円の問題になる。"}, {"t": 679.0666666666667, "x": "だが十数万円の問題だとは考えていない、と言った。"}, {"t": 682.5333333333333, "x": "額の問題じゃない、ってことね。"}, {"t": 684.5833333333334, "x": "警察はこのあとも同じ言い方を繰り返すことになる。"}, {"t": 688.3166666666667, "x": "委員会の9日後、1962年9月6日。"}, {"t": 691.9, "x": "警察は偽札の特徴を、世の中に向けて発表した。"}, {"t": 695.5166666666667, "x": "これには迷いがあった、と\n翌年の国会で局長が明かしている。"}, {"t": 699.3166666666667, "x": "特徴を出せば、偽札が使われなくなるかもしれない。"}, {"t": 702.7666666666667, "x": "使われなくなったら、いいことじゃないの？"}, {"t": 705.2333333333333, "x": "被害は止まる。だが捕まえる機会も減る。"}, {"t": 707.8166666666667, "x": "別の答弁で局長ははっきりこう言っている。"}, {"t": 710.4333333333333, "x": "「行使面がございますと捜査は楽でございます」。"}, {"t": 713.1666666666666, "x": "使われるたびに、手がかりが一つ増えるということだ。"}, {"t": 716.4, "x": "知らせると手がかりが減っちゃうのね。"}, {"t": 718.5833333333334, "x": "そこで局長が置いた目安は、こうだった。"}, {"t": 721.15, "x": "使われなくなっても、ほかの捜査で\n追える体制ができるかどうか。"}, {"t": 724.9, "x": "その目安を見て、9月6日に発表したと答えている。"}, {"t": 728.4833333333333, "x": "逃げられるのを覚悟で、知らせたのね。"}, {"t": 730.9, "x": "この答えを引き出したのは、ある議員の厳しい\n問いだった。"}, {"t": 734.25, "x": "偽札の事件も何も、公開の捜査は\n全部後手に回っている。"}, {"t": 738.1333333333333, "x": "捜査が行き詰まってから出す最後の手なのか、と。"}, {"t": 741.1666666666666, "x": "きつい聞き方ね。"}, {"t": 742.5166666666667, "x": "局長は、何をどう発表するかは\n事件ごとに幹部が判断すると返した。"}, {"t": 747.0833333333334, "x": "発表のあと偽札の特徴を写した\n写真が駅などに張られた。"}, {"t": 750.95, "x": "のちに宇野宗佑議員が、その写真の話をしている。"}, {"t": 754.2833333333333, "x": "横線が違う。聖徳太子の字が違う。から草模様が違う。"}, {"t": 758.2833333333333, "x": "ただ本物と並べて見ないと、\n色合いなどは分かりにくい、と。"}, {"t": 762.0, "x": "本物を見慣れてるつもりでも、\n比べないと分からないものね。"}, {"t": 766.0833333333334, "x": "1962年10月29日には、偽札が\n別の話の物差しになっている。"}, {"t": 771.55, "x": "文化財を話し合う衆議院の小委員会だ。"}, {"t": 774.1666666666666, "x": "ある議員が偽物とされた\n焼き物の騒ぎを取り上げていた。"}, {"t": 777.5, "x": "その議員は偽の千円札と比べてこう言った。"}, {"t": 780.3166666666667, "x": "偽千円札はきょうもまた出て、\n270枚くらいになるだろう。"}, {"t": 784.2333333333333, "x": "金額にすれば27万円だ。それでも\n国はあれだけ動いている。"}, {"t": 788.3333333333334, "x": "焼き物のほうは動いてなかったの？"}, {"t": 790.4666666666667, "x": "議員はそう言って、担当の役所が黙っていると責めた。"}, {"t": 793.7833333333333, "x": "27万円の偽札のために国が動く。"}, {"t": 796.5833333333334, "x": "その動き方が、ほかの役所を\n責める物差しにされていた。"}, {"t": 800.2833333333333, "x": "それだけ目立つ捜査だったのね。"}, {"t": 802.8833333333333, "x": "発表のあとも、偽札は出た。"}, {"t": 805.0166666666667, "x": "記号を変えた別の種類が、次々に見つかっている。"}, {"t": 808.1833333333333, "x": "1962年10月22日、新潟県で\n「HD」の記号の偽札が出た。"}, {"t": 813.9, "x": "そしてそこで、新しい種類はぴたりと止まる。"}, {"t": 816.8333333333334, "x": "止まったの？"}, {"t": 817.7666666666667, "x": "止まった。11月の終わりの国会で、\n局長がそう答えている。"}, {"t": 821.8, "x": "「先月の二十二日以来、新しい形の\nにせ札は発見されておりません」。"}, {"t": 826.3166666666667, "x": "この時点で見つかったのは295枚。"}, {"t": 828.8, "x": "種類は20種類だ。"}, {"t": 830.3, "x": "見つかった場所は、20の都府県に広がっていた。"}, {"t": 833.4666666666667, "x": "秋田から新潟まで……ずいぶん広いわね。"}, {"t": 836.15, "x": "新しい記号が出ると、\n見分けるのにも手間がかかった。"}, {"t": 839.3333333333334, "x": "WRのような前からの記号なら、\n警察署でもすぐ分かる。"}, {"t": 843.0833333333334, "x": "特徴が現場までもう行き渡っているからだ。"}, {"t": 845.6333333333333, "x": "だが新しい記号だと、最後に\n偽札だと決めるのは警察庁になる。"}, {"t": 849.8833333333333, "x": "決めるまでに、1日以上かかったこともあると\n局長は言っている。"}, {"t": 853.8166666666667, "x": "1日あったら、ずいぶん遠くまで行けちゃうわね。"}, {"t": 856.7333333333333, "x": "額面で言えば、295枚で29万5千円。"}, {"t": 860.05, "x": "局長はこう続けた。"}, {"t": 861.5666666666667, "x": "「これは決して経済的価値の問題ではなくて、\n通貨の信用の問題」。"}, {"t": 865.85, "x": "お金そのものを信じられるか\nどうかの話だ、ということだ。"}, {"t": 869.95, "x": "局長はこの捜査の難しさを、\nふつうの事件と比べている。"}, {"t": 873.6666666666666, "x": "ふつうは犯罪の現場があって、そこを中心に調べる。"}, {"t": 876.9666666666667, "x": "偽札の捜査は、その現場を見つけるところから始まる。"}, {"t": 880.4833333333333, "x": "「犯罪現場をまず第一段階において発見して」。"}, {"t": 883.5833333333334, "x": "どこで使われたかから、探さなきゃいけないのね。"}, {"t": 886.65, "x": "だから警察は、二つの方向から追っていた。"}, {"t": 889.55, "x": "一つは偽札そのものを調べることだ。"}, {"t": 892.05, "x": "どんな紙を使ったか。"}, {"t": 893.4, "x": "どんな方法で刷ったか。"}, {"t": 894.9666666666667, "x": "そこからどんな人なら作れるのかを絞っていく。"}, {"t": 897.8, "x": "もう一つは作れそうな人や機械を当たることだった。"}, {"t": 900.9, "x": "ここで出てくる数字が大きい。"}, {"t": 902.6166666666667, "x": "全国の印刷の業者は、約20万人。"}, {"t": 905.55, "x": "20万人！"}, {"t": 906.5666666666667, "x": "局長はすぐに付け加えている。"}, {"t": 908.5166666666667, "x": "20万人を全部、疑いの目で扱うわけではない、と。"}, {"t": 911.9833333333333, "x": "その中からほんのわずかを絞り出す捜査だ、と。"}, {"t": 914.9333333333333, "x": "そのために全国で指定した\n専従の捜査員は、約1600名。"}, {"t": 919.2333333333333, "x": "1600人で20万人から……気の遠くなる話ね。"}, {"t": 922.8333333333334, "x": "時間がかかることもある、と局長は認めた。"}, {"t": 925.7166666666667, "x": "そのうえで「決して途中において\nこの事件を放棄することがない」と言った。"}, {"t": 930.05, "x": "委員会の議員は、それでも不満だった。"}, {"t": 932.4666666666667, "x": "警察は「ほんろうされて、かけずり\n回されている」ように見える、と。"}, {"t": 936.5333333333333, "x": "別の議員はもっとはっきり言った。"}, {"t": 938.5333333333333, "x": "今のところ犯人との背比べでは\n「完全に警察の敗北」だ。"}, {"t": 942.7, "x": "捜査の方針を根本から考え直すべきではないか、と。"}, {"t": 946.3, "x": "負けだって言われちゃったのね。"}, {"t": 948.0833333333334, "x": "局長は、一つの県の区切りで\n解決できる事件ではないと答えた。"}, {"t": 952.3166666666667, "x": "翌年3月には、局長はこうも言っている。"}, {"t": 955.15, "x": "疑われる点は一つずつつぶしてきた。"}, {"t": 957.6166666666667, "x": "今の段階では「相当の範囲にまでしぼってきておる」。"}, {"t": 960.8333333333334, "x": "ただ怪しいというだけで被疑者として\n扱うことは、人権の問題があってしない。"}, {"t": 965.5833333333334, "x": "絞り込んではいたのね。"}, {"t": 967.1166666666667, "x": "絞り込んではいた。だが国会の記録に\n名前が出ることはなかった。"}, {"t": 971.6666666666666, "x": "年が明けて1963年。"}, {"t": 973.95, "x": "しばらく止まっていた新しい種類が、静岡県で出た。"}, {"t": 977.3166666666667, "x": "静岡では偽札を使った人の顔を見た人がいた。"}, {"t": 980.6166666666667, "x": "目撃したのは約5名。そのうち\n2名がはっきり覚えていた。"}, {"t": 984.3833333333333, "x": "どうして覚えていられたの？"}, {"t": 986.0333333333333, "x": "「こういう偽券が出た」と、\n警察が3時間前に知らせてあった。"}, {"t": 989.8666666666667, "x": "そのため2名の記憶は\n「比較的確か」だった、と局長は言う。"}, {"t": 994.2666666666667, "x": "3時間の差で、覚えている人がいたのね。"}, {"t": 997.05, "x": "この証言から、静岡県警の鑑識課が\n顔の写真を作った。"}, {"t": 1001.1, "x": "顔の部品を組み合わせる、モンタージュ写真だ。"}, {"t": 1003.8, "x": "これが全国に手配された。"}, {"t": 1005.6833333333333, "x": "顔が出たなら、もうすぐ捕まりそう。"}, {"t": 1008.05, "x": "そう考えた議員がいた。宇野宗佑議員だ。"}, {"t": 1010.8166666666667, "x": "のちに総理大臣になる人だな。"}, {"t": 1012.9166666666666, "x": "1963年3月14日、\n衆議院の地方行政委員会で質問に立った。"}, {"t": 1018.35, "x": "その日の議題には\n「にせ札事件に関する問題」と書かれている。"}, {"t": 1022.4166666666666, "x": "宇野議員は自分の準備をこう振り返った。"}, {"t": 1024.7833333333333, "x": "自分の質問が先か、犯人の逮捕が\n先か、とまで考えていた。"}, {"t": 1029.15, "x": "だが質問の日になっても、\n足取りは分かっていなかった。"}, {"t": 1032.6166666666666, "x": "顔写真まで出たのに……。"}, {"t": 1034.6666666666667, "x": "宇野議員の質問の最初の一言が、\nこの回の題になっている。"}, {"t": 1038.5333333333333, "x": "「チ第三七号事件といわれる\nいわゆる千円札の偽造事件」。"}, {"t": 1042.2166666666667, "x": "今回調べた範囲では、この呼び名が\n国会に出てくるのはこの日だけだ。"}, {"t": 1046.55, "x": "「チ」って、何のチなの？"}, {"t": 1048.2333333333333, "x": "頭の「チ」が何を表すかは、\n国会の記録には出てこない。"}, {"t": 1052.2833333333333, "x": "じゃあ37のほうは？"}, {"t": 1053.8333333333333, "x": "局長はこの日、昔の偽の千円札を\n「二三号」と呼んでいる。"}, {"t": 1058.2666666666667, "x": "警察が偽札に番号を付けて、\n呼び分けていたことは分かる。"}, {"t": 1062.15, "x": "37番目の偽札、ってこと？"}, {"t": 1064.6333333333334, "x": "そう読みたくなるが、記録にはそこまで書いていない。"}, {"t": 1067.5833333333333, "x": "宇野議員はこの事件を三つの段階に分けて話した。"}, {"t": 1070.75, "x": "一つ目は偽札が出てから特徴を公表するまで。"}, {"t": 1073.8666666666666, "x": "二つ目は特徴をもとに一般の人の手を借りた捜査。"}, {"t": 1077.2, "x": "三つ目は静岡の偽札からモンタージュの手配まで。"}, {"t": 1080.3166666666666, "x": "世間では大詰めだと、いろいろな\nうわさが飛んでいたという。"}, {"t": 1083.6166666666666, "x": "大詰め、だったらよかったのにね。"}, {"t": 1086.3, "x": "モンタージュについては、\n局長自身が弱いところを認めている。"}, {"t": 1089.8833333333334, "x": "最初に清水で使われたとき、\n使った人は帽子なしだった。"}, {"t": 1093.6166666666666, "x": "次の静岡市では、帽子をかぶって現れている。"}, {"t": 1096.55, "x": "めがねもかけていたりいなかったりだった。"}, {"t": 1098.95, "x": "わざと見た目を変えてたの？"}, {"t": 1100.65, "x": "警察は変装することは予期していたと答えている。"}, {"t": 1103.7166666666667, "x": "ほくろや傷のような細かいところは\n「まだ不完全」だとも言った。"}, {"t": 1107.6166666666666, "x": "それでも写真を出すほうが捜査に役立つと判断した。"}, {"t": 1111.0, "x": "あとから直したりはしなかったの？"}, {"t": 1113.0833333333333, "x": "直していない。理由がある。"}, {"t": 1114.7666666666667, "x": "目撃した人の記憶には、報道などで\n聞いた話が混ざってくる。"}, {"t": 1118.8166666666666, "x": "局長はこれを「先入主が入って」と言った。"}, {"t": 1121.7333333333333, "x": "聞き直すほど最初の印象が薄れて、\nかえって危ないという判断だ。"}, {"t": 1125.9333333333334, "x": "最初の記憶が、いちばん確かってことね。"}, {"t": 1128.75, "x": "委員会ではめがねをかけていない\n顔も作れないかと聞かれた。"}, {"t": 1132.1333333333334, "x": "局長の答えは「現在検討している段階」だった。"}, {"t": 1135.6333333333334, "x": "清水でめがねなしの姿を見た\n人は、偽札だと思っていなかった。"}, {"t": 1139.8166666666666, "x": "だからはっきりした顔を言葉にできなかったという。"}, {"t": 1143.3166666666666, "x": "局長が認めたことは、もう一つある。"}, {"t": 1145.85, "x": "あのモンタージュは「比較的特徴のない顔」だった。"}, {"t": 1149.2666666666667, "x": "特徴がないと、どうなるの？"}, {"t": 1151.2, "x": "似ている人が、たくさん出てくる。"}, {"t": 1153.3, "x": "実際にたびたび職務質問を受けた人がいた。"}, {"t": 1156.25, "x": "「不愉快な目にあった」という\n報告が、警察に届いている。"}, {"t": 1160.0, "x": "何もしてないのに？"}, {"t": 1161.3833333333334, "x": "静岡では写真が出てから一両日のあいだ、\n多くの人が似ていると言われた。"}, {"t": 1165.9, "x": "局長は「多少御迷惑をかけた例」があったと\n認めている。"}, {"t": 1169.5833333333333, "x": "そこで警察庁は、全国に電話と文書で指示を出した。"}, {"t": 1173.15, "x": "似ているからといって、被疑者にするな。"}, {"t": 1175.5, "x": "「不審者であっても被疑者ではない」。"}, {"t": 1177.5666666666666, "x": "似ているのと、やったのとは別だもんね。"}, {"t": 1180.1166666666666, "x": "質問した議員も、こう心配していた。"}, {"t": 1182.65, "x": "写真の正確さが低いと、\nほかの人にかける迷惑は大きい。"}, {"t": 1186.4833333333333, "x": "委員の中にも、似ためがねの人がいて\n冷やかされている、と冗談まで言っている。"}, {"t": 1191.2333333333333, "x": "笑い話で済めばいいけど。"}, {"t": 1193.0666666666666, "x": "済まない人もいたはずだ。だから\nこの回では、その写真は出さない。"}, {"t": 1197.1166666666666, "x": "似ているかどうかで誰かを見る\n材料に、してほしくないからだ。"}, {"t": 1201.2666666666667, "x": "同じ3月14日、宇野議員は\nまずお金のことを聞いていた。"}, {"t": 1204.9166666666667, "x": "これまでの捜査に、いくら使ったのか。"}, {"t": 1207.3166666666666, "x": "局長の答えは「約三千二百万円」。"}, {"t": 1210.0333333333333, "x": "その時点で見つかった偽札は325枚。"}, {"t": 1212.9, "x": "額面で32万5千円だ。"}, {"t": 1215.15, "x": "100倍近くかかってるじゃない。"}, {"t": 1217.1166666666666, "x": "宇野議員も「まことに残念」と言った。"}, {"t": 1219.5666666666666, "x": "そのうえでこう問いかけている。"}, {"t": 1221.2166666666667, "x": "新しい千円札が出るまでに、\n捕まえられる自信はあるのか。"}, {"t": 1224.95, "x": "どうして新しいお札が関係あるの？"}, {"t": 1227.3166666666666, "x": "宇野議員の読みはこうだ。"}, {"t": 1228.75, "x": "新しいお札が出れば、古い千円札は刷られなくなる。"}, {"t": 1232.15, "x": "偽札を使う機会も、だんだん減っていく。"}, {"t": 1234.85, "x": "使われなくなれば、使う場面で\n押さえることもできない。"}, {"t": 1238.2, "x": "時間切れが来る、ってことね。"}, {"t": 1240.1, "x": "局長は期限は約束しなかった。"}, {"t": 1242.35, "x": "「相手のあることでございますから\nいつまでと申し上げることは不適当」。"}, {"t": 1246.1333333333334, "x": "宇野議員は別の数字も挙げている。"}, {"t": 1248.15, "x": "1962年度に見つかった偽の千円札は518枚。"}, {"t": 1252.45, "x": "そのうち308枚が、チ三七号だった。"}, {"t": 1255.6666666666667, "x": "半分よりずっと多いのね。"}, {"t": 1257.3666666666666, "x": "銀行券の偽造全体でも、前の年と\n比べて大きく増えていた。"}, {"t": 1261.35, "x": "宇野議員はその増え方を「四五〇％」と言っている。"}, {"t": 1265.7166666666667, "x": "宇野議員は法律の話にも踏み込んだ。"}, {"t": 1268.1333333333334, "x": "お札の偽造を裁くのは、刑法の148条だ。"}, {"t": 1271.45, "x": "使う目的で偽造した者は「\n無期又ハ三年以上ノ懲役ニ処ス」。"}, {"t": 1275.85, "x": "無期まであるのね。"}, {"t": 1277.0833333333333, "x": "ここで答えた大臣がうっかりしている。"}, {"t": 1279.3333333333333, "x": "国家公安委員長の篠田弘作だ。"}, {"t": 1281.6333333333334, "x": "最初は「三年以上の懲役です。"}, {"t": 1283.8, "x": "大体少し軽過ぎるじゃないか」と答えた。"}, {"t": 1286.7333333333333, "x": "あれ、無期は？"}, {"t": 1287.8666666666666, "x": "法務省の刑事局長の説明のあとで、言い直している。"}, {"t": 1291.3, "x": "「実は無期の方に気がつかなくて」。"}, {"t": 1293.3833333333334, "x": "「逆に重過ぎるのではないかと思います」。"}, {"t": 1295.8333333333333, "x": "「軽すぎる」から「重すぎる」に変わったの？"}, {"t": 1298.7833333333333, "x": "同じ日の、同じ大臣の言葉だ。"}, {"t": 1301.1166666666666, "x": "法務省の刑事局長は、別の話もしている。"}, {"t": 1304.1666666666667, "x": "刑法を作り直す下書きでは、\n無期を外す案になっていた。"}, {"t": 1307.8, "x": "懲役2年から15年にする案だ。"}, {"t": 1310.2, "x": "偽札が騒がれてる最中に、軽くする案なの？"}, {"t": 1313.4, "x": "局長は今起きている事件も考えに\n入れて議論してほしいと答えている。"}, {"t": 1317.5333333333333, "x": "宇野議員の考えは、さらに先にあった。"}, {"t": 1320.0333333333333, "x": "使う目的がなくても、作っただけで\n罰するべきではないか。"}, {"t": 1323.8833333333334, "x": "趣味で作った、って言い逃れをさせないため？"}, {"t": 1326.5833333333333, "x": "そうだ。局長は目的は\n本人の言い分では決まらないと答えた。"}, {"t": 1330.5, "x": "客観的な証拠で、使う目的があったかを決めるという。"}, {"t": 1334.6833333333334, "x": "この日、宇野議員はもう一つの偽札を持ち出している。"}, {"t": 1338.0, "x": "1958年、青森県で偽の千円札が23枚見つかった。"}, {"t": 1342.7333333333333, "x": "宇野議員によれば、その犯人も上がっていない。"}, {"t": 1345.5666666666666, "x": "同じ人が作った、ってこと？"}, {"t": 1347.65, "x": "局長はその偽札を「二三号」と呼んだ。"}, {"t": 1350.7333333333333, "x": "写真を使って版を作る技術は、三七号と共通している。"}, {"t": 1354.7333333333333, "x": "ただ細かく比べると、一致しないところもある。"}, {"t": 1357.6166666666666, "x": "同じ犯人だと決めるのは\n「捜査上少し早計」だと局長は言った。"}, {"t": 1362.05, "x": "それでもこう付け加えている。"}, {"t": 1363.75, "x": "「念頭には、常に二三号事件というものがある」。"}, {"t": 1366.9833333333333, "x": "頭のすみにずっと置いてたのね。"}, {"t": 1369.0333333333333, "x": "外国で刷られたのでは、といううわさもあった。"}, {"t": 1371.7, "x": "警察は国際刑事警察機構にも連絡して、調べている。"}, {"t": 1375.6333333333334, "x": "そのうえで拠点が外国にあるとは\n考えていないと答えた。"}, {"t": 1379.05, "x": "人数も一人とは言えないが\n多くはないという見立てだった。"}, {"t": 1382.2333333333333, "x": "最初の委員会でも、外国が\n後ろにいるのではと聞いた議員がいた。"}, {"t": 1386.1, "x": "局長は、情報はいろいろあるとまず認めた。"}, {"t": 1388.8666666666666, "x": "ただ国会で話せるほどの確かさのものではない、と\n答えている。"}, {"t": 1392.7666666666667, "x": "国の外まで調べて、また国内に戻ってきたのね。"}, {"t": 1396.2666666666667, "x": "二三号とつながるのかどうか。"}, {"t": 1398.2666666666667, "x": "記録の中では、つながったとも\n別だとも決まっていない。"}, {"t": 1402.25, "x": "宇野議員は作った人の動機も聞いた。"}, {"t": 1404.55, "x": "金もうけなら、もっと危ない\n所まで行ってたくさん使うはずだ。"}, {"t": 1408.3666666666666, "x": "趣味でやっているのではないか、と。"}, {"t": 1410.4833333333333, "x": "局長はどう答えたの？"}, {"t": 1412.1, "x": "まず、たくさん作られているとは\n考えられないと言った。"}, {"t": 1415.2666666666667, "x": "「これをもって生計を立てるというふうなことは、\nわれわれの方では考えられない」。"}, {"t": 1419.7, "x": "偽札で暮らしてるわけじゃない、ってことね。"}, {"t": 1422.3666666666666, "x": "そのうえでいくつかの見方を並べている。"}, {"t": 1424.6666666666667, "x": "ほかに仕事を持ちながら、自分の技術を\n誇っているのかもしれない。"}, {"t": 1428.6, "x": "それ以外のことも考えられる、と。"}, {"t": 1430.7666666666667, "x": "最後は「あらゆる面が想像できます」で締めくくった。"}, {"t": 1434.25, "x": "結局、分からないのね。"}, {"t": 1436.1333333333334, "x": "分からない。局長が言い切れたのは、\n生計の話まででな。"}, {"t": 1439.8, "x": "この回でも作った人の姿をそれ以上は推し量らない。"}, {"t": 1443.15, "x": "343枚を額面どおり使っても、\n34万3千円にしかならない。"}, {"t": 1448.1333333333334, "x": "それだけははっきりしている。"}, {"t": 1450.4, "x": "静岡県では知事が懸賞を口にしていた。"}, {"t": 1453.0833333333333, "x": "犯人が捕まったら、協力した人に100万円を出す、と。"}, {"t": 1457.0333333333333, "x": "100万円！"}, {"t": 1457.9666666666667, "x": "宇野議員はそのお金の出どころを問題にした。"}, {"t": 1460.6, "x": "お札の偽造の捜査は、国のお金で\nまかなう決まりになっている。"}, {"t": 1464.3333333333333, "x": "篠田大臣も警察法施行令の条文を挙げて\nそれを認めた。"}, {"t": 1468.0666666666666, "x": "県のお金で懸賞を出すのは「あまり\n感心できないのではないか」。"}, {"t": 1471.8333333333333, "x": "ただ善意から\n出たものなら、出していけないとも言えない。"}, {"t": 1475.05, "x": "どっちなのよ。"}, {"t": 1476.1333333333334, "x": "自治省の担当者も、一律に違法とは\n言い切れないと答えている。"}, {"t": 1479.9833333333333, "x": "宇野議員自身も、知事のやり方が\n悪いとは考えていないと断っている。"}, {"t": 1484.2166666666667, "x": "1枚1万円の提案。報奨金。そして100万円の懸賞。"}, {"t": 1488.1166666666666, "x": "協力した人へのお礼の話が、\n何度も国会に出てきている。"}, {"t": 1492.1166666666666, "x": "それだけ、一般の人の目が頼りだったのね。"}, {"t": 1495.15, "x": "民間の協力は静岡のあと非常に\n高まった、と警察庁長官も言った。"}, {"t": 1499.8333333333333, "x": "それでも見つけたのは銀行のほうが多かった。"}, {"t": 1503.0833333333333, "x": "1963年の春、国会の空気が変わる。"}, {"t": 1506.5, "x": "吉展ちゃん事件など、誘拐の事件が相次いでいた。"}, {"t": 1509.7333333333333, "x": "5月7日の委員会では、篠田大臣がこう漏らしている。"}, {"t": 1513.2166666666667, "x": "帝国ホテルの殺人や偽札では、捜査が\n「何らかの欠陥」を持っているのでは、と考えていた。"}, {"t": 1519.5, "x": "大臣がそんなことまで言ったの？"}, {"t": 1521.5833333333333, "x": "言った。偽札はほかの未解決の事件と\n並べて語られるようになる。"}, {"t": 1525.8, "x": "同じ日に別の議員はこう言っている。"}, {"t": 1527.9166666666667, "x": "偽札はまだ解決されておらず、\nしかも「ごく最近出てきておる」。"}, {"t": 1532.0333333333333, "x": "同じ日の参議院で、篠田大臣は\n事件を二つに分けて話した。"}, {"t": 1536.1166666666666, "x": "偽札などの事件は、犯人が逃げているか隠れている。"}, {"t": 1539.5166666666667, "x": "誰が犯人なのかが、まだ分かっていない。"}, {"t": 1542.0833333333333, "x": "誘拐は、犯人が自分から金を\n求めて出てくる。そこが違う、と。"}, {"t": 1546.5333333333333, "x": "偽札は、顔を出さない事件ってことね。"}, {"t": 1549.2666666666667, "x": "大臣の分け方では、そういうことになる。"}, {"t": 1551.8166666666666, "x": "5月の終わりには、別の議員がこう比べた。"}, {"t": 1554.55, "x": "選挙の偽の証紙の犯人は捕まったのに、\n偽札の犯人は捕まらない。"}, {"t": 1559.2833333333333, "x": "比べられちゃうのね。"}, {"t": 1560.65, "x": "12月にはある議員が国民の気持ちをこう言った。"}, {"t": 1563.5833333333333, "x": "「国民としてはがまんできないんですよ」。"}, {"t": 1565.8333333333333, "x": "その年の2月には、別の議員が\n警察の人の配り方を問題にしていた。"}, {"t": 1570.5833333333333, "x": "現場の手が足りないから、\n偽札の犯人の「めどもつかない」のではないか。"}, {"t": 1575.35, "x": "人が足りない、って話にまでなったのね。"}, {"t": 1578.0166666666667, "x": "翌年の1月、新しい国家公安委員長はこう答えている。"}, {"t": 1581.8833333333334, "x": "吉展ちゃん事件や偽札など\n「つかまらぬ者もあります」。"}, {"t": 1585.45, "x": "それでも全体で見れば、警察はよくやっている、と。"}, {"t": 1588.7166666666667, "x": "かばう人もいたのね。"}, {"t": 1590.2, "x": "かばう言葉の中にも、偽札は未解決として入っている。"}, {"t": 1594.5333333333333, "x": "この偽札は国会で別のたとえにも使われた。"}, {"t": 1597.5333333333333, "x": "物の値段が上がると、お金の値打ちは下がる。"}, {"t": 1600.3, "x": "1962年8月の委員会で、ある議員は\n政府をこう皮肉った。"}, {"t": 1604.8333333333333, "x": "お札を増やして物価を上げる\n政府こそ、にせ札づくりではないか。"}, {"t": 1608.7833333333333, "x": "ずいぶん強い言い方ね。"}, {"t": 1610.3666666666666, "x": "1963年10月の本会議では、\n別の議員がこう言っている。"}, {"t": 1614.75, "x": "「昭和三十五年末の千円札が\n八百円にしか通用しない」。"}, {"t": 1618.6166666666666, "x": "「千円札の二割二百円分は、\nにせ札と同様になった」。"}, {"t": 1622.35, "x": "物価の話にまで、にせ札が出てくるのね。"}, {"t": 1625.3333333333333, "x": "それだけ、この言葉が\nみんなの頭にあったということだ。"}, {"t": 1628.6833333333334, "x": "大蔵政務次官は、最初の委員会でこう言っていた。"}, {"t": 1631.8, "x": "日本の国民は、通貨に対する信頼度が高い。"}, {"t": 1634.9, "x": "偽札が出たのは、その信頼の上だった。"}, {"t": 1637.75, "x": "信じてるから、確かめずに受け取るのよね。"}, {"t": 1640.5, "x": "局長の言った「通貨の信用の問題」とは、\nそういうことだろう。"}, {"t": 1645.15, "x": "1963年11月1日。"}, {"t": 1647.8833333333334, "x": "新しい千円札が、世の中に出た。"}, {"t": 1650.35, "x": "顔は聖徳太子から、伊藤博文に変わった。"}, {"t": 1653.45, "x": "宇野議員が言ってた、伊藤博文の登場ね。"}, {"t": 1656.2833333333333, "x": "宇野議員は3月に、新しい\n千円札は9月からと見込んでいた。"}, {"t": 1660.2833333333333, "x": "実際の発行は、それより2か月遅い11月1日だった。"}, {"t": 1664.2833333333333, "x": "大蔵政務次官は1962年8月に、\n切り替えの見込みを話していた。"}, {"t": 1669.2833333333333, "x": "新しい札は1963年度のうちに出し、\n1965年度のうちに全部入れ替える。"}, {"t": 1675.2666666666667, "x": "古い聖徳太子の千円札は、1950年から出されていた。"}, {"t": 1679.55, "x": "日本銀行がそれを新しく出すのを\nやめたのは、1965年1月4日だ。"}, {"t": 1684.8666666666666, "x": "しばらくは古いのと新しいのが\n一緒に使われてたのね。"}, {"t": 1688.2166666666667, "x": "局長も当分のあいだは古い\n千円札も通用すると言っている。"}, {"t": 1691.9166666666667, "x": "では新しい千円札が出たあと、偽札はどうなったか。"}, {"t": 1695.35, "x": "翌年2月の国会で、局長が答えている。"}, {"t": 1698.35, "x": "「この三百四十三枚に含まれます一連の\nにせ札につきましては出ておりません」。"}, {"t": 1703.25, "x": "出なくなったの？"}, {"t": 1704.4166666666667, "x": "出ていない。"}, {"t": 1705.1666666666667, "x": "新しい千円札をコピーで写した、偽札とも\n言えない模造品が1件あっただけだ。"}, {"t": 1710.3833333333334, "x": "じゃあ、新しいお札で止まったのね。"}, {"t": 1712.7166666666667, "x": "止まった。だが捕まってはいない。"}, {"t": 1714.7666666666667, "x": "警察は偽の千円札を東京に\n集めて、もう一度調べ直していた。"}, {"t": 1719.7333333333333, "x": "1964年2月の答弁が、国会の記録に\n残る最後の枚数になる。"}, {"t": 1724.7666666666667, "x": "「現在二十五種類、三百四十三枚」。"}, {"t": 1727.4666666666667, "x": "1961年から数えた合計だ。"}, {"t": 1730.3833333333334, "x": "最初の162枚から、倍以上になったのね。"}, {"t": 1733.65, "x": "種類も20種類から25種類に増えている。"}, {"t": 1736.4166666666667, "x": "局長は人と物と場所の三つから追ってきたと言った。"}, {"t": 1739.7, "x": "使われた場面。作る技術。寄せられた情報。"}, {"t": 1742.7333333333333, "x": "その上でこう答えている。"}, {"t": 1744.25, "x": "「まだ被疑者を特定するようなところまで\n至っておらない」。"}, {"t": 1747.45, "x": "2年以上たっても……。"}, {"t": 1748.85, "x": "同じ月の別の委員会でも、答えは同じだった。"}, {"t": 1751.9833333333333, "x": "「まだ容疑者を確定するに至っておりません」。"}, {"t": 1754.4833333333333, "x": "見通しを聞かれても「\n申し上げるまでに至っておりません」。"}, {"t": 1757.8, "x": "見通しも言えないのね。"}, {"t": 1759.3, "x": "その日の答弁では、ほかの事件も\n未逮捕として並んでいた。"}, {"t": 1762.9666666666667, "x": "吉展ちゃん事件。草加次郎の事件。"}, {"t": 1765.3833333333334, "x": "そして偽造紙幣だ。"}, {"t": 1766.7333333333333, "x": "局長は次に使われたときのための手も述べている。"}, {"t": 1769.8, "x": "使われた直後に、すぐ\n届けてもらうよう広報を徹底する。"}, {"t": 1773.4, "x": "その届けにすぐ動ける態勢を固める。"}, {"t": 1775.9666666666667, "x": "次が来るのを、待つしかないのね。"}, {"t": 1778.7, "x": "偽札が出なくなると、議員はこう聞いた。"}, {"t": 1781.2666666666667, "x": "「もう打ち切ってしまったのではないのですか」。"}, {"t": 1783.6, "x": "局長は「\n決してほうってあるようなことはございません」と\n答えた。"}, {"t": 1787.4666666666667, "x": "翌月にも警察は\n「継続的に捜査を続行しておる」と言っている。"}, {"t": 1791.8833333333334, "x": "でも偽札が出ないなら、使った\n場面からは追えないわよね。"}, {"t": 1795.4833333333333, "x": "局長もそれを認めている。"}, {"t": 1797.2, "x": "新しい偽札が見つからないので、\n使った面からの捜査はできていない。"}, {"t": 1801.5, "x": "残ったのは技術の面から人を当たる捜査だった。"}, {"t": 1804.6166666666666, "x": "特徴を発表した日の心配が、そのまま来ちゃったのね。"}, {"t": 1808.2666666666667, "x": "使われなくなっても追える体制、というあの目安だな。"}, {"t": 1811.4, "x": "1964年4月には、大蔵委員会でも声が上がっている。"}, {"t": 1815.55, "x": "にせ千円札の問題が起きて2年くらい\nたつのに解決しない、と。"}, {"t": 1819.6166666666666, "x": "同じ月の法務委員会では、別の議員が並べてみせた。"}, {"t": 1823.1333333333334, "x": "偽札。吉展ちゃん。草加次郎。"}, {"t": 1825.55, "x": "重要な犯罪の「迷宮入りがふえておる」という\n言い方だった。"}, {"t": 1829.2666666666667, "x": "それから7年後の1971年。"}, {"t": 1832.0, "x": "ある議員が国会でこう言っている。"}, {"t": 1833.8666666666666, "x": "「かつてのにせ札事件」。"}, {"t": 1835.4833333333333, "x": "かつての、になっちゃったのね。"}, {"t": 1837.4833333333333, "x": "その議員は迷宮入りや捜査を縮めた\n事件がふえているのでは、と問うた。"}, {"t": 1841.65, "x": "偽札はその例として名前を挙げられた。"}, {"t": 1844.1, "x": "今回調べた範囲で、国会が\nこの事件に触れるのはここまでだ。"}, {"t": 1848.5833333333333, "x": "作った人は分からないままだ。"}, {"t": 1850.4833333333333, "x": "罪を問える期限、つまり時効も、もう過ぎている。"}, {"t": 1853.5666666666666, "x": "いつ過ぎたの？"}, {"t": 1854.65, "x": "そこがはっきりしない。"}, {"t": 1856.0, "x": "資料によって、1973年とも1976年とも書かれている。"}, {"t": 1861.1, "x": "どちらが正しいかは、一次資料では\n確かめられなかった。"}, {"t": 1864.7, "x": "時効の年まで、割れてるのね。"}, {"t": 1866.8333333333333, "x": "割れている。だからこの回では、\n年を一つに決めない。"}, {"t": 1870.1, "x": "確かなのは今からこの偽札の罪を\n問う道はないということだ。"}, {"t": 1874.0, "x": "343枚も見つかって、誰も裁かれないまま……。"}, {"t": 1877.6333333333334, "x": "裁かれないまま、千円札の顔のほうが変わった。"}, {"t": 1880.75, "x": "新しい千円札と偽札について、政府は\n「直接の関係」は無いと言った。"}, {"t": 1885.8333333333333, "x": "大蔵省の次長は、きっかけにしたとも言った。"}, {"t": 1888.65, "x": "結果だけを並べると、こうなる。"}, {"t": 1890.6833333333334, "x": "新しい千円札が出たあと、\nこの一連の偽札は出ていない。"}, {"t": 1894.5333333333333, "x": "捕まえる前に、偽札の出番がなくなったのね。"}, {"t": 1898.2166666666667, "x": "今回開いたのは、1962年から\n1971年までの国会の記録だ。"}, {"t": 1903.95, "x": "この偽札が質問に出てくるのは、\n1962年8月から1964年4月に集中している。"}, {"t": 1910.9833333333333, "x": "最初は大蔵委員会。そのあとは\n地方行政委員会が中心だった。"}, {"t": 1915.1666666666667, "x": "お金の委員会から、警察の委員会に移ったのね。"}, {"t": 1918.5, "x": "お札の話から、捕まらない話に移ったとも言える。"}, {"t": 1921.9333333333334, "x": "答弁に立つ警察庁の刑事局長は、\n途中で人が替わっている。"}, {"t": 1925.9833333333333, "x": "国家公安委員長も、篠田弘作から次の人に替わった。"}, {"t": 1929.75, "x": "答える人が替わっても、\n答えの中身は「まだ」のままだった。"}, {"t": 1933.8166666666666, "x": "人が替わっても、偽札の答えだけは\n変わらなかったのね。"}, {"t": 1937.5666666666666, "x": "最初の162枚から最後の343枚まで、\n国会は同じことを何度も聞いている。"}, {"t": 1943.3, "x": "いつ捕まるのか。届けた人は損をしないのか。"}, {"t": 1946.1666666666667, "x": "新しいお札で終わりにするのか。"}, {"t": 1948.3333333333333, "x": "どれも、今聞いても気になる質問ね。"}, {"t": 1950.9, "x": "逆にこの回で言わなかったこともある。"}, {"t": 1953.1333333333334, "x": "偽札が使われた店の名前や、買われた品物。"}, {"t": 1956.3666666666666, "x": "最後の1枚が見 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
