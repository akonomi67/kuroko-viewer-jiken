<script>
const D={"name": "074", "file": "074_編集用", "dur": 2160.85, "segs": [], "subs": [{"t": 0.0, "x": "一九七四年三月、兵庫県西宮市。"}, {"t": 3.4, "x": "知的障害のある子どもたちが暮らす入所施設で、\n二日のあいだに二人の園児がいなくなった。"}, {"t": 9.033333333333333, "x": "二人とも、学園の敷地の中にある\n汚水の浄化槽で見つかった。"}, {"t": 13.2, "x": "浄化槽？"}, {"t": 14.083333333333334, "x": "建物から出る汚水を処理するための、\n地面に埋まった設備だ。"}, {"t": 17.833333333333332, "x": "施設の名前は甲山学園。"}, {"t": 19.85, "x": "甲の字に山と書いて、かぶとやまと読む。"}, {"t": 22.466666666666665, "x": "こうやま、じゃないのね。"}, {"t": 24.05, "x": "ああ。この事件は「かぶとやまじけん」だ。"}, {"t": 26.616666666666667, "x": "翌月、そこで働いていた保育士の女性が逮捕された。"}, {"t": 30.233333333333334, "x": "そこから、この国の刑事裁判の歴史でも\n例のない年月が始まる。"}, {"t": 34.46666666666667, "x": "先に結論を言う。"}, {"t": 35.733333333333334, "x": "この女性は、無罪が確定した。"}, {"t": 37.9, "x": "一度も有罪判決を受けていない。"}, {"t": 40.11666666666667, "x": "一度も？"}, {"t": 40.96666666666667, "x": "ああ。一度もだ。"}, {"t": 42.15, "x": "事件が起きてから無罪が確定するまで、二十五年。"}, {"t": 45.38333333333333, "x": "裁判が始まってからでも、二十一年かかっている。"}, {"t": 48.63333333333333, "x": "そして、二人の子どもに何が\n起きたのかは、いまも分かっていない。"}, {"t": 52.55, "x": "最初に、この動画で守ることを言っておく。"}, {"t": 55.11666666666667, "x": "一つ目。この女性を犯人として扱わない。"}, {"t": 58.0, "x": "無罪が確定していて、いまも存命の方だ。"}, {"t": 60.85, "x": "お名前は国会の記録にも判決文にも\n残っているが、この動画では出さない。"}, {"t": 65.48333333333333, "x": "ずっと「元保育士の女性」と呼ぶ。"}, {"t": 67.86666666666666, "x": "二つ目。亡くなった\n二人の園児について、名前を出さない。"}, {"t": 71.53333333333333, "x": "見つかったときの様子も話さない。"}, {"t": 73.61666666666666, "x": "ご遺族が存命だ。"}, {"t": 74.91666666666667, "x": "三つ目。私は、誰かがやったとも、\n事故だったとも言わない。"}, {"t": 78.83333333333333, "x": "分かっていないことを、分かっていないと言う。"}, {"t": 81.35, "x": "それだと、話にならないんじゃないの？"}, {"t": 83.8, "x": "そこがこの事件の芯だ。"}, {"t": 85.43333333333334, "x": "無罪になったことと、真相が\n分かったことは、別のことだからな。"}, {"t": 89.5, "x": "今回使うのは、国会会議録と、判決文だ。"}, {"t": 92.88333333333334, "x": "どちらも無料で読める。"}, {"t": 94.91666666666667, "x": "話の順番を変える。先に、\n一九七八年三月の国会を見せたい。"}, {"t": 100.05, "x": "この事件が国政の場に出てきた、\n最初のまとまったやりとりだ。"}, {"t": 103.9, "x": "一九七八年三月二十二日、衆議院の法務委員会。"}, {"t": 108.11666666666666, "x": "当時の法務大臣が、こう述べている。"}, {"t": 110.43333333333334, "x": "「実は私も甲山事件が数年前に\n不起訴になっておったのが、さらに逮捕、"}, {"t": 115.16666666666667, "x": "起訴するという状況を新聞で知りました」"}, {"t": 117.7, "x": "「前に不起訴になった事件を\n数年後にさらに立件をして、"}, {"t": 120.93333333333334, "x": "逮捕して起訴する、こういう事件はやや\n異例なものに属する、かように考えます」"}, {"t": 125.85, "x": "法務大臣が、新聞で知ったの？"}, {"t": 128.16666666666666, "x": "そう言っている。そして、こう続けている。"}, {"t": 130.66666666666666, "x": "「事は場合によっては人権に"}, {"t": 132.23333333333332, "x": "関係することもあるし、あるいは検察のあり方に"}, {"t": 135.05, "x": "対する国民の信頼にも関係する、\nこういう感じを持ちました」"}, {"t": 138.95, "x": "翌日の参議院法務委員会では、\nもっと踏み込んでいる。"}, {"t": 142.33333333333334, "x": "「正直なところ異様に感じたわけでございます」"}, {"t": 145.23333333333332, "x": "異様に感じた。"}, {"t": 146.43333333333334, "x": "検察を所管する大臣が、\n自分のところの検察のやったことを\n新聞で知って、異様だと国会で述べた。"}, {"t": 152.86666666666667, "x": "では、何が異例だったのか。順番に見ていく。"}, {"t": 156.46666666666667, "x": "まず、舞台の話をする。"}, {"t": 158.2, "x": "ここから話すことは、一九八五年の神戸地裁の判決文に\n書かれている内容だ。"}, {"t": 163.81666666666666, "x": "裁判所が事実として認定したものになる。"}, {"t": 166.53333333333333, "x": "甲山学園は、社会福祉法人が経営する施設だった。"}, {"t": 170.4, "x": "原則として十八歳未満の、知的障害のある\n子どもが暮らしていた。定員は百名。"}, {"t": 175.71666666666667, "x": "生活の指導と訓練を行い、学齢期の子には\n小学校・中学校の教育も行っていた。"}, {"t": 181.3, "x": "学校でもあったのね。"}, {"t": 182.83333333333334, "x": "ああ。"}, {"t": 183.23333333333332, "x": "建物は、重度の子が暮らす若葉寮と、中度・\n軽度の子が暮らす青葉寮に分かれていた。"}, {"t": 188.65, "x": "敷地は高さ二・二メートルほどの金網のフェンスで\n囲われていて、出入口は正門一か所だけだった。"}, {"t": 194.8, "x": "事件が起きたのは、青葉寮のほうだ。"}, {"t": 197.06666666666666, "x": "玄関を中心に「へ」の字の形をした\n平屋建てで、西側が男子棟、東側が女子棟。"}, {"t": 202.95, "x": "居室の廊下をはさんだ向かいに、\n物置とトイレと洗面所がある。"}, {"t": 206.8, "x": "そして、女子棟のトイレの外側に、\nこの事件の浄化槽があった。"}, {"t": 210.96666666666667, "x": "建物のすぐ横なのね。"}, {"t": 212.75, "x": "ああ。"}, {"t": 213.15, "x": "当時、青葉寮には男子三十一人、\n女子十六人、合わせて四十七人が入っていた。"}, {"t": 218.65, "x": "職員は園長以下二十九人。そのうち\n青葉寮の担当は、指導員三人と保母七人だった。"}, {"t": 224.35, "x": "勤務は日勤・早出・宿直の三交代。"}, {"t": 227.31666666666666, "x": "宿直は朝から翌朝までの丸一日だ。"}, {"t": 230.11666666666667, "x": "この人数と、この建物の配置。\nこれが事件の舞台になる。"}, {"t": 234.56666666666666, "x": "一九七四年三月十七日。"}, {"t": 237.26666666666668, "x": "夕食の時間に、青葉寮の女の子が\n食堂に姿を見せなかった。"}, {"t": 241.43333333333334, "x": "当時十二歳だ。"}, {"t": 242.61666666666667, "x": "学園の中と外を捜したが、見つからない。"}, {"t": 245.46666666666667, "x": "副園長に連絡が入り、職員が\n非常招集され、警察も出動した。"}, {"t": 250.21666666666667, "x": "捜索は、翌十八日の午前一時ごろまで続いたが、\n見つからなかった。"}, {"t": 255.01666666666668, "x": "夜通し。"}, {"t": 255.83333333333334, "x": "ああ。"}, {"t": 256.25, "x": "十八日も朝から捜索が続いたが、見つからない。"}, {"t": 259.6166666666667, "x": "夕方にいったん中断して、捜索のビラを\n作り、男性職員が夜中まで配って歩いた。"}, {"t": 265.1333333333333, "x": "三月十九日も、ビラを配り、顔写真を\n入れた立て看板を作っていた。"}, {"t": 269.6166666666667, "x": "そして、その日の午後八時ごろ。"}, {"t": 271.76666666666665, "x": "青葉寮にいるはずの男の子の姿が見当たらなくなった。"}, {"t": 275.05, "x": "この子も、当時十二歳だ。"}, {"t": 277.03333333333336, "x": "二人目？"}, {"t": 277.9, "x": "宿直の職員二人が居室などを\n捜したが、見つからない。"}, {"t": 281.6666666666667, "x": "午後八時五十六分ごろ、学園から\n西宮警察署へ一一〇番通報が入った。"}, {"t": 286.8, "x": "その夜、職員とボイラーマンが、\n青葉寮の女子棟の裏にある浄化槽を見に行った。"}, {"t": 291.6166666666667, "x": "判決文には、こう書かれている。"}, {"t": 293.71666666666664, "x": "マンホールのふたは、きっちりと閉まっていた。"}, {"t": 296.26666666666665, "x": "それでも念のためにふたを開け、竿で\nかき混ぜたところ、二人が見つかった。"}, {"t": 300.93333333333334, "x": "二日前にいなくなった子も。"}, {"t": 302.8333333333333, "x": "ああ。二人とも、そこにいた。"}, {"t": 304.85, "x": "死因は、二人とも溺死だ。"}, {"t": 306.71666666666664, "x": "ここから先は話さない。"}, {"t": 308.15, "x": "引き上げの様子も、遺体の状態も、\nこの動画では扱わない。"}, {"t": 311.96666666666664, "x": "翌三月二十日、兵庫県警は殺人事件と\n判断して、西宮署に捜査本部を置いた。"}, {"t": 317.73333333333335, "x": "ここで一つ、はっきりさせておきたいことがある。"}, {"t": 320.56666666666666, "x": "この時点で、事故なのか\n事件なのかを決めたのは警察だ。"}, {"t": 324.15, "x": "そして、その判断が正しかったのか\nどうかも、いまだに誰も証明していない。"}, {"t": 329.45, "x": "一九七四年四月七日。"}, {"t": 331.78333333333336, "x": "学園の保育士だった女性が\n逮捕された。当時二十代だ。"}, {"t": 335.4, "x": "逮捕の理由は、二人のうち男の子を\n殺害した、という被疑事実だった。"}, {"t": 340.0833333333333, "x": "一人だけ？"}, {"t": 341.1, "x": "ああ。この事件で立件されたのは、\n最後まで男の子一人の件だけだ。"}, {"t": 345.5, "x": "女の子の件では、起訴されていない。"}, {"t": 347.78333333333336, "x": "これは覚えておいてほしい。"}, {"t": 349.23333333333335, "x": "さて、逮捕のあとに何が起きたか。"}, {"t": 351.48333333333335, "x": "判決文によると、四月十七日から\n二十一日にかけて、警察官の取り調べに対して、"}, {"t": 357.3, "x": "犯行を認める趣旨の供述をしている。"}, {"t": 359.8333333333333, "x": "この供述は、のちに撤回された。"}, {"t": 362.3, "x": "自白が出たの？"}, {"t": 363.5, "x": "出た。だが、検察は起訴しなかった。"}, {"t": 366.06666666666666, "x": "四月二十八日、勾留の期間が満了して、\n処分保留のまま釈放されている。"}, {"t": 371.15, "x": "処分保留、というのは、起訴するかどうかを\nその場では決めない、ということだ。"}, {"t": 375.56666666666666, "x": "身柄の期限が来れば外に\n出る。だが事件は終わっていない。"}, {"t": 378.95, "x": "起訴されるかもしれないし、されないかもしれない。"}, {"t": 381.73333333333335, "x": "その宙ぶらりんのまま、放り出される。"}, {"t": 384.18333333333334, "x": "いつまで？"}, {"t": 385.01666666666665, "x": "そこに決まりはない。"}, {"t": 386.25, "x": "この事件の場合、次の判断が\n出るまで、そこから一年五か月あいた。"}, {"t": 390.6333333333333, "x": "なお、この年の七月三十日、元保育士の側は、国と\n兵庫県を相手に国家賠償を求める裁判を起こしている。"}, {"t": 397.9, "x": "逮捕と取り調べのやり方を争ったものだ。"}, {"t": 400.56666666666666, "x": "この民事の裁判が、あとで\nとんでもない形で効いてくる。"}, {"t": 404.1333333333333, "x": "民事の裁判が？"}, {"t": 405.45, "x": "ああ。それは、あとで話す。"}, {"t": 407.93333333333334, "x": "一九七五年九月二十三日。"}, {"t": 410.6, "x": "神戸地方検察庁が、この事件を不起訴とした。"}, {"t": 413.75, "x": "公訴を維持するのが難しい、という理由だ。"}, {"t": 416.45, "x": "証拠が足りない。"}, {"t": 417.65, "x": "ああ。"}, {"t": 418.0833333333333, "x": "のちにこの裁判に関わった心理学者が、\n二〇一六年の国会でこう説明している。"}, {"t": 423.4, "x": "「自白も出たんですけれども、証拠が\n十分じゃないということで一旦不起訴になった」"}, {"t": 428.15, "x": "自白は出た。それでも検察は\n起訴に踏み切らなかった。"}, {"t": 431.55, "x": "この順番を、覚えておいてほしい。"}, {"t": 433.5833333333333, "x": "ここで、この人は法律上、無関係の人に戻った。"}, {"t": 437.1, "x": "ここで終わっていれば、この事件は\n真相の分からない事件として残っただけだった。"}, {"t": 441.95, "x": "終わらなかったのね。"}, {"t": 443.3, "x": "ああ。"}, {"t": 443.71666666666664, "x": "不起訴という判断には、\n続きがある仕組みがあるからだ。"}, {"t": 446.96666666666664, "x": "検察審査会という。"}, {"t": 448.45, "x": "検察官が起訴しないと決めたとき、\nそれでいいのかを、選ばれた市民が審査する。"}, {"t": 453.3666666666667, "x": "審査員は、選挙人名簿から\nくじで選ばれた一般の人だ。"}, {"t": 457.1, "x": "不起訴から十五日後の一九七五年十月八日。"}, {"t": 460.7, "x": "神戸検察審査会が、この事件を立件した。"}, {"t": 463.76666666666665, "x": "きっかけになったのは、亡くなった\n男の子のご両親の申し立てだ。"}, {"t": 467.73333333333335, "x": "さきほどの心理学者は、こう述べている。"}, {"t": 470.2, "x": "「亡くなったお子さんの親御さんが\n諦められないということで検察審査会にかけて、"}, {"t": 474.71666666666664, "x": "不起訴が不相当じゃないかということで\n改めて検察側の方で再捜査を行って」"}, {"t": 479.6333333333333, "x": "子どもを亡くした親が、納得できないと言った。"}, {"t": 482.51666666666665, "x": "それはそうだろう、と私は思う。"}, {"t": 484.51666666666665, "x": "何が起きたのか、誰も\n説明してくれないままなんだからな。"}, {"t": 488.75, "x": "一九七六年十月二十八日。"}, {"t": 491.6333333333333, "x": "神戸検察審査会が、議決を出した。"}, {"t": 494.28333333333336, "x": "「不起訴不当」。"}, {"t": 495.35, "x": "不起訴不当。"}, {"t": 496.3833333333333, "x": "検察審査会が出す結論には、いくつか種類がある。"}, {"t": 499.8, "x": "起訴するのが相当だ、というもの。"}, {"t": 501.96666666666664, "x": "不起訴にしたのは不当だ、というもの。"}, {"t": 504.26666666666665, "x": "不起訴で相当だ、というもの。"}, {"t": 506.2, "x": "この事件で出たのは、\n真ん中の「不起訴不当」だった。"}, {"t": 509.73333333333335, "x": "もう一度捜査をやり直せ、という意味になる。"}, {"t": 512.3166666666667, "x": "この議決は、同じ年の十二月十四日に\n公告されている。"}, {"t": 516.1333333333333, "x": "日付まで、国会の記録に残っている。"}, {"t": 518.6833333333333, "x": "ここで一つ、当時の国会で指摘されたことがある。"}, {"t": 521.9166666666666, "x": "一九七八年三月二十四日、衆議院の内閣委員会。"}, {"t": 526.2833333333333, "x": "一人の議員が、こう述べている。"}, {"t": 528.25, "x": "「不起訴不当議決をした検察審査会では"}, {"t": 530.7166666666667, "x": "検察官しか呼ばず、被疑者の……は\n呼んでおらず、全く作為的ではないか」"}, {"t": 535.5666666666667, "x": "片方しか聞いていない？"}, {"t": 537.1333333333333, "x": "この議員はそう言っている。"}, {"t": 538.5666666666667, "x": "これは質問した側の主張で、"}, {"t": 540.4, "x": "審査会が実際にどう運営されたかを役所が答えた\n記録は、私が見た範囲では残っていない。"}, {"t": 546.2, "x": "だから、そういう指摘が国会でされた、という\n事実として置いておく。"}, {"t": 550.3166666666667, "x": "なお、検察審査会の議決に\n強制力が付いたのは、ずっとあとだ。"}, {"t": 554.5666666666667, "x": "二〇〇九年に、一定の場合には必ず\n起訴される仕組みが動き出した。"}, {"t": 558.8333333333334, "x": "この事件の当時は、そこまでの力はなかった。"}, {"t": 561.8333333333334, "x": "それでも、捜査は再開された。"}, {"t": 564.55, "x": "ここが、この事件のいちばん重い場所だ。"}, {"t": 567.0333333333333, "x": "最初に、この女性が疑われた\nきっかけは何だったのか。"}, {"t": 570.4666666666667, "x": "さきほどの心理学者が、国会で説明している。"}, {"t": 573.5666666666667, "x": "この人は、のちにこの裁判に\n弁護人の一人として関わった人だ。"}, {"t": 577.8666666666667, "x": "読む。"}, {"t": 578.4, "x": "「元々疑われたのが、"}, {"t": 579.8166666666667, "x": "知的障害の子供がその先生が\n連れていくところを見たという、\nそういう目撃供述があって最初疑われ」"}, {"t": 586.2166666666667, "x": "子どもの目撃。"}, {"t": 587.5333333333333, "x": "ああ。"}, {"t": 587.9666666666667, "x": "そして、いったん不起訴になった。"}, {"t": 590.0333333333333, "x": "問題はここからだ。続きを読む。"}, {"t": 592.2, "x": "「三年後開始されました再捜査では、"}, {"t": 594.4, "x": "同じく学園で住んでいました知的障害の子供たちに\n事情聴取をしたところ、私も見た、"}, {"t": 599.8666666666667, "x": "僕も見たということで更に\n三人の子供たちが目撃者として登場する」"}, {"t": 604.45, "x": "あとから、三人増えたの？"}, {"t": 606.3166666666667, "x": "記録に残っているのは、そういうことだ。"}, {"t": 608.7833333333333, "x": "再捜査が始まったのは、一九七六年十二月十日。"}, {"t": 612.9333333333333, "x": "検察審査会の議決書が届いたのを\n受けて、神戸地検が動き出した。"}, {"t": 617.3166666666667, "x": "当時の刑事局長は、国会でこう言っている。"}, {"t": 620.0833333333334, "x": "「今度再捜査を開始しました\n昭和五十一年十二月以降の事情と、\nその間の二年半の歳月の経過」"}, {"t": 626.4833333333333, "x": "事件が起きたのは一九七四年三月。"}, {"t": 629.35, "x": "再捜査の開始は一九七六年十二月。"}, {"t": 632.7, "x": "二年半あいている。"}, {"t": 633.9166666666666, "x": "二年半前の、ある一日の、ある時間帯に、\n誰が誰を連れて歩いていたか。"}, {"t": 638.7166666666667, "x": "それを、あとから思い出して述べる。"}, {"t": 640.95, "x": "二年半前の一日。"}, {"t": 642.5833333333334, "x": "あなたは、二年半前の三月のある夕方、\n自分が誰とすれ違ったか言えるか。"}, {"t": 647.5166666666667, "x": "私は言えない。"}, {"t": 648.5666666666667, "x": "しかもこの子どもたちは、言葉での\nやりとりに支援が要る子どもたちだった。"}, {"t": 652.75, "x": "断っておく。私は、この子どもたちが\n嘘をついたと言っているんじゃない。逆だ。"}, {"t": 657.5333333333333, "x": "問われているのは、聞いた側が、\nその話をどう扱ったか、なんだ。"}, {"t": 662.3, "x": "役所の側は、なぜあとから新しい証拠が\n出たのかを、国会でこう説明している。"}, {"t": 667.2166666666667, "x": "一九七八年三月二十二日、法務大臣の答弁だ。"}, {"t": 671.4833333333333, "x": "「甲山学園収容児二人が死んだ\n後の事件捜査については、"}, {"t": 675.1666666666666, "x": "学園自体がきわめて閉鎖的であった、それで\n周到な捜査ができなかった事情があるそうです」"}, {"t": 680.7333333333333, "x": "「その後あの学園が、"}, {"t": 681.9166666666666, "x": "どういう事情か知りませんが、だんだん収容者が\n少なくなって、外に出る人がたくさん出てきている」"}, {"t": 687.7833333333333, "x": "「その間においていろいろ新しい証拠が\n発見されたといいますか、そういう事情で新たな"}, {"t": 692.8166666666667, "x": "事件として取り調べを再開した」"}, {"t": 694.8, "x": "施設の外に出た子から、話を\n聞けるようになった、ということね。"}, {"t": 699.0166666666667, "x": "役所の説明を素直に読むと、そうなる。"}, {"t": 701.6333333333333, "x": "三月二十四日には、同じ大臣が\nもう少し踏み込んで言っている。"}, {"t": 705.6333333333333, "x": "「前の捜査の段階では、いわゆる甲山学園をめぐる\n状況が、捜査に非常に困難をした事態があった」"}, {"t": 712.0, "x": "「その後、二年ぐらいの経過の中で、"}, {"t": 714.15, "x": "甲山学園をめぐる状況に相当変化が出てきて、\n今度の捜査で新たな証拠を発見することができた」"}, {"t": 720.5833333333334, "x": "法務省の刑事局長は、こうも言っている。"}, {"t": 723.1833333333333, "x": "「要するに新たな人証と物証が\n出てきたと、こういうことでございます」"}, {"t": 734.15, "x": "「そういう方の御協力が今回得られるような"}, {"t": 736.6333333333333, "x": "状況になっておったということもございまして、\nそういう意味で新たな人証というものが相当"}, {"t": 741.15, "x": "数得られたようでございます」"}, {"t": 743.05, "x": "協力してもらえなかった人が、協力するようになった。"}, {"t": 746.6166666666667, "x": "そう説明している。"}, {"t": 747.9166666666666, "x": "そして、この局長は同じ答弁の中で、\n当時の捜査についてこう言っている。"}, {"t": 752.5166666666667, "x": "「確かにいまから振り返ってみますと、"}, {"t": 758.7166666666667, "x": "新たにわかったような証拠を\n当時集めておけばよかったと、そういう\n点反省させられるわけでございます」"}, {"t": 764.9166666666666, "x": "反省させられる。"}, {"t": 766.2166666666667, "x": "ああ。役所の側が、国会でそう述べている。"}, {"t": 769.0, "x": "最初の捜査が足りなかった、と認めている。"}, {"t": 771.7333333333333, "x": "そして、こう締めている。"}, {"t": 773.2833333333333, "x": "法務大臣の言葉だ。"}, {"t": 774.7833333333333, "x": "「この事件については確信を持って起訴いたした」"}, {"t": 777.6333333333333, "x": "この言葉は、あとでもう一度出てくる。"}, {"t": 779.7833333333333, "x": "覚えておいてほしい。"}, {"t": 781.65, "x": "一九七八年二月二十七日。"}, {"t": 784.5166666666667, "x": "元保育士の女性が、もう一度逮捕された。"}, {"t": 787.3, "x": "そして、この日は同時に、もう二人が逮捕されている。"}, {"t": 790.5833333333334, "x": "学園の元園長と、元指導員だ。"}, {"t": 793.2, "x": "職員も？"}, {"t": 794.1333333333333, "x": "容疑は偽証だ。この話は次の章でする。"}, {"t": 796.9166666666666, "x": "三月九日。殺人罪で、神戸地方裁判所に起訴された。"}, {"t": 801.05, "x": "法務省の刑事局長の説明を読む。"}, {"t": 803.45, "x": "「新たな証拠が得られる等の事情がございまして、"}, {"t": 806.05, "x": "今回再び……を殺人罪で身柄を拘束いたしまして、\n本年三月九日、死体遺棄はございません、"}, {"t": 812.3833333333333, "x": "殺人罪として神戸地方裁判所に起訴しております」"}, {"t": 815.8166666666667, "x": "死体遺棄は付いていない。殺人だけだ。"}, {"t": 818.2333333333333, "x": "起訴状には、こう書かれていた。"}, {"t": 820.1833333333333, "x": "一九七四年三月十九日の午後八時ごろ、\n男の子を寮から連れ出して、"}, {"t": 825.2, "x": "水深およそ一・五メートルの浄化槽に\n投げ込み、溺死させた、という中身だ。"}, {"t": 830.2, "x": "あの日の午後八時ごろ。"}, {"t": 831.8, "x": "ああ。通報の直前の時間帯になる。"}, {"t": 834.2, "x": "ここで、この事件の年表をいったん並べておく。"}, {"t": 837.1166666666667, "x": "一九七四年三月、二人の園児がいなくなり、\n浄化槽で見つかる。"}, {"t": 841.7666666666667, "x": "四月七日、逮捕。四月二十八日、釈放。"}, {"t": 845.4333333333333, "x": "一九七五年九月、不起訴。"}, {"t": 847.8833333333333, "x": "十月、検察審査会が立件。"}, {"t": 850.2666666666667, "x": "一九七六年十月、不起訴不当の議決。"}, {"t": 853.6333333333333, "x": "十二月、再捜査開始。"}, {"t": 855.6, "x": "一九七八年二月二十七日、再逮捕。三月九日、起訴。"}, {"t": 860.9166666666666, "x": "ここまでで四年。"}, {"t": 862.1166666666667, "x": "そうだ。"}, {"t": 862.7333333333333, "x": "そして、第一回の公判が\n開かれたのは、同じ年の六月五日。"}, {"t": 867.1333333333333, "x": "この日から数えて、この裁判は二十一年続く。"}, {"t": 870.3166666666667, "x": "求刑は、懲役十三年だった。"}, {"t": 873.2, "x": "一九七八年三月二十二日、衆議院の法務委員会。"}, {"t": 877.45, "x": "一人の議員が、起訴状を読んだうえでこう質している。"}, {"t": 880.5166666666667, "x": "「公訴事実を読むと、動機が書いてないのですね。"}, {"t": 883.2833333333333, "x": "普通の殺人の場合には動機があるわけでしょう」"}, {"t": 886.1666666666666, "x": "動機が書いていない。"}, {"t": 887.5166666666667, "x": "起訴状というのは、検察が\n「この人がこういうことをした」と\n書いて裁判所に出す書面だ。"}, {"t": 893.1, "x": "これに対して、法務省の刑事課長がこう答えている。"}, {"t": 896.3833333333333, "x": "「一般の殺人事件あるいは\n放火事件等におきましては、"}, {"t": 899.6166666666667, "x": "通例の起訴状におきましては動機を\n明らかにするというのが普通のやり方でございます」"}, {"t": 904.5666666666667, "x": "「しかし、本件の場合には、ただいま"}, {"t": 906.9166666666666, "x": "御指摘のとおり、なお動機に十分"}, {"t": 908.65, "x": "解明できていない点もあったという判断で\n動機の部分が記載されていないと考えられます」"}, {"t": 913.9166666666666, "x": "役所の側が認めているのね。"}, {"t": 915.9666666666667, "x": "ああ。"}, {"t": 916.4, "x": "普通は書く。この事件では書けなかった。"}, {"t": 918.95, "x": "なぜその人がそんなことをしたのか、検察の側も\n説明できないまま、裁判が始まった。"}, {"t": 924.55, "x": "私は、この一点がこの事件の性格を\nよく表していると思う。"}, {"t": 928.4833333333333, "x": "起訴した側にも、絵が描けていなかった。"}, {"t": 931.1833333333333, "x": "それで、二十一年。"}, {"t": 932.7666666666667, "x": "そういうことになる。"}, {"t": 933.95, "x": "もう一つ。この再逮捕では、\n勾留の延長が認められなかった。"}, {"t": 937.9666666666667, "x": "一度目に二十日取っている。"}, {"t": 939.4666666666667, "x": "二度目は十日で足りる、と裁判所が判断した。"}, {"t": 942.6166666666667, "x": "裁判所が短くしたの？"}, {"t": 944.4666666666667, "x": "裁判所の側も、この再捜査を\nそのまま通したわけではなかった。"}, {"t": 949.0333333333333, "x": "この事件には、もう一つの顔がある。"}, {"t": 951.3833333333333, "x": "元園長と元指導員の逮捕だ。"}, {"t": 953.4166666666666, "x": "容疑は偽証。裁判で嘘の証言をした、という罪だ。"}, {"t": 957.05, "x": "どの裁判で？"}, {"t": 958.1833333333333, "x": "最初の逮捕のあと、元保育士の側は国と\n兵庫県を相手に国家賠償の裁判を起こしていた。"}, {"t": 963.9833333333333, "x": "その法廷に、原告側の証人として出た人たちがいた。"}, {"t": 967.65, "x": "法務省の刑事課長の説明を読む。"}, {"t": 969.8833333333333, "x": "「原告側の証人として出廷した……氏が\n偽証をしたという容疑でございますが、その内容は、"}, {"t": 975.3333333333334, "x": "被告人のアリバイについて偽証をした、\nこういう容疑で逮捕したわけでございます」"}, {"t": 980.0833333333334, "x": "アリバイを証言した人が、捕まった。"}, {"t": 982.65, "x": "記録に残っているのは、そういうことだ。"}, {"t": 985.1166666666667, "x": "さらに、一九七八年三月七日には、もう\n一人が偽証の容疑で逮捕されている。"}, {"t": 990.7833333333333, "x": "この人は学園の職員ではない。"}, {"t": 992.7, "x": "神戸の会館で保安係をしていた、\n当時四十五歳の男性だ。"}, {"t": 996.8, "x": "この人は、三月九日に釈放されている。"}, {"t": 999.8, "x": "裁判所が、身柄を続けて\n拘束することを認めなかったからだ。"}, {"t": 1003.7833333333333, "x": "課長はこう述べている。"}, {"t": 1005.1166666666667, "x": "「勾留請求いたしまして、この請求が\n却下になった結果の釈放でございます」"}, {"t": 1009.9166666666666, "x": "「本件につきまして、もちろん\n検察側からも準抗告をいたしましたが、"}, {"t": 1014.2166666666667, "x": "裁判所の入れるところとならなかった」"}, {"t": 1016.6666666666666, "x": "検察が食い下がって、それも通らなかったのね。"}, {"t": 1019.7833333333333, "x": "ああ。"}, {"t": 1020.1833333333333, "x": "この一件について、国会ではこういう指摘が出ている。"}, {"t": 1023.4166666666666, "x": "「被疑者と何のつながりもなく、民事裁判においても\n記憶に基づいて証言をしただけでありまして」"}, {"t": 1029.0833333333333, "x": "「こんなことで偽証罪で逮捕されたのではだれも\n裁判で証言に立たなくなるのではないか」"}, {"t": 1034.0166666666667, "x": "三十七年後、二〇一五年の衆議院法務委員会でも、\nこの事件はこの文脈で"}, {"t": 1039.05, "x": "引かれている。"}, {"t": 1039.9, "x": "「無実の被告人のアリバイを証言した人々が\n偽証罪で追及された事例というのは、八海事件、"}, {"t": 1045.5833333333333, "x": "甲山事件などがあって」"}, {"t": 1047.3666666666666, "x": "「偽証罪というのはむしろ検察組織のために\n利用されてきたのではないか、そういう歴史もある」"}, {"t": 1052.7666666666667, "x": "これは質問した議員の見方だ。"}, {"t": 1054.6833333333334, "x": "役所がそう認めたわけではない。"}, {"t": 1056.6833333333334, "x": "ただ、この事件がそういう例として国会で\n語り継がれている、というのは事実だ。"}, {"t": 1061.45, "x": "先に言っておく。"}, {"t": 1062.5333333333333, "x": "偽証で起訴された元園長と元指導員も、\n最終的に無罪が確定している。"}, {"t": 1067.5, "x": "この人たちも無罪なの？"}, {"t": 1069.25, "x": "ああ。一九九九年の十月だ。"}, {"t": 1071.7833333333333, "x": "あとでもう一度出てくる。"}, {"t": 1073.9333333333334, "x": "一九七八年の国会では、もう\n一つ問題にされたことがある。"}, {"t": 1078.4333333333334, "x": "逮捕された人が、弁護人と会うことだ。"}, {"t": 1081.0166666666667, "x": "議員はこう質している。"}, {"t": 1082.4333333333334, "x": "「弁護人が接見したいと言ったら五日後に\n接見の指定をしたということが言われている」"}, {"t": 1087.4, "x": "五日後。"}, {"t": 1088.2166666666667, "x": "捕まっている人が、弁護士と話をしたいと言う。"}, {"t": 1091.3, "x": "それが五日先に指定された、という話だ。"}, {"t": 1094.1666666666667, "x": "法務省側の答えはこうだ。"}, {"t": 1095.9333333333334, "x": "「それ以外の接見は弁護人の方から\n準抗告の申し立てをしまして、"}, {"t": 1099.9, "x": "裁判所の決定を得て接見が行われておる」"}, {"t": 1102.9, "x": "裁判所に言わないと、会えなかったの？"}, {"t": 1105.3, "x": "役所の説明を読む限りは、そういう回が含まれている。"}, {"t": 1108.7333333333333, "x": "そして、同じ答弁の中で、こうも言っている。"}, {"t": 1111.6166666666666, "x": "「弁護人側の接見の御要求が\n大変頻繁であったということも\n本件の場合には指摘せざるを得ない」"}, {"t": 1117.5, "x": "要求が多すぎた、という言い方だ。"}, {"t": 1119.7, "x": "どちらが正しいという話をするつもりはない。"}, {"t": 1122.3, "x": "ただ、はっきりしていることが一つある。"}, {"t": 1124.7166666666667, "x": "この段階で既に、捜査する側と、される\n側が、真正面からぶつかっていた。"}, {"t": 1129.6166666666666, "x": "起訴の前から、この事件はそうなっていた。"}, {"t": 1132.35, "x": "裁判が長くなる下地は、もうあったのね。"}, {"t": 1135.1666666666667, "x": "私はそう見ている。"}, {"t": 1137.0833333333333, "x": "一九七八年六月、裁判が始まる。"}, {"t": 1140.4166666666667, "x": "ここで、この事件に一人の学者が加わる。"}, {"t": 1143.1666666666667, "x": "子どもの心理学が専門の研究者だ。"}, {"t": 1145.6666666666667, "x": "この人は、二〇一六年四月二十六日、\n参議院法務委員会に参考人として呼ばれ、"}, {"t": 1151.2166666666667, "x": "自分の四十年を語っている。"}, {"t": 1153.2833333333333, "x": "本人の言葉で読む。"}, {"t": 1154.7166666666667, "x": "「私、元々は子供の心理学を\n専門にしておりましたので、"}, {"t": 1158.4333333333334, "x": "知的障害の子供の目撃供述を\nどう見たらいいのかということで、"}, {"t": 1162.2666666666667, "x": "刑事裁判に初めて関与することになりました」"}, {"t": 1165.2666666666667, "x": "「それが一九七八年、七四年の事件で\n七八年から裁判が始まりましたので」"}, {"t": 1171.2666666666667, "x": "「いろんな因縁がありまして、"}, {"t": 1172.7333333333333, "x": "特別弁護人という形でこの裁判に\n弁護人の一人として関与することになりました」"}, {"t": 1178.2, "x": "特別弁護人。"}, {"t": 1179.4833333333333, "x": "弁護士でない人が、裁判所の許しを得て\n弁護人になる仕組みだ。"}, {"t": 1183.4833333333333, "x": "専門の知識が要る事件で使われる。"}, {"t": 1185.8333333333333, "x": "この人は、法律家ではない。心理学の人だ。"}, {"t": 1188.9666666666667, "x": "そういう人が弁護人の席に座った。"}, {"t": 1191.3666666666666, "x": "それが、この裁判の争点が\nどこにあったかを示している。"}, {"t": 1194.9166666666667, "x": "子どもの証言をどう見るか。"}, {"t": 1196.7, "x": "そこが正面の争点になった。"}, {"t": 1198.6833333333334, "x": "そして、この人はここから四十年、冤罪を\n主張する事件に関わり続けることになる。"}, {"t": 1204.0666666666666, "x": "本人はこう言っている。"}, {"t": 1205.4333333333334, "x": "「以来四十年近く、弁護士さんとの付き合いの中で\nいろんな冤罪主張の事件に出会うことになって」"}, {"t": 1211.2, "x": "「外からは全然見えなかったんですが、"}, {"t": 1213.3333333333333, "x": "中に入ってみますと、被疑者、"}, {"t": 1215.35, "x": "被告人の自白の問題がすごく\n大きなテーマになっているということに\n改めて気付かされ」"}, {"t": 1220.5333333333333, "x": "この事件が入口だった、と述べている。"}, {"t": 1223.6, "x": "この参考人が国会で述べたことを、\nもう少し紹介したい。"}, {"t": 1227.25, "x": "断っておく。ここから話すのは、\n甲山事件そのものの話ではない。"}, {"t": 1231.7833333333333, "x": "この人が四十年かけてたどりついた、\n一般論としての話だ。"}, {"t": 1235.8833333333334, "x": "まず、この一言だ。"}, {"t": 1237.4166666666667, "x": "「世間の人たちが思う以上に虚偽自白は"}, {"t": 1239.95, "x": "頻繁に起こっている、しかも、"}, {"t": 1241.5333333333333, "x": "世間の人たちが思う形ではなくて予想外の\nところで虚偽自白が起こっている」"}, {"t": 1246.4333333333334, "x": "予想外のところ。"}, {"t": 1247.7833333333333, "x": "多くの人は、殴られたり脅されたりして、\nやむなく認めてしまうと思っている。"}, {"t": 1252.4333333333334, "x": "この人は、そうではない場合が多いと言う。"}, {"t": 1254.8666666666666, "x": "「実際には、むしろ、"}, {"t": 1256.15, "x": "自ら犯人として語らざるを得ない状況に心理的に\n追い込まれるという現実があるんですね。ですから、"}, {"t": 1262.0666666666666, "x": "一見自発的に自分からしゃべっているように見えます」"}, {"t": 1265.3, "x": "そうなる仕組みを、こう説明している。"}, {"t": 1267.55, "x": "日本の取り調べは「謝罪追求型」になっている、と。"}, {"t": 1271.1666666666667, "x": "「謝れというところから始まるケースが非常に多い」"}, {"t": 1274.05, "x": "「謝罪追求型ということは、実は有罪前提なんですね」"}, {"t": 1277.7, "x": "有罪を前提に迫られると、何を\n言っても聞いてもらえない。"}, {"t": 1281.15, "x": "「朝から晩まで、やっただろう、やっていません、\nやっただろう、やっていませんが続いたときに、"}, {"t": 1286.3, "x": "どれだけの無力感を味わうことになるのか」"}, {"t": 1289.05, "x": "無力感。"}, {"t": 1289.95, "x": "そして、この人はこう言う。"}, {"t": 1291.7, "x": "「実はその無力感でさえ人は\n落ちるんだということなんです」"}, {"t": 1295.1333333333334, "x": "さらに、こう続ける。"}, {"t": 1296.55, "x": "「逆に言うと、真犯人の方が落ちにくい」"}, {"t": 1299.3, "x": "やった人のほうが、落ちにくい？"}, {"t": 1301.3833333333334, "x": "理屈はこうだ。"}, {"t": 1302.4166666666667, "x": "本当にやった人は、自分が嘘で\n否認していると分かっている。"}, {"t": 1306.15, "x": "だから、相手が納得しないのは\n当たり前で、無力感を感じない。"}, {"t": 1310.15, "x": "やっていない人は、本当のことを\n言っているのに信じてもらえない。"}, {"t": 1313.8666666666666, "x": "そこで無力感が生まれる。"}, {"t": 1315.4666666666667, "x": "この人は、続きも話している。"}, {"t": 1317.6, "x": "認めてしまったあと、どうなるか。"}, {"t": 1319.6833333333334, "x": "「それじゃどうやったんだというふうに\n犯行のストーリーを語ることを求めることになります」"}, {"t": 1324.3333333333333, "x": "「もちろん、やっていない人間は分からないわけです」"}, {"t": 1327.1833333333334, "x": "分かりません、と言えばいいじゃないか、と\n思うかもしれない。"}, {"t": 1330.3166666666666, "x": "だが、そう言うと元に戻る。"}, {"t": 1332.1833333333334, "x": "「分かりませんと言うと、\nまた否認するのかということに\n戻ります。また元のつらさに"}, {"t": 1337.2333333333333, "x": "戻ることになってしまいます」"}, {"t": 1338.7333333333333, "x": "それで、どうなるの？"}, {"t": 1340.1333333333334, "x": "「結局、自分が犯人として振る舞う\n以外にないということになるんです」"}, {"t": 1344.3333333333333, "x": "「その中で、突き付けられた事件について自分だったら"}, {"t": 1347.1166666666666, "x": "どうしただろうかということを\n自分の側から想像して語る」"}, {"t": 1350.65, "x": "これは、この参考人が国会の場で述べた見方だ。"}, {"t": 1353.8166666666666, "x": "私が言っていることではない。"}, {"t": 1355.55, "x": "ただ、この見方で一九八五年の判決文を\n読むと、書いてあることの意味が変わってくる。"}, {"t": 1361.95, "x": "一九八五年十月十七日。"}, {"t": 1364.6, "x": "神戸地方裁判所が判決を言い渡した。"}, {"t": 1367.1833333333334, "x": "主文は、たった六文字だ。"}, {"t": 1369.0, "x": "「被告人は無罪。」"}, {"t": 1370.3166666666666, "x": "無罪。"}, {"t": 1370.9833333333333, "x": "起訴が一九七八年三月九日。"}, {"t": 1373.8833333333334, "x": "第一回の公判が同じ年の六月五日。"}, {"t": 1376.7666666666667, "x": "一審だけで七年四か月かかっている。"}, {"t": 1379.25, "x": "求刑は懲役十三年だった。"}, {"t": 1381.2833333333333, "x": "この判決文は、いまも誰でも読める。"}, {"t": 1383.5833333333333, "x": "九つの章に分かれている。"}, {"t": 1385.3333333333333, "x": "第五章と第六章が、園児の供述についての考察。"}, {"t": 1388.8833333333334, "x": "第七章が、自白調書の信用性について。"}, {"t": 1391.7333333333333, "x": "第八章が、繊維の鑑定について。"}, {"t": 1394.3, "x": "子どもの証言に、二章使っているのね。"}, {"t": 1396.9833333333333, "x": "ああ。そこがこの裁判の中心だった、ということだ。"}, {"t": 1400.2333333333333, "x": "結論の章は、こう書かれている。"}, {"t": 1402.3, "x": "「当裁判所は、検察官の主張に沿いながら、"}, {"t": 1405.1333333333334, "x": "重要な証拠関係についての検討を重ねたが、"}, {"t": 1408.05, "x": "被告人と本件公訴事実との結び付きを首肯するに\n足る立証は不十分であるとの結論に達した」"}, {"t": 1414.2, "x": "立証が不十分だ、と言っている。"}, {"t": 1416.2833333333333, "x": "裁判所は「この人はやっていない」と\n証明したわけではない。"}, {"t": 1419.9166666666667, "x": "「この人がやったという\n証明ができていない」と言っている。"}, {"t": 1423.2166666666667, "x": "違うことなの？"}, {"t": 1424.3833333333334, "x": "刑事裁判ではそうなる。やったと\n証明できなければ無罪。それが原則だ。"}, {"t": 1428.9333333333334, "x": "そして、この違いが、この事件を\nこのあと十四年引き延ばすことになる。"}, {"t": 1433.8833333333334, "x": "この判決が、自白をどう見たかを紹介する。"}, {"t": 1436.7833333333333, "x": "裁判所の言葉だ。"}, {"t": 1438.15, "x": "「たとえ不完全な自白とはいえ、何がしかの形で\n触れられていてもよい筈の事柄が述べられておらない」"}, {"t": 1444.05, "x": "「この点にも、被告人の自白に迫真性・\n臨場感の乏しい特色があらわれている」"}, {"t": 1449.4666666666667, "x": "中身が薄い、ということ？"}, {"t": 1451.2833333333333, "x": "もっとはっきり書いている箇所がある。"}, {"t": 1453.2666666666667, "x": "「真犯人でなければ述べ得ないと思料される\n生々しい具体的な供述が皆無であり、"}, {"t": 1457.9833333333333, "x": "当該自白の信ぴょう性を担保する\n状況描写が欠如している」"}, {"t": 1461.8166666666666, "x": "「被告人の供述内容はあまりにも淡々としており、\n到底犯人であればこその供述とは受けとれない」"}, {"t": 1467.8333333333333, "x": "そして、いちばん重い認定がこれだ。"}, {"t": 1470.1333333333334, "x": "この自白は、園児の供述を\nなぞっているだけだった、という指摘になる。"}, {"t": 1474.4666666666667, "x": "「被告人が……を連れ出した\n状況について述べているところは、"}, {"t": 1477.8, "x": "当時の……が供述していた内容から一歩も\nでていないのが顕著な特徴である」"}, {"t": 1482.45, "x": "「証明力の乏しい……供述と"}, {"t": 1484.35, "x": "歩調を合わせている被告人供述の真実性も\n疑わしいものとしなければならない」"}, {"t": 1489.15, "x": "子どもの証言と、同じことしか言っていない。"}, {"t": 1492.0166666666667, "x": "ああ。"}, {"t": 1492.4333333333334, "x": "さっきの心理学者が国会で述べた\n「自分の側から想像して語る」という\n話と、ここが重なる。"}, {"t": 1498.7, "x": "もう一つ、物証の話をする。繊維の鑑定だ。"}, {"t": 1501.9666666666667, "x": "元保育士の服と、亡くなった男の子の服の繊維が、\nお互いに付いていた、という主張だった。"}, {"t": 1507.95, "x": "それは決め手にならないの？"}, {"t": 1509.65, "x": "判決はこう書いている。"}, {"t": 1511.1333333333334, "x": "「本件繊維鑑定の結果は、"}, {"t": 1519.5833333333333, "x": "「もともと繊維の相互付着という現象は着衣が\n直接接触した場合のみに起こるとは断定し難い」"}, {"t": 1525.4333333333334, "x": "同じ施設で毎日一緒に暮らしているんだから、\nいつ付いてもおかしくない。"}, {"t": 1529.6666666666667, "x": "だから、これだけでは\n犯行の証拠にならない、という判断だ。"}, {"t": 1533.35, "x": "ただし、公平のために言っておく。"}, {"t": 1535.4333333333334, "x": "判決は、鑑定そのもののやり方は\n問題なかったとしている。"}, {"t": 1539.2166666666667, "x": "「これら一連の作業の過程でとくにずさん・軽率な\n取扱いがなされたと疑われる事情は見当たらず」"}, {"t": 1545.05, "x": "捜査を一方的に断罪した判決ではない、ということだ。"}, {"t": 1549.2333333333333, "x": "検察は、この無罪判決に控訴した。"}, {"t": 1551.8833333333334, "x": "控訴審は大阪高等裁判所だ。"}, {"t": 1554.1166666666666, "x": "一九九〇年三月二十三日、判決が出た。"}, {"t": 1557.7666666666667, "x": "原判決を破棄して、神戸地裁に\n差し戻す、という内容だった。"}, {"t": 1562.0333333333333, "x": "破棄・差し戻し。"}, {"t": 1563.4833333333333, "x": "一審の判決を取り消して、もう\n一度やり直せ、という判断だ。"}, {"t": 1567.4833333333333, "x": "無罪にした、というのとは違う。"}, {"t": 1569.5, "x": "有罪にした、というのとも違う。"}, {"t": 1571.6, "x": "審理が足りない、というのが理由だった。"}, {"t": 1574.0333333333333, "x": "ふりだしに戻るのね。"}, {"t": 1575.55, "x": "そうだ。"}, {"t": 1576.15, "x": "控訴審だけで四年五か月かかっている。"}, {"t": 1578.6, "x": "この差し戻しに対して、今度は\n被告人の側が最高裁に上告した。"}, {"t": 1583.1, "x": "一九九八年の国会で、当時の法務大臣が\nこの経過を述べている。"}, {"t": 1587.8666666666666, "x": "「平成四年四月七日に最高裁判所において\n被告人の上告棄却が決定されている」"}, {"t": 1593.35, "x": "平成四年は一九九二年。"}, {"t": 1595.5, "x": "上告は認められなかった。"}, {"t": 1597.35, "x": "上告審だけで二年一か月だ。"}, {"t": 1599.5, "x": "これで、やり直しの裁判が\n神戸地裁で始まることが確定した。"}, {"t": 1603.65, "x": "一九九二年から、また一審。"}, {"t": 1606.35, "x": "ああ。"}, {"t": 1606.7666666666667, "x": "事件からは十八年。起訴からは十四年たっていた。"}, {"t": 1610.0, "x": "ここから、二度目の一審が始まる。"}, {"t": 1612.9333333333334, "x": "やり直しの裁判は、神戸地裁で五年続いた。"}, {"t": 1615.9166666666667, "x": "そして一九九八年三月二十四日、判決が出る。"}, {"t": 1620.0333333333333, "x": "また、無罪だった。"}, {"t": 1621.5333333333333, "x": "二度目の無罪。"}, {"t": 1622.65, "x": "ああ。"}, {"t": 1623.0666666666666, "x": "しかも、この判決は、偽証で起訴されていた\n元園長と元指導員についても無罪としている。"}, {"t": 1628.8, "x": "一九八五年に無罪。一九九八年にも無罪。"}, {"t": 1632.9333333333334, "x": "どちらも神戸地裁だ。"}, {"t": 1634.2333333333333, "x": "判断した裁判官は違う。"}, {"t": 1636.1666666666667, "x": "別々の裁判体が、別々の審理をして、\n同じ結論を出した。"}, {"t": 1640.4666666666667, "x": "その十三日後、一九九八年四月六日。"}, {"t": 1644.0333333333333, "x": "神戸地方検察庁が控訴した。"}, {"t": 1646.3166666666666, "x": "また控訴。"}, {"t": 1647.3, "x": "ああ。"}, {"t": 1647.7, "x": "この控訴は、次の日の国会で取り上げられている。"}, {"t": 1650.7166666666667, "x": "一九九八年四月七日、参議院法務委員会。"}, {"t": 1654.4833333333333, "x": "一人の議員が、こう切り出した。"}, {"t": 1656.5333333333333, "x": "「甲山事件は、事件が発生してから二十四年、"}, {"t": 1659.65, "x": "起訴されてからも既に二十年以上が\n経過をいたしております」"}, {"t": 1663.2333333333333, "x": "「昨日、神戸地方検察庁は……無罪判決を不服として\n控訴をしたというニュースが伝わってまいりました。"}, {"t": 1669.25, "x": "私にとっては大変衝撃的なニュースでございます」"}, {"t": 1672.7, "x": "衝撃的。"}, {"t": 1673.7833333333333, "x": "そして、こう続けている。"}, {"t": 1675.4333333333334, "x": "「検察側は一審と\n今回の差し戻し審の二度にわたって裁判官を"}, {"t": 1679.55, "x": "説得することができなかった、\nすなわち無罪になったということでありますから」"}, {"t": 1683.9333333333334, "x": "「その上での昨日の控訴は、"}, {"t": 1685.4666666666667, "x": "疑わしきは被告人の利益にという刑事訴訟の大原則に"}, {"t": 1689.1333333333334, "x": "一体かなっておるのだろうかという批判がございます」"}, {"t": 1691.9333333333334, "x": "この日の委員会では、複数の議員が\nこの控訴を取り上げている。"}, {"t": 1695.6166666666666, "x": "一日の委員会で、一つの刑事事件の控訴が\nこれだけ議論されるのは、普通のことではない。"}, {"t": 1701.8333333333333, "x": "ここで制度の話をする。"}, {"t": 1703.4666666666667, "x": "日本国憲法の第三十七条に、こういう条文がある。"}, {"t": 1706.9333333333334, "x": "刑事事件で訴えられた人は、公平な裁判所の、\n迅速な公開裁判を受ける権利を持つ。"}, {"t": 1712.85, "x": "迅速な。"}, {"t": 1713.8333333333333, "x": "憲法に「迅速」と書いてある。"}, {"t": 1716.05, "x": "一九九八年の国会で、議員はここを突いている。"}, {"t": 1719.7, "x": "「迅速な裁判を受ける権利があるという\n憲法の建前やあるいは被告人の人権、\nそういった問題から考えて、"}, {"t": 1726.0166666666667, "x": "余りにも長過ぎるということ自体は\nもうぬぐえない事実ではないか」"}, {"t": 1729.8166666666666, "x": "そして、こういう言葉まで出てくる。"}, {"t": 1738.0166666666667, "x": "被疑者の権利のためにと、こういう\n意見も出たぐらいであります」"}, {"t": 1741.75, "x": "裁判に時効を。"}, {"t": 1743.0, "x": "もちろん、そんな制度はない。"}, {"t": 1744.7, "x": "だが、そういう言い方が出るくらい\n長かった、ということだ。"}, {"t": 1748.1166666666666, "x": "これに対して、当時の法務大臣はこう答えている。"}, {"t": 1751.2333333333333, "x": "「裁判というものはできるだけ速やかに\n結審すべきだというふうに私も思います」"}, {"t": 1755.8833333333334, "x": "「こんなに審理が長くなりますことは\n大変遺憾なことでございます」"}, {"t": 1759.7333333333333, "x": "法務省の刑事局長も、この日こう述べている。"}, {"t": 1762.6333333333334, "x": "「委員御指摘の点、法務当局といたしましても\nまことに深刻に受けとめさせていただいております」"}, {"t": 1768.4, "x": "役所も、長いと言っているのね。"}, {"t": 1770.6166666666666, "x": "ああ。それでも、控訴は取り下げられなかった。"}, {"t": 1773.35, "x": "ここは公平に扱いたい。なぜ控訴したのか、\nその理由も同じ日に説明されている。"}, {"t": 1778.45, "x": "刑事局長の言葉だ。"}, {"t": 1780.05, "x": "「一たん検察官として\n不起訴にした事件につきまして、"}, {"t": 1783.2833333333333, "x": "遺族等からの申し立てによりまして検察審査会が\n開かれ、いわば国民の代表の方々が本件については"}, {"t": 1789.8833333333334, "x": "不起訴不相当だという結論を出されました」"}, {"t": 1792.4333333333334, "x": "「それを受けて当時の検察官は相当力を込めて\n捜査をいたしましてそれについて起訴いたした」"}, {"t": 1797.8, "x": "「今回の判決をこのまま"}, {"t": 1799.3833333333334, "x": "確定させることについては、これまた正義に反し、\nこれについて是正する必要があるという判断に立った」"}, {"t": 1805.5666666666666, "x": "正義に反する。"}, {"t": 1806.7833333333333, "x": "検察の側から見た筋は、こうなる。"}, {"t": 1809.1833333333334, "x": "自分たちは一度、不起訴にした。"}, {"t": 1811.4, "x": "それを、遺族の申し立てを受けた\n市民の審査会がひっくり返した。"}, {"t": 1815.3833333333334, "x": "その求めに応えて起訴した。"}, {"t": 1817.15, "x": "高裁も一度は「審理が足りない」と言った。"}, {"t": 1819.9666666666667, "x": "ここで引き下がることは、亡くなった\n二人の子どもに対して正義に反する。"}, {"t": 1824.4333333333334, "x": "どっちの言い分も、分かってしまうのが困るわね。"}, {"t": 1827.4166666666667, "x": "そこがこの事件の苦しいところだ。"}, {"t": 1829.55, "x": "疑わしいときは被告人の利益に、というのも\n刑事司法の正しさだ。"}, {"t": 1833.7666666666667, "x": "何が起きたのかを明らかにする、というのも\n刑事司法の正しさだ。"}, {"t": 1837.7, "x": "この二つがぶつかったとき、\n削られていくのは時間だけだ。"}, {"t": 1841.25, "x": "しかもその時間は、被告人にされた\n人の人生の時間でもあり、\n遺族が答えを待つ時間でもある。"}, {"t": 1847.7666666666667, "x": "控訴審は、大阪高等裁判所で行われた。"}, {"t": 1850.8166666666666, "x": "初公判から判決まで、八か月。\nこの事件では、いちばん早かった。"}, {"t": 1855.5, "x": "一九九九年九月二十九日、判決が出る。"}, {"t": 1859.1166666666666, "x": "検察の控訴を棄却する、という\n内容だった。三度目の無罪だ。"}, {"t": 1863.3166666666666, "x": "三度目。"}, {"t": 1864.1833333333334, "x": "ああ。"}, {"t": 1864.6, "x": "そして一九九九年十月八日。"}, {"t": 1867.3666666666666, "x": "大阪高等検察庁が、上告しないことを発表した。"}, {"t": 1871.0, "x": "ここで、無罪が確定した。"}, {"t": 1872.8666666666666, "x": "偽証で起訴されていた二人も、\n同じ月に無罪が確定している。"}, {"t": 1876.8333333333333, "x": "元園長が十月二十二日。"}, {"t": 1878.6833333333334, "x": "元指導員が十月二十九日だ。"}, {"t": 1880.9666666666667, "x": "数字を並べる。"}, {"t": 1882.05, "x": "事件が起きたのが一九七四年三月。"}, {"t": 1885.05, "x": "逮捕が同じ年の四月七日。"}, {"t": 1887.1, "x": "起訴が一九七八年三月九日。"}, {"t": 1890.0, "x": "第一回公判が同じ年の六月五日。"}, {"t": 1892.7666666666667, "x": "無罪の確定が一九九九年十月八日。"}, {"t": 1896.2, "x": "事件から、二十五年。"}, {"t": 1897.9333333333334, "x": "ああ。逮捕から数えると、二十五年六か月だ。"}, {"t": 1901.05, "x": "裁判が始まってからでも、二十一年。"}, {"t": 1903.6333333333334, "x": "国会で「二十一年」と\n言われるのは、こちらの数え方だ。"}, {"t": 1907.4333333333334, "x": "内訳はこうなる。"}, {"t": 1908.5833333333333, "x": "一審が七年四か月。控訴審が四年五か月。"}, {"t": 1911.7166666666667, "x": "上告審が二年一か月。"}, {"t": 1913.65, "x": "差し戻し審が五年一か月。"}, {"t": 1915.4833333333333, "x": "最後の控訴審が八か月。"}, {"t": 1917.4333333333334, "x": "そして、この間に有罪判決は一度も出ていない。"}, {"t": 1920.5833333333333, "x": "無罪になったあとのことも、少しだけ話しておく。"}, {"t": 1923.7, "x": "無罪になった人には刑事補償という制度がある。"}, {"t": 1926.5333333333333, "x": "ただしそれは、身柄を拘束されていた\n期間についてのものだ。"}, {"t": 1930.2, "x": "裁判が続いた二十一年そのものは、\n身柄の拘束ではない。"}, {"t": 1934.15, "x": "裁判の長さは、補償されないの？"}, {"t": 1936.5166666666667, "x": "制度としてはそうなる。"}, {"t": 1937.9166666666667, "x": "この事件で実際に補償を受けたのかどうかは、\n私が調べた範囲では確認できなかった。"}, {"t": 1943.2333333333333, "x": "だから、受けたとも受けていないとも言わない。"}, {"t": 1945.75, "x": "二〇〇〇年二月三日の衆議院予算委員会で、\n議員がこの事件を挙げてこう言っている。"}, {"t": 1950.6333333333334, "x": "「二十年、三十年たったら、もう\nとにかく青春時代は戻ってこない。"}, {"t": 1954.75, "x": "青春どころか、もう\n老人になってしまっていることだってあるわけですね」"}, {"t": 1959.5833333333333, "x": "ここからは私の見方だ。"}, {"t": 1961.1666666666667, "x": "事実と分けて聞いてほしい。"}, {"t": 1962.9, "x": "三つある。"}, {"t": 1963.65, "x": "一つ目。この事件を「未解決事件」と\n呼んでいいのか、ということだ。"}, {"t": 1968.0833333333333, "x": "私は、呼ばないことにした。"}, {"t": 1970.15, "x": "どうして？"}, {"t": 1971.0, "x": "未解決事件というと、犯人が逃げていて\n捕まらない事件を指すことが多い。"}, {"t": 1975.55, "x": "この事件で起きたのは、そうではない。"}, {"t": 1977.7666666666667, "x": "最後の控訴審の判決に、こういう一節がある。"}, {"t": 1980.8, "x": "ほかの職員にはアリバイがあるという\n検察の主張について、裁判所はこう書いている。"}, {"t": 1985.6166666666666, "x": "「これらの点についての捜査は、"}, {"t": 1987.2833333333333, "x": "初めから犯人を絞り込んでいたためか、\n極めて不十分であり、"}, {"t": 1991.0166666666667, "x": "今となっては事実関係が不明といわざるを得ない」"}, {"t": 1994.1333333333334, "x": "初めから絞り込んでいた。"}, {"t": 1995.9166666666667, "x": "裁判所がそう書いている。"}, {"t": 1997.4666666666667, "x": "つまり、真相が分からないのは、\n時間がたったからだけではない。"}, {"t": 2001.25, "x": "最初の捜査が一人に向いていて、\nほかを調べていなかった。"}, {"t": 2004.8, "x": "だからいまとなっては分からない、と\n裁判所が認定している。"}, {"t": 2008.2833333333333, "x": "二つ目。二十一年という時間についてだ。"}, {"t": 2011.1, "x": "私が気になっているのは、この時間が\n誰の判断で伸びたのか、はっきりしないことだ。"}, {"t": 2016.2333333333333, "x": "誰か一人が悪意で伸ばしたわけじゃない。"}, {"t": 2018.55, "x": "検察審査会は制度どおりに動いた。"}, {"t": 2020.9166666666667, "x": "遺族は納得できなかった。"}, {"t": 2022.55, "x": "当たり前だと思う。"}, {"t": 2023.8166666666666, "x": "検察は、その求めに応えようとした。"}, {"t": 2026.4, "x": "高裁は、審理が足りないと判断した。"}, {"t": 2028.9166666666667, "x": "一つ一つは、それぞれの持ち場の判断だ。"}, {"t": 2031.8666666666666, "x": "それが積み重なって、二十一年？"}, {"t": 2034.2833333333333, "x": "私はそう見ている。"}, {"t": 2035.5666666666666, "x": "制度が壊れて長くなったのではなく、制度が\nそれぞれ動いた結果として長くなった。"}, {"t": 2040.5166666666667, "x": "だとすると、直し方がとても難しい。"}, {"t": 2043.0833333333333, "x": "三つ目。子どもの証言のことだ。"}, {"t": 2045.3, "x": "私が言いたいのは、あの子たちが\n嘘をついた、ということでは絶対にない。"}, {"t": 2049.5333333333333, "x": "問われたのは、聞いた大人の側だ。"}, {"t": 2051.6833333333334, "x": "二年半前の記憶を、あとから、繰り返し聞かれる。"}, {"t": 2054.9, "x": "そういう聞き方をされたとき、\n人の記憶に何が起きるのか。"}, {"t": 2058.5333333333333, "x": "それは、子どもでも大人でも同じ問題だ。"}, {"t": 2061.2833333333333, "x": "私も二年半前の夕方のことなんて言えないわ。"}, {"t": 2064.4333333333334, "x": "私もだ。"}, {"t": 2065.95, "x": "最後に、この事件で\nいちばん忘れられやすいことを言っておく。"}, {"t": 2069.4, "x": "一九七四年三月、二人の子どもが亡くなった。"}, {"t": 2073.116666666667, "x": "そのことについて、いまも誰も説明できていない。"}, {"t": 2076.133333333333, "x": "二十五年かけて裁判をやって、無罪になった。"}, {"t": 2079.0833333333335, "x": "それは、その人がやったと\n証明できなかった、という判断だ。"}, {"t": 2082.9166666666665, "x": "だが、二人の子どもに何が\n起きたのかは、そこには書かれていない。"}, {"t": 2086.983333333333, "x": "誰も答えを持っていない。"}, {"t": 2088.633333333333, "x": "ああ。"}, {"t": 2089.05, "x": "起訴された人は、人生の二十五年を\nこの事件に取られた。"}, {"t": 2092.733333333333, "x": "遺族は、答えを聞けないまま二十五年待たされた。"}, {"t": 2095.766666666667, "x": "どちらも失った。"}, {"t": 2097.0333333333333, "x": "だから私は、この回を「冤罪を晴らした話」としても、\n「不可解な事件の謎」としても作りたくなかった。"}, {"t": 2104.0, "x": "どちらか一方にすると、もう片方が消える。"}, {"t": 2106.766666666667, "x": "私がこのチャンネルで何度も\n言っていることを、最後にもう一度言う。"}, {"t": 2110.55, "x": "記録は残る。"}, {"t": 2111.5666666666666, "x": "今回話したことは、ほとんど全部、無料で読める。"}, {"t": 2114.8333333333335, "x": "一九七八年三月に法務大臣が「やや異例」\n「異様に感じた」と言ったことも。"}, {"t": 2120.5, "x": "起訴状に動機が書かれていなかったと\n役所が認めたことも。"}, {"t": 2124.0333333333333, "x": "一九九八年に法務省が\n「深刻に受けとめる」と言ったことも。"}, {"t": 2128.7, "x": "二〇一六年に、この裁判の弁護人だった\n人が国会で話したことも。"}, {"t": 2133.35, "x": "全部、国会会議録検索システムに残っている。"}, {"t": 2136.616666666667, "x": "一九八五年の判決文も、公開されている。"}, {"t": 2140.133333333333, "x": "どなたでも読める。今すぐ読める。"}, {"t": 2142.2, "x": "事件の解説動画は、たくさんある。"}, {"t": 2144.366666666667, "x": "私が作っているものも、その一つだ。"}, {"t": 2147.0833333333335, "x": "だが、動画で見た話が本当か\nどうかを、自分で確かめる手段がある。"}, {"t": 2151.483333333333, "x": "よかったら、一度自分で開いてみてほしい。"}, {"t": 2154.1, "x": "この回について、あなたはどう考えるか。"}, {"t": 2156.483333333333, "x": "コメントで聞かせてほしい。"}, {"t": 2158.0666666666666, "x": "最後まで見てくれて、ありがとう。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
