<script>
const D={"name": "069", "file": "069_編集用", "dur": 2071.8333125, "segs": [], "subs": [{"t": 0.0, "x": "一九九〇年十一月十三日。"}, {"t": 2.7, "x": "新潟県で、一人の女子児童が行方不明になった。"}, {"t": 5.966666666666667, "x": "当時、九歳。小学生だ。"}, {"t": 8.05, "x": "家族が届け出て、警察が動いた。"}, {"t": 10.466666666666667, "x": "見つからなかった。"}, {"t": 11.666666666666666, "x": "翌年になっても、その翌年になっても、\n見つからなかった。"}, {"t": 15.583333333333334, "x": "九歳。"}, {"t": 16.35, "x": "この子が発見されたのは、二\n〇〇〇年一月二十八日だ。"}, {"t": 20.033333333333335, "x": "九年二か月後。"}, {"t": 21.283333333333335, "x": "場所は、新潟県柏崎市。"}, {"t": 23.55, "x": "新潟県内？"}, {"t": 24.716666666666665, "x": "ああ。同じ県の中だ。"}, {"t": 26.316666666666666, "x": "先に断っておく。"}, {"t": 27.666666666666668, "x": "この方は存命だ。だから、この回では名前を出さない。"}, {"t": 30.95, "x": "学校も出さない。今どうしているかも話さない。"}, {"t": 33.95, "x": "そして、九年二か月のあいだにこの部屋で\n何があったのかも、私は話さない。"}, {"t": 38.95, "x": "話さないの。"}, {"t": 40.016666666666666, "x": "そこは、この人の人生であって、\n私たちが覗いていい場所じゃない。"}, {"t": 44.15, "x": "「なぜ逃げなかったのか」という\n言い方も、この回では一度もしない。"}, {"t": 47.96666666666667, "x": "この回で見ていくのは、別のところだ。"}, {"t": 50.35, "x": "届け出を受け取った側が、\n九年二か月のあいだ何をしていたのか。"}, {"t": 54.38333333333333, "x": "そして、この人が見つかったその日に、\n新潟県警察の一番上にいた人物が何をしていたのか。"}, {"t": 60.63333333333333, "x": "見つかった日に？"}, {"t": 61.833333333333336, "x": "ああ。そこが、この事件がいまも語られている理由だ。"}, {"t": 65.05, "x": "根拠にするのは、国会の会議録と、\n法律の条文と、警察庁が出している統計だけだ。"}, {"t": 70.83333333333333, "x": "ここに書かれていないことは、話さない。"}, {"t": 73.86666666666666, "x": "まず、骨組みだけ先に並べる。"}, {"t": 76.0, "x": "二〇〇〇年三月八日、衆議院の地方行政委員会。"}, {"t": 79.31666666666666, "x": "警察庁長官の田中節夫さんが、\nこの事案について正式に報告している。"}, {"t": 84.13333333333334, "x": "その報告の言葉をそのまま読む。"}, {"t": 86.26666666666667, "x": "「平成二年十一月十三日に"}, {"t": 88.36666666666666, "x": "行方不明となった女子児童が\n本年一月二十八日になって発見・保護された事件で、"}, {"t": 93.53333333333333, "x": "新潟県警察は二月十一日、被疑者を未成年者略取・\n逮捕監禁致傷の罪で逮捕いたしました」"}, {"t": 100.31666666666666, "x": "二月十一日。発見から二週間。"}, {"t": 102.98333333333333, "x": "もう一つ、同じ日の国家公安委員長の報告だ。"}, {"t": 106.26666666666667, "x": "「本年一月二十八日、新潟県柏崎市において、"}, {"t": 109.86666666666666, "x": "九年二カ月にわたり監禁されていた\n女性が発見・保護されました」"}, {"t": 114.13333333333334, "x": "この二つが、この事件の公的な骨組みだ。"}, {"t": 117.05, "x": "行方不明になったのが一九九〇年十一月十三日。"}, {"t": 120.98333333333333, "x": "発見されたのが二〇〇〇年一月二十八日。"}, {"t": 123.91666666666667, "x": "罪名は、未成年者略取と、逮捕監禁致傷。"}, {"t": 127.28333333333333, "x": "九歳のときは何年生かしら。"}, {"t": 129.43333333333334, "x": "この点は、五年後の国会に、\nはっきりした証言が残っている。"}, {"t": 133.38333333333333, "x": "二〇〇五年六月十日、衆議院の法務委員会。"}, {"t": 136.48333333333332, "x": "参考人として呼ばれた\n慶應義塾大学大学院の教授、井田良さんが、"}, {"t": 141.03333333333333, "x": "刑法の話をするなかでこの事件に触れている。"}, {"t": 144.0, "x": "「新潟でありました、当時九歳の女子小学生を\n九年間以上にわたり監禁したというケース」"}, {"t": 149.75, "x": "九歳の小学生？"}, {"t": 151.23333333333332, "x": "そうだ。ここは国会で、刑法学者が、\n法律を変える理由として述べた言葉だ。"}, {"t": 156.2, "x": "この回では、そのくらい固い\n根拠のあるものだけを使う。"}, {"t": 159.6, "x": "発見された場所は柏崎市。"}, {"t": 161.45, "x": "柏崎警察署の管轄だ。"}, {"t": 163.6, "x": "行方不明になったときに\n対策本部が置かれたのは、三条警察署だった。"}, {"t": 168.28333333333333, "x": "署が違うのね。"}, {"t": 169.5, "x": "ああ。この「署が違う」ということが、\nあとでもう一度出てくる。"}, {"t": 173.9, "x": "では、二〇〇〇年一月二十八日の話をする。"}, {"t": 177.03333333333333, "x": "この日、保健所の職員が被疑者の家を\n訪れて、そこにいた女性を発見した。"}, {"t": 181.9, "x": "発見された時刻は、午後一時三十分ごろだ。"}, {"t": 185.05, "x": "どうして時刻まで分かるの？"}, {"t": 186.83333333333334, "x": "それが記録に残っているからだ。"}, {"t": 188.83333333333334, "x": "二〇〇〇年二月二十二日、\n衆議院の地方行政委員会で、"}, {"t": 192.38333333333333, "x": "警察庁の刑事局長だった\n林則清さんがこう答弁している。"}, {"t": 196.63333333333333, "x": "「お尋ねの点、\n一時三十分ということになっております」"}, {"t": 199.96666666666667, "x": "「添付いたしました犯罪事実の記載時間は、"}, {"t": 202.65, "x": "監禁終了時間を、保健所員の方が被害者を\n発見した午後一時三十分ごろとしております」"}, {"t": 208.53333333333333, "x": "監禁がいつ終わったかというのは、\n法律上、大事な意味を持つ。"}, {"t": 212.35, "x": "監禁というのは、閉じ込めているあいだ\nずっと続いている犯罪だからだ。"}, {"t": 216.53333333333333, "x": "終わった時刻がそのまま罪の終わりになるのね。"}, {"t": 219.35, "x": "ああ。だから令状を請求するときにも、\nこの時刻が書かれた。"}, {"t": 223.08333333333334, "x": "さて。ここからが問題だ。"}, {"t": 224.88333333333333, "x": "保健所の職員は、警察に電話をしている。"}, {"t": 227.65, "x": "午後二時ごろ。柏崎警察署に、警察官を\n三人ほど寄こしてほしい、という要請だ。"}, {"t": 233.13333333333333, "x": "理由は「暴れている」。"}, {"t": 234.65, "x": "それは、来るでしょう。"}, {"t": 236.03333333333333, "x": "来なかった。"}, {"t": 237.01666666666668, "x": "来なかった？"}, {"t": 238.01666666666668, "x": "ああ。この日、警察官は現場に行っていない。"}, {"t": 240.76666666666668, "x": "柏崎署の署員が病院に向かったのは、\nそのあと、もう一度連絡を受けてからだ。"}, {"t": 245.76666666666668, "x": "「この女性は九年前に行方不明になった\n人だ」という連絡を受けて、初めて動いた。"}, {"t": 251.63333333333333, "x": "この電話のやりとりは、警察庁の調査で\n細かく再現されている。"}, {"t": 255.63333333333333, "x": "二〇〇〇年二月二十八日、衆議院地方行政委員会。"}, {"t": 259.06666666666666, "x": "田中長官の説明だ。"}, {"t": 260.78333333333336, "x": "まず、午後二時ごろ、保健所からの電話を\n受けたのは少年補導員だった。"}, {"t": 264.93333333333334, "x": "女性の警察職員だ。"}, {"t": 266.71666666666664, "x": "この人は、受けた内容をすぐに\n生活安全課に報告している。"}, {"t": 270.6333333333333, "x": "そして午後二時七分ごろ、生活安全課長が\n「三名を差し向けるように」と指示を出した。"}, {"t": 276.35, "x": "じゃあ、行くことになったのね。"}, {"t": 278.25, "x": "ならなかった。"}, {"t": 279.2, "x": "長官の言葉を読む。"}, {"t": 280.6, "x": "「生活安全係長がその保健所職員に\n対しまして電話をいたしましたところ、"}, {"t": 285.26666666666665, "x": "被疑者は既に病院に搬送されている、\nその際に、少女がいる、"}, {"t": 289.1333333333333, "x": "警察官一人でもいいから来てくれという\nお話があったのでございますが、その際に、その対応で"}, {"t": 294.65, "x": "拒否をしたというふうに\n受け取られるような発言をしたということは"}, {"t": 298.03333333333336, "x": "間違いないという事実がございまして、\nそれで出動しなかった」"}, {"t": 301.8, "x": "警察官一人でもいいから来てくれ。"}, {"t": 304.1666666666667, "x": "保健所の側は、そう言っている。"}, {"t": 306.1166666666667, "x": "この「拒否をしたと受け取られるような\n発言」が何だったのか。"}, {"t": 309.85, "x": "それも、報告書に文言として残っている。"}, {"t": 312.6333333333333, "x": "二〇〇〇年三月十四日、\n参議院の地方行政・警察委員会。"}, {"t": 316.8, "x": "委員が、警察庁の報告書の五ページを\n読み上げている。"}, {"t": 320.1, "x": "「住所、氏名を聞いてくれ。そんなことまで"}, {"t": 322.7, "x": "押しつけないでくれ。もし家出人であれば\n警察で保護する。」と言って電話を切った。"}, {"t": 327.25, "x": "……そんなことまで押しつけないでくれ。"}, {"t": 329.35, "x": "ああ。"}, {"t": 329.75, "x": "後日、警察庁の長官はこの点についてこう言っている。"}, {"t": 333.23333333333335, "x": "「国民の要望等に対し、相手方の立場に\n立ち、積極的に対応していく」"}, {"t": 338.18333333333334, "x": "「地域の安全を確保するため、関係機関と\n密接な協力関係を確立してまいりたい」"}, {"t": 343.71666666666664, "x": "関係機関、というのは。"}, {"t": 345.43333333333334, "x": "この場合は保健所だ。"}, {"t": 346.85, "x": "同じ市の中で、同じ人を\n助けようとしていた役所同士だ。"}, {"t": 350.6, "x": "そこで電話が切れた。"}, {"t": 352.6, "x": "同じ一月二十八日、新潟県警は\n記者会見を開いている。"}, {"t": 356.71666666666664, "x": "九年間行方不明だった人が\n見つかったのだから、当然だ。"}, {"t": 360.53333333333336, "x": "その会見で、記者から\n「どうやって見つかったのか」と聞かれた。"}, {"t": 364.46666666666664, "x": "県警はこう答えた。"}, {"t": 365.85, "x": "病院で男が暴れているという通報があった。"}, {"t": 368.35, "x": "警察官がそこに行ったところ、\n一緒にいた女性が被害者だった。"}, {"t": 372.46666666666664, "x": "さっきの話と違う。"}, {"t": 374.05, "x": "違う。"}, {"t": 374.6333333333333, "x": "実際には、警察は保健所からの電話に応じていない。"}, {"t": 377.81666666666666, "x": "発見したのは保健所の職員だ。"}, {"t": 380.06666666666666, "x": "これについて、三月八日の報告はこう書いている。"}, {"t": 383.1666666666667, "x": "「これは事実と\n異なるものでありましたが、その真意は、"}, {"t": 386.26666666666665, "x": "第一発見者に迷惑がかかることを\nおもんぱかったことなどに\nよるものであり、いずれも本部長まで"}, {"t": 391.78333333333336, "x": "了解を得ておりました」"}, {"t": 393.1666666666667, "x": "本部長まで？"}, {"t": 394.28333333333336, "x": "ああ。県警のトップまで話が上がった\n上で、その説明が出ている。"}, {"t": 398.31666666666666, "x": "ここは正確に押さえておきたい。"}, {"t": 400.18333333333334, "x": "警察庁の調査では、\nこの発表の目的について、こう結論している。"}, {"t": 404.7, "x": "二月二十八日の長官答弁だ。"}, {"t": 407.0833333333333, "x": "「その発見時、事実と異なる報道をしたということは"}, {"t": 410.3333333333333, "x": "確認されました。ただ、それは被害者の悲惨な"}, {"t": 413.31666666666666, "x": "状況をおもんぱかってというようなことでありまして、"}, {"t": 415.75, "x": "後刻発覚いたしました柏崎署の対応を\n隠ぺいするためではないということは確認できた」"}, {"t": 421.3333333333333, "x": "隠すためではなかった、と。"}, {"t": 423.25, "x": "警察庁はそう説明している。"}, {"t": 425.23333333333335, "x": "ただ、その説明が出された二月二十四日の時点では、\nまだ別の事実が表に出ていなかった。"}, {"t": 431.18333333333334, "x": "そのことは、あとで話す。"}, {"t": 432.95, "x": "いずれにせよ、事実と違う発表が\n行われたこと自体は確定している。"}, {"t": 437.3833333333333, "x": "そして、それについて関係者に懲戒処分が\n行われたことも、報告に書かれている。"}, {"t": 443.25, "x": "発表が訂正されたのは、二月十七日の木曜日だ。"}, {"t": 447.0, "x": "一月二十八日から、三週間？"}, {"t": 449.6, "x": "ああ。二十日以上たっている。"}, {"t": 451.3, "x": "このことに、当時の国家公安委員長だった\n保利耕輔さんが強い言葉を残している。"}, {"t": 456.35, "x": "二〇〇〇年二月二十二日、衆議院地方行政委員会。"}, {"t": 459.78333333333336, "x": "「特に、先週の木曜日に"}, {"t": 461.55, "x": "私自身が出席した国家公安委員会におきまして、\nそういう事実があるんだから\nもっと厳正に調べなさいという"}, {"t": 467.95, "x": "大きな声を張り上げたことは事実でありまして、\nその後、実は県警の訂正発言があっております」"}, {"t": 473.71666666666664, "x": "そしてこう続けている。"}, {"t": 475.1666666666667, "x": "「したがいまして、私が大きな声を出していなければ\n訂正しなかったのかなということも考えられます」"}, {"t": 481.1166666666667, "x": "大臣が怒鳴るまで直らなかった。"}, {"t": 483.28333333333336, "x": "本人がそう言っている。"}, {"t": 484.68333333333334, "x": "さらに、この人はこうも言っている。"}, {"t": 486.78333333333336, "x": "「一番の問題は、一月二十八日に\nこの事案が起こって、"}, {"t": 490.4, "x": "どうも長い間監禁されていた少女らしい女性が\n出てきたという時点で、これは"}, {"t": 494.76666666666665, "x": "大変なことだということをまず県警本部長は\n認識すべきだと私は思うのであります」"}, {"t": 499.9, "x": "「これだけ大きな問題なんだということをしっかり"}, {"t": 502.65, "x": "認識すれば、これは間違った\n会見その他をしてはならぬという\n常識が働くはずであります」"}, {"t": 507.8, "x": "「訂正がございましたのが\n二月の十七日でありますから、"}, {"t": 511.05, "x": "事件が起こりましてからかなりたっているわけです」"}, {"t": 513.9, "x": "「大事な問題だといったら、"}, {"t": 515.45, "x": "訂正すべきだったら、もう\nその日あるいはその翌日には、\nこれは間違っておりましたと、"}, {"t": 520.4166666666666, "x": "仮に第一発見者をかばうにしても、\nそのくらいの処置はできたのだろう」"}, {"t": 524.8, "x": "その日か、翌日には。"}, {"t": 526.65, "x": "そして最後に、自分についてこう述べている。"}, {"t": 529.3166666666667, "x": "「私がきちんと襟を\n正させることができなかったということについては、"}, {"t": 533.1333333333333, "x": "遺憾千万でありますし、私自身責任を感じております」"}, {"t": 536.9833333333333, "x": "この時点では、まだ、いちばん\n大きな話は出てきていない。"}, {"t": 541.1666666666666, "x": "二〇〇〇年二月二十日、警察庁は\n現地に調査団を送っている。"}, {"t": 545.0833333333334, "x": "官房審議官を長とする五人のチームだ。"}, {"t": 547.6, "x": "現地では、午前十時から午後五時ごろまで。"}, {"t": 550.3666666666667, "x": "一日で終わったの？"}, {"t": 551.8, "x": "一日だ。"}, {"t": 552.65, "x": "本部長、刑事部長、生活安全部長、\nそして柏崎警察署に赴いて、\n関係者から事情を聞き、資料を見た。"}, {"t": 560.1333333333333, "x": "調べる項目は五つと決まっていた。"}, {"t": 562.4166666666666, "x": "一つ、被害者発見時の\n捜査第一課長の記者会見の経緯。"}, {"t": 566.4666666666667, "x": "二つ、保健所職員からの出動要請への対応。"}, {"t": 569.7166666666667, "x": "三つ、被疑者の母親からの相談に\n対する柏崎警察署の対応。"}, {"t": 574.1833333333333, "x": "四つ、前歴のある被疑者が、\nこの事件の捜査対象者として浮上しなかった理由。"}, {"t": 579.2833333333333, "x": "五つ、巡回連絡によって被害者が\n発見されなかった理由。"}, {"t": 583.1333333333333, "x": "この五項目の結果が、二月二十四日に\n国会の委員会に報告された。"}, {"t": 587.7333333333333, "x": "そして、その内容が「簡単すぎる」と批判された。"}, {"t": 591.3333333333334, "x": "足りなかったの？"}, {"t": 592.4833333333333, "x": "足りていなかった。"}, {"t": 593.6333333333333, "x": "二月二十八日の委員会で、\n公明党の桝屋敬悟さんがこう言っている。"}, {"t": 597.9833333333333, "x": "「本当はもっと大きな、"}, {"t": 599.2666666666667, "x": "重大な事実が背後にあったんではないか、それを\n把握されていたんじゃないか、それを隠すがために"}, {"t": 605.15, "x": "あんな発表になったんじゃないかと\n国民は思っていると思いますよ」"}, {"t": 608.4333333333333, "x": "「警察は捜査のプロでありますから、絶対に\n押さえられる事実だろうというふうに私は思います」"}, {"t": 613.8833333333333, "x": "この読みは、当たっていた。"}, {"t": 615.55, "x": "保利大臣は、こう言っている。"}, {"t": 617.3, "x": "「今回の大変な事態を初めて耳にいたしましたのは、\n二月の二十四日の夜中のことでありました」"}, {"t": 623.3666666666667, "x": "報告を受けた、その日の夜？"}, {"t": 625.4833333333333, "x": "ああ。"}, {"t": 625.9, "x": "五人が一日かけて調べた報告を委員会に出した、\nその日の夜中に、大臣は別の話を聞かされている。"}, {"t": 633.1, "x": "三月八日の警察庁長官の報告に戻る。"}, {"t": 636.1333333333333, "x": "報告の最後の項目は「関東管区警察局長等に係る\n事案について」と題されている。"}, {"t": 641.85, "x": "そのまま読む。"}, {"t": 642.8333333333334, "x": "「被害者発見・保護の当日、"}, {"t": 644.75, "x": "新潟県警察に対する特別監察のため\n来県中の関東管区警察局長は、"}, {"t": 650.05, "x": "本部長とともに県内のホテルに宿泊し、私的な\n会食、遊興を行っていた事実が判明いたしました」"}, {"t": 656.9166666666666, "x": "特別監察のため？"}, {"t": 658.6, "x": "ああ。前の年から神奈川県警を\nはじめとして、警察の不祥事が続いていた。"}, {"t": 663.4333333333333, "x": "その再発防止のために、上の組織が\n下の組織を検査しに行く。それが特別監察だ。"}, {"t": 669.1333333333333, "x": "検査に来た人と、検査される\n側の県警本部長が、同じホテルにいた。"}, {"t": 673.75, "x": "報告は続く。"}, {"t": 674.85, "x": "「局長は、警察本部における特別監察に立ち会わず、"}, {"t": 678.35, "x": "午後、警察署で特別監察を実施した\n後、宿泊場所に向かいました」"}, {"t": 683.1666666666666, "x": "「本部長は、宿泊場所で局長と合流し、"}, {"t": 685.9, "x": "既に被害者発見の報告を受けていたにも\nかかわらず、局長らとの私的な懇親会を開始し、"}, {"t": 691.6333333333333, "x": "引き続きマージャンを行っていたものであります」"}, {"t": 694.55, "x": "……既に報告を受けていたにもかかわらず。"}, {"t": 697.0166666666667, "x": "ここは、報告書の文言そのままだ。"}, {"t": 699.4333333333333, "x": "九年二か月ぶりに一人の人が\n見つかった、という報告を受けたあとで、"}, {"t": 703.6333333333333, "x": "懇親会が始まり、マージャンが続いた。"}, {"t": 706.3, "x": "報告はこう結ぶ。"}, {"t": 707.5666666666667, "x": "「局長及び本部長のかかる行動は、\n警察最高幹部として極めて不適切、不見識であり」"}, {"t": 713.5666666666667, "x": "「国家公安委員会は、本部長に対し、"}, {"t": 715.9666666666667, "x": "事実と異なる報道についての責任とあわせ、\n懲戒処分を行い、また、局長及び本部長は"}, {"t": 722.15, "x": "引責辞職いたしました」"}, {"t": 723.6, "x": "そしてもう一行ある。"}, {"t": 724.9666666666667, "x": "「さらに、私自身、国家公安委員会から、"}, {"t": 727.75, "x": "局長に対する監督責任を問われ、\n懲戒処分を受けたところであります」"}, {"t": 732.4666666666667, "x": "国家公安委員長も？"}, {"t": 734.05, "x": "ああ。この報告を読み上げている\n本人が、処分を受けている。"}, {"t": 737.6166666666667, "x": "報告は最後にこう言っている。"}, {"t": 739.4166666666666, "x": "「昨年来の一連の不祥事案を受け、"}, {"t": 741.6, "x": "組織を挙げてその再発防止に取り組んでいる\nさなかに、このような不祥事案が発生し、"}, {"t": 746.55, "x": "警察に対する信頼が傷ついたことは、\nまさに断腸の思いであります」"}, {"t": 751.5833333333334, "x": "ここで、処分がどう決まったかを見ておきたい。"}, {"t": 754.2, "x": "国家公安委員会というのは、五人の委員と、\n委員長である大臣で構成される合議体だ。"}, {"t": 759.5, "x": "警察を管理するための、警察の外側にある\n機関ということになっている。"}, {"t": 764.1, "x": "外から見張る役ね。"}, {"t": 765.65, "x": "その建前だ。"}, {"t": 766.7166666666667, "x": "ところが、この処分は会議を開かずに決まっている。"}, {"t": 769.8, "x": "保利大臣の説明を読む。"}, {"t": 771.4833333333333, "x": "「翌日、この問題については、"}, {"t": 773.4333333333333, "x": "私も申しましたが、このような県警本部長を新潟に"}, {"t": 776.8833333333333, "x": "一日も置いておくわけにはいかないと\nいうことで、できるだけ"}, {"t": 780.15, "x": "早く処分をしてやめさせろということを\n申し上げたのであります」"}, {"t": 783.4333333333333, "x": "「それで、処分についての基本的な形を\n二十五日につくりまして、そして、たまたま、"}, {"t": 788.7333333333333, "x": "四人の国家公安委員の方々が\n別の会合でおられたところに田中長官が\n出向きまして、そして処分について"}, {"t": 795.0666666666667, "x": "御連絡を申し上げ」"}, {"t": 796.6, "x": "別の会合のところに行って？"}, {"t": 798.55, "x": "ああ。四人はそこにいた。"}, {"t": 800.0, "x": "残る一人には電話で連絡した。"}, {"t": 802.2, "x": "「その後、処分案を各先生方にお持ちをして"}, {"t": 804.9666666666667, "x": "御決裁をいただいて、この処分を\n決定したというのが実情でございます」"}, {"t": 809.1333333333333, "x": "懲戒は二月二十六日付。"}, {"t": 811.05, "x": "辞任は二月二十九日付。"}, {"t": 813.0666666666667, "x": "辞任の日付については、こう説明している。"}, {"t": 815.8333333333334, "x": "「県警本部長の交代でありますから、"}, {"t": 818.0166666666667, "x": "県議会の谷間の日を見まして、その日を\n辞任の日ということにいたした次第であります」"}, {"t": 823.2333333333333, "x": "段取りは、ずいぶん丁寧ね。"}, {"t": 825.1833333333333, "x": "この決め方には、与党の側からも批判が出ている。"}, {"t": 828.35, "x": "三月八日、自由民主党の山本公一さんの発言だ。"}, {"t": 832.1833333333333, "x": "「私は、事の重要性に\nかんがみたときに、その決定というのか、"}, {"t": 836.15, "x": "国家公安委員会という存在が持ち回りで"}, {"t": 838.75, "x": "一つの意思が\n決定をされていったということについては、\nやはり適切なことではなかったんだろうと"}, {"t": 843.7666666666667, "x": "思います」"}, {"t": 844.6666666666666, "x": "「いずれにいたしましても、"}, {"t": 845.9333333333333, "x": "持ち回りで重大なことを決めたということに"}, {"t": 848.3333333333334, "x": "対しては、やはり不適切なことであったんだろうと\n私は思っております」"}, {"t": 852.6333333333333, "x": "警察を外から管理するはずの機関が、\n集まらないまま決裁した。"}, {"t": 856.8, "x": "このあと国会で議論されたのは、まさにそこだ。"}, {"t": 860.3666666666667, "x": "ここで、話を九年二か月のほうに戻す。"}, {"t": 863.2333333333333, "x": "三月八日の報告には、組織の話とは別に、\n捜査そのものについての項目が並んでいる。"}, {"t": 869.1333333333333, "x": "そこには、こういう言い方が二回出てくる。"}, {"t": 871.6, "x": "「救出できた可能性もあり、まことに残念であります」"}, {"t": 875.0666666666667, "x": "可能性があった、と警察庁が書いているの？"}, {"t": 877.9666666666667, "x": "ああ。自分たちの報告書に、そう書いている。"}, {"t": 880.7833333333333, "x": "一つずつ見ていく。"}, {"t": 882.0833333333334, "x": "先に言っておくと、これは\n「誰か個人が悪かった」という話ではない。"}, {"t": 886.4166666666666, "x": "どれも、記録が残らなかった、情報が\nつながらなかった、という形をしている。"}, {"t": 891.3, "x": "つまり、その気になれば\n仕組みで防げたはずのものだ。"}, {"t": 894.4333333333333, "x": "だからこそ、このあと制度が変わった。"}, {"t": 896.9, "x": "三つあるのね。"}, {"t": 898.0333333333333, "x": "報告に出てくるのは三つだ。"}, {"t": 899.9, "x": "一つ目は、被疑者の前歴の記録。"}, {"t": 902.3, "x": "二つ目は、警察官が家を回る「巡回連絡」。"}, {"t": 905.6166666666667, "x": "三つ目は、被疑者の母親が警察署に来たときの対応。"}, {"t": 909.1833333333333, "x": "この三つを順番に見ていく。"}, {"t": 911.6166666666667, "x": "一つ目。"}, {"t": 912.4333333333333, "x": "報告をそのまま読む。"}, {"t": 913.8666666666667, "x": "「被疑者は、柏崎警察署において、"}, {"t": 916.1666666666666, "x": "本件事件発生の約一年半前に強制わいせつ罪で\n逮捕されていたのでありますが、"}, {"t": 921.25, "x": "被疑者の取り調べ担当者が必要な\n手口資料を作成していなかったため、"}, {"t": 925.6333333333333, "x": "本件の捜査対象者から漏れることとなり」"}, {"t": 928.4833333333333, "x": "一年半前に、同じ署で逮捕されていた？"}, {"t": 931.35, "x": "ああ。同じ柏崎警察署だ。"}, {"t": 933.5166666666667, "x": "手口資料というのは、犯罪の手口を\n分類して登録しておく捜査の資料だ。"}, {"t": 938.2, "x": "似た手口の事件が起きたとき、\nそこから候補を絞り込む。"}, {"t": 941.7166666666667, "x": "それが作られていなかった。"}, {"t": 943.5, "x": "作らなかったら、どうなるの？"}, {"t": 945.4666666666667, "x": "検索しても出てこない。"}, {"t": 947.0166666666667, "x": "その人がいた、という事実自体が、\n捜査の側から見えなくなる。"}, {"t": 951.0166666666667, "x": "そしてもう一行、続きがある。"}, {"t": 953.0166666666667, "x": "「また、柏崎警察署からは三条警察署の対策本部に"}, {"t": 956.7333333333333, "x": "対し、被疑者に関する情報が\n寄せられておりませんでした」"}, {"t": 960.35, "x": "さっきの、署が違うという話。"}, {"t": 962.5833333333334, "x": "ああ。ここで効いてくる。"}, {"t": 964.0166666666667, "x": "行方不明の届け出を受けて\n対策本部を置いたのは、三条警察署だ。"}, {"t": 968.35, "x": "一年半前にこの被疑者を\n逮捕したのは、柏崎警察署だ。"}, {"t": 972.3666666666667, "x": "同じ新潟県警の中の、別々の署だ。"}, {"t": 975.2333333333333, "x": "その二つが、つながらなかった。"}, {"t": 977.35, "x": "報告は、今後の対応としてこう書いている。"}, {"t": 980.05, "x": "「捜査支援システムへの確実な登録と\n活用について、その徹底を図ってまいりたい」"}, {"t": 985.25, "x": "登録されていなかったものは、どこにも\n存在しない。それだけの話だ。"}, {"t": 990.2833333333333, "x": "二つ目。巡回連絡だ。"}, {"t": 992.1833333333333, "x": "交番や駐在所の警察官が、受け持ちの家を\n一軒ずつ回って話を聞く。あれのことだ。"}, {"t": 997.8666666666667, "x": "何のためにやるの？"}, {"t": 999.2166666666667, "x": "誰がどこに住んでいるかを把握して、\n困りごとがあれば聞き取るためだ。"}, {"t": 1003.2333333333333, "x": "報告を読む。"}, {"t": 1004.2166666666667, "x": "「少女が監禁された時点から発見までの間、"}, {"t": 1007.0166666666667, "x": "被疑者宅に対する巡回連絡において三回の面接を\n行っておりますが、不審点の発見には至らず、また、"}, {"t": 1013.8, "x": "周辺の住宅に対する巡回連絡においても\n不審情報は得られませんでした」"}, {"t": 1018.6166666666667, "x": "三回、行っている？"}, {"t": 1020.0666666666667, "x": "ああ。九年二か月のあいだに、三回。"}, {"t": 1022.5833333333334, "x": "二月二十八日の長官答弁では、\nもう少し細かく言っている。"}, {"t": 1026.65, "x": "平成二年から発見時まで、所轄の警察署員が\n三回にわたって被疑者宅を巡回連絡した。"}, {"t": 1032.7, "x": "そのうち二回は母親と面談し、\n一回は誰と面談したか分からない。"}, {"t": 1037.0166666666667, "x": "被疑者や被害者の所在を確認することはできなかった。"}, {"t": 1040.35, "x": "そして報告は、こう書いている。"}, {"t": 1042.35, "x": "「巡回連絡の機会に十分に\n状況を聞き出すことができれば、"}, {"t": 1045.9166666666667, "x": "被害者を救出できた可能性もあり、\nまことに残念であります」"}, {"t": 1049.9833333333333, "x": "救出できた可能性。"}, {"t": 1051.6166666666666, "x": "警察庁が、自分の報告書にそう書いている。"}, {"t": 1054.55, "x": "ここは、誰かを責めるために読む\n場所ではないと思っている。"}, {"t": 1057.8833333333334, "x": "家を訪ねて、玄関で母親と\n話をして、何も分からずに帰る。"}, {"t": 1062.1166666666666, "x": "それは、たいていの家では正しい対応だ。"}, {"t": 1064.5833333333333, "x": "問題は、その三回が記録として\nどこにも積み上がらなかったことだ。"}, {"t": 1068.7333333333333, "x": "一回目と二回目と三回目が、\n別々の紙で終わってしまえば、何も見えてこない。"}, {"t": 1074.3833333333334, "x": "三つ目。これがいちばん重い。"}, {"t": 1076.2333333333333, "x": "報告を読む。"}, {"t": 1077.2166666666667, "x": "「被疑者の母親は、平成八年に柏崎警察署に赴き、"}, {"t": 1081.1166666666666, "x": "被疑者に関し相談をした旨述べておりますが、\nその際の記録がなく、また、"}, {"t": 1085.7833333333333, "x": "当時の警察署員も記憶しておりませんでした」"}, {"t": 1088.8166666666666, "x": "平成八年。"}, {"t": 1090.0, "x": "一九九六年だ。"}, {"t": 1091.8333333333333, "x": "行方不明になってから六年後。"}, {"t": 1093.7166666666667, "x": "発見される四年前だ。"}, {"t": 1095.5166666666667, "x": "四年前に、母親が相談に来ていた？"}, {"t": 1098.2166666666667, "x": "本人はそう述べている。"}, {"t": 1099.65, "x": "ただし、警察の側にその記録はなかった。"}, {"t": 1102.2833333333333, "x": "当時の署員も覚えていなかった。"}, {"t": 1104.2666666666667, "x": "だから、何を相談したのかは\n分からない。そこは分からないままだ。"}, {"t": 1108.2333333333333, "x": "報告は、そのうえでこう書いている。"}, {"t": 1110.3833333333334, "x": "「母親からの相談に対し、"}, {"t": 1112.05, "x": "事実関係を詳細に聴取するなどの対応をしていれば、\nその時点で被害者を発見、"}, {"t": 1117.0666666666666, "x": "救出できた可能性があり、まことに残念であります」"}, {"t": 1120.6, "x": "その時点で？"}, {"t": 1121.6666666666667, "x": "ああ。四年、早かったかもしれない。"}, {"t": 1123.9, "x": "「かもしれない」を並べても、\nあの九年二か月は一日も短くならない。"}, {"t": 1128.35, "x": "それは分かっている。"}, {"t": 1129.5333333333333, "x": "それでも、この一行が公式の報告書に\n書かれたことには意味がある。"}, {"t": 1133.65, "x": "相談を受けたのに記録を残さなかった、ということが、\n失敗として認められたからだ。"}, {"t": 1138.9, "x": "報告は、今後の対応をこう書いている。"}, {"t": 1141.3, "x": "「相談者の立場に立って真摯に\n対応することを組織全体に浸透させ、"}, {"t": 1145.5666666666666, "x": "全国すべての警察署に困り事の専任相談員を\n配置するなど、適切な対応に努めてまいりたい」"}, {"t": 1152.0833333333333, "x": "全国すべての警察署に。"}, {"t": 1154.0333333333333, "x": "これが、この事件から出てきた最初の具体的な変更だ。"}, {"t": 1158.25, "x": "ここから、組織の話に移る。"}, {"t": 1160.4666666666667, "x": "二〇〇〇年三月、国家公安委員会は\n「警察刷新会議」というものを発足させた。"}, {"t": 1165.8666666666666, "x": "警察の外の人たちに集まってもらって、警察を\nどう作り直すかを議論してもらう会議だ。"}, {"t": 1171.5833333333333, "x": "外の人に頼んだのね。"}, {"t": 1173.3833333333334, "x": "自分たちだけで決めても、誰も\n信じないという段階まで来ていた。"}, {"t": 1177.3166666666666, "x": "どのくらい来ていたか。数字がある。"}, {"t": 1179.45, "x": "二〇〇〇年十一月八日、参議院の本会議で、\n菅川健二さんが警察白書の意識調査を引いている。"}, {"t": 1185.9166666666667, "x": "「警察白書における国民の意識調査によると、"}, {"t": 1188.8166666666666, "x": "警察の捜査活動について何らかの不満を\n持っている人が七三・一％に上り、"}, {"t": 1194.25, "x": "一九六九年の二八・八％に\n比べると信頼の低下は深刻です」"}, {"t": 1199.8166666666666, "x": "二八・八％から七三・一％？"}, {"t": 1203.3666666666666, "x": "三十年で、そこまで動いている。"}, {"t": 1205.5333333333333, "x": "同じ日の演説で、\n刷新会議の座長のことばも引かれている。"}, {"t": 1209.3, "x": "「このところ警察不祥事が頻発し、国民は\n不安のどん底におののいています」"}, {"t": 1214.0333333333333, "x": "「私はこの警察をめぐるさまざまな問題の根本には、"}, {"t": 1217.2666666666667, "x": "日本の警察が戦後半世紀以上を経過し、\n制度疲労を起こしていることがあるのではないか」"}, {"t": 1222.6, "x": "制度疲労。座長は、そういう言い方をしている。"}, {"t": 1225.45, "x": "この会議は、七月十三日に国家公安委員会へ\n「警察刷新に関する緊急提言」を出した。"}, {"t": 1231.7833333333333, "x": "二〇〇〇年八月四日、衆議院の地方行政委員会。"}, {"t": 1235.0333333333333, "x": "国家公安委員長の西田司さんの言葉だ。"}, {"t": 1238.0666666666666, "x": "「同会議は、警察の刷新改革の方策について\n精力的かつ多角的に御論議をされ、去る七月十三日、"}, {"t": 1244.9666666666667, "x": "国家公安委員会に対しまして\n警察刷新についての緊急提言を\n提出していただきました」"}, {"t": 1250.7166666666667, "x": "「国家公安委員会といたしましては、この提言を\n重く受けとめ、警察庁とも協議しながら、"}, {"t": 1256.0833333333333, "x": "一日も早く国民の信頼を回復するため、"}, {"t": 1259.0, "x": "警察法改正など警察の刷新改革に\n全力を挙げて取り組む決意であります」"}, {"t": 1264.1166666666666, "x": "法律を変える、と。"}, {"t": 1265.5666666666666, "x": "ああ。この提言を受けて、その年の秋、\n警察法の改正案が国会に出される。"}, {"t": 1271.2166666666667, "x": "二〇〇〇年十月二十四日、衆議院の地方行政委員会。"}, {"t": 1274.8333333333333, "x": "西田国家公安委員長が、\n警察法改正案の提案理由を説明している。"}, {"t": 1279.4833333333333, "x": "柱は四つだ。順に見ていく。"}, {"t": 1281.5833333333333, "x": "一つ目。公安委員会が警察を管理する機能の強化だ。"}, {"t": 1285.2333333333333, "x": "これがいちばん重い。"}, {"t": 1286.3, "x": "中身は四つに分かれている。"}, {"t": 1288.0833333333333, "x": "まず、監察についての指示。"}, {"t": 1289.9666666666667, "x": "「監察について必要があると認めるときは、警察庁、"}, {"t": 1293.3, "x": "都道府県警察及び方面本部に\n対する指示を具体的または個別的な\n事項にわたるものとすることができる」"}, {"t": 1299.95, "x": "具体的または個別的な。"}, {"t": 1301.9333333333334, "x": "それまで、公安委員会は大まかな\n方針しか言えないとされていた。"}, {"t": 1305.7, "x": "「この件について、こう調べろ」とは\n言えない、という理解だった。"}, {"t": 1309.4333333333334, "x": "それを、言えることにした。"}, {"t": 1311.0833333333333, "x": "そして、こう続く。"}, {"t": 1312.4833333333333, "x": "「その指名する委員に、当該指示の履行の状況を\n点検させることができる」"}, {"t": 1316.9666666666667, "x": "ちゃんとやったか、見に行けるのね。"}, {"t": 1319.1166666666666, "x": "ああ。指示を出しっぱなしにしない、という条文だ。"}, {"t": 1322.05, "x": "二つ目。警察の側からの報告義務だ。"}, {"t": 1324.8, "x": "「警視総監または道府県警察本部長は、"}, {"t": 1327.4333333333334, "x": "都道府県警察の職員が、職務を遂行するに"}, {"t": 1330.55, "x": "当たって法令または条例の規定に\n違反した等の疑いがあると認める\n場合は、速やかに事実を調査し、"}, {"t": 1336.5333333333333, "x": "都道府県公安委員会に対し、\nその結果を報告しなければならない」"}, {"t": 1340.75, "x": "これは、新潟でも神奈川でも起きたことへの答えだ。"}, {"t": 1343.95, "x": "上に上げない、という選択肢を消した。"}, {"t": 1346.2833333333333, "x": "三つ目。苦情の申し出だ。"}, {"t": 1348.1, "x": "「都道府県警察の職員の職務執行について\n苦情がある者は、"}, {"t": 1351.85, "x": "都道府県公安委員会に対し文書により\n苦情の申し出をすることができる」"}, {"t": 1356.2333333333333, "x": "そして公安委員会は「これを誠実に\n処理し、処理の結果を文書により\n申し出者に通知しなければならない」"}, {"t": 1362.5666666666666, "x": "返事が来るのね。"}, {"t": 1363.85, "x": "文書で来る。ここが大きい。"}, {"t": 1365.5666666666666, "x": "四つ目。委員の再任の制限だ。"}, {"t": 1367.7, "x": "国家公安委員会の委員は一回まで、\n都道府県と方面の委員は二回まで。"}, {"t": 1372.3333333333333, "x": "そして柱の二つ目が、警察署協議会。"}, {"t": 1375.2166666666667, "x": "警察署ごとに置かれる、住民が\n意見を言うための機関だ。"}, {"t": 1378.75, "x": "署長の諮問に応じ、署長に対して意見を述べる。"}, {"t": 1381.85, "x": "残る二つは、航空機の強取など国の公安に\n関わる事案の規定と、政策評価の追加だ。"}, {"t": 1388.2833333333333, "x": "この改正案には、対案が二本出ている。"}, {"t": 1390.85, "x": "どちらも「政府案では足りない」という立場だ。"}, {"t": 1393.7333333333333, "x": "ここは、片方だけ紹介すると偏るので、両方読む。"}, {"t": 1397.3666666666666, "x": "まず民主党案。同じ十月二十四日、\n桑原豊さんの説明だ。"}, {"t": 1401.7833333333333, "x": "「国民は、警察に対する国民の監視の目を\n導入すること、そのために"}, {"t": 1406.15, "x": "公安委員会の機能の強化や\nさらなる情報公開を求めております。しかし、"}, {"t": 1410.55, "x": "政府案ではその視点が極めて弱く、内容的にも\n不十分であると言わざるを得ません」"}, {"t": 1415.5833333333333, "x": "中身は四つ。"}, {"t": 1416.6166666666666, "x": "公安委員会に独自の事務局を置くこと。"}, {"t": 1419.15, "x": "その事務局に監察官と監察部門を置いて、\n公安委員会が自分で監察をやること。"}, {"t": 1424.4333333333334, "x": "苦情処理委員会を置くこと。"}, {"t": 1426.1, "x": "そして、警察情報の公開だ。"}, {"t": 1428.45, "x": "自分で調べられるようにする、ということね。"}, {"t": 1431.1666666666667, "x": "そこが争点だった。"}, {"t": 1432.55, "x": "政府案は、公安委員会が「監察をやれ」と\n指示できる、という形だ。"}, {"t": 1437.1166666666666, "x": "やるのは警察自身になる。"}, {"t": 1438.85, "x": "もう一本、共産党案。"}, {"t": 1440.3333333333333, "x": "十一月九日、参議院で富樫練三さんが説明している。"}, {"t": 1444.3, "x": "この趣旨説明の冒頭に、新潟の話が出てくる。"}, {"t": 1447.6166666666666, "x": "「新潟で長年にわたり監禁されていた\n女性が発見された際に、"}, {"t": 1451.4, "x": "特別監察に訪れた関東管区警察局長と"}, {"t": 1454.6166666666666, "x": "監察される側の県警本部長が雪見酒と\nマージャンに興じていたことは、"}, {"t": 1458.75, "x": "警察にはもはや自浄作用が\n期待できないことを示しました」"}, {"t": 1462.55, "x": "自浄作用。"}, {"t": 1463.5166666666667, "x": "この案は、公安委員会に監察権そのものを\n与えて、直属の「警察監察委員室」を置く。"}, {"t": 1469.6333333333334, "x": "そして「委員や補佐には警察出身でない\n者を起用する」としている。"}, {"t": 1473.85, "x": "結果として成立したのは政府案だ。"}, {"t": 1476.1833333333334, "x": "外部監察は入らなかった。"}, {"t": 1477.9, "x": "公安委員会の独自の事務局も、置かれなかった。"}, {"t": 1481.05, "x": "この回では、どちらが正しかったかは言わない。"}, {"t": 1483.7666666666667, "x": "ただ、二〇〇〇年の秋に、そういう\n議論があったという事実は残しておきたい。"}, {"t": 1488.8, "x": "ここで、あの電話にもう一度戻る。"}, {"t": 1490.9666666666667, "x": "「もし家出人であれば警察で保護する」"}, {"t": 1493.3166666666666, "x": "家出人。"}, {"t": 1494.1, "x": "この言葉が、当時の制度の言葉だった。"}, {"t": 1496.7333333333333, "x": "同じ二〇〇〇年、参議院の地方行政・\n警察委員会で、別の事件が取り上げられている。"}, {"t": 1502.1166666666666, "x": "栃木県で、行方不明になった若い\n男性が、その後亡くなった事件だ。"}, {"t": 1506.6, "x": "その件について、警察庁長官はこう答弁している。"}, {"t": 1509.9833333333333, "x": "「家出人捜索願を受理した\n石橋警察署の生活安全課、これが、"}, {"t": 1514.35, "x": "一般的な先入観があったかも\nしれませんけれども、事件性がないと判断した」"}, {"t": 1519.3333333333333, "x": "「その後、御両親から"}, {"t": 1520.3666666666666, "x": "再三にわたりますところの御相談あるいは捜査要請を\n受けたにもかかわりませず事件性の検討を"}, {"t": 1525.9333333333334, "x": "怠る、あるいは事件がないから取り組まないんだと、\nこういうような考え方で終始していた」"}, {"t": 1531.2166666666667, "x": "事件がないから取り組まない。"}, {"t": 1533.0333333333333, "x": "長官は、栃木県からの報告として、こうも述べている。"}, {"t": 1536.5833333333333, "x": "「当時、日々発生する事件とか\n事故の対応に追われまして、"}, {"t": 1539.9666666666667, "x": "事件性のはっきりしない相談等への対応が非常に\n消極的になっていた、こういう側面もあった」"}, {"t": 1545.9, "x": "ここが、この回のいちばん\n大事なところだと私は思っている。"}, {"t": 1549.55, "x": "「家出人捜索願」という名前で\n受け取ったものは、「事件」ではない。"}, {"t": 1553.7166666666667, "x": "事件でないものは、事件になるまで動かない。"}, {"t": 1556.5666666666666, "x": "でも、事件になったときには遅い。"}, {"t": 1558.9, "x": "ああ。九年二か月というのは、そういう時間だ。"}, {"t": 1561.85, "x": "届け出を出した家族の側から見れば、\n初日から事件だ。"}, {"t": 1565.4, "x": "受け取る側の分類が、それに追いついていなかった。"}, {"t": 1569.0333333333333, "x": "いまは、この分類が変わっている。"}, {"t": 1571.05, "x": "二〇〇九年十二月十一日、「行方不明者発見活動に\n関する規則」という国家公安委員会規則が作られた。"}, {"t": 1578.4166666666667, "x": "平成二十一年国家公安委員会規則第十三号だ。"}, {"t": 1582.0, "x": "まず第一条、目的からいく。"}, {"t": 1584.0833333333333, "x": "「この規則は、個人の生命及び身体の保護を\n図るために行う行方不明者の発見のための活動、"}, {"t": 1590.0, "x": "発見時の措置等に関し必要な\n事項を定めることを目的とする」"}, {"t": 1594.3666666666666, "x": "生命及び身体の保護。"}, {"t": 1596.1166666666666, "x": "捜索の目的が、条文の一行目に書いてある。"}, {"t": 1599.2833333333333, "x": "そして第二条。"}, {"t": 1600.4, "x": "「「行方不明者」とは、"}, {"t": 1601.7166666666667, "x": "生活の本拠を離れ、その行方が明らかでない\n者であって、届出がなされたものをいう」"}, {"t": 1607.05, "x": "「家出人」という言葉は、ここにはもう無い。"}, {"t": 1609.5833333333333, "x": "そのうえで、第二条の二項に、この規則の中心がある。"}, {"t": 1613.0833333333333, "x": "「「特異行方不明者」とは、行方不明者のうち、\n次の各号のいずれかに該当するものをいう」"}, {"t": 1618.5666666666666, "x": "六つ並んでいる。読む。"}, {"t": 1620.15, "x": "一つ、殺人、誘拐等の犯罪により、その生命又は\n身体に危険が生じているおそれがある者。"}, {"t": 1626.4833333333333, "x": "二つ、少年の福祉を害する\n犯罪の被害にあうおそれがある者。"}, {"t": 1630.5166666666667, "x": "三つ、水難、交通事故その他の生命に\nかかわる事故に遭遇しているおそれがある者。"}, {"t": 1635.8, "x": "四つ、遺書があることなどから、\n自殺のおそれがある者。"}, {"t": 1639.2666666666667, "x": "五つ、精神障害の状態にあること、\n危険物を携帯していることなどから、"}, {"t": 1643.9166666666667, "x": "自身を傷つけ又は他人に害を及ぼすおそれがある者。"}, {"t": 1647.3833333333334, "x": "六つ、病人、高齢者、年少者その他の者であって、\n自救能力がないことにより、その生命又は"}, {"t": 1653.9166666666667, "x": "身体に危険が生じるおそれがあるもの。"}, {"t": 1656.2333333333333, "x": "一つ目に、誘拐が入っているのね。"}, {"t": 1658.7333333333333, "x": "ああ。そして六つ目に「年少者」が入っている。"}, {"t": 1661.9, "x": "この規則は、第三章を二つに分けている。"}, {"t": 1664.65, "x": "第一節が「一般的な発見活動」。"}, {"t": 1667.2, "x": "第二節が「特異行方不明者の発見活動」だ。"}, {"t": 1670.65, "x": "条文の建て方の上で、最初から\n二つの道が用意されている。"}, {"t": 1674.5166666666667, "x": "受理した署長が、聞き取った内容と集まった\n情報から、どちらに当たるかを判定する。"}, {"t": 1679.6833333333334, "x": "そして、判定が変わったときにも報告する義務がある。"}, {"t": 1683.1333333333334, "x": "あとから変えられるのね。"}, {"t": 1684.6666666666667, "x": "一度「一般」と判定したら終わり、にはなっていない。"}, {"t": 1688.6333333333334, "x": "制度の変化は、もう一つある。刑法だ。"}, {"t": 1691.35, "x": "二〇〇五年六月十日、衆議院法務委員会。"}, {"t": 1694.3166666666666, "x": "刑法などの改正案の参考人質疑で、\n慶應義塾大学大学院の井田良教授が\n意見を述べている。"}, {"t": 1700.6333333333334, "x": "この改正案の柱の一つが、法定刑の引き上げだった。"}, {"t": 1704.3333333333333, "x": "「刑法二百二十条の逮捕監禁罪の刑の上限を\n懲役五年から七年に、そして、"}, {"t": 1709.45, "x": "組織的な犯罪の処罰及び犯罪収益の規制等に"}, {"t": 1712.8333333333333, "x": "関する法律三条の逮捕監禁罪の刑の上限を\n懲役七年から十年に引き上げる、また、"}, {"t": 1718.45, "x": "刑法二百二十四条の未成年者略取誘拐罪の刑の上限を\n懲役五年から七年に"}, {"t": 1723.8166666666666, "x": "引き上げることが提案されております」"}, {"t": 1725.9833333333333, "x": "五年から七年。"}, {"t": 1727.3, "x": "その理由として、井田さんはこの事件を挙げている。"}, {"t": 1730.2166666666667, "x": "「法律家は、一般に、"}, {"t": 1731.6666666666667, "x": "逮捕監禁あるいは略取誘拐といった\n犯罪を、自由を侵害する罪、"}, {"t": 1735.8333333333333, "x": "自由に対する罪であるという\nふうに呼ぶのが普通であります」"}, {"t": 1739.1666666666667, "x": "「現に、多くの事件では、まさに自由を\n侵害する罪にすぎないのでありましょう」"}, {"t": 1743.7666666666667, "x": "「しかし、新潟でありました、"}, {"t": 1745.4833333333333, "x": "当時九歳の女子小学生を"}, {"t": 1747.2, "x": "九年間以上にわたり監禁したというケースなどに\nはっきりとあらわれていますように」"}, {"t": 1751.8166666666666, "x": "「これらの犯罪は、ただ単に抽象的に\n自由を害するというばかりではなくて、"}, {"t": 1756.1666666666667, "x": "被害者に後々まで残る深い心の傷を与える、さらには"}, {"t": 1759.2, "x": "被害者本人の人生を破壊し、そして子供を奪われ、"}, {"t": 1763.0, "x": "残された御両親の人生をも\n破壊するだけのポテンシャルというものを持っている」"}, {"t": 1767.5333333333333, "x": "残された御両親の人生をも。"}, {"t": 1769.6333333333334, "x": "ああ。九年二か月というのは、\n待っていた家族の九年二か月でもある。"}, {"t": 1773.95, "x": "いまの刑法二百二十条は、こうなっている。"}, {"t": 1776.6166666666666, "x": "「不法に人を逮捕し、又は監禁した者は、\n三月以上七年以下の拘禁刑に処する」"}, {"t": 1782.1666666666667, "x": "二百二十四条、未成年者の略取と\n誘拐も、同じく三月以上七年以下だ。"}, {"t": 1787.3333333333333, "x": "ちなみに井田さんは、同じ場所で、上限を一気に\n十年にするのはやりすぎだとも述べている。"}, {"t": 1792.6333333333334, "x": "この人は、引き上げに賛成しながら、\n幅についてはブレーキも踏んでいる。"}, {"t": 1796.95, "x": "そういう議論を経て、五年が七年になった。"}, {"t": 1800.3333333333333, "x": "では、いまはどうなっているのか。数字で見る。"}, {"t": 1803.0, "x": "警察庁が毎年出している\n「行方不明者届受理等の状況」という資料がある。"}, {"t": 1808.0, "x": "最新の令和七年版から読む。"}, {"t": 1810.0666666666666, "x": "令和七年の行方不明者数は、八万四百八十六人。"}, {"t": 1813.8, "x": "前の年より二千七十七人減っている。"}, {"t": 1816.6333333333334, "x": "八万人？"}, {"t": 1817.6333333333334, "x": "一年で八万件、行方不明者届が出ている。"}, {"t": 1820.7, "x": "男女の内訳は、男性が五万九百十八人で六三・三％、\n女性が二万九千五百六十八人で三六・七％。"}, {"t": 1829.65, "x": "年齢層で見ると、いちばん多いのは\n十歳代で、一万八千二百八十八人。"}, {"t": 1834.6833333333334, "x": "十歳代と二十歳代を合わせると、\n全体のおよそ四割になる。"}, {"t": 1838.7333333333333, "x": "若い人が多いのね。"}, {"t": 1840.25, "x": "そして、ここからが大事な数字だ。"}, {"t": 1842.5333333333333, "x": "令和七年のうちに所在が\n確認されたのは、八万千八百四十三人。"}, {"t": 1847.1166666666666, "x": "前の年までに届が出ていた分も含む。"}, {"t": 1849.85, "x": "届け出を受理してから所在が\n確認されるまでの期間で、いちばん\n多いのは「受理当日」で、"}, {"t": 1855.1833333333334, "x": "三万三千三百二十二人。"}, {"t": 1857.3666666666666, "x": "次が「二日から三日」で、二万百八十人。"}, {"t": 1860.8666666666666, "x": "ほとんどが数日で見つかっている？"}, {"t": 1863.0, "x": "ああ。大半は、その週のうちに終わる。"}, {"t": 1865.4, "x": "だが、同じ表の右の端に、別の数字が並んでいる。"}, {"t": 1868.8833333333334, "x": "一年から二年かかった人が、九百七十五人。"}, {"t": 1872.1666666666667, "x": "二年以上かかった人が、千四百四人。"}, {"t": 1875.0333333333333, "x": "……二年以上が、千四百人。"}, {"t": 1877.1, "x": "毎年これだけの人が、二年を超えても帰ってこない。"}, {"t": 1880.3833333333334, "x": "受理当日に見つかる三万三千人と、\n二年以上かかる千四百人は、\n同じ「行方不明者届」から始まっている。"}, {"t": 1887.95, "x": "どちらになるかを、最初の一日で\n見分けなければならない。"}, {"t": 1891.3666666666666, "x": "さっきの規則の第二条二項は、そのための条文だ。"}, {"t": 1895.3166666666666, "x": "ここからは、答えの出ていない話をする。"}, {"t": 1897.8666666666666, "x": "一つ目。あの三つの分かれ道は、\nいまなら塞がれているのか。"}, {"t": 1901.65, "x": "手口資料は、捜査支援システムへの登録が\n徹底された、ということになっている。"}, {"t": 1906.55, "x": "署をまたぐ情報も、当時よりはつながる。"}, {"t": 1909.0333333333333, "x": "相談についても、全国すべての警察署に\n困りごとの専任相談員を置く、と報告に書かれた。"}, {"t": 1915.2166666666667, "x": "でも、記録が残らなければ同じよね。"}, {"t": 1917.7833333333333, "x": "そこは、仕組みを作っただけでは決まらない。"}, {"t": 1920.4, "x": "二つ目。公安委員会は、いま機能しているのか。"}, {"t": 1923.55, "x": "二〇〇〇年の改正で、監察について\n具体的な指示ができるようになり、"}, {"t": 1927.5666666666666, "x": "履行状況を点検できるようになった。"}, {"t": 1930.0166666666667, "x": "苦情の申し出には、文書で返事が来るようになった。"}, {"t": 1933.15, "x": "一方で、外部監察は入らなかった。"}, {"t": 1935.5, "x": "独自の事務局も置かれていない。"}, {"t": 1937.5, "x": "あのとき「足りない」と言われた\n部分は、そのまま残っている。"}, {"t": 1941.1, "x": "三つ目。これがいちばん答えにくい。"}, {"t": 1943.2666666666667, "x": "この事件が国会でこれだけ議論されたのは、\n九年二か月という時間そのものより、"}, {"t": 1948.2, "x": "発見された日にホテルでマージャンをしていた、という\n部分だったのではないか。"}, {"t": 1952.5166666666667, "x": "分かりやすいから？"}, {"t": 1953.7833333333333, "x": "怒りやすい形をしている。"}, {"t": 1955.4666666666667, "x": "だが、この人が九年二か月見つからなかった\n直接の理由は、そこではない。"}, {"t": 1960.2833333333333, "x": "一年半前の前歴が登録されなかったこと。"}, {"t": 1963.0666666666666, "x": "三回の巡回連絡が積み上がらなかったこと。"}, {"t": 1965.85, "x": "母親の相談に記録が残らなかったこと。"}, {"t": 1968.7333333333333, "x": "どれも、地味で、絵にならない。"}, {"t": 1970.6833333333334, "x": "報道が大きくなるのは前者で、\n人の命に効くのは後者だ。"}, {"t": 1974.45, "x": "この差は、いまも埋まっていないと私は思う。"}, {"t": 1977.75, "x": "最後に、この回で何を\n話さなかったかを、もう一度言っておく。"}, {"t": 1981.5666666666666, "x": "被害者の名前を出さなかった。"}, {"t": 1983.45, "x": "学校も、現在も話さなかった。"}, {"t": 1985.75, "x": "九年二か月のあいだに\n何があったのかも、話さなかった。"}, {"t": 1989.4666666666667, "x": "最初に言った通りね。"}, {"t": 1990.9666666666667, "x": "この方は存命だ。それだけの理由だ。"}, {"t": 1993.45, "x": "この事件について検索すれば、\nもっと細かいことが出てくる。"}, {"t": 1997.1666666666667, "x": "私は、それを並べ直すことに意味があるとは思わない。"}, {"t": 2000.4166666666667, "x": "この回で並べたのは、公の記録に\n残っている失敗のほうだ。"}, {"t": 2004.35, "x": "出動要請の電話を断ったこと。"}, {"t": 2006.6166666666666, "x": "事実と違う発表をして、\n二十日たってから訂正したこと。"}, {"t": 2010.3666666666666, "x": "一年半前の前歴を登録しなかったこと。"}, {"t": 2013.2, "x": "三回訪ねて、何も残さなかったこと。"}, {"t": 2015.9333333333334, "x": "相談に来た人の記録を取らなかったこと。"}, {"t": 2018.6333333333334, "x": "そして、その日にホテルにいたこと。"}, {"t": 2020.85, "x": "この六つは、全部、警察庁と国家公安委員会が\n自分で国会に報告した内容だ。"}, {"t": 2026.5, "x": "自分で書いたのね。"}, {"t": 2027.8666666666666, "x": "ああ。だから、この回では\n私の推測をほとんど足していない。"}, {"t": 2031.5833333333333, "x": "そのあと、警察法が変わり、規則の言葉が\n「家出人」から「行方不明者」に変わり、"}, {"t": 2037.2166666666667, "x": "刑法の上限が五年から七年になった。"}, {"t": 2039.8333333333333, "x": "それで九年二か月が取り戻せるわけではない。"}, {"t": 2042.5666666666666, "x": "ただ、次の誰かの一年目や\n二年目が短くなる可能性はある。"}, {"t": 2046.5333333333333, "x": "いま、毎年八万件の届け出がある。"}, {"t": 2049.0833333333335, "x": "そのうち三万三千件は、その日のうちに終わる。"}, {"t": 2052.15, "x": "千四百件は、二年を超える。"}, {"t": 2054.2166666666667, "x": "その千四百件のどれかが、\n次の九年二か月にならないように。"}, {"t": 2058.25, "x": "それが、この事件から引き継がれたもののはずだ。"}, {"t": 2061.2, "x": "今回の内容は、国会会議録と、法令の条文と、\n警察庁の統計だけを根拠にした。"}, {"t": 2067.016666666667, "x": "出典は概要欄に置いておく。"}, {"t": 2068.9, "x": "最後まで見てくれて、ありがとうな。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
