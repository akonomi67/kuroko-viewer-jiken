<script>
const D={"name": "075", "file": "075_編集用", "dur": 2186.0833125, "segs": [], "subs": [{"t": 0.0, "x": "日本の事件には、まれに番号が付くことがある。"}, {"t": 2.9166666666666665, "x": "「警察庁指定第百十四号事件」。"}, {"t": 5.283333333333333, "x": "「警察庁指定第百十六号事件」。"}, {"t": 7.783333333333333, "x": "番号？"}, {"t": 8.55, "x": "ああ。"}, {"t": 8.966666666666667, "x": "一つの県の警察では手に負えない事件が\n起きたとき、警察庁が番号を付けて指定する。"}, {"t": 14.35, "x": "付いた瞬間から、その事件は\n全国の警察の事件になる。"}, {"t": 18.166666666666668, "x": "この番号が付いた事件は、これまでに二十四件ある。"}, {"t": 21.4, "x": "そのうち、犯人にたどり着けないまま終わった\n事件は、二件だ。"}, {"t": 25.383333333333333, "x": "二十四件のうち、二件。"}, {"t": 27.25, "x": "ああ。二十二件は捕まっている。"}, {"t": 29.283333333333335, "x": "今回の回は、その二件の話だ。"}, {"t": 31.75, "x": "先に、この動画で守ることを言っておく。"}, {"t": 34.25, "x": "一つ目。犯人像を一切書かない。"}, {"t": 36.583333333333336, "x": "この二件はどちらも時効が完成している。"}, {"t": 38.95, "x": "犯人が誰かは、法律上もう問われない。"}, {"t": 41.63333333333333, "x": "それでも、誰かを怪しいと言えば、\nその人の人生に触れることになる。"}, {"t": 45.8, "x": "だから、警察庁が国会で述べたこと以外は言わない。"}, {"t": 49.06666666666667, "x": "二つ目。亡くなった方や被害を\n受けた方の名前を出さない。"}, {"t": 52.733333333333334, "x": "事件の様子も描写しない。"}, {"t": 54.45, "x": "三つ目。この回は制度の話だ。"}, {"t": 56.733333333333334, "x": "「解けなかった事件のカタログ」にはしない。"}, {"t": 59.4, "x": "じゃあ、何を見るの？"}, {"t": 60.81666666666667, "x": "制度の側から見る。"}, {"t": 62.083333333333336, "x": "番号を付けて、全国の警察を\n動かして、それでも届かなかった。"}, {"t": 66.41666666666667, "x": "そのとき、何が足りなかったと\n警察自身が言っているのか。"}, {"t": 70.05, "x": "それが今回の芯だ。"}, {"t": 72.11666666666666, "x": "この制度は、世間では\n「広域重要指定事件」と呼ばれている。"}, {"t": 76.06666666666666, "x": "ただ、面白いことがある。"}, {"t": 77.76666666666667, "x": "国会会議録を全部検索すると、\n「広域重要指定」という言葉は五回しか出てこない。"}, {"t": 83.26666666666667, "x": "五回だけ？"}, {"t": 84.26666666666667, "x": "ああ。明治以来の全部の会議録を通してだ。"}, {"t": 87.01666666666667, "x": "役所の側は、この言葉をほとんど使っていない。"}, {"t": 89.98333333333333, "x": "役所が使うのは「警察庁指定事件」という言い方だ。"}, {"t": 93.58333333333333, "x": "こちらは八回。「広域重要事件」なら八回。"}, {"t": 96.63333333333334, "x": "どれも二桁に届かない。"}, {"t": 98.45, "x": "みんなが知っている名前と、役所の名前が違うのね。"}, {"t": 101.8, "x": "そうだ。"}, {"t": 102.4, "x": "だから、この回では「警察庁指定事件」で通す。"}, {"t": 105.85, "x": "国会で警察庁が\n説明しているときの言い方に合わせる。"}, {"t": 109.31666666666666, "x": "ちなみに、個別の番号で検索すると、もっと少ない。"}, {"t": 112.85, "x": "百十三号、百十四号、百十六号、百十七号。"}, {"t": 116.8, "x": "国会の記録に号数が出てくるのは、この四つだけだ。"}, {"t": 120.18333333333334, "x": "残りの二十件は、号数の形では一度も出てこない。"}, {"t": 123.7, "x": "番号だけあって、記録がないの？"}, {"t": 125.93333333333334, "x": "国会の記録には無い、ということだ。"}, {"t": 128.2, "x": "警察白書のほうを年度ごとにたどると、二十四件のうち\n二十二件までは事件の中身が書かれている。"}, {"t": 134.31666666666666, "x": "残る数件は、番号も事件名も見つからなかった。"}, {"t": 137.56666666666666, "x": "だからこの回では、名前まで\n確かめられた事件だけを扱う。"}, {"t": 141.28333333333333, "x": "二十四件を全部読み上げる、ということはしない。"}, {"t": 144.15, "x": "分からないものを分かったように並べるのは、\nこの回でやってはいけないことだ。"}, {"t": 148.98333333333332, "x": "制度の定義から入る。"}, {"t": 150.43333333333334, "x": "二〇二六年五月八日、衆議院法務委員会。"}, {"t": 153.65, "x": "警察庁の審議官が、この制度をこう説明している。"}, {"t": 157.0, "x": "「警察庁の指定事件とは、"}, {"t": 158.68333333333334, "x": "複数の管区警察局の管轄地域で\n発生している社会的影響の大きい凶悪又は"}, {"t": 164.06666666666666, "x": "特異な事件で、複数の地域にまたがり組織的に"}, {"t": 167.51666666666668, "x": "捜査を行う必要があるものとして警察庁が\n指定する、そういう事件でございました」"}, {"t": 172.26666666666668, "x": "管区警察局？"}, {"t": 173.68333333333334, "x": "都道府県警察の上に置かれている、\n地方ごとのまとめ役だ。"}, {"t": 177.36666666666667, "x": "東北、関東、中部、近畿、という\nふうに分かれている。"}, {"t": 180.93333333333334, "x": "つまり、県をまたぐだけでは足りない。"}, {"t": 183.1, "x": "地方ブロックをまたぐくらい\n広がった事件、という条件になる。"}, {"t": 186.8, "x": "かなり大きい事件だけね。"}, {"t": 188.53333333333333, "x": "ああ。だから二十四件しかない。"}, {"t": 190.53333333333333, "x": "ここで一つ、聞き逃さないでほしい言葉がある。"}, {"t": 193.45, "x": "この審議官は\n「そういう事件でございました」と言っている。"}, {"t": 197.03333333333333, "x": "でした。過去形？"}, {"t": 198.43333333333334, "x": "ああ、過去形だ。"}, {"t": 199.6, "x": "同じ日、質問した議員も「\n警察庁の広域重要指定事件というのは、"}, {"t": 204.15, "x": "今はないそうなんですけれども」と述べている。"}, {"t": 206.86666666666667, "x": "この制度は、いま新しい指定を出していない。"}, {"t": 209.51666666666668, "x": "ただ、いつ、どういう形でやめたのかは、\n私が調べた範囲では分からなかった。"}, {"t": 214.43333333333334, "x": "だから、「もう新しい指定は\n行われていない」までにしておく。"}, {"t": 218.08333333333334, "x": "廃止された年は言わない。"}, {"t": 219.5, "x": "裏が取れていないからだ。"}, {"t": 221.66666666666666, "x": "では、この制度は何を根拠に動いていたのか。"}, {"t": 224.5, "x": "一九九〇年三月二十九日、参議院法務委員会。"}, {"t": 228.36666666666667, "x": "警察庁の捜査第一課長が、\n根拠のつながりを説明している。"}, {"t": 232.41666666666666, "x": "読む。"}, {"t": 232.91666666666666, "x": "「この制度は、淵源的には"}, {"t": 234.61666666666667, "x": "警察法、それを受けました国家公安委員会規則である\n犯罪捜査共助規則を受けまして、"}, {"t": 240.06666666666666, "x": "通達ではございますが、"}, {"t": 241.5, "x": "広域重要事件捜査要綱というものを\nつくっておりまして、これに基づいてつくり、"}, {"t": 246.18333333333334, "x": "運用をしておるところでございます」"}, {"t": 248.35, "x": "通達。"}, {"t": 249.21666666666667, "x": "法律の下に、国家公安委員会の規則がある。"}, {"t": 252.3, "x": "その下に、通達がある。"}, {"t": 254.03333333333333, "x": "通達というのは、役所の中で\n上から下に出す指示書のことだ。"}, {"t": 258.0, "x": "国会が作るものではない。"}, {"t": 259.78333333333336, "x": "国会を通っていないの？"}, {"t": 261.3833333333333, "x": "この制度そのものは、法律として\n国会で議決されたものではない。"}, {"t": 265.3833333333333, "x": "警察法という法律があって、その下に\n規則があって、その下の通達で組まれている。"}, {"t": 270.76666666666665, "x": "私はここに、この回の一つの答えがあると思っている。"}, {"t": 274.23333333333335, "x": "日本でいちばん大きな事件を扱う\n仕組みが、通達で動いていた。"}, {"t": 278.15, "x": "だから国会の記録にもほとんど出てこない。"}, {"t": 280.73333333333335, "x": "法律を作るときは審議されるが、\n通達は審議されないからだ。"}, {"t": 284.6, "x": "同じ答弁で、事件の指定をどう\n決めるかも説明されている。"}, {"t": 288.26666666666665, "x": "「事件指定は警察庁が事件の発生地を管轄する\n管区警察局及び都道府県警察と協議をして行う」"}, {"t": 294.95, "x": "警察庁が、地方の警察と相談して決める。"}, {"t": 298.05, "x": "外から見えるところで決めるわけではない。"}, {"t": 300.98333333333335, "x": "では、番号が付くと具体的に何が起きるのか。"}, {"t": 304.03333333333336, "x": "二〇二六年五月八日の答弁に、三つ書いてある。"}, {"t": 307.5, "x": "読む。"}, {"t": 308.0, "x": "「警察庁が都道府県警察と捜査会議を\n開催いたしまして、捜査方針を協議するほか、"}, {"t": 313.43333333333334, "x": "関係都道府県警察以外の都道府県警察に\n対する捜査共助の指示、関係情報の集約、"}, {"t": 319.31666666666666, "x": "分析等を行うこととしていたところでございます」"}, {"t": 322.51666666666665, "x": "三つに分けて。"}, {"t": 323.71666666666664, "x": "一つ目。警察庁が、関係する県の警察を\n集めて会議を開き、捜査の方針を決める。"}, {"t": 329.5833333333333, "x": "二つ目。事件が起きていない\n県の警察にも、手伝えと指示できる。"}, {"t": 333.85, "x": "三つ目。情報を警察庁に集めて、分析する。"}, {"t": 337.35, "x": "それだけ？"}, {"t": 338.25, "x": "それだけだ、と言うこともできる。"}, {"t": 340.25, "x": "捜査そのものをやるのは、あくまで都道府県の警察だ。"}, {"t": 343.6, "x": "警察庁は、指揮を執るのではなく、調整をする。"}, {"t": 346.7, "x": "ここが、あとで効いてくる。"}, {"t": 348.35, "x": "もう一つ、番号が付いた事件では\n特別な捜査本部が置かれる。"}, {"t": 352.31666666666666, "x": "一九八八年三月二十三日、衆議院法務委員会。"}, {"t": 356.55, "x": "警察庁の捜査第一課長がこう述べている。"}, {"t": 359.3, "x": "「それぞれ関係都県警察に警察本部長を\n長といたします特別捜査本部を設置いたしております」"}, {"t": 365.43333333333334, "x": "本部長が直接。"}, {"t": 366.9166666666667, "x": "県警のトップが、自分でその事件の本部長になる。"}, {"t": 370.2, "x": "別の答弁では、これを\n「異例の特別捜査本部」と呼んでいる。"}, {"t": 374.2, "x": "それくらいの体制を組んだ、ということだ。"}, {"t": 377.31666666666666, "x": "そもそも、なぜこんな仕組みが要ったのか。"}, {"t": 379.85, "x": "日本の警察の作りに理由がある。"}, {"t": 382.03333333333336, "x": "一九九四年六月十六日、参議院地方行政委員会。"}, {"t": 386.3333333333333, "x": "警察庁の刑事局長が、広域事件の反省点を\n聞かれてこう答えている。"}, {"t": 391.01666666666665, "x": "読む。"}, {"t": 391.53333333333336, "x": "「中でも、現行の警察法では\n都道府県警察単位の事件捜査という\n形になっております」"}, {"t": 397.18333333333334, "x": "「この種の事件、広域捜査については、"}, {"t": 399.46666666666664, "x": "関係府県が多数に及ぶわけでございまして、\nその連係プレーがうまくいくか"}, {"t": 403.8833333333333, "x": "どうかが決め手になるわけでございます」"}, {"t": 405.9, "x": "「それがやはり一番大きな反省点でございます」"}, {"t": 408.8333333333333, "x": "警察庁が、自分でそう言っているの？"}, {"t": 411.35, "x": "ああ。国会の場で、刑事局長がそう述べている。"}, {"t": 414.3666666666667, "x": "日本の警察は、都道府県ごとに別の組織だ。"}, {"t": 417.55, "x": "犯人は県境を越えるが、\n警察の組織は県境で切れている。"}, {"t": 421.5833333333333, "x": "その差を埋めるために、番号を付けて\n全国を動かす仕組みが要った。"}, {"t": 425.55, "x": "一九八〇年四月八日、\n参議院法務委員会でも、この話が出ている。"}, {"t": 430.51666666666665, "x": "このときは、ある事件で二つの県警の連携が\nうまくいかなかったのではないか、という追及だった。"}, {"t": 436.35, "x": "警察庁の捜査第一課長は、\n犯罪捜査共助規則や、広域緊急配備、"}, {"t": 441.3333333333333, "x": "広域重要事件捜査要綱を作ってきたと答えている。"}, {"t": 444.8833333333333, "x": "何度も言われてきたのね。"}, {"t": 446.56666666666666, "x": "ああ。"}, {"t": 446.98333333333335, "x": "そして、一九八九年五月には、警察庁の中に\n広域捜査指導官室が置かれた。"}, {"t": 453.03333333333336, "x": "各都道府県警察にも、広域機動捜査班が置かれた。"}, {"t": 456.6666666666667, "x": "これも国会で報告されている。"}, {"t": 458.6166666666667, "x": "仕組みは足されてきた。\nそれでも、二件は届かなかった。"}, {"t": 462.73333333333335, "x": "ここで、この回のいちばん大事な数字を出す。"}, {"t": 465.48333333333335, "x": "二〇二六年五月八日、衆議院法務委員会。"}, {"t": 468.71666666666664, "x": "警察庁の審議官の答弁だ。"}, {"t": 470.81666666666666, "x": "「お尋ねの警察庁指定事件につきましては、"}, {"t": 473.51666666666665, "x": "二十四事件が指定されまして、このうち被疑者が\n検挙に至っていない事件は二事件でございまして」"}, {"t": 479.46666666666664, "x": "二十四件のうち、二件。"}, {"t": 481.35, "x": "ああ。"}, {"t": 481.75, "x": "番号は、百一号から百二十四号まで。"}, {"t": 484.55, "x": "ちなみに、平成十二年版の警察白書には「現在までに\n二十三の事件が指定されている」と書いてある。"}, {"t": 491.1666666666667, "x": "平成十八年版では「二十四事件」になっている。"}, {"t": 494.5833333333333, "x": "そのあと、新しい番号は増えていない。"}, {"t": 496.98333333333335, "x": "二十四件のうち、二十二件は犯人にたどり着いている。"}, {"t": 500.4, "x": "確率で言えば、九割を超えている。"}, {"t": 502.71666666666664, "x": "思ったより解けているのね。"}, {"t": 504.46666666666664, "x": "そうだ。だから、この二件が余計に重い。"}, {"t": 507.1166666666667, "x": "残った二件は、こうなる。"}, {"t": 508.8, "x": "警察庁指定第百十四号事件。"}, {"t": 511.15, "x": "警察庁指定第百十六号事件。"}, {"t": 513.5333333333333, "x": "どちらも、公訴時効が完成している。"}, {"t": 515.9166666666666, "x": "ここから、この二件を順番に見ていく。"}, {"t": 518.3666666666667, "x": "ただし、繰り返す。"}, {"t": 519.75, "x": "犯人が誰かの話はしない。"}, {"t": 521.5333333333333, "x": "警察庁が国会で述べたことだけを並べる。"}, {"t": 524.9666666666667, "x": "まず、百十四号だ。"}, {"t": 526.55, "x": "先に一つ断っておく。"}, {"t": 528.2833333333333, "x": "この事件そのものは、このチャンネルで\n一度、事件として扱っている。"}, {"t": 532.4666666666667, "x": "今回は、その回の焼き直しはしない。"}, {"t": 534.9, "x": "番号が付いた事件として、制度の側から見る。"}, {"t": 538.0166666666667, "x": "制度の側。"}, {"t": 539.0333333333333, "x": "ああ。"}, {"t": 539.4666666666667, "x": "二〇二六年五月八日の答弁を読む。"}, {"t": 542.1, "x": "「昭和五十九年三月に"}, {"t": 544.1, "x": "発生した江崎グリコ株式会社社長に対する\n身の代金目的誘拐事件に端を発し、その後、"}, {"t": 549.5833333333334, "x": "森永製菓等大手食品会社を対象に\n多額の現金が要求されたものであります」"}, {"t": 554.7333333333333, "x": "「犯人は、かい人二十一面相を名のり、自らの犯行を\n誇示するような文書を報道機関等に送付したほか」"}, {"t": 561.2833333333333, "x": "「関東、中部、関西地区の百貨店、"}, {"t": 563.6833333333333, "x": "スーパーマーケットの菓子売場等に\n青酸ソーダが混入した菓子が置かれ、"}, {"t": 567.6833333333333, "x": "広域にわたる殺人未遂事件が敢行されたものであり」"}, {"t": 571.1, "x": "「警察庁において警察庁指定第百十四号事件に\n指定し、関係都府県警察において捜査を行いました」"}, {"t": 577.9166666666666, "x": "指定されたのは、昭和五十九年四月十二日。"}, {"t": 580.9333333333333, "x": "事件が始まった翌月だ。"}, {"t": 582.95, "x": "関東、中部、関西。"}, {"t": 584.7833333333333, "x": "地方ブロックを三つまたいでいる。"}, {"t": 586.6833333333333, "x": "一九九〇年の答弁では、\n関わった警察が挙げられている。"}, {"t": 590.7166666666667, "x": "大阪、兵庫、京都、滋賀、愛知、そして警視庁。"}, {"t": 594.4333333333333, "x": "六つの警察だ。"}, {"t": 595.6833333333333, "x": "これを一つの県警でさばくのは、\nそもそも無理だという話になる。"}, {"t": 600.3, "x": "当時の経過を、警察庁が国会で説明している。"}, {"t": 603.5666666666667, "x": "一九八四年十月三十日、衆議院決算委員会。"}, {"t": 607.6333333333333, "x": "警察庁の捜査第一課長の答弁だ。"}, {"t": 610.2, "x": "「三月十八日夜、江崎グリコ社長を誘拐して以後、\n同社に対します放火等の一連の事件が発生した」"}, {"t": 616.9833333333333, "x": "「六月末一たん犯人グループよりの犯行中止声明が\n出まして、そのまま"}, {"t": 621.45, "x": "一時おさまっていたような時期があった」"}, {"t": 623.6666666666666, "x": "いったん止まったの？"}, {"t": 624.9666666666667, "x": "記録ではそうなっている。"}, {"t": 626.4333333333333, "x": "そして、続きだ。"}, {"t": 627.7833333333333, "x": "「その後九月中旬に至りまして犯人グループが今度は\n森永製菓株式会社に対して脅迫文を送達した」"}, {"t": 634.5166666666667, "x": "「さらに、その送達後十月七日から\n二十二日にかけまして京阪神、名古屋、"}, {"t": 639.35, "x": "東京で青酸入りの森永製品などを店頭に\n混在させる等の犯行を行っている」"}, {"t": 644.3833333333333, "x": "三月に始まって、六月にいったん止まり、九月に\n別の会社へ移り、十月に売り場に置かれた。"}, {"t": 650.4833333333333, "x": "半年ちょっとの出来事だ。"}, {"t": 652.1833333333333, "x": "当時、警察がどう動いたかも記録に残っている。"}, {"t": 655.25, "x": "一九八四年十月二十三日、参議院地方行政委員会。"}, {"t": 659.55, "x": "刑事局長の答弁だ。"}, {"t": 661.1833333333333, "x": "「この犯罪の各府県にまたがります広域性、"}, {"t": 663.9, "x": "重要性、こういったことにかんがみまして、\n警察庁指定事件ということで指定をいたしまして、"}, {"t": 669.4166666666666, "x": "大量の捜査員を動員をして捜査をやってまいった」"}, {"t": 672.45, "x": "捜査は三つに分けて進められた。"}, {"t": 674.5833333333334, "x": "人に関する捜査。遺留品など、物に\n関する捜査。そして特別巡回連絡だ。"}, {"t": 680.2, "x": "特別巡回連絡って？"}, {"t": 682.05, "x": "警察官が家を一軒ずつ回って話を\n聞く、という古典的なやり方だ。"}, {"t": 686.6, "x": "大阪、京都の一帯でそれをやった、と答弁している。"}, {"t": 690.6, "x": "この事件は、法律を一本作らせている。"}, {"t": 693.2833333333333, "x": "一九八五年六月二十五日、衆議院農林水産委員会。"}, {"t": 697.75, "x": "ある法案の提案理由の中に、こういう一節がある。"}, {"t": 700.8166666666667, "x": "「昨年三月に発生した警察庁指定第百十四号事件は、"}, {"t": 704.7666666666667, "x": "一部の食品メーカーの製品への毒物混入の予告、\n店頭における毒物の入った食品の発見等が相次ぎ」"}, {"t": 711.7333333333333, "x": "「店頭から製品が撤去されたり、"}, {"t": 713.6666666666666, "x": "正常な販売ルートが大幅に\n縮小される等の異常な事態を惹起し、"}, {"t": 717.7166666666667, "x": "国民一般及び食品産業界に\n多大の不安を与えたところであります」"}, {"t": 722.3, "x": "法案の理由に、事件の番号が書いてある。"}, {"t": 725.0833333333334, "x": "ああ。世間の呼び名ではなく、\n指定番号で名指ししている。"}, {"t": 728.5333333333333, "x": "できたのは「流通食品への毒物の混入等の防止等に\n関する特別措置法」だ。"}, {"t": 733.95, "x": "法令番号は昭和六十二年法律第百三号。"}, {"t": 737.0666666666667, "x": "公布は一九八七年九月二十六日。"}, {"t": 740.3833333333333, "x": "事件から三年半。"}, {"t": 741.9, "x": "ああ。しかも一度では通っていない。"}, {"t": 743.9666666666667, "x": "一九八五年、一九八六年、一九八七年と、\n三回に分けて提案理由が説明されている。"}, {"t": 751.6166666666667, "x": "三回とも、同じ番号で事件を名指ししている。"}, {"t": 754.6, "x": "この法律は議員立法だ。"}, {"t": 756.15, "x": "政府ではなく、国会議員が出した。"}, {"t": 758.5333333333333, "x": "中身は、発議者がこう説明している。"}, {"t": 761.05, "x": "「流通食品への毒物の混入等を\n行った者を最高十年の懲役に、また、\nこれによって人を死傷させた者を"}, {"t": 767.9833333333333, "x": "最高無期懲役に処する等の罰則を\n設けることといたしました」"}, {"t": 771.6666666666666, "x": "なぜそんな法律が要ったのか。"}, {"t": 773.5333333333333, "x": "一九八七年九月十日、\n参議院農林水産委員会の参考人質疑に\nその答えがある。"}, {"t": 779.6666666666666, "x": "食品産業センターの理事長がこう述べている。"}, {"t": 782.4166666666666, "x": "「殺意までは持たずに毒物を\n混入した場合に、そのことによって\n死傷の結果が生じなかったというふうな"}, {"t": 794.7, "x": "「毒物混入行為というもの、そのものに\n対する処罰規定が現行法ではございません」"}, {"t": 799.8833333333333, "x": "法律に穴があったのね。"}, {"t": 801.6, "x": "ああ。"}, {"t": 802.0, "x": "業務妨害の罪はあった。だが、\nこの参考人はこう言っている。"}, {"t": 805.75, "x": "「これもまた三年以下の懲役または"}, {"t": 807.4833333333333, "x": "二十万円以下の罰金というようなことでございまして、\nまことに軽過ぎる」"}, {"t": 811.9666666666667, "x": "事件は解けなかった。"}, {"t": 813.25, "x": "法律だけが残った。"}, {"t": 815.4166666666666, "x": "同じ参考人質疑で、狙われた会社に何が\n起きたかが具体的に述べられている。"}, {"t": 820.3666666666667, "x": "一九八七年九月十日、参議院農林水産委員会。"}, {"t": 824.5666666666667, "x": "食品産業センターの理事長の言葉だ。"}, {"t": 827.1166666666667, "x": "「五十九年の九月十二日にまず\n一億円要求の一通の脅迫状が当会社に舞い込んだ」"}, {"t": 832.6333333333333, "x": "そこから先の数字を、そのまま読む。"}, {"t": 835.0, "x": "「十月の同社の売り上げは\n前年比で六〇％減ってしまう」"}, {"t": 838.8, "x": "「十一月の販売額は前年同月比で七十億円の減、\n返品の続出というような惨たんたるありさまに」"}, {"t": 845.4333333333333, "x": "七十億円。"}, {"t": 846.5333333333333, "x": "ああ。一か月でだ。"}, {"t": 847.9, "x": "さらに続く。"}, {"t": 848.8666666666667, "x": "「パートの従業員四百五十人をとりあえず"}, {"t": 851.2833333333333, "x": "自宅待機をさせる、それからその後ついに\nその全員を解雇せざるを得なくなった」"}, {"t": 855.8, "x": "「一カ月間だけの損失が既に\n十億円ということでございまして、"}, {"t": 859.6166666666667, "x": "年間、この事案に対します\n同社の全体の損失は百三十億円に上る」"}, {"t": 864.45, "x": "「従業員のボーナスは即日二割減」"}, {"t": 866.8833333333333, "x": "働いていた人が、四百五十人。"}, {"t": 869.4333333333333, "x": "ああ。"}, {"t": 869.85, "x": "犯人に脅されたのは会社だが、\n失ったのはそこで働いていた人たちだ。"}, {"t": 874.4666666666667, "x": "この参考人は、助けようとした側の話もしている。"}, {"t": 877.8666666666667, "x": "「同社を救えという民間の非常に\n大きな広範な援助運動が巻き起こりまして」"}, {"t": 882.4, "x": "「例のお菓子の千円パックの袋詰めのお菓子を\n各職場でもさばいていただくというふうなことを、"}, {"t": 887.3833333333333, "x": "恐らく行政府では初めてでございましょうが」"}, {"t": 890.05, "x": "「個別の私的な会社の応援に農水省を\n中心にして立ち上がってくれまして」"}, {"t": 894.5666666666667, "x": "「従業員とその家族三千人がすべて街頭に\n出てこれを売り歩いたわけでございまして、"}, {"t": 899.3333333333334, "x": "小売店三千店に一軒一軒頭を下げて歩いた」"}, {"t": 902.7333333333333, "x": "家族まで街頭に出たの？"}, {"t": 904.4666666666667, "x": "そう述べている。"}, {"t": 905.45, "x": "そして、この参考人は最後にこう言っている。"}, {"t": 908.2166666666667, "x": "「三年を経過した今日でも三年前の一〇\n〇％の水準にまで業績が戻っていない」"}, {"t": 913.3, "x": "同じ日、労働組合の代表も参考人として出ている。"}, {"t": 916.7666666666667, "x": "「本法案の必要性の背景的な理由であるグリコ・"}, {"t": 919.7833333333333, "x": "森永事件はいまだ完全解決をしておらず、\nまことに悔しい思いでいっぱいであります」"}, {"t": 924.9333333333333, "x": "「その影響は今日まで残っております」"}, {"t": 927.1, "x": "一九八七年の国会で、そう述べられている。"}, {"t": 931.1666666666666, "x": "この事件には、もう一つ厄介な性質があった。"}, {"t": 934.2666666666667, "x": "真似をする者が出たことだ。"}, {"t": 935.9666666666667, "x": "同じ参考人が、警察庁が把握した件数を挙げている。"}, {"t": 939.6, "x": "「それ以来警察庁の認知事件数だけ\n取り上げてみましても、この種類の犯罪が\n昭和五十九年に五十一件、"}, {"t": 945.9833333333333, "x": "六十年に百一件、六十一年には二百二十二件」"}, {"t": 949.7833333333333, "x": "倍、倍で増えている。"}, {"t": 951.3, "x": "ああ。"}, {"t": 951.7333333333333, "x": "一九八四年に五十一件。"}, {"t": 954.0666666666667, "x": "一九八五年に百一件。"}, {"t": 956.3666666666667, "x": "一九八六年に二百二十二件。"}, {"t": 959.1166666666667, "x": "食品に毒物を入れて企業を脅す、という型の事件だ。"}, {"t": 962.65, "x": "参考人はこれを「年を追いまして倍増の非常に\n脅威的な発生件数」と表現している。"}, {"t": 968.2, "x": "解けないと、真似されるのね。"}, {"t": 970.15, "x": "一九八八年四月二十日、\n衆議院決算委員会でも、この話が出ている。"}, {"t": 975.5666666666667, "x": "警察庁の刑事局長の答弁だ。"}, {"t": 977.8666666666667, "x": "「グリコ・森永事件以来、"}, {"t": 979.5166666666667, "x": "食品に毒物を混入する等して企業等を\n恐喝するというような事案が多発しているのは"}, {"t": 984.9833333333333, "x": "御指摘のとおりでございます」"}, {"t": 986.5, "x": "そして、こう続けている。"}, {"t": 988.15, "x": "「聞くところによりますと、やはりアメリカとか"}, {"t": 990.5666666666667, "x": "韓国におきましてもこの種の事件が多発する\n傾向にあるということでございまして、やはり"}, {"t": 995.7333333333333, "x": "社会経済的な背景というものが大きく\n影響しているのではないかと思います」"}, {"t": 1000.15, "x": "これは警察庁の見立てだ。"}, {"t": 1001.8833333333333, "x": "ちなみに、同じ参考人質疑では、\nアメリカの例も引かれている。"}, {"t": 1005.8333333333334, "x": "一九八二年に鎮痛剤に毒物が\n入れられ、七人が亡くなった事件だ。"}, {"t": 1010.9, "x": "参考人はこう述べている。"}, {"t": 1012.5, "x": "「これは今もって解決を見ておりません」"}, {"t": 1014.7166666666667, "x": "「したがいまして、翌一九八三年にアメリカの議会は"}, {"t": 1018.1, "x": "刑法の一部を直して重罰規定の導入をするというような\n形をとっております」"}, {"t": 1023.1333333333333, "x": "向こうも、解けないまま法律だけ作ったのね。"}, {"t": 1026.0833333333333, "x": "同じことが起きている。"}, {"t": 1028.1333333333334, "x": "百十四号の捜査は、長く続いた。"}, {"t": 1030.65, "x": "一九八八年四月二十日の答弁を読む。"}, {"t": 1038.9, "x": "滋賀及び警視庁を中心に全国警察を挙げて\n捜査を続行しておるところでございます」"}, {"t": 1044.0833333333333, "x": "「具体的に申し上げますと、"}, {"t": 1045.7166666666667, "x": "犯人が使用しましたタイプライターの捜査、\n無線機等遺留品の捜査等を\n重点として捜査中であります」"}, {"t": 1052.1666666666667, "x": "物は残っていたのね。"}, {"t": 1053.75, "x": "ああ。物はあった。"}, {"t": 1054.9666666666667, "x": "だが、同じ答弁でこう言っている。"}, {"t": 1057.0833333333333, "x": "「本事件につきましては、犯行現場周辺から有力な\n目撃情報が得られていないというようなこと」"}, {"t": 1062.9833333333333, "x": "「それから遺留品がございますけれども、\nこれらがすべて"}, {"t": 1065.8666666666666, "x": "大量生産大量販売されているものでありまして、\nその追跡捜査が極めて困難であるというようなことから"}, {"t": 1071.8, "x": "捜査が長期化いたしております」"}, {"t": 1073.9666666666667, "x": "目撃がない。物はあるが、どれも\n大量生産品で買った人を追えない。"}, {"t": 1078.2166666666667, "x": "これが、警察庁が一九八八年の時点で挙げた理由だ。"}, {"t": 1082.4, "x": "この答弁は、こう締めくくられている。"}, {"t": 1084.6333333333334, "x": "「しかし、本事件を\n風化させてはならないわけでございます」"}, {"t": 1088.1833333333334, "x": "風化。"}, {"t": 1088.9166666666667, "x": "ああ。一九八八年に、そう言っている。"}, {"t": 1092.0, "x": "そして、二〇二六年の答弁に戻る。"}, {"t": 1094.7666666666667, "x": "「平成十二年二月までにこれら一連の事件について\n公訴時効が完成したというものでございます」"}, {"t": 1100.4666666666667, "x": "平成十二年は二〇〇〇年。"}, {"t": 1102.1666666666667, "x": "一九八四年三月に始まった一連の事件は、二〇\n〇〇年二月までに、全部の時効が完成した。"}, {"t": 1108.9333333333334, "x": "十六年。"}, {"t": 1109.8833333333334, "x": "事件ごとに時効の起点は違うが、いちばん\n遅いものでその月だった、ということだ。"}, {"t": 1115.5166666666667, "x": "もう一件の未検挙が、百十六号だ。"}, {"t": 1118.1166666666666, "x": "この事件は、このチャンネルで扱うのは初めてになる。"}, {"t": 1121.35, "x": "二〇二六年五月八日の答弁を読む。"}, {"t": 1123.9833333333333, "x": "対象になったのは、五つの事件だ。"}, {"t": 1126.3833333333334, "x": "昭和六十二年一月、朝日新聞東京本社に\n対する散弾銃発砲事件。"}, {"t": 1131.4166666666667, "x": "同じ年の五月、朝日新聞阪神支局における\n散弾銃使用による同社記者殺傷事件。"}, {"t": 1137.1833333333334, "x": "同じ年の九月、朝日新聞名古屋本社の寮に\n対する散弾銃発砲事件。"}, {"t": 1142.0166666666667, "x": "昭和六十三年三月、朝日新聞静岡支局に\n対する爆破未遂事件。"}, {"t": 1146.9333333333334, "x": "同じ年の八月、\n東京都港区内の株式会社リクルート前会長宅に\n対する散弾銃発砲事件。"}, {"t": 1153.6166666666666, "x": "新聞社が四つと、個人の家が一つ。"}, {"t": 1156.35, "x": "ああ。"}, {"t": 1156.7833333333333, "x": "昭和六十二年は一九八七年、\n六十三年は一九八八年だ。"}, {"t": 1162.2333333333333, "x": "五月の阪神支局の事件では、記者一人が\n亡くなり、一人が重い傷を負った。"}, {"t": 1167.2333333333333, "x": "この動画では、お名前も、そのときの様子も出さない。"}, {"t": 1170.5166666666667, "x": "ご遺族が存命だからだ。"}, {"t": 1172.1, "x": "警察庁の答弁の続きを読む。"}, {"t": 1174.1833333333334, "x": "「これらいずれも赤報隊を名のる\n犯人による一連の事件と見て、"}, {"t": 1177.8166666666666, "x": "警察庁において警察庁指定第百十六号事件に\n指定して、関係都県警察において捜査を行いました」"}, {"t": 1184.85, "x": "赤報隊。"}, {"t": 1185.85, "x": "犯行声明にそう書かれていた、というのが\n記録に残っていることの全部だ。"}, {"t": 1190.25, "x": "それが誰なのかは、最後まで分かっていない。"}, {"t": 1192.85, "x": "この点は、あとでもう一度きちんと話す。"}, {"t": 1196.05, "x": "この事件の指定のされ方には、特徴がある。"}, {"t": 1198.9166666666667, "x": "二〇二三年二月二日、衆議院予算委員会。"}, {"t": 1202.25, "x": "警察庁の刑事局長が、平成十二年版の警察白書を\nそのまま読み上げている。"}, {"t": 1207.4166666666667, "x": "白書の文章だ。"}, {"t": 1208.6666666666667, "x": "「昭和六十二年一月、朝日新聞東京本社に\n対する散弾銃発砲事件が発生したのを始め」"}, {"t": 1214.95, "x": "「五月に朝日新聞阪神支局において\n同社記者に対し散弾を発射して一人を殺害、"}, {"t": 1220.25, "x": "一人に重傷を負わせる殺傷事件が、\n九月には朝日新聞名古屋本社の寮に\nおける散弾銃発砲事件が発生した」"}, {"t": 1227.3333333333333, "x": "「これらはいずれも赤報隊を名のる犯人による\n一連の朝日新聞襲撃事件と見て、警察庁では、同月、"}, {"t": 1233.8, "x": "警察庁指定第百十六号事件に指定した」"}, {"t": 1237.0666666666666, "x": "三件目が起きた月に指定したのね。"}, {"t": 1239.55, "x": "ああ。指定は昭和六十二年、\n一九八七年の九月二十五日だ。"}, {"t": 1244.35, "x": "続きがある。"}, {"t": 1245.25, "x": "「その後、さらに、六十三年三月に\n朝日新聞静岡支局に対する爆破未遂事件が、八月には"}, {"t": 1251.8333333333333, "x": "東京都内のリクルート前会長宅に対する\n散弾銃発砲事件が発生したため、追加指定を行った」"}, {"t": 1258.0666666666666, "x": "あとから二件足された。"}, {"t": 1259.5166666666667, "x": "この白書には、最後にこう書いてある。"}, {"t": 1261.8833333333334, "x": "「平成十二年七月末現在、捜査中である」"}, {"t": 1265.1833333333334, "x": "捜査中。"}, {"t": 1266.1, "x": "ああ。二〇〇〇年の白書に、そう書いてある。"}, {"t": 1268.7166666666667, "x": "時効が完成するのは、その三年後だ。"}, {"t": 1271.3166666666666, "x": "白書は、最後まで\n「捜査中である」と書き続けていた。"}, {"t": 1275.0166666666667, "x": "事件が起きた直後の動きも記録に残っている。"}, {"t": 1277.95, "x": "一九八七年五月十四日、参議院法務委員会。"}, {"t": 1281.7166666666667, "x": "捜査第一課長の答弁だ。"}, {"t": 1283.6333333333334, "x": "「警察といたしましては当日直ちに\n百十名の態勢の捜査本部を設けまして」"}, {"t": 1288.55, "x": "「地取り捜査の徹底あるいは鑑定、鑑識資料に\n基づく捜査、それから動機面の捜査」"}, {"t": 1293.9833333333333, "x": "「五月の六日に至りまして、"}, {"t": 1295.6166666666666, "x": "日本民族独立義勇軍別動赤報隊なる"}, {"t": 1298.8333333333333, "x": "名義の挑戦状ともあるいは声明文とも\n受けとめられるような文書が\n一部報道機関に送達をされました」"}, {"t": 1304.4666666666667, "x": "「したがいまして、改めて捜査態勢を\n強化いたしまして、刑事、"}, {"t": 1308.3333333333333, "x": "警備部門両部門による合同捜査を\n進めているところであります」"}, {"t": 1312.75, "x": "この回でいちばん大事な答弁を紹介する。"}, {"t": 1315.3666666666666, "x": "一九八八年三月二十八日、参議院地方行政委員会。"}, {"t": 1320.0, "x": "警察庁の刑事局長が、なぜ捕まらないのかを\n聞かれて、四つ挙げている。"}, {"t": 1324.6666666666667, "x": "これは私の推測ではない。"}, {"t": 1326.3333333333333, "x": "警察庁が自分で挙げた理由だ。"}, {"t": 1328.45, "x": "読む。"}, {"t": 1328.9666666666667, "x": "「その理由といたしましては、強いて挙げてみますと」"}, {"t": 1331.9, "x": "一つ目。「犯行声明文なるものが出されている\nわけでございますけれども犯行の動機というものは"}, {"t": 1337.2833333333333, "x": "必ずしも明確でない」"}, {"t": 1338.8166666666666, "x": "二つ目。「犯人像、逃走手段等に関しまして\n有力な目撃情報が得られていない」"}, {"t": 1344.1833333333334, "x": "三つ目。ここが長い。"}, {"t": 1345.7166666666667, "x": "「静岡支局で発見されました\n爆発物関係の紙袋とか時計とか乾電池、"}, {"t": 1350.6333333333334, "x": "ピース缶等遺留品を初めといたしまして」"}, {"t": 1353.3, "x": "「犯行に使用したと認められます散弾銃や実包、\n犯行声明文作成に使用したと認められますワープロ等」"}, {"t": 1359.9833333333333, "x": "「物は相当たくさんあるわけでございますが、\nいずれも大量生産品、"}, {"t": 1363.8166666666666, "x": "大量流通品ということから\n購入者の割り出しというものが難航しておる」"}, {"t": 1368.2166666666667, "x": "また、大量生産品。"}, {"t": 1369.9333333333334, "x": "気づいたか。"}, {"t": 1370.7833333333333, "x": "百十四号でも、まったく同じ言い方をしていた。"}, {"t": 1373.8333333333333, "x": "「遺留品がございますけれども、これらがすべて"}, {"t": 1376.2833333333333, "x": "大量生産大量販売されているものでありまして、\nその追跡捜査が極めて困難」"}, {"t": 1381.4, "x": "別の事件、別の年、別の刑事局長。\nそれなのに、同じ言葉だ。"}, {"t": 1386.1, "x": "四つ目。「犯行声明文において\n自称しております赤報隊なるものが、"}, {"t": 1390.2833333333333, "x": "既存の団体の中からはその名称は出てこない」"}, {"t": 1393.2666666666667, "x": "「その実態解明に苦労している」"}, {"t": 1395.4333333333334, "x": "名前しか分からないのね。"}, {"t": 1397.1166666666666, "x": "そういうことだ。"}, {"t": 1398.1333333333334, "x": "一九八七年十一月十三日の答弁でも、こう述べている。"}, {"t": 1402.6166666666666, "x": "「これまでの全国捜査にも\nかかわらず、その組織の存在等、"}, {"t": 1406.2333333333333, "x": "実態につきましてはいまだ把握するに至っておらない」"}, {"t": 1409.4333333333334, "x": "全国の警察を挙げて捜査して、名乗った\n名前の実体すらつかめなかった。"}, {"t": 1414.6833333333334, "x": "ここは、この回でいちばん慎重に\n扱わないといけないところだ。"}, {"t": 1418.4166666666667, "x": "この事件については、当時から\nいろいろな見方が語られてきた。"}, {"t": 1422.1333333333334, "x": "だが、警察庁は最後まで犯人像を断定していない。"}, {"t": 1425.5, "x": "一九八八年三月二十八日、参議院法務委員会。"}, {"t": 1429.6333333333334, "x": "捜査第一課長の答弁だ。"}, {"t": 1431.5666666666666, "x": "読む。"}, {"t": 1432.1, "x": "「犯行声明文に右翼の言動らしきものは\n確かにございます」"}, {"t": 1435.7666666666667, "x": "「また、赤報隊が右翼団体と関連するものか"}, {"t": 1438.85, "x": "どうか、あるいは右翼の外周に存在するものか"}, {"t": 1441.5166666666667, "x": "どうか、これにつきましては\n鋭意捜査をいたしておりますが」"}, {"t": 1444.6, "x": "「現在のところ各種既存の団体から\n赤報隊というのが出てきておりませんし、"}, {"t": 1449.0833333333333, "x": "赤報隊の解明になお努めておるところでございまして」"}, {"t": 1452.5, "x": "「右翼であるか\nどうか、あるいはその外周のものであるか\nどうか断定するには至っておりません」"}, {"t": 1457.5666666666666, "x": "警察が、断定していないと言っている。"}, {"t": 1460.1166666666666, "x": "ああ。"}, {"t": 1460.55, "x": "捜査していた当の警察庁が、国会でそう答えている。"}, {"t": 1464.0, "x": "だから私も、この動画で犯人像に\n踏み込むことはしない。"}, {"t": 1467.55, "x": "警察が三十年以上かけて断定できなかったものを、\n私が動画で断定していいはずがない。"}, {"t": 1473.1666666666667, "x": "それはそうね。"}, {"t": 1474.2333333333333, "x": "もう一つ、注意しておきたいことがある。"}, {"t": 1476.6333333333334, "x": "この事件の前にも、同じ名前を名乗った事件があった。"}, {"t": 1480.0166666666667, "x": "一九八七年五月十五日、\n衆議院法務委員会の説明員の答弁だ。"}, {"t": 1485.2166666666667, "x": "「日本民族独立義勇軍名下で犯したと思われる事案、"}, {"t": 1488.5166666666667, "x": "私ども承知いたしておりますところでは、五十六年に\n一件、五十七年に一件、五十八年に三件、"}, {"t": 1494.9166666666667, "x": "合計五件の事実を確認いたしております」"}, {"t": 1497.8, "x": "五件も前にあったの？"}, {"t": 1499.3333333333333, "x": "ただし、警察はこの点にも但し書きを付けている。"}, {"t": 1502.4833333333333, "x": "同じころの答弁だ。"}, {"t": 1503.8833333333334, "x": "「なるほど日本民族独立義勇軍なる名前を\n犯行声明等で名のってはおりますけれども、果たして"}, {"t": 1509.3666666666666, "x": "その日本民族独立義勇軍なるものがやったのかどうか」"}, {"t": 1512.9333333333334, "x": "「今は悪乗りの時代でございますので、"}, {"t": 1514.95, "x": "一つの事案があるとあたかもおれがやったというような"}, {"t": 1518.0833333333333, "x": "声明みたいなものが随分出てくるわけでございます」"}, {"t": 1520.6, "x": "「果たしてそれを名のったものが\nそれぞれの犯行をやったかどうかという\n証拠がなかなかつかめない」"}, {"t": 1525.6833333333334, "x": "名乗ったからといって、同じ相手とは限らない。"}, {"t": 1528.4833333333333, "x": "警察はそう言っている。"}, {"t": 1529.75, "x": "私もそこで止める。"}, {"t": 1531.8666666666666, "x": "百十六号の結末を読む。"}, {"t": 1533.8, "x": "二〇二六年五月八日の答弁だ。"}, {"t": 1536.2833333333333, "x": "「平成十五年三月までに\nこれら全ての事件についての公訴時効が\n完成したものと承知しております」"}, {"t": 1542.35, "x": "平成十五年は二〇〇三年。"}, {"t": 1544.35, "x": "一九八七年から、十六年。"}, {"t": 1547.2333333333333, "x": "ああ。百十四号とちょうど同じくらいだ。"}, {"t": 1549.6833333333334, "x": "ここで、時効の制度の話を少ししておく。"}, {"t": 1552.5166666666667, "x": "日本では二〇一〇年に、\n公訴時効の一部が廃止された。"}, {"t": 1556.0333333333333, "x": "二〇一〇年四月二十日の衆議院法務委員会で、\n議員がこう述べている。"}, {"t": 1560.2333333333333, "x": "「今回、公訴時効が廃止されたのは、人の命を\n奪った犯罪で、かつ死刑がある犯罪のみであります」"}, {"t": 1566.65, "x": "人が亡くなった事件だけ。"}, {"t": 1568.5333333333333, "x": "そうだ。"}, {"t": 1569.15, "x": "この二件は、その改正より前に時効が完成している。"}, {"t": 1572.5666666666666, "x": "百十四号が二〇〇〇年二月まで。"}, {"t": 1574.6166666666666, "x": "百十六号が二〇〇三年三月まで。"}, {"t": 1577.0666666666666, "x": "改正は二〇一〇年だ。"}, {"t": 1578.75, "x": "しかも、この改正の附則にはこう書いてある。"}, {"t": 1581.5, "x": "施行の際、既に公訴の時効が\n完成している罪については、適用しない。"}, {"t": 1586.25, "x": "さかのぼらないのね。"}, {"t": 1587.65, "x": "ああ。条文の上で、はっきり対象外になっている。"}, {"t": 1590.7666666666667, "x": "間に合わなかった、という言い方をしてもいい。"}, {"t": 1593.25, "x": "もっとも、時効が止まる場合もある。"}, {"t": 1595.4333333333334, "x": "二〇二六年五月八日、\n法務省の政府参考人がこう答えている。"}, {"t": 1599.8166666666666, "x": "「刑事訴訟法二百五十五条第一項におきましては、"}, {"t": 1602.8666666666666, "x": "犯人が国外にいる場合には、公訴時効は、\nその国外にいる期間その進行を\n停止することとされている」"}, {"t": 1609.2833333333333, "x": "外国にいると、止まるの？"}, {"t": 1611.15, "x": "制度としてはそうだ。"}, {"t": 1612.4666666666667, "x": "ただ、それは犯人が誰か分かっていて、その人が\n国外にいると確認できた場合の話になる。"}, {"t": 1618.3833333333334, "x": "この二件では、そもそも人にたどり着いていない。"}, {"t": 1621.9333333333334, "x": "ここで、二件を並べてみる。"}, {"t": 1623.7833333333333, "x": "片方は、食品会社への恐喝と、店の棚への毒物。"}, {"t": 1627.7666666666667, "x": "もう片方は、報道機関への銃撃と爆発物。"}, {"t": 1631.0666666666666, "x": "狙われた相手も、やり方も、まったく違う。"}, {"t": 1634.0666666666666, "x": "似ていないわね。"}, {"t": 1635.2, "x": "ああ。それなのに、警察庁の説明はほとんど同じだ。"}, {"t": 1638.6333333333334, "x": "一つ目。どちらも、複数の地方ブロックにまたがった。"}, {"t": 1642.2, "x": "百十四号は関東、中部、関西。"}, {"t": 1644.75, "x": "百十六号は東京、兵庫、愛知、静岡。"}, {"t": 1647.8833333333334, "x": "どちらも、一つの県警では追えない。"}, {"t": 1650.2166666666667, "x": "二つ目。どちらも、有力な目撃情報が得られなかった。"}, {"t": 1654.0, "x": "百十四号は「犯行現場周辺から\n有力な目撃情報が得られていない」。"}, {"t": 1658.6333333333334, "x": "百十六号は「犯人像、逃走手段等に関しまして\n有力な目撃情報が得られていない」。"}, {"t": 1664.5, "x": "同じ言葉ね。"}, {"t": 1665.6833333333334, "x": "三つ目。ここが私はいちばん重いと思う。"}, {"t": 1668.3333333333333, "x": "どちらも、物証はあった。"}, {"t": 1670.0333333333333, "x": "百十四号にはタイプライターと無線機。"}, {"t": 1672.4666666666667, "x": "百十六号には散弾銃と実包、\nワープロ、時計、乾電池、紙袋。"}, {"t": 1677.2666666666667, "x": "物は、たくさんあった。"}, {"t": 1678.9, "x": "でも、追えなかった。"}, {"t": 1680.3666666666666, "x": "どちらの答弁にも同じ言葉が出てくる。"}, {"t": 1682.8, "x": "「大量生産品、大量流通品」。"}, {"t": 1685.0166666666667, "x": "どこの店でも売っている物だから、\n買った人にたどり着けない。"}, {"t": 1688.65, "x": "私はここに、この二件が解けなかった\n構造があると思っている。"}, {"t": 1692.4666666666667, "x": "犯人が特別に賢かった、という話ではない。"}, {"t": 1695.6666666666667, "x": "どこにでもある物を使えば、\n当時の捜査では追えなかった。"}, {"t": 1699.0666666666666, "x": "それだけのことだ。"}, {"t": 1700.3, "x": "四つ目。どちらも、動機がはっきりしなかった。"}, {"t": 1703.3166666666666, "x": "百十六号の答弁では「犯行の動機というものは\n必ずしも明確でない」。"}, {"t": 1707.8666666666666, "x": "動機が分からなければ、誰を\n調べればいいのかも決まらない。"}, {"t": 1711.8666666666666, "x": "ここまで、解けなかった二件を見てきた。"}, {"t": 1714.3166666666666, "x": "公平のために、解けた側も見ておく。"}, {"t": 1716.7, "x": "まず、百十三号だ。"}, {"t": 1718.3166666666666, "x": "一九八三年三月三十日、参議院地方行政委員会。"}, {"t": 1722.6333333333334, "x": "刑事局長の答弁を読む。"}, {"t": 1724.45, "x": "一九八二年十月二十七日の夜、\n名古屋市内の派出所の警察官が\n襲われ、拳銃を奪われた。"}, {"t": 1731.4, "x": "十月三十一日、\n静岡県浜松市のスーパーマーケットで強盗未遂。"}, {"t": 1735.9833333333333, "x": "翌十一月一日、\n岐阜県養老町の名神高速道路のサービスエリアで、\n千葉県の工員が撃たれて亡くなった。"}, {"t": 1742.85, "x": "十一月二十八日、\n京都市山科区のスーパーマーケットで強盗。"}, {"t": 1747.1666666666667, "x": "愛知、静岡、岐阜、京都。"}, {"t": 1749.4666666666667, "x": "四つの県にまたがっている。"}, {"t": 1751.1666666666667, "x": "これを一連の事件と見て、百十三号に指定した。"}, {"t": 1754.5, "x": "そして翌年一月三十一日、名古屋市の銀行の支店で\n起きた強盗傷害事件で、犯人が捕まった。"}, {"t": 1761.1833333333334, "x": "答弁の言葉を読む。"}, {"t": 1762.55, "x": "「この事件で民間の方の御協力に\nよりまして現行犯逮捕されました」"}, {"t": 1767.0166666666667, "x": "一般の人の協力。"}, {"t": 1768.6666666666667, "x": "ああ。"}, {"t": 1769.1, "x": "全国の警察を挙げた捜査ではなく、\n現場に居合わせた人の手で終わった。"}, {"t": 1773.45, "x": "この事件も、関連づけるのは\n難しかったと答弁している。"}, {"t": 1777.1, "x": "「犯行の手口が非常に\n一つ一つの事件で異なっておる」"}, {"t": 1780.7, "x": "「指紋その他の物的な証拠を\nほとんどが残していない」"}, {"t": 1783.9666666666667, "x": "「車を利用しまして非常に\n広範囲にわたって犯行を犯す」"}, {"t": 1787.4666666666667, "x": "もう一つ、百十七号だ。"}, {"t": 1789.4333333333334, "x": "一九九〇年三月二十九日の答弁を読む。"}, {"t": 1792.75, "x": "「昨年、埼玉、警視庁の管内に\nおいて発生いたしました\n連続幼女誘拐殺人事件がございましたが」"}, {"t": 1799.25, "x": "「最終段階ではございますが一連の事件が同一"}, {"t": 1801.9666666666667, "x": "犯人のものであるということが明らかになりまして\n捜査活動が競合してまいりましたので、"}, {"t": 1807.05, "x": "警察庁指定第百十七号事件という\n指定を行いまして調整を図った」"}, {"t": 1811.7666666666667, "x": "指定は平成元年九月一日。"}, {"t": 1813.8333333333333, "x": "犯人が捕まったのは、その三週間ほど前だ。"}, {"t": 1817.1666666666667, "x": "捕まったあとに指定したの？"}, {"t": 1819.0666666666666, "x": "ああ。一連の事件が同じ犯人のものだと分かって、\n県をまたいだ捜査を整理するために付いた番号だ。"}, {"t": 1825.1833333333334, "x": "ここが百十四号・百十六号との違いだ。"}, {"t": 1828.1666666666667, "x": "番号を付けたから解けたわけではない。"}, {"t": 1830.3333333333333, "x": "解けたあとに、後始末として番号が付いた回もある。"}, {"t": 1834.2166666666667, "x": "時効が完成したら、その事件はどうなるのか。"}, {"t": 1837.1333333333334, "x": "二〇二六年五月八日の答弁を読む。"}, {"t": 1839.7833333333333, "x": "「一般論として申し上げますが、"}, {"t": 1841.6333333333334, "x": "時効が完成した事案につきましては、一般的には\n捜査は終結するというふうに理解しております」"}, {"t": 1847.7333333333333, "x": "終わってしまうの？"}, {"t": 1848.9333333333334, "x": "ああ。捜査は終結する。"}, {"t": 1850.65, "x": "私は、この一言がこの回で\nいちばん重い事実だと思っている。"}, {"t": 1854.6333333333334, "x": "追いかけていた人たちが、追いかけるのをやめる。"}, {"t": 1857.3833333333334, "x": "やめさせられるのではなく、制度としてそこで終わる。"}, {"t": 1860.3666666666666, "x": "ただ、同じ答弁には続きがある。"}, {"t": 1862.5833333333333, "x": "情報提供については、こう述べている。"}, {"t": 1864.9666666666667, "x": "「一般的に、事件に関する情報というものは、"}, {"t": 1867.8166666666666, "x": "一般の方からの情報提供を含めまして、警察業務の\nあらゆる場面で入手することがございます」"}, {"t": 1873.75, "x": "「最終的には、当該事件を捜査している\n都道府県警察の担当に集約される」"}, {"t": 1878.95, "x": "受け付けてはいるのね。"}, {"t": 1880.4333333333334, "x": "情報が入る道は閉じていない。"}, {"t": 1882.3666666666666, "x": "もう一つ、指紋の話がある。"}, {"t": 1884.45, "x": "「一般論として申し上げますが、遺留指紋、つまり、"}, {"t": 1887.5166666666667, "x": "犯人が犯罪現場等に遺留したと\n認められる指紋につきましては」"}, {"t": 1891.6, "x": "「この記録をデータベースに登録いたしまして、"}, {"t": 1894.0666666666666, "x": "将来的な犯人の割り出し等に備えて\n保管をしているところでございます」"}, {"t": 1898.6166666666666, "x": "残っているの？"}, {"t": 1899.7333333333333, "x": "一般論としては、そう答えている。"}, {"t": 1910.0833333333333, "x": "だから、この二件について残っているとも\n消えたとも、私は言えない。"}, {"t": 1914.2, "x": "技術のほうは上がっている。"}, {"t": 1915.75, "x": "同じ答弁で、指紋を\n見つけるための機械が説明されている。"}, {"t": 1919.5, "x": "一つはグリーンレーザー。"}, {"t": 1920.8833333333334, "x": "指紋の中のアミノ酸やたんぱく質が緑色の光で\n黄色く光る性質を使って、指紋を見つける。"}, {"t": 1927.1, "x": "平成二十五年、二〇一三年度に、\n全国の都道府県警察に配られた。"}, {"t": 1932.0166666666667, "x": "予算は全体で二億七千万円。"}, {"t": 1934.2166666666667, "x": "もう一つはハイパースペクトルイメージャー。"}, {"t": 1936.4666666666667, "x": "これまで検出できなかった物からも\n指紋を取れる可能性がある機械だ。"}, {"t": 1940.6333333333334, "x": "重なり合った指紋を分けて取れる\n場合もある、と説明されている。"}, {"t": 1944.3333333333333, "x": "令和元年度、二〇一九年度に\n警察庁に入った。予算は一千万円。"}, {"t": 1949.25, "x": "昔取れなかったものが、取れるようになるのね。"}, {"t": 1952.15, "x": "答弁ではこう言っている。"}, {"t": 1953.6, "x": "「その後の十年以上にわたって、"}, {"t": 1955.35, "x": "実際の事件捜査でも指紋を検出し、\n被疑者を特定するなど、効果を上げている」"}, {"t": 1960.5, "x": "ただし、これは時効が完成していない事件の話だ。"}, {"t": 1964.4, "x": "ここからは私の見方だ。"}, {"t": 1965.9666666666667, "x": "事実と分けて聞いてほしい。"}, {"t": 1967.7, "x": "三つある。"}, {"t": 1968.4666666666667, "x": "一つ目。この制度は、何を足りなくしていたのか。"}, {"t": 1971.6666666666667, "x": "警察庁が挙げた理由を並べると、目撃がない、\n物は追えない、動機が分からない、の三つだった。"}, {"t": 1977.6833333333334, "x": "どれも、番号を付けて全国を\n動かせば解決する話ではない。"}, {"t": 1981.6, "x": "番号が足したのは「人手」と「情報の集約」だ。"}, {"t": 1985.1833333333334, "x": "だが、足りなかったのは人手ではなかった。"}, {"t": 1987.8666666666666, "x": "人を増やしても、追えないものは追えない。"}, {"t": 1990.3, "x": "私はそう読んだ。"}, {"t": 1991.5166666666667, "x": "この二件で足りなかったのは、当時の技術だ。"}, {"t": 1994.3333333333333, "x": "大量生産品を追う手段が無かった。"}, {"t": 1996.6666666666667, "x": "二つ目。検証はされたのか、ということだ。"}, {"t": 1999.5333333333333, "x": "二〇一七年五月十六日、衆議院法務委員会。"}, {"t": 2002.9833333333333, "x": "ある大学教授が参考人として呼ばれ、こう述べている。"}, {"t": 2006.2833333333333, "x": "これは参考人の意見であって、政府の見解ではない。"}, {"t": 2009.55, "x": "「どうしてそうしたテロ行為、"}, {"t": 2010.9333333333334, "x": "テロ犯罪を防ぐことができなかったのか、そういった\n国を挙げての御議論あるいは研究調査というものを私は"}, {"t": 2017.3166666666666, "x": "目にしたことがございません」"}, {"t": 2018.6, "x": "「なぜ赤報隊と言われる人たちを\n逮捕できなかったのか、そういった\n反省なしにこうしたテロを防ぐための"}, {"t": 2024.05, "x": "法案を用意するということは、私は\n合理性を欠いていると思います」"}, {"t": 2028.4166666666667, "x": "検証していない、ということ？"}, {"t": 2030.3833333333334, "x": "この参考人は、そう述べている。"}, {"t": 2032.4666666666667, "x": "そして、外国の例を挙げている。"}, {"t": 2034.55, "x": "「二〇一五年十一月にパリで悲劇的な\n同時多発テロがございました」"}, {"t": 2038.9166666666667, "x": "「次の年、二〇一六年二月には、フランス議会は、"}, {"t": 2042.3333333333333, "x": "どうしてそれを\n食いとめることができなかったのかについて\n検証を行い」"}, {"t": 2046.2833333333333, "x": "事件そのものは解けなくても、なぜ\n解けなかったかを調べることはできる。"}, {"t": 2050.516666666667, "x": "私は、この指摘は重いと思う。"}, {"t": 2052.733333333333, "x": "三つ目。番号のことだ。"}, {"t": 2054.5, "x": "二十四件のうち、国会の記録に\n号数が出てくるのは四件だけだった。"}, {"t": 2058.9, "x": "残りの二十件は、番号としては\n一度も語られていない。"}, {"t": 2062.516666666667, "x": "あることは分かるのに、中身は分からない。"}, {"t": 2065.05, "x": "番号を付けたのは国だ。"}, {"t": 2066.516666666667, "x": "付けた側は当然知っている。"}, {"t": 2068.3166666666666, "x": "だが、外から見ると、その一覧が簡単には出てこない。"}, {"t": 2071.9, "x": "制度が通達で動いていたことと、\n無関係ではないと私は思っている。"}, {"t": 2076.7833333333333, "x": "最後に、この回で\nいちばん置いておきたい言葉がある。"}, {"t": 2079.8, "x": "二〇二六年五月八日、衆議院法務委員会。"}, {"t": 2083.0333333333333, "x": "制度の説明を一通りしたあと、\n警察庁の審議官が、こう付け足している。"}, {"t": 2087.7833333333333, "x": "読む。"}, {"t": 2088.3166666666666, "x": "「若干情緒的なことになりますけれども、やはり、"}, {"t": 2091.25, "x": "都道府県警察、警察庁も含めて\n捜査に従事している者としましては」"}, {"t": 2095.983333333333, "x": "「やはり被害があった御家族などとも\n接することもありまして、"}, {"t": 2106.133333333333, "x": "情緒的なこと、って自分で言っているのね。"}, {"t": 2108.8166666666666, "x": "ああ。"}, {"t": 2109.25, "x": "役所の答弁というのは、普通、感情を出さない。"}, {"t": 2112.3333333333335, "x": "その人が、わざわざ断ってから言っている。"}, {"t": 2115.0666666666666, "x": "制度の話をずっとしてきたが、\n動かしていたのは人だった。"}, {"t": 2118.7833333333333, "x": "二十四件のうち、二十二件は捕まえた。"}, {"t": 2121.516666666667, "x": "二件は、届かなかった。"}, {"t": 2123.2166666666667, "x": "一九八八年の答弁には、こう書いてあった。"}, {"t": 2126.633333333333, "x": "「本事件を風化させてはならないわけでございます」"}, {"t": 2129.483333333333, "x": "その事件は、その十二年後に時効になった。"}, {"t": 2132.483333333333, "x": "風化させてはならない、と言った事件が。"}, {"t": 2135.0333333333333, "x": "ああ。"}, {"t": 2135.4666666666667, "x": "私がこのチャンネルで何度も\n言っていることを、最後にもう一度言う。"}, {"t": 2139.25, "x": "記録は残る。"}, {"t": 2140.25, "x": "今回話したことは、全部、\n国会会議録検索システムで読める。"}, {"t": 2144.633333333333, "x": "一九八三年に警察庁が\n百十三号の経過を説明したことも。"}, {"t": 2149.45, "x": "一九八八年に、なぜ\n捕まらないのかを四つ挙げたことも。"}, {"t": 2153.6833333333334, "x": "右翼であるかどうか断定するには\n至っていない、と述べたことも。"}, {"t": 2157.3, "x": "そして、二〇二六年に「二十四事件が\n指定され、未検挙は二事件」と答えたことも。"}, {"t": 2163.15, "x": "全部、そのまま残っている。"}, {"t": 2164.983333333333, "x": "どなたでも無料で読める。今すぐ読める。"}, {"t": 2167.4333333333334, "x": "事件の解説動画は、たくさんある。"}, {"t": 2169.6, "x": "私が作っているものも、その一つだ。"}, {"t": 2172.3166666666666, "x": "だが、動画で見た話が本当か\nどうかを、自分で確かめる手段がある。"}, {"t": 2176.7, "x": "よかったら、一度自分で開いてみてほしい。"}, {"t": 2179.3166666666666, "x": "この回について、あなたはどう考えるか。"}, {"t": 2181.7, "x": "コメントで聞かせてほしい。"}, {"t": 2183.3, "x": "最後まで見てくれて、ありがとう。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
