<script>
const D={"name": "142", "file": "142_編集用", "dur": 2197.66665625, "segs": [], "subs": [{"t": 0.0, "x": "力道山が刺された。1963年12月8日、日曜の夜だ。"}, {"t": 4.916666666666667, "x": "時刻は午後10時30分、場所は東京のナイトクラブ。"}, {"t": 8.333333333333334, "x": "若い男の1本のナイフが腹に入った。"}, {"t": 11.05, "x": "力道山って、あの空手チョップの？"}, {"t": 13.45, "x": "そうだ。テレビの前の日本中が知っている名前だった。"}, {"t": 16.65, "x": "翌朝の新聞に出た傷の長さは4センチ。"}, {"t": 19.433333333333334, "x": "見立ては全治2週間だった。"}, {"t": 21.433333333333334, "x": "2週間なら、年内に治る傷よね？"}, {"t": 24.0, "x": "ところが7日後の夜、力道山は亡くなる。"}, {"t": 26.783333333333335, "x": "39歳だった。"}, {"t": 28.3, "x": "7日で？　どうしてそんなことに？"}, {"t": 30.433333333333334, "x": "2度目の手術で何があったのか。"}, {"t": 32.483333333333334, "x": "説は出たがはっきりしないまま話だけが残った。"}, {"t": 35.516666666666666, "x": "分かっていないことがいまも多いんだ。"}, {"t": 37.516666666666666, "x": "それから2か月あと、この件は国会で取り上げられる。"}, {"t": 40.75, "x": "警察庁の刑事局長は原因をこう答えた。"}, {"t": 43.583333333333336, "x": "「単純なけんか」。"}, {"t": 44.85, "x": "日本一の有名人が亡くなってそれだけ？"}, {"t": 47.5, "x": "答弁の言葉はそれだけだった。"}, {"t": 49.43333333333333, "x": "でも同じ冬、国の動きは大きく変わっていく。"}, {"t": 52.31666666666667, "x": "今回は、1本の登山ナイフのあとの記録を追う。"}, {"t": 55.31666666666667, "x": "主役は刺された瞬間ではなく、そのあとの7日間だ。"}, {"t": 58.766666666666666, "x": "そしてその外側で動いた、同じ冬の話になる。"}, {"t": 64.3, "x": "まず、どれくらいの有名人だったかを見ておこう。"}, {"t": 67.06666666666666, "x": "試合の話はしない。使うのは国会の記録だ。"}, {"t": 70.21666666666667, "x": "国会にプロレスラーの記録があるの？"}, {"t": 72.51666666666667, "x": "あるんだ。「力道山」で検索すると全部で55発言。"}, {"t": 76.13333333333334, "x": "その多くは事件の話ではなく、たとえ話だった。"}, {"t": 79.35, "x": "1954年2月、大蔵委員会である議員が局長に言う。"}, {"t": 83.43333333333334, "x": "本会議で「力道山のごときスマッシ」を与える、と。"}, {"t": 87.05, "x": "税金の話でそんなこと言うの？"}, {"t": 89.21666666666667, "x": "言ったんだ。繊維の税の話の途中だった。"}, {"t": 91.98333333333333, "x": "1956年2月には労働大臣が委員会で自分をたとえた。"}, {"t": 96.23333333333333, "x": "労働大臣はプロレスのレフェリーみたいなものだと。"}, {"t": 99.05, "x": "相手が反則をすれば、力道山も\n空手チョップと出てくる。"}, {"t": 102.73333333333333, "x": "大臣までプロレスでたとえるのね。"}, {"t": 104.88333333333334, "x": "1959年2月の外務委員会では、日米の力の差の話だ。"}, {"t": 109.68333333333334, "x": "ある議員は「力道山と小学校の生徒」と言った。"}, {"t": 112.96666666666667, "x": "説明なしで通じる強さの物差しだったわけだ。"}, {"t": 116.08333333333333, "x": "名前だけで話が伝わるってことね。"}, {"t": 118.55, "x": "1958年12月には入場税の質問にも出てくる。"}, {"t": 122.56666666666666, "x": "「力道山のたとえばあのプロ・\nレスリング」は何％の税か。"}, {"t": 126.48333333333333, "x": "金を動かす興行としても国に数えられていた。"}, {"t": 129.45, "x": "1953年に日本プロレスを興した男は、\n10年で国会の比喩になっていた。"}, {"t": 135.45, "x": "現場の店の名はニューラテンクォーター。"}, {"t": 137.56666666666666, "x": "1959年12月14日に開いた、大きなナイトクラブだ。"}, {"t": 142.01666666666668, "x": "場所はホテルニュージャパンの地下にあった。"}, {"t": 144.33333333333334, "x": "そのホテル、火事の名前で聞いたことがある。"}, {"t": 147.01666666666668, "x": "1982年2月の火災で33人が亡くなったホテルだ。"}, {"t": 151.5, "x": "ニュースでは赤坂の事件って聞くけど？"}, {"t": 153.9, "x": "呼び名は赤坂だが、住所は千代田区永田町だった。"}, {"t": 157.16666666666666, "x": "通りの向こうが赤坂だから、そう呼ばれたらしい。"}, {"t": 160.15, "x": "永田町なら、国会のすぐそばじゃない。"}, {"t": 162.73333333333332, "x": "そうなる。事件の夜は、ちょうど国会の会期中だった。"}, {"t": 166.21666666666667, "x": "力道山はこの夜の店の客の1人だった。"}, {"t": 169.03333333333333, "x": "結婚して半年で妻は22歳だった。"}, {"t": 171.75, "x": "その妻は翌朝の新聞で事件を知ったと語っている。"}, {"t": 175.11666666666667, "x": "奥さんは新聞で知ったの？"}, {"t": 176.91666666666666, "x": "本の著者の取材にそう話した。"}, {"t": 178.98333333333332, "x": "夜の出来事はそれほど急だったということだ。"}, {"t": 181.66666666666666, "x": "この回でいちばん固い記録は1つの答弁に残っている。"}, {"t": 185.08333333333334, "x": "店の中の細かい話はその多くが後の本や記事だ。"}, {"t": 188.46666666666667, "x": "だからここから先は分けて話す。"}, {"t": 190.58333333333334, "x": "答弁に書いてあること。"}, {"t": 192.05, "x": "そして、伝えられていることだ。"}, {"t": 194.65, "x": "答弁が言うのはこれだけだ。"}, {"t": 196.31666666666666, "x": "「遊興中の力道山とけんかをして」。"}, {"t": 198.6, "x": "「登山ナイフで腹部を刺して逃走をし」。"}, {"t": 200.95, "x": "けんかの中身は言ってないの？"}, {"t": 202.8, "x": "言っていない。中身は後の本が伝えている。"}, {"t": 205.45, "x": "伝えられている話では、きっかけは足だった。"}, {"t": 208.3, "x": "店の中で足を踏んだ踏まないの言い合いになった。"}, {"t": 211.05, "x": "相手は当時24歳の組員、村田勝志。"}, {"t": 213.95, "x": "答弁は「住吉一家の村田」と呼んでいる。"}, {"t": 216.8, "x": "場所は店の手洗いだったという記事もある。"}, {"t": 219.2, "x": "先に手を出したのは力道山のほうだと伝えられる。"}, {"t": 222.23333333333332, "x": "殴られた男が持っていたナイフを出した。"}, {"t": 224.78333333333333, "x": "どうしてナイフなんか持っていたの？"}, {"t": 226.83333333333334, "x": "のちの取材で身を守るために\n持っていたと語ったという。"}, {"t": 229.96666666666667, "x": "これは本人から聞いた作家の話を\n週刊誌が引いたものだ。"}, {"t": 233.56666666666666, "x": "傷は左の下腹。刺されたのは1回とされる。"}, {"t": 236.8, "x": "プロレスラーの体でも、刃物はだめなのね。"}, {"t": 239.66666666666666, "x": "1971年の委員会である議員はこの事件を例に引いた。"}, {"t": 243.65, "x": "蹴られても殴られても平気な力道山さえ、\n腹を突かれて亡くなった、と。"}, {"t": 248.06666666666666, "x": "では、そのナイフはどんな物だったのか。"}, {"t": 250.46666666666667, "x": "当時の日本で持ち歩いてよい物だったのか。"}, {"t": 253.08333333333334, "x": "ここは国会の記録がはっきり残っている。"}, {"t": 256.25, "x": "時計を3年戻す。\n1960年12月15日の参議院法務委員会だ。"}, {"t": 261.46666666666664, "x": "ある議員が警察にこう聞いた。"}, {"t": 263.31666666666666, "x": "「刃渡り十三センチも\n十四センチもあるような登山ナイフ」。"}, {"t": 266.6333333333333, "x": "こういう物はどう扱っているのか。"}, {"t": 268.76666666666665, "x": "登山ナイフってそんなに長いの？"}, {"t": 270.81666666666666, "x": "議員の言い方ではそうだ。"}, {"t": 272.18333333333334, "x": "保安局長の答えはこうだった。"}, {"t": 274.26666666666665, "x": "家に置いておくこと自体は禁止の対象ではない。"}, {"t": 277.01666666666665, "x": "ただ、理由なく持ち歩けば話が別になる。"}, {"t": 279.98333333333335, "x": "買うのはよくて外に持ち出すのがだめってこと？"}, {"t": 282.8333333333333, "x": "そうなる。がんじょうな革の鞘つきの物は、\nあいくちに似た刃物として取り締まった。"}, {"t": 287.68333333333334, "x": "ところが紙袋ていどの覆いなら、解釈に疑いが残る。"}, {"t": 291.25, "x": "局長自身がそう認めている。"}, {"t": 293.3, "x": "袋の種類で変わるの？"}, {"t": 294.95, "x": "当時の説明ではそうだった。"}, {"t": 296.76666666666665, "x": "半年後の1961年5月30日、衆議院でも同じ話が出た。"}, {"t": 301.85, "x": "局長は登山ナイフは政令に入らないと答えた。"}, {"t": 304.81666666666666, "x": "ボーイスカウトが山へ行くなら、\n持ち歩いてかまわない。"}, {"t": 307.85, "x": "ある議員は心配した。"}, {"t": 309.1333333333333, "x": "店で買って帰る途中で呼び止められないか。"}, {"t": 311.76666666666665, "x": "「お前はそんな洋服を着ていて\n登山に行くということではない」。"}, {"t": 315.15, "x": "なんだか、ありそうな場面ね。"}, {"t": 317.1, "x": "つまり1963年の時点で形はこうだった。"}, {"t": 320.5833333333333, "x": "売ることは止めていない。"}, {"t": 321.8, "x": "家にあってもよい。"}, {"t": 322.95, "x": "正当な理由なく持ち歩くことだけが問題になる。"}, {"t": 325.95, "x": "ナイトクラブに山の用事はない。"}, {"t": 327.9166666666667, "x": "じゃあ、持っていること自体が違反じゃない？"}, {"t": 330.3833333333333, "x": "持ち歩きの理由が無ければ、そうなりうる話だ。"}, {"t": 333.3333333333333, "x": "ただ、あの夜の刃の長さは、\n当たれた記録には載っていない。"}, {"t": 336.9, "x": "ここは断定しないでおく。"}, {"t": 339.0833333333333, "x": "話を12月8日の夜に戻す。"}, {"t": 341.3333333333333, "x": "答弁には続きの出来事が書かれている。"}, {"t": 343.78333333333336, "x": "店の事件から2時間ほどあとの、午前0時40分。"}, {"t": 347.2, "x": "場所はリキアパートの前の路上だ。"}, {"t": 349.31666666666666, "x": "リキって力道山の？"}, {"t": 350.85, "x": "そうだ。力道山の名がついた建物だ。"}, {"t": 353.46666666666664, "x": "ここで今度は逃げた男のほうが襲われた。"}, {"t": 356.0, "x": "答弁の言葉では、東声会の幹部ら4、5人。"}, {"t": 358.8833333333333, "x": "「なぐったり、登山ナイフで切りつけたり」した。"}, {"t": 361.8, "x": "えっ、また登山ナイフ？"}, {"t": 363.46666666666664, "x": "答弁にはそう書いてある。"}, {"t": 364.81666666666666, "x": "同じ夜に2本目だ。"}, {"t": 366.31666666666666, "x": "刃物の傷で病院へ行ったのは\n力道山だけではなかった。"}, {"t": 369.8, "x": "どうして刺した人がそこにいたの？"}, {"t": 371.96666666666664, "x": "答弁はそこを語っていない。"}, {"t": 373.68333333333334, "x": "謝りに行ったという話がのちに週刊誌に載った。"}, {"t": 376.71666666666664, "x": "確かめる材料は当たれた記録の中には無い。"}, {"t": 379.3666666666667, "x": "警察はこのあと計6人を逮捕した。"}, {"t": 381.81666666666666, "x": "住吉側が2人、東声会側が4人という内わけだ。"}, {"t": 385.28333333333336, "x": "1晩のうちに2つの組の名前が並んだことになる。"}, {"t": 388.65, "x": "けんかから、組どうしの話になってきたわけね。"}, {"t": 391.76666666666665, "x": "そこが、ただのけんかで済まない所だ。"}, {"t": 394.25, "x": "有名人のけんかが2時間で報復になる。"}, {"t": 397.46666666666664, "x": "ここから先は病院の7日間だ。"}, {"t": 399.6666666666667, "x": "はじめに言っておく。"}, {"t": 400.7, "x": "公の記録はほとんど無い。"}, {"t": 402.5, "x": "頼れるのは当時の新聞を引いた本と遺族の著書だ。"}, {"t": 405.75, "x": "じゃあ、伝えられている話ってことね。"}, {"t": 408.2, "x": "そうだ。順に見ていこう。"}, {"t": 409.81666666666666, "x": "刺された力道山はまず山王病院で手当てを受けた。"}, {"t": 412.9, "x": "ここで本人が言い張ったと伝えられる。"}, {"t": 415.15, "x": "医師が止めるのを聞かず、家へ帰ると言った。"}, {"t": 417.81666666666666, "x": "刺されたのに帰るって言ったの？"}, {"t": 419.76666666666665, "x": "手術を受けることが世間に\n知られるのを嫌った、という話だ。"}, {"t": 423.5, "x": "妻があとでそう振り返っている。"}, {"t": 425.3333333333333, "x": "周りの人に説得されて病院へ戻ることになった。"}, {"t": 428.5, "x": "病院は産婦人科が専門で、外科の医師がいなかった。"}, {"t": 431.85, "x": "そこで聖路加病院の外科の医師が呼ばれたという。"}, {"t": 434.73333333333335, "x": "夜中に別の病院から医者を呼んだの？"}, {"t": 437.18333333333334, "x": "そう伝えられている。"}, {"t": 438.26666666666665, "x": "手術は9日の未明だった。"}, {"t": 440.28333333333336, "x": "腸に傷が見つかった。"}, {"t": 441.8, "x": "小腸の4か所が傷つき、十数針を縫ったとされる。"}, {"t": 445.1666666666667, "x": "12月9日の読売新聞の見立ては全治2週間。"}, {"t": 448.5833333333333, "x": "傷の長さは4センチと書かれた。"}, {"t": 450.85, "x": "4か所も傷があって2週間なの？"}, {"t": 453.15, "x": "新聞に出た数字はそこまでだった。"}, {"t": 455.31666666666666, "x": "手術のあと医師から妻に電話が入る。"}, {"t": 457.7, "x": "容態は良好という内容だったと伝えられる。"}, {"t": 461.0, "x": "ところが、数字はもう1つある。"}, {"t": 463.05, "x": "妻の著書に引かれた診断書の言葉だ。"}, {"t": 465.5833333333333, "x": "処置の欄には「小腸の創縫合」。"}, {"t": 467.8333333333333, "x": "予後の欄には「\n今後約一カ月余の静養を要する見込」。"}, {"t": 471.46666666666664, "x": "1か月余？　2週間じゃなかったの？"}, {"t": 473.9, "x": "発表の全治2週間とは書きぶりが合わない。"}, {"t": 476.5833333333333, "x": "2013年のある記事もここに触れている。"}, {"t": 479.1666666666667, "x": "病院が2週間と発表したことは\n今も謎だという書き方だ。"}, {"t": 483.1, "x": "どっちが本当だったの？"}, {"t": 484.75, "x": "全治という言葉と静養という\n言葉は中身が同じではない。"}, {"t": 488.15, "x": "だからここでも、どちらが誤りとは言えない。"}, {"t": 490.75, "x": "言えるのは外に出た数字が\n軽いほうだったということだ。"}, {"t": 493.85, "x": "院長の経過報告は「経過順調」だった。"}, {"t": 496.8, "x": "妻は院長から「もう心配ありません」と\n言われたと書く。"}, {"t": 500.21666666666664, "x": "それで自宅へ戻ったという。"}, {"t": 502.03333333333336, "x": "その時点では、誰も心配していなかったのね。"}, {"t": 505.1, "x": "少なくとも家族に届いた言葉はそうだった。"}, {"t": 507.8666666666667, "x": "病室での本人の様子にも、いくつか話が残る。"}, {"t": 511.23333333333335, "x": "医師に飲み食いを止められていた、という話がある。"}, {"t": 514.0666666666667, "x": "退院したらビールが飲みたい、と\n言ったという話もある。"}, {"t": 517.3, "x": "プロレスラーが食べられないのはつらそう。"}, {"t": 519.5666666666667, "x": "ただ、ここは話が大きくなりやすい所だ。"}, {"t": 522.3833333333333, "x": "あとで1つずつ見る。"}, {"t": 523.7333333333333, "x": "この時点で分かっているのは数字が2つあったこと。"}, {"t": 526.7, "x": "そして週の半ばまで、悪い知らせは出なかったことだ。"}, {"t": 530.6166666666667, "x": "病室の外では、国会が動いていた。"}, {"t": 533.1833333333333, "x": "12月11日の参議院本会議、事件から3日後だ。"}, {"t": 536.95, "x": "社会党のある議員が、池田内閣に\n物価の質問をしていた。"}, {"t": 540.8, "x": "その演説の中で、突然この名前が出る。"}, {"t": 543.6, "x": "「リングの王者力道山でも刺される世の中です」。"}, {"t": 546.4666666666667, "x": "物価の話で力道山？"}, {"t": 548.25, "x": "そうだ。「国民の意見に\nたてをついてはいけません」と続く。"}, {"t": 551.7666666666667, "x": "この議員も、新聞で読んだと言っている。"}, {"t": 554.1833333333333, "x": "まだ生きている時点の発言だ。"}, {"t": 556.25, "x": "亡くなるなんて思っていない言い方ね。"}, {"t": 558.5333333333333, "x": "全治2週間と報じられていたから、\nたとえ話にできたんだろう。"}, {"t": 562.3666666666667, "x": "比喩になっていた名前が、ここでも比喩に使われた。"}, {"t": 565.4666666666667, "x": "同じころ、別の動きがあった。"}, {"t": 567.5, "x": "関東の7つの団体が、\n政党の議員あてに書面を出している。"}, {"t": 571.3333333333334, "x": "のちに公安調査庁長官が国会でそう認めた。"}, {"t": 574.4166666666666, "x": "時期は「十二月の二十一日の十日ほど前」。"}, {"t": 577.5333333333333, "x": "12月11日あたりってこと？"}, {"t": 579.8, "x": "そう読める。本会議と同じころだ。"}, {"t": 582.0333333333333, "x": "中身がこの事件と関係するかは、\n答弁に書かれていない。"}, {"t": 585.5666666666667, "x": "病室の外の空気は、そういう冬だった。"}, {"t": 588.9333333333333, "x": "12月15日、日曜日。"}, {"t": 590.8, "x": "事件からちょうど1週間だ。"}, {"t": 592.6333333333333, "x": "この朝、容態が急に悪くなったと伝えられている。"}, {"t": 596.0, "x": "順調だったんじゃないの？"}, {"t": 597.6, "x": "週の半ばまでの話はそうだった。"}, {"t": 599.8166666666667, "x": "診断は腸閉塞だったとされる。"}, {"t": 601.9166666666666, "x": "腸の中の物が先へ進まなくなる状態だ。"}, {"t": 604.7333333333333, "x": "午後2時30分から2度目の手術が始まった。"}, {"t": 607.7666666666667, "x": "ここから夜までのことは、記録が特に細い。"}, {"t": 610.7166666666667, "x": "手術はうまくいったの？"}, {"t": 612.3166666666667, "x": "終わったあとの話が残っている。"}, {"t": 614.2666666666667, "x": "妻の話を元にした本の抜粋は、題にこう書いた。"}, {"t": 617.6666666666666, "x": "手術が成功したその日に亡くなった、と。"}, {"t": 620.5166666666667, "x": "成功したのに？"}, {"t": 621.7166666666667, "x": "妻は午後9時ごろ、病院に駆けつけたと伝えられる。"}, {"t": 624.9166666666666, "x": "すでに危ない状態だった。"}, {"t": 626.5833333333334, "x": "午後9時50分ごろ、亡くなったことが確かめられた。"}, {"t": 629.9166666666666, "x": "12月8日の夜10時30分から、ほぼ7日。"}, {"t": 633.2166666666667, "x": "全治2週間の見立ての、ちょうど半分だった。"}, {"t": 636.2333333333333, "x": "奥さんは、結婚して半年だったのよね。"}, {"t": 639.05, "x": "22歳だった。"}, {"t": 640.25, "x": "この夜の話は、この回では深く入らない。"}, {"t": 643.0833333333334, "x": "著書には本人の言葉で書かれている。"}, {"t": 645.35, "x": "ここで大事なのは数字の並びだけだ。"}, {"t": 647.65, "x": "4センチの傷。全治2週間の見立て。"}, {"t": 650.3166666666667, "x": "約1か月余の静養の見込み。そして7日で迎えた最期。"}, {"t": 654.0333333333333, "x": "この4つが、うまくつながらないまま残った。"}, {"t": 657.4166666666666, "x": "翌12月16日、遺体は司法解剖に回された。"}, {"t": 660.9166666666666, "x": "場所は慶應義塾大学病院の法医学教室だとされる。"}, {"t": 664.5666666666667, "x": "刺された人だから、解剖になるのね。"}, {"t": 667.1166666666667, "x": "事件の被害者だからだ。"}, {"t": 668.6, "x": "死因が裁判に関わる。"}, {"t": 670.2333333333333, "x": "公式の発表にある死因は、長い病名だった。"}, {"t": 673.2666666666667, "x": "穿孔性化膿性腹膜炎。"}, {"t": 675.25, "x": "長い。どういう病気なの？"}, {"t": 677.0, "x": "腹の中を包む膜に、うみが\nたまって炎症を起こす状態だ。"}, {"t": 680.6833333333333, "x": "穴の開いた腸からの漏れが、その元になることがある。"}, {"t": 683.8333333333334, "x": "腸に傷を負ったあとの経過としては、\n説明がつく病名だ。"}, {"t": 687.4333333333333, "x": "ここで事件の呼び方の話をしておく。"}, {"t": 689.8666666666667, "x": "世間は「力道山刺殺事件」と呼ぶことが多い。"}, {"t": 693.0333333333333, "x": "国会の答弁は、もっと乾いている。"}, {"t": 695.3833333333333, "x": "1964年12月の参議院内閣委員会で、ある議員は\nこう言った。"}, {"t": 700.15, "x": "「力道山の傷害致死事件」。"}, {"t": 702.1166666666667, "x": "刺殺と傷害致死って、どう違うの？"}, {"t": 704.6333333333333, "x": "傷害致死は、殺す気までは問わない罪の名前だ。"}, {"t": 707.7333333333333, "x": "傷つけた結果、亡くなった場合になる。"}, {"t": 710.2666666666667, "x": "のちの裁判の罪名も、それだと伝えられている。"}, {"t": 713.3, "x": "呼び名の強さと法律の言葉には、差がある。"}, {"t": 716.75, "x": "刺し傷から7日で亡くなると、人は理由を探す。"}, {"t": 719.9666666666667, "x": "この事件のまわりには、大きく3つの話が残った。"}, {"t": 723.3333333333334, "x": "1つ目は、本人が飲み食いをしたせいだという話。"}, {"t": 726.5333333333333, "x": "サイダーを飲んで急変した、という形で語られてきた。"}, {"t": 730.0333333333333, "x": "それは聞いたことがある気がする。"}, {"t": 731.9833333333333, "x": "ところが妻の著書を読んだ\n記事は、これを誤りだとしている。"}, {"t": 735.4166666666666, "x": "「退院したらビールが飲みたい」という言葉があった。"}, {"t": 738.2833333333333, "x": "それが広まるうちに形を変えたのかも\nしれない、という見方だ。"}, {"t": 741.9666666666667, "x": "2つ目は、麻酔の事故だったという話。"}, {"t": 744.6333333333333, "x": "1993年、ある麻酔の医師が\n一般向けの本に書いた説だ。"}, {"t": 749.0333333333333, "x": "筋肉をゆるめる薬のあとで、息の管が\n入らなかったという内容になる。"}, {"t": 753.55, "x": "本に書いてあるなら、そうなんじゃないの？"}, {"t": 755.9833333333333, "x": "そこが落とし穴だ。これは論文ではなく一般書だった。"}, {"t": 759.3166666666667, "x": "異論もあまり出ないまま、繰り返し引かれていった。"}, {"t": 762.2, "x": "2019年、麻酔の専門誌にこれを見直す論文が載る。"}, {"t": 765.9333333333333, "x": "聖路加の麻酔科の医師が書いたものだ。"}, {"t": 768.2166666666667, "x": "題は「力道山の死因は、本当に麻酔事故だったか」。"}, {"t": 771.75, "x": "当時の医療者の証言を調べ、\n否定する根拠が多いとした。"}, {"t": 775.55, "x": "じゃあ、麻酔の説はなくなったの？"}, {"t": 777.7666666666667, "x": "否定の根拠が示された、というところまでだ。"}, {"t": 780.6, "x": "3つ目は、腹膜炎そのものが原因だという話。"}, {"t": 783.8333333333334, "x": "これは公式の発表に近い、いちばん長く続く説明だ。"}, {"t": 787.5333333333333, "x": "この回はどれにも味方しない。"}, {"t": 789.3666666666667, "x": "医師や病院を責める材料も持っていない。"}, {"t": 791.6666666666666, "x": "妻は著書で、2度目の手術には\n納得がいかないと書いた。"}, {"t": 795.2166666666667, "x": "家族として抱いた思いとして、ここに置いておく。"}, {"t": 798.2833333333333, "x": "60年たっても、話が割れているのね。"}, {"t": 801.1, "x": "割れたまま、7日の記録はこれ以上増えていない。"}, {"t": 804.6166666666667, "x": "葬儀は12月20日、東京の池上本門寺で行われた。"}, {"t": 808.5, "x": "参列した人は1万人を超えたと伝えられる。"}, {"t": 811.5333333333333, "x": "1万人！　お寺に入りきらないでしょ？"}, {"t": 814.0166666666667, "x": "列は500メートルを超えて、\n駅までのびたという記述がある。"}, {"t": 817.5333333333333, "x": "その2日前の18日に、\n桐ヶ谷の斎場で荼毘に付された。"}, {"t": 821.3833333333333, "x": "ここで、もう一度だけ日付を見ておこう。"}, {"t": 823.8, "x": "12月8日、刺される。"}, {"t": 825.5833333333334, "x": "12月11日、本会議で比喩に使われる。"}, {"t": 828.6666666666666, "x": "12月15日、亡くなる。"}, {"t": 830.6333333333333, "x": "12月16日、司法解剖。"}, {"t": 832.9333333333333, "x": "12月20日、葬儀。"}, {"t": 834.7833333333333, "x": "12日間で全部終わったのね。"}, {"t": 836.9166666666666, "x": "テレビの中の人が、2週間足らずでいなくなった。"}, {"t": 840.0833333333334, "x": "残された団体の話も、すぐ動いた。"}, {"t": 842.7, "x": "プロレスの興行は止まらなかった。"}, {"t": 844.75, "x": "亡くなって2日後、幹部たちはテレビ局へ行っている。"}, {"t": 847.9, "x": "放送を続けてほしいと頼むためだ。"}, {"t": 850.3, "x": "葬儀より先に？"}, {"t": 851.55, "x": "そう書かれている。放送が\n止まれば、会社も止まるからだ。"}, {"t": 855.0166666666667, "x": "局は条件をつけて続けることに応じたという。"}, {"t": 857.8166666666667, "x": "だが、この回が見たいのは葬儀の次の日だ。"}, {"t": 860.5833333333334, "x": "12月21日。"}, {"t": 862.1166666666667, "x": "場所は東京を離れて、静岡県の熱海に移る。"}, {"t": 865.8833333333333, "x": "葬儀の翌日の12月21日、熱海のつるやホテル。"}, {"t": 869.5833333333334, "x": "関東の7つの団体が集まり、発会式を開いた。"}, {"t": 873.05, "x": "名前は関東会という。"}, {"t": 874.65, "x": "7つって、どこの団体？"}, {"t": 876.5166666666667, "x": "答弁が順に読み上げている。"}, {"t": 878.25, "x": "松葉会、住吉会、国粋会、錦政会。"}, {"t": 881.4, "x": "東声会、義人党、北星会。"}, {"t": 883.8, "x": "あれ、住吉と東声会が入ってる？"}, {"t": 886.2833333333333, "x": "気づいたか。答弁の12月8日の話に出た2つの名だ。"}, {"t": 890.05, "x": "店で刺した男の所属が「住吉一家」。"}, {"t": 892.8666666666667, "x": "アパート前で報復した側が「東声会」。"}, {"t": 895.4666666666667, "x": "その2週間後、名前の近い団体が同じ席についた。"}, {"t": 899.1333333333333, "x": "けんかをした側どうしが、一緒の会に？"}, {"t": 901.6833333333333, "x": "日付の上ではそうなる。"}, {"t": 903.1333333333333, "x": "ただし先に言っておく。"}, {"t": 904.55, "x": "この会は事件のために作られたわけではない。"}, {"t": 907.2, "x": "警察庁長官の説明では、話は前から進んでいた。"}, {"t": 910.8666666666667, "x": "関西の勢力が関東へ来るのに対抗するのが目的だ。"}, {"t": 914.4166666666666, "x": "はじめは「関東親睦会」という案もあったという。"}, {"t": 917.55, "x": "親睦だけでなく政治の色を\n足して、関東会にしたらしい。"}, {"t": 921.25, "x": "葬儀の翌日になったのは偶然なの？"}, {"t": 923.7166666666667, "x": "答弁は何も結びつけていない。"}, {"t": 925.7, "x": "だからこの回も結びつけない。"}, {"t": 927.5833333333334, "x": "ただ、並んだ日付は消えない。"}, {"t": 929.55, "x": "英雄の葬儀の翌日に、\n7つの団体が1つの会を名乗った。"}, {"t": 933.55, "x": "取り締まる側から見れば、\n気味の悪い日付だったはずだ。"}, {"t": 937.4833333333333, "x": "関東会には綱領があった。"}, {"t": 939.2666666666667, "x": "1964年6月26日の参議院法務委員会で、\n刑事局長が全文を読んだ。"}, {"t": 945.2333333333333, "x": "綱領って、会の決まりみたいなもの？"}, {"t": 947.6666666666666, "x": "そうだ。目的を箇条書きにしたものだ。"}, {"t": 950.2666666666667, "x": "最初の項目はこうだ。"}, {"t": 951.7833333333333, "x": "「世界の平和、国家の繁栄に寄与し」。"}, {"t": 954.3333333333334, "x": "えっ、世界の平和？"}, {"t": 955.8833333333333, "x": "続きがある。「自由民主主義を擁護推進し」。"}, {"t": 958.6833333333333, "x": "「これを阻止するものがあれば呵責なく粉砕し」。"}, {"t": 961.35, "x": "共産主義には「全面的に闘争を挑み」と書いている。"}, {"t": 964.9, "x": "「常に民衆の立場にあり」という項目まである。"}, {"t": 967.9333333333333, "x": "言葉だけ聞くと、政治の団体みたい。"}, {"t": 970.5666666666667, "x": "そこが国会の議員たちを警戒させた。"}, {"t": 973.0166666666667, "x": "議員が聞いた。これはどういう性格の団体なのか。"}, {"t": 976.0333333333333, "x": "刑事局長の答えは短かった。"}, {"t": 978.2333333333333, "x": "「関東地域の博徒団体の親睦機関」。"}, {"t": 980.9166666666666, "x": "綱領と答えが、ずいぶん違うわね。"}, {"t": 983.3, "x": "博徒はばくちを打つ人たちのことだ。"}, {"t": 985.5833333333334, "x": "東声会については「ぐれん隊」と考えられると言った。"}, {"t": 988.95, "x": "看板と中身の差を、答弁が言葉で分けたわけだ。"}, {"t": 992.1166666666667, "x": "国家公安委員長も、この年の2月に\n同じことを認めている。"}, {"t": 995.95, "x": "「暴力団が政治結社に看板を塗り変えておる」と。"}, {"t": 999.1833333333333, "x": "名前を変えれば取り締まられないと思ったのかな。"}, {"t": 1001.95, "x": "動機までは答弁に書かれていない。"}, {"t": 1003.9666666666667, "x": "ただ関東会は、政治結社の届け出を\nまだしていなかった。"}, {"t": 1007.5666666666667, "x": "議員の言い方では、届けていたのは\n7団体のうち2つだった。"}, {"t": 1011.4166666666666, "x": "そして、この会には短い寿命しか残っていなかった。"}, {"t": 1014.8, "x": "それは後で話す。"}, {"t": 1016.6833333333333, "x": "少し視野を広げよう。"}, {"t": 1018.0833333333334, "x": "この年、力道山の前にも2つ事件があった。"}, {"t": 1021.2, "x": "1つ目は7月15日の朝6時50分ごろ、神奈川県平塚市。"}, {"t": 1025.75, "x": "河野一郎 大臣の家に2人が車で乗りつけた。"}, {"t": 1029.0166666666667, "x": "持っていたのはガソリン18リットル入りの缶が2つ。"}, {"t": 1032.25, "x": "大臣の家に？　朝から？"}, {"t": 1034.0666666666666, "x": "秘書に拳銃を突きつけ、応接間に\nガソリンをまいて火をつけた。"}, {"t": 1037.9, "x": "木造の平屋が全焼している。"}, {"t": 1039.8833333333334, "x": "2人は右翼の団体の人間だった。"}, {"t": 1042.1833333333334, "x": "背後の刑事責任を問える事実は、見つからなかった。"}, {"t": 1045.55, "x": "2つ目は11月9日の午後6時9分ごろ、東京会館の前だ。"}, {"t": 1050.0333333333333, "x": "評論家の出版記念会から\n出てきた田中清玄が撃たれた。"}, {"t": 1053.8333333333333, "x": "田中清玄って？"}, {"t": 1055.2, "x": "若いころ共産党の委員長で、のちに\n財界の裏方になった人物だ。"}, {"t": 1059.5666666666666, "x": "拳銃が4発撃たれ、そのうち\n3発が当たって重傷を負った。"}, {"t": 1063.3, "x": "犯人は近くで警備に就いていた\n巡査に現行犯で逮捕された。"}, {"t": 1067.1333333333334, "x": "その男は東声会の所属だったと答弁にある。"}, {"t": 1070.0833333333333, "x": "警察は東声会の事務所などを捜索した。"}, {"t": 1072.8333333333333, "x": "しかし背後の証拠は見つからなかった。"}, {"t": 1075.2, "x": "そして3つ目が、12月8日の登山ナイフだ。"}, {"t": 1078.3833333333334, "x": "7月、11月、12月で、半年もないのね。"}, {"t": 1082.2166666666667, "x": "3つは別々の事件だ。"}, {"t": 1083.9166666666667, "x": "犯人も理由も違う。答弁も別々に説明している。"}, {"t": 1087.35, "x": "でも国会の議員は、3つを1回の質問に並べた。"}, {"t": 1090.7666666666667, "x": "世間の目には、1本の線に見えたということだろう。"}, {"t": 1093.8166666666666, "x": "拳銃。ガソリン。登山ナイフ。"}, {"t": 1095.85, "x": "1963年の東京は、そういう年の暮れを迎えた。"}, {"t": 1100.3666666666666, "x": "では、数字を見よう。"}, {"t": 1101.7, "x": "当時の暴力団は、どれくらいの規模だったのか。"}, {"t": 1104.6166666666666, "x": "1963年の警察の数字がある。"}, {"t": 1107.4833333333333, "x": "団体の数は5216。"}, {"t": 1109.6333333333334, "x": "人数は18万4091人。"}, {"t": 1112.1666666666667, "x": "18万人！？　多すぎない？"}, {"t": 1114.0833333333333, "x": "前の年より1万1380人増えていた。"}, {"t": 1117.1833333333334, "x": "団体も85増えている。"}, {"t": 1118.95, "x": "年末時点の数字だから、力道山の事件の直後の姿だ。"}, {"t": 1122.9833333333333, "x": "大臣は、この数字を外国と比べて語っている。"}, {"t": 1126.1, "x": "西ドイツには暴力団の存在がほとんど無い、と。"}, {"t": 1129.15, "x": "犯罪の多い団体は法律で解散させられるからだ。"}, {"t": 1132.3, "x": "日本には、団体そのものを解散させる規定が無い。"}, {"t": 1135.5, "x": "これが1964年1月の早川崇 国家公安委員長の説明だ。"}, {"t": 1140.7, "x": "組があるのが分かっていても、\n解散はさせられないのね。"}, {"t": 1144.05, "x": "そういうことになる。"}, {"t": 1145.25, "x": "もう1つ数字がある。"}, {"t": 1146.4666666666667, "x": "構成員のうち、前歴のある人の割合。"}, {"t": 1149.1666666666667, "x": "82.7％だった。"}, {"t": 1151.4166666666667, "x": "そんなに？"}, {"t": 1152.55, "x": "10人のうち8人以上という計算だ。"}, {"t": 1154.9666666666667, "x": "1964年の春、国会議員はこんな言い方もしている。"}, {"t": 1158.95, "x": "暴力の事件で調べられた人が年に約20万人。"}, {"t": 1162.2833333333333, "x": "人口50万の都市の男が全員、という計算だと。"}, {"t": 1165.6166666666666, "x": "たとえ話としても、重い数字だった。"}, {"t": 1168.7333333333333, "x": "年が明けて、1964年。"}, {"t": 1171.15, "x": "警察は交通と暴力を、この年の中心に置いた。"}, {"t": 1174.4166666666667, "x": "1月30日、国家公安委員会で1つの文書が固まる。"}, {"t": 1178.3833333333334, "x": "暴力取締対策要綱だ。"}, {"t": 1180.55, "x": "どんなことが書いてあるの？"}, {"t": 1182.2, "x": "翌日の委員会で、長官が項目を読み上げた。"}, {"t": 1185.2666666666667, "x": "まず暴力組織の実態を解明する。"}, {"t": 1187.6333333333334, "x": "これまで十分にできていなかったと認めている。"}, {"t": 1190.3333333333333, "x": "次に、ふだんから組織の動きを見張る体制を作る。"}, {"t": 1193.6166666666666, "x": "事件が起きてから動くのでは間に合わないからだ。"}, {"t": 1196.4833333333333, "x": "逆に言うと、それまでは起きてから動いていたの？"}, {"t": 1199.4166666666667, "x": "警視庁の刑事部長も、のちに同じことを認めている。"}, {"t": 1202.7166666666667, "x": "彼らの動きをふだんから把握していなかった、と。"}, {"t": 1205.65, "x": "資金の元を断つ。拳銃や刃物を取り上げる。"}, {"t": 1208.4333333333334, "x": "組どうしの争いを早く押さえる。"}, {"t": 1210.45, "x": "被害を届けた人を守る。"}, {"t": 1212.1666666666667, "x": "項目は10を超えた。"}, {"t": 1213.5, "x": "警視庁は2月に、新しい本部を作った。"}, {"t": 1216.3333333333333, "x": "総監を委員長にした対策会議。"}, {"t": 1218.55, "x": "その下に、刑事部長を長とする組織暴力取締本部。"}, {"t": 1222.3166666666666, "x": "中心に置かれたのが捜査四課だ。"}, {"t": 1224.6, "x": "捜査四課って、ドラマで聞く名前ね。"}, {"t": 1227.1333333333334, "x": "全部の警察署に、暴力団を専門に見る係も置いた。"}, {"t": 1230.7333333333333, "x": "この年度に刑事警察を5000人増やす予定も語られた。"}, {"t": 1234.1833333333334, "x": "これが力道山の事件の\nせいだとは、答弁は言っていない。"}, {"t": 1237.5166666666667, "x": "河野邸も田中清玄も、もっと前の国会の議論もある。"}, {"t": 1241.05, "x": "ただ同じ冬に、要綱が動き出したことは確かだ。"}, {"t": 1244.9333333333334, "x": "1964年2月18日、衆議院予算委員会の第四分科会。"}, {"t": 1249.8333333333333, "x": "社会党のある議員が、警察に求めた。"}, {"t": 1252.45, "x": "河野邸、力道山、田中清玄の3つを説明してほしい。"}, {"t": 1256.2166666666667, "x": "「原因や社会的背景」をできるだけ話してくれ、と。"}, {"t": 1259.8166666666666, "x": "やっと国会で力道山の話が出るのね。"}, {"t": 1262.55, "x": "これが冒頭で言った答弁だ。"}, {"t": 1264.3166666666666, "x": "刑事局長は日付と時刻を読み上げた。"}, {"t": 1266.8333333333333, "x": "12月8日の午後10時30分。"}, {"t": 1269.0833333333333, "x": "ニュー・ラテンクォーター。"}, {"t": 1270.3, "x": "住吉一家の男。登山ナイフ。"}, {"t": 1272.6166666666666, "x": "15日に亡くなったこと。"}, {"t": 1274.3333333333333, "x": "翌未明のアパート前の件。逮捕者が6人。"}, {"t": 1277.1166666666666, "x": "ここまでで、わずか数行だ。"}, {"t": 1279.1166666666666, "x": "それで、原因は？"}, {"t": 1280.5, "x": "こう続く。"}, {"t": 1281.6333333333334, "x": "「現在の段階では単純なけんかという\n結論になっております」。"}, {"t": 1285.3333333333333, "x": "「以上でございます」。"}, {"t": 1286.6166666666666, "x": "えっ、それで終わり？"}, {"t": 1288.0166666666667, "x": "終わりだ。田中清玄の件の説明は、その何倍も長い。"}, {"t": 1291.7333333333333, "x": "答えとしては、おかしくない。"}, {"t": 1293.5666666666666, "x": "足の踏み合いから始まったなら、確かにけんかだ。"}, {"t": 1296.6, "x": "答弁は、組の指示があったとは一言も言っていない。"}, {"t": 1299.8666666666666, "x": "でも聞いた人は、物足りなかったでしょうね。"}, {"t": 1302.6333333333334, "x": "議員はそこを責めなかった。"}, {"t": 1304.2833333333333, "x": "矛先は別の所へ向かった。"}, {"t": 1306.3, "x": "取り締まりは「いつでもかけ声に終わり」と言う。"}, {"t": 1309.05, "x": "田舎では警察官と組の者が飲んでいる、とも言った。"}, {"t": 1312.3666666666666, "x": "だから竜頭蛇尾になるのだ、と。"}, {"t": 1314.4, "x": "そして聞いた。暴力団を壊滅させる自信はあるのか。"}, {"t": 1317.75, "x": "刑事局長の答えが、この答弁でいちばん正直だった。"}, {"t": 1321.3, "x": "「できるかできないかは別問題といたしまして」。"}, {"t": 1324.0, "x": "壊滅させる方針で、続けてやるつもりだと答えた。"}, {"t": 1327.3333333333333, "x": "「単純なけんか」のあとに来たのは、\nそういう言葉だった。"}, {"t": 1331.4333333333334, "x": "同じ日に、早川崇 国家公安委員長が長い発言をした。"}, {"t": 1335.65, "x": "彼には1つの言い方があった。"}, {"t": 1337.5833333333333, "x": "「暴力が引き合う」。"}, {"t": 1338.8833333333334, "x": "引き合うって、得をするってこと？"}, {"t": 1341.1, "x": "そうだ。割に合う、という意味だ。"}, {"t": 1343.1333333333334, "x": "大臣は刑の軽さを数字で並べた。"}, {"t": 1345.4333333333334, "x": "暴力団の殺人の判決は、平均で7年ほど。"}, {"t": 1348.85, "x": "仮釈放や恩赦が入ると、3年で出てくる。"}, {"t": 1351.7833333333333, "x": "そして「むしろまた箔がつく」と言った。"}, {"t": 1354.5166666666667, "x": "刑務所に入ると格が上がるってこと？"}, {"t": 1356.8666666666666, "x": "大臣はそう見ていた。"}, {"t": 1358.25, "x": "暴行で刑務所へ入るのは0.6％。"}, {"t": 1361.0, "x": "傷害でも、せいぜい4.5％。"}, {"t": 1363.4833333333333, "x": "イギリスは傷害で30％近くと比べている。"}, {"t": 1366.7833333333333, "x": "数字で言われると、差が大きいのね。"}, {"t": 1369.0666666666666, "x": "大臣が持ち出した手が2つある。"}, {"t": 1371.1666666666667, "x": "1つは取り締まりを強めること。"}, {"t": 1373.2, "x": "もう1つは法律を重くすることだ。"}, {"t": 1375.4333333333334, "x": "拳銃や刀で人を傷つけたら、重い罪にする。"}, {"t": 1378.6666666666667, "x": "何度も繰り返す者は、簡単に保釈させない。"}, {"t": 1381.6666666666667, "x": "「暴力というものは引き合わないのだ」。"}, {"t": 1383.75, "x": "そう分からせる、というのが大臣の筋書きだった。"}, {"t": 1386.7166666666667, "x": "ただし、この法案には重い過去があった。"}, {"t": 1389.1666666666667, "x": "2度出して、2度とも成立していなかった。"}, {"t": 1391.9666666666667, "x": "反対する人がいたの？"}, {"t": 1393.3666666666666, "x": "暴力団の法律なのに？"}, {"t": 1395.25, "x": "いたんだ。理由はなかなか深い。"}, {"t": 1397.9, "x": "法案の名は、暴力行為等処罰に関する法律の改正案。"}, {"t": 1401.6833333333334, "x": "元の法律は大正15年にできた。"}, {"t": 1404.0666666666666, "x": "第43国会、第44国会と出して、どちらも審議未了だ。"}, {"t": 1408.6, "x": "1964年の国会が3度目になる。"}, {"t": 1411.5333333333333, "x": "2月18日の分科会で、議員は\nその場で言い返している。"}, {"t": 1415.2166666666667, "x": "自分は40年以上、社会運動をしてきた。"}, {"t": 1418.0833333333333, "x": "治安維持法でも、ひどい目にあってきた。"}, {"t": 1420.6166666666666, "x": "暴力団の話に、どうして治安維持法が出てくるの？"}, {"t": 1424.05, "x": "善意で作った法律でも、権力は政治に逆用する。"}, {"t": 1427.4166666666667, "x": "結局は労働運動を取り締まるのではないか。"}, {"t": 1430.0333333333333, "x": "これが反対の理由だった。"}, {"t": 1431.7333333333333, "x": "元の法律は、労働争議が激しい\n時代に生まれていたからだ。"}, {"t": 1435.5, "x": "大臣は、処罰法の中身を知らないのだと言い返した。"}, {"t": 1438.9666666666667, "x": "大臣も引かなかったのね。"}, {"t": 1440.8, "x": "今度の改正は個人の凶器と常習の者が相手だ。"}, {"t": 1443.9666666666667, "x": "労働運動には「全然無関係」だと言い切った。"}, {"t": 1447.1, "x": "議員は引かなかった。"}, {"t": 1448.4666666666667, "x": "今の刑法を厳しく使えば足りる。"}, {"t": 1450.6166666666666, "x": "問題は法律ではなく、警察官と組の付き合いだ、と。"}, {"t": 1454.25, "x": "春の衆議院法務委員会は、\n学者も呼んで審議を重ねた。"}, {"t": 1457.9, "x": "4月24日、委員会で修正案が\n否決され、原案が可決される。"}, {"t": 1462.4333333333334, "x": "4月28日の衆議院本会議は荒れた。"}, {"t": 1465.2333333333333, "x": "賀屋興宣 法務大臣の不信任決議案が出たんだ。"}, {"t": 1468.75, "x": "法案のために大臣の不信任？"}, {"t": 1470.8666666666666, "x": "不信任案の理由の最初に、この法案が書かれていた。"}, {"t": 1474.2166666666667, "x": "3度も国会に出したこと自体が責められた。"}, {"t": 1476.9666666666667, "x": "不信任案は通らず、法案は参議院へ送られた。"}, {"t": 1480.0333333333333, "x": "本当の山場は、そこからだった。"}, {"t": 1482.8833333333334, "x": "参議院では審議そのものが始まらなかった。"}, {"t": 1485.5666666666666, "x": "与党と野党の話がつかなかったからだ。"}, {"t": 1488.1, "x": "5月28日、委員長が職権で審議に入る。"}, {"t": 1491.55, "x": "職権って、委員長の判断で進めるってこと？"}, {"t": 1494.7333333333333, "x": "そうだ。ここで社会党の怒りが強まった。"}, {"t": 1497.4166666666667, "x": "理事の打ち合わせは12回。"}, {"t": 1499.0666666666666, "x": "委員会の審査は8回。"}, {"t": 1500.6333333333334, "x": "かかった時間は27時間50分。"}, {"t": 1503.2, "x": "1つの法案で27時間！"}, {"t": 1505.3, "x": "内わけがおもしろい。"}, {"t": 1506.55, "x": "自民党の質問は2時間25分。"}, {"t": 1508.9333333333334, "x": "社会党は24時間27分。"}, {"t": 1511.1666666666667, "x": "ほとんど全部が反対側の質問だった。"}, {"t": 1513.75, "x": "その中で議員たちは、暴力団の実態を\n細かく引き出していく。"}, {"t": 1517.75, "x": "関東会の綱領が読み上げられたのも、\nこの年の法務委員会だ。"}, {"t": 1521.6333333333334, "x": "6月17日、質疑を打ち切る動議が出て可決される。"}, {"t": 1525.3166666666666, "x": "社会党は反発し、委員長の解任決議案を出した。"}, {"t": 1528.9166666666667, "x": "今度は委員長の解任？"}, {"t": 1530.5666666666666, "x": "6月20日、土曜日の参議院本会議で採決された。"}, {"t": 1534.1666666666667, "x": "解任決議案は通らなかった。"}, {"t": 1536.1666666666667, "x": "続いて法案の採決に進む。"}, {"t": 1538.2166666666667, "x": "総理の池田勇人も答弁に立った。"}, {"t": 1540.4333333333334, "x": "単なる大衆運動を取り締まる考えは無い、と言った。"}, {"t": 1543.6166666666666, "x": "投票総数182票。"}, {"t": 1545.55, "x": "賛成112票、反対70票。"}, {"t": 1548.1166666666666, "x": "3度目の法案が、ようやく通った。"}, {"t": 1550.5166666666667, "x": "力道山の事件から半年くらいね。"}, {"t": 1553.0, "x": "6月24日に法律第114号として公布された。"}, {"t": 1556.7166666666667, "x": "施行は7月14日。"}, {"t": 1558.3833333333334, "x": "12月8日からだと、ざっと7か月だ。"}, {"t": 1561.8, "x": "では、新しい法律は何を変えたのか。"}, {"t": 1564.3, "x": "銃砲または刀剣類を使って人を傷つけた場合。"}, {"t": 1567.4333333333334, "x": "普通の傷害と分けて、重くした。"}, {"t": 1569.7333333333333, "x": "委員長の報告では、3年以下から\n1年以上10年以下の懲役へ。"}, {"t": 1574.0166666666667, "x": "下限ができたのね。"}, {"t": 1575.4333333333334, "x": "そう。未遂も処罰の対象になった。"}, {"t": 1577.8166666666666, "x": "ここで、この回の登山ナイフに戻る。"}, {"t": 1580.1666666666667, "x": "刀剣類とは、どこまでを言うのか。"}, {"t": 1582.3333333333333, "x": "4月16日の委員会で、\n法務省の刑事局長が説明している。"}, {"t": 1586.6, "x": "刃渡り15センチ以上の刀、剣、やり、なぎなた。"}, {"t": 1590.0666666666666, "x": "それに、あいくち。これは長さを問わない。"}, {"t": 1592.5666666666666, "x": "そして45度以上に自動で刃が開く飛び出しナイフ。"}, {"t": 1595.8, "x": "局長は続けた。"}, {"t": 1597.0833333333333, "x": "「これ以外のものは銃砲刀剣類に\n入らないのでございます」。"}, {"t": 1600.5333333333333, "x": "登山ナイフは、その中に入ってる？"}, {"t": 1602.95, "x": "名前は挙がっていない。"}, {"t": 1604.35, "x": "えっ、あの事件のナイフは？"}, {"t": 1606.1833333333334, "x": "入るかどうかは、当たれた記録では決められない。"}, {"t": 1608.9333333333334, "x": "国会が重くしたのは、拳銃と日本刀が中心だった。"}, {"t": 1612.4833333333333, "x": "委員長の報告も「ピストル・日本刀等」と書いている。"}, {"t": 1616.0833333333333, "x": "法律の線は刃の長さと形で引かれた。"}, {"t": 1618.7666666666667, "x": "そして施行前の事件には、新しい罰は当たらない。"}, {"t": 1621.9666666666667, "x": "12月8日の男は、前の法律で裁かれることになる。"}, {"t": 1625.6, "x": "施行後の1か月の検挙は388件、892人。"}, {"t": 1629.9333333333334, "x": "そのうち凶器の条文は26件、36人だった。"}, {"t": 1633.6, "x": "思ったより少ないのね。"}, {"t": 1635.25, "x": "常習のほうの条文が81件、125人。"}, {"t": 1638.4666666666667, "x": "線を引いても、検挙の中身は常習のほうが多かった。"}, {"t": 1642.4, "x": "1964年の夏、新聞に1つの言葉が広がる。"}, {"t": 1646.4, "x": "頂上作戦。"}, {"t": 1647.55, "x": "よく聞く言葉ね。警察の作戦名でしょう？"}, {"t": 1650.5, "x": "そう思うだろう。ところが警察は違うと答えている。"}, {"t": 1653.6166666666666, "x": "6月26日の参議院法務委員会で、刑事局長が言った。"}, {"t": 1657.7166666666667, "x": "「頂上作戦というようなことばを特に\nいままで使ったことはございません」。"}, {"t": 1661.8333333333333, "x": "警察が名づけたんじゃないの？"}, {"t": 1663.7333333333333, "x": "翌年3月の警察庁長官は、もっとはっきり言っている。"}, {"t": 1667.4666666666667, "x": "「頂上作戦という名前は、実は\n私たち自身がつけたのではなしに」。"}, {"t": 1671.75, "x": "そうしてほしいという世間の願いを\nこめて、新聞が呼んだ。"}, {"t": 1675.2, "x": "自然に警察もまねるようになった、と話した。"}, {"t": 1678.2833333333333, "x": "新聞がつけた名前を、警察があとから使ったのね。"}, {"t": 1681.7333333333333, "x": "意味はこうだ。末端の者ばかり\n捕まえても根絶できない。"}, {"t": 1685.2833333333333, "x": "組の上のほうに打撃を与える。"}, {"t": 1687.1833333333334, "x": "ところが、これには法律の壁があった。"}, {"t": 1689.6333333333334, "x": "下の者がやったことを、上の責任にはすぐ問えない。"}, {"t": 1692.8666666666666, "x": "世間は親分にも責任があると思う。"}, {"t": 1695.2, "x": "法律は、関わりが証明できる者しか裁けない。"}, {"t": 1698.3, "x": "長官はこの差を「常識と法律との乖離」と呼んだ。"}, {"t": 1701.85, "x": "じゃあ、どうやって上を捕まえたの？"}, {"t": 1703.9833333333333, "x": "本人が自分でやったことを見つけるしかない。"}, {"t": 1706.5833333333333, "x": "恐喝や、現行犯でない賭博が使われた。"}, {"t": 1709.4333333333334, "x": "この年の夏、住吉会の会長が検挙された。"}, {"t": 1712.6833333333334, "x": "8月18日の朝刊には、\n住吉一家の幹部の検挙も載った。"}, {"t": 1717.05, "x": "松葉会の資金を担当する者も捕まった。"}, {"t": 1719.85, "x": "12月の答弁に出た住吉の名が、\n別の形で国会に戻ってきたわけだ。"}, {"t": 1724.75, "x": "ある議員は意地悪く聞いている。"}, {"t": 1726.45, "x": "国会が済めば、しぼむのではないか。"}, {"t": 1728.75, "x": "長官にも局長にも、それは聞かれ続けることになる。"}, {"t": 1732.7666666666667, "x": "この夏の取り締まりには、もう1つ急ぐ理由があった。"}, {"t": 1736.0666666666666, "x": "10月の東京オリンピックだ。"}, {"t": 1738.0333333333333, "x": "ああ、そうか。1964年だものね。"}, {"t": 1741.1166666666666, "x": "8月18日の小委員会で、ある議員が聞いている。"}, {"t": 1744.5166666666667, "x": "オリンピックの間の暴力はどうするのか。"}, {"t": 1746.9, "x": "警視庁の刑事部長の答えはこうだった。"}, {"t": 1749.35, "x": "「この機会に絶対そういった事故を起こさない」。"}, {"t": 1751.8833333333334, "x": "6月と7月に集中して行った\n取り締まりも、その一環だという。"}, {"t": 1756.3833333333334, "x": "外国の人が大勢来るものね。"}, {"t": 1758.5333333333333, "x": "彼の言い方には、もう1つ強い言葉があった。"}, {"t": 1761.4833333333333, "x": "「できるだけ彼らを隔離してしまう」。"}, {"t": 1763.55, "x": "盛り場を受け持つ警察署の体制も強めるとした。"}, {"t": 1766.7333333333333, "x": "数字も答弁に残っている。"}, {"t": 1768.4666666666667, "x": "この年の前半の検挙は3万5649件、2万7536人。"}, {"t": 1774.0666666666666, "x": "前の年の同じ時期より、およそ1割多い。"}, {"t": 1776.8833333333334, "x": "オリンピックの前に一気に動いたのね。"}, {"t": 1779.2333333333333, "x": "3月にはこの回と同じ東京で、大使が\n刃物で襲われる事件もあった。"}, {"t": 1783.6666666666667, "x": "別の回で話したので、ここでは触れない。"}, {"t": 1786.25, "x": "世界に見せる東京を前に、警察は\n盛り場の体制を強めていた。"}, {"t": 1790.3166666666666, "x": "では、その結果はどうなったのか。"}, {"t": 1793.0666666666666, "x": "1964年の結果が、翌年の国会で報告された。"}, {"t": 1797.2333333333333, "x": "暴力団の犯罪の検挙は7万3552件。"}, {"t": 1800.8, "x": "人数は5万8687人。"}, {"t": 1803.55, "x": "1年で6万人近く！"}, {"t": 1805.3833333333334, "x": "把握している構成員の、\nおよそ3分の1だと長官は言った。"}, {"t": 1809.1833333333334, "x": "前の年より、件数で1割2分、\n人数で1割5分増えている。"}, {"t": 1813.1, "x": "幹部の割合も、約7％から約9％に増えた。"}, {"t": 1816.9666666666667, "x": "銃や刃物の押収は、前の年より3割増えた。"}, {"t": 1820.05, "x": "1年で解散した団体は約300とされる。"}, {"t": 1823.0666666666666, "x": "じゃあ、取り締まりは成功したの？"}, {"t": 1825.15, "x": "そこは国会でも見方が割れた。"}, {"t": 1827.15, "x": "参議院の予算委員会で、\n成功したのかと聞かれた長官は言う。"}, {"t": 1831.0, "x": "「成功したかまだ\n足らないかということについては見方がある」。"}, {"t": 1834.3166666666666, "x": "別の議員はもっと厳しかった。"}, {"t": 1836.2666666666667, "x": "検挙が、かえって箔をつけているのではないか。"}, {"t": 1839.05, "x": "つかまった親分が、すぐ保釈で出てくるではないか。"}, {"t": 1842.3, "x": "大臣が言っていた箔の話が、また出てくるのね。"}, {"t": 1845.5666666666666, "x": "長官自身も心配を隠さなかった。"}, {"t": 1847.95, "x": "1つの組が解散しても、別の組へ\n移るだけかもしれない。"}, {"t": 1851.7333333333333, "x": "壊すだけでなく、まともな仕事に戻す手が要る。"}, {"t": 1854.75, "x": "そう答えている。"}, {"t": 1855.8166666666666, "x": "そして、あの関東会だ。"}, {"t": 1857.6, "x": "1965年2月24日、刑事局長はこう報告した。"}, {"t": 1862.0, "x": "「先日も関東会が解散いたしまして」。"}, {"t": 1864.7166666666667, "x": "熱海の会が、もう解散したの？"}, {"t": 1866.9666666666667, "x": "12月21日の発足から、1年と少しだ。"}, {"t": 1870.4666666666667, "x": "答弁はこんな見方も紹介している。"}, {"t": 1872.7166666666667, "x": "関東会ができたことが、取り締まりの強化を招いた。"}, {"t": 1875.9833333333333, "x": "団体の側に、そういう考えがあるらしい、と。"}, {"t": 1878.8333333333333, "x": "葬儀の翌日に始まった会は、そうやって消えた。"}, {"t": 1882.6, "x": "では、刺した男はどうなったのか。"}, {"t": 1884.7833333333333, "x": "ここも公の記録は細い。"}, {"t": 1886.5833333333333, "x": "判決文には当たれなかった。"}, {"t": 1888.4166666666667, "x": "伝えられているのは、傷害致死で\n懲役7年という数字だ。"}, {"t": 1892.2, "x": "7年？"}, {"t": 1893.3333333333333, "x": "大臣が国会で挙げた殺人の平均と同じ数字だ。"}, {"t": 1896.7833333333333, "x": "でも罪の名前が違うのよね。"}, {"t": 1898.8166666666666, "x": "そこは大事だ。殺人と傷害致死は別の罪だ。"}, {"t": 1902.0166666666667, "x": "だから軽いとも重いとも、この回では言わない。"}, {"t": 1904.7666666666667, "x": "ただ、数字が同じだったという並びだけは残る。"}, {"t": 1907.75, "x": "有罪となった時期は、1964年10月という記述がある。"}, {"t": 1911.9666666666667, "x": "ちょうど東京オリンピックが開かれていた月だ。"}, {"t": 1914.7833333333333, "x": "同じ月だったの？"}, {"t": 1916.1666666666667, "x": "資料の言う通りならそうなる。"}, {"t": 1917.85, "x": "服役した年数は、資料によって\n7年とも8年とも書かれる。"}, {"t": 1921.9333333333334, "x": "出所の時期も割れているので、ここでは決めない。"}, {"t": 1924.7166666666667, "x": "出所したあとは、組の親分になったと伝えられている。"}, {"t": 1928.0166666666667, "x": "そして毎年の命日に、遺族におわびして墓に参った。"}, {"t": 1931.5833333333333, "x": "週刊誌はそう書いているが、確かめる材料は少ない。"}, {"t": 1934.85, "x": "2013年4月9日、村田勝志は都内の病院で亡くなった。"}, {"t": 1939.25, "x": "74歳だった。"}, {"t": 1940.7833333333333, "x": "亡くなったのは、そんなに最近なのね。"}, {"t": 1943.35, "x": "当時の新聞がそう伝えている。"}, {"t": 1945.2833333333333, "x": "事件からほぼ50年。"}, {"t": 1946.7666666666667, "x": "力道山より、35年も長く生きたことになる。"}, {"t": 1950.0166666666667, "x": "刺された側の人生は、39歳で止まった。"}, {"t": 1953.0666666666666, "x": "この2つの長さの差は、何も説明してくれない。"}, {"t": 1956.25, "x": "ただ記録の上で並んでいるだけだ。"}, {"t": 1958.9833333333333, "x": "最後に、プロレスの話に戻ろう。"}, {"t": 1961.2166666666667, "x": "1965年4月6日、衆議院地方行政委員会。"}, {"t": 1965.15, "x": "議題は銃砲刀剣類等所持取締法の改正案だ。"}, {"t": 1968.5666666666666, "x": "この日、参考人が4人呼ばれた。"}, {"t": 1970.85, "x": "俳優の小林桂樹と二谷英明。"}, {"t": 1973.2166666666667, "x": "音楽事業者の団体の理事長。"}, {"t": 1975.2666666666667, "x": "そしてもう1人、日本プロレス興業の社長、定野道春。"}, {"t": 1979.4666666666667, "x": "定野って誰？"}, {"t": 1980.6166666666666, "x": "リングネームは豊登だ。"}, {"t": 1982.2166666666667, "x": "力道山のあとを継いでこの年に社長になった人物だ。"}, {"t": 1985.6666666666667, "x": "プロレスラーが国会に？"}, {"t": 1987.2833333333333, "x": "銃の話は関係ないと、本人は最初に断っている。"}, {"t": 1990.8, "x": "委員会が聞きたかったのは、\n興行と暴力団の関係だった。"}, {"t": 1994.55, "x": "そして彼は、その場でこう話し始めた。"}, {"t": 1997.1833333333334, "x": "山口組の組長が、協会の副会長だった。"}, {"t": 2000.3666666666666, "x": "会社の監査役にも、2人の名前があった。"}, {"t": 2003.3, "x": "えっ、自分から言ったの？"}, {"t": 2005.0666666666666, "x": "そうだ。「会社内と協会内におった」と語った。"}, {"t": 2008.2333333333333, "x": "暴力追放の運動が2年早ければ、こうはならなかった。"}, {"t": 2011.7666666666667, "x": "当時はそうもいかず、お願いした形もあった、と。"}, {"t": 2014.9166666666667, "x": "2年前と言えば、ちょうど1963年ごろだ。"}, {"t": 2018.4, "x": "力道山が生きていたころね。"}, {"t": 2020.35, "x": "時期はぼかしているので、断定はしない。"}, {"t": 2022.7333333333333, "x": "彼はこの副会長に降りてもらおうと動いたと話した。"}, {"t": 2025.9166666666667, "x": "協会の中も、会社の中も、きれいにしてもらった。"}, {"t": 2029.2833333333333, "x": "警視庁の捜査四課の力を借りて、と言っている。"}, {"t": 2032.3666666666666, "x": "「いままではあまり警察の人は好きじゃなかった」。"}, {"t": 2035.0833333333333, "x": "そして「一番好きになった」とまで言った。"}, {"t": 2037.9833333333333, "x": "プロレスの社長が、国会で警察を褒めてるの？"}, {"t": 2041.0666666666666, "x": "議員も「すごく警察に感謝」していると受け止めた。"}, {"t": 2044.5, "x": "リングの外で、組と切れることが仕事になっていた。"}, {"t": 2048.3, "x": "ところが、切れたら切れたで別の問題が出ていた。"}, {"t": 2051.3, "x": "定野道春が一番困っていたのは、体育館だった。"}, {"t": 2055.0666666666666, "x": "体育館？"}, {"t": 2056.2, "x": "興行に使う会場を、地方で貸してもらえない。"}, {"t": 2059.0333333333333, "x": "取り締まりの中で、自治体は\n公共の施設を組の興行に貸さなくなった。"}, {"t": 2063.516666666667, "x": "それ自体は当時の国会でも評価された動きだ。"}, {"t": 2066.45, "x": "だが手を切ったことを示す証明書が、どこにも無い。"}, {"t": 2069.5666666666666, "x": "1つの体育館を借りるのに、早くて1週間。"}, {"t": 2072.633333333333, "x": "遅いと40日かかる。"}, {"t": 2074.2166666666667, "x": "県警、市役所と、最低5、6か所に頭を下げに行く。"}, {"t": 2078.15, "x": "プロレスの人たちが、役所を回ってるのね。"}, {"t": 2081.05, "x": "動ける日は、1週間に3日ぐらいになると言っている。"}, {"t": 2084.25, "x": "彼はこの状態を、こう呼んだ。"}, {"t": 2086.133333333333, "x": "「暴力団以上の壁」。"}, {"t": 2087.7, "x": "すごい言葉ね。"}, {"t": 2088.9, "x": "そこで頼んだのが「お墨つきのようなもの」だ。"}, {"t": 2091.883333333333, "x": "岡山の1か所に、6、7人が行って1か月かかっている。"}, {"t": 2095.75, "x": "断られたと新聞に載るのも、\nいちばんの痛手だと話した。"}, {"t": 2099.516666666667, "x": "リングよりずっと地味な戦いね。"}, {"t": 2101.6, "x": "国会の比喩だった男の会社が、\n国会で体育館の話を訴えている。"}, {"t": 2106.1833333333334, "x": "1本の登山ナイフから、1年4か月後のことだ。"}, {"t": 2109.45, "x": "この法案は4月に衆議院を通り、\n刃物の決まりはまた変わる。"}, {"t": 2113.1833333333334, "x": "取り締まる側も、興行の側も、形を変えた。"}, {"t": 2116.233333333333, "x": "変わらなかったのは、\n7日間の記録の薄さのほうだった。"}, {"t": 2120.366666666667, "x": "最後に、並べ直そう。"}, {"t": 2121.9666666666667, "x": "12月8日の午後10時30分。足の踏み合い。"}, {"t": 2125.0666666666666, "x": "1本の登山ナイフ。"}, {"t": 2126.4333333333334, "x": "翌未明のアパート前で、もう1本の登山ナイフ。"}, {"t": 2129.4166666666665, "x": "傷は4センチで、見立ては2週間。"}, {"t": 2131.733333333333, "x": "診断書の1か月余。"}, {"t": 2133.2833333333333, "x": "12月15日の午後9時50分。"}, {"t": 2135.7166666666667, "x": "その5日後に葬儀があって、翌日が熱海ね。"}, {"t": 2138.8, "x": "そして翌年の要綱、3度目の法案、\n新聞がつけた作戦名。"}, {"t": 2143.0, "x": "5万8687人の検挙と、解散した関東会。"}, {"t": 2147.1666666666665, "x": "体育館を借りられない社長。"}, {"t": 2149.1, "x": "1つの事件が全部やったわけじゃないのよね。"}, {"t": 2151.85, "x": "そこは間違えないでほしい。"}, {"t": 2153.4166666666665, "x": "河野邸も、田中清玄の件も、\n18万人という数字もあった。"}, {"t": 2157.616666666667, "x": "取り締まりは、ずっと前から議論されていた。"}, {"t": 2160.25, "x": "でも記録を見ると、1つ気づくことがある。"}, {"t": 2162.9, "x": "あの本会議の比喩を思い出してくれ。"}, {"t": 2165.0333333333333, "x": "議員がそう言った4日後に、本人は亡くなった。"}, {"t": 2167.9333333333334, "x": "比喩にされた名前が、比喩で済まなくなった日だ。"}, {"t": 2170.866666666667, "x": "国会の答弁に残った言葉は、結局これだけだった。"}, {"t": 2174.4, "x": "単純なけんか。"}, {"t": 2175.65, "x": "たった6文字ね。"}, {"t": 2176.9333333333334, "x": "答弁としては正しいのかもしれない。"}, {"t": 2179.116666666667, "x": "足を踏んだ踏まないから、人は亡くなることがある。"}, {"t": 2182.0666666666666, "x": "どれだけ鍛えた体でも、どれだけ有名でも。"}, {"t": 2185.0666666666666, "x": "7日間のことは、分からないままなのね。"}, {"t": 2187.7833333333333, "x": "分からない部分は、分からないと言うしかない。"}, {"t": 2190.35, "x": "ただ、2週間と言われた傷で、\n7日で亡くなった人がいた。"}, {"t": 2194.1833333333334, "x": "それだけは、どの記録を開いても変わらない。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
