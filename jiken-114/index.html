<script>
const D={"name": "114", "file": "114_編集用", "dur": 2021.0333125, "segs": [], "subs": [{"t": 0.0, "x": "1957年1月30日。"}, {"t": 2.5, "x": "群馬県の相馬ヶ原演習場。"}, {"t": 4.6, "x": "アメリカ軍が使っていた広い野原だ。"}, {"t": 6.916666666666667, "x": "午後2時ごろ、46歳の女性が背中から撃たれた。"}, {"t": 10.333333333333334, "x": "女性は地面に落ちた薬莢を拾いに来ていた。"}, {"t": 13.166666666666666, "x": "薬莢って、弾を撃ったあとの筒よね？"}, {"t": 15.716666666666667, "x": "そうだ。真ちゅうでできている。"}, {"t": 17.55, "x": "集めて売ればお金になった。"}, {"t": 19.283333333333335, "x": "撃ったのはアメリカ陸軍の兵士だった。"}, {"t": 21.55, "x": "飛んできたのは弾ではない。"}, {"t": 23.15, "x": "撃ち終えた薬莢を空砲で飛ばしたものだ。"}, {"t": 25.666666666666668, "x": "薬莢で、人が亡くなったの？"}, {"t": 27.816666666666666, "x": "亡くなった。その場でだ。"}, {"t": 29.45, "x": "この兵士は、日本の法廷に立った。"}, {"t": 31.816666666666666, "x": "アメリカの兵士を日本が裁いたんだ。"}, {"t": 34.03333333333333, "x": "アメリカでも大きな問題になった。"}, {"t": 36.1, "x": "判決は懲役3年。執行猶予が4年ついた。"}, {"t": 39.25, "x": "兵士は判決の17日後に船で帰国した。"}, {"t": 42.28333333333333, "x": "ここまでは記録がはっきりしている。"}, {"t": 44.333333333333336, "x": "分かっていないのは、裁判の前に\n何が決まっていたかだ。"}, {"t": 47.733333333333334, "x": "のちに公開されたアメリカの公文書に\nこう書かれている。"}, {"t": 50.9, "x": "日本はいちばん軽い罪で起訴することに同意した。"}, {"t": 53.983333333333334, "x": "……え？"}, {"t": 54.46666666666667, "x": "日本政府は、そんな話はしていないと答えている。"}, {"t": 57.61666666666667, "x": "1957年にそう答えた。"}, {"t": 60.0, "x": "1996年にも同じ考えだと答えた。"}, {"t": 63.233333333333334, "x": "どちらの記録もいまも残っている。"}, {"t": 65.28333333333333, "x": "今回はこの二つの記録を順番に並べていく。"}, {"t": 68.25, "x": "先に言っておくと、どちらが正しいかは決めない。"}, {"t": 71.1, "x": "決めるための書類が、まだ全部は出ていないからだ。"}, {"t": 74.08333333333333, "x": "まずはその日の野原から始める。"}, {"t": 76.76666666666667, "x": "相馬ヶ原は、古くからの演習場だ。"}, {"t": 79.28333333333333, "x": "国会の説明では、明治40年ごろから射撃場だった。"}, {"t": 82.98333333333333, "x": "高崎にあった陸軍の第15連隊が使っていた土地だ。"}, {"t": 86.66666666666667, "x": "もとは日本の軍隊の演習場だったのね。"}, {"t": 89.36666666666666, "x": "広さはおよそ2,300町歩とされた。"}, {"t": 91.88333333333334, "x": "戦争が終わるとアメリカ軍がそのまま使い始めた。"}, {"t": 95.0, "x": "さらに民有地を200万坪新たに取り上げている。"}, {"t": 97.96666666666667, "x": "そこで大砲や小銃の実弾の訓練をしていた。"}, {"t": 100.93333333333334, "x": "1957年のころ、日本では金属の値段が上がっていた。"}, {"t": 105.06666666666666, "x": "国会では、これを金へん景気と呼んでいる。"}, {"t": 107.83333333333333, "x": "金へんって、漢字の部首の？"}, {"t": 109.9, "x": "そうだ。鉄も銅も金へんの字だろう。"}, {"t": 112.25, "x": "金属が高く売れた時代という意味だ。"}, {"t": 114.53333333333333, "x": "演習のあとの野原には、薬莢や\n砲弾のかけらが落ちていた。"}, {"t": 118.26666666666667, "x": "それを近くの人たちが拾いに入っていた。"}, {"t": 120.9, "x": "警察庁長官は、国会でこう説明している。"}, {"t": 123.95, "x": "演習のたびにあることで、その日も\n50人から60人が入っていた。"}, {"t": 128.31666666666666, "x": "そんなに大勢。"}, {"t": 129.43333333333334, "x": "ただし、それは許されていたわけではない。"}, {"t": 131.83333333333334, "x": "草を刈ったり木を取ったりすることは認められていた。"}, {"t": 134.8, "x": "だが薬莢拾いは認められていない。"}, {"t": 136.91666666666666, "x": "国の担当の役所が国会ではっきりそう答えている。"}, {"t": 140.23333333333332, "x": "止める仕組みは無かったの？"}, {"t": 141.95, "x": "あった。演習の1週間前に軍が県の知事へ知らせる。"}, {"t": 145.36666666666667, "x": "知事は地元の村へ伝える。"}, {"t": 147.1, "x": "村は役場の前にビラを貼る。"}, {"t": 148.85, "x": "立入禁止、実弾射撃実施、\n何月何日の何時から何時まで。"}, {"t": 153.4, "x": "日曜日はのぞく、と書いてあったという。"}, {"t": 155.73333333333332, "x": "ただ、入り口の立て札は古い\n役所の名前のままだった。"}, {"t": 159.2, "x": "役所は国会でそれをわびて、直している\n途中だと答えている。"}, {"t": 163.08333333333334, "x": "なんだか、ゆるかったのね。"}, {"t": 164.93333333333334, "x": "ゆるかった。そして、拾えばその日のお金になった。"}, {"t": 168.86666666666667, "x": "アメリカ側の記録も見ておこう。"}, {"t": 170.75, "x": "アメリカの最高裁判所の判決には、\n資料が付いている。"}, {"t": 174.23333333333332, "x": "国防総省の法律の責任者がまとめた宣誓書だ。"}, {"t": 177.76666666666668, "x": "アメリカの言い分を書いた紙ね。"}, {"t": 179.73333333333332, "x": "そうだ。そこにはこう書いてある。"}, {"t": 181.68333333333334, "x": "その日の朝、連隊長は\n野原にいる人の多さにあきれた。"}, {"t": 185.25, "x": "150人を超えていたと見積もっている。"}, {"t": 187.73333333333332, "x": "日本の説明より多いのね。"}, {"t": 189.6, "x": "数え方が違うのだろう。"}, {"t": 191.03333333333333, "x": "どちらも見積もりだ。"}, {"t": 192.35, "x": "機関銃の撃ち方が止まったとたん人が寄ってきた。"}, {"t": 195.45, "x": "撃ち手を押しのけて薬莢を拾った、とまで書いてある。"}, {"t": 198.48333333333332, "x": "連隊長は、実弾を兵士から引き上げさせた。"}, {"t": 201.48333333333332, "x": "午後の演習は、空砲だけに切りかえた。"}, {"t": 204.0, "x": "日本の警察にも、人を外へ出す手伝いを頼んだ。"}, {"t": 207.35, "x": "だが事件の起きた昼すぎまで助けは来なかった。"}, {"t": 210.41666666666666, "x": "アメリカ側から見ると、困ってたのね。"}, {"t": 212.95, "x": "そう書いてある。"}, {"t": 213.88333333333333, "x": "この野原は、およそ8平方マイルとされている。"}, {"t": 216.83333333333334, "x": "日本の自衛隊も4割ほどの時間を使っていた。"}, {"t": 219.8, "x": "どの軍も使わない日は、住民が畑などに使えた。"}, {"t": 223.21666666666667, "x": "薬莢拾いは村の習わしになっていた、とも\n書いてある。"}, {"t": 226.65, "x": "日本の記録とアメリカの記録で、\n景色が違って見えるわね。"}, {"t": 230.41666666666666, "x": "違って見える。"}, {"t": 231.4, "x": "日本側は、生活のために拾っていた人たちを書く。"}, {"t": 234.81666666666666, "x": "アメリカ側は、演習のじゃまをする人たちを書く。"}, {"t": 237.78333333333333, "x": "同じ野原を、二つの国が違う目で見ていた。"}, {"t": 240.71666666666667, "x": "この見方の違いは、このあと何度も出てくる。"}, {"t": 244.11666666666667, "x": "その日の朝7時30分ごろ。"}, {"t": 246.25, "x": "埼玉県の熊谷にいた部隊が演習を始めた。"}, {"t": 249.26666666666668, "x": "第8騎兵連隊の第2大隊だ。"}, {"t": 251.56666666666666, "x": "陣地を攻める形の訓練だったと説明されている。"}, {"t": 254.73333333333332, "x": "昼すぎに部隊は、演習をいったん休んだ。"}, {"t": 257.5, "x": "休けいの時間ね。"}, {"t": 258.85, "x": "場所は物見塚と呼ばれる小高いあたりだ。"}, {"t": 261.35, "x": "女性は同じ村の男性と一緒に薬莢を拾っていた。"}, {"t": 264.55, "x": "そこへ近くにいた兵士が薬莢を見せた。"}, {"t": 267.0, "x": "くれるようなそぶりだったという。"}, {"t": 268.81666666666666, "x": "くれるって、拾った薬莢を？"}, {"t": 270.8, "x": "そうだ。二人は、もらおうと思って近寄った。"}, {"t": 273.68333333333334, "x": "すると兵士が急に銃を向けた。"}, {"t": 275.6333333333333, "x": "男性がまず驚いて逃げた。"}, {"t": 277.43333333333334, "x": "兵士はうしろから撃った。"}, {"t": 278.93333333333334, "x": "1発目は、近くの地面に落ちた。"}, {"t": 281.25, "x": "2発目が女性に当たった。"}, {"t": 283.06666666666666, "x": "……逃げている背中に？"}, {"t": 284.4166666666667, "x": "警察の説明では、そうなっている。"}, {"t": 286.73333333333335, "x": "あとで警察庁長官は、一つ言い直している。"}, {"t": 289.68333333333334, "x": "2発は、同じ人に向けて撃ったのではない。"}, {"t": 292.3833333333333, "x": "1発目は男性の方向へ、2発目は女性の方向へ。"}, {"t": 295.9, "x": "一人ずつ撃ったってこと？"}, {"t": 297.5833333333333, "x": "そう説明されている。"}, {"t": 298.95, "x": "これは2月7日の参議院で\n警察庁長官が読み上げた報告だ。"}, {"t": 302.98333333333335, "x": "起きてからまだ8日しかたっていない。"}, {"t": 305.0833333333333, "x": "日本側はこのあと、もっと\nくわしい事実をまとめている。"}, {"t": 308.35, "x": "3月にアメリカ側へ出した文書だ。"}, {"t": 310.6333333333333, "x": "アメリカの宣誓書に、その英訳が\nそのまま写されている。"}, {"t": 314.21666666666664, "x": "何て書いてあるの？"}, {"t": 315.51666666666665, "x": "兵士は薬莢を投げて、二人を手まねきした。"}, {"t": 318.3, "x": "パパサン、ダイジョウブ。"}, {"t": 319.51666666666665, "x": "ママサン、ダイジョウブ。"}, {"t": 320.9166666666667, "x": "日本語でそう呼びかけたとされている。"}, {"t": 323.06666666666666, "x": "女性には、くぼみを指さして\nママサン、タクサンネと言った。"}, {"t": 326.65, "x": "まだたくさんあるよ、って？"}, {"t": 328.28333333333336, "x": "そういう意味だろう。"}, {"t": 329.35, "x": "あやしいと感じた男性が逃げ出した。"}, {"t": 331.6, "x": "兵士は英語で出ていけと叫び、男性の方へ撃った。"}, {"t": 334.7, "x": "それから女性にも同じように叫んだ。"}, {"t": 336.95, "x": "女性が北の坂へ走り出したところへ2発目を撃った。"}, {"t": 340.21666666666664, "x": "距離はおよそ8メートル、と日本側は書いている。"}, {"t": 343.21666666666664, "x": "……8メートル。"}, {"t": 344.21666666666664, "x": "ただし、これは日本側がまとめた事実だ。"}, {"t": 346.8833333333333, "x": "兵士の言い分は、また違う。それはあとで並べる。"}, {"t": 350.55, "x": "でも、薬莢を撃つってどういうこと？"}, {"t": 352.8333333333333, "x": "仕組みを先に話しておく。"}, {"t": 354.55, "x": "兵士の銃には、グレネードランチャーが付いていた。"}, {"t": 357.4166666666667, "x": "グレネード……手りゅう弾？"}, {"t": 359.0, "x": "そうだ。手りゅう弾を遠くへ飛ばすための筒だ。"}, {"t": 361.81666666666666, "x": "銃の先にかぶせるように付ける。"}, {"t": 363.78333333333336, "x": "飛ばすときは弾の入っていない空砲を撃つ。"}, {"t": 366.31666666666666, "x": "空砲のガスの力で筒の中の物が飛んでいく。"}, {"t": 369.3333333333333, "x": "兵士はその筒に撃ち終えた薬莢を入れた。"}, {"t": 371.81666666666666, "x": "そして空砲を撃った。"}, {"t": 373.3, "x": "じゃあ、薬莢が弾の代わりに飛んだのね。"}, {"t": 375.9, "x": "そういうことだ。"}, {"t": 376.9166666666667, "x": "アメリカの最高裁判所の判決にも\n同じことが書いてある。"}, {"t": 380.43333333333334, "x": "30口径の撃ち終えた薬莢を筒に入れた。"}, {"t": 383.0833333333333, "x": "空砲を撃ってそれを飛ばした。"}, {"t": 384.8, "x": "アメリカ軍自身も、この撃ち方は\n認められていないと言っている。"}, {"t": 388.48333333333335, "x": "小隊長も、上の者が見ていたら\n止めたはずだと述べた。"}, {"t": 392.03333333333336, "x": "アメリカ軍の中でも、だめなことだったのね。"}, {"t": 394.9166666666667, "x": "そうだ。"}, {"t": 395.55, "x": "薬莢は女性の背中に入った。"}, {"t": 397.6, "x": "翌日、群馬大学で解剖がおこなわれている。"}, {"t": 400.5833333333333, "x": "薬莢は体の中に残っていて、大動脈を傷つけていた。"}, {"t": 404.4, "x": "出血が多くその場で亡くなったと説明された。"}, {"t": 407.48333333333335, "x": "……薬莢一つで。"}, {"t": 408.76666666666665, "x": "一つでだ。"}, {"t": 409.6333333333333, "x": "ここがこの事件の分かりにくいところだ。"}, {"t": 411.96666666666664, "x": "本物の弾ではない。だが人は、亡くなっている。"}, {"t": 415.01666666666665, "x": "殺すつもりがあったのか。"}, {"t": 416.6, "x": "脅かすつもりだったのか。"}, {"t": 418.2, "x": "ふざけていただけなのか。"}, {"t": 419.71666666666664, "x": "この三つの違いがあとで裁判の中心になる。"}, {"t": 423.1333333333333, "x": "届け出たのはその場にいた人たちだった。"}, {"t": 425.6166666666667, "x": "高崎警察署と渋川警察署から係員が向かった。"}, {"t": 429.28333333333336, "x": "その日のうちに目撃した人の話を聞き始めている。"}, {"t": 432.8, "x": "でも、撃った兵士が誰か分かってたの？"}, {"t": 435.31666666666666, "x": "分かっていない。アメリカ兵は大勢いた。"}, {"t": 437.6666666666667, "x": "顔を見ても名前までは分からない。"}, {"t": 439.5833333333333, "x": "そこで2月1日、警察はアメリカ軍に頼んだ。"}, {"t": 442.81666666666666, "x": "その日の演習に出ていた兵士を集めてほしい、と。"}, {"t": 445.81666666666666, "x": "集まったのは三十数人だった。"}, {"t": 447.9, "x": "目撃した5人がその顔を一人ずつ見ていった。"}, {"t": 450.95, "x": "首実検ってやつね。"}, {"t": 452.53333333333336, "x": "そうだ。群馬県警の刑事部長も立ち会っている。"}, {"t": 455.51666666666665, "x": "その中から一人が確かめられた。"}, {"t": 457.73333333333335, "x": "それがウィリアム・S・ジラードという兵士だ。"}, {"t": 459.98333333333335, "x": "階級は三等特技兵。"}, {"t": 461.76666666666665, "x": "その場で認めたの？"}, {"t": 463.2, "x": "認めていない。その日はずっと否定していた。"}, {"t": 465.9, "x": "本人に直接話を聞くのはアメリカ軍の捜査官だった。"}, {"t": 469.55, "x": "日本の警察は、目撃した人の話を集める。"}, {"t": 472.8833333333333, "x": "その結果を両方で突き合わせていった。"}, {"t": 475.2, "x": "そして2月4日、本人が一部を認めた。"}, {"t": 478.21666666666664, "x": "一部？"}, {"t": 478.93333333333334, "x": "本人の説明はこうだ。"}, {"t": 480.51666666666665, "x": "脅かすために上へ向けて撃った。"}, {"t": 482.53333333333336, "x": "上に撃ったのに、背中に当たるの？"}, {"t": 484.75, "x": "警察もそこに納得していなかった。"}, {"t": 487.1166666666667, "x": "自供だけでは分からない点が\n多いと国会で答えている。"}, {"t": 490.3333333333333, "x": "同じ持ち場にいた兵士もはじめは\n何も知らないと言っていた。"}, {"t": 493.73333333333335, "x": "アメリカの宣誓書には、二人とも\n話を少しずつ変えたとある。"}, {"t": 497.5833333333333, "x": "この食い違いは最後の判決まで残ることになる。"}, {"t": 501.21666666666664, "x": "もう一人、この事件の鍵をにぎる人がいる。"}, {"t": 503.96666666666664, "x": "ジラードと一緒に、機関銃の見張りを\n命じられた兵士だ。"}, {"t": 507.46666666666664, "x": "同じ場所に、もう一人いたのね。"}, {"t": 509.65, "x": "いた。この人の話は、時期に\nよって大きく変わっている。"}, {"t": 513.2166666666667, "x": "アメリカの宣誓書に、順番に書かれているんだ。"}, {"t": 516.15, "x": "1回目は、何も知らないという答えだった。"}, {"t": 519.0, "x": "見てないってこと？"}, {"t": 520.2666666666667, "x": "そうだ。だが、2回目には見たと言い出した。"}, {"t": 523.0166666666667, "x": "ジラードに言われて、薬莢を投げたという。"}, {"t": 525.4333333333333, "x": "拾いに来た人の頭の上を\n撃って、脅かすためだった、と。"}, {"t": 529.1333333333333, "x": "そして、ジラードは腰に銃を\n当てて撃ったと話している。"}, {"t": 532.5166666666667, "x": "最初は、なんで知らないって言ったの？"}, {"t": 534.85, "x": "本人の言葉がそのまま残っている。"}, {"t": 537.1166666666667, "x": "自分はジラードの友だちだと思っている。"}, {"t": 539.5, "x": "見たと言えば、彼を\n裏切ることになる。だから、うそをついた。"}, {"t": 543.2333333333333, "x": "……友だちをかばったのね。"}, {"t": 544.85, "x": "3回目は、本人から申し出て話している。"}, {"t": 547.6666666666666, "x": "ジラードに頼まれて、人を近くへ\n呼ぶために薬莢を集めた。"}, {"t": 551.3666666666667, "x": "穴の中から投げると、もう少し近くへ、と言われた。"}, {"t": 554.7166666666667, "x": "ジラードは手まねきして、ダイジョウブと言った。"}, {"t": 557.2833333333333, "x": "撃ったときは、立って肩に銃を当てていた。"}, {"t": 559.8, "x": "あとで聞かれたら、腰で撃ったと言え、と言われた。"}, {"t": 562.8166666666667, "x": "話が、どんどん重くなっていくわね。"}, {"t": 565.2666666666667, "x": "ただ、これは一人の兵士の話だ。"}, {"t": 567.6333333333333, "x": "ジラードの側は、薬莢を投げろと\n言った覚えはないと話している。"}, {"t": 571.35, "x": "宣誓書も、薬莢を投げたと認めたのは\n同僚だけだと書いている。"}, {"t": 575.2666666666667, "x": "どの話を信じるかは、\n日本の法廷が決めることになった。"}, {"t": 579.5333333333333, "x": "ここから話が大きくなっていく。"}, {"t": 581.6, "x": "2月7日、アメリカ側が一枚の証明書を出した。"}, {"t": 584.8833333333333, "x": "出したのは兵士が所属する中隊の隊長だ。"}, {"t": 587.7333333333333, "x": "あの兵士は公務中だった、という証明だ。"}, {"t": 590.3333333333334, "x": "文面も宣誓書に残っている。"}, {"t": 592.3, "x": "機関銃と装備の見張りを命じられていた。"}, {"t": 594.7666666666667, "x": "見張りの最中に、警告として薬莢を撃った。"}, {"t": 597.6666666666666, "x": "それが入ってきた女性に当たった。"}, {"t": 599.85, "x": "警告として、ね。"}, {"t": 601.3833333333333, "x": "そして最後にこうある。"}, {"t": 602.7833333333333, "x": "反対の証拠があるとすぐに\n知らせない限り、アメリカが裁く。"}, {"t": 606.5666666666667, "x": "公務中だったら、どうなるの？"}, {"t": 608.55, "x": "当時、日本とアメリカの間には行政協定があった。"}, {"t": 611.8333333333334, "x": "日本にいるアメリカ兵の扱いを決めた約束だ。"}, {"t": 614.7666666666667, "x": "その17条に、裁判をする国の決め方が書いてある。"}, {"t": 618.25, "x": "仕事の最中に起きたことならまずアメリカが裁く。"}, {"t": 621.3, "x": "それ以外のことならまず日本が裁く。"}, {"t": 623.6833333333333, "x": "だから、公務中かどうかが大事なのね。"}, {"t": 626.3, "x": "そうだ。公務中なら日本の法廷には来ない。"}, {"t": 629.05, "x": "アメリカ軍の中の裁判で話が終わる。"}, {"t": 631.5333333333333, "x": "2日後の2月9日、前橋地方検察庁が返事を出した。"}, {"t": 635.6666666666666, "x": "調べた結果、反対の証拠がある、と。"}, {"t": 638.4333333333333, "x": "すぐに言い返したのね。"}, {"t": 639.9833333333333, "x": "ここから二つの国の言い分がぶつかる。"}, {"t": 642.3666666666667, "x": "アメリカ側は、見張りの最中だったから仕事だと言う。"}, {"t": 645.6, "x": "日本側は、部隊が休んでいたと言う。"}, {"t": 647.95, "x": "それに薬莢を飛ばすことは見張りの仕事ではない。"}, {"t": 650.7666666666667, "x": "国会では、アメリカ陸軍の通達まで読み上げられた。"}, {"t": 654.05, "x": "公務の時間だからといって、\n公務をしているとは限らない。"}, {"t": 657.4, "x": "アメリカ軍が自分で出した決まりだ。"}, {"t": 660.1666666666666, "x": "この事件は、国会で何度も取り上げられた。"}, {"t": 662.8833333333333, "x": "会議録をこちらで数えてみた。"}, {"t": 664.8166666666667, "x": "1957年から1959年までの3年間。"}, {"t": 668.8166666666667, "x": "相馬ヶ原かジラードの名前が出てくる発言。"}, {"t": 671.5333333333333, "x": "それが290を超えていた。"}, {"t": 673.5666666666667, "x": "290？"}, {"t": 674.6666666666666, "x": "重なりを除いて294だ。"}, {"t": 676.8833333333333, "x": "2月だけでも内閣委員会と法務委員会と予算委員会。"}, {"t": 680.3666666666667, "x": "衆議院でも参議院でも毎日のように出ている。"}, {"t": 683.1166666666667, "x": "2月7日、当時の首相代理だった岸信介が答えている。"}, {"t": 687.0, "x": "アメリカ軍の側に特に\n注意してもらわねばならない点がある。"}, {"t": 690.4833333333333, "x": "2月8日の夕方には、\nアメリカの代理大使が岸に会いに来た。"}, {"t": 694.3833333333333, "x": "遺憾の意を伝え、軍に厳しく\n注意させると約束したという。"}, {"t": 698.25, "x": "アメリカも、あやまってはいたのね。"}, {"t": 700.4166666666666, "x": "あやまってはいた。だが裁判を\nどちらがするかは別の話だ。"}, {"t": 704.0, "x": "米兵が起こした事件は、それまでにもたくさんあった。"}, {"t": 707.2, "x": "予算委員会では、ある議員が数字を挙げている。"}, {"t": 709.95, "x": "役所の書類だけでも死傷の事件は\n年々増えている、と。"}, {"t": 713.4833333333333, "x": "この事件だけじゃないのね。"}, {"t": 715.2166666666667, "x": "そうだ。だからこそこの1件にみんなが目を向けた。"}, {"t": 718.2833333333333, "x": "日本が裁けるのかどうか。"}, {"t": 719.9333333333333, "x": "ここで裁けなければこの先も同じことになる。"}, {"t": 722.7166666666667, "x": "議員たちはそう考えていた。"}, {"t": 724.4666666666667, "x": "国の担当の役所は、補償の話もしている。"}, {"t": 727.4833333333333, "x": "遺族の家を訪ね、手続きのことを説明したという。"}, {"t": 730.7, "x": "補償の決まりは行政協定の18条にある。"}, {"t": 733.4666666666667, "x": "公務中なら日本政府が払い、\n公務外なら別の扱いになる。"}, {"t": 737.4333333333333, "x": "お金のほうも、公務中かどうかで変わるのね。"}, {"t": 740.2666666666667, "x": "変わる。裁判もお金も一枚の証明書で変わってしまう。"}, {"t": 744.35, "x": "話し合いの場は、日米合同委員会だった。"}, {"t": 747.1166666666667, "x": "その下に裁判のことを話す分科委員会がある。"}, {"t": 750.2, "x": "委員会のさらに小さい会ね。"}, {"t": 752.15, "x": "そうだ。日本側は、2月16日にこの件を持ち込んだ。"}, {"t": 755.95, "x": "アメリカ側がそれを受けたのは3月7日。"}, {"t": 758.65, "x": "受けるだけで3週間？"}, {"t": 760.2166666666667, "x": "かかっている。話し合いが始まったのは3月12日だ。"}, {"t": 763.7333333333333, "x": "アメリカ側は、陸海空の三つの軍と憲兵で7人。"}, {"t": 767.2, "x": "日本側は、事務の職員も入れて12人か13人。"}, {"t": 770.55, "x": "このときのやり取りが宣誓書に残っている。"}, {"t": 773.1166666666667, "x": "アメリカ側が聞いた。"}, {"t": 774.4166666666666, "x": "彼は見張りの最中だった。それは認めるか。"}, {"t": 777.25, "x": "日本側が答えた。"}, {"t": 778.6, "x": "見張りの最中だったことは認める。"}, {"t": 780.75, "x": "だが撃ったことは見張りとは関係がない。"}, {"t": 783.1833333333333, "x": "認めるところは認めるのね。"}, {"t": 785.1, "x": "アメリカ側は続けた。"}, {"t": 786.5833333333334, "x": "本人は機関銃を守るために脅かしたと言っている。"}, {"t": 789.65, "x": "その言い分を信じるなら公務になるのではないか。"}, {"t": 792.3833333333333, "x": "日本側の答えはこうだ。"}, {"t": 794.0, "x": "その質問は、証拠に\n支えられていない仮定に立っている。"}, {"t": 797.4333333333333, "x": "答える用意はない。"}, {"t": 798.7166666666667, "x": "……強いわね。"}, {"t": 799.65, "x": "日本側は、薬莢を拾う人は機関銃の\nじゃまをしていないと言った。"}, {"t": 803.6666666666666, "x": "同じ持ち場の兵士もそう話している、とも言った。"}, {"t": 806.65, "x": "日本側は、早く次の会を開いてほしいと頼んだ。"}, {"t": 809.9666666666667, "x": "アメリカ側は、陸海空の軍や参謀と\n話し合う時間がほしいと答えた。"}, {"t": 814.35, "x": "こうして、話し合いは5月まで続いた。"}, {"t": 816.8333333333334, "x": "事件から数えて、3か月半になる。"}, {"t": 819.4166666666666, "x": "そのあいだ兵士は、アメリカ軍の中にいた。"}, {"t": 822.6833333333333, "x": "5月16日。ようやく結論が出た。"}, {"t": 825.3, "x": "その日の夕方、法務大臣が参議院で報告している。"}, {"t": 828.7833333333333, "x": "兵士は日本の裁判を受けることになった。"}, {"t": 831.4333333333333, "x": "日本が勝ったってこと？"}, {"t": 833.0333333333333, "x": "そこが少し違う。"}, {"t": 834.35, "x": "委員長がその場で聞き返しているんだ。"}, {"t": 836.6333333333333, "x": "アメリカ側はまだ自分に\n裁判権があると思っているのでは、と。"}, {"t": 840.2666666666667, "x": "答えたのは日本側の担当者だった。"}, {"t": 842.65, "x": "アメリカ側は、自分に\n裁判権があるという見方を捨てていない。"}, {"t": 846.35, "x": "そのうえで、自分からは裁判をしないと通知してきた。"}, {"t": 849.7333333333333, "x": "……つまり、どういうこと？"}, {"t": 851.2333333333333, "x": "たとえるならこうだ。"}, {"t": 852.4166666666666, "x": "本当は自分の番だが、今回は順番をゆずる。"}, {"t": 855.4166666666666, "x": "自分の番だという考えはそのまま持っておく。"}, {"t": 858.2166666666667, "x": "ずるい言い方ね。"}, {"t": 859.4166666666666, "x": "日本側も日本の番だという考えを変えていない。"}, {"t": 862.2666666666667, "x": "どちらも自分の見方を残したまま結論だけを出した。"}, {"t": 865.6, "x": "その形は、文書にもはっきり書いたという。"}, {"t": 868.3, "x": "行政協定の17条には、そのための決まりがあった。"}, {"t": 871.7333333333333, "x": "先に裁く権利がある国は、\n裁かないと決めたら相手に知らせる。"}, {"t": 875.6666666666666, "x": "その決まりを使った。"}, {"t": 877.2, "x": "委員長は納得したの？"}, {"t": 878.8833333333333, "x": "法務大臣は、こう言っている。"}, {"t": 880.7333333333333, "x": "若干割り切れない点はある。"}, {"t": 882.4166666666666, "x": "ただ裁判がこれ以上遅れるのはよくない、と。"}, {"t": 885.05, "x": "この割り切れない点があとで大きくなる。"}, {"t": 887.2666666666667, "x": "裁判権は、渡った。だが何と引き換えだったのか。"}, {"t": 891.2833333333333, "x": "結論から2日後の5月18日。"}, {"t": 893.7666666666667, "x": "前橋地方検察庁が前橋地方裁判所に起訴した。"}, {"t": 897.2833333333333, "x": "罪名は傷害致死だ。"}, {"t": 898.9, "x": "殺人じゃないの？"}, {"t": 900.1833333333333, "x": "そこでまた議論になった。"}, {"t": 901.7666666666667, "x": "野党の議員たちは殺人罪で告発していた。"}, {"t": 904.65, "x": "呼び寄せてうしろから撃った。"}, {"t": 906.1333333333333, "x": "殺意がある、という主張だ。"}, {"t": 907.9833333333333, "x": "検察の考えは違った。"}, {"t": 909.75, "x": "傷つけるつもりで撃ち、その結果人が亡くなった。"}, {"t": 912.8666666666667, "x": "だから傷害致死になる。"}, {"t": 914.5333333333333, "x": "殺人と傷害致死って、何が違うの？"}, {"t": 917.3333333333334, "x": "死なせるつもりがあったかどうかだ。"}, {"t": 919.2833333333333, "x": "殺人なら死刑まである。"}, {"t": 920.8833333333333, "x": "傷害致死は、刑法の205条。"}, {"t": 923.1333333333333, "x": "当時は2年以上の懲役で、いちばん重くて15年だった。"}, {"t": 926.8666666666667, "x": "ずいぶん差があるのね。"}, {"t": 928.2666666666667, "x": "ある。だから罪名が大事になる。"}, {"t": 930.3, "x": "国会でもなぜ殺人で\n起訴しないのかと何度も聞かれた。"}, {"t": 933.7166666666667, "x": "そして身柄のことも聞かれている。"}, {"t": 935.8666666666667, "x": "日本の刑務所に入ったの？"}, {"t": 937.7333333333333, "x": "入っていない。熊谷のキャンプに預けたままだ。"}, {"t": 940.5666666666667, "x": "法務省は、裁判には差し支えないと答えている。"}, {"t": 943.6666666666666, "x": "判決が決まればすぐ日本の刑務所で刑を受けさせる。"}, {"t": 946.85, "x": "そう説明していた。"}, {"t": 948.1666666666666, "x": "この説明が半年後にどうなったか。"}, {"t": 950.4666666666667, "x": "それはもう少しあとで話す。"}, {"t": 952.9166666666666, "x": "同じ5月18日にもう一つの決定が出ている。"}, {"t": 956.1, "x": "静岡県の東富士演習場の件だ。"}, {"t": 958.75, "x": "別の事件？"}, {"t": 959.7833333333333, "x": "別の事件だ。だがよく似ている。"}, {"t": 961.9, "x": "アメリカ兵がやはり薬莢を撃った。"}, {"t": 963.9166666666666, "x": "それで日本人の女性がけがをしている。"}, {"t": 966.35, "x": "また薬莢……。"}, {"t": 967.3166666666667, "x": "この件は、アメリカ軍の中で裁判が開かれた。"}, {"t": 970.45, "x": "1956年10月26日。"}, {"t": 973.0166666666667, "x": "判決は、無罪だった。"}, {"t": 974.9, "x": "無罪なの？"}, {"t": 975.8333333333334, "x": "理由は明らかにされていない。"}, {"t": 977.55, "x": "日本の法務省も国会でそう答えている。"}, {"t": 980.0833333333334, "x": "日本の検察が引き渡しを求めたとき、\n兵士はもう帰国していた。"}, {"t": 984.2833333333333, "x": "そして5月18日、日本側は起訴しないと決めた。"}, {"t": 987.7666666666667, "x": "起訴猶予という扱いだ。"}, {"t": 989.4833333333333, "x": "同じ日に、片方は起訴して\n片方は起訴しなかったのね。"}, {"t": 993.2, "x": "そうなる。"}, {"t": 993.9, "x": "法務省の担当者は、こう説明している。"}, {"t": 996.55, "x": "薬莢を撃つようなことが公務であるはずがない。"}, {"t": 999.1166666666667, "x": "そう考えて、引き渡しを求めた。"}, {"t": 1001.45, "x": "だが本人は、もう日本にいなかった。"}, {"t": 1003.9166666666666, "x": "……間に合わなかったのね。"}, {"t": 1005.4, "x": "相馬ヶ原の事件がもし同じ道をたどっていたら。"}, {"t": 1008.3833333333333, "x": "アメリカ軍の中で裁かれ、\n帰国して終わっていたかもしれない。"}, {"t": 1012.0333333333333, "x": "議員たちが必死になった理由は、ここにもある。"}, {"t": 1015.4666666666667, "x": "日本で起訴が決まると、今度は\nアメリカで騒ぎになった。"}, {"t": 1018.9166666666666, "x": "アメリカで？"}, {"t": 1019.8333333333334, "x": "アメリカの兵士を外国の法廷に出すのか。"}, {"t": 1022.4666666666667, "x": "そういう反発だ。"}, {"t": 1023.7, "x": "兵士の側は、アメリカの裁判所に訴えを起こした。"}, {"t": 1026.8833333333334, "x": "日本に引き渡されないように、という訴えだ。"}, {"t": 1029.6333333333334, "x": "ワシントンの連邦地方裁判所は、\nその訴えの一部を認めた。"}, {"t": 1033.5166666666667, "x": "日本への引き渡しを差し止めたんだ。"}, {"t": 1035.8333333333333, "x": "止まっちゃったの？"}, {"t": 1037.0166666666667, "x": "いったん止まった。"}, {"t": 1038.1333333333334, "x": "日本の国会でも7月に心配する声が出ている。"}, {"t": 1041.2833333333333, "x": "裁判の準備はできているのに始められない、と。"}, {"t": 1044.1333333333334, "x": "アメリカ政府は、すぐに最高裁判所へ持ち込んだ。"}, {"t": 1047.2666666666667, "x": "国務長官と国防長官も連名で声明を出した。"}, {"t": 1050.4666666666667, "x": "この件は、日本と決めたことを\n守るかどうかの問題だ、と。"}, {"t": 1054.1833333333334, "x": "1957年7月11日。"}, {"t": 1056.7166666666667, "x": "アメリカの最高裁判所が判断を出した。"}, {"t": 1059.5, "x": "どうなったの？"}, {"t": 1060.5333333333333, "x": "引き渡しを止める理由は無いという判断だ。"}, {"t": 1063.0833333333333, "x": "裁判権を相手に渡す決まりは\n憲法にも法律にも反しない。"}, {"t": 1066.8, "x": "こうして、日本で裁判ができることになった。"}, {"t": 1069.75, "x": "アメリカの最高裁までいったのね。"}, {"t": 1071.9333333333334, "x": "いった。事件名は、ウィルソン対ジラード。"}, {"t": 1074.5666666666666, "x": "いまでもアメリカの法律の本に載っている判例だ。"}, {"t": 1077.4833333333333, "x": "同じころアメリカの上院議員の発言も伝わってきた。"}, {"t": 1080.8, "x": "日本で裁けば厳しい罰にはしない。"}, {"t": 1083.05, "x": "そういう大体の了解がある、という話だ。"}, {"t": 1085.8333333333333, "x": "……え、それって。"}, {"t": 1086.9666666666667, "x": "日本の国会でもすぐに取り上げられた。"}, {"t": 1089.95, "x": "1957年7月8日。"}, {"t": 1092.1833333333334, "x": "参議院の内閣委員会だ。"}, {"t": 1094.05, "x": "議員が法務省にはっきり聞いた。"}, {"t": 1096.0, "x": "5月16日に結論を出すとき何か言われていないか。"}, {"t": 1099.45, "x": "裁判権は渡す、その代わり適当にやってくれ。"}, {"t": 1102.55, "x": "そういう話が少しでも出ていないか、と。"}, {"t": 1105.25, "x": "ずいぶんまっすぐ聞いたのね。"}, {"t": 1106.9833333333333, "x": "はっきりさせないと疑いを招く、と前置きしている。"}, {"t": 1110.0666666666666, "x": "答えたのは交渉に出ていた日本側の担当者だ。"}, {"t": 1113.1, "x": "裁判の中身や結果の話は、まったくしていない。"}, {"t": 1116.3, "x": "裁判の中身について、申し入れを\n受けたことは一度もない。"}, {"t": 1119.9, "x": "一度もない、ね。"}, {"t": 1121.2, "x": "アメリカ軍は、日本の裁判を\n信頼しているとも言っている。"}, {"t": 1124.6333333333334, "x": "この答えはこの先ずっと日本政府の答えになる。"}, {"t": 1127.65, "x": "39年後の国会でもこの日の答弁が\n引かれることになる。"}, {"t": 1131.5333333333333, "x": "じゃあ、上院議員の話は何だったの？"}, {"t": 1134.0833333333333, "x": "質問した議員も正確な言葉までは\n分からないと言っている。"}, {"t": 1137.5833333333333, "x": "本人の見通しを言っただけなのかもしれない。"}, {"t": 1140.1333333333334, "x": "この時点では、確かめる方法がなかった。"}, {"t": 1142.8333333333333, "x": "アメリカ政府の中の書類は、まだ誰も見ていない。"}, {"t": 1145.95, "x": "見られるようになるのは、いつ？"}, {"t": 1147.8666666666666, "x": "それはあとで話す。"}, {"t": 1149.1166666666666, "x": "先に裁判がどう進んだかを見ておこう。"}, {"t": 1152.1333333333334, "x": "初公判は、1957年8月26日。"}, {"t": 1155.8833333333334, "x": "前橋地方裁判所の第一法廷だ。"}, {"t": 1158.2833333333333, "x": "この裁判のために、法廷では\nいろいろな準備がされた。"}, {"t": 1161.6666666666667, "x": "準備？"}, {"t": 1162.3833333333334, "x": "夏の法廷に100人近くが入る。"}, {"t": 1164.6333333333334, "x": "それで天井に扇風機が3台つるされた。"}, {"t": 1167.25, "x": "日本語と英語の通訳が2人ずつ。"}, {"t": 1169.4666666666667, "x": "法廷の中と外には、警備の人がたくさん立った。"}, {"t": 1172.85, "x": "まるでお祭りね。"}, {"t": 1174.0666666666666, "x": "記者も大勢つめかけていた。"}, {"t": 1175.8, "x": "日本の裁判がアメリカからも見られていたわけだ。"}, {"t": 1178.6333333333334, "x": "裁判官は3人。"}, {"t": 1179.9333333333334, "x": "検察官と弁護人もそれぞれ3人ずつ並んだ。"}, {"t": 1183.0, "x": "弁護には、アメリカ軍の法務の将校も加わっている。"}, {"t": 1186.3333333333333, "x": "ジラードは、どんな様子だったの？"}, {"t": 1188.45, "x": "のりのきいた制服で座っていたと伝えられている。"}, {"t": 1191.3333333333333, "x": "判決まで公判は13回。"}, {"t": 1193.2666666666667, "x": "現場での検証も3回おこなわれた。"}, {"t": 1195.5666666666666, "x": "検察は冒頭でこう述べたと国会で紹介されている。"}, {"t": 1198.7666666666667, "x": "兵士は薬莢を投げ与え、拾ってよいと呼び寄せた。"}, {"t": 1201.85, "x": "拾うと追い返してうしろから撃った。"}, {"t": 1204.0333333333333, "x": "それって、わざとじゃないの？"}, {"t": 1205.8333333333333, "x": "検察はそう主張した。"}, {"t": 1207.4166666666667, "x": "弁護側は、まったく違う話をした。"}, {"t": 1209.95, "x": "見張りの命令どおり入ってきた\n人を脅かすために撃った。"}, {"t": 1213.2, "x": "それがたまたま当たってしまった。"}, {"t": 1215.0666666666666, "x": "公務中の正当な行いなので、罪にはならない。"}, {"t": 1218.2166666666667, "x": "同じ場面で、こんなに話が違うのね。"}, {"t": 1220.9333333333334, "x": "違う。その違いを決めるのが次の数字だ。"}, {"t": 1224.2833333333333, "x": "撃った場所と当たった場所。"}, {"t": 1225.8333333333333, "x": "その距離が裁判で大きな争いになった。"}, {"t": 1228.45, "x": "距離で何が変わるの？"}, {"t": 1229.9166666666667, "x": "近ければ、狙って撃ったと考えやすい。"}, {"t": 1232.4333333333334, "x": "遠ければたまたま当たったと考えやすい。"}, {"t": 1234.7666666666667, "x": "国会で紹介された数字はこうだ。"}, {"t": 1236.95, "x": "一緒にいた村の男性は、7メートルか8メートル。"}, {"t": 1240.1333333333334, "x": "ジラード本人は、20数メートル。"}, {"t": 1242.4666666666667, "x": "3倍くらい違うじゃない。"}, {"t": 1244.1, "x": "違う。アメリカの宣誓書にも数字が並んでいる。"}, {"t": 1247.0666666666666, "x": "本人は一度歩いて測り、29フィートだったという。"}, {"t": 1250.3166666666666, "x": "9メートルほどだ。"}, {"t": 1251.5166666666667, "x": "別のときには20ヤードから30ヤードと言っている。"}, {"t": 1254.65, "x": "自分でも、言うことが変わってるのね。"}, {"t": 1257.05, "x": "そうだ。そしてもう一人の証人がいた。"}, {"t": 1259.5833333333333, "x": "同じ持ち場で見張りをしていた兵士だ。"}, {"t": 1261.95, "x": "アメリカ軍の人が証言したの？"}, {"t": 1264.15, "x": "した。この人の証言は、いちばん注目された。"}, {"t": 1267.3333333333333, "x": "法廷では、距離は16メートルと話した。"}, {"t": 1270.0, "x": "現場の検証で構え方も聞かれている。"}, {"t": 1272.4333333333334, "x": "答えは肩に銃を当てて立っていた。"}, {"t": 1274.6333333333334, "x": "肩に当てたら……狙ってるみたいに見えるわね。"}, {"t": 1277.4, "x": "当時の地元紙は、まわりから声がもれたと書いている。"}, {"t": 1280.55, "x": "本人の説明は、腰に当てて\n頭の上をこえるように撃った、だ。"}, {"t": 1284.4833333333333, "x": "当たると人がけがをするとは\n思わなかった、とも言っている。"}, {"t": 1287.85, "x": "裁判所は、距離を10メートル前後と決めた。"}, {"t": 1290.6666666666667, "x": "近いほうの数字に近いのね。"}, {"t": 1292.65, "x": "そうだ。ここまでは検察の言い分に近い。"}, {"t": 1295.2333333333333, "x": "だが判決は、その先で分かれた。"}, {"t": 1297.5666666666666, "x": "狙って撃ったという点は、認めなかったんだ。"}, {"t": 1300.9166666666667, "x": "1957年10月31日。"}, {"t": 1303.5833333333333, "x": "検察が刑を求めた。"}, {"t": 1305.2333333333333, "x": "傷害致死で懲役5年。"}, {"t": 1306.8333333333333, "x": "当時の地元紙によると、論告の文は1万5千字あった。"}, {"t": 1310.65, "x": "長いわね。"}, {"t": 1311.6, "x": "そして11月19日。"}, {"t": 1313.2333333333333, "x": "13回目の公判で判決が言い渡された。"}, {"t": 1316.0833333333333, "x": "懲役3年。執行猶予4年。"}, {"t": 1318.3166666666666, "x": "執行猶予って、刑務所に入らなくていいってこと？"}, {"t": 1321.5333333333333, "x": "そうだ。4年のあいだ何も\n起こさなければ、刑は受けずに済む。"}, {"t": 1325.2166666666667, "x": "判決の中身を法務大臣が国会でまとめている。"}, {"t": 1328.3333333333333, "x": "まず日本に裁判権がある。"}, {"t": 1330.0833333333333, "x": "次に公務の最中の行いとは認められない。"}, {"t": 1332.8166666666666, "x": "だから正当な仕事だったという\n弁護側の主張は通らない。"}, {"t": 1336.2333333333333, "x": "殺すつもりはなかった。"}, {"t": 1337.7333333333333, "x": "だが傷つけるつもりはあった。"}, {"t": 1339.5, "x": "だから傷害致死にあたる。"}, {"t": 1341.2333333333333, "x": "検察の言い分がほとんど通ったのね。"}, {"t": 1343.65, "x": "事実の認め方は、ほぼ\n検察のとおりだと大臣も言っている。"}, {"t": 1347.4666666666667, "x": "違ったのは、狙ったかどうかと刑の重さだ。"}, {"t": 1350.2333333333333, "x": "大臣はこうも言っている。"}, {"t": 1351.7166666666667, "x": "傷害致死の事件で\n執行猶予がつくことはそう珍しくない。"}, {"t": 1355.4333333333334, "x": "でも、5年を求めて3年に猶予ね……。"}, {"t": 1358.0166666666667, "x": "国会では、軽すぎるという声が強かった。"}, {"t": 1360.7666666666667, "x": "一方であの程度が適当だという\n声もあった、と大臣は言う。"}, {"t": 1364.3166666666666, "x": "裁判官には、厳しい罰を求める\n手紙が届いていたという。"}, {"t": 1367.9833333333333, "x": "判決の重さをここで良い悪いと決めるつもりはない。"}, {"t": 1370.95, "x": "ただ、このあと検察がどうしたかは見ておきたい。"}, {"t": 1374.4666666666667, "x": "判決に不服なら、検察は控訴できる。"}, {"t": 1377.2, "x": "期限は2週間だ。"}, {"t": 1378.6333333333334, "x": "検察も軽いと思ってたなら、控訴するわよね？"}, {"t": 1381.75, "x": "多くの人がそう思っていた。"}, {"t": 1383.5, "x": "群馬では、控訴を求める県民大会まで開かれている。"}, {"t": 1386.9333333333334, "x": "だが検察は、期限の最後の日に決めた。"}, {"t": 1389.65, "x": "12月3日。控訴はしない。"}, {"t": 1391.8166666666666, "x": "しないの？"}, {"t": 1392.65, "x": "12月13日の国会で法務大臣がその理由を説明した。"}, {"t": 1396.6666666666667, "x": "判決は、事実の認め方では検察の主張を認めている。"}, {"t": 1400.5, "x": "刑は検察から見ても軽いと感じている。"}, {"t": 1403.0333333333333, "x": "だが二審で争って、望む結果になる確信が持てない。"}, {"t": 1406.6666666666667, "x": "……軽いと思ってるのに、やめたのね。"}, {"t": 1408.95, "x": "議員はなぜ最後の日まで延ばしたのかと聞いた。"}, {"t": 1411.65, "x": "何か外から圧力があったのではないか、と。"}, {"t": 1414.4, "x": "大臣はこう答えている。"}, {"t": 1415.9333333333334, "x": "最後の日まで慎重に研究を続けた。"}, {"t": 1418.4333333333334, "x": "私の関わる限り、外からの発言は何も受けていない。"}, {"t": 1422.2166666666667, "x": "また、受けていない、ね。"}, {"t": 1423.9833333333333, "x": "そうだ。7月の答えと同じ形をしている。"}, {"t": 1426.9, "x": "控訴がないので、判決はそのまま確定した。"}, {"t": 1429.8833333333334, "x": "そして12月6日。"}, {"t": 1431.3833333333334, "x": "ジラードは、日本人の妻と\n一緒に横浜港から船に乗った。"}, {"t": 1435.2333333333333, "x": "アメリカへ帰ったんだ。"}, {"t": 1436.7166666666667, "x": "判決から何日？"}, {"t": 1438.2166666666667, "x": "11月19日から数えて17日だ。"}, {"t": 1441.0333333333333, "x": "執行猶予は、日本で何も起こさなければ済む刑だ。"}, {"t": 1444.2666666666667, "x": "国を出てしまえば、その条件は\nほとんど意味を持たない。"}, {"t": 1447.4333333333334, "x": "国会でも議員がそこを指摘している。"}, {"t": 1449.7333333333333, "x": "日本の刑務所で、という\n5月の説明は使われずに終わった。"}, {"t": 1454.0166666666667, "x": "亡くなった方の家族には、何かあったの？"}, {"t": 1456.8, "x": "補償の話は、国会で何度も出ている。"}, {"t": 1459.3833333333334, "x": "行政協定の18条に基づく補償だ。"}, {"t": 1462.0666666666666, "x": "額は60数万円と国会で言われている。"}, {"t": 1464.8333333333333, "x": "それって、多いの？"}, {"t": 1466.2166666666667, "x": "ここで比べるための確かな物差しは持っていない。"}, {"t": 1469.1, "x": "ただ議員は、こう言っている。"}, {"t": 1470.7333333333333, "x": "これは決まりの中の上限にすぎない。"}, {"t": 1472.95, "x": "亡くなったことに見合う額とは言えない、と。"}, {"t": 1475.5166666666667, "x": "……決まりの中の、上限なのね。"}, {"t": 1477.6666666666667, "x": "裁判の途中には、アメリカの下院で動きもあった。"}, {"t": 1480.7666666666667, "x": "ある議員が見舞金を出す法案を出した。"}, {"t": 1483.1166666666666, "x": "額は1万5千ドル。"}, {"t": 1484.7333333333333, "x": "それは出たの？"}, {"t": 1485.7833333333333, "x": "出たかどうかは、今回の記録では\n確かめられなかった。"}, {"t": 1489.1, "x": "だからここでは言わない。"}, {"t": 1490.4666666666667, "x": "国会の議員は、この法案を疑いの目で見ていた。"}, {"t": 1493.5333333333333, "x": "裁判を軽く終わらせるための身ぶりではないか、と。"}, {"t": 1496.5, "x": "戦犯の釈放の発表なども同じころにあった。"}, {"t": 1499.4833333333333, "x": "それも含めてすなおに受け取れないと言っている。"}, {"t": 1502.0833333333333, "x": "ここで大事なのは疑いの中身ではない。"}, {"t": 1504.4666666666667, "x": "疑いを確かめる書類が、当時は一枚もなかったことだ。"}, {"t": 1508.1333333333334, "x": "日本側の答えは、受けていない、だけ。"}, {"t": 1510.8166666666666, "x": "そうだ。言われていないと\n言われたら、それ以上は聞けない。"}, {"t": 1514.0333333333333, "x": "家族のその後についてはこの回では触れない。"}, {"t": 1516.5666666666666, "x": "記録に残っているのは補償の額と手続きだけだ。"}, {"t": 1520.2666666666667, "x": "ここからアメリカ側の書類の話をする。"}, {"t": 1522.7333333333333, "x": "アメリカの国務省は、外交の記録を本にまとめている。"}, {"t": 1526.1333333333334, "x": "何十年かたつと秘密だった\n書類を公開して、載せるんだ。"}, {"t": 1529.9666666666667, "x": "秘密があとで本になるのね。"}, {"t": 1531.8666666666666, "x": "そうだ。1955年から57年の巻に日本の章がある。"}, {"t": 1536.1333333333334, "x": "その中にジラード事件の書類が\nまとまって、入っている。"}, {"t": 1539.5333333333333, "x": "いまは国務省のサイトでも読める。"}, {"t": 1541.5333333333333, "x": "最初に見るのは1957年4月26日の電報だ。"}, {"t": 1545.6166666666666, "x": "アメリカの陸軍省から極東にいる軍の司令官あてだ。"}, {"t": 1549.0666666666666, "x": "日本で起訴される3週間くらい前ね。"}, {"t": 1551.6333333333334, "x": "そうだ。まだ話し合いが続いていたころだ。"}, {"t": 1554.2166666666667, "x": "その電報の第5段落にこうある。"}, {"t": 1556.3333333333333, "x": "日本ができるだけ軽い罪で起訴すること。"}, {"t": 1558.9, "x": "それは明らかに我々の利益になる。"}, {"t": 1561.2, "x": "我々の利益……。"}, {"t": 1562.35, "x": "続けてこう書いてある。"}, {"t": 1563.75, "x": "引き渡しに同意する前にこの点で\n日本の同意を取れるかもしれない。"}, {"t": 1567.6833333333334, "x": "同意を取れ、って言ってるの？"}, {"t": 1569.4, "x": "取れるかもしれないという書き方だ。"}, {"t": 1571.4666666666667, "x": "命令ではない。だが狙いははっきりしている。"}, {"t": 1574.0166666666667, "x": "ここで注意してほしい。"}, {"t": 1575.3833333333334, "x": "これはアメリカ側が自分たちに\n向けて、書いた書類だ。"}, {"t": 1578.5833333333333, "x": "日本側が何と答えたかはここには書かれていない。"}, {"t": 1581.6666666666667, "x": "じゃあ、日本がどうしたかは分からないのね。"}, {"t": 1584.2166666666667, "x": "この電報だけでは分からない。"}, {"t": 1585.95, "x": "ではそのあとの書類を見ていこう。"}, {"t": 1588.4, "x": "次は5月16日の電報だ。"}, {"t": 1590.5166666666667, "x": "合同委員会で結論が出たその日の夜7時。"}, {"t": 1593.3666666666666, "x": "東京のアメリカ大使館から国務省にあてたものだ。"}, {"t": 1596.5, "x": "こう書いてある。"}, {"t": 1597.4333333333334, "x": "アメリカの代表が日本の外務省と\n法務省の担当者と会った。"}, {"t": 1601.1833333333334, "x": "非公式で内々の会合だった。"}, {"t": 1603.2833333333333, "x": "その結果、合同委員会が今日勧告を認めた。"}, {"t": 1606.5, "x": "内々の会合……。"}, {"t": 1607.7, "x": "勧告の中身は、日本の国会での説明と同じだ。"}, {"t": 1611.1166666666666, "x": "公務かどうかには触れずに\nアメリカは、裁判をしないと知らせる。"}, {"t": 1614.6666666666667, "x": "ここまでは日本側の説明と食い違っていない。"}, {"t": 1617.5833333333333, "x": "じゃあ、何が問題なの？"}, {"t": 1619.35, "x": "その電報の第2段落だ。"}, {"t": 1621.15, "x": "本にはこう書かれている。"}, {"t": 1622.6, "x": "第2段落。元の文で2行半。"}, {"t": 1624.7166666666667, "x": "公開されていない。"}, {"t": 1626.1, "x": "……そこだけ消されてるの？"}, {"t": 1627.6333333333334, "x": "消されているというより出していないんだ。"}, {"t": 1629.7666666666667, "x": "本の作り手が公開できなかったと断っている。"}, {"t": 1632.85, "x": "その2行半に、何が書いてあったの？"}, {"t": 1635.3666666666666, "x": "分からない。"}, {"t": 1636.1333333333334, "x": "書いていないものをこちらで\n想像して、埋めることはしない。"}, {"t": 1639.3833333333334, "x": "言えるのは、そこに\n2行半ぶんの何かがあることだけだ。"}, {"t": 1642.65, "x": "1996年の国会である議員が\nこの段落を取り上げている。"}, {"t": 1646.8166666666666, "x": "伏せてあるところこそが\n秘密の取り決めではないか、と。"}, {"t": 1650.0, "x": "ただそれは議員の見方だ。"}, {"t": 1651.6333333333334, "x": "中身はいまの本でも読めないままになっている。"}, {"t": 1654.8666666666666, "x": "いちばんはっきり書いてあるのが5月20日の書類だ。"}, {"t": 1657.85, "x": "国務省で極東を担当する次官補が\n国務長官にあてた覚え書きだ。"}, {"t": 1662.0666666666666, "x": "起訴の2日後に書かれている。"}, {"t": 1664.0, "x": "何て書いてあるの？"}, {"t": 1665.3166666666666, "x": "まず妥協が成り立ったという話。"}, {"t": 1667.35, "x": "アメリカは、裁判をしないと決めた。"}, {"t": 1669.5833333333333, "x": "ただし公務中だったという\nアメリカの立場は、損なわない。"}, {"t": 1673.0333333333333, "x": "ここまでは国会の説明と同じだ。"}, {"t": 1675.3, "x": "問題はその次だ。"}, {"t": 1676.6333333333334, "x": "この妥協の一部として、内々の取り決めが結ばれた。"}, {"t": 1680.1, "x": "……取り決め。"}, {"t": 1680.9833333333333, "x": "日本は刑法205条の傷害致死より\n重い罪では、起訴しない。"}, {"t": 1684.95, "x": "それは日本の法律で起訴できるいちばん軽い罪だ。"}, {"t": 1688.0333333333333, "x": "そう書いてある。"}, {"t": 1689.1, "x": "それって、本当に傷害致死で起訴されたわよね。"}, {"t": 1692.25, "x": "された。5月18日に傷害致死でだ。"}, {"t": 1695.0333333333333, "x": "覚え書きにはもう一つ書いてある。"}, {"t": 1697.0, "x": "日本は検察の筋を通して、\n裁判所に勧めることに同意した。"}, {"t": 1701.1166666666666, "x": "事件の事情を考えて、刑をできる限り軽くするように。"}, {"t": 1704.7, "x": "裁判所にまで……？"}, {"t": 1705.9333333333334, "x": "これもアメリカ側がそう書いているということだ。"}, {"t": 1708.5166666666667, "x": "実際に勧めたのかどうかはこの書類からは分からない。"}, {"t": 1711.7, "x": "裁判官が何かを受け取ったという記録もどこにもない。"}, {"t": 1714.9166666666667, "x": "5日後の大統領にあてた覚え書きの草案もある。"}, {"t": 1717.85, "x": "そこでも起訴した罪名は、傷害致死と書かれている。"}, {"t": 1721.7, "x": "この事件の名前は、そのあとも国会で出続けた。"}, {"t": 1724.8666666666666, "x": "1960年から1997年までの会議録でも、62回出てくる。"}, {"t": 1730.3666666666666, "x": "安保条約を改めるときや、\n沖縄の返還を話し合うときだ。"}, {"t": 1734.4166666666667, "x": "ずっと、たとえに使われてきたのね。"}, {"t": 1736.8, "x": "そうだ。米兵を日本が裁く話になると、\nこの事件がよく引かれた。"}, {"t": 1741.1333333333334, "x": "そして、アメリカの書類が\n本になってから、話が変わる。"}, {"t": 1744.75, "x": "1996年5月7日。"}, {"t": 1747.0, "x": "参議院の法務委員会だ。"}, {"t": 1748.85, "x": "事件から39年たってるのね。"}, {"t": 1751.2333333333333, "x": "前の年に沖縄で米兵による事件が起きていた。"}, {"t": 1754.2333333333333, "x": "アメリカ兵を日本がどう裁くかが\nまた問われていたころだ。"}, {"t": 1757.45, "x": "議員はこの本を手に持って質問した。"}, {"t": 1759.8166666666666, "x": "4月の電報、5月16日の電報、5月20日の覚え書き。"}, {"t": 1763.9666666666667, "x": "英語の文をその場で読み上げている。"}, {"t": 1766.0666666666666, "x": "政府は何て答えたの？"}, {"t": 1767.7, "x": "外務省の担当者は、こう答えた。"}, {"t": 1770.0, "x": "そういう箇所があることは承知している。"}, {"t": 1772.1333333333334, "x": "だがアメリカの文書について、\n政府としてコメントする立場にない。"}, {"t": 1776.1166666666666, "x": "……コメントしない。"}, {"t": 1777.2333333333333, "x": "そして1957年7月8日の答弁を引いた。"}, {"t": 1780.8333333333333, "x": "裁判の中身について、申し入れを\n受けたことは一度もない。"}, {"t": 1784.3, "x": "いまもそのように考えている、と。"}, {"t": 1786.4666666666667, "x": "39年前の答えを、そのまま？"}, {"t": 1789.0166666666667, "x": "そのままだ。"}, {"t": 1789.9, "x": "議員はそれは書類が公開される前の答えだと迫った。"}, {"t": 1793.1833333333334, "x": "法務省の担当者は、こう答えている。"}, {"t": 1795.5666666666666, "x": "当時の検察は、法と証拠に基づいて\n適正に処理したと承知している。"}, {"t": 1800.0, "x": "ご指摘を踏まえて、法務省として検討したい。"}, {"t": 1803.05, "x": "検討の結果は出たの？"}, {"t": 1804.6833333333334, "x": "この件で結果が国会で示された\n記録は、見つからなかった。"}, {"t": 1808.5166666666667, "x": "この日の質問は、それで終わっている。"}, {"t": 1811.4833333333333, "x": "もう一人この疑いに答えた人がいる。"}, {"t": 1813.9, "x": "この裁判を担当した検事の一人だ。"}, {"t": 1816.4833333333333, "x": "本人が話したの？"}, {"t": 1817.9833333333333, "x": "1994年、毎日新聞の群馬版が事件を特集した。"}, {"t": 1822.2833333333333, "x": "その取材に元検事が答えている。"}, {"t": 1824.5, "x": "判決が軽すぎるという声には、こう言った。"}, {"t": 1827.1833333333334, "x": "どこに出しても恥ずかしくない裁判を終えた。"}, {"t": 1829.8666666666666, "x": "自信があったのね。"}, {"t": 1831.2166666666667, "x": "そして減刑の約束の疑いについて聞かれた。"}, {"t": 1834.15, "x": "答えは、全く考えられないこと。"}, {"t": 1836.4833333333333, "x": "はっきり否定している。"}, {"t": 1838.0, "x": "アメリカの書類と正反対ね。"}, {"t": 1840.0166666666667, "x": "正反対だ。だが両方が成り立つ形もある。"}, {"t": 1843.0666666666666, "x": "どういうこと？"}, {"t": 1844.0666666666666, "x": "上のほうで何かが話されていても\n現場の検事は、知らなかった。"}, {"t": 1847.9, "x": "そういう可能性も理屈の上ではある。"}, {"t": 1850.0166666666667, "x": "逆にアメリカ側の書き方が大げさだった可能性もある。"}, {"t": 1853.3333333333333, "x": "自分たちの手柄として、強めに\n書いたのかもしれない。"}, {"t": 1856.7166666666667, "x": "どっちもありえるのね。"}, {"t": 1858.15, "x": "ありえる。そしてどちらとも決める書類が無い。"}, {"t": 1860.7666666666667, "x": "日本側の交渉の記録は、今回調べた\n範囲では見つからなかった。"}, {"t": 1864.95, "x": "アメリカ側には、伏せられた2行半がある。"}, {"t": 1867.5333333333333, "x": "この記事は、獨協大学の研究者の論文で\n紹介されている。"}, {"t": 1871.4166666666667, "x": "論文の筆者は、判決は密約の影響を\n受けていたと書いている。"}, {"t": 1875.3666666666666, "x": "ただそれも研究者としての見方だ。"}, {"t": 1877.65, "x": "この動画では、そこまでは言わない。"}, {"t": 1880.35, "x": "ここまでの話を二つに分けておく。"}, {"t": 1882.7166666666667, "x": "分かってることと、分かってないことね。"}, {"t": 1885.2166666666667, "x": "分かっていること。"}, {"t": 1886.35, "x": "1957年1月30日、演習場で46歳の女性が亡くなった。"}, {"t": 1891.6333333333334, "x": "撃ったのはジラードという兵士だった。"}, {"t": 1893.6833333333334, "x": "日本の裁判所は、公務中ではないと認めた。"}, {"t": 1896.6166666666666, "x": "罪名は傷害致死。懲役3年で執行猶予4年。"}, {"t": 1899.9, "x": "控訴は無く判決は確定した。"}, {"t": 1902.0166666666667, "x": "ジラードは、判決の17日後に帰国した。"}, {"t": 1905.0166666666667, "x": "そしてアメリカの公文書に\n内々の取り決めと書かれている。"}, {"t": 1908.5333333333333, "x": "分かってないことは？"}, {"t": 1909.8833333333334, "x": "その取り決めが本当にあったのか。"}, {"t": 1912.0, "x": "あったとして、日本側の誰が同意したのか。"}, {"t": 1914.7833333333333, "x": "それが実際の裁判に何か影響したのか。"}, {"t": 1917.5166666666667, "x": "そして伏せられた2行半に何が書いてあるのか。"}, {"t": 1920.4666666666667, "x": "……大事なところが、ぜんぶ分かってないのね。"}, {"t": 1923.1166666666666, "x": "そうだ。日本政府は、いまも認めていない。"}, {"t": 1925.85, "x": "認めてもいないし新しい説明も出していない。"}, {"t": 1928.6, "x": "ここで今回使った記録を挙げておく。"}, {"t": 1930.95, "x": "事件の様子と交渉の経過は、1957年の国会会議録。"}, {"t": 1935.5333333333333, "x": "衆議院と参議院の内閣委員会と法務委員会だ。"}, {"t": 1938.6666666666667, "x": "アメリカの判断と宣誓書は、\n連邦最高裁のウィルソン対ジラードの判決。"}, {"t": 1943.3333333333333, "x": "アメリカ側の書類は、国務省の外交記録集の第23巻。"}, {"t": 1947.3333333333333, "x": "1996年のやり取りは\nその年の参議院法務委員会の会議録。"}, {"t": 1951.9166666666667, "x": "公判の回数と日付は獨協大学の研究論文と、\nそこに引かれた当時の新聞。"}, {"t": 1957.1333333333334, "x": "どれもいまでも誰でも読める。"}, {"t": 1959.4666666666667, "x": "ねえ、最後に一つ聞いていい？"}, {"t": 1961.4333333333334, "x": "なんだ。"}, {"t": 1962.15, "x": "この事件で、いちばん引っかかってるのは何？"}, {"t": 1964.9666666666667, "x": "私は薬莢そのものだ。"}, {"t": 1966.7666666666667, "x": "薬莢？"}, {"t": 1967.5666666666666, "x": "あの人は、薬莢を拾いに野原へ入った。"}, {"t": 1970.3, "x": "拾えばその日のお金になるからだ。"}, {"t": 1972.4333333333334, "x": "そして飛んできたのも薬莢だった。"}, {"t": 1974.65, "x": "……拾いにいった物で、撃たれたのね。"}, {"t": 1976.9, "x": "そうだ。中身の無い真ちゅうの筒だ。"}, {"t": 1979.25, "x": "本物の弾ではない。だが人の命を奪った。"}, {"t": 1982.1833333333334, "x": "記録に残っているのはその結果だ。"}, {"t": 1984.4166666666667, "x": "一人が亡くなり、その裁判を\nどの国がするかで3か月半もめた。"}, {"t": 1988.5666666666666, "x": "裁判の重さにはのちに公文書の影がかかった。"}, {"t": 1991.7, "x": "亡くなった人のことが、どこかへいっちゃったみたい。"}, {"t": 1994.7333333333333, "x": "国会の会議録を読むとそう感じる場面がある。"}, {"t": 1997.55, "x": "裁判権。公務。行政協定。"}, {"t": 1999.7666666666667, "x": "言葉が大きくなるほど野原の1人が遠くなる。"}, {"t": 2002.6166666666666, "x": "だから今回は、名前を出さずに話した。"}, {"t": 2005.25, "x": "名前の代わりにあの日の野原のことを覚えておきたい。"}, {"t": 2008.1833333333334, "x": "50人から60人が薬莢を拾っていた昼すぎのことを。"}, {"t": 2011.85, "x": "……うん。"}, {"t": 2012.3666666666666, "x": "アメリカの書類と日本政府の答え。"}, {"t": 2014.5833333333333, "x": "あなたはどちらの記録が重いと感じただろうか。"}, {"t": 2017.3333333333333, "x": "思ったことがあればコメントに\n書いてもらえるとうれしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
