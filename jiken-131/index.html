<script>
const D={"name": "131", "file": "131_編集用", "dur": 2078.8833125, "segs": [], "subs": [{"t": 0.0, "x": "1976年8月26日。"}, {"t": 2.7666666666666666, "x": "新聞に1通の古い紙のことが載った。"}, {"t": 5.35, "x": "死因鑑定書。人がどうして\n亡くなったかを医師が書いた書類だ。"}, {"t": 9.116666666666667, "x": "書かれたのはその53年前の1923年9月だった。"}, {"t": 13.333333333333334, "x": "53年も前の書類？"}, {"t": 15.116666666666667, "x": "そうだ。誰にも知られずに、ある家にしまわれていた。"}, {"t": 18.2, "x": "鑑定書に名前があるのは3人だ。"}, {"t": 20.383333333333333, "x": "大杉栄、伊藤野枝、そして橘宗一という男の子。"}, {"t": 24.283333333333335, "x": "3人は1923年9月16日の夜、\n東京の憲兵隊の建物の中で命を奪われた。"}, {"t": 30.816666666666666, "x": "憲兵隊って軍の警察よね？"}, {"t": 32.983333333333334, "x": "陸軍の中で軍人の取り締まりや\n治安を受け持つ部隊だ。"}, {"t": 36.4, "x": "その年の12月、陸軍の裁判で判決が出ている。"}, {"t": 39.9, "x": "憲兵大尉の甘粕正彦に懲役10年。"}, {"t": 42.666666666666664, "x": "判決は3人の最期を文字で書き残した。"}, {"t": 45.38333333333333, "x": "ところが53年後に出てきた鑑定書は、\nそれと合わない所があった。"}, {"t": 49.78333333333333, "x": "合わない所？"}, {"t": 50.85, "x": "今回は判決が書いた筋と、\n53年後の鑑定書の食い違いを追う。"}, {"t": 55.233333333333334, "x": "そしてもう一つ。誰が命じたのか、という問いだ。"}, {"t": 58.38333333333333, "x": "これには判決も軍も最後まで答えを出していない。"}, {"t": 61.46666666666667, "x": "答えが出ていないのね。"}, {"t": 63.0, "x": "先に言っておく。3人の最期の様子は話さない。"}, {"t": 66.13333333333334, "x": "扱うのは紙に残った言葉のほうだ。"}, {"t": 69.13333333333334, "x": "話を1923年の9月に戻す。"}, {"t": 72.05, "x": "9月1日、関東大震災が起きた。"}, {"t": 74.7, "x": "東京と横浜の町は、揺れと火事で大きく焼けた。"}, {"t": 77.93333333333334, "x": "翌日には東京に戒厳令が敷かれている。"}, {"t": 80.71666666666667, "x": "戒厳令ってどういうもの？"}, {"t": 82.43333333333334, "x": "非常のときに軍が治安を受け持つ仕組みだ。"}, {"t": 85.0, "x": "町には根拠のないうわさが広がっていた。"}, {"t": 87.48333333333333, "x": "判決の文にはそのうわさがこう書かれている。"}, {"t": 90.11666666666666, "x": "「放火暴動の挙に出づべしとの流言喧伝せられ」。"}, {"t": 92.96666666666667, "x": "誰かが火を付けて回る、という\n話が飛び交ったということだ。"}, {"t": 96.63333333333334, "x": "そのうわさの裏に社会主義者がいる、という\n声もあったと判決は書く。"}, {"t": 100.85, "x": "社会主義者って、大杉栄のこと？"}, {"t": 103.45, "x": "大杉は無政府主義者だ。"}, {"t": 104.93333333333334, "x": "国の権力そのものを認めない考え方だな。"}, {"t": 107.91666666666667, "x": "当時、警察は主義者と呼ばれた\n人たちを次々に検束していた。"}, {"t": 112.1, "x": "検束というのは、警察が人を一時的に\n連れて行って留め置くことだ。"}, {"t": 116.35, "x": "戒厳令の下では、軍の側が警察を動かせる\n立場にもあったと伝えられている。"}, {"t": 121.21666666666667, "x": "ところが大杉は検束されていなかった。"}, {"t": 123.68333333333334, "x": "判決によると甘粕はそれを知って大杉を消すと決めた。"}, {"t": 127.11666666666666, "x": "9月15日の午後5時半ごろ。"}, {"t": 129.18333333333334, "x": "甘粕は部下の曹長、森慶次郎らと\n大杉の家の近くに張り込んだ。"}, {"t": 133.43333333333334, "x": "場所は東京府豊多摩郡淀橋町字柏木372番地。\nいまの新宿区のあたりだ。"}, {"t": 139.26666666666668, "x": "その日はどうなったの？"}, {"t": 140.75, "x": "大杉は家から出てこなかった。それで引き上げている。"}, {"t": 143.88333333333333, "x": "判決は「目的を達せず」と短く書いている。"}, {"t": 147.75, "x": "翌日の9月16日。大杉は朝から出かけていた。"}, {"t": 151.31666666666666, "x": "判決では午前10時ごろ伊藤野枝と外に出たとある。"}, {"t": 154.4, "x": "野枝は大杉と一緒に暮らしていた。"}, {"t": 156.33333333333334, "x": "婚姻の届けは出していなかった。"}, {"t": 158.53333333333333, "x": "どこへ行ったの？"}, {"t": 159.65, "x": "行き先は神奈川県の鶴見だ。"}, {"t": 161.68333333333334, "x": "震災のあと大杉の弟の家を\n見舞いに行ったと伝えられている。"}, {"t": 165.33333333333334, "x": "その家にたまたま大杉の妹と、その息子が来ていた。"}, {"t": 168.9, "x": "息子の名前が宗一。橘宗一だ。"}, {"t": 171.83333333333334, "x": "宗一くんはそこで初めて会ったの？"}, {"t": 174.15, "x": "そこまでは分からない。ただ宗一は\n東京に一緒に行くことになった。"}, {"t": 178.11666666666667, "x": "焼け跡を見たい、と言ったと伝えられている。"}, {"t": 180.6, "x": "こうして3人は、夕方に東京の家のほうへ戻ってくる。"}, {"t": 184.23333333333332, "x": "張り込みのことは、知らないのよね。"}, {"t": 186.48333333333332, "x": "知らない。その日も甘粕たちは昼過ぎから待っていた。"}, {"t": 189.81666666666666, "x": "判決では午後2時半ごろに再び張り込んだとある。"}, {"t": 192.9, "x": "前の日と同じ目的で、とわざわざ書いてある。"}, {"t": 195.75, "x": "そこで淀橋警察署の署員から話を聞いた。"}, {"t": 198.7, "x": "大杉は朝に出かけたが、夕方には\n帰るだろう、という話だ。"}, {"t": 202.7, "x": "警察の人が居場所を教えたってこと？"}, {"t": 205.16666666666666, "x": "判決にはそう書いてある。いつごろ\n帰るかを聞き出した、とな。"}, {"t": 208.91666666666666, "x": "そして甘粕たちは、家の近くの道で待つことにした。"}, {"t": 213.03333333333333, "x": "午後5時ごろ。3人が張り込みの場所に来た。"}, {"t": 215.85, "x": "甘粕と森は大杉に声を掛けた。"}, {"t": 218.08333333333334, "x": "取り調べたいことがあるので、\n憲兵隊まで来てほしい、と言った。"}, {"t": 221.96666666666667, "x": "断れなかったの？"}, {"t": 223.33333333333334, "x": "戒厳令の下で相手は軍の警察だ。"}, {"t": 225.78333333333333, "x": "判決の言葉では「同行を求め」とある。"}, {"t": 228.6, "x": "3人は東京市麹町区にあった\n東京憲兵隊へ連れて行かれた。"}, {"t": 232.63333333333333, "x": "いまの千代田区の、皇居に近いあたりだ。"}, {"t": 235.2, "x": "子どもも一緒に？"}, {"t": 236.43333333333334, "x": "一緒にだ。宗一は震災の少し前に日本へ来ていた。"}, {"t": 239.98333333333332, "x": "判決は宗一の年を「当七歳」と書いている。"}, {"t": 243.16666666666666, "x": "これは数え年だ。生まれた年から\n数えると、満で6歳になる。"}, {"t": 247.3, "x": "6歳……。"}, {"t": 248.1, "x": "3人は震災のあと使われていなかった\n元の隊長室で休まされた。"}, {"t": 252.3, "x": "ここから先の数時間を、判決は分刻みで書いている。"}, {"t": 255.8, "x": "ただこの回ではその中身を細かくは読まない。"}, {"t": 258.46666666666664, "x": "時刻と、判決が何を書いて何を\n書かなかったか。そこだけを見る。"}, {"t": 262.85, "x": "分かった。"}, {"t": 263.71666666666664, "x": "一つだけ先に言っておく。"}, {"t": 265.43333333333334, "x": "3人が憲兵隊に入るところを、警察は確かめていた。"}, {"t": 269.05, "x": "これがあとで軍が隠し通せなかった\n理由の一つになる。"}, {"t": 272.95, "x": "判決が書いた時刻を、順に並べる。"}, {"t": 275.43333333333334, "x": "午後8時。森が大杉を上の階の応接室へ連れて行った。"}, {"t": 279.0833333333333, "x": "午後8時30分ごろ。"}, {"t": 280.5833333333333, "x": "甘粕がその部屋に入った。"}, {"t": 282.5, "x": "判決は甘粕が大杉の背後から首を\n圧迫して窒息させた、と書いた。"}, {"t": 287.3, "x": "森はどうしていたの？"}, {"t": 288.71666666666664, "x": "判決では部屋の外の廊下で\n見張りをしていたとされた。"}, {"t": 291.95, "x": "そのあと甘粕と森は、下の階の事務室で話し合った。"}, {"t": 295.6, "x": "残った野枝と宗一をどうするか、という話だ。"}, {"t": 298.68333333333334, "x": "子どもまで……。"}, {"t": 299.6333333333333, "x": "判決は甘粕が宗一を大杉の子どもだと\n思い込んでいた、と書く。"}, {"t": 303.8, "x": "そして子どもに手を掛けるのは\n「情に於て忍びず」ためらった、と。"}, {"t": 307.8666666666667, "x": "そこへ森が放っておけば事が\n早く明るみに出る、と言った。"}, {"t": 311.4166666666667, "x": "甘粕はそれに同意した、と判決は書いている。"}, {"t": 314.48333333333335, "x": "自分たちではやらなかったの？"}, {"t": 316.3666666666667, "x": "判決では2人とも自分では手を下したくなかった。"}, {"t": 319.53333333333336, "x": "それで部下の上等兵2人に命じた、とされている。"}, {"t": 322.5833333333333, "x": "午後9時30分ごろ。"}, {"t": 323.96666666666664, "x": "甘粕は野枝の命を奪い、森は廊下で見張った。"}, {"t": 327.06666666666666, "x": "同じころ隣の部屋で宗一も命を奪われた。"}, {"t": 329.8666666666667, "x": "判決はそう書いた。"}, {"t": 331.4166666666667, "x": "午後8時から9時半まで、1時間半なのね。"}, {"t": 334.55, "x": "そうだ。3人の遺体は建物の裏の古い\n井戸に入れられたと伝えられている。"}, {"t": 338.95, "x": "判決が使った医師の鑑定は、\n3人とも窒息が死因だというものだった。"}, {"t": 343.55, "x": "この「鑑定」という言葉を、覚えておいてほしい。"}, {"t": 347.18333333333334, "x": "ここで宗一のことを話しておく。"}, {"t": 349.3, "x": "宗一は1917年、アメリカで生まれた。"}, {"t": 352.4, "x": "父親は橘惣三郎。アメリカに渡って\n貿易の仕事をしていた。"}, {"t": 356.5833333333333, "x": "母親は大杉栄の妹のあやめだ。"}, {"t": 359.1666666666667, "x": "アメリカのどこ？"}, {"t": 360.31666666666666, "x": "オレゴン州のポートランドだと伝えられている。"}, {"t": 362.8, "x": "アメリカはその国で生まれた\n子にアメリカの国籍を与える。"}, {"t": 366.1, "x": "だから宗一はアメリカの国籍も持っていた。"}, {"t": 369.0, "x": "日本とアメリカの、両方の国籍？"}, {"t": 371.5, "x": "そういうことになる。"}, {"t": 372.68333333333334, "x": "一家は震災の少し前に、たまたま日本へ来ていた。"}, {"t": 375.96666666666664, "x": "そして9月16日、伯父の大杉と一緒に東京へ向かった。"}, {"t": 379.8333333333333, "x": "宗一はただ居合わせただけだった。"}, {"t": 382.05, "x": "本当にたまたまなのね。"}, {"t": 383.75, "x": "名古屋大学の資料も、\n偶然居合わせたため、と書いている。"}, {"t": 387.31666666666666, "x": "この国籍のことは、のちに国会でも語られた。"}, {"t": 390.46666666666664, "x": "1985年5月17日、衆議院の外務委員会だ。"}, {"t": 394.6333333333333, "x": "河上民雄 議員がこの事件を\n思い出して、こう言っている。"}, {"t": 398.23333333333335, "x": "「アメリカ国籍所有者であったために、\n当時これは一種の外交問題になったことがある」。"}, {"t": 403.4166666666667, "x": "62年たっても、国会で話に出たのね。"}, {"t": 406.55, "x": "外国の国籍を持つ子どもが、\n軍の建物の中で亡くなった。"}, {"t": 410.5833333333333, "x": "それは日本の中だけで済む\n話ではなかった、ということだ。"}, {"t": 414.85, "x": "3人はその夜家に帰らなかった。"}, {"t": 417.01666666666665, "x": "家族や仲間はすぐにおかしいと気づいた。"}, {"t": 419.55, "x": "どうやって探したの？"}, {"t": 421.0, "x": "家の人はまずアメリカの大使館へ\n向かったと伝えられている。"}, {"t": 424.48333333333335, "x": "宗一がアメリカの国籍を持っていたからだ。"}, {"t": 427.21666666666664, "x": "そのあと警察に、行方を探してほしいと届け出た。"}, {"t": 430.6, "x": "警察は憲兵隊が連れて行ったことを知っていたのよね。"}, {"t": 433.96666666666664, "x": "知っていた。内閣府の報告書にも、そう書いてある。"}, {"t": 437.28333333333336, "x": "警察は、憲兵隊が大杉らを\n連れて行ったことを確かめていた。"}, {"t": 441.18333333333334, "x": "そして行方が分からなくなったと\n知って、内務大臣が閣議で取り上げた。"}, {"t": 445.6, "x": "内閣の会議で？"}, {"t": 446.95, "x": "そうだ。内務大臣は後藤新平。"}, {"t": 449.03333333333336, "x": "警察を受け持つ大臣だ。"}, {"t": 450.78333333333336, "x": "こうなると軍の中だけで片付けることはできない。"}, {"t": 453.68333333333334, "x": "陸軍大臣の田中義一は、\n事情をつかむとすぐに動いた。"}, {"t": 457.3333333333333, "x": "戒厳の司令官を交代させている。"}, {"t": 459.51666666666665, "x": "20日には憲兵の一番上の司令官と\n東京の憲兵隊長を停職にしたと発表した。"}, {"t": 465.03333333333336, "x": "一番上の人まで？"}, {"t": 466.53333333333336, "x": "理由は甘粕への監督が\n行き届かなかったから、というものだ。"}, {"t": 470.28333333333336, "x": "ここで覚えておいてほしい。"}, {"t": 471.76666666666665, "x": "処分の理由は「監督が行き届かなかった」だ。"}, {"t": 474.8833333333333, "x": "「命じた」ではない。"}, {"t": 476.8, "x": "新聞も動いていた。"}, {"t": 478.1333333333333, "x": "9月18日には、報知新聞の夕刊が\n報じたと伝えられている。"}, {"t": 482.3833333333333, "x": "大杉夫妻が子どもと一緒に憲兵隊に\n連れて行かれた、という内容だ。"}, {"t": 486.6333333333333, "x": "20日には読売新聞と時事新報が号外を出した。"}, {"t": 489.8333333333333, "x": "甘粕憲兵大尉が大杉栄を\n手に掛けた、という内容だった。"}, {"t": 493.9, "x": "すぐに名前まで出たのね。"}, {"t": 495.6, "x": "ところがそのあとが続かない。"}, {"t": 497.3666666666667, "x": "事件の記事はしばらく載せることを差し止められた。"}, {"t": 500.35, "x": "止められた？"}, {"t": 501.3, "x": "だから世の中には、断片だけが伝わった。"}, {"t": 504.1, "x": "司令官が急に代わった。"}, {"t": 505.56666666666666, "x": "憲兵が裁判にかけられる。"}, {"t": 507.4, "x": "でも何があったのかは、はっきり書かれない。"}, {"t": 509.95, "x": "震災のあとで町はただでさえうわさであふれていた。"}, {"t": 512.95, "x": "余計に不安になりそうね。"}, {"t": 514.6666666666666, "x": "9月24日。甘粕たちは陸軍の裁判、\n軍法会議にかけられた。"}, {"t": 519.2333333333333, "x": "これは内閣府の報告書にある日付だ。"}, {"t": 521.75, "x": "翌25日、軍は甘粕が大杉と「他2名」を\n連れて行って命を奪った、と公表した。"}, {"t": 527.65, "x": "他2名って誰なのか言わなかったの？"}, {"t": 529.9166666666666, "x": "言わなかった。名前が新聞に出たのは\n10月8日の公判のときだと伝えられている。"}, {"t": 534.85, "x": "そこで初めてそれが伊藤野枝と、\n6歳の男の子だと知られた。"}, {"t": 538.7666666666667, "x": "世の中は大きく揺れた、と伝えられている。"}, {"t": 541.9833333333333, "x": "ここで大杉栄という人のことを少し話す。"}, {"t": 545.0166666666667, "x": "どんな人だったの？"}, {"t": 546.4, "x": "父親は陸軍の軍人だった。"}, {"t": 548.25, "x": "愛知県のいまの津島市の出身だ。"}, {"t": 550.5833333333334, "x": "大杉自身も子どものころは軍人を目指していた。"}, {"t": 553.5166666666667, "x": "名古屋の陸軍の幼年学校に入っている。"}, {"t": 556.2, "x": "軍人の学校に？"}, {"t": 557.6, "x": "そうだ。ところが学校で問題を\n起こして、2年で退学になった。"}, {"t": 561.6666666666666, "x": "そのあと東京に出て、東京外国語学校で学んだ。"}, {"t": 565.0333333333333, "x": "そのころから社会運動に近づいていく。"}, {"t": 567.4666666666667, "x": "やがて無政府主義の活動家として\n知られるようになった。"}, {"t": 570.8, "x": "軍人を目指していた人が、軍に命を奪われたのね。"}, {"t": 574.3, "x": "名古屋大学の資料は、大杉は\n1923年に38歳だったと書いている。"}, {"t": 579.5, "x": "本も多く残した。その中に\n『日本脱出記』という一冊がある。"}, {"t": 583.8166666666667, "x": "震災の年に大杉がフランスへ渡ったときの記録だ。"}, {"t": 587.25, "x": "震災の年にフランス？"}, {"t": 588.95, "x": "前の年の11月20日。"}, {"t": 590.7, "x": "大杉のもとに1通の手紙が届いた。"}, {"t": 593.1666666666666, "x": "ドイツのベルリンで開く\n集まりに来ないか、という招待状だった。"}, {"t": 596.9666666666667, "x": "大杉は12月11日の晩、ひそかに家を抜け出した。"}, {"t": 600.5833333333334, "x": "上海を通ってフランスまで渡っている。"}, {"t": 603.0333333333333, "x": "ひそかにって……。"}, {"t": 604.1666666666666, "x": "大杉にはいつも警察の尾行がついていた。"}, {"t": 606.7333333333333, "x": "だから見つからないように出る\n必要があった、と本人が書いている。"}, {"t": 611.1666666666666, "x": "フランスでの大杉は、ドイツへ行く許可を待っていた。"}, {"t": 614.1166666666667, "x": "ところが許可は、いつまでも下りなかった。"}, {"t": 616.65, "x": "それでどうなったの？"}, {"t": 617.9833333333333, "x": "1923年5月1日。メーデーの日だ。"}, {"t": 621.2666666666667, "x": "大杉はパリ郊外のサン・ドニで捕まった。"}, {"t": 623.7666666666667, "x": "本人の記録では、集会で\n話をしたことがきっかけだった。"}, {"t": 627.55, "x": "付けられた罪の名は、秩序紊乱、\n官吏抗拒、旅券規則違反。"}, {"t": 631.85, "x": "外国で捕まったのね。"}, {"t": 633.5833333333334, "x": "3日目にパリのラ・サンテという監獄に送られた。"}, {"t": 636.4333333333333, "x": "本人によると入って24日目に出されて、\nそのまま国外へ追放になった。"}, {"t": 641.1666666666666, "x": "そして日本へ帰る船に乗る。"}, {"t": 642.8666666666667, "x": "船の名前は箱根丸だ。"}, {"t": 644.6333333333333, "x": "『日本脱出記』の一節の終わりには、こう日付がある。"}, {"t": 648.1666666666666, "x": "「1923年7月11日、箱根丸にて」。"}, {"t": 651.9833333333333, "x": "7月……。9月16日の2か月ちょっと前ね。"}, {"t": 655.25, "x": "そうだ。大杉は夏に日本へ戻って、\nその2か月後に命を奪われた。"}, {"t": 659.7, "x": "フランスの牢屋からは24日で出てこられた。"}, {"t": 662.4, "x": "日本の憲兵隊の建物からは、\nその夜のうちに出てこられなかった。"}, {"t": 666.6, "x": "本の中の大杉は、牢屋の暮らしまで\n面白がって書いている。"}, {"t": 670.25, "x": "葡萄酒やビールを並べてもいい牢屋だった、とな。"}, {"t": 673.1833333333333, "x": "明るい書き方なのね。"}, {"t": 674.7833333333333, "x": "この本が書かれた船の上で、大杉は\n秋に何が起きるかを知らない。"}, {"t": 678.7833333333333, "x": "その2か月後に何が待っているか、\n文の中からは何も読み取れない。"}, {"t": 683.5166666666667, "x": "伊藤野枝のことも話しておく。"}, {"t": 685.35, "x": "野枝は女性たちが作った雑誌『青鞜』の仲間だった。"}, {"t": 688.9833333333333, "x": "青鞜って聞いたことがあるわ。"}, {"t": 690.8666666666667, "x": "女性が自分の言葉で書くための雑誌だ。"}, {"t": 693.3833333333333, "x": "野枝は1912年、17歳でその仲間に加わった。"}, {"t": 697.15, "x": "のちに編集でも大きな役目を果たしている。"}, {"t": 699.8833333333333, "x": "17歳で……。"}, {"t": 701.0, "x": "そして大杉と出会い、一緒に暮らすようになった。"}, {"t": 703.8833333333333, "x": "2人の暮らしは、当時の新聞で何度も騒がれた。"}, {"t": 707.0333333333333, "x": "ただこの回ではその話はしない。"}, {"t": 709.2166666666667, "x": "どうして？"}, {"t": 710.05, "x": "この回の主役は、判決と\n鑑定書という2枚の紙だからだ。"}, {"t": 713.9333333333333, "x": "野枝は28年の生涯だったと伝えられている。"}, {"t": 716.8833333333333, "x": "判決は野枝の命を奪う理由をこう書いた。"}, {"t": 719.4333333333333, "x": "大杉の妻で考えが同じだったから。"}, {"t": 721.85, "x": "さらに女性の主義者はかえって男より\n激しい、という言い回しまで使っている。"}, {"t": 726.4166666666666, "x": "それが理由として書かれてるの？"}, {"t": 728.4, "x": "判決の文にそのまま残っている。"}, {"t": 730.5666666666667, "x": "これは判決が認めた甘粕の考えであって、\n事実の説明ではない。"}, {"t": 734.9166666666666, "x": "100年前の裁判の文が、何を理由として書いたか。"}, {"t": 738.2666666666667, "x": "それ自体がこの事件の記録の一部だ。"}, {"t": 741.3166666666667, "x": "軍法会議の公判は、10月8日に始まった。"}, {"t": 744.45, "x": "ここで甘粕の言うことが、何度も変わっていく。"}, {"t": 747.45, "x": "変わるってどんなふうに？"}, {"t": 748.9333333333333, "x": "最初、甘粕は自分の考えで3人の命を\n奪った、と認めていたと伝えられている。"}, {"t": 754.2666666666667, "x": "ところが公判では、子どもには\n手を掛けていない、と言い出した。"}, {"t": 757.8666666666667, "x": "子どもが亡くなったのは、あとで\n知ったと言ったとされている。"}, {"t": 761.2666666666667, "x": "じゃあ宗一くんのことは誰が？"}, {"t": 763.25, "x": "そこが宙に浮いてしまった。"}, {"t": 764.9333333333333, "x": "甘粕の弁護人は塚崎直義という弁護士だった。"}, {"t": 768.1833333333333, "x": "子どもの件があいまいなままだ、と\n食い下がったと伝えられている。"}, {"t": 771.8, "x": "陸軍は子どもの件を調べ直すよう命じた。"}, {"t": 774.5, "x": "するとその途中で、憲兵の上等兵2人が\n自分から名乗り出た。"}, {"t": 778.5833333333334, "x": "自首したのね。"}, {"t": 779.7333333333333, "x": "調書には昨日8日の公判で甘粕が\n否定したので、という言葉がある。"}, {"t": 783.9833333333333, "x": "続いてもう1人の伍長も関わりを認めた。"}, {"t": 786.65, "x": "こうして裁かれる人は5人になった。"}, {"t": 788.95, "x": "上等兵の1人は、こう話したとされる。"}, {"t": 791.5166666666667, "x": "事が明るみに出たときは、甘粕と\n森が責任を負うと言われていた。"}, {"t": 795.5666666666667, "x": "だから信じていたが、公判で甘粕が\n子どもの件を否定したので名乗り出た、と。"}, {"t": 800.55, "x": "上の人の言葉を信じていたのに……。"}, {"t": 802.8166666666667, "x": "甘粕の供述はそのあともう一度変わる。"}, {"t": 805.3666666666667, "x": "森は「子どもも」と甘粕が命じたと言った。"}, {"t": 808.2833333333333, "x": "それを聞いた甘粕は、命令しましたと\n認めたと伝えられている。"}, {"t": 812.1, "x": "最初、否定、また肯定。"}, {"t": 813.8833333333333, "x": "3度変わったことになる。"}, {"t": 816.15, "x": "11月24日。検察の側が求めた刑が示された。"}, {"t": 820.05, "x": "甘粕に懲役15年、森に5年。"}, {"t": 822.3166666666667, "x": "上等兵2人に2年ずつ、伍長に\n1年6か月と伝えられている。"}, {"t": 826.6666666666666, "x": "それで判決は？"}, {"t": 827.95, "x": "12月8日。東京の第一師団の軍法会議で\n判決が言い渡された。"}, {"t": 832.4833333333333, "x": "大阪朝日新聞は翌9日、その判決の全文を載せている。"}, {"t": 836.5666666666667, "x": "この回はその新聞の文を主な手がかりにしている。"}, {"t": 839.55, "x": "主文はこうだ。"}, {"t": 840.5666666666667, "x": "甘粕正彦、懲役10年。"}, {"t": 842.5333333333333, "x": "森慶次郎、懲役3年。"}, {"t": 844.45, "x": "そして部下の憲兵3人は、無罪。"}, {"t": 846.9333333333333, "x": "3人とも無罪なの？"}, {"t": 848.5, "x": "そうだ。理由はあとで話す。"}, {"t": 850.3333333333334, "x": "記事によると法廷が開いたのは午前10時ちょうど。"}, {"t": 853.2, "x": "閉じたのは午前10時20分だった。"}, {"t": 855.5833333333334, "x": "20分で終わったの？"}, {"t": 857.1, "x": "判決を読み上げるだけの日だったからな。"}, {"t": 859.5166666666667, "x": "最後に判士長は言った。"}, {"t": 860.9666666666667, "x": "「若しこの判決に不服ならば三日以内に上告せよ」。"}, {"t": 864.2833333333333, "x": "記事は、甘粕は服するらしいとも書いている。"}, {"t": 867.05, "x": "検察の側も上告はしないらしいと伝えている。"}, {"t": 870.1, "x": "じゃあこれで決まり？"}, {"t": 871.2666666666667, "x": "決まった。裁判で認められた筋は、ここで固まった。"}, {"t": 874.75, "x": "この「認められた筋」と、\n53年後の鑑定書を、あとで並べる。"}, {"t": 879.8333333333334, "x": "判決の日の法廷の様子も、記事に残っている。"}, {"t": 882.9, "x": "甘粕は40日あまりの獄中で、少し頬がこけていた。"}, {"t": 886.6333333333333, "x": "頭をきれいに刈り込み、鼻の下の\nひげを落としていた、とある。"}, {"t": 890.5, "x": "細かく書いてあるのね。"}, {"t": 892.0666666666667, "x": "判士長が「今より判決を言渡す」と言った。"}, {"t": 895.2, "x": "主文が読まれると、甘粕は少し頭を前に垂れた。"}, {"t": 898.65, "x": "そのとき傍聴席から「裁判長」と怒鳴る声がした。"}, {"t": 902.2833333333333, "x": "誰かが叫んだの？"}, {"t": 903.7, "x": "さらに理由を読み上げている途中だ。"}, {"t": 905.7333333333333, "x": "傍聴席の男がはいていた泥の草履を投げつけた。"}, {"t": 908.8666666666667, "x": "草履は法務官の肩を越えて、\n師団長の目の前に落ちた。"}, {"t": 912.5166666666667, "x": "師団長の前に……！"}, {"t": 913.8333333333334, "x": "男はすぐ憲兵に連れ出された。"}, {"t": 915.9166666666666, "x": "記事によると男は甘粕を応援していた人だった。"}, {"t": 919.1166666666667, "x": "応援していた人が、怒ったの？"}, {"t": 921.35, "x": "判決が重すぎる、という怒りだったと読める。"}, {"t": 924.15, "x": "当時、甘粕の刑を軽くしてほしいという\n声は少なくなかった、と伝えられている。"}, {"t": 929.1166666666667, "x": "一方で軽すぎると考えた人もいた。"}, {"t": 931.5333333333333, "x": "同じ判決に両方から声が上がっていた。"}, {"t": 934.2333333333333, "x": "重いのか軽いのか、見方が割れてたのね。"}, {"t": 936.9833333333333, "x": "無罪の3人の顔には微笑が\n浮かんでいた、と記事は書いている。"}, {"t": 941.25, "x": "部下の3人が無罪になった理由を見ておく。"}, {"t": 943.8333333333334, "x": "まず上等兵2人だ。"}, {"t": 945.2833333333333, "x": "判決は2人が宗一の命を奪ったことは認めている。"}, {"t": 948.8833333333333, "x": "認めているのに、無罪？"}, {"t": 950.6, "x": "判決の言葉では、こうだ。"}, {"t": 952.45, "x": "「罪となるべき事実を知らずして犯したるもの」。"}, {"t": 955.2166666666667, "x": "つまり罪を犯すつもりがなかった、という扱いだ。"}, {"t": 958.3, "x": "上官の命令を職務上の命令だと信じて従った。"}, {"t": 961.6, "x": "戒厳令の下でそれが犯罪だと考える余地が無かった。"}, {"t": 965.05, "x": "判決は2人の言い分をそう受け止めた。"}, {"t": 967.5666666666667, "x": "命令だったから、ってことね。"}, {"t": 969.5, "x": "伍長については、別の理由だ。"}, {"t": 971.55, "x": "現場の近くにいたことは確かだと判決は書いた。"}, {"t": 974.65, "x": "だが事情を知って見張りをしたという\n証拠は十分でない。だから無罪だ。"}, {"t": 978.7833333333333, "x": "命じた側が10年と3年。従った側が無罪。"}, {"t": 982.05, "x": "この形は戦後の国会でも取り上げられた。"}, {"t": 984.7333333333333, "x": "1958年8月9日、衆議院の法務委員会。"}, {"t": 988.6, "x": "猪俣浩三 議員の発言だ。"}, {"t": 990.8166666666667, "x": "議員は手を下した者の何人かは\n無罪になった、と記憶をたどって話している。"}, {"t": 995.4666666666667, "x": "議員は上官の命令に下の者がどこまで\n従うべきか、という話の例に挙げた。"}, {"t": 1000.3666666666667, "x": "35年たっても、この判決は命令と\n責任の話の例に引かれていた。"}, {"t": 1005.1833333333333, "x": "命令した人と従った人の責任ね。"}, {"t": 1007.9833333333333, "x": "そうだ。そしてその命令の一番上は誰だったのか。"}, {"t": 1011.2166666666667, "x": "判決は甘粕と森の2人で止めている。"}, {"t": 1014.4333333333333, "x": "判決の文にはもう一つ気になる所がある。"}, {"t": 1017.2166666666667, "x": "甘粕が大杉を狙うと決めた、そのきっかけの書き方だ。"}, {"t": 1021.0, "x": "きっかけ？"}, {"t": 1021.9, "x": "判決によると、甘粕はある話を聞き込んだ。"}, {"t": 1024.9666666666667, "x": "淀橋警察署に、大杉を「やっつけろ」的な\n意向がある、という話だ。"}, {"t": 1029.7333333333333, "x": "甘粕は森にそれが本当か確かめさせた。"}, {"t": 1032.4833333333333, "x": "9月15日の朝、森は警察署の意向だとして、\nこう報告したとされる。"}, {"t": 1037.2333333333333, "x": "憲兵隊の手で大杉をやってくれれば、\n尾行を外すなどの手助けをする、と。"}, {"t": 1041.9, "x": "警察がそんなことを頼んだの？"}, {"t": 1044.0, "x": "判決には甘粕たちの側の話としてそう書かれた。"}, {"t": 1047.3333333333333, "x": "だが警察署の2人は、これを\n否定したと伝えられている。"}, {"t": 1050.8166666666666, "x": "そして判決の4日前の12月4日、2人は\n起訴されないことになった、と新聞が報じたとされる。"}, {"t": 1057.1833333333334, "x": "じゃあ警察の頼みは無かったってこと？"}, {"t": 1059.5833333333333, "x": "検事局は、甘粕たちがその前から\n決めていたのは明らかだと見た。"}, {"t": 1063.7666666666667, "x": "そう伝えられている。"}, {"t": 1065.0, "x": "つまり頼まれたから動いた、という筋は採らなかった。"}, {"t": 1068.2166666666667, "x": "それでも判決の文には、\n淀橋警察署の名前が残っている。"}, {"t": 1072.2833333333333, "x": "判決の中に確かめられなかった話も入ってるのね。"}, {"t": 1075.8666666666666, "x": "判決は裁く側が認めた筋をまとめた文だ。"}, {"t": 1078.8666666666666, "x": "その中には被告の言い分がそのまま\n理由として組み込まれた所もある。"}, {"t": 1083.0166666666667, "x": "判決を読むときは、誰の言葉がどこに\n入っているかを見分ける必要がある。"}, {"t": 1087.45, "x": "この見分け方は、あとで鑑定書を読むときにも使う。"}, {"t": 1091.2666666666667, "x": "ここで判決の中の「証拠」の欄を見る。"}, {"t": 1094.1166666666666, "x": "判決は何を根拠に事実を認めたかを並べている。"}, {"t": 1097.4666666666667, "x": "何が並んでるの？"}, {"t": 1098.8166666666666, "x": "甘粕の公判での供述。"}, {"t": 1100.5, "x": "予審の調書。森の供述。"}, {"t": 1102.4666666666667, "x": "上等兵2人の供述。"}, {"t": 1104.2, "x": "それからある商人の話もある。"}, {"t": 1106.2, "x": "その夜、甘粕に「君は子供があるか」と\n聞かれた、という証言だ。"}, {"t": 1110.75, "x": "子どもがいるか、って？"}, {"t": 1112.2, "x": "子どもを育ててくれる人はいないか、という\n意味の話をされたらしい。"}, {"t": 1116.0666666666666, "x": "商人が困ると甘粕は\n「君は東京だからなー」と言って話をやめた。"}, {"t": 1120.65, "x": "宗一くんをどこかに預けようとしてたのかしら。"}, {"t": 1123.5666666666666, "x": "そう読む人もいる。だが判決は\nそこに理由をつけていない。"}, {"t": 1127.0333333333333, "x": "そして証拠の最後に、医師の鑑定が出てくる。"}, {"t": 1129.9, "x": "判決が引いたのは、この一文だけだ。"}, {"t": 1132.4333333333334, "x": "3人の死因はいずれも首を強く\n圧迫されての窒息だ、という記載。"}, {"t": 1136.8, "x": "死因だけ？"}, {"t": 1137.7333333333333, "x": "死因だけだ。"}, {"t": 1138.6166666666666, "x": "体にほかの傷があったかどうか。"}, {"t": 1140.55, "x": "判決の証拠の欄には、それが出てこない。"}, {"t": 1143.3, "x": "判決が描いた筋は「1人ずつ、\n背後から首を」というものだった。"}, {"t": 1147.6666666666667, "x": "鑑定の「死因」は、その筋と合っている。"}, {"t": 1150.5666666666666, "x": "じゃあ合っていない所って？"}, {"t": 1152.2166666666667, "x": "それが分かるのが、53年後だ。"}, {"t": 1154.4833333333333, "x": "その前に軍がこの事件をどう\n締めくくったかを見ておく。"}, {"t": 1158.2666666666667, "x": "判決から8日後の12月16日。舞台は衆議院だ。"}, {"t": 1162.0, "x": "予算を話し合う委員会で、この事件が取り上げられた。"}, {"t": 1165.2333333333333, "x": "前の日に渡辺脩という議員が質問していた。"}, {"t": 1168.25, "x": "それに陸軍大臣の田中義一が答えている。"}, {"t": 1171.1833333333334, "x": "なんて答えたの？"}, {"t": 1172.45, "x": "大阪朝日新聞の記事に、答弁がこう残っている。"}, {"t": 1175.65, "x": "「小泉憲兵司令官及び憲兵隊長を\n免官したのは甘粕事件に関連し」。"}, {"t": 1180.4333333333334, "x": "「不取締の廉で懲罰したので\n何等他に意味を有しない」。"}, {"t": 1184.0666666666666, "x": "ふとりしまりのかど？"}, {"t": 1185.4333333333334, "x": "取り締まりが行き届かなかった、という\n理由で罰した、という意味だ。"}, {"t": 1189.3333333333333, "x": "最後の一言が大事だ。"}, {"t": 1190.9, "x": "「何等他に意味を有しない」。"}, {"t": 1192.6833333333334, "x": "他の意味は無い、って？"}, {"t": 1194.1666666666667, "x": "上の人を罰したのは監督の責任だけで、\nそれ以上の意味は無い。"}, {"t": 1198.1333333333334, "x": "つまり上の人が命じたから\n罰したのではない、ということになる。"}, {"t": 1201.8166666666666, "x": "9月の停職の発表と、同じ線の上にある答えだ。"}, {"t": 1205.4, "x": "最初から最後まで、監督の責任なのね。"}, {"t": 1208.4, "x": "同じ日の委員会では、もう\n一つの事件も取り上げられていた。"}, {"t": 1212.0, "x": "震災の直後に警察署の中で\n労働運動の人たちが命を奪われた事件だ。"}, {"t": 1216.8166666666666, "x": "亀戸事件と呼ばれている。"}, {"t": 1218.5166666666667, "x": "内閣府の報告書によると、甘粕たちの裁判の中で\n出た証言から明るみに出た事件だ。"}, {"t": 1224.25, "x": "甘粕事件の裁判から、別の事件が？"}, {"t": 1227.1333333333334, "x": "そうだ。震災のあとの混乱の中で\n起きたことは、1件では終わっていなかった。"}, {"t": 1231.8666666666666, "x": "ただこの回では亀戸事件には深く入らない。"}, {"t": 1234.6833333333334, "x": "ここで押さえておくのは、\n陸軍大臣が国会で何を言ったかだ。"}, {"t": 1238.4833333333333, "x": "上の人の処分は、監督の責任。\nそれ以上の意味は無い。"}, {"t": 1242.1166666666666, "x": "これが軍がこの事件に付けた公式の締めくくりだった。"}, {"t": 1246.0666666666666, "x": "判決の記事には、弁護人の塚崎の話も載っている。"}, {"t": 1249.8, "x": "弁護人は判決をどう見たの？"}, {"t": 1251.8166666666666, "x": "まず十年の刑は重すぎると思う、と言っている。"}, {"t": 1254.6666666666667, "x": "その次の言葉が、少し引っかかる。"}, {"t": 1257.1333333333334, "x": "甘粕は部下の3人が無罪になったことを\n心から喜んでいる、と。"}, {"t": 1261.25, "x": "そしてこう続ける。"}, {"t": 1262.5, "x": "「これは同大尉が法廷で前後二回に亙り\n陳述を翻して擁護した結果」。"}, {"t": 1267.1333333333334, "x": "供述を変えたのは、部下を守るためだった、ってこと？"}, {"t": 1270.4833333333333, "x": "弁護人はそう言っている。"}, {"t": 1271.95, "x": "ここでさっきの3度変わった供述を思い出してほしい。"}, {"t": 1275.0333333333333, "x": "変わった理由を、弁護人は部下を\n守るためだったと説明した。"}, {"t": 1278.75, "x": "だがそう言っているのは弁護人だ。"}, {"t": 1280.8166666666666, "x": "本当のところは、分からないのね。"}, {"t": 1283.1166666666666, "x": "分からない。どの供述が本当だったのかを、\n判決は一つに決めて書いた。"}, {"t": 1287.7333333333333, "x": "決めた材料は供述と調書と死因の鑑定だった。"}, {"t": 1290.8166666666666, "x": "記事には獄中の甘粕が詠んだ歌も載っている。"}, {"t": 1293.6833333333334, "x": "「秋の夜半ひとやのとこに思うかな\nねざめがちなる母は如何にと」。"}, {"t": 1297.5166666666667, "x": "お母さんのことを詠んだの？"}, {"t": 1299.1833333333334, "x": "牢屋の床で眠れずにいる母を思う、という歌だ。"}, {"t": 1302.1166666666666, "x": "判決の記事にこの歌が一緒に載った。"}, {"t": 1304.5666666666666, "x": "同じ紙面の中に、3人の命を奪った\n筋と、母を思う歌が並んでいる。"}, {"t": 1309.4833333333333, "x": "読んだ人は複雑な気持ちになりそうね。"}, {"t": 1312.1166666666666, "x": "それも当時の世の中が割れていた\n理由の一つかもしれない。"}, {"t": 1315.4833333333333, "x": "上告の話は記事の見込みどおり聞こえてこない。"}, {"t": 1318.3333333333333, "x": "この判決が事件の公の筋として残った。"}, {"t": 1321.9333333333334, "x": "懲役10年の甘粕は、その後どうなったのか。"}, {"t": 1325.0333333333333, "x": "10年、刑務所にいたの？"}, {"t": 1326.7833333333333, "x": "いなかった。"}, {"t": 1327.6, "x": "途中で恩赦によって刑が短くなったと伝えられている。"}, {"t": 1330.9333333333334, "x": "そして1926年10月6日、ひそかに\n仮出獄したと当時の新聞が報じている。"}, {"t": 1336.85, "x": "判決からどのくらい？"}, {"t": 1338.4, "x": "判決が1923年12月8日だから、2年10か月ほどだ。"}, {"t": 1343.2333333333333, "x": "10年の判決で、3年たたずに？"}, {"t": 1345.7666666666667, "x": "そうだ。戦後の国会でも、このことは語られている。"}, {"t": 1349.0833333333333, "x": "1961年5月22日、衆議院の法務委員会。\nさっきの猪俣浩三 議員だ。"}, {"t": 1355.15, "x": "「三人の生命を奪った甘粕は十年の懲役」。"}, {"t": 1358.1, "x": "「しかも四年で仮出獄して\n満州国へ行って活動しておる」。"}, {"t": 1361.8333333333333, "x": "4年って言ってるわね。"}, {"t": 1363.3166666666666, "x": "議員の記憶の言い方だな。"}, {"t": 1364.85, "x": "新聞の日付で数えると、3年に届かない。"}, {"t": 1367.8833333333334, "x": "議員はこれを政治の暴力への刑が\n軽すぎた例として挙げた。"}, {"t": 1371.4, "x": "さらにもう一つ、記事がある。"}, {"t": 1373.2833333333333, "x": "1928年11月4日の新聞だ。"}, {"t": 1376.4166666666667, "x": "天皇の即位の儀式に合わせた恩赦で、刑が\n軽くなる人が7万人に上る、という記事。"}, {"t": 1381.9, "x": "その中にこう名前が挙がっている。"}, {"t": 1383.9, "x": "「社会主義者大杉栄殺害の甘粕前憲兵大尉」。"}, {"t": 1387.4166666666667, "x": "仮出獄したあとも、恩赦の対象になったの？"}, {"t": 1390.4833333333333, "x": "仮出獄は刑が終わったわけではないからな。"}, {"t": 1393.0333333333333, "x": "記事はほかの有名な事件の人の名前と\n一緒に、甘粕を並べている。"}, {"t": 1397.2833333333333, "x": "5年たっても新聞は\n「大杉栄の事件の甘粕」と書いていた。"}, {"t": 1401.6166666666666, "x": "世の中は忘れてなかったのね。"}, {"t": 1404.1666666666667, "x": "仮出獄のあと甘粕は日本を離れた。"}, {"t": 1406.7, "x": "まずフランスへ渡ったと伝えられている。"}, {"t": 1409.1166666666666, "x": "フランス……。大杉が追い出された国ね。"}, {"t": 1411.6, "x": "そうだ。偶然だが同じ国だ。"}, {"t": 1413.65, "x": "そのあと甘粕は満洲へ渡った。\nいまの中国の東北部だ。"}, {"t": 1417.45, "x": "満洲国という国が作られ、甘粕は\nその建国にも関わったとされる。"}, {"t": 1421.95, "x": "のちには満洲映画協会という\n映画会社の一番上の役に就いた。"}, {"t": 1426.0, "x": "映画の会社？"}, {"t": 1427.1166666666666, "x": "満洲で映画を作る会社だ。"}, {"t": 1428.95, "x": "ただ満洲での甘粕の話は、この回の主題から外れる。"}, {"t": 1432.65, "x": "ここで大事なのは、一つだけだ。"}, {"t": 1434.85, "x": "1945年8月20日。"}, {"t": 1437.1333333333334, "x": "戦争が終わった直後に、甘粕は満洲で亡くなった。"}, {"t": 1440.6, "x": "自ら命を絶ったとされている。54歳だった。"}, {"t": 1443.9166666666667, "x": "じゃあ甘粕に直接聞くことは……。"}, {"t": 1446.0666666666666, "x": "できなくなった。"}, {"t": 1447.1666666666667, "x": "あの夜、誰が何を命じたのか。"}, {"t": 1449.2666666666667, "x": "この回で読んだ記録の中には、\n本人がそれを語り直したものは無い。"}, {"t": 1453.45, "x": "森慶次郎のその後も、\nこの回の資料では追えていない。"}, {"t": 1456.7333333333333, "x": "手がかりがどんどん減っていくのね。"}, {"t": 1458.8, "x": "残ったのは判決の文と新聞の記事だけになった。"}, {"t": 1462.0, "x": "少なくとも1976年まではそう思われていた。"}, {"t": 1466.2, "x": "話を名古屋に移す。"}, {"t": 1467.6833333333334, "x": "名古屋市千種区に、覚王山日泰寺という寺がある。"}, {"t": 1470.95, "x": "その境内の一角に、橘宗一の墓がある。"}, {"t": 1474.2833333333333, "x": "名古屋に？"}, {"t": 1475.0833333333333, "x": "父親の橘惣三郎が、愛知県の出身だった。"}, {"t": 1478.55, "x": "惣三郎は息子のための碑を建てた。"}, {"t": 1481.1, "x": "建てたのは宗一が10歳になるはずの日だったと、\n名古屋大学の資料は書いている。"}, {"t": 1486.0666666666666, "x": "生きていたら10歳になる日……。"}, {"t": 1487.9, "x": "ところがこの碑は、いつのころからか\n行方が分からなくなった。"}, {"t": 1491.7, "x": "見つかったのは1972年ごろ。"}, {"t": 1494.1166666666666, "x": "寺の近くの草むらだった。"}, {"t": 1496.1166666666666, "x": "草むらにずっと？"}, {"t": 1497.3833333333334, "x": "どのくらいの間そこにあったのかは、\n資料に書かれていない。"}, {"t": 1500.8, "x": "見つかったあと、碑を守る会が作られた。"}, {"t": 1503.6833333333334, "x": "大杉にゆかりのある人や、名古屋で\n人権の問題に関わる人たちが加わった。"}, {"t": 1508.5333333333333, "x": "愛知県出身の市川房枝や、\nその周りの人たちも協力したとある。"}, {"t": 1513.0, "x": "そして1975年、日泰寺の中に墓地が整えられた。"}, {"t": 1517.2666666666667, "x": "鑑定書が見つかる1年前ね。"}, {"t": 1519.4333333333334, "x": "そうだ。1972年に碑、1975年に\n墓地、1976年に鑑定書。"}, {"t": 1526.2333333333333, "x": "50年近く表に出なかった物が、\n数年の間に続けて出てきた。"}, {"t": 1530.65, "x": "2015年の資料では、命日の前の日に\n墓前祭が開かれている、とある。"}, {"t": 1535.4333333333334, "x": "命日の前の日って、9月15日。"}, {"t": 1537.7666666666667, "x": "最初の張り込みの日と同じ日付ね。"}, {"t": 1540.25, "x": "偶然だが日付は重なる。"}, {"t": 1542.0166666666667, "x": "張り込みが空振りに終わった日だ。"}, {"t": 1544.0, "x": "その翌日に宗一は伯父と一緒に東京へ向かった。"}, {"t": 1547.8333333333333, "x": "碑の裏には父親の言葉が刻まれている。"}, {"t": 1550.6666666666667, "x": "名古屋大学の資料に、その文言が載っている。"}, {"t": 1553.5833333333333, "x": "「宗一（八才（七才の誤り））\nハ再渡日中東京大震災ノサイ大正十二年\n（一九二三年）"}, {"t": 1560.45, "x": "九月十六日夜、大杉栄野枝ト共ニ犬共ニ虐殺サル」。"}, {"t": 1564.7, "x": "犬どもって……。"}, {"t": 1565.7166666666667, "x": "父親が刻んだ言葉だ。"}, {"t": 1567.2666666666667, "x": "手を下した者たちを、そう呼んでいる。"}, {"t": 1569.5833333333333, "x": "ここで年齢を見てほしい。"}, {"t": 1571.1, "x": "碑には「八才」と刻まれ、そこに\n「七才の誤り」と添えられている。"}, {"t": 1576.1, "x": "8歳と7歳？"}, {"t": 1577.4166666666667, "x": "判決は「当七歳」。これは数え年だ。"}, {"t": 1580.1333333333334, "x": "生まれた1917年から数えると、満で6歳になる。"}, {"t": 1583.9833333333333, "x": "6歳、7歳、8歳。同じ男の子の年が、記録ごとに違う。"}, {"t": 1588.6, "x": "どうしてそんなことに？"}, {"t": 1590.0666666666666, "x": "数え年と満年齢の違いが、まず一つ。"}, {"t": 1592.85, "x": "碑の「八才」がなぜそうなったのかは、\n資料に書かれていない。"}, {"t": 1596.8833333333334, "x": "ただそれを直さずに「誤り」と\n書き添えた形で、碑は残っている。"}, {"t": 1601.4, "x": "碑の裏には歌も刻まれている。"}, {"t": 1603.5666666666666, "x": "「なでし子を夜半の嵐にた折られて\nあやめもわかぬものとなりけり」。"}, {"t": 1607.2166666666667, "x": "なでしこって花の？"}, {"t": 1608.6166666666666, "x": "なでしこはかわいい子という意味にも掛けてある。"}, {"t": 1611.0666666666666, "x": "あやめは宗一の母親の名前だ。"}, {"t": 1613.2333333333333, "x": "「あやめもわかぬ」は、\n物の見分けもつかない、という意味の言い回しだ。"}, {"t": 1617.2666666666667, "x": "夜の嵐にかわいい子を折り取られた。"}, {"t": 1619.3666666666666, "x": "母の名を重ねながら、何も\n分からなくなった、と詠んでいる。"}, {"t": 1623.15, "x": "判決の文とはまるで違う言葉ね。"}, {"t": 1625.5833333333333, "x": "判決は時刻と手順と理由を書いた。"}, {"t": 1627.9333333333334, "x": "父親は夜と嵐と子どもの年を刻んだ。"}, {"t": 1630.6333333333334, "x": "同じ夜のことを書いた、2つの記録だ。"}, {"t": 1633.9, "x": "では1976年の鑑定書の話に入る。"}, {"t": 1637.25, "x": "鑑定書を書いたのは、田中隆一という\n軍医だと伝えられている。"}, {"t": 1641.1, "x": "軍のお医者さん？"}, {"t": 1642.25, "x": "陸軍の衛戍病院に勤めていた。"}, {"t": 1644.2666666666667, "x": "衛戍は軍隊がその土地に置かれていることだ。"}, {"t": 1646.9833333333333, "x": "3人の遺体が井戸から引き上げられたとき、\n田中はその場に立ち会った。"}, {"t": 1651.15, "x": "そして20時間をかけて、3人を\n調べたと伝えられている。"}, {"t": 1654.9666666666667, "x": "20時間……。"}, {"t": 1655.9166666666667, "x": "鑑定書そのものは、別の軍医の名前で出された。"}, {"t": 1659.0166666666667, "x": "田中の手元に残っていたのは、\nその控えだったとされる。"}, {"t": 1662.65, "x": "控えってことは写しね。"}, {"t": 1664.3666666666666, "x": "そうだ。田中はのちに軍を退いて、医院を開いた。"}, {"t": 1667.6833333333334, "x": "その後、40歳でもう一度軍に呼ばれ、\n中国の戦場で亡くなったと伝えられている。"}, {"t": 1672.85, "x": "控えは田中の家にしまわれたままになった。"}, {"t": 1675.5666666666666, "x": "出された本物のほうは、どうなったの？"}, {"t": 1678.0166666666667, "x": "この回で読んだ資料には、\nその行方は書かれていない。"}, {"t": 1681.1, "x": "残っていたのが\n控えのほうだった、ということだけが分かっている。"}, {"t": 1684.7666666666667, "x": "もし控えが無ければ、所見の中身は\n誰も知らないままだったかもしれない。"}, {"t": 1689.1666666666667, "x": "家族も知らなかったのかしら。"}, {"t": 1691.1333333333334, "x": "そこまでは分からない。"}, {"t": 1692.45, "x": "分かっているのは、1976年8月に\n遺品の中から見つかったということだ。"}, {"t": 1697.7666666666667, "x": "そして8月26日、新聞がそれを報じた。"}, {"t": 1701.05, "x": "これは内閣府の報告書が書いている日付だ。"}, {"t": 1703.8666666666666, "x": "1923年9月から、53年後のことになる。"}, {"t": 1707.8, "x": "最初に言っていた、53年ね。"}, {"t": 1710.1333333333334, "x": "鑑定書はのちに、本にも収められて刊行されている。"}, {"t": 1713.4, "x": "国立国会図書館の目録にも、大杉・野枝・\n宗一の死因鑑定書という名前で載っている。"}, {"t": 1719.3333333333333, "x": "つまり誰でも中身を確かめられる形になった。"}, {"t": 1722.4166666666667, "x": "じゃあ何が書いてあったの？"}, {"t": 1724.0166666666667, "x": "次の章で話す。"}, {"t": 1725.9333333333334, "x": "まず合っていた所から言う。"}, {"t": 1727.5333333333333, "x": "鑑定書の死因は、首を圧迫されての窒息だった。"}, {"t": 1730.8333333333333, "x": "これは判決が引いた鑑定と同じだ。"}, {"t": 1733.3, "x": "そこは合ってるのね。"}, {"t": 1734.65, "x": "合っている。違ったのはほかの所見だ。"}, {"t": 1736.9833333333333, "x": "鑑定書を読んだ人たちは、大杉と\n野枝の体に骨折があったと伝えている。"}, {"t": 1741.6166666666666, "x": "肋骨などが何本も折れていた、と書く人がいる。"}, {"t": 1744.6666666666667, "x": "胸の骨などに激しい骨折があった、と\n紹介した記事もある。"}, {"t": 1748.6333333333334, "x": "骨が折れてた……？"}, {"t": 1749.7666666666667, "x": "ここで判決が書いた筋をもう一度思い出してほしい。"}, {"t": 1752.85, "x": "1人ずつ部屋に入り、背後から首を圧迫した。"}, {"t": 1755.8333333333333, "x": "判決はそう書いた。"}, {"t": 1757.25, "x": "その筋の中には、骨が折れるような\n出来事は書かれていない。"}, {"t": 1760.9666666666667, "x": "じゃあ判決に書いてないことがあったってこと？"}, {"t": 1763.65, "x": "少なくとも判決の文にはその所見が出てこない。"}, {"t": 1766.7666666666667, "x": "判決の証拠の欄が引いたのは、\n死因の一文だけだった。"}, {"t": 1770.3333333333333, "x": "鑑定書には書かれていた所見が、\n判決の文には入っていない。"}, {"t": 1774.1833333333334, "x": "これが最初に言った「合わない所」だ。"}, {"t": 1776.8166666666666, "x": "誰がそんなことをしたのかは、書いてあるの？"}, {"t": 1779.5, "x": "書いていない。鑑定書は体の状態を書く文書だ。"}, {"t": 1782.6166666666666, "x": "誰が何をしたかを書く文書ではない。"}, {"t": 1784.8333333333333, "x": "だからこの回でも、鑑定書から\n誰がやったかは言わない。"}, {"t": 1788.25, "x": "でも判決の筋とは合わないのよね。"}, {"t": 1790.5833333333333, "x": "合わない。だから判決の筋だけでは\n説明しきれない、と考える人がいる。"}, {"t": 1795.1333333333334, "x": "何人もが関わったのではないか、と読む人もいる。"}, {"t": 1798.2, "x": "ただそれは鑑定書を読んだ人の解釈だ。"}, {"t": 1800.7666666666667, "x": "鑑定書そのものが、そう書いているわけではない。"}, {"t": 1803.6, "x": "私たちが言えるのは、判決が書かなかった\n所見があった、というところまでだ。"}, {"t": 1808.4333333333334, "x": "それだけでも、大きいことよね。"}, {"t": 1810.5166666666667, "x": "大きい。判決は53年間、ただ一つの公の筋だった。"}, {"t": 1814.5666666666666, "x": "その筋に入っていない事実が、紙の形で出てきた。"}, {"t": 1818.05, "x": "判決を読むときの前提が、ここで変わったことになる。"}, {"t": 1821.9833333333333, "x": "鑑定書にはもう一つの働きがあった。"}, {"t": 1824.6, "x": "もう一つ？"}, {"t": 1825.566666666666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
