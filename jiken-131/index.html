<script>
const D={"name": "131", "file": "131_編集用", "dur": 2083.1, "segs": [], "subs": [{"t": 0.0, "x": "1976年8月26日。"}, {"t": 2.7666666666666666, "x": "新聞に1通の古い紙のことが載った。"}, {"t": 5.35, "x": "死因鑑定書。人がどうして\n亡くなったかを医師が書いた書類だ。"}, {"t": 9.116666666666667, "x": "書かれたのはその53年前の1923年9月だった。"}, {"t": 13.333333333333334, "x": "53年も前の書類？"}, {"t": 15.116666666666667, "x": "そうだ。誰にも知られずに、ある家にしまわれていた。"}, {"t": 18.2, "x": "鑑定書に名前があるのは3人だ。"}, {"t": 20.383333333333333, "x": "大杉栄、伊藤野枝、そして橘宗一という男の子。"}, {"t": 24.283333333333335, "x": "3人は1923年9月16日の夜、\n東京の憲兵隊の建物の中で命を奪われた。"}, {"t": 30.816666666666666, "x": "憲兵隊って軍の警察よね？"}, {"t": 32.983333333333334, "x": "陸軍の中で軍人の取り締まりや\n治安を受け持つ部隊だ。"}, {"t": 36.4, "x": "その年の12月、陸軍の裁判で判決が出ている。"}, {"t": 39.9, "x": "憲兵大尉の甘粕正彦に懲役10年。"}, {"t": 42.666666666666664, "x": "判決は3人の最期を文字で書き残した。"}, {"t": 45.38333333333333, "x": "ところが53年後に出てきた鑑定書は、\nそれと合わない所があった。"}, {"t": 49.78333333333333, "x": "合わない所？"}, {"t": 50.916666666666664, "x": "今回は判決が書いた筋と、\n53年後の鑑定書の食い違いを追う。"}, {"t": 55.3, "x": "そしてもう一つ。誰が命じたのか、という問いだ。"}, {"t": 58.45, "x": "これには判決も軍も最後まで答えを出していない。"}, {"t": 61.53333333333333, "x": "答えが出ていないのね。"}, {"t": 63.06666666666667, "x": "先に言っておく。3人の最期の様子は話さない。"}, {"t": 66.2, "x": "扱うのは紙に残った言葉のほうだ。"}, {"t": 69.2, "x": "話を1923年の9月に戻す。"}, {"t": 72.13333333333334, "x": "9月1日、関東大震災が起きた。"}, {"t": 74.76666666666667, "x": "東京と横浜の町は、揺れと火事で大きく焼けた。"}, {"t": 78.0, "x": "翌日には東京に戒厳令が敷かれている。"}, {"t": 80.78333333333333, "x": "戒厳令ってどういうもの？"}, {"t": 82.5, "x": "非常のときに軍が治安を受け持つ仕組みだ。"}, {"t": 85.06666666666666, "x": "町には根拠のないうわさが広がっていた。"}, {"t": 87.56666666666666, "x": "判決の文にはそのうわさがこう書かれている。"}, {"t": 90.18333333333334, "x": "「放火暴動の挙に出づべしとの流言喧伝せられ」。"}, {"t": 93.05, "x": "誰かが火を付けて回る、という\n話が飛び交ったということだ。"}, {"t": 96.7, "x": "そのうわさの裏に社会主義者がいる、という\n声もあったと判決は書く。"}, {"t": 100.91666666666667, "x": "社会主義者って、大杉栄のこと？"}, {"t": 103.51666666666667, "x": "大杉は無政府主義者だ。"}, {"t": 105.0, "x": "国の権力そのものを認めない考え方だな。"}, {"t": 107.98333333333333, "x": "当時、警察は主義者と呼ばれた\n人たちを次々に検束していた。"}, {"t": 112.16666666666667, "x": "検束というのは、警察が人を一時的に\n連れて行って留め置くことだ。"}, {"t": 116.41666666666667, "x": "戒厳令の下では、軍の側が警察を動かせる\n立場にもあったと伝えられている。"}, {"t": 121.28333333333333, "x": "ところが大杉は検束されていなかった。"}, {"t": 123.75, "x": "判決によると甘粕はそれを知って大杉を消すと決めた。"}, {"t": 127.18333333333334, "x": "9月15日の午後5時半ごろ。"}, {"t": 129.25, "x": "甘粕は部下の曹長、森慶次郎らと\n大杉の家の近くに張り込んだ。"}, {"t": 133.5, "x": "場所は東京府豊多摩郡淀橋町字柏木372番地。\nいまの新宿区のあたりだ。"}, {"t": 139.33333333333334, "x": "その日はどうなったの？"}, {"t": 140.81666666666666, "x": "大杉は家から出てこなかった。それで引き上げている。"}, {"t": 143.95, "x": "判決は「目的を達せず」と短く書いている。"}, {"t": 147.81666666666666, "x": "翌日の9月16日。大杉は朝から出かけていた。"}, {"t": 151.38333333333333, "x": "判決では午前10時ごろ伊藤野枝と外に出たとある。"}, {"t": 154.46666666666667, "x": "野枝は大杉と一緒に暮らしていた。"}, {"t": 156.4, "x": "婚姻の届けは出していなかった。"}, {"t": 158.6, "x": "どこへ行ったの？"}, {"t": 159.78333333333333, "x": "行き先は神奈川県の鶴見だ。"}, {"t": 161.81666666666666, "x": "震災のあと大杉の弟の家を\n見舞いに行ったと伝えられている。"}, {"t": 165.46666666666667, "x": "その家にたまたま大杉の妹と、その息子が来ていた。"}, {"t": 169.03333333333333, "x": "息子の名前が宗一。橘宗一だ。"}, {"t": 171.96666666666667, "x": "宗一くんはそこで初めて会ったの？"}, {"t": 174.28333333333333, "x": "そこまでは分からない。ただ宗一は\n東京に一緒に行くことになった。"}, {"t": 178.25, "x": "焼け跡を見たい、と言ったと伝えられている。"}, {"t": 180.75, "x": "こうして3人は、夕方に東京の家のほうへ戻ってくる。"}, {"t": 184.36666666666667, "x": "張り込みのことは、知らないのよね。"}, {"t": 186.61666666666667, "x": "知らない。その日も甘粕たちは昼過ぎから待っていた。"}, {"t": 189.95, "x": "判決では午後2時半ごろに再び張り込んだとある。"}, {"t": 193.03333333333333, "x": "前の日と同じ目的で、とわざわざ書いてある。"}, {"t": 195.88333333333333, "x": "そこで淀橋警察署の署員から話を聞いた。"}, {"t": 198.85, "x": "大杉は朝に出かけたが、夕方には\n帰るだろう、という話だ。"}, {"t": 202.83333333333334, "x": "警察の人が居場所を教えたってこと？"}, {"t": 205.3, "x": "判決にはそう書いてある。いつごろ\n帰るかを聞き出した、とな。"}, {"t": 209.05, "x": "そして甘粕たちは、家の近くの道で待つことにした。"}, {"t": 213.18333333333334, "x": "午後5時ごろ。3人が張り込みの場所に来た。"}, {"t": 215.98333333333332, "x": "甘粕と森は大杉に声を掛けた。"}, {"t": 218.21666666666667, "x": "取り調べたいことがあるので、\n憲兵隊まで来てほしい、と言った。"}, {"t": 222.1, "x": "断れなかったの？"}, {"t": 223.46666666666667, "x": "戒厳令の下で相手は軍の警察だ。"}, {"t": 225.91666666666666, "x": "判決の言葉では「同行を求め」とある。"}, {"t": 228.73333333333332, "x": "3人は東京市麹町区にあった\n東京憲兵隊へ連れて行かれた。"}, {"t": 232.76666666666668, "x": "いまの千代田区の、皇居に近いあたりだ。"}, {"t": 235.33333333333334, "x": "子どもも一緒に？"}, {"t": 236.56666666666666, "x": "一緒にだ。宗一は震災の少し前に日本へ来ていた。"}, {"t": 240.11666666666667, "x": "判決は宗一の年を「当七歳」と書いている。"}, {"t": 243.3, "x": "これは数え年だ。生まれた年から\n数えると、満で6歳になる。"}, {"t": 247.43333333333334, "x": "6歳……。"}, {"t": 248.56666666666666, "x": "3人は震災のあと使われていなかった\n元の隊長室で休まされた。"}, {"t": 252.76666666666668, "x": "ここから先の数時間を、判決は分刻みで書いている。"}, {"t": 256.25, "x": "ただこの回ではその中身を細かくは読まない。"}, {"t": 258.93333333333334, "x": "時刻と、判決が何を書いて何を\n書かなかったか。そこだけを見る。"}, {"t": 263.31666666666666, "x": "分かった。"}, {"t": 264.45, "x": "一つだけ先に言っておく。"}, {"t": 266.15, "x": "3人が憲兵隊に入るところを、警察は確かめていた。"}, {"t": 269.76666666666665, "x": "これがあとで軍が隠し通せなかった\n理由の一つになる。"}, {"t": 273.68333333333334, "x": "判決が書いた時刻を、順に並べる。"}, {"t": 276.15, "x": "午後8時。森が大杉を上の階の応接室へ連れて行った。"}, {"t": 279.8, "x": "午後8時30分ごろ。"}, {"t": 281.3, "x": "甘粕がその部屋に入った。"}, {"t": 283.21666666666664, "x": "判決は甘粕が大杉の背後から首を\n圧迫して窒息させた、と書いた。"}, {"t": 288.03333333333336, "x": "森はどうしていたの？"}, {"t": 289.43333333333334, "x": "判決では部屋の外の廊下で\n見張りをしていたとされた。"}, {"t": 292.6666666666667, "x": "そのあと甘粕と森は、下の階の事務室で話し合った。"}, {"t": 296.3333333333333, "x": "残った野枝と宗一をどうするか、という話だ。"}, {"t": 299.4, "x": "子どもまで……。"}, {"t": 300.53333333333336, "x": "判決は甘粕が宗一を大杉の子どもだと\n思い込んでいた、と書く。"}, {"t": 304.7, "x": "そして子どもに手を掛けるのは\n「情に於て忍びず」ためらった、と。"}, {"t": 308.76666666666665, "x": "そこへ森が放っておけば事が\n早く明るみに出る、と言った。"}, {"t": 312.31666666666666, "x": "甘粕はそれに同意した、と判決は書いている。"}, {"t": 315.3833333333333, "x": "自分たちではやらなかったの？"}, {"t": 317.26666666666665, "x": "判決では2人とも自分では手を下したくなかった。"}, {"t": 320.43333333333334, "x": "それで部下の上等兵2人に命じた、とされている。"}, {"t": 323.53333333333336, "x": "午後9時30分ごろ。"}, {"t": 324.9166666666667, "x": "甘粕は野枝の命を奪い、森は廊下で見張った。"}, {"t": 328.01666666666665, "x": "同じころ隣の部屋で宗一も命を奪われた。"}, {"t": 330.8333333333333, "x": "判決はそう書いた。"}, {"t": 332.3666666666667, "x": "午後8時から9時半まで、1時間半なのね。"}, {"t": 335.5, "x": "そうだ。3人の遺体は建物の裏の古い\n井戸に入れられたと伝えられている。"}, {"t": 339.9, "x": "判決が使った医師の鑑定は、\n3人とも窒息が死因だというものだった。"}, {"t": 344.5, "x": "この「鑑定」という言葉を、覚えておいてほしい。"}, {"t": 348.1333333333333, "x": "ここで宗一のことを話しておく。"}, {"t": 350.25, "x": "宗一は1917年、アメリカで生まれた。"}, {"t": 353.35, "x": "父親は橘惣三郎。アメリカに渡って\n貿易の仕事をしていた。"}, {"t": 357.53333333333336, "x": "母親は大杉栄の妹のあやめだ。"}, {"t": 360.1166666666667, "x": "アメリカのどこ？"}, {"t": 361.26666666666665, "x": "オレゴン州のポートランドだと伝えられている。"}, {"t": 363.75, "x": "アメリカはその国で生まれた\n子にアメリカの国籍を与える。"}, {"t": 367.06666666666666, "x": "だから宗一はアメリカの国籍も持っていた。"}, {"t": 369.95, "x": "日本とアメリカの、両方の国籍？"}, {"t": 372.45, "x": "そういうことになる。"}, {"t": 373.65, "x": "一家は震災の少し前に、たまたま日本へ来ていた。"}, {"t": 376.93333333333334, "x": "そして9月16日、伯父の大杉と一緒に東京へ向かった。"}, {"t": 380.8, "x": "宗一はただ居合わせただけだった。"}, {"t": 383.01666666666665, "x": "本当にたまたまなのね。"}, {"t": 384.71666666666664, "x": "名古屋大学の資料も、\n偶然居合わせたため、と書いている。"}, {"t": 388.26666666666665, "x": "この国籍のことは、のちに国会でも語られた。"}, {"t": 391.4166666666667, "x": "1985年5月17日、衆議院の外務委員会だ。"}, {"t": 395.6, "x": "河上民雄 議員がこの事件を\n思い出して、こう言っている。"}, {"t": 399.18333333333334, "x": "「アメリカ国籍所有者であったために、\n当時これは一種の外交問題になったことがある」。"}, {"t": 404.3833333333333, "x": "62年たっても、国会で話に出たのね。"}, {"t": 407.51666666666665, "x": "外国の国籍を持つ子どもが、\n軍の建物の中で亡くなった。"}, {"t": 411.53333333333336, "x": "それは日本の中だけで済む\n話ではなかった、ということだ。"}, {"t": 415.8, "x": "3人はその夜家に帰らなかった。"}, {"t": 417.96666666666664, "x": "家族や仲間はすぐにおかしいと気づいた。"}, {"t": 420.5, "x": "どうやって探したの？"}, {"t": 421.96666666666664, "x": "家の人はまずアメリカの大使館へ\n向かったと伝えられている。"}, {"t": 425.45, "x": "宗一がアメリカの国籍を持っていたからだ。"}, {"t": 428.1666666666667, "x": "そのあと警察に、行方を探してほしいと届け出た。"}, {"t": 431.56666666666666, "x": "警察は憲兵隊が連れて行ったことを知っていたのよね。"}, {"t": 434.9166666666667, "x": "知っていた。内閣府の報告書にも、そう書いてある。"}, {"t": 438.23333333333335, "x": "警察は、憲兵隊が大杉らを\n連れて行ったことを確かめていた。"}, {"t": 442.1333333333333, "x": "そして行方が分からなくなったと\n知って、内務大臣が閣議で取り上げた。"}, {"t": 446.55, "x": "内閣の会議で？"}, {"t": 447.9, "x": "そうだ。内務大臣は後藤新平。"}, {"t": 449.98333333333335, "x": "警察を受け持つ大臣だ。"}, {"t": 451.75, "x": "こうなると軍の中だけで片付けることはできない。"}, {"t": 454.6333333333333, "x": "陸軍大臣の田中義一は、\n事情をつかむとすぐに動いた。"}, {"t": 458.28333333333336, "x": "戒厳の司令官を交代させている。"}, {"t": 460.46666666666664, "x": "20日には憲兵の一番上の司令官と\n東京の憲兵隊長を停職にしたと発表した。"}, {"t": 465.98333333333335, "x": "一番上の人まで？"}, {"t": 467.48333333333335, "x": "理由は甘粕への監督が\n行き届かなかったから、というものだ。"}, {"t": 471.23333333333335, "x": "ここで覚えておいてほしい。"}, {"t": 472.71666666666664, "x": "処分の理由は「監督が行き届かなかった」だ。"}, {"t": 475.8333333333333, "x": "「命じた」ではない。"}, {"t": 477.75, "x": "新聞も動いていた。"}, {"t": 479.1, "x": "9月18日には、報知新聞の夕刊が\n報じたと伝えられている。"}, {"t": 483.35, "x": "大杉夫妻が子どもと一緒に憲兵隊に\n連れて行かれた、という内容だ。"}, {"t": 487.5833333333333, "x": "20日には読売新聞と時事新報が号外を出した。"}, {"t": 490.78333333333336, "x": "甘粕憲兵大尉が大杉栄を\n手に掛けた、という内容だった。"}, {"t": 494.8666666666667, "x": "すぐに名前まで出たのね。"}, {"t": 496.55, "x": "ところがそのあとが続かない。"}, {"t": 498.3333333333333, "x": "事件の記事はしばらく載せることを差し止められた。"}, {"t": 501.31666666666666, "x": "止められた？"}, {"t": 502.43333333333334, "x": "だから世の中には、断片だけが伝わった。"}, {"t": 505.25, "x": "司令官が急に代わった。"}, {"t": 506.7, "x": "憲兵が裁判にかけられる。"}, {"t": 508.53333333333336, "x": "でも何があったのかは、はっきり書かれない。"}, {"t": 511.1, "x": "震災のあとで町はただでさえうわさであふれていた。"}, {"t": 514.1, "x": "余計に不安になりそうね。"}, {"t": 515.8166666666667, "x": "9月24日。甘粕たちは陸軍の裁判、\n軍法会議にかけられた。"}, {"t": 520.3833333333333, "x": "これは内閣府の報告書にある日付だ。"}, {"t": 522.9, "x": "翌25日、軍は甘粕が大杉と「他2名」を\n連れて行って命を奪った、と公表した。"}, {"t": 528.8, "x": "他2名って誰なのか言わなかったの？"}, {"t": 531.0666666666667, "x": "言わなかった。名前が新聞に出たのは\n10月8日の公判のときだと伝えられている。"}, {"t": 536.0, "x": "そこで初めてそれが伊藤野枝と、\n6歳の男の子だと知られた。"}, {"t": 539.9, "x": "世の中は大きく揺れた、と伝えられている。"}, {"t": 543.1333333333333, "x": "ここで大杉栄という人のことを少し話す。"}, {"t": 546.1666666666666, "x": "どんな人だったの？"}, {"t": 547.55, "x": "父親は陸軍の軍人だった。"}, {"t": 549.4, "x": "愛知県のいまの津島市の出身だ。"}, {"t": 551.7333333333333, "x": "大杉自身も子どものころは軍人を目指していた。"}, {"t": 554.6666666666666, "x": "名古屋の陸軍の幼年学校に入っている。"}, {"t": 557.35, "x": "軍人の学校に？"}, {"t": 558.75, "x": "そうだ。ところが学校で問題を\n起こして、2年で退学になった。"}, {"t": 562.8, "x": "そのあと東京に出て、東京外国語学校で学んだ。"}, {"t": 566.1833333333333, "x": "そのころから社会運動に近づいていく。"}, {"t": 568.6166666666667, "x": "やがて無政府主義の活動家として\n知られるようになった。"}, {"t": 571.95, "x": "軍人を目指していた人が、軍に命を奪われたのね。"}, {"t": 575.4333333333333, "x": "名古屋大学の資料は、大杉は\n1923年に38歳だったと書いている。"}, {"t": 580.65, "x": "本も多く残した。その中に\n『日本脱出記』という一冊がある。"}, {"t": 584.95, "x": "震災の年に大杉がフランスへ渡ったときの記録だ。"}, {"t": 588.4, "x": "震災の年にフランス？"}, {"t": 590.1, "x": "前の年の11月20日。"}, {"t": 591.85, "x": "大杉のもとに1通の手紙が届いた。"}, {"t": 594.3166666666667, "x": "ドイツのベルリンで開く\n集まりに来ないか、という招待状だった。"}, {"t": 598.1, "x": "大杉は12月11日の晩、ひそかに家を抜け出した。"}, {"t": 601.7333333333333, "x": "上海を通ってフランスまで渡っている。"}, {"t": 604.1666666666666, "x": "ひそかにって……。"}, {"t": 605.3166666666667, "x": "大杉にはいつも警察の尾行がついていた。"}, {"t": 607.8833333333333, "x": "だから見つからないように出る\n必要があった、と本人が書いている。"}, {"t": 612.3, "x": "フランスでの大杉は、ドイツへ行く許可を待っていた。"}, {"t": 615.25, "x": "ところが許可は、いつまでも下りなかった。"}, {"t": 617.8, "x": "それでどうなったの？"}, {"t": 619.1166666666667, "x": "1923年5月1日。メーデーの日だ。"}, {"t": 622.4, "x": "大杉はパリ郊外のサン・ドニで捕まった。"}, {"t": 624.9166666666666, "x": "本人の記録では、集会で\n話をしたことがきっかけだった。"}, {"t": 628.7, "x": "付けられた罪の名は、秩序紊乱、\n官吏抗拒、旅券規則違反。"}, {"t": 633.0, "x": "外国で捕まったのね。"}, {"t": 634.7333333333333, "x": "3日目にパリのラ・サンテという監獄に送られた。"}, {"t": 637.5666666666667, "x": "本人によると入って24日目に出されて、\nそのまま国外へ追放になった。"}, {"t": 642.3, "x": "そして日本へ帰る船に乗る。"}, {"t": 644.0166666666667, "x": "船の名前は箱根丸だ。"}, {"t": 645.7833333333333, "x": "『日本脱出記』の一節の終わりには、こう日付がある。"}, {"t": 649.3166666666667, "x": "「1923年7月11日、箱根丸にて」。"}, {"t": 653.1166666666667, "x": "7月……。9月16日の2か月ちょっと前ね。"}, {"t": 656.3833333333333, "x": "そうだ。大杉は夏に日本へ戻って、\nその2か月後に命を奪われた。"}, {"t": 660.85, "x": "フランスの牢屋からは24日で出てこられた。"}, {"t": 663.55, "x": "日本の憲兵隊の建物からは、\nその夜のうちに出てこられなかった。"}, {"t": 667.75, "x": "本の中の大杉は、牢屋の暮らしまで\n面白がって書いている。"}, {"t": 671.4, "x": "葡萄酒やビールを並べてもいい牢屋だった、とな。"}, {"t": 674.3333333333334, "x": "明るい書き方なのね。"}, {"t": 675.9166666666666, "x": "この本が書かれた船の上で、大杉は\n秋に何が起きるかを知らない。"}, {"t": 679.9333333333333, "x": "その2か月後に何が待っているか、\n文の中からは何も読み取れない。"}, {"t": 684.65, "x": "伊藤野枝のことも話しておく。"}, {"t": 686.5, "x": "野枝は女性たちが作った雑誌『青鞜』の仲間だった。"}, {"t": 690.1333333333333, "x": "青鞜って聞いたことがあるわ。"}, {"t": 692.0, "x": "女性が自分の言葉で書くための雑誌だ。"}, {"t": 694.5166666666667, "x": "野枝は1912年、17歳でその仲間に加わった。"}, {"t": 698.3, "x": "のちに編集でも大きな役目を果たしている。"}, {"t": 701.0166666666667, "x": "17歳で……。"}, {"t": 702.15, "x": "そして大杉と出会い、一緒に暮らすようになった。"}, {"t": 705.0333333333333, "x": "2人の暮らしは、当時の新聞で何度も騒がれた。"}, {"t": 708.1833333333333, "x": "ただこの回ではその話はしない。"}, {"t": 710.3666666666667, "x": "どうして？"}, {"t": 711.5, "x": "この回の主役は、判決と\n鑑定書という2枚の紙だからだ。"}, {"t": 715.3833333333333, "x": "野枝は28年の生涯だったと伝えられている。"}, {"t": 718.3333333333334, "x": "判決は野枝の命を奪う理由をこう書いた。"}, {"t": 720.8833333333333, "x": "大杉の妻で考えが同じだったから。"}, {"t": 723.3, "x": "さらに女性の主義者はかえって男より\n激しい、という言い回しまで使っている。"}, {"t": 727.8666666666667, "x": "それが理由として書かれてるの？"}, {"t": 729.85, "x": "判決の文にそのまま残っている。"}, {"t": 732.0166666666667, "x": "これは判決が認めた甘粕の考えであって、\n事実の説明ではない。"}, {"t": 736.35, "x": "100年前の裁判の文が、何を理由として書いたか。"}, {"t": 739.7166666666667, "x": "それ自体がこの事件の記録の一部だ。"}, {"t": 742.7666666666667, "x": "軍法会議の公判は、10月8日に始まった。"}, {"t": 745.9, "x": "ここで甘粕の言うことが、何度も変わっていく。"}, {"t": 748.8833333333333, "x": "変わるってどんなふうに？"}, {"t": 750.3833333333333, "x": "最初、甘粕は自分の考えで3人の命を\n奪った、と認めていたと伝えられている。"}, {"t": 755.7166666666667, "x": "ところが公判では、子どもには\n手を掛けていない、と言い出した。"}, {"t": 759.3, "x": "子どもが亡くなったのは、あとで\n知ったと言ったとされている。"}, {"t": 762.7166666666667, "x": "じゃあ宗一くんのことは誰が？"}, {"t": 764.7, "x": "そこが宙に浮いてしまった。"}, {"t": 766.3833333333333, "x": "甘粕の弁護人は塚崎直義という弁護士だった。"}, {"t": 769.6333333333333, "x": "子どもの件があいまいなままだ、と\n食い下がったと伝えられている。"}, {"t": 773.25, "x": "陸軍は子どもの件を調べ直すよう命じた。"}, {"t": 775.95, "x": "するとその途中で、憲兵の上等兵2人が\n自分から名乗り出た。"}, {"t": 780.1, "x": "自首したのね。"}, {"t": 781.25, "x": "調書には昨日8日の公判で甘粕が\n否定したので、という言葉がある。"}, {"t": 785.4833333333333, "x": "続いてもう1人の伍長も関わりを認めた。"}, {"t": 788.15, "x": "こうして裁かれる人は5人になった。"}, {"t": 790.4333333333333, "x": "上等兵の1人は、こう話したとされる。"}, {"t": 793.0666666666667, "x": "事が明るみに出たときは、甘粕と\n森が責任を負うと言われていた。"}, {"t": 797.1166666666667, "x": "だから信じていたが、公判で甘粕が\n子どもの件を否定したので名乗り出た、と。"}, {"t": 802.1, "x": "上の人の言葉を信じていたのに……。"}, {"t": 804.35, "x": "甘粕の供述はそのあともう一度変わる。"}, {"t": 806.9, "x": "森は「子どもも」と甘粕が命じたと言った。"}, {"t": 809.8166666666667, "x": "それを聞いた甘粕は、命令しましたと\n認めたと伝えられている。"}, {"t": 813.6333333333333, "x": "最初、否定、また肯定。"}, {"t": 815.4333333333333, "x": "3度変わったことになる。"}, {"t": 817.6833333333333, "x": "11月24日。検察の側が求めた刑が示された。"}, {"t": 821.6, "x": "甘粕に懲役15年、森に5年。"}, {"t": 823.85, "x": "上等兵2人に2年ずつ、伍長に\n1年6か月と伝えられている。"}, {"t": 828.2666666666667, "x": "それで判決は？"}, {"t": 829.55, "x": "12月8日。東京の第一師団の軍法会議で\n判決が言い渡された。"}, {"t": 834.0833333333334, "x": "大阪朝日新聞は翌9日、その判決の全文を載せている。"}, {"t": 838.1666666666666, "x": "この回はその新聞の文を主な手がかりにしている。"}, {"t": 841.15, "x": "主文はこうだ。"}, {"t": 842.1666666666666, "x": "甘粕正彦、懲役10年。"}, {"t": 844.1166666666667, "x": "森慶次郎、懲役3年。"}, {"t": 846.05, "x": "そして部下の憲兵3人は、無罪。"}, {"t": 848.5333333333333, "x": "3人とも無罪なの？"}, {"t": 850.1, "x": "そうだ。理由はあとで話す。"}, {"t": 851.9333333333333, "x": "記事によると法廷が開いたのは午前10時ちょうど。"}, {"t": 854.8, "x": "閉じたのは午前10時20分だった。"}, {"t": 857.1833333333333, "x": "20分で終わったの？"}, {"t": 858.6833333333333, "x": "判決を読み上げるだけの日だったからな。"}, {"t": 861.1166666666667, "x": "最後に判士長は言った。"}, {"t": 862.55, "x": "「若しこの判決に不服ならば三日以内に上告せよ」。"}, {"t": 865.8833333333333, "x": "記事は、甘粕は服するらしいとも書いている。"}, {"t": 868.65, "x": "検察の側も上告はしないらしいと伝えている。"}, {"t": 871.7, "x": "じゃあこれで決まり？"}, {"t": 872.8666666666667, "x": "決まった。裁判で認められた筋は、ここで固まった。"}, {"t": 876.35, "x": "この「認められた筋」と、\n53年後の鑑定書を、あとで並べる。"}, {"t": 881.4166666666666, "x": "判決の日の法廷の様子も、記事に残っている。"}, {"t": 884.5, "x": "甘粕は40日あまりの獄中で、少し頬がこけていた。"}, {"t": 888.2166666666667, "x": "頭をきれいに刈り込み、鼻の下の\nひげを落としていた、とある。"}, {"t": 892.0833333333334, "x": "細かく書いてあるのね。"}, {"t": 893.6666666666666, "x": "判士長が「今より判決を言渡す」と言った。"}, {"t": 896.8, "x": "主文が読まれると、甘粕は少し頭を前に垂れた。"}, {"t": 900.25, "x": "そのとき傍聴席から「裁判長」と怒鳴る声がした。"}, {"t": 903.8833333333333, "x": "誰かが叫んだの？"}, {"t": 905.3, "x": "さらに理由を読み上げている途中だ。"}, {"t": 907.3333333333334, "x": "傍聴席の男がはいていた泥の草履を投げつけた。"}, {"t": 910.4666666666667, "x": "草履は法務官の肩を越えて、\n師団長の目の前に落ちた。"}, {"t": 914.1166666666667, "x": "師団長の前に……！"}, {"t": 915.4333333333333, "x": "男はすぐ憲兵に連れ出された。"}, {"t": 917.5166666666667, "x": "記事によると男は甘粕を応援していた人だった。"}, {"t": 920.7166666666667, "x": "応援していた人が、怒ったの？"}, {"t": 922.95, "x": "判決が重すぎる、という怒りだったと読める。"}, {"t": 925.75, "x": "当時、甘粕の刑を軽くしてほしいという\n声は少なくなかった、と伝えられている。"}, {"t": 930.7, "x": "一方で軽すぎると考えた人もいた。"}, {"t": 933.1333333333333, "x": "同じ判決に両方から声が上がっていた。"}, {"t": 935.8166666666667, "x": "重いのか軽いのか、見方が割れてたのね。"}, {"t": 938.5833333333334, "x": "無罪の3人の顔には微笑が\n浮かんでいた、と記事は書いている。"}, {"t": 942.85, "x": "部下の3人が無罪になった理由を見ておく。"}, {"t": 945.4333333333333, "x": "まず上等兵2人だ。"}, {"t": 946.9333333333333, "x": "判決は2人が宗一の命を奪ったことは認めている。"}, {"t": 950.5333333333333, "x": "認めているのに、無罪？"}, {"t": 952.25, "x": "判決の言葉では、こうだ。"}, {"t": 954.1, "x": "「罪となるべき事実を知らずして犯したるもの」。"}, {"t": 956.8666666666667, "x": "つまり罪を犯すつもりがなかった、という扱いだ。"}, {"t": 959.95, "x": "上官の命令を職務上の命令だと信じて従った。"}, {"t": 963.25, "x": "戒厳令の下でそれが犯罪だと考える余地が無かった。"}, {"t": 966.7, "x": "判決は2人の言い分をそう受け止めた。"}, {"t": 969.2166666666667, "x": "命令だったから、ってことね。"}, {"t": 971.15, "x": "伍長については、別の理由だ。"}, {"t": 973.1666666666666, "x": "現場の近くにいたことは確かだと判決は書いた。"}, {"t": 976.2666666666667, "x": "だが事情を知って見張りをしたという\n証拠は十分でない。だから無罪だ。"}, {"t": 980.4166666666666, "x": "命じた側が10年と3年。従った側が無罪。"}, {"t": 983.6833333333333, "x": "この形は戦後の国会でも取り上げられた。"}, {"t": 986.35, "x": "1958年8月9日、衆議院の法務委員会。"}, {"t": 990.2333333333333, "x": "猪俣浩三 議員の発言だ。"}, {"t": 992.45, "x": "議員は手を下した者の何人かは\n無罪になった、と記憶をたどって話している。"}, {"t": 997.1, "x": "議員は上官の命令に下の者がどこまで\n従うべきか、という話の例に挙げた。"}, {"t": 1001.9833333333333, "x": "35年たっても、この判決は命令と\n責任の話の例に引かれていた。"}, {"t": 1006.8166666666667, "x": "命令した人と従った人の責任ね。"}, {"t": 1009.6166666666667, "x": "そうだ。そしてその命令の一番上は誰だったのか。"}, {"t": 1012.85, "x": "判決は甘粕と森の2人で止めている。"}, {"t": 1016.0666666666667, "x": "判決の文にはもう一つ気になる所がある。"}, {"t": 1018.85, "x": "甘粕が大杉を狙うと決めた、そのきっかけの書き方だ。"}, {"t": 1022.6333333333333, "x": "きっかけ？"}, {"t": 1023.75, "x": "判決によると、甘粕はある話を聞き込んだ。"}, {"t": 1026.8166666666666, "x": "淀橋警察署に、大杉を「やっつけろ」的な\n意向がある、という話だ。"}, {"t": 1031.5833333333333, "x": "甘粕は森にそれが本当か確かめさせた。"}, {"t": 1034.35, "x": "9月15日の朝、森は警察署の意向だとして、\nこう報告したとされる。"}, {"t": 1039.1, "x": "憲兵隊の手で大杉をやってくれれば、\n尾行を外すなどの手助けをする、と。"}, {"t": 1043.7666666666667, "x": "警察がそんなことを頼んだの？"}, {"t": 1045.8666666666666, "x": "判決には甘粕たちの側の話としてそう書かれた。"}, {"t": 1049.2, "x": "だが警察署の2人は、これを\n否定したと伝えられている。"}, {"t": 1052.6833333333334, "x": "そして判決の4日前の12月4日、2人は\n起訴されないことになった、と新聞が報じたとされる。"}, {"t": 1059.05, "x": "じゃあ警察の頼みは無かったってこと？"}, {"t": 1061.45, "x": "検事局は、甘粕たちがその前から\n決めていたのは明らかだと見た。"}, {"t": 1065.6333333333334, "x": "そう伝えられている。"}, {"t": 1066.85, "x": "つまり頼まれたから動いた、という筋は採らなかった。"}, {"t": 1070.0666666666666, "x": "それでも判決の文には、\n淀橋警察署の名前が残っている。"}, {"t": 1074.15, "x": "判決の中に確かめられなかった話も入ってるのね。"}, {"t": 1077.7166666666667, "x": "判決は裁く側が認めた筋をまとめた文だ。"}, {"t": 1080.7333333333333, "x": "その中には被告の言い分がそのまま\n理由として組み込まれた所もある。"}, {"t": 1084.8666666666666, "x": "判決を読むときは、誰の言葉がどこに\n入っているかを見分ける必要がある。"}, {"t": 1089.3, "x": "この見分け方は、あとで鑑定書を読むときにも使う。"}, {"t": 1093.1333333333334, "x": "ここで判決の中の「証拠」の欄を見る。"}, {"t": 1095.9833333333333, "x": "判決は何を根拠に事実を認めたかを並べている。"}, {"t": 1099.3333333333333, "x": "何が並んでるの？"}, {"t": 1100.6666666666667, "x": "甘粕の公判での供述。"}, {"t": 1102.3666666666666, "x": "予審の調書。森の供述。"}, {"t": 1104.3333333333333, "x": "上等兵2人の供述。"}, {"t": 1106.1166666666666, "x": "それからある商人の話もある。"}, {"t": 1108.1166666666666, "x": "その夜、甘粕に「君は子供があるか」と\n聞かれた、という証言だ。"}, {"t": 1112.6666666666667, "x": "子どもがいるか、って？"}, {"t": 1114.1166666666666, "x": "子どもを育ててくれる人はいないか、という\n意味の話をされたらしい。"}, {"t": 1117.9833333333333, "x": "商人が困ると甘粕は\n「君は東京だからなー」と言って話をやめた。"}, {"t": 1122.5666666666666, "x": "宗一くんをどこかに預けようとしてたのかしら。"}, {"t": 1125.4833333333333, "x": "そう読む人もいる。だが判決は\nそこに理由をつけていない。"}, {"t": 1128.95, "x": "そして証拠の最後に、医師の鑑定が出てくる。"}, {"t": 1131.8166666666666, "x": "判決が引いたのは、この一文だけだ。"}, {"t": 1134.3333333333333, "x": "3人の死因はいずれも首を強く\n圧迫されての窒息だ、という記載。"}, {"t": 1138.7166666666667, "x": "死因だけ？"}, {"t": 1139.85, "x": "死因だけだ。"}, {"t": 1140.9666666666667, "x": "体にほかの傷があったかどうか。"}, {"t": 1142.9, "x": "判決の証拠の欄には、それが出てこない。"}, {"t": 1145.65, "x": "判決が描いた筋は「1人ずつ、\n背後から首を」というものだった。"}, {"t": 1150.0166666666667, "x": "鑑定の「死因」は、その筋と合っている。"}, {"t": 1152.9166666666667, "x": "じゃあ合っていない所って？"}, {"t": 1154.5666666666666, "x": "それが分かるのが、53年後だ。"}, {"t": 1156.8333333333333, "x": "その前に軍がこの事件をどう\n締めくくったかを見ておく。"}, {"t": 1160.6166666666666, "x": "判決から8日後の12月16日。舞台は衆議院だ。"}, {"t": 1164.35, "x": "予算を話し合う委員会で、この事件が取り上げられた。"}, {"t": 1167.5833333333333, "x": "前の日に渡辺脩という議員が質問していた。"}, {"t": 1170.6, "x": "それに陸軍大臣の田中義一が答えている。"}, {"t": 1173.5333333333333, "x": "なんて答えたの？"}, {"t": 1174.8, "x": "大阪朝日新聞の記事に、答弁がこう残っている。"}, {"t": 1178.0, "x": "「小泉憲兵司令官及び憲兵隊長を\n免官したのは甘粕事件に関連し」。"}, {"t": 1182.7833333333333, "x": "「不取締の廉で懲罰したので\n何等他に意味を有しない」。"}, {"t": 1186.4166666666667, "x": "ふとりしまりのかど？"}, {"t": 1187.7833333333333, "x": "取り締まりが行き届かなかった、という\n理由で罰した、という意味だ。"}, {"t": 1191.6833333333334, "x": "最後の一言が大事だ。"}, {"t": 1193.25, "x": "「何等他に意味を有しない」。"}, {"t": 1195.0333333333333, "x": "他の意味は無い、って？"}, {"t": 1196.5166666666667, "x": "上の人を罰したのは監督の責任だけで、\nそれ以上の意味は無い。"}, {"t": 1200.4833333333333, "x": "つまり上の人が命じたから\n罰したのではない、ということになる。"}, {"t": 1204.1666666666667, "x": "9月の停職の発表と、同じ線の上にある答えだ。"}, {"t": 1207.75, "x": "最初から最後まで、監督の責任なのね。"}, {"t": 1210.75, "x": "同じ日の委員会では、もう\n一つの事件も取り上げられていた。"}, {"t": 1214.3666666666666, "x": "震災の直後に警察署の中で\n労働運動の人たちが命を奪われた事件だ。"}, {"t": 1219.1833333333334, "x": "亀戸事件と呼ばれている。"}, {"t": 1220.8666666666666, "x": "内閣府の報告書によると、甘粕たちの裁判の中で\n出た証言から明るみに出た事件だ。"}, {"t": 1226.6, "x": "甘粕事件の裁判から、別の事件が？"}, {"t": 1229.4833333333333, "x": "そうだ。震災のあとの混乱の中で\n起きたことは、1件では終わっていなかった。"}, {"t": 1234.2166666666667, "x": "ただこの回では亀戸事件には深く入らない。"}, {"t": 1237.05, "x": "ここで押さえておくのは、\n陸軍大臣が国会で何を言ったかだ。"}, {"t": 1240.8333333333333, "x": "上の人の処分は、監督の責任。\nそれ以上の意味は無い。"}, {"t": 1244.4666666666667, "x": "これが軍がこの事件に付けた公式の締めくくりだった。"}, {"t": 1248.4166666666667, "x": "判決の記事には、弁護人の塚崎の話も載っている。"}, {"t": 1252.15, "x": "弁護人は判決をどう見たの？"}, {"t": 1254.1666666666667, "x": "まず十年の刑は重すぎると思う、と言っている。"}, {"t": 1257.0166666666667, "x": "その次の言葉が、少し引っかかる。"}, {"t": 1259.4833333333333, "x": "甘粕は部下の3人が無罪になったことを\n心から喜んでいる、と。"}, {"t": 1263.6, "x": "そしてこう続ける。"}, {"t": 1264.8666666666666, "x": "「これは同大尉が法廷で前後二回に亙り\n陳述を翻して擁護した結果」。"}, {"t": 1269.4833333333333, "x": "供述を変えたのは、部下を守るためだった、ってこと？"}, {"t": 1272.8333333333333, "x": "弁護人はそう言っている。"}, {"t": 1274.3, "x": "ここでさっきの3度変わった供述を思い出してほしい。"}, {"t": 1277.4, "x": "変わった理由を、弁護人は部下を\n守るためだったと説明した。"}, {"t": 1281.1, "x": "だがそう言っているのは弁護人だ。"}, {"t": 1283.1666666666667, "x": "本当のところは、分からないのね。"}, {"t": 1285.4666666666667, "x": "分からない。どの供述が本当だったのかを、\n判決は一つに決めて書いた。"}, {"t": 1290.0833333333333, "x": "決めた材料は供述と調書と死因の鑑定だった。"}, {"t": 1293.1833333333334, "x": "記事には獄中の甘粕が詠んだ歌も載っている。"}, {"t": 1296.0333333333333, "x": "「秋の夜半ひとやのとこに思うかな\nねざめがちなる母は如何にと」。"}, {"t": 1299.8666666666666, "x": "お母さんのことを詠んだの？"}, {"t": 1301.5333333333333, "x": "牢屋の床で眠れずにいる母を思う、という歌だ。"}, {"t": 1304.4666666666667, "x": "判決の記事にこの歌が一緒に載った。"}, {"t": 1306.9166666666667, "x": "同じ紙面の中に、3人の命を奪った\n筋と、母を思う歌が並んでいる。"}, {"t": 1311.8333333333333, "x": "読んだ人は複雑な気持ちになりそうね。"}, {"t": 1314.4666666666667, "x": "それも当時の世の中が割れていた\n理由の一つかもしれない。"}, {"t": 1317.8333333333333, "x": "上告の話は記事の見込みどおり聞こえてこない。"}, {"t": 1320.6833333333334, "x": "この判決が事件の公の筋として残った。"}, {"t": 1324.2833333333333, "x": "懲役10年の甘粕は、その後どうなったのか。"}, {"t": 1327.3833333333334, "x": "10年、刑務所にいたの？"}, {"t": 1329.1333333333334, "x": "いなかった。"}, {"t": 1330.2666666666667, "x": "途中で恩赦によって刑が短くなったと伝えられている。"}, {"t": 1333.6, "x": "そして1926年10月6日、ひそかに\n仮出獄したと当時の新聞が報じている。"}, {"t": 1339.5166666666667, "x": "判決からどのくらい？"}, {"t": 1341.05, "x": "判決が1923年12月8日だから、2年10か月ほどだ。"}, {"t": 1345.9, "x": "10年の判決で、3年たたずに？"}, {"t": 1348.4333333333334, "x": "そうだ。戦後の国会でも、このことは語られている。"}, {"t": 1351.75, "x": "1961年5月22日、衆議院の法務委員会。\nさっきの猪俣浩三 議員だ。"}, {"t": 1357.8166666666666, "x": "「三人の生命を奪った甘粕は十年の懲役」。"}, {"t": 1360.7666666666667, "x": "「しかも四年で仮出獄して\n満州国へ行って活動しておる」。"}, {"t": 1364.4833333333333, "x": "4年って言ってるわね。"}, {"t": 1365.9833333333333, "x": "議員の記憶の言い方だな。"}, {"t": 1367.5166666666667, "x": "新聞の日付で数えると、3年に届かない。"}, {"t": 1370.55, "x": "議員はこれを政治の暴力への刑が\n軽すぎた例として挙げた。"}, {"t": 1374.0666666666666, "x": "さらにもう一つ、記事がある。"}, {"t": 1375.95, "x": "1928年11月4日の新聞だ。"}, {"t": 1379.0833333333333, "x": "天皇の即位の儀式に合わせた恩赦で、刑が\n軽くなる人が7万人に上る、という記事。"}, {"t": 1384.5666666666666, "x": "その中にこう名前が挙がっている。"}, {"t": 1386.55, "x": "「社会主義者大杉栄殺害の甘粕前憲兵大尉」。"}, {"t": 1390.0833333333333, "x": "仮出獄したあとも、恩赦の対象になったの？"}, {"t": 1393.1333333333334, "x": "仮出獄は刑が終わったわけではないからな。"}, {"t": 1395.7, "x": "記事はほかの有名な事件の人の名前と\n一緒に、甘粕を並べている。"}, {"t": 1399.95, "x": "5年たっても新聞は\n「大杉栄の事件の甘粕」と書いていた。"}, {"t": 1404.2833333333333, "x": "世の中は忘れてなかったのね。"}, {"t": 1406.8333333333333, "x": "仮出獄のあと甘粕は日本を離れた。"}, {"t": 1409.3666666666666, "x": "まずフランスへ渡ったと伝えられている。"}, {"t": 1411.7833333333333, "x": "フランス……。大杉が追い出された国ね。"}, {"t": 1414.2666666666667, "x": "そうだ。偶然だが同じ国だ。"}, {"t": 1416.3166666666666, "x": "そのあと甘粕は満洲へ渡った。\nいまの中国の東北部だ。"}, {"t": 1420.1166666666666, "x": "満洲国という国が作られ、甘粕は\nその建国にも関わったとされる。"}, {"t": 1424.6166666666666, "x": "のちには満洲映画協会という\n映画会社の一番上の役に就いた。"}, {"t": 1428.6666666666667, "x": "映画の会社？"}, {"t": 1429.85, "x": "満洲で映画を作る会社だ。"}, {"t": 1431.6833333333334, "x": "ただ満洲での甘粕の話は、この回の主題から外れる。"}, {"t": 1435.3833333333334, "x": "ここで大事なのは、一つだけだ。"}, {"t": 1437.5833333333333, "x": "1945年8月20日。"}, {"t": 1439.8666666666666, "x": "戦争が終わった直後に、甘粕は満洲で亡くなった。"}, {"t": 1443.3333333333333, "x": "自ら命を絶ったとされている。54歳だった。"}, {"t": 1446.65, "x": "じゃあ甘粕に直接聞くことは……。"}, {"t": 1448.8, "x": "できなくなった。"}, {"t": 1449.8833333333334, "x": "あの夜、誰が何を命じたのか。"}, {"t": 1451.9833333333333, "x": "この回で読んだ記録の中には、\n本人がそれを語り直したものは無い。"}, {"t": 1456.1833333333334, "x": "森慶次郎のその後も、\nこの回の資料では追えていない。"}, {"t": 1459.4666666666667, "x": "手がかりがどんどん減っていくのね。"}, {"t": 1461.5333333333333, "x": "残ったのは判決の文と新聞の記事だけになった。"}, {"t": 1464.7166666666667, "x": "少なくとも1976年まではそう思われていた。"}, {"t": 1468.9333333333334, "x": "話を名古屋に移す。"}, {"t": 1470.4166666666667, "x": "名古屋市千種区に、覚王山日泰寺という寺がある。"}, {"t": 1473.6833333333334, "x": "その境内の一角に、橘宗一の墓がある。"}, {"t": 1477.0, "x": "名古屋に？"}, {"t": 1478.1333333333334, "x": "父親の橘惣三郎が、愛知県の出身だった。"}, {"t": 1481.6, "x": "惣三郎は息子のための碑を建てた。"}, {"t": 1484.15, "x": "建てたのは宗一が10歳になるはずの日だったと、\n名古屋大学の資料は書いている。"}, {"t": 1489.1166666666666, "x": "生きていたら10歳になる日……。"}, {"t": 1490.95, "x": "ところがこの碑は、いつのころからか\n行方が分からなくなった。"}, {"t": 1494.75, "x": "見つかったのは1972年ごろ。"}, {"t": 1497.15, "x": "寺の近くの草むらだった。"}, {"t": 1499.1666666666667, "x": "草むらにずっと？"}, {"t": 1500.4333333333334, "x": "どのくらいの間そこにあったのかは、\n資料に書かれていない。"}, {"t": 1503.85, "x": "見つかったあと、碑を守る会が作られた。"}, {"t": 1506.7333333333333, "x": "大杉にゆかりのある人や、名古屋で\n人権の問題に関わる人たちが加わった。"}, {"t": 1511.5833333333333, "x": "愛知県出身の市川房枝や、\nその周りの人たちも協力したとある。"}, {"t": 1516.05, "x": "そして1975年、日泰寺の中に墓地が整えられた。"}, {"t": 1520.3166666666666, "x": "鑑定書が見つかる1年前ね。"}, {"t": 1522.4833333333333, "x": "そうだ。1972年に碑、1975年に\n墓地、1976年に鑑定書。"}, {"t": 1529.2833333333333, "x": "50年近く表に出なかった物が、\n数年の間に続けて出てきた。"}, {"t": 1533.7, "x": "2015年の資料では、命日の前の日に\n墓前祭が開かれている、とある。"}, {"t": 1538.4833333333333, "x": "命日の前の日って、9月15日。"}, {"t": 1540.8166666666666, "x": "最初の張り込みの日と同じ日付ね。"}, {"t": 1543.3, "x": "偶然だが日付は重なる。"}, {"t": 1545.0666666666666, "x": "張り込みが空振りに終わった日だ。"}, {"t": 1547.0333333333333, "x": "その翌日に宗一は伯父と一緒に東京へ向かった。"}, {"t": 1550.8833333333334, "x": "碑の裏には父親の言葉が刻まれている。"}, {"t": 1553.7166666666667, "x": "名古屋大学の資料に、その文言が載っている。"}, {"t": 1556.6333333333334, "x": "「宗一（八才（七才の誤り））\nハ再渡日中東京大震災ノサイ大正十二年\n（一九二三年）"}, {"t": 1563.5, "x": "九月十六日夜、大杉栄野枝ト共ニ犬共ニ虐殺サル」。"}, {"t": 1567.75, "x": "犬どもって……。"}, {"t": 1568.8833333333334, "x": "父親が刻んだ言葉だ。"}, {"t": 1570.4166666666667, "x": "手を下した者たちを、そう呼んでいる。"}, {"t": 1572.75, "x": "ここで年齢を見てほしい。"}, {"t": 1574.25, "x": "碑には「八才」と刻まれ、そこに\n「七才の誤り」と添えられている。"}, {"t": 1579.2666666666667, "x": "8歳と7歳？"}, {"t": 1580.5666666666666, "x": "判決は「当七歳」。これは数え年だ。"}, {"t": 1583.3, "x": "生まれた1917年から数えると、満で6歳になる。"}, {"t": 1587.15, "x": "6歳、7歳、8歳。同じ男の子の年が、記録ごとに違う。"}, {"t": 1591.75, "x": "どうしてそんなことに？"}, {"t": 1593.2166666666667, "x": "数え年と満年齢の違いが、まず一つ。"}, {"t": 1596.0, "x": "碑の「八才」がなぜそうなったのかは、\n資料に書かれていない。"}, {"t": 1600.05, "x": "ただそれを直さずに「誤り」と\n書き添えた形で、碑は残っている。"}, {"t": 1604.5666666666666, "x": "碑の裏には歌も刻まれている。"}, {"t": 1606.7166666666667, "x": "「なでし子を夜半の嵐にた折られて\nあやめもわかぬものとなりけり」。"}, {"t": 1610.3666666666666, "x": "なでしこって花の？"}, {"t": 1611.7833333333333, "x": "なでしこはかわいい子という意味にも掛けてある。"}, {"t": 1614.2333333333333, "x": "あやめは宗一の母親の名前だ。"}, {"t": 1616.3833333333334, "x": "「あやめもわかぬ」は、\n物の見分けもつかない、という意味の言い回しだ。"}, {"t": 1620.4166666666667, "x": "夜の嵐にかわいい子を折り取られた。"}, {"t": 1622.5166666666667, "x": "母の名を重ねながら、何も\n分からなくなった、と詠んでいる。"}, {"t": 1626.3166666666666, "x": "判決の文とはまるで違う言葉ね。"}, {"t": 1628.7333333333333, "x": "判決は時刻と手順と理由を書いた。"}, {"t": 1631.1, "x": "父親は夜と嵐と子どもの年を刻んだ。"}, {"t": 1633.7833333333333, "x": "同じ夜のことを書いた、2つの記録だ。"}, {"t": 1637.05, "x": "では1976年の鑑定書の話に入る。"}, {"t": 1640.4, "x": "鑑定書を書いたのは、田中隆一という\n軍医だと伝えられている。"}, {"t": 1644.2666666666667, "x": "軍のお医者さん？"}, {"t": 1645.4, "x": "陸軍の衛戍病院に勤めていた。"}, {"t": 1647.4333333333334, "x": "衛戍は軍隊がその土地に置かれていることだ。"}, {"t": 1650.1333333333334, "x": "3人の遺体が井戸から引き上げられたとき、\n田中はその場に立ち会った。"}, {"t": 1654.3, "x": "そして20時間をかけて、3人を\n調べたと伝えられている。"}, {"t": 1658.1333333333334, "x": "20時間……。"}, {"t": 1659.25, "x": "鑑定書そのものは、別の軍医の名前で出された。"}, {"t": 1662.35, "x": "田中の手元に残っていたのは、\nその控えだったとされる。"}, {"t": 1665.9833333333333, "x": "控えってことは写しね。"}, {"t": 1667.7, "x": "そうだ。田中はのちに軍を退いて、医院を開いた。"}, {"t": 1671.0166666666667, "x": "その後、40歳でもう一度軍に呼ばれ、\n中国の戦場で亡くなったと伝えられている。"}, {"t": 1676.1833333333334, "x": "控えは田中の家にしまわれたままになった。"}, {"t": 1678.9, "x": "出された本物のほうは、どうなったの？"}, {"t": 1681.35, "x": "この回で読んだ資料には、\nその行方は書かれていない。"}, {"t": 1684.4333333333334, "x": "残っていたのが\n控えのほうだった、ということだけが分かっている。"}, {"t": 1688.1, "x": "もし控えが無ければ、所見の中身は\n誰も知らないままだったかもしれない。"}, {"t": 1692.5, "x": "家族も知らなかったのかしら。"}, {"t": 1694.4666666666667, "x": "そこまでは分からない。"}, {"t": 1695.7833333333333, "x": "分かっているのは、1976年8月に\n遺品の中から見つかったということだ。"}, {"t": 1701.1, "x": "そして8月26日、新聞がそれを報じた。"}, {"t": 1704.3833333333334, "x": "これは内閣府の報告書が書いている日付だ。"}, {"t": 1707.2, "x": "1923年9月から、53年後のことになる。"}, {"t": 1711.1333333333334, "x": "最初に言っていた、53年ね。"}, {"t": 1713.4666666666667, "x": "鑑定書はのちに、本にも収められて刊行されている。"}, {"t": 1716.7333333333333, "x": "国立国会図書館の目録にも、大杉・野枝・\n宗一の死因鑑定書という名前で載っている。"}, {"t": 1722.6666666666667, "x": "つまり誰でも中身を確かめられる形になった。"}, {"t": 1725.75, "x": "じゃあ何が書いてあったの？"}, {"t": 1727.35, "x": "次の章で話す。"}, {"t": 1729.2666666666667, "x": "まず合っていた所から言う。"}, {"t": 1730.8666666666666, "x": "鑑定書の死因は、首を圧迫されての窒息だった。"}, {"t": 1734.1666666666667, "x": "これは判決が引いた鑑定と同じだ。"}, {"t": 1736.6333333333334, "x": "そこは合ってるのね。"}, {"t": 1737.9833333333333, "x": "合っている。違ったのはほかの所見だ。"}, {"t": 1740.3166666666666, "x": "鑑定書を読んだ人たちは、大杉と\n野枝の体に骨折があったと伝えている。"}, {"t": 1744.95, "x": "肋骨などが何本も折れていた、と書く人がいる。"}, {"t": 1748.0, "x": "胸の骨などに激しい骨折があった、と\n紹介した記事もある。"}, {"t": 1751.9666666666667, "x": "骨が折れてた……？"}, {"t": 1753.1, "x": "ここで判決が書いた筋をもう一度思い出してほしい。"}, {"t": 1756.1833333333334, "x": "1人ずつ部屋に入り、背後から首を圧迫した。"}, {"t": 1759.15, "x": "判決はそう書いた。"}, {"t": 1760.5833333333333, "x": "その筋の中には、骨が折れるような\n出来事は書かれていない。"}, {"t": 1764.3, "x": "じゃあ判決に書いてないことがあったってこと？"}, {"t": 1766.9833333333333, "x": "少なくとも判決の文にはその所見が出てこない。"}, {"t": 1770.1, "x": "判決の証拠の欄が引いたのは、\n死因の一文だけだった。"}, {"t": 1773.6666666666667, "x": "鑑定書には書かれていた所見が、\n判決の文には入っていない。"}, {"t": 1777.5166666666667, "x": "これが最初に言った「合わない所」だ。"}, {"t": 1780.15, "x": "誰がそんなことをしたのかは、書いてあるの？"}, {"t": 1782.8333333333333, "x": "書いていない。鑑定書は体の状態を書く文書だ。"}, {"t": 1785.95, "x": "誰が何をしたかを書く文書ではない。"}, {"t": 1788.1666666666667, "x": "だからこの回でも、鑑定書から\n誰がやったかは言わない。"}, {"t": 1791.5666666666666, "x": "でも判決の筋とは合わないのよね。"}, {"t": 1793.9166666666667, "x": "合わない。だから判決の筋だけでは\n説明しきれない、と考える人がいる。"}, {"t": 1798.4666666666667, "x": "何人もが関わったのではないか、と読む人もいる。"}, {"t": 1801.5333333333333, "x": "ただそれは鑑定書を読んだ人の解釈だ。"}, {"t": 1804.1, "x": "鑑定書そのものが、そう書いているわけではない。"}, {"t": 1806.9333333333334, "x": "私たちが言えるのは、判決が書かなかった\n所見があった、というところまでだ。"}, {"t": 1811.7666666666667, "x": "それだけでも、大きいことよね。"}, {"t": 1813.85, "x": "大きい。判決は53年間、ただ一つの公の筋だった。"}, {"t": 1817.9, "x": "その筋に入っていない事実が、紙の形で出てきた。"}, {"t": 1821.3833333333334, "x": "判決を読むときの前提が、ここで変わったことになる。"}, {"t": 1825.3166666666666, "x": "鑑定書にはもう一つの働きがあった。"}, {"t": 1827.9333333333334, "x": "もう一つ？"}, {"t": 1829.0666666666666, "x": "事件の場所についての話だ。"}, {"t": 1831.0333333333333, "x": "戦後、事件の場所や時刻について、\n判決と違う説が出ていた。"}, {"t": 1835.2666666666667, "x": "3人は憲兵隊の建物ではなく、別の部隊の\nところで亡くなったのではないか、という説だ。"}, {"t": 1841.0666666666666, "x": "場所まで疑われてたの？"}, {"t": 1842.75, "x": "内閣府の報告書には、歩兵第三連隊に\nよるとの説があった、と書かれている。"}, {"t": 1847.7333333333333, "x": "ところが1976年の鑑定書が\n報じられて、その説は下火になった。"}, {"t": 1852.7666666666667, "x": "報告書の言葉はこうだ。"}, {"t": 1854.4, "x": "軍法会議で明らかにされた「\n東京憲兵隊本部内での扼殺が支持され」。"}, {"t": 1859.2666666666667, "x": "やくさつ？"}, {"t": 1860.4, "x": "手などで首を圧迫して命を奪うことだ。"}, {"t": 1862.9833333333333, "x": "つまり鑑定書は、場所と\n死因については判決の筋を支えた。"}, {"t": 1866.9666666666667, "x": "判決を崩したんじゃなくて、支えたの？"}, {"t": 1869.6666666666667, "x": "一部はな。そこがこの鑑定書の難しいところだ。"}, {"t": 1872.8333333333333, "x": "場所は判決どおり憲兵隊の建物の中。"}, {"t": 1875.6666666666667, "x": "死因も判決どおり首を圧迫されての窒息。"}, {"t": 1878.55, "x": "だが体に残っていた所見は、\n判決の書いた手順と合わない。"}, {"t": 1882.5166666666667, "x": "合っている所と、合っていない所が両方あるのね。"}, {"t": 1885.7333333333333, "x": "そうだ。鑑定書は判決を\n全部ひっくり返したわけではない。"}, {"t": 1889.35, "x": "判決が書いた筋のうち、どこまでが\n確かで、どこからが書かれていないのか。"}, {"t": 1893.9666666666667, "x": "その境目を見せた書類だった。"}, {"t": 1895.95, "x": "別の説が下火になったことも、\n同じ書類が見せたことだ。"}, {"t": 1899.6833333333334, "x": "1通の紙が、ある説を弱めた。"}, {"t": 1901.9166666666667, "x": "そして判決の欠けた所を見せた。"}, {"t": 1904.3333333333333, "x": "53年眠っていた紙が、両方の役目をしたのね。"}, {"t": 1908.4666666666667, "x": "最後に残るのが、最初に言ったもう一つの問いだ。"}, {"t": 1911.5833333333333, "x": "誰が命じたのか。"}, {"t": 1912.9666666666667, "x": "判決は甘粕と森の共謀なのよね。"}, {"t": 1915.5666666666666, "x": "そうだ。判決の筋では甘粕が\n決めて森と一緒に動いた。"}, {"t": 1919.3166666666666, "x": "ただ判決の文の最初に、2人の持ち場が書いてある。"}, {"t": 1922.6666666666667, "x": "甘粕は渋谷と麹町の憲兵分隊の分隊長。"}, {"t": 1925.95, "x": "森は東京憲兵隊の本部の特別高等課に勤めていた。"}, {"t": 1929.8333333333333, "x": "持ち場が違うの？"}, {"t": 1931.1, "x": "違う。甘粕が分隊長を務める分隊の人ではない。"}, {"t": 1934.55, "x": "そこに疑問を持つ人は多い。"}, {"t": 1936.3333333333333, "x": "持ち場の違う2人が、なぜ一緒に動いたのか。"}, {"t": 1939.25, "x": "上の誰かがいたのではないか、と\n考える人たちがいる。"}, {"t": 1942.6666666666667, "x": "その「上の誰か」は、分かってるの？"}, {"t": 1945.35, "x": "分かっていない。いくつもの説があるが、\nどれも確かめられていない。"}, {"t": 1949.1666666666667, "x": "この回では説の名前を挙げて採点することはしない。"}, {"t": 1952.25, "x": "確かなのは判決も軍も上の関与を認めていないことだ。"}, {"t": 1955.7333333333333, "x": "陸軍大臣は国会で、上の人の処分に\n「何等他に意味を有しない」と答えた。"}, {"t": 1960.9166666666667, "x": "上等兵2人は上官の命令だと信じて\n従ったとして無罪になった。"}, {"t": 1965.2333333333333, "x": "ではその上官に命じた人はいたのか。"}, {"t": 1967.6333333333334, "x": "判決はそこで止まっている。"}, {"t": 1969.5, "x": "100年たっても、答えは出ていないのね。"}, {"t": 1972.0666666666666, "x": "出ていない。"}, {"t": 1973.2, "x": "鑑定書が見つかっても、\n命令の紙は見つかっていない。"}, {"t": 1976.4666666666667, "x": "答えが出ていないことを、答えが出ていないまま置く。"}, {"t": 1979.4, "x": "それがこの事件の記録を\n読むときに必要なことだと思う。"}, {"t": 1983.45, "x": "この回で開いた紙を、もう一度並べる。"}, {"t": 1986.0333333333333, "x": "1923年12月9日の新聞に載った判決。"}, {"t": 1989.9833333333333, "x": "時刻と手順と甘粕の考えを理由として書いた。"}, {"t": 1993.0833333333333, "x": "父親が名古屋に建てた碑。"}, {"t": 1995.0333333333333, "x": "草むらで見つかり、子の年を「八才」と\n刻んで「七才の誤り」と添えていた。"}, {"t": 2000.25, "x": "そして1976年に見つかった鑑定書。"}, {"t": 2003.5333333333333, "x": "死因と場所は判決を支え、体の所見は\n判決に書かれていなかった。"}, {"t": 2008.05, "x": "3つとも同じ夜のことを\n書いてるのに、少しずつ違うのね。"}, {"t": 2011.85, "x": "そうだ。どれか1つだけを\n読むと、その夜の姿は欠ける。"}, {"t": 2015.65, "x": "判決だけ読んだら、骨折のことは出てこない。"}, {"t": 2018.6833333333334, "x": "碑には、誰が裁かれたかが書かれていない。"}, {"t": 2021.5333333333333, "x": "鑑定書には、命令の手がかりが無い。"}, {"t": 2024.0, "x": "3つ全部そろえても、命じた人の名前は無いのね。"}, {"t": 2027.3333333333333, "x": "そこがこの事件に残った穴だ。"}, {"t": 2029.35, "x": "国会の記録にも、この事件は何度も出てくる。"}, {"t": 2032.35, "x": "1958年は命令と責任の話の例として。"}, {"t": 2036.0333333333333, "x": "1961年は刑が軽すぎた例として。"}, {"t": 2039.1666666666667, "x": "1985年は外国の国籍を持つ\n子どもが巻き込まれた例として。"}, {"t": 2043.9166666666667, "x": "時代ごとに違う話の例に使われてきたのね。"}, {"t": 2047.0, "x": "そうだ。だがどの発言も命じた\n人の名前には触れていない。"}, {"t": 2050.5833333333335, "x": "触れようにもそれを示す記録が無いからだ。"}, {"t": 2053.0833333333335, "x": "宗一は伯父と一緒に焼け跡を見に行くはずだった。"}, {"t": 2055.983333333333, "x": "アメリカで生まれた6歳の男の子が、\nたまたまその日そこにいた。"}, {"t": 2059.85, "x": "大杉はフランスから帰った2か月後だった。"}, {"t": 2062.5333333333333, "x": "野枝は17歳で雑誌の仲間に\n加わってから11年がたっていた。"}, {"t": 2066.6666666666665, "x": "3人ともその先があったのよね。"}, {"t": 2068.9, "x": "あった。判決にも鑑定書にも、\nその先は書かれていない。"}, {"t": 2072.5833333333335, "x": "書かれているのは、1923年9月16日の夜で\n止まった3人の記録だ。"}, {"t": 2077.9, "x": "53年たって紙が1通増えた。\nそれでも穴はまだ1つ残っている。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
