<script>
const D={"name": "115", "file": "115_編集用", "dur": 2050.19996875, "segs": [], "subs": [{"t": 0.0, "x": "1960年5月16日。東京都世田谷区。"}, {"t": 3.683333333333333, "x": "昼前にある家の電話が鳴った。"}, {"t": 5.616666666666666, "x": "受話器の向こうは、知らない男の声だ。"}, {"t": 8.1, "x": "お宅の子どもを預かっている、と言った。"}, {"t": 10.566666666666666, "x": "預かってる？"}, {"t": 11.566666666666666, "x": "その朝、7歳の男の子が学校に着いていなかった。"}, {"t": 15.0, "x": "男は子どもを返す代わりに金を持ってこいと言う。"}, {"t": 17.866666666666667, "x": "身代金を求める電話だ。"}, {"t": 19.8, "x": "男の正体は？"}, {"t": 21.083333333333332, "x": "この時点では、誰の声なのか分かっていない。"}, {"t": 23.783333333333335, "x": "顔も名前もどこから掛けているのかも分からない。"}, {"t": 26.55, "x": "分かっているのは、声と要求だけだ。"}, {"t": 28.966666666666665, "x": "……こわいわね。"}, {"t": 29.883333333333333, "x": "この事件はのちに雅樹ちゃん事件と呼ばれる。"}, {"t": 32.53333333333333, "x": "先に一つ数字を出しておく。"}, {"t": 34.46666666666667, "x": "事件のあとその年の終わりまでの国会の記録を\n引いてみた。"}, {"t": 37.95, "x": "「誘拐」という言葉が出てくる回数は、0回だ。"}, {"t": 41.25, "x": "0回？"}, {"t": 42.05, "x": "0回だ。「身代金」も0回。この子の名前も0回。"}, {"t": 45.78333333333333, "x": "名前が国会に初めて出てくるのは、3年後になる。"}, {"t": 49.06666666666667, "x": "今回は1960年に\n「まだ無かったもの」を順に見ていく。"}, {"t": 53.233333333333334, "x": "罪の名前。報道の決まり。そして国会での議論だ。"}, {"t": 56.81666666666667, "x": "まだ無かった、ね。"}, {"t": 58.25, "x": "そうだ。何が無くてそれがいつできたのかを追う。"}, {"t": 61.03333333333333, "x": "先に言っておく。亡くなった男の子の様子は話さない。"}, {"t": 64.4, "x": "ご家族のことにも触れない。"}, {"t": 66.08333333333333, "x": "扱うのは記録に残った決まりのほうだ。"}, {"t": 69.18333333333334, "x": "話をその朝に戻す。"}, {"t": 70.8, "x": "男の子は小学2年生で、7歳だった。"}, {"t": 73.68333333333334, "x": "いつものように、家を出て学校へ向かっている。"}, {"t": 76.3, "x": "途中で電車からバスへ乗り換える道だった。"}, {"t": 78.86666666666666, "x": "その乗り換えの場所が、目黒駅のあたりだ。"}, {"t": 81.61666666666666, "x": "そこで何があったの？"}, {"t": 83.08333333333333, "x": "男が声を掛けた。"}, {"t": 84.43333333333334, "x": "「お母さんに頼まれた」という\n言い方だったと伝えられている。"}, {"t": 87.96666666666667, "x": "知らない人なのに、ついて行ったの？"}, {"t": 90.26666666666667, "x": "7歳の子にとって、お母さんの名前は一番強い鍵だ。"}, {"t": 93.83333333333333, "x": "その鍵を男は最初から用意していた。"}, {"t": 96.36666666666666, "x": "最初から？"}, {"t": 97.33333333333333, "x": "判決の資料を引いた記録によると、\n男はこの計画を前もって練っている。"}, {"t": 101.86666666666666, "x": "裕福な家の子どもを狙うこと。"}, {"t": 103.83333333333333, "x": "子どもがたくさん乗り換える駅で声を掛けること。"}, {"t": 106.6, "x": "そこまで決めてから、その朝を迎えていた。"}, {"t": 109.4, "x": "……思いつきじゃないのね。"}, {"t": 110.86666666666666, "x": "思いつきではない。手本にした事件まであった。"}, {"t": 113.68333333333334, "x": "同じ年の4月に、フランスで\n起きた子どもの誘拐事件だ。"}, {"t": 117.36666666666666, "x": "自動車会社を経営する一族の孫が\n連れ去られた事件だった。"}, {"t": 121.18333333333334, "x": "外国の事件をまねたってこと？"}, {"t": 123.31666666666666, "x": "そう認定されている。"}, {"t": 124.65, "x": "男はその事件を知っていて、思い出した。"}, {"t": 127.3, "x": "この「まねる」という話はあとでもう一度出てくる。"}, {"t": 130.38333333333333, "x": "4年後の国会で、まったく\n逆の向きで語られることになる。"}, {"t": 134.11666666666667, "x": "逆の向き？"}, {"t": 135.1, "x": "そのときに話す。先に電話のあとの3日間を見ておく。"}, {"t": 139.23333333333332, "x": "電話を受けた家は、すぐに警察へ届けた。"}, {"t": 141.96666666666667, "x": "警察は捜査を始めた。"}, {"t": 143.63333333333333, "x": "ただその動きはすぐには表に出ていない。"}, {"t": 146.18333333333334, "x": "表に出さない？"}, {"t": 147.4, "x": "犯人を刺激しないためだ。\nここは今でも同じ考え方だな。"}, {"t": 151.2, "x": "男は金の受け渡し場所を細かく指示してきた。"}, {"t": 154.23333333333332, "x": "家の人がその指示どおりに出かけていく。"}, {"t": 156.6, "x": "警察はその周りで男が現れるのを待つ。"}, {"t": 159.4, "x": "それで捕まえたの？"}, {"t": 160.78333333333333, "x": "男は来なかった。"}, {"t": 162.06666666666666, "x": "指示は日を変えて合わせて\n3回あったと伝えられている。"}, {"t": 165.13333333333333, "x": "3回とも決められた場所に男は姿を見せていない。"}, {"t": 168.43333333333334, "x": "3回とも？"}, {"t": 169.5, "x": "3回ともだ。男は電話で約束を破ったと言ってきた。"}, {"t": 173.06666666666666, "x": "警察が付いていた、という\n言い方だったと伝えられている。"}, {"t": 176.53333333333333, "x": "見張られてるって、分かってたのね。"}, {"t": 178.8, "x": "分かっていた。あるいはそう思い込んでいた。"}, {"t": 181.18333333333334, "x": "ここで捜査の手順が正しかったか\nどうかは、この回では裁かない。"}, {"t": 185.1, "x": "それを決められるだけの一次資料が、\n手元に無いからだ。"}, {"t": 188.43333333333334, "x": "はっきり言えるのは、一つだけだ。"}, {"t": 190.51666666666668, "x": "3回の機会のどこでも、子どもは帰ってこなかった。"}, {"t": 193.6, "x": "……。"}, {"t": 194.53333333333333, "x": "そして男からの連絡は途切れる。"}, {"t": 196.65, "x": "途切れたあとに、新聞が動いた。"}, {"t": 199.36666666666667, "x": "5月17日の夕刊。この誘拐が新聞に載り始めた。"}, {"t": 203.25, "x": "載っちゃったの？"}, {"t": 204.3, "x": "当時、誘拐を報じる前に止めておく決まりは無かった。"}, {"t": 207.58333333333334, "x": "記者が事件をつかめば、書くのが仕事だった。"}, {"t": 210.43333333333334, "x": "その日から紙面には事件の見出しが並んだ。"}, {"t": 213.1, "x": "翌日もその翌日も続報が出ている。"}, {"t": 215.76666666666668, "x": "犯人もその新聞を読むわよね。"}, {"t": 217.91666666666666, "x": "読んでいる。判決の資料を引いた記録には、こうある。"}, {"t": 221.13333333333333, "x": "男は事件を詳しく伝える記事を読み、うろたえた。"}, {"t": 224.28333333333333, "x": "そのあとで取り返しのつかないことを決めた、と。"}, {"t": 226.93333333333334, "x": "……。"}, {"t": 227.86666666666667, "x": "報道に追い詰められた、とまとめる記事もある。"}, {"t": 230.53333333333333, "x": "ただここは慎重に言っておく。"}, {"t": 232.31666666666666, "x": "新聞が悪かった、と一言で片づけられる話ではない。"}, {"t": 235.91666666666666, "x": "決めたのは男だ。それは判決が認めたとおりだ。"}, {"t": 239.23333333333332, "x": "でも記事が引き金になった。"}, {"t": 241.18333333333334, "x": "新聞の側も、このことを重く受け止めた。"}, {"t": 243.83333333333334, "x": "3年後、ある議員が国会でこう振り返っている。"}, {"t": 246.76666666666668, "x": "「あれでとうとう\n殺してしまったというようなことになって」"}, {"t": 249.73333333333332, "x": "「新聞協会等でもこの問題を非常に反省されて」"}, {"t": 252.96666666666667, "x": "「いわゆる取りきめというようなものが\n方針として出てきた」"}, {"t": 256.2, "x": "取りきめ？"}, {"t": 257.0833333333333, "x": "のちの「誘拐のときは書くのを待つ」\n決まりにつながる話だ。"}, {"t": 260.95, "x": "その話は後半でする。"}, {"t": 262.45, "x": "先に5月19日を見ておく。"}, {"t": 265.1333333333333, "x": "5月19日の朝。"}, {"t": 266.6333333333333, "x": "杉並区の路上に、1台の車が置き去りにされていた。"}, {"t": 270.1166666666667, "x": "男の子はその車の中で見つかった。"}, {"t": 272.6, "x": "亡くなっていた。前の日の18日のことだった。"}, {"t": 275.8333333333333, "x": "……見つかったのが、19日の朝なのね。"}, {"t": 278.45, "x": "そうだ。ここから先の様子は、この回では話さない。"}, {"t": 281.75, "x": "代わりに同じ5月19日のもう一つの場所を見る。"}, {"t": 284.95, "x": "もう一つの場所？"}, {"t": 286.25, "x": "永田町。国会だ。"}, {"t": 287.76666666666665, "x": "この日の衆議院の本会議の記録が残っている。"}, {"t": 290.68333333333334, "x": "開いたのは夜の11時49分だ。"}, {"t": 293.3666666666667, "x": "夜の11時？"}, {"t": 294.56666666666666, "x": "議題は一つ。会期を延ばすかどうか。"}, {"t": 296.98333333333335, "x": "議長が「五十日間会期を延長」すると\n諮り起立多数で決まった。"}, {"t": 301.4166666666667, "x": "散会は11時51分。"}, {"t": 303.1, "x": "会議は2分で終わっている。"}, {"t": 304.76666666666665, "x": "そして議長は、こう言って席を立つ。"}, {"t": 307.03333333333336, "x": "「明日は午前零時五分より開会いたします」"}, {"t": 309.81666666666666, "x": "零時五分って、ほとんど続けてじゃない。"}, {"t": 312.3833333333333, "x": "続けてだ。日付が変わった20日の午前0時5分。"}, {"t": 315.65, "x": "この夜の本会議で、日米の新しい\n安全保障条約が承認された。"}, {"t": 320.05, "x": "記録の言葉では「起立総員」。"}, {"t": 321.98333333333335, "x": "散会は午前0時19分だ。"}, {"t": 324.25, "x": "同じ夜に……。"}, {"t": 325.26666666666665, "x": "同じ東京の同じ夜だ。"}, {"t": 326.93333333333334, "x": "条約の審議のために委員会が\n39回開かれた、とこの夜の報告にある。"}, {"t": 331.8, "x": "言いたいのは、国会が冷たかったという話ではない。"}, {"t": 334.93333333333334, "x": "この年の国会の記録が、どちらを\n向いていたかを見たいだけだ。"}, {"t": 339.3, "x": "国の記録には、国会会議録という公のデータがある。"}, {"t": 342.78333333333336, "x": "戦後の国会の発言が、ほぼ全部ことばで引ける。"}, {"t": 346.03333333333336, "x": "これで事件のあとの1960年を引いてみた。"}, {"t": 349.26666666666665, "x": "冒頭で言ってた0回ね。"}, {"t": 351.03333333333336, "x": "そうだ。期間は5月16日から12月31日まで。"}, {"t": 354.95, "x": "「誘拐」で引くと0件。"}, {"t": 356.6166666666667, "x": "「身代金」で引くと0件。"}, {"t": 358.3666666666667, "x": "翌年の終わりまで広げても0件だ。"}, {"t": 360.8, "x": "当時の新聞の書き方に合わせて\n「誘かい」でも引いた。"}, {"t": 364.26666666666665, "x": "これも0件。"}, {"t": 365.35, "x": "本当に一言も？"}, {"t": 366.8333333333333, "x": "この言葉では、一言も出てこない。"}, {"t": 369.15, "x": "この子の名前で引くと、最初に\n出てくるのは1963年5月7日。"}, {"t": 374.03333333333336, "x": "事件から3年後の、衆議院の地方行政委員会だ。"}, {"t": 377.55, "x": "3年もあいだが空くのね。"}, {"t": 379.26666666666665, "x": "空く。その3年後の委員会で、何が話題だったと思う？"}, {"t": 382.9166666666667, "x": "……別の誘拐事件？"}, {"t": 384.31666666666666, "x": "当たりだ。"}, {"t": 385.03333333333336, "x": "その年の春に起きた、\n別の誘拐事件の審議の中だった。"}, {"t": 388.85, "x": "つまりこういうことになる。"}, {"t": 390.3333333333333, "x": "この事件は起きたその年には国会で語られていない。"}, {"t": 393.46666666666664, "x": "次の事件が起きたときに、\n「前の苦い経験」として呼び出された。"}, {"t": 397.65, "x": "あとから思い出されたのね。"}, {"t": 399.4, "x": "思い出された。しかもそれを\n口にしたのは警察のほうだった。"}, {"t": 403.0833333333333, "x": "中身は後半で読む。"}, {"t": 404.48333333333335, "x": "その前にもう一つ確かめておくことがある。"}, {"t": 407.1166666666667, "x": "1960年の時点で、この犯罪を\n裁く法律がどうなっていたかだ。"}, {"t": 412.3666666666667, "x": "法律の話の前に、男がどうなったかを短く言っておく。"}, {"t": 416.1, "x": "男は元は歯科医だった。当時32歳だ。"}, {"t": 419.1666666666667, "x": "歯医者さん？"}, {"t": 420.06666666666666, "x": "そうだ。借金を重ねていて、金に\n困っていたと認定されている。"}, {"t": 424.18333333333334, "x": "事件のあと男は東京を離れて行方をくらました。"}, {"t": 427.25, "x": "警察は男を全国に指名手配した。"}, {"t": 429.76666666666665, "x": "逮捕されたのは7月17日。"}, {"t": 431.8333333333333, "x": "場所は大阪だった。"}, {"t": 433.35, "x": "2か月くらいね。"}, {"t": 434.6666666666667, "x": "2か月と少しだ。"}, {"t": 436.01666666666665, "x": "逃げていたあいだのことは、この回では話さない。"}, {"t": 438.8, "x": "大事なのは捕まったあとに何の罪で裁かれたかだ。"}, {"t": 442.1, "x": "誘拐の罪でしょ？"}, {"t": 443.46666666666664, "x": "そこがこの回の入り口になる。"}, {"t": 445.3333333333333, "x": "起訴された罪の名前を、\n最高裁の判決からそのまま読む。"}, {"t": 449.1333333333333, "x": "営利誘拐。恐喝未遂。殺人。死体遺棄。"}, {"t": 452.3333333333333, "x": "4つあるのね。"}, {"t": 453.5, "x": "4つだ。ここで一つ聞きたい。"}, {"t": 455.55, "x": "「身代金」という言葉は、この4つのどこにある？"}, {"t": 458.73333333333335, "x": "……どこにも無いわね。"}, {"t": 460.03333333333336, "x": "無い。身代金を取るための誘拐は、\n独立した罪になっていなかった。"}, {"t": 464.45, "x": "だから「営利誘拐」の一つとして扱われた。"}, {"t": 467.53333333333336, "x": "金を出せという電話は「恐喝」として扱われた。"}, {"t": 470.93333333333334, "x": "誘拐と、おどしを、別々に数えたってこと？"}, {"t": 474.05, "x": "そういうことだ。"}, {"t": 475.06666666666666, "x": "その数え方が、どれくらい軽かったかを次で見る。"}, {"t": 478.78333333333336, "x": "当時の「営利誘拐」の刑はどれくらいだったか。"}, {"t": 481.76666666666665, "x": "これは4年後の国会で、\n法務省の刑事局長がはっきり答えている。"}, {"t": 485.96666666666664, "x": "「営利誘拐というものは\n一年以上十年以下の懲役でございます」"}, {"t": 489.8333333333333, "x": "一番重くて10年？"}, {"t": 491.3666666666667, "x": "誘拐の罪としては、10年が上限だった。"}, {"t": 494.2, "x": "局長は続けてこう言う。"}, {"t": 495.78333333333336, "x": "「身のしろ金目的の誘拐も\n営利誘拐の一種でございますので」"}, {"t": 499.5, "x": "「現行法で処罰するとすれば、\nそれでやるよりしょうがない」"}, {"t": 502.93333333333334, "x": "しょうがない、って言っちゃうのね。"}, {"t": 504.73333333333335, "x": "役所が国会で「しょうがない」と\n言うのはかなり強い言い方だ。"}, {"t": 508.4, "x": "金を求める部分についても、こう言っている。"}, {"t": 511.06666666666666, "x": "「判例はなかなか強盗に踏み切れない」"}, {"t": 513.2833333333333, "x": "「一件も強盗で処断したことはございません」"}, {"t": 515.8833333333333, "x": "「やはり恐喝罪ということでございまして」"}, {"t": 518.4333333333333, "x": "強盗じゃなくて、おどしの扱いなのね。"}, {"t": 521.0333333333333, "x": "そうだ。子どもの命を盾に金を\n求めても、罪の名前は「恐喝」だった。"}, {"t": 526.1166666666667, "x": "でもこの事件の男は死刑になったんでしょ？"}, {"t": 528.8333333333334, "x": "なった。だが死刑の根拠は殺人の罪のほうだ。"}, {"t": 531.9, "x": "誘拐と身代金の部分だけを見れば、\n法律の物差しは軽いままだった。"}, {"t": 536.5166666666667, "x": "重い結果にならないと、重く裁けない……。"}, {"t": 539.1666666666666, "x": "局長自身がこの状態を「不合理」と呼んでいる。"}, {"t": 542.2333333333333, "x": "「このような危険な犯罪に対処する現行法の規定は\n何と申しましても不合理でございます」"}, {"t": 547.5166666666667, "x": "ではこの不合理は1960年に\n初めて分かったことだったのか。"}, {"t": 551.7833333333333, "x": "違うの？"}, {"t": 552.6, "x": "違う。5年前に一度ここが国会で議論されている。"}, {"t": 556.4666666666667, "x": "1955年の夏。参議院に一つの法案が出ていた。"}, {"t": 560.45, "x": "名前は「幼児誘拐等処罰法案」。"}, {"t": 562.9333333333333, "x": "1955年にも、誘拐の法律の話があったの？"}, {"t": 566.8166666666667, "x": "あった。その年にも、子どもの誘拐事件が起きている。"}, {"t": 570.2, "x": "芸能人の家の子どもが連れ去られた事件だ。"}, {"t": 572.9166666666666, "x": "衆議院の法務委員会でも、\nその事件の名前を挙げた質問が出ている。"}, {"t": 577.1, "x": "法案を出したのは、参議院の中山福藏 議員だ。"}, {"t": 580.4833333333333, "x": "この名前は覚えておいてほしい。"}, {"t": 582.1, "x": "最後にもう一度出てくる。"}, {"t": 583.85, "x": "どんな法案だったの？"}, {"t": 585.35, "x": "中山福藏 議員は、ねらいをこう説明している。"}, {"t": 588.55, "x": "「この営利という言葉が非常に\nあいまいだというわけで」"}, {"t": 591.4166666666666, "x": "「はっきり明確にさせようというだけのこと」"}, {"t": 594.0166666666667, "x": "営利ってさっきの営利誘拐の営利？"}, {"t": 596.15, "x": "そうだ。身代金を取るのが「営利」に\n入るのかはっきりしなかった。"}, {"t": 600.4, "x": "実際、同じ年の事件の裁判では、どの条文を\n当てるかで割れたと議員は述べている。"}, {"t": 605.5833333333334, "x": "法律の専門家どうしでも、意見が割れたのね。"}, {"t": 608.6333333333333, "x": "割れた。だから条文で\nはっきりさせよう、という法案だった。"}, {"t": 612.1333333333333, "x": "ところがこの法案には一つ、線が引かれていた。"}, {"t": 615.2166666666667, "x": "法務省の参事官が、委員会で\nその線を読み上げている。"}, {"t": 618.5833333333334, "x": "「ここに七才に満たない幼児と\nこういうふうに特に取り上げてある」"}, {"t": 622.2666666666667, "x": "7歳に満たない……。"}, {"t": 623.5666666666667, "x": "対象は7歳より下の子どもだった。"}, {"t": 625.9333333333333, "x": "1960年に連れ去られた男の子は、7歳だ。"}, {"t": 629.7, "x": "……線のすぐ外側なのね。"}, {"t": 631.4666666666667, "x": "外側だ。もしもの話はしない。"}, {"t": 633.75, "x": "法案は結局通っていないからだ。"}, {"t": 635.9166666666666, "x": "ただ線がどこに引かれていたかは、\n記録に残っている。"}, {"t": 639.7833333333333, "x": "1955年の法案は、翌年の春にも審議が続いている。"}, {"t": 644.0166666666667, "x": "1956年4月3日。"}, {"t": 646.3, "x": "参議院の法務委員会は、外から話を聞く人を呼んだ。"}, {"t": 649.8833333333333, "x": "その中に、新聞記者、警視庁の刑事部長、\n子どもの施設の園長、大学の教授がいた。"}, {"t": 655.9, "x": "いろんな立場の人を呼んだのね。"}, {"t": 657.95, "x": "警視庁の刑事部長は、まず数字を出している。"}, {"t": 660.8, "x": "東京で起きた誘拐は、前の年度が\n25件、その前が26件。"}, {"t": 665.1333333333333, "x": "そのうち年少の子どもと幼児の誘拐は2年で20人。"}, {"t": 668.45, "x": "年齢で分けると、5歳以下が4人。"}, {"t": 670.65, "x": "6歳から8歳が8人。"}, {"t": 672.2833333333333, "x": "9歳から11歳が8人。"}, {"t": 674.35, "x": "6歳から8歳が、いちばん多いのね。"}, {"t": 676.95, "x": "法案の線は「7才に満たない」だった。"}, {"t": 679.65, "x": "数字の上でも、線の外にいる子は多かった。"}, {"t": 682.4833333333333, "x": "お金が目当てと見られる誘拐は、\nそのうち4件だったという。"}, {"t": 686.0166666666667, "x": "刑事部長は前の年の芸能人の子の事件も説明した。"}, {"t": 689.5833333333334, "x": "報道されたあと、家には脅しの電話が\n毎日のように掛かってきたという。"}, {"t": 693.8833333333333, "x": "本物の犯人じゃない人から？"}, {"t": 696.0, "x": "事件に便乗して金を取ろうとする\n者まで出た、と述べている。"}, {"t": 699.6666666666666, "x": "捜査本部自身も、それに非常に悩まされた、と。"}, {"t": 703.05, "x": "報道が別の電話を呼んだのね。"}, {"t": 705.1, "x": "呼んだ。1956年の時点で、\nその問題は国会で語られていた。"}, {"t": 709.9, "x": "刑事部長は捜査の方針もこう話している。"}, {"t": 712.55, "x": "「まず幼児を救い出すこと、これを\n第一の方針といたしまして」"}, {"t": 716.2666666666667, "x": "「犯人の逮捕はむしろあとでもよろしい」"}, {"t": 718.6, "x": "捕まえるより、子どもが先。"}, {"t": 720.6, "x": "そうだ。その事件では、子どもは\n無事に帰ってきている。"}, {"t": 723.9333333333333, "x": "そのうえで刑事部長は、今の法律のもとで\n成果を上げる自信がある、とも言った。"}, {"t": 728.6333333333333, "x": "施設の園長は、少し違う心配を口にしている。"}, {"t": 731.9333333333333, "x": "あまり厳罰になると、それがまた\n世の中の興味を呼ぶのではないか、と。"}, {"t": 736.2666666666667, "x": "重くするとかえって目立っちゃうってこと？"}, {"t": 738.6666666666666, "x": "そういう心配だ。\n重くすることにも、ためらいがあった。"}, {"t": 742.65, "x": "1955年の委員会では、外国の法律も比べられている。"}, {"t": 746.8333333333334, "x": "法務省の参事官が、いくつかの国の例を読み上げた。"}, {"t": 750.1833333333333, "x": "一番重いのは、\nアメリカのニューヨーク州の刑法だった。"}, {"t": 753.4833333333333, "x": "身代金を得る目的で連れ去れば、刑は死刑か無期。"}, {"t": 756.95, "x": "日本は上限10年なのに。"}, {"t": 758.8166666666667, "x": "差は大きい。ただ参事官はもう一つ付け加えている。"}, {"t": 761.9666666666667, "x": "裁判が確定する前に子どもが返された\n場合は、20年以上の刑にできる、と。"}, {"t": 766.9833333333333, "x": "返したら軽くなるのね。"}, {"t": 768.6833333333333, "x": "そうだ。1964年に日本の条文に入る考え方が、\n1955年の国会でもう読み上げられていた。"}, {"t": 775.9666666666667, "x": "ドイツは身代金のための誘拐を\n3年を下らない重い刑にしていた。"}, {"t": 780.1333333333333, "x": "1956年に呼ばれた大学の教授は、\nこれを冷静に見ている。"}, {"t": 784.4333333333333, "x": "アメリカでは、有名な誘拐事件を\nきっかけに各州が重い刑を置いた。"}, {"t": 788.6166666666667, "x": "その事件の名前は、のちに\n日本の犯人の供述にも出てくることになる。"}, {"t": 793.1833333333333, "x": "リンドバーグ事件、ね。"}, {"t": 794.75, "x": "そうだ。教授は外国の重い刑は日本の大事な\n参考にはならない、と述べた。"}, {"t": 799.4166666666666, "x": "その時々の事件に合わせた、きわもの的な\n立法の面がある、という見方だった。"}, {"t": 804.5, "x": "重くしたい人と、慎重な人と。"}, {"t": 807.0, "x": "両方いた。どちらにも筋が通っている。"}, {"t": 809.4666666666667, "x": "ただ議論のあいだも、使われていたのは\n1907年にできた刑法だった。"}, {"t": 814.1666666666666, "x": "明治の刑法？"}, {"t": 815.3333333333334, "x": "そうだ。刑法そのものが、\n明治40年にできた法律だった。"}, {"t": 819.9166666666666, "x": "ではなぜ1955年の法案は通らなかったのか。"}, {"t": 823.3166666666667, "x": "法務省の答えは、最初からはっきりしていた。"}, {"t": 826.1666666666666, "x": "「直ちに特別法を設ける必要があるか\nどうか、これについては大きな疑問を持つ」"}, {"t": 831.0833333333334, "x": "必要ないってこと？"}, {"t": 832.55, "x": "重く罰する必要は認める、とは言っている。"}, {"t": 835.25, "x": "ただこう続ける。"}, {"t": 836.35, "x": "「刑法改正の一環として考えた\n方がいいのじゃないか」"}, {"t": 839.7333333333333, "x": "刑法の改正？"}, {"t": 840.95, "x": "当時、刑法全体を見直す作業が進んでいた。"}, {"t": 843.9833333333333, "x": "それに合わせてやるほうが、\n刑の釣り合いが取れるという考えだ。"}, {"t": 847.4666666666667, "x": "警察の側も似たことを言っている。"}, {"t": 849.5333333333333, "x": "警察庁の刑事部長が、衆議院でこう答えた。"}, {"t": 852.6166666666667, "x": "「現行法を変えなくてはならぬという結論は出ません」"}, {"t": 855.6833333333333, "x": "警察まで変えなくていいって？"}, {"t": 857.6, "x": "捜査の実務から見れば今の法律で\n足りる、という意味だった。"}, {"t": 861.2, "x": "重くする議論そのものには\n反対しない、とも付け加えている。"}, {"t": 864.95, "x": "じゃあ誰も反対してないのに、進まなかったのね。"}, {"t": 868.15, "x": "そうなる。"}, {"t": 868.8333333333334, "x": "法案は国会が替わるたびに\n「継続」として持ち越された。"}, {"t": 872.5, "x": "1957年12月19日。"}, {"t": 875.0, "x": "参議院の法務委員会の記録だ。"}, {"t": 877.1833333333333, "x": "「審査及び調査を終了するに\n至っておりませんので、未了の旨の報告書を提出」"}, {"t": 882.25, "x": "未了……。"}, {"t": 882.9333333333333, "x": "終わらなかった、という意味だ。"}, {"t": 884.7, "x": "1958年から1960年の会議録で、\nこの法案の名前を引いた。"}, {"t": 890.0166666666667, "x": "0件だった。法案はそこで記録から消えている。"}, {"t": 893.1833333333333, "x": "それで1960年が来たのね。"}, {"t": 895.7, "x": "刑法の改正を待っているあいだに、\n1960年の5月が来た。"}, {"t": 900.5666666666667, "x": "話を1963年に進める。"}, {"t": 903.25, "x": "この年の春、東京でまた子どもの誘拐事件が起きた。"}, {"t": 906.7333333333333, "x": "その事件はこのチャンネルの別の回で扱っている。"}, {"t": 909.7166666666667, "x": "今回はその審議の中で、この事件が\nどう呼ばれたかだけを見る。"}, {"t": 913.6166666666667, "x": "さっきの名前が初めて出た日ね。"}, {"t": 915.8166666666667, "x": "1963年5月7日。"}, {"t": 918.0666666666667, "x": "衆議院の地方行政委員会。"}, {"t": 919.9833333333333, "x": "答えたのは警察庁の刑事局長だ。"}, {"t": 922.4666666666667, "x": "「先年、いわゆる雅樹ちゃん殺しの苦い\n経験を持っておるのでございます」"}, {"t": 926.7666666666667, "x": "苦い経験。"}, {"t": 927.8333333333334, "x": "苦い経験だ。警察のほうから、そう言っている。"}, {"t": 930.9, "x": "局長はだから心構えは持っていたし\n指導もしていた、と続ける。"}, {"t": 934.9, "x": "ただし具体的にどこで捕まえるかは\n現場の判断になる、とも言った。"}, {"t": 939.1333333333333, "x": "心構えはあった、でも現場次第……。"}, {"t": 941.5166666666667, "x": "2日後、参議院の法務委員会でも、\n同じ局長がこの事件に触れる。"}, {"t": 945.95, "x": "「雅樹ちゃん殺しとか、あるいはその他の事件は」"}, {"t": 948.9333333333333, "x": "「個々のケースとしてわれわれのほうは\n貴重な教訓と心得ております」"}, {"t": 952.8833333333333, "x": "教訓ね。"}, {"t": 953.8166666666667, "x": "同じ委員会で、議員が数字も確かめている。"}, {"t": 956.6166666666667, "x": "略取と誘拐の罪は、前の年度に\n229件あったという答弁だ。"}, {"t": 961.2833333333333, "x": "そんなにあったの？"}, {"t": 962.5166666666667, "x": "ただ局長はその大部分は\n人身売買の形ではないか、と答えている。"}, {"t": 966.95, "x": "身代金のための誘拐を、統計として\n分けて見ていなかったんだ。"}, {"t": 970.8666666666667, "x": "議員にそこを突かれて、局長は\n検討が足らなかったと認めている。"}, {"t": 975.4833333333333, "x": "同じ1963年5月7日、もう\n一人がこの事件を語っている。"}, {"t": 980.2, "x": "篠田弘作 国家公安委員長だ。"}, {"t": 982.6, "x": "警察のあり方を問われて、この事件を例に出した。"}, {"t": 985.75, "x": "「雅樹ちゃんはあの歯医者の家に\n長く生きていたわけです」"}, {"t": 988.9666666666667, "x": "え……。"}, {"t": 989.4166666666666, "x": "続けて読む。"}, {"t": 990.3666666666667, "x": "「警察でも大体目安をつけまして、\nその周囲を警戒しておったわけです」"}, {"t": 994.7833333333333, "x": "「ところがそこに入る口実がなくて入らないで\n遠巻きにしているうちに殺された」"}, {"t": 999.4333333333333, "x": "家の周りまで、来てたってこと？"}, {"t": 1001.5666666666667, "x": "大臣の認識では、そうだ。"}, {"t": 1003.5333333333333, "x": "大臣はさらに、こんなことまで言っている。"}, {"t": 1006.0, "x": "婦人警察官が「歯が痛い」と言って\n入るくらいの工夫はできたのではないか、と。"}, {"t": 1011.0333333333333, "x": "……それ本当なの？"}, {"t": 1012.25, "x": "ここは注意して聞いてほしい。"}, {"t": 1013.9, "x": "これは大臣が国会で述べた認識だ。"}, {"t": 1016.35, "x": "判決が認めた事実ではない。"}, {"t": 1018.3666666666667, "x": "判決の資料を引いた記録と並べると、\n時刻の流れが合うかどうかが確かめられない。"}, {"t": 1023.35, "x": "張り込みがいつ始まったのか、細かい\n時刻を一次資料で見られていないからだ。"}, {"t": 1027.9666666666667, "x": "だから言い切らないのね。"}, {"t": 1029.5166666666667, "x": "言い切らない。捜査員を責める材料にもしない。"}, {"t": 1032.2333333333333, "x": "ただ大臣が何を問題にしたかは、はっきりしている。"}, {"t": 1035.4833333333333, "x": "中に入る「口実」が無かったことだ。"}, {"t": 1038.1333333333334, "x": "「今の法律ではうっかり入ったら\nひどい目にあわされる」"}, {"t": 1041.1333333333334, "x": "そういう考えが警察官の頭を\n支配していた、と大臣は言った。"}, {"t": 1045.3166666666666, "x": "法律が分からなくて、こわくて入れなかった……。"}, {"t": 1048.1, "x": "大臣は、法律を変えなければ解決しないとは\n考えていない、とも言っている。"}, {"t": 1052.7, "x": "足りなかったのは法律ではなく\n頭の使い方だ、という言い方だった。"}, {"t": 1056.9833333333333, "x": "法律のせいなのか、使い方のせいなのか。"}, {"t": 1059.8666666666666, "x": "そこはこの回では決めない。"}, {"t": 1061.5, "x": "どちらの言い分も記録に残っている。"}, {"t": 1064.2833333333333, "x": "では新聞の側では何が変わったのか。"}, {"t": 1066.6333333333334, "x": "これも1963年5月7日の委員会に答えがある。"}, {"t": 1070.45, "x": "警察庁の刑事局長は、こう説明している。"}, {"t": 1073.45, "x": "「すでに雅樹ちゃんの事件におきまして、\n警視庁等におきましては苦い\n経験を持っておりますから」"}, {"t": 1079.05, "x": "報道することで被害者の命に\n関わるような場合には、と前置きして。"}, {"t": 1083.2166666666667, "x": "「警察捜査当局と各報道機関の責任者におきまして」"}, {"t": 1087.0, "x": "「その取り扱いにおいて万全を\n期する打ち合わせの措置が\n講ぜられることの道が開かれておる」"}, {"t": 1092.25, "x": "打ち合わせの道？"}, {"t": 1093.4666666666667, "x": "誘拐が起きたら、警察と報道の責任者が\n話し合う道ができていた、ということだ。"}, {"t": 1098.7, "x": "1960年の5月には、その道が無かった。"}, {"t": 1102.2333333333333, "x": "だから新聞はそのまま書いた。"}, {"t": 1104.2333333333333, "x": "そうだ。誰もそれを止める仕組みを持っていなかった。"}, {"t": 1107.2166666666667, "x": "2日後の参議院では、同じ局長がこうも言っている。"}, {"t": 1110.4833333333333, "x": "「雅樹ちゃん殺しという事件、\nこのときの反省というものがあるのでございます」"}, {"t": 1114.7666666666667, "x": "「部外との協定というようなものも」と続けて\nそれを教育の資料に使った、と。"}, {"t": 1119.6166666666666, "x": "協定。"}, {"t": 1120.3666666666666, "x": "協定だ。この言葉がのちに正式な名前になっていく。"}, {"t": 1123.7666666666667, "x": "ここで一つ言い過ぎないようにしておく。"}, {"t": 1125.9666666666667, "x": "この取り決めが「この事件だけ」から\n生まれたとは言わない。"}, {"t": 1129.3666666666666, "x": "答弁は雅樹ちゃん事件を\n「苦い経験」「反省」と呼んだ。"}, {"t": 1133.15, "x": "その言葉のとおりに、ここに置いておく。"}, {"t": 1135.6, "x": "記録の言葉以上には、広げないのね。"}, {"t": 1138.2333333333333, "x": "広げない。それがこの回のやり方だ。"}, {"t": 1141.2833333333333, "x": "その「打ち合わせの道」はのちに文書になる。"}, {"t": 1144.15, "x": "いまも公開されている、ある県警の通達を\n読んでみた。"}, {"t": 1147.4666666666667, "x": "昭和59年つまり1984年の埼玉県警の通達だ。"}, {"t": 1152.0333333333333, "x": "県警の文書？"}, {"t": 1153.2833333333333, "x": "誘拐の報道をどう扱うかの決まりを、\n警察の内部向けに整理したものだ。"}, {"t": 1157.8, "x": "そこに決まりの元になった\n文書が日付つきで並んでいる。"}, {"t": 1161.1833333333334, "x": "日本新聞協会の「誘かい報道の取り扱い方針」。"}, {"t": 1164.6, "x": "1970年2月5日。"}, {"t": 1166.8166666666666, "x": "日本民間放送連盟の同じ趣旨の決まり。"}, {"t": 1169.5666666666666, "x": "1970年9月11日。"}, {"t": 1172.0166666666667, "x": "日本雑誌協会の決まり。"}, {"t": 1173.5666666666666, "x": "1980年7月7日だ。"}, {"t": 1176.2333333333333, "x": "新聞、テレビ、雑誌って、順番に広がっていったのね。"}, {"t": 1179.9833333333333, "x": "そうだ。1960年の事件から数えると、\n新聞の文書まで10年かかっている。"}, {"t": 1185.3666666666666, "x": "この通達には、協定の性格もはっきり書いてある。"}, {"t": 1188.5666666666666, "x": "「協定は、人命尊重の立場からの自主規制であって」"}, {"t": 1192.0166666666667, "x": "「全国の協会加盟の各社間協定である」"}, {"t": 1194.9166666666667, "x": "警察と新聞が結ぶ約束じゃないの？"}, {"t": 1197.5333333333333, "x": "違う。報道各社どうしの約束だ。"}, {"t": 1199.8333333333333, "x": "通達にもそう書いてある。"}, {"t": 1201.4833333333333, "x": "「いずれの協定も、警察と報道機関との間で\n締結されるものではない」"}, {"t": 1205.9833333333333, "x": "へえ警察が書くなって命令するんじゃないのね。"}, {"t": 1208.8, "x": "命令ではない。報道の側が\n自分たちで書くのを待つ決まりだ。"}, {"t": 1212.4166666666667, "x": "そして子どもが見つかったり\n保護されたりしたら、協定は解かれる。"}, {"t": 1216.1666666666667, "x": "いまも誘拐事件が起きると、\nしばらく報道が出ないことがある。"}, {"t": 1219.8166666666666, "x": "その静けさの手前に、1960年5月の紙面がある。"}, {"t": 1224.3666666666666, "x": "前半で男は外国の事件を手本にした、と言った。"}, {"t": 1227.7333333333333, "x": "ここで4年後の国会のもう一つの言葉を読む。"}, {"t": 1230.6166666666666, "x": "1964年3月12日。"}, {"t": 1233.0333333333333, "x": "衆議院の法務委員会だ。"}, {"t": 1234.75, "x": "法務省の刑事局長が、戦後の身代金目的の誘拐を\n調べた結果を話している。"}, {"t": 1240.15, "x": "「三十一例を調べたのでございますけれども、\nその中で殺されておりますのが六例ございます」"}, {"t": 1245.7666666666667, "x": "31件のうち、6件……。"}, {"t": 1247.8166666666666, "x": "未遂に終わったものが1件。"}, {"t": 1249.5, "x": "薬を飲まされて、見つかったときに\n重い状態だった例が4件。"}, {"t": 1253.4833333333333, "x": "子どもを眠らせるのね……。"}, {"t": 1255.05, "x": "局長はこの犯罪はまねされやすい、と言う。"}, {"t": 1257.7, "x": "「犯人としてつかまって取り調べを受けた\n者の供述しておるところを見ましても」"}, {"t": 1262.2833333333333, "x": "「実はリンドバーグ事件をまねて、\nヒントを得てやりました」"}, {"t": 1265.55, "x": "「あるいは雅樹ちゃん事件に\nヒントを得たとかいうようなことを\n述べておるのがこれまた数例ございます」"}, {"t": 1270.7666666666667, "x": "……この事件が、手本にされた？"}, {"t": 1272.8, "x": "そう供述した者が、数例いた。"}, {"t": 1275.2, "x": "前半で言ってた「逆の向き」ってこれね。"}, {"t": 1277.9166666666667, "x": "そうだ。外国の事件を手本にした\n男の事件が、今度は手本にされた。"}, {"t": 1282.5166666666667, "x": "まねがまねを呼んでいた。"}, {"t": 1283.9166666666667, "x": "局長はこうも言っている。"}, {"t": 1285.4333333333334, "x": "新聞が書くせいだとだけは言えない、と。"}, {"t": 1287.7666666666667, "x": "ただ事件が起きるたびに国会で何度も\n議論になった、とも数えている。"}, {"t": 1292.0333333333333, "x": "数えてたの？"}, {"t": 1293.1, "x": "日を追って調べた、と本人が言っている。"}, {"t": 1295.5333333333333, "x": "それくらい社会が揺れていた。"}, {"t": 1297.2833333333333, "x": "そして局長は、1955年の法案のことにも触れた。"}, {"t": 1301.2166666666667, "x": "「参議院の中山法務委員長が当時御自分で\n立案をいたしまして特別法を提案された」"}, {"t": 1306.6, "x": "中山さんの法案、ちゃんと覚えられてたのね。"}, {"t": 1309.45, "x": "覚えられていた。"}, {"t": 1310.4666666666667, "x": "9年越しに国会の記録の上でつながったわけだ。"}, {"t": 1314.1, "x": "1964年3月3日。"}, {"t": 1316.4833333333333, "x": "法務大臣が刑法を変える案を国会に出した。"}, {"t": 1319.3, "x": "賀屋興宣 法務大臣の、提案の説明を読む。"}, {"t": 1322.4833333333333, "x": "「いわゆる身のしろ金目的の誘拐罪及びこれに"}, {"t": 1325.15, "x": "関連する犯罪について特別の処罰規定を\n新設しようとするものであります」"}, {"t": 1330.0166666666667, "x": "身のしろ金？"}, {"t": 1331.0166666666667, "x": "身代金のことだ。当時の国会では、こう書いていた。"}, {"t": 1334.45, "x": "大臣はいまの刑法では足りないとはっきり言う。"}, {"t": 1337.0666666666666, "x": "「刑法第二二五条によって一般の営利誘拐罪と\n同様に処罰することとしている現行刑法は」"}, {"t": 1343.05, "x": "「この種犯罪に対処するのに\n十分でないと考えられるのでありまして」"}, {"t": 1347.1833333333334, "x": "1955年には、今の法律で足りるって言ってたのに。"}, {"t": 1351.0666666666666, "x": "9年で役所の答えが逆になった。"}, {"t": 1353.3833333333334, "x": "新しい罪はこういう形だった。"}, {"t": 1355.45, "x": "家族の心配につけこんで金を出させる\n目的で、人を連れ去った者。"}, {"t": 1359.8166666666666, "x": "刑は無期または3年以上の懲役。"}, {"t": 1362.1833333333334, "x": "上限が10年から無期に。"}, {"t": 1364.0, "x": "そうだ。金を出させたり\n要求したりしたときも、同じ重さにした。"}, {"t": 1368.1333333333334, "x": "大臣はここもはっきり言っている。"}, {"t": 1370.0666666666666, "x": "「従来、実務上は単なる恐喝罪として\n処理されてまいりましたものを"}, {"t": 1374.2, "x": "重く処罰し得るようにしようとするものであります」"}, {"t": 1376.9333333333334, "x": "恐喝で数えてた部分も、ちゃんと重くしたのね。"}, {"t": 1380.1, "x": "そうだ。1960年に「恐喝未遂」と\n呼ばれた部分の名前が、ここで変わる。"}, {"t": 1385.5, "x": "それと局長は急ぐ理由も話していた。"}, {"t": 1387.9666666666667, "x": "刑法全体の改正には、まだ何年もかかる。"}, {"t": 1390.95, "x": "「その間これを放置することは\n刑事政策的に見ましてもとうていできない」"}, {"t": 1395.25, "x": "1955年は待とうって言って、\n1964年は待てないって言ったのね。"}, {"t": 1400.4666666666667, "x": "そういうことになる。"}, {"t": 1401.65, "x": "待つあいだに、何件もの事件が挟まった。"}, {"t": 1405.0, "x": "この1964年の案で、私が\n一番目を引かれた条文がある。"}, {"t": 1409.45, "x": "重くする話ではなく、軽くする話だ。"}, {"t": 1412.3333333333333, "x": "軽くする？"}, {"t": 1413.2666666666667, "x": "大臣は説明の6点目でこう言っている。"}, {"t": 1415.7666666666667, "x": "「公訴の提起前に被拐取者を安全な場所に\n解放したときは、必ずその刑を減軽する」"}, {"t": 1421.2666666666667, "x": "連れ去った子を、無事に返したら？"}, {"t": 1423.4333333333334, "x": "起訴される前に返せば、刑を必ず軽くする。"}, {"t": 1426.5333333333333, "x": "犯人に優しすぎない？"}, {"t": 1428.15, "x": "大臣はねらいをこう言っている。"}, {"t": 1429.8833333333334, "x": "「一たびこのような罪が犯された場合、"}, {"t": 1432.05, "x": "犯人が被拐取者に危害を加えることを\n防ごうとするものであります」"}, {"t": 1436.2, "x": "……返す理由を、犯人に持たせるってことね。"}, {"t": 1438.9666666666667, "x": "そうだ。罰を重くするだけでは、\n追い詰められた犯人は逃げ道をなくす。"}, {"t": 1443.2666666666667, "x": "逃げ道をなくした犯人が何をするか。"}, {"t": 1445.7, "x": "それを法律の側が先に考えた。"}, {"t": 1448.0833333333333, "x": "1960年の男には、その逃げ道が無かった。"}, {"t": 1451.8, "x": "そこはつなげて考えすぎないでおく。"}, {"t": 1454.0, "x": "あの男が何を考えたかは、\n判決の中にしか無いからだ。"}, {"t": 1457.75, "x": "ただ条文の設計としては、子どもを\n生きて返させることを一番に置いている。"}, {"t": 1462.15, "x": "7点目も見ておく。実行の前の準備も\n罰する、という条文だ。"}, {"t": 1466.2, "x": "ただし実行に手をつける前に\n自首すれば、刑を軽くするか免除する。"}, {"t": 1470.45, "x": "やる前にやめたら、許すってこと？"}, {"t": 1472.8, "x": "許すというより、やめる理由を\n残しておく、という作りだ。"}, {"t": 1476.2833333333333, "x": "重くする条文と、引き返させる条文。"}, {"t": 1478.8833333333334, "x": "両方が一緒に入っていた。"}, {"t": 1481.2166666666667, "x": "返せば軽くする、という\n条文には、もう一つ背景がある。"}, {"t": 1484.8666666666666, "x": "1964年3月10日。"}, {"t": 1487.2166666666667, "x": "衆議院の法務委員会で、\n法務省の刑事局長がこう話した。"}, {"t": 1491.1, "x": "「刑を重くすることばかりが\nこれを防ぐ唯一の方法ではない」"}, {"t": 1494.6666666666667, "x": "役所のほうから、それを言うのね。"}, {"t": 1496.85, "x": "言っている。続けて捜査の現場のことに触れる。"}, {"t": 1499.6833333333334, "x": "捜査に当たる者は、犯人を捕まえると同時に、\n被害者を安全に取り戻すことを心がけてきた。"}, {"t": 1505.7166666666667, "x": "「捜査のある程度の犠牲は\n払っても」という言い方までしている。"}, {"t": 1509.4166666666667, "x": "犯人を逃がしてでも、子どもを取り戻す。"}, {"t": 1512.1166666666666, "x": "そういう覚悟だ。"}, {"t": 1513.2333333333333, "x": "1956年の刑事部長の「逮捕はあとでもよろしい」と\n同じ向きだな。"}, {"t": 1518.0, "x": "局長はその考えを法律にも入れたい、と言った。"}, {"t": 1521.0333333333333, "x": "「これを法律的にもそういう道を\n開いておく必要があるのではないか」"}, {"t": 1524.9666666666667, "x": "6月26日の参議院でも、同じ局長が\nまた同じことを言っている。"}, {"t": 1529.5, "x": "「犯人の検挙とともに被害者を安全に取り戻すという\n両面の考慮がきわめて重要な犯罪でございます」"}, {"t": 1535.7166666666667, "x": "両面ね。"}, {"t": 1536.6333333333334, "x": "同じ日、法務省の参事官は、戦後の事例を\n集めた冊子を委員に配ったと述べている。"}, {"t": 1541.8666666666666, "x": "犯人は20代が多く、精神の異常がある\n者はむしろ少ない、と。"}, {"t": 1545.9833333333333, "x": "目立つのはまねをする性格が強いことだという。"}, {"t": 1548.7166666666667, "x": "大臣は外国の似た事件が活字や映画で\n紹介されることも原因の一つだろう、と答えた。"}, {"t": 1554.4, "x": "1960年の男も、外国の事件を手本にしてたわね。"}, {"t": 1558.6666666666667, "x": "していた。"}, {"t": 1559.3833333333334, "x": "記録の言葉が、あの男の動機の認定とそのまま重なる。"}, {"t": 1563.25, "x": "まねさせない仕組みと、取り戻す仕組み。"}, {"t": 1565.85, "x": "その二つを一度に入れようとしたのが、\n1964年の改正だった。"}, {"t": 1571.0333333333333, "x": "この案は衆議院の法務委員会で\nかなり細かく議論されている。"}, {"t": 1574.6333333333334, "x": "賛成ばかりではなかった。"}, {"t": 1576.4, "x": "反対もあったの？"}, {"t": 1577.7166666666667, "x": "重くする中身に、疑問を出した議員がいる。"}, {"t": 1580.4, "x": "3月12日には、ある議員がこう問いかけている。"}, {"t": 1583.4666666666667, "x": "数人で計画する事件が増えたのは、\n社会が複雑になったからではないか。"}, {"t": 1588.0833333333333, "x": "それはこの罪だけを重くする理由になるのか、と。"}, {"t": 1591.1833333333334, "x": "重くすれば減るのか、ってことね。"}, {"t": 1593.3666666666666, "x": "そうだ。3月17日には、別の議員が\nまさにそこを聞いている。"}, {"t": 1597.4833333333333, "x": "「刑の強化だけでこの目的が\n十分に果たされるかどうか」"}, {"t": 1600.8833333333334, "x": "「どういうことが並行的に\n行なわれなければならないか」"}, {"t": 1604.1333333333334, "x": "法律以外に何をするのかってことね。"}, {"t": 1606.6166666666666, "x": "そういう問いだ。答えはこの回では深追いしない。"}, {"t": 1609.4166666666667, "x": "ただ問いが記録に残っていることには意味がある。"}, {"t": 1612.1166666666666, "x": "法律を変えれば終わり、とは\n国会でも考えていなかった。"}, {"t": 1615.6333333333334, "x": "新聞の協定とか、警察の心構えとか。"}, {"t": 1618.75, "x": "そうだ。ここまで見てきたものは、\n全部「並行して」動いていた。"}, {"t": 1622.9166666666667, "x": "委員会では無期の刑を置くことの是非も\n議論になっている。"}, {"t": 1626.1, "x": "法務省は法制審議会でも無期を置くのが\n相当だという結論になった、と答えた。"}, {"t": 1631.0333333333333, "x": "3月26日、衆議院の法務委員会で採決。"}, {"t": 1634.5, "x": "全会一致で可決された。"}, {"t": 1636.25, "x": "翌27日、衆議院の本会議で可決。"}, {"t": 1639.3833333333334, "x": "衆議院は通ったのね。"}, {"t": 1640.95, "x": "通った。残るは参議院だ。"}, {"t": 1643.4666666666667, "x": "1964年6月26日。参議院の本会議。"}, {"t": 1647.4666666666667, "x": "この案は日程に追加される形で議題になった。"}, {"t": 1650.5, "x": "法務委員会の審議を報告するために、\n委員長が壇上に立つ。"}, {"t": 1654.35, "x": "報告したのは、法務委員長の中山福藏 議員だ。"}, {"t": 1658.0, "x": "中山さん！ 1955年の法案の人よね。"}, {"t": 1661.4666666666667, "x": "その人だ。"}, {"t": 1662.3666666666666, "x": "9年前、7歳に満たない子を守る法案を出した議員だ。"}, {"t": 1665.9666666666667, "x": "その人が法務委員長として、この案の報告をしている。"}, {"t": 1669.5666666666666, "x": "……めぐり合わせね。"}, {"t": 1670.7, "x": "報告の言葉を読む。"}, {"t": 1672.1333333333334, "x": "「いわゆる身のしろ金を目的とする\n略取・誘拐罪に対処するため」"}, {"t": 1676.3, "x": "「これに関連する刑法の規定を\n整備強化しようとするものでありまして」"}, {"t": 1680.35, "x": "委員会ではある会派の議員が反対の意見を\n述べたことも、そのまま報告している。"}, {"t": 1685.15, "x": "「本案は多数をもって原案どおり\n可決すべきものと決定いたしました」"}, {"t": 1689.25, "x": "そして本会議で可決された。"}, {"t": 1691.3166666666666, "x": "これで法律になったのね。"}, {"t": 1693.05, "x": "国会で成立した。"}, {"t": 1694.4666666666667, "x": "1960年の5月から数えて、4年と1か月あまりだ。"}, {"t": 1698.75, "x": "1955年から数えると、9年。"}, {"t": 1701.6166666666666, "x": "9年だ。その9年のあいだに、\n何件もの事件が記録に残った。"}, {"t": 1705.95, "x": "中山福藏 議員の報告に、\n1960年の事件の名前は出てこない。"}, {"t": 1710.95, "x": "報告とはそういうものだ。"}, {"t": 1712.5333333333333, "x": "個別の事件ではなく、罪の形を語る。"}, {"t": 1715.4, "x": "でもその形の中に、あの5月が入ってる。"}, {"t": 1718.4, "x": "入っていると私は読む。"}, {"t": 1719.95, "x": "ただそれは私の読み方として言っておく。"}, {"t": 1723.0833333333333, "x": "法律の話から、男の裁判に話を戻す。"}, {"t": 1726.3333333333333, "x": "1961年3月、東京地方裁判所は\n男に死刑を言い渡した。"}, {"t": 1731.3, "x": "裁判では男の精神の状態が争われている。"}, {"t": 1734.3666666666666, "x": "責任を問えるかどうか、ってこと？"}, {"t": 1736.5666666666666, "x": "そうだ。弁護側は犯行のとき\n心神耗弱だったと主張した。"}, {"t": 1740.45, "x": "鑑定が行われ、地裁はその主張を退けている。"}, {"t": 1743.6166666666666, "x": "男は控訴した。1966年8月、\n東京高裁も控訴を退けた。"}, {"t": 1749.05, "x": "5年もかかってるのね。"}, {"t": 1750.65, "x": "高裁でももう一度精神の状態が\n調べられたと伝えられている。"}, {"t": 1754.4, "x": "そして1967年5月25日、最高裁判所の第一小法廷。"}, {"t": 1759.5166666666667, "x": "判決の全文は、いまも\n裁判所のサイトで読める。とても短い。"}, {"t": 1763.5666666666666, "x": "「本件上告を棄却する」"}, {"t": 1765.4333333333334, "x": "それだけ？"}, {"t": 1766.35, "x": "理由も短い。読む。"}, {"t": 1767.8333333333333, "x": "弁護人の名前のあとに、こう続く。"}, {"t": 1770.1333333333334, "x": "「上告趣意は、事実誤認、\n単なる法令違反の主張であって、\n適法な上告理由に当らない」"}, {"t": 1775.9, "x": "「裁判官全員一致の意見で、主文のとおり判決する」"}, {"t": 1779.5833333333333, "x": "全員一致。"}, {"t": 1780.6166666666666, "x": "5人の裁判官の名前が並んでいる。"}, {"t": 1782.9333333333334, "x": "これで死刑が確定に向かった。"}, {"t": 1784.8666666666666, "x": "刑は1970年10月に執行されている。"}, {"t": 1788.1333333333334, "x": "事件から10年ね。"}, {"t": 1789.6166666666666, "x": "10年だ。"}, {"t": 1790.4166666666667, "x": "その10年のあいだに、\n身代金の誘拐を裁く罪ができた。"}, {"t": 1794.2, "x": "報道の協定も、文書になった。"}, {"t": 1796.3833333333334, "x": "男が裁かれた罪の名前は、最後まで\n「営利誘拐」と「恐喝未遂」のままだった。"}, {"t": 1802.0666666666666, "x": "法律が変わっても、昔の事件には\nさかのぼらないのね。"}, {"t": 1805.6666666666667, "x": "さかのぼらない。"}, {"t": 1806.65, "x": "罪は起きたときの法律で裁く。それが決まりだ。"}, {"t": 1810.3833333333334, "x": "最後にいまの刑法を開いてみる。"}, {"t": 1812.3666666666666, "x": "225条の2。見出しは「身の代金目的略取等」だ。"}, {"t": 1816.6833333333334, "x": "いまもあるのね。"}, {"t": 1817.8166666666666, "x": "ある。読む。"}, {"t": 1818.7, "x": "「近親者その他略取され又は誘拐された\n者の安否を憂慮する者の憂慮に乗じて」"}, {"t": 1823.7, "x": "「その財物を交付させる目的で、人を略取し、又は\n誘拐した者は、無期又は三年以上の拘禁刑に処する」"}, {"t": 1830.9833333333333, "x": "拘禁刑？ 懲役じゃないの？"}, {"t": 1832.9333333333334, "x": "2025年の6月から、懲役と禁錮が\n「拘禁刑」という一つの刑にまとめられた。"}, {"t": 1838.65, "x": "名前は変わったが、無期または\n3年以上という重さは1964年のままだ。"}, {"t": 1843.8166666666666, "x": "60年以上、同じ重さなのね。"}, {"t": 1846.2333333333333, "x": "そうだ。2項には金を出させたり\n要求したりする行為も同じだと書いてある。"}, {"t": 1850.65, "x": "1960年には「恐喝未遂」と呼ばれた\n部分が、ここに入っている。"}, {"t": 1855.6, "x": "1960年の事件は、いまの条文で\n言えば、ここに当たるのね。"}, {"t": 1860.0166666666667, "x": "いまの条文で言えば、そうなる。"}, {"t": 1861.9166666666667, "x": "誘拐全般の225条のほうは、\n上限10年のまま残っている。"}, {"t": 1866.2333333333333, "x": "身代金のための誘拐だけが、\nそこから切り出された形だ。"}, {"t": 1870.2166666666667, "x": "切り出すまでに、9年かかった。"}, {"t": 1872.4333333333334, "x": "かかった。議論は1955年から記録にある。"}, {"t": 1875.7833333333333, "x": "法務省は待とうと言い、警察は今ので足りると言った。"}, {"t": 1878.9333333333334, "x": "重くすること自体に反対する\n人はいないのに、決まりは動かなかった。"}, {"t": 1883.1666666666667, "x": "動いたのは何件もの事件が重なったあとだ。"}, {"t": 1886.5333333333333, "x": "今回の話の出どころを並べておく。"}, {"t": 1888.85, "x": "裁判の罪名と最高裁の判決文は、\n裁判所の判例検索で公開されている全文だ。"}, {"t": 1894.5333333333333, "x": "1960年5月19日と20日の国会は、\n衆議院本会議の第32号と第33号。"}, {"t": 1901.0666666666666, "x": "「苦い経験」と国家公安委員長の発言は、\n1963年5月7日、衆議院地方行政委員会 第20号。"}, {"t": 1908.9, "x": "「貴重な教訓」と229件は、\n1963年5月9日、参議院法務委員会 第12号。"}, {"t": 1915.9833333333333, "x": "1955年の法案は、\n同じ年の7月27日の参議院法務委員会と、\n7月30日の衆議院法務委員会。"}, {"t": 1924.05, "x": "「未了」は1957年12月19日の参議院法務委員会。"}, {"t": 1928.4833333333333, "x": "1964年の提案の説明は、\n3月3日の衆議院法務委員会 第9号。"}, {"t": 1934.0333333333333, "x": "上限10年と31例の話は、\n3月12日の衆議院法務委員会 第13号。"}, {"t": 1939.7333333333333, "x": "成立は6月26日の参議院本会議 第32号だ。"}, {"t": 1943.8666666666666, "x": "報道の協定は、埼玉県警察が公開している通達。"}, {"t": 1947.6166666666666, "x": "いまの条文は、国の法令検索サービスで読める。"}, {"t": 1950.7166666666667, "x": "事件当日の流れは、判決の資料を引いた記録と、\n当時の報道をまとめた記事を照らして使った。"}, {"t": 1956.9166666666667, "x": "0件っていうのは？"}, {"t": 1958.3, "x": "国会会議録の検索で、期間を区切って実際に数えた。"}, {"t": 1962.0333333333333, "x": "言葉を変えて何度も引いている。"}, {"t": 1963.8833333333334, "x": "この回で話さなかったことも言っておく。"}, {"t": 1966.2666666666667, "x": "男の子の最期の様子。ご家族のこと。"}, {"t": 1968.9166666666667, "x": "犯人の名前。身代金の額。"}, {"t": 1971.1666666666667, "x": "額は資料によって書き方が違い、\n一次資料で確かめられなかった。"}, {"t": 1975.35, "x": "捜査が正しかったかどうかも、決めていない。"}, {"t": 1978.6666666666667, "x": "ねえ最初の電話の話に戻っていい？"}, {"t": 1981.0166666666667, "x": "いいぞ。"}, {"t": 1981.6833333333334, "x": "あの電話を受けたとき、家の人には\n何も持たされてなかったのよね。"}, {"t": 1985.7666666666667, "x": "何もとは言わないが、決まりとして\n守ってくれるものは少なかった。"}, {"t": 1989.65, "x": "報道を待つ協定は無かった。"}, {"t": 1991.4666666666667, "x": "身代金の誘拐を重く裁く罪も無かった。"}, {"t": 1994.3166666666666, "x": "国会は事件のあとその年のうちに、\nこの言葉を一度も記録に残していない。"}, {"t": 1999.0833333333333, "x": "いまはその三つが全部あるのね。"}, {"t": 2001.1333333333334, "x": "全部ある。どれもあとから足されたものだ。"}, {"t": 2003.6833333333334, "x": "足されたのは、誰かが言い出したから？"}, {"t": 2006.0666666666666, "x": "言い出した人は、1955年からいた。"}, {"t": 2009.0333333333333, "x": "足りないと言われ続けて、待とうと言われ続けて、\n事件が重なって、やっと足された。"}, {"t": 2014.2666666666667, "x": "……間に合わなかった子がいる、ってことよね。"}, {"t": 2016.6666666666667, "x": "そういう言い方もできる。だが私はそこで止めない。"}, {"t": 2019.6666666666667, "x": "1964年の条文には、子どもを返せば\n刑を軽くするという一文が入った。"}, {"t": 2024.8833333333334, "x": "報道の協定は、子どもが見つかるまで書くのを待つ。"}, {"t": 2027.9666666666667, "x": "どちらも次に連れ去られる子が\n生きて帰ることを第一に置いている。"}, {"t": 2031.7333333333333, "x": "次の子のための決まり、なのね。"}, {"t": 2033.95, "x": "そうだ。1960年5月16日の昼前に\n鳴った電話は、その手前にあった。"}, {"t": 2039.4166666666667, "x": "受話器の向こうの声が誰なのか、\nまだ誰にも分からなかったころだ。"}, {"t": 2043.3333333333333, "x": "そのとき無かったものが、いまはある。"}, {"t": 2045.5166666666667, "x": "今回はその「あとから足されたもの」の記録を\n読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
