<script>
const D={"name": "147", "file": "147_編集用", "dur": 2053.7833125, "segs": [], "subs": [{"t": 0.0, "x": "1974年7月18日、大阪の高津派出所。"}, {"t": 4.233333333333333, "x": "南警察署の派出所から拳銃が2丁なくなった。"}, {"t": 7.566666666666666, "x": "扉はこじ開けられ、かぎは壊されていた。"}, {"t": 10.133333333333333, "x": "一緒に手錠と帯革も消えていた。"}, {"t": 12.3, "x": "警察の拳銃が盗まれたの？"}, {"t": 14.416666666666666, "x": "そうだ。そして4週間後、1丁はソウルにあった。"}, {"t": 17.683333333333334, "x": "8月15日、韓国の光復節の式典で使われたんだ。"}, {"t": 21.683333333333334, "x": "大統領を狙った銃撃の中で、\n夫人の陸英修が命を落とした。"}, {"t": 25.866666666666667, "x": "会場にいた女子高校生も亡くなっている。"}, {"t": 28.483333333333334, "x": "日本の交番の拳銃が韓国の式典に？"}, {"t": 31.333333333333332, "x": "撃った男は日本で生まれた在日韓国人だった。"}, {"t": 34.45, "x": "名前は文世光。持っていたのは日本の旅券だ。"}, {"t": 37.416666666666664, "x": "しかも旅券の名前は本人の名前じゃなかった。"}, {"t": 40.35, "x": "じゃあもう1丁はどこにあったの？"}, {"t": 42.28333333333333, "x": "大阪の男の自宅の2階の床下だ。"}, {"t": 45.016666666666666, "x": "床下！"}, {"t": 46.13333333333333, "x": "拳銃2丁と車の工具それに旅券が2冊。"}, {"t": 49.03333333333333, "x": "日本側にはこういう物と書類が残った。"}, {"t": 51.68333333333333, "x": "それって全部日本の中の話？"}, {"t": 53.916666666666664, "x": "そうだ。撃ったのはソウルでも、\n準備は日本の中だった。"}, {"t": 57.333333333333336, "x": "この秋、日本の国会は何度も\nこの事件を取り上げている。"}, {"t": 60.833333333333336, "x": "今回は文世光事件を、日本に\n残った物から読んでいく。"}, {"t": 64.51666666666667, "x": "使うのは国会の会議録と役所の答弁だ。"}, {"t": 67.36666666666666, "x": "ソウルで撃った場面はこの回では描かない。"}, {"t": 69.9, "x": "物の話で事件が見えるの？"}, {"t": 71.9, "x": "見える。最後は首相の親書と\n特使の1枚のメモまで行く。"}, {"t": 75.61666666666666, "x": "メモ1枚で、何が決まったの？"}, {"t": 77.81666666666666, "x": "そこも国会の答弁で確かめる。"}, {"t": 79.83333333333333, "x": "役所がどこで言葉を止めたかもだ。"}, {"t": 82.1, "x": "まずは1974年の夏、日本と韓国の間の空気からだ。"}, {"t": 87.16666666666667, "x": "前の年の1973年、東京で金大中事件が起きている。"}, {"t": 91.5, "x": "韓国の政治家がホテルから連れ去られた事件だ。"}, {"t": 94.55, "x": "この番組でも前に取り上げたわね。"}, {"t": 96.8, "x": "あの件は日韓の間でまだ片づいていなかった。"}, {"t": 99.7, "x": "日本の警察は韓国の外交官の指紋を示していた。"}, {"t": 103.15, "x": "ところが1974年8月14日、韓国から通告が来る。"}, {"t": 107.71666666666667, "x": "韓国側の捜査としては打ち切る、という内容だった。"}, {"t": 111.15, "x": "日本は納得していたの？"}, {"t": 112.93333333333334, "x": "していない。外務省は押し返すつもりだった。"}, {"t": 115.65, "x": "その翌日が8月15日だった。"}, {"t": 118.16666666666667, "x": "通告の次の日にあの式典なのね。"}, {"t": 120.63333333333334, "x": "そうだ。のちに外務省の局長が国会で振り返っている。"}, {"t": 124.16666666666667, "x": "押し返そうとしたその8月15日に事件が起こった、と。"}, {"t": 127.85, "x": "それで日韓関係がまた大きく揺れた、という言い方だ。"}, {"t": 131.21666666666667, "x": "2つの事件は性格が違う、と外務大臣は答えている。"}, {"t": 134.81666666666666, "x": "ただ同じ年の同じ夏に、2つが重なったのは事実だ。"}, {"t": 139.16666666666666, "x": "8月15日は、韓国では光復節と呼ばれる記念日だ。"}, {"t": 143.0, "x": "この日には大統領の出る式典が開かれる。"}, {"t": 145.7, "x": "1974年の会場はソウルの国立劇場だった。"}, {"t": 149.46666666666667, "x": "日本からは、ソウルにいる\n日本の大使が出席していた。"}, {"t": 152.98333333333332, "x": "大使は目の前で見ていたの？"}, {"t": 154.8, "x": "大使は会場の中にいた。ただ国会で\n外務省の課長はこう言っている。"}, {"t": 158.98333333333332, "x": "一瞬のできごとで、大使にも\n詳しいことは分からなかった。"}, {"t": 162.45, "x": "弾の数も大使からの報告には無かったそうだ。"}, {"t": 165.38333333333333, "x": "国会の答弁では、発射された弾は4発とされている。"}, {"t": 168.9, "x": "大統領は無事だった。"}, {"t": 170.38333333333333, "x": "陸英修夫人はこの日の銃撃で亡くなった。"}, {"t": 173.13333333333333, "x": "外務大臣は国会で深い哀悼の意を述べている。"}, {"t": 176.15, "x": "女子高校生はどうして会場に？"}, {"t": 178.26666666666668, "x": "式典の合唱に来ていたと、\n国会の質問で触れられている。"}, {"t": 182.0, "x": "韓国の百科事典も、亡くなった女子学生を記している。"}, {"t": 185.61666666666667, "x": "この回ではその人の名前は出さない。"}, {"t": 187.86666666666667, "x": "2人が亡くなったことだけをここに置いておく。"}, {"t": 190.46666666666667, "x": "男はその場で取り押さえられた。"}, {"t": 192.5, "x": "じゃあ犯人はすぐ分かったのね。"}, {"t": 194.48333333333332, "x": "それがすぐではなかった。"}, {"t": 196.6, "x": "取り押さえられた男は日本の旅券を持っていた。"}, {"t": 199.36666666666667, "x": "旅券に貼られた写真と男の顔は同じだった。"}, {"t": 202.28333333333333, "x": "名前の欄には日本人の男の名前があった。"}, {"t": 205.18333333333334, "x": "それなら日本人だと思うわよね。"}, {"t": 207.33333333333334, "x": "そうだ。韓国の外務部長官は大使にそう伝えた。"}, {"t": 210.6, "x": "犯人は日本人で、確証を得ている、と。"}, {"t": 213.26666666666668, "x": "大使は事実を確かめようと、長官に会いに出向いた。"}, {"t": 216.48333333333332, "x": "外務大臣の答弁ではお悔やみも伝えたという。"}, {"t": 219.38333333333333, "x": "本当に日本人だったの？"}, {"t": 221.2, "x": "外務省はすぐに名前の人の家に電話をかけた。"}, {"t": 224.13333333333333, "x": "出たのはその人の妻だった。"}, {"t": 226.03333333333333, "x": "主人はけさから大阪にいます、と答えたそうだ。"}, {"t": 229.18333333333334, "x": "ソウルじゃなくて大阪に？"}, {"t": 230.81666666666666, "x": "外務省は、これはおかしな話だと受け止めた。"}, {"t": 233.75, "x": "そこで旅券の申請書を調べ直した。"}, {"t": 236.11666666666667, "x": "申請書に貼ってある写真と、名前の本人の居場所だ。"}, {"t": 239.5, "x": "誤認だとはっきりしたのは5時過ぎだった。"}, {"t": 241.95, "x": "外務大臣も、数時間のずれは\n否定できないと答えている。"}, {"t": 245.66666666666666, "x": "名前を使われた人はたまったものじゃないわね。"}, {"t": 248.46666666666667, "x": "大臣も、たいへん迷惑なことになったと述べている。"}, {"t": 251.61666666666667, "x": "この回では、名前を使われた夫婦の名前は出さない。"}, {"t": 255.41666666666666, "x": "では撃った男は誰だったのか。"}, {"t": 257.3333333333333, "x": "男は大阪に住む在日韓国人だった。"}, {"t": 260.1166666666667, "x": "日本で生まれ日本で育っている。"}, {"t": 262.03333333333336, "x": "国家公安委員長も国会でそう説明した。"}, {"t": 264.93333333333334, "x": "日本で育った人が、どうして韓国の旅券じゃないの？"}, {"t": 268.4166666666667, "x": "外務省の説明では、在日韓国人が\n韓国へ渡るのに日本の旅券は要らない。"}, {"t": 273.45, "x": "日本政府が旅券を出すことは本来ないんだ。"}, {"t": 276.1333333333333, "x": "それなのに男は日本の旅券で渡っていた。"}, {"t": 278.8, "x": "外務省は、犯人は\n在日韓国人の文世光だと前提を改めた。"}, {"t": 283.43333333333334, "x": "日本の役所は前から知っていた人なの？"}, {"t": 286.06666666666666, "x": "公安調査庁の次長ははっきり否定している。"}, {"t": 288.76666666666665, "x": "これまで調査の対象になっておらず、\n事前の情報は全く無かった。"}, {"t": 292.8833333333333, "x": "そこから日本の警察の捜査が本格的に動く。"}, {"t": 296.0833333333333, "x": "調べることは大きく2つあった。"}, {"t": 298.1333333333333, "x": "1つは7月に盗まれた拳銃。"}, {"t": 300.3833333333333, "x": "もう1つは他人の名前で取られた旅券だ。"}, {"t": 303.06666666666666, "x": "撃った場面は日本の警察は調べないの？"}, {"t": 305.7, "x": "調べられない。のちに\n警察庁の局長がこう整理している。"}, {"t": 309.28333333333336, "x": "狙撃は外国人による外国での犯罪で、\n日本の警察に権限はない。"}, {"t": 313.8666666666667, "x": "日本が捜査できるのは、日本で\n行われた準備の部分だけだ。"}, {"t": 317.6333333333333, "x": "外務省は8月22日、\n捜査協力の考え方を説明している。"}, {"t": 322.15, "x": "犯人は在日韓国人で、日本の旅券を\n使い、日本で盗まれた拳銃を持っていた。"}, {"t": 327.5, "x": "日本として無関心であるはずがない、と。"}, {"t": 330.0833333333333, "x": "だから物と書類なのね。"}, {"t": 331.8333333333333, "x": "そういうことだ。順に見ていこう。"}, {"t": 334.43333333333334, "x": "時計を7月に戻す。"}, {"t": 336.03333333333336, "x": "場所は大阪府警の南警察署高津派出所だ。"}, {"t": 339.21666666666664, "x": "7月18日、ここで拳銃2丁の盗難が分かった。"}, {"t": 342.8333333333333, "x": "拳銃のほかに、帯革や手錠などの付属品も盗まれた。"}, {"t": 346.6, "x": "派出所の中から持ち出されたの？"}, {"t": 348.85, "x": "そうだ。扉がこじ開けられ、かぎが壊されていた。"}, {"t": 351.96666666666664, "x": "あとでこの扉とかぎの傷が、大事な手がかりになる。"}, {"t": 355.3666666666667, "x": "その時はまだ犯人は分からなかったのね。"}, {"t": 358.05, "x": "分からなかった。指紋や掌紋は残っていた。"}, {"t": 360.8333333333333, "x": "ただ誰の物かは決まらなかった。"}, {"t": 362.8833333333333, "x": "盗まれた拳銃の行方も、1\nか月近く分からないままだった。"}, {"t": 366.85, "x": "警察の拳銃が2丁もどこかにあるってこと？"}, {"t": 369.73333333333335, "x": "そうだ。警察にとっては重い事件だった。"}, {"t": 372.4, "x": "その1丁の行方が分かったのは、\nソウルからの知らせだった。"}, {"t": 376.53333333333336, "x": "韓国の当局は男が持っていた拳銃を調べた。"}, {"t": 379.68333333333334, "x": "そして番号と型、写真を日本へ送ってきた。"}, {"t": 382.68333333333334, "x": "この拳銃はどこで盗まれた物か、という照会だった。"}, {"t": 386.1666666666667, "x": "拳銃に番号があるのね。"}, {"t": 387.8833333333333, "x": "警察の拳銃には1丁ずつ登録の番号がある。"}, {"t": 390.9166666666667, "x": "照らし合わせると、高津派出所の拳銃と全く一致した。"}, {"t": 394.55, "x": "型はアメリカ製のチーフス。"}, {"t": 396.25, "x": "回転式で38口径の拳銃だ。"}, {"t": 398.96666666666664, "x": "じゃあ盗まれた1丁はソウルにあったのね。"}, {"t": 401.46666666666664, "x": "そうだ。警察庁の局長は国会でそう説明した。"}, {"t": 404.8666666666667, "x": "連絡は国際刑事警察機構の無線で、\nほとんど行われていた。"}, {"t": 409.01666666666665, "x": "盗まれた2丁のうち1丁はいま韓国にある。"}, {"t": 411.75, "x": "日本からも分かったことを韓国へ知らせている。"}, {"t": 414.45, "x": "拳銃の盗難の件と、旅券の不正な\n入手の件が主だった。"}, {"t": 418.46666666666664, "x": "もう1丁は？"}, {"t": 419.6, "x": "そこで警察は男の自宅を調べることにした。"}, {"t": 423.23333333333335, "x": "8月17日、警察は大阪の男の自宅を捜索した。"}, {"t": 427.3, "x": "式典の2日後だ。"}, {"t": 428.73333333333335, "x": "2階の床下からもう1丁の拳銃が見つかった。"}, {"t": 431.9166666666667, "x": "本当に床下だったのね。"}, {"t": 433.8, "x": "局長は、下から見れば天井裏だと言い直している。"}, {"t": 437.03333333333336, "x": "別の日の答弁では1階の天井から出たとも言う。"}, {"t": 440.05, "x": "2階の部屋から出たと言う参事官もいた。"}, {"t": 442.6333333333333, "x": "言い方がばらばらじゃない。"}, {"t": 444.15, "x": "場所は同じでどちらから見るかの違いだろう。"}, {"t": 446.65, "x": "型はニュー南部という日本の警察の拳銃だった。"}, {"t": 449.65, "x": "番号などから、高津派出所のもう1丁と確認された。"}, {"t": 453.18333333333334, "x": "これで盗まれた2丁の行き先が両方分かった。"}, {"t": 456.05, "x": "1丁はソウルの式典に。もう1丁は大阪の自宅に。"}, {"t": 459.5833333333333, "x": "2丁とも持ち出したわけじゃないのね。"}, {"t": 461.8666666666667, "x": "そうだ。そしてここで1つ食い違いが出る。"}, {"t": 465.15, "x": "韓国で男は取り調べを受け、\nその中身が日本に届いた。"}, {"t": 468.9166666666667, "x": "陳述の要旨として、外交のルートで送られてきたんだ。"}, {"t": 472.35, "x": "その中で男はもう1丁の行方をこう説明していた。"}, {"t": 475.65, "x": "大阪港の第3突堤に捨てた、と。"}, {"t": 478.23333333333335, "x": "でも実際は自分の家の床下だったのよね。"}, {"t": 481.1, "x": "そうだ。局長は、これははっきり違うと答えている。"}, {"t": 484.3333333333333, "x": "どういう理由かは知らないが間違っていた、と。"}, {"t": 487.0833333333333, "x": "じゃあ陳述は信用できないの？"}, {"t": 489.06666666666666, "x": "局長の答え方は慎重だった。"}, {"t": 491.23333333333335, "x": "正しい所もあれば違っている所もある。"}, {"t": 493.8, "x": "全部を正しいとも全部を違うとも見ない。"}, {"t": 496.25, "x": "1つずつ事実に当たって確かめるという姿勢だ。"}, {"t": 499.23333333333335, "x": "派出所については、犯人でなければ\n分からないことも言っている。"}, {"t": 502.9166666666667, "x": "なぜこの派出所を選んだのかも、述べていたという。"}, {"t": 506.01666666666665, "x": "日本の警察は本人に会って聞けないのよね。"}, {"t": 508.9, "x": "会えない。だから物で確かめるしかなかった。"}, {"t": 512.2166666666667, "x": "番号と型が合っても、それだけでは決め手にならない。"}, {"t": 515.3666666666667, "x": "決め手は弾に残る傷だった。"}, {"t": 517.4166666666666, "x": "弾の傷？"}, {"t": 518.55, "x": "拳銃の筒の内側にはらせん状の溝が刻んである。"}, {"t": 521.7333333333333, "x": "撃つと弾にその拳銃だけの線が残る。"}, {"t": 524.25, "x": "これを線条痕という。"}, {"t": 525.6333333333333, "x": "日本の警察は拳銃ごとにこの線を記録していた。"}, {"t": 528.8, "x": "局長は、いわば指紋のようなものだと説明している。"}, {"t": 532.1666666666666, "x": "じゃあ韓国で撃った弾を日本で見ればいいのね。"}, {"t": 534.9166666666666, "x": "そうだ。日本は試しに撃った弾を送るよう求めた。"}, {"t": 538.0666666666667, "x": "韓国は5発を送ったと連絡してきた。"}, {"t": 540.6333333333333, "x": "9月2日の国会で局長は鑑定が済んだと答えた。"}, {"t": 544.0833333333334, "x": "ところが同じ日の委員会の終わりに訂正が入る。"}, {"t": 547.0333333333333, "x": "訂正？"}, {"t": 548.15, "x": "韓国からの弾はまだ着いていなかったんだ。"}, {"t": 550.75, "x": "外交の書類を運ぶ\n便が遅れていた、という説明だった。"}, {"t": 554.2833333333333, "x": "鑑定したのは、日本に残った\n1丁の試し撃ちの弾だった。"}, {"t": 558.2333333333333, "x": "慌てて言っちゃったのね。"}, {"t": 559.7666666666667, "x": "局長はつつしんで訂正すると述べている。"}, {"t": 562.25, "x": "弾はきょうかあす着くという話だった。"}, {"t": 564.65, "x": "撃たれた時の様子は日本に伝わっていたの？"}, {"t": 567.4166666666666, "x": "局長は、1発ずつどこへ\n向かったかも韓国に照会していた。"}, {"t": 571.4, "x": "8月20日の時点ではまだ返事が来ていない。"}, {"t": 574.2333333333333, "x": "拳銃がどう使われたかは、\n拳銃の捜査にも要る、という理由だ。"}, {"t": 578.1333333333333, "x": "日本の警察はそれも書類で待つしかなかった。"}, {"t": 581.6333333333333, "x": "1週間後の9月9日、参議院の法務委員会。"}, {"t": 584.9166666666666, "x": "議員が聞いた。同じ拳銃だと確認できたのか、と。"}, {"t": 588.3, "x": "局長の答えは短かった。"}, {"t": 590.0666666666667, "x": "同一性は確認できました。"}, {"t": 592.1666666666666, "x": "弾が着いたのね。"}, {"t": 593.45, "x": "着いた。記録の線と並べるとぴたっと一致した。"}, {"t": 596.4833333333333, "x": "局長は本当に、ぴたっと、という言葉を使っている。"}, {"t": 599.9, "x": "ソウルで使われた拳銃は、\n高津派出所で盗まれた物だ。"}, {"t": 603.5333333333333, "x": "これで番号と型と弾の傷の3つがそろった。"}, {"t": 606.4666666666667, "x": "日本の警察の記録とソウルの弾が、ここで結びついた。"}, {"t": 610.1833333333333, "x": "拳銃の話はこれで決まり？"}, {"t": 612.1166666666667, "x": "拳銃の行き先はな。"}, {"t": 613.5333333333333, "x": "ただ誰が派出所から盗んだかはまだ別の話だ。"}, {"t": 616.7333333333333, "x": "派出所に残った指紋とは、一致していなかったからな。"}, {"t": 620.1666666666666, "x": "12月には別の課長も、線が一致したと答えている。"}, {"t": 623.6833333333333, "x": "ライフルマークという言い方でだ。"}, {"t": 625.6166666666667, "x": "派出所の件は何で決めたの？"}, {"t": 627.6666666666666, "x": "鍵になったのは1台の車だった。"}, {"t": 630.5666666666667, "x": "8月19日の夜9時ごろのことだ。"}, {"t": 633.0333333333333, "x": "大阪に住む韓国人の男性が弁護士と警察に来た。"}, {"t": 636.5666666666667, "x": "8月5日に男からライトバンを預かっている、と言う。"}, {"t": 640.0333333333333, "x": "出発の前の日に預けたのね。"}, {"t": 642.2166666666667, "x": "そうだ。男がソウルへ発ったのは8月6日だ。"}, {"t": 645.25, "x": "捜査本部はすぐに確かめに入った。"}, {"t": 647.6, "x": "捜査員など10人で車の見張りについた。"}, {"t": 650.2, "x": "同時に捜索の許可を裁判所に求めた。"}, {"t": 652.8333333333334, "x": "翌朝10時ごろ、申し出た\n男性が車のかぎを持ってきた。"}, {"t": 656.5166666666667, "x": "自分がずっと持っていて、ほかの人は\n触れられない、と話したそうだ。"}, {"t": 660.6833333333333, "x": "中に何かあったの？"}, {"t": 662.1666666666666, "x": "昼の12時ごろから捜索が始まった。"}, {"t": 664.6833333333333, "x": "出てきたのは車の工具だった。"}, {"t": 666.6666666666666, "x": "プライヤーとタイヤを外すレンチだ。"}, {"t": 668.7166666666667, "x": "どこにでもある工具じゃない？"}, {"t": 670.4, "x": "そう見える。だから調べたのは工具そのものじゃない。"}, {"t": 673.3, "x": "工具の先が付ける傷の形だ。"}, {"t": 676.1, "x": "派出所の扉はこじ開けられていた。"}, {"t": 678.3166666666667, "x": "かぎにも壊した痕が残っていた。"}, {"t": 680.4, "x": "工具で何かをこじると工具ごとの癖が傷に出る。"}, {"t": 683.35, "x": "警察の言葉では工具痕、ツールマークという。"}, {"t": 686.2166666666667, "x": "線条痕の工具版ね。"}, {"t": 687.9166666666666, "x": "そうだ。車の工具と、扉とかぎの傷を照らし合わせた。"}, {"t": 691.5333333333333, "x": "結果は一致だった。"}, {"t": 692.85, "x": "9月11日、局長は衆議院でこう答えている。"}, {"t": 696.05, "x": "プライヤーと、派出所のかぎを\nこじ開けた痕跡が一致した。"}, {"t": 699.7666666666667, "x": "じゃあ盗んだのはあの男で決まり？"}, {"t": 701.8166666666667, "x": "9月9日の時点では刑事局長はまだ慎重だった。"}, {"t": 705.25, "x": "確定的に言うには、若干まだ詰め切らない点がある。"}, {"t": 708.55, "x": "ただ大筋では犯人と考えてよかろう、という答えだ。"}, {"t": 712.0, "x": "本人に聞けないから言い切れないのね。"}, {"t": 714.35, "x": "そうだ。さらに足取りの話が続く。"}, {"t": 717.4166666666666, "x": "韓国から届いた陳述には盗む前の話もあった。"}, {"t": 720.8, "x": "ライトバンで交番や派出所を見て歩いたという。"}, {"t": 723.4833333333333, "x": "その中で高津派出所が、一番入りやすいと判断した。"}, {"t": 727.1666666666666, "x": "局長は国会で陳述の中身をそう紹介している。"}, {"t": 730.4833333333333, "x": "本当に見て回ったの？"}, {"t": 732.1, "x": "当日、現場の近くに\nライトバンらしい車がいた、という証言はあった。"}, {"t": 736.4666666666667, "x": "一方で国会では疑問も出ている。"}, {"t": 738.5166666666667, "x": "大阪の議員が陳述の中身を読み上げた。"}, {"t": 741.1333333333333, "x": "7月初めから、\n近畿の4つの府県の派出所を見て回った。"}, {"t": 745.1333333333333, "x": "ほとんどが2階で入りにくく、\n高津は1階だったから狙った。"}, {"t": 748.9666666666667, "x": "それ、おかしいの？"}, {"t": 750.3166666666667, "x": "議員は、1階の派出所は高津だけではないと言った。"}, {"t": 753.55, "x": "自分も大阪だからよく知っている、と。"}, {"t": 755.9, "x": "局長も全部が2階のはずはないと答えている。"}, {"t": 758.85, "x": "じゃあ陳述の一部は怪しいのね。"}, {"t": 760.95, "x": "正しい所と違う所がある。さっきと同じだ。"}, {"t": 764.0166666666667, "x": "それでも警察は物の照合を積み上げていった。"}, {"t": 767.45, "x": "盗まれたのは拳銃だけではなかった。"}, {"t": 769.7333333333333, "x": "帯革と手錠も派出所から消えていた。"}, {"t": 772.1333333333333, "x": "陳述では、それは要らないので川に捨てたという。"}, {"t": 775.0666666666667, "x": "奈良県の大和川だ。"}, {"t": 776.6333333333333, "x": "場所まで言っていたの？"}, {"t": 778.0666666666667, "x": "図面まで書いた、と局長は答えている。"}, {"t": 780.6, "x": "警察はその図面をもとに川を探した。"}, {"t": 783.1, "x": "ただ9月の初めは水かさが増えていた。"}, {"t": 785.55, "x": "9月11日の時点ではまだ見つかっていない。"}, {"t": 788.5166666666667, "x": "見つからなかったの？"}, {"t": 789.9166666666666, "x": "見つかった。10月18日の国会で\n参事官が報告している。"}, {"t": 794.0833333333334, "x": "御幸橋の近くで、供述どおり手錠などが出てきた、と。"}, {"t": 797.8166666666667, "x": "今度は陳述どおりだったのね。"}, {"t": 799.8666666666667, "x": "そうだ。拳銃の場所は違ったが、手錠の場所は合った。"}, {"t": 803.2333333333333, "x": "12月の答弁でも、付属品と\n手錠の発見が挙げられている。"}, {"t": 807.7666666666667, "x": "10月18日、衆議院の法務委員会。"}, {"t": 810.55, "x": "参事官が拳銃の捜査をまとめて報告した。"}, {"t": 813.45, "x": "ソウルの拳銃の番号が派出所の物と一致した。"}, {"t": 816.55, "x": "8月17日の捜索で自宅からもう1丁が出た。"}, {"t": 819.9833333333333, "x": "7月17日の夜から18日の未明まで、\n男のアリバイが立たない。"}, {"t": 824.6, "x": "車のレンチとプライヤーの痕が、扉とかぎの傷に合う。"}, {"t": 828.0, "x": "大和川から供述どおり手錠が出た。"}, {"t": 830.3166666666667, "x": "試し撃ちの弾の線が登録と完全に一致した。"}, {"t": 833.5333333333333, "x": "6つも並んだのね。"}, {"t": 835.0, "x": "そうだ。参事官はこう結んだ。"}, {"t": 837.0833333333334, "x": "本件窃盗事件は、文世光が\n行ったものと断定していい。"}, {"t": 841.1, "x": "9月の慎重な言い方から変わったのね。"}, {"t": 843.6833333333333, "x": "変わった。12月の外事課長の答弁も同じだ。"}, {"t": 846.8666666666667, "x": "まず文世光の犯行だと警察も断定している、と。"}, {"t": 850.3333333333334, "x": "指紋は合わなかったのに？"}, {"t": 851.9666666666667, "x": "合わなかった。指紋や掌紋、足跡は一致していない。"}, {"t": 855.25, "x": "単独でやったのかも、9月の時点では\n断定していなかった。"}, {"t": 859.0833333333334, "x": "日本の警察は、ソウルまで\n話を聞きに出向かなかったの？"}, {"t": 862.7833333333333, "x": "局長は9月11日にこう答えている。"}, {"t": 865.3833333333333, "x": "韓国から詳しい陳述が届き、\nこちらの質問にも回答が来ている。"}, {"t": 869.7166666666667, "x": "だから今は、調べに出向かなくても\n立件できると考えている、と。"}, {"t": 873.7666666666667, "x": "決めたのは指紋ではなく物の積み重ねだった。"}, {"t": 876.5833333333334, "x": "日本で拳銃の訓練をしたか\nどうかも、警察はつかんでいない。"}, {"t": 880.9166666666666, "x": "ここからはもう1つの柱の旅券だ。"}, {"t": 883.2666666666667, "x": "舞台は大阪府庁の旅券の窓口になる。"}, {"t": 886.0, "x": "旅券ってどうやって申し込むの？"}, {"t": 888.0166666666667, "x": "申請書に名前と生まれた日と本籍を書く。"}, {"t": 890.7166666666667, "x": "そこに写真を貼って戸籍謄本などを付けて出す。"}, {"t": 893.7166666666667, "x": "男はこの手続きを他人の名前で済ませた。"}, {"t": 896.4666666666667, "x": "名前は大阪に住む日本人の男性。"}, {"t": 898.8333333333334, "x": "その妻から戸籍謄本と住民票を受け取っていた。"}, {"t": 902.0833333333334, "x": "本人じゃなくて奥さんから？"}, {"t": 903.95, "x": "法務省の課長の説明ではそうなっている。"}, {"t": 906.4833333333333, "x": "1回目は1973年10月31日に、書類を受け取った。"}, {"t": 911.1833333333333, "x": "そして11月に府庁に申請書を出した。"}, {"t": 913.9, "x": "名前の欄は他人、写真の欄は自分だ。"}, {"t": 916.4666666666667, "x": "生まれた日と本籍の欄にも、\n名前の本人のことが書かれた。"}, {"t": 920.4, "x": "写真で分からないの？"}, {"t": 921.8666666666667, "x": "写真は本物の自分の顔だ。"}, {"t": 923.6833333333333, "x": "窓口が見破った記録は無い。"}, {"t": 925.6666666666666, "x": "こうして男の顔の、他人の名前の旅券ができた。"}, {"t": 928.8666666666667, "x": "11月19日、男は大阪国際空港から出国した。"}, {"t": 932.95, "x": "行き先は香港だった。"}, {"t": 935.15, "x": "香港へは名前を貸した家族の妻も一緒だった。"}, {"t": 938.1, "x": "ここでも日付の食い違いがある。"}, {"t": 940.0166666666667, "x": "韓国から届いた陳述では、11月26日から29日。"}, {"t": 944.4, "x": "日本の捜査では11月19日から22日だった。"}, {"t": 948.0, "x": "1週間もずれてるの？"}, {"t": 949.5833333333334, "x": "そうだ。香港に渡ったこと自体は\n事実だと、局長は答えている。"}, {"t": 953.9666666666667, "x": "何をしに香港へ？"}, {"t": 955.35, "x": "陳述では拳銃を買いに出向いたという。"}, {"t": 957.6333333333333, "x": "同行した妻は、そういうことは知らないと話している。"}, {"t": 960.8333333333334, "x": "局長の答弁ではそう整理されている。"}, {"t": 963.2333333333333, "x": "拳銃は香港で手に入ったの？"}, {"t": 965.3333333333334, "x": "その答えは国会の答弁には出てこない。"}, {"t": 967.8, "x": "買おうとしたという話も本人の陳述だけだ。"}, {"t": 970.6833333333333, "x": "この回でも分からないこととして置いておく。"}, {"t": 973.1166666666667, "x": "はっきりしているのは、\n1冊目の旅券が使われたことだ。"}, {"t": 976.5666666666667, "x": "そして半年あまりあとに2冊目が作られる。"}, {"t": 979.9333333333333, "x": "1974年6月27日、男は\nまた同じ家族から書類を受け取った。"}, {"t": 985.35, "x": "同じ人の戸籍謄本と住民票だ。"}, {"t": 987.8, "x": "7月、男は再び大阪府庁に申請書を出した。"}, {"t": 991.45, "x": "同じ名前で2回目？"}, {"t": 993.0, "x": "そうだ。2回で申請書は4通、貼った写真は4枚。"}, {"t": 996.45, "x": "出来上がった旅券は2冊になる。"}, {"t": 998.4, "x": "この申請書の写真が、のちに大事な証拠になる。"}, {"t": 1001.55, "x": "7月は派出所の拳銃が盗まれた月でもある。"}, {"t": 1004.8, "x": "旅券と拳銃が同じ月にそろったのね。"}, {"t": 1007.4666666666667, "x": "そして8月6日、男は大阪国際空港から出国した。"}, {"t": 1011.6166666666667, "x": "行き先は韓国、ソウルだ。"}, {"t": 1013.5333333333333, "x": "法務省は、この流れを\n起訴の事実として説明している。"}, {"t": 1017.05, "x": "1973年11月と1974年7月の2回、\n大阪府庁で申請した。"}, {"t": 1023.2666666666667, "x": "不実の記載をさせた旅券で空港の審査を通った。"}, {"t": 1026.5166666666667, "x": "空港で気づかれなかったのね。"}, {"t": 1028.4666666666667, "x": "旅券そのものは外務大臣の名前で出た本物だ。"}, {"t": 1031.5333333333333, "x": "中に書かれた名前だけが、本人のものではなかった。"}, {"t": 1034.8333333333333, "x": "法務省の課長は、旅券の件は証拠が固いと見ていた。"}, {"t": 1038.3166666666666, "x": "申請したのが本人で、貼られた写真も本人だからだ。"}, {"t": 1041.8333333333333, "x": "本人を取り調べなくても、相当に\n明らかだという答えだった。"}, {"t": 1045.8, "x": "写真がそのまま証拠になったのね。"}, {"t": 1048.5833333333333, "x": "では拳銃は、どうやって日本から持ち出されたのか。"}, {"t": 1051.65, "x": "これは国会でも何度も聞かれた。"}, {"t": 1053.7166666666667, "x": "ラジオのケースの中に入れて運んだ、と言われていた。"}, {"t": 1056.8833333333334, "x": "本当にそうだったの？"}, {"t": 1058.3666666666666, "x": "これについての警察庁の局長の答えが残っている。"}, {"t": 1061.6333333333334, "x": "そう言われているが、捜査の結果、\n具体的な事実は明らかでない。"}, {"t": 1065.8333333333333, "x": "確かめられなかったのね。"}, {"t": 1067.5833333333333, "x": "そうだ。ソウルの空港での話も分からない。"}, {"t": 1070.2833333333333, "x": "金浦空港でどうやって拳銃の検査を通ったのか。"}, {"t": 1073.2833333333333, "x": "ホテルで式典の日までどう過ごしたのか。"}, {"t": 1075.7, "x": "どうやって会場に入りどこの席に座ったのか。"}, {"t": 1078.5666666666666, "x": "日本の警察は、それを詳しく知りたいと韓国に求めた。"}, {"t": 1082.2833333333333, "x": "9月11日の時点ではまだ返事が来ていない。"}, {"t": 1085.2333333333333, "x": "外務省も、在日の人がどういう基準で\n招かれたのかを韓国に問い合わせた。"}, {"t": 1089.9833333333333, "x": "8月22日の時点ではその答えも届いていない。"}, {"t": 1093.2333333333333, "x": "会場での様子について、警察には\n1つの情報が入っていた。"}, {"t": 1097.1833333333334, "x": "大阪から式典に行った人が、\n会場で男の通訳をしてやった。"}, {"t": 1101.3, "x": "あとで写真を見て、あの男だったと分かったという。"}, {"t": 1104.4, "x": "日本から来た人が会場で会っていたの？"}, {"t": 1106.95, "x": "ただ局長はこれを間接の情報だと断っている。"}, {"t": 1110.05, "x": "本人には確かめておらず、\nはっきりした点は分からない、と。"}, {"t": 1113.7833333333333, "x": "拳銃の行き先は分かっても、\n運び方は分からないのね。"}, {"t": 1117.3833333333334, "x": "日本の手元に残ったのはここまでだった。"}, {"t": 1120.55, "x": "韓国側の発表には、もう1つ日本に関わる話があった。"}, {"t": 1124.5333333333333, "x": "5月5日、男が大阪港に来ていた船を訪れたという。"}, {"t": 1128.25, "x": "万景峰号という船だ。"}, {"t": 1130.0, "x": "船に乗ったかどうかなんて確かめられるの？"}, {"t": 1132.6333333333334, "x": "入管の答弁では確かめる仕組みがあった。"}, {"t": 1135.2166666666667, "x": "船へ上がるタラップの入り口に、\n入管の警備官が立つ。"}, {"t": 1138.6333333333334, "x": "24時間、訪れる人を確かめていたという。"}, {"t": 1141.5833333333333, "x": "その記録に男の名前は全く無かった。"}, {"t": 1144.3666666666666, "x": "じゃあ乗っていないの？"}, {"t": 1145.65, "x": "そこは言い切れない。"}, {"t": 1146.8, "x": "入管の次長も、本人の名前を\n使っているかは分からないと答えている。"}, {"t": 1151.0666666666666, "x": "警察庁の局長も、5月5日に訪れた\n事実はつかめないと言った。"}, {"t": 1155.5, "x": "その後、韓国側の言う日付は5月4日に変わった。"}, {"t": 1158.8666666666666, "x": "入管の課長の答弁では、船は4月30日に\n入港し、5月5日に出港している。"}, {"t": 1164.55, "x": "日付が変わるのは香港と同じね。"}, {"t": 1166.8666666666666, "x": "そうだ。陳述と日本の記録が、ここでも食い違った。"}, {"t": 1170.3833333333334, "x": "日本に残ったのは名前の無い記録だった。"}, {"t": 1173.6, "x": "旅券の件で日本で逮捕された人がいる。"}, {"t": 1176.1666666666667, "x": "名前を使われた男性の妻だ。"}, {"t": 1178.2, "x": "8月16日に大阪府警に逮捕され、\n18日に検察へ送られた。"}, {"t": 1182.9833333333333, "x": "そして8月28日、大阪地裁に起訴された。"}, {"t": 1186.5833333333333, "x": "どういう罪なの？"}, {"t": 1187.7833333333333, "x": "他人の名前で旅券を取るのを手助けした罪。"}, {"t": 1190.55, "x": "それに不法に出国するのを手助けした罪だ。"}, {"t": 1193.4833333333333, "x": "本人は戸籍謄本などを渡した事実は認めていた。"}, {"t": 1196.7666666666667, "x": "ただ、目的を知っていたかは\n認めていない、という報告だ。"}, {"t": 1200.5666666666666, "x": "撃った事件と関係があるから厳しくしたの？"}, {"t": 1203.3333333333333, "x": "法務省の課長は、特に異例な\n扱いではないと答えている。"}, {"t": 1206.8833333333334, "x": "同じ種類の旅券の事件で、身柄を\n押さえたまま処理した例は多い。"}, {"t": 1210.75, "x": "そういう説明だった。"}, {"t": 1212.2833333333333, "x": "夫は？"}, {"t": 1213.4, "x": "韓国からの通報では、共犯として\n3人の名前が挙がった。"}, {"t": 1217.2333333333333, "x": "夫と妻と、もう1人の大阪の人だ。"}, {"t": 1219.95, "x": "日本の警察はこう答えている。"}, {"t": 1221.9166666666667, "x": "今の段階で容疑があるとはいえない。"}, {"t": 1223.9833333333333, "x": "この回ではこの3人の名前は出さない。"}, {"t": 1226.3666666666666, "x": "裁判の結果も今回の資料には無かった。"}, {"t": 1229.6666666666667, "x": "物と書類がそろうにつれて問いが大きくなる。"}, {"t": 1232.2833333333333, "x": "日本側の責任はどこまでか、だ。"}, {"t": 1234.7, "x": "拳銃も旅券も日本の物だものね。"}, {"t": 1237.1333333333334, "x": "事件のあと、ある新聞が大きく書いた。"}, {"t": 1239.65, "x": "日本政府には法的、道義的に責任なし、と。"}, {"t": 1242.9166666666667, "x": "この見出しがそのまま韓国に伝わった。"}, {"t": 1245.4166666666667, "x": "韓国の国務総理がテレビの演説で、\n日本政府の見解として紹介した。"}, {"t": 1250.2666666666667, "x": "本当に政府が言ったの？"}, {"t": 1251.9166666666667, "x": "外務省は国会で否定している。"}, {"t": 1253.9666666666667, "x": "正式にそういう見解を出したことはない、と。"}, {"t": 1256.7333333333333, "x": "報道が出た日の夜には外務事務次官が\n記者会見を開いている。"}, {"t": 1260.65, "x": "そこで何と言ったの？"}, {"t": 1262.0833333333333, "x": "外務省が出した唯一の見解はこうだ。"}, {"t": 1264.5666666666666, "x": "狙撃の準備が日本で行われたことは、\nはなはだ遺憾である。"}, {"t": 1268.4, "x": "責任とは言わないのね。"}, {"t": 1270.0333333333333, "x": "外務省の局次長はその理由も説明している。"}, {"t": 1272.95, "x": "責任という字を使うと、法律の意味合いが強く出る。"}, {"t": 1276.2333333333333, "x": "無用の誤解を招くから使わない、と。"}, {"t": 1278.6, "x": "外務大臣の言い方はもう少しはっきりしていた。"}, {"t": 1281.5, "x": "国に道義的責任という言葉は、あまり当たらない。"}, {"t": 1284.7, "x": "法律的責任は、ない。"}, {"t": 1286.5166666666667, "x": "ただ準備が国内で行われたことは、きわめて遺憾だ。"}, {"t": 1289.8833333333334, "x": "局次長は9月11日、客観的に\n明らかなことを3つ挙げた。"}, {"t": 1294.1666666666667, "x": "犯人が在日韓国人だったこと。"}, {"t": 1296.4, "x": "日本の旅券を不正に取ったこと。"}, {"t": 1298.5333333333333, "x": "そして、使われた拳銃が日本で\n盗まれた物だったことだ。"}, {"t": 1302.25, "x": "だから日本と全く関係がない、とは言えない。"}, {"t": 1305.0666666666666, "x": "ただ何もかも日本が悪いと決める\n前に、事実を明らかにする段階だ、と。"}, {"t": 1309.7333333333333, "x": "外務大臣は8月29日、韓国の人々の感情は\nよく理解できると述べた。"}, {"t": 1314.9333333333334, "x": "そのうえで、両国が理性的な態度で臨むべきだ、と。"}, {"t": 1319.0333333333333, "x": "一方で拳銃については言い方が違った。"}, {"t": 1321.55, "x": "国家公安委員長は8月20日の国会で答えている。"}, {"t": 1324.95, "x": "凶器は大阪府の警察官の拳銃で、\n重大な責任を感じている。"}, {"t": 1329.3666666666666, "x": "辞めろと言われたの？"}, {"t": 1330.7166666666667, "x": "言われた。委員長は辞める形はとらないと答えた。"}, {"t": 1333.8166666666666, "x": "まず事件の究明に全力を尽くす、という理由だ。"}, {"t": 1336.9166666666667, "x": "9月2日にはさらに踏み込んでいる。"}, {"t": 1339.1, "x": "日本の警察が管理する拳銃で事件が起きた。"}, {"t": 1342.0833333333333, "x": "その限りでは、日本政府は責任あり、と。"}, {"t": 1345.0166666666667, "x": "外務省とは逆のことを言ってない？"}, {"t": 1347.15, "x": "外務省は国としての法律の責任の話。"}, {"t": 1350.0833333333333, "x": "委員長は拳銃を管理する側の話をしている。"}, {"t": 1352.9166666666667, "x": "警察庁の長官も盗難は警察官の失敗だと認めた。"}, {"t": 1356.7166666666667, "x": "10月には参事官が\nわがほうの失態でもあると答えている。"}, {"t": 1360.3, "x": "日本に残った物が、日本の弱いところを示したのね。"}, {"t": 1363.9, "x": "のちに外務大臣の宮澤喜一はこうまとめた。"}, {"t": 1366.75, "x": "旅券の不法な入手と、拳銃の盗難。"}, {"t": 1369.2833333333333, "x": "この2つは日本の行政の瑕疵と言える。"}, {"t": 1371.7166666666667, "x": "その意味で無関係とは言えない。"}, {"t": 1374.1666666666667, "x": "8月19日、ソウルで陸英修夫人の国民葬が行われた。"}, {"t": 1378.3166666666666, "x": "日本からは首相の田中角栄が参列した。"}, {"t": 1381.2833333333333, "x": "首相が自分で？"}, {"t": 1382.5166666666667, "x": "外務大臣は国会でこう説明している。"}, {"t": 1385.05, "x": "友好国の大統領夫人の葬儀に首相が行くのは、\n重すぎるという批判はあるだろう。"}, {"t": 1389.9666666666667, "x": "ただ当時の日韓の特別な\n関係を考えて、首相が決めた。"}, {"t": 1393.9666666666667, "x": "謝罪のためではなく、きわめて丁重な弔問だった、と。"}, {"t": 1397.5333333333333, "x": "韓国はどう受け止めたの？"}, {"t": 1399.2666666666667, "x": "韓国の国務総理から首相あてに親書が届いた。"}, {"t": 1402.3833333333334, "x": "外務省の局長が中身を2点に分けて説明している。"}, {"t": 1405.7666666666667, "x": "1つは首相が国民葬に参列したことへの感謝。"}, {"t": 1409.0833333333333, "x": "もう1つは捜査へのいっそうの協力のお願いだ。"}, {"t": 1412.0333333333333, "x": "協力してほしいということね。"}, {"t": 1414.0, "x": "そうだ。大統領自身も大使を呼んで申し入れをした。"}, {"t": 1417.1833333333334, "x": "捜査に加えて、事件の背後にあると\n韓国が見る集団の取り締まりだ。"}, {"t": 1421.5, "x": "ここから日本と韓国の見方の違いが表に出てくる。"}, {"t": 1424.9666666666667, "x": "金大中事件の押し返しはどうなったの？"}, {"t": 1427.5, "x": "先に延ばすことになった。"}, {"t": 1429.0333333333333, "x": "局次長は8月22日にこう説明している。"}, {"t": 1432.1833333333334, "x": "国をあげて夫人を悼んでいる時に、\n予定の措置をとるのは適当でない。"}, {"t": 1436.3, "x": "できるだけ早く強く求めたい、とも付け加えた。"}, {"t": 1440.0166666666667, "x": "9月に入ると韓国で日本への抗議が強まった。"}, {"t": 1443.1, "x": "デモが続き、日本の大使館に人がなだれ込んだ。"}, {"t": 1446.3333333333333, "x": "屋上の日の丸が引きずり下ろされ、引き裂かれた。"}, {"t": 1449.5, "x": "大使館にまで？"}, {"t": 1450.7166666666667, "x": "外務省の局次長は国会でこう述べている。"}, {"t": 1453.3833333333334, "x": "非常に衝動的、感情的な\nムードが韓国を支配している。"}, {"t": 1457.1333333333334, "x": "9月11日にはさらに強い言葉を使った。"}, {"t": 1460.0666666666666, "x": "1965年に国交が正常化して\n9年余りで、最悪の事態だ。"}, {"t": 1464.9666666666667, "x": "9年かけて作った関係が？"}, {"t": 1467.0666666666666, "x": "局次長は一歩誤れば破局を\n招くかもしれないと言った。"}, {"t": 1470.5, "x": "東京で考えるより、韓国の事態は相当深刻だ、と。"}, {"t": 1474.2166666666667, "x": "外務省はこじれた理由をいくつか挙げている。"}, {"t": 1476.7166666666667, "x": "責任なしという報道のほかに、\n外務大臣の国会での発言もあった。"}, {"t": 1481.1166666666666, "x": "北からの脅威は今はない、という趣旨の答弁だ。"}, {"t": 1484.05, "x": "これが日本の新聞の論評と一緒に、韓国へ伝わった。"}, {"t": 1487.65, "x": "韓国側はそれを日本政府の考えだと\n受け取った、という説明だ。"}, {"t": 1491.9, "x": "言葉が一人歩きしたのね。"}, {"t": 1493.85, "x": "政府は首相の返事の親書を急ぐことにした。"}, {"t": 1496.6666666666667, "x": "外務大臣は9月10日、親書の考え方をこう説明した。"}, {"t": 1500.6, "x": "この事件のために、日韓関係が\n危うくなってはならない。"}, {"t": 1504.0666666666666, "x": "ただし国内法をゆがめてまで、やるべき筋ではない。"}, {"t": 1507.2, "x": "どういう方法で親書を届けるかも\n検討中だと答えている。"}, {"t": 1510.6833333333334, "x": "中身は日本の一般的な姿勢を伝えるものになる。"}, {"t": 1513.8333333333333, "x": "あいまいな事実を前提に、\n具体的な約束はできないからだ。"}, {"t": 1517.7166666666667, "x": "一般的な姿勢って何を書くの？"}, {"t": 1519.9833333333333, "x": "そこでもう1つの見方の違いが問題になる。"}, {"t": 1523.4333333333334, "x": "韓国側は男の陳述をもとにこう考えていた。"}, {"t": 1526.5833333333333, "x": "事件の背後には日本にある在日の団体がいる。"}, {"t": 1529.55, "x": "陳述の中には、その団体の人からの指示や\n資金の話もあった。"}, {"t": 1533.9833333333333, "x": "日本の警察はどう見ていたの？"}, {"t": 1536.0, "x": "外務省の局次長が国会でこう説明している。"}, {"t": 1539.0, "x": "これまでの捜査の結果では、\n結びつきの証拠は出ていない。"}, {"t": 1542.45, "x": "韓国は結びつきがある前提、日本は証拠がない。"}, {"t": 1545.6333333333334, "x": "前提が違うまま、話が進んでいた。"}, {"t": 1548.3833333333334, "x": "じゃあどっちが正しいの？"}, {"t": 1549.8833333333334, "x": "この回では決めない。"}, {"t": 1551.0333333333333, "x": "国会の答弁も決めていない。"}, {"t": 1552.9166666666667, "x": "1975年3月、警察庁の局長はこう答えている。"}, {"t": 1557.1666666666667, "x": "大阪の団体の人と会っていたことは分かっている。"}, {"t": 1560.1166666666666, "x": "ただ何を話したかは明らかになっていない。"}, {"t": 1562.6666666666667, "x": "百数十万円の資金の出どころもまだ分からない。"}, {"t": 1565.6166666666666, "x": "一方で法務省の公安調査庁は別のことを答えている。"}, {"t": 1568.9666666666667, "x": "この事件を理由に団体を\n規制するのは、法律上難しい。"}, {"t": 1572.6333333333334, "x": "国家公安委員長も9月2日にこう答えている。"}, {"t": 1575.6333333333334, "x": "国内法に照らして容疑があれば、\n十分に調べて取り締まる。"}, {"t": 1579.2833333333333, "x": "ただ脅しに近い要求で、\n法の運用を左右することはしない。"}, {"t": 1583.0666666666666, "x": "はっきり言ったのね。でも、\n分からないことは多いのね。"}, {"t": 1586.35, "x": "そうだ。その中で特使が海を渡る。"}, {"t": 1589.4, "x": "1974年9月19日、椎名悦三郎がソウルに入った。"}, {"t": 1593.8833333333334, "x": "自民党の副総裁で、政府の特使としての訪問だ。"}, {"t": 1597.4, "x": "日付は国会の質問の中で\n示され、政府も否定していない。"}, {"t": 1601.4666666666667, "x": "椎名って、どういう人なの？"}, {"t": 1603.4166666666667, "x": "1965年の日韓の国交正常化に関わった人だ。"}, {"t": 1607.4833333333333, "x": "その経験のある人が、首相の親書を持って海を渡った。"}, {"t": 1611.1, "x": "会ったのは、朴大統領と金鍾泌国務総理だった。"}, {"t": 1614.6, "x": "会談で何を話したの？"}, {"t": 1616.35, "x": "外務省の局次長の説明では、\n話したのは主に韓国側だった。"}, {"t": 1620.65, "x": "在日の団体を韓国がどう見ているか。"}, {"t": 1623.15, "x": "その説明に、時間いっぱい使われたという。"}, {"t": 1625.8833333333334, "x": "特使が何かを求められ、引き受けたわけではない。"}, {"t": 1628.8833333333334, "x": "外務省はそう答えている。"}, {"t": 1630.6333333333334, "x": "大統領は、どんな様子だったの？"}, {"t": 1632.9166666666667, "x": "奥さんを亡くした気持ちを訴えた、と伝えられている。"}, {"t": 1636.0833333333333, "x": "特使はそれを、ごもっともなことだと\n受け止めたという。"}, {"t": 1639.1833333333334, "x": "これも局次長が国会で紹介した話だ。"}, {"t": 1642.0, "x": "特使は帰国後の会見で、もし事実なら\n放っておけないという趣旨を述べたという。"}, {"t": 1646.7166666666667, "x": "一方で警察庁の参事官は、特使の訪韓で\n警察の姿勢は変わらないと答えた。"}, {"t": 1651.8333333333333, "x": "法の枠の中で活動する限り、どの団体も自由だ、と。"}, {"t": 1656.2, "x": "首相の親書には、\n特定の団体の名前は書かれていない。"}, {"t": 1659.7, "x": "書いてあったのは、テロのような\n犯罪があれば取り締まる、までだ。"}, {"t": 1663.3333333333333, "x": "団体の話は、特使が口で説明した。"}, {"t": 1666.3333333333333, "x": "口で言っただけなら、記録は残らないわね。"}, {"t": 1669.1333333333334, "x": "それが残ったんだ。"}, {"t": 1670.3833333333334, "x": "特使は、口頭の説明に使った\nメモを韓国側に置いてきた。"}, {"t": 1674.3, "x": "言った、言わないの争いを避けるためだという。"}, {"t": 1676.9333333333334, "x": "そのメモにしるしを付けたのは、\n日本の大使だけだった。"}, {"t": 1680.4, "x": "韓国側は、しるしを付けていないの？"}, {"t": 1682.9, "x": "付けていない。外務省はそこを\n大事な点として説明した。"}, {"t": 1686.4833333333333, "x": "両国が合意した中身を書いた紙ではない。"}, {"t": 1689.0333333333333, "x": "日本側の説明を書いた紙で、\nしるしも日本の大使だけ。"}, {"t": 1692.6666666666667, "x": "だから両国を縛る外交の合意文書ではない、と。"}, {"t": 1695.8333333333333, "x": "しるしって、普通はどういう時に付けるの？"}, {"t": 1698.5166666666667, "x": "局次長の説明では、条約の案文などで使う形がある。"}, {"t": 1702.35, "x": "双方がしるしを付けて、ここまで\n合意したと示すやり方だ。"}, {"t": 1705.9833333333333, "x": "今回のしるしは、それとは違う、という説明だった。"}, {"t": 1709.3166666666666, "x": "これが特使の読んだ紙だ、と\n大使が示しただけだという。"}, {"t": 1712.9166666666667, "x": "じゃあ、ただの紙なの？"}, {"t": 1714.4666666666667, "x": "局次長の言い方は、こうだった。"}, {"t": 1716.5833333333333, "x": "法律的効果ではなく、政治的効果をねらったもの。"}, {"t": 1719.95, "x": "険しくなった日韓の空気を、静めるための手段だ、と。"}, {"t": 1723.7, "x": "じゃあ、全く意味のない紙なの？"}, {"t": 1725.8666666666666, "x": "そうでもない。12月の答弁で局次長はこう補っている。"}, {"t": 1729.4833333333333, "x": "日本の立場を明らかにした物で、\n何の意味もない物とは言えない。"}, {"t": 1733.4166666666667, "x": "法に反した行為があれば、誰であれ取り締まる。"}, {"t": 1736.2, "x": "それは日本の前からの方針で、変わりはない、と。"}, {"t": 1739.8666666666666, "x": "年が明けた1975年3月4日、衆議院の予算委員会。"}, {"t": 1744.3166666666666, "x": "外務大臣は宮澤喜一に替わっていた。"}, {"t": 1746.8, "x": "議員は、椎名特使は謝りに行ったのかと聞いた。"}, {"t": 1749.9166666666667, "x": "謝りに行ったんじゃないの？"}, {"t": 1751.55, "x": "大臣の答えは、こうだ。"}, {"t": 1753.2333333333333, "x": "特使は深い哀悼の意を表した。"}, {"t": 1755.35, "x": "ただ、国を代表して陳謝をしたということはない。"}, {"t": 1758.3166666666666, "x": "陳謝特使と言うのは、適当でない。"}, {"t": 1760.7333333333333, "x": "メモについては？"}, {"t": 1761.8833333333334, "x": "口で述べたことを、誤りがないように文字にした物。"}, {"t": 1765.0333333333333, "x": "記録という意味を持つ物で、交換公文ではない。"}, {"t": 1767.9833333333333, "x": "両者が合意した物でも、法的な\n拘束力を持つ物でもない。"}, {"t": 1771.9833333333333, "x": "最後まで、約束の紙ではないと言い続けたのね。"}, {"t": 1775.2666666666667, "x": "そうだ。12月の答弁でも\n同じ説明が繰り返されている。"}, {"t": 1778.9833333333333, "x": "日本の捜査がこのメモで動いた\n事実は全く無い、と警察も答えた。"}, {"t": 1783.3333333333333, "x": "同じ3月4日、大臣は金大中事件にも触れている。"}, {"t": 1786.9166666666667, "x": "あの件は終わっていない、\n日本はまだ満足していない、と。"}, {"t": 1790.25, "x": "外務省は前の年の10月下旬に、\n韓国へあらためて照会していた。"}, {"t": 1794.7166666666667, "x": "狙撃事件の陰で、前の年の事件も残っていたのね。"}, {"t": 1798.4, "x": "そうだ。2つの事件は、最後まで別々に残った。"}, {"t": 1802.5, "x": "ソウルでは、男の裁判が進んでいた。"}, {"t": 1805.0333333333333, "x": "国会の質問によると、初公判は10月7日。"}, {"t": 1808.3666666666666, "x": "1審の死刑の判決が10月19日、2審が11月20日だ。"}, {"t": 1812.9, "x": "すごく早いわね。"}, {"t": 1814.15, "x": "韓国の百科事典によれば、\n12月17日に大法院で確定した。"}, {"t": 1818.7666666666667, "x": "大法院は、韓国の最高裁判所にあたる。"}, {"t": 1821.6666666666667, "x": "そして3日後の12月20日、刑が執行された。"}, {"t": 1825.05, "x": "確定から3日なの？"}, {"t": 1826.6, "x": "国会でも、その早さに驚く声が出ている。"}, {"t": 1829.4666666666667, "x": "大きな疑問が解かれないまま\n執行された、と議員は述べた。"}, {"t": 1832.9666666666667, "x": "日本には死刑の根拠が\n示されていない、と言う議員もいた。"}, {"t": 1836.4, "x": "12月23日、参議院の法務委員会。"}, {"t": 1839.35, "x": "警察庁の外事課長は、言葉を選んでこう答えた。"}, {"t": 1842.6333333333334, "x": "本人は死亡しているが、と前置きをしてだ。"}, {"t": 1845.3, "x": "犯行の動機と背後の関係は、\nまだ十分に解明されていない。"}, {"t": 1849.2833333333333, "x": "本人がいないのに、捜査は続くの？"}, {"t": 1851.7333333333333, "x": "続ける、と答えている。"}, {"t": 1853.3333333333333, "x": "日本の警察が男に直接話を聞く\n機会は、最後まで無かった。"}, {"t": 1858.3833333333334, "x": "12月24日、外事課長は捜査の概要を報告した。"}, {"t": 1862.1833333333334, "x": "日本の法律で調べた容疑は、4つある。"}, {"t": 1864.8833333333334, "x": "派出所からの拳銃の窃盗。"}, {"t": 1866.85, "x": "命を奪う準備をした罪。"}, {"t": 1868.5666666666666, "x": "旅券法の違反と、出入国管理令の違反だ。"}, {"t": 1871.8166666666666, "x": "命を奪う準備の罪も、日本で？"}, {"t": 1874.2166666666667, "x": "拳銃を盗み、旅券を作ったのは日本の中だからな。"}, {"t": 1877.6333333333334, "x": "外務大臣も、結果としては\n準備行為になると答えている。"}, {"t": 1881.2166666666667, "x": "外国で起きた事件の手助けを、日本で裁けるのか。"}, {"t": 1884.5833333333333, "x": "9月11日、法務省の課長は一般論として答えている。"}, {"t": 1888.4333333333334, "x": "手助けの行為が日本の中で行われたなら、\n日本の法律を当てはめる余地がある。"}, {"t": 1893.4, "x": "準備が日本なら、日本の法律の出番なのね。"}, {"t": 1896.4833333333333, "x": "課長の報告では、どれもほぼ捜査を終えている。"}, {"t": 1899.2666666666667, "x": "近いうちに、検察庁へ送る予定だという。"}, {"t": 1901.9666666666667, "x": "送る時には大阪府警の特別捜査本部が\n発表する予定だとも答えている。"}, {"t": 1906.8333333333333, "x": "本人がもういないのに、送るの？"}, {"t": 1908.9833333333333, "x": "手続きとしては、そうなる。"}, {"t": 1910.8, "x": "前の日の答弁で課長は本人が\n亡くなったことにも触れていた。"}, {"t": 1914.4833333333333, "x": "それでも日本の法律で調べた\n結果は書類にして残す形だ。"}, {"t": 1918.4166666666667, "x": "法務省は、被疑者が国内にいない\n場合の処分にも触れている。"}, {"t": 1922.0666666666666, "x": "その後どう処理されたかは、\n今回の資料では確かめられなかった。"}, {"t": 1925.8666666666666, "x": "ここでは、送る予定だと答えた所までにしておく。"}, {"t": 1929.6833333333334, "x": "整理しておこう。"}, {"t": 1930.7166666666667, "x": "1974年7月18日、大阪の高津派出所から\n拳銃2丁が消えた。"}, {"t": 1936.2666666666667, "x": "1丁は8月15日のソウルの式典で使われた。"}, {"t": 1939.55, "x": "番号と型と、試し撃ちの弾の線が一致した。"}, {"t": 1942.7, "x": "もう1丁は、大阪の自宅の床下から出てきた。"}, {"t": 1946.0333333333333, "x": "派出所の扉には、車の工具の傷が残っていたのよね。"}, {"t": 1949.85, "x": "そうだ。大和川からは手錠も出てきた。"}, {"t": 1952.4166666666667, "x": "大阪府庁には、他人の名前の申請書が4通。"}, {"t": 1955.55, "x": "本人の顔の写真が4枚、旅券は2冊。"}, {"t": 1958.4166666666667, "x": "そして親書と、大使だけがしるしを付けた1枚のメモ。"}, {"t": 1961.85, "x": "派出所の扉の傷も床下の拳銃も、大阪に残った物だ。"}, {"t": 1966.05, "x": "入管の訪船の記録には、男の名前が無かった。"}, {"t": 1969.3333333333333, "x": "無いということも、日本に残った記録の1つだ。"}, {"t": 1972.55, "x": "有る物も無い物も、日本側の記録なのね。"}, {"t": 1975.5, "x": "国会の会議録で、文世光の名前が\n出る発言は215件ある。"}, {"t": 1979.9, "x": "1974年8月から1979年までの数だ。"}, {"t": 1984.4166666666667, "x": "それでも分からないことが残ったのね。"}, {"t": 1986.7666666666667, "x": "残った。拳銃の運び方、\n会場への入り方、資金の出どころ。"}, {"t": 1991.15, "x": "そして、なぜ撃ったのかという動機だ。"}, {"t": 1993.45, "x": "日韓の見方は割れたまま、本人はもういない。"}, {"t": 1996.9333333333334, "x": "最後に、亡くなった人の話に戻りたい。"}, {"t": 1999.6666666666667, "x": "陸英修夫人は、式典の会場で命を落とした。"}, {"t": 2002.9166666666667, "x": "合唱に来ていた女子高校生も、帰らなかった。"}, {"t": 2006.0666666666666, "x": "2人とも、ただその場にいただけなのよね。"}, {"t": 2008.8, "x": "そうだ。この回は、その場面を描かずに進めた。"}, {"t": 2011.9833333333333, "x": "日本の国会でも、亡くなった人を\n悼む言葉が何度も述べられた。"}, {"t": 2016.0, "x": "議員の質問にも、大臣の答弁にもだ。"}, {"t": 2018.85, "x": "拳銃が盗まれなければ、と考えてしまうわ。"}, {"t": 2021.8333333333333, "x": "それは誰にも分からない。"}, {"t": 2023.3166666666666, "x": "ただ警察庁の長官は、再び盗難を\n起こさないことが責任だと言った。"}, {"t": 2027.9166666666667, "x": "盗まれたら一日も早く明らかにすることも必要だ、と。"}, {"t": 2031.6333333333334, "x": "床下のもう1丁は、撃たれることなく見つかった。"}, {"t": 2034.75, "x": "2冊の旅券も、申請書の写真から本当の顔が分かった。"}, {"t": 2038.65, "x": "物は、うそをつかないのね。"}, {"t": 2040.55, "x": "物は残る。ただ、物だけでは答えの出ないこともある。"}, {"t": 2043.9166666666667, "x": "国会の答弁は、分かったことと\n分からないことを分けて答えていた。"}, {"t": 2047.8833333333334, "x": "今回は、大阪の派出所から消えた\n拳銃2丁と、2冊の旅券の記録だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
