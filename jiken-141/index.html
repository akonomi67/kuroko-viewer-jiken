<script>
const D={"name": "141", "file": "141_編集用", "dur": 2098.2, "segs": [], "subs": [{"t": 0.0, "x": "1971年の春、群馬県。ある男の兄が、\n保護司の家を訪ねた。"}, {"t": 5.116666666666666, "x": "頼みは1つ。弟の仮釈放を\n取り消してほしい、というものだった。"}, {"t": 9.533333333333333, "x": "自分の弟を刑務所に戻してくれって言いに行ったの？"}, {"t": 12.75, "x": "そうだ。判決文の中に、その一節が残っている。"}, {"t": 16.2, "x": "弟は36歳。府中刑務所を出たばかりだった。"}, {"t": 19.55, "x": "名前は大久保清。3月2日に仮釈放されている。"}, {"t": 23.133333333333333, "x": "残された刑はあと35日しかなかった。"}, {"t": 25.933333333333334, "x": "35日で終わる人を戻せって、よほどのことよね？"}, {"t": 29.416666666666668, "x": "家の中で激しい言い争いがあり、\n兄は弟をおそれたと書かれている。"}, {"t": 33.43333333333333, "x": "その訴えがどう扱われたかは読めた記録には無い。"}, {"t": 36.416666666666664, "x": "分かっているのはそのあとの数字だけだ。"}, {"t": 38.7, "x": "3月31日から5月10日まで、41日間。"}, {"t": 42.45, "x": "16歳から21歳の女性8人が命を奪われた。"}, {"t": 46.083333333333336, "x": "41日で8人も？"}, {"t": 47.95, "x": "最後の日には男の車のナンバーはもう分かっていた。"}, {"t": 51.03333333333333, "x": "のちに法務省の局長は国会でおわびの言葉を述べる。"}, {"t": 54.3, "x": "そして保護司の評価を、こう説明した。"}, {"t": 56.81666666666667, "x": "「保護観察の成績はむしろいいほう」。"}, {"t": 59.1, "x": "8人の命を奪った人が、成績がいいほう？"}, {"t": 62.2, "x": "今回は、その35日と41日の話だ。"}, {"t": 65.61666666666666, "x": "犯人の物語にはしない。"}, {"t": 67.28333333333333, "x": "亡くなった人たちの名前も出さない。"}, {"t": 69.56666666666666, "x": "判決文と国会の記録を順番に読んでいく。"}, {"t": 73.1, "x": "1971年3月2日、火曜日。"}, {"t": 76.16666666666667, "x": "大久保は東京の府中刑務所を、仮釈放で出た。"}, {"t": 79.4, "x": "そもそも何の罪で入っていたの？"}, {"t": 81.63333333333334, "x": "性犯罪だ。1967年2月の事件で、\n懲役3年6か月の判決を受けた。"}, {"t": 87.61666666666666, "x": "それより前に恐喝で受けた\n懲役1年の執行猶予も、取り消された。"}, {"t": 91.93333333333334, "x": "足すと4年6か月になる。"}, {"t": 93.85, "x": "それで1971年に出てきたのね。"}, {"t": 96.8, "x": "判決文の最後の方に、\n「累犯前科」という短い欄がある。"}, {"t": 100.85, "x": "るいはん？"}, {"t": 101.98333333333333, "x": "前の刑を終えて5年以内に、また\n罪を犯した人に付く言葉だ。"}, {"t": 105.93333333333334, "x": "その欄を読むと、日付が2つ並んでいる。"}, {"t": 108.65, "x": "昭和46年3月2日、仮出獄を許され。"}, {"t": 112.13333333333334, "x": "同年4月6日、刑の執行を受け終わった。"}, {"t": 115.06666666666666, "x": "仮釈放と仮出獄は違うものなの？"}, {"t": 117.73333333333333, "x": "当時の法律の言葉が仮出獄で、\n世間では仮釈放と呼んだ。同じものだ。"}, {"t": 122.78333333333333, "x": "つまり3月2日から4月6日まで、35日。"}, {"t": 126.16666666666667, "x": "これが国の手の届く期間のすべてだった。"}, {"t": 128.88333333333333, "x": "4月7日からは？"}, {"t": 130.31666666666666, "x": "普通の人に戻る。呼び出す\n権限も、連れ戻す権限も無くなる。"}, {"t": 134.5, "x": "仮出獄の間だけ、本人には保護観察が付く。"}, {"t": 137.93333333333334, "x": "守る約束があり、破れば刑務所に戻される。"}, {"t": 140.85, "x": "局長は保護観察の目的を、こう説明している。"}, {"t": 144.1, "x": "刑務所の中で教えるだけでなく、\n社会の中で教育していく。"}, {"t": 147.91666666666666, "x": "満期の前に外へ出して、そこで\n立ち直りを助ける仕組みだ。"}, {"t": 151.78333333333333, "x": "外で教育するための35日だったのね。"}, {"t": 154.61666666666667, "x": "その35日のうちに兄が訪ねて行ったのね。"}, {"t": 157.65, "x": "判決文の書き方では事件が\n始まる前のこととして出てくる。"}, {"t": 161.46666666666667, "x": "何月何日だったかは書かれていない。"}, {"t": 164.43333333333334, "x": "そもそも仮釈放って、どうやって決めるの？"}, {"t": 167.3, "x": "1971年9月の衆議院法務委員会で、\n法務省の課長が説明している。"}, {"t": 172.68333333333334, "x": "有期刑なら、刑期の3分の1が過ぎていること。"}, {"t": 175.83333333333334, "x": "それから「改悛の状」があること。"}, {"t": 178.26666666666668, "x": "かいしゅんのじょう？"}, {"t": 179.41666666666666, "x": "心から悔い改めている様子、という意味だ。"}, {"t": 182.16666666666666, "x": "さらに仮出獄の間に再犯のおそれがないこと。"}, {"t": 185.26666666666668, "x": "社会の感情が許すと認められること。"}, {"t": 187.75, "x": "これらを見て、地方更生保護委員会が合議で決める。"}, {"t": 191.03333333333333, "x": "施設の人が決めるんじゃないのね。"}, {"t": 193.21666666666667, "x": "刑務所長が申請し、別の委員会が審理する形だ。"}, {"t": 196.73333333333332, "x": "1971年の1年間で、申請は全国で2万696人。"}, {"t": 201.86666666666667, "x": "許されたのは1万7657人だった。"}, {"t": 205.28333333333333, "x": "ほとんど通っているじゃない。"}, {"t": 206.88333333333333, "x": "棄却率は9.6％。犯罪白書にそうある。"}, {"t": 210.36666666666667, "x": "前科が重なるほど棄却されやすい、という\n数字も同じ白書に載っている。"}, {"t": 214.68333333333334, "x": "それでも全体では、1割も棄却されていない。"}, {"t": 217.58333333333334, "x": "では大久保の場合はどう見られていたのか。"}, {"t": 219.85, "x": "1972年5月23日の参議院法務委員会で、\n保護局長が答えている。"}, {"t": 225.4, "x": "刑務所の中で反則はほとんどなかった。"}, {"t": 227.95, "x": "成績もいいほうだったので、仮出獄の決定を見た、と。"}, {"t": 231.68333333333334, "x": "でも前科があるんでしょ？"}, {"t": 233.2, "x": "そこは局長も認めている。"}, {"t": 234.83333333333334, "x": "同じ種類の前歴が3回あった。"}, {"t": 237.1, "x": "別の議員は検挙は4回と\n言っている。ここは数が揃わない。"}, {"t": 240.71666666666667, "x": "局長の説明はこうだ。"}, {"t": 242.2, "x": "審査の場では十分に検討した。"}, {"t": 244.36666666666667, "x": "ただ、前の事件から年数がたっている。"}, {"t": 246.88333333333333, "x": "だから一応、改悛しているものと見た。"}, {"t": 249.53333333333333, "x": "一応、なのね。"}, {"t": 250.83333333333334, "x": "国会の記録に残っている言葉のままだ。"}, {"t": 253.56666666666666, "x": "それにしても、出すのが早かったんじゃないの？"}, {"t": 256.3666666666667, "x": "判決の日付で計算してみる。"}, {"t": 258.46666666666664, "x": "最後の刑は懲役1年で、\n1970年4月7日に始まっている。"}, {"t": 263.21666666666664, "x": "仮釈放までに務めたのはその9割ほどになる。"}, {"t": 266.26666666666665, "x": "白書によると、定期刑で仮出獄した\n人の半数以上が9割以上を務めている。"}, {"t": 271.43333333333334, "x": "累犯にあたる人ではこれが77.8％だ。"}, {"t": 275.01666666666665, "x": "じゃあ特別に早かったわけじゃないのね。"}, {"t": 277.46666666666664, "x": "数字の上ではそうなる。"}, {"t": 278.8833333333333, "x": "ただ、法務大臣はのちに\n「早く出してはおります」と答えている。"}, {"t": 282.95, "x": "ここも見方が分かれる。"}, {"t": 285.06666666666666, "x": "審査の側にも、懸念はあった。"}, {"t": 287.1, "x": "局長の答弁で、はっきり語られている。"}, {"t": 289.71666666666664, "x": "男の妻はすでに実家に帰っていた。"}, {"t": 292.1, "x": "そこで保護の側は早く同居させようと考えた。"}, {"t": 295.1166666666667, "x": "家族と暮らせば落ち着くって考えたの？"}, {"t": 297.6666666666667, "x": "性的な問題が起きないように、という\n配慮だと局長は言っている。"}, {"t": 301.51666666666665, "x": "これを環境調整という。"}, {"t": 302.93333333333334, "x": "出る前に、帰る場所を整える仕事だ。"}, {"t": 305.46666666666664, "x": "ところが仮出獄のときに、妻は戻っていなかった。"}, {"t": 308.9166666666667, "x": "条件がそろわないまま出したってこと？"}, {"t": 311.31666666666666, "x": "局長もそこを反省点に挙げている。"}, {"t": 313.56666666666666, "x": "同居できるところまで解決してから\n許可すべきではなかったか、と。"}, {"t": 317.51666666666665, "x": "ただし、同じ答弁の中にこんな一言が続く。"}, {"t": 320.71666666666664, "x": "そうしていくと満期になってしまう。"}, {"t": 322.75, "x": "保護観察を付けられなかったかもしれない、と。"}, {"t": 325.6333333333333, "x": "どういうこと？"}, {"t": 326.76666666666665, "x": "待てば待つほど、残りの刑は減っていく。"}, {"t": 329.26666666666665, "x": "満期まで入れておけば、出た日から完全に自由だ。"}, {"t": 332.31666666666666, "x": "誰も付かないし、誰も見ない。"}, {"t": 334.3666666666667, "x": "出しても心配、出さなくても心配なのね。"}, {"t": 337.23333333333335, "x": "局長の別の答弁も、同じ悩みを語っている。"}, {"t": 340.3666666666667, "x": "保護観察の期間が1か月や2\nか月では効果をあげられない。"}, {"t": 343.98333333333335, "x": "だから仮出獄の期間は長いほうがいい、と。"}, {"t": 346.9, "x": "でも大久保は35日だった。"}, {"t": 349.0, "x": "珍しい短さではなかった。"}, {"t": 350.8833333333333, "x": "1971年の分を載せた犯罪白書に、\n数字がそのまま出ている。"}, {"t": 355.6166666666667, "x": "新しく保護観察になった\n仮出獄者のうち、59.0％が2か月以内。"}, {"t": 361.1333333333333, "x": "半分以上が2か月以内？"}, {"t": 362.98333333333335, "x": "3か月以内まで広げると69.8％になる。"}, {"t": 366.6333333333333, "x": "仮釈放の多くは刑の終わりのほうで許されていた。"}, {"t": 369.6, "x": "35日は当時の制度の中ではごく普通の長さだった。"}, {"t": 373.8, "x": "仮出獄した男には担当の保護司が付いた。"}, {"t": 376.76666666666665, "x": "年齢は81歳だった。"}, {"t": 378.7, "x": "81歳！？"}, {"t": 379.85, "x": "事件のあと、新聞が書いた数字だ。"}, {"t": 382.23333333333335, "x": "保護局長は国会で、こう明かしている。"}, {"t": 384.7, "x": "こんなお年寄りにどうして、という\nおしかりを受けた、と。"}, {"t": 387.95, "x": "確かに、そう言いたくなるけど。"}, {"t": 390.03333333333336, "x": "局長はすぐ続けて、その見方を退けている。"}, {"t": 393.1166666666667, "x": "現役の幼稚園の園長で、地域の信望も厚い人だった。"}, {"t": 396.8333333333333, "x": "保護司の経験は20年。ベテランだった。"}, {"t": 399.4, "x": "こういう前歴の者にこそ合うと\n期待して、頼んだのだという。"}, {"t": 403.1166666666667, "x": "年齢だけで決めつけるのは違うのね。"}, {"t": 405.48333333333335, "x": "局長はこうも言っている。"}, {"t": 407.01666666666665, "x": "年齢だけで不適当とは考えない。"}, {"t": 409.21666666666664, "x": "ただ24時間ずっと付いているわけにはいかない、と。"}, {"t": 412.3833333333333, "x": "保護司って、そもそも何をする人なの？"}, {"t": 415.06666666666666, "x": "法務省から頼まれた民間の人だ。給料は出ない。"}, {"t": 418.3333333333333, "x": "かかった費用を補う、実費弁償だけがある。"}, {"t": 421.23333333333335, "x": "ボランティアみたいなものなの？"}, {"t": 422.96666666666664, "x": "局長は、大部分の保護司は無給のほうが\nやりがいを感じていると答えた。"}, {"t": 427.25, "x": "当時の全国の保護司はおよそ5万人。"}, {"t": 429.6166666666667, "x": "では本職の役人はどのくらいいたのか。"}, {"t": 432.06666666666666, "x": "保護観察官という。1972年4月の時点で\n全国に720人あまり。"}, {"t": 437.5833333333333, "x": "所長や総務課長を除くと、600人を切る。"}, {"t": 440.65, "x": "全国で600人？"}, {"t": 442.1666666666667, "x": "受け持ちの対象者は8万人あまりだ。"}, {"t": 444.6, "x": "1人あたり常に150人から160人を担当する。"}, {"t": 448.2, "x": "局長は「物理的に不可能な数字」と言い切った。"}, {"t": 451.6333333333333, "x": "それで地元の保護司が頼りになるわけね。"}, {"t": 454.2, "x": "取り扱いの難しい対象者でも、\n主に保護司に任せるしかない。"}, {"t": 458.2, "x": "犯罪白書も同じことを書いている。"}, {"t": 460.51666666666665, "x": "保護司は実際にはどんなことをするの？"}, {"t": 462.8333333333333, "x": "対象者が月に1回ほど訪ねて来て、\nこちらも1回か2回は訪ねて行く。"}, {"t": 467.5, "x": "そこで暮らしや仕事の話を聞く。"}, {"t": 469.65, "x": "局長はこの席で、こんな言い方もしている。"}, {"t": 472.4166666666667, "x": "「おまえが来たから判こを押す」で\n済ませては実があがらない。"}, {"t": 475.8666666666667, "x": "判こを押すだけの人もいたってこと？"}, {"t": 478.1666666666667, "x": "そうは言っていない。"}, {"t": 479.1, "x": "研修に力を入れているという文脈だ。"}, {"t": 481.56666666666666, "x": "ただ、別の議員は\n大学の先生の新聞記事を読み上げた。"}, {"t": 485.18333333333334, "x": "保護の活動は民間の篤志家に頼っている。"}, {"t": 487.95, "x": "中には熱心な人もいるが、ほとんどが\nおざなりになっている、と。"}, {"t": 491.93333333333334, "x": "それは保護司の人には厳しい言葉ね。"}, {"t": 494.4166666666667, "x": "法務政務次官は別の見方を答えている。"}, {"t": 497.0, "x": "堅苦しい役人より、普通の人と\n接するほうが社会へ戻りやすい面もある。"}, {"t": 501.6166666666667, "x": "民間の人に頼むのにはそういう理由もあった。"}, {"t": 505.03333333333336, "x": "男は出所後の計画を持っていた。"}, {"t": 507.1333333333333, "x": "室内装飾の仕事だ。"}, {"t": 508.93333333333334, "x": "判決文によれば、妻に\n「親子4人で暮らしたい」と頼んでいる。"}, {"t": 513.0333333333333, "x": "妻の決意は変わらなかった。"}, {"t": 514.9333333333333, "x": "断られて、それから？"}, {"t": 516.6666666666666, "x": "家の中の争いは激しくなった。\nその中身はこの回では触れない。"}, {"t": 520.6666666666666, "x": "大事なのは1点だけだ。"}, {"t": 522.3, "x": "男の兄が、保護司のもとへ足を運んだこと。"}, {"t": 525.1833333333333, "x": "取り消しの頼みはこの流れの中に出てくる。"}, {"t": 527.9666666666667, "x": "判決はそのあとどう続くの？"}, {"t": 529.9666666666667, "x": "兄への憎しみがつのり、前途を\n悲観して自暴自棄になった。"}, {"t": 533.6166666666667, "x": "判決文はそう認定している。"}, {"t": 535.5666666666667, "x": "そして、その頃に買ったのが1台の車だ。"}, {"t": 538.5, "x": "マツダのロータリークーペ。白い車だった。"}, {"t": 541.2166666666667, "x": "出てきたばかりで新車なんて買えるの？"}, {"t": 543.5166666666667, "x": "親が金を出した。仕事に要ると言ったからだ。"}, {"t": 546.2833333333333, "x": "局長の答弁でも、車の話は出てくる。"}, {"t": 549.1333333333333, "x": "室内装飾の品物を売りに行く、と本人は言っていた。"}, {"t": 552.6333333333333, "x": "親にも保護司にも同じ説明をした。"}, {"t": 554.9, "x": "親も保護司も、みんなそれを信じた。"}, {"t": 557.3, "x": "毎日車で出かけても、商売なら\n不思議じゃないものね。"}, {"t": 560.85, "x": "局長は、あとからこう振り返っている。"}, {"t": 563.2, "x": "どこへ行ったのか、どのくらいもうかったのか。"}, {"t": 565.7833333333333, "x": "それをもっと聞いていれば、もう\n少し早く分かったのではないか。"}, {"t": 569.35, "x": "ただ、これも局長自身が「結果的」と断っている。"}, {"t": 573.0, "x": "保護観察は人と\n人との信頼関係だ、という前提があった。"}, {"t": 577.0833333333334, "x": "疑ってかかるのも難しい仕事なのね。"}, {"t": 579.7, "x": "別の議員の質問にはもっと短い一文がある。"}, {"t": 582.6833333333333, "x": "出獄して1週間くらいで車を\n買ったら、もう始まっておる。"}, {"t": 586.45, "x": "これは新聞の報道をもとにした、議員の言葉だ。"}, {"t": 590.15, "x": "判決文は男の格好まで書き留めている。"}, {"t": 592.8833333333333, "x": "ベレー帽に、ルパシカと呼ばれる上着。"}, {"t": 595.25, "x": "ルパシカって？"}, {"t": 596.4166666666666, "x": "ロシアの民族衣装の、詰め襟の上着だ。"}, {"t": 598.95, "x": "画家のように見える格好だな。"}, {"t": 600.75, "x": "男は偽の名前を使い、見知らぬ女性に話しかけた。"}, {"t": 604.2, "x": "美術の教師だが、モデルになってくれませんか。"}, {"t": 607.0833333333334, "x": "英語の先生だが、付き合ってくれませんか。"}, {"t": 609.8166666666667, "x": "先生だって言われたら、信じちゃう人もいるわよね。"}, {"t": 612.9833333333333, "x": "警察白書はこの手口を\n平成12年版でも取り上げている。"}, {"t": 616.6833333333333, "x": "新車を乗り回し、美術教師になりすました、と。"}, {"t": 619.95, "x": "どのくらいの人に声をかけたの？"}, {"t": 622.0666666666667, "x": "逮捕のあと、警察は声をかけられた女性を探した。"}, {"t": 625.3333333333334, "x": "浮かび上がった人数はおよそ150人。"}, {"t": 627.6666666666666, "x": "確認できたのは127人という記録もある。"}, {"t": 630.85, "x": "2か月で100人以上に声をかけたの？"}, {"t": 633.3166666666667, "x": "車に乗ったのは30人あまりとされる。"}, {"t": 635.7833333333333, "x": "走った距離は1日平均で約170キロ。"}, {"t": 638.9333333333333, "x": "タクシーみたいな距離じゃない。"}, {"t": 640.6166666666667, "x": "これらは事件を追った本と当時の報道の数字だ。"}, {"t": 643.5166666666667, "x": "判決文の言葉では「連日の如く」となる。"}, {"t": 646.6666666666666, "x": "刑務所を出て、ひと月も経たないうちに\n始まった、とも書いている。"}, {"t": 650.7833333333333, "x": "その間も保護司には会っていたの？"}, {"t": 652.9166666666666, "x": "会っていた。そこが国会で問われることになる。"}, {"t": 655.6833333333333, "x": "その前に、日付を1つ確かめておく。"}, {"t": 658.9333333333333, "x": "1人目が命を奪われたのは3月31日の夕方だった。"}, {"t": 662.8666666666667, "x": "仮釈放から29日後のことだ。"}, {"t": 665.1833333333333, "x": "この回では1人ずつの話はしない。"}, {"t": 667.4666666666667, "x": "2人目は4月6日の夜。"}, {"t": 669.35, "x": "4月6日って、さっきの日付？"}, {"t": 671.6833333333333, "x": "刑の執行を受け終わった日だ。"}, {"t": 673.5166666666667, "x": "判決文の別々の場所に書かれた\n日付を並べると、そうなる。"}, {"t": 677.45, "x": "残り6人と、生きて帰った1人の事件は\nすべてそのあとに起きた。"}, {"t": 681.7166666666667, "x": "じゃあ、保護観察の期間が終わったあとってこと？"}, {"t": 684.6666666666666, "x": "仮出獄の間だけ付くのが保護観察だ。"}, {"t": 687.3333333333334, "x": "理屈の上ではそうなる。"}, {"t": 688.8666666666667, "x": "判決も、4月11日の事件から\nあとを再犯として扱っている。"}, {"t": 693.2833333333333, "x": "でも国会では保護観察中の事件って言っていたわよね？"}, {"t": 696.7833333333333, "x": "そこは揃わない。"}, {"t": 697.8833333333333, "x": "局長は「保護観察中にああいった\n事件を起こした」と言った。"}, {"t": 701.7166666666667, "x": "議員も、仮釈放からわずか2か月と語っている。"}, {"t": 704.9, "x": "どちらが誤りとはここでは決めない。"}, {"t": 707.0, "x": "確かなのは最初の2件が35日の中に入っていること。"}, {"t": 710.7666666666667, "x": "そして8件のうち6件は35日の外にあること。"}, {"t": 714.3, "x": "35日の外だと、誰が見ていることになるの？"}, {"t": 717.6, "x": "制度の上では誰も見ていない。"}, {"t": 719.3666666666667, "x": "前科のある、36歳の普通の市民になっていた。"}, {"t": 722.6833333333333, "x": "満期で出た人と同じ立場だ。"}, {"t": 724.7, "x": "保護司が善意で\n付き合い続けることはできても、権限は無い。"}, {"t": 728.3666666666667, "x": "その保護司との付き合いはどのくらいあったの？"}, {"t": 730.9166666666666, "x": "記録に残る数字は9回だ。"}, {"t": 733.5166666666667, "x": "1972年5月23日、参議院法務委員会。"}, {"t": 737.5333333333333, "x": "1人の議員が、自分で調べた数字を読み上げた。"}, {"t": 740.5833333333334, "x": "男は出獄した翌日に、もう保護司のところへ来ている。"}, {"t": 744.1666666666666, "x": "2か月足らずで、保護司のところへ4回。"}, {"t": 746.7333333333333, "x": "保護司のほうからも5回、訪ねている。"}, {"t": 749.1666666666666, "x": "合わせて9回？"}, {"t": 750.3333333333334, "x": "議員は「理想どおり」と言った。"}, {"t": 752.3166666666667, "x": "これだけ話しているのに、\nどうして分からなかったのか、と。"}, {"t": 755.7833333333333, "x": "新聞の報道にもとづく数字で、局長も否定していない。"}, {"t": 759.45, "x": "9回も会って、何も気づかなかったの？"}, {"t": 762.1, "x": "局長の答えはこうだった。"}, {"t": 763.8333333333334, "x": "本人は保護司に会うとき、\n表面まじめで改悛した様子だった。"}, {"t": 767.7333333333333, "x": "接触も確実にする。"}, {"t": 769.3666666666667, "x": "保護観察の成績はむしろいいほうだ、という\n評価を保護司が持った。"}, {"t": 773.3, "x": "そして局長ははっきり付け足している。"}, {"t": 775.6333333333333, "x": "「ここに間違いがあった」。"}, {"t": 777.2, "x": "認めたのね。"}, {"t": 778.3666666666667, "x": "ただ、9回のうち何回が4月6日より前かは分からない。"}, {"t": 781.9666666666667, "x": "どの回に、どんな話をしたかも、資料には無い。"}, {"t": 785.0666666666667, "x": "兄の訴えが保護司のもとに\n届いたことだけは判決文にある。"}, {"t": 788.8666666666667, "x": "そのこと、国会では話に出なかったの？"}, {"t": 791.6666666666666, "x": "読めた国会の発言の中には出てこない。"}, {"t": 794.25, "x": "議員の質問にも局長の答弁にも、兄の話は無かった。"}, {"t": 798.1166666666667, "x": "保護司は同居の話を進めようと、\n相当努力していたともいう。"}, {"t": 802.0, "x": "もう少しで実現する\n段階だった、というのが局長の説明だ。"}, {"t": 806.0166666666667, "x": "それができないまま、事件が起きた。"}, {"t": 808.4, "x": "一生懸命やっていた人がいたのは本当なのね。"}, {"t": 811.45, "x": "議員も「一生懸命やられたんだと\n思います」と言っている。"}, {"t": 814.95, "x": "局長は別の席で、一番危険な\n対象者についても語っている。"}, {"t": 819.1166666666667, "x": "住む所を変えて、行方が分からなくなる者だ。"}, {"t": 822.2, "x": "大久保はそうじゃなかったのね。"}, {"t": 824.0166666666667, "x": "家にいて、約束どおり顔を出し、車で\n商売に出ていることになっていた。"}, {"t": 828.4666666666667, "x": "一番危険だと思われていた型の、正反対だった。"}, {"t": 831.8, "x": "誰か1人を悪者にできる話ではない。"}, {"t": 834.3166666666667, "x": "だから議員は制度の話として問いかけたのだろう。"}, {"t": 837.9, "x": "1971年4月11日。"}, {"t": 840.4, "x": "判決文の「第三」の事件だ。"}, {"t": 842.8333333333334, "x": "群馬県富岡市の路上で、男は\n19歳の会社員に声をかけた。"}, {"t": 847.1333333333333, "x": "この人は乱暴を受け、けがをした。"}, {"t": 849.3666666666667, "x": "しかし、生きて帰った。"}, {"t": 851.0833333333334, "x": "じゃあ、警察に話せたの？"}, {"t": 853.0, "x": "そこが資料によって食い違う。"}, {"t": 854.8, "x": "当時の新聞をもとにした記事では\n4月のうちに届け出たとある。"}, {"t": 858.5333333333333, "x": "事件を追った本では5月15日に届け出たとされる。"}, {"t": 861.9, "x": "1か月も違うじゃない。"}, {"t": 863.5, "x": "どちらが正しいかはここでは決めない。"}, {"t": 865.65, "x": "確かなのは後日この人の証言が\n決め手の1つになったことだ。"}, {"t": 869.6, "x": "逮捕のニュースで顔を見て、間違いないと言った。"}, {"t": 872.4166666666666, "x": "名乗り出るのがどれほど重いことだったか。"}, {"t": 874.7333333333333, "x": "1971年の社会を思うと、想像もつかない。"}, {"t": 878.5166666666667, "x": "この人がいなかったら、どうなっていたの？"}, {"t": 881.1166666666667, "x": "それも後で触れる。警察にはそのとき物証が無かった。"}, {"t": 884.5166666666667, "x": "ここで少し、数字の話をしておく。"}, {"t": 886.9833333333333, "x": "犯罪白書は性犯罪の発生件数が\n年々減っていると書いている。"}, {"t": 891.2166666666667, "x": "減っていたの？"}, {"t": 892.35, "x": "統計の上ではそうだ。ただし、数えられるのは\n届け出られたものだけになる。"}, {"t": 896.7333333333333, "x": "判決文には男が車に誘った\n女性たちのことも書かれている。"}, {"t": 900.7166666666667, "x": "その多くを欺いた、と。"}, {"t": 902.3166666666667, "x": "届け出なかった人が\n何人いたのかは誰にも分からない。"}, {"t": 905.6166666666667, "x": "事件の外側にいた人の数は記録に残らない。"}, {"t": 909.3166666666667, "x": "4月から5月にかけて、群馬では\n行方の分からない女性が続いた。"}, {"t": 913.5166666666667, "x": "警察は気づかなかったの？"}, {"t": 915.3333333333334, "x": "当時は1件ずつ別の行方不明として\n扱われていたとされる。"}, {"t": 919.0166666666667, "x": "警察には家出人票という記録がある。"}, {"t": 921.5333333333333, "x": "いえでにんひょう？"}, {"t": 922.6666666666666, "x": "着ていた服や体の特徴を書き、写真を付けたカードだ。"}, {"t": 926.2333333333333, "x": "警察庁が持っていた枚数は1972年末で10万2931枚。"}, {"t": 931.8, "x": "10万枚！？"}, {"t": 932.9333333333333, "x": "これだけの人が、1枚のカードになって\n保管されていた。"}, {"t": 936.3666666666667, "x": "逮捕のあと、警察はこの2か月を洗い直した。"}, {"t": 939.4333333333333, "x": "3月2日から5月14日までに\n行方不明になった若い女性は20人。"}, {"t": 943.95, "x": "そのうち事件に巻き込まれた可能性があるのが7人。"}, {"t": 947.0666666666667, "x": "当時の新聞をもとにした記事ではそう報じられている。"}, {"t": 950.25, "x": "20人って、そんなに多いのね。"}, {"t": 952.4833333333333, "x": "リストの中の1人は捜す中で居場所が分かった。"}, {"t": 955.5166666666667, "x": "届け出の有無や日付を、1人ずつ\n確かめた公の資料は見つからなかった。"}, {"t": 960.2333333333333, "x": "家族は届けていたのかしら。"}, {"t": 962.1666666666666, "x": "はっきり分かるのは最後のほうの1件だけだ。"}, {"t": 964.7833333333333, "x": "その家族の動きが、事件を止めることになる。"}, {"t": 967.6833333333333, "x": "1971年5月9日の日曜日に話を進める。"}, {"t": 972.3833333333333, "x": "5月9日の夕方、群馬県藤岡市。"}, {"t": 975.25, "x": "21歳の会社員が、買い物の途中で声をかけられた。"}, {"t": 978.8333333333334, "x": "絵のモデルになってもらいたいんですが。"}, {"t": 980.9166666666666, "x": "判決文に、その言葉が残っている。"}, {"t": 983.5333333333333, "x": "美術の先生のふりをした、あの手口ね。"}, {"t": 986.3, "x": "その人は家族に話してから出かけたという。"}, {"t": 989.0166666666667, "x": "自転車に乗って出たまま、夜になっても帰らなかった。"}, {"t": 992.3333333333334, "x": "一緒に暮らす兄の夫婦が、心当たりを探して回った。"}, {"t": 995.9, "x": "ここで出てくる兄は大久保の兄とは別の人よね？"}, {"t": 998.95, "x": "別の人だ。妹を探す兄と呼ぶことにする。"}, {"t": 1002.0166666666667, "x": "日付が変わった5月10日の午前1時半ごろ。"}, {"t": 1004.9333333333333, "x": "妹を探す兄は藤岡警察署に電話した。"}, {"t": 1007.9833333333333, "x": "警察は動いてくれたの？"}, {"t": 1009.7, "x": "家出の可能性を考えつつ、管内の派出所に連絡した。"}, {"t": 1013.4166666666666, "x": "パトカーも、若い人が集まりそうな場所を回った。"}, {"t": 1016.5333333333333, "x": "妹はどこにもいなかった。"}, {"t": 1018.25, "x": "妹を探す兄の会社の人たちや\n友人も、手分けして探した。"}, {"t": 1022.4666666666667, "x": "夜中に大勢で探したのね。"}, {"t": 1024.45, "x": "そして10日の早朝、兄は妹の自転車を見つけた。"}, {"t": 1027.8166666666666, "x": "場所は市内の信用金庫の、自転車置き場だ。"}, {"t": 1030.7666666666667, "x": "判決文にも、男がここへ自転車を置いたとある。"}, {"t": 1033.8833333333334, "x": "兄はその足で藤岡署へ行き、正式に捜索願を出した。"}, {"t": 1037.7833333333333, "x": "で、また自転車のところに戻ったの？"}, {"t": 1040.2833333333333, "x": "戻った。そして、見張ることにした。"}, {"t": 1042.75, "x": "事件全体を動かしたのはここからの数時間だ。"}, {"t": 1046.35, "x": "5月10日の午前9時半ごろ。"}, {"t": 1048.3166666666666, "x": "自転車置き場に、白いマツダの車が入ってきた。"}, {"t": 1051.5, "x": "降りてきた男はまっすぐ自転車へ向かった。"}, {"t": 1054.1833333333334, "x": "まさか、本人が戻ってきたの？"}, {"t": 1056.45, "x": "軍手をはめた手で、自転車のあちこちをなでたという。"}, {"t": 1059.55, "x": "妹を探す兄は指紋を消しているのではと感じた。"}, {"t": 1062.6333333333334, "x": "近づいて、この自転車は\nあなたのものかと声をかけた。"}, {"t": 1066.0333333333333, "x": "男はどうしたの？"}, {"t": 1067.35, "x": "口ごもって車に乗り、走り去った。"}, {"t": 1069.7833333333333, "x": "兄は追ったが、見失った。"}, {"t": 1071.6, "x": "しかしナンバーは目に焼き付けていた。"}, {"t": 1073.85, "x": "すごい！"}, {"t": 1074.9666666666667, "x": "1文字だけ、汚れて読めなかったという。"}, {"t": 1077.4833333333333, "x": "兄は警察に知らせ、同時に\nマツダの販売店へ向かった。"}, {"t": 1081.0666666666666, "x": "車の持ち主は高崎市の大久保清だと分かった。"}, {"t": 1084.35, "x": "警察のほうでも照会で同じ番号を割り出した。"}, {"t": 1087.2666666666667, "x": "同じ番号の車は5台。"}, {"t": 1088.8, "x": "同じ車種は1台だった。"}, {"t": 1090.55, "x": "前科のある人物で、写真を見せられた\n兄も本人だと確かめた。"}, {"t": 1094.7333333333333, "x": "じゃあ、その日のうちに捕まえられたの？"}, {"t": 1097.1666666666667, "x": "捕まらなかった。男は家に帰らなかった。"}, {"t": 1099.9666666666667, "x": "ここで時刻を1つ、判決文から読む。"}, {"t": 1102.65, "x": "判決の「第九」は、\n5月10日の午後6時50分ごろで始まる。"}, {"t": 1107.2333333333333, "x": "同じ日の？"}, {"t": 1108.35, "x": "前橋市で、21歳の女性が男の車に乗った。"}, {"t": 1111.75, "x": "この人が8人目になった。"}, {"t": 1113.75, "x": "朝にナンバーが分かって、その日の夕方に？"}, {"t": 1116.5666666666666, "x": "時刻を並べると、そうなる。"}, {"t": 1118.4166666666667, "x": "警察が持ち主をいつ突き止めたか、\n正確な時刻は分からない。"}, {"t": 1122.35, "x": "だから、間に合ったとも\n間に合わなかったとも言わない。"}, {"t": 1125.2833333333333, "x": "これは判決の時刻と、新聞の時刻を\n並べただけのものだ。"}, {"t": 1129.2333333333333, "x": "でも、聞くとつらいわね。"}, {"t": 1130.9666666666667, "x": "41日の最後の日はそういう日だった。"}, {"t": 1134.2333333333333, "x": "男の家に戻らない状態が続いた。"}, {"t": 1136.5666666666666, "x": "警察の手配とは別に、妹を探す兄も動いた。"}, {"t": 1139.9, "x": "知人や友人が集まり、自分たちの捜索隊を作った。"}, {"t": 1143.5666666666666, "x": "民間の人たちで？"}, {"t": 1145.0666666666666, "x": "そうだ。警察と連絡を取り、指導も受けながらだった。"}, {"t": 1148.5166666666667, "x": "事件を追った本によると、5月12日からは車70台。"}, {"t": 1152.3166666666666, "x": "群馬だけでなく、長野や埼玉まで足を伸ばした。"}, {"t": 1155.4666666666667, "x": "探すのは白いロータリークーペ1台だ。"}, {"t": 1157.9166666666667, "x": "70台で1台を探すって、すごいわね。"}, {"t": 1160.7666666666667, "x": "5月13日の夕方、前橋市内で該当の車が見つかった。"}, {"t": 1165.0, "x": "捜索隊は車を追い詰め、男を取り押さえた。"}, {"t": 1167.9666666666667, "x": "そして警察に引き渡した。"}, {"t": 1170.0166666666667, "x": "民間の人が捕まえたの？"}, {"t": 1171.9333333333334, "x": "身柄を押さえたのは捜索隊だった。"}, {"t": 1174.1, "x": "当時の報道ではこのときも助手席に\n若い女性が乗っていたという。"}, {"t": 1177.9, "x": "この捜索隊が国会で語られた記録は見つからなかった。"}, {"t": 1181.4666666666667, "x": "妹を探す兄は名前を残さない形で記録の中にいる。"}, {"t": 1185.0666666666666, "x": "判決文にも、国会の議事録にも出てこない。"}, {"t": 1188.05, "x": "出てくるのは地元の新聞が半世紀後に書いた連載だ。"}, {"t": 1191.4166666666667, "x": "上毛新聞はその回に、\n「妹捜索 執念の張り込み」と見出しを付けた。"}, {"t": 1196.95, "x": "5月14日、男は逮捕された。"}, {"t": 1199.5, "x": "殺人の疑いで？"}, {"t": 1200.9333333333334, "x": "いや。わいせつ目的の誘拐の疑いだ。"}, {"t": 1203.5666666666666, "x": "この時点では人が亡くなったという証拠が1つも無い。"}, {"t": 1206.7666666666667, "x": "警察白書の書き方も短い。"}, {"t": 1208.9333333333334, "x": "群馬県藤岡市の会社員の女性を\n誘拐した、高崎市の男が検挙された。"}, {"t": 1213.9166666666667, "x": "その先はその後の捜査で分かった、と続く。"}, {"t": 1216.8833333333334, "x": "証拠が無いと、長くは調べられないわよね？"}, {"t": 1219.65, "x": "勾留の期限がある。そこへ翌日、動きがあった。"}, {"t": 1222.9, "x": "4月11日の女性が、面通しをした。"}, {"t": 1225.6833333333334, "x": "間違いない、この男だ、と。"}, {"t": 1227.65, "x": "5月15日、この人への乱暴の疑いで再逮捕となった。"}, {"t": 1231.6333333333334, "x": "あの人の言葉がつないだのね。"}, {"t": 1233.6833333333334, "x": "男はこの件は認めた。"}, {"t": 1235.35, "x": "藤岡の女性のことも話し始めた。"}, {"t": 1237.7666666666667, "x": "しかし、言った場所からは何も出てこなかった。"}, {"t": 1240.7, "x": "うそを言ったの？"}, {"t": 1241.8333333333333, "x": "本によれば、場所は警察への復讐として\n話さないと言ったという。"}, {"t": 1245.8166666666666, "x": "上毛新聞の連載の1回は、「翻弄」という見出しだ。"}, {"t": 1249.35, "x": "否認とうそで核心が遠い、と続く。"}, {"t": 1251.7833333333333, "x": "動いたのは取調室の外だった。"}, {"t": 1254.0833333333333, "x": "5月21日、榛名の公園の管理人から通報が入った。"}, {"t": 1258.1, "x": "藤岡の女性のニュースを見て、\n思い出したことがあったという。"}, {"t": 1261.5833333333333, "x": "5月の初めに白っぽい車の男が立っていた、と。"}, {"t": 1265.0166666666667, "x": "それで山を見に行ったの？"}, {"t": 1266.6333333333334, "x": "念のために調べ、見つけて、警察に知らせた。"}, {"t": 1269.8166666666666, "x": "3月31日から行方の分からなかった人だと分かった。"}, {"t": 1273.6, "x": "41日の最初の人が、ここで見つかった。"}, {"t": 1276.6833333333334, "x": "逮捕から1週間後のことだ。"}, {"t": 1278.6166666666666, "x": "それでも男はこの件を認めなかった。"}, {"t": 1281.6166666666666, "x": "取り調べは長くなった。"}, {"t": 1283.1833333333334, "x": "男は5月26日、藤岡の女性について供述した。"}, {"t": 1287.0833333333333, "x": "翌日、言った場所で見つかった。"}, {"t": 1289.25, "x": "6月4日には1人目のことも認めた。"}, {"t": 1291.8833333333334, "x": "ほかは「秋まで言わない」と黙った。"}, {"t": 1294.3333333333333, "x": "秋まで？"}, {"t": 1295.4666666666667, "x": "事件を追った本に、そう書かれている。"}, {"t": 1297.7166666666667, "x": "ここから先の取り調べの細かい\n話は主にその本が元になる。"}, {"t": 1301.6666666666667, "x": "捜査本部は作戦を変えた。"}, {"t": 1303.5, "x": "男が書いた詩を読み、心境を語らせた。"}, {"t": 1306.2666666666667, "x": "詩？"}, {"t": 1307.4, "x": "男は服役の前に、自分で詩集を出していた。"}, {"t": 1310.4833333333333, "x": "6月24日、取り調べは\n班長の警部1人だけに切り替わる。"}, {"t": 1314.6166666666666, "x": "すると男は条件を持ち出した。"}, {"t": 1316.6666666666667, "x": "望む条件を7つ出し、態度次第で場所を教える、と。"}, {"t": 1320.1666666666667, "x": "取り調べされる側が条件を出すの？"}, {"t": 1322.4666666666667, "x": "警部はほとんど断った。"}, {"t": 1324.1, "x": "ただ「報道を同行させない」という\n条件は受け入れられた。"}, {"t": 1327.55, "x": "6月27日の未明、榛名町内でまた1人が見つかった。"}, {"t": 1331.8333333333333, "x": "3か月近くたっているのね。"}, {"t": 1333.8666666666666, "x": "5月に逮捕して、見つかったのはまだ3人だった。"}, {"t": 1337.0833333333333, "x": "7月13日、男はまた場所を案内すると言った。"}, {"t": 1340.5666666666666, "x": "報道を連れないという約束で、外へ出た。"}, {"t": 1343.25, "x": "しかし出た先で言葉をひるがえし、\n何も見つからなかった。"}, {"t": 1346.9333333333334, "x": "家族の人たちはその間もずっと待っていたのよね。"}, {"t": 1350.1166666666666, "x": "そうだ。行方の分からないまま、待たされていた。"}, {"t": 1353.05, "x": "この日を境に、やり方が変わることになる。"}, {"t": 1356.4166666666667, "x": "警察庁が指導に乗り出した。"}, {"t": 1358.3666666666666, "x": "男とは条件で妥協しない。"}, {"t": 1360.1833333333334, "x": "現場へ連れて行かず、写真や映像で場所を確かめる。"}, {"t": 1363.35, "x": "そして身柄を、別の署へ移す。"}, {"t": 1365.5833333333333, "x": "どこへ？"}, {"t": 1366.7166666666667, "x": "松井田警察署。群馬県の西部にある小さな署だ。"}, {"t": 1370.0, "x": "この移送のことは国会の記録にも残っている。"}, {"t": 1372.85, "x": "1972年5月10日の衆議院法務委員会。"}, {"t": 1376.15, "x": "別の事件の質問の中だ。"}, {"t": 1378.1666666666667, "x": "警察庁の刑事局長が、例として挙げた。"}, {"t": 1381.0666666666666, "x": "前橋警察署は留置人が多く、\n調べがなかなかうまくいかない。"}, {"t": 1384.9666666666667, "x": "だから静かな場所へ移した、という説明だ。"}, {"t": 1387.9, "x": "環境を変えたのね。"}, {"t": 1389.3166666666666, "x": "本によると、松井田署の留置場には\n他に誰もいなかった。"}, {"t": 1392.95, "x": "上毛新聞の連載にも、\n旧松井田署の写真が載っている。"}, {"t": 1396.6, "x": "ここで取り調べが動いた。"}, {"t": 1398.2333333333333, "x": "7月20日から29日にかけて、男は次々と供述した。"}, {"t": 1402.5833333333333, "x": "残る5人が、順に見つかった。"}, {"t": 1404.7333333333333, "x": "掘る作業は人目を避けて深夜に行われたという。"}, {"t": 1407.7833333333333, "x": "7月の終わりまでかかったのね。"}, {"t": 1409.8833333333334, "x": "逮捕から、およそ80日だ。"}, {"t": 1412.0166666666667, "x": "7月30日の新聞が、最後の2人を伝えている。"}, {"t": 1415.6166666666666, "x": "8人全員が、家族のもとへ帰ることになった。"}, {"t": 1418.7, "x": "供述だけに頼ったわけでもない。"}, {"t": 1420.7666666666667, "x": "昭和48年の警察白書に、\n鑑定の事例として載っている。"}, {"t": 1424.8666666666666, "x": "男の車と着ていた服から、毛髪を採取した。"}, {"t": 1428.1666666666667, "x": "調べると、行方不明の8人のうち\n6人の毛髪だと証明された。"}, {"t": 1432.5833333333333, "x": "車の中に、はっきり証拠が残っていたのね。"}, {"t": 1435.6333333333334, "x": "だから白書はこの事件を、\n毛髪の鑑定の例として書いた。"}, {"t": 1439.35, "x": "逮捕の時に証拠が1つも無かった\n事件はこうして形になった。"}, {"t": 1443.9833333333333, "x": "1971年9月3日、衆議院法務委員会。"}, {"t": 1447.7, "x": "国会の記録で、この事件の名前が\n見つかるのはこの日からだ。"}, {"t": 1451.6166666666666, "x": "5月に逮捕したのに9月？"}, {"t": 1453.5833333333333, "x": "この年の通常国会は5月24日に閉じていた。"}, {"t": 1456.8666666666666, "x": "1人の議員が、仮出所について質問した。"}, {"t": 1459.8166666666666, "x": "一番最近問題になっているのは\n大久保清の問題だ、と。"}, {"t": 1463.6, "x": "仮出所に欠陥があるのではないか、と問いかけた。"}, {"t": 1466.7166666666667, "x": "法務省の観察課長は非常に\n反省させられていると答えた。"}, {"t": 1470.55, "x": "議員はそれで納得したの？"}, {"t": 1472.4, "x": "さらに踏み込んだ。"}, {"t": 1473.5666666666666, "x": "こういう人は出ればまた事件を\n起こすと考えられるのではないか。"}, {"t": 1477.1, "x": "制度そのものを変えるべきではないか、と。"}, {"t": 1479.5, "x": "答えたのは法務政務次官だった。"}, {"t": 1481.6166666666666, "x": "この答弁が、とても正直だ。"}, {"t": 1483.6833333333334, "x": "議員の問いは人間性についての深い\n問題だと認めている。"}, {"t": 1487.3166666666666, "x": "どういう意味？"}, {"t": 1488.45, "x": "1点でも再犯の疑いがあれば出さない、と\n決めたらどうなるか。"}, {"t": 1492.15, "x": "仮釈放という制度そのものが、ほとんど動かなくなる。"}, {"t": 1495.5333333333333, "x": "一方に、法と秩序から社会を守るという要請がある。"}, {"t": 1498.9, "x": "もう一方は罪を償った人の社会復帰を願う立場だ。"}, {"t": 1502.45, "x": "政務次官はこの2つの限界点の問題だと言った。"}, {"t": 1505.8166666666666, "x": "どっちかだけなら簡単なのにね。"}, {"t": 1507.9666666666667, "x": "この年の11月の委員会では\n別の議員が逆の心配も口にしている。"}, {"t": 1512.3333333333333, "x": "刑を終えた人を白い目で見ないでほしい。"}, {"t": 1514.5666666666666, "x": "社会へ出たあとの扱いに欠けていたのが、\nこの事件ではないか、と。"}, {"t": 1518.6666666666667, "x": "厳しくしろ、だけじゃないのね。"}, {"t": 1520.7333333333333, "x": "政務次官の答弁に戻る。"}, {"t": 1522.3666666666666, "x": "持ち出したのは人手の話だ。"}, {"t": 1524.4333333333334, "x": "保護司より、むしろ保護観察官の不足に問題がある。"}, {"t": 1527.8166666666666, "x": "保護司との連携がよく取れていないのではないか。"}, {"t": 1530.5166666666667, "x": "2か月後、法務大臣も同じことを言う。"}, {"t": 1533.0666666666666, "x": "1971年11月10日の衆議院内閣委員会だ。"}, {"t": 1537.1666666666667, "x": "法務大臣、前尾繁三郎。"}, {"t": 1539.1333333333334, "x": "大久保事件のような点は保護観察官が\n直接当たるべき問題だ。"}, {"t": 1543.1833333333334, "x": "保護司に任せておくのではいけない。"}, {"t": 1545.2166666666667, "x": "そして、観察官の増員を予算で求めていると答えた。"}, {"t": 1548.9333333333334, "x": "それで増えたの？"}, {"t": 1550.0666666666666, "x": "翌年度の予算で、増員は22人だった。"}, {"t": 1552.95, "x": "対象者8万人あまりに対しての22人だ。"}, {"t": 1555.9833333333333, "x": "これは法務省の説明にある数字だ。"}, {"t": 1558.8833333333334, "x": "1972年の春、法務委員会でこの名前が何度も出る。"}, {"t": 1563.0333333333333, "x": "4月18日にはまた別の議員が基準を読み上げた。"}, {"t": 1566.35, "x": "善良な社会人として自立するのに適当な時期に許す。"}, {"t": 1569.9666666666667, "x": "大阪の事件、この事件、ピストルの事件。"}, {"t": 1572.7, "x": "仮釈放中や保護観察中の事件を\n並べて、審査の中身を問うた。"}, {"t": 1577.25, "x": "法務大臣は何て答えたの？"}, {"t": 1579.2166666666667, "x": "刑期の7割か8割をつとめれば、\n大体は出すのが慣例だと説明した。"}, {"t": 1583.85, "x": "その上で、大久保の場合は\n早く出してはいるが、と続けている。"}, {"t": 1587.6, "x": "保護観察の面を強化しなければ、という答えだった。"}, {"t": 1590.8833333333334, "x": "1週間後の4月25日、大臣はもっと率直に語った。"}, {"t": 1594.9, "x": "ことに大久保清の問題で痛感した、と。"}, {"t": 1597.7166666666667, "x": "「ああいうことがなぜわからなかったか」。"}, {"t": 1599.8333333333333, "x": "大臣がそんなふうに言ったの？"}, {"t": 1601.7166666666667, "x": "議事録にそのまま残っている。"}, {"t": 1603.5833333333333, "x": "テストをし、精神医学で研究していれば\n分かったのではないか。"}, {"t": 1607.2833333333333, "x": "口から出まかせで、保護司も\nみんな瞞着されてしまった。"}, {"t": 1610.85, "x": "まんちゃく？"}, {"t": 1611.9833333333333, "x": "だまされた、という意味の言葉だ。"}, {"t": 1614.0333333333333, "x": "刑務所の中で見破って、観察官が\n責任を持てる形にすべきだ、と。"}, {"t": 1618.7, "x": "大臣はこうも言っている。"}, {"t": 1620.1833333333334, "x": "1回罪を犯すことはあるいはやむを得ないかも\nしれない。"}, {"t": 1623.1833333333334, "x": "しかし再犯、それも重大な再犯となると話は別だ。"}, {"t": 1626.8166666666666, "x": "根本的に考えるべき問題がある、と。"}, {"t": 1629.4166666666667, "x": "矯正局長も、前の年の11月に同じ趣旨を語っている。"}, {"t": 1633.4166666666667, "x": "刑務所は教育をする場だという原点に立ち返る。"}, {"t": 1636.3333333333333, "x": "もう一度深く反省し、やり直すべきではないか、と。"}, {"t": 1639.8166666666666, "x": "みんな反省の言葉は言っているのよね。"}, {"t": 1642.1833333333334, "x": "では刑務所の中で、見破れたのだろうか。"}, {"t": 1644.7666666666667, "x": "府中では反則はほとんど無く、成績もよかった。"}, {"t": 1647.9666666666667, "x": "外では保護司に、まじめな様子を見せ続けた。"}, {"t": 1650.8833333333334, "x": "判決の言葉を借りると、自分の醜さを\n隠し、美化する人物だった。"}, {"t": 1655.4833333333333, "x": "成績がいいことと、悔い改めていることは別のものだ。"}, {"t": 1658.8333333333333, "x": "では何を見ればよかったのか。"}, {"t": 1660.5666666666666, "x": "大臣も、これから研究してもらう、と言うにとどまった。"}, {"t": 1664.1333333333334, "x": "5月23日のあの答弁はそのあとなのね。"}, {"t": 1667.1333333333334, "x": "そうだ。局長はこの席で、責任を\n感じておわびすると述べた。"}, {"t": 1671.1166666666666, "x": "教訓は全国の出先に徹底した、とも語っている。"}, {"t": 1674.4666666666667, "x": "ただ、何をどう変えたのかまでは\nその答弁には出てこない。"}, {"t": 1677.8, "x": "最初の質問に議員は、\n「11名」という数字を使っている。"}, {"t": 1681.6166666666666, "x": "判決が認めたのは8人だ。ここも揃っていない。"}, {"t": 1685.5, "x": "裁判は1971年10月25日に、前橋地裁で始まった。"}, {"t": 1690.3833333333334, "x": "起訴は8人の殺人と死体遺棄、\nそして4月11日の事件などだ。"}, {"t": 1694.9166666666667, "x": "男は起訴事実を全面的に認めた。"}, {"t": 1697.6166666666666, "x": "認めたなら早く終わりそうだけど。"}, {"t": 1699.8, "x": "争点は動機だけになった。そこで長くかかった。"}, {"t": 1702.9, "x": "この初公判のことは翌日の国会でも\n一言だけ触れられた。"}, {"t": 1706.85, "x": "10月26日の衆議院予算委員会だ。"}, {"t": 1709.65, "x": "議員が別の大事故の質問に入る前に、触れている。"}, {"t": 1712.9666666666667, "x": "きのうはたまたま第1回公判があった、と。"}, {"t": 1715.7833333333333, "x": "それだけ世の中の関心が高かったのね。"}, {"t": 1718.5166666666667, "x": "裁判所は精神鑑定を命じた。"}, {"t": 1720.6333333333334, "x": "東京医科歯科大学の教授が、\n1972年の4月から半年かけて調べた。"}, {"t": 1726.1166666666666, "x": "結論は、精神病ではない。"}, {"t": 1728.0666666666666, "x": "ここではその先の説明には入らない。"}, {"t": 1730.4333333333334, "x": "判決も責任を認めた上で、死刑を選んでいる。"}, {"t": 1733.5833333333333, "x": "公判の中で男は自分を語り始めた。"}, {"t": 1736.2333333333333, "x": "権力に対する反抗だ、と言ったのだ。"}, {"t": 1738.9, "x": "女性たちと権力に何の関係があるの？"}, {"t": 1741.5666666666666, "x": "何の関係も無い。判決もそう言っている。"}, {"t": 1744.2, "x": "声をかけるまで全く関わりの無かった女性たちだ、と。"}, {"t": 1747.6166666666666, "x": "十数年前の事件を持ち出して、\n自分を美化していると退けた。"}, {"t": 1751.6166666666666, "x": "弁護人を解任し、裁判官の忌避も申し立てた。"}, {"t": 1754.9166666666667, "x": "裁判官3人を告訴することまでしている。"}, {"t": 1757.6166666666666, "x": "当時の新聞はこれを、延命のためと書いた。"}, {"t": 1760.5166666666667, "x": "謝ったりはしなかったの？"}, {"t": 1762.2333333333333, "x": "弁護人は謝罪の言葉を\n引き出そうとしたが、できなかったとされる。"}, {"t": 1766.25, "x": "1973年1月8日、検察は死刑を求刑した。"}, {"t": 1770.45, "x": "男の態度はそこでも変わらなかったという。"}, {"t": 1773.6166666666666, "x": "1973年2月22日、前橋地裁の判決。"}, {"t": 1777.8166666666666, "x": "主文は短い。被告人を死刑に処する。"}, {"t": 1780.5, "x": "量刑の理由にはこの回で見てきた言葉が出てくる。"}, {"t": 1783.5166666666667, "x": "刑務所を仮出獄後、月余も経ずして。"}, {"t": 1786.35, "x": "ひと月もたたないうちに、ってことよね。"}, {"t": 1788.8666666666666, "x": "そうだ。量刑の理由に保護観察の話は無い。"}, {"t": 1791.9, "x": "語られているのは本人のことだけだ。"}, {"t": 1794.1833333333334, "x": "出所後の家族の関係は希望どおりではなかった。"}, {"t": 1797.1166666666666, "x": "そこは裁判所も認めている。"}, {"t": 1798.9833333333333, "x": "しかし、それも本人の非行に原因がある。"}, {"t": 1801.7, "x": "出所後はあらゆる条件を克服して、\n自力で更生すべき立場にあった。"}, {"t": 1806.1166666666666, "x": "何ら責められる理由もない8名の女性の命を奪った。"}, {"t": 1809.4333333333334, "x": "「まさに天人ともに許すことができない」。"}, {"t": 1811.95, "x": "天人って？"}, {"t": 1813.0666666666666, "x": "天も人も、どちらも許さないという\n意味の古い言い方だ。"}, {"t": 1816.4666666666667, "x": "死刑の廃止が議論されていることにも、\n判決は触れている。"}, {"t": 1820.05, "x": "それでも充分に考えた上で、この刑しかないとした。"}, {"t": 1823.3833333333334, "x": "裁判長の名前はここでは言わない。"}, {"t": 1825.45, "x": "控訴の期限は3月8日いっぱいだった。"}, {"t": 1828.0666666666666, "x": "控訴したの？"}, {"t": 1829.2166666666667, "x": "しなかった。"}, {"t": 1830.3333333333333, "x": "3月9日に、死刑が確定した。"}, {"t": 1832.9166666666667, "x": "動機は判決が認定した範囲で閉じられた。"}, {"t": 1835.6666666666667, "x": "本人の言葉は退けられ、それ以上は語られなかった。"}, {"t": 1839.2833333333333, "x": "遺族の人は納得できたのかしら。"}, {"t": 1841.6166666666666, "x": "50年後の上毛新聞は遺族の言葉をこう見出しにした。"}, {"t": 1845.1, "x": "思い出したくない。"}, {"t": 1846.2666666666667, "x": "半世紀たっても、やり場のない\n無念が続いているという。"}, {"t": 1849.55, "x": "死刑は1976年1月22日に、東京拘置所で執行された。"}, {"t": 1854.6, "x": "確定からおよそ2年10か月。41歳だった。"}, {"t": 1858.5666666666666, "x": "じゃあ、仮釈放はやめるべきだったのかしら。"}, {"t": 1861.35, "x": "そう言い切れないのが、白書の数字だ。"}, {"t": 1863.7333333333333, "x": "昭和42年から46年の出所者を\n5年まで追った比率がある。"}, {"t": 1867.95, "x": "再び収容された人の割合を、年ごとに足していく。"}, {"t": 1871.3833333333334, "x": "仮出獄者は28.8％。"}, {"t": 1874.0333333333333, "x": "満期で出た人は48.8％。"}, {"t": 1876.9, "x": "満期のほうが多いの？"}, {"t": 1878.35, "x": "もちろん、仮釈放は成績のいい人が選ばれている。"}, {"t": 1881.5166666666667, "x": "だから単純には比べられない。"}, {"t": 1883.4, "x": "それでも国会の議員も、この数字に\n近いものを読み上げている。"}, {"t": 1887.0666666666666, "x": "満期で出た人は5年目に半分が戻る、と。"}, {"t": 1889.9166666666667, "x": "出所したその年に限っても差がある。"}, {"t": 1892.2833333333333, "x": "再び収容された人は、仮出獄者が\n4.0％で満期の人が10.9％だった。"}, {"t": 1898.6333333333334, "x": "それなら仮釈放にも意味があるのね。"}, {"t": 1901.0166666666667, "x": "社会へ戻す仕組みとして、働いていた面はある。"}, {"t": 1904.1, "x": "この事件だけを見て、制度全部を\n否定することはできない。"}, {"t": 1907.5333333333333, "x": "仮出獄の取消率は毎年3.8％から4.8％の間だった。"}, {"t": 1912.9333333333334, "x": "保護観察中の犯罪で処分された人も5.0％だ。"}, {"t": 1916.95, "x": "多くの人はちゃんと終えているのね。"}, {"t": 1919.0333333333333, "x": "ただ、白書はもう1つの数字も出している。"}, {"t": 1921.8, "x": "処分された仮出獄者のうち、66.3％は\n保護観察から6か月以内に再び罪を犯していた。"}, {"t": 1928.8666666666666, "x": "1年以内まで広げると81.3％になる。"}, {"t": 1932.4166666666667, "x": "出てすぐが危ないってこと？"}, {"t": 1934.1666666666667, "x": "白書は、開始から比較的早い\n時期の再犯が多いと書いている。"}, {"t": 1938.1666666666667, "x": "もっとも、仮出獄の期間そのものが\n短いので、割り引いて読む必要はある。"}, {"t": 1942.95, "x": "それでも局長の「1か月や2か月では」という\n言葉と重なる数字だ。"}, {"t": 1947.45, "x": "この事件のあと、見直しの言葉は国会に何度も出た。"}, {"t": 1950.8833333333334, "x": "白書には保護観察官が各地に\n定期的に出向く試みも載っている。"}, {"t": 1955.1333333333334, "x": "全国767の保護区のうち、634で行われていた。"}, {"t": 1959.7333333333333, "x": "ただ、白書自身が\n「端緒を開いた段階」と書いている。"}, {"t": 1963.4, "x": "これが事件の結果だと言える\n資料は見つかっていない。"}, {"t": 1966.3666666666666, "x": "事件の前から進んでいた話もある。"}, {"t": 1969.3666666666666, "x": "1971年5月からの国会の記録で\n「大久保清」を引くと、20件ほどだ。"}, {"t": 1975.3166666666666, "x": "1972年を過ぎると、ほとんど出てこなくなる。"}, {"t": 1978.8333333333333, "x": "次に現れるのは悪い例としての名前だけになる。"}, {"t": 1981.9, "x": "制度の話じゃなくなるのね。"}, {"t": 1983.8333333333333, "x": "2015年の衆議院法務委員会では、\n手記の話の中で出た。"}, {"t": 1987.9333333333334, "x": "有罪が確定した人の本が、\n過去に13点出ているという話だ。"}, {"t": 1992.2166666666667, "x": "男も獄中の手記を出していた。\nその中身は、ここでは読まない。"}, {"t": 1996.2333333333333, "x": "名前だけが残り、仕組みの話は消えていった。"}, {"t": 1999.1666666666667, "x": "読み直して目に留まるのは、兄の訪問のことだ。"}, {"t": 2002.2, "x": "判決文には、1行だけ書かれている。"}, {"t": 2004.75, "x": "国会の長い答弁の、どこにも出てこない。"}, {"t": 2007.5666666666666, "x": "もしあの訴えが通っていたら？"}, {"t": 2009.5166666666667, "x": "そこは言えない。兄の頼みに\n何の根拠があったかも分からない。"}, {"t": 2013.1, "x": "取り消しには、取り消すだけの理由が要る。"}, {"t": 2015.5666666666666, "x": "判決文の順番では、このとき事件はまだ起きていない。"}, {"t": 2019.0166666666667, "x": "残りの刑は、どのみち4月6日で終わる。"}, {"t": 2021.6333333333334, "x": "取り消しても、残りを務めれば外へ出てくる。"}, {"t": 2024.5833333333333, "x": "それでも、お兄さんは行ったのね。"}, {"t": 2026.7, "x": "家族にしか見えないものが、あったのだろう。"}, {"t": 2029.2166666666667, "x": "ただ、これも判決文からの推測にすぎない。"}, {"t": 2032.1666666666667, "x": "保護司は成績がいいと見ていた。"}, {"t": 2034.0666666666666, "x": "刑務所も反則は無いと見ていた。"}, {"t": 2036.15, "x": "親は商売を始めたと信じていた。"}, {"t": 2038.3666666666666, "x": "兄だけが、おそれて保護司の家へ行った。"}, {"t": 2040.8833333333334, "x": "それぞれ別のものを見ていたのね。"}, {"t": 2042.9833333333333, "x": "その全部を1か所に集める\n仕組みは、1971年には無かった。"}, {"t": 2047.5333333333333, "x": "保護観察官は1人で150人を受け持っていた。"}, {"t": 2050.6833333333334, "x": "そして35日がたてば、誰の担当でもなくなった。"}, {"t": 2054.1666666666665, "x": "その外側で、6人が命を奪われている。"}, {"t": 2056.9666666666667, "x": "止めたのは法律でも制度でもなかった。"}, {"t": 2059.35, "x": "自転車置き場に立ち続けた、1人の兄だった。"}, {"t": 2062.5333333333333, "x": "その人の名前は言わないのね。"}, {"t": 2064.516666666667, "x": "家族のことだから、この回でも言わない。"}, {"t": 2066.9666666666667, "x": "上毛新聞の連載には、教え子に\nよく伝えたという人の言葉がある。"}, {"t": 2071.2, "x": "車は密室で、外から中の様子は見えない。"}, {"t": 2074.1666666666665, "x": "知らない人の車には絶対に乗ってはいけない、と。"}, {"t": 2077.266666666667, "x": "事件は土地の記憶になって、今も語られている。"}, {"t": 2080.3, "x": "亡くなった人たちを悼む地蔵には、\n2026年の報道でも多くの花があったという。"}, {"t": 2085.516666666667, "x": "判決から半世紀あまり。"}, {"t": 2087.0666666666666, "x": "今も手を合わせる人がいる。"}, {"t": 2088.8, "x": "3月2日と4月6日。"}, {"t": 2090.5333333333333, "x": "判決の隅の、2つの日付。"}, {"t": 2092.866666666667, "x": "今回はその間の35日と、\nそのあとの34日を読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
