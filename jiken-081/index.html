<script>
const D={"name": "081", "file": "081_編集用", "dur": 1601.6833125, "segs": [], "subs": [{"t": 0.0, "x": "1996年7月7日、日曜日。"}, {"t": 3.0833333333333335, "x": "群馬県太田市のパチンコ店で、\n4歳の女の子が行方が分からなくなった。"}, {"t": 7.8, "x": "名前は、横山ゆかりさん。"}, {"t": 9.616666666666667, "x": "店の出入り口のそばに長椅子があって、\nそこで買ってもらった弁当を食べていた。"}, {"t": 14.216666666666667, "x": "しばらくして家族が長椅子を見ると、\nそこに本人はいなかった。"}, {"t": 17.9, "x": "弁当だけが残っていた。"}, {"t": 19.716666666666665, "x": "いなくなったのは、何時ごろなの。"}, {"t": 21.9, "x": "警察の公表では「午後」としか出ていない。"}, {"t": 24.533333333333335, "x": "私も、そこから先は言わない。"}, {"t": 26.716666666666665, "x": "それから30年がたつ。"}, {"t": 28.233333333333334, "x": "ゆかりさんは、いまも見つかっていない。"}, {"t": 30.5, "x": "この事件には、いま現在も捜査本部がある。"}, {"t": 33.13333333333333, "x": "懸賞金がかけられている。"}, {"t": 34.733333333333334, "x": "警察庁の懸賞広告も、今年出し直されている。"}, {"t": 38.18333333333333, "x": "つまりこれは、終わった事件ではない。"}, {"t": 40.2, "x": "今も動いている事件だ。"}, {"t": 41.81666666666667, "x": "今回はそこを追っていく。"}, {"t": 43.35, "x": "先に、この動画で守ることを言っておく。"}, {"t": 45.833333333333336, "x": "一つ。防犯カメラに映っている\n男を、犯人とは呼ばない。"}, {"t": 49.46666666666667, "x": "警察が公表しているのは\n「重要参考人」という言い方までだ。"}, {"t": 53.6, "x": "二つ。ネットで名前が挙がっている\n人物の名前は、一切出さない。"}, {"t": 57.7, "x": "三つ。ゆかりさんは、まだ\n見つかっていないというだけだ。"}, {"t": 60.9, "x": "私は、それ以上のことを前提にして話さない。"}, {"t": 64.13333333333334, "x": "分かったわ。"}, {"t": 65.1, "x": "話すのは、警察庁と群馬県警が出しているもの、"}, {"t": 68.25, "x": "国会の会議録に残っているもの、\nそして報道されたことだけだ。"}, {"t": 72.98333333333333, "x": "まず、群馬県警のホームページに\n載っている事件の説明を、そのまま読む。"}, {"t": 77.41666666666667, "x": "「この事件は、平成8年7月7日午後、"}, {"t": 80.25, "x": "群馬県太田市内のパチンコ店に家族とともに\n来店していた横山ゆかりちゃん、当時4歳が、"}, {"t": 85.8, "x": "店内で1人遊んでいるうちに\n行方不明となった略取誘拐容疑事件です」"}, {"t": 90.43333333333334, "x": "短いのね。"}, {"t": 91.5, "x": "短い。これが公式の全文だ。"}, {"t": 93.7, "x": "私が今回いちばん大事にしたのは、ここだ。"}, {"t": 96.58333333333333, "x": "この事件は、語られている量に対して、警察が\n確かに出している事実がとても少ない。"}, {"t": 102.01666666666667, "x": "ネットには、いろいろな話が転がっている。"}, {"t": 104.48333333333333, "x": "あの車が、あの人物が、あのときどうだった、と。"}, {"t": 107.91666666666667, "x": "そのほとんどは、警察の発表にも、\n国会の記録にも無い。"}, {"t": 111.75, "x": "だから今回は、逆にした。"}, {"t": 113.66666666666667, "x": "分かっていることだけを、順番に並べる。それが\nどれだけ少ないかを、そのまま見てもらう。"}, {"t": 119.01666666666667, "x": "そのうえで、30年のあいだに国会で\n何が語られてきたかを見ていく。"}, {"t": 123.36666666666666, "x": "国会で、この事件の話が出ているの。"}, {"t": 126.05, "x": "出ている。しかも、一度や\n二度ではない。それが今回の中心だ。"}, {"t": 130.68333333333334, "x": "群馬県警は、一人の男の画像を公開している。"}, {"t": 133.88333333333333, "x": "どういう人物として公開しているのか。\nこれも、そのまま読む。"}, {"t": 137.7, "x": "「ゆかりちゃんが行方不明となる直前に\nパチンコ店店内においてゆかりちゃんに"}, {"t": 141.81666666666666, "x": "声をかけていた男です」"}, {"t": 143.56666666666666, "x": "それだけ。"}, {"t": 144.46666666666667, "x": "それだけだ。「連れ去った男」とは書いていない。"}, {"t": 147.18333333333334, "x": "「犯人」とも書いていない。"}, {"t": 148.83333333333334, "x": "書いてあるのは、いなくなる直前に、\n店の中で、声をかけていた。この三つだけだ。"}, {"t": 154.05, "x": "特徴として出ているのは、身長158センチくらい。"}, {"t": 157.4, "x": "ニッカズボンのようなもの。"}, {"t": 158.81666666666666, "x": "サンダルのようなもの。そしてサングラス。"}, {"t": 161.41666666666666, "x": "報道では、当時30歳から\n50歳くらい、という言い方もされている。"}, {"t": 165.78333333333333, "x": "真夏なのに、その格好なのね。"}, {"t": 168.08333333333334, "x": "7月7日だ。暑い日だった。"}, {"t": 170.26666666666668, "x": "この「季節に合っていない格好」という\n点は、当時から繰り返し指摘されてきた。"}, {"t": 175.23333333333332, "x": "ただ、そこから先は、私は踏み込まない。"}, {"t": 178.05, "x": "服装が変だから犯人だ、という話にしてしまうと、\nそれはもう警察が出していないことになる。"}, {"t": 183.95, "x": "警察が出しているのは、あくまで人相と\n着衣と、声をかけていたという事実だ。"}, {"t": 189.38333333333333, "x": "この事件には、正式な名前がある。"}, {"t": 191.75, "x": "「太田市高林東町地内パチンコ店に\nおける幼女略取誘拐容疑事件」。"}, {"t": 196.45, "x": "長いわね。"}, {"t": 197.4, "x": "長い。だが、この名前が重要だ。"}, {"t": 199.68333333333334, "x": "これは警察庁が付けた、懸賞広告の対象事件名だ。"}, {"t": 203.43333333333334, "x": "警察庁のホームページに、今も載っている。"}, {"t": 205.95, "x": "今年、令和8年7月1日付けのものだ。"}, {"t": 208.96666666666667, "x": "署名しているのは警察庁長官の楠芳伸長官。"}, {"t": 212.65, "x": "そして、情報を受け付ける部署も書いてある。"}, {"t": 215.26666666666668, "x": "群馬県太田警察署の中にある、「\n太田市高林地内パチンコ店における\n幼女略取誘拐容疑事件捜査本部」。"}, {"t": 222.25, "x": "捜査本部が、まだあるのね。"}, {"t": 224.23333333333332, "x": "ある。30年たって、まだある。"}, {"t": 226.4, "x": "もう一つ、名前について言っておきたいことがある。"}, {"t": 229.3, "x": "この事件名に入っているのは\n「略取誘拐」だ。殺人ではない。"}, {"t": 233.41666666666666, "x": "ここは後で、時効の話に\n関わってくるので覚えておいてほしい。"}, {"t": 237.16666666666666, "x": "警察は、ゆかりさんが連れ去られた疑いで\n捜査している。そして、亡くなったとは、"}, {"t": 242.05, "x": "どこにも書いていない。"}, {"t": 244.01666666666668, "x": "この事件には懸賞金がかかっている。"}, {"t": 246.21666666666667, "x": "上限で700万円だ。"}, {"t": 247.95, "x": "ただ、これは一つの財布から出るわけではない。"}, {"t": 250.56666666666666, "x": "二つに分かれている。"}, {"t": 251.98333333333332, "x": "一つは、警察庁の捜査特別報奨金。"}, {"t": 254.76666666666668, "x": "上限300万円。国が出す。"}, {"t": 257.01666666666665, "x": "もう一つは、太田遊技業防犯協会からの私的謝礼金。\n上限400万円。"}, {"t": 262.1, "x": "地元の業界が出しているのね。"}, {"t": 264.2, "x": "そうだ。パチンコ店の防犯協会が、\n自分たちで400万円を用意している。"}, {"t": 268.9, "x": "国が出すほうの制度についても、\n少しだけ説明しておく。"}, {"t": 272.51666666666665, "x": "捜査特別報奨金というのは、民法の懸賞広告の規定に\n基づいて、警察庁長官が広告を出す制度だ。"}, {"t": 279.6, "x": "対象になるのは、殺人、強盗、\n放火、そして略取誘拐など、"}, {"t": 283.85, "x": "被害者の生命や身体に重大な損害を及ぼした事件。"}, {"t": 287.46666666666664, "x": "しかも、捜査本部が開かれている\n事件であることが条件になっている。"}, {"t": 291.65, "x": "上限は原則300万円。"}, {"t": 293.4, "x": "特に必要があるときは、1,000万円を\n超えない範囲で増やすことができる。"}, {"t": 297.8666666666667, "x": "応募できる期間は、原則1年だ。"}, {"t": 300.26666666666665, "x": "この事件の場合、今の広告は\n令和8年7月1日から、令和9年6月30日まで。"}, {"t": 306.45, "x": "毎年、出し直しているということかしら。"}, {"t": 309.1333333333333, "x": "そういうことだ。1年ごとに更新されている。\nそれがもう、何年も続いている。"}, {"t": 314.55, "x": "捜査の体制がどうだったのか。これは\n国会の答弁にはっきり残っている。"}, {"t": 318.9, "x": "2015年7月6日、参議院の行政監視委員会。"}, {"t": 322.4166666666667, "x": "警察庁長官官房審議官の露木康浩審議官が\n答えている。"}, {"t": 326.76666666666665, "x": "「群馬県警察におきましては、発生後直ちに\n150名体制で捜査を開始をいたしております」"}, {"t": 332.5833333333333, "x": "「現在も40名体制の捜査本部を\n維持して捜査に当たっている」"}, {"t": 336.55, "x": "最初は150人だったのね。"}, {"t": 338.6333333333333, "x": "150人だ。"}, {"t": 339.73333333333335, "x": "4歳の子が、真昼の店から、家族のすぐそばで消えた。"}, {"t": 343.26666666666665, "x": "警察は総がかりで動いた。"}, {"t": 345.1, "x": "それでも見つからなかった。"}, {"t": 346.73333333333335, "x": "そして19年たった時点で、まだ\n40人の捜査本部が置かれていた。"}, {"t": 351.1, "x": "報道によれば、30年目の今も、42人の体制だという。"}, {"t": 355.28333333333336, "x": "減っていないの。"}, {"t": 356.4166666666667, "x": "減っていない。むしろ、\nこの種の未解決事件としては珍しい数字だ。"}, {"t": 360.68333333333334, "x": "2011年の答弁では、群馬県警と栃木県警を合わせて\n約20名の専従体制、という説明もされている。"}, {"t": 367.71666666666664, "x": "数え方が違うので単純には比べられないが、専従で\n張り付いている人がずっといる、ということだ。"}, {"t": 374.1666666666667, "x": "ここが、この事件でいちばん誤解されているところだ。"}, {"t": 377.25, "x": "よく「この事件は時効がない」と言われる。だが、\n警察庁の答え方は、そうではない。"}, {"t": 382.5833333333333, "x": "2011年5月16日、参議院の行政監視委員会。"}, {"t": 386.35, "x": "風間直樹議員が、まっすぐに聞いている。"}, {"t": 388.95, "x": "「この事件は、刑事局長、"}, {"t": 390.6333333333333, "x": "今年で15年目をちょうど迎えるわけですが、"}, {"t": 393.1666666666667, "x": "時効になっているんでしょうか、\nそれとも時効でないのでしょうか」"}, {"t": 396.68333333333334, "x": "答えたのは、\n警察庁刑事局長の金高雅仁刑事局長だ。読む。"}, {"t": 401.46666666666664, "x": "「この事件につきましては、"}, {"t": 402.95, "x": "被害者が発見に至っていないという\n状況でございまして、したがって、"}, {"t": 407.0, "x": "既に時効になったかどうかという\n判断は非常に困難なんでございます」"}, {"t": 411.3, "x": "判断が、難しい。"}, {"t": 412.9166666666667, "x": "そう言っている。時効ではない、とは言っていない。"}, {"t": 415.6166666666667, "x": "そして、こう続けた。"}, {"t": 417.1333333333333, "x": "「ただ、私どもといたしましては、"}, {"t": 419.1666666666667, "x": "あらゆる可能性を考慮して\n捜査を続けているということでございまして、"}, {"t": 423.0, "x": "時効で捜査を中断するということなく\n捜査を続けてまいりたいと考えております」"}, {"t": 427.76666666666665, "x": "風間議員が、念を押す。"}, {"t": 429.31666666666666, "x": "「発見されていない。したがって、\n時効でないということでよろしいですね」"}, {"t": 433.51666666666665, "x": "金高刑事局長は答えた。"}, {"t": 435.4, "x": "「そういう認識で捜査をしております」"}, {"t": 437.76666666666665, "x": "ぎりぎりの言い方ね。"}, {"t": 439.18333333333334, "x": "ぎりぎりだ。だが、そこが誠実だと私は思う。"}, {"t": 442.3333333333333, "x": "断定できないことを、断定できないまま\n言っている。そして、"}, {"t": 445.75, "x": "断定できないから止める、とは言っていない。"}, {"t": 448.3833333333333, "x": "ここで、制度の話も一つしておく。"}, {"t": 450.8833333333333, "x": "2010年に、日本の公訴時効の仕組みが\n大きく変わった。"}, {"t": 454.3833333333333, "x": "人を死亡させた重い罪について、時効が廃止された。"}, {"t": 458.01666666666665, "x": "じゃあ、この事件も。"}, {"t": 459.45, "x": "ここが違う。この事件の罪名は「略取誘拐」だ。"}, {"t": 462.76666666666665, "x": "時効が無くなったのは、人を死亡させた\n罪のほうで、略取誘拐は対象に入っていない。"}, {"t": 468.26666666666665, "x": "つまり、あの改正はこの事件には届いていない。"}, {"t": 471.1, "x": "それでも捜査が続いているのは、\nさっきの答弁の理屈による。"}, {"t": 474.76666666666665, "x": "連れ去られた状態が終わったと言えないうちは、\nいつから時効を数えるのかが決まらない。"}, {"t": 479.53333333333336, "x": "法律の話としては、頼りない\n足場に見えるかもしれない。"}, {"t": 483.1666666666667, "x": "見つかっていないことが、\n捜査を続ける理由になっているのね。"}, {"t": 486.8666666666667, "x": "皮肉な言い方をすれば、そうなる。だが現実には、\nこの足場の上に、30年ぶんの捜査が乗っている。"}, {"t": 493.71666666666664, "x": "ここから、この事件が「単独の事件」として\n語られていない理由に入る。"}, {"t": 498.28333333333336, "x": "2026年5月8日、衆議院の法務委員会。"}, {"t": 501.46666666666664, "x": "警察庁長官官房審議官の遠藤剛審議官が、\n五つの事件を順番に読み上げている。"}, {"t": 507.31666666666666, "x": "警察庁自身が「\nいわゆる北関東連続幼女誘拐殺人事件及び\n誘拐容疑事件」と呼んだうえで、こう述べた。"}, {"t": 514.4, "x": "一件目。福島万弥ちゃん事件。"}, {"t": 516.6833333333333, "x": "当時5歳。昭和54年8月3日、\n栃木県足利市内の神社付近で所在不明。"}, {"t": 522.1666666666666, "x": "同月9日、同市内の渡良瀬川河川敷内で\n御遺体が発見された。"}, {"t": 526.9666666666667, "x": "二件目。長谷部有美ちゃん事件。"}, {"t": 528.8, "x": "当時5歳。昭和59年11月17日、\n足利市内のパチンコ店付近で所在不明。"}, {"t": 534.6333333333333, "x": "昭和61年3月7日、同市内の畑で御遺体が発見された。"}, {"t": 539.3666666666667, "x": "三件目。大沢朋子ちゃん事件。"}, {"t": 541.45, "x": "当時8歳。昭和62年9月15日、\n群馬県太田市内の公園付近で所在不明。"}, {"t": 547.0, "x": "翌63年11月27日、同市内の利根川河川敷内で\n御遺体が発見された。"}, {"t": 553.0666666666667, "x": "四件目。松田真実ちゃん事件。"}, {"t": 555.1166666666667, "x": "当時4歳。平成2年5月12日、\n足利市内のパチンコ店付近で所在不明。"}, {"t": 560.35, "x": "翌13日、渡良瀬川河川敷内で御遺体が発見された。"}, {"t": 564.55, "x": "五件目。横山ゆかりちゃん事件。"}, {"t": 566.6, "x": "当時4歳。平成8年7月7日、\n太田市内のパチンコ店付近で\n所在不明。そして、現在も所在不明。"}, {"t": 573.9166666666666, "x": "……最後だけ、終わり方が違うのね。"}, {"t": 576.2333333333333, "x": "違う。四人は見つかった。"}, {"t": 577.85, "x": "ゆかりさんだけ、まだ見つかっていない。"}, {"t": 580.2166666666667, "x": "この読み上げは、2011年にも、\nほぼ同じ言葉で行われている。"}, {"t": 584.2833333333333, "x": "15年たっても、警察庁が言えることは変わっていない。"}, {"t": 588.3, "x": "では、警察庁はこの五つを\n同じ犯人の仕業だと考えているのか。"}, {"t": 592.5333333333333, "x": "ここは非常に慎重な言い方がされている。"}, {"t": 595.0166666666667, "x": "2011年3月8日、参議院の予算委員会で、"}, {"t": 598.3333333333334, "x": "当時の国家公安委員長だった\n中野寛成国家公安委員長が答弁した。"}, {"t": 602.9833333333333, "x": "五つの事件は同一犯の可能性を\n否定できない、という趣旨だ。"}, {"t": 606.8333333333334, "x": "その4年後、2015年の行政監視委員会で、\n露木審議官が同じことを言い直している。"}, {"t": 612.5666666666667, "x": "「いずれも幼女を対象とする\n誘拐容疑あるいは誘拐殺人といった事案でございます」"}, {"t": 617.2666666666667, "x": "「また、行方不明になった場所などが\n近接をしているということもございまして、"}, {"t": 621.5666666666667, "x": "同一犯による犯行の可能性は\n否定できないと考えております」"}, {"t": 625.6833333333333, "x": "「否定できない」なのね。"}, {"t": 627.0666666666667, "x": "「そうだ」ではなくて。"}, {"t": 628.65, "x": "そこが大事だ。私も、そこから先には行かない。"}, {"t": 631.9333333333333, "x": "そして、今年だ。2026年5月8日、\n遠藤審議官が、もう一度同じ言い方をした。"}, {"t": 637.9166666666666, "x": "「同一犯による犯行の可能性は"}, {"t": 639.95, "x": "否定できないと考えているという\n趣旨の答弁があったかと\n思いますが、その点については今も"}, {"t": 644.9333333333333, "x": "変わっておりません」"}, {"t": 646.05, "x": "2011年、2015年、2026年。"}, {"t": 649.1333333333333, "x": "15年にわたって、国はこの一文を言い続けている。"}, {"t": 652.5333333333333, "x": "強めもしないし、引っ込めもしない。"}, {"t": 654.75, "x": "この「変わっていない」という\n事実そのものが、一つの情報だと私は思う。"}, {"t": 660.05, "x": "断定しない、ということがどれだけ徹底されているか。"}, {"t": 663.05, "x": "分かりやすい例が国会に残っている。"}, {"t": 665.4333333333333, "x": "2011年10月27日、参議院の法務委員会。"}, {"t": 669.0333333333333, "x": "有田芳生議員が、ある新聞記事を取り上げた。"}, {"t": 672.05, "x": "その年の8月25日、産経新聞の群馬版に、\nこういう記事が出た。"}, {"t": 676.8166666666667, "x": "ゆかりさん事件の防犯ビデオに\n映っていた男と、別の事件で目撃された\n不審な人物は、同一人物ではない。"}, {"t": 683.6666666666666, "x": "群馬県警太田署の捜査本部が\nそう断定した、という内容だ。"}, {"t": 687.7333333333333, "x": "断定した、と書かれたのね。"}, {"t": 689.7666666666667, "x": "そうだ。有田議員は、それは国会答弁と\n食い違うのではないか、と質した。"}, {"t": 694.5, "x": "答えたのは、\n警察庁刑事局長の舟本馨刑事局長。読む。"}, {"t": 698.9666666666667, "x": "「その記事が出ましてから\n群馬県警に確認をいたしました」"}, {"t": 702.4333333333333, "x": "「群馬県警は、\n横山ゆかりちゃん事件のビデオの不審者と"}, {"t": 705.9, "x": "松田真実ちゃん事件で"}, {"t": 707.1833333333333, "x": "目撃された不審者が別人であると\n断定したという事実はない、という\nふうに私どもに答えてきております」"}, {"t": 713.4833333333333, "x": "断定していない、ということを、\nわざわざ確認したのね。"}, {"t": 717.0166666666667, "x": "した。そしてこう続けている。"}, {"t": 718.95, "x": "「群馬県警におきましては、予断を持つことなく、"}, {"t": 721.8333333333334, "x": "他事件との関連も視野に入れながら\n現在捜査を進めている」"}, {"t": 725.5, "x": "予断を持たない。つまり、\n同じだとも、違うとも決めない。"}, {"t": 729.05, "x": "30年たっても、この姿勢は崩していない。"}, {"t": 731.7, "x": "私がこの回で同じことをしているのは、そのためだ。"}, {"t": 735.6833333333333, "x": "2011年、この五つの事件で、\nひとつ大きな動きがあった。"}, {"t": 739.7166666666667, "x": "それまで、五つの家族はばらばらだった。"}, {"t": 742.25, "x": "有田議員は、国会でこう語っている。\nそれぞれの家族が、ずっと孤立していた、と。"}, {"t": 747.4, "x": "自分が悪かったのではないか。"}, {"t": 749.0833333333334, "x": "あのとき連れて行かなければよかったのではないか。\nそう思いながら、夫婦で、家族で、"}, {"t": 753.9333333333333, "x": "じっと耐えてきた。"}, {"t": 755.3, "x": "自分を責めてしまうのね。"}, {"t": 757.0, "x": "責めてしまう。これは、この回で\nいちばん忘れてはいけないところだ。"}, {"t": 760.8166666666667, "x": "転機になったのは、\n2011年3月8日の予算委員会だった。"}, {"t": 765.0166666666667, "x": "その質疑を、ゆかりさんのお父さんが見ていた。"}, {"t": 767.7666666666667, "x": "国会でここまで言ってくれるのなら、家族が\n黙っているわけにはいかない。そう思ったという。"}, {"t": 772.95, "x": "そこから話が動いて、その年の春、\n五つの家族が足利市で初めて一堂に会した。"}, {"t": 778.6333333333333, "x": "そして、足利・\n太田連続未解決事件家族会が結成された。"}, {"t": 783.0166666666667, "x": "同じ年の7月14日、中野前国家公安委員長が、\nその家族会と会っている。"}, {"t": 788.35, "x": "このときのやり取りも、\n国会答弁として記録に残っている。"}, {"t": 792.6666666666666, "x": "舟本刑事局長の答弁を読む。"}, {"t": 794.8833333333333, "x": "「御家族の皆様方から、五事件については"}, {"t": 797.7166666666667, "x": "同一犯による連続事件を考慮した捜査を\nお願いしたい、また時効となった事件についても"}, {"t": 802.4333333333333, "x": "再捜査をお願いしたい旨の御要望がなされました」"}, {"t": 805.6833333333333, "x": "家族が求めたのは、この二つだった。"}, {"t": 808.3166666666667, "x": "時効になった事件も、もう一度、ということね。"}, {"t": 811.4333333333333, "x": "そうだ。そして、答えはこうだった。"}, {"t": 813.7666666666667, "x": "「中野前国家公安委員会委員長からは、"}, {"t": 816.1666666666666, "x": "四事件が時効となってしまっていることや捜査が\n長引いていることについて心からおわびを申し上げ」"}, {"t": 821.85, "x": "「引き続き他の事件との関連性も視野に入れ、"}, {"t": 824.6166666666667, "x": "時効の成立していない横山ゆかりちゃん事件の解決に"}, {"t": 828.0, "x": "向け全力で事件解決を図るよう警察を\n督励する旨の御発言があった」"}, {"t": 832.5666666666667, "x": "役所の答弁で「心からおわびを申し上げ」という\n言葉が出てくることは、そう多くない。"}, {"t": 837.85, "x": "四つの事件が時効になった。\nそれについて、国の側が家族に謝っている。"}, {"t": 842.5666666666667, "x": "そのうえで、まだ時効になっていない\nゆかりさんの事件に、望みをつないでいる。"}, {"t": 847.0666666666667, "x": "残っているのが、その一つだけだから。"}, {"t": 849.7, "x": "そういうことだ。"}, {"t": 851.35, "x": "同じ委員会で、舟本刑事局長はこう言っている。"}, {"t": 854.5333333333333, "x": "「時効の壁という厳然たる事実はございますけれども、"}, {"t": 857.55, "x": "一方でまだ公訴時効の期間が経過していない\n現在群馬県警が捜査しております横山"}, {"t": 862.7833333333333, "x": "ゆかりちゃん事件、これを何とか言わば\n突破口としながら、全容の解明に\n今後とも努めてまいりたい」"}, {"t": 868.6833333333333, "x": "突破口。"}, {"t": 869.5666666666667, "x": "この言葉を、私は何度か読み返した。"}, {"t": 872.2, "x": "捜査の側から見れば、正しい言葉だと思う。"}, {"t": 874.8666666666667, "x": "四つは時効になった。"}, {"t": 876.25, "x": "手が出せるのは、この一つだけだ。"}, {"t": 878.55, "x": "だが、ゆかりさんのご家族の側から見たら、\nどう聞こえるだろう。"}, {"t": 882.2666666666667, "x": "自分の娘の事件が、他の事件を\n解くための入り口として語られている。"}, {"t": 886.8, "x": "私はこの言葉を、非難したいわけではない。"}, {"t": 889.55, "x": "ただ、事件が長くなるというのは、\nこういうことなのだと思った。"}, {"t": 893.3666666666667, "x": "一人の子どもがいなくなったという\n話が、いつのまにか、制度の話や、\n他の事件の話の中に置かれていく。"}, {"t": 900.3166666666667, "x": "そして、2026年の答弁でも、\n言い方はほとんど同じだった。"}, {"t": 904.6, "x": "「横山ゆかりちゃん事件の捜査を中心として、\nその事案の解明について捜査を進めている」"}, {"t": 910.0833333333334, "x": "15年たっても、この事件はまだ\n「中心」に置かれたままだ。"}, {"t": 914.5833333333334, "x": "ここからは、扱いにいちばん\n気をつけなければならない部分だ。"}, {"t": 918.1833333333333, "x": "2026年5月8日の法務委員会で、\n有田議員はある話を持ち出した。"}, {"t": 922.9666666666667, "x": "五つの事件のうちの一つ、足利事件で\n目撃されていた不審な人物について、"}, {"t": 927.95, "x": "DNA型の鑑定が行われたという話だ。"}, {"t": 931.0333333333333, "x": "有田議員は、こう述べている。"}, {"t": 932.7666666666667, "x": "当時、菅家利和さんのDNA型鑑定も\n行った筑波大学の先生が鑑定を行い、"}, {"t": 938.0833333333334, "x": "STR法で三十数か所のDNA型が一致した。"}, {"t": 941.4333333333333, "x": "今の鑑定でいえば、四兆七千億人に\n一人という結果が出た。"}, {"t": 945.6666666666666, "x": "さらに、2011年の段階でその鑑定結果が\n最高検に届けられている、とも述べた。"}, {"t": 951.3833333333333, "x": "それは、本当のことなの。"}, {"t": 953.2833333333333, "x": "ここが大事だ。私は「本当だ」とは言わない。"}, {"t": 956.4333333333333, "x": "この話に対して、警察庁の遠藤審議官が\n答えたのは、二回とも同じ言葉だった。"}, {"t": 961.9833333333333, "x": "「個別の事件につきましての具体的な\n中身については、お答えを\n差し控えさせていただきたいと思います」"}, {"t": 968.15, "x": "肯定もしていない。否定もしていない。"}, {"t": 970.45, "x": "だから、この動画で言えることはここまでだ。"}, {"t": 972.9666666666667, "x": "国会でそういう発言があった。そして、国は\n答えなかった。それが記録に残っている。"}, {"t": 978.3666666666667, "x": "この話を「犯人が分かっている」という\n意味に読み替えることは、私はしない。"}, {"t": 983.7, "x": "五つの事件のうち、一つだけは一度\n「解決した」ことになっていた。"}, {"t": 988.2333333333333, "x": "1990年の松田真実ちゃん事件。いわゆる足利事件だ。"}, {"t": 992.4333333333333, "x": "菅家利和さんが逮捕され、有罪となり、\nのちに無罪が確定した。冤罪だった。"}, {"t": 997.7, "x": "経緯も、国会で説明されている。"}, {"t": 999.8, "x": "露木審議官の答弁だ。"}, {"t": 1001.55, "x": "現場に遺留されていた被害者の半袖のシャツに\n付着していた資料から抽出されたDNA型と、"}, {"t": 1007.2, "x": "菅家さんのDNA型が、当時のMCT\n118型検査で一致した。"}, {"t": 1012.0166666666667, "x": "それに自白が加わり、逮捕、起訴された。"}, {"t": 1014.8, "x": "その後、再審で、新しいSTR型検査法によって、\n両者のDNA型は一致しないことが明らかになる。"}, {"t": 1021.7333333333333, "x": "平成22年3月、無罪判決が言い渡され、確定した。"}, {"t": 1025.9833333333333, "x": "鑑定の技術が変わったのね。"}, {"t": 1027.9666666666667, "x": "変わった。ただし警察庁は、\n慎重な言い方をしている。"}, {"t": 1031.5, "x": "問題があったとされたのは、\n当時の鑑定人の鑑定手法であって、"}, {"t": 1035.3666666666666, "x": "MCT118型検査法そのものに\n信頼性がないとされたわけではない、と。"}, {"t": 1040.35, "x": "私がここで言いたいのは、冤罪の是非ではない。"}, {"t": 1043.2, "x": "一人が犯人だとされていた間、他の可能性は\n追われなかった、ということだ。"}, {"t": 1047.95, "x": "そして、その間に時が過ぎた。"}, {"t": 1049.9666666666667, "x": "ゆかりさんがいなくなったのは、その6年後だ。"}, {"t": 1053.5166666666667, "x": "2015年の委員会で、有田議員が\n捜査のやり方そのものに切り込んでいる。"}, {"t": 1058.1333333333334, "x": "19年たって、あの防犯カメラの映像が\nいまだに手がかりにならない。"}, {"t": 1062.1, "x": "映像を広げることだけに\n集中してよかったのか、という問いだ。"}, {"t": 1065.9666666666667, "x": "厳しい質問ね。"}, {"t": 1067.3333333333333, "x": "厳しい。露木審議官は、こう答えている。"}, {"t": 1070.0666666666666, "x": "「この防犯カメラの映像が重要な有力な"}, {"t": 1072.6, "x": "証拠であるということから、そのような広報などにも\n努めているところでございますけれども」"}, {"t": 1077.4666666666667, "x": "「当然のことながら発生当初から\n聞き込み捜査なども行っております」"}, {"t": 1081.4333333333334, "x": "「また、周辺の関連事件などの容疑者などについても\nその関連性などを捜査するといったようなことで、"}, {"t": 1087.2833333333333, "x": "総合的な捜査を現在に至るまで推進しております」"}, {"t": 1090.7166666666667, "x": "映像だけではない、という答えだ。"}, {"t": 1092.75, "x": "ただ、外から見えるのは、やはりあの画像だけだ。"}, {"t": 1095.8166666666666, "x": "それは警察が隠しているからではなくて、\n外に出せるものがそれしかないからだと思う。"}, {"t": 1100.95, "x": "情報提供を呼びかけるには、見せられるものが要る。"}, {"t": 1103.95, "x": "この事件で見せられるものは、\nあの数枚の画像と、ゆかりさんの写真しかない。"}, {"t": 1109.1666666666667, "x": "情報提供が、どれくらい寄せられてきたのか。"}, {"t": 1112.0, "x": "2015年の答弁では、こう説明されている。"}, {"t": 1114.9833333333333, "x": "「今もなお情報はかなり寄せられてきております。"}, {"t": 1117.5166666666667, "x": "月に十数件から数十件ほど\n情報が寄せられてきております」"}, {"t": 1121.4166666666667, "x": "19年たった時点でも、毎月それだけ届いていた。"}, {"t": 1124.8333333333333, "x": "報道によれば、累計は2025年5月時点で5,765件。"}, {"t": 1129.3833333333334, "x": "2025年の年末までで5,875件。"}, {"t": 1132.7166666666667, "x": "2026年5月の時点で5,927件。"}, {"t": 1136.4333333333334, "x": "6,000件近いのね。"}, {"t": 1138.0, "x": "近い。ただし、増え方は落ちている。"}, {"t": 1140.3166666666666, "x": "報道では、近年は年に100件程度だという。"}, {"t": 1143.2, "x": "最初の19年で5,000件を超え、\nそこからの10年ほどで1,000件に届かない。"}, {"t": 1147.8833333333334, "x": "これが「風化」と\n呼ばれているものの、数字での姿だ。"}, {"t": 1151.4666666666667, "x": "一方で、警察の側は逆に動いている。"}, {"t": 1154.05, "x": "2011年に舟本刑事局長はこう言っている。"}, {"t": 1157.05, "x": "「今も多くの情報が寄せられておりますので、"}, {"t": 1159.45, "x": "群馬県警はもとより、関係警察が連携を\n取りながら、一体となった捜査を進めてまいりたい」"}, {"t": 1165.3333333333333, "x": "情報が減っても、体制は40人のままだ。"}, {"t": 1168.8166666666666, "x": "群馬県警は、この30年、\n呼びかけのやり方を変え続けている。"}, {"t": 1172.9333333333334, "x": "2015年の答弁に出てくるのは、\nチラシとポケットティッシュだ。"}, {"t": 1176.5666666666666, "x": "重要参考人の特徴を書いて、配る。"}, {"t": 1179.3166666666666, "x": "2021年、25年の節目には、あらためて\n店内の映像を公開している。"}, {"t": 1184.3166666666666, "x": "2023年、27年目には、その男の映像を\n鮮明化したものを公開した。"}, {"t": 1189.7333333333333, "x": "画像を、きれいにし直したのね。"}, {"t": 1191.85, "x": "そうだ。撮られた映像は\n変わらないが、見せ方は技術で変えられる。"}, {"t": 1195.7333333333333, "x": "2025年には、ケーブルテレビと組んでCMを作った。"}, {"t": 1199.1166666666666, "x": "撮影は太田署で行われている。"}, {"t": 1201.2666666666667, "x": "そして今年、2026年7月1日。"}, {"t": 1204.2333333333333, "x": "県警は約20秒のショート動画を公開した。"}, {"t": 1207.1, "x": "ショート動画を作ったのは、これが\n初めてだという。それまでは約4分の動画だった。"}, {"t": 1212.0333333333333, "x": "中身は、重要参考人の男とゆかりさんの写真、\nそれに身体的な特徴をまとめたものだ。"}, {"t": 1217.85, "x": "公開の場所は、県警の公式YouTube。"}, {"t": 1220.5166666666667, "x": "さらに、7月末までYouTubeの広告としても流された。"}, {"t": 1224.1166666666666, "x": "届け先は、主に茨城、栃木、群馬に住んでいる人だ。"}, {"t": 1228.15, "x": "見てもらう相手を、絞ったのね。"}, {"t": 1230.2833333333333, "x": "絞った。30年前、この人を見たかもしれない\n人がいるとしたら、そこにいる可能性が高い。"}, {"t": 1236.75, "x": "2026年7月5日、太田市のイオンモール太田で、\n呼びかけが行われた。"}, {"t": 1241.7666666666667, "x": "参加したのは、太田署員や\n太田遊技業防犯協力会など、およそ50人。"}, {"t": 1246.4333333333334, "x": "配られたのは、チラシの入った\nポケットティッシュ、およそ3千個。"}, {"t": 1250.2833333333333, "x": "そのチラシには、重要参考人の特徴と\n一緒に、こう書かれていた。"}, {"t": 1254.5333333333333, "x": "「あなたの記憶いま届けて」"}, {"t": 1256.3, "x": "……記憶、なのね。証拠ではなくて。"}, {"t": 1258.6833333333334, "x": "そこだと思う。"}, {"t": 1259.6833333333334, "x": "30年前のことだ。証拠を持っている\n人は、もうほとんどいない。"}, {"t": 1263.65, "x": "残っているのは、人の記憶だけだ。"}, {"t": 1265.9833333333333, "x": "あのとき、あの店で、あんな格好の人を見た。\nそういう程度のことでいい、という呼びかけだ。"}, {"t": 1271.4, "x": "ちなみに、この配布は今年が初めてではない。"}, {"t": 1274.2166666666667, "x": "2019年、23年の節目にも、"}, {"t": 1276.8, "x": "市内のショッピングモールでチラシと\nポケットティッシュが約2,000部配られている。"}, {"t": 1281.1166666666666, "x": "そのときの太田署長は、こう言っている。"}, {"t": 1283.2833333333333, "x": "「無事発見されるまで、今後も\n広報活動を続けていくつもりだ」"}, {"t": 1287.2666666666667, "x": "無事発見されるまで。この言い方も、\nずっと変わっていない。"}, {"t": 1291.4166666666667, "x": "ゆかりさんのお父さんは、横山保雄さんという。"}, {"t": 1294.3, "x": "節目ごとに、言葉を出している。順番に読む。"}, {"t": 1297.3, "x": "2019年、23年のとき。"}, {"t": 1299.5333333333333, "x": "「ゆかりは無事に帰ってくる。"}, {"t": 1301.0666666666666, "x": "見つかるまでは絶対に諦めない」"}, {"t": 1303.2333333333333, "x": "2021年、25年のとき。"}, {"t": 1305.45, "x": "「私が見つけ出すまで、\n病気にかからないでいてほしい。"}, {"t": 1308.6166666666666, "x": "再会したときに、元気な姿を見せてほしい。"}, {"t": 1311.4666666666667, "x": "娘を返してください」"}, {"t": 1313.1666666666667, "x": "……病気にかからないでいてほしい。"}, {"t": 1315.0666666666666, "x": "生きている前提で語っている。"}, {"t": 1316.8666666666666, "x": "同じときに、こうも言っている。"}, {"t": 1318.7333333333333, "x": "「一緒に過ごした時間よりも、娘を捜してきた\n時間の方が圧倒的に長かったと思うと、やるせない」"}, {"t": 1324.9333333333334, "x": "一緒にいたのは4年だ。"}, {"t": 1326.25, "x": "捜している時間は、その6倍を超えた。"}, {"t": 1328.9, "x": "そして今年、30年。"}, {"t": 1330.5, "x": "保雄さんは59歳になった。"}, {"t": 1332.45, "x": "県警を通じて、こうコメントしている。"}, {"t": 1334.9333333333334, "x": "「いまだにゆかりが見つかっていないことは\n残念という気持ちだ。"}, {"t": 1338.15, "x": "早く見つかってほしい」"}, {"t": 1339.65, "x": "2026年5月の国会でも、有田議員が\nご両親のことに触れている。"}, {"t": 1344.2, "x": "事件が起きた7月7日になると、\n今でも泣いている、と。"}, {"t": 1347.9666666666667, "x": "毎年、その日が来るのね。"}, {"t": 1350.45, "x": "ここで一つ、報道ではなく\n取材の記録から引かせてほしい。"}, {"t": 1353.9666666666667, "x": "断っておくが、これは警察の発表ではない。"}, {"t": 1357.0, "x": "この事件を長く取材している\nジャーナリストの清水潔記者が、\n30年にあたって書いた文章がある。"}, {"t": 1363.0, "x": "そこに、当日のことが書かれている。"}, {"t": 1365.3166666666666, "x": "7月7日は日曜日だった。"}, {"t": 1367.1833333333334, "x": "ご両親は「七夕感謝デー」のチラシを見て、\n開店直後にその店へ行った。"}, {"t": 1372.15, "x": "ゆかりさんが「お腹が空いた」と\n言ったので、お母さんが弁当を買った。"}, {"t": 1376.3, "x": "出入り口のそばの長椅子に座らせて、食べさせた。"}, {"t": 1379.4333333333334, "x": "そのとき、近くに男がいたことを、\nお母さんは覚えているという。"}, {"t": 1383.1333333333334, "x": "左手でタバコを吸っていた。"}, {"t": 1385.0333333333333, "x": "白っぽいTシャツ。だぼっとしたズボン。"}, {"t": 1387.1666666666667, "x": "短い上着のようなもの。"}, {"t": 1388.9666666666667, "x": "覚えているのね、30年たっても。"}, {"t": 1391.3666666666666, "x": "覚えている。"}, {"t": 1392.1666666666667, "x": "そしてお母さんは、ゆかりさんが\n自分のところへ来たとき、\n誰かのことを話したのを覚えている。"}, {"t": 1397.6333333333334, "x": "「ついて行っちゃいけないよ」と、注意している。"}, {"t": 1400.1666666666667, "x": "そのあと、お父さんが長椅子を見ると、\n弁当だけが残っていた。"}, {"t": 1404.0666666666666, "x": "清水記者は、ご両親が30年近く\n自分たちを責め続けていると書いている。"}, {"t": 1408.7666666666667, "x": "もう一つ、書かれていることがある。"}, {"t": 1410.9, "x": "横山さんの家の棚の上には、花火が置いてある。"}, {"t": 1413.8, "x": "ゆかりさんの帰りを待って、取ってあるものだ。"}, {"t": 1416.55, "x": "「どれか1本ぐらいつくと信じて、\n帰りを待っているんです」"}, {"t": 1420.55, "x": "2026年6月29日、群馬県警は\n太田署で捜査会議を開いた。"}, {"t": 1425.4833333333333, "x": "報道によれば、捜査員25人が参加し、\n現状と今後の方針を確かめたという。"}, {"t": 1430.6833333333334, "x": "捜査本部の人数は42人。"}, {"t": 1432.6, "x": "県警の側は、これまでの資料を新しい\n視点で見直す、という趣旨を述べている。"}, {"t": 1437.45, "x": "新しい視点、って何かしら。"}, {"t": 1439.4666666666667, "x": "そこは公表されていない。"}, {"t": 1440.85, "x": "私も、想像で埋めない。"}, {"t": 1442.6833333333334, "x": "ただ、一つだけ言えることがある。"}, {"t": 1444.75, "x": "この30年で、変わったものがある。"}, {"t": 1446.8666666666666, "x": "防犯カメラの映像を解析する技術だ。"}, {"t": 1449.5, "x": "2023年に鮮明化された画像が出せたのは、\nその技術が進んだからだ。"}, {"t": 1454.35, "x": "そして、足利事件で無罪が確定したのも、\nDNA型の鑑定手法が変わったからだった。"}, {"t": 1460.1166666666666, "x": "この事件は二度、技術の進歩に助けられている。"}, {"t": 1463.1666666666667, "x": "一度目は、間違いを正すために。"}, {"t": 1465.3666666666666, "x": "二度目は、まだ映像を見せ続けるために。"}, {"t": 1467.8666666666666, "x": "三度目があるかどうかは、分からない。"}, {"t": 1470.0333333333333, "x": "だが、国会で15年間、同じ答えが繰り返されてきた。"}, {"t": 1473.65, "x": "捜査本部は、まだある。"}, {"t": 1475.3166666666666, "x": "終わっていない、というのは、そういうことだ。"}, {"t": 1478.4333333333334, "x": "最後に、この回で確かめたことをまとめておく。"}, {"t": 1481.3333333333333, "x": "今回話したことの出どころは、三つだけだ。"}, {"t": 1484.2166666666667, "x": "一つ目。群馬県警察のホームページにある\n「ゆかりちゃん誘拐事件」のページ。"}, {"t": 1489.1, "x": "事件の概要、重要参考人の特徴、公表されている\n画像、懸賞金の内訳が載っている。"}, {"t": 1494.95, "x": "二つ目。警察庁の\n「捜査特別報奨金制度の実施」のページ。"}, {"t": 1499.5166666666667, "x": "令和8年7月1日付けの懸賞広告に、正式な\n事件名と、上限額と、応募の期間と、"}, {"t": 1505.8, "x": "情報の受付先が書いてある。"}, {"t": 1507.9666666666667, "x": "三つ目。国会会議録検索システム。"}, {"t": 1510.7, "x": "2011年3月8日の予算委員会。"}, {"t": 1513.2166666666667, "x": "同じ年の5月16日と8月3日の行政監視委員会。"}, {"t": 1517.0333333333333, "x": "10月27日の法務委員会。"}, {"t": 1519.1833333333334, "x": "2015年7月6日の行政監視委員会。\nそして2026年5月8日の法務委員会。"}, {"t": 1525.2333333333333, "x": "今回読み上げた答弁は、全部そこに残っている。"}, {"t": 1528.1833333333334, "x": "誰でも無料で読める。今すぐ読める。"}, {"t": 1530.6666666666667, "x": "自分で確かめられるのね。"}, {"t": 1532.45, "x": "確かめてほしい。私が話したことが\n本当かどうか、そこで分かる。"}, {"t": 1536.7333333333333, "x": "そして、この回でどうしても\n伝えておきたいことがある。"}, {"t": 1539.8833333333334, "x": "この事件は、まだ情報を募集している。"}, {"t": 1542.3166666666666, "x": "伝える先は、群馬県太田警察署にある捜査本部だ。"}, {"t": 1545.85, "x": "番号は、群馬県警のホームページと、\n警察庁の懸賞広告のページに載っている。"}, {"t": 1550.8166666666666, "x": "通話料のかからない専用の番号も用意されている。"}, {"t": 1553.9166666666667, "x": "30年前、群馬県太田市のパチンコ店にいた人。"}, {"t": 1557.1666666666667, "x": "あの日の店の様子を覚えている人。"}, {"t": 1559.4166666666667, "x": "あるいは、その周りで、身長158センチくらいの、\nサングラスをかけた人を見たことがある人。"}, {"t": 1565.4333333333334, "x": "確かなことでなくていい、と警察は言っている。"}, {"t": 1568.05, "x": "配られたチラシに書いてあった言葉は、\n「あなたの記憶いま届けて」だった。"}, {"t": 1572.6, "x": "私は、この動画で犯人を\n名指ししなかった。できないからだ。"}, {"t": 1576.45, "x": "分かっているのは、1996年7月7日の午後、\n4歳の女の子が店の中からいなくなったこと。"}, {"t": 1583.2833333333333, "x": "直前に、その子に声をかけていた男がいたこと。"}, {"t": 1586.4666666666667, "x": "そして、30年たった今も、\n警察が探し続けていることだ。"}, {"t": 1590.6333333333334, "x": "ゆかりさんの誕生日は\n7月11日だという。いなくなった4日後だ。"}, {"t": 1594.8833333333334, "x": "この事件について、あなたはどう考えるか。"}, {"t": 1597.4, "x": "コメントで教えてほしい。"}, {"t": 1598.9, "x": "最後まで見てくれて、ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
