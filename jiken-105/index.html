<script>
const D={"name": "105", "file": "105_編集用", "dur": 2086.5833125, "segs": [], "subs": [{"t": 0.0, "x": "2016年7月8日。"}, {"t": 1.95, "x": "アメリカのFBIが、ひとつの事件から手を引いた。"}, {"t": 5.2, "x": "手を引いた？"}, {"t": 6.133333333333334, "x": "捜査に人を割くのを、そこでやめたということだ。"}, {"t": 9.05, "x": "その事件が起きたのは1971年11月24日。"}, {"t": 13.166666666666666, "x": "45年たっていた。"}, {"t": 14.666666666666666, "x": "旅客機が乗っ取られて、20万ドルが渡された。"}, {"t": 17.7, "x": "男はその金を持って、飛んでいる機体から飛び降りた。"}, {"t": 21.05, "x": "飛び降りた？　パラシュートで？"}, {"t": 22.816666666666666, "x": "そうだ。夜の雨の中を、パラシュートで降りていった。"}, {"t": 25.966666666666665, "x": "それきり、誰も見ていない。"}, {"t": 27.65, "x": "名前も分かっていない。"}, {"t": 28.833333333333332, "x": "どこへ行ったのかも分かっていない。"}, {"t": 30.75, "x": "アメリカの旅客機のハイジャックで、犯人が\n最後まで分からないまま残っている事件。"}, {"t": 35.483333333333334, "x": "それは、この1件だけだ。"}, {"t": 37.38333333333333, "x": "1件だけ？"}, {"t": 38.416666666666664, "x": "ほかは全部、誰がやったかまでは分かっている。"}, {"t": 41.1, "x": "この事件には名前がある。"}, {"t": 42.53333333333333, "x": "D.B.クーパー事件だ。"}, {"t": 44.0, "x": "ただ、その名前は本人が名乗ったものではない。"}, {"t": 46.88333333333333, "x": "新聞社の打ち間違いから生まれた名前だ。"}, {"t": 49.53333333333333, "x": "打ち間違い。"}, {"t": 50.53333333333333, "x": "そこも、あとで話す。"}, {"t": 52.06666666666667, "x": "今回は、45年ぶんの記録に何が残って、\n何が残らなかったかを数えていく。"}, {"t": 57.35, "x": "先に言っておく。この動画では、\n誰が犯人かを決めない。"}, {"t": 60.95, "x": "決めないの。"}, {"t": 61.9, "x": "調べた側が決めていないからだ。"}, {"t": 63.9, "x": "名前が挙がった人は何人もいる。だが、\n誰ひとり犯人とは認められていない。"}, {"t": 68.6, "x": "まず、起きたことだけを順番に見ていく。"}, {"t": 71.71666666666667, "x": "1971年11月24日。"}, {"t": 74.65, "x": "アメリカの感謝祭の、前の日だ。"}, {"t": 76.96666666666667, "x": "日本で言う、大きな祝日の前日ね。"}, {"t": 79.66666666666667, "x": "そうだ。空港が一年でいちばん混む週でもある。"}, {"t": 82.56666666666666, "x": "オレゴン州、ポートランド国際空港。"}, {"t": 84.88333333333334, "x": "ノースウエスト・オリエント航空のカウンターに、\n一人の男が来た。"}, {"t": 88.58333333333333, "x": "シアトル行きの片道切符を、現金で買った。"}, {"t": 91.58333333333333, "x": "現金。"}, {"t": 92.36666666666666, "x": "20ドル札1枚だ。切符の控えには、\n赤いインクで名前が書かれている。"}, {"t": 96.88333333333334, "x": "大文字で、DAN COOPER。ダン・クーパー。"}, {"t": 100.06666666666666, "x": "この切符は、今もFBIが保管している。"}, {"t": 102.68333333333334, "x": "写真も公開されている。"}, {"t": 104.33333333333333, "x": "便名は305便。機体はボーイング727。"}, {"t": 107.35, "x": "ポートランドからシアトルまでの、短い路線だ。"}, {"t": 110.18333333333334, "x": "乗客は36人。乗務員は、\n操縦室に3人、客室に3人だった。"}, {"t": 115.4, "x": "それだけの人数なのね。"}, {"t": 117.06666666666666, "x": "感謝祭の前日にしては、空いていた。"}, {"t": 119.63333333333334, "x": "男は黒いスーツに白いシャツ、黒いネクタイ。"}, {"t": 122.43333333333334, "x": "上にレインコートを着て、色の濃い\nサングラスをかけていた。"}, {"t": 125.66666666666667, "x": "あとで乗務員が話した人物像は、こうだ。"}, {"t": 128.4, "x": "年のころは40代半ば。"}, {"t": 130.06666666666666, "x": "身長は5フィート10インチから6フィート。"}, {"t": 132.51666666666668, "x": "日本で言うと、178センチから183センチくらいだ。"}, {"t": 136.58333333333334, "x": "体重は170から180ポンド。"}, {"t": 138.98333333333332, "x": "77キロから82キロほど。"}, {"t": 141.36666666666667, "x": "目は茶色。肌は浅黒く、落ち着いていた。"}, {"t": 144.15, "x": "男は機内のいちばん後ろの列に座った。"}, {"t": 146.78333333333333, "x": "離陸を待つあいだに、飲み物を頼んでいる。"}, {"t": 149.28333333333333, "x": "バーボンとソーダだ。"}, {"t": 150.6, "x": "ずいぶん落ち着いてるのね。"}, {"t": 152.21666666666667, "x": "この落ち着きは、最後まで変わらなかった。"}, {"t": 154.75, "x": "地元紙に残っている記録では、こうまとめられている。"}, {"t": 157.9, "x": "落ち着いていて、計算していて、\n物腰は丁寧だった、と。"}, {"t": 161.73333333333332, "x": "丁寧。"}, {"t": 162.46666666666667, "x": "ただし、同じ記録にはこうも書いてある。"}, {"t": 164.9, "x": "落ち着いているが、ときに口汚く、\n強く要求することもあった、と。"}, {"t": 169.36666666666667, "x": "……感じのいい人、ではないのね。"}, {"t": 171.41666666666666, "x": "そこは分けて考えたほうがいい。"}, {"t": 173.23333333333332, "x": "この事件は、犯人が英雄のように語られてきた。"}, {"t": 176.35, "x": "その話も、あとでする。"}, {"t": 178.1, "x": "はっきりしているのは、勢いでやった\n人ではないということだ。"}, {"t": 182.2, "x": "午後3時を少し回ったころだ。"}, {"t": 184.2, "x": "男は、客室乗務員に一枚のメモを手渡した。"}, {"t": 187.43333333333334, "x": "受け取ったのはフローレンス・シャフナーさんだった。"}, {"t": 190.2, "x": "シャフナーさんは、それを読まずにポケットへ入れた。"}, {"t": 193.08333333333334, "x": "読まなかったの。"}, {"t": 194.26666666666668, "x": "この手の紙は、たいてい電話番号だからだ。"}, {"t": 196.91666666666666, "x": "機内で乗務員に紙を渡す客は、めずらしくなかった。"}, {"t": 200.33333333333334, "x": "ところが男は、歩き出した\nシャフナーさんを呼び止めた。"}, {"t": 203.56666666666666, "x": "そして小さな声で言った。"}, {"t": 205.21666666666667, "x": "「それを読んでください」"}, {"t": 206.45, "x": "紙にはこう書いてあった。"}, {"t": 207.95, "x": "「私は爆弾を持っている」"}, {"t": 209.45, "x": "……。"}, {"t": 210.38333333333333, "x": "男は続けて、自分の隣に座るように言った。"}, {"t": 213.48333333333332, "x": "シャフナーさんは、言われたとおりにした。"}, {"t": 215.7, "x": "ここから3時間近く、この機体は\n乗っ取られた状態で飛び続ける。"}, {"t": 219.83333333333334, "x": "ただ、この事件には一つ、他と違うところがある。"}, {"t": 223.25, "x": "違うところ。"}, {"t": 224.26666666666668, "x": "怪我をした人が、一人も出ていない。"}, {"t": 226.6, "x": "乗客36人は、シアトルで全員が降りている。"}, {"t": 229.88333333333333, "x": "全員。"}, {"t": 230.6, "x": "全員だ。乗務員も、3人のうち2人が降りている。"}, {"t": 233.91666666666666, "x": "この事件で体を傷つけられた人は、一人もいない。"}, {"t": 237.26666666666668, "x": "暴れてもいないし、機体を壊してもいない。"}, {"t": 239.78333333333333, "x": "やったことは、紙を一枚渡して、金を\n受け取って、飛び降りただけだ。"}, {"t": 244.25, "x": "……それだけなのに、45年。"}, {"t": 246.28333333333333, "x": "それだけだから45年かかった、とも言える。"}, {"t": 249.13333333333333, "x": "残された物が、あまりにも少ない。"}, {"t": 251.41666666666666, "x": "この先ずっと、その「少なさ」の話をすることになる。"}, {"t": 255.85, "x": "男は、安物のアタッシェケースを持っていた。"}, {"t": 258.65, "x": "それを少しだけ開けて、中を見せている。"}, {"t": 261.1666666666667, "x": "FBIの記録では、電線の束と、\n赤い色をした棒が見えた。"}, {"t": 265.0833333333333, "x": "電池も入っていたと記録されている。"}, {"t": 267.4, "x": "爆弾に見える物ね。"}, {"t": 268.98333333333335, "x": "本物だったのかどうかは、今も分かっていない。"}, {"t": 271.76666666666665, "x": "中身が確かめられる前に、\n男は機体から降りてしまった。"}, {"t": 275.4, "x": "男は、乗務員に自分の要求を書き取らせた。"}, {"t": 278.43333333333334, "x": "その紙が操縦室へ運ばれる。"}, {"t": 280.46666666666664, "x": "要求は二つだった。"}, {"t": 281.93333333333334, "x": "20万ドルの現金。全部20ドル札で。"}, {"t": 284.68333333333334, "x": "それと、パラシュートを4つ。"}, {"t": 286.56666666666666, "x": "4つ。一人なのに。"}, {"t": 288.2, "x": "ここが、この事件のいちばん不気味なところだ。"}, {"t": 290.96666666666664, "x": "4つ要求するということは、誰かを\n道連れにできる、という意味になる。"}, {"t": 295.1166666666667, "x": "人質と一緒に飛び降りるかもしれない。"}, {"t": 297.45, "x": "そう思わせれば、地上は細工のしようがない。"}, {"t": 300.1666666666667, "x": "使えないパラシュートを渡せなくなるのね。"}, {"t": 302.6666666666667, "x": "そのとおりだ。だから\n4つだったのだろう、と言われている。"}, {"t": 305.9, "x": "ただ、本人がそう言ったわけではない。ここは推測だ。"}, {"t": 309.26666666666665, "x": "男は、パラシュートの出どころも指定している。"}, {"t": 311.98333333333335, "x": "タコマのマコード空軍基地から持ってこさせた。"}, {"t": 314.73333333333335, "x": "そして乗務員に、こう言っている。"}, {"t": 316.71666666666664, "x": "余計なことはするな、と。"}, {"t": 318.3666666666667, "x": "この男は、上空からタコマの街が\n見分けられるとも話している。"}, {"t": 322.26666666666665, "x": "この土地を知っている、という意味に取れる言葉だ。"}, {"t": 325.18333333333334, "x": "地元の人なのかしら。"}, {"t": 326.8833333333333, "x": "そう考える人は多い。ただ、\nそれも確かめられていない。"}, {"t": 330.31666666666666, "x": "ここで一度、要求の中身を並べておく。"}, {"t": 332.95, "x": "現金20万ドル。20ドル札で。"}, {"t": 335.3333333333333, "x": "パラシュート4つ。持ってくる場所はマコード空軍基地。"}, {"t": 338.5, "x": "そして、シアトルに着いたら燃料を入れること。"}, {"t": 341.35, "x": "全部そろえられたのね。"}, {"t": 342.9166666666667, "x": "そろえられた。地上は、そのとおりに用意している。"}, {"t": 345.85, "x": "この事件では、地上が一度も逆らっていない。"}, {"t": 348.6333333333333, "x": "乗っている人がいるからだ。"}, {"t": 350.25, "x": "結果として、要求は全部通った。"}, {"t": 353.25, "x": "20万ドルを、全部20ドル札でそろえる。"}, {"t": 355.98333333333335, "x": "枚数にすると1万枚だ。"}, {"t": 357.9, "x": "1万枚。"}, {"t": 358.8666666666667, "x": "用意したのはシアトル第一国立銀行だ。"}, {"t": 361.51666666666665, "x": "渡す前に、紙幣の番号をすべて\nマイクロフィルムに写している。"}, {"t": 365.21666666666664, "x": "これがあとで効いてくる。"}, {"t": 366.55, "x": "金は袋に詰められた。"}, {"t": 368.1666666666667, "x": "袋の重さは19ポンド。"}, {"t": 369.8, "x": "8.6キロほどだ。"}, {"t": 371.3, "x": "大きさは、縦11インチ、横12インチ、厚さ6.5インチ。"}, {"t": 375.4, "x": "だいたい、大きめの菓子箱くらいの塊になる。"}, {"t": 378.46666666666664, "x": "それを体にくくりつけて飛ぶの。"}, {"t": 380.6166666666667, "x": "そういうことになる。"}, {"t": 381.81666666666666, "x": "なぜ20ドル札という小さい札だったのか。"}, {"t": 384.45, "x": "これは男の指定だ。"}, {"t": 385.85, "x": "ただ、FBIの担当官は後年こう話している。"}, {"t": 389.0, "x": "小さい札で渡したのは、重くして\n動きを鈍らせる狙いもあった、と。"}, {"t": 393.4, "x": "札束が重しになるのね。"}, {"t": 395.25, "x": "大きい札なら、同じ金額でも束はずっと薄くなる。"}, {"t": 398.5833333333333, "x": "ちなみに当時の20万ドルは、\n2024年の価値でおよそ150万ドルにあたる。"}, {"t": 403.5833333333333, "x": "日本円に置き換えるのは、\n為替で変わるのでやめておく。"}, {"t": 406.76666666666665, "x": "ここでは、今の感覚で\n2億円前後の塊だと思ってもらえばいい。"}, {"t": 410.96666666666664, "x": "その番号を全部写したの。渡す前に。"}, {"t": 413.73333333333335, "x": "写した。1万枚ぶんだ。"}, {"t": 415.55, "x": "これが、この事件でいちばん効いた準備になる。"}, {"t": 418.26666666666665, "x": "紙幣には1枚ずつ違う番号が印刷されている。"}, {"t": 421.26666666666665, "x": "使われれば、いつか銀行で見つかる。"}, {"t": 423.5833333333333, "x": "つまり、この20万ドルは使えない金になった。"}, {"t": 426.65, "x": "使ったら足がつくのね。"}, {"t": 428.3666666666667, "x": "つく。だから、この金がどこかで使われた\n形跡は無いかが、ずっと調べられてきた。"}, {"t": 433.51666666666665, "x": "結果から言うと、使われた形跡は一度も出ていない。"}, {"t": 436.7, "x": "出てきたのは、9年後に砂から掘り出された束だけだ。"}, {"t": 440.75, "x": "機体がシアトル・タコマ空港に\n降りたのは、午後5時39分だ。"}, {"t": 444.6666666666667, "x": "すぐには駐機場に入っていない。"}, {"t": 446.6166666666667, "x": "金とパラシュートがそろうまで、\n上空と地上で時間を稼いでいる。"}, {"t": 450.43333333333334, "x": "そろったところで、機体は指定された場所に止まった。"}, {"t": 453.56666666666666, "x": "ここで取引がおこなわれる。"}, {"t": 455.31666666666666, "x": "男は、乗客36人を降ろした。"}, {"t": 457.8833333333333, "x": "客室乗務員も、3人のうち2人が降りている。"}, {"t": 461.1, "x": "全員は降りなかったのね。"}, {"t": 462.8, "x": "残ったのは、操縦室の3人と、客室乗務員が1人。"}, {"t": 466.71666666666664, "x": "残った乗務員は、ティナ・マックロウさんだった。"}, {"t": 469.6, "x": "マックロウさんは、シアトルに\n降りる前からずっと男の隣にいた。"}, {"t": 473.35, "x": "メモを受け取ったシャフナーさんと\n交代して、そばに座り続けている。"}, {"t": 477.4, "x": "一番近くで見ていた人ね。"}, {"t": 479.4, "x": "だからこの人の記憶が、人物像の土台になっている。"}, {"t": 482.8333333333333, "x": "機体には燃料が入れられた。"}, {"t": 484.56666666666666, "x": "この給油に、ずいぶん時間がかかっている。"}, {"t": 487.1, "x": "男は、それを何度も急がせた。"}, {"t": 489.28333333333336, "x": "そして次の行き先を告げた。"}, {"t": 491.1666666666667, "x": "メキシコシティだ。"}, {"t": 492.3833333333333, "x": "国外へ出るつもりだったの。"}, {"t": 494.21666666666664, "x": "そう見えるが、この機体では届かない。"}, {"t": 496.48333333333335, "x": "途中で給油がいる。だから乗務員は\nネバダ州のリノを経由に選んだ。"}, {"t": 500.46666666666664, "x": "男は、それを認めている。"}, {"t": 502.4, "x": "話が通じる相手なのね。"}, {"t": 504.28333333333336, "x": "そこも、この事件の特徴だ。"}, {"t": 506.3333333333333, "x": "無理を言って機体を落とすような要求はしていない。"}, {"t": 509.01666666666665, "x": "飛べる条件の中で、いちばん\n飛び降りやすい形を選んでいる。"}, {"t": 512.6166666666667, "x": "シアトルで機体が止まっていたのは、\n2時間近くになる。"}, {"t": 515.95, "x": "午後5時39分に降りて、次に\n離陸したのが午後7時40分だ。"}, {"t": 520.5, "x": "2時間も地上にいたのね。"}, {"t": 522.2833333333333, "x": "いた。だが、そのあいだに誰も\n機内へ踏み込んでいない。"}, {"t": 525.5, "x": "中に人がいる以上、手を出せなかった。"}, {"t": 528.55, "x": "午後7時40分。機体はシアトルをもう一度離陸した。"}, {"t": 532.0, "x": "このとき男が出した飛び方の条件が、細かい。"}, {"t": 535.1333333333333, "x": "高度は1万フィートより下。"}, {"t": 536.9333333333333, "x": "3,000メートルほどだ。"}, {"t": 538.35, "x": "主翼のフラップは15度まで下ろしたまま。"}, {"t": 540.8, "x": "着陸のときの脚も、出したままにさせた。"}, {"t": 543.7, "x": "それ、飛びにくくない。"}, {"t": 545.25, "x": "飛びにくい。だから速度が出ない。"}, {"t": 547.25, "x": "この男は、速度が出ない状態を作らせたわけだ。"}, {"t": 550.45, "x": "さらに、機内を与圧しないように指示している。"}, {"t": 553.1333333333333, "x": "与圧というのは、機内の気圧を\n地上に近づける仕組みだ。"}, {"t": 556.6166666666667, "x": "高いところを飛んでも\n息ができるのは、これのおかげだ。"}, {"t": 559.8666666666667, "x": "それを切らせたのね。"}, {"t": 561.2833333333333, "x": "外と機内の気圧を同じにしておけば、\n扉を開けても押し戻されない。"}, {"t": 565.4166666666666, "x": "つまり、この男は「飛行中に扉を開ける」\n前提で指示を出している。"}, {"t": 569.7833333333333, "x": "ここで一つ、はっきりしていることがある。"}, {"t": 572.2833333333333, "x": "この人物は、727という機体の性質を知っていた。"}, {"t": 575.8333333333334, "x": "ただし、どこで知ったのかは分かっていない。"}, {"t": 578.2333333333333, "x": "機体の後ろには、空軍の飛行機が3機ついた。"}, {"t": 581.2833333333333, "x": "飛び降りる瞬間を見るためだ。"}, {"t": 583.2, "x": "見えたの。"}, {"t": 584.0333333333333, "x": "見えていない。雲と雨で、何も確認できなかった。"}, {"t": 587.3166666666667, "x": "ここで一つ、大事なことを言っておく。"}, {"t": 589.6833333333333, "x": "この男は、飛び降りる場所を指定していない。"}, {"t": 592.4, "x": "指定していない。"}, {"t": 593.5666666666667, "x": "メキシコへ飛べ、としか言っていない。"}, {"t": 595.6666666666666, "x": "つまり、地上で誰かが\n待っているような降り方ではない。"}, {"t": 598.7333333333333, "x": "仲間がいるなら、落ちる場所を合わせる必要がある。"}, {"t": 601.6833333333333, "x": "そのためには、機長と細かく打ち合わせないと無理だ。"}, {"t": 604.8333333333334, "x": "それをしていない。"}, {"t": 605.8666666666667, "x": "だからFBIは、地上に協力者はいなかったと見ている。"}, {"t": 609.4333333333333, "x": "一人でやったのね。"}, {"t": 610.8166666666667, "x": "そう見られている。ただ、これも断定はされていない。"}, {"t": 614.4333333333333, "x": "ボーイング727には、尾部に階段が付いている。"}, {"t": 617.45, "x": "機体の後ろの下側から、\n地面に向かって伸びる階段だ。"}, {"t": 621.05, "x": "空港に搭乗橋が無くても、\n乗り降りできるようにするためのものだ。"}, {"t": 625.0666666666667, "x": "便利な仕組みね。"}, {"t": 626.3333333333334, "x": "便利だった。問題は、この階段が\n飛行中でも下ろせたことだ。"}, {"t": 630.3, "x": "当時、空港の関係者でさえ、それを知らなかった。"}, {"t": 633.5, "x": "男が要求して、初めて「できる」と\n分かった、と地元紙は書いている。"}, {"t": 638.0833333333334, "x": "午後8時ごろ、男はその階段を下ろさせた。"}, {"t": 641.0, "x": "そして、残っていたマックロウさんを操縦室へ入れた。"}, {"t": 644.1833333333333, "x": "扉を閉めて、出てこないように言っている。"}, {"t": 646.7333333333333, "x": "一人になりたかったのね。"}, {"t": 648.5, "x": "そうだ。ここから先を見た人間は、一人もいない。"}, {"t": 651.6833333333333, "x": "操縦室の3人は、扉の向こうで計器だけを見ていた。"}, {"t": 655.2, "x": "操縦室と客室は、電話でつながっている。"}, {"t": 658.0666666666667, "x": "機長は何度か声をかけた。"}, {"t": 659.8166666666667, "x": "最後に返事が来たあと、それきり返事は無くなった。"}, {"t": 663.05, "x": "残されていたのは、開いた後部階段だけだった。"}, {"t": 666.1, "x": "ちなみに、この機体は後で調べられている。"}, {"t": 668.6833333333333, "x": "機内には指紋も残っていた。ただし、\n誰のものか分からない指紋だ。"}, {"t": 672.9666666666667, "x": "照合しても出なかったの。"}, {"t": 674.7, "x": "出なかった。今日まで、一致する\n人物は見つかっていない。"}, {"t": 678.4166666666666, "x": "ついでに言うと、機内には吸い殻も残っていた。"}, {"t": 681.2166666666667, "x": "この男は、機内でたばこを吸っている。"}, {"t": 683.6833333333333, "x": "当時は吸えたのよね。"}, {"t": 685.15, "x": "吸えた。だから吸い殻が残った。"}, {"t": 687.2666666666667, "x": "ただし、1971年にはDNAを調べる技術が無い。"}, {"t": 691.3166666666667, "x": "この時代にできたのは、指紋と目撃の記憶までだ。"}, {"t": 694.7333333333333, "x": "技術が追いついていなかったのね。"}, {"t": 696.8333333333334, "x": "そこがこの事件のつらいところだ。"}, {"t": 698.8833333333333, "x": "のちにFBIが調べ直せたのは、ネクタイのほうだった。"}, {"t": 702.9166666666666, "x": "午後8時13分。"}, {"t": 704.3166666666667, "x": "操縦室の計器が、小さな変化を記録した。"}, {"t": 707.35, "x": "機体の圧力が、ほんの一瞬だけ動いた。"}, {"t": 710.2166666666667, "x": "それって。"}, {"t": 711.0833333333334, "x": "後ろで重さが減った、ということだ。"}, {"t": 713.35, "x": "FBIは、これが飛び降りた時刻だと見ている。"}, {"t": 716.15, "x": "機体はそのとき、ワシントン州の南西部を飛んでいた。"}, {"t": 719.3833333333333, "x": "地元紙は、ルイス川の上空あたりだと書いている。"}, {"t": 722.3833333333333, "x": "速度は時速196マイル。"}, {"t": 724.5666666666667, "x": "時速315キロほどだ。"}, {"t": 726.4666666666667, "x": "高度はおよそ1万フィート。"}, {"t": 728.1333333333333, "x": "そのときの外の風あたりは、\n氷点下をかなり下回っていた。"}, {"t": 732.05, "x": "雨も降っていたのよね。"}, {"t": 733.6, "x": "降っていた。しかも雲が低い。"}, {"t": 735.6, "x": "雲の底は5,000フィートあたりにあった。"}, {"t": 737.85, "x": "つまり、飛び降りた男から地面は見えていない。"}, {"t": 740.5666666666667, "x": "自分がどこの上空にいるかも、分からなかったはずだ。"}, {"t": 743.7833333333333, "x": "FBIは、降りた場所をポートランドの北およそ20\nマイルの範囲と見ている。"}, {"t": 748.0666666666667, "x": "ただ、そこから先は絞れていない。"}, {"t": 750.25, "x": "この「絞れていない」が、この事件のすべてになる。"}, {"t": 753.4666666666667, "x": "範囲は、山と森と川だ。"}, {"t": 755.35, "x": "11月の夜で、雨で、真っ暗だった。"}, {"t": 758.2666666666667, "x": "本人も、どこにいるか分からないまま飛んだのね。"}, {"t": 761.2666666666667, "x": "そうなる。"}, {"t": 761.95, "x": "機体は時速300キロを超えて飛んでいる。"}, {"t": 764.4166666666666, "x": "1分で5キロ進む。"}, {"t": 765.8166666666667, "x": "飛び降りた時刻が1分ずれるだけで、\n場所は5キロずれる。"}, {"t": 769.25, "x": "それは探せないわね。"}, {"t": 770.7166666666667, "x": "計器が動いたのは午後8時13分。それは分かっている。"}, {"t": 774.15, "x": "だが、その瞬間に機体が\nどこの真上にいたかは、細かくは分からない。"}, {"t": 778.4, "x": "当時のやり方では、位置を\nそこまで細かく残せなかった。"}, {"t": 781.8833333333333, "x": "この1分が、この事件をここまで長引かせた。"}, {"t": 785.45, "x": "機体がリノに降りたのは、午後10時15分だ。"}, {"t": 788.2333333333333, "x": "後部の階段は、下りたままだった。"}, {"t": 790.4166666666666, "x": "滑走路をこすりながら着陸している。"}, {"t": 792.85, "x": "男はもういないのね。"}, {"t": 794.3333333333334, "x": "いない。金の袋も無い。"}, {"t": 796.0, "x": "4つ渡したパラシュートのうち、2つが無くなっていた。"}, {"t": 799.3166666666667, "x": "残された機内には、いくつかの物があった。"}, {"t": 802.0333333333333, "x": "黒いネクタイと、そのネクタイ留め。"}, {"t": 804.2666666666667, "x": "吸い殻。そして、さっき話した指紋だ。"}, {"t": 807.0333333333333, "x": "ネクタイは、J.C.ペニーという量販店の物だった。"}, {"t": 810.2, "x": "しかも、首に結ぶ式ではない。"}, {"t": 812.15, "x": "留め具で引っかける式だ。"}, {"t": 813.95, "x": "外して置いていったの。"}, {"t": 815.45, "x": "飛び降りる前に外している。"}, {"t": 817.0666666666667, "x": "これが、この事件で唯一、\n本人の体に触れていた物になった。"}, {"t": 821.2166666666667, "x": "2001年、FBIはこのネクタイから\nDNAの試料を取っている。"}, {"t": 825.2166666666667, "x": "残されたパラシュートにも、話がある。"}, {"t": 827.6333333333333, "x": "4つのうち、1つは訓練用だった。"}, {"t": 830.1, "x": "中が縫い閉じられていて、\n開かないようにしてある物だ。"}, {"t": 833.5333333333333, "x": "それ、使えないじゃない。"}, {"t": 835.1333333333333, "x": "使えない。そして男は、それを持って飛び降りている。"}, {"t": 838.3333333333334, "x": "確かめなかったのか、\n気づかなかったのか。そこは分からない。"}, {"t": 842.05, "x": "もう1つ、残ったパラシュートの紐が切り取られていた。"}, {"t": 845.3666666666667, "x": "男はその紐で、金の袋の口を縛っている。"}, {"t": 849.1, "x": "翌日から、捜索が始まった。"}, {"t": 851.4333333333333, "x": "本部が置かれたのは、\nワシントン州ウッドランドの市役所だ。"}, {"t": 854.8833333333333, "x": "飛行機とヘリコプターが飛んだ。"}, {"t": 856.7666666666667, "x": "地上には、300人を超える兵士が入った。"}, {"t": 859.7, "x": "軍が出たの。"}, {"t": 860.75, "x": "近くの基地から出ている。"}, {"t": 862.3333333333334, "x": "それが18日間続いた。"}, {"t": 864.2333333333333, "x": "出てきたものは、何も無い。"}, {"t": 866.0, "x": "体も、パラシュートも、金も、足あとも無い。"}, {"t": 869.15, "x": "18日間で何も。"}, {"t": 870.8666666666667, "x": "何も。ずっと雨が降っていたのも大きい。"}, {"t": 873.3333333333334, "x": "11月末のワシントン州は、雨と霧の季節だ。"}, {"t": 876.7, "x": "森は深く、川が枝分かれしている。"}, {"t": 879.0166666666667, "x": "仮に落ちていたとしても、\n見つけるのは簡単ではない。"}, {"t": 882.2, "x": "FBIは捜査に名前を付けた。"}, {"t": 884.2333333333333, "x": "ノージャック。\nノースウエスト航空のハイジャック、という\n意味の略語だ。"}, {"t": 888.05, "x": "数百人に話を聞き、全米に散った手がかりを追った。"}, {"t": 891.5166666666667, "x": "機体も、すみずみまで調べている。"}, {"t": 893.6666666666666, "x": "この捜査は、その後45年続くことになる。"}, {"t": 896.8166666666667, "x": "45年。"}, {"t": 897.85, "x": "始まりが、この18日間だった。"}, {"t": 900.3, "x": "探した側の言葉も残っている。"}, {"t": 902.3666666666667, "x": "この事件を最初から追い、\n1980年に退職した捜査官がいる。"}, {"t": 906.95, "x": "ラルフ・ヒンメルスバックさんだ。"}, {"t": 908.9333333333333, "x": "この人は、こう話している。"}, {"t": 910.7833333333333, "x": "あの男はおそらく前科のある人間で、\n最後の大勝負に出たのだろう、と。"}, {"t": 915.1166666666667, "x": "うまくいけばそれでいい。だめでも\n失うものは少なかった、と。"}, {"t": 918.8333333333334, "x": "追いかけた人の見方ね。"}, {"t": 920.5833333333334, "x": "見方だ。事実として確かめられたわけではない。"}, {"t": 923.5833333333334, "x": "この人は、こうも言っている。"}, {"t": 925.3333333333334, "x": "これ以上は何も分からないかもしれない。\nそれを受け入れるしかない、と。"}, {"t": 929.85, "x": "ここで、名前の話をしておく。"}, {"t": 931.9166666666666, "x": "切符に書かれていた名前は、ダン・クーパーだ。"}, {"t": 934.5333333333333, "x": "D.B.ではない。"}, {"t": 935.65, "x": "じゃあ、どこから来たの。"}, {"t": 937.2333333333333, "x": "通信社の配信記事だ。"}, {"t": 938.9, "x": "事件の夜、記者たちは大急ぎで原稿を送っていた。"}, {"t": 942.1166666666667, "x": "そのうちの一本で、名前がD.B.クーパーになった。"}, {"t": 945.15, "x": "FBIは翌日の発表で、それを訂正している。"}, {"t": 948.3, "x": "だが、間に合わなかった。"}, {"t": 949.9166666666666, "x": "誤りのほうが先に世界を一周してしまった。"}, {"t": 952.8333333333334, "x": "訂正が届く前に広まったのね。"}, {"t": 955.1, "x": "そうだ。以来、この事件はD.B.\nクーパー事件と呼ばれている。"}, {"t": 958.6666666666666, "x": "FBIは、自分たちの公式ページにこう書いている。"}, {"t": 961.8333333333334, "x": "D.B.というのは、報道が作った\n作り話のようなものだ、と。"}, {"t": 965.7, "x": "そして、こうも書いている。"}, {"t": 967.3, "x": "D.B.というイニシャルの男性から\n話を聞いたことはある。"}, {"t": 970.4333333333333, "x": "ただし、その人は犯人ではなかった、と。"}, {"t": 973.3333333333334, "x": "巻き込まれた人がいるのね。"}, {"t": 975.1666666666666, "x": "いる。だからこの動画では、その人の名前は出さない。"}, {"t": 978.45, "x": "地元の記録には残っているが、出す\n必要のない名前だ。"}, {"t": 982.0333333333333, "x": "世界中が半世紀そう呼んできた名前は、\nもともと人違いから生まれている。"}, {"t": 986.4833333333333, "x": "この事件は、最初の記事から間違っていたわけだ。"}, {"t": 989.7, "x": "訂正しても戻らないのね。"}, {"t": 991.5333333333333, "x": "戻らない。今さらダン・クーパー事件と\n言い直しても、誰にも通じない。"}, {"t": 995.65, "x": "FBIの公式ページですら、見出しはD.B.クーパーだ。"}, {"t": 999.0, "x": "間違いのほうが、正しい記録より強く残ってしまった。"}, {"t": 1002.55, "x": "本人は何て思っているのかしらね。"}, {"t": 1004.8666666666667, "x": "それも分からない。"}, {"t": 1005.9666666666667, "x": "この人物が生きて記事を読んだのか\nどうかも、分かっていない。"}, {"t": 1010.0666666666667, "x": "捜査の規模を、数字で見ておく。"}, {"t": 1012.0833333333334, "x": "FBIが公式に書いている数字だ。"}, {"t": 1014.3833333333333, "x": "事件から5年目の時点で、候補として\n検討した人数は800人を超えている。"}, {"t": 1019.3, "x": "800人。"}, {"t": 1020.3, "x": "そのうち、最後まで消せずに\n残ったのが2ダースほどだ。"}, {"t": 1023.6166666666667, "x": "24人前後ということになる。"}, {"t": 1025.55, "x": "つまり5年で、776人ぶんを「違う」と確かめている。"}, {"t": 1029.8166666666666, "x": "一人ずつ、当日どこにいたかを調べていく仕事だ。"}, {"t": 1033.05, "x": "1975年の時点で、追った\n手がかりは数千件になっていた。"}, {"t": 1037.3833333333334, "x": "この事件には、自分がやったと名乗り出る人も多い。"}, {"t": 1040.5, "x": "臨終の際に家族へ打ち明けた、という話も複数ある。"}, {"t": 1044.1166666666666, "x": "本当なの。"}, {"t": 1045.1333333333334, "x": "FBIは、そのどれも本物とは見ていない。"}, {"t": 1047.85, "x": "名乗るだけなら誰でもできるからだ。"}, {"t": 1049.95, "x": "裏付けになる物が要る。"}, {"t": 1051.4, "x": "たとえば、消えた紙幣。\nたとえば、消えたパラシュート。"}, {"t": 1054.6, "x": "その2つが出てくれば、話は一気に進む。"}, {"t": 1057.5166666666667, "x": "逆に言えば、45年たっても、\nその2つは出てきていない。"}, {"t": 1061.2833333333333, "x": "出てきたのは、1980年の一度きりだ。"}, {"t": 1064.5833333333333, "x": "一度だけ。"}, {"t": 1065.55, "x": "その話は、もう少しあとでする。"}, {"t": 1067.8, "x": "FBIは、2007年に方針を変えている。"}, {"t": 1070.6333333333334, "x": "それまで表に出していなかった\n資料を、自分から公開した。"}, {"t": 1074.3, "x": "ネクタイの写真。パラシュートの写真。似顔絵。地図。"}, {"t": 1077.6333333333334, "x": "外に出したのね。"}, {"t": 1079.0, "x": "出した。そして「見覚えはないか」と\n一般に呼びかけた。"}, {"t": 1082.6166666666666, "x": "担当した捜査官は、こう言っている。"}, {"t": 1084.9166666666667, "x": "40年近く前の事件に、多くの人手を\n割くのは理屈に合わない。"}, {"t": 1089.0, "x": "だから外の人が手伝ってくれるなら、\n何かが動くかもしれない、と。"}, {"t": 1093.2333333333333, "x": "この呼びかけで、手がかりはたくさん集まった。"}, {"t": 1095.9666666666667, "x": "それでも、名前には届かなかった。"}, {"t": 1098.85, "x": "1976年の11月。"}, {"t": 1101.3, "x": "事件から5年になろうとしていた。"}, {"t": 1103.3666666666666, "x": "当時、ハイジャックの罪に問える期限は5年だった。"}, {"t": 1106.5333333333333, "x": "時効ね。"}, {"t": 1107.3833333333334, "x": "この期限が切れると、たとえ後で\n名前が分かっても裁けなくなる。"}, {"t": 1111.2166666666667, "x": "そこでポートランドの大陪審が、\n期限の最後の日に手を打った。"}, {"t": 1114.9166666666667, "x": "起訴したのだ。"}, {"t": 1116.05, "x": "誰を。"}, {"t": 1116.7333333333333, "x": "ジョン・ドウ、別名ダン・クーパー。"}, {"t": 1118.5166666666667, "x": "ジョン・ドウというのは、名前が分からない\n人を指すときのアメリカの言い方だ。"}, {"t": 1122.65, "x": "日本で言う「氏名不詳」にあたる。"}, {"t": 1124.8833333333334, "x": "つまり、中身の空いた起訴状を作っておいたわけだ。"}, {"t": 1127.9166666666667, "x": "いつか身元が分かったときのために、\n期限だけを止めた。"}, {"t": 1131.3666666666666, "x": "名前が入る場所を空けたまま。"}, {"t": 1133.3, "x": "そのままだ。50年たっても、まだ空いている。"}, {"t": 1136.1333333333334, "x": "この事件は、扱いが二重になっている。"}, {"t": 1138.65, "x": "FBIは、この事件を期限の無い重い\n罪として扱ってきた時期もある。"}, {"t": 1143.05, "x": "一方で、ハイジャックの罪としては期限がある。"}, {"t": 1145.8, "x": "だから1976年の手続きが要った。"}, {"t": 1148.8333333333333, "x": "法律の上でも、この事件は宙に浮いたままだ。"}, {"t": 1151.85, "x": "起訴状が50年ぶんの重さを持ってるのね。"}, {"t": 1154.5666666666666, "x": "そういう形になる。"}, {"t": 1155.8666666666666, "x": "ちなみに、この起訴の日付は感謝祭の前の日だ。"}, {"t": 1159.0333333333333, "x": "事件が起きたのも、感謝祭の前の日だった。"}, {"t": 1162.0, "x": "ちょうど5年後ね。"}, {"t": 1163.2166666666667, "x": "ぴったり合わせている。"}, {"t": 1164.3, "x": "期限の最後の日を使ったからだ。"}, {"t": 1166.4666666666667, "x": "役所の仕事としては、ぎりぎりまで粘ったことになる。"}, {"t": 1169.7333333333333, "x": "この1枚の紙があるので、身元が\n分かれば今でも裁判にできる。"}, {"t": 1173.6333333333334, "x": "ただ、その身元が55年出てこない。"}, {"t": 1176.7833333333333, "x": "1980年2月10日。日曜日だ。"}, {"t": 1179.8166666666666, "x": "事件から8年3か月ほど経っている。"}, {"t": 1182.3333333333333, "x": "ワシントン州クラーク郡、コロンビア川のほとり。"}, {"t": 1185.1, "x": "テナ・バーと呼ばれる砂州だ。"}, {"t": 1186.65, "x": "そこに、8歳の男の子が家族と来ていた。"}, {"t": 1189.5, "x": "ブライアン・イングラムさんだ。"}, {"t": 1191.1833333333334, "x": "たき火をするために、父親が場所を作ろうとしていた。"}, {"t": 1194.3833333333334, "x": "イングラムさんは、腕で砂をならしていた。"}, {"t": 1197.0166666666667, "x": "それで。"}, {"t": 1197.75, "x": "指に、砂とは違うものが当たった。"}, {"t": 1200.0833333333333, "x": "本人は後にこう話している。"}, {"t": 1201.95, "x": "腕で砂をなでたら、何かふくらんだ感じがした、と。"}, {"t": 1205.2666666666667, "x": "掘り出したのは、紙の束だった。"}, {"t": 1207.4166666666667, "x": "20ドル札だ。輪ゴムでまとめられたまま、\n3つの束になっていた。"}, {"t": 1211.5333333333333, "x": "紙はぼろぼろで、濡れた紙の\nかたまりのようだったという。"}, {"t": 1214.85, "x": "お札だと分かったの。"}, {"t": 1216.35, "x": "親は最初、おもちゃの金だと思っている。"}, {"t": 1218.8666666666666, "x": "次の日、家族はFBIへ持って行った。"}, {"t": 1221.4333333333334, "x": "そして番号が照合された。"}, {"t": 1223.2166666666667, "x": "1971年にマイクロフィルムで\n写しておいた、あの番号だ。"}, {"t": 1227.4166666666667, "x": "一致した。"}, {"t": 1228.2333333333333, "x": "束の中身は、100枚、100枚、90枚。"}, {"t": 1231.0833333333333, "x": "合わせて290枚。"}, {"t": 1232.7, "x": "金額にして5,800ドルだ。"}, {"t": 1234.9333333333334, "x": "渡した20万ドルのうちの。"}, {"t": 1236.8833333333334, "x": "ごく一部だ。"}, {"t": 1237.8333333333333, "x": "しかも、並び順が1971年に渡したときのままだった。"}, {"t": 1242.3, "x": "束が崩れていなかったの。"}, {"t": 1244.05, "x": "崩れていない。輪ゴムも残っていた。"}, {"t": 1246.2666666666667, "x": "紙のほうは、ひどい状態だった。"}, {"t": 1248.3833333333334, "x": "読めないほど傷んだものもあれば、\n名刺くらいの大きさになったものもある。"}, {"t": 1252.45, "x": "真っ黒になった札もあった。"}, {"t": 1254.2166666666667, "x": "家族の話では、そのまま見られる\n状態のものは30枚ほどだったという。"}, {"t": 1258.7666666666667, "x": "それでも番号が読めたのね。"}, {"t": 1260.6166666666666, "x": "読めた。だから一致が確かめられた。"}, {"t": 1262.9666666666667, "x": "この発見は、当時のシアトルの新聞で\n一面の大見出しになっている。"}, {"t": 1267.0833333333333, "x": "事件から8年で、初めて手がかりが出たからだ。"}, {"t": 1270.8666666666666, "x": "FBIは、すぐに現場を掘った。"}, {"t": 1273.0333333333333, "x": "見つけた場所から5フィートほど離れた\nところで、紙の破片が出ている。"}, {"t": 1277.0333333333333, "x": "5円玉くらいの大きさの、細かい破片だ。"}, {"t": 1279.75, "x": "深いものは、砂の3フィート下にあった。"}, {"t": 1282.4166666666667, "x": "2月13日には、重機まで入れている。"}, {"t": 1285.0166666666667, "x": "土の専門家、遺跡を掘る専門家、\n川の流れの専門家も呼ばれた。"}, {"t": 1289.65, "x": "本気ね。"}, {"t": 1290.5333333333333, "x": "事件から8年で、初めて出てきた物だからだ。"}, {"t": 1293.7, "x": "ところが、ここから先が進まない。"}, {"t": 1295.9666666666667, "x": "なぜその砂州に、その金があったのか。"}, {"t": 1298.3833333333334, "x": "これが、今も説明できていない。"}, {"t": 1300.4833333333333, "x": "現場の責任者は当時こう言っている。"}, {"t": 1302.75, "x": "ずっと昔に流れ着いたのかも\nしれないが、9年前ではないだろう、と。"}, {"t": 1307.0833333333333, "x": "矛盾してるじゃない。"}, {"t": 1308.3833333333334, "x": "しているように聞こえる。"}, {"t": 1309.75, "x": "砂の積もり方から見ると、1971年に\n流れ着いたとは考えにくかったらしい。"}, {"t": 1315.2333333333333, "x": "長年この事件を追った捜査官は、こう説明している。"}, {"t": 1318.6, "x": "袋は川岸の近くにあって、水かさが\n増したときに流れ出した。"}, {"t": 1322.75, "x": "そして川底を転がるうちに袋が\n破れ、札の縁が削れていった、と。"}, {"t": 1327.2166666666667, "x": "これも一つの見方で、確かめられてはいない。"}, {"t": 1330.0333333333333, "x": "はっきりしているのは、数字のほうだ。"}, {"t": 1332.2666666666667, "x": "渡された20万ドルのうち、出てきたのは5,800ドル。"}, {"t": 1335.8666666666666, "x": "残りの19万4,200ドルは、\n今日まで1枚も見つかっていない。"}, {"t": 1340.3666666666666, "x": "1枚も。"}, {"t": 1341.2833333333333, "x": "世界中の銀行が番号を持っているのに、\n1枚も回ってきていない。"}, {"t": 1345.9333333333334, "x": "掘り出された5,800ドルには、続きがある。"}, {"t": 1348.7833333333333, "x": "この金は、誰のものなのか。"}, {"t": 1350.8666666666666, "x": "拾った子のものじゃないの。"}, {"t": 1352.5666666666666, "x": "そこで争いになった。"}, {"t": 1354.05, "x": "名乗り出たのは4者だ。"}, {"t": 1355.5, "x": "FBI。イングラムさん一家。"}, {"t": 1357.3, "x": "航空会社。そして航空会社の保険会社だ。"}, {"t": 1360.5666666666666, "x": "4者。"}, {"t": 1361.3333333333333, "x": "航空会社は、盗まれた側だ。"}, {"t": 1363.4666666666667, "x": "ただ、損の9割は保険会社が埋めていた。だから\n保険会社も権利を主張した。"}, {"t": 1368.4833333333333, "x": "決着がついたのは1986年5月21日だ。"}, {"t": 1372.4666666666667, "x": "発見から6年かかっている。"}, {"t": 1374.3833333333334, "x": "裁判所に出された案は、こうだった。"}, {"t": 1376.65, "x": "280ドル分は、証拠としてFBIが持つ。"}, {"t": 1379.8833333333334, "x": "残りの5,520ドルを、イングラムさんと\n保険会社で半分ずつにする。"}, {"t": 1384.5333333333333, "x": "じゃあ、いくらになったの。"}, {"t": 1386.1833333333334, "x": "2,760ドルだ。"}, {"t": 1387.9333333333334, "x": "受け取ったのは1986年の6月。"}, {"t": 1390.8, "x": "イングラムさんは15歳になっていた。"}, {"t": 1393.0166666666667, "x": "本人は当時、こう話している。"}, {"t": 1395.0833333333333, "x": "うまく売れれば大学に行ける。もう\n少し良ければ、家の頭金にもなる、と。"}, {"t": 1399.6333333333334, "x": "受け取った中には、現物の札も含まれていた。"}, {"t": 1402.7166666666667, "x": "その札は、2008年に競りに出されている。"}, {"t": 1405.5833333333333, "x": "15枚で、3万7,000ドルになった。"}, {"t": 1408.2666666666667, "x": "15枚で3万7,000ドル。"}, {"t": 1410.2333333333333, "x": "1枚あたり2,400ドルを超える。"}, {"t": 1412.4333333333334, "x": "額面は20ドルだ。"}, {"t": 1413.85, "x": "事件の名前が付いた紙、というだけで\n100倍以上になった。"}, {"t": 1417.5, "x": "……事件が値段になっちゃってるのね。"}, {"t": 1419.6333333333334, "x": "そうだ。ここが、この事件のもう一つの面になる。"}, {"t": 1423.4333333333334, "x": "ここからは、名前の話になる。"}, {"t": 1425.5666666666666, "x": "先に決めておく。ここで挙げるのは3人だけだ。"}, {"t": 1428.5, "x": "FBIが自分の公式ページで名前を出し、\nそのうえで「違う」と書いた人だけにする。"}, {"t": 1433.9166666666667, "x": "それ以外は出さないのね。"}, {"t": 1435.5333333333333, "x": "出さない。犯人だと決まっていない\n人を、犯人のように並べたくない。"}, {"t": 1439.7333333333333, "x": "一人目は、リチャード・フロイド・マッコイ受刑者だ。"}, {"t": 1442.9666666666667, "x": "この事件から5か月足らずの後に、\nよく似たハイジャックを起こしている。"}, {"t": 1446.9666666666667, "x": "金を要求して、パラシュートで飛び降りた。"}, {"t": 1449.5166666666667, "x": "FBIはこの人を追い、逮捕している。"}, {"t": 1451.75, "x": "1974年に亡くなった。"}, {"t": 1454.2666666666667, "x": "やり方がそっくりね。"}, {"t": 1455.7666666666667, "x": "だから今でも、この人を推す声は多い。"}, {"t": 1458.15, "x": "ただ、FBIは違うと発表している。"}, {"t": 1460.7, "x": "理由は、2人の客室乗務員が別々に\n話した人物像と合わないことだ。"}, {"t": 1465.4666666666667, "x": "二人は事件の夜、別の街で、\n別々に事情を聞かれている。"}, {"t": 1469.3666666666666, "x": "それでも、ほとんど同じ人物像を話した。"}, {"t": 1472.15, "x": "その人物像と合わなかった。"}, {"t": 1474.0166666666667, "x": "二人目は、デュエイン・ウェバーさんだ。"}, {"t": 1476.15, "x": "亡くなる前に、自分がクーパーだと\n家族に話したと伝えられている。"}, {"t": 1480.1666666666667, "x": "FBIは、2001年にネクタイから取ったDNAと照合した。"}, {"t": 1484.2333333333333, "x": "そして、違うと発表している。"}, {"t": 1486.3333333333333, "x": "三人目は、ケネス・クリスチャンセンさんだ。"}, {"t": 1489.1, "x": "雑誌の記事で名前が出た人だ。"}, {"t": 1491.1333333333334, "x": "FBIは、人物像が合わないと発表している。"}, {"t": 1494.1666666666667, "x": "さらに、この人は熟練の落下傘兵だった。"}, {"t": 1497.2, "x": "それだと逆に合わないの。"}, {"t": 1498.8666666666666, "x": "そこは次の章で話す。"}, {"t": 1500.4666666666667, "x": "この3人以外にも、名前は挙がり続けている。"}, {"t": 1503.3333333333333, "x": "だが、FBIが犯人と認めた\n人は、今のところ一人もいない。"}, {"t": 1507.5166666666667, "x": "そして2016年の発表のあと、\nFBIは新しい発表をしていない。"}, {"t": 1512.1833333333334, "x": "最近も話は出てるんでしょ。"}, {"t": 1514.15, "x": "出ている。新しい物が\n見つかった、という話も出ている。"}, {"t": 1517.6666666666667, "x": "ただ、FBIの公式な発表は2016年のものが最後だ。"}, {"t": 1521.7833333333333, "x": "だからこの動画では、その先へ踏み込まない。"}, {"t": 1524.5833333333333, "x": "どうして。"}, {"t": 1525.4333333333334, "x": "名前を出された人には、家族がいるからだ。"}, {"t": 1528.1, "x": "確かめられていない段階で名前を\n並べると、その家族が背負うことになる。"}, {"t": 1532.4833333333333, "x": "FBIが「犯人だ」と言った人は、\n55年たっても一人もいない。"}, {"t": 1536.95, "x": "私たちがここで決めていい話ではない。"}, {"t": 1540.05, "x": "この事件でいちばん割れているのが、ここだ。"}, {"t": 1542.5666666666666, "x": "飛び降りた男は、生きて地面に着いたのか。"}, {"t": 1545.3666666666666, "x": "どっちなの。"}, {"t": 1546.3166666666666, "x": "決まっていない。だから両方を並べる。"}, {"t": 1548.6, "x": "まず、FBIの側の見方だ。"}, {"t": 1550.6833333333334, "x": "担当した捜査官は、こう話している。"}, {"t": 1553.1833333333334, "x": "最初は、経験のある降下者だろうと考えていた。"}, {"t": 1556.2333333333333, "x": "だが数年で、そうではないという結論になった、と。"}, {"t": 1559.4666666666667, "x": "理由はこうだ。"}, {"t": 1560.4166666666667, "x": "真っ暗な夜に、雨の中を、正面から時速200\nマイルの風を受けて飛び降りている。"}, {"t": 1565.4833333333333, "x": "履いていたのは、薄い革靴だ。"}, {"t": 1567.5166666666667, "x": "着ていたのは、トレンチコートだった。"}, {"t": 1569.8, "x": "山に降りる格好じゃないわね。"}, {"t": 1571.7, "x": "さらに、使ったパラシュートには\n操作する仕組みが無かった。"}, {"t": 1575.1333333333334, "x": "向きを変えられない型だ。"}, {"t": 1576.65, "x": "そして予備のほうは、縫い閉じられた訓練用だった。"}, {"t": 1579.6666666666667, "x": "慣れた人なら、渡された時点で確かめる。"}, {"t": 1582.45, "x": "確かめていない。"}, {"t": 1583.5333333333333, "x": "だからFBIの担当官は、生きて\n降りられた見込みは低いと話している。"}, {"t": 1587.8833333333334, "x": "ここからは、反対側の見方だ。"}, {"t": 1590.1, "x": "体も、パラシュートも、見つかっていない。"}, {"t": 1592.6833333333334, "x": "18日間の捜索でも、その後の何十年でも出ていない。"}, {"t": 1596.5666666666666, "x": "落ちたなら、何か出そうなものね。"}, {"t": 1598.8333333333333, "x": "その通りだ。だから「降りられた」と考える人もいる。"}, {"t": 1602.3, "x": "1980年に出てきた5,800ドルも、両方に読める。"}, {"t": 1606.4333333333334, "x": "落ちた人の荷物が流れた、とも読めるし、\n降りた人が落とした、とも読める。"}, {"t": 1611.1333333333334, "x": "どちらが正しいかは、決まっていない。"}, {"t": 1613.3333333333333, "x": "この動画でも決めない。"}, {"t": 1614.6833333333334, "x": "ここで一つ、はっきりさせておきたいことがある。"}, {"t": 1617.5333333333333, "x": "55年たっても、体は見つかっていない。"}, {"t": 1620.2333333333333, "x": "パラシュートも見つかっていない。"}, {"t": 1621.9333333333334, "x": "金も、5,800ドルを除いて見つかっていない。"}, {"t": 1625.1166666666666, "x": "何も出ていないのね。"}, {"t": 1626.5833333333333, "x": "何も出ていない。"}, {"t": 1627.6333333333334, "x": "「出ていない」は、どちらの説の証拠にもならない。"}, {"t": 1630.6, "x": "深い森で、雨で、川がある土地だ。"}, {"t": 1633.0333333333333, "x": "落ちていても見つからない場所はいくらでもある。"}, {"t": 1635.5, "x": "だから「見つからない＝生きている」とは言えない。"}, {"t": 1638.3333333333333, "x": "同時に、「落ちた」と決めることもできない。"}, {"t": 1640.9333333333334, "x": "この事件は、そこで止まっている。"}, {"t": 1643.65, "x": "もう一つ、名前の話がある。"}, {"t": 1645.6833333333334, "x": "切符に書かれていたダン・クーパーという名前だ。"}, {"t": 1648.2333333333333, "x": "この名前と同じ主人公が出てくる漫画が、当時あった。"}, {"t": 1651.8, "x": "漫画。"}, {"t": 1652.5333333333333, "x": "フランス語圏で出ていた連続ものだ。"}, {"t": 1654.7666666666667, "x": "主人公はカナダ空軍のテストパイロットで、\n名前はダン・クーパー。"}, {"t": 1658.5666666666666, "x": "事件のころに出た号の表紙で、\nその主人公がパラシュートで降りている。"}, {"t": 1662.7333333333333, "x": "偶然にしては、できすぎね。"}, {"t": 1664.7666666666667, "x": "FBIの担当官も、そこに目を付けた。"}, {"t": 1667.5, "x": "この漫画は、英語には訳されていない。"}, {"t": 1669.8166666666666, "x": "つまり、英語圏だけで\n暮らしていた人は、まず知らない。"}, {"t": 1673.1666666666667, "x": "そこから担当官は、こう考えた。"}, {"t": 1675.4666666666667, "x": "この人物は、海外にいた\n時期があるのではないか、と。"}, {"t": 1678.7666666666667, "x": "ただし、これは見立てだ。"}, {"t": 1680.2, "x": "裏付けは取れていない。"}, {"t": 1681.5666666666666, "x": "担当官が描いた人物像も、公式ページに載っている。"}, {"t": 1685.0666666666666, "x": "空軍にいて、ヨーロッパに\n駐在したことがあるのではないか。"}, {"t": 1688.55, "x": "飛行機に貨物を積む仕事をしていたのではないか。"}, {"t": 1691.4666666666667, "x": "それなら727の後ろの階段も知っている。"}, {"t": 1694.2666666666667, "x": "ただし、飛び降りる技術までは持っていない。"}, {"t": 1696.85, "x": "知ってはいるけど、できはしない。"}, {"t": 1698.8833333333334, "x": "そういう人物像だ。あくまで\n見立てとして読んでほしい。"}, {"t": 1702.05, "x": "2009年には、民間の研究者にも協力を求めている。"}, {"t": 1705.8166666666666, "x": "恐竜の骨を研究している人が中心になったチームだ。"}, {"t": 1709.2333333333333, "x": "この人たちは、電子顕微鏡で\nネクタイに付いた粒子を調べた。"}, {"t": 1713.05, "x": "花粉が付いていれば、\nどの地域にいたかの手がかりになる。"}, {"t": 1716.3, "x": "川の流れも調べた。札束がどこから\n流れてきたかを出すためだ。"}, {"t": 1720.45, "x": "それでも、名前には届いていない。"}, {"t": 1723.15, "x": "ここで、いやな話を一つしておく。"}, {"t": 1725.4666666666667, "x": "この男は、長いあいだ英雄のように扱われてきた。"}, {"t": 1728.8, "x": "乗っ取った人が。"}, {"t": 1730.1, "x": "そうだ。"}, {"t": 1730.7333333333333, "x": "事件のあと、地元では文字を\n入れたシャツが売られた。"}, {"t": 1733.75, "x": "書いてあったのは、こうだ。"}, {"t": 1735.3166666666666, "x": "「D.B.クーパー、どこにいる」"}, {"t": 1736.95, "x": "降下したと見られる地域の小さな町では、\n1976年から毎年、集まりが開かれるようになった。"}, {"t": 1743.7166666666667, "x": "11月24日に、酒場に人が集まる。"}, {"t": 1746.7333333333333, "x": "本人が紛れているかもしれない、と\n言い合いながら飲む集まりだ。"}, {"t": 1750.4333333333334, "x": "……お祭りにしちゃったのね。"}, {"t": 1752.05, "x": "1981年には映画にもなっている。"}, {"t": 1754.9, "x": "当時の大きな俳優が出ている作品だ。"}, {"t": 1757.3333333333333, "x": "なぜ英雄になったのか。"}, {"t": 1758.65, "x": "当時、その理由を調べた研究者がいる。"}, {"t": 1761.3, "x": "ワシントン大学の社会学の研究者だ。"}, {"t": 1763.9166666666667, "x": "その人は、こう説明している。"}, {"t": 1765.9833333333333, "x": "人と機械の勝負で、人のほうが勝った、と見られた。"}, {"t": 1769.4, "x": "一人の男が、技術と会社と仕組みを出し抜いた。"}, {"t": 1772.6, "x": "だから、金持ちから奪う義賊のように見えた。"}, {"t": 1775.4, "x": "貧しい人に配ったかどうかは、\nこの際どうでもよかった、と。"}, {"t": 1779.1666666666667, "x": "都合よく見たいだけじゃない。"}, {"t": 1780.8666666666666, "x": "そのとおりだ。"}, {"t": 1781.7833333333333, "x": "ただ、事実のほうも見ておきたい。"}, {"t": 1783.8666666666666, "x": "この男は、爆弾だと言った物を機内に持ち込んでいる。"}, {"t": 1787.2666666666667, "x": "36人の乗客と、6人の乗務員がそこにいた。"}, {"t": 1790.7833333333333, "x": "客室乗務員は、3時間近くその物の隣に座り続けた。"}, {"t": 1794.95, "x": "誰も怪我をしなかったのは、\n結果であって、狙いではない。"}, {"t": 1798.5, "x": "一つ間違えたら、全然違う事件よね。"}, {"t": 1801.4, "x": "全然違う。そこは忘れないでおきたい。"}, {"t": 1804.5166666666667, "x": "この事件には、もう一つの側面がある。"}, {"t": 1807.1166666666666, "x": "アメリカの航空当局が出している\n公式の年表を見てほしい。"}, {"t": 1810.7166666666667, "x": "1971年11月24日の欄に、こう書いてある。"}, {"t": 1814.8333333333333, "x": "身代金を要求する一連のハイジャックの、\n最初の事件である、と。"}, {"t": 1819.1166666666666, "x": "最初。"}, {"t": 1819.8666666666666, "x": "この後が、ひどい。"}, {"t": 1821.2, "x": "1971年12月24日、同じように金と\nパラシュートを要求する事件が起きた。"}, {"t": 1827.1166666666666, "x": "ちょうど1か月後だ。"}, {"t": 1828.4166666666667, "x": "そしてその後の6か月で、\n同じ形の要求が17件起きている。"}, {"t": 1832.8, "x": "半年で17件。"}, {"t": 1834.3, "x": "真似する人が次々に出た。"}, {"t": 1836.1833333333334, "x": "航空当局は、そこから急いで規則を作っていく。"}, {"t": 1839.45, "x": "1972年2月2日、乗客と手荷物を\n調べる仕組みを義務にした。"}, {"t": 1844.4833333333333, "x": "それでも足りなかった。"}, {"t": 1845.8833333333334, "x": "1972年12月5日、緊急の規則が出る。"}, {"t": 1849.7333333333333, "x": "1973年1月5日から、手荷物は全部調べる。"}, {"t": 1853.85, "x": "乗客は全員、金属探知機を通す。"}, {"t": 1856.3833333333334, "x": "探知機が無い空港では、体を触って調べる。"}, {"t": 1859.3333333333333, "x": "断れば、飛行機には乗せない。"}, {"t": 1861.5166666666667, "x": "今と同じね。"}, {"t": 1862.65, "x": "今と同じだ。ここが始まりだ。"}, {"t": 1864.7666666666667, "x": "それまでは、怪しいと見た人だけを調べていた。"}, {"t": 1867.65, "x": "どれくらいの割合か。"}, {"t": 1869.0166666666667, "x": "1日に飛行機へ乗る50万人のうち、\nおよそ1パーセントだ。"}, {"t": 1872.85, "x": "それが全員になった。"}, {"t": 1874.2666666666667, "x": "さらに1973年2月5日から、531の空港に\n警察官を置くことになった。"}, {"t": 1880.4, "x": "搭乗口のそばに立たせる決まりだ。"}, {"t": 1882.6, "x": "私たちが今、空港でかばんを開けて機械を\n通っているのは、この年に始まっている。"}, {"t": 1887.6666666666667, "x": "きっかけの一つが、1971年11月24日の夜だった。"}, {"t": 1893.1, "x": "最後に、数字で整理しておく。"}, {"t": 1895.1, "x": "1971年11月24日。"}, {"t": 1897.8666666666666, "x": "ポートランド発シアトル行き、305便。"}, {"t": 1900.4833333333333, "x": "乗客36人。乗務員6人。"}, {"t": 1902.9333333333334, "x": "渡した現金は20万ドル。"}, {"t": 1904.6666666666667, "x": "20ドル札で1万枚。"}, {"t": 1906.25, "x": "袋の重さは19ポンド。"}, {"t": 1908.1, "x": "渡したパラシュートは4つ。消えたのは2つ。"}, {"t": 1910.8833333333334, "x": "飛び降りたのは午後8時13分ごろ。"}, {"t": 1913.0333333333333, "x": "高度はおよそ1万フィート。"}, {"t": 1914.75, "x": "速度は時速196マイル。"}, {"t": 1916.7666666666667, "x": "雲の底は5,000フィート。雨だった。"}, {"t": 1919.1666666666667, "x": "捜索は18日間。地上には\n300人を超える兵士が入った。"}, {"t": 1923.2333333333333, "x": "出てきたものは、無い。"}, {"t": 1924.6833333333334, "x": "5年で800人以上を調べ、\n24人前後まで絞り、そこで止まった。"}, {"t": 1929.25, "x": "1976年、名前の空いた起訴状が作られた。"}, {"t": 1932.9, "x": "1980年2月10日、8歳の子どもが\n砂の中から290枚を掘り出した。"}, {"t": 1938.55, "x": "5,800ドルだ。"}, {"t": 1939.9333333333334, "x": "残りの19万4,200ドルは、今日まで1枚も出ていない。"}, {"t": 1943.9666666666667, "x": "2016年7月8日、FBIは捜査に\n割いていた人手を他へ回した。"}, {"t": 1948.8, "x": "発表の文にはこうある。"}, {"t": 1950.3166666666666, "x": "この件で得た証拠は、\n歴史の資料として本部で保管する、と。"}, {"t": 1954.2, "x": "そして、こう付け加えている。"}, {"t": 1956.0333333333333, "x": "もし物証が出てきたら、\n最寄りの事務所に連絡してほしい。"}, {"t": 1959.5, "x": "パラシュートか、あの金だ。"}, {"t": 1961.3666666666666, "x": "まだ待ってるのね。"}, {"t": 1962.65, "x": "待っている。終わったとは書いていない。"}, {"t": 1964.7166666666667, "x": "ここで、今回の話の出どころを並べておく。"}, {"t": 1967.5833333333333, "x": "事件の経過と捜査の中身は、FBIの公式ページ、\n著名事件のD.B.クーパーの項。"}, {"t": 1972.9333333333334, "x": "担当官の見立てと人物像は、FBIが\n2007年12月と2009年3月に出した記事。"}, {"t": 1979.1166666666666, "x": "捜査を終える発表は、FBI\nシアトル事務所の2016年7月12日の公式発表。"}, {"t": 1984.85, "x": "切符の記録は、FBIの公式ページの所蔵品の項。"}, {"t": 1988.4, "x": "1980年の発見と裁判の経緯は、\nワシントン州の歴史記録事業ヒストリーリンクの記事。"}, {"t": 1994.5833333333333, "x": "現地の捜索と機内に残された物は、\n地元紙ザ・コロンビアンの記録。"}, {"t": 1999.15, "x": "模倣事件の件数と空港の検査の規則は、\nアメリカ連邦航空局の公式年表だ。"}, {"t": 2004.5666666666666, "x": "出どころは以上だ。話を、残った物に戻す。"}, {"t": 2007.7, "x": "残っている物を並べると、こうなる。"}, {"t": 2009.9166666666667, "x": "黒いネクタイ。ネクタイ留め。"}, {"t": 2011.6, "x": "パラシュート2つ。290枚の紙幣。"}, {"t": 2014.3333333333333, "x": "現金で買われた1枚の切符。"}, {"t": 2016.3833333333334, "x": "残っていないものは、一つだけだ。"}, {"t": 2018.75, "x": "名前。"}, {"t": 2019.4666666666667, "x": "名前だ。"}, {"t": 2020.1666666666667, "x": "日本でも、1970年に旅客機が\n乗っ取られる事件が起きている。"}, {"t": 2024.5833333333333, "x": "よど号事件だ。"}, {"t": 2025.7166666666667, "x": "あちらは、乗っ取った人たちの名前が分かっている。"}, {"t": 2028.6666666666667, "x": "この事件は、その逆になった。"}, {"t": 2030.75, "x": "目的ははっきりしている。金だ。"}, {"t": 2032.9666666666667, "x": "やり方も分かっている。"}, {"t": 2034.2333333333333, "x": "飛び方も、時刻も、高度も分かっている。"}, {"t": 2037.0, "x": "分かっていないのは、誰がやったかだけだ。"}, {"t": 2039.6, "x": "全部そろってるのに、そこだけ空いてるのね。"}, {"t": 2042.35, "x": "そこだけ空いている。"}, {"t": 2043.4, "x": "55年、空いたままだ。"}, {"t": 2045.2333333333333, "x": "ひとつ、聞いていい。"}, {"t": 2046.6, "x": "どうぞ。"}, {"t": 2047.3, "x": "この人、ずっとかっこよく語られてきたのよね。"}, {"t": 2050.35, "x": "語られてきた。シャツにもなったし、映画にもなった。"}, {"t": 2053.5833333333335, "x": "誰も命を落としていないから、物語として扱いやすい。"}, {"t": 2057.2166666666667, "x": "ただ、私はそこで終わらせたくない。"}, {"t": 2059.5333333333333, "x": "あの機内には乗客が36人、乗務員が6人いた。"}, {"t": 2063.116666666667, "x": "そのうちの一人は、爆弾だと言われた\n物の隣に3時間近く座り続けている。"}, {"t": 2068.25, "x": "……こわかったでしょうね。"}, {"t": 2069.6, "x": "誰も怪我をしなかったのは結果であって、\nそう狙われていたわけではない。"}, {"t": 2073.616666666667, "x": "かっこいい話のかげに、\nその3時間があったことは忘れたくない。"}, {"t": 2077.5333333333333, "x": "名前の欄は、今日も空いたままだ。"}, {"t": 2079.6, "x": "埋まる日が来るのかどうかも、分からない。"}, {"t": 2081.9333333333334, "x": "この回で気になったところがあれば、\nコメントに書いてもらえるとうれしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;

}
function mark(pane,i){

  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
