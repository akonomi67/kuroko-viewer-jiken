<script>
const D={"name": "105", "file": "105_編集用", "dur": 2085.46665625, "segs": [], "subs": [{"t": 0.0, "x": "2016年7月8日。"}, {"t": 1.95, "x": "アメリカのFBIが、ひとつの事件から手を引いた。"}, {"t": 5.2, "x": "手を引いた？"}, {"t": 6.133333333333334, "x": "捜査に人を割くのを、そこでやめたということだ。"}, {"t": 9.05, "x": "その事件が起きたのは1971年11月24日。"}, {"t": 13.166666666666666, "x": "45年たっていた。"}, {"t": 14.666666666666666, "x": "旅客機が乗っ取られて、20万ドルが渡された。"}, {"t": 17.7, "x": "男はその金を持って、飛んでいる機体から飛び降りた。"}, {"t": 21.05, "x": "飛び降りた？　パラシュートで？"}, {"t": 22.816666666666666, "x": "そうだ。夜の雨の中を、パラシュートで降りていった。"}, {"t": 25.966666666666665, "x": "それきり、誰も見ていない。"}, {"t": 27.65, "x": "名前も分かっていない。"}, {"t": 28.833333333333332, "x": "どこへ行ったのかも分かっていない。"}, {"t": 30.75, "x": "アメリカの旅客機のハイジャックで、犯人が\n最後まで分からないまま残っている事件。"}, {"t": 35.483333333333334, "x": "それは、この1件だけだ。"}, {"t": 37.38333333333333, "x": "1件だけ？"}, {"t": 38.416666666666664, "x": "ほかは全部、誰がやったかまでは分かっている。"}, {"t": 41.1, "x": "この事件には名前がある。"}, {"t": 42.53333333333333, "x": "D.B.クーパー事件だ。"}, {"t": 44.0, "x": "ただ、その名前は本人が名乗ったものではない。"}, {"t": 46.88333333333333, "x": "新聞社の打ち間違いから生まれた名前だ。"}, {"t": 49.53333333333333, "x": "打ち間違い。"}, {"t": 50.53333333333333, "x": "そこも、あとで話す。"}, {"t": 52.06666666666667, "x": "今回は、45年ぶんの記録に何が残って、\n何が残らなかったかを数えていく。"}, {"t": 57.35, "x": "先に言っておく。この動画では、\n誰が犯人かを決めない。"}, {"t": 60.95, "x": "決めないの。"}, {"t": 61.9, "x": "調べた側が決めていないからだ。"}, {"t": 63.9, "x": "名前が挙がった人は何人もいる。だが、\n誰ひとり犯人とは認められていない。"}, {"t": 68.6, "x": "まず、起きたことだけを順番に見ていく。"}, {"t": 71.71666666666667, "x": "1971年11月24日。"}, {"t": 74.65, "x": "アメリカの感謝祭の、前の日だ。"}, {"t": 76.96666666666667, "x": "日本で言う、大きな祝日の前日ね。"}, {"t": 79.66666666666667, "x": "そうだ。空港が一年でいちばん混む週でもある。"}, {"t": 82.56666666666666, "x": "オレゴン州、ポートランド国際空港。"}, {"t": 84.88333333333334, "x": "ノースウエスト・オリエント航空のカウンターに、\n一人の男が来た。"}, {"t": 88.58333333333333, "x": "シアトル行きの片道切符を、現金で買った。"}, {"t": 91.58333333333333, "x": "現金。"}, {"t": 92.36666666666666, "x": "20ドル札1枚だ。切符の控えには、\n赤いインクで名前が書かれている。"}, {"t": 96.88333333333334, "x": "大文字で、DAN COOPER。ダン・クーパー。"}, {"t": 99.65, "x": "この切符は、今もFBIが保管している。"}, {"t": 102.26666666666667, "x": "写真も公開されている。"}, {"t": 103.91666666666667, "x": "便名は305便。機体はボーイング727。"}, {"t": 106.93333333333334, "x": "ポートランドからシアトルまでの、短い路線だ。"}, {"t": 109.76666666666667, "x": "乗客は36人。乗務員は、\n操縦室に3人、客室に3人だった。"}, {"t": 114.98333333333333, "x": "それだけの人数なのね。"}, {"t": 116.65, "x": "感謝祭の前日にしては、空いていた。"}, {"t": 119.15, "x": "男は黒いスーツに白いシャツ、黒いネクタイ。"}, {"t": 121.95, "x": "上にレインコートを着て、色の濃い\nサングラスをかけていた。"}, {"t": 125.2, "x": "あとで乗務員が話した人物像は、こうだ。"}, {"t": 127.93333333333334, "x": "年のころは40代半ば。"}, {"t": 129.6, "x": "身長は5フィート10インチから6フィート。"}, {"t": 132.03333333333333, "x": "日本で言うと、178センチから183センチくらいだ。"}, {"t": 136.11666666666667, "x": "体重は170から180ポンド。"}, {"t": 138.51666666666668, "x": "77キロから82キロほど。"}, {"t": 140.9, "x": "目は茶色。肌は浅黒く、落ち着いていた。"}, {"t": 143.68333333333334, "x": "男は機内のいちばん後ろの列に座った。"}, {"t": 146.31666666666666, "x": "離陸を待つあいだに、飲み物を頼んでいる。"}, {"t": 148.81666666666666, "x": "バーボンとソーダだ。"}, {"t": 150.13333333333333, "x": "ずいぶん落ち着いてるのね。"}, {"t": 151.73333333333332, "x": "この落ち着きは、最後まで変わらなかった。"}, {"t": 154.28333333333333, "x": "地元紙に残っている記録では、こうまとめられている。"}, {"t": 157.43333333333334, "x": "落ち着いていて、計算していて、\n物腰は丁寧だった、と。"}, {"t": 161.26666666666668, "x": "丁寧。"}, {"t": 162.0, "x": "ただし、同じ記録にはこうも書いてある。"}, {"t": 164.43333333333334, "x": "落ち着いているが、ときに口汚く、\n強く要求することもあった、と。"}, {"t": 168.88333333333333, "x": "……感じのいい人、ではないのね。"}, {"t": 170.95, "x": "そこは分けて考えたほうがいい。"}, {"t": 172.76666666666668, "x": "この事件は、犯人が英雄のように語られてきた。"}, {"t": 175.88333333333333, "x": "その話も、あとでする。"}, {"t": 177.63333333333333, "x": "はっきりしているのは、勢いでやった\n人ではないということだ。"}, {"t": 181.73333333333332, "x": "午後3時を少し回ったころだ。"}, {"t": 183.73333333333332, "x": "男は、客室乗務員に一枚のメモを手渡した。"}, {"t": 186.96666666666667, "x": "受け取ったのはフローレンス・シャフナーさんだった。"}, {"t": 189.71666666666667, "x": "シャフナーさんは、それを読まずにポケットへ入れた。"}, {"t": 192.61666666666667, "x": "読まなかったの。"}, {"t": 193.8, "x": "この手の紙は、たいてい電話番号だからだ。"}, {"t": 196.45, "x": "機内で乗務員に紙を渡す客は、めずらしくなかった。"}, {"t": 199.86666666666667, "x": "ところが男は、歩き出した\nシャフナーさんを呼び止めた。"}, {"t": 203.08333333333334, "x": "そして小さな声で言った。"}, {"t": 204.75, "x": "「それを読んでください」"}, {"t": 205.98333333333332, "x": "紙にはこう書いてあった。"}, {"t": 207.48333333333332, "x": "「私は爆弾を持っている」"}, {"t": 208.98333333333332, "x": "……。"}, {"t": 209.91666666666666, "x": "男は続けて、自分の隣に座るように言った。"}, {"t": 213.01666666666668, "x": "シャフナーさんは、言われたとおりにした。"}, {"t": 215.23333333333332, "x": "ここから3時間近く、この機体は\n乗っ取られた状態で飛び続ける。"}, {"t": 219.36666666666667, "x": "ただ、この事件には一つ、他と違うところがある。"}, {"t": 222.78333333333333, "x": "違うところ。"}, {"t": 223.8, "x": "怪我をした人が、一人も出ていない。"}, {"t": 226.13333333333333, "x": "乗客36人は、シアトルで全員が降りている。"}, {"t": 229.41666666666666, "x": "全員。"}, {"t": 230.13333333333333, "x": "全員だ。乗務員も、3人のうち2人が降りている。"}, {"t": 233.45, "x": "この事件で体を傷つけられた人は、一人もいない。"}, {"t": 236.8, "x": "暴れてもいないし、機体を壊してもいない。"}, {"t": 239.31666666666666, "x": "やったことは、紙を一枚渡して、金を\n受け取って、飛び降りただけだ。"}, {"t": 243.78333333333333, "x": "……それだけなのに、45年。"}, {"t": 245.81666666666666, "x": "それだけだから45年かかった、とも言える。"}, {"t": 248.66666666666666, "x": "残された物が、あまりにも少ない。"}, {"t": 250.93333333333334, "x": "この先ずっと、その「少なさ」の話をすることになる。"}, {"t": 255.38333333333333, "x": "男は、安物のアタッシェケースを持っていた。"}, {"t": 258.1666666666667, "x": "それを少しだけ開けて、中を見せている。"}, {"t": 260.7, "x": "FBIの記録では、電線の束と、\n赤い色をした棒が見えた。"}, {"t": 264.6166666666667, "x": "電池も入っていたと記録されている。"}, {"t": 266.93333333333334, "x": "爆弾に見える物ね。"}, {"t": 268.5, "x": "本物だったのかどうかは、今も分かっていない。"}, {"t": 271.3, "x": "中身が確かめられる前に、\n男は機体から降りてしまった。"}, {"t": 274.93333333333334, "x": "男は、乗務員に自分の要求を書き取らせた。"}, {"t": 277.95, "x": "その紙が操縦室へ運ばれる。"}, {"t": 280.0, "x": "要求は二つだった。"}, {"t": 281.46666666666664, "x": "20万ドルの現金。全部20ドル札で。"}, {"t": 284.21666666666664, "x": "それと、パラシュートを4つ。"}, {"t": 286.1, "x": "4つ。一人なのに。"}, {"t": 287.73333333333335, "x": "ここが、この事件のいちばん不気味なところだ。"}, {"t": 290.5, "x": "4つ要求するということは、誰かを\n道連れにできる、という意味になる。"}, {"t": 294.65, "x": "人質と一緒に飛び降りるかもしれない。"}, {"t": 296.98333333333335, "x": "そう思わせれば、地上は細工のしようがない。"}, {"t": 299.6, "x": "使えないパラシュートを渡せなくなるのね。"}, {"t": 302.1, "x": "そのとおりだ。だから\n4つだったのだろう、と言われている。"}, {"t": 305.35, "x": "ただ、本人がそう言ったわけではない。ここは推測だ。"}, {"t": 308.71666666666664, "x": "男は、パラシュートの出どころも指定している。"}, {"t": 311.4166666666667, "x": "タコマのマコード空軍基地から持ってこさせた。"}, {"t": 314.1666666666667, "x": "そして乗務員に、こう言っている。"}, {"t": 316.1666666666667, "x": "余計なことはするな、と。"}, {"t": 317.81666666666666, "x": "この男は、上空からタコマの街が\n見分けられるとも話している。"}, {"t": 321.71666666666664, "x": "この土地を知っている、という意味に取れる言葉だ。"}, {"t": 324.6333333333333, "x": "地元の人なのかしら。"}, {"t": 326.3333333333333, "x": "そう考える人は多い。ただ、\nそれも確かめられていない。"}, {"t": 329.76666666666665, "x": "ここで一度、要求の中身を並べておく。"}, {"t": 332.4, "x": "現金20万ドル。20ドル札で。"}, {"t": 334.78333333333336, "x": "パラシュート4つ。持ってくる場所はマコード空軍基地。"}, {"t": 337.95, "x": "そして、シアトルに着いたら燃料を入れること。"}, {"t": 340.78333333333336, "x": "全部そろえられたのね。"}, {"t": 342.35, "x": "そろえられた。地上は、そのとおりに用意している。"}, {"t": 345.28333333333336, "x": "この事件では、地上が一度も逆らっていない。"}, {"t": 348.0833333333333, "x": "乗っている人がいるからだ。"}, {"t": 349.68333333333334, "x": "結果として、要求は全部通った。"}, {"t": 352.68333333333334, "x": "20万ドルを、全部20ドル札でそろえる。"}, {"t": 355.43333333333334, "x": "枚数にすると1万枚だ。"}, {"t": 357.35, "x": "1万枚。"}, {"t": 358.31666666666666, "x": "用意したのはシアトル第一国立銀行だ。"}, {"t": 360.96666666666664, "x": "渡す前に、紙幣の番号をすべて\nマイクロフィルムに写している。"}, {"t": 364.65, "x": "これがあとで効いてくる。"}, {"t": 366.0, "x": "金は袋に詰められた。"}, {"t": 367.6166666666667, "x": "袋の重さは19ポンド。"}, {"t": 369.23333333333335, "x": "8.6キロほどだ。"}, {"t": 370.73333333333335, "x": "大きさは、縦11インチ、横12インチ、厚さ6.5インチ。"}, {"t": 374.85, "x": "だいたい、大きめの菓子箱くらいの塊になる。"}, {"t": 377.9, "x": "それを体にくくりつけて飛ぶの。"}, {"t": 380.06666666666666, "x": "そういうことになる。"}, {"t": 381.25, "x": "なぜ20ドル札という小さい札だったのか。"}, {"t": 383.9, "x": "これは男の指定だ。"}, {"t": 385.3, "x": "ただ、FBIの担当官は後年こう話している。"}, {"t": 388.45, "x": "小さい札で渡したのは、重くして\n動きを鈍らせる狙いもあった、と。"}, {"t": 392.8333333333333, "x": "札束が重しになるのね。"}, {"t": 394.7, "x": "大きい札なら、同じ金額でも束はずっと薄くなる。"}, {"t": 398.01666666666665, "x": "ちなみに当時の20万ドルは、\n2024年の価値でおよそ150万ドルにあたる。"}, {"t": 403.03333333333336, "x": "日本円に置き換えるのは、\n為替で変わるのでやめておく。"}, {"t": 406.2, "x": "ここでは、今の感覚で\n2億円前後の塊だと思ってもらえばいい。"}, {"t": 410.4166666666667, "x": "その番号を全部写したの。渡す前に。"}, {"t": 413.1666666666667, "x": "写した。1万枚ぶんだ。"}, {"t": 414.98333333333335, "x": "これが、この事件でいちばん効いた準備になる。"}, {"t": 417.71666666666664, "x": "紙幣には1枚ずつ違う番号が印刷されている。"}, {"t": 420.71666666666664, "x": "使われれば、いつか銀行で見つかる。"}, {"t": 423.03333333333336, "x": "つまり、この20万ドルは使えない金になった。"}, {"t": 426.1, "x": "使ったら足がつくのね。"}, {"t": 427.8, "x": "つく。だから、この金がどこかで使われた\n形跡は無いかが、ずっと調べられてきた。"}, {"t": 432.95, "x": "結果から言うと、使われた形跡は一度も出ていない。"}, {"t": 436.1333333333333, "x": "出てきたのは、9年後に砂から掘り出された束だけだ。"}, {"t": 440.18333333333334, "x": "機体がシアトル・タコマ空港に\n降りたのは、午後5時39分だ。"}, {"t": 444.1, "x": "すぐには駐機場に入っていない。"}, {"t": 446.06666666666666, "x": "金とパラシュートがそろうまで、\n上空と地上で時間を稼いでいる。"}, {"t": 449.8666666666667, "x": "そろったところで、機体は指定された場所に止まった。"}, {"t": 453.01666666666665, "x": "ここで取引がおこなわれる。"}, {"t": 454.76666666666665, "x": "男は、乗客36人を降ろした。"}, {"t": 457.3333333333333, "x": "客室乗務員も、3人のうち2人が降りている。"}, {"t": 460.55, "x": "全員は降りなかったのね。"}, {"t": 462.25, "x": "残ったのは、操縦室の3人と、客室乗務員が1人。"}, {"t": 466.1666666666667, "x": "残った乗務員は、ティナ・マックロウさんだった。"}, {"t": 469.05, "x": "マックロウさんは、シアトルに\n降りる前からずっと男の隣にいた。"}, {"t": 472.78333333333336, "x": "メモを受け取ったシャフナーさんと\n交代して、そばに座り続けている。"}, {"t": 476.8333333333333, "x": "一番近くで見ていた人ね。"}, {"t": 478.85, "x": "だからこの人の記憶が、人物像の土台になっている。"}, {"t": 482.26666666666665, "x": "機体には燃料が入れられた。"}, {"t": 484.0, "x": "この給油に、ずいぶん時間がかかっている。"}, {"t": 486.53333333333336, "x": "男は、それを何度も急がせた。"}, {"t": 488.73333333333335, "x": "そして次の行き先を告げた。"}, {"t": 490.6166666666667, "x": "メキシコシティだ。"}, {"t": 491.81666666666666, "x": "国外へ出るつもりだったの。"}, {"t": 493.6666666666667, "x": "そう見えるが、この機体では届かない。"}, {"t": 495.93333333333334, "x": "途中で給油がいる。だから乗務員は\nネバダ州のリノを経由に選んだ。"}, {"t": 499.9166666666667, "x": "男は、それを認めている。"}, {"t": 501.85, "x": "話が通じる相手なのね。"}, {"t": 503.71666666666664, "x": "そこも、この事件の特徴だ。"}, {"t": 505.78333333333336, "x": "無理を言って機体を落とすような要求はしていない。"}, {"t": 508.45, "x": "飛べる条件の中で、いちばん\n飛び降りやすい形を選んでいる。"}, {"t": 512.0666666666667, "x": "シアトルで機体が止まっていたのは、\n2時間近くになる。"}, {"t": 515.4, "x": "午後5時39分に降りて、次に\n離陸したのが午後7時40分だ。"}, {"t": 519.95, "x": "2時間も地上にいたのね。"}, {"t": 521.7166666666667, "x": "いた。だが、そのあいだに誰も\n機内へ踏み込んでいない。"}, {"t": 524.9333333333333, "x": "中に人がいる以上、手を出せなかった。"}, {"t": 528.0, "x": "午後7時40分。機体はシアトルをもう一度離陸した。"}, {"t": 531.45, "x": "このとき男が出した飛び方の条件が、細かい。"}, {"t": 534.5833333333334, "x": "高度は1万フィートより下。"}, {"t": 536.3666666666667, "x": "3,000メートルほどだ。"}, {"t": 537.7833333333333, "x": "主翼のフラップは15度まで下ろしたまま。"}, {"t": 540.2333333333333, "x": "着陸のときの脚も、出したままにさせた。"}, {"t": 543.15, "x": "それ、飛びにくくない。"}, {"t": 544.6833333333333, "x": "飛びにくい。だから速度が出ない。"}, {"t": 546.6833333333333, "x": "この男は、速度が出ない状態を作らせたわけだ。"}, {"t": 549.9, "x": "さらに、機内を与圧しないように指示している。"}, {"t": 552.5833333333334, "x": "与圧というのは、機内の気圧を\n地上に近づける仕組みだ。"}, {"t": 556.0666666666667, "x": "高いところを飛んでも\n息ができるのは、これのおかげだ。"}, {"t": 559.3, "x": "それを切らせたのね。"}, {"t": 560.7166666666667, "x": "外と機内の気圧を同じにしておけば、\n扉を開けても押し戻されない。"}, {"t": 564.85, "x": "つまり、この男は「飛行中に扉を開ける」\n前提で指示を出している。"}, {"t": 569.2166666666667, "x": "ここで一つ、はっきりしていることがある。"}, {"t": 571.7333333333333, "x": "この人物は、727という機体の性質を知っていた。"}, {"t": 575.2666666666667, "x": "ただし、どこで知ったのかは分かっていない。"}, {"t": 577.6833333333333, "x": "機体の後ろには、空軍の飛行機が3機ついた。"}, {"t": 580.7333333333333, "x": "飛び降りる瞬間を見るためだ。"}, {"t": 582.6333333333333, "x": "見えたの。"}, {"t": 583.4666666666667, "x": "見えていない。雲と雨で、何も確認できなかった。"}, {"t": 586.7666666666667, "x": "ここで一つ、大事なことを言っておく。"}, {"t": 589.1333333333333, "x": "この男は、飛び降りる場所を指定していない。"}, {"t": 591.8333333333334, "x": "指定していない。"}, {"t": 593.0166666666667, "x": "メキシコへ飛べ、としか言っていない。"}, {"t": 595.1, "x": "つまり、地上で誰かが\n待っているような降り方ではない。"}, {"t": 598.2166666666667, "x": "仲間がいるなら、落ちる場所を合わせる必要がある。"}, {"t": 601.1666666666666, "x": "そのためには、機長と細かく打ち合わせないと無理だ。"}, {"t": 604.3166666666667, "x": "それをしていない。"}, {"t": 605.35, "x": "だからFBIは、地上に協力者はいなかったと見ている。"}, {"t": 608.9166666666666, "x": "一人でやったのね。"}, {"t": 610.3, "x": "そう見られている。ただ、これも断定はされていない。"}, {"t": 613.9, "x": "ボーイング727には、尾部に階段が付いている。"}, {"t": 616.9333333333333, "x": "機体の後ろの下側から、\n地面に向かって伸びる階段だ。"}, {"t": 620.5333333333333, "x": "空港に搭乗橋が無くても、\n乗り降りできるようにするためのものだ。"}, {"t": 624.55, "x": "便利な仕組みね。"}, {"t": 625.8166666666667, "x": "便利だった。問題は、この階段が\n飛行中でも下ろせたことだ。"}, {"t": 629.7833333333333, "x": "当時、空港の関係者でさえ、それを知らなかった。"}, {"t": 632.9833333333333, "x": "男が要求して、初めて「できる」と\n分かった、と地元紙は書いている。"}, {"t": 637.5666666666667, "x": "午後8時ごろ、男はその階段を下ろさせた。"}, {"t": 640.4833333333333, "x": "そして、残っていたマックロウさんを操縦室へ入れた。"}, {"t": 643.6666666666666, "x": "扉を閉めて、出てこないように言っている。"}, {"t": 646.2166666666667, "x": "一人になりたかったのね。"}, {"t": 647.9833333333333, "x": "そうだ。ここから先を見た人間は、一人もいない。"}, {"t": 651.1666666666666, "x": "操縦室の3人は、扉の向こうで計器だけを見ていた。"}, {"t": 654.6833333333333, "x": "操縦室と客室は、電話でつながっている。"}, {"t": 657.55, "x": "機長は何度か声をかけた。"}, {"t": 659.3, "x": "最後に返事が来たあと、それきり返事は無くなった。"}, {"t": 662.5333333333333, "x": "残されていたのは、開いた後部階段だけだった。"}, {"t": 665.5833333333334, "x": "ちなみに、この機体は後で調べられている。"}, {"t": 668.1666666666666, "x": "機内には指紋も残っていた。ただし、\n誰のものか分からない指紋だ。"}, {"t": 672.45, "x": "照合しても出なかったの。"}, {"t": 674.1833333333333, "x": "出なかった。今日まで、一致する\n人物は見つかっていない。"}, {"t": 677.65, "x": "ついでに言うと、機内には吸い殻も残っていた。"}, {"t": 680.45, "x": "この男は、機内でたばこを吸っている。"}, {"t": 682.9333333333333, "x": "当時は吸えたのよね。"}, {"t": 684.4, "x": "吸えた。だから吸い殻が残った。"}, {"t": 686.5166666666667, "x": "ただし、1971年にはDNAを調べる技術が無い。"}, {"t": 690.55, "x": "この時代にできたのは、指紋と目撃の記憶までだ。"}, {"t": 693.9833333333333, "x": "技術が追いついていなかったのね。"}, {"t": 696.0666666666667, "x": "そこがこの事件のつらいところだ。"}, {"t": 698.1333333333333, "x": "のちにFBIが調べ直せたのは、ネクタイのほうだった。"}, {"t": 702.1666666666666, "x": "午後8時13分。"}, {"t": 703.5666666666667, "x": "操縦室の計器が、小さな変化を記録した。"}, {"t": 706.5833333333334, "x": "機体の圧力が、ほんの一瞬だけ動いた。"}, {"t": 709.4666666666667, "x": "それって。"}, {"t": 710.3333333333334, "x": "後ろで重さが減った、ということだ。"}, {"t": 712.6, "x": "FBIは、これが飛び降りた時刻だと見ている。"}, {"t": 715.3833333333333, "x": "機体はそのとき、ワシントン州の南西部を飛んでいた。"}, {"t": 718.6333333333333, "x": "地元紙は、ルイス川の上空あたりだと書いている。"}, {"t": 721.6333333333333, "x": "速度は時速196マイル。"}, {"t": 723.8, "x": "時速315キロほどだ。"}, {"t": 725.7, "x": "高度はおよそ1万フィート。"}, {"t": 727.3666666666667, "x": "そのときの外の風あたりは、\n氷点下をかなり下回っていた。"}, {"t": 731.2833333333333, "x": "雨も降っていたのよね。"}, {"t": 732.8333333333334, "x": "降っていた。しかも雲が低い。"}, {"t": 734.85, "x": "雲の底は5,000フィートあたりにあった。"}, {"t": 737.0833333333334, "x": "つまり、飛び降りた男から地面は見えていない。"}, {"t": 739.8166666666667, "x": "自分がどこの上空にいるかも、分からなかったはずだ。"}, {"t": 743.0333333333333, "x": "FBIは、降りた場所をポートランドの北およそ20\nマイルの範囲と見ている。"}, {"t": 747.3, "x": "ただ、そこから先は絞れていない。"}, {"t": 749.5, "x": "この「絞れていない」が、この事件のすべてになる。"}, {"t": 752.7166666666667, "x": "範囲は、山と森と川だ。"}, {"t": 754.6, "x": "11月の夜で、雨で、真っ暗だった。"}, {"t": 757.5, "x": "本人も、どこにいるか分からないまま飛んだのね。"}, {"t": 760.5, "x": "そうなる。"}, {"t": 761.1833333333333, "x": "機体は時速300キロを超えて飛んでいる。"}, {"t": 763.6666666666666, "x": "1分で5キロ進む。"}, {"t": 765.0666666666667, "x": "飛び降りた時刻が1分ずれるだけで、\n場所は5キロずれる。"}, {"t": 768.5, "x": "それは探せないわね。"}, {"t": 769.9666666666667, "x": "計器が動いたのは午後8時13分。それは分かっている。"}, {"t": 773.4, "x": "だが、その瞬間に機体が\nどこの真上にいたかは、細かくは分からない。"}, {"t": 777.6333333333333, "x": "当時のやり方では、位置を\nそこまで細かく残せなかった。"}, {"t": 781.1333333333333, "x": "この1分が、この事件をここまで長引かせた。"}, {"t": 784.6833333333333, "x": "機体がリノに降りたのは、午後10時15分だ。"}, {"t": 787.4666666666667, "x": "後部の階段は、下りたままだった。"}, {"t": 789.6666666666666, "x": "滑走路をこすりながら着陸している。"}, {"t": 792.0833333333334, "x": "男はもういないのね。"}, {"t": 793.5666666666667, "x": "いない。金の袋も無い。"}, {"t": 795.2333333333333, "x": "4つ渡したパラシュートのうち、2つが無くなっていた。"}, {"t": 798.5666666666667, "x": "残された機内には、いくつかの物があった。"}, {"t": 801.2833333333333, "x": "黒いネクタイと、そのネクタイ留め。"}, {"t": 803.5166666666667, "x": "吸い殻。そして、さっき話した指紋だ。"}, {"t": 806.2833333333333, "x": "ネクタイは、J.C.ペニーという量販店の物だった。"}, {"t": 809.45, "x": "しかも、首に結ぶ式ではない。"}, {"t": 811.4, "x": "留め具で引っかける式だ。"}, {"t": 813.2, "x": "外して置いていったの。"}, {"t": 814.6833333333333, "x": "飛び降りる前に外している。"}, {"t": 816.3166666666667, "x": "これが、この事件で唯一、\n本人の体に触れていた物になった。"}, {"t": 820.4666666666667, "x": "2001年、FBIはこのネクタイから\nDNAの試料を取っている。"}, {"t": 824.4666666666667, "x": "残されたパラシュートにも、話がある。"}, {"t": 826.8833333333333, "x": "4つのうち、1つは訓練用だった。"}, {"t": 829.3333333333334, "x": "中が縫い閉じられていて、\n開かないようにしてある物だ。"}, {"t": 832.7833333333333, "x": "それ、使えないじゃない。"}, {"t": 834.3666666666667, "x": "使えない。そして男は、それを持って飛び降りている。"}, {"t": 837.5666666666667, "x": "確かめなかったのか、\n気づかなかったのか。そこは分からない。"}, {"t": 841.3, "x": "もう1つ、残ったパラシュートの紐が切り取られていた。"}, {"t": 844.6, "x": "男はその紐で、金の袋の口を縛っている。"}, {"t": 848.35, "x": "翌日から、捜索が始まった。"}, {"t": 850.6833333333333, "x": "本部が置かれたのは、\nワシントン州ウッドランドの市役所だ。"}, {"t": 854.1333333333333, "x": "飛行機とヘリコプターが飛んだ。"}, {"t": 856.0166666666667, "x": "地上には、300人を超える兵士が入った。"}, {"t": 858.95, "x": "軍が出たの。"}, {"t": 859.9833333333333, "x": "近くの基地から出ている。"}, {"t": 861.5666666666667, "x": "それが18日間続いた。"}, {"t": 863.4666666666667, "x": "出てきたものは、何も無い。"}, {"t": 865.2333333333333, "x": "体も、パラシュートも、金も、足あとも無い。"}, {"t": 868.3833333333333, "x": "18日間で何も。"}, {"t": 870.1166666666667, "x": "何も。ずっと雨が降っていたのも大きい。"}, {"t": 872.5833333333334, "x": "11月末のワシントン州は、雨と霧の季節だ。"}, {"t": 875.95, "x": "森は深く、川が枝分かれしている。"}, {"t": 878.25, "x": "仮に落ちていたとしても、\n見つけるのは簡単ではない。"}, {"t": 881.4333333333333, "x": "FBIは捜査に名前を付けた。"}, {"t": 883.4666666666667, "x": "ノージャック。\nノースウエスト航空のハイジャック、という\n意味の略語だ。"}, {"t": 887.2833333333333, "x": "数百人に話を聞き、全米に散った手がかりを追った。"}, {"t": 890.75, "x": "機体も、すみずみまで調べている。"}, {"t": 892.9, "x": "この捜査は、その後45年続くことになる。"}, {"t": 896.05, "x": "45年。"}, {"t": 897.0833333333334, "x": "始まりが、この18日間だった。"}, {"t": 899.55, "x": "探した側の言葉も残っている。"}, {"t": 901.6166666666667, "x": "この事件を最初から追い、\n1980年に退職した捜査官がいる。"}, {"t": 906.2, "x": "ラルフ・ヒンメルスバックさんだ。"}, {"t": 908.1666666666666, "x": "この人は、こう話している。"}, {"t": 910.0333333333333, "x": "あの男はおそらく前科のある人間で、\n最後の大勝負に出たのだろう、と。"}, {"t": 914.4166666666666, "x": "うまくいけばそれでいい。だめでも\n失うものは少なかった、と。"}, {"t": 918.1333333333333, "x": "追いかけた人の見方ね。"}, {"t": 919.8833333333333, "x": "見方だ。事実として確かめられたわけではない。"}, {"t": 922.8833333333333, "x": "この人は、こうも言っている。"}, {"t": 924.6333333333333, "x": "これ以上は何も分からないかもしれない。\nそれを受け入れるしかない、と。"}, {"t": 929.15, "x": "ここで、名前の話をしておく。"}, {"t": 931.2166666666667, "x": "切符に書かれていた名前は、ダン・クーパーだ。"}, {"t": 933.8333333333334, "x": "D.B.ではない。"}, {"t": 934.95, "x": "じゃあ、どこから来たの。"}, {"t": 936.5333333333333, "x": "通信社の配信記事だ。"}, {"t": 938.2, "x": "事件の夜、記者たちは大急ぎで原稿を送っていた。"}, {"t": 941.4166666666666, "x": "そのうちの一本で、名前がD.B.クーパーになった。"}, {"t": 944.45, "x": "FBIは翌日の発表で、それを訂正している。"}, {"t": 947.6, "x": "だが、間に合わなかった。"}, {"t": 949.2166666666667, "x": "誤りのほうが先に世界を一周してしまった。"}, {"t": 952.1333333333333, "x": "訂正が届く前に広まったのね。"}, {"t": 954.4, "x": "そうだ。以来、この事件はD.B.\nクーパー事件と呼ばれている。"}, {"t": 957.9666666666667, "x": "FBIは、自分たちの公式ページにこう書いている。"}, {"t": 961.1333333333333, "x": "D.B.というのは、報道が作った\n作り話のようなものだ、と。"}, {"t": 965.0, "x": "そして、こうも書いている。"}, {"t": 966.6, "x": "D.B.というイニシャルの男性から\n話を聞いたことはある。"}, {"t": 969.7333333333333, "x": "ただし、その人は犯人ではなかった、と。"}, {"t": 972.6333333333333, "x": "巻き込まれた人がいるのね。"}, {"t": 974.4666666666667, "x": "いる。だからこの動画では、その人の名前は出さない。"}, {"t": 977.75, "x": "地元の記録には残っているが、出す\n必要のない名前だ。"}, {"t": 981.3333333333334, "x": "世界中が半世紀そう呼んできた名前は、\nもともと人違いから生まれている。"}, {"t": 985.7833333333333, "x": "この事件は、最初の記事から間違っていたわけだ。"}, {"t": 989.0, "x": "訂正しても戻らないのね。"}, {"t": 990.8333333333334, "x": "戻らない。今さらダン・クーパー事件と\n言い直しても、誰にも通じない。"}, {"t": 994.95, "x": "FBIの公式ページですら、見出しはD.B.クーパーだ。"}, {"t": 998.3, "x": "間違いのほうが、正しい記録より強く残ってしまった。"}, {"t": 1001.85, "x": "本人は何て思っているのかしらね。"}, {"t": 1004.1666666666666, "x": "それも分からない。"}, {"t": 1005.2666666666667, "x": "この人物が生きて記事を読んだのか\nどうかも、分かっていない。"}, {"t": 1009.3666666666667, "x": "捜査の規模を、数字で見ておく。"}, {"t": 1011.3833333333333, "x": "FBIが公式に書いている数字だ。"}, {"t": 1013.6833333333333, "x": "事件から5年目の時点で、候補として\n検討した人数は800人を超えている。"}, {"t": 1018.6, "x": "800人。"}, {"t": 1019.6, "x": "そのうち、最後まで消せずに\n残ったのが2ダースほどだ。"}, {"t": 1022.9166666666666, "x": "24人前後ということになる。"}, {"t": 1024.85, "x": "つまり5年で、776人ぶんを「違う」と確かめている。"}, {"t": 1029.1166666666666, "x": "一人ずつ、当日どこにいたかを調べていく仕事だ。"}, {"t": 1032.35, "x": "1975年の時点で、追った\n手がかりは数千件になっていた。"}, {"t": 1036.6833333333334, "x": "この事件には、自分がやったと名乗り出る人も多い。"}, {"t": 1039.8, "x": "臨終の際に家族へ打ち明けた、という話も複数ある。"}, {"t": 1043.4166666666667, "x": "本当なの。"}, {"t": 1044.4333333333334, "x": "FBIは、そのどれも本物とは見ていない。"}, {"t": 1047.15, "x": "名乗るだけなら誰でもできるからだ。"}, {"t": 1049.25, "x": "裏付けになる物が要る。"}, {"t": 1050.7, "x": "たとえば、消えた紙幣。\nたとえば、消えたパラシュート。"}, {"t": 1053.9, "x": "その2つが出てくれば、話は一気に進む。"}, {"t": 1056.8166666666666, "x": "逆に言えば、45年たっても、\nその2つは出てきていない。"}, {"t": 1060.5833333333333, "x": "出てきたのは、1980年の一度きりだ。"}, {"t": 1063.8833333333334, "x": "一度だけ。"}, {"t": 1064.85, "x": "その話は、もう少しあとでする。"}, {"t": 1067.1, "x": "FBIは、2007年に方針を変えている。"}, {"t": 1069.9333333333334, "x": "それまで表に出していなかった\n資料を、自分から公開した。"}, {"t": 1073.6, "x": "ネクタイの写真。パラシュートの写真。似顔絵。地図。"}, {"t": 1076.9333333333334, "x": "外に出したのね。"}, {"t": 1078.3, "x": "出した。そして「見覚えはないか」と\n一般に呼びかけた。"}, {"t": 1081.9166666666667, "x": "担当した捜査官は、こう言っている。"}, {"t": 1084.2166666666667, "x": "40年近く前の事件に、多くの人手を\n割くのは理屈に合わない。"}, {"t": 1088.3, "x": "だから外の人が手伝ってくれるなら、\n何かが動くかもしれない、と。"}, {"t": 1092.5333333333333, "x": "この呼びかけで、手がかりはたくさん集まった。"}, {"t": 1095.2666666666667, "x": "それでも、名前には届かなかった。"}, {"t": 1098.15, "x": "1976年の11月。"}, {"t": 1100.6, "x": "事件から5年になろうとしていた。"}, {"t": 1102.6666666666667, "x": "当時、ハイジャックの罪に問える期限は5年だった。"}, {"t": 1105.8333333333333, "x": "時効ね。"}, {"t": 1106.6833333333334, "x": "この期限が切れると、たとえ後で\n名前が分かっても裁けなくなる。"}, {"t": 1110.5166666666667, "x": "そこでポートランドの大陪審が、\n期限の最後の日に手を打った。"}, {"t": 1114.2166666666667, "x": "起訴したのだ。"}, {"t": 1115.35, "x": "誰を。"}, {"t": 1116.0333333333333, "x": "ジョン・ドウ、別名ダン・クーパー。"}, {"t": 1117.8166666666666, "x": "ジョン・ドウというのは、名前が分からない\n人を指すときのアメリカの言い方だ。"}, {"t": 1121.95, "x": "日本で言う「氏名不詳」にあたる。"}, {"t": 1124.1833333333334, "x": "つまり、中身の空いた起訴状を作っておいたわけだ。"}, {"t": 1127.2166666666667, "x": "いつか身元が分かったときのために、\n期限だけを止めた。"}, {"t": 1130.6666666666667, "x": "名前が入る場所を空けたまま。"}, {"t": 1132.6, "x": "そのままだ。50年たっても、まだ空いている。"}, {"t": 1135.4333333333334, "x": "この事件は、扱いが二重になっている。"}, {"t": 1137.95, "x": "FBIは、この事件を期限の無い重い\n罪として扱ってきた時期もある。"}, {"t": 1142.3333333333333, "x": "一方で、ハイジャックの罪としては期限がある。"}, {"t": 1145.1, "x": "だから1976年の手続きが要った。"}, {"t": 1148.1333333333334, "x": "法律の上でも、この事件は宙に浮いたままだ。"}, {"t": 1151.1666666666667, "x": "起訴状が50年ぶんの重さを持ってるのね。"}, {"t": 1153.8833333333334, "x": "そういう形になる。"}, {"t": 1155.1833333333334, "x": "ちなみに、この起訴の日付は感謝祭の前の日だ。"}, {"t": 1158.3333333333333, "x": "事件が起きたのも、感謝祭の前の日だった。"}, {"t": 1161.3166666666666, "x": "ちょうど5年後ね。"}, {"t": 1162.5333333333333, "x": "ぴったり合わせている。"}, {"t": 1163.6166666666666, "x": "期限の最後の日を使ったからだ。"}, {"t": 1165.7833333333333, "x": "役所の仕事としては、ぎりぎりまで粘ったことになる。"}, {"t": 1169.05, "x": "この1枚の紙があるので、身元が\n分かれば今でも裁判にできる。"}, {"t": 1172.95, "x": "ただ、その身元が55年出てこない。"}, {"t": 1176.0833333333333, "x": "1980年2月10日。日曜日だ。"}, {"t": 1179.1333333333334, "x": "事件から8年3か月ほど経っている。"}, {"t": 1181.65, "x": "ワシントン州クラーク郡、コロンビア川のほとり。"}, {"t": 1184.4166666666667, "x": "テナ・バーと呼ばれる砂州だ。"}, {"t": 1185.95, "x": "そこに、8歳の男の子が家族と来ていた。"}, {"t": 1188.8166666666666, "x": "ブライアン・イングラムさんだ。"}, {"t": 1190.5, "x": "たき火をするために、父親が場所を作ろうとしていた。"}, {"t": 1193.7, "x": "イングラムさんは、腕で砂をならしていた。"}, {"t": 1196.3333333333333, "x": "それで。"}, {"t": 1197.0666666666666, "x": "指に、砂とは違うものが当たった。"}, {"t": 1199.4, "x": "本人は後にこう話している。"}, {"t": 1201.25, "x": "腕で砂をなでたら、何かふくらんだ感じがした、と。"}, {"t": 1204.5833333333333, "x": "掘り出したのは、紙の束だった。"}, {"t": 1206.7166666666667, "x": "20ドル札だ。輪ゴムでまとめられたまま、\n3つの束になっていた。"}, {"t": 1210.8333333333333, "x": "紙はぼろぼろで、濡れた紙の\nかたまりのようだったという。"}, {"t": 1214.1666666666667, "x": "お札だと分かったの。"}, {"t": 1215.65, "x": "親は最初、おもちゃの金だと思っている。"}, {"t": 1218.1833333333334, "x": "次の日、家族はFBIへ持って行った。"}, {"t": 1220.7333333333333, "x": "そして番号が照合された。"}, {"t": 1222.5333333333333, "x": "1971年にマイクロフィルムで\n写しておいた、あの番号だ。"}, {"t": 1226.7333333333333, "x": "一致した。"}, {"t": 1227.55, "x": "束の中身は、100枚、100枚、90枚。"}, {"t": 1230.4, "x": "合わせて290枚。"}, {"t": 1232.0, "x": "金額にして5,800ドルだ。"}, {"t": 1234.25, "x": "渡した20万ドルのうちの。"}, {"t": 1236.2, "x": "ごく一部だ。"}, {"t": 1237.15, "x": "しかも、並び順が1971年に渡したときのままだった。"}, {"t": 1241.6166666666666, "x": "束が崩れていなかったの。"}, {"t": 1243.3666666666666, "x": "崩れていない。輪ゴムも残っていた。"}, {"t": 1245.5833333333333, "x": "紙のほうは、ひどい状態だった。"}, {"t": 1247.7, "x": "読めないほど傷んだものもあれば、\n名刺くらいの大きさになったものもある。"}, {"t": 1251.7666666666667, "x": "真っ黒になった札もあった。"}, {"t": 1253.5166666666667, "x": "家族の話では、そのまま見られる\n状態のものは30枚ほどだったという。"}, {"t": 1258.0666666666666, "x": "それでも番号が読めたのね。"}, {"t": 1259.9333333333334, "x": "読めた。だから一致が確かめられた。"}, {"t": 1262.2833333333333, "x": "この発見は、当時のシアトルの新聞で\n一面の大見出しになっている。"}, {"t": 1266.4666666666667, "x": "事件から8年で、初めて手がかりが出たからだ。"}, {"t": 1270.25, "x": "FBIは、すぐに現場を掘った。"}, {"t": 1272.4166666666667, "x": "見つけた場所から5フィートほど離れた\nところで、紙の破片が出ている。"}, {"t": 1276.4166666666667, "x": "5円玉くらいの大きさの、細かい破片だ。"}, {"t": 1279.1333333333334, "x": "深いものは、砂の3フィート下にあった。"}, {"t": 1281.8, "x": "2月13日には、重機まで入れている。"}, {"t": 1284.4, "x": "土の専門家、遺跡を掘る専門家、\n川の流れの専門家も呼ばれた。"}, {"t": 1289.0333333333333, "x": "本気ね。"}, {"t": 1289.9166666666667, "x": "事件から8年で、初めて出てきた物だからだ。"}, {"t": 1293.0833333333333, "x": "ところが、ここから先が進まない。"}, {"t": 1295.35, "x": "なぜその砂州に、その金があったのか。"}, {"t": 1297.7666666666667, "x": "これが、今も説明できていない。"}, {"t": 1299.8666666666666, "x": "現場の責任者は当時こう言っている。"}, {"t": 1302.1333333333334, "x": "ずっと昔に流れ着いたのかも\nしれないが、9年前ではないだろう、と。"}, {"t": 1306.4666666666667, "x": "矛盾してるじゃない。"}, {"t": 1307.7666666666667, "x": "しているように聞こえる。"}, {"t": 1309.1333333333334, "x": "砂の積もり方から見ると、1971年に\n流れ着いたとは考えにくかったらしい。"}, {"t": 1314.6166666666666, "x": "長年この事件を追った捜査官は、こう説明している。"}, {"t": 1317.9833333333333, "x": "袋は川岸の近くにあって、水かさが\n増したときに流れ出した。"}, {"t": 1322.1333333333334, "x": "そして川底を転がるうちに袋が\n破れ、札の縁が削れていった、と。"}, {"t": 1326.5166666666667, "x": "これも一つの見方で、確かめられてはいない。"}, {"t": 1329.3333333333333, "x": "はっきりしているのは、数字のほうだ。"}, {"t": 1331.5833333333333, "x": "渡された20万ドルのうち、出てきたのは5,800ドル。"}, {"t": 1335.1666666666667, "x": "残りの19万4,200ドルは、\n今日まで1枚も見つかっていない。"}, {"t": 1339.4333333333334, "x": "1枚も。"}, {"t": 1340.35, "x": "世界中の銀行が番号を持っているのに、\n1枚も回ってきていない。"}, {"t": 1345.0, "x": "掘り出された5,800ドルには、続きがある。"}, {"t": 1347.85, "x": "この金は、誰のものなのか。"}, {"t": 1349.9333333333334, "x": "拾った子のものじゃないの。"}, {"t": 1351.6333333333334, "x": "そこで争いになった。"}, {"t": 1353.1166666666666, "x": "名乗り出たのは4者だ。"}, {"t": 1354.5666666666666, "x": "FBI。イングラムさん一家。"}, {"t": 1356.3666666666666, "x": "航空会社。そして航空会社の保険会社だ。"}, {"t": 1359.6333333333334, "x": "4者。"}, {"t": 1360.4, "x": "航空会社は、盗まれた側だ。"}, {"t": 1362.5333333333333, "x": "ただ、損の9割は保険会社が埋めていた。だから\n保険会社も権利を主張した。"}, {"t": 1367.55, "x": "決着がついたのは1986年5月21日だ。"}, {"t": 1371.5333333333333, "x": "発見から6年かかっている。"}, {"t": 1373.4333333333334, "x": "裁判所に出された案は、こうだった。"}, {"t": 1375.7166666666667, "x": "280ドル分は、証拠としてFBIが持つ。"}, {"t": 1378.95, "x": "残りの5,520ドルを、イングラムさんと\n保険会社で半分ずつにする。"}, {"t": 1383.6, "x": "じゃあ、いくらになったの。"}, {"t": 1385.2333333333333, "x": "2,760ドルだ。"}, {"t": 1387.0, "x": "受け取ったのは1986年の6月。"}, {"t": 1389.85, "x": "イングラムさんは15歳になっていた。"}, {"t": 1392.0833333333333, "x": "本人は当時、こう話している。"}, {"t": 1394.1333333333334, "x": "うまく売れれば大学に行ける。もう\n少し良ければ、家の頭金にもなる、と。"}, {"t": 1398.7, "x": "受け取った中には、現物の札も含まれていた。"}, {"t": 1401.7833333333333, "x": "その札は、2008年に競りに出されている。"}, {"t": 1404.65, "x": "15枚で、3万7,000ドルになった。"}, {"t": 1407.3333333333333, "x": "15枚で3万7,000ドル。"}, {"t": 1409.3, "x": "1枚あたり2,400ドルを超える。"}, {"t": 1411.4833333333333, "x": "額面は20ドルだ。"}, {"t": 1412.9166666666667, "x": "事件の名前が付いた紙、というだけで\n100倍以上になった。"}, {"t": 1416.5666666666666, "x": "……事件が値段になっちゃってるのね。"}, {"t": 1418.7, "x": "そうだ。ここが、この事件のもう一つの面になる。"}, {"t": 1422.4833333333333, "x": "ここからは、名前の話になる。"}, {"t": 1424.6166666666666, "x": "先に決めておく。ここで挙げるのは3人だけだ。"}, {"t": 1427.5666666666666, "x": "FBIが自分の公式ページで名前を出し、\nそのうえで「違う」と書いた人だけにする。"}, {"t": 1432.9833333333333, "x": "それ以外は出さないのね。"}, {"t": 1434.6, "x": "出さない。犯人だと決まっていない\n人を、犯人のように並べたくない。"}, {"t": 1438.8, "x": "一人目は、リチャード・フロイド・マッコイ受刑者だ。"}, {"t": 1442.0333333333333, "x": "この事件から5か月足らずの後に、\nよく似たハイジャックを起こしている。"}, {"t": 1446.0333333333333, "x": "金を要求して、パラシュートで飛び降りた。"}, {"t": 1448.5833333333333, "x": "FBIはこの人を追い、逮捕している。"}, {"t": 1450.8333333333333, "x": "1974年に亡くなった。"}, {"t": 1453.3333333333333, "x": "やり方がそっくりね。"}, {"t": 1454.8333333333333, "x": "だから今でも、この人を推す声は多い。"}, {"t": 1457.2166666666667, "x": "ただ、FBIは違うと発表している。"}, {"t": 1459.7666666666667, "x": "理由は、2人の客室乗務員が別々に\n話した人物像と合わないことだ。"}, {"t": 1464.5166666666667, "x": "二人は事件の夜、別の街で、\n別々に事情を聞かれている。"}, {"t": 1468.4333333333334, "x": "それでも、ほとんど同じ人物像を話した。"}, {"t": 1471.2, "x": "その人物像と合わなかった。"}, {"t": 1473.0666666666666, "x": "二人目は、デュエイン・ウェバーさんだ。"}, {"t": 1475.2166666666667, "x": "亡くなる前に、自分がクーパーだと\n家族に話したと伝えられている。"}, {"t": 1479.2333333333333, "x": "FBIは、2001年にネクタイから取ったDNAと照合した。"}, {"t": 1483.3, "x": "そして、違うと発表している。"}, {"t": 1485.3833333333334, "x": "三人目は、ケネス・クリスチャンセンさんだ。"}, {"t": 1488.15, "x": "雑誌の記事で名前が出た人だ。"}, {"t": 1490.2, "x": "FBIは、人物像が合わないと発表している。"}, {"t": 1493.2333333333333, "x": "さらに、この人は熟練の落下傘兵だった。"}, {"t": 1496.2666666666667, "x": "それだと逆に合わないの。"}, {"t": 1497.9333333333334, "x": "そこは次の章で話す。"}, {"t": 1499.5333333333333, "x": "この3人以外にも、名前は挙がり続けている。"}, {"t": 1502.4, "x": "だが、FBIが犯人と認めた\n人は、今のところ一人もいない。"}, {"t": 1506.5833333333333, "x": "そして2016年の発表のあと、\nFBIは新しい発表をしていない。"}, {"t": 1511.2333333333333, "x": "最近も話は出てるんでしょ。"}, {"t": 1513.2166666666667, "x": "出ている。新しい物が\n見つかった、という話も出ている。"}, {"t": 1516.7333333333333, "x": "ただ、FBIの公式な発表は2016年のものが最後だ。"}, {"t": 1520.8333333333333, "x": "だからこの動画では、その先へ踏み込まない。"}, {"t": 1523.6333333333334, "x": "どうして。"}, {"t": 1524.4833333333333, "x": "名前を出された人には、家族がいるからだ。"}, {"t": 1527.1666666666667, "x": "確かめられていない段階で名前を\n並べると、その家族が背負うことになる。"}, {"t": 1531.5333333333333, "x": "FBIが「犯人だ」と言った人は、\n55年たっても一人もいない。"}, {"t": 1536.0166666666667, "x": "私たちがここで決めていい話ではない。"}, {"t": 1539.1, "x": "この事件でいちばん割れているのが、ここだ。"}, {"t": 1541.6333333333334, "x": "飛び降りた男は、生きて地面に着いたのか。"}, {"t": 1544.4333333333334, "x": "どっちなの。"}, {"t": 1545.3833333333334, "x": "決まっていない。だから両方を並べる。"}, {"t": 1547.6666666666667, "x": "まず、FBIの側の見方だ。"}, {"t": 1549.75, "x": "担当した捜査官は、こう話している。"}, {"t": 1552.25, "x": "最初は、経験のある降下者だろうと考えていた。"}, {"t": 1555.3, "x": "だが数年で、そうではないという結論になった、と。"}, {"t": 1558.5333333333333, "x": "理由はこうだ。"}, {"t": 1559.4833333333333, "x": "真っ暗な夜に、雨の中を、正面から時速200\nマイルの風を受けて飛び降りている。"}, {"t": 1564.55, "x": "履いていたのは、薄い革靴だ。"}, {"t": 1566.5833333333333, "x": "着ていたのは、トレンチコートだった。"}, {"t": 1568.85, "x": "山に降りる格好じゃないわね。"}, {"t": 1570.7666666666667, "x": "さらに、使ったパラシュートには\n操作する仕組みが無かった。"}, {"t": 1574.2, "x": "向きを変えられない型だ。"}, {"t": 1575.7, "x": "そして予備のほうは、縫い閉じられた訓練用だった。"}, {"t": 1578.7333333333333, "x": "慣れた人なら、渡された時点で確かめる。"}, {"t": 1581.5166666666667, "x": "確かめていない。"}, {"t": 1582.6, "x": "だからFBIの担当官は、生きて\n降りられた見込みは低いと話している。"}, {"t": 1586.95, "x": "ここからは、反対側の見方だ。"}, {"t": 1589.15, "x": "体も、パラシュートも、見つかっていない。"}, {"t": 1591.75, "x": "18日間の捜索でも、その後の何十年でも出ていない。"}, {"t": 1595.6333333333334, "x": "落ちたなら、何か出そうなものね。"}, {"t": 1597.8833333333334, "x": "その通りだ。だから「降りられた」と考える人もいる。"}, {"t": 1601.3666666666666, "x": "1980年に出てきた5,800ドルも、両方に読める。"}, {"t": 1605.5, "x": "落ちた人の荷物が流れた、とも読めるし、\n降りた人が落とした、とも読める。"}, {"t": 1610.2, "x": "どちらが正しいかは、決まっていない。"}, {"t": 1612.3833333333334, "x": "この動画でも決めない。"}, {"t": 1613.75, "x": "ここで一つ、はっきりさせておきたいことがある。"}, {"t": 1616.6, "x": "55年たっても、体は見つかっていない。"}, {"t": 1619.2833333333333, "x": "パラシュートも見つかっていない。"}, {"t": 1621.0, "x": "金も、5,800ドルを除いて見つかっていない。"}, {"t": 1624.1666666666667, "x": "何も出ていないのね。"}, {"t": 1625.6333333333334, "x": "何も出ていない。"}, {"t": 1626.7, "x": "「出ていない」は、どちらの説の証拠にもならない。"}, {"t": 1629.6666666666667, "x": "深い森で、雨で、川がある土地だ。"}, {"t": 1632.1, "x": "落ちていても見つからない場所はいくらでもある。"}, {"t": 1634.55, "x": "だから「見つからない＝生きている」とは言えない。"}, {"t": 1637.4, "x": "同時に、「落ちた」と決めることもできない。"}, {"t": 1640.0, "x": "この事件は、そこで止まっている。"}, {"t": 1642.7, "x": "もう一つ、名前の話がある。"}, {"t": 1644.75, "x": "切符に書かれていたダン・クーパーという名前だ。"}, {"t": 1647.3, "x": "この名前と同じ主人公が出てくる漫画が、当時あった。"}, {"t": 1650.8666666666666, "x": "漫画。"}, {"t": 1651.6, "x": "フランス語圏で出ていた連続ものだ。"}, {"t": 1653.8333333333333, "x": "主人公はカナダ空軍のテストパイロットで、\n名前はダン・クーパー。"}, {"t": 1657.6166666666666, "x": "事件のころに出た号の表紙で、\nその主人公がパラシュートで降りている。"}, {"t": 1661.8, "x": "偶然にしては、できすぎね。"}, {"t": 1663.8333333333333, "x": "FBIの担当官も、そこに目を付けた。"}, {"t": 1666.55, "x": "この漫画は、英語には訳されていない。"}, {"t": 1668.8833333333334, "x": "つまり、英語圏だけで\n暮らしていた人は、まず知らない。"}, {"t": 1672.2333333333333, "x": "そこから担当官は、こう考えた。"}, {"t": 1674.5333333333333, "x": "この人物は、海外にいた\n時期があるのではないか、と。"}, {"t": 1677.8333333333333, "x": "ただし、これは見立てだ。"}, {"t": 1679.25, "x": "裏付けは取れていない。"}, {"t": 1680.6333333333334, "x": "担当官が描いた人物像も、公式ページに載っている。"}, {"t": 1684.1333333333334, "x": "空軍にいて、ヨーロッパに\n駐在したことがあるのではないか。"}, {"t": 1687.6166666666666, "x": "飛行機に貨物を積む仕事をしていたのではないか。"}, {"t": 1690.5333333333333, "x": "それなら727の後ろの階段も知っている。"}, {"t": 1693.3333333333333, "x": "ただし、飛び降りる技術までは持っていない。"}, {"t": 1695.9166666666667, "x": "知ってはいるけど、できはしない。"}, {"t": 1697.95, "x": "そういう人物像だ。あくまで\n見立てとして読んでほしい。"}, {"t": 1701.2333333333333, "x": "2009年には、民間の研究者にも協力を求めている。"}, {"t": 1705.0, "x": "恐竜の骨を研究している人が中心になったチームだ。"}, {"t": 1708.4166666666667, "x": "この人たちは、電子顕微鏡で\nネクタイに付いた粒子を調べた。"}, {"t": 1712.2333333333333, "x": "花粉が付いていれば、\nどの地域にいたかの手がかりになる。"}, {"t": 1715.4833333333333, "x": "川の流れも調べた。札束がどこから\n流れてきたかを出すためだ。"}, {"t": 1719.6166666666666, "x": "それでも、名前には届いていない。"}, {"t": 1722.3166666666666, "x": "ここで、いやな話を一つしておく。"}, {"t": 1724.6333333333334, "x": "この男は、長いあいだ英雄のように扱われてきた。"}, {"t": 1727.9666666666667, "x": "乗っ取った人が。"}, {"t": 1729.2666666666667, "x": "そうだ。"}, {"t": 1729.9, "x": "事件のあと、地元では文字を\n入れたシャツが売られた。"}, {"t": 1732.9166666666667, "x": "書いてあったのは、こうだ。"}, {"t": 1734.4833333333333, "x": "「D.B.クーパー、どこにいる」"}, {"t": 1736.1333333333334, "x": "降下したと見られる地域の小さな町では、\n1976年から毎年、集まりが開かれるようになった。"}, {"t": 1742.8833333333334, "x": "11月24日に、酒場に人が集まる。"}, {"t": 1745.9, "x": "本人が紛れているかもしれない、と\n言い合いながら飲む集まりだ。"}, {"t": 1749.6, "x": "……お祭りにしちゃったのね。"}, {"t": 1751.2166666666667, "x": "1981年には映画にもなっている。"}, {"t": 1754.0666666666666, "x": "当時の大きな俳優が出ている作品だ。"}, {"t": 1756.5, "x": "なぜ英雄になったのか。"}, {"t": 1757.8166666666666, "x": "当時、その理由を調べた研究者がいる。"}, {"t": 1760.4833333333333, "x": "ワシントン大学の社会学の研究者だ。"}, {"t": 1763.1, "x": "その人は、こう説明している。"}, {"t": 1765.1666666666667, "x": "人と機械の勝負で、人のほうが勝った、と見られた。"}, {"t": 1768.5666666666666, "x": "一人の男が、技術と会社と仕組みを出し抜いた。"}, {"t": 1771.7833333333333, "x": "だから、金持ちから奪う義賊のように見えた。"}, {"t": 1774.5666666666666, "x": "貧しい人に配ったかどうかは、\nこの際どうでもよかった、と。"}, {"t": 1778.3333333333333, "x": "都合よく見たいだけじゃない。"}, {"t": 1780.05, "x": "そのとおりだ。"}, {"t": 1780.9666666666667, "x": "ただ、事実のほうも見ておきたい。"}, {"t": 1783.05, "x": "この男は、爆弾だと言った物を機内に持ち込んでいる。"}, {"t": 1786.4333333333334, "x": "36人の乗客と、6人の乗務員がそこにいた。"}, {"t": 1789.9666666666667, "x": "客室乗務員は、3時間近くその物の隣に座り続けた。"}, {"t": 1794.1166666666666, "x": "誰も怪我をしなかったのは、\n結果であって、狙いではない。"}, {"t": 1797.6833333333334, "x": "一つ間違えたら、全然違う事件よね。"}, {"t": 1800.5833333333333, "x": "全然違う。そこは忘れないでおきたい。"}, {"t": 1803.6833333333334, "x": "この事件には、もう一つの側面がある。"}, {"t": 1806.2833333333333, "x": "アメリカの航空当局が出している\n公式の年表を見てほしい。"}, {"t": 1809.8833333333334, "x": "1971年11月24日の欄に、こう書いてある。"}, {"t": 1814.0166666666667, "x": "身代金を要求する一連のハイジャックの、\n最初の事件である、と。"}, {"t": 1818.2833333333333, "x": "最初。"}, {"t": 1819.05, "x": "この後が、ひどい。"}, {"t": 1820.3833333333334, "x": "1971年12月24日、同じように金と\nパラシュートを要求する事件が起きた。"}, {"t": 1826.2833333333333, "x": "ちょうど1か月後だ。"}, {"t": 1827.6, "x": "そしてその後の6か月で、\n同じ形の要求が17件起きている。"}, {"t": 1831.9666666666667, "x": "半年で17件。"}, {"t": 1833.4666666666667, "x": "真似する人が次々に出た。"}, {"t": 1835.35, "x": "航空当局は、そこから急いで規則を作っていく。"}, {"t": 1838.6166666666666, "x": "1972年2月2日、乗客と手荷物を\n調べる仕組みを義務にした。"}, {"t": 1843.65, "x": "それでも足りなかった。"}, {"t": 1845.05, "x": "1972年12月5日、緊急の規則が出る。"}, {"t": 1848.9, "x": "1973年1月5日から、手荷物は全部調べる。"}, {"t": 1853.0166666666667, "x": "乗客は全員、金属探知機を通す。"}, {"t": 1855.55, "x": "探知機が無い空港では、体を触って調べる。"}, {"t": 1858.5, "x": "断れば、飛行機には乗せない。"}, {"t": 1860.6833333333334, "x": "今と同じね。"}, {"t": 1861.8333333333333, "x": "今と同じだ。ここが始まりだ。"}, {"t": 1863.9333333333334, "x": "それまでは、怪しいと見た人だけを調べていた。"}, {"t": 1866.8333333333333, "x": "どれくらいの割合か。"}, {"t": 1868.1833333333334, "x": "1日に飛行機へ乗る50万人のうち、\nおよそ1パーセントだ。"}, {"t": 1872.0166666666667, "x": "それが全員になった。"}, {"t": 1873.4333333333334, "x": "さらに1973年2月5日から、531の空港に\n警察官を置くことになった。"}, {"t": 1879.5666666666666, "x": "搭乗口のそばに立たせる決まりだ。"}, {"t": 1881.7333333333333, "x": "私たちが今、空港でかばんを開けて機械を\n通っているのは、この年に始まっている。"}, {"t": 1886.7833333333333, "x": "きっかけの一つが、1971年11月24日の夜だった。"}, {"t": 1892.2166666666667, "x": "最後に、数字で整理しておく。"}, {"t": 1894.2166666666667, "x": "1971年11月24日。"}, {"t": 1897.0, "x": "ポートランド発シアトル行き、305便。"}, {"t": 1899.6, "x": "乗客36人。乗務員6人。"}, {"t": 1902.05, "x": "渡した現金は20万ドル。"}, {"t": 1903.8, "x": "20ドル札で1万枚。"}, {"t": 1905.3666666666666, "x": "袋の重さは19ポンド。"}, {"t": 1907.2166666666667, "x": "渡したパラシュートは4つ。消えたのは2つ。"}, {"t": 1910.0, "x": "飛び降りたのは午後8時13分ごろ。"}, {"t": 1912.15, "x": "高度はおよそ1万フィート。"}, {"t": 1913.8666666666666, "x": "速度は時速196マイル。"}, {"t": 1915.9, "x": "雲の底は5,000フィート。雨だった。"}, {"t": 1918.2833333333333, "x": "捜索は18日間。地上には\n300人を超える兵士が入った。"}, {"t": 1922.3666666666666, "x": "出てきたものは、無い。"}, {"t": 1923.8, "x": "5年で800人以上を調べ、\n24人前後まで絞り、そこで止まった。"}, {"t": 1928.3666666666666, "x": "1976年、名前の空いた起訴状が作られた。"}, {"t": 1932.0166666666667, "x": "1980年2月10日、8歳の子どもが\n砂の中から290枚を掘り出した。"}, {"t": 1937.6833333333334, "x": "5,800ドルだ。"}, {"t": 1939.05, "x": "残りの19万4,200ドルは、今日まで1枚も出ていない。"}, {"t": 1942.85, "x": "2016年7月8日、FBIは捜査に\n割いていた人手を他へ回した。"}, {"t": 1947.6833333333334, "x": "発表の文にはこうある。"}, {"t": 1949.1833333333334, "x": "この件で得た証拠は、\n歴史の資料として本部で保管する、と。"}, {"t": 1953.0666666666666, "x": "そして、こう付け加えている。"}, {"t": 1954.9166666666667, "x": "もし物証が出てきたら、\n最寄りの事務所に連絡してほしい。"}, {"t": 1958.3833333333334, "x": "パラシュートか、あの金だ。"}, {"t": 1960.25, "x": "まだ待ってるのね。"}, {"t": 1961.5333333333333, "x": "待っている。終わったとは書いていない。"}, {"t": 1963.6, "x": "ここで、今回の話の出どころを並べておく。"}, {"t": 1966.45, "x": "事件の経過と捜査の中身は、FBIの公式ページ、\n著名事件のD.B.クーパーの項。"}, {"t": 1971.8166666666666, "x": "担当官の見立てと人物像は、FBIが\n2007年12月と2009年3月に出した記事。"}, {"t": 1978.0, "x": "捜査を終える発表は、FBI\nシアトル事務所の2016年7月12日の公式発表。"}, {"t": 1983.7333333333333, "x": "切符の記録は、FBIの公式ページの所蔵品の項。"}, {"t": 1987.2833333333333, "x": "1980年の発見と裁判の経緯は、\nワシントン州の歴史記録事業ヒストリーリンクの記事。"}, {"t": 1993.4666666666667, "x": "現地の捜索と機内に残された物は、\n地元紙ザ・コロンビアンの記録。"}, {"t": 1998.0333333333333, "x": "模倣事件の件数と空港の検査の規則は、\nアメリカ連邦航空局の公式年表だ。"}, {"t": 2003.45, "x": "出どころは以上だ。話を、残った物に戻す。"}, {"t": 2006.5666666666666, "x": "残っている物を並べると、こうなる。"}, {"t": 2008.8, "x": "黒いネクタイ。ネクタイ留め。"}, {"t": 2010.4666666666667, "x": "パラシュート2つ。290枚の紙幣。"}, {"t": 2013.2166666666667, "x": "現金で買われた1枚の切符。"}, {"t": 2015.25, "x": "残っていないものは、一つだけだ。"}, {"t": 2017.6333333333334, "x": "名前。"}, {"t": 2018.35, "x": "名前だ。"}, {"t": 2019.05, "x": "日本でも、1970年に旅客機が\n乗っ取られる事件が起きている。"}, {"t": 2023.4666666666667, "x": "よど号事件だ。"}, {"t": 2024.6, "x": "あちらは、乗っ取った人たちの名前が分かっている。"}, {"t": 2027.55, "x": "この事件は、その逆になった。"}, {"t": 2029.6333333333334, "x": "目的ははっきりしている。金だ。"}, {"t": 2031.85, "x": "やり方も分かっている。"}, {"t": 2033.1, "x": "飛び方も、時刻も、高度も分かっている。"}, {"t": 2035.8833333333334, "x": "分かっていないのは、誰がやったかだけだ。"}, {"t": 2038.4833333333333, "x": "全部そろってるのに、そこだけ空いてるのね。"}, {"t": 2041.2333333333333, "x": "そこだけ空いている。"}, {"t": 2042.2666666666667, "x": "55年、空いたままだ。"}, {"t": 2044.1166666666666, "x": "ひとつ、聞いていい。"}, {"t": 2045.4833333333333, "x": "どうぞ。"}, {"t": 2046.1833333333334, "x": "この人、ずっとかっこよく語られてきたのよね。"}, {"t": 2049.233333333333, "x": "語られてきた。シャツにもなったし、映画にもなった。"}, {"t": 2052.4666666666667, "x": "誰も命を落としていないから、物語として扱いやすい。"}, {"t": 2056.1, "x": "ただ、私はそこで終わらせたくない。"}, {"t": 2058.4166666666665, "x": "あの機内には乗客が36人、乗務員が6人いた。"}, {"t": 2062.0, "x": "そのうちの一人は、爆弾だと言われた\n物の隣に3時間近く座り続けている。"}, {"t": 2067.133333333333, "x": "……こわかったでしょうね。"}, {"t": 2068.483333333333, "x": "誰も怪我をしなかったのは結果であって、\nそう狙われていたわけではない。"}, {"t": 2072.5, "x": "かっこいい話のかげに、\nその3時間があったことは忘れたくない。"}, {"t": 2076.4166666666665, "x": "名前の欄は、今日も空いたままだ。"}, {"t": 2078.483333333333, "x": "埋まる日が来るのかどうかも、分からない。"}, {"t": 2080.8166666666666, "x": "この回で気になったところがあれば、\nコメントに書いてもらえるとうれしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
