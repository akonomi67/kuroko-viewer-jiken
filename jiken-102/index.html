<script>
const D={"name": "102", "file": "102_編集用", "dur": 2157.8833125, "segs": [], "subs": [{"t": 0.0, "x": "1969年11月8日。"}, {"t": 2.45, "x": "アメリカ、サンフランシスコの新聞社に、\n一枚のカードが届いた。"}, {"t": 6.633333333333334, "x": "差出人の名前は無い。"}, {"t": 8.233333333333333, "x": "カードには、記号がびっしりと並んでいた。"}, {"t": 10.666666666666666, "x": "横に17文字、それが20行。"}, {"t": 12.8, "x": "全部で340文字だ。"}, {"t": 14.783333333333333, "x": "記号？　文字じゃなくて？"}, {"t": 16.383333333333333, "x": "ああ。丸や三角や、アルファベットを\nひっくり返したような形が並んでいる。"}, {"t": 20.816666666666666, "x": "暗号だ。"}, {"t": 21.55, "x": "送ってきたのは、その年、カリフォルニアで人を\n襲い、新聞社と警察をからかい続けていた人物だ。"}, {"t": 27.85, "x": "自分で名乗った名前がある。ゾディアックだ。"}, {"t": 30.466666666666665, "x": "それは聞いたことがあるわ。"}, {"t": 32.083333333333336, "x": "名前だけは、日本でもよく知られている。"}, {"t": 34.5, "x": "ただ、この340文字がそのあとどうなったかを\n知っている人は、ほとんどいない。"}, {"t": 39.43333333333333, "x": "解けたの？"}, {"t": 40.31666666666667, "x": "解けた。ただし、届いてから51年後だ。"}, {"t": 43.31666666666667, "x": "……51年。"}, {"t": 44.38333333333333, "x": "2020年の12月だ。"}, {"t": 46.21666666666667, "x": "そして、解いたのは警察ではない。FBIでもない。"}, {"t": 49.45, "x": "アメリカとオーストラリアとベルギーに\n住む、3人の一般の人だった。"}, {"t": 53.45, "x": "この3人は、それまで一度も会ったことがなかった。"}, {"t": 56.56666666666667, "x": "今回は、その51年を追いかける。"}, {"t": 59.016666666666666, "x": "暗号と手紙という、紙に残ったものだけを\n手がかりにして追いかける。"}, {"t": 63.03333333333333, "x": "先に断っておく。この事件は未解決だ。"}, {"t": 65.75, "x": "誰も起訴されていない。"}, {"t": 67.21666666666667, "x": "だからこの動画では、誰かを犯人だと断定しない。"}, {"t": 70.51666666666667, "x": "名前が挙がった人はいるんでしょう？"}, {"t": 72.53333333333333, "x": "いる。ただし、公的機関が認めたものではない。\nそこは、そう言えるところまでで止める。"}, {"t": 77.78333333333333, "x": "使う資料は、FBIが公開している文書と、\n当時の通信社が配信した記事と、"}, {"t": 82.83333333333333, "x": "解いた3人が自分で出した論文だ。"}, {"t": 85.26666666666667, "x": "日本語のまとめ記事は一つも使っていない。"}, {"t": 87.91666666666667, "x": "もう一つ、先に数えておく。"}, {"t": 89.93333333333334, "x": "この人物が送った暗号は4つだ。\nそのうち解けたのは2つ。"}, {"t": 93.76666666666667, "x": "そして、自分の名前が入っていると本人が\n書いた暗号は、いまも解けていない。"}, {"t": 99.08333333333333, "x": "話を1968年まで戻す。"}, {"t": 101.8, "x": "1968年12月20日、金曜日の夜だ。"}, {"t": 105.5, "x": "場所はカリフォルニア州ベニシアの郊外。"}, {"t": 107.6, "x": "レイク・ハーマン・ロードという道の脇になる。"}, {"t": 110.1, "x": "どんなところなの。"}, {"t": 111.38333333333334, "x": "舗装された道から少し入った、砂利敷きの待避所だ。"}, {"t": 114.71666666666667, "x": "若い人たちが車を停める場所として知られていた。"}, {"t": 117.93333333333334, "x": "午後11時30分ごろ、通りかかった車の運転手が、\nそこに停まっている車に気づいた。"}, {"t": 123.83333333333333, "x": "車の中と、その周りに、2人がいた。"}, {"t": 126.63333333333334, "x": "デビッド・ファラデーさん、17歳。"}, {"t": 128.5, "x": "高校の生徒で、レスリングの選手だった。"}, {"t": 131.18333333333334, "x": "ベティ・ルー・ジェンセンさん、16歳。"}, {"t": 133.38333333333333, "x": "2人は、その日が初めて一緒に出かけた日だった。"}, {"t": 136.68333333333334, "x": "……初めてのデートだったのね。"}, {"t": 138.48333333333332, "x": "そうだ。2人とも、その場で亡くなった。"}, {"t": 141.1, "x": "担当したのはソラノ郡保安官事務所だ。"}, {"t": 143.51666666666668, "x": "レスリー・ランドブラッド巡査部長が受け持った。"}, {"t": 146.25, "x": "事件から3日後、この方は取材にこう答えている。"}, {"t": 149.45, "x": "「我々には、現時点で動機がない」"}, {"t": 151.78333333333333, "x": "動機が分からない。"}, {"t": 153.06666666666666, "x": "分からない。2人の友人を片っ端から\n当たっても、容疑者は一人も出てこなかった。"}, {"t": 158.15, "x": "そして、ここが大事なところだ。"}, {"t": 160.21666666666667, "x": "このときは、誰も名乗り出ていない。"}, {"t": 162.45, "x": "手紙も電話も無かったの？"}, {"t": 164.25, "x": "無い。この件は、動機の分からない\n未解決事件として、そのまま書類に収まった。"}, {"t": 169.35, "x": "この2人がゾディアックと結び付けられるのは、\n半年以上あとの話になる。"}, {"t": 174.38333333333333, "x": "次は1969年7月4日。"}, {"t": 177.05, "x": "アメリカの独立記念日だ。"}, {"t": 178.88333333333333, "x": "場所はバレーホ市のブルーロック・スプリングス公園。"}, {"t": 181.4, "x": "最初の現場から、車で20分ほどのところにある。"}, {"t": 184.86666666666667, "x": "また、同じような場所なのね。"}, {"t": 186.9, "x": "ああ。夜、車を停めていた2人が襲われた。"}, {"t": 189.76666666666668, "x": "ダーリーン・フェリンさん、22歳。亡くなった。"}, {"t": 192.46666666666667, "x": "マイケル・マゴーさん、19歳。この方は生き延びた。"}, {"t": 195.76666666666668, "x": "生き延びた人がいるの？"}, {"t": 197.33333333333334, "x": "いる。この事件で生き延びた方は、全部で2人だ。"}, {"t": 200.36666666666667, "x": "マゴーさんが、その一人目になる。"}, {"t": 202.55, "x": "担当はバレーホ市警だ。"}, {"t": 204.05, "x": "ここから、この事件は普通ではなくなる。"}, {"t": 206.53333333333333, "x": "襲撃のおよそ1時間後、バレーホ市警に\n一本の電話がかかってきた。"}, {"t": 210.86666666666667, "x": "誰から？"}, {"t": 211.73333333333332, "x": "名乗らない男からだ。"}, {"t": 213.03333333333333, "x": "抑揚のない声だったと記録されている。"}, {"t": 215.5, "x": "中身は、当時の通信社の記事にそのまま残っている。"}, {"t": 218.83333333333334, "x": "「二人が殺されたことを届け出たい」"}, {"t": 220.95, "x": "「コロンバス・パークウェイを東へ\n1マイル行った公共の公園だ。"}, {"t": 224.23333333333332, "x": "茶色い車の中に子どもたちがいる」"}, {"t": 226.53333333333333, "x": "そして、最後にこう続けた。"}, {"t": 228.51666666666668, "x": "「去年の子どもたちも、私がやった」"}, {"t": 231.03333333333333, "x": "……去年。"}, {"t": 231.71666666666667, "x": "12月のレイク・ハーマン・ロードのことだ。"}, {"t": 234.11666666666667, "x": "じゃあ、そこで2つの事件がつながったのね。"}, {"t": 236.96666666666667, "x": "いや、つながらなかった。"}, {"t": 238.66666666666666, "x": "えっ。"}, {"t": 239.26666666666668, "x": "警察は、この電話の主が本当に\n犯人なのか、決めきれなかった。"}, {"t": 243.61666666666667, "x": "いたずら電話かもしれない。"}, {"t": 245.0, "x": "事件は新聞に出ているから、誰でも真似ができる。"}, {"t": 248.23333333333332, "x": "電話の声は、録音されていなかったの？"}, {"t": 250.86666666666667, "x": "残っていない。分かっているのは、市警の通信係が\n受けたということと、話した中身だけだ。"}, {"t": 256.68333333333334, "x": "受けた職員の名前は、いろいろな本に\n書かれている。ただ、公的な資料では"}, {"t": 261.06666666666666, "x": "確かめられなかった。だからここでは出さない。"}, {"t": 263.8666666666667, "x": "警察が確信するのは、この1か月近くあとになる。"}, {"t": 267.96666666666664, "x": "1969年7月31日。"}, {"t": 270.93333333333334, "x": "3つの新聞社に、同じ日に手紙が届いた。"}, {"t": 273.8833333333333, "x": "バレーホ・タイムズヘラルド。"}, {"t": 275.21666666666664, "x": "サンフランシスコ・クロニクル。"}, {"t": 276.8, "x": "サンフランシスコ・エグザミナー。"}, {"t": 278.71666666666664, "x": "3社に同じ手紙？"}, {"t": 280.1666666666667, "x": "文面は、ほとんど同じだ。\nただし、同封されていた紙が違う。"}, {"t": 284.2, "x": "暗号が、3つに切り分けて入っていた。"}, {"t": 286.71666666666664, "x": "1社に3分の1ずつだ。"}, {"t": 288.76666666666665, "x": "全部そろえないと読めないってこと？"}, {"t": 290.93333333333334, "x": "そうなる。"}, {"t": 291.6166666666667, "x": "手紙には、まず2つの事件のことが書いてあった。"}, {"t": 294.55, "x": "12月の件と、7月の件だ。"}, {"t": 297.05, "x": "そこに書かれていたのは、犯人しか\n知りようのないことだった。"}, {"t": 300.6, "x": "これで警察の見方が決まった。"}, {"t": 302.48333333333335, "x": "7月の電話の主は、本物だったということだ。"}, {"t": 305.76666666666665, "x": "そして、手紙には要求があった。文面はこうだ。"}, {"t": 308.8833333333333, "x": "「この暗号を、8月1日金曜の午後までに\n一面に載せろ」"}, {"t": 312.65, "x": "載せなければどうする、という\n脅しが、そのあとに続いていた。"}, {"t": 316.3333333333333, "x": "新聞社は、どうしたのかしら。"}, {"t": 318.43333333333334, "x": "載せた。1969年8月1日、地元の紙面に\n暗号が出た。そして数日のうちに、"}, {"t": 324.6333333333333, "x": "3社とも自分の持ち分を載せた。"}, {"t": 326.95, "x": "脅されて載せるって、いいのかしら。"}, {"t": 329.21666666666664, "x": "そこは当時も議論になった。"}, {"t": 330.96666666666664, "x": "ただ、結果として、この判断が\nこの事件をここまで残すことになる。"}, {"t": 335.25, "x": "載ったから、解く人が現れた。"}, {"t": 337.95, "x": "この暗号は、3つ合わせて408文字あった。"}, {"t": 340.96666666666664, "x": "だから、Z408と呼ばれている。"}, {"t": 343.31666666666666, "x": "使われている記号は50種類以上だ。"}, {"t": 345.46666666666664, "x": "アルファベットは26文字しかないのに、それより多い。"}, {"t": 348.81666666666666, "x": "多いと、どうなるの？"}, {"t": 350.25, "x": "1つの文字に、いくつもの記号を割り当てられる。"}, {"t": 353.06666666666666, "x": "たとえばEに、5つの記号を順番に使う。そうすると、"}, {"t": 356.3833333333333, "x": "どの記号が多いかを数えても、Eが浮かんでこない。"}, {"t": 359.48333333333335, "x": "数えても分からないのね。"}, {"t": 361.15, "x": "そういう作りだ。FBIの暗号の担当者も解けなかった。"}, {"t": 364.78333333333336, "x": "解いたのは、カリフォルニア州サリナスに\n住む夫婦だった。"}, {"t": 367.96666666666664, "x": "ドナルド・ハーデンさん。"}, {"t": 369.03333333333336, "x": "ノース・サリナスの高校で、\n歴史と経済を教えていた先生だ。"}, {"t": 373.1666666666667, "x": "そして、妻のベティ・ハーデンさん。"}, {"t": 375.1166666666667, "x": "2人は新聞に載った暗号を見て、\nその場で取りかかった。"}, {"t": 378.51666666666665, "x": "手がかりは3つだ。"}, {"t": 379.76666666666665, "x": "1つ目。同じ記号が2つ続いているところを探した。"}, {"t": 383.1, "x": "英語でそうなりやすいのはLLだ。"}, {"t": 385.21666666666664, "x": "2つ目。4文字のかたまりが何度も\n出てくる。そこをKILLだと仮定した。"}, {"t": 390.05, "x": "3つ目は、ベティさんの見立てだ。"}, {"t": 392.03333333333336, "x": "こういう手紙を書く人間なら、書き出しは\n「私は」で始めるはずだ、と。"}, {"t": 396.8333333333333, "x": "性格のほうから当てたのね。"}, {"t": 398.7, "x": "そうだ。この3つを置いてから、\nあとは手で試していった。"}, {"t": 402.01666666666665, "x": "かかった時間は、およそ20時間だと\n本人たちが話している。"}, {"t": 405.8666666666667, "x": "1969年8月8日、サンフランシスコ・\nクロニクルに、ハーデン夫妻から解読文が届いた。"}, {"t": 412.3333333333333, "x": "暗号が投函されてから8日後。"}, {"t": 414.1666666666667, "x": "紙面に出てから、ちょうど1週間だ。"}, {"t": 416.65, "x": "警察より早いじゃない。"}, {"t": 418.23333333333335, "x": "早い。しかも道具は、紙と鉛筆だけだ。"}, {"t": 421.01666666666665, "x": "2人が使った計算用紙は、いまも残っている。"}, {"t": 423.9, "x": "記号と文字を並べた表に、書いては\n消した跡がいくつも付いている。"}, {"t": 428.3666666666667, "x": "解読文には、何が書いてあったか。"}, {"t": 430.71666666666664, "x": "動機めいたことが、長々と書かれていた。"}, {"t": 433.3666666666667, "x": "ただ、そこは今日は読まない。"}, {"t": 434.96666666666664, "x": "人を襲うことについて書かれた部分だからだ。"}, {"t": 437.85, "x": "読まなくていいわ。"}, {"t": 439.06666666666666, "x": "私もそう思う。"}, {"t": 440.21666666666664, "x": "この回で大事なのは、そこに\n何が無かったか、のほうだ。"}, {"t": 443.76666666666665, "x": "名前が無い。"}, {"t": 444.75, "x": "名前？"}, {"t": 445.46666666666664, "x": "ああ。解読文には、こう書いてあった。"}, {"t": 447.85, "x": "「私は名前を教えない」"}, {"t": 449.48333333333335, "x": "……わざわざ書いたのね。"}, {"t": 450.8666666666667, "x": "わざわざ書いた。理由も添えてある。"}, {"t": 452.85, "x": "教えたら止められるからだ、と。"}, {"t": 454.8, "x": "ここで一つ、よく間違えられているところを直しておく。"}, {"t": 458.1, "x": "「この暗号の中に自分の正体がある」と\n言ったのは、7月31日の手紙ではない。"}, {"t": 463.46666666666664, "x": "その次だ。1969年8月4日、\nエグザミナー宛の手紙で、そう書いている。"}, {"t": 469.26666666666665, "x": "解かれたあとに言ったの？"}, {"t": 470.78333333333336, "x": "いや、8月4日は解読の4日前になる。"}, {"t": 473.6333333333333, "x": "つまり、紙面に暗号が出たあとで\n「あの中に俺の名前がある」と言い足した。そして、"}, {"t": 478.6, "x": "実際には入っていなかった。"}, {"t": 480.56666666666666, "x": "もう一つ、解けていないものがある。"}, {"t": 482.68333333333334, "x": "408文字のうち、最後の18文字だ。"}, {"t": 485.55, "x": "この18文字だけは、どう読んでも\n意味のある言葉にならない。"}, {"t": 489.06666666666666, "x": "1969年から今日まで、誰も説明できていない。"}, {"t": 493.5, "x": "その1969年8月4日の手紙の話をする。"}, {"t": 497.4, "x": "宛先はサンフランシスコ・エグザミナー。編集者宛だ。"}, {"t": 500.65, "x": "書き出しはこうだ。"}, {"t": 501.8, "x": "「親愛なる編集者へ。これは\nゾディアックが話している」"}, {"t": 505.06666666666666, "x": "それが名前なの？"}, {"t": 506.35, "x": "ああ。本人が、自分で名乗った。"}, {"t": 508.55, "x": "この日より前に、ゾディアックという\n言葉は一度も出ていない。"}, {"t": 511.9, "x": "ここから、新聞はこの人物を\nゾディアックと呼ぶようになった。"}, {"t": 515.4833333333333, "x": "もう一つ、この人物には目印がある。"}, {"t": 518.05, "x": "丸の中に十字を書いた印だ。"}, {"t": 520.1, "x": "手紙の署名として、この印が使われた。"}, {"t": 523.0, "x": "星座みたいな名前と、丸に十字。"}, {"t": 525.3666666666667, "x": "ナパ郡保安官事務所のドン・タウンゼント警部が、\n当時、この印についてこう言っている。"}, {"t": 530.4666666666667, "x": "「彼の署名である丸の中の十字は、\nアジアのある宗教から取ったものかもしれない」"}, {"t": 535.1166666666667, "x": "ただし、これは推測だ。"}, {"t": 536.65, "x": "根拠は示されていない。"}, {"t": 538.1833333333333, "x": "確かなのは、この印が手紙にも、あとで\n話す現場にも出てきた、ということだけだ。"}, {"t": 543.45, "x": "名前と印。この2つを自分で用意した\nところが、この人物の特徴になる。"}, {"t": 548.4, "x": "自分から売り込んでいるみたいね。"}, {"t": 550.3666666666667, "x": "そう見える。だから、新聞社に手紙を送り続けた。"}, {"t": 553.6666666666666, "x": "本物と認められている手紙や\nカードは、およそ20通ある。"}, {"t": 557.25, "x": "1969年7月から、1974年7月までだ。"}, {"t": 562.6333333333333, "x": "1969年9月27日、土曜日。"}, {"t": 565.9666666666667, "x": "場所はナパ郡のレイク・ベリエッサ。湖の岸だ。"}, {"t": 568.95, "x": "2人が、そこで食事をしていた。"}, {"t": 571.15, "x": "セシリア・シェパードさん、22歳。"}, {"t": 573.05, "x": "ブライアン・ハートネルさん、20歳。"}, {"t": 575.1833333333333, "x": "2人とも、パシフィック・ユニオン大学の学生だった。"}, {"t": 578.4166666666666, "x": "そこへ、頭巾をかぶった男が近づいてきた。"}, {"t": 581.4, "x": "頭巾？"}, {"t": 582.0833333333334, "x": "ああ。ナパ郡保安官事務所のドン・\nタウンゼント警部が、事件の4日後に\n取材でこう話している。"}, {"t": 587.5333333333333, "x": "「ベリエッサでは、彼は頭巾をかぶっていた。"}, {"t": 589.8333333333334, "x": "肩まである黒い頭巾で、\n目のところだけが細く開いていた」"}, {"t": 593.6666666666666, "x": "……顔を隠していたのね。"}, {"t": 595.2166666666667, "x": "隠していた。この事件で、\n犯人の顔を見た人はいない。"}, {"t": 598.7833333333333, "x": "シェパードさんは亡くなった。"}, {"t": 600.2166666666667, "x": "ハートネルさんは生き延びた。"}, {"t": 601.9, "x": "生き延びた方の、2人目だ。"}, {"t": 603.8333333333334, "x": "ここまでで、確認されている襲撃は3件になる。"}, {"t": 607.0, "x": "そして、管轄がすべて違う。"}, {"t": 609.0666666666667, "x": "12月の件はソラノ郡保安官。"}, {"t": 611.1, "x": "7月の件はバレーホ市警。"}, {"t": 612.8333333333334, "x": "9月の件はナパ郡保安官だ。"}, {"t": 615.0666666666667, "x": "全部バラバラなの？"}, {"t": 616.4, "x": "バラバラだ。同じ人物の仕業だとしても、\n書類は別々の場所にある。"}, {"t": 620.8166666666667, "x": "この事件が長くかかった理由の一つが、ここにある。"}, {"t": 624.7166666666667, "x": "レイク・ベリエッサには、書き置きが残っていた。"}, {"t": 627.3333333333334, "x": "ハートネルさんの車のドアだ。"}, {"t": 629.15, "x": "そこに、太いペンで文字が書かれていた。"}, {"t": 631.7333333333333, "x": "何て書いてあったの？"}, {"t": 633.1666666666666, "x": "日付だ。"}, {"t": 633.95, "x": "12月20日、68年。"}, {"t": 636.0166666666667, "x": "7月4日、69年。そして、9月27日、69年、6時30分。"}, {"t": 642.25, "x": "……最初の2件の日付。"}, {"t": 643.9, "x": "そうだ。自分がやったと、現場に書いていった。"}, {"t": 646.8333333333334, "x": "そして、その横に、丸に十字の印が描かれていた。"}, {"t": 650.3333333333334, "x": "ここで、バラバラだった3件の書類が一本につながる。"}, {"t": 653.6666666666666, "x": "警察が結び付けたのではない。"}, {"t": 655.4833333333333, "x": "犯人が自分で結び付けた。"}, {"t": 657.5833333333334, "x": "なんでそんなことをするのかしら。"}, {"t": 659.5666666666667, "x": "私にも分からない。ただ、\nこの人物はずっとそうしている。"}, {"t": 663.15, "x": "襲って、電話をして、手紙を書いて、暗号を送る。"}, {"t": 666.4, "x": "この日も、そのあと電話がかかっている。"}, {"t": 668.8166666666667, "x": "ナパ市警にだ。名乗らない男からだった。"}, {"t": 671.45, "x": "警察は電話を追跡した。かかってきたのは\n公衆電話だ。"}, {"t": 675.1, "x": "ただ、電話会社が答えられたのは、"}, {"t": 677.2, "x": "レイク・ベリエッサとナパの間の\nどこかの公衆電話、というところまでだった。"}, {"t": 681.6333333333333, "x": "場所までは分からなかったの？"}, {"t": 683.45, "x": "分からなかった。ただ、\n受話器からは跡が取れている。"}, {"t": 686.6, "x": "まだ乾いていない、手のひらの跡だ。"}, {"t": 688.8, "x": "この跡は、いまだに誰とも一致していない。"}, {"t": 692.0333333333333, "x": "1969年10月11日、土曜日の夜。"}, {"t": 695.5666666666667, "x": "ここまでの3件は、どれも郊外だった。"}, {"t": 697.95, "x": "夜の、人けのない場所だ。"}, {"t": 699.9, "x": "4件目は違う。サンフランシスコの市内で起きた。"}, {"t": 703.0, "x": "ユニオン・スクエアでタクシーに乗った客がいた。"}, {"t": 705.55, "x": "行き先はプレシディオ・ハイツ。住宅街だ。"}, {"t": 708.1666666666666, "x": "運転していたのは、ポール・スタインさん、29歳。"}, {"t": 711.3, "x": "スタインさんは、その車の中で亡くなった。"}, {"t": 714.2, "x": "街の中なの？"}, {"t": 715.4166666666666, "x": "街の中だ。だから、ここだけは条件が違った。"}, {"t": 718.65, "x": "目撃者がいる。"}, {"t": 719.9333333333333, "x": "初めてね。"}, {"t": 720.95, "x": "初めてだ。近くにいた若い\n人たちが、外から見ていた。"}, {"t": 724.6833333333333, "x": "その人たちが話した人相は、こうだ。"}, {"t": 727.2666666666667, "x": "白人の男。25歳から30歳くらい。"}, {"t": 730.1, "x": "身長は5フィート8インチほど。"}, {"t": 731.9333333333333, "x": "日本でいうと173センチくらいになる。"}, {"t": 734.75, "x": "髪は短く刈っていて、太い縁の眼鏡をかけていた。"}, {"t": 738.0666666666667, "x": "この話をもとに、警察の似顔絵描きが\n1枚の絵を作った。"}, {"t": 741.9333333333333, "x": "いま、この事件の話に必ず出てくる\nあの似顔絵は、このとき作られたものだ。"}, {"t": 746.8666666666667, "x": "じゃあ、顔は分かったのね。"}, {"t": 748.6, "x": "分かったのは似顔絵までだ。"}, {"t": 750.2333333333333, "x": "そして、目撃者はもう一つ見ていた。"}, {"t": 752.7833333333333, "x": "男が布で、タクシーのドアと車内を拭いていた。"}, {"t": 755.7, "x": "指紋を消していたと見られている。"}, {"t": 757.6, "x": "その布が何だったのかは、3日後に分かる。"}, {"t": 760.9666666666667, "x": "1969年10月14日。"}, {"t": 763.5833333333334, "x": "サンフランシスコ・クロニクルに、手紙が届いた。"}, {"t": 766.4166666666666, "x": "中に、布の切れ端が入っていた。"}, {"t": 768.8833333333333, "x": "……あの布？"}, {"t": 769.7, "x": "警察が調べた。スタインさんが\n着ていたシャツと、同じ生地だった。"}, {"t": 773.8166666666667, "x": "手紙の文面は、当時の通信社の記事に\nそのまま残っている。"}, {"t": 777.6, "x": "「私は、昨夜のワシントン通りとメイプル通りの\nあたりのタクシー運転手を殺した者だ」"}, {"t": 782.7166666666667, "x": "そして、北のベイエリアの人たちも\n自分がやった、と続けていた。"}, {"t": 786.75, "x": "署名は、丸に十字の印だった。"}, {"t": 789.0333333333333, "x": "サンフランシスコ市警のトマス・\nカヒル本部長が、この手紙は犯人から"}, {"t": 793.1166666666667, "x": "送られたものと見られる、と確認している。"}, {"t": 795.7333333333333, "x": "現場から布を持って帰ったのね。"}, {"t": 797.9, "x": "持って帰った。そして、切って、送ってきた。"}, {"t": 800.9333333333333, "x": "同じシャツの切れ端は、このあと\n2回、別の郵便に入って送られてくる。"}, {"t": 805.3833333333333, "x": "1969年11月9日と、12月20日だ。"}, {"t": 809.5333333333333, "x": "全部で3回になる。"}, {"t": 811.0333333333333, "x": "……証拠を、自分で配っているみたい。"}, {"t": 813.2666666666667, "x": "そう見える。ただ、当時は\nそこから身元が出てこなかった。"}, {"t": 816.7, "x": "ここまでが、確認されている4件だ。"}, {"t": 819.1666666666666, "x": "亡くなった方は5人。"}, {"t": 820.4333333333333, "x": "生き延びた方が2人。"}, {"t": 821.9333333333333, "x": "この数字は、FBIが公開している\nページに今も書いてある。"}, {"t": 825.55, "x": "「1968年と1969年に、\nカリフォルニアのベイエリアで、5人が殺された」"}, {"t": 831.4666666666667, "x": "57年たっても、この5人という数字は変わっていない。"}, {"t": 835.5333333333333, "x": "ここで、FBIの立場を説明しておく。"}, {"t": 838.2, "x": "この事件に、FBIがどう関わったか。"}, {"t": 840.9333333333333, "x": "捜査したんでしょう？"}, {"t": 842.25, "x": "していない。"}, {"t": 843.1333333333333, "x": "えっ。"}, {"t": 843.75, "x": "FBIが、自分のページにそう書いている。"}, {"t": 846.3333333333334, "x": "「これらの殺人は連邦の管轄に\n当たらなかった。したがって\nFBIは捜査を開始しなかった」"}, {"t": 852.0, "x": "じゃあ、何をしていたの。"}, {"t": 853.6333333333333, "x": "技術の支援だ。筆跡の鑑定、\n指紋の採取、そして暗号の解読。"}, {"t": 858.3833333333333, "x": "1969年当時、FBIの研究所には\n技術評価班と呼ばれる部署があった。"}, {"t": 863.8333333333334, "x": "そこへ、封筒と便箋そのものが送られてくる。"}, {"t": 866.6, "x": "筆跡を比べ、指紋を浮かせる。"}, {"t": 868.85, "x": "暗号についても、FBIの担当者が動いている。\nただ、Z408を解いたのは彼らではなかった。"}, {"t": 875.0333333333333, "x": "地元の警察が、FBIの研究所に依頼を出した。\nその往復の書類が、いま公開されている。"}, {"t": 881.1, "x": "FBIは、この事件の文書をインターネットで\n公開している。全部で7分冊だ。"}, {"t": 886.15, "x": "誰でも読めるの？"}, {"t": 887.4, "x": "読める。ただし、1969年の紙をそのまま\n写したものだから、読みづらい。"}, {"t": 892.7166666666667, "x": "それでも、たとえばこういうことが分かる。"}, {"t": 895.0166666666667, "x": "ナパ郡保安官、サンフランシスコ市警、\nバレーホ市警が、それぞれ\n別の事件番号でこの件を扱っていた。"}, {"t": 901.5833333333334, "x": "……やっぱりバラバラね。"}, {"t": 902.9333333333333, "x": "バラバラだ。"}, {"t": 903.75, "x": "一つ、断っておくことがある。"}, {"t": 905.8, "x": "このFBIのページには、間違いが一か所ある。"}, {"t": 908.7166666666667, "x": "暗号を解いたのは「2人の大学教授」だと書いてある。"}, {"t": 912.25, "x": "高校の先生じゃなかった？"}, {"t": 914.05, "x": "高校の先生だ。だから、そこは引かない。"}, {"t": 916.8166666666667, "x": "公的機関が\n書いたものでも、間違っているところは間違っている。"}, {"t": 921.3333333333334, "x": "1969年11月8日に戻る。"}, {"t": 924.1666666666666, "x": "冒頭で話したカードだ。"}, {"t": 925.8166666666667, "x": "宛先はサンフランシスコ・クロニクル。"}, {"t": 927.9833333333333, "x": "カードの絵柄は、インクの垂れたペンだった。"}, {"t": 930.6166666666667, "x": "そこに、340文字の暗号が入っていた。"}, {"t": 933.6, "x": "記号の種類は63だ。"}, {"t": 935.2333333333333, "x": "前の暗号より増えている。"}, {"t": 936.9666666666667, "x": "また増えたのね。"}, {"t": 938.1666666666666, "x": "増えている。アルファベットは26文字。記号は63。"}, {"t": 941.6333333333333, "x": "1つの文字に、平均で2つ以上の記号が\n当てられている計算になる。"}, {"t": 945.8166666666667, "x": "クロニクルは、4日後の11月12日に、\nこれを紙面に載せた。"}, {"t": 949.9666666666667, "x": "前と同じだ。載せれば、誰かが解く。"}, {"t": 952.4833333333333, "x": "ハーデン夫妻も、もちろん挑んだ。"}, {"t": 954.55, "x": "FBIの暗号班も挑んだ。"}, {"t": 956.3, "x": "世界中の愛好家が挑んだ。"}, {"t": 958.1666666666666, "x": "解けなかった。"}, {"t": 959.2833333333333, "x": "前のは1週間で解けたのに？"}, {"t": 961.2833333333333, "x": "1週間で解けた。こちらは、51年かかった。"}, {"t": 964.5666666666667, "x": "なぜか。"}, {"t": 965.2333333333333, "x": "前の暗号は、記号を文字に\n置き換えるだけのものだった。だから、\n数えて、当てて、埋めていけば解ける。"}, {"t": 971.3833333333333, "x": "この340文字には、そこにもう\n一段、仕掛けが入っていた。"}, {"t": 975.5166666666667, "x": "文字の並び順そのものが、入れ替えてあったんだ。"}, {"t": 978.5333333333333, "x": "置き換えて、さらに並べ替えたということ？"}, {"t": 981.15, "x": "そういうことだ。"}, {"t": 982.1666666666666, "x": "置き換えを正しく当てても、\n並べ替えを戻していなければ、\n文字は意味のない列のままになる。"}, {"t": 987.4333333333333, "x": "逆に、並べ替えを戻せても、\n置き換えが違えば、やはり読めない。"}, {"t": 991.4833333333333, "x": "両方をいっぺんに当てないと、正解に見えない。"}, {"t": 994.2, "x": "しかも、並べ替えのやり方は無数にある。"}, {"t": 997.3833333333333, "x": "ここから、解いた3人の話をする。"}, {"t": 999.7833333333333, "x": "一人目は、デビッド・オランチャックさん。"}, {"t": 1001.95, "x": "アメリカ、バージニア州ロアノークに\n住む、ソフトウェアの技術者だ。"}, {"t": 1005.7833333333333, "x": "この暗号に取りかかったのは2006年。"}, {"t": 1008.0833333333334, "x": "趣味として始めた。"}, {"t": 1009.65, "x": "趣味で？"}, {"t": 1010.4333333333333, "x": "趣味でだ。そこから14年続けている。"}, {"t": 1012.9833333333333, "x": "二人目は、サム・ブレイクさん。"}, {"t": 1014.6333333333333, "x": "オーストラリアの応用数学の研究者だ。"}, {"t": 1017.1833333333333, "x": "三人目は、ヤール・ファン・エイクさん。"}, {"t": 1019.25, "x": "ベルギーの方で、倉庫で働きながら\nプログラムを書いていた。"}, {"t": 1022.9166666666666, "x": "この方は、暗号を解くためのソフトを\n自分で作っている。"}, {"t": 1026.4333333333334, "x": "3人とも、警察の人ではないのね。"}, {"t": 1029.0666666666666, "x": "違う。そして、3人は会ったこともなかった。"}, {"t": 1032.0, "x": "きっかけは、オランチャックさんが\n動画投稿サイトに上げていた解説動画だ。"}, {"t": 1036.3, "x": "それを見たブレイクさんが、コメントを書いた。"}, {"t": 1038.8, "x": "そこから連絡を取り合うようになって、\n2020年の3月に3人で組んだ。"}, {"t": 1043.5666666666666, "x": "2020年の3月って。"}, {"t": 1045.55, "x": "世界中が家から出られなくなった時期だ。"}, {"t": 1047.9833333333333, "x": "時間だけはあった、と本人たちが話している。"}, {"t": 1050.8666666666666, "x": "3人の役割は分かれていた。"}, {"t": 1052.75, "x": "ブレイクさんが、並べ替えのやり方を数え上げる。"}, {"t": 1055.65, "x": "ファン・エイクさんのソフトが、\nその一つ一つを総当たりで試す。"}, {"t": 1059.5666666666666, "x": "オランチャックさんが、出てきた\n結果を見て、意味のありそうなものを拾う。"}, {"t": 1064.2166666666667, "x": "ブレイクさんが最初にやったのは、\n並べ替えのやり方を数えることだった。"}, {"t": 1068.4166666666667, "x": "思いつく形を全部書き出した。"}, {"t": 1070.3666666666666, "x": "数十億通りになった。"}, {"t": 1072.1333333333334, "x": "数十億。"}, {"t": 1073.1166666666666, "x": "それを、実際に機械にかけられる数まで絞り込んだ。"}, {"t": 1076.4166666666667, "x": "残ったのが655,088通りだ。およそ65万通りになる。"}, {"t": 1081.0833333333333, "x": "オランチャックさんは、この作業をこう言っている。"}, {"t": 1083.6333333333334, "x": "「65万発の弾が入った散弾銃で、\n暗号を撃ち落とそうとするようなものだ」"}, {"t": 1088.55, "x": "……力任せね。"}, {"t": 1089.8, "x": "本人も「荒っぽいし、時間もかかった」と言っている。"}, {"t": 1093.2333333333333, "x": "2020年12月2日、3人は65万通りを走らせ始めた。"}, {"t": 1097.8666666666666, "x": "そして次の日、まだ全体のごく一部しか終わっていない\n段階で、ソフトが一つの結果を返した。"}, {"t": 1103.8666666666666, "x": "2020年12月3日だ。"}, {"t": 1105.9, "x": "出てきた文の中に、読める言葉が混ざっていた。"}, {"t": 1108.9, "x": "「私を捕まえようとしてくれているといいのだが」"}, {"t": 1111.6, "x": "そして、もう一つ。"}, {"t": 1113.0333333333333, "x": "「ガス室」"}, {"t": 1113.95, "x": "……偶然では出ないわね。"}, {"t": 1115.4, "x": "出ない。ここで、当たりだと分かった。"}, {"t": 1117.6666666666667, "x": "正解だった並べ替えは、こういうものだった。"}, {"t": 1120.3333333333333, "x": "340文字を、上から9行、次の9行、\n残り2行、という3つのかたまりに割る。"}, {"t": 1125.9666666666667, "x": "そして、それぞれのかたまりを、1つ下、\n2つ右、という順番で斜めに読んでいく。"}, {"t": 1131.35, "x": "端まで行ったら、反対側へ回り込む。"}, {"t": 1133.9666666666667, "x": "……そんなの、思いつくかしら。"}, {"t": 1135.9166666666667, "x": "思いつかない。だから65万通り試した。"}, {"t": 1138.8166666666666, "x": "それだけではない。"}, {"t": 1139.9166666666667, "x": "2つ目のかたまりを読んでいくと、\n途中から文がおかしくなる。"}, {"t": 1143.5166666666667, "x": "調べたら、これは犯人自身の書き間違いだった。"}, {"t": 1146.6333333333334, "x": "その一か所を直したとたん、\n残っていた乱れが一気に消えた。"}, {"t": 1150.4, "x": "犯人が、間違えていたの？"}, {"t": 1152.3833333333334, "x": "間違えていた。51年のうちの\nいくらかは、この書き間違いのせいだ。"}, {"t": 1156.6833333333334, "x": "最後のかたまりだけは、また\n別の決まりになっていた。ある単語が、\n逆さまに並べてあった。"}, {"t": 1162.8166666666666, "x": "解けた文には、もう一つ手がかりがあった。"}, {"t": 1165.4333333333334, "x": "「テレビ番組に出ていたのは\n私ではない」という一文だ。"}, {"t": 1168.8333333333333, "x": "テレビ？"}, {"t": 1169.5333333333333, "x": "1969年10月22日の朝、生放送の番組に、\n犯人を名乗る男から電話が入っている。"}, {"t": 1176.4833333333333, "x": "この暗号は、その2週間ほどあとに投函されている。"}, {"t": 1179.7166666666667, "x": "つまり340文字の中身は、あの電話は\n自分ではない、という否定だった。"}, {"t": 1184.4833333333333, "x": "……そんなことのために。"}, {"t": 1185.9, "x": "そのために51年かかった。"}, {"t": 1187.9166666666667, "x": "そして、1つ目の暗号と同じだ。"}, {"t": 1190.1, "x": "名前は書かれていない。"}, {"t": 1191.3666666666666, "x": "身元につながるものは、何も無かった。"}, {"t": 1194.0333333333333, "x": "3人は解読の結果をまとめて、\n2020年12月5日にFBIへ送った。"}, {"t": 1199.1333333333334, "x": "FBIの暗号解析班が、中身を確かめた。"}, {"t": 1202.3333333333333, "x": "そして2020年12月11日の金曜日、\nこのことが公表された。"}, {"t": 1206.9166666666667, "x": "同じ日、FBIサンフランシスコ支局が\n声明を出している。文面はこうだ。"}, {"t": 1211.55, "x": "「FBIは、ゾディアック・\nキラーのものとされる暗号が、最近、"}, {"t": 1215.0166666666667, "x": "民間の人々によって解読されたことを承知している」"}, {"t": 1218.45, "x": "「ゾディアック・キラーの事件は、"}, {"t": 1219.9, "x": "FBIサンフランシスコ支局と、地元の法執行機関に\nとって、現在も継続中の捜査である」"}, {"t": 1226.1666666666667, "x": "継続中。"}, {"t": 1227.15, "x": "継続中だ。51年前の暗号が解けても、\n事件そのものは開いたままになる。"}, {"t": 1232.2833333333333, "x": "そのあと、FBIの暗号解析班は、\n3人にメダルを贈っている。"}, {"t": 1236.65, "x": "メダル。"}, {"t": 1237.3666666666666, "x": "ああ。警察が解けなかったものを、\n外の3人が解いた。それを認めた形だ。"}, {"t": 1242.3166666666666, "x": "一つだけ断っておく。"}, {"t": 1243.9166666666667, "x": "このときのFBIの声明は、いま\nFBIのサイトには載っていない。"}, {"t": 1247.7, "x": "当時、報道機関に配られたものだ。"}, {"t": 1250.2166666666667, "x": "だからこの動画では、報道が\n引いた文面のほうを使っている。"}, {"t": 1254.4333333333334, "x": "ゾディアックが送った暗号は、全部で4つある。"}, {"t": 1257.2, "x": "408文字。340文字。そして、あと2つだ。"}, {"t": 1261.1166666666666, "x": "3つ目は、1970年4月20日にクロニクルへ送られた。"}, {"t": 1265.2833333333333, "x": "手紙の中に、こう書いてある。"}, {"t": 1267.1833333333334, "x": "「私の名前は」"}, {"t": 1268.3166666666666, "x": "そのあとに、13個の記号が並んでいる。"}, {"t": 1271.0333333333333, "x": "13文字で名前？"}, {"t": 1272.45, "x": "そういう作りだ。この13文字は、いまも解けていない。"}, {"t": 1275.7833333333333, "x": "4つ目は、1970年6月26日。"}, {"t": 1279.0833333333333, "x": "同じくクロニクル宛だ。"}, {"t": 1280.7, "x": "32文字の記号と、一枚の地図が入っていた。"}, {"t": 1283.85, "x": "手紙にはこう書いてある。"}, {"t": 1285.2833333333333, "x": "「この地図とこの暗号を合わせれば、\n爆弾がどこに仕掛けてあるか分かる」"}, {"t": 1289.4166666666667, "x": "爆弾。"}, {"t": 1290.2166666666667, "x": "そういう主張だ。それが実際に\n見つかったという記録は無い。"}, {"t": 1293.7333333333333, "x": "この32文字も、解けていない。"}, {"t": 1295.9666666666667, "x": "解いた3人は、こっちはやらなかったの？"}, {"t": 1298.55, "x": "やっている。ただ、見込みは\n薄いと本人たちが言っている。"}, {"t": 1301.9333333333334, "x": "理由は、短すぎることだ。"}, {"t": 1303.8333333333333, "x": "暗号は、長いほうが解きやすい。"}, {"t": 1305.7, "x": "同じ記号が何度も出てくるから、数えて比べられる。"}, {"t": 1308.9833333333333, "x": "13文字や32文字では、数えるものが足りない。"}, {"t": 1312.1666666666667, "x": "340文字が51年かかったのは、\n仕掛けが二重だったからだ。"}, {"t": 1316.5333333333333, "x": "13文字が解けないのは、\nそもそも材料が足りないからだ。"}, {"t": 1320.05, "x": "解けた2つには名前が無く、名前があると\n書かれた1つは、解けない。"}, {"t": 1324.9166666666667, "x": "数字の話をしておく。"}, {"t": 1326.45, "x": "警察とFBIが、この人物の仕業としている\n死者は5人だ。"}, {"t": 1330.4, "x": "ところが、手紙の中で本人が言っている数は違う。"}, {"t": 1333.7333333333333, "x": "いくつなの？"}, {"t": 1334.7, "x": "後のほうの手紙では、37人だと書いている。"}, {"t": 1337.65, "x": "1972年にクロニクルが受け取ったものだ。"}, {"t": 1341.0833333333333, "x": "37人。"}, {"t": 1342.2166666666667, "x": "ただし、これは本人が言っただけの数だ。"}, {"t": 1344.7833333333333, "x": "警察が確かめて認めた数ではない。"}, {"t": 1347.05, "x": "手紙の中では、誰が被害者なのかも\n書かなくなっていた。"}, {"t": 1350.7, "x": "だから、数える根拠が無い。"}, {"t": 1352.5166666666667, "x": "この話をするとき、必ず一緒に出てくる事件がある。"}, {"t": 1355.9, "x": "1966年10月31日、カリフォルニア州リバーサイドで、"}, {"t": 1360.2833333333333, "x": "18歳のシェリ・ジョ・ベイツさんが亡くなった。"}, {"t": 1363.1666666666667, "x": "翌年、リバーサイド市警に手書きの手紙が届いている。"}, {"t": 1366.5333333333333, "x": "この手紙のせいで、ベイツさんの事件も\nゾディアックではないか、と長く言われてきた。"}, {"t": 1371.3833333333334, "x": "関係あったの？"}, {"t": 1372.5833333333333, "x": "無かった。"}, {"t": 1373.3333333333333, "x": "2016年4月、リバーサイド市警に匿名の手紙が届いた。"}, {"t": 1377.4166666666667, "x": "差出人はこう書いていた。"}, {"t": 1379.0, "x": "あの手紙を書いたのは自分だ。"}, {"t": 1380.7333333333333, "x": "悪い冗談だった。自分はゾディアックでもないし、\nベイツさんの事件とも関係ない、と。"}, {"t": 1385.9666666666667, "x": "2020年、市警とFBIが、その手紙の切手に\n残っていたDNAを調べた。"}, {"t": 1391.2, "x": "書いた人物が特定され、本人も認めた。そして、\n事件には関わっていないことが確認された。"}, {"t": 1397.4666666666667, "x": "リバーサイド市警は、公式の説明にこう書いている。"}, {"t": 1400.4333333333334, "x": "今後ゾディアックの捜査には直接関わらない、と。"}, {"t": 1403.6666666666667, "x": "はっきりしているのね。"}, {"t": 1405.1333333333334, "x": "はっきりしている。広報の警官は\n取材にこう答えている。"}, {"t": 1408.5, "x": "「これ以上どう明確に言えばいいのか、分からない」"}, {"t": 1411.2166666666667, "x": "数えられるのは5人だ。それ\n以外は、本人の言い分でしかない。"}, {"t": 1415.6166666666666, "x": "確認されている襲撃は、\n1969年10月11日で終わっている。"}, {"t": 1420.5666666666666, "x": "ところが、手紙は終わらなかった。"}, {"t": 1422.7833333333333, "x": "まだ送ってきたの？"}, {"t": 1424.15, "x": "送ってきた。しかも、宛先が変わっていく。"}, {"t": 1427.05, "x": "1969年12月20日、メルヴィン・\nベリという弁護士の家に手紙が届いた。"}, {"t": 1432.3, "x": "この弁護士は、当時テレビによく出ていた有名な人だ。"}, {"t": 1435.6333333333334, "x": "シャツの切れ端が入っていたのは、\nこの手紙が3回目になる。"}, {"t": 1439.3, "x": "1970年に入ると、回数が増える。"}, {"t": 1442.3166666666666, "x": "4月20日、4月28日、6月26日、\n7月24日、7月26日、10月5日。"}, {"t": 1449.9166666666667, "x": "……半年で6通。"}, {"t": 1451.2166666666667, "x": "そうだ。カードもある。"}, {"t": 1452.4333333333334, "x": "誕生日を祝うカードや、\n季節のカードを送ってきている。"}, {"t": 1455.7, "x": "1970年10月27日には、宛先が\n新聞社ではなく、個人になった。"}, {"t": 1461.2333333333333, "x": "サンフランシスコ・クロニクルの記者、\nポール・エイブリーさんだ。"}, {"t": 1464.4333333333334, "x": "この事件をずっと書いていた\n記者に、名指しで送ってきた。"}, {"t": 1467.9, "x": "……こわいわね。"}, {"t": 1468.8, "x": "書いている側が、書かれる側になった。"}, {"t": 1471.15, "x": "1971年3月13日には、ロサンゼルス・\nタイムズにも送っている。"}, {"t": 1475.95, "x": "サンフランシスコから、南へ数百キロ離れた街だ。"}, {"t": 1479.4833333333333, "x": "その後、3年近く止まる。"}, {"t": 1481.4166666666667, "x": "そして1974年に、また4通届く。"}, {"t": 1484.4833333333333, "x": "1月29日、2月14日、5月8日、そして7月8日だ。"}, {"t": 1489.3666666666666, "x": "本物と認められているものは、\nこの1974年7月8日が最後になる。"}, {"t": 1494.6333333333334, "x": "それ以降は無いの？"}, {"t": 1495.9, "x": "届いてはいる。1978年に2通ある。"}, {"t": 1499.0666666666666, "x": "ただし、この2通は筆跡の専門家が偽物と見ている。"}, {"t": 1502.5, "x": "1通は、ほぼ偽物だと扱われている。"}, {"t": 1505.2333333333333, "x": "つまり、本物の手紙は1969年7月から\n1974年7月まで。5年間だ。"}, {"t": 1511.9166666666667, "x": "その5年で、およそ20通。"}, {"t": 1513.85, "x": "襲撃は最初の10か月で終わり、\nそのあとの4年は、手紙だけが続いた。"}, {"t": 1519.05, "x": "ここから、容疑者の話をする。"}, {"t": 1521.1666666666667, "x": "先に、いちばん大事なところを言っておく。"}, {"t": 1523.6666666666667, "x": "この事件で起訴された人は、一人もいない。"}, {"t": 1526.2833333333333, "x": "逮捕された人も、一人もいない。"}, {"t": 1528.65, "x": "一人も？"}, {"t": 1529.5333333333333, "x": "一人もだ。サンフランシスコ市警で\nこの事件を担当していた元捜査官が、"}, {"t": 1533.9666666666667, "x": "2018年の取材でこう言っている。"}, {"t": 1536.4666666666667, "x": "「容疑者になりうる人は\n何千人もいて、証拠も山ほどある。"}, {"t": 1539.9333333333334, "x": "難しい事件だ。誰一人、逮捕すらされていない」"}, {"t": 1543.25, "x": "そのうえで、警察が公に名前を出した\n人物は、これまでに一人だけいる。"}, {"t": 1547.9, "x": "アーサー・リー・アレンさんという方だ。"}, {"t": 1549.8666666666666, "x": "この方は1992年に、心臓発作で\n亡くなっている。58歳だった。"}, {"t": 1554.9833333333333, "x": "起訴はされていない。"}, {"t": 1556.0333333333333, "x": "逮捕もされていない。"}, {"t": 1557.4666666666667, "x": "じゃあ、なんで名前が出たの？"}, {"t": 1559.3, "x": "順を追う。"}, {"t": 1559.9833333333333, "x": "バレーホ警察がこの人に注目したのは1971年だ。"}, {"t": 1564.0166666666667, "x": "最初の2件のあとになる。"}, {"t": 1565.7333333333333, "x": "知人が警察に、この人は大量殺人の空想を\n語っていた、と話したことがきっかけだった。"}, {"t": 1571.6666666666667, "x": "本人は1991年に、記者の取材を\n受けている。そこでこう話している。"}, {"t": 1576.7333333333333, "x": "1971年からずっと、指紋を取られ、\n取り調べを受け、筆跡を書かされ、"}, {"t": 1581.95, "x": "10時間の嘘発見器にかけられた、と。"}, {"t": 1584.7666666666667, "x": "……20年。"}, {"t": 1585.6333333333334, "x": "1972年には、サンフランシスコ市警が令状を\n取って、この人のトレーラーを捜索している。"}, {"t": 1591.8166666666666, "x": "1991年には、バレーホ警察が自宅を捜索した。"}, {"t": 1595.9, "x": "当時のバレーホ警察の警部は、新聞にこう答えている。"}, {"t": 1599.3166666666666, "x": "「書き物や、いくつかの違法な\n武器が見つかった。だが、この人物を\nゾディアックとして逮捕するには、"}, {"t": 1605.0, "x": "どれも足りなかった」"}, {"t": 1606.3333333333333, "x": "名前が公に出たのは、この方が亡くなったあとだ。"}, {"t": 1609.35, "x": "1992年に、バレーホ警察の警部が発表した。"}, {"t": 1613.4333333333334, "x": "……亡くなってから。"}, {"t": 1614.6166666666666, "x": "本人が答えられる場所は、もう無くなっていた。"}, {"t": 1618.0666666666666, "x": "2002年、サンフランシスコ市警が新しい検査をした。"}, {"t": 1621.5166666666667, "x": "本物と認められている手紙の切手と\n封筒から、部分的なDNAを取り出したんだ。"}, {"t": 1626.7333333333333, "x": "そして、アレンさんのものと比べた。"}, {"t": 1629.0833333333333, "x": "一致したの？"}, {"t": 1630.1333333333334, "x": "しなかった。当時の担当の捜査官は、\nこう発表している。"}, {"t": 1633.8666666666666, "x": "「アーサー・リー・アレンは、\n本物のゾディアックの手紙から得られた\n部分的なDNAと一致しない」"}, {"t": 1639.2833333333333, "x": "じゃあ、別の人だったのね。"}, {"t": 1641.2333333333333, "x": "そこが、簡単ではない。"}, {"t": 1642.85, "x": "あとになって、評価が変わった。"}, {"t": 1644.8333333333333, "x": "2018年の新聞は、こう書いている。"}, {"t": 1647.3166666666666, "x": "取り出せた情報があまりに少なく、\n決め手にはならないと考えられている、と。"}, {"t": 1652.0, "x": "……一致しなかった、でもないの？"}, {"t": 1653.9833333333333, "x": "「一致した」とも「一致しなかった」とも\n言い切れない、という状態だ。"}, {"t": 1658.1833333333334, "x": "だから、この方はいまも\n容疑者の一人として扱われている。"}, {"t": 1661.8, "x": "ついでに、筆跡の話もしておく。"}, {"t": 1664.1333333333334, "x": "この事件を何十年も担当した、\n警察の筆跡の専門家がいる。いまは退職している。"}, {"t": 1669.75, "x": "2009年の取材で、こう話している。"}, {"t": 1672.2666666666667, "x": "「アレンの筆跡が箱いっぱいに届いた。だが、\nどれ一つ、ゾディアックには近くもなかった」"}, {"t": 1677.65, "x": "ここまでが、警察が名前を出した\n唯一の人についての話だ。"}, {"t": 1681.6666666666667, "x": "2004年4月、サンフランシスコ市警は、\nこの事件を休止にした。"}, {"t": 1686.0166666666667, "x": "休止？"}, {"t": 1686.7333333333333, "x": "担当の捜査官を置かない、という意味だ。"}, {"t": 1689.0333333333333, "x": "解決したという意味ではない。"}, {"t": 1690.8, "x": "当時の殺人課長は、こう説明している。"}, {"t": 1693.5, "x": "「いま抱えている事件の量を考えると、人の使い方を\nいちばん効率のいい形にする必要がある」"}, {"t": 1699.3333333333333, "x": "ただし、こうも言っている。"}, {"t": 1700.8666666666666, "x": "「この事件が我々にとって\n消えてなくなるわけではない」"}, {"t": 1703.8833333333334, "x": "そして2007年、市警はこの事件をもう一度動かした。"}, {"t": 1707.4833333333333, "x": "証拠をバレーホ警察に渡して、\n新しいDNA検査にかけるためだ。"}, {"t": 1712.4, "x": "DNAの話を、もう少し続ける。"}, {"t": 1714.8833333333334, "x": "この事件には、犯人が触ったはずのものが残っている。"}, {"t": 1718.15, "x": "手紙の切手と、封筒のフタだ。"}, {"t": 1720.55, "x": "舐めて貼るものね。"}, {"t": 1721.8833333333334, "x": "そうだ。だから、唾液が付いている可能性がある。"}, {"t": 1724.8333333333333, "x": "ところが、うまくいかない。理由は3つある。"}, {"t": 1727.5, "x": "1つ目。DNAという考え方が世の中に出てくる\n前に、これらの紙は何十人もの手で扱われている。"}, {"t": 1733.9833333333333, "x": "ナパ郡保安官事務所の巡査部長は、\n2018年の取材でこう言っている。"}, {"t": 1738.5666666666666, "x": "「ゾディアックの事件が起きたころ、"}, {"t": 1740.2666666666667, "x": "DNAという言葉を聞いた者は誰もいなかった。\nそういう前提で保管されていない」"}, {"t": 1745.1333333333334, "x": "2つ目。取れる量が少ない。"}, {"t": 1747.0833333333333, "x": "サンフランシスコ市警でこの事件を担当している\n捜査官は、2018年にこう話している。"}, {"t": 1752.5833333333333, "x": "「私が持っているものの大半は、\nDNAとしてはあまり通用しないだろう。"}, {"t": 1756.75, "x": "多くは部分的なもので、そこから\n何かをするのは難しい」"}, {"t": 1760.4, "x": "3つ目。実際に出してみても、出てこない。"}, {"t": 1763.2333333333333, "x": "ナパ郡は2010年に、現場に残っていた物を\nカリフォルニア州司法省の研究所に送っている。"}, {"t": 1768.95, "x": "結果はこうだ。「そのどれからも、\n本当に使えるDNAは得られなかった」"}, {"t": 1773.4666666666667, "x": "……一つも？"}, {"t": 1774.3833333333334, "x": "一つもだ。"}, {"t": 1775.3, "x": "2018年には、バレーホ警察がもう一度挑んでいる。"}, {"t": 1778.7666666666667, "x": "きっかけは、同じカリフォルニアで別の未解決事件が、"}, {"t": 1782.0, "x": "家系図をたどるDNAの手法で解決したことだった。"}, {"t": 1785.4166666666667, "x": "バレーホ警察は、1969年7月31日の手紙の封筒2通を、\n切手ごと民間の研究所へ送った。"}, {"t": 1793.1, "x": "出たの？"}, {"t": 1793.8333333333333, "x": "出ていない。新聞は\n「そこからは何も出なかった」と書いている。"}, {"t": 1797.7333333333333, "x": "ある警察関係者は、名前を出さない\n形でこう言っている。"}, {"t": 1801.2666666666667, "x": "「あちらの事件には、"}, {"t": 1802.35, "x": "一本まるごとのDNAがあった。こちらは\n違う。あるのはパンくずで、しかも質がよくない」"}, {"t": 1807.8833333333334, "x": "……パンくず。"}, {"t": 1808.7166666666667, "x": "それが、いま手元にあるものだ。"}, {"t": 1811.3666666666666, "x": "2021年10月6日、この事件は\n日本でも大きく報じられた。"}, {"t": 1815.7833333333333, "x": "何かあったの？"}, {"t": 1816.9333333333334, "x": "民間の団体が、犯人はこの人物だ、と発表したんだ。"}, {"t": 1820.8333333333333, "x": "ケース・ブレイカーズという名前の団体だ。"}, {"t": 1822.9833333333333, "x": "元の捜査官や軍の出身者、\nおよそ40人が集まっている。"}, {"t": 1827.05, "x": "名前を出された人物は、2018年に亡くなっている。"}, {"t": 1830.5833333333333, "x": "この動画では、その方の名前は出さない。"}, {"t": 1833.2666666666667, "x": "なんで？"}, {"t": 1833.9666666666667, "x": "どの警察機関も、その人を\n容疑者として扱っていないからだ。"}, {"t": 1838.0, "x": "地元のテレビ局は、記事の中でこう書いている。"}, {"t": 1840.75, "x": "「この人物は、どの警察からも\n名前を挙げられていない」"}, {"t": 1844.0833333333333, "x": "発表の根拠として挙がったのは、写真、\n額の傷あと、靴の大きさ、知人の証言。"}, {"t": 1849.5, "x": "それから、暗号の中に本人の名前が\n隠れている、という主張だった。"}, {"t": 1853.8166666666666, "x": "この最後の主張について、地元紙はこう書いている。"}, {"t": 1856.7666666666667, "x": "「それを裏付ける証拠は、まだ一つも示されていない」"}, {"t": 1860.0, "x": "では、公的機関は何と答えたか。"}, {"t": 1862.4, "x": "FBIは、こう答えた。"}, {"t": 1864.0833333333333, "x": "「ゾディアック・キラーの事件は開いたままだ。\nいま共有できる新しい情報は無い」"}, {"t": 1868.5333333333333, "x": "別の社の取材には、こう答えている。"}, {"t": 1870.8833333333334, "x": "「FBIのゾディアック・キラーの捜査は、\n開いたままであり、未解決である」"}, {"t": 1875.15, "x": "「捜査が継続中であること、そして被害者とその家族に\n配慮して、現時点でこれ以上の説明はしない」"}, {"t": 1881.4833333333333, "x": "サンフランシスコ市警はこうだ。"}, {"t": 1883.3166666666666, "x": "「これは今も開いている\n捜査なので、容疑者の可能性がある\n人物について話すことはできない」"}, {"t": 1888.7333333333333, "x": "バレーホ警察も同じだった。"}, {"t": 1890.4, "x": "3つの機関が、そろって同じ答えを出した。"}, {"t": 1893.45, "x": "……認めなかったのね。"}, {"t": 1894.8833333333334, "x": "認めても、否定してもいない。"}, {"t": 1896.7, "x": "「捜査中なので話さない」だ。"}, {"t": 1898.7, "x": "ただ一つだけ、はっきり否定されたところがある。"}, {"t": 1901.65, "x": "この団体は、1966年のリバーサイドの事件も\n同じ人物だと言った。"}, {"t": 1906.7, "x": "リバーサイド市警の広報は、こう答えている。"}, {"t": 1909.35, "x": "「我々は100パーセント、"}, {"t": 1910.7, "x": "シェリ・ジョ・ベイツさんの事件はゾディアックとは"}, {"t": 1913.0666666666666, "x": "関係ないと考えている。その点は何も変わっていない」"}, {"t": 1916.4, "x": "さらに、こうも言っている。"}, {"t": 1917.9333333333334, "x": "「もし関係があるなら、55年たった今、\n隠す理由は無い。はっきり言う。"}, {"t": 1922.25, "x": "2つの事件は関係ない」"}, {"t": 1924.1666666666667, "x": "……そこまで言うのね。"}, {"t": 1925.4333333333334, "x": "そこまで言った。公的機関が、これだけ\nはっきり否定した例は珍しい。"}, {"t": 1930.4, "x": "ここからは、私の見方だ。"}, {"t": 1932.25, "x": "事実と分けて聞いてほしい。"}, {"t": 1933.9666666666667, "x": "この事件を紙の記録だけで追ってみて、\n引っかかったことが三つある。"}, {"t": 1938.05, "x": "一つ目。この人物は、隠したいのか、\n知られたいのか、最後まで分からない。"}, {"t": 1942.9333333333334, "x": "顔を隠し、指紋を拭き取り、\n名前は教えないと暗号に書いた。"}, {"t": 1946.7833333333333, "x": "その一方で、自分から名乗り、印を\n作り、新聞社に手紙を送り続けた。"}, {"t": 1951.7, "x": "現場の車のドアには、\nそれまでの日付を自分で書いていった。"}, {"t": 1955.4833333333333, "x": "警察が結び付ける前に、自分でつないだのよね。"}, {"t": 1958.7666666666667, "x": "そうだ。捕まりたくないなら、\nやらなくていいことばかりしている。"}, {"t": 1962.4666666666667, "x": "二つ目。解けた暗号に、身元に\nつながるものが一つも無かったことだ。"}, {"t": 1966.9, "x": "408文字にも、340文字にも、名前は無い。"}, {"t": 1970.55, "x": "そして「私の名前は」と書いた\nあとの13文字だけが、解けない。"}, {"t": 1974.7666666666667, "x": "三つ目。これがいちばん引っかかる。"}, {"t": 1976.9, "x": "この事件は、記録が閉じていない。"}, {"t": 1979.0666666666666, "x": "FBIは文書を7分冊で公開している。"}, {"t": 1981.6166666666666, "x": "手紙は写しが出回っている。"}, {"t": 1983.2833333333333, "x": "暗号は誰でも見られる。"}, {"t": 1984.8833333333334, "x": "現に、その公開された暗号を、\n警察でもFBIでもない3人が解いた。"}, {"t": 1989.5, "x": "開いているのに、決まらない。"}, {"t": 1991.25, "x": "この形は、ディアトロフ峠の回でも同じだった。"}, {"t": 1994.2, "x": "読めるのに、決まらない。"}, {"t": 1995.7833333333333, "x": "ただ、こちらには一つ違うところがある。"}, {"t": 1998.2833333333333, "x": "カリフォルニアでは、殺人に時効が無い。"}, {"t": 2000.7, "x": "州の法律にこう書いてある。"}, {"t": 2002.2833333333333, "x": "死刑または終身刑にあたる罪の訴追は、\nいつでも始めることができる、と。"}, {"t": 2007.1166666666666, "x": "じゃあ、今でも裁けるのね。"}, {"t": 2009.0166666666667, "x": "犯人が生きていれば、裁ける。"}, {"t": 2011.05, "x": "1968年の12月から、57年と9か月が\nたった。もうすぐ58年になる。"}, {"t": 2017.2833333333333, "x": "この事件は、まだ開いている。"}, {"t": 2019.85, "x": "最後に、整理しておく。"}, {"t": 2021.45, "x": "1968年12月から1969年10月まで、10\nか月のあいだに4件の襲撃があった。"}, {"t": 2028.6, "x": "亡くなった方が5人。"}, {"t": 2029.8666666666666, "x": "生き延びた方が2人。"}, {"t": 2031.4166666666667, "x": "犯人は自分でゾディアックと\n名乗り、丸に十字の印を使った。"}, {"t": 2035.2666666666667, "x": "暗号を4つ送り、解けたのは2つ。"}, {"t": 2037.45, "x": "名前が入っていると書かれた\n1つは、いまも解けていない。"}, {"t": 2040.9833333333333, "x": "本物と認められている手紙はおよそ20通。"}, {"t": 2043.65, "x": "最後は1974年7月8日だ。"}, {"t": 2046.5666666666666, "x": "警察が公に名前を出した容疑者は一人だけ。"}, {"t": 2049.483333333333, "x": "起訴はされていない。その方は1992年に亡くなった。"}, {"t": 2053.6, "x": "2021年に民間の団体が別の名前を出した。"}, {"t": 2056.866666666667, "x": "どの警察機関も、それを認めていない。"}, {"t": 2059.5, "x": "事件は、サンフランシスコ市警、\nバレーホ警察、ナパ郡保安官事務所、"}, {"t": 2063.9333333333334, "x": "ソラノ郡、そしてカリフォルニア州司法省に、\nいまも開いたまま残っている。"}, {"t": 2068.5666666666666, "x": "……57年ね。"}, {"t": 2069.8166666666666, "x": "57年と9か月だ。"}, {"t": 2071.6, "x": "この回で、私は誰も犯人だと言わなかった。"}, {"t": 2074.616666666667, "x": "言えないからだ。公的機関が誰一人として\nそう言っていないし、起訴された人もいない。"}, {"t": 2079.766666666667, "x": "私が代わりに決める理由が、どこにも無い。"}, {"t": 2082.4166666666665, "x": "ただ、一つだけ確かなことがある。"}, {"t": 2084.7166666666667, "x": "この事件で、いちばん大きく\n動いたのは、警察の捜査ではなかった。"}, {"t": 2088.85, "x": "新聞に載った340個の記号を、51年後に、\n会ったこともない3人が解いた。"}, {"t": 2094.2166666666667, "x": "そこには名前が無かった。\nそれでも、3人はやり切った。"}, {"t": 2097.85, "x": "……名前が出なくても、意味はあったのかしら。"}, {"t": 2100.4166666666665, "x": "あったと思う。\n51年ぶんの「分からない」が、一つ減った。"}, {"t": 2104.5, "x": "出典を挙げておく。"}, {"t": 2105.7833333333333, "x": "襲撃の日付と当時の警察の発言は、"}, {"t": 2108.4, "x": "UPI通信が1968年と1969年に配信した記事、\nそれから1988年と2018年のまとめ記事。"}, {"t": 2117.5833333333335, "x": "手紙と暗号の文面は、当時の紙面から\n起こされた公開の翻刻。"}, {"t": 2121.733333333333, "x": "暗号の解読の経緯は、解いた3人自身が出した\n論文と、バージニア工科大学が2021年に出した記事。"}, {"t": 2128.6833333333334, "x": "FBIの立場は、FBIが公開しているページと、\n情報公開で出された全7分冊の文書。"}, {"t": 2134.8166666666666, "x": "容疑者と捜査の現況は、サンフランシスコ・\nクロニクルが2002年、2004年、2009年、"}, {"t": 2140.3166666666666, "x": "2018年に出した記事と、2021年10月の各社の報道。"}, {"t": 2145.016666666667, "x": "リバーサイドの件は、\nリバーサイド市警の公式の説明だ。"}, {"t": 2148.483333333333, "x": "どれも、いまインターネットで読める。"}, {"t": 2150.5333333333333, "x": "この事件について、あなたはどう\n考えるか。よかったらコメントで教えてほしい。"}, {"t": 2155.0833333333335, "x": "最後まで見てくれて、ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';

  }

  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

const mk=document.getElementById('mk');

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}

let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
