<script>
const D={"name": "093", "file": "093_編集用", "dur": 2118.91665625, "segs": [], "subs": [{"t": 0.0, "x": "1978年、昭和53年9月5日。"}, {"t": 3.55, "x": "この日、東京で\n起きたある事件の公訴時効が成立した。"}, {"t": 7.066666666666666, "x": "誰も逮捕されないまま、\n法律の上で終わった、ということだ。"}, {"t": 10.85, "x": "どんな事件なの。"}, {"t": 12.15, "x": "1962年の11月から、1963年の9月まで。"}, {"t": 16.983333333333334, "x": "10か月のあいだに、東京で十数件の事件が続いた。"}, {"t": 20.483333333333334, "x": "爆発、銃撃、脅迫。"}, {"t": 22.533333333333335, "x": "怪我をされた方は、分かっているだけで14人。"}, {"t": 25.35, "x": "亡くなった方は、いない。"}, {"t": 27.083333333333332, "x": "それで、犯人は。"}, {"t": 28.533333333333335, "x": "分かっていない。"}, {"t": 29.5, "x": "一人も捕まっていないし、起訴された人もいない。"}, {"t": 32.516666666666666, "x": "ただ、一つだけ残ったものがある。"}, {"t": 34.9, "x": "なに。"}, {"t": 35.55, "x": "名前だ。"}, {"t": 36.233333333333334, "x": "現場に置かれたものに、毎回、\n同じ名前が書かれていた。"}, {"t": 39.81666666666667, "x": "草加次郎。"}, {"t": 40.78333333333333, "x": "……それ、本名なの？"}, {"t": 42.266666666666666, "x": "分からない。"}, {"t": 43.05, "x": "本名かどうかも分からないし、\n読み方すら分かっていない。"}, {"t": 46.4, "x": "「そうか」なのか「くさか」なのか、\n書いた本人が言わなかったからだ。"}, {"t": 50.85, "x": "読み方も分からないのに、事件の名前になってるの。"}, {"t": 54.13333333333333, "x": "そうだ。犯人が自分で名乗った\n名前が、そのまま事件の名前になった。"}, {"t": 58.55, "x": "今日はこの、草加次郎事件を追っていく。"}, {"t": 60.983333333333334, "x": "先に、断っておくことがある。この事件の犯人は"}, {"t": 64.18333333333334, "x": "特定されていない。だから私は、誰かの名前を出して\n「この人がやった」という話は一切しない。"}, {"t": 70.06666666666666, "x": "使われたものがどういう\n仕組みだったのかには、一切触れない。"}, {"t": 73.45, "x": "どんな怪我だったかは、細かく話さない。"}, {"t": 75.88333333333334, "x": "面白がる話し方もしない。"}, {"t": 77.95, "x": "……ずいぶん、慎重なのね。"}, {"t": 79.65, "x": "慎重にもなる。証拠もないのに\n名前は出せないし、この種の話で"}, {"t": 83.65, "x": "仕組みや怪我を面白がって語るのは危険だ。"}, {"t": 86.31666666666666, "x": "……実際に痛い思いをした人がいるのよね？"}, {"t": 88.91666666666667, "x": "いる。そこは忘れない。"}, {"t": 90.41666666666667, "x": "1985年に、埼玉県の草加市で起きた\n「草加事件」というのが別にある。"}, {"t": 95.95, "x": "少年5人が有罪とされ、あとで無罪になった事件だ。"}, {"t": 99.35, "x": "名前が似ているだけで、\n今日の話とは何の関係もない。"}, {"t": 102.88333333333334, "x": "そこ、間違えやすいところね。"}, {"t": 104.96666666666667, "x": "間違えやすい。だから先に言っておいた。"}, {"t": 107.36666666666666, "x": "では、始めよう。"}, {"t": 109.21666666666667, "x": "1962年、昭和37年11月4日、午前11時ごろ。"}, {"t": 114.2, "x": "場所は東京都品川区の北品川。"}, {"t": 116.61666666666666, "x": "歌手の島倉千代子さんの、後援会の事務所だ。"}, {"t": 119.66666666666667, "x": "その事務所に、差出人の名前が\n書かれていない封筒が届いた。"}, {"t": 123.63333333333334, "x": "封筒は二重になっていた。"}, {"t": 125.28333333333333, "x": "23歳の男性の事務職員が、それを開けた。"}, {"t": 128.43333333333334, "x": "中から細長い筒が出てきて、それが発火した。"}, {"t": 131.78333333333333, "x": "……開けた人が。"}, {"t": 132.88333333333333, "x": "右手に火傷を負った。"}, {"t": 134.13333333333333, "x": "治るまで2週間と診断されている。"}, {"t": 136.43333333333334, "x": "怪我の話は、ここまでにする。"}, {"t": 138.45, "x": "ここで一つ、この事件のすべてを\n決めることが起きている。"}, {"t": 141.85, "x": "その筒の裏に、文字が書いてあった。"}, {"t": 144.31666666666666, "x": "なんて。"}, {"t": 145.06666666666666, "x": "草加次郎。"}, {"t": 145.91666666666666, "x": "それと、アルファベットの「K」。"}, {"t": 147.98333333333332, "x": "……名前を書いて送ってきたってこと。"}, {"t": 150.13333333333333, "x": "そういうことになる。"}, {"t": 151.33333333333334, "x": "普通、こういうことをする人間は、自分の痕跡を消す。"}, {"t": 154.81666666666666, "x": "この人物は逆だった。"}, {"t": 156.25, "x": "毎回、名前を置いていった。"}, {"t": 158.08333333333334, "x": "この一件の時点では、警察もまだ、\nこれが連続するとは思っていない。"}, {"t": 162.46666666666667, "x": "有名人の事務所に届いた、悪質な\nいやがらせ。そう見るのが自然だ。"}, {"t": 166.8, "x": "だが9日後に、二件目が来る。"}, {"t": 168.93333333333334, "x": "ここから10か月、東京はこの名前に\n付き合わされることになる。"}, {"t": 172.76666666666668, "x": "もう一つ、時代の話をしておく。"}, {"t": 175.1, "x": "1962年の東京は、工事だらけだった。"}, {"t": 178.43333333333334, "x": "2年後に東京オリンピックが控えていた。"}, {"t": 180.88333333333333, "x": "高速道路、新幹線、地下鉄。"}, {"t": 183.15, "x": "全部が同時に作られていた時期だ。"}, {"t": 185.51666666666668, "x": "一番にぎやかな時期じゃない。"}, {"t": 187.35, "x": "そのにぎやかな場所ばかりが、これから狙われていく。"}, {"t": 191.03333333333333, "x": "二件目は、1962年11月13日。"}, {"t": 194.58333333333334, "x": "東京都港区の麻布に住む、41歳の女性のところだ。"}, {"t": 198.4, "x": "バーに勤めていた方だという。"}, {"t": 200.23333333333332, "x": "島倉さんの事務所に届いたのと\n同じ形のものが、郵便で届いた。"}, {"t": 204.53333333333333, "x": "こちらは、発火しなかった。"}, {"t": 206.5, "x": "不発だったのね。"}, {"t": 207.83333333333334, "x": "不発だった。だから怪我をした人はいない。"}, {"t": 210.48333333333332, "x": "問題は、そこに書かれていた名前だ。"}, {"t": 213.0, "x": "また草加次郎。"}, {"t": 214.21666666666667, "x": "いや、違う。"}, {"t": 215.3, "x": "えっ。"}, {"t": 215.91666666666666, "x": "杉加次郎、と書いてあった。"}, {"t": 217.86666666666667, "x": "一字だけ違うのね。"}, {"t": 219.38333333333333, "x": "一字だけ違う。"}, {"t": 220.5, "x": "これを警察は筆跡鑑定にかけた。"}, {"t": 222.91666666666666, "x": "その結果、草加次郎と書いた\n人物と同じだと判断されている。"}, {"t": 227.06666666666666, "x": "じゃあ書き間違い、ってこと。"}, {"t": 229.03333333333333, "x": "そこは分からない。"}, {"t": 230.13333333333333, "x": "書き間違えたのか、わざと\n変えたのか、記録に残っていない。"}, {"t": 233.86666666666667, "x": "私が言えるのは、警察が筆跡で\n同一人物と見た、という事実までだ。"}, {"t": 238.6, "x": "ここで一つ、大事なことがある。"}, {"t": 240.7, "x": "この事件、警察は最初から「筆跡」を持っていた。"}, {"t": 244.25, "x": "同じ人間が書いたかどうかを、\n判断できる材料があったということだ。"}, {"t": 248.33333333333334, "x": "あとで話すが、この事件では指紋まで出ている。"}, {"t": 251.18333333333334, "x": "筆跡があって、指紋があって、\nそれでも捕まらなかった。"}, {"t": 254.78333333333333, "x": "この事件が今も語られるのは、そこだ。"}, {"t": 257.46666666666664, "x": "……材料はあったのに。"}, {"t": 258.8, "x": "あった。照らし合わせる相手がいなかった。"}, {"t": 261.18333333333334, "x": "その意味は、後の章で話す。"}, {"t": 263.81666666666666, "x": "三件目は、1962年11月20日の夕方5時過ぎ。"}, {"t": 268.15, "x": "場所は千代田区の有楽町。"}, {"t": 269.8666666666667, "x": "ニュー東宝映画劇場という映画館だ。"}, {"t": 272.15, "x": "映画を見終わった19歳の女性が、\n3階のロビーを通った。"}, {"t": 275.73333333333335, "x": "ソファの上に筒が置いてあった。"}, {"t": 277.5833333333333, "x": "それに触れたところ、発火した。"}, {"t": 279.76666666666665, "x": "……知らない人が置いていったものよね。"}, {"t": 281.93333333333334, "x": "そうだ。女性は火傷を負い、\n治るまで1週間と診断されている。"}, {"t": 285.85, "x": "その筒にも、草加次郎と書かれていた。"}, {"t": 288.43333333333334, "x": "四件目は、その6日後。"}, {"t": 290.06666666666666, "x": "11月26日の午後4時半ごろ。"}, {"t": 292.7, "x": "同じ有楽町の、日比谷映画劇場。"}, {"t": 295.15, "x": "2階のトイレを掃除していた47歳の女性従業員が、\n掃除を終えて廊下に出ようとした。"}, {"t": 300.6166666666667, "x": "扉を開けたときの風で、\n洗面台の上に置かれていたものが落ちて、発火した。"}, {"t": 305.46666666666664, "x": "この回は、怪我をした人はいない。"}, {"t": 307.43333333333334, "x": "火事にもなっていない。"}, {"t": 308.9, "x": "じゃあ、被害は無かったのね。"}, {"t": 310.8, "x": "被害は無かった。だが、\nこの一件が捜査上は一番大きい。"}, {"t": 314.6166666666667, "x": "どうして。"}, {"t": 315.45, "x": "ここで、指紋が出た。"}, {"t": 317.0833333333333, "x": "……指紋。"}, {"t": 317.75, "x": "残されていたものから、犯人のものとみられる\n指紋が検出されている。"}, {"t": 322.0, "x": "筆跡に続いて、指紋まで手に入った。"}, {"t": 324.6666666666667, "x": "この時点で警察は、同じ人物が\n繰り返しているとはっきり分かった。"}, {"t": 328.93333333333334, "x": "そして、置かれた場所を見てほしい。"}, {"t": 330.98333333333335, "x": "品川の事務所、麻布の個人宅、\n有楽町の映画館が二つ。"}, {"t": 335.1666666666667, "x": "最初の二件は、狙った相手に郵便で送っている。"}, {"t": 338.25, "x": "三件目と四件目は、誰が触るか\n分からない場所に置いている。"}, {"t": 342.0833333333333, "x": "……相手を選ばなくなってるってこと。"}, {"t": 344.1666666666667, "x": "そういうことになる。"}, {"t": 345.3666666666667, "x": "11月の頭は個人宛て、月末には不特定の場所。"}, {"t": 349.65, "x": "五件目は、1962年11月29日の夕方5時半ごろ。"}, {"t": 354.3333333333333, "x": "場所は世田谷区。街なかの電話ボックスだ。"}, {"t": 357.15, "x": "25歳の男性の会社員が、\n電話をかけようとして中に入った。"}, {"t": 361.23333333333335, "x": "棚の上に、本が一冊置いてあった。"}, {"t": 363.71666666666664, "x": "本。"}, {"t": 364.26666666666665, "x": "石川啄木の詩集だ。"}, {"t": 366.06666666666666, "x": "……忘れ物みたいに見えるわね。"}, {"t": 367.93333333333334, "x": "見える。だから男性はそれを手に取った。"}, {"t": 370.35, "x": "本とケースのあいだに、栞のような紙が挟まっていた。"}, {"t": 373.7, "x": "それを引き抜いた瞬間に、発火した。"}, {"t": 376.1666666666667, "x": "男性は左手に火傷を負い、\n治るまで5日と診断されている。"}, {"t": 379.96666666666664, "x": "そして、その紙にも書いてあった。"}, {"t": 382.28333333333336, "x": "草加次郎。"}, {"t": 383.26666666666665, "x": "草加次郎だ。"}, {"t": 384.26666666666665, "x": "六件目は、12月12日の夜8時ごろ。"}, {"t": 387.28333333333336, "x": "台東区の浅草寺の境内。切り株の上だ。"}, {"t": 390.1333333333333, "x": "夜の見回りをしていた警備員が、\n本が一冊置いてあるのを見つけた。"}, {"t": 394.1333333333333, "x": "新書の大きさの、エラリー・\nクイーンの推理小説だった。"}, {"t": 397.65, "x": "また本なの。"}, {"t": 398.73333333333335, "x": "また本だ。"}, {"t": 399.55, "x": "ただ、開こうとしても開かない。"}, {"t": 401.68333333333334, "x": "それで表紙を破ったところ、中身が\n普通の本ではないと分かった。"}, {"t": 405.55, "x": "これは発火しなかった。"}, {"t": 406.8833333333333, "x": "未遂に終わっている。"}, {"t": 408.1666666666667, "x": "この一件は、資料によって\n負傷者がいたかどうかが食い違っている。"}, {"t": 412.03333333333336, "x": "だから私は「未遂に終わった」とだけ言う。"}, {"t": 414.9166666666667, "x": "それにしても、詩集と推理小説って。"}, {"t": 417.6166666666667, "x": "そこだ。"}, {"t": 418.3, "x": "石川啄木と、エラリー・クイーン。"}, {"t": 420.53333333333336, "x": "どちらも、人が思わず手に取る本だ。"}, {"t": 423.0, "x": "置かれた場所も、電話ボックスと寺の境内。"}, {"t": 425.71666666666664, "x": "誰が通るか分からない場所に、\n誰でも手に取るものを置いている。"}, {"t": 429.3833333333333, "x": "……選んでるのよね、そこまで。"}, {"t": 431.26666666666665, "x": "選んでいると見るしかない。"}, {"t": 432.76666666666665, "x": "そして、この12月12日を\n最後に、事件はいったん止まる。"}, {"t": 436.6666666666667, "x": "次に動くまで、5か月かかる。"}, {"t": 439.4166666666667, "x": "1962年12月から1963年の5月まで、\nこの名前は出てこない。"}, {"t": 445.21666666666664, "x": "やめたのかしら。"}, {"t": 446.4, "x": "当時の捜査側がどう考えたかは、\n記録が残っていない。"}, {"t": 449.8833333333333, "x": "はっきりしているのは、この5か月のあいだも\n捜査本部は動いていたことだ。"}, {"t": 454.1, "x": "ここで、この時期の東京の話をしておきたい。"}, {"t": 456.98333333333335, "x": "1963年3月、東京でもう一つ大きな事件が起きている。"}, {"t": 461.56666666666666, "x": "吉展ちゃん事件だ。"}, {"t": 462.96666666666664, "x": "台東区で4歳の男の子が連れ去られ、\n身代金が要求された事件だ。"}, {"t": 467.6333333333333, "x": "……同じころなのね。"}, {"t": 468.9, "x": "同じころで、しかも同じ台東区だ。"}, {"t": 471.26666666666665, "x": "この二つは別々の事件だが、のちに\n国会で必ず並べて出てくるようになる。"}, {"t": 476.1, "x": "それから、同じ1963年の3月に、\n一本の映画が公開されている。"}, {"t": 481.25, "x": "黒澤明監督の「天国と地獄」だ。"}, {"t": 484.28333333333336, "x": "誘拐の映画よね。"}, {"t": 485.6666666666667, "x": "そうだ。"}, {"t": 486.26666666666665, "x": "この映画の中に、走っている列車から\n身代金を落とさせる場面がある。"}, {"t": 490.53333333333336, "x": "窓から現金を投げさせる、という方法だ。"}, {"t": 493.3, "x": "……それ、あとで出てくるやつ。"}, {"t": 495.0833333333333, "x": "出てくる。9月の話だ。"}, {"t": 496.9, "x": "この映画が公開されたあと、同じ方法を現実で使った\n最初の事件が、この草加次郎事件だとされている。"}, {"t": 503.5, "x": "吉展ちゃん事件の犯人も、この映画を見て\n誘拐を考えたと言われているが、"}, {"t": 507.8833333333333, "x": "受け渡しの方法は真似ていない。"}, {"t": 509.95, "x": "つまり、1963年の東京というのは、そういう年だった。"}, {"t": 514.25, "x": "映画が現実に移ってくる、と\n当時の人が本気で言っていた年だ。"}, {"t": 518.3166666666667, "x": "そして5月、名前が戻ってくる。"}, {"t": 520.55, "x": "戻ってきたときには、やり方が変わっていた。"}, {"t": 523.9833333333333, "x": "1963年5月9日。"}, {"t": 526.5166666666667, "x": "女優の吉永小百合さんの自宅に、\n一通の手紙が届いた。"}, {"t": 530.2166666666667, "x": "手紙の差出人は、草加次郎。"}, {"t": 532.6, "x": "また同じ名前ね。"}, {"t": 533.9666666666667, "x": "同じ名前だ。"}, {"t": 534.9833333333333, "x": "中身は、100万円を出せ、というものだった。"}, {"t": 537.8166666666667, "x": "この手紙は1通では終わらない。"}, {"t": 539.6833333333333, "x": "5月9日、5月14日、5月23日、\n7月15日、7月17日、7月22日。"}, {"t": 547.0166666666667, "x": "全部で6通が届いている。"}, {"t": 548.7333333333333, "x": "手紙の中で、草加次郎は自分のことを\n台東区に住んでいると書いていた。"}, {"t": 553.0666666666667, "x": "それから、受け渡しの場所も指定している。"}, {"t": 555.6833333333333, "x": "上野駅の正面横にある喫茶店だ。"}, {"t": 558.0333333333333, "x": "吉永さんの父親に、そこへ来い、と書いていた。"}, {"t": 561.2833333333333, "x": "……お父さんを指定したのね。"}, {"t": 562.9666666666667, "x": "そうだ。"}, {"t": 563.6, "x": "そして、警察は当然その喫茶店を張った。"}, {"t": 566.5, "x": "結果を先に言うと、犯人は一度も現れていない。"}, {"t": 569.7, "x": "来なかったの。"}, {"t": 570.7666666666667, "x": "来なかった。"}, {"t": 571.7666666666667, "x": "……お金が目的じゃなかったのかしら。"}, {"t": 574.05, "x": "そう見る人はいる。"}, {"t": 575.2166666666667, "x": "ただ、本人が言い残していないので、\nそこは分からない。"}, {"t": 578.5666666666667, "x": "分からないことを、私が決めることはしない。"}, {"t": 581.2333333333333, "x": "もう一つ、この手紙には入っていたものがある。"}, {"t": 584.05, "x": "弾丸だ。"}, {"t": 584.9833333333333, "x": "弾丸。"}, {"t": 585.7333333333333, "x": "そうだ。手紙と一緒に、弾が入っていた。"}, {"t": 588.5, "x": "それが何を意味するかは、次の章で分かる。"}, {"t": 591.15, "x": "あとで分かったことだが、脅迫状を\n受け取っていたのは吉永さんだけではない。"}, {"t": 595.5166666666667, "x": "当時18歳だった鰐淵晴子さん、\n21歳だった桑野みゆきさんの自宅にも、"}, {"t": 600.5333333333333, "x": "弾丸を入れて100万円を要求する手紙が届いていた。"}, {"t": 604.45, "x": "1963年7月15日、夜7時45分ごろ。"}, {"t": 608.7333333333333, "x": "場所は台東区の上野公園。不忍池の近くだ。"}, {"t": 612.0166666666667, "x": "そこでおでんの屋台を出していた\n27歳の男性が、撃たれた。"}, {"t": 615.95, "x": "……撃たれた。"}, {"t": 616.7833333333333, "x": "撃たれた。"}, {"t": 617.4666666666667, "x": "男性は病院に運ばれ、全治3\nか月の重傷と診断されている。"}, {"t": 621.65, "x": "容態については、ここまでにする。"}, {"t": 623.7666666666667, "x": "ここまでの6件は、置く、送る、だった。"}, {"t": 626.55, "x": "それが、撃つ、に変わった。"}, {"t": 628.5333333333333, "x": "……全然違うじゃない。"}, {"t": 629.9166666666666, "x": "全然違う。"}, {"t": 630.9, "x": "しかも使われたのは、市販のものではなく\n自分で作った拳銃だったとされている。"}, {"t": 635.6666666666666, "x": "どう作られたのかという話はしない。"}, {"t": 637.8833333333333, "x": "私が言いたいのは、手口が一つに\n固定されていない、ということだ。"}, {"t": 642.05, "x": "……同じ人がやってるとは\n思えないくらい、ばらばらね。"}, {"t": 645.1166666666667, "x": "ばらばらだ。"}, {"t": 645.95, "x": "そして、この屋台の事件が草加次郎と\n結び付いたのは、撃たれた日ではない。"}, {"t": 650.4666666666667, "x": "10日後だ。"}, {"t": 651.2833333333333, "x": "1963年7月25日、上野警察署に一通の封書が届いた。"}, {"t": 656.4833333333333, "x": "中には、弾丸が一発だけ入っていた。"}, {"t": 659.15, "x": "手紙らしいものは入っていない。"}, {"t": 661.0666666666667, "x": "弾だけ。"}, {"t": 661.9666666666667, "x": "弾だけだ。"}, {"t": 662.8333333333334, "x": "警察が鑑定したところ、その弾は屋台の店主の体から\n取り出されたものと、材質も大きさも同じだった。"}, {"t": 669.6666666666666, "x": "そして封筒の裏に、草加次郎と書かれていた。"}, {"t": 672.6333333333333, "x": "その筆跡は、前の年の一連のものと一致した。"}, {"t": 676.05, "x": "……わざわざ、警察に送ったのね。"}, {"t": 678.2666666666667, "x": "送っている。"}, {"t": 679.1, "x": "「あれは自分だ」と、自分から知らせたことになる。"}, {"t": 682.0833333333334, "x": "吉永さんへの手紙に入っていた弾丸も、\nこの事件の弾と同じものだったとされている。"}, {"t": 687.3, "x": "手紙と銃撃が、一本につながった瞬間だ。"}, {"t": 690.9666666666667, "x": "1963年7月24日、午後3時ごろ。"}, {"t": 694.7, "x": "渋谷の東横デパートに、電話がかかってきた。"}, {"t": 697.5833333333334, "x": "要求は500万円。"}, {"t": 699.0666666666667, "x": "金額が上がってるわね。"}, {"t": 700.7, "x": "上がっている。吉永さんへの手紙は100万円だった。"}, {"t": 703.9, "x": "警察は指定された受け渡し場所を張った。"}, {"t": 706.45, "x": "ここでも、犯人は現れなかった。"}, {"t": 708.6833333333333, "x": "ところが、その日の午後3時50分。"}, {"t": 711.1, "x": "同じデパートの西館9階、男子トイレで爆発が起きた。"}, {"t": 714.75, "x": "怪我をした人はいない。"}, {"t": 716.15, "x": "2度目は8月11日の夕方。東館の屋上だ。"}, {"t": 719.7833333333333, "x": "これも爆発したが、怪我をした人はいない。"}, {"t": 722.5166666666667, "x": "3度目は8月14日の昼前。"}, {"t": 724.75, "x": "デパートの店長宛に、速達の小包が届いた。"}, {"t": 728.0166666666667, "x": "開封したところ爆発し、男性の職員が\n軽い火傷を負っている。"}, {"t": 732.0166666666667, "x": "この小包には手紙も入っていた。"}, {"t": 734.2, "x": "500万円を出せ、断ればデパートの中で\n本格的にやる、という内容だ。"}, {"t": 739.0333333333333, "x": "……お客さんがいるところで。"}, {"t": 740.6666666666666, "x": "そう書いてあった。"}, {"t": 741.7333333333333, "x": "警察はまた張り込んだ。"}, {"t": 743.15, "x": "犯人はまた現れなかった。"}, {"t": 745.0166666666667, "x": "そして、デパートの中での大きな爆発も起きなかった。"}, {"t": 748.3833333333333, "x": "この渋谷の3件が、本当に草加次郎なのか\nどうかが分かっていない。"}, {"t": 753.1, "x": "どういうこと。"}, {"t": 754.1166666666667, "x": "捜査当局は当然、この3件と草加次郎の関係を調べた。"}, {"t": 758.0666666666667, "x": "そのときに、合わないものが出てきた。"}, {"t": 760.3166666666667, "x": "筆跡だ。"}, {"t": 761.3166666666667, "x": "……手紙の字が違ったの。"}, {"t": 762.95, "x": "置かれていたものと、脅迫状の筆跡が違っていた。"}, {"t": 766.25, "x": "だから、草加次郎の名前を\nかたった別の人物ではないか、という見方があった。"}, {"t": 771.1833333333333, "x": "真似した人が出たってこと。"}, {"t": 773.0833333333334, "x": "その可能性がある、というところまでだ。"}, {"t": 775.4166666666666, "x": "断定はされていない。"}, {"t": 776.7166666666667, "x": "ここが、この事件のややこしいところだ。"}, {"t": 779.15, "x": "名前が新聞に何度も出た。"}, {"t": 780.9666666666667, "x": "名前が有名になると、その名前を使う人間が出てくる。"}, {"t": 784.4833333333333, "x": "そうすると、どれが本人でどれが\n別人か、分からなくなる。"}, {"t": 788.2666666666667, "x": "……名前を出したことが、逆に守りになってるのね。"}, {"t": 791.3333333333334, "x": "結果としてそうなった。"}, {"t": 792.8, "x": "これは私の推測ではなく、\n当時の国会でも同じことが言われている。"}, {"t": 797.0166666666667, "x": "1964年4月23日、衆議院の地方行政委員会。"}, {"t": 801.4666666666667, "x": "川村継義という議員が、\n前の年の犯罪の特徴について質問している。"}, {"t": 806.2166666666667, "x": "原文を読む。"}, {"t": 807.1833333333333, "x": "「昨年はいろいろな事件が起きた。\nたとえば吉展ちゃん事件というのもある、"}, {"t": 811.4166666666666, "x": "狭山市の女子高校生の殺人事件が起こっている、"}, {"t": 814.5333333333333, "x": "それから爆弾を持って人をおどかした\n草加次郎というような事件等々が起こっておる。」"}, {"t": 819.2833333333333, "x": "「犯罪が非常に模倣的というか、\n人まねをするというか、"}, {"t": 822.7666666666667, "x": "伝播性的な犯罪が急激に\n多くなっておるのではないか。」"}, {"t": 826.4, "x": "……真似される犯罪が\n増えている、って国会で言ってるのね。"}, {"t": 829.6666666666666, "x": "言っている。事件のすぐ翌年だ。"}, {"t": 831.8666666666667, "x": "出典は国立国会図書館の国会会議録検索システム。"}, {"t": 835.8333333333334, "x": "第46回国会、衆議院地方行政委員会 第37号、\n1964年4月23日だ。"}, {"t": 843.5833333333334, "x": "1963年9月5日、夜8時14分ごろ。"}, {"t": 847.4833333333333, "x": "場所は、営団地下鉄の銀座線、京橋駅。"}, {"t": 850.5166666666667, "x": "浅草を夜7時23分に出た、渋谷行きの電車だった。"}, {"t": 854.35, "x": "その電車が京橋駅に停まっているときに、\n車内で爆発が起きた。"}, {"t": 858.6166666666667, "x": "……走ってる電車の中。"}, {"t": 860.2, "x": "停車中だ。だが、車内には乗客がいた。"}, {"t": 863.0666666666667, "x": "10人が負傷している。"}, {"t": 864.3666666666667, "x": "重傷が2人、軽傷が8人だ。"}, {"t": 866.7333333333333, "x": "銀座線の、しかも京橋。"}, {"t": 868.5, "x": "東京のまん中で、帰宅の時間帯だ。"}, {"t": 871.25, "x": "……いちばん人が乗ってる時間じゃない。"}, {"t": 873.3666666666667, "x": "そうだ。"}, {"t": 873.9666666666667, "x": "これは、置かれたものが時間で動く仕掛けだった。"}, {"t": 876.9, "x": "それ以上の説明はしない。"}, {"t": 878.55, "x": "ここで、この事件を象徴する話をする。"}, {"t": 881.1833333333333, "x": "爆発のあとに残ったものの中に、\n文字が書かれていた。"}, {"t": 884.6666666666666, "x": "残ったものひとつひとつに、一文字ずつ。"}, {"t": 887.3666666666667, "x": "「次」と「郎」だ。"}, {"t": 888.9833333333333, "x": "……名前を、分けて書いてたの。"}, {"t": 890.8666666666667, "x": "分けて書いてあった。"}, {"t": 892.1, "x": "爆発すれば散らばる。"}, {"t": 893.4333333333333, "x": "散らばったものを拾えば、名前になる。"}, {"t": 895.8, "x": "そういう置き方をしている。"}, {"t": 897.35, "x": "それと、もう一つ。"}, {"t": 898.7666666666667, "x": "残っていたものに、こう刻まれていた。"}, {"t": 901.1, "x": "「つぎは10日」。"}, {"t": 902.15, "x": "……予告してるってこと。"}, {"t": 903.6833333333333, "x": "予告だ。"}, {"t": 904.4333333333333, "x": "この5日後に何かが起きる、と自分で書いていた。"}, {"t": 907.4, "x": "この10人の負傷者の数は、\n帝都高速度交通営団の記録に残っている。"}, {"t": 912.0333333333333, "x": "この一連の事件の中で、資料の裏づけが\n最もはっきりしているのが、この一件だ。"}, {"t": 917.8833333333333, "x": "地下鉄の翌日、1963年9月6日。"}, {"t": 921.5166666666667, "x": "吉永小百合さんの自宅に、7通目の手紙が届いた。"}, {"t": 925.0333333333333, "x": "要求はやはり100万円。"}, {"t": 926.6166666666667, "x": "ただ、この7通目は、それまでの6通と2つ違っていた。"}, {"t": 930.55, "x": "どこが。"}, {"t": 931.3333333333334, "x": "一つ目は、受け渡しの方法だ。"}, {"t": 933.5333333333333, "x": "それまでは「上野駅前の喫茶店に来い」だった。"}, {"t": 936.6333333333333, "x": "7通目は違った。"}, {"t": 937.9833333333333, "x": "9月9日か、9月10日。"}, {"t": 940.0833333333334, "x": "草加次郎が指定した急行列車に乗り、"}, {"t": 942.55, "x": "合図の場所で、走っている列車から現金を投げ落とせ。"}, {"t": 945.9666666666667, "x": "……走ってる列車から。"}, {"t": 947.4333333333333, "x": "そうだ。"}, {"t": 948.0333333333333, "x": "これは、同じ年の3月に公開された\n「天国と地獄」とまったく同じ方法だ。"}, {"t": 953.2833333333333, "x": "この映画が公開されたあと、現実で同じ方法が\n使われた最初の事件だとされている。"}, {"t": 958.6166666666667, "x": "映画を見てから考えたってこと。"}, {"t": 960.7166666666667, "x": "そう言い切る証拠は無い。"}, {"t": 962.0833333333334, "x": "ただ、方法が一致していることは事実だ。"}, {"t": 964.7666666666667, "x": "二つ目の違いは、手紙に絵が入っていたことだ。"}, {"t": 967.7833333333333, "x": "時間で動く仕掛けを示す絵だった。"}, {"t": 970.0, "x": "前日に地下鉄でやったばかりの、その形だ。"}, {"t": 973.2166666666667, "x": "……見せつけてるのね。"}, {"t": 974.55, "x": "そう読める。"}, {"t": 975.3333333333334, "x": "前日に、東京のまん中で10人が怪我をしている。"}, {"t": 978.5166666666667, "x": "そこへ、9日か10日に列車に乗れという手紙が来た。"}, {"t": 981.85, "x": "断れば、また同じことが起きるかもしれない。"}, {"t": 984.7333333333333, "x": "……断れないわね。"}, {"t": 985.9666666666667, "x": "断れない。"}, {"t": 986.8, "x": "だから警察は、この指定に乗った。"}, {"t": 989.7666666666667, "x": "1963年9月9日、夜7時10分発。"}, {"t": 993.7166666666667, "x": "上野駅から出る、常磐線の急行「十和田」。"}, {"t": 996.6333333333333, "x": "発車は、予定より1分遅れた。"}, {"t": 998.7833333333333, "x": "この列車に、警察は仕掛けた。"}, {"t": 1000.8833333333333, "x": "区間は上野から土浦まで。"}, {"t": 1002.5166666666667, "x": "沿線の距離は67キロだ。"}, {"t": 1004.6, "x": "その沿線に、警察官を約300名配置している。"}, {"t": 1008.0, "x": "無線で連絡を取り合う体制も組んである。"}, {"t": 1010.5333333333333, "x": "300人。"}, {"t": 1011.5166666666667, "x": "300人だ。"}, {"t": 1012.5666666666667, "x": "そして列車の中には、100万円の紙包みを\n持った捜査員が6名乗った。"}, {"t": 1017.1833333333333, "x": "ほかの車内には、普通の乗客がいる。"}, {"t": 1019.7833333333333, "x": "……うまくいけば、捕まえられたのよね。"}, {"t": 1022.0666666666667, "x": "うまくいけば捕まえられた。"}, {"t": 1023.6833333333333, "x": "結果を言う。"}, {"t": 1024.5166666666667, "x": "合図は、最後まで出なかった。"}, {"t": 1026.5333333333333, "x": "……出なかった。"}, {"t": 1027.5, "x": "出なかった。"}, {"t": 1028.3833333333334, "x": "翌9月10日も、警察は動いている。"}, {"t": 1030.8666666666666, "x": "手紙に「9日か10日」と書いてあったからだ。"}, {"t": 1033.9166666666667, "x": "この日、地下鉄の警戒も強められた。"}, {"t": 1036.5, "x": "そして、何も起きなかった。"}, {"t": 1038.4833333333333, "x": "……何も。"}, {"t": 1039.25, "x": "何も起きなかった。"}, {"t": 1040.5166666666667, "x": "これが、草加次郎事件の最後の日になる。"}, {"t": 1043.8333333333333, "x": "1963年9月10日を最後に、\nこの名前は現場から消えた。"}, {"t": 1048.2666666666667, "x": "爆発も、銃撃も、手紙も、来なくなった。"}, {"t": 1051.5666666666666, "x": "……急にやめたの。"}, {"t": 1052.7166666666667, "x": "急にやめた、ように見える。"}, {"t": 1054.45, "x": "なぜ止まったのか。"}, {"t": 1055.6166666666666, "x": "これについては、記録が何も無い。"}, {"t": 1057.8833333333334, "x": "……本人が言わなかったんだものね。"}, {"t": 1059.9333333333334, "x": "言っていない。捕まってもいない。"}, {"t": 1061.8166666666666, "x": "だから、止まった理由を私が説明することはできない。"}, {"t": 1065.15, "x": "捕まりそうになってやめた、別の理由で\n動けなくなった、ほかの罪で捕まっていた。"}, {"t": 1070.2333333333333, "x": "いろいろな言われ方があるが、\nどれも裏づけのある話ではない。"}, {"t": 1073.6833333333334, "x": "だから私は、どれも採らない。"}, {"t": 1075.75, "x": "……分からない、が答えなのね。"}, {"t": 1077.65, "x": "分からない、が答えだ。"}, {"t": 1079.1833333333334, "x": "ただ、事実として言えることが一つある。"}, {"t": 1081.75, "x": "止まったのは9月10日。"}, {"t": 1083.3333333333333, "x": "そして、警察の捜査本部は、そのあとも動き続けた。"}, {"t": 1086.9833333333333, "x": "止まったのは事件のほうで、捜査ではない。"}, {"t": 1089.5, "x": "その捜査が、どこまで行っていたのか。"}, {"t": 1091.8166666666666, "x": "それが分かる記録が、一つだけ残っている。"}, {"t": 1094.5833333333333, "x": "国会の議事録だ。"}, {"t": 1096.5666666666666, "x": "1964年2月4日、参議院の法務委員会。"}, {"t": 1100.2833333333333, "x": "日本社会党の稲葉誠一議員が、こう聞いた。"}, {"t": 1103.2, "x": "「いま、他にいろいろな重要な\n未解決事件がたくさんあるわけですね。"}, {"t": 1107.2666666666667, "x": "吉展ちゃんの事件とか、にせ\n札事件とか、草加次郎の事件とか、"}, {"t": 1111.65, "x": "バラバラ事件とか、いろいろありますね。"}, {"t": 1114.0166666666667, "x": "現在どういうふうになっておりますか、差しつかえない\n範囲で述べていただきたいと思います。」"}, {"t": 1119.15, "x": "……4つ並んでるのね。"}, {"t": 1120.6166666666666, "x": "4つとも、当時まだ犯人が捕まっていなかった事件だ。"}, {"t": 1124.15, "x": "これに答えたのが、警察庁の刑事局長、日原正雄だ。"}, {"t": 1128.0, "x": "この答弁が、この事件について政府が\n国会で述べた、唯一の記録になる。"}, {"t": 1132.7333333333333, "x": "草加次郎の部分を、そのまま読む。"}, {"t": 1134.9666666666667, "x": "「それから\n草加次郎の連続爆発事件のことでございますが、"}, {"t": 1138.6, "x": "これも途中の捜査経過は新聞で大体御存じと\n思いますが、現在の捜査状況を申しますと、"}, {"t": 1144.3333333333333, "x": "現在、捜査本部では、犯人が\n爆発物あるいは脅迫状を郵送いたしました"}, {"t": 1149.4, "x": "下谷郵便局管内を中心とする\n地取りの捜査を実施しております。」"}, {"t": 1153.65, "x": "下谷。"}, {"t": 1154.4, "x": "いまの台東区だ。上野と浅草のあたりになる。"}, {"t": 1157.3166666666666, "x": "郵便物の消印から、出された場所を\n絞り込んでいた、ということだ。"}, {"t": 1161.4333333333334, "x": "答弁は、こう続く。"}, {"t": 1162.8833333333334, "x": "「なお、容疑者として少年をほかの容疑で\n逮捕取り調べております部面もございますが、"}, {"t": 1167.8666666666666, "x": "一応現在捜査の主体を\n捜査四課から一課に移しまして、"}, {"t": 1171.55, "x": "二十七名の要員でもって捜査を続行中でございます。」"}, {"t": 1175.0333333333333, "x": "……少年を、別の容疑で。"}, {"t": 1176.8166666666666, "x": "そう書いてある。"}, {"t": 1177.75, "x": "ただし、ここははっきり言っておく。"}, {"t": 1179.7333333333333, "x": "この少年について分かっているのは、この一文だけだ。"}, {"t": 1183.0, "x": "名前も、年齢も、その後どうなったかも、記録に無い。"}, {"t": 1186.4666666666667, "x": "そして、この事件で起訴された\n人間は、最後まで一人もいない。"}, {"t": 1190.5666666666666, "x": "……じゃあ、関係なかったってことよね。"}, {"t": 1192.8333333333333, "x": "少なくとも、犯人とされたことは一度も無い。"}, {"t": 1195.7666666666667, "x": "私はこの少年について、これ以上は言わない。"}, {"t": 1198.6, "x": "もう一つ、この答弁には数字がある。"}, {"t": 1200.9666666666667, "x": "捜査四課から一課へ。そして要員27名。"}, {"t": 1204.0333333333333, "x": "四課は、当時は暴力団などを扱う部署だ。"}, {"t": 1206.9, "x": "一課は、殺人や傷害などを扱う部署になる。"}, {"t": 1209.8833333333334, "x": "つまり、組織がやっている線から、\n個人の線に見方を移したことになる。"}, {"t": 1214.3666666666666, "x": "出典は国会会議録検索システム。"}, {"t": 1216.95, "x": "第46回国会、参議院法務委員会 第2号、\n1964年2月4日だ。"}, {"t": 1223.4333333333334, "x": "もう一つ、ほとんど知られていない記録がある。"}, {"t": 1226.1666666666667, "x": "1964年5月7日、参議院の運輸委員会。"}, {"t": 1229.85, "x": "答えているのは、\n日本国有鉄道の公安本部長、向井潔だ。"}, {"t": 1234.0833333333333, "x": "原文を読む。"}, {"t": 1235.0333333333333, "x": "「御承知と思いますけれども、実は\n昨年は草加次郎の一連がございまして、"}, {"t": 1239.65, "x": "非常に投書が、全部で三十数件ございました。」"}, {"t": 1242.9333333333334, "x": "……三十数件。"}, {"t": 1244.05, "x": "国鉄に対して、それだけ来ていた。"}, {"t": 1246.4666666666667, "x": "続きがある。"}, {"t": 1247.3333333333333, "x": "「『とき号』なんかの点もございまして、\nこの場合は県警なんかも全部出ていただきまして、"}, {"t": 1252.4166666666667, "x": "非常に捜査をいたしました。"}, {"t": 1254.0333333333333, "x": "同じように、機関車に\nしかけるというのがございます。」"}, {"t": 1257.3, "x": "列車にも予告が来てたのね。"}, {"t": 1259.25, "x": "来ていた。"}, {"t": 1259.9833333333333, "x": "さらに、こう言っている。"}, {"t": 1261.4166666666667, "x": "「そういたしますと、やはり\n捜査の方法といたしまして、"}, {"t": 1264.65, "x": "公開いたしませんで内々でやりませんと\n犯人がつかまえられない。"}, {"t": 1268.3333333333333, "x": "とにかくあのようなかっこうの犯人はこちらが"}, {"t": 1270.65, "x": "警戒をいたしましてつかまえるより\n方法がございませんので、"}, {"t": 1273.9666666666667, "x": "つかまえなければいつまでも\nその恐怖は続くという観点から、"}, {"t": 1277.4666666666667, "x": "相当日々人数出しまして\n警備並びに捜査いたしました。」"}, {"t": 1281.0666666666666, "x": "……表に出さずにやってたのね。"}, {"t": 1282.9666666666667, "x": "出さずにやっていた。"}, {"t": 1284.2333333333333, "x": "そして、同じ日の委員会で、もう一つ出ている。"}, {"t": 1287.3, "x": "日本社会党の中村順造議員が、こう聞いた。"}, {"t": 1290.35, "x": "「草加次郎の話が出たから、それは\n妄想だったように思うのですが、"}, {"t": 1294.4, "x": "かなり警視庁の公安二課からの情報に基づいて"}, {"t": 1297.4333333333334, "x": "有力な情報だと判断をされたということを\n聞いたわけですが、"}, {"t": 1300.7, "x": "しかもその対象が労働組合の計画に\n基づいてやられるというような判断がされておった」"}, {"t": 1306.0, "x": "……労働組合。"}, {"t": 1307.0666666666666, "x": "そういう情報が、有力なものとして\n扱われていた、ということだ。"}, {"t": 1311.1, "x": "中村議員は、そのあとこう述べている。"}, {"t": 1313.4833333333333, "x": "「まあ労働組合は対象でも\n全くなかったということで、その点はわかりました」"}, {"t": 1318.2666666666667, "x": "全然関係なかったのね。"}, {"t": 1320.1333333333334, "x": "関係なかった。"}, {"t": 1321.2333333333333, "x": "つまり、この事件の捜査は、途中で明らかに\n違う方向を向いていた時期がある。"}, {"t": 1325.8666666666666, "x": "これは他のどの資料にも出てこない。"}, {"t": 1327.8333333333333, "x": "国会の記録にだけ残っている。"}, {"t": 1329.9333333333334, "x": "出典は、第46回国会 参議院運輸委員会 第24号、\n1964年5月7日だ。"}, {"t": 1337.5, "x": "1964年4月24日、衆議院の法務委員会。"}, {"t": 1341.5, "x": "日本社会党の横山利秋議員が、こう切り出している。"}, {"t": 1345.0, "x": "「最近おくら入りというものが非常に多い。」"}, {"t": 1347.3166666666666, "x": "「にせ札とか吉展ちゃんとか、あるいは草加次郎とか、"}, {"t": 1350.6, "x": "重要な犯罪というものが非常に\n迷宮入りがふえておる。」"}, {"t": 1353.9666666666667, "x": "……また同じ4つね。"}, {"t": 1355.3666666666666, "x": "同じ顔ぶれだ。"}, {"t": 1356.4666666666667, "x": "そして横山議員は、その先で厳しいことを言っている。"}, {"t": 1359.8, "x": "「国民の中には、これらの迷宮入りの事件に\n対する警察の布陣と、"}, {"t": 1364.1166666666666, "x": "それから大衆運動に対する即応態勢と比較をしてみて、"}, {"t": 1367.7833333333333, "x": "刑事警察に欠くるところがあるのではないか」"}, {"t": 1370.55, "x": "……人の配り方の話をしてるのね。"}, {"t": 1372.95, "x": "している。"}, {"t": 1373.6333333333334, "x": "デモや集会に出す人数と、\n事件を追う人数を比べている。"}, {"t": 1377.2166666666667, "x": "さらに、こうも言っている。"}, {"t": 1378.75, "x": "「いわゆる職人的刑事とサラリーマン刑事との断層が\n起こっておるのではないか」"}, {"t": 1383.1833333333334, "x": "ここで、数字を並べておく。"}, {"t": 1385.0, "x": "この事件で、警視庁が投入した\n捜査員は延べ1万9000人。"}, {"t": 1388.9666666666667, "x": "火薬や爆発物に詳しい人物などを、\nおよそ9600人リストアップしている。"}, {"t": 1394.15, "x": "9600人。"}, {"t": 1395.5166666666667, "x": "9600人分を、一人ずつ潰していったということだ。"}, {"t": 1399.1833333333334, "x": "そして、当たらなかった。"}, {"t": 1400.95, "x": "……なのに分からなかったの。"}, {"t": 1402.55, "x": "警察の資料の中に、その指紋も、\nその筆跡も、無かった。"}, {"t": 1406.7333333333333, "x": "だから警察は、こう判断している。"}, {"t": 1409.05, "x": "草加次郎には、前科も前歴も無い。"}, {"t": 1411.5833333333333, "x": "……初めてだった、ってこと。"}, {"t": 1413.35, "x": "少なくとも、記録に残る形で警察と\n関わったことが無い人物だった。"}, {"t": 1418.1166666666666, "x": "材料はあった。比べる相手が、どこにも無かった。"}, {"t": 1421.2333333333333, "x": "出典は、第46回国会 衆議院法務委員会 第30号、\n1964年4月24日。"}, {"t": 1428.2833333333333, "x": "捜査人数の数字は、当時の報道を\nまとめた資料による。"}, {"t": 1432.3833333333334, "x": "事件が止まってからも、この名前は消えなかった。"}, {"t": 1435.35, "x": "1963年9月13日。"}, {"t": 1438.0, "x": "推理作家の木々高太郎さんの自宅に、\n電話がかかっている。"}, {"t": 1441.7, "x": "電話の相手は「クサカ」と名乗った。"}, {"t": 1444.2, "x": "……推理作家に電話したの。"}, {"t": 1445.9666666666667, "x": "した。"}, {"t": 1446.5333333333333, "x": "それが翌年も続く。"}, {"t": 1448.0666666666666, "x": "1964年6月12日の朝、今度は\n木々さんの隣の家に電話がかかった。"}, {"t": 1453.5833333333333, "x": "「隣の林教授の家に時限爆弾を\n仕掛けた」という内容だ。"}, {"t": 1457.5, "x": "林教授というのは、本名・林髞として大学で\n教えていた、木々さん本人のことだ。"}, {"t": 1463.2833333333333, "x": "そして6月26日の夜8時10分ごろ、\n木々さんの家に直接かかってきた。"}, {"t": 1468.5166666666667, "x": "「おれは草加次郎だ」。そう言って切ったという。"}, {"t": 1470.9833333333333, "x": "これは読売新聞の1964年6月27日の記事に\n載っている。"}, {"t": 1475.95, "x": "……名乗る人が出てきたのね。"}, {"t": 1477.7, "x": "出てきた。本人かどうかは、分からない。"}, {"t": 1480.3, "x": "そして1967年。事件から4年後だ。"}, {"t": 1483.65, "x": "4月1日、参議院の予算委員会。"}, {"t": 1486.1833333333334, "x": "日本社会党の岡田宗司議員が、こう述べている。"}, {"t": 1489.2, "x": "「草加次郎はいまだつかまっておりません。"}, {"t": 1491.4, "x": "昨日の東京駅事件は、皆目まだ\n見当がついておらないという状況であります。」"}, {"t": 1496.2666666666667, "x": "……4年経っても出てくるのね。"}, {"t": 1498.0666666666666, "x": "出てくる。"}, {"t": 1499.4166666666667, "x": "そして同じ年の6月20日、参議院の運輸委員会。"}, {"t": 1502.9666666666667, "x": "運輸省の鉄道監督局長、増川遼三がこう答えている。"}, {"t": 1506.8833333333334, "x": "「私どもといたしましては、草加次郎的な\n爆発物による事件というものの"}, {"t": 1511.6333333333334, "x": "連鎖的に起こるということを非常に\nおそれておるわけでございまして」"}, {"t": 1515.4333333333334, "x": "……草加次郎「的な」。"}, {"t": 1517.0, "x": "そこだ。個人の名前が、事件の種類を\n指す言葉になっている。"}, {"t": 1520.8833333333334, "x": "この委員会で、日本共産党の岩間正男議員が\nこう問い詰めた。"}, {"t": 1524.75, "x": "「私はやっぱり草加次郎の問題を問題にしたい。"}, {"t": 1527.7666666666667, "x": "草加次郎の問題、これどこ行った。"}, {"t": 1529.85, "x": "どこへ行っちゃった、飛んじゃったか。"}, {"t": 1531.8833333333334, "x": "草加次郎の問題が起こって、あの問題が\n結局わからなくなったわけで」"}, {"t": 1536.2333333333333, "x": "このあと岩間議員は「現代の怪盗」\n「ネズミ小僧」という言い方もしている。"}, {"t": 1540.7, "x": "当時の国会でそう言われた、という\n記録として紹介するだけにしておく。"}, {"t": 1544.9333333333334, "x": "私はその言い方はしない。"}, {"t": 1546.4833333333333, "x": "怪我をされた方が14人いる事件だ。"}, {"t": 1549.0, "x": "……それで、答えはどうだったの。"}, {"t": 1550.9, "x": "ここが、この回の一番重いところだ。"}, {"t": 1553.3333333333333, "x": "答えたのは、警察庁の刑事局長、内海倫。"}, {"t": 1556.75, "x": "答弁の全文は、こうだ。"}, {"t": 1558.4833333333333, "x": "「草加次郎の件につきましては、\n私詳細承知いたしておりませんので、"}, {"t": 1562.7833333333333, "x": "警視庁より資料を取り寄せました\n上で、お答えいたします。」"}, {"t": 1566.3666666666666, "x": "……それだけ。"}, {"t": 1567.2666666666667, "x": "それだけだ。全部で70字しかない。"}, {"t": 1569.6833333333334, "x": "事件から4年。国会で名前を出されて、\n刑事局長が詳細を承知していないと答えた。"}, {"t": 1575.0666666666666, "x": "誤解のないように言っておく。"}, {"t": 1576.65, "x": "この事件を捜査していたのは警視庁で、\n内海刑事局長は警察庁の人だ。"}, {"t": 1581.5166666666667, "x": "役所が違うので、その場で細かく\n答えられなかったという読み方もできる。"}, {"t": 1585.9166666666667, "x": "だから私は「警察が捨てた」とは言わない。"}, {"t": 1588.8, "x": "ただ、このやり取りが国会の記録に\n残っている、という事実は残る。"}, {"t": 1592.9833333333333, "x": "出典は、第55回国会 参議院運輸委員会 第12号、\n1967年6月20日だ。"}, {"t": 1599.8333333333333, "x": "そして、さらに3年後。"}, {"t": 1601.5666666666666, "x": "1970年5月13日、参議院の運輸委員会。"}, {"t": 1605.4333333333334, "x": "日本社会党の岡三郎議員が、こう言っている。"}, {"t": 1608.3666666666666, "x": "「私は空の乗っ取り事件と同時に、空の草加次郎が\n出てくるのじゃないかという心配が一つある。」"}, {"t": 1614.2166666666667, "x": "……空の草加次郎。"}, {"t": 1615.55, "x": "1970年には、もう人の名前ですらない。"}, {"t": 1618.7833333333333, "x": "「捕まらない爆弾魔」という\n意味の、ただの言葉になっている。"}, {"t": 1622.4333333333334, "x": "本人は、1963年9月10日から\n一度も現れていないのにだ。"}, {"t": 1627.7666666666667, "x": "ここで、一つだけ別の事件に触れる。"}, {"t": 1630.2666666666667, "x": "1968年6月、横須賀線の電車で爆発が起きた事件だ。"}, {"t": 1635.1666666666667, "x": "この事件では、亡くなった方も、\n怪我をされた方も多数出ている。"}, {"t": 1639.15, "x": "草加次郎事件とは別の事件なので、\n中身には入らない。"}, {"t": 1642.7333333333333, "x": "この事件の犯人は、逮捕されている。"}, {"t": 1645.1166666666666, "x": "現場に残された新聞の切れ端から、購読者を\nたどって割り出されたと伝えられている。"}, {"t": 1650.3166666666666, "x": "……こっちは捕まったのね。"}, {"t": 1651.9333333333334, "x": "捕まった。"}, {"t": 1652.8, "x": "私がここで触れたいのは、\nその人物が語ったとされる言葉だ。"}, {"t": 1656.7833333333333, "x": "一つは「捕まらなかった草加次郎を尊敬する」。"}, {"t": 1659.8666666666666, "x": "もう一つは「草加次郎さえ出現しなければ、\n列車爆破なんてやらなかった」。"}, {"t": 1664.75, "x": "……両方言ってるの。"}, {"t": 1666.0, "x": "両方伝えられている。"}, {"t": 1667.3833333333334, "x": "ただ、この発言の出典は弱い。"}, {"t": 1669.6333333333334, "x": "一次の記録で確認できていないので、\n「そう伝えられている」以上のことは言わない。"}, {"t": 1674.3833333333334, "x": "草加次郎は、1963年9月10日で止まっている。"}, {"t": 1678.2833333333333, "x": "止まったあと、その名前が別の人間を\n動かした、という話になるからだ。"}, {"t": 1682.9833333333333, "x": "……名前だけが先に歩いていったのね。"}, {"t": 1685.25, "x": "そうなる。"}, {"t": 1685.9333333333334, "x": "この事件は、最初から最後まで\n「名前が広まること」と一緒に動いている。"}, {"t": 1690.6166666666666, "x": "名前を残したから有名になり、\n有名になったから真似が出て、"}, {"t": 1694.35, "x": "真似が出たから、どれが本人か分からなくなった。"}, {"t": 1697.4333333333334, "x": "……全部つながってるのね。"}, {"t": 1699.0, "x": "つながっている。"}, {"t": 1699.9833333333333, "x": "そして、その名前の持ち主だけが、\n最後まで出てこなかった。"}, {"t": 1704.5, "x": "1978年、昭和53年9月5日。"}, {"t": 1708.05, "x": "この日付で、公訴時効が成立した。"}, {"t": 1710.7, "x": "時効って、どういう仕組みだったの。"}, {"t": 1712.9166666666667, "x": "当時の法律の話をする。"}, {"t": 1714.7166666666667, "x": "公訴時効というのは、事件から一定の年数が\n経つと、検察が起訴できなくなる制度だ。"}, {"t": 1720.1833333333334, "x": "起訴できなくなるということは、\n裁判ができないということだ。"}, {"t": 1723.7, "x": "犯人が見つかっても、もう罪に問えない。"}, {"t": 1726.2666666666667, "x": "その年数は、罪の重さで決まっていた。"}, {"t": 1728.85, "x": "2004年に法律が変わる前は、死刑に\nあたる罪の時効は15年だった。"}, {"t": 1733.35, "x": "爆発物を使う罪には、死刑が定められている。"}, {"t": 1736.6, "x": "1963年9月5日から15年で、1978年9月5日になる。"}, {"t": 1742.5, "x": "……地下鉄の日から、ちょうど15年ね。"}, {"t": 1744.95, "x": "そうなる。"}, {"t": 1745.6333333333334, "x": "ただし、どの罪でどう計算されたのかを、\n政府が公表した記録は見つかっていない。"}, {"t": 1750.5666666666666, "x": "そこは分からないままだ。"}, {"t": 1751.9, "x": "分からないことは、分からないと言っておく。"}, {"t": 1754.4166666666667, "x": "はっきりしているのは、1978年9月5日付で\n時効が成立した、ということだ。"}, {"t": 1760.2166666666667, "x": "この日、何が終わったのか。"}, {"t": 1762.05, "x": "その全部が、この日で法律の上では意味を失った。"}, {"t": 1765.35, "x": "……誰も捕まらないまま。"}, {"t": 1766.9333333333334, "x": "誰も捕まらないまま。"}, {"t": 1768.4333333333334, "x": "それから、時効にはもう一つの側面がある。"}, {"t": 1771.25, "x": "疑われた側を解放する働きだ。"}, {"t": 1773.55, "x": "この事件では、9600人がリストに載っている。"}, {"t": 1776.8166666666666, "x": "その中には、何もしていないのに\n調べられた人が大勢いたはずだ。"}, {"t": 1780.9666666666667, "x": "……あ。"}, {"t": 1781.4333333333334, "x": "1964年の答弁にあった、別の容疑で\n取り調べを受けた少年もそうだ。"}, {"t": 1786.5166666666667, "x": "その人たちにとっては、この日が\n終わりの日でもあった。"}, {"t": 1789.7333333333333, "x": "時効という制度は、\n犯人のためだけにあるものではない。"}, {"t": 1793.0, "x": "そのことは、ここで言っておきたい。"}, {"t": 1795.0333333333333, "x": "なお、この15年という線は、\nその後の日本では変わっていく。"}, {"t": 1798.7333333333333, "x": "2004年に25年に延び、2010年には、\n人を死なせた重い罪の時効が廃止された。"}, {"t": 1804.4333333333334, "x": "だが、廃止は過去にさかのぼらない。"}, {"t": 1806.6333333333334, "x": "1978年に完成した時効が、\nあとから戻ってくることはない。"}, {"t": 1811.8833333333334, "x": "ここまでの話で、分かっていないことを並べておく。"}, {"t": 1814.9833333333333, "x": "一つ目。犯人が誰なのか。"}, {"t": 1817.0333333333333, "x": "これは分かっていない。"}, {"t": 1818.1, "x": "逮捕も起訴もされていない。"}, {"t": 1819.8, "x": "二つ目。何のためにやったのか。"}, {"t": 1821.9666666666667, "x": "金を要求した回は複数ある。だが、\n一度も受け取りに来ていない。"}, {"t": 1826.1833333333334, "x": "……お金じゃないのよね、たぶん。"}, {"t": 1827.9833333333333, "x": "そう見たくなる。だが、それも推測でしかない。"}, {"t": 1830.9333333333334, "x": "三つ目。なぜ止まったのか。"}, {"t": 1832.7833333333333, "x": "1963年9月10日から、ぱたりと何も無い。"}, {"t": 1836.35, "x": "理由の記録が無い。"}, {"t": 1837.6833333333334, "x": "四つ目。渋谷の3件が本当に同じ人物なのか。"}, {"t": 1841.1833333333334, "x": "筆跡が違ったので、\n別人という見方があった。決着していない。"}, {"t": 1845.45, "x": "五つ目。名前の読み方だ。"}, {"t": 1847.5, "x": "……そうだった。"}, {"t": 1848.45, "x": "「そうか」なのか「くさか」なのか、分かっていない。"}, {"t": 1851.7333333333333, "x": "本人が一度も名乗らなかったからだ。"}, {"t": 1854.0166666666667, "x": "文字では何度も書いた。"}, {"t": 1855.3166666666666, "x": "声では、一度も言っていない。"}, {"t": 1857.1666666666667, "x": "1964年に「おれは草加次郎だ」と\n電話をかけた人物はいるが、"}, {"t": 1861.85, "x": "それが本人かどうかは確かめられていない。"}, {"t": 1864.3333333333333, "x": "資料によっては「そうかじろう」、別の資料では\n「くさかじろう」と書かれている。"}, {"t": 1868.9333333333334, "x": "私はこの動画で「そうかじろう」と読んできたが、"}, {"t": 1871.9833333333333, "x": "それが正しいかどうかは、誰にも分からない。"}, {"t": 1874.6, "x": "六つ目。この名前に意味があるのかどうか。"}, {"t": 1877.1, "x": "埼玉県に草加という地名があるが、\n関係があるという根拠は何も無い。"}, {"t": 1881.3833333333334, "x": "最初の一件に添えられた「K」が\n何なのかも、分かっていない。"}, {"t": 1885.45, "x": "……全部、分からないのね。"}, {"t": 1887.1666666666667, "x": "全部だ。"}, {"t": 1887.9, "x": "分かっているのは、起きたことと、\n日付と、怪我をされた方の数。"}, {"t": 1891.9833333333333, "x": "それと、書き残された名前だけだ。"}, {"t": 1894.9166666666667, "x": "最後にまとめる。"}, {"t": 1896.05, "x": "1962年11月4日、品川の後援会事務所に届いた封筒。"}, {"t": 1901.0666666666666, "x": "11月13日、麻布。"}, {"t": 1902.9333333333334, "x": "11月20日、有楽町。"}, {"t": 1904.9166666666667, "x": "11月26日、日比谷。"}, {"t": 1907.1833333333334, "x": "11月29日、世田谷の電話ボックス。"}, {"t": 1910.05, "x": "12月12日、浅草寺。"}, {"t": 1912.1833333333334, "x": "ここでいったん止まり、5か月後に手紙で戻ってくる。"}, {"t": 1915.3666666666666, "x": "1963年5月9日から7月22日まで、\n吉永小百合さん宅へ6通。"}, {"t": 1921.25, "x": "7月15日、上野公園で屋台の店主が撃たれた。"}, {"t": 1924.6666666666667, "x": "7月24日、8月11日、8月14日、\n渋谷の東横デパートで3件。"}, {"t": 1930.3833333333334, "x": "9月5日夜8時14分、\n地下鉄銀座線の京橋駅で10人が負傷。"}, {"t": 1935.0833333333333, "x": "9月6日、7通目の手紙。"}, {"t": 1937.05, "x": "9月9日と10日、常磐線に300人。"}, {"t": 1940.0833333333333, "x": "そして、何も起きずに終わった。"}, {"t": 1942.1, "x": "怪我をされた方は、合わせて14人。"}, {"t": 1944.2333333333333, "x": "亡くなった方はいない。"}, {"t": 1945.7166666666667, "x": "1978年9月5日、公訴時効成立。"}, {"t": 1949.45, "x": "……こうやって並べると、10か月なのね。"}, {"t": 1952.0166666666667, "x": "10か月だ。"}, {"t": 1953.0166666666667, "x": "私がこの回で一番言いたいのは、\nこの事件の残り方だ。"}, {"t": 1956.7, "x": "普通、事件は被害者の名前か、地名で呼ばれる。"}, {"t": 1959.85, "x": "この事件は違う。犯人が自分で\n書いた名前で呼ばれている。"}, {"t": 1963.5333333333333, "x": "……自分でつけた名前が残ったのね。"}, {"t": 1965.8, "x": "残った。"}, {"t": 1966.55, "x": "そして、その名前だけが一人で歩いていった。"}, {"t": 1969.4, "x": "1964年、推理作家の家にかかってきた\n電話で名乗られた。"}, {"t": 1973.7333333333333, "x": "1967年、国会で「草加次郎的な事件」という\n言い方をされた。"}, {"t": 1978.75, "x": "同じ年、刑事局長は\n「詳細承知いたしておりません」と答えた。"}, {"t": 1983.0833333333333, "x": "1970年には「空の草加次郎」という言葉になった。"}, {"t": 1987.1833333333334, "x": "本人は、1963年9月10日から\n一度も出てきていないのにだ。"}, {"t": 1991.9166666666667, "x": "それでも名前だけが、7年ものあいだ使われ続けた。"}, {"t": 1995.4333333333334, "x": "……名前を残したかったのかしら。"}, {"t": 1997.45, "x": "それも分からない。"}, {"t": 1998.5333333333333, "x": "ただ、結果として残ったのは名前だけだ。"}, {"t": 2001.2, "x": "顔も、声も、理由も、何一つ残っていない。"}, {"t": 2004.4, "x": "最後に、怪我をされた14人の方のことを書いておく。"}, {"t": 2007.6166666666666, "x": "映画を見終わってロビーを歩いていた人。"}, {"t": 2009.7833333333333, "x": "電話をかけに入った人。"}, {"t": 2011.3, "x": "掃除をしていた人。"}, {"t": 2012.7166666666667, "x": "屋台を出していた人。"}, {"t": 2014.0333333333333, "x": "仕事で封筒を開けた人。"}, {"t": 2015.8166666666666, "x": "仕事帰りの地下鉄に乗っていた10人。"}, {"t": 2018.2333333333333, "x": "全員、その日たまたまそこにいただけの方たちだ。"}, {"t": 2021.4666666666667, "x": "……普通の一日だったのよね、その人たちには。"}, {"t": 2024.5333333333333, "x": "そうだ。"}, {"t": 2025.1333333333334, "x": "この事件は、犯人の名前で呼ばれている。"}, {"t": 2027.7333333333333, "x": "呼ばれていないのは、その14人のほうだ。"}, {"t": 2030.25, "x": "出典を挙げておく。"}, {"t": 2031.5333333333333, "x": "捜査状況と当時の議論は、\n国立国会図書館の国会会議録検索システムから。"}, {"t": 2036.9666666666667, "x": "第46回国会 参議院法務委員会 第2号、\n1964年2月4日。"}, {"t": 2042.7, "x": "第46回国会 衆議院地方行政委員会 第37号、\n1964年4月23日。"}, {"t": 2049.6666666666665, "x": "第46回国会 衆議院法務委員会 第30号、\n1964年4月24日。"}, {"t": 2055.95, "x": "第46回国会 参議院運輸委員会 第24号、\n1964年5月7日。"}, {"t": 2062.016666666667, "x": "第55回国会 参議院予算委員会 第5号、\n1967年4月1日。"}, {"t": 2067.85, "x": "第55回国会 参議院運輸委員会 第12号、\n1967年6月20日。"}, {"t": 2073.883333333333, "x": "第63回国会 参議院運輸委員会 第18号、\n1970年5月13日。"}, {"t": 2080.15, "x": "資料によって日付が食い違うところは、\n動画の中でそのつど断った。"}, {"t": 2084.45, "x": "事件の経過は、当時の朝日新聞・読売新聞・\n毎日新聞の報道をもとに構成された"}, { const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
