<script>
const D={"name": "093", "file": "093_編集用", "dur": 2111.3833125, "segs": [], "subs": [{"t": 0.0, "x": "1978年、昭和53年9月5日。"}, {"t": 3.55, "x": "この日、東京で\n起きたある事件の公訴時効が成立した。"}, {"t": 7.066666666666666, "x": "誰も逮捕されないまま、\n法律の上で終わった、ということだ。"}, {"t": 10.85, "x": "どんな事件なの。"}, {"t": 12.15, "x": "1962年の11月から、1963年の9月まで。"}, {"t": 16.983333333333334, "x": "10か月のあいだに、東京で十数件の事件が続いた。"}, {"t": 20.483333333333334, "x": "爆発、銃撃、脅迫。"}, {"t": 22.533333333333335, "x": "怪我をされた方は、分かっているだけで14人。"}, {"t": 25.35, "x": "亡くなった方は、いない。"}, {"t": 27.083333333333332, "x": "それで、犯人は。"}, {"t": 28.533333333333335, "x": "分かっていない。"}, {"t": 29.5, "x": "一人も捕まっていないし、起訴された人もいない。"}, {"t": 32.516666666666666, "x": "ただ、一つだけ残ったものがある。"}, {"t": 34.9, "x": "なに。"}, {"t": 35.55, "x": "名前だ。"}, {"t": 36.233333333333334, "x": "現場に置かれたものに、毎回、\n同じ名前が書かれていた。"}, {"t": 39.81666666666667, "x": "草加次郎。"}, {"t": 40.78333333333333, "x": "……それ、本名なの。"}, {"t": 42.266666666666666, "x": "分からない。"}, {"t": 43.05, "x": "本名かどうかも分からないし、\n読み方すら分かっていない。"}, {"t": 46.4, "x": "「そうか」なのか「くさか」なのか、\n書いた本人が言わなかったからだ。"}, {"t": 50.85, "x": "読み方も分からないのに、事件の名前になってるの。"}, {"t": 54.13333333333333, "x": "そうだ。犯人が自分で名乗った\n名前が、そのまま事件の名前になった。"}, {"t": 58.55, "x": "今日はこの、草加次郎事件を追っていく。"}, {"t": 60.983333333333334, "x": "先に、断っておくことがある。"}, {"t": 63.03333333333333, "x": "一つ目。この事件の犯人は特定されていない。"}, {"t": 66.1, "x": "だから私は、誰かの名前を出して\n「この人がやった」という話は一切しない。"}, {"t": 71.11666666666666, "x": "二つ目。使われたものがどういう\n仕組みだったのかには、一切触れない。"}, {"t": 75.28333333333333, "x": "三つ目。どんな怪我だったかは、細かく話さない。"}, {"t": 78.56666666666666, "x": "……実際に痛い思いをした人がいるのよね？"}, {"t": 81.16666666666667, "x": "いる。そこは忘れない。"}, {"t": 82.66666666666667, "x": "四つ目。この事件は、当時も今も\n「派手な事件」として扱われやすい。"}, {"t": 87.25, "x": "だが私は、面白がる話し方はしない。"}, {"t": 89.96666666666667, "x": "1985年に、埼玉県の草加市で起きた\n「草加事件」というのが別にある。"}, {"t": 95.5, "x": "少年5人が有罪とされ、あとで無罪になった事件だ。"}, {"t": 98.91666666666667, "x": "名前が似ているだけで、\n今日の話とは何の関係もない。"}, {"t": 102.45, "x": "そこ、間違えやすいところね。"}, {"t": 104.53333333333333, "x": "間違えやすい。だから先に言っておいた。"}, {"t": 106.93333333333334, "x": "では、始めよう。"}, {"t": 108.78333333333333, "x": "1962年、昭和37年11月4日、午前11時ごろ。"}, {"t": 113.75, "x": "場所は東京都品川区の北品川。"}, {"t": 116.18333333333334, "x": "歌手の島倉千代子さんの、後援会の事務所だ。"}, {"t": 119.23333333333333, "x": "その事務所に、差出人の名前が\n書かれていない封筒が届いた。"}, {"t": 123.2, "x": "封筒は二重になっていた。"}, {"t": 124.85, "x": "23歳の男性の事務職員が、それを開けた。"}, {"t": 128.0, "x": "中から細長い筒が出てきて、それが発火した。"}, {"t": 131.35, "x": "……開けた人が。"}, {"t": 132.45, "x": "右手に火傷を負った。"}, {"t": 133.68333333333334, "x": "治るまで2週間と診断されている。"}, {"t": 135.98333333333332, "x": "怪我の話は、ここまでにする。"}, {"t": 138.01666666666668, "x": "ここで一つ、この事件のすべてを\n決めることが起きている。"}, {"t": 141.41666666666666, "x": "その筒の裏に、文字が書いてあった。"}, {"t": 143.86666666666667, "x": "なんて。"}, {"t": 144.61666666666667, "x": "草加次郎。"}, {"t": 145.48333333333332, "x": "それと、アルファベットの「K」。"}, {"t": 147.55, "x": "……名前を書いて送ってきたってこと。"}, {"t": 149.7, "x": "そういうことになる。"}, {"t": 150.9, "x": "普通、こういうことをする人間は、自分の痕跡を消す。"}, {"t": 154.38333333333333, "x": "この人物は逆だった。"}, {"t": 155.81666666666666, "x": "毎回、名前を置いていった。"}, {"t": 157.65, "x": "この一件の時点では、警察もまだ、\nこれが連続するとは思っていない。"}, {"t": 162.03333333333333, "x": "有名人の事務所に届いた、悪質な\nいやがらせ。そう見るのが自然だ。"}, {"t": 166.35, "x": "だが9日後に、二件目が来る。"}, {"t": 168.5, "x": "ここから10か月、東京はこの名前に\n付き合わされることになる。"}, {"t": 172.33333333333334, "x": "もう一つ、時代の話をしておく。"}, {"t": 174.66666666666666, "x": "1962年の東京は、工事だらけだった。"}, {"t": 178.0, "x": "2年後に東京オリンピックが控えていた。"}, {"t": 180.45, "x": "高速道路、新幹線、地下鉄。"}, {"t": 182.71666666666667, "x": "全部が同時に作られていた時期だ。"}, {"t": 185.08333333333334, "x": "一番にぎやかな時期じゃない。"}, {"t": 186.91666666666666, "x": "そのにぎやかな場所ばかりが、これから狙われていく。"}, {"t": 190.6, "x": "二件目は、1962年11月13日。"}, {"t": 194.15, "x": "東京都港区の麻布に住む、41歳の女性のところだ。"}, {"t": 197.96666666666667, "x": "バーに勤めていた方だという。"}, {"t": 199.8, "x": "島倉さんの事務所に届いたのと\n同じ形のものが、郵便で届いた。"}, {"t": 204.1, "x": "こちらは、発火しなかった。"}, {"t": 206.06666666666666, "x": "不発だったのね。"}, {"t": 207.4, "x": "不発だった。だから怪我をした人はいない。"}, {"t": 210.05, "x": "問題は、そこに書かれていた名前だ。"}, {"t": 212.56666666666666, "x": "また草加次郎。"}, {"t": 213.78333333333333, "x": "いや、違う。"}, {"t": 214.85, "x": "えっ。"}, {"t": 215.48333333333332, "x": "杉加次郎、と書いてあった。"}, {"t": 217.43333333333334, "x": "一字だけ違うのね。"}, {"t": 218.95, "x": "一字だけ違う。"}, {"t": 220.06666666666666, "x": "これを警察は筆跡鑑定にかけた。"}, {"t": 222.46666666666667, "x": "その結果、草加次郎と書いた\n人物と同じだと判断されている。"}, {"t": 226.63333333333333, "x": "じゃあ書き間違い、ってこと。"}, {"t": 228.6, "x": "そこは分からない。"}, {"t": 229.7, "x": "書き間違えたのか、わざと\n変えたのか、記録に残っていない。"}, {"t": 233.43333333333334, "x": "私が言えるのは、警察が筆跡で\n同一人物と見た、という事実までだ。"}, {"t": 238.16666666666666, "x": "ここで一つ、大事なことがある。"}, {"t": 240.26666666666668, "x": "この事件、警察は最初から「筆跡」を持っていた。"}, {"t": 243.81666666666666, "x": "同じ人間が書いたかどうかを、\n判断できる材料があったということだ。"}, {"t": 247.9, "x": "あとで話すが、この事件では指紋まで出ている。"}, {"t": 250.75, "x": "筆跡があって、指紋があって、\nそれでも捕まらなかった。"}, {"t": 254.35, "x": "この事件が今も語られるのは、そこだ。"}, {"t": 257.01666666666665, "x": "……材料はあったのに。"}, {"t": 258.3666666666667, "x": "あった。照らし合わせる相手がいなかった。"}, {"t": 260.75, "x": "その意味は、後の章で話す。"}, {"t": 263.3833333333333, "x": "三件目は、1962年11月20日の夕方5時過ぎ。"}, {"t": 267.71666666666664, "x": "場所は千代田区の有楽町。"}, {"t": 269.43333333333334, "x": "ニュー東宝映画劇場という映画館だ。"}, {"t": 271.71666666666664, "x": "映画を見終わった19歳の女性が、\n3階のロビーを通った。"}, {"t": 275.3, "x": "ソファの上に筒が置いてあった。"}, {"t": 277.1333333333333, "x": "それに触れたところ、発火した。"}, {"t": 279.3333333333333, "x": "……知らない人が置いていったものよね。"}, {"t": 281.5, "x": "そうだ。女性は火傷を負い、\n治るまで1週間と診断されている。"}, {"t": 285.4166666666667, "x": "その筒にも、草加次郎と書かれていた。"}, {"t": 288.0, "x": "四件目は、その6日後。"}, {"t": 289.6333333333333, "x": "11月26日の午後4時半ごろ。"}, {"t": 292.26666666666665, "x": "同じ有楽町の、日比谷映画劇場。"}, {"t": 294.71666666666664, "x": "2階のトイレを掃除していた47歳の女性従業員が、\n掃除を終えて廊下に出ようとした。"}, {"t": 300.18333333333334, "x": "扉を開けたときの風で、\n洗面台の上に置かれていたものが落ちて、発火した。"}, {"t": 305.03333333333336, "x": "この回は、怪我をした人はいない。"}, {"t": 307.0, "x": "火事にもなっていない。"}, {"t": 308.46666666666664, "x": "じゃあ、被害は無かったのね。"}, {"t": 310.3666666666667, "x": "被害は無かった。だが、\nこの一件が捜査上は一番大きい。"}, {"t": 314.18333333333334, "x": "どうして。"}, {"t": 315.01666666666665, "x": "ここで、指紋が出た。"}, {"t": 316.65, "x": "……指紋。"}, {"t": 317.31666666666666, "x": "残されていたものから、犯人のものとみられる\n指紋が検出されている。"}, {"t": 321.56666666666666, "x": "筆跡に続いて、指紋まで手に入った。"}, {"t": 324.23333333333335, "x": "この時点で警察は、同じ人物が\n繰り返しているとはっきり分かった。"}, {"t": 328.5, "x": "そして、置かれた場所を見てほしい。"}, {"t": 330.55, "x": "品川の事務所、麻布の個人宅、\n有楽町の映画館が二つ。"}, {"t": 334.73333333333335, "x": "最初の二件は、狙った相手に郵便で送っている。"}, {"t": 337.81666666666666, "x": "三件目と四件目は、誰が触るか\n分からない場所に置いている。"}, {"t": 341.65, "x": "……相手を選ばなくなってるってこと。"}, {"t": 343.73333333333335, "x": "そういうことになる。"}, {"t": 344.9166666666667, "x": "11月の頭は個人宛て、月末には不特定の場所。"}, {"t": 349.21666666666664, "x": "五件目は、1962年11月29日の夕方5時半ごろ。"}, {"t": 353.9, "x": "場所は世田谷区。街なかの電話ボックスだ。"}, {"t": 356.7, "x": "25歳の男性の会社員が、\n電話をかけようとして中に入った。"}, {"t": 360.8, "x": "棚の上に、本が一冊置いてあった。"}, {"t": 363.26666666666665, "x": "本。"}, {"t": 363.8333333333333, "x": "石川啄木の詩集だ。"}, {"t": 365.6333333333333, "x": "……忘れ物みたいに見えるわね。"}, {"t": 367.5, "x": "見える。だから男性はそれを手に取った。"}, {"t": 369.9166666666667, "x": "本とケースのあいだに、栞のような紙が挟まっていた。"}, {"t": 373.26666666666665, "x": "それを引き抜いた瞬間に、発火した。"}, {"t": 375.73333333333335, "x": "男性は左手に火傷を負い、\n治るまで5日と診断されている。"}, {"t": 379.51666666666665, "x": "そして、その紙にも書いてあった。"}, {"t": 381.85, "x": "草加次郎。"}, {"t": 382.8333333333333, "x": "草加次郎だ。"}, {"t": 383.8333333333333, "x": "六件目は、12月12日の夜8時ごろ。"}, {"t": 386.85, "x": "台東区の浅草寺の境内。切り株の上だ。"}, {"t": 389.7, "x": "夜の見回りをしていた警備員が、\n本が一冊置いてあるのを見つけた。"}, {"t": 393.7, "x": "新書の大きさの、エラリー・\nクイーンの推理小説だった。"}, {"t": 397.21666666666664, "x": "また本なの。"}, {"t": 398.28333333333336, "x": "また本だ。"}, {"t": 399.1166666666667, "x": "ただ、開こうとしても開かない。"}, {"t": 401.25, "x": "それで表紙を破ったところ、中身が\n普通の本ではないと分かった。"}, {"t": 405.1166666666667, "x": "これは発火しなかった。"}, {"t": 406.45, "x": "未遂に終わっている。"}, {"t": 407.73333333333335, "x": "この一件は、資料によって\n負傷者がいたかどうかが食い違っている。"}, {"t": 411.5833333333333, "x": "だから私は「未遂に終わった」とだけ言う。"}, {"t": 414.48333333333335, "x": "それにしても、詩集と推理小説って。"}, {"t": 417.18333333333334, "x": "そこだ。"}, {"t": 417.8666666666667, "x": "石川啄木と、エラリー・クイーン。"}, {"t": 420.0833333333333, "x": "どちらも、人が思わず手に取る本だ。"}, {"t": 422.56666666666666, "x": "置かれた場所も、電話ボックスと寺の境内。"}, {"t": 425.28333333333336, "x": "誰が通るか分からない場所に、\n誰でも手に取るものを置いている。"}, {"t": 428.95, "x": "……選んでるのよね、そこまで。"}, {"t": 430.8333333333333, "x": "選んでいると見るしかない。"}, {"t": 432.3333333333333, "x": "そして、この12月12日を\n最後に、事件はいったん止まる。"}, {"t": 436.23333333333335, "x": "次に動くまで、5か月かかる。"}, {"t": 438.98333333333335, "x": "1962年12月から1963年の5月まで、\nこの名前は出てこない。"}, {"t": 444.78333333333336, "x": "やめたのかしら。"}, {"t": 445.96666666666664, "x": "当時の捜査側がどう考えたかは、\n記録が残っていない。"}, {"t": 449.45, "x": "はっきりしているのは、この5か月のあいだも\n捜査本部は動いていたことだ。"}, {"t": 453.6666666666667, "x": "ここで、この時期の東京の話をしておきたい。"}, {"t": 456.55, "x": "1963年3月、東京でもう一つ大きな事件が起きている。"}, {"t": 461.1333333333333, "x": "吉展ちゃん事件だ。"}, {"t": 462.53333333333336, "x": "台東区で4歳の男の子が連れ去られ、\n身代金が要求された事件だ。"}, {"t": 467.2, "x": "……同じころなのね。"}, {"t": 468.46666666666664, "x": "同じころで、しかも同じ台東区だ。"}, {"t": 470.8333333333333, "x": "この二つは別々の事件だが、のちに\n国会で必ず並べて出てくるようになる。"}, {"t": 475.6666666666667, "x": "それから、同じ1963年の3月に、\n一本の映画が公開されている。"}, {"t": 480.81666666666666, "x": "黒澤明監督の「天国と地獄」だ。"}, {"t": 483.85, "x": "誘拐の映画よね。"}, {"t": 485.23333333333335, "x": "そうだ。"}, {"t": 485.8333333333333, "x": "この映画の中に、走っている列車から\n身代金を落とさせる場面がある。"}, {"t": 490.1, "x": "窓から現金を投げさせる、という方法だ。"}, {"t": 492.8666666666667, "x": "……それ、あとで出てくるやつ。"}, {"t": 494.65, "x": "出てくる。9月の話だ。"}, {"t": 496.46666666666664, "x": "この映画が公開されたあと、同じ方法を現実で使った\n最初の事件が、この草加次郎事件だとされている。"}, {"t": 503.06666666666666, "x": "吉展ちゃん事件の犯人も、この映画を見て\n誘拐を考えたと言われているが、"}, {"t": 507.45, "x": "受け渡しの方法は真似ていない。"}, {"t": 509.51666666666665, "x": "つまり、1963年の東京というのは、そういう年だった。"}, {"t": 513.8166666666667, "x": "映画が現実に移ってくる、と\n当時の人が本気で言っていた年だ。"}, {"t": 517.8833333333333, "x": "そして5月、名前が戻ってくる。"}, {"t": 520.1166666666667, "x": "戻ってきたときには、やり方が変わっていた。"}, {"t": 523.55, "x": "1963年5月9日。"}, {"t": 526.0833333333334, "x": "女優の吉永小百合さんの自宅に、\n一通の手紙が届いた。"}, {"t": 529.7666666666667, "x": "手紙の差出人は、草加次郎。"}, {"t": 532.15, "x": "また同じ名前ね。"}, {"t": 533.5333333333333, "x": "同じ名前だ。"}, {"t": 534.55, "x": "中身は、100万円を出せ、というものだった。"}, {"t": 537.3833333333333, "x": "この手紙は1通では終わらない。"}, {"t": 539.25, "x": "5月9日、5月14日、5月23日、\n7月15日、7月17日、7月22日。"}, {"t": 546.5666666666667, "x": "全部で6通が届いている。"}, {"t": 548.3, "x": "手紙の中で、草加次郎は自分のことを\n台東区に住んでいると書いていた。"}, {"t": 552.6333333333333, "x": "それから、受け渡しの場所も指定している。"}, {"t": 555.25, "x": "上野駅の正面横にある喫茶店だ。"}, {"t": 557.6, "x": "吉永さんの父親に、そこへ来い、と書いていた。"}, {"t": 560.85, "x": "……お父さんを指定したのね。"}, {"t": 562.5333333333333, "x": "そうだ。"}, {"t": 563.1666666666666, "x": "そして、警察は当然その喫茶店を張った。"}, {"t": 566.0666666666667, "x": "結果を先に言うと、犯人は一度も現れていない。"}, {"t": 569.2666666666667, "x": "来なかったの。"}, {"t": 570.3333333333334, "x": "来なかった。"}, {"t": 571.3333333333334, "x": "……お金が目的じゃなかったのかしら。"}, {"t": 573.6166666666667, "x": "そう見る人はいる。"}, {"t": 574.7833333333333, "x": "ただ、本人が言い残していないので、\nそこは分からない。"}, {"t": 578.1333333333333, "x": "分からないことを、私が決めることはしない。"}, {"t": 580.8, "x": "もう一つ、この手紙には入っていたものがある。"}, {"t": 583.6166666666667, "x": "弾丸だ。"}, {"t": 584.55, "x": "弾丸。"}, {"t": 585.3, "x": "そうだ。手紙と一緒に、弾が入っていた。"}, {"t": 588.0666666666667, "x": "それが何を意味するかは、次の章で分かる。"}, {"t": 590.7, "x": "あとで分かったことだが、脅迫状を\n受け取っていたのは吉永さんだけではない。"}, {"t": 595.0833333333334, "x": "当時18歳だった鰐淵晴子さん、\n21歳だった桑野みゆきさんの自宅にも、"}, {"t": 600.0833333333334, "x": "弾丸を入れて100万円を要求する手紙が届いていた。"}, {"t": 604.0166666666667, "x": "1963年7月15日、夜7時45分ごろ。"}, {"t": 608.3, "x": "場所は台東区の上野公園。不忍池の近くだ。"}, {"t": 611.5833333333334, "x": "そこでおでんの屋台を出していた\n27歳の男性が、撃たれた。"}, {"t": 615.5166666666667, "x": "……撃たれた。"}, {"t": 616.35, "x": "撃たれた。"}, {"t": 617.0333333333333, "x": "男性は病院に運ばれ、全治3\nか月の重傷と診断されている。"}, {"t": 621.2166666666667, "x": "容態については、ここまでにする。"}, {"t": 623.3333333333334, "x": "ここまでの6件は、置く、送る、だった。"}, {"t": 626.1166666666667, "x": "それが、撃つ、に変わった。"}, {"t": 628.1, "x": "……全然違うじゃない。"}, {"t": 629.4833333333333, "x": "全然違う。"}, {"t": 630.4666666666667, "x": "しかも使われたのは、市販のものではなく\n自分で作った拳銃だったとされている。"}, {"t": 635.2333333333333, "x": "どう作られたのかという話はしない。"}, {"t": 637.45, "x": "私が言いたいのは、手口が一つに\n固定されていない、ということだ。"}, {"t": 641.6, "x": "……同じ人がやってるとは\n思えないくらい、ばらばらね。"}, {"t": 644.6833333333333, "x": "ばらばらだ。"}, {"t": 645.5166666666667, "x": "そして、この屋台の事件が草加次郎と\n結び付いたのは、撃たれた日ではない。"}, {"t": 650.0333333333333, "x": "10日後だ。"}, {"t": 650.85, "x": "1963年7月25日、上野警察署に一通の封書が届いた。"}, {"t": 656.05, "x": "中には、弾丸が一発だけ入っていた。"}, {"t": 658.7166666666667, "x": "手紙らしいものは入っていない。"}, {"t": 660.6333333333333, "x": "弾だけ。"}, {"t": 661.5166666666667, "x": "弾だけだ。"}, {"t": 662.3833333333333, "x": "警察が鑑定したところ、その弾は屋台の店主の体から\n取り出されたものと、材質も大きさも同じだった。"}, {"t": 669.2333333333333, "x": "そして封筒の裏に、草加次郎と書かれていた。"}, {"t": 672.2, "x": "その筆跡は、前の年の一連のものと一致した。"}, {"t": 675.6166666666667, "x": "……わざわざ、警察に送ったのね。"}, {"t": 677.8333333333334, "x": "送っている。"}, {"t": 678.6666666666666, "x": "「あれは自分だ」と、自分から知らせたことになる。"}, {"t": 681.65, "x": "吉永さんへの手紙に入っていた弾丸も、\nこの事件の弾と同じものだったとされている。"}, {"t": 686.8666666666667, "x": "手紙と銃撃が、一本につながった瞬間だ。"}, {"t": 690.5333333333333, "x": "1963年7月24日、午後3時ごろ。"}, {"t": 694.25, "x": "渋谷の東横デパートに、電話がかかってきた。"}, {"t": 697.15, "x": "要求は500万円。"}, {"t": 698.6333333333333, "x": "金額が上がってるわね。"}, {"t": 700.2666666666667, "x": "上がっている。吉永さんへの手紙は100万円だった。"}, {"t": 703.4666666666667, "x": "警察は指定された受け渡し場所を張った。"}, {"t": 706.0166666666667, "x": "ここでも、犯人は現れなかった。"}, {"t": 708.2333333333333, "x": "ところが、その日の午後3時50分。"}, {"t": 710.6666666666666, "x": "同じデパートの西館9階、男子トイレで爆発が起きた。"}, {"t": 714.3166666666667, "x": "怪我をした人はいない。"}, {"t": 715.7166666666667, "x": "2度目は8月11日の夕方。東館の屋上だ。"}, {"t": 719.35, "x": "これも爆発したが、怪我をした人はいない。"}, {"t": 722.0833333333334, "x": "3度目は8月14日の昼前。"}, {"t": 724.3166666666667, "x": "デパートの店長宛に、速達の小包が届いた。"}, {"t": 727.5666666666667, "x": "開封したところ爆発し、男性の職員が\n軽い火傷を負っている。"}, {"t": 731.5833333333334, "x": "この小包には手紙も入っていた。"}, {"t": 733.7666666666667, "x": "500万円を出せ、断ればデパートの中で\n本格的にやる、という内容だ。"}, {"t": 738.6, "x": "……お客さんがいるところで。"}, {"t": 740.2166666666667, "x": "そう書いてあった。"}, {"t": 741.3, "x": "警察はまた張り込んだ。"}, {"t": 742.7, "x": "犯人はまた現れなかった。"}, {"t": 744.5833333333334, "x": "そして、デパートの中での大きな爆発も起きなかった。"}, {"t": 747.95, "x": "この渋谷の3件が、本当に草加次郎なのか\nどうかが分かっていない。"}, {"t": 752.6666666666666, "x": "どういうこと。"}, {"t": 753.6666666666666, "x": "捜査当局は当然、この3件と草加次郎の関係を調べた。"}, {"t": 757.6166666666667, "x": "そのときに、合わないものが出てきた。"}, {"t": 759.8833333333333, "x": "筆跡だ。"}, {"t": 760.8833333333333, "x": "……手紙の字が違ったの。"}, {"t": 762.5, "x": "置かれていたものと、脅迫状の筆跡が違っていた。"}, {"t": 765.8166666666667, "x": "だから、草加次郎の名前を\nかたった別の人物ではないか、という見方があった。"}, {"t": 770.75, "x": "真似した人が出たってこと。"}, {"t": 772.65, "x": "その可能性がある、というところまでだ。"}, {"t": 774.9833333333333, "x": "断定はされていない。"}, {"t": 776.2833333333333, "x": "ここが、この事件のややこしいところだ。"}, {"t": 778.7, "x": "名前が新聞に何度も出た。"}, {"t": 780.5333333333333, "x": "名前が有名になると、その名前を使う人間が出てくる。"}, {"t": 784.05, "x": "そうすると、どれが本人でどれが\n別人か、分からなくなる。"}, {"t": 787.8333333333334, "x": "……名前を出したことが、逆に守りになってるのね。"}, {"t": 790.9, "x": "結果としてそうなった。"}, {"t": 792.3666666666667, "x": "これは私の推測ではなく、\n当時の国会でも同じことが言われている。"}, {"t": 796.5833333333334, "x": "1964年4月23日、衆議院の地方行政委員会。"}, {"t": 801.0166666666667, "x": "川村継義という議員が、\n前の年の犯罪の特徴について質問している。"}, {"t": 805.7833333333333, "x": "原文を読む。"}, {"t": 806.7333333333333, "x": "「昨年はいろいろな事件が起きた。\nたとえば吉展ちゃん事件というのもある、"}, {"t": 810.9666666666667, "x": "狭山市の女子高校生の殺人事件が起こっている、"}, {"t": 814.1, "x": "それから爆弾を持って人をおどかした\n草加次郎というような事件等々が起こっておる。」"}, {"t": 818.85, "x": "「犯罪が非常に模倣的というか、\n人まねをするというか、"}, {"t": 822.3333333333334, "x": "伝播性的な犯罪が急激に\n多くなっておるのではないか。」"}, {"t": 825.9666666666667, "x": "……真似される犯罪が\n増えている、って国会で言ってるのね。"}, {"t": 829.2333333333333, "x": "言っている。事件のすぐ翌年だ。"}, {"t": 831.4333333333333, "x": "出典は国立国会図書館の国会会議録検索システム。"}, {"t": 835.4, "x": "第46回国会、衆議院地方行政委員会 第37号、\n1964年4月23日だ。"}, {"t": 843.15, "x": "1963年9月5日、夜8時14分ごろ。"}, {"t": 847.05, "x": "場所は、営団地下鉄の銀座線、京橋駅。"}, {"t": 850.0833333333334, "x": "浅草を夜7時23分に出た、渋谷行きの電車だった。"}, {"t": 853.9166666666666, "x": "その電車が京橋駅に停まっているときに、\n車内で爆発が起きた。"}, {"t": 858.1833333333333, "x": "……走ってる電車の中。"}, {"t": 859.7666666666667, "x": "停車中だ。だが、車内には乗客がいた。"}, {"t": 862.6333333333333, "x": "10人が負傷している。"}, {"t": 863.95, "x": "重傷が2人、軽傷が8人だ。"}, {"t": 866.3, "x": "銀座線の、しかも京橋。"}, {"t": 868.0666666666667, "x": "東京のまん中で、帰宅の時間帯だ。"}, {"t": 870.8, "x": "……いちばん人が乗ってる時間じゃない。"}, {"t": 872.9333333333333, "x": "そうだ。"}, {"t": 873.5333333333333, "x": "これは、置かれたものが時間で動く仕掛けだった。"}, {"t": 876.4666666666667, "x": "それ以上の説明はしない。"}, {"t": 878.1, "x": "ここで、この事件を象徴する話をする。"}, {"t": 880.75, "x": "爆発のあとに残ったものの中に、\n文字が書かれていた。"}, {"t": 884.2333333333333, "x": "残ったものひとつひとつに、一文字ずつ。"}, {"t": 886.9333333333333, "x": "「次」と「郎」だ。"}, {"t": 888.55, "x": "……名前を、分けて書いてたの。"}, {"t": 890.4333333333333, "x": "分けて書いてあった。"}, {"t": 891.6666666666666, "x": "爆発すれば散らばる。"}, {"t": 893.0, "x": "散らばったものを拾えば、名前になる。"}, {"t": 895.3666666666667, "x": "そういう置き方をしている。"}, {"t": 896.9166666666666, "x": "それと、もう一つ。"}, {"t": 898.3333333333334, "x": "残っていたものに、こう刻まれていた。"}, {"t": 900.6666666666666, "x": "「つぎは10日」。"}, {"t": 901.7166666666667, "x": "……予告してるってこと。"}, {"t": 903.25, "x": "予告だ。"}, {"t": 904.0, "x": "この5日後に何かが起きる、と自分で書いていた。"}, {"t": 906.9666666666667, "x": "この10人の負傷者の数は、\n帝都高速度交通営団の記録に残っている。"}, {"t": 911.6, "x": "この一連の事件の中で、資料の裏づけが\n最もはっきりしているのが、この一件だ。"}, {"t": 917.45, "x": "地下鉄の翌日、1963年9月6日。"}, {"t": 921.0833333333334, "x": "吉永小百合さんの自宅に、7通目の手紙が届いた。"}, {"t": 924.6, "x": "要求はやはり100万円。"}, {"t": 926.1833333333333, "x": "ただ、この7通目は、それまでの6通と2つ違っていた。"}, {"t": 930.1, "x": "どこが。"}, {"t": 930.9, "x": "一つ目は、受け渡しの方法だ。"}, {"t": 933.1, "x": "それまでは「上野駅前の喫茶店に来い」だった。"}, {"t": 936.2, "x": "7通目は違った。"}, {"t": 937.55, "x": "9月9日か、9月10日。"}, {"t": 939.65, "x": "草加次郎が指定した急行列車に乗り、"}, {"t": 942.1, "x": "合図の場所で、走っている列車から現金を投げ落とせ。"}, {"t": 945.5333333333333, "x": "……走ってる列車から。"}, {"t": 947.0, "x": "そうだ。"}, {"t": 947.6, "x": "これは、同じ年の3月に公開された\n「天国と地獄」とまったく同じ方法だ。"}, {"t": 952.85, "x": "この映画が公開されたあと、現実で同じ方法が\n使われた最初の事件だとされている。"}, {"t": 958.1833333333333, "x": "映画を見てから考えたってこと。"}, {"t": 960.2833333333333, "x": "そう言い切る証拠は無い。"}, {"t": 961.65, "x": "ただ、方法が一致していることは事実だ。"}, {"t": 964.3333333333334, "x": "二つ目の違いは、手紙に絵が入っていたことだ。"}, {"t": 967.35, "x": "時間で動く仕掛けを示す絵だった。"}, {"t": 969.55, "x": "前日に地下鉄でやったばかりの、その形だ。"}, {"t": 972.7833333333333, "x": "……見せつけてるのね。"}, {"t": 974.1, "x": "そう読める。"}, {"t": 974.9, "x": "前日に、東京のまん中で10人が怪我をしている。"}, {"t": 978.0833333333334, "x": "そこへ、9日か10日に列車に乗れという手紙が来た。"}, {"t": 981.4166666666666, "x": "断れば、また同じことが起きるかもしれない。"}, {"t": 984.3, "x": "……断れないわね。"}, {"t": 985.5333333333333, "x": "断れない。"}, {"t": 986.3666666666667, "x": "だから警察は、この指定に乗った。"}, {"t": 989.3166666666667, "x": "1963年9月9日、夜7時10分発。"}, {"t": 993.2833333333333, "x": "上野駅から出る、常磐線の急行「十和田」。"}, {"t": 996.2, "x": "発車は、予定より1分遅れた。"}, {"t": 998.35, "x": "この列車に、警察は仕掛けた。"}, {"t": 1000.45, "x": "区間は上野から土浦まで。"}, {"t": 1002.0666666666667, "x": "沿線の距離は67キロだ。"}, {"t": 1004.1666666666666, "x": "その沿線に、警察官を約300名配置している。"}, {"t": 1007.5666666666667, "x": "無線で連絡を取り合う体制も組んである。"}, {"t": 1010.0833333333334, "x": "300人。"}, {"t": 1011.0833333333334, "x": "300人だ。"}, {"t": 1012.1166666666667, "x": "そして列車の中には、100万円の紙包みを\n持った捜査員が6名乗った。"}, {"t": 1016.75, "x": "ほかの車内には、普通の乗客がいる。"}, {"t": 1019.35, "x": "……うまくいけば、捕まえられたのよね。"}, {"t": 1021.6333333333333, "x": "うまくいけば捕まえられた。"}, {"t": 1023.25, "x": "結果を言う。"}, {"t": 1024.0833333333333, "x": "合図は、最後まで出なかった。"}, {"t": 1026.1, "x": "……出なかった。"}, {"t": 1027.0666666666666, "x": "出なかった。"}, {"t": 1027.95, "x": "翌9月10日も、警察は動いている。"}, {"t": 1030.4333333333334, "x": "手紙に「9日か10日」と書いてあったからだ。"}, {"t": 1033.4666666666667, "x": "この日、地下鉄の警戒も強められた。"}, {"t": 1036.05, "x": "そして、何も起きなかった。"}, {"t": 1038.05, "x": "……何も。"}, {"t": 1038.8166666666666, "x": "何も起きなかった。"}, {"t": 1040.0833333333333, "x": "これが、草加次郎事件の最後の日になる。"}, {"t": 1043.4, "x": "1963年9月10日を最後に、\nこの名前は現場から消えた。"}, {"t": 1047.8333333333333, "x": "爆発も、銃撃も、手紙も、来なくなった。"}, {"t": 1051.1333333333334, "x": "……急にやめたの。"}, {"t": 1052.2833333333333, "x": "急にやめた、ように見える。"}, {"t": 1054.0, "x": "なぜ止まったのか。"}, {"t": 1055.1833333333334, "x": "これについては、記録が何も無い。"}, {"t": 1057.45, "x": "……本人が言わなかったんだものね。"}, {"t": 1059.5, "x": "言っていない。捕まってもいない。"}, {"t": 1061.3833333333334, "x": "だから、止まった理由を私が説明することはできない。"}, {"t": 1064.7166666666667, "x": "捕まりそうになってやめた、別の理由で\n動けなくなった、ほかの罪で捕まっていた。"}, {"t": 1069.7833333333333, "x": "いろいろな言われ方があるが、\nどれも裏づけのある話ではない。"}, {"t": 1073.25, "x": "だから私は、どれも採らない。"}, {"t": 1075.3166666666666, "x": "……分からない、が答えなのね。"}, {"t": 1077.2166666666667, "x": "分からない、が答えだ。"}, {"t": 1078.75, "x": "ただ、事実として言えることが一つある。"}, {"t": 1081.3166666666666, "x": "止まったのは9月10日。"}, {"t": 1082.9, "x": "そして、警察の捜査本部は、そのあとも動き続けた。"}, {"t": 1086.55, "x": "止まったのは事件のほうで、捜査ではない。"}, {"t": 1089.0666666666666, "x": "その捜査が、どこまで行っていたのか。"}, {"t": 1091.3833333333334, "x": "それが分かる記録が、一つだけ残っている。"}, {"t": 1094.15, "x": "国会の議事録だ。"}, {"t": 1096.1333333333334, "x": "1964年2月4日、参議院の法務委員会。"}, {"t": 1099.85, "x": "日本社会党の稲葉誠一議員が、こう聞いた。"}, {"t": 1102.75, "x": "「いま、他にいろいろな重要な\n未解決事件がたくさんあるわけですね。"}, {"t": 1106.8333333333333, "x": "吉展ちゃんの事件とか、にせ\n札事件とか、草加次郎の事件とか、"}, {"t": 1111.2166666666667, "x": "バラバラ事件とか、いろいろありますね。"}, {"t": 1113.5833333333333, "x": "現在どういうふうになっておりますか、差しつかえない\n範囲で述べていただきたいと思います。」"}, {"t": 1118.7166666666667, "x": "……4つ並んでるのね。"}, {"t": 1120.1833333333334, "x": "4つとも、当時まだ犯人が捕まっていなかった事件だ。"}, {"t": 1123.7166666666667, "x": "これに答えたのが、警察庁の刑事局長、日原正雄だ。"}, {"t": 1127.5666666666666, "x": "この答弁が、この事件について政府が\n国会で述べた、唯一の記録になる。"}, {"t": 1132.3, "x": "草加次郎の部分を、そのまま読む。"}, {"t": 1134.5333333333333, "x": "「それから\n草加次郎の連続爆発事件のことでございますが、"}, {"t": 1138.1666666666667, "x": "これも途中の捜査経過は新聞で大体御存じと\n思いますが、現在の捜査状況を申しますと、"}, {"t": 1143.8833333333334, "x": "現在、捜査本部では、犯人が\n爆発物あるいは脅迫状を郵送いたしました"}, {"t": 1148.9666666666667, "x": "下谷郵便局管内を中心とする\n地取りの捜査を実施しております。」"}, {"t": 1153.2166666666667, "x": "下谷。"}, {"t": 1153.9666666666667, "x": "いまの台東区だ。上野と浅草のあたりになる。"}, {"t": 1156.8666666666666, "x": "郵便物の消印から、出された場所を\n絞り込んでいた、ということだ。"}, {"t": 1160.9833333333333, "x": "答弁は、こう続く。"}, {"t": 1162.45, "x": "「なお、容疑者として少年をほかの容疑で\n逮捕取り調べております部面もございますが、"}, {"t": 1167.4333333333334, "x": "一応現在捜査の主体を\n捜査四課から一課に移しまして、"}, {"t": 1171.1166666666666, "x": "二十七名の要員でもって捜査を続行中でございます。」"}, {"t": 1174.6, "x": "……少年を、別の容疑で。"}, {"t": 1176.3833333333334, "x": "そう書いてある。"}, {"t": 1177.3166666666666, "x": "ただし、ここははっきり言っておく。"}, {"t": 1179.3, "x": "この少年について分かっているのは、この一文だけだ。"}, {"t": 1182.55, "x": "名前も、年齢も、その後どうなったかも、記録に無い。"}, {"t": 1186.0333333333333, "x": "そして、この事件で起訴された\n人間は、最後まで一人もいない。"}, {"t": 1190.1333333333334, "x": "……じゃあ、関係なかったってことよね。"}, {"t": 1192.3833333333334, "x": "少なくとも、犯人とされたことは一度も無い。"}, {"t": 1195.3333333333333, "x": "私はこの少年について、これ以上は言わない。"}, {"t": 1198.1666666666667, "x": "もう一つ、この答弁には数字がある。"}, {"t": 1200.5333333333333, "x": "捜査四課から一課へ。そして要員27名。"}, {"t": 1203.6, "x": "四課は、当時は暴力団などを扱う部署だ。"}, {"t": 1206.4666666666667, "x": "一課は、殺人や傷害などを扱う部署になる。"}, {"t": 1209.45, "x": "つまり、組織がやっている線から、\n個人の線に見方を移したことになる。"}, {"t": 1213.9333333333334, "x": "出典は国会会議録検索システム。"}, {"t": 1216.5166666666667, "x": "第46回国会、参議院法務委員会 第2号、\n1964年2月4日だ。"}, {"t": 1223.0, "x": "もう一つ、ほとんど知られていない記録がある。"}, {"t": 1225.7333333333333, "x": "1964年5月7日、参議院の運輸委員会。"}, {"t": 1229.4, "x": "答えているのは、\n日本国有鉄道の公安本部長、向井潔だ。"}, {"t": 1233.65, "x": "原文を読む。"}, {"t": 1234.5833333333333, "x": "「御承知と思いますけれども、実は\n昨年は草加次郎の一連がございまして、"}, {"t": 1239.2166666666667, "x": "非常に投書が、全部で三十数件ございました。」"}, {"t": 1242.5, "x": "……三十数件。"}, {"t": 1243.6, "x": "国鉄に対して、それだけ来ていた。"}, {"t": 1246.0333333333333, "x": "続きがある。"}, {"t": 1246.9, "x": "「『とき号』なんかの点もございまして、\nこの場合は県警なんかも全部出ていただきまして、"}, {"t": 1251.9833333333333, "x": "非常に捜査をいたしました。"}, {"t": 1253.5833333333333, "x": "同じように、機関車に\nしかけるというのがございます。」"}, {"t": 1256.8666666666666, "x": "列車にも予告が来てたのね。"}, {"t": 1258.8166666666666, "x": "来ていた。"}, {"t": 1259.55, "x": "さらに、こう言っている。"}, {"t": 1260.9833333333333, "x": "「そういたしますと、やはり\n捜査の方法といたしまして、"}, {"t": 1264.2, "x": "公開いたしませんで内々でやりませんと\n犯人がつかまえられない。"}, {"t": 1267.9, "x": "とにかくあのようなかっこうの犯人はこちらが"}, {"t": 1270.2166666666667, "x": "警戒をいたしましてつかまえるより\n方法がございませんので、"}, {"t": 1273.5333333333333, "x": "つかまえなければいつまでも\nその恐怖は続くという観点から、"}, {"t": 1277.0333333333333, "x": "相当日々人数出しまして\n警備並びに捜査いたしました。」"}, {"t": 1280.6166666666666, "x": "……表に出さずにやってたのね。"}, {"t": 1282.5333333333333, "x": "出さずにやっていた。"}, {"t": 1283.8, "x": "そして、同じ日の委員会で、もう一つ出ている。"}, {"t": 1286.8666666666666, "x": "日本社会党の中村順造議員が、こう聞いた。"}, {"t": 1289.9166666666667, "x": "「草加次郎の話が出たから、それは\n妄想だったように思うのですが、"}, {"t": 1293.9666666666667, "x": "かなり警視庁の公安二課からの情報に基づいて"}, {"t": 1297.0, "x": "有力な情報だと判断をされたということを\n聞いたわけですが、"}, {"t": 1300.2666666666667, "x": "しかもその対象が労働組合の計画に\n基づいてやられるというような判断がされておった」"}, {"t": 1305.5666666666666, "x": "……労働組合。"}, {"t": 1306.6333333333334, "x": "そういう情報が、有力なものとして\n扱われていた、ということだ。"}, {"t": 1310.6666666666667, "x": "中村議員は、そのあとこう述べている。"}, {"t": 1313.05, "x": "「まあ労働組合は対象でも\n全くなかったということで、その点はわかりました」"}, {"t": 1317.8333333333333, "x": "全然関係なかったのね。"}, {"t": 1319.6833333333334, "x": "関係なかった。"}, {"t": 1320.8, "x": "つまり、この事件の捜査は、途中で明らかに\n違う方向を向いていた時期がある。"}, {"t": 1325.4333333333334, "x": "これは他のどの資料にも出てこない。"}, {"t": 1327.4, "x": "国会の記録にだけ残っている。"}, {"t": 1329.5, "x": "出典は、第46回国会 参議院運輸委員会 第24号、\n1964年5月7日だ。"}, {"t": 1337.0666666666666, "x": "1964年4月24日、衆議院の法務委員会。"}, {"t": 1341.0666666666666, "x": "日本社会党の横山利秋議員が、こう切り出している。"}, {"t": 1344.5666666666666, "x": "「最近おくら入りというものが非常に多い。」"}, {"t": 1346.8833333333334, "x": "「にせ札とか吉展ちゃんとか、あるいは草加次郎とか、"}, {"t": 1350.1666666666667, "x": "重要な犯罪というものが非常に\n迷宮入りがふえておる。」"}, {"t": 1353.5333333333333, "x": "……また同じ4つね。"}, {"t": 1354.9333333333334, "x": "同じ顔ぶれだ。"}, {"t": 1356.0333333333333, "x": "そして横山議員は、その先で厳しいことを言っている。"}, {"t": 1359.3666666666666, "x": "「国民の中には、これらの迷宮入りの事件に\n対する警察の布陣と、"}, {"t": 1363.6833333333334, "x": "それから大衆運動に対する即応態勢と比較をしてみて、"}, {"t": 1367.35, "x": "刑事警察に欠くるところがあるのではないか」"}, {"t": 1370.1166666666666, "x": "……人の配り方の話をしてるのね。"}, {"t": 1372.5166666666667, "x": "している。"}, {"t": 1373.2, "x": "デモや集会に出す人数と、\n事件を追う人数を比べている。"}, {"t": 1376.7833333333333, "x": "さらに、こうも言っている。"}, {"t": 1378.3166666666666, "x": "「いわゆる職人的刑事とサラリーマン刑事との断層が\n起こっておるのではないか」"}, {"t": 1382.75, "x": "ここで、数字を並べておく。"}, {"t": 1384.5666666666666, "x": "この事件で、警視庁が投入した\n捜査員は延べ1万9000人。"}, {"t": 1388.5333333333333, "x": "火薬や爆発物に詳しい人物などを、\nおよそ9600人リストアップしている。"}, {"t": 1393.7166666666667, "x": "9600人。"}, {"t": 1395.0666666666666, "x": "9600人分を、一人ずつ潰していったということだ。"}, {"t": 1398.75, "x": "そして、当たらなかった。"}, {"t": 1400.5166666666667, "x": "……なのに分からなかったの。"}, {"t": 1402.1166666666666, "x": "警察の資料の中に、その指紋も、\nその筆跡も、無かった。"}, {"t": 1406.3, "x": "だから警察は、こう判断している。"}, {"t": 1408.6, "x": "草加次郎には、前科も前歴も無い。"}, {"t": 1411.15, "x": "……初めてだった、ってこと。"}, {"t": 1412.9166666666667, "x": "少なくとも、記録に残る形で警察と\n関わったことが無い人物だった。"}, {"t": 1417.6833333333334, "x": "材料はあった。比べる相手が、どこにも無かった。"}, {"t": 1420.8, "x": "出典は、第46回国会 衆議院法務委員会 第30号、\n1964年4月24日。"}, {"t": 1427.85, "x": "捜査人数の数字は、当時の報道を\nまとめた資料による。"}, {"t": 1431.95, "x": "事件が止まってからも、この名前は消えなかった。"}, {"t": 1434.9166666666667, "x": "1963年9月13日。"}, {"t": 1437.5666666666666, "x": "推理作家の木々高太郎さんの自宅に、\n電話がかかっている。"}, {"t": 1441.2666666666667, "x": "電話の相手は「クサカ」と名乗った。"}, {"t": 1443.7666666666667, "x": "……推理作家に電話したの。"}, {"t": 1445.5333333333333, "x": "した。"}, {"t": 1446.1, "x": "それが翌年も続く。"}, {"t": 1447.6333333333334, "x": "1964年6月12日の朝、今度は\n隣の家に電話がかかった。"}, {"t": 1452.6, "x": "隣の林教授の家に仕掛けた、という内容だ。"}, {"t": 1455.75, "x": "そして6月26日の夜8時10分ごろ、\n木々さんの家に直接かかってきた。"}, {"t": 1460.9833333333333, "x": "「おれは草加次郎だ」。そう言って切ったという。"}, {"t": 1463.45, "x": "これは読売新聞の1964年6月27日の記事に\n載っている。"}, {"t": 1468.4166666666667, "x": "……名乗る人が出てきたのね。"}, {"t": 1470.1833333333334, "x": "出てきた。本人かどうかは、分からない。"}, {"t": 1472.7666666666667, "x": "そして1967年。事件から4年後だ。"}, {"t": 1476.1166666666666, "x": "4月1日、参議院の予算委員会。"}, {"t": 1478.65, "x": "日本社会党の岡田宗司議員が、こう述べている。"}, {"t": 1481.6666666666667, "x": "「草加次郎はいまだつかまっておりません。"}, {"t": 1483.8666666666666, "x": "昨日の東京駅事件は、皆目まだ\n見当がついておらないという状況であります。」"}, {"t": 1488.75, "x": "……4年経っても出てくるのね。"}, {"t": 1490.5333333333333, "x": "出てくる。"}, {"t": 1491.8833333333334, "x": "そして同じ年の6月20日、参議院の運輸委員会。"}, {"t": 1495.4333333333334, "x": "運輸省の鉄道監督局長、増川遼三がこう答えている。"}, {"t": 1499.35, "x": "「私どもといたしましては、草加次郎的な\n爆発物による事件というものの"}, {"t": 1504.1, "x": "連鎖的に起こるということを非常に\nおそれておるわけでございまして」"}, {"t": 1507.9, "x": "……草加次郎「的な」。"}, {"t": 1509.4666666666667, "x": "そこだ。個人の名前が、事件の種類を\n指す言葉になっている。"}, {"t": 1513.35, "x": "この委員会で、日本共産党の岩間正男議員が\nこう問い詰めた。"}, {"t": 1517.2166666666667, "x": "「私はやっぱり草加次郎の問題を問題にしたい。"}, {"t": 1520.2333333333333, "x": "草加次郎の問題、これどこ行った。"}, {"t": 1522.3333333333333, "x": "どこへ行っちゃった、飛んじゃったか。"}, {"t": 1524.35, "x": "草加次郎の問題が起こって、あの問題が\n結局わからなくなったわけで」"}, {"t": 1528.7, "x": "このあと岩間議員は「現代の怪盗」\n「ネズミ小僧」という言い方もしている。"}, {"t": 1533.1666666666667, "x": "当時の国会でそう言われた、という\n記録として紹介するだけにしておく。"}, {"t": 1537.4, "x": "私はその言い方はしない。"}, {"t": 1538.95, "x": "怪我をされた方が14人いる事件だ。"}, {"t": 1541.4666666666667, "x": "……それで、答えはどうだったの。"}, {"t": 1543.3666666666666, "x": "ここが、この回の一番重いところだ。"}, {"t": 1545.8, "x": "答えたのは、警察庁の刑事局長、内海倫。"}, {"t": 1549.2333333333333, "x": "答弁の全文は、こうだ。"}, {"t": 1550.95, "x": "「草加次郎の件につきましては、\n私詳細承知いたしておりませんので、"}, {"t": 1555.25, "x": "警視庁より資料を取り寄せました\n上で、お答えいたします。」"}, {"t": 1558.8333333333333, "x": "……それだけ。"}, {"t": 1559.7333333333333, "x": "それだけだ。全部で70字しかない。"}, {"t": 1562.15, "x": "事件から4年。国会で名前を出されて、\n刑事局長が詳細を承知していないと答えた。"}, {"t": 1567.5333333333333, "x": "誤解のないように言っておく。"}, {"t": 1569.1166666666666, "x": "この事件を捜査していたのは警視庁で、\n内海刑事局長は警察庁の人だ。"}, {"t": 1573.9833333333333, "x": "役所が違うので、その場で細かく\n答えられなかったという読み方もできる。"}, {"t": 1578.3833333333334, "x": "だから私は「警察が捨てた」とは言わない。"}, {"t": 1581.2666666666667, "x": "ただ、このやり取りが国会の記録に\n残っている、という事実は残る。"}, {"t": 1585.45, "x": "出典は、第55回国会 参議院運輸委員会 第12号、\n1967年6月20日だ。"}, {"t": 1592.3, "x": "そして、さらに3年後。"}, {"t": 1594.05, "x": "1970年5月13日、参議院の運輸委員会。"}, {"t": 1597.9, "x": "日本社会党の岡三郎議員が、こう言っている。"}, {"t": 1600.8333333333333, "x": "「私は空の乗っ取り事件と同時に、空の草加次郎が\n出てくるのじゃないかという心配が一つある。」"}, {"t": 1606.6833333333334, "x": "……空の草加次郎。"}, {"t": 1608.0166666666667, "x": "1970年には、もう人の名前ですらない。"}, {"t": 1611.25, "x": "「捕まらない爆弾魔」という\n意味の、ただの言葉になっている。"}, {"t": 1614.9, "x": "本人は、1963年9月10日から\n一度も現れていないのにだ。"}, {"t": 1620.2333333333333, "x": "ここで、一つだけ別の事件に触れる。"}, {"t": 1622.7333333333333, "x": "1968年6月、横須賀線の電車で爆発が起きた事件だ。"}, {"t": 1627.6333333333334, "x": "この事件では、亡くなった方も、\n怪我をされた方も多数出ている。"}, {"t": 1631.6166666666666, "x": "草加次郎事件とは別の事件なので、\n中身には入らない。"}, {"t": 1635.2, "x": "この事件の犯人は、逮捕されている。"}, {"t": 1637.5833333333333, "x": "現場に残された新聞の切れ端から、購読者を\nたどって割り出されたと伝えられている。"}, {"t": 1642.7833333333333, "x": "……こっちは捕まったのね。"}, {"t": 1644.4, "x": "捕まった。"}, {"t": 1645.2666666666667, "x": "私がここで触れたいのは、\nその人物が語ったとされる言葉だ。"}, {"t": 1649.25, "x": "一つは「捕まらなかった草加次郎を尊敬する」。"}, {"t": 1652.3333333333333, "x": "もう一つは「草加次郎さえ出現しなければ、\n列車爆破なんてやらなかった」。"}, {"t": 1657.2166666666667, "x": "……両方言ってるの。"}, {"t": 1658.4666666666667, "x": "両方伝えられている。"}, {"t": 1659.85, "x": "ただ、この発言の出典は弱い。"}, {"t": 1662.1, "x": "一次の記録で確認できていないので、\n「そう伝えられている」以上のことは言わない。"}, {"t": 1666.85, "x": "草加次郎は、1963年9月10日で止まっている。"}, {"t": 1670.75, "x": "止まったあと、その名前が別の人間を\n動かした、という話になるからだ。"}, {"t": 1675.45, "x": "……名前だけが先に歩いていったのね。"}, {"t": 1677.7333333333333, "x": "そうなる。"}, {"t": 1678.4, "x": "この事件は、最初から最後まで\n「名前が広まること」と一緒に動いている。"}, {"t": 1683.1, "x": "名前を残したから有名になり、\n有名になったから真似が出て、"}, {"t": 1686.8166666666666, "x": "真似が出たから、どれが本人か分からなくなった。"}, {"t": 1689.9, "x": "……全部つながってるのね。"}, {"t": 1691.4666666666667, "x": "つながっている。"}, {"t": 1692.45, "x": "そして、その名前の持ち主だけが、\n最後まで出てこなかった。"}, {"t": 1696.9666666666667, "x": "1978年、昭和53年9月5日。"}, {"t": 1700.5166666666667, "x": "この日付で、公訴時効が成立した。"}, {"t": 1703.1666666666667, "x": "時効って、どういう仕組みだったの。"}, {"t": 1705.3833333333334, "x": "当時の法律の話をする。"}, {"t": 1707.1833333333334, "x": "公訴時効というのは、事件から一定の年数が\n経つと、検察が起訴できなくなる制度だ。"}, {"t": 1712.65, "x": "起訴できなくなるということは、\n裁判ができないということだ。"}, {"t": 1716.1666666666667, "x": "犯人が見つかっても、もう罪に問えない。"}, {"t": 1718.7333333333333, "x": "その年数は、罪の重さで決まっていた。"}, {"t": 1721.3166666666666, "x": "2004年に法律が変わる前は、死刑に\nあたる罪の時効は15年だった。"}, {"t": 1725.8166666666666, "x": "爆発物を使う罪には、死刑が定められている。"}, {"t": 1729.0666666666666, "x": "1963年9月5日から15年で、1978年9月5日になる。"}, {"t": 1734.9666666666667, "x": "……地下鉄の日から、ちょうど15年ね。"}, {"t": 1737.4166666666667, "x": "そうなる。"}, {"t": 1738.1, "x": "ただし、どの罪でどう計算されたのかを、\n政府が公表した記録は見つかっていない。"}, {"t": 1743.0333333333333, "x": "そこは分からないままだ。"}, {"t": 1744.3666666666666, "x": "分からないことは、分からないと言っておく。"}, {"t": 1746.8833333333334, "x": "はっきりしているのは、1978年9月5日付で\n時効が成立した、ということだ。"}, {"t": 1752.6833333333334, "x": "この日、何が終わったのか。"}, {"t": 1754.5166666666667, "x": "その全部が、この日で法律の上では意味を失った。"}, {"t": 1757.8166666666666, "x": "……誰も捕まらないまま。"}, {"t": 1759.4166666666667, "x": "誰も捕まらないまま。"}, {"t": 1760.9, "x": "それから、時効にはもう一つの側面がある。"}, {"t": 1763.7166666666667, "x": "疑われた側を解放する働きだ。"}, {"t": 1766.0166666666667, "x": "この事件では、9600人がリストに載っている。"}, {"t": 1769.2833333333333, "x": "その中には、何もしていないのに\n調べられた人が大勢いたはずだ。"}, {"t": 1773.45, "x": "……あ。"}, {"t": 1773.9, "x": "1964年の答弁にあった、別の容疑で\n取り調べを受けた少年もそうだ。"}, {"t": 1779.0, "x": "その人たちにとっては、この日が\n終わりの日でもあった。"}, {"t": 1782.2, "x": "時効という制度は、\n犯人のためだけにあるものではない。"}, {"t": 1785.4666666666667, "x": "そのことは、ここで言っておきたい。"}, {"t": 1787.5166666666667, "x": "なお、この15年という線は、\nその後の日本では変わっていく。"}, {"t": 1791.2, "x": "2004年に25年に延び、2010年には、\n人を死なせた重い罪の時効が廃止された。"}, {"t": 1796.9, "x": "だが、廃止は過去にさかのぼらない。"}, {"t": 1799.1, "x": "1978年に完成した時効が、\nあとから戻ってくることはない。"}, {"t": 1804.35, "x": "ここまでの話で、分かっていないことを並べておく。"}, {"t": 1807.45, "x": "一つ目。犯人が誰なのか。"}, {"t": 1809.5, "x": "これは分かっていない。"}, {"t": 1810.5666666666666, "x": "逮捕も起訴もされていない。"}, {"t": 1812.2666666666667, "x": "二つ目。何のためにやったのか。"}, {"t": 1814.45, "x": "金を要求した回は複数ある。だが、\n一度も受け取りに来ていない。"}, {"t": 1818.65, "x": "……お金じゃないのよね、たぶん。"}, {"t": 1820.45, "x": "そう見たくなる。だが、それも推測でしかない。"}, {"t": 1823.4166666666667, "x": "三つ目。なぜ止まったのか。"}, {"t": 1825.25, "x": "1963年9月10日から、ぱたりと何も無い。"}, {"t": 1828.8, "x": "理由の記録が無い。"}, {"t": 1830.15, "x": "四つ目。渋谷の3件が本当に同じ人物なのか。"}, {"t": 1833.65, "x": "筆跡が違ったので、\n別人という見方があった。決着していない。"}, {"t": 1837.9166666666667, "x": "五つ目。名前の読み方だ。"}, {"t": 1839.9666666666667, "x": "……そうだった。"}, {"t": 1840.9166666666667, "x": "「そうか」なのか「くさか」なのか、分かっていない。"}, {"t": 1844.2, "x": "本人が一度も名乗らなかったからだ。"}, {"t": 1846.4833333333333, "x": "文字では何度も書いた。"}, {"t": 1847.7833333333333, "x": "声では、一度も言っていない。"}, {"t": 1849.6333333333334, "x": "1964年に「おれは草加次郎だ」と\n電話をかけた人物はいるが、"}, {"t": 1854.3166666666666, "x": "それが本人かどうかは確かめられていない。"}, {"t": 1856.8166666666666, "x": "資料によっては「そうかじろう」、別の資料では\n「くさかじろう」と書かれている。"}, {"t": 1861.4, "x": "私はこの動画で「そうかじろう」と読んできたが、"}, {"t": 1864.45, "x": "それが正しいかどうかは、誰にも分からない。"}, {"t": 1867.0666666666666, "x": "六つ目。この名前に意味があるのかどうか。"}, {"t": 1869.5666666666666, "x": "埼玉県に草加という地名があるが、\n関係があるという根拠は何も無い。"}, {"t": 1873.85, "x": "最初の一件に添えられた「K」が\n何なのかも、分かっていない。"}, {"t": 1877.9333333333334, "x": "……全部、分からないのね。"}, {"t": 1879.6333333333334, "x": "全部だ。"}, {"t": 1880.3666666666666, "x": "分かっているのは、起きたことと、\n日付と、怪我をされた方の数。"}, {"t": 1884.45, "x": "それと、書き残された名前だけだ。"}, {"t": 1887.3833333333334, "x": "最後にまとめる。"}, {"t": 1888.5166666666667, "x": "1962年11月4日、品川の後援会事務所に届いた封筒。"}, {"t": 1893.5333333333333, "x": "11月13日、麻布。"}, {"t": 1895.3833333333334, "x": "11月20日、有楽町。"}, {"t": 1897.3833333333334, "x": "11月26日、日比谷。"}, {"t": 1899.65, "x": "11月29日、世田谷の電話ボックス。"}, {"t": 1902.5333333333333, "x": "12月12日、浅草寺。"}, {"t": 1904.65, "x": "ここでいったん止まり、5か月後に手紙で戻ってくる。"}, {"t": 1907.8333333333333, "x": "1963年5月9日から7月22日まで、\n吉永小百合さん宅へ6通。"}, {"t": 1913.7166666666667, "x": "7月15日、上野公園で屋台の店主が撃たれた。"}, {"t": 1917.1333333333334, "x": "7月24日、8月11日、8月14日、\n渋谷の東横デパートで3件。"}, {"t": 1922.85, "x": "9月5日夜8時14分、\n地下鉄銀座線の京橋駅で10人が負傷。"}, {"t": 1927.55, "x": "9月6日、7通目の手紙。"}, {"t": 1929.5333333333333, "x": "9月9日と10日、常磐線に300人。"}, {"t": 1932.55, "x": "そして、何も起きずに終わった。"}, {"t": 1934.5666666666666, "x": "怪我をされた方は、合わせて14人。"}, {"t": 1936.7, "x": "亡くなった方はいない。"}, {"t": 1938.1833333333334, "x": "1978年9月5日、公訴時効成立。"}, {"t": 1941.9166666666667, "x": "……こうやって並べると、10か月なのね。"}, {"t": 1944.4833333333333, "x": "10か月だ。"}, {"t": 1945.4833333333333, "x": "私がこの回で一番言いたいのは、\nこの事件の残り方だ。"}, {"t": 1949.1666666666667, "x": "普通、事件は被害者の名前か、地名で呼ばれる。"}, {"t": 1952.3166666666666, "x": "この事件は違う。犯人が自分で\n書いた名前で呼ばれている。"}, {"t": 1956.0, "x": "……自分でつけた名前が残ったのね。"}, {"t": 1958.2666666666667, "x": "残った。"}, {"t": 1959.0166666666667, "x": "そして、その名前だけが一人で歩いていった。"}, {"t": 1961.8666666666666, "x": "1964年、推理作家の家にかかってきた\n電話で名乗られた。"}, {"t": 1966.2, "x": "1967年、国会で「草加次郎的な事件」という\n言い方をされた。"}, {"t": 1971.2333333333333, "x": "同じ年、刑事局長は\n「詳細承知いたしておりません」と答えた。"}, {"t": 1975.55, "x": "1970年には「空の草加次郎」と const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);

sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};

addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
