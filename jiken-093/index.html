<script>
const D={"name": "093", "file": "093_編集用", "dur": 2123.0, "segs": [], "subs": [{"t": 0.0, "x": "1978年、昭和53年9月5日。"}, {"t": 3.55, "x": "この日、東京で\n起きたある事件の公訴時効が成立した。"}, {"t": 7.066666666666666, "x": "誰も逮捕されないまま、\n法律の上で終わった、ということだ。"}, {"t": 10.85, "x": "どんな事件なの。"}, {"t": 12.15, "x": "1962年の11月から、1963年の9月まで。"}, {"t": 16.983333333333334, "x": "10か月のあいだに、東京で十数件の事件が続いた。"}, {"t": 20.483333333333334, "x": "爆発、銃撃、脅迫。"}, {"t": 22.533333333333335, "x": "怪我をされた方は、分かっているだけで14人。"}, {"t": 25.35, "x": "亡くなった方は、いない。"}, {"t": 27.083333333333332, "x": "それで、犯人は。"}, {"t": 28.533333333333335, "x": "分かっていない。"}, {"t": 29.5, "x": "一人も捕まっていないし、起訴された人もいない。"}, {"t": 32.516666666666666, "x": "ただ、一つだけ残ったものがある。"}, {"t": 34.9, "x": "なに。"}, {"t": 35.55, "x": "名前だ。"}, {"t": 36.233333333333334, "x": "現場に置かれたものに、毎回、\n同じ名前が書かれていた。"}, {"t": 39.81666666666667, "x": "草加次郎。"}, {"t": 40.78333333333333, "x": "……それ、本名なの。"}, {"t": 42.266666666666666, "x": "分からない。"}, {"t": 43.05, "x": "本名かどうかも分からないし、\n読み方すら分かっていない。"}, {"t": 46.4, "x": "「そうか」なのか「くさか」なのか、\n書いた本人が言わなかったからだ。"}, {"t": 50.85, "x": "読み方も分からないのに、事件の名前になってるの。"}, {"t": 54.13333333333333, "x": "そうだ。犯人が自分で名乗った\n名前が、そのまま事件の名前になった。"}, {"t": 58.55, "x": "今日はこの、草加次郎事件を追っていく。"}, {"t": 60.983333333333334, "x": "先に、断っておくことがある。"}, {"t": 63.03333333333333, "x": "一つ目。この事件の犯人は特定されていない。"}, {"t": 66.1, "x": "だから私は、誰かの名前を出して\n「この人がやった」という話は一切しない。"}, {"t": 71.1, "x": "当時、警察がどう動いたかを、\n記録に残っているぶんだけ話す。"}, {"t": 75.11666666666666, "x": "二つ目。使われたものがどういう\n仕組みだったのかには、一切触れない。"}, {"t": 79.26666666666667, "x": "これは私の判断ではなく、\nこの種の話でやってはいけないことだ。"}, {"t": 83.31666666666666, "x": "三つ目。怪我をされた方が14人いる。"}, {"t": 85.81666666666666, "x": "どんな怪我だったかは、細かく話さない。"}, {"t": 88.46666666666667, "x": "……実際に痛い思いをした人がいるのよね。"}, {"t": 91.06666666666666, "x": "いる。そこは忘れない。"}, {"t": 92.55, "x": "四つ目。この事件は、当時も今も\n「派手な事件」として扱われやすい。"}, {"t": 97.15, "x": "だが私は、面白がる話し方はしない。"}, {"t": 99.86666666666666, "x": "最後に一つだけ。"}, {"t": 101.21666666666667, "x": "1985年に、埼玉県の草加市で起きた\n「草加事件」というのが別にある。"}, {"t": 106.75, "x": "少年5人が有罪とされ、あとで無罪になった事件だ。"}, {"t": 110.15, "x": "名前が似ているだけで、\n今日の話とは何の関係もない。"}, {"t": 113.68333333333334, "x": "そこ、間違えやすいところね。"}, {"t": 115.78333333333333, "x": "間違えやすい。だから先に言っておいた。"}, {"t": 118.16666666666667, "x": "では、始めよう。"}, {"t": 120.03333333333333, "x": "1962年、昭和37年11月4日、午前11時ごろ。"}, {"t": 125.0, "x": "場所は東京都品川区の北品川。"}, {"t": 127.43333333333334, "x": "歌手の島倉千代子さんの、後援会の事務所だ。"}, {"t": 130.48333333333332, "x": "その事務所に、差出人の名前が\n書かれていない封筒が届いた。"}, {"t": 134.43333333333334, "x": "封筒は二重になっていた。"}, {"t": 136.1, "x": "23歳の男性の事務職員が、それを開けた。"}, {"t": 139.23333333333332, "x": "中から細長い筒が出てきて、それが発火した。"}, {"t": 142.6, "x": "……開けた人が。"}, {"t": 143.7, "x": "右手に火傷を負った。"}, {"t": 144.91666666666666, "x": "治るまで2週間と診断されている。"}, {"t": 147.23333333333332, "x": "怪我の話は、ここまでにする。"}, {"t": 149.25, "x": "ここで一つ、この事件のすべてを\n決めることが起きている。"}, {"t": 152.65, "x": "その筒の裏に、文字が書いてあった。"}, {"t": 155.11666666666667, "x": "なんて。"}, {"t": 155.86666666666667, "x": "草加次郎。"}, {"t": 156.71666666666667, "x": "それと、アルファベットの「K」。"}, {"t": 158.78333333333333, "x": "……名前を書いて送ってきたってこと。"}, {"t": 160.93333333333334, "x": "そういうことになる。"}, {"t": 162.13333333333333, "x": "普通、こういうことをする人間は、自分の痕跡を消す。"}, {"t": 165.63333333333333, "x": "この人物は逆だった。"}, {"t": 167.05, "x": "毎回、名前を置いていった。"}, {"t": 168.88333333333333, "x": "この一件の時点では、警察もまだ、\nこれが連続するとは思っていない。"}, {"t": 173.26666666666668, "x": "有名人の事務所に届いた、悪質な\nいやがらせ。そう見るのが自然だ。"}, {"t": 177.6, "x": "だが9日後に、二件目が来る。"}, {"t": 179.73333333333332, "x": "ここから10か月、東京はこの名前に\n付き合わされることになる。"}, {"t": 183.56666666666666, "x": "もう一つ、時代の話をしておく。"}, {"t": 185.9, "x": "1962年の東京は、工事だらけだった。"}, {"t": 189.25, "x": "2年後に東京オリンピックが控えていた。"}, {"t": 191.68333333333334, "x": "高速道路、新幹線、地下鉄。"}, {"t": 193.95, "x": "全部が同時に作られていた時期だ。"}, {"t": 196.31666666666666, "x": "一番にぎやかな時期じゃない。"}, {"t": 198.15, "x": "そのにぎやかな場所ばかりが、これから狙われていく。"}, {"t": 201.83333333333334, "x": "二件目は、1962年11月13日。"}, {"t": 205.38333333333333, "x": "東京都港区の麻布に住む、41歳の女性のところだ。"}, {"t": 209.2, "x": "バーに勤めていた方だという。"}, {"t": 211.03333333333333, "x": "島倉さんの事務所に届いたのと\n同じ形のものが、郵便で届いた。"}, {"t": 215.35, "x": "こちらは、発火しなかった。"}, {"t": 217.3, "x": "不発だったのね。"}, {"t": 218.63333333333333, "x": "不発だった。だから怪我をした人はいない。"}, {"t": 221.28333333333333, "x": "問題は、そこに書かれていた名前だ。"}, {"t": 223.8, "x": "また草加次郎。"}, {"t": 225.01666666666668, "x": "いや、違う。"}, {"t": 226.1, "x": "えっ。"}, {"t": 226.71666666666667, "x": "杉加次郎、と書いてあった。"}, {"t": 228.66666666666666, "x": "一字だけ違うのね。"}, {"t": 230.18333333333334, "x": "一字だけ違う。"}, {"t": 231.3, "x": "これを警察は筆跡鑑定にかけた。"}, {"t": 233.71666666666667, "x": "その結果、草加次郎と書いた\n人物と同じだと判断されている。"}, {"t": 237.86666666666667, "x": "じゃあ書き間違い、ってこと。"}, {"t": 239.65, "x": "そこは分からない。"}, {"t": 240.73333333333332, "x": "書き間違えたのか、わざと\n変えたのか、記録に残っていない。"}, {"t": 244.46666666666667, "x": "私が言えるのは、警察が筆跡で\n同一人物と見た、という事実までだ。"}, {"t": 249.2, "x": "ここで一つ、大事なことがある。"}, {"t": 251.3, "x": "この事件、警察は最初から「筆跡」を持っていた。"}, {"t": 254.85, "x": "同じ人間が書いたかどうかを、\n判断できる材料があったということだ。"}, {"t": 258.93333333333334, "x": "あとで話すが、この事件では指紋まで出ている。"}, {"t": 261.78333333333336, "x": "筆跡があって、指紋があって、\nそれでも捕まらなかった。"}, {"t": 265.3833333333333, "x": "この事件が今も語られるのは、そこだ。"}, {"t": 268.06666666666666, "x": "……材料はあったのに。"}, {"t": 269.4, "x": "あった。照らし合わせる相手がいなかった。"}, {"t": 271.78333333333336, "x": "その意味は、後の章で話す。"}, {"t": 274.4166666666667, "x": "三件目は、1962年11月20日の夕方5時過ぎ。"}, {"t": 278.75, "x": "場所は千代田区の有楽町。"}, {"t": 280.46666666666664, "x": "ニュー東宝映画劇場という映画館だ。"}, {"t": 282.75, "x": "映画を見終わった19歳の女性が、\n3階のロビーを通った。"}, {"t": 286.35, "x": "ソファの上に筒が置いてあった。"}, {"t": 288.18333333333334, "x": "それに触れたところ、発火した。"}, {"t": 290.3666666666667, "x": "……知らない人が置いていったものよね。"}, {"t": 292.53333333333336, "x": "そうだ。女性は火傷を負い、\n治るまで1週間と診断されている。"}, {"t": 296.43333333333334, "x": "その筒にも、草加次郎と書かれていた。"}, {"t": 299.03333333333336, "x": "四件目は、その6日後。"}, {"t": 300.65, "x": "11月26日の午後4時半ごろ。"}, {"t": 303.28333333333336, "x": "同じ有楽町の、日比谷映画劇場。"}, {"t": 305.73333333333335, "x": "2階のトイレを掃除していた47歳の女性従業員が、\n掃除を終えて廊下に出ようとした。"}, {"t": 311.2, "x": "扉を開けたときの風で、\n洗面台の上に置かれていたものが落ちて、発火した。"}, {"t": 316.05, "x": "この回は、怪我をした人はいない。"}, {"t": 318.01666666666665, "x": "火事にもなっていない。"}, {"t": 319.48333333333335, "x": "じゃあ、被害は無かったのね。"}, {"t": 321.3833333333333, "x": "被害は無かった。だが、\nこの一件が捜査上は一番大きい。"}, {"t": 325.2, "x": "どうして。"}, {"t": 326.03333333333336, "x": "ここで、指紋が出た。"}, {"t": 327.6666666666667, "x": "……指紋。"}, {"t": 328.35, "x": "残されていたものから、犯人のものとみられる\n指紋が検出されている。"}, {"t": 332.6, "x": "筆跡に続いて、指紋まで手に入った。"}, {"t": 335.26666666666665, "x": "この時点で警察は、同じ人物が\n繰り返しているとはっきり分かった。"}, {"t": 339.51666666666665, "x": "そして、置かれた場所を見てほしい。"}, {"t": 341.56666666666666, "x": "品川の事務所、麻布の個人宅、\n有楽町の映画館が二つ。"}, {"t": 345.75, "x": "最初の二件は、狙った相手に郵便で送っている。"}, {"t": 348.8333333333333, "x": "三件目と四件目は、誰が触るか\n分からない場所に置いている。"}, {"t": 352.6666666666667, "x": "……相手を選ばなくなってるってこと。"}, {"t": 354.75, "x": "そういうことになる。"}, {"t": 355.95, "x": "11月の頭は個人宛て、月末には不特定の場所。"}, {"t": 360.23333333333335, "x": "五件目は、1962年11月29日の夕方5時半ごろ。"}, {"t": 364.9166666666667, "x": "場所は世田谷区。街なかの電話ボックスだ。"}, {"t": 367.73333333333335, "x": "25歳の男性の会社員が、\n電話をかけようとして中に入った。"}, {"t": 371.8333333333333, "x": "棚の上に、本が一冊置いてあった。"}, {"t": 374.3, "x": "本。"}, {"t": 374.85, "x": "石川啄木の詩集だ。"}, {"t": 376.65, "x": "……忘れ物みたいに見えるわね。"}, {"t": 378.51666666666665, "x": "見える。だから男性はそれを手に取った。"}, {"t": 380.93333333333334, "x": "本とケースのあいだに、栞のような紙が挟まっていた。"}, {"t": 384.28333333333336, "x": "それを引き抜いた瞬間に、発火した。"}, {"t": 386.75, "x": "男性は左手に火傷を負い、\n治るまで5日と診断されている。"}, {"t": 390.53333333333336, "x": "そして、その紙にも書いてあった。"}, {"t": 392.85, "x": "草加次郎。"}, {"t": 393.8333333333333, "x": "草加次郎だ。"}, {"t": 394.8333333333333, "x": "六件目は、12月12日の夜8時ごろ。"}, {"t": 397.85, "x": "台東区の浅草寺の境内。切り株の上だ。"}, {"t": 400.7, "x": "夜の見回りをしていた警備員が、\n本が一冊置いてあるのを見つけた。"}, {"t": 404.7, "x": "新書の大きさの、エラリー・\nクイーンの推理小説だった。"}, {"t": 408.21666666666664, "x": "また本なの。"}, {"t": 409.3, "x": "また本だ。"}, {"t": 410.1166666666667, "x": "ただ、開こうとしても開かない。"}, {"t": 412.25, "x": "それで表紙を破ったところ、中身が\n普通の本ではないと分かった。"}, {"t": 416.1166666666667, "x": "これは発火しなかった。"}, {"t": 417.45, "x": "未遂に終わっている。"}, {"t": 418.73333333333335, "x": "この一件は、資料によって\n負傷者がいたかどうかが食い違っている。"}, {"t": 422.6, "x": "だから私は「未遂に終わった」とだけ言う。"}, {"t": 425.48333333333335, "x": "それにしても、詩集と推理小説って。"}, {"t": 428.18333333333334, "x": "そこだ。"}, {"t": 428.8666666666667, "x": "石川啄木と、エラリー・クイーン。"}, {"t": 431.1, "x": "どちらも、人が思わず手に取る本だ。"}, {"t": 433.56666666666666, "x": "置かれた場所も、電話ボックスと寺の境内。"}, {"t": 436.28333333333336, "x": "誰が通るか分からない場所に、\n誰でも手に取るものを置いている。"}, {"t": 439.95, "x": "……選んでるのよね、そこまで。"}, {"t": 441.8333333333333, "x": "選んでいると見るしかない。"}, {"t": 443.3333333333333, "x": "そして、この12月12日を\n最後に、事件はいったん止まる。"}, {"t": 447.23333333333335, "x": "次に動くまで、5か月かかる。"}, {"t": 449.98333333333335, "x": "1962年12月から1963年の5月まで、\nこの名前は出てこない。"}, {"t": 455.78333333333336, "x": "やめたのかしら。"}, {"t": 456.96666666666664, "x": "当時の捜査側がどう考えたかは、\n記録が残っていない。"}, {"t": 460.45, "x": "はっきりしているのは、この5か月のあいだも\n捜査本部は動いていたことだ。"}, {"t": 464.68333333333334, "x": "ここで、この時期の東京の話をしておきたい。"}, {"t": 467.55, "x": "1963年3月、東京でもう一つ大きな事件が起きている。"}, {"t": 472.15, "x": "吉展ちゃん事件だ。"}, {"t": 473.53333333333336, "x": "台東区で4歳の男の子が連れ去られ、\n身代金が要求された事件だ。"}, {"t": 478.2, "x": "……同じころなのね。"}, {"t": 479.48333333333335, "x": "同じころで、しかも同じ台東区だ。"}, {"t": 481.8333333333333, "x": "この二つは別々の事件だが、のちに\n国会で必ず並べて出てくるようになる。"}, {"t": 486.6666666666667, "x": "それから、同じ1963年の3月に、\n一本の映画が公開されている。"}, {"t": 491.8333333333333, "x": "黒澤明監督の「天国と地獄」だ。"}, {"t": 494.8666666666667, "x": "誘拐の映画よね。"}, {"t": 496.23333333333335, "x": "そうだ。"}, {"t": 496.85, "x": "この映画の中に、走っている列車から\n身代金を落とさせる場面がある。"}, {"t": 501.1, "x": "窓から現金を投げさせる、という方法だ。"}, {"t": 503.8666666666667, "x": "……それ、あとで出てくるやつ。"}, {"t": 505.65, "x": "出てくる。9月の話だ。"}, {"t": 507.48333333333335, "x": "この映画が公開されたあと、同じ方法を現実で使った\n最初の事件が、この草加次郎事件だとされている。"}, {"t": 514.0666666666667, "x": "吉展ちゃん事件の犯人も、この映画を見て\n誘拐を考えたと言われているが、"}, {"t": 518.45, "x": "受け渡しの方法は真似ていない。"}, {"t": 520.5166666666667, "x": "つまり、1963年の東京というのは、そういう年だった。"}, {"t": 524.8333333333334, "x": "映画が現実に移ってくる、と\n当時の人が本気で言っていた年だ。"}, {"t": 528.8833333333333, "x": "そして5月、名前が戻ってくる。"}, {"t": 531.1333333333333, "x": "戻ってきたときには、やり方が変わっていた。"}, {"t": 534.55, "x": "1963年5月9日。"}, {"t": 537.0833333333334, "x": "女優の吉永小百合さんの自宅に、\n一通の手紙が届いた。"}, {"t": 540.7833333333333, "x": "手紙の差出人は、草加次郎。"}, {"t": 543.1666666666666, "x": "また同じ名前ね。"}, {"t": 544.5333333333333, "x": "同じ名前だ。"}, {"t": 545.55, "x": "中身は、100万円を出せ、というものだった。"}, {"t": 548.3833333333333, "x": "この手紙は1通では終わらない。"}, {"t": 550.25, "x": "5月9日、5月14日、5月23日、\n7月15日、7月17日、7月22日。"}, {"t": 557.5833333333334, "x": "全部で6通が届いている。"}, {"t": 559.3, "x": "手紙の中で、草加次郎は自分のことを\n台東区に住んでいると書いていた。"}, {"t": 563.6333333333333, "x": "それから、受け渡しの場所も指定している。"}, {"t": 566.25, "x": "上野駅の正面横にある喫茶店だ。"}, {"t": 568.6, "x": "吉永さんの父親に、そこへ来い、と書いていた。"}, {"t": 571.85, "x": "……お父さんを指定したのね。"}, {"t": 573.55, "x": "そうだ。"}, {"t": 574.1666666666666, "x": "そして、警察は当然その喫茶店を張った。"}, {"t": 577.0666666666667, "x": "結果を先に言うと、犯人は一度も現れていない。"}, {"t": 580.2666666666667, "x": "来なかったの。"}, {"t": 581.3333333333334, "x": "来なかった。"}, {"t": 582.3333333333334, "x": "……お金が目的じゃなかったのかしら。"}, {"t": 584.6166666666667, "x": "そう見る人はいる。"}, {"t": 585.7833333333333, "x": "ただ、本人が言い残していないので、\nそこは分からない。"}, {"t": 589.1333333333333, "x": "分からないことを、私が決めることはしない。"}, {"t": 591.8, "x": "もう一つ、この手紙には入っていたものがある。"}, {"t": 594.6166666666667, "x": "弾丸だ。"}, {"t": 595.55, "x": "弾丸。"}, {"t": 596.3, "x": "そうだ。手紙と一緒に、弾が入っていた。"}, {"t": 599.0666666666667, "x": "それが何を意味するかは、次の章で分かる。"}, {"t": 601.7166666666667, "x": "あとで分かったことだが、脅迫状を\n受け取っていたのは吉永さんだけではない。"}, {"t": 606.1, "x": "当時18歳だった鰐淵晴子さん、\n21歳だった桑野みゆきさんの自宅にも、"}, {"t": 611.1, "x": "弾丸を入れて100万円を要求する手紙が届いていた。"}, {"t": 615.0166666666667, "x": "1963年7月15日、夜7時45分ごろ。"}, {"t": 619.3, "x": "場所は台東区の上野公園。不忍池の近くだ。"}, {"t": 622.5833333333334, "x": "そこでおでんの屋台を出していた\n27歳の男性が、撃たれた。"}, {"t": 626.5166666666667, "x": "……撃たれた。"}, {"t": 627.35, "x": "撃たれた。"}, {"t": 628.05, "x": "男性は病院に運ばれ、全治3\nか月の重傷と診断されている。"}, {"t": 632.2166666666667, "x": "容態については、ここまでにする。"}, {"t": 634.3333333333334, "x": "ここまでの6件は、置く、送る、だった。"}, {"t": 637.1166666666667, "x": "それが、撃つ、に変わった。"}, {"t": 639.1, "x": "……全然違うじゃない。"}, {"t": 640.4833333333333, "x": "全然違う。"}, {"t": 641.4666666666667, "x": "しかも使われたのは、市販のものではなく\n自分で作った拳銃だったとされている。"}, {"t": 646.2333333333333, "x": "どう作られたのかという話はしない。"}, {"t": 648.45, "x": "私が言いたいのは、手口が一つに\n固定されていない、ということだ。"}, {"t": 652.6166666666667, "x": "……同じ人がやってるとは\n思えないくらい、ばらばらね。"}, {"t": 655.7, "x": "ばらばらだ。"}, {"t": 656.5166666666667, "x": "そして、この屋台の事件が草加次郎と\n結び付いたのは、撃たれた日ではない。"}, {"t": 661.05, "x": "10日後だ。"}, {"t": 661.85, "x": "1963年7月25日、上野警察署に一通の封書が届いた。"}, {"t": 667.05, "x": "中には、弾丸が一発だけ入っていた。"}, {"t": 669.7166666666667, "x": "手紙らしいものは入っていない。"}, {"t": 671.65, "x": "弾だけ。"}, {"t": 672.5333333333333, "x": "弾だけだ。"}, {"t": 673.4, "x": "警察が鑑定したところ、その弾は屋台の店主の体から\n取り出されたものと、材質も大きさも同じだった。"}, {"t": 680.2333333333333, "x": "そして封筒の裏に、草加次郎と書かれていた。"}, {"t": 683.2, "x": "その筆跡は、前の年の一連のものと一致した。"}, {"t": 686.6166666666667, "x": "……わざわざ、警察に送ったのね。"}, {"t": 688.8333333333334, "x": "送っている。"}, {"t": 689.6666666666666, "x": "「あれは自分だ」と、自分から知らせたことになる。"}, {"t": 692.6666666666666, "x": "吉永さんへの手紙に入っていた弾丸も、\nこの事件の弾と同じものだったとされている。"}, {"t": 697.8666666666667, "x": "手紙と銃撃が、一本につながった瞬間だ。"}, {"t": 701.5333333333333, "x": "1963年7月24日、午後3時ごろ。"}, {"t": 705.2666666666667, "x": "渋谷の東横デパートに、電話がかかってきた。"}, {"t": 708.35, "x": "要求は500万円。"}, {"t": 709.8333333333334, "x": "金額が上がってるわね。"}, {"t": 711.4666666666667, "x": "上がっている。吉永さんへの手紙は100万円だった。"}, {"t": 714.6666666666666, "x": "警察は指定された受け渡し場所を張った。"}, {"t": 717.2166666666667, "x": "ここでも、犯人は現れなかった。"}, {"t": 719.4333333333333, "x": "ところが、その日の午後3時50分。"}, {"t": 721.8666666666667, "x": "同じデパートの西館9階、男子トイレで爆発が起きた。"}, {"t": 725.5166666666667, "x": "怪我をした人はいない。"}, {"t": 726.9166666666666, "x": "2度目は8月11日の夕方。東館の屋上だ。"}, {"t": 730.55, "x": "これも爆発したが、怪我をした人はいない。"}, {"t": 733.2833333333333, "x": "3度目は8月14日の昼前。"}, {"t": 735.5166666666667, "x": "デパートの店長宛に、速達の小包が届いた。"}, {"t": 738.7666666666667, "x": "開封したところ爆発し、男性の職員が\n軽い火傷を負っている。"}, {"t": 742.7833333333333, "x": "この小包には手紙も入っていた。"}, {"t": 744.95, "x": "500万円を出せ、断ればデパートの中で\n本格的にやる、という内容だ。"}, {"t": 749.8, "x": "……お客さんがいるところで。"}, {"t": 751.4166666666666, "x": "そう書いてあった。"}, {"t": 752.4833333333333, "x": "警察はまた張り込んだ。"}, {"t": 753.9, "x": "犯人はまた現れなかった。"}, {"t": 755.7833333333333, "x": "そして、デパートの中での大きな爆発も起きなかった。"}, {"t": 759.15, "x": "この渋谷の3件が、本当に草加次郎なのか\nどうかが分かっていない。"}, {"t": 763.8666666666667, "x": "どういうこと。"}, {"t": 764.8666666666667, "x": "捜査当局は当然、この3件と草加次郎の関係を調べた。"}, {"t": 768.8166666666667, "x": "そのときに、合わないものが出てきた。"}, {"t": 771.0666666666667, "x": "筆跡だ。"}, {"t": 772.0666666666667, "x": "……手紙の字が違ったの。"}, {"t": 773.7, "x": "置かれていたものと、脅迫状の筆跡が違っていた。"}, {"t": 777.0166666666667, "x": "だから、草加次郎の名前を\nかたった別の人物ではないか、という見方があった。"}, {"t": 781.95, "x": "真似した人が出たってこと。"}, {"t": 783.8333333333334, "x": "その可能性がある、というところまでだ。"}, {"t": 786.1833333333333, "x": "断定はされていない。"}, {"t": 787.4666666666667, "x": "ここが、この事件のややこしいところだ。"}, {"t": 789.9, "x": "名前が新聞に何度も出た。"}, {"t": 791.7333333333333, "x": "名前が有名になると、その名前を使う人間が出てくる。"}, {"t": 795.25, "x": "そうすると、どれが本人でどれが\n別人か、分からなくなる。"}, {"t": 799.0166666666667, "x": "……名前を出したことが、逆に守りになってるのね。"}, {"t": 802.0833333333334, "x": "結果としてそうなった。"}, {"t": 803.5666666666667, "x": "これは私の推測ではなく、\n当時の国会でも同じことが言われている。"}, {"t": 807.7833333333333, "x": "1964年4月23日、衆議院の地方行政委員会。"}, {"t": 812.2166666666667, "x": "川村継義という議員が、\n前の年の犯罪の特徴について質問している。"}, {"t": 816.9666666666667, "x": "原文を読む。"}, {"t": 817.9333333333333, "x": "「昨年はいろいろな事件が起きた。\nたとえば吉展ちゃん事件というのもある、"}, {"t": 822.1666666666666, "x": "狭山市の女子高校生の殺人事件が起こっている、"}, {"t": 825.3, "x": "それから爆弾を持って人をおどかした\n草加次郎というような事件等々が起こっておる。」"}, {"t": 830.0333333333333, "x": "「犯罪が非常に模倣的というか、\n人まねをするというか、"}, {"t": 833.5333333333333, "x": "伝播性的な犯罪が急激に\n多くなっておるのではないか。」"}, {"t": 837.15, "x": "……真似される犯罪が\n増えている、って国会で言ってるのね。"}, {"t": 840.4333333333333, "x": "言っている。事件のすぐ翌年だ。"}, {"t": 842.6166666666667, "x": "出典は国立国会図書館の国会会議録検索システム。"}, {"t": 846.6, "x": "第46回国会、衆議院地方行政委員会 第37号、\n1964年4月23日だ。"}, {"t": 854.35, "x": "1963年9月5日、夜8時14分ごろ。"}, {"t": 858.25, "x": "場所は、営団地下鉄の銀座線、京橋駅。"}, {"t": 861.2666666666667, "x": "浅草を夜7時23分に出た、渋谷行きの電車だった。"}, {"t": 865.1166666666667, "x": "その電車が京橋駅に停まっているときに、\n車内で爆発が起きた。"}, {"t": 869.4666666666667, "x": "……走ってる電車の中。"}, {"t": 871.05, "x": "停車中だ。だが、車内には乗客がいた。"}, {"t": 873.9166666666666, "x": "10人が負傷している。"}, {"t": 875.2333333333333, "x": "重傷が2人、軽傷が8人だ。"}, {"t": 877.5833333333334, "x": "銀座線の、しかも京橋。"}, {"t": 879.35, "x": "東京のまん中で、帰宅の時間帯だ。"}, {"t": 882.0833333333334, "x": "……いちばん人が乗ってる時間じゃない。"}, {"t": 884.2166666666667, "x": "そうだ。"}, {"t": 884.8166666666667, "x": "これは、置かれたものが時間で動く仕掛けだった。"}, {"t": 887.75, "x": "それ以上の説明はしない。"}, {"t": 889.3833333333333, "x": "ここで、この事件を象徴する話をする。"}, {"t": 892.0333333333333, "x": "爆発のあとに残ったものの中に、\n文字が書かれていた。"}, {"t": 895.5166666666667, "x": "残ったものひとつひとつに、一文字ずつ。"}, {"t": 898.2166666666667, "x": "「次」と「郎」だ。"}, {"t": 899.8166666666667, "x": "……名前を、分けて書いてたの。"}, {"t": 901.7166666666667, "x": "分けて書いてあった。"}, {"t": 902.95, "x": "爆発すれば散らばる。"}, {"t": 904.2666666666667, "x": "散らばったものを拾えば、名前になる。"}, {"t": 906.65, "x": "そういう置き方をしている。"}, {"t": 908.2, "x": "それと、もう一つ。"}, {"t": 909.6166666666667, "x": "残っていたものに、こう刻まれていた。"}, {"t": 911.95, "x": "「つぎは10日」。"}, {"t": 913.0333333333333, "x": "……予告してるってこと。"}, {"t": 914.5666666666667, "x": "予告だ。"}, {"t": 915.3166666666667, "x": "この5日後に何かが起きる、と自分で書いていた。"}, {"t": 918.2833333333333, "x": "この10人の負傷者の数は、\n帝都高速度交通営団の記録に残っている。"}, {"t": 922.9166666666666, "x": "この一連の事件の中で、資料の裏づけが\n最もはっきりしているのが、この一件だ。"}, {"t": 928.7666666666667, "x": "地下鉄の翌日、1963年9月6日。"}, {"t": 932.4, "x": "吉永小百合さんの自宅に、7通目の手紙が届いた。"}, {"t": 935.9333333333333, "x": "要求はやはり100万円。"}, {"t": 937.5, "x": "ただ、この7通目は、それまでの6通と2つ違っていた。"}, {"t": 941.4333333333333, "x": "どこが。"}, {"t": 942.2166666666667, "x": "一つ目は、受け渡しの方法だ。"}, {"t": 944.4166666666666, "x": "それまでは「上野駅前の喫茶店に来い」だった。"}, {"t": 947.5166666666667, "x": "7通目は違った。"}, {"t": 948.8666666666667, "x": "9月9日か、9月10日。"}, {"t": 950.9666666666667, "x": "草加次郎が指定した急行列車に乗り、"}, {"t": 953.4333333333333, "x": "合図の場所で、走っている列車から現金を投げ落とせ。"}, {"t": 956.85, "x": "……走ってる列車から。"}, {"t": 958.3166666666667, "x": "そうだ。"}, {"t": 958.9166666666666, "x": "これは、同じ年の3月に公開された\n「天国と地獄」とまったく同じ方法だ。"}, {"t": 964.1666666666666, "x": "この映画が公開されたあと、現実で同じ方法が\n使われた最初の事件だとされている。"}, {"t": 969.5, "x": "映画を見てから考えたってこと。"}, {"t": 971.6, "x": "そう言い切る証拠は無い。"}, {"t": 972.9666666666667, "x": "ただ、方法が一致していることは事実だ。"}, {"t": 975.65, "x": "二つ目の違いは、手紙に絵が入っていたことだ。"}, {"t": 978.6666666666666, "x": "時間で動く仕掛けを示す絵だった。"}, {"t": 980.8833333333333, "x": "前日に地下鉄でやったばかりの、その形だ。"}, {"t": 984.1, "x": "……見せつけてるのね。"}, {"t": 985.4333333333333, "x": "そう読める。"}, {"t": 986.2166666666667, "x": "前日に、東京のまん中で10人が怪我をしている。"}, {"t": 989.4, "x": "そこへ、9日か10日に列車に乗れという手紙が来た。"}, {"t": 992.7333333333333, "x": "断れば、また同じことが起きるかもしれない。"}, {"t": 995.6166666666667, "x": "……断れないわね。"}, {"t": 996.85, "x": "断れない。"}, {"t": 997.6833333333333, "x": "だから警察は、この指定に乗った。"}, {"t": 1000.65, "x": "1963年9月9日、夜7時10分発。"}, {"t": 1004.6, "x": "上野駅から出る、常磐線の急行「十和田」。"}, {"t": 1007.5166666666667, "x": "発車は、予定より1分遅れた。"}, {"t": 1009.6666666666666, "x": "この列車に、警察は仕掛けた。"}, {"t": 1011.7666666666667, "x": "区間は上野から土浦まで。"}, {"t": 1013.4, "x": "沿線の距離は67キロだ。"}, {"t": 1015.4833333333333, "x": "その沿線に、警察官を約300名配置している。"}, {"t": 1018.8833333333333, "x": "無線で連絡を取り合う体制も組んである。"}, {"t": 1021.4166666666666, "x": "300人。"}, {"t": 1022.4, "x": "300人だ。"}, {"t": 1023.45, "x": "そして列車の中には、100万円の紙包みを\n持った捜査員が6名乗った。"}, {"t": 1028.0, "x": "ほかの車内には、普通の乗客がいる。"}, {"t": 1030.6, "x": "……うまくいけば、捕まえられたのよね。"}, {"t": 1032.8833333333334, "x": "うまくいけば捕まえられた。"}, {"t": 1034.5, "x": "結果を言う。"}, {"t": 1035.3333333333333, "x": "合図は、最後まで出なかった。"}, {"t": 1037.35, "x": "……出なかった。"}, {"t": 1038.3166666666666, "x": "出なかった。"}, {"t": 1039.1833333333334, "x": "翌9月10日も、警察は動いている。"}, {"t": 1041.6833333333334, "x": "手紙に「9日か10日」と書いてあったからだ。"}, {"t": 1044.7166666666667, "x": "この日、地下鉄の警戒も強められた。"}, {"t": 1047.3, "x": "そして、何も起きなかった。"}, {"t": 1049.3, "x": "……何も。"}, {"t": 1050.0666666666666, "x": "何も起きなかった。"}, {"t": 1051.3333333333333, "x": "これが、草加次郎事件の最後の日になる。"}, {"t": 1054.65, "x": "1963年9月10日を最後に、\nこの名前は現場から消えた。"}, {"t": 1059.0833333333333, "x": "爆発も、銃撃も、手紙も、来なくなった。"}, {"t": 1062.3833333333334, "x": "……急にやめたの。"}, {"t": 1063.5333333333333, "x": "急にやめた、ように見える。"}, {"t": 1065.25, "x": "なぜ止まったのか。"}, {"t": 1066.4333333333334, "x": "これについては、記録が何も無い。"}, {"t": 1068.7, "x": "……本人が言わなかったんだものね。"}, {"t": 1070.75, "x": "言っていない。捕まってもいない。"}, {"t": 1072.6333333333334, "x": "だから、止まった理由を私が説明することはできない。"}, {"t": 1075.95, "x": "捕まりそうになってやめた、別の理由で\n動けなくなった、ほかの罪で捕まっていた。"}, {"t": 1081.0333333333333, "x": "いろいろな言われ方があるが、\nどれも裏づけのある話ではない。"}, {"t": 1084.5, "x": "だから私は、どれも採らない。"}, {"t": 1086.5666666666666, "x": "……分からない、が答えなのね。"}, {"t": 1088.4666666666667, "x": "分からない、が答えだ。"}, {"t": 1090.0, "x": "ただ、事実として言えることが一つある。"}, {"t": 1092.5666666666666, "x": "止まったのは9月10日。"}, {"t": 1094.15, "x": "そして、警察の捜査本部は、そのあとも動き続けた。"}, {"t": 1097.8, "x": "止まったのは事件のほうで、捜査ではない。"}, {"t": 1100.3, "x": "その捜査が、どこまで行っていたのか。"}, {"t": 1102.6333333333334, "x": "それが分かる記録が、一つだけ残っている。"}, {"t": 1105.4, "x": "国会の議事録だ。"}, {"t": 1107.3833333333334, "x": "1964年2月4日、参議院の法務委員会。"}, {"t": 1111.1, "x": "日本社会党の稲葉誠一議員が、こう聞いた。"}, {"t": 1114.0, "x": "「いま、他にいろいろな重要な\n未解決事件がたくさんあるわけですね。"}, {"t": 1118.0666666666666, "x": "吉展ちゃんの事件とか、にせ\n札事件とか、草加次郎の事件とか、"}, {"t": 1122.4666666666667, "x": "バラバラ事件とか、いろいろありますね。"}, {"t": 1124.8333333333333, "x": "現在どういうふうになっておりますか、差しつかえない\n範囲で述べていただきたいと思います。」"}, {"t": 1129.9666666666667, "x": "……4つ並んでるのね。"}, {"t": 1131.4333333333334, "x": "4つとも、当時まだ犯人が捕まっていなかった事件だ。"}, {"t": 1134.9666666666667, "x": "これに答えたのが、警察庁の刑事局長、日原正雄だ。"}, {"t": 1138.8, "x": "この答弁が、この事件について政府が\n国会で述べた、唯一の記録になる。"}, {"t": 1143.5333333333333, "x": "草加次郎の部分を、そのまま読む。"}, {"t": 1145.75, "x": "「それから\n草加次郎の連続爆発事件のことでございますが、"}, {"t": 1149.3833333333334, "x": "これも途中の捜査経過は新聞で大体御存じと\n思いますが、現在の捜査状況を申しますと、"}, {"t": 1155.1166666666666, "x": "現在、捜査本部では、犯人が\n爆発物あるいは脅迫状を郵送いたしました"}, {"t": 1160.1833333333334, "x": "下谷郵便局管内を中心とする\n地取りの捜査を実施しております。」"}, {"t": 1164.4333333333334, "x": "下谷。"}, {"t": 1165.2, "x": "いまの台東区だ。上野と浅草のあたりになる。"}, {"t": 1168.1, "x": "郵便物の消印から、出された場所を\n絞り込んでいた、ということだ。"}, {"t": 1172.2166666666667, "x": "答弁は、こう続く。"}, {"t": 1173.6833333333334, "x": "「なお、容疑者として少年をほかの容疑で\n逮捕取り調べております部面もございますが、"}, {"t": 1178.65, "x": "一応現在捜査の主体を\n捜査四課から一課に移しまして、"}, {"t": 1182.3333333333333, "x": "二十七名の要員でもって捜査を続行中でございます。」"}, {"t": 1185.8166666666666, "x": "……少年を、別の容疑で。"}, {"t": 1187.6166666666666, "x": "そう書いてある。"}, {"t": 1188.5333333333333, "x": "ただし、ここははっきり言っておく。"}, {"t": 1190.5333333333333, "x": "この少年について分かっているのは、この一文だけだ。"}, {"t": 1193.7833333333333, "x": "名前も、年齢も、その後どうなったかも、記録に無い。"}, {"t": 1197.2666666666667, "x": "そして、この事件で起訴された\n人間は、最後まで一人もいない。"}, {"t": 1201.3666666666666, "x": "……じゃあ、関係なかったってことよね。"}, {"t": 1203.6166666666666, "x": "少なくとも、犯人とされたことは一度も無い。"}, {"t": 1206.5666666666666, "x": "私はこの少年について、これ以上は言わない。"}, {"t": 1209.4, "x": "もう一つ、この答弁には数字がある。"}, {"t": 1211.7666666666667, "x": "捜査四課から一課へ。そして要員27名。"}, {"t": 1214.8166666666666, "x": "四課は、当時は暴力団などを扱う部署だ。"}, {"t": 1217.6833333333334, "x": "一課は、殺人や傷害などを扱う部署になる。"}, {"t": 1220.6666666666667, "x": "つまり、組織がやっている線から、\n個人の線に見方を移したことになる。"}, {"t": 1225.1666666666667, "x": "出典は国会会議録検索システム。"}, {"t": 1227.75, "x": "第46回国会、参議院法務委員会 第2号、\n1964年2月4日だ。"}, {"t": 1234.2333333333333, "x": "もう一つ、ほとんど知られていない記録がある。"}, {"t": 1236.95, "x": "1964年5月7日、参議院の運輸委員会。"}, {"t": 1240.6333333333334, "x": "答えているのは、\n日本国有鉄道の公安本部長、向井潔だ。"}, {"t": 1244.8833333333334, "x": "原文を読む。"}, {"t": 1245.8166666666666, "x": "「御承知と思いますけれども、実は\n昨年は草加次郎の一連がございまして、"}, {"t": 1250.45, "x": "非常に投書が、全部で三十数件ございました。」"}, {"t": 1253.7166666666667, "x": "……三十数件。"}, {"t": 1254.8333333333333, "x": "国鉄に対して、それだけ来ていた。"}, {"t": 1257.2666666666667, "x": "続きがある。"}, {"t": 1258.1333333333334, "x": "「『とき号』なんかの点もございまして、\nこの場合は県警なんかも全部出ていただきまして、"}, {"t": 1263.2166666666667, "x": "非常に捜査をいたしました。"}, {"t": 1264.8166666666666, "x": "同じように、機関車に\nしかけるというのがございます。」"}, {"t": 1268.0833333333333, "x": "列車にも予告が来てたのね。"}, {"t": 1270.05, "x": "来ていた。"}, {"t": 1270.7833333333333, "x": "さらに、こう言っている。"}, {"t": 1272.2166666666667, "x": "「そういたしますと、やはり\n捜査の方法といたしまして、"}, {"t": 1275.4333333333334, "x": "公開いたしませんで内々でやりませんと\n犯人がつかまえられない。"}, {"t": 1279.1166666666666, "x": "とにかくあのようなかっこうの犯人はこちらが"}, {"t": 1281.45, "x": "警戒をいたしましてつかまえるより\n方法がございませんので、"}, {"t": 1284.75, "x": "つかまえなければいつまでも\nその恐怖は続くという観点から、"}, {"t": 1288.2666666666667, "x": "相当日々人数出しまして\n警備並びに捜査いたしました。」"}, {"t": 1291.85, "x": "……表に出さずにやってたのね。"}, {"t": 1293.7666666666667, "x": "出さずにやっていた。"}, {"t": 1295.0333333333333, "x": "そして、同じ日の委員会で、もう一つ出ている。"}, {"t": 1298.1, "x": "日本社会党の中村順造議員が、こう聞いた。"}, {"t": 1301.15, "x": "「草加次郎の話が出たから、それは\n妄想だったように思うのですが、"}, {"t": 1305.2, "x": "かなり警視庁の公安二課からの情報に基づいて"}, {"t": 1308.2333333333333, "x": "有力な情報だと判断をされたということを\n聞いたわけですが、"}, {"t": 1311.4833333333333, "x": "しかもその対象が労働組合の計画に\n基づいてやられるというような判断がされておった」"}, {"t": 1316.8, "x": "……労働組合。"}, {"t": 1317.8666666666666, "x": "そういう情報が、有力なものとして\n扱われていた、ということだ。"}, {"t": 1321.9, "x": "中村議員は、そのあとこう述べている。"}, {"t": 1324.2833333333333, "x": "「まあ労働組合は対象でも\n全くなかったということで、その点はわかりました」"}, {"t": 1329.0666666666666, "x": "全然関係なかったのね。"}, {"t": 1330.9166666666667, "x": "関係なかった。"}, {"t": 1332.0333333333333, "x": "つまり、この事件の捜査は、途中で明らかに\n違う方向を向いていた時期がある。"}, {"t": 1336.6666666666667, "x": "これは他のどの資料にも出てこない。"}, {"t": 1338.6333333333334, "x": "国会の記録にだけ残っている。"}, {"t": 1340.7166666666667, "x": "出典は、第46回国会 参議院運輸委員会 第24号、\n1964年5月7日だ。"}, {"t": 1348.3, "x": "1964年4月24日、衆議院の法務委員会。"}, {"t": 1352.3, "x": "日本社会党の横山利秋議員が、こう切り出している。"}, {"t": 1355.8, "x": "「最近おくら入りというものが非常に多い。」"}, {"t": 1358.1166666666666, "x": "「にせ札とか吉展ちゃんとか、あるいは草加次郎とか、"}, {"t": 1361.4, "x": "重要な犯罪というものが非常に\n迷宮入りがふえておる。」"}, {"t": 1364.7666666666667, "x": "……また同じ4つね。"}, {"t": 1366.15, "x": "同じ顔ぶれだ。"}, {"t": 1367.2666666666667, "x": "そして横山議員は、その先で厳しいことを言っている。"}, {"t": 1370.6, "x": "「国民の中には、これらの迷宮入りの事件に\n対する警察の布陣と、"}, {"t": 1374.9166666666667, "x": "それから大衆運動に対する即応態勢と比較をしてみて、"}, {"t": 1378.5833333333333, "x": "刑事警察に欠くるところがあるのではないか」"}, {"t": 1381.4833333333333, "x": "……人の配り方の話をしてるのね。"}, {"t": 1383.8833333333334, "x": "している。"}, {"t": 1384.55, "x": "デモや集会に出す人数と、\n事件を追う人数を比べている。"}, {"t": 1388.15, "x": "さらに、こうも言っている。"}, {"t": 1389.6833333333334, "x": "「いわゆる職人的刑事とサラリーマン刑事との断層が\n起こっておるのではないか」"}, {"t": 1394.1, "x": "ここで、数字を並べておく。"}, {"t": 1395.9333333333334, "x": "この事件で、警視庁が投入した\n捜査員は延べ1万9000人。"}, {"t": 1399.9, "x": "火薬や爆発物に詳しい人物などを、\nおよそ9600人リストアップしている。"}, {"t": 1405.0833333333333, "x": "9600人。"}, {"t": 1406.4333333333334, "x": "9600人分を、一人ずつ潰していったということだ。"}, {"t": 1410.1166666666666, "x": "そして、当たらなかった。"}, {"t": 1411.8833333333334, "x": "……なのに分からなかったの。"}, {"t": 1413.4833333333333, "x": "警察の資料の中に、その指紋も、\nその筆跡も、無かった。"}, {"t": 1417.65, "x": "だから警察は、こう判断している。"}, {"t": 1419.9666666666667, "x": "草加次郎には、前科も前歴も無い。"}, {"t": 1422.5166666666667, "x": "……初めてだった、ってこと。"}, {"t": 1424.2833333333333, "x": "少なくとも、記録に残る形で警察と\n関わったことが無い人物だった。"}, {"t": 1429.05, "x": "材料はあった。比べる相手が、どこにも無かった。"}, {"t": 1432.1666666666667, "x": "出典は、第46回国会 衆議院法務委員会 第30号、\n1964年4月24日。"}, {"t": 1439.2166666666667, "x": "捜査人数の数字は、当時の報道を\nまとめた資料による。"}, {"t": 1443.3166666666666, "x": "事件が止まってからも、この名前は消えなかった。"}, {"t": 1446.2833333333333, "x": "1963年9月13日。"}, {"t": 1448.9333333333334, "x": "推理作家の木々高太郎さんの自宅に、\n電話がかかっている。"}, {"t": 1452.6333333333334, "x": "電話の相手は「クサカ」と名乗った。"}, {"t": 1455.1333333333334, "x": "……推理作家に電話したの。"}, {"t": 1456.9, "x": "した。"}, {"t": 1457.4666666666667, "x": "それが翌年も続く。"}, {"t": 1459.0, "x": "1964年6月12日の朝、今度は\n隣の家に電話がかかった。"}, {"t": 1463.9666666666667, "x": "隣の林教授の家に仕掛けた、という内容だ。"}, {"t": 1467.1166666666666, "x": "そして6月26日の夜8時10分ごろ、\n木々さんの家に直接かかってきた。"}, {"t": 1472.35, "x": "「おれは草加次郎だ」。そう言って切ったという。"}, {"t": 1474.8166666666666, "x": "これは読売新聞の1964年6月27日の記事に\n載っている。"}, {"t": 1479.7833333333333, "x": "……名乗る人が出てきたのね。"}, {"t": 1481.5333333333333, "x": "出てきた。本人かどうかは、分からない。"}, {"t": 1484.1333333333334, "x": "そして1967年。事件から4年後だ。"}, {"t": 1487.4833333333333, "x": "4月1日、参議院の予算委員会。"}, {"t": 1490.0166666666667, "x": "日本社会党の岡田宗司議員が、こう述べている。"}, {"t": 1493.0333333333333, "x": "「草加次郎はいまだつかまっておりません。"}, {"t": 1495.2666666666667, "x": "昨日の東京駅事件は、皆目まだ\n見当がついておらないという状況であります。」"}, {"t": 1500.15, "x": "……4年経っても出てくるのね。"}, {"t": 1501.9333333333334, "x": "出てくる。"}, {"t": 1503.3, "x": "そして同じ年の6月20日、参議院の運輸委員会。"}, {"t": 1506.8333333333333, "x": "運輸省の鉄道監督局長、増川遼三がこう答えている。"}, {"t": 1510.75, "x": "「私どもといたしましては、草加次郎的な\n爆発物による事件というものの"}, {"t": 1515.5, "x": "連鎖的に起こるということを非常に\nおそれておるわけでございまして」"}, {"t": 1519.3, "x": "……草加次郎「的な」。"}, {"t": 1520.8666666666666, "x": "そこだ。個人の名前が、事件の種類を\n指す言葉になっている。"}, {"t": 1524.75, "x": "この委員会で、日本共産党の岩間正男議員が\nこう問い詰めた。"}, {"t": 1528.6333333333334, "x": "「私はやっぱり草加次郎の問題を問題にしたい。"}, {"t": 1531.6333333333334, "x": "草加次郎の問題、これどこ行った。"}, {"t": 1533.7333333333333, "x": "どこへ行っちゃった、飛んじゃったか。"}, {"t": 1535.75, "x": "草加次郎の問題が起こって、あの問題が\n結局わからなくなったわけで」"}, {"t": 1540.1, "x": "このあと岩間議員は「現代の怪盗」\n「ネズミ小僧」という言い方もしている。"}, {"t": 1544.5666666666666, "x": "当時の国会でそう言われた、という\n記録として紹介するだけにしておく。"}, {"t": 1548.8, "x": "私はその言い方はしない。"}, {"t": 1550.35, "x": "怪我をされた方が14人いる事件だ。"}, {"t": 1552.8666666666666, "x": "……それで、答えはどうだったの。"}, {"t": 1554.7666666666667, "x": "ここが、この回の一番重いところだ。"}, {"t": 1557.2, "x": "答えたのは、警察庁の刑事局長、内海倫。"}, {"t": 1560.6333333333334, "x": "答弁の全文は、こうだ。"}, {"t": 1562.35, "x": "「草加次郎の件につきましては、\n私詳細承知いたしておりませんので、"}, {"t": 1566.65, "x": "警視庁より資料を取り寄せました\n上で、お答えいたします。」"}, {"t": 1570.2333333333333, "x": "……それだけ。"}, {"t": 1571.1333333333334, "x": "それだけだ。全部で70字しかない。"}, {"t": 1573.55, "x": "事件から4年。国会で名前を出されて、\n刑事局長が詳細を承知していないと答えた。"}, {"t": 1578.9333333333334, "x": "誤解のないように言っておく。"}, {"t": 1580.5166666666667, "x": "この事件を捜査していたのは警視庁で、\n内海刑事局長は警察庁の人だ。"}, {"t": 1585.3833333333334, "x": "役所が違うので、その場で細かく\n答えられなかったという読み方もできる。"}, {"t": 1589.7833333333333, "x": "だから私は「警察が捨てた」とは言わない。"}, {"t": 1592.6666666666667, "x": "ただ、このやり取りが国会の記録に\n残っている、という事実は残る。"}, {"t": 1596.85, "x": "出典は、第55回国会 参議院運輸委員会 第12号、\n1967年6月20日だ。"}, {"t": 1603.7, "x": "そして、さらに3年後。"}, {"t": 1605.45, "x": "1970年5月13日、参議院の運輸委員会。"}, {"t": 1609.3, "x": "日本社会党の岡三郎議員が、こう言っている。"}, {"t": 1612.2333333333333, "x": "「私は空の乗っ取り事件と同時に、空の草加次郎が\n出てくるのじゃないかという心配が一つある。」"}, {"t": 1618.0833333333333, "x": "……空の草加次郎。"}, {"t": 1619.4166666666667, "x": "1970年には、もう人の名前ですらない。"}, {"t": 1622.6666666666667, "x": "「捕まらない爆弾魔」という\n意味の、ただの言葉になっている。"}, {"t": 1626.3, "x": "本人は、1963年9月10日から\n一度も現れていないのにだ。"}, {"t": 1631.65, "x": "ここで、一つだけ別の事件に触れる。"}, {"t": 1634.1333333333334, "x": "1968年6月、横須賀線の電車で爆発が起きた事件だ。"}, {"t": 1639.05, "x": "この事件では、亡くなった方も、\n怪我をされた方も多数出ている。"}, {"t": 1643.0333333333333, "x": "草加次郎事件とは別の事件なので、\n中身には入らない。"}, {"t": 1646.6, "x": "この事件の犯人は、逮捕されている。"}, {"t": 1648.9833333333333, "x": "現場に残された新聞の切れ端から、購読者を\nたどって割り出されたと伝えられている。"}, {"t": 1654.2, "x": "……こっちは捕まったのね。"}, {"t": 1655.8, "x": "捕まった。"}, {"t": 1656.6833333333334, "x": "私がここで触れたいのは、\nその人物が語ったとされる言葉だ。"}, {"t": 1660.65, "x": "一つは「捕まらなかった草加次郎を尊敬する」。"}, {"t": 1663.7333333333333, "x": "もう一つは「草加次郎さえ出現しなければ、\n列車爆破なんてやらなかった」。"}, {"t": 1668.6166666666666, "x": "……両方言ってるの。"}, {"t": 1669.8666666666666, "x": "両方伝えられている。"}, {"t": 1671.25, "x": "ただ、この発言の出典は弱い。"}, {"t": 1673.5, "x": "一次の記録で確認できていないので、\n「そう伝えられている」以上のことは言わない。"}, {"t": 1678.25, "x": "草加次郎は、1963年9月10日で止まっている。"}, {"t": 1682.15, "x": "止まったあと、その名前が別の人間を\n動かした、という話になるからだ。"}, {"t": 1686.85, "x": "……名前だけが先に歩いていったのね。"}, {"t": 1689.1333333333334, "x": "そうなる。"}, {"t": 1689.8, "x": "この事件は、最初から最後まで\n「名前が広まること」と一緒に動いている。"}, {"t": 1694.5, "x": "名前を残したから有名になり、\n有名になったから真似が出て、"}, {"t": 1698.2166666666667, "x": "真似が出たから、どれが本人か分からなくなった。"}, {"t": 1701.3, "x": "……全部つながってるのね。"}, {"t": 1702.8666666666666, "x": "つながっている。"}, {"t": 1703.85, "x": "そして、その名前の持ち主だけが、\n最後まで出てこなかった。"}, {"t": 1708.3666666666666, "x": "1978年、昭和53年9月5日。"}, {"t": 1711.9166666666667, "x": "この日付で、公訴時効が成立した。"}, {"t": 1714.5666666666666, "x": "時効って、どういう仕組みだったの。"}, {"t": 1716.7833333333333, "x": "当時の法律の話をする。"}, {"t": 1718.5833333333333, "x": "公訴時効というのは、事件から一定の年数が\n経つと、検察が起訴できなくなる制度だ。"}, {"t": 1724.05, "x": "起訴できなくなるということは、\n裁判ができないということだ。"}, {"t": 1727.5833333333333, "x": "犯人が見つかっても、もう罪に問えない。"}, {"t": 1730.1333333333334, "x": "その年数は、罪の重さで決まっていた。"}, {"t": 1732.7166666666667, "x": "2004年に法律が変わる前は、死刑に\nあたる罪の時効は15年だった。"}, {"t": 1737.2166666666667, "x": "爆発物を使う罪には、死刑が定められている。"}, {"t": 1740.4666666666667, "x": "1963年9月5日から15年で、1978年9月5日になる。"}, {"t": 1746.3666666666666, "x": "……地下鉄の日から、ちょうど15年ね。"}, {"t": 1748.8166666666666, "x": "そうなる。"}, {"t": 1749.5, "x": "ただし、どの罪でどう計算されたのかを、\n政府が公表した記録は見つかっていない。"}, {"t": 1754.4333333333334, "x": "そこは分からないままだ。"}, {"t": 1755.7666666666667, "x": "分からないことは、分からないと言っておく。"}, {"t": 1758.2833333333333, "x": "はっきりしているのは、1978年9月5日付で\n時効が成立した、ということだ。"}, {"t": 1764.0833333333333, "x": "この日、何が終わったのか。"}, {"t": 1765.9166666666667, "x": "その全部が、この日で法律の上では意味を失った。"}, {"t": 1769.2166666666667, "x": "……誰も捕まらないまま。"}, {"t": 1770.8166666666666, "x": "誰も捕まらないまま。"}, {"t": 1772.3, "x": "それから、時効にはもう一つの側面がある。"}, {"t": 1775.1166666666666, "x": "疑われた側を解放する働きだ。"}, {"t": 1777.4166666666667, "x": "この事件では、9600人がリストに載っている。"}, {"t": 1780.6833333333334, "x": "その中には、何もしていないのに\n調べられた人が大勢いたはずだ。"}, {"t": 1784.85, "x": "……あ。"}, {"t": 1785.3, "x": "1964年の答弁にあった、別の容疑で\n取り調べを受けた少年もそうだ。"}, {"t": 1790.4, "x": "その人たちにとっては、この日が\n終わりの日でもあった。"}, {"t": 1793.6166666666666, "x": "時効という制度は、\n犯人のためだけにあるものではない。"}, {"t": 1796.8833333333334, "x": "そのことは、ここで言っておきたい。"}, {"t": 1798.9166666666667, "x": "なお、この15年という線は、\nその後の日本では変わっていく。"}, {"t": 1802.6, "x": "2004年に25年に延び、2010年には、\n人を死なせた重い罪の時効が廃止された。"}, {"t": 1808.3, "x": "だが、廃止は過去にさかのぼらない。"}, {"t": 1810.5166666666667, "x": "1978年に完成した時効が、\nあとから戻ってくることはない。"}, {"t": 1815.75, "x": "ここまでの話で、分かっていないことを並べておく。"}, {"t": 1818.85, "x": "一つ目。犯人が誰なのか。"}, {"t": 1820.9, "x": "これは分かっていない。"}, {"t": 1821.9666666666667, "x": "逮捕も起訴もされていない。"}, {"t": 1823.6666666666667, "x": "二つ目。何のためにやったのか。"}, {"t": 1825.85, "x": "金を要求した回は複数ある。だが、\n一度も受け取りに来ていない。"}, {"t": 1830.05, "x": "……お金じゃないのよね、たぶん。"}, {"t": 1831.8666666666666, "x": "そう見たくなる。だが、それも推測でしかない。"}, {"t": 1834.8166666666666, "x": "三つ目。なぜ止まったのか。"}, {"t": 1836.6666666666667, "x": "1963年9月10日から、ぱたりと何も無い。"}, {"t": 1840.2166666666667, "x": "理由の記録が無い。"}, {"t": 1841.55, "x": "四つ目。渋谷の3件が本当に同じ人物なのか。"}, {"t": 1845.05, "x": "筆跡が違ったので、\n別人という見方があった。決着していない。"}, {"t": 1849.3166666666666, "x": "五つ目。名前の読み方だ。"}, {"t": 1851.3666666666666, "x": "……そうだった。"}, {"t": 1852.3333333333333, "x": "「そうか」なのか「くさか」なのか、分かっていない。"}, {"t": 1855.6, "x": "本人が一度も名乗らなかったからだ。"}, {"t": 1857.8833333333334, "x": "文字では何度も書いた。"}, {"t": 1859.1833333333334, "x": "声では、一度も言っていない。"}, {"t": 1861.0333333333333, "x": "1964年に「おれは草加次郎だ」と\n電話をかけた人物はいるが、"}, {"t": 1865.7166666666667, "x": "それが本人かどうかは確かめられていない。"}, {"t": 1868.2166666666667, "x": "資料によっては「そうかじろう」、別の資料では\n「くさかじろう」と書かれている。"}, {"t": 1872.8, "x": "私はこの動画で「そうかじろう」と読んできたが、"}, {"t": 1875.85, "x": "それが正しいかどうかは、誰にも分からない。"}, {"t": 1878.4666666666667, "x": "六つ目。この名前に意味があるのかどうか。"}, {"t": 1880.9666666666667, "x": "埼玉県に草加という地名があるが、\n関係があるという根拠は何も無い。"}, {"t": 1885.25, "x": "最初の一件に添えられた「K」が\n何なのかも、分かっていない。"}, {"t": 1889.3666666666666, "x": "……全部、分からないのね。"}, {"t": 1891.0666666666666, "x": "全部だ。"}, {"t": 1891.8, "x": "分かっているのは、起きたことと、\n日付と、怪我をされた方の数。"}, {"t": 1895.8833333333334, "x": "それと、書き残された名前だけだ。"}, {"t": 1898.8166666666666, "x": "最後にまとめる。"}, {"t": 1899.95, "x": "1962年11月4日、品川の後援会事務所に届いた封筒。"}, {"t": 1904.9666666666667, "x": "11月13日、麻布。"}, {"t": 1906.8333333333333, "x": "11月20日、有楽町。"}, {"t": 1908.8166666666666, "x": "11月26日、日比谷。"}, {"t": 1911.0833333333333, "x": "11月29日、世田谷の電話ボックス。"}, {"t": 1913.95, "x": "12月12日、浅草寺。"}, {"t": 1916.1, "x": "ここでいったん止まり、5か月後に手紙で戻ってくる。"}, {"t": 1919.2666666666667, "x": "1963年5月9日から7月22日まで、\n吉永小百合さん宅へ6通。"}, {"t": 1925.15, "x": "7月15日、上野公園で屋台の店主が撃たれた。"}, {"t": 1928.5666666666666, "x": "7月24日、8月11日、8月14日、\n渋谷の東横デパートで3件。"}, {"t": 1934.4666666666667, "x": "9月5日夜8時14分、\n地下鉄銀座線の京橋駅で10人が負傷。"}, {"t": 1939.1666666666667, "x": "9月6日、7通目の手紙。"}, {"t": 1941.1333333333334, "x": "9月9日と10日、常磐線に300人。"}, {"t": 1944.1666666666667, "x": "そして、何も起きずに終わった。"}, {"t": 1946.1666666666667, "x": "怪我をされた方は、合わせて14人。"}, {"t": 1948.3166666666666, "x": "亡くなった方はいない。"}, {"t": 1949.7833333333333, "x": "1978年9月5日、公訴時効成立。"}, {"t": 1953.5333333333333, "x": "……こうやって並べると、10か月なのね。"}, {"t": 1956.1, "x": "10か月だ。"}, {"t": 1957.1, "x": "私がこの回で一番言いたいのは、\nこの事件の残り方だ。"}, {"t": 1960.7833333333333, "x": "普通、事件は被害者の名前か、地名で呼ばれる。"}, {"t": 1963.9166666666667, "x": "この事件は違う。犯人が自分で\n書いた名前で呼ばれている。"}, {"t": 1967.6166666666666, "x": "……自分でつけた名前が残ったのね。"}, {"t": 1969.8666666666666, "x": "残った。"}, {"t": 1970.6166666666666, "x": "そして、その名前だけが一人で歩いていった。"}, {"t": 1973.4833333333333, "x": "1964年、推理作家の家にかかってきた\n電話で名乗られた。"}, {"t": 1977.8, "x": "1967年、国会で「草加次郎的な事件」という\n言い方をされた。"}, {"t": 1982.8333333333333, "x": "同じ年、刑事局長は\n「詳細承知いたしておりません」と答えた。"}, {"t": 1987.1666666666667, "x": "1970年には「空の草加次郎」という言葉になった。"}, {"t": 1991.2666666666667, "x": "本人は、1963年9月10日から\n一度も出てきていないのにだ。"}, {"t": 1996.0, "x": "それでも名前だけが、7年ものあいだ使われ続けた。"}, {"t": 1999.5166666666667, "x": "……名前を残したかったのかしら。"}, {"t": 2001.5333333333333, "x": "それも分からない。"}, {"t": 2002.6166666666666, "x": "ただ、結果として残ったのは名前だけだ。"}, {"t": 2005.2833333333333, "x": "顔も、声も、理由も、何一つ残っていない。"}, {"t": 2008.4666666666667, "x": "最後に、怪我をされた14人の方のことを書いておく。"}, {"t": 2011.7, "x": "映画を見終わってロビーを歩いていた人。"}, {"t": 2013.85, "x": "電話をかけに入った人。"}, {"t": 2015.3666666666666, "x": "掃除をしていた人。"}, {"t": 2016.8, "x": "屋台を出していた人。"}, {"t": 2018.1, "x": "仕事で封筒を開けた人。"}, {"t": 2019.8833333333334, "x": "仕事帰りの地下鉄に乗っていた10人。"}, {"t": 2022.3, "x": "全員、その日たまたまそこにいただけの方たちだ。"}, {"t": 2025.55, "x": "……普通の一日だったのよね、その人たちには。"}, {"t": 2028.6, "x": "そうだ。"}, {"t": 2029.2166666666667, "x": "この事件は、犯人の名前で呼ばれている。"}, {"t": 2031.8, "x": "呼ばれていないのは、その14人のほうだ。"}, {"t": 2034.3333333333333, "x": "出典を挙げておく。"}, {"t": 2035.6166666666666, "x": "捜査状況と当時の議論は、\n国立国会図書館の国会会議録検索システムから。"}, {"t": 2041.0333333333333, "x": "第46回国会 参議院法務委員会 第2号、\n1964年2月4日。"}, {"t": 2046.7833333333333, "x": "第46回国会 衆議院地方行政委員会 第37号、\n1964年4月23日。"}, {"t": 2053.733333333333, "x": "第46回国会 衆議院法務委員会 第30号、\n1964年4月24日。"}, {"t": 2060.016666666667, "x": "第46回国会 参議院運輸委員会 第24号、\n1964年5月7日。"}, {"t": 2066.1, "x": "第55回国会 参議院予算委員会 第5号、\n1967年4月1日。"}, {"t": 2071.9333333333334, "x": "第55回国会 参議院運輸委員会 第12号、\n1967年6月20日。"}, {"t": 2077.95, "x": "第63回国会 参議院運輸委員会 第18号、\n1970年5月13日。"}, {"t": 2084.233333333333, "x": "資料によって日付が食い違うところは、\n動画の中でそのつど断った。"}, {"t": 2088.5333333333333, "x": "事件の経過は、当時の朝日新聞・読売新聞・\n毎日新聞の報道をもとに構成された"}, {"t": 2094.35, "x": "講談社の記事と、宝島社の資料による。"}, {"t": 2097.1666666666665, "x": "木々高太郎さんへの電話は、\n読売新聞 1964年6月27日の記事。"}, {"t": 2102.9333333333334, "x": "地下鉄の負傷者数は、\n帝都高速度交通営団の記録による。"}, {"t": 2106.95, "x": "踏み込んだ経緯は、\nリサーチのファイルにすべて残してある。"}, {"t": 2110.1666666666665, "x": "ここでもう一度だけ繰り返しておく。"}, {"t": 2112.266666666667, "x": "この事件の犯人は、いまも特定されていない。"}, {"t": 2115.1666666666665, "x": "だから私は、誰かを名指しして\n犯人と呼ぶことはしない。"}, {"t": 2118.6833333333334, "x": "この事件をどう見たか、よければ\nコメント欄で聞かせてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
