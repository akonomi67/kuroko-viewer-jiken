<script>
const D={"name": "071", "file": "071_編集用", "dur": 1981.46665625, "segs": [], "subs": [{"t": 0.0, "x": "一九四九年八月十七日の未明。"}, {"t": 3.1666666666666665, "x": "福島県の松川町の付近で、列車が脱線して転覆した。"}, {"t": 7.316666666666666, "x": "乗務員三人が亡くなっている。"}, {"t": 9.233333333333333, "x": "この事件で、多くの人が逮捕され、起訴された。"}, {"t": 12.4, "x": "一審で有罪。二審でも有罪。"}, {"t": 14.35, "x": "死刑を言い渡された人もいた。"}, {"t": 16.45, "x": "死刑？"}, {"t": 17.133333333333333, "x": "だが、最終的に、全員の無罪が確定している。"}, {"t": 20.5, "x": "一九六三年九月十二日、最高裁判所第一小法廷。"}, {"t": 24.866666666666667, "x": "事件番号は昭和三十六年（あ）第二三七八号。"}, {"t": 29.233333333333334, "x": "検察官の上告が棄却されて、無罪が確定した。"}, {"t": 32.766666666666666, "x": "先に、この回のいちばん大事な断りを言う。"}, {"t": 35.516666666666666, "x": "この回で「被告とされた方々」と\n呼ぶ人たちは、全員、無罪だ。"}, {"t": 40.1, "x": "「本当はやったのではないか」という\n言い方を、この回では一度もしない。"}, {"t": 44.25, "x": "真犯人の話も？"}, {"t": 45.833333333333336, "x": "しない。"}, {"t": 46.4, "x": "この事件については、いろいろな説が語られてきた。"}, {"t": 49.43333333333333, "x": "国会でも語られている。"}, {"t": 51.03333333333333, "x": "だが、その中身は一切扱わない。"}, {"t": 53.38333333333333, "x": "時効は一九六四年の八月に完成している。"}, {"t": 56.666666666666664, "x": "誰がやったのかは、分かっていない。"}, {"t": 58.85, "x": "分かっていないものを、分かっているように話さない。"}, {"t": 61.68333333333333, "x": "そして、亡くなった三人の乗務員には、ご遺族がいる。"}, {"t": 65.1, "x": "この回は、その方々を軽く扱わない。"}, {"t": 67.8, "x": "そのうえで、この回で追うものは一つだけだ。"}, {"t": 70.5, "x": "一枚のメモが、なぜ十年近く\n法廷に出てこなかったのか。"}, {"t": 74.21666666666667, "x": "根拠は、国会の会議録と、\n裁判所の裁判例検索と、法律の条文だけだ。"}, {"t": 80.23333333333333, "x": "最初に、亡くなった三人のことから始める。"}, {"t": 83.06666666666666, "x": "この事件の話は、たいてい\n裁判の話から始まってしまう。"}, {"t": 86.88333333333334, "x": "だが、まず列車が転覆して、人が亡くなっている。"}, {"t": 90.16666666666667, "x": "一九五二年三月六日、参議院の法務委員会。"}, {"t": 93.86666666666666, "x": "証人尋問の中で、委員の一松定吉さんが、\n事件の概要を証人に確認している。"}, {"t": 99.68333333333334, "x": "その質問の中に、こうある。"}, {"t": 101.61666666666666, "x": "「汽車を顛覆せしめて機関士が一人と\n助手が二名死んだという事件だね」"}, {"t": 105.98333333333333, "x": "機関士が一人と、助手が二名。"}, {"t": 108.3, "x": "合わせて三人だ。"}, {"t": 109.51666666666667, "x": "最高裁の記録で、この事件の罪名は\n「汽車顛覆致死」となっている。"}, {"t": 114.1, "x": "人が亡くなった事件だ、ということが\n罪名にも書かれている。"}, {"t": 117.68333333333334, "x": "そして、時間が経ってからも、\nこの三人のことは国会で繰り返し出てくる。"}, {"t": 122.33333333333333, "x": "無罪が確定した翌年、\n一九六四年三月十三日、衆議院法務委員会。"}, {"t": 127.9, "x": "志賀義雄委員が、警察庁にこう言っている。"}, {"t": 130.56666666666666, "x": "「三人の犠牲者が出ましたね、列車転覆のため」"}, {"t": 133.76666666666668, "x": "「その機関士の奥さんは、いまだに無罪になった\n人々がやったのだろう、こういうふうに考えている」"}, {"t": 139.15, "x": "……。"}, {"t": 140.08333333333334, "x": "念のため言っておく。この方々は無罪だ。"}, {"t": 142.6, "x": "裁判所がそう判断して、確定している。"}, {"t": 145.4, "x": "いま読んだのは、ご遺族がそう思ってしまうほど、\n誰も答えを持っていなかった、という話だ。"}, {"t": 150.9, "x": "これが、この事件のもう一つの側面だ。"}, {"t": 153.6, "x": "無罪判決が出ても、亡くなった人は\n戻らないし、誰がやったのかも分からない。"}, {"t": 158.38333333333333, "x": "同じころ、別の委員がこう述べている。"}, {"t": 160.7, "x": "「当時の被害者の家族の人たちも、仏さんもこれでは"}, {"t": 163.93333333333334, "x": "浮ばれぬという談話を発表して、国民に\nしゅんとした気分を与えたわけであります」"}, {"t": 168.68333333333334, "x": "無罪が確定するというのは、遺族にとっては\n「犯人が分からなくなる」ということでもある。"}, {"t": 174.08333333333334, "x": "そのことを、先に置いておきたい。"}, {"t": 176.73333333333332, "x": "事件のあと、多くの人が逮捕された。"}, {"t": 179.23333333333332, "x": "この回では、何人が逮捕され、何人に\n死刑判決が出たかという数字は言わない。"}, {"t": 184.35, "x": "どうして？"}, {"t": 185.18333333333334, "x": "国会の会議録では、その数字を\n確認できなかったからだ。"}, {"t": 188.9, "x": "確認できていない数字を、\nそれらしく言うことはしない。"}, {"t": 192.1, "x": "分かっていることを言う。"}, {"t": 193.4, "x": "一審は福島地方裁判所。有罪判決が出た。"}, {"t": 196.75, "x": "二審は仙台高等裁判所。ここでも有罪だった。"}, {"t": 200.0, "x": "一九五二年三月の参議院の委員会では、\nこの事件についてこう説明されている。"}, {"t": 205.4, "x": "「この松川事件というのは、"}, {"t": 207.0, "x": "福島の裁判所で今裁判を受けてね、それが\n仙台の高等裁判所に控訴されておる事件だね」"}, {"t": 212.93333333333334, "x": "そして同じ委員が、こう続けている。"}, {"t": 215.21666666666667, "x": "「福島の裁判所では黙秘権を行使して見たり、"}, {"t": 218.05, "x": "或いは弁護士が裁判長を忌避して見たりしてやつて、"}, {"t": 221.06666666666666, "x": "大変、裁判の回数が殆んど\n百回近く開廷したという事件だ」"}, {"t": 225.53333333333333, "x": "百回近く？"}, {"t": 226.71666666666667, "x": "一審だけで、それだけ開かれている。"}, {"t": 229.05, "x": "二審でも、死刑の求刑があった。"}, {"t": 231.28333333333333, "x": "一九六三年二月十二日、\n衆議院法務委員会での発言だ。"}, {"t": 235.93333333333334, "x": "「第二審におきまして、昭和二十八年七月、\nやはり死刑の求刑をやっている」"}, {"t": 240.95, "x": "昭和二十八年は、一九五三年だ。事件から四年後。"}, {"t": 245.18333333333334, "x": "一審で有罪、二審でも有罪。"}, {"t": 247.26666666666668, "x": "この段階では、この事件は\n「解決した事件」ということになっていた。"}, {"t": 252.28333333333333, "x": "その間、被告とされた人たちがどこにいたか。"}, {"t": 255.21666666666667, "x": "一九五九年八月十日、衆議院法務委員会。"}, {"t": 258.78333333333336, "x": "坂本泰良委員の発言だ。"}, {"t": 260.78333333333336, "x": "「被告人は、先日保釈を許された数人は、"}, {"t": 263.6666666666667, "x": "十カ年間未決勾留として畳一畳敷の中に\n十カ年間生活をしておる」"}, {"t": 268.9, "x": "十年？"}, {"t": 269.6666666666667, "x": "判決が確定していない状態で、十年だ。"}, {"t": 272.5833333333333, "x": "そして、この一行が続く。"}, {"t": 274.45, "x": "「逮捕されるときに生まれた子供が十才になっておる」"}, {"t": 277.3, "x": "……。"}, {"t": 278.23333333333335, "x": "坂本さんは、こう結んでいる。"}, {"t": 280.23333333333335, "x": "「そのようなことは私は人権じゅうりんで、\nこの上もないことだと考えるわけであります」"}, {"t": 285.1166666666667, "x": "ここで、一つ整理しておきたい。"}, {"t": 287.18333333333334, "x": "この十年のあいだ、この人たちは何をしていたか。"}, {"t": 290.3, "x": "やっていない、と言い続けていた。"}, {"t": 292.23333333333335, "x": "だが、言い続けるだけでは、裁判は動かない。"}, {"t": 295.15, "x": "動かすには、証拠がいる。"}, {"t": 296.8666666666667, "x": "そして、その証拠は、\nこの人たちの手の届かないところにあった。"}, {"t": 301.01666666666665, "x": "どこに？"}, {"t": 301.76666666666665, "x": "検察庁の中だ。"}, {"t": 303.15, "x": "正確に言えば、検察官の部屋の中だ。"}, {"t": 305.8666666666667, "x": "ここから、その話をする。"}, {"t": 308.35, "x": "一九五八年八月九日、衆議院法務委員会。"}, {"t": 312.28333333333336, "x": "志賀義雄委員が、法務省の担当者にこう聞いている。"}, {"t": 315.43333333333334, "x": "「次にもう一つ、諏訪メモについて\n刑事課長に御答弁願いたいのでありますが、"}, {"t": 319.93333333333334, "x": "松川事件の佐藤一被告のアリバイに\n関する重大な証拠があります」"}, {"t": 324.3833333333333, "x": "「これは東芝工場の諏訪という労務課長、"}, {"t": 326.68333333333334, "x": "今北芝工場の総務課長か何かやっている人ですが、"}, {"t": 330.1, "x": "当時佐藤一君はこの諏訪課長と\n一緒に団体交渉をやっておった。"}, {"t": 334.1333333333333, "x": "労務課長の諏訪君がメモを書いております」"}, {"t": 336.81666666666666, "x": "団体交渉のメモ。"}, {"t": 338.3, "x": "東芝の松川工場で、会社側と組合が交渉していた。"}, {"t": 342.1, "x": "そのときに、会社側の労務課長が取っていたメモだ。"}, {"t": 345.31666666666666, "x": "翌年の委員会では、この人はこう呼ばれている。"}, {"t": 348.21666666666664, "x": "「当時の松川工場長代理の諏訪親一郎君のメモ」"}, {"t": 351.56666666666666, "x": "志賀委員は、続けてこう聞いている。"}, {"t": 353.65, "x": "「これについて、証拠として本人が\n申し出たのに出ておりませんので、"}, {"t": 357.4, "x": "仙台の弁護士会で決議をして、弁護士法に\n基きまして照会いたしましたところ、"}, {"t": 362.48333333333335, "x": "工場の方、諏訪君の方ではそれは\n提出いたしましたと言うのです」"}, {"t": 366.6333333333333, "x": "「その諏訪メモというものは今どこにありますか」"}, {"t": 369.3666666666667, "x": "本人は出した、と言っている？"}, {"t": 371.3666666666667, "x": "ああ。工場の側は、警察か\n検察に渡したと言っている。"}, {"t": 374.98333333333335, "x": "だが、法廷には出ていない。"}, {"t": 376.71666666666664, "x": "答えたのは、\n法務省刑事局公安課長の川井英良さんだ。"}, {"t": 380.65, "x": "「私ども、諏訪メモの所在並びに\nその押収の経過あるいはその保管の"}, {"t": 384.8333333333333, "x": "状況というようなことについては、"}, {"t": 386.45, "x": "法務省として報告を受けておりませんので、\nただいまお答え申し上げられません」"}, {"t": 391.05, "x": "どこにあるか分からない。"}, {"t": 392.55, "x": "この時点では、そうだ。"}, {"t": 394.73333333333335, "x": "では、そのメモには何が書いてあったのか。"}, {"t": 397.26666666666665, "x": "ここが、この事件のいちばん重要なところだ。"}, {"t": 400.03333333333336, "x": "二審の認定はこうだった。"}, {"t": 401.7, "x": "一九五八年十月二十九日、\n衆議院法務委員会での志賀委員の説明だ。"}, {"t": 406.98333333333335, "x": "「この事件は、御承知の通り第二審の判決は、"}, {"t": 409.9, "x": "当日の午前十一時十五分の松川発の列車に"}, {"t": 413.1666666666667, "x": "乗って共同謀議に参加したのだ、\nこういう判決になっております」"}, {"t": 417.01666666666665, "x": "午前十一時十五分の列車。"}, {"t": 419.1166666666667, "x": "その列車に乗って、別の場所で行われた\n打ち合わせに参加した、という認定だ。"}, {"t": 423.95, "x": "そして、諏訪メモが示していたのは、こうだった。"}, {"t": 426.96666666666664, "x": "「しかしながら、会社側の記録、"}, {"t": 428.96666666666664, "x": "諏訪メモによっても、当日午前中の最後の発言が\n佐藤一被告になっているのです」"}, {"t": 434.3833333333333, "x": "「午前中の団体交渉は午前十時過ぎから"}, {"t": 437.0833333333333, "x": "開かれまして、ちょうど昼の汽笛が\n鳴ったときに食事というので打ち切られた」"}, {"t": 441.43333333333334, "x": "昼まで、その場にいた。"}, {"t": 443.15, "x": "午前十時過ぎに始まった交渉で、最後に発言したのが\nこの人だ、と会社側の記録に書いてある。"}, {"t": 449.43333333333334, "x": "そして交渉が終わったのは、昼の汽笛が鳴ったときだ。"}, {"t": 452.81666666666666, "x": "午前十一時十五分の列車には、乗れない。"}, {"t": 455.65, "x": "それだけで、崩れるのね。"}, {"t": 457.46666666666664, "x": "志賀委員は、こう言っている。"}, {"t": 459.0833333333333, "x": "「これほど重大なものなのです」"}, {"t": 460.9, "x": "ここで一つ言っておきたい。"}, {"t": 462.51666666666665, "x": "このメモは、被告側が作ったものではない。"}, {"t": 465.25, "x": "交渉の相手方だった会社の、労務課長が\n業務として取っていたメモだ。"}, {"t": 469.6, "x": "だから、被告に有利に作られたものではありえない。"}, {"t": 472.6166666666667, "x": "そういう性質の記録が、法廷に出ていなかった。"}, {"t": 476.26666666666665, "x": "弁護人は、証拠を見せろと言い続けていた。"}, {"t": 478.96666666666664, "x": "一九五八年十月七日、衆議院法務委員会。"}, {"t": 482.55, "x": "志賀委員の発言だ。"}, {"t": 484.0, "x": "「この諏訪メモは、松川事件の裁判が\n始まってからこれまで弁護人の方からたびたび"}, {"t": 488.9, "x": "関係書類を全部公開してくれ」"}, {"t": 490.98333333333335, "x": "「これは公判が始まったならば、"}, {"t": 492.76666666666665, "x": "刑事訴訟法第四十条によって弁護士としては訴訟に\n関係する書類及び証拠物は閲覧する権利があります」"}, {"t": 499.51666666666665, "x": "権利がある。"}, {"t": 500.48333333333335, "x": "条文の上では、そうなっている。"}, {"t": 502.48333333333335, "x": "そのうえで、こう続く。"}, {"t": 503.98333333333335, "x": "「それに基いて言っておったのについて、\n書類及び証拠物二百種類ばかりを見せておりません」"}, {"t": 509.4166666666667, "x": "二百種類？"}, {"t": 510.45, "x": "一つや二つではない。"}, {"t": 511.9166666666667, "x": "そして、次の一行がすごい。"}, {"t": 513.8333333333334, "x": "「現に転覆した列車のところにあった\nレール及び車輪というような、"}, {"t": 517.3833333333333, "x": "あの重いものさえも\nどこかにいってしまっておるのです」"}, {"t": 520.45, "x": "レールと車輪が？"}, {"t": 521.6333333333333, "x": "現場に残っていた、いちばん基本的な物証だ。"}, {"t": 524.7, "x": "脱線した現場のレールと、車輪。"}, {"t": 526.85, "x": "それが、どこにいったか\n分からない、と国会で言われている。"}, {"t": 530.2166666666667, "x": "志賀委員は、別の日にもこの点を繰り返している。"}, {"t": 533.2166666666667, "x": "「二百通の未発表の調書と一緒に\n先日お伺いしました。このレール、本輪などは"}, {"t": 538.2833333333333, "x": "どこに行っているのですか」"}, {"t": 539.65, "x": "ここは、確認できたところまでで止めておく。"}, {"t": 542.3666666666667, "x": "この質問に対して所在が明らかにされた、という\n記録を、私は見つけていない。"}, {"t": 547.3333333333334, "x": "分かっているのは、弁護人が請求しても、\n出てこないものが大量にあった、ということだ。"}, {"t": 552.6666666666666, "x": "そして、その中に、あのメモがあった。"}, {"t": 555.7833333333333, "x": "では、どうやって表に出たのか。"}, {"t": 557.8, "x": "弁護人が請求して出てきたのではない。"}, {"t": 560.2166666666667, "x": "新聞記者が見つけた。"}, {"t": 561.75, "x": "一九五八年十月七日、志賀委員の説明だ。"}, {"t": 565.45, "x": "「この諏訪メモが発見されたのは、"}, {"t": 567.3, "x": "新聞の福島支局の記者がその所在を、"}, {"t": 569.9166666666666, "x": "検察庁にあることを突きとめて新聞に\n発表したのが事の起りであります。"}, {"t": 574.3333333333334, "x": "二審が終ったあとですが」"}, {"t": 576.1333333333333, "x": "二審が終わったあと。"}, {"t": 577.5166666666667, "x": "一審も二審も終わってからだ。"}, {"t": 579.35, "x": "ちなみに、どの新聞が最初に書いたかについては、\n会議録の中で発言が食い違っている。"}, {"t": 584.8666666666667, "x": "だからこの回では、社名は出さない。"}, {"t": 587.1, "x": "確実なのは、記者が検察庁にあることを\n突き止めて記事にした、ということだ。"}, {"t": 591.9666666666667, "x": "そこから、弁護人が動いた。"}, {"t": 593.9333333333333, "x": "「そこで松川事件の主任弁護人の一人である\n大塚弁護人から口頭で二回、ついに"}, {"t": 599.1333333333333, "x": "三回目に内容証明をもって要求いたしました」"}, {"t": 602.0666666666667, "x": "内容証明まで？"}, {"t": 603.3666666666667, "x": "口で言っても出てこないから、\n記録の残る形にした、ということだ。"}, {"t": 607.5666666666667, "x": "ここで、なぜ弁護人が新聞に\n頼らなければならなかったのかを、押さえておきたい。"}, {"t": 612.2833333333333, "x": "弁護人には、証拠を閲覧する権利がある。"}, {"t": 614.9833333333333, "x": "だが、閲覧を請求するには、それが\n存在することを知っていなければならない。"}, {"t": 619.6333333333333, "x": "何があるのかを知らなければ、\n何を見せろとも言えない。"}, {"t": 622.85, "x": "知らないものは、請求できない。"}, {"t": 624.9666666666667, "x": "そこが、この事件が突きつけた本当の問題だ。"}, {"t": 628.0666666666667, "x": "この一点は、四十六年後の国会で\nもう一度出てくる。あとで話す。"}, {"t": 633.0666666666667, "x": "内容証明を送った弁護人に、検察は何と答えたか。"}, {"t": 636.7, "x": "志賀委員が読み上げている。"}, {"t": 638.2, "x": "「最高検の安平検事が本年二月二十五日、\nこの松川事件はまだ係属中で\n未確定につき、証拠物の還付または"}, {"t": 645.4666666666667, "x": "公開の御要望には応じかねる次第でありますという\n答弁があったのです」"}, {"t": 649.5333333333333, "x": "一九五八年二月二十五日だ。"}, {"t": 652.3833333333333, "x": "まだ裁判が終わっていないから、見せられない。"}, {"t": 655.1333333333333, "x": "そういう理屈だ。"}, {"t": 656.2333333333333, "x": "法務省の側も、後にその趣旨を説明している。"}, {"t": 659.3166666666667, "x": "一九五八年十月二十九日、\n刑事局長の竹内壽平さんの答弁だ。"}, {"t": 664.7, "x": "「当時はまだ松川事件について最高検で\n記録を検討中でありましたので、"}, {"t": 669.0666666666667, "x": "弁護人に返還するということは、"}, {"t": 671.1, "x": "刑事訴訟法の規定から"}, {"t": 672.35, "x": "申しまして筋違いであるというような趣旨から"}, {"t": 674.9833333333333, "x": "拒絶をしたものであるという\nふうに了解をいたしております」"}, {"t": 678.1833333333333, "x": "ここまでは、まだ理屈として通る話だ。"}, {"t": 680.85, "x": "裁判が続いている以上、証拠物を\n勝手に人に渡すわけにはいかない。"}, {"t": 685.2666666666667, "x": "うん。"}, {"t": 685.7666666666667, "x": "ところが、その数か月後に、このメモは返されている。"}, {"t": 689.1166666666667, "x": "弁護人にではない。書いた本人にだ。"}, {"t": 691.6, "x": "本人に？"}, {"t": 692.5166666666667, "x": "ああ。諏訪さんに還付された。"}, {"t": 694.3666666666667, "x": "志賀委員は、そこを突いている。"}, {"t": 696.2166666666667, "x": "「最高検の安平検事が\n弁護人からの要求に対して還付または"}, {"t": 699.9, "x": "公開の御要望に応じかねると言っておったものを、"}, {"t": 702.5166666666667, "x": "どうしてまた検察庁が急に本人に\n還付することになったのですか」"}, {"t": 706.7, "x": "竹内刑事局長の答えはこうだ。"}, {"t": 708.9333333333333, "x": "「記録を検討した結果、"}, {"t": 710.4333333333333, "x": "今日領置を必要としないというふうに"}, {"t": 712.75, "x": "認めるに至ったので\n返したということでございますので、\nさよう御了承願いたい」"}, {"t": 717.1833333333333, "x": "そしてこう付け加えている。"}, {"t": 718.8166666666667, "x": "「品物を領置いたしましたときには、ちゃんと\n領置書を作りまして物品を明らかにしており、それは"}, {"t": 724.5, "x": "訴訟関係人にはわかっておるはずでございます。"}, {"t": 726.8333333333334, "x": "何も隠しておったというような\n筋合いではないと思います」"}, {"t": 730.2666666666667, "x": "隠していたわけではない、と。"}, {"t": 732.1833333333333, "x": "それが法務省の立場だった。"}, {"t": 734.0666666666667, "x": "そして結果として、本人に返されたメモが\n弁護人の手に渡り、上告審の材料になった。"}, {"t": 740.4, "x": "ここからが、この回の核心だ。"}, {"t": 742.55, "x": "一九六二年四月二十五日、衆議院法務委員会。"}, {"t": 746.4333333333333, "x": "志賀委員が、検察官が法廷で宣誓して"}, {"t": 749.2, "x": "述べたことをもとに、このメモが\nどこにあったのかを読み上げている。"}, {"t": 752.6166666666667, "x": "時系列で聞いてほしい。"}, {"t": 754.0833333333334, "x": "昭和二十七年九月中旬から二十八年七月まで。"}, {"t": 757.5666666666667, "x": "仙台高等検察庁の公安事務室。"}, {"t": 760.0666666666667, "x": "保管者は稲辺検察事務官。"}, {"t": 762.1666666666666, "x": "昭和二十八年七月から二十九年四月まで。"}, {"t": 765.2333333333333, "x": "盛岡区検察庁の検察官室。大沼副検事。"}, {"t": 768.9833333333333, "x": "盛岡？"}, {"t": 769.8, "x": "ああ。志賀委員は、こう言っている。"}, {"t": 771.7833333333333, "x": "「全然事件に関係のないところで\n大沼副検事が預かっておった」"}, {"t": 775.75, "x": "次だ。"}, {"t": 776.4166666666666, "x": "昭和二十九年四月から三十二年六月下旬まで。"}, {"t": 779.7166666666667, "x": "釜石区検察庁の検察官室。同じ大沼副検事。"}, {"t": 783.75, "x": "今度は釜石。"}, {"t": 784.9666666666667, "x": "三年二か月だ。"}, {"t": 786.2666666666667, "x": "そして昭和三十二年六月下旬から\n七月十二日まで、福島地方検察庁の庁舎。"}, {"t": 792.1, "x": "志賀委員は、この移動の理由をこう説明している。"}, {"t": 794.9833333333333, "x": "「これは六月に諏訪メモのことを新聞が\n書いたのでこういう処置をとったのです。"}, {"t": 799.1166666666667, "x": "事実は符合しております」"}, {"t": 800.9666666666667, "x": "記事が出てから動いた。"}, {"t": 802.5333333333333, "x": "最後だ。"}, {"t": 803.25, "x": "昭和三十二年七月十二日から\n三十三年の四月か五月まで。"}, {"t": 807.45, "x": "最高検察庁の庁舎。最高検の神山欣治検事が保管。"}, {"t": 811.7, "x": "仙台、盛岡、釜石、福島、東京。"}, {"t": 814.8166666666667, "x": "この間、法廷にも弁護人にも出ていない。"}, {"t": 818.0333333333333, "x": "いま並べた場所を、もう一度見てほしい。"}, {"t": 820.35, "x": "盛岡と、釜石だ。"}, {"t": 821.9, "x": "この二つは、松川事件の裁判をやっている\n場所ではない。"}, {"t": 825.55, "x": "なぜそこにあるの？"}, {"t": 826.8333333333334, "x": "保管していた副検事が、そこへ転任したからだ。"}, {"t": 830.05, "x": "一九六三年二月十二日、衆議院法務委員会。"}, {"t": 833.7666666666667, "x": "志賀委員がこう指摘している。"}, {"t": 835.6166666666667, "x": "「大沼副検事は、昭和二十八年七月から\n昭和二十九年四月まで\n盛岡区の区検の副検事として出ております。"}, {"t": 842.7, "x": "次に昭和二十九年四月から昭和三十二年六月下旬まで\n釜石区検の方におりました」"}, {"t": 848.5333333333333, "x": "「そのときに諏訪メモは持って行っているんです」"}, {"t": 850.9833333333333, "x": "「こういう取り扱いは検察庁で\n許しておられるのですか。どうですか」"}, {"t": 855.1166666666667, "x": "持って行った？"}, {"t": 856.1166666666667, "x": "転勤のたびに、事件の証拠が一緒に移動している。"}, {"t": 859.2666666666667, "x": "この時期、この副検事がいた法廷での証言も、\n志賀委員が読み上げている。"}, {"t": 863.75, "x": "「それから一審の判決が終わってからですね。\nそういうふうに返さなかった証拠物は、"}, {"t": 868.4833333333333, "x": "どういうふうにしましたかね」という問いに対して。"}, {"t": 871.45, "x": "「諏訪メモはキャビネットに入れておったと思います」"}, {"t": 874.1666666666666, "x": "キャビネット？"}, {"t": 875.1333333333333, "x": "机のそばの、書類入れだ。"}, {"t": 876.9666666666667, "x": "さらに、こういうやりとりも記録されている。"}, {"t": 879.4166666666666, "x": "「どこから命令されたんですか。\nそういう連絡係というのは」"}, {"t": 882.9666666666667, "x": "「ま、大きく言えば検事正からの命令だと思います」"}, {"t": 886.0333333333333, "x": "ここは、この人ひとりの問題ではなかった、ということを\n示している。"}, {"t": 890.1666666666666, "x": "私は、この副検事個人を責めるために\nこの話をしているのではない。"}, {"t": 894.4, "x": "一つの紙が、組織の中で、誰の目にも\n触れないまま九年間動き続けた。"}, {"t": 899.4, "x": "そういうことが起こりうる仕組みだった、ということだ。"}, {"t": 902.9333333333333, "x": "この点について、法務省はどう答えたか。"}, {"t": 905.5833333333334, "x": "同じ一九六三年二月十二日、\n刑事局長の竹内壽平さんの答弁だ。"}, {"t": 911.15, "x": "「先ほど申しました\n昭和二十八年の証拠品事務規程におきましては、\nそういう取扱いは"}, {"t": 916.1, "x": "許されないわけでございます」"}, {"t": 918.2166666666667, "x": "許されない？"}, {"t": 919.2166666666667, "x": "ああ。まず、規程違反だと認めている。"}, {"t": 921.65, "x": "そして、規程ができる前についても、こう言っている。"}, {"t": 924.75, "x": "「なお、今の場合は、適当な保管方法でないことは、\n私もそういうふうに考えます」"}, {"t": 930.0, "x": "「事務規程ができます以前といえども、\nそういう取り扱い方が適当でないということは、"}, {"t": 934.7666666666667, "x": "私どもの立場から申しまして、\nはっきり言えると思います」"}, {"t": 938.4666666666667, "x": "さらに、庁の外に持ち出す「庁外保管」という\n例外についても触れている。"}, {"t": 943.0166666666667, "x": "「庁外保管という庁の外に保管する場合も、"}, {"t": 945.6333333333333, "x": "特例として認められておりますが、本件のようなものは"}, {"t": 948.85, "x": "庁外保管にすべき\n性質の証拠品ではございませんので、その取り扱い"}, {"t": 953.0666666666667, "x": "方も、この事務規程の考え方からいたしますと、\n相反するわけでございます」"}, {"t": 957.8666666666667, "x": "「適当な保管方法とは私も考えませんし、"}, {"t": 960.65, "x": "現在そのようなことは\nおそらくやっているところはないという\nふうに思っているわけです」"}, {"t": 965.3333333333334, "x": "法務省が認めているのね。"}, {"t": 967.1333333333333, "x": "ここは公平に言っておきたい。"}, {"t": 968.8333333333334, "x": "この局長は、逃げていない。"}, {"t": 970.65, "x": "規程に反している。適当ではない。\nはっきり言えると思う。そう答えている。"}, {"t": 975.0666666666667, "x": "もう一つ、この件については裁判所の判断も出ている。"}, {"t": 978.5166666666667, "x": "一九六一年六月三十日、福島地方裁判所の決定だ。"}, {"t": 983.3333333333334, "x": "この保管をめぐって、検察官らの処罰を\n求める請求が出されていた。"}, {"t": 987.7, "x": "裁判所は、その請求を棄却している。"}, {"t": 990.3833333333333, "x": "棄却？"}, {"t": 991.1833333333333, "x": "ああ。誰かの犯罪が認定されたわけではない。\nそこは間違えてはいけない。"}, {"t": 995.4666666666667, "x": "ただ、棄却する決定の中に、\nこういう一節が入っている。"}, {"t": 999.1666666666666, "x": "「諏訪メモが最高裁判所大法廷に\n提出される迄の検察当局の保管方法が、\nまことに明朗を欠くものがあり」"}, {"t": 1006.0166666666667, "x": "「この事情に接見簿に関する問題を併せ考えるときは、"}, {"t": 1009.35, "x": "本件審判請求にかかる\n犯罪事実の存在したのではないかという\n疑惑が極めて濃厚なるの感を"}, {"t": 1015.15, "x": "禁じ得ないのである」"}, {"t": 1016.3833333333333, "x": "請求は棄却する。だが、\n疑惑は極めて濃厚だと感じる。"}, {"t": 1020.1833333333333, "x": "裁判所が、そう書いている。"}, {"t": 1022.6, "x": "では、なぜ返したのか。"}, {"t": 1024.2, "x": "これについて、検察側の言葉が記録に残っている。"}, {"t": 1027.55, "x": "一九六二年四月二十五日、志賀委員が\n読み上げた検察官の証言だ。"}, {"t": 1032.6333333333334, "x": "「提出していないというだけで隠匿と\n言われて吾々としても迷惑だ」"}, {"t": 1036.6, "x": "「松川事件にも悪い影響を与えるのではないか、\nそれなら一層返してしまおうということになり、"}, {"t": 1041.8666666666666, "x": "返すのがよいかどうか\n事件の関係などを話し合いました」"}, {"t": 1045.3666666666666, "x": "隠匿と言われて迷惑だ。"}, {"t": 1047.1333333333334, "x": "新聞に書かれて、国会で\n聞かれて、隠していると言われる。"}, {"t": 1050.7833333333333, "x": "それが迷惑だから、返してしまおう、という\n相談をした、ということだ。"}, {"t": 1055.05, "x": "志賀委員は、この点をこう突いている。"}, {"t": 1057.2166666666667, "x": "「あなたは、何も重要なものではないから、"}, {"t": 1059.5666666666666, "x": "返せと言ったら返したのだと言われるけれども、\n検事が今この文書の中で言っているじゃありませんか」"}, {"t": 1065.15, "x": "「外で騒ぐから、隠匿だと言われるから\nやむなく返したのだ、こう言われている」"}, {"t": 1069.7, "x": "そしてこう続ける。"}, {"t": 1070.95, "x": "「これも弁護人がそのときに"}, {"t": 1072.6166666666666, "x": "請求しているでしょう、だから\n検察庁にあるのだから、これを出せばいいです」"}, {"t": 1076.9166666666667, "x": "本人に返すくらいなら、弁護人に見せればよかった。"}, {"t": 1080.3166666666666, "x": "それが、この委員会でずっと言われていたことだ。"}, {"t": 1083.0666666666666, "x": "ここで、この回の筋を一度まとめる。"}, {"t": 1085.4333333333334, "x": "弁護人が請求したときは、係属中だから\n応じられない、と断られた。"}, {"t": 1089.9333333333334, "x": "新聞に書かれて、国会で\n追及されたら、書いた本人に返した。"}, {"t": 1094.1333333333334, "x": "そして返されたものが、\n弁護人の手に渡って、上告審で使われた。"}, {"t": 1098.5666666666666, "x": "制度が動いたのではない。"}, {"t": 1099.9166666666667, "x": "外からの騒ぎが動かした。"}, {"t": 1102.4666666666667, "x": "いま言ったことが、そのままの言葉で\n残っている記録がある。"}, {"t": 1105.95, "x": "一九六四年三月五日、衆議院法務委員会。"}, {"t": 1109.6666666666667, "x": "志賀委員が、検察官の法廷での証言を、\n裁判官との問答の形で読み上げている。"}, {"t": 1115.0333333333333, "x": "読む。"}, {"t": 1115.5333333333333, "x": "問い。国会の法務委員会も一つの理由ですか。"}, {"t": 1118.5666666666666, "x": "答え。そうです。"}, {"t": 1119.8, "x": "問い。騒いでいる中に入るのですか。"}, {"t": 1122.1, "x": "答え。入ります。"}, {"t": 1123.4333333333334, "x": "問い。検察の威信ですか。"}, {"t": 1125.2666666666667, "x": "答え。そういう趣旨を入れてですね。"}, {"t": 1127.3833333333334, "x": "問い。結局騒がなければ返さない訳か。"}, {"t": 1130.0666666666666, "x": "答え。それはそうですよ。"}, {"t": 1131.8333333333333, "x": "……それはそうですよ。"}, {"t": 1133.0666666666666, "x": "この最後の一行が、この回の中でいちばん重い。"}, {"t": 1136.0833333333333, "x": "騒がなければ返さない。"}, {"t": 1137.6, "x": "逆に言えば、騒がれなければ、\nあの紙は返らなかった。"}, {"t": 1140.9833333333333, "x": "ここでもう一度考えてほしい。"}, {"t": 1142.8166666666666, "x": "新聞記者がたまたま見つけなければ。"}, {"t": 1145.1, "x": "見つけたのが、記事にできる立場の人でなければ。"}, {"t": 1148.1666666666667, "x": "国会に、九年前の事件を\nしつこく追う議員がいなければ。"}, {"t": 1151.8, "x": "どれか一つ欠けていたら。"}, {"t": 1153.55, "x": "あの十年は終わらなかった。"}, {"t": 1155.2, "x": "そして、それは「制度が働いた」ということではない。"}, {"t": 1158.6166666666666, "x": "たまたま、いくつかの偶然が重なったということだ。"}, {"t": 1161.75, "x": "志賀委員自身が、そのことを法務省にぶつけている。"}, {"t": 1164.8666666666666, "x": "「要するに私どもがここで請求しなければ\n検事庁は証拠を出さない」"}, {"t": 1168.8666666666666, "x": "「これはもうあなたの言われる公判を\n維持するために、検事と平等で争うときに、"}, {"t": 1173.1833333333334, "x": "公益を代表するといわれる検事がいつ\n証拠書類を出すかというテクニックの問題ではなくて、"}, {"t": 1178.3, "x": "明らかに被告に有利な文書を、権力を\n乱用してやったということにもなってくる」"}, {"t": 1183.7666666666667, "x": "一九五九年八月十日。"}, {"t": 1186.1666666666667, "x": "最高裁判所大法廷が、判決を言い渡した。"}, {"t": 1189.3166666666666, "x": "事件番号は昭和二十九年（あ）第一六七一号。"}, {"t": 1193.15, "x": "罪名は「汽車顛覆致死、同幇助」。"}, {"t": 1195.75, "x": "結果は、原判決の破棄と、\n仙台高等裁判所への差戻しだ。"}, {"t": 1200.3, "x": "破棄差戻し。"}, {"t": 1201.5, "x": "これは、裁判所の裁判例検索でいまも確認できる。"}, {"t": 1205.0, "x": "そしてこの日の午後、\n衆議院の法務委員会が開かれている。"}, {"t": 1208.6, "x": "判決の当日だ。"}, {"t": 1210.0, "x": "坂本泰良委員が、こう報告している。"}, {"t": 1212.5166666666667, "x": "「聞くところによりますと、これはあとで\n判決が詳しく判明すると思いますが」"}, {"t": 1217.0666666666666, "x": "この断りを置いた上で、内訳を述べている。"}, {"t": 1219.75, "x": "「十二名の裁判官のうち七名が原審判決の破棄、\nさらに事件を原審に差し戻す意見であり、"}, {"t": 1225.55, "x": "四名の裁判官、ことに田中耕太郎長官、池田、\n垂水、高橋、四名の裁判官は上告却下」"}, {"t": 1232.4166666666667, "x": "「下飯坂裁判官は一部有罪、一部破棄」"}, {"t": 1235.45, "x": "七対四で、一人が別。"}, {"t": 1237.5, "x": "割れている。"}, {"t": 1238.2833333333333, "x": "もう一人、志賀委員が\n判決の理由についてこう述べている。"}, {"t": 1241.6833333333334, "x": "「きょうの判決理由書の中でも、"}, {"t": 1243.5, "x": "松川で列車を転覆させる謀議が成立しなかったという\n謀議不成立ということがこの判決の主たる"}, {"t": 1249.05, "x": "理由になっているのであります」"}, {"t": 1251.0, "x": "「一つは精神異常のある太田という\n被告の自白を土台としていること、もう"}, {"t": 1255.2833333333333, "x": "一つは諏訪メモの存在によって佐藤一という\n被告のアリバイが証明される、こういうところから"}, {"t": 1260.2666666666667, "x": "謀議不成立ということになった」"}, {"t": 1262.4833333333333, "x": "念のため言うと、これは判決当日の議員の発言だ。"}, {"t": 1265.8, "x": "判決文そのものではない。"}, {"t": 1267.5833333333333, "x": "ただ、その日の国会でそう\n説明されたことは記録に残っている。"}, {"t": 1271.6, "x": "そして志賀委員は、こう続けている。"}, {"t": 1273.7666666666667, "x": "「諏訪メモが、異例の措置ではあったが、最高裁に\nおいて証拠に準じて取り扱われるということになった」"}, {"t": 1279.85, "x": "異例の措置。"}, {"t": 1280.8333333333333, "x": "本来なら、証拠は下級審で調べるものだ。"}, {"t": 1283.6833333333334, "x": "それが、最高裁で扱われた。"}, {"t": 1285.8333333333333, "x": "出るべきときに出ていなかったから、\nそうするしかなかった。"}, {"t": 1289.8166666666666, "x": "差し戻された裁判は、仙台高等裁判所で\nもう一度やり直された。"}, {"t": 1294.0833333333333, "x": "そして一九六一年、全員が無罪になった。"}, {"t": 1297.5, "x": "検察官はこれに上告した。"}, {"t": 1299.5166666666667, "x": "その上告事件の番号が、昭和三十六年\n（あ）第二三七八号だ。"}, {"t": 1304.9833333333333, "x": "昭和三十六年。"}, {"t": 1306.4166666666667, "x": "一九六一年に受け付けられた、ということが\n番号から分かる。"}, {"t": 1310.6166666666666, "x": "そして一九六三年九月十二日、\n最高裁判所第一小法廷。"}, {"t": 1315.5, "x": "事件名は「汽車顛覆致死等被告事件」。"}, {"t": 1318.3, "x": "結果は、棄却。"}, {"t": 1319.5666666666666, "x": "ここで、無罪が確定した。"}, {"t": 1321.45, "x": "事件が起きたのが一九四九年八月。"}, {"t": 1324.4333333333334, "x": "確定が一九六三年九月。"}, {"t": 1327.1666666666667, "x": "十四年。"}, {"t": 1328.0166666666667, "x": "そのうち十年近く、被告とされた\n人たちは勾留されていた。"}, {"t": 1331.95, "x": "そして、その裁判をひっくり返した紙は、\nそのほとんどの期間、検察庁の中にあった。"}, {"t": 1337.5166666666667, "x": "ここまでが、この事件の裁判の話だ。"}, {"t": 1340.1666666666667, "x": "ここから先は、そのあとの話をする。"}, {"t": 1342.65, "x": "先に断っておくと、この先に\n「真犯人が分かった」という展開は無い。"}, {"t": 1347.3833333333334, "x": "一九六四年八月に時効が完成して、\n誰がやったのかは分かっていない。"}, {"t": 1352.5, "x": "分からないまま？"}, {"t": 1353.6666666666667, "x": "ああ。それが、この事件のもう一つの結末だ。"}, {"t": 1357.3833333333334, "x": "無罪が確定したあと、責任のある\n立場の人たちが何を言ったか。"}, {"t": 1361.5666666666666, "x": "三つ並べる。"}, {"t": 1362.5833333333333, "x": "一つ目。当時の法務大臣、賀屋興宣さんの談話だ。"}, {"t": 1366.0833333333333, "x": "一九六四年三月五日の委員会で、\n横山利秋委員が要約して読み上げている。"}, {"t": 1371.6666666666667, "x": "「この判決は検察当局の立場からは"}, {"t": 1374.1333333333334, "x": "遺憾なことであるが、すでに\n裁判所の最終の判断が示された以上、これに"}, {"t": 1378.6, "x": "従うべきは言うまでもないところであって」"}, {"t": 1380.8333333333333, "x": "「特にこの事件の裁判が多数の人命に\n関することであったことや、"}, {"t": 1384.6833333333334, "x": "被告人が長期にわたって不安定な\n立場に置かれたことなどを考えるとき、\n人権に関する問題でもあるので」"}, {"t": 1391.2166666666667, "x": "「この際、進んでこの判決から多くの教訓を\nくみ取り、今後の検察の運営に資したい」"}, {"t": 1396.6166666666666, "x": "「なお、この事件の公判審理が長期に"}, {"t": 1399.2, "x": "及んだことについても、\nいろんな面からその原因を綿密に"}, {"t": 1402.1333333333334, "x": "検討した上で、\nこの種の事件の処理の迅速化をはかりたい」"}, {"t": 1405.9333333333334, "x": "教訓をくみ取りたい。"}, {"t": 1407.3833333333334, "x": "二つ目。刑事局長の竹内壽平さんが、\n無罪確定の直後、"}, {"t": 1411.65, "x": "一九六三年九月末から\n十月にかけての全国の検察官会同で行った指示だ。"}, {"t": 1417.5, "x": "「この事件の終結にあたり、\nその捜査及び公判活動の全般を\n顧みますとき、あるいは長期裁判、"}, {"t": 1423.5333333333333, "x": "裁判批判等の問題について幾多の論議が行なわれ」"}, {"t": 1426.95, "x": "「あるいは証拠品の取り扱いなどについても\n若干の批判を招いたことは"}, {"t": 1431.15, "x": "御承知のとおりでありまして、これらのうちには\n検察運営の基本に触れるものとして深い関心を払」"}, {"t": 1436.6666666666667, "x": "ここまでが、志賀委員が読み上げた範囲だ。"}, {"t": 1439.2, "x": "三つ目。警察庁の警備局長だった\n後藤田正晴さんの答弁だ。"}, {"t": 1443.4666666666667, "x": "一九六四年三月十三日。"}, {"t": 1446.1166666666666, "x": "「私は松川事件の捜査の進め方等を、"}, {"t": 1448.8, "x": "公判の審理経過あるいは判決の内容等を見て、\nこれはやはり警察としては反省すべき点は反省する、"}, {"t": 1454.9833333333333, "x": "改めるべきところは改めにやならぬという\nふうに考えておる点はございます」"}, {"t": 1459.5166666666667, "x": "三人とも、反省すると言っている。"}, {"t": 1461.9333333333334, "x": "言っている。"}, {"t": 1462.65, "x": "ここは、皮肉なしで受け取っていいと思う。"}, {"t": 1465.15, "x": "問題は、その反省が制度になるまでに\n何年かかったか、だ。"}, {"t": 1469.6666666666667, "x": "ここで、話は一気に四十年跳ぶ。"}, {"t": 1472.1166666666666, "x": "二〇〇四年四月二十一日、衆議院の法務委員会。"}, {"t": 1475.4833333333333, "x": "刑事訴訟法の改正案が審議されていた。"}, {"t": 1478.1, "x": "公判前整理手続と、証拠開示の制度を作る改正だ。"}, {"t": 1481.8833333333334, "x": "辻惠委員が、こう切り出している。"}, {"t": 1484.1333333333334, "x": "「戦後の冤罪事件で、よく何かあれば\n八海事件であるとか松川事件だとかいう\nふうに取り上げられます」"}, {"t": 1490.0833333333333, "x": "「松川事件は、結局のところ、"}, {"t": 1492.1833333333334, "x": "死刑判決が出たけれども、"}, {"t": 1493.9, "x": "最終的に最高裁判所でひっくり返って\n無罪になったわけでありますが、その重要な"}, {"t": 1498.9333333333334, "x": "ターニングポイントになったのが\n諏訪メモだと言われております」"}, {"t": 1502.2833333333333, "x": "四十年たっても、名前が出るのね。"}, {"t": 1504.7333333333333, "x": "そして、こう質問している。"}, {"t": 1506.6166666666666, "x": "「諏訪メモと言われるようなものが\n今回の刑事訴訟法の改正の三百十六条の十五の類型に"}, {"t": 1511.9666666666667, "x": "当たるということで出てくる\n余地があるのかどうなのか」"}, {"t": 1514.65, "x": "答えたのは、\n司法制度改革推進本部事務局長の山崎潮さんだ。"}, {"t": 1519.2833333333333, "x": "「一般的にメモと言われれば、これは証拠物、"}, {"t": 1521.95, "x": "一号がございますけれども、これに\n当たるのではないかと思います」"}, {"t": 1525.7, "x": "条文の上では、開示の対象になりうる、という答えだ。"}, {"t": 1529.1333333333334, "x": "だが、辻委員はそこで引かない。"}, {"t": 1531.1333333333334, "x": "「ただ、諏訪メモは、そういう存在は\n全くわからなかったわけです」"}, {"t": 1535.1333333333334, "x": "「死刑判決が出た後にようやく"}, {"t": 1537.0666666666666, "x": "何かの拍子であらわれて、それが日の目を見て、\nそれで命が救われたという案件なんですよ」"}, {"t": 1542.2833333333333, "x": "そして、核心を突く。"}, {"t": 1543.9, "x": "「三百十六条の十五の二項の、"}, {"t": 1545.9166666666667, "x": "弁護人の側がこれを識別して明示しなきゃいけない、\nこれには、そういうメモの存在がわからないんだから"}, {"t": 1551.85, "x": "出てこないわけであります」"}, {"t": 1553.3833333333334, "x": "さっきの話ね。知らないものは請求できない。"}, {"t": 1556.4333333333334, "x": "ああ。一九五八年と、まったく同じ問題だ。"}, {"t": 1560.6, "x": "辻委員は、その解決策として、こう提案している。"}, {"t": 1564.0, "x": "「少なくとも警察官が収集した\n証拠のリストについては全件検察庁に"}, {"t": 1568.65, "x": "送致すべきであるし、その検察庁の\nもとの証拠のリストについては、\nこれはその証拠のリストそれ"}, {"t": 1574.1, "x": "自体を弁護人に開示すべきだ」"}, {"t": 1576.15, "x": "何があるかの一覧だけ見せろ、と。"}, {"t": 1578.4666666666667, "x": "中身ではない。目録だけだ。"}, {"t": 1580.4666666666667, "x": "それがあれば、「この記録を見せてくれ」と言える。"}, {"t": 1583.2666666666667, "x": "政府側の答えはこうだった。"}, {"t": 1585.05, "x": "「検察官手持ちの証拠の標目、これを被告人の側に"}, {"t": 1588.4, "x": "開示をするということになりますと、\nそこに詳細なものを、"}, {"t": 1591.65, "x": "仮にどういう内容のものと概括的にでも書けば、\nこれは全部開示したことと同じになってしまいます」"}, {"t": 1597.6833333333334, "x": "「そうなりますと、結局は抽象的な特定をする、"}, {"t": 1600.7333333333333, "x": "供述調書とかあるいは鑑定書、証拠物とか、\nそういうふうにならざるを得ないことになります」"}, {"t": 1606.2833333333333, "x": "「それを出したからといって何か\n特定ができるのかということになりますと、それは"}, {"t": 1610.2, "x": "余り意味がないことになります」"}, {"t": 1612.4, "x": "そして、この一行だ。"}, {"t": 1613.9666666666667, "x": "「したがいまして、リストを見せるという形は\nとりたくないというふうに思っております」"}, {"t": 1618.7333333333333, "x": "とりたくない。"}, {"t": 1619.75, "x": "二〇〇四年の答弁だ。"}, {"t": 1621.2333333333333, "x": "辻委員は、なお食い下がっている。"}, {"t": 1623.2166666666667, "x": "裁判所には見せる仕組みになっているのだから、\n弁護人に見せても支障はないはずだ、という主張だ。"}, {"t": 1629.0333333333333, "x": "「弁護側も早目にどういう手持ち証拠が\n検事側にあるのかということがわかれば、"}, {"t": 1633.3333333333333, "x": "改めて後から追加的に\n証拠請求するということはしなくても\n足りる場合があるわけですよ」"}, {"t": 1638.6333333333334, "x": "「そういう意味において、"}, {"t": 1639.7, "x": "検察官の手持ちの証拠の標目のリストを最終的には"}, {"t": 1643.4666666666667, "x": "裁判官に見せることがあり得る、\nそういう制度になっているんだから、"}, {"t": 1646.7333333333333, "x": "弁護人にあらかじめ見せることにしたって\n何ら支障が生じないんじゃないですか」"}, {"t": 1651.1833333333334, "x": "この日は、平行線で終わっている。"}, {"t": 1653.9333333333334, "x": "では、いまの刑事訴訟法はどうなっているか。"}, {"t": 1656.5833333333333, "x": "三百十六条の十四という条文がある。"}, {"t": 1659.1666666666667, "x": "一項は、検察官が取調べを請求した証拠、\nつまり自分が使うつもりの証拠について、"}, {"t": 1664.6166666666666, "x": "被告人と弁護人に\n開示しなければならない、と定めている。"}, {"t": 1668.45, "x": "そこまでは、前からある考え方だ。"}, {"t": 1670.8, "x": "問題は二項だ。読む。"}, {"t": 1672.4, "x": "「検察官は、前項の規定による証拠の開示をした後、"}, {"t": 1675.8166666666666, "x": "被告人又は弁護人から請求があつたときは、\n速やかに、被告人又は弁護人に対し、"}, {"t": 1681.4666666666667, "x": "検察官が保管する\n証拠の一覧表の交付をしなければならない」"}, {"t": 1685.5666666666666, "x": "一覧表の交付？"}, {"t": 1686.9166666666667, "x": "ああ。"}, {"t": 1687.35, "x": "請求があれば、検察官が持っている\n証拠の一覧表を渡さなければならない。"}, {"t": 1691.9333333333334, "x": "しなければならない、だ。できる、ではない。"}, {"t": 1694.5333333333333, "x": "そして三項では、その一覧表に、証拠ごとに\n何を書かなければならないかまで決めている。"}, {"t": 1700.05, "x": "二〇〇四年に「とりたくない」と言われたものね。"}, {"t": 1703.0, "x": "そうだ。"}, {"t": 1703.6333333333334, "x": "あのとき退けられた提案が、いまは条文になっている。"}, {"t": 1706.9166666666667, "x": "この改正がいつ行われたかについては、私は\n法律の番号と公布の日を確認していない。"}, {"t": 1712.4166666666667, "x": "だから年は言わない。"}, {"t": 1713.7, "x": "言えるのは、いまの条文は\nこうなっている、ということだけだ。"}, {"t": 1717.05, "x": "ここで、この回の筋がつながる。"}, {"t": 1719.2, "x": "一九五八年、弁護人は「\n二百種類ばかりを見せておりません」と言った。"}, {"t": 1724.1833333333334, "x": "何があるか分からなければ、\n何を見せろとも言えなかった。"}, {"t": 1727.4833333333333, "x": "二〇〇四年、同じことが国会で言われた。"}, {"t": 1730.0666666666666, "x": "メモの存在が分からないんだから出てこない、と。"}, {"t": 1732.8666666666666, "x": "そしていま、請求すれば一覧表が渡される。"}, {"t": 1735.9, "x": "何があるかは、分かるようになった。"}, {"t": 1738.1666666666667, "x": "一枚の紙が九年間キャビネットの中にあった、\nあの事件から、そこまで来た。"}, {"t": 1743.0333333333333, "x": "ただし、一覧表を渡すことと、\n証拠そのものを渡すことは別だ。"}, {"t": 1747.25, "x": "そこから先の争いは、いまも続いている。"}, {"t": 1750.5333333333333, "x": "答えの出ていないことを三つ挙げる。"}, {"t": 1752.5666666666666, "x": "一つ目。あのメモは、\n隠されたのか、忘れられたのか。"}, {"t": 1756.1833333333334, "x": "法務省は「何も隠しておったというような\n筋合いではない」と答えている。"}, {"t": 1760.4833333333333, "x": "領置書は作ってあった。"}, {"t": 1761.8666666666666, "x": "訴訟関係人には分かっているはずだ、と。"}, {"t": 1764.5666666666666, "x": "一方で、福島地裁の決定は「\nまことに明朗を欠くものがあり」"}, {"t": 1768.4333333333334, "x": "「疑惑が極めて濃厚なるの感を\n禁じ得ない」と書いた。"}, {"t": 1771.85, "x": "そして、その請求は棄却されている。"}, {"t": 1774.4, "x": "どちらとも決まっていないのね。"}, {"t": 1776.3166666666666, "x": "ああ。だから私も決めない。"}, {"t": 1778.1, "x": "ただ、はっきりしていることが一つある。"}, {"t": 1780.5166666666667, "x": "隠したのか、忘れたのか、どちらであっても、\n結果は同じだったということだ。"}, {"t": 1785.2833333333333, "x": "出るべきものが出ず、人が十年勾留された。"}, {"t": 1788.1333333333334, "x": "故意があったかどうかで、\n失われた十年は変わらない。"}, {"t": 1791.2, "x": "だから、制度のほうを直すしかない。"}, {"t": 1793.4, "x": "二つ目。三人の乗務員の事件は、どうなったのか。"}, {"t": 1796.8166666666666, "x": "時効は一九六四年八月に完成した。"}, {"t": 1800.0333333333333, "x": "その半年前、刑事局長はこう答弁している。"}, {"t": 1803.1166666666666, "x": "「十数年前のものを八月何日の時効完成を前にして\n犯人をさがすというようなことは、これはもう事実上"}, {"t": 1809.4833333333333, "x": "不可能なことでございます」"}, {"t": 1811.0, "x": "ただし、同じ場所でこうも言っている。"}, {"t": 1813.1833333333334, "x": "「私の真意は、真犯人を追及し得る自体、"}, {"t": 1816.0, "x": "情勢でありますならば、\n真犯人を追及すべきであることは"}, {"t": 1819.7166666666667, "x": "法律の命ずるところでございまして、検察官が\nそれを拒否する理由はさらにないわけであります」"}, {"t": 1825.0666666666666, "x": "やる気がないわけではない、と。"}, {"t": 1826.95, "x": "だが、十五年たっていた。"}, {"t": 1828.7166666666667, "x": "捜査は、最初の一年に何をしたかで決まってしまう。"}, {"t": 1832.05, "x": "その一年を、この事件では別のことに使ってしまった。"}, {"t": 1835.5333333333333, "x": "三つ目。これがいちばん引っかかっている。"}, {"t": 1837.9666666666667, "x": "あの紙は、なぜ出てきたのか。"}, {"t": 1839.8666666666666, "x": "記者が見つけたからだ。"}, {"t": 1841.1833333333334, "x": "国会が騒いだからだ。"}, {"t": 1842.7833333333333, "x": "制度が働いたからではない。"}, {"t": 1844.5333333333333, "x": "検察官自身が、法廷で「結局騒がなければ返さない\n訳か」と聞かれて「それはそうですよ」と答えている。"}, {"t": 1851.6666666666667, "x": "騒がれなければ。"}, {"t": 1852.9166666666667, "x": "世の中の関心が薄い事件だったら、どうなっていたか。"}, {"t": 1856.3166666666666, "x": "その問いには、いまも答えが無い。"}, {"t": 1859.0, "x": "最後に、この回で言わなかったことを言っておく。"}, {"t": 1861.75, "x": "真犯人については、何も言わなかった。"}, {"t": 1864.3333333333333, "x": "説はいくつもある。国会にも\n出てくる。だが一切扱わなかった。"}, {"t": 1868.4, "x": "分かっていないからだ。"}, {"t": 1869.85, "x": "分かっていないから。"}, {"t": 1871.1833333333334, "x": "そして、被告とされた方々について、\n疑うような言い方も一度もしなかった。"}, {"t": 1876.1, "x": "全員の無罪が確定している。それだけで十分だ。"}, {"t": 1879.2833333333333, "x": "この回で並べたのは、記録に残っている事実だけだ。"}, {"t": 1882.65, "x": "一九四九年八月十七日、列車が\n転覆して、乗務員三人が亡くなった。"}, {"t": 1888.4666666666667, "x": "一審で有罪。二審でも有罪。"}, {"t": 1890.4, "x": "死刑の求刑もあった。"}, {"t": 1891.9833333333333, "x": "被告とされた人たちは、判決が\n確定しないまま十年勾留された。"}, {"t": 1896.4166666666667, "x": "その間、アリバイを示す一枚のメモは、仙台、\n盛岡、釜石、福島、東京と動いていた。"}, {"t": 1902.65, "x": "転任する副検事のキャビネットに入ったまま、\n事件と関係のない土地へ移った。"}, {"t": 1907.55, "x": "弁護人が請求しても、係属中だからと断られた。"}, {"t": 1911.05, "x": "新聞が書き、国会が追及したら、\n書いた本人に返された。"}, {"t": 1915.05, "x": "それが弁護人の手に渡って、一九五九年八月十日、\n最高裁大法廷が原判決を破棄した。"}, {"t": 1921.85, "x": "一九六一年、差戻審で全員無罪。"}, {"t": 1925.1833333333334, "x": "一九六三年九月十二日、上告が棄却されて確定。"}, {"t": 1929.55, "x": "一九六四年八月、時効が完成した。"}, {"t": 1933.0333333333333, "x": "十五年。"}, {"t": 1933.8833333333334, "x": "法務大臣は「この判決から多くの教訓をくみ取り、\n今後の検察の運営に資したい」と言った。"}, {"t": 1939.85, "x": "警察庁の局長は「反省すべき点は反省する、\n改めるべきところは改めにやならぬ」と言った。"}, {"t": 1946.15, "x": "それから四十年後の二〇〇四年、\n国会でまたこの事件の名前が出て、"}, {"t": 1950.2333333333333, "x": "証拠の一覧表を見せるべきかどうかが議論された。"}, {"t": 1953.3666666666666, "x": "そのときは「とりたくない」で終わった。"}, {"t": 1955.7333333333333, "x": "そしていま、条文にはこう書いてある。"}, {"t": 1958.0333333333333, "x": "請求があったときは、速やかに、検察官が保管する\n証拠の一覧表の交付をしなければならない。"}, {"t": 1964.1, "x": "一枚の紙が、そこまで動かした。"}, {"t": 1966.4333333333334, "x": "ただ、その紙が出てくるまでに\n十年かかったことは、変わらない。"}, {"t": 1970.2833333333333, "x": "今回の内容は、国会会議録と、\n裁判所の裁判例検索と、\n法令の条文だけを根拠にした。"}, {"t": 1976.6333333333334, "x": "出典は概要欄に置いておく。"}, {"t": 1978.5166666666667, "x": "最後まで見てくれて、ありがとうな。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
