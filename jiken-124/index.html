<script>
const D={"name": "124", "file": "124_編集用", "dur": 2105.8333125, "segs": [], "subs": [{"t": 0.0, "x": "1971年12月18日。東京都豊島区。"}, {"t": 4.0, "x": "年の暮れの土曜日、ある家に荷物がまとめて届いた。"}, {"t": 7.233333333333333, "x": "その日に届いた小包などは、9個あった。"}, {"t": 10.1, "x": "9個も？"}, {"t": 10.966666666666667, "x": "12月の半ばだ。贈り物が重なる時期だな。"}, {"t": 14.1, "x": "昼前、家の人が居間でその荷物を片付けていた。"}, {"t": 17.366666666666667, "x": "そのうちの一つが突然爆発した。"}, {"t": 19.95, "x": "えっ……荷物が？"}, {"t": 21.266666666666666, "x": "荷物の中に爆弾が仕込まれていた。"}, {"t": 23.6, "x": "この家に住んでいたのは警視庁の幹部だ。"}, {"t": 26.066666666666666, "x": "警務部長という役職の、土田国保だった。"}, {"t": 29.083333333333332, "x": "爆発で部長の妻が亡くなった。"}, {"t": 31.25, "x": "13歳の四男が大けがを負った。"}, {"t": 33.56666666666667, "x": "……ひどい。"}, {"t": 34.25, "x": "誰がこの小包を送ったのか。"}, {"t": 36.233333333333334, "x": "その答えは今も分かっていない。"}, {"t": 38.1, "x": "時効はとうに過ぎた。"}, {"t": 39.3, "x": "未解決のまま終わった事件だ。"}, {"t": 41.45, "x": "誰も捕まらなかったの？"}, {"t": 43.18333333333333, "x": "捕まった人はいた。裁判にもなった。"}, {"t": 45.733333333333334, "x": "だが裁判は、送った人を見つけられなかった。"}, {"t": 48.75, "x": "どういうこと？"}, {"t": 49.766666666666666, "x": "そこを順に追っていく。"}, {"t": 51.13333333333333, "x": "今回は国会の記録を中心に読んでいく。"}, {"t": 53.78333333333333, "x": "事件の3日後から28年後までの、\n20人あまりの言葉だ。"}, {"t": 57.8, "x": "警察がどう動き、裁判が何を確かめたのか。"}, {"t": 60.9, "x": "そして何が確かめられないまま残ったのか。"}, {"t": 63.75, "x": "残ったもの……。"}, {"t": 64.81666666666666, "x": "それを一つずつ記録で確かめていく。"}, {"t": 67.83333333333333, "x": "事件の3日後、国会で報告があった。"}, {"t": 70.46666666666667, "x": "参議院の地方行政委員会だ。"}, {"t": 72.5, "x": "報告したのは、警察を受け持つ\n国家公安委員長だった。"}, {"t": 76.23333333333333, "x": "どんな報告？"}, {"t": 77.38333333333334, "x": "起きたのは、12月18日の午前11時20分ごろ。"}, {"t": 81.16666666666667, "x": "場所は豊島区雑司ケ谷一丁目の、警務部長の自宅だ。"}, {"t": 84.65, "x": "妻は47歳。四男は学習院中等部の2年生で13歳。"}, {"t": 88.98333333333333, "x": "二人は階下の居間で、\n小包などの荷物を整理していた。"}, {"t": 92.48333333333333, "x": "そこで荷物の一部が爆発した。"}, {"t": 94.81666666666666, "x": "二人で開けてたのね。"}, {"t": 96.3, "x": "妻はその場で亡くなった。"}, {"t": 97.91666666666667, "x": "四男は全治3週間のけがと報告されている。"}, {"t": 100.91666666666667, "x": "亡くなった人とけがをした\n子の名前は、この回では出さない。"}, {"t": 104.45, "x": "居間の床板は、約30センチ四方が抜け落ちた。"}, {"t": 107.68333333333334, "x": "家具や窓ガラスも壊れていた。"}, {"t": 109.68333333333334, "x": "床に穴が開くほど……。"}, {"t": 111.11666666666666, "x": "これが普通の家の居間で起きた。"}, {"t": 112.98333333333333, "x": "報告の最後には、こういう一言も添えられていた。"}, {"t": 116.13333333333334, "x": "被害者のご冥福をお祈りすると。"}, {"t": 118.33333333333333, "x": "警察のトップが国会でね。"}, {"t": 120.33333333333333, "x": "そうだ。身内の家が狙われた事件だった。"}, {"t": 122.96666666666667, "x": "ただ、この事件は一つだけで起きたわけではない。"}, {"t": 125.91666666666667, "x": "2か月前、同じような小包がもう一つ爆発していた。"}, {"t": 130.26666666666668, "x": "1971年10月18日。"}, {"t": 132.86666666666667, "x": "場所は港区西新橋だ。"}, {"t": 134.78333333333333, "x": "日本石油の本社ビルの地下に、郵便局があった。"}, {"t": 138.01666666666668, "x": "芝郵便局の分室で、日石分室と呼ばれていた。"}, {"t": 141.65, "x": "日石って日本石油の略ね。"}, {"t": 143.81666666666666, "x": "そうだ。そこに小包が持ち込まれた。"}, {"t": 146.25, "x": "あて先は二つ。"}, {"t": 147.41666666666666, "x": "警察庁長官と、成田の新しい\n空港を造る公団の総裁だ。"}, {"t": 151.75, "x": "偉い人あてね。"}, {"t": 152.98333333333332, "x": "その小包が郵便局の中で爆発した。"}, {"t": 155.81666666666666, "x": "郵便局員が一人けがをした。"}, {"t": 157.98333333333332, "x": "あて先の人じゃなくて局員さんが？"}, {"t": 160.35, "x": "国会では「郵便局員の方が負傷」と報告されている。"}, {"t": 164.11666666666667, "x": "荷物を扱っていただけの人がけがをした。"}, {"t": 166.78333333333333, "x": "これが「日石事件」と呼ばれる爆発だ。"}, {"t": 169.7, "x": "じゃあ土田邸の事件は2つ目なの？"}, {"t": 172.03333333333333, "x": "小包の爆発としては、そう数えられている。"}, {"t": 174.95, "x": "1995年に郵政大臣が国会でこう答えた。"}, {"t": 178.56666666666666, "x": "この25年で最初の小包の爆発は、\n日石の局内だったと。"}, {"t": 182.93333333333334, "x": "そこから合わせて7件。"}, {"t": 184.46666666666667, "x": "亡くなった人は、そのうち1人だけだった。"}, {"t": 187.33333333333334, "x": "その1人が……。"}, {"t": 188.46666666666667, "x": "12月の警務部長の家だ。"}, {"t": 190.36666666666667, "x": "事件の3日後、日石のほうの捜査も報告されている。"}, {"t": 193.86666666666667, "x": "犯人はまだ捕まっていない。"}, {"t": 195.65, "x": "女2人のモンタージュを作り、全国で捜していた。"}, {"t": 199.0, "x": "顔の絵まであったのね。"}, {"t": 200.51666666666668, "x": "あった。それでも送った人には届かなかった。"}, {"t": 203.98333333333332, "x": "当時ってそんなに爆弾が多かったの？"}, {"t": 206.4, "x": "多かった。同じ日の国会で数字が出ている。"}, {"t": 209.18333333333334, "x": "その年の6月17日から12月までの半年だ。"}, {"t": 212.75, "x": "実際に爆発した爆弾は34件、39個あった。"}, {"t": 216.78333333333333, "x": "半年で34件！"}, {"t": 218.45, "x": "明治公園では警察官に爆弾が投げ込まれた。"}, {"t": 221.43333333333334, "x": "警察官37人がけがをしている。"}, {"t": 223.93333333333334, "x": "警視総監の公舎には時限爆弾が仕掛けられた。"}, {"t": 227.01666666666668, "x": "これは爆発しなかったが、\n玄関の脇まで運ばれていた。"}, {"t": 230.7, "x": "警察が次々に狙われてたのね。"}, {"t": 233.1, "x": "12月の時点で、けが人は合わせて40人と報告された。"}, {"t": 236.93333333333334, "x": "そこに亡くなった人が一人加わった。"}, {"t": 239.33333333333334, "x": "土田邸の事件は、その流れの中で起きている。"}, {"t": 242.48333333333332, "x": "じゃあすぐに犯人の見当はついたの？"}, {"t": 244.81666666666666, "x": "警察の警備局長は、ある過激派グループを疑った。"}, {"t": 248.26666666666668, "x": "そのグループの機関紙に\n「報復」という言葉があったからだ。"}, {"t": 251.93333333333334, "x": "ただ局長はこうも言っている。"}, {"t": 253.66666666666666, "x": "これに限らず、広く捜査の手を伸ばす、と。"}, {"t": 256.5833333333333, "x": "決めつけてはいなかったと。"}, {"t": 258.31666666666666, "x": "この時点では、少なくとも国会でそう言っている。"}, {"t": 261.3333333333333, "x": "この「最初の見立て」は、あとで大事になる。"}, {"t": 264.3, "x": "裁判がいちばん厳しく問うたのが、まさにそこだった。"}, {"t": 268.21666666666664, "x": "街の人たちはどう感じてたの？"}, {"t": 270.3833333333333, "x": "事件の3日後の委員会で、ある議員が話している。"}, {"t": 273.5, "x": "多くの都民から電話や直接の訴えが来ていると。"}, {"t": 276.56666666666666, "x": "爆弾や火炎びんがこんなに使われている。"}, {"t": 279.03333333333336, "x": "取り締まりはどうなっているのかという声だ。"}, {"t": 281.48333333333335, "x": "怒られてたのね。"}, {"t": 282.73333333333335, "x": "議員は「お叱りに近い」と言っている。"}, {"t": 285.1333333333333, "x": "このままでは市民として不安でしようがない、と。"}, {"t": 287.8666666666667, "x": "この議員は、かつて警察の仕事をしていた人だ。"}, {"t": 291.0, "x": "その人が今の状況を「異常な状態」とまで言った。"}, {"t": 294.4166666666667, "x": "火炎びんも多かったの？"}, {"t": 295.93333333333334, "x": "警備局長が数字を出している。"}, {"t": 297.9, "x": "1968年から1971年11月末までの数字だ。"}, {"t": 302.8, "x": "使われたと見られる火炎びんは1万2千本。"}, {"t": 305.5, "x": "押収したものは約1万7千本あった。"}, {"t": 308.25, "x": "使った数より押収した数のほうが多いのね。"}, {"t": 311.1333333333333, "x": "それだけの数が作られていたということだ。"}, {"t": 313.6333333333333, "x": "だが当時は火炎びんを持ち歩くだけでは\n取り締まりにくかった。"}, {"t": 317.06666666666666, "x": "局長はその状態を「もどかしい」と言っている。"}, {"t": 319.96666666666664, "x": "そして罰則を整えてほしいと国会に求めた。"}, {"t": 323.1333333333333, "x": "小包の事件のすぐあとに、法律の話が出てたのね。"}, {"t": 326.78333333333336, "x": "同じ日の同じ委員会での話だ。"}, {"t": 329.5833333333333, "x": "では爆弾は何でできていたのか。"}, {"t": 331.6, "x": "現場からは、起爆の仕掛けも時計も見つからなかった。"}, {"t": 335.05, "x": "粉々になっちゃったの？"}, {"t": 336.6666666666667, "x": "それに近い。見つかったのはアルミの破片だった。"}, {"t": 339.56666666666666, "x": "警察は爆発の音と煙から、薬品の見当をつけた。"}, {"t": 343.3666666666667, "x": "塩素酸ナトリウムを使ったものだろう、と。"}, {"t": 345.9166666666667, "x": "仕掛けも推測で語られている。"}, {"t": 347.93333333333334, "x": "ひもか包み紙を開くと、爆発するものだと。"}, {"t": 351.1666666666667, "x": "開けた人が狙われる作りなのね。"}, {"t": 353.4166666666667, "x": "そういうことになる。"}, {"t": 354.6, "x": "同じ日に、警察庁の保安部長がこう答えた。"}, {"t": 357.6, "x": "手製の爆弾の材料は簡単に手に入る。"}, {"t": 360.25, "x": "販売店で住所と名前を書けば買える。"}, {"t": 362.6, "x": "三文判を押せば売ってくれると。"}, {"t": 364.6333333333333, "x": "三文判で？"}, {"t": 365.73333333333335, "x": "そうだ。持ち歩くことにも決まりが無かった。"}, {"t": 368.4166666666667, "x": "部長は、ここ数日のうちに\n規制案をまとめたいと言った。"}, {"t": 371.96666666666664, "x": "事件が起きてから慌てて、って感じね。"}, {"t": 374.51666666666665, "x": "ほかにも国会では、別の手当ての話が出ていた。"}, {"t": 377.6666666666667, "x": "国家公安委員長はこう言った。"}, {"t": 379.55, "x": "夫が警察官だから起きた事件だ。"}, {"t": 381.93333333333334, "x": "その家族を助ける仕組みが要るのではないか、と。"}, {"t": 384.95, "x": "家族まで狙われる時代だったのね。"}, {"t": 387.21666666666664, "x": "国会の言葉では、狙われたのは「家庭」だった。"}, {"t": 391.1333333333333, "x": "捜査はすぐに大きな体制で始まった。"}, {"t": 393.5833333333333, "x": "目白警察署に、特別捜査本部が置かれた。"}, {"t": 396.65, "x": "本部長は警視庁の公安部長だ。"}, {"t": 398.85, "x": "集められた捜査員は134人だった。"}, {"t": 401.65, "x": "134人！"}, {"t": 402.9, "x": "手がかりの一つが、現場に残った荷札だ。"}, {"t": 405.73333333333335, "x": "送り主の欄には、ある官庁の幹部の名前があった。"}, {"t": 409.1166666666667, "x": "その人が送ったの？"}, {"t": 410.6166666666667, "x": "違う。本人には送った事実が無かった。"}, {"t": 413.31666666666666, "x": "名前を勝手に使われていたわけだ。"}, {"t": 415.6, "x": "ひどい話ね……。"}, {"t": 416.8, "x": "だから、この回ではその名前も出さない。"}, {"t": 419.28333333333336, "x": "もう一つの手がかりが、9個の荷物だ。"}, {"t": 421.8666666666667, "x": "その日に配られた小包などが9個あった。"}, {"t": 424.51666666666665, "x": "誰が送ったのか、中身は何だったのか。"}, {"t": 427.18333333333334, "x": "1個ずつ確かめていく、と報告されている。"}, {"t": 430.05, "x": "最初の9個に戻ってきたわね。"}, {"t": 432.21666666666664, "x": "そうだ。爆発したのはそのうちの一つだった。"}, {"t": 435.3, "x": "……どれが危ないかなんて、分からないわよね。"}, {"t": 437.85, "x": "届いた荷物を片付けるのは、ありふれた家の仕事だ。"}, {"t": 441.15, "x": "仕掛けはその手が開けるのを待っていた。"}, {"t": 443.93333333333334, "x": "134人もいて、どうして見つからなかったの？"}, {"t": 447.1666666666667, "x": "事件の3日後に、警備局長がその難しさを話している。"}, {"t": 450.9166666666667, "x": "ふつうの事件なら、被害者と\n犯人に面識があることが多い。"}, {"t": 454.6166666666667, "x": "近所で聞き込みをすれば手がかりが出てくる。"}, {"t": 457.23333333333335, "x": "知り合いの中から探せるのね。"}, {"t": 459.23333333333335, "x": "だがこの種の事件では、被害者と犯人に面識が無い。"}, {"t": 462.75, "x": "送られてきた小包だけが二人をつないでいる。"}, {"t": 465.5833333333333, "x": "顔も知らない相手なのね。"}, {"t": 467.3, "x": "局長はもう一つ、都会の事情も挙げた。"}, {"t": 470.01666666666665, "x": "大きな街では隣に誰が住んでいるか分からない。"}, {"t": 472.8666666666667, "x": "周りへの関心が薄れているという話だ。"}, {"t": 475.55, "x": "アパートの隣の人の顔も知らない、みたいな？"}, {"t": 478.56666666666666, "x": "そういうことだろうな。"}, {"t": 479.81666666666666, "x": "局長はだから時間がかかると認めた。"}, {"t": 482.28333333333336, "x": "別の爆弾の事件でも解決に半年かかったと言っている。"}, {"t": 485.9166666666667, "x": "時間をかけてでも一つ一つつぶしていく。"}, {"t": 488.55, "x": "これがそのときの警察の言葉だった。"}, {"t": 491.06666666666666, "x": "一つ一つね。"}, {"t": 492.35, "x": "この「時間がかかる」という\n言葉を覚えておいてほしい。"}, {"t": 495.5833333333333, "x": "のちにこの事件は、時間に追い越されることになる。"}, {"t": 499.23333333333335, "x": "部長さん本人はどうしてたの？"}, {"t": 501.25, "x": "事件のあと記者会見を開いている。"}, {"t": 503.48333333333335, "x": "同じ委員会で、ある議員がそのことに触れた。"}, {"t": 506.18333333333334, "x": "家族の大きな犠牲があったにもかかわらず。"}, {"t": 508.68333333333334, "x": "職責の完遂に向かって進むと決意を述べた、と。"}, {"t": 512.1166666666667, "x": "妻を亡くした直後に？"}, {"t": 513.7333333333333, "x": "直後にだ。議員は「深く敬意を表する」と言った。"}, {"t": 517.0333333333333, "x": "警察庁の警備局長も、こう話している。"}, {"t": 519.85, "x": "家庭に、しかも夫人に対して、\nああいう結果を生んだ。"}, {"t": 523.15, "x": "卑劣な行為だと。"}, {"t": 524.5, "x": "身内の人は、どんな気持ちだったんでしょうね。"}, {"t": 527.3166666666667, "x": "局長は「心中複雑」という言い方をした。"}, {"t": 530.3833333333333, "x": "ただ、狙われるのは\n幹部の家だけではないとも言った。"}, {"t": 533.4833333333333, "x": "数の多い現場の警察官の家族も\n守らなければならない。"}, {"t": 536.9833333333333, "x": "そう続けている。"}, {"t": 538.2166666666667, "x": "それで部長さんはその後も警察に？"}, {"t": 540.5, "x": "残った。人名事典によれば、のちに警視総監になる。"}, {"t": 544.15, "x": "1975年のことだ。"}, {"t": 546.25, "x": "その後、1978年から防衛大学校の校長を務めた。"}, {"t": 550.7666666666667, "x": "事件のあとも、ずっと公の仕事をしてたのね。"}, {"t": 553.8833333333333, "x": "そうだ。この人は1983年に、\nもう一度だけ記録に出てくる。"}, {"t": 558.5666666666667, "x": "判決のニュースを聞いたときの言葉だ。"}, {"t": 560.8833333333333, "x": "それは裁判の話のところで紹介する。"}, {"t": 564.0666666666667, "x": "事件の3日後の委員会で、ある議員がこう問うている。"}, {"t": 567.2, "x": "やるなら、なぜ第一級の政治家を狙わないのか。"}, {"t": 570.3333333333334, "x": "えっ、そういう聞き方？"}, {"t": 572.0166666666667, "x": "議員の言いたいことはこうだ。"}, {"t": 573.6166666666667, "x": "仕事として治安を受け持つ\n幹部の、しかも家庭が狙われた。"}, {"t": 577.3, "x": "本来なら狙われるはずのない人が狙われている。"}, {"t": 580.1833333333333, "x": "戦前の事件とはまったく違う、と議員は感じたそうだ。"}, {"t": 583.7333333333333, "x": "家にいる家族は、何の仕事もしてないものね。"}, {"t": 586.7333333333333, "x": "そうだ。だから対策も難しくなる。"}, {"t": 589.1666666666666, "x": "国家公安委員長は、駐在所の話を持ち出した。"}, {"t": 592.5333333333333, "x": "駐在所って、おまわりさんが家族と住んでるところ？"}, {"t": 595.75, "x": "そうだ。その家族がかなり心配していると言った。"}, {"t": 598.7833333333333, "x": "駐在所の守りはきわめて不十分だとも認めている。"}, {"t": 601.95, "x": "人を増やして、2人以上で守らせたい。"}, {"t": 604.4666666666667, "x": "本署に助けを呼べる連絡の道具も整えたい、と。"}, {"t": 607.75, "x": "電話じゃだめなの？"}, {"t": 609.0, "x": "大臣はそこを正直に認めている。"}, {"t": 611.2, "x": "電話で連絡する余裕の無いときに、事故は起きる。"}, {"t": 614.3, "x": "……たしかにそうね。"}, {"t": 615.5166666666667, "x": "一つの小包が、全国の駐在所の話にまで広がった。"}, {"t": 620.0833333333334, "x": "土田邸の事件から、まだ1週間もたっていない。"}, {"t": 623.1833333333333, "x": "クリスマスの前の日に、新宿で爆弾が爆発した。"}, {"t": 626.7666666666667, "x": "また？"}, {"t": 627.4166666666666, "x": "また、だ。警察の派出所を狙った爆弾だった。"}, {"t": 630.7, "x": "のちに国会では「クリスマスツリー爆弾」と\n呼ばれている。"}, {"t": 634.25, "x": "ツリーの形をしてたってこと？"}, {"t": 636.2666666666667, "x": "呼び名の由来まで国会の記録には書かれていない。"}, {"t": 639.15, "x": "だから形の話はここではしない。"}, {"t": 641.4, "x": "はっきりしているのは被害のほうだ。"}, {"t": 643.4333333333333, "x": "一般の人と警察官がけがをしたと報告されている。"}, {"t": 646.9333333333333, "x": "街の真ん中で……。"}, {"t": 648.2166666666667, "x": "12月18日と、クリスマスの前の日。"}, {"t": 651.1166666666667, "x": "わずか6日の間に、二つの爆弾が人を傷つけた。"}, {"t": 654.6333333333333, "x": "1983年の国会で、警備局長は\nこの年をこう振り返った。"}, {"t": 659.2833333333333, "x": "悪質で残忍な爆弾事件が多発した年だった、と。"}, {"t": 662.9833333333333, "x": "その中で、土田邸の事件も追われてたのね。"}, {"t": 665.9666666666667, "x": "そうだ。捜査員はいくつもの事件を同時に抱えていた。"}, {"t": 669.3166666666667, "x": "一つの事件だけを見ていられる年ではなかった。"}, {"t": 672.75, "x": "年が明けて1972年になった。"}, {"t": 675.4666666666667, "x": "3月の国会でも、この事件の名前が出ている。"}, {"t": 678.5333333333333, "x": "ある議員が逮捕の見通しを尋ねた。"}, {"t": 680.8166666666667, "x": "まだ捕まってなかったのね。"}, {"t": 682.6833333333333, "x": "まだだった。警察は別の方法も取っていた。"}, {"t": 685.5666666666667, "x": "アパートの管理人や不動産屋に協力を頼んだ。"}, {"t": 688.4833333333333, "x": "爆弾を作っていそうな部屋を洗い出すためだ。"}, {"t": 691.3333333333334, "x": "一軒ずつ見て回るってこと？"}, {"t": 693.2666666666667, "x": "国会の答弁では「相当の量」と言っている。"}, {"t": 696.1833333333333, "x": "主な所の状況は、ひととおりつかんだとも言った。"}, {"t": 699.4666666666667, "x": "そこまでしても、手がかりは出なかったの？"}, {"t": 702.05, "x": "国会の記録からは、まだ決め手は見えてこない。"}, {"t": 704.9333333333333, "x": "捜査が大きく動くのは、1973年の1月だ。"}, {"t": 708.7833333333333, "x": "ある議員の調べでは、最初の逮捕が1973年1月。"}, {"t": 713.0166666666667, "x": "最後の起訴が同じ年の5月だった。"}, {"t": 715.5166666666667, "x": "4か月の間に何人も？"}, {"t": 717.4666666666667, "x": "何人もだ。ここで一つ決めておく。"}, {"t": 719.8, "x": "起訴された人たちの名前は、\nこの回では一人も出さない。"}, {"t": 723.3, "x": "全員の無罪が確定しているからだ。"}, {"t": 725.7, "x": "無罪の人の名前は出さないのね。"}, {"t": 727.9166666666666, "x": "そうだ。もう一つ、数え方にも注意がいる。"}, {"t": 730.8, "x": "逮捕と起訴の人数は、資料によって数えが違う。"}, {"t": 733.9166666666666, "x": "だからこの回では総数は言わない。"}, {"t": 735.9333333333333, "x": "国会の記録で確かめられた数字だけを使う。"}, {"t": 738.9166666666666, "x": "たとえば？"}, {"t": 739.75, "x": "のちの判決で、同じ法廷にまとめられた被告は9人。"}, {"t": 743.3333333333334, "x": "それとは別の法廷で裁かれた被告が1人いる。"}, {"t": 746.3, "x": "この2つの法廷が、あとで\n別々に判決を出すことになる。"}, {"t": 750.7166666666667, "x": "逮捕って爆弾の容疑でいきなり？"}, {"t": 752.8833333333333, "x": "そこが問題になった。"}, {"t": 754.3666666666667, "x": "1983年の国会で、ある議員がこう指摘している。"}, {"t": 758.3333333333334, "x": "別の法廷で裁かれたその1人の話だ。"}, {"t": 761.1166666666667, "x": "最初の逮捕は、爆弾の容疑ではなかった。"}, {"t": 764.0, "x": "じゃあ何の容疑？"}, {"t": 765.1333333333333, "x": "別の被告の引っ越しを手伝った。"}, {"t": 767.3333333333334, "x": "それが犯人を隠した罪にあたる、という容疑だった。"}, {"t": 770.6833333333333, "x": "引っ越しの手伝いで逮捕されるの？"}, {"t": 772.8666666666667, "x": "議員はこれを「別件逮捕」と呼んだ。"}, {"t": 775.3166666666667, "x": "小さな容疑で身柄を押さえる。"}, {"t": 777.0833333333334, "x": "その間に本当に調べたい事件を聞く。"}, {"t": 779.6166666666667, "x": "そういうやり方だ。"}, {"t": 780.9333333333333, "x": "それって許されるの？"}, {"t": 782.3666666666667, "x": "議員自身がこう言っている。"}, {"t": 783.9333333333333, "x": "法律の上では、はっきり違法とはされていない。"}, {"t": 786.6666666666666, "x": "だが日常茶飯事に使ってよいのか、と。"}, {"t": 789.4166666666666, "x": "その引っ越しの件はどうなったの？"}, {"t": 791.5166666666667, "x": "処分保留で、起訴されていないと議員は言った。"}, {"t": 794.2833333333333, "x": "入り口の容疑は、裁かれないまま終わった。"}, {"t": 796.8833333333333, "x": "残ったのは、その間に取られた調書のほうだった。"}, {"t": 800.1, "x": "調書って取り調べの記録よね。"}, {"t": 802.2, "x": "そうだ。この事件の裁判は、\nほとんどがその調書の争いになる。"}, {"t": 806.8666666666667, "x": "その1人について、警察庁の警備局長が\n日付を答えている。"}, {"t": 810.8833333333333, "x": "逮捕は1973年3月19日。"}, {"t": 813.9333333333333, "x": "起訴は5月2日。"}, {"t": 815.2666666666667, "x": "拘置所へ移されたのは、6月8日だった。"}, {"t": 818.1666666666666, "x": "起訴のあとも、1か月以上？"}, {"t": 820.2, "x": "起訴から37日だ。その間は警察の留置場にいた。"}, {"t": 824.15, "x": "それって普通なの？"}, {"t": 825.5, "x": "議員は「普通じゃないのか」と迫っている。"}, {"t": 828.1, "x": "起訴されたら、その日のうちに拘置所へ移すものだと。"}, {"t": 831.4833333333333, "x": "留置場と拘置所って、どう違うの？"}, {"t": 833.9333333333333, "x": "留置場は警察の建物の中にある。"}, {"t": 836.3666666666667, "x": "取り調べる側が、一日じゅう身柄を見ている場所だ。"}, {"t": 839.5, "x": "議員はこれを「自白の温床」と呼んだ。"}, {"t": 842.15, "x": "温床……。"}, {"t": 842.8833333333333, "x": "議員が調べた範囲では、もっと長い例もあった。"}, {"t": 845.8, "x": "起訴のあと10か月、留置場にいた人がいたという。"}, {"t": 848.9666666666667, "x": "これは議員の調べで、政府は数字を答えていない。"}, {"t": 851.9166666666666, "x": "だからここでは、議員がそう言ったとだけ置いておく。"}, {"t": 854.9333333333333, "x": "数字の出どころは分けるのね。"}, {"t": 856.8, "x": "分ける。この回は、そこを混ぜないことにしている。"}, {"t": 860.4333333333333, "x": "もう一つ、議員が取り上げたのが弁護士との面会だ。"}, {"t": 863.8166666666667, "x": "面会は自由じゃないの？"}, {"t": 865.3833333333333, "x": "建前では、捜査に差し支えなければ認める。"}, {"t": 868.3166666666667, "x": "だが議員によると実際はこうだった。"}, {"t": 870.4666666666667, "x": "大体1週間に1回。それも15分きり。"}, {"t": 873.4166666666666, "x": "1週間に15分！"}, {"t": 874.8833333333333, "x": "議員はもう一つの数字も出した。"}, {"t": 876.9666666666667, "x": "同じ法廷の被告のうち、\n自白をしていない人が2人いる。"}, {"t": 880.6166666666667, "x": "その2人には、3、4日に1回は\n弁護士が会っていたという。"}, {"t": 884.2666666666667, "x": "会えた回数と、自白しなかったことが重なってるのね。"}, {"t": 887.7833333333333, "x": "議員自身は「偶然かどうか知りませんが」と\n前置きしている。"}, {"t": 891.4166666666666, "x": "だからここでも、それ以上は言わない。"}, {"t": 893.6, "x": "1988年には、ある弁護士が国会で話した。"}, {"t": 897.4333333333333, "x": "取り調べは連日、朝から夜まで続いたと。"}, {"t": 900.3, "x": "弁護士が会えるのは、15分か20分。"}, {"t": 902.8333333333334, "x": "それも3日に1回か、1週間に1回だったと。"}, {"t": 906.1333333333333, "x": "それじゃ相談もろくにできないわね。"}, {"t": 908.3, "x": "こうした事件の被告から\n「全然役に立たぬ」と聞いたと話した。"}, {"t": 912.5, "x": "心のつながりが作れない、とも言っている。"}, {"t": 915.2, "x": "……閉じた部屋の中の話なのね。"}, {"t": 917.3666666666667, "x": "そうだ。外から確かめる方法が、当時は無かった。"}, {"t": 921.3666666666667, "x": "お金が無い人は弁護士を頼めないの？"}, {"t": 923.8333333333334, "x": "1988年の国会で、まさにその話が出ている。"}, {"t": 927.8333333333334, "x": "話したのはさっきの弁護士だ。"}, {"t": 929.7333333333333, "x": "当時は、捜査の段階で国選の弁護人がつかなかった。"}, {"t": 933.4666666666667, "x": "国選って、国がつけてくれる弁護士ね。"}, {"t": 936.2333333333333, "x": "そうだ。それがつくのは、起訴されたあとだった。"}, {"t": 939.15, "x": "自分や家族にお金のゆとりがあれば、自分で頼める。"}, {"t": 942.45, "x": "無ければ、取り調べの間は一人きりだ。"}, {"t": 945.1333333333333, "x": "いちばん大事なときに一人なのね。"}, {"t": 947.3666666666667, "x": "弁護士はこう言っている。"}, {"t": 948.7833333333333, "x": "捜査の段階でうその自白を作られると、\n法廷で覆すのは容易ではない。"}, {"t": 953.2833333333333, "x": "だから捜査の段階に国選の弁護人を、と。"}, {"t": 956.3333333333334, "x": "ほかには？"}, {"t": 957.1833333333333, "x": "取り調べに弁護人が立ち会うか、\n少なくともテープを取る。"}, {"t": 960.7, "x": "調べる役所と、身柄を預かる役所を分ける。"}, {"t": 963.5333333333333, "x": "検察は手持ちの証拠を全部、弁護側に見せる。"}, {"t": 966.7, "x": "今のやり方に近いものもあるわね。"}, {"t": 968.9833333333333, "x": "あとから形になったものもある。"}, {"t": 970.9333333333333, "x": "ただ、この事件の被告たちには間に合わなかった。"}, {"t": 974.5833333333334, "x": "起訴のあと裁判が始まった。"}, {"t": 976.4666666666667, "x": "この裁判はとても長くかかった。"}, {"t": 978.7, "x": "どのくらい？"}, {"t": 979.6, "x": "2011年に、弁護をした弁護士が\n国会で振り返っている。"}, {"t": 983.3666666666667, "x": "この事件の裁判は約9年かかったと。"}, {"t": 986.0666666666667, "x": "9年も！"}, {"t": 987.0166666666667, "x": "しかも、その法廷のほとんどが同じ作業だった。"}, {"t": 990.0166666666667, "x": "調書が無理やり取られたものかどうかの争いだ。"}, {"t": 992.85, "x": "どうやって争うの？"}, {"t": 994.25, "x": "調べた側と、調べられた側が、法廷で話す。"}, {"t": 997.4833333333333, "x": "どちらも相手と違うことを言う。"}, {"t": 999.3, "x": "弁護士は、それを「水かけ論」と言った。"}, {"t": 1002.15, "x": "部屋の中には、その二人しかいないものね。"}, {"t": 1004.9666666666667, "x": "録音も録画も無い時代だ。"}, {"t": 1006.7666666666667, "x": "弁護士は、これを今の制度の話につなげている。"}, {"t": 1009.7833333333333, "x": "取り調べに弁護士が立ち会えば、\n問題は基本的に解決する。"}, {"t": 1013.7, "x": "録音と録画は、それを補うものだ、と。"}, {"t": 1016.5, "x": "この事件の9年が、そこにつながってるのね。"}, {"t": 1019.5666666666667, "x": "本人がそう話している。"}, {"t": 1021.15, "x": "では、その9年で裁判所は何を見たのか。"}, {"t": 1023.9666666666667, "x": "まずは、検察が何を求めたかから見ておく。"}, {"t": 1027.4333333333334, "x": "検察の求めた刑は、とても重いものだった。"}, {"t": 1030.35, "x": "1983年の国会で、ある議員がこう言っている。"}, {"t": 1034.0166666666667, "x": "死刑を始めとする重い刑を、それぞれ求めていた。"}, {"t": 1037.2833333333333, "x": "死刑まで……。"}, {"t": 1038.2166666666667, "x": "人が亡くなった爆弾事件だ。"}, {"t": 1040.2333333333333, "x": "警察の幹部を狙い、その家族が犠牲になった。"}, {"t": 1043.3166666666666, "x": "議員は、警視庁が「威信をかけて」\n捜査したと言った。"}, {"t": 1047.0166666666667, "x": "絶対に負けられないってことね。"}, {"t": 1049.1, "x": "そういう事件だった。"}, {"t": 1050.4, "x": "ただ、裁判の材料には大きな偏りがあった。"}, {"t": 1053.3666666666666, "x": "判決の前日、別の議員がこう整理している。"}, {"t": 1056.3833333333334, "x": "一つ。物的な証拠がきわめて乏しい。"}, {"t": 1059.0333333333333, "x": "二つ。自白に偏った捜査が行われている。"}, {"t": 1062.1, "x": "三つ。その自白を裁判所が疑っている。"}, {"t": 1065.0, "x": "物が無くて自白しか無い。"}, {"t": 1066.8, "x": "警察側も、物証が乏しいことは認めていた。"}, {"t": 1069.8666666666666, "x": "爆弾は粉々に砕けて証拠が残らない。"}, {"t": 1072.55, "x": "だから自白に頼らざるを得ない、と説明している。"}, {"t": 1075.6833333333334, "x": "じゃあその自白が崩れたら……。"}, {"t": 1077.5, "x": "何も残らない。"}, {"t": 1078.6166666666666, "x": "それが1983年の春に、はっきり形になる。"}, {"t": 1083.0333333333333, "x": "最初の判決は、1983年3月24日だった。"}, {"t": 1087.3166666666666, "x": "別の法廷で裁かれていた、あの1人の判決だ。"}, {"t": 1090.55, "x": "東京地方裁判所の刑事6部が出した。"}, {"t": 1093.3, "x": "結果は？"}, {"t": 1094.15, "x": "無罪だった。"}, {"t": 1095.1833333333334, "x": "……無罪。"}, {"t": 1095.85, "x": "検察は控訴しなかった。そのまま無罪が確定した。"}, {"t": 1099.2833333333333, "x": "2日後の国会で、ある議員がこう言っている。"}, {"t": 1101.9666666666667, "x": "自白調書の信用性が全面的に否定された。"}, {"t": 1105.0666666666666, "x": "誘導の跡が歴然としていると。"}, {"t": 1107.2666666666667, "x": "誘導っていうのは？"}, {"t": 1108.5666666666666, "x": "調べる側が、答えを導くように聞くことだ。"}, {"t": 1111.4666666666667, "x": "本人の記憶ではなく、聞き手の筋書きが調書に入る。"}, {"t": 1115.05, "x": "それで警察はどう受け止めたの？"}, {"t": 1117.1, "x": "警察庁の警備局長は、こう答えている。"}, {"t": 1119.8333333333333, "x": "確信のある捜査をして、送検した事件だ。"}, {"t": 1122.75, "x": "そのうえで、判決の内容を十分に研究する、と。"}, {"t": 1126.2, "x": "認めてるのか認めてないのか……。"}, {"t": 1128.25, "x": "議員もそこを突いた。"}, {"t": 1129.5666666666666, "x": "裁判所の判断は、国の最終の判断として\n受け止めてくれと。"}, {"t": 1133.5666666666666, "x": "国家公安委員長は、判決は\n判決として受け止めると答えた。"}, {"t": 1138.2166666666667, "x": "ここで一つややこしい話をしておく。"}, {"t": 1140.5333333333333, "x": "裁判で調書を使うには、二つの関門がある。"}, {"t": 1143.65, "x": "二つ？"}, {"t": 1144.45, "x": "一つ目は「任意性」。"}, {"t": 1145.8333333333333, "x": "無理やり言わせていないか。"}, {"t": 1147.35, "x": "二つ目は「信用性」。"}, {"t": 1148.8166666666666, "x": "中身を信じてよいか。"}, {"t": 1150.4666666666667, "x": "無理やりじゃなくても、信用できないことはあるのね。"}, {"t": 1153.5166666666667, "x": "ある。3月の判決はまさにそれだった。"}, {"t": 1156.15, "x": "警備局長の説明ではこうだ。"}, {"t": 1158.15, "x": "3月の裁判官は、調書に任意性はあると判断した。"}, {"t": 1161.7166666666667, "x": "だが中身が信用できないとして、無罪にした。"}, {"t": 1164.8, "x": "じゃあもう一つの法廷は？"}, {"t": 1166.5, "x": "そっちはもっと手前で止めた。"}, {"t": 1168.3, "x": "多くの調書を、証拠として認めなかったんだ。"}, {"t": 1171.2666666666667, "x": "一つ目の関門で落ちたってこと？"}, {"t": 1173.5, "x": "そういうことになる。"}, {"t": 1174.7, "x": "判決の前の時点で、議員はこう言っていた。"}, {"t": 1177.45, "x": "自白調書の約3分の2が、\n証拠に採用されていない、と。"}, {"t": 1181.4166666666667, "x": "3分の2も……。"}, {"t": 1182.5666666666666, "x": "警察は、裁判官によって判断が違うと言った。"}, {"t": 1185.7833333333333, "x": "だから上の裁判所の判断を仰ぎたい、と。"}, {"t": 1188.4333333333334, "x": "ただ、どちらの判断でも結論は同じだった。"}, {"t": 1191.3333333333333, "x": "調書では罪は証明できない。"}, {"t": 1193.8166666666666, "x": "2つ目の判決は、1983年5月19日だった。"}, {"t": 1198.0833333333333, "x": "東京地方裁判所の刑事9部だ。"}, {"t": 1200.3, "x": "同じ法廷にまとめられていた9人の判決だった。"}, {"t": 1203.5666666666666, "x": "日石の事件もここで裁かれたのね。"}, {"t": 1206.0666666666666, "x": "そうだ。日石も土田邸も、\nほかの爆弾事件もまとめてだ。"}, {"t": 1210.0833333333333, "x": "翌日の国会で、ある議員がこう伝えている。"}, {"t": 1212.9333333333334, "x": "一連の爆弾事件の全部について、被告全員に無罪。"}, {"t": 1216.6666666666667, "x": "全員……。"}, {"t": 1217.3666666666666, "x": "議員は判決の理由をこうまとめた。"}, {"t": 1219.55, "x": "唯一の証拠と言える自白調書は、矛盾が多い。"}, {"t": 1222.55, "x": "誘導の跡があり信用できない。"}, {"t": 1224.45, "x": "だから犯罪の証明が無いと。"}, {"t": 1226.4666666666667, "x": "死刑を求められてた人たちよね。"}, {"t": 1228.7333333333333, "x": "そうだ。その全員が無罪になった。"}, {"t": 1230.9833333333333, "x": "別の議員は、報道をもとにこう話している。"}, {"t": 1233.7166666666667, "x": "ある被告にアリバイがあると分かった。"}, {"t": 1235.7833333333333, "x": "すると、自白で組み立てた全体の構図が崩れた。"}, {"t": 1239.0833333333333, "x": "アリバイって、その場にいなかった証拠よね。"}, {"t": 1241.7666666666667, "x": "そうだ。議員は、調書が作り直されたとも伝えている。"}, {"t": 1245.2, "x": "2度、3度とだ。"}, {"t": 1246.4833333333333, "x": "ただし、これは議員が報道として紹介した話だ。"}, {"t": 1249.7, "x": "判決書の言葉そのものではない。"}, {"t": 1251.95, "x": "そこも分けて聞くのね。"}, {"t": 1254.0166666666667, "x": "この判決には、最後に捜査への言葉が付いていた。"}, {"t": 1257.2666666666667, "x": "国会で議員が読み上げた部分を引く。"}, {"t": 1259.5, "x": "名前のところは、ここでは\n「被告の一人」と言い換える。"}, {"t": 1263.0833333333333, "x": "うん。"}, {"t": 1263.5833333333333, "x": "「当初から、被告の一人を土田邸事件の犯人と\n断定し、自白をせよと強く迫った」"}, {"t": 1269.3666666666666, "x": "最初から決めてたってこと？"}, {"t": 1271.2333333333333, "x": "判決はそう見た。そしてこう続く。"}, {"t": 1273.6166666666666, "x": "「日石、土田邸事件が極めて凶悪な犯罪で、"}, {"t": 1276.75, "x": "捜査当局が一日も早い犯人の検挙、事件の究明を\n目ざしていたことは十分に理解できる」"}, {"t": 1282.8833333333334, "x": "分かってはくれてるのね。"}, {"t": 1284.4833333333333, "x": "そのうえでこうだ。"}, {"t": 1285.5666666666666, "x": "「しかし、捜査の過程を振り返ってみると、"}, {"t": 1287.9666666666667, "x": "物証の検討など、慎重な配慮の下に"}, {"t": 1290.35, "x": "捜査していたならば、あるいは事件の真相を\n解明することができたのではないかと思われる」"}, {"t": 1295.8333333333333, "x": "……真相にたどり着けたかもしれない、って。"}, {"t": 1298.2833333333333, "x": "別の議員も、判決の一節を読み上げている。"}, {"t": 1301.1833333333334, "x": "「予断のもとに被告たちを犯人と断定し、"}, {"t": 1303.7333333333333, "x": "客観的な証拠への配慮を欠いたまま自白獲得に\n固執し、それが真相の解明を妨げた」"}, {"t": 1309.7666666666667, "x": "妨げたって強い言葉ね。"}, {"t": 1311.7, "x": "強い。判決は、捜査が真相から遠ざかったと書いた。"}, {"t": 1315.3333333333333, "x": "無罪の人を罪に問いかけただけではない。"}, {"t": 1317.8, "x": "本当に送った人を探す道も、細くしたということだ。"}, {"t": 1321.5166666666667, "x": "そっか……被害に遭った家族にとっても。"}, {"t": 1324.1166666666666, "x": "そうだ。答えが遠のいた。"}, {"t": 1326.45, "x": "ここで、さっきの土田国保の言葉に戻る。"}, {"t": 1329.4, "x": "判決の翌日の国会で、議員が新聞記事を読み上げた。"}, {"t": 1333.0666666666666, "x": "当時、土田は防衛大学校の校長だった。"}, {"t": 1335.95, "x": "判決のニュースを聞いて、記者に答えている。"}, {"t": 1338.75, "x": "何て言ったの？"}, {"t": 1339.8333333333333, "x": "警察の捜査の誤りをどう思うか、と聞かれた。"}, {"t": 1342.8166666666666, "x": "答えは「申し上げにくい。かんべんしてほしい」。"}, {"t": 1345.65, "x": "……言えないわよね。"}, {"t": 1346.7333333333333, "x": "そのうえでこう述べたという。"}, {"t": 1348.25, "x": "「犯人は必ずいる。犯人がいなければ\n事件は起きていない」"}, {"t": 1351.6166666666666, "x": "……。"}, {"t": 1352.55, "x": "議員は、無念そうな表情だったと伝えている。"}, {"t": 1355.3833333333334, "x": "そして議員はこう続けた。"}, {"t": 1357.0333333333333, "x": "裁判は無罪の判決が出た。"}, {"t": 1358.9666666666667, "x": "けれど事件は決着したわけではない、と。"}, {"t": 1361.65, "x": "裁判が終わっても、事件は終わらないのね。"}, {"t": 1364.3666666666666, "x": "そうだ。妻を亡くしたのはこの人だ。"}, {"t": 1366.7333333333333, "x": "その人が言ったのは、捜査を責める言葉ではなかった。"}, {"t": 1370.0333333333333, "x": "送った人が、どこかにいるという一言だった。"}, {"t": 1373.0833333333333, "x": "その「どこか」は、法廷の中じゃなかった。"}, {"t": 1376.1333333333334, "x": "判決はそう言っていることになる。"}, {"t": 1378.75, "x": "1983年の春、国会では何度も質問が出た。"}, {"t": 1382.7333333333333, "x": "警察と法務省の答えは、少し違っていた。"}, {"t": 1385.8666666666666, "x": "どう違ったの？"}, {"t": 1387.0166666666667, "x": "まず警察の側だ。5月18日の答弁を見る。"}, {"t": 1390.3, "x": "捜査員が血のにじむような努力をした。"}, {"t": 1392.6333333333334, "x": "大筋において、捜査は誤りはなかったと思う、と。"}, {"t": 1395.9666666666667, "x": "誤りはなかった……。"}, {"t": 1397.2833333333333, "x": "局長は当時の数字も出した。"}, {"t": 1399.2666666666667, "x": "1971年だけで、爆弾事件は62件起きた。"}, {"t": 1403.3833333333334, "x": "そのうち34件を検挙し、28件が有罪になった。"}, {"t": 1407.2, "x": "無罪はごく一部だ、という説明だった。"}, {"t": 1409.8166666666666, "x": "法務省のほうは？"}, {"t": 1411.0833333333333, "x": "法務省の刑事局長はこう言った。"}, {"t": 1413.25, "x": "有罪の判決が得られなかった事態は現に起きている。"}, {"t": 1416.4166666666667, "x": "その点は率直に認め、反省すべき点は反省する、と。"}, {"t": 1420.3666666666666, "x": "こっちは「認める」なのね。"}, {"t": 1422.4, "x": "議員は警察の答えに、\n反省が無いように聞こえると言った。"}, {"t": 1425.95, "x": "警察と法務省で、同じ判決の受け止め方が分かれた。"}, {"t": 1429.75, "x": "同じ国の役所なのにね。"}, {"t": 1431.5833333333333, "x": "だが検察は、5月の判決をそのままにはしなかった。"}, {"t": 1435.7, "x": "爆弾の事件って、自白が無いと裁けないの？"}, {"t": 1438.8166666666666, "x": "そうとも限らない。警備局長自身が例を挙げている。"}, {"t": 1442.0, "x": "判決の翌日の国会だ。"}, {"t": 1443.95, "x": "同じころに死刑の判決が出た、\n北海道庁の爆破事件だ。"}, {"t": 1448.0166666666667, "x": "それは自白があったの？"}, {"t": 1449.55, "x": "逆だ。自白は得られていなかった。"}, {"t": 1451.9, "x": "じゃあ何で有罪に？"}, {"t": 1453.2333333333333, "x": "周りの状況から積み上げた証拠だ。"}, {"t": 1455.4333333333334, "x": "局長は、裁判官のたとえを紹介している。"}, {"t": 1458.3166666666666, "x": "細いガラスの糸のようなものでも\n集まれば太い鎖になる。"}, {"t": 1461.9, "x": "糸を一本ずつ集めたのね。"}, {"t": 1463.7833333333333, "x": "局長は、我々は細い一本一本を\n固めていったと言った。"}, {"t": 1467.6166666666666, "x": "でも、それなら土田邸の事件でも……。"}, {"t": 1470.1, "x": "その問いには局長は答えていない。"}, {"t": 1472.1833333333334, "x": "ただ、5月の判決が書いたことと重ねると見えてくる。"}, {"t": 1475.6166666666666, "x": "物証の検討など慎重な配慮の下に捜査していたなら。"}, {"t": 1479.2666666666667, "x": "……ガラスの糸を集める捜査、ってことね。"}, {"t": 1481.8, "x": "判決は、その道もあったのではないかと書いた。"}, {"t": 1484.7666666666667, "x": "自白という一本の太い綱に頼った。"}, {"t": 1487.25, "x": "その綱が切れたとき、手元には何も残らなかった。"}, {"t": 1491.1666666666667, "x": "5月の判決には、もう一つ言葉が付いていた。"}, {"t": 1494.3, "x": "裁判長が判決のあとに述べた所感だ。"}, {"t": 1497.0333333333333, "x": "所感って？"}, {"t": 1498.0, "x": "判決とは別に、裁判長が気持ちを述べたものだ。"}, {"t": 1501.2833333333333, "x": "8月の国会で、ある議員がその一部を読み上げている。"}, {"t": 1504.6166666666666, "x": "「ピース缶爆弾事件、"}, {"t": 1505.9333333333334, "x": "日石あるいは土田邸事件の被害者、"}, {"t": 1508.3333333333333, "x": "遺族の人々がこの判決を聞く心境を\n思うと、まことに深い感慨を禁じ得ない」"}, {"t": 1513.5666666666666, "x": "遺族のことを考えてたのね。"}, {"t": 1515.5333333333333, "x": "そしてこう結んでいる。"}, {"t": 1516.9333333333334, "x": "「すべては法に従って行う裁判であるがゆえに、\nまことにやむを得ないと申し述べるほかない」"}, {"t": 1522.2833333333333, "x": "法に従うしかないか。"}, {"t": 1523.9666666666667, "x": "裁判は、証拠で罪を証明できるかどうかを決める場だ。"}, {"t": 1527.35, "x": "証明できなければ、無罪にするしかない。"}, {"t": 1530.0, "x": "でもそれだと遺族はどうなるの？"}, {"t": 1531.95, "x": "そこが、この事件のいちばん重いところだ。"}, {"t": 1534.55, "x": "法務大臣は、この所感についてこう答えている。"}, {"t": 1537.5166666666667, "x": "疑わしきは罰しないのは、近代の裁判の大原則だ。"}, {"t": 1541.1166666666666, "x": "そのうえで「大いに勉強せにゃいかぬ」と述べた。"}, {"t": 1544.15, "x": "裁判官もつらかったのかもね。"}, {"t": 1546.2666666666667, "x": "つらかったかどうかは、本人にしか分からない。"}, {"t": 1549.0, "x": "記録に残っているのは、この言葉までだ。"}, {"t": 1552.2333333333333, "x": "判決の文章って、どれくらいあったの？"}, {"t": 1554.8666666666666, "x": "1984年の国会で、最高裁の局長が数字を出している。"}, {"t": 1559.4, "x": "3月の判決は、660ページあった。"}, {"t": 1562.5666666666666, "x": "660ページ！"}, {"t": 1564.1166666666666, "x": "仕上げるまでに95日かかったという。"}, {"t": 1566.4833333333333, "x": "5月の判決は、仕上げに130日かかった。"}, {"t": 1569.85, "x": "それだけ調べることが多かったのね。"}, {"t": 1572.15, "x": "9年分の法廷の記録だからな。"}, {"t": 1574.3333333333333, "x": "ただ、ここで正直に言っておくことがある。"}, {"t": 1576.8333333333333, "x": "この判決書の本文は、\nネットの公開データベースに無かった。"}, {"t": 1580.6166666666666, "x": "だから私は、判決そのものを読めていない。"}, {"t": 1583.55, "x": "じゃあ今までの判決の言葉は？"}, {"t": 1585.6166666666666, "x": "全部、国会で議員や局長が読み上げたものだ。"}, {"t": 1588.6, "x": "誰が読み上げたかを、資料に1件ずつ残してある。"}, {"t": 1591.8166666666666, "x": "又聞きってこと？"}, {"t": 1593.1166666666666, "x": "国会の記録という公の又聞きだ。"}, {"t": 1595.5166666666667, "x": "だから、言い回しは\n国会の記録のとおりに置いている。"}, {"t": 1598.65, "x": "判決の全体はこの何百倍もある。"}, {"t": 1601.0666666666666, "x": "その中には、ここで拾えなかった判断もあるはずだ。"}, {"t": 1604.4166666666667, "x": "拾えたところだけってことね。"}, {"t": 1606.3833333333334, "x": "そうだ。拾えた範囲の話として聞いてほしい。"}, {"t": 1609.8666666666666, "x": "5月の判決に検察は控訴した。"}, {"t": 1612.2833333333333, "x": "1984年10月の国会でも、警備局長がこう言っている。"}, {"t": 1616.6666666666667, "x": "日石と土田邸は、控訴審で争っている。"}, {"t": 1619.55, "x": "当時の捜査陣は、あの事件に自信を持っている、と。"}, {"t": 1622.95, "x": "まだ諦めてなかったのね。"}, {"t": 1624.7666666666667, "x": "諦めていなかった。"}, {"t": 1626.1, "x": "だが二審でも結論は変わらなかった。"}, {"t": 1628.4166666666667, "x": "1985年12月、9人の無罪が確定した。"}, {"t": 1632.45, "x": "二審でも無罪……。"}, {"t": 1633.6333333333334, "x": "検察は、最高裁へ上告しなかったと伝えられている。"}, {"t": 1637.15, "x": "逮捕から数えると、12年以上たっていた。"}, {"t": 1640.0833333333333, "x": "12年……。その間、ずっと被告だったのね。"}, {"t": 1643.1333333333334, "x": "そうだ。死刑を求められた人もいた。"}, {"t": 1645.5666666666666, "x": "その人たちは、無罪の確定まで\nずっと被告の立場だった。"}, {"t": 1649.35, "x": "ある議員は、判決の前にこう言っていた。"}, {"t": 1651.8666666666666, "x": "長く被告の立場に置かれた\n本人の人権侵害は、もとより。"}, {"t": 1655.8, "x": "そのうえ、真犯人がついに不明のままになる、と。"}, {"t": 1659.05, "x": "二つとも本当になったのね。"}, {"t": 1661.0833333333333, "x": "なった。そして、もう一つの時計も進んでいた。"}, {"t": 1664.3833333333334, "x": "もう一つの時計？"}, {"t": 1665.7333333333333, "x": "時効だ。"}, {"t": 1667.0666666666666, "x": "この事件だけが特別だったわけではない。"}, {"t": 1669.5833333333333, "x": "1984年の国会で、ある議員が判決を並べている。"}, {"t": 1673.6333333333334, "x": "1983年3月9日、\n警視総監公舎の爆破未遂事件で無罪。"}, {"t": 1678.9, "x": "3月24日、土田邸の事件で無罪。"}, {"t": 1681.7666666666667, "x": "ほかにも、自白に\n任意性が無いとされた無罪が続いた。"}, {"t": 1685.3666666666666, "x": "一年のうちにいくつも？"}, {"t": 1686.9833333333333, "x": "議員は少なくとも5件ほどを挙げている。"}, {"t": 1689.3333333333333, "x": "手錠をかけたまま調べたので\n任意性が無い、という例もあった。"}, {"t": 1693.0, "x": "手錠をかけたまま？"}, {"t": 1694.3333333333333, "x": "議員はそれを、人権の重みの問題だと言った。"}, {"t": 1697.2666666666667, "x": "自白を主な証拠にした送検は\nどれくらいあるのか、とも聞いた。"}, {"t": 1701.1333333333334, "x": "警察は何て？"}, {"t": 1702.3833333333334, "x": "警察庁の刑事局長は、統計は手元に無いと答えた。"}, {"t": 1706.0333333333333, "x": "ただ、大半の事件は取り調べて\n自供を得ると言っている。"}, {"t": 1709.3666666666666, "x": "自供だけで送ることはない、とも付け加えた。"}, {"t": 1712.2666666666667, "x": "自白はやっぱり中心なのね。"}, {"t": 1714.3, "x": "法務大臣も、同じ年にこう述べている。"}, {"t": 1716.8666666666666, "x": "無罪や再審で、違う結果が出る例がある。"}, {"t": 1719.5333333333333, "x": "他山の石として肝に銘じ、今後の戒めにしたい、と。"}, {"t": 1723.1833333333334, "x": "他山の石……。"}, {"t": 1724.2, "x": "自分の外で起きた失敗から学ぶ、という意味だ。"}, {"t": 1727.8833333333334, "x": "起訴された人たちは、全員が無罪になった。"}, {"t": 1730.75, "x": "ということは、送った人は別にいることになる。"}, {"t": 1733.7333333333333, "x": "そうよね。小包はひとりでに届かないもの。"}, {"t": 1736.5833333333333, "x": "だが、その人を探す時間は、もう残り少なかった。"}, {"t": 1740.0666666666666, "x": "事件から十数年がたっている。"}, {"t": 1742.0333333333333, "x": "当時、死刑に当たる罪の時効は15年だった。"}, {"t": 1745.1666666666667, "x": "じゃあ……。"}, {"t": 1745.7666666666667, "x": "送った人が分からないまま、時効は成立した。"}, {"t": 1748.7833333333333, "x": "日石の事件も土田邸の事件もだ。"}, {"t": 1751.3666666666666, "x": "いつ成立したの？"}, {"t": 1752.7333333333333, "x": "正確な日付はこの回では言わない。"}, {"t": 1754.9166666666667, "x": "起訴があると、時効の数え方が変わることがある。"}, {"t": 1757.9166666666667, "x": "その計算を、一次資料で確かめられなかった。"}, {"t": 1761.0333333333333, "x": "そこも慎重なのね。"}, {"t": 1762.55, "x": "時効が成立したこと自体は、複数の資料で確かめた。"}, {"t": 1766.2333333333333, "x": "日付だけが確かめきれなかった。"}, {"t": 1768.4666666666667, "x": "……結局誰も裁かれなかったのね。"}, {"t": 1770.7333333333333, "x": "そうだ。妻を亡くした家族にとっても。"}, {"t": 1773.2, "x": "郵便局でけがをした局員にとっても。"}, {"t": 1775.6833333333334, "x": "そして無罪になった人たちにとっても。"}, {"t": 1778.0833333333333, "x": "この事件には、決着の形が残らなかった。"}, {"t": 1781.7833333333333, "x": "時間を少し戻す。1978年の国会だ。"}, {"t": 1785.5, "x": "警察庁の課長が、爆弾事件の数をまとめて答えた。"}, {"t": 1789.2833333333333, "x": "どんな数字？"}, {"t": 1790.3166666666666, "x": "1969年からの爆弾事件は199件。"}, {"t": 1794.1, "x": "そのうち実際に破裂したのが109件。"}, {"t": 1796.6833333333334, "x": "死者が出た事件は5件あった。"}, {"t": 1798.6666666666667, "x": "5件……。"}, {"t": 1799.35, "x": "課長はその最初の1件をこう挙げた。"}, {"t": 1801.6333333333334, "x": "1971年12月18日の、警視庁警務部長宅の爆破事件。"}, {"t": 1806.9166666666667, "x": "土田邸の事件が最初……。"}, {"t": 1808.7666666666667, "x": "そうだ。この時期の爆弾で人が\n亡くなった、最初の事件だった。"}, {"t": 1812.85, "x": "課長は続けて、ほかの4件も挙げている。"}, {"t": 1815.55, "x": "丸の内のビルの前で起きた爆発もその一つだ。"}, {"t": 1818.6166666666666, "x": "そこでは8人が亡くなり、380人がけがをした。"}, {"t": 1822.35, "x": "最初の1件のあとにそんなに……。"}, {"t": 1824.4, "x": "そのうちのいくつかは、犯人が捕まり裁かれている。"}, {"t": 1827.5833333333333, "x": "だが最初の1件は、送った人が分からないままだ。"}, {"t": 1830.9166666666667, "x": "最初の事件だけが、取り残されたのね。"}, {"t": 1833.6333333333334, "x": "取り残された、という言い方もできる。"}, {"t": 1835.9166666666667, "x": "課長が数え上げた順番の、いちばん前にある事件だ。"}, {"t": 1839.8333333333333, "x": "では小包の側は何か変わったのか。"}, {"t": 1842.1833333333334, "x": "1995年、別の小包爆弾の事件のあとの国会だ。"}, {"t": 1846.4666666666667, "x": "郵政大臣がこう答えている。"}, {"t": 1848.4833333333333, "x": "郵便局の大臣ね。"}, {"t": 1850.1166666666666, "x": "郵便法の14条で、爆発物は\n送ることが禁じられている。"}, {"t": 1854.0166666666667, "x": "出そうとすること自体が法律違反だ。"}, {"t": 1856.4, "x": "疑わしい小包は、中身を見せるよう求められる。"}, {"t": 1859.6333333333334, "x": "その決まり、当時もあったの？"}, {"t": 1861.5666666666666, "x": "大臣は「大前提」と言っている。"}, {"t": 1863.85, "x": "それでも、すり抜けて届いた例があった。"}, {"t": 1866.3, "x": "大臣は、日石の事件からの25年を振り返った。"}, {"t": 1869.75, "x": "小包の爆発は7件。"}, {"t": 1871.5166666666667, "x": "亡くなったのは1人で、それが土田邸だと。"}, {"t": 1874.4333333333334, "x": "そのあと何か新しく始めたの？"}, {"t": 1876.6833333333334, "x": "金属探知機を、220局ぶん用意したと答えている。"}, {"t": 1880.3333333333333, "x": "東京都内の集配をする局には、全部置いたと。"}, {"t": 1883.5833333333333, "x": "やっと機械の出番ね。"}, {"t": 1885.1333333333334, "x": "大臣自身、金属があるだけでは\n決め手にならないと言っている。"}, {"t": 1888.7666666666667, "x": "それでも、手で開ける前に確かめる道ができた。"}, {"t": 1891.8333333333333, "x": "居間で開けるより前にってことね。"}, {"t": 1893.8666666666666, "x": "そういうことになる。"}, {"t": 1895.6833333333334, "x": "事件から28年後、1999年の国会だ。"}, {"t": 1899.6166666666666, "x": "ある法律の審議で、ある議員が過去の事件を並べた。"}, {"t": 1902.8666666666666, "x": "その中に、土田邸の爆破事件も入っていた。"}, {"t": 1906.0833333333333, "x": "28年たっても名前が出たのね。"}, {"t": 1908.4833333333333, "x": "議員は、こういう事件も\n法律の対象になるのかと聞いた。"}, {"t": 1911.95, "x": "法務大臣の答えはこうだった。"}, {"t": 1913.9166666666667, "x": "「それらの行為を行った者たちの実態というものは\nはっきりいたしておりません」"}, {"t": 1918.3166666666666, "x": "……はっきりしていない。"}, {"t": 1919.5833333333333, "x": "これが、国としての28年後の答えだ。"}, {"t": 1922.4333333333334, "x": "同じ年の7月に、土田国保は亡くな const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);

document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}

  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}

  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
