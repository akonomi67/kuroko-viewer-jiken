<script>
const D={"name": "089", "file": "089_編集用", "dur": 1935.26665625, "segs": [], "subs": [{"t": 0.0, "x": "2003年5月20日、火曜日。"}, {"t": 2.2666666666666666, "x": "午後3時ころ。"}, {"t": 3.316666666666667, "x": "大阪府泉南郡熊取町七山で、\n小学4年生の女の子が行方不明になった。"}, {"t": 8.616666666666667, "x": "名前は、吉川友梨さん。当時9歳だ。"}, {"t": 11.3, "x": "学校からの帰り道だった。"}, {"t": 13.266666666666667, "x": "家まで、どのくらいのところだったの。"}, {"t": 15.616666666666667, "x": "報道で確認できるのは、\nおよそ400メートルという数字だ。"}, {"t": 19.266666666666666, "x": "家まで、あと400メートル。"}, {"t": 21.1, "x": "その手前で、友梨さんの姿が分からなくなった。"}, {"t": 24.1, "x": "それから23年がたつ。"}, {"t": 25.883333333333333, "x": "友梨さんは、いまも見つかっていない。"}, {"t": 28.1, "x": "23年って。"}, {"t": 29.433333333333334, "x": "先に断っておく。友梨さんのことを、\n過去の話として喋らない。"}, {"t": 33.36666666666667, "x": "生きているか、そうでないかも、私は決めつけない。"}, {"t": 36.71666666666667, "x": "犯人が誰かも、言わないの？"}, {"t": 38.766666666666666, "x": "言わない。事件なのか\n事故なのかも、私は断定しない。"}, {"t": 42.11666666666667, "x": "ネットで流れている説も並べない。"}, {"t": 44.15, "x": "連れ去り先がどうだ、という類の話には乗らない。"}, {"t": 47.4, "x": "私が話すのは、大阪府警と警察庁が出しているもの、\n国会の会議録に残っているもの、"}, {"t": 53.13333333333333, "x": "報道されたことだけだ。"}, {"t": 54.86666666666667, "x": "分かったわ。"}, {"t": 55.81666666666667, "x": "そしてこの事件は、終わっていない。"}, {"t": 57.8, "x": "捜査本部はいまも置かれていて、\n懸賞金も今年また出し直されている。"}, {"t": 62.2, "x": "だから、最後に何をするの？"}, {"t": 64.23333333333333, "x": "情報の届け先を、\n警察が出しているとおりにそのまま読む。"}, {"t": 67.75, "x": "今日はそこまで行く。"}, {"t": 69.65, "x": "まず、大阪府警のホームページに\n載っている文を、そのまま読む。"}, {"t": 73.43333333333334, "x": "「平成15年5月20日（火曜日）"}, {"t": 75.7, "x": "午後3時ころ、大阪府泉南郡熊取町七山から、"}, {"t": 79.16666666666667, "x": "吉川友梨さん（当時小学4年生）が\n行方不明になっています」"}, {"t": 83.45, "x": "短いのね。"}, {"t": 84.51666666666667, "x": "短い。これが公式の説明の全文だ。"}, {"t": 87.25, "x": "日付と、時刻と、場所と、学年。\nそれだけしか書いていない。"}, {"t": 91.31666666666666, "x": "この事件には、もっと長い正式な名前が付いている。"}, {"t": 94.58333333333333, "x": "「泉南郡熊取町における小学生女児に\n対する未成年者略取誘拐事件」。"}, {"t": 99.51666666666667, "x": "略取誘拐、っていう言い方をしているのね。"}, {"t": 102.15, "x": "ああ。そこは大事なところだ。"}, {"t": 104.01666666666667, "x": "行方不明、で止めていない。"}, {"t": 105.61666666666666, "x": "大阪府警は、略取誘拐の事件として扱っている。"}, {"t": 109.13333333333334, "x": "熊取町は、大阪の南のほうにある町だ。"}, {"t": 111.91666666666667, "x": "関西空港のある泉州の一角にある。"}, {"t": 114.43333333333334, "x": "七山は、その町の中の地名だ。"}, {"t": 116.81666666666666, "x": "府警は、その場所の写真を4枚、\nホームページに載せている。"}, {"t": 120.46666666666667, "x": "七山交差点の付近。交差点の付近から、最後に\n姿が確認された地点のほうを見たところ。"}, {"t": 126.5, "x": "そして最後に姿が確認された地点そのものを、\n西側からと、東側からの2方向。"}, {"t": 132.25, "x": "現場の写真を、警察が自分で出しているの。"}, {"t": 135.2, "x": "出している。地図のイラストも一緒に出ている。"}, {"t": 137.8, "x": "見た人に、その場所を思い出してほしいからだ。"}, {"t": 141.26666666666668, "x": "その日の帰り道のことは、関西テレビが\n20年目にまとめた特集で報じられている。"}, {"t": 146.4, "x": "友梨さんは、同級生3人と一緒に学校を出た。"}, {"t": 149.48333333333332, "x": "通学路の交差点で、その3人と別れて、一人になった。"}, {"t": 153.36666666666667, "x": "そのあと、午後3時ころ。"}, {"t": 155.05, "x": "自宅まで、およそ400メートルの\nところで、別の同級生とすれ違っている。"}, {"t": 159.76666666666668, "x": "それが、姿が確認されている最後だ。"}, {"t": 162.55, "x": "ほんの少しの距離じゃない。"}, {"t": 164.23333333333332, "x": "ああ。歩いて数分の距離だ。"}, {"t": 166.05, "x": "その特集には、一緒に帰った同級生が\n出ている。みさとさんという方だ。"}, {"t": 170.6, "x": "取材のとき、29歳になっていた。"}, {"t": 173.08333333333334, "x": "帰り道のことを、こう話している。"}, {"t": 175.1, "x": "「グリコしていた」。"}, {"t": 176.35, "x": "じゃんけんで、進む歩数が変わる、あの遊びね。"}, {"t": 179.41666666666666, "x": "そうだ。学校帰りに、道でやるやつだ。"}, {"t": 182.05, "x": "別れぎわのことも話している。"}, {"t": 183.76666666666668, "x": "「結構見えなくなるくらいまで\nよく見送っていたよな」。"}, {"t": 186.76666666666668, "x": "「カーブで見えなくなるまで」。"}, {"t": 188.25, "x": "「見えなくなって、よし帰ろう、みたいな感じ」。"}, {"t": 191.11666666666667, "x": "ちゃんと見送っていたのね。"}, {"t": 192.78333333333333, "x": "ああ。カーブの向こうへ消えるまで、見ていた。"}, {"t": 195.28333333333333, "x": "そのあと遊ぶ約束をしようとしたことも出てくる。"}, {"t": 198.18333333333334, "x": "「たぶん遊べるって言っていて、友梨は無理って」。"}, {"t": 200.76666666666668, "x": "「お母さん、とか家の人に聞かなあかんみたいな。"}, {"t": 203.4, "x": "行けたら行く、みたいな感じ」。"}, {"t": 205.43333333333334, "x": "……普通の、下校だったのね。"}, {"t": 207.31666666666666, "x": "ああ。そこまでは、本当に何でもない帰り道だ。"}, {"t": 210.43333333333334, "x": "その特集では、同級生たちが20年ぶりに、\nその道を実際に歩き直している。"}, {"t": 215.56666666666666, "x": "歩きながら、記憶をたどっている。"}, {"t": 217.61666666666667, "x": "「オレンジの看板とか、あの辺りのような気がする」。"}, {"t": 220.53333333333333, "x": "そして、こういう言葉が出てくる。"}, {"t": 222.58333333333334, "x": "「大きくなってしまったがゆえに、\nこの歩幅きついな」。"}, {"t": 225.66666666666666, "x": "……子どもの歩幅じゃ、なくなっているのね。"}, {"t": 228.15, "x": "ああ。同じ道を、同じようには歩けなくなっていた。"}, {"t": 231.26666666666668, "x": "20年というのは、そういう長さだ。"}, {"t": 234.18333333333334, "x": "大阪府警は、その日の友梨さんの服装と\n持ち物を、いまもホームページに載せている。"}, {"t": 239.15, "x": "これも府警の説明どおりに読む。"}, {"t": 241.13333333333333, "x": "制服は、熊取町立北小学校のもの。"}, {"t": 243.93333333333334, "x": "左胸に校章の入った白いブラウスと、スカート。"}, {"t": 247.26666666666668, "x": "靴下は、ピンク色に赤の星マークが入ったもの。"}, {"t": 250.43333333333334, "x": "靴は、アディダス製の22.0センチ。"}, {"t": 253.0, "x": "赤と黒の線が入った運動靴だ。"}, {"t": 255.35, "x": "そして、リュック。"}, {"t": 256.6, "x": "サンリオ製で、コロコロクリリンと書かれている。"}, {"t": 259.06666666666666, "x": "大きさは、およそ35×25センチ。"}, {"t": 262.01666666666665, "x": "黄色いリュックだ。"}, {"t": 263.2, "x": "そこまで細かく書いてあるのね。"}, {"t": 265.23333333333335, "x": "書いてある。イラストと、\n同じ品物の写真まで並べてある。"}, {"t": 268.95, "x": "メーカーの名前も、靴のサイズも、\nリュックの寸法も出ている。"}, {"t": 272.56666666666666, "x": "なぜここまで出すのか。"}, {"t": 274.0, "x": "見た人が、それを手がかりに\n思い出せるようにするためだ。"}, {"t": 277.3333333333333, "x": "顔は覚えていなくても、黄色いリュックは\n覚えている。そういうことがある。"}, {"t": 281.43333333333334, "x": "物のほうが、記憶に残るということね。"}, {"t": 284.03333333333336, "x": "ああ。公開捜査というのは、\nそういう作りになっている。"}, {"t": 287.25, "x": "ちなみに府警が出している友梨さんの写真は、一面に\n黄色いコスモスが咲いている場所で撮られたものだ。"}, {"t": 293.06666666666666, "x": "髪を二つに結んで、ピースサインをしている。"}, {"t": 296.4, "x": "府警が出しているのは、持ち物だけではない。"}, {"t": 299.05, "x": "友梨さんの体の特徴も、そのまま公表されている。"}, {"t": 302.35, "x": "生年月日は、平成6年3月31日。"}, {"t": 305.53333333333336, "x": "事件の日に9歳だ。"}, {"t": 307.1, "x": "身長は135センチ。体格は、細身。"}, {"t": 310.1666666666667, "x": "そして、特徴として二つ書いてある。"}, {"t": 312.6333333333333, "x": "右の小鼻に、1ミリほどのホクロ。"}, {"t": 314.95, "x": "右の尻の下のほうに、1センチほどのあざ。"}, {"t": 317.81666666666666, "x": "……1ミリ。"}, {"t": 318.6166666666667, "x": "ああ。1ミリだ。"}, {"t": 319.75, "x": "これは、人相書きというより、見分けるための印だ。"}, {"t": 323.03333333333336, "x": "年月がたって顔つきが変わっても、\nこういう印は残ることがある。"}, {"t": 326.98333333333335, "x": "だから警察は、消えにくいものを選んで出している。"}, {"t": 329.95, "x": "府警は、いまの友梨さんの想像図も2枚公開している。"}, {"t": 333.25, "x": "髪型がロングのものと、ショートのもの。"}, {"t": 335.68333333333334, "x": "当時の顔写真から、年齢を重ねたら\nどうなるかを描いたものだ。"}, {"t": 339.68333333333334, "x": "どうして2枚あるのかしら。"}, {"t": 341.3833333333333, "x": "髪型が分からないからだ。"}, {"t": 343.06666666666666, "x": "23年のあいだに、どんな髪型になっているかは\n誰にも分からない。"}, {"t": 347.1333333333333, "x": "だから、長い場合と短い場合の両方を出している。"}, {"t": 350.3666666666667, "x": "……9歳の写真から、大人の顔を描くのね。"}, {"t": 353.25, "x": "ああ。想像図というのは、そういうものだ。"}, {"t": 355.75, "x": "友梨さんは、平成6年3月31日生まれだ。"}, {"t": 359.1666666666667, "x": "2026年の5月の時点で、32歳になっている。"}, {"t": 363.01666666666665, "x": "いまの姿を、描いて出しているのね。"}, {"t": 365.45, "x": "出している。それと、4分39秒の動画も\n府警が公開している。"}, {"t": 369.85, "x": "「吉川友梨さんを捜しています」という\n題の、情報提供を呼びかける動画だ。"}, {"t": 374.5, "x": "私がここで並べているものは、全部、\n警察が自分で世に出しているものだ。"}, {"t": 379.18333333333334, "x": "私が調べ上げたことではない。"}, {"t": 380.95, "x": "誰でも、いま開けば見られる。"}, {"t": 383.43333333333334, "x": "府警のページには、もう一つ、\n具体的なものが出ている。"}, {"t": 386.93333333333334, "x": "車だ。"}, {"t": 387.6666666666667, "x": "「事件発生前や発生当時に、次の車種が\n不審車両として目撃されています」。こう書いてある。"}, {"t": 393.53333333333336, "x": "出ているのは4車種だ。"}, {"t": 395.0, "x": "一つ目、トヨタのカムリ。"}, {"t": 396.5833333333333, "x": "ビスタと書かれている。"}, {"t": 397.85, "x": "型式はイー・ブイ・ゼット・ブイ・にじゅう。"}, {"t": 400.6666666666667, "x": "1987年4月からの車だ。"}, {"t": 403.55, "x": "二つ目、トヨタのクラウン。"}, {"t": 405.1333333333333, "x": "130系、8代目。1987年から\n1991年まで作られていたものだ。"}, {"t": 411.68333333333334, "x": "三つ目、日産のセドリック、グロリア。"}, {"t": 414.05, "x": "Y32型。1991年6月からの車。"}, {"t": 418.05, "x": "四つ目、同じくセドリック、グロリアのY33型。"}, {"t": 421.46666666666664, "x": "1995年6月からの車だ。"}, {"t": 424.45, "x": "年式まで出てるのね。"}, {"t": 426.03333333333336, "x": "出ている。府警は、それぞれの車の写真も\n前と後ろから載せている。"}, {"t": 430.2, "x": "ここで一つ、はっきりさせておく。"}, {"t": 432.3833333333333, "x": "府警が書いているのは「不審車両として\n目撃されている車種」までだ。"}, {"t": 436.71666666666664, "x": "「犯人の車」とは、一言も書いていない。"}, {"t": 439.5833333333333, "x": "だから私も、そこから先には行かない。"}, {"t": 442.3, "x": "目撃された車の種類、というだけなのね。"}, {"t": 445.23333333333335, "x": "ああ。それ以上の意味を私が\n足したら、それはもう報道ではない。"}, {"t": 448.93333333333334, "x": "ただ、この4車種が並んでいること\n自体が、一つのことを語っている。"}, {"t": 453.21666666666664, "x": "23年たっても、警察がまだ「思い出してほしい」と\n言い続けている、ということだ。"}, {"t": 459.1666666666667, "x": "ここまで見てきたものは、全部\n「公開捜査」と呼ばれるやり方だ。"}, {"t": 463.3, "x": "警察が持っている情報を、あえて外に出す。"}, {"t": 466.0833333333333, "x": "そうして、見た人の記憶のほうから\n手がかりが返ってくるのを待つ。"}, {"t": 470.06666666666666, "x": "捜査の情報って、ふつうは出さないものじゃないの。"}, {"t": 473.15, "x": "ああ。出さないのが普通だ。"}, {"t": 474.8333333333333, "x": "捜査の中身を出せば、それを知った\n側が動いてしまう。だから伏せる。"}, {"t": 478.93333333333334, "x": "それでも出すのは、出さないと届かないところにしか\n手がかりが無い、と判断したときだ。"}, {"t": 484.1, "x": "この事件で府警が出しているものを、\nもう一度数えてみる。"}, {"t": 487.43333333333334, "x": "当時の顔写真。いまの想像図が2枚。"}, {"t": 489.76666666666665, "x": "服装のイラストと、同じ品物の写真。"}, {"t": 492.55, "x": "現場の写真が4枚と、地図のイラスト。"}, {"t": 495.0, "x": "目撃された車種が4つ。"}, {"t": 496.85, "x": "身長、体格、ホクロ、あざ。そして4分39秒の動画。"}, {"t": 501.3333333333333, "x": "ずいぶん、たくさん出しているのね。"}, {"t": 503.43333333333334, "x": "出せるものは、ほとんど出している。"}, {"t": 505.48333333333335, "x": "この事件は、大阪府警のページだけに\n載っているわけでもない。"}, {"t": 509.06666666666666, "x": "熊取町が、町の公式サイトに\n「吉川友梨さん捜索依頼」という\nページを置き続けている。"}, {"t": 514.8833333333333, "x": "それから、奈良県警も\n自分のところのサイトに載せている。"}, {"t": 518.3, "x": "題は「吉川友梨さんを探しています。"}, {"t": 520.6666666666666, "x": "大阪府警察からのお願い」。"}, {"t": 522.7166666666667, "x": "よその県の警察が、載せているの。"}, {"t": 525.2, "x": "載せている。府県の境の外まで、\n届かせようとしているということだ。"}, {"t": 529.4666666666667, "x": "大阪府警のページの、呼びかけの部分も読んでおく。"}, {"t": 532.6, "x": "「事件に関するどんな情報でも結構です。\nお心あたりのある方はご連絡ください」。"}, {"t": 537.5333333333333, "x": "ページの終わりには、こうも書いてある。"}, {"t": 539.6166666666667, "x": "「どんな些細な情報でも結構ですので、\n情報をお持ちの方はご連絡ください。"}, {"t": 544.0666666666667, "x": "ご協力をお願いします」。"}, {"t": 545.8666666666667, "x": "二回、同じことを書いてあるのね。"}, {"t": 548.0833333333334, "x": "ああ。同じページの上と下で、二回書いてある。"}, {"t": 551.0166666666667, "x": "役所の文章としては、くどいくらいだ。"}, {"t": 553.4833333333333, "x": "それだけ、一件でも多く\n届いてほしいということだろう。"}, {"t": 557.3166666666667, "x": "ここで、国会の記録を見てみる。"}, {"t": 559.4333333333333, "x": "国立国会図書館の会議録検索で「吉川友梨」と\n入れると、出てくるのは1件だけだ。"}, {"t": 565.35, "x": "1件。"}, {"t": 566.0833333333334, "x": "ああ。国会の記録の全部を通して、1件しかない。"}, {"t": 569.4, "x": "2004年3月2日。"}, {"t": 570.9666666666667, "x": "衆議院の予算委員会、第七分科会。"}, {"t": 573.6666666666666, "x": "発言しているのは、"}, {"t": 574.85, "x": "長安豊という分科員だ。地元が、その泉州にあたる。"}, {"t": 578.8, "x": "発言をそのまま読む。"}, {"t": 580.2666666666667, "x": "「私の地元泉州では、"}, {"t": 581.8, "x": "昨年の五月二十日に熊取町で\n小学校四年生の吉川友梨ちゃんが\n行方不明になって、これは"}, {"t": 587.6666666666666, "x": "誘拐か神隠しかわからない」"}, {"t": 589.5333333333333, "x": "「もう九カ月以上が過ぎているけれども、\nいまだに行方がわからないという状況にあります」"}, {"t": 594.4833333333333, "x": "続きがある。"}, {"t": 595.3666666666667, "x": "「私、昨年選挙を控えておりましたので、"}, {"t": 598.05, "x": "政治の道具にするのはいかがと思いまして、\n発言を控えておりましたけれども」"}, {"t": 602.7333333333333, "x": "「私、家が近いということもございまして、"}, {"t": 605.25, "x": "友梨ちゃんが一日も早く出てきてくれるように、または"}, {"t": 608.35, "x": "見つかるように努力していきたいなと\n思っておる次第でございます」"}, {"t": 611.95, "x": "……近所の人だったのね。"}, {"t": 613.6, "x": "ああ。国会議員である前に、\n近所の人として喋っている。"}, {"t": 617.1666666666666, "x": "この日の質疑そのものは、この事件がお題ではない。"}, {"t": 620.2666666666667, "x": "中心は、ICタグと、食べ物の安全の話だ。"}, {"t": 623.6, "x": "冒頭で地元の話をするところに、この事件が出てくる。"}, {"t": 627.0833333333334, "x": "国の記録に残っているのは、これで全部だ。"}, {"t": 630.4666666666667, "x": "ただ、長安分科員の発言には、続きがある。"}, {"t": 633.5166666666667, "x": "ここが今日いちばん大事なところだと私は思っている。"}, {"t": 636.6, "x": "「このような事件が起こりますと、地元の\nお子さんをお持ちの親御さんからしますと」"}, {"t": 641.1166666666667, "x": "「学校の行き帰りに何かあるんじゃないかというような\n不安を持たれて、心配が多いかと思います」"}, {"t": 646.45, "x": "「そういった意味でも、そういった治安を\n守るための政策をしていかなければならない」"}, {"t": 650.9833333333333, "x": "「一義的には、例えば警察を増員する、\nそういったことも必要ですけれども」"}, {"t": 655.7333333333333, "x": "「警察だけでは見張り切れない、見ることが、\n目が届かない、そういうこともございますので」"}, {"t": 660.9, "x": "「例えば地域がみんなで\n治安維持のために協力していく」"}, {"t": 664.2333333333333, "x": "警察だけでは無理だ、って言っているのね。"}, {"t": 666.7833333333333, "x": "ああ。2004年の3月に、そう言っている。"}, {"t": 669.5, "x": "この「学校の行き帰り」という\n言い方に注目してほしい。"}, {"t": 673.0333333333333, "x": "事件そのものの捜査を求めているのではない。"}, {"t": 675.65, "x": "次の子が同じ目に\n遭わないように、という話をしている。"}, {"t": 678.9, "x": "友梨さんが行方不明になったのは、通学路だ。"}, {"t": 681.5666666666667, "x": "時刻は午後3時ころ。"}, {"t": 683.1333333333333, "x": "家に帰る途中の、昼間の道だった。"}, {"t": 685.7666666666667, "x": "夜でもない、知らない場所でもない。"}, {"t": 687.9833333333333, "x": "そうだ。毎日通っている道の、明るい時間だ。"}, {"t": 691.1666666666666, "x": "この「毎日通っている道の、明るい\n時間」というのが、このあと国の課題になっていく。"}, {"t": 697.25, "x": "2005年12月16日。"}, {"t": 699.1333333333333, "x": "衆議院の、青少年問題に関する特別委員会。"}, {"t": 702.6, "x": "横山北斗という委員が、\n警察庁のデータを引いて質問している。"}, {"t": 706.65, "x": "そのまま読む。"}, {"t": 707.6166666666667, "x": "「まず、下校時の安全対策につきまして、\n十五歳以下の子供の略取誘拐、\n警察庁のデータによれば」"}, {"t": 714.0166666666667, "x": "「時間帯は十五時から十八時、\n場所は通学路での発生、これが\n全体の半数を占めるということです」"}, {"t": 720.2333333333333, "x": "……午後3時から6時。通学路。"}, {"t": 722.4166666666666, "x": "ああ。その二つが重なるものが、半分だ。"}, {"t": 725.3, "x": "友梨さんの場合が、そのままそれにあたる。"}, {"t": 727.7333333333333, "x": "午後3時ころ、通学路。"}, {"t": 729.45, "x": "つまりこれは、この事件だけの特別な\n条件ではなかった、ということだ。"}, {"t": 733.8666666666667, "x": "横山委員の発言には、続きがある。"}, {"t": 736.3333333333334, "x": "「対策として、防犯カメラを設置する、\n防犯マニュアルを作成する、\n学校と警察との連携を深める」"}, {"t": 742.7333333333333, "x": "「地域住民による\n防犯パトロールの強化、あるいは子供たちみずからが\nみずからを守るための訓練をする」"}, {"t": 748.6666666666666, "x": "「そういう教育プログラムの実施など、\n数多くの努力が展開されてきているわけですが」"}, {"t": 753.6833333333333, "x": "そのうえで、現場の人たちの意見を\n二つにまとめている。"}, {"t": 757.1, "x": "「まず大人の目をふやすということ、それと"}, {"t": 759.3166666666667, "x": "子供を一人にしない、この二点がとりわけ\n重要であると考えられております」"}, {"t": 763.8666666666667, "x": "大人の目を増やす。子供を一人にしない。"}, {"t": 766.5333333333333, "x": "ああ。ずいぶん素朴な結論に見えるだろう。"}, {"t": 769.0166666666667, "x": "だが、国会で出てきた答えは、これだ。"}, {"t": 772.2333333333333, "x": "この2005年の終わりから2006年の初めというのは、"}, {"t": 775.4, "x": "国会で子どもの安全がずっと議論されていた時期だ。"}, {"t": 778.65, "x": "2006年1月17日、参議院の内閣委員会で、\n当時の国家公安委員長、\n沓掛哲男氏がこう述べている。"}, {"t": 785.9666666666667, "x": "「昨年の十一月以降、"}, {"t": 787.4666666666667, "x": "女子児童が◯害されるという誠に痛ましい事件が\n続発し、国民に大きな不安を与えております」"}, {"t": 793.5333333333333, "x": "ここで触れられているのは、\n広島と栃木で起きた別の事件だ。"}, {"t": 797.3333333333334, "x": "友梨さんの事件ではない。そこは混ぜない。"}, {"t": 799.85, "x": "別の事件なのね。"}, {"t": 801.2833333333333, "x": "別だ。どちらも、お子さんが亡くなっている事件だ。"}, {"t": 804.3166666666667, "x": "私はその中身には入らない。"}, {"t": 806.3333333333334, "x": "私が言いたいのは、並び方のほうだ。"}, {"t": 808.7833333333333, "x": "2003年に熊取町。"}, {"t": 810.35, "x": "2004年に国会で「学校の行き帰り」。"}, {"t": 813.0833333333334, "x": "2005年の終わりに別の事件が続いて、国会が動く。"}, {"t": 816.6333333333333, "x": "そして「大人の目をふやす」\n「子供を一人にしない」という答えが出る。"}, {"t": 820.8166666666667, "x": "いま、学校の行き帰りに黄色い\n旗を持って立っている人がいる。"}, {"t": 824.5166666666667, "x": "通学路に、見守りのボランティアの方が立っている。"}, {"t": 827.65, "x": "あれって、いつからあるものなのかしら。"}, {"t": 830.0166666666667, "x": "全国に広がったのは、まさにこのころだ。"}, {"t": 832.7, "x": "熊取町の、友梨さんが歩いていた\n地区にも、それをやっている方がいる。"}, {"t": 836.9166666666666, "x": "佐々木茂之さんという方だ。"}, {"t": 838.7166666666667, "x": "取材のとき80歳だった。"}, {"t": 840.7, "x": "毎日、登校する子どもたちを見守っている。"}, {"t": 844.1, "x": "ここから、少し込み入った話をする。"}, {"t": 846.55, "x": "この事件に、時効はあるのか、という話だ。"}, {"t": 849.5666666666667, "x": "23年たっているのよね。まだ\n捜査しているということは、時効が無いのかしら。"}, {"t": 854.4833333333333, "x": "そこが、簡単に言い切れないところだ。"}, {"t": 856.8333333333334, "x": "2010年に、公訴時効が廃止された罪がある。"}, {"t": 859.7666666666667, "x": "人を死亡させた罪のうち、死刑にあたるものだ。"}, {"t": 862.9333333333333, "x": "◯人などがそれにあたる。"}, {"t": 864.35, "x": "この改正は、遺族の方たちが\n長く求めて、実現したものだ。"}, {"t": 868.5666666666667, "x": "だが、この事件は\n「未成年者略取誘拐事件」として扱われている。"}, {"t": 873.0833333333334, "x": "人を死亡させた罪ではない。だから\n2010年の廃止の対象ではない。"}, {"t": 877.4666666666667, "x": "……それは、亡くなったことになっていない、\nということでもあるのよね。"}, {"t": 881.25, "x": "ああ。そこは、そのとおりだ。"}, {"t": 883.0833333333334, "x": "警察は、友梨さんが亡くなったという\n前提を取っていない。"}, {"t": 886.4, "x": "だから罪名も「略取誘拐」のままだ。"}, {"t": 889.0833333333334, "x": "この事件が2010年の改正で\n救われないのは、そういう理由でもある。"}, {"t": 893.4166666666666, "x": "じゃあ、時効はあるということ。"}, {"t": 895.2666666666667, "x": "そこで出てくるのが「起算点」という言葉だ。"}, {"t": 898.1333333333333, "x": "時効というのは、いつから数え始めるのか。"}, {"t": 900.8333333333334, "x": "法律では「犯罪行為が終わったとき」から\n数える、となっている。"}, {"t": 904.8166666666667, "x": "これを国会で答えているのが、\n2002年10月10日、参議院の外交防衛委員会だ。"}, {"t": 910.1666666666666, "x": "答えているのは、\n当時の法務省刑事局長、樋渡利秋氏。"}, {"t": 914.2, "x": "「公訴時効は一般論で申し上げますと\n犯罪行為が終わったときから\n進行することになっております」"}, {"t": 919.95, "x": "終わったとき、から。"}, {"t": 921.4, "x": "ああ。では、略取誘拐は、いつ\n「終わった」ことになるのか。"}, {"t": 925.3, "x": "ここが、決まっていない。"}, {"t": 927.45, "x": "同じ答弁の続きを読む。"}, {"t": 928.9833333333333, "x": "少し長いが、そのまま読む価値がある。"}, {"t": 931.5333333333333, "x": "「略取・誘拐の罪の性質でございますが、これも"}, {"t": 935.05, "x": "委員御指摘のように、それを\n継続犯と見るか状態犯と見るか」"}, {"t": 938.5, "x": "「すなわち、まだ犯罪が終わっていないと見るのか、"}, {"t": 941.2166666666667, "x": "既に犯罪が既遂に達してあとは\n違法状態が続いているのか」"}, {"t": 945.05, "x": "「というところで犯罪行為が\n終了した、終わったときという\n起算点が異なるわけでございまして」"}, {"t": 950.55, "x": "二つの見方があるのね。"}, {"t": 952.2833333333333, "x": "ああ。連れ去った、その瞬間で\n犯罪は終わっている、と見るのが一つ。"}, {"t": 956.5166666666667, "x": "連れ去られたままである限り、犯罪は\nまだ続いている、と見るのがもう一つだ。"}, {"t": 961.05, "x": "前者なら、時計はとっくに動き始めている。"}, {"t": 963.8, "x": "後者なら、時計はまだ動き出してすらいない。"}, {"t": 966.65, "x": "全然ちがうじゃない。どっちなの。"}, {"t": 968.7833333333333, "x": "それが、決まっていない。"}, {"t": 970.1333333333333, "x": "答弁の続きがこうだ。"}, {"t": 971.6833333333333, "x": "「そのいずれの時点を起算点とするかについては、\nこの点をめぐりまして裁判例、"}, {"t": 976.15, "x": "学説が種々分かれている、そういう\n見解が分かれているところであります」"}, {"t": 980.3666666666667, "x": "「これにつきましては、個々の事案の内容に応じまして\n司法の場で判断されるべきことでありまして」"}, {"t": 985.9333333333333, "x": "「法務当局として意見を申し上げる\n立場にはないということで\n御理解いただきたいと思います」"}, {"t": 991.1666666666666, "x": "国も、決めていないのね。"}, {"t": 992.95, "x": "決めていない。裁判所が\n判断することだ、と言っている。"}, {"t": 996.3666666666667, "x": "だから私は「この事件に時効は無い」とは\n言わない。言えない。"}, {"t": 1000.0833333333334, "x": "私が言えるのは、事実のほうだけだ。"}, {"t": 1002.5166666666667, "x": "泉佐野警察署に、捜査本部がいまもある。"}, {"t": 1005.3666666666667, "x": "そして警察庁は、今年もこの事件に\n懸賞広告を出し直した。"}, {"t": 1010.2166666666667, "x": "その懸賞金の仕組みを見ていく。"}, {"t": 1012.1333333333333, "x": "名前を「捜査特別報奨金」という。"}, {"t": 1014.7833333333333, "x": "警察庁の説明を、そのまま読む。"}, {"t": 1017.1666666666666, "x": "「捜査特別報奨金制度は、"}, {"t": 1019.0166666666667, "x": "警察庁が指定する事件に関し、民法第529条、\n第529条の2及び第532条の規定に基づき」"}, {"t": 1027.05, "x": "「重要凶悪事件等の検挙に結び付く有力な情報を\n提供した者に対して報奨金を支払う旨を広告し」"}, {"t": 1033.75, "x": "「有力な情報を提供した者のうち\n優等者に対して報奨金を支払うもの」"}, {"t": 1038.45, "x": "民法なのね。刑事の話なのに。"}, {"t": 1040.85, "x": "ああ。懸賞広告という、民法の仕組みを使っている。"}, {"t": 1044.1666666666667, "x": "「これをした人に、いくら払います」と広告を出す。\nその広告に法的な拘束力を持たせるための条文だ。"}, {"t": 1050.9166666666667, "x": "対象になる事件には、条件がある。"}, {"t": 1053.3, "x": "一つは、罪の種類。◯人、強盗、放火、\nそして略取誘拐などが挙げられている。"}, {"t": 1058.5666666666666, "x": "もう一つが、これだ。"}, {"t": 1059.9, "x": "「犯罪捜査規範第22条に基づく捜査本部開設事件」。"}, {"t": 1064.0166666666667, "x": "捜査本部が開かれている事件、ということ。"}, {"t": 1066.8333333333333, "x": "そうだ。ここが大事なところだ。"}, {"t": 1068.8166666666666, "x": "この事件に懸賞広告が\n出ているということは、捜査本部が現に\n開かれている、ということの裏付けになる。"}, {"t": 1075.15, "x": "条件はもう一つある。"}, {"t": 1076.6, "x": "「当該事案の内容、捜査の状況等に照らし、"}, {"t": 1079.4, "x": "広告を実施して情報提供を促進することが\n有効・適切と認められる事件」。"}, {"t": 1084.6, "x": "情報を集めることに、意味がある\n事件、ということかしら。"}, {"t": 1088.1166666666666, "x": "そう読める。逆に言えば、情報を集めても\n意味が無いと判断されたら、対象から外れる。"}, {"t": 1093.4833333333333, "x": "この事件は、いまも対象に入っている。"}, {"t": 1095.9333333333334, "x": "金額は、原則300万円が上限。"}, {"t": 1098.4333333333334, "x": "特に必要がある場合は1000万円を\n超えない範囲で増やせる。"}, {"t": 1102.1166666666666, "x": "払われない人も決まっている。"}, {"t": 1103.9166666666667, "x": "匿名の人、警察の職員、被疑者本人、共犯者。"}, {"t": 1107.7166666666667, "x": "それと、情報を手に入れる\n過程で自分が罪を犯した人。"}, {"t": 1111.3333333333333, "x": "そこまで決めてあるのね。"}, {"t": 1112.95, "x": "決めてある。民法の懸賞広告だから、払う\n相手をはっきりさせておく必要がある。"}, {"t": 1118.0, "x": "そして期間は「原則として1年間」。"}, {"t": 1120.75, "x": "1年で切れてしまうの。"}, {"t": 1122.4, "x": "条文にはこう書いてある。"}, {"t": 1123.75, "x": "「特に必要があると認める場合には、\n期間を延長又は短縮することがある」。"}, {"t": 1128.5166666666667, "x": "この「延長」が、この事件では何度も使われている。"}, {"t": 1132.55, "x": "大阪府警のページに、いま出ている\n懸賞広告の中身がそのまま載っている。"}, {"t": 1137.0333333333333, "x": "上限額、300万円。"}, {"t": 1138.8833333333334, "x": "資格者は「事件解決等に\n結びつく情報を提供された方」。"}, {"t": 1142.9666666666667, "x": "支払い方は「事件解決等への寄与の度合に\n応じて、上限額の範囲内でお支払いします」。"}, {"t": 1148.7833333333333, "x": "注意書きにこうある。"}, {"t": 1149.8833333333334, "x": "「情報提供された方の氏名等は公表しません。"}, {"t": 1152.75, "x": "秘密は厳守します」。"}, {"t": 1154.4, "x": "名前は出ないのね。"}, {"t": 1155.7, "x": "出ない。ただし、匿名で個人が特定できない\n場合は支払えない、とも書いてある。"}, {"t": 1160.4833333333333, "x": "そして期間だ。「令和8年7月2日から\n令和9年7月1日までの間」。"}, {"t": 1165.65, "x": "2026年の7月2日から、\n2027年の7月1日まで、ということだ。"}, {"t": 1171.3666666666666, "x": "実施者の欄には、こう書いてある。「警察庁長官」。"}, {"t": 1174.7, "x": "来年の7月まで、ということね。"}, {"t": 1177.1166666666666, "x": "ああ。そしてこの1年は、最初の1年ではない。"}, {"t": 1180.2333333333333, "x": "2026年の報道によれば、この延長は19回目だ。"}, {"t": 1184.15, "x": "19回。"}, {"t": 1185.1166666666666, "x": "1年ごとに区切って、そのたびに延ばす\n判断をしている。それが19回続いている。"}, {"t": 1190.2166666666667, "x": "警察庁のホームページには、\n懸賞広告の一覧が出ている。"}, {"t": 1193.9333333333334, "x": "「令和8年7月1日」の欄に、この事件の名前がある。"}, {"t": 1197.8166666666666, "x": "「泉南郡熊取町における小学生女児に対する\n未成年者略取誘拐事件」、大阪府警察。"}, {"t": 1203.7666666666667, "x": "他の事件と並んで、いまもそこに載っている。"}, {"t": 1207.1833333333334, "x": "この報奨金の仕組み自体は、そう古いものではない。"}, {"t": 1210.3666666666666, "x": "そして、国が先に始めたものでもない。"}, {"t": 1212.9833333333333, "x": "2007年10月25日、参議院の内閣委員会。"}, {"t": 1216.45, "x": "当時の国家公安委員長、泉信也氏が、\nそのあたりを答えている。"}, {"t": 1220.7333333333333, "x": "「この問題は、民間で先に実施され、"}, {"t": 1223.1333333333334, "x": "捜査協力に関する懸賞広告の中に直接事件と\n結び付きます事例がございました」"}, {"t": 1228.7, "x": "「具体的には五件、事件解決に\n結び付いた事例がございました」"}, {"t": 1232.8666666666666, "x": "民間が先にやっていたの。"}, {"t": 1234.7333333333333, "x": "ああ。遺族や、支援する人たちが自分で\nお金を出して、懸賞広告を出していた。"}, {"t": 1239.8, "x": "そして実際に、5件が解決につながっている。"}, {"t": 1242.8166666666666, "x": "国はそれを見て、あとから\n同じことを始めた、ということだ。"}, {"t": 1246.4666666666667, "x": "泉委員長は、そのときの事情もはっきり言っている。"}, {"t": 1249.5333333333333, "x": "「こうした状況が片方にある一方、\n警察の総力を挙げてもなかなか\n問題解決がうまく進まない」"}, {"t": 1255.5, "x": "「それは、国民の皆様方が警察との\nかかわりをある意味では少し避けておられる」"}, {"t": 1260.35, "x": "「情報の提供などもかつてのような\n状況にないということなどがございまして」"}, {"t": 1264.7166666666667, "x": "警察に話が来なくなっていた、ということかしら。"}, {"t": 1268.0333333333333, "x": "そう読める。国家公安委員長が、\n国会でそう言っている。"}, {"t": 1271.4833333333333, "x": "昔は、近所の人が警察に話をした。それが減った。"}, {"t": 1275.3, "x": "減った分を、どうやって埋めるか。"}, {"t": 1277.2666666666667, "x": "その答えの一つが、懸賞広告だった。"}, {"t": 1280.0333333333333, "x": "つまりこの300万円は、褒美ではない。"}, {"t": 1282.55, "x": "届かなくなった声を、もう\n一度届かせるための仕掛けだ。"}, {"t": 1286.65, "x": "同じ日の答弁で、泉委員長は、\n制度が始まった日付も述べている。"}, {"t": 1291.0166666666667, "x": "「未解決の重要凶悪事件に"}, {"t": 1292.8, "x": "関する情報提供を促進すると、そしてその検挙に\n資することを目的といたしまして」"}, {"t": 1298.1833333333334, "x": "「捜査特別報奨金制度というものを本年の四月一日から\n設けさせていただいたわけでございます」"}, {"t": 1304.0833333333333, "x": "「本年五月一日の第一回懸賞広告以降、\nこれまで国民を震撼させた強盗◯\n人や凶悪事件十四件について」"}, {"t": 1311.55, "x": "「最高額三百万円までの特別報奨金による\n懸賞広告を実施しておるところでございます」"}, {"t": 1317.4333333333334, "x": "14件から始まったのね。"}, {"t": 1319.4333333333334, "x": "ああ。そして、正直なことも言っている。"}, {"t": 1321.9833333333333, "x": "「この実施によりまして、残念ながらまだ\n検挙されたという事態には至っておりません」"}, {"t": 1326.8333333333333, "x": "そのうえで、効果をこう説明している。"}, {"t": 1329.1666666666667, "x": "「しかし、警察に寄せられます\n情報の件数が大幅に増加をしておりまして」"}, {"t": 1333.6666666666667, "x": "「例えば第一回広告では、この実施前は月に\n約十件余りの情報が、実施後は月三十四件に増える」"}, {"t": 1340.5, "x": "月10件が、34件。"}, {"t": 1342.6166666666666, "x": "ああ。3倍を超えている。"}, {"t": 1344.15, "x": "懸賞金は、犯人を捕まえるためのものというより、\n情報を集めるための仕掛けだ。"}, {"t": 1349.15, "x": "ここで一つ、思い出してほしいことがある。"}, {"t": 1351.7333333333333, "x": "この事件に寄せられた情報は、いま6424件ある。"}, {"t": 1355.6833333333334, "x": "20年目で5312件、23年目で6378件。\nそこから3年で1000件以上増えた。"}, {"t": 1362.7666666666667, "x": "その増え方にも、この仕組みが効いているのね。"}, {"t": 1365.65, "x": "そう考えるのが自然だろう。"}, {"t": 1367.3666666666666, "x": "毎年、期限が来るたびに報道される。"}, {"t": 1369.6666666666667, "x": "報道されるたびに、思い出す人がいる。"}, {"t": 1372.2333333333333, "x": "1年で区切ってあるのは、そのためでもある。"}, {"t": 1374.8333333333333, "x": "ずっと出しっぱなしにしていたら、誰も気づかない。"}, {"t": 1377.7666666666667, "x": "1年ごとに切って、そのたびに\n「まだ続けます」と出し直す。"}, {"t": 1381.8333333333333, "x": "そうやって、事件を世の中の表に戻している。"}, {"t": 1384.9333333333334, "x": "忘れられないように、わざと区切っているのね。"}, {"t": 1387.6833333333334, "x": "結果としては、そういう働きをしている。"}, {"t": 1390.8333333333333, "x": "では、この事件で実際に何が\n積み上がってきたのか。数字で見る。"}, {"t": 1394.8833333333334, "x": "関西テレビが20年目にまとめた\n特集では、こうなっていた。"}, {"t": 1398.6166666666666, "x": "投入された捜査員が、延べ10万6000人。"}, {"t": 1401.5, "x": "寄せられた情報が、5312件。"}, {"t": 1404.2833333333333, "x": "延べ10万人。"}, {"t": 1405.4166666666667, "x": "ああ。20年で、そこまで積み上がっている。"}, {"t": 1408.0833333333333, "x": "それから3年。2026年5月20日、\n23年目の報道ではこうだ。"}, {"t": 1413.0333333333333, "x": "大阪府警が、その年の5月10日までに\n投入した捜査員が、延べ12万189人。"}, {"t": 1418.9, "x": "寄せられた情報は、6378件。"}, {"t": 1421.9833333333333, "x": "さらにその先、2026年6月21日までで、\n情報は6424件になっている。"}, {"t": 1428.6166666666666, "x": "3年で、1万4000人近く増えているのね。"}, {"t": 1431.7833333333333, "x": "そうだ。つまり、いまも人が動いている。"}, {"t": 1434.2666666666667, "x": "過去に動いた人数の記録ではない。\nいま増えている数字だ。"}, {"t": 1437.6833333333334, "x": "情報のほうも、20年で5312件、23年で6378件。"}, {"t": 1443.1166666666666, "x": "3年で1000件以上増えている。"}, {"t": 1445.1833333333334, "x": "それだけ届いているのに、まだなのね。"}, {"t": 1447.6333333333334, "x": "ああ。6424件の情報が届いていて、\nそれでもまだ見つかっていない。"}, {"t": 1452.55, "x": "この二つの数字を並べると、苦しい。"}, {"t": 1454.95, "x": "ただ、私はこの数字を\n「無駄だった」という意味には使わない。"}, {"t": 1458.8333333333333, "x": "6424件のうち、まだ1件も\n当たっていない、ということでしかない。"}, {"t": 1463.6333333333334, "x": "残りの1件が来ていないだけだ。"}, {"t": 1465.7833333333333, "x": "その1件が、どこにあるか分からないのよね。"}, {"t": 1468.6, "x": "ああ。そして、持っている人が\n「自分は持っている」と気づいていないことがある。"}, {"t": 1473.25, "x": "2003年5月20日の午後に、あの道を\n車で通っただけ、という人がいる。"}, {"t": 1478.05, "x": "通りがかりに、黄色い\nリュックの子を見ただけ、という人がいる。"}, {"t": 1481.6, "x": "本人からすれば、何でもない記憶だ。"}, {"t": 1484.05, "x": "だから警察は「どんな些細な情報でも」と書いている。"}, {"t": 1487.4666666666667, "x": "価値があるかどうかを、こちらで\n決めないでくれ、ということだ。"}, {"t": 1491.4833333333333, "x": "こういう事件を、警察は\n「長期未解決事件」と呼んでいる。"}, {"t": 1495.2833333333333, "x": "その扱いについて、国会で答えているものがある。"}, {"t": 1498.3833333333334, "x": "2016年4月13日、参議院の決算委員会。"}, {"t": 1501.9, "x": "警察庁の刑事局長、三浦正充氏だ。"}, {"t": 1504.85, "x": "「これまで警察庁におきましては、"}, {"t": 1506.75, "x": "長期未解決事件の早期解決を\n目指すための地方警察官の増員を行ってまいりました」"}, {"t": 1512.4, "x": "「捜査特別報奨金制度の活用などによりまして\n国民からの情報提供の促進を図るとともに」"}, {"t": 1518.5, "x": "「有力情報の掘り下げ、"}, {"t": 1519.9333333333334, "x": "証拠資料の再鑑定等を実施することで\n長期未解決事件を一件でも多く\n検挙できるよう指導している」"}, {"t": 1526.2333333333333, "x": "再鑑定、って言ったわね。"}, {"t": 1528.0333333333333, "x": "ああ。当時の証拠を、いまの技術で\nもう一度調べ直すということだ。"}, {"t": 1532.0333333333333, "x": "それができるのは、証拠が残っているからだ。"}, {"t": 1534.7166666666667, "x": "ところが、同じ答弁にはこんな話も出てくる。"}, {"t": 1537.7, "x": "「未解決事件の証拠物件等を長期にわたり\n保管することは、収容能力や適切な管理の面からは"}, {"t": 1543.85, "x": "大きな負担になり得る」"}, {"t": 1545.2833333333333, "x": "……置いておく場所の話。"}, {"t": 1546.8166666666666, "x": "そうだ。身も蓋もない話だが、現実の話でもある。"}, {"t": 1550.45, "x": "事件の証拠は、どこかの棚に、\n箱に入って置かれている。"}, {"t": 1554.1, "x": "何十年も置いておけば、場所も\n要るし、管理する人も要る。"}, {"t": 1557.6666666666667, "x": "それでも置いておくという判断を、毎年している。"}, {"t": 1560.5166666666667, "x": "懸賞広告を1年ごとに出し直すのと、\nたぶん同じことだ。"}, {"t": 1564.4333333333334, "x": "まだ終わっていない、と決め続けているのね。"}, {"t": 1567.0833333333333, "x": "ああ。放っておいたら終わる。"}, {"t": 1568.6, "x": "終わらせないために、毎年決め直している。"}, {"t": 1571.9166666666667, "x": "この23年を、警察だけで\n持ちこたえてきたわけではない。"}, {"t": 1575.5666666666666, "x": "熊取町には、この事件のためにできた\n支援の団体がある。"}, {"t": 1579.2, "x": "NPO法人「あいうえお」という。"}, {"t": 1581.3, "x": "代表理事の三本松義春さんが、始めた\nきっかけをこう話している。"}, {"t": 1585.6333333333334, "x": "「友梨さんについて応援できることがないかなと\n警察に電話して連携とってもらって、"}, {"t": 1590.1833333333334, "x": "ビラ配りをしようというのが発端」"}, {"t": 1592.3333333333333, "x": "警察に、自分から電話したのね。"}, {"t": 1594.7666666666667, "x": "ああ。そこから始まっている。"}, {"t": 1596.5833333333333, "x": "そのときのことを、こうも言っている。"}, {"t": 1598.6666666666667, "x": "「まさかここまで来るとは\n思ってなかった、正直いって、1年か\n2年ですっと解決できると思っていた」"}, {"t": 1604.8, "x": "20年目の取材で、三本松さんは76歳になっていた。"}, {"t": 1608.7666666666667, "x": "そのときの言葉を、そのまま読む。"}, {"t": 1610.95, "x": "「やっぱり変わらへんな。"}, {"t": 1612.1666666666667, "x": "何とか無事で\n生きていてもらいたいなというだけなんで」"}, {"t": 1615.1333333333334, "x": "「見つける手伝いをしようと言ったんだから、\n見つかるまでやりましょうか、となったんでね」"}, {"t": 1619.8333333333333, "x": "「いつのまにか76歳になりましたから、\nこれからどこまでできるか分からんけど」"}, {"t": 1624.65, "x": "……1年か2年のつもりが。"}, {"t": 1626.45, "x": "ああ。20年たっていた。"}, {"t": 1628.0666666666666, "x": "この団体のビラ配りは、関西の外にも出ている。"}, {"t": 1631.2, "x": "全国を回るサーカス団に、\n協力を頼んだこともあるそうだ。"}, {"t": 1634.9166666666667, "x": "そして2026年、朝日新聞が、この団体が\n世代交代したことを報じている。"}, {"t": 1640.2166666666667, "x": "始めた人が続けられる年数を、事件のほうが\n超えてしまった、ということだ。"}, {"t": 1645.55, "x": "もう一人、続けている人たちがいる。"}, {"t": 1647.9, "x": "あの日、一緒に帰った同級生たちだ。"}, {"t": 1650.4, "x": "20年目の特集に出ていたみさとさんは、\nそのとき29歳になっていた。"}, {"t": 1655.0, "x": "その言葉を読む。"}, {"t": 1656.1666666666667, "x": "「寂しいですね、どんな感じになっていたんだろうって\nすごく思うし、何か想像できないっていうか」"}, {"t": 1661.6833333333334, "x": "「もう普通にこう、\n大人に、なっているはずやのに、いないっていうのは\n受け入れられない」"}, {"t": 1666.4, "x": "……同い年だものね。"}, {"t": 1667.7666666666667, "x": "ああ。自分が29歳になったから、分かることだ。"}, {"t": 1671.0166666666667, "x": "9歳の時点では、まだ分からなかったことだと思う。"}, {"t": 1674.1833333333334, "x": "みさとさんは、こうも話している。"}, {"t": 1676.2166666666667, "x": "「思い出されること自体がめちゃくちゃ\n少なくなってきているので」"}, {"t": 1679.7, "x": "「世間的にもだんだん忘れられていっていることに\nやっぱり危機感を持ってはいて、"}, {"t": 1683.9, "x": "忘れないでほしいなって。できることはやります」"}, {"t": 1686.75, "x": "別の同級生の言葉も出ている。"}, {"t": 1688.85, "x": "「もう見つかれへんよ、とひどいこと言う人もいるし、\n聞いてきたけれど、そんなこと全くないので」"}, {"t": 1694.3333333333333, "x": "「早く帰ってきてほしいし、会いたいなって」"}, {"t": 1696.9833333333333, "x": "そんなことを言う人がいるのね。"}, {"t": 1698.9166666666667, "x": "いる。だから私は、この動画で\nその種のことを言わない。"}, {"t": 1702.2333333333333, "x": "みさとさんの言葉を、もう一つだけ。"}, {"t": 1704.5666666666666, "x": "「どうやったらもう一回一緒に\n生きられるかを相談させてもらいたい」"}, {"t": 1708.7666666666667, "x": "2026年5月20日。"}, {"t": 1710.6333333333334, "x": "事件から、ちょうど23年の日だ。"}, {"t": 1713.1, "x": "その日、大阪市中央区の難波で、チラシが配られた。"}, {"t": 1716.5666666666666, "x": "場所は、大阪高島屋の前。"}, {"t": 1718.6333333333334, "x": "配ったのは、友梨さんのご両親と、NPO法人\n「あいうえお」、それに大阪府警の捜査第一課員。"}, {"t": 1724.7166666666667, "x": "合わせて27人だ。"}, {"t": 1726.2333333333333, "x": "配ったのは、チラシとポケットティッシュを\n組にしたもの。2000個。"}, {"t": 1730.1666666666667, "x": "熊取町じゃなくて、難波でやるのね。"}, {"t": 1732.7, "x": "ああ。人の多いところへ出ていく。"}, {"t": 1734.65, "x": "熊取町の中でいくら配っても、\n町の人はもう知っている。"}, {"t": 1738.3333333333333, "x": "知らない人のところへ持っていかないと、\n新しい情報は出てこない。"}, {"t": 1742.1833333333334, "x": "ポケットティッシュと\n組にしてあるのも、たぶん同じ理由だ。"}, {"t": 1745.5666666666666, "x": "チラシだけだと、受け取ってもらえないものね。"}, {"t": 1748.3333333333333, "x": "ああ。受け取ってもらえなければ、ゼロだ。"}, {"t": 1750.75, "x": "2000個というのは、\n2000回声をかけたということでもある。"}, {"t": 1754.1333333333334, "x": "それを23年、続けてこられた。"}, {"t": 1756.4166666666667, "x": "ご両親は、23年間これを続けてこられた。"}, {"t": 1759.5666666666666, "x": "私はここで、ご両親の今の暮らしのことは話さない。"}, {"t": 1762.9666666666667, "x": "報道されているのは\n「情報提供を呼びかけた」という事実までだ。"}, {"t": 1766.8333333333333, "x": "私もそこで止める。"}, {"t": 1768.4166666666667, "x": "それでいいと思うわ。"}, {"t": 1769.75, "x": "それと、その翌月。2026年の7月に、\n報奨金の延長が決まった。"}, {"t": 1775.0, "x": "19回目の延長だ。期間は、2027年の7月1日まで。"}, {"t": 1779.65, "x": "そのときの報道で、情報の件数が6424件と出ている。"}, {"t": 1784.0833333333333, "x": "つまり、こういうことだ。"}, {"t": 1785.55, "x": "ご両親が街頭に立ち、そのすぐあとに、\n国が「もう1年」と決めている。"}, {"t": 1790.85, "x": "最後に行く前に、もう一度だけ確かめておく。"}, {"t": 1793.7, "x": "私が今日、言わなかったことだ。"}, {"t": 1795.8, "x": "一つ。誰が関わったのか、という話をしていない。"}, {"t": 1799.1166666666666, "x": "警察が公表しているのは、目撃された車種までだ。\nそこから先は、私が足してはいけない。"}, {"t": 1805.0666666666666, "x": "二つ。事件なのか事故なのか、私は決めていない。"}, {"t": 1808.4833333333333, "x": "大阪府警が略取誘拐事件として\n扱っている。その事実を伝えただけだ。"}, {"t": 1813.4, "x": "ネットには、いろいろな話が出ているけれど。"}, {"t": 1816.1333333333334, "x": "出ている。私はそれを一つも扱わなかった。"}, {"t": 1819.1, "x": "根拠の無い説を並べると、それが\n「そういう話がある」という形で残ってしまう。"}, {"t": 1824.2, "x": "残ったものは、ご家族のところへ行く。"}, {"t": 1826.6, "x": "三つ。友梨さんを、過去の人として喋らなかった。"}, {"t": 1829.85, "x": "生きているか、そうでないか。"}, {"t": 1831.45, "x": "警察は、どちらも言っていない。"}, {"t": 1833.45, "x": "だから私も言わない。"}, {"t": 1834.9833333333333, "x": "それと、時効のことね。"}, {"t": 1836.7666666666667, "x": "ああ。あれも言い切らなかった。"}, {"t": 1838.4666666666667, "x": "国が「見解が分かれている」と答弁しているものを、\n私が代わりに決めるわけにいかない。"}, {"t": 1843.8333333333333, "x": "私が言えるのは、捜査本部が現にあること。"}, {"t": 1846.65, "x": "懸賞広告が、今年もう一度出されたこと。"}, {"t": 1849.5166666666667, "x": "この二つだけだ。そしてこの二つは、十分に重い。"}, {"t": 1853.5666666666666, "x": "ここからは、大阪府警が公開している\n連絡先を、そのまま読む。"}, {"t": 1857.7166666666667, "x": "宛先は、大阪府泉佐野警察署、\n捜査第一課、捜査本部。"}, {"t": 1862.1833333333334, "x": "郵便番号は、598の0007。"}, {"t": 1865.3833333333334, "x": "住所は、大阪府泉佐野市上町2丁目1番1号。"}, {"t": 1868.8833333333334, "x": "電話番号は、072の464の1234。"}, {"t": 1872.9666666666667, "x": "ファックス番号は、072の462の0854。"}, {"t": 1876.8333333333333, "x": "メールアドレスは、yuri@police.pref.osaka.jp。"}, {"t": 1880.5833333333333, "x": "ユー、アール、アイ。"}, {"t": 1881.65, "x": "友梨さんの名前だ。"}, {"t": 1883.0833333333333, "x": "……メールアドレスに、名前が入っているのね。"}, {"t": 1885.65, "x": "ああ。この事件のためだけに作られたものだ。"}, {"t": 1888.3666666666666, "x": "府警のページには、大阪府警のホームページから\n送れる送信フォームへの案内もある。"}, {"t": 1893.15, "x": "泉佐野警察署のページには、こう書いてある。"}, {"t": 1895.9333333333334, "x": "「警察では、関係機関、団体等と連携し、\n全力を挙げて捜索を続けています」"}, {"t": 1901.3, "x": "「どんな情報でも結構です。\nみなさんのご協力をお願い致します」"}, {"t": 1905.3, "x": "「捜査の都合がありますので、住所、\n氏名、電話番号をお知らせください」"}, {"t": 1909.6833333333334, "x": "「個人のプライバシーの保護には万全を\n期しておりますのでご安心ください」"}, {"t": 1913.7166666666667, "x": "思い出せることがあったら、\n私にではなく、ここへ届けてほしい。"}, {"t": 1917.5833333333333, "x": "2003年5月20日の午後、熊取町の七山。"}, {"t": 1920.9666666666667, "x": "白いブラウスの制服に、黄色いリュック。"}, {"t": 1923.4166666666667, "x": "家まで、あと400メートルのところだった。"}, {"t": 1926.1166666666666, "x": "どんな小さなことでも、いいのよね。"}, {"t": 1928.4, "x": "警察がそう書いている。"}, {"t": 1929.7166666666667, "x": "「どんな些細な情報でも結構です」と。"}, {"t": 1932.25, "x": "吉川友梨さんを、捜しています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
