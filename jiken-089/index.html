<script>
const D={"name": "089", "file": "089_編集用", "dur": 1940.1833125, "segs": [], "subs": [{"t": 0.0, "x": "2003年5月20日、火曜日。"}, {"t": 2.2666666666666666, "x": "午後3時ころ。"}, {"t": 3.316666666666667, "x": "大阪府泉南郡熊取町七山で、\n小学4年生の女の子が行方不明になった。"}, {"t": 8.616666666666667, "x": "名前は、吉川友梨さん。当時9歳だ。"}, {"t": 11.3, "x": "学校からの帰り道だった。"}, {"t": 13.266666666666667, "x": "家まで、どのくらいのところだったの。"}, {"t": 15.616666666666667, "x": "報道で確認できるのは、\nおよそ400メートルという数字だ。"}, {"t": 19.266666666666666, "x": "家まで、あと400メートル。"}, {"t": 21.1, "x": "その手前で、友梨さんの姿が分からなくなった。"}, {"t": 24.1, "x": "それから23年がたつ。"}, {"t": 25.883333333333333, "x": "友梨さんは、いまも見つかっていない。"}, {"t": 28.1, "x": "23年って。"}, {"t": 29.433333333333334, "x": "先に、この動画で守ることを言っておく。"}, {"t": 31.933333333333334, "x": "一つ。友梨さんのことを、過去の話として喋らない。"}, {"t": 35.333333333333336, "x": "生きているか、そうでないか。"}, {"t": 36.93333333333333, "x": "どちらも確定していない。だから\n私は、そこを前提にして話さない。"}, {"t": 41.36666666666667, "x": "二つ。犯人像を推測しない。"}, {"t": 43.43333333333333, "x": "事件なのか事故なのかも、私は断定しない。"}, {"t": 46.46666666666667, "x": "三つ。ネットで流れている説を並べない。"}, {"t": 48.93333333333333, "x": "連れ去り先がどうだ、という類の話は一切出さない。"}, {"t": 52.31666666666667, "x": "私が話すのは、大阪府警と警察庁が出しているもの、\n国会の会議録に残っているもの、"}, {"t": 58.05, "x": "報道されたことだけだ。"}, {"t": 59.78333333333333, "x": "分かったわ。"}, {"t": 60.733333333333334, "x": "そしてもう一つ。この事件は、終わっていない。"}, {"t": 63.61666666666667, "x": "捜査本部が、いまも置かれている。"}, {"t": 65.53333333333333, "x": "懸賞金も、今年また出し直されている。"}, {"t": 68.23333333333333, "x": "だから最後に、情報の届け先を、\n警察が出しているとおりにそのまま読む。"}, {"t": 72.86666666666666, "x": "今日はそこまで行く。"}, {"t": 74.71666666666667, "x": "まず、大阪府警のホームページに\n載っている文を、そのまま読む。"}, {"t": 78.5, "x": "「平成15年5月20日（火曜日）"}, {"t": 80.75, "x": "午後3時ころ、大阪府泉南郡熊取町七山から、"}, {"t": 84.23333333333333, "x": "吉川友梨さん（当時小学4年生）が\n行方不明になっています」"}, {"t": 88.51666666666667, "x": "短いのね。"}, {"t": 89.58333333333333, "x": "短い。これが公式の説明の全文だ。"}, {"t": 92.3, "x": "日付と、時刻と、場所と、学年。\nそれだけしか書いていない。"}, {"t": 96.36666666666666, "x": "この事件には、もっと長い正式な名前が付いている。"}, {"t": 99.65, "x": "「泉南郡熊取町における小学生女児に\n対する未成年者略取誘拐事件」。"}, {"t": 104.56666666666666, "x": "略取誘拐、っていう言い方をしているのね。"}, {"t": 107.21666666666667, "x": "ああ。そこは大事なところだ。"}, {"t": 109.06666666666666, "x": "行方不明、で止めていない。"}, {"t": 110.66666666666667, "x": "大阪府警は、略取誘拐の事件として扱っている。"}, {"t": 114.18333333333334, "x": "熊取町は、大阪の南のほうにある町だ。"}, {"t": 116.96666666666667, "x": "関西空港のある泉州の一角にある。"}, {"t": 119.48333333333333, "x": "七山は、その町の中の地名だ。"}, {"t": 121.88333333333334, "x": "府警は、その場所の写真を4枚、\nホームページに載せている。"}, {"t": 125.53333333333333, "x": "七山交差点の付近。交差点の付近から、最後に\n姿が確認された地点のほうを見たところ。"}, {"t": 131.56666666666666, "x": "そして最後に姿が確認された地点そのものを、\n西側からと、東側からの2方向。"}, {"t": 137.31666666666666, "x": "現場の写真を、警察が自分で出しているの。"}, {"t": 140.25, "x": "出している。地図のイラストも一緒に出ている。"}, {"t": 142.86666666666667, "x": "見た人に、その場所を思い出してほしいからだ。"}, {"t": 146.33333333333334, "x": "その日の帰り道のことは、関西テレビが\n20年目にまとめた特集で報じられている。"}, {"t": 151.46666666666667, "x": "友梨さんは、同級生3人と一緒に学校を出た。"}, {"t": 154.55, "x": "通学路の交差点で、その3人と別れて、一人になった。"}, {"t": 158.41666666666666, "x": "そのあと、午後3時ころ。"}, {"t": 160.11666666666667, "x": "自宅まで、およそ400メートルの\nところで、別の同級生とすれ違っている。"}, {"t": 164.81666666666666, "x": "それが、姿が確認されている最後だ。"}, {"t": 167.6, "x": "ほんの少しの距離じゃない。"}, {"t": 169.28333333333333, "x": "ああ。歩いて数分の距離だ。"}, {"t": 171.11666666666667, "x": "その特集には、一緒に帰った同級生が\n出ている。みさとさんという方だ。"}, {"t": 175.66666666666666, "x": "取材のとき、29歳になっていた。"}, {"t": 178.15, "x": "帰り道のことを、こう話している。"}, {"t": 180.16666666666666, "x": "「グリコしていた」。"}, {"t": 181.4, "x": "じゃんけんで、進む歩数が変わる、あの遊びね。"}, {"t": 184.46666666666667, "x": "そうだ。学校帰りに、道でやるやつだ。"}, {"t": 187.11666666666667, "x": "別れぎわのことも話している。"}, {"t": 188.83333333333334, "x": "「結構見えなくなるくらいまで\nよく見送っていたよな」。"}, {"t": 191.83333333333334, "x": "「カーブで見えなくなるまで」。"}, {"t": 193.3, "x": "「見えなくなって、よし帰ろう、みたいな感じ」。"}, {"t": 196.16666666666666, "x": "ちゃんと見送っていたのね。"}, {"t": 197.85, "x": "ああ。カーブの向こうへ消えるまで、見ていた。"}, {"t": 200.35, "x": "そのあと遊ぶ約束をしようとしたことも出てくる。"}, {"t": 203.25, "x": "「たぶん遊べるって言っていて、友梨は無理って」。"}, {"t": 205.83333333333334, "x": "「お母さん、とか家の人に聞かなあかんみたいな。"}, {"t": 208.45, "x": "行けたら行く、みたいな感じ」。"}, {"t": 210.48333333333332, "x": "……普通の、下校だったのね。"}, {"t": 212.38333333333333, "x": "ああ。そこまでは、本当に何でもない帰り道だ。"}, {"t": 215.5, "x": "その特集では、同級生たちが20年ぶりに、\nその道を実際に歩き直している。"}, {"t": 220.63333333333333, "x": "歩きながら、記憶をたどっている。"}, {"t": 222.68333333333334, "x": "「オレンジの看板とか、あの辺りのような気がする」。"}, {"t": 225.58333333333334, "x": "そして、こういう言葉が出てくる。"}, {"t": 227.63333333333333, "x": "「大きくなってしまったがゆえに、\nこの歩幅きついな」。"}, {"t": 230.73333333333332, "x": "……子どもの歩幅じゃ、なくなっているのね。"}, {"t": 233.2, "x": "ああ。同じ道を、同じようには歩けなくなっていた。"}, {"t": 236.33333333333334, "x": "20年というのは、そういう長さだ。"}, {"t": 239.25, "x": "大阪府警は、その日の友梨さんの服装と\n持ち物を、いまもホームページに載せている。"}, {"t": 244.21666666666667, "x": "これも府警の説明どおりに読む。"}, {"t": 246.18333333333334, "x": "制服は、熊取町立北小学校のもの。"}, {"t": 248.98333333333332, "x": "左胸に校章の入った白いブラウスと、スカート。"}, {"t": 252.33333333333334, "x": "靴下は、ピンク色に赤の星マークが入ったもの。"}, {"t": 255.48333333333332, "x": "靴は、アディダス製の22.0センチ。"}, {"t": 258.05, "x": "赤と黒の線が入った運動靴だ。"}, {"t": 260.4166666666667, "x": "そして、リュック。"}, {"t": 261.65, "x": "サンリオ製で、コロコロクリリンと書かれている。"}, {"t": 264.1333333333333, "x": "大きさは、およそ35×25センチ。"}, {"t": 267.06666666666666, "x": "黄色いリュックだ。"}, {"t": 268.26666666666665, "x": "そこまで細かく書いてあるのね。"}, {"t": 270.28333333333336, "x": "書いてある。イラストと、\n同じ品物の写真まで並べてある。"}, {"t": 274.0, "x": "メーカーの名前も、靴のサイズも、\nリュックの寸法も出ている。"}, {"t": 277.6166666666667, "x": "なぜここまで出すのか。"}, {"t": 279.06666666666666, "x": "見た人が、それを手がかりに\n思い出せるようにするためだ。"}, {"t": 282.4, "x": "顔は覚えていなくても、黄色いリュックは\n覚えている。そういうことがある。"}, {"t": 286.48333333333335, "x": "物のほうが、記憶に残るということね。"}, {"t": 289.1, "x": "ああ。公開捜査というのは、\nそういう作りになっている。"}, {"t": 292.31666666666666, "x": "ちなみに府警が出している友梨さんの写真は、一面に\n黄色いコスモスが咲いている場所で撮られたものだ。"}, {"t": 298.1333333333333, "x": "髪を二つに結んで、ピースサインをしている。"}, {"t": 301.46666666666664, "x": "府警が出しているのは、持ち物だけではない。"}, {"t": 304.1166666666667, "x": "友梨さんの体の特徴も、そのまま公表されている。"}, {"t": 307.4166666666667, "x": "生年月日は、平成6年3月31日。"}, {"t": 310.6166666666667, "x": "事件の日に9歳だ。"}, {"t": 312.2, "x": "身長は135センチ。体格は、細身。"}, {"t": 315.26666666666665, "x": "そして、特徴として二つ書いてある。"}, {"t": 317.73333333333335, "x": "右の小鼻に、1ミリほどのホクロ。"}, {"t": 320.05, "x": "右の尻の下のほうに、1センチほどのあざ。"}, {"t": 322.9166666666667, "x": "……1ミリ。"}, {"t": 323.71666666666664, "x": "ああ。1ミリだ。"}, {"t": 324.8666666666667, "x": "これは、人相書きというより、見分けるための印だ。"}, {"t": 328.15, "x": "年月がたって顔つきが変わっても、\nこういう印は残ることがある。"}, {"t": 332.0833333333333, "x": "だから警察は、消えにくいものを選んで出している。"}, {"t": 335.05, "x": "府警は、いまの友梨さんの想像図も2枚公開している。"}, {"t": 338.35, "x": "髪型がロングのものと、ショートのもの。"}, {"t": 340.8, "x": "当時の顔写真から、年齢を重ねたら\nどうなるかを描いたものだ。"}, {"t": 344.78333333333336, "x": "どうして2枚あるのかしら。"}, {"t": 346.48333333333335, "x": "髪型が分からないからだ。"}, {"t": 348.18333333333334, "x": "23年のあいだに、どんな髪型になっているかは\n誰にも分からない。"}, {"t": 352.23333333333335, "x": "だから、長い場合と短い場合の両方を出している。"}, {"t": 355.46666666666664, "x": "……9歳の写真から、大人の顔を描くのね。"}, {"t": 358.35, "x": "ああ。想像図というのは、そういうものだ。"}, {"t": 360.85, "x": "友梨さんは、平成6年3月31日生まれだ。"}, {"t": 364.26666666666665, "x": "2026年の5月の時点で、32歳になっている。"}, {"t": 368.1166666666667, "x": "いまの姿を、描いて出しているのね。"}, {"t": 370.55, "x": "出している。それと、4分39秒の動画も\n府警が公開している。"}, {"t": 374.95, "x": "「吉川友梨さんを捜しています」という\n題の、情報提供を呼びかける動画だ。"}, {"t": 379.6, "x": "私がここで並べているものは、全部、\n警察が自分で世に出しているものだ。"}, {"t": 384.28333333333336, "x": "私が調べ上げたことではない。"}, {"t": 386.05, "x": "誰でも、いま開けば見られる。"}, {"t": 388.53333333333336, "x": "府警のページには、もう一つ、\n具体的なものが出ている。"}, {"t": 392.03333333333336, "x": "車だ。"}, {"t": 392.76666666666665, "x": "「事件発生前や発生当時に、次の車種が\n不審車両として目撃されています」。こう書いてある。"}, {"t": 398.65, "x": "出ているのは4車種だ。"}, {"t": 400.1166666666667, "x": "一つ目、トヨタのカムリ。"}, {"t": 401.7, "x": "ビスタと書かれている。"}, {"t": 402.95, "x": "型式はイー・ブイ・ゼット・ブイ・にじゅう。"}, {"t": 405.76666666666665, "x": "1987年4月からの車だ。"}, {"t": 408.65, "x": "二つ目、トヨタのクラウン。"}, {"t": 410.23333333333335, "x": "130系、8代目。1987年から\n1991年まで作られていたものだ。"}, {"t": 416.78333333333336, "x": "三つ目、日産のセドリック、グロリア。"}, {"t": 419.15, "x": "Y32型。1991年6月からの車。"}, {"t": 423.15, "x": "四つ目、同じくセドリック、グロリアのY33型。"}, {"t": 426.56666666666666, "x": "1995年6月からの車だ。"}, {"t": 429.53333333333336, "x": "年式まで出てるのね。"}, {"t": 431.15, "x": "出ている。府警は、それぞれの車の写真も\n前と後ろから載せている。"}, {"t": 435.31666666666666, "x": "ここで一つ、はっきりさせておく。"}, {"t": 437.5, "x": "府警が書いているのは「不審車両として\n目撃されている車種」までだ。"}, {"t": 441.8333333333333, "x": "「犯人の車」とは、一言も書いていない。"}, {"t": 444.7, "x": "だから私も、そこから先には行かない。"}, {"t": 447.4166666666667, "x": "目撃された車の種類、というだけなのね。"}, {"t": 450.35, "x": "ああ。それ以上の意味を私が\n足したら、それはもう報道ではない。"}, {"t": 454.05, "x": "ただ、この4車種が並んでいること\n自体が、一つのことを語っている。"}, {"t": 458.3333333333333, "x": "23年たっても、警察がまだ「思い出してほしい」と\n言い続けている、ということだ。"}, {"t": 464.28333333333336, "x": "ここまで見てきたものは、全部\n「公開捜査」と呼ばれるやり方だ。"}, {"t": 468.43333333333334, "x": "警察が持っている情報を、あえて外に出す。"}, {"t": 471.2, "x": "そうして、見た人の記憶のほうから\n手がかりが返ってくるのを待つ。"}, {"t": 475.2, "x": "捜査の情報って、ふつうは出さないものじゃないの。"}, {"t": 478.26666666666665, "x": "ああ。出さないのが普通だ。"}, {"t": 479.95, "x": "捜査の中身を出せば、それを知った\n側が動いてしまう。だから伏せる。"}, {"t": 484.05, "x": "それでも出すのは、出さないと届かないところにしか\n手がかりが無い、と判断したときだ。"}, {"t": 489.21666666666664, "x": "この事件で府警が出しているものを、\nもう一度数えてみる。"}, {"t": 492.55, "x": "当時の顔写真。いまの想像図が2枚。"}, {"t": 494.8833333333333, "x": "服装のイラストと、同じ品物の写真。"}, {"t": 497.6666666666667, "x": "現場の写真が4枚と、地図のイラスト。"}, {"t": 500.1166666666667, "x": "目撃された車種が4つ。"}, {"t": 501.96666666666664, "x": "身長、体格、ホクロ、あざ。そして4分39秒の動画。"}, {"t": 506.45, "x": "ずいぶん、たくさん出しているのね。"}, {"t": 508.55, "x": "出せるものは、ほとんど出している。"}, {"t": 510.6, "x": "この事件は、大阪府警のページだけに\n載っているわけでもない。"}, {"t": 514.2, "x": "熊取町が、町の公式サイトに\n「吉川友梨さん捜索依頼」という\nページを置き続けている。"}, {"t": 520.0, "x": "それから、奈良県警も\n自分のところのサイトに載せている。"}, {"t": 523.4166666666666, "x": "題は「吉川友梨さんを探しています。"}, {"t": 525.7833333333333, "x": "大阪府警察からのお願い」。"}, {"t": 527.85, "x": "よその県の警察が、載せているの。"}, {"t": 530.3166666666667, "x": "載せている。府県の境の外まで、\n届かせようとしているということだ。"}, {"t": 534.5833333333334, "x": "大阪府警のページの、呼びかけの部分も読んでおく。"}, {"t": 537.7166666666667, "x": "「事件に関するどんな情報でも結構です。\nお心あたりのある方はご連絡ください」。"}, {"t": 542.65, "x": "ページの終わりには、こうも書いてある。"}, {"t": 544.7333333333333, "x": "「どんな些細な情報でも結構ですので、\n情報をお持ちの方はご連絡ください。"}, {"t": 549.1833333333333, "x": "ご協力をお願いします」。"}, {"t": 550.9833333333333, "x": "二回、同じことを書いてあるのね。"}, {"t": 553.2, "x": "ああ。同じページの上と下で、二回書いてある。"}, {"t": 556.15, "x": "役所の文章としては、くどいくらいだ。"}, {"t": 558.6, "x": "それだけ、一件でも多く\n届いてほしいということだろう。"}, {"t": 562.45, "x": "ここで、国会の記録を見てみる。"}, {"t": 564.5666666666667, "x": "国立国会図書館の会議録検索で「吉川友梨」と\n入れると、出てくるのは1件だけだ。"}, {"t": 570.4666666666667, "x": "1件。"}, {"t": 571.2166666666667, "x": "ああ。国会の記録の全部を通して、1件しかない。"}, {"t": 574.5166666666667, "x": "2004年3月2日。"}, {"t": 576.0833333333334, "x": "衆議院の予算委員会、第七分科会。"}, {"t": 578.7833333333333, "x": "発言しているのは、長安豊という分科員だ。"}, {"t": 581.6666666666666, "x": "地元が、その泉州にあたる。"}, {"t": 583.7833333333333, "x": "発言をそのまま読む。"}, {"t": 585.25, "x": "「私の地元泉州では、"}, {"t": 586.7833333333333, "x": "昨年の五月二十日に熊取町で\n小学校四年生の吉川友梨ちゃんが\n行方不明になって、これは"}, {"t": 592.65, "x": "誘拐か神隠しかわからない」"}, {"t": 594.5166666666667, "x": "「もう九カ月以上が過ぎているけれども、\nいまだに行方がわからないという状況にあります」"}, {"t": 599.45, "x": "続きがある。"}, {"t": 600.35, "x": "「私、昨年選挙を控えておりましたので、"}, {"t": 603.0333333333333, "x": "政治の道具にするのはいかがと思いまして、\n発言を控えておりましたけれども」"}, {"t": 607.7166666666667, "x": "「私、家が近いということもございまして、"}, {"t": 610.2333333333333, "x": "友梨ちゃんが一日も早く出てきてくれるように、または"}, {"t": 613.3333333333334, "x": "見つかるように努力していきたいなと\n思っておる次第でございます」"}, {"t": 616.9333333333333, "x": "……近所の人だったのね。"}, {"t": 618.5833333333334, "x": "ああ。国会議員である前に、\n近所の人として喋っている。"}, {"t": 622.15, "x": "この日の質疑そのものは、この事件がお題ではない。"}, {"t": 625.25, "x": "中心は、ICタグと、食べ物の安全の話だ。"}, {"t": 628.5666666666667, "x": "冒頭で地元の話をするところに、この事件が出てくる。"}, {"t": 632.0666666666667, "x": "国の記録に残っているのは、これで全部だ。"}, {"t": 635.4333333333333, "x": "ただ、長安分科員の発言には、続きがある。"}, {"t": 638.5, "x": "ここが今日いちばん大事なところだと私は思っている。"}, {"t": 641.5833333333334, "x": "「このような事件が起こりますと、地元の\nお子さんをお持ちの親御さんからしますと」"}, {"t": 646.1, "x": "「学校の行き帰りに何かあるんじゃないかというような\n不安を持たれて、心配が多いかと思います」"}, {"t": 651.4333333333333, "x": "「そういった意味でも、そういった治安を\n守るための政策をしていかなければならない」"}, {"t": 655.9666666666667, "x": "「一義的には、例えば警察を増員する、\nそういったことも必要ですけれども」"}, {"t": 660.7166666666667, "x": "「警察だけでは見張り切れない、見ることが、\n目が届かない、そういうこともございますので」"}, {"t": 665.8666666666667, "x": "「例えば地域がみんなで\n治安維持のために協力していく」"}, {"t": 669.2166666666667, "x": "警察だけでは無理だ、って言っているのね。"}, {"t": 671.7666666666667, "x": "ああ。2004年の3月に、そう言っている。"}, {"t": 674.4833333333333, "x": "この「学校の行き帰り」という\n言い方に注目してほしい。"}, {"t": 678.0166666666667, "x": "事件そのものの捜査を求めているのではない。"}, {"t": 680.6333333333333, "x": "次の子が同じ目に\n遭わないように、という話をしている。"}, {"t": 683.8833333333333, "x": "友梨さんが行方不明になったのは、通学路だ。"}, {"t": 686.5666666666667, "x": "時刻は午後3時ころ。"}, {"t": 688.1166666666667, "x": "家に帰る途中の、昼間の道だった。"}, {"t": 690.7333333333333, "x": "夜でもない、知らない場所でもない。"}, {"t": 692.9666666666667, "x": "そうだ。毎日通っている道の、明るい時間だ。"}, {"t": 696.15, "x": "この「毎日通っている道の、明るい\n時間」というのが、このあと国の課題になっていく。"}, {"t": 702.2333333333333, "x": "2005年12月16日。"}, {"t": 704.1166666666667, "x": "衆議院の、青少年問題に関する特別委員会。"}, {"t": 707.5833333333334, "x": "横山北斗という委員が、\n警察庁のデータを引いて質問している。"}, {"t": 711.6333333333333, "x": "そのまま読む。"}, {"t": 712.6, "x": "「まず、下校時の安全対策につきまして、\n十五歳以下の子供の略取誘拐、\n警察庁のデータによれば」"}, {"t": 719.0, "x": "「時間帯は十五時から十八時、\n場所は通学路での発生、これが\n全体の半数を占めるということです」"}, {"t": 725.2166666666667, "x": "……午後3時から6時。通学路。"}, {"t": 727.4, "x": "ああ。その二つが重なるものが、半分だ。"}, {"t": 730.2833333333333, "x": "友梨さんの場合が、そのままそれにあたる。"}, {"t": 732.7166666666667, "x": "午後3時ころ、通学路。"}, {"t": 734.4333333333333, "x": "つまりこれは、この事件だけの特別な\n条件ではなかった、ということだ。"}, {"t": 738.85, "x": "横山委員の発言には、続きがある。"}, {"t": 741.3166666666667, "x": "「対策として、防犯カメラを設置する、\n防犯マニュアルを作成する、\n学校と警察との連携を深める」"}, {"t": 747.7166666666667, "x": "「地域住民による\n防犯パトロールの強化、あるいは子供たちみずからが\nみずからを守るための訓練をする」"}, {"t": 753.65, "x": "「そういう教育プログラムの実施など、\n数多くの努力が展開されてきているわけですが」"}, {"t": 758.6666666666666, "x": "そのうえで、現場の人たちの意見を\n二つにまとめている。"}, {"t": 762.0833333333334, "x": "「まず大人の目をふやすということ、それと"}, {"t": 764.3, "x": "子供を一人にしない、この二点がとりわけ\n重要であると考えられております」"}, {"t": 768.85, "x": "大人の目を増やす。子供を一人にしない。"}, {"t": 771.5166666666667, "x": "ああ。ずいぶん素朴な結論に見えるだろう。"}, {"t": 774.0, "x": "だが、国会で出てきた答えは、これだ。"}, {"t": 777.2166666666667, "x": "この2005年の終わりから2006年の初めというのは、"}, {"t": 780.3833333333333, "x": "国会で子どもの安全がずっと議論されていた時期だ。"}, {"t": 783.6333333333333, "x": "2006年1月17日、参議院の内閣委員会で、\n当時の国家公安委員長、\n沓掛哲男氏がこう述べている。"}, {"t": 790.95, "x": "「昨年の十一月以降、"}, {"t": 792.4666666666667, "x": "女子児童が◯害されるという誠に痛ましい事件が\n続発し、国民に大きな不安を与えております」"}, {"t": 798.5166666666667, "x": "ここで触れられているのは、\n広島と栃木で起きた別の事件だ。"}, {"t": 802.3166666666667, "x": "友梨さんの事件ではない。そこは混ぜない。"}, {"t": 804.8333333333334, "x": "別の事件なのね。"}, {"t": 806.2666666666667, "x": "別だ。どちらも、お子さんが亡くなっている事件だ。"}, {"t": 809.3, "x": "私はその中身には入らない。"}, {"t": 811.3333333333334, "x": "私が言いたいのは、並び方のほうだ。"}, {"t": 813.7666666666667, "x": "2003年に熊取町。"}, {"t": 815.3333333333334, "x": "2004年に国会で「学校の行き帰り」。"}, {"t": 818.0666666666667, "x": "2005年の終わりに別の事件が続いて、国会が動く。"}, {"t": 821.6166666666667, "x": "そして「大人の目をふやす」\n「子供を一人にしない」という答えが出る。"}, {"t": 825.8, "x": "いま、学校の行き帰りに黄色い\n旗を持って立っている人がいる。"}, {"t": 829.5, "x": "通学路に、見守りのボランティアの方が立っている。"}, {"t": 832.6333333333333, "x": "あれって、いつからあるものなのかしら。"}, {"t": 835.0, "x": "全国に広がったのは、まさにこのころだ。"}, {"t": 837.6833333333333, "x": "熊取町の、友梨さんが歩いていた\n地区にも、それをやっている方がいる。"}, {"t": 841.9166666666666, "x": "佐々木茂之さんという方だ。"}, {"t": 843.7, "x": "取材のとき80歳だった。"}, {"t": 845.6833333333333, "x": "毎日、登校する子どもたちを見守っている。"}, {"t": 849.0833333333334, "x": "ここから、少し込み入った話をする。"}, {"t": 851.5333333333333, "x": "この事件に、時効はあるのか、という話だ。"}, {"t": 854.55, "x": "23年たっているのよね。まだ\n捜査しているということは、時効が無いのかしら。"}, {"t": 859.4666666666667, "x": "そこが、簡単に言い切れないところだ。"}, {"t": 861.8166666666667, "x": "2010年に、公訴時効が廃止された罪がある。"}, {"t": 864.75, "x": "人を死亡させた罪のうち、死刑にあたるものだ。"}, {"t": 867.9166666666666, "x": "◯人などがそれにあたる。"}, {"t": 869.3333333333334, "x": "この改正は、遺族の方たちが\n長く求めて、実現したものだ。"}, {"t": 873.55, "x": "だが、この事件は\n「未成年者略取誘拐事件」として扱われている。"}, {"t": 878.0666666666667, "x": "人を死亡させた罪ではない。だから\n2010年の廃止の対象ではない。"}, {"t": 882.45, "x": "……それは、亡くなったことになっていない、\nということでもあるのよね。"}, {"t": 886.2333333333333, "x": "ああ。そこは、そのとおりだ。"}, {"t": 888.0666666666667, "x": "警察は、友梨さんが亡くなったという\n前提を取っていない。"}, {"t": 891.3833333333333, "x": "だから罪名も「略取誘拐」のままだ。"}, {"t": 894.0666666666667, "x": "この事件が2010年の改正で\n救われないのは、そういう理由でもある。"}, {"t": 898.4, "x": "じゃあ、時効はあるということ。"}, {"t": 900.25, "x": "そこで出てくるのが「起算点」という言葉だ。"}, {"t": 903.1166666666667, "x": "時効というのは、いつから数え始めるのか。"}, {"t": 905.8166666666667, "x": "法律では「犯罪行為が終わったとき」から\n数える、となっている。"}, {"t": 909.8, "x": "これを国会で答えているのが、\n2002年10月10日、参議院の外交防衛委員会だ。"}, {"t": 915.15, "x": "答えているのは、\n当時の法務省刑事局長、樋渡利秋氏。"}, {"t": 919.1833333333333, "x": "「公訴時効は一般論で申し上げますと\n犯罪行為が終わったときから\n進行することになっております」"}, {"t": 924.9333333333333, "x": "終わったとき、から。"}, {"t": 926.3833333333333, "x": "ああ。では、略取誘拐は、いつ\n「終わった」ことになるのか。"}, {"t": 930.2833333333333, "x": "ここが、決まっていない。"}, {"t": 932.4333333333333, "x": "同じ答弁の続きを読む。"}, {"t": 933.9666666666667, "x": "少し長いが、そのまま読む価値がある。"}, {"t": 936.5166666666667, "x": "「略取・誘拐の罪の性質でございますが、これも"}, {"t": 940.0333333333333, "x": "委員御指摘のように、それを\n継続犯と見るか状態犯と見るか」"}, {"t": 943.4833333333333, "x": "「すなわち、まだ犯罪が終わっていないと見るのか、"}, {"t": 946.2, "x": "既に犯罪が既遂に達してあとは\n違法状態が続いているのか」"}, {"t": 950.0333333333333, "x": "「というところで犯罪行為が\n終了した、終わったときという\n起算点が異なるわけでございまして」"}, {"t": 955.55, "x": "二つの見方があるのね。"}, {"t": 957.2666666666667, "x": "ああ。連れ去った、その瞬間で\n犯罪は終わっている、と見るのが一つ。"}, {"t": 961.5, "x": "連れ去られたままである限り、犯罪は\nまだ続いている、と見るのがもう一つだ。"}, {"t": 966.0333333333333, "x": "前者なら、時計はとっくに動き始めている。"}, {"t": 968.7833333333333, "x": "後者なら、時計はまだ動き出してすらいない。"}, {"t": 971.6333333333333, "x": "全然ちがうじゃない。どっちなの。"}, {"t": 973.7666666666667, "x": "それが、決まっていない。"}, {"t": 975.1166666666667, "x": "答弁の続きがこうだ。"}, {"t": 976.6666666666666, "x": "「そのいずれの時点を起算点とするかについては、\nこの点をめぐりまして裁判例、"}, {"t": 981.1333333333333, "x": "学説が種々分かれている、そういう\n見解が分かれているところであります」"}, {"t": 985.35, "x": "「これにつきましては、個々の事案の内容に応じまして\n司法の場で判断されるべきことでありまして」"}, {"t": 990.9333333333333, "x": "「法務当局として意見を申し上げる\n立場にはないということで\n御理解いただきたいと思います」"}, {"t": 996.15, "x": "国も、決めていないのね。"}, {"t": 997.95, "x": "決めていない。裁判所が\n判断することだ、と言っている。"}, {"t": 1001.35, "x": "だから私は「この事件に時効は無い」とは\n言わない。言えない。"}, {"t": 1005.0666666666667, "x": "私が言えるのは、事実のほうだけだ。"}, {"t": 1007.5, "x": "泉佐野警察署に、捜査本部がいまもある。"}, {"t": 1010.35, "x": "そして警察庁は、今年もこの事件に\n懸賞広告を出し直した。"}, {"t": 1015.2, "x": "その懸賞金の仕組みを見ていく。"}, {"t": 1017.1, "x": "名前を「捜査特別報奨金」という。"}, {"t": 1019.7666666666667, "x": "警察庁の説明を、そのまま読む。"}, {"t": 1022.15, "x": "「捜査特別報奨金制度は、"}, {"t": 1024.0, "x": "警察庁が指定する事件に関し、民法第529条、\n第529条の2及び第532条の規定に基づき」"}, {"t": 1032.0333333333333, "x": "「重要凶悪事件等の検挙に結び付く有力な情報を\n提供した者に対して報奨金を支払う旨を広告し」"}, {"t": 1038.7333333333333, "x": "「有力な情報を提供した者のうち\n優等者に対して報奨金を支払うもの」"}, {"t": 1043.4333333333334, "x": "民法なのね。刑事の話なのに。"}, {"t": 1045.8333333333333, "x": "ああ。懸賞広告という、民法の仕組みを使っている。"}, {"t": 1049.15, "x": "「これをした人に、いくら払います」と広告を出す。\nその広告に法的な拘束力を持たせるための条文だ。"}, {"t": 1055.9, "x": "対象になる事件には、条件がある。"}, {"t": 1058.2833333333333, "x": "一つは、罪の種類。◯人、強盗、放火、\nそして略取誘拐などが挙げられている。"}, {"t": 1063.55, "x": "もう一つが、これだ。"}, {"t": 1064.8833333333334, "x": "「犯罪捜査規範第22条に基づく捜査本部開設事件」。"}, {"t": 1069.0, "x": "捜査本部が開かれている事件、ということ。"}, {"t": 1071.8166666666666, "x": "そうだ。ここが大事なところだ。"}, {"t": 1073.8, "x": "この事件に懸賞広告が\n出ているということは、捜査本部が現に\n開かれている、ということの裏付けになる。"}, {"t": 1080.1333333333334, "x": "条件はもう一つある。"}, {"t": 1081.5833333333333, "x": "「当該事案の内容、捜査の状況等に照らし、"}, {"t": 1084.3833333333334, "x": "広告を実施して情報提供を促進することが\n有効・適切と認められる事件」。"}, {"t": 1089.6, "x": "情報を集めることに、意味がある\n事件、ということかしら。"}, {"t": 1093.1, "x": "そう読める。逆に言えば、情報を集めても\n意味が無いと判断されたら、対象から外れる。"}, {"t": 1098.4666666666667, "x": "この事件は、いまも対象に入っている。"}, {"t": 1100.9333333333334, "x": "金額は、原則300万円が上限。"}, {"t": 1103.4166666666667, "x": "特に必要がある場合は1000万円を\n超えない範囲で増やせる。"}, {"t": 1106.9333333333334, "x": "払われない人も決まっている。"}, {"t": 1108.7333333333333, "x": "匿名の人、警察の職員、被疑者本人、共犯者。"}, {"t": 1112.5333333333333, "x": "それと、情報を手に入れる\n過程で自分が罪を犯した人。"}, {"t": 1116.15, "x": "そこまで決めてあるのね。"}, {"t": 1117.7666666666667, "x": "決めてある。民法の懸賞広告だから、払う\n相手をはっきりさせておく必要がある。"}, {"t": 1122.8166666666666, "x": "そして期間は「原則として1年間」。"}, {"t": 1125.5666666666666, "x": "1年で切れてしまうの。"}, {"t": 1127.2166666666667, "x": "条文にはこう書いてある。"}, {"t": 1128.55, "x": "「特に必要があると認める場合には、\n期間を延長又は短縮することがある」。"}, {"t": 1133.3333333333333, "x": "この「延長」が、この事件では何度も使われている。"}, {"t": 1137.3666666666666, "x": "大阪府警のページに、いま出ている\n懸賞広告の中身がそのまま載っている。"}, {"t": 1141.85, "x": "上限額、300万円。"}, {"t": 1143.7, "x": "資格者は「事件解決等に\n結びつく情報を提供された方」。"}, {"t": 1147.7666666666667, "x": "支払い方は「事件解決等への寄与の度合に\n応じて、上限額の範囲内でお支払いします」。"}, {"t": 1153.6, "x": "注意書きにこうある。"}, {"t": 1154.7, "x": "「情報提供された方の氏名等は公表しません。"}, {"t": 1157.55, "x": "秘密は厳守します」。"}, {"t": 1159.2166666666667, "x": "名前は出ないのね。"}, {"t": 1160.5166666666667, "x": "出ない。ただし、匿名で個人が特定できない\n場合は支払えない、とも書いてある。"}, {"t": 1165.2833333333333, "x": "そして期間だ。「令和8年7月2日から\n令和9年7月1日までの間」。"}, {"t": 1170.45, "x": "2026年の7月2日から、\n2027年の7月1日まで、ということだ。"}, {"t": 1176.1833333333334, "x": "実施者の欄には、こう書いてある。「警察庁長官」。"}, {"t": 1179.5166666666667, "x": "来年の7月まで、ということね。"}, {"t": 1181.9333333333334, "x": "ああ。そしてこの1年は、最初の1年ではない。"}, {"t": 1185.05, "x": "2026年の報道によれば、この延長は19回目だ。"}, {"t": 1188.9666666666667, "x": "19回。"}, {"t": 1189.9333333333334, "x": "1年ごとに区切って、そのたびに延ばす\n判断をしている。それが19回続いている。"}, {"t": 1195.0333333333333, "x": "警察庁のホームページには、\n懸賞広告の一覧が出ている。"}, {"t": 1198.75, "x": "「令和8年7月1日」の欄に、この事件の名前がある。"}, {"t": 1202.6333333333334, "x": "「泉南郡熊取町における小学生女児に対する\n未成年者略取誘拐事件」、大阪府警察。"}, {"t": 1208.5666666666666, "x": "他の事件と並んで、いまもそこに載っている。"}, {"t": 1212.0, "x": "この報奨金の仕組み自体は、そう古いものではない。"}, {"t": 1215.1833333333334, "x": "そして、国が先に始めたものでもない。"}, {"t": 1217.8, "x": "2007年10月25日、参議院の内閣委員会。"}, {"t": 1221.2666666666667, "x": "当時の国家公安委員長、泉信也氏が、\nそのあたりを答えている。"}, {"t": 1225.5333333333333, "x": "「この問題は、民間で先に実施され、"}, {"t": 1227.9333333333334, "x": "捜査協力に関する懸賞広告の中に直接事件と\n結び付きます事例がございました」"}, {"t": 1233.5166666666667, "x": "「具体的には五件、事件解決に\n結び付いた事例がございました」"}, {"t": 1237.6833333333334, "x": "民間が先にやっていたの。"}, {"t": 1239.55, "x": "ああ。遺族や、支援する人たちが自分で\nお金を出して、懸賞広告を出していた。"}, {"t": 1244.6166666666666, "x": "そして実際に、5件が解決につながっている。"}, {"t": 1247.6166666666666, "x": "国はそれを見て、あとから\n同じことを始めた、ということだ。"}, {"t": 1251.2666666666667, "x": "泉委員長は、そのときの事情もはっきり言っている。"}, {"t": 1254.35, "x": "「こうした状況が片方にある一方、\n警察の総力を挙げてもなかなか\n問題解決がうまく進まない」"}, {"t": 1260.3166666666666, "x": "「それは、国民の皆様方が警察との\nかかわりをある意味では少し避けておられる」"}, {"t": 1265.1666666666667, "x": "「情報の提供などもかつてのような\n状況にないということなどがございまして」"}, {"t": 1269.5333333333333, "x": "警察に話が来なくなっていた、ということかしら。"}, {"t": 1272.8333333333333, "x": "そう読める。国家公安委員長が、\n国会でそう言っている。"}, {"t": 1276.2833333333333, "x": "昔は、近所の人が警察に話をした。それが減った。"}, {"t": 1280.1166666666666, "x": "減った分を、どうやって埋めるか。"}, {"t": 1282.0833333333333, "x": "その答えの一つが、懸賞広告だった。"}, {"t": 1284.85, "x": "つまりこの300万円は、褒美ではない。"}, {"t": 1287.3666666666666, "x": "届かなくなった声を、もう\n一度届かせるための仕掛けだ。"}, {"t": 1291.45, "x": "同じ日の答弁で、泉委員長は、\n制度が始まった日付も述べている。"}, {"t": 1295.8166666666666, "x": "「未解決の重要凶悪事件に"}, {"t": 1297.6, "x": "関する情報提供を促進すると、そしてその検挙に\n資することを目的といたしまして」"}, {"t": 1303.0, "x": "「捜査特別報奨金制度というものを本年の四月一日から\n設けさせていただいたわけでございます」"}, {"t": 1308.9, "x": "「本年五月一日の第一回懸賞広告以降、\nこれまで国民を震撼させた強盗◯\n人や凶悪事件十四件について」"}, {"t": 1316.3666666666666, "x": "「最高額三百万円までの特別報奨金による\n懸賞広告を実施しておるところでございます」"}, {"t": 1322.25, "x": "14件から始まったのね。"}, {"t": 1324.2333333333333, "x": "ああ。そして、正直なことも言っている。"}, {"t": 1326.7833333333333, "x": "「この実施によりまして、残念ながらまだ\n検挙されたという事態には至っておりません」"}, {"t": 1331.65, "x": "そのうえで、効果をこう説明している。"}, {"t": 1333.9833333333333, "x": "「しかし、警察に寄せられます\n情報の件数が大幅に増加をしておりまして」"}, {"t": 1338.4833333333333, "x": "「例えば第一回広告では、この実施前は月に\n約十件余りの情報が、実施後は月三十四件に増える」"}, {"t": 1345.3, "x": "月10件が、34件。"}, {"t": 1347.4333333333334, "x": "ああ。3倍を超えている。"}, {"t": 1348.9666666666667, "x": "懸賞金は、犯人を捕まえるためのものというより、\n情報を集めるための仕掛けだ。"}, {"t": 1353.9666666666667, "x": "ここで一つ、思い出してほしいことがある。"}, {"t": 1356.5333333333333, "x": "この事件に寄せられた情報は、いま6424件ある。"}, {"t": 1360.5, "x": "20年目で5312件、23年目で6378件。\nそこから3年で1000件以上増えた。"}, {"t": 1367.5666666666666, "x": "その増え方にも、この仕組みが効いているのね。"}, {"t": 1370.4666666666667, "x": "そう考えるのが自然だろう。"}, {"t": 1372.1833333333334, "x": "毎年、期限が来るたびに報道される。"}, {"t": 1374.5, "x": "報道されるたびに、思い出す人がいる。"}, {"t": 1377.0333333333333, "x": "1年で区切ってあるのは、そのためでもある。"}, {"t": 1379.65, "x": "ずっと出しっぱなしにしていたら、誰も気づかない。"}, {"t": 1382.5833333333333, "x": "1年ごとに切って、そのたびに\n「まだ続けます」と出し直す。"}, {"t": 1386.65, "x": "そうやって、事件を世の中の表に戻している。"}, {"t": 1389.6333333333334, "x": "忘れられないように、わざと区切っているのね。"}, {"t": 1392.3666666666666, "x": "結果としては、そういう働きをしている。"}, {"t": 1395.5333333333333, "x": "では、この事件で実際に何が\n積み上がってきたのか。数字で見る。"}, {"t": 1399.5833333333333, "x": "関西テレビが20年目にまとめた\n特集では、こうなっていた。"}, {"t": 1403.3166666666666, "x": "投入された捜査員が、延べ10万6000人。"}, {"t": 1406.1833333333334, "x": "寄せられた情報が、5312件。"}, {"t": 1408.9833333333333, "x": "延べ10万人。"}, {"t": 1410.1166666666666, "x": "ああ。20年で、そこまで積み上がっている。"}, {"t": 1412.7833333333333, "x": "それから3年。2026年5月20日、\n23年目の報道ではこうだ。"}, {"t": 1417.7333333333333, "x": "大阪府警が、その年の5月10日までに\n投入した捜査員が、延べ12万189人。"}, {"t": 1423.6, "x": "寄せられた情報は、6378件。"}, {"t": 1426.6666666666667, "x": "さらにその先、2026年6月21日までで、\n情報は6424件になっている。"}, {"t": 1433.3166666666666, "x": "3年で、1万4000人近く増えているのね。"}, {"t": 1436.4666666666667, "x": "そうだ。つまり、いまも人が動いている。"}, {"t": 1438.9666666666667, "x": "過去に動いた人数の記録ではない。\nいま増えている数字だ。"}, {"t": 1442.3833333333334, "x": "情報のほうも、20年で5312件、23年で6378件。"}, {"t": 1447.8166666666666, "x": "3年で1000件以上増えている。"}, {"t": 1449.8666666666666, "x": "それだけ届いているのに、まだなのね。"}, {"t": 1452.3333333333333, "x": "ああ。6424件の情報が届いていて、\nそれでもまだ見つかっていない。"}, {"t": 1457.25, "x": "この二つの数字を並べると、苦しい。"}, {"t": 1459.65, "x": "ただ、私はこの数字を\n「無駄だった」という意味には使わない。"}, {"t": 1463.5333333333333, "x": "6424件のうち、まだ1件も\n当たっていない、ということでしかない。"}, {"t": 1468.3333333333333, "x": "残りの1件が来ていないだけだ。"}, {"t": 1470.4833333333333, "x": "その1件が、どこにあるか分からないのよね。"}, {"t": 1473.3, "x": "ああ。そして、持っている人が\n「自分は持っている」と気づいていないことがある。"}, {"t": 1477.9333333333334, "x": "2003年5月20日の午後に、あの道を\n車で通っただけ、という人がいる。"}, {"t": 1482.75, "x": "通りがかりに、黄色い\nリュックの子を見ただけ、という人がいる。"}, {"t": 1486.3, "x": "本人からすれば、何でもない記憶だ。"}, {"t": 1488.75, "x": "だから警察は「どんな些細な情報でも」と書いている。"}, {"t": 1492.1666666666667, "x": "価値があるかどうかを、こちらで\n決めないでくれ、ということだ。"}, {"t": 1496.1833333333334, "x": "こういう事件を、警察は\n「長期未解決事件」と呼んでいる。"}, {"t": 1499.9833333333333, "x": "その扱いについて、国会で答えているものがある。"}, {"t": 1503.0833333333333, "x": "2016年4月13日、参議院の決算委員会。"}, {"t": 1506.6, "x": "警察庁の刑事局長、三浦正充氏だ。"}, {"t": 1509.55, "x": "「これまで警察庁におきましては、"}, {"t": 1511.45, "x": "長期未解決事件の早期解決を\n目指すための地方警察官の増員を行ってまいりました」"}, {"t": 1517.1, "x": "「捜査特別報奨金制度の活用などによりまして\n国民からの情報提供の促進を図るとともに」"}, {"t": 1523.2, "x": "「有力情報の掘り下げ、"}, {"t": 1524.6333333333334, "x": "証拠資料の再鑑定等を実施することで\n長期未解決事件を一件でも多く\n検挙できるよう指導している」"}, {"t": 1530.9333333333334, "x": "再鑑定、って言ったわね。"}, {"t": 1532.7333333333333, "x": "ああ。当時の証拠を、いまの技術で\nもう一度調べ直すということだ。"}, {"t": 1536.7333333333333, "x": "それができるのは、証拠が残っているからだ。"}, {"t": 1539.4166666666667, "x": "ところが、同じ答弁にはこんな話も出てくる。"}, {"t": 1542.3833333333334, "x": "「未解決事件の証拠物件等を長期にわたり\n保管することは、収容能力や適切な管理の面からは"}, {"t": 1548.55, "x": "大きな負担になり得る」"}, {"t": 1549.9833333333333, "x": "……置いておく場所の話。"}, {"t": 1551.5166666666667, "x": "そうだ。身も蓋もない話だが、現実の話でもある。"}, {"t": 1555.15, "x": "事件の証拠は、どこかの棚に、\n箱に入って置かれている。"}, {"t": 1558.8, "x": "何十年も置いておけば、場所も\n要るし、管理する人も要る。"}, {"t": 1562.3666666666666, "x": "それでも置いておくという判断を、毎年している。"}, {"t": 1565.2166666666667, "x": "懸賞広告を1年ごとに出し直すのと、\nたぶん同じことだ。"}, {"t": 1569.1333333333334, "x": "まだ終わっていない、と決め続けているのね。"}, {"t": 1571.7833333333333, "x": "ああ。放っておいたら終わる。"}, {"t": 1573.3, "x": "終わらせないために、毎年決め直している。"}, {"t": 1576.6166666666666, "x": "この23年を、警察だけで\n持ちこたえてきたわけではない。"}, {"t": 1580.2666666666667, "x": "熊取町には、この事件のためにできた\n支援の団体がある。"}, {"t": 1583.9, "x": "NPO法人「あいうえお」という。"}, {"t": 1586.0, "x": "代表理事の三本松義春さんが、始めた\nきっかけをこう話している。"}, {"t": 1590.3333333333333, "x": "「友梨さんについて応援できることがないかなと\n警察に電話して連携とってもらって、"}, {"t": 1594.8833333333334, "x": "ビラ配りをしようというのが発端」"}, {"t": 1597.0166666666667, "x": "警察に、自分から電話したのね。"}, {"t": 1599.4666666666667, "x": "ああ。そこから始まっている。"}, {"t": 1601.2833333333333, "x": "そのときのことを、こうも言っている。"}, {"t": 1603.3666666666666, "x": "「まさかここまで来るとは\n思ってなかった、正直いって、1年か\n2年ですっと解決できると思っていた」"}, {"t": 1609.5, "x": "20年目の取材で、三本松さんは76歳になっていた。"}, {"t": 1613.4666666666667, "x": "そのときの言葉を、そのまま読む。"}, {"t": 1615.65, "x": "「やっぱり変わらへんな。"}, {"t": 1616.8666666666666, "x": "何とか無事で\n生きていてもらいたいなというだけなんで」"}, {"t": 1619.8166666666666, "x": "「見つける手伝いをしようと言ったんだから、\n見つかるまでやりましょうか、となったんでね」"}, {"t": 1624.5333333333333, "x": "「いつのまにか76歳になりましたから、\nこれからどこまでできるか分からんけど」"}, {"t": 1629.35, "x": "……1年か2年のつもりが。"}, {"t": 1631.15, "x": "ああ。20年たっていた。"}, {"t": 1632.7666666666667, "x": "この団体のビラ配りは、関西の外にも出ている。"}, {"t": 1635.9, "x": "全国を回るサーカス団に、\n協力を頼んだこともあるそうだ。"}, {"t": 1639.6166666666666, "x": "そして2026年、朝日新聞が、この団体が\n世代交代したことを報じている。"}, {"t": 1644.9166666666667, "x": "始めた人が続けられる年数を、事件のほうが\n超えてしまった、ということだ。"}, {"t": 1650.2333333333333, "x": "もう一人、続けている人たちがいる。"}, {"t": 1652.6, "x": "あの日、一緒に帰った同級生たちだ。"}, {"t": 1655.1, "x": "20年目の特集に出ていたみさとさんは、\nそのとき29歳になっていた。"}, {"t": 1659.7, "x": "その言葉を読む。"}, {"t": 1660.8666666666666, "x": "「寂しいですね、どんな感じになっていたんだろうって\nすごく思うし、何か想像できないっていうか」"}, {"t": 1666.3833333333334, "x": "「もう普通にこう、\n大人に、なっているはずやのに、いないっていうのは\n受け入れられない」"}, {"t": 1671.1, "x": "……同い年だものね。"}, {"t": 1672.45, "x": "ああ。自分が29歳になったから、分かることだ。"}, {"t": 1675.7166666666667, "x": "9歳の時点では、まだ分からなかったことだと思う。"}, {"t": 1678.8833333333334, "x": "みさとさんは、こうも話している。"}, {"t": 1680.9166666666667, "x": "「思い出されること自体がめちゃくちゃ\n少なくなってきているので」"}, {"t": 1684.4, "x": "「世間的にもだんだん忘れられていっていることに\nやっぱり危機感を持ってはいて、"}, {"t": 1688.6, "x": "忘れないでほしいなって。できることはやります」"}, {"t": 1691.45, "x": "別の同級生の言葉も出ている。"}, {"t": 1693.5333333333333, "x": "「もう見つかれへんよ、とひどいこと言う人もいるし、\n聞いてきたけれど、そんなこと全くないので」"}, {"t": 1699.0166666666667, "x": "「早く帰ってきてほしいし、会いたいなって」"}, {"t": 1701.6833333333334, "x": "そんなことを言う人がいるのね。"}, {"t": 1703.6166666666666, "x": "いる。だから私は、この動画で\nその種のことを言わない。"}, {"t": 1707.0166666666667, "x": "みさとさんの言葉を、もう一つだけ。"}, {"t": 1709.3666666666666, "x": "「どうやったらもう一回一緒に\n生きられるかを相談させてもらいたい」"}, {"t": 1713.55, "x": "2026年5月20日。"}, {"t": 1715.4166666666667, "x": "事件から、ちょうど23年の日だ。"}, {"t": 1717.8833333333334, "x": "その日、大阪市中央区の難波で、チラシが配られた。"}, {"t": 1721.35, "x": "場所は、大阪高島屋の前。"}, {"t": 1723.4166666666667, "x": "配ったのは、友梨さんのご両親と、NPO法人\n「あいうえお」、それに大阪府警の捜査第一課員。"}, {"t": 1729.5, "x": "合わせて27人だ。"}, {"t": 1731.0166666666667, "x": "配ったのは、チラシとポケットティッシュを\n組にしたもの。2000個。"}, {"t": 1734.95, "x": "熊取町じゃなくて、難波でやるのね。"}, {"t": 1737.4833333333333, "x": "ああ。人の多いところへ出ていく。"}, {"t": 1739.4333333333334, "x": "熊取町の中でいくら配っても、\n町の人はもう知っている。"}, {"t": 1743.1333333333334, "x": "知らない人のところへ持っていかないと、\n新しい情報は出てこない。"}, {"t": 1746.9666666666667, "x": "ポケットティッシュと\n組にしてあるのも、たぶん同じ理由だ。"}, {"t": 1750.35, "x": "チラシだけだと、受け取ってもらえないものね。"}, {"t": 1753.1166666666666, "x": "ああ。受け取ってもらえなければ、ゼロだ。"}, {"t": 1755.55, "x": "2000個というのは、\n2000回声をかけたということでもある。"}, {"t": 1758.9166666666667, "x": "それを23年、続けてこられた。"}, {"t": 1761.2166666666667, "x": "ご両親は、23年間これを続けてこられた。"}, {"t": 1764.35, "x": "私はここで、ご両親の今の暮らしのことは話さない。"}, {"t": 1767.75, "x": "報道されているのは\n「情報提供を呼びかけた」という事実までだ。"}, {"t": 1771.6166666666666, "x": "私もそこで止める。"}, {"t": 1773.2, "x": "それでいいと思うわ。"}, {"t": 1774.5333333333333, "x": "それと、その翌月。2026年の7月に、\n報奨金の延長が決まった。"}, {"t": 1779.8, "x": "19回目の延長だ。期間は、2027年の7月1日まで。"}, {"t": 1784.4333333333334, "x": "そのときの報道で、情報の件数が6424件と出ている。"}, {"t": 1788.8666666666666, "x": "つまり、こういうことだ。"}, {"t": 1790.3333333333333, "x": "ご両親が街頭に立ち、そのすぐあとに、\n国が「もう1年」と決めている。"}, {"t": 1795.65, "x": "最後に行く前に、もう一度だけ確かめておく。"}, {"t": 1798.5, "x": "私が今日、言わなかったことだ。"}, {"t": 1800.6, "x": "一つ。誰が関わったのか、という話をしていない。"}, {"t": 1803.9, "x": "警察が公表しているのは、目撃された車種までだ。\nそこから先は、私が足してはいけない。"}, {"t": 1809.8666666666666, "x": "二つ。事件なのか事故なのか、私は決めていない。"}, {"t": 1813.2666666666667, "x": "大阪府警が略取誘拐事件として\n扱っている。その事実を伝えただけだ。"}, {"t": 1818.1833333333334, "x": "ネットには、いろいろな話が出ているけれど。"}, {"t": 1820.9166666666667, "x": "出ている。私はそれを一つも扱わなかった。"}, {"t": 1823.8833333333334, "x": "根拠の無い説を並べると、それが\n「そういう話がある」という形で残ってしまう。"}, {"t": 1829.0, "x": "残ったものは、ご家族のところへ行く。"}, {"t": 1831.4, "x": "三つ。友梨さんを、過去の人として喋らなかった。"}, {"t": 1834.65, "x": "生きているか、そうでないか。"}, {"t": 1836.2333333333333, "x": "警察は、どちらも言っていない。"}, {"t": 1838.25, "x": "だから私も言わない。"}, {"t": 1839.7666666666667, "x": "それと、時効のことね。"}, {"t": 1841.55, "x": "ああ。あれも言い切らなかった。"}, {"t": 1843.25, "x": "国が「見解が分かれている」と答弁しているものを、\n私が代わりに決めるわけにいかない。"}, {"t": 1848.6166666666666, "x": "私が言えるのは、捜査本部が現にあること。"}, {"t": 1851.4333333333334, "x": "懸賞広告が、今年もう一度出されたこと。"}, {"t": 1854.3166666666666, "x": "この二つだけだ。そしてこの二つは、十分に重い。"}, {"t": 1858.35, "x": "ここからは、大阪府警が公開している\n連絡先を、そのまま読む。"}, {"t": 1862.5166666666667, "x": "宛先は、大阪府泉佐野警察署、\n捜査第一課、捜査本部。"}, {"t": 1866.9666666666667, "x": "郵便番号は、598の0007。"}, {"t": 1870.1666666666667, "x": "住所は、大阪府泉佐野市上町2丁目1番1号。"}, {"t": 1873.75, "x": "電話番号は、072の464の1234。"}, {"t": 1877.8333333333333, "x": "ファックス番号は、072の462の0854。"}, {"t": 1881.7, "x": "メールアドレスは、yuri@police.pref.osaka.jp。"}, {"t": 1885.45, "x": "ユー、アール、アイ。"}, {"t": 1886.5333333333333, "x": "友梨さんの名前だ。"}, {"t": 1887.95, "x": "……メールアドレスに、名前が入っているのね。"}, {"t": 1890.5166666666667, "x": "ああ。この事件のためだけに作られたものだ。"}, {"t": 1893.2333333333333, "x": "府警のページには、大阪府警のホームページから\n送れる送信フォームへの案内もある。"}, {"t": 1898.0166666666667, "x": "泉佐野警察署のページには、こう書いてある。"}, {"t": 1900.8, "x": "「警察では、関係機関、団体等と連携し、\n全力を挙げて捜索を続けています」"}, {"t": 1906.1666666666667, "x": "「どんな情報でも結構です。\nみなさんのご協力をお願い致します」"}, {"t": 1910.1666666666667, "x": "「捜査の都合がありますので、住所、\n氏名、電話番号をお知らせください」"}, {"t": 1914.5666666666666, "x": "「個人のプライバシーの保護には万全を\n期しておりますのでご安心ください」"}, {"t": 1918.5833333333333, "x": "思い出せることがあったら、\n私にではなく、ここへ届けてほしい。"}, {"t": 1922.45, "x": "2003年5月20日の午後、熊取町の七山。"}, {"t": 1925.8333333333333, "x": "白いブラウスの制服に、黄色いリュック。"}, {"t": 1928.2833333333333, "x": "家まで、あと400メートルのところだった。"}, {"t": 1930.9833333333333, "x": "どんな小さなことでも、いいのよね。"}, {"t": 1933.2666666666667, "x": "警察がそう書いている。"}, {"t": 1934.5833333333333, "x": "「どんな些細な情報でも結構です」と。"}, {"t": 1937.1166666666666, "x": "吉川友梨さんを、捜しています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
