<script>
const D={"name": "070", "file": "070_編集用", "dur": 1997.8333125, "segs": [], "subs": [{"t": 0.0, "x": "一九八五年六月十八日。"}, {"t": 2.7333333333333334, "x": "大阪のマンションの前に、報道陣が集まっていた。"}, {"t": 5.85, "x": "その日、豊田商事という会社の会長が殺害された。"}, {"t": 9.3, "x": "大阪府警は、その日のうちに捜査本部を設置している。"}, {"t": 12.883333333333333, "x": "報道陣の前で？"}, {"t": 14.2, "x": "この事件は、そこばかりが語られる。"}, {"t": 16.516666666666666, "x": "だが、この回でその場面は扱わない。"}, {"t": 18.933333333333334, "x": "どう殺されたかも、どんな様子だったかも話さない。"}, {"t": 21.866666666666667, "x": "写真も映像も使わない。"}, {"t": 23.7, "x": "どうして。"}, {"t": 24.533333333333335, "x": "三つ理由がある。"}, {"t": 25.65, "x": "一つ、殺された人にも遺族がいる。"}, {"t": 27.916666666666668, "x": "「殺されて当然だった」という\n言い方は、この番組ではしない。"}, {"t": 31.766666666666666, "x": "二つ、当時の映像は報道機関の権利物だ。"}, {"t": 34.8, "x": "三つ、そこを見ても、この事件のことは\n何も分からないからだ。"}, {"t": 38.65, "x": "この回で追うのは、その手前の四年間だ。"}, {"t": 41.28333333333333, "x": "この会社は、一九八一年に\n設立されて、一九八五年に潰れた。"}, {"t": 46.9, "x": "たった四年だ。"}, {"t": 47.93333333333333, "x": "その四年で、全国のお年寄りから、\n途方もない額が集まった。"}, {"t": 52.13333333333333, "x": "どれくらい？"}, {"t": 53.016666666666666, "x": "破産手続に届け出があった\nぶんだけで、二万五千三百七十二人。"}, {"t": 57.4, "x": "被害総額、一千百十七億円。"}, {"t": 60.016666666666666, "x": "……一千百十七億。"}, {"t": 61.6, "x": "そしてこの四年間、この会社の名前は、\n何度も国会で呼ばれている。"}, {"t": 65.85, "x": "新聞も実名で書いた。"}, {"t": 67.31666666666666, "x": "弁護士も告訴した。"}, {"t": 68.81666666666666, "x": "それでも、止まらなかった。"}, {"t": 70.53333333333333, "x": "なぜ止まらなかったのか。この回は、その話だ。"}, {"t": 73.68333333333334, "x": "根拠にするのは、国会の会議録と、\n法律の条文だけだ。"}, {"t": 78.21666666666667, "x": "まず、規模を押さえる。"}, {"t": 79.53333333333333, "x": "一九八六年四月十七日、衆議院の本会議。"}, {"t": 83.51666666666667, "x": "日本社会党の上坂昇さんが、\n演説の冒頭でこう述べている。"}, {"t": 87.53333333333333, "x": "「昭和五十六年四月会社が設立され、"}, {"t": 90.06666666666666, "x": "会長永野一男が刺殺されてその幕を閉じた\n昭和六十年七月十七日までわずか四年間」"}, {"t": 96.01666666666667, "x": "「その間に老人、婦人が大半を\n占める被害者数実に四万人、"}, {"t": 99.91666666666667, "x": "集めた金額二千二十億円に達し、"}, {"t": 102.33333333333333, "x": "中途解約分を差し引きましても\n実額一千四百七十億円に達するのであります」"}, {"t": 107.78333333333333, "x": "四万人。"}, {"t": 108.71666666666667, "x": "これは国会の演説で述べられた数字だ。"}, {"t": 111.05, "x": "政府が確定させた数字ではない。"}, {"t": 113.23333333333333, "x": "もう一つ、性質の違う数字がある。"}, {"t": 115.68333333333334, "x": "破産手続に届け出た人の数だ。"}, {"t": 118.13333333333334, "x": "一九八五年九月十日、\n衆議院の物価問題等に関する特別委員会。"}, {"t": 123.38333333333334, "x": "豊田商事被害対策大阪弁護団の団長、\n三橋完太郎さんが参考人として述べている。"}, {"t": 129.18333333333334, "x": "「債権の届け出の行われました\n被害者数が八月末現在、全国で\n二万五千三百七十二人でございます」"}, {"t": 136.21666666666667, "x": "「その被害総額は一千百十七億、"}, {"t": 138.56666666666666, "x": "平均被害額は\n四百四十万ということになっておりまして、\n南は沖縄から北は北海道まで、"}, {"t": 144.51666666666668, "x": "文字どおり全国津々浦々に被害が\n発生しておるわけでございます」"}, {"t": 148.58333333333334, "x": "平均で四百四十万円？"}, {"t": 150.55, "x": "一人あたり四百四十万だ。"}, {"t": 152.51666666666668, "x": "そして、こう続く。"}, {"t": 153.9, "x": "「たしか高知県だけが被害者が出ておらない、それ"}, {"t": 156.33333333333334, "x": "以外はすべての都道府県において被害者が\n発生しておるという現状でございます」"}, {"t": 161.35, "x": "四十六都道府県？"}, {"t": 162.88333333333333, "x": "ああ。一つの会社が、四年で全国を回りきった。"}, {"t": 166.21666666666667, "x": "破産宣告は、一九八五年七月一日だ。"}, {"t": 170.56666666666666, "x": "この会社が売っていたものを説明する。"}, {"t": 172.85, "x": "当時の言葉で「現物まがい商法」と呼ばれた。"}, {"t": 176.1, "x": "まがい？"}, {"t": 176.76666666666668, "x": "現物のようで、現物ではない、という意味だ。"}, {"t": 179.6, "x": "仕組みはこうだ。"}, {"t": 180.63333333333333, "x": "お客に、金の地金を買ってもらう。金地金だ。"}, {"t": 183.7, "x": "ところが、その金は渡さない。会社が預かる。"}, {"t": 186.68333333333334, "x": "お客の手元に来るのは、\n「純金ファミリー契約証券」といった紙一枚だ。"}, {"t": 191.3, "x": "そして会社は、預かっているあいだの賃借料として、\n年に何％かを払う、と約束する。"}, {"t": 197.35, "x": "金を買ったのに、金は来ない。"}, {"t": 199.33333333333334, "x": "来ない。"}, {"t": 199.9, "x": "預けたことになっていて、\n利息のようなものだけが振り込まれる。"}, {"t": 203.55, "x": "この形が、法律上どう位置づけられていたか。"}, {"t": 206.51666666666668, "x": "一九八六年四月十七日の本会議で、\n通商産業大臣の渡辺美智雄さんが\n法案の趣旨説明をしている。"}, {"t": 214.03333333333333, "x": "そこで、規制の対象をこう定義している。"}, {"t": 216.56666666666666, "x": "「一定の期間、政令で指定する特定商品の預託を\n受け、財産上の利益を供与することを約する契約」"}, {"t": 223.1, "x": "「一定の期間経過後その買い取りを条件として\n特定商品の預託を受けることを約する契約」"}, {"t": 228.78333333333333, "x": "これを規制する法律を、あとから作ったのね。"}, {"t": 231.73333333333332, "x": "ああ。あとから、だ。"}, {"t": 233.1, "x": "この事件が起きた時点では、この形を\n直接取り締まる法律が無かった。"}, {"t": 237.66666666666666, "x": "そこが、この回の芯になる。"}, {"t": 239.55, "x": "買った側から見れば、金を買ったつもりだ。"}, {"t": 242.11666666666667, "x": "会社から見れば、物を\n預かっているだけということになる。"}, {"t": 245.45, "x": "そして、預かった金が本当にあるのか\nどうかは、外からは分からない。"}, {"t": 250.26666666666668, "x": "買わされたのが誰だったのか。数字がある。"}, {"t": 252.85, "x": "三橋参考人の証言だ。"}, {"t": 254.63333333333333, "x": "大阪弁護団が届け出た約一千名について。"}, {"t": 257.6333333333333, "x": "「約一千名、平均被害額が五百二十万、そして、"}, {"t": 261.1333333333333, "x": "年齢、性別の比率を見てまいりますと、"}, {"t": 263.6666666666667, "x": "六十歳未満の男性はわずかに一三"}, {"t": 266.0, "x": "％でございまして、いかにお年寄りと女性とが\nねらわれたかということが歴然としております」"}, {"t": 271.65, "x": "六十歳未満の男性が、一三％だけ。"}, {"t": 274.9166666666667, "x": "残り八七％が、高齢者か、女性か、その両方だ。"}, {"t": 279.1666666666667, "x": "名古屋の弁護団からも数字が出ている。"}, {"t": 281.45, "x": "名古屋弁護団の副団長、岩本雅郎さんの証言だ。"}, {"t": 284.93333333333334, "x": "「八月十九日までに破産債権の届け出を\n済ませた被害者の総数は千八十一名に上ります。"}, {"t": 290.81666666666666, "x": "被害総額で約五十億円になります」"}, {"t": 293.3833333333333, "x": "「六十歳以上の被害者の方々が\nざっと六〇％ほどいらっしゃいます」"}, {"t": 297.85, "x": "そして、被害額の分布だ。"}, {"t": 299.81666666666666, "x": "「千八十一名のうち、三百万円以上被害に\n遭った方が四百六十五名いらっしゃいます。"}, {"t": 305.25, "x": "約四三％を占めておりますが」"}, {"t": 307.8, "x": "「勤労者世帯の平均金融資産が現在ですと\n六百万円強ということになっておりますので、"}, {"t": 313.2, "x": "被害者のうち半数近い方々は、"}, {"t": 315.43333333333334, "x": "預貯金という形での金融資産の大部分を\n豊田商事に収奪されてしまったのだ」"}, {"t": 320.6166666666667, "x": "金融資産の大部分。"}, {"t": 322.21666666666664, "x": "当時の平均が六百万円強で、\n三百万円以上を失った人が四三％だ。"}, {"t": 327.76666666666665, "x": "半分から先が消えた、という人が半数近くいた。"}, {"t": 331.1, "x": "岩本さんは、こう続けている。"}, {"t": 333.06666666666666, "x": "「この収奪された預貯金は\n老後の生活資金となるべき性質のものです」"}, {"t": 337.48333333333335, "x": "そして、財産以外の被害についても述べている。"}, {"t": 340.46666666666664, "x": "「おじいちゃんとかおばあちゃんから\n被害の相談を受けますと、"}, {"t": 343.4166666666667, "x": "息子とか嫁に知れると家族関係が\nうまくいかなくなるから\nないしょにしておいてほしい、こういった"}, {"t": 348.6666666666667, "x": "訴えを相当"}, {"t": 349.51666666666665, "x": "数聞きます」"}, {"t": 350.4, "x": "家族にも言えない。"}, {"t": 351.68333333333334, "x": "言えないから、被害の全体像も見えにくくなる。"}, {"t": 355.1666666666667, "x": "では、行政の側にはどれだけ声が届いていたのか。"}, {"t": 358.31666666666666, "x": "一九八五年六月二十一日、参議院の商工委員会。"}, {"t": 362.5833333333333, "x": "ちょうど会長が殺害された三日後だ。"}, {"t": 364.9, "x": "経済企画庁国民生活局長の横溝雅夫さんが\n答弁している。"}, {"t": 369.21666666666664, "x": "「国民生活センター及び全国の都道府県の\n消費生活センター、あるいは政令指定都市の\n消費生活センター、"}, {"t": 375.75, "x": "全体合計百四十カ所でございますけれども」"}, {"t": 378.73333333333335, "x": "「これについて寄せられた豊田商事及び鹿島商事に\n関する苦情相談を最近まとめましたが、"}, {"t": 384.01666666666665, "x": "昭和五十九年の四月からことしの五月まで、\n合計の苦情相談件数四千三百五件でございます」"}, {"t": 390.56666666666666, "x": "四千三百五件。"}, {"t": 392.06666666666666, "x": "一年二か月分だ。"}, {"t": 393.53333333333336, "x": "そして金額。"}, {"t": 394.6166666666667, "x": "「契約時の支払い金額が明らかになっている苦情は、"}, {"t": 397.6666666666667, "x": "四千三百五件のうち三千七十九件が\n金額が明らかになってございますが、"}, {"t": 402.6, "x": "総額百九億四千九百万円でございまして、\n一件当たり大体三百五十六万円ということになってご"}, {"t": 408.8333333333333, "x": "ざいます」"}, {"t": 409.76666666666665, "x": "通産省の側の数字も出ている。"}, {"t": 411.65, "x": "産業政策局長の福川伸次さんだ。"}, {"t": 414.4166666666667, "x": "「通商産業省消費者相談室へ五十九年度中に\n寄せられました消費者相談は、"}, {"t": 419.3666666666667, "x": "九千四百九十六件でございますが、\nこのうち、国内の金取引に係るものは\n千三百七十八件でございます」"}, {"t": 426.8, "x": "「相談金額合計は約三十九億七千五百万円という\n数字に相なっております」"}, {"t": 432.01666666666665, "x": "これだけ相談が来ていて。"}, {"t": 433.78333333333336, "x": "ああ。届いていなかったわけではない。"}, {"t": 435.8666666666667, "x": "さらにさかのぼった数字もある。"}, {"t": 437.56666666666666, "x": "上坂議員の演説だ。"}, {"t": 439.1666666666667, "x": "「五十六年度百九十六件、五十七年度三百八十四件、"}, {"t": 443.2, "x": "五十八年度に九百三十四件と、相談、苦情、\n問い合わせは増加の一途を続けている」"}, {"t": 448.9166666666667, "x": "百九十六、三百八十四、九百三十四。"}, {"t": 452.2, "x": "毎年、倍近く増えている。"}, {"t": 454.1666666666667, "x": "会社ができた年から、ずっと増え続けていた。"}, {"t": 457.68333333333334, "x": "ここから、手口の話をする。"}, {"t": 459.71666666666664, "x": "三橋参考人が、被害者の手記をまとめて、\n特徴を十一に分けて説明している。"}, {"t": 465.01666666666665, "x": "順に見ていく。"}, {"t": 466.05, "x": "まず、入口だ。"}, {"t": 467.3, "x": "「いわゆるテレホンレディーによる"}, {"t": 468.93333333333334, "x": "無差別の電話勧誘、これによって目星をつけて、そこへ"}, {"t": 471.71666666666664, "x": "セールスマンが\n押しかけていくということでございます」"}, {"t": 474.71666666666664, "x": "「非常に多数のテレホンレディーによる"}, {"t": 476.81666666666666, "x": "無差別の電話勧誘をやりまして\nそして押しかけていくというこの手口は、"}, {"t": 480.4166666666667, "x": "非常に大事な問題点だろうと思います」"}, {"t": 483.15, "x": "無差別に電話をかけて？"}, {"t": 484.8333333333333, "x": "電話で反応を見て、脈のありそうな家にだけ人を送る。"}, {"t": 488.21666666666664, "x": "三橋さんは、被害者の言葉としてこう書いている。"}, {"t": 491.3666666666667, "x": "「被害者はこれを悪魔のささやきであったという\nふうに述懐いたしております」"}, {"t": 495.43333333333334, "x": "そして、家に上がったあとだ。"}, {"t": 497.26666666666665, "x": "「どんどん家に上がり込んでまいりまして帰らない、\n長時間、深夜に及ぶまで粘るといったようなやり方」"}, {"t": 502.96666666666664, "x": "「まことにしつこくて、強引で、時には\nすごむようなこともあるようでございます。"}, {"t": 507.31666666666666, "x": "一種の催眠状態に追い込むところまでやっている\n例が少なくございません」"}, {"t": 511.65, "x": "深夜まで。"}, {"t": 512.5666666666667, "x": "断るまで帰らない、ではない。"}, {"t": 514.4833333333333, "x": "判断する力が落ちるところまで\n居座る、というやり方だ。"}, {"t": 518.0166666666667, "x": "そして、狙いどころも決まっている。"}, {"t": 520.2166666666667, "x": "「被害者たちの老後不安、先行き\n不安、預貯金の目減り不安、\nこういったものにうまく乗じている」"}, {"t": 525.8, "x": "手記の一つが引かれている。"}, {"t": 527.5666666666667, "x": "「お母さん国債どんなん持ってるの、と言い出し、"}, {"t": 530.1333333333333, "x": "国債より金の方が値打があるのよ、と言い、私が\n年金生活ですので、これからは年金もパンク、"}, {"t": 536.1666666666666, "x": "銀行利息も四分になる、老後どうして食べてゆくの」"}, {"t": 539.6666666666666, "x": "老後どうして食べてゆくの。"}, {"t": 541.4, "x": "そう言いながら、新聞記事に赤線を\n引いたものを見せていた、と手記にある。"}, {"t": 546.3666666666667, "x": "手口の続きだ。ここがいちばん重い。"}, {"t": 548.7166666666667, "x": "三橋参考人の言葉を読む。"}, {"t": 550.75, "x": "「人情というものを臆面もなく完全に\n手段として使っておるということでございます」"}, {"t": 555.5333333333333, "x": "「最も大事にすべき人情というものを\n何のためらいもなく金をだまし取り、"}, {"t": 559.6333333333333, "x": "奪い取るためのテクニックとして\n使っておるのでございます」"}, {"t": 562.9666666666667, "x": "具体例も挙げられている。"}, {"t": 564.4666666666667, "x": "「おばあちゃんの孫だから自分が\n老後を見てやるとか、お母さん、"}, {"t": 567.6666666666666, "x": "僕を息子と思って安心してくださいと言って手を握る」"}, {"t": 571.1166666666667, "x": "手を握る。"}, {"t": 572.0333333333333, "x": "そして三橋さんは、被害者がどういう\n人たちだったかを、こうまとめている。"}, {"t": 576.4833333333333, "x": "「被害者は長年こつこつと働いてきたという\nタイプの方が多く、その汗と"}, {"t": 580.65, "x": "涙の結晶ともいうべき\nとらの子の蓄えが被害に遭っておる」"}, {"t": 584.3666666666667, "x": "「被害者は人のよい、人の話を断りにくい、\nこういう性格の方が多いように思われます。"}, {"t": 589.65, "x": "社会の根底を支えてきた善良な\n庶民の方々であると思います」"}, {"t": 593.75, "x": "「お年寄りの夫婦、ひとり住まいの御老人、\nそれから母子家庭、身体が不自由な方など、"}, {"t": 598.9, "x": "何らかの意味で社会的な\nハンディキャップを負った方が多い」"}, {"t": 602.25, "x": "断りにくい人が狙われた。"}, {"t": 604.2666666666667, "x": "先に言っておく。"}, {"t": 605.35, "x": "この回では「騙されるほうにも\n落ち度があった」という言い方は一度もしない。"}, {"t": 609.6333333333333, "x": "人の話を断れない性格が\n悪いのだとしたら、社会は成り立たない。"}, {"t": 613.95, "x": "この商法は、その性格を狙って作られている。"}, {"t": 616.9666666666667, "x": "そして、ここが大事なところだ。"}, {"t": 619.05, "x": "ひとり暮らしで、話し相手がいなくて、\n老後のお金が心配な人。"}, {"t": 623.2333333333333, "x": "その三つが揃った人のところに、\n毎日通ってくる若い人がいる。"}, {"t": 627.45, "x": "手を握って、息子だと思ってくださいと言う。"}, {"t": 630.0166666666667, "x": "……。"}, {"t": 630.95, "x": "財産の話だけではなかった、という\n意味が、そこにある。"}, {"t": 635.1, "x": "手口の中に、この回の主題に\n直接つながるものがある。"}, {"t": 638.7166666666667, "x": "三橋参考人が挙げた九番目の特色だ。"}, {"t": 641.6333333333333, "x": "「大きなうそを徹底して並べるということでございます。"}, {"t": 644.5, "x": "国がついておりますとか通産省の認可を得ています、\nこういったことも言っておるのでございます」"}, {"t": 649.9333333333333, "x": "通産省の認可？"}, {"t": 651.3666666666667, "x": "そんな認可は無い。"}, {"t": 652.5333333333333, "x": "だが、これで終わりではない。"}, {"t": 654.1666666666666, "x": "三橋さんは、意見陳述の後半で、\nもっと重い話をしている。"}, {"t": 658.3166666666667, "x": "「手記によりますと、本件に関する行政当局、"}, {"t": 661.3166666666667, "x": "捜査当局の無為無策と"}, {"t": 663.0, "x": "あえて申し上げさせていただきますけれども、\nこれを豊田商事が逆手にとりまして被害者を"}, {"t": 667.9333333333333, "x": "説得しておるということがございます」"}, {"t": 670.0, "x": "そして、そのセリフをそのまま読み上げている。"}, {"t": 672.65, "x": "「絶対に大丈夫です。その証拠にあれだけ"}, {"t": 675.3666666666667, "x": "マスコミからたたかれても国から何とも\n注意も指導も受けておりません」"}, {"t": 679.1, "x": "「本当に詐欺だったら国が\nぼっとくわけがないでしょう」"}, {"t": 682.0166666666667, "x": "「マスコミやテレビで何と騒ごうと\n国が認めているのだから、国を\n信じておれば間違いはない、"}, {"t": 687.1, "x": "国が信じられなくて何が信じられますか」"}, {"t": 689.95, "x": "……新聞に書かれていることが、逆に使われた？"}, {"t": 692.9, "x": "ああ。"}, {"t": 693.3333333333334, "x": "新聞が「これは詐欺だ」と\n書いているのに、国が何もしない。"}, {"t": 697.1, "x": "だったら国のほうが\n正しいのだろう、という理屈になる。"}, {"t": 700.25, "x": "これは、行政が動かないことの副作用の中でも、\nいちばんたちの悪い形だ。"}, {"t": 705.05, "x": "何もしないことが、無害ではなかった。"}, {"t": 707.5, "x": "営業の材料として使われた。"}, {"t": 709.45, "x": "三橋さんは、こういう表現でその怒りを述べている。"}, {"t": 712.55, "x": "「大変激しい表現で申し上げまして\n恐縮でございますけれども、\nこの被害者の手記を私読んでおりまして、"}, {"t": 718.65, "x": "どうしてもこういった激しい表現で\n皆様に訴えたいという気持ちを\n抑えることができないのであります」"}, {"t": 724.8833333333333, "x": "ここで、被害者本人の言葉をいくつか読む。"}, {"t": 727.7166666666667, "x": "全部、一九八五年九月十日の国会の会議録に\n載っているものだ。"}, {"t": 732.55, "x": "一つ目。息子さんが書いたものだ。"}, {"t": 734.9, "x": "「私の父は十五歳のときから中卒の無学、"}, {"t": 737.75, "x": "油まみれにただまじめに働き退職金と\nわずかな貯金を得たのです」"}, {"t": 742.0333333333333, "x": "「年老いて行くところもなくなった\n今一瞬にして一生の蓄えを豊田の"}, {"t": 746.05, "x": "連中にむしり取られてしまったのです」"}, {"t": 748.15, "x": "二つ目。八十一歳の女性のものだ。"}, {"t": 750.7666666666667, "x": "「私は八十一歳の老婆でございます。"}, {"t": 753.0666666666667, "x": "戦後北鮮から身一つで引き揚げてまいりました」"}, {"t": 756.15, "x": "「それからは昼は工場へ、夜は仕立て物と\n自分で感心するほどよく働きました」"}, {"t": 761.15, "x": "「一生のうちで二度もこんな思いをするのは\n前世で何か悪いことでもしたのかと思います」"}, {"t": 766.1666666666666, "x": "二度も？"}, {"t": 766.9166666666666, "x": "戦争で一度、この商法で二度目だ。"}, {"t": 769.3166666666667, "x": "三つ目。"}, {"t": 770.0333333333333, "x": "「このごろではショックも重なり、体を\n悪くして寝たきりになりおばあさんに\n世話をしてもらっています」"}, {"t": 775.45, "x": "「今の状態では死ぬこともできないと話しています。"}, {"t": 778.2833333333333, "x": "どうか助けてください。"}, {"t": 779.65, "x": "年老いた妻のためにもどうか少しでも返してください」"}, {"t": 782.9333333333333, "x": "三橋さんは、精神と\n健康への被害についてこう述べている。"}, {"t": 786.6333333333333, "x": "「大事なとらの子を\nだまし取られたということで、まず被害者は"}, {"t": 790.1, "x": "自責の念を持ちます。みずからを\n責めるわけであります」"}, {"t": 793.1166666666667, "x": "「それからまた、悔しさの念に責められます。\nそして不眠に陥って生きる気力も失って、"}, {"t": 798.35, "x": "心身ともに健康状態が悪化していく」"}, {"t": 801.0, "x": "最後にもう一つ。この言葉を残しておきたい。"}, {"t": 803.9, "x": "「人を信じることのできない\n世の中にしたくありません。\nこれからの子供たちのためにもあのような"}, {"t": 809.0166666666667, "x": "悪徳商法がはびこらないように\n取り締まっていただきたいと思います」"}, {"t": 812.9333333333333, "x": "取り締まっていただきたい。"}, {"t": 814.5333333333333, "x": "ここから先が、この回の後半だ。"}, {"t": 816.8666666666667, "x": "なぜ、取り締まられなかったのか。"}, {"t": 819.5, "x": "この会社の名前が、いつ国会に出たか。"}, {"t": 822.1166666666667, "x": "これについては、二つの発言がある。"}, {"t": 824.35, "x": "日付が食い違っているので、両方出す。"}, {"t": 826.9833333333333, "x": "一つ目。名古屋弁護団の岩本参考人。"}, {"t": 829.7833333333333, "x": "「豊田商事の現物まがい商法につきましては、"}, {"t": 832.5333333333333, "x": "昭和五十七年の四月に衆議院の商工委員会で名指しで"}, {"t": 835.9666666666667, "x": "取り上げられて、その後もしばしば\n国会で取り上げられてきております」"}, {"t": 839.8666666666667, "x": "二つ目。上坂議員の演説。"}, {"t": 842.0, "x": "「五十八年五月十八日の衆議院商工委員会では、"}, {"t": 845.3333333333334, "x": "我が党の議員が初めて豊田商事問題を\n取り上げ、警告を発し」"}, {"t": 849.6, "x": "一年ずれているのね。"}, {"t": 851.1166666666667, "x": "ああ。この回では、どちらが正しいとは言わない。"}, {"t": 853.9, "x": "ただ、どちらにしても言えることがある。"}, {"t": 856.1, "x": "会社ができたのが一九八一年。"}, {"t": 858.6, "x": "潰れたのが一九八五年。"}, {"t": 860.8833333333333, "x": "その真ん中の一九八二年か一九八三年には、\nもう国会で名前が呼ばれていた。"}, {"t": 866.9333333333333, "x": "上坂議員は、二回目の質疑についてこう述べている。"}, {"t": 870.1166666666667, "x": "「同年十月四日の商工委員会では、"}, {"t": 872.4, "x": "当時一千億円とも推定される集金が行われ、"}, {"t": 875.4333333333333, "x": "全国的に猛威を振るっておりました\n豊田商事商法を詳細に分析、報告して、"}, {"t": 880.45, "x": "早急に対処する必要があることを政府に求めている」"}, {"t": 883.8333333333334, "x": "そして、こう結論している。"}, {"t": 885.6666666666666, "x": "「この警告、要請に耳をかさず、"}, {"t": 887.7666666666667, "x": "三年近くも何らの手を打とうとしなかった通産省、\n公正取引委員会、警察庁、つまり政府の責任は"}, {"t": 894.4666666666667, "x": "実に重大であり、世人の批判を\n浴びているのは当然のことであります」"}, {"t": 898.6, "x": "三年近く。"}, {"t": 899.8, "x": "一千億円と推定される段階で、報告が出ている。"}, {"t": 903.1166666666667, "x": "そこから破綻まで、まだ二年ある。"}, {"t": 905.95, "x": "動いていたのは、国会だけではない。"}, {"t": 908.1666666666666, "x": "岩本参考人が、弁護士側の動きを\n年表で述べている。順に読む。"}, {"t": 912.5666666666667, "x": "「昭和五十八年の八月からは、"}, {"t": 914.6, "x": "朝日新聞名古屋本社が、これまた実名で、"}, {"t": 917.4166666666666, "x": "豊田商事は詐欺商法であるとして\nキャンペーンを始めております」"}, {"t": 921.2, "x": "実名で。"}, {"t": 922.15, "x": "新聞が会社の名前を出して、\n詐欺商法だと書いている。"}, {"t": 925.5833333333334, "x": "破綻の二年前だ。"}, {"t": 926.8833333333333, "x": "続く。"}, {"t": 927.5333333333333, "x": "「同じく五十八年十月には、"}, {"t": 929.4166666666666, "x": "全国二百十八名の弁護士が豊田商事に\n対して公開質問状を発して、"}, {"t": 934.2166666666667, "x": "金の保有量とか金の運用方法とか金の運用先を\n明らかにするようにと問いただしております」"}, {"t": 940.0, "x": "二百十八人。"}, {"t": 941.3166666666667, "x": "質問の中身が大事だ。"}, {"t": 943.0166666666667, "x": "金の保有量。金の運用方法。金の運用先。"}, {"t": 946.2833333333333, "x": "預かっていることになっている金が、本当にあるのか。"}, {"t": 949.4833333333333, "x": "あるとして、どこにあって、何に使われているのか。"}, {"t": 952.65, "x": "それを出せ、という質問だ。"}, {"t": 954.4833333333333, "x": "この三つに答えられれば、この商法は成り立つ。"}, {"t": 957.2833333333333, "x": "答えられなければ、成り立たない。"}, {"t": 959.4666666666667, "x": "答えたの？"}, {"t": 960.4166666666666, "x": "会議録には、この質問状への回答があったとは\n書かれていない。"}, {"t": 964.2333333333333, "x": "そして、次の段階に進む。"}, {"t": 966.3, "x": "「翌昭和五十九年三月には、"}, {"t": 968.2666666666667, "x": "全国各地で豊田商事の被害と取り組んできた\n弁護士さんが代理人になりまして、"}, {"t": 973.0833333333334, "x": "豊田商事に対し、出資法違反、詐欺罪で\n大阪地方検察庁に刑事告訴いたしております」"}, {"t": 979.05, "x": "一九八四年三月。破綻の一年三か月前だ。"}, {"t": 983.0, "x": "刑事告訴が出ている。"}, {"t": 985.0333333333333, "x": "告訴から一年三か月、何が起きたか。"}, {"t": 987.8833333333333, "x": "岩本参考人はこう述べている。"}, {"t": 989.9, "x": "「その後も刑事事件としては"}, {"t": 991.2, "x": "何ら進展が見られなかったものですから、\nことしになって、ついに法務大臣に対し、"}, {"t": 996.2666666666667, "x": "商法第五十八条に基づく会社解散命令の発動を\n求める申し立てを準備してきたわけです」"}, {"t": 1002.2166666666667, "x": "「このように、非常に早くから\n一連の活動が行われてきたのですが、"}, {"t": 1006.2666666666667, "x": "検察庁や警察庁は何ら有効な"}, {"t": 1008.5, "x": "対策を打ち出さないままことしの七月一日の破産宣告を\n迎えてしまったわけです」"}, {"t": 1013.7833333333333, "x": "何も打ち出さないまま。"}, {"t": 1015.3666666666667, "x": "行政の側は、どうだったか。"}, {"t": 1017.25, "x": "東京弁護団の団長で、\n日本大学法学部の教授でもあった\n北野弘久さんが、意見の最後にこう述べている。"}, {"t": 1024.15, "x": "「徴税当局は強大な税務調査権を\n持っておるのでありまして、"}, {"t": 1027.65, "x": "豊田商法の実態を早くから熟知できたはずであります」"}, {"t": 1031.2166666666667, "x": "「事実、国会等でも早くから\n話題になっておりますので、当然に\nその違法性を察知できたと私は"}, {"t": 1037.0, "x": "考えておるのであります」"}, {"t": 1038.5666666666666, "x": "そして、この一行だ。"}, {"t": 1040.1333333333334, "x": "「ようやく通産省が文書で行政指導をしましたのは、"}, {"t": 1043.0666666666666, "x": "破産宣告直前の本年の六月十九日付でありまして、\nこれでは余りにも"}, {"t": 1047.95, "x": "遅きに失したと言わねばならないと思います」"}, {"t": 1050.5333333333333, "x": "六月十九日？"}, {"t": 1051.8833333333334, "x": "会長が殺害された翌日だ。"}, {"t": 1053.9833333333333, "x": "そして、破産宣告の十二日前だ。"}, {"t": 1056.55, "x": "北野さんは、こう続けている。"}, {"t": 1058.4666666666667, "x": "「このような行政の対応というものは、\n世界に冠たるはずの文化的法治国家である\n日本の恥であります」"}, {"t": 1064.5333333333333, "x": "ここで、はっきりさせておきたいことがある。"}, {"t": 1067.0, "x": "行政が動かなかったのは、\n知らなかったからではない。"}, {"t": 1070.15, "x": "相談は年間九百件を超えていた。"}, {"t": 1072.35, "x": "新聞は実名で書いた。"}, {"t": 1073.8666666666666, "x": "弁護士二百十八人が質問状を出した。"}, {"t": 1076.55, "x": "刑事告訴もされた。国会でも名前が出た。"}, {"t": 1079.5666666666666, "x": "全部あったのね。"}, {"t": 1080.8, "x": "全部あって、動かなかった。"}, {"t": 1082.65, "x": "では、なぜ動かなかったのか。"}, {"t": 1084.5666666666666, "x": "そこには、はっきりした答えが残っている。"}, {"t": 1087.8333333333333, "x": "一九八六年四月二十三日、衆議院の商工委員会。"}, {"t": 1092.1666666666667, "x": "社会党の和田貞夫さんが、政府側にこう聞いている。"}, {"t": 1095.35, "x": "「今の出資法で悪徳商法を取り締まるという\nことはできないだろうか、できないとするならば\n出資法を今日の時点に沿うような"}, {"t": 1101.95, "x": "改正をする必要があるのじゃないか」"}, {"t": 1104.1166666666666, "x": "出資法というのは、正確には「出資の受入れ、\n預り金及び金利等の取締りに関する法律」だ。"}, {"t": 1110.7166666666667, "x": "他人からお金を預かる商売を規制する法律だ。"}, {"t": 1113.8666666666666, "x": "お金を集めていたのだから、これで足りそうだけど。"}, {"t": 1116.95, "x": "そこが問題だった。"}, {"t": 1118.3, "x": "答えたのは、大蔵省大臣官房企画官の坂篤郎さんだ。"}, {"t": 1122.1333333333334, "x": "「これを出資法の改正で行うことにつきましては、"}, {"t": 1125.0166666666667, "x": "禁止というふうになっておりますので、\nその悪質なもののみ的確に法文上"}, {"t": 1129.3666666666666, "x": "取り出しまして規定するということが、"}, {"t": 1131.4333333333334, "x": "技術的に見て非常に難しくて可能か\n否かという問題があるのではないか」"}, {"t": 1135.9666666666667, "x": "「他方、それでは広く禁止してしまっては"}, {"t": 1138.4166666666667, "x": "どうかということになりますと、"}, {"t": 1139.85, "x": "物を預かるという行為全般にまで禁止がかかるような\nことにもなってしまうわけでございまして、"}, {"t": 1144.9666666666667, "x": "経済活動に対する規制としては\n広過ぎるのではないか」"}, {"t": 1148.5, "x": "そして、この一行が核心だ。"}, {"t": 1150.5833333333333, "x": "「また出資法と申しますものは"}, {"t": 1152.2666666666667, "x": "金銭の預かりや出資を規制する法律でございまして、"}, {"t": 1155.4166666666667, "x": "物に着目した規制というものとは\nなじまない面もあるのではないか」"}, {"t": 1159.5166666666667, "x": "金銭ではなくて、物を預かっている形だから？"}, {"t": 1162.7166666666667, "x": "そうだ。"}, {"t": 1163.3166666666666, "x": "現金を集めているのに、書類の上では\n「金地金を預かっている」ことになっている。"}, {"t": 1168.3, "x": "だから、お金を預かる商売を\n取り締まる法律の外に出てしまう。"}, {"t": 1172.1833333333334, "x": "通産省の側も、同じ趣旨のことを言っている。"}, {"t": 1175.0666666666666, "x": "大臣官房審議官の松尾邦彦さんだ。"}, {"t": 1177.8166666666666, "x": "「いわゆる現物まがい商法につきまして\n消費者保護の観点を踏まえた一般的な"}, {"t": 1182.55, "x": "法律が用意されておらないということが\n一番問題ではないか」"}, {"t": 1185.8166666666666, "x": "「いわゆる現物まがい取引の特殊性にかんがみまして\n新たな法理的な対応が必要なのではないか」"}, {"t": 1191.7, "x": "つまり、当てはまる\n法律が無かった、というのが政府の説明だ。"}, {"t": 1196.2, "x": "ではもう一本、訪問販売法という法律があった。"}, {"t": 1199.3333333333333, "x": "家に来て売る商売を規制する法律だ。"}, {"t": 1201.7333333333333, "x": "豊田商事の手口は、電話で当たりをつけて、\n家に上がり込むというものだった。"}, {"t": 1206.4, "x": "それなら、訪問販売法でしょう。"}, {"t": 1208.6666666666667, "x": "同じ日、和田さんはそこも聞いている。"}, {"t": 1210.9166666666667, "x": "「遠くは昭和五十七年に"}, {"t": 1212.3666666666666, "x": "東京都の知事からの要望書、あるいは同じように\n関東地方知事会からの要望書、これには訪問販売に"}, {"t": 1218.4, "x": "関する法律を何とか現行に合うような法律の内容に\n改正してほしいという要望が出ております」"}, {"t": 1224.0, "x": "「国民生活審議会の報告も訪問販売法を\n洗い直すべきであるという意見が出ております」"}, {"t": 1229.4833333333333, "x": "「なぜ訪問販売法を改正しようとしないのか、\nわからないのであります」"}, {"t": 1233.6333333333334, "x": "松尾審議官の答えだ。"}, {"t": 1235.2666666666667, "x": "「訪問販売等の取引というのは、"}, {"t": 1237.3666666666666, "x": "一方におきまして\n消費者の利便の増進あるいは流通の近代化等に\n資する面がございますので」"}, {"t": 1242.8833333333334, "x": "「健全な取引にまで悪影響を及ぼすことのない\n効果的な取引の適正化を図る必要があると"}, {"t": 1248.55, "x": "考えておりますので、そのような"}, {"t": 1250.3833333333334, "x": "観点から訪問販売法そのものの改正につきましては\n慎重な対応をすべきものだ」"}, {"t": 1255.5833333333333, "x": "慎重な対応。"}, {"t": 1256.8, "x": "ここは、意地悪に読まないでおきたい。"}, {"t": 1258.9666666666667, "x": "訪問販売そのものは、違法ではない。"}, {"t": 1261.3666666666666, "x": "家に来て物を売る商売は、いまも普通にある。"}, {"t": 1264.1166666666666, "x": "規制をきつくすれば、まっとうな商売にも網がかかる。"}, {"t": 1267.3333333333333, "x": "だから慎重にする、という言い分自体は成り立つ。"}, {"t": 1270.4, "x": "でも。"}, {"t": 1271.05, "x": "ああ。その慎重さのあいだに、\n四年で二万五千人が届け出た。"}, {"t": 1274.9833333333333, "x": "この二つを天秤にかけたときに、どちらが重いのか。"}, {"t": 1278.2833333333333, "x": "それが、この事件が突きつけた問いだ。"}, {"t": 1281.3333333333333, "x": "一九八六年四月十七日、衆議院本会議。"}, {"t": 1285.2, "x": "通商産業大臣の渡辺美智雄さんが、\n新しい法律案の趣旨を説明している。"}, {"t": 1290.2, "x": "「特定商品等の預託等取引契約に関する法律案」だ。"}, {"t": 1294.2333333333333, "x": "冒頭がこうなっている。"}, {"t": 1295.6, "x": "「豊田商事に端を発したいわゆる現物まがい商法に\nよる消費者の被害が昨年来大きな社会問題となり、"}, {"t": 1301.85, "x": "同種の被害の再発防止対策の必要性が\n指摘されてまいりました」"}, {"t": 1306.4, "x": "法案の説明に、会社の名前が出ている。"}, {"t": 1309.15, "x": "この法律は、この事件のために\n作られたものだ、と国会の記録に残っている。"}, {"t": 1314.0333333333333, "x": "続きだ。"}, {"t": 1314.7833333333333, "x": "「関係六省庁間の検討結果を踏まえ、"}, {"t": 1317.2666666666667, "x": "産業構造審議会に諮問し、三月十一日に\n答申を得たところであります」"}, {"t": 1322.1833333333334, "x": "「答申では、悪質な取引については\n実質的に禁止の効果を持ち、"}, {"t": 1326.4333333333334, "x": "消費者被害の再発防止が図れるような立法措置を\n講ずるべきであると指摘しております」"}, {"t": 1331.7833333333333, "x": "中身は五つだ。読む。"}, {"t": 1333.4, "x": "一つ、勧誘に際し、契約及び事業者の概要について\n書面を交付しなければならない。"}, {"t": 1338.7666666666667, "x": "二つ、契約を締結した場合には、契約内容を\n書面で明確にしなければならない。"}, {"t": 1343.9833333333333, "x": "三つ、不当な勧誘行為その他顧客または\n預託者の保護に欠ける行為を禁止する。"}, {"t": 1348.95, "x": "四つ、預託者は、事業者の業務及び財産の状況を\n記載した書類の閲覧を求めることができる。"}, {"t": 1355.1666666666667, "x": "閲覧を求められる。"}, {"t": 1356.6333333333334, "x": "これが、二百十八人の弁護士が\n公開質問状で聞いたことだ。"}, {"t": 1360.7166666666667, "x": "金は本当にあるのか。どこにあるのか。"}, {"t": 1363.15, "x": "それを、客が請求できる権利にした。"}, {"t": 1365.6333333333334, "x": "五つ目。"}, {"t": 1366.3666666666666, "x": "契約締結後十四日以内のクーリングオフを\n認め、その期間が過ぎたあとも、いつでも"}, {"t": 1371.3333333333333, "x": "契約を解除する権利を与える。"}, {"t": 1373.4, "x": "そして、損害賠償や違約金の請求額も制限する。"}, {"t": 1377.0333333333333, "x": "そのうえで、業務停止命令と罰則が置かれた。"}, {"t": 1379.9333333333334, "x": "この法律は、昭和六十一年法律第六十二号として、\n一九八六年五月二十三日に公布されている。"}, {"t": 1387.9833333333333, "x": "この法案には、その場で厳しい批判が出ている。"}, {"t": 1390.9, "x": "同じ日、趣旨説明のすぐあとに質疑に\n立ったのが、さっきの上坂昇さんだ。"}, {"t": 1395.8333333333333, "x": "「豊田商事は既に崩壊し、"}, {"t": 1397.5166666666667, "x": "豊田式不正商法のばっこする余地は"}, {"t": 1399.7333333333333, "x": "当分遠のいていると考えられるのに、\nあえてこの法案を提出してきたのは」"}, {"t": 1404.1666666666667, "x": "「行政の今までの長い間の怠慢に対する世論の非難や"}, {"t": 1407.4833333333333, "x": "厳しい批判をかわそうとしてとられた、まさにこそくな\n手段のあらわれであると断ぜざるを得ません」"}, {"t": 1412.95, "x": "もう終わったあとに作った、と。"}, {"t": 1414.9333333333334, "x": "批判はそれだけではない。"}, {"t": 1416.3, "x": "中身についてもだ。"}, {"t": 1417.65, "x": "「預託等取引契約に係る預託者の利益を\n守るものとしていますが、望まれる禁止法ではなくて、"}, {"t": 1423.5666666666666, "x": "単なる行為規制法にとどまっており」"}, {"t": 1425.8, "x": "「顧客に対する書面の交付、"}, {"t": 1427.5333333333333, "x": "不当な行為の禁止事項あるいは書類の閲覧を\n義務づける、その程度で、"}, {"t": 1431.65, "x": "手をかえ品をかえて脱法行為をねらう不正取引から、"}, {"t": 1434.75, "x": "どうして預託者を守ることができるでありましょうか」"}, {"t": 1437.65, "x": "禁止法か、行為規制法か。"}, {"t": 1439.6333333333334, "x": "ここは、この回でいちばん\n覚えておいてほしい対立点だ。"}, {"t": 1443.0666666666666, "x": "どう違うの？"}, {"t": 1444.05, "x": "禁止法は「やるな」と言う。"}, {"t": 1445.9166666666667, "x": "行為規制法は「やってもいいが、\nこういう手順を守れ」と言う。"}, {"t": 1449.6, "x": "一九八六年に作られたのは、後者だった。"}, {"t": 1453.0333333333333, "x": "書面を渡せ。うそを言うな。"}, {"t": 1454.7, "x": "帳簿を見せろ。解約させろ。"}, {"t": 1456.6166666666666, "x": "どれも大事だが、商法そのものを禁じてはいない。"}, {"t": 1459.5833333333333, "x": "上坂さんは、そこでは足りないと言った。"}, {"t": 1462.0333333333333, "x": "この対立が決着するまでに、どれくらいかかったか。"}, {"t": 1465.3166666666666, "x": "それは、最後に話す。"}, {"t": 1467.5833333333333, "x": "二年後、動かなかったほうの法律も動いた。"}, {"t": 1470.4, "x": "一九八八年、訪問販売法の改正だ。"}, {"t": 1473.8666666666666, "x": "四月十五日の衆議院商工委員会で、\n参考人質疑が行われている。"}, {"t": 1478.4166666666667, "x": "日本消費生活コンサルタント協会の会長、\n三村光代さんの意見だ。"}, {"t": 1482.8666666666666, "x": "この人は、会員の約七割が各地の消費生活センターで\n相談に当たっている団体の代表として来ている。"}, {"t": 1489.45, "x": "まず、相談の数だ。"}, {"t": 1491.0333333333333, "x": "「昭和五十四年の東京都のデータを見てみますと、"}, {"t": 1493.7333333333333, "x": "全体の相談件数が\n一万一千二百九十八件でございました。\nそれが六十一年の件数ですと、"}, {"t": 1500.0666666666666, "x": "倍の二万八千五百八十三件になっております」"}, {"t": 1503.3666666666666, "x": "「五十九年のデータでは"}, {"t": 1504.8, "x": "全体の中の千九百三十件だけが訪問販売に\nかかわるトラブルだったわけですが、"}, {"t": 1509.7, "x": "六十一年には七千七百三十六件と\nはね上がっております」"}, {"t": 1513.9333333333334, "x": "二年で四倍？"}, {"t": 1515.05, "x": "東京都だけの数字だ。"}, {"t": 1516.6, "x": "そして、この改正でよくなった点を二つ挙げている。"}, {"t": 1519.75, "x": "一つ目。現金販売にクーリングオフが適用されたこと。"}, {"t": 1523.3166666666666, "x": "「現金販売の場合には今まで"}, {"t": 1525.0333333333333, "x": "クーリングオフが適用されなかったために、"}, {"t": 1527.25, "x": "何とかして現金で売っていってしまおうとする\nセールスマンが多かったわけです」"}, {"t": 1531.5666666666666, "x": "「例えば、お金がないときには"}, {"t": 1533.4333333333334, "x": "銀行まで連れていって、銀行で貯金を\nおろさせて現金販売にしてしまうというような\nケースもありました」"}, {"t": 1539.25, "x": "銀行まで連れていって。"}, {"t": 1540.8333333333333, "x": "豊田商事の手口の十番目と同じだ。"}, {"t": 1543.15, "x": "通帳と印鑑を持って行って、自分でおろす。"}, {"t": 1545.95, "x": "その形にすれば、クーリングオフが効かなかった。"}, {"t": 1548.9166666666667, "x": "二つ目。クーリングオフの告知に罰則がついたことだ。"}, {"t": 1552.2666666666667, "x": "「クーリングオフの告知というのは\n現行法でもあるわけですけれども、"}, {"t": 1555.7333333333333, "x": "罰則が担保されていなかったために、"}, {"t": 1557.9166666666667, "x": "クーリングオフで解除していただいても払った頭金が\n戻ってこないというトラブルも多発しております」"}, {"t": 1563.5666666666666, "x": "告知の義務はあったが、守らなくても罰がなかった。"}, {"t": 1566.75, "x": "だから、守られていなかった。"}, {"t": 1569.3, "x": "同じ日、三村さんは足りない点も挙げている。"}, {"t": 1572.0, "x": "「指定商品制という形が\n現行法でとられているのですが、\n指定商品制をとられているために、"}, {"t": 1577.4333333333334, "x": "指定商品に入っていないものを買った消費者が\n救済されないという例があるのですが」"}, {"t": 1582.2833333333333, "x": "「消費者は買うときに、これが指定商品だからとか"}, {"t": 1585.25, "x": "指定商品じゃないからというようなことを\n考えて買っているわけではありません」"}, {"t": 1589.3, "x": "指定商品って？"}, {"t": 1590.6, "x": "この法律が守ってくれる商品が、政令で決まっていた。"}, {"t": 1594.1166666666666, "x": "その一覧に載っている物を買えば守られる。"}, {"t": 1596.5, "x": "載っていない物を買えば、守られない。"}, {"t": 1598.7666666666667, "x": "買うほうは、そんな一覧を知らない。"}, {"t": 1600.8833333333334, "x": "同じ日、弁護士の参考人からは、もっと\n踏み込んだ提案が出ている。三つだ。"}, {"t": 1605.7333333333333, "x": "一つ、禁止事項をもっと具体的に書くこと。"}, {"t": 1608.55, "x": "日弁連は二十二の類型にまとめている、と述べている。"}, {"t": 1612.0333333333333, "x": "二つ、契約解除権を入れること。"}, {"t": 1614.35, "x": "クーリングオフの期間が過ぎたあとでも、"}, {"t": 1616.3833333333334, "x": "悪質なやり方で結ばされた\n契約は抜けられるようにする、というものだ。"}, {"t": 1620.8166666666666, "x": "三つ、開業規制。誰が訪問販売をやっているかを\n行政が把握できるようにし、"}, {"t": 1625.55, "x": "悪質な業者が入ってこられないようにする。"}, {"t": 1628.3, "x": "この人は、こう言い切っている。"}, {"t": 1630.1166666666666, "x": "「開業規制と契約解除権を採用しないで\n到底悪質行為規制の実効性は\n期待し得ないのであります」"}, {"t": 1636.3833333333334, "x": "入らなかったのね。"}, {"t": 1637.7666666666667, "x": "一九八八年の時点では、入っていない。"}, {"t": 1640.9666666666667, "x": "この訪問販売法は、そのあと何度も\n改正され、二〇〇〇年に名前が変わった。"}, {"t": 1645.8166666666666, "x": "いまの「特定商取引に関する法律」だ。"}, {"t": 1648.9, "x": "法律そのものは同じもので、\n昭和五十一年法律第五十七号として\n一九七六年に公布されている。"}, {"t": 1655.8666666666666, "x": "制定時の名前が「訪問販売等に関する法律」だった。"}, {"t": 1659.75, "x": "名前が変わったのは、対象が\n訪問販売だけではなくなったからだ。"}, {"t": 1664.3833333333334, "x": "では、あの一九八六年の法律はいまどうなっているか。"}, {"t": 1668.2666666666667, "x": "名前が変わっている。いまは\n「預託等取引に関する法律」だ。"}, {"t": 1672.45, "x": "第一条を読む。"}, {"t": 1673.5333333333333, "x": "「この法律は、預託等取引に係る\n預託者が受けることのある損害の防止に"}, {"t": 1678.1166666666666, "x": "関する規制を定めるとともに、"}, {"t": 1679.9333333333334, "x": "販売を伴う預託等取引を原則として\n禁止する等の措置を講ずることにより、"}, {"t": 1685.0166666666667, "x": "預託者の利益の保護を図ることを目的とする」"}, {"t": 1688.1333333333334, "x": "原則として禁止する？"}, {"t": 1689.8833333333334, "x": "ああ。目的の条文に「禁止」と書いてある。"}, {"t": 1692.8333333333333, "x": "一九八六年に上坂さんが「禁止法ではなくて\n行為規制法にとどまっている」と言った、その部分だ。"}, {"t": 1699.7166666666667, "x": "いまの法律には、第九条という条文がある。"}, {"t": 1702.3666666666666, "x": "見出しは「勧誘等の禁止」だ。"}, {"t": 1704.65, "x": "中身を、なるべく短く言い直す。"}, {"t": 1706.8833333333334, "x": "物を売って、それをそのまま預かる、という\n形の商売をやろうとするなら。"}, {"t": 1711.2333333333333, "x": "その物の種類ごとに、"}, {"t": 1712.5666666666666, "x": "客の財産上の利益が不当に侵害される\nおそれがないことについて、"}, {"t": 1716.4666666666667, "x": "あらかじめ内閣総理大臣の確認を\n受けなければならない。"}, {"t": 1720.0833333333333, "x": "確認を受けていないなら、\n勧誘も広告もしてはならない。"}, {"t": 1723.6166666666666, "x": "勧誘そのものが、できない。"}, {"t": 1725.5666666666666, "x": "そして第十四条、「契約の締結等の禁止」。"}, {"t": 1728.6166666666666, "x": "確認を受けていない種類の物については、\n売買契約も、預かる契約も、結んではならない。"}, {"t": 1734.45, "x": "つまり、いまは、こうなっている。"}, {"t": 1736.3666666666666, "x": "「客が来たら書面を渡せ」ではない。"}, {"t": 1738.65, "x": "「先に確認を取れ。取れていなければ、\n声をかけることすら禁止だ」だ。"}, {"t": 1743.0333333333333, "x": "一九八六年に足りないと言われた\n形に、いまはなっている。"}, {"t": 1747.2833333333333, "x": "どのくらいかかったの？"}, {"t": 1748.7666666666667, "x": "一九八五年に会社が潰れて、そこから三十年以上だ。"}, {"t": 1753.6333333333334, "x": "ここからは、答えの出ていない話をする。三つある。"}, {"t": 1756.8833333333334, "x": "一つ目。なぜ止められなかったのか、という\n問いに対して、答えは三通り並んでいる。"}, {"t": 1762.0, "x": "一つ目の答えは、政府が言ったものだ。"}, {"t": 1764.3666666666666, "x": "当てはまる法律が無かった。"}, {"t": 1766.2, "x": "出資法はお金を預かる商売の法律で、\n物を預かる形にはなじまない。"}, {"t": 1770.7333333333333, "x": "訪問販売法をきつくすれば、まっとうな商売に当たる。"}, {"t": 1774.1166666666666, "x": "だから新しい法律を作った、という説明だ。"}, {"t": 1777.1166666666666, "x": "二つ目の答えは、弁護士たちが言ったものだ。"}, {"t": 1779.95, "x": "現行法でも詐欺罪でやれたはずだ、というものだ。"}, {"t": 1782.95, "x": "岩本参考人はこう述べている。"}, {"t": 1784.9333333333334, "x": "「豊田商事の刑事事件としての本質はやはり"}, {"t": 1787.05, "x": "詐欺罪なんだということを十分"}, {"t": 1789.4833333333333, "x": "認識していただきまして、これから先、さらに厳正な\n捜査を進めていただくよう期待いたしております」"}, {"t": 1795.35, "x": "三つ目の答えは、上坂議員が言ったものだ。"}, {"t": 1798.1666666666667, "x": "法律の問題ではなく、三年近く手を\n打たなかった行政の怠慢だ、というものだ。"}, {"t": 1803.3833333333334, "x": "どれが正しいの？"}, {"t": 1804.6166666666666, "x": "私は決めない。決められる材料が無い。"}, {"t": 1807.05, "x": "ただ、この三つが同じ委員会の記録に\n並んでいる、ということは残しておきたい。"}, {"t": 1811.8, "x": "二つ目の疑問。被害者は、いくら戻ったのか。"}, {"t": 1814.8333333333333, "x": "これは、分からなかった。"}, {"t": 1816.45, "x": "最終的な配当がどうなったかを、私は\n公的な記録で確認できていない。"}, {"t": 1821.2, "x": "分かっているのは、一九八五年九月の時点で\n三橋さんがこう言っていたことだけだ。"}, {"t": 1826.7, "x": "「果たしてどれだけの配当ができるかということは\n極めて厳しい現状でございます」"}, {"t": 1831.2666666666667, "x": "「この破産財団からの配当以外に、"}, {"t": 1833.3666666666666, "x": "今のところ被害者の救済を図れるという\nめどのついておるものは何一つございません」"}, {"t": 1838.2666666666667, "x": "三つ目。これがいちばん引っかかっている。"}, {"t": 1840.6666666666667, "x": "この事件は、いまでも「報道陣の前で\n会長が殺された事件」として語られる。"}, {"t": 1845.6666666666667, "x": "その一日のことは、みんな知っている。"}, {"t": 1848.1666666666667, "x": "でも、四年間のほうは。"}, {"t": 1849.9333333333334, "x": "ああ。一九八二年から\n一九八五年までのほうは、あまり語られない。"}, {"t": 1855.1333333333334, "x": "相談が九百件を超えても、新聞が実名で書いても、\n二百十八人の弁護士が質問状を出しても、"}, {"t": 1861.4, "x": "刑事告訴が出ても、国会で名前が\n呼ばれても、動かなかった四年間だ。"}, {"t": 1866.0833333333333, "x": "そして、その「動かない」という\n事実そのものが、営業の材料に使われた。"}, {"t": 1870.9333333333334, "x": "国が何も言わないから大丈夫です、と\n言われて、次の人が契約した。"}, {"t": 1875.35, "x": "ここが、この事件のいちばん\n怖いところだと私は思っている。"}, {"t": 1879.6333333333334, "x": "最後に、この回で扱わなかったものを言っておく。"}, {"t": 1882.6, "x": "会長が殺害された場面を描写しなかった。"}, {"t": 1885.2166666666667, "x": "写真も映像も使わなかった。"}, {"t": 1887.2333333333333, "x": "実行犯の裁判がどうなったかにも触れなかった。"}, {"t": 1890.0166666666667, "x": "判決を私は確認できていないからだ。"}, {"t": 1892.6666666666667, "x": "国会に残っているのは、大阪府警の答弁までだ。"}, {"t": 1895.9166666666667, "x": "被疑者らは、詐欺的商法に義憤を\n感じての個人的犯行だと供述している。"}, {"t": 1900.6333333333334, "x": "背後関係は認められない。"}, {"t": 1902.5333333333333, "x": "そこから先は、私が語れる材料がない。"}, {"t": 1905.4666666666667, "x": "分からないことは、分からないままね。"}, {"t": 1907.8, "x": "ああ。"}, {"t": 1908.2, "x": "この回で並べたのは、そのかわりに、\n記録に残っている数字と言葉だ。"}, {"t": 1912.6166666666666, "x": "破産手続に届け出た人が、二万五千三百七十二人。"}, {"t": 1916.6333333333334, "x": "被害総額、一千百十七億円。"}, {"t": 1918.9666666666667, "x": "平均で四百四十万円。"}, {"t": 1920.8833333333334, "x": "大阪弁護団に届けた人のうち、\n六十歳未満の男性は一三％だけ。"}, {"t": 1925.9333333333334, "x": "名古屋では、六十歳以上が六割で、\n三百万円以上を失った人が四三％。"}, {"t": 1931.5833333333333, "x": "相談は、五十六年度に百九十六件、五十七年度に\n三百八十四件、五十八年度に九百三十四件。"}, {"t": 1939.0333333333333, "x": "通産省が文書で行政指導したのは、\n破産宣告の十二日前。"}, {"t": 1943.2166666666667, "x": "この数字が全部、公の記録に残っている。"}, {"t": 1946.25, "x": "残っているのに、間に合わなかったのね。"}, {"t": 1948.75, "x": "一九八六年に預託法ができた。"}, {"t": 1951.4333333333334, "x": "一九八八年に訪問販売法が変わった。"}, {"t": 1954.8166666666666, "x": "現金で買ってもクーリングオフができるようになった。"}, {"t": 1957.55, "x": "告知を守らなければ罰がつくようになった。"}, {"t": 1960.3, "x": "そして、いまの預託法は、目的の条文に\n「原則として禁止する」と書いてある。"}, {"t": 1965.6166666666666, "x": "確認を受けていなければ、声をかけることもできない。"}, {"t": 1968.7, "x": "この形になるまでに、三十年以上かかった。"}, {"t": 1971.7, "x": "最後に、手記の一つをもう一度読んで終わる。"}, {"t": 1974.4333333333334, "x": "「人を信じることのできない\n世の中にしたくありません」"}, {"t": 1977.4666666666667, "x": "「これからの子供たちのためにもあのような"}, {"t": 1979.6333333333334, "x": "悪徳商法がはびこらないように\n取り締まっていただきたいと思います」"}, {"t": 1983.4333333333334, "x": "一九八五年に、八十歳を過ぎた\n人たちが、そう書いて国会に送っている。"}, {"t": 1988.8, "x": "今回の内容は、国会会議録と\n法令の条文だけを根拠にした。"}, {"t": 1992.85, "x": "出典は概要欄に置いておく。"}, {"t": 1994.8833333333334, "x": "最後まで見てくれて、ありがとうな。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
