<script>
const D={"name": "107", "file": "107_編集用", "dur": 2016.05, "segs": [], "subs": [{"t": 0.0, "x": "1993年12月16日。ひとりの元総理大臣が亡くなった。"}, {"t": 5.016666666666667, "x": "田中角栄。75歳だった。"}, {"t": 7.233333333333333, "x": "このとき、ある裁判がまだ途中だった。"}, {"t": 9.833333333333334, "x": "どんな裁判？"}, {"t": 10.866666666666667, "x": "5億円を受け取ったとして、検察が起訴した裁判だ。"}, {"t": 14.283333333333333, "x": "一審と二審は、有罪と判断していた。"}, {"t": 16.966666666666665, "x": "最高裁の判決は、まだ出ていなかった。"}, {"t": 19.783333333333335, "x": "じゃあ、どうなったの？"}, {"t": 21.166666666666668, "x": "裁判はそこで打ち切られた。"}, {"t": 22.766666666666666, "x": "公訴棄却という手続きだ。"}, {"t": 24.6, "x": "だから有罪だったのかどうか、\n法律の上の最後の答えは分かっていない。"}, {"t": 28.933333333333334, "x": "最後まで決まらなかったのね。"}, {"t": 30.833333333333332, "x": "決まらなかった。これがロッキード事件の裁判だ。"}, {"t": 33.81666666666667, "x": "名前は誰でも聞いたことがある事件だ。"}, {"t": 36.083333333333336, "x": "でも、どう終わったのかを言える人は多くない。"}, {"t": 38.6, "x": "今回は、残っている紙を順番に読んでいく。"}, {"t": 41.43333333333333, "x": "国会の会議録と2つの判決文だ。"}, {"t": 44.166666666666664, "x": "紙だけで？"}, {"t": 45.11666666666667, "x": "紙だけでだ。答えが出ていないところは、\n出ていないまま話す。"}, {"t": 48.85, "x": "最初の紙は1976年2月16日。"}, {"t": 52.11666666666667, "x": "国会の予算委員会だ。"}, {"t": 53.8, "x": "ひとりの男性が立って、紙を読み上げた。"}, {"t": 56.36666666666667, "x": "良心に従って真実を述べる。"}, {"t": 58.5, "x": "何事もかくさず、何事もつけ加えない。"}, {"t": 61.25, "x": "それを誓いますという紙だ。"}, {"t": 63.11666666666667, "x": "宣誓ってやつね。"}, {"t": 64.5, "x": "そうだ。読んだのは小佐野賢治という実業家だ。"}, {"t": 67.4, "x": "証人として呼ばれていた。"}, {"t": 69.03333333333333, "x": "小佐野さんが話した回数を、会議録から数えてみた。"}, {"t": 72.5, "x": "数えたの？"}, {"t": 73.45, "x": "数えた。発言の区切りごとにだ。"}, {"t": 75.68333333333334, "x": "宣誓を入れて147回になる。"}, {"t": 78.03333333333333, "x": "そのうち「記憶」という言葉が入った答えが19回ある。"}, {"t": 81.83333333333333, "x": "それってあの有名な言い方？"}, {"t": 83.65, "x": "「記憶にございません」だな。"}, {"t": 85.35, "x": "ところが、その形のままの言葉は0回だった。"}, {"t": 88.63333333333334, "x": "0回？　1回も？"}, {"t": 90.13333333333334, "x": "1回もない。"}, {"t": 91.03333333333333, "x": "記録にあるのは「記憶がございません」が3回。"}, {"t": 93.98333333333333, "x": "「記憶はございません」が2回。"}, {"t": 95.66666666666667, "x": "「記憶がありません」が4回。"}, {"t": 97.5, "x": "少しずつ言い方が違うんだ。"}, {"t": 99.36666666666666, "x": "いまここでは記憶はございません。"}, {"t": 101.18333333333334, "x": "この答えのすぐあとに、かっこ書きで笑声とある。"}, {"t": 104.23333333333333, "x": "会議録に笑い声まで残るの？"}, {"t": 106.33333333333333, "x": "残る。部屋の空気まで、文字で残っている。"}, {"t": 109.21666666666667, "x": "なのに、ひとつの言葉として覚えられてるのね。"}, {"t": 112.7, "x": "50年たつと言葉は丸くなる。"}, {"t": 114.76666666666667, "x": "始まりは日本ではなかった。"}, {"t": 116.55, "x": "アメリカの上院だ。"}, {"t": 117.76666666666667, "x": "外交委員会の中に、多国籍企業を\n調べる小委員会があった。"}, {"t": 121.8, "x": "その公聴会が、1976年の2月4日と\n6日に開かれている。"}, {"t": 126.78333333333333, "x": "アメリカの議会で、日本の話が出たの？"}, {"t": 129.5, "x": "出た。調べられていたのはロッキードという会社だ。"}, {"t": 132.45, "x": "飛行機をつくっているアメリカの会社だな。"}, {"t": 134.9, "x": "その会社が、外国で飛行機を\n売るために金を使っていた。"}, {"t": 138.56666666666666, "x": "その中に日本の話が入っていた。"}, {"t": 140.91666666666666, "x": "公聴会の議事録は、外務省を\n通じて国会にも届いている。"}, {"t": 144.7, "x": "国会の議員はそれを手に持って質問していた。"}, {"t": 147.63333333333333, "x": "どんな話？"}, {"t": 148.7, "x": "日本の国会の記録に、委員長の言葉で残っている。"}, {"t": 152.06666666666666, "x": "公聴会では、日本での代理人として\n児玉誉士夫の名前が出た。"}, {"t": 156.0, "x": "ロッキードの社長だった\nコーチャンさんが証言している。"}, {"t": 158.95, "x": "児玉さんから、小佐野さんを紹介された、と。"}, {"t": 161.93333333333334, "x": "それで小佐野さんが呼ばれたのね。"}, {"t": 163.93333333333334, "x": "そうだ。公聴会から12日後のことになる。"}, {"t": 166.75, "x": "ただ、ここは気をつけて聞いてほしい。"}, {"t": 168.91666666666666, "x": "アメリカでの証言は、その人が\nそう話したという記録だ。"}, {"t": 172.46666666666667, "x": "日本の裁判で決まったこととは別だ。"}, {"t": 175.0, "x": "話したことと、決まったことは違うのね。"}, {"t": 177.71666666666667, "x": "違う。この回は、ずっとその2つを分けて進める。"}, {"t": 180.98333333333332, "x": "コーチャンさんは、2008年12月14日に\n94歳で亡くなっている。"}, {"t": 186.18333333333334, "x": "最初の章の小佐野さんに少し戻る。"}, {"t": 188.46666666666667, "x": "委員長はまず公聴会の話をそのままぶつけた。"}, {"t": 191.48333333333332, "x": "小佐野さんとは、児玉さんの仲立ちで知り合った。"}, {"t": 194.36666666666667, "x": "コーチャンさんはそう証言している。"}, {"t": 196.28333333333333, "x": "あなたはそれを認めるか。"}, {"t": 197.96666666666667, "x": "小佐野さんは？"}, {"t": 198.98333333333332, "x": "認めません。ひとことでそう答えた。"}, {"t": 201.28333333333333, "x": "次はコーチャンさんと会ったことがあるかだ。"}, {"t": 203.58333333333334, "x": "ここの答えは少し長い。"}, {"t": 205.23333333333332, "x": "公聴会のころ小佐野さんは仕事でハワイにいた。"}, {"t": 208.0, "x": "新聞社から問い合わせがあって、\n会ったことはないと答えた。"}, {"t": 211.45, "x": "その翌日のことだ。"}, {"t": 212.9, "x": "秘書とテレビを見ていたら秘書がこう言った。"}, {"t": 215.25, "x": "会長、これがコーチャンという人ですよ。"}, {"t": 217.75, "x": "テレビで顔を見たのね。"}, {"t": 219.26666666666668, "x": "そうだ。それで、この人なら2、3度会ったなと話した。"}, {"t": 223.05, "x": "会ったことがない、が2、3度会ったに変わったの？"}, {"t": 226.11666666666667, "x": "本人はそういう順番だったと説明している。"}, {"t": 228.83333333333334, "x": "会った場所も話している。"}, {"t": 230.36666666666667, "x": "自分の会社の本社の応接間だ。"}, {"t": 232.51666666666668, "x": "誰の紹介だったかはよく覚えていないと答えた。"}, {"t": 235.53333333333333, "x": "何を話したの？"}, {"t": 236.83333333333334, "x": "全日空に飛行機を売りたい。"}, {"t": 238.65, "x": "大株主として話をしてもらえないか。"}, {"t": 241.11666666666667, "x": "そう頼まれたが聞き流したと話している。"}, {"t": 243.68333333333334, "x": "全日空の誰にも機種のことは一度も言っていない。"}, {"t": 246.8, "x": "大株主だったのね。"}, {"t": 248.35, "x": "全日空の社長も同じ日にそう話している。"}, {"t": 251.05, "x": "個人の株主としては一番大きい株主だ、と。"}, {"t": 254.18333333333334, "x": "別の議員は田中前総理との仲も聞いた。"}, {"t": 256.8666666666667, "x": "世間では刎頸の友と言われているが、と。"}, {"t": 259.5833333333333, "x": "ふんけい？"}, {"t": 260.35, "x": "首をはねられても悔いのない友という意味だ。"}, {"t": 262.81666666666666, "x": "答えはこうだ。見方は人によるだろう。"}, {"t": 265.25, "x": "30年近くよく知ってはいる。"}, {"t": 267.3666666666667, "x": "否定はしなかったのね。"}, {"t": 268.96666666666664, "x": "知っているとだけ答えた。そこまでだ。"}, {"t": 271.98333333333335, "x": "16日には全日空の社長も証言している。"}, {"t": 274.95, "x": "若狭得治という人だ。"}, {"t": 276.5833333333333, "x": "飛行機を選んだ流れを順番に話した。"}, {"t": 279.0833333333333, "x": "1970年の1月に社内に委員会をつくった。"}, {"t": 282.6, "x": "新しい機種を選ぶための準備の委員会だ。"}, {"t": 285.31666666666666, "x": "候補はいくつあったの？"}, {"t": 286.8333333333333, "x": "3つだ。"}, {"t": 287.53333333333336, "x": "ボーイングの747。"}, {"t": 288.8666666666667, "x": "ダグラスのDC10。"}, {"t": 290.26666666666665, "x": "そしてロッキードのトライスター。"}, {"t": 292.18333333333334, "x": "その中からトライスターを選んだのね。"}, {"t": 294.56666666666666, "x": "選んだ理由も3つ挙げている。"}, {"t": 296.35, "x": "1つめは安全だ。"}, {"t": 297.6666666666667, "x": "2つめは音の小ささだ。"}, {"t": 299.3666666666667, "x": "3機種の中でトライスターが一番静かだった。"}, {"t": 302.3, "x": "アメリカの航空当局がそう示していたという。"}, {"t": 305.05, "x": "3つめはエンジンの高さだ。"}, {"t": 306.8, "x": "DC10はエンジンが3メートル高いところに付いている。"}, {"t": 309.96666666666664, "x": "大阪の空港の設備との関係で、\nそれが問題になるという話だった。"}, {"t": 314.51666666666665, "x": "ちゃんと理由があったのね。"}, {"t": 316.1333333333333, "x": "社長はそう説明した。"}, {"t": 317.68333333333334, "x": "決めた日は1972年10月30日だったと\n記憶している、と。"}, {"t": 322.4166666666667, "x": "起訴状と同じ日ね。"}, {"t": 323.93333333333334, "x": "同じ日だ。社長はこうも言った。"}, {"t": 325.98333333333335, "x": "機種選びは会社の運命をかけた問題だ。"}, {"t": 328.5833333333333, "x": "1年で1500万人を運ぶ会社として、\n命の安全にかかわる問題でもある。"}, {"t": 333.6166666666667, "x": "外から何かあっても一切受け付けないつもりでいた。"}, {"t": 336.6666666666667, "x": "小佐野さんから機種の話を聞いたことも一度もない。"}, {"t": 339.81666666666666, "x": "外からの声はなかったってこと？"}, {"t": 341.93333333333334, "x": "この日の本人の説明はそうだ。"}, {"t": 344.0, "x": "ただ、この社長ものちに起訴されている。"}, {"t": 346.45, "x": "全日空の側の流れだ。"}, {"t": 348.0, "x": "1992年に有罪が確定した。"}, {"t": 351.03333333333336, "x": "社長まで。"}, {"t": 351.98333333333335, "x": "その中身は全日空の側の裁判の話になる。"}, {"t": 355.05, "x": "この回では丸紅の側を追うので、深くは入らない。"}, {"t": 358.8, "x": "ここで、話に出てくる会社をそろえておく。"}, {"t": 361.51666666666665, "x": "まずロッキード。アメリカの飛行機の会社だ。"}, {"t": 364.18333333333334, "x": "次に丸紅。日本の大きな商社だ。"}, {"t": 366.6333333333333, "x": "丸紅は、ロッキードの日本での総代理店だった。"}, {"t": 369.8666666666667, "x": "いつから？"}, {"t": 370.68333333333334, "x": "国会で、丸紅の伊藤宏専務がこう話している。"}, {"t": 374.0, "x": "昭和33年ごろからであったと思う、と。"}, {"t": 376.73333333333335, "x": "ただ自分は、ロッキードとの取引を\n直接担当したことはないとも話している。"}, {"t": 381.68333333333334, "x": "1958年ね。"}, {"t": 383.5833333333333, "x": "そうだ。事件のころには18年近い付き合いになる。"}, {"t": 386.9166666666667, "x": "そして3つめが全日空。"}, {"t": 388.5, "x": "日本の航空会社だ。"}, {"t": 390.06666666666666, "x": "ロッキードには、売りたい旅客機があった。"}, {"t": 392.46666666666664, "x": "L1011型。トライスターと呼ばれた機体だ。"}, {"t": 395.8, "x": "それを全日空に売りたかったのね。"}, {"t": 398.01666666666665, "x": "そういうことになる。"}, {"t": 399.21666666666664, "x": "あとで出てくる起訴状には、日付が書いてある。"}, {"t": 401.98333333333335, "x": "全日空がトライスターを買うと\n決めたのは、1972年10月30日。"}, {"t": 407.03333333333336, "x": "起訴状はそう書いている。"}, {"t": 408.6, "x": "起訴状が書いてる、って言い方をするのね。"}, {"t": 411.1333333333333, "x": "起訴状は検察の言い分だからな。"}, {"t": 413.25, "x": "判決で決まったことと混ぜないために、こう言う。"}, {"t": 416.73333333333335, "x": "2月17日。小佐野さんの翌日だ。"}, {"t": 419.4, "x": "この日は丸紅の人たちが4人呼ばれた。"}, {"t": 421.95, "x": "会長、社長、それに専務が2人だ。"}, {"t": 424.55, "x": "委員長は荒舩清十郎という議員だった。"}, {"t": 427.06666666666666, "x": "委員長が、伊藤専務に一枚の紙のことを聞いた。"}, {"t": 430.2, "x": "アメリカの公聴会で公表された領収証だ。"}, {"t": 432.96666666666664, "x": "あなたのサインに間違いないか。"}, {"t": 434.9166666666667, "x": "伊藤さんはなんて答えたの？"}, {"t": 436.71666666666664, "x": "間違いございません。"}, {"t": 438.0833333333333, "x": "認めたの？"}, {"t": 439.06666666666666, "x": "サインをしたことはな。"}, {"t": 440.4, "x": "委員長は続けて聞いた。"}, {"t": 441.81666666666666, "x": "誰にあてた領収証か、と。"}, {"t": 443.75, "x": "答えはこうだ。あて名も\n何もございません書類でございました。"}, {"t": 447.45, "x": "あて名がない領収証？"}, {"t": 448.98333333333335, "x": "ない。そして文面を聞かれて、伊藤専務はこう読んだ。"}, {"t": 452.26666666666665, "x": "アイ、レシーブド、ワンハンドレッド、ピーナツ。"}, {"t": 455.1166666666667, "x": "ピーナツ？　あの豆の？"}, {"t": 456.7, "x": "字のうえではそうだ。"}, {"t": 457.8833333333333, "x": "私はピーナツを100受け取りました、という英語だ。"}, {"t": 460.8666666666667, "x": "そこに日付があって、伊藤専務のサインがある。"}, {"t": 463.68333333333334, "x": "日付は昭和48年8月9日。1973年だ。"}, {"t": 468.21666666666664, "x": "書類にそう書いてあるが、その日だったかは\nはっきり覚えていないとも話している。"}, {"t": 472.6666666666667, "x": "別の議員は、紙の作りも確かめている。"}, {"t": 475.3333333333333, "x": "ピーナツの領収証は、タイプで打たれていた。"}, {"t": 477.98333333333335, "x": "ヒロシ・イトーという名前まで印刷されていた。"}, {"t": 480.75, "x": "そこに本人が署名をしただけだという。"}, {"t": 483.23333333333335, "x": "自分で書いた紙じゃないのね。"}, {"t": 485.1333333333333, "x": "用意された紙に名前を書いた。"}, {"t": 486.8666666666667, "x": "議員はそう読み取っていた。"}, {"t": 488.5, "x": "委員長は、そのあと会社に報告したかも聞いた。"}, {"t": 491.55, "x": "社長や会長に伝えたか、という問いだ。"}, {"t": 494.0833333333333, "x": "答えは、一切いたしておりませんでした。"}, {"t": 496.6666666666667, "x": "豆を100個もらった、っていう\n紙に会社の偉い人がサイン？"}, {"t": 500.18333333333334, "x": "委員長もまさにそこを聞いている。"}, {"t": 502.71666666666664, "x": "領収証は一枚ではなかった。"}, {"t": 504.65, "x": "この日の質問をつなぐと、全部で6枚になる。"}, {"t": 507.8333333333333, "x": "6枚も？"}, {"t": 508.76666666666665, "x": "伊藤専務がサインしたのが4枚。"}, {"t": 510.78333333333336, "x": "大久保利春という、もうひとりの専務が2枚だ。"}, {"t": 513.75, "x": "単位がそれぞれ違う。"}, {"t": 515.1, "x": "ピーナツ。ピーシズ。ユニット。"}, {"t": 517.1666666666666, "x": "ピーシズって？"}, {"t": 518.2, "x": "英語で「個」とか「つ」くらいの意味だな。"}, {"t": 520.8833333333333, "x": "委員長はこれを符牒と呼んでいた。"}, {"t": 522.9666666666667, "x": "合言葉みたいなものね。"}, {"t": 524.6166666666667, "x": "大久保専務の2枚は、30ユニットと70ユニット。"}, {"t": 528.0333333333333, "x": "昭和47年の秋ごろだと、質問した議員が言っている。"}, {"t": 531.8, "x": "伊藤専務の4枚は、昭和48年から49年にかけてだ。"}, {"t": 536.0666666666667, "x": "ある議員が、その数を順番に読み上げた。"}, {"t": 538.6666666666666, "x": "100ピーナツ。150ピーシズ。"}, {"t": 540.55, "x": "125ピーシズ。125ピーシズ。"}, {"t": 543.25, "x": "足すと……500？"}, {"t": 544.5666666666667, "x": "500だ。"}, {"t": 545.35, "x": "あとで検察が書いた起訴状の金額が、5億円になる。"}, {"t": 548.9333333333333, "x": "数字がぴったり合うのね。"}, {"t": 550.55, "x": "合う。ただ、その意味をこの日に認めた人はいない。"}, {"t": 553.6333333333333, "x": "大久保専務は、中身を聞いても\n教えてもらえなかったと答えた。"}, {"t": 557.4666666666667, "x": "教えてもらえないまま、サインしたの？"}, {"t": 559.8, "x": "本人たちはそう説明している。"}, {"t": 561.9333333333333, "x": "伊藤さんは、なんでサインしたって言ってるの？"}, {"t": 564.55, "x": "頼まれたからだと話している。"}, {"t": 566.4166666666666, "x": "頼んだのは、当時の同僚だった大久保さんだ。"}, {"t": 569.2166666666667, "x": "ロッキードの会社の中の事情で、\n必要な書類だと言われた。"}, {"t": 572.9, "x": "丸紅には迷惑をかけない。"}, {"t": 574.6333333333333, "x": "使い終わったら捨てる。だからサインしてくれ。"}, {"t": 577.4, "x": "捨てるはずの紙だったのね。"}, {"t": 579.2666666666667, "x": "そう言われたという説明だ。"}, {"t": 580.9, "x": "ピーナツの意味も、そのときは\n知らなかったと話している。"}, {"t": 584.1666666666666, "x": "気軽にサインしてしまった。"}, {"t": 585.6833333333333, "x": "軽率のきわみだった、と。"}, {"t": 587.5166666666667, "x": "委員長は、それで引き下がらなかった。"}, {"t": 589.8666666666667, "x": "中学生でもあれば、\nピーナツ何個受け取ったというサインをする。"}, {"t": 593.4833333333333, "x": "日本最大の商社とも言われる会社の常務が、\nおかしいと思わなかったのか。"}, {"t": 598.0, "x": "きびしいわね。"}, {"t": 599.05, "x": "1年で何兆円も取引する\n会社の役員だろう、とも言っている。"}, {"t": 603.1666666666666, "x": "伊藤さんは？"}, {"t": 604.1333333333333, "x": "深く考えもせずに、気軽にサインしてしまった。"}, {"t": 607.1833333333333, "x": "申しわけないと思っている、と答えた。"}, {"t": 609.6833333333333, "x": "それ以上は言わなかったのね。"}, {"t": 611.4833333333333, "x": "この日はそこまでだ。"}, {"t": 612.8, "x": "本人の言葉としては、そう記録されている。"}, {"t": 616.2166666666667, "x": "同じ日、丸紅の檜山広会長も証言している。"}, {"t": 619.4833333333333, "x": "委員長はまず、領収証のことを知っていたかを聞いた。"}, {"t": 622.6333333333333, "x": "答えは、全然知っておりませんでした。"}, {"t": 625.0833333333334, "x": "アメリカの公聴会のあとで報告を受けた、と。"}, {"t": 627.9166666666666, "x": "そこで驚いて、2人に何度も問いただした。"}, {"t": 630.75, "x": "書類にサインはした。\nただ金品の受け渡しは一切知らない。"}, {"t": 634.3, "x": "そういう報告を受けたと話している。"}, {"t": 636.6, "x": "それで会長自身はどう思ってたの？"}, {"t": 638.8666666666667, "x": "ピーナツの書類のことは、本人によく尋ねた。"}, {"t": 641.8, "x": "実際に金品の受け渡しは伴っていない。"}, {"t": 644.4833333333333, "x": "私はそれを確信していると答えた。"}, {"t": 647.0, "x": "お金は動いてないってこと？"}, {"t": 648.8, "x": "そういう説明だ。"}, {"t": 649.9833333333333, "x": "これを聞いた議員が、こう言っている。"}, {"t": 652.0, "x": "アメリカの議会での証言と、\nここでの証言が食い違ってしまった。"}, {"t": 656.1, "x": "アメリカでは、お金が渡ったって話になってたのね。"}, {"t": 659.45, "x": "公聴会での話としては、そうなっていた。"}, {"t": 662.2166666666667, "x": "会長は、その食い違いにも自分の見方を話している。"}, {"t": 665.5833333333334, "x": "コーチャンさんは公聴会で問い詰められていった。"}, {"t": 668.2166666666667, "x": "そして知っている名前を挙げただけではないか。"}, {"t": 670.7666666666667, "x": "そういう感じがしてならないと。"}, {"t": 672.7166666666667, "x": "アメリカの証言のほうを疑ったのね。"}, {"t": 675.0666666666667, "x": "この日の会長の見方はそうだった。"}, {"t": 677.2666666666667, "x": "あとで会長自身も起訴されることになる。"}, {"t": 679.7333333333333, "x": "それと、この日の記録にはもう\nひとつ面白いところがある。"}, {"t": 683.2833333333333, "x": "なに？"}, {"t": 683.9, "x": "「記憶にございません」という形の言葉だ。"}, {"t": 686.5166666666667, "x": "この日の会議録には、その形で2回出てくる。"}, {"t": 689.7333333333333, "x": "前の日は0回だったのに？"}, {"t": 691.5833333333334, "x": "前の日は0回だ。"}, {"t": 692.9, "x": "この日に言ったのは、檜山会長と大久保専務だった。"}, {"t": 696.1333333333333, "x": "檜山会長のは、代理店の契約書の中身を\n聞かれたときだ。"}, {"t": 699.9666666666667, "x": "一遍読んでみなければわからないが、\n記憶にございませんので。"}, {"t": 703.5666666666667, "x": "じゃあ、あの言葉は小佐野さんの言葉じゃないの？"}, {"t": 706.3333333333334, "x": "誰が広めたのかまでは、記録からは言えない。"}, {"t": 709.0666666666667, "x": "言えるのは、16日にはその形では\n出てこない、ということだけだ。"}, {"t": 713.7833333333333, "x": "証人を呼んだ1週間後、国会はもう一歩動いた。"}, {"t": 716.9666666666667, "x": "2月23日、衆議院の本会議で決議が読み上げられた。"}, {"t": 720.9666666666667, "x": "決議？"}, {"t": 721.7, "x": "国会としての意思を、文にしたものだ。"}, {"t": 724.2, "x": "自民党から共産党まで、\n5つの党がいっしょに出している。"}, {"t": 727.7666666666667, "x": "中身はこうだ。"}, {"t": 728.8, "x": "政府高官の名前を含む資料を、全部出してほしい。"}, {"t": 731.9833333333333, "x": "それをアメリカの上院と政府に頼む、と書いてある。"}, {"t": 735.1333333333333, "x": "ふだんは対立してる党がそろって？"}, {"t": 737.4, "x": "そろってだ。参議院でも同じ日に決議をしている。"}, {"t": 740.45, "x": "参議院のほうは6つの会派の共同だった。"}, {"t": 743.0833333333334, "x": "三木首相はまず、全会一致の決議は\n極めて重いと述べた。"}, {"t": 746.8166666666667, "x": "そこで三木武夫首相が、壇上でこう言った。"}, {"t": 749.5833333333334, "x": "私自身からも直接、手紙で大統領に頼む。"}, {"t": 753.0666666666667, "x": "総理が自分で手紙を？"}, {"t": 754.65, "x": "アメリカのフォード大統領に宛ててだ。"}, {"t": 756.7833333333333, "x": "名前を知りたいのは、日本の側だった。"}, {"t": 759.2166666666667, "x": "アメリカの記録の中に、まだ出ていない名前がある。"}, {"t": 762.2166666666667, "x": "それを見せてほしいと、国を挙げて頼んだことになる。"}, {"t": 765.4166666666666, "x": "そこまでして知りたかったのね。"}, {"t": 767.4166666666666, "x": "知りたかった。その時点では、\n誰も中身を知らなかったからだ。"}, {"t": 771.9, "x": "この2日間、来るはずだったのに来なかった人がいる。"}, {"t": 775.2333333333333, "x": "児玉さん？"}, {"t": 776.15, "x": "そうだ。児玉誉士夫も、17日に呼ばれていた。"}, {"t": 779.3, "x": "委員長が、会議の始めにこう読み上げた。"}, {"t": 781.8666666666667, "x": "14日に議長あてに書面が届いた。"}, {"t": 784.2166666666667, "x": "医師の診断書が添えてあって、\n病気で出られないという中身だ。"}, {"t": 787.8333333333334, "x": "委員長は、その診断書をその場で読み上げている。"}, {"t": 790.85, "x": "国会で診断書を読んだの？"}, {"t": 792.7333333333333, "x": "読んだ。全部、会議録に残っている。"}, {"t": 795.2666666666667, "x": "3月1日に、もう一度証人を呼ぶ日があった。"}, {"t": 798.4, "x": "その日も児玉さんは来ていない。"}, {"t": 800.3, "x": "委員長が、28日に申し出があったと読み上げている。"}, {"t": 803.85, "x": "2回とも来なかったのね。"}, {"t": 805.5833333333334, "x": "2回ともだ。"}, {"t": 806.5333333333333, "x": "診断書が本当に正しいのかを問う議員もいた。"}, {"t": 809.3666666666667, "x": "ただそれは議員の質問だ。"}, {"t": 811.0833333333334, "x": "病気だったかどうかを、私たちが\nここで決めることはできない。"}, {"t": 814.8166666666667, "x": "決められないことは決めないのね。"}, {"t": 816.8333333333334, "x": "そうだ。児玉さんのことは、あとでもう一度出てくる。"}, {"t": 819.9833333333333, "x": "3月1日には全日空の前の社長も呼ばれた。"}, {"t": 823.1666666666666, "x": "大庭哲夫という人だ。"}, {"t": 824.65, "x": "若狭さんの前に社長だった人になる。"}, {"t": 827.0833333333334, "x": "もとは日本航空にいた人だ。"}, {"t": 829.0, "x": "全日空で事故が続いたあと、\n立て直しを頼まれて移ってきた。"}, {"t": 832.8666666666667, "x": "本人が証言の始めにそう話している。"}, {"t": 835.5333333333333, "x": "前の社長は何を聞かれたの？"}, {"t": 837.5, "x": "もともとDC10に決めていたのではないか。"}, {"t": 840.0333333333333, "x": "議員の質問はそこだった。"}, {"t": 841.8166666666667, "x": "新聞に、仮契約という言葉が出回っていた。"}, {"t": 844.8166666666667, "x": "大庭さんはその言葉を直してほしいと言っている。"}, {"t": 847.6166666666667, "x": "仮契約じゃないの？"}, {"t": 849.0666666666667, "x": "本人の言葉ではオプションだ。"}, {"t": 850.9, "x": "飛行機の製造番号を\n押さえてもらうという意味で使っていた。"}, {"t": 854.2833333333333, "x": "それを仮契約と訳されて実に困っている、と。"}, {"t": 857.35, "x": "ダグラスの人から番号を押さえた\n印がほしいと言われた。"}, {"t": 860.65, "x": "それでサインしたように思う、とも話している。"}, {"t": 863.3333333333334, "x": "同じ日にはロッキードの日本支社の人も呼ばれた。"}, {"t": 866.25, "x": "国籍はアメリカの人だ。"}, {"t": 867.9666666666667, "x": "日本支社は飛行機の販売には\n直接かかわっていないと話した。"}, {"t": 871.8833333333333, "x": "コーチャンさんたちが日本人と会うときも、\nいつもついていたわけではない。"}, {"t": 875.9666666666667, "x": "支社の人でも全部は知らないのね。"}, {"t": 878.2166666666667, "x": "本人はそう答えている。"}, {"t": 879.8666666666667, "x": "それにしてもまたサインの話ね。"}, {"t": 882.05, "x": "またサインだ。"}, {"t": 882.9666666666667, "x": "この事件には言葉の行き違いが多い。"}, {"t": 885.2, "x": "ピーナツもそうだし、記憶の言い方もそうだ。"}, {"t": 887.95, "x": "ひとつの言葉で、ずいぶん印象が変わるのね。"}, {"t": 890.8333333333334, "x": "だから、この回は記録にある言葉のまま読んでいる。"}, {"t": 894.5, "x": "春が過ぎて、東京地検の特捜部が動いた。"}, {"t": 897.4666666666667, "x": "このあたりは、法務大臣が国会で報告した文がある。"}, {"t": 900.8833333333333, "x": "1976年8月17日。"}, {"t": 903.5666666666667, "x": "稲葉修法務大臣の報告だ。"}, {"t": 905.95, "x": "法務大臣が自分で？"}, {"t": 907.5166666666667, "x": "参議院の特別委員会でだ。"}, {"t": 909.4333333333333, "x": "報告によれば、6月22日から逮捕が始まった。"}, {"t": 913.05, "x": "丸紅の側では、まず3人だ。"}, {"t": 915.05, "x": "大久保さん、伊藤さん、檜山さん。"}, {"t": 917.35, "x": "国会で証言した人たちね。"}, {"t": 919.4833333333333, "x": "そうだ。容疑は2つあった。"}, {"t": 921.35, "x": "ひとつは議院証言法の違反。"}, {"t": 923.2, "x": "国会で、うその証言をしたという疑いだ。"}, {"t": 925.9333333333333, "x": "もうひとつは外為法の違反。"}, {"t": 927.8833333333333, "x": "がいためほう？"}, {"t": 928.8666666666667, "x": "外国為替の法律だ。"}, {"t": 930.5166666666667, "x": "外国の会社のためのお金を、国内で\n許可なく受け渡してはいけない。"}, {"t": 934.7, "x": "当時はそういう決まりがあった。"}, {"t": 936.5333333333333, "x": "ピーナツの領収証は、そこにつながるのね。"}, {"t": 939.3333333333334, "x": "つながる。報告にはこうある。"}, {"t": 941.1833333333333, "x": "ピーナツとピーシズの領収証に見合う、合計5億円。"}, {"t": 944.3166666666667, "x": "その外為法違反の疑いが濃くなった、と。"}, {"t": 947.15, "x": "起訴も順番に進んだ。"}, {"t": 948.75, "x": "檜山さんは8月2日に、外為法の違反で起訴された。"}, {"t": 952.4833333333333, "x": "大久保さんと伊藤さんは8月9日だ。"}, {"t": 955.15, "x": "まだ、お金を受け取った側の話は出てこないのね。"}, {"t": 958.4166666666666, "x": "受け取った側の話は、ここからだ。"}, {"t": 960.75, "x": "そして7月27日。"}, {"t": 962.6333333333333, "x": "2人が逮捕された。"}, {"t": 964.0166666666667, "x": "ひとりは田中角栄。前の内閣総理大臣だ。"}, {"t": 967.25, "x": "総理だった人が逮捕？"}, {"t": 968.9333333333333, "x": "そうだ。もうひとりは榎本敏夫。"}, {"t": 970.9333333333333, "x": "総理の秘書官だった人だ。"}, {"t": 972.9666666666667, "x": "総理をやめてから、どのくらいたってたの？"}, {"t": 975.5166666666667, "x": "起訴状の書き方では、総理だったのは\n1974年12月9日までだ。"}, {"t": 980.6333333333333, "x": "だから逮捕まで、1年と7か月ほどになる。"}, {"t": 983.6166666666667, "x": "最初の容疑は外為法の違反だった。"}, {"t": 986.0, "x": "そのあと8月16日に、受託収賄でも起訴されている。"}, {"t": 989.9166666666666, "x": "じゅたくしゅうわい？"}, {"t": 991.0, "x": "頼まれごとを引き受けて、\nその見返りに金を受け取る罪だ。"}, {"t": 994.6166666666667, "x": "同じ日に、丸紅の3人も贈賄で起訴された。"}, {"t": 997.8333333333334, "x": "渡した側と、受け取った側が、同じ日に。"}, {"t": 1000.8666666666667, "x": "そうなる。"}, {"t": 1001.55, "x": "ここでもう一度だけ言っておく。"}, {"t": 1003.3, "x": "逮捕と起訴は、検察が疑いを持ったということだ。"}, {"t": 1006.4833333333333, "x": "罪が決まったということではない。"}, {"t": 1008.4833333333333, "x": "決めるのは裁判所ね。"}, {"t": 1010.0666666666667, "x": "そうだ。そして、この裁判は最後まで行かなかった。"}, {"t": 1013.9666666666667, "x": "法務大臣は、起訴状の中身も読み上げている。"}, {"t": 1016.8333333333334, "x": "ここからは、検察がこう書いたという話だ。"}, {"t": 1019.75, "x": "検察の言い分ね。"}, {"t": 1021.1666666666666, "x": "1972年8月23日ごろ。田中さんの家。"}, {"t": 1025.2, "x": "丸紅の3人が、トライスターを\n全日空に買わせてほしいと頼んだ。"}, {"t": 1029.3166666666666, "x": "うまくいったら、お礼に現金5億円を渡すと約束した。"}, {"t": 1032.8666666666666, "x": "起訴状はそう書いている。"}, {"t": 1034.45, "x": "それが、さっきの10月30日につながるのね。"}, {"t": 1037.6833333333334, "x": "そうだ。全日空が買うと決めた、と書かれた日だ。"}, {"t": 1040.9, "x": "そして約束どおりに、金を渡したとされている。"}, {"t": 1043.9, "x": "1973年8月10日から、翌年の3月1日までの間。"}, {"t": 1048.8666666666666, "x": "前後4回に分けて合計5億円。"}, {"t": 1051.1166666666666, "x": "4回？　領収証も伊藤さんの分が4枚だったわね。"}, {"t": 1054.5333333333333, "x": "4枚だ。最初の日付は8月9日だった。"}, {"t": 1057.8166666666666, "x": "1日ずれてる。"}, {"t": 1059.0166666666667, "x": "起訴状のほうは「8月10日から」と書いている。"}, {"t": 1062.1, "x": "1日の差を、ここで埋めることはしない。"}, {"t": 1064.5166666666667, "x": "受け渡しは、秘書官の榎本さんを通したと\n書かれている。"}, {"t": 1068.0, "x": "起訴状は、田中さんの立場もはっきり書いている。"}, {"t": 1071.0166666666667, "x": "内閣の首長として、行政の各部を指揮し監督する。"}, {"t": 1074.6, "x": "運輸大臣を指揮し監督する権限も持っていた。"}, {"t": 1077.7166666666667, "x": "だから頼まれごとが、仕事に関係するってことね。"}, {"t": 1081.0666666666666, "x": "検察はそう組み立てた。"}, {"t": 1082.6833333333334, "x": "そこが裁判の大きな争いどころになっていく。"}, {"t": 1085.5666666666666, "x": "総理が自分で受け取ったわけじゃないのね。"}, {"t": 1088.0, "x": "起訴状の言い方では、榎本さんを介して、だ。"}, {"t": 1091.6833333333334, "x": "さっき、大久保さんの30ユニットって出てきたわよね。"}, {"t": 1095.05, "x": "出てきた。あれにも続きがある。"}, {"t": 1097.0333333333333, "x": "1976年11月2日。"}, {"t": 1099.5666666666666, "x": "衆議院の特別委員会だ。"}, {"t": 1101.4833333333333, "x": "秘密会で、政府の中間報告をもとに名前が出た。"}, {"t": 1104.9, "x": "30ユニットの金の流れに\nかかわった、とされた議員たちだ。"}, {"t": 1108.7833333333333, "x": "何人？"}, {"t": 1109.55, "x": "参議院の議員が、30ユニットの5人と言っている。"}, {"t": 1112.7333333333333, "x": "世の中では灰色高官と呼ばれた。"}, {"t": 1115.05, "x": "はいいろ？"}, {"t": 1115.8, "x": "黒とは言えないが、白とも\n言えない、という呼び方だな。"}, {"t": 1119.0333333333333, "x": "この5人は起訴されていない。"}, {"t": 1120.85, "x": "どうして起訴されなかったの？"}, {"t": 1122.6833333333334, "x": "法務大臣は国会で、理由の型を2つ挙げている。"}, {"t": 1125.9166666666667, "x": "時効で起訴しなかったという型。"}, {"t": 1127.9333333333334, "x": "もうひとつは職務の権限がない、という型だ。"}, {"t": 1130.7666666666667, "x": "誰がどちらに当たるのかは、秘密会で話された。"}, {"t": 1133.8333333333333, "x": "だから、この動画では1人も名前を出さない。"}, {"t": 1136.6666666666667, "x": "出さないのね。"}, {"t": 1137.7333333333333, "x": "出さない。理由はもうひとつある。"}, {"t": 1139.7, "x": "2日後の11月4日、名前を出された\n議員たちが委員会に来た。"}, {"t": 1143.8833333333334, "x": "そして自分の口で反論している。"}, {"t": 1146.0166666666667, "x": "金銭の受け渡しがあったという事実は全くない。"}, {"t": 1149.0, "x": "一方的な報告で灰色とされるのは心外のきわみだ。"}, {"t": 1152.3333333333333, "x": "誰からも、一度も頼まれたことはない。"}, {"t": 1154.95, "x": "本人ははっきり否定したのね。"}, {"t": 1157.05, "x": "した。三木首相も、こう答弁している。"}, {"t": 1159.6166666666666, "x": "政府が灰色だと決めて発表したのではない。"}, {"t": 1162.3, "x": "金の流れを調べたら、こうだったと伝えただけだ、と。"}, {"t": 1165.85, "x": "名前だけが、先に広まっちゃったのね。"}, {"t": 1168.5166666666667, "x": "そういう面はあったと\n思う。だから、ここでは広げない。"}, {"t": 1172.3333333333333, "x": "裁判の話に入る前に、ひとつ大事な手続きがある。"}, {"t": 1175.85, "x": "ロッキードの側の人たちは、アメリカに住んでいた。"}, {"t": 1178.9833333333333, "x": "日本の裁判には呼べないの？"}, {"t": 1180.8833333333334, "x": "簡単には呼べない。"}, {"t": 1182.1333333333334, "x": "そこで検察は、アメリカの裁判所に頼んだ。"}, {"t": 1185.0833333333333, "x": "向こうで証人に話を聞いて、\nその記録を送ってほしい、と。"}, {"t": 1188.7333333333333, "x": "これを嘱託尋問という。"}, {"t": 1190.5166666666667, "x": "しょくたく、じんもん。"}, {"t": 1191.9833333333333, "x": "頼んで、代わりに聞いてもらう、という意味だな。"}, {"t": 1194.7, "x": "ところが、聞かれる側が答えるのを断った。"}, {"t": 1197.5833333333333, "x": "断ったの？"}, {"t": 1198.65, "x": "日本で罪に問われるかもしれない、という理由だ。"}, {"t": 1201.4833333333333, "x": "アメリカには、こういうときの仕組みがある。"}, {"t": 1203.8333333333333, "x": "罪に問わないと約束する\n代わりに、話すことを義務にする。"}, {"t": 1207.4666666666667, "x": "最高裁の判決文は、これを刑事免責と呼んでいる。"}, {"t": 1210.9, "x": "アメリカでは法律で決まった仕組みだ。"}, {"t": 1213.2666666666667, "x": "日本には？"}, {"t": 1214.2166666666667, "x": "日本の刑事訴訟法には、\nその決まりが書かれていなかった。"}, {"t": 1217.7833333333333, "x": "そこで検事総長が約束をした。"}, {"t": 1220.0, "x": "話したことを理由に、あなたたちを起訴しない、と。"}, {"t": 1223.0666666666666, "x": "尋問はカリフォルニア州の連邦地方裁判所で\n進められた。"}, {"t": 1226.6333333333334, "x": "ところが担当のファーガソン判事は、\nそれでは足りないと言った。"}, {"t": 1230.1833333333334, "x": "日本の最高裁判所が、それをはっきりさせた\n書面を出すまで記録は渡さない。"}, {"t": 1235.0166666666667, "x": "最高裁まで出てきたの？"}, {"t": 1236.75, "x": "出てきた。1976年の夏、最高裁は宣明を出している。"}, {"t": 1241.35, "x": "検事総長の約束は、この先どの検察官も守る。"}, {"t": 1244.9166666666667, "x": "対象になった証人は3人だった。"}, {"t": 1247.2166666666667, "x": "そういう中身だ。法務省の局長が、\n国会でそう説明している。"}, {"t": 1251.4666666666667, "x": "それで記録が日本に届いたのね。"}, {"t": 1253.6833333333334, "x": "届いた。ただ、この約束が19年後に問題になる。"}, {"t": 1257.9333333333334, "x": "裁判は長くかかった。"}, {"t": 1259.4833333333333, "x": "東京地方裁判所の判決が\n出たのは、1983年10月12日だ。"}, {"t": 1264.8166666666666, "x": "逮捕から7年？"}, {"t": 1266.1333333333334, "x": "7年と少しだ。"}, {"t": 1267.4666666666667, "x": "判決は懲役4年の実刑。"}, {"t": 1269.45, "x": "それに追徴金が5億円だった。"}, {"t": 1271.6333333333334, "x": "ついちょうきん？"}, {"t": 1272.6, "x": "受け取ったとされる金を、国に納めさせるものだ。"}, {"t": 1275.6166666666666, "x": "つまり一審は、5億円を\n受け取ったと判断したことになる。"}, {"t": 1279.2666666666667, "x": "有罪ってことね。"}, {"t": 1280.6, "x": "一審では有罪だ。田中さんは、すぐに控訴した。"}, {"t": 1283.85, "x": "国会のほうも大きく揺れた。"}, {"t": 1285.5833333333333, "x": "議員の辞職を求める決議案をめぐって、もめにもめた。"}, {"t": 1289.0333333333333, "x": "ある議員は翌月こう話している。"}, {"t": 1291.0166666666667, "x": "先月の12日以来、1か月以上、国会が空転を続けた。"}, {"t": 1295.2833333333333, "x": "1か月も止まってたの？"}, {"t": 1296.9833333333333, "x": "その議員の言葉では、そうなっている。"}, {"t": 1299.2833333333333, "x": "同じ議員はこうも話している。"}, {"t": 1301.1166666666666, "x": "辞職勧告の決議案は先送りのまま、\n解散して年内に総選挙になった。"}, {"t": 1306.1833333333334, "x": "選挙になったのね。"}, {"t": 1307.6166666666666, "x": "判決と同じ年のうちにだ。"}, {"t": 1309.5166666666667, "x": "ただ裁判そのものはまだ途中だ。"}, {"t": 1311.6, "x": "控訴すれば判決は確定しない。"}, {"t": 1313.8666666666666, "x": "まだ決まってないのね。"}, {"t": 1315.3333333333333, "x": "決まっていない。次は高等裁判所だ。"}, {"t": 1318.4, "x": "1987年7月29日。"}, {"t": 1321.1166666666666, "x": "東京高等裁判所の判決だ。"}, {"t": 1323.3333333333333, "x": "控訴は棄却された。"}, {"t": 1324.85, "x": "一審と同じってこと？"}, {"t": 1326.4666666666667, "x": "一審の判断を、そのまま認めたということだ。"}, {"t": 1329.4, "x": "この判決文は、いまも裁判所のサイトで読める。"}, {"t": 1332.4666666666667, "x": "全部で224ページある。"}, {"t": 1334.5333333333333, "x": "224ページ！"}, {"t": 1336.05, "x": "目次を見るだけでも、争ったところがわかる。"}, {"t": 1338.8166666666666, "x": "5億円の受け渡しについて、\n場所ごとに見出しが立っている。"}, {"t": 1342.3, "x": "1回目は大使館の裏。"}, {"t": 1343.95, "x": "2回目は、高校の向かいの電話ボックスのそば。"}, {"t": 1346.85, "x": "3回目はホテル。"}, {"t": 1348.0666666666666, "x": "4回目はマンション。"}, {"t": 1349.4, "x": "電話ボックス？　そんなところで？"}, {"t": 1351.5333333333333, "x": "判決文の見出しには、そう書かれている。"}, {"t": 1354.1166666666666, "x": "ほかにも、段ボール箱についての見出しがある。"}, {"t": 1356.9666666666667, "x": "お金を運んだ箱？"}, {"t": 1358.4166666666667, "x": "弁護側が、その箱について主張したところだ。"}, {"t": 1361.45, "x": "弁護側は、受け渡しはなかったと争っていた。"}, {"t": 1364.45, "x": "秘書官だった榎本さんには、アリバイの主張もあった。"}, {"t": 1367.75, "x": "4回の受け渡しそれぞれに、\nアリバイの見出しが立っている。"}, {"t": 1371.2666666666667, "x": "4回ともその日はほかにいたって？"}, {"t": 1373.5, "x": "弁護側はそう主張した。"}, {"t": 1375.15, "x": "その裏付けに、ある人のノートが出されている。"}, {"t": 1377.9, "x": "判決は、そのノートが証拠として\nどこまで使えるかを検討した。"}, {"t": 1381.8666666666666, "x": "高裁は、アリバイの主張を退けている。"}, {"t": 1384.3666666666666, "x": "判決文の終わりには別の紙が付いている。"}, {"t": 1386.9666666666667, "x": "題は現金授受一覧表だ。"}, {"t": 1388.9666666666667, "x": "受け渡しの一覧？"}, {"t": 1390.3166666666666, "x": "裁判所が認めた受け渡しを、表にまとめたものだ。"}, {"t": 1393.5666666666666, "x": "ここでも紙が並んでいる。"}, {"t": 1395.3, "x": "それでもまだ終わりじゃないのね。"}, {"t": 1397.15, "x": "終わりじゃない。田中さんは最高裁に上告した。"}, {"t": 1400.7333333333333, "x": "高裁の判決文には、もうひとつ大きな章がある。"}, {"t": 1403.8833333333334, "x": "題は内閣総理大臣の職務権限だ。"}, {"t": 1406.6333333333334, "x": "総理の仕事の範囲ってこと？"}, {"t": 1408.6, "x": "そうだ。受託収賄は仕事に\n関係することでないと成り立たない。"}, {"t": 1412.5, "x": "飛行機を選ぶのは全日空だ。総理ではない。"}, {"t": 1415.2833333333333, "x": "弁護側はそこを争った。"}, {"t": 1417.1, "x": "たしかに、総理が飛行機を買うわけじゃないものね。"}, {"t": 1420.1333333333334, "x": "高裁は材料を順番に並べている。"}, {"t": 1422.35, "x": "運輸大臣が機種選びにどうかかわれるか。"}, {"t": 1424.8333333333333, "x": "総理が運輸大臣をどう指揮できるか。"}, {"t": 1427.05, "x": "閣議で決めた方針があったか。"}, {"t": 1429.0, "x": "目次には、閣議了解という見出しもある。"}, {"t": 1431.5833333333333, "x": "航空機のジェット化と大型化を進める、という了解だ。"}, {"t": 1435.0333333333333, "x": "国として大きい飛行機を進めてたのね。"}, {"t": 1437.6666666666667, "x": "そういう了解があった、と見出しにある。"}, {"t": 1439.95, "x": "高裁は総理の仕事の範囲に入ると判断した。"}, {"t": 1443.0833333333333, "x": "最高裁でも争われたの？"}, {"t": 1444.9833333333333, "x": "争われた。それはあとの章で話す。"}, {"t": 1447.9833333333333, "x": "最高裁での審理は何年も続いた。"}, {"t": 1450.35, "x": "高裁の判決から数えると、6年と4か月あまりになる。"}, {"t": 1454.15, "x": "その途中の1993年12月16日。"}, {"t": 1457.6166666666666, "x": "田中角栄さんが亡くなった。"}, {"t": 1459.6333333333334, "x": "裁判の途中で？"}, {"t": 1460.95, "x": "途中でだ。75歳だった。"}, {"t": 1463.15, "x": "じゃあ、裁判はどうなったの？"}, {"t": 1465.0, "x": "公訴棄却になった。"}, {"t": 1466.5166666666667, "x": "こうそききゃく？"}, {"t": 1467.6, "x": "裁判を続ける相手がいなくなったので、\nそこで打ち切る、という手続きだ。"}, {"t": 1471.9666666666667, "x": "刑事訴訟法の第339条に書いてある。"}, {"t": 1475.0666666666666, "x": "被告人が死亡したときは、決定で\n公訴を棄却しなければならない。"}, {"t": 1479.3, "x": "しなければならないなのね。"}, {"t": 1481.0166666666667, "x": "裁判所に選ぶ余地はない。そういう決まりだ。"}, {"t": 1483.7, "x": "有罪とも無罪とも、言わないまま閉じる。"}, {"t": 1486.3333333333333, "x": "一審も二審も有罪だったのに？"}, {"t": 1488.4833333333333, "x": "それでも確定はしていない。"}, {"t": 1490.1666666666667, "x": "日本の裁判では、最後の判決が\n出て初めて罪が決まる。"}, {"t": 1493.9333333333334, "x": "田中さんの5億円の裁判は、そこまで行かなかった。"}, {"t": 1497.1833333333334, "x": "だから、この動画は田中さんを犯人とは呼ばない。"}, {"t": 1500.2, "x": "一審と二審が有罪と判断した。"}, {"t": 1502.4833333333333, "x": "最高裁の判決が出る前に亡くなった。"}, {"t": 1505.05, "x": "言えるのはこの2つまでだ。"}, {"t": 1507.3, "x": "それから1年と2か月ほどたった。"}, {"t": 1509.5833333333333, "x": "1995年2月22日。"}, {"t": 1512.0, "x": "最高裁判所の大法廷が判決を出した。"}, {"t": 1514.9666666666667, "x": "田中さんの裁判は、終わってたわよね？"}, {"t": 1517.55, "x": "終わっていた。これは丸紅の側と、\n秘書官だった人の上告だ。"}, {"t": 1521.6, "x": "結論は上告の棄却。有罪がここで確定した。"}, {"t": 1525.0666666666666, "x": "じゃあ、いつもどおりの判決？"}, {"t": 1527.0166666666667, "x": "中身がいつもどおりではなかった。"}, {"t": 1528.95, "x": "さっきの嘱託尋問の記録を覚えているか。"}, {"t": 1531.8166666666666, "x": "アメリカで聞いて、送ってもらった記録ね。"}, {"t": 1534.4833333333333, "x": "最高裁は、あれを証拠にしてはいけないと言った。"}, {"t": 1537.55, "x": "えっ、使っちゃだめなの？"}, {"t": 1539.2666666666667, "x": "起訴しないと約束して聞き出した話だからだ。"}, {"t": 1542.3, "x": "日本の刑事訴訟法には、そういう\n仕組みが書かれていない。"}, {"t": 1545.6833333333334, "x": "書かれていない仕組みで得た話は、証拠に使えない。"}, {"t": 1548.8166666666666, "x": "これが判決の1つめの柱だ。"}, {"t": 1551.15, "x": "じゃあ、有罪にできないんじゃないの？"}, {"t": 1553.3333333333333, "x": "そこも判決に書いてある。"}, {"t": 1555.0166666666667, "x": "その記録を外しても、ほかの証拠で十分に認められる。"}, {"t": 1558.6666666666667, "x": "外しても結論は同じ。"}, {"t": 1560.4666666666667, "x": "そうだ。2つめの柱は、総理大臣の仕事の範囲だ。"}, {"t": 1564.1666666666667, "x": "判決は、まず運輸大臣の仕事から考えている。"}, {"t": 1567.35, "x": "どの飛行機を買うかは、本来は\n航空会社が自分で決めることだ。"}, {"t": 1571.2833333333333, "x": "大臣が特定の機種を勧めてよいという条文もない。"}, {"t": 1574.5666666666666, "x": "じゃあ、大臣の仕事じゃないんじゃない？"}, {"t": 1576.8333333333333, "x": "判決はそこで行政指導という考え方を使った。"}, {"t": 1580.05, "x": "役所は自分の受け持ちの中で、指導や勧告ができる。"}, {"t": 1583.5, "x": "航空は運輸省の受け持ちだ。だから\n勧めることも仕事に入る。"}, {"t": 1587.3833333333334, "x": "そして総理は大臣に指示を出せる立場にある。"}, {"t": 1590.1333333333334, "x": "総理が運輸大臣に、特定の飛行機を\n勧めるよう働きかける。"}, {"t": 1594.15, "x": "それは、わいろの罪でいう職務に当たる、と言った。"}, {"t": 1597.3, "x": "総理の仕事の中に入るってことね。"}, {"t": 1599.7166666666667, "x": "大法廷は15人の裁判官がそろって判断する場だ。"}, {"t": 1603.15, "x": "この判決には補足意見と意見が付いている。"}, {"t": 1605.9, "x": "結論に加えて、自分の考えを\n書き足した裁判官がいたということだ。"}, {"t": 1610.4333333333334, "x": "全員が同じ考えじゃなかったのね。"}, {"t": 1612.7666666666667, "x": "結論はそろった。道すじには違う考えもあった。"}, {"t": 1616.0166666666667, "x": "そういうことだ。この2つは、\nいまも判例として残っている。"}, {"t": 1620.3, "x": "最後に数をそろえておく。"}, {"t": 1621.9, "x": "この事件で起訴された人は、全部で16人だ。"}, {"t": 1625.1833333333334, "x": "16人も。"}, {"t": 1626.3166666666666, "x": "全日空のほうの流れでも、起訴された人がいる。"}, {"t": 1629.3833333333334, "x": "1995年までに、11人の有罪が確定した。"}, {"t": 1633.4333333333334, "x": "残りの5人は？"}, {"t": 1634.6666666666667, "x": "裁判の途中で亡くなって、公訴棄却になった。"}, {"t": 1637.7333333333333, "x": "その中に田中さんがいる。"}, {"t": 1639.4166666666667, "x": "児玉誉士夫さんもその1人だ。"}, {"t": 1641.45, "x": "国会に来なかった人ね。"}, {"t": 1643.3, "x": "そうだ。児玉さんは、脱税と\n外為法の違反で起訴された。"}, {"t": 1647.1166666666666, "x": "求刑は懲役3年6か月と罰金7億円だった。"}, {"t": 1650.6, "x": "裁判の途中で重い病気になり、判決は延ばされた。"}, {"t": 1653.9666666666667, "x": "そして1984年1月17日に亡くなった。"}, {"t": 1657.55, "x": "判決は出ていない。"}, {"t": 1659.0166666666667, "x": "この人も答えが出なかったのね。"}, {"t": 1661.1666666666667, "x": "出ていない。"}, {"t": 1661.9166666666667, "x": "小佐野賢治さんも、判決が\n確定する前に亡くなっている。"}, {"t": 1665.6666666666667, "x": "最初の宣誓の人ね。"}, {"t": 1667.4, "x": "そうだ。この人の話は、少し形が違う。"}, {"t": 1671.2, "x": "ここで、国会に呼ばれる証人の決まりを見ておく。"}, {"t": 1674.1833333333334, "x": "議院証言法という法律がある。"}, {"t": 1676.1666666666667, "x": "正式な名前はもっと長い。"}, {"t": 1677.95, "x": "議院における証人の宣誓及び証言等に関する法律だ。"}, {"t": 1681.75, "x": "長いわね。"}, {"t": 1682.7, "x": "1947年にできた法律だ。"}, {"t": 1685.35, "x": "第1条にはこう書いてある。"}, {"t": 1687.0166666666667, "x": "議院から証人として呼ばれたら、\n何人でもこれに応じなければならない。"}, {"t": 1691.3, "x": "断れないのね。"}, {"t": 1692.55, "x": "正当な理由なく出てこなければ、それも罪になる。"}, {"t": 1695.6333333333334, "x": "そして第6条だ。"}, {"t": 1696.9666666666667, "x": "宣誓した証人がうそを述べたときの罰が書いてある。"}, {"t": 1700.1166666666666, "x": "いまの条文では、3か月以上10年以下の拘禁刑だ。"}, {"t": 1703.7333333333333, "x": "けっこう重いのね。"}, {"t": 1705.0, "x": "重い。だから証人は最初に宣誓書を読む。"}, {"t": 1707.75, "x": "あの宣誓は儀式ではない。"}, {"t": 1709.25, "x": "罰とつながった約束だ。"}, {"t": 1711.2, "x": "だから言葉ひとつが重いのね。"}, {"t": 1713.2666666666667, "x": "重い。この法律が、小佐野さんの裁判につながる。"}, {"t": 1716.4666666666667, "x": "丸紅の3人の逮捕も、この法律か\n外為法の違反の疑いだった。"}, {"t": 1721.0166666666667, "x": "国会での言葉が、そのまま裁判の材料になるのね。"}, {"t": 1724.5333333333333, "x": "なる。会議録が一字一句残るのは、\nそのためでもある。"}, {"t": 1727.9833333333333, "x": "小佐野さんが起訴された罪は、わいろではない。"}, {"t": 1730.7666666666667, "x": "じゃあ、なに？"}, {"t": 1731.7666666666667, "x": "議院証言法の違反だ。"}, {"t": 1733.3666666666666, "x": "国会で宣誓したうえで、\nうその証言をした、という罪だな。"}, {"t": 1737.3, "x": "最初の章のあの日の証言？"}, {"t": 1739.1833333333334, "x": "あの日の証言が問われた。"}, {"t": 1740.8333333333333, "x": "一審は懲役1年の実刑。"}, {"t": 1742.6333333333334, "x": "1981年11月だ。"}, {"t": 1745.15, "x": "二審は懲役10か月、執行猶予3年。"}, {"t": 1747.85, "x": "1984年4月だ。"}, {"t": 1750.1666666666667, "x": "二審は軽くなってるのね。"}, {"t": 1751.95, "x": "そうだ。小佐野さんは最高裁で争った。"}, {"t": 1754.5666666666666, "x": "そして1986年10月27日に亡くなった。"}, {"t": 1758.6166666666666, "x": "最高裁の判断は？"} const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
