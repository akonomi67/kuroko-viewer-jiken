<script>
const D={"name": "082", "file": "082_編集用", "dur": 1709.05, "segs": [], "subs": [{"t": 0.0, "x": "2000年7月1日。"}, {"t": 1.55, "x": "東京・六本木で働いていた21歳のイギリス人女性が、\nその日を境に連絡が取れなくなった。"}, {"t": 7.916666666666667, "x": "ルーシー・ブラックマンさん。"}, {"t": 9.3, "x": "元英国航空の客室乗務員で、\n来日して2か月足らずだった。"}, {"t": 13.75, "x": "彼女が最後に知人へ連絡した\n時刻は、午後7時17分ごろ。これは\n後の裁判所が認定した時刻だ。"}, {"t": 20.416666666666668, "x": "2日後、彼女の友人のところに、\n1本の電話がかかってくる。"}, {"t": 24.25, "x": "男の声だった。ルーシーさんは千葉の新興宗教団体で\n修行している。そういう内容だった。"}, {"t": 30.016666666666666, "x": "本人からじゃなくて、知らない男から連絡が来たの？"}, {"t": 33.483333333333334, "x": "そうだ。その電話が、この事件の\nすべての始まりになる。"}, {"t": 37.0, "x": "ルーシーさんが見つかったのは、7か月と8日後。"}, {"t": 39.85, "x": "2001年2月9日、神奈川県三浦市の海岸にある\n洞窟の中だった。"}, {"t": 44.85, "x": "この事件では、ひとりの男に無期懲役が\n確定している。だがその中身が、少し込み入っている。"}, {"t": 50.916666666666664, "x": "込み入っている？"}, {"t": 51.93333333333333, "x": "東京地裁はルーシーさんに\n関する罪をすべて無罪とした。"}, {"t": 55.13333333333333, "x": "東京高裁はそれを破棄して、\n一部を有罪にした。そして、"}, {"t": 58.81666666666667, "x": "高裁でさえ最後まで認めなかった\n罪がひとつ残っている。"}, {"t": 62.43333333333333, "x": "今回はそこを追っていく。"}, {"t": 63.95, "x": "先に断っておく。この動画では、\n判決が認定した事実と、"}, {"t": 67.9, "x": "判決が認定しなかった事実を、はっきり分けて話す。"}, {"t": 71.33333333333333, "x": "認定されていないことを、断定して話すことはしない。"}, {"t": 74.75, "x": "それから、被害に遭われた人が受けた\n行為そのものについては、一切触れない。"}, {"t": 79.16666666666667, "x": "話すのは、捜査と裁判の経過だけだ。"}, {"t": 82.53333333333333, "x": "ルーシー・ブラックマンさんは、1978年9月1日、\nイギリスのケント州セブノークスに生まれている。"}, {"t": 89.28333333333333, "x": "英国航空の客室乗務員を経て、2000年5月4日に\n来日した。ひとりではなく、友人と一緒だ。"}, {"t": 95.91666666666667, "x": "そして、六本木のクラブでホステスとして働き始める。"}, {"t": 99.36666666666666, "x": "カサブランカという店だった。"}, {"t": 101.3, "x": "来日して、2か月で失踪したということね。"}, {"t": 104.38333333333334, "x": "そういうことになる。ここで一つ、\nはっきりさせておきたいことがある。"}, {"t": 108.33333333333333, "x": "この事件は、当時も今も、"}, {"t": 110.03333333333333, "x": "被害者がどんな仕事をしていたかという話に\n流れやすい。だが、それは事件の説明にはならない。"}, {"t": 115.93333333333334, "x": "後で見ていくとおり、確定した判決が\n認定した被害者は、日本人4人と\n外国人6人の、合わせて10人だ。"}, {"t": 122.86666666666666, "x": "職業も年齢も国籍もばらばらで、\n共通しているのは仕事ではない。"}, {"t": 127.25, "x": "狙われた理由が、\n仕事の側にあったわけじゃないのね。"}, {"t": 130.55, "x": "ない。この動画では、被害者の側に理由を\n探すことはしない。そこは最初に言っておく。"}, {"t": 135.76666666666668, "x": "7月1日、午後5時ごろ。"}, {"t": 137.65, "x": "ルーシーさんはホステス仲間に連絡を入れている。いま"}, {"t": 140.7, "x": "客とドライブしていて、これから\n海岸へ行く、という内容だった。"}, {"t": 144.48333333333332, "x": "そして午後7時ごろ、あと\n1時間くらいで帰れる、と伝えている。"}, {"t": 148.45, "x": "最後に知人へ連絡したのが、\n午後7時17分ごろ。この時刻は、"}, {"t": 152.65, "x": "7年後の東京地裁の判決の中に、\nはっきり書かれている。"}, {"t": 156.66666666666666, "x": "判決に時刻まで残っているのね。"}, {"t": 159.01666666666668, "x": "残っている。そして同じ判決は、この時刻に\n誰と一緒にいたかも認定している。"}, {"t": 164.05, "x": "後に被告人となる男と、\n神奈川県逗子市の逗子マリーナにいた。そこまでは、"}, {"t": 168.73333333333332, "x": "争いのない事実として認定されている。"}, {"t": 171.38333333333333, "x": "さらに判決は、こう認定している。"}, {"t": 173.53333333333333, "x": "午後9時ごろまでにルーシーさんの身に異変が\n生じたこと。ひとりで東京に戻った被告人が、"}, {"t": 178.76666666666668, "x": "容体の急変を知って逗子マリーナに\n戻ったこと。そして、その後ルーシーさんの"}, {"t": 183.9, "x": "死亡を認識したこと。"}, {"t": 184.9, "x": "ずいぶん細かいところまで認定されているのに、\nそれでも無罪になったの？"}, {"t": 189.16666666666666, "x": "そこがこの事件のいちばん\n難しいところだ。順番に見ていく。"}, {"t": 193.56666666666666, "x": "2000年7月3日の夕方。"}, {"t": 195.51666666666668, "x": "ルーシーさんの友人のところに電話がかかってきた。"}, {"t": 198.5, "x": "男は「タカギアキラ」と\n名乗った。そして、ルーシーさんは"}, {"t": 201.96666666666667, "x": "千葉の新興宗教団体で修行している、と告げている。"}, {"t": 205.43333333333334, "x": "修行？ 急にそんなことを\n言われても、信じられないわね。"}, {"t": 208.91666666666666, "x": "信じられるはずがない。だが\n同時に、確かめようもない。"}, {"t": 212.16666666666666, "x": "この電話について、後の東京高裁は\n判決の中でこう認定している。"}, {"t": 216.36666666666667, "x": "被告人は7月3日夕、偽名で\nルーシーさんの友人に電話し、"}, {"t": 220.2, "x": "ルーシーさんが自ら失踪したかのような\n偽装工作を試みている、と。"}, {"t": 224.6, "x": "じゃあ、かけてきたのは本人だったのね。"}, {"t": 227.11666666666667, "x": "裁判所はそう認定した。そしてこの電話は、\n高裁が有罪を認める柱のひとつになっている。"}, {"t": 232.96666666666667, "x": "ここで一度、時系列を押さえておきたい。"}, {"t": 235.26666666666668, "x": "高裁が認定した被告人の動きは、\n電話のすぐ後から始まっている。"}, {"t": 239.65, "x": "7月4日、東京都内でセメントなどを買いそろえた。"}, {"t": 242.86666666666667, "x": "7月5日、空き家になっていた\nリゾートマンションに慌ただしく入室し、"}, {"t": 247.05, "x": "室内でセメントを使った何かの作業をした。"}, {"t": 250.01666666666668, "x": "電話をかけた次の日に、セメントを買っているの。"}, {"t": 253.01666666666668, "x": "買っている。この並びが、後で効いてくる。"}, {"t": 256.23333333333335, "x": "電話を受けた友人は、警察に行った。"}, {"t": 258.51666666666665, "x": "警視庁麻布署に、家出人捜索願を出している。"}, {"t": 261.93333333333334, "x": "家出人捜索願？ 行方不明者届じゃないの？"}, {"t": 265.15, "x": "当時はその言い方はない。"}, {"t": 266.53333333333336, "x": "2000年の時点で警察が使っていた\n言葉は、家出人であり、家出人捜索願だ。"}, {"t": 271.98333333333335, "x": "これは当時の国会の議事録にも残っている。"}, {"t": 274.53333333333336, "x": "別の事件についての答弁だが、警察庁長官が\n「家出人捜索願を受理した」という言い方をしている。"}, {"t": 281.23333333333335, "x": "つまりこの時期、成人が連絡を\n絶ったという届出は、制度の上では"}, {"t": 285.3666666666667, "x": "「家出」という枠の中で受け付けられていた。"}, {"t": 288.1666666666667, "x": "事件かもしれない、という枠じゃないのね。"}, {"t": 290.7, "x": "もちろん、事件性があると判断すれば捜査は始まる。"}, {"t": 293.8333333333333, "x": "実際、この件でも警視庁が動いている。"}, {"t": 296.55, "x": "ただ、入り口に置かれていた言葉が\n「家出」だったことは、当時の空気を\n考えるうえで無視できない。"}, {"t": 302.48333333333335, "x": "この呼び名が変わるのは、事件から\n9年後だ。そこは最後にもう一度話す。"}, {"t": 307.1333333333333, "x": "ここで一つ確認しておくと、高裁が認定した\n遺棄の時期は、7月7日ごろまでだ。"}, {"t": 312.4, "x": "届出が出された時点では、すでに\n数日が経っていたことになる。"}, {"t": 316.96666666666664, "x": "イギリスから、ルーシーさんの家族が日本に来る。"}, {"t": 319.65, "x": "父親のティム・ブラックマンさんと、妹だ。"}, {"t": 322.65, "x": "2000年8月22日、妹が記者会見を\n開いた。そして1万ポンド、"}, {"t": 327.5, "x": "当時のレートで160万円の懸賞金をかけて、\n情報提供を呼びかけている。"}, {"t": 332.48333333333335, "x": "家族が自分たちで懸賞金を出したのね。"}, {"t": 335.18333333333334, "x": "出した。ティムさんは記者会見を\n繰り返し、ビラを配り、テレビに出た。"}, {"t": 339.23333333333335, "x": "日本のメディアがこの失踪を大きく\n扱うようになるのは、ここからだ。"}, {"t": 343.35, "x": "私が引っかかるのは、この順番だ。"}, {"t": 345.76666666666665, "x": "普通に考えれば、公開して情報を集めるのは\n捜査する側の仕事だ。だがこの事件で、"}, {"t": 351.05, "x": "最初に大きな声を上げたのは、\n言葉の通じない国に来た家族のほうだった。"}, {"t": 355.75, "x": "それだけ動かなかった、ということかしら。"}, {"t": 358.4, "x": "そこは断定しない。捜査がどこまで\n進んでいたかは、外からは見えない。"}, {"t": 362.68333333333334, "x": "ただ、事実として、家族の会見が\n報道の量を変えたことは"}, {"t": 366.3333333333333, "x": "確かだ。そしてこの報道が、後に\n決定的な意味を持つことになる。"}, {"t": 371.25, "x": "ここで少し、事件から離れた話をする。"}, {"t": 373.9166666666667, "x": "2000年という年に、日本の警察が\nどういう状態にあったかだ。"}, {"t": 377.95, "x": "1999年から2000年にかけて、\n警察の不祥事が続いていた。"}, {"t": 382.56666666666666, "x": "国家公安委員会は2000年3月、\n警察刷新会議という外部の会議を立ち上げている。"}, {"t": 388.0833333333333, "x": "そして2000年7月13日。この会議が、\n国家公安委員会に対して、"}, {"t": 392.81666666666666, "x": "警察刷新についての緊急提言を提出した。"}, {"t": 396.1333333333333, "x": "7月13日って、\nルーシーさんがいなくなった12日後よね。"}, {"t": 400.1666666666667, "x": "そうだ。当時の国家公安委員長は、同じ年の8月4日、\n衆議院の地方行政委員会でこう述べている。"}, {"t": 406.8333333333333, "x": "「昨年来、警察をめぐる\n不祥事案が続発したことを受けて、"}, {"t": 410.53333333333336, "x": "国家公安委員会は、本年三月、\n警察刷新会議の発足をお願いいたしました」"}, {"t": 415.85, "x": "「去る七月十三日、国家公安委員会に\n対しまして警察刷新についての緊急提言を\n提出していただきました」"}, {"t": 423.0833333333333, "x": "つまりこの失踪は、日本の警察が組織として\n作り直しを迫られている、まさにその夏に起きている。"}, {"t": 429.3833333333333, "x": "いちばん忙しくて、いちばん\n外から見られている時期だったのね。"}, {"t": 433.26666666666665, "x": "そして7月20日、迎賓館で日英首脳会談が開かれた。"}, {"t": 437.3833333333333, "x": "外務省が残している会談の記録には、こうある。"}, {"t": 440.28333333333336, "x": "ブレア首相が、失踪した英国人女性の捜索について\n日本の警察に謝意を示し、"}, {"t": 445.4, "x": "引き続きよろしくお願いしたい旨を述べた。"}, {"t": 447.95, "x": "森総理は、できる限りの努力を続ける旨を回答した。"}, {"t": 451.7, "x": "首脳会談の議題になったの。"}, {"t": 453.75, "x": "なった。ひとりの行方不明が、\n国と国の話になっていた。"}, {"t": 458.2, "x": "捜査の輪郭が外から\n見えるようになるのは、9月の終わりだ。"}, {"t": 461.8333333333333, "x": "警視庁捜査一課と麻布署が、\nルーシーさんの勤めていたクラブの常連客で、"}, {"t": 466.28333333333336, "x": "不動産管理会社の社長である男を\n捜査していることが明らかになる。"}, {"t": 470.6, "x": "そしてこのとき、もう一つ分かったことがある。"}, {"t": 473.23333333333335, "x": "ルーシーさんの周辺で、新たに\n外国人女性2人が行方不明になっていた。"}, {"t": 478.01666666666665, "x": "ひとりの話じゃなかったのね。"}, {"t": 479.98333333333335, "x": "この時点で、捜査は\n「ひとりの失踪」ではなくなっている。"}, {"t": 483.6666666666667, "x": "2000年10月12日、男が逮捕された。\nただし容疑はルーシーさんの件ではない。"}, {"t": 488.56666666666666, "x": "準強制わいせつという、別件だ。"}, {"t": 491.01666666666665, "x": "別件で先に捕まえたのね。"}, {"t": 493.0833333333333, "x": "ルーシーさんについては、このとき立件できる\n材料がなかった。そもそも、まだ見つかっていない。"}, {"t": 498.7, "x": "逮捕の後、警察は男が所有する\n建物を次々に捜索していく。"}, {"t": 503.0, "x": "神奈川県三浦市のマンションの一室、\nモーターボートの近くの海岸。"}, {"t": 507.18333333333334, "x": "そこで出てきたものが、\nこの事件の性格を変えることになる。"}, {"t": 510.76666666666665, "x": "押収されたのは、大量のビデオテープだった。"}, {"t": 513.45, "x": "それが何を記録したものだったかは、\nここでは言わない。"}, {"t": 516.4666666666667, "x": "裁判所が判決の中で認定した表現に従えば、\n意識を失った状態の女性を撮影したものだ。"}, {"t": 522.9333333333333, "x": "そんなものを、自分で撮って残していたの。"}, {"t": 525.6333333333333, "x": "残していた。さらに、多数の女性との関係を\n記録したノートが押収されている。そして薬剤だ。"}, {"t": 531.4166666666666, "x": "判決要旨の言葉を借りれば、催眠剤や鎮静剤、\n麻酔薬といった薬剤が、多種多量、発見、"}, {"t": 537.6333333333333, "x": "押収された、とある。"}, {"t": 539.2333333333333, "x": "麻薬や睡眠剤に関する本も押収されている。"}, {"t": 542.1, "x": "この押収物によって、捜査は一気に広がった。"}, {"t": 545.0, "x": "ばらばらの事件として\n処理されていたもの、あるいは事件として\n記録すらされていなかったものが、"}, {"t": 550.2666666666667, "x": "一本につながった。"}, {"t": 551.8, "x": "それなら、ルーシーさんの件も出てきたんじゃないの？"}, {"t": 554.75, "x": "ここが、この事件の決定的な分かれ目になる。"}, {"t": 557.7, "x": "押収されたビデオテープの中に、ルーシーさんが\n写っているものは、1本も無かった。"}, {"t": 562.6166666666667, "x": "……無かったの。"}, {"t": 563.5833333333334, "x": "無かった。この一点が、\n7年後の判決を左右することになる。"}, {"t": 568.2833333333333, "x": "押収物から浮かんだ被害の中に、\n8年前のものがあった。"}, {"t": 572.0166666666667, "x": "カリタ・リジウェイさん。"}, {"t": 573.2666666666667, "x": "オーストラリア人で、1970年3月3日に\n生まれ、1992年2月29日に亡くなっている。"}, {"t": 580.3, "x": "亡くなったとき21歳だった。"}, {"t": 582.5333333333333, "x": "8年前の話が、ここで出てくるのね。"}, {"t": 585.3, "x": "当時、この死は事件として扱われていない。"}, {"t": 588.0166666666667, "x": "後の東京地裁判決は、\nこの件についてこう認定している。"}, {"t": 591.6333333333333, "x": "押収されたビデオテープの記録内容のとおり、"}, {"t": 594.1666666666666, "x": "被告人が意識のない状態のカリタさんを\n暴行したと認められる。"}, {"t": 598.2166666666667, "x": "そして鑑定によれば、カリタさんは\n麻酔薬の影響で意識を失っており、"}, {"t": 602.3666666666667, "x": "建物内からクロロホルムが押収されているのだから、"}, {"t": 605.3666666666667, "x": "被告人がクロロホルムを吸引させたと\n認められる、としている。"}, {"t": 609.25, "x": "結論として、カリタさんは"}, {"t": 611.0, "x": "被告人が用いたクロロホルムの作用で劇症肝炎を\n起こし死亡したと推認できる、と判決は述べている。"}, {"t": 617.1666666666666, "x": "こっちは、死んだ理由まではっきり書かれているのね。"}, {"t": 620.2333333333333, "x": "書かれている。ビデオがあり、鑑定があり、\nノートの記載とも整合した。だからここまで書ける。"}, {"t": 625.7166666666667, "x": "この差を覚えておいてほしい。"}, {"t": 627.1333333333333, "x": "ルーシーさんの件との違いは、\nこの三つが揃っているかどうかだ。"}, {"t": 631.55, "x": "2001年1月26日、男はオーストラリア人女性に\n対する強姦致死の容疑で再逮捕された。"}, {"t": 637.9, "x": "そしてその2週間後だ。"}, {"t": 639.55, "x": "2001年2月9日、神奈川県三浦市の海岸にある\n洞窟の中で、ルーシーさんが見つかった。"}, {"t": 645.75, "x": "7か月も経っていたのね。"}, {"t": 647.6166666666667, "x": "7か月と8日だ。場所は、被告人が\n所有していた部屋から数百メートル。"}, {"t": 652.2166666666667, "x": "東京からは南へおよそ50キロの海辺だった。"}, {"t": 655.2333333333333, "x": "ここは、以前に警察犬が臭いを嗅いだこともあった\n場所だったという。この日は、もう"}, {"t": 660.0333333333333, "x": "一度調べ直すという目的で、\n3人の捜査員が入っている。"}, {"t": 663.95, "x": "一度は調べていた場所だったの。"}, {"t": 666.0166666666667, "x": "そうだ。見つかるまでに7か月かかったこと自体が、\n後の裁判で決定的な意味を持つことになる。"}, {"t": 672.0666666666667, "x": "どういう意味かというと、こういうことだ。"}, {"t": 674.1333333333333, "x": "時間が経ちすぎていて、死因が分からなかった。"}, {"t": 677.1833333333333, "x": "判決の言葉では、解剖、\n検査結果等を総合しても死因は"}, {"t": 681.0166666666667, "x": "特定できず、となっている。この一行が、\nこの事件の結論をほとんど決めてしまう。"}, {"t": 686.5833333333334, "x": "起訴の形を整理しておく。ここを\n押さえないと、後の判決が読めなくなる。"}, {"t": 691.0833333333334, "x": "東京地検は、ルーシーさんを含む10人の女性に"}, {"t": 693.9, "x": "対する準強姦、そのうち2人を\n死亡させたとして起訴した。"}, {"t": 697.4666666666667, "x": "10人の内訳は、日本人4人と外国人6人だ。"}, {"t": 701.1833333333333, "x": "死亡させたとされた2人が、ルーシーさんと、\nカリタ・リジウェイさんだった。"}, {"t": 705.7, "x": "ひとつの裁判で、10件をまとめて裁いたのね。"}, {"t": 708.8833333333333, "x": "まとめて裁いた。これが後で効いてくる。"}, {"t": 711.15, "x": "同じ被告人の、同じような\n手口の事件が9件並んでいて、そのうち\n1件だけ証拠の形が違うからだ。"}, {"t": 717.9833333333333, "x": "ルーシーさんの件だけ、ビデオが無い。"}, {"t": 720.1, "x": "起訴は2000年11月17日。この日に、ルーシーさんに\n対する準強姦罪で東京地裁に起訴されている。"}, {"t": 726.8333333333334, "x": "警視庁はDNA鑑定のために、\nルーシーさんの家族に毛髪の提供を求めている。"}, {"t": 731.95, "x": "ご家族は、そこまで付き合わされたのね。"}, {"t": 734.5666666666667, "x": "付き合わされた。そしてここから、\n判決が出るまでに6年5か月かかる。"}, {"t": 738.9333333333333, "x": "逮捕の日から数えれば6年6か月だ。"}, {"t": 741.7, "x": "長いわね。何をそんなに争っていたの？"}, {"t": 744.4166666666666, "x": "被告人が、ルーシーさんの件について\n無罪を主張していたからだ。"}, {"t": 748.3, "x": "ほかの9件については、1件の致死罪を除いて、\nおおむね認めている。だがルーシーさんの件は違った。"}, {"t": 754.5333333333333, "x": "被告人は、検察が死亡したとする時間の直前に、\n自分の部屋でルーシーさんと会ったことは"}, {"t": 760.0333333333333, "x": "認めた。そのうえで、"}, {"t": 761.25, "x": "裁判の時点ですでに亡くなっていた知人が関与した\n可能性を示唆し、自分は無罪だと主張した。"}, {"t": 767.2333333333333, "x": "会ったことは認めて、その先は\n別の人がやったかもしれない、ということ？"}, {"t": 771.8, "x": "そういう組み立てだ。"}, {"t": 773.0, "x": "この主張は、後の判決の中でも\n一定の重みを持つことになる。"}, {"t": 776.85, "x": "裁判所が「第三者の可能性を否定できない」と\n書くとき、念頭にあるのはここだ。"}, {"t": 782.2, "x": "そして2007年4月24日、東京地裁が判決を言い渡す。"}, {"t": 787.1666666666666, "x": "先に、有罪になった部分から見ていく。"}, {"t": 789.7166666666667, "x": "カリタ・リジウェイさんへの準強姦致死。\nこれは有罪と認定された。"}, {"t": 793.6333333333333, "x": "理由はさっき話したとおりだ。"}, {"t": 795.3666666666667, "x": "ビデオ、鑑定、ノートの記載。"}, {"t": 797.5333333333333, "x": "もう一つ、8人への準強姦などについても\n有罪が認定されている。"}, {"t": 801.8, "x": "判決要旨はこう述べている。"}, {"t": 803.4, "x": "8人は被告人から勧められた飲み物を\n飲んだ後、間もなく意識を喪失している。"}, {"t": 808.4, "x": "鑑定人は、ビデオに写っている\n被害者らの深い意識喪失状態が、"}, {"t": 812.5833333333334, "x": "催眠剤や鎮静剤、麻酔薬などの投与に\nよることを示唆している。"}, {"t": 816.7833333333333, "x": "そして、このような薬剤は"}, {"t": 818.4666666666667, "x": "被告人所有の建物内から多種多量、\n発見、押収された。だから、"}, {"t": 822.8166666666667, "x": "被告人が飲み物に薬物を混入したと\n推認できる、としている。"}, {"t": 827.1166666666667, "x": "飲み物に入れたところは\n誰も見ていないのに、認定できるのね。"}, {"t": 830.85, "x": "直接見ていなくても、前後の事実を積み上げれば\n認定できる。これが状況証拠による認定だ。"}, {"t": 836.7, "x": "ここは大事なところだから、繰り返しておく。"}, {"t": 839.2333333333333, "x": "東京地裁は、状況証拠だけで有罪を\n認定することを、この判決の中で実際にやっている。"}, {"t": 845.1666666666666, "x": "そのうえで、ルーシーさんの件については、\n同じ方法で有罪にできないと判断した。"}, {"t": 850.7166666666667, "x": "東京地裁は、ルーシーさんに関する\n訴因を、すべて無罪とした。"}, {"t": 854.6333333333333, "x": "まず死体損壊と遺棄について。"}, {"t": 856.45, "x": "判決要旨はこう書いている。"}, {"t": 858.1, "x": "ルーシーさんの死体損壊、遺棄行為と\n被告人を直接結び付ける証拠はない。"}, {"t": 862.75, "x": "遺体からは、体液など被告人に由来することが\n明らかな物質は発見されていない。"}, {"t": 868.0333333333333, "x": "逗子マリーナの居室からは、大規模な\n血液反応など物的痕跡は見いだされず、"}, {"t": 872.85, "x": "損壊、遺棄行為も目撃されていない。"}, {"t": 875.5, "x": "何も残っていなかったのね。"}, {"t": 877.4166666666666, "x": "そのうえで、判決はこうも書いている。"}, {"t": 879.55, "x": "被告人は、損壊や遺棄に使われた\n物と同種の物を急いで入手し、"}, {"t": 883.8, "x": "セメントを使った作業をし、"}, {"t": 885.4333333333333, "x": "一方で捜査機関などに虚偽の情報を与えて\n真実を隠ぺいしようとしていた。だから、"}, {"t": 890.3666666666667, "x": "何らかの形で関与したことは疑いがない、と。"}, {"t": 893.5833333333334, "x": "関与は疑いがない、と書いてあるのに無罪なの？"}, {"t": 896.55, "x": "そこだ。判決はこう続く。しかし、死亡までの間、"}, {"t": 900.0, "x": "被告人以外の第三者がいた可能性があり、その者が\n遺体を損壊、遺棄した可能性も否定できない。"}, {"t": 906.05, "x": "遺体の運搬方法や損壊の目的など、"}, {"t": 908.6333333333333, "x": "被告人の具体的な行為も解明されていない。だから\n被告人の犯行と認めるには、合理的な疑いが残る。"}, {"t": 915.55, "x": "「関与した疑いはある」と\n「被告人がやったと認定できる」の間に、\n線が引かれている。"}, {"t": 921.6666666666666, "x": "もう一つの訴因、準強姦致死についても、\n東京地裁は無罪とした。"}, {"t": 926.05, "x": "理由は明快だ。判決要旨はこう\n書いている。ほかの公訴事実とは"}, {"t": 930.1, "x": "異なり、暴行場面を撮影したビデオテープが存在せず、"}, {"t": 933.3333333333334, "x": "解剖結果から暴行の痕跡を\n見いだすことができないため、暴行や\n薬物投与を直接証明する証拠はない。"}, {"t": 940.0, "x": "ここでもビデオの話が出てくるのね。"}, {"t": 942.3, "x": "出てくる。9件にはあって、1件には無かった。\nその差がそのまま結論の差になった。"}, {"t": 947.6166666666667, "x": "判決はさらに、踏み込んだ書き方をしている。"}, {"t": 950.3, "x": "被告人がルーシーさんの死にも\n何らかの形で関与していた疑いはある。"}, {"t": 954.4333333333333, "x": "薬物を摂取させ、これが一因となり\n死亡した疑いがないわけではない。"}, {"t": 958.8666666666667, "x": "しかし、遺体を鑑定しても死因は不明だった。"}, {"t": 961.5833333333334, "x": "被告人が類似手口の準強姦行為を重ねたことを\n加味しても、準強姦行為に及んだと推認するには、"}, {"t": 967.8333333333334, "x": "合理的な疑いが残る。"}, {"t": 969.6833333333333, "x": "疑いがないわけではない、って、\nずいぶん歯切れの悪い言い方ね。"}, {"t": 973.3666666666667, "x": "歯切れは悪い。だが、裁判所が\n書けるのはここまでだということでもある。"}, {"t": 977.5, "x": "死因が分からない。それが7か月という時間の結果だ。"}, {"t": 981.5166666666667, "x": "判決の結論は、無期懲役だった。"}, {"t": 983.9, "x": "ルーシーさん以外の9件で、\n法定刑の上限が言い渡されている。"}, {"t": 987.8833333333333, "x": "量刑理由は厳しい。判決要旨をそのまま読む。"}, {"t": 990.9, "x": "被告人は犯行に必要な薬物や、\nその模様を撮影する機材を準備した上、"}, {"t": 995.6666666666666, "x": "言葉巧みに女性を\nリゾートマンションの一室に連れ込んだ。"}, {"t": 998.8833333333333, "x": "犯行は極めて計画的、巧妙で、\n被害者の人格を著しく踏みにじり、誠に卑劣。"}, {"t": 1004.75, "x": "常習性は顕著で厳しい非難を免れない。"}, {"t": 1007.6333333333333, "x": "公判廷で不合理な弁解を繰り返し、"}, {"t": 1009.8333333333334, "x": "刑事責任を免れることのみに\nきゅうきゅうとしていることがうかがわれ、"}, {"t": 1013.6166666666667, "x": "一片の改悛の情をも見いだせない。"}, {"t": 1015.7, "x": "無期懲役刑をもって臨むほかない。"}, {"t": 1018.0666666666667, "x": "ここまで書いているのに、\nルーシーさんの件だけ無罪なのね。"}, {"t": 1021.5166666666667, "x": "この判決は、異例だと受け止められた。"}, {"t": 1023.9833333333333, "x": "判決を言い渡した裁判長は、\nルーシーさんの件についてこう述べている。"}, {"t": 1028.0, "x": "被害者と被告人が一緒にいたこと、被害者がその後、"}, {"t": 1031.3666666666666, "x": "行方不明になり遺体となって\n発見されたことしか明らかにされていない。"}, {"t": 1035.6166666666666, "x": "この一文が、東京地裁の判断のすべてだ。"}, {"t": 1038.4333333333334, "x": "一緒にいたことと、いなくなったことと、\n見つかったこと。その間が空白のままだった。"}, {"t": 1044.4, "x": "2007年5月1日、検察も被告人も、それぞれ\n判決を不服として東京高裁に控訴した。"}, {"t": 1050.9333333333334, "x": "控訴審の初公判は2008年3月25日。"}, {"t": 1054.1833333333334, "x": "弁護側は、ルーシーさんに関するすべての罪と、"}, {"t": 1057.0666666666666, "x": "オーストラリア人女性の致死罪について、\n無罪を主張した。"}, {"t": 1060.7666666666667, "x": "控訴審でも、認めていないのね。"}, {"t": 1063.0666666666666, "x": "認めていない。"}, {"t": 1064.05, "x": "そしてこの控訴審の最中、\n2008年7月に、ある事実が明らかになる。"}, {"t": 1068.9833333333333, "x": "東京地裁で致死罪が認定された\nオーストラリア人女性の遺族に、"}, {"t": 1072.7166666666667, "x": "被告人が見舞金として1億円を支払っていた。"}, {"t": 1076.05, "x": "裁判の途中に？"}, {"t": 1077.35, "x": "途中にだ。被告人はこの金を\n「お悔やみ金」だと説明し、女性の死とは\n関係ないと主張している。つまり、"}, {"t": 1084.1, "x": "罪を認めて払ったわけではない、という立場だ。"}, {"t": 1087.1333333333334, "x": "この金の扱いは、後で改めて話す。"}, {"t": 1089.8666666666666, "x": "2008年12月16日、東京高裁が判決を言い渡した。"}, {"t": 1094.0333333333333, "x": "一審判決を破棄したうえで、改めて無期懲役だった。"}, {"t": 1097.7166666666667, "x": "東京高裁は、死体損壊と遺棄について、\n5つの事実を並べている。"}, {"t": 1102.0333333333333, "x": "判決要旨をそのまま追う。"}, {"t": 1103.8666666666666, "x": "1つ。被告人は2000年7月3日夕、\n偽名でルーシーさんの友人に電話し、"}, {"t": 1108.7333333333333, "x": "ルーシーさんが自ら失踪したかのような\n偽装工作を試みている。"}, {"t": 1112.8166666666666, "x": "2つ。4日、東京都内でセメント等を買いそろえた。"}, {"t": 1116.3, "x": "3つ。5日、空き家のリゾートマンションに\n慌ただしく入室し、"}, {"t": 1119.9666666666667, "x": "室内でセメントを使った何かの作業をした。\nその夜来た警察官への対応からみると、その作業は"}, {"t": 1125.9666666666667, "x": "警察に知られたくないようなものだった。"}, {"t": 1128.45, "x": "その夜、警察官が来ていたの。"}, {"t": 1130.7666666666667, "x": "来ていた。そのときのやり取りまで、\n判決の材料になっている。"}, {"t": 1134.6166666666666, "x": "4つ。ルーシーさんの失踪が報道された後、\n7月15日ごろ、リゾートマンション付近に赴き、"}, {"t": 1140.5, "x": "遺体が発見された洞窟付近に姿を現した。"}, {"t": 1143.8166666666666, "x": "5つ。遺体とともにあった袋やテープ、セメントといった\n物が、被告人が入手または所持していた品と"}, {"t": 1149.8666666666666, "x": "同じか、類似していた。"}, {"t": 1151.7666666666667, "x": "一つ一つは小さくても、五つ並ぶと違って見えるわね。"}, {"t": 1155.55, "x": "高裁はこれらを総合して、こう結論した。"}, {"t": 1158.15, "x": "被告人が5日夜にリゾートマンションに\n入室し、室内で作業をし、"}, {"t": 1162.25, "x": "7日ごろまでに遺体を洞窟に\n遺棄したと認められる、と。"}, {"t": 1166.3, "x": "ここが、この動画でいちばん正確に伝えたいところだ。"}, {"t": 1169.55, "x": "東京高裁がルーシーさんについて有罪と認定したのは、\n4つの罪だ。わいせつ目的誘拐、準強姦未遂、"}, {"t": 1176.2333333333333, "x": "死体損壊、死体遺棄。"}, {"t": 1178.0833333333333, "x": "わいせつ目的誘拐について、高裁はこう書いている。"}, {"t": 1181.2, "x": "被告人はルーシーさんを誘い出した当初から、"}, {"t": 1183.8333333333333, "x": "薬物を使うなどして準強姦をする\n目的があったと認められ、証明十分である。"}, {"t": 1189.0833333333333, "x": "誘い出した時点から、という認定なのね。"}, {"t": 1191.9, "x": "そうだ。そして高裁は、薬物についても\n東京地裁より踏み込んでいる。"}, {"t": 1196.2833333333333, "x": "解剖結果によれば、ルーシーさんは生前、\n睡眠導入剤フルニトラゼパムを摂取していた。"}, {"t": 1201.4833333333333, "x": "被告人は当時この薬を手元に所持しており、"}, {"t": 1204.3333333333333, "x": "7月1日に逗子マリーナへ向かった\n際も携帯していた可能性が高い。"}, {"t": 1208.8166666666666, "x": "そして、他の被害者に対して同じことを\n繰り返していたことからすれば、"}, {"t": 1213.05, "x": "被告人はルーシーさんと室内に入った\n後、この薬を摂取させたと認められる。"}, {"t": 1218.1, "x": "ここまでは、高裁が認定した。"}, {"t": 1220.3333333333333, "x": "じゃあ、致死罪も認められたのかしら。"}, {"t": 1222.7166666666667, "x": "認められなかった。"}, {"t": 1223.9666666666667, "x": "検察の主張はこうだった。"}, {"t": 1225.6, "x": "被告人がルーシーさんに薬物を\n混入した飲み物を飲ませ、"}, {"t": 1229.05, "x": "クロロホルムを吸引させるなどして心神を\n喪失させて乱暴し、薬物作用に基づく心停止または"}, {"t": 1235.0166666666667, "x": "呼吸停止などにより死亡させた。"}, {"t": 1237.0166666666667, "x": "これに対して東京高裁は、こう書いている。"}, {"t": 1239.7, "x": "しかし解剖、検査結果等を\n総合してもルーシーさんの死因は"}, {"t": 1243.25, "x": "特定できず、クロロホルム等を\n使ったと認定することや、これにより\nルーシーさんが心神喪失状態に陥り、"}, {"t": 1249.4166666666667, "x": "被告人がルーシーさんを乱暴したと断定はできない。"}, {"t": 1252.6333333333334, "x": "高裁でも、死因は分からないままだったのね。"}, {"t": 1255.4666666666667, "x": "分からないままだった。だから、\n準強姦致死という罪は成立しなかった。"}, {"t": 1259.9666666666667, "x": "整理する。東京地裁は、ルーシーさんに\n関する訴因をすべて無罪とした。"}, {"t": 1264.1833333333334, "x": "東京高裁はそれを破棄し、わいせつ\n目的誘拐、準強姦未遂、死体損壊、\n死体遺棄の4つを有罪と認定した。"}, {"t": 1271.7666666666667, "x": "そして、ルーシーさんを死亡させたという\n点だけは、高裁も認定しなかった。"}, {"t": 1276.4166666666667, "x": "亡くなったことは事実なのに、誰も、\nその罪では有罪になっていないのね。"}, {"t": 1281.0333333333333, "x": "そういうことになる。この事件を語るとき、\nここを飛ばしてはいけないと私は思っている。"}, {"t": 1286.7, "x": "弁護側は上告した。そして2010年12月7日付で、\n最高裁第一小法廷が上告を棄却する決定をした。"}, {"t": 1294.05, "x": "無期懲役が確定している。"}, {"t": 1296.0166666666667, "x": "失踪の日から数えて、10年5か月だ。"}, {"t": 1298.8833333333334, "x": "10年。ご家族はずっと待っていたのね。"}, {"t": 1301.4, "x": "待っていた。そして、その間にもう一つ、ご遺族の間で\n受け止めが割れた出来事がある。見舞金の話だ。"}, {"t": 1308.0833333333333, "x": "さっき、オーストラリア人女性の遺族に\n1億円が支払われたと話した。"}, {"t": 1312.2666666666667, "x": "ルーシーさんの父親である\nティム・ブラックマンさんも、\n被告人の知人から見舞金を受け取っている。"}, {"t": 1318.0166666666667, "x": "ご家族の中で、意見は分かれなかったのかしら。"}, {"t": 1321.1, "x": "分かれた。ルーシーさんの母親は、これを\n「血塗られた金」だと表現し、強く批判している。"}, {"t": 1326.9, "x": "ティムさんは、このお金を\nルーシー・ブラックマン・トラストという\n団体の運営に充てたいと説明した。"}, {"t": 1332.3, "x": "海外にいるイギリス人の安全を支援し、行方が\n分からなくなった人の家族を助けるための団体だ。"}, {"t": 1338.3666666666666, "x": "どちらが正しいという話を、私は\nここでしない。する立場にない。"}, {"t": 1342.4666666666667, "x": "ただ一つ、事実として言えることがある。"}, {"t": 1344.8666666666666, "x": "裁判所は、量刑を決めるにあたって、被告人が\n支払った見舞金をあまり重視しなかった。"}, {"t": 1350.3, "x": "刑は無期懲役のまま動いていない。"}, {"t": 1353.0666666666666, "x": "お金の話を、もう一つしておきたい。"}, {"t": 1355.4, "x": "被告人が払った見舞金のことではない。"}, {"t": 1357.85, "x": "日本という国が、この事件で何をしたかという話だ。"}, {"t": 1361.4333333333334, "x": "2001年4月5日、参議院の内閣委員会で、\n犯罪被害者等給付金支給法の改正案が\n審議されていた。"}, {"t": 1368.4333333333334, "x": "犯罪の被害に遭った人や、その遺族に、\n国が給付金を出す制度だ。"}, {"t": 1373.0333333333333, "x": "この日の審議で、ひとりの議員が\nルーシーさんの名前を出している。"}, {"t": 1376.6833333333334, "x": "「ずっとワイドショーなんかで"}, {"t": 1377.8666666666666, "x": "取り上げてきたルーシー・ブラックマンさん、\nこんなことになったわけでございますが、"}, {"t": 1382.0666666666666, "x": "家族がイギリスからも来られて、\nいろいろ報道されておりましたが、"}, {"t": 1385.6833333333334, "x": "経費は全部イギリス大使館が持ったわけですね。"}, {"t": 1388.4666666666667, "x": "実際、そういう犯罪被害者としては\n適用されていないということなんですが」"}, {"t": 1393.15, "x": "日本の制度の対象に、入っていなかったの？"}, {"t": 1396.0833333333333, "x": "入っていなかった。同じ日の午後、この議員は\n国家公安委員会委員長に直接たずねている。"}, {"t": 1401.4833333333333, "x": "返ってきたのは、こういう答弁だ。"}, {"t": 1403.7666666666667, "x": "「まことに先生がおっしゃるとおり、"}, {"t": 1405.45, "x": "今の制度のもとでは大変日本の国としても\n申しわけないような結果になったにもかかわらず、"}, {"t": 1410.7333333333333, "x": "特段の御援助ができないという\n仕組みになっているということは"}, {"t": 1413.7333333333333, "x": "先生がおっしゃるとおりだろうと思います」"}, {"t": 1416.1666666666667, "x": "「国内に住所を持っている外国の方は"}, {"t": 1418.3666666666666, "x": "当然その対象になっているんですけれども、\n国内に住所を持っていない方は"}, {"t": 1422.6333333333334, "x": "対象におっしゃるとおりなっておりません」"}, {"t": 1424.85, "x": "大臣が、申し訳ないと言っているのね。"}, {"t": 1427.4833333333333, "x": "言っている。そのうえで、将来の課題として、"}, {"t": 1430.1166666666666, "x": "諸外国でこのようなケースが\nどうなっているかを見たうえで、"}, {"t": 1433.1666666666667, "x": "国民的合意を得て考えていかねばならない\n問題だ、と述べている。"}, {"t": 1437.2833333333333, "x": "この法律の条文は、今も読むことができる。"}, {"t": 1439.95, "x": "給付金を支給する相手から、\n日本国籍を有せず、かつ、"}, {"t": 1443.6666666666667, "x": "日本国内に住所を有しない者を除く、と書いてある。"}, {"t": 1447.15, "x": "私が確かめた限り、この一行は今も残っている。"}, {"t": 1450.65, "x": "あれから、そこは変わっていないのね。"}, {"t": 1452.9, "x": "変わっていない。国会でこの事件の名前が\n出たのは、私が調べた限り、この日の一度だけだ。"}, {"t": 1459.35, "x": "制度の話に戻る。あの夏、友人が\n麻布署に出したのは、家出人捜索願だった。"}, {"t": 1464.8666666666666, "x": "この呼び名が変わるのは、2009年12月11日だ。"}, {"t": 1468.35, "x": "行方不明者発見活動に関する規則という、\n国家公安委員会の規則が作られた。"}, {"t": 1473.6, "x": "施行は翌2010年4月1日。"}, {"t": 1476.1, "x": "ここで「家出人」は「行方不明者」に、\n「捜索願」は「行方不明者届」に変わった。"}, {"t": 1482.3666666666666, "x": "事件から9年後ね。"}, {"t": 1483.95, "x": "9年9か月後だ。"}, {"t": 1485.4, "x": "この規則の第1条には、目的が書かれている。"}, {"t": 1488.3666666666666, "x": "個人の生命及び身体の保護を図るために\n行う、行方不明者の発見のための活動、"}, {"t": 1493.6666666666667, "x": "発見時の措置等に関し必要な\n事項を定めることを目的とする。"}, {"t": 1497.9666666666667, "x": "そして第2条には、特異行方不明者という\n区分が置かれた。その第1号がこれだ。"}, {"t": 1502.85, "x": "殺人、誘拐等の犯罪により、その生命又は\n身体に危険が生じているおそれがある者。"}, {"t": 1508.6666666666667, "x": "事件かもしれない人を、\n別の枠で扱うようになったのね。"}, {"t": 1512.4, "x": "条文の上では、そうなった。"}, {"t": 1514.25, "x": "ちなみに今の数字も出しておく。"}, {"t": 1516.05, "x": "警察庁の資料によれば、\n2025年の行方不明者は8万486人。"}, {"t": 1521.25, "x": "届出を受けてから所在が分かるまでの期間は、\n受理した当日がいちばん多く、3万3,322人だ。"}, {"t": 1528.1166666666666, "x": "一方で、1年から2年かかった人が\n975人、2年以上が1,404人いる。"}, {"t": 1534.3666666666666, "x": "ここからは、私の見方を述べさせてもらう。"}, {"t": 1537.1333333333334, "x": "一つ目。この事件で有罪になったのは、\nルーシーさんがいなくなった「後」の行動だ。"}, {"t": 1542.3, "x": "偽名での電話。セメントの購入。"}, {"t": 1544.3, "x": "洞窟の近くに現れたこと。"}, {"t": 1546.1833333333334, "x": "高裁が並べた5つの事実は、全部そうだ。"}, {"t": 1549.2166666666667, "x": "逆に言えば、7月1日の夜、あの部屋で何が\n起きたのかは、地裁も高裁も認定していない。"}, {"t": 1554.9833333333333, "x": "10年5か月かけて、そこだけが空白のまま残った。"}, {"t": 1558.7, "x": "いちばん知りたいところが、残ったのね。"}, {"t": 1561.2166666666667, "x": "二つ目。その空白を作ったのは、7か月という時間だ。"}, {"t": 1565.1, "x": "死因が特定できなかった。だから\n致死の罪が成立しなかった。これは\n判決要旨に書いてあるとおりで、"}, {"t": 1571.0, "x": "私の推測ではない。"}, {"t": 1572.7, "x": "もっと早く見つかっていれば結論が\n変わっていた、とまでは言えない。それは誰にも"}, {"t": 1577.25, "x": "分からない。ただ、時間が経つほど分かることが\n減っていくのは、この事件がはっきり示している。"}, {"t": 1582.7833333333333, "x": "三つ目。同じ証拠を見て、地裁と\n高裁の結論が分かれたことだ。"}, {"t": 1587.0166666666667, "x": "新しい犯人が出てきたわけではない。"}, {"t": 1589.1333333333334, "x": "分かれたのは、状況証拠をどこまで積めば\n「認定できる」と言えるか、その線の引き方だった。"}, {"t": 1595.1166666666666, "x": "同じ材料でも、線の引き方で結論が変わるのね。"}, {"t": 1598.5666666666666, "x": "変わる。そして、どちらの線が正しかったのかを\n決める方法は、外側にはない。"}, {"t": 1603.4833333333333, "x": "私が最後に置いておきたいのは、この事件の入り口が\n「1本の電話」だったということだ。"}, {"t": 1609.0166666666667, "x": "あの電話は、捜索を\n止めるためにかけられたものだった。"}, {"t": 1612.1666666666667, "x": "高裁はそれを偽装工作と認定している。"}, {"t": 1614.9, "x": "そして皮肉なことに、その電話が、後に\n有罪を支える5つの事実の1番目になった。"}, {"t": 1621.0, "x": "今回の内容は、共同通信が配信した\n2つの判決要旨を主な土台にしている。"}, {"t": 1626.05, "x": "2007年4月24日の東京地裁判決の要旨と、\n2008年12月16日の東京高裁判決の要旨だ。"}, {"t": 1633.7666666666667, "x": "制度の部分は、国会会議録に拠っている。"}, {"t": 1636.35, "x": "2000年8月4日の衆議院地方行政委員会の答弁と、"}, {"t": 1640.0333333333333, "x": "2001年4月5日の参議院内閣委員会の質疑と答弁だ。"}, {"t": 1644.0333333333333, "x": "どちらも国会会議録検索システムで誰でも読める。"}, {"t": 1647.4666666666667, "x": "条文は、犯罪被害者等給付金の支給等に関する\n法律の第3条と、行方不明者発見活動に関する規則。"}, {"t": 1654.75, "x": "行方不明者の数字は、警察庁の統計に拠った。"}, {"t": 1658.1333333333334, "x": "日英首脳会談の部分は、外務省が\n公開している会談の記録に拠った。"}, {"t": 1662.7666666666667, "x": "事件の経過については、当時の日本と\n海外の報道を突き合わせて確かめている。"}, {"t": 1667.7166666666667, "x": "判決の言葉をそのまま読んでいたのは、そのためね。"}, {"t": 1671.05, "x": "そうだ。この事件は、言い換えた\n瞬間に意味が変わってしまう。だから、"}, {"t": 1675.05, "x": "認定された部分は判決の言葉のまま読んだ。"}, {"t": 1678.0833333333333, "x": "さらに詳しく知りたい人のために、2冊挙げておく。"}, {"t": 1681.15, "x": "捜査した側から書かれた『\n刑事たちの挽歌 警視庁捜査一課\n「ルーシー事件」』と、"}, {"t": 1686.35, "x": "イギリスの記者が15年かけて追った『黒い迷宮 \nルーシー・ブラックマン事件15年目の真実』だ。"}, {"t": 1692.7, "x": "2023年には、捜査員やご家族本人が\n出るドキュメンタリーも公開されている。"}, {"t": 1697.75, "x": "最後まで見てくれてありがとう。この事件について\n思うところがあれば、コメントで教えてほしい。"}, {"t": 1703.0166666666667, "x": "チャンネル登録と高評価も、次の調査の力になる。\nそれでは、また次の事件で。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
