<script>
const D={"name": "077", "file": "077_編集用", "dur": 2100.55, "segs": [], "subs": [{"t": 0.0, "x": "1987年5月3日、午後8時15分ごろ。"}, {"t": 3.8666666666666667, "x": "兵庫県西宮市。朝日新聞の阪神支局に、\n目出し帽をかぶった男が入ってきた。"}, {"t": 9.433333333333334, "x": "男は何も言わなかった。"}, {"t": 10.933333333333334, "x": "誰何もしなかった。持っていた散弾銃を、\nそこにいた記者に向けて撃った。"}, {"t": 15.516666666666667, "x": "記者一人が亡くなり、一人が重い傷を負った。"}, {"t": 18.25, "x": "亡くなったのは小尻知博記者、29歳だ。"}, {"t": 21.533333333333335, "x": "新聞社が、銃で。"}, {"t": 23.1, "x": "ああ。しかも、この日は憲法記念日だった。"}, {"t": 25.866666666666667, "x": "そして三日後、報道機関に一通の文書が届く。"}, {"t": 28.95, "x": "差出人の名は「日本民族独立義勇軍別動赤報隊」。"}, {"t": 33.15, "x": "そこから先、この名前を名乗る文書は、何度も届いた。"}, {"t": 36.56666666666667, "x": "撃たれたのは新聞社だけじゃない。"}, {"t": 38.38333333333333, "x": "前の総理大臣のところにも、\n現職の総理大臣のところにも、\n脅迫状が郵送されている。"}, {"t": 44.21666666666667, "x": "警察庁は、この一連の事件に番号を振った。"}, {"t": 47.11666666666667, "x": "警察庁指定第百十六号事件だ。"}, {"t": 49.75, "x": "そして2003年3月までに、\nすべての事件の時効が完成した。"}, {"t": 53.833333333333336, "x": "誰も捕まらないまま終わった。"}, {"t": 55.86666666666667, "x": "一人も？"}, {"t": 56.766666666666666, "x": "一人もだ。"}, {"t": 57.61666666666667, "x": "この事件については、本も番組も山ほどある。\nほとんどが「赤報隊とは誰だったのか」を追うものだ。"}, {"t": 63.96666666666667, "x": "だが今回は、その推理には行かない。"}, {"t": 66.15, "x": "材料を一つに絞る。国会の会議録と、\n警察庁が出した白書。"}, {"t": 70.5, "x": "国が自分で残した記録だけで、\nこの事件を追いかけてみる。"}, {"t": 74.26666666666667, "x": "先に断っておく。この動画では、誰かを\n犯人だと断定することはしない。"}, {"t": 78.75, "x": "特定の団体の仕業だとも言わない。"}, {"t": 80.91666666666667, "x": "警察が十五年以上かけて断定できなかったものを、\n私が断定していいはずがないからだ。"}, {"t": 87.0, "x": "事件の三日後、5月6日の参議院予算委員会。"}, {"t": 90.06666666666666, "x": "国会でこの事件が最初に取り上げられた日だ。"}, {"t": 93.0, "x": "このとき、答えているのは当時の国家公安委員長。"}, {"t": 96.0, "x": "事実関係を述べたあと、こう言っている。"}, {"t": 98.58333333333333, "x": "「兵庫県警察におきましては、事件認知以来、"}, {"t": 101.45, "x": "所轄署に百十名態勢の捜査本部を\n設置し、鋭意捜査中でございます」"}, {"t": 106.28333333333333, "x": "百十人。"}, {"t": 107.25, "x": "翌7日、同じ委員会に警察庁の刑事局長が\n立って、中身をもう少し詳しく説明している。"}, {"t": 113.51666666666667, "x": "事件を知ってすぐ、所轄の西宮警察署に\n110名の捜査本部を設置した。"}, {"t": 118.45, "x": "以来やってきたのは、現場検証、\n関係者からの事情聴取、"}, {"t": 122.2, "x": "使われたと見られる散弾銃の捜査、採った\n資料の分析、現場の周りでの聞き込み。"}, {"t": 127.58333333333333, "x": "普通の捜査、という感じね。"}, {"t": 129.65, "x": "ああ。ここまでは、そうだ。"}, {"t": 131.31666666666666, "x": "ところが、その同じ答弁の中で、\n刑事局長はこう続けている。"}, {"t": 135.43333333333334, "x": "「昨五月六日に至りまして、"}, {"t": 137.16666666666666, "x": "日本民族独立義勇軍と"}, {"t": 138.83333333333334, "x": "名のる団体から、いわゆる犯行声明とも受け取れます\n文書が一部報道機関に送付されてまいりました」"}, {"t": 145.01666666666668, "x": "届いた先は、時事通信社と共同通信社だ。"}, {"t": 148.11666666666667, "x": "警察はここで捜査の形を変えている。同じ答弁だ。"}, {"t": 151.51666666666668, "x": "「これまでの捜査本部体制に\n警備部門の五十名を加えまして、刑事、"}, {"t": 155.56666666666666, "x": "警備合同の捜査本部体制に拡充いたしまして」"}, {"t": 158.86666666666667, "x": "五十人、足したのね。"}, {"t": 160.51666666666668, "x": "ああ。110名に50名を足して、160名。\nこの事件は、ここで性格が変わった。"}, {"t": 166.01666666666668, "x": "普通の殺人事件を追う捜査本部から、\n文書の背後にいる誰かを追う捜査本部になったんだ。"}, {"t": 171.48333333333332, "x": "ただし、ここで一つ押さえておきたい言い方がある。"}, {"t": 174.35, "x": "警察庁は、この文書のことを、最後まで\n「犯行声明」とは呼ばなかった。"}, {"t": 179.18333333333334, "x": "5月14日、参議院法務委員会。"}, {"t": 181.5, "x": "警察庁の捜査第一課長の答弁だ。"}, {"t": 184.08333333333334, "x": "「五月の六日に至りまして、"}, {"t": 185.71666666666667, "x": "日本民族独立義勇軍別動赤報隊なる"}, {"t": 188.93333333333334, "x": "名義の挑戦状ともあるいは声明文とも\n受けとめられるような文書が\n一部報道機関に送達をされました」"}, {"t": 194.7, "x": "ずいぶん回りくどい言い方ね。"}, {"t": 196.53333333333333, "x": "翌15日、衆議院法務委員会では、\nもっとはっきり言っている。"}, {"t": 200.45, "x": "「犯行声明もどきと私ども\n申し上げているわけでございますが、"}, {"t": 203.98333333333332, "x": "声明みたいなものが一部報道機関に送付されました」"}, {"t": 207.38333333333333, "x": "そして、こう続ける。"}, {"t": 208.83333333333334, "x": "「現在のところこの赤報隊なるものの存在、"}, {"t": 211.53333333333333, "x": "組織の実態といったものは"}, {"t": 213.36666666666667, "x": "把握していないところでありまして、\nしかもこの犯行声明ごときものを名のっているものが"}, {"t": 218.11666666666667, "x": "本件犯人であるということもはっきりしないわけで」"}, {"t": 221.03333333333333, "x": "撃った人が書いたとは限らない、ってこと？"}, {"t": 223.63333333333333, "x": "そういうことだ。"}, {"t": 224.63333333333333, "x": "紙が届いただけでは、それを書いた人間が\n撃った人間だという証拠にはならない。"}, {"t": 229.15, "x": "警察はその一線を、最初から崩していない。"}, {"t": 232.16666666666666, "x": "だから私も、この動画では文書のことを\n「赤報隊を名乗る文書」と呼ぶ。\nそれ以上でも以下でもない。"}, {"t": 238.95, "x": "その文書には、警察も新聞社も\n知らなかったことが書かれていた。"}, {"t": 243.01666666666668, "x": "西宮の事件の、三か月以上前。"}, {"t": 245.43333333333334, "x": "東京の朝日新聞本社が撃たれていた、という話だ。"}, {"t": 249.03333333333333, "x": "え、誰も気づいてなかったの？"}, {"t": 251.0, "x": "それがこの事件の、最初の不気味なところだ。"}, {"t": 253.83333333333334, "x": "1988年3月28日、参議院法務委員会。"}, {"t": 257.98333333333335, "x": "警察庁の捜査第一課長が、一連の事件を順に\n説明している。その一件目の言い方が、これだ。"}, {"t": 264.43333333333334, "x": "「当初昨年の一月二十四日ごろのことであろうと\n思いますが、"}, {"t": 267.98333333333335, "x": "東京の朝日新聞本社に対しまして猟銃二発を\n撃ったという事件がございました」"}, {"t": 273.05, "x": "ごろ。"}, {"t": 273.65, "x": "警察が、日にちを断定していない。"}, {"t": 275.96666666666664, "x": "一年近く経っても「一月二十四日ごろのことであろうと\n思いますが」としか"}, {"t": 280.4, "x": "言えない。それくらい、この一件は\n最初、誰にも認識されていなかった。"}, {"t": 284.98333333333335, "x": "東京の本社は、日本でいちばん人の多い\n新聞社の一つだ。そこに銃が二発撃ち込まれて、"}, {"t": 290.51666666666665, "x": "誰も事件として届け出ていない。"}, {"t": 292.7, "x": "それが分かったのは、文書が届いたからだ。"}, {"t": 295.31666666666666, "x": "つまり、この一連の事件の一件目は、犯人を\n名乗る側の申告によって初めて事件になった。"}, {"t": 301.8, "x": "事件の直後、国会は連日この話に時間を割いている。"}, {"t": 305.5, "x": "さっき紹介した5月6日の答弁には、続きがある。"}, {"t": 308.68333333333334, "x": "葉梨信行 国家公安委員長の言葉だ。"}, {"t": 311.71666666666664, "x": "「報道機関の取材拠点ともいうべき支局に侵入して\n記者二名を殺傷するという重大事件であり、"}, {"t": 317.3, "x": "社会的反響も大きいものがございます」"}, {"t": 319.8833333333333, "x": "翌7日には、総理大臣が答弁に立っている。"}, {"t": 322.73333333333335, "x": "中曽根康弘 総理大臣だ。"}, {"t": 325.06666666666666, "x": "「表現の自由あるいは言論の自由、そういうような"}, {"t": 327.7, "x": "憲法の保障する基本的な権利に\n対する挑戦でありまして、これは\n軽視すべからざるものであります」"}, {"t": 333.5833333333333, "x": "「こういう傾向が出てくるということは、"}, {"t": 335.53333333333336, "x": "世の中のためにも憲法擁護のためにも厳重に\n我々は阻止しなければならないと思っております」"}, {"t": 341.21666666666664, "x": "総理が、はっきり言ってるのね。"}, {"t": 343.26666666666665, "x": "ああ。ただ、法務大臣の言い方は、少し違った。"}, {"t": 346.5833333333333, "x": "5月14日と15日の所信表明で、\n法務大臣はこう述べている。"}, {"t": 350.8, "x": "「これは、まれに見る凶悪な"}, {"t": 352.43333333333334, "x": "事件であり、もし、それが言論封殺を\n企図したものであるとするならば、それは、"}, {"t": 356.98333333333335, "x": "民主主義の根幹を破壊しかねない\n重大な事件と言わなければなりません」"}, {"t": 361.4166666666667, "x": "もし、そうであるとするならば。"}, {"t": 363.35, "x": "この「もし」に、委員から突っ込みが\n入っている。ちょっと甘いんじゃないか、と。"}, {"t": 367.9166666666667, "x": "だが法務省の側は、動機も背景もまだ\n分かっていない以上、そう書くしかなかった。"}, {"t": 372.68333333333334, "x": "事実が確定していないことを確定したように\n言わない。そこは徹底していた。"}, {"t": 377.3666666666667, "x": "一方、新聞社の側は、もっとはっきりしていた。"}, {"t": 380.51666666666665, "x": "5月14日の参議院法務委員会で、\n委員が、日本新聞協会が8日に出した\n声明を読み上げている。引用だ。"}, {"t": 387.4166666666667, "x": "「暴力の威圧によって言論・報道に\n影響を与えようとする動きは、"}, {"t": 391.2, "x": "断固としてこれを排除しなければならない」"}, {"t": 393.7, "x": "新聞社の集まりが、そろって声を出した。"}, {"t": 396.4166666666667, "x": "そしてもう一つ、記録として\n残しておきたい発言がある。"}, {"t": 400.0, "x": "5月15日、衆議院法務委員会。この日の冒頭に\n質問に立った委員が、こう述べている。"}, {"t": 405.68333333333334, "x": "「本日は、この事件に巻き込まれて逝去された\n小尻知博記者の朝日新聞社社葬の日であると\n伺っています」"}, {"t": 412.43333333333334, "x": "国会をやっているその日に、お葬式が。"}, {"t": 415.06666666666666, "x": "「この際、私は、小尻記者の御冥福を\nお祈りして弔意を表するとともに、"}, {"t": 419.4166666666667, "x": "御遺族に対し心よりお悔やみを申し上げたい、\nそのように存ずる次第でございます」"}, {"t": 424.2, "x": "そのうえで、こう続けた。"}, {"t": 425.8333333333333, "x": "「この事件が憲法記念日における言論機関に\n対する問答無用の凶行であるだけに、私は、"}, {"t": 431.35, "x": "日本国憲法秩序そのものに対する\n公然たる挑戦であると考え、"}, {"t": 435.5, "x": "強い衝撃とともに込み上げる怒りを\n抑えることができない気持ちなのでございます」"}, {"t": 440.75, "x": "では、警察は犯人像をどう見ていたのか。"}, {"t": 443.3666666666667, "x": "5月7日、参議院予算委員会。"}, {"t": 445.56666666666666, "x": "刑事局長はこう答えている。"}, {"t": 447.46666666666664, "x": "「昨日の新聞社等に送られてきました\n声明文からいたしますと、"}, {"t": 451.15, "x": "右翼とおぼしき団体の犯行である容疑は"}, {"t": 453.95, "x": "十分認められるところでございますが、\n捜査上いまだ断定するには"}, {"t": 457.3333333333333, "x": "至っておらないというところでございます」"}, {"t": 459.6166666666667, "x": "容疑は認められるけど、断定はできない。"}, {"t": 462.26666666666665, "x": "この形が、このあと十五年以上、変わらない。"}, {"t": 465.21666666666664, "x": "5月21日、衆議院地方行政委員会。同じ刑事局長だ。"}, {"t": 469.6166666666667, "x": "「こういった団体の存在自体いまだ警察としては\n把握しておらないところでございまして」"}, {"t": 474.56666666666666, "x": "「現段階でにわかに右翼関係の犯罪である、まして"}, {"t": 477.53333333333336, "x": "報道機関に送付してきた\n脅迫文の名義の団体の犯行であるという\nふうには断定できないわけでございます」"}, {"t": 483.9, "x": "さらに、面白い話が続いている。"}, {"t": 486.21666666666664, "x": "この名義の文書は、過去に\n別の事件でも、ある団体の機関誌に\n載ったことがあった。"}, {"t": 491.1333333333333, "x": "ところが、その関係者はこう主張している。"}, {"t": 493.95, "x": "「単に頼まれて掲載したにすぎない」"}, {"t": 496.3, "x": "頼まれて、載せただけ。"}, {"t": 498.06666666666666, "x": "つまり、その名前を使う人間と、その名前を\n載せた人間は、別だということだ。"}, {"t": 503.1666666666667, "x": "名前だけが、人から人へ渡り歩いている。"}, {"t": 505.9166666666667, "x": "翌年、1988年3月28日の参議院法務委員会では、"}, {"t": 510.8333333333333, "x": "委員から「新右翼」という言葉が出ている。\nそういうグループとの関係はどうなのか、と。"}, {"t": 516.1166666666667, "x": "警察庁の公安第二課長の答弁が、これだ。"}, {"t": 519.1666666666666, "x": "「いわゆる新右翼と言われておるものは"}, {"t": 521.2, "x": "マスコミのつけた名称でございまして、\n確たる定義はございませんけれども」"}, {"t": 525.3833333333333, "x": "定義がない。"}, {"t": 526.35, "x": "そう答えたうえで、こう続けている。"}, {"t": 528.3333333333334, "x": "「そのグループによる犯行の可能性もあるということで\n鋭意捜査しているところでございます」"}, {"t": 533.2166666666667, "x": "可能性もある。そこまでだ。"}, {"t": 535.0166666666667, "x": "この事件について、警察庁が\n国会で「これは誰々の犯行だ」と\n言ったことは、最後まで一度もない。"}, {"t": 542.0166666666667, "x": "「日本民族独立義勇軍」という\n名前自体は、このときが初めてではない。"}, {"t": 546.55, "x": "5月15日、衆議院法務委員会。"}, {"t": 548.85, "x": "警察庁の公安第二課長の答弁だ。"}, {"t": 551.4, "x": "「過去に日本民族独立義勇軍名下で\n犯したと思われる事案は"}, {"t": 555.2666666666667, "x": "どのくらいあるのか、こういった\n御質問でございますが、\n私ども承知いたしておりますところでは、"}, {"t": 560.4, "x": "五十六年に一件、五十七年に一件、五十八年に\n三件、合計五件の事実を確認いたしております」"}, {"t": 567.3, "x": "五件も、前にあったのね。"}, {"t": 569.2, "x": "ああ。昭和56年から58年、つまり\n1981年から83年にかけてだ。"}, {"t": 575.2333333333333, "x": "先に断っておくと、この五件は、のちに警察庁が\n一連の事件として指定する五件とは別の話だ。"}, {"t": 581.6166666666667, "x": "時期も対象も違う。"}, {"t": 583.2, "x": "ただし、警察はここにも但し書きを付けている。"}, {"t": 586.0, "x": "同じ日、捜査第一課長の答弁だ。"}, {"t": 588.6, "x": "「なるほど日本民族独立義勇軍なる名前を\n犯行声明等で名のってはおりますけれども、果たして"}, {"t": 594.0666666666667, "x": "その日本民族独立義勇軍なるものがやったのかどうか」"}, {"t": 597.65, "x": "「今は悪乗りの時代でございますので、"}, {"t": 599.6666666666666, "x": "一つの事案があるとあたかもおれがやったというような"}, {"t": 602.8, "x": "声明みたいなものが随分出てくるわけでございます」"}, {"t": 605.4333333333333, "x": "悪乗りの時代。"}, {"t": 606.6333333333333, "x": "1987年の国会で、警察庁の課長が言った言葉だ。"}, {"t": 611.05, "x": "そして、こう締めている。"}, {"t": 612.6166666666667, "x": "「日本民族独立義勇軍なるものの存在、"}, {"t": 615.2333333333333, "x": "実態がいろいろ捜査をしてみても\nどうもわからないというような状況で、"}, {"t": 618.9666666666667, "x": "捜査が大変難渋しておるということは事実であります」"}, {"t": 622.3666666666667, "x": "名前はある。事件もある。だが、その名前に\n対応する実体が、どこを探しても出てこない。"}, {"t": 628.55, "x": "夏が過ぎて、1987年9月24日。"}, {"t": 632.1833333333333, "x": "今度は名古屋だ。\n朝日新聞名古屋本社の社員寮が撃たれた。"}, {"t": 635.9166666666666, "x": "警察庁の捜査第一課長は、こう説明している。"}, {"t": 639.1833333333333, "x": "「名古屋の寮におきまして、これは"}, {"t": 641.0333333333333, "x": "昨年の九月二十四日でございますが、"}, {"t": 643.25, "x": "テレビ台に対しまして猟銃を\n一発撃った。かつ付近の壁に対しまして\nもう一発を撃っている。これは"}, {"t": 649.1333333333333, "x": "別の建物でございますが、\n二発撃ったという事案がございました」"}, {"t": 653.0666666666667, "x": "人はいなかったの？"}, {"t": 654.4333333333333, "x": "この事案でけが人は出ていない。"}, {"t": 656.2666666666667, "x": "そして、この月に、警察庁が動く。"}, {"t": 658.9, "x": "東京本社、阪神支局、名古屋の寮。\nこの三件を一つながりの事件と見て、"}, {"t": 663.8333333333334, "x": "警察庁指定第百十六号事件に指定した。"}, {"t": 667.0666666666667, "x": "1987年11月13日、参議院決算委員会。"}, {"t": 671.3, "x": "刑事局長が、指定後の捜査の柱を四つ挙げている。"}, {"t": 674.85, "x": "動機の面の捜査。散弾銃の捜査。"}, {"t": 677.2666666666667, "x": "犯行声明に使われたワープロの捜査。\nそして、犯行文にある赤報隊の解明。"}, {"t": 682.6333333333333, "x": "ワープロ。"}, {"t": 683.4333333333333, "x": "そこが、この事件の物証の中心になっていく。"}, {"t": 686.45, "x": "同じ答弁で、刑事局長はこうも言っている。"}, {"t": 689.2166666666667, "x": "「犯行声明等からいたしますと、第四、"}, {"t": 691.6666666666666, "x": "第五の犯行のおそれもございますので、"}, {"t": 693.8666666666667, "x": "何とか早期検挙するという決意のもとに\n取り組んでいるところでございます」"}, {"t": 698.1166666666667, "x": "第四、第五の犯行。警察は、\n次が来ると分かっていた。"}, {"t": 702.5333333333333, "x": "同じ11月13日の委員会で、委員が\n刑事局長に、こう聞いている。"}, {"t": 706.9833333333333, "x": "赤報隊というのは、この事件が起こるまで\n実態をつかんでいなかったのか、と。"}, {"t": 711.75, "x": "答弁がこれだ。"}, {"t": 712.8166666666667, "x": "「赤報隊という名前は"}, {"t": 714.1, "x": "当然承知いたしておるわけで、これまで"}, {"t": 716.3, "x": "幾つかの犯行におきましてもそういった名前が\n使われておった例があります。それから、"}, {"t": 721.0, "x": "幕末の赤報隊の件につきましては\n十分承知しておるところでございます」"}, {"t": 725.7166666666667, "x": "幕末の、赤報隊。"}, {"t": 727.5, "x": "幕末に実在した隊の名前だ。"}, {"t": 729.5833333333334, "x": "相楽総三氏が隊長を務め、\n尊王攘夷と倒幕を掲げて東へ進んだ。"}, {"t": 734.5, "x": "ところが、新政府の側から「偽の官軍」と扱われ、\n相楽氏たちは処断された、とされている。"}, {"t": 740.7, "x": "つまり、朝廷のために働いたつもりが、\nその朝廷の側に切り捨てられた隊だ。"}, {"t": 745.5666666666667, "x": "名乗った側がその歴史をどう\n受け止めていたのかは、分からない。"}, {"t": 749.0, "x": "文書にそう書いてあるわけでもない。"}, {"t": 751.0666666666667, "x": "ただ、警察庁が続けてこう言っている\nところが、この答弁の肝だ。"}, {"t": 755.25, "x": "「ただ、赤報隊というものが実在するのか"}, {"t": 757.6666666666666, "x": "どうか、そういう組織の内容が\nどうかというようなことにつきましては、これまでも"}, {"t": 762.3166666666667, "x": "把握しておらないところでございます」"}, {"t": 764.3666666666667, "x": "実在するのかどうかも、分からない。"}, {"t": 766.7833333333333, "x": "ああ。歴史上の赤報隊のことは分かっている。"}, {"t": 769.5, "x": "今名乗っている赤報隊のことは、何も分からない。"}, {"t": 773.3166666666667, "x": "ここで、物のほうの捜査を見ておく。"}, {"t": 775.5333333333333, "x": "現場に残っていたもので、\nいちばん確かなのは散弾の粒だ。"}, {"t": 779.3, "x": "1987年6月4日、参議院決算委員会。"}, {"t": 783.1, "x": "刑事局長の答弁だ。"}, {"t": 784.75, "x": "「現場に遺留されておりました散弾粒は"}, {"t": 787.0333333333333, "x": "規格上七・五号弾ということは\nはっきりいたしておるわけでございますが、\nその製造元が"}, {"t": 792.0666666666667, "x": "どこであるかといった点につきましてはいまだ\n断定するには至っておらないところでございます」"}, {"t": 797.0833333333334, "x": "規格は分かるけど、どこのメーカーか分からない。"}, {"t": 799.95, "x": "そういうことだ。"}, {"t": 800.95, "x": "では銃のほうはどうか。"}, {"t": 802.15, "x": "同じ日、警察庁の刑事局保安部長が、\n盗まれた銃の数を答えている。"}, {"t": 807.0833333333334, "x": "昭和52年から61年までの十年間で、盗難にかかわって\n所在が分からなくなった猟銃は、累計355丁。"}, {"t": 814.7166666666667, "x": "そのうち同じ期間に見つかったのが154丁。"}, {"t": 817.65, "x": "差し引き、十年間の未回収が201丁。"}, {"t": 820.7166666666667, "x": "散弾銃に絞ると、盗難が343丁、\n回収が149丁、未回収が194丁。"}, {"t": 827.4666666666667, "x": "二百丁近くが、どこにあるか分からない。"}, {"t": 830.1833333333333, "x": "さらに保安部長は、こう付け加えている。"}, {"t": 832.4833333333333, "x": "散弾銃は口径ごとの統計を\n取っていないので、この事件に関係する\n口径が何丁盗まれたかは分からない。"}, {"t": 838.9666666666667, "x": "ただ、所持許可を受けている\n散弾銃のうち、その口径が占める比率は"}, {"t": 843.15, "x": "86.5パーセント。そこから当てはめると、\nおよそ168丁ではないか、と。"}, {"t": 848.45, "x": "分かるのはそこまでだ。"}, {"t": 849.85, "x": "しかも、刑事局長はこうも言っている。"}, {"t": 852.0833333333334, "x": "犯行に使われた銃が盗難銃なのか\nどうかも、そもそも分からない。"}, {"t": 856.0666666666667, "x": "正規に許可を得ている銃が\n使われた可能性もある、と。"}, {"t": 859.4166666666666, "x": "母数の話も、国会に出ている。"}, {"t": 861.6333333333333, "x": "5月21日、衆議院地方行政委員会。"}, {"t": 864.5166666666667, "x": "質問に立った委員が、警察庁に\n聞いた数字を挙げている。"}, {"t": 868.1833333333333, "x": "国内にある散弾銃は、"}, {"t": 869.6666666666666, "x": "全部でおよそ47万丁。そのうち、この事件に"}, {"t": 872.8833333333333, "x": "関係する口径のものが41万丁あまり。\nさらにその中の、ある形式のものに\n絞っても、およそ20万丁。"}, {"t": 879.95, "x": "二十万。"}, {"t": 880.8, "x": "委員はこう言っている。"}, {"t": 881.85, "x": "「私も不勉強でありまして、こんなにもたくさん\n日本国内に銃があるのかと実はびっくりいたしました」"}, {"t": 887.8833333333333, "x": "二十万丁の中から一丁を特定する。しかも、\nその一丁が今どこにあるかも分からない。"}, {"t": 893.2833333333333, "x": "6月4日の参議院決算委員会では、委員が、この事件に\n150人の専従態勢が組まれていると述べている。"}, {"t": 900.1666666666666, "x": "それだけの人数を張り付けても、\n物からは近づけなかった。"}, {"t": 904.4333333333333, "x": "年が明けて、1988年3月。"}, {"t": 907.5166666666667, "x": "警察が言っていた「第四の犯行」が来る。"}, {"t": 910.2333333333333, "x": "今度は銃ではなかった。"}, {"t": 911.7833333333333, "x": "朝日新聞静岡支局の駐車場に、\n時限装置を付けた爆発物が置かれた。"}, {"t": 916.6, "x": "11日の夜から翌12日にかけてのことだ。"}, {"t": 919.85, "x": "3月28日、参議院地方行政委員会で、\n委員はこう述べている。"}, {"t": 924.3166666666667, "x": "「この時限装置つきのピース缶爆弾というのは幸い"}, {"t": 927.45, "x": "不発に終わったわけでございますが、もし"}, {"t": 929.55, "x": "爆発していれば歩行者など一般市民まで大変な\n被害を受ける惨事になっていたところでありまして」"}, {"t": 935.3333333333334, "x": "不発。"}, {"t": 936.1333333333333, "x": "ああ。爆発しなかった。"}, {"t": 937.8, "x": "同じ日、参議院法務委員会で、\n警察庁の捜査第一課長が威力について聞かれている。"}, {"t": 943.2666666666667, "x": "「殺害能力につきましては疑問がございますが、"}, {"t": 946.0666666666667, "x": "傷害能力は十分あるのではないかという\nふうに考えております」"}, {"t": 949.8333333333334, "x": "そして、なぜ\n爆発しなかったのかについては、こう答えた。"}, {"t": 953.4833333333333, "x": "「故意に爆発しないようにさせたのか、あるいは\n偶然が作用して爆発しなかったのか、これは"}, {"t": 958.6833333333333, "x": "今後の捜査並びに鑑定結果をまたないと\n何とも申し上げることができません」"}, {"t": 963.3, "x": "わざとかもしれないし、たまたまかもしれない。"}, {"t": 966.0333333333333, "x": "そこも決まっていない。"}, {"t": 967.3333333333334, "x": "ただ、この一件は結果として、\n捜査にとっては大きかった。"}, {"t": 970.9333333333333, "x": "爆発しなかったおかげで、物が丸ごと残ったからだ。"}, {"t": 974.2833333333333, "x": "紙袋、時計、乾電池、缶。"}, {"t": 977.3166666666667, "x": "静岡の三日後、3月14日の午後3時ごろ。"}, {"t": 980.3666666666667, "x": "群馬県高崎市にある、中曽根前首相の事務所に、\n一通の郵便が届いた。"}, {"t": 985.5, "x": "3月16日、参議院予算委員会。"}, {"t": 988.0333333333333, "x": "刑事局長が、届いた二日後の国会で説明している。"}, {"t": 991.65, "x": "「高崎にございます事務所に赤報隊一同を名のる\n者から脅迫状が郵送されてきたわけでございます」"}, {"t": 997.8166666666667, "x": "総理大臣をやっていた人のところに。"}, {"t": 1000.2333333333333, "x": "ああ。そしてこの答弁で、警察庁は初めて、\n文書どうしのつながりを具体的に示している。読む。"}, {"t": 1006.5, "x": "「本件の文書が赤報隊一同を\n名のる者から出されていること、"}, {"t": 1009.9, "x": "消印の郵便局及び日付が朝日新聞静岡支局に\nおける爆破未遂事件の場合と同じであること」"}, {"t": 1016.3, "x": "「文章中に静岡の犯行を自認するような\n記述があること、文書の形式、表現、"}, {"t": 1021.3333333333334, "x": "記載内容等が一連の事件における犯行声明と\n酷似していることなどからいたしまして」"}, {"t": 1026.6833333333334, "x": "「本件が一連の事件の\n同一犯人あるいは同一グループによって\n敢行された可能性が強いと見まして、"}, {"t": 1032.55, "x": "目下最終的な鑑定を急いでいるところでございます」"}, {"t": 1036.0166666666667, "x": "同じ郵便局から、同じ日に出されてる。"}, {"t": 1038.8, "x": "静岡に爆発物を置いた日と、\n脅迫状を投函した日が同じだ。"}, {"t": 1042.9833333333333, "x": "そして報道では、このとき、当時の総理大臣である\n竹下登あてにも脅迫状が出されている。"}, {"t": 1048.6333333333334, "x": "消印は同じ3月11日だったとされる。"}, {"t": 1052.1333333333334, "x": "その3月16日の委員会には、\n竹下登 総理大臣本人が座っていた。"}, {"t": 1057.4, "x": "質問した委員は、こう前置きしている。かつて\n自分たちの党の委員長もテロに倒れた、と。"}, {"t": 1062.8666666666666, "x": "そのうえで、総理の決意を聞いている。答弁がこれだ。"}, {"t": 1066.1, "x": "「私もこの問題、いかに思想、"}, {"t": 1068.0833333333333, "x": "信条を異にするも、また言論の自由というものが\n保障されておる近代社会の"}, {"t": 1072.7833333333333, "x": "中でこのようなことはあり得べきことでないと」"}, {"t": 1075.1666666666667, "x": "そして、こう続けている。"}, {"t": 1076.85, "x": "「私どもがそういうものが許されないということ\n自身をこの席等を通じて発言することによって、"}, {"t": 1082.2, "x": "国民全体がそれらに対する批判というものを\n惹起し、それがまた現実捜査にも役立ち得る環境"}, {"t": 1088.1, "x": "づくりの一環となれば幸いであろうという\nふうに考えております」"}, {"t": 1091.7, "x": "国会で言うことが、捜査の役に\n立つかもしれない、って。"}, {"t": 1095.1833333333334, "x": "それくらいしか言えなかった、とも読める。"}, {"t": 1097.55, "x": "同じ日、警察庁は東京で\n緊急の捜査会議を開いている。"}, {"t": 1101.25, "x": "刑事局長の答弁だ。"}, {"t": 1102.9, "x": "「本日も警察庁におきましては、"}, {"t": 1104.95, "x": "警察庁長官以下が出席いたしまして\n関係府県警察の捜査担当課長を\n招致いたしまして緊急の捜査会議を"}, {"t": 1111.75, "x": "開催しているところでございます」"}, {"t": 1113.7333333333333, "x": "長官以下が全部集まる会議だ。"}, {"t": 1115.8166666666666, "x": "それでも、二日前の3月14日の答弁では、\nこう言うしかなかった。"}, {"t": 1120.1833333333334, "x": "「現在までのところ犯人に結びつくような\n有力な線は出ていないところであります」"}, {"t": 1125.5333333333333, "x": "1988年3月28日、参議院法務委員会。"}, {"t": 1129.8, "x": "この回の中で、私がいちばん\n大事だと思う答弁が出てくる。"}, {"t": 1133.4666666666667, "x": "警察庁の捜査第一課長が、一連の事件を\n並べたうえで、こう言っている。"}, {"t": 1138.2333333333333, "x": "「現在の見方といたしましては、"}, {"t": 1140.0666666666666, "x": "最初の猟銃を使った事案でございますけれども、\nこれについては散弾実包が同じものであると"}, {"t": 1145.2833333333333, "x": "現在までの鑑定では"}, {"t": 1146.7333333333333, "x": "認められる」"}, {"t": 1147.6333333333334, "x": "撃たれた弾が、同じ。"}, {"t": 1149.3166666666666, "x": "そして、文書のほうだ。"}, {"t": 1150.9333333333334, "x": "「それから一連の脅迫状が参っておりますが、\nこれの封筒の形状、"}, {"t": 1154.85, "x": "紙質、そして文章の中身でございますけれども、\nこれを鑑定いたしますと同一のワープロで"}, {"t": 1160.3, "x": "打たれておるということでございます」"}, {"t": 1162.3, "x": "同じワープロ。"}, {"t": 1163.3833333333334, "x": "「私どもといたしましては、"}, {"t": 1164.95, "x": "中曽根前総理に対します脅迫状も含めまして、"}, {"t": 1168.15, "x": "同一犯人あるいは同一グループによる犯行であるという"}, {"t": 1171.2, "x": "可能性が極めて強いというふうに見て\n捜査をいたしておるところでございます」"}, {"t": 1175.4333333333334, "x": "ここまでは、はっきり分かっている。"}, {"t": 1177.45, "x": "東京、西宮、名古屋、静岡、そして高崎に届いた\n紙。これらは同じ一台の機械から出ている。"}, {"t": 1183.95, "x": "同じ種類の弾が使われている。"}, {"t": 1186.1166666666666, "x": "つまり、一連であることは物で証明された。"}, {"t": 1188.85, "x": "ところが、その先が進まない。"}, {"t": 1191.5833333333333, "x": "同じ1988年3月28日、参議院の地方行政委員会。"}, {"t": 1196.65, "x": "委員が、なぜ犯人像の輪郭すら浮かんでこないのか、\n捜査の隘路はどこにあるのかと聞いた。"}, {"t": 1202.1, "x": "刑事局長は、四つ挙げている。\nこれは私の推測ではない。"}, {"t": 1205.7666666666667, "x": "警察庁が自分で挙げた理由だ。"}, {"t": 1207.9666666666667, "x": "一つ目。犯行声明のようなものは出ているが、\n犯行の動機が必ずしも明確でないこと。"}, {"t": 1213.55, "x": "二つ目。犯人像、逃走手段について、\n有力な目撃情報が得られていないこと。"}, {"t": 1218.9166666666667, "x": "三つ目。ここを読む。"}, {"t": 1220.35, "x": "「静岡支局で発見されました\n爆発物関係の紙袋とか時計とか乾電池、"}, {"t": 1225.2666666666667, "x": "ピース缶等遺留品を初めといたしまして、\n犯行に使用したと認められます散弾銃や実包、"}, {"t": 1230.85, "x": "犯行声明文作成に使用したと認められますワープロ等」"}, {"t": 1234.5166666666667, "x": "「物は相当たくさんあるわけでございますが、\nいずれも大量生産品、"}, {"t": 1238.35, "x": "大量流通品ということから\n購入者の割り出しというものが\n難航しておるわけでございます」"}, {"t": 1243.6, "x": "物はたくさんある。でも、\nどこの誰が買ったか分からない。"}, {"t": 1247.1, "x": "そういうことだ。"}, {"t": 1248.1166666666666, "x": "四つ目。「犯行声明文において自称しております\n赤報隊なるものが、既存の団体の中からはその名称は"}, {"t": 1254.5833333333333, "x": "出てこないわけでございまして、\nその実態解明に苦労している」"}, {"t": 1258.2, "x": "物は、あった。むしろ、多かった。"}, {"t": 1260.55, "x": "だがどれも、日本中に何万台、\n何十万個と出回っているものだった。"}, {"t": 1264.7833333333333, "x": "数が多すぎて、かえって誰にもたどり着けない。"}, {"t": 1268.2833333333333, "x": "ここで、文書の中身に触れておく。"}, {"t": 1270.4833333333333, "x": "ただし、脅迫文の全文を読み上げることはしない。"}, {"t": 1273.3833333333334, "x": "引用であることを断ったうえで、\n記録に残っている一節だけを引く。"}, {"t": 1277.6, "x": "1987年5月6日に届いた文書には、\nこう書かれていたとされる。引用だ。"}, {"t": 1283.1, "x": "「われわれは本気である。\nすべての朝日社員に死刑を言いわたす」"}, {"t": 1286.6833333333334, "x": "そして、「反日分子には極刑あるのみである」。"}, {"t": 1289.3833333333334, "x": "……。"}, {"t": 1290.3, "x": "1988年3月28日の国会では、委員が、そのとき\n届いたばかりの文書の中身をこう紹介している。"}, {"t": 1297.8833333333334, "x": "「今回の声明文には、朝日、毎日、"}, {"t": 1300.45, "x": "東京などの反日マスコミをできる方法で\n罰していこう、こういうふうにしていることからも、"}, {"t": 1305.4333333333334, "x": "一連の凶行は言論に対する挑戦であることが\n一層明白になってきました」"}, {"t": 1310.2166666666667, "x": "矛先が、一社から複数社に広がっていた。"}, {"t": 1313.2333333333333, "x": "また、1987年5月21日の国会では、\n別の委員が文書の特徴をこう挙げている。"}, {"t": 1319.4, "x": "犯行の日が憲法記念日であること、文書の中に\n「皇紀」という言葉が使われていること、"}, {"t": 1324.9333333333334, "x": "「反日分子」という言葉が使われていること。"}, {"t": 1327.95, "x": "中曽根前首相あての文書には、"}, {"t": 1329.9, "x": "靖国参拝や教科書の問題で日本民族を\n裏切った、といった趣旨のことが\n書かれていたと報じられている。"}, {"t": 1336.3666666666666, "x": "さらに1988年3月28日の参議院法務委員会では、\n別の委員が、"}, {"t": 1341.8166666666666, "x": "文書の中にあった言い回しを取り上げている。"}, {"t": 1344.2333333333333, "x": "「一人多殺、多殺多生」。"}, {"t": 1346.2666666666667, "x": "委員はこう述べている。"}, {"t": 1347.3666666666666, "x": "「一人一殺ということからさらに一殺どころか"}, {"t": 1350.2333333333333, "x": "多殺になってきておるわけですから、こういった"}, {"t": 1352.7333333333333, "x": "凶悪なグループの存在はまさに\n社会の敵として早く究明する必要がある」"}, {"t": 1357.25, "x": "一人一殺。戦前に、そういう言葉があったわね。"}, {"t": 1360.6, "x": "ああ。文書は、その言い回しをさらに進めた\n形で書かれていた、と国会で指摘されている。"}, {"t": 1366.2333333333333, "x": "私はここで、その主張の中身を評価することはしない。"}, {"t": 1369.5666666666666, "x": "当時の政治の対立に、どちらが\n正しいという線を引くこともしない。"}, {"t": 1373.7166666666667, "x": "この動画で確かなこととして扱えるのは、そういう\n文言の紙が、実際に郵便で届いたという事実だけだ。"}, {"t": 1380.85, "x": "文書について、もう一つ、記録として面白い点がある。"}, {"t": 1384.4666666666667, "x": "差出人の名義が、途中で変わっているんだ。"}, {"t": 1387.3166666666666, "x": "1987年の最初の二通は、\n国会の答弁でもこう呼ばれている。"}, {"t": 1391.8333333333333, "x": "「日本民族独立義勇軍別動赤報隊」。"}, {"t": 1394.8, "x": "つまり、「日本民族独立義勇軍」という\n上の名前があって、その「別動」、"}, {"t": 1399.4333333333334, "x": "別働隊として「赤報隊」がある、という書き方だ。"}, {"t": 1403.1833333333334, "x": "組織の一部門、みたいな名乗り方ね。"}, {"t": 1405.8166666666666, "x": "ところが、\n1988年3月の中曽根前首相あての脅迫状について、\n刑事局長はこう言っている。"}, {"t": 1412.8333333333333, "x": "「赤報隊一同を名のる者から\n脅迫状が郵送されてきた」"}, {"t": 1416.4833333333333, "x": "上の名前が消えている。"}, {"t": 1417.75, "x": "残ったのは「赤報隊一同」だけだ。"}, {"t": 1420.4666666666667, "x": "一連の文書は、一九八七年一月から\n一九八八年三月までのあいだに、"}, {"t": 1426.3833333333334, "x": "朝日新聞に関する四件と、政治家二人あてで、\nあわせて六通が知られている。"}, {"t": 1431.5, "x": "そのあとにも、赤報隊を名乗る文書が\n出た事件があるとされているから、"}, {"t": 1435.5333333333333, "x": "数え方によっては八通になる。"}, {"t": 1437.6666666666667, "x": "ただ、どの数え方をしても、\n最後まで残った署名は同じだった。"}, {"t": 1441.75, "x": "赤報隊一同。"}, {"t": 1443.1166666666666, "x": "一同、って複数って意味よね。"}, {"t": 1445.1833333333334, "x": "ああ。何人いるのかは、書いていない。"}, {"t": 1447.2666666666667, "x": "警察も、最後まで分からなかった。"}, {"t": 1450.3, "x": "1988年8月。狙われたのは、新聞社ではなかった。"}, {"t": 1454.8833333333334, "x": "2026年5月8日、衆議院法務委員会。"}, {"t": 1457.9666666666667, "x": "警察庁の審議官が、指定第百十六号事件の中身を\n五件、順に読み上げている。その五件目がこれだ。"}, {"t": 1464.7833333333333, "x": "「同年八月に\n東京都港区内の株式会社リクルート前会長宅に\n対する散弾銃発砲事件」"}, {"t": 1471.1, "x": "リクルートの、前の会長。"}, {"t": 1472.9833333333333, "x": "江副浩正氏だ。報道では、8月10日の夜、\n東京都港区の自宅に一発撃ち込まれたとされている。"}, {"t": 1479.55, "x": "この年は、リクルートをめぐる問題が\n大きく報じられていた年でもある。"}, {"t": 1483.65, "x": "警察庁は、この一件と、静岡の爆破未遂を、\nあとから第百十六号事件に追加指定している。"}, {"t": 1490.0666666666666, "x": "これで指定の対象は五件になった。"}, {"t": 1492.25, "x": "東京本社、阪神支局、名古屋の寮、\n静岡支局、そしてリクルート前会長宅。"}, {"t": 1497.8666666666666, "x": "この五件が、国が「一連の事件」として\n公式に数えた全部だ。"}, {"t": 1502.05, "x": "2026年の国会で警察庁が\n読み上げたのも、この五件だった。"}, {"t": 1506.6333333333334, "x": "五件で、打ち止め。"}, {"t": 1508.1, "x": "ああ。そして、その五件すべてについて、\nのちに時効が完成することになる。"}, {"t": 1512.75, "x": "ちなみに、1990年に名古屋で\n起きた、ある団体の会館への放火事件についても、"}, {"t": 1518.2166666666667, "x": "赤報隊を名乗る文書が出たと報じられている。"}, {"t": 1521.1333333333334, "x": "ただし、これは警察庁が指定した五件には"}, {"t": 1523.95, "x": "入っていない。ここは\n混同されやすいので、はっきりさせておく。"}, {"t": 1528.0, "x": "捜査の規模は、時間とともに膨らんでいった。"}, {"t": 1530.85, "x": "1988年4月20日、衆議院決算委員会。"}, {"t": 1534.65, "x": "刑事局長の答弁だ。"}, {"t": 1536.3166666666666, "x": "「それぞれ発生都県警察に\n警察本部長を長といたします\n異例の特別捜査本部を設置いたしまして」"}, {"t": 1542.5833333333333, "x": "異例、って自分で言ってる。"}, {"t": 1544.2333333333333, "x": "普通、捜査本部の長は刑事部長クラスだ。それを、"}, {"t": 1547.4333333333334, "x": "都県警察のトップである本部長が直接やる。\nそれを警察庁が「異例」と表現している。"}, {"t": 1553.2666666666667, "x": "やっていることも、答弁のたびに同じ四つが並ぶ。"}, {"t": 1556.3833333333334, "x": "地取りと聞き込み。散弾銃と実包。"}, {"t": 1558.6833333333334, "x": "犯行声明文に使われた\nワープロ。そして赤報隊の解明。"}, {"t": 1562.6833333333334, "x": "一年経っても、二年経っても、この四つが並び続ける。"}, {"t": 1566.3666666666666, "x": "1989年9月6日、衆議院法務委員会。"}, {"t": 1569.9333333333334, "x": "大阪などを回った委員の視察報告に、こう出てくる。"}, {"t": 1573.3833333333334, "x": "「未検挙重要事件としては、"}, {"t": 1575.0666666666666, "x": "グリコ森永事件の犯人グループに\nよる食品企業脅迫等事件、"}, {"t": 1579.1, "x": "朝日新聞社阪神支局における\n猟銃使用による記者殺傷事件があり、"}, {"t": 1583.4, "x": "大阪府警及び兵庫県警等で強力に\n捜査活動を展開しているが、いまだ\n犯人を特定するに至っておりません」"}, {"t": 1590.2833333333333, "x": "その一年二か月後、\n1990年11月8日の参議院法務委員会。"}, {"t": 1595.1333333333334, "x": "視察報告の文章は、ほとんど同じだ。"}, {"t": 1597.9666666666667, "x": "「未検挙重要事件として、"}, {"t": 1599.5666666666666, "x": "グリコ・森永犯人グループによる食品企業脅迫等事件、"}, {"t": 1603.4166666666667, "x": "朝日新聞社阪神支局における猟銃使用に\nよる記者殺害事件等があります」"}, {"t": 1608.4666666666667, "x": "同じことが書いてある。"}, {"t": 1610.0, "x": "ああ。この二つの事件は、このあと\n十年以上、同じ並びで書かれ続ける。"}, {"t": 1614.5666666666666, "x": "この間、国会では、この事件が何を\nねらったものなのかについても議論されている。"}, {"t": 1619.4333333333334, "x": "1987年10月26日、参議院決算委員会。"}, {"t": 1623.6, "x": "委員の発言を引く。"}, {"t": 1625.0333333333333, "x": "「とりわけ無言で記者を銃撃するという攻撃方法は、"}, {"t": 1628.0333333333333, "x": "暴力に対する恐怖と不気味さをてこに、"}, {"t": 1630.4, "x": "自由な批判と反対意見の表明を\n言論機関に自己規制させるという\n効果をねらったものだと思われます」"}, {"t": 1636.65, "x": "自己規制。"}, {"t": 1637.6, "x": "何も言わずに撃つ。要求も出さない。\nそうすると、撃たれた側は"}, {"t": 1641.4333333333334, "x": "「次はどこか」を自分で考えるしかなくなる。"}, {"t": 1644.35, "x": "委員はこう続けている。"}, {"t": 1645.5833333333333, "x": "「言論、表現の自由、民主主義に対する深刻な\n影響は私は軽視すべからざるものがあると思います」"}, {"t": 1651.8666666666666, "x": "これは委員の見方であって、警察の判断ではない。\nただ、当時の国会でこう語られていたことは、"}, {"t": 1657.55, "x": "記録に残っている。"}, {"t": 1659.55, "x": "時間を飛ばす。2000年、平成12年。"}, {"t": 1662.2833333333333, "x": "この年の警察白書の40ページに、\nこの事件についての記述がある。"}, {"t": 1666.7, "x": "2023年2月2日、衆議院予算委員会で、"}, {"t": 1670.0166666666667, "x": "警察庁の刑事局長がその全文を\n読み上げている。議事録から引く。"}, {"t": 1674.4166666666667, "x": "「広域にわたる朝日新聞記者殺傷、\n器物損壊及び爆破未遂事件、\n警察庁指定第百十六号事件」"}, {"t": 1681.2333333333333, "x": "「昭和六十二年一月、"}, {"t": 1682.7833333333333, "x": "朝日新聞東京本社に対する\n散弾銃発砲事件が発生したのを始め、"}, {"t": 1687.4, "x": "五月に朝日新聞阪神支局において\n同社記者に対し散弾を発射して一人を殺害、"}, {"t": 1692.65, "x": "一人に重傷を負わせる殺傷事件が、\n九月には朝日新聞名古屋本社の寮に\nおける散弾銃発砲事件が発生した」"}, {"t": 1699.75, "x": "「これらはいずれも赤報隊を名のる犯人による\n一連の朝日新聞襲撃事件と見て、警察庁では、同月、"}, {"t": 1706.2, "x": "警察庁指定第百十六号事件に指定した」"}, {"t": 1709.3666666666666, "x": "そして最後の一文だ。"}, {"t": 1710.9333333333334, "x": "「平成十二年七月末現在、捜査中である」"}, {"t": 1714.2333333333333, "x": "二〇〇〇年でも、まだ捜査中。"}, {"t": 1716.3, "x": "ああ。事件から十三年経って、白書は\nまだ「捜査中である」と書いていた。"}, {"t": 1721.1166666666666, "x": "この言葉が書けるのは、時効までだ。"}, {"t": 1724.1, "x": "2002年5月3日。"}, {"t": 1725.6833333333334, "x": "西宮の事件から、ちょうど十五年。"}, {"t": 1727.9166666666667, "x": "当時の刑法では、殺人罪の公訴時効は十五年だった。"}, {"t": 1731.7333333333333, "x": "その日をもって、小尻記者が亡くなった\n事件は、誰も起訴できなくなった。"}, {"t": 1736.3, "x": "憲法記念日に起きて、\n憲法記念日に時効になったのね。"}, {"t": 1740.0, "x": "そうだ。"}, {"t": 1740.6166666666666, "x": "残りの事件も、順に時効を迎えていく。"}, {"t": 1743.1166666666666, "x": "静岡支局の爆破未遂は、報道では\n2003年3月11日に時効が成立したとされている。"}, {"t": 1749.3666666666666, "x": "そして2026年5月8日、衆議院法務委員会。"}, {"t": 1752.8333333333333, "x": "警察庁の審議官の答弁だ。"}, {"t": 1754.9666666666667, "x": "「平成十五年三月までに\nこれら全ての事件についての公訴時効が\n完成したものと承知しております」"}, {"t": 1761.0333333333333, "x": "平成十五年は、2003年だ。"}, {"t": 1763.3166666666666, "x": "同じ答弁で、審議官は\n指定事件の全体像も述べている。"}, {"t": 1767.0166666666667, "x": "「お尋ねの警察庁指定事件につきましては、"}, {"t": 1769.7, "x": "二十四事件が指定されまして、このうち被疑者が\n検挙に至っていない事件は二事件でございまして」"}, {"t": 1775.65, "x": "二十四件のうち、二件。"}, {"t": 1777.5166666666667, "x": "一つがグリコ・森永事件。もう\n一つが、この赤報隊事件だ。"}, {"t": 1781.8833333333334, "x": "では、時効になった事件は、\nそのあとどう扱われるのか。"}, {"t": 1785.4166666666667, "x": "2023年2月2日、衆議院予算委員会。"}, {"t": 1788.6166666666666, "x": "国家公安委員長の答弁だ。"}, {"t": 1790.5833333333333, "x": "「一連の事件につきましては、私は"}, {"t": 1792.8333333333333, "x": "国家公安委員長として、\n許し難い暴挙で、こういうことは\n二度とあってはならないと思っております」"}, {"t": 1798.5666666666666, "x": "そのうえで、こう続けている。"}, {"t": 1800.3166666666666, "x": "「公訴時効成立後に捜査を\n行わないというのが原則でございます。ただ、"}, {"t": 1804.5666666666666, "x": "犯人が自ら名のり出た場合など、\n特段の事情がある場合には、"}, {"t": 1808.3666666666666, "x": "警察として事実確認などを行うことはあり得る」"}, {"t": 1811.6333333333334, "x": "原則としては、もう捜査しない。"}, {"t": 1813.9, "x": "2026年の国会でも、同じことが確認されている。"}, {"t": 1817.5166666666667, "x": "「時効が完成した事案につきましては、一般的には\n捜査は終結するというふうに理解しております」。"}, {"t": 1823.5666666666666, "x": "ただ、この2026年の答弁には、\nもう一つ出てくる話がある。"}, {"t": 1827.9666666666667, "x": "委員が、この事件には遺留指紋があるはずだ、\nそれはどう保管されているのかと聞いた。"}, {"t": 1832.6666666666667, "x": "答弁は一般論としてこうだ。"}, {"t": 1834.7166666666667, "x": "「犯人が犯罪現場等に遺留したと"}, {"t": 1836.85, "x": "認められる指紋につきましては、この記録を\nデータベースに登録いたしまして、"}, {"t": 1841.1, "x": "将来的な犯人の割り出し等に備えて\n保管をしているところでございます」"}, {"t": 1845.65, "x": "将来的な、割り出し。"}, {"t": 1847.4, "x": "起訴はできない。それでも、記録のほうは残っている。"}, {"t": 1850.55, "x": "この事件のものが残っているかどうかを\n聞かれたときは、「個別具体的な"}, {"t": 1854.65, "x": "事件については、お答えは\n差し控えさせていただきたい」だった。"}, {"t": 1859.05, "x": "時効から十四年後の2017年5月16日、\n衆議院法務委員会。"}, {"t": 1863.7166666666667, "x": "ある法律の審議で、大学の教授が\n参考人として呼ばれ、意見を述べている。"}, {"t": 1868.3, "x": "刑事訴訟法が専門の研究者だ。"}, {"t": 1870.7833333333333, "x": "その締めくくりを読む。"}, {"t": 1872.15, "x": "「我が国でこれまでもう既にテロ犯罪、\nテロ行為が行われてまいりました。"}, {"t": 1876.25, "x": "どうしてそうしたテロ行為、"}, {"t": 1877.7, "x": "テロ犯罪を防ぐことができなかったのか、そういった\n国を挙げての御議論あるいは研究調査というものを私は"}, {"t": 1884.0666666666666, "x": "目にしたことがございません」"}, {"t": 1885.3666666666666, "x": "「そうした過去起きた事件に対して、"}, {"t": 1887.3333333333333, "x": "どうして未然に\n防ぐことができなかったのか、また犯人を\n突きとめることができなかったのか、例えば、"}, {"t": 1893.2333333333333, "x": "地下鉄サリン事件をなぜ\nとめることができなかったのか、なぜ赤報隊と"}, {"t": 1897.2666666666667, "x": "言われる人たちを逮捕できなかったのか、なぜ"}, {"t": 1899.9333333333334, "x": "警察庁長官銃撃事件の犯人を\n突きとめることができなかったのか」"}, {"t": 1904.3, "x": "「そういった反省なしにこうしたテロを\n防ぐための法案を用意するということは、"}, {"t": 1908.4, "x": "私は合理性を欠いていると思います」"}, {"t": 1910.8833333333334, "x": "検証されていない、ってことね。"}, {"t": 1912.8833333333334, "x": "この参考人は、二〇一五年に\nパリで起きた同時多発テロのあと、"}, {"t": 1916.8, "x": "フランスの議会が翌年に「なぜ\n食いとめられなかったのか」の検証を\n行った例を挙げている。"}, {"t": 1922.3833333333334, "x": "日本では、この事件についてそういう\n国としての検証報告書は作られていない。"}, {"t": 1927.1333333333334, "x": "残っているのは、いま私が読み上げてきた、\nそのときどきの答弁の積み重ねだけだ。"}, {"t": 1932.9, "x": "最後に、いまの話をする。"}, {"t": 1934.75, "x": "西宮の阪神支局は、いまもある。\nそして建物の三階には、資料室が作られている。"}, {"t": 1940.5, "x": "報道によれば、そこには、撃たれたとき\n小尻記者が座っていたソファや、"}, {"t": 1944.5, "x": "当時の原稿用紙、そして届いた\n文書などが並べられている。"}, {"t": 1948.3666666666666, "x": "捨てなかったのね。"}, {"t": 1949.7166666666667, "x": "ああ。時効になっても、置いてある。"}, {"t": 1951.8333333333333, "x": "毎年5月3日には、支局に祭壇が設けられる。"}, {"t": 1954.9833333333333, "x": "2026年の5月3日には、約350人が\n訪れたと報じられている。"}, {"t": 1960.1833333333334, "x": "同じ日、朝日新聞の労働組合が「言論の自由を考える\n5・3集会」を開いている。これも毎年続いている。"}, {"t": 1967.5666666666666, "x": "事件から39年経っても、この日に人が集まる。"}, {"t": 1971.0166666666667, "x": "私は、この事件をどう受け止めるべきかについて、\n答えを持っていない。"}, {"t": 1975.1333333333334, "x": "ただ、一つだけ言えることがある。"}, {"t": 1977.2, "x": "警察庁は、最後まで犯人像を断定しなかった。"}, {"t": 1980.3166666666666, "x": "「右翼であるか\nどうか、あるいはその外周のものであるか\nどうか断定するには"}, {"t": 1984.3333333333333, "x": "至っておりません」。これが、\n捜査していた側の言葉だ。"}, {"t": 1987.6833333333334, "x": "それなのに、この事件については、いまも\n断定的な語られ方がされることがある。"}, {"t": 1992.55, "x": "私はそこには乗らない。"}, {"t": 1993.95, "x": "乗るための材料を、国は残していないからだ。"}, {"t": 1996.8, "x": "もう一つ、当時の国会で\n言われていたことを紹介して終わりたい。"}, {"t": 2000.5833333333333, "x": "1988年3月28日、参議院地方行政委員会。"}, {"t": 2005.1, "x": "委員はこう述べている。"}, {"t": 2006.4333333333334, "x": "「自分の価値観とは相入れない他人の意見を暴力や"}, {"t": 2009.1833333333334, "x": "脅迫によって封じ込めようとする\n犯人の態度というものは、"}, {"t": 2012.5333333333333, "x": "我が国の民主主義の将来のためにも\n見過ごすわけにはいきません」"}, {"t": 2016.4833333333333, "x": "三十八年前の言葉ね。"}, {"t": 2018.4833333333333, "x": "ああ。三十八年前の国会の議事録に、\nそう書いてある。"}, {"t": 2022.15, "x": "犯人が誰だったのかは分からないままだ。だが、\n何が起きたのかは、全部残っている。"}, {"t": 2027.3333333333333, "x": "残す側が、残し続けたからだ。"}, {"t": 2030.3, "x": "今回話したことの出どころを、\nもう一度はっきりさせておく。"}, {"t": 2033.85, "x": "使ったのは、国会会議録検索システムで\n誰でも読める会議録だ。"}, {"t": 2038.05, "x": "1987年5月6日の参議院予算委員会から、\n2026年5月8日の衆議院法務委員会まで、"}, {"t": 2045.1, "x": "二十の会議を通して読んでいる。"}, {"t": 2047.1333333333334, "x": "警察白書については、平成12年版40ページの記述を、"}, {"t": 2051.05, "x": "2023年2月2日の衆議院予算委員会で\n警察庁の刑事局長が読み上げたものを使った。"}, {"t": 2057.3, "x": "追悼行事と資料室の様子は、神戸新聞の報道による。"}, {"t": 2060.95, "x": "犯行声明の文言のうち、国会の議事録で\n確認できないものについては、"}, {"t": 2065.366666666667, "x": "報道に基づくものとして「とされる」の形で話した。"}, {"t": 2069.1833333333334, "x": "全部、あとから自分で確かめられるのね。"}, {"t": 2071.9, "x": "そこがこの回の狙いだ。"}, {"t": 2073.5, "x": "1987年5月3日の夜、新聞社の支局で、"}, {"t": 2077.35, "x": "29歳の記者が亡くなった。もう\n一人の記者が重い傷を負った。"}, {"t": 2081.55, "x": "その後、名乗りの紙だけが何度も届き、"}, {"t": 2084.0, "x": "物はたくさん残り、それでも\n誰にもたどり着かないまま、\n2003年3月に全部が時効になった。"}, {"t": 2090.0833333333335, "x": "警察庁の指定した二十四の事件のうち、犯人が\n捕まらなかった二件のうちの一件が、これだ。"}, {"t": 2096.2, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
