<script>
const D={"name": "121", "file": "121_編集用", "dur": 2108.6833125, "segs": [], "subs": [{"t": 0.0, "x": "22口径の拳銃が1丁。"}, {"t": 1.8333333333333333, "x": "1968年10月、横須賀で盗まれた。"}, {"t": 5.433333333333334, "x": "その拳銃が4つの街で使われることになる。"}, {"t": 8.216666666666667, "x": "東京。京都。函館。名古屋だ。"}, {"t": 10.85, "x": "4つの街？"}, {"t": 11.95, "x": "そうだ。わずか一か月足らずの間のことだ。"}, {"t": 14.766666666666667, "x": "4人の方が撃たれて亡くなった。"}, {"t": 16.766666666666666, "x": "警察は全国の事件として追いかけた。"}, {"t": 19.416666666666668, "x": "それですぐ捕まったの？"}, {"t": 21.033333333333335, "x": "捕まらなかった。撃った人物は\n半年のあいだ分からなかった。"}, {"t": 24.783333333333335, "x": "手がかりがほとんど残っていなかったんだ。"}, {"t": 27.15, "x": "見つかったのは、翌年の春。その人物は19歳だった。"}, {"t": 31.15, "x": "19歳……。"}, {"t": 32.13333333333333, "x": "名前は永山則夫。逮捕から確定まで21年かかった。"}, {"t": 35.95, "x": "死刑と無期懲役のあいだを行き来した裁判だ。"}, {"t": 38.75, "x": "今回は、1丁の拳銃が4つの街を\nつないだ経過を順に追う。"}, {"t": 42.63333333333333, "x": "盗まれた日から千駄ケ谷の夜明けまで。"}, {"t": 44.95, "x": "途中で、青函連絡船の乗客約2万人を\n調べた捜査も見ていく。"}, {"t": 49.53333333333333, "x": "そこまで調べても、見つからなかったのね。"}, {"t": 52.3, "x": "そして最高裁が判決に並べた9つの事情までだ。"}, {"t": 55.88333333333333, "x": "9つの事情？"}, {"t": 57.15, "x": "それは終わりのほうで話す。"}, {"t": 58.766666666666666, "x": "亡くなった4人の方の名前とご様子は出さない。"}, {"t": 61.6, "x": "ご遺族の言葉は判決に記されたものだけを使う。"}, {"t": 64.88333333333334, "x": "分かったわ。"}, {"t": 66.35, "x": "話は1968年10月8日に始まる。"}, {"t": 69.73333333333333, "x": "場所は、神奈川県の横須賀。"}, {"t": 71.65, "x": "アメリカ海軍の基地の中だ。"}, {"t": 73.6, "x": "基地にはアメリカ軍人の宿舎がある。"}, {"t": 75.85, "x": "その宿舎の一つに空き巣が入った。"}, {"t": 78.31666666666666, "x": "基地の中に入れるものなの？"}, {"t": 80.11666666666666, "x": "本来は入れない。ただこの人物には前があった。"}, {"t": 83.01666666666667, "x": "2年前にも、同じ基地に入り込んでいる。"}, {"t": 85.65, "x": "物を盗み、1966年10月に家庭裁判所に送られた。"}, {"t": 90.23333333333333, "x": "同じ基地にまた入ったのね。"}, {"t": 92.16666666666667, "x": "そうだ。そして今度は拳銃を持ち出した。"}, {"t": 94.8, "x": "22口径の小さな拳銃だ。弾も一緒だった。"}, {"t": 98.0, "x": "この盗難は日本の警察に知らされていない。"}, {"t": 100.8, "x": "基地で拳銃が盗まれたのに？"}, {"t": 102.8, "x": "のちに国会である議員がそこを問いただしている。"}, {"t": 105.51666666666667, "x": "米軍の基地で拳銃が盗まれたら、\n日本の警察に報告は来るのかと。"}, {"t": 109.96666666666667, "x": "刑事局長は、米軍とのやり取りの決まりから説明した。"}, {"t": 113.58333333333333, "x": "持ち主が米軍に届ければ、\n米軍から警察署に連絡が来る。"}, {"t": 117.53333333333333, "x": "だが今回は持ち主からの申告が\nアメリカ側にも無かったようだ、と。"}, {"t": 121.78333333333333, "x": "誰も盗まれたことを知らなかったのね。"}, {"t": 124.25, "x": "少なくとも警察が接する米軍の担当は、\n知らなかったと聞いていると答えた。"}, {"t": 129.1, "x": "盗まれたと確かめられたのは、\n逮捕のあとの裏付けでだ。"}, {"t": 132.65, "x": "じゃあ、事件が起きても\n拳銃の出どころは分からないままなの？"}, {"t": 136.25, "x": "そうなる。拳銃と事件を結びつけた人はいない。"}, {"t": 139.28333333333333, "x": "結びついたのは半年後のことになる。"}, {"t": 141.6, "x": "のちの一審の判決は、ここをこう見た。"}, {"t": 144.1, "x": "拳銃に弾を込めて持ち歩いていた。"}, {"t": 146.31666666666666, "x": "そこに計画性が認められる、と。"}, {"t": 148.7, "x": "持ち歩いていた……。"}, {"t": 149.9, "x": "盗んでから3日後、拳銃は東京にあった。"}, {"t": 153.3, "x": "1968年10月11日。午前0時50分。"}, {"t": 157.25, "x": "場所は東京のプリンスホテルだ。"}, {"t": 159.2, "x": "勤務中だった警備の方が撃たれた。"}, {"t": 161.46666666666667, "x": "その方は亡くなった。"}, {"t": 163.0, "x": "どうして警備の人が？"}, {"t": 164.58333333333334, "x": "最高裁の判決は動機をまとめてこう書いている。"}, {"t": 167.53333333333333, "x": "先の犯行の発覚を恐れたため。"}, {"t": 169.83333333333334, "x": "あるいは金品を奪おうとしたため。"}, {"t": 171.8, "x": "そして「極めて安易に犯行に出ており」とした。"}, {"t": 174.98333333333332, "x": "安易に……。"}, {"t": 175.71666666666667, "x": "東京の現場には手がかりがほとんど残らなかった。"}, {"t": 178.7, "x": "撃った人物をはっきり見た人もいない。"}, {"t": 180.98333333333332, "x": "この時点ではただの一つの事件に見えた。"}, {"t": 183.66666666666666, "x": "ただの一つ、っていうのは？"}, {"t": 185.45, "x": "ほかの事件とつながるとは、まだ誰も知らなかった。"}, {"t": 188.6, "x": "同じ拳銃が3日後に京都で使われる。"}, {"t": 191.1, "x": "ここから先は日付だけを見ていくと分かりやすい。"}, {"t": 193.93333333333334, "x": "10月11日に東京。"}, {"t": 195.55, "x": "10月14日に京都。"}, {"t": 197.23333333333332, "x": "10月26日に函館。"}, {"t": 199.11666666666667, "x": "11月5日に名古屋だ。"}, {"t": 201.06666666666666, "x": "街がどんどん離れていくのね。"}, {"t": 203.05, "x": "そうだ。離れた街を次々に渡っていく。"}, {"t": 205.8, "x": "それが捜査を難しくした。"}, {"t": 208.23333333333332, "x": "10月14日。京都の八坂神社だ。"}, {"t": 210.81666666666666, "x": "ここでも勤務中の警備の方が撃たれた。"}, {"t": 213.33333333333334, "x": "その方は亡くなる前に、警察官の問いに答えている。"}, {"t": 216.83333333333334, "x": "何て言ったの？"}, {"t": 217.93333333333334, "x": "撃ったのは「十七、八歳の男」だと。"}, {"t": 220.85, "x": "これが半年のあいだ、ほとんど\n唯一の目撃の言葉になる。"}, {"t": 224.68333333333334, "x": "唯一なの？"}, {"t": 225.68333333333334, "x": "警察庁の刑事局長が、国会でそう説明している。"}, {"t": 229.21666666666667, "x": "犯人を見かけた者は、京都の被害者の言葉の\nほかは、はっきりしたものが無いと。"}, {"t": 234.2, "x": "京都府警はこの言葉を何度も確かめた。"}, {"t": 236.81666666666666, "x": "本当に間違いないのか、いろいろな角度から調べた。"}, {"t": 240.1, "x": "それでも確信を持っていると警察庁に伝えていた。"}, {"t": 243.38333333333333, "x": "十七、八歳って子どもじゃない。"}, {"t": 245.65, "x": "当時はそこが一番の驚きだった。"}, {"t": 247.85, "x": "拳銃で人を撃つのは大人だと、\n誰もが思っていたからな。"}, {"t": 251.4, "x": "もう一つ、判決が記した事実がある。"}, {"t": 254.05, "x": "京都の事件のあと、実の兄が自首を勧めていた。"}, {"t": 257.3833333333333, "x": "止めた人がいたのね。"}, {"t": 258.93333333333334, "x": "いた。だが本人はその言葉に耳を貸さなかった。"}, {"t": 262.01666666666665, "x": "判決の言葉では、函館に渡って\nさらに重大な犯行をした。"}, {"t": 266.0833333333333, "x": "その前に警察が一つの決定をしている。"}, {"t": 269.4, "x": "10月18日。京都の事件から4日後だ。"}, {"t": 272.4, "x": "警察庁はこの事件を特別な番号で指定した。"}, {"t": 275.55, "x": "名前は「指定第108号事件」。"}, {"t": 277.93333333333334, "x": "108号？"}, {"t": 278.96666666666664, "x": "全国の警察で追う事件に付ける番号だ。"}, {"t": 281.68333333333334, "x": "県をまたいで、ばらばらに\n捜査しないための指定になる。"}, {"t": 284.9166666666667, "x": "のちに国家公安委員長の荒木萬壽夫が、\n国会でこう説明した。"}, {"t": 288.96666666666664, "x": "全国警察の組織的な捜査を強力に行う必要がある。"}, {"t": 292.8666666666667, "x": "だから全国的な広域捜査を行うことにしたと。"}, {"t": 296.2, "x": "なぜ指定したの？"}, {"t": 297.45, "x": "大臣の説明では事件の性格を見て決めたとある。"}, {"t": 300.6, "x": "最後には、4つの都道府県警察に\n捜査本部が置かれる。"}, {"t": 304.26666666666665, "x": "ほかの県警もこの事件を重点にして動いた。"}, {"t": 307.1, "x": "国会では、この事件はほとんど「108号」と呼ばれる。"}, {"t": 310.73333333333335, "x": "俗に108号事件と言われる、と議員が質問している。"}, {"t": 314.35, "x": "番号で呼ばれる事件なのね。"}, {"t": 316.26666666666665, "x": "そうだ。だが番号を付けても、手がかりは増えない。"}, {"t": 319.26666666666665, "x": "指定から8日後、拳銃は海を渡っていた。"}, {"t": 322.6, "x": "10月26日。北海道の函館だ。"}, {"t": 325.48333333333335, "x": "今度撃たれたのは、タクシーの運転手の方だった。"}, {"t": 328.65, "x": "警備の人じゃないのね。"}, {"t": 330.21666666666664, "x": "違う。ここから先は判決の言葉で言うとこうだ。"}, {"t": 333.31666666666666, "x": "函館と名古屋では、タクシー強盗を働いた。"}, {"t": 336.21666666666664, "x": "そして運転手の方を撃った。"}, {"t": 338.2, "x": "お金が目当てだったってこと？"}, {"t": 340.0833333333333, "x": "判決は金品を奪おうとしたためと書いている。"}, {"t": 342.8333333333333, "x": "東京から京都、京都から函館。"}, {"t": 345.21666666666664, "x": "青森と函館のあいだには、青函連絡船が通っていた。"}, {"t": 349.01666666666665, "x": "船なら乗った人が分かるんじゃない？"}, {"t": 351.1666666666667, "x": "警察もその乗客を調べることになる。あとで話す。"}, {"t": 354.51666666666665, "x": "函館で亡くなった方のご遺族には、のちにお金が届く。"}, {"t": 358.1666666666667, "x": "その金がどこから来たのかも、判決に書かれている。"}, {"t": 361.56666666666666, "x": "お金……。"}, {"t": 362.31666666666666, "x": "それは裁判の章で話す。"}, {"t": 364.06666666666666, "x": "函館の事件から10日後。"}, {"t": 365.7, "x": "拳銃は名古屋にあった。"}, {"t": 367.8833333333333, "x": "11月5日。愛知県の名古屋だ。"}, {"t": 370.3333333333333, "x": "ここでもタクシーの運転手の方が撃たれた。"}, {"t": 372.93333333333334, "x": "4人目の方だ。"}, {"t": 374.25, "x": "最初の東京からどのくらいなの？"}, {"t": 376.4, "x": "10月11日から11月5日まで。"}, {"t": 379.06666666666666, "x": "最高裁の判決は、\n「わずか一か月足らずの間に」と書いた。"}, {"t": 383.0833333333333, "x": "何の落ち度もない4人の社会人だった、と判決は言う。"}, {"t": 386.5, "x": "一審の判決は働き盛りの4人の方だと書いている。"}, {"t": 390.1, "x": "その人たちの家族は……。"}, {"t": 391.78333333333336, "x": "精神的にも経済的にも深刻な打撃を受けた。"}, {"t": 395.01666666666665, "x": "これも一審の判決が、死刑を\n選んだ理由の一つに挙げた。"}, {"t": 398.73333333333335, "x": "ここで4人の方について決めごとを言っておく。"}, {"t": 401.35, "x": "この回では東京と京都の警備の方。"}, {"t": 403.8, "x": "函館と名古屋の運転手の方。そうとだけ呼ぶ。"}, {"t": 407.01666666666665, "x": "名前は出さないのね。"}, {"t": 408.48333333333335, "x": "判決も亡くなった方を記号で書いている。"}, {"t": 411.01666666666665, "x": "名古屋の事件のあと、拳銃の動きは止まる。"}, {"t": 413.71666666666664, "x": "警察の知る限り、ここから\n翌年4月まで同じ人物の事件は無い。"}, {"t": 418.15, "x": "止まったの？"}, {"t": 419.1, "x": "警察庁は、ほかに事件は\n起きていないと国会で答えている。"}, {"t": 422.8333333333333, "x": "殺人や傷害の事件はすべて、\n108号との関わりを調べさせていた。"}, {"t": 427.35, "x": "それでも4件のほかは見つからなかった。"}, {"t": 430.43333333333334, "x": "名古屋の事件から6週間ほど\nたった、1968年12月17日。"}, {"t": 435.6666666666667, "x": "衆議院の地方行政委員会で、\n国家公安委員長が所信を述べた。"}, {"t": 439.8666666666667, "x": "所信？"}, {"t": 440.55, "x": "これから警察の仕事をどう進めるかを話す場だ。"}, {"t": 443.56666666666666, "x": "委員長はまず、学生の集団による暴力事件を挙げた。"}, {"t": 447.05, "x": "その次に、犯罪の情勢で\n注目されるものを三つ並べている。"}, {"t": 450.93333333333334, "x": "拳銃による連続射殺事件。"}, {"t": 452.76666666666665, "x": "金融機関への強盗事件。"}, {"t": 454.6, "x": "列車などへの爆破事件だ。"}, {"t": 456.5, "x": "一番に拳銃の事件が来てるのね。"}, {"t": 458.8833333333333, "x": "異常で凶悪な犯罪が\n各地で続いている、という言い方だった。"}, {"t": 462.6333333333333, "x": "このうち列車の爆破は、横須賀線の事件が\n解決したと報告している。"}, {"t": 467.18333333333334, "x": "国民の協力で解決を見た、と。"}, {"t": 469.65, "x": "拳銃のほうは？"}, {"t": 470.8333333333333, "x": "早く解決するよう全力をあげている、とだけ言った。"}, {"t": 474.03333333333336, "x": "そして広い範囲をまたぐ捜査の体制を、\nさらに強めると述べた。"}, {"t": 477.96666666666664, "x": "同じ所信は、12月19日の参議院でもくり返された。"}, {"t": 481.71666666666664, "x": "年が明けた2月にも、拳銃の事件は\n所信の先頭近くに残っている。"}, {"t": 486.3, "x": "ずっと解決しないまま、年を越したのね。"}, {"t": 489.1, "x": "そうだ。その参議院の同じ日、\n議員が中身を問いただす。"}, {"t": 493.3333333333333, "x": "1968年12月19日。"}, {"t": 495.95, "x": "参議院の地方行政委員会だ。"}, {"t": 498.03333333333336, "x": "議員が国家公安委員長にたずねた。"}, {"t": 500.31666666666666, "x": "108号事件はいまだに解決していない。"}, {"t": 502.95, "x": "報道にも出ていないから、\n途中の様子を聞かせてほしいと。"}, {"t": 506.45, "x": "大臣は何て答えたの？"}, {"t": 508.21666666666664, "x": "わが国の犯罪史上、類を見ない\n凶悪な事件だと言った。"}, {"t": 511.8, "x": "そして難しさを二つ挙げている。"}, {"t": 513.9, "x": "一つは残された物に手がかりが非常に少ないこと。"}, {"t": 517.1666666666666, "x": "もう一つは、犯人の姿をはっきり見た人がいないこと。"}, {"t": 520.8666666666667, "x": "物も目撃者もいないのね。"}, {"t": 522.8333333333334, "x": "そうだ。一方で、国民からの情報は\n多数寄せられていた。"}, {"t": 526.4666666666667, "x": "年が明けて1969年2月25日。"}, {"t": 529.6166666666667, "x": "衆議院の委員会だ。"}, {"t": 531.05, "x": "別の議員が警察庁の刑事局長に迫った。"}, {"t": 534.05, "x": "時間がたっても、一向に\n逮捕されない。いかなることかと。"}, {"t": 537.7666666666667, "x": "きびしいわね。"}, {"t": 538.7833333333333, "x": "局長は、「警察の威信にかけても」\n逮捕すると答えた。"}, {"t": 542.4833333333333, "x": "人も金もふだんの倍の力を入れていると。"}, {"t": 545.1333333333333, "x": "局長は、捜査の難しさにも触れた。"}, {"t": 547.7166666666667, "x": "4か所で事件を起こしているのに、遺留物が何もない。"}, {"t": 550.9833333333333, "x": "交通の便がよく、どこへでも行ける時代の捜査だと。"}, {"t": 554.3, "x": "言いわけに聞こえない？"}, {"t": 555.65, "x": "局長自身が言いわけではないと断っている。"}, {"t": 558.2833333333333, "x": "たとえどんなに長くかかっても、必ず検挙したいと。"}, {"t": 562.2, "x": "1969年3月25日。"}, {"t": 564.8, "x": "参議院の地方行政委員会。"}, {"t": 566.7333333333333, "x": "議員が1枚の一覧表を手にしていた。"}, {"t": 569.1166666666667, "x": "警察庁の刑事局が作った、\n未解決の重要凶悪事件の表だ。"}, {"t": 573.6666666666666, "x": "何件のっていたの？"}, {"t": 575.1, "x": "1965年から1968年までで、40件だ。"}, {"t": 579.5833333333334, "x": "局長は凶悪犯の数字をまず出した。"}, {"t": 582.0333333333333, "x": "1968年の1年間で、凶悪犯は1万2734件。"}, {"t": 587.2666666666667, "x": "解決できるのは、例年91％前後。"}, {"t": 590.2833333333333, "x": "残りの1割が未解決だと。"}, {"t": 592.45, "x": "その1割に108号が入っていたのね。"}, {"t": 595.15, "x": "入っていた。局長は、ここで\n捜査の中身を一つ明かしている。"}, {"t": 599.0666666666667, "x": "北海道の青函連絡船の乗客、約2万人の追跡調査だ。"}, {"t": 603.5333333333333, "x": "2万人も？"}, {"t": 604.5666666666667, "x": "函館へ渡った人物なら、船に乗ったはずだと考えた。"}, {"t": 608.2833333333333, "x": "乗った人を一人ずつ確かめていく。"}, {"t": 610.5, "x": "局長の言葉では「しらみつぶしの捜査」だ。"}, {"t": 613.5166666666667, "x": "それでも犯人に行き着いていなかった。"}, {"t": 615.8833333333333, "x": "2万人を調べてそれでも？"}, {"t": 617.7166666666667, "x": "この日の答弁はこう終わる。"}, {"t": 619.3166666666667, "x": "現在のところ、まだ犯人を得るに至っていない。"}, {"t": 622.2, "x": "はなはだ遺憾でございます、と。"}, {"t": 624.1333333333333, "x": "この答弁から13日後だった。"}, {"t": 626.2666666666667, "x": "千駄ケ谷で一つの警報器が鳴る。"}, {"t": 629.0666666666667, "x": "ちょっと待って。その間、国会は\nずっと108号の話をしてたの？"}, {"t": 633.4833333333333, "x": "何度も出ている。それも、\n決まって一つの事件と並べてだ。"}, {"t": 637.2833333333333, "x": "どの事件？"}, {"t": 638.2, "x": "三億円事件だ。こちらも犯人が分からないままだった。"}, {"t": 641.6833333333333, "x": "2月8日の衆議院の予算委員会で、\n議員がこう言っている。"}, {"t": 645.2166666666667, "x": "三億円の事件がいまだにつかまらない。"}, {"t": 647.6, "x": "108号の連続射殺魔事件も、いまだにつかまらない。"}, {"t": 651.1833333333333, "x": "ほとんど見込みが立っていないのではないかと。"}, {"t": 653.6, "x": "大臣は、警察官は昼も夜も\n懸命に努めていると返した。"}, {"t": 657.7333333333333, "x": "二つまとめて責められたのね。"}, {"t": 659.75, "x": "3月14日の衆議院の法務委員会でもそうだ。"}, {"t": 662.8166666666667, "x": "二つの犯人をつかまえてもらわなければいけない。"}, {"t": 665.6666666666666, "x": "いつまでに逮捕できるのか\n答えてほしい、と議員は言った。"}, {"t": 669.0333333333333, "x": "答えられるものなの？"}, {"t": 670.45, "x": "この日、いつまでという答えは出ていない。"}, {"t": 672.8166666666667, "x": "当時の警察は大学の紛争の対応にも追われていた。"}, {"t": 676.1166666666667, "x": "何人もの議員が、そちらに人を\n取られていないかを心配した。"}, {"t": 679.8833333333333, "x": "大臣はそれを否定している。"}, {"t": 681.7333333333333, "x": "どっちが正しかったの？"}, {"t": 683.3833333333333, "x": "それはこの回では決めない。"}, {"t": 684.9666666666667, "x": "記録に残っているのは、議員と大臣のやり取りだけだ。"}, {"t": 688.3166666666667, "x": "そして108号は、警察の力では見つからなかった。"}, {"t": 691.85, "x": "見つけたのは一つの機械だった。"}, {"t": 694.5833333333334, "x": "1969年4月7日。"}, {"t": 696.85, "x": "午前1時32分ごろ。"}, {"t": 698.6666666666666, "x": "東京都渋谷区千駄ケ谷にある、\nビジネススクールの建物だ。"}, {"t": 702.35, "x": "教室の窓ガラスが、ドライバーでこじ開けられた。"}, {"t": 705.3166666666667, "x": "誰かが中に入り、事務室を物色し始めた。"}, {"t": 708.5666666666667, "x": "また泥棒？"}, {"t": 709.55, "x": "そうだ。だがこの建物には、電子警報器が付いていた。"}, {"t": 713.0666666666667, "x": "警備会社が取り付けたものだ。"}, {"t": 714.9666666666667, "x": "ブザーが鳴り、その知らせが警備会社の本社に届いた。"}, {"t": 718.4, "x": "機械が気づいたのね。"}, {"t": 719.9166666666666, "x": "本社は、近くを車で回っていた\n警備員に指令を出した。"}, {"t": 723.4333333333333, "x": "警備員は新宿区内をパトロールしていた。"}, {"t": 725.9333333333333, "x": "現場に急行して中に入って見回した。"}, {"t": 728.5333333333333, "x": "すると机の陰に誰かがうずくまっていた。"}, {"t": 731.2833333333333, "x": "見つけたのね。"}, {"t": 732.4, "x": "警備員が声を掛けると、相手は\n立ち上がりざまに拳銃を向けた。"}, {"t": 736.15, "x": "1発撃ち、外へ逃げた。"}, {"t": 737.7833333333333, "x": "路上でさらに2発撃った。"}, {"t": 739.6, "x": "警備員さんは？"}, {"t": 740.7166666666667, "x": "弾は当たらなかった。"}, {"t": 741.9, "x": "判決も命中しなかったと書いている。"}, {"t": 744.3166666666667, "x": "警備会社は、通りかかった人に頼んで110番をした。"}, {"t": 747.8333333333334, "x": "警視庁はすぐに全署に緊急配備をかけた。"}, {"t": 750.6333333333333, "x": "逃げた人物は夜の街に消えた。"}, {"t": 753.35, "x": "警察官たちは、明治神宮の北参道から\n境内に入って探した。"}, {"t": 757.7333333333333, "x": "午前5時8分。代々木署の警察官3人が、\n一人の若い男を見つけた。"}, {"t": 762.7333333333333, "x": "どこで？"}, {"t": 763.4833333333333, "x": "代々木1丁目の路上だ。男は歩いていた。"}, {"t": 766.1666666666666, "x": "警察官は職務質問をして、ポケットを調べた。"}, {"t": 769.3833333333333, "x": "出てきたのは拳銃と弾だった。"}, {"t": 771.5166666666667, "x": "その場で？"}, {"t": 772.4, "x": "その場で逮捕した。"}, {"t": 773.6833333333333, "x": "罪名は強盗殺人未遂と銃刀法違反。現行犯だ。"}, {"t": 777.25, "x": "つまりこの時点では、\n千駄ケ谷の事件で捕まっただけだ。"}, {"t": 780.9, "x": "4つの事件とはまだつながってないのね。"}, {"t": 783.4666666666667, "x": "まだだ。つながるのは取り調べのあとだ。"}, {"t": 785.85, "x": "ところでこの逮捕には、\n二つの見方が国会に残っている。"}, {"t": 789.5166666666667, "x": "4日後、ある議員はこう言った。"}, {"t": 791.45, "x": "犯人逮捕は警察がやったのではない。"}, {"t": 793.65, "x": "偶然、警備員が見つけたのだと。"}, {"t": 795.9666666666667, "x": "警察の手柄じゃないってこと？"}, {"t": 797.95, "x": "議員はそう見た。3年後の国会では、\n別の議員がこう話している。"}, {"t": 802.15, "x": "ある警備会社のパンフレットに、ガードマンが\nこの事件の犯人を逮捕したとあった。"}, {"t": 806.85, "x": "新聞にも大きく出て、とたんに\nガードマンがかっこよく見えたと。"}, {"t": 810.5833333333334, "x": "宣伝にもなったのね。"}, {"t": 812.1666666666666, "x": "その質問に警察庁の課長はこう説明する。"}, {"t": 815.15, "x": "ガードマンがつかまえたわけではございません。"}, {"t": 817.4833333333333, "x": "警備員が知らせ、代々木署の3人が\n職務質問で逮捕したと。"}, {"t": 821.5666666666667, "x": "どっちも間違ってはいないのね。"}, {"t": 823.55, "x": "見つけたのは、警報器と警備員。"}, {"t": 825.5333333333333, "x": "捕まえたのは警察官だ。"}, {"t": 827.35, "x": "どちらの言い方をするかで、\n話の手柄の置き場が変わる。"}, {"t": 831.3666666666667, "x": "男は警視庁の愛宕署に置かれた\n捜査本部へ連れて行かれた。"}, {"t": 835.1166666666667, "x": "そこで何を話したの？"}, {"t": 836.7333333333333, "x": "東京、京都、函館、名古屋。"}, {"t": 838.9833333333333, "x": "4つの事件の中身を話した。"}, {"t": 841.1166666666667, "x": "その日の夕方、男は疲れたと言い、\n取り調べはいったん止まった。"}, {"t": 845.1833333333333, "x": "翌朝からまた続けられている。"}, {"t": 847.1166666666667, "x": "ただ、話しただけでは決め手にならない。"}, {"t": 849.7166666666667, "x": "じゃあ、何が決め手になったの？"}, {"t": 851.7333333333333, "x": "弾だ。千駄ケ谷で撃たれた弾が鑑定に回された。"}, {"t": 854.95, "x": "結果はそれまでの4つの事件と同じ拳銃だった。"}, {"t": 858.1666666666666, "x": "同じ1丁……。"}, {"t": 859.2, "x": "男はさらに拳銃の出どころを話した。"}, {"t": 861.65, "x": "横須賀の基地の、アメリカ軍人の宿舎から盗んだと。"}, {"t": 865.15, "x": "警察はその日のうちに裏付けを取った。"}, {"t": 867.5333333333333, "x": "確かに盗まれていた。"}, {"t": 868.9, "x": "盗まれたのは22口径の拳銃だった。"}, {"t": 871.6, "x": "事件に使われたものと、まったく同じだった。"}, {"t": 874.6166666666667, "x": "冒頭の拳銃がここで戻ってくるのね。"}, {"t": 877.15, "x": "そうだ。半年前に盗まれた\n1丁が、4つの街をつないでいた。"}, {"t": 881.3, "x": "翌日の国会で、警察庁の刑事局長はこう締めくくった。"}, {"t": 885.25, "x": "本人をもって、4事件の犯人と\n確定しうる証拠を固めている段階だと。"}, {"t": 889.9833333333333, "x": "約半年の捜査だった。"}, {"t": 892.3, "x": "逮捕の翌日の国会で、議員が\n一つ気になる点を聞いている。"}, {"t": 896.25, "x": "どんなこと？"}, {"t": 897.2333333333333, "x": "盗まれた弾の数と、持っていた残りの弾の数だ。"}, {"t": 900.6, "x": "報道を見て計算すると、数が合わないと議員は言った。"}, {"t": 903.8333333333334, "x": "4つの事件のほかにも、使われたのではないかと。"}, {"t": 907.0333333333333, "x": "ほかにも事件があったかもしれないってこと？"}, {"t": 909.65, "x": "議員はそれを心配した。"}, {"t": 911.0666666666667, "x": "刑事局長の答えはこうだ。"}, {"t": 912.95, "x": "最初の東京の事件から、殺人や\n傷害の事件はすべて調べさせてきた。"}, {"t": 917.6166666666667, "x": "108号との関わりを考えて、\n捜査しろと全国に指示していた。"}, {"t": 921.8166666666667, "x": "警察が知る限り、千駄ケ谷を\n含めた5つのほかには無い、と。"}, {"t": 925.8666666666667, "x": "じゃあ、弾の差は何なの？"}, {"t": 927.5833333333334, "x": "局長はまだ正式な報告を受けていないと断った。"}, {"t": 930.8666666666667, "x": "そのうえで、どこかで試しに\n撃ったのかもしれないと言っている。"}, {"t": 934.2666666666667, "x": "ただ、これは局長が想像として話したことだ。"}, {"t": 937.3333333333334, "x": "確かめられた事実としては、この回では扱わない。"}, {"t": 940.6666666666666, "x": "山の中とかで何かあったら、分からないものね。"}, {"t": 943.7666666666667, "x": "局長自身も、そう言った。"}, {"t": 945.4833333333333, "x": "警察の目の届かない所なら何とも言えないと。"}, {"t": 948.5166666666667, "x": "はっきりしているのは、裁判で扱われた事件の数だ。"}, {"t": 951.9166666666666, "x": "亡くなった方が4人。そして千駄ケ谷の未遂が1件だ。"}, {"t": 956.0833333333334, "x": "4月8日。参議院の法務委員会。"}, {"t": 958.45, "x": "この日の議題には、「\n連続ピストル射殺事件に関する件」とある。"}, {"t": 962.6166666666667, "x": "ある議員が刑事局長に聞いた。"}, {"t": 964.4333333333333, "x": "本人は18歳ですか、と。"}, {"t": 966.5833333333334, "x": "答えは？"}, {"t": 967.4, "x": "19歳です。それだけだった。"}, {"t": 969.6333333333333, "x": "京都の人が言った「十七、八歳」と近いのね。"}, {"t": 973.2333333333333, "x": "近い。議員もそこを聞いている。"}, {"t": 975.1166666666667, "x": "局長は京都府警が確信を持っていたと答えた。"}, {"t": 978.1833333333333, "x": "のちの最高裁の判決は、年齢をもっと細かく書く。"}, {"t": 981.6833333333333, "x": "犯行のとき、19歳3か月から19歳9か月だった。"}, {"t": 985.7333333333333, "x": "判決の言葉では「年長少年」だ。"}, {"t": 988.4666666666667, "x": "少年、なのね。"}, {"t": 989.8, "x": "少年だ。だから国会の話は、\nすぐ別の方向へ広がった。"}, {"t": 993.8666666666667, "x": "4月10日の参議院では、ある議員がこう言っている。"}, {"t": 996.9, "x": "連続射殺犯人が、半年ぶりで逮捕された。"}, {"t": 999.9166666666666, "x": "19歳の少年だった。"}, {"t": 1001.7, "x": "新聞もテレビも一斉に大きく報じた、と。"}, {"t": 1004.5166666666667, "x": "世の中はどう受け止めたの？"}, {"t": 1006.2833333333333, "x": "議員はその言葉を、あ然としたと表している。"}, {"t": 1009.1666666666666, "x": "同じ月、国会では少年の育ちや\n仕事の話が次々に出る。"}, {"t": 1013.3666666666667, "x": "その前に警察の側から一つ明かされたことがある。"}, {"t": 1016.5166666666667, "x": "男の名前は捜査の網に入っていたという話だ。"}, {"t": 1020.2666666666667, "x": "網に入っていたって、どういうこと？"}, {"t": 1022.55, "x": "4月8日、刑事局長がこう答えている。"}, {"t": 1025.2833333333333, "x": "少年の名前は、\n警視庁の大きな調べの枠の中には入っていた。"}, {"t": 1029.4833333333333, "x": "じゃあ、もうすぐ見つかるところだったの？"}, {"t": 1031.8666666666666, "x": "局長はこう続けた。あの事件が起きなくても、\n相当濃い容疑者にはなったのではないか。"}, {"t": 1037.2, "x": "ただしここは局長の見方だ。"}, {"t": 1039.0, "x": "確かめようはない。"}, {"t": 1040.2166666666667, "x": "局長は全国で調べていた対象も並べている。"}, {"t": 1043.2, "x": "年は十七、八歳から二十五、六歳まで。"}, {"t": 1046.2833333333333, "x": "基地荒らしの経歴がある者。"}, {"t": 1047.9333333333334, "x": "家出人や所在の分からない者。"}, {"t": 1049.9833333333333, "x": "青函連絡船の乗客。海外へ渡ろうとした者。"}, {"t": 1053.2, "x": "盗みの前歴がある者。"}, {"t": 1055.0333333333333, "x": "それ、ほとんど当てはまるんじゃない？"}, {"t": 1057.1333333333334, "x": "局長自身が、ほとんど今回の少年に\n当てはまると言っている。"}, {"t": 1060.9666666666667, "x": "犯人を捕まえてからのことではあるが、とも\n付け加えた。"}, {"t": 1064.4666666666667, "x": "あとから見れば、ってことね。"}, {"t": 1066.2666666666667, "x": "そうだ。もう一つ、議員が聞いたことがある。"}, {"t": 1069.0, "x": "この少年は、国の保護観察を\n受けていたのではないかと。"}, {"t": 1072.6166666666666, "x": "保護観察？"}, {"t": 1073.6833333333334, "x": "家庭裁判所で決まる処分の一つだ。"}, {"t": 1076.1, "x": "施設に入れず、社会の中で\n暮らしながら指導を受ける。"}, {"t": 1079.3666666666666, "x": "法務省の保護局長は、こう答えた。"}, {"t": 1081.6333333333334, "x": "保護観察に付されております。"}, {"t": 1084.2333333333333, "x": "この日の質疑で、議員はもう\n一つ大事な点を聞いている。"}, {"t": 1087.7666666666667, "x": "まだあるの？"}, {"t": 1088.65, "x": "警察と保護観察を受け持つ法務省とのつながりだ。"}, {"t": 1091.8666666666666, "x": "議員の考えはこうだった。"}, {"t": 1093.5166666666667, "x": "あちこちで事件を起こすなら、\n住む所の決まらない者が怪しい。"}, {"t": 1097.2666666666667, "x": "拳銃なら米軍の基地も入手先の一つになる。"}, {"t": 1100.2833333333333, "x": "そこへ忍び込もうとした\n少年がいなかったか、細かく調べていく。"}, {"t": 1104.2833333333333, "x": "その段階で観察所から、こういう\n少年がいると連絡があれば。"}, {"t": 1108.2333333333333, "x": "大きな助けになったはず、ってことね。"}, {"t": 1110.6833333333334, "x": "議員自身がまあ、\nあとの祭りですけれどもと言っている。"}, {"t": 1113.8, "x": "刑事局長の答えはこうだ。"}, {"t": 1115.6, "x": "観察所から捜査本部に、具体的な\n連絡があったかは聞いていない。"}, {"t": 1119.7, "x": "ただ、各捜査本部は\n保護観察中の少年の調べに手を付けていた。"}, {"t": 1124.1166666666666, "x": "手は付けていたのね。"}, {"t": 1125.5166666666667, "x": "そうだ。だが、名前が\n浮かぶところまでは届かなかった。"}, {"t": 1128.9, "x": "ここでもどこが悪かったかをこの回では決めない。"}, {"t": 1131.6333333333334, "x": "記録にあるのは議員の問いと局長の答えだけだ。"}, {"t": 1134.5666666666666, "x": "ではその保護観察はどうなっていたのか。"}, {"t": 1137.6, "x": "保護局長の説明では、少年は\n家庭裁判所に3回かかっている。"}, {"t": 1141.8333333333333, "x": "1回目は1965年11月。"}, {"t": 1144.4333333333334, "x": "宇都宮で盗みの未遂。"}, {"t": 1145.9833333333333, "x": "処分は無しだった。"}, {"t": 1147.3333333333333, "x": "2回目は横須賀。前に話した基地への入り込みだ。"}, {"t": 1150.65, "x": "1967年4月28日に、保護観察が決まった。"}, {"t": 1155.1666666666667, "x": "3回目は？"}, {"t": 1156.2, "x": "1968年1月。外国の船に乗り込んで国を出ようとした。"}, {"t": 1160.8333333333333, "x": "神戸から香港へ向かう船で、\n出港の途中でつかまっている。"}, {"t": 1164.65, "x": "外国へ行こうとしたの？"}, {"t": 1166.2833333333333, "x": "そうだ。この3回目は処分無しで、\n保護観察がそのまま続いた。"}, {"t": 1170.4166666666667, "x": "つまり事件のとき、少年は保護観察の途中だった。"}, {"t": 1173.95, "x": "じゃあ、見てくれる人がいたはずよね。"}, {"t": 1176.2833333333333, "x": "本来はな。ふつうは観察官が2か月ほど様子を見る。"}, {"t": 1179.75, "x": "そのあと地域の保護司に引き継ぐ。"}, {"t": 1181.8, "x": "だが少年は呼び出しに来なかった。"}, {"t": 1183.9166666666667, "x": "所在が分からなくなり、見つかってはまた消えた。"}, {"t": 1186.9, "x": "何回くらい？"}, {"t": 1187.9666666666667, "x": "保護観察所に顔を出したのは、2年で4回だ。"}, {"t": 1191.0833333333333, "x": "最後に来たのは1968年8月12日。"}, {"t": 1194.65, "x": "拳銃が盗まれる2か月前だ。"}, {"t": 1196.7333333333333, "x": "そのときもひどく興奮していたと記録されている。"}, {"t": 1199.6666666666667, "x": "その後また所在が分からなくなり、事件が起きた。"}, {"t": 1202.65, "x": "局長は、所在をつかめなかったのが\n非常に不備なところだったと述べた。"}, {"t": 1207.55, "x": "4月10日の参議院では、観察課長が\nもう少しくわしく話している。"}, {"t": 1211.8666666666666, "x": "1968年2月16日。"}, {"t": 1214.4, "x": "3回目の決定の日だ。"}, {"t": 1216.15, "x": "少年は兄と一緒に、保護観察所に来た。"}, {"t": 1219.0833333333333, "x": "そのときはどうだったの？"}, {"t": 1220.6666666666667, "x": "わりと静かに話ができた、とある。"}, {"t": 1223.0166666666667, "x": "少年はこう打ち明けたそうだ。"}, {"t": 1224.7833333333333, "x": "おれはとにかく生まれも悪いのだ。"}, {"t": 1226.65, "x": "何をしようと思ってもできないんだ、と。"}, {"t": 1229.1333333333334, "x": "……そんなことを言ったのね。"}, {"t": 1230.65, "x": "観察所は決まった仕事を長く続けるように言った。"}, {"t": 1233.75, "x": "困ったら必ず相談に来るように約束した。"}, {"t": 1236.65, "x": "少年は、そのあと杉並の牛乳店に\n住み込みで働き始める。"}, {"t": 1240.8666666666666, "x": "よかったじゃない。"}, {"t": 1241.9666666666667, "x": "観察所は保護司を決めて様子を見に行かせた。"}, {"t": 1244.6666666666667, "x": "だが少年は、保護司が来ると\n前歴がばれると気にした。"}, {"t": 1248.05, "x": "そしてまた、いなくなった。"}, {"t": 1249.9333333333334, "x": "見守ろうとしたことが、逆に……。"}, {"t": 1252.05, "x": "観察課長の説明では、そういう流れになる。"}, {"t": 1254.9666666666667, "x": "当時の東京の保護観察所で、\n少年の対象はおよそ6000人。"}, {"t": 1259.05, "x": "そのうち約450人の行方が分からなかった。"}, {"t": 1262.15, "x": "全国では、観察官1人が200人を\nこえる対象を受け持っていた。"}, {"t": 1266.3833333333334, "x": "保護局長がこの数字を国会で出している。"}, {"t": 1269.1333333333334, "x": "保護司の人は、何人くらいいたの？"}, {"t": 1271.5333333333333, "x": "全国でおよそ4万8000人だ。"}, {"t": 1273.5666666666666, "x": "定員は5万2500人だった。"}, {"t": 1275.8, "x": "受け持つ相手は、少年も大人も\n合わせて常に10万人をこえていた。"}, {"t": 1280.0166666666667, "x": "保護司って、お給料は出るの？"}, {"t": 1282.3666666666666, "x": "出ない。払われるのは、交通費くらいの実費だけだ。"}, {"t": 1285.5833333333333, "x": "1人を受け持って、ひと月に850円が上限だった。"}, {"t": 1289.3166666666666, "x": "1969年度から、1000円以内に\n上がったと局長は答えている。"}, {"t": 1294.0, "x": "ほとんど、気持ちでやってる仕事なのね。"}, {"t": 1296.5333333333333, "x": "局長も、社会奉仕の気持ちで\n務めてくれていると述べた。"}, {"t": 1300.1666666666667, "x": "足りないのは保護司より、\n相談相手になる観察官のほうだと。"}, {"t": 1304.5333333333333, "x": "少年がどこから来たのかも、見ておく。"}, {"t": 1306.9833333333333, "x": "生まれは1949年、北海道だ。"}, {"t": 1309.85, "x": "青森県の中学校を出て、\n1965年4月に東京へ出てきた。"}, {"t": 1314.65, "x": "集団就職？"}, {"t": 1315.9, "x": "そうだ。警察庁の担当者が、国会でそう説明している。"}, {"t": 1319.7333333333333, "x": "上京してから4年足らずのあいだに、\n仕事を7回ほど変えた。"}, {"t": 1323.5, "x": "住む場所も6回ほど転々としていた。"}, {"t": 1326.0333333333333, "x": "4年で7回……。"}, {"t": 1327.25, "x": "同じ日の国会である議員は働き方にも触れている。"}, {"t": 1330.45, "x": "少年は、夜の11時から朝の9時まで働いていたという。"}, {"t": 1334.2666666666667, "x": "夜通しじゃない。"}, {"t": 1335.3166666666666, "x": "議員は、深夜の喫茶店で働く\n若者が多いことを問題にした。"}, {"t": 1339.4166666666667, "x": "警察庁の担当者は、こう答えている。"}, {"t": 1341.9666666666667, "x": "集団就職で出てきた者のうち、定着の悪い者は半年、\n長くても3年以内に、かなりの数がやめていく。"}, {"t": 1348.9166666666667, "x": "東京で風俗営業の店に勤める人は、およそ25万人。"}, {"t": 1352.8333333333333, "x": "そのうち2万5000人から3万人ほどが、\n20歳未満だと推定していた。"}, {"t": 1357.6666666666667, "x": "そんなに大勢いたのね。"}, {"t": 1359.25, "x": "ある議員は最初の勤め先の数字を出している。"}, {"t": 1362.0333333333333, "x": "一緒に就職した39人のうち、残っているのは5人だと。"}, {"t": 1365.9666666666667, "x": "これは議員が国会で述べた数字だ。"}, {"t": 1368.2666666666667, "x": "やめたのはその人だけじゃないのね。"}, {"t": 1370.4666666666667, "x": "議員もそこを問題にした。"}, {"t": 1372.1833333333334, "x": "青森県出身の議員は、4月24日にこう話している。"}, {"t": 1375.95, "x": "郷里から出た少年が、射殺魔として大きく扱われた。"}, {"t": 1379.5, "x": "同じ青森県の人間として、\n申しわけないような気がする。"}, {"t": 1383.1333333333334, "x": "初めからあんな少年ではなかったのは事実だ、と。"}, {"t": 1386.3333333333333, "x": "そう言った議員もいたのね。"}, {"t": 1388.0, "x": "ただしここで一つ付け加えておく。"}, {"t": 1390.1666666666667, "x": "のちの最高裁の判決は、育ちについてこう書いている。"}, {"t": 1393.65, "x": "同じ境遇の兄弟たちは、立派に大人になっている。"}, {"t": 1396.9166666666667, "x": "だから育ちだけを特に\n重く見ることには疑問がある、と。"}, {"t": 1400.9666666666667, "x": "4月24日、青森県出身の議員は\n法務大臣にこう聞いた。"}, {"t": 1405.0833333333333, "x": "この時代の空気を、大臣はどう考えているのかと。"}, {"t": 1408.2166666666667, "x": "処罰するだけでなく、原因を\n突き詰めなければ少年犯罪はなくならないと。"}, {"t": 1412.8833333333334, "x": "大臣は何て答えたの？"}, {"t": 1414.65, "x": "少年犯罪の数は横ばいだと言った。"}, {"t": 1417.0166666666667, "x": "だが中身は、強盗や殺人のような\n悪質なものが非常に増えている。"}, {"t": 1421.1666666666667, "x": "施設に入れても出るとまた元に戻る傾向がある。"}, {"t": 1424.05, "x": "だから少年法の全体を、いま\n詳しく検討していると答えた。"}, {"t": 1428.0666666666666, "x": "法律を変えようとしてたのね。"}, {"t": 1429.9833333333333, "x": "検討していた。4月22日の衆議院では、\n別の議員が保護局長に聞いている。"}, {"t": 1435.15, "x": "少年法を変えて年齢を下げたり、\n罰を重く見たりする方向なのかと。"}, {"t": 1439.3166666666666, "x": "保護局長は、議論の中心は\n年齢の引き下げなどだと認めた。"}, {"t": 1443.2666666666667, "x": "ただ、担当は刑事局で自分は\n全体を答えられないと述べた。"}, {"t": 1447.1833333333334, "x": "はっきりしないのね。"}, {"t": 1448.5666666666666, "x": "同じ日、保護局長は数字も出している。"}, {"t": 1451.1666666666667, "x": "保護観察中に行方が分からなくなる\n少年は、全体の約6％。"}, {"t": 1455.6666666666667, "x": "東京の観察所の管内だけだと、7％を少し上回る。"}, {"t": 1459.75, "x": "結果が思わしくなかった少年は、\n全体のおよそ24％だと。"}, {"t": 1464.2166666666667, "x": "4人に1人くらいね。"}, {"t": 1465.8166666666666, "x": "そうだ。ただし国会の議論は、\nこの回の主役ではない。"}, {"t": 1469.25, "x": "話をこの事件の裁判に戻す。"}, {"t": 1472.1, "x": "裁判は東京地方裁判所で始まった。"}, {"t": 1474.6666666666667, "x": "これが長くなる。"}, {"t": 1475.9, "x": "どのくらい？"}, {"t": 1476.7833333333333, "x": "逮捕から9年たった1978年にも、\nまだ一審の途中だった。"}, {"t": 1481.5666666666666, "x": "その年の6月、最高裁判所の刑事局長が\n国会で説明している。"}, {"t": 1486.1833333333334, "x": "弁護人が辞めてしまい、審理が進まないと。"}, {"t": 1489.0666666666666, "x": "どうして辞めたの？"}, {"t": 1490.3333333333333, "x": "説明によると被告人が要求を出したからだ。"}, {"t": 1493.2166666666667, "x": "起訴されていない事柄についても、証拠を調べろと。"}, {"t": 1496.45, "x": "裁判所は国選弁護人を付けようとした。"}, {"t": 1499.0666666666666, "x": "だがなかなか引き受け手がいなかった。"}, {"t": 1501.3666666666666, "x": "誰も来なかったの？"}, {"t": 1502.7833333333333, "x": "最後は、弁護士会の委員会の委員長たち3人が\n引き受けた。"}, {"t": 1506.6166666666666, "x": "弁護士会はこの3人に保険を掛けている。"}, {"t": 1509.2333333333333, "x": "額は、3000万円から\n5000万円だったと参考人が述べた。"}, {"t": 1513.25, "x": "保険まで？"}, {"t": 1514.2, "x": "支援する人たちから、強い抗議が\n出ていたと説明されている。"}, {"t": 1517.9833333333333, "x": "ある議員は、命の危険を\n冒してまで引き受けたと評した。"}, {"t": 1521.6333333333334, "x": "この裁判が国会でそんなに話題になったの？"}, {"t": 1524.5, "x": "なった。当時、国会には一つの法案がかかっていた。"}, {"t": 1527.9666666666667, "x": "弁護人がいなくても、審理を\n進められるようにする特例の法案だ。"}, {"t": 1532.0, "x": "弁護士会の参考人は、5月の委員会でこう述べている。"}, {"t": 1535.4833333333333, "x": "法務省は、この事件の審理が止まっていることを\n法案が必要な理由の中心にした。"}, {"t": 1540.5, "x": "だがこの事件は過激派が起こした事件ではない。"}, {"t": 1543.3166666666666, "x": "国選弁護人も選ばれ、まもなく審理が再開される、と。"}, {"t": 1547.1166666666666, "x": "法案の理由に使われたのね。"}, {"t": 1549.1, "x": "弁護士会の側はそう受け止めていた。"}, {"t": 1551.3333333333333, "x": "どちらの言い分が正しいかは、この回では決めない。"}, {"t": 1554.2833333333333, "x": "こうして一審はようやく判決に進む。"}, {"t": 1556.6833333333334, "x": "判決は死刑だった。"}, {"t": 1558.1666666666667, "x": "最高裁の判決が一審の理由をまとめて引いている。"}, {"t": 1561.3333333333333, "x": "動機に同情すべき点がない。"}, {"t": 1563.0333333333333, "x": "弾を込めて持ち歩き、計画性がある。"}, {"t": 1565.5666666666666, "x": "犯行を何度も重ねている。"}, {"t": 1567.1666666666667, "x": "4人の命を奪い、結果が極めて重い。"}, {"t": 1569.85, "x": "連続射殺魔事件として報じられ、\n社会を深い不安に陥れた。"}, {"t": 1574.05, "x": "そして被告人に悔い改める様子が認められない。"}, {"t": 1577.1166666666666, "x": "判決は、この事件を犯罪史上まれに見る\n凶悪事件と呼んだ。"}, {"t": 1581.05, "x": "少年だったことなどを考えても、\n死刑はやむを得ないとした。"}, {"t": 1585.3166666666666, "x": "一審の判決のあと、被告人の暮らしに変化があった。"}, {"t": 1588.85, "x": "1980年12月12日。"}, {"t": 1591.2666666666667, "x": "被告人は獄中で結婚している。"}, {"t": 1593.7, "x": "獄中で？"}, {"t": 1594.65, "x": "そうだ。そして1981年8月21日、\n東京高等裁判所の判決が出る。"}, {"t": 1600.7166666666667, "x": "死刑を取り消し無期懲役とした。"}, {"t": 1602.9, "x": "変わったの？"}, {"t": 1603.85, "x": "変わった。高裁は、死刑を\n選んでよい場合をこう書いた。"}, {"t": 1607.1333333333334, "x": "どの裁判所が担当しても、死刑を\n選んだであろう程度の事情。"}, {"t": 1610.9166666666667, "x": "そういうときに限るべきだ、と。"}, {"t": 1612.9833333333333, "x": "どの裁判所でも同じ答えになるとき、ってこと？"}, {"t": 1616.0333333333333, "x": "そういう意味だ。そのうえで\n被告人に有利な事情を三つ挙げた。"}, {"t": 1619.6833333333334, "x": "一つ目。19歳だったが心の成長は\n18歳未満と同じに見られる。"}, {"t": 1624.3, "x": "だから18歳未満の少年を死刑にしない\n決まりの考え方を及ぼすべきだ。"}, {"t": 1628.9, "x": "二つ目。結婚して伴侶を得て、\n法廷での振る舞いが落ち着いた。"}, {"t": 1632.8666666666666, "x": "三つ目。獄中で書いた手記を\n本にして、その印税を遺族に贈った。"}, {"t": 1637.3166666666666, "x": "いくらくらい？"}, {"t": 1638.25, "x": "京都の事件のご遺族に、合わせて252万4400円。"}, {"t": 1642.3166666666666, "x": "函館の事件のご遺族に、合わせて463万1600円。"}, {"t": 1646.5833333333333, "x": "妻は京都と函館と名古屋のご遺族を\n訪ねて、お悔やみを伝えた。"}, {"t": 1650.75, "x": "東京のご遺族には？"}, {"t": 1652.25, "x": "判決の書き方では、届いた先は京都と函館だ。"}, {"t": 1655.7166666666667, "x": "そして受け取りを拒んだ、と記されたご遺族もいる。"}, {"t": 1659.4, "x": "無期懲役にした高裁は、さらに\n二つの考えを書き添えている。"}, {"t": 1663.4166666666667, "x": "二つ？"}, {"t": 1664.2166666666667, "x": "一つは死刑を言い渡すときの決め方だ。"}, {"t": 1666.75, "x": "法律を作る側の議論として、\nこういう意見があると紹介した。"}, {"t": 1670.6, "x": "死刑の宣告は裁判官の全員一致に\nよるべきだ、という意見だ。"}, {"t": 1674.6166666666666, "x": "その精神はいまの法律を使うときにも\n考える価値がある、と。"}, {"t": 1678.5166666666667, "x": "全員が死刑だと思わないと、死刑にしない、ってこと？"}, {"t": 1681.9666666666667, "x": "そういう考え方だ。もう一つは、\n事件の原因についてだ。"}, {"t": 1685.7666666666667, "x": "犯行の原因の一端は、国や\n社会の福祉政策の貧しさにある、と書いた。"}, {"t": 1690.7333333333333, "x": "社会のせいでもある、って言ったのね。"}, {"t": 1692.95, "x": "高裁は、そう書いた。だが\n最高裁はここを認めなかった。"}, {"t": 1696.6, "x": "国や社会の福祉政策を、この犯行に\n直接結びつけるのは妥当とは思われない。"}, {"t": 1701.7333333333333, "x": "最高裁の判決はそう書いている。"}, {"t": 1704.0166666666667, "x": "同じ事件なのにこんなに見方が違うのね。"}, {"t": 1706.7666666666667, "x": "違う。判決の文面を並べると、その差がはっきり出る。"}, {"t": 1710.3666666666666, "x": "ただ、どちらの判決にも共通して\n書かれていることがある。"}, {"t": 1713.8666666666666, "x": "ご遺族の気持ちの深さだ。"}, {"t": 1716.2333333333333, "x": "ここは判決の言葉をそのまま置く。"}, {"t": 1718.5833333333333, "x": "うん。"}, {"t": 1719.1166666666666, "x": "名古屋の事件で亡くなった方のご両親の言葉だ。"}, {"t": 1722.15, "x": "被告人からの弁償を受け取らないのが、\n息子に対するせめてもの供養である。"}, {"t": 1726.8666666666666, "x": "……受け取らないのが、供養。"}, {"t": 1728.55, "x": "もう一つ。東京の事件で亡くなった\n方のお母さんの言葉だ。"}, {"t": 1732.35, "x": "お母さんも被告人からの弁償を固く拒んだ。"}, {"t": 1735.25, "x": "どのような理由があっても、\n被告人を許す気持ちはない。"}, {"t": 1738.55, "x": "そう述べている。"}, {"t": 1739.3666666666666, "x": "……。"}, {"t": 1740.3, "x": "最高裁はこの二つを引いて、こう書いた。"}, {"t": 1742.9166666666667, "x": "遺族らの心情は痛ましいの一語に尽きる。"}, {"t": 1745.6, "x": "お金を受け取った人と、\n受け取らなかった人がいるのね。"}, {"t": 1749.1333333333334, "x": "いる。それぞれの家が選んだことだ。"}, {"t": 1751.3, "x": "4つの家にそれぞれ違う時間が\n流れていたということだ。"}, {"t": 1754.6333333333334, "x": "この回でご遺族のことはこれ以上話さない。"}, {"t": 1757.2166666666667, "x": "判決に残った二つの言葉だけで、十分だと思う。"}, {"t": 1760.7833333333333, "x": "そうね。"}, {"t": 1761.5166666666667, "x": "高裁の無期懲役に対して、検察官は上告した。"}, {"t": 1765.0166666666667, "x": "舞台は最高裁に移る。"}, {"t": 1767.3, "x": "1983年7月8日。"}, {"t": 1769.65, "x": "最高裁判所の第二小法廷だ。"}, {"t": 1771.95, "x": "無期懲役の判決を取り消し、東京高裁に差し戻した。"}, {"t": 1775.8, "x": "差し戻すって？"}, {"t": 1777.0166666666667, "x": "もう一度、高裁で審理し直させるということだ。"}, {"t": 1779.95, "x": "5人の裁判官の全員一致だった。"}, {"t": 1782.2833333333333, "x": "この判決が死刑を選ぶときの考え方を書いた。"}, {"t": 1785.3666666666666, "x": "並んでいる事情は9つある。"}, {"t": 1787.3, "x": "9つ、全部言える？"}, {"t": 1788.95, "x": "言う。犯行の罪質。動機。態様。"}, {"t": 1791.5166666666667, "x": "結果の重大さ。とくに亡くなった方の数。"}, {"t": 1794.4, "x": "遺族の被害感情。社会的影響。"}, {"t": 1796.7, "x": "犯人の年齢。前科。"}, {"t": 1798.4666666666667, "x": "そして犯行のあとの情状だ。"}, {"t": 1800.4833333333333, "x": "本当に9つね。"}, {"t": 1801.9666666666667, "x": "これらを合わせて見て、責任が誠に重大なとき。"}, {"t": 1805.1833333333334, "x": "罪と刑の釣り合いからも、世の中に同じ罪を\n起こさせない見地からも、極刑がやむを得ないとき。"}, {"t": 1811.0333333333333, "x": "そのときは死刑の選択も許される、と書いた。"}, {"t": 1814.0666666666666, "x": "高裁の「どの裁判所でも」っていう考え方は？"}, {"t": 1817.2833333333333, "x": "最高裁はその趣旨も理解できなくはないとした。"}, {"t": 1820.2166666666667, "x": "ほとんど異論の余地がないほど\n事情が悪い場合、と読めると。"}, {"t": 1823.6, "x": "そのうえでこの事件はそこに当たると判断した。"}, {"t": 1826.4, "x": "心の成長が18歳未満と同じだという\n点も、証拠上明らかではないとした。"}, {"t": 1831.3666666666666, "x": "結婚や弁償を、大きく見すぎるのも\n当を得ないと書いている。"}, {"t": 1834.95, "x": "きびしい判決ね。"}, {"t": 1836.35, "x": "被告人の態度にも触れている。"}, {"t": 1838.2833333333333, "x": "責められるべきは自分ではなく周りだ、という\n態度を公判でも手記でも変えていない。"}, {"t": 1842.9, "x": "判決はそこに問題があると書いた。"}, {"t": 1845.3, "x": "世の中はこの判決をどう受け止めたの？"}, {"t": 1847.8333333333333, "x": "1か月後の国会で、ある議員がこの判決に触れている。"}, {"t": 1851.3166666666666, "x": "死刑を示した最高裁の差し戻し判決があった、と。"}, {"t": 1854.8166666666666, "x": "その議員は、被告人は悔い改めた\n人だと言われていたとも述べた。"}, {"t": 1858.85, "x": "ただしこれは議員がそう聞いていたという話だ。"}, {"t": 1861.5333333333333, "x": "最高裁の判決は、責任を周りに\n向ける態度があると書いている。"}, {"t": 1865.75, "x": "見る人によって受け止め方が違ったのね。"}, {"t": 1868.9666666666667, "x": "差し戻された東京高裁は、\n1987年3月18日に判決を出した。"}, {"t": 1874.6166666666666, "x": "今度は死刑だった。"}, {"t": 1876.0333333333333, "x": "一審は死刑、二審は無期、もう一度二審で死刑……。"}, {"t": 1879.4, "x": "そうだ。同じ事件で判決が二度ひっくり返った。"}, {"t": 1882.5666666666666, "x": "そして1990年、最高裁で死刑が確定した。"}, {"t": 1886.3, "x": "逮捕された1969年から数えて21年だ。"}, {"t": 1890.15, "x": "21年……。"}, {"t": 1891.1833333333334, "x": "確定の前の1984年、法務省の刑事局長が\n国会でこの事件に触れている。"}, {"t": 1896.7833333333333, "x": "一審が死刑、二審が無期、最高裁が\n差し戻したと経過を説明した。"}, {"t": 1901.4166666666667, "x": "まだ高裁にかかっているので、\n中身に立ち入るのは控えたいと。"}, {"t": 1905.2166666666667, "x": "裁判の途中だと国は中身を話さないのね。"}, {"t": 1908.1666666666667, "x": "そういう答え方だった。"}, {"t": 1909.7, "x": "1997年8月1日。"}, {"t": 1912.1666666666667, "x": "東京拘置所で刑が執行された。"}, {"t": 1914.4, "x": "48歳だった。"}, {"t": 1915.9166666666667, "x": "19歳で捕まって、48歳。"}, {"t": 1918.5166666666667, "x": "翌年の国会である議員がこの執行に触れている。"}, {"t": 1921.5333333333333, "x": "何冊も著書がある確定者の執行が、\n夏休みのさなかに行われた。"}, {"t": 1925.9666666666667, "x": "議論の起きにくい時期だった、と。"}, {"t": 1928.1166666666666, "x": "議論はそのあとも続いたの？"}, {"t": 1929.9833333333333, "x": "続いた。最高裁が並べた9つの事情は、\nその後の国会でも何度も出てくる。"}, {"t": 1935.05, "x": "2008年には、ある議員が\n「九項目の基準」と呼んでいる。"}, {"t": 1938.95, "x": "別の議員は「約九点ぐらい」と言った。"}, {"t": 1941.6333333333334, "x": "2002年には別の議員がこう述べている。"}, {"t": 1944.1, "x": "死刑になる事案と無期懲役になる\n事案は、紙一重のケースが多い。"}, {"t": 1948.1333333333334, "x": "一審、二審、上告審のあいだで\n判断が揺れ動くこともまれではない。"}, {"t": 1952.3166666666666, "x": "その例としてこの事件を挙げた。"}, {"t": 1954.3833333333334, "x": "この事件が揺れた例なのね。"}, {"t": 1956.2333333333333, "x": "ただ、この回でその後の議論までは追わない。"}, {"t": 1958.8166666666666, "x": "追ってきたのは1丁の拳銃から始まった経過だ。"}, {"t": 1961.95, "x": "最後にもう一度その拳銃に戻るのね。"}, {"t": 1964.5, "x": "その前に話の出どころを並べておく。"}, {"t": 1967.5, "x": "裁判の中身は、\n1983年7月8日の最高裁判決の全文から引いた。"}, {"t": 1973.2666666666667, "x": "裁判所の判例検索で公開されている。"}, {"t": 1975.9, "x": "4つの事件の日付と108号の指定は、\n1968年12月19日の参議院地方行政委員会の答弁だ。"}, {"t": 1983.6, "x": "遺留物が無いという話は、\n1969年2月25日に衆議院で出た。"}, {"t": 1988.95, "x": "連絡船の2万人は？"}, {"t": 1990.65, "x": "1969年3月25日の参議院地方行政委員会での答弁だ。"}, {"t": 1995.6666666666667, "x": "逮捕の様子と同じ拳銃の話は、\n1969年4月8日の参議院法務委員会から引いた。"}, {"t": 2002.0, "x": "午前5時8分と代々木署の3人は、\n1972年5月18日の衆議院での説明による。"}, {"t": 2008.35, "x": "保護観察の話は、1969年4月8日と\n10日と22日の国会。"}, {"t": 2013.7333333333333, "x": "弁護人の話は、1978年5月と\n6月の衆議院法務委員会。"}, {"t": 2018.85, "x": "1987年の高裁判決は、\n同じ年の6月4日の参議院決算委員会での発言。"}, {"t": 2025.15, "x": "確定の年と執行の日は、当時の著書の紹介と\n報道、翌年の国会の発言を照らした。"}, {"t": 2031.1333333333334, "x": "話さなかったことは？"}, {"t": 2032.6666666666667, "x": "亡くなった4人の方の名前と年齢。最期の様子。"}, {"t": 2035.9166666666667, "x": "一審の判決の日付と、1990年の判決の月日。"}, {"t": 2040.1666666666667, "x": "この二つは一次資料で確かめられなかった。"}, {"t": 2042.9166666666667, "x": "手記の題名も言っていない。"}, {"t": 2044.5333333333333, "x": "拳銃を持って各地をどう移ったのかも、\n確かな記録が無いので話していない。"}, {"t": 2049.7166666666667, "x": "ねえ、最初の拳銃の話に戻っていい？"}, {"t": 2052.4166666666665, "x": "いいぞ。"}, {"t": 2053.0666666666666, "x": "あの拳銃が盗まれた日、少年は\nもう保護観察の途中だったのよね。"}, {"t": 2057.45, "x": "そうだ。最後に観察所へ来たのは、その2か月前だ。"}, {"t": 2061.15, "x": "前にも、同じ基地に入っていた。"}, {"t": 2063.1833333333334, "x": "名前も調べの枠に入っていた。"}, {"t": 2065.4166666666665, "x": "あとから見れば、拳銃に行き着く道はいくつもあった。"}, {"t": 2068.5333333333333, "x": "だがどの道も千駄ケ谷の夜までつながらなかった。"}, {"t": 2071.633333333333, "x": "つないだのは警報器だったのね。"}, {"t": 2073.6666666666665, "x": "警報器と弾の鑑定だ。"}, {"t": 2075.383333333333, "x": "その間に東京と京都と函館と\n名古屋で4人の方が亡くなっている。"}, {"t": 2079.7166666666667, "x": "……4人の方の家族は、そのあとも\nずっと続いていくのよね。"}, {"t": 2083.3333333333335, "x": "続いていく。判決に残った言葉が、それを示している。"}, {"t": 2087.0333333333333, "x": "受け取らないことを供養とした両親がいた。"}, {"t": 2089.483333333333, "x": "どんな理由があっても許せないと言った母がいた。"}, {"t": 2092.383333333333, "x": "裁判は21年。そのあいだもずっと。"}, {"t": 2095.05, "x": "そうだ。1968年10月8日に盗まれた\n22口径の拳銃は1丁だった。"}, {"t": 2100.7, "x": "その1丁が4つの街と4つの家の時間を変えた。"}, {"t": 2103.8333333333335, "x": "今回は、その1丁がたどった経過を\n記録の順に読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
