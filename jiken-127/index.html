<script>
const D={"name": "127", "file": "127_編集用", "dur": 2069.1333125, "segs": [], "subs": [{"t": 0.0, "x": "27秒。"}, {"t": 0.95, "x": "これは、ある1本の電話の長さだ。"}, {"t": 3.3333333333333335, "x": "電話の長さ？"}, {"t": 4.5, "x": "男の声で、金額と時間だけを言って切れた。"}, {"t": 7.483333333333333, "x": "その声は録音され、のちに警察が公開した。"}, {"t": 10.566666666666666, "x": "誰でも電話をかければ聞けるようにした。"}, {"t": 13.0, "x": "声を、みんなに聞かせたの？"}, {"t": 14.883333333333333, "x": "そうだ。聞き覚えのある人を探すためだ。"}, {"t": 17.45, "x": "だが声の主は見つからなかった。"}, {"t": 19.55, "x": "そして15年がたち、時効を迎えた。"}, {"t": 22.166666666666668, "x": "15年……。"}, {"t": 23.033333333333335, "x": "犯人は、一度も姿を見せていない。"}, {"t": 25.433333333333334, "x": "金も、受け取りに来ていない。"}, {"t": 27.266666666666666, "x": "手もとに残ったのは、電話の時刻と声だけだった。"}, {"t": 30.45, "x": "1987年9月。群馬県高崎市。"}, {"t": 33.86666666666667, "x": "5歳の男の子が、家の近くから姿を消した。"}, {"t": 37.06666666666667, "x": "家には身代金を求める電話が掛かってくる。"}, {"t": 39.85, "x": "はじめの要求は2000万円だった。"}, {"t": 42.166666666666664, "x": "誘拐事件なのね。"}, {"t": 43.61666666666667, "x": "今回は功明ちゃん誘拐事件を扱う。"}, {"t": 46.15, "x": "主役は電話だ。"}, {"t": 47.28333333333333, "x": "何回鳴ったのか。どこから掛かったのか。"}, {"t": 49.86666666666667, "x": "なぜ掛けた場所が分からなかったのか。"}, {"t": 52.06666666666667, "x": "そして、残った声はどう使われたのか。"}, {"t": 54.733333333333334, "x": "電話の線を追っていくのね。"}, {"t": 56.483333333333334, "x": "そうだ。先に決めごとを言っておく。"}, {"t": 58.666666666666664, "x": "亡くなった男の子の様子は話さない。"}, {"t": 61.016666666666666, "x": "ご家族の名前や暮らしにも触れない。"}, {"t": 63.166666666666664, "x": "犯人は分かっていない。"}, {"t": 64.56666666666666, "x": "だから、どんな人だったかの話もしない。"}, {"t": 67.38333333333334, "x": "わかったわ。記録に残っていることだけ、ね。"}, {"t": 70.9, "x": "1987年9月14日、月曜日。"}, {"t": 74.2, "x": "男の子は幼稚園から家に帰っていた。"}, {"t": 76.61666666666666, "x": "そのあと、家の近くの神社へ遊びに出た。"}, {"t": 79.33333333333333, "x": "地元の新聞は、午後4時50分ごろと伝えている。"}, {"t": 82.71666666666667, "x": "家のすぐ近くなのね。"}, {"t": 84.33333333333333, "x": "歩いてすぐの、小さな神社だ。"}, {"t": 86.35, "x": "子どもがひとりで遊びに行ける距離だった。"}, {"t": 88.85, "x": "それで、帰ってこなかった。"}, {"t": 90.75, "x": "家族が探しても見つからない。"}, {"t": 92.63333333333334, "x": "午後6時半ごろ、警察に届けを出した。"}, {"t": 95.5, "x": "まだ夕方の6時半よね。"}, {"t": 97.35, "x": "9月の半ばだから、もう暗くなりかけている。"}, {"t": 100.18333333333334, "x": "この時点では、迷子かもしれない。"}, {"t": 102.26666666666667, "x": "どこかでけがをしたのかもしれない。"}, {"t": 104.25, "x": "誰もが、まず事故を心配する時間だ。"}, {"t": 106.88333333333334, "x": "誘拐だとは、まだ思わないわよね。"}, {"t": 109.23333333333333, "x": "そうだ。だが十数分後に電話が鳴る。"}, {"t": 111.6, "x": "ここから、この事件は電話の事件になる。"}, {"t": 114.3, "x": "電話の事件……。"}, {"t": 115.38333333333334, "x": "一つ覚えておいてほしい日付がある。"}, {"t": 117.55, "x": "翌日の9月15日は、敬老の日だった。"}, {"t": 120.48333333333333, "x": "当時は日付が決まった祝日で、銀行は休みだ。"}, {"t": 123.88333333333334, "x": "それが関係あるの？"}, {"t": 125.3, "x": "身代金の話になると、大きく関係してくる。"}, {"t": 128.5, "x": "あとで、もう一度この日付に戻ってくる。"}, {"t": 131.68333333333334, "x": "午後6時40分ごろ、家の電話が鳴った。"}, {"t": 134.5, "x": "受話器の向こうは、男の声だった。"}, {"t": 136.76666666666668, "x": "子どもを預かっている、という。"}, {"t": 138.53333333333333, "x": "そして、2000万円を要求した。"}, {"t": 140.86666666666667, "x": "届けを出して、すぐなのね。"}, {"t": 142.85, "x": "届けから、十数分あとだ。"}, {"t": 144.8, "x": "ここで迷子の捜索は、誘拐の捜査に変わる。"}, {"t": 147.85, "x": "警察は何をするの？"}, {"t": 149.4, "x": "まず、次の電話に備える。"}, {"t": 151.21666666666667, "x": "誘拐なら、犯人は必ずまた掛けてくる。"}, {"t": 154.0, "x": "金を受け取るには、場所と時間を伝えるしかない。"}, {"t": 157.05, "x": "だから電話を待つのね。"}, {"t": 158.63333333333333, "x": "そうだ。そして次の電話で居場所を探る。"}, {"t": 161.18333333333334, "x": "掛けてきた場所を突き止める。逆探知だ。"}, {"t": 163.9, "x": "ドラマで見るやつね。"}, {"t": 165.0, "x": "話を引き延ばして、っていう。"}, {"t": 167.06666666666666, "x": "それだ。だが1987年の逆探知は、ドラマとは違う。"}, {"t": 171.33333333333334, "x": "画面に番号がすぐ出るような仕組みではない。"}, {"t": 174.0, "x": "じゃあ、どうやって探すの？"}, {"t": 175.73333333333332, "x": "それを当時の国会の記録で確かめておく。"}, {"t": 178.41666666666666, "x": "事件の2年前、電話会社の部長が説明している。"}, {"t": 181.83333333333334, "x": "電話会社って、NTT？"}, {"t": 183.78333333333333, "x": "そうだ。電電公社が民営化したばかりのNTTだ。"}, {"t": 187.1, "x": "1985年9月6日、衆議院の法務委員会。"}, {"t": 190.81666666666666, "x": "参考人として呼ばれた部長が、やり方を話した。"}, {"t": 194.66666666666666, "x": "原文をそのまま読む。"}, {"t": 196.08333333333334, "x": "「逆探知のやり方といたしましては、電話機が\n収容されております交換機の着信側の端子から」"}, {"t": 202.0, "x": "「順次接続されているルートを人手に\nよりまして逆に追っかけていく、"}, {"t": 205.73333333333332, "x": "探索をしていくという方法によっております」"}, {"t": 208.51666666666668, "x": "人手で、逆に追っかけていく？"}, {"t": 210.6, "x": "電話は、局にある交換機という機械でつながる。"}, {"t": 213.58333333333334, "x": "掛けた人の線と、受けた人の線を結ぶ機械だ。"}, {"t": 216.85, "x": "受けた側の端子から、つながっている\n道を一つずつ順にたどる。"}, {"t": 220.7, "x": "それを人が手でやる、という説明だ。"}, {"t": 223.13333333333333, "x": "機械が自動で出してくれるんじゃないのね。"}, {"t": 225.56666666666666, "x": "部長はこうも言っている。"}, {"t": 226.96666666666667, "x": "「同じ市内だけではなく遠くから何段階もの交換機を\n経由して着信するものもございます」"}, {"t": 232.4, "x": "「逆探知をやります場合にも非常に\n時間もかかり、難しい状況にございます」"}, {"t": 237.16666666666666, "x": "時間がかかる……。"}, {"t": 238.33333333333334, "x": "交換機をいくつもまたげば、\nそのぶんたどる道も増える。"}, {"t": 241.6, "x": "途中で電話が切れれば、つながりそのものが消える。"}, {"t": 244.65, "x": "切られたら、そこで終わり？"}, {"t": 246.38333333333333, "x": "たどっている途中の道が無くなるからな。"}, {"t": 248.76666666666668, "x": "だから話を引き延ばせ、ということになる。"}, {"t": 251.55, "x": "1分とか2分で切られたら、間に合わないかも。"}, {"t": 254.5, "x": "そういう仕組みの時代だった、ということだ。"}, {"t": 257.03333333333336, "x": "これはこの事件の2年前の、国会での説明だ。"}, {"t": 260.2, "x": "事件の夜の高崎で何分かかったかは、記録に無い。"}, {"t": 263.6333333333333, "x": "だから、ここで言えるのは仕組みまでだ。"}, {"t": 266.01666666666665, "x": "うん。仕組みの話として聞いておくわ。"}, {"t": 268.98333333333335, "x": "そもそも、電話会社は勝手に探していいの？"}, {"t": 271.9166666666667, "x": "いい質問だ。勝手にはできない。"}, {"t": 273.98333333333335, "x": "電話には通信の秘密がある。"}, {"t": 275.85, "x": "誰が誰に掛けたかも、守られるべき秘密だ。"}, {"t": 278.93333333333334, "x": "じゃあ逆探知は、秘密を破ることになるの？"}, {"t": 281.73333333333335, "x": "だから、やってよい場合が決められていた。"}, {"t": 284.1666666666667, "x": "1985年の部長は、その根拠も話している。"}, {"t": 287.8, "x": "「かつて昭和三十八年十二月に内閣法制局から\n御見解をいただいておりますが」"}, {"t": 292.96666666666664, "x": "「脅迫の罪を現に犯している者があって、\nかつ被害者の要請がある場合」"}, {"t": 297.46666666666664, "x": "昭和三十八年って、1963年よね。"}, {"t": 301.0833333333333, "x": "そうだ。東京で吉展ちゃん事件が起きた年だ。"}, {"t": 304.1, "x": "その年の終わりに、\n国の法律の番人が考え方を示した。"}, {"t": 308.0, "x": "それがずっと、逆探知の土台になっていた。"}, {"t": 310.8333333333333, "x": "1987年まで、24年も同じ考え方なのね。"}, {"t": 315.1, "x": "1991年の参議院では、\nNTTの別の部長がまとめている。"}, {"t": 319.7, "x": "「一つは電話を利用して現に\n脅迫の罪が行われていること」"}, {"t": 323.45, "x": "「二つ目が捜査機関からの要請があること、\n三つ目が被害者の同意があること」"}, {"t": 328.1333333333333, "x": "「本件は昭和三十八年の内閣法制局の見解を\n根拠といたして実施しているものでございます」"}, {"t": 334.21666666666664, "x": "三つそろえば、探してもいいってことね。"}, {"t": 336.85, "x": "そうだ。身代金を求める電話は、まさに脅迫の最中だ。"}, {"t": 340.78333333333336, "x": "家族が頼み、警察が求めれば、条件はそろう。"}, {"t": 344.2, "x": "でも、そろえる手続きにも時間がかかりそう。"}, {"t": 347.0833333333333, "x": "最初の電話が来た時点では、何の準備も無い。"}, {"t": 350.0, "x": "届けからわずか十数分で、犯人は掛けてきた。"}, {"t": 353.1333333333333, "x": "準備が整う前の電話だった、ということになる。"}, {"t": 356.76666666666665, "x": "二度目の電話は、午後7時47分ごろだ。"}, {"t": 359.73333333333335, "x": "最初から、およそ1時間後になる。"}, {"t": 362.03333333333336, "x": "男は、また2000万円を求めた。"}, {"t": 364.48333333333335, "x": "同じ金額ね。"}, {"t": 365.75, "x": "このとき、家の側から一つの事情が伝えられた。"}, {"t": 368.9, "x": "明日は祝日で、銀行が休みだということだ。"}, {"t": 372.05, "x": "さっきの敬老の日ね。"}, {"t": 373.6333333333333, "x": "そうだ。2000万円を、すぐに\n現金でそろえるのは難しい。"}, {"t": 377.26666666666665, "x": "銀行が開くのは、早くても16日の朝になる。"}, {"t": 380.7, "x": "犯人は、祝日のことを知らなかったの？"}, {"t": 383.5, "x": "そこは、資料によって書き方が違う。"}, {"t": 385.95, "x": "犯人が何を考えていたかは、誰にも分からない。"}, {"t": 389.01666666666665, "x": "だからここでは、言われたことだけを置いておく。"}, {"t": 391.75, "x": "逆探知は、この電話には？"}, {"t": 393.71666666666664, "x": "間に合わなかった、と伝える資料がある。"}, {"t": 396.06666666666666, "x": "通話が短かった、と書く資料もある。"}, {"t": 398.5, "x": "どちらにしても、掛けた場所はつかめていない。"}, {"t": 401.3, "x": "2回とも、だめだったのね。"}, {"t": 403.23333333333335, "x": "ただ、一つだけ分かったことがあるとされる。"}, {"t": 405.8833333333333, "x": "電話の向こうで、車の通る音がしていたという。"}, {"t": 408.9, "x": "外から掛けてるってこと？"}, {"t": 410.6666666666667, "x": "公衆電話から掛けた可能性が言われた。"}, {"t": 413.1333333333333, "x": "家の電話なら、探し当てれば住所に着く。"}, {"t": 415.76666666666665, "x": "だが公衆電話なら、着いた先は電話ボックスだ。"}, {"t": 418.93333333333334, "x": "そこにはもう、誰もいない……。"}, {"t": 420.71666666666664, "x": "そういうことになる。"}, {"t": 422.53333333333336, "x": "三度目は、午後8時3分ごろだ。"}, {"t": 424.8333333333333, "x": "二度目から、わずか16分後になる。"}, {"t": 427.31666666666666, "x": "間が短くなってる。"}, {"t": 428.93333333333334, "x": "この電話で、男は男の子を電話口に出させた。"}, {"t": 432.21666666666664, "x": "子どもの声が聞こえたの？"}, {"t": 433.9166666666667, "x": "そうだ。家族は、その声を聞いている。"}, {"t": 436.3333333333333, "x": "何を話したかは、この回では言わない。"}, {"t": 438.8666666666667, "x": "……うん。それでいいと思う。"}, {"t": 440.3666666666667, "x": "通話は、およそ2分だったと伝えられている。"}, {"t": 443.06666666666666, "x": "4回の電話の中で、一番長い。"}, {"t": 445.53333333333336, "x": "2分あれば、逆探知は？"}, {"t": 447.3666666666667, "x": "この電話は、ある程度までたどれた。"}, {"t": 449.53333333333336, "x": "高崎市の西のほうを受け持つ電話局の管内だった。"}, {"t": 452.96666666666664, "x": "管内？"}, {"t": 453.75, "x": "一つの電話局が受け持つ、範囲のことだ。"}, {"t": 456.55, "x": "そこまでは分かった。だが一つの点にはならない。"}, {"t": 459.6333333333333, "x": "範囲までで、場所までは届かなかったのね。"}, {"t": 462.3833333333333, "x": "そうだ。管内には住宅も道も、電話ボックスもある。"}, {"t": 465.81666666666666, "x": "のちの報道では、\n管内の電話ボックスは65台とされた。"}, {"t": 469.6666666666667, "x": "65台も……。"}, {"t": 470.8666666666667, "x": "犯人が使ったのは、そのどれかかもしれない。"}, {"t": 473.6666666666667, "x": "だが、どれなのかは決まらなかった。"}, {"t": 475.8333333333333, "x": "ここが、この事件の一つ目の分かれ目だ。"}, {"t": 478.46666666666664, "x": "もし一つの電話ボックスまで行けていたら。"}, {"t": 481.06666666666666, "x": "そこに指紋が残ってたかも、とか？"}, {"t": 483.51666666666665, "x": "そう考えたくなる。だがそれは、もしもの話だ。"}, {"t": 486.7, "x": "この回では、もしもの話はここまでにしておく。"}, {"t": 490.3, "x": "三度目のあと、夜のあいだも電話は鳴った。"}, {"t": 492.9166666666667, "x": "だが受話器を取る前に切れる。"}, {"t": 494.6166666666667, "x": "ベルが1回から3回鳴って、それで終わる。"}, {"t": 497.43333333333334, "x": "無言電話みたいなもの？"}, {"t": 499.03333333333336, "x": "声すら出ない。つながる前に切れている。"}, {"t": 501.3833333333333, "x": "翌日の未明までに、何度も続いた。"}, {"t": 504.03333333333336, "x": "それも犯人なの？"}, {"t": 505.4, "x": "当時は、そう疑うしかない。"}, {"t": 507.26666666666665, "x": "鳴るたびに、家の人も警察も身構えたはずだ。"}, {"t": 510.3, "x": "だがのちに、捜査本部は確かめている。"}, {"t": 512.85, "x": "未明に続いた13回の呼び出しは、\n事件と関係が無かった。"}, {"t": 516.8666666666667, "x": "関係なかったの？"}, {"t": 518.2166666666667, "x": "そう報じられている。"}, {"t": 519.3, "x": "何が原因だったかは言われていない。"}, {"t": 521.5666666666667, "x": "でも、その夜には分からないわよね。"}, {"t": 523.9, "x": "分からない。1回ごとに逆探知の準備をする。"}, {"t": 526.7833333333333, "x": "鳴るのに、何も聞こえない。"}, {"t": 528.5333333333333, "x": "誘拐された子の家で、ひと晩それが続いた。"}, {"t": 531.5333333333333, "x": "……眠れないわね。"}, {"t": 532.6333333333333, "x": "この夜のうちに、県警は特別捜査本部を作った。"}, {"t": 536.0, "x": "場所は高崎署だ。"}, {"t": 537.3833333333333, "x": "そして、もう一つ別の動きも始まっていた。"}, {"t": 540.4166666666666, "x": "別の動き？"}, {"t": 541.5, "x": "報道の側の動きだ。"}, {"t": 543.5833333333334, "x": "誘拐の最中には、新聞もテレビも報じるのを待つ。"}, {"t": 546.8666666666667, "x": "警察と報道各社が、報道協定を結ぶからだ。"}, {"t": 550.2833333333333, "x": "子どもの命を守るため、よね。"}, {"t": 552.5333333333333, "x": "そうだ。報じられれば、犯人が追い詰められる。"}, {"t": 555.4, "x": "追い詰められた犯人が、\n子どもに何をするか分からない。"}, {"t": 558.6166666666667, "x": "だから見つかるまでは、書かずに待つ。"}, {"t": 560.9833333333333, "x": "この事件でも結んだの？"}, {"t": 562.6833333333333, "x": "結んだ。そして新聞協会報が、\n2017年にこう伝えている。"}, {"t": 567.0333333333333, "x": "群馬県で誘拐の報道協定が\n結ばれたのは、この事件だけだ。"}, {"t": 571.1333333333333, "x": "群馬で、ただ一度だけ？"}, {"t": 572.9333333333333, "x": "そうだ。身代金の誘拐は、それほど多くは起きない。"}, {"t": 576.2833333333333, "x": "記者にとっても、警察にとっても初めての経験だった。"}, {"t": 579.9333333333333, "x": "書きたいのに書けない、って大変そう。"}, {"t": 582.2666666666667, "x": "記者と県警の間には、緊張があったという。"}, {"t": 585.1, "x": "それでも、大きな違反は無かったと伝えられている。"}, {"t": 588.0833333333334, "x": "当時の県警の広報官は、のちにこう振り返った。"}, {"t": 591.2666666666667, "x": "「日頃から記者と緊張感のある\n信頼関係を培っておくことが重要だ」"}, {"t": 595.8, "x": "緊張感のある信頼関係……。"}, {"t": 597.8, "x": "仲良くするだけでも、疑い合うだけでもない。"}, {"t": 600.55, "x": "いざというとき、相手の約束を信じられるかどうか。"}, {"t": 603.65, "x": "それは事件が起きてから\n作れるものではない、ということだ。"}, {"t": 607.1, "x": "協定の決まりそのものは、もっと前からあったのよね。"}, {"t": 610.4, "x": "あった。その成り立ちは前に\n扱ったので、ここでは省く。"}, {"t": 613.95, "x": "この回で見たいのは、\n群馬の記者たちが待った時間だ。"}, {"t": 617.3166666666667, "x": "どれくらい待ったの？"}, {"t": 618.6333333333333, "x": "協定は、子どもが見つかるまで続く。"}, {"t": 620.9833333333333, "x": "この事件では、2日近くになった。"}, {"t": 623.3833333333333, "x": "記者は事件を知っている。だが一行も書けない。"}, {"t": 626.2, "x": "書けば、子どもの命を危うくするかもしれない。"}, {"t": 629.0, "x": "書かなければ、読者は何も知らないままだ。"}, {"t": 631.8166666666667, "x": "その間、ずっと黙ってたのね。"}, {"t": 634.05, "x": "黙って取材を続けた。"}, {"t": 635.5, "x": "見つかった瞬間に書くためだ。"}, {"t": 638.1666666666666, "x": "9月15日。敬老の日。"}, {"t": 640.0833333333334, "x": "この日、犯人からの電話は無かった。"}, {"t": 642.6166666666667, "x": "一度も？"}, {"t": 643.4666666666667, "x": "一度もだ。前の晩は1時間に何本も来ていたのにな。"}, {"t": 647.05, "x": "かえって怖いわね。"}, {"t": 648.3333333333334, "x": "電話が鳴らなければ、逆探知も使えない。"}, {"t": 651.0, "x": "犯人に近づく手がかりは、電話しかなかった。"}, {"t": 654.05, "x": "警察は、ただ待つしかないの？"}, {"t": 656.1833333333333, "x": "待つだけではない。外では捜索が続いている。"}, {"t": 659.0166666666667, "x": "県内の広い範囲で、夜の見回りもしたと伝えられる。"}, {"t": 662.4333333333333, "x": "アパートや旅館なども、片端から当たったという。"}, {"t": 665.45, "x": "でも、表立っては動けないのよね。"}, {"t": 667.85, "x": "そうだ。報道協定の最中だ。"}, {"t": 670.0, "x": "町の人の多くは、事件が起きていることを知らない。"}, {"t": 673.2333333333333, "x": "知らないから、目撃した人も名乗り出られない。"}, {"t": 676.2833333333333, "x": "そこが、協定のもう一つの面だ。"}, {"t": 678.5666666666667, "x": "子どもを守るために、町に知らせない。"}, {"t": 680.9333333333333, "x": "知らせないから、町の目は使えない。"}, {"t": 683.3333333333334, "x": "どっちがいいって、簡単には言えないわね。"}, {"t": 685.9, "x": "言えない。この回でも決めない。"}, {"t": 687.7333333333333, "x": "そして、この同じ15日のことだ。"}, {"t": 690.1, "x": "同じ群馬県の尾島町で、\n8歳の女の子が行方不明になった。"}, {"t": 694.3333333333334, "x": "同じ日に？"}, {"t": 695.2666666666667, "x": "これは別の事件だ。こちらものちに時効を迎えている。"}, {"t": 698.5, "x": "この回では、それ以上は扱わない。"}, {"t": 700.8666666666667, "x": "同じ県で同じ月に、二つ……。"}, {"t": 703.15, "x": "2017年の地元の連載は、\n二つの事件を並べて伝えている。"}, {"t": 708.0666666666667, "x": "9月16日、水曜日。"}, {"t": 709.8333333333334, "x": "午前7時50分ごろ。"}, {"t": 711.5333333333333, "x": "丸一日以上あいて、電話が鳴った。"}, {"t": 714.0166666666667, "x": "4回目ね。"}, {"t": 715.0833333333334, "x": "受話器を取ったのは、男の子の父親だ。"}, {"t": 717.7166666666667, "x": "男は一方的に要求を告げた。"}, {"t": 719.85, "x": "今日の夕方6時までに、1000万円を用意しろ。"}, {"t": 723.0, "x": "1000万円？　最初は2000万円だったわよね。"}, {"t": 726.0, "x": "そうだ。要求は半分になっていた。"}, {"t": 728.4166666666666, "x": "どうして下げたの？"}, {"t": 729.7, "x": "理由は分からない。犯人が言っていないからだ。"}, {"t": 732.4, "x": "しかも、受け渡しの方法は言わなかった。"}, {"t": 735.0833333333334, "x": "場所も時間も言わずに、用意しろだけ？"}, {"t": 737.6, "x": "そうだ。また電話する、という形で終わった。"}, {"t": 740.4333333333333, "x": "通話は27秒だった。"}, {"t": 742.2333333333333, "x": "最初に出てきた、27秒……。"}, {"t": 744.4333333333333, "x": "この回の始まりの電話が、これだ。"}, {"t": 746.8, "x": "逆探知は？"}, {"t": 747.85, "x": "できなかった。"}, {"t": 748.85, "x": "前の晩の態勢が、この朝には\n解かれていたと報じられた。"}, {"t": 752.5, "x": "えっ、解かれてたの？"}, {"t": 753.9666666666667, "x": "当時の新聞がそう伝え、県警は詳しく言わなかった。"}, {"t": 757.35, "x": "だから、ここは報道として置いておく。"}, {"t": 759.6166666666667, "x": "たとえ態勢があっても、27秒で\nたどれたかは分からない。"}, {"t": 763.1666666666666, "x": "1985年の説明を思い出してほしい。"}, {"t": 766.3333333333334, "x": "人の手で、交換機を一つずつ……。"}, {"t": 768.7166666666667, "x": "そうだ。27秒は、その仕組みにはあまりに短い。"}, {"t": 772.1, "x": "そしてこの声が、のちに公開される録音になる。"}, {"t": 775.8, "x": "ちょっと待って。電話の順番がこんがらがってきた。"}, {"t": 778.9, "x": "では、ここで4本を並べておこう。"}, {"t": 781.0333333333333, "x": "時刻は、どれも当時の報道によるものだ。"}, {"t": 783.6833333333333, "x": "1本目。14日の午後6時40分ごろ。2000万円。"}, {"t": 787.3833333333333, "x": "2本目。午後7時47分ごろ。また2000万円。"}, {"t": 790.9, "x": "ここまでの間は、およそ1時間だ。"}, {"t": 793.2333333333333, "x": "3本目。午後8時3分ごろ。"}, {"t": 795.2666666666667, "x": "男の子が電話口に出た。"}, {"t": 797.1166666666667, "x": "2本目から、16分しかたっていない。"}, {"t": 799.75, "x": "最初の3本は、ぜんぶ同じ晩なのね。"}, {"t": 802.4333333333333, "x": "そうだ。1時間半ほどの間に3本だ。"}, {"t": 805.2, "x": "そこから、犯人の電話はぴたりと止まる。"}, {"t": 807.7833333333333, "x": "4本目は、16日の午前7時50分ごろ。1000万円。"}, {"t": 811.9666666666667, "x": "3本目から、どれくらいあいてるの？"}, {"t": 814.25, "x": "14日の夜8時から16日の朝8時前まで。"}, {"t": 817.5666666666667, "x": "およそ36時間だ。"}, {"t": 819.3166666666667, "x": "36時間も、何も無かったの？"}, {"t": 821.8666666666667, "x": "犯人からの声は、何も無かった。"}, {"t": 824.1833333333333, "x": "鳴ってすぐ切れるベルはあったが、\nそれも関係が無かった。"}, {"t": 827.6, "x": "1時間半で3本、それから36時間あいて、27秒。"}, {"t": 831.8833333333333, "x": "並べると、形がはっきりするだろう。"}, {"t": 834.25, "x": "最初の晩は急いでいて、そのあと黙った。"}, {"t": 836.9333333333333, "x": "そして最後は短く、金額を半分にして切った。"}, {"t": 840.3333333333334, "x": "その間に、何があったんだろう。"}, {"t": 842.5, "x": "それを知っているのは、掛けた本人だけだ。"}, {"t": 845.05, "x": "この回では、その間を想像で埋めない。"}, {"t": 847.55, "x": "並べた時刻が、記録に残ったすべてだ。"}, {"t": 850.9, "x": "4回目の電話から、およそ4時間半後。"}, {"t": 853.5333333333333, "x": "9月16日の昼ごろだ。"}, {"t": 855.4166666666666, "x": "男の子は、高崎市内で見つかった。"}, {"t": 858.0, "x": "すでに、亡くなっていた。"}, {"t": 859.4166666666666, "x": "……。"}, {"t": 860.35, "x": "いなくなってから、44時間後だった。"}, {"t": 863.05, "x": "夕方6時まで、って言ってたのに。"}, {"t": 865.3166666666667, "x": "そうだ。期限の前に、見つかったことになる。"}, {"t": 868.1333333333333, "x": "どういう状況だったかは、この回では話さない。"}, {"t": 870.95, "x": "ご家族は、そっとしておいてほしいと考えていた。"}, {"t": 873.95, "x": "30年目の2017年の取材について、\n新聞協会報がそう伝えている。"}, {"t": 878.9666666666667, "x": "うん。それは守りたい。"}, {"t": 880.5, "x": "見つかったことで、報道協定は役目を終えた。"}, {"t": 883.3333333333334, "x": "翌17日の朝刊で、事件は一斉に報じられる。"}, {"t": 886.85, "x": "町の人は、そこで初めて知ったのね。"}, {"t": 889.5333333333333, "x": "そうだ。誘拐の事件から、\n未解決の事件に変わった瞬間だ。"}, {"t": 893.6666666666666, "x": "犯人は金を受け取っていない。"}, {"t": 895.5, "x": "姿も見せていない。"}, {"t": 896.85, "x": "残ったのは、4回の電話だけだった。"}, {"t": 899.4333333333333, "x": "電話と、声……。"}, {"t": 900.6333333333333, "x": "ここからの15年は、その声を追う年月になる。"}, {"t": 904.2833333333333, "x": "事件からおよそ1週間後。9月の下旬だ。"}, {"t": 907.1333333333333, "x": "県警は4回目の電話の録音を公開した。"}, {"t": 909.9166666666666, "x": "朝日新聞は9月23日付で、\n脅迫電話の声の公開を伝えている。"}, {"t": 914.7833333333333, "x": "どうやって公開したの？"}, {"t": 916.4, "x": "雑音を取り除くなどの手を入れた。"}, {"t": 918.4833333333333, "x": "そして、電話をかければ聞けるようにした。"}, {"t": 920.9833333333333, "x": "テレホンサービスという仕組みだ。"}, {"t": 922.9, "x": "電話をかけると、録音が流れるのね。"}, {"t": 925.4833333333333, "x": "そうだ。インターネットが無い時代のやり方だ。"}, {"t": 928.2, "x": "誰でも、家の電話から犯人の声を聞ける。"}, {"t": 931.1166666666667, "x": "なんだか、ぞっとするわね。"}, {"t": 932.9333333333333, "x": "だが、それが狙いだ。"}, {"t": 934.4333333333333, "x": "この声を毎日聞いている人が、どこかにいるはずだ。"}, {"t": 937.5833333333334, "x": "家族か、職場の人か、近所の人か。"}, {"t": 940.4, "x": "その誰かに、気づいてもらうためだ。"}, {"t": 942.7, "x": "声を公開するのは、これが初めて？"}, {"t": 945.15, "x": "初めてではない。1963年の吉展ちゃん事件でも、\n声は公開された。"}, {"t": 950.3666666666667, "x": "あのときも、電話の声が最大の手がかりだった。"}, {"t": 953.45, "x": "同じやり方を、24年後にもう一度したのね。"}, {"t": 956.6166666666667, "x": "そうだ。ただ、24年の間に変わったことがある。"}, {"t": 959.8333333333334, "x": "テレビもラジオも、家の電話も増えた。"}, {"t": 962.1, "x": "声を届けられる人の数は、ずっと多くなっていた。"}, {"t": 965.3333333333334, "x": "それなら、見つかりそうなのに。"}, {"t": 967.35, "x": "届く人が多いほど、寄せられる話も多くなる。"}, {"t": 970.3666666666667, "x": "似ている、という声は、いくらでも集まる。"}, {"t": 973.0, "x": "本物を一つ選ぶのが、大変になるのね。"}, {"t": 975.9333333333333, "x": "そういう面もある。"}, {"t": 977.0333333333333, "x": "それでも県警は、声を外に出すほうを選んだ。"}, {"t": 979.9, "x": "持っている手がかりの中で、一番大きかったからだ。"}, {"t": 983.1666666666666, "x": "しまっておいても、誰も気づいてくれないものね。"}, {"t": 986.0666666666667, "x": "そうだ。声は、聞かれて初めて手がかりになる。"}, {"t": 988.9833333333333, "x": "公開は、町の人の耳を借りるということだ。"}, {"t": 991.95, "x": "協定のあいだは使えなかった、町の目と耳ね。"}, {"t": 995.0833333333334, "x": "そうだ。今度は、電話をかけてくる\n誰にでも届けようとした。"}, {"t": 999.3833333333333, "x": "結局、声からは何も分からなかったの？"}, {"t": 1002.1333333333333, "x": "時効のとき、地元の新聞は理由を三つ挙げた。"}, {"t": 1005.1833333333333, "x": "一つ目。逆探知で、発信元を突き止められなかった。"}, {"t": 1008.8333333333334, "x": "二つ目。犯人の声の録音テープの、音質が悪かった。"}, {"t": 1012.6666666666666, "x": "三つ目。物の証拠や、有力な目撃の話が少なかった。"}, {"t": 1016.9166666666666, "x": "音質が悪かった……。"}, {"t": 1018.3666666666667, "x": "1987年の録音は、カセットテープの時代だ。"}, {"t": 1022.1333333333333, "x": "電話の声は、もともと細い音で届く。"}, {"t": 1024.7333333333333, "x": "そこに、公衆電話のまわりの音も入る。"}, {"t": 1027.3833333333334, "x": "車の音とか？"}, {"t": 1028.65, "x": "そうだ。2回目の電話には、\n車の音が入っていたとされる。"}, {"t": 1032.3666666666666, "x": "雑音を除いても、元に無い音は戻らない。"}, {"t": 1035.25, "x": "聞く人が聞けば、分かるかもしれないのに。"}, {"t": 1038.0, "x": "それでも、聞き分けるには細い。"}, {"t": 1040.0, "x": "そして、27秒しかない。"}, {"t": 1042.1, "x": "短いし、音も悪い。"}, {"t": 1043.8, "x": "残った手がかりの中で、声は一番大きなものだった。"}, {"t": 1047.1333333333334, "x": "だが、一番もろいものでもあった。"}, {"t": 1049.4, "x": "一番大きくて、一番もろい……。"}, {"t": 1051.5166666666667, "x": "声は、似ている人がいくらでもいる。"}, {"t": 1053.7166666666667, "x": "指紋のように、一人に決まる物ではない。"}, {"t": 1056.2166666666667, "x": "誰かを指すことはできても、決めることは難しい。"}, {"t": 1059.35, "x": "だから、慎重にしないといけないのね。"}, {"t": 1061.9, "x": "そうだ。声が似ているだけで、人を疑ってはいけない。"}, {"t": 1065.1833333333334, "x": "これは今、この動画を見ている人にも言えることだ。"}, {"t": 1068.8, "x": "さっきの、電話局の管内の話に戻っていい？"}, {"t": 1071.9666666666667, "x": "いいぞ。"}, {"t": 1072.6166666666666, "x": "4回目の電話も、同じところから？"}, {"t": 1075.1333333333334, "x": "4回目も、同じ電話局の管内だったと伝えられている。"}, {"t": 1078.75, "x": "高崎市の北西のほうを受け持つ局だ。"}, {"t": 1081.4166666666667, "x": "じゃあ犯人は、ずっとその辺りにいたってこと？"}, {"t": 1084.2833333333333, "x": "少なくとも、電話はそこから掛けていた、とされる。"}, {"t": 1087.5, "x": "そして、電話ボックスからだと見られた。"}, {"t": 1090.0666666666666, "x": "65台の、どれか。"}, {"t": 1091.8166666666666, "x": "そうだ。警察は管内を細かく調べたはずだ。"}, {"t": 1094.8166666666666, "x": "だが、どのボックスかを一つに絞ったという話は無い。"}, {"t": 1098.2666666666667, "x": "電話ボックスって、毎日たくさんの人が使うものね。"}, {"t": 1101.8, "x": "そうだ。指紋も、何十人分も重なる。"}, {"t": 1104.6166666666666, "x": "日がたてば、そのぶん新しい手が上から触る。"}, {"t": 1107.5833333333333, "x": "時間との競争なのね。"}, {"t": 1109.3, "x": "誘拐は、いつもそうだ。"}, {"t": 1110.9, "x": "子どもを取り戻すまでの時間。"}, {"t": 1112.6833333333334, "x": "手がかりが消えるまでの時間。"}, {"t": 1114.3833333333334, "x": "その二つが、同時に進んでいく。"}, {"t": 1116.7166666666667, "x": "この事件は、両方とも間に合わなかった……。"}, {"t": 1119.4, "x": "結果だけを見れば、そう言うしかない。"}, {"t": 1121.5666666666666, "x": "だが、誰かが怠けたからだとは言わない。"}, {"t": 1124.0666666666666, "x": "仕組みも道具も、その時代のものだった。"}, {"t": 1126.6333333333334, "x": "その中で何ができたかは、\n記録だけでは決められない。"}, {"t": 1130.5333333333333, "x": "事件から半年後。1988年3月22日。"}, {"t": 1134.7, "x": "衆議院の地方行政委員会だ。"}, {"t": 1136.8166666666666, "x": "国会で、この事件の話が出たの？"}, {"t": 1139.3333333333333, "x": "出た。国会の記録を引いて、\n事件の名前が出た発言を探した。"}, {"t": 1143.55, "x": "見つかったのは、この1回だけだ。"}, {"t": 1145.8666666666666, "x": "1回だけ……。"}, {"t": 1146.9, "x": "男の子の名前で引くと、0回になる。"}, {"t": 1149.5166666666667, "x": "ある議員が、警察への信頼について質問した。"}, {"t": 1152.6166666666666, "x": "前の年の役所の調べを持ち出している。"}, {"t": 1155.1, "x": "「印象の悪い公共機関、こういうアンケート調査に\nよりますと、最も悪いのは警察署」"}, {"t": 1160.35, "x": "「昨年はついに\nワースト一位になったわけでございます」"}, {"t": 1163.4833333333333, "x": "警察署が、一番印象が悪かったの？"}, {"t": 1166.25, "x": "そういう調査結果が新聞に出た、という質問だ。"}, {"t": 1169.3666666666666, "x": "そして議員は、未解決の事件を並べた。"}, {"t": 1172.0666666666666, "x": "「国民を恐怖のどん底に陥れたグリコ・"}, {"t": 1174.5, "x": "森永事件、この三月十八日で満四年を\n経過したわけでございますが、未解決でございます」"}, {"t": 1180.5833333333333, "x": "「また、朝日新聞襲撃事件、\n高崎市幼稚園児誘拐事件も未解決のままでございます」"}, {"t": 1186.4666666666667, "x": "高崎市幼稚園児誘拐事件……。"}, {"t": 1188.6333333333334, "x": "これが国会の記録に残った、この事件の呼び方だ。"}, {"t": 1192.0166666666667, "x": "議員はこう続けた。"}, {"t": 1193.3166666666666, "x": "「こうした事件を解決することこそが、国民の警察に\n対する信頼回復の道であろうと思います」"}, {"t": 1199.45, "x": "大臣は、何て答えたの？"}, {"t": 1201.4, "x": "国家公安委員長の、梶山静六だ。"}, {"t": 1204.0, "x": "「国民が期待する未解決重要事件の解決については、\n警察として事件捜査に全力を挙げており」"}, {"t": 1210.2166666666667, "x": "「私も早期解決を図るよう\n督励しているところであります」"}, {"t": 1213.9833333333333, "x": "督励……励ましてるってこと？"}, {"t": 1216.1, "x": "上の立場から、急げと強く求める、という意味だ。"}, {"t": 1219.9833333333333, "x": "解決しろ、急げ、っていう話なのね。"}, {"t": 1222.7833333333333, "x": "それだけではない。同じ質問には、もう半分がある。"}, {"t": 1226.0666666666666, "x": "議員は未解決の事件を並べたすぐあとに、こう続けた。"}, {"t": 1229.5666666666666, "x": "「また、ここ数年冤罪事件が相次いで\n起きているわけでございます」"}, {"t": 1233.5166666666667, "x": "冤罪……無実の人が罪を着せられること、よね。"}, {"t": 1236.8333333333333, "x": "そうだ。議員は、別の事件で\n冤罪が明らかになった例を挙げた。"}, {"t": 1240.75, "x": "そして、原因をこう指摘している。"}, {"t": 1242.9833333333333, "x": "「捜査の上での偏重と予断による\n思い込みが冤罪を生む土壌であることは"}, {"t": 1247.0, "x": "事件のたびに指摘されているのに」"}, {"t": 1248.9333333333334, "x": "「この種の事件が繰り返されるのは\n一体どういうことなのか」"}, {"t": 1252.4, "x": "未解決も困るし、冤罪も困る。"}, {"t": 1254.8833333333334, "x": "そうだ。一つの質問の中に、その両方が入っている。"}, {"t": 1258.5333333333333, "x": "犯人を早く見つけろ。だが、思い込みで決めるな。"}, {"t": 1261.9, "x": "それって、すごく難しい注文ね。"}, {"t": 1264.3666666666666, "x": "難しい。だが、どちらも外せない。"}, {"t": 1266.7166666666667, "x": "急いで誰かを捕まえても、違う人なら何も解決しない。"}, {"t": 1270.45, "x": "本当の犯人は、そのまま外にいることになる。"}, {"t": 1273.5666666666666, "x": "しかも、無実の人の人生が壊れる。"}, {"t": 1276.2333333333333, "x": "大臣の答えにも、その両方が入っていた。"}, {"t": 1279.0833333333333, "x": "「無罪事件等の裁判結果については\nこれを真剣に受けとめ、一層的確、"}, {"t": 1283.5666666666666, "x": "適正な捜査を推進していくべきものと考えております」"}, {"t": 1287.2, "x": "解決を急ぐのと、正しく調べるのと。"}, {"t": 1289.9666666666667, "x": "1988年の春の国会で、この事件は\nその真ん中に置かれていた。"}, {"t": 1294.85, "x": "この事件では、最後まで誰も起訴されていない。"}, {"t": 1297.7166666666667, "x": "時効の前に送られた書類も、\n被疑者不詳のままだった。"}, {"t": 1301.2833333333333, "x": "未解決のまま、でも誰かを裁いてはいないのね。"}, {"t": 1304.3833333333334, "x": "そういうことだ。それも、記録が\n示していることの一つだ。"}, {"t": 1308.6666666666667, "x": "その3週間前にも、梶山静六は事件に触れている。"}, {"t": 1312.25, "x": "1988年3月1日。"}, {"t": 1314.75, "x": "同じ委員会での所信だ。"}, {"t": 1316.5666666666666, "x": "所信って？"}, {"t": 1317.5166666666667, "x": "大臣が、これから一年の方針を話すものだ。"}, {"t": 1320.5666666666666, "x": "警察について、こう述べた。"}, {"t": 1322.45, "x": "「昨年における刑法犯の認知件数は、\n約百五十八万件であり、依然として\n高い水準を示しております」"}, {"t": 1329.3, "x": "「内容的にも、朝日新聞社に"}, {"t": 1331.2833333333333, "x": "対する一連の襲撃事件や\n身の代金目的幼児誘拐殺人事件等の重要凶悪事件が\n相次いで発生し」"}, {"t": 1338.1666666666667, "x": "身の代金目的の、幼児の……。"}, {"t": 1340.4166666666667, "x": "ここでは、事件の名前は言っていない。"}, {"t": 1342.6666666666667, "x": "場所も、子どもの名前も出てこない。"}, {"t": 1344.95, "x": "でも、前の年の事件として挙げてるのよね。"}, {"t": 1347.85, "x": "そうだ。ただ、どの事件かを大臣は言っていない。"}, {"t": 1350.8, "x": "だからこの回でも、決めつけずに置いておく。"}, {"t": 1353.5333333333333, "x": "事件の名前が出ないって、どういうことなの？"}, {"t": 1356.3, "x": "大きな事件ほど、一つ一つの名前は消えていく。"}, {"t": 1359.4666666666667, "x": "重要凶悪事件、という束ねた言葉になる。"}, {"t": 1362.3, "x": "数字の中の、一件になる。"}, {"t": 1364.3666666666666, "x": "158万件の中の、一件……。"}, {"t": 1366.8666666666666, "x": "国会は、法律や予算を決める場所だ。"}, {"t": 1369.4166666666667, "x": "一つの事件の捜査を、細かく話す場所ではない。"}, {"t": 1372.55, "x": "だから名前が出ないのは、おかしなことではない。"}, {"t": 1375.4166666666667, "x": "でも、ちょっとさびしいわね。"}, {"t": 1377.2166666666667, "x": "そうかもしれない。"}, {"t": 1378.2833333333333, "x": "だから、名前が出た1回の発言を、\nこの回では大事に読んだ。"}, {"t": 1382.8333333333333, "x": "国会で、いつも朝日新聞の事件と並べられてるわね。"}, {"t": 1386.45, "x": "そうだ。所信でも質問でも、同じ並びだった。"}, {"t": 1389.6166666666666, "x": "時期を確かめると、その理由が見えてくる。"}, {"t": 1392.2166666666667, "x": "警察白書の昭和63年版に、こう書かれている。"}, {"t": 1395.6833333333334, "x": "「9月25日、両事件を\n警察庁指定第116号事件に指定した」"}, {"t": 1400.6333333333334, "x": "9月25日って、1987年の？"}, {"t": 1404.05, "x": "そうだ。功明ちゃんがいなくなった日から、11日後だ。"}, {"t": 1407.6833333333334, "x": "その年の5月3日、\n兵庫県西宮市の新聞社の支局が襲われていた。"}, {"t": 1412.4833333333333, "x": "そして9月24日、名古屋の新聞社の寮に\n散弾銃が撃たれた。"}, {"t": 1416.6833333333334, "x": "この二つを、全国で追う事件に指定したのが25日だ。"}, {"t": 1420.55, "x": "24日と25日って、功明ちゃんの声が\n公開されたころよね。"}, {"t": 1424.9333333333334, "x": "そうだ。声の公開が報じられた\n9月23日の、すぐあとだ。"}, {"t": 1429.1833333333334, "x": "同じ9月に、大きな事件が重なってたのね。"}, {"t": 1432.2833333333333, "x": "そうだ。全国の警察が、二つの方向を向いていた。"}, {"t": 1435.7833333333333, "x": "ちなみに、その白書の同じ章をすべて読んだ。"}, {"t": 1438.7333333333333, "x": "この事件のことは？"}, {"t": 1440.1333333333334, "x": "載っていない。昭和62年の犯罪の特徴の章にも無い。"}, {"t": 1443.8333333333333, "x": "保険金目的の事件や、銀行強盗の例は並んでいる。"}, {"t": 1447.4, "x": "だが高崎の誘拐の記述は、見つからなかった。"}, {"t": 1450.6833333333334, "x": "国会では大臣が触れたのに、白書には無いの？"}, {"t": 1453.7666666666667, "x": "白書には、捜査中の事件を細かく書かない面がある。"}, {"t": 1457.2166666666667, "x": "犯人に手の内を見せることになるからだ。"}, {"t": 1459.6666666666667, "x": "これは推測だが、未解決の事件ほど\n白書には出にくい。"}, {"t": 1463.3833333333334, "x": "記録に残る場所と、残らない場所があるのね。"}, {"t": 1466.3666666666666, "x": "そうだ。この事件は、新聞には大きく残った。"}, {"t": 1469.4333333333334, "x": "国会には、1回だけ名前が残った。"}, {"t": 1471.9833333333333, "x": "白書には、見つかる形では残っていない。"}, {"t": 1474.8, "x": "どこを開くかで、見え方が変わる……。"}, {"t": 1477.0833333333333, "x": "だからこの回は、開いた場所を一つずつ言っている。"}, {"t": 1480.8166666666666, "x": "身代金の誘拐って、ふつうは捕まるものなの？"}, {"t": 1484.05, "x": "ほとんど捕まる。国会でも、そう言われている。"}, {"t": 1486.9333333333334, "x": "事件から12年後。1999年6月29日、\n参議院の法務委員会。"}, {"t": 1492.4666666666667, "x": "電話の通信を聞いて捜査する法律を、審議していた。"}, {"t": 1495.9333333333334, "x": "電話を聞く法律？"}, {"t": 1497.3333333333333, "x": "通信傍受法だ。国が最初に出した\n案には、誘拐も入っていた。"}, {"t": 1501.5166666666667, "x": "ある議員が、こう質問している。"}, {"t": 1503.5333333333333, "x": "「身の代金目的とか営利目的による\n誘拐というのは非常に悲惨な例が多い」"}, {"t": 1508.2166666666667, "x": "「そのかわり検挙実績も九十数\n％と非常に高いんですけれども」"}, {"t": 1512.65, "x": "九十数パーセント。"}, {"t": 1514.1333333333334, "x": "そうだ。身代金の誘拐は、ほとんどの犯人が捕まる。"}, {"t": 1517.8166666666666, "x": "比べるために、もう一つ数字を出しておく。"}, {"t": 1520.5166666666667, "x": "昭和63年版の警察白書は、\n1986年の殺人の検挙率を載せている。"}, {"t": 1526.4833333333333, "x": "日本は96.7％。比べた欧米の4か国のどこよりも高い。"}, {"t": 1531.25, "x": "殺人でも、ほとんど捕まってたのね。"}, {"t": 1533.8833333333334, "x": "そうだ。事件の前の年の数字だ。"}, {"t": 1536.2166666666667, "x": "100件あれば、3件ほどしか残らない計算になる。"}, {"t": 1539.4666666666667, "x": "功明ちゃんの事件は、その残る側に入ってしまった。"}, {"t": 1542.9666666666667, "x": "どうして誘拐は、そんなに捕まりやすいの？"}, {"t": 1545.75, "x": "答えたのは、案を直した側の議員だ。"}, {"t": 1548.2333333333333, "x": "誘拐を対象から外した理由を、こう説明した。"}, {"t": 1551.3666666666666, "x": "「誘拐犯にいたしますと大体が\n営利誘拐につながっていきますので」"}, {"t": 1555.3, "x": "「こちらが捜さなくても逆に向こうの方から\n通話があり、金品の要求があるわけですから」"}, {"t": 1560.55, "x": "犯人のほうから、電話してくる……。"}, {"t": 1562.7666666666667, "x": "そうだ。金を受け取るには、連絡するしかない。"}, {"t": 1565.7333333333333, "x": "連絡すれば、そこに手がかりが生まれる。"}, {"t": 1568.2, "x": "だから身代金の誘拐は、捕まりやすい。"}, {"t": 1571.0333333333333, "x": "でも、この事件は電話が4回もあったのに。"}, {"t": 1573.8666666666666, "x": "そこだ。犯人は電話を掛けた。"}, {"t": 1575.9833333333333, "x": "4回とも、短く切っている。"}, {"t": 1578.05, "x": "そして、金を受け取りに来なかった。"}, {"t": 1580.45, "x": "受け取りに来なかったから、\n会う場所も生まれなかった。"}, {"t": 1583.5833333333333, "x": "そういうことだ。九十数パーセントの外側に、\nこの事件はある。"}, {"t": 1588.1, "x": "捜査は、15年続いた。"}, {"t": 1589.95, "x": "時効のとき、地元の新聞が数字をまとめている。"}, {"t": 1593.0333333333333, "x": "投入した捜査員は、延べ26万4000人。"}, {"t": 1596.2, "x": "26万人……。"}, {"t": 1597.4166666666667, "x": "聞き込みをした家は、2万2000世帯。"}, {"t": 1599.85, "x": "調べた不審な人物は、およそ4200人。"}, {"t": 1602.9, "x": "調べた車は、およそ4万2000台。"}, {"t": 1605.5333333333333, "x": "数字が大きすぎて、ぴんとこない。"}, {"t": 1607.7666666666667, "x": "延べ26万4000人を、15年でならしてみる。"}, {"t": 1611.0166666666667, "x": "1年で、1万7000人あまりになる。"}, {"t": 1613.7166666666667, "x": "1日にすると？"}, {"t": 1615.0166666666667, "x": "1日で、およそ48人だ。"}, {"t": 1617.2833333333333, "x": "最初の年に多く、後になるほど少なかったはずだ。"}, {"t": 1620.5333333333333, "x": "だから、これはただの平均だ。"}, {"t": 1622.65, "x": "それでも、15年間ずっと誰かが追ってたのね。"}, {"t": 1625.7833333333333, "x": "そうだ。担当が替わっても、事件は引き継がれる。"}, {"t": 1628.9, "x": "事件の年に入った若い警察官は、15年後には中堅だ。"}, {"t": 1633.05, "x": "4万2000台の車って、どうやって調べるの？"}, {"t": 1636.1666666666667, "x": "目撃された車の話から、持ち主を一台ずつ当たる。"}, {"t": 1639.8666666666666, "x": "中身は、この回では言わない。"}, {"t": 1641.7, "x": "車の色や形を言えば、持っている\n人が疑われかねない。"}, {"t": 1645.4, "x": "そうね。それは避けたい。"}, {"t": 1647.1, "x": "4200人という数も、同じだ。"}, {"t": 1649.5833333333333, "x": "調べられた人の多くは、事件と関係が無かった人だ。"}, {"t": 1653.2666666666667, "x": "疑われた側も、いやな思いをしたかもしれない。"}, {"t": 1656.25, "x": "そういう人も、数字の中に入っている。"}, {"t": 1659.4333333333334, "x": "そもそも、時効ってなんであるの？"}, {"t": 1661.6666666666667, "x": "犯人を裁くための、期限のことだ。"}, {"t": 1664.05, "x": "正しくは、公訴時効という。"}, {"t": 1665.9333333333334, "x": "決められた年数がたつと、\n検察は裁判にかけられなくなる。"}, {"t": 1669.7833333333333, "x": "どうして期限なんてあるの？"}, {"t": 1671.2333333333333, "x": "悪いことをしたのに。"}, {"t": 1672.7333333333333, "x": "その理由は、のちの国会でこうまとめられている。"}, {"t": 1675.6333333333334, "x": "2004年11月9日、\n衆議院の法務委員会での、ある議員の質問だ。"}, {"t": 1680.55, "x": "「時効制度は、時間の経過で処罰感情が薄れて、"}, {"t": 1683.6666666666667, "x": "証拠が散逸して捜査が困難になるというような理由で"}, {"t": 1686.95, "x": "設けられているのは\n皆様御承知のとおりでございますが」"}, {"t": 1690.0833333333333, "x": "時間がたつと、証拠が散らばってしまう……。"}, {"t": 1692.75, "x": "そうだ。見ていた人の記憶も薄れる。"}, {"t": 1695.15, "x": "物も無くなる。疑われた人が無実を示す材料も消える。"}, {"t": 1698.9833333333333, "x": "裁く側にも、裁かれる側にも、困ることがあるのね。"}, {"t": 1702.6, "x": "そういう考え方だ。だが\n同じ議員は、こうも続けている。"}, {"t": 1706.1333333333334, "x": "「ＤＮＡ鑑定等科学捜査も、\n科学技術も進歩しております」"}, {"t": 1710.3, "x": "技術が進めば、昔の証拠からも分かることが増える。"}, {"t": 1713.8833333333334, "x": "そうだ。古いテープの声も、\nいつか読み解けるかもしれない。"}, {"t": 1717.3833333333334, "x": "時効は、その「いつか」を待たずに線を引く。"}, {"t": 1720.5166666666667, "x": "功明ちゃんの事件だと、その線は何年だったの？"}, {"t": 1723.8166666666666, "x": "当時、死刑に当たる罪の時効は15年だった。"}, {"t": 1726.8333333333333, "x": "2004年の審議では、別の議員がこう言っている。"}, {"t": 1729.85, "x": "「死刑の公訴時効が十五年を二十五年にすると」"}, {"t": 1732.8333333333333, "x": "「今まで十五年で、逃げ回っておれば\n殺人をしても罪にならない、"}, {"t": 1736.5833333333333, "x": "公訴されないということが二十五年になった」"}, {"t": 1739.3833333333334, "x": "15年逃げれば、っていう言い方……。"}, {"t": 1741.5333333333333, "x": "きつい言い方だが、15年の線の意味を\nそのまま言っている。"}, {"t": 1744.9833333333333, "x": "1987年の事件には、この15年の線が引かれていた。"}, {"t": 1749.9833333333333, "x": "2002年9月13日の午前。"}, {"t": 1752.1833333333334, "x": "特別捜査本部は、事件を前橋地検に送った。"}, {"t": 1755.6333333333334, "x": "送ったって、犯人は分からないままよね？"}, {"t": 1758.3166666666666, "x": "そうだ。被疑者不詳のまま、書類を送った。"}, {"t": 1761.2666666666667, "x": "被疑者不詳？"}, {"t": 1762.35, "x": "疑われる人が誰か分からない、という意味だ。"}, {"t": 1765.1, "x": "時効を前に、捜査の記録を検察に引き渡す手続きだ。"}, {"t": 1768.9333333333334, "x": "じゃあ、ここで終わり？"}, {"t": 1770.2833333333333, "x": "翌14日の午前0時に、殺人の罪の時効が来た。"}, {"t": 1773.8166666666666, "x": "当時の法律では、死刑に当たる\n罪の時効は15年だった。"}, {"t": 1777.6333333333334, "x": "1987年9月14日から、ちょうど15年。"}, {"t": 1781.4833333333333, "x": "そうだ。0時を過ぎれば、\n犯人が見つかっても裁けない。"}, {"t": 1784.8333333333333, "x": "……。"}, {"t": 1785.75, "x": "地元の新聞は、こう書いている。"}, {"t": 1787.8333333333333, "x": "戦後、身代金目的の誘拐殺人で、未解決のまま\n時効を迎えた初めての事件とされる。"}, {"t": 1794.0, "x": "初めて……。"}, {"t": 1794.8833333333334, "x": "九十数パーセントが捕まる種類の事件だ。"}, {"t": 1797.65, "x": "その中で、時効まで届いてしまった。"}, {"t": 1800.2166666666667, "x": "声は公開されてたのに、15年で。"}, {"t": 1802.75, "x": "そうだ。題名にした言葉は、ここから来ている。"}, {"t": 1805.7333333333333, "x": "声は残った。だが、声の主にはたどり着かなかった。"}, {"t": 1809.7166666666667, "x": "時効から2年後。2004年10月28日、\n参議院の法務委員会。"}, {"t": 1814.3833333333334, "x": "法務省の刑事局長が、こう答えている。"}, {"t": 1817.0, "x": "「凶悪・重大犯罪に対する被害者を\n含む国民の処罰感情などを考えますと、"}, {"t": 1822.1333333333334, "x": "最長でも十五年という現在の公訴時効期間は\n短過ぎるというふうに思われます」"}, {"t": 1827.2333333333333, "x": "短過ぎる、って国が言ったのね。"}, {"t": 1829.4666666666667, "x": "そうだ。死刑に当たる罪の時効を、\n15年から25年に延ばす案だ。"}, {"t": 1833.8833333333334, "x": "その案が、この年の国会で審議された。"}, {"t": 1836.7166666666667, "x": "功明ちゃんの事件には？"}, {"t": 1838.4333333333334, "x": "間に合っていない。2年前に、\nもう時効が来ていたからだ。"}, {"t": 1841.8333333333333, "x": "同じ年の衆議院では、ある議員がこう述べた。"}, {"t": 1844.65, "x": "「犯罪被害者及びその遺族にとりましては、\n何年たっても事件は終わりません」"}, {"t": 1849.4, "x": "何年たっても、終わらない……。"}, {"t": 1851.2666666666667, "x": "この議員は、時効のあとに犯人が\n名乗り出る場面を挙げている。"}, {"t": 1854.8666666666666, "x": "「その人は楽になるかもしれない」"}, {"t": 1856.8666666666666, "x": "「しかし、そうすると、遺族、被害者」"}, {"t": 1859.4833333333333, "x": "「この憎しみ、苦しみをどこへ、"}, {"t": 1861.25, "x": "法の裁きも受けない、どこへぶつければいいのか、\n本当につらいものだと思います」"}, {"t": 1866.1833333333334, "x": "時効が来たら、犯人だけが\n楽になるかもしれない……。"}, {"t": 1869.4333333333334, "x": "そういう問いかけだ。"}, {"t": 1870.6333333333334, "x": "国はこの年、延ばす答えを出した。だが、\n無くしはしなかった。"}, {"t": 1874.7, "x": "そして2010年4月27日、衆議院の法務委員会。"}, {"t": 1878.55, "x": "法務大臣の千葉景子が、こう答えている。"}, {"t": 1881.1833333333334, "x": "「今回の法律が成立をするとすれば、\n殺人罪の公訴時効は廃止」"}, {"t": 1885.65, "x": "時効そのものが、無くなったのね。"}, {"t": 1887.9666666666667, "x": "そうだ。この話の中身は、前に別の回で詳しく扱った。"}, {"t": 1891.9833333333333, "x": "ここで言いたいのは一つだけだ。"}, {"t": 1893.85, "x": "15年が短過ぎると言われたのは、\nこの事件の時効のあとだった。"}, {"t": 1897.9666666666667, "x": "……順番が、逆だったのね。"}, {"t": 1899.9, "x": "法律は、多くの場合あとから変わる。"}, {"t": 1902.1666666666667, "x": "それを責めることは、この回ではしない。"}, {"t": 1905.1333333333334, "x": "2017年9月8日から、地元の上毛新聞が連載を組んだ。"}, {"t": 1909.4166666666667, "x": "題は「迫る未解決30年」。全5回だ。"}, {"t": 1912.6, "x": "事件から30年なのね。"}, {"t": 1914.4666666666667, "x": "取り上げたのは、1987年9月の群馬の二つの事件だ。"}, {"t": 1918.9166666666667, "x": "どちらも時効を迎えている。"}, {"t": 1920.6833333333334, "x": "時効のあとでも、記事にしたのね。"}, {"t": 1922.95, "x": "そうだ。新聞協会報が、その取材のことを伝えている。"}, {"t": 1926.6166666666666, "x": "ご遺族は、そっとしておいてほしいと考えていた。"}, {"t": 1929.55, "x": "記者はその気持ちを分かったうえで、話をした。"}, {"t": 1932.4333333333334, "x": "事件を次の世代に伝える\n意味を、粘り強く伝えたという。"}, {"t": 1936.1333333333334, "x": "伝えたい側と、静かにしていたい側……。"}, {"t": 1938.7333333333333, "x": "どちらも、間違ってはいない。"}, {"t": 1940.5833333333333, "x": "連載には、当時の高崎署長も出てくる。"}, {"t": 1943.35, "x": "当時の日記を手がかりに、記憶をたどったという。"}, {"t": 1946.35, "x": "日記が残ってたのね。"}, {"t": 1947.9833333333333, "x": "30年前のことを、記憶だけで話すのは難しい。"}, {"t": 1951.25, "x": "記録が残っていたから、話せたことがある。"}, {"t": 1953.9666666666667, "x": "番外編では、作家の横山秀夫が語っている。"}, {"t": 1957.1333333333334, "x": "事件の当時、上毛新聞の記者として\n県警を担当していた。"}, {"t": 1961.0666666666666, "x": "語ったのは、事件への怒りとやるせなさだったという。"}, {"t": 1964.3333333333333, "x": "記者として、近くで見てたのね。"}, {"t": 1966.5833333333333, "x": "そうだ。30年たっても、消えない\n思いがあったということだ。"}, {"t": 1970.25, "x": "時効は、裁くための時間を終わらせる。"}, {"t": 1972.6666666666667, "x": "だが、覚えている人の時間までは終わらせない。"}, {"t": 1975.5666666666666, "x": "30年たっても、記事を書く人がいるのね。"}, {"t": 1978.4833333333333, "x": "協会報は、記者の思いもこう伝えている。"}, {"t": 1981.1, "x": "同じような事件を const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
