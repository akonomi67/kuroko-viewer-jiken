<script>
const D={"name": "127", "file": "127_編集用", "dur": 2039.4833125, "segs": [], "subs": [{"t": 0.0, "x": "27秒。"}, {"t": 1.1333333333333333, "x": "群馬県高崎市の家に掛かった1本の電話の長さだ。"}, {"t": 4.733333333333333, "x": "電話の長さ？"}, {"t": 5.9, "x": "男の声で金額と時間だけを言って切れた。"}, {"t": 8.666666666666666, "x": "その声は録音され、のちに警察が公開した。"}, {"t": 11.75, "x": "誰でも電話をかければ聞けるようにした。"}, {"t": 14.183333333333334, "x": "声をみんなに聞かせたの？"}, {"t": 15.85, "x": "そうだ。聞き覚えのある人を探すためだ。"}, {"t": 18.416666666666668, "x": "だが声の主は見つからなかった。"}, {"t": 20.483333333333334, "x": "そして15年がたち、時効を迎えた。"}, {"t": 23.1, "x": "15年……。"}, {"t": 24.233333333333334, "x": "犯人は一度も姿を見せていない。"}, {"t": 26.4, "x": "金も受け取りに来ていない。"}, {"t": 28.0, "x": "手もとに残ったのは、電話の時刻と声だけだった。"}, {"t": 31.183333333333334, "x": "1987年9月。群馬県高崎市。"}, {"t": 34.6, "x": "5歳の男の子が、家の近くから姿を消した。"}, {"t": 37.8, "x": "家には身代金を求める電話が掛かってくる。"}, {"t": 40.583333333333336, "x": "はじめの要求は2000万円だった。"}, {"t": 42.9, "x": "誘拐事件なのね。"}, {"t": 44.35, "x": "今回は功明ちゃん誘拐事件を扱う。"}, {"t": 46.88333333333333, "x": "主役は電話だ。"}, {"t": 48.016666666666666, "x": "何回鳴ったのか。どこから掛かったのか。"}, {"t": 50.6, "x": "なぜ掛けた場所が分からなかったのか。"}, {"t": 52.8, "x": "そして残った声はどう使われたのか。"}, {"t": 55.21666666666667, "x": "電話の線を追っていくのね。"}, {"t": 56.96666666666667, "x": "そうだ。先に決めごとを言っておく。"}, {"t": 59.15, "x": "亡くなった男の子の様子は話さない。"}, {"t": 61.5, "x": "ご家族の名前や暮らしにも触れない。"}, {"t": 63.65, "x": "犯人は分かっていない。"}, {"t": 65.05, "x": "だからどんな人だったかの話もしない。"}, {"t": 67.63333333333334, "x": "わかったわ。記録に残っていることだけ、ね。"}, {"t": 71.13333333333334, "x": "1987年9月14日、月曜日。"}, {"t": 74.45, "x": "男の子は幼稚園から家に帰っていた。"}, {"t": 76.86666666666666, "x": "そのあと家の近くの神社へ遊びに出た。"}, {"t": 79.3, "x": "地元の新聞は午後4時50分ごろと伝えている。"}, {"t": 82.45, "x": "家のすぐ近くなのね。"}, {"t": 84.06666666666666, "x": "歩いてすぐの、小さな神社だ。"}, {"t": 86.08333333333333, "x": "子どもがひとりで遊びに行ける距離だった。"}, {"t": 88.6, "x": "それで帰ってこなかった。"}, {"t": 90.26666666666667, "x": "家族が探しても見つからない。"}, {"t": 92.15, "x": "午後6時半ごろ、警察に届けを出した。"}, {"t": 95.01666666666667, "x": "まだ夕方の6時半よね。"}, {"t": 96.88333333333334, "x": "9月の半ばだから、もう暗くなりかけている。"}, {"t": 99.7, "x": "この時点では迷子かもしれない。"}, {"t": 101.56666666666666, "x": "どこかでけがをしたのかもしれない。"}, {"t": 103.53333333333333, "x": "誰もがまず事故を心配する時間だ。"}, {"t": 105.91666666666667, "x": "誘拐だとはまだ思わないわよね。"}, {"t": 108.03333333333333, "x": "そうだ。だが十数分後に電話が鳴る。"}, {"t": 110.4, "x": "ここから、この事件は電話の事件になる。"}, {"t": 113.1, "x": "電話の事件……。"}, {"t": 114.25, "x": "一つ覚えておいてほしい日付がある。"}, {"t": 116.43333333333334, "x": "翌日の9月15日は、敬老の日だった。"}, {"t": 119.35, "x": "当時は日付が決まった祝日で、銀行は休みだ。"}, {"t": 122.75, "x": "それが関係あるの？"}, {"t": 124.16666666666667, "x": "身代金の話になると、大きく関係してくる。"}, {"t": 127.36666666666666, "x": "あとでもう一度この日付に戻ってくる。"}, {"t": 130.31666666666666, "x": "午後6時40分ごろ、家の電話が鳴った。"}, {"t": 133.11666666666667, "x": "受話器の向こうは、男の声だった。"}, {"t": 135.38333333333333, "x": "子どもを預かっている、という。"}, {"t": 137.16666666666666, "x": "そして、2000万円を要求した。"}, {"t": 139.5, "x": "届けを出して、すぐなのね。"}, {"t": 141.48333333333332, "x": "届けから、十数分あとだ。"}, {"t": 143.43333333333334, "x": "ここで迷子の捜索は、誘拐の捜査に変わる。"}, {"t": 146.46666666666667, "x": "警察は何をするの？"}, {"t": 148.03333333333333, "x": "まず次の電話に備える。"}, {"t": 149.65, "x": "誘拐なら、犯人は必ずまた掛けてくる。"}, {"t": 152.43333333333334, "x": "金を受け取るには、場所と時間を伝えるしかない。"}, {"t": 155.5, "x": "だから電話を待つのね。"}, {"t": 157.06666666666666, "x": "そうだ。そして次の電話で居場所を探る。"}, {"t": 159.61666666666667, "x": "掛けてきた場所を突き止める。逆探知だ。"}, {"t": 162.33333333333334, "x": "ドラマで見るやつね。"}, {"t": 163.45, "x": "話を引き延ばして、っていう。"}, {"t": 165.5, "x": "それだ。だが1987年の逆探知は、ドラマとは違う。"}, {"t": 169.78333333333333, "x": "画面に番号がすぐ出るような仕組みではない。"}, {"t": 172.43333333333334, "x": "じゃあどうやって探すの？"}, {"t": 173.96666666666667, "x": "それを当時の国会の記録で確かめておく。"}, {"t": 176.65, "x": "事件の2年前、電話会社の部長が説明している。"}, {"t": 180.06666666666666, "x": "電話会社って、NTT？"}, {"t": 182.0, "x": "そうだ。電電公社が民営化したばかりのNTTだ。"}, {"t": 185.31666666666666, "x": "1985年9月6日、衆議院の法務委員会。"}, {"t": 189.05, "x": "参考人として呼ばれた部長が、やり方を話した。"}, {"t": 192.9, "x": "原文をそのまま読む。"}, {"t": 194.3, "x": "「逆探知のやり方といたしましては、電話機が\n収容されております交換機の着信側の端子から」"}, {"t": 200.21666666666667, "x": "「順次接続されているルートを人手に\nよりまして逆に追っかけていく、"}, {"t": 203.95, "x": "探索をしていくという方法によっております」"}, {"t": 206.75, "x": "人手で逆に追っかけていく？"}, {"t": 208.61666666666667, "x": "電話は局にある交換機という機械でつながる。"}, {"t": 211.4, "x": "掛けた人の線と、受けた人の線を結ぶ機械だ。"}, {"t": 214.66666666666666, "x": "受けた側の端子から、つながっている\n道を一つずつ順にたどる。"}, {"t": 218.51666666666668, "x": "それを人が手でやる、という説明だ。"}, {"t": 220.95, "x": "機械が自動で出してくれるんじゃないのね。"}, {"t": 223.36666666666667, "x": "部長はこうも言っている。"}, {"t": 224.78333333333333, "x": "「同じ市内だけではなく遠くから何段階もの交換機を\n経由して着信するものもございます」"}, {"t": 230.21666666666667, "x": "「逆探知をやります場合にも非常に\n時間もかかり、難しい状況にございます」"}, {"t": 234.98333333333332, "x": "時間がかかる……。"}, {"t": 236.15, "x": "交換機をいくつもまたげば、\nそのぶんたどる道も増える。"}, {"t": 239.41666666666666, "x": "途中で電話が切れれば、つながりそのものが消える。"}, {"t": 242.46666666666667, "x": "切られたらそこで終わり？"}, {"t": 243.96666666666667, "x": "たどっている途中の道が無くなるからな。"}, {"t": 246.35, "x": "だから話を引き延ばせ、ということになる。"}, {"t": 249.13333333333333, "x": "1分とか2分で切られたら、間に合わないかも。"}, {"t": 252.1, "x": "そういう仕組みの時代だった、ということだ。"}, {"t": 254.61666666666667, "x": "これはこの事件の2年前の、国会での説明だ。"}, {"t": 257.8, "x": "事件の夜の高崎で何分かかったかは、記録に無い。"}, {"t": 261.21666666666664, "x": "だからここで言えるのは仕組みまでだ。"}, {"t": 263.4, "x": "うん。仕組みの話として聞いておくわ。"}, {"t": 266.3666666666667, "x": "そもそも電話会社は勝手に探していいの？"}, {"t": 269.06666666666666, "x": "いい質問だ。勝手にはできない。"}, {"t": 271.15, "x": "電話には通信の秘密がある。"}, {"t": 273.0, "x": "誰が誰に掛けたかも、守られるべき秘密だ。"}, {"t": 276.0833333333333, "x": "じゃあ逆探知は、秘密を破ることになるの？"}, {"t": 278.9, "x": "だからやってよい場合が決められていた。"}, {"t": 281.0833333333333, "x": "1985年の部長は、その根拠も話している。"}, {"t": 284.71666666666664, "x": "「かつて昭和三十八年十二月に内閣法制局から\n御見解をいただいておりますが」"}, {"t": 289.8666666666667, "x": "「脅迫の罪を現に犯している者があって、\nかつ被害者の要請がある場合」"}, {"t": 294.3833333333333, "x": "昭和三十八年って、1963年よね。"}, {"t": 297.98333333333335, "x": "そうだ。東京で吉展ちゃん事件が起きた年だ。"}, {"t": 301.0, "x": "その年の終わりに、\n国の法律の番人が考え方を示した。"}, {"t": 304.9, "x": "それがずっと逆探知の土台になっていた。"}, {"t": 307.5, "x": "1987年まで、24年も同じ考え方なのね。"}, {"t": 311.76666666666665, "x": "1991年の参議院では、\nNTTの別の部長がまとめている。"}, {"t": 316.3666666666667, "x": "「一つは電話を利用して現に\n脅迫の罪が行われていること」"}, {"t": 320.1, "x": "「二つ目が捜査機関からの要請があること、\n三つ目が被害者の同意があること」"}, {"t": 324.8, "x": "「本件は昭和三十八年の内閣法制局の見解を\n根拠といたして実施しているものでございます」"}, {"t": 330.8833333333333, "x": "三つそろえば、探してもいいってことね。"}, {"t": 333.51666666666665, "x": "そうだ。身代金を求める電話は、まさに脅迫の最中だ。"}, {"t": 337.45, "x": "家族が頼み、警察が求めれば、条件はそろう。"}, {"t": 340.8666666666667, "x": "でもそろえる手続きにも時間がかかりそう。"}, {"t": 343.5, "x": "最初の電話が来た時点では、何の準備も無い。"}, {"t": 346.4166666666667, "x": "届けからわずか十数分で、犯人は掛けてきた。"}, {"t": 349.55, "x": "準備が整う前の電話だった、ということになる。"}, {"t": 353.2, "x": "二度目の電話は、午後7時47分ごろだ。"}, {"t": 356.15, "x": "最初から、およそ1時間後になる。"}, {"t": 358.45, "x": "男はまた2000万円を求めた。"}, {"t": 360.7, "x": "同じ金額ね。"}, {"t": 361.96666666666664, "x": "このとき、家の側から一つの事情が伝えられた。"}, {"t": 365.1166666666667, "x": "明日は祝日で銀行が休みだということだ。"}, {"t": 368.01666666666665, "x": "さっきの敬老の日ね。"}, {"t": 369.6, "x": "そうだ。2000万円を、すぐに\n現金でそろえるのは難しい。"}, {"t": 373.25, "x": "銀行が開くのは、早くても16日の朝になる。"}, {"t": 376.6666666666667, "x": "犯人は祝日のことを知らなかったの？"}, {"t": 379.21666666666664, "x": "そこは資料によって書き方が違う。"}, {"t": 381.43333333333334, "x": "犯人が何を考えていたかは、誰にも分からない。"}, {"t": 384.5, "x": "だからここでは、言われたことだけを置いておく。"}, {"t": 387.23333333333335, "x": "逆探知はこの電話には？"}, {"t": 389.0, "x": "間に合わなかった、と伝える資料がある。"}, {"t": 391.35, "x": "通話が短かった、と書く資料もある。"}, {"t": 393.78333333333336, "x": "どちらにしても、掛けた場所はつかめていない。"}, {"t": 396.5833333333333, "x": "2回ともだめだったのね。"}, {"t": 398.28333333333336, "x": "ただ一つだけ分かったことがあるとされる。"}, {"t": 400.68333333333334, "x": "電話の向こうで、車の通る音がしていたという。"}, {"t": 403.7, "x": "外から掛けてるってこと？"}, {"t": 405.46666666666664, "x": "公衆電話から掛けた可能性が言われた。"}, {"t": 407.93333333333334, "x": "家の電話なら、探し当てれば住所に着く。"}, {"t": 410.56666666666666, "x": "だが公衆電話なら、着いた先は電話ボックスだ。"}, {"t": 413.73333333333335, "x": "そこにはもう、誰もいない……。"}, {"t": 415.51666666666665, "x": "そういうことになる。"}, {"t": 417.3333333333333, "x": "三度目は午後8時3分ごろだ。"}, {"t": 419.4166666666667, "x": "二度目から、わずか16分後になる。"}, {"t": 421.9, "x": "間が短くなってる。"}, {"t": 423.51666666666665, "x": "この電話で男は男の子を電話口に出させた。"}, {"t": 426.55, "x": "子どもの声が聞こえたの？"}, {"t": 428.25, "x": "そうだ。家族はその声を聞いている。"}, {"t": 430.45, "x": "何を話したかは、この回では言わない。"}, {"t": 432.98333333333335, "x": "……うん。それでいいと思う。"}, {"t": 434.48333333333335, "x": "通話はおよそ2分だったと伝えられている。"}, {"t": 436.93333333333334, "x": "4回の電話の中で、一番長い。"}, {"t": 439.4166666666667, "x": "2分あれば逆探知は？"}, {"t": 441.01666666666665, "x": "この電話はある程度までたどれた。"}, {"t": 442.93333333333334, "x": "高崎市の西のほうを受け持つ電話局の管内だった。"}, {"t": 446.3666666666667, "x": "管内？"}, {"t": 447.5, "x": "一つの電話局が受け持つ、範囲のことだ。"}, {"t": 450.3, "x": "そこまでは分かった。だが一つの点にはならない。"}, {"t": 453.3833333333333, "x": "範囲までで場所までは届かなかったのね。"}, {"t": 455.8833333333333, "x": "そうだ。管内には住宅も道も、電話ボックスもある。"}, {"t": 459.31666666666666, "x": "のちの報道では、\n管内の電話ボックスは65台とされた。"}, {"t": 463.1666666666667, "x": "65台も……。"}, {"t": 464.3833333333333, "x": "犯人が使ったのは、そのどれかかもしれない。"}, {"t": 467.18333333333334, "x": "だがどれなのかは決まらなかった。"}, {"t": 469.0833333333333, "x": "ここがこの事件の一つ目の分かれ目だ。"}, {"t": 471.5, "x": "もし一つの電話ボックスまで行けていたら。"}, {"t": 474.1166666666667, "x": "そこに指紋が残ってたかも、とか？"}, {"t": 476.56666666666666, "x": "そう考えたくなる。だがそれはもしもの話だ。"}, {"t": 479.5, "x": "この回ではもしもの話はここまでにしておく。"}, {"t": 482.8833333333333, "x": "三度目のあと夜のあいだも電話は鳴った。"}, {"t": 485.25, "x": "だが受話器を取る前に切れる。"}, {"t": 486.95, "x": "ベルが1回から3回鳴って、それで終わる。"}, {"t": 489.76666666666665, "x": "無言電話みたいなもの？"}, {"t": 491.35, "x": "声すら出ない。つながる前に切れている。"}, {"t": 493.71666666666664, "x": "翌日の未明までに、何度も続いた。"}, {"t": 496.3666666666667, "x": "それも犯人なの？"}, {"t": 497.73333333333335, "x": "当時はそう疑うしかない。"}, {"t": 499.3666666666667, "x": "鳴るたびに家の人も警察も身構えたはずだ。"}, {"t": 502.15, "x": "だがのちに捜査本部は確かめている。"}, {"t": 504.46666666666664, "x": "未明に続いた13回の呼び出しは、\n事件と関係が無かった。"}, {"t": 508.48333333333335, "x": "関係なかったの？"}, {"t": 509.8333333333333, "x": "そう報じられている。"}, {"t": 510.9166666666667, "x": "何が原因だったかは言われていない。"}, {"t": 513.1833333333333, "x": "でもその夜には分からないわよね。"}, {"t": 515.2666666666667, "x": "分からない。1回ごとに逆探知の準備をする。"}, {"t": 518.1666666666666, "x": "鳴るのに何も聞こえない。"}, {"t": 519.6833333333333, "x": "誘拐された子の家で、ひと晩それが続いた。"}, {"t": 522.6833333333333, "x": "……眠れないわね。"}, {"t": 523.8, "x": "この夜のうちに、県警は特別捜査本部を作った。"}, {"t": 527.1666666666666, "x": "場所は高崎署だ。"}, {"t": 528.5333333333333, "x": "そしてもう一つ別の動きも始まっていた。"}, {"t": 531.35, "x": "別の動き？"}, {"t": 532.4666666666667, "x": "報道の側の動きだ。"}, {"t": 534.5666666666667, "x": "誘拐の最中には、新聞もテレビも報じるのを待つ。"}, {"t": 537.85, "x": "警察と報道各社が、報道協定を結ぶからだ。"}, {"t": 541.25, "x": "子どもの命を守るため、よね。"}, {"t": 543.5166666666667, "x": "そうだ。報じられれば、犯人が追い詰められる。"}, {"t": 546.3833333333333, "x": "追い詰められた犯人が、\n子どもに何をするか分からない。"}, {"t": 549.5833333333334, "x": "だから見つかるまでは、書かずに待つ。"}, {"t": 551.9666666666667, "x": "この事件でも結んだの？"}, {"t": 553.6666666666666, "x": "結んだ。そして新聞協会報が、\n2017年にこう伝えている。"}, {"t": 558.0, "x": "群馬県で誘拐の報道協定が\n結ばれたのは、この事件だけだ。"}, {"t": 562.1166666666667, "x": "群馬でただ一度だけ？"}, {"t": 563.7, "x": "そうだ。身代金の誘拐は、それほど多くは起きない。"}, {"t": 567.05, "x": "記者にとっても、警察にとっても初めての経験だった。"}, {"t": 570.6833333333333, "x": "書きたいのに書けない、って大変そう。"}, {"t": 573.0333333333333, "x": "記者と県警の間には、緊張があったという。"}, {"t": 575.85, "x": "それでも大きな違反は無かったと伝えられている。"}, {"t": 578.5833333333334, "x": "当時の県警の広報官は、のちにこう振り返った。"}, {"t": 581.7666666666667, "x": "「日頃から記者と緊張感のある\n信頼関係を培っておくことが重要だ」"}, {"t": 586.2833333333333, "x": "緊張感のある信頼関係……。"}, {"t": 588.3, "x": "仲良くするだけでも、疑い合うだけでもない。"}, {"t": 591.05, "x": "いざというとき、相手の約束を信じられるかどうか。"}, {"t": 594.15, "x": "それは事件が起きてから\n作れるものではない、ということだ。"}, {"t": 597.6, "x": "協定の決まりそのものは、もっと前からあったのよね。"}, {"t": 600.9, "x": "あった。その成り立ちは前に\n扱ったので、ここでは省く。"}, {"t": 604.45, "x": "この回で見たいのは、\n群馬の記者たちが待った時間だ。"}, {"t": 607.8166666666667, "x": "どれくらい待ったの？"}, {"t": 609.1333333333333, "x": "協定は子どもが見つかるまで続く。"}, {"t": 611.2833333333333, "x": "この事件では、2日近くになった。"}, {"t": 613.6833333333333, "x": "記者は事件を知っている。だが一行も書けない。"}, {"t": 616.4833333333333, "x": "書けば、子どもの命を危うくするかもしれない。"}, {"t": 619.2833333333333, "x": "書かなければ、読者は何も知らないままだ。"}, {"t": 622.1166666666667, "x": "その間、ずっと黙ってたのね。"}, {"t": 624.35, "x": "黙って取材を続けた。"}, {"t": 625.8, "x": "見つかった瞬間に書くためだ。"}, {"t": 628.45, "x": "9月15日。敬老の日。"}, {"t": 630.3833333333333, "x": "この日、犯人からの電話は無かった。"}, {"t": 632.9, "x": "一度も？"}, {"t": 634.0333333333333, "x": "一度もだ。前の晩は1時間に何本も来ていたのにな。"}, {"t": 637.6166666666667, "x": "かえって怖いわね。"}, {"t": 638.9166666666666, "x": "電話が鳴らなければ、逆探知も使えない。"}, {"t": 641.5666666666667, "x": "犯人に近づく手がかりは、電話しかなかった。"}, {"t": 644.6333333333333, "x": "警察はただ待つしかないの？"}, {"t": 646.5666666666667, "x": "待つだけではない。外では捜索が続いている。"}, {"t": 649.4, "x": "県内の広い範囲で、夜の見回りもしたと伝えられる。"}, {"t": 652.8166666666667, "x": "アパートや旅館なども、片端から当たったという。"}, {"t": 655.8333333333334, "x": "でも表立っては動けないのよね。"}, {"t": 657.9666666666667, "x": "そうだ。報道協定の最中だ。"}, {"t": 660.1333333333333, "x": "町の人の多くは、事件が起きていることを知らない。"}, {"t": 663.35, "x": "知らないから、目撃した人も名乗り出られない。"}, {"t": 666.4, "x": "そこが協定のもう一つの面だ。"}, {"t": 668.4833333333333, "x": "子どもを守るために、町に知らせない。"}, {"t": 670.85, "x": "知らせないから、町の目は使えない。"}, {"t": 673.25, "x": "どっちがいいって、簡単には言えないわね。"}, {"t": 675.8166666666667, "x": "言えない。この回でも決めない。"}, {"t": 677.65, "x": "そしてこの同じ15日のことだ。"}, {"t": 679.7833333333333, "x": "同じ群馬県の尾島町で、\n8歳の女の子が行方不明になった。"}, {"t": 684.0166666666667, "x": "同じ日に？"}, {"t": 685.15, "x": "これは別の事件だ。こちらものちに時効を迎えている。"}, {"t": 688.3833333333333, "x": "この回ではそれ以上は扱わない。"}, {"t": 690.5166666666667, "x": "同じ県で同じ月に、二つ……。"}, {"t": 692.7833333333333, "x": "2017年の地元の連載は、\n二つの事件を並べて伝えている。"}, {"t": 697.7, "x": "9月16日、水曜日。"}, {"t": 699.4666666666667, "x": "午前7時50分ごろ。"}, {"t": 701.1833333333333, "x": "丸一日以上あいて、電話が鳴った。"}, {"t": 703.65, "x": "4回目ね。"}, {"t": 704.7666666666667, "x": "受話器を取ったのは、男の子の父親だ。"}, {"t": 707.4166666666666, "x": "男は一方的に要求を告げた。"}, {"t": 709.55, "x": "今日の夕方6時までに、1000万円を用意しろ。"}, {"t": 712.7, "x": "1000万円？　最初は2000万円だったわよね。"}, {"t": 715.7, "x": "そうだ。要求は半分になっていた。"}, {"t": 718.1166666666667, "x": "どうして下げたの？"}, {"t": 719.4, "x": "理由は分からない。犯人が言っていないからだ。"}, {"t": 722.1, "x": "しかも受け渡しの方法は言わなかった。"}, {"t": 724.5333333333333, "x": "場所も時間も言わずに、用意しろだけ？"}, {"t": 727.0666666666667, "x": "そうだ。また電話する、という形で終わった。"}, {"t": 729.8833333333333, "x": "通話は27秒だった。"}, {"t": 731.7, "x": "最初に出てきた、27秒……。"}, {"t": 733.8833333333333, "x": "この回の始まりの電話が、これだ。"}, {"t": 736.25, "x": "逆探知は？"}, {"t": 737.3833333333333, "x": "できなかった。"}, {"t": 738.5166666666667, "x": "前の晩の態勢が、この朝には\n解かれていたと報じられた。"}, {"t": 742.1666666666666, "x": "えっ、解かれてたの？"}, {"t": 743.6333333333333, "x": "当時の新聞がそう伝え、県警は詳しく言わなかった。"}, {"t": 747.0166666666667, "x": "だからここは報道として置いておく。"}, {"t": 749.0833333333334, "x": "たとえ態勢があっても、27秒で\nたどれたかは分からない。"}, {"t": 752.6166666666667, "x": "1985年の説明を思い出してほしい。"}, {"t": 755.8, "x": "人の手で交換機を一つずつ……。"}, {"t": 757.9833333333333, "x": "そうだ。27秒はその仕組みにはあまりに短い。"}, {"t": 761.1333333333333, "x": "そしてこの声が、のちに公開される録音になる。"}, {"t": 764.8333333333334, "x": "ちょっと待って。電話の順番がこんがらがってきた。"}, {"t": 767.9166666666666, "x": "ではここで4本を並べておこう。"}, {"t": 769.85, "x": "時刻はどれも当時の報道によるものだ。"}, {"t": 772.25, "x": "1本目。14日の午後6時40分ごろ。2000万円。"}, {"t": 775.9666666666667, "x": "2本目。午後7時47分ごろ。また2000万円。"}, {"t": 779.4666666666667, "x": "ここまでの間は、およそ1時間だ。"}, {"t": 781.8166666666667, "x": "3本目。午後8時3分ごろ。"}, {"t": 783.8333333333334, "x": "男の子が電話口に出た。"}, {"t": 785.6833333333333, "x": "2本目から、16分しかたっていない。"}, {"t": 788.3166666666667, "x": "最初の3本はぜんぶ同じ晩なのね。"}, {"t": 790.7666666666667, "x": "そうだ。1時間半ほどの間に3本だ。"}, {"t": 793.5333333333333, "x": "そこから、犯人の電話はぴたりと止まる。"}, {"t": 796.1166666666667, "x": "4本目は、16日の午前7時50分ごろ。1000万円。"}, {"t": 800.3, "x": "3本目から、どれくらいあいてるの？"}, {"t": 802.5833333333334, "x": "14日の夜8時から16日の朝8時前まで。"}, {"t": 805.9, "x": "およそ36時間だ。"}, {"t": 807.65, "x": "36時間も何も無かったの？"}, {"t": 809.9666666666667, "x": "犯人からの声は、何も無かった。"}, {"t": 812.2833333333333, "x": "鳴ってすぐ切れるベルはあったが、\nそれも関係が無かった。"}, {"t": 815.7, "x": "1時間半で3本、それから36時間あいて、27秒。"}, {"t": 819.9833333333333, "x": "並べると形がはっきりするだろう。"}, {"t": 822.1333333333333, "x": "最初の晩は急いでいて、そのあと黙った。"}, {"t": 824.8333333333334, "x": "そして最後は短く、金額を半分にして切った。"}, {"t": 828.2166666666667, "x": "その間に何があったんだろう。"}, {"t": 830.1666666666666, "x": "それを知っているのは、掛けた本人だけだ。"}, {"t": 832.7333333333333, "x": "この回ではその間を想像で埋めない。"}, {"t": 834.9833333333333, "x": "並べた時刻が、記録に残ったすべてだ。"}, {"t": 838.3333333333334, "x": "4回目の電話から、およそ4時間半後。"}, {"t": 840.95, "x": "9月16日の昼ごろだ。"}, {"t": 842.85, "x": "男の子は高崎市内で見つかった。"}, {"t": 845.2166666666667, "x": "すでに亡くなっていた。"}, {"t": 846.4333333333333, "x": "……。"}, {"t": 847.3666666666667, "x": "いなくなってから、44時間後だった。"}, {"t": 850.05, "x": "夕方6時までって言ってたのに。"}, {"t": 852.2, "x": "そうだ。期限の前に見つかったことになる。"}, {"t": 854.8, "x": "どういう状況だったかは、この回では話さない。"}, {"t": 857.6, "x": "ご家族はそっとしておいてほしいと考えていた。"}, {"t": 860.3833333333333, "x": "30年目の2017年の取材について、\n新聞協会報がそう伝えている。"}, {"t": 865.3833333333333, "x": "うん。それは守りたい。"}, {"t": 866.9166666666666, "x": "見つかったことで、報道協定は役目を終えた。"}, {"t": 869.75, "x": "翌17日の朝刊で、事件は一斉に報じられる。"}, {"t": 873.2666666666667, "x": "町の人はそこで初めて知ったのね。"}, {"t": 875.7166666666667, "x": "そうだ。誘拐の事件から、\n未解決の事件に変わった瞬間だ。"}, {"t": 879.85, "x": "犯人は金を受け取っていない。"}, {"t": 881.6833333333333, "x": "姿も見せていない。"}, {"t": 883.0333333333333, "x": "残ったのは、4回の電話だけだった。"}, {"t": 885.6166666666667, "x": "電話と声……。"}, {"t": 886.75, "x": "ここからの15年は、その声を追う年月になる。"}, {"t": 890.3833333333333, "x": "事件からおよそ1週間後。9月の下旬だ。"}, {"t": 893.25, "x": "県警は4回目の電話の録音を公開した。"}, {"t": 896.0166666666667, "x": "朝日新聞は9月23日付で、\n脅迫電話の声の公開を伝えている。"}, {"t": 900.9, "x": "どうやって公開したの？"}, {"t": 902.5, "x": "雑音を取り除くなどの手を入れた。"}, {"t": 904.6, "x": "そして電話をかければ聞けるようにした。"}, {"t": 906.8666666666667, "x": "テレホンサービスという仕組みだ。"}, {"t": 908.7833333333333, "x": "電話をかけると、録音が流れるのね。"}, {"t": 911.3666666666667, "x": "そうだ。インターネットが無い時代のやり方だ。"}, {"t": 914.0833333333334, "x": "誰でも家の電話から犯人の声を聞ける。"}, {"t": 916.75, "x": "なんだか、ぞっとするわね。"}, {"t": 918.5666666666667, "x": "だがそれが狙いだ。"}, {"t": 919.8333333333334, "x": "この声を毎日聞いている人が、どこかにいるはずだ。"}, {"t": 922.9833333333333, "x": "家族か、職場の人か、近所の人か。"}, {"t": 925.8, "x": "その誰かに気づいてもらうためだ。"}, {"t": 927.9166666666666, "x": "声を公開するのは、これが初めて？"}, {"t": 930.3666666666667, "x": "初めてではない。1963年の吉展ちゃん事件でも、\n声は公開された。"}, {"t": 935.5666666666667, "x": "あのときも電話の声が最大の手がかりだった。"}, {"t": 938.4333333333333, "x": "同じやり方を、24年後にもう一度したのね。"}, {"t": 941.6, "x": "そうだ。ただ、24年の間に変わったことがある。"}, {"t": 944.8166666666667, "x": "テレビもラジオも、家の電話も増えた。"}, {"t": 947.0833333333334, "x": "声を届けられる人の数は、ずっと多くなっていた。"}, {"t": 950.3166666666667, "x": "それなら、見つかりそうなのに。"}, {"t": 952.3333333333334, "x": "届く人が多いほど、寄せられる話も多くなる。"}, {"t": 955.35, "x": "似ている、という声はいくらでも集まる。"}, {"t": 957.75, "x": "本物を一つ選ぶのが、大変になるのね。"}, {"t": 960.6833333333333, "x": "そういう面もある。"}, {"t": 961.8, "x": "それでも県警は、声を外に出すほうを選んだ。"}, {"t": 964.65, "x": "持っている手がかりの中で、一番大きかったからだ。"}, {"t": 967.9166666666666, "x": "しまっておいても、誰も気づいてくれないものね。"}, {"t": 970.8166666666667, "x": "そうだ。声は聞かれて初めて手がかりになる。"}, {"t": 973.5333333333333, "x": "公開は町の人の耳を借りるということだ。"}, {"t": 976.2833333333333, "x": "協定のあいだは使えなかった、町の目と耳ね。"}, {"t": 979.4, "x": "そうだ。今度は電話をかけてくる\n誰にでも届けようとした。"}, {"t": 983.5, "x": "結局、声からは何も分からなかったの？"}, {"t": 986.25, "x": "時効のとき、地元の新聞は理由を三つ挙げた。"}, {"t": 989.3, "x": "一つ目。逆探知で発信元を突き止められなかった。"}, {"t": 992.7333333333333, "x": "二つ目。犯人の声の録音テープの、音質が悪かった。"}, {"t": 996.55, "x": "三つ目は物の証拠と有力な目撃の話の少なさだ。"}, {"t": 1000.3333333333334, "x": "音質の悪さ……。"}, {"t": 1001.5833333333334, "x": "1987年の録音は、カセットテープの時代だ。"}, {"t": 1005.35, "x": "電話の声はもともと細い音で届く。"}, {"t": 1007.7166666666667, "x": "そこに公衆電話のまわりの音も入る。"}, {"t": 1010.1833333333333, "x": "車の音とか？"}, {"t": 1011.45, "x": "そうだ。2回目の電話には、\n車の音が入っていたとされる。"}, {"t": 1015.1666666666666, "x": "雑音を除いても、元に無い音は戻らない。"}, {"t": 1018.05, "x": "聞く人が聞けば、分かるかもしれないのに。"}, {"t": 1020.8, "x": "それでも聞き分けるには細い。"}, {"t": 1022.5833333333334, "x": "そして、27秒しかない。"}, {"t": 1024.6833333333334, "x": "短いし、音も悪い。"}, {"t": 1026.3833333333334, "x": "残った手がかりの中で、声は一番大きなものだった。"}, {"t": 1029.7166666666667, "x": "だが一番もろいものでもあった。"}, {"t": 1031.75, "x": "一番大きくて、一番もろい……。"}, {"t": 1033.8666666666666, "x": "声は似ている人がいくらでもいる。"}, {"t": 1035.8333333333333, "x": "指紋のように一人に決まる物ではない。"}, {"t": 1038.15, "x": "誰かを指すことはできても、決めることは難しい。"}, {"t": 1041.2833333333333, "x": "だから慎重にしないといけないのね。"}, {"t": 1043.5666666666666, "x": "そうだ。声が似ているだけで、人を疑ってはいけない。"}, {"t": 1046.85, "x": "これは今、この動画を見ている人にも言えることだ。"}, {"t": 1050.4666666666667, "x": "さっきの、電話局の管内の話に戻っていい？"}, {"t": 1053.65, "x": "いいぞ。"}, {"t": 1054.7666666666667, "x": "4回目の電話も、同じところから？"}, {"t": 1057.2833333333333, "x": "4回目も同じ電話局の管内だったと伝えられている。"}, {"t": 1060.65, "x": "高崎市の北西のほうを受け持つ局だ。"}, {"t": 1063.3, "x": "じゃあ犯人はずっとその辺りにいたってこと？"}, {"t": 1065.9333333333334, "x": "少なくとも電話はそこから掛けていた、とされる。"}, {"t": 1068.9, "x": "そして電話ボックスからだと見られた。"}, {"t": 1071.25, "x": "65台の、どれか。"}, {"t": 1073.0, "x": "そうだ。警察は管内を細かく調べたはずだ。"}, {"t": 1076.0, "x": "だがどのボックスかを一つに絞ったという話は無い。"}, {"t": 1079.2333333333333, "x": "65台という数だけが記録に残ったのね。"}, {"t": 1082.2666666666667, "x": "そうだ。絞り込みはそこから先へ進まなかった。"}, {"t": 1085.4333333333334, "x": "電話ボックスって、毎日たくさんの人が使うものね。"}, {"t": 1088.9666666666667, "x": "そうだ。指紋も何十人分も重なる。"}, {"t": 1091.5333333333333, "x": "日がたてば、そのぶん新しい手が上から触る。"}, {"t": 1094.5166666666667, "x": "時間との競争なのね。"}, {"t": 1096.2333333333333, "x": "誘拐はいつもそうだ。"}, {"t": 1097.6, "x": "子どもを取り戻すまでの時間。"}, {"t": 1099.3833333333334, "x": "手がかりが消えるまでの時間。"}, {"t": 1101.0833333333333, "x": "その二つが同時に進んでいく。"}, {"t": 1103.2, "x": "この事件は両方とも間に合わなかった……。"}, {"t": 1105.6333333333334, "x": "結果だけを見れば、そう言うしかない。"}, {"t": 1107.7833333333333, "x": "だが誰かが怠けたからだとは言わない。"}, {"t": 1110.0666666666666, "x": "仕組みも道具も、その時代のものだった。"}, {"t": 1112.6166666666666, "x": "その中で何ができたかは、\n記録だけでは決められない。"}, {"t": 1116.5333333333333, "x": "事件から半年後。1988年3月22日。"}, {"t": 1120.7, "x": "衆議院の地方行政委員会だ。"}, {"t": 1122.8166666666666, "x": "国会でこの事件の話が出たの？"}, {"t": 1125.1333333333334, "x": "出た。国会の記録を引いて、\n事件の名前が出た発言を探した。"}, {"t": 1129.35, "x": "見つかったのは、この1回だけだ。"}, {"t": 1131.6666666666667, "x": "1回だけ……。"}, {"t": 1132.8, "x": "男の子の名前で引くと、0回になる。"}, {"t": 1135.4166666666667, "x": "ある議員が警察への信頼について質問した。"}, {"t": 1138.3, "x": "前の年の役所の調べを持ち出している。"}, {"t": 1140.7833333333333, "x": "「印象の悪い公共機関、こういうアンケート調査に\nよりますと、最も悪いのは警察署」"}, {"t": 1146.0333333333333, "x": "「昨年はついに\nワースト一位になったわけでございます」"}, {"t": 1149.1833333333334, "x": "警察署が一番印象が悪かったの？"}, {"t": 1151.7, "x": "そういう調査結果が新聞に出た、という質問だ。"}, {"t": 1154.8166666666666, "x": "そして議員は未解決の事件を並べた。"}, {"t": 1157.2833333333333, "x": "「国民を恐怖のどん底に陥れたグリコ・"}, {"t": 1159.7333333333333, "x": "森永事件、この三月十八日で満四年を\n経過したわけでございますが、未解決でございます」"}, {"t": 1165.8, "x": "「また、朝日新聞襲撃事件、\n高崎市幼稚園児誘拐事件も未解決のままでございます」"}, {"t": 1171.6833333333334, "x": "高崎市幼稚園児誘拐事件……。"}, {"t": 1173.85, "x": "これが国会の記録に残った、この事件の呼び方だ。"}, {"t": 1177.2333333333333, "x": "議員はこう続けた。"}, {"t": 1178.5333333333333, "x": "「こうした事件を解決することこそが、国民の警察に\n対する信頼回復の道であろうと思います」"}, {"t": 1184.6666666666667, "x": "大臣は何て答えたの？"}, {"t": 1186.4, "x": "国家公安委員長の、梶山静六だ。"}, {"t": 1189.0, "x": "「国民が期待する未解決重要事件の解決については、\n警察として事件捜査に全力を挙げており」"}, {"t": 1195.2333333333333, "x": "「私も早期解決を図るよう\n督励しているところであります」"}, {"t": 1199.0, "x": "督励……励ましてるってこと？"}, {"t": 1201.1, "x": "上の立場から、急げと強く求める、という意味だ。"}, {"t": 1205.0, "x": "解決しろ、急げ、っていう話なのね。"}, {"t": 1207.7833333333333, "x": "それだけではない。同じ質問にはもう半分がある。"}, {"t": 1210.8166666666666, "x": "議員は未解決の事件を並べたすぐあとに、こう続けた。"}, {"t": 1214.3333333333333, "x": "「また、ここ数年冤罪事件が相次いで\n起きているわけでございます」"}, {"t": 1218.2833333333333, "x": "冤罪……無実の人が罪を着せられること、よね。"}, {"t": 1221.5833333333333, "x": "そうだ。議員は別の事件で冤罪が\n明らかになった例を挙げた。"}, {"t": 1225.2666666666667, "x": "そして原因をこう指摘している。"}, {"t": 1227.2666666666667, "x": "「捜査の上での偏重と予断による\n思い込みが冤罪を生む土壌であることは"}, {"t": 1231.2666666666667, "x": "事件のたびに指摘されているのに」"}, {"t": 1233.2333333333333, "x": "「この種の事件が繰り返されるのは\n一体どういうことなのか」"}, {"t": 1236.6833333333334, "x": "未解決も困るし、冤罪も困る。"}, {"t": 1239.1833333333334, "x": "そうだ。一つの質問の中に、その両方が入っている。"}, {"t": 1242.8333333333333, "x": "犯人を早く見つけろ。だが思い込みで決めるな。"}, {"t": 1245.9333333333334, "x": "それって、すごく難しい注文ね。"}, {"t": 1248.4, "x": "難しい。だがどちらも外せない。"}, {"t": 1250.5333333333333, "x": "急いで誰かを捕まえても、違う人なら何も解決しない。"}, {"t": 1254.25, "x": "本当の犯人はそのまま外にいることになる。"}, {"t": 1257.1333333333334, "x": "しかも無実の人の人生が壊れる。"}, {"t": 1259.5666666666666, "x": "大臣の答えにも、その両方が入っていた。"}, {"t": 1262.4, "x": "「無罪事件等の裁判結果については\nこれを真剣に受けとめ、一層的確、"}, {"t": 1266.9, "x": "適正な捜査を推進していくべきものと考えております」"}, {"t": 1270.5333333333333, "x": "解決を急ぐのと、正しく調べるのと。"}, {"t": 1273.2833333333333, "x": "1988年の春の国会で、この事件は\nその真ん中に置かれていた。"}, {"t": 1278.1833333333334, "x": "この事件では最後まで誰も起訴されていない。"}, {"t": 1280.8, "x": "時効の前に送られた書類も、\n被疑者不詳のままだった。"}, {"t": 1284.35, "x": "未解決のまま、でも誰かを裁いてはいないのね。"}, {"t": 1287.4666666666667, "x": "そういうことだ。それも記録が\n示していることの一つだ。"}, {"t": 1291.5333333333333, "x": "その3週間前にも、梶山静六は事件に触れている。"}, {"t": 1295.1333333333334, "x": "1988年3月1日。"}, {"t": 1297.6166666666666, "x": "同じ委員会での所信だ。"}, {"t": 1299.4333333333334, "x": "所信って？"}, {"t": 1300.5666666666666, "x": "大臣がこれから一年の方針を話すものだ。"}, {"t": 1303.4166666666667, "x": "警察について、こう述べた。"}, {"t": 1305.2833333333333, "x": "「昨年における刑法犯の認知件数は、\n約百五十八万件であり、依然として\n高い水準を示しております」"}, {"t": 1312.15, "x": "「内容的にも、朝日新聞社に"}, {"t": 1314.1333333333334, "x": "対する一連の襲撃事件や\n身の代金目的幼児誘拐殺人事件等の重要凶悪事件が\n相次いで発生し」"}, {"t": 1321.0166666666667, "x": "身の代金目的の、幼児の……。"}, {"t": 1323.25, "x": "ここでは事件の名前は言っていない。"}, {"t": 1325.25, "x": "場所も子どもの名前も出てこない。"}, {"t": 1327.3333333333333, "x": "でも前の年の事件として挙げてるのよね。"}, {"t": 1330.0, "x": "そうだ。ただどの事件かを大臣は言っていない。"}, {"t": 1332.7166666666667, "x": "だからこの回でも、決めつけずに置いておく。"}, {"t": 1335.45, "x": "事件の名前が出ないって、どういうことなの？"}, {"t": 1338.2166666666667, "x": "大きな事件ほど、一つ一つの名前は消えていく。"}, {"t": 1341.3833333333334, "x": "重要凶悪事件、という束ねた言葉になる。"}, {"t": 1344.2166666666667, "x": "数字の中の、一件になる。"}, {"t": 1346.2833333333333, "x": "158万件の中の、一件……。"}, {"t": 1348.7833333333333, "x": "国会は法律や予算を決める場所だ。"}, {"t": 1351.1, "x": "一つの事件の捜査を、細かく話す場所ではない。"}, {"t": 1354.25, "x": "だから名前が出ないのは、おかしなことではない。"}, {"t": 1357.1, "x": "でもちょっとさびしいわね。"}, {"t": 1358.7, "x": "そうかもしれない。"}, {"t": 1359.75, "x": "だから名前が出た1回の発言を、\nこの回では大事に読んだ。"}, {"t": 1364.0833333333333, "x": "国会でいつも朝日新聞の事件と並べられてるわね。"}, {"t": 1367.45, "x": "そうだ。所信でも質問でも、同じ並びだった。"}, {"t": 1370.6333333333334, "x": "時期を確かめると、その理由が見えてくる。"}, {"t": 1373.2333333333333, "x": "警察白書の昭和63年版に、こう書かれている。"}, {"t": 1376.7, "x": "「9月25日、両事件を\n警察庁指定第116号事件に指定した」"}, {"t": 1381.65, "x": "9月25日って、1987年の？"}, {"t": 1385.0666666666666, "x": "そうだ。功明ちゃんがいなくなった日から、11日後だ。"}, {"t": 1388.7, "x": "その年の5月3日、\n兵庫県西宮市の新聞社の支局が襲われていた。"}, {"t": 1393.4833333333333, "x": "そして9月24日、名古屋の新聞社の寮に\n散弾銃が撃たれた。"}, {"t": 1397.7, "x": "この二つを全国で追う事件に指定したのが25日だ。"}, {"t": 1401.3166666666666, "x": "24日と25日って、功明ちゃんの声が\n公開されたころよね。"}, {"t": 1405.7, "x": "そうだ。声の公開が報じられた\n9月23日の、すぐあとだ。"}, {"t": 1409.95, "x": "同じ9月に大きな事件が重なってたのね。"}, {"t": 1412.8166666666666, "x": "そうだ。全国の警察が、二つの方向を向いていた。"}, {"t": 1416.3166666666666, "x": "ちなみにその白書の同じ章をすべて読んだ。"}, {"t": 1419.05, "x": "この事件のことは？"}, {"t": 1420.45, "x": "載っていない。昭和62年の犯罪の特徴の章にも無い。"}, {"t": 1424.15, "x": "保険金目的の事件や、銀行強盗の例は並んでいる。"}, {"t": 1427.7166666666667, "x": "だが高崎の誘拐の記述は、見つからなかった。"}, {"t": 1431.0, "x": "国会では大臣が触れたのに、白書には無いの？"}, {"t": 1434.0833333333333, "x": "白書には捜査中の事件を細かく書かない面がある。"}, {"t": 1437.2833333333333, "x": "犯人に手の内を見せることになるからだ。"}, {"t": 1439.7333333333333, "x": "これは推測だが、未解決の事件ほど\n白書には出にくい。"}, {"t": 1443.45, "x": "記録に残る場所と、残らない場所があるのね。"}, {"t": 1446.4333333333334, "x": "そうだ。この事件は新聞には大きく残った。"}, {"t": 1449.25, "x": "国会には、1回だけ名前が残った。"}, {"t": 1451.8166666666666, "x": "白書には見つかる形では残っていない。"}, {"t": 1454.4166666666667, "x": "どこを開くかで、見え方が変わる……。"}, {"t": 1456.7, "x": "だからこの回は、開いた場所を一つずつ言っている。"}, {"t": 1460.4333333333334, "x": "身代金の誘拐って、ふつうは捕まるものなの？"}, {"t": 1463.6666666666667, "x": "ほとんど捕まる。国会でもそう言われている。"}, {"t": 1466.3166666666666, "x": "事件から12年後。1999年6月29日、\n参議院の法務委員会。"}, {"t": 1471.8333333333333, "x": "電話の通信を聞いて捜査する法律を、審議していた。"}, {"t": 1475.3, "x": "電話を聞く法律？"}, {"t": 1476.7, "x": "通信傍受法だ。国が最初に出した\n案には、誘拐も入っていた。"}, {"t": 1480.8833333333334, "x": "ある議員が、こう質問している。"}, {"t": 1482.9, "x": "「身の代金目的とか営利目的による\n誘拐というのは非常に悲惨な例が多い」"}, {"t": 1487.5833333333333, "x": "「そのかわり検挙実績も九十数\n％と非常に高いんですけれども」"}, {"t": 1492.0333333333333, "x": "九十数パーセント。"}, {"t": 1493.5166666666667, "x": "そうだ。身代金の誘拐は、ほとんどの犯人が捕まる。"}, {"t": 1497.1833333333334, "x": "比べるためにもう一つ数字を出しておく。"}, {"t": 1499.6666666666667, "x": "昭和63年版の警察白書は、\n1986年の殺人の検挙率を載せている。"}, {"t": 1505.6333333333334, "x": "日本は96.7％。比べた欧米の4か国のどこよりも高い。"}, {"t": 1510.4, "x": "殺人でもほとんど捕まってたのね。"}, {"t": 1512.8, "x": "そうだ。事件の前の年の数字だ。"}, {"t": 1515.15, "x": "100件あれば、3件ほどしか残らない計算になる。"}, {"t": 1518.3833333333334, "x": "功明ちゃんの事件は、その残る側に入ってしまった。"}, {"t": 1521.9, "x": "どうして誘拐は、そんなに捕まりやすいの？"}, {"t": 1524.6666666666667, "x": "答えたのは案を直した側の議員だ。"}, {"t": 1526.8833333333334, "x": "誘拐を対象から外した理由を、こう説明した。"}, {"t": 1530.0166666666667, "x": "「誘拐犯にいたしますと大体が\n営利誘拐につながっていきますので」"}, {"t": 1533.9666666666667, "x": "「こちらが捜さなくても逆に向こうの方から\n通話があり、金品の要求があるわけですから」"}, {"t": 1539.2, "x": "犯人のほうから、電話してくる……。"}, {"t": 1541.4333333333334, "x": "そうだ。金を受け取るには、連絡するしかない。"}, {"t": 1544.3833333333334, "x": "連絡すれば、そこに手がかりが生まれる。"}, {"t": 1546.85, "x": "だから身代金の誘拐は、捕まりやすい。"}, {"t": 1549.6833333333334, "x": "でもこの事件は電話が4回もあったのに。"}, {"t": 1552.3166666666666, "x": "そこだ。犯人は電話を掛けた。"}, {"t": 1554.4333333333334, "x": "4回とも短く切っている。"}, {"t": 1556.2666666666667, "x": "そして金を受け取りに来なかった。"}, {"t": 1558.45, "x": "受け取りに来なかったから、\n会う場所も生まれなかった。"}, {"t": 1561.5833333333333, "x": "そういうことだ。九十数パーセントの外側に、\nこの事件はある。"}, {"t": 1566.1166666666666, "x": "捜査は、15年続いた。"}, {"t": 1567.9666666666667, "x": "時効のとき、地元の新聞が数字をまとめている。"}, {"t": 1571.0333333333333, "x": "投入した捜査員は、延べ26万4000人。"}, {"t": 1574.2166666666667, "x": "26万人……。"}, {"t": 1575.4166666666667, "x": "聞き込みをした家は、2万2000世帯。"}, {"t": 1577.85, "x": "調べた不審な人物は、およそ4200人。"}, {"t": 1580.9166666666667, "x": "調べた車はおよそ4万2000台。"}, {"t": 1583.3166666666666, "x": "数字が大きすぎて、ぴんとこない。"}, {"t": 1585.55, "x": "延べ26万4000人を、15年でならしてみる。"}, {"t": 1588.7833333333333, "x": "1年で、1万7000人あまりになる。"}, {"t": 1591.4833333333333, "x": "1日にすると？"}, {"t": 1592.7833333333333, "x": "1日でおよそ48人だ。"}, {"t": 1594.8333333333333, "x": "最初の年に多く、後になるほど少なかったはずだ。"}, {"t": 1598.0833333333333, "x": "だからこれはただの平均だ。"}, {"t": 1600.0, "x": "それでも、15年間ずっと誰かが追ってたのね。"}, {"t": 1603.1166666666666, "x": "そうだ。担当が替わっても、事件は引き継がれる。"}, {"t": 1606.25, "x": "事件の年に入った若い警察官は、15年後には中堅だ。"}, {"t": 1610.4, "x": "4万2000台の車って、どうやって調べるの？"}, {"t": 1613.5166666666667, "x": "目撃された車の話から、持ち主を一台ずつ当たる。"}, {"t": 1617.2, "x": "中身はこの回では言わない。"}, {"t": 1618.8333333333333, "x": "車の色や形を言えば、持っている\n人が疑われかねない。"}, {"t": 1622.55, "x": "そうね。それは避けたい。"}, {"t": 1624.25, "x": "4200人という数も、同じだ。"}, {"t": 1626.7333333333333, "x": "調べられた人の多くは、事件と関係が無かった人だ。"}, {"t": 1630.4166666666667, "x": "疑われた側もいやな思いをしたかもしれない。"}, {"t": 1633.1666666666667, "x": "そういう人も数字の中に入っている。"}, {"t": 1636.1166666666666, "x": "そもそも時効ってなんであるの？"}, {"t": 1638.0833333333333, "x": "犯人を裁くための、期限のことだ。"}, {"t": 1640.4666666666667, "x": "正しくは公訴時効という。"}, {"t": 1642.1333333333334, "x": "決められた年数がたつと、\n検察は裁判にかけられなくなる。"}, {"t": 1645.9833333333333, "x": "どうして期限なんてあるの？"}, {"t": 1647.4333333333334, "x": "悪いことをしたのに。"}, {"t": 1648.95, "x": "その理由はのちの国会でこうまとめられている。"}, {"t": 1651.6166666666666, "x": "2004年11月9日、\n衆議院の法務委員会での、ある議員の質問だ。"}, {"t": 1656.5333333333333, "x": "「時効制度は、時間の経過で処罰感情が薄れて、"}, {"t": 1659.6666666666667, "x": "証拠が散逸して捜査が困難になるというような理由で"}, {"t": 1662.9333333333334, "x": "設けられているのは\n皆様御承知のとおりでございますが」"}, {"t": 1666.0666666666666, "x": "時間がたつと証拠が散らばってしまう……。"}, {"t": 1668.4833333333333, "x": "そうだ。見ていた人の記憶も薄れる。"}, {"t": 1670.8833333333334, "x": "物も無くなる。疑われた人が無実を示す材料も消える。"}, {"t": 1674.7166666666667, "x": "裁く側にも裁かれる側にも、困ることがあるのね。"}, {"t": 1678.1, "x": "そういう考え方だ。だが\n同じ議員は、こうも続けている。"}, {"t": 1681.6333333333334, "x": "「ＤＮＡ鑑定等科学捜査も、\n科学技術も進歩しております」"}, {"t": 1685.8, "x": "技術が進めば、昔の証拠からも分かることが増える。"}, {"t": 1689.3833333333334, "x": "そうだ。古いテープの声も、\nいつか読み解けるかもしれない。"}, {"t": 1692.8833333333334, "x": "時効はその「いつか」を待たずに線を引く。"}, {"t": 1695.75, "x": "功明ちゃんの事件だと、その線は何年だったの？"}, {"t": 1699.0833333333333, "x": "殺人のような重い罪でも、\nその線は15年と決められていた。"}, {"t": 1702.9833333333333, "x": "2004年の審議では、別の議員がこう言っている。"}, {"t": 1705.9833333333333, "x": "「死刑の公訴時効が十五年を二十五年にすると」"}, {"t": 1708.9833333333333, "x": "「今まで十五年で、逃げ回っておれば\n殺人をしても罪にならない、"}, {"t": 1712.7333333333333, "x": "公訴されないということが二十五年になった」"}, {"t": 1715.5333333333333, "x": "15年逃げれば、っていう言い方……。"}, {"t": 1717.6833333333334, "x": "きつい言い方だが、15年の線の意味を\nそのまま言っている。"}, {"t": 1721.1333333333334, "x": "1987年の事件には、この15年の線が引かれていた。"}, {"t": 1726.1333333333334, "x": "2002年9月13日の午前。"}, {"t": 1728.3333333333333, "x": "特別捜査本部は、事件を前橋地検に送った。"}, {"t": 1731.7833333333333, "x": "送ったって、犯人は分からないままよね？"}, {"t": 1734.4666666666667, "x": "そうだ。被疑者不詳のまま、書類を送った。"}, {"t": 1737.4166666666667, "x": "被疑者不詳？"}, {"t": 1738.55, "x": "疑われる人が誰か分からない、という意味だ。"}, {"t": 1741.3, "x": "時効を前に捜査の記録を検察に引き渡す手続きだ。"}, {"t": 1744.9166666666667, "x": "じゃあここで終わり？"}, {"t": 1746.0833333333333, "x": "翌14日の午前0時に、殺人の罪の時効が来た。"}, {"t": 1749.6166666666666, "x": "当時の法律では、死刑に当たる\n罪の時効は15年だった。"}, {"t": 1753.45, "x": "1987年9月14日から、ちょうど15年。"}, {"t": 1757.2833333333333, "x": "そうだ。0時を過ぎれば、\n犯人が見つかっても裁けない。"}, {"t": 1760.6333333333334, "x": "……。"}, {"t": 1761.5666666666666, "x": "地元の新聞はこう書いている。"}, {"t": 1763.4166666666667, "x": "戦後、身代金目的の誘拐殺人で、未解決のまま\n時効を迎えた初めての事件とされる。"}, {"t": 1769.6, "x": "初めて……。"}, {"t": 1770.7333333333333, "x": "九十数パーセントが捕まる種類の事件だ。"}, {"t": 1773.4833333333333, "x": "その中で時効まで届いてしまった。"}, {"t": 1775.8, "x": "声は公開されてたのに、15年で。"}, {"t": 1778.3333333333333, "x": "そうだ。題名にした言葉は、ここから来ている。"}, {"t": 1781.3166666666666, "x": "声は残った。だが声の主にはたどり着かなかった。"}, {"t": 1785.15, "x": "時効から2年後。2004年10月28日、\n参議院の法務委員会。"}, {"t": 1789.8, "x": "法務省の刑事局長が、こう答えている。"}, {"t": 1792.4333333333334, "x": "「凶悪・重大犯罪に対する被害者を\n含む国民の処罰感情などを考えますと、"}, {"t": 1797.55, "x": "最長でも十五年という現在の公訴時効期間は\n短過ぎるというふうに思われます」"}, {"t": 1802.6666666666667, "x": "短過ぎる、って国が言ったのね。"}, {"t": 1804.8833333333334, "x": "そうだ。死刑に当たる罪の時効を、\n15年から25年に延ばす案だ。"}, {"t": 1809.3166666666666, "x": "その案がこの年の国会で審議された。"}, {"t": 1811.9166666666667, "x": "功明ちゃんの事件には？"}, {"t": 1813.6333333333334, "x": "間に合っていない。2年前に\nもう時効が来ていたからだ。"}, {"t": 1816.8166666666666, "x": "同じ年の衆議院では、ある議員がこう述べた。"}, {"t": 1819.6333333333334, "x": "「犯罪被害者及びその遺族にとりましては、\n何年たっても事件は終わりません」"}, {"t": 1824.3833333333334, "x": "何年たっても終わらない……。"}, {"t": 1826.0, "x": "この議員は、時効のあとに犯人が\n名乗り出る場面を挙げている。"}, {"t": 1829.6, "x": "「その人は楽になるかもしれない」"}, {"t": 1831.6, "x": "「しかし、そうすると、遺族、被害者」"}, {"t": 1834.2, "x": "「この憎しみ、苦しみをどこへ、"}, {"t": 1835.9833333333333, "x": "法の裁きも受けない、どこへぶつければいいのか、\n本当につらいものだと思います」"}, {"t": 1840.9166666666667, "x": "時効が来たら、犯人だけが\n楽になるかもしれない……。"}, {"t": 1844.1666666666667, "x": "そういう問いかけだ。"}, {"t": 1845.3666666666666, "x": "国はこの年、延ばす答えを出した。だが\n無くしはしなかった。"}, {"t": 1849.1666666666667, "x": "そして2010年4月27日、衆議院の法務委員会。"}, {"t": 1853.0333333333333, "x": "法務大臣の千葉景子が、こう答えている。"}, {"t": 1855.6666666666667, "x": "「今回の法律が成立をするとすれば、\n殺人罪の公訴時効は廃止」"}, {"t": 1860.1166666666666, "x": "時効そのものが、無くなったのね。"}, {"t": 1862.4333333333334, "x": "そうだ。この話の中身は、前に別の回で詳しく扱った。"}, {"t": 1866.45, "x": "ここで言いたいのは一つだけだ。"}, {"t": 1868.3333333333333, "x": "15年が短過ぎると言われたのは、\nこの事件の時効のあとだった。"}, {"t": 1872.45, "x": "……順番が逆だったのね。"}, {"t": 1874.1333333333334, "x": "法律は多くの場合あとから変わる。"}, {"t": 1876.1833333333334, "x": "それを責めることは、この回ではしない。"}, {"t": 1879.1333333333334, "x": "2017年9月8日から、地元の上毛新聞が連載を組んだ。"}, {"t": 1883.4333333333334, "x": "題は「迫る未解決30年」。全5回だ。"}, {"t": 1886.6166666666666, "x": "事件から30年なのね。"}, {"t": 1888.4833333333333, "x": "取り上げたのは、1987年9月の群馬の二つの事件だ。"}, {"t": 1892.9333333333334, "x": "どちらも時効を迎えている。"}, {"t": 1894.7, "x": "時効のあとでも、記事にしたのね。"}, {"t": 1896.9666666666667, "x": "そうだ。新聞協会報が、その取材のことを伝えている。"}, {"t": 1900.6333333333334, "x": "ご遺族の願いは、静かにしておいてもらうことだった。"}, {"t": 1903.8333333333333, "x": "記者はその気持ちを分かったうえで、話をした。"}, {"t": 1906.7, "x": "事件を次の世代に伝える\n意味を、粘り強く伝えたという。"}, {"t": 1910.4, "x": "伝えたい側と静かにしていたい側……。"}, {"t": 1912.7666666666667, "x": "どちらも間違ってはいない。"}, {"t": 1914.3666666666666, "x": "連載には当時の高崎署長も出てくる。"}, {"t": 1916.9166666666667, "x": "当時の日記を手がかりに、記憶をたどったという。"}, {"t": 1919.9166666666667, "x": "日記が残ってたのね。"}, {"t": 1921.55, "x": "30年前のことを、記憶だけで話すのは難しい。"}, {"t": 1924.8166666666666, "x": "記録が残っていたから、話せたことがある。"}, {"t": 1927.5333333333333, "x": "番外編では作家の横山秀夫が語っている。"}, {"t": 1930.4666666666667, "x": "事件の当時、上毛新聞の記者として\n県警を担当していた。"}, {"t": 1934.4, "x": "語ったのは事件への怒りとやるせなさだったという。"}, {"t": 1937.4333333333334, "x": "記者として、近くで見てたのね。"}, {"t": 1939.6833333333334, "x": "そうだ。30年たっても、消えない\n思いがあったということだ。"}, {"t": 1943.35, "x": "時効は裁くための時間を終わらせる。"}, {"t": 1945.5333333333333, "x": "だが覚えている人の時間までは終わらせない。"}, {"t": 1948.2166666666667, "x": "30年たっても、記事を書く人がいるのね。"}, {"t": 1951.1166666666666, "x": "協会報は記者の思いもこう伝えている。"}, {"t": 1953.5333333333333, "x": "同じような事件を二度と\n起こさないために、伝え続けたい。"}, {"t": 1956.9666666666667, "x": "時効で裁判は無くなった。"}, {"t": 1958.6666666666667, "x": "だが次の子を守るために使える記録は残っている。"}, {"t": 1961.8666666666666, "x": "記録を残すのも、事件の続きなのね。"}, {"t": 1965.15, "x": "ねえ、もう一回27秒の話をしていい？"}, {"t": 1968.0, "x": "いいぞ。"}, {"t": 1969.1333333333334, "x": "あの声は今もどこかで聞けるの？"}, {"t": 1971.1833333333334, "x": "録音は今もインターネットで聞ける\n状態にあると書く資料がある。"}, {"t": 1974.7833333333333, "x": "ただ、どこで流れているものが\n元の録音かは、この回では確かめていない。"}, {"t": 1979.3666666666666, "x": "だから場所は言わないのね。"}, {"t": 1981.05, "x": "そうだ。そして聞く人に、一つだけ頼みたい。"}, {"t": 1984.1666666666667, "x": "似ていると思っても、身近な誰かを疑わないでほしい。"}, {"t": 1987.4166666666667, "x": "声は一人に決まる証拠ではない。"}, {"t": 1989.4166666666667, "x": "時効のあとでは、確かめる手続きも無い。"}, {"t": 1992.1166666666666, "x": "疑われた人は晴らす場所も無いのね。"}, {"t": 1994.5833333333333, "x": "そういうことだ。"}, {"t": 1995.5833333333333, "x": "この回で追ったのは、電話の線だった。"}, {"t": 1998.0, "x": "4回の電話。人の手でたどる交換機。"}, {"t": 2000.65, "x": "65台の電話ボックス。音の悪いテープ。"}, {"t": 2003.4833333333333, "x": "九十数パーセントの外側。そして15年。"}, {"t": 2006.5, "x": "どれも少しずつ届かなかった。"}, {"t": 2008.6166666666666, "x": "そうだ。一つが悪かったのではない。"}, {"t": 2010.8833333333334, "x": "小さな「届かない」が、いくつも重なった。"}, {"t": 2013.6666666666667, "x": "……。"}, {"t": 2014.6, "x": "犯人は今も分かっていない。"}, {"t": 2016.3166666666666, "x": "裁く道は、2002年9月14日の0時に閉じた。"}, {"t": 2019.8, "x": "それでも、1987年9月の高崎で何があったか。"}, {"t": 2023.9833333333333, "x": "記録をたどれば、ここまでは言える。"}, {"t": 2026.15, "x": "声だけが残ったのね。"}, {"t": 2027.7333333333333, "x": "声だけが残った。"}, {"t": 2029.0, "x": "そしてその声を15年追い続けた\n人たちの数字が残った。"}, {"t": 2032.8166666666666, "x": "延べ26万4000人……。"}, {"t": 2034.6166666666666, "x": "今回は功明ちゃん誘拐事件の電話を、\n記録から追った回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
