<script>
const D={"name": "084", "file": "084_編集用", "dur": 1722.0, "segs": [], "subs": [{"t": 0.0, "x": "一九八五年八月十二日。"}, {"t": 2.6333333333333333, "x": "日本航空百二十三便は、十八時十二分に\n東京国際空港を離陸した。"}, {"t": 7.65, "x": "行き先は大阪国際空港。"}, {"t": 9.45, "x": "乗客五百九人、乗員十五人、\nあわせて五百二十四人が乗っていた。"}, {"t": 14.116666666666667, "x": "離陸から十二分後、十八時二十四分三十五秒。"}, {"t": 17.55, "x": "「ドーン」というような音とともに、飛行の継続に\n重大な影響を及ぼす異常事態が発生した。"}, {"t": 23.15, "x": "そこから墜落まで、およそ三十二分。"}, {"t": 25.8, "x": "三十二分も、飛んでいたのね。"}, {"t": 27.95, "x": "ああ。記録に残る最後の音は、\n五十六分二十六秒の衝撃音。"}, {"t": 31.983333333333334, "x": "報告書は、墜落を十八時五十六分ごろとしている。"}, {"t": 35.56666666666667, "x": "場所は群馬県多野郡上野村の山中。"}, {"t": 37.9, "x": "亡くなったのは五百二十人。"}, {"t": 39.61666666666667, "x": "生き残ったのは四人だった。"}, {"t": 41.5, "x": "この事故を扱った動画は、山ほどある。"}, {"t": 43.983333333333334, "x": "たいていは二つに分かれる。"}, {"t": 45.416666666666664, "x": "原因は圧力隔壁の修理ミス、と一行で片づけるか。"}, {"t": 49.15, "x": "あるいは、報告書は嘘だ、本当の原因は\n別にある、という方向へ振れるか。"}, {"t": 53.95, "x": "今回はどっちなの。"}, {"t": 55.36666666666667, "x": "どちらもやらない。"}, {"t": 56.45, "x": "今回追うのは、\n事故調査報告書そのものの「言葉づかい」だ。"}, {"t": 60.5, "x": "報告書は、何をどこまで認定して、\nどこから先を「推定」と書いたのか。"}, {"t": 65.38333333333334, "x": "そして、はっきり「\n明らかにすることはできなかった」と\n書いた場所が、どこにあるのか。"}, {"t": 70.65, "x": "先に断っておく。この回で私は、報告書を否定しない。"}, {"t": 74.36666666666666, "x": "別の原因を示唆することもしない。"}, {"t": 77.2, "x": "日本の事故調査報告書は、書き手が思っている\n確からしさを、言葉づかいで区別している。"}, {"t": 82.73333333333333, "x": "これは私の読み方ではない。"}, {"t": 84.36666666666666, "x": "国が公表している文書に、そう書いてある。"}, {"t": 87.08333333333333, "x": "二〇一一年七月、運輸安全委員会が\n「解説」という文書を出している。"}, {"t": 92.01666666666667, "x": "この百二十三便の報告書について、\n遺族の疑問に答えるために作られた。"}, {"t": 96.81666666666666, "x": "その中に、こういう表がある。読む。"}, {"t": 99.1, "x": "「断定できる場合」は、認められる。"}, {"t": 101.4, "x": "「断定できないが、ほぼ間違いない\n場合」は、推定される。"}, {"t": 105.01666666666667, "x": "「可能性が高い場合」は、考えられる。"}, {"t": 107.56666666666666, "x": "「可能性がある場合」は、可能性が考えられる。"}, {"t": 110.61666666666666, "x": "四段階に分かれているのね。"}, {"t": 112.55, "x": "ああ。四つの階段だ。\nそして同じ文書は、こう書いている。"}, {"t": 116.25, "x": "「本事故の場合の原因については、"}, {"t": 118.13333333333334, "x": "『推定される』を使用しているため、\n断定できないが、ほぼ間違いない場合にあたります」"}, {"t": 123.46666666666667, "x": "じゃあ、原因は断定されていないってこと？"}, {"t": 126.06666666666666, "x": "言葉のうえでは、そうだ。"}, {"t": 127.65, "x": "ただし、これは何かを隠したという話ではない。"}, {"t": 130.45, "x": "同じ文書は、その理由も書いている。"}, {"t": 132.81666666666666, "x": "「不確かなことは書かない」という、\nICAO、国際民間航空機関の考え方に\n沿って作られている、と。"}, {"t": 139.53333333333333, "x": "その結果として、原因の欄が\n「推定される」で終わっている。ここが、今回の芯だ。"}, {"t": 145.63333333333333, "x": "一九七八年六月二日、大阪国際空港。"}, {"t": 149.55, "x": "日本航空百十五便が着陸するとき、\n機体の尾部を滑走路の面に接触させた。"}, {"t": 154.76666666666668, "x": "いわゆる、しりもち事故だ。"}, {"t": 156.41666666666666, "x": "このとき損傷したのが、後部圧力隔壁だった。"}, {"t": 159.83333333333334, "x": "あつりょくかくへき、って何かしら。"}, {"t": 162.03333333333333, "x": "飛行機の胴体の、いちばん\n後ろをふさいでいる壁のことだ。"}, {"t": 165.5, "x": "高いところを飛ぶとき、客室の中は地上に近い\n気圧に保たれている。これを与圧という。"}, {"t": 170.96666666666667, "x": "この壁から後ろは、与圧されていない。"}, {"t": 173.4, "x": "そして、このとき尾部を打ったのが、\n機体記号JA8119の機体だった。"}, {"t": 178.5, "x": "それって。"}, {"t": 179.36666666666667, "x": "ああ。七年後に墜落する、あの機体だ。"}, {"t": 182.06666666666666, "x": "機種はボーイング式747SR-100型。"}, {"t": 185.35, "x": "一九七四年の製造だ。"}, {"t": 187.61666666666667, "x": "末尾のSRは短距離の意味で、離陸と着陸を\n何度も繰り返す使い方を前提に作られた型だ。"}, {"t": 193.56666666666666, "x": "国際線の機体より補強されている。"}, {"t": 196.0, "x": "日本航空の専務取締役は、\nのちに国会でこう述べている。"}, {"t": 199.88333333333333, "x": "自社のSRは、ボーイング747の全体の中でも、\n離着陸の回数が多いグループに属している、と。"}, {"t": 207.31666666666666, "x": "しりもち事故のあと、機体は修理された。"}, {"t": 209.83333333333334, "x": "修理したのは、この飛行機を作ったボーイング社だ。"}, {"t": 212.88333333333333, "x": "日本航空が所有者としてボーイング社に作業を委託し、\n日本航空がその作業を監督する、という形だった。"}, {"t": 219.55, "x": "日本航空は航空法にもとづいて、\n運輸省に修理改造検査を申請した。"}, {"t": 224.28333333333333, "x": "国が検査するのね。"}, {"t": 225.81666666666666, "x": "ああ。当時の運輸省航空局技術部長は、\n国会でこう説明している。"}, {"t": 230.25, "x": "修理計画の妥当性を審査し、"}, {"t": 232.15, "x": "修理過程の作業の管理の方法を見て、でき上がった\nあとの地上機能試験と飛行試験に立ち会った、と。"}, {"t": 238.41666666666666, "x": "「最終的に修復作業は完了し、もとの状態に\n復した、こういう判定を行ったのでございます」"}, {"t": 244.4, "x": "つまり、国はこの修理に合格を出している。"}, {"t": 247.08333333333334, "x": "同じ答弁の続きで、技術部長はこうも言っている。"}, {"t": 250.23333333333332, "x": "「結果として、ボーイング社の声明にありますように、"}, {"t": 253.05, "x": "作業ミスが内在したことは"}, {"t": 254.7, "x": "大変遺憾なことでございまして、日本航空の監督体制が\n不十分だったと言わざるを得ないかと思います」"}, {"t": 261.01666666666665, "x": "合格を出したことについては、何も言っていないのね。"}, {"t": 264.3, "x": "では、その作業ミスとは何だったのか。\nここからが、この回でいちばん大事なところだ。"}, {"t": 270.1, "x": "一九八七年八月十九日、衆議院運輸委員会。"}, {"t": 274.1333333333333, "x": "日本航空の常務取締役、十時覚が参考人として\n呼ばれ、修理の中身を説明している。"}, {"t": 280.21666666666664, "x": "まず、圧力隔壁の下半分を交換した。"}, {"t": 283.21666666666664, "x": "新しい下半分と、残った上半分を、\nつなぎ合わせる作業になる。"}, {"t": 287.43333333333334, "x": "ここで問題が起きた。原文を読む。"}, {"t": 289.73333333333335, "x": "「修理ミスが起こった部分と申しますのは、\nその穴をつないでいった場合に、"}, {"t": 293.75, "x": "エッジマージン、すなわち機材の\nへりとリベットの穴との距離が\n十分でない部分がございまして」"}, {"t": 299.03333333333336, "x": "「その部分につきましてスプライス・プレートといいます\n継ぎ板を入れた部分がございます。それによって"}, {"t": 304.46666666666664, "x": "起こったわけでございます。その継ぎ\n板の入れ方がまずかったわけでございます」"}, {"t": 308.85, "x": "つぎいた。"}, {"t": 309.7, "x": "ああ。二枚の板をつなぐとき、あいだに\nもう一枚はさむ板のことだ。"}, {"t": 313.6666666666667, "x": "計画では、この継ぎ板を、リベットを\n二列打って留めることになっていた。"}, {"t": 317.9, "x": "リベットというのは、板をつなぎ止める鋲だ。"}, {"t": 320.35, "x": "二列で留めれば、力は二列に分かれて掛かる。"}, {"t": 323.5, "x": "ところが実際には、この継ぎ板が切断されていた。"}, {"t": 326.71666666666664, "x": "その結果、継ぎ板として効いている\nリベットは、一列だけになった。"}, {"t": 330.9166666666667, "x": "二列で持たせるはずのものが、一列になったのね。"}, {"t": 334.15, "x": "ああ。掛かる力は変わらない。"}, {"t": 335.85, "x": "受けるところだけが半分になった。"}, {"t": 338.0, "x": "報告書は、この一列のリベットの結合部分に、\n疲労亀裂が多数発見された、と書いている。"}, {"t": 344.51666666666665, "x": "ここで当然出てくる疑問を、同じ日の国会で\n河村勝という委員が突いている。"}, {"t": 349.28333333333336, "x": "二列のリベットで打つという修理計画があったのに、\n一列でしか打たれていなかった。"}, {"t": 354.0833333333333, "x": "立ち会ったときでも、引き渡しの確認のときでも、\n一列か二列かは見れば分かる話でしょう、と。"}, {"t": 360.1, "x": "それは、そう思うわね。"}, {"t": 361.7, "x": "だが、答えは違った。"}, {"t": 363.15, "x": "十時常務の答弁を、そのまま読む。"}, {"t": 365.51666666666665, "x": "「リベットは全部二列に\n打たれておりました。すなわち、"}, {"t": 368.46666666666664, "x": "外から見ました限りにおきましては\nリベットの列の数は正常であります」"}, {"t": 372.78333333333336, "x": "「それで、一列しか通っていなかったという部分は、"}, {"t": 375.6666666666667, "x": "先ほど申し上げました継ぎ板、\nこれを切断しておったために、"}, {"t": 379.31666666666666, "x": "継ぎ板としましては一列しか\n通っていないということになります」"}, {"t": 383.1, "x": "「すなわち、繰り返しますけれども、\n外観から見ましたリベットの数は正常でありました」"}, {"t": 388.3666666666667, "x": "外から見たら、ちゃんと二列に見えていたの。"}, {"t": 391.15, "x": "ああ。リベットの頭は、たしかに二列ならんでいた。"}, {"t": 394.26666666666665, "x": "ならんでいたが、そのうち一列は、切られた継ぎ\n板の向こうの、何もないところを留めていた。"}, {"t": 399.65, "x": "ここが、この事故のいちばん\n冷たいところだと私は思っている。"}, {"t": 403.3666666666667, "x": "目に見える形で残っていれば、七年のあいだに\nどこかで止められたかもしれない。"}, {"t": 408.56666666666666, "x": "修理のあと、機体は七年にわたって飛び続けた。"}, {"t": 411.7, "x": "そのあいだ、定期的な点検を\n受け、そのつど合格している。"}, {"t": 415.5, "x": "点検の方法は、目視点検だった。\nつまり、人が目で見て亀裂をさがす。"}, {"t": 420.43333333333334, "x": "目で見るだけで足りるものなの。"}, {"t": 422.3, "x": "足りる、という前提があった。"}, {"t": 423.93333333333334, "x": "技術部長は、国会でこう説明している。読む。"}, {"t": 427.15, "x": "「亀裂はかなり進行の速度が\n遅いものであるということが設計の時点で"}, {"t": 431.18333333333334, "x": "確認をされておるわけでございますので」"}, {"t": 433.3666666666667, "x": "「そういう遅い亀裂、例えばこの場合ですと、"}, {"t": 435.8833333333333, "x": "後部圧力隔壁でございますと四十数センチになっても\nまだ圧力隔壁は正常な状態でもつ、"}, {"t": 441.6, "x": "亀裂が起こってももつというような\n設計になっておるという前提がございまして」"}, {"t": 445.98333333333335, "x": "「そういう前提でいきますと、目視で十分発見できる」"}, {"t": 449.48333333333335, "x": "四十数センチ。かなり長くなっても持つのね。"}, {"t": 452.5, "x": "ところが、と技術部長は続ける。"}, {"t": 454.55, "x": "「今回の場合はたまたまリベットの穴の周りに非常に"}, {"t": 457.46666666666664, "x": "多数の小さな亀裂が発生をいたしまして、\nそれが一気に破壊につながったということで」"}, {"t": 462.6166666666667, "x": "「そういうことまでは"}, {"t": 463.68333333333334, "x": "設計の段階で想定をされてなかったということが\n一番の原因ではないかというふうに思っております」"}, {"t": 469.18333333333334, "x": "一本の長い亀裂ではなく、"}, {"t": 470.8333333333333, "x": "小さな亀裂がリベットの穴のまわりにたくさん\n出た。それが横につながって、一気にいった。"}, {"t": 476.26666666666665, "x": "報告書はこのことを、亀裂が点検整備で\n発見されなかったことも関与している、と書いている。"}, {"t": 482.55, "x": "一九八五年八月十二日。お盆の前日だ。"}, {"t": 486.3, "x": "この日、JA8119は福岡から飛来し、\n十七時十二分に東京国際空港へ着陸。"}, {"t": 492.5, "x": "折り返しの点検を受け、\n大阪行きの百二十三便になる。"}, {"t": 496.3, "x": "十八時十二分、滑走路15Lから離陸した。"}, {"t": 499.43333333333334, "x": "報告書の時系列表はこう書いている。"}, {"t": 501.6333333333333, "x": "「高度二万三千九百フィートに達するまで\n異常な飛行を示す記録はない」"}, {"t": 506.03333333333336, "x": "十八時二十四分三十五秒。"}, {"t": 508.03333333333336, "x": "時系列表の言葉を、そのまま読む。"}, {"t": 510.51666666666665, "x": "「巡航高度二万四千フィートに到達する直前、"}, {"t": 513.4166666666666, "x": "伊豆半島南部の東岸上空に差し掛かるころ、"}, {"t": 516.1666666666666, "x": "『ドーン』というような音とともに飛行の継続に\n重大な影響を及ぼす異常事態が発生」"}, {"t": 521.2333333333333, "x": "飛行記録装置には、前向きに大きな衝撃力が\n働いたことが記録されている。"}, {"t": 526.1833333333333, "x": "この加速度は、\nおよそ十一トンの前向きの外力に相当する。"}, {"t": 530.1333333333333, "x": "十一トン。前へ押す力ね。"}, {"t": 532.1833333333333, "x": "ああ。一秒後の三十六秒。"}, {"t": 534.0, "x": "ペダルが右いっぱいを示すが、これに\n対応する機体の応答は見られない。"}, {"t": 538.2333333333333, "x": "報告書はここに一行、こう書いている。"}, {"t": 540.5, "x": "「方向操縦系統に異常が生じた」"}, {"t": 542.8166666666667, "x": "二秒後の三十七秒。警報音が\n約一秒間、三回だけ鳴る。"}, {"t": 546.9166666666666, "x": "九秒後の四十四秒。客室で自動放送が始まった。"}, {"t": 550.5833333333334, "x": "あらかじめ録音された緊急時の放送で、客室の気圧が\n一万四千フィート相当まで下がると作動する。"}, {"t": 556.9833333333333, "x": "同時に、天井から酸素マスクが落ちる。"}, {"t": 559.6, "x": "九秒で、客室の気圧がそこまで下がったってこと。"}, {"t": 563.0333333333333, "x": "記録のうえでは、そうなる。"}, {"t": 565.3333333333334, "x": "報告書が、客室の状況について\n認定していることを整理しておく。"}, {"t": 569.5833333333334, "x": "一つ。生存者の口述によれば、\n客室内に霧が発生した。"}, {"t": 573.8333333333334, "x": "二つ。酸素マスクが落下し、自動放送が流れた。"}, {"t": 577.35, "x": "三つ。与圧室の内側に取り付けられていた\n断熱材が、与圧室の外で見つかった。"}, {"t": 582.8333333333334, "x": "墜落地点からおよそ五百十メートル離れたところに、\n水平尾翼がほぼ一体のまま落ちていた。"}, {"t": 588.6333333333333, "x": "その内部などから、客室にあったはずの断熱材が\n相当量、見つかっている。"}, {"t": 593.4333333333333, "x": "これは、飛行中に後部圧力隔壁が壊れて、\nそこから空気が抜けていったことを示している。"}, {"t": 599.2, "x": "霧のほうも同じだ。閉じこめられていた空気が\n急に広がると、温度が下がる。断熱膨張という。"}, {"t": 605.1333333333333, "x": "報告書は、この現象を、事故原因を\n推定した根拠の一つに挙げている。"}, {"t": 609.8333333333334, "x": "壊れたところを直接見なくても、客室で\n起きたことから逆にたどれるのね。"}, {"t": 614.5833333333334, "x": "そういう組み立てになっている。"}, {"t": 616.8833333333333, "x": "圧力隔壁が壊れたのなら、客室には\n猛烈な風が吹き抜けるはずだ。"}, {"t": 621.45, "x": "ところが生存者は、そんなものはなかったと\n述べている。おかしいのではないか、という疑問だ。"}, {"t": 626.85, "x": "たしかに、映画だとすごい風が吹くわよね。"}, {"t": 629.6166666666667, "x": "その映画のイメージこそが\n違う、というのが国の説明だ。"}, {"t": 633.05, "x": "報告書の付録には、こう書いてある。読む。"}, {"t": 635.7666666666667, "x": "「隔壁を通過する空気流量から\n客室内の平均風速を推定できる。"}, {"t": 640.0666666666667, "x": "客室断面積を十九・六平方メートルとすると\n風速はほぼ秒速十メートルとなる」"}, {"t": 645.6666666666666, "x": "秒速十メートルって、どれくらいなの。"}, {"t": 648.2166666666667, "x": "時速にすると三十六キロだ。"}, {"t": 650.2, "x": "解説は、これを「一般道を比較的ゆっくり走る車から\n手を出したときに感じる風」と言いかえている。"}, {"t": 656.65, "x": "しかも、この風が吹いていたのは、\nおよそ七秒のあいだだ。"}, {"t": 660.1833333333333, "x": "プールの排水口と同じだ。"}, {"t": 661.7833333333333, "x": "口のすぐそばは激しく吸いこむが、\n一メートル離れるとほとんど感じない。"}, {"t": 666.0666666666667, "x": "流れの断面が広がるぶんだけ、速さは落ちる。"}, {"t": 669.1833333333333, "x": "これは理屈だけの話ではない。実例がある。"}, {"t": 671.9833333333333, "x": "二〇〇九年七月十三日、アメリカ。"}, {"t": 674.55, "x": "三万五千フィートを\n飛行中の旅客機の客室の天井に、穴が開いた。"}, {"t": 679.2333333333333, "x": "この機体には、非番の機長が\n二人、客として乗っていた。"}, {"t": 682.9333333333333, "x": "その証言が、アメリカの国家運輸安全委員会の記録に\n残っている。読む。"}, {"t": 687.5833333333334, "x": "「私は、すぐに急減圧を知覚したが、\n耳の苦痛がほとんどないのに驚いた」"}, {"t": 692.5, "x": "「ハリウッド映画と違い、何も飛ばされず、\n誰も穴に吸い込まれることはなかった。"}, {"t": 697.05, "x": "座席に置かれた書類もそのままだった」"}, {"t": 699.45, "x": "「客室がやや冷え、薄い\n霧を見たが五秒ほどで消滅した」"}, {"t": 703.2166666666667, "x": "書類もそのまま。"}, {"t": 704.5166666666667, "x": "ああ、急減圧を経験した機長自身の言葉だ。"}, {"t": 707.4333333333333, "x": "温度も同じで、基準の想定では気温は\nマイナス四十度近くまで一気に下がる。"}, {"t": 712.2833333333333, "x": "解説の計算では、室温はおよそ二分後に〇度、\n三分後に十度、五分後に二十度まで戻る。"}, {"t": 718.0333333333333, "x": "座席も天井も、二十五度のままだ。"}, {"t": 720.6, "x": "酸素マスクが落ちてきてそれを着けている状況で、"}, {"t": 723.35, "x": "温度の低下に気づかなかったとしても\n不思議ではない。これが、国の説明だ。"}, {"t": 728.6166666666667, "x": "十八時二十五分二十一秒。"}, {"t": 730.5166666666667, "x": "機長から東京コントロールに要求が入る。"}, {"t": 733.1666666666666, "x": "そして十八時二十六分ごろ、機体に顕著な\nフゴイド運動とダッチロール運動が発生する。"}, {"t": 738.7333333333333, "x": "ふごいど、と、だっちろーる。"}, {"t": 740.6, "x": "フゴイドは機首が上下に振れて\n高度が波のように上下する動き、"}, {"t": 744.05, "x": "ダッチロールは左右に揺れながら\n横滑りと傾きが交互に出る動きだ。"}, {"t": 748.2333333333333, "x": "報告書は、これを抑えるような操作が\n行われているが全く効いていない、と書いている。"}, {"t": 753.3, "x": "そして、こう続く。「これは、墜落直前まで継続」"}, {"t": 756.8333333333334, "x": "十八時二十八分三十五秒、機長は管制に\n「現在、操縦不能」と回答している。"}, {"t": 762.5333333333333, "x": "原因は、油圧だ。"}, {"t": 763.95, "x": "この機種は四つの油圧系統で舵を動かす。"}, {"t": 766.5833333333334, "x": "四つある、というのが安全のしくみだった。"}, {"t": 769.2333333333333, "x": "その四つが、すべて失われた。"}, {"t": 771.4, "x": "垂直尾翼が壊れたとき、そこを通っていた\n配管がいっしょに切れたからだ。"}, {"t": 775.9666666666667, "x": "四つあっても、同じところを\n通っていたら意味がないのね。"}, {"t": 779.3833333333333, "x": "ああ。事故のあと、少なくとも一系統が\n生き残るよう、遮断弁を付ける改修が指示された。"}, {"t": 785.6333333333333, "x": "報告書には、四章結論という部分がある。\nその中に、こう書かれた一節がある。読む。"}, {"t": 791.1833333333333, "x": "「異常事態発生後間もなく、運航乗務員は\n機内の減圧を知り得たものと考えられる」"}, {"t": 796.25, "x": "「運航乗務員は最後まで"}, {"t": 798.15, "x": "酸素マスクを着用しなかったものと\n推定されるが、その理由を"}, {"t": 801.3, "x": "明らかにすることはできなかった」"}, {"t": 803.3666666666667, "x": "明らかにすることはできなかった。"}, {"t": 805.5166666666667, "x": "ああ。推定される、でもない。"}, {"t": 807.25, "x": "考えられる、でもない。"}, {"t": 808.6833333333333, "x": "分からなかった、と書いてある。"}, {"t": 810.6833333333333, "x": "これが、今回の題に入れた三か所の、一つ目だ。"}, {"t": 813.95, "x": "報告書が事実として認定したのは、こうだ。"}, {"t": 816.7166666666667, "x": "客室高度の警報と計器は、\n航空機関士の計器盤にある。"}, {"t": 820.7166666666667, "x": "だから航空機関士は、減圧を\n知ることができたと考えられる。"}, {"t": 824.5666666666667, "x": "しかし、音声記録には、減圧という\n緊急事態を宣言する呼称の記録がない。"}, {"t": 829.55, "x": "したがって、減圧の際に当面とるべき\n措置も行われなかったものと考えられる。"}, {"t": 834.45, "x": "そして報告書は、航空機関士から二度にわたって\n酸素マスクの着用が提案されたのに、"}, {"t": 839.6666666666666, "x": "機長はいずれも「はい」と答えたのみで、\nその措置をとらなかったとみられる、と"}, {"t": 844.0, "x": "記している。"}, {"t": 845.1666666666666, "x": "提案は、あったのね。"}, {"t": 846.75, "x": "あった。記録に残っている。だが、着けられなかった。"}, {"t": 850.1, "x": "なぜかは、分からない。"}, {"t": 851.4, "x": "報告書はそう書いた。"}, {"t": 853.55, "x": "「明らかにすることはできなかった」と\n書かれた場所の、二つ目。緊急降下だ。"}, {"t": 858.4, "x": "機内の与圧が失われたら、酸素が要らない\n高さまで降りるのが決められた手順になる。"}, {"t": 863.4166666666666, "x": "その安全高度は、一万三千フィートだ。"}, {"t": 866.0833333333334, "x": "ところが機長が管制に求めたのは、\n二万二千フィートへの降下だった。"}, {"t": 870.3166666666667, "x": "これは緊急降下とは言えない高さだ。"}, {"t": 872.6166666666667, "x": "そして飛行記録によれば、機体が実際に\n降下を始めたのは十八時四十分以降だった。"}, {"t": 878.2666666666667, "x": "異常が起きてから、十五分以上あとね。"}, {"t": 880.85, "x": "ああ。報告書は、この飛行をこう書いている。"}, {"t": 883.5166666666667, "x": "「与圧なしで約十八分間高度二万フィート以上の高度で"}, {"t": 886.85, "x": "飛行を継続したが、その理由を\n明らかにすることはできなかった」"}, {"t": 890.6666666666666, "x": "そのうえで報告書は、考えられることを添えている。"}, {"t": 893.6666666666666, "x": "異常事態の発生初期には原因の探求に、その後は"}, {"t": 896.9, "x": "飛行姿勢の安定のための操作に専念しており、\n緊急降下に移行しなかったことが考えられる、と。"}, {"t": 902.85, "x": "そして、こうも書いている。"}, {"t": 904.4666666666667, "x": "運航乗務員は、教育・訓練及び知識・\n経験の範囲外にある異常事態に"}, {"t": 909.2166666666667, "x": "陥り、その内容を十分に把握できなかったために、\n対応を判断できないまま、"}, {"t": 913.8, "x": "飛行を安定させる操作に専念したものと考えられる。"}, {"t": 917.3166666666667, "x": "訓練の外にあったのね。"}, {"t": 919.0833333333334, "x": "ああ。四つの油圧が全部なくなった機体をどう\n飛ばすか、という手順は、そもそも存在しなかった。"}, {"t": 925.6, "x": "「明らかにすることはできなかった」の、\n三つ目。警報音だ。"}, {"t": 929.4333333333333, "x": "異常発生から二秒後、\n客室高度の警報とみられる音が鳴った。"}, {"t": 933.5, "x": "ところが、約一秒間、三回鳴っただけで止まっている。"}, {"t": 937.05, "x": "そして約二十七秒たった十八時二十五分四秒から、\nまた鳴り出した。"}, {"t": 941.7666666666667, "x": "一回止まって、また鳴ったの。"}, {"t": 943.8333333333334, "x": "ああ。報告書の別冊には、こう書かれている。"}, {"t": 946.7, "x": "「再び二十五分四秒から鳴り出したことについては、\nその理由を明らかにすることはできなかった」"}, {"t": 952.3833333333333, "x": "ただし、二〇一一年の解説には続きがある。"}, {"t": 955.4666666666667, "x": "長くボーイング747の技術に携わってきた\n元日本航空の技術者が、説明を寄せている。"}, {"t": 961.8333333333334, "x": "一度鳴った警報が止まるには、三つの場合しかない。"}, {"t": 964.9666666666667, "x": "気圧が戻った場合。航空機関士が停止ボタンを押した\n場合。そして、機械が一時的に故障した場合。"}, {"t": 971.2333333333333, "x": "他の記録と矛盾しないのは、三つ目だという。"}, {"t": 974.1166666666667, "x": "このセンサーは緊急時にしか作動しない部品なので、\n普段は動かさないし、日常の点検もできない。"}, {"t": 980.2333333333333, "x": "壊れていても、誰も気づけないのね。"}, {"t": 982.6666666666666, "x": "そういう性質の部品だ。そのうえで\n解説は、こう結んでいる。"}, {"t": 986.4333333333333, "x": "機器が常に正常であれば説明できない\n事象ではあっても、総合的に\n考えると、異常事態発生後、"}, {"t": 992.4166666666666, "x": "極めて早い時点で急激に客室高度が\n上昇した、とするのが最も\n無理がない推論と考えられる、と。"}, {"t": 999.0666666666667, "x": "これは報告書の結論ではない。"}, {"t": 1000.9, "x": "二〇一一年に付け足された説明だ。\nそこは分けて聞いてほしい。"}, {"t": 1005.5666666666667, "x": "十八時五十六分ごろ、機体は\n群馬県多野郡上野村の山中に墜落した。"}, {"t": 1010.4666666666667, "x": "この日の日没は、十八時四十分だった。"}, {"t": 1013.45, "x": "十九時十五分、アメリカ軍のC-130が\n火災を発見し、位置を通報している。"}, {"t": 1018.6833333333333, "x": "十九時二十一分、航空自衛隊のF-4\nEJが二機、炎を確認して位置を通報。"}, {"t": 1024.1333333333334, "x": "二十時四十二分、航空自衛隊のヘリコプター\nV-107が炎を確認し、位置を通報。"}, {"t": 1030.05, "x": "見つかってはいたのね。"}, {"t": 1031.25, "x": "どうして時間がかかったの。"}, {"t": 1033.1166666666666, "x": "位置が、決まらなかったからだ。\nこれは責める話ではない。"}, {"t": 1036.3833333333334, "x": "当時できたことの限界の話だ。"}, {"t": 1038.7333333333333, "x": "夜間に場所を特定する方法は、\n地上の無線施設からの方位と\n距離を読み取るやり方だった。"}, {"t": 1044.2833333333333, "x": "方位は五度、距離は\n一マイル程度の精度でしか読めない。"}, {"t": 1047.45, "x": "実際の誤差がこうだ。"}, {"t": 1048.7166666666667, "x": "C-130が三キロ。"}, {"t": 1050.4333333333334, "x": "F-4EJが六キロ。"}, {"t": 1052.0833333333333, "x": "V-107が四キロ。"}, {"t": 1054.0333333333333, "x": "解説はこう書いている。"}, {"t": 1055.3333333333333, "x": "「夜間の位置の精度では救助隊を\n誘導することができなかったようです」"}, {"t": 1059.3833333333334, "x": "ヘリコプターで直接降りて\n助けることも、当時はできなかった。"}, {"t": 1063.2333333333333, "x": "海の上なら、別の飛行機から照明弾を\n落とし、自動操縦で近づく手順がある。"}, {"t": 1068.2166666666667, "x": "だが地上では火災のおそれがあるので\n照明弾は落とせない。"}, {"t": 1071.45, "x": "段差のある山の中では、\n自動操縦を使った進入もできない。"}, {"t": 1075.1666666666667, "x": "暗視装置も、当時は無かった。"}, {"t": 1077.3333333333333, "x": "明るくなると、精度は変わる。"}, {"t": 1079.1, "x": "十三日五時の通報は、誤差一キロ以下になっている。"}, {"t": 1082.4833333333333, "x": "七時五十五分、長野県警のレスキュー隊員二人が\n現場付近に降下し、捜索救助活動を開始。"}, {"t": 1088.7833333333333, "x": "八時四十九分から、\n空挺部隊七十三人が現場に降下した。"}, {"t": 1093.0833333333333, "x": "そして十時四十五分、生存者が発見される。"}, {"t": 1096.0, "x": "十一時五分までに四人。"}, {"t": 1097.7166666666667, "x": "十三時二十九分、四人はヘリコプターで\n現場から上野村の役場へ運ばれた。"}, {"t": 1103.1333333333334, "x": "もう一つ、分からないまま終わったことがある。"}, {"t": 1105.6333333333334, "x": "壊れた垂直尾翼の破片や、方向舵を動かす\n装置は、相模湾に落ちたと考えられた。"}, {"t": 1111.2833333333333, "x": "報告書は、その捜索をこう書いている。読む。"}, {"t": 1114.2666666666667, "x": "「昭和六十年十一月一日から\n十一月二十日までの間に、"}, {"t": 1118.15, "x": "海上保安庁の測量船及び海洋科学技術センターの\n海中作業船により、"}, {"t": 1122.8166666666666, "x": "相模湾の海底に沈んだ可能性のある\n残骸の調査を次のとおり実施したが、"}, {"t": 1127.3666666666666, "x": "同機の残骸の一部とみられるものは発見されなかった」"}, {"t": 1130.8833333333334, "x": "見つからなかったのね。"}, {"t": 1132.4166666666667, "x": "ああ。二十日かけて、何も出なかった。やり方は、\nこうだ。まず音波で海底を走査する。"}, {"t": 1137.7666666666667, "x": "サイド・スキャン・ソナーという装置だ。"}, {"t": 1140.2666666666667, "x": "不自然な物体が見えた場所を十七か所しぼりこみ、\n深海カメラを引っぱって撮影した。"}, {"t": 1145.4833333333333, "x": "ソナーの分解能は、\n一・一メートル掛ける一・三メートル。"}, {"t": 1149.2, "x": "物体として判別するには、その点が五つほど要る。"}, {"t": 1152.5333333333333, "x": "つまり、探知できる物体の大きさは、\n五・五メートル掛ける\n六・五メートル程度が必要だった。"}, {"t": 1158.3, "x": "けっこう大きいものしか映らないのね。"}, {"t": 1160.5666666666666, "x": "ああ。そして深海カメラは、一度に\n幅一・五メートルしか撮れない。"}, {"t": 1164.5333333333333, "x": "自分で進むこともできない。"}, {"t": 1166.45, "x": "調査区域の全部を撮るとどうなるか。\nおよそ二十五平方キロメートルを\n幅一・五メートルで撮ると、"}, {"t": 1171.9, "x": "四千五百時間かかる。"}, {"t": 1173.7166666666667, "x": "一日六時間やったとして、七百五十日。二年以上だ。"}, {"t": 1177.7, "x": "それでも確実に見つかる保証はない。だから、\nこれ以上の捜索は行えなかった。"}, {"t": 1183.2666666666667, "x": "一九八七年六月十九日、航空事故調査委員会は\n報告書を運輸大臣に提出し、公表した。"}, {"t": 1190.2, "x": "同年八月二十七日、参議院運輸委員会で、\n事故調査委員会の事務局長、"}, {"t": 1195.2666666666667, "x": "藤冨久司が結論を説明している。読む。"}, {"t": 1198.3666666666666, "x": "「この事故は事故機の後部圧力隔壁で"}, {"t": 1200.8, "x": "進展しておりました疲労亀裂によって\nこの隔壁の強度が低下いたしまして、"}, {"t": 1204.9666666666667, "x": "飛行中の客室与圧に\n耐えられなくなったためにまず隔壁が損壊し」"}, {"t": 1209.3666666666666, "x": "「それに引き続きまして垂直尾翼を含みます\n尾部胴体構造、さらには操縦系統の損壊が生じ、"}, {"t": 1215.3, "x": "飛行性の低下と主操縦機能の喪失を来したために\n生じたものと推定いたしております」"}, {"t": 1220.8166666666666, "x": "「また、この後部圧力隔壁におきます\n疲労亀裂の発生、進展は、"}, {"t": 1225.1, "x": "昭和五十三年に行われました\n後部圧力隔壁の不適切な修理に起因しておりまして」"}, {"t": 1230.6833333333334, "x": "「それが隔壁の損壊に\n至りますまでに進展したことには、"}, {"t": 1234.1, "x": "亀裂が点検整備で発見されなかったことも\n関与しているものと推定いたしております」"}, {"t": 1239.35, "x": "ここでも、推定いたしております、なのね。"}, {"t": 1242.25, "x": "ああ。二回とも「推定」だ。"}, {"t": 1244.2, "x": "推定される、は「断定できないが、\nほぼ間違いない場合」だった。"}, {"t": 1248.4833333333333, "x": "では、その一つ上の「認められる」が\n使われたのは、どこか。"}, {"t": 1252.5833333333333, "x": "報告書が原因を推定した\n根拠として挙げているものの、一つ目だ。"}, {"t": 1256.8, "x": "「同隔壁の接合部分に\n一列リベットの結合部分が認められた」"}, {"t": 1260.9, "x": "継ぎ板が一列でしか効いていなかったこと。\nこれは、認められる。断定だ。"}, {"t": 1265.4833333333333, "x": "物として残っていて、目の前にあるからだ。"}, {"t": 1268.8166666666666, "x": "報告書と一緒に、勧告と建議が出されている。"}, {"t": 1271.7333333333333, "x": "勧告は強い求め、建議は\n検討してほしいという求めだ。"}, {"t": 1275.55, "x": "一九八七年七月三十日、\n衆議院交通安全対策特別委員会。"}, {"t": 1281.0, "x": "運輸省航空局技術部長の中村資朗が、\n国が取った措置を説明している。"}, {"t": 1285.8166666666666, "x": "勧告の一つ目。大規模な構造修理を、\n製造工場以外の場所で実施する場合の作業管理。"}, {"t": 1291.55, "x": "これに対して、作業管理体制に係る指針を\n定め、航空会社や修理事業者に指導した。"}, {"t": 1297.2166666666667, "x": "勧告の二つ目。大規模な構造修理を\n行ったあとの、安全性の継続監視。"}, {"t": 1302.1333333333334, "x": "長期的な監視の指針が定められた。"}, {"t": 1304.7, "x": "勧告の三つ目。後部圧力隔壁などが壊れた\nあと、その周りの構造がどこまで持つか。"}, {"t": 1310.3, "x": "この基準を作ることを検討する、と\nアメリカの連邦航空局に通報し、技術協力を求めた。"}, {"t": 1316.3333333333333, "x": "建議のほうは。"}, {"t": 1317.45, "x": "二つある。一つは、乗員の緊急時の対応能力を\n高めるための方策の検討。"}, {"t": 1322.65, "x": "もう一つが、目視点検による\n亀裂の発見に関する検討だ。"}, {"t": 1326.7333333333333, "x": "外から見たリベットは\n正常だった、という話につながる。"}, {"t": 1330.25, "x": "さらに機体側の改修も進んだ。"}, {"t": 1332.3, "x": "後部圧力隔壁が壊れても垂直尾翼が\n壊れないよう、点検孔にふたを付けること。"}, {"t": 1337.7, "x": "尾部が壊れても四つの油圧のうち一つは\n残るよう、遮断弁を付けること。運輸省の指示だ。"}, {"t": 1343.9, "x": "報告書の書きぶりには、国会で\n正面から批判が出ている。"}, {"t": 1347.55, "x": "一九八七年八月十九日、\n衆議院運輸委員会。河村勝委員だ。"}, {"t": 1352.8333333333333, "x": "通読したうえで、こう述べている。読む。"}, {"t": 1355.2666666666667, "x": "「この報告というのは、一番おかしいなと思うのは、"}, {"t": 1358.1333333333334, "x": "事故発生と直接かかわりのある部分については\n表現が極めてあいまいであるということなんですね」"}, {"t": 1363.7166666666667, "x": "報告書には、委託は妥当、\n修理計画はほぼ妥当、と書いてある。"}, {"t": 1367.9333333333334, "x": "「事故調査委員会でほぼ妥当なんていう\n表現は、私は適切だとは思いません」"}, {"t": 1372.6333333333334, "x": "次に、修理した部分のその後の点検だ。"}, {"t": 1375.2166666666667, "x": "特別な点検箇所に指定せず一般的な目視検査に\nよったことは、妥当な点検方法であると考える。"}, {"t": 1381.7666666666667, "x": "しかしながら十分とは言えない\n点があったと考えられる。"}, {"t": 1384.8, "x": "報告書には、そう並んでいた。"}, {"t": 1386.9666666666667, "x": "河村委員は言う。「妥当だ、だけど\n十分ではなかった。"}, {"t": 1390.1333333333334, "x": "何言っているんだかわからないんですよね」"}, {"t": 1392.5666666666666, "x": "厳しいわね。"}, {"t": 1393.6166666666666, "x": "ああ。ただ、この委員は報告書を捨てろとは\n言っていない。そのあと、こう続けている。"}, {"t": 1398.5666666666666, "x": "「事故責任とは別に事故防止対策というものを\n考えなければならないですね」"}, {"t": 1403.1, "x": "事実関係は詳細に記述してあるのだから、\nそれをもとに防止対策を確立せよ、と。"}, {"t": 1408.5, "x": "私も同じ読み方をしている。"}, {"t": 1410.2666666666667, "x": "不確かなことを書かない、という決まりと、"}, {"t": 1412.6666666666667, "x": "誰の責任かを明らかにする、という\n求めは、そもそも向きが違う。"}, {"t": 1417.0333333333333, "x": "報告書は前者のために作られている。だから\n後者を期待すると、必ずあいまいに見える。"}, {"t": 1422.9, "x": "刑事のほうも書いておく。"}, {"t": 1424.2333333333333, "x": "一九八八年十二月一日、群馬県警は\n業務上過失致死傷の疑いで二十人を書類送検した。"}, {"t": 1431.3666666666666, "x": "内訳は、ボーイング社の四人、\n日本航空の十二人、運輸省の四人。"}, {"t": 1435.8, "x": "作った側、使った側、検査した側。"}, {"t": 1438.4, "x": "三つとも入っているのね。"}, {"t": 1440.2166666666667, "x": "ああ。一九八九年十一月二十二日、\n前橋地方検察庁は全員を嫌疑不十分で不起訴とし、"}, {"t": 1446.9, "x": "捜査本部を解散した。"}, {"t": 1448.6833333333334, "x": "一九九〇年四月二十五日、\n前橋検察審査会が議決を出す。"}, {"t": 1453.5, "x": "日本航空の社員二人と、\nボーイング社の作業員二人については不起訴不当。"}, {"t": 1458.0666666666666, "x": "その他は不起訴相当、という判断だった。"}, {"t": 1460.7166666666667, "x": "再捜査のうえ、一九九〇年七月十九日、\n四人はあらためて不起訴となった。"}, {"t": 1466.1166666666666, "x": "そして一九九〇年八月十二日、公訴時効が成立した。"}, {"t": 1470.6333333333334, "x": "事故のちょうど五年後ね。"}, {"t": 1472.2333333333333, "x": "ああ。結果として、この事故で\n刑事責任を問われた人はいない。"}, {"t": 1476.0333333333333, "x": "この結論の当否を、私はここで言うつもりはない。"}, {"t": 1479.0, "x": "誰か個人を名指しして責めることもしない。"}, {"t": 1481.4333333333334, "x": "事実として、そうなった、とだけ置いておく。"}, {"t": 1484.35, "x": "補償のほうは、日本航空と\n遺族の話し合いで進められた。"}, {"t": 1487.9833333333333, "x": "一九八七年七月の時点で、五百九人のうち\n百五十五人と示談が成立し、"}, {"t": 1493.6333333333334, "x": "十三件の訴訟が続いていると国会で報告されている。"}, {"t": 1497.8166666666666, "x": "二〇一一年七月、運輸安全委員会が「解説」という\n文書を公表した。この回でずっと引いてきた文書だ。"}, {"t": 1504.9, "x": "作ったのは国だが、協力したのは\n遺族と技術者だった。"}, {"t": 1508.4, "x": "被災者家族の美谷島邦子、河口真理子の両氏。"}, {"t": 1511.85, "x": "技術的な助言として、元747機長の本江彰氏と、\n元日本航空の小林忍氏。"}, {"t": 1518.3166666666666, "x": "その冒頭に、こう書かれている。読む。"}, {"t": 1520.7, "x": "「これまで航空事故調査委員会においては、"}, {"t": 1522.9833333333333, "x": "ご遺族の皆さまに対して、必ずしも\n十分な説明がなされていなかったため」"}, {"t": 1527.85, "x": "「皆さまの百二十三便報告書の内容に対する\nご疑念に応えてこられなかったことについて、"}, {"t": 1533.2666666666667, "x": "率直にお詫び申し上げます」"}, {"t": 1535.3, "x": "報告書の中身ではなくて、\n説明の仕方を謝っているのね。"}, {"t": 1539.2833333333333, "x": "ああ。そこは分けて書いてある。"}, {"t": 1541.05, "x": "当時は、事故の原因は調べても、被害をどうすれば\n減らせたかまでは調べる仕組みになっていなかった。"}, {"t": 1547.0, "x": "だから報告書には、捜索と\n救難について詳しい記載がない。"}, {"t": 1550.9, "x": "解説は、その部分を今分かる範囲で"}, {"t": 1553.2333333333333, "x": "書き足した。この回で話した夜の測位の誤差や\n海底調査の時間は、そこから取った。"}, {"t": 1559.05, "x": "ここからは私の見方だ。"}, {"t": 1560.6333333333334, "x": "事実と分けて聞いてほしい。三つある。"}, {"t": 1563.05, "x": "一つ目。この事故で、いちばん\n見えにくかったものは何だったか。"}, {"t": 1566.8666666666666, "x": "私は、外から見たリベットが正常に\n見えた、という一点だと思っている。"}, {"t": 1571.3166666666666, "x": "継ぎ板が切られていたことは、\n外側の板を外さなければ分からない。"}, {"t": 1575.3, "x": "亀裂はゆっくり進む、四十数センチになっても\n持つ、だから目で見れば足りる。"}, {"t": 1579.9833333333333, "x": "その前提が、継ぎ板のところだけ\n成り立っていなかった。"}, {"t": 1583.4333333333334, "x": "前提が外れていることには、気づけないのね。"}, {"t": 1586.3333333333333, "x": "ああ。検査は、前提の上でしか働かない。"}, {"t": 1589.1666666666667, "x": "二つ目。報告書が「\n明らかにすることはできなかった」と\n書いたことを、どう受け取るか。"}, {"t": 1594.6833333333334, "x": "酸素マスクのこと、緊急降下のこと、警報音のこと。\nこの三か所を、分からなかったと書いてある。"}, {"t": 1600.8666666666666, "x": "これを、隠したと読むこともできるし、\n正直だと読むこともできる。"}, {"t": 1604.8833333333334, "x": "私は後者だと思っている。"}, {"t": 1606.5, "x": "分からないことを埋めてしまえば、報告書は\nきれいになる。だが、それは別のものになる。"}, {"t": 1611.75, "x": "三つ目。それでも、あいまいだという批判は消えない。"}, {"t": 1614.85, "x": "一九八七年に河村委員が言ったことは、\n今読んでも筋が通っている。"}, {"t": 1619.7333333333333, "x": "報告書は原因を書く。だが、誰がどこで\n止められたはずなのかは書かない。"}, {"t": 1624.15, "x": "それを書く場所は、この国には\nまだ無いのかもしれない。"}, {"t": 1627.8833333333334, "x": "最後に、いま残っているものの話をする。"}, {"t": 1630.5, "x": "群馬県多野郡上野村、墜落現場の御巣鷹の尾根から\nおよそ十キロ北に、慰霊の園という場所がある。"}, {"t": 1636.7833333333333, "x": "事故の翌年、一九八六年八月に、\n上野村の人たちの協力を得て整備された。"}, {"t": 1642.7666666666667, "x": "高さ十一メートルの慰霊塔と、身元が\n分からなかった人の遺骨を納める納骨堂。"}, {"t": 1647.8666666666666, "x": "御巣鷹の尾根への慰霊登山は、\n毎年八月十二日に続いている。"}, {"t": 1651.9666666666667, "x": "日本航空は、二〇〇六年に\n安全啓発センターを開いた。"}, {"t": 1655.7166666666667, "x": "ここには、JA8119の実物の残骸が保存されている。"}, {"t": 1659.8, "x": "後部圧力隔壁もある。"}, {"t": 1661.5333333333333, "x": "壊れたものを片づけずに置いておく、という\n選び方をしたということだ。"}, {"t": 1665.6333333333334, "x": "見えるところに、置いてあるのね。"}, {"t": 1667.6333333333334, "x": "ああ。今回話したことの出典を挙げておく。"}, {"t": 1670.4166666666667, "x": "一つ。航空事故調査報告書、六十二の二、JA8119。"}, {"t": 1675.05, "x": "一九八七年六月十九日公表。"}, {"t": 1678.1833333333334, "x": "二つ。運輸安全委員会"}, {"t": 1679.8833333333334, "x": "「日本航空百二十三便の御巣鷹山墜落事故に係る\n航空事故調査報告書についての解説」。\n二〇一一年七月。"}, {"t": 1687.65, "x": "三つ。国会会議録。一九八五年から\n一九八七年にかけての、"}, {"t": 1693.05, "x": "衆議院と参議院の運輸委員会、\nそして交通安全対策特別委員会。"}, {"t": 1697.75, "x": "国会の記録は、\n国会会議録検索システムで全文が出る。"}, {"t": 1701.6833333333334, "x": "この事故については、山ほどの説がある。"}, {"t": 1704.2, "x": "どれを信じるかを決める前に、一次の記録が\n読める、ということだけは知っておいてほしい。"}, {"t": 1709.2666666666667, "x": "五百二十人が亡くなり、四人が生き残った。"}, {"t": 1712.2, "x": "その記録は、四十年たっても、\n消されずに置かれている。"}, {"t": 1715.6666666666667, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}, {"t": 1719.2, "x": "最後まで見てくれて、ありがとう。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
