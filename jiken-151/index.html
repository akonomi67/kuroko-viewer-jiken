<script>
const D={"name": "151", "file": "151_編集用", "dur": 2089.9833125, "segs": [], "subs": [{"t": 0.0, "x": "1961年3月30日、参議院の分科会。"}, {"t": 3.966666666666667, "x": "1人の議員が、国鉄の予算を問いただしていた。"}, {"t": 7.066666666666666, "x": "赤字の路線が、選挙の都合で造られている。"}, {"t": 9.916666666666666, "x": "借りたお金の利子も、国が持つべきだ。"}, {"t": 12.516666666666667, "x": "ずいぶん強い口ぶりの議員ね？"}, {"t": 14.516666666666667, "x": "最後に議員は、こう言って質問を終えた。"}, {"t": 16.95, "x": "これで終わります。1時間近く申しました。"}, {"t": 19.783333333333335, "x": "あげ足をとるつもりではない、と。"}, {"t": 21.8, "x": "それがこの回の始まりなの？"}, {"t": 23.75, "x": "そうだ。国会会議録にこの議員の声が\n残るのは、この日が最後だ。"}, {"t": 28.016666666666666, "x": "議員の名前は辻政信。"}, {"t": 29.75, "x": "5日後の4月4日、羽田空港を飛び立った。"}, {"t": 32.766666666666666, "x": "そして、4月21日の午前9時ごろ。"}, {"t": 35.55, "x": "ラオスの山の中へ、入ったとみられている。"}, {"t": 38.266666666666666, "x": "とみられている？"}, {"t": 39.416666666666664, "x": "そこから先の足取りが、今も分からないんだ。"}, {"t": 42.233333333333334, "x": "現職の国会議員が、旅先で消えた。"}, {"t": 44.916666666666664, "x": "国会では、そのあと何年も質問が続いた。"}, {"t": 48.03333333333333, "x": "議員が戻らないなんて、大事件よね。"}, {"t": 50.55, "x": "今回は、国会会議録に残った\n言葉だけで足取りを追う。"}, {"t": 54.18333333333333, "x": "外務省の答弁と、参議院の事務局の報告が中心だ。"}, {"t": 57.93333333333333, "x": "うわさもたくさん出たが、うわさはうわさとして言う。"}, {"t": 60.86666666666667, "x": "本人がどうなったかは、決めつけないのね。"}, {"t": 63.583333333333336, "x": "そうだ。家族がいる話でもあるからな。"}, {"t": 66.18333333333334, "x": "じゃあ、まず旅立つ前から見ていくのね。"}, {"t": 69.21666666666667, "x": "1961年4月1日、参議院の本会議。"}, {"t": 72.93333333333334, "x": "議長が、議場にこう諮った。"}, {"t": 74.88333333333334, "x": "海外旅行のため、辻政信君から休みの申し出がある。"}, {"t": 78.53333333333333, "x": "4日から40日間の請暇だ。"}, {"t": 80.81666666666666, "x": "請暇？"}, {"t": 81.95, "x": "議員が国会を休むための、許しのことだ。"}, {"t": 84.73333333333333, "x": "議場からは、異議なしの声が上がった。"}, {"t": 87.05, "x": "これで40日の休みが許された。"}, {"t": 89.4, "x": "会期の途中なのに、休めるのね。"}, {"t": 91.78333333333333, "x": "この年の会期は、5月24日までだった。"}, {"t": 94.75, "x": "そのあと延びて、6月8日までになっている。"}, {"t": 97.55, "x": "休みの届けは、4月4日から5月13日まで。"}, {"t": 101.08333333333333, "x": "5月の半ばには、戻ってくるはずだったのね。"}, {"t": 104.1, "x": "参議院の庶務部長は、のちにこう報告した。"}, {"t": 106.96666666666667, "x": "届けと一緒に、旅の日程も出されていた。"}, {"t": 109.71666666666667, "x": "サイゴン、プノンペン、バンコク。"}, {"t": 111.63333333333334, "x": "そしてラオスのビエンチャンだ。"}, {"t": 113.38333333333334, "x": "東南アジアの都を順番に回るのね。"}, {"t": 115.73333333333333, "x": "そうだ。この旅の最後の町が、\nのちに大きな意味を持つ。"}, {"t": 119.36666666666666, "x": "ビエンチャンね。覚えておくわ。"}, {"t": 121.76666666666667, "x": "旅のための旅券も、手続きの日付が残っている。"}, {"t": 124.96666666666667, "x": "1962年の参議院で、事務総長が報告した。"}, {"t": 128.81666666666666, "x": "3月28日に、議長あてに公用旅券の申請が出た。"}, {"t": 132.76666666666668, "x": "公用旅券って、ふつうの旅券と違うの？"}, {"t": 135.51666666666668, "x": "仕事で外国へ行く公務員や議員に出す旅券だ。"}, {"t": 138.46666666666667, "x": "申請書の行き先は、5つの国だった。"}, {"t": 141.11666666666667, "x": "ベトナム、カンボジア、タイ、ラオス、ビルマ。"}, {"t": 143.96666666666667, "x": "4月4日に東京を出て、5月15日に帰る予定だ。"}, {"t": 147.63333333333333, "x": "帰る日まで書いてあったのね。"}, {"t": 149.48333333333332, "x": "翌29日には、外貨の申請が許された。"}, {"t": 152.5, "x": "そして30日に、旅券が本人に手渡された。"}, {"t": 155.68333333333334, "x": "外務大臣の答弁には、旅券の番号まで出てくる。"}, {"t": 158.91666666666666, "x": "3月30日付の公用旅券、3万3853号。"}, {"t": 163.35, "x": "番号まで、国会で読み上げられたのね。"}, {"t": 165.93333333333334, "x": "外務大臣によると、目的はこう書かれていた。"}, {"t": 168.9, "x": "東南アジアの国々の、政治と経済と教育を見て回る。"}, {"t": 172.56666666666666, "x": "旅券には香港も入り、香港の他は\n入国の許可も付いた。"}, {"t": 176.51666666666668, "x": "きちんとした視察の旅に見えるわね。"}, {"t": 178.88333333333333, "x": "そうだ。書類の上では、何もおかしな所はない。"}, {"t": 182.01666666666668, "x": "本当の計画は、書類には書かれていなかった。"}, {"t": 185.61666666666667, "x": "辻政信ってどんな議員だったの？"}, {"t": 187.85, "x": "国会会議録では、1952年から衆議院で質問している。"}, {"t": 192.21666666666667, "x": "1959年の夏からは、参議院の議員だ。"}, {"t": 195.63333333333333, "x": "本人は国会で、郷里を石川県と話している。"}, {"t": 198.88333333333333, "x": "議員になる前は、何をしていたの？"}, {"t": 201.21666666666667, "x": "もとは陸軍の参謀だ。"}, {"t": 202.81666666666666, "x": "本人が国会で、こう話した日がある。"}, {"t": 205.31666666666666, "x": "1945年5月1日に、ビルマの戦場から\nサイゴンの総司令部へ報告に来た。"}, {"t": 210.95, "x": "戦争中も、あのあたりにいたのね。"}, {"t": 213.3, "x": "戦後のことも、国会で自分から語っている。"}, {"t": 216.15, "x": "戦後は仏印に100日間もぐっていた、とな。"}, {"t": 219.2, "x": "仏印って？"}, {"t": 220.33333333333334, "x": "フランスが治めていた、インドシナのことだ。"}, {"t": 222.95, "x": "今のベトナムやラオスやカンボジアのあたりだ。"}, {"t": 225.45, "x": "のちの国会では、身を隠していた\n時の本を出したとも言われた。"}, {"t": 229.4, "x": "東南アジアには、昔からの縁があったのね。"}, {"t": 232.3, "x": "そうだ。この回では、戦争中の行いの話には入らない。"}, {"t": 236.11666666666667, "x": "見るのは、1961年の旅と国会に残った記録だ。"}, {"t": 240.35, "x": "議員としての辻さんを追うのね。"}, {"t": 242.36666666666667, "x": "参議院の選挙では、全国から多くの票を集めた。"}, {"t": 245.65, "x": "のちに同じ控え室の議員が、\n68万あまりの有権者と言っている。"}, {"t": 250.68333333333334, "x": "国会での辻議員は、変わった申し出もしている。"}, {"t": 253.63333333333333, "x": "1959年3月、衆議院の委員会での発言だ。"}, {"t": 257.6166666666667, "x": "フィリピンの山の中に、まだ\n小野田少尉がいるとされていた。"}, {"t": 261.1166666666667, "x": "戦争が終わっても、山に残っていた兵隊さんね。"}, {"t": 264.4, "x": "そうだ。辻議員は、救出の計画についてこう言った。"}, {"t": 267.85, "x": "旧軍人として責任を感じている私を、送ってほしい。"}, {"t": 271.43333333333334, "x": "1か月の間ジャングルの中へ、と。"}, {"t": 273.78333333333336, "x": "国会議員が、自分で探しに行くって言ったの？"}, {"t": 276.8, "x": "そうだ。さらにこう続けている。"}, {"t": 278.75, "x": "代議士の名前は知らなくても、\n辻参謀の名前は知っているはずだ。"}, {"t": 282.8666666666667, "x": "自分の名前が、通じると思っていたのね。"}, {"t": 285.6166666666667, "x": "自分で動けば何とかなる、という考え方が見える。"}, {"t": 288.78333333333336, "x": "1959年の秋には、ラオスの名前も口にしている。"}, {"t": 292.68333333333334, "x": "ラオスとカンボジアは、\n日本への賠償の求めを自分から放棄した。"}, {"t": 296.6333333333333, "x": "なぜベトナムとも同じように話をまとめないのか、と。"}, {"t": 299.96666666666664, "x": "ラオスのことにも、くわしかったのね。"}, {"t": 302.3666666666667, "x": "その2年後、辻議員は自分の足でラオスへ向かう。"}, {"t": 305.55, "x": "自分の目で、見に行こうとしたのかしら？"}, {"t": 308.06666666666666, "x": "何を見たかったのかは、\n本人の口からは残っていない。"}, {"t": 311.43333333333334, "x": "残っているのは、行く先々で\n大使に話した言葉だけだ。"}, {"t": 315.71666666666664, "x": "1961年4月4日、朝の9時30分。"}, {"t": 319.3833333333333, "x": "辻議員は羽田を立った。"}, {"t": 321.01666666666665, "x": "のちに事務総長は、議員は元気に\n出発されたと報告している。"}, {"t": 325.1166666666667, "x": "見送った人には、ふつうの旅立ちだったのね。"}, {"t": 328.1166666666667, "x": "その日のうちに、南ベトナムのサイゴンに着いた。"}, {"t": 331.1, "x": "今のホーチミン市だ。"}, {"t": 332.53333333333336, "x": "飛行機で1日で着いたのね。"}, {"t": 334.53333333333336, "x": "外務省の答弁によると、\nサイゴンで政府の要人と会った。"}, {"t": 338.0833333333333, "x": "4月8日には、ジエム大統領とも会っている。"}, {"t": 341.01666666666665, "x": "大統領にまで会えたの？"}, {"t": 342.65, "x": "国会議員の視察だからな。ここまでは予定どおりだ。"}, {"t": 345.8333333333333, "x": "ところがサイゴンで、\n日本の大使にある話を打ち明けた。"}, {"t": 349.3, "x": "どんな話？"}, {"t": 350.43333333333334, "x": "北ベトナムに行きたい、という話だ。"}, {"t": 352.8833333333333, "x": "北ベトナムって、南と分かれていた国よね？"}, {"t": 355.9166666666667, "x": "そうだ。当時の日本は、\n北ベトナムとは国交が無かった。"}, {"t": 359.53333333333336, "x": "東京を出る前の外務省では、\nそういう話は出ていなかった。"}, {"t": 363.1, "x": "東京で言っていた行き先は、ラオスと南ベトナムだ。"}, {"t": 366.5, "x": "現地に着いてから、初めて言ったのね。"}, {"t": 369.0833333333333, "x": "そうだ。大使はすぐに止めにかかった。"}, {"t": 372.0833333333333, "x": "1961年9月、参議院の外務委員会。"}, {"t": 375.56666666666666, "x": "外務省の参事官が、サイゴンでのやりとりを報告した。"}, {"t": 378.98333333333335, "x": "辻議員は大使にこう言ったという。"}, {"t": 380.96666666666664, "x": "前にもあの地方へは出かけたことがある。"}, {"t": 383.23333333333335, "x": "事情はよく知っている。"}, {"t": 384.6166666666667, "x": "昔使った部下もあのあたりにいるから、大丈夫だ。"}, {"t": 387.8833333333333, "x": "自信たっぷりね。"}, {"t": 389.15, "x": "大使の答えはこうだった。"}, {"t": 390.76666666666665, "x": "状況は、前と今とでは違う。"}, {"t": 392.8, "x": "治安もよくないし、日本への感情も\n当時と同じではない。"}, {"t": 396.21666666666664, "x": "命の安全は保証できない。"}, {"t": 397.8833333333333, "x": "行かないほうがいい。"}, {"t": 399.1333333333333, "x": "大使ははっきり止めたのね。"}, {"t": 400.95, "x": "そうだ。極力説得したと報告されている。"}, {"t": 404.0, "x": "それでも、辻さんは聞かなかったの？"}, {"t": 406.3666666666667, "x": "結果として、聞き入れなかったとされている。"}, {"t": 408.93333333333334, "x": "外務大臣は、国会でこう答えたこともある。"}, {"t": 411.76666666666665, "x": "国会議員の身分がある。"}, {"t": 413.18333333333334, "x": "大使が何を言うかとなれば、\nそれ以上は止められない。"}, {"t": 416.3666666666667, "x": "大使より、議員のほうが立場が強かったのね。"}, {"t": 419.35, "x": "そうだ。ここがあとで、国会で\n何度も問われる所になる。"}, {"t": 422.96666666666664, "x": "止める力が無かったってことね。"}, {"t": 425.6333333333333, "x": "辻議員はサイゴンを離れて、次の町へ向かった。"}, {"t": 428.68333333333334, "x": "4月9日ごろ、カンボジアの都プノンペン。"}, {"t": 431.3333333333333, "x": "外務大臣の答弁では、11日まで滞在した。"}, {"t": 434.6333333333333, "x": "そして11日に、タイのバンコクへ移った。"}, {"t": 437.51666666666665, "x": "日程どおりに回っているのね。"}, {"t": 439.45, "x": "ここまではな。届けた日程とも合っている。"}, {"t": 442.06666666666666, "x": "4月14日ごろ、辻議員は\nバンコクからラオスへ向かった。"}, {"t": 445.6, "x": "そのとき、1人の日本人が付き添っていた。"}, {"t": 448.55, "x": "だれ？"}, {"t": 449.68333333333334, "x": "タイの日本大使館の防衛駐在官だ。"}, {"t": 452.18333333333334, "x": "ラオスの大使館の仕事も、かけもちしていた人だ。"}, {"t": 455.53333333333336, "x": "防衛駐在官って？"}, {"t": 457.05, "x": "大使館に置かれる、自衛隊出身の担当者のことだ。"}, {"t": 460.45, "x": "のちの国会で、議員がこう問いただしている。"}, {"t": 463.1, "x": "防衛庁の担当者が途中まで同行したなら、\nなおさら止めるべきだった。"}, {"t": 467.5, "x": "付き添いがいたのに、止められなかったのね。"}, {"t": 470.1666666666667, "x": "そうだ。こうして4月14日に、\nラオスの都ビエンチャンに着いた。"}, {"t": 473.96666666666664, "x": "ここが、届けた日程の最後の町だ。"}, {"t": 476.6166666666667, "x": "いよいよ最後の町ね。"}, {"t": 478.1333333333333, "x": "ここで辻議員は、旅の本当の目的を口にする。"}, {"t": 482.01666666666665, "x": "ビエンチャンには、ラオスの日本大使がいた。"}, {"t": 484.5833333333333, "x": "辻議員はこの大使にこう話した。"}, {"t": 486.73333333333335, "x": "パテトラオが占めている地区を、通り抜けたい。"}, {"t": 489.31666666666666, "x": "そこからハノイに渡り、香港に出て日本へ帰る。"}, {"t": 492.48333333333335, "x": "ラオスから北ベトナムへ山を越えるの？"}, {"t": 494.85, "x": "そうだ。陸の道で共産側の地区を抜けていく計画だ。"}, {"t": 498.3833333333333, "x": "外務大臣は、大使がこの計画を\n無謀だと説いたと答えている。"}, {"t": 502.25, "x": "大使は、思いとどまるように説得に努めた。"}, {"t": 505.1333333333333, "x": "それでも議員は聞き入れなかった。"}, {"t": 507.15, "x": "ここでも止められなかったのね。"}, {"t": 509.1, "x": "さらに辻議員は、こんなことも言ったという。"}, {"t": 511.6666666666667, "x": "僧侶に変装して行く、と。"}, {"t": 513.6333333333333, "x": "お坊さんの姿で？"}, {"t": 515.0333333333333, "x": "そうだ。大使はこれにも反対した。"}, {"t": 517.3, "x": "国会議員がそういうことをするのは、\n大使として迷惑だ。"}, {"t": 520.7333333333333, "x": "そう言って思いとどまらせようとした、と\n報告されている。"}, {"t": 524.1333333333333, "x": "迷惑とまで言ったのね。"}, {"t": 525.7333333333333, "x": "大使にとっては、それだけ危ない話だった。"}, {"t": 528.5666666666667, "x": "当時のラオスが\nどんな国だったかを見ると、よく分かる。"}, {"t": 531.8833333333333, "x": "ラオスはどうなっていたの？"}, {"t": 533.9666666666667, "x": "外務省の参事官は、国会でこう説明した。"}, {"t": 537.0, "x": "ラオスでは、3つの勢力が争っている。"}, {"t": 539.5833333333334, "x": "1つはブンウムという首相の政府。"}, {"t": 541.6833333333333, "x": "1つは中立派のプーマ殿下。"}, {"t": 543.6833333333333, "x": "もう1つが左翼系のパテトラオだ。"}, {"t": 546.0333333333333, "x": "1つの国の中で、3つに分かれていたのね。"}, {"t": 549.0666666666667, "x": "そうだ。日本が国交を\n結んでいたのは、ラオスの政府だ。"}, {"t": 552.6, "x": "パテトラオの側とは、日本政府は\n関係を持っていなかった。"}, {"t": 556.2666666666667, "x": "じゃあ、そっちに入ったら守れないってこと？"}, {"t": 558.9666666666667, "x": "そういうことだ。参事官はこう答えている。"}, {"t": 561.5333333333333, "x": "パテトラオ側に入ったなら、\n正式に保護を頼む相手がいない。"}, {"t": 565.35, "x": "日本の政府の手が届かない場所なのね。"}, {"t": 567.9, "x": "しかも国の中では、戦いが続いていた。"}, {"t": 570.6666666666666, "x": "のちの答弁でも、交戦地区という\n言葉が何度も出てくる。"}, {"t": 574.3, "x": "そんな所に、議員が入ろうとしていたの？"}, {"t": 577.05, "x": "そうだ。しかも正面からの道は使えなかった。"}, {"t": 580.0166666666667, "x": "パテトラオの通行手形が、手に入らなかったからだ。"}, {"t": 583.35, "x": "通行手形？"}, {"t": 584.4833333333333, "x": "安導券という。その地区を進むための許可の紙だ。"}, {"t": 587.7166666666667, "x": "辻議員はこの紙を手に\n入れようとしたが、うまくいかなかった。"}, {"t": 591.8833333333333, "x": "安導券が無いなら、どうするか。"}, {"t": 593.9333333333333, "x": "事務総長の報告によると、辻議員はこう決めた。"}, {"t": 597.0833333333334, "x": "ビエンチャンからルアンプラバンへの道を行く。"}, {"t": 599.3666666666667, "x": "ただし、表の道を避けて間道を行く。"}, {"t": 601.8666666666667, "x": "間道って？"}, {"t": 603.0, "x": "人目につかないわき道のことだ。"}, {"t": 605.1, "x": "実は1度ひとりで入ろうとして、うまくいかなかった。"}, {"t": 608.4666666666667, "x": "1回失敗していたの？"}, {"t": 610.15, "x": "これはずっとあとの、1973年の国会で分かった話だ。"}, {"t": 614.4666666666667, "x": "外務省の担当者がこう答えている。"}, {"t": 616.6833333333333, "x": "辻議員はビエンチャンで\nひとりでの潜入を試みたが、失敗した。"}, {"t": 620.65, "x": "ひとりではどうしてもだめだ、と考えたらしい。"}, {"t": 623.4666666666667, "x": "それで誰かを頼ったのね？"}, {"t": 625.25, "x": "そうだ。日本の銀行のビエンチャンの支店に頼んだ。"}, {"t": 628.4, "x": "支店長を通じて、そこで働く日本人に手助けを求めた。"}, {"t": 632.4666666666667, "x": "その人は、辻さんの知り合いだったの？"}, {"t": 634.9666666666667, "x": "答弁では、それまで全く面識が無かったとされている。"}, {"t": 638.4333333333333, "x": "その日本人は、支店長に言われて手配を始めた。"}, {"t": 641.7333333333333, "x": "見ず知らずの人が、急に巻き込まれたのね。"}, {"t": 644.55, "x": "そうだ。手配の先は銀行の隣のお寺だった。"}, {"t": 648.2166666666667, "x": "銀行の隣には寺があり、ラオスの僧侶がいた。"}, {"t": 651.2166666666667, "x": "その日本人は僧侶に頼み、\n道案内を引き受けてもらった。"}, {"t": 654.9333333333333, "x": "1961年の外務大臣の答弁には、\nクンタ寺院という寺の名前が出てくる。"}, {"t": 660.2166666666667, "x": "その住職に話をつけ、2人の僧侶が案内に付いた。"}, {"t": 663.9166666666666, "x": "お坊さんが2人も付いたのね。"}, {"t": 665.85, "x": "そして、辻議員自身も姿を変えた。"}, {"t": 668.3833333333333, "x": "髪を短く切って、僧衣をまとった。"}, {"t": 670.9, "x": "本当にお坊さんの姿になったのね。"}, {"t": 673.35, "x": "名乗った名前は「青木」。"}, {"t": 674.9666666666667, "x": "日本の高僧で、仏跡をたずねてラオスに来た。"}, {"t": 677.9666666666667, "x": "そういうふれ込みだったと答弁にある。"}, {"t": 680.1833333333333, "x": "仏跡って？"}, {"t": 681.3166666666667, "x": "仏教にゆかりのある古い場所のことだ。"}, {"t": 683.6666666666666, "x": "持ち物も、外務大臣が国会で読み上げている。"}, {"t": 686.65, "x": "トランクに黒い背広が1着。"}, {"t": 688.5666666666667, "x": "それに、いくらかのお金とその他の物だ。"}, {"t": 691.3666666666667, "x": "黒い背広を持っていったの？"}, {"t": 693.1333333333333, "x": "そうだ。この背広は、あとでもう一度出てくる。"}, {"t": 696.0666666666667, "x": "なんだか気になる持ち物ね。"}, {"t": 697.9333333333333, "x": "覚えておいてくれ。黒い背広だ。"}, {"t": 700.5666666666667, "x": "1961年4月19日ごろの朝。"}, {"t": 703.6333333333333, "x": "ビエンチャンを、1台のジープが出た。"}, {"t": 705.9166666666666, "x": "誰の車なの？"}, {"t": 707.2, "x": "1973年の答弁では、銀行のジープとある。"}, {"t": 710.8333333333334, "x": "乗っていたのは手配をした日本人。"}, {"t": 712.8833333333333, "x": "2人の僧侶。そして僧の姿の辻議員だ。"}, {"t": 715.9833333333333, "x": "4人でどこへ向かったの？"}, {"t": 717.6166666666667, "x": "ビエンチャンから、およそ5キロ離れた村だ。"}, {"t": 720.2333333333333, "x": "そこで日本人は車を降りて見送った。"}, {"t": 722.6166666666667, "x": "辻議員と2人の僧侶は、北へ向かって歩いていった。"}, {"t": 726.0166666666667, "x": "それが、日本人が見た最後の姿なの？"}, {"t": 728.8166666666667, "x": "答弁で語られている日本人との\nつながりは、そこまでだ。"}, {"t": 732.2833333333333, "x": "外務省の別の答弁にも、同じ日付がある。"}, {"t": 735.2166666666667, "x": "4月19日ごろ、間道を選んで\nビエンチャンから北上した。"}, {"t": 739.0, "x": "日付がちゃんとそろっているのね。"}, {"t": 741.0333333333333, "x": "そうだ。ここからは、寺から寺へ渡っていく旅になる。"}, {"t": 744.3833333333333, "x": "外務省はこれを、リレーのような渡り方と言っている。"}, {"t": 747.55, "x": "寺から寺へバトンを渡すみたいに？"}, {"t": 749.7666666666667, "x": "そうだ。僧から僧へ、奥へ奥へと手引きされた。"}, {"t": 752.8166666666667, "x": "その寺のつながりも、やがて途切れる。"}, {"t": 755.8, "x": "外務大臣は国会でこう答えている。"}, {"t": 758.1, "x": "寺院から寺院へのリレー式な渡り方で、奥地へ入った。"}, {"t": 761.5333333333333, "x": "第3番目の寺院から先の行方は、確かめられていない。"}, {"t": 765.15, "x": "3つ目のお寺までは、分かっていたのね？"}, {"t": 767.7166666666667, "x": "外務省はあとで、このルートをたどって調べている。"}, {"t": 770.5833333333334, "x": "辻議員が使った寺院沿いの道を、\n現地の公館が追った。"}, {"t": 774.2666666666667, "x": "それでも、3つ目の先は分からなかったの？"}, {"t": 777.0833333333334, "x": "そうだ。交戦地区のことでもあり、\n確かめられなかった。"}, {"t": 780.45, "x": "外務大臣はここを交戦地区と呼んでいる。"}, {"t": 783.0666666666667, "x": "戦っている場所の中なのね。"}, {"t": 785.1166666666667, "x": "事務総長の報告も同じ所で話が止まる。"}, {"t": 788.1166666666667, "x": "寺院から寺院へと手引きされ、\n奥地へ向けて出発した。"}, {"t": 791.55, "x": "そのまま消息を絶った、とな。"}, {"t": 793.7166666666667, "x": "お寺の道の先で、消えてしまったのね。"}, {"t": 796.3666666666667, "x": "ただ、外務省はある時刻をあげている。"}, {"t": 798.6833333333333, "x": "4月21日の朝の時刻だ。"}, {"t": 801.05, "x": "時刻まで分かるの？"}, {"t": 802.4333333333333, "x": "確かめた時刻ではない。"}, {"t": 803.85, "x": "状況から考えた時刻だ。"}, {"t": 805.7666666666667, "x": "それでも答弁には、何度もこの時刻が出てくる。"}, {"t": 808.8666666666667, "x": "いったい何時なの？"}, {"t": 810.6666666666666, "x": "外務省の参事官はこう答えた。"}, {"t": 812.7666666666667, "x": "これは確認されていないが、状況から判断すると。"}, {"t": 816.0166666666667, "x": "4月21日の午前9時ごろ、パテトラオの地域に入った。"}, {"t": 819.9666666666667, "x": "それが、記録に残った最後の時刻なのね。"}, {"t": 822.9, "x": "そうだ。外務大臣も同じ時刻をあげている。"}, {"t": 825.65, "x": "4月21日午前9時ごろ、\nパテトラオ地区へ入ったと思われる。"}, {"t": 829.8166666666667, "x": "思われる、なのね。"}, {"t": 831.2166666666667, "x": "誰かが見届けたわけではない、という言い方だ。"}, {"t": 834.0166666666667, "x": "羽田を出てから、17日後のことだ。"}, {"t": 836.7166666666667, "x": "休みの届けは5月13日までよね。"}, {"t": 839.4166666666666, "x": "そうだ。まだ半分も過ぎていない。"}, {"t": 841.5333333333333, "x": "外務省は、このあとの事情をこう言う。"}, {"t": 843.7833333333333, "x": "それから辻議員の消息が絶えた。"}, {"t": 846.1, "x": "日本の家族は、このことを知っていたの？"}, {"t": 848.6833333333333, "x": "家族への手紙は、4月中旬に1通届いていた。"}, {"t": 851.9333333333333, "x": "それより後には、手紙は来ていない。"}, {"t": 854.25, "x": "4月の半ばで、手紙も止まったのね。"}, {"t": 856.8833333333333, "x": "そうだ。羽田を立ってまもなく、音信が途絶えていた。"}, {"t": 860.1666666666666, "x": "ところが東京では、しばらく誰も騒がなかった。"}, {"t": 863.3, "x": "どうして？"}, {"t": 864.6666666666666, "x": "計画は、家族にも参議院にも知らされていなかった。"}, {"t": 867.95, "x": "事務総長の報告にこうある。"}, {"t": 869.7833333333333, "x": "パテトラオ地区に入る計画を、家族にも秘めていた。"}, {"t": 873.1333333333333, "x": "家族も知らなかったのね。"}, {"t": 874.8666666666667, "x": "5月13日に休みの期限が過ぎた。"}, {"t": 877.45, "x": "5月15日に帰国の予定日も過ぎた。"}, {"t": 880.0166666666667, "x": "それでも辻議員は戻らなかった。"}, {"t": 882.2, "x": "誰が最初に気づいたの？"}, {"t": 883.8833333333333, "x": "5月20日ごろ、議員の秘書が参議院の庶務課に来た。"}, {"t": 887.2666666666667, "x": "議員の行方が分からなくなっている、という知らせだ。"}, {"t": 890.25, "x": "事務局は、このとき初めて事情を知った。"}, {"t": 892.9333333333333, "x": "羽田を出てまもなく、家族への便りも\n途絶えていたことだ。"}, {"t": 896.5166666666667, "x": "1か月以上も、誰も知らなかったのね。"}, {"t": 899.2, "x": "外務省は5月24日に、大使館などに訓令を出した。"}, {"t": 902.8666666666667, "x": "議員の消息を調べよ、という命令だ。"}, {"t": 905.3333333333334, "x": "参議院の庶務部も、5月28日に\n外務省へ問い合わせた。"}, {"t": 909.2333333333333, "x": "6月10日にも聞いたが、どちらも分からなかった。"}, {"t": 912.4333333333333, "x": "手がかりが何も無かったのね。"}, {"t": 914.4, "x": "6月8日には、その年の国会の会期も終わった。"}, {"t": 917.7333333333333, "x": "議員の席は空いたまま、夏がくる。"}, {"t": 920.6, "x": "6月19日、参議院の庶務課長が電話をかけた。"}, {"t": 924.0166666666667, "x": "相手は辻議員の妻だ。"}, {"t": 925.7166666666667, "x": "どんな電話だったの？"}, {"t": 927.1333333333333, "x": "庶務課長は、国会でこう説明している。"}, {"t": 929.75, "x": "お見舞いを申し上げた。"}, {"t": 931.0833333333334, "x": "先生から連絡があったら、すぐに知らせてほしい。"}, {"t": 934.0833333333334, "x": "こちらも、消息が分かりしだいお知らせする。"}, {"t": 936.9166666666666, "x": "家族は、家で待つしかなかったのね。"}, {"t": 939.3833333333333, "x": "のちの国会で、ある議員はこう話している。"}, {"t": 941.9833333333333, "x": "党派は違うが、辻さんとは住まいが隣同士だ。"}, {"t": 945.0833333333334, "x": "毎日お宅を見て安否を心配している、と。"}, {"t": 947.8833333333333, "x": "隣の人まで心配していたのね。"}, {"t": 950.2166666666667, "x": "衆議院の外務委員会では、こんな言葉もある。"}, {"t": 953.0333333333333, "x": "家族からも捜索願が出たはずだ、と\n議員が述べている。"}, {"t": 956.6, "x": "家族もできることをしていたのね。"}, {"t": 958.7333333333333, "x": "そうだ。この回では家族の名前は出さない。"}, {"t": 961.3666666666667, "x": "待ち続けた人がいたということだけ、\n覚えておいてほしい。"}, {"t": 964.85, "x": "うん。それが一番大事なことね。"}, {"t": 967.0666666666667, "x": "外務省のほうは、北の国へ手を伸ばしていた。"}, {"t": 970.0166666666667, "x": "北ベトナムに入ったかどうかね？"}, {"t": 972.6333333333333, "x": "辻議員の計画は、ハノイへ抜けることだった。"}, {"t": 975.5333333333333, "x": "なら、北ベトナムに入っているかもしれない。"}, {"t": 978.15, "x": "外務省はそう考えて調べ始めた。"}, {"t": 980.6, "x": "でも国交が無いのよね？"}, {"t": 982.2666666666667, "x": "そうだ。正式には聞けない。"}, {"t": 984.15, "x": "7月に、ある人が用事で\n北ベトナムへ向かうと分かった。"}, {"t": 987.7, "x": "外務省はその人に非公式に頼んだ。"}, {"t": 990.25, "x": "辻議員の話があったら、調べて知らせてほしい。"}, {"t": 993.4166666666666, "x": "それでどうだったの？"}, {"t": 994.7166666666667, "x": "帰ってきてからの報告はこうだった。"}, {"t": 996.95, "x": "北ベトナムに入ったという形跡はない。"}, {"t": 999.35, "x": "外務大臣ものちにこう答えている。"}, {"t": 1001.5166666666667, "x": "2つの筋を通じて、北ベトナムの側に当たった。"}, {"t": 1004.7166666666667, "x": "どちらからも、入った形跡はないという答えだった。"}, {"t": 1008.0166666666667, "x": "ハノイには着いていなかったのね。"}, {"t": 1010.0, "x": "少なくとも、北ベトナムの側はそう答えた。"}, {"t": 1013.0333333333333, "x": "じゃあ、ラオスのどこかにいるってこと？"}, {"t": 1015.3166666666667, "x": "そう考えるしかなかった。"}, {"t": 1016.9666666666667, "x": "そして8月、ラオスの大使館に1つの話が入る。"}, {"t": 1020.5833333333334, "x": "ある町で、日本人を見たという男がいたんだ。"}, {"t": 1024.0833333333333, "x": "8月24日、ラオスの大使から外務省に報告が届いた。"}, {"t": 1028.1166666666666, "x": "外務大臣は、その中身を国会で読み上げている。"}, {"t": 1031.2, "x": "ビエンチャンの北110キロに、\nバンビエンという町がある。"}, {"t": 1034.4666666666667, "x": "そこで、辻議員らしい人に会ったという中国人がいる。"}, {"t": 1037.9333333333334, "x": "中国人？"}, {"t": 1039.0666666666666, "x": "中華料理店を営む男だ。"}, {"t": 1041.0333333333333, "x": "その男は、北へ70キロのポンホンという所にいた。"}, {"t": 1044.4833333333333, "x": "大使館はすぐに館員を送って、話を聞いた。"}, {"t": 1047.6166666666666, "x": "その人は、なぜバンビエンにいたの？"}, {"t": 1049.9, "x": "本人の話では、4月の上旬に\n米袋の買い付けに出かけた。"}, {"t": 1054.05, "x": "ところが戦乱で帰れなくなった。"}, {"t": 1056.0666666666666, "x": "6月7日までバンビエンにとどまっていた。"}, {"t": 1058.7333333333333, "x": "戦いに足止めされていたのね。"}, {"t": 1060.8333333333333, "x": "そうだ。大使館員は辻議員の写真を見せた。"}, {"t": 1063.75, "x": "男は本人に間違いないと言い切ったという。"}, {"t": 1066.4833333333333, "x": "写真で確かめたのね。"}, {"t": 1068.1333333333334, "x": "大使館も、会ったのはほぼ\n間違いないという印象を持った。"}, {"t": 1071.5333333333333, "x": "外務省が持っている一番新しい話が、これだった。"}, {"t": 1075.0666666666666, "x": "4月21日の先が、少しだけ見えたのね。"}, {"t": 1078.3833333333334, "x": "そうだ。男はさらにくわしいことを話している。"}, {"t": 1081.8666666666666, "x": "男の話によると、その日本人は5月の中旬に町へ来た。"}, {"t": 1085.9333333333334, "x": "男が寝泊まりしていた、同じ商売の料理店に現れた。"}, {"t": 1089.5333333333333, "x": "お金の両替と食事のためだ。"}, {"t": 1091.65, "x": "そこで知り合ったのね。"}, {"t": 1093.1166666666666, "x": "外務省の参事官はこう付け加えている。"}, {"t": 1095.5833333333333, "x": "そのとき僧侶の格好ではなかった。"}, {"t": 1097.7666666666667, "x": "黒の背広を着ていた、と。"}, {"t": 1099.6, "x": "あっ、トランクに入れていた黒い背広ね！"}, {"t": 1102.1, "x": "そうだ。僧の姿で出発し、町では背広に戻っていた。"}, {"t": 1105.9333333333334, "x": "外務大臣も、2年目の国会でこの話をしている。"}, {"t": 1109.2666666666667, "x": "黒い背広の日本人に会ったという\n料理店の主人がいる、と。"}, {"t": 1112.9666666666667, "x": "服まで話に合っているのね。"}, {"t": 1114.9333333333334, "x": "ただし、ここで気をつけたいことがある。"}, {"t": 1117.1833333333334, "x": "これは男が大使館に話した中身だ。"}, {"t": 1119.7166666666667, "x": "それを大使が外務省に報告し、大臣が国会で読んだ。"}, {"t": 1123.4333333333334, "x": "又聞きの又聞きってこと？"}, {"t": 1125.3166666666666, "x": "そうだ。だから事実とは言い切れない。"}, {"t": 1127.5333333333333, "x": "それでも写真を見て男は間違いないと言った。"}, {"t": 1130.3833333333334, "x": "5月中旬からその町にいたかもしれないのね。"}, {"t": 1133.3666666666666, "x": "では辻議員はその町で何をしていたのか。"}, {"t": 1136.6, "x": "男の話では、辻議員には会いたい人がいた。"}, {"t": 1139.6, "x": "中立派のプーマ殿下だ。"}, {"t": 1141.3666666666666, "x": "3つの勢力の真ん中の人ね。"}, {"t": 1143.6166666666666, "x": "そうだ。プーマ殿下はシェンクワンという町にいた。"}, {"t": 1146.3833333333334, "x": "外務大臣によるとプーマの政府と\nパテトラオの総司令部がある所だ。"}, {"t": 1150.5666666666666, "x": "そこに行かないと殿下には会えないのね。"}, {"t": 1152.8833333333334, "x": "そうだ。辻議員は男を連れてある場所を何度も訪ねた。"}, {"t": 1156.25, "x": "パテトラオの前線司令部だ。"}, {"t": 1158.1666666666667, "x": "自分から司令部を訪ねたの？"}, {"t": 1160.1, "x": "何回もだという。奥へ入る許可を得るためだ。"}, {"t": 1162.8666666666666, "x": "そして6月の初めにようやく\n許可の書き付けを手に入れた。"}, {"t": 1166.4333333333334, "x": "とうとう許可が出たのね。"}, {"t": 1167.9833333333333, "x": "外務省の参事官はこう話している。"}, {"t": 1170.2833333333333, "x": "やがてラオスの中心になる人に\n会いたいと考えたのはうなずける。"}, {"t": 1174.0, "x": "ただし、これは推測にすぎないとも付け加えた。"}, {"t": 1177.1, "x": "会えたのかしら？"}, {"t": 1178.2166666666667, "x": "ここで時期の悪い出来事が重なる。"}, {"t": 1180.4, "x": "ちょうどそのころプーマ殿下が\nラオスを離れていたんだ。"}, {"t": 1183.4333333333334, "x": "えっ、いなかったの？"}, {"t": 1184.8666666666666, "x": "どこへ出かけていたか見てみよう。"}, {"t": 1187.3, "x": "外務大臣の答弁によると、プーマ殿下は\n6月2日ごろシェンクワンを出た。"}, {"t": 1191.8166666666666, "x": "行き先はスイスのチューリッヒだ。"}, {"t": 1193.7166666666667, "x": "ラオスの3つの勢力の殿下が\n集まる会議に出るためだった。"}, {"t": 1197.4, "x": "3つの勢力が話し合うための会議ね。"}, {"t": 1200.0166666666667, "x": "そうだ。辻議員が許可を得たのは6月の初め。"}, {"t": 1203.05, "x": "ほぼ同じころに殿下は国を離れていた。"}, {"t": 1205.6, "x": "すれ違ってしまったのね。"}, {"t": 1207.3166666666666, "x": "外務大臣はこう推し量っている。"}, {"t": 1209.3333333333333, "x": "シェンクワンに着いても殿下が\n帰るまで待つしかなかったはずだ。"}, {"t": 1212.9166666666667, "x": "それも推測なのね？"}, {"t": 1214.4833333333333, "x": "そうだ。そのあとのことは\n推測の域を出ないと言っている。"}, {"t": 1217.8333333333333, "x": "そして6月7日に料理店の男がバンビエンを去った。"}, {"t": 1221.1833333333334, "x": "男が言うには、それまで辻議員はずっと町にいた。"}, {"t": 1224.4166666666667, "x": "男がいなくなったら見ていた人もいなくなるのね。"}, {"t": 1227.4666666666667, "x": "そうだ。記録に残る最後の目撃は6月7日まで。"}, {"t": 1230.9666666666667, "x": "羽田を出てからちょうど2か月ほどだ。"}, {"t": 1233.3166666666666, "x": "4月21日からさらに1か月半あとね。"}, {"t": 1236.3333333333333, "x": "この話が日本に届いたのは8月の後半だった。"}, {"t": 1239.6333333333334, "x": "参事官はこう言っている。"}, {"t": 1241.15, "x": "分かったときには、もう2か月半も\n前に戦いの場へ入っていた。"}, {"t": 1245.7166666666667, "x": "1961年9月12日、参議院の外務委員会。"}, {"t": 1249.7, "x": "国会が閉じている間に開かれた委員会だ。"}, {"t": 1252.45, "x": "1人の議員がこう切り出した。"}, {"t": 1254.2666666666667, "x": "今日は、辻政信氏の保護に関する国家の責務を問う。"}, {"t": 1257.8166666666666, "x": "国会で初めて取り上げられたのね。"}, {"t": 1260.1, "x": "議員はこう続けた。"}, {"t": 1261.4, "x": "心配が杞憂に終わることを願い、\n国会で取り上げるのを控えてきた。"}, {"t": 1265.4333333333334, "x": "しかし今となっては黙視するわけにいかぬ。"}, {"t": 1268.0833333333333, "x": "みんなすぐ戻ると思っていたのね。"}, {"t": 1270.2333333333333, "x": "別の議員もこう言っている。"}, {"t": 1271.8166666666666, "x": "どこかに潜入しているだけだろうと、\n調べが真剣さを欠いていた。"}, {"t": 1275.7166666666667, "x": "何か異変があったのではないかという\n気がしてならない、と。"}, {"t": 1279.1166666666666, "x": "本気で心配する声が出てきたのね。"}, {"t": 1281.5166666666667, "x": "別の議員は外務省にずばり聞いた。"}, {"t": 1283.6666666666667, "x": "辻議員は生きていると判断するのか。"}, {"t": 1285.9666666666667, "x": "完全に行方不明なのか。絶望なのか。"}, {"t": 1288.7833333333333, "x": "外務省は何て答えたの？"}, {"t": 1290.6333333333334, "x": "参事官は、生きているかどうかには答えなかった。"}, {"t": 1293.6, "x": "答えたのは、大使たちが止めた時のやりとりだ。"}, {"t": 1296.7, "x": "生きているかどうかは、誰にも言えなかったのね。"}, {"t": 1300.0333333333333, "x": "この委員会では、旅券のことも問われた。"}, {"t": 1302.5666666666666, "x": "議員はこう述べている。"}, {"t": 1303.85, "x": "国会議員が公用旅券を持って危ない\n場所へ向かうのは、異例だ。"}, {"t": 1307.7333333333333, "x": "視察の旅券で、戦いの場所に入ったからね。"}, {"t": 1310.85, "x": "そうだ。議員はさらにこう言った。"}, {"t": 1312.8166666666666, "x": "危ない所へ行かないよう助言するのも政府の務めだ。"}, {"t": 1316.1166666666666, "x": "止めきれなかった責任ってこと？"}, {"t": 1318.2833333333333, "x": "そういう問いだ。外務省の答えはこうだった。"}, {"t": 1320.95, "x": "出発前に外務省へ来た時、北へ\n入るという意思表明は無かった。"}, {"t": 1325.15, "x": "現地に着いてから、北へ入りたいと言い出した。"}, {"t": 1328.0, "x": "両方の大使が極力思いとどまるよう説得した。"}, {"t": 1331.2333333333333, "x": "外務省としては止めたって言いたいのね。"}, {"t": 1333.6833333333334, "x": "そうだ。参議院の側にも問いが向いた。"}, {"t": 1336.1166666666666, "x": "参議院としてどんな手を打ったのか。"}, {"t": 1338.1833333333334, "x": "家族から何か申し出はあったのか。"}, {"t": 1340.4833333333333, "x": "参議院は何て答えたの？"}, {"t": 1342.2833333333333, "x": "庶務課長は、外務省に何度も\n問い合わせていたと答えた。"}, {"t": 1345.7333333333333, "x": "家族からの申し出は、まだ無いということだった。"}, {"t": 1348.75, "x": "みんな、何をすればいいか迷っていたのね。"}, {"t": 1351.3833333333334, "x": "そして10月、外務省に新しい情報が届く。"}, {"t": 1355.1333333333334, "x": "1961年10月10日、参議院の外務委員会。"}, {"t": 1358.9833333333333, "x": "小坂善太郎外務大臣が新しい報告をした。"}, {"t": 1362.0333333333333, "x": "ある国際機関を通じて、情報を手に入れた。"}, {"t": 1364.8666666666666, "x": "10月3日付の、シェンクワンにいる\n最高権威筋の情報だ。"}, {"t": 1368.8, "x": "最高権威筋って誰なの？"}, {"t": 1370.7166666666667, "x": "答弁では、名前は伏せられている。"}, {"t": 1372.8333333333333, "x": "のちのアジア局長は、\nラオスの中立政権の最高首脳と言った。"}, {"t": 1377.0, "x": "それで何て言ってきたの？"}, {"t": 1378.6666666666667, "x": "中身はこうだ。"}, {"t": 1379.6666666666667, "x": "辻議員と直接会ったことはない。"}, {"t": 1381.7666666666667, "x": "辻議員は6月にバンビエンにいたが、\nその後は分からない。"}, {"t": 1385.1333333333334, "x": "ただ情報によれば、シェンクワンに来た\nあとハノイを経て中国に向かったらしい。"}, {"t": 1389.5666666666666, "x": "中国へ向かったかもしれないの？"}, {"t": 1391.6166666666666, "x": "外務大臣はすぐにこう付け加えた。"}, {"t": 1393.85, "x": "これは間接的な情報で、本当かどうか断定できない。"}, {"t": 1397.4666666666667, "x": "これも又聞きなのね。"}, {"t": 1399.0166666666667, "x": "そうだ。しかも北ベトナム側は\n入った形跡が無いと答えている。"}, {"t": 1402.9666666666667, "x": "外務大臣は、調べ方の中身は言えないとも述べた。"}, {"t": 1406.25, "x": "議員の身に危険が及ばないようにするためだ。"}, {"t": 1409.0, "x": "生きている前提で、慎重に動いていたのね。"}, {"t": 1412.35, "x": "中国へ向かったなら、中国に聞くしかない。"}, {"t": 1415.1, "x": "でも当時の日本は、中国とも国交が無かった。"}, {"t": 1418.3333333333333, "x": "じゃあ、どうやって聞いたの？"}, {"t": 1420.0, "x": "赤十字を使った。"}, {"t": 1421.3833333333334, "x": "12月2日に、日本赤十字社が\n中国紅十字会に問い合わせた。"}, {"t": 1425.75, "x": "辻議員が中国に入ったか。無事かどうか。"}, {"t": 1428.6666666666667, "x": "中国の赤十字ね。"}, {"t": 1430.2833333333333, "x": "12月25日付で返事の手紙が来た。"}, {"t": 1433.15, "x": "大臣は国会で、その返事をそのまま紹介した。"}, {"t": 1436.3666666666666, "x": "中国に入国した可能性があるという\n日本側の話は、全く根拠がない。"}, {"t": 1441.0833333333333, "x": "したがって行方の調べに協力する方法がない。"}, {"t": 1444.1, "x": "はっきり否定されたのね。"}, {"t": 1445.8, "x": "そうだ。中国へ向かったらしいという\n線は、ここで否定された。"}, {"t": 1449.5333333333333, "x": "参議院の事務局も、のちに同じ経過を報告している。"}, {"t": 1452.9833333333333, "x": "12月の照会と根拠がないという回答だ。"}, {"t": 1455.8833333333334, "x": "北ベトナムもいない、中国もいないって言うのね。"}, {"t": 1458.9, "x": "そうだ。どの国からも、いるという\n答えは返ってこなかった。"}, {"t": 1462.5166666666667, "x": "残ったのは、バンビエンの6月までの話だけだ。"}, {"t": 1465.75, "x": "年が明けたら、また何か出てくるの？"}, {"t": 1468.2, "x": "出てきた。ただし、うわさばかりだ。"}, {"t": 1471.1, "x": "1962年1月5日、香港の新聞が1本の記事を出した。"}, {"t": 1475.8166666666666, "x": "上海から香港へ来た中国人の話として、こう書いた。"}, {"t": 1479.5666666666666, "x": "辻議員は吉林省の琿春で訓練の指導をしている。"}, {"t": 1482.9333333333334, "x": "琿春ってどこなの？"}, {"t": 1484.4, "x": "中国の東北で、北朝鮮やソ連との境に近い町だ。"}, {"t": 1488.25, "x": "日本の新聞にも、\n学校の教官をしているという話が出た。"}, {"t": 1492.1833333333334, "x": "本当だったの？"}, {"t": 1493.3833333333334, "x": "外務大臣は、全く真偽が分からないと答えている。"}, {"t": 1496.6833333333334, "x": "香港の総領事館が、記事を書いた\n人にもう一度問い合わせた。"}, {"t": 1500.5, "x": "答えは、その後何も新しい情報は無い、だった。"}, {"t": 1503.8, "x": "書いた人もそれ以上は知らなかったのね。"}, {"t": 1506.3166666666666, "x": "そうだ。外務大臣は依然不明と言うしかないと述べた。"}, {"t": 1509.6, "x": "ほかにも中国の吉林にいたという\n話が国会で出ている。"}, {"t": 1513.15, "x": "ある議員が、別の議員が香港で\n聞いた話として持ち出した。"}, {"t": 1517.0333333333333, "x": "でもそれも確かめられないのよね？"}, {"t": 1519.1666666666667, "x": "そうだ。議員自身も確証は得られないと言っている。"}, {"t": 1522.15, "x": "失踪から1年近く、話はどれも人づてだった。"}, {"t": 1525.6666666666667, "x": "うわさだけがどんどん増えていったのね。"}, {"t": 1527.8666666666666, "x": "そして4月、北京からの話が国会に持ち込まれる。"}, {"t": 1531.3, "x": "これがさらに話をややこしくした。"}, {"t": 1534.0833333333333, "x": "1962年の初め、日本の議員団が中国を訪れた。"}, {"t": 1538.3166666666666, "x": "その1人が1月5日に北京で\n中国側の人に辻議員のことを尋ねた。"}, {"t": 1543.0166666666667, "x": "1月12日に返事が来た。"}, {"t": 1544.9166666666667, "x": "参議院の庶務部長が国会で報告している。"}, {"t": 1547.85, "x": "何て言われたの？"}, {"t": 1549.0333333333333, "x": "調査機関を動員したが紅十字会と\n同じ答えしかできない。"}, {"t": 1552.6333333333334, "x": "ただし日本を離れたあとに中国へ来て、\n10日前後いたのは事実だ。"}, {"t": 1556.8666666666666, "x": "えっ、中国にいたって言ったの？"}, {"t": 1558.9666666666667, "x": "そう伝えられた。しかし外務大臣は首をかしげた。"}, {"t": 1562.1833333333334, "x": "4月4日に東京を出て、その日のうちに\nサイゴンに着いている。"}, {"t": 1565.85, "x": "そのあともプノンペンと\nバンコクとラオスで日付が続く。"}, {"t": 1569.0333333333333, "x": "その間に北京へ寄ることは考えられない、とな。"}, {"t": 1572.15, "x": "日付が合わないのね。"}, {"t": 1573.6166666666666, "x": "そうだ。外務大臣はこの話は全く初耳だとも言った。"}, {"t": 1577.35, "x": "北京では別の風説も伝えられた。"}, {"t": 1579.6333333333334, "x": "共産軍の側に入ろうとして後ろから\n米軍に撃たれたという話だ。"}, {"t": 1583.7833333333333, "x": "それって本当なの？"}, {"t": 1585.2166666666667, "x": "伝えた本人も責任は持てないと言っていた。"}, {"t": 1587.95, "x": "外務大臣はこの話をアメリカ政府に確かめた。"}, {"t": 1591.1833333333334, "x": "アメリカは何て答えたの？"}, {"t": 1592.9, "x": "答えはすぐに返ってきた。"}, {"t": 1595.2333333333333, "x": "1962年4月18日、参議院の外務委員会。"}, {"t": 1599.2666666666667, "x": "小坂外務大臣が委員会の始めにこう報告した。"}, {"t": 1602.4833333333333, "x": "きのうアメリカのライシャワー大使が来た。"}, {"t": 1604.7, "x": "アメリカ政府としても十分に調べてみた。"}, {"t": 1607.25, "x": "そのようなことはごうまつもない、という返事だった。"}, {"t": 1610.2833333333333, "x": "ごうまつもないって？"}, {"t": 1611.6333333333334, "x": "ほんの少しもないという意味だ。"}, {"t": 1613.5666666666666, "x": "アメリカもきっぱり否定したのね。"}, {"t": 1615.7, "x": "そうだ。こうして1年の間にいくつもの線が消えた。"}, {"t": 1618.9166666666667, "x": "北ベトナムは入った形跡が無いと答えた。"}, {"t": 1621.6333333333334, "x": "中国の紅十字会は全く根拠が無いと答えた。"}, {"t": 1624.7833333333333, "x": "アメリカはごうまつもないと答えた。"}, {"t": 1626.9166666666667, "x": "誰も辻さんのことを知らないって言うのね。"}, {"t": 1629.45, "x": "外務省のアジア局長はこう状況をまとめている。"}, {"t": 1632.3, "x": "北ベトナムにはいないと北ベトナムが言っている。"}, {"t": 1635.0666666666666, "x": "そうなるとやはり中国ではないかと判断している、と。"}, {"t": 1638.35, "x": "でも中国は来ていないって言ったのよね？"}, {"t": 1640.8, "x": "そうだ。答えが互いにかみ合わなかった。"}, {"t": 1643.2666666666667, "x": "このすぐあと参議院がついに正式に話し合う。"}, {"t": 1646.1833333333334, "x": "議員の席をどうするかってことね。"}, {"t": 1648.85, "x": "1962年5月4日、参議院の議院運営委員会。"}, {"t": 1652.8166666666666, "x": "委員長がこう告げた。"}, {"t": 1654.1333333333334, "x": "議員辻政信君に関する件を議題とする。"}, {"t": 1657.0833333333333, "x": "議員1人のことが正式な議題になったのね。"}, {"t": 1660.0333333333333, "x": "事務総長が1年分の経過を報告した。"}, {"t": 1662.7333333333333, "x": "旅券の申請からビエンチャンの寺、\nバンビエンの話まで。"}, {"t": 1666.15, "x": "そのうえで2つの問題をあげた。"}, {"t": 1668.2833333333333, "x": "2つ？"}, {"t": 1669.4, "x": "1つ目はこれからどう調べるか。"}, {"t": 1671.3833333333334, "x": "外務省に強く頼む。民間の団体や商社にも話を聞く。"}, {"t": 1675.3333333333333, "x": "参議院から現地へ捜査団を送る考え方もある。"}, {"t": 1678.5, "x": "現地まで探しに行く案も出たのね。"}, {"t": 1680.7833333333333, "x": "2つ目は議員の身分をどうするかだ。"}, {"t": 1682.95, "x": "国会に出られない議員をそのままにしてよいのか。"}, {"t": 1685.8666666666666, "x": "席はずっと空いたままだものね。"}, {"t": 1687.8666666666666, "x": "事務総長は法律を1つずつ見ていった。"}, {"t": 1690.4333333333334, "x": "最初は国会法の第124条だ。"}, {"t": 1693.0833333333333, "x": "どういう決まりなの？"}, {"t": 1694.3833333333334, "x": "休みの期限が過ぎて呼び出しても\n出てこない議員を懲罰にかける決まりだ。"}, {"t": 1698.6333333333334, "x": "でも事務総長はこの決まりを当てはめなかった。"}, {"t": 1701.9666666666667, "x": "事務総長はこう述べている。"}, {"t": 1703.6, "x": "呼び出しの紙を受け取れないことが\n明らかなのに、懲罰にかけるのは形式的すぎる。"}, {"t": 1708.7333333333333, "x": "受け取れない人を罰するのは変よね。"}, {"t": 1711.0666666666666, "x": "そうだ。さらにこう続けた。"}, {"t": 1712.9166666666667, "x": "もし帰りたいのに自由を\n奪われていたと後で分かったら。"}, {"t": 1716.0333333333333, "x": "あるいは身に不幸があったと後で分かったら。"}, {"t": 1718.45, "x": "参議院としてとても後味の悪いものを残す。"}, {"t": 1721.3666666666666, "x": "罰したあとで本当は捕まっていたと\n分かったら困るのね。"}, {"t": 1724.8333333333333, "x": "では特別な法律を作って議席を外せるか。"}, {"t": 1727.75, "x": "これも憲法の上で疑いがあるとした。"}, {"t": 1730.0666666666666, "x": "任期の途中の議員の身分を\n憲法に無いやり方で奪うことになるからだ。"}, {"t": 1734.3333333333333, "x": "簡単には席を外せないのね。"}, {"t": 1736.4333333333334, "x": "最後に民法の第30条にも触れた。"}, {"t": 1738.8833333333334, "x": "生きているか分からない状態が\n7年続けば失踪の宣告ができる。"}, {"t": 1743.0333333333333, "x": "失踪の宣告？"}, {"t": 1744.3666666666666, "x": "家庭裁判所が法律の上で\n亡くなったものとみなす手続きだ。"}, {"t": 1748.0833333333333, "x": "事務総長はそれはしばらく時間が\nたってからの問題だと言った。"}, {"t": 1751.7666666666667, "x": "そして報告をこう結んでいる。"}, {"t": 1753.65, "x": "一日も早く元気に帰国されることを心から祈っている。"}, {"t": 1757.35, "x": "参議院は帰りを待つと決めたのね。"}, {"t": 1760.1, "x": "議院運営委員会では外務大臣も答えている。"}, {"t": 1762.8333333333333, "x": "国交の無い国に入ろうとして出かけられたことだ。"}, {"t": 1765.8166666666666, "x": "何とかしてつかみたいと非常に努力している。"}, {"t": 1768.6666666666667, "x": "責任者は誰だったの？"}, {"t": 1770.35, "x": "議員がそう聞くと大臣はアジア局長だと答えた。"}, {"t": 1773.3666666666666, "x": "委員の1人は、議長から外務省に\n強く申し入れてほしいと求めた。"}, {"t": 1777.4833333333333, "x": "あらゆる機関を動かして調べを続けてほしい、とな。"}, {"t": 1780.7166666666667, "x": "それで何か分かったの？"}, {"t": 1782.3333333333333, "x": "1年後の1963年3月、参議院の内閣委員会。"}, {"t": 1786.65, "x": "ある議員がぽつりと聞いた。"}, {"t": 1788.2, "x": "辻議員の消息は全く無いが、\n新しいニュースはもう無いのか。"}, {"t": 1792.1, "x": "外務省は何て答えたの？"}, {"t": 1793.9333333333334, "x": "外務省の参事官の答えはこうだ。"}, {"t": 1796.15, "x": "いろいろな情報があるが、きめ手になる情報はない。"}, {"t": 1799.05, "x": "各種の情報を裏づける確かな証拠がつかめない。"}, {"t": 1802.2166666666667, "x": "うわさはあっても証拠が無いのね。"}, {"t": 1804.2, "x": "そうだ。2年たっても6月のバンビエンより\n先は分からなかった。"}, {"t": 1808.05, "x": "そして3年目、話は家族の暮らしにまで及ぶ。"}, {"t": 1811.35, "x": "家族の暮らし？"}, {"t": 1812.5333333333333, "x": "税金の話だ。"}, {"t": 1814.4166666666667, "x": "1964年3月24日、参議院の大蔵委員会。"}, {"t": 1818.55, "x": "1人の議員がこう質問した。"}, {"t": 1820.4833333333333, "x": "辻さんは3年以上も生死が分からない。"}, {"t": 1822.9166666666667, "x": "それなら辻さんの奥さんを寡婦と決めてしまうのか。"}, {"t": 1825.9833333333333, "x": "寡婦って夫を亡くした女の人のことよね？"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);

sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
