<script>
const D={"name": "151", "file": "151_編集用", "dur": 2090.69996875, "segs": [], "subs": [{"t": 0.0, "x": "1961年3月30日、参議院の分科会。"}, {"t": 3.966666666666667, "x": "1人の議員が、国鉄の予算を問いただしていた。"}, {"t": 7.066666666666666, "x": "赤字の路線が、選挙の都合で造られている。"}, {"t": 9.916666666666666, "x": "借りたお金の利子も、国が持つべきだ。"}, {"t": 12.516666666666667, "x": "ずいぶん強い口ぶりの議員ね？"}, {"t": 14.516666666666667, "x": "最後に議員は、こう言って質問を終えた。"}, {"t": 16.95, "x": "これで終わります。1時間近く申しました。"}, {"t": 19.783333333333335, "x": "あげ足をとるつもりではない、と。"}, {"t": 21.8, "x": "それがこの回の始まりなの？"}, {"t": 23.75, "x": "そうだ。国会会議録にこの議員の声が\n残るのは、この日が最後だ。"}, {"t": 28.016666666666666, "x": "議員の名前は辻政信。"}, {"t": 29.75, "x": "5日後の4月4日、羽田空港を飛び立った。"}, {"t": 32.766666666666666, "x": "そして、4月21日の午前9時ごろ。"}, {"t": 35.55, "x": "ラオスの山の中へ、入ったとみられている。"}, {"t": 38.266666666666666, "x": "とみられている？"}, {"t": 39.416666666666664, "x": "そこから先の足取りが、今も分からないんだ。"}, {"t": 42.233333333333334, "x": "現職の国会議員が、旅先で消えた。"}, {"t": 44.916666666666664, "x": "国会では、そのあと何年も質問が続いた。"}, {"t": 48.03333333333333, "x": "議員が戻らないなんて、大事件よね。"}, {"t": 50.55, "x": "今回は、国会会議録に残った\n言葉だけで足取りを追う。"}, {"t": 54.18333333333333, "x": "外務省の答弁と、参議院の事務局の報告が中心だ。"}, {"t": 57.93333333333333, "x": "うわさもたくさん出たが、うわさはうわさとして言う。"}, {"t": 60.86666666666667, "x": "本人がどうなったかは、決めつけないのね。"}, {"t": 63.583333333333336, "x": "そうだ。家族がいる話でもあるからな。"}, {"t": 66.18333333333334, "x": "じゃあ、まず旅立つ前から見ていくのね。"}, {"t": 69.21666666666667, "x": "1961年4月1日、参議院の本会議。"}, {"t": 72.93333333333334, "x": "議長が、議場にこう諮った。"}, {"t": 74.88333333333334, "x": "海外旅行のため、辻政信君から休みの申し出がある。"}, {"t": 78.53333333333333, "x": "4日から40日間の請暇だ。"}, {"t": 80.81666666666666, "x": "請暇？"}, {"t": 81.95, "x": "議員が国会を休むための、許しのことだ。"}, {"t": 84.73333333333333, "x": "議場からは、異議なしの声が上がった。"}, {"t": 87.05, "x": "これで40日の休みが許された。"}, {"t": 89.4, "x": "会期の途中なのに、休めるのね。"}, {"t": 91.78333333333333, "x": "この年の会期は、5月24日までだった。"}, {"t": 94.75, "x": "そのあと延びて、6月8日までになっている。"}, {"t": 97.55, "x": "休みの届けは、4月4日から5月13日まで。"}, {"t": 101.08333333333333, "x": "5月の半ばには、戻ってくるはずだったのね。"}, {"t": 104.1, "x": "参議院の庶務部長は、のちにこう報告した。"}, {"t": 106.96666666666667, "x": "届けと一緒に、旅の日程も出されていた。"}, {"t": 109.71666666666667, "x": "サイゴン、プノンペン、バンコク。"}, {"t": 111.63333333333334, "x": "そしてラオスのビエンチャンだ。"}, {"t": 113.38333333333334, "x": "東南アジアの都を順番に回るのね。"}, {"t": 115.93333333333334, "x": "そうだ。この旅の最後の町が、\nのちに大きな意味を持つ。"}, {"t": 119.56666666666666, "x": "ビエンチャンね。覚えておくわ。"}, {"t": 121.96666666666667, "x": "旅のための旅券も、手続きの日付が残っている。"}, {"t": 125.16666666666667, "x": "1962年の参議院で、事務総長が報告した。"}, {"t": 129.01666666666668, "x": "3月28日に、議長あてに公用旅券の申請が出た。"}, {"t": 132.96666666666667, "x": "公用旅券って、ふつうの旅券と違うの？"}, {"t": 135.71666666666667, "x": "仕事で外国へ行く公務員や議員に出す旅券だ。"}, {"t": 138.66666666666666, "x": "申請書の行き先は、5つの国だった。"}, {"t": 141.31666666666666, "x": "ベトナム、カンボジア、タイ、ラオス、ビルマ。"}, {"t": 144.16666666666666, "x": "4月4日に東京を出て、5月15日に帰る予定だ。"}, {"t": 147.83333333333334, "x": "帰る日まで書いてあったのね。"}, {"t": 149.68333333333334, "x": "翌29日には、外貨の申請が許された。"}, {"t": 152.7, "x": "そして30日に、旅券が本人に手渡された。"}, {"t": 155.88333333333333, "x": "外務大臣の答弁には、旅券の番号まで出てくる。"}, {"t": 159.11666666666667, "x": "3月30日付の公用旅券、3万3853号。"}, {"t": 163.55, "x": "番号まで、国会で読み上げられたのね。"}, {"t": 166.13333333333333, "x": "外務大臣によると、目的はこう書かれていた。"}, {"t": 169.1, "x": "東南アジアの国々の、政治と経済と教育を見て回る。"}, {"t": 172.76666666666668, "x": "旅券には香港も入り、香港の他は\n入国の許可も付いた。"}, {"t": 176.71666666666667, "x": "きちんとした視察の旅に見えるわね。"}, {"t": 179.08333333333334, "x": "そうだ。書類の上では、何もおかしな所はない。"}, {"t": 182.21666666666667, "x": "本当の計画は、書類には書かれていなかった。"}, {"t": 185.81666666666666, "x": "辻政信ってどんな議員だったの？"}, {"t": 188.05, "x": "国会会議録では、1952年から衆議院で質問している。"}, {"t": 192.41666666666666, "x": "1959年の夏からは、参議院の議員だ。"}, {"t": 195.83333333333334, "x": "本人は国会で、郷里を石川県と話している。"}, {"t": 199.08333333333334, "x": "議員になる前は、何をしていたの？"}, {"t": 201.41666666666666, "x": "もとは陸軍の参謀だ。"}, {"t": 203.01666666666668, "x": "本人が国会で、こう話した日がある。"}, {"t": 205.51666666666668, "x": "1945年5月1日に、ビルマの戦場から\nサイゴンの総司令部へ報告に来た。"}, {"t": 211.15, "x": "戦争中も、あのあたりにいたのね。"}, {"t": 213.5, "x": "戦後のことも、国会で自分から語っている。"}, {"t": 216.35, "x": "戦後は仏印に100日間もぐっていた、とな。"}, {"t": 219.4, "x": "仏印って？"}, {"t": 220.53333333333333, "x": "フランスが治めていた、インドシナのことだ。"}, {"t": 223.15, "x": "今のベトナムやラオスやカンボジアのあたりだ。"}, {"t": 225.65, "x": "のちの国会では、身を隠していた\n時の本を出したとも言われた。"}, {"t": 229.6, "x": "東南アジアには、昔からの縁があったのね。"}, {"t": 232.5, "x": "そうだ。この回では、戦争中の行いの話には入らない。"}, {"t": 236.31666666666666, "x": "見るのは、1961年の旅と国会に残った記録だ。"}, {"t": 240.55, "x": "議員としての辻さんを追うのね。"}, {"t": 242.56666666666666, "x": "参議院の選挙では、全国から多くの票を集めた。"}, {"t": 245.85, "x": "のちに同じ控え室の議員が、\n68万あまりの有権者と言っている。"}, {"t": 250.88333333333333, "x": "国会での辻議員は、変わった申し出もしている。"}, {"t": 253.83333333333334, "x": "1959年3月、衆議院の委員会での発言だ。"}, {"t": 257.81666666666666, "x": "フィリピンの山の中に、まだ\n小野田少尉がいるとされていた。"}, {"t": 261.31666666666666, "x": "戦争が終わっても、山に残っていた兵隊さんね。"}, {"t": 264.6, "x": "そうだ。辻議員は、救出の計画についてこう言った。"}, {"t": 268.05, "x": "旧軍人として責任を感じている私を、送ってほしい。"}, {"t": 271.6333333333333, "x": "1か月の間ジャングルの中へ、と。"}, {"t": 273.98333333333335, "x": "国会議員が、自分で探しに行くって言ったの？"}, {"t": 277.0, "x": "そうだ。さらにこう続けている。"}, {"t": 278.95, "x": "代議士の名前は知らなくても、\n辻参謀の名前は知っているはずだ。"}, {"t": 283.06666666666666, "x": "自分の名前が、通じると思っていたのね。"}, {"t": 285.81666666666666, "x": "自分で動けば何とかなる、という考え方が見える。"}, {"t": 288.98333333333335, "x": "1959年の秋には、ラオスの名前も口にしている。"}, {"t": 292.8833333333333, "x": "ラオスとカンボジアは、\n日本への賠償の求めを自分から放棄した。"}, {"t": 296.8333333333333, "x": "なぜベトナムとも同じように話をまとめないのか、と。"}, {"t": 300.1666666666667, "x": "ラオスのことにも、くわしかったのね。"}, {"t": 302.56666666666666, "x": "その2年後、辻議員は自分の足でラオスへ向かう。"}, {"t": 305.75, "x": "自分の目で、見に行こうとしたのかしら？"}, {"t": 308.26666666666665, "x": "何を見たかったのかは、\n本人の口からは残っていない。"}, {"t": 311.6333333333333, "x": "残っているのは、行く先々で\n大使に話した言葉だけだ。"}, {"t": 315.9166666666667, "x": "1961年4月4日、朝の9時30分。"}, {"t": 319.5833333333333, "x": "辻議員は羽田を立った。"}, {"t": 321.21666666666664, "x": "のちに事務総長は、議員は元気に\n出発されたと報告している。"}, {"t": 325.31666666666666, "x": "見送った人には、ふつうの旅立ちだったのね。"}, {"t": 328.31666666666666, "x": "その日のうちに、南ベトナムのサイゴンに着いた。"}, {"t": 331.3, "x": "今のホーチミン市だ。"}, {"t": 332.73333333333335, "x": "飛行機で1日で着いたのね。"}, {"t": 334.73333333333335, "x": "外務省の答弁によると、\nサイゴンで政府の要人と会った。"}, {"t": 338.28333333333336, "x": "4月8日には、ジエム大統領とも会っている。"}, {"t": 341.21666666666664, "x": "大統領にまで会えたの？"}, {"t": 342.85, "x": "国会議員の視察だからな。ここまでは予定どおりだ。"}, {"t": 346.03333333333336, "x": "ところがサイゴンで、\n日本の大使にある話を打ち明けた。"}, {"t": 349.5, "x": "どんな話？"}, {"t": 350.6333333333333, "x": "北ベトナムに行きたい、という話だ。"}, {"t": 353.0833333333333, "x": "北ベトナムって、南と分かれていた国よね？"}, {"t": 356.1166666666667, "x": "そうだ。当時の日本は、\n北ベトナムとは国交が無かった。"}, {"t": 359.73333333333335, "x": "東京を出る前の外務省では、\nそういう話は出ていなかった。"}, {"t": 363.3, "x": "東京で言っていた行き先は、ラオスと南ベトナムだ。"}, {"t": 366.7, "x": "現地に着いてから、初めて言ったのね。"}, {"t": 369.28333333333336, "x": "そうだ。大使はすぐに止めにかかった。"}, {"t": 372.28333333333336, "x": "1961年9月、参議院の外務委員会。"}, {"t": 375.76666666666665, "x": "外務省の参事官が、サイゴンでのやりとりを報告した。"}, {"t": 379.18333333333334, "x": "辻議員は大使にこう言ったという。"}, {"t": 381.1666666666667, "x": "前にもあの地方へは出かけたことがある。"}, {"t": 383.43333333333334, "x": "事情はよく知っている。"}, {"t": 384.81666666666666, "x": "昔使った部下もあのあたりにいるから、大丈夫だ。"}, {"t": 388.0833333333333, "x": "自信たっぷりね。"}, {"t": 389.35, "x": "大使の答えはこうだった。"}, {"t": 390.96666666666664, "x": "状況は、前と今とでは違う。"}, {"t": 393.0, "x": "治安もよくないし、日本への感情も\n当時と同じではない。"}, {"t": 396.4166666666667, "x": "命の安全は保証できない。"}, {"t": 398.0833333333333, "x": "行かないほうがいい。"}, {"t": 399.3333333333333, "x": "大使ははっきり止めたのね。"}, {"t": 401.15, "x": "そうだ。極力説得したと報告されている。"}, {"t": 404.2, "x": "それでも、辻さんは聞かなかったの？"}, {"t": 406.56666666666666, "x": "結果として、聞き入れなかったとされている。"}, {"t": 409.1333333333333, "x": "外務大臣は、国会でこう答えたこともある。"}, {"t": 411.96666666666664, "x": "国会議員の身分がある。"}, {"t": 413.3833333333333, "x": "大使が何を言うかとなれば、\nそれ以上は止められない。"}, {"t": 416.56666666666666, "x": "大使より、議員のほうが立場が強かったのね。"}, {"t": 419.55, "x": "そうだ。ここがあとで、国会で\n何度も問われる所になる。"}, {"t": 423.1666666666667, "x": "止める力が無かったってことね。"}, {"t": 425.8333333333333, "x": "辻議員はサイゴンを離れて、次の町へ向かった。"}, {"t": 428.8833333333333, "x": "4月9日ごろ、カンボジアの都プノンペン。"}, {"t": 431.73333333333335, "x": "外務大臣の答弁では、11日まで滞在した。"}, {"t": 435.03333333333336, "x": "そして11日に、タイのバンコクへ移った。"}, {"t": 437.9166666666667, "x": "日程どおりに回っているのね。"}, {"t": 439.8333333333333, "x": "ここまではな。届けた日程とも合っている。"}, {"t": 442.46666666666664, "x": "4月14日ごろ、辻議員は\nバンコクからラオスへ向かった。"}, {"t": 446.0, "x": "そのとき、1人の日本人が付き添っていた。"}, {"t": 448.95, "x": "だれ？"}, {"t": 450.0833333333333, "x": "タイの日本大使館の防衛駐在官だ。"}, {"t": 452.5833333333333, "x": "ラオスの大使館の仕事も、かけもちしていた人だ。"}, {"t": 455.93333333333334, "x": "防衛駐在官って？"}, {"t": 457.45, "x": "大使館に置かれる、自衛隊出身の担当者のことだ。"}, {"t": 460.85, "x": "のちの国会で、議員がこう問いただしている。"}, {"t": 463.5, "x": "防衛庁の担当者が途中まで同行したなら、\nなおさら止めるべきだった。"}, {"t": 467.9, "x": "付き添いがいたのに、止められなかったのね。"}, {"t": 470.56666666666666, "x": "そうだ。こうして4月14日に、\nラオスの都ビエンチャンに着いた。"}, {"t": 474.56666666666666, "x": "ここが、届けた日程の最後の町だ。"}, {"t": 477.21666666666664, "x": "いよいよ最後の町ね。"}, {"t": 478.73333333333335, "x": "ここで辻議員は、旅の本当の目的を口にする。"}, {"t": 482.6166666666667, "x": "ビエンチャンには、ラオスの日本大使がいた。"}, {"t": 485.18333333333334, "x": "辻議員はこの大使にこう話した。"}, {"t": 487.3333333333333, "x": "パテトラオが占めている地区を、通り抜けたい。"}, {"t": 489.9166666666667, "x": "そこからハノイに渡り、香港に出て日本へ帰る。"}, {"t": 493.0833333333333, "x": "ラオスから北ベトナムへ山を越えるの？"}, {"t": 495.45, "x": "そうだ。陸の道で共産側の地区を抜けていく計画だ。"}, {"t": 498.98333333333335, "x": "外務大臣は、大使がこの計画を\n無謀だと説いたと答えている。"}, {"t": 502.85, "x": "大使は、思いとどまるように説得に努めた。"}, {"t": 505.73333333333335, "x": "それでも議員は聞き入れなかった。"}, {"t": 507.75, "x": "ここでも止められなかったのね。"}, {"t": 509.7, "x": "さらに辻議員は、こんなことも言ったという。"}, {"t": 512.2666666666667, "x": "僧侶に変装して行く、と。"}, {"t": 514.2333333333333, "x": "お坊さんの姿で？"}, {"t": 515.6333333333333, "x": "そうだ。大使はこれにも反対した。"}, {"t": 517.9, "x": "国会議員がそういうことをするのは、\n大使として迷惑だ。"}, {"t": 521.3333333333334, "x": "そう言って思いとどまらせようとした、と\n報告されている。"}, {"t": 524.7333333333333, "x": "迷惑とまで言ったのね。"}, {"t": 526.3333333333334, "x": "大使にとっては、それだけ危ない話だった。"}, {"t": 529.1666666666666, "x": "当時のラオスが\nどんな国だったかを見ると、よく分かる。"}, {"t": 532.4833333333333, "x": "ラオスはどうなっていたの？"}, {"t": 534.5666666666667, "x": "外務省の参事官は、国会でこう説明した。"}, {"t": 537.6, "x": "ラオスでは、3つの勢力が争っている。"}, {"t": 540.1833333333333, "x": "1つはブンウムという首相の政府。"}, {"t": 542.2833333333333, "x": "1つは中立派のプーマ殿下。"}, {"t": 544.2833333333333, "x": "もう1つが左翼系のパテトラオだ。"}, {"t": 546.6333333333333, "x": "1つの国の中で、3つに分かれていたのね。"}, {"t": 549.6666666666666, "x": "そうだ。日本が国交を\n結んでいたのは、ラオスの政府だ。"}, {"t": 553.2, "x": "パテトラオの側とは、日本政府は\n関係を持っていなかった。"}, {"t": 556.8666666666667, "x": "じゃあ、そっちに入ったら守れないってこと？"}, {"t": 559.5666666666667, "x": "そういうことだ。参事官はこう答えている。"}, {"t": 562.1333333333333, "x": "パテトラオ側に入ったなら、\n正式に保護を頼む相手がいない。"}, {"t": 565.95, "x": "日本の政府の手が届かない場所なのね。"}, {"t": 568.5, "x": "しかも国の中では、戦いが続いていた。"}, {"t": 571.2666666666667, "x": "のちの答弁でも、交戦地区という\n言葉が何度も出てくる。"}, {"t": 574.9, "x": "そんな所に、議員が入ろうとしていたの？"}, {"t": 577.65, "x": "そうだ。しかも正面からの道は使えなかった。"}, {"t": 580.6166666666667, "x": "パテトラオの通行手形が、手に入らなかったからだ。"}, {"t": 583.95, "x": "通行手形？"}, {"t": 585.0833333333334, "x": "安導券という。その地区を進むための許可の紙だ。"}, {"t": 588.3166666666667, "x": "辻議員はこの紙を手に\n入れようとしたが、うまくいかなかった。"}, {"t": 592.4833333333333, "x": "安導券が無いなら、どうするか。"}, {"t": 594.5333333333333, "x": "事務総長の報告によると、辻議員はこう決めた。"}, {"t": 597.6833333333333, "x": "ビエンチャンからルアンプラバンへの道を行く。"}, {"t": 599.9666666666667, "x": "ただし、表の道を避けて間道を行く。"}, {"t": 602.5833333333334, "x": "間道って？"}, {"t": 603.7166666666667, "x": "人目につかないわき道のことだ。"}, {"t": 605.8166666666667, "x": "実は1度ひとりで入ろうとして、うまくいかなかった。"}, {"t": 609.1833333333333, "x": "1回失敗していたの？"}, {"t": 610.8666666666667, "x": "これはずっとあとの、1973年の国会で分かった話だ。"}, {"t": 615.1833333333333, "x": "外務省の担当者がこう答えている。"}, {"t": 617.4, "x": "辻議員はビエンチャンで\nひとりでの潜入を試みたが、失敗した。"}, {"t": 621.3666666666667, "x": "ひとりではどうしてもだめだ、と考えたらしい。"}, {"t": 624.1833333333333, "x": "それで誰かを頼ったのね？"}, {"t": 625.9666666666667, "x": "そうだ。日本の銀行のビエンチャンの支店に頼んだ。"}, {"t": 629.1333333333333, "x": "支店長を通じて、そこで働く日本人に手助けを求めた。"}, {"t": 633.1833333333333, "x": "その人は、辻さんの知り合いだったの？"}, {"t": 635.7, "x": "答弁では、それまで全く面識が無かったとされている。"}, {"t": 639.15, "x": "その日本人は、支店長に言われて手配を始めた。"}, {"t": 642.45, "x": "見ず知らずの人が、急に巻き込まれたのね。"}, {"t": 645.2833333333333, "x": "そうだ。手配の先は銀行の隣のお寺だった。"}, {"t": 648.95, "x": "銀行の隣には寺があり、ラオスの僧侶がいた。"}, {"t": 651.9333333333333, "x": "その日本人は僧侶に頼み、\n道案内を引き受けてもらった。"}, {"t": 655.65, "x": "1961年の外務大臣の答弁には、\nクンタ寺院という寺の名前が出てくる。"}, {"t": 660.9333333333333, "x": "その住職に話をつけ、2人の僧侶が案内に付いた。"}, {"t": 664.6333333333333, "x": "お坊さんが2人も付いたのね。"}, {"t": 666.5666666666667, "x": "そして、辻議員自身も姿を変えた。"}, {"t": 669.1, "x": "髪を短く切って、僧衣をまとった。"}, {"t": 671.6166666666667, "x": "本当にお坊さんの姿になったのね。"}, {"t": 674.0833333333334, "x": "名乗った名前は「青木」。"}, {"t": 675.6833333333333, "x": "日本の高僧で、仏跡をたずねてラオスに来た。"}, {"t": 678.6833333333333, "x": "そういうふれ込みだったと答弁にある。"}, {"t": 680.9, "x": "仏跡って？"}, {"t": 682.0333333333333, "x": "仏教にゆかりのある古い場所のことだ。"}, {"t": 684.4, "x": "持ち物も、外務大臣が国会で読み上げている。"}, {"t": 687.3666666666667, "x": "トランクに黒い背広が1着。"}, {"t": 689.3, "x": "それに、いくらかのお金とその他の物だ。"}, {"t": 692.1, "x": "黒い背広を持っていったの？"}, {"t": 693.8666666666667, "x": "そうだ。この背広は、あとでもう一度出てくる。"}, {"t": 696.7833333333333, "x": "なんだか気になる持ち物ね。"}, {"t": 698.65, "x": "覚えておいてくれ。黒い背広だ。"}, {"t": 701.2833333333333, "x": "1961年4月19日ごろの朝。"}, {"t": 704.35, "x": "ビエンチャンを、1台のジープが出た。"}, {"t": 706.6333333333333, "x": "誰の車なの？"}, {"t": 707.9166666666666, "x": "1973年の答弁では、銀行のジープとある。"}, {"t": 711.55, "x": "乗っていたのは手配をした日本人。"}, {"t": 713.6, "x": "2人の僧侶。そして僧の姿の辻議員だ。"}, {"t": 716.7166666666667, "x": "4人でどこへ向かったの？"}, {"t": 718.3333333333334, "x": "ビエンチャンから、およそ5キロ離れた村だ。"}, {"t": 720.95, "x": "そこで日本人は車を降りて見送った。"}, {"t": 723.3333333333334, "x": "辻議員と2人の僧侶は、北へ向かって歩いていった。"}, {"t": 726.7333333333333, "x": "それが、日本人が見た最後の姿なの？"}, {"t": 729.5333333333333, "x": "答弁で語られている日本人との\nつながりは、そこまでだ。"}, {"t": 733.0166666666667, "x": "外務省の別の答弁にも、同じ日付がある。"}, {"t": 735.95, "x": "4月19日ごろ、間道を選んで\nビエンチャンから北上した。"}, {"t": 739.7166666666667, "x": "日付がちゃんとそろっているのね。"}, {"t": 741.75, "x": "そうだ。ここからは、寺から寺へ渡っていく旅になる。"}, {"t": 745.1, "x": "外務省はこれを、リレーのような渡り方と言っている。"}, {"t": 748.2666666666667, "x": "寺から寺へバトンを渡すみたいに？"}, {"t": 750.4833333333333, "x": "そうだ。僧から僧へ、奥へ奥へと手引きされた。"}, {"t": 753.5333333333333, "x": "その寺のつながりも、やがて途切れる。"}, {"t": 756.5166666666667, "x": "外務大臣は国会でこう答えている。"}, {"t": 758.8166666666667, "x": "寺院から寺院へのリレー式な渡り方で、奥地へ入った。"}, {"t": 762.25, "x": "第3番目の寺院から先の行方は、確かめられていない。"}, {"t": 765.8666666666667, "x": "3つ目のお寺までは、分かっていたのね？"}, {"t": 768.4333333333333, "x": "外務省はあとで、このルートをたどって調べている。"}, {"t": 771.3, "x": "辻議員が使った寺院沿いの道を、\n現地の公館が追った。"}, {"t": 774.9833333333333, "x": "それでも、3つ目の先は分からなかったの？"}, {"t": 777.8, "x": "そうだ。交戦地区のことでもあり、\n確かめられなかった。"}, {"t": 781.1833333333333, "x": "外務大臣はここを交戦地区と呼んでいる。"}, {"t": 783.7833333333333, "x": "戦っている場所の中なのね。"}, {"t": 785.8333333333334, "x": "事務総長の報告も同じ所で話が止まる。"}, {"t": 788.8333333333334, "x": "寺院から寺院へと手引きされ、\n奥地へ向けて出発した。"}, {"t": 792.2666666666667, "x": "そのまま消息を絶った、とな。"}, {"t": 794.4333333333333, "x": "お寺の道の先で、消えてしまったのね。"}, {"t": 797.0833333333334, "x": "ただ、外務省はある時刻をあげている。"}, {"t": 799.4, "x": "4月21日の朝の時刻だ。"}, {"t": 801.7666666666667, "x": "時刻まで分かるの？"}, {"t": 803.15, "x": "確かめた時刻ではない。"}, {"t": 804.5666666666667, "x": "状況から考えた時刻だ。"}, {"t": 806.4833333333333, "x": "それでも答弁には、何度もこの時刻が出てくる。"}, {"t": 809.6, "x": "いったい何時なの？"}, {"t": 811.3833333333333, "x": "外務省の参事官はこう答えた。"}, {"t": 813.4833333333333, "x": "これは確認されていないが、状況から判断すると。"}, {"t": 816.7333333333333, "x": "4月21日の午前9時ごろ、パテトラオの地域に入った。"}, {"t": 820.6833333333333, "x": "それが、記録に残った最後の時刻なのね。"}, {"t": 823.6166666666667, "x": "そうだ。外務大臣も同じ時刻をあげている。"}, {"t": 826.3833333333333, "x": "4月21日午前9時ごろ、\nパテトラオ地区へ入ったと思われる。"}, {"t": 830.5333333333333, "x": "思われる、なのね。"}, {"t": 831.95, "x": "誰かが見届けたわけではない、という言い方だ。"}, {"t": 834.75, "x": "羽田を出てから、17日後のことだ。"}, {"t": 837.45, "x": "休みの届けは5月13日までよね。"}, {"t": 840.1333333333333, "x": "そうだ。まだ半分も過ぎていない。"}, {"t": 842.25, "x": "外務省は、このあとの事情をこう言う。"}, {"t": 844.5, "x": "それから辻議員の消息が絶えた。"}, {"t": 846.8166666666667, "x": "日本の家族は、このことを知っていたの？"}, {"t": 849.4, "x": "家族への手紙は、4月中旬に1通届いていた。"}, {"t": 852.6666666666666, "x": "それより後には、手紙は来ていない。"}, {"t": 854.9833333333333, "x": "4月の半ばで、手紙も止まったのね。"}, {"t": 857.6, "x": "そうだ。羽田を立ってまもなく、音信が途絶えていた。"}, {"t": 860.9, "x": "ところが東京では、しばらく誰も騒がなかった。"}, {"t": 864.0166666666667, "x": "どうして？"}, {"t": 865.3833333333333, "x": "計画は、家族にも参議院にも知らされていなかった。"}, {"t": 868.6833333333333, "x": "事務総長の報告にこうある。"}, {"t": 870.5, "x": "パテトラオ地区に入る計画を、家族にも秘めていた。"}, {"t": 873.85, "x": "家族も知らなかったのね。"}, {"t": 875.5833333333334, "x": "5月13日に休みの期限が過ぎた。"}, {"t": 878.1666666666666, "x": "5月15日に帰国の予定日も過ぎた。"}, {"t": 880.75, "x": "それでも辻議員は戻らなかった。"}, {"t": 882.9166666666666, "x": "誰が最初に気づいたの？"}, {"t": 884.6, "x": "5月20日ごろ、議員の秘書が参議院の庶務課に来た。"}, {"t": 888.0, "x": "議員の行方が分からなくなっている、という知らせだ。"}, {"t": 890.9666666666667, "x": "事務局は、このとき初めて事情を知った。"}, {"t": 893.65, "x": "羽田を出てまもなく、家族への便りも\n途絶えていたことだ。"}, {"t": 897.2333333333333, "x": "1か月以上も、誰も知らなかったのね。"}, {"t": 899.9166666666666, "x": "外務省は5月24日に、大使館などに訓令を出した。"}, {"t": 903.5833333333334, "x": "議員の消息を調べよ、という命令だ。"}, {"t": 906.0666666666667, "x": "参議院の庶務部も、5月28日に\n外務省へ問い合わせた。"}, {"t": 909.95, "x": "6月10日にも聞いたが、どちらも分からなかった。"}, {"t": 913.15, "x": "手がかりが何も無かったのね。"}, {"t": 915.1166666666667, "x": "6月8日には、その年の国会の会期も終わった。"}, {"t": 918.45, "x": "議員の席は空いたまま、夏がくる。"}, {"t": 921.3333333333334, "x": "6月19日、参議院の庶務課長が電話をかけた。"}, {"t": 924.7333333333333, "x": "相手は辻議員の妻だ。"}, {"t": 926.4333333333333, "x": "どんな電話だったの？"}, {"t": 927.85, "x": "庶務課長は、国会でこう説明している。"}, {"t": 930.4666666666667, "x": "お見舞いを申し上げた。"}, {"t": 931.8, "x": "先生から連絡があったら、すぐに知らせてほしい。"}, {"t": 934.8, "x": "こちらも、消息が分かりしだいお知らせする。"}, {"t": 937.6333333333333, "x": "家族は、家で待つしかなかったのね。"}, {"t": 940.1, "x": "のちの国会で、ある議員はこう話している。"}, {"t": 942.7166666666667, "x": "党派は違うが、辻さんとは住まいが隣同士だ。"}, {"t": 945.8, "x": "毎日お宅を見て安否を心配している、と。"}, {"t": 948.6, "x": "隣の人まで心配していたのね。"}, {"t": 950.9333333333333, "x": "衆議院の外務委員会では、こんな言葉もある。"}, {"t": 953.75, "x": "家族からも捜索願が出たはずだ、と\n議員が述べている。"}, {"t": 957.3333333333334, "x": "家族もできることをしていたのね。"}, {"t": 959.45, "x": "そうだ。この回では家族の名前は出さない。"}, {"t": 962.0833333333334, "x": "待ち続けた人がいたということだけ、\n覚えておいてほしい。"}, {"t": 965.5666666666667, "x": "うん。それが一番大事なことね。"}, {"t": 967.7833333333333, "x": "外務省のほうは、北の国へ手を伸ばしていた。"}, {"t": 970.7333333333333, "x": "北ベトナムに入ったかどうかね？"}, {"t": 973.35, "x": "辻議員の計画は、ハノイへ抜けることだった。"}, {"t": 976.25, "x": "なら、北ベトナムに入っているかもしれない。"}, {"t": 978.8666666666667, "x": "外務省はそう考えて調べ始めた。"}, {"t": 981.3166666666667, "x": "でも国交が無いのよね？"}, {"t": 982.9833333333333, "x": "そうだ。正式には聞けない。"}, {"t": 984.8666666666667, "x": "7月に、ある人が用事で\n北ベトナムへ向かうと分かった。"}, {"t": 988.4333333333333, "x": "外務省はその人に非公式に頼んだ。"}, {"t": 990.9666666666667, "x": "辻議員の話があったら、調べて知らせてほしい。"}, {"t": 994.1333333333333, "x": "それでどうだったの？"}, {"t": 995.4333333333333, "x": "帰ってきてからの報告はこうだった。"}, {"t": 997.6666666666666, "x": "北ベトナムに入ったという形跡はない。"}, {"t": 1000.0666666666667, "x": "外務大臣ものちにこう答えている。"}, {"t": 1002.2333333333333, "x": "2つの筋を通じて、北ベトナムの側に当たった。"}, {"t": 1005.4333333333333, "x": "どちらからも、入った形跡はないという答えだった。"}, {"t": 1008.7333333333333, "x": "ハノイには着いていなかったのね。"}, {"t": 1010.7166666666667, "x": "少なくとも、北ベトナムの側はそう答えた。"}, {"t": 1013.7666666666667, "x": "じゃあ、ラオスのどこかにいるってこと？"}, {"t": 1016.0333333333333, "x": "そう考えるしかなかった。"}, {"t": 1017.6833333333333, "x": "そして8月、ラオスの大使館に1つの話が入る。"}, {"t": 1021.3, "x": "ある町で、日本人を見たという男がいたんだ。"}, {"t": 1024.8, "x": "8月24日、ラオスの大使から外務省に報告が届いた。"}, {"t": 1028.8333333333333, "x": "外務大臣は、その中身を国会で読み上げている。"}, {"t": 1031.9166666666667, "x": "ビエンチャンの北110キロに、\nバンビエンという町がある。"}, {"t": 1035.1833333333334, "x": "そこで、辻議員らしい人に会ったという中国人がいる。"}, {"t": 1038.65, "x": "中国人？"}, {"t": 1039.7833333333333, "x": "中華料理店を営む男だ。"}, {"t": 1041.75, "x": "その男は、北へ70キロのポンホンという所にいた。"}, {"t": 1045.2, "x": "大使館はすぐに館員を送って、話を聞いた。"}, {"t": 1048.3333333333333, "x": "その人は、なぜバンビエンにいたの？"}, {"t": 1050.6166666666666, "x": "本人の話では、4月の上旬に\n米袋の買い付けに出かけた。"}, {"t": 1054.7666666666667, "x": "ところが戦乱で帰れなくなった。"}, {"t": 1056.8, "x": "6月7日までバンビエンにとどまっていた。"}, {"t": 1059.4666666666667, "x": "戦いに足止めされていたのね。"}, {"t": 1061.5666666666666, "x": "そうだ。大使館員は辻議員の写真を見せた。"}, {"t": 1064.4666666666667, "x": "男は本人に間違いないと言い切ったという。"}, {"t": 1067.2, "x": "写真で確かめたのね。"}, {"t": 1068.85, "x": "大使館も、会ったのはほぼ\n間違いないという印象を持った。"}, {"t": 1072.2666666666667, "x": "外務省が持っている一番新しい話が、これだった。"}, {"t": 1075.7833333333333, "x": "4月21日の先が、少しだけ見えたのね。"}, {"t": 1079.1, "x": "そうだ。男はさらにくわしいことを話している。"}, {"t": 1082.5833333333333, "x": "男の話によると、その日本人は5月の中旬に町へ来た。"}, {"t": 1086.65, "x": "男が寝泊まりしていた、同じ商売の料理店に現れた。"}, {"t": 1090.25, "x": "お金の両替と食事のためだ。"}, {"t": 1092.3666666666666, "x": "そこで知り合ったのね。"}, {"t": 1093.8333333333333, "x": "外務省の参事官はこう付け加えている。"}, {"t": 1096.3, "x": "そのとき僧侶の格好ではなかった。"}, {"t": 1098.4833333333333, "x": "黒の背広を着ていた、と。"}, {"t": 1100.3166666666666, "x": "あっ、トランクに入れていた黒い背広ね！"}, {"t": 1102.8166666666666, "x": "そうだ。僧の姿で出発し、町では背広に戻っていた。"}, {"t": 1106.65, "x": "外務大臣も、2年目の国会でこの話をしている。"}, {"t": 1110.0, "x": "黒い背広の日本人に会ったという\n料理店の主人がいる、と。"}, {"t": 1113.6833333333334, "x": "服まで話に合っているのね。"}, {"t": 1115.65, "x": "ただし、ここで気をつけたいことがある。"}, {"t": 1117.9, "x": "これは男が大使館に話した中身だ。"}, {"t": 1120.45, "x": "それを大使が外務省に報告し、大臣が国会で読んだ。"}, {"t": 1124.1666666666667, "x": "又聞きの又聞きってこと？"}, {"t": 1126.0333333333333, "x": "そうだ。だから事実とは言い切れない。"}, {"t": 1128.25, "x": "それでも写真を見て男は間違いないと言った。"}, {"t": 1131.1, "x": "5月中旬からその町にいたかもしれないのね。"}, {"t": 1134.0833333333333, "x": "では辻議員はその町で何をしていたのか。"}, {"t": 1137.3333333333333, "x": "男の話では、辻議員には会いたい人がいた。"}, {"t": 1140.3166666666666, "x": "中立派のプーマ殿下だ。"}, {"t": 1142.0833333333333, "x": "3つの勢力の真ん中の人ね。"}, {"t": 1144.3333333333333, "x": "そうだ。プーマ殿下はシェンクワンという町にいた。"}, {"t": 1147.1, "x": "外務大臣によるとプーマの政府と\nパテトラオの総司令部がある所だ。"}, {"t": 1151.3, "x": "そこに行かないと殿下には会えないのね。"}, {"t": 1153.6, "x": "そうだ。辻議員は男を連れてある場所を何度も訪ねた。"}, {"t": 1156.9666666666667, "x": "パテトラオの前線司令部だ。"}, {"t": 1158.8833333333334, "x": "自分から司令部を訪ねたの？"}, {"t": 1160.8333333333333, "x": "何回もだという。奥へ入る許可を得るためだ。"}, {"t": 1163.5833333333333, "x": "そして6月の初めにようやく\n許可の書き付けを手に入れた。"}, {"t": 1167.15, "x": "とうとう許可が出たのね。"}, {"t": 1168.7, "x": "外務省の参事官はこう話している。"}, {"t": 1171.0, "x": "やがてラオスの中心になる人に\n会いたいと考えたのはうなずける。"}, {"t": 1174.7166666666667, "x": "ただし、これは推測にすぎないとも付け加えた。"}, {"t": 1177.8166666666666, "x": "会えたのかしら？"}, {"t": 1178.9333333333334, "x": "ここで時期の悪い出来事が重なる。"}, {"t": 1181.1166666666666, "x": "ちょうどそのころプーマ殿下が\nラオスを離れていたんだ。"}, {"t": 1184.15, "x": "えっ、いなかったの？"}, {"t": 1185.5833333333333, "x": "どこへ出かけていたか見てみよう。"}, {"t": 1188.0166666666667, "x": "外務大臣の答弁によると、プーマ殿下は\n6月2日ごろシェンクワンを出た。"}, {"t": 1192.5333333333333, "x": "行き先はスイスのチューリッヒだ。"}, {"t": 1194.4333333333334, "x": "ラオスの3つの勢力の殿下が\n集まる会議に出るためだった。"}, {"t": 1198.1333333333334, "x": "3つの勢力が話し合うための会議ね。"}, {"t": 1200.7333333333333, "x": "そうだ。辻議員が許可を得たのは6月の初め。"}, {"t": 1203.7666666666667, "x": "ほぼ同じころに殿下は国を離れていた。"}, {"t": 1206.3333333333333, "x": "すれ違ってしまったのね。"}, {"t": 1208.05, "x": "外務大臣はこう推し量っている。"}, {"t": 1210.05, "x": "シェンクワンに着いても殿下が\n帰るまで待つしかなかったはずだ。"}, {"t": 1213.65, "x": "それも推測なのね？"}, {"t": 1215.2, "x": "そうだ。そのあとのことは\n推測の域を出ないと言っている。"}, {"t": 1218.55, "x": "そして6月7日に料理店の男がバンビエンを去った。"}, {"t": 1221.9, "x": "男が言うには、それまで辻議員はずっと町にいた。"}, {"t": 1225.1333333333334, "x": "男がいなくなったら見ていた人もいなくなるのね。"}, {"t": 1228.1833333333334, "x": "そうだ。記録に残る最後の目撃は6月7日まで。"}, {"t": 1231.7, "x": "羽田を出てからちょうど2か月ほどだ。"}, {"t": 1234.0333333333333, "x": "4月21日からさらに1か月半あとね。"}, {"t": 1237.05, "x": "この話が日本に届いたのは8月の後半だった。"}, {"t": 1240.35, "x": "参事官はこう言っている。"}, {"t": 1241.8666666666666, "x": "分かったときには、もう2か月半も\n前に戦いの場へ入っていた。"}, {"t": 1246.4333333333334, "x": "1961年9月12日、参議院の外務委員会。"}, {"t": 1250.4166666666667, "x": "国会が閉じている間に開かれた委員会だ。"}, {"t": 1253.1666666666667, "x": "1人の議員がこう切り出した。"}, {"t": 1254.9833333333333, "x": "今日は、辻政信氏の保護に関する国家の責務を問う。"}, {"t": 1258.5333333333333, "x": "国会で初めて取り上げられたのね。"}, {"t": 1260.8166666666666, "x": "議員はこう続けた。"}, {"t": 1262.1333333333334, "x": "心配が杞憂に終わることを願い、\n国会で取り上げるのを控えてきた。"}, {"t": 1266.1666666666667, "x": "しかし今となっては黙視するわけにいかぬ。"}, {"t": 1268.8, "x": "みんなすぐ戻ると思っていたのね。"}, {"t": 1270.95, "x": "別の議員もこう言っている。"}, {"t": 1272.5333333333333, "x": "どこかに潜入しているだけだろうと、\n調べが真剣さを欠いていた。"}, {"t": 1276.4333333333334, "x": "何か異変があったのではないかという\n気がしてならない、と。"}, {"t": 1279.8333333333333, "x": "本気で心配する声が出てきたのね。"}, {"t": 1282.2333333333333, "x": "別の議員は外務省にずばり聞いた。"}, {"t": 1284.3833333333334, "x": "辻議員は生きていると判断するのか。"}, {"t": 1286.6833333333334, "x": "完全に行方不明なのか。絶望なのか。"}, {"t": 1289.5, "x": "外務省は何て答えたの？"}, {"t": 1291.35, "x": "参事官は、生きているかどうかには答えなかった。"}, {"t": 1294.3166666666666, "x": "答えたのは、大使たちが止めた時のやりとりだ。"}, {"t": 1297.4166666666667, "x": "生きているかどうかは、誰にも言えなかったのね。"}, {"t": 1300.75, "x": "この委員会では、旅券のことも問われた。"}, {"t": 1303.2833333333333, "x": "議員はこう述べている。"}, {"t": 1304.5666666666666, "x": "国会議員が公用旅券を持って危ない\n場所へ向かうのは、異例だ。"}, {"t": 1308.45, "x": "視察の旅券で、戦いの場所に入ったからね。"}, {"t": 1311.5833333333333, "x": "そうだ。議員はさらにこう言った。"}, {"t": 1313.5333333333333, "x": "危ない所へ行かないよう助言するのも政府の務めだ。"}, {"t": 1316.8333333333333, "x": "止めきれなかった責任ってこと？"}, {"t": 1319.0, "x": "そういう問いだ。外務省の答えはこうだった。"}, {"t": 1321.6666666666667, "x": "出発前に外務省へ来た時、北へ\n入るという意思表明は無かった。"}, {"t": 1325.8666666666666, "x": "現地に着いてから、北へ入りたいと言い出した。"}, {"t": 1328.7333333333333, "x": "両方の大使が極力思いとどまるよう説得した。"}, {"t": 1331.95, "x": "外務省としては止めたって言いたいのね。"}, {"t": 1334.4, "x": "そうだ。参議院の側にも問いが向いた。"}, {"t": 1336.8333333333333, "x": "参議院としてどんな手を打ったのか。"}, {"t": 1338.9, "x": "家族から何か申し出はあったのか。"}, {"t": 1341.2, "x": "参議院は何て答えたの？"}, {"t": 1343.0166666666667, "x": "庶務課長は、外務省に何度も\n問い合わせていたと答えた。"}, {"t": 1346.4666666666667, "x": "家族からの申し出は、まだ無いということだった。"}, {"t": 1349.4666666666667, "x": "みんな、何をすればいいか迷っていたのね。"}, {"t": 1352.1, "x": "そして10月、外務省に新しい情報が届く。"}, {"t": 1355.85, "x": "1961年10月10日、参議院の外務委員会。"}, {"t": 1359.7, "x": "小坂善太郎外務大臣が新しい報告をした。"}, {"t": 1362.75, "x": "ある国際機関を通じて、情報を手に入れた。"}, {"t": 1365.5833333333333, "x": "10月3日付の、シェンクワンにいる\n最高権威筋の情報だ。"}, {"t": 1369.5166666666667, "x": "最高権威筋って誰なの？"}, {"t": 1371.4333333333334, "x": "答弁では、名前は伏せられている。"}, {"t": 1373.55, "x": "のちのアジア局長は、\nラオスの中立政権の最高首脳と言った。"}, {"t": 1377.7166666666667, "x": "それで何て言ってきたの？"}, {"t": 1379.3833333333334, "x": "中身はこうだ。"}, {"t": 1380.3833333333334, "x": "辻議員と直接会ったことはない。"}, {"t": 1382.4833333333333, "x": "辻議員は6月にバンビエンにいたが、\nその後は分からない。"}, {"t": 1385.85, "x": "ただ情報によれば、シェンクワンに来た\nあとハノイを経て中国に向かったらしい。"}, {"t": 1390.2833333333333, "x": "中国へ向かったかもしれないの？"}, {"t": 1392.3333333333333, "x": "外務大臣はすぐにこう付け加えた。"}, {"t": 1394.5666666666666, "x": "これは間接的な情報で、本当かどうか断定できない。"}, {"t": 1398.2, "x": "これも又聞きなのね。"}, {"t": 1399.7333333333333, "x": "そうだ。しかも北ベトナム側は\n入った形跡が無いと答えている。"}, {"t": 1403.6833333333334, "x": "外務大臣は、調べ方の中身は言えないとも述べた。"}, {"t": 1406.9666666666667, "x": "議員の身に危険が及ばないようにするためだ。"}, {"t": 1409.7166666666667, "x": "生きている前提で、慎重に動いていたのね。"}, {"t": 1413.0666666666666, "x": "中国へ向かったなら、中国に聞くしかない。"}, {"t": 1415.8333333333333, "x": "でも当時の日本は、中国とも国交が無かった。"}, {"t": 1419.05, "x": "じゃあ、どうやって聞いたの？"}, {"t": 1420.7166666666667, "x": "赤十字を使った。"}, {"t": 1422.1, "x": "12月2日に、日本赤十字社が\n中国紅十字会に問い合わせた。"}, {"t": 1426.4666666666667, "x": "辻議員が中国に入ったか。無事かどうか。"}, {"t": 1429.3833333333334, "x": "中国の赤十字ね。"}, {"t": 1431.0, "x": "12月25日付で返事の手紙が来た。"}, {"t": 1433.8666666666666, "x": "大臣は国会で、その返事をそのまま紹介した。"}, {"t": 1437.0833333333333, "x": "中国に入国した可能性があるという\n日本側の話は、全く根拠がない。"}, {"t": 1441.8166666666666, "x": "したがって行方の調べに協力する方法がない。"}, {"t": 1444.8166666666666, "x": "はっきり否定されたのね。"}, {"t": 1446.5333333333333, "x": "そうだ。中国へ向かったらしいという\n線は、ここで否定された。"}, {"t": 1450.25, "x": "参議院の事務局も、のちに同じ経過を報告している。"}, {"t": 1453.7, "x": "12月の照会と根拠がないという回答だ。"}, {"t": 1456.6166666666666, "x": "北ベトナムもいない、中国もいないって言うのね。"}, {"t": 1459.6166666666666, "x": "そうだ。どの国からも、いるという\n答えは返ってこなかった。"}, {"t": 1463.2333333333333, "x": "残ったのは、バンビエンの6月までの話だけだ。"}, {"t": 1466.4666666666667, "x": "年が明けたら、また何か出てくるの？"}, {"t": 1468.9333333333334, "x": "出てきた。ただし、うわさばかりだ。"}, {"t": 1471.8166666666666, "x": "1962年1月5日、香港の新聞が1本の記事を出した。"}, {"t": 1476.5333333333333, "x": "上海から香港へ来た中国人の話として、こう書いた。"}, {"t": 1480.2833333333333, "x": "辻議員は吉林省の琿春で訓練の指導をしている。"}, {"t": 1483.65, "x": "琿春ってどこなの？"}, {"t": 1485.1166666666666, "x": "中国の東北で、北朝鮮やソ連との境に近い町だ。"}, {"t": 1488.9666666666667, "x": "日本の新聞にも、\n学校の教官をしているという話が出た。"}, {"t": 1492.9, "x": "本当だったの？"}, {"t": 1494.1, "x": "外務大臣は、全く真偽が分からないと答えている。"}, {"t": 1497.4, "x": "香港の総領事館が、記事を書いた\n人にもう一度問い合わせた。"}, {"t": 1501.2166666666667, "x": "答えは、その後何も新しい情報は無い、だった。"}, {"t": 1504.5166666666667, "x": "書いた人もそれ以上は知らなかったのね。"}, {"t": 1507.05, "x": "そうだ。外務大臣は依然不明と言うしかないと述べた。"}, {"t": 1510.3166666666666, "x": "ほかにも中国の吉林にいたという\n話が国会で出ている。"}, {"t": 1513.8666666666666, "x": "ある議員が、別の議員が香港で\n聞いた話として持ち出した。"}, {"t": 1517.75, "x": "でもそれも確かめられないのよね？"}, {"t": 1519.8833333333334, "x": "そうだ。議員自身も確証は得られないと言っている。"}, {"t": 1522.8666666666666, "x": "失踪から1年近く、話はどれも人づてだった。"}, {"t": 1526.3833333333334, "x": "うわさだけがどんどん増えていったのね。"}, {"t": 1528.6, "x": "そして4月、北京からの話が国会に持ち込まれる。"}, {"t": 1532.0333333333333, "x": "これがさらに話をややこしくした。"}, {"t": 1534.8, "x": "1962年の初め、日本の議員団が中国を訪れた。"}, {"t": 1539.0333333333333, "x": "その1人が1月5日に北京で\n中国側の人に辻議員のことを尋ねた。"}, {"t": 1543.7333333333333, "x": "1月12日に返事が来た。"}, {"t": 1545.6333333333334, "x": "参議院の庶務部長が国会で報告している。"}, {"t": 1548.5833333333333, "x": "何て言われたの？"}, {"t": 1549.7666666666667, "x": "調査機関を動員したが紅十字会と\n同じ答えしかできない。"}, {"t": 1553.35, "x": "ただし日本を離れたあとに中国へ来て、\n10日前後いたのは事実だ。"}, {"t": 1557.5833333333333, "x": "えっ、中国にいたって言ったの？"}, {"t": 1559.6833333333334, "x": "そう伝えられた。しかし外務大臣は首をかしげた。"}, {"t": 1562.9, "x": "4月4日に東京を出て、その日のうちに\nサイゴンに着いている。"}, {"t": 1566.5666666666666, "x": "そのあともプノンペンと\nバンコクとラオスで日付が続く。"}, {"t": 1569.75, "x": "その間に北京へ寄ることは考えられない、とな。"}, {"t": 1572.8666666666666, "x": "日付が合わないのね。"}, {"t": 1574.3333333333333, "x": "そうだ。外務大臣はこの話は全く初耳だとも言った。"}, {"t": 1578.0666666666666, "x": "北京では別の風説も伝えられた。"}, {"t": 1580.35, "x": "共産軍の側に入ろうとして後ろから\n米軍に撃たれたという話だ。"}, {"t": 1584.5166666666667, "x": "それって本当なの？"}, {"t": 1585.9333333333334, "x": "伝えた本人も責任は持てないと言っていた。"}, {"t": 1588.6666666666667, "x": "外務大臣はこの話をアメリカ政府に確かめた。"}, {"t": 1591.9, "x": "アメリカは何て答えたの？"}, {"t": 1593.6166666666666, "x": "答えはすぐに返ってきた。"}, {"t": 1595.95, "x": "1962年4月18日、参議院の外務委員会。"}, {"t": 1599.9833333333333, "x": "小坂外務大臣が委員会の始めにこう報告した。"}, {"t": 1603.2, "x": "きのうアメリカのライシャワー大使が来た。"}, {"t": 1605.4166666666667, "x": "アメリカ政府としても十分に調べてみた。"}, {"t": 1607.9833333333333, "x": "そのようなことはごうまつもない、という返事だった。"}, {"t": 1611.0, "x": "ごうまつもないって？"}, {"t": 1612.35, "x": "ほんの少しもないという意味だ。"}, {"t": 1614.3, "x": "アメリカもきっぱり否定したのね。"}, {"t": 1616.4166666666667, "x": "そうだ。こうして1年の間にいくつもの線が消えた。"}, {"t": 1619.6333333333334, "x": "北ベトナムは入った形跡が無いと答えた。"}, {"t": 1622.35, "x": "中国の紅十字会は全く根拠が無いと答えた。"}, {"t": 1625.5166666666667, "x": "アメリカはごうまつもないと答えた。"}, {"t": 1627.6333333333334, "x": "誰も辻さんのことを知らないって言うのね。"}, {"t": 1630.1833333333334, "x": "外務省のアジア局長はこう状況をまとめている。"}, {"t": 1633.0166666666667, "x": "北ベトナムにはいないと北ベトナムが言っている。"}, {"t": 1635.7833333333333, "x": "そうなるとやはり中国ではないかと判断している、と。"}, {"t": 1639.0833333333333, "x": "でも中国は来ていないって言ったのよね？"}, {"t": 1641.5333333333333, "x": "そうだ。答えが互いにかみ合わなかった。"}, {"t": 1644.0, "x": "このすぐあと参議院がついに正式に話し合う。"}, {"t": 1646.9, "x": "議員の席をどうするかってことね。"}, {"t": 1649.5666666666666, "x": "1962年5月4日、参議院の議院運営委員会。"}, {"t": 1653.5333333333333, "x": "委員長がこう告げた。"}, {"t": 1654.85, "x": "議員辻政信君に関する件を議題とする。"}, {"t": 1657.8, "x": "議員1人のことが正式な議題になったのね。"}, {"t": 1660.75, "x": "事務総長が1年分の経過を報告した。"}, {"t": 1663.45, "x": "旅券の申請からビエンチャンの寺、\nバンビエンの話まで。"}, {"t": 1666.8833333333334, "x": "そのうえで2つの問題をあげた。"}, {"t": 1669.0, "x": "2つ？"}, {"t": 1670.1333333333334, "x": "1つ目はこれからどう調べるか。"}, {"t": 1672.1, "x": "外務省に強く頼む。民間の団体や商社にも話を聞く。"}, {"t": 1676.0666666666666, "x": "参議院から現地へ捜査団を送る考え方もある。"}, {"t": 1679.2166666666667, "x": "現地まで探しに行く案も出たのね。"}, {"t": 1681.5166666666667, "x": "2つ目は議員の身分をどうするかだ。"}, {"t": 1683.6666666666667, "x": "国会に出られない議員をそのままにしてよいのか。"}, {"t": 1686.5833333333333, "x": "席はずっと空いたままだものね。"}, {"t": 1688.5833333333333, "x": "事務総長は法律を1つずつ見ていった。"}, {"t": 1691.15, "x": "最初は国会法の第124条だ。"}, {"t": 1693.8, "x": "どういう決まりなの？"}, {"t": 1695.1166666666666, "x": "休みの期限が過ぎて呼び出しても\n出てこない議員を懲罰にかける決まりだ。"}, {"t": 1699.3666666666666, "x": "でも事務総長はこの決まりを当てはめなかった。"}, {"t": 1702.6833333333334, "x": "事務総長はこう述べている。"}, {"t": 1704.3166666666666, "x": "呼び出しの紙を受け取れないことが\n明らかなのに、懲罰にかけるのは形式的すぎる。"}, {"t": 1709.45, "x": "受け取れない人を罰するのは変よね。"}, {"t": 1711.8, "x": "そうだ。さらにこう続けた。"}, {"t": 1713.6333333333334, "x": "もし帰りたいのに自由を\n奪われていたと後で分かったら。"}, {"t": 1716.7666666666667, "x": "あるいは身に不幸があったと後で分かったら。"}, {"t": 1719.1666666666667, "x": "参議院としてとても後味の悪いものを残す。"}, {"t": 1722.0833333333333, "x": "罰したあとで本当は捕まっていたと\n分かったら困るのね。"}, {"t": 1725.55, "x": "では特別な法律を作って議席を外せるか。"}, {"t": 1728.4666666666667, "x": "これも憲法の上で疑いがあるとした。"}, {"t": 1730.7833333333333, "x": "任期の途中の議員の身分を\n憲法に無いやり方で奪うことになるからだ。"}, {"t": 1735.05, "x": "簡単には席を外せないのね。"}, {"t": 1737.15, "x": "最後に民法の第30条にも触れた。"}, {"t": 1739.6, "x": "生きているか分からない状態が\n7年続けば失踪の宣告ができる。"}, {"t": 1743.75, "x": "失踪の宣告？"}, {"t": 1745.0833333333333, "x": "家庭裁判所が法律の上で\n亡くなったものとみなす手続きだ。"}, {"t": 1748.8, "x": "事務総長はそれはしばらく時間が\nたってからの問題だと言った。"}, {"t": 1752.4833333333333, "x": "そして報告をこう結んでいる。"}, {"t": 1754.3666666666666, "x": "一日も早く元気に帰国されることを心から祈っている。"}, {"t": 1758.0666666666666, "x": "参議院は帰りを待つと決めたのね。"}, {"t": 1760.8166666666666, "x": "議院運営委員会では外務大臣も答えている。"}, {"t": 1763.55, "x": "国交の無い国に入ろうとして出かけられたことだ。"}, {"t": 1766.5333333333333, "x": "何とかしてつかみたいと非常に努力している。"}, {"t": 1769.3833333333334, "x": "責任者は誰だったの？"}, {"t": 1771.0666666666666, "x": "議員がそう聞くと大臣はアジア局長だと答えた。"}, {"t": 1774.0833333333333, "x": "委員の1人は、議長から外務省に\n強く申し入れてほしいと求めた。"}, {"t": 1778.2, "x": "あらゆる機関を動かして調べを続けてほしい、とな。"}, {"t": 1781.4333333333334, "x": "それで何か分かったの？"}, {"t": 1783.05, "x": "1年後の1963年3月、参議院の内閣委員会。"}, {"t": 1787.3666666666666, "x": "ある議員がぽつりと聞いた。"}, {"t": 1788.9166666666667, "x": "辻議員の消息は全く無いが、\n新しいニュースはもう無いのか。"}, {"t": 1792.8166666666666, "x": "外務省は何て答えたの？"}, {"t": 1794.65, "x": "外務省の参事官の答えはこうだ。"}, {"t": 1796.8666666666666, "x": "いろいろな情報があるが、きめ手になる情報はない。"}, {"t": 1799.7666666666667, "x": "各種の情報を裏づける確かな証拠がつかめない。"}, {"t": 1802.9333333333334, "x": "うわさはあっても証拠が無いのね。"}, {"t": 1804.9166666666667, "x": "そうだ。2年たっても6月のバンビエンより\n先は分からなかった。"}, {"t": 1808.7666666666667, "x": "そして3年目、話は家族の暮らしにまで及ぶ。"}, {"t": 1812.0666666666666, "x": "家族の暮らし？"}, {"t": 1813.25, "x": "税金の話だ。"}, {"t": 1815.1333333333334, "x": "1964年3月24日、参議院の大蔵委員会。"}, {"t": 1819.2666666666667, "x": "1人の議員がこう質問した。"}, {"t": 1821.2, "x": "辻さんは3年以上も生死が分からない。"}, {"t": 1823.6333333333334, "x": "それなら辻さんの奥さんを寡婦と決めてしまうのか。"}, {"t": 1826.7, "x": "寡婦って夫を亡くした女の人のことよね？"}, {"t": 1829.55, "x": "そうだ。税金には寡婦控除という\n軽くする仕組みがある。"}, {"t": 1832.8666666666666, "x": "大蔵省の局長はこう答えた。"}, {"t": 1834.9333333333334, "x": "夫が出かけたまま3年以上帰らない\n例は全国にときどきある。"}, {"t": 1838.7666666666667, "x": "税務署に申告すれば寡婦控除はできる。"}, {"t": 1841 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.ontimeupdate=()=>paint(a.currentTime);

document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};

  if(k===' '){e.preventDefault();pp.onclick()}
