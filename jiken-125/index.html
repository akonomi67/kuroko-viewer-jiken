<script>
const D={"name": "125", "file": "125_編集用", "dur": 2069.85, "segs": [], "subs": [{"t": 0.0, "x": "火のついた新聞紙と、バケツが1つ。"}, {"t": 2.533333333333333, "x": "1980年8月19日の夜、\n新宿駅西口のバスに投げ込まれた物だ。"}, {"t": 8.083333333333334, "x": "時刻は午後9時8分ごろ。"}, {"t": 9.866666666666667, "x": "バスは発車を待っていて、乗客は約30人いた。"}, {"t": 13.266666666666667, "x": "発車の前なのね？"}, {"t": 14.633333333333333, "x": "そうだ。"}, {"t": 15.266666666666667, "x": "まだ走り出していないバスだった。"}, {"t": 17.25, "x": "この夜のことで、のちに6人が亡くなった。"}, {"t": 20.15, "x": "……6人も。"}, {"t": 21.066666666666666, "x": "この回では、車内で何が起きたかは描かない。"}, {"t": 23.916666666666668, "x": "代わりに一つの日付を先に置いておく。"}, {"t": 26.35, "x": "1981年1月1日だ。"}, {"t": 29.183333333333334, "x": "事件の次の年のお正月？"}, {"t": 31.2, "x": "その日から動き出すことになっていた法律がある。"}, {"t": 34.1, "x": "犯罪で亡くなった人の遺族や重い\n障害が残った人に、国がお金を出す。"}, {"t": 38.81666666666667, "x": "そういう法律だ。"}, {"t": 39.95, "x": "この法律は、事件の4か月前に国会を通っていた。"}, {"t": 43.61666666666667, "x": "じゃあ、間に合ったんじゃないの。"}, {"t": 45.4, "x": "ところが対象になるのは、\n1981年1月1日より後の犯罪だけだった。"}, {"t": 50.96666666666667, "x": "8月19日の夜は、その4か月半手前にあった。"}, {"t": 54.666666666666664, "x": "法律はあるのに使えない、ってこと？"}, {"t": 56.96666666666667, "x": "そういうことだ。"}, {"t": 57.96666666666667, "x": "国会の記録では「谷間」という言葉まで出てくる。"}, {"t": 61.21666666666667, "x": "今回はその谷間に、どの仕組みが\n届いたのかを国会の記録で追う。"}, {"t": 65.28333333333333, "x": "届かなかった仕組みも一緒に見る。"}, {"t": 67.36666666666666, "x": "自動車の保険。"}, {"t": 68.45, "x": "働く人の労災。"}, {"t": 69.85, "x": "閣議で決めた見舞いのお金。"}, {"t": 71.61666666666666, "x": "それから、法務大臣が言い出した\n刑法の話と、裁判の結果まで行く。"}, {"t": 76.3, "x": "ずいぶん色んな窓口が出てくるのね。"}, {"t": 78.65, "x": "一つの夜に、これだけの窓口が呼ばれたんだ。"}, {"t": 82.23333333333333, "x": "まず事件の夜を、国会で\n答えられた言葉どおりに並べる。"}, {"t": 85.76666666666667, "x": "答えたのは警察庁の捜査第一課長だ。"}, {"t": 88.5, "x": "日付は事件から8日後の8月27日。"}, {"t": 91.5, "x": "「十九日の午後九時八分ごろ\n新宿区の西新宿の京王デパート前のバス停で\nそういう事案が起きた」"}, {"t": 97.51666666666667, "x": "京王デパートの前って、駅のすぐそばよね。"}, {"t": 100.35, "x": "別の日の国会では、\n国鉄新宿駅西口のバスターミナルと言われている。"}, {"t": 105.0, "x": "止まっていたのは京王帝都バスの車両だった。"}, {"t": 107.68333333333334, "x": "ある議員の説明では、そのバスは発車待ちをしていた。"}, {"t": 110.93333333333334, "x": "そこへ中年の男が、物を続けざまに投げ込んだ。"}, {"t": 114.21666666666667, "x": "火のついた新聞紙と、ガソリンのような\n液体の入ったバケツだ。"}, {"t": 118.15, "x": "バケツごと？"}, {"t": 119.15, "x": "取り調べの答弁では、まず新聞紙を投げ込んだ。"}, {"t": 122.16666666666667, "x": "そのあとバケツのガソリンを流し込んだとされている。"}, {"t": 125.05, "x": "課長の答弁は短い。"}, {"t": 126.6, "x": "「そのバス一台を全焼させた」"}, {"t": 128.58333333333334, "x": "そして「その直後にこの火災の\nその場所で乗客三名が死亡」"}, {"t": 132.51666666666668, "x": "運転手を含めて20人が、重い\nけがや軽いけがを負った。"}, {"t": 136.21666666666667, "x": "運転手さんもなのね。"}, {"t": 137.78333333333333, "x": "そうだ。"}, {"t": 138.41666666666666, "x": "乗っていた人も、運転していた人も巻き込まれた。"}, {"t": 141.58333333333334, "x": "ここで場所の話を一つだけしておく。"}, {"t": 143.98333333333332, "x": "あとで読む労働省の答弁では、被害に\n遭った方のうち11人が働いている人だった。"}, {"t": 149.26666666666668, "x": "会社からの帰り道だった人もいた。"}, {"t": 151.71666666666667, "x": "家に帰る途中だったのね。"}, {"t": 153.53333333333333, "x": "この「帰り道」という言葉が、\nのちに大きな意味を持つ。"}, {"t": 157.21666666666667, "x": "帰り道が？"}, {"t": 158.26666666666668, "x": "働く人の労災が出るかどうかを分ける言葉になるんだ。"}, {"t": 161.61666666666667, "x": "その話はもう少し先でする。"}, {"t": 164.31666666666666, "x": "亡くなった方の数は、事件の夜で\n決まったわけではない。"}, {"t": 167.76666666666668, "x": "8月27日の答弁で、課長はこう続けている。"}, {"t": 171.21666666666667, "x": "「八月二十三日に至りまして、"}, {"t": 173.28333333333333, "x": "病院へ収容されておりました女性の方一名が\n死亡されるということになりました」"}, {"t": 178.05, "x": "この時点で、亡くなった方は4人と答えられている。"}, {"t": 181.33333333333334, "x": "事件から4日後に、お一人亡くなったのね。"}, {"t": 184.23333333333332, "x": "そうだ。"}, {"t": 184.83333333333334, "x": "病院で治療を受けていた方だった。"}, {"t": 186.98333333333332, "x": "10月30日の参議院の法務委員会では、\n内閣官房の参事官がこう言っている。"}, {"t": 192.16666666666666, "x": "「不幸にして最近また二人亡くなられた」"}, {"t": 194.81666666666666, "x": "それで6人……。"}, {"t": 195.9, "x": "同じ日に、ある議員は\n「六人の犠牲になられた方」と言っている。"}, {"t": 199.98333333333332, "x": "参事官は、もう一つこう述べている。"}, {"t": 202.31666666666666, "x": "「被害者の方の病状が実は\nこのところ刻々変わっております」"}, {"t": 206.23333333333332, "x": "事件から2か月たっても、まだ治療が続いていたのね。"}, {"t": 209.73333333333332, "x": "続いていた。"}, {"t": 210.63333333333333, "x": "だから、何人に何を出すかを\n決める作業も止まっていた。"}, {"t": 214.08333333333334, "x": "被害に遭った方の総数も残っている。"}, {"t": 216.48333333333332, "x": "11月6日の参議院の社会労働委員会で、\n労働省の審議官が「被災者の方二十三名」と答えた。"}, {"t": 223.46666666666667, "x": "23人。"}, {"t": 224.51666666666668, "x": "そのうち働いている人は11人だったという。"}, {"t": 227.35, "x": "この11人の話は労災の章でする。"}, {"t": 229.9, "x": "この回で、亡くなった方や被害に\n遭った方の名前は出さない。"}, {"t": 233.6, "x": "国会の記録には名前が出てくる場面もある。"}, {"t": 236.3, "x": "それでも使わない。"}, {"t": 237.63333333333333, "x": "それは決めてあるのね。"}, {"t": 239.11666666666667, "x": "決めてある。"}, {"t": 239.9, "x": "この回が追うのは、\nその方たちの周りにあった仕組みのほうだ。"}, {"t": 244.16666666666666, "x": "投げ込んだ男はどうなったの？"}, {"t": 246.08333333333334, "x": "その場でつかまっている。"}, {"t": 247.51666666666668, "x": "課長の答弁では「市民の御協力に\nよりまして現行犯逮捕いたしました」"}, {"t": 252.18333333333334, "x": "近くにいた人たちが取り押さえたのね。"}, {"t": 254.63333333333333, "x": "答弁はそこまでしか言っていない。"}, {"t": 256.53333333333336, "x": "誰がどう押さえたかの細かい話はここではしない。"}, {"t": 259.43333333333334, "x": "取り調べの様子も、8月27日に答えられている。"}, {"t": 263.03333333333336, "x": "「当初犯行を否認しておりました」"}, {"t": 265.15, "x": "そのあと、少し態度が変わったという。"}, {"t": 267.55, "x": "「被害者に申しわけない、どうしても\n謝りたい」と言うようになった。"}, {"t": 271.3666666666667, "x": "新聞紙とガソリンのことも、\n間違いないと認めたとされている。"}, {"t": 275.25, "x": "理由は話したの？"}, {"t": 276.6166666666667, "x": "そこが答弁ではっきりしている。"}, {"t": 278.51666666666665, "x": "「犯行に至る動機、契機という\nふうなものにつきましては\n具体的な供述はしておらない」"}, {"t": 283.73333333333335, "x": "分からないままなのね。"}, {"t": 285.2, "x": "この回では、動機を推し量る話はしない。"}, {"t": 287.9, "x": "報道でいろいろ書かれたが、\n判決の文で確かめられていないからだ。"}, {"t": 291.9, "x": "ただ、準備の動きについては課長が触れている。"}, {"t": 294.76666666666665, "x": "数日前からガソリンを入れる容器を買っていた。"}, {"t": 297.5, "x": "持ち運ぶためのバケツを、\nよその人のところから盗っていた。"}, {"t": 301.0833333333333, "x": "課長はそれを「準備的な行為」と\n呼び、あったことは事実だと述べた。"}, {"t": 305.51666666666665, "x": "じゃあ前から決めていたってこと？"}, {"t": 307.48333333333335, "x": "そこは課長自身が言い切っていない。"}, {"t": 309.53333333333336, "x": "このバスを狙う気持ちがあったかどうかは「まだ\nいまのところはっきりしておらない」と答えている。"}, {"t": 314.8666666666667, "x": "準備はあったけど、何を狙ったかはまだ分からない。"}, {"t": 317.98333333333335, "x": "そうだ。"}, {"t": 318.6166666666667, "x": "8日目の答弁は、そこで止まっている。"}, {"t": 321.6666666666667, "x": "8月27日の衆議院の法務委員会に戻ろう。"}, {"t": 324.96666666666664, "x": "この日、ある議員が真っ先に\n聞いたのは被害の数だった。"}, {"t": 328.3333333333333, "x": "次に聞いたのが、お金の話だ。"}, {"t": 330.73333333333335, "x": "お金？"}, {"t": 331.46666666666664, "x": "けがの治療費、亡くなった方の遺族への補償。"}, {"t": 334.3666666666667, "x": "それを誰が払うのか。"}, {"t": 335.78333333333336, "x": "議員の説明では、バスを\n走らせていたのは京王帝都電鉄だ。"}, {"t": 339.68333333333334, "x": "その会社が、けが人の治療費を\nひとまず全額立て替えると決めていた。"}, {"t": 344.03333333333336, "x": "会社が立て替えてくれたのね。"}, {"t": 345.95, "x": "立て替えだ。"}, {"t": 346.78333333333336, "x": "ただ議員は、その先を心配していた。"}, {"t": 349.23333333333335, "x": "会社には事件そのものの\n過失はなかったと見られていたからだ。"}, {"t": 352.85, "x": "課長もバス会社側について、こう答えている。"}, {"t": 355.6666666666667, "x": "「特別に責任を追及すべきような\n事項というものはまだ発見されておらない」"}, {"t": 360.26666666666665, "x": "会社のせいじゃないなら、\n会社は払わなくていいってこと？"}, {"t": 363.6666666666667, "x": "そういう理屈になりやすい。"}, {"t": 365.21666666666664, "x": "では投げ込んだ男に払わせるか。"}, {"t": 367.31666666666666, "x": "のちに内閣官房の参事官は、男には\n払える力が無かったと述べている。"}, {"t": 372.0, "x": "答弁の言葉では「加害者に経済的な\n能力もなくて救済措置がとれない」"}, {"t": 376.8, "x": "払う人がどこにもいないじゃない。"}, {"t": 378.8, "x": "議員もそう言った。"}, {"t": 379.95, "x": "今のままでは「何の補償も弁済もない」と。"}, {"t": 382.8333333333333, "x": "そこで議員が持ち出したのが、あの法律だった。"}, {"t": 385.75, "x": "犯罪の被害者に国が給付金を出す法律だ。"}, {"t": 388.75, "x": "議員はこう言っている。"}, {"t": 389.98333333333335, "x": "「来年の一月一日からの事案でなければ\n適用できない」"}, {"t": 393.5, "x": "「もしいまこの法律が適用されているとするならば、\nこの問題はまさにぴったりの事案であろう」"}, {"t": 398.81666666666666, "x": "ぴったりなのに、使えないのね。"}, {"t": 400.9, "x": "議員は、日付をさかのぼって\n使えないかと法務大臣に聞いた。"}, {"t": 405.3, "x": "その法律って、いつできたの？"}, {"t": 407.45, "x": "1980年4月23日。"}, {"t": 410.06666666666666, "x": "参議院の本会議で可決されて成立した。"}, {"t": 412.8, "x": "この日の委員長の報告に、\n施行の日がはっきり書いてある。"}, {"t": 416.31666666666666, "x": "「施行期日は昭和五十六年一月一日とし、\n同日以後の犯罪行為による被害について適用すること」"}, {"t": 422.93333333333334, "x": "昭和56年は1981年ね。"}, {"t": 425.96666666666664, "x": "そうだ。"}, {"t": 426.5833333333333, "x": "しかも「同日以後の犯罪行為」と決めてある。"}, {"t": 429.55, "x": "つまり1980年に起きた犯罪は、\nどれだけ重くても対象にならない。"}, {"t": 434.4166666666667, "x": "成立から施行まで、8か月もあるの？"}, {"t": 437.1333333333333, "x": "法律が公布されたのは5月1日だ。"}, {"t": 439.6166666666667, "x": "そこから数えても8か月ある。"}, {"t": 441.6166666666667, "x": "8月19日は、その8か月の\nちょうど真ん中あたりにあった。"}, {"t": 445.6166666666667, "x": "どうしてそんなに空けたの？"}, {"t": 447.31666666666666, "x": "それは次の章で、警察庁の答弁から見る。"}, {"t": 450.2, "x": "ここでは委員長の報告の続きを読んでおく。"}, {"t": 452.8, "x": "「施行期日の繰り上げ及び遡及適用等の問題に\n関しては理事会等において熱心な検討が重ねられた」"}, {"t": 459.23333333333335, "x": "施行を早めるとか、さかのぼるとかの話は、\nもう4月に出ていたのね。"}, {"t": 463.7, "x": "出ていた。"}, {"t": 464.43333333333334, "x": "そのうえで原案のまま「全会一致」で可決された。"}, {"t": 467.8, "x": "そして附帯決議が付いた。"}, {"t": 469.56666666666666, "x": "六つあるうちの五つ目がこうだ。"}, {"t": 471.46666666666664, "x": "「本法施行前に犯罪被害を受けた\n者及びその遺族に対しては、別途、奨学金制度、"}, {"t": 476.9166666666667, "x": "重障害者見舞金などの救済措置について、\n実現に努めること」"}, {"t": 481.45, "x": "施行前の人のことも、ちゃんと考えてはいたのね。"}, {"t": 484.7, "x": "文の上では考えていた。"}, {"t": 486.31666666666666, "x": "だが「努めること」で止まっている。"}, {"t": 488.6333333333333, "x": "中身は決まっていなかった。"}, {"t": 490.3333333333333, "x": "その4か月後に、新宿の夜が来た。"}, {"t": 493.56666666666666, "x": "なぜ施行を1月1日にしたのか。"}, {"t": 495.8666666666667, "x": "10月23日の参議院の地方行政委員会で、\n警察庁の官房長が理由を答えている。"}, {"t": 501.55, "x": "「新しい制度であるということと、"}, {"t": 503.3, "x": "準備に相当の期間がかかるという、\nこういった理由のために、\n来年の一月一日からこの法律を適用する」"}, {"t": 510.1, "x": "準備って、何の準備？"}, {"t": 511.8333333333333, "x": "この法律では、お金を出すかどうかを\n都道府県の公安委員会が決める。"}, {"t": 516.1, "x": "申し込みの受け方や調べ方を、\n全国で整える必要があった。"}, {"t": 520.3166666666667, "x": "それで半年以上かかるってことね。"}, {"t": 522.6, "x": "同じ委員会で、ある議員は\n4月の議論をこう振り返っている。"}, {"t": 526.1166666666667, "x": "「長くさかのぼれというものについては、\n不遡及の原則になじまない」"}, {"t": 530.2166666666667, "x": "さかのぼるのは無理、と言われたのね。"}, {"t": 532.4666666666667, "x": "「せめて法律施行をすぐやれと言うたら、予算の問題」"}, {"t": 535.7333333333333, "x": "そして最後は「準備ということで」\n押し切られた、と議員は言う。"}, {"t": 539.6666666666666, "x": "理由が一つずつ出てきて、一つずつ断られた感じね。"}, {"t": 543.4, "x": "議員の側から見ればそうなる。"}, {"t": 545.15, "x": "政府の側から見れば、新しい制度を\n慌てて始めないための線だった。"}, {"t": 549.35, "x": "どちらが正しかったかは、ここでは決めない。"}, {"t": 551.9666666666667, "x": "ただ、その線の手前に8月19日があった\n事実だけを置いておく。"}, {"t": 556.1333333333333, "x": "この議員は、もう一つ短い言い方をしている。"}, {"t": 558.95, "x": "「何かいい法律はないかといったら、いい\n法律はあったがそれは適用の期日が半年先だ」"}, {"t": 564.3833333333333, "x": "いい法律はあった、か。"}, {"t": 566.0, "x": "あった。"}, {"t": 566.5833333333334, "x": "だが、まだ動いていなかった。"}, {"t": 569.0833333333334, "x": "じゃあ、6人の遺族には何も出なかったの？"}, {"t": 571.9, "x": "そこで政府が別の道を作った。"}, {"t": 574.0333333333333, "x": "1980年9月19日の閣議決定だ。"}, {"t": 577.3666666666667, "x": "経緯は、内閣官房の参事官が\n10月23日に説明している。"}, {"t": 581.7666666666667, "x": "「八月十九日に新宿の事件が起きまして、それ"}, {"t": 584.9, "x": "以降関係省庁でそれらの救済措置について\nそれぞれ検討しておった」"}, {"t": 588.9833333333333, "x": "だが調べてみると「若干の労災保険に\nよる補償などがある程度で、なかなか\n十分な救済がないようである」"}, {"t": 595.45, "x": "労災が出る人は一部だけだったのね。"}, {"t": 597.95, "x": "そうだ。"}, {"t": 598.5666666666667, "x": "そして「九月中旬の閣議におきましても\nそのことが話題に」なった。"}, {"t": 602.9166666666666, "x": "ある議員の話では、9月16日の閣議で\n奥野誠亮 法務大臣が発言したという。"}, {"t": 608.7166666666667, "x": "8月27日の委員会で、\n救済しなきゃって答えた大臣ね。"}, {"t": 613.05, "x": "その大臣だ。"}, {"t": 614.1, "x": "あの日の答弁はこうだった。"}, {"t": 615.7666666666667, "x": "「何らかの形において死傷者を\n救済しなければならない、全く同感でございます」"}, {"t": 620.7333333333333, "x": "そこから3週間あまりで、\n閣議決定まで進んだことになる。"}, {"t": 624.6833333333333, "x": "法律を変えたの？"}, {"t": 625.9666666666667, "x": "変えていない。"}, {"t": 626.8, "x": "法律ではなく、行政の措置として\n見舞いのお金を出すことにした。"}, {"t": 630.7333333333333, "x": "官房長の言葉では「見舞い金、\n弔慰金的な性格のもの」だ。"}, {"t": 634.9333333333333, "x": "参事官は、この措置の考え方をこう説明している。"}, {"t": 638.3166666666667, "x": "法律はもう国会で決まり、5月1日に公布されている。"}, {"t": 641.8833333333333, "x": "でも1月1日までは動かない。"}, {"t": 644.0, "x": "その「特別な事態」を考えて、\n経過的な措置を講じる、と。"}, {"t": 648.3666666666667, "x": "法律の代わりに、法律の手前で受け止めたのね。"}, {"t": 651.5666666666667, "x": "そういう形だ。"}, {"t": 652.6833333333333, "x": "対象は「五月一日以降発生した事件」とされた。"}, {"t": 656.2833333333333, "x": "公布の日までさかのぼったのね。"}, {"t": 658.3166666666667, "x": "4月の国会でさかのぼるのは無理と言われた\n線を、別の形でまたいだことになる。"}, {"t": 663.8, "x": "いくら出ることになったの？"}, {"t": 665.45, "x": "閣議決定の本文には、この回では当たれていない。"}, {"t": 668.5333333333333, "x": "だから国会で議員が説明した数字として紹介する。"}, {"t": 671.8833333333333, "x": "10月15日の衆議院の法務委員会で、ある議員が\nこう述べた。"}, {"t": 675.75, "x": "「特別支給金として死亡者に\n二百万円、障害者に百万円以内」"}, {"t": 680.15, "x": "「しかも五月一日にさかのぼって支給をする」"}, {"t": 683.05, "x": "亡くなった方に200万円、障害が\n残った方に100万円以内ね。"}, {"t": 687.4166666666666, "x": "そうだ。"}, {"t": 688.0166666666667, "x": "ただし対象は絞られていた。"}, {"t": 689.8333333333334, "x": "参事官によれば「非常に端的に\n判断できるような通り魔事件に限り」とされた。"}, {"t": 694.9333333333333, "x": "障害のほうも、重い障害が残ることが\n明らかな場合に限るという。"}, {"t": 699.1333333333333, "x": "けがをした人なら誰でもではないのね。"}, {"t": 701.55, "x": "法律と同じくらい厳しく見る、と参事官は言っている。"}, {"t": 704.9, "x": "お金を出す事務は、総理府が担当することになった。"}, {"t": 708.1, "x": "どの事件が当てはまるかは、\n警察庁に頼んで洗い出していた。"}, {"t": 711.9833333333333, "x": "それで、いつ届いたの？"}, {"t": 713.6666666666666, "x": "10月30日の時点では、まだ届いていなかった。"}, {"t": 716.9666666666667, "x": "参事官は「もう一カ月を過ぎてきた」と\n自分で認めている。"}, {"t": 720.7666666666667, "x": "そのうえで「十一月のできる限り早い時期に\n支給決定ができるように」と答えた。"}, {"t": 725.9666666666667, "x": "閣議で決めてからも、時間がかかったのね。"}, {"t": 728.8333333333334, "x": "病状が変わり続けていたことも、\n理由の一つに挙げられていた。"}, {"t": 732.6666666666666, "x": "同じ日、ある議員はこう求めている。"}, {"t": 734.8833333333333, "x": "「もう十一月初旬くらいには\n払っていただいたらどうでしょう」"}, {"t": 738.2833333333333, "x": "急いでほしいって言ったのね。"}, {"t": 740.0833333333334, "x": "参事官も「弔意をあらわすのにそう\n遅くなるのもよくない」と答えている。"}, {"t": 744.3333333333334, "x": "実際にいつ支払われたかは、この回で\n集めた記録では確かめられなかった。"}, {"t": 748.8833333333333, "x": "だから、そこは言わないでおく。"}, {"t": 751.3666666666667, "x": "ねえ、バスって自動車でしょ。"}, {"t": 753.1166666666667, "x": "自動車の保険は使えなかったの？"}, {"t": 755.35, "x": "同じことを聞いた議員がいる。"}, {"t": 757.0333333333333, "x": "11月26日の衆議院の交通安全対策特別委員会だ。"}, {"t": 761.4, "x": "自動車には、自賠責という強制の保険がある。"}, {"t": 764.3833333333333, "x": "答えたのは運輸省の審議官だった。"}, {"t": 766.6833333333333, "x": "まず、請求そのものがまだ出ていないと答えている。"}, {"t": 769.7333333333333, "x": "被害者からも、京王帝都電鉄からも、\n保険会社への請求は「なされていない」"}, {"t": 774.8833333333333, "x": "請求が無いなら、払いようもないわね。"}, {"t": 777.3833333333333, "x": "そのうえで審議官は、仮に\n請求されても難しいと述べた。"}, {"t": 781.0666666666667, "x": "自賠責が払われるのは、\n自動車の「運行によって」人を傷つけたときだ。"}, {"t": 785.9, "x": "答弁はこう続く。"}, {"t": 787.1666666666666, "x": "「本件は御承知のように"}, {"t": 787.95, "x": "第三者がガソリンをまいて火をつけた、\nこういう第三者の犯罪行為から起こったもの」"}, {"t": 793.3333333333334, "x": "「自動車の運行によって生じたのだという\nふうに解釈することはきわめて困難」"}, {"t": 797.9166666666666, "x": "止まっていたバスだから、ってこと？"}, {"t": 800.05, "x": "止まっていたことより、第三者の犯罪が\n原因だという点が大きい。"}, {"t": 803.95, "x": "この法律には、会社が責任を\n負わなくてよい条件が三つ書いてある。"}, {"t": 808.1, "x": "運転に注意を怠らなかったこと。"}, {"t": 810.25, "x": "第三者にわざとや落ち度があったこと。"}, {"t": 812.5, "x": "車に欠陥が無かったこと。"}, {"t": 814.4, "x": "審議官は、この三つは「いずれも立証するのに\nたやすいのではないか」と言った。"}, {"t": 819.25, "x": "会社の責任にはならない、だから保険も出ないのね。"}, {"t": 822.6, "x": "結論は「法制上困難」だった。"}, {"t": 825.0333333333333, "x": "同じ日、警察庁の交通局長にも質問が飛んでいる。"}, {"t": 828.65, "x": "この事件は、交通事故の数に入っているのかと。"}, {"t": 831.7166666666667, "x": "答えは「交通事故として統計いたしておりません」"}, {"t": 834.8166666666667, "x": "バスで起きたのに、交通事故の数にも入らないのね。"}, {"t": 838.15, "x": "自動車の運行によって生じた\n事故ではない、と判断されたからだ。"}, {"t": 842.6833333333333, "x": "次は労災だ。"}, {"t": 843.7666666666667, "x": "働く人が仕事中や通勤中に\nけがをしたときの保険だな。"}, {"t": 847.6333333333333, "x": "11月6日の答弁を、もう一度ていねいに読む。"}, {"t": 850.7333333333333, "x": "「被災者の方二十三名の中で、\n労働者の方が十一名おられる」"}, {"t": 854.9166666666666, "x": "「死亡五名、その他負傷が六名」"}, {"t": 857.2333333333333, "x": "亡くなった6人のうち、5人は働いていた方なのね。"}, {"t": 860.7833333333333, "x": "そうなる。"}, {"t": 861.4833333333333, "x": "11人のうち、5人の本人か遺族から請求が出ていた。"}, {"t": 865.1666666666666, "x": "そのうち3件には、すでに給付が行われていた。"}, {"t": 868.4333333333333, "x": "残りは？"}, {"t": 869.2666666666667, "x": "審議官はこう言っている。"}, {"t": 870.7333333333333, "x": "「退社後におきます\n御本人の行動につきまして」調べている、と。"}, {"t": 874.8333333333334, "x": "会社を出たあと何をしていたか、ってこと？"}, {"t": 877.45, "x": "そうだ。"}, {"t": 878.0666666666667, "x": "労災の通勤災害は、家と職場を\n行き来する途中のけがが対象になる。"}, {"t": 882.55, "x": "途中で寄り道をしていると、そこで\n通勤が切れたと見られることがある。"}, {"t": 886.7333333333333, "x": "夜9時のバスだと、寄り道した人も多そうね。"}, {"t": 889.8666666666667, "x": "同じ委員会で、ある議員がその心配を口にしている。"}, {"t": 893.0833333333334, "x": "給付金の法律は来年からで、\n労災も通勤災害もだめなら、と。"}, {"t": 897.4666666666667, "x": "「その谷間におっこって」\n閣議決定の一時金だけで終わってしまう、と言った。"}, {"t": 902.1666666666666, "x": "谷間って、ここで出てきたのね。"}, {"t": 904.35, "x": "そうだ。"}, {"t": 904.95, "x": "冒頭で言った言葉は、この発言から取っている。"}, {"t": 907.9333333333333, "x": "法律の施行日の手前と、通勤の線の外側。"}, {"t": 911.1, "x": "その両方に挟まれた人がいた。"}, {"t": 913.3166666666667, "x": "じゃあ、寄り道をしていた人は労災も出なかったの？"}, {"t": 916.4833333333333, "x": "それが、数年後の国会で答えが出てくる。"}, {"t": 919.8833333333333, "x": "1986年4月15日の衆議院の社会労働委員会。"}, {"t": 924.1333333333333, "x": "事件から6年近くたっている。"}, {"t": 926.2, "x": "ある議員が、新宿の事件の2人について\n労働省が通勤災害と認めたことを取り上げた。"}, {"t": 931.8, "x": "認められたのね。"}, {"t": 933.0833333333334, "x": "議員はその中身を細かく読み上げている。"}, {"t": 935.4833333333333, "x": "名前はここでは伏せる。"}, {"t": 936.9, "x": "1人目の女性は、夕方6時3分に会社を出ていた。"}, {"t": 940.4, "x": "新宿で家族と待ち合わせて靴を\n買い、夕食の買い物もした。"}, {"t": 944.3, "x": "食事もしていた。"}, {"t": 945.5166666666667, "x": "そして9時8分にバスに乗ったところで事件に遭った。"}, {"t": 948.85, "x": "会社を出てから3時間たってるのね。"}, {"t": 951.2166666666667, "x": "議員の数えでは「三時間五分」だ。"}, {"t": 953.65, "x": "これまでの考え方なら、食事や日用品でない\n買い物で通勤は切れたと見られやすい。"}, {"t": 958.95, "x": "寄り道が多すぎる、ってことね。"}, {"t": 961.0166666666667, "x": "議員は、それでも認めたのは\n「なかなかの英断」だと言った。"}, {"t": 964.9, "x": "もう1人は？"}, {"t": 965.9, "x": "デパートで働いていた女性だ。"}, {"t": 967.8166666666667, "x": "仕事のあと喫茶店で50分ほど話していた。"}, {"t": 970.7333333333333, "x": "話の中身は在庫などの仕事のことだったとして、\n通勤の途中と扱われた。"}, {"t": 975.75, "x": "ずいぶん踏み込んだのね。"}, {"t": 977.2833333333333, "x": "別の議員は、新聞では「大岡裁き」と\n書かれたと言っている。"}, {"t": 981.35, "x": "情けのある裁き、ってことね。"}, {"t": 983.4, "x": "ただ、その先がある。"}, {"t": 984.8833333333333, "x": "議員は、この例を事例集に載せるのかと聞いた。"}, {"t": 987.7166666666667, "x": "事例集は、全国の役所が判断に\n迷ったときに見る手本だ。"}, {"t": 991.6666666666666, "x": "労働省の局長の答えはこうだった。"}, {"t": 994.0333333333333, "x": "「新宿の件は実は稟伺がなくて処理をした\nケースでございますので、その意味で事例集に"}, {"t": 999.35, "x": "載せるに至らなかった」"}, {"t": 1000.45, "x": "稟伺って？"}, {"t": 1001.3666666666667, "x": "地方の役所が本省に判断を仰ぐことだ。"}, {"t": 1004.0833333333334, "x": "それが無かったから載せていない、という答えだ。"}, {"t": 1006.9333333333333, "x": "認めはしたけど、手本には残らなかったのね。"}, {"t": 1009.9333333333333, "x": "局長の答弁を読む限り、そうなる。"}, {"t": 1012.2833333333333, "x": "この2人の例は、事例集の外で決まった。"}, {"t": 1015.6833333333333, "x": "ここで刑法の話を一つ入れる。"}, {"t": 1017.8, "x": "男が起訴された罪の名前に、気になる言葉がある。"}, {"t": 1021.0166666666667, "x": "法務省の刑事局長の答弁では、罪名は「\n建造物等以外放火、殺人、それから殺人未遂」"}, {"t": 1027.5833333333333, "x": "建造物等以外？"}, {"t": 1028.9666666666667, "x": "建物以外の物に火をつけた罪、という意味だ。"}, {"t": 1031.95, "x": "人がいる建物に火をつける罪は、刑法108条にある。"}, {"t": 1035.6333333333334, "x": "条文はこうだ。"}, {"t": 1036.6666666666667, "x": "「現に人が住居に使用し又は現に人がいる\n建造物、汽車、電車、艦船又は鉱坑」"}, {"t": 1042.55, "x": "汽車と電車と船はあるのに、バスは無いのね。"}, {"t": 1045.4, "x": "無い。"}, {"t": 1045.8666666666666, "x": "並んでいるのは、レールの上を走る\n乗り物と、船と、鉱山の坑道だ。"}, {"t": 1050.2666666666667, "x": "だから人が乗っていたバスでも、\nこの条文の列には入らなかった。"}, {"t": 1054.2333333333333, "x": "火をつけた罪としては、それ\n以外の物を焼いた110条の罪になる。"}, {"t": 1058.4666666666667, "x": "でも殺人の罪もついているのよね。"}, {"t": 1060.7833333333333, "x": "ついている。"}, {"t": 1061.55, "x": "放火の罪だけで裁かれたわけではない。"}, {"t": 1063.8833333333334, "x": "この列のことは、15年後の国会でも話題になっている。"}, {"t": 1067.4166666666667, "x": "1995年4月25日。"}, {"t": 1069.95, "x": "刑法の条文をひらがなの口語に直す\n改正の審議だった。"}, {"t": 1073.5, "x": "ある議員が、新宿のバスの事件を挙げて聞いた。"}, {"t": 1076.4, "x": "バスやリニアモーターカーやゴンドラは、\nこの列に入れられないのかと。"}, {"t": 1080.0166666666667, "x": "法務省の審議官は、学説には\n入るという見方もあると答えた。"}, {"t": 1084.0666666666666, "x": "ただ「専用の軌条を持っている」\n乗り物に限るという見方が有力だという。"}, {"t": 1088.7166666666667, "x": "軌条って、レールのことね。"}, {"t": 1090.6, "x": "そうだ。"}, {"t": 1091.2166666666667, "x": "そして今回の改正では、そこまでは\n立ち入らなかったと答えている。"}, {"t": 1095.2166666666667, "x": "いまの条文でも、並んでいる言葉は\n「汽車、電車、艦船又は鉱坑」のままだ。"}, {"t": 1101.1166666666666, "x": "起訴されたのはいつ？"}, {"t": 1102.5166666666667, "x": "1980年10月29日だ。"}, {"t": 1105.2166666666667, "x": "事件から2か月と10日たっている。"}, {"t": 1107.4166666666667, "x": "その前に、男は鑑定留置という手続きに置かれていた。"}, {"t": 1110.95, "x": "心の状態を専門の医師に\n調べてもらうために、身柄を預ける手続きだ。"}, {"t": 1115.5, "x": "刑事局長の答弁では「九月の六日から鑑定留置」"}, {"t": 1119.1, "x": "起訴するかどうかを決める前に、調べていたのね。"}, {"t": 1122.1666666666667, "x": "そうだ。"}, {"t": 1122.7666666666667, "x": "刑法では、心神喪失なら罰しない。"}, {"t": 1125.3166666666666, "x": "心神耗弱なら刑を軽くする。"}, {"t": 1127.4, "x": "8月27日の時点で、刑事局長は\n一般論としてこう説明していた。"}, {"t": 1132.3666666666666, "x": "心神喪失となれば起訴できない場合もある。"}, {"t": 1135.0666666666666, "x": "心神耗弱なら刑の減軽が行われる。"}, {"t": 1137.8166666666666, "x": "心神喪失と心神耗弱って、どう違うの？"}, {"t": 1140.9833333333333, "x": "ざっくり言うと、善い悪いを分けて\n行動する力が無かったのが喪失だ。"}, {"t": 1145.2, "x": "その力がひどく弱っていたのが耗弱になる。"}, {"t": 1148.0166666666667, "x": "11月5日の衆議院の法務委員会で、\n刑事局長はこう答えた。"}, {"t": 1152.2833333333333, "x": "鑑定の結果「刑法上の心神喪失には\n当たらないということが言える」"}, {"t": 1156.55, "x": "理由は「心神喪失でございますれば\n起訴できない」からだという。"}, {"t": 1160.55, "x": "起訴したこと自体が、その答えになっているのね。"}, {"t": 1163.7166666666667, "x": "ただ、鑑定の中身は言わなかった。"}, {"t": 1165.9666666666667, "x": "「これから始まります公判の中で\n一つの立証事項として立証されていく」からだ。"}, {"t": 1171.1, "x": "裁判の中で出す、ということね。"}, {"t": 1173.4166666666667, "x": "そうだ。"}, {"t": 1174.0166666666667, "x": "この鑑定の扱いは、裁判で\nもう一度問われることになる。"}, {"t": 1178.2166666666667, "x": "話を事件の直後に戻す。"}, {"t": 1180.1666666666667, "x": "8月27日の法務委員会の朝、\n奥野誠亮 法務大臣はこう述べている。"}, {"t": 1185.3833333333334, "x": "「最近精神障害の疑いのある者による犯罪が\nかなり頻発しているようでございます」"}, {"t": 1190.5333333333333, "x": "そして新宿のバスの件を挙げた。"}, {"t": 1192.7833333333333, "x": "まだ鑑定も始まっていない時期よね。"}, {"t": 1195.1666666666667, "x": "鑑定留置が始まる9月6日より前だ。"}, {"t": 1197.7666666666667, "x": "大臣は「疑い」という言葉を使っている。"}, {"t": 1200.5666666666666, "x": "大臣はこうも言った。"}, {"t": 1201.95, "x": "「無為無策で、知りません、\n存じませんということは許されないじゃないか」"}, {"t": 1206.1, "x": "何かしなきゃ、という気持ちね。"}, {"t": 1208.2, "x": "その「何か」として\n大臣が挙げたのが、保安処分だった。"}, {"t": 1212.0166666666667, "x": "前の日の発言を、大臣は委員会で読み上げている。"}, {"t": 1215.1666666666667, "x": "「昭和四十九年に刑法全面改正の答申を得ながら\nいまだその実現を見ていない」"}, {"t": 1220.1, "x": "「今後鋭意関係者との協議を\n進めてその実現を推進したい」"}, {"t": 1224.0166666666667, "x": "保安処分って何？"}, {"t": 1225.4166666666667, "x": "罪を犯した人について、刑罰とは\n別に施設で治療などを受けさせる。"}, {"t": 1229.7666666666667, "x": "そういう仕組みのことだ。"}, {"t": 1231.2166666666667, "x": "刑法をまるごと作り直す案の中に\n入っていて、1974年に答申が出ていた。"}, {"t": 1236.7, "x": "だが反対もあり、6年たっても実現していなかった。"}, {"t": 1240.25, "x": "それを、この事件で動かそうとしたのね。"}, {"t": 1242.8333333333333, "x": "大臣自身はそう説明している。"}, {"t": 1244.9, "x": "この日、質問した議員も慎重だった。"}, {"t": 1247.5333333333333, "x": "保安処分については\n「慎重の上にも慎重に」と求めた。"}, {"t": 1251.2833333333333, "x": "そして「保安処分ということについては\n私賛成をいたしかねます」と言っている。"}, {"t": 1256.1666666666667, "x": "大臣と同じ側の人ばかりじゃなかったのね。"}, {"t": 1259.0333333333333, "x": "そうだ。"}, {"t": 1259.6333333333334, "x": "ここから国会の中で、賛成と\n反対がはっきり分かれていく。"}, {"t": 1264.1, "x": "秋の国会では、大臣の発言そのものが\n何度も取り上げられた。"}, {"t": 1268.0833333333333, "x": "10月9日の衆議院の予算委員会。"}, {"t": 1270.5833333333333, "x": "ある議員はこう言った。"}, {"t": 1271.85, "x": "保安処分には「人権問題等いろいろな\n理由で反対論もずいぶんたくさんある」"}, {"t": 1276.6333333333334, "x": "人権の問題って？"}, {"t": 1278.1833333333334, "x": "8月27日の議員も、保安処分という言葉を\n聞くだけで「ぞっとする」と言っていた。"}, {"t": 1283.7166666666667, "x": "都合の悪い人を権力が閉じ込める\n道具になるのでは、という心配だ。"}, {"t": 1287.8833333333334, "x": "10月16日の参議院の法務委員会では、\n別の議員がこう言っている。"}, {"t": 1292.2333333333333, "x": "「得たりや応と御発言なさったように\n私どもは考えざるを得ない」"}, {"t": 1296.0166666666667, "x": "えたりやおう？"}, {"t": 1296.9333333333334, "x": "待っていました、しめたとばかりに、という\n意味の古い言い回しだ。"}, {"t": 1300.6333333333334, "x": "前から通したかった案を、事件に\n乗せて持ち出したように見える。"}, {"t": 1304.3666666666666, "x": "そういう批判だな。"}, {"t": 1305.6833333333334, "x": "きつい言い方ね。"}, {"t": 1306.9166666666667, "x": "10月30日には、さらに別の議員が聞いている。"}, {"t": 1310.1166666666666, "x": "「あの事件が精神障害者のやったことだという\nふうに思われて御発言になったんでしょうか」"}, {"t": 1315.2166666666667, "x": "まだ分かっていないのに、決めつけて\n話したんじゃないかってことね。"}, {"t": 1319.05, "x": "そういう問いだ。"}, {"t": 1320.0166666666667, "x": "この時点では鑑定の結果は出ていない。"}, {"t": 1322.3333333333333, "x": "起訴は、その前日の10月29日だった。"}, {"t": 1325.3333333333333, "x": "大臣の発言から2か月以上、鑑定の結論は無いまま\n議論が続いていたことになる。"}, {"t": 1330.7, "x": "順番が逆になっていたのね。"}, {"t": 1332.6833333333334, "x": "少なくとも、国会でそう指摘されていたのは確かだ。"}, {"t": 1336.7, "x": "年が明けて1981年3月26日。"}, {"t": 1340.2166666666667, "x": "参議院の予算委員会で同じ問いが出た。"}, {"t": 1342.7, "x": "ある議員が大臣に聞いている。"}, {"t": 1344.4333333333334, "x": "「保安処分が急にニュースとなりましたが、そういう\nきっかけは適当でなかったのじゃないですか」"}, {"t": 1349.7166666666667, "x": "大臣はなんて答えたの？"}, {"t": 1351.45, "x": "大臣は、バスの事件だけで\n言ったのではない、と答えた。"}, {"t": 1354.9333333333334, "x": "「あの月にたしか四件目じゃなかったかと\n思うのです、ちょっと正確じゃありませんけれども」"}, {"t": 1360.0333333333333, "x": "同じような事件が、その月に続いていたってこと？"}, {"t": 1363.3, "x": "大臣はそう受け止めていた。"}, {"t": 1365.0166666666667, "x": "ただ自分で「正確じゃありません」と断っている。"}, {"t": 1368.05, "x": "大臣の説明では、もともと刑法の改正が\n「膠着状態」になっていた。"}, {"t": 1372.9, "x": "それを打開したいと\n考えていたところに、この事件があった。"}, {"t": 1376.4333333333334, "x": "閣議で「打開を図りたい、\n御了解いただけますか」と発言したという。"}, {"t": 1381.05, "x": "やっぱり前から通したかった案なのね。"}, {"t": 1383.4666666666667, "x": "大臣自身がそう認めていると言える。"}, {"t": 1385.7, "x": "大臣はさらに\n「刑事治療処分のような仕組み」とも言っている。"}, {"t": 1389.45, "x": "保安処分という言葉ではなく、\n治療という言葉を使っている。"}, {"t": 1393.2, "x": "同じ議員は、そのあと誰に聞いたの？"}, {"t": 1395.65, "x": "総理大臣にも同じ問いを向けている。"}, {"t": 1397.85, "x": "バスの事件をきっかけに刑法改正が急に\n持ち上がるのは、適当でないのでは。"}, {"t": 1402.5, "x": "そういう問いだ。"}, {"t": 1403.4666666666667, "x": "事件から7か月たっても、議論の\nきっかけそのものが問われ続けていた。"}, {"t": 1408.55, "x": "反対の声は、議員だけではなかった。"}, {"t": 1410.9666666666667, "x": "1981年11月18日、参議院の特別委員会に\n参考人が呼ばれている。"}, {"t": 1416.9, "x": "障害のある人たちの団体で、\n副代表幹事を務める人だった。"}, {"t": 1421.1333333333334, "x": "その人は、保安処分の話が新宿の事件などの中で\n「急速に高まってきた」と言った。"}, {"t": 1427.1833333333334, "x": "その人はどう考えていたの？"}, {"t": 1429.15, "x": "問題は二つあると言っている。"}, {"t": 1430.95, "x": "一つは、病気の人に向けられる「偏見の意識」。"}, {"t": 1434.2666666666667, "x": "もう一つは「精神医療のあり方の問題」だ。"}, {"t": 1437.4333333333334, "x": "病院に行きにくい、ってことかしら。"}, {"t": 1439.65, "x": "まさにそういう話をしている。"}, {"t": 1441.4333333333334, "x": "気軽に相談できたり、医者に気軽に\n相談に乗ってもらえたりすればいい。"}, {"t": 1445.5833333333333, "x": "だが現実は、病院に行っただけで\n危ない人と見られてしまう、と。"}, {"t": 1449.7166666666667, "x": "それじゃ、かえって誰も相談しなくなるわね。"}, {"t": 1452.5166666666667, "x": "1982年2月には、ある議員が新聞の社説を\nまとめて委員会で読み上げている。"}, {"t": 1457.9833333333333, "x": "その中の一つの題が、短くてよく分かる。"}, {"t": 1460.95, "x": "「保安処分より前にすべきこと」"}, {"t": 1463.0166666666667, "x": "前にすべきこと？"}, {"t": 1464.3333333333333, "x": "社説の結びとして読まれたのは\n「精神医療の充実が求められる」という一文だった。"}, {"t": 1469.6333333333334, "x": "この回は、どちらの考えが正しいとも言わない。"}, {"t": 1472.5166666666667, "x": "ただ一つ守ることがある。"}, {"t": 1474.1833333333334, "x": "病気と事件をひとくくりにしないことだ。"}, {"t": 1476.75, "x": "病気の人の多くは、事件と関係ないものね。"}, {"t": 1479.8666666666666, "x": "その通りだ。"}, {"t": 1480.8166666666666, "x": "8月27日に厚生省が答えた\n数字も、病気の人全体の数だ。"}, {"t": 1485.6166666666666, "x": "この事件の話ではない。"}, {"t": 1487.3666666666666, "x": "この議論は、そのあとどうなったの？"}, {"t": 1489.6333333333334, "x": "ずっと後に、別の形の法律の審議で、\nこの事件がまた出てくる。"}, {"t": 1493.9333333333334, "x": "それは後の章で触れる。"}, {"t": 1496.0166666666667, "x": "裁判に戻る。"}, {"t": 1497.1, "x": "1982年2月24日の衆議院の法務委員会で、ある議員が\nこう聞いた。"}, {"t": 1502.3166666666666, "x": "大臣は事件の直後、病気の人がやったことを\n前提に刑法改正を唱えた。"}, {"t": 1507.1333333333334, "x": "だが「その後の検査ではそうでなかった」と\n言われているが、どうなのか。"}, {"t": 1511.4, "x": "検察はどう答えたの？"}, {"t": 1513.0333333333333, "x": "この問いには、法務省で刑事を\n担当する局長が答えた。"}, {"t": 1516.6666666666667, "x": "少し長いが大事な所なので読む。"}, {"t": 1518.9833333333333, "x": "捜査の段階で鑑定をして「\n心神喪失あるいは耗弱というまでには\n至らない」と見て起訴した。"}, {"t": 1524.85, "x": "ただし「全く正常であるというわけではございません、\n若干の異常がある」"}, {"t": 1529.2333333333333, "x": "どちらとも言い切れない、という感じね。"}, {"t": 1531.6166666666666, "x": "そうだ。"}, {"t": 1532.25, "x": "そして局長は、もう一つ事実を付け加えた。"}, {"t": 1535.3, "x": "「裁判所が再度の精神鑑定をするという\n決定を去る二月十九日にされておる」"}, {"t": 1540.1166666666666, "x": "裁判所が、もう一度調べることにしたのね。"}, {"t": 1543.05, "x": "検察の鑑定とは別に、裁判所が\n自分で確かめることにしたわけだ。"}, {"t": 1547.5166666666667, "x": "同じころ、警察庁の課長はこの事件を\n「現在起訴公判中」と答えている。"}, {"t": 1552.5333333333333, "x": "事件から1年半たっても、裁判はまだ途中だった。"}, {"t": 1556.0833333333333, "x": "判決はいつ出たの？"}, {"t": 1557.5833333333333, "x": "さらに2年あまり後だ。"}, {"t": 1559.1, "x": "1984年4月27日の衆議院の\n地方行政委員会で、ある議員が触れている。"}, {"t": 1564.8, "x": "「この間も判決が出ましたけれども、\nバスに対する放火事件」"}, {"t": 1568.75, "x": "4月の終わりには、もう判決が出ていたのね。"}, {"t": 1571.6666666666667, "x": "そうだ。"}, {"t": 1572.3, "x": "事件から3年8か月ほどたっていた。"}, {"t": 1575.4666666666667, "x": "判決の中身は？"}, {"t": 1576.8833333333334, "x": "1984年4月に東京地方裁判所が出した\n判決は、無期懲役だった。"}, {"t": 1582.3, "x": "裁判所は男の責任能力を心神耗弱と認めた。"}, {"t": 1585.9833333333333, "x": "起訴のときは、そこまでではないとされていたのよね。"}, {"t": 1589.1166666666666, "x": "そうだ。"}, {"t": 1589.7333333333333, "x": "捜査段階の鑑定と、裁判の結論が\n分かれたことになる。"}, {"t": 1593.5166666666667, "x": "報道によれば、裁判所は殺そうとする\n気持ちがあったことは認めた。"}, {"t": 1597.6166666666666, "x": "そのうえで、鑑定の結果を採って\n刑を軽くしたとされている。"}, {"t": 1601.3, "x": "6人が亡くなって、無期懲役……。"}, {"t": 1603.6166666666666, "x": "刑法39条で、心神耗弱と認めれば刑は必ず軽くなる。"}, {"t": 1607.9666666666667, "x": "死刑は選べなくなるんだ。"}, {"t": 1609.55, "x": "検察は控訴したが、東京高等裁判所も\n一審の判決を支持したと報じられている。"}, {"t": 1614.8166666666666, "x": "こうして無期懲役が確定した。"}, {"t": 1616.8666666666666, "x": "この判決の日付や裁判長の名前は、\n判決の本文に当たれなかったので言わない。"}, {"t": 1622.05, "x": "確かめられたところまで、ね。"}, {"t": 1624.1, "x": "そうだ。"}, {"t": 1624.7333333333333, "x": "判決の年月と結論は、国会の記録と\n報道の両方で一致している。"}, {"t": 1629.3166666666666, "x": "2003年5月8日の参議院の法務委員会で、ある議員が\nこうまとめている。"}, {"t": 1633.8833333333334, "x": "「判決で心神耗弱とされまして、\n無期懲役が確定いたしました」"}, {"t": 1638.3, "x": "判決からずいぶん後の国会ね。"}, {"t": 1640.55, "x": "この年、ある新しい法律が審議されていた。"}, {"t": 1643.45, "x": "その話は次の章でする。"}, {"t": 1645.2666666666667, "x": "裁判の話の最後に、\n1984年7月の法務大臣の言葉を置いておく。"}, {"t": 1650.65, "x": "奥野法務大臣の何代か後の大臣だ。"}, {"t": 1653.2666666666667, "x": "「全く突然天から降ってくるような\nそういう状態でございます」"}, {"t": 1656.9333333333334, "x": "そして「人権とのバランスを\nどうやっていくか」に常に苦しむ、と言った。"}, {"t": 1661.5666666666666, "x": "事件から4年たっても、答えは出ていなかったのね。"}, {"t": 1665.3333333333333, "x": "2003年に審議されていたのは、ある法律の案だ。"}, {"t": 1668.6166666666666, "x": "心神喪失や心神耗弱の状態で重い\n事件を起こした人の処遇を決める。"}, {"t": 1673.25, "x": "続けて医療を受けさせ、社会に\n戻ることを目的にすると説明されていた。"}, {"t": 1677.95, "x": "保安処分とは違うの？"}, {"t": 1679.5833333333333, "x": "同じ日の法務大臣は「社会を防衛するために\n行われるものとは異質のもの」と答えている。"}, {"t": 1685.2333333333333, "x": "その審議で、ある議員が新宿の事件を例に挙げた。"}, {"t": 1688.4166666666667, "x": "男は無期懲役が確定した\nあと、一般の刑務所に入った。"}, {"t": 1692.2666666666667, "x": "議員の言葉では「特別な治療を\n受けられないまま刑務所内で自殺した」"}, {"t": 1696.75, "x": "亡くなったのね。"}, {"t": 1697.95, "x": "報道では、服役中の1997年に\n千葉刑務所で亡くなったとされている。"}, {"t": 1703.1, "x": "この回では、それ以上のことは言わない。"}, {"t": 1705.4166666666667, "x": "議員は、こういう批判があると続けた。"}, {"t": 1707.7666666666667, "x": "適切な治療を受けていれば\n防げたのではないか、という批判だ。"}, {"t": 1711.6666666666667, "x": "罰と治療、どっちも足りなかったって\n言いたいのかしら。"}, {"t": 1714.9166666666667, "x": "議員は「批判されております」と\n言っていて、自分の結論にはしていない。"}, {"t": 1719.35, "x": "この回もそこは同じだ。"}, {"t": 1720.9333333333334, "x": "どうすべきだったかは決めない。"}, {"t": 1722.8, "x": "男が亡くなったことで、事件そのものはどうなったの？"}, {"t": 1726.2166666666667, "x": "裁判はもう確定していた。"}, {"t": 1727.9666666666667, "x": "だから判決はそのまま残る。"}, {"t": 1729.8833333333334, "x": "ただ、なぜあの夜あのバスだったのか。"}, {"t": 1732.2166666666667, "x": "それを本人の言葉で聞く機会は無くなった。"}, {"t": 1735.0666666666666, "x": "8日目の答弁で言っていた\n「動機は話していない」のままなのね。"}, {"t": 1739.0833333333333, "x": "少なくとも、国会の記録の上ではそうだ。"}, {"t": 1741.85, "x": "この回で集めた資料で、動機を\n確かめられるものは見つからなかった。"}, {"t": 1746.5833333333333, "x": "この事件は、その後の国会で\n何度も引き合いに出されている。"}, {"t": 1750.1666666666667, "x": "ただ、引かれるたびに少しずつ形が変わっていく。"}, {"t": 1753.4333333333334, "x": "形が変わる？"}, {"t": 1754.6166666666666, "x": "例を二つ出す。"}, {"t": 1755.75, "x": "一つ目は1991年4月の参議院の法務委員会だ。"}, {"t": 1759.8166666666666, "x": "ある議員が、新宿のバスの事件について\n「心神喪失という理由で無罪」と言っている。"}, {"t": 1765.25, "x": "え、無罪じゃなかったでしょ。"}, {"t": 1766.9833333333333, "x": "違う。"}, {"t": 1767.5666666666666, "x": "判決は心神耗弱で、無期懲役だ。"}, {"t": 1770.2333333333333, "x": "無罪にはなっていない。"}, {"t": 1771.55, "x": "二つ目は、給付金の法律との関係だ。"}, {"t": 1774.3666666666666, "x": "1999年の予算委員会の分科会で、ある議員は\nこう言った。"}, {"t": 1778.75, "x": "「新宿のバス放火事件をきっかけに」被害者に\n何とか対応しなければ、という話になった。"}, {"t": 1784.4833333333333, "x": "2007年の法務委員会では、\n別の議員がもっとはっきり言っている。"}, {"t": 1788.5333333333333, "x": "「犯罪被害者施策は、"}, {"t": 1789.95, "x": "新宿西口バス放火事件を契機に、\n昭和五十五年の犯罪被害者等給付法の制定に\nよって始まり」"}, {"t": 1796.5666666666666, "x": "でも法律は4月に成立していたのよね。"}, {"t": 1799.3, "x": "そうだ。"}, {"t": 1799.9, "x": "記録の順番では、法律の成立が\n4月23日、事件が8月19日だ。"}, {"t": 1805.2333333333333, "x": "法律そのものは、事件より先にできていた。"}, {"t": 1808.25, "x": "じゃあ、きっかけっていうのは間違いなの？"}, {"t": 1810.6666666666667, "x": "全部が間違いとは言えない。"}, {"t": 1812.3, "x": "事件が人々の関心を集めたのは確かだ。"}, {"t": 1815.1666666666667, "x": "閣議決定の見舞いのお金も、\nこの事件から生まれている。"}, {"t": 1818.5666666666666, "x": "ただ、法律がこの事件で作られたわけではない。"}, {"t": 1821.5166666666667, "x": "作られていたのに、間に合わなかった。"}, {"t": 1823.8166666666666, "x": "そこを取り違えると、\nこの事件の一番の特徴が消えてしまう。"}, {"t": 1827.7, "x": "間に合わなかった、のほうが大事なのね。"}, {"t": 1830.2166666666667, "x": "この回では、そう読んでいる。"}, {"t": 1832.6166666666666, "x": "法律が動き出してからは、どうなったの？"}, {"t": 1835.2666666666667, "x": "1981年1月1日に施行された。"}, {"t": 1838.6166666666666, "x": "そこから後の事件には、\nこの法律が使われるようになる。"}, {"t": 1842.0833333333333, "x": "1981年4月の衆議院の決算委員会では、ある議員が\nこう言っている。"}, {"t": 1847.15, "x": "新宿のバスの件では「施行前にでも\nそれを適用していくというような事例が、"}, {"t": 1851.5666666666666, "x": "弾力的な運用があった」"}, {"t": 1853.5166666666667, "x": "新宿の例が、ほかの事件でも持ち出されたのね。"}, {"t": 1856.7333333333333, "x": "そうだ。"}, {"t": 1857.35, "x": "施行前でも救えた例として、別の被害者の救済を\n求める話の中で使われている。"}, {"t": 1862.7333333333333, "x": "1986年3月の衆議院の災害対策特別委員会では、\n比べる材料にもなった。"}, {"t": 1868.9, "x": "自然災害で亡くなった方への弔慰金は、\nそのころ300万円だった。"}, {"t": 1873.2666666666667, "x": "ある議員は、通り魔の被害では\n800万円も支給されていると言っている。"}, {"t": 1877.5833333333333, "x": "同じ亡くなった方でも原因によって違うのね。"}, {"t": 1880.55, "x": "議員は災害の側をもっと上げてほしいと求めていた。"}, {"t": 1883.6333333333334, "x": "新宿の事件は、金額を\n考えるときの物差しの一つにもなっていたわけだ。"}, {"t": 1888.5166666666667, "x": "最初は200万円の見舞いだったのにね。"}, {"t": 1891.0666666666666, "x": "閣議決定の見舞いは、法律の給付とは別のものだ。"}, {"t": 1894.4833333333333, "x": "そこは混ぜないでおく。"}, {"t": 1895.8166666666666, "x": "2007年の議員の言い方を借りれば、そこから\n被害者のための施策が積み重なった。"}, {"t": 1901.1, "x": "一つずつ増えていったのね。"}, {"t": 1902.9333333333334, "x": "2004年には、被害者のための基本の法律も\n議員立法で作られたと述べている。"}, {"t": 1908.0166666666667, "x": "少しずつ、谷間が埋められていったのね。"}, {"t": 1910.6833333333334, "x": "そう言っていいと思う。"}, {"t": 1911.8833333333334, "x": "ただ、どの法律にも施行日はある。"}, {"t": 1914.0833333333333, "x": "施行日の前の夜は、いつでも起こりうる。"}, {"t": 1917.1333333333334, "x": "最後に、この回で使った記録をまとめておく。"}, {"t": 1920.0166666666667, "x": "事件の夜の時刻と場所は、\n1980年8月27日の警察庁の答弁。"}, {"t": 1925.6666666666667, "x": "発車待ちのバスと約30人の乗客は、\n11月26日の交通安全対策特別委員会。"}, {"t": 1931.9666666666667, "x": "法律の施行日は、\n1980年4月23日の参議院本会議の委員長報告。"}, {"t": 1937.7, 33, "x": "1980年8月19日の午後9時8分。"}, {"t": 2060.4666666666667, "x": "バスはまだ発車していなかった。"}, {"t": 2062.4, "x": "法律もまた、まだ走り出していなかった。"}, {"t": 2065.05, "x": "今回は、その二つの「発車前」を\n記録で読んだ回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
