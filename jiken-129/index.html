<script>
const D={"name": "129", "file": "129_編集用", "dur": 2027.66665625, "segs": [], "subs": [{"t": 0.0, "x": "1977年11月15日。"}, {"t": 2.7, "x": "衆議院の法務委員会。"}, {"t": 4.283333333333333, "x": "福田赳夫 首相が、ある自分の言葉を言い直した。"}, {"t": 7.666666666666667, "x": "「私が人の命は地球より重い、\nこういうふうに申し上げましたが」"}, {"t": 11.616666666666667, "x": "「国家の存立、法の秩序の尊重、堅持、これは\n当然のことでありますから、それは省略いたしまして」"}, {"t": 18.266666666666666, "x": "省略？　何を？"}, {"t": 19.633333333333333, "x": "法を守るのは当たり前だから、言わなかった。"}, {"t": 22.3, "x": "首相はそう説明したんだ。"}, {"t": 24.183333333333334, "x": "その「地球より重い」っていつ言った言葉なの？"}, {"t": 27.116666666666667, "x": "この1か月半前だ。"}, {"t": 28.65, "x": "日本航空の旅客機が乗っ取られ、\n151人が人質になった。"}, {"t": 32.9, "x": "要求は、600万ドルと、日本で\n拘束されていた9人の釈放。"}, {"t": 37.28333333333333, "x": "政府は、600万ドルを渡した。"}, {"t": 39.53333333333333, "x": "そして出国を望んだ6人を外へ出した。"}, {"t": 42.4, "x": "600万ドルって、日本円だと？"}, {"t": 44.75, "x": "警察白書は「約16億円」と書いている。"}, {"t": 47.8, "x": "決めたのは東京の総理官邸だ。"}, {"t": 49.88333333333333, "x": "夜10時に始まった会合が、\n翌朝の7時43分まで続いた。"}, {"t": 54.416666666666664, "x": "ひと晩で決めたってこと？"}, {"t": 56.13333333333333, "x": "そうだ。"}, {"t": 57.266666666666666, "x": "今回はそのひと晩に何が\n決まったのかを、国会の記録で追う。"}, {"t": 61.11666666666667, "x": "機内の様子を再現する回ではない。"}, {"t": 63.31666666666667, "x": "主役は東京で判断した人たちと、\nあとで国会に説明した言葉だ。"}, {"t": 67.96666666666667, "x": "乗っ取った人たちの名前は？"}, {"t": 69.86666666666666, "x": "出さない。"}, {"t": 71.0, "x": "今も手配が続いている人がいるからだ。"}, {"t": 74.06666666666666, "x": "1977年9月28日。"}, {"t": 76.9, "x": "パリ発東京行きの日本航空472便。"}, {"t": 79.6, "x": "途中の寄港地、インドのボンベイを\n飛び立った直後だった。"}, {"t": 82.93333333333334, "x": "警察白書はこう書いている。"}, {"t": 84.7, "x": "「けん銃、手りゅう弾等で武装した「日本赤軍」"}, {"t": 87.63333333333334, "x": "5人が、インドのボンベイ空港を離陸した\nパリ発東京行きの日航機472便（乗客、"}, {"t": 93.01666666666667, "x": "乗務員151人）を乗っ取り」"}, {"t": 95.45, "x": "日本時間だと何時ごろ？"}, {"t": 97.21666666666667, "x": "午前10時45分ごろだ。"}, {"t": 99.06666666666666, "x": "飛行機は向きを変え、同じ日の午後2時31分に\nバングラデシュのダッカに降りた。"}, {"t": 103.96666666666667, "x": "151人って日本の人ばかり？"}, {"t": 106.41666666666667, "x": "そうでもない。"}, {"t": 107.55, "x": "国会である議員は外国人が57人、\n17か国だったと数えている。"}, {"t": 112.15, "x": "アメリカ、エジプト、インド、\nパキスタン、フィリピン。"}, {"t": 115.45, "x": "いろんな国の人が乗ってたのね。"}, {"t": 117.58333333333333, "x": "そこがあとで判断を重くする。"}, {"t": 119.45, "x": "東京に第一報が入ったとき、\n日航の社長は政府のもとに来ていた。"}, {"t": 123.73333333333333, "x": "前の日にマレーシアで起きた\n日航機の墜落事故を、報告しに来ていたんだ。"}, {"t": 128.28333333333333, "x": "事故の翌日に乗っ取り？"}, {"t": 129.98333333333332, "x": "官房長官の国会報告がそう述べている。"}, {"t": 132.68333333333334, "x": "11時半ごろには、内閣に対策本部が置かれた。"}, {"t": 136.18333333333334, "x": "でもまだ何を要求されるか分からないのよね。"}, {"t": 138.95, "x": "分からない。"}, {"t": 140.08333333333334, "x": "ダッカに降りた機体は、まず燃料と水を求めた。"}, {"t": 143.16666666666666, "x": "要求が届くのは、その夜になってからだ。"}, {"t": 146.51666666666668, "x": "給油と給水が終わった。"}, {"t": 148.13333333333333, "x": "そのあとの午後9時15分。"}, {"t": 149.81666666666666, "x": "日本政府に向けて、二つの要求が届いた。"}, {"t": 152.73333333333332, "x": "官房長官は国会でこう読み上げている。"}, {"t": 155.16666666666666, "x": "「わが国で身柄拘束中の九名の囚人の釈放及び（２）"}, {"t": 158.81666666666666, "x": "身代金六百万米ドルを日本政府に\n対して要求してまいりました」"}, {"t": 163.3, "x": "囚人の釈放って、誰でもいいわけじゃないわよね。"}, {"t": 166.45, "x": "名指しだった。"}, {"t": 167.56666666666666, "x": "日本で拘束されていた、9人の名前が挙がっていた。"}, {"t": 170.88333333333333, "x": "その中には仲間と見られる人だけでなく、\n一般の刑事事件で拘束されていた人もいた。"}, {"t": 176.5, "x": "一般の刑事事件？"}, {"t": 177.95, "x": "政治的な主張とは関係のない事件だ。"}, {"t": 180.55, "x": "あとでここが一番もめる。"}, {"t": 182.26666666666668, "x": "乗っ取ったのが誰か、この時点で分かってたの？"}, {"t": 185.2, "x": "「この段階で、犯人は日本赤軍であることが\n判明をいたしました」"}, {"t": 189.31666666666666, "x": "これも官房長官の言葉だ。"}, {"t": 191.23333333333332, "x": "2年前の1975年8月、\nマレーシアのクアラルンプールで、"}, {"t": 195.36666666666667, "x": "同じ名前のグループが大使館などを占拠した。"}, {"t": 198.35, "x": "そのときも日本は拘束中の人を釈放している。"}, {"t": 201.6, "x": "じゃあ、2回目ってこと？"}, {"t": 203.26666666666668, "x": "警察白書も「クアラルンプール事件」に続いてと\n書いている。"}, {"t": 206.95, "x": "政府にとっては、前の判断を\nもう一度問われる夜だった。"}, {"t": 211.01666666666668, "x": "午後10時。"}, {"t": 212.13333333333333, "x": "総理官邸で対策本部の1回目の会合が開かれた。"}, {"t": 215.6, "x": "本部長は園田直 官房長官だ。"}, {"t": 218.31666666666666, "x": "首相じゃなくて、官房長官が本部長なのね。"}, {"t": 221.4, "x": "官房長官が本部をまとめ、\n最後の判断を首相が引き受ける形だ。"}, {"t": 225.76666666666668, "x": "関係する大臣と、各省の幹部がそろった。"}, {"t": 228.88333333333333, "x": "何時まで話したの？"}, {"t": 230.4, "x": "「二十九日午前七時四十三分ごろまで連続」"}, {"t": 233.46666666666667, "x": "つまり朝までだ。"}, {"t": 234.71666666666667, "x": "一睡もせずに？"}, {"t": 235.9, "x": "記録にはそこまでは書いていない。"}, {"t": 237.78333333333333, "x": "書いてあるのは、\n途切れずに続いた、ということだけだ。"}, {"t": 240.95, "x": "そして最初に決めたのは、お金のことだった。"}, {"t": 243.93333333333334, "x": "お金からなのね。"}, {"t": 245.21666666666667, "x": "官房長官の言葉で言うと、こうだ。"}, {"t": 247.55, "x": "「いま国民の出された税金を使うことはまことに\n身を切られる思いでありますけれども、"}, {"t": 252.1, "x": "金で済むことならということで\n身代金の要求には応じよう」"}, {"t": 255.83333333333334, "x": "お金は払う。じゃあ、9人は？"}, {"t": 258.01666666666665, "x": "「犯人の釈放は拒絶をする」"}, {"t": 259.95, "x": "これが最初の方針だった。"}, {"t": 261.8, "x": "半分だけ応じるってことね。"}, {"t": 263.73333333333335, "x": "そうだ。"}, {"t": 264.8666666666667, "x": "だが乗っ取った側は、これを受け入れなかった。"}, {"t": 267.46666666666664, "x": "官房長官は「一切これに応じない\n拒否の態度」と述べている。"}, {"t": 271.95, "x": "ここから政府は少しずつ譲っていく。"}, {"t": 274.26666666666665, "x": "翌日の衆議院で、官房長官は\nその順番を一行でまとめた。"}, {"t": 278.3333333333333, "x": "「最初は金だけ、次に、囚人のうちの特殊な者だけ、"}, {"t": 281.9, "x": "最後に一般刑事犯人は除くということで\n折衝をしてまいりました」"}, {"t": 286.1333333333333, "x": "三段階ね。"}, {"t": 287.26666666666665, "x": "まずお金だけ。"}, {"t": 288.3333333333333, "x": "次に、9人のうち一部だけ。"}, {"t": 290.3833333333333, "x": "最後に一般の刑事犯を除いた全員。"}, {"t": 292.9, "x": "だんだん広がってる。"}, {"t": 294.3333333333333, "x": "中でも反対が強かったのは、\n爆破事件などで拘束されている人たちだ。"}, {"t": 298.96666666666664, "x": "官房長官は「これは一緒にできぬという\n議論」があったと言っている。"}, {"t": 302.9166666666667, "x": "それでも最後にはその人たちも含めた。"}, {"t": 305.56666666666666, "x": "じゃあ一般の刑事犯は？"}, {"t": 307.23333333333335, "x": "「殺人、強盗の前科を持った\n二名の一般刑事犯については断じてのめない」"}, {"t": 311.8333333333333, "x": "政府はこの2人だけは渡さないと決めた。"}, {"t": 314.5, "x": "線を引いたのね。"}, {"t": 315.76666666666665, "x": "「いかなる意味でも政治犯罪者ではなく、\n釈放するのは妥当でない」"}, {"t": 319.6333333333333, "x": "これが政府の挙げた理由だ。"}, {"t": 321.43333333333334, "x": "そこは最後まで守れたの？"}, {"t": 323.23333333333335, "x": "それはダッカの話になってから分かる。"}, {"t": 325.55, "x": "先に時計を進めよう。"}, {"t": 327.7, "x": "9月29日の朝。"}, {"t": 329.26666666666665, "x": "官房長官の国会報告は、こう続く。"}, {"t": 332.01666666666665, "x": "「二十九日午前七時四十三分までに、"}, {"t": 334.5, "x": "前記犯人の要求の両項目について、"}, {"t": 337.0, "x": "原則的には犯人側要求に応じることを決定、\nその旨犯人側に連絡をいたしました」"}, {"t": 342.8833333333333, "x": "原則的にね。"}, {"t": 344.23333333333335, "x": "そうだ。"}, {"t": 345.3666666666667, "x": "「原則的に」という言葉は、\n首相の演説にもそのまま出てくる。"}, {"t": 349.45, "x": "原則は応じる。"}, {"t": 350.6, "x": "ただし刑事犯の2人は別だ、という\n含みを残した言い方だ。"}, {"t": 354.53333333333336, "x": "首相はこの決定を何と呼んだの？"}, {"t": 356.75, "x": "国会の初日の演説で、こう言っている。"}, {"t": 359.26666666666665, "x": "「緊急異常な事態に\n対処するための異例の措置でありました」"}, {"t": 362.78333333333336, "x": "「法治国家として、このような\n措置をとらざるを得なかったことは\nまことに断腸の思いであります」"}, {"t": 368.1666666666667, "x": "断腸の思いか。"}, {"t": 369.3333333333333, "x": "伝えたのは日本の人？"}, {"t": 371.03333333333336, "x": "違う。"}, {"t": 372.1666666666667, "x": "外務省の部長によると、伝えたのは\nバングラデシュの参謀長だ。"}, {"t": 375.98333333333335, "x": "「二十九日の午前八時七分にマームド参謀長が…"}, {"t": 379.05, "x": "受け入れる旨の日本政府の意向を\n犯人に伝達をいたしております」"}, {"t": 383.15, "x": "その返事は？"}, {"t": 384.31666666666666, "x": "18分後の午前8時25分に来た。"}, {"t": 386.98333333333335, "x": "9人と600万ドルを、18時間以内に\nダッカへ運べ、という内容だ。"}, {"t": 391.76666666666665, "x": "18時間で東京からダッカまで？"}, {"t": 394.1166666666667, "x": "人もお金も飛行機で運ぶしかない。"}, {"t": 396.4166666666667, "x": "ここから準備の時間との競争になる。"}, {"t": 399.3833333333333, "x": "で、「地球より重い」はどこで出てくるの？"}, {"t": 402.01666666666665, "x": "首相がこの決定をどう説明したか、記録に残っている。"}, {"t": 405.56666666666666, "x": "10月7日参議院の本会議だ。"}, {"t": 407.8, "x": "「私は、この処理については\n非常に苦悶をしたんです」"}, {"t": 411.01666666666665, "x": "「国家の治安を優先すべきか、あるいは搭乗者、\n人の命を尊重すべきか、いろいろ思いあぐねましたが」"}, {"t": 417.35, "x": "「結局、一人の人の命はこれは"}, {"t": 419.65, "x": "地球よりも重いと、こう言われる、\nこの搭乗者のさしあたりの命の問題、これを"}, {"t": 423.73333333333335, "x": "重視しなければならぬだろうと、\nこういう結論に達しまして」"}, {"t": 427.71666666666664, "x": "「こう言われる」って言ってるのね。"}, {"t": 429.55, "x": "そこは大事なところだ。"}, {"t": 431.05, "x": "首相は自分で作った言葉としてではなく、\n「そう言われる」言葉として出している。"}, {"t": 435.9, "x": "決めたのは首相ひとり？"}, {"t": 437.5, "x": "首相は「内閣におきまして\n一人の異存もございません」と答えている。"}, {"t": 441.75, "x": "反対した大臣はいなかった、という説明だ。"}, {"t": 444.76666666666665, "x": "でもさっき「省略した」って話があったわよね。"}, {"t": 447.98333333333335, "x": "そうだ。"}, {"t": 449.1166666666667, "x": "1か月後首相はこの言葉を補った。"}, {"t": 451.56666666666666, "x": "法を守ることは当然だから省いた、と。"}, {"t": 454.1333333333333, "x": "最初の一言が、それだけ繰り返し\n引用されたということでもある。"}, {"t": 458.1, "x": "国会では与党以外の議員もこの言葉を使った。"}, {"t": 461.05, "x": "ある議員は本会議でこう述べている。"}, {"t": 463.06666666666666, "x": "「地球より重いと言われる人命の尊重という\n至上命令のもと、政府のとられた超法規措置により、"}, {"t": 468.55, "x": "百四十余名の人質の方々の命が\n守られたことを心から喜ぶ」"}, {"t": 473.2, "x": "同じ演説の中で、こうも続けた。"}, {"t": 475.5833333333333, "x": "「割り切れぬ心情を各人の心の中に\n残したことも、これまた事実であります」"}, {"t": 480.55, "x": "喜びと割り切れなさが、同じ演説にあるのね。"}, {"t": 484.1666666666667, "x": "9月29日。"}, {"t": 485.45, "x": "政府はダッカに代表団を送ることにした。"}, {"t": 488.01666666666665, "x": "団長は石井一 運輸政務次官。"}, {"t": 490.4166666666667, "x": "関係する省からも人がつき、日航の社長と\n幹部も同じ特別機に乗った。"}, {"t": 495.3833333333333, "x": "社長も行ったの？"}, {"t": 496.6333333333333, "x": "行った。"}, {"t": 497.76666666666665, "x": "社長はこの役を引き受けるときに、\n3つの条件を出している。"}, {"t": 501.4166666666667, "x": "救援機は政府の正式な要請にすること。"}, {"t": 504.1333333333333, "x": "乗客と乗員の命を最優先にすること。"}, {"t": 506.8833333333333, "x": "そして行き先が分からないまま離陸させないこと。"}, {"t": 509.9, "x": "三つ目あとで効いてきそう。"}, {"t": 511.6, "x": "効いてくる。"}, {"t": 512.7333333333333, "x": "もう一つ官房長官が国会で紹介した申し出がある。"}, {"t": 516.1333333333333, "x": "石井団長ほか公務員5人が、こう言ってきたという。"}, {"t": 519.25, "x": "「向こうへ行って交渉の結果、\n自分たちは人質になることを\n覚悟していくからそれを了承してくれ」"}, {"t": 525.0666666666667, "x": "自分から人質に……。"}, {"t": 526.6, "x": "首相も予算委員会で、これを\n「忘れ得ざる感銘」と言っている。"}, {"t": 530.6166666666667, "x": "社長もその覚悟だったの？"}, {"t": 532.4666666666667, "x": "社長も自分の身を挺して役に立てればと\n思って同行した、と国会で話している。"}, {"t": 537.3833333333333, "x": "ただ官房長官は、民間の社長に\n人質に行けとは言えない、とも述べている。"}, {"t": 542.0666666666667, "x": "それでも団長の覚悟に感銘を\n受けながら送り出した、と。"}, {"t": 545.5833333333334, "x": "ただ代わりに人質になれたかどうかは別の話だ。"}, {"t": 548.6833333333333, "x": "ダッカでは日本の代表が表に出ることすら難しかった。"}, {"t": 552.85, "x": "表に出られないって、どういうこと？"}, {"t": 555.1166666666667, "x": "交渉の窓口はバングラデシュの側だった。"}, {"t": 557.65, "x": "官房長官の報告では、こうなっている。"}, {"t": 560.2, "x": "「バングラデシュの方では、一切日本の政府関係を\n犯人との折衝に当てることをかたく拒みまして」"}, {"t": 566.1, "x": "日本の飛行機なのに？"}, {"t": 567.6833333333333, "x": "止まっているのは、バングラデシュの空港だ。"}, {"t": 570.1833333333333, "x": "日本が相談していると分かれば、乗っ取った\n側が興奮して何が起きるか分からない。"}, {"t": 575.0166666666667, "x": "それが向こうの言い分だった。"}, {"t": 576.65, "x": "現地に駆けつけた日本の大使も、前に出なかった。"}, {"t": 579.8833333333333, "x": "陰で頼みながら交渉してもらう形だ。"}, {"t": 582.6166666666667, "x": "首相もそれを言ってた？"}, {"t": 584.1666666666666, "x": "言っている。"}, {"t": 585.3, "x": "「なかなか日本の代表と犯人との直接交渉も\n許されない、こういうような状態」"}, {"t": 590.1833333333333, "x": "これはあとで西ドイツの事件と\n比べられたときの、首相の答えの一部だ。"}, {"t": 594.6833333333333, "x": "自分で話せないのに、決めなきゃいけない。"}, {"t": 597.3, "x": "そうだ。"}, {"t": 598.4166666666666, "x": "東京で決めたことは、\nバングラデシュの人を通してしか届かない。"}, {"t": 602.2333333333333, "x": "その状態で期限が切られていく。"}, {"t": 604.8833333333333, "x": "期限の話は首相自身が参議院で語っている。"}, {"t": 607.9, "x": "10月19日の予算委員会だ。"}, {"t": 610.05, "x": "「午前三時までに回答がなければ\n人質の処刑をいたします、\nそれじゃ四時まで延ばしましょう、"}, {"t": 615.1333333333333, "x": "四時が限界です、さあ八時まで延ばしましょう、\n八時が限界で、今度は名前まで挙げまして」"}, {"t": 620.9166666666666, "x": "名前まで……。"}, {"t": 622.05, "x": "最初に名指しされたのは、アメリカ人の乗客だった。"}, {"t": 625.3, "x": "官房長官は乗っ取った側から\nこういう情報が来たと言っている。"}, {"t": 628.9166666666666, "x": "アメリカの銀行の人で、大統領の友人だ、と。"}, {"t": 632.25, "x": "それ本当だったの？"}, {"t": 633.6666666666666, "x": "確かめられていない。"}, {"t": 634.95, "x": "向こうから来た情報として、\n官房長官が紹介しただけだ。"}, {"t": 638.6833333333333, "x": "ただこの情報で東京はかえって困った。"}, {"t": 641.25, "x": "どうして？"}, {"t": 642.3833333333333, "x": "アメリカ人の名前が出た直後に応じれば、\nアメリカの力に屈したように見える。"}, {"t": 646.9666666666667, "x": "官房長官は「時間が経過しても\n返事するわけにはいかぬ」と"}, {"t": 650.7, "x": "考え返事をしなかったと述べている。"}, {"t": 653.0, "x": "名指しされた人が、遺言のような\n言葉をマイクで流す段階まで来た。"}, {"t": 657.25, "x": "官房長官はそれでも要求には\n応じなかった、と国会で認めている。"}, {"t": 661.6, "x": "命がかかってるのに。"}, {"t": 663.1666666666666, "x": "そうだ。"}, {"t": 664.3, "x": "首相はのちにもし期限まで拒み続けていたら\nどうなったか、と自分で問いを立てている。"}, {"t": 669.2833333333333, "x": "「これは一つの賭けになりますが」"}, {"t": 671.2833333333333, "x": "そう前置きしてから、処刑が始まっていたら\n一体どうなっただろうか、と語った。"}, {"t": 676.6666666666666, "x": "官邸で議論が続いているあいだ、\n外からの声も届いていた。"}, {"t": 680.3333333333334, "x": "官房長官はのちに国会でその中身を明かしている。"}, {"t": 683.5, "x": "事件が解決するまで、連日連夜電話が鳴ったという。"}, {"t": 687.05, "x": "どんな電話？"}, {"t": 688.1833333333333, "x": "大きく分けて二つの方向だった。"}, {"t": 690.3166666666667, "x": "一つはもっと厳しくやれ、という声だ。"}, {"t": 692.8, "x": "「自衛隊を飛行機に積んでいって\nなぜやらぬのか」という意見まであった。"}, {"t": 696.8333333333334, "x": "力ずくで取り返せってことね。"}, {"t": 698.9666666666667, "x": "もう一つは正反対だった。"}, {"t": 700.8, "x": "「なぜもっと一時間も\n早く出さぬのか、金が惜しいのか」"}, {"t": 704.2166666666667, "x": "「税金は国民のために使うのだ、\nその命を助けるのに何が惜しいのか」"}, {"t": 708.8333333333334, "x": "こっちは早く払えって声ね。"}, {"t": 710.7833333333333, "x": "官房長官は乗客やその関係の人たちからは、\nそう言われたと述べている。"}, {"t": 715.4333333333333, "x": "家族ならそう言うわよね。"}, {"t": 717.05, "x": "同じ国の中で正反対の声が同時に鳴っていた。"}, {"t": 720.15, "x": "どちらに応えても、もう一方からは責められる。"}, {"t": 722.9333333333333, "x": "官房長官は受けたおしかりの一つ一つに\n「いたく痛み入っております」と話した。"}, {"t": 728.1, "x": "決める側はつらいわね。"}, {"t": 729.6333333333333, "x": "ただつらいかどうかは、決定の正しさとは別の話だ。"}, {"t": 733.0833333333334, "x": "国会はそこを分けて問い続けることになる。"}, {"t": 736.3, "x": "10月1日。"}, {"t": 737.45, "x": "日航の特別機が、ダッカへ向かった。"}, {"t": 739.95, "x": "積んでいたのは、代表団と出国を\n望んだ6人と、600万ドルだ。"}, {"t": 744.5333333333333, "x": "9人じゃなくて、6人？"}, {"t": 746.3666666666667, "x": "9人のうち3人は、出国を拒んだ。"}, {"t": 749.0, "x": "警察白書は「出国を希望した」6人と書いている。"}, {"t": 752.6666666666666, "x": "本人が行かないと言えば、\n政府は連れて行かなかった。"}, {"t": 755.8833333333333, "x": "刑事犯の2人は、どうなったの？"}, {"t": 758.1, "x": "ここで現地の参謀長が話を持ちかけてきた。"}, {"t": 761.0666666666667, "x": "その2人もとにかく現地まで連れてきてくれ。"}, {"t": 763.7666666666667, "x": "全部そろえば、2人は自分が何とか\n日本に帰れるようにする、という話だ。"}, {"t": 768.5666666666667, "x": "それで連れて行ったの？"}, {"t": 769.9833333333333, "x": "官房長官は「仕方なしに」と言っている。"}, {"t": 772.7666666666667, "x": "法務省や警察も、それならばと承知した。"}, {"t": 775.7166666666667, "x": "お金のほうはどうやって用意したの？"}, {"t": 777.8333333333334, "x": "政府が詳しく説明した記録は見つからなかった。"}, {"t": 780.9166666666666, "x": "国会ではある議員がこう質問している。"}, {"t": 783.2666666666667, "x": "「すべて百ドルの紙幣で\n用意をされたと伝えられている」"}, {"t": 786.3333333333334, "x": "「四百万ドルアメリカから取り寄せたという」"}, {"t": 788.8333333333334, "x": "あくまで議員が「伝えられている」と言った話だ。"}, {"t": 791.8833333333333, "x": "確かなのは、600万ドルが\n特別機でダッカに運ばれたことだ。"}, {"t": 796.6166666666667, "x": "10月2日の早朝。"}, {"t": 798.15, "x": "参謀長と乗っ取った側の間で、\n交換のやり方が決まった。"}, {"t": 801.95, "x": "「釈放囚人六人及び六百万ドルと\n人質との交換を六回に分けて実施する」"}, {"t": 807.2333333333333, "x": "一度に全部じゃないのね。"}, {"t": 808.8833333333333, "x": "少しずつ渡して、少しずつ降ろす形だ。"}, {"t": 811.8, "x": "午前7時過ぎまでに、まず60人が降りた。"}, {"t": 814.8333333333334, "x": "日本側はそれで納得してたの？"}, {"t": 817.0333333333333, "x": "していなかった。"}, {"t": 818.1, "x": "政府も石井団長も、全員をダッカで\n降ろしてほしいと粘っていた。"}, {"t": 822.0333333333333, "x": "全員が降りるまでは、6人もお金も渡すな。"}, {"t": 824.95, "x": "それが東京から団長への指示だった。"}, {"t": 827.3666666666667, "x": "でも交換は始まってる。"}, {"t": 829.0833333333334, "x": "バングラデシュ側が急いでいたんだ。"}, {"t": 831.0833333333334, "x": "官房長官によると、向こうは\n「流血の惨事」という言葉を何度も使った。"}, {"t": 835.9166666666666, "x": "とにかく怒らせずに、平和に終わらせたい。"}, {"t": 838.55, "x": "刑事犯の2人の話は？"}, {"t": 840.4166666666666, "x": "団長が着いたころには、もう話題にも\n上らない状態だったという。"}, {"t": 844.2166666666667, "x": "警察白書の並びを見ると、\nその2人も6人の中に入っている。"}, {"t": 848.5166666666667, "x": "最後まで守ろうとした線が……。"}, {"t": 850.4666666666667, "x": "現地では守れなかった。"}, {"t": 852.0333333333333, "x": "そしてその朝ダッカの町で別の事態が起きる。"}, {"t": 855.5333333333333, "x": "1回目の交換が終わった直後だった。"}, {"t": 857.9166666666666, "x": "ダッカで軍の一部が反乱を起こした。"}, {"t": 860.3166666666667, "x": "反乱？　ハイジャックの最中に？"}, {"t": 862.4, "x": "石井団長は国会でそのときの様子を話している。"}, {"t": 865.45, "x": "「正式な通告を受けたわけではございません」"}, {"t": 867.9833333333333, "x": "管制塔の係員から、「ちょっと国内的な\nトラブルが起こった」と言われただけだった。"}, {"t": 873.1833333333333, "x": "ちょっとで済んだの？"}, {"t": 874.45, "x": "済まなかった。"}, {"t": 875.4333333333333, "x": "空港にも反乱した兵士が入り、銃声が続いた。"}, {"t": 878.7, "x": "代表団も身を伏せて待った時間があったという。"}, {"t": 881.45, "x": "死傷者の数は報道によって100人とも250人とも\n言われた、と団長は述べている。"}, {"t": 886.7666666666667, "x": "交渉はどうなったの？"}, {"t": 888.2, "x": "止まった。"}, {"t": 889.3166666666667, "x": "団長によると、人質の解放についての交信は\n約6時間途絶えた。"}, {"t": 893.7333333333333, "x": "交渉の相手だった参謀長も、行方が分からなくなった。"}, {"t": 897.35, "x": "首相の言ってた「不測の事態」ってこれのこと？"}, {"t": 900.4666666666667, "x": "所信表明で首相は、「\n不測の事態の発生もあり、所期の目的を\n完全には達し得なかった」と述べている。"}, {"t": 907.0833333333334, "x": "反乱はその日の午後に鎮められた。"}, {"t": 909.2666666666667, "x": "団長は下の階級の兵士が待遇の改善を\n求めたものだと聞いた、と話している。"}, {"t": 914.3333333333334, "x": "ただその時期にハイジャックの最中が\n選ばれた、とも述べた。"}, {"t": 918.4333333333333, "x": "交渉が戻ったら、全員降ろしてもらえたの？"}, {"t": 921.3333333333334, "x": "さらに42人が降りた。"}, {"t": 923.0, "x": "だがそこまでだった。"}, {"t": 924.2833333333333, "x": "バングラデシュ政府が、機体に\n離陸の命令を出したんだ。"}, {"t": 927.7, "x": "まだ人が乗ってるのに？"}, {"t": 929.3, "x": "首相は大統領に電話をつなごうとした。"}, {"t": 931.7333333333333, "x": "反乱の直後で、なかなか居場所が\n分からなかったという。"}, {"t": 935.05, "x": "ようやくつながった大統領の答えを、\n官房長官はこう伝えている。"}, {"t": 939.0333333333333, "x": "「あれだけの大金を積んだ飛行機が\n飛行場におるということが国の安全に影響をする」"}, {"t": 943.85, "x": "大統領は反乱はこの事件が\n引き金になった、とまで言ったという。"}, {"t": 947.9666666666667, "x": "向こうの国にとっても、限界だったのね。"}, {"t": 950.5666666666667, "x": "お金が今度は重荷になったのね。"}, {"t": 952.7666666666667, "x": "一方で外務省は、ひそかに動いていた。"}, {"t": 955.3166666666667, "x": "飛び立ったあとに受け入れてくれる\n国を、探していたんだ。"}, {"t": 958.5333333333333, "x": "打診した先は「二十九カ国近く」。"}, {"t": 961.1333333333333, "x": "これは法務省にも警察にも言わず、\n外務省だけで極秘に進めたという。"}, {"t": 965.6333333333333, "x": "味方にも内緒で？"}, {"t": 967.0333333333333, "x": "受け入れ先を探していると漏れれば、\nそれ自体が問題になるからだろう。"}, {"t": 971.2333333333333, "x": "引き受ける国はあったの？"}, {"t": 972.8833333333333, "x": "「ほとんどの国は給油、それから領空通過一切拒否」"}, {"t": 976.2166666666667, "x": "中には領空に来たら撃墜すると\n言った国もあったという。"}, {"t": 979.75, "x": "社長の三つ目の条件は？"}, {"t": 981.6, "x": "行き先が決まらないうちは離陸させない。"}, {"t": 983.9333333333333, "x": "首相もそう申し入れた。"}, {"t": 985.4, "x": "だが機体は人質を乗せたまま、ダッカを離れた。"}, {"t": 989.1666666666666, "x": "10月3日。"}, {"t": 990.2, "x": "警察白書の数え方では、ダッカで降りたのは118人。"}, {"t": 993.9833333333333, "x": "残る33人を乗せて、機体は飛び立った。"}, {"t": 997.05, "x": "どこへ向かったの？"}, {"t": 998.3333333333334, "x": "最初はクウェートだ。"}, {"t": 999.5333333333333, "x": "次にシリアのダマスカス。"}, {"t": 1001.15, "x": "どちらの空港も、滑走路に装甲車や\n自動車を並べて、着陸させまいとした。"}, {"t": 1006.1833333333333, "x": "降りられないじゃない。"}, {"t": 1007.4, "x": "上空を回っているうちに、それを\nどけて仕方なく降ろしたという。"}, {"t": 1011.0333333333333, "x": "2か所で給油し、合わせて17人が降りた。"}, {"t": 1013.8166666666667, "x": "官房長官によると、ここでの解放は、\n石井団長がまとめた計画どおりだった。"}, {"t": 1018.7333333333333, "x": "ダッカを出る前に、降ろす\n人数の約束を取り付けていたんだ。"}, {"t": 1022.4833333333333, "x": "残りは？"}, {"t": 1023.6166666666667, "x": "16人。"}, {"t": 1024.75, "x": "最後の行き先が分かったのは、\nダマスカスを出た後だった。"}, {"t": 1028.2166666666667, "x": "乗っ取った側の交信の相手から、\nアルジェリアらしいと読めたんだ。"}, {"t": 1032.0, "x": "アルジェリアは受け入れたの？"}, {"t": 1033.5333333333333, "x": "条件つきだった。"}, {"t": 1034.8166666666666, "x": "お金と乗っ取った人の引き渡しは求めない。"}, {"t": 1037.5666666666666, "x": "それを日本がのむなら、ということだ。"}, {"t": 1039.95, "x": "のんだの？"}, {"t": 1041.0666666666666, "x": "のんだ。"}, {"t": 1042.2, "x": "首相はのちにその理由をこう説明している。"}, {"t": 1044.7833333333333, "x": "着陸を拒まれてどこにも降りられなければ、\n「海の中へ沈んでしまうほかないんですよ」"}, {"t": 1050.2833333333333, "x": "10月3日午後11時20分。"}, {"t": 1052.4166666666667, "x": "機体はアルジェリアのダル・\nエル・ベイダ空港に降りた。"}, {"t": 1055.4666666666667, "x": "日付が変わった10月4日の午前1時ごろ。"}, {"t": 1058.2666666666667, "x": "乗っ取った5人と、釈放された6人が、機体を離れた。"}, {"t": 1062.1333333333334, "x": "残っていた人たちは？"}, {"t": 1063.75, "x": "乗員も含めて全員が解放された。"}, {"t": 1066.0833333333333, "x": "警察白書は「犯人ら11人は、同国官憲に\n連行され、人質全員が解放された」と書いている。"}, {"t": 1073.05, "x": "やっと終わったのね。"}, {"t": 1074.3833333333334, "x": "乗っ取りからおよそ5日半だ。"}, {"t": 1076.2333333333333, "x": "乗客だった医師は翌年、国会でこう話した。"}, {"t": 1079.3333333333333, "x": "「百三十四時間機内に\n閉じ込められたままで過ごしました」"}, {"t": 1082.8, "x": "止まった機体の中は、冷房が\n効かず最高48度になったという。"}, {"t": 1087.1166666666666, "x": "48度……。"}, {"t": 1088.25, "x": "初めのころは、水も一日に\nコップ半分ほどだったと述べている。"}, {"t": 1092.2, "x": "乗客と乗っ取った側が、殴り合いになるかと\n思った場面が3回ほどあった、とも話した。"}, {"t": 1097.8, "x": "ずっと張りつめてたのね。"}, {"t": 1099.45, "x": "医師はその原因に、時間の長さと暑さ、\nほぼ満席だったことを挙げている。"}, {"t": 1104.0666666666666, "x": "救援の日航機は、10月4日と5日に羽田へ戻った。"}, {"t": 1107.8833333333334, "x": "亡くなった人は、いなかったのよね。"}, {"t": 1110.25, "x": "首相は本会議で、「一人の人命も\n傷つくことなく解決」と述べている。"}, {"t": 1114.8666666666666, "x": "人質の命は守られた。"}, {"t": 1116.7, "x": "その代わりに何が出ていったのか。"}, {"t": 1118.7, "x": "ここからは国会で問われた側の話になる。"}, {"t": 1122.0166666666667, "x": "アルジェリアで機体を降りるとき、乗っ取った\n側の一人が仲間に言った言葉がある。"}, {"t": 1126.4666666666667, "x": "官房長官が国会でわざわざ紹介した。"}, {"t": 1129.2333333333333, "x": "何て言ったの？"}, {"t": 1130.3333333333333, "x": "ここから先は日本政府ではない。"}, {"t": 1132.3666666666666, "x": "逆らえば撃たれるから、逆らうな。"}, {"t": 1134.5166666666667, "x": "そういう注意を、仲間に与えていたという。"}, {"t": 1137.1166666666666, "x": "日本政府なら撃たれない、ってこと？"}, {"t": 1139.3166666666666, "x": "官房長官はそう受け取った。"}, {"t": 1141.1666666666667, "x": "そして自分のことをこう言っている。"}, {"t": 1143.1166666666666, "x": "「本部長である私が無能であると、やつらは"}, {"t": 1146.0333333333333, "x": "何もできなかった、ここからは\n違うぞと、こういうせりふであります」"}, {"t": 1149.65, "x": "本部長が自分で「無能」って言ったの？"}, {"t": 1152.2166666666667, "x": "言っている。"}, {"t": 1153.35, "x": "国会の議事録に、その言葉のまま残っている。"}, {"t": 1156.3833333333334, "x": "同じ言葉は別の議員も取り上げた。"}, {"t": 1158.6166666666666, "x": "日本と違うんだぞ、という言葉を二度と\n言わせないように、備えを見せておくべきだ、と。"}, {"t": 1163.7333333333333, "x": "悔しかったのね、みんな。"}, {"t": 1165.5666666666666, "x": "悔しさはこのあと二つの方向に分かれていく。"}, {"t": 1168.3333333333333, "x": "備えを強くする方向と、法律を足す方向だ。"}, {"t": 1171.45, "x": "その前にもう一つ片づいていない問題があった。"}, {"t": 1175.0, "x": "アルジェリアとの約束は、それで終わり？"}, {"t": 1177.4, "x": "終わらなかった。"}, {"t": 1178.4, "x": "事件のあと政府は考えを変えたんだ。"}, {"t": 1180.7833333333333, "x": "変えた？"}, {"t": 1181.9, "x": "一度のんだ条件だから、返せと言う権利はない。"}, {"t": 1184.8166666666666, "x": "それは官房長官も認めている。"}, {"t": 1186.8833333333334, "x": "それでも同じことを繰り返させないために頼んだ。"}, {"t": 1189.75, "x": "返せるものなら、乗っ取った人を返してほしい。"}, {"t": 1192.6166666666666, "x": "無理ならアルジェリアで拘束してほしい。"}, {"t": 1194.7166666666667, "x": "お金も返せないなら没収してほしい。"}, {"t": 1197.1, "x": "向こうは何て？"}, {"t": 1198.2833333333333, "x": "「一遍要らぬと言ったものをいまごろ\n言うのはおかしいじゃないか」"}, {"t": 1201.3833333333334, "x": "官房長官は相手の反応をそう伝えている。"}, {"t": 1204.1666666666667, "x": "それは言われるわよね。"}, {"t": 1205.5666666666666, "x": "国会でもこの食い違いは問われた。"}, {"t": 1207.6833333333334, "x": "ある議員は閣議の場で引き渡しを求めないのは\nけしからんという声が出たことを取り上げた。"}, {"t": 1212.65, "x": "外交の約束と、国内の受け止め方がぶつかったんだ。"}, {"t": 1216.25, "x": "そしてこの問題の中で、一人の大臣が席を降りる。"}, {"t": 1220.2833333333333, "x": "法務大臣の福田一だ。"}, {"t": 1222.1333333333334, "x": "首相と同じ「福田」だが別の人だ。"}, {"t": 1225.0166666666667, "x": "辞めたの？"}, {"t": 1226.15, "x": "辞めた。"}, {"t": 1227.2666666666667, "x": "参議院では議員がすぐに理由を聞いている。"}, {"t": 1229.6666666666667, "x": "「法務大臣が辞任をされました。いかなる理由か」"}, {"t": 1232.6833333333334, "x": "首相の答えはこうだ。"}, {"t": 1234.1166666666666, "x": "「法を守る立場にある\n法務大臣におかれましては、とにかく"}, {"t": 1237.5, "x": "私はこの処置については賛成だが、その立場にある"}, {"t": 1240.5833333333333, "x": "私としては残念で残念でたまらない、この際そういう\n気持ちを表明する意味において辞意を表明したい」"}, {"t": 1246.45, "x": "賛成なのに辞めるの？"}, {"t": 1248.0166666666667, "x": "そこがこの辞任の形だ。"}, {"t": 1249.7666666666667, "x": "決定に反対したわけではない。"}, {"t": 1251.7166666666667, "x": "拘置していた人を、法の手続きに\nよらずに外へ出した。"}, {"t": 1255.1666666666667, "x": "その責任の置き場所として、辞めたという説明になる。"}, {"t": 1258.5666666666666, "x": "首相はその考え方を「了とし」受け入れたと答えた。"}, {"t": 1262.1833333333334, "x": "後任は？"}, {"t": 1263.3166666666666, "x": "瀬戸山三男だ。"}, {"t": 1264.5, "x": "衆議院の法務委員会で、本人が\n「突然のことでありまして」と言っている。"}, {"t": 1269.15, "x": "法を守る役所の長が、\n法の外の判断のあとで交代した。"}, {"t": 1272.9666666666667, "x": "ではその「法の外」とはどういう意味だったのか。"}, {"t": 1276.55, "x": "この判断は新聞では「超法規的措置」と呼ばれた。"}, {"t": 1280.15, "x": "法律を超えるってことよね。"}, {"t": 1281.95, "x": "ところが政府の中から別の言い方が出てきた。"}, {"t": 1284.7666666666667, "x": "「超実定法」だ。"}, {"t": 1286.2166666666667, "x": "違うものなの？"}, {"t": 1287.3833333333334, "x": "10月5日参議院の内閣委員会で、ある議員が\nまさにそれを聞いた。"}, {"t": 1291.55, "x": "答えたのは法務省の公安課長だ。"}, {"t": 1293.7833333333333, "x": "「超法規的措置ということの意味と\n超実定法的措置ということの意味は、"}, {"t": 1297.9, "x": "本来このハイジャックに関する二回の措置とも\n同じような意味に使っておる」"}, {"t": 1302.3333333333333, "x": "同じならなんで言い換えるの？"}, {"t": 1304.05, "x": "課長はこう説明した。"}, {"t": 1305.5666666666666, "x": "「超法規」と言うと法律によらずに\n何でもできる、という印象を与える。"}, {"t": 1309.7166666666667, "x": "「いわば無法なこと、違法なことでも\n当然できる」ように聞こえる、と。"}, {"t": 1313.9, "x": "それは困るわね。"}, {"t": 1315.15, "x": "だから国の法律の定めによらない、という\n意味で「超実定法」と言う。"}, {"t": 1319.5333333333333, "x": "そのうえで課長は、\n「緊急避難」という考え方を挙げた。"}, {"t": 1323.05, "x": "法秩序全体の精神から見て、「決して違法、\n不当な措置をしたわけではない」と。"}, {"t": 1328.1666666666667, "x": "言葉で意味を細かく分けてるのね。"}, {"t": 1330.3833333333334, "x": "法律の手続きの外に出たことは認める。"}, {"t": 1333.0166666666667, "x": "でも法の精神に背いたわけではない。"}, {"t": 1335.3, "x": "その二つを同時に言うための言葉だった。"}, {"t": 1337.9, "x": "2年前のクアラルンプールのときは？"}, {"t": 1340.0666666666666, "x": "課長は前回も法律的には超実定法と\n言うべきだった、と答えている。"}, {"t": 1344.5, "x": "言葉は変わっても、中身は2回とも\n同じだった、という説明だ。"}, {"t": 1349.1833333333334, "x": "法の外で出した6人って、\n法律の上ではどういう扱いになるの？"}, {"t": 1353.35, "x": "それも国会で聞かれている。"}, {"t": 1355.05, "x": "11月17日参議院の法務委員会。"}, {"t": 1357.8, "x": "答えたのは法務省の刑事局長だ。"}, {"t": 1360.1333333333334, "x": "まず機体を乗っ取った側について。"}, {"t": 1362.15, "x": "「刑法でいわゆる被拘禁者奪取罪、\nこれが成立する余地があると思います」"}, {"t": 1366.6833333333334, "x": "拘束されている人を奪う罪、ね。"}, {"t": 1369.0833333333333, "x": "ではそれに応じて出ていった6人は。"}, {"t": 1371.2333333333333, "x": "「逃走罪が成立する余地があると、\nかように考えております」"}, {"t": 1375.0166666666667, "x": "え政府が出したのに、逃げたことになるの？"}, {"t": 1377.6833333333334, "x": "そこがこの判断の不思議なところだ。"}, {"t": 1379.95, "x": "外へ出したのは政府の決定だ。"}, {"t": 1382.0166666666667, "x": "それでも出ていった本人の側には、\n逃げた罪が問われうる。"}, {"t": 1385.5833333333333, "x": "なんだかねじれてるわね。"}, {"t": 1387.15, "x": "局長は「最終的に確定いたしますためには\n犯人らの意思その他も"}, {"t": 1391.4, "x": "確認しないと何とも言えません」とも言っている。"}, {"t": 1394.1666666666667, "x": "あくまで余地があるという答えだ。"}, {"t": 1396.1166666666666, "x": "裁判が途中だった人は？"}, {"t": 1398.0, "x": "本人がいなければ、裁判は先へ進められない。"}, {"t": 1401.0166666666667, "x": "ここは別の回で詳しく扱ったので、\nこの回では繰り返さない。"}, {"t": 1404.8666666666666, "x": "法の外の判断は、法の中に\nほどけない結び目を残した。"}, {"t": 1409.2666666666667, "x": "国会ではみんな納得したの？"}, {"t": 1411.3333333333333, "x": "していない。"}, {"t": 1412.45, "x": "10月11日の衆議院予算委員会で、ある議員は\nこう迫った。"}, {"t": 1416.4666666666667, "x": "もし次にもっと大変な条件が出てきたらどうするのか。"}, {"t": 1419.8166666666666, "x": "「人命は地球より重いからといって、\n今度と同じ処置をとりますか」"}, {"t": 1423.7666666666667, "x": "「だからこそ、いま少なくとも\n原則は決めておくべきです」"}, {"t": 1427.3833333333334, "x": "次のときの話ね。"}, {"t": 1428.9666666666667, "x": "別の議員は首相が\n問いの立て方を間違えている、と言った。"}, {"t": 1432.5, "x": "「人命尊重か超法規的措置かという\n二者択一の命題を立てている」"}, {"t": 1436.85, "x": "二つに一つじゃないってこと？"}, {"t": 1438.85, "x": "そういう批判だ。"}, {"t": 1439.9666666666667, "x": "人質の命がなくなってもいいか、と\n聞かれていいと答える人はいない。"}, {"t": 1444.1166666666666, "x": "だから問いの形そのものが\nおかしい、という趣旨だった。"}, {"t": 1447.4833333333333, "x": "首相はどう答えたの？"}, {"t": 1449.0333333333333, "x": "首相も二者択一ではないと答えている。"}, {"t": 1451.5, "x": "「私は二者択一という考え方じゃなかったんです。"}, {"t": 1454.4666666666667, "x": "両方とも何とかしたい」"}, {"t": 1456.1, "x": "ただダッカの状況でそれは無理だった、と。"}, {"t": 1458.6, "x": "別の日にはこんな言い方もしている。"}, {"t": 1460.75, "x": "「そんな繊細なみごとな\n曲芸というものはこれはできないです」"}, {"t": 1464.35, "x": "両方守るのは曲芸だったってことね。"}, {"t": 1467.3833333333334, "x": "この議論を一気に強めた出来事がある。"}, {"t": 1469.75, "x": "ダッカの事件が終わって間もなく、\n西ドイツのルフトハンザ機が乗っ取られた。"}, {"t": 1474.2, "x": "また？"}, {"t": 1475.3333333333333, "x": "機体はアフリカのソマリアに降りた。"}, {"t": 1477.3166666666666, "x": "ある議員は国会で、\n西ドイツの対応をこうまとめている。"}, {"t": 1480.6, "x": "「最終的にはソマリア政府の了解をとって\n実力武装部隊を送り込んで鎮圧をした」"}, {"t": 1485.7666666666667, "x": "日本と逆ね。"}, {"t": 1486.9333333333334, "x": "国会ではその比較がすぐに持ち出された。"}, {"t": 1489.55, "x": "ある議員の言葉だ。"}, {"t": 1490.8166666666666, "x": "「西独のとった措置は世界から称賛を受け、\nわが国のとった措置は批判を受けておる」"}, {"t": 1495.8833333333334, "x": "きついわね。"}, {"t": 1497.0166666666667, "x": "ただその議員自身も、二者択一で考えるのは\n誤りのような気がする、と続けている。"}, {"t": 1502.2166666666667, "x": "首相は西ドイツの判断を「私なりに\nこれを評価しております」と言った。"}, {"t": 1506.7, "x": "同時にダッカとは客観的な\n情勢が違う、とも述べている。"}, {"t": 1510.45, "x": "日本もそういう部隊を作るって話にはならなかったの？"}, {"t": 1513.8333333333333, "x": "法務大臣は当時こう答えている。"}, {"t": 1515.9, "x": "「わが国でああいう特殊部隊をつくるという\n形式でやるということはいまの段階で、私は、"}, {"t": 1520.9, "x": "適当ではない、可能ではない」"}, {"t": 1522.8333333333333, "x": "乗客だった医師も、国会で意見を聞かれた。"}, {"t": 1525.6666666666667, "x": "「お客のことだけを考えるならばやはり\n日本的なやり方でやっていただきたい」"}, {"t": 1530.1666666666667, "x": "乗っていた人の意見は、また違うのね。"}, {"t": 1532.7833333333333, "x": "警察庁の幹部は、西ドイツとソマリアの措置を\n「きわめて異例なケース」と呼んだ。"}, {"t": 1537.7666666666667, "x": "外国で警察官を動かすには、その国の承認が\n前提になる、とも述べている。"}, {"t": 1542.9, "x": "自分の国の空港じゃないものね。"}, {"t": 1545.5833333333333, "x": "そもそもどうして武器を持ったまま乗れたの？"}, {"t": 1548.1333333333334, "x": "それは国会に呼ばれた日航の社長に\n向けられた問いでもあった。"}, {"t": 1551.7666666666667, "x": "社長はまず世界の流れを説明している。"}, {"t": 1554.2833333333333, "x": "アメリカでは1972年から、乗客全員の体と\n荷物を調べるようになった。"}, {"t": 1559.6666666666667, "x": "その方式が世界の空港の常識になっていった、と。"}, {"t": 1563.15, "x": "日本の会社もやってたのよね。"}, {"t": 1565.1666666666667, "x": "社内でいちばん厳しい段階の体制を、\nふだんから動かしていたという。"}, {"t": 1569.2666666666667, "x": "それでも防ぎきれなかった。"}, {"t": 1571.1166666666666, "x": "何が足りなかったの？"}, {"t": 1572.6166666666666, "x": "社長が挙げたのは、会社の力の限界だ。"}, {"t": 1575.4, "x": "検査は航空会社が、運送約款の範囲でやっている。"}, {"t": 1578.7333333333333, "x": "凶器を見つけても、取り上げることができない。"}, {"t": 1581.3666666666666, "x": "問いただすことも難しい。"}, {"t": 1583.1166666666666, "x": "会社には警察の力がないものね。"}, {"t": 1585.55, "x": "だから社長は、空港の検査に警察が\n全面的に出てほしいと訴えた。"}, {"t": 1590.05, "x": "ほかの国では警察や軍がその役目を担っている、と。"}, {"t": 1593.5166666666667, "x": "国内のハイジャックは、どうだったの？"}, {"t": 1595.8166666666666, "x": "警察庁の警備局長は、日本で起きた\nハイジャックは11件と答えている。"}, {"t": 1600.3833333333334, "x": "「幸い、一件を除いて全部検挙、解決をしておる」"}, {"t": 1603.8, "x": "国内では止められても、外国の空港から\n乗られると手が届かない。"}, {"t": 1607.8, "x": "警察白書は、1977年の人質事件を24件と数えている。"}, {"t": 1612.9833333333333, "x": "その中にこの事件を含むハイジャックが4件入っている。"}, {"t": 1616.4666666666667, "x": "1年で4件も？"}, {"t": 1617.8833333333334, "x": "3月には羽田を飛び立った\n国内線でも乗っ取りが起きている。"}, {"t": 1621.55, "x": "ダッカの事件は、その隙間で起きた。"}, {"t": 1624.6, "x": "政府が次に急いだのは、再発を防ぐ仕組みだった。"}, {"t": 1627.9666666666667, "x": "10月4日。"}, {"t": 1629.0166666666667, "x": "人質の全員が解放された日に、\n閣議で新しい本部が置かれた。"}, {"t": 1633.1833333333334, "x": "「ハイジャック等非人道的暴力防止対策本部」。"}, {"t": 1636.35, "x": "長い名前ね。"}, {"t": 1637.5, "x": "首相は最初の会合でこう言ったと本会議で述べている。"}, {"t": 1640.7, "x": "「鉄は熱いうちに打たなければならぬ」"}, {"t": 1642.8166666666666, "x": "「本当にのど元過ぎて忘れてはならない問題だ」"}, {"t": 1645.7666666666667, "x": "そして今月いっぱいに\n結論を出すように、と求めたという。"}, {"t": 1649.45, "x": "のど元過ぎれば、ってやつね。"}, {"t": 1651.4166666666667, "x": "実は前回の反省も込められている。"}, {"t": 1653.7, "x": "官房長官はクアラルンプールのあとにも\n対策は決められていた、と認めた。"}, {"t": 1658.0666666666666, "x": "ところが時がたつにつれて熱が冷め、決めたことが\n実行されていなかったのではないか、と。"}, {"t": 1663.5166666666667, "x": "2年前にも同じことを言ってたってこと？"}, {"t": 1666.05, "x": "そういう反省だ。"}, {"t": 1667.1833333333334, "x": "だから今回は航空会社も本部に加えた。"}, {"t": 1669.8833333333334, "x": "決めたことが実行されているかを、\n確かめ続けるためだ。"}, {"t": 1673.35, "x": "中身は空港での検査出入国の手続き、国際的な協力。"}, {"t": 1677.55, "x": "そして法律そのものにも手が入っていく。"}, {"t": 1680.6833333333334, "x": "外国の空港の問題は、日本だけでは解けない。"}, {"t": 1683.7666666666667, "x": "そこで国連での話し合いも国会で取り上げられた。"}, {"t": 1686.8166666666666, "x": "10月5日外務省の課長が説明している。"}, {"t": 1689.7333333333333, "x": "国連では何をしてたの？"}, {"t": 1691.4833333333333, "x": "人質を取る行為を防ぐための条約を\n作る委員会が、すでに動いていた。"}, {"t": 1695.95, "x": "1976年に、西ドイツの外相の呼びかけで\n作られた委員会だ。"}, {"t": 1700.7166666666667, "x": "1977年の8月に、条約案の話し合いが\n始まったばかりだった。"}, {"t": 1705.9333333333334, "x": "じゃあもうすぐできるはずだったの？"}, {"t": 1707.8666666666666, "x": "課長の答えは慎重だった。"}, {"t": 1709.7, "x": "「民族解放闘争のための人質行為等は\n抑圧されてはならないという\n主張をする国などがございまして」"}, {"t": 1715.7833333333333, "x": "国ごとの考え方に、大きな隔たりがあるという。"}, {"t": 1719.0166666666667, "x": "人質を取るのはだめ、で一致しないの？"}, {"t": 1721.65, "x": "何を罪とするか、という定義のところで割れていた。"}, {"t": 1724.7, "x": "質問した議員は、この2年間外務省は\n何をしてきたのかと強く迫っている。"}, {"t": 1729.6166666666666, "x": "クアラルンプールから2年、ね。"}, {"t": 1731.55, "x": "外務省の局長は、地道な\n努力の積み重ねの性質がある、と理解を求めた。"}, {"t": 1736.5666666666666, "x": "官房長官も事件が起きたとき、すぐに各国に協力を\n求めなかったのは足りなかった、と述べている。"}, {"t": 1742.8, "x": "受け入れる国が一つでもある\n限り、乗っ取りは終わらない。"}, {"t": 1746.0, "x": "国会ではそういう言い方も出ていた。"}, {"t": 1748.75, "x": "まず旅券の扱いを変える案が出された。"}, {"t": 1751.1, "x": "外務省の部長は、国会で\n新しい仕組みを説明している。"}, {"t": 1754.7166666666667, "x": "返納を命じる知らせを、官報に\n載せれば届いたとみなす。"}, {"t": 1758.3166666666666, "x": "本人に届かなくてもいいの？"}, {"t": 1760.2666666666667, "x": "居場所の分からない人には、\n知らせ自体が届かないからだ。"}, {"t": 1763.7333333333333, "x": "期限が来れば旅券を使えなくできる。"}, {"t": 1765.9666666666667, "x": "そして翌1978年、新しい法律が国会に出された。"}, {"t": 1770.3833333333334, "x": "「人質による強要行為等の処罰に関する法律案」だ。"}, {"t": 1774.1166666666666, "x": "名前のとおりの法律ね。"}, {"t": 1775.8333333333333, "x": "瀬戸山法務大臣は、提案理由の中で\nはっきりこの事件を挙げた。"}, {"t": 1779.85, "x": "「特に昨年九月のダッカ空港における\n日航機乗っ取り事件に端的に示されているように」"}, {"t": 1785.25, "x": "人を人質にして、国に何かを\n要求すること自体を罪にする。"}, {"t": 1789.3666666666666, "x": "外国での犯行も、広く処罰できるようにした。"}, {"t": 1792.5166666666667, "x": "人質の命を奪ったときは、死刑または無期懲役。"}, {"t": 1796.05, "x": "重い罪ね。"}, {"t": 1797.1833333333334, "x": "国の法律が乗っ取りそのものを正面から想定した形だ。"}, {"t": 1801.0, "x": "いつ成立したの？"}, {"t": 1802.3666666666666, "x": "衆議院の委員会は全会一致で可決した。"}, {"t": 1805.05, "x": "1978年5月12日、参議院の本会議でも\n可決され、成立した。"}, {"t": 1810.7, "x": "事件からだいたい7か月半ね。"}, {"t": 1812.9666666666667, "x": "法を曲げた判断のあとに、法を足していった形だ。"}, {"t": 1816.8, "x": "アルジェリアで降りた人たちは、どうなったの？"}, {"t": 1819.3833333333334, "x": "警察白書によると、その年の12月26日、\n乗っ取った5人のうち4人について逮捕状が出た。"}, {"t": 1825.9, "x": "身元は分かってたの？"}, {"t": 1827.3833333333334, "x": "白書の言葉では、5人のうち\n4人を「割り出し」たとある。"}, {"t": 1831.0833333333333, "x": "全国に手配し国際手配の手続きも進められた。"}, {"t": 1834.4333333333334, "x": "釈放された人たちについても、\n国際手配書が出された。"}, {"t": 1838.25, "x": "今は？"}, {"t": 1839.3666666666666, "x": "時間がたつうちに、海外で身柄を確保された人もいる。"}, {"t": 1842.85, "x": "一方で今も見つかっていない人がいる。"}, {"t": 1845.1666666666667, "x": "警視庁は今日本赤軍のメンバー\n7人を国際手配として公開している。"}, {"t": 1849.7166666666667, "x": "そのうち5人分は、ダッカ事件に関わる手配だ。"}, {"t": 1852.95, "x": "5人も……。"}, {"t": 1854.0833333333333, "x": "乗っ取りで手配されている人が2人。"}, {"t": 1856.3166666666666, "x": "あの夜の決定で釈放され、手配されている人が3人だ。"}, {"t": 1860.15, "x": "名前は言わないのよね。"}, {"t": 1861.65, "x": "言わない。"}, {"t": 1862.7666666666667, "x": "手配は手配で、裁判で罪が\n決まったわけではないからだ。"}, {"t": 1866.25, "x": "ただ、1977年10月4日にアルジェリアで機体を\n降りたあと、行方の分からない人がいる。"}, {"t": 1872.35, "x": "これは手配書が今も公開されていることから言える。"}, {"t": 1875.4166666666667, "x": "49年もたってるのに。"}, {"t": 1877.3333333333333, "x": "首相の言う「法の秩序」の側の宿題は、\nまだ閉じていない。"}, {"t": 1881.85, "x": "今回の話は何を元にしてるの？"}, {"t": 1884.2666666666667, "x": "中心は国会会議録だ。"}, {"t": 1886.0666666666666, "x": "1977年10月から翌年5月までの、\n首相官房長官政務次官法務大臣の答弁を読んだ。"}, {"t": 1892.9833333333333, "x": "時刻と人数は、警察白書の昭和53年版を使った。"}, {"t": 1896.9666666666667, "x": "今の手配は警視庁が公開している\n手配の一覧で確かめた。"}, {"t": 1900.8666666666666, "x": "数え方が違うところはあった？"}, {"t": 1902.9333333333334, "x": "あった。"}, {"t": 1904.05, "x": "官房長官の報告と警察白書では、\n降りた人の数え方が少し違う。"}, {"t": 1908.8166666666666, "x": "この回では白書の数にそろえた。"}, {"t": 1910.9333333333334, "x": "たとえば官房長官は乗客を142人と\n言い、白書は乗客と乗員で151人と書く。"}, {"t": 1916.8666666666666, "x": "数え方の違いで、どちらかが\n間違いというわけではない。"}, {"t": 1920.3166666666666, "x": "話さなかったことは？"}, {"t": 1921.85, "x": "乗っ取った人と、釈放された人の名前。"}, {"t": 1924.6166666666666, "x": "機内で誰がどう振る舞ったか、という細かい場面。"}, {"t": 1927.55, "x": "反乱の場面の様子。"}, {"t": 1929.0333333333333, "x": "それからお金の用意の仕方も言い切っていない。"}, {"t": 1931.6666666666667, "x": "政府が国会で説明した記録を、\n見つけられなかったからだ。"}, {"t": 1935.5333333333333, "x": "調べてみて意外だったことはある？"}, {"t": 1937.6333333333334, "x": "首相の言葉が最初から決め台詞ではなかったことだ。"}, {"t": 1940.8666666666666, "x": "10月7日の本会議では「こう言われる」と\n人から借りた言い方をしている。"}, {"t": 1945.3333333333333, "x": "それが国会の質問のたびに引用され\n首相の言葉として広まった。"}, {"t": 1949.5, "x": "11月には首相自身が前置きを\n足して言い直すことになった。"}, {"t": 1953.3666666666666, "x": "言葉のほうが先に歩いていったのね。"}, {"t": 1955.7, "x": "記録を日付順に並べるとその流れがよく見える。"}, {"t": 1959.3333333333333, "x": "ねえ最初の「省略した」って話もう一回いい？"}, {"t": 1962.5, "x": "いいぞ。"}, {"t": 1963.6333333333334, "x": "首相は法を守るのは当たり前だから\n言わなかった、って言ったのよね。"}, {"t": 1967.5333333333333, "x": "そうだ。"}, {"t": 1968.6666666666667, "x": "でもあの夜の決定を振り返ると、\n当たり前のはずの側が削られている。"}, {"t": 1972.8166666666666, "x": "お金は払った。"}, {"t": 1973.9333333333334, "x": "拘束していた6人は、外へ出た。"}, {"t": 1976.3666666666666, "x": "渡さないと決めた2人も、現地で6人の中に入った。"}, {"t": 1980.1, "x": "人の命は守った。"}, {"t": 1981.7166666666667, "x": "そう。151人の人質は、全員生きて帰った。"}, {"t": 1985.3166666666666, "x": "首相はその二つを両方守りたかった、と言い続けた。"}, {"t": 1988.7333333333333, "x": "「人の命も法の秩序も両々相まって存立する」"}, {"t": 1992.0666666666666, "x": "でもダッカでは両方は無理だった。"}, {"t": 1994.15, "x": "首相自身が「法秩序という面を\n犠牲にせざるを得ない」と認めている。"}, {"t": 1998.4, "x": "どちらが正しかったかを、\nこの動画で決めるつもりはない。"}, {"t": 2001.65, "x": "国会でも答えは一つにまとまらなかった。"}, {"t": 2004.4333333333334, "x": "残ったのは何なの？"}, {"t": 2005.8833333333334, "x": "一つは翌年にできた法律だ。"}, {"t": 2008.05, "x": "もう一つは今も公開されている手配書だ。"}, {"t": 2010.6833333333334, "x": "1977年9月28日の夜10時、官邸の会合が始まった。"}, {"t": 2015.8166666666666, "x": "朝の7時43分に、「原則的に応じる」と決まった。"}, {"t": 2019.7166666666667, "x": "その「原則的に」の中に省略された前置きがあった。"}, {"t": 2023.4166666666667, "x": "今回はその前置きの重さを、記録で量った回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
