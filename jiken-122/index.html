<script>
const D={"name": "122", "file": "122_編集用", "dur": 2105.01665625, "segs": [], "subs": [{"t": 0.0, "x": "1973年8月8日。"}, {"t": 2.35, "x": "東京都千代田区のホテル。"}, {"t": 4.033333333333333, "x": "昼の1時30分ごろ、22階の廊下で事は起きた。"}, {"t": 7.683333333333334, "x": "食事を終えた47歳の男が、部屋を出たところだった。"}, {"t": 11.333333333333334, "x": "近くの部屋から男たちが飛び出してくる。"}, {"t": 13.933333333333334, "x": "人数は5人ほどと見られている。"}, {"t": 15.95, "x": "5人も？　その人はどうなったの？"}, {"t": 18.183333333333334, "x": "隣の2210号室に押し込まれた。"}, {"t": 20.75, "x": "一緒に出てきた連れは、元の部屋へ押し戻された。"}, {"t": 23.783333333333335, "x": "押し込まれた男の名は金大中。"}, {"t": 25.766666666666666, "x": "韓国の大統領選挙に出たことのある政治家だ。"}, {"t": 28.8, "x": "5日後、その人はソウルにいた。"}, {"t": 30.933333333333334, "x": "自宅から40メートルの所で放されたという。"}, {"t": 33.95, "x": "東京のホテルから、海の向こうの自宅の近くまで？"}, {"t": 37.3, "x": "そうだ。通った道すじを、警察は確定できなかった。"}, {"t": 40.8, "x": "誰が手を貸したのかも、\n記録の上では全員は分かっていない。"}, {"t": 44.333333333333336, "x": "それでも日本の警察は、捜査を続けると答えてきた。"}, {"t": 47.983333333333334, "x": "何十年たっても？"}, {"t": 49.38333333333333, "x": "2008年の国会で、警察庁の局長がこう答えている。"}, {"t": 53.233333333333334, "x": "少なくとも1人の時効は、まだ完成していないと。"}, {"t": 56.46666666666667, "x": "今回は、この事件を国会の記録だけで追っていく。"}, {"t": 59.666666666666664, "x": "警察と外務省が、議員に何と\n答えてきたかを順に読む。"}, {"t": 63.31666666666667, "x": "手がかりは2210号室に残っていた物だ。"}, {"t": 66.3, "x": "弾倉、リュックサック、栄養剤の小びん、そして指紋。"}, {"t": 69.85, "x": "物から追うのね。"}, {"t": 71.1, "x": "ああ。物は嘘をつかないからな。"}, {"t": 73.08333333333333, "x": "最後には34年後に出た報告書までたどり着く。"}, {"t": 76.88333333333334, "x": "まずその日の午前から順に見ていこう。"}, {"t": 79.11666666666666, "x": "事件の16日後、警察庁長官が国会で経過を報告した。"}, {"t": 83.36666666666666, "x": "この章の材料は、主にこの報告だ。"}, {"t": 85.86666666666666, "x": "午前11時ごろ、金大中はタクシーでホテルに着いた。"}, {"t": 89.21666666666667, "x": "会いに行った相手は韓国の野党の党首だ。"}, {"t": 91.68333333333334, "x": "党首は同じホテルの2212号室に泊まっていた。"}, {"t": 95.05, "x": "同じ国の政治家どうしね。"}, {"t": 96.93333333333334, "x": "部屋には同じ党の国会議員も来ていた。"}, {"t": 99.43333333333334, "x": "3人は食事をしながら政治の話をした。"}, {"t": 102.15, "x": "そして午後1時30分ごろ、帰ろうと立ち上がる。"}, {"t": 105.25, "x": "国会議員と2人で廊下へ出た。"}, {"t": 107.26666666666667, "x": "その瞬間にさっきの男たちが現れた。"}, {"t": 110.01666666666667, "x": "待ち伏せされてたってこと？"}, {"t": 111.76666666666667, "x": "報告の言葉では「やにわに近くの部屋から」だ。"}, {"t": 114.96666666666667, "x": "飛び出してきた先の部屋は、すぐ隣の2210号室。"}, {"t": 118.71666666666667, "x": "党首の部屋のすぐ隣だ。"}, {"t": 120.56666666666666, "x": "そんな近くに知らない人が泊まってたの？"}, {"t": 123.18333333333334, "x": "泊まっていた。それも事件の2日前からだ。"}, {"t": 125.95, "x": "この部屋の話は、もう少しあとで詳しくやる。"}, {"t": 128.88333333333333, "x": "金大中は2210号室へ。"}, {"t": 130.81666666666666, "x": "国会議員は2212号室へ。"}, {"t": 133.03333333333333, "x": "2人は廊下で引き離された。"}, {"t": 135.03333333333333, "x": "金大中ってどういう立場の人だったの？"}, {"t": 137.58333333333334, "x": "長官の報告では「韓国の元新民党国会議員」とある。"}, {"t": 141.51666666666668, "x": "事件の翌月、日本の国会では\n与党の議員もこう呼んだ。"}, {"t": 145.15, "x": "「前韓国大統領候補」。"}, {"t": 146.9, "x": "野党の議員も、同じく前の大統領候補と呼んでいる。"}, {"t": 150.33333333333334, "x": "大統領選挙に出たことがある人ってことね。"}, {"t": 153.23333333333332, "x": "その人が東京に来ていて、昼間にいなくなった。"}, {"t": 156.31666666666666, "x": "場所は東京都千代田区のホテルだった。"}, {"t": 159.23333333333332, "x": "警察にはすぐ知らせが行ったの？"}, {"t": 161.35, "x": "そこがこの事件の最初のつまずきになる。"}, {"t": 163.83333333333334, "x": "警察庁が知ったのは、午後2時14分だった。"}, {"t": 166.9, "x": "起きてからおよそ45分あとだ。"}, {"t": 169.1, "x": "45分……。その間、誰も通報しなかったの？"}, {"t": 172.4, "x": "最初に知らせてきたのは日本の国会議員だった。"}, {"t": 175.4, "x": "自民党の議員から警察庁へ連絡が入った。"}, {"t": 178.33333333333334, "x": "110番の通報は、さらに遅い午後2時41分。"}, {"t": 181.68333333333334, "x": "係官は午後2時45分に現場へ着いている。"}, {"t": 184.6, "x": "2時55分には、空港と東京湾を\n受け持つ署に手配を終えた。"}, {"t": 188.48333333333332, "x": "3時40分、全国の警察に指示が飛ぶ。"}, {"t": 191.46666666666667, "x": "空港と港と、そこへ通じる道で検問をしろと。"}, {"t": 194.88333333333333, "x": "それならどこかで引っかかりそうだけど。"}, {"t": 197.21666666666667, "x": "ところが手配の中身が薄かった。"}, {"t": 199.33333333333334, "x": "長官はこう説明している。"}, {"t": 201.08333333333334, "x": "犯人の車は「車種、形、台数などが不明」だったと。"}, {"t": 205.16666666666666, "x": "だから車の手配はついにできなかった。"}, {"t": 207.71666666666667, "x": "何を止めればいいか分からなかったのね。"}, {"t": 210.08333333333334, "x": "そうだ。検問は張れても、探す相手の形が無い。"}, {"t": 213.4, "x": "8月10日の夜には、全国のホテルの客を\n調べる指示も出た。"}, {"t": 217.43333333333334, "x": "それでも長官の言葉はこうだった。"}, {"t": 219.56666666666666, "x": "「当庁の存知せぬ間に、\n残念ながら」国外に移された。"}, {"t": 223.38333333333333, "x": "警察のトップが国会でそう言ったのね。"}, {"t": 225.95, "x": "言った。「まことに残念なことである」とも。"}, {"t": 228.65, "x": "翌9日の午後7時には、麹町署に\n特別捜査本部ができた。"}, {"t": 232.96666666666667, "x": "名前は「金大中氏逮捕監禁特別捜査本部」。"}, {"t": 236.35, "x": "逮捕監禁っていう罪名で動いたのね。"}, {"t": 238.85, "x": "ここから、東京に残された物を追う捜査が始まる。"}, {"t": 242.68333333333334, "x": "警視庁の鑑識が2210号室に入った。"}, {"t": 245.76666666666668, "x": "部屋から押収された物を、\n長官は並べて報告している。"}, {"t": 249.41666666666666, "x": "何が残ってたの？"}, {"t": 250.81666666666666, "x": "1つ目は拳銃の弾倉だ。"}, {"t": 252.66666666666666, "x": "ドイツ製の自動拳銃のもので、実弾が7発入っていた。"}, {"t": 256.5833333333333, "x": "弾が入ったまま？"}, {"t": 257.95, "x": "入ったままだ。拳銃本体の話は報告に出てこない。"}, {"t": 261.48333333333335, "x": "2つ目はリュックサック。これが3個。"}, {"t": 263.81666666666666, "x": "3つ目は、グロモントという栄養剤の小びん。"}, {"t": 266.43333333333334, "x": "中の液体が3分の1ほど残っていた。"}, {"t": 269.0833333333333, "x": "4つ目は血のついたちり紙が少し。"}, {"t": 271.3333333333333, "x": "5つ目がパイプ1本。"}, {"t": 272.8, "x": "それからたばこの吸い殻が数十本。"}, {"t": 275.1333333333333, "x": "吸い殻が数十本って、かなり長くいたのかしら。"}, {"t": 278.35, "x": "報告は数を言っているだけで、\n時間の話はしていない。"}, {"t": 281.73333333333335, "x": "ただ、この部屋が何日前から\n使われていたかは分かっている。"}, {"t": 285.46666666666664, "x": "さっきの2日前からっていう話ね。"}, {"t": 287.9166666666667, "x": "そうだ。物の話の前に、部屋の借り方を見ておこう。"}, {"t": 291.98333333333335, "x": "事件の20日後、警察庁の参事官が\n参議院で細かく答えた。"}, {"t": 296.18333333333334, "x": "始まりは事件2日前の昼すぎだった。"}, {"t": 298.75, "x": "8月6日の午後1時15分ごろ、\nホテルに1本の電話が入った。"}, {"t": 302.96666666666664, "x": "7800円の22階の部屋を頼む、という予約だった。"}, {"t": 306.93333333333334, "x": "わざわざ22階を指定したのね。"}, {"t": 309.18333333333334, "x": "党首が泊まっていたのも22階だ。"}, {"t": 311.45, "x": "その日の午後6時45分、男がフロントに現れた。"}, {"t": 314.98333333333335, "x": "2泊で申し込み、前渡し金として3万円を置いた。"}, {"t": 318.35, "x": "鍵を受け取って部屋へ上がっていく。"}, {"t": 320.4166666666667, "x": "どんな人だったの？"}, {"t": 321.8, "x": "長官の報告では、福岡市内の男として泊まっていた。"}, {"t": 325.46666666666664, "x": "年は50歳ぐらいと見られている。"}, {"t": 327.5, "x": "警察はこの名前の人物の割り出しに\n全力を挙げると答えた。"}, {"t": 331.28333333333336, "x": "翌7日の夜11時ごろ、男は\nホテルのバーでビールを飲んだ。"}, {"t": 335.03333333333336, "x": "11時25分ごろには、マッサージを頼んでいる。"}, {"t": 338.1166666666667, "x": "そのマッサージ師が客の印象を話していた。"}, {"t": 340.75, "x": "50歳ぐらいの、中小企業の経営者ふうの人だと。"}, {"t": 344.23333333333335, "x": "事件の前の晩にビールとマッサージ……。"}, {"t": 346.48333333333335, "x": "記録に残っているのはそれだけだ。"}, {"t": 348.5833333333333, "x": "何を考えていたのかは、どこにも書かれていない。"}, {"t": 351.6333333333333, "x": "その人が例の5人の中にいたの？"}, {"t": 353.9166666666667, "x": "長官は「事件と関連性はきわめて高い」と述べた。"}, {"t": 357.35, "x": "ただ、その男が誰なのかは\n割り出せたと答えていない。"}, {"t": 360.68333333333334, "x": "参事官は、その名を「と称する男」と呼んでいる。"}, {"t": 364.15, "x": "名乗った名前が本物かどうかも分からないのね。"}, {"t": 367.03333333333336, "x": "この男がその後どうなったか、答弁は語っていない。"}, {"t": 370.81666666666666, "x": "次はリュックサック3個の出どころだ。"}, {"t": 372.96666666666664, "x": "これは早い段階で店が分かっている。"}, {"t": 375.21666666666664, "x": "ホテルの近くにある登山用具の専門店だった。"}, {"t": 378.1333333333333, "x": "買われたのは8月6日の午後1時15分ごろ。"}, {"t": 381.2, "x": "あれ？　それって電話の予約と同じ時刻じゃない？"}, {"t": 384.1166666666667, "x": "そうなんだ。長官と参事官の答弁を並べると重なる。"}, {"t": 387.6166666666667, "x": "店に来たのは2人連れの男だった。"}, {"t": 390.03333333333336, "x": "手分けして準備してたってこと？"}, {"t": 392.05, "x": "記録はそこまで言っていない。"}, {"t": 393.56666666666666, "x": "時刻が重なるだけだ。"}, {"t": 395.18333333333334, "x": "この店の話は、ひと月後にもう一度出てくる。"}, {"t": 398.28333333333336, "x": "店で応対した少年の店員がいた。"}, {"t": 400.5833333333333, "x": "警察は10数枚の写真をこの店員に見せた。"}, {"t": 403.46666666666664, "x": "店員は、ためらうことなく2人連れを指さしたという。"}, {"t": 406.73333333333335, "x": "顔を覚えてたのね。"}, {"t": 408.06666666666666, "x": "国家公安委員長が衆議院の本会議でそう答えている。"}, {"t": 411.4, "x": "それが誰の写真だったかは、のちの章で触れる。"}, {"t": 414.43333333333334, "x": "リュック3個を何に使うつもりだったのかしら。"}, {"t": 417.26666666666665, "x": "そこはどの答弁も推し量っていない。"}, {"t": 419.43333333333334, "x": "分かっているのは、部屋に置いていかれたことだけだ。"}, {"t": 422.93333333333334, "x": "次は栄養剤のびんだ。"}, {"t": 424.43333333333334, "x": "中身を調べると睡眠薬が混ざっていた。"}, {"t": 426.98333333333335, "x": "フェノバルビタールという薬だ。"}, {"t": 428.9, "x": "眠らせるために使ったの？"}, {"t": 430.73333333333335, "x": "そう考えたくなるが、参事官の答えは違った。"}, {"t": 433.8666666666667, "x": "残っていたのは3分の1ほど。"}, {"t": 435.8666666666667, "x": "仮に3分の2を飲んでいても、\n効き目は出ない程度の量。"}, {"t": 439.18333333333334, "x": "それにびんには唾液がついていなかった。"}, {"t": 441.55, "x": "誰も口をつけてないってこと？"}, {"t": 443.5833333333333, "x": "参事官は「\n飲まされたということはないのではなかろうか」と\n述べた。"}, {"t": 447.48333333333335, "x": "これが警察の一応の推定だった。"}, {"t": 449.8833333333333, "x": "用意したけど、使わなかったのかもしれないのね。"}, {"t": 452.95, "x": "そこまでは言っていない。"}, {"t": 454.1333333333333, "x": "推定は飲まされていない、までだ。"}, {"t": 456.26666666666665, "x": "むしろ警察が追ったのは、びんの刻印だった。"}, {"t": 459.1166666666667, "x": "赤い字でTE548と打たれていた。"}, {"t": 461.43333333333334, "x": "これはその年の4月11日に卸された品だと分かった。"}, {"t": 465.03333333333336, "x": "卸し先は仙台市内の薬問屋。"}, {"t": 467.35, "x": "TE500からTE549まで、50ケースのうちの1本だ。"}, {"t": 471.65, "x": "そこまで絞れるのね。"}, {"t": 473.1333333333333, "x": "問屋からは、宮城県内と\n山形市内の小売店に回っていた。"}, {"t": 477.0833333333333, "x": "店の数は合わせて10軒。"}, {"t": 478.75, "x": "犯人とその地域のつながりを捜査中だと長官は話した。"}, {"t": 482.53333333333336, "x": "それでつながりは見つかったの？"}, {"t": 484.43333333333334, "x": "今回読んだ答弁には、この線のその後が出てこない。"}, {"t": 487.6, "x": "答えが無い線はここで止めておく。"}, {"t": 490.26666666666665, "x": "ここで、捜査のいちばん大きな穴の話をしておく。"}, {"t": 493.5, "x": "穴？"}, {"t": 494.1333333333333, "x": "あの日いちばん近くにいたのは誰だったか。"}, {"t": 496.68333333333334, "x": "一緒に昼ごはんを食べてた2人よね。"}, {"t": 499.0833333333333, "x": "そうだ。野党の党首と、廊下に一緒に出た国会議員。"}, {"t": 502.53333333333336, "x": "この2人がいちばん詳しい目撃者になる。"}, {"t": 505.1, "x": "ところが党首は、8月11日に日本を出ている。"}, {"t": 508.3666666666667, "x": "国会議員のほうも8月15日に帰国した。"}, {"t": 511.48333333333335, "x": "止められなかったの？"}, {"t": 512.85, "x": "国家公安委員長が、本会議でその理由を説明した。"}, {"t": 516.3, "x": "外国人は入ってくるのは規制できる。"}, {"t": 518.7, "x": "だが出ていくのは法律上は本人の自由だ。"}, {"t": 521.3333333333334, "x": "逮捕する理由が無い限り、出国は止められない。"}, {"t": 524.45, "x": "じゃあ頼むしかなかったのね。"}, {"t": 526.2833333333333, "x": "警察も外務省も、出発を延ばしてくれと説得した。"}, {"t": 529.9, "x": "韓国の大使も一緒に説得に当たったという。"}, {"t": 532.7, "x": "党首は、15日の記念行事に\nどうしても出たいと話した。"}, {"t": 536.35, "x": "そして、できれば16日にまた来ると言って帰った。"}, {"t": 539.7166666666667, "x": "戻ってきたの？"}, {"t": 540.9, "x": "16日になっても来日は無かったと答弁にある。"}, {"t": 544.0, "x": "国会議員のほうは、15日まで捜査に協力した。"}, {"t": 547.3166666666667, "x": "半年後、警備局長はこの状況をこうまとめている。"}, {"t": 550.55, "x": "届け出が遅れた。被害者から事情を聞けていない。"}, {"t": 553.5833333333334, "x": "現場を見た2人は早々に帰国した。"}, {"t": 555.9833333333333, "x": "捜査の条件が最初から欠けていたわけだ。"}, {"t": 558.7333333333333, "x": "被害者本人からも聞けてないの？"}, {"t": 560.95, "x": "金大中はソウルにいる。"}, {"t": 562.25, "x": "日本の警察は話を聞けていない。"}, {"t": 564.5666666666667, "x": "警察は外務省を通じて、もう\n一度来日してほしいと頼み続けた。"}, {"t": 569.4833333333333, "x": "じゃあ、5日間のことはどうやって分かったの？"}, {"t": 572.2166666666667, "x": "金大中の供述だけが頼りだった。"}, {"t": 574.5333333333333, "x": "長官の報告でも「供述があるのみ」と断っている。"}, {"t": 578.0, "x": "その供述を報告の順に追ってみよう。"}, {"t": 580.3833333333333, "x": "まず、エレベーターで\nホテルの地下駐車場へ下ろされた。"}, {"t": 583.45, "x": "そこから車に乗せられた。"}, {"t": 585.1666666666666, "x": "行き先は大阪と思われる場所。"}, {"t": 587.1833333333333, "x": "そこから船に乗せられ、韓国のある港へ運ばれた。"}, {"t": 590.5666666666667, "x": "港からはまた車でソウルへ。"}, {"t": 592.4833333333333, "x": "8月13日の午後10時10分ごろ、\n自宅から40メートルの所で放された。"}, {"t": 597.7833333333333, "x": "5日かけて、家の近くまで連れてこられたのね。"}, {"t": 600.8833333333333, "x": "本人の話の中で、\n東京の手がかりになる部分もあった。"}, {"t": 604.5666666666667, "x": "エレベーターの中で、若い\n日本人の男女に会ったという。"}, {"t": 607.8833333333333, "x": "その2人が7階で降りたと話していた。"}, {"t": 610.55, "x": "その2人を探せば証人になるわね。"}, {"t": 612.95, "x": "警察もそう考えて、7階の泊まり客を中心に当たった。"}, {"t": 616.7833333333333, "x": "そして、エレベーターの中を見た人が何人か見つかる。"}, {"t": 620.1, "x": "のちに警備局長は\n「複数の目撃者が出て」きたと答えた。"}, {"t": 624.3, "x": "でもどれも本人の話が元なのね。"}, {"t": 626.7666666666667, "x": "そうだ。しかもその供述は、韓国側から\n渡された簡単なものだった。"}, {"t": 631.35, "x": "外事課長は捜査の材料を正直に並べている。"}, {"t": 634.2666666666667, "x": "現場の指紋、置いていった物、若干の目撃者。"}, {"t": 637.5833333333334, "x": "そして金大中の簡単な供述書。"}, {"t": 639.9333333333333, "x": "これに新聞などの一般の情報を足して進めていると。"}, {"t": 643.3333333333334, "x": "材料が少ないって自分で言ってるのね。"}, {"t": 645.8333333333334, "x": "「非常に限られております」と答えている。"}, {"t": 648.9666666666667, "x": "供述に船が出てくる以上、船を洗う必要がある。"}, {"t": 652.1833333333333, "x": "警察が切り取った時間は、\n8日の正午から9日の夜12時まで。"}, {"t": 656.45, "x": "全国の119の港を対象にした。"}, {"t": 659.1333333333333, "x": "その36時間に韓国へ向けて出た船が35隻あった。"}, {"t": 663.2, "x": "35隻を全部調べたの？"}, {"t": 665.2666666666667, "x": "全国の府県警察に、割り出しを指示している。"}, {"t": 668.25, "x": "長官は、いくらか不審な船も見つかったと話した。"}, {"t": 671.5333333333333, "x": "ただ「確実な線まで至っておらない」とも続けた。"}, {"t": 675.0, "x": "怪しいのはあったけど、決め手が無かったのね。"}, {"t": 677.7833333333333, "x": "半年後の答弁では、海上保安庁と\n協力して36隻を調べたとある。"}, {"t": 682.6, "x": "結論は同じで、はっきりした線は出ていない。"}, {"t": 685.5166666666667, "x": "数字が1つ増えてるわね。"}, {"t": 687.35, "x": "1隻増えた理由は答弁には出てこない。"}, {"t": 689.6833333333333, "x": "ここは答弁の数字をそのまま置いておく。"}, {"t": 692.6833333333333, "x": "船の前に車がある。"}, {"t": 694.1666666666666, "x": "供述どおりなら、地下駐車場から車で出たはずだ。"}, {"t": 697.45, "x": "警察は、連れ去りを午後1時30分ごろと見た。"}, {"t": 700.6166666666667, "x": "幅を取って、午後0時40分から3時16分までを調べる。"}, {"t": 704.55, "x": "その間に地下駐車場を出た車が30台あった。"}, {"t": 707.8666666666667, "x": "30台ならすぐ当たれそうね。"}, {"t": 709.8666666666667, "x": "そう思うだろう。ところが記録が足りなかった。"}, {"t": 712.5833333333334, "x": "控えてあったのは、ナンバーの下4けただけだった。"}, {"t": 715.8, "x": "下4けただけ？"}, {"t": 717.1333333333333, "x": "地名もひらがなも分からない。"}, {"t": 718.85, "x": "同じ下4けたの車は、全国にいくらでもある。"}, {"t": 721.9833333333333, "x": "警備局長の答弁では、調べた車は約8500台。"}, {"t": 725.9, "x": "30台を探すのに8500台……。"}, {"t": 728.4, "x": "1台ずつ持ち主を当たって、\n無関係なものを消していく。"}, {"t": 731.8833333333333, "x": "事件の16日後の時点で、30台のうち\n15台が無関係と分かった。"}, {"t": 736.55, "x": "4日後には16台まで消えている。"}, {"t": 738.6833333333333, "x": "そうして最後に残った番号が「2077」だった。"}, {"t": 742.4, "x": "どうしてその番号が残ったの？"}, {"t": 744.4666666666667, "x": "その時間帯に出た車のうち、いちばん疑いが濃かった。"}, {"t": 747.9666666666667, "x": "外事課長の説明では、出たのは午後1時19分ごろ。"}, {"t": 751.4666666666667, "x": "連れ去りの時刻といちばん近い車だ。"}, {"t": 753.85, "x": "ただ、2077の車は都内だけで161台あった。"}, {"t": 757.8333333333334, "x": "全国では1219台になる。"}, {"t": 760.2666666666667, "x": "また何百台もの話になるのね。"}, {"t": 762.6166666666667, "x": "局長は、さらに1300台余りを\n手配して当たったと答えた。"}, {"t": 766.6333333333333, "x": "時間をかけて、ほとんどの2077が消えていった。"}, {"t": 769.9833333333333, "x": "残ったのは、品川ナンバーの1台だけだった。"}, {"t": 773.6, "x": "その品川の1台は誰の車だったの？"}, {"t": 776.3, "x": "横浜にある韓国の領事館の、副領事の車だった。"}, {"t": 780.0666666666667, "x": "領事館の……。"}, {"t": 781.0833333333334, "x": "ここで駐車場の受付係の話が効いてくる。"}, {"t": 784.1, "x": "外事課長が11月の委員会で明かした証言だ。"}, {"t": 787.2166666666667, "x": "午後1時19分ごろ、2077の車が出口に来た。"}, {"t": 791.0666666666667, "x": "受付係は駐車券を受け取り、時刻を打とうとした。"}, {"t": 794.45, "x": "ところが車は止まらずに走り出した。"}, {"t": 796.8166666666667, "x": "おい待て、と2度呼び止めたが止まらなかった。"}, {"t": 799.5666666666667, "x": "急いでたのね。"}, {"t": 800.7, "x": "車には4人か5人が乗っていた。"}, {"t": 802.8333333333334, "x": "そして後ろの座席の床に、\n1人が横にされていたようだと。"}, {"t": 806.6833333333333, "x": "床に……。"}, {"t": 807.4666666666667, "x": "助手席の人物は、例の一等書記官に\n似ていたとも話した。"}, {"t": 811.5333333333333, "x": "一等書記官？"}, {"t": 812.6666666666666, "x": "これは次の章でくわしく話す。"}, {"t": 814.5333333333333, "x": "大使館の外交官のことだ。"}, {"t": 816.4833333333333, "x": "ただこの証言には前の段階があった。"}, {"t": 818.8666666666667, "x": "受付係はそれまで4回聴取を受けていた。"}, {"t": 821.7333333333333, "x": "その4回とも話は違っていた。"}, {"t": 823.9333333333333, "x": "クリーム色のコロナで、2人しか乗っていなかった、と。"}, {"t": 827.2833333333333, "x": "どうして話が変わったの？"}, {"t": 829.1, "x": "本当のことを言うと、自分の身に危険が及ぶ。"}, {"t": 832.0166666666667, "x": "そう心配して話を控えていたという。"}, {"t": 834.4, "x": "警察は証人を守るため、名前も住所も伏せた。"}, {"t": 837.7333333333333, "x": "怖かったのね……。"}, {"t": 838.9333333333333, "x": "それでも警察は、この車だと断定していない。"}, {"t": 841.9333333333333, "x": "外事課長は理由を3つ挙げた。"}, {"t": 843.9, "x": "1つ、その車が当日どこにいたかを調べられていない。"}, {"t": 847.4, "x": "2つ、色が違う。証言は\nクリーム色、実際は銀に近い灰色。"}, {"t": 851.75, "x": "3つ、副領事がその車に乗っていたという証言は無い。"}, {"t": 855.35, "x": "決め手があと一歩足りないのね。"}, {"t": 857.2833333333333, "x": "しかもその車はすでに廃車になっていた。"}, {"t": 859.85, "x": "別の館員の持ち物になり、別のナンバーがついていた。"}, {"t": 863.2333333333333, "x": "副領事本人も、9月5日付で日本を離れている。"}, {"t": 866.6666666666666, "x": "局長は、捜査は「この段階で\nとまらざるを得なく」なったと答えた。"}, {"t": 871.6333333333333, "x": "車の次は大阪と思われる場所だ。"}, {"t": 873.9, "x": "金大中は、しばらく閉じ込められた\n場所のことも話していた。"}, {"t": 877.5833333333334, "x": "車庫からエレベーターで上へ上がれるアパート。"}, {"t": 879.8666666666667, "x": "車庫と上の階が、エレベーターで\nつながった建物ということだ。"}, {"t": 883.5166666666667, "x": "「アンの家」という言い方も出てきたという。"}, {"t": 885.9666666666667, "x": "アンの家？　名前だけ分かってるのね。"}, {"t": 888.2666666666667, "x": "警察は、似た作りの建物と似た名前の建物を探した。"}, {"t": 892.15, "x": "当たった数は千軒あまり。"}, {"t": 893.8, "x": "ある程度疑いのある場所は出てきたと局長は話した。"}, {"t": 897.05, "x": "それでも、ここだと確定するには至らなかった。"}, {"t": 900.1333333333333, "x": "船に乗る前のことは？"}, {"t": 901.6833333333333, "x": "海岸からモーターボートで\n船まで行った、という供述がある。"}, {"t": 905.15, "x": "そこで大阪、神戸、和歌山の方面のボートを調べた。"}, {"t": 908.6833333333333, "x": "その数は約1800台に及ぶ。"}, {"t": 911.0666666666667, "x": "1800台って全部？"}, {"t": 912.7833333333333, "x": "局長は「全部いたしました」と答えている。"}, {"t": 915.6833333333333, "x": "けれどもこれも確定には至っていない。"}, {"t": 917.9166666666666, "x": "東名高速の通り道も調べたが、はっきりしなかった。"}, {"t": 921.5333333333333, "x": "車も船も家も、どれも最後の1つが決まらないのね。"}, {"t": 925.1166666666667, "x": "これが東京で積み上げた捜査の、\n半年たった時点の姿だ。"}, {"t": 929.0, "x": "何千という候補をつぶして、\nどれも最後で止まっている。"}, {"t": 932.8333333333334, "x": "ここで、2210号室の最後の遺留品に戻る。"}, {"t": 936.15, "x": "指紋だ。"}, {"t": 936.8666666666667, "x": "9月7日、衆議院の本会議で国家公安委員長が答えた。"}, {"t": 940.8166666666667, "x": "容疑を裏付けるものは何か、と問われての答弁だ。"}, {"t": 943.9333333333333, "x": "委員長は3つを挙げた。"}, {"t": 945.4166666666666, "x": "1つ目。2210号室に残っていた指紋。"}, {"t": 948.5, "x": "これが在日韓国大使館の一等書記官の指紋と\n一致した。"}, {"t": 952.5166666666667, "x": "大使館の人の指紋があの部屋に？"}, {"t": 954.8166666666667, "x": "委員長は「決定的な一つの証拠」と呼んでいる。"}, {"t": 958.0666666666667, "x": "2つ目。エレベーターの中での目撃だ。"}, {"t": 960.6666666666666, "x": "連れて行かれる人が助けてくれと叫んだ。"}, {"t": 963.25, "x": "その一団の中に\nこの書記官がいるのを見た、という人が現れた。"}, {"t": 967.2666666666667, "x": "3つ目がさっきの登山用具店だ。"}, {"t": 969.4166666666666, "x": "少年の店員が、10数枚の写真から\n2人連れを指さした。"}, {"t": 973.3666666666667, "x": "その中に書記官の写真があったってこと？"}, {"t": 976.0666666666667, "x": "委員長は、容疑を裏付ける3つ目として挙げている。"}, {"t": 979.1333333333333, "x": "同じ日、外務委員会では警備局長がこう述べた。"}, {"t": 982.3, "x": "指紋が一致すれば犯罪に\n関係があると断定して差し支えない。"}, {"t": 986.1166666666667, "x": "これはあくまで、当時の日本の警察の見方だ。"}, {"t": 989.1833333333333, "x": "韓国側はどう言ったの？"}, {"t": 990.8666666666667, "x": "それは少しあとの章で、韓国の答えとして並べる。"}, {"t": 994.2, "x": "先に警察が取った手続きを見ておこう。"}, {"t": 996.6833333333333, "x": "9月5日、警察はこの書記官に任意の出頭を求めた。"}, {"t": 1000.55, "x": "来たの？"}, {"t": 1001.3166666666667, "x": "来ていない。そして本人は、\nすでに日本にいなかった。"}, {"t": 1004.65, "x": "外務省の局長の答弁では、出国は8月19日。"}, {"t": 1008.5, "x": "事件から11日後……。"}, {"t": 1009.9, "x": "出頭を頼む前に、もういなかったのね。"}, {"t": 1012.6166666666667, "x": "そういう順番になる。"}, {"t": 1013.95, "x": "のちに警備局長は、拉致したのは6人だと答えている。"}, {"t": 1017.4666666666667, "x": "その6人の中に、この書記官がいたと確信したと。"}, {"t": 1021.05, "x": "残りの5人は？"}, {"t": 1022.2833333333333, "x": "「まだ確定を見るに至っておりません」。"}, {"t": 1024.2, "x": "事件の半年後の答弁だ。"}, {"t": 1026.7666666666667, "x": "出頭してくれないなら捕まえられないの？"}, {"t": 1029.3, "x": "相手は外交官だ。ここで大きな壁がある。"}, {"t": 1031.9833333333333, "x": "34年後、官房長官が当時のことを国会で振り返った。"}, {"t": 1035.9, "x": "書記官からは、日本での事情聴取を\n認めてもらえなかった。"}, {"t": 1039.5333333333333, "x": "「外交官特権ということもあったのかもしれません」。"}, {"t": 1042.6, "x": "かもしれない、なのね。"}, {"t": 1044.1666666666667, "x": "官房長官も言い切ってはいない。"}, {"t": 1046.0666666666666, "x": "ただ結果として、日本は本人から話を聞けなかった。"}, {"t": 1049.6166666666666, "x": "だから韓国の公の力が日本で\n使われたという確証も取れなかった。"}, {"t": 1054.0333333333333, "x": "官房長官は当時の認識をこう言っている。"}, {"t": 1056.6666666666667, "x": "書記官が犯行に加担した容疑が濃厚になった。"}, {"t": 1059.7333333333333, "x": "日本の主権が侵害された可能性が強くなった。"}, {"t": 1062.9333333333334, "x": "可能性が強い、までだったのね。"}, {"t": 1065.1833333333334, "x": "そうだ。確かめる手段が、日本の手には無かった。"}, {"t": 1068.5333333333333, "x": "主権の侵害ってどういうこと？"}, {"t": 1070.55, "x": "よその国の役人が、日本の中で勝手に力を使うことだ。"}, {"t": 1074.5333333333333, "x": "もしそうなら、事件は1人の誘拐では済まない。"}, {"t": 1077.4666666666667, "x": "国と国の問題になる。"}, {"t": 1079.2166666666667, "x": "だから国会で、あんなに取り上げられたのね。"}, {"t": 1082.5, "x": "あんなにってどのくらい？"}, {"t": 1083.9333333333334, "x": "国会の会議録を、金大中という名前で引いてみた。"}, {"t": 1087.2, "x": "1973年8月1日から12月31日まで。"}, {"t": 1091.5666666666666, "x": "名前が出た発言は1275件あった。"}, {"t": 1094.6333333333334, "x": "5か月で1275件？"}, {"t": 1096.8166666666666, "x": "本会議でも、外務、法務、\n地方行政の委員会でも出てくる。"}, {"t": 1100.7666666666667, "x": "運輸の委員会では、\n海上保安庁の長官まで答えていた。"}, {"t": 1104.3666666666666, "x": "海の見張りはどうだったのか、と問われての答弁だ。"}, {"t": 1107.3333333333333, "x": "長官は、入った情報がばく然としていたと話した。"}, {"t": 1110.6833333333334, "x": "だから海の警戒を厳しくしろ、という\n程度の指示しか出せなかったと。"}, {"t": 1114.9333333333334, "x": "いろんな所で同じ事件の話をしてたのね。"}, {"t": 1117.85, "x": "議員は警察の初動の遅れを何度も突いた。"}, {"t": 1120.4666666666667, "x": "外務省には、韓国にどう向き合うのかを迫った。"}, {"t": 1123.4833333333333, "x": "そして秋の終わりに、政治の側が\n一つの区切りを付ける。"}, {"t": 1127.0166666666667, "x": "区切り？　まだ犯人も決まってないのに？"}, {"t": 1129.5, "x": "その区切りが11月2日の出来事だ。"}, {"t": 1132.7, "x": "11月2日の前に、ソウルで1つの動きがあった。"}, {"t": 1136.1333333333334, "x": "10月26日、金大中が自分で記者会見を開いた。"}, {"t": 1139.9166666666667, "x": "外務省の参事官は、その中身をこう紹介している。"}, {"t": 1143.2666666666667, "x": "いまから自分は自由になった、と宣言したと。"}, {"t": 1146.25, "x": "それまでは自由じゃなかったの？"}, {"t": 1148.1333333333334, "x": "参事官の言葉では、韓国側の捜査のために\n完全な自由が無かった。"}, {"t": 1152.5833333333333, "x": "会見ではもう1つ述べている。"}, {"t": 1154.45, "x": "これまでの行動が日韓の関係に亀裂を\n生んだのなら、本意ではなかったと。"}, {"t": 1159.05, "x": "被害を受けた人のほうが、そう言ったのね……。"}, {"t": 1161.7666666666667, "x": "そうだ。会見のいきさつまでは、答弁は語っていない。"}, {"t": 1165.1, "x": "この会見のあと、日本側は大事な点を確かめている。"}, {"t": 1168.55, "x": "金大中は、国を出ることも含めて自由なのか。"}, {"t": 1171.55, "x": "韓国側の答えは「出国を含めて\n自由が保障されている」だった。"}, {"t": 1176.0333333333333, "x": "じゃあ日本に来て話してもらえるのね。"}, {"t": 1178.3666666666666, "x": "理屈の上ではそうなる。"}, {"t": 1179.8, "x": "ただ旅券を取る手続きは、\nふつうの韓国人と同じだという。"}, {"t": 1183.4833333333333, "x": "この「ふつうと同じ」が、のちに\n議員から問われることになる。"}, {"t": 1187.3, "x": "日本に来たいと言ったら、日本は入れてくれるの？"}, {"t": 1190.2333333333333, "x": "参事官はその点も答えている。"}, {"t": 1192.2666666666667, "x": "旅券を手にして日本の査証を\n申し込めば、日本政府の判断になる。"}, {"t": 1196.4333333333334, "x": "お礼を言いに来たいという人に、\n査証を出さないことはないと思うと。"}, {"t": 1200.8166666666666, "x": "1973年11月2日。"}, {"t": 1203.3666666666666, "x": "韓国の国務総理が日本に来た。"}, {"t": 1205.6333333333334, "x": "携えていたのは韓国の大統領の親書だ。"}, {"t": 1208.5833333333333, "x": "親書って大統領からの手紙ね。"}, {"t": 1210.8166666666666, "x": "そうだ。総理は日本の首相と会談した。"}, {"t": 1213.5166666666667, "x": "外務省の参事官が、韓国の示した\n中身を整理している。"}, {"t": 1217.3, "x": "1つ、親書を携えた総理が謝罪に来た。"}, {"t": 1220.1833333333334, "x": "2つ、例の一等書記官は職を\n解き、捜査して法で処断する。"}, {"t": 1224.3333333333333, "x": "3つ、金大中は出国を含めて\n自由であることを保障する。"}, {"t": 1228.0833333333333, "x": "4つ、二度とこういう事態が\n起きないよう最大の努力をする。"}, {"t": 1231.75, "x": "謝罪っていう言葉は本当に使われたの？"}, {"t": 1234.4, "x": "鋭いな。議員もそこを突いている。"}, {"t": 1236.5666666666666, "x": "参事官の答えは少し回りくどかった。"}, {"t": 1239.1, "x": "遺憾の意は、親書でも会談でも繰り返し表された。"}, {"t": 1242.4166666666667, "x": "その言葉を使ったかどうかは\n別として、内容は陳謝だと。"}, {"t": 1246.2166666666667, "x": "言葉と中身を分けて考えたのね。"}, {"t": 1248.55, "x": "そしてこの決着には、もう1つの前提があった。"}, {"t": 1251.7333333333333, "x": "参事官は、主権の侵害を前提にしていないと述べた。"}, {"t": 1255.3166666666666, "x": "前提にしていない？"}, {"t": 1256.6833333333334, "x": "まだ確かめ切れない段階での、外交の上の解決だと。"}, {"t": 1260.2666666666667, "x": "参事官は、これがベストだと胸を\n張れるものではないとまで言った。"}, {"t": 1264.15, "x": "外務省の人が自分でそう言ったの？"}, {"t": 1266.5, "x": "言っている。\n「いばって言えるようなもの」ではないと。"}, {"t": 1269.2666666666667, "x": "もう1つ、外務省がはっきりさせた点がある。"}, {"t": 1272.1, "x": "刑事事件としては何も決着していない。"}, {"t": 1274.7, "x": "日本も韓国も、捜査は続けるという立場だった。"}, {"t": 1278.0666666666666, "x": "外交では区切って、\n捜査は続く……。二本立てなのね。"}, {"t": 1281.5666666666666, "x": "そうだ。この二本立てが、この先30年以上続いていく。"}, {"t": 1285.9666666666667, "x": "11月2日のあと、警察は韓国からの通報を待った。"}, {"t": 1289.75, "x": "総理は来日の席で約束していた。"}, {"t": 1292.1666666666667, "x": "書記官の容疑を認め、捜査の結果しだいで処分する。"}, {"t": 1295.6, "x": "そしてその結果を日本に知らせる。"}, {"t": 1297.8666666666666, "x": "知らせは来たの？"}, {"t": 1299.0833333333333, "x": "翌年の3月、外事課長が委員会で数字を挙げた。"}, {"t": 1302.5166666666667, "x": "日本から韓国へ、捜査の状況を伝えたのが5回。"}, {"t": 1305.7666666666667, "x": "金大中の来日など、日本の願いを伝えたのが7回。"}, {"t": 1309.35, "x": "合わせて12回。どれも文書で出している。"}, {"t": 1312.0333333333333, "x": "それで返事は？"}, {"t": 1313.1833333333334, "x": "「現在までのところ、回答に接しておりません」。"}, {"t": 1316.1333333333334, "x": "12回出して返事なし……。"}, {"t": 1317.9166666666667, "x": "口頭での催促も、必要なたびにしていたという。"}, {"t": 1321.05, "x": "同じ3月、外務省の局長は\n外交の決着は付いたと答えた。"}, {"t": 1325.2833333333333, "x": "ただ事件そのものの解決は、まだ\n済んでいないとも認めている。"}, {"t": 1329.15, "x": "決着したのに、解決してない。"}, {"t": 1331.2333333333333, "x": "不思議な言い方ね。"}, {"t": 1332.6666666666667, "x": "金大中の出国についても、日本は頼み続けていた。"}, {"t": 1336.1833333333334, "x": "外務省の局長によると、年が明けた\n1月17日と18日にも伝えた。"}, {"t": 1341.2666666666667, "x": "2月13日にも、大使館を通じて\n出国の希望を重ねて申し入れた。"}, {"t": 1345.9666666666667, "x": "それでも、まだ日本には来られなかったのね。"}, {"t": 1348.75, "x": "局長は、いまだに実現しないのは\n非常に残念だと答えている。"}, {"t": 1352.7166666666667, "x": "国と国の区切りと、事件の答えは別物だということだ。"}, {"t": 1356.9833333333333, "x": "1974年8月14日。"}, {"t": 1359.4333333333334, "x": "韓国から知らせが届いた。"}, {"t": 1361.2666666666667, "x": "外務大臣は翌年の国会で、その中身を説明している。"}, {"t": 1365.05, "x": "捜査はしたが、十分な証拠は挙げられなかった。"}, {"t": 1367.9833333333333, "x": "だから捜査を打ち切るというものだった。"}, {"t": 1370.35, "x": "打ち切り？　指紋が出てるのに？"}, {"t": 1372.3166666666666, "x": "日本側も同じところで引っかかった。"}, {"t": 1374.6, "x": "外務大臣の言葉では、\n日本の警察の所見とは「著しく異なる」。"}, {"t": 1379.2, "x": "打ち切りには納得できない、と韓国に伝えた。"}, {"t": 1382.2, "x": "では韓国側はなぜ証拠が無いとしたのか。"}, {"t": 1384.8333333333333, "x": "1975年3月、警察庁長官が\n国会で中身を明かしている。"}, {"t": 1389.6666666666667, "x": "目撃者の2人は、現場で書記官を見ていない。"}, {"t": 1392.6333333333334, "x": "金大中も現場で書記官を見ていない。"}, {"t": 1394.9166666666667, "x": "書記官本人も現場にはいなかったと、\n関わりを否定した。"}, {"t": 1398.6666666666667, "x": "日本の警察とは正反対の話ね。"}, {"t": 1401.2666666666667, "x": "長官は足りない点をはっきり指摘した。"}, {"t": 1403.7166666666667, "x": "遺留指紋の問題、そして車の問題。"}, {"t": 1406.3666666666666, "x": "物の証拠については、何の回答も受けていないと。"}, {"t": 1409.6333333333334, "x": "いちばん大事なところに答えが無いのね。"}, {"t": 1412.1166666666666, "x": "日本は1974年10月25日に、\n口上書という外交の文書を送った。"}, {"t": 1417.4166666666667, "x": "その答えでは納得できない、もっと\n詳しい結果を知らせてくれと。"}, {"t": 1421.3, "x": "外務省の局長がのちにそう説明している。"}, {"t": 1424.6833333333334, "x": "返事が届いたのは、1975年7月22日だった。"}, {"t": 1428.9833333333333, "x": "韓国から日本へ、口上書で示された中身は2つ。"}, {"t": 1432.4166666666667, "x": "1つは捜査の結論。"}, {"t": 1433.9666666666667, "x": "8月14日に一応中断したあとも、\nひそかに取り調べを続けた。"}, {"t": 1438.35, "x": "日本から渡された資料も使った。"}, {"t": 1440.55, "x": "それでも、嫌疑を立証するだけの確証は\n見つからなかった。"}, {"t": 1444.1666666666667, "x": "だから不起訴処分にしたというものだ。"}, {"t": 1446.5333333333333, "x": "起訴しないってことね。"}, {"t": 1448.0833333333333, "x": "もう1つは行政の処分だ。"}, {"t": 1449.9166666666667, "x": "書記官の東京での言動は、\n日本の警察から疑いを受けた。"}, {"t": 1453.8333333333333, "x": "それは国家公務員として資質を欠き、品位にもとる。"}, {"t": 1457.1166666666666, "x": "だから公務員の職をやめさせたと。"}, {"t": 1459.4, "x": "罪には問わないけど、仕事は辞めさせた……。"}, {"t": 1462.1166666666666, "x": "そういう組み合わせだ。"}, {"t": 1463.3833333333334, "x": "外務省の局長によると、それまでは\n大使館の職を解いただけだった。"}, {"t": 1467.6666666666667, "x": "それが1973年の10月23日。"}, {"t": 1470.9333333333334, "x": "今回、公務員としての身分そのものを\n失わせたことになる。"}, {"t": 1474.75, "x": "日本はそれで納得したの？"}, {"t": 1476.65, "x": "外務大臣は、これで終わりにすべきだと判断した。"}, {"t": 1479.8, "x": "理由として挙げたのは、相手も\n主権のある国だということ。"}, {"t": 1483.25, "x": "2つの国の捜査の見方が一致しないとき、\n最後に決める方法は無い。"}, {"t": 1487.7166666666667, "x": "相手の捜査に、\n口を出し続けるわけにはいかないってことね。"}, {"t": 1491.4166666666667, "x": "大臣はさらにこう付け加えている。"}, {"t": 1493.4833333333333, "x": "「この判断の可否につきましては御批判は\nいろいろにあろうかと存じます」。"}, {"t": 1497.65, "x": "批判が来るのは分かってたのね。"}, {"t": 1499.5333333333333, "x": "金大中のほうの自由は、どうなったの？"}, {"t": 1502.0166666666667, "x": "大臣の説明では、韓国で\n選挙違反の事件が持ち上がっていた。"}, {"t": 1506.1, "x": "それが片付いた段階で、出入国を含めて自由にする。"}, {"t": 1509.7333333333333, "x": "口上書を出すときにも、\n韓国の外務部の長官がそう確言したという。"}, {"t": 1514.0833333333333, "x": "日本は、その約束が守られるかに\n重大な関心を持ち続けるとした。"}, {"t": 1518.5, "x": "これが2度目の外交の決着になる。"}, {"t": 1520.75, "x": "のちに官房長官は、1973年と\n1975年の2回だったとまとめた。"}, {"t": 1527.2333333333333, "x": "外交で決着したら警察の捜査も終わり？"}, {"t": 1530.05, "x": "ここから話が二手に分かれる。"}, {"t": 1532.0666666666666, "x": "口上書の5か月後、外事課長が委員会で答えている。"}, {"t": 1535.5, "x": "7月22日のあとも、\nこれまでの捜査の体制は崩していない。"}, {"t": 1539.55, "x": "国内の捜査を中心に、集めた資料を洗い直している。"}, {"t": 1543.0333333333333, "x": "新しい目撃者を見つけることにも力を入れている。"}, {"t": 1546.3, "x": "まだ諦めてなかったのね。"}, {"t": 1548.1166666666666, "x": "「粘り強く捜査をやってまいりたい」と結んでいた。"}, {"t": 1551.05, "x": "ただ時間は過ぎていく。"}, {"t": 1552.5, "x": "のちの答弁によると、\n特別捜査本部は1983年に解散した。"}, {"t": 1557.5833333333333, "x": "事件から10年ね。"}, {"t": 1559.05, "x": "それでも捜査そのものは、警視庁に残された。"}, {"t": 1562.0, "x": "本部が無くなっても、必要な捜査は続けるという形だ。"}, {"t": 1565.8, "x": "誰も捕まらないまま、本部だけが無くなったのね。"}, {"t": 1569.0333333333333, "x": "今回読んだ答弁に、日本の警察が\n誰かを逮捕した話は出てこない。"}, {"t": 1573.4666666666667, "x": "そしてこの事件には、もう1つの大きな転機が来る。"}, {"t": 1576.7, "x": "連れ去られた本人の立場が、すっかり変わるんだ。"}, {"t": 1580.3833333333334, "x": "1998年2月25日。"}, {"t": 1583.0666666666666, "x": "この日、日本の衆議院の予算委員会で\n外務大臣が言った。"}, {"t": 1586.7666666666667, "x": "「本日、韓国金大中新大統領が就任されます」。"}, {"t": 1590.45, "x": "えっ、あの金大中が大統領に？"}, {"t": 1592.7166666666667, "x": "ホテルから連れ去られて、およそ25年後のことだ。"}, {"t": 1595.8333333333333, "x": "外務大臣は事件についてもこう述べた。"}, {"t": 1598.2666666666667, "x": "当時、金大中が精神的にも\n肉体的にも大変な苦痛を受けた。"}, {"t": 1602.6, "x": "それは「想像にかたくありません」と。"}, {"t": 1605.0833333333333, "x": "日本の大臣がそう言ったのね。"}, {"t": 1607.0833333333333, "x": "ただ同じ答弁で、外交の決着は\n今後も尊重するとした。"}, {"t": 1610.95, "x": "当時の両国の首脳が、大局を\n考えて下した判断だからと。"}, {"t": 1615.1666666666667, "x": "決着はそのままってことね。"}, {"t": 1617.15, "x": "では大統領になった本人は、どう考えていたのか。"}, {"t": 1620.3833333333334, "x": "翌月、官房長官が\n日本の政府の受け止めを話している。"}, {"t": 1624.1166666666666, "x": "大統領は、関わった者の責任は\n問わないという考えだ。"}, {"t": 1627.7666666666667, "x": "ただし、真相は明らかにされなければならない。"}, {"t": 1630.6, "x": "そして、この問題を政府どうしで\n取り上げるつもりは無い。"}, {"t": 1633.9666666666667, "x": "責任は問わない。でも真相は知りたい……。"}, {"t": 1636.55, "x": "その2つを並べたのは、被害を受けた本人だった。"}, {"t": 1639.7666666666667, "x": "官房長官は、日本の捜査当局は\n引き続き捜査中だとも答えた。"}, {"t": 1644.8833333333334, "x": "同じ1998年の10月8日。"}, {"t": 1647.7333333333333, "x": "参議院の委員会で、ある議員がこう切り出した。"}, {"t": 1650.5333333333333, "x": "「金大中大統領が先ほど国会で御演説をされた」。"}, {"t": 1653.9333333333334, "x": "日本の国会で演説したの？"}, {"t": 1655.9666666666667, "x": "そうだ。翌日には別の議員も、その演説に触れている。"}, {"t": 1659.6, "x": "国会で聞かせてもらった格調の高い演説だった、と。"}, {"t": 1663.2333333333333, "x": "25年前に東京で連れ去られた\n人が、東京の国会で……。"}, {"t": 1667.1333333333334, "x": "演説の中身は、今回読んだ会議録に本文が無い。"}, {"t": 1670.4833333333333, "x": "だから、何を話したかは\n議員の発言の範囲でしか分からない。"}, {"t": 1674.2666666666667, "x": "確かなのは、その日その場所に立ったということだ。"}, {"t": 1677.4833333333333, "x": "あのホテルとは、どのくらい離れてるのかしら。"}, {"t": 1680.2833333333333, "x": "同じ千代田区の中だ。"}, {"t": 1681.7833333333333, "x": "それでも事件の真相は、まだ国会の記録に出てこない。"}, {"t": 1685.2666666666667, "x": "次に大きく動くのはさらに9年後になる。"}, {"t": 1688.5, "x": "2007年10月24日。"}, {"t": 1690.5333333333333, "x": "韓国の国家情報院に置かれた\n委員会が、報告書を出した。"}, {"t": 1694.3833333333334, "x": "名前は「過去事件の真実究明を通じた発展委員会」。"}, {"t": 1698.1, "x": "国家情報院って？"}, {"t": 1699.55, "x": "韓国の情報機関だ。国会では議員が、\nKCIAの後身と説明している。"}, {"t": 1704.5, "x": "KCIAは、事件の当時にあった\n韓国中央情報部のことだ。"}, {"t": 1708.5333333333333, "x": "その情報院に置かれた委員会が、\n過去の事件を調べた。"}, {"t": 1712.1, "x": "情報機関の中で、昔の事件を調べ直したのね。"}, {"t": 1715.7, "x": "そうだ。その報告書の中身を、\n日本の政府はこうまとめた。"}, {"t": 1719.4666666666667, "x": "金大中事件が、当時のKCIAの部長の指示に\n基づいて行われた。"}, {"t": 1723.9166666666667, "x": "それを明らかにする内容を含むものだと。"}, {"t": 1726.55, "x": "34年たって韓国の側から……。"}, {"t": 1728.9166666666667, "x": "これは同じ年の11月2日、\n内閣の答弁書に書かれた言い方だ。"}, {"t": 1733.3666666666666, "x": "この回では、この言い方より先へは踏み込まない。"}, {"t": 1736.3833333333334, "x": "報告書の細かいところは言わないのね。"}, {"t": 1738.85, "x": "原文を確かめられたのは、\n日本の政府の要約までだからな。"}, {"t": 1742.6, "x": "誰が何をしたかの名前も、ここでは挙げない。"}, {"t": 1745.3166666666666, "x": "確かなのは、当時の情報機関の部長の指示という\n内容が含まれたことだ。"}, {"t": 1750.5166666666667, "x": "報告書が出た日のうちに日本は動いた。"}, {"t": 1752.9666666666667, "x": "外務副大臣が、駐日韓国大使に考えを伝えた。"}, {"t": 1756.6166666666666, "x": "当時の韓国当局が、日本の国内で公の力を使った。"}, {"t": 1760.7666666666667, "x": "そのことは遺憾であると。"}, {"t": 1762.4, "x": "遺憾って、なんだか弱い言葉に聞こえるけど。"}, {"t": 1765.3, "x": "衆議院の議員も、まさにそこを文書で質問している。"}, {"t": 1768.6, "x": "残念、という程度の意味では軽すぎないかと。"}, {"t": 1771.3166666666666, "x": "内閣の答弁書は、この遺憾の意味をこう説明している。"}, {"t": 1774.7166666666667, "x": "抗議をする趣旨だった。"}, {"t": 1776.1666666666667, "x": "極めて残念で、\n見過ごすことはできないという考えを示した。"}, {"t": 1780.0833333333333, "x": "抗議のつもりで言った遺憾なのね。"}, {"t": 1782.2166666666667, "x": "翌日官房長官は参議院でこうも述べた。"}, {"t": 1784.9666666666667, "x": "日本の主権を侵害したという\n意味で、大変遺憾な事件だと。"}, {"t": 1788.8, "x": "1973年には「可能性が強い」だった主権の侵害。"}, {"t": 1793.1, "x": "それを、日本の政府が侵害と言葉にしたことになる。"}, {"t": 1796.55, "x": "34年かけてやっとそこまで来たのね。"}, {"t": 1799.75, "x": "10月30日、韓国の大使が外務大臣と会った。"}, {"t": 1803.3, "x": "翌日、外務大臣は\n衆議院の委員会でいきさつを話している。"}, {"t": 1807.2, "x": "主権を侵害した側は、ふつう3つのことをする。"}, {"t": 1810.2833333333333, "x": "謝ること、二度としないと約束すること。"}, {"t": 1813.0666666666666, "x": "そして元の状態に戻すことだ。"}, {"t": 1815.3666666666666, "x": "元に戻すってどうやって？"}, {"t": 1817.1, "x": "大臣も同じことを言っている。"}, {"t": 1818.9166666666667, "x": "30年前の話で、金大中に日本へ\n戻ってもらうのは現実的ではない。"}, {"t": 1823.6166666666666, "x": "だから陳謝と再発防止の約束を受け止めることにした。"}, {"t": 1827.1166666666666, "x": "外務大臣は、これを新たな\n状況での外交決着と呼んだ。"}, {"t": 1830.9666666666667, "x": "3度目の決着ね。"}, {"t": 1832.5, "x": "答弁書の言い方ではこうなる。"}, {"t": 1834.2833333333333, "x": "韓国政府から陳謝の意が表され、\n再発防止が確約された。"}, {"t": 1838.4166666666667, "x": "それで国際法の上の問題は処理された。"}, {"t": 1841.1166666666666, "x": "じゃあ今度こそ全部終わり？"}, {"t": 1842.7833333333333, "x": "いや。大臣は同じ答弁で、大事なことを付け加えた。"}, {"t": 1846.2666666666667, "x": "「捜査は全く別ですよ」と、\n韓国の大使にはっきり伝えたと。"}, {"t": 1850.4666666666667, "x": "外交は終わっても、捜査は終わってないのね。"}, {"t": 1853.2666666666667, "x": "1973年から変わらない、あの二本立てだ。"}, {"t": 1857.3666666666666, "x": "報告書が出て日本の警察も動いた。"}, {"t": 1859.85, "x": "2007年11月29日、警察は\n韓国政府に捜査共助を求めた。"}, {"t": 1864.9, "x": "捜査共助？"}, {"t": 1865.9333333333334, "x": "国をまたぐ事件で、相手の国に\n捜査の手助けを頼む仕組みだ。"}, {"t": 1869.9333333333334, "x": "翌年の4月、警察庁の警備局長が理由を説明している。"}, {"t": 1874.0166666666667, "x": "真相を明らかにするには、報告書の中身を\n踏まえた捜査が欠かせない。"}, {"t": 1878.3166666666666, "x": "そう判断して要請したと。"}, {"t": 1880.2333333333333, "x": "報告書が新しい手がかりになったのね。"}, {"t": 1882.8166666666666, "x": "局長は捜査の歩みもまとめて話した。"}, {"t": 1885.3666666666666, "x": "警視庁に特別捜査本部を置き、捜査を続けてきた。"}, {"t": 1888.9, "x": "本部は1983年に解散した。"}, {"t": 1891.7833333333333, "x": "それでも警視庁が、必要な捜査を続けている。"}, {"t": 1894.9666666666667, "x": "本部が無くなって、24年たってからの要請なのね。"}, {"t": 1898.4833333333333, "x": "そういう時間の重なり方をしている事件なんだ。"}, {"t": 1901.35, "x": "要請への韓国の答えは、\n今回読んだ答弁には出てこない。"}, {"t": 1904.9833333333333, "x": "局長は「事案の全容解明に向けまして」と\n結んでいる。"}, {"t": 1909.3166666666666, "x": "でもさすがに時効なんじゃないの？"}, {"t": 1911.3333333333333, "x": "そう思うよな。ところが局長はこう答えた。"}, {"t": 1914.0666666666666, "x": "少なくとも関係する被疑者1人について、\n公訴時効は完成していない。"}, {"t": 1918.4833333333333, "x": "警察はそう判断していると。"}, {"t": 1920.5333333333333, "x": "35年近くたってるのに？"}, {"t": 1922.6, "x": "前の年、法務大臣が一般論として\n仕組みを話している。"}, {"t": 1926.2833333333333, "x": "日本で罪を犯した人が\n外国にいる間は、時効が止まる。"}, {"t": 1930.0166666666667, "x": "もちろん、この事件に当てはめた答弁ではない。"}, {"t": 1932.7333333333333, "x": "大臣は個別の事件には答えを\n控えるとしたうえでの話だ。"}, {"t": 1936.5666666666666, "x": "一般論ってことね。"}, {"t": 1938.1, "x": "同じ答弁で大臣はこうも言った。"}, {"t": 1940.1833333333334, "x": "捜査当局は、時効は完成していないという\n思いで捜査を行っている。"}, {"t": 1944.5166666666667, "x": "誰の時効なのかは？"}, {"t": 1945.9833333333333, "x": "答弁は「関係被疑者一名」としか言っていない。"}, {"t": 1949.05, "x": "この回でもそれ以上は言わない。"}, {"t": 1950.9666666666667, "x": "名前を出さないのが、この回の約束だったわね。"}, {"t": 1954.1166666666666, "x": "ああ。国会の答弁で語られた\n範囲が、この回の範囲だ。"}, {"t": 1957.7166666666667, "x": "そして2008年の答弁の時点で、\n時効は終わっていなかった。"}, {"t": 1961.6166666666666, "x": "捜査を閉じたという答弁も、\n今回読んだ範囲には無い。"}, {"t": 1965.5, "x": "ここで残っている穴を数え直してみよう。"}, {"t": 1968.05, "x": "穴？"}, {"t": 1968.6666666666667, "x": "1974年の答弁で、警察は\n拉致した者を6人と見ていた。"}, {"t": 1973.2333333333333, "x": "そのうち確信を得たと答えたのは1人。"}, {"t": 1975.7333333333333, "x": "残る5人は「まだ確定を見るに至っておりません」。"}, {"t": 1978.85, "x": "その5人のことはその後分かったの？"}, {"t": 1981.1166666666666, "x": "日本の国会の答弁で、名前が\n確定したという話は出てこない。"}, {"t": 1985.2166666666667, "x": "2つ目の穴は運んだ道すじだ。"}, {"t": 1987.4, "x": "大阪と思われる場所、アンの家、モーターボート、船。"}, {"t": 1990.7833333333333, "x": "どれも、確定に至っていないと局長は答えていた。"}, {"t": 1994.0166666666667, "x": "3つ目の穴は物の証拠への答えだ。"}, {"t": 1996.35, "x": "指紋と車について、\n韓国側からの回答は無いと長官は言った。"}, {"t": 2000.6166666666666, "x": "そして、それぞれ国の間では決着が付いている……。"}, {"t": 2003.85, "x": "1973年、1975年、そして2007年。"}, {"t": 2008.2833333333333, "x": "外交の区切りは記録の上で3回ある。"}, {"t": 2010.65, "x": "けれど捜査の区切りは、一度も付いていない。"}, {"t": 2013.35, "x": "国と国の話は終わっても、\n事件の答えは残ったままなのね。"}, {"t": 2017.4333333333334, "x": "そうだ。これが「決着していない」という意味になる。"}, {"t": 2021.2666666666667, "x": "ねえ最初の22階の廊下に戻っていい？"}, {"t": 2023.8666666666666, "x": "いいぞ。"}, {"t": 2024.5333333333333, "x": "あの廊下で引き離された、\nもう1人の議員がいたわよね。"}, {"t": 2028.0333333333333, "x": "2212号室に押し戻された人だな。"}, {"t": 2030.8333333333333, "x": "あの人は、すぐ近くで全部見てたはずなのに。"}, {"t": 2033.85, "x": "8月15日には帰国している。"}, {"t": 2036.05, "x": "党首も11日に日本を離れ、\n約束の16日には来なかった。"}, {"t": 2040.4833333333333, "x": "いちばん近くにいた人たちの話が、\n日本の警察には残らなかったのね。"}, {"t": 2045.2333333333333, "x": "残ったのは、部屋に置いていかれた物のほうだった。"}, {"t": 2048.2166666666667, "x": "7発入りの弾倉、リュックサック\n3個、唾液のついていない小びん。"}, {"t": 2052.233333333333, "x": "吸い殻、ちり紙、パイプ。そして部屋に残った指紋。"}, {"t": 2055.8333333333335, "x": "物は嘘をつかない、だっけ。"}, {"t": 2057.7833333333333, "x": "ああ。ただ物は自分では何も話さない。"}, {"t": 2060.266666666667, "x": "話を聞きたかった人たちは、海の向こうにいた。"}, {"t": 2063.3333333333335, "x": "外交官の身分の壁があり、国と国の約束もあった。"}, {"t": 2066.85, "x": "だから日本の警察は、物から\n一歩ずつ詰めるしかなかった。"}, {"t": 2070.7166666666667, "x": "8500台の車と、1800台のボートと、千軒のアパート。"}, {"t": 2075.25, "x": "どれも警察が1つずつ当たって、消していった候補だ。"}, {"t": 2078.65, "x": "そうして積んだ記録は、国会の会議録に残っている。"}, {"t": 2081.983333333333, "x": "今回はその答弁だけを順番に読んできた。"}, {"t": 2084.766666666667, "x": "韓国の報告書が出たのは、34年後だったわね。"}, {"t": 2088.3333333333335, "x": "それでも、日本の捜査が閉じたという答弁は無い。"}, {"t": 2091.35, "x": "2008年の時点で、少なくとも\n1人の時効は完成していなかった。"}, {"t": 2095.7833333333333, "x": "1973年8月8日、午後1時30分ごろの22階の廊下。"}, {"t": 2100.883333333333, "x": "あの廊下に誰がいたのか、\n記録はまだ全部を埋めていない。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
