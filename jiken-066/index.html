<script>
const D={"name": "066", "file": "066_編集用", "dur": 2162.5833125, "segs": [], "subs": [{"t": 0.0, "x": "一九八九年十一月七日の夜。"}, {"t": 2.9833333333333334, "x": "横浜市磯子区のマンションの一室で、\nドアが開けられた。"}, {"t": 6.316666666666666, "x": "玄関に、履物がそろえて置いてあった。"}, {"t": 8.883333333333333, "x": "おむつが、全部たたんでしまってあった。"}, {"t": 11.233333333333333, "x": "かぎ。財布。手帳。預金通帳。"}, {"t": 13.5, "x": "印鑑。キャッシュカード。"}, {"t": 14.85, "x": "クレジットカード。"}, {"t": 16.0, "x": "それが全部、部屋の中にそろっていた。"}, {"t": 18.583333333333332, "x": "全部？"}, {"t": 19.3, "x": "ああ。全部だ。"}, {"t": 20.383333333333333, "x": "郵便受けには、十一月四日付以降の新聞が、\nそのまま残っていた。"}, {"t": 24.933333333333334, "x": "この部屋に住んでいた三人は、いなかった。"}, {"t": 27.533333333333335, "x": "弁護士と、その妻。そして、一歳四か月の長男。"}, {"t": 31.216666666666665, "x": "この日から、三人が見つかるまでに六年かかる。"}, {"t": 34.416666666666664, "x": "六年。"}, {"t": 35.2, "x": "その六年のあいだ、この件は\n「失踪事件」という名前で扱われた。"}, {"t": 39.583333333333336, "x": "そして遺族は、道を歩いていて、こう言われ続けた。"}, {"t": 42.81666666666667, "x": "「何で夜逃げしたんだ」と。"}, {"t": 44.56666666666667, "x": "夜逃げ？"}, {"t": 45.333333333333336, "x": "ああ。それが、六年のあいだ\n遺族が言われ続けた言葉だ。"}, {"t": 48.86666666666667, "x": "誰がやったか、ではない。"}, {"t": 50.5, "x": "なぜ「失踪」という名前だったのか。\nなぜ六年かかったのか。"}, {"t": 54.45, "x": "先に断っておく。"}, {"t": 55.8, "x": "この事件は、実行した人物が裁判で\n有罪と認定され、判決も確定している。"}, {"t": 61.15, "x": "だが私は、この回で個人の名前を出さない。"}, {"t": 63.95, "x": "教団の名前も出さない。"}, {"t": 65.38333333333334, "x": "関係者にはご存命の方がいる。"}, {"t": 67.5, "x": "発見されたときの三人の状況も話さない。"}, {"t": 70.35, "x": "私が使うのは、国会会議録に\n残っている質問と答弁だけだ。"}, {"t": 74.63333333333334, "x": "誰でも無料で読める\n記録の中だけで、この六年をたどる。"}, {"t": 78.83333333333333, "x": "坂本堤さん。横浜法律事務所に\n所属する弁護士だった。"}, {"t": 82.93333333333334, "x": "一九八九年の国会で、警察庁はこう説明している。"}, {"t": 87.13333333333334, "x": "「失踪者の坂本堤さんは横浜法律事務所に\n所属する弁護士さんでありまして」"}, {"t": 92.23333333333333, "x": "「宗教団体の関係者と交渉するなどの弁護活動を\n行っておるということは承知いたしております」"}, {"t": 98.11666666666666, "x": "宗教団体と交渉する弁護活動。"}, {"t": 100.66666666666667, "x": "そうだ。当時、ある新しい宗教団体に子どもが入信して\n帰ってこない、という相談が各地で起きていた。"}, {"t": 107.15, "x": "その親たちが集まって、\n被害者の会をつくろうとしていた。"}, {"t": 110.68333333333334, "x": "坂本さんは、その相談を\n受けていた側の弁護士だった。"}, {"t": 114.2, "x": "国会では、こう述べられている。"}, {"t": 116.11666666666666, "x": "「入信した青少年の家族で\nつくっている被害者の会に協力をして」"}, {"t": 120.26666666666667, "x": "「親の依願を受けて同教団との交渉の窓口役に\n当たっていた人です」"}, {"t": 124.65, "x": "親から頼まれた窓口。"}, {"t": 126.4, "x": "ああ。だから、団体の側とは\n正面から向き合う立場だった。"}, {"t": 130.11666666666667, "x": "同じ発言の中に、こういう一文もある。"}, {"t": 132.76666666666668, "x": "「坂本弁護士の自宅の周辺で坂本弁護士を\n批難するビラがまかれたこともあったそうです」"}, {"t": 138.36666666666667, "x": "自宅の周りで。"}, {"t": 139.63333333333333, "x": "そう報道されている、という形で国会に出てきた話だ。"}, {"t": 143.25, "x": "妻は、都子さん。長男は一歳四か月だった。"}, {"t": 146.45, "x": "この年齢は、\n一九八九年十一月三十日の参議院法務委員会で、\n質問した議員が述べている。"}, {"t": 153.4, "x": "「奥さんと一歳四カ月の子供とともに突然姿を消して」"}, {"t": 157.18333333333334, "x": "私は、この長男の名前を出さない。"}, {"t": 159.56666666666666, "x": "この一家がいなくなったのは、\n弁護士の仕事が理由だった可能性がある、と\n当時から国会で言われていた。"}, {"t": 165.68333333333334, "x": "ある議員は、こう言っている。"}, {"t": 167.25, "x": "「弁護活動が大きな原因となってこういう状況になり、\n家族まで巻き込まれた事件であるとするならば」"}, {"t": 173.06666666666666, "x": "「基本的人権の大変大きな侵害の問題になろうかと\n思っております」"}, {"t": 177.45, "x": "「まさに民主主義の根幹を揺さぶる重要な\n事件でないかと思っておるわけでございます」"}, {"t": 182.4, "x": "民主主義の根幹。"}, {"t": 183.85, "x": "ああ。一九八九年十一月二十一日、\n衆議院法務委員会での発言だ。"}, {"t": 189.96666666666667, "x": "坂本さんは、いなくなる直前まで何をしていたのか。"}, {"t": 193.33333333333334, "x": "これは、六年後の国会で\n本人のメモが読み上げられている。"}, {"t": 196.91666666666666, "x": "一九九五年十一月八日、\n衆議院の宗教法人に関する特別委員会だ。"}, {"t": 202.45, "x": "質問した議員は、こう前置きしている。"}, {"t": 204.86666666666667, "x": "「彼は非常に緻密な弁護士で、私は彼の\nこの問題に関するメモをずっと見ました」"}, {"t": 209.96666666666667, "x": "六月二十一日。「都」とだけ\n書いてある。東京都のことだ。"}, {"t": 213.86666666666667, "x": "六月二十八日。「都にＴＥＬ」。"}, {"t": 215.83333333333334, "x": "電話をかけた記録だ。"}, {"t": 217.36666666666667, "x": "その横に、こう書いてある。"}, {"t": 219.05, "x": "「都の慣行で受理の段階で審査する 受理すれば認証」"}, {"t": 222.46666666666667, "x": "「なかなか受理しなかった いろいろ苦情があったので \n二〇数件親の苦情が寄せられている」"}, {"t": 227.78333333333333, "x": "親の苦情が二十数件。"}, {"t": 229.48333333333332, "x": "ああ。東京都に、それだけの数の苦情が届いていた。"}, {"t": 232.78333333333333, "x": "八月三日。「都庁 相談あれば都庁にきて」。"}, {"t": 235.91666666666666, "x": "八月二十四日。「都の山本氏よりＴＥＬ \n許可せざるを得ないかも知れない」。"}, {"t": 240.45, "x": "許可せざるを得ない？"}, {"t": 241.75, "x": "そう書いてある。"}, {"t": 242.7, "x": "そして八月二十九日、その団体は\n東京都から宗教法人として認証された。"}, {"t": 247.9, "x": "坂本さんは、認証されないように\n動いていた。だが認証された。"}, {"t": 251.95, "x": "十月二十一日、坂本さんの指導で、\n被害者の会が設立される。"}, {"t": 256.56666666666666, "x": "認証を取り消してもらう方向に\n切り替えた、と国会では説明されている。"}, {"t": 260.9, "x": "その少し前、九月二十日にも動きがあった。"}, {"t": 263.81666666666666, "x": "坂本さんは、京都大学に問い合わせをしていた。"}, {"t": 266.8666666666667, "x": "団体が出版していた本に、京大の医学部で\n研究したという記述があったからだ。"}, {"t": 271.9166666666667, "x": "返ってきた答えは、そんな研究は\n全くない、というものだった。"}, {"t": 276.0, "x": "全くない。"}, {"t": 277.0, "x": "ああ。国会では、こう言われている。"}, {"t": 279.06666666666666, "x": "「これは教団の詐欺的な手法を\n完膚なきまで暴くことになりました」"}, {"t": 283.01666666666665, "x": "そして十月三十一日、坂本さんは\n団体の側の人たちと激しくやり合っている。"}, {"t": 288.31666666666666, "x": "その三日後が、十一月三日だ。"}, {"t": 291.31666666666666, "x": "一九八九年十一月七日、午後十時半ごろ。"}, {"t": 295.1166666666667, "x": "坂本さんのお母さんが、所轄の警察署に届け出た。"}, {"t": 298.71666666666664, "x": "一九八九年十一月二十一日、\n衆議院法務委員会での警察庁の答弁を読む。"}, {"t": 304.65, "x": "「本年の十一月七日午後十時半ごろ、"}, {"t": 307.1166666666667, "x": "横浜市居住の弁護士の坂本堤さんの家族三名が\n行方不明となっている旨を」"}, {"t": 312.3666666666667, "x": "「失踪者の坂本さんのお母さんから所轄署に"}, {"t": 315.03333333333336, "x": "届け出をされたことによりまして\n認知したところでございます」"}, {"t": 318.6333333333333, "x": "お母さんから。"}, {"t": 319.73333333333335, "x": "ああ。所属していた弁護士会からも\n届け出があった、と別の答弁で説明されている。"}, {"t": 324.85, "x": "「十一月四日付以降の新聞が\n郵便受けに残されていたことなどから」"}, {"t": 329.18333333333334, "x": "「十一月三日ごろに所在不明となっていることが\n判明したところでございます」"}, {"t": 333.8833333333333, "x": "新聞の日付で、いなくなった日が分かったのね。"}, {"t": 336.98333333333335, "x": "そうだ。十一月四日の朝刊が\n取られていない。だから、その前の晩までさかのぼる。"}, {"t": 342.2, "x": "翌十一月八日、警察本部の応援を得て、\n部屋を詳しく調べた。"}, {"t": 346.5833333333333, "x": "「通常の外出とは違う状況であることが\n判明いたしましたため」"}, {"t": 350.5, "x": "「即約六十名の体制で、非公開の\nもとではありますが、強力な捜査を展開した」"}, {"t": 355.81666666666666, "x": "この時点では、まだ公開していない。\nそして十一月十五日に切り替わる。"}, {"t": 360.3833333333333, "x": "「御家族の同意を得まして\n本失踪事案を公開捜査に付する」"}, {"t": 364.06666666666666, "x": "公開捜査。"}, {"t": 365.1666666666667, "x": "ああ。写真を出して、広く情報を求める形にした。"}, {"t": 368.68333333333334, "x": "その二日後、十一月十七日に捜査本部ができる。"}, {"t": 372.28333333333336, "x": "「同十七日には百十名の体制に\nよる捜査本部を設置いたしまして」"}, {"t": 376.56666666666666, "x": "この捜査本部の人数は、答弁によって数字が違う。"}, {"t": 379.9, "x": "百十名と言っている答弁がある。"}, {"t": 381.76666666666665, "x": "百二十名と言っている答弁もある。"}, {"t": 383.98333333333335, "x": "総理大臣は、六年後に\n「百数十名から成る捜査本部」と述べている。"}, {"t": 388.8, "x": "どれが正しいの？"}, {"t": 390.03333333333336, "x": "私には決められない。"}, {"t": 391.3, "x": "国会の記録には、この四つの数字が全部残っている。"}, {"t": 394.81666666666666, "x": "分かるのは、百人規模の態勢がすぐに\n組まれた、というところまでだ。"}, {"t": 399.5833333333333, "x": "この捜査本部の名前は「失踪事件」だった。"}, {"t": 402.6333333333333, "x": "六年後、警察庁の刑事局長がこう答えている。"}, {"t": 405.95, "x": "「十七日に、失踪事件という名前でありますが、\n百二十名からの捜査本部を設置して捜査を開始した」"}, {"t": 412.6, "x": "失踪事件、という名前。"}, {"t": 414.4166666666667, "x": "ああ。事件ではなく、失踪。"}, {"t": 416.3833333333333, "x": "では、事件と失踪は何が違うのか。"}, {"t": 418.9166666666667, "x": "一九八九年十一月十七日、\n警察庁の刑事局長はこう言っている。"}, {"t": 424.2, "x": "「これまでの捜査では、この弁護士の方が犯罪に"}, {"t": 427.1, "x": "巻き込まれていると直接認められるような\n材料はまだ入手に至っておりません」"}, {"t": 431.4, "x": "「けれども、小さい子供さんを連れて\n御夫婦で家出をされるというふうな\n理由もないようでございまして」"}, {"t": 436.65, "x": "「何らかの犯罪に巻き込まれた可能性も考えられる」"}, {"t": 439.93333333333334, "x": "可能性は考えられる、だけど。"}, {"t": 442.1, "x": "そうだ。「直接認められる材料」がない。"}, {"t": 444.8, "x": "誰かに連れ去られたという\n直接の証拠が、その時点では無かった。"}, {"t": 448.85, "x": "だから制度の上では\n「行方不明者」の扱いから始まる。"}, {"t": 452.53333333333336, "x": "一方で、当日の国会には、まったく\n違う言い方も記録されている。"}, {"t": 456.8, "x": "質問した議員は、こう言っている。"}, {"t": 458.9, "x": "「坂本弁護士の所属している横浜法律事務所では、"}, {"t": 462.1333333333333, "x": "あれは失踪ではなくて\n拉致だという言い方をしています」"}, {"t": 465.35, "x": "失踪じゃなくて、拉致。"}, {"t": 467.06666666666666, "x": "ああ。同じ日の、同じ委員会でのやりとりだ。"}, {"t": 469.85, "x": "現場を知っている同僚の弁護士たちは、\n最初から「拉致だ」と言っていた。"}, {"t": 474.31666666666666, "x": "十三日後、別の議員がこう述べている。"}, {"t": 476.8666666666667, "x": "「単なる失踪事件というそういうものじゃなくて」"}, {"t": 479.55, "x": "「本人自身が失踪しなきゃならぬというそういう状況は"}, {"t": 482.2, "x": "一切ないという状況も明らかな\nもとで起こった事件ですから」"}, {"t": 486.0, "x": "「何らかの事件に関係をして、その意に反して\n拉致されたという意味での重大な事件だ」"}, {"t": 491.0833333333333, "x": "これが、一九八九年十一月三十日の\n参議院法務委員会だ。"}, {"t": 495.9, "x": "つまり、事件から一か月も経たないうちに、\n国会では「これは拉致だ」と言われている。"}, {"t": 501.1166666666667, "x": "それでも、名前は「失踪事件」のままだった。"}, {"t": 504.8666666666667, "x": "一九九五年十一月八日、\n衆議院宗教法人に関する特別委員会。"}, {"t": 510.1333333333333, "x": "「履物がそろっているのです」"}, {"t": 511.93333333333334, "x": "「おむつも全部たたんでしまってあるのです」"}, {"t": 514.2333333333333, "x": "「かぎ、財布、手帳、預金通帳、\n印鑑、キャッシュカード、\nクレジットカード、みんなそろっています」"}, {"t": 520.25, "x": "「何らかの形で、みずからの意思で家を\n出るということならば、あり得ないものが」"}, {"t": 524.7333333333333, "x": "「持っていかなければならぬものが\n全部そろっているのですよ」"}, {"t": 527.9166666666666, "x": "「友人、家族も、だれも家出しなければならない\n理由は全く考えられない」"}, {"t": 532.35, "x": "「何で失踪ということにしたのですか」"}, {"t": 534.75, "x": "何で失踪ということにしたのですか。"}, {"t": 537.1333333333333, "x": "ああ。この質問が、六年後に国会でされている。"}, {"t": 540.3, "x": "現場には、もう二つ、報道されていたものがある。"}, {"t": 543.4, "x": "一つは、血痕だ。"}, {"t": 544.9, "x": "一九八九年十一月二十一日、議員はこう述べている。"}, {"t": 549.1333333333333, "x": "「きのうあたりの報道によりますと、血痕、血が\n出ておりまして、その血が壁についておった」"}, {"t": 554.4166666666666, "x": "「こういうようなことから見ると、相当な抵抗、\n乱暴が推測されるというような状況であります」"}, {"t": 560.0, "x": "壁に。"}, {"t": 560.7166666666667, "x": "これは、報道を引いた議員の発言だ。"}, {"t": 562.9833333333333, "x": "私はここから先は話さない。"}, {"t": 565.1, "x": "もう一つが、バッジだ。"}, {"t": 566.7166666666667, "x": "部屋に、ある宗教団体のバッジが落ちていた。"}, {"t": 569.5333333333333, "x": "これも一九八九年十一月十七日の質問の中に出てくる。"}, {"t": 574.2, "x": "「自宅には血痕とともに教団のバッジが\n落ちていたとも報道されています」"}, {"t": 578.5, "x": "このバッジは、あとで決定的な意味を持つ。"}, {"t": 581.1833333333333, "x": "それから、無くなっていたものもある。"}, {"t": 583.35, "x": "十一月二十九日、議員は警察にこう求めている。"}, {"t": 586.75, "x": "「現場からなくなったと報道されている\nパジャマとか布団などの色とか柄とか」"}, {"t": 591.0666666666667, "x": "「こういうものは\n知らせてもらってもいいのではないか」"}, {"t": 593.8166666666667, "x": "パジャマと布団が無かったの？"}, {"t": 595.6666666666666, "x": "そう報道されている、という形で議員が述べている。"}, {"t": 598.6833333333333, "x": "ただし私が調べた範囲では、警察がその色や\n柄を答えた記録は見つからなかった。"}, {"t": 603.8666666666667, "x": "だから、それ以上は言わない。"}, {"t": 606.2666666666667, "x": "さっき見たメモに、東京都への苦情が\n「二〇数件」とあった。"}, {"t": 610.1333333333333, "x": "子どもが入信して帰ってこない、という\n相談が、行政に届いていた。"}, {"t": 614.35, "x": "だが、行政には何もできなかった。"}, {"t": 616.6833333333333, "x": "六年後、この点について\n文部大臣がはっきり答えている。"}, {"t": 620.3, "x": "一九九五年十一月二日、\n衆議院宗教法人に関する特別委員会だ。"}, {"t": 625.7833333333333, "x": "「現行宗教法人法では、認証するに際しまして」"}, {"t": 629.1666666666666, "x": "「一応所定の内容を持った申請に対しては\nこれを認証することといたしております」"}, {"t": 633.9, "x": "「が、一たび認証いたしてしまうと後は\n何もわからない、これが現実であります」"}, {"t": 638.8666666666667, "x": "後は何もわからない。"}, {"t": 640.3833333333333, "x": "ああ。書類を備え付けるという決まりはあった。"}, {"t": 642.9833333333333, "x": "だが、所轄庁にはそれを見る権限が無かった。"}, {"t": 645.9333333333333, "x": "大臣はこう続けている。"}, {"t": 647.5166666666667, "x": "「坂本弁護士がいろいろ\n御努力をいただいたこと等につきましても」"}, {"t": 651.3166666666667, "x": "「所轄庁がそれに対応できなかったということは\n非常に残念なことだと思っております」"}, {"t": 656.4, "x": "対応できなかった。"}, {"t": 657.8, "x": "そうだ。制度として、対応できる\n形になっていなかった。"}, {"t": 661.4166666666666, "x": "同じ委員会で、別の議員はこう聞いている。"}, {"t": 664.0, "x": "「本来、八十条で一年以内に認証の手続を\n処分できるだけの要件が実は備わっておる」"}, {"t": 669.75, "x": "「実際には認証段階で厳しくなぜやれないのか、\nそういう御意見が非常に多かった」"}, {"t": 674.7166666666667, "x": "認証を出す段階で\n止められなかったのか、という問いだ。"}, {"t": 678.0166666666667, "x": "この団体が認証されたのが一九八九年八月二十九日。"}, {"t": 682.4666666666667, "x": "一家がいなくなったのが、\nその三か月後の十一月三日。"}, {"t": 686.15, "x": "一九九五年の衆議院本会議で、\n議員はこう述べている。"}, {"t": 690.0833333333334, "x": "「坂本弁護士一家三人の拉致殺害事件は」"}, {"t": 693.0666666666667, "x": "「教団が東京都から宗教法人の認証を得て\n三カ月後の事件であり」"}, {"t": 697.45, "x": "三か月後。"}, {"t": 698.5333333333333, "x": "ああ。相談を受けていた弁護士が、\n認証の三か月後にいなくなった。"}, {"t": 702.75, "x": "そして、その相談を受け付ける\n仕組みは、当時どこにも無かった。"}, {"t": 707.3166666666667, "x": "一九八九年十一月三十日、警察庁はこう答えている。"}, {"t": 711.9, "x": "「全国に約十万枚のチラシを\n配布するなどの所要の捜査を\n強力に今推進をしている」"}, {"t": 717.1333333333333, "x": "「公開捜査に付した後、これまでに約六十件に\n上る関連情報が寄せられております」"}, {"t": 722.5333333333333, "x": "十万枚で六十件？"}, {"t": 724.15, "x": "ああ。二日前の答弁では、約五十件と言っている。"}, {"t": 727.4666666666667, "x": "数は増えている。だが、どれも\n三人には結びつかなかった。"}, {"t": 731.1166666666667, "x": "十二月十二日、参議院の地方行政委員会で、\n警察庁長官が答えている。"}, {"t": 736.2333333333333, "x": "「弁護士という非常に重要な仕事をされておる\n方が一家ともども忽然と失踪するという」"}, {"t": 741.3666666666667, "x": "「非常に特異重要な事案、こういう\nふうに認識をしております」"}, {"t": 745.0, "x": "そして、こう続く。"}, {"t": 746.4, "x": "「なかなかこれはという情報にいまだ接していない」"}, {"t": 749.2, "x": "一か月たっても。"}, {"t": 750.5833333333334, "x": "ああ。年が明けて、五か月たった。"}, {"t": 752.85, "x": "一九九〇年三月二十九日、参議院法務委員会。"}, {"t": 756.7333333333333, "x": "「既に五カ月を経過しております」"}, {"t": 758.85, "x": "「依然として坂本弁護士とその家族の行方は\n判明をしていないというのが現状でございます」"}, {"t": 764.1833333333333, "x": "質問した議員は、警察がこの件をどう\n位置づけているのかを確かめている。"}, {"t": 768.5666666666667, "x": "「第三者により居宅から何らかの有形力などを\n行使された形で連れ出された事件ではないか」"}, {"t": 774.15, "x": "「今そういう考えが多くの方の中に\n積み重なってきているわけですけれども」"}, {"t": 778.6333333333333, "x": "連れ出された事件。"}, {"t": 779.9333333333333, "x": "警察庁はこう答えている。"}, {"t": 781.6833333333333, "x": "「本事件はまさしく\n先生御指摘のとおりでございまして」"}, {"t": 784.9666666666667, "x": "「私どもそのような認識を十分に持って\n捜査に当たっておるところでございます」"}, {"t": 789.5, "x": "だが、見つからない。"}, {"t": 791.5, "x": "国会会議録検索システムで「坂本弁護士」と\n入れると、三百八十八件の発言が出てくる。"}, {"t": 798.05, "x": "そのいちばん古いものが、\n一九八九年十一月十七日だ。"}, {"t": 802.7333333333333, "x": "捜査本部ができた日？"}, {"t": 804.35, "x": "ああ。同じ日だ。参議院の決算委員会。"}, {"t": 807.1, "x": "それより前の発言は、一件も無い。"}, {"t": 809.45, "x": "この日、質問した議員は最後にこう言っている。"}, {"t": 812.35, "x": "「人権を守って活動している弁護士が、\n家族ぐるみで行方不明になる」"}, {"t": 816.6666666666666, "x": "「犯罪の疑いが非常に濃いというのがこの事件です」"}, {"t": 819.7666666666667, "x": "「こういう事件がいつまでたっても\n処理できないというのは、"}, {"t": 822.5833333333334, "x": "人権擁護上から見ても\n治安維持から見ても非常に重大です」"}, {"t": 826.3333333333334, "x": "この十一月十七日から、質問は途切れずに続く。"}, {"t": 829.9166666666666, "x": "十一月二十一日、衆議院の法務委員会と\n地方行政委員会。"}, {"t": 834.1166666666667, "x": "十一月二十八日、衆議院法務委員会。"}, {"t": 836.95, "x": "十一月二十九日、参議院決算委員会。"}, {"t": 839.9833333333333, "x": "十一月三十日、参議院法務委員会。"}, {"t": 842.6666666666666, "x": "十二月十二日、参議院地方行政委員会。"}, {"t": 845.8833333333333, "x": "一か月で六回も？"}, {"t": 847.4, "x": "ああ。同じことが何度も聞かれている。"}, {"t": 849.5333333333333, "x": "進みましたか、と。"}, {"t": 851.05, "x": "一九九〇年六月二十五日には、こういう発言がある。"}, {"t": 855.0166666666667, "x": "「既に警察庁長官のところには\n六十万人分の要請書が届けられているはずです」"}, {"t": 860.25, "x": "六十万人。"}, {"t": 861.4, "x": "ああ。署名を集めて警察庁に届けた人たちがいた。"}, {"t": 864.8333333333334, "x": "同じ日、その議員は\nポスターの枚数についても述べている。"}, {"t": 868.25, "x": "坂本さんの事件は十万枚。"}, {"t": 870.2666666666667, "x": "一方、当時の別の事案では百四十五万枚が\n配られたと新聞が報じていた。"}, {"t": 875.1166666666667, "x": "「これに比べたら坂本弁護士の事件のポスターの数は\n余りにも少ない」"}, {"t": 879.3166666666667, "x": "これが一九九〇年六月の発言だ。"}, {"t": 882.2, "x": "ここから一九九五年まで、状況は動かない。"}, {"t": 886.2166666666667, "x": "一九九五年に入って、まったく別の事件が起きる。"}, {"t": 890.0166666666667, "x": "三月二十日の、地下鉄の事件だ。"}, {"t": 892.4666666666667, "x": "その二日後の三月二十二日から、一斉捜索が始まる。"}, {"t": 896.3833333333333, "x": "同じ年の十一月八日、\n警察庁の刑事局長がこう説明している。"}, {"t": 900.9166666666666, "x": "「本年三月二十二日の一斉捜索に\n着手以来、所要の捜査を推進しております」"}, {"t": 906.2666666666667, "x": "「約三十件の主要事件を検挙し、これらの事件に\n対する逮捕者数は延べ二百人余りとなっている」"}, {"t": 912.5, "x": "三十件。"}, {"t": 913.4833333333333, "x": "ああ。そのうちの一つが、坂本弁護士一家の件だ。"}, {"t": 916.9666666666667, "x": "同じ答弁で、局長は捜査の進み\n具合をこう表現している。"}, {"t": 920.7666666666667, "x": "「強いて申し上げれば、全体として六合目程度に\n達したのかなというふうに考えております」"}, {"t": 926.0333333333333, "x": "なぜ一九九五年に急に動いたのか。\nこの点も国会で答弁がある。"}, {"t": 930.6833333333333, "x": "「それぞれいろいろな情報はございましたのですが」"}, {"t": 933.3166666666667, "x": "「強制捜査に踏み込めるだけの確実な\n証拠というものが発見できなかった」"}, {"t": 937.8333333333334, "x": "「いろいろ物証を集め、乏しい\n物証の中から証拠化していった」"}, {"t": 941.6333333333333, "x": "そして、こう続く。"}, {"t": 943.05, "x": "「そういう作業が進みまして、"}, {"t": 944.6666666666666, "x": "どうも教団の施設の中で薬品を\n生成しているようだということが\nだんだんわかってきた」"}, {"t": 949.7, "x": "「ちょうどそのころに別の事件が\n発生したということで、急遽強制捜査に入った」"}, {"t": 954.6333333333333, "x": "別の事件が起きたから、入れた？"}, {"t": 956.8833333333333, "x": "答弁を読む限り、そういう順番だ。"}, {"t": 959.1666666666666, "x": "一九八九年に集めきれなかった証拠が、\n一九九五年の別の事件で集まった。"}, {"t": 965.3166666666667, "x": "私はこれを「遅かった」と断じるつもりはない。"}, {"t": 968.35, "x": "ただ、六年という時間が、\nそこにあったという事実は残る。"}, {"t": 972.7333333333333, "x": "一九九五年九月、三人が見つかる。"}, {"t": 975.8333333333334, "x": "この経緯は、同じ月の参議院決算委員会で\n述べられている。"}, {"t": 979.55, "x": "「神奈川県警が平成元年に発生した\n事件を粘り強く捜査しておった」"}, {"t": 984.0666666666667, "x": "「またその後の警視庁との合同捜査によりまして」"}, {"t": 987.0333333333333, "x": "「坂本さん初め御家族の遺体が新潟、富山、\n長野の草深い山中から発見されまして」"}, {"t": 993.0833333333334, "x": "三つの県。"}, {"t": 994.0833333333334, "x": "ああ。三人が、別々の場所にいた。"}, {"t": 996.5333333333333, "x": "長男については、こう述べられている。"}, {"t": 998.7666666666667, "x": "「数日にわたる水の中の大変な\n捜索活動により発見される」"}, {"t": 1002.8666666666667, "x": "ここから先の状況は話さない。"}, {"t": 1004.9333333333333, "x": "私が話すのは、この発見の前にあった\n一枚の紙のことだ。"}, {"t": 1008.9333333333333, "x": "同じ日の答弁で、警察庁の刑事局長が\nこう説明している。"}, {"t": 1012.9166666666666, "x": "「神奈川県警察におきましては、\n平成二年二月十六日付の消印のある\n投書を受理いたしました」"}, {"t": 1019.1666666666666, "x": "平成二年？　一九九〇年の二月。"}, {"t": 1022.1, "x": "ああ。事件から三か月後だ。"}, {"t": 1024.0666666666666, "x": "その投書は匿名だった。"}, {"t": 1025.5833333333333, "x": "局長はこう続けている。"}, {"t": 1027.25, "x": "「その真偽というものについての判断材料は\n持ち合わせていなかったのでありますが」"}, {"t": 1031.7833333333333, "x": "「捜査情報の一つとして積極的に評価して」"}, {"t": 1034.9166666666667, "x": "「平成二年二月二十一日に捜査員をこの投書で\n示されている場所に派遣いたしました」"}, {"t": 1040.2333333333333, "x": "「長野県警察の協力も得まして捜索を行いました」"}, {"t": 1043.85, "x": "実際に捜索したのね。"}, {"t": 1045.6833333333334, "x": "ああ。一九九〇年二月二十一日に、\n実際に人を出して捜している。"}, {"t": 1050.65, "x": "だが、見つからなかった。"}, {"t": 1052.3, "x": "局長は、その理由をこう説明している。"}, {"t": 1054.8833333333334, "x": "「投書にて指摘された場所といいますのは\n今回捜索した場所のすぐ近くではありますけれども」"}, {"t": 1060.2333333333333, "x": "「長男の方と思われる遺骨の発見には\n五日間を要したというような」"}, {"t": 1064.3666666666666, "x": "「水がわき出る非常に地理的に厳しい\n条件であったというようなところもありまして」"}, {"t": 1068.95, "x": "「二月二十一日の捜索においては\n残念ながら遺体の発見には至らなかった」"}, {"t": 1073.8333333333333, "x": "すぐ近くまで行っていたの？"}, {"t": 1075.6, "x": "答弁は、そう述べている。"}, {"t": 1077.25, "x": "一九九〇年二月、捜索の手は、\nすぐ近くまで届いていた。"}, {"t": 1082.3333333333333, "x": "一九八九年八月二十九日。"}, {"t": 1085.0166666666667, "x": "団体が東京都から宗教法人の認証を受ける。"}, {"t": 1088.1333333333334, "x": "十月二十一日。坂本さんの指導で\n被害者の会が設立される。"}, {"t": 1092.5166666666667, "x": "十月三十一日。坂本さんと団体側との激しいやりとり。"}, {"t": 1096.6, "x": "十一月三日。この日から三人の所在が分からなくなる。"}, {"t": 1100.2666666666667, "x": "十一月七日午後十時半。"}, {"t": 1102.0, "x": "母親からの届け出。"}, {"t": 1103.55, "x": "十一月八日。部屋の詳しい検分。"}, {"t": 1105.8833333333334, "x": "約六十名で非公開の捜査。"}, {"t": 1108.0666666666666, "x": "十一月十五日。公開捜査に切り替え。"}, {"t": 1110.8666666666666, "x": "十一月十七日。捜査本部の設置。"}, {"t": 1113.5333333333333, "x": "同じ日、国会で最初の質問。"}, {"t": 1115.95, "x": "ここまでで二週間ね。"}, {"t": 1117.55, "x": "ああ。ここまでは、かなり速い。"}, {"t": 1119.4833333333333, "x": "問題はこの先だ。"}, {"t": 1120.8333333333333, "x": "一九九五年十一月八日の国会で、\n議員がこう指摘している。"}, {"t": 1125.3666666666666, "x": "現場に落ちていたバッジについて、教団側の人物が\n十一月七日にこう説明していた、と。"}, {"t": 1131.1833333333334, "x": "「このバッジはプルシャというもので\n市販はしていません」"}, {"t": 1133.9833333333333, "x": "「教団のセミナーに出席して\n修了した者みんなに与えられます」"}, {"t": 1137.85, "x": "「セミナーの受講者は名簿があるのでだれが\nプルシャを持っているかは確認できます」"}, {"t": 1142.15, "x": "「プルシャを持っている信者は\n全体の二分の一もいません」"}, {"t": 1145.35, "x": "名簿で確認できる。"}, {"t": 1146.8666666666666, "x": "そう説明されていた、と議員は述べている。"}, {"t": 1149.4166666666667, "x": "そのうえで、こう続けている。"}, {"t": 1151.1666666666667, "x": "「これは極めて重要な\n手がかりであります、現場に残された」"}, {"t": 1154.7333333333333, "x": "「ところが、警察は直ちに\n事情聴取に着手をしませんでした」"}, {"t": 1158.6, "x": "十一月十八日、団体は記者会見を開く。"}, {"t": 1161.9, "x": "「警察からの要請があれば捜査に協力をする」"}, {"t": 1164.7333333333333, "x": "翌十九日、神奈川県警が団体に捜査協力を求める。"}, {"t": 1168.5833333333333, "x": "議員は、この日付をこう表現している。"}, {"t": 1171.0166666666667, "x": "「犯行の日から十六日後になって初めて」"}, {"t": 1173.75, "x": "そして、修行を理由に断られた。"}, {"t": 1176.0333333333333, "x": "二十一日、幹部の多くが国外に出る。"}, {"t": 1178.6666666666667, "x": "この出国については、警察庁も\n一九八九年十一月二十九日に事実を認めている。"}, {"t": 1184.8666666666666, "x": "「これにつきましては当方も事実を\n確認しておるところでございます」"}, {"t": 1189.4333333333334, "x": "一九九五年九月二十日、国家公安委員長。"}, {"t": 1192.9833333333333, "x": "「初期の段階から全力を挙げて捜査本部をつくり、\n努力をしてきたことは間違いがありません」"}, {"t": 1198.3, "x": "「ただ、極めて物証が乏しいということから、\n多岐にわたる捜査を丹念に行う必要がある」"}, {"t": 1203.7833333333333, "x": "「といったようなことで、"}, {"t": 1204.9166666666667, "x": "被疑者を検挙するまでに五年の捜査を\n要したというふうに報告を受けております」"}, {"t": 1209.6166666666666, "x": "物証が乏しい。"}, {"t": 1210.8666666666666, "x": "ああ。同じ言葉が、何度も出てくる。"}, {"t": 1213.3, "x": "十一月二日、同じ大臣がこう述べている。"}, {"t": 1216.25, "x": "「まことに乏しい証拠でございました」"}, {"t": 1218.4166666666667, "x": "「そしてあわせて、宗教団体という集団が\nこのようなことを結果的には起こしていた」"}, {"t": 1223.4166666666667, "x": "「集団で証拠を隠滅する、あるいは口裏を合わす」"}, {"t": 1226.5, "x": "「指導者に対する絶対的な服従というものが\nあらゆる捜査のマイナスになってしまっていた」"}, {"t": 1231.7666666666667, "x": "口裏を合わせる。"}, {"t": 1233.0333333333333, "x": "ああ。閉じた集団を相手にする\n捜査の難しさだ、という説明だ。"}, {"t": 1237.1166666666666, "x": "ただし、この説明に対しては、\n国会でも反論が出ている。"}, {"t": 1240.85, "x": "一九九五年十一月二日、ある議員はこう言っている。"}, {"t": 1244.7333333333333, "x": "「例えば、事件の現場に\n暴力団のバッジが落ちていたら」"}, {"t": 1248.1833333333334, "x": "「直ちに警察はその暴力団の事務所に\n捜索をかけたでしょう」"}, {"t": 1252.0333333333333, "x": "暴力団だったら、すぐやった？"}, {"t": 1254.25, "x": "そう聞いている。そのうえで、こう続けている。"}, {"t": 1256.8666666666666, "x": "「あの坂本さんの部屋には、\n教団のバッジがおっこっていて」"}, {"t": 1260.3666666666666, "x": "「そのバッジは発見されたにもかかわらず」"}, {"t": 1262.8, "x": "「捜索令状をとるところまでなかなか\n疎明資料が集まらなかった」"}, {"t": 1266.6, "x": "この議員自身は、宗教法人だから遠慮したという\n批判は当たらないと思う、とも述べている。"}, {"t": 1272.0, "x": "ただし、そういう批判が\n実際にある、という事実は国会に残した。"}, {"t": 1276.1833333333334, "x": "私はここで、どちらが正しいかを決めない。"}, {"t": 1278.8666666666666, "x": "決められるだけの材料が、\n公開の記録には無いからだ。"}, {"t": 1282.8166666666666, "x": "一九九九年十一月十九日、参議院本会議。"}, {"t": 1286.6333333333334, "x": "国家公安委員会委員長の答弁だ。"}, {"t": 1288.9833333333333, "x": "「事件発生当時におきましては」"}, {"t": 1291.0, "x": "「教団があれほど凶暴な"}, {"t": 1292.75, "x": "犯罪を敢行する集団であるという認識を\n十分に持っていませんでしたものですから」"}, {"t": 1297.15, "x": "「県警察においては、\n当初あらゆる角度からの捜査をいたしていたものと\n承知をいたしております」"}, {"t": 1302.7, "x": "認識を持っていなかった。"}, {"t": 1304.4666666666667, "x": "ああ。そう答えている。"}, {"t": 1305.8833333333334, "x": "そのうえで、こう続く。"}, {"t": 1307.3833333333334, "x": "「その後、捜査が進みまして、\n坂本弁護士と同教団の対立関係の詳細が\n明らかになるにつれまして」"}, {"t": 1314.0, "x": "「同教団に力点を置いた捜査を\n進めたものでございます」"}, {"t": 1317.3833333333334, "x": "「事件発生から約六年を経て\n検挙に至ったものでございますが」"}, {"t": 1321.2833333333333, "x": "「警察としては懸命な捜査を尽くしたものと\n承知をいたしてございます」"}, {"t": 1325.4333333333334, "x": "一方で、一九九五年の答弁には、\nこういう言い方もある。"}, {"t": 1329.5, "x": "「プルシャもあった、あるいは坂本弁護士が\n被害者の会の"}, {"t": 1332.6166666666666, "x": "救援活動をしていたというようなこともありまして」"}, {"t": 1335.5, "x": "「教団の関与についても初期的段階から\n視野に入れて捜査を推進していた」"}, {"t": 1340.1166666666666, "x": "初期段階から視野に入れていた？"}, {"t": 1342.1833333333334, "x": "ああ。そう答えている。"}, {"t": 1343.5833333333333, "x": "つまり、疑ってはいた。だが\n強制捜査に入る材料が足りなかった。"}, {"t": 1347.8, "x": "この二つの説明は、微妙にずれている。"}, {"t": 1350.3666666666666, "x": "認識が十分でなかった、という説明と、\n初期から視野に入れていた、という説明だ。"}, {"t": 1355.6, "x": "私はこのずれを、どちらかが嘘だとは言わない。"}, {"t": 1358.4166666666667, "x": "一九八九年に現場で判断した人と、\n一九九九年に国会で答えた人は違う。"}, {"t": 1364.9, "x": "ただ、公開の記録に両方が\n残っている、ということは言っておく。"}, {"t": 1368.8, "x": "そして、この件で警察が処分を受けたという\n記録は、私が見た範囲では国会に無い。"}, {"t": 1374.75, "x": "一九九五年の秋、国会に特別な委員会が立った。"}, {"t": 1378.7833333333333, "x": "衆議院の「宗教法人に関する特別委員会」と、\n参議院の「宗教法人等に関する特別委員会」だ。"}, {"t": 1385.95, "x": "宗教法人法を改正するための審議だった。"}, {"t": 1388.8, "x": "一九九五年十月三十一日、\n衆議院本会議での総理大臣の答弁だ。"}, {"t": 1394.1666666666667, "x": "「現行宗教法人法は、宗教団体に\n法人格を与えることを目的とし」"}, {"t": 1398.95, "x": "「憲法に定められた信教の自由と\n政教分離の原則にのっとり」"}, {"t": 1402.9333333333334, "x": "「宗教団体の自由と自主性、責任と\n公共性という二つの要請を基本として」"}, {"t": 1408.05, "x": "「その体系が組み立てられております」"}, {"t": 1410.35, "x": "自由と自主性、責任と公共性。"}, {"t": 1412.9, "x": "ああ。この二つを両立させる、という建て付けだ。"}, {"t": 1415.9166666666667, "x": "そして総理は、こう続けている。"}, {"t": 1417.9333333333334, "x": "「このような宗教法人制度の基本は\n維持しなければならないものと考えております」"}, {"t": 1422.6, "x": "「現行の宗教法人法が\n昭和二十六年に制定されて以来」"}, {"t": 1426.3666666666666, "x": "「社会の状況や宗教法人の実態の変化に\nよって実情に合わない面が生じており」"}, {"t": 1431.5, "x": "昭和二十六年？"}, {"t": 1432.8333333333333, "x": "ああ。一九五一年だ。"}, {"t": 1434.7333333333333, "x": "四十四年間、大きく変えていない法律だった。"}, {"t": 1437.7833333333333, "x": "この法律の下では、認証を出した\nあと、行政は中を見られない。"}, {"t": 1441.8, "x": "さっき文部大臣が言っていたとおりだ。"}, {"t": 1443.9, "x": "「一たび認証いたしてしまうと後は何もわからない」。"}, {"t": 1447.0833333333333, "x": "坂本さんは、その見えない中身を\n外から調べようとしていた人だった。"}, {"t": 1451.45, "x": "そして、いなくなった。"}, {"t": 1453.6166666666666, "x": "宗教法人には「解散命令」という仕組みがある。"}, {"t": 1456.8166666666666, "x": "裁判所が、その法人を解散させる決定を出す。"}, {"t": 1460.05, "x": "この団体に対しては、一九九五年十月三十日に\n東京地方裁判所が決定を出した。"}, {"t": 1466.3, "x": "翌十月三十一日の衆議院本会議で、\n議員がこう述べている。"}, {"t": 1470.3666666666666, "x": "「教団については、昨日、東京地方裁判所に\nおいて解散を命ずる決定が下されました」"}, {"t": 1475.8333333333333, "x": "「もとより当然の決定であり、\nこれまでの関係方面の御努力に深く敬意を表する」"}, {"t": 1480.75, "x": "「この解散命令が一日も早く確定をし、清算手続が\n適正かつ迅速に進行することを期待する」"}, {"t": 1487.4166666666667, "x": "解散命令が出たら、その団体は無くなるの？"}, {"t": 1490.45, "x": "いや。そこが大事な点だ。"}, {"t": 1492.2166666666667, "x": "解散命令で無くなるのは、法人格だ。"}, {"t": 1494.8833333333334, "x": "宗教法人としての資格が消える。"}, {"t": 1496.9666666666667, "x": "財産を持ったり、税の扱いを\n受けたりする立場が消える。"}, {"t": 1500.5666666666666, "x": "だが、信仰そのものや、人の集まりを\n禁止するものではない。"}, {"t": 1504.4, "x": "憲法が信教の自由を保障している\n以上、そこには手が届かない。"}, {"t": 1508.3166666666666, "x": "だから、法人格が無くなったあとも、活動は続いた。"}, {"t": 1511.85, "x": "同じ本会議で、この事件の規模についても\n述べられている。"}, {"t": 1515.3, "x": "「死亡者、負傷者合わせて、判明したものだけでも\n約四千名という大規模の犯罪であり」"}, {"t": 1520.7166666666667, "x": "「日本の犯罪史上類例を見ない凶悪犯罪であります」"}, {"t": 1524.1166666666666, "x": "四千名。"}, {"t": 1525.1, "x": "ああ。判明したものだけで、という言い方だ。"}, {"t": 1527.85, "x": "そして議員は、こう問いを立てている。"}, {"t": 1529.9833333333333, "x": "「何ゆえにこのような団体に\n法人格が付与されたのか」"}, {"t": 1533.2666666666667, "x": "「また、この団体の活動状況について、所轄庁は\n最小限のことは知っておくべきであるのに」"}, {"t": 1538.9833333333333, "x": "「ほとんど知らなかったということは\n大きな問題ではないのか」"}, {"t": 1542.25, "x": "この問いから、宗教法人法の改正が動き出す。"}, {"t": 1545.4833333333333, "x": "所轄庁に書類の提出を求めさせる。"}, {"t": 1547.8666666666666, "x": "複数の都道府県にまたがる法人は国が所轄する。"}, {"t": 1551.2666666666667, "x": "そういう改正が、この年の暮れに成立した。"}, {"t": 1554.75, "x": "破壊活動防止法だ。略して破防法という。"}, {"t": 1557.6833333333334, "x": "この法律には、団体そのものを\n解散させる仕組みがある。"}, {"t": 1561.2333333333333, "x": "それを公安審査委員会という組織が審査して、決める。"}, {"t": 1564.8, "x": "裁判所じゃないの？"}, {"t": 1566.1166666666666, "x": "違う。準司法機関、と国会では呼ばれている。"}, {"t": 1569.1333333333334, "x": "一九九六年七月十一日、公安調査庁が\nこの団体について解散指定処分を請求した。"}, {"t": 1575.7333333333333, "x": "そして一九九七年一月三十一日、\n公安審査委員会が決定を出す。"}, {"t": 1581.0666666666666, "x": "結論は、棄却だった。"}, {"t": 1582.8833333333334, "x": "棄却？"}, {"t": 1583.6833333333334, "x": "ああ。請求は認められなかった。"}, {"t": 1585.7666666666667, "x": "一九九九年の国会で、\n公安調査庁側はこう説明している。"}, {"t": 1590.35, "x": "「平成九年の一月三十一日に公安審査会の決定が\n行われたわけでございまして」"}, {"t": 1595.8166666666666, "x": "「その際、破防法の請求を棄却するという\n残念な結論が出されたわけでございます」"}, {"t": 1600.8833333333334, "x": "なぜ棄却されたのか。"}, {"t": 1602.1833333333334, "x": "答弁では、要件の厳しさが挙げられている。"}, {"t": 1604.9333333333334, "x": "「これは法文上、破壊活動を行う明らかな\n危険性という非常に厳格な要件が書かれている」"}, {"t": 1610.65, "x": "「現行の破壊活動防止法の適用の要件が\nやや厳格に過ぎて」"}, {"t": 1614.75, "x": "「現実に対応できていないという\n側面があるのではないかと私どもでは考えておる」"}, {"t": 1619.5333333333333, "x": "もう一つ、時間の問題も挙げられている。"}, {"t": 1622.1333333333334, "x": "「公安調査庁による弁明手続の開始から\n公安審査委員会の決定まで\n一年一カ月余もの期間を要して」"}, {"t": 1628.9, "x": "「その間、教団を取り巻く状況が大きく\n変化したことが棄却の決定につながった」"}, {"t": 1634.05, "x": "一年一か月のあいだに、状況が変わった。"}, {"t": 1636.9666666666667, "x": "そう説明されている。"}, {"t": 1638.3333333333333, "x": "この決定を政治がどう扱うかについても、\n国会でやりとりがある。"}, {"t": 1642.2333333333333, "x": "法務大臣はこう述べている。"}, {"t": 1643.9333333333334, "x": "「準司法機関の判断に対して政治が物を言うときに\nこれはそう軽々に言う話ではないだろう」"}, {"t": 1649.2833333333333, "x": "「準司法機関として棄却の決定を下したことは\n皆尊重をしなきゃいけないことだと思っております」"}, {"t": 1655.0833333333333, "x": "一方で、棄却された\nあとの状況についても答弁がある。"}, {"t": 1658.4333333333334, "x": "「規制請求が棄却されました平成九年一月以降、\n組織再興に向けた活動を活発化させておりまして」"}, {"t": 1665.1833333333334, "x": "一九九九年の時点で、十六都道府県に\n三十四か所の施設。十五の中央部署。"}, {"t": 1671.2, "x": "出家の信徒が五百人以上、在家の信徒が\n一千人以上、と説明されている。"}, {"t": 1676.1166666666666, "x": "これは一九九九年の数字だ。"}, {"t": 1678.4833333333333, "x": "今の数字ではない。"}, {"t": 1680.4333333333334, "x": "そこで、一九九九年に新しい法律がつくられる。"}, {"t": 1684.2666666666667, "x": "正式な名前は「無差別大量殺人行為を\n行った団体の規制に関する法律」。"}, {"t": 1689.4666666666667, "x": "短く、団体規制法と呼ばれている。"}, {"t": 1691.95, "x": "提出の理由は、こう説明されている。"}, {"t": 1694.3833333333334, "x": "「関係省庁が緊密な連絡をとりつつ、\n現行の各種法規を駆使して最大限の対応をしてきた」"}, {"t": 1700.4, "x": "「のでございますが、それには限界があり」"}, {"t": 1702.8, "x": "「基本的には団体活動を規制する措置が\n不可欠であるとの認識に至りました」"}, {"t": 1707.8166666666666, "x": "今ある法律では足りない、ということ？"}, {"t": 1710.2, "x": "そういう説明だ。"}, {"t": 1711.3833333333334, "x": "この法律の中身は、大きく二つある。"}, {"t": 1713.9166666666667, "x": "「本案の骨子である規制措置、これは\n第二章に規定されておりますが」"}, {"t": 1717.9833333333333, "x": "「観察処分と再発防止処分の二つでございます」"}, {"t": 1721.2333333333333, "x": "「公安審査委員会が公安調査庁長官の請求によって」"}, {"t": 1724.7833333333333, "x": "「対象団体につきその活動状況を継続して\n明らかにする必要があると認められる場合」"}, {"t": 1730.1833333333334, "x": "「三年以内の期間を定めて」\n活動状況の報告を求める。"}, {"t": 1734.1833333333334, "x": "解散させるんじゃなくて、報告させる？"}, {"t": 1736.8, "x": "ああ。ここが破防法と違う。"}, {"t": 1738.6, "x": "団体を消すのではなく、中を\n見えるようにする、という設計だ。"}, {"t": 1742.35, "x": "「観察処分に付されました団体の具体的な\n活動状況を明らかにするために」"}, {"t": 1747.1666666666667, "x": "「公安調査官による任意調査が行われます」"}, {"t": 1750.0, "x": "「また、観察処分がなされますと、\n当該団体からの報告も出てまいります」"}, {"t": 1754.75, "x": "立入検査もできる。ただし、性質は行政処分だ。"}, {"t": 1758.2333333333333, "x": "「その実効性は間接強制による\n確保という方法をとっております」"}, {"t": 1762.2333333333333, "x": "この法律には、強い反対もあった。\nそれも記録に残っている。"}, {"t": 1766.2333333333333, "x": "参議院の本会議では、こう質されている。"}, {"t": 1768.8166666666666, "x": "「観察処分による立入検査及び再発防止処分としての\n施設の使用禁止に」"}, {"t": 1773.7666666666667, "x": "「令状を必要としないのは\n憲法第三十五条に違反するのではないか」"}, {"t": 1777.9833333333333, "x": "令状なしで入れるの？"}, {"t": 1779.4, "x": "それが憲法に触れないか、という問いだ。"}, {"t": 1781.65, "x": "政府は違反しないと答えている。"}, {"t": 1783.6833333333334, "x": "もう一つ、信者の側の人権についても答弁がある。"}, {"t": 1787.0166666666667, "x": "「信者の転入拒否、\n子供の就学拒否等の問題につきましては」"}, {"t": 1791.1333333333334, "x": "「信教の自由、居住・移転の自由、教育を\n受ける権利等、信者側の人権にかかわる反面」"}, {"t": 1797.0, "x": "「住民の平穏で安全な生活の確保という\n住民側の人権にもかかわるもの」"}, {"t": 1801.7333333333333, "x": "両方の人権がかかっている、という言い方だ。"}, {"t": 1805.15, "x": "ここからは、私が記録を読んで\n残った疑問を三つ挙げる。"}, {"t": 1808.7, "x": "答えは出さない。答えを出せる\n材料が公開の記録に無いからだ。"}, {"t": 1812.55, "x": "一つ目。「失踪」という\n名前は、捜査に影響したのか。"}, {"t": 1816.2166666666667, "x": "これは国会で何度も問われたが、\nはっきりした答えは出ていない。"}, {"t": 1819.9, "x": "警察側は、名前は失踪でも、犯罪に巻き込まれた\n可能性を前提に動いていたと説明している。"}, {"t": 1826.0166666666667, "x": "一方で、名前が「失踪」だったことで、\n外から見える扱いは軽くなった。"}, {"t": 1830.9333333333334, "x": "遺族が「夜逃げ」と言われ続けたのは、その結果だ。"}, {"t": 1834.5, "x": "中の扱いと、外から見える名前が違っていた。"}, {"t": 1837.7666666666667, "x": "そういうことになる。"}, {"t": 1838.9666666666667, "x": "二つ目。広域の指定について。"}, {"t": 1841.1333333333334, "x": "一九九〇年三月二十九日、警察庁はこう答えている。"}, {"t": 1845.35, "x": "「問題の坂本事件についてでございますが、\n現在のところ、指定等の措置はとっておらない」"}, {"t": 1850.85, "x": "ここでいう指定とは、都道府県をまたぐ重大事件に\n警察庁が番号を付ける仕組みのことだ。"}, {"t": 1856.4166666666667, "x": "同じ答弁で、指定した事件の例が挙げられている。"}, {"t": 1859.4833333333333, "x": "グリコ・森永の事件。"}, {"t": 1860.9833333333333, "x": "埼玉と警視庁にまたがった連続幼女誘拐の事件。"}, {"t": 1864.4, "x": "昭和五十七年の拳銃を使った事件は、\n百十三号として指定されている。"}, {"t": 1869.1666666666667, "x": "昭和六十二年からの新聞社などへの襲撃事件は、\n百十六号だ。"}, {"t": 1873.75, "x": "坂本さんの事件は、指定されなかったの？"}, {"t": 1876.65, "x": "一九九〇年三月の時点では、\n指定していないと答えている。"}, {"t": 1880.8666666666666, "x": "理由は「各府県警察の捜査が競合し調整する\n必要があると認められる状況に至っていない」から。"}, {"t": 1887.2, "x": "もし早い段階で複数の県にまたがると\n分かっていたら、扱いは変わったのか。"}, {"t": 1891.9333333333334, "x": "それは、私には分からない。"}, {"t": 1893.7833333333333, "x": "三つ目。一九九〇年二月の投書だ。"}, {"t": 1896.8333333333333, "x": "あの匿名の投書が届いたのは、\n一家がいなくなった三か月後だった。"}, {"t": 1901.0166666666667, "x": "警察は五日後に人を出して、\n長野県警の協力も得て捜索している。"}, {"t": 1905.5666666666666, "x": "それでも見つからなかった。"}, {"t": 1907.05, "x": "指摘された場所は、後に\n見つかった場所のすぐ近くだった。"}, {"t": 1910.8333333333333, "x": "もしあのとき見つかっていたら、\n五年半が変わっていたかもしれない。"}, {"t": 1914.7333333333333, "x": "たられば、ね。"}, {"t": 1915.9, "x": "ああ。だから私は、これを誰かの失敗として語らない。"}, {"t": 1919.3833333333334, "x": "ただ、そういう記録が残っている、とだけ言っておく。"}, {"t": 1923.15, "x": "一つ目は、宗教法人法だ。"}, {"t": 1925.3166666666666, "x": "一九九五年の改正で、所轄庁に\n書類を出させる仕組みが入った。"}, {"t": 1930.05, "x": "複数の都道府県で活動する法人は、\n国が所轄することになった。"}, {"t": 1934.4333333333334, "x": "「一たび認証いたしてしまうと後は何も\nわからない」という状態を、少し変えた。"}, {"t": 1939.2666666666667, "x": "二つ目は、団体規制法だ。"}, {"t": 1941.3166666666666, "x": "解散させるのではなく、活動状況を\n報告させて見えるようにする、という仕組み。"}, {"t": 1946.15, "x": "三年以内の期間を定めて、\n公安審査委員会が決める形になっている。"}, {"t": 1950.8, "x": "三年ごとに決め直すのね。"}, {"t": 1952.7333333333333, "x": "そういう作りだ。"}, {"t": 1953.8166666666666, "x": "この処分が今どうなっているかについては、\n私は数字を言わない。"}, {"t": 1957.5333333333333, "x": "公安調査庁が公表しているはずだが、今回、\n私はその一次資料に到達できなかった。"}, {"t": 1963.1833333333334, "x": "裏が取れないことは言わない。\nそれがこのチャンネルの決まりだ。"}, {"t": 1966.5333333333333, "x": "三つ目は、遺族が国会に残した言葉だ。"}, {"t": 1969.4, "x": "一九九五年十一月八日、\n議員が読み上げた文章がある。"}, {"t": 1973.5666666666666, "x": "都子さんのお父さん、大山友之さんが、\n救う会のニュースに書いた文章だ。"}, {"t": 1978.2833333333333, "x": "「何故『失踪』なのか。"}, {"t": 1979.8333333333333, "x": "何故六年もの歳月を必要としたのか」"}, {"t": 1982.55, "x": "「これらの疑問が解明されることを強く期待」する。"}, {"t": 1985.6666666666667, "x": "「真実を知ることが娘たちの回向になり」"}, {"t": 1988.25, "x": "「六年間も花も線香も手向けることの出来なかった\n心の傷を少しでも癒せると思います」"}, {"t": 1993.8, "x": "「また、再びこの種の犯罪を起こさせないことに\nつながると、固く信じています」"}, {"t": 1998.85, "x": "六年間、花も線香も手向けられなかった。"}, {"t": 2001.8666666666666, "x": "ああ。見つかっていないのだから、\n手向ける場所がない。"}, {"t": 2004.8833333333334, "x": "そして、その六年のあいだ、こう言われ続けた。"}, {"t": 2007.9, "x": "「救出署名の運動をしていたときに、\nそばを通る人が、何で夜逃げしたんだと」"}, {"t": 2012.7333333333333, "x": "「失踪というと、庶民の言うのは夜逃げなんですよ」"}, {"t": 2015.65, "x": "「ある議会に請願に行ったときも\n同じことを言われたという」"}, {"t": 2018.7833333333333, "x": "「夜逃げだとしてずっと扱われてきたのは\n親として絶対納得できない」"}, {"t": 2022.8833333333334, "x": "これに対して、官房長官は内閣委員会で\n「申しわけない」と答弁している。"}, {"t": 2027.7833333333333, "x": "国家公安委員長も、御家族の苦しみは\n「はかり知れない」と述べた。"}, {"t": 2032.0666666666666, "x": "ただし、こうも述べている。"}, {"t": 2033.6666666666667, "x": "「重大な捜査のミスがあった、\n誤りがあったということについて」"}, {"t": 2037.3666666666666, "x": "「少なくとも今までの報告の範囲の中で\n容認するわけにはまいらないと思っています」"}, {"t": 2042.3, "x": "謝罪と、反論。その両方が\n同じ日の記録に並んでいる。"}, {"t": 2046.6666666666667, "x": "最後に、もう一度あの言葉を置いておく。"}, {"t": 2049.0666666666666, "x": "「何故『失踪』なのか。"}, {"t": 2050.633333333333, "x": "何故六年もの歳月を必要としたのか」"}, {"t": 2053.35, "x": "これは推理でも考察でもない。"}, {"t": 2055.05, "x": "遺族が実際に書いて、国会で読み上げられた文章だ。"}, {"t": 2058.4666666666667, "x": "この回で私が扱ったのは、誰がやったかではない。"}, {"t": 2061.6833333333334, "x": "一つの言葉の選び方が、遺族に\n何をしたか、という話だ。"}, {"t": 2065.75, "x": "制度の上では、あれは\n「失踪」から始めるしかなかったのかもしれない。"}, {"t": 2070.05, "x": "直接の証拠がなければ、\n事件にはできない。それは今も変わらない。"}, {"t": 2074.1833333333334, "x": "だが、その名前で呼ばれた六年間、\n遺族は夜逃げをした家族として扱われた。"}, {"t": 2079.1833333333334, "x": "名前が、そのまま扱いになったのね。"}, {"t": 2081.75, "x": "ああ。そこは、制度の話とは別に残る。"}, {"t": 2084.5666666666666, "x": "私がこのチャンネルで何度も\n言っていることを、最後にもう一度言う。"}, {"t": 2088.366666666667, "x": "記録は残る。"}, {"t": 2089.366666666667, "x": "この回で紹介した質問も、答弁も、\n遺族の文章も、全部国会の議事録に残っている。"}, {"t": 2095.2166666666667, "x": "誰でも読める。今すぐ読める。"}, {"t": 2097.1833333333334, "x": "事件の解説動画は、たくさんある。"}, {"t": 2099.35, "x": "私が作っているものも、その一つだ。"}, {"t": 2102.0666666666666, "x": "だが、動画で見た話が本当か\nどうかを、自分で確かめる手段がある。"}, {"t": 2106.45, "x": "それが、国会会議録検索システムだ。"}, {"t": 2109.2, "x": "今回使った資料も、そこで公開されている。"}, {"t": 2112.116666666667, "x": "中心にしたのは、次の記録だ。"}, {"t": 2114.366666666667, "x": "一九八九年十一月十七日、参議院決算委員会。\nこの事件が初めて国会に出た日。"}, {"t": 2120.95, "x": "一九八九年十一月二十一日、衆議院法務委員会。"}, {"t": 2125.15, "x": "届け出の時刻と初動が答弁された回。"}, {"t": 2127.733333333333, "x": "一九九〇年三月二十九日、参議院法務委員会。"}, {"t": 2131.4666666666667, "x": "五か月後の状況と、指定の話。"}, {"t": 2133.9333333333334, "x": "一九九五年九月二十日、参議院決算委員会。"}, {"t": 2137.5333333333333, "x": "発見と、投書の経緯。"}, {"t": 2139.2833333333333, "x": "一九九五年十一月八日、\n衆議院宗教法人に関する特別委員会。"}, {"t": 2144.4, "x": "遺族の文章が読まれた回。"}, {"t": 2146.3, "x": "一九九九年十一月十九日、参議院本会議。"}, {"t": 2150.116666666667, "x": "団体規制法の審議。"}, {"t": 2151.7, "x": "どなたでも無料で読める。"}, {"t": 2153.2166666666667, "x": "よかったら、一度自分で開いてみてほしい。"}, {"t": 2155.8333333333335, "x": "この回について、あなたはどう考えるか。"}, {"t": 2158.2166666666667, "x": "コメントで聞かせてほしい。"}, {"t": 2159.8, "x": "最後まで見てくれて、ありがとう。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
