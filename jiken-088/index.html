<script>
const D={"name": "088", "file": "088_編集用", "dur": 1938.6333125, "segs": [], "subs": [{"t": 0.0, "x": "1996年9月9日、月曜日。"}, {"t": 3.2, "x": "東京都葛飾区柴又三丁目。"}, {"t": 5.516666666666667, "x": "午後3時50分ごろ、一軒の家から母親が出かけた。"}, {"t": 9.083333333333334, "x": "仕事に向かうところだった。"}, {"t": 10.783333333333333, "x": "家には、大学4年生の娘が\n一人残っていた。当時21歳。"}, {"t": 15.266666666666667, "x": "ふつうの、月曜の昼下がりね。"}, {"t": 17.483333333333334, "x": "そうだ。何も起きていない時間だ。"}, {"t": 19.666666666666668, "x": "そして午後4時39分、隣の家から119番通報が入った。"}, {"t": 24.1, "x": "その家が燃えていた。"}, {"t": 25.4, "x": "火が消し止められたあと、\n2階から、その娘さんが見つかった。"}, {"t": 29.35, "x": "刃物で殺害されたうえで、\n室内に火がつけられていた。"}, {"t": 32.95, "x": "……3時50分と、4時39分？"}, {"t": 35.5, "x": "ああ。そこが今日の話の全部だ。"}, {"t": 37.666666666666664, "x": "49分。"}, {"t": 38.666666666666664, "x": "警視庁が公開捜査のページに\n書いている発生日時が、これだ。"}, {"t": 42.55, "x": "「平成8年9月9日、月曜、\n午後3時50分ころから午後4時39分までの間」。"}, {"t": 48.5, "x": "30年たったいまも、この49分のあいだに\n何があったのかが分かっていない。"}, {"t": 53.3, "x": "30年って……時効は来ないの？"}, {"t": 55.53333333333333, "x": "来なかった。"}, {"t": 56.4, "x": "本当なら来るはずだったのに、来なかった。"}, {"t": 58.983333333333334, "x": "今日はその話もする。"}, {"t": 60.45, "x": "この事件は未解決だ。"}, {"t": 61.9, "x": "逮捕された人はいない。"}, {"t": 63.416666666666664, "x": "ご家族が30年、公に呼びかけ続けてきた事件だ。"}, {"t": 67.08333333333333, "x": "先に断っておく。犯人を決めつける話はしない。"}, {"t": 70.41666666666667, "x": "手口や怪我のことはくわしく\n話さないし、面白がりもしない。"}, {"t": 74.08333333333333, "x": "被害者の方のお名前も出さない。"}, {"t": 76.25, "x": "……分かったわ。"}, {"t": 77.71666666666667, "x": "まず、時計だけを並べる。"}, {"t": 79.4, "x": "午後3時50分ごろ。母親が家を出る。"}, {"t": 82.03333333333333, "x": "このとき、玄関に鍵をかけなかったと報じられている。"}, {"t": 85.43333333333334, "x": "……かけなかったの。"}, {"t": 86.63333333333334, "x": "ああ。当時の下町では、昼間に\n鍵をかけない家は珍しくなかった。"}, {"t": 90.88333333333334, "x": "午後4時20分ごろ。"}, {"t": 92.16666666666667, "x": "近所の何人かが、その家から「ドン、\nドン」という音を聞いている。"}, {"t": 96.33333333333333, "x": "4回から5回。報道ではそう伝えられている。"}, {"t": 99.16666666666667, "x": "午後4時35分ごろ。"}, {"t": 100.6, "x": "出火が確認される。"}, {"t": 102.13333333333334, "x": "午後4時39分。隣の家から119番通報。"}, {"t": 105.68333333333334, "x": "そして午後6時ごろ、火が消し止められた。"}, {"t": 108.41666666666667, "x": "3時50分から4時39分まで……49分ね。"}, {"t": 112.18333333333334, "x": "そうだ。"}, {"t": 112.78333333333333, "x": "ここで、はっきりさせておきたいことがある。"}, {"t": 115.28333333333333, "x": "49分という数字は、私が計算したものじゃない。"}, {"t": 118.75, "x": "警視庁が、公開捜査のページに\n書いている時間帯そのものだ。"}, {"t": 122.6, "x": "そのあいだの「4時20分の物音」や\n「4時35分の出火」は、当時の報道によるものだ。"}, {"t": 128.91666666666666, "x": "私は一次資料で確かめられなかったから、\nそう断っておく。"}, {"t": 132.85, "x": "警視庁が言っていることと、報道が\n言っていることを、分けるのね。"}, {"t": 136.8, "x": "分ける。この回はずっとそうする。"}, {"t": 138.83333333333334, "x": "それでも、49分という枠だけは動かない。"}, {"t": 141.8, "x": "母親が出てから、消防に電話が入るまで、49分。"}, {"t": 145.51666666666668, "x": "この中に、家に入った人がいて、\nその人が出ていっている。"}, {"t": 149.38333333333333, "x": "……49分って、どのくらいなのかしら。"}, {"t": 152.03333333333333, "x": "テレビのドラマが1本終わるくらいだな。"}, {"t": 154.25, "x": "買い物に出て、帰ってくるくらいの時間でもある。"}, {"t": 157.13333333333333, "x": "家を空けた側からすれば、\n「ちょっと出ただけ」の時間だ。"}, {"t": 160.58333333333334, "x": "……それだけの時間で。"}, {"t": 162.0, "x": "ああ。"}, {"t": 162.4, "x": "この事件を語るとき、よく「30年たっても\n解決していない」という言い方をされる。"}, {"t": 167.65, "x": "それは事実だ。だが、私はそこから入りたくない。"}, {"t": 170.98333333333332, "x": "30年というのは、あとから積み上がった時間だ。"}, {"t": 173.98333333333332, "x": "事件そのものは、49分の中で起きて、終わっている。"}, {"t": 177.66666666666666, "x": "30年かけて追いかけているのは、その49分だ。"}, {"t": 181.73333333333332, "x": "……被害者の女性って、どんな人だったの。"}, {"t": 184.4, "x": "大学4年生だった。外国語学部の英語学科。"}, {"t": 187.63333333333333, "x": "ジャーナリストになりたかったそうだ。"}, {"t": 189.61666666666667, "x": "そして、アメリカの大学へ\n留学することが決まっていた。"}, {"t": 193.2, "x": "留学。"}, {"t": 194.01666666666668, "x": "ああ。行き先はシアトルだ。"}, {"t": 195.73333333333332, "x": "出発は、事件の2日後だった。"}, {"t": 198.18333333333334, "x": "……2日後。"}, {"t": 199.08333333333334, "x": "荷物は、もうまとめてあった。"}, {"t": 200.98333333333332, "x": "留学の費用を自分で稼ぐために、その年の2月から\n半年間、銀座にある放送局の東京支社で"}, {"t": 207.28333333333333, "x": "これは、その職場の人たちが2025年に\n東京新聞の取材に答えて話したことだ。"}, {"t": 212.91666666666666, "x": "職場には、彼女が書いた日誌が残っていた。"}, {"t": 215.88333333333333, "x": "日誌。"}, {"t": 216.6, "x": "アルバイトが毎日書く、業務日誌のようなものだな。"}, {"t": 219.73333333333332, "x": "2月14日、働き始めてすぐの\nころには、こう書いている。"}, {"t": 223.61666666666667, "x": "「迷惑ばかりかけており、役立たず\n以下の存在であると痛感しております」"}, {"t": 228.06666666666666, "x": "……真面目すぎるわね。"}, {"t": 229.36666666666667, "x": "そうだな。私もそう思った。"}, {"t": 231.35, "x": "そして、最後の日、\n8月16日の日誌にはこう書いてある。"}, {"t": 235.31666666666666, "x": "「大変去りがたいです。"}, {"t": 236.61666666666667, "x": "少しでもみなさんのお役に立てていたら幸せです」"}, {"t": 239.55, "x": "……。"}, {"t": 240.48333333333332, "x": "職場では、辞めるときに「うちの会社で\n働いてくれないかな」という声が出ていたそうだ。"}, {"t": 245.85, "x": "日誌には、職場をこうしたらどうかという\n提案まで書き込まれていた。"}, {"t": 249.71666666666667, "x": "私が言えるのは、ここまでだ。"}, {"t": 251.65, "x": "ご家族や職場の方が、自分から公にしている\n範囲を超えて、この人の話はしない。"}, {"t": 257.18333333333334, "x": "……そのほうがいいと思うわ。"}, {"t": 259.21666666666664, "x": "現場の話に移る。"}, {"t": 260.65, "x": "ただし、亡くなったときの様子には\n触れない。そこは飛ばす。"}, {"t": 264.15, "x": "触れるのは、「そこに何が残っていたか」だけだ。"}, {"t": 267.3333333333333, "x": "物のほうね。"}, {"t": 268.3833333333333, "x": "ああ。"}, {"t": 268.81666666666666, "x": "まず、凶器だ。"}, {"t": 269.96666666666664, "x": "報道では、刃渡りが8センチほど、刃幅が3\nセンチほどの、小型のナイフのような刃物だったと"}, {"t": 275.8833333333333, "x": "そして、これは家にあったものではない。"}, {"t": 278.0, "x": "外から持ち込まれている。"}, {"t": 279.76666666666665, "x": "……持ってきたの。"}, {"t": 280.85, "x": "そう報じられている。そして、\nいまも見つかっていない。"}, {"t": 284.0, "x": "もう一つ、粘着テープが使われている。"}, {"t": 286.56666666666666, "x": "これも家のものではなく、外から持ち込まれたものだ。"}, {"t": 289.8833333333333, "x": "刃物とテープを持って来た、ということは。"}, {"t": 292.48333333333335, "x": "そこで止めておこう。"}, {"t": 293.7, "x": "「持ってきた」という事実と、\n「何のために持ってきたのか」は別の話だ。"}, {"t": 298.3, "x": "後者は、誰も確かめていない。"}, {"t": 300.3333333333333, "x": "私が言えるのは、その家にはもともと無かったものが、\nその日その家にあった、ということだけだ。"}, {"t": 306.1333333333333, "x": "……厳しいのね、言い方が。"}, {"t": 307.8666666666667, "x": "厳しくしないと、すぐ話が滑る。"}, {"t": 310.28333333333336, "x": "未解決事件というのは、分かっていることより、\n分かっていないことのほうがずっと多い。"}, {"t": 315.2, "x": "分かっていない側を、想像で埋めない。"}, {"t": 317.46666666666664, "x": "それが、この回で私が守ることだ。"}, {"t": 320.01666666666665, "x": "でも、「外から持ってきた」というのは、\nそれだけでも大きいんじゃないの。"}, {"t": 324.28333333333336, "x": "大きい。それは言っていい。"}, {"t": 325.75, "x": "家の中にあった物で起きたことなら、\n突発的だったという見方が立つ。"}, {"t": 330.15, "x": "外から持ってきた物で起きているなら、\nその見方は立ちにくくなる。"}, {"t": 334.1333333333333, "x": "ただ、「立ちにくい」と「無い」は違う。"}, {"t": 336.6666666666667, "x": "その刃物を、別の用事で持っていた\n人だったかもしれない。"}, {"t": 340.26666666666665, "x": "……そこまで考えるのね。"}, {"t": 341.85, "x": "考える。というより、決めないでおく。"}, {"t": 344.15, "x": "あと、忘れてはいけないことがある。"}, {"t": 346.21666666666664, "x": "この家の玄関は、鍵がかかっていなかった。"}, {"t": 348.96666666666664, "x": "だから、入ること自体には、道具も力も要らなかった。"}, {"t": 352.51666666666665, "x": "ドアや窓が壊されたという話は出ていない。"}, {"t": 355.68333333333334, "x": "次に、無くなったものの話をする。"}, {"t": 358.03333333333336, "x": "報道によれば、この家から\n無くなったものは、二つだけだった。"}, {"t": 361.96666666666664, "x": "二つ。"}, {"t": 362.75, "x": "一つは、1階の居間の戸棚にしまってあった、\n旧札の1万円札が1枚。"}, {"t": 367.65, "x": "聖徳太子が描かれている、あの古いお札だ。"}, {"t": 370.55, "x": "もう一つは、被害者の女性の引き出しに\n入っていた1万円。"}, {"t": 374.4166666666667, "x": "……合わせて2万円。"}, {"t": 375.6333333333333, "x": "そうだ。"}, {"t": 376.23333333333335, "x": "では、残っていたものを挙げる。"}, {"t": 378.1166666666667, "x": "洋服だんすの中にあった\n預金通帳。これはそのままだった。"}, {"t": 381.78333333333336, "x": "留学用のリュックサックに入っていた、\n旅行小切手と現金十数万円。これもそのままだ。"}, {"t": 387.3333333333333, "x": "2階の仏壇や箪笥からも、何も無くなっていない。"}, {"t": 390.6333333333333, "x": "……通帳と十数万円を置いて、\n1万円札だけ持っていったの。"}, {"t": 394.48333333333335, "x": "報道ではそうなっている。"}, {"t": 395.93333333333334, "x": "これが、物盗りだという見方がうまく立たない理由だ。"}, {"t": 399.1, "x": "お金が目当てなら、\nリュックの十数万円を置いていく理由がない。"}, {"t": 402.81666666666666, "x": "じゃあ、物盗りじゃないのね。"}, {"t": 404.6, "x": "いや、そこも断定しない。"}, {"t": 406.3, "x": "火が出ている家だ。慌てて出ていけば、\n目についたものだけ取って終わる、ということもある。"}, {"t": 411.4, "x": "私が言えるのは、「物盗りだとすると\n説明のつかない部分がある」までだ。"}, {"t": 415.8, "x": "「物盗りではない」とは言わない。"}, {"t": 417.71666666666664, "x": "……また止めたわね。"}, {"t": 418.9166666666667, "x": "止める。ここが甘いと、あとが全部崩れる。"}, {"t": 422.21666666666664, "x": "現場に残っていたもので、もう\n一つ報じられているものがある。"}, {"t": 425.8333333333333, "x": "さっきの粘着テープだ。"}, {"t": 427.45, "x": "2009年1月、そのテープに、\n3種類の犬の毛が付いていたことが\n分かったと報じられた。"}, {"t": 433.2, "x": "3種類。"}, {"t": 434.1, "x": "ああ。1種類じゃない。3種類だ。"}, {"t": 436.3, "x": "そして、この家では犬を飼っていなかった。"}, {"t": 438.95, "x": "……じゃあ、外から付いてきたのね。"}, {"t": 441.05, "x": "そう考えるのが自然だ。"}, {"t": 442.6333333333333, "x": "テープ自体が外から持ち込まれているから、\nそのテープが置かれていた場所に、"}, {"t": 446.9166666666667, "x": "あるいは、持ってきた人の服や\n手に付いていたのかもしれない。"}, {"t": 450.3833333333333, "x": "どちらかは分からない。"}, {"t": 451.81666666666666, "x": "3種類っていうのが、なんだか引っかかるわ。"}, {"t": 454.6166666666667, "x": "引っかかるな。1匹なら、飼い主の家だと思える。"}, {"t": 457.85, "x": "3匹だと、飼い主の家かもしれないし、\nそうでない場所かもしれない。"}, {"t": 461.9, "x": "ここも、私はそこで止める。"}, {"t": 463.85, "x": "ただ、この話には別の意味がある。"}, {"t": 466.21666666666664, "x": "別の意味。"}, {"t": 467.1666666666667, "x": "2009年だ。事件から13年たっている。"}, {"t": 470.1, "x": "13年たってから、テープに付いた\n毛のことが分かっている。"}, {"t": 473.55, "x": "つまり、現場から取った物が13年間、\nちゃんと保管されていたということだ。"}, {"t": 478.31666666666666, "x": "……保管。"}, {"t": 479.0, "x": "ああ。この回では、そこがあとで効いてくる。"}, {"t": 481.6666666666667, "x": "13年前のテープを、また見たってこと。"}, {"t": 484.4166666666667, "x": "そうなる。"}, {"t": 485.1166666666667, "x": "事件が起きた直後は、見るべきものが多すぎる。"}, {"t": 488.01666666666665, "x": "目撃者を探し、近所を回り、\n被害者の人間関係を当たる。"}, {"t": 492.05, "x": "そのあいだ、証拠品は袋に入って倉庫にある。"}, {"t": 495.06666666666666, "x": "手がかりが尽きてから、もう一度その袋を開ける。"}, {"t": 498.18333333333334, "x": "……順番が逆な気もするけど。"}, {"t": 500.0833333333333, "x": "逆じゃない。当時は、テープに付いた\n毛を調べる意味が小さかった。"}, {"t": 503.8833333333333, "x": "技術が上がってから見直すと、\n意味が出てくる物がある。"}, {"t": 507.1333333333333, "x": "この事件では、それが何度か起きている。"}, {"t": 510.21666666666664, "x": "現場にあったもので、いちばん\n重いのは、たぶんこれだ。"}, {"t": 513.4, "x": "マッチ箱が一つ。"}, {"t": 514.85, "x": "マッチ箱。"}, {"t": 515.8166666666667, "x": "そのマッチ箱は、もともと\n2階の仏壇の近くに置いてあったものだと\n報じられている。"}, {"t": 520.7833333333333, "x": "それが、1階の玄関のあたりに落ちていた。"}, {"t": 523.6333333333333, "x": "……2階のものが、1階に。"}, {"t": 525.5, "x": "ああ。誰かが持って下りたということだ。"}, {"t": 527.75, "x": "そして、そのマッチ箱から、血液が採れている。"}, {"t": 530.85, "x": "血液型はA型。"}, {"t": 532.4, "x": "家族の誰かじゃないの。"}, {"t": 533.9666666666667, "x": "家族にA型の人はいなかった。そう報じられている。"}, {"t": 537.2, "x": "ここは、報道だけじゃない。"}, {"t": 538.85, "x": "警視庁が、公開捜査のページに、\n犯人の特徴としてこう書いている。"}, {"t": 543.2333333333333, "x": "「男性」「犯行当時、何らかのケガを\n負い出血していた」「血液型はA型」。"}, {"t": 548.1833333333333, "x": "この3つだ。これが、警視庁が\n公表している犯人像の全部だ。"}, {"t": 552.3666666666667, "x": "……ケガをして、出血していた。"}, {"t": 554.4666666666667, "x": "そういうことになる。"}, {"t": 555.6333333333333, "x": "現場に、その人の血が残っていた。"}, {"t": 558.0333333333333, "x": "それで、A型の男性だ、と。"}, {"t": 560.2666666666667, "x": "それ以上のことは。"}, {"t": 561.5666666666667, "x": "警視庁のページには書いていない。"}, {"t": 563.4833333333333, "x": "年齢も、職業も、住んでいる場所も書いていない。"}, {"t": 566.5666666666667, "x": "だから私も、そこから先は足さない。"}, {"t": 569.0666666666667, "x": "この3つを、そのまま置いておく。"}, {"t": 571.2166666666667, "x": "マッチ箱って、火をつけるためよね。"}, {"t": 573.6166666666667, "x": "そう考えるのが自然だろうな。"}, {"t": 575.4666666666667, "x": "ただ、それが2階から1階に落ちている。"}, {"t": 578.0166666666667, "x": "火がつけられたのは2階だ。"}, {"t": 579.85, "x": "……じゃあ、1階に持って下りたのはどうしてなの。"}, {"t": 582.5333333333333, "x": "分からない。"}, {"t": 583.3, "x": "出ていくときに持っていて、\n玄関で落としたのかもしれない。"}, {"t": 586.6833333333333, "x": "私が言えるのは、その箱が\n1階の玄関付近にあった、というところまでだ。"}, {"t": 591.3333333333334, "x": "ただ、落ちていてくれたおかげで、\n火に巻かれずに残った。"}, {"t": 594.8666666666667, "x": "……残ったのね。"}, {"t": 595.9666666666667, "x": "残った。2階にあったら、燃えていたかもしれない。"}, {"t": 599.0166666666667, "x": "この事件でいちばん重い証拠は、\nたまたま1階に落ちていた。"}, {"t": 603.2166666666667, "x": "ここまでを並べると、一つのことが見えてくる。"}, {"t": 606.2, "x": "なに。"}, {"t": 606.85, "x": "家に入った人は、すぐには\n出ていっていない、ということだ。"}, {"t": 610.3333333333334, "x": "これは私の想像じゃない。"}, {"t": 611.8, "x": "公表されていることを並べるとそうなる、という話だ。"}, {"t": 615.1, "x": "一つ。刃物と粘着テープを外から持ち込んでいる。"}, {"t": 618.4166666666666, "x": "二つ。2階の仏壇の近くにあった\nマッチ箱が、1階の玄関付近に落ちている。"}, {"t": 623.5833333333334, "x": "三つ。1階の居間の戸棚の中にあった\n1万円札が無くなっている。"}, {"t": 627.8333333333334, "x": "四つ。2階で火がつけられている。"}, {"t": 630.15, "x": "……2階と1階を、行き来してるのね。"}, {"t": 632.5, "x": "そうなる。"}, {"t": 633.1833333333333, "x": "2階に上がり、1階の戸棚を開け、\nまた2階で火をつけて、出ていっている。"}, {"t": 637.7, "x": "戸棚の中のお札を見つけるには、\n戸棚を開けて中を探さないといけない。"}, {"t": 642.0333333333333, "x": "それだけの動きをしている。"}, {"t": 643.7666666666667, "x": "49分のうち、どのくらいなのかしら。"}, {"t": 646.5166666666667, "x": "そこは誰にも言えない。"}, {"t": 647.8833333333333, "x": "4時20分の物音が本当にその家のものだったとしても、\nそこから出火まで15分ある。"}, {"t": 653.4333333333333, "x": "ただ、「入って、すぐ逃げた」という\n形では、ここまでのことは起きない。"}, {"t": 657.85, "x": "警視庁が事件を「殺人放火事件」という\n一つの名前で呼んでいるのも、そういうことだろう。"}, {"t": 663.4833333333333, "x": "……こわいわね。ずっと\n家の中にいたってことでしょう。"}, {"t": 666.4166666666666, "x": "ああ。しかも、外は明るい。夕方4時台だ。"}, {"t": 669.45, "x": "そのあいだ、通りには人が歩いていた。"}, {"t": 671.8166666666667, "x": "だからこそ、次の話が出てくる。"}, {"t": 674.75, "x": "目撃情報だ。"}, {"t": 675.95, "x": "警視庁は、この事件で、目撃された\n人物の絵を2回公開している。"}, {"t": 680.4, "x": "1回目は2018年9月。"}, {"t": 682.5333333333333, "x": "事件当日の午後3時55分ごろ、\n被害者宅の玄関先で見られた人物のイラストだ。"}, {"t": 688.1666666666666, "x": "身長はおよそ160センチ。"}, {"t": 690.0333333333333, "x": "中肉からやや痩せ型。"}, {"t": 691.6833333333333, "x": "黄土色のコートに、黒っぽいズボン。"}, {"t": 693.7833333333333, "x": "雨が降っていたのに、傘を\nささずに、その家を見ていたという。"}, {"t": 697.5166666666667, "x": "……3時55分。お母さんが出た5分後じゃない。"}, {"t": 700.4, "x": "そうなる。"}, {"t": 701.1, "x": "2回目は2021年8月。"}, {"t": 703.3666666666667, "x": "同じ日の午後3時30分ごろ、\n現場の南側の交差点で見られた人物だ。"}, {"t": 708.2833333333333, "x": "身長は150から160センチくらい。"}, {"t": 710.8166666666667, "x": "痩せ型。黒い傘をさして立っていた。"}, {"t": 713.3166666666667, "x": "警視庁は、この2人が同じ人物である\n可能性が高いとみている。"}, {"t": 717.4833333333333, "x": "……立っていた。ずっと。"}, {"t": 718.9833333333333, "x": "そして、2026年9月3日。"}, {"t": 721.55, "x": "警視庁は、その人物の3D画像を新しく公開した。"}, {"t": 725.1666666666666, "x": "立体で作った画像だ。"}, {"t": 726.8333333333334, "x": "身長は150から160センチくらい。"}, {"t": 729.35, "x": "黄土色のコート。黒い傘。"}, {"t": 731.3, "x": "事件の直前、現場から15メートル離れた\n裏路地の交差点で見られている。"}, {"t": 735.8, "x": "この画像は、事件から30年になる9月9日に、\n警視庁のウェブサイトにも載せられた。"}, {"t": 741.45, "x": "30年たってから、新しい絵を出したのね。"}, {"t": 744.3666666666667, "x": "ああ。"}, {"t": 744.7833333333333, "x": "ここで一つ、はっきりさせておく。"}, {"t": 746.95, "x": "これは「目撃された人物」であって、\n「犯人」ではない。"}, {"t": 750.6833333333333, "x": "警視庁も、犯人の特徴としては、\nさっきの3つしか書いていない。"}, {"t": 754.9, "x": "この人が事件に関わっているか\nどうかは、分かっていない。"}, {"t": 758.4, "x": "……話を聞きたい人、ってことね。"}, {"t": 760.6333333333333, "x": "そういうことだ。"}, {"t": 762.25, "x": "ここで、時代の話をする。"}, {"t": 764.1666666666666, "x": "1996年というのは、科学捜査に\nとって、ちょうど境目の時期だった。"}, {"t": 769.35, "x": "境目。"}, {"t": 770.2, "x": "血液型で人を絞っていた時代と、\nDNA型で人を絞る時代の、あいだだ。"}, {"t": 775.2166666666667, "x": "これについては、いい資料がある。国会の議事録だ。"}, {"t": 778.3666666666667, "x": "1992年、平成4年4月7日。"}, {"t": 781.3666666666667, "x": "参議院の地方行政委員会。"}, {"t": 783.2833333333333, "x": "警察庁の刑事局長が、DNA型鑑定とは\n何かを、議員に説明している。"}, {"t": 788.4333333333333, "x": "事件の4年前だな。"}, {"t": 790.0166666666667, "x": "4年前。ちょうどそのころなのね。"}, {"t": 792.2, "x": "局長はこう言っている。"}, {"t": 793.5833333333334, "x": "「これまで血液であるとか、あるいは精液といった\n検査資料から個人識別を行う方法といたしましては、"}, {"t": 799.8833333333333, "x": "……4種類。"}, {"t": 800.7666666666667, "x": "そうだ。血液型だけだと、日本人の4割ほどがA型だ。"}, {"t": 804.7333333333333, "x": "A型の男性、というだけでは、\n何百万人も残ってしまう。"}, {"t": 808.5666666666667, "x": "続きがある。"}, {"t": 809.4333333333333, "x": "「このDNA型鑑定というものにおきましては、\n鑑定資料が十分にありますれば一つの検査方法で"}, {"t": 815.6166666666667, "x": "4種類から、数千万分の一。すごい差ね。"}, {"t": 818.8, "x": "この年の2月、水戸地方裁判所で、DNA型鑑定が\n決め手になった有罪判決が出ている。"}, {"t": 824.85, "x": "局長は、その鑑定書では「七千万人に一人」という\n確率で判定した、と説明している。"}, {"t": 831.0, "x": "これが1992年の到達点だ。"}, {"t": 834.3666666666667, "x": "ただし、この日の答弁には、続きがある。"}, {"t": 837.0166666666667, "x": "私は、こっちのほうが大事だと思っている。"}, {"t": 839.8, "x": "続き。"}, {"t": 840.5833333333334, "x": "同じ局長が、同じ日に、こう言っているんだ。"}, {"t": 843.5, "x": "「犯罪の現場からとられます資料と申しますものは\n常に私どもの満足のいくようなものでは"}, {"t": 849.0166666666667, "x": "現場のものは、きれいには取れないのね。"}, {"t": 851.4833333333333, "x": "ああ。火が出た家なら、なおさらだ。"}, {"t": 853.6833333333333, "x": "そして、こう続く。"}, {"t": 855.1, "x": "「指紋と違います。指紋の場合は、指紋が\n一致したといったらもうたった一人の人間を"}, {"t": 860.3333333333334, "x": "「DNA型鑑定の結果だけを頼りにして捜査をすると\nいうようなことではいけないわけでありまして、"}, {"t": 865.9666666666667, "x": "……鑑定だけに頼るな、って\n言ってるのね。1992年に。"}, {"t": 870.1, "x": "そう言っている。警察庁の刑事局長本人が、国会で。"}, {"t": 873.8333333333334, "x": "この言葉の重さは、あとで分かることになる。"}, {"t": 876.5166666666667, "x": "この回で前に扱った足利事件では、\nDNA型鑑定の結論が2回ひっくり返っている。"}, {"t": 882.25, "x": "2015年、警察庁の審議官は、国会でこう言っている。"}, {"t": 886.0666666666667, "x": "足利事件の検証を行い、「鑑定記録、"}, {"t": 888.7333333333333, "x": "鑑定資料の適切な取扱いを\n徹底させる」などの対策を講じてきた、と。"}, {"t": 893.8666666666667, "x": "……鑑定は万能じゃない、ということね。"}, {"t": 896.1833333333333, "x": "そうだ。私もこの回で\n「DNAが出たから間違いない」とは言わない。"}, {"t": 901.15, "x": "では、1996年の警察には、\n何ができて、何ができなかったのか。"}, {"t": 906.35, "x": "ここも国会の答弁で分かる。"}, {"t": 908.25, "x": "2015年、平成27年5月21日。"}, {"t": 911.45, "x": "参議院の法務委員会。"}, {"t": 913.0166666666667, "x": "警察庁の長官官房審議官が、\n鑑定の方式の移り変わりを説明している。"}, {"t": 918.1666666666666, "x": "方式が変わったの。"}, {"t": 919.6166666666667, "x": "変わった。"}, {"t": 920.35, "x": "昔の方式は、エムシーティー118型という。"}, {"t": 923.4666666666667, "x": "審議官はこう言っている。"}, {"t": 924.95, "x": "「MCT一一八と呼ばれる一つの部位についての\n有機化合物の配列の繰り返しの数を数えるという"}, {"t": 931.15, "x": "一つの部位。"}, {"t": 932.1833333333333, "x": "そう。DNAのうち、たった一か所だけを見ていた。"}, {"t": 935.3166666666667, "x": "そして、いまの方式はこうだ。"}, {"t": 937.2833333333333, "x": "「現在は、STR型検査法と申しまして、\n十五の部位について同じようにその繰り返しの回数を"}, {"t": 943.4, "x": "「これによりまして個人識別精度が\n向上いたしまして……\n約四兆七千億人に一人という確率でしか"}, {"t": 949.9333333333333, "x": "……4兆7000億人に一人。"}, {"t": 951.9333333333333, "x": "地球の人口の500倍以上だな。"}, {"t": 954.1, "x": "1996年に現場から取ったものを、\n1996年の技術で見ていたら、そこまでは出ない。"}, {"t": 960.8, "x": "一か所しか見ていないからだ。"}, {"t": 962.6666666666666, "x": "じゃあ、当時は絞り切れなかったのね。"}, {"t": 965.0166666666667, "x": "そうだ。当時は\n「A型の男性」というところまでしか行けなかった。"}, {"t": 969.1333333333333, "x": "ただ、ここが大事なんだが。"}, {"t": 970.9166666666666, "x": "現場から取ったものは、捨てられていなかった。"}, {"t": 974.3, "x": "2014年9月。事件から18年後だ。"}, {"t": 977.35, "x": "2階の布団に付いていた血液から、\nDNA型が検出されたと報じられた。"}, {"t": 982.2, "x": "そして、そのDNA型は、あの1階に落ちていた\nマッチ箱から採れたものと一致した。"}, {"t": 987.5833333333334, "x": "……18年前の血から。"}, {"t": 989.2666666666667, "x": "ああ。"}, {"t": 989.6833333333333, "x": "1996年には、A型としか分からなかった。"}, {"t": 993.3166666666667, "x": "2014年には、同じ人のものだと\n言えるところまで来た。"}, {"t": 996.9166666666666, "x": "技術のほうが追いついてきたわけだ。"}, {"t": 999.1, "x": "でも、現場のものが残っていなかったら、\n追いついても意味がないわよね。"}, {"t": 1003.3166666666667, "x": "そこだ。今日いちばん言いたいのは、たぶんそこだ。"}, {"t": 1006.15, "x": "18年間、証拠が保管されていた。だから、\n新しい技術で見直すことができた。"}, {"t": 1011.45, "x": "逆に言えば、捨てていたら終わっていた。"}, {"t": 1013.7333333333333, "x": "この「保管」というのは、言うほど簡単な話じゃない。"}, {"t": 1017.1166666666667, "x": "2016年、警察庁の刑事局長が、\n参議院の決算委員会でこう言っている。"}, {"t": 1022.2666666666667, "x": "「未解決事件の証拠物件等を長期にわたり\n保管することは、収容能力や適切な管理の面からは"}, {"t": 1028.7, "x": "……場所も人も要るものね。"}, {"t": 1030.35, "x": "ああ。しかも、いつまで\n持っていればいいのかが決まらない。"}, {"t": 1033.4666666666667, "x": "局長は、こうも言っている。"}, {"t": 1035.05, "x": "長期の未解決事件については、「\n有力情報の掘り下げ、証拠資料の"}, {"t": 1039.65, "x": "再鑑定。持っているから、もう一度かけられる。"}, {"t": 1042.7333333333333, "x": "持ってなかったら、もう一度が無いのね。"}, {"t": 1045.7166666666667, "x": "ここから、時効の話に入る。"}, {"t": 1047.85, "x": "1996年当時、殺人罪の公訴時効は15年だった。"}, {"t": 1052.4, "x": "15年。"}, {"t": 1053.2666666666667, "x": "事件は1996年9月9日だ。"}, {"t": 1056.3166666666666, "x": "15年後は、2011年9月9日になる。"}, {"t": 1059.5, "x": "本当なら、その日で終わっていた。"}, {"t": 1061.75, "x": "……終わる、っていうのは。"}, {"t": 1063.0833333333333, "x": "その日を過ぎたら、犯人が\n分かっても、もう起訴できない。"}, {"t": 1066.55, "x": "裁判にかけられない。"}, {"t": 1067.7833333333333, "x": "捜査本部も畳まれる。"}, {"t": 1069.3666666666666, "x": "ところが、2011年9月9日は来た。だが、\n時効は来なかった。"}, {"t": 1074.1166666666666, "x": "どうして。"}, {"t": 1074.95, "x": "その1年4か月あまり前に、時効そのものが\n法律から消えていたからだ。"}, {"t": 1079.5166666666667, "x": "2010年4月27日。"}, {"t": 1081.6, "x": "殺人の公訴時効を廃止する法律が、\nその日に成立して、その日に施行された。"}, {"t": 1086.8333333333333, "x": "平成22年法律第26号だ。"}, {"t": 1089.5333333333333, "x": "ぎりぎりじゃない。"}, {"t": 1090.6, "x": "ぎりぎりだ。"}, {"t": 1091.4166666666667, "x": "この法律には、附則でこう書いてある。"}, {"t": 1093.85, "x": "「その施行前に犯した罪であって施行の際時効が\n完成していないものについても適用する」。"}, {"t": 1099.25, "x": "つまり、2010年4月27日の時点で、まだ\n時効が来ていない事件には、この法律が効く。"}, {"t": 1105.45, "x": "柴又の事件の時効が来るのは、2011年9月9日だった。"}, {"t": 1109.7833333333333, "x": "まだ来ていなかった。だから、効いた。"}, {"t": 1112.25, "x": "……1年4か月。それだけ遅かったら。"}, {"t": 1114.9166666666667, "x": "終わっていた。"}, {"t": 1115.9, "x": "法律って、そんなぎりぎりで決まるものなの。"}, {"t": 1118.7166666666667, "x": "この法律については、そうだった。"}, {"t": 1120.9, "x": "法務省に勉強会ができたのが2009年。"}, {"t": 1123.65, "x": "法制審議会に諮問されたのが同じ年の秋。"}, {"t": 1126.5833333333333, "x": "そこから半年で、成立している。"}, {"t": 1128.8833333333334, "x": "普通の法律の作り方からすると、かなり速い。"}, {"t": 1132.1166666666666, "x": "急いだのね。"}, {"t": 1133.1666666666667, "x": "急いでいる。理由は単純で、\n待っているあいだにも時効は進むからだ。"}, {"t": 1137.3166666666666, "x": "審議をゆっくりやれば、その分だけ、\n線の向こう側に落ちる事件が増える。"}, {"t": 1141.6833333333334, "x": "実際、この法律が施行されたのは、\n成立したその日だ。"}, {"t": 1145.4166666666667, "x": "公布と施行を同じ日にしている。"}, {"t": 1147.4833333333333, "x": "……1日も空けなかったのね。"}, {"t": 1149.3166666666666, "x": "空けていない。"}, {"t": 1150.7833333333333, "x": "そういえば、時効って途中で\n延びたって聞いたことがあるわ。"}, {"t": 1154.2, "x": "ああ、それが面白いところだ。"}, {"t": 1156.0833333333333, "x": "2004年、平成16年の改正で、殺人の公訴時効は\n15年から25年に延ばされている。"}, {"t": 1162.3333333333333, "x": "じゃあ、この事件も25年になったんじゃないの。"}, {"t": 1165.2666666666667, "x": "ならなかった。"}, {"t": 1166.3666666666666, "x": "え。"}, {"t": 1166.8166666666666, "x": "この改正の施行は2005年1月1日だ。"}, {"t": 1169.8, "x": "そして附則に、こう書いてあった。"}, {"t": 1171.8833333333334, "x": "「この法律の施行前に犯した\n罪の公訴時効の期間については、\nなお従前の例による」。"}, {"t": 1177.2166666666667, "x": "……施行より前の事件には効かない、ってことね。"}, {"t": 1180.0166666666667, "x": "そうだ。柴又の事件は1996年。"}, {"t": 1183.0333333333333, "x": "2005年より前だ。"}, {"t": 1184.4833333333333, "x": "だから、15年のまま据え置かれた。"}, {"t": 1186.7833333333333, "x": "25年になっていたら、時効が来るのは2021年だった。"}, {"t": 1190.7166666666667, "x": "15年のままだったから、2011年だった。"}, {"t": 1193.9166666666667, "x": "……じゃあ、2010年の法律が間に合わなかったら。"}, {"t": 1196.9333333333334, "x": "2011年9月9日で、この事件は終わっていた。"}, {"t": 1200.4166666666667, "x": "2004年の改正は、この事件には届かなかった。"}, {"t": 1203.65, "x": "2010年の改正だけが、届いた。"}, {"t": 1206.2, "x": "同じ「時効を延ばす」でも、\n届くのと届かないのがあるのね。"}, {"t": 1210.15, "x": "そこが、この回でいちばん分かりにくいところだ。"}, {"t": 1212.9666666666667, "x": "2004年は「これから起きる事件だけ」。"}, {"t": 1215.45, "x": "2010年は「まだ時効が来ていない、\n進行中の事件も」。"}, {"t": 1219.1833333333334, "x": "そこが違う。"}, {"t": 1220.2666666666667, "x": "一文字の違いで、事件が\n生き残ったり、消えたりするのね。"}, {"t": 1224.0666666666666, "x": "そういうことになる。"}, {"t": 1225.8666666666666, "x": "ただ、2010年の法律にも、届かなかった事件がある。"}, {"t": 1229.6833333333334, "x": "届かなかった。"}, {"t": 1230.9, "x": "すでに時効が来てしまっていた事件だ。"}, {"t": 1233.2166666666667, "x": "2010年4月27日の時点で、もう時効が\n完成していた事件には、この法律は効かない。"}, {"t": 1239.35, "x": "……そっちは、そのままなのね。"}, {"t": 1241.2666666666667, "x": "そのままだ。いま犯人が分かっても、起訴できない。"}, {"t": 1244.4, "x": "この線引きについては、国会で、\n遺族の側からはっきりした発言が出ている。"}, {"t": 1249.1833333333334, "x": "2010年4月23日、\n衆議院の法務委員会。参考人質疑だ。"}, {"t": 1253.9166666666667, "x": "招かれた参考人の一人が、\n殺人事件被害者遺族の会の代表幹事だった。"}, {"t": 1259.0, "x": "この人は、こう答えている。"}, {"t": 1260.8, "x": "「今回の私どものいわゆる要求の中には、\n時効を完成してしまった被害者遺族まで遡及を"}, {"t": 1266.4333333333334, "x": "「私たちは、そこは割り切って、あくまでも\n現在進行中の被害者遺族に限ってというふうに"}, {"t": 1272.2166666666667, "x": "……自分たちで、線を引いたのね。"}, {"t": 1274.3333333333333, "x": "そうだ。"}, {"t": 1274.9333333333334, "x": "この会には、当時22の事件の遺族が入っていた。"}, {"t": 1278.2833333333333, "x": "そのうち3つは、すでに\n時効が来てしまった事件の遺族だった。"}, {"t": 1282.0833333333333, "x": "つまり、この法律ができても救われない\n人たちが、同じ会の中にいた。"}, {"t": 1286.7333333333333, "x": "……それでも一緒に運動していたの。"}, {"t": 1288.8, "x": "していた。"}, {"t": 1289.55, "x": "その人たちの話として、代表幹事はこう紹介している。"}, {"t": 1293.3166666666666, "x": "時効が完成する瞬間、「秒針が午前零時を指した、\nその瞬間に捜査をお願いしている看板がまず"}, {"t": 1299.4833333333333, "x": "「まさに警察の方から縁を切られたような、\nそういった非常に無念な気持ちを味わっておる」。"}, {"t": 1304.65, "x": "……看板が外される。"}, {"t": 1306.0666666666666, "x": "ああ。柴又の事件は、その線のこちら側で止まった。"}, {"t": 1310.1666666666667, "x": "いま話した参考人について、\n一つ言っていないことがある。"}, {"t": 1313.85, "x": "なに。"}, {"t": 1314.4666666666667, "x": "この人は、柴又の事件のご遺族だ。"}, {"t": 1317.1666666666667, "x": "……え。"}, {"t": 1317.65, "x": "2010年4月23日、衆議院法務委員会。"}, {"t": 1321.0, "x": "意見陳述は、こう始まっている。"}, {"t": 1323.1833333333334, "x": "「初めに、私は、平成八年九月九日、\n東京都葛飾区柴又三丁目の自宅で、\n二十一歳の次女◯◯を"}, {"t": 1330.7833333333333, "x": "……その日の話から始めてるのね。"}, {"t": 1333.05, "x": "ああ。なお、ここで私が「マル、マル」と\n読んだところには、本当はお名前が入っている。"}, {"t": 1338.5666666666666, "x": "会議録にも、報道にも、はっきり載っている。"}, {"t": 1341.4666666666667, "x": "ただ、この動画では伏せさせてもらう。\nそこはご家族が決めることだと思うからだ。"}, {"t": 1346.1833333333334, "x": "続きを読む。"}, {"t": 1347.1166666666666, "x": "「私は会社の業務で福島に出張中、妻は\n美容院の仕事で出かけ、長女は看護婦として病院で"}, {"t": 1353.3833333333334, "x": "家族全員が、それぞれの場所にいた。\nそういう日だったということだ。"}, {"t": 1357.4, "x": "そして、こう続く。"}, {"t": 1358.7833333333333, "x": "「かけがえのない最愛の家族を、殺人という憎むべき\n犯罪によって命を奪われ、しかも、私の場合は、"}, {"t": 1365.35, "x": "……思い出まで。"}, {"t": 1366.3333333333333, "x": "家が燃えているからな。"}, {"t": 1367.5333333333333, "x": "写真も、手紙も、残らない。"}, {"t": 1369.7166666666667, "x": "そして、意見陳述の中で\nいちばん短い一文が、これだ。"}, {"t": 1373.5666666666666, "x": "「そして最後は、この世の中には正義は\n存在するのだろうかと、時折天を仰ぐことがあります」"}, {"t": 1378.9666666666667, "x": "……。"}, {"t": 1379.9, "x": "この日、この人は、こうも言っている。"}, {"t": 1382.2333333333333, "x": "「事件以来、きょうで十三年七カ月と\n十七日過ぎて、いまだ犯人が捕まらない中」。"}, {"t": 1387.85, "x": "日数まで数えてるのね。"}, {"t": 1389.55, "x": "数えている。"}, {"t": 1391.0166666666667, "x": "この参考人質疑には、もう一つ、\n読んでおきたいやり取りがある。"}, {"t": 1394.9666666666667, "x": "時効を無くしたら、警察はいつまでも\n捜査を続けなければならない。人も金も要る。"}, {"t": 1400.0166666666667, "x": "そういう指摘に対する答えだ。"}, {"t": 1402.1, "x": "捜査の側の負担ね。"}, {"t": 1403.7, "x": "ああ。それに対して、この人はこう答えている。"}, {"t": 1406.6166666666666, "x": "「私たちは……当初の捜査体制を永久に\n保ってほしいと言っているわけでは\n決してないわけです」"}, {"t": 1412.0833333333333, "x": "「たとえそれが縮小されたとしましても、やはり\n警察がいつも犯人を追いかけていてくれる、"}, {"t": 1417.35, "x": "……体制を戻せ、じゃないのね。"}, {"t": 1419.3333333333333, "x": "違う。「追いかけていてくれること」を求めている。"}, {"t": 1422.25, "x": "そして、こう続く。"}, {"t": 1423.65, "x": "「十五年あるいは二十五年で\n心の区切りをつけなさいという、\nそういった心の区切りを法によって"}, {"t": 1429.2666666666667, "x": "……法律に、区切られる。"}, {"t": 1430.8333333333333, "x": "この言い方は、私はずっと覚えている。"}, {"t": 1433.2666666666667, "x": "時効というのは、\n犯人のための制度だと思われがちだ。"}, {"t": 1436.5833333333333, "x": "だが、遺族の側から見ると、\n「そこで終わりにしなさい」と\n国から言われる日でもある。"}, {"t": 1441.4666666666667, "x": "この意見陳述の最後は、お礼で終わっている。"}, {"t": 1444.25, "x": "「署名活動に御協力いただいた約八万人の方々を\n初め、手紙、メール等で激励を賜りました"}, {"t": 1450.7666666666667, "x": "8万人と、10万人。"}, {"t": 1452.6666666666667, "x": "この法律は、そうやって通った。"}, {"t": 1454.7833333333333, "x": "そして4日後の4月27日に\n成立して、その日から効き始めた。"}, {"t": 1459.9833333333333, "x": "ここからは、いまこの事件に\n何がかかっているか、という話をする。"}, {"t": 1464.0333333333333, "x": "懸賞金だ。"}, {"t": 1465.1333333333334, "x": "警察がお金を出すやつね。"}, {"t": 1467.0666666666666, "x": "ああ。正式には「捜査特別報奨金」という。"}, {"t": 1470.2666666666667, "x": "これも、成り立ちが国会で説明されている。"}, {"t": 1473.0166666666667, "x": "2007年10月25日、参議院の内閣委員会。"}, {"t": 1476.5, "x": "当時の国家公安委員長の答弁だ。"}, {"t": 1478.85, "x": "「この問題は、民間で先に実施され、捜査協力に\n関する懸賞広告の中に直接事件と結び付きます"}, {"t": 1485.9666666666667, "x": "民間が先だったの。"}, {"t": 1487.55, "x": "そうだ。遺族や有志がお金を出して\n呼びかけるほうが先にあった。"}, {"t": 1491.35, "x": "それを見て、国のほうが制度にした。"}, {"t": 1493.6333333333334, "x": "「未解決の重要凶悪事件に関する情報提供を\n促進すると、そしてその検挙に資することを"}, {"t": 1499.55, "x": "2007年4月1日開始だ。"}, {"t": 1501.8, "x": "そして「本年五月一日の第一回懸賞広告以降、\nこれまで……凶悪事件十四件について、"}, {"t": 1508.1, "x": "最初は14件だったのね。"}, {"t": 1510.05, "x": "ああ。"}, {"t": 1510.45, "x": "この答弁には、効き目についての数字も出てくる。"}, {"t": 1513.4166666666667, "x": "「第一回広告では、この実施前は\n月に約十件余りの情報が、\n実施後は月三十四件に増える」。"}, {"t": 1519.8666666666666, "x": "月10件が、月34件。3倍以上ね。"}, {"t": 1523.1666666666667, "x": "そういう仕組みだ。"}, {"t": 1524.2833333333333, "x": "いまの制度では、上限は原則300万円。"}, {"t": 1527.0166666666667, "x": "特に必要がある場合は、1000万円を超えない範囲で"}, {"t": 1530.2833333333333, "x": "応募の期間は、原則1年間だ。"}, {"t": 1533.3166666666666, "x": "では、柴又の事件にはいくらかかっているのか。"}, {"t": 1536.25, "x": "総額で、上限800万円だ。"}, {"t": 1538.6666666666667, "x": "800万円。"}, {"t": 1539.8333333333333, "x": "内訳はこうだ。"}, {"t": 1540.9, "x": "警察庁の捜査特別報奨金が、上限300万円。"}, {"t": 1544.6666666666667, "x": "それとは別に、民間の団体が出している\n謝礼金が、上限500万円。"}, {"t": 1549.2166666666667, "x": "この団体は、被害者の女性のお名前を\n冠した「捜査に協力する会」という名前だ。"}, {"t": 1554.7, "x": "……名前を付けて、会を作ったのね。"}, {"t": 1557.0, "x": "ああ。合わせて800万円になる。"}, {"t": 1559.1166666666666, "x": "警察庁の300万円のほうは、2010年から\n対象になったと報じられている。"}, {"t": 1564.0166666666667, "x": "そして期間は、原則1年だ。"}, {"t": 1566.4, "x": "じゃあ、毎年切れるってこと。"}, {"t": 1568.35, "x": "切れる。切れるから、毎年、延長を決めている。"}, {"t": 1571.4166666666667, "x": "いま出ている期間は、\n警視庁のページにこう書いてある。"}, {"t": 1574.5166666666667, "x": "「令和8年9月9日から令和9年9月8日まで」。"}, {"t": 1578.0833333333333, "x": "……9月9日から。"}, {"t": 1579.5333333333333, "x": "ああ。事件が起きた日から、次の年の前日まで。"}, {"t": 1582.8166666666666, "x": "毎年、その日に1年ぶん延ばしている。"}, {"t": 1585.3666666666666, "x": "今年もそうした。事件から30年の、その日にだ。"}, {"t": 1588.85, "x": "ここまでにこの事件に投入された捜査員は、\n延べで12万人を超えると報じられている。"}, {"t": 1594.05, "x": "寄せられた情報は、1843件。"}, {"t": 1597.0333333333333, "x": "1843件も来て、それでも分からないのね。"}, {"t": 1600.6, "x": "そして、近ごろは情報が減っているそうだ。"}, {"t": 1603.25, "x": "だから、30年の節目に、新しい3D画像を出した。"}, {"t": 1607.1333333333334, "x": "懸賞金って、もらえる人に条件があるのかしら。"}, {"t": 1610.4, "x": "ある。警察庁がはっきり書いている。"}, {"t": 1612.6333333333334, "x": "匿名の人は対象にならない。"}, {"t": 1614.4666666666667, "x": "警察職員も対象外だ。"}, {"t": 1616.4166666666667, "x": "被疑者本人と共犯者も、当然ながら対象外。"}, {"t": 1619.6333333333334, "x": "情報を手に入れる過程で自分が\n犯罪をした人も、対象外だ。"}, {"t": 1623.6166666666666, "x": "……匿名は駄目なのね。"}, {"t": 1625.0833333333333, "x": "駄目だ。名乗って、情報の中身を\n確かめられる形でないと、支払えない。"}, {"t": 1629.75, "x": "金額も、言った人に全額が行くとは限らない。"}, {"t": 1632.85, "x": "「被疑者の検挙又は事件の解決への寄与の度合いに\n応じて」支払う、と書いてある。"}, {"t": 1637.7833333333333, "x": "複数の人が情報を出したら、分けることになる。"}, {"t": 1641.0, "x": "くじ引きみたいなものじゃないのね。"}, {"t": 1643.0333333333333, "x": "全然違う。あくまで、捜査に効いたかどうかで決まる。"}, {"t": 1647.0166666666667, "x": "柴又という町は、帝釈天の門前町だ。"}, {"t": 1649.95, "x": "映画で見たことがある人も多いだろう。"}, {"t": 1652.0666666666666, "x": "あの通りの、すぐ近くで起きた事件だ。"}, {"t": 1654.7166666666667, "x": "あんなに人が歩いている町なのね。"}, {"t": 1656.9333333333334, "x": "ああ。だから、余計に分からない。"}, {"t": 1659.0, "x": "被害者の家はもう無い。"}, {"t": 1660.2666666666667, "x": "取り壊されている。"}, {"t": 1661.5, "x": "その場所には、小さなお地蔵さんが立っている。"}, {"t": 1664.2, "x": "被害者の女性のお名前を取った、お地蔵さんだ。"}, {"t": 1667.1166666666666, "x": "命日には、ご家族や友人が花を供えている。"}, {"t": 1670.25, "x": "……30年、続いているのね。"}, {"t": 1672.2, "x": "そして、捜査のほうも続いている。"}, {"t": 1674.3833333333334, "x": "報道によれば、地元では、A型の男性の多くが\n任意のDNA検査に応じているという。"}, {"t": 1679.7333333333333, "x": "髪の毛を出してほしい、と\n頼まれて、応じた人たちだ。"}, {"t": 1683.3166666666666, "x": "町の人が、協力してるのね。"}, {"t": 1685.6166666666666, "x": "ああ。"}, {"t": 1686.05, "x": "それと、これは2026年の記事に出ていた話だが。"}, {"t": 1689.6166666666666, "x": "事件のころ20代だった警視庁捜査一課の若い\n捜査員が、いまは定年の直前になっている。"}, {"t": 1695.4333333333334, "x": "その人が、いまも同じ町の同じ店に、\nふらっと来るそうだ。"}, {"t": 1699.2166666666667, "x": "「ちょっと聞きたいことが」と言って、前にも\n聞かれたようなことを、また聞いていく。"}, {"t": 1703.9, "x": "……30年、同じ人が。"}, {"t": 1705.7333333333333, "x": "さっきの「かすかな希望があることが\n唯一心のよりどころになる」という言葉を、"}, {"t": 1710.35, "x": "追いかけていてくれる、ということの中身は、\nたぶんこういうことだ。"}, {"t": 1714.6666666666667, "x": "終わりの前に、分かっていないことを並べておきたい。"}, {"t": 1717.7, "x": "分かっていないこと。"}, {"t": 1719.05, "x": "ああ。この手の話は、分かっていることばかり\n並べると、実際より解けている気がしてくる。"}, {"t": 1724.5, "x": "一つ。誰が家に入ったのかは分かっていない。"}, {"t": 1727.3166666666666, "x": "二つ。何のために入ったのかも分かっていない。"}, {"t": 1730.2, "x": "顔見知りだったという見方、つきまといがあったと\nいう見方、物盗りだという見方。"}, {"t": 1735.0166666666667, "x": "3つとも挙がっているが、どれも決まっていない。"}, {"t": 1737.7, "x": "三つ。凶器は見つかっていない。"}, {"t": 1739.7166666666667, "x": "四つ。持ち込まれた\n粘着テープに付いていた3種類の犬の毛が、\nどこで付いたのかも分かっていない。"}, {"t": 1745.6166666666666, "x": "五つ。目撃されたあの人物が、事件に\n関わっているのかどうかも分かっていない。"}, {"t": 1750.6833333333334, "x": "……ほとんど分かっていないじゃない。"}, {"t": 1752.45, "x": "そうだ。"}, {"t": 1753.0833333333333, "x": "分かっているのは、49分という時間の枠と、\n現場に残された血液とDNA型。"}, {"t": 1758.6333333333334, "x": "それと、A型の男性で、そのとき何らかのケガを\n負って出血していた、という3つの特徴だけだ。"}, {"t": 1764.85, "x": "これは私がそう思っているという話ではない。"}, {"t": 1767.3666666666666, "x": "警視庁が公表しているのが、その3つだけだ。"}, {"t": 1770.5333333333333, "x": "だから、犯人像を勝手に足しちゃいけないのね。"}, {"t": 1773.5333333333333, "x": "足せない。足したら、それは別の話になる。"}, {"t": 1776.3666666666666, "x": "この事件については、詳しい\n考察がネット上にたくさんある。"}, {"t": 1780.0166666666667, "x": "私はそこには乗らない。"}, {"t": 1781.5666666666666, "x": "30年動いていない事件で、実在の誰かを指す\n話を作るのは、私の仕事じゃないと思っている。"}, {"t": 1788.4, "x": "最後に、整理しておく。"}, {"t": 1790.0166666666667, "x": "1996年9月9日、東京都葛飾区柴又三丁目で、\n大学4年生の女性が殺害され、\n室内に火がつけられた。"}, {"t": 1798.7, "x": "当時21歳。留学に出発する2日前だった。"}, {"t": 1802.1833333333334, "x": "時間帯は、午後3時50分ごろから\n午後4時39分までの49分間。"}, {"t": 1807.1, "x": "当時の法律では、殺人の公訴時効は15年。"}, {"t": 1810.1, "x": "2011年9月9日で終わるはずだった。"}, {"t": 1813.0333333333333, "x": "2004年の改正で15年が25年になったが、\n施行前の事件には届かなかった。"}, {"t": 1818.35, "x": "2010年4月27日、公訴時効そのものが\n廃止され、進行中の事件にも適用された。"}, {"t": 1824.45, "x": "この事件は、そのとき残り1年4か月あまりだった。"}, {"t": 1827.9166666666667, "x": "そして、その法律を国会で求めた\n参考人の一人が、この事件のご遺族だった。"}, {"t": 1833.3, "x": "……間に合ったのね。"}, {"t": 1834.45, "x": "間に合った。"}, {"t": 1835.2333333333333, "x": "現場から取られたものは、\n捨てられずに保管されている。"}, {"t": 1838.4166666666667, "x": "技術のほうは、一つの部位を見るやり方から、\n十五の部位を見るやり方に変わった。"}, {"t": 1843.25, "x": "だから、いま情報が一つ\n出てくれば、照合するものはある。"}, {"t": 1846.8833333333334, "x": "そのために、いまも\n懸賞金がかかっている。上限800万円。"}, {"t": 1850.8833333333334, "x": "期間は、令和8年9月9日から令和9年9月8日まで。"}, {"t": 1854.9833333333333, "x": "情報を受け付けているのは、\n警視庁亀有警察署の特別捜査本部だ。"}, {"t": 1859.5333333333333, "x": "事件名は「柴又三丁目女子大生殺人放火事件」。"}, {"t": 1863.1666666666667, "x": "電話は、警視庁亀有警察署の代表番号、\nゼロサン、サンロクゼロナナ、ゼロイチイチゼロ。"}, {"t": 1868.9833333333333, "x": "これは警視庁がウェブサイトに公開している\n番号を、そのまま読んだものだ。"}, {"t": 1873.35, "x": "30年前の、雨の日のことよね。"}, {"t": 1875.8666666666666, "x": "ああ。傘をささずに立っていた\n人を見た、という話でもいい。"}, {"t": 1879.4, "x": "出典を挙げておく。"}, {"t": 1880.6833333333334, "x": "事件の概要、犯人の特徴、懸賞金、\n連絡先は、警視庁の公開捜査のページ。"}, {"t": 1886.4166666666667, "x": "制度の部分は、\n国立国会図書館の国会会議録検索システムから、"}, {"t": 1891.0666666666666, "x": "科学捜査の部分は、\n1992年4月7日の参議院地方行政委員会と、"}, {"t": 1896.2833333333333, "x": "2015年5月21日の参議院法務委員会。"}, {"t": 1899.75, "x": "懸賞金の制度は、\n2007年10月25日の参議院内閣委員会と、\n警察庁のウェブサイト。"}, {"t": 1906.0833333333333, "x": "現場の状況と被害者の方については、東京新聞、\n日本経済新聞、共同通信ほかの報道による。"}, {"t": 1912.6333333333334, "x": "詳しい対応は、リサーチのファイルに全部残してある。"}, {"t": 1915.7333333333333, "x": "最後に一つだけ。"}, {"t": 1917.0666666666666, "x": "この事件は、まだ終わっていない。"}, {"t": 1918.8666666666666, "x": "時効が無いから、終わりようがない。"}, {"t": 1920.9833333333333, "x": "「未解決事件」という言葉は、過去形に聞こえる。"}, {"t": 1924.2666666666667, "x": "だが、この事件の正確な状態は、\n過去形ではなく、いまも捜査中だ、ということだ。"}, {"t": 1929.9333333333334, "x": "……いまも、なのね。"}, {"t": 1931.25, "x": "ああ。だから、この動画も出す\n意味があると思っている。"}, {"t": 1934.2833333333333, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
