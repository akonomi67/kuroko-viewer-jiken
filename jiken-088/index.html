<script>
const D={"name": "088", "file": "088_編集用", "dur": 1946.3833125, "segs": [], "subs": [{"t": 0.0, "x": "1996年9月9日、月曜日。"}, {"t": 3.2, "x": "東京都葛飾区柴又三丁目。"}, {"t": 5.516666666666667, "x": "午後3時50分ごろ、一軒の家から母親が出かけた。"}, {"t": 9.083333333333334, "x": "仕事に向かうところだった。"}, {"t": 10.783333333333333, "x": "家には、大学4年生の娘が\n一人残っていた。当時21歳。"}, {"t": 15.266666666666667, "x": "ふつうの、月曜の昼下がりね。"}, {"t": 17.483333333333334, "x": "そうだ。何も起きていない時間だ。"}, {"t": 19.666666666666668, "x": "そして午後4時39分、隣の家から119番通報が入った。"}, {"t": 24.1, "x": "その家が燃えていた。"}, {"t": 25.4, "x": "火が消し止められたあと、\n2階から、その娘さんが見つかった。"}, {"t": 29.35, "x": "刃物で殺害されたうえで、\n室内に火がつけられていた。"}, {"t": 32.95, "x": "……3時50分と、4時39分。"}, {"t": 35.5, "x": "ああ。そこが今日の話の全部だ。"}, {"t": 37.666666666666664, "x": "49分。"}, {"t": 38.666666666666664, "x": "警視庁が公開捜査のページに\n書いている発生日時が、これだ。"}, {"t": 42.43333333333333, "x": "「平成8年9月9日、月曜、\n午後3時50分ころから午後4時39分までの間」。"}, {"t": 48.36666666666667, "x": "30年たったいまも、この49分のあいだに\n何があったのかが分かっていない。"}, {"t": 53.18333333333333, "x": "30年って……時効は来ないの。"}, {"t": 55.4, "x": "来なかった。"}, {"t": 56.28333333333333, "x": "本当なら来るはずだったのに、来なかった。"}, {"t": 58.85, "x": "今日はその話もする。"}, {"t": 60.35, "x": "先に断っておく。この事件は未解決だ。"}, {"t": 63.06666666666667, "x": "逮捕された人はいない。"}, {"t": 64.6, "x": "だから私は、誰かを名指ししない。"}, {"t": 66.71666666666667, "x": "「この人が怪しい」という話もしない。"}, {"t": 69.13333333333334, "x": "警視庁が公表しているものを、\nそのまま読み上げるだけだ。"}, {"t": 72.51666666666667, "x": "それと、亡くなったときの様子は話さない。"}, {"t": 75.0, "x": "ご家族が30年、公に呼びかけ続けてきた事件だ。"}, {"t": 78.8, "x": "被害者の方のお名前も、この動画では出さない。"}, {"t": 81.56666666666666, "x": "「被害者の女性」と呼ばせてもらう。"}, {"t": 83.9, "x": "……分かったわ。"}, {"t": 85.36666666666666, "x": "まず、時計だけを並べる。"}, {"t": 87.03333333333333, "x": "午後3時50分ごろ。母親が家を出る。"}, {"t": 89.66666666666667, "x": "このとき、玄関に鍵をかけなかったと報じられている。"}, {"t": 93.06666666666666, "x": "……かけなかったの。"}, {"t": 94.28333333333333, "x": "ああ。当時の下町では、昼間に\n鍵をかけない家は珍しくなかった。"}, {"t": 98.51666666666667, "x": "午後4時20分ごろ。"}, {"t": 99.8, "x": "近所の何人かが、その家から「ドン、\nドン」という音を聞いている。"}, {"t": 103.96666666666667, "x": "4回から5回。報道ではそう伝えられている。"}, {"t": 106.81666666666666, "x": "午後4時35分ごろ。"}, {"t": 108.25, "x": "出火が確認される。"}, {"t": 109.78333333333333, "x": "午後4時39分。隣の家から119番通報。"}, {"t": 113.31666666666666, "x": "そして午後6時ごろ、火が消し止められた。"}, {"t": 116.06666666666666, "x": "3時50分から4時39分まで……49分ね。"}, {"t": 119.83333333333333, "x": "そうだ。"}, {"t": 120.43333333333334, "x": "ここで、はっきりさせておきたいことがある。"}, {"t": 122.91666666666667, "x": "49分という数字は、私が計算したものじゃない。"}, {"t": 126.4, "x": "警視庁が、公開捜査のページに\n書いている時間帯そのものだ。"}, {"t": 130.21666666666667, "x": "そのあいだの「4時20分の物音」や\n「4時35分の出火」は、当時の報道によるものだ。"}, {"t": 136.53333333333333, "x": "私は一次資料で確かめられなかったから、\nそう断っておく。"}, {"t": 140.48333333333332, "x": "警視庁が言っていることと、報道が\n言っていることを、分けるのね。"}, {"t": 144.41666666666666, "x": "分ける。この回はずっとそうする。"}, {"t": 146.45, "x": "それでも、49分という枠だけは動かない。"}, {"t": 149.43333333333334, "x": "母親が出てから、消防に電話が入るまで、49分。"}, {"t": 153.13333333333333, "x": "この中に、家に入った人がいて、\nその人が出ていっている。"}, {"t": 157.0, "x": "……49分って、どのくらいなのかしら。"}, {"t": 159.66666666666666, "x": "テレビのドラマが1本終わるくらいだな。"}, {"t": 161.86666666666667, "x": "買い物に出て、帰ってくるくらいの時間でもある。"}, {"t": 164.75, "x": "家を空けた側からすれば、\n「ちょっと出ただけ」の時間だ。"}, {"t": 168.2, "x": "……それだけの時間で。"}, {"t": 169.61666666666667, "x": "ああ。"}, {"t": 170.01666666666668, "x": "この事件を語るとき、よく「30年たっても\n解決していない」という言い方をされる。"}, {"t": 175.26666666666668, "x": "それは事実だ。だが、私はそこから入りたくない。"}, {"t": 178.6, "x": "30年というのは、あとから積み上がった時間だ。"}, {"t": 181.61666666666667, "x": "事件そのものは、49分の中で起きて、終わっている。"}, {"t": 185.28333333333333, "x": "30年かけて追いかけているのは、その49分だ。"}, {"t": 189.35, "x": "……被害者の女性って、どんな人だったの。"}, {"t": 192.01666666666668, "x": "大学4年生だった。外国語学部の英語学科。"}, {"t": 195.26666666666668, "x": "ジャーナリストになりたかったそうだ。"}, {"t": 197.25, "x": "そして、アメリカの大学へ\n留学することが決まっていた。"}, {"t": 200.81666666666666, "x": "留学。"}, {"t": 201.65, "x": "ああ。行き先はシアトルだ。"}, {"t": 203.35, "x": "出発は、事件の2日後だった。"}, {"t": 205.81666666666666, "x": "……2日後。"}, {"t": 206.7, "x": "荷物は、もうまとめてあった。"}, {"t": 208.6, "x": "留学の費用を自分で稼ぐために、その年の2月から\n半年間、銀座にある放送局の東京支社で"}, {"t": 214.9, "x": "これは、その職場の人たちが2025年に\n東京新聞の取材に答えて話したことだ。"}, {"t": 220.53333333333333, "x": "職場には、彼女が書いた日誌が残っていた。"}, {"t": 223.5, "x": "日誌。"}, {"t": 224.21666666666667, "x": "アルバイトが毎日書く、業務日誌のようなものだな。"}, {"t": 227.35, "x": "2月14日、働き始めてすぐの\nころには、こう書いている。"}, {"t": 231.23333333333332, "x": "「迷惑ばかりかけており、役立たず\n以下の存在であると痛感しております」"}, {"t": 235.68333333333334, "x": "……真面目すぎるわね。"}, {"t": 236.98333333333332, "x": "そうだな。私もそう思った。"}, {"t": 238.98333333333332, "x": "そして、最後の日、\n8月16日の日誌にはこう書いてある。"}, {"t": 242.95, "x": "「大変去りがたいです。"}, {"t": 244.23333333333332, "x": "少しでもみなさんのお役に立てていたら幸せです」"}, {"t": 247.16666666666666, "x": "……。"}, {"t": 248.1, "x": "職場では、辞めるときに「うちの会社で\n働いてくれないかな」という声が出ていたそうだ。"}, {"t": 253.46666666666667, "x": "日誌には、職場をこうしたらどうかという\n提案まで書き込まれていた。"}, {"t": 257.35, "x": "私が言えるのは、ここまでだ。"}, {"t": 259.26666666666665, "x": "ご家族や職場の方が、自分から公にしている\n範囲を超えて、この人の話はしない。"}, {"t": 264.81666666666666, "x": "……そのほうがいいと思うわ。"}, {"t": 266.8333333333333, "x": "現場の話に移る。"}, {"t": 268.26666666666665, "x": "ただし、亡くなったときの様子には\n触れない。そこは飛ばす。"}, {"t": 271.78333333333336, "x": "触れるのは、「そこに何が残っていたか」だけだ。"}, {"t": 274.95, "x": "物のほうね。"}, {"t": 276.01666666666665, "x": "ああ。"}, {"t": 276.43333333333334, "x": "まず、凶器だ。"}, {"t": 277.5833333333333, "x": "報道では、刃渡りが8センチほど、刃幅が3\nセンチほどの、小型のナイフのような刃物だったと"}, {"t": 283.5, "x": "そして、これは家にあったものではない。"}, {"t": 285.6166666666667, "x": "外から持ち込まれている。"}, {"t": 287.4, "x": "……持ってきたの。"}, {"t": 288.48333333333335, "x": "そう報じられている。そして、\nいまも見つかっていない。"}, {"t": 291.6166666666667, "x": "もう一つ、粘着テープが使われている。"}, {"t": 294.18333333333334, "x": "これも家のものではなく、外から持ち込まれたものだ。"}, {"t": 297.51666666666665, "x": "刃物とテープを持って来た、ということは。"}, {"t": 300.1, "x": "そこで止めておこう。"}, {"t": 301.31666666666666, "x": "「持ってきた」という事実と、\n「何のために持ってきたのか」は別の話だ。"}, {"t": 305.9166666666667, "x": "後者は、誰も確かめていない。"}, {"t": 307.95, "x": "私が言えるのは、その家にはもともと無かったものが、\nその日その家にあった、ということだけだ。"}, {"t": 313.75, "x": "……厳しいのね、言い方が。"}, {"t": 315.5, "x": "厳しくしないと、すぐ話が滑る。"}, {"t": 317.9166666666667, "x": "未解決事件というのは、分かっていることより、\n分かっていないことのほうがずっと多い。"}, {"t": 322.8333333333333, "x": "分かっていない側を、想像で埋めない。"}, {"t": 325.0833333333333, "x": "それが、この回で私が守ることだ。"}, {"t": 327.65, "x": "でも、「外から持ってきた」というのは、\nそれだけでも大きいんじゃないの。"}, {"t": 331.9, "x": "大きい。それは言っていい。"}, {"t": 333.3833333333333, "x": "家の中にあった物で起きたことなら、\n突発的だったという見方が立つ。"}, {"t": 337.76666666666665, "x": "外から持ってきた物で起きているなら、\nその見方は立ちにくくなる。"}, {"t": 341.75, "x": "ただ、「立ちにくい」と「無い」は違う。"}, {"t": 344.3, "x": "その刃物を、別の用事で持っていた\n人だったかもしれない。"}, {"t": 347.9, "x": "……そこまで考えるのね。"}, {"t": 349.46666666666664, "x": "考える。というより、決めないでおく。"}, {"t": 351.76666666666665, "x": "あと、忘れてはいけないことがある。"}, {"t": 353.85, "x": "この家の玄関は、鍵がかかっていなかった。"}, {"t": 356.5833333333333, "x": "だから、入ること自体には、道具も力も要らなかった。"}, {"t": 360.1333333333333, "x": "ドアや窓が壊されたという話は出ていない。"}, {"t": 363.3, "x": "次に、無くなったものの話をする。"}, {"t": 365.65, "x": "報道によれば、この家から\n無くなったものは、二つだけだった。"}, {"t": 369.5833333333333, "x": "二つ。"}, {"t": 370.3833333333333, "x": "一つは、1階の居間の戸棚にしまってあった、\n旧札の1万円札が1枚。"}, {"t": 375.26666666666665, "x": "聖徳太子が描かれている、あの古いお札だ。"}, {"t": 378.1666666666667, "x": "もう一つは、被害者の女性の引き出しに\n入っていた1万円。"}, {"t": 382.05, "x": "……合わせて2万円。"}, {"t": 383.25, "x": "そうだ。"}, {"t": 383.8666666666667, "x": "では、残っていたものを挙げる。"}, {"t": 385.73333333333335, "x": "洋服だんすの中にあった\n預金通帳。これはそのままだった。"}, {"t": 389.4166666666667, "x": "留学用のリュックサックに入っていた、\n旅行小切手と現金十数万円。これもそのままだ。"}, {"t": 394.95, "x": "2階の仏壇や箪笥からも、何も無くなっていない。"}, {"t": 398.25, "x": "……通帳と十数万円を置いて、\n1万円札だけ持っていったの。"}, {"t": 402.1, "x": "報道ではそうなっている。"}, {"t": 403.55, "x": "これが、物盗りだという見方がうまく立たない理由だ。"}, {"t": 406.71666666666664, "x": "お金が目当てなら、\nリュックの十数万円を置いていく理由がない。"}, {"t": 410.43333333333334, "x": "じゃあ、物盗りじゃないのね。"}, {"t": 412.21666666666664, "x": "いや、そこも断定しない。"}, {"t": 413.9166666666667, "x": "火が出ている家だ。慌てて出ていけば、\n目についたものだけ取って終わる、ということもある。"}, {"t": 419.03333333333336, "x": "私が言えるのは、「物盗りだとすると\n説明のつかない部分がある」までだ。"}, {"t": 423.43333333333334, "x": "「物盗りではない」とは言わない。"}, {"t": 425.3333333333333, "x": "……また止めたわね。"}, {"t": 426.53333333333336, "x": "止める。ここが甘いと、あとが全部崩れる。"}, {"t": 429.8333333333333, "x": "現場に残っていたもので、もう\n一つ報じられているものがある。"}, {"t": 433.46666666666664, "x": "さっきの粘着テープだ。"}, {"t": 435.06666666666666, "x": "2009年1月、そのテープに、\n3種類の犬の毛が付いていたことが\n分かったと報じられた。"}, {"t": 440.81666666666666, "x": "3種類。"}, {"t": 441.73333333333335, "x": "ああ。1種類じゃない。3種類だ。"}, {"t": 443.93333333333334, "x": "そして、この家では犬を飼っていなかった。"}, {"t": 446.5833333333333, "x": "……じゃあ、外から付いてきたのね。"}, {"t": 448.6666666666667, "x": "そう考えるのが自然だ。"}, {"t": 450.26666666666665, "x": "テープ自体が外から持ち込まれているから、\nそのテープが置かれていた場所に、"}, {"t": 454.53333333333336, "x": "あるいは、持ってきた人の服や\n手に付いていたのかもしれない。"}, {"t": 458.01666666666665, "x": "どちらかは分からない。"}, {"t": 459.43333333333334, "x": "3種類っていうのが、なんだか引っかかるわ。"}, {"t": 462.23333333333335, "x": "引っかかるな。1匹なら、飼い主の家だと思える。"}, {"t": 465.46666666666664, "x": "3匹だと、飼い主の家かもしれないし、\nそうでない場所かもしれない。"}, {"t": 469.51666666666665, "x": "ここも、私はそこで止める。"}, {"t": 471.46666666666664, "x": "ただ、この話には別の意味がある。"}, {"t": 473.85, "x": "別の意味。"}, {"t": 474.78333333333336, "x": "2009年だ。事件から13年たっている。"}, {"t": 477.71666666666664, "x": "13年たってから、テープに付いた\n毛のことが分かっている。"}, {"t": 481.1666666666667, "x": "つまり、現場から取った物が13年間、\nちゃんと保管されていたということだ。"}, {"t": 485.93333333333334, "x": "……保管。"}, {"t": 486.6166666666667, "x": "ああ。この回では、そこがあとで効いてくる。"}, {"t": 489.28333333333336, "x": "13年前のテープを、また見たってこと。"}, {"t": 492.03333333333336, "x": "そうなる。"}, {"t": 492.73333333333335, "x": "事件が起きた直後は、見るべきものが多すぎる。"}, {"t": 495.65, "x": "目撃者を探し、近所を回り、\n被害者の人間関係を当たる。"}, {"t": 499.6666666666667, "x": "そのあいだ、証拠品は袋に入って倉庫にある。"}, {"t": 502.68333333333334, "x": "手がかりが尽きてから、もう一度その袋を開ける。"}, {"t": 505.8, "x": "……順番が逆な気もするけど。"}, {"t": 507.7, "x": "逆じゃない。当時は、テープに付いた\n毛を調べる意味が小さかった。"}, {"t": 511.5, "x": "技術が上がってから見直すと、\n意味が出てくる物がある。"}, {"t": 514.75, "x": "この事件では、それが何度か起きている。"}, {"t": 517.8333333333334, "x": "現場にあったもので、いちばん\n重いのは、たぶんこれだ。"}, {"t": 521.0333333333333, "x": "マッチ箱が一つ。"}, {"t": 522.4666666666667, "x": "マッチ箱。"}, {"t": 523.4333333333333, "x": "そのマッチ箱は、もともと\n2階の仏壇の近くに置いてあったものだと\n報じられている。"}, {"t": 528.4, "x": "それが、1階の玄関のあたりに落ちていた。"}, {"t": 531.25, "x": "……2階のものが、1階に。"}, {"t": 533.1166666666667, "x": "ああ。誰かが持って下りたということだ。"}, {"t": 535.3666666666667, "x": "そして、そのマッチ箱から、血液が採れている。"}, {"t": 538.4666666666667, "x": "血液型はA型。"}, {"t": 540.0333333333333, "x": "家族の誰かじゃないの。"}, {"t": 541.5833333333334, "x": "家族にA型の人はいなかった。そう報じられている。"}, {"t": 544.8333333333334, "x": "ここは、報道だけじゃない。"}, {"t": 546.4833333333333, "x": "警視庁が、公開捜査のページに、\n犯人の特徴としてこう書いている。"}, {"t": 550.85, "x": "「男性」「犯行当時、何らかのケガを\n負い出血していた」「血液型はA型」。"}, {"t": 555.8166666666667, "x": "この3つだ。これが、警視庁が\n公表している犯人像の全部だ。"}, {"t": 559.9833333333333, "x": "……ケガをして、出血していた。"}, {"t": 562.1, "x": "そういうことになる。"}, {"t": 563.2666666666667, "x": "現場に、その人の血が残っていた。"}, {"t": 565.6666666666666, "x": "それで、A型の男性だ、と。"}, {"t": 567.8833333333333, "x": "それ以上のことは。"}, {"t": 569.1833333333333, "x": "警視庁のページには書いていない。"}, {"t": 571.1, "x": "年齢も、職業も、住んでいる場所も書いていない。"}, {"t": 574.1833333333333, "x": "だから私も、そこから先は足さない。"}, {"t": 576.6833333333333, "x": "この3つを、そのまま置いておく。"}, {"t": 578.85, "x": "マッチ箱って、火をつけるためよね。"}, {"t": 581.2333333333333, "x": "そう考えるのが自然だろうな。"}, {"t": 583.1, "x": "ただ、それが2階から1階に落ちている。"}, {"t": 585.6333333333333, "x": "火がつけられたのは2階だ。"}, {"t": 587.4833333333333, "x": "……じゃあ、1階に持って下りたのはどうしてなの。"}, {"t": 590.1666666666666, "x": "分からない。"}, {"t": 590.9166666666666, "x": "出ていくときに持っていて、\n玄関で落としたのかもしれない。"}, {"t": 594.3, "x": "私が言えるのは、その箱が\n1階の玄関付近にあった、というところまでだ。"}, {"t": 598.95, "x": "ただ、落ちていてくれたおかげで、\n火に巻かれずに残った。"}, {"t": 602.5, "x": "……残ったのね。"}, {"t": 603.5833333333334, "x": "残った。2階にあったら、燃えていたかもしれない。"}, {"t": 606.65, "x": "この事件でいちばん重い証拠は、\nたまたま1階に落ちていた。"}, {"t": 610.85, "x": "ここまでを並べると、一つのことが見えてくる。"}, {"t": 613.8333333333334, "x": "なに。"}, {"t": 614.4666666666667, "x": "家に入った人は、すぐには\n出ていっていない、ということだ。"}, {"t": 617.95, "x": "これは私の想像じゃない。"}, {"t": 619.4333333333333, "x": "公表されていることを並べるとそうなる、という話だ。"}, {"t": 622.7333333333333, "x": "一つ。刃物と粘着テープを外から持ち込んでいる。"}, {"t": 626.0333333333333, "x": "二つ。2階の仏壇の近くにあった\nマッチ箱が、1階の玄関付近に落ちている。"}, {"t": 631.2166666666667, "x": "三つ。1階の居間の戸棚の中にあった\n1万円札が無くなっている。"}, {"t": 635.45, "x": "四つ。2階で火がつけられている。"}, {"t": 637.7666666666667, "x": "……2階と1階を、行き来してるのね。"}, {"t": 640.1166666666667, "x": "そうなる。"}, {"t": 640.8166666666667, "x": "2階に上がり、1階の戸棚を開け、\nまた2階で火をつけて、出ていっている。"}, {"t": 645.3166666666667, "x": "戸棚の中のお札を見つけるには、\n戸棚を開けて中を探さないといけない。"}, {"t": 649.65, "x": "それだけの動きをしている。"}, {"t": 651.3833333333333, "x": "49分のうち、どのくらいなのかしら。"}, {"t": 654.15, "x": "そこは誰にも言えない。"}, {"t": 655.5, "x": "4時20分の物音が本当にその家のものだったとしても、\nそこから出火まで15分ある。"}, {"t": 661.05, "x": "ただ、「入って、すぐ逃げた」という\n形では、ここまでのことは起きない。"}, {"t": 665.4666666666667, "x": "警視庁が事件を「殺人放火事件」という\n一つの名前で呼んでいるのも、そういうことだろう。"}, {"t": 671.1, "x": "……こわいわね。ずっと\n家の中にいたってことでしょう。"}, {"t": 674.05, "x": "ああ。しかも、外は明るい。夕方4時台だ。"}, {"t": 677.0833333333334, "x": "そのあいだ、通りには人が歩いていた。"}, {"t": 679.4333333333333, "x": "だからこそ、次の話が出てくる。"}, {"t": 682.3666666666667, "x": "目撃情報だ。"}, {"t": 683.5833333333334, "x": "警視庁は、この事件で、目撃された\n人物の絵を2回公開している。"}, {"t": 688.0166666666667, "x": "1回目は2018年9月。"}, {"t": 690.1666666666666, "x": "事件当日の午後3時55分ごろ、\n被害者宅の玄関先で見られた人物のイラストだ。"}, {"t": 695.7833333333333, "x": "身長はおよそ160センチ。"}, {"t": 697.65, "x": "中肉からやや痩せ型。"}, {"t": 699.3, "x": "黄土色のコートに、黒っぽいズボン。"}, {"t": 701.4666666666667, "x": "雨が降っていたのに、傘を\nささずに、その家を見ていたという。"}, {"t": 705.2, "x": "……3時55分。お母さんが出た5分後じゃない。"}, {"t": 708.0833333333334, "x": "そうなる。"}, {"t": 708.7833333333333, "x": "2回目は2021年8月。"}, {"t": 711.05, "x": "同じ日の午後3時30分ごろ、\n現場の南側の交差点で見られた人物だ。"}, {"t": 715.9666666666667, "x": "身長は150から160センチくらい。"}, {"t": 718.5, "x": "痩せ型。黒い傘をさして立っていた。"}, {"t": 721.0, "x": "警視庁は、この2人が同じ人物である\n可能性が高いとみている。"}, {"t": 725.15, "x": "……立っていた。ずっと。"}, {"t": 726.6666666666666, "x": "そして、2026年9月3日。"}, {"t": 729.2333333333333, "x": "警視庁は、その人物の3D画像を新しく公開した。"}, {"t": 732.85, "x": "立体で作った画像だ。"}, {"t": 734.5166666666667, "x": "身長は150から160センチくらい。"}, {"t": 737.05, "x": "黄土色のコート。黒い傘。"}, {"t": 739.0333333333333, "x": "事件の直前、現場から15メートル離れた\n裏路地の交差点で見られている。"}, {"t": 743.55, "x": "この画像は、事件から30年になる9月9日に、\n警視庁のウェブサイトにも載せられた。"}, {"t": 749.1833333333333, "x": "30年たってから、新しい絵を出したのね。"}, {"t": 752.1166666666667, "x": "ああ。"}, {"t": 752.5166666666667, "x": "ここで一つ、はっきりさせておく。"}, {"t": 754.6833333333333, "x": "これは「目撃された人物」であって、\n「犯人」ではない。"}, {"t": 758.4333333333333, "x": "警視庁も、犯人の特徴としては、\nさっきの3つしか書いていない。"}, {"t": 762.65, "x": "この人が事件に関わっているか\nどうかは、分かっていない。"}, {"t": 766.15, "x": "……話を聞きたい人、ってことね。"}, {"t": 768.3666666666667, "x": "そういうことだ。"}, {"t": 770.0, "x": "ここで、時代の話をする。"}, {"t": 771.9, "x": "1996年というのは、科学捜査に\nとって、ちょうど境目の時期だった。"}, {"t": 777.0833333333334, "x": "境目。"}, {"t": 777.95, "x": "血液型で人を絞っていた時代と、\nDNA型で人を絞る時代の、あいだだ。"}, {"t": 782.95, "x": "これについては、いい資料がある。国会の議事録だ。"}, {"t": 786.1166666666667, "x": "1992年、平成4年4月7日。"}, {"t": 789.1166666666667, "x": "参議院の地方行政委員会。"}, {"t": 791.0333333333333, "x": "警察庁の刑事局長が、DNA型鑑定とは\n何かを、議員に説明している。"}, {"t": 796.1666666666666, "x": "事件の4年前だな。"}, {"t": 797.75, "x": "4年前。ちょうどそのころなのね。"}, {"t": 799.95, "x": "局長はこう言っている。"}, {"t": 801.3333333333334, "x": "「これまで血液であるとか、あるいは精液といった\n検査資料から個人識別を行う方法といたしましては、"}, {"t": 807.6166666666667, "x": "……4種類。"}, {"t": 808.5, "x": "そうだ。血液型だけだと、日本人の4割ほどがA型だ。"}, {"t": 812.4833333333333, "x": "A型の男性、というだけでは、\n何百万人も残ってしまう。"}, {"t": 816.3, "x": "続きがある。"}, {"t": 817.1666666666666, "x": "「このDNA型鑑定というものにおきましては、\n鑑定資料が十分にありますれば一つの検査方法で"}, {"t": 823.3666666666667, "x": "4種類から、数千万分の一。すごい差ね。"}, {"t": 826.55, "x": "この年の2月、水戸地方裁判所で、DNA型鑑定が\n決め手になった有罪判決が出ている。"}, {"t": 832.6, "x": "局長は、その鑑定書では「七千万人に一人」という\n確率で判定した、と説明している。"}, {"t": 838.7333333333333, "x": "これが1992年の到達点だ。"}, {"t": 842.1, "x": "ただし、この日の答弁には、続きがある。"}, {"t": 844.75, "x": "私は、こっちのほうが大事だと思っている。"}, {"t": 847.55, "x": "続き。"}, {"t": 848.3166666666667, "x": "同じ局長が、同じ日に、こう言っているんだ。"}, {"t": 851.2333333333333, "x": "「犯罪の現場からとられます資料と申しますものは\n常に私どもの満足のいくようなものでは"}, {"t": 856.7666666666667, "x": "現場のものは、きれいには取れないのね。"}, {"t": 859.2333333333333, "x": "ああ。火が出た家なら、なおさらだ。"}, {"t": 861.4333333333333, "x": "そして、こう続く。"}, {"t": 862.8333333333334, "x": "「指紋と違います。指紋の場合は、指紋が\n一致したといったらもうたった一人の人間を"}, {"t": 868.0833333333334, "x": "「DNA型鑑定の結果だけを頼りにして捜査をすると\nいうようなことではいけないわけでありまして、"}, {"t": 873.7166666666667, "x": "……鑑定だけに頼るな、って\n言ってるのね。1992年に。"}, {"t": 877.8333333333334, "x": "そう言っている。警察庁の刑事局長本人が、国会で。"}, {"t": 881.5833333333334, "x": "この言葉の重さは、あとで分かることになる。"}, {"t": 884.25, "x": "この回で前に扱った足利事件では、\nDNA型鑑定の結論が2回ひっくり返っている。"}, {"t": 889.9833333333333, "x": "2015年、警察庁の審議官は、国会でこう言っている。"}, {"t": 893.8166666666667, "x": "足利事件の検証を行い、「鑑定記録、"}, {"t": 896.4666666666667, "x": "鑑定資料の適切な取扱いを\n徹底させる」などの対策を講じてきた、と。"}, {"t": 901.6166666666667, "x": "……鑑定は万能じゃない、ということね。"}, {"t": 903.9333333333333, "x": "そうだ。私もこの回で\n「DNAが出たから間違いない」とは言わない。"}, {"t": 908.8833333333333, "x": "では、1996年の警察には、\n何ができて、何ができなかったのか。"}, {"t": 914.1, "x": "ここも国会の答弁で分かる。"}, {"t": 915.9833333333333, "x": "2015年、平成27年5月21日。"}, {"t": 919.2, "x": "参議院の法務委員会。"}, {"t": 920.7666666666667, "x": "警察庁の長官官房審議官が、\n鑑定の方式の移り変わりを説明している。"}, {"t": 925.9166666666666, "x": "方式が変わったの。"}, {"t": 927.3666666666667, "x": "変わった。"}, {"t": 928.1, "x": "昔の方式は、エムシーティー118型という。"}, {"t": 931.2, "x": "審議官はこう言っている。"}, {"t": 932.7, "x": "「MCT一一八と呼ばれる一つの部位についての\n有機化合物の配列の繰り返しの数を数えるという"}, {"t": 938.8833333333333, "x": "一つの部位。"}, {"t": 939.9333333333333, "x": "そう。DNAのうち、たった一か所だけを見ていた。"}, {"t": 943.05, "x": "そして、いまの方式はこうだ。"}, {"t": 945.0333333333333, "x": "「現在は、STR型検査法と申しまして、\n十五の部位について同じようにその繰り返しの回数を"}, {"t": 951.15, "x": "「これによりまして個人識別精度が\n向上いたしまして……\n約四兆七千億人に一人という確率でしか"}, {"t": 957.6666666666666, "x": "……4兆7000億人に一人。"}, {"t": 959.6833333333333, "x": "地球の人口の500倍以上だな。"}, {"t": 961.85, "x": "1996年に現場から取ったものを、\n1996年の技術で見ていたら、そこまでは出ない。"}, {"t": 968.5333333333333, "x": "一か所しか見ていないからだ。"}, {"t": 970.4, "x": "じゃあ、当時は絞り切れなかったのね。"}, {"t": 972.7666666666667, "x": "そうだ。当時は\n「A型の男性」というところまでしか行けなかった。"}, {"t": 976.8833333333333, "x": "ただ、ここが大事なんだが。"}, {"t": 978.6666666666666, "x": "現場から取ったものは、捨てられていなかった。"}, {"t": 982.05, "x": "2014年9月。事件から18年後だ。"}, {"t": 985.0833333333334, "x": "2階の布団に付いていた血液から、\nDNA型が検出されたと報じられた。"}, {"t": 989.9333333333333, "x": "そして、そのDNA型は、あの1階に落ちていた\nマッチ箱から採れたものと一致した。"}, {"t": 995.3166666666667, "x": "……18年前の血から。"}, {"t": 997.0, "x": "ああ。"}, {"t": 997.4333333333333, "x": "1996年には、A型としか分からなかった。"}, {"t": 1001.05, "x": "2014年には、同じ人のものだと\n言えるところまで来た。"}, {"t": 1004.6666666666666, "x": "技術のほうが追いついてきたわけだ。"}, {"t": 1006.8333333333334, "x": "でも、現場のものが残っていなかったら、\n追いついても意味がないわよね。"}, {"t": 1011.05, "x": "そこだ。今日いちばん言いたいのは、たぶんそこだ。"}, {"t": 1013.8833333333333, "x": "18年間、証拠が保管されていた。だから、\n新しい技術で見直すことができた。"}, {"t": 1019.1833333333333, "x": "逆に言えば、捨てていたら終わっていた。"}, {"t": 1021.4833333333333, "x": "この「保管」というのは、言うほど簡単な話じゃない。"}, {"t": 1024.8666666666666, "x": "2016年、警察庁の刑事局長が、\n参議院の決算委員会でこう言っている。"}, {"t": 1030.0, "x": "「未解決事件の証拠物件等を長期にわたり\n保管することは、収容能力や適切な管理の面からは"}, {"t": 1036.4333333333334, "x": "……場所も人も要るものね。"}, {"t": 1038.0833333333333, "x": "ああ。しかも、いつまで\n持っていればいいのかが決まらない。"}, {"t": 1041.2166666666667, "x": "局長は、こうも言っている。"}, {"t": 1042.7833333333333, "x": "長期の未解決事件については、「\n有力情報の掘り下げ、証拠資料の"}, {"t": 1047.3833333333334, "x": "再鑑定。持っているから、もう一度かけられる。"}, {"t": 1050.4666666666667, "x": "持ってなかったら、もう一度が無いのね。"}, {"t": 1053.45, "x": "ここから、時効の話に入る。"}, {"t": 1055.5833333333333, "x": "1996年当時、殺人罪の公訴時効は15年だった。"}, {"t": 1060.15, "x": "15年。"}, {"t": 1061.0, "x": "事件は1996年9月9日だ。"}, {"t": 1064.05, "x": "15年後は、2011年9月9日になる。"}, {"t": 1067.2333333333333, "x": "本当なら、その日で終わっていた。"}, {"t": 1069.5, "x": "……終わる、っていうのは。"}, {"t": 1070.8166666666666, "x": "その日を過ぎたら、犯人が\n分かっても、もう起訴できない。"}, {"t": 1074.3, "x": "裁判にかけられない。"}, {"t": 1075.5166666666667, "x": "捜査本部も畳まれる。"}, {"t": 1077.1, "x": "ところが、2011年9月9日は来た。だが、\n時効は来なかった。"}, {"t": 1081.85, "x": "どうして。"}, {"t": 1082.7, "x": "その1年4か月あまり前に、時効そのものが\n法律から消えていたからだ。"}, {"t": 1087.25, "x": "2010年4月27日。"}, {"t": 1089.3333333333333, "x": "殺人の公訴時効を廃止する法律が、\nその日に成立して、その日に施行された。"}, {"t": 1094.5666666666666, "x": "平成22年法律第26号だ。"}, {"t": 1097.2666666666667, "x": "ぎりぎりじゃない。"}, {"t": 1098.35, "x": "ぎりぎりだ。"}, {"t": 1099.1666666666667, "x": "この法律には、附則でこう書いてある。"}, {"t": 1101.5833333333333, "x": "「その施行前に犯した罪であって施行の際時効が\n完成していないものについても適用する」。"}, {"t": 1107.0, "x": "つまり、2010年4月27日の時点で、まだ\n時効が来ていない事件には、この法律が効く。"}, {"t": 1113.2, "x": "柴又の事件の時効が来るのは、2011年9月9日だった。"}, {"t": 1117.5166666666667, "x": "まだ来ていなかった。だから、効いた。"}, {"t": 1119.9833333333333, "x": "……1年4か月。それだけ遅かったら。"}, {"t": 1122.65, "x": "終わっていた。"}, {"t": 1123.65, "x": "法律って、そんなぎりぎりで決まるものなの。"}, {"t": 1126.45, "x": "この法律については、そうだった。"}, {"t": 1128.65, "x": "法務省に勉強会ができたのが2009年。"}, {"t": 1131.3833333333334, "x": "法制審議会に諮問されたのが同じ年の秋。"}, {"t": 1134.3333333333333, "x": "そこから半年で、成立している。"}, {"t": 1136.6333333333334, "x": "普通の法律の作り方からすると、かなり速い。"}, {"t": 1139.8666666666666, "x": "急いだのね。"}, {"t": 1140.9166666666667, "x": "急いでいる。理由は単純で、\n待っているあいだにも時効は進むからだ。"}, {"t": 1145.05, "x": "審議をゆっくりやれば、その分だけ、\n線の向こう側に落ちる事件が増える。"}, {"t": 1149.4333333333334, "x": "実際、この法律が施行されたのは、\n成立したその日だ。"}, {"t": 1153.15, "x": "公布と施行を同じ日にしている。"}, {"t": 1155.2166666666667, "x": "……1日も空けなかったのね。"}, {"t": 1157.0666666666666, "x": "空けていない。"}, {"t": 1158.5333333333333, "x": "そういえば、時効って途中で\n延びたって聞いたことがあるわ。"}, {"t": 1161.9333333333334, "x": "ああ、それが面白いところだ。"}, {"t": 1163.8333333333333, "x": "2004年、平成16年の改正で、殺人の公訴時効は\n15年から25年に延ばされている。"}, {"t": 1170.0666666666666, "x": "じゃあ、この事件も25年になったんじゃないの。"}, {"t": 1173.0166666666667, "x": "ならなかった。"}, {"t": 1174.1, "x": "え。"}, {"t": 1174.5666666666666, "x": "この改正の施行は2005年1月1日だ。"}, {"t": 1177.5333333333333, "x": "そして附則に、こう書いてあった。"}, {"t": 1179.6166666666666, "x": "「この法律の施行前に犯した\n罪の公訴時効の期間については、\nなお従前の例による」。"}, {"t": 1184.95, "x": "……施行より前の事件には効かない、ってことね。"}, {"t": 1187.75, "x": "そうだ。柴又の事件は1996年。"}, {"t": 1190.7666666666667, "x": "2005年より前だ。"}, {"t": 1192.2166666666667, "x": "だから、15年のまま据え置かれた。"}, {"t": 1194.5166666666667, "x": "25年になっていたら、時効が来るのは2021年だった。"}, {"t": 1198.4666666666667, "x": "15年のままだったから、2011年だった。"}, {"t": 1201.65, "x": "……じゃあ、2010年の法律が間に合わなかったら。"}, {"t": 1204.6833333333334, "x": "2011年9月9日で、この事件は終わっていた。"}, {"t": 1208.1666666666667, "x": "2004年の改正は、この事件には届かなかった。"}, {"t": 1211.4, "x": "2010年の改正だけが、届いた。"}, {"t": 1213.95, "x": "同じ「時効を延ばす」でも、\n届くのと届かないのがあるのね。"}, {"t": 1217.9, "x": "そこが、この回でいちばん分かりにくいところだ。"}, {"t": 1220.7, "x": "2004年は「これから起きる事件だけ」。"}, {"t": 1223.2, "x": "2010年は「まだ時効が来ていない、\n進行中の事件も」。"}, {"t": 1226.9333333333334, "x": "そこが違う。"}, {"t": 1228.0, "x": "一文字の違いで、事件が\n生き残ったり、消えたりするのね。"}, {"t": 1231.8166666666666, "x": "そういうことになる。"}, {"t": 1233.6166666666666, "x": "ただ、2010年の法律にも、届かなかった事件がある。"}, {"t": 1237.4333333333334, "x": "届かなかった。"}, {"t": 1238.65, "x": "すでに時効が来てしまっていた事件だ。"}, {"t": 1240.9666666666667, "x": "2010年4月27日の時点で、もう時効が\n完成していた事件には、この法律は効かない。"}, {"t": 1247.1, "x": "……そっちは、そのままなのね。"}, {"t": 1249.0, "x": "そのままだ。いま犯人が分かっても、起訴できない。"}, {"t": 1252.15, "x": "この線引きについては、国会で、\n遺族の側からはっきりした発言が出ている。"}, {"t": 1256.9333333333334, "x": "2010年4月23日、\n衆議院の法務委員会。参考人質疑だ。"}, {"t": 1261.6666666666667, "x": "招かれた参考人の一人が、\n殺人事件被害者遺族の会の代表幹事だった。"}, {"t": 1266.7333333333333, "x": "この人は、こう答えている。"}, {"t": 1268.5333333333333, "x": "「今回の私どものいわゆる要求の中には、\n時効を完成してしまった被害者遺族まで遡及を"}, {"t": 1274.1833333333334, "x": "「私たちは、そこは割り切って、あくまでも\n現在進行中の被害者遺族に限ってというふうに"}, {"t": 1279.95, "x": "……自分たちで、線を引いたのね。"}, {"t": 1282.0666666666666, "x": "そうだ。"}, {"t": 1282.6833333333334, "x": "この会には、当時22の事件の遺族が入っていた。"}, {"t": 1286.0166666666667, "x": "そのうち3つは、すでに\n時効が来てしまった事件の遺族だった。"}, {"t": 1289.8166666666666, "x": "つまり、この法律ができても救われない\n人たちが、同じ会の中にいた。"}, {"t": 1294.4666666666667, "x": "……それでも一緒に運動していたの。"}, {"t": 1296.55, "x": "していた。"}, {"t": 1297.2833333333333, "x": "その人たちの話として、代表幹事はこう紹介している。"}, {"t": 1301.05, "x": "時効が完成する瞬間、「秒針が午前零時を指した、\nその瞬間に捜査をお願いしている看板がまず"}, {"t": 1307.2166666666667, "x": "「まさに警察の方から縁を切られたような、\nそういった非常に無念な気持ちを味わっておる」。"}, {"t": 1312.4, "x": "……看板が外される。"}, {"t": 1313.8, "x": "ああ。柴又の事件は、その線のこちら側で止まった。"}, {"t": 1317.9166666666667, "x": "いま話した参考人について、\n一つ言っていないことがある。"}, {"t": 1321.5833333333333, "x": "なに。"}, {"t": 1322.2166666666667, "x": "この人は、柴又の事件のご遺族だ。"}, {"t": 1324.9166666666667, "x": "……え。"}, {"t": 1325.4, "x": "2010年4月23日、衆議院法務委員会。"}, {"t": 1328.75, "x": "意見陳述は、こう始まっている。"}, {"t": 1330.9166666666667, "x": "「初めに、私は、平成八年九月九日、\n東京都葛飾区柴又三丁目の自宅で、\n二十一歳の次女◯◯を"}, {"t": 1338.5333333333333, "x": "……その日の話から始めてるのね。"}, {"t": 1340.7833333333333, "x": "ああ。なお、ここで私が「マル、マル」と\n読んだところには、本当はお名前が入っている。"}, {"t": 1346.3, "x": "会議録にも、報道にも、はっきり載っている。"}, {"t": 1349.2, "x": "ただ、この動画では伏せさせてもらう。\nそこはご家族が決めることだと思うからだ。"}, {"t": 1353.9333333333334, "x": "続きを読む。"}, {"t": 1354.85, "x": "「私は会社の業務で福島に出張中、妻は\n美容院の仕事で出かけ、長女は看護婦として病院で"}, {"t": 1361.1166666666666, "x": "家族全員が、それぞれの場所にいた。\nそういう日だったということだ。"}, {"t": 1365.15, "x": "そして、こう続く。"}, {"t": 1366.5333333333333, "x": "「かけがえのない最愛の家族を、殺人という憎むべき\n犯罪によって命を奪われ、しかも、私の場合は、"}, {"t": 1373.1, "x": "……思い出まで。"}, {"t": 1374.0666666666666, "x": "家が燃えているからな。"}, {"t": 1375.2666666666667, "x": "写真も、手紙も、残らない。"}, {"t": 1377.4666666666667, "x": "そして、意見陳述の中で\nいちばん短い一文が、これだ。"}, {"t": 1381.3166666666666, "x": "「そして最後は、この世の中には正義は\n存在するのだろうかと、時折天を仰ぐことがあります」"}, {"t": 1386.7166666666667, "x": "……。"}, {"t": 1387.65, "x": "この日、この人は、こうも言っている。"}, {"t": 1389.9666666666667, "x": "「事件以来、きょうで十三年七カ月と\n十七日過ぎて、いまだ犯人が捕まらない中」。"}, {"t": 1395.5833333333333, "x": "日数まで数えてるのね。"}, {"t": 1397.2833333333333, "x": "数えている。"}, {"t": 1398.7666666666667, "x": "この参考人質疑には、もう一つ、\n読んでおきたいやり取りがある。"}, {"t": 1402.7166666666667, "x": "時効を無くしたら、警察はいつまでも\n捜査を続けなければならない。人も金も要る。"}, {"t": 1407.7666666666667, "x": "そういう指摘に対する答えだ。"}, {"t": 1409.85, "x": "捜査の側の負担ね。"}, {"t": 1411.4333333333334, "x": "ああ。それに対して、この人はこう答えている。"}, {"t": 1414.3666666666666, "x": "「私たちは……当初の捜査体制を永久に\n保ってほしいと言っているわけでは\n決してないわけです」"}, {"t": 1419.8333333333333, "x": "「たとえそれが縮小されたとしましても、やはり\n警察がいつも犯人を追いかけていてくれる、"}, {"t": 1425.1, "x": "……体制を戻せ、じゃないのね。"}, {"t": 1427.0833333333333, "x": "違う。「追いかけていてくれること」を求めている。"}, {"t": 1430.0, "x": "そして、こう続く。"}, {"t": 1431.4, "x": "「十五年あるいは二十五年で\n心の区切りをつけなさいという、\nそういった心の区切りを法によって"}, {"t": 1437.0, "x": "……法律に、区切られる。"}, {"t": 1438.5666666666666, "x": "この言い方は、私はずっと覚えている。"}, {"t": 1441.0166666666667, "x": "時効というのは、\n犯人のための制度だと思われがちだ。"}, {"t": 1444.3333333333333, "x": "だが、遺族の側から見ると、\n「そこで終わりにしなさい」と\n国から言われる日でもある。"}, {"t": 1449.2166666666667, "x": "この意見陳述の最後は、お礼で終わっている。"}, {"t": 1452.0, "x": "「署名活動に御協力いただいた約八万人の方々を\n初め、手紙、メール等で激励を賜りました"}, {"t": 1458.5166666666667, "x": "8万人と、10万人。"}, {"t": 1460.4, "x": "この法律は、そうやって通った。"}, {"t": 1462.5333333333333, "x": "そして4日後の4月27日に\n成立して、その日から効き始めた。"}, {"t": 1467.7166666666667, "x": "ここからは、いまこの事件に\n何がかかっているか、という話をする。"}, {"t": 1471.7666666666667, "x": "懸賞金だ。"}, {"t": 1472.8833333333334, "x": "警察がお金を出すやつね。"}, {"t": 1474.8, "x": "ああ。正式には「捜査特別報奨金」という。"}, {"t": 1478.0, "x": "これも、成り立ちが国会で説明されている。"}, {"t": 1480.7666666666667, "x": "2007年10月25日、参議院の内閣委員会。"}, {"t": 1484.2333333333333, "x": "当時の国家公安委員長の答弁だ。"}, {"t": 1486.5833333333333, "x": "「この問題は、民間で先に実施され、捜査協力に\n関する懸賞広告の中に直接事件と結び付きます"}, {"t": 1493.7166666666667, "x": "民間が先だったの。"}, {"t": 1495.3, "x": "そうだ。遺族や有志がお金を出して\n呼びかけるほうが先にあった。"}, {"t": 1499.0833333333333, "x": "それを見て、国のほうが制度にした。"}, {"t": 1501.3833333333334, "x": "「未解決の重要凶悪事件に関する情報提供を\n促進すると、そしてその検挙に資することを"}, {"t": 1507.3, "x": "2007年4月1日開始だ。"}, {"t": 1509.5333333333333, "x": "そして「本年五月一日の第一回懸賞広告以降、\nこれまで……凶悪事件十四件について、"}, {"t": 1515.8333333333333, "x": "最初は14件だったのね。"}, {"t": 1517.8, "x": "ああ。"}, {"t": 1518.2, "x": "この答弁には、効き目についての数字も出てくる。"}, {"t": 1521.1666666666667, "x": "「第一回広告では、この実施前は\n月に約十件余りの情報が、\n実施後は月三十四件に増える」。"}, {"t": 1527.6166666666666, "x": "月10件が、月34件。3倍以上ね。"}, {"t": 1530.9166666666667, "x": "そういう仕組みだ。"}, {"t": 1532.0333333333333, "x": "いまの制度では、上限は原則300万円。"}, {"t": 1534.7666666666667, "x": "特に必要がある場合は、1000万円を超えない範囲で"}, {"t": 1538.0166666666667, "x": "応募の期間は、原則1年間だ。"}, {"t": 1541.05, "x": "では、柴又の事件にはいくらかかっているのか。"}, {"t": 1543.9833333333333, "x": "総額で、上限800万円だ。"}, {"t": 1546.4166666666667, "x": "800万円。"}, {"t": 1547.5666666666666, "x": "内訳はこうだ。"}, {"t": 1548.65, "x": "警察庁の捜査特別報奨金が、上限300万円。"}, {"t": 1552.4166666666667, "x": "それとは別に、民間の団体が出している\n謝礼金が、上限500万円。"}, {"t": 1556.95, "x": "この団体は、被害者の女性のお名前を\n冠した「捜査に協力する会」という名前だ。"}, {"t": 1562.4333333333334, "x": "……名前を付けて、会を作ったのね。"}, {"t": 1564.7333333333333, "x": "ああ。合わせて800万円になる。"}, {"t": 1566.85, "x": "警察庁の300万円のほうは、2010年から\n対象になったと報じられている。"}, {"t": 1571.7666666666667, "x": "そして期間は、原則1年だ。"}, {"t": 1574.1333333333334, "x": "じゃあ、毎年切れるってこと。"}, {"t": 1576.0833333333333, "x": "切れる。切れるから、毎年、延長を決めている。"}, {"t": 1579.15, "x": "いま出ている期間は、\n警視庁のページにこう書いてある。"}, {"t": 1582.25, "x": "「令和8年9月9日から令和9年9月8日まで」。"}, {"t": 1585.8166666666666, "x": "……9月9日から。"}, {"t": 1587.2833333333333, "x": "ああ。事件が起きた日から、次の年の前日まで。"}, {"t": 1590.55, "x": "毎年、その日に1年ぶん延ばしている。"}, {"t": 1593.1166666666666, "x": "今年もそうした。事件から30年の、その日にだ。"}, {"t": 1596.6, "x": "ここまでにこの事件に投入された捜査員は、\n延べで12万人を超えると報じられている。"}, {"t": 1601.7833333333333, "x": "寄せられた情報は、1843件。"}, {"t": 1604.7666666666667, "x": "1843件も来て、それでも分からないのね。"}, {"t": 1608.3333333333333, "x": "そして、近ごろは情報が減っているそうだ。"}, {"t": 1610.9833333333333, "x": "だから、30年の節目に、新しい3D画像を出した。"}, {"t": 1614.8833333333334, "x": "懸賞金って、もらえる人に条件があるのかしら。"}, {"t": 1618.15, "x": "ある。警察庁がはっきり書いている。"}, {"t": 1620.3666666666666, "x": "匿名の人は対象にならない。"}, {"t": 1622.2, "x": "警察職員も対象外だ。"}, {"t": 1624.1666666666667, "x": "被疑者本人と共犯者も、当然ながら対象外。"}, {"t": 1627.3666666666666, "x": "情報を手に入れる過程で自分が\n犯罪をした人も、対象外だ。"}, {"t": 1631.35, "x": "……匿名は駄目なのね。"}, {"t": 1632.8166666666666, "x": "駄目だ。名乗って、情報の中身を\n確かめられる形でないと、支払えない。"}, {"t": 1637.5, "x": "金額も、言った人に全額が行くとは限らない。"}, {"t": 1640.6, "x": "「被疑者の検挙又は事件の解決への寄与の度合いに\n応じて」支払う、と書いてある。"}, {"t": 1645.5333333333333, "x": "複数の人が情報を出したら、分けることになる。"}, {"t": 1648.7333333333333, "x": "くじ引きみたいなものじゃないのね。"}, {"t": 1650.7666666666667, "x": "全然違う。あくまで、捜査に効いたかどうかで決まる。"}, {"t": 1654.7666666666667, "x": "柴又という町は、帝釈天の門前町だ。"}, {"t": 1657.6833333333334, "x": "映画で見たことがある人も多いだろう。"}, {"t": 1659.8166666666666, "x": "あの通りの、すぐ近くで起きた事件だ。"}, {"t": 1662.45, "x": "あんなに人が歩いている町なのね。"}, {"t": 1664.6666666666667, "x": "ああ。だから、余計に分からない。"}, {"t": 1666.75, "x": "被害者の家はもう無い。"}, {"t": 1668.0, "x": "取り壊されている。"}, {"t": 1669.2333333333333, "x": "その場所には、小さなお地蔵さんが立っている。"}, {"t": 1671.95, "x": "被害者の女性のお名前を取った、お地蔵さんだ。"}, {"t": 1674.8666666666666, "x": "命日には、ご家族や友人が花を供えている。"}, {"t": 1678.0, "x": "……30年、続いているのね。"}, {"t": 1679.95, "x": "そして、捜査のほうも続いている。"}, {"t": 1682.1166666666666, "x": "報道によれば、地元では、A型の男性の多くが\n任意のDNA検査に応じているという。"}, {"t": 1687.4666666666667, "x": "髪の毛を出してほしい、と\n頼まれて、応じた人たちだ。"}, {"t": 1691.0666666666666, "x": "町の人が、協力してるのね。"}, {"t": 1693.3666666666666, "x": "ああ。"}, {"t": 1693.7833333333333, "x": "それと、これは2026年の記事に出ていた話だが。"}, {"t": 1697.3666666666666, "x": "事件のころ20代だった警視庁捜査一課の若い\n捜査員が、いまは定年の直前になっている。"}, {"t": 1703.1833333333334, "x": "その人が、いまも同じ町の同じ店に、\nふらっと来るそうだ。"}, {"t": 1706.95, "x": "「ちょっと聞きたいことが」と言って、前にも\n聞かれたようなことを、また聞いていく。"}, {"t": 1711.65, "x": "……30年、同じ人が。"}, {"t": 1713.4833333333333, "x": "さっきの「かすかな希望があることが\n唯一心のよりどころになる」という言葉を、"}, {"t": 1718.1, "x": "追いかけていてくれる、ということの中身は、\nたぶんこういうことだ。"}, {"t": 1722.4166666666667, "x": "終わりの前に、分かっていないことを並べておきたい。"}, {"t": 1725.4333333333334, "x": "分かっていないこと。"}, {"t": 1726.8, "x": "ああ。この手の話は、分かっていることばかり\n並べると、実際より解けている気がしてくる。"}, {"t": 1732.2333333333333, "x": "一つ。誰が家に入ったのかは分かっていない。"}, {"t": 1735.05, "x": "二つ。何のために入ったのかも分かっていない。"}, {"t": 1737.9333333333334, "x": "顔見知りだったという見方、つきまといがあったと\nいう見方、物盗りだという見方。"}, {"t": 1742.75, "x": "3つとも挙がっているが、どれも決まっていない。"}, {"t": 1745.4333333333334, "x": "三つ。凶器は見つかっていない。"}, {"t": 1747.45, "x": "四つ。持ち込まれた\n粘着テープに付いていた3種類の犬の毛が、\nどこで付いたのかも分かっていない。"}, {"t": 1753.3666666666666, "x": "五つ。目撃されたあの人物が、事件に\n関わっているのかどうかも分かっていない。"}, {"t": 1758.4333333333334, "x": "……ほとんど分かっていないじゃない。"}, {"t": 1760.2, "x": "そうだ。"}, {"t": 1760.8333333333333, "x": "分かっているのは、49分という時間の枠と、\n現場に残された血液とDNA型。"}, {"t": 1766.3833333333334, "x": "それと、A型の男性で、そのとき何らかのケガを\n負って出血していた、という3つの特徴だけだ。"}, {"t": 1772.5833333333333, "x": "これは私がそう思っているという話ではない。"}, {"t": 1775.1333333333334, "x": "警視庁が公表しているのが、その3つだけだ。"}, {"t": 1778.2666666666667, "x": "だから、犯人像を勝手に足しちゃいけないのね。"}, {"t": 1781.2666666666667, "x": "足せない。足したら、それは別の話になる。"}, {"t": 1784.1166666666666, "x": "この事件については、詳しい\n考察がネット上にたくさんある。"}, {"t": 1787.75, "x": "私はそこには乗らない。"}, {"t": 1789.3166666666666, "x": "30年動いていない事件で、実在の誰かを指す\n話を作るのは、私の仕事じゃないと思っている。"}, {"t": 1796.15, "x": "最後に、整理しておく。"}, {"t": 1797.75, "x": "1996年9月9日、東京都葛飾区柴又三丁目で、\n大学4年生の女性が殺害され、\n室内に火がつけられた。"}, {"t": 1806.45, "x": "当時21歳。留学に出発する2日前だった。"}, {"t": 1809.9166666666667, "x": "時間帯は、午後3時50分ごろから\n午後4時39分までの49分間。"}, {"t": 1814.85, "x": "当時の法律では、殺人の公訴時効は15年。"}, {"t": 1817.8333333333333, "x": "2011年9月9日で終わるはずだった。"}, {"t": 1820.7833333333333, "x": "2004年の改正で15年が25年になったが、\n施行前の事件には届かなかった。"}, {"t": 1826.0833333333333, "x": "2010年4月27日、公訴時効そのものが\n廃止され、進行中の事件にも適用された。"}, {"t": 1832.2, "x": "この事件は、そのとき残り1年4か月あまりだった。"}, {"t": 1835.6666666666667, "x": "そして、その法律を国会で求めた\n参考人の一人が、この事件のご遺族だった。"}, {"t": 1841.0333333333333, "x": "……間に合ったのね。"}, {"t": 1842.1833333333334, "x": "間に合った。"}, {"t": 1842.9833333333333, "x": "現場から取られたものは、\n捨てられずに保管されている。"}, {"t": 1846.1666666666667, "x": "技術のほうは、一つの部位を見るやり方から、\n十五の部位を見るやり方に変わった。"}, {"t": 1850.9833333333333, "x": "だから、いま情報が一つ\n出てくれば、照合するものはある。"}, {"t": 1854.6333333333334, "x": "そのために、いまも\n懸賞金がかかっている。上限800万円。"}, {"t": 1858.6166666666666, "x": "期間は、令和8年9月9日から令和9年9月8日まで。"}, {"t": 1862.7333333333333, "x": "情報を受け付けているのは、\n警視庁亀有警察署の特別捜査本部だ。"}, {"t": 1867.2666666666667, "x": "事件名は「柴又三丁目女子大生殺人放火事件」。"}, {"t": 1870.9, "x": "電話は、警視庁亀有警察署の代表番号、\nゼロサン、サンロクゼロナナ、ゼロイチイチゼロ。"}, {"t": 1876.7333333333333, "x": "これは警視庁がウェブサイトに公開している\n番号を、そのまま読んだものだ。"}, {"t": 1881.1, "x": "30年前の、雨の日のことよね。"}, {"t": 1883.6166666666666, "x": "ああ。傘をささずに立っていた\n人を見た、という話でもいい。"}, {"t": 1887.15, "x": "出典を挙げておく。"}, {"t": 1888.4333333333334, "x": "事件の概要、犯人の特徴、懸賞金、\n連絡先は、警視庁の公開捜査のページ。"}, {"t": 1894.15, "x": "制度の部分は、\n国立国会図書館の国会会議録検索システムから、"}, {"t": 1898.8166666666666, "x": "科学捜査の部分は、\n1992年4月7日の参議院地方行政委員会と、"}, {"t": 1904.0333333333333, "x": "2015年5月21日の参議院法務委員会。"}, {"t": 1907.4833333333333, "x": "懸賞金の制度は、\n2007年10月25日の参議院内閣委員会と、\n警察庁のウェブサイト。"}, {"t": 1913.8333333333333, "x": "現場の状況と被害者の方については、東京新聞、\n日本経済新聞、共同通信ほかの報道による。"}, {"t": 1920.3666666666666, "x": "詳しい対応は、リサーチのファイルに全部残してある。"}, {"t": 1923.4666666666667, "x": "最後に一つだけ。"}, {"t": 1924.8, "x": "この事件は、まだ終わっていない。"}, {"t": 1926.6166666666666, "x": "時効が無いから、終わりようがない。"}, {"t": 1928.7333333333333, "x": "「未解決事件」という言葉は、過去形に聞こえる。"}, {"t": 1932.0166666666667, "x": "だが、この事件の正確な状態は、\n過去形ではなく、いまも捜査中だ、ということだ。"}, {"t": 1937.6666666666667, "x": "……いまも、なのね。"}, {"t": 1938.9833333333333, "x": "ああ。だから、この動画も出す\n意味があると思っている。"}, {"t": 1942.0333333333333, "x": "この事件について思うところがあれば、\nコメントで教えてほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');

const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
