<script>
const D={"name": "117", "file": "117_編集用", "dur": 2182.3333125, "segs": [], "subs": [{"t": 0.0, "x": "1952年7月29日。北海道の芦別。"}, {"t": 3.9166666666666665, "x": "その日の夕方から翌朝までの\nどこかで線路が爆破された。"}, {"t": 7.5, "x": "国鉄の根室本線、平岸と芦別の間の線路だ。"}, {"t": 11.216666666666667, "x": "線路を？　誰がやったの？"}, {"t": 12.916666666666666, "x": "先に現場の近くに残っていた物の話をする。"}, {"t": 16.016666666666666, "x": "その一つが発破器だった。"}, {"t": 17.95, "x": "はっぱき？"}, {"t": 18.816666666666666, "x": "炭鉱で爆薬を爆発させるのに使う道具だ。"}, {"t": 21.766666666666666, "x": "その発破器には番号が付いていた。"}, {"t": 23.916666666666668, "x": "8750番。"}, {"t": 25.466666666666665, "x": "番号まで分かっている。"}, {"t": 26.883333333333333, "x": "それでも、線路を爆破した人は分かっていない。"}, {"t": 29.866666666666667, "x": "えっ、いまも分かってないの？"}, {"t": 31.716666666666665, "x": "分かっていない。事件から70年以上がたった。"}, {"t": 34.71666666666667, "x": "炭鉱で働いていた二人が起訴された。"}, {"t": 37.2, "x": "一人は無罪が確定した。"}, {"t": 38.96666666666667, "x": "もう一人は判決を聞く前に亡くなった。"}, {"t": 41.46666666666667, "x": "国を訴えた裁判まで含めると、\n最高裁の判決は26年後だ。"}, {"t": 46.1, "x": "26年も裁判をして、誰なのかは出てこなかったの？"}, {"t": 49.71666666666667, "x": "出てこなかった。裁判が\n答えたのは、別の問いだからだ。"}, {"t": 53.3, "x": "今回は1978年の最高裁の判決文を開く。"}, {"t": 57.36666666666667, "x": "そこに出てくる物を一つずつ読んでいく。"}, {"t": 59.766666666666666, "x": "発破器が2台。雷管。"}, {"t": 61.28333333333333, "x": "帳簿に伝票に手帳。"}, {"t": 62.8, "x": "物を追うと二つの裁判所の問いの違いが見えてくる。"}, {"t": 65.98333333333333, "x": "二つの裁判所って？"}, {"t": 67.58333333333333, "x": "一つは刑事の裁判だ。"}, {"t": 69.23333333333333, "x": "この二人がやったと言えるのかを問う。"}, {"t": 71.28333333333333, "x": "もう一つは国家賠償の裁判だ。"}, {"t": 73.51666666666667, "x": "あのとき疑ったのは、筋が通っていたのかを問う。"}, {"t": 76.55, "x": "そして、三つ目の問いがある。"}, {"t": 78.26666666666667, "x": "爆破したのは誰なのか。"}, {"t": 79.93333333333334, "x": "これにはどの判決も答えていない。"}, {"t": 82.15, "x": "答えの無い問いが一つ残ってるのね。"}, {"t": 84.58333333333333, "x": "最後にもう一度、\n8750番の発破器のところへ戻ってくる。"}, {"t": 89.61666666666666, "x": "事件の年を先に押さえておく。"}, {"t": 91.58333333333333, "x": "1952年の4月28日に日本の占領が終わった。"}, {"t": 95.7, "x": "線路の爆破はそのおよそ3か月後になる。"}, {"t": 98.45, "x": "戦争が終わって7年くらいたったころ？"}, {"t": 100.96666666666667, "x": "そうなる。芦別は石炭を掘る町だった。"}, {"t": 103.66666666666667, "x": "大きな炭鉱の会社があり、その下請けの会社もあった。"}, {"t": 107.11666666666666, "x": "判決文にはその二つの会社が出てくる。"}, {"t": 109.78333333333333, "x": "名前は伏せられ、アルファベットの記号になっている。"}, {"t": 112.65, "x": "親会社の鉱業所はF。"}, {"t": 114.15, "x": "下請けの会社はDだ。"}, {"t": 115.86666666666666, "x": "記号ばっかりなのね。"}, {"t": 117.31666666666666, "x": "判決文は関わった人の名前もほとんど記号にしてある。"}, {"t": 120.8, "x": "この回でもその記号を借りて話す。"}, {"t": 122.98333333333333, "x": "起訴された二人も判決文の記号で呼ぶ。"}, {"t": 125.58333333333333, "x": "控訴審の判決を待たずに亡くなった人はMさん。"}, {"t": 128.65, "x": "無罪が確定した人はAさん。"}, {"t": 130.7, "x": "名前は出さないのね。"}, {"t": 132.16666666666666, "x": "二人とも有罪は確定していない。だから\n判決文にならう。"}, {"t": 135.85, "x": "これから検察が組み立てた話が何度も出てくる。"}, {"t": 138.95, "x": "それはあくまで検察の見立てだ。"}, {"t": 140.93333333333334, "x": "事実と決まった話ではない。"}, {"t": 142.83333333333334, "x": "刑事の裁判は最後にAさんを無罪とした。"}, {"t": 145.43333333333334, "x": "この順番を先に頭に置いておいてほしい。"}, {"t": 148.06666666666666, "x": "見立ては見立て。決まったことは決まったこと、ね。"}, {"t": 151.21666666666667, "x": "その区別がこの事件では、いちばん大事になる。"}, {"t": 154.15, "x": "裁判の結論が二つあって、向きが違うからだ。"}, {"t": 157.43333333333334, "x": "向きが違うってどういうこと？"}, {"t": 159.23333333333332, "x": "それは判決文の中身を見ていけば分かる。"}, {"t": 162.41666666666666, "x": "爆破のあとに見つかった物を判決文から拾っていく。"}, {"t": 165.75, "x": "まず発破器。判決の中では、証21号と呼ばれる。"}, {"t": 169.45, "x": "次に雷管。こちらは証10号だ。"}, {"t": 171.76666666666668, "x": "らいかんって何？"}, {"t": 172.98333333333332, "x": "爆薬に差し込んで、火を付ける\n役の小さな金属の筒だ。"}, {"t": 176.73333333333332, "x": "発破器で電気を送ると雷管が働き、爆薬に火が回る。"}, {"t": 180.53333333333333, "x": "二つをつなぐ電線もある。発破母線と呼ぶ。"}, {"t": 183.41666666666666, "x": "判決文には、鉄でできたハンドルの話も出てくる。"}, {"t": 186.88333333333333, "x": "道具がひと通りそろってるのね。"}, {"t": 188.93333333333334, "x": "どれも炭鉱では毎日のように使う物だ。"}, {"t": 191.51666666666668, "x": "炭鉱の町では珍しい道具ではなかった。"}, {"t": 194.21666666666667, "x": "それなら、どこの物か調べれば早そうだけど？"}, {"t": 197.2, "x": "捜査もそう考えた。どの炭鉱のどの坑道の物か。"}, {"t": 200.53333333333333, "x": "坑道は石炭を掘るために地下に掘った通路だ。"}, {"t": 203.36666666666667, "x": "下請けのDには、六坑と三坑という坑道があった。"}, {"t": 206.65, "x": "捜査は、やがてこのDの坑道に目を向けていく。"}, {"t": 209.66666666666666, "x": "番号もあって、形もある。すぐ決まりそうだけど。"}, {"t": 213.0, "x": "そう聞こえるだろう。"}, {"t": 214.11666666666667, "x": "だがここがこの事件でいちばんこじれた所だ。"}, {"t": 216.86666666666667, "x": "一つの発破器について、番号と\n形が別の場所を指していた。"}, {"t": 220.96666666666667, "x": "同じ物なのに？"}, {"t": 222.23333333333332, "x": "同じ1台なのにだ。まず番号のほうから見ていく。"}, {"t": 225.93333333333334, "x": "証21号の発破器には、8750という番号があった。"}, {"t": 230.16666666666666, "x": "持ち主は親会社のF鉱業所だった。"}, {"t": 232.71666666666667, "x": "じゃあF鉱業所から盗まれた物ってこと？"}, {"t": 235.4, "x": "F鉱業所では、盗まれた発破器がほかにもあった。"}, {"t": 238.65, "x": "判決文にそう書いてある。"}, {"t": 240.33333333333334, "x": "問題は8750番がどこを通って線路まで来たかだ。"}, {"t": 244.13333333333333, "x": "のちに国を訴えた側はこう主張した。"}, {"t": 246.56666666666666, "x": "8750番は1951年の11月ごろに盗まれていた。"}, {"t": 251.31666666666666, "x": "そのあと人の手を経て売られていた物だと。"}, {"t": 253.96666666666667, "x": "事件の前の年に、もう盗まれてたの？"}, {"t": 256.6166666666667, "x": "それが訴えた側の言い分だ。"}, {"t": 258.46666666666664, "x": "捜査する側も1953年の8月には\n知っていたはずだ、とも言った。"}, {"t": 263.3666666666667, "x": "知ってたのに黙ってたってこと？"}, {"t": 265.4166666666667, "x": "訴えた側はそう見ていた。"}, {"t": 267.05, "x": "ここで一つ気をつけたい。"}, {"t": 268.6666666666667, "x": "その盗んだとされた人が、\n爆破したと言った人はいない。"}, {"t": 272.18333333333334, "x": "判決文でも、その人は記号で少し出てくるだけだ。"}, {"t": 275.6166666666667, "x": "では裁判所は8750番の道筋をどう見たのか。"}, {"t": 279.26666666666665, "x": "高裁はこう書いた。"}, {"t": 280.53333333333336, "x": "8750番がDに流れ込んだ経路は分からない。"}, {"t": 283.96666666666664, "x": "それでも、流れ込んだ可能性が\n全く否定されたわけではない。"}, {"t": 287.71666666666664, "x": "最高裁はこの見方を正しいとして認めた。"}, {"t": 290.65, "x": "分からないけど無いとも言えない、ってこと？"}, {"t": 293.0833333333333, "x": "そういう書き方だ。"}, {"t": 294.3333333333333, "x": "この言い回しはこのあと形を変えて、何度も出てくる。"}, {"t": 297.6666666666667, "x": "どっちにも決めないための言葉に聞こえるけど。"}, {"t": 300.45, "x": "決めないことで、検察の見立てがそのまま残る。"}, {"t": 303.45, "x": "番号の話はいったん置いて、次は形の話だ。"}, {"t": 307.3666666666667, "x": "捜査は、なぜ8750番をDの発破器だと考えたのか。"}, {"t": 311.56666666666666, "x": "Dの坑道で同じ形の発破器が\n使われていた、という話が集まったからだ。"}, {"t": 316.51666666666665, "x": "同じ形って、どんな形？"}, {"t": 318.6666666666667, "x": "肩に掛ける革のひもが付いている。"}, {"t": 320.76666666666665, "x": "そのひもの止め金が、ボタン式に見える発破器だ。"}, {"t": 323.95, "x": "Mさんの調書には、\nその発破器の略図まで付いていた。"}, {"t": 327.45, "x": "絵が付いてたの？"}, {"t": 328.56666666666666, "x": "調書に添えられていたと判決文にある。"}, {"t": 330.98333333333335, "x": "ほかにも何人もの調書が、同じ方向を向いていた。"}, {"t": 334.18333333333334, "x": "刑事の法廷での証言にも同じ趣旨のものがあった。"}, {"t": 337.26666666666665, "x": "Dの坑道に証21号と\n同じ形の発破器があった、という方向だ。"}, {"t": 341.71666666666664, "x": "高裁は、そう判断する材料が数々あったと書いた。"}, {"t": 345.1, "x": "最高裁もその判断を是認した。"}, {"t": 347.43333333333334, "x": "でも形が同じでも同じ物とは限らないわよね？"}, {"t": 350.6, "x": "そこだ。形の話と番号の話はここで別れる。"}, {"t": 353.96666666666664, "x": "形は下請けのDの坑道を指していた。"}, {"t": 356.45, "x": "番号は持ち主のF鉱業所と\n1951年の盗難を指していた。"}, {"t": 360.9166666666667, "x": "そうだ。捜査は形のほうを取った。"}, {"t": 363.18333333333334, "x": "Dの坑道から盗まれたという筋で、話を組み立てた。"}, {"t": 366.8, "x": "番号のほうはどうなったの？"}, {"t": 368.51666666666665, "x": "番号の道筋は分からなくてもよいという扱いになった。"}, {"t": 371.8666666666667, "x": "さっきの「可能性が全く否定されたわけではない」だ。"}, {"t": 375.3, "x": "そして話はもう1台の発破器に移る。"}, {"t": 378.53333333333336, "x": "判決文にはもう1台の発破器が出てくる。"}, {"t": 381.26666666666665, "x": "証129号。番号は15359だ。"}, {"t": 385.06666666666666, "x": "2台目？"}, {"t": 385.9166666666667, "x": "訴えた側はこう主張した。"}, {"t": 387.7, "x": "Dの坑道で6月の中ごろに\n無くなったのは、この15359番だと。"}, {"t": 393.06666666666666, "x": "現場の8750番とは、別の発破器が無くなってたの？"}, {"t": 397.28333333333336, "x": "訴えた側はそう見た。"}, {"t": 398.76666666666665, "x": "そして、15359番は三坑の坑道で見つかっていた。"}, {"t": 403.1666666666667, "x": "置き忘れたのは、遅くとも\n1952年の6月初めとみられる。"}, {"t": 407.65, "x": "判決文はそう書いている。"}, {"t": 409.43333333333334, "x": "盗まれたんじゃなくて、置き忘れてたのね。"}, {"t": 412.1333333333333, "x": "だが検察の見立ては別だった。"}, {"t": 414.18333333333334, "x": "Dには8750番もあり、それも\n6月ごろ無くなったという見立てだ。"}, {"t": 418.8833333333333, "x": "そうすると15359番は事件と関係のない発破器になる。"}, {"t": 423.53333333333336, "x": "関係ないなら見つかったことも\n言わなくていいってこと？"}, {"t": 426.68333333333334, "x": "訴えた側はそこを「隠した」と責めた。"}, {"t": 429.3833333333333, "x": "15359番が法廷に出されたのは、1956年の5月だ。"}, {"t": 434.71666666666664, "x": "刑事の一審の途中だった。"}, {"t": 436.51666666666665, "x": "訴えた側の言い方では、3年も隠していたとなる。"}, {"t": 439.95, "x": "3年も？"}, {"t": 440.8833333333333, "x": "高裁と最高裁は隠したとは認めなかった。"}, {"t": 443.75, "x": "検察の見立てでは、事件と直接関係がない物だった。"}, {"t": 447.51666666666665, "x": "関係がない物を出さないのは\n隠したことにはならない、という理屈だ。"}, {"t": 451.6666666666667, "x": "見立て次第で、隠したかどうかまで変わるのね。"}, {"t": 454.6, "x": "この判決の考え方はだいたいその形をしている。"}, {"t": 457.8, "x": "見立てに筋が通れば、そこから先の動きも筋が通る。"}, {"t": 461.45, "x": "見立てが外れていたら？"}, {"t": 463.03333333333336, "x": "それを決めるのは\n国家賠償の裁判ではない、というのが判決の立場だ。"}, {"t": 467.96666666666664, "x": "発破器の話はまだ続く。"}, {"t": 469.8333333333333, "x": "F鉱業所では、証21号のほかにも\n盗まれた発破器があった。"}, {"t": 473.98333333333335, "x": "判決文によるとある日、発破器が2台持ち込まれた。"}, {"t": 477.3833333333333, "x": "修理を頼むためにF鉱業所へ持ってきたのだ。"}, {"t": 480.21666666666664, "x": "ところが、盗まれた物だとして取り上げられた。"}, {"t": 483.21666666666664, "x": "修理に出したら盗まれた物だったの？"}, {"t": 485.6666666666667, "x": "そういう供述が得られた、と判決文は書いている。"}, {"t": 488.75, "x": "2台の名前も残っている。"}, {"t": 490.43333333333334, "x": "新高式の発破器と、鳥居式の発破器のA28号だ。"}, {"t": 494.5, "x": "発破器って、そんなに外に出回ってたのね。"}, {"t": 497.48333333333335, "x": "F鉱業所の発破器が外へ出ていく\n道はあった、ということだ。"}, {"t": 501.2, "x": "この話はどちらの側にも使えた。"}, {"t": 503.45, "x": "検察にとっては、Dにも\n流れ込みえたという裏付けになる。"}, {"t": 506.98333333333335, "x": "訴えた側にとっては、\n誰の手にも渡りえたという話になる。"}, {"t": 510.8333333333333, "x": "同じ話が両方の味方をするの？"}, {"t": 513.1833333333333, "x": "この事件の証拠にはそういう物が多い。"}, {"t": 515.4833333333333, "x": "持ち主は分かる。誰が持ち出したかは分からない。"}, {"t": 518.4, "x": "持ち出されたあとにどこを回ったかも分からない。"}, {"t": 521.1, "x": "炭鉱の道具って、管理がゆるかったの？"}, {"t": 523.7, "x": "ゆるかったと言い切れる材料は判決文には無い。"}, {"t": 526.4666666666667, "x": "ただ、盗まれた発破器が\n何台もあったことは書いてある。"}, {"t": 529.8833333333333, "x": "それだけでも8750番の道筋は一本に絞れなくなる。"}, {"t": 534.1, "x": "番号があってもたどれないのは、そのせいなのね。"}, {"t": 537.0333333333333, "x": "では次に、もう一つの道具を見よう。雷管だ。"}, {"t": 540.6833333333333, "x": "雷管、証10号の話をする。"}, {"t": 542.8, "x": "見つかったときの様子について、\n二通りの証拠があった。"}, {"t": 546.25, "x": "一つは緑青がふいておらず、\n鈍い赤銅色だったという証拠だ。"}, {"t": 550.1333333333333, "x": "新しい感じのもので、管に刻まれた\n「5」の数字が見えていた。"}, {"t": 554.3666666666667, "x": "もう一つは？"}, {"t": 555.4333333333333, "x": "錆のようなものが付いていたという証拠だ。"}, {"t": 557.9666666666667, "x": "新しいのか古いのか正反対じゃない。"}, {"t": 560.3833333333333, "x": "この違いは雷管がいつから現場にあったかに関わる。"}, {"t": 563.4833333333333, "x": "鑑定をした人の一人はこう見立てた。"}, {"t": 565.85, "x": "この雷管は24時間ほどダイナマイトに\n差し込まれていた物だと。"}, {"t": 569.8833333333333, "x": "24時間？"}, {"t": 570.9666666666667, "x": "訴えた側は、現場の雷管は\n爆破と別の物だと主張していた。"}, {"t": 575.0833333333334, "x": "その主張を支える鑑定の一つがこれだった。"}, {"t": 577.8666666666667, "x": "高裁は、この鑑定の実験には不正確な\n要因があるとして採らなかった。"}, {"t": 582.35, "x": "そして、新しい感じだったという\n証拠のほうを信用した。"}, {"t": 585.8166666666667, "x": "現場の雷管は爆破に使われた物と同じだと認めた。"}, {"t": 589.2833333333333, "x": "最高裁は、この判断を「正当として\n是認しえないものではなく」と書いた。"}, {"t": 594.1166666666667, "x": "是認しえないものではなく、って回りくどいわね。"}, {"t": 596.95, "x": "正しいと言い切ってはいない。だが、退けもしない。"}, {"t": 600.0166666666667, "x": "ほかの所では、「正当として\n是認することができ」と書いている。"}, {"t": 604.0833333333334, "x": "その違いに、何か意味があるの？"}, {"t": 606.2666666666667, "x": "判決文からは分からない。"}, {"t": 607.95, "x": "言葉の違いがある、というところまでだ。"}, {"t": 610.9833333333333, "x": "雷管にはもう一つ争いがあった。"}, {"t": 613.1666666666666, "x": "法廷に出された証10号の雷管は、\n頭の部分が短くなっていた。"}, {"t": 617.55, "x": "短く？　誰かが切ったの？"}, {"t": 619.5166666666667, "x": "訴えた側は、人の手で切られたと見た。\nそういう鑑定もあった。"}, {"t": 623.4833333333333, "x": "高裁は、切ったのではなく\n腐食して欠けたのだと認めた。"}, {"t": 627.1333333333333, "x": "切ったのとさびて欠けたので、何が変わるの？"}, {"t": 629.95, "x": "誰かが手を加えたなら、現場の物と\n法廷の物が同じか怪しくなる。"}, {"t": 634.2, "x": "さらに、ある巡査がこの雷管を\n人に預けたかどうかも争われた。"}, {"t": 638.2, "x": "預けたと読める保管証が2通あったからだ。"}, {"t": 640.9666666666667, "x": "保管証があるなら預けたんじゃないの？"}, {"t": 643.2, "x": "高裁は、保管証の言葉づかいに\n不適切なところがあるとした。"}, {"t": 647.1833333333333, "x": "その書き方だけでは巡査の話の信用は\n崩れない、という判断だ。"}, {"t": 651.3666666666667, "x": "預けた先で現場の雷管が無くなったとは\n認められない、ともした。"}, {"t": 655.5, "x": "つまり、すり替わってはいないっていう結論？"}, {"t": 658.1333333333333, "x": "そうだ。現場で拾った雷管と法廷に出た雷管は同じ物。"}, {"t": 661.9, "x": "訴えた側は違うと言い、高裁と\n最高裁は同じだと認めた。"}, {"t": 665.9, "x": "物は一つなのに話は二つに分かれるのね。"}, {"t": 668.8833333333333, "x": "そして、どちらの結論を\n取っても出てこないことがある。"}, {"t": 672.1, "x": "その雷管を線路に仕掛けたのが誰か、だ。"}, {"t": 674.95, "x": "同じ物だと決まっても、置いた人は決まらないのね。"}, {"t": 678.2333333333333, "x": "次は人が捕まっていった順番の話だ。"}, {"t": 681.6, "x": "時計を少し戻す。捜査が人に\n向かったのは、事件の翌年だ。"}, {"t": 685.8333333333334, "x": "判決文には、一人の逮捕の日付が\nはっきり書いてある。"}, {"t": 689.4, "x": "ある人は1953年2月18日に逮捕された。"}, {"t": 693.25, "x": "そして3月11日に釈放された。"}, {"t": 695.9333333333333, "x": "その人が疑われてたの？"}, {"t": 697.7833333333333, "x": "何の疑いで逮捕されたかは\n判決文からは読み取れない。"}, {"t": 701.15, "x": "この人はのちに供述をした側として出てくる。"}, {"t": 704.0333333333333, "x": "訴えた側は、この捜査について強い言葉を使った。"}, {"t": 707.4166666666666, "x": "異常に多くの参考人を、\n異常なほど繰り返して逮捕したと。"}, {"t": 711.25, "x": "参考人を逮捕するの？"}, {"t": 712.9666666666667, "x": "参考人は本来、話を聞かせてもらう側だ。"}, {"t": 715.9833333333333, "x": "そこを逮捕していいのかが、争いの一つになった。"}, {"t": 719.1333333333333, "x": "最高裁はまずこう線を引いた。"}, {"t": 721.0833333333334, "x": "ほかの人の疑いについて、話を\n聞くためだけの逮捕は違法だ。"}, {"t": 725.0833333333334, "x": "だが本人の疑いで調べている最中のことは別になる。"}, {"t": 728.5166666666667, "x": "本人が自分からほかの人の話をしたなら、\n聞くのは違法ではない。"}, {"t": 732.7333333333333, "x": "じゃあ芦別ではどっちだったの？"}, {"t": 734.6333333333333, "x": "爆破の話を聞くためだけに\n逮捕したと認める証拠は無い。"}, {"t": 738.25, "x": "最高裁はそう結論した。"}, {"t": 740.0666666666667, "x": "参考人の話を捜査官が信用したことも、\n不合理ではないとした。"}, {"t": 744.4333333333333, "x": "逮捕の理由はそれぞれにあった、という判断なのね。"}, {"t": 747.6, "x": "高裁は1953年当時の実務の慣行に\n照らしても、と添えていた。"}, {"t": 752.3666666666667, "x": "ただ最高裁は、その一言は結論に\n関係しないと片付けている。"}, {"t": 756.75, "x": "慣行だから許される、とまでは言わなかったのね。"}, {"t": 759.8, "x": "言わなかった。結論は、証拠が無いから\n違法とは言えない、の一本だ。"}, {"t": 764.6666666666666, "x": "MさんとAさんが逮捕された\n順番も、判決文に書いてある。"}, {"t": 768.45, "x": "最初の逮捕は火薬類取締法違反の疑いだった。"}, {"t": 771.9666666666667, "x": "線路の爆破じゃなくて？"}, {"t": 773.6, "x": "最初は火薬の疑いだ。"}, {"t": 775.25, "x": "その勾留中に、発破器を盗んだ疑いも調べた。"}, {"t": 778.55, "x": "列車の往来を危うくした疑いも調べた。"}, {"t": 781.1333333333333, "x": "そのあとでその二つの疑いで\n改めて逮捕し、勾留した。"}, {"t": 784.9166666666666, "x": "軽い疑いで捕まえておいて本命の話を聞く、ってやつ？"}, {"t": 788.55, "x": "いわゆる別件逮捕だと訴えた側は言った。"}, {"t": 791.1666666666666, "x": "最高裁はこう考えた。"}, {"t": 792.8166666666667, "x": "二つの疑いが社会の出来事として\n一続きなら、話は変わる。"}, {"t": 797.0166666666667, "x": "片方で勾留している間にもう\n片方を調べても違法ではない。"}, {"t": 800.7, "x": "そして罪が別々なら、それぞれ逮捕を求めてよい。"}, {"t": 804.1, "x": "一続きだから一緒に調べていい。でも\n罪は別だから逮捕も別？"}, {"t": 808.2833333333333, "x": "そういう組み立てだ。"}, {"t": 809.35, "x": "前の年の最高裁の決定を引いている。"}, {"t": 812.0166666666667, "x": "どっちに転んでも捕まえられる気がするけど？"}, {"t": 814.7333333333333, "x": "訴えた側もまさにそこを問題にしていた。"}, {"t": 817.35, "x": "だが判決はそう書いて、もう一つ扉を閉めた。"}, {"t": 820.4166666666666, "x": "ここで言葉を一つ整理しておく。"}, {"t": 822.4833333333333, "x": "逮捕は疑いのある人を短い間とどめておくことだ。"}, {"t": 825.75, "x": "勾留は裁判官が認めて、さらに\n長くとどめておくことだ。"}, {"t": 829.6, "x": "逮捕と勾留を罪ごとに繰り返せるのね。"}, {"t": 832.2166666666667, "x": "罪が別ならそれぞれに審査を\n受ける、というのが最高裁の考えだ。"}, {"t": 836.3166666666667, "x": "その繰り返しの先にMさんの自白がある。"}, {"t": 839.55, "x": "Mさんの自白の話をする。"}, {"t": 841.4166666666666, "x": "訴えた側によると、自白は逮捕から\n140日以上たってからだった。"}, {"t": 845.9166666666666, "x": "そのあとも否認と自白を\n繰り返し、最後は否認に戻った。"}, {"t": 849.7333333333333, "x": "140日って4か月半よね？"}, {"t": 852.1166666666667, "x": "そのくらいだ。"}, {"t": 853.0666666666667, "x": "憲法には一つの決まりがある。"}, {"t": 854.9833333333333, "x": "不当に長く閉じ込めた\nあとの自白は、証拠にできない。"}, {"t": 858.35, "x": "訴えた側は、Mさんの自白がまさにそれだと言った。"}, {"t": 861.65, "x": "高裁と最高裁の答えはこうだ。"}, {"t": 863.7833333333333, "x": "事件が複雑で、関わった\n人たちの話も入り組んでいた。"}, {"t": 867.4833333333333, "x": "だから140日以上たってからでも\n不当に長い拘禁のあととは言えない。"}, {"t": 871.9, "x": "複雑だから長くてもいい、っていう理屈？"}, {"t": 874.55, "x": "判決文の理屈はそう読める。"}, {"t": 876.4666666666667, "x": "検察がその自白を本当だと判断したことも\n誤りとは言えない、とした。"}, {"t": 880.95, "x": "ここで一つ確かめておきたい。"}, {"t": 882.8666666666667, "x": "刑事の裁判で有罪が確定した人は一人もいない。"}, {"t": 886.1166666666667, "x": "国家賠償の裁判が見たのは、\n自白が本当だったかではない。"}, {"t": 889.9166666666666, "x": "検察が本当だと思ったのは\n無理もなかったか、だけだ。"}, {"t": 893.5166666666667, "x": "同じ自白を別の物差しで測ってるのね。"}, {"t": 896.3166666666667, "x": "物差しが違えば同じ自白でも答えが変わる。"}, {"t": 899.1333333333333, "x": "最高裁の「誤りとは言えない」は、\nMさんが犯人だという意味ではない。"}, {"t": 903.65, "x": "そこを取り違えると、話がまるで逆になっちゃうわね。"}, {"t": 907.0, "x": "だからこの回は、その取り違えをしない。"}, {"t": 910.1, "x": "検察の筋書きの始まりの場面を見ておく。"}, {"t": 912.85, "x": "ある人の供述がその土台になっていた。"}, {"t": 915.3666666666667, "x": "1952年6月20日の午後2時半ごろ、\nMさんの飯場に何人かが集まった。"}, {"t": 920.85, "x": "そこで火薬を手に入れる\n相談をしていたのを見た、という供述だ。"}, {"t": 924.7666666666667, "x": "飯場って？"}, {"t": 925.6833333333333, "x": "炭鉱で働く人たちが寝泊まりする宿舎のことだ。"}, {"t": 928.95, "x": "繰り返すがこれは供述で、検察の筋書きの一部だ。"}, {"t": 932.45, "x": "刑事の裁判は、この筋書きで有罪を認めなかった。"}, {"t": 935.9333333333333, "x": "その場にいたとされた人たちはどうなったの？"}, {"t": 938.5833333333334, "x": "判決文には、ほかにも何人かが記号で並んでいる。"}, {"t": 941.9166666666666, "x": "そのうち一人はあとになって、アリバイが成り立った。"}, {"t": 945.0333333333333, "x": "その場にいなかったって分かったの？"}, {"t": 947.1166666666667, "x": "そうだ。ただしそれがはっきりしたのは\n二人の起訴のあとだった。"}, {"t": 950.7666666666667, "x": "ほかの人たちは起訴されなかった。"}, {"t": 953.0166666666667, "x": "一人はいなかったのに、話そのものは残ったの？"}, {"t": 956.2333333333333, "x": "訴えた側は、そこを突いた。"}, {"t": 958.0166666666667, "x": "供述が作り話だという証拠だと。"}, {"t": 960.45, "x": "最高裁はこう書いた。"}, {"t": 961.9, "x": "残りの人には、アリバイが\n成り立つという材料が無かった。"}, {"t": 965.3666666666667, "x": "捜査はアリバイを調べ、\nほかの証拠とも合わせて考えていた。"}, {"t": 968.95, "x": "だから、検察が供述を\n疑わなかったことに誤りはなかったと。"}, {"t": 973.1666666666666, "x": "一人の話が崩れても全体は\n崩れない、って判断なのね。"}, {"t": 976.9666666666667, "x": "国家賠償の裁判の物差しではそうなる。"}, {"t": 979.5333333333333, "x": "刑事の裁判がこの供述をどう見たかは、\n今回読んだ判決文には無い。"}, {"t": 984.0166666666667, "x": "残っているのは、国家賠償の側の見方だけなのね。"}, {"t": 987.4166666666666, "x": "だからこの回は、その見方を\n「検察を責めるほどではない」の意味でだけ扱う。"}, {"t": 992.8833333333333, "x": "筋書きの次の場面は道具の受け渡しだ。"}, {"t": 995.4833333333333, "x": "検察の筋書きでは、MさんがAさんに\n道具を渡したことになっていた。"}, {"t": 999.7666666666667, "x": "火薬に発破器に電線、そしてハンドルだ。"}, {"t": 1002.5, "x": "何度も言うがAさんの無罪は確定している。"}, {"t": 1005.05, "x": "受け渡しの日付について、供述した\n人は途中で言い直している。"}, {"t": 1009.0833333333334, "x": "最初は7月7日。のちに7月19日。"}, {"t": 1012.3, "x": "12日もずれてるじゃない。"}, {"t": 1014.0166666666667, "x": "最高裁は、言い直したあとの供述は具体的だとした。"}, {"t": 1017.5166666666667, "x": "細かい所に違いはあるが、\nMさんの供述ともおおむね合うと書いた。"}, {"t": 1021.7333333333333, "x": "もう一人、供述した人がいたのよね？"}, {"t": 1024.4, "x": "いた。その人の供述には、一部に思い違いがあった。"}, {"t": 1027.9333333333334, "x": "一度話したことを引っ込めた所もあった。"}, {"t": 1030.5833333333333, "x": "それでも話を聞いたという点では\n基本的に一貫している、と判断された。"}, {"t": 1035.2166666666667, "x": "日付が変わっても筋は変わらない、って判断なのね。"}, {"t": 1038.4833333333333, "x": "筋書きを支える供述はどれも少しずつ揺れていた。"}, {"t": 1041.65, "x": "その揺れをどこまで許すか。"}, {"t": 1043.3, "x": "国家賠償の裁判は、検察が\n信じたのは無理もない、の幅で見た。"}, {"t": 1047.7, "x": "刑事の裁判の幅は？"}, {"t": 1049.3, "x": "刑事の裁判は、確かにやったと言えるかの幅で見る。"}, {"t": 1052.5166666666667, "x": "そこまでは、届かなかった。"}, {"t": 1054.2, "x": "結論がAさんの無罪だ。"}, {"t": 1056.05, "x": "同じ揺れでも、物差しで通ったり\n通らなかったりするのね。"}, {"t": 1059.65, "x": "そしてこの揺れは、日付の話でもう一度出てくる。"}, {"t": 1063.45, "x": "筋書きにはもう一つ大事な日付がある。"}, {"t": 1066.0, "x": "Mさんが爆破の計画を打ち明けて、\n仲間に誘ったとされる日だ。"}, {"t": 1070.0, "x": "検察は冒頭陳述で、7月12日、13日ごろとしていた。"}, {"t": 1074.5833333333333, "x": "ぼうとうちんじゅつ？"}, {"t": 1075.8, "x": "裁判の初めに、検察が何を\n証明するかを述べる場面だ。"}, {"t": 1079.5333333333333, "x": "ところが、ある人の手帳にこう書いてあった。"}, {"t": 1082.2166666666667, "x": "Mさんは、7月13日まで札幌へ\n賃金の交渉に行っていた。"}, {"t": 1086.5166666666667, "x": "じゃあその日は芦別にいなかったってこと？"}, {"t": 1089.0333333333333, "x": "訴えた側はそう主張した。"}, {"t": 1090.8166666666666, "x": "高裁の判断はこうだ。"}, {"t": 1092.35, "x": "冒頭陳述は「ごろ」と書いていて、\n日付を決めつけてはいない。"}, {"t": 1096.3333333333333, "x": "Mさんは13日の早朝には飯場に\n戻っていた、と見られる証拠もある。"}, {"t": 1100.6833333333334, "x": "誘ったのは、13日か\n14日と見るのが合うと高裁は置き直した。"}, {"t": 1105.0833333333333, "x": "日付のほうを動かしたのね。"}, {"t": 1106.95, "x": "ところが、動かした先の14日にも記録があった。"}, {"t": 1110.2166666666667, "x": "誘われた側の人が一番方と\n二番方を続けて働いた、という記録だ。"}, {"t": 1115.1, "x": "いちばんかたって？"}, {"t": 1116.3333333333333, "x": "炭鉱の交代勤務の呼び名だ。"}, {"t": 1118.15, "x": "順に入れ替わって働く。"}, {"t": 1119.8333333333333, "x": "高裁は、その記録の読み方も退けた。"}, {"t": 1122.4666666666667, "x": "続けて働いた意味ではないと。"}, {"t": 1124.45, "x": "午後2時過ぎに二番方で坑内に\n入るまでは飯場にいた、と見た。"}, {"t": 1128.4666666666667, "x": "手帳も記録もあるのに、\nどっちの日付にも決まらないのね。"}, {"t": 1132.0666666666666, "x": "決まらないまま、検察の判断は\n不合理ではないという結論が残った。"}, {"t": 1136.3, "x": "日付を追うと、紙の記録がどれも弱く扱われている。"}, {"t": 1139.6166666666666, "x": "その紙の正体が、次の帳簿だ。"}, {"t": 1142.5333333333333, "x": "ここで出てくるのが工数簿と操業証だ。"}, {"t": 1145.1333333333334, "x": "こうすうぼ？"}, {"t": 1145.9833333333333, "x": "誰がいつ働いたかを付けておく帳簿だ。"}, {"t": 1148.45, "x": "操業証はその日の作業を記す伝票のような物になる。"}, {"t": 1151.8333333333333, "x": "働いた日が分かれば、誰が\nどこにいたかも分かるはずだった。"}, {"t": 1155.4, "x": "ところが、高裁はこの帳簿も\n伝票も信用できないと判断した。"}, {"t": 1159.5, "x": "会社の記録なのに？"}, {"t": 1161.0, "x": "理由がいくつも挙げられている。"}, {"t": 1162.7166666666667, "x": "工数簿と操業証では、\n出勤の書き込みが合わない所が少なくない。"}, {"t": 1167.0333333333333, "x": "三坑の7月分の操業証のうち\n52枚には、検印が無かった。"}, {"t": 1171.2833333333333, "x": "主任や所長や係員の印が押されていなかったのだ。"}, {"t": 1174.5666666666666, "x": "あとから一気に書き込まれた物だと高裁は見た。"}, {"t": 1177.4666666666667, "x": "働いていないのに働いたことにする\n伝票も作られていた。"}, {"t": 1181.05, "x": "いわゆる空票だ。"}, {"t": 1182.3333333333333, "x": "からひょう……。"}, {"t": 1183.1, "x": "Dの経営は苦しく、坑夫の働く\n気持ちも低かったと書かれている。"}, {"t": 1187.2666666666667, "x": "勤務の様子は乱れていたとまで書いてある。"}, {"t": 1189.8333333333333, "x": "帳簿があてにならないなら、アリバイも\n作れないし崩せもしないわね。"}, {"t": 1193.8, "x": "その通りだ。"}, {"t": 1194.7166666666667, "x": "検察はこの帳簿を信用できないと見て、\nすぐには法廷に出さなかった。"}, {"t": 1199.0333333333333, "x": "最高裁はそれも不合理ではないとした。"}, {"t": 1201.5, "x": "出さなかったことも責められないの？"}, {"t": 1203.6666666666667, "x": "信用できない物を出さなかっただけ、という扱いだ。"}, {"t": 1206.8666666666666, "x": "作った人の分からない\n別の工数簿が出されたこともあった。"}, {"t": 1210.4166666666667, "x": "それも出欠の大筋は合っていて、\n話を誤らせた形跡はないとされた。"}, {"t": 1215.05, "x": "帳簿はどれも決め手にはならなかったのね。"}, {"t": 1217.5833333333333, "x": "ならなかった。それは火薬が\n消えた時期の話にも響いてくる。"}, {"t": 1221.9333333333334, "x": "火薬がいつ無くなったのか。\nここにも二つの話があった。"}, {"t": 1225.5166666666667, "x": "F鉱業所の坑務所から、雷管と\nダイナマイトと電線が無くなった。"}, {"t": 1229.6833333333334, "x": "それは7月7日から10日の間だという供述があった。"}, {"t": 1233.15, "x": "訴えた側は帳簿を見ろと言った。"}, {"t": 1235.15, "x": "持ち出したとされた二人は、\nその頃同じ番方に入っていないと。"}, {"t": 1239.25, "x": "一緒に働いてないなら一緒に持ち出せないじゃない？"}, {"t": 1242.2333333333333, "x": "ところが高裁は、もとになった\n火薬の日報が不正確だとした。"}, {"t": 1246.1833333333334, "x": "帳簿のほうもさっき見たとおり正確ではないとした。"}, {"t": 1249.2166666666667, "x": "日報も帳簿も、どっちもあてにならないの？"}, {"t": 1251.95, "x": "そうなると残るのは人の供述だ。"}, {"t": 1254.1666666666667, "x": "検察の筋書きにある供述では、こうなっていた。"}, {"t": 1257.2833333333333, "x": "6月30日に頼まれた。"}, {"t": 1259.3166666666666, "x": "そして7月4日に、三坑から飯場まで\nダイナマイトと雷管を運んだ。"}, {"t": 1263.8666666666666, "x": "それも供述なのよね？"}, {"t": 1265.5, "x": "供述だ。高裁は、検察がそれを\n信じたことは不当ではないとした。"}, {"t": 1269.8166666666666, "x": "刑事の裁判がそれで\n有罪にしなかったことは、結論が示している。"}, {"t": 1274.0666666666666, "x": "紙が信用されなくて人の話が残る……。"}, {"t": 1276.8166666666666, "x": "この事件の証拠は紙が弱く、\n言葉が強い。そういう並びだ。"}, {"t": 1280.7, "x": "鉄製のハンドルの話も同じだ。"}, {"t": 1282.8666666666666, "x": "筋書きでは、Mさんが\n6月10日ごろにある人から受け取った。"}, {"t": 1286.7333333333333, "x": "電線も7月ごろ現場で新しい物と\n取り替えて持ち帰った、という筋だ。"}, {"t": 1291.4833333333333, "x": "それも捜査する側がそう判断した、ってことね？"}, {"t": 1294.5666666666666, "x": "そうだ。最高裁は、その判断が\n不合理ではないとした高裁を是認した。"}, {"t": 1299.0833333333333, "x": "「不合理ではない」は、事実だったと同じではない。"}, {"t": 1302.6833333333334, "x": "紙の話をもう一つ。"}, {"t": 1304.2833333333333, "x": "訴えた側が隠されたと主張した物の一覧がある。"}, {"t": 1307.5, "x": "5人分の手帳。Mさんの飯場の食事伝票。"}, {"t": 1310.3666666666666, "x": "Mさんの作業日誌。"}, {"t": 1311.9333333333334, "x": "食事伝票？"}, {"t": 1313.0833333333333, "x": "飯場で誰がいつ食事をしたかを付けた伝票だ。"}, {"t": 1315.9833333333333, "x": "その日その人が飯場にいたかの手がかりになりうる。"}, {"t": 1318.9666666666667, "x": "訴えた側は、二人の疑いを打ち消す\n大事な証拠だったと言った。"}, {"t": 1323.0, "x": "最高裁の答えは二つに分かれる。"}, {"t": 1325.2, "x": "手帳は、検察が値打ちが無いと\n判断して出さなかった。"}, {"t": 1328.6666666666667, "x": "それは不合理ではない。"}, {"t": 1329.9666666666667, "x": "食事伝票と作業日誌は、そもそも\n預かったという証拠が無い。"}, {"t": 1333.9666666666667, "x": "預かってないなら隠しようもない、ってこと？"}, {"t": 1336.6, "x": "そういう理屈になる。"}, {"t": 1337.8666666666666, "x": "ここで、訴えた側が「隠された」と\n言った物を並べてみる。"}, {"t": 1341.75, "x": "発破器の15359番。"}, {"t": 1344.15, "x": "工数簿と操業証。手帳。"}, {"t": 1345.9333333333334, "x": "食事伝票と作業日誌。"}, {"t": 1347.8666666666666, "x": "全部、隠したとは認められなかったの？"}, {"t": 1350.5166666666667, "x": "認められなかった。出さなかった\n理由があった、という判断だ。"}, {"t": 1354.2833333333333, "x": "その理由はいつも同じ所から来ている。"}, {"t": 1356.8, "x": "検察の見立て？"}, {"t": 1358.1166666666666, "x": "そうだ。見立てに合わない物は、\n関係が無いか、信用できない物になる。"}, {"t": 1362.5833333333333, "x": "そして見立てそのものには筋が通っていた、とされた。"}, {"t": 1365.95, "x": "見立てが土台で、その上に全部が乗ってるのね。"}, {"t": 1368.9333333333334, "x": "この形を覚えておいてほしい。"}, {"t": 1370.5666666666666, "x": "終わりの国会の話でまた出てくる。"}, {"t": 1373.5, "x": "刑事の裁判に話を戻す。"}, {"t": 1375.4666666666667, "x": "一審の判決は有罪だった。"}, {"t": 1377.4333333333334, "x": "二人は控訴した。控訴審は長く続いた。"}, {"t": 1380.25, "x": "その途中でMさんが亡くなった。"}, {"t": 1382.3666666666666, "x": "……判決を聞く前に？"}, {"t": 1383.8166666666666, "x": "控訴審の判決を待たずにだ。"}, {"t": 1385.8, "x": "Mさんについては、判決が出ないまま裁判が終わった。"}, {"t": 1389.2666666666667, "x": "じゃあMさんは有罪のまま？"}, {"t": 1391.0, "x": "違う。判決が確定する前だから、\n有罪は確定していない。"}, {"t": 1395.0333333333333, "x": "そして、控訴審はAさんを\n無罪とした。その無罪は確定した。"}, {"t": 1399.1666666666667, "x": "検察はそれ以上争わなかったの？"}, {"t": 1401.5333333333333, "x": "最高裁の判決文は、無罪の確定を\n前提に書かれている。"}, {"t": 1405.3666666666666, "x": "刑事の裁判としては、そこで終わった。"}, {"t": 1407.8333333333333, "x": "ここでこの回の一つ目の問いに答えが出る。"}, {"t": 1410.4333333333334, "x": "この二人がやったと言えるか。"}, {"t": 1412.0166666666667, "x": "言えない、が答えだ。"}, {"t": 1413.55, "x": "でも、それなら誰が？"}, {"t": 1415.1833333333334, "x": "その問いは刑事の裁判の仕事ではない。"}, {"t": 1417.5666666666666, "x": "裁判は、起訴された人について判断する場所だ。"}, {"t": 1420.7333333333333, "x": "起訴されていない誰かを、\n裁判所が探しにいくことはない。"}, {"t": 1424.3, "x": "探すのは警察よね？"}, {"t": 1425.9333333333334, "x": "本来はそうだ。"}, {"t": 1426.9833333333333, "x": "だが今回読んだ記録に、そのあと\n別の誰かを探した話は出てこない。"}, {"t": 1431.5, "x": "探したけど残ってないのか、\n探してないのか、それも分からないのね。"}, {"t": 1435.8666666666666, "x": "分からない。記録の上では\n空いている、ということだけだ。"}, {"t": 1439.05, "x": "控訴審の無罪の理由も、一次資料で\n確かめられなかった。だから話さない。"}, {"t": 1443.75, "x": "次は無罪のあと、国会で\nこの事件がどう呼ばれたかを見る。"}, {"t": 1447.8666666666666, "x": "無罪の確定のあと、芦別事件の名前は\n国会で何度も出てくる。"}, {"t": 1452.0166666666667, "x": "1968年4月16日の衆議院法務委員会。ある議員が\nこう言った。"}, {"t": 1457.1166666666666, "x": "戦後の列車転覆事件といわれた\n大きなものが四つある。"}, {"t": 1460.4833333333333, "x": "三鷹、松川、青梅、芦別だ。"}, {"t": 1463.1833333333334, "x": "芦別も転覆事件に数えられてたの？"}, {"t": 1465.8, "x": "議員はそういう数え方をした。"}, {"t": 1467.65, "x": "芦別は線路の爆破で、今回の記録に\n列車が倒れた話は出てこない。"}, {"t": 1472.1, "x": "議員は続けて、松川、青梅、\n芦別、全部無罪になったと言った。"}, {"t": 1476.6833333333334, "x": "法務省としてどういう責任を\n感じているのか、と尋ねた。"}, {"t": 1480.3666666666666, "x": "法務大臣はなんて答えたの？"}, {"t": 1482.3666666666666, "x": "赤間文三 法務大臣の答えはこうだ。"}, {"t": 1484.9666666666667, "x": "関係被告人の有罪を信じて、事案の真相を\n解明するに全力を尽くしてきた。"}, {"t": 1490.1333333333334, "x": "裁判所の最終の判断が確定するに至った\n以上、何人もこれを尊重すべきである。"}, {"t": 1495.3833333333334, "x": "捜査及び公判活動の全般を省みて、進んで\nこの判決から学ぶべきものを学び取りたい。"}, {"t": 1501.2833333333333, "x": "有罪を信じて全力を尽くした……。"}, {"t": 1503.5333333333333, "x": "信じていた、と大臣は言っている。"}, {"t": 1505.65, "x": "この「信じた」は、\n10年後の最高裁でも別の形で出てくる。"}, {"t": 1510.05, "x": "検察が信じたのは無理もない、っていうあれ？"}, {"t": 1512.7333333333333, "x": "そうだ。大臣の言葉と\n最高裁の物差しは同じ所を見ている。"}, {"t": 1516.7666666666667, "x": "1970年にも同じ議員が、\n四大列車転覆事件と呼んでいる。"}, {"t": 1521.3666666666666, "x": "そして全部無罪になっていると言った。"}, {"t": 1523.7166666666667, "x": "名前だけはずっと国会に残り続けたのね。"}, {"t": 1526.5833333333333, "x": "残ったのは無罪の事件としての名前だ。"}, {"t": 1529.0666666666666, "x": "では無罪になった人に国は\n何をしたのか。次はお金の話だ。"}, {"t": 1533.7833333333333, "x": "無罪になった人のために\n刑事補償という仕組みがある。"}, {"t": 1536.9, "x": "閉じ込められていた日数に\n応じて、国が決まった額を払う。"}, {"t": 1540.5333333333333, "x": "1968年4月25日の衆議院法務委員会で、ある議員が\nこう聞いた。"}, {"t": 1545.7666666666667, "x": "三鷹、松川、青梅、芦別。"}, {"t": 1548.0666666666666, "x": "刑事補償はもう全部払われたのか。"}, {"t": 1550.3333333333333, "x": "法務省の担当者はこう答えた。"}, {"t": 1552.4, "x": "青梅事件はまだだと思うが、ほかは\n請求があった物はすべて決定済みだ。"}, {"t": 1556.9333333333334, "x": "じゃあ芦別は補償は済んでたのね。"}, {"t": 1559.0833333333333, "x": "請求があった分は、という答えだ。"}, {"t": 1561.2666666666667, "x": "ただ刑事補償には上限がある。"}, {"t": 1563.2, "x": "1973年5月8日の参議院法務委員会で、\n法務大臣が説明している。"}, {"t": 1568.6333333333334, "x": "そのとき出ていた改正案で、\n1日あたり2,200円が限度だった。"}, {"t": 1573.0166666666667, "x": "1日2,200円……。"}, {"t": 1574.6166666666666, "x": "刑事補償は、捜査した側の落ち度を問わない。"}, {"t": 1577.3833333333334, "x": "無罪になった事実だけで払う。\nその代わり額が決まっている。"}, {"t": 1581.0, "x": "足りない分を取り戻したければ、もう一つ道がある。"}, {"t": 1584.1333333333334, "x": "国家賠償だ。"}, {"t": 1585.2166666666667, "x": "こちらは、捜査した側に故意か\n過失があったと証明しなければならない。"}, {"t": 1589.55, "x": "証明できれば上限はないの？"}, {"t": 1591.4666666666667, "x": "大臣は、証明される限り金額に\n何らの制限はないと答えている。"}, {"t": 1595.8166666666666, "x": "上限のある道と、証明の要る道。二つあるのね。"}, {"t": 1599.2833333333333, "x": "MさんとAさんの側は、証明の要る道を選んだ。"}, {"t": 1602.3166666666666, "x": "その裁判で何が起きていたかは、\n同じ日の記録が教えてくれる。"}, {"t": 1606.8666666666666, "x": "同じ1973年5月8日。"}, {"t": 1609.35, "x": "法務省の刑事局長が、一つの数字を出した。"}, {"t": 1612.55, "x": "国が故意過失ありとされて負けた事件が、4件ある。"}, {"t": 1615.9, "x": "その中には松川事件とか\n芦別事件とかいうような事件も入っている。"}, {"t": 1620.35, "x": "芦別って、国に勝ってたの？"}, {"t": 1622.4666666666667, "x": "この時点では、そうだ。"}, {"t": 1623.8666666666666, "x": "国家賠償の一審で国が負けていた。"}, {"t": 1626.3166666666666, "x": "訴えたのはAさんと、亡くなった\nMさんの家族たちだった。"}, {"t": 1629.9, "x": "相手は国と、当時の捜査に関わった人たちだ。"}, {"t": 1633.1666666666667, "x": "一審では、捜査に\n落ち度があったって認められたのね。"}, {"t": 1636.4666666666667, "x": "刑事局長の言い方を借りればそうなる。"}, {"t": 1638.8, "x": "ところが、その3か月後だ。"}, {"t": 1640.8, "x": "1973年8月10日、札幌高裁は\n訴えを退けた。国の側が勝った。"}, {"t": 1646.6833333333334, "x": "3か月でひっくり返ったの？"}, {"t": 1648.6666666666667, "x": "国会で4件の一つに数えられたのが5月。"}, {"t": 1651.4333333333334, "x": "高裁の逆転が8月だ。"}, {"t": 1653.35, "x": "高裁の判決は少なくとも310ページある。"}, {"t": 1656.55, "x": "310ページ？"}, {"t": 1657.8666666666666, "x": "最高裁が高裁の判決の310ページを\n指して、読み違いを直しているからだ。"}, {"t": 1662.95, "x": "ある供述の日付を11月22日としたのは\n7月22日の読み誤りだ、と。"}, {"t": 1668.4333333333334, "x": "ページ番号まで挙げて直してるのね。"}, {"t": 1670.7166666666667, "x": "直してはいるが、結論には影響しないと書いている。"}, {"t": 1673.8, "x": "別の所でも、高裁の書いた\n逮捕の有無が記録と違うと指摘した。"}, {"t": 1678.2333333333333, "x": "小さな間違いは直すけど答えは変えない、ってこと？"}, {"t": 1681.4166666666667, "x": "そうだ。一審の判決日と賠償の額は、\n一次資料で確かめられなかった。"}, {"t": 1686.15, "x": "確かなのは、5月に国は負けていて、\n8月に勝ったということだ。"}, {"t": 1691.0, "x": "訴えた側は最高裁に上告した。"}, {"t": 1693.3833333333334, "x": "判決文には、上告した\n側の代理人の弁護士が書かれている。"}, {"t": 1697.3666666666666, "x": "一人の名前のあとに「外176名」。"}, {"t": 1700.3666666666666, "x": "外176名……全部で177人？"}, {"t": 1703.6, "x": "177人だ。上告の理由は第1から第13まで並んでいる。"}, {"t": 1708.0166666666667, "x": "発破器、雷管、逮捕、自白、供述、帳簿、手帳。"}, {"t": 1712.0, "x": "ここまで見てきた物は全部この13の項目の中身だ。"}, {"t": 1715.5666666666666, "x": "そんなに大勢で、そんなに細かく争ってたのね。"}, {"t": 1718.8, "x": "最高裁は、一つずつ答えている。\nそして答えの形はほとんど同じだ。"}, {"t": 1723.4, "x": "原審の認定判断は、正当として是認することができる。"}, {"t": 1727.15, "x": "その過程に所論の違法はない。"}, {"t": 1729.1166666666666, "x": "げんしん？"}, {"t": 1729.8833333333334, "x": "一つ前の裁判、ここでは札幌高裁の判決のことだ。"}, {"t": 1733.5833333333333, "x": "多くの項目の最後には、もう一つ決まった一文が付く。"}, {"t": 1737.1333333333334, "x": "原審の専権に属する証拠の取捨判断、\n事実の認定を非難するものにすぎない。"}, {"t": 1742.4333333333334, "x": "せんけん？"}, {"t": 1743.2166666666667, "x": "証拠の選び方と事実の認め方は\n高裁までの仕事、という意味だ。"}, {"t": 1747.45, "x": "最高裁は事実を一から決め直す所ではない。"}, {"t": 1750.45, "x": "法律の当てはめに誤りが無いかを見る所だ。"}, {"t": 1753.3666666666666, "x": "だから13の項目に同じ返事が並ぶのね。"}, {"t": 1756.4, "x": "177人が積み上げた理由に、\n同じ形の返事が返された。"}, {"t": 1760.7, "x": "判決は4人の裁判官の全員一致だった。"}, {"t": 1763.6833333333334, "x": "反対した裁判官は一人もいなかったの？"}, {"t": 1766.45, "x": "いなかった。判決文は\n裁判官全員一致の意見で、と結んでいる。"}, {"t": 1770.7666666666667, "x": "ではその判決の中心に何が書かれていたのか。"}, {"t": 1774.4166666666667, "x": "1978年10月20日。"}, {"t": 1776.8333333333333, "x": "最高裁判所の第二小法廷。"}, {"t": 1779.0, "x": "線路の爆破から26年がたっていた。"}, {"t": 1781.5666666666666, "x": "判決の中心は理由の書き出しの数行にある。"}, {"t": 1784.45, "x": "刑事事件において無罪の判決が\n確定したというだけで、"}, {"t": 1787.8833333333334, "x": "直ちに起訴前の逮捕・勾留、公訴の提起・追行、"}, {"t": 1791.4666666666667, "x": "起訴後の勾留が違法となるということはない。"}, {"t": 1794.0833333333333, "x": "無罪でも逮捕は違法じゃないってこと？"}, {"t": 1796.3666666666666, "x": "無罪だから、というだけでは\n違法にならないということだ。"}, {"t": 1799.5166666666667, "x": "理由も書いてある。"}, {"t": 1800.6333333333334, "x": "逮捕や勾留は、その時点で疑う\n相当な理由と必要があれば適法だ。"}, {"t": 1805.1, "x": "起訴するときの検察官の心証は、\n判決のときの裁判官の心証とは違う。"}, {"t": 1810.1333333333334, "x": "その時点の各種の証拠資料を、総合勘案する。"}, {"t": 1813.35, "x": "それで有罪と認められる嫌疑があれば足りる。"}, {"t": 1816.0833333333333, "x": "裁判官は「確かにやった」まで要るけど、\n検察は「やったと疑える」でいい？"}, {"t": 1821.2333333333333, "x": "大まかに言えばそうだ。だから、\n二つの問いは別物になる。"}, {"t": 1824.8, "x": "刑事の裁判は、確かにやったと\n言えるかを問い、言えないと答えた。"}, {"t": 1828.7166666666667, "x": "国家賠償の裁判は、疑ったことに\n筋が通るかを問い、通ると答えた。"}, {"t": 1833.4166666666667, "x": "どっちも正しいことになっちゃうの？"}, {"t": 1835.5166666666667, "x": "問いが違うから、両方の答えが同時に\n成り立つ。それがこの判決の形だ。"}, {"t": 1840.3666666666666, "x": "念のためもう一度言っておく。"}, {"t": 1842.1333333333334, "x": "筋が通っていたというのは、Aさんが\n犯人だという意味ではない。"}, {"t": 1845.75, "x": "Aさんの無罪は確定していて、\nこの判決もそれを前提にしている。"}, {"t": 1849.9333333333334, "x": "疑ったことは、責めない。でも疑いが\n当たっていたとも言ってないのね。"}, {"t": 1854.2, "x": "その通りだ。この判決はこのあと、\nほかの裁判で何度も引かれていく。"}, {"t": 1858.5833333333333, "x": "無罪の人が国家賠償を求めるときの、\n最初の物差しになったからだ。"}, {"t": 1863.6666666666667, "x": "判決文の中で、一か所だけ「誤り」と\nはっきり書かれた所がある。"}, {"t": 1868.2166666666667, "x": "刑事の一審の終わりに検察が述べた論告だ。"}, {"t": 1871.2333333333333, "x": "ろんこく？"}, {"t": 1872.0833333333333, "x": "裁判の最後に検察が証拠を\nまとめ、求める刑を述べる場面だ。"}, {"t": 1876.1666666666667, "x": "その論告に、ある発破器について\nこういう一文があった。"}, {"t": 1879.5666666666666, "x": "処分先から発見されて明瞭となり、\n本件との関連は全然認められなかった。"}, {"t": 1884.75, "x": "それの何が誤りなの？"}, {"t": 1886.4166666666667, "x": "捜査の段階で捜査官が推定していた\n事実と反対のことを述べていた。"}, {"t": 1890.8, "x": "発破器の件で\n起訴したときの検察の推定とも合わなかった。"}, {"t": 1894.55, "x": "国の側も裁判の中の書面で、\n論告の誤りを認めていた。"}, {"t": 1898.6833333333334, "x": "認めたなら、そこは国の負けじゃないの？"}, {"t": 1901.2833333333333, "x": "国は誤りは認めたが悪意は無かったと争った。"}, {"t": 1904.3, "x": "最高裁は、わざと嘘の論告をしたとは見られないとした\n高裁を是認した。"}, {"t": 1908.85, "x": "そのうえでこう書いている。"}, {"t": 1910.2333333333333, "x": "たとえ論告の誤りに過失があったとしても、"}, {"t": 1913.0166666666667, "x": "それで損害を受けたという\n主張は、高裁でされていない。"}, {"t": 1916.2666666666667, "x": "だから結論には影響しない。"}, {"t": 1918.25, "x": "誤りはあった。でもそれで損をしたとは\n言われていない、ってこと？"}, {"t": 1922.0166666666667, "x": "そういう組み立てだ。"}, {"t": 1923.2333333333333, "x": "誤りという言葉は出てきたのに、\n責任の話にはつながらなかった。"}, {"t": 1927.5833333333333, "x": "誤りって書かれたのは、たった一か所なのね。"}, {"t": 1930.4666666666667, "x": "この判決文で「誤り」の字が国の側に\n向いたのは、この論告の所だけだ。"}, {"t": 1935.6, "x": "残りの争点はどれも、筋が\n通っていた、の形で閉じられている。"}, {"t": 1940.35, "x": "訴えた側は国だけでなく、捜査や\n起訴に関わった個人も訴えていた。"}, {"t": 1944.8, "x": "わざとや重い過失なら本人も\n責任を負うべきだ、という考えだ。"}, {"t": 1948.8166666666666, "x": "最高裁はこう答えた。"}, {"t": 1950.3666666666666, "x": "公務員が職務で違法に損害を\n与えたときは、国が賠償する。"}, {"t": 1954.25, "x": "公務員個人はその責任を負わない。"}, {"t": 1956.55, "x": "じゃあ個人は何をしても訴えられないの？"}, {"t": 1959.0166666666667, "x": "被害を受けた人が個人に\n直接払わせることはできない、という意味だ。"}, {"t": 1963.25, "x": "払うのは国だ、という仕組みになっている。"}, {"t": 1965.7333333333333, "x": "これは芦別で初めて言われたことではない。"}, {"t": 1968.2166666666667, "x": "最高裁は1955年の判決などを\n引いて、前からの判例だとしている。"}, {"t": 1973.1833333333334, "x": "判決の要旨の二つ目がこの話になる。"}, {"t": 1975.9833333333333, "x": "一つ目が「無罪というだけでは違法にならない」。"}, {"t": 1978.8166666666666, "x": "二つ目が「公務員個人は責任を負わない」。"}, {"t": 1981.6833333333334, "x": "そうだ。この二つが、芦別事件の名前と\n一緒に引かれていく。"}, {"t": 1985.8, "x": "でも事件の中身とは少し離れた話よね？"}, {"t": 1988.8, "x": "離れている。線路の爆破からも\n発破器の番号からも遠い。"}, {"t": 1992.4166666666667, "x": "法律の世界で芦別の名前が残ったのは、\n主にこの二つの物差しとしてだ。"}, {"t": 1997.4, "x": "爆破事件としてじゃなく、物差しとして残ったのね。"}, {"t": 2000.8666666666666, "x": "そういう残り方をした事件だ。"}, {"t": 2002.8166666666666, "x": "その物差しについて、10年後の国会である\n弁護士が意見を述べている。"}, {"t": 2007.6833333333334, "x": "最高裁の判決から10年後の1988年3月29日。"}, {"t": 2012.2666666666667, "x": "衆議院の法務委員会。"}, {"t": 2013.8166666666666, "x": "刑事補償の額を改める改正案の審議に、\n参考人の弁護士が呼ばれた。"}, {"t": 2018.45, "x": "その弁護士は芦別の判決を名指しした。"}, {"t": 2021.0833333333333, "x": "国家賠償で無罪の人が救われにくくなった、\nそのリーディングケースだと。"}, {"t": 2025.5666666666666, "x": "リーディングケースって？"}, {"t": 2026.9666666666667, "x": "あとの裁判がお手本として従う先頭の判決のことだ。"}, {"t": 2030.55, "x": "弁護士は、判決のある一語に引っかかっていた。"}, {"t": 2033.5333333333333, "x": "「各種の証拠資料」という言葉だ。"}, {"t": 2035.7833333333333, "x": "総合的に判断するなら、\nすべての証拠資料が要るはずだと。"}, {"t": 2039.6833333333334, "x": "各種と、すべて。言葉としてはずいぶん違うわね。"}, {"t": 2043.0333333333333, "x": "起訴したときに検察の手元にあった\n証拠を、全部並べて見たのか。"}, {"t": 2047.2, "x": "国家賠償の裁判所は検察に全部出せとさえ\n言わない、と弁護士は述べた。"}, {"t": 2051.733333333333, "x": "無罪になった人の多くが、今は国家賠償を\n求めようとしないとまで言った。"}, {"t": 2056.3166666666666, "x": "それはその弁護士の意見なのよね？"}, {"t": 2058.5333333333333, "x": "そうだ。国会で述べられた一人の意見で、\nどちらが正しいかは言わない。"}, {"t": 2062.7166666666667, "x": "ただ思い当たる物はこの回の中にいくつもある。"}, {"t": 2065.516666666667, "x": "発破器の15359番は、\n一審の途中まで法廷に出なかった。"}, {"t": 2070.4, "x": "工数簿と操業証もすぐには出なかった。"}, {"t": 2072.883333333333, "x": "5人分の手帳は値打ちが無いとして出されなかった。"}, {"t": 2076.016666666667, "x": "さっきの「隠された物の一覧」ね。"}, {"t": 2078.633333333333, "x": "判決は、どれも見立てに照らして筋が通るとした。"}, {"t": 2081.8333333333335, "x": "弁護士は、見立ての外の物まで\n並べて見るべきだと言った。"}, {"t": 2085.4333333333334, "x": "二つの言い分の間に「各種」と\n「すべて」の差がある。"}, {"t": 2089.7833333333333, "x": "ねえ、最初の発破器の話に戻っていい？"}, {"t": 2092.55, "x": "8750番だな。"}, {"t": 2094.516666666667, "x": "あれって結局、どこから来たのか分かったの？"}, {"t": 2097.4, "x": "分かっていない。判決文の言葉では、\n経路が分からない、だ。"}, {"t": 2101.2166666666667, "x": "持ち主はF鉱業所。形は下請けのDの坑道を指した。"}, {"t": 2104.9333333333334, "x": "番号は1951年の盗難を指す、と訴えた側は言った。"}, {"t": 2109.15, "x": "それを線路のそばまで運んだのが誰か。"}, {"t": 2111.4, "x": "どの判決も書いていない。"}, {"t": 2113.2, "x": "26年裁判をして、そこだけ空いたままなのね。"}, {"t": 2116.516666666667, "x": "刑事の裁判は、二人がやったとは言えないと答えた。"}, {"t": 2119.7, "x": "国家賠償の裁判は、疑ったことには筋が通ると答えた。"}, {"t": 2123.5666666666666, "x": "三つ目の問い、誰が線路を爆破したのか。\nこれには誰も答えていない。"}, {"t": 2127.9166666666665, "x": "Mさんは、自分の裁判の終わりを聞けなかったのよね。"}, {"t": 2131.266666666667, "x": "控訴審の判決の前に亡くなった。"}, {"t": 2133.4333333333334, "x": "Aさんの無罪は確定した。"}, {"t": 2135.25, "x": "国家賠償の裁判は1978年に終わった。"}, {"t": 2138.733333333333, "x": "国会の記録で、「芦別事件」という\n言葉が出てくる発言は8件だ。"}, {"t": 2143.233333333333, "x": "1964年から1982年まで。"}, {"t": 2146.45, "x": "無罪や補償や証拠の話が並ぶ。"}, {"t": 2148.9, "x": "真犯人を探そう、っていう話は？"}, {"t": 2151.3, "x": "その8件の中には一つも無い。"}, {"t": 2153.5666666666666, "x": "線路の爆破そのものは、置き去りになってるのね。"}, {"t": 2156.6666666666665, "x": "1952年7月29日の夕方から翌朝までのどこか。"}, {"t": 2160.9, "x": "平岸と芦別の間の線路。"}, {"t": 2163.016666666667, "x": "そこに8750番の発破器を残していった\n人は、今も分かっていない。"}, {"t": 2167.983333333333, "x": "物は番号まで残ってるのに、\n人だけが分からないのね。"}, {"t": 2171.516666666667, "x": "今回は、その発破器から始めて\n判決文の物と紙を一つずつ読んだ。"}, {"t": 2176.1833333333334, "x": "はっきりしているのは一つだけだ。"}, {"t": 2178.05, "x": "疑われた二人のうち、有罪が確定した人はいない。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
