<script>
const D={"name": "159", "file": "159_編集用", "dur": 2073.9833125, "segs": [], "subs": [{"t": 0.0, "x": "1995年3月20日の月曜日、朝のことだ。"}, {"t": 3.85, "x": "東京の地下鉄は、通勤の人でいっぱいだった。"}, {"t": 6.883333333333334, "x": "午前8時ごろ、3つの路線の電車で袋が破られた。"}, {"t": 10.433333333333334, "x": "袋は全部で5つあった。"}, {"t": 12.15, "x": "中に入っていたのは、サリンという毒物だ。"}, {"t": 15.033333333333333, "x": "電車の中で毒がまかれたの？"}, {"t": 17.083333333333332, "x": "そうだ。"}, {"t": 18.2, "x": "乗客や駅の職員が次々に倒れた。"}, {"t": 20.816666666666666, "x": "その日の正午すぎ、国会で\n警察庁の課長が答えている。"}, {"t": 24.483333333333334, "x": "「死亡者6名、負傷者864名」。"}, {"t": 27.5, "x": "その日のうちに数字が出ていたのね。"}, {"t": 29.733333333333334, "x": "ところが、この数字はそのあと何度も変わる。"}, {"t": 32.43333333333333, "x": "2日後には8人、4日後には10人になった。"}, {"t": 35.43333333333333, "x": "25年たった2020年にも、1人が亡くなっている。"}, {"t": 39.13333333333333, "x": "25年も数字が動き続けたの？"}, {"t": 41.516666666666666, "x": "今回は国の記録だけで、その数字を日付の順に追う。"}, {"t": 64.3, "x": "どんな資料を使うの？"}, {"t": 65.78333333333333, "x": "中心は国会の会議録だ。"}, {"t": 67.7, "x": "事件の当日から、委員会のたびに答弁が残っている。"}, {"t": 71.15, "x": "答えたのは警察庁や消防庁、防衛庁の担当者だ。"}, {"t": 74.7, "x": "もう1つは、公安調査庁の公表だ。"}, {"t": 77.23333333333333, "x": "それに法務省の犯罪白書も使う。"}, {"t": 79.71666666666667, "x": "役所がまとめた数字なのね。"}, {"t": 81.71666666666667, "x": "亡くなった人やけがをした人の名前は、言わない。"}, {"t": 84.71666666666667, "x": "教団の代表や実行した人たちの名前も、言わない。"}, {"t": 88.1, "x": "大臣や局長は役職で呼ぶ。"}, {"t": 90.13333333333334, "x": "議員はただ「議員」とだけ呼ぶことにする。"}, {"t": 92.85, "x": "議員が言っただけの話はどう扱うの？"}, {"t": 95.33333333333333, "x": "議員の話として紹介して、事実とは分けておく。"}, {"t": 99.26666666666667, "x": "まず、どの電車だったのかを見ておこう。"}, {"t": 101.56666666666666, "x": "営団地下鉄の日比谷線と千代田線と丸ノ内線だ。"}, {"t": 104.88333333333334, "x": "営団地下鉄は、いまの東京メトロのことだ。"}, {"t": 107.86666666666666, "x": "3つの路線に共通点はあるの？"}, {"t": 110.03333333333333, "x": "3つとも霞ケ関駅を通る。"}, {"t": 112.06666666666666, "x": "霞ケ関は、国の役所が集まっている所だ。"}, {"t": 115.21666666666667, "x": "公安調査庁の公表では、狙われたのは5つの車両だ。"}, {"t": 118.73333333333333, "x": "どれも霞ケ関駅を通過する電車だった。"}, {"t": 121.48333333333333, "x": "のちの起訴の中身でも、同じことが書かれている。"}, {"t": 124.6, "x": "役所の街に向かう電車ばかりだったのね。"}, {"t": 127.28333333333333, "x": "2004年の国会で、大臣が駅の利用者数を答えている。"}, {"t": 130.98333333333332, "x": "霞ケ関駅は、1日におよそ12万人だという。"}, {"t": 134.36666666666667, "x": "それほど多くの人が行き来する駅だ。"}, {"t": 137.28333333333333, "x": "サリンはどうやってまかれたの？"}, {"t": 139.1, "x": "6月の国会で、法務省の局長が\n起訴の中身を読み上げた。"}, {"t": 143.05, "x": "まず、床にサリンの入った袋を置く。"}, {"t": 145.46666666666667, "x": "それを先をとがらせた傘で突き刺した。"}, {"t": 147.9, "x": "袋はナイロンとポリエチレンでできていたという。"}, {"t": 150.48333333333332, "x": "漏れたサリンが気体になって、電車の中に広がった。"}, {"t": 153.88333333333333, "x": "傘なら朝の電車でも、目立たないわね。"}, {"t": 156.5, "x": "公安調査庁の公表では、実行したのは幹部ら5人だ。"}, {"t": 160.1, "x": "起訴の中身では、5か所とも午前8時ごろだ。"}, {"t": 163.16666666666666, "x": "ほとんど同じ時刻に起きたのね。"}, {"t": 165.28333333333333, "x": "だから、被害はいくつもの駅に一度に出た。"}, {"t": 168.65, "x": "最初に動いたのは警視庁だ。"}, {"t": 170.55, "x": "110番の通報で事件をつかんだ。"}, {"t": 172.8, "x": "機動隊を大勢現場に送り出した。"}, {"t": 174.96666666666667, "x": "レスキュー部隊も入っていたと、課長は答えている。"}, {"t": 178.06666666666666, "x": "警察庁はどうしたの？"}, {"t": 179.66666666666666, "x": "午前9時に、合同の対策室を作った。"}, {"t": 182.41666666666666, "x": "刑事局と警備局がいっしょに入る部屋だ。"}, {"t": 185.03333333333333, "x": "全国の警察には、駅の警戒を強めるよう指示した。"}, {"t": 188.53333333333333, "x": "防衛庁にも、早くから知らせが届いている。"}, {"t": 191.28333333333333, "x": "防衛庁の局長の答弁では、\n警察からの連絡は8時50分だ。"}, {"t": 195.63333333333333, "x": "化学防護の専門の職員4人が、警察庁へ向かった。"}, {"t": 199.38333333333333, "x": "自衛隊にも、早い時間から声がかかっていたのね。"}, {"t": 202.7, "x": "のちに国家公安委員長がその理由を述べている。"}, {"t": 205.51666666666668, "x": "専門の知識と装備を持つ\n自衛隊の協力が欠かせない、とな。"}, {"t": 210.05, "x": "3月24日、国家公安委員長が国会で報告した。"}, {"t": 213.88333333333333, "x": "事件を知ってすぐ、警察官を現場に急がせたという。"}, {"t": 217.2, "x": "その数はおよそ1万1000人だ。"}, {"t": 219.56666666666666, "x": "1万人を超えていたの？"}, {"t": 221.25, "x": "そうだ。"}, {"t": 222.36666666666667, "x": "機動隊やレスキュー部隊、交通整理の班も入った。"}, {"t": 225.56666666666666, "x": "最初の仕事は、けがをした人を助けることだった。"}, {"t": 228.78333333333333, "x": "そして、乗客を駅の外へ逃がすことだ。"}, {"t": 231.5, "x": "築地警察署には、特別捜査本部が置かれた。"}, {"t": 234.71666666666667, "x": "人数はおよそ300人だ。"}, {"t": 236.46666666666667, "x": "現場に残された物を集め、見た\n人の話を聞いていった。"}, {"t": 240.26666666666668, "x": "犯人の手がかりは、すぐに見つかったの？"}, {"t": 242.95, "x": "2日後の答弁でも、結びつく\n情報はまだ無いとしている。"}, {"t": 246.53333333333333, "x": "委員長は事件の性質をこう述べた。"}, {"t": 248.75, "x": "何の関係も無い善良な市民を、\n大量に無差別に傷つけた、と。"}, {"t": 253.58333333333334, "x": "ここで、事件当日の国会に戻ろう。"}, {"t": 256.1333333333333, "x": "その日の参議院では、\n科学技術の委員会が開かれていた。"}, {"t": 259.78333333333336, "x": "議員の1人が、急いで警察庁の担当者を呼んだ。"}, {"t": 263.23333333333335, "x": "予定には無かった質問だったのね。"}, {"t": 265.55, "x": "議員は、地下鉄で毒ガスの被害が\n出ているようだと述べた。"}, {"t": 269.01666666666665, "x": "国民も、とても不安に思っているとも述べている。"}, {"t": 272.0, "x": "答えたのは警察庁刑事局の課長だ。"}, {"t": 274.6, "x": "何者かが、液体入りの容器を置いていったという。"}, {"t": 277.56666666666666, "x": "容器は新聞紙に包まれていた。"}, {"t": 279.6, "x": "築地駅や霞ケ関駅などで、ガスが立ち込めた。"}, {"t": 282.93333333333334, "x": "分かっているだけで13の駅だと答えている。"}, {"t": 285.73333333333335, "x": "数字はどうだったの？"}, {"t": 287.15, "x": "12時30分のまとめで、死亡者6名だ。"}, {"t": 290.1333333333333, "x": "負傷者は864名、重い人は10名前後だと答えた。"}, {"t": 294.85, "x": "その時点でサリンだと分かっていたの？"}, {"t": 297.1333333333333, "x": "議員も同じことを聞いている。"}, {"t": 298.81666666666666, "x": "報道ではサリンと言われているが本当なのか、とな。"}, {"t": 301.8333333333333, "x": "課長の答えは、「サリンの疑いが強い」だった。"}, {"t": 304.8666666666667, "x": "一部の駅で取った残り物を、\n警視庁が調べている最中だ。"}, {"t": 308.76666666666665, "x": "まだ「疑い」の段階だったのね。"}, {"t": 311.23333333333335, "x": "2日後には、刑事局長がもう少しくわしく答えている。"}, {"t": 314.75, "x": "警視庁の科学捜査研究所が、鑑定をしていた。"}, {"t": 317.98333333333335, "x": "警察庁の科学警察研究所も別に調べていた。"}, {"t": 321.3666666666667, "x": "大学の専門家や防衛庁にも、\n助けを求めていたという。"}, {"t": 325.1333333333333, "x": "警察だけでは分からない毒物だったのね。"}, {"t": 327.85, "x": "局長自身も、\nこの種の物質には慣れていないと認めた。"}, {"t": 332.05, "x": "けがをした人たちは、どうやって病院へ運ばれたのか。"}, {"t": 335.3333333333333, "x": "4月の国会で、消防庁の長官が答えている。"}, {"t": 338.48333333333335, "x": "救急車は113台が出た。"}, {"t": 340.53333333333336, "x": "それに加えてマイクロバスも使った。"}, {"t": 342.8666666666667, "x": "マイクロバスで運んだの？"}, {"t": 344.5, "x": "比べると、症状の軽い人をまとめて送るためだ。"}, {"t": 347.68333333333334, "x": "合わせて145台の車で、688人を病院へ運んだ。"}, {"t": 352.15, "x": "長官は備えが要ると述べている。"}, {"t": 354.1, "x": "同じ時に大勢のけが人が出る場合の備えだ。"}, {"t": 356.93333333333334, "x": "誰を先に運ぶかを、その場で\n決める仕組みも要るという。"}, {"t": 360.35, "x": "その2か月前には、大きな地震もあったわね。"}, {"t": 363.3666666666667, "x": "長官は、阪神淡路大震災とこの事件を並べて答えた。"}, {"t": 367.21666666666664, "x": "1995年の春は、大きな災害と事件が続いていた。"}, {"t": 371.98333333333335, "x": "消防庁も、東京消防庁を通じて\n被害の数をまとめていた。"}, {"t": 375.85, "x": "4月の国会で、厚生省の課長が\nその数字を読み上げている。"}, {"t": 379.6333333333333, "x": "3月21日正午の時点で、死者は8名。"}, {"t": 382.85, "x": "最も重い重篤の人が17名だ。"}, {"t": 385.3666666666667, "x": "その次の重症が37名だった。"}, {"t": 387.81666666666666, "x": "中くらいの症状の人が984名いた。"}, {"t": 391.06666666666666, "x": "全部で何人だったの？"}, {"t": 392.7, "x": "合わせて5510名だ。"}, {"t": 394.48333333333335, "x": "前の日の昼に聞いた864名の、6倍を超えている。"}, {"t": 398.5, "x": "1日でそんなに増えたのね。"}, {"t": 400.4166666666667, "x": "なぜそれほど増えたのか、答弁には書かれていない。"}, {"t": 403.3333333333333, "x": "数えたのが警察ではなく\n消防だったことは、覚えておこう。"}, {"t": 407.48333333333335, "x": "医師たちは、サリンの治療を知っていたの？"}, {"t": 410.0, "x": "厚生省の課長は、ふつうは\n経験の無い中毒だったと答えた。"}, {"t": 413.9, "x": "ただ前の年の6月に、長野県の松本でも\nサリンの事件があった。"}, {"t": 418.21666666666664, "x": "そこで、治療をした経験がすでにあったんだ。"}, {"t": 421.06666666666666, "x": "その経験を東京で使ったのね。"}, {"t": 423.3333333333333, "x": "事件の当日、厚生省は\n信州大学の病院などに協力を頼んだ。"}, {"t": 427.78333333333336, "x": "サリン中毒の治療法を情報としてまとめた。"}, {"t": 430.56666666666666, "x": "それを東京都や東京消防庁を\n通じて、病院へ送ったという。"}, {"t": 434.35, "x": "松本の経験が、その日のうちに\n東京へ届いたことになる。"}, {"t": 438.23333333333335, "x": "前の年の事件がここでつながってくるのね。"}, {"t": 441.01666666666665, "x": "松本の事件は、072の回でくわしく扱っている。"}, {"t": 445.25, "x": "自衛隊の部隊は、何時に動いたのか。"}, {"t": 447.75, "x": "12時50分に、東京都の知事から\n災害派遣の要請が出た。"}, {"t": 451.78333333333336, "x": "17時には、千葉県の知事からも要請があった。"}, {"t": 454.93333333333334, "x": "千葉からも要請があったのね。"}, {"t": 456.8333333333333, "x": "千葉県の松戸には、地下鉄の車両基地があった。"}, {"t": 459.9166666666667, "x": "集まったのは、練馬と大宮と\n相馬原の化学防護の部隊だ。"}, {"t": 463.8666666666667, "x": "市ヶ谷の普通科連隊も加わった。"}, {"t": 466.05, "x": "隊員はおよそ200人だ。"}, {"t": 467.73333333333335, "x": "除染車はおよそ10両だった。"}, {"t": 469.6666666666667, "x": "除染って何をするの？"}, {"t": 471.21666666666664, "x": "毒物を薄めたり取り除いたりすることだ。"}, {"t": 473.8333333333333, "x": "人が安全に近づけるようにするための作業だな。"}, {"t": 477.45, "x": "自衛隊が作業した場所も答弁に並んでいる。"}, {"t": 480.1666666666667, "x": "霞ケ関、日比谷、築地、小伝馬町、後楽園の各駅だ。"}, {"t": 484.4166666666667, "x": "それに千葉県の松戸の車両基地が加わる。"}, {"t": 487.18333333333334, "x": "車両の置き場でも作業したのね。"}, {"t": 489.25, "x": "防衛庁の局長は、松戸は車両基地だと説明している。"}, {"t": 492.8666666666667, "x": "消防の化学機動中隊も手伝ったという。"}, {"t": 495.5, "x": "小伝馬町駅や霞ケ関駅で、自衛隊の作業を支えた。"}, {"t": 499.35, "x": "警察と消防と自衛隊が同じ駅に入っていたのね。"}, {"t": 502.71666666666664, "x": "国家公安委員長は、次の時の動き方にも触れている。"}, {"t": 506.25, "x": "同じことが起きたら、3者が\n連絡を密にすべきだと述べた。"}, {"t": 509.98333333333335, "x": "防護服を自衛隊から借りる話もついているという。"}, {"t": 513.5833333333334, "x": "自衛隊は医師も送り出している。"}, {"t": 515.45, "x": "防衛庁の局長の答弁では、医官など35名だ。"}, {"t": 518.8833333333333, "x": "警察病院などへ派遣したという。"}, {"t": 521.15, "x": "自衛隊にも医師がいるのね。"}, {"t": 522.9333333333333, "x": "局長は治療などのために送ったと答えている。"}, {"t": 525.75, "x": "防衛庁は、化学防護の知識を\n警察に伝える役も受け持った。"}, {"t": 529.8666666666667, "x": "いろいろな所から人が集められていたのね。"}, {"t": 532.6166666666667, "x": "防衛庁の課長は、全国の備えについても答えた。"}, {"t": 535.9666666666667, "x": "全国の各師団に\n化学防護の部隊が置かれているという。"}, {"t": 539.35, "x": "首都圏の外で起きても、すぐ動けるという説明だった。"}, {"t": 543.45, "x": "ここで、あの日に動いた役所を整理しておこう。"}, {"t": 546.2, "x": "1つ目は警察だ。"}, {"t": 547.6166666666667, "x": "乗客を助け出し、特別捜査本部を作って調べ始めた。"}, {"t": 551.5666666666667, "x": "2つ目は消防だ。"}, {"t": 552.8666666666667, "x": "救急車とマイクロバスで、688人を病院へ運んだ。"}, {"t": 557.0666666666667, "x": "3つ目は何なの？"}, {"t": 558.4333333333333, "x": "3つ目は厚生省だ。"}, {"t": 559.9166666666666, "x": "松本の経験をもとに、治療法を病院へ届けた。"}, {"t": 563.15, "x": "4つ目は防衛庁と自衛隊だ。"}, {"t": 565.1166666666667, "x": "駅や車両に残った毒物を調べ、取り除いた。"}, {"t": 568.3333333333334, "x": "4つの役所が、同じ日にばらばらに動いていたのね。"}, {"t": 571.7, "x": "それぞれの数字も、それぞれの役所が数えている。"}, {"t": 574.6833333333333, "x": "この回で数字がずれるのは、そのためでもある。"}, {"t": 578.0666666666667, "x": "3月22日、参議院の予算委員会で刑事局長が答えた。"}, {"t": 582.2333333333333, "x": "この日の午前7時30分までで、死亡者8名だ。"}, {"t": 585.7166666666667, "x": "負傷者は3600人あまりだという。"}, {"t": 588.2833333333333, "x": "前の日の消防の数字より少ないのね。"}, {"t": 590.8166666666667, "x": "警察と消防では、数えた役所が違う。"}, {"t": 593.5333333333333, "x": "何を数えたかの違いは、答弁には書かれていない。"}, {"t": 596.55, "x": "局長は、松本の事件とよく似た物質だとも答えた。"}, {"t": 600.2333333333333, "x": "松本では7人が亡くなったと説明している。"}, {"t": 603.1666666666666, "x": "被害を受けたのは270人あまりだという。"}, {"t": 606.0166666666667, "x": "2つの事件が同じ毒だったのね。"}, {"t": 608.4, "x": "その時点では、\n似ているというところまでしか言っていない。"}, {"t": 612.2166666666667, "x": "同じ答弁で局長は、もう1つの場所に触れた。"}, {"t": 615.3333333333334, "x": "山梨県の上九一色だ。"}, {"t": 617.1666666666666, "x": "ある施設の近くで、においがするという訴えがあった。"}, {"t": 620.3333333333334, "x": "そこで、近くの土を調べてみた。"}, {"t": 622.6333333333333, "x": "すると、サリンを作った\nあとの残り物とみられる物質が出た。"}, {"t": 626.4666666666667, "x": "施設ってどこの施設なの？"}, {"t": 628.3833333333333, "x": "オウム真理教という教団の施設だ。"}, {"t": 630.6, "x": "ただ、この日の答弁では誰が\n作ったかは分からないとした。"}, {"t": 634.1166666666667, "x": "東京や松本の事件との、\nつながりも調べると述べている。"}, {"t": 637.85, "x": "言える範囲だけで慎重に話していたのね。"}, {"t": 641.0, "x": "実は、その少し前に別の事件が起きていた。"}, {"t": 644.05, "x": "2月28日の午後4時20分ごろ、品川区の路上だ。"}, {"t": 647.9166666666666, "x": "公証役場の事務長が車で連れ去られた。"}, {"t": 650.5333333333333, "x": "連れ去ったのは何人かの男だったという。"}, {"t": 653.1166666666667, "x": "公証役場って何をする所なの？"}, {"t": 655.4333333333333, "x": "契約や遺言などの書類を正式なものにする役所だ。"}, {"t": 658.7666666666667, "x": "警視庁はこの事件を、\n教団の関係者の犯行とつかんだ。"}, {"t": 662.5, "x": "犯罪白書では、この事件を\n監禁して死なせた事件としている。"}, {"t": 666.4333333333333, "x": "教団に捜査が入るという報道も出始めていた。"}, {"t": 669.4833333333333, "x": "地下鉄の事件とどうつながるの？"}, {"t": 671.6166666666667, "x": "それはこのあと犯罪白書の説明で見ていこう。"}, {"t": 675.0666666666667, "x": "3月22日の早朝、警視庁は教団の関係先に入った。"}, {"t": 679.3166666666667, "x": "人数はおよそ2500人だ。"}, {"t": 681.3, "x": "東京と静岡県と山梨県の、25か所を一斉に調べた。"}, {"t": 685.35, "x": "名目は品川の事務長の事件の捜索だった。"}, {"t": 688.4666666666667, "x": "地下鉄の事件の捜索ではなかったの？"}, {"t": 691.0333333333333, "x": "刑事局長は、地下鉄と関連させた\n捜索ではないと答えた。"}, {"t": 695.0166666666667, "x": "それでも、警察官は防毒マスクと\n防護服を用意していた。"}, {"t": 698.8333333333334, "x": "なぜそこまで用意したの？"}, {"t": 700.4833333333333, "x": "施設の近くの土から、あの残り物が出ていたからだ。"}, {"t": 703.9666666666667, "x": "もしもの事態に備えざるを得なかったと、\n局長は説明した。"}, {"t": 707.7166666666667, "x": "3月24日の朝には、大阪府警も動いている。"}, {"t": 711.05, "x": "大学生が連れ去られた事件で、教団の4か所に入った。"}, {"t": 715.35, "x": "この捜索について、委員会で鋭い質問が出た。"}, {"t": 718.6, "x": "捜索の動きが教団側に\n漏れていたのではないか、という質問だ。"}, {"t": 722.7833333333333, "x": "準備に時間がかかると気づかれやすいものね。"}, {"t": 725.55, "x": "局長は、捜査の秘密を守るのは大原則だと答えた。"}, {"t": 729.25, "x": "そのうえで、準備に時間がかかったことを認めた。"}, {"t": 732.2833333333333, "x": "防毒マスクを借りていたからだ。"}, {"t": 734.2166666666667, "x": "付け外しの訓練までしていたという。"}, {"t": 736.4333333333333, "x": "相手に気づかれるおそれも考えたそうだ。"}, {"t": 738.8333333333334, "x": "それでも、備え無しでは\n捜索できなかったと述べている。"}, {"t": 742.3, "x": "危険と危険を比べて決めたのね。"}, {"t": 744.5666666666667, "x": "答弁にはその迷いがそのまま残っている。"}, {"t": 747.7, "x": "捜索で何が見つかったの？"}, {"t": 749.65, "x": "事務長は見つからなかった。"}, {"t": 751.35, "x": "かわりに、山梨県の施設で男女6人が助け出された。"}, {"t": 755.1166666666667, "x": "6人は施設に閉じ込められていたという。"}, {"t": 757.5666666666667, "x": "閉じ込めていたとみられる\n信者4人が、その場で逮捕された。"}, {"t": 761.2666666666667, "x": "ほかにも閉じ込められていた人がいたのね。"}, {"t": 763.8833333333333, "x": "施設からは、薬品のような物がたくさん押収された。"}, {"t": 767.3333333333334, "x": "何のために置いていたのかは、\nまだ分からないとされた。"}, {"t": 770.4, "x": "車の調べから、\n事務長の事件の犯人の1人も特定された。"}, {"t": 774.5166666666667, "x": "3月22日には、全国に手配が出されている。"}, {"t": 778.4833333333333, "x": "3月30日、衆議院の委員会で警察庁の課長が答えた。"}, {"t": 782.65, "x": "現場に残されていた物は、全部で5件だという。"}, {"t": 785.7, "x": "その5件を、いまも鑑定している最中だった。"}, {"t": 788.75, "x": "袋の数と同じ5件なのね。"}, {"t": 790.8666666666667, "x": "課長は、目撃した人からも\n広く話を聞いていると答えた。"}, {"t": 794.8166666666667, "x": "いつごろから電車に置かれていたのかを、\n詰めていたという。"}, {"t": 798.0, "x": "3月22日の捜索では、サリンを\n作るのに要る薬品が多く見つかった。"}, {"t": 802.7166666666667, "x": "そこで警察は、人の命を奪う\n準備の疑いで調べを広げた。"}, {"t": 806.7833333333333, "x": "3月26日、上九一色の施設をさらに捜索した。"}, {"t": 810.75, "x": "何が見つかったの？"}, {"t": 812.15, "x": "化学プラントと思われる設備だ。"}, {"t": 814.2, "x": "ただ課長は、松本の事件とすぐ\n結びつけることはできないと述べた。"}, {"t": 818.4166666666666, "x": "どちらも、国内ではとてもまれな\nサリンの疑いがあるという点は同じだ。"}, {"t": 822.6, "x": "それでも、この時点ではつながりを言い切らなかった。"}, {"t": 826.2, "x": "3月24日、衆議院の委員会で刑事局長が報告した。"}, {"t": 830.2833333333333, "x": "この日午前8時の時点で、死者10名だ。"}, {"t": 833.0333333333333, "x": "負傷者はおよそ3700名になっていた。"}, {"t": 835.9333333333333, "x": "また増えたのね。"}, {"t": 837.1, "x": "病院で治療を受けていた人が、亡くなっていったんだ。"}, {"t": 840.2666666666667, "x": "局長の言葉も少し変わっている。"}, {"t": 842.4666666666667, "x": "「サリンである疑いが極めて強い」と言った。"}, {"t": 845.2, "x": "「強い」から「極めて強い」になったのね。"}, {"t": 848.1, "x": "言葉1つにも捜査の進み具合が表れている。"}, {"t": 851.05, "x": "同じ日に国家公安委員長は、\nガスが出た駅の数を報告した。"}, {"t": 855.0333333333333, "x": "築地駅など16駅だという。"}, {"t": 857.0166666666667, "x": "当日の13駅から3つ増えている。"}, {"t": 859.3666666666667, "x": "局長は、これまでに例を見ない\n悪質な犯行だと述べた。"}, {"t": 863.5, "x": "4月3日、参議院で刑事局長が答えた死亡者は11名だ。"}, {"t": 867.6666666666666, "x": "4月19日には、厚生省の課長が答えている。"}, {"t": 870.8666666666667, "x": "重い症状で亡くなった人が\n出て、死者は12名になった。"}, {"t": 874.5666666666667, "x": "1か月で6人から12人になったのね。"}, {"t": 877.3333333333334, "x": "課長は入院している人の数も答えた。"}, {"t": 879.8666666666667, "x": "4月12日の時点で、9人がまだ入院していた。"}, {"t": 883.3333333333334, "x": "9人がまだ病院にいたのね。"}, {"t": 885.3333333333334, "x": "重い症状のまま、治療が続いていた人たちだ。"}, {"t": 888.35, "x": "5月の国会でも、警察の答弁は12名のままだった。"}, {"t": 892.0166666666667, "x": "数字だけを並べるとこうなる。"}, {"t": 893.8, "x": "6名、8名、10名、11名、12名だ。"}, {"t": 897.35, "x": "答弁のたびに増えていったのね。"}, {"t": 899.8666666666667, "x": "4月11日、参議院の決算委員会でも\n刑事局長が答えている。"}, {"t": 904.2833333333333, "x": "議員は、捜査の的をどこに絞っているのかを尋ねた。"}, {"t": 907.6333333333333, "x": "局長は答えたの？"}, {"t": 909.1, "x": "答えなかった。"}, {"t": 910.15, "x": "どの人物やどのグループに焦点を当てているか。"}, {"t": 912.9166666666666, "x": "それは捜査中なので、答えを控えると述べた。"}, {"t": 915.9333333333333, "x": "3月22日の捜索のあとでも、まだ言えなかったのね。"}, {"t": 919.7, "x": "かわりに、同じことを起こさせない\n対策を説明している。"}, {"t": 923.0666666666667, "x": "地下鉄などの乗り物や、人が\n大勢集まる場所に警察官を置いた。"}, {"t": 927.25, "x": "駅を管理する側にも、自分たちで警戒するよう頼んだ。"}, {"t": 930.8, "x": "不審な物を見つけた時の手順も、\n決めてもらったという。"}, {"t": 934.3833333333333, "x": "駅の人たちにも、見張りを頼んでいたのね。"}, {"t": 937.2833333333333, "x": "サリンを持つことを取り締まる\n法律も、この時に準備していた。"}, {"t": 941.6333333333333, "x": "捜査では駅の防犯カメラも使われた。"}, {"t": 944.0833333333334, "x": "4月3日の答弁では、録画テープを\n手に入れて調べていた。"}, {"t": 947.8166666666667, "x": "当時の駅にもカメラはあったのね。"}, {"t": 949.9666666666667, "x": "運輸省の局長は、\nかなりの鉄道会社が付けていると答えた。"}, {"t": 953.85, "x": "同じ日に国家公安委員長は、\n総理から指示を受けたと述べた。"}, {"t": 957.6166666666667, "x": "地下鉄に防犯カメラを付けてはどうか、という指示だ。"}, {"t": 960.8166666666667, "x": "委員長はすぐ運輸大臣に連絡したという。"}, {"t": 963.4166666666666, "x": "運輸省の局長は、営団が取り付けを始めたと答えた。"}, {"t": 967.1166666666667, "x": "どこから始めたの？"}, {"t": 968.5333333333333, "x": "霞ケ関駅からだ。"}, {"t": 970.0833333333334, "x": "見張るだけのカメラには、\n録画の装置を付けてもらう考えも示した。"}, {"t": 974.2333333333333, "x": "映すだけでなく、あとから見直せるようにするためだ。"}, {"t": 978.0, "x": "法律も変わったの？"}, {"t": 979.4333333333333, "x": "変わった。"}, {"t": 980.5666666666667, "x": "4月20日、国家公安委員長が国会で述べている。"}, {"t": 983.9, "x": "サリンを持つことや作ることを\n罰する法律が無かった、と。"}, {"t": 987.3833333333333, "x": "4月19日には、刑事局長が新しい\n法律との違いを説明した。"}, {"t": 991.8833333333333, "x": "犯人が分かれば、いまの法律でも\n命を奪った罪は問える。"}, {"t": 995.55, "x": "新しい法律ができれば持っているだけで逮捕できる。"}, {"t": 998.6833333333333, "x": "使われる前に止められるということね。"}, {"t": 1001.0166666666667, "x": "検問で見つければその場で\n取り押さえられるという説明だ。"}, {"t": 1004.3, "x": "犯罪白書によれば、法律ができたのは1995年4月だ。"}, {"t": 1008.7666666666667, "x": "サリン等による人身被害の防止に関する法律という。"}, {"t": 1012.0666666666667, "x": "事件から1か月ほどで成立して施行された。"}, {"t": 1015.1166666666667, "x": "ずいぶん早かったのね。"}, {"t": 1016.6666666666666, "x": "国家公安委員長も国会の理解で\n早く成立したと述べている。"}, {"t": 1021.15, "x": "同じ時期にもう1つの法律も急がれた。"}, {"t": 1023.7666666666667, "x": "化学兵器を禁止する国際的な条約に合わせた法律だ。"}, {"t": 1027.5, "x": "3月30日、通商産業大臣がこの法律を説明している。"}, {"t": 1031.7333333333333, "x": "もとの案では、施行は条約が効力を持つ日からだった。"}, {"t": 1035.3, "x": "それが変わったの？"}, {"t": 1036.6, "x": "参議院で、公布から3か月以内に\n施行する形に直された。"}, {"t": 1040.55, "x": "大臣はその理由として事件を挙げている。"}, {"t": 1043.0, "x": "サリンなどが使われて多くの命が奪われた事件だ。"}, {"t": 1046.1166666666666, "x": "条約を待たずにすぐ取り締まれるようにしたんだ。"}, {"t": 1048.9833333333333, "x": "事件のあと国会の動きも早くなったのね。"}, {"t": 1052.3333333333333, "x": "被害を受けた人への手当ても早くから問われた。"}, {"t": 1055.1333333333334, "x": "3月22日、刑事局長が1つの制度を挙げている。"}, {"t": 1058.7833333333333, "x": "犯罪被害者等給付金の制度だ。"}, {"t": 1061.2, "x": "どういう制度なの？"}, {"t": 1062.4666666666667, "x": "わざと人を傷つけた犯罪が対象だ。"}, {"t": 1064.9833333333333, "x": "亡くなった人の家族や重い\nけがをした人に国がお金を出す。"}, {"t": 1068.7333333333333, "x": "事故や不注意によるものは、対象にならない。"}, {"t": 1071.4333333333334, "x": "ほかの公的な救いが難しい時に、\nこの制度を使うと局長は述べた。"}, {"t": 1075.9166666666667, "x": "4月19日、警察庁の官房長が答えている。"}, {"t": 1079.2, "x": "地下鉄の事件は、この制度の対象になるという。"}, {"t": 1082.2333333333333, "x": "目撃した人の話から\n複数の犯人の犯行と認められるからだ。"}, {"t": 1086.7166666666667, "x": "松本の事件はどうだったの？"}, {"t": 1088.6833333333334, "x": "官房長は事故か犯罪かもまだ\nはっきりしないとしていた。"}, {"t": 1092.6833333333334, "x": "朝の通勤時間だったことも制度の話に関わってくる。"}, {"t": 1096.2166666666667, "x": "4月13日、労働省の課長が\n労災保険の扱いを説明した。"}, {"t": 1100.6166666666666, "x": "駅で毒物を片付けた職員は、仕事中のけがになる。"}, {"t": 1104.2, "x": "乗客を逃がそうとした職員も同じだ。"}, {"t": 1106.65, "x": "通勤の途中で被害を受けた\n人は、通勤災害にあたるとした。"}, {"t": 1110.7, "x": "パートの人や外国の人はどうなの？"}, {"t": 1113.1166666666666, "x": "雇われ方にかかわらず働く\n人なら同じ給付になるという。"}, {"t": 1116.7666666666667, "x": "役所に勤める人の災害補償の基金の理事長も答えた。"}, {"t": 1120.5, "x": "被害に遭った公務員は、大きく3つに分かれるという。"}, {"t": 1123.65, "x": "通勤の途中、出張の途中、\nそして救助や捜査の途中だ。"}, {"t": 1127.75, "x": "助けに入った警察官や\n消防の職員も被害を受けたのね。"}, {"t": 1131.65, "x": "理事長はそれが一番気の毒だと述べている。"}, {"t": 1134.9166666666667, "x": "4月20日、衆議院の予算委員会で議員が尋ねた。"}, {"t": 1138.3333333333333, "x": "1994年11月、上九一色でサリンと分かっていた。"}, {"t": 1142.5166666666667, "x": "その時に施設を徹底的に調べていればどうだったか。"}, {"t": 1145.8333333333333, "x": "地下鉄の事件は防げたのではないか、という質問だ。"}, {"t": 1149.2, "x": "なぜこれほど長く放っておいたのか、とも尋ねている。"}, {"t": 1152.5, "x": "はっきりした問いね。"}, {"t": 1153.8833333333334, "x": "答弁に立ったのは、国家公安委員長だった。"}, {"t": 1156.7333333333333, "x": "その批判を厳粛に受け止めると答えた。"}, {"t": 1159.3166666666666, "x": "そのうえで、当時は法律が無かったと述べた。"}, {"t": 1162.0666666666666, "x": "法律が無い中で宗教法人の施設を\n捜査するのは無理だったという。"}, {"t": 1166.2333333333333, "x": "だから、品川の事件を足がかりにしたのね。"}, {"t": 1169.2666666666667, "x": "委員長は品川の事件を\n捜査の中心にできたと述べている。"}, {"t": 1172.8333333333333, "x": "それで山梨の拠点へ捜査に向かうことができたという。"}, {"t": 1176.0, "x": "委員長は最後に情けない思いだとも述べた。"}, {"t": 1178.6833333333334, "x": "多くの犠牲を出すに至ったことへの言葉だ。"}, {"t": 1181.9, "x": "事件から2か月近くたった5月16日。"}, {"t": 1184.8333333333333, "x": "犯罪白書によれば、この日に\n教団の代表が逮捕された。"}, {"t": 1188.65, "x": "やっと代表まで捜査が届いたのね。"}, {"t": 1191.0, "x": "翌日の国会で刑事局長が逮捕した罪名を答えている。"}, {"t": 1194.7166666666667, "x": "上九一色の施設でサリンを作った。"}, {"t": 1197.05, "x": "それを3月20日に地下鉄でまいた。"}, {"t": 1199.45, "x": "そして12名を死なせ、多くの人を\n傷つけたという容疑だ。"}, {"t": 1203.2, "x": "上九一色の施設で作られていたのね。"}, {"t": 1205.8, "x": "3月22日の答弁で触れた土の残り物とここでつながる。"}, {"t": 1209.7833333333333, "x": "同じ答弁で局長は、横浜の弁護士の事件にも触れた。"}, {"t": 1213.5333333333333, "x": "その時点では、まだ解決していないとしている。"}, {"t": 1216.4166666666667, "x": "この事件は、066の回でくわしく扱っている。"}, {"t": 1220.3166666666666, "x": "6月6日、東京地検は最初の起訴をした。"}, {"t": 1223.35, "x": "翌日の国会で法務省の刑事局長が\nその中身を説明した。"}, {"t": 1227.4, "x": "地下鉄の事件の相談と実行に関わったのは7人だ。"}, {"t": 1230.9666666666667, "x": "この7人は、殺人などの罪で起訴された。"}, {"t": 1233.9166666666667, "x": "サリンを作ることに関わった9人も起訴された。"}, {"t": 1236.8666666666666, "x": "9人のほうは、殺人予備という罪だ。"}, {"t": 1239.5333333333333, "x": "殺人予備って何なの？"}, {"t": 1241.2166666666667, "x": "人の命を奪う準備をしたことを罰するものだ。"}, {"t": 1244.0833333333333, "x": "9人は、地下鉄でまく相談には\n加わっていないとされた。"}, {"t": 1247.65, "x": "それでも、大勢の命を奪う\n目的でサリンを作ったとされた。"}, {"t": 1251.55, "x": "作った人たちも裁判にかけられたのね。"}, {"t": 1254.2666666666667, "x": "受け付けた教団の関係者は、\n延べ300人を超えていた。"}, {"t": 1257.8333333333333, "x": "そのうち延べおよそ90人が裁判にかけられていた。"}, {"t": 1261.6, "x": "起訴の中には、被害の数も書かれていた。"}, {"t": 1264.35, "x": "サリン中毒で亡くなったのは11名とされた。"}, {"t": 1267.15, "x": "けがをしたのは1168名だ。"}, {"t": 1269.6333333333334, "x": "国会の答弁では、12名だったわよね？"}, {"t": 1272.4166666666667, "x": "そこが大事なところだ。"}, {"t": 1273.9166666666667, "x": "起訴に書く数は、国会で答えた\n数とは別に数えられている。"}, {"t": 1277.7333333333333, "x": "答弁で聞いた数字より少ない数が書かれていた。"}, {"t": 1280.6333333333334, "x": "局長はさらに処分が出る予定だとも述べている。"}, {"t": 1283.4666666666667, "x": "まだ多くの容疑者を調べている最中だったからだ。"}, {"t": 1286.5166666666667, "x": "起訴の数字も途中の数字だったのね。"}, {"t": 1288.9833333333333, "x": "同じ事件でも、何のために数えるかで数字が変わる。"}, {"t": 1292.9, "x": "起訴の中身でもう1つ大きな数字が読み上げられた。"}, {"t": 1295.9833333333333, "x": "教団の施設では、その前にもサリンが作られていた。"}, {"t": 1299.3166666666666, "x": "時期は1993年12月下旬から1994年2月中旬だ。"}, {"t": 1304.5666666666666, "x": "その量はおよそ20キログラムだという。"}, {"t": 1306.9833333333333, "x": "20キログラムも作っていたの？"}, {"t": 1309.0833333333333, "x": "それとは別に、化学プラントも\n設計して完成させていた。"}, {"t": 1312.7666666666667, "x": "サリンを作るためのプラントだ。"}, {"t": 1314.6, "x": "原料をそこに入れて動かそうとしていたとされている。"}, {"t": 1317.6333333333334, "x": "プラントって工場のことよね？"}, {"t": 1319.5833333333333, "x": "そうだ。"}, {"t": 1320.7166666666667, "x": "公安調査庁の公表にも\nこのプラントのことが載っている。"}, {"t": 1324.05, "x": "1993年、代表が幹部にサリンの研究と\n開発を指示したという。"}, {"t": 1329.5666666666666, "x": "6月の説明には、地下鉄以外の事件も並んでいた。"}, {"t": 1333.1, "x": "1つは教団をやめたいと言った女性信者の事件だ。"}, {"t": 1336.2333333333333, "x": "薬を打って意識をぼんやりさせ、\n施設に閉じ込めたという。"}, {"t": 1339.85, "x": "やめたい人を閉じ込めていたのね。"}, {"t": 1341.9833333333333, "x": "もう1つは、火炎瓶の事件だ。"}, {"t": 1344.1, "x": "教団が被害者であるように\n見せかける目的だったとされた。"}, {"t": 1347.6166666666666, "x": "代表が代表者を務める会社の店に\n火炎瓶を投げ込んだという。"}, {"t": 1351.5833333333333, "x": "自分たちの店に投げたの？"}, {"t": 1353.45, "x": "そういう起訴の中身だ。"}, {"t": 1354.9333333333334, "x": "さらに、名誉を傷つけた事件もあった。"}, {"t": 1357.4166666666667, "x": "教団の顧問の弁護士が記者会見を開いた。"}, {"t": 1360.2833333333333, "x": "山梨の会社が施設に毒ガスをまいていると発言した。"}, {"t": 1363.8, "x": "起訴の中身ではうその事実を広めたとされている。"}, {"t": 1366.8833333333334, "x": "自分たちが毒ガスで狙われていると言っていたのね。"}, {"t": 1369.9833333333333, "x": "品川の事件の犯人をかくまった事件も起訴された。"}, {"t": 1373.2833333333333, "x": "石川県のホテルや貸し別荘に泊まらせていたという。"}, {"t": 1376.4, "x": "顔を変える手術までして、見た目を変えさせていた。"}, {"t": 1380.05, "x": "ここで、教団のそれまでを犯罪白書で見ておこう。"}, {"t": 1383.1166666666666, "x": "教団が宗教法人になったのは、1989年8月だ。"}, {"t": 1387.55, "x": "白書によれば、その前後から事件を起こしていた。"}, {"t": 1390.6, "x": "やめようとした信徒の命を奪った事件がある。"}, {"t": 1393.35, "x": "教団を批判していた弁護士の一家の事件もある。"}, {"t": 1396.4166666666667, "x": "地下鉄の6年も前から、事件があったのね。"}, {"t": 1399.5, "x": "1993年ごろには、サリンを作ることに成功していた。"}, {"t": 1403.65, "x": "そして1994年6月に、松本の事件を起こした。"}, {"t": 1407.7666666666667, "x": "1995年2月には、品川の事務長の事件だ。"}, {"t": 1411.7833333333333, "x": "そこから1か月もたたずに、地下鉄の事件なのね。"}, {"t": 1415.2, "x": "白書は、これらを一続きの流れとして書いている。"}, {"t": 1418.9666666666667, "x": "なぜ地下鉄でまいたの？"}, {"t": 1420.5833333333333, "x": "犯罪白書と公安調査庁の公表が同じ説明をしている。"}, {"t": 1424.3, "x": "1995年1月から報道が教団の関わった\n事件を取り上げ始めた。"}, {"t": 1429.2166666666667, "x": "代表たちは、強制捜査が\n入るのではと危機感を持った。"}, {"t": 1432.7666666666667, "x": "その強制捜査を止めるために\n地下鉄でまくよう指示したという。"}, {"t": 1436.4833333333333, "x": "捜査を止めるために関係の無い人を巻き込んだのね。"}, {"t": 1439.7166666666667, "x": "白書は捜査をかく乱するねらいだったと書いている。"}, {"t": 1442.6333333333334, "x": "霞ケ関を通る電車が狙われたこととも重なる。"}, {"t": 1445.75, "x": "答弁の段階では、分からなかったことだ。"}, {"t": 1448.4166666666667, "x": "それが裁判と白書で埋まっていった。"}, {"t": 1451.2833333333333, "x": "裁判はそれから長く続いた。"}, {"t": 1453.2666666666667, "x": "犯罪白書によれば、代表は合わせて11回起訴された。"}, {"t": 1456.85, "x": "件数は17件だ。"}, {"t": 1458.35, "x": "判決の対象になったのは最終的に13件だった。"}, {"t": 1461.9666666666667, "x": "4件は判決の対象から外れたのね。"}, {"t": 1464.6833333333334, "x": "白書には、外れた理由までは書かれていない。"}, {"t": 1467.3833333333334, "x": "教団のほかの関係者も大勢裁判にかけられた。"}, {"t": 1470.45, "x": "実際の人数でおよそ190人だ。"}, {"t": 1473.05, "x": "190人も裁判になったの？"}, {"t": 1475.2666666666667, "x": "地下鉄の事件だけでなく一連の事件を合わせた数だ。"}, {"t": 1479.25, "x": "裁判の終わりも白書に日付で並んでいる。"}, {"t": 1481.85, "x": "2006年9月、代表の死刑が確定した。"}, {"t": 1484.95, "x": "死刑の判決を受けた幹部は12人いた。"}, {"t": 1487.5833333333333, "x": "その12人も2011年12月までに確定した。"}, {"t": 1491.2, "x": "それで裁判は、全部終わったの？"}, {"t": 1493.4166666666667, "x": "まだだった。"}, {"t": 1494.55, "x": "逃げていた関係者が2012年に逮捕されたからだ。"}, {"t": 1497.8666666666666, "x": "その人たちの裁判が2018年1月までに確定した。"}, {"t": 1501.7833333333333, "x": "これで一連の裁判が終わった。"}, {"t": 1503.7166666666667, "x": "2018年7月6日と26日に死刑が執行された。"}, {"t": 1507.7666666666667, "x": "元代表と幹部12人の合わせて13人だ。"}, {"t": 1510.85, "x": "事件から23年たっていたのね。"}, {"t": 1513.7333333333333, "x": "国の仕組みもこの事件で変わっていった。"}, {"t": 1516.15, "x": "1996年6月、警察法が改められた。"}, {"t": 1519.9, "x": "広い地域にまたがる組織犯罪に備えるためだ。"}, {"t": 1522.95, "x": "同じ年の7月には、公安調査庁の長官が動いた。"}, {"t": 1526.55, "x": "教団を解散させる手続きを求めたんだ。"}, {"t": 1529.3333333333333, "x": "破壊活動防止法という法律ね。"}, {"t": 1531.7, "x": "そうだ。"}, {"t": 1532.8166666666666, "x": "ところが1997年1月、その求めは退けられた。"}, {"t": 1537.1833333333334, "x": "認められなかったのね。"}, {"t": 1538.8, "x": "そこで、1999年12月に新しい法律ができた。"}, {"t": 1543.0, "x": "無差別に大勢の命を奪った団体を規制する法律だ。"}, {"t": 1546.45, "x": "公安調査庁は、この法律で\n教団の施設に立ち入り検査をしている。"}, {"t": 1551.3, "x": "被害を受けた人への償いはどうなったの？"}, {"t": 1553.9166666666667, "x": "教団は1996年3月に破産を宣告された。"}, {"t": 1557.7833333333333, "x": "宣告したのは東京地方裁判所だ。"}, {"t": 1560.2333333333333, "x": "残った財産を被害を受けた人たちで分けることになる。"}, {"t": 1563.5, "x": "ところが、国も教団にお金を求める立場にあった。"}, {"t": 1566.9333333333334, "x": "国と被害者が同じお金を取り合うことになるのね。"}, {"t": 1570.0666666666666, "x": "そこで、1998年4月に特別な法律ができた。"}, {"t": 1574.2333333333333, "x": "国が受け取る順番を後ろに下げたんだ。"}, {"t": 1576.65, "x": "被害者へ、少しでも多く回るようにするためだ。"}, {"t": 1579.7166666666667, "x": "国が順番をゆずったのね。"}, {"t": 1581.5666666666666, "x": "犯罪白書は、これを配当を\n増やすための措置と説明している。"}, {"t": 1586.05, "x": "2000年3月、衆議院の運輸の委員会で\n議員が営団について述べた。"}, {"t": 1590.3833333333334, "x": "乗客を助けた職員2名が殉職したと述べている。"}, {"t": 1593.8333333333333, "x": "駅の職員が亡くなっていたのね。"}, {"t": 1596.0, "x": "議員は営団も被害を受けた立場にあると述べた。"}, {"t": 1598.8666666666666, "x": "そして、教団への賠償の求めが\nどうなったかを尋ねている。"}, {"t": 1602.4833333333333, "x": "2008年には、別の議員が\n霞ケ関駅の助役について述べた。"}, {"t": 1606.75, "x": "最初にサリンの袋を取り上げた人だったという。"}, {"t": 1609.6833333333334, "x": "袋を片付けようとして被害を受けたのね。"}, {"t": 1612.3833333333334, "x": "1995年4月の労働省の答弁にも似た話が出てくる。"}, {"t": 1616.6833333333334, "x": "毒物を取り除こうとして被害を受けた職員の話だ。"}, {"t": 1620.1166666666666, "x": "朝の駅で乗客を守ろうとした\n人たちが被害者の中にいた。"}, {"t": 1624.5, "x": "犯罪白書は、この事件のもう1つの面も書いている。"}, {"t": 1627.9, "x": "犯罪の被害者の問題に\n人々の関心を高めたというんだ。"}, {"t": 1631.8, "x": "どういうことなの？"}, {"t": 1633.0333333333333, "x": "被害者は、直接のけがだけでは済まないということだ。"}, {"t": 1636.3333333333333, "x": "心や暮らしやお金の面でも、さまざまな被害を受ける。"}, {"t": 1639.75, "x": "そのことへの理解が深まったと白書は書いている。"}, {"t": 1642.65, "x": "裁判の途中でさらに心を傷つけられることもある。"}, {"t": 1645.8, "x": "それも問題として取り上げられるようになった。"}, {"t": 1648.5333333333333, "x": "被害者を支える仕組みが考えられるようになったのね。"}, {"t": 1651.7833333333333, "x": "被害者の会の訴えは、065の回で扱っている。"}, {"t": 1655.8666666666666, "x": "事件から13年たった2008年6月4日。"}, {"t": 1659.1166666666666, "x": "衆議院の内閣の委員会で\n委員長が法律案を読み上げた。"}, {"t": 1662.6166666666666, "x": "オウム真理教の犯罪の被害者に\n給付金を出す法律案だ。"}, {"t": 1666.3833333333334, "x": "13年もたってからだったのね。"}, {"t": 1668.5666666666666, "x": "委員長はその日の委員会に\n被害者が来ていると述べた。"}, {"t": 1671.7666666666667, "x": "そして、地下鉄サリン事件などを\n国家的なテロリズムだと述べた。"}, {"t": 1675.7333333333333, "x": "被害者はいわば国の身代わりとして犠牲になった、と。"}, {"t": 1679.0333333333333, "x": "国の身代わりという言葉を使ったのね。"}, {"t": 1681.5333333333333, "x": "被害者を救うことはテロと闘う\n国の姿勢を示すことでもある。"}, {"t": 1685.35, "x": "委員長はそうも述べている。"}, {"t": 1687.5333333333333, "x": "どんな中身の法律なの？"}, {"t": 1689.3, "x": "対象は教団による8つの事件の被害者や家族だ。"}, {"t": 1692.6, "x": "お見舞いの性格のお金とされた。"}, {"t": 1694.6333333333334, "x": "被害の重さで6段階に分けている。"}, {"t": 1696.9166666666667, "x": "亡くなった人や重い障害が\n残った人には、2000万円だ。"}, {"t": 1700.6666666666667, "x": "介護が要る障害が残った人には、3000万円とした。"}, {"t": 1704.3333333333333, "x": "亡くなった場合より介護が要る場合のほうが多いのね。"}, {"t": 1707.3166666666666, "x": "介護を続ける家族の負担を考えて\n手厚くしたと説明している。"}, {"t": 1711.2833333333333, "x": "書類を集める負担も、被害者に\n重くかからないようにした。"}, {"t": 1714.8666666666666, "x": "国は払った分だけ、教団に賠償を\n求める権利を持つことにした。"}, {"t": 1719.05, "x": "ただ、その権利は慎重に使うよう\n求めると、委員長は述べている。"}, {"t": 1723.1333333333334, "x": "テロの被害者を救うあり方を\n今後考える決まりも置かれた。"}, {"t": 1726.6166666666666, "x": "6月10日、参議院の委員会でも\n全会一致で可決された。"}, {"t": 1730.6166666666666, "x": "反対した人は、いなかったのね。"}, {"t": 1733.4666666666667, "x": "この救済法には、もう1つ大事な言葉が入っている。"}, {"t": 1736.9166666666667, "x": "地下鉄サリン事件などを、テロリズムと書いたことだ。"}, {"t": 1740.0166666666667, "x": "暴力で国の仕組みを壊す考えを\n広めるための犯罪だ、と。"}, {"t": 1744.0, "x": "法律の中に、テロと書かれたのね。"}, {"t": 1746.4666666666667, "x": "2009年11月、衆議院の法務委員会で議員が尋ねた。"}, {"t": 1750.4166666666667, "x": "国はテロリズムをどう決めているのか、という質問だ。"}, {"t": 1753.5333333333333, "x": "法務大臣は、この救済法の書き方を挙げて答えた。"}, {"t": 1756.9666666666667, "x": "悪質かつ重大な\nテロリズムとしての犯罪行為、という書き方だ。"}, {"t": 1761.1333333333334, "x": "その書き方が、国の考え方のもとに const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
