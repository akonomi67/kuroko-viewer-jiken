<script>
const D={"name": "134", "file": "134_編集用", "dur": 1993.4, "segs": [], "subs": [{"t": 0.0, "x": "1888年9月27日。"}, {"t": 2.7333333333333334, "x": "イギリスのロンドン。"}, {"t": 3.9166666666666665, "x": "ある会社の郵便受けに、1通の封筒が届いた。"}, {"t": 7.0, "x": "宛名は「ボスへ。セントラル・ニューズ社」。"}, {"t": 9.7, "x": "セントラル・ニューズ？"}, {"t": 11.116666666666667, "x": "新聞社に記事を売る、通信社だ。"}, {"t": 13.333333333333334, "x": "中の便箋は赤いインクで両面にびっしり書いてあった。"}, {"t": 16.45, "x": "書き出しは「親愛なるボスへ」。"}, {"t": 18.4, "x": "そして最後にこう署名してあった。"}, {"t": 20.466666666666665, "x": "「切り裂きジャック」。"}, {"t": 21.65, "x": "えっ、あの名前って、手紙の署名だったの？"}, {"t": 24.55, "x": "そうだ。この名前が紙に書かれた最初の記録がこれだ。"}, {"t": 27.933333333333334, "x": "ここで数字を一つ出しておく。"}, {"t": 29.8, "x": "この手紙から数えて今年で138年になる。"}, {"t": 33.05, "x": "その138年のあいだ、犯人の本当の名前は\n一度も確かめられていない。"}, {"t": 38.11666666666667, "x": "じゃあ、ジャックっていうのは？"}, {"t": 39.766666666666666, "x": "誰かが付けた呼び名だ。"}, {"t": 41.3, "x": "しかもその手紙を犯人が書いたという強い証拠は無い。"}, {"t": 44.63333333333333, "x": "犯人じゃない人が、\n犯人の名前を付けたかもしれないってこと？"}, {"t": 48.61666666666667, "x": "その可能性を当時の警察の幹部が書き残している。"}, {"t": 51.85, "x": "今回は、この「名前」が\nどこから来たのかを紙の記録で追う。"}, {"t": 55.75, "x": "届いた手紙、警察の報告、\nそしてイギリス議会の記録だ。"}, {"t": 59.85, "x": "手紙と警察と議会ね。"}, {"t": 61.68333333333333, "x": "先に一つだけ。亡くなった\n女性たちの様子は話さない。"}, {"t": 65.25, "x": "容疑者とされた人の名前も一人も出さない。"}, {"t": 68.6, "x": "舞台はロンドンの東のはずれ、\nホワイトチャペルという地区だ。"}, {"t": 72.21666666666667, "x": "どんな町だったの？"}, {"t": 73.6, "x": "イギリスの国立公文書館は、国で最も\n貧しい地区の一つだったと書いている。"}, {"t": 78.53333333333333, "x": "家を持たない人たちは簡易宿泊所に泊まった。"}, {"t": 81.56666666666666, "x": "簡易宿泊所って、安い宿のこと？"}, {"t": 84.16666666666667, "x": "一晩いくらで寝床を借りる宿だ。"}, {"t": 86.26666666666667, "x": "何人もが同じ部屋で寝る相部屋だった。"}, {"t": 88.66666666666667, "x": "その日の寝床代を払えなければ、\n外で夜を明かすことになる。"}, {"t": 92.56666666666666, "x": "毎晩、その日のお金を作らないといけないのね。"}, {"t": 95.61666666666666, "x": "そういう暮らしをしていた人が、\nこの地区にはたくさんいた。"}, {"t": 98.93333333333334, "x": "公文書館の解説によると亡くなった5人もそうだった。"}, {"t": 102.31666666666666, "x": "5人とも決まった住まいも決まった収入も無かった。"}, {"t": 105.46666666666667, "x": "5人っていうのは？"}, {"t": 106.75, "x": "1888年の8月から11月にかけて\n亡くなった5人の女性だ。"}, {"t": 111.76666666666667, "x": "のちに「切り裂きジャック」の事件として数えられる。"}, {"t": 114.91666666666667, "x": "当時の新聞の多くは、この5人を\n売春婦だと決めつけて書いた。"}, {"t": 118.98333333333333, "x": "本当にそうだったの？"}, {"t": 120.46666666666667, "x": "公文書館は、警察にそうと知られていた\n人は一人もいないと書いている。"}, {"t": 124.81666666666666, "x": "宿の掃除をして稼いでいた人がいた。"}, {"t": 127.18333333333334, "x": "田舎の畑へ、季節の働き手として出ていた人もいた。"}, {"t": 130.85, "x": "5人とも、かつては決まった\n仕事を持っていた時期があった。"}, {"t": 134.26666666666668, "x": "結婚していた人も子どもがいた人もいた。"}, {"t": 137.06666666666666, "x": "最初からその暮らしだったわけじゃないのね。"}, {"t": 139.66666666666666, "x": "そうだ。それぞれに、あの地区に\nたどり着くまでの事情があった。"}, {"t": 143.93333333333334, "x": "最初の事件は、1888年8月31日の未明だ。"}, {"t": 148.55, "x": "場所はバックス・ロウという細い通り。"}, {"t": 150.85, "x": "仕事へ向かう荷馬車の御者が、\n道ばたに倒れている女性を見つけた。"}, {"t": 154.91666666666666, "x": "明かりは、通りの端にある\nガス灯が1つだけだったという。"}, {"t": 158.46666666666667, "x": "朝早くに通りがかった人が見つけたのね。"}, {"t": 161.28333333333333, "x": "亡くなっていたのは、メアリー・\nアン・ニコルズ。43歳だった。"}, {"t": 165.31666666666666, "x": "その夜、彼女は宿の台所にいた。"}, {"t": 167.75, "x": "でも寝床代が払えずに外へ出された。"}, {"t": 170.28333333333333, "x": "寝床代って、いくらだったの？"}, {"t": 172.36666666666667, "x": "彼女が少し前まで泊まっていた\n宿の相部屋は、一晩4ペンスだった。"}, {"t": 176.81666666666666, "x": "4ペンスって、今だとどれくらい？"}, {"t": 179.05, "x": "今のお金に直す確かな\n物差しは無いから、ここでは言わない。"}, {"t": 182.68333333333334, "x": "ただ、それが払えない夜があった、ということだ。"}, {"t": 185.65, "x": "出ていくとき、彼女は宿の者に\n寝床を取っておいてと頼んだという。"}, {"t": 189.7, "x": "すぐ戻るつもりだったのね。"}, {"t": 191.53333333333333, "x": "そうだ。でも戻ってこなかった。"}, {"t": 193.55, "x": "このとき警察はまだ一つの事件として調べていた。"}, {"t": 196.93333333333334, "x": "まだ、続けて起きるとは思ってなかったの？"}, {"t": 199.68333333333334, "x": "同じ地区では、それまでにも\n女性が襲われる事件があった。"}, {"t": 203.13333333333333, "x": "つながっているのかどうか、決め手は無かった。"}, {"t": 205.73333333333332, "x": "ただ、この事件はのちに\n一続きの1件目として数えられることになる。"}, {"t": 210.18333333333334, "x": "のちにね。"}, {"t": 211.31666666666666, "x": "そうだ。その数え方の話はあとでもう一度する。"}, {"t": 215.06666666666666, "x": "8日後の9月8日。"}, {"t": 216.5, "x": "ハンベリー通り29番地の家の裏庭で、\n2人目が見つかった。"}, {"t": 220.45, "x": "見つけたのは同じ家に住む荷馬車の御者だ。"}, {"t": 223.06666666666666, "x": "午前6時になる少し前だった。"}, {"t": 225.3, "x": "自分の住んでいる家の裏庭で？"}, {"t": 227.31666666666666, "x": "そうだ。亡くなっていたのはアニー・チャップマン。"}, {"t": 229.93333333333334, "x": "ここから町の空気が大きく変わった。"}, {"t": 232.33333333333334, "x": "どう変わったの？"}, {"t": 233.45, "x": "住民が自分たちで見回りの会を作った。"}, {"t": 236.08333333333334, "x": "ホワイトチャペル自警委員会だ。"}, {"t": 237.91666666666666, "x": "会長になったのはジョージ・ラスクという男だ。"}, {"t": 240.88333333333333, "x": "警察に任せておけない、ってこと？"}, {"t": 243.21666666666667, "x": "そういう気持ちが強かったんだろう。"}, {"t": 245.18333333333334, "x": "町の人の中からも、自分で\n懸賞金を出すと申し出る人が出た。"}, {"t": 249.45, "x": "その申し出のやり取りは、\nロンドン警視庁のファイルに残っている。"}, {"t": 253.13333333333333, "x": "日付は9月10日から19日だ。"}, {"t": 255.5, "x": "自分で懸賞金を？"}, {"t": 256.98333333333335, "x": "そうだ。理由について、警視庁のトップが\nのちに報告を書いている。"}, {"t": 261.01666666666665, "x": "町ではある民族の人たちが疑われはじめていた。"}, {"t": 264.1166666666667, "x": "その人たちへの反感をそらす\n狙いがあったのだろう、という見立てだ。"}, {"t": 268.18333333333334, "x": "事件のせいで関係ない人が疑われていたのね。"}, {"t": 271.25, "x": "この「誰かを疑う空気」は、\nこのあとの話にも何度も出てくる。"}, {"t": 276.1, "x": "さてここで最初の手紙に戻る。"}, {"t": 278.1333333333333, "x": "2人目の事件から19日後、9月27日。"}, {"t": 281.4, "x": "通信社に届いた、あの封筒だ。"}, {"t": 283.5833333333333, "x": "消印は9月27日。便箋に\n書かれた日付は9月25日だった。"}, {"t": 288.43333333333334, "x": "書いてから2日後に届いたのね。"}, {"t": 290.5833333333333, "x": "中身を言える範囲で訳しておく。"}, {"t": 292.5, "x": "「警察が俺を捕まえたと聞くがまだ捕まらない」。"}, {"t": 295.3666666666667, "x": "「この手紙は、俺がもう少し仕事をするまで\n取っておいて、それから出してくれ」。"}, {"t": 300.03333333333336, "x": "取っておいてから出せ？"}, {"t": 301.48333333333335, "x": "そう頼んでいる。新聞に出す\n時期まで指図しているんだ。"}, {"t": 304.85, "x": "最後に署名があって、その横にこう書き足してある。"}, {"t": 307.96666666666664, "x": "「商売用の名前を名乗るのを悪く思うな」。"}, {"t": 310.53333333333336, "x": "商売用の名前……。"}, {"t": 311.8666666666667, "x": "そう。「切り裂きジャック」は、\n自分で決めた通り名だと言っている。"}, {"t": 315.6333333333333, "x": "追伸は赤鉛筆で横向きに書かれていた。"}, {"t": 318.25, "x": "「今度は医者だと言われている、ははは」。"}, {"t": 320.6166666666667, "x": "……ふざけてるわね。"}, {"t": 321.8333333333333, "x": "本文にはここで読めない残酷な言葉も並んでいる。"}, {"t": 324.93333333333334, "x": "そこは今回、読まない。"}, {"t": 326.6666666666667, "x": "そのほうがいいわ。"}, {"t": 327.81666666666666, "x": "大事なのは、この時点ではまだ誰も、\nこの名前を知らなかったことだ。"}, {"t": 332.1166666666667, "x": "まだ新聞にも出てないものね。"}, {"t": 334.1, "x": "名前を知っていたのは、手紙を書いた人と、\nそれを開けた通信社の人だけだった。"}, {"t": 339.6166666666667, "x": "通信社の人はすぐに警察に届けたの？"}, {"t": 342.45, "x": "いや、すぐには届けていない。"}, {"t": 344.26666666666665, "x": "最初は冗談だと思われていた。"}, {"t": 346.35, "x": "冗談？"}, {"t": 347.48333333333335, "x": "こういう手紙はほかにも来ていたからな。"}, {"t": 349.76666666666665, "x": "実はこの手紙は犯人を名乗った最初の手紙でもない。"}, {"t": 353.03333333333336, "x": "9月24日の日付で、ウォーレン総監あてに\n届いた手紙が先にあった。"}, {"t": 357.53333333333336, "x": "総監というのはロンドン警視庁のトップのことだ。"}, {"t": 360.56666666666666, "x": "じゃあ、通信社の手紙は2番目？"}, {"t": 362.8, "x": "少なくとも記録の上ではそうなる。"}, {"t": 364.93333333333334, "x": "ただ「切り裂きジャック」と署名したのは、\n通信社の手紙が最初だった。"}, {"t": 369.3833333333333, "x": "警察に回されたのは2日後、9月29日だ。"}, {"t": 372.68333333333334, "x": "通信社の編集者が添え状をつけて送った。"}, {"t": 375.45, "x": "添え状の中身はこうだ。"}, {"t": 376.95, "x": "「同封のものは2日前に当社に届いたもので、\n冗談として扱っていました」。"}, {"t": 381.8, "x": "本当に冗談だと思ってたのね。"}, {"t": 384.0, "x": "そうだ。警察の側もすぐに大騒ぎはしていない。"}, {"t": 386.98333333333335, "x": "ところがその翌日。"}, {"t": 388.53333333333336, "x": "翌日って、9月30日？"}, {"t": 390.8, "x": "そうだ。この日、ひと晩のうちに2つの事件が起きた。"}, {"t": 394.3833333333333, "x": "ひと晩に2つ？"}, {"t": 395.68333333333334, "x": "手紙が警察に届いた次の夜だ。"}, {"t": 398.0, "x": "「もう少し仕事をするまで取っておいてくれ」と\n書いた手紙の、すぐあとだった。"}, {"t": 402.56666666666666, "x": "……それで手紙の見られ方が変わったのね。"}, {"t": 405.03333333333336, "x": "そうだ。冗談として2日しまわれていた\n手紙が、急に重くなった。"}, {"t": 409.21666666666664, "x": "ただ、ここで一つ押さえておきたい。"}, {"t": 411.3833333333333, "x": "重くなったのは、手紙の中身が\n確かめられたからじゃない。"}, {"t": 414.8333333333333, "x": "起きた時期が重なったからだ。"}, {"t": 416.8, "x": "時期が重なっただけ、ってことね。"}, {"t": 419.56666666666666, "x": "9月30日、午前1時ごろ。"}, {"t": 421.8, "x": "バーナー通りの奥にある、\nダットフィールド・ヤードという中庭。"}, {"t": 425.35, "x": "荷馬車で戻ってきた行商人の馬が、\n入口でおびえて進まなくなった。"}, {"t": 429.8666666666667, "x": "馬が？"}, {"t": 431.0, "x": "暗くて何があるのか見えなかったそうだ。"}, {"t": 433.35, "x": "そこで見つかったのが、\nエリザベス・ストライドだった。"}, {"t": 436.6166666666667, "x": "そしてそれから45分ほどあと。"}, {"t": 438.76666666666665, "x": "場所はマイター・スクエアという広場だ。"}, {"t": 441.05, "x": "午前1時44分、巡回中の巡査がもう1人を見つけた。"}, {"t": 445.03333333333336, "x": "キャサリン・エドウズだ。"}, {"t": 446.5, "x": "本当にひと晩のうちなのね。"}, {"t": 448.48333333333335, "x": "エドウズはその夜の早い時間に警察署にいた。"}, {"t": 451.43333333333334, "x": "警察署に？"}, {"t": 452.5833333333333, "x": "酔って道で倒れていて保護されていたんだ。"}, {"t": 455.01666666666665, "x": "酔いがさめたとして午前1時ごろに署から出された。"}, {"t": 457.98333333333335, "x": "それから1時間たたないうちに広場で見つかった。"}, {"t": 461.03333333333336, "x": "……警察署を出た、すぐあとだったのね。"}, {"t": 463.48333333333335, "x": "そしてこの広場は、\nロンドン警視庁の管轄じゃなかった。"}, {"t": 467.1166666666667, "x": "どういうこと？"}, {"t": 468.23333333333335, "x": "ロンドンの真ん中の「シティ」は、\n別のシティ警察が受け持っている。"}, {"t": 472.28333333333336, "x": "マイター・スクエアはその中にあった。"}, {"t": 474.48333333333335, "x": "つまりこの晩から、2つの警察が\n同じ事件を追うことになった。"}, {"t": 478.56666666666666, "x": "警察が2つ……。足並みはそろったの？"}, {"t": 481.15, "x": "その答えに近い出来事が、\nこの同じ夜の明け方に起きている。"}, {"t": 485.6, "x": "午前2時55分。"}, {"t": 486.93333333333334, "x": "ゴールストン通りの共同住宅の入口で、\n巡査が布切れを見つけた。"}, {"t": 491.15, "x": "マイター・スクエアの件に関わるとみられた布だ。"}, {"t": 494.1, "x": "そして、その上の壁に、\nチョークで一文が書いてあった。"}, {"t": 497.6166666666667, "x": "何て書いてあったの？"}, {"t": 499.03333333333336, "x": "ユダヤ人を名指しする一文だ。"}, {"t": 500.96666666666664, "x": "つづりがおかしくて意味もはっきりしない。"}, {"t": 503.18333333333334, "x": "ただ、読んだ人がユダヤ人を\n疑うように取れる文だった。"}, {"t": 506.75, "x": "さっきの、誰かを疑う空気ね。"}, {"t": 509.01666666666665, "x": "そうだ。夜明け前に、\n警視庁のトップが自分で現場へ来た。"}, {"t": 512.6833333333333, "x": "チャールズ・ウォーレン総監だ。"}, {"t": 514.4333333333333, "x": "そして写しを取ったうえでその文字を消させた。"}, {"t": 517.1833333333333, "x": "えっ、消しちゃったの？"}, {"t": 518.7, "x": "消した。ただ、反対の声もあった。"}, {"t": 521.1166666666667, "x": "シティ警察の刑事部長が写真に撮れと命じていた。"}, {"t": 524.2333333333333, "x": "問題の部分だけ消して、残りを\n写真に撮る案も出たという。"}, {"t": 527.8333333333334, "x": "でもその通りはロンドン警視庁の管轄だった。"}, {"t": 530.7, "x": "最後に決めるのは警視庁の側だった。"}, {"t": 533.1666666666666, "x": "手がかりかもしれないのに？"}, {"t": 534.85, "x": "ウォーレンは11月6日の報告で、\n理由を書き残している。"}, {"t": 538.4833333333333, "x": "訳すとこうだ。"}, {"t": 539.55, "x": "「あの文字を残しておけば、ユダヤ人への襲撃が\n起き、家は壊され、命もおそらく失われていた」。"}, {"t": 545.55, "x": "……暴動になると思ったのね。"}, {"t": 547.35, "x": "報告にはもう一つ出来事が書き添えてある。"}, {"t": 550.05, "x": "事件から13日後、ユダヤ教の聖職者の代表が\n総監に手紙を書いた。"}, {"t": 554.8, "x": "ある新聞が、壁の文字のつづりは\nユダヤ人の書き方だと書いたからだ。"}, {"t": 559.0, "x": "それを打ち消さないと、貧しい\nユダヤ人の身が危ない、という手紙だった。"}, {"t": 563.3166666666667, "x": "13日たってもそんなに張りつめてたのね。"}, {"t": 566.1333333333333, "x": "総監は、つづり一つでこうなら、文字が\n残っていたらどうなったかと書いている。"}, {"t": 570.7166666666667, "x": "日曜の朝でまもなく通りは人であふれる時刻だった。"}, {"t": 573.9666666666667, "x": "その通りはユダヤ人の露天商でにぎわう場所だった。"}, {"t": 577.1, "x": "残すのも危ない、消すのも手がかりを失う……。"}, {"t": 579.95, "x": "どちらを取るべきだったか、ここで答えは出さない。"}, {"t": 582.8333333333334, "x": "はっきりしているのは、この一文も\n写しの紙しか残らなかったことだ。"}, {"t": 587.6666666666666, "x": "10月1日、2つの事件の翌日。"}, {"t": 590.4166666666666, "x": "新聞が、あの「親愛なるボスへ」の\n手紙の書き起こしを載せた。"}, {"t": 594.55, "x": "手紙がとうとう表に出たのね。"}, {"t": 596.6, "x": "そうだ。そして同じ日の朝、通信社にもう1通届いた。"}, {"t": 600.2833333333333, "x": "今度は手紙じゃなくポストカードだ。"}, {"t": 602.5, "x": "同じ人から？"}, {"t": 603.6833333333333, "x": "赤鉛筆で書かれていて前の手紙のことに触れていた。"}, {"t": 606.8666666666667, "x": "「前の手紙を\n取っておいてくれてありがとう」という書き方だ。"}, {"t": 610.2166666666667, "x": "そして「今度は2つだ」とあった。"}, {"t": 612.7, "x": "2つって……ひと晩の2つのこと？"}, {"t": 615.1666666666666, "x": "そう読める書き方だ。"}, {"t": 616.5666666666667, "x": "筆跡は前の手紙の追伸と同じだとされた。"}, {"t": 619.6166666666667, "x": "じゃあ、事件の翌朝に届いたなら、\n犯人しか知らないはずじゃない？"}, {"t": 623.75, "x": "そう言われたこともある。でもそうとは限らない。"}, {"t": 626.4, "x": "2つの事件の話は、9月30日のうちに\n町中に広まっていた。"}, {"t": 630.85, "x": "それに当時の郵便は日曜も集めて配っていた。"}, {"t": 633.9666666666667, "x": "前の日に書いて出しても間に合うのね。"}, {"t": 636.2833333333333, "x": "そうだ。事件を知った誰かが書いても翌朝には届く。"}, {"t": 639.6166666666667, "x": "ちなみに、このポストカードの原物は\n今、行方が分からない。"}, {"t": 643.4333333333333, "x": "えっ、無くなったの？"}, {"t": 644.9333333333333, "x": "残っているのは、1888年に\n警視庁が作った写しだけだ。"}, {"t": 650.1666666666666, "x": "このポストカードにはもう一つ話がある。"}, {"t": 652.8833333333333, "x": "カードの両面に赤黒いしみがなすりつけてあった。"}, {"t": 655.8166666666667, "x": "宛名の側には指の跡のようなものも残っていた。"}, {"t": 658.8833333333333, "x": "指の跡！　それなら誰の指か調べられるんじゃない？"}, {"t": 662.0333333333333, "x": "まさにそう考えた人がいた。"}, {"t": 663.9333333333333, "x": "イギリス南西部のプリマスに住む\n男が、新聞に投書したんだ。"}, {"t": 667.85, "x": "中身を短くするとこうだ。"}, {"t": 669.65, "x": "「親指の表面の模様は、2人として同じものは無い」。"}, {"t": 672.9333333333333, "x": "「疑わしい男たちの親指を、専門家に\nこの跡と比べさせればよい」。"}, {"t": 677.1, "x": "「顕微鏡を使えばそれが分かる」。"}, {"t": 679.1, "x": "今で言う、指紋の鑑定ね。"}, {"t": 681.0833333333334, "x": "そうだ。ところが当時のロンドンの警察は、\nまだ指紋を使っていなかった。"}, {"t": 685.5, "x": "指紋で人を見分ける方法は、\n2年前の1886年に警視庁へ持ち込まれていた。"}, {"t": 691.15, "x": "でもそのときは断っていた。"}, {"t": 693.1, "x": "えっ、もったいない。"}, {"t": 694.4833333333333, "x": "指紋で殺人の犯人が初めて有罪になったのは、\n1892年のアルゼンチンだ。"}, {"t": 700.0, "x": "この事件の4年あとになる。"}, {"t": 701.8666666666667, "x": "じゃあ、もし指紋が使えていたら……。"}, {"t": 704.05, "x": "それも分からない。"}, {"t": 705.15, "x": "あの跡が、本当に書いた\n人の指だったのかも確かめようがない。"}, {"t": 709.05, "x": "そもそもカードの原物がもう無いからな。"}, {"t": 711.5666666666667, "x": "そうだった。写ししか残ってないのよね。"}, {"t": 714.2333333333333, "x": "投書の男の考えは正しかった。\nただ、時代が少し早すぎた。"}, {"t": 719.15, "x": "10月4日、新聞に手紙と\nポストカードの写真版が載った。"}, {"t": 723.1666666666666, "x": "写真版って？"}, {"t": 724.3, "x": "書き写した文字じゃなく、\n筆跡そのままを印刷したものだ。"}, {"t": 728.0333333333333, "x": "前の日の遅い版に、もう載っていたかも\nしれないとも言われる。"}, {"t": 731.4833333333333, "x": "そして警察は手紙の写しを警察署に貼り出した。"}, {"t": 734.8166666666667, "x": "警察が自分で？"}, {"t": 736.15, "x": "この字に見覚えのある\n人はいないか、という狙いだったんだろう。"}, {"t": 739.6333333333333, "x": "のちの警視庁の幹部マクノートンは、\nこれを回想録に書いている。"}, {"t": 743.4666666666667, "x": "訳すとこうだ。"}, {"t": 744.5333333333333, "x": "「写しが方々の警察署に貼られ、手紙に\nお墨付きを与えることになった」。"}, {"t": 748.95, "x": "その前には、自分の考えでは\n賢くなかった、と添えてある。"}, {"t": 752.9, "x": "警察が貼ったから本物っぽく見えちゃったのね。"}, {"t": 755.8666666666667, "x": "そうだ。そして同じ回想録にこういう一文もある。"}, {"t": 759.0333333333333, "x": "「切り裂きジャックという名前は\n国中に広まり、受けてしまった」。"}, {"t": 762.7833333333333, "x": "受けてしまった、って……。"}, {"t": 764.25, "x": "それまで新聞は\n「ホワイトチャペルの殺人者」と呼んでいた。"}, {"t": 767.9166666666666, "x": "それが、この手紙をきっかけに\n「ジャック」に置き換わっていった。"}, {"t": 771.8333333333334, "x": "手紙の署名が事件の名前になったのね。"}, {"t": 774.4666666666667, "x": "そうだ。本物かどうかを誰も\n確かめないまま、名前だけが先に決まった。"}, {"t": 779.15, "x": "警察が広めちゃったようなものね。"}, {"t": 781.3833333333333, "x": "結果としては、そうなった。"}, {"t": 783.8333333333334, "x": "名前が広まったらどうなったの？"}, {"t": 785.8666666666667, "x": "同じ名前を名乗る手紙が次々に届きはじめた。"}, {"t": 789.0833333333334, "x": "まねする人が出たのね。"}, {"t": 790.7333333333333, "x": "国立公文書館は、警視庁のファイルに「ジャック」を\n名乗る手紙が何百通もあると書いている。"}, {"t": 796.55, "x": "市民から警察と新聞に届いた手紙全体では何千通だ。"}, {"t": 800.5, "x": "何千通……。"}, {"t": 801.6166666666667, "x": "中には、本気で手がかりを\n知らせようとした手紙もあった。"}, {"t": 805.05, "x": "でも多くは犯人を名乗るいたずらだった。"}, {"t": 807.3833333333333, "x": "宛先もばらばらだ。"}, {"t": 808.7333333333333, "x": "ロンドンの警察署や判事だけじゃない。"}, {"t": 810.9666666666667, "x": "パリの警察、ベルギー、カナダ、\nアメリカのニューヨークやワシントンにも届いている。"}, {"t": 815.7333333333333, "x": "海の向こうにまで？"}, {"t": 817.0333333333333, "x": "そうだ。名前ごと世界へ広がっていった。"}, {"t": 819.5833333333334, "x": "公文書館が紹介している1通は、\nバーミンガムから出したと名乗っている。"}, {"t": 824.0166666666667, "x": "ロンドンじゃない町から？"}, {"t": 825.5333333333333, "x": "そうだ。犯人がどこにいるか、\n手紙だけでは何も分からない。"}, {"t": 829.2333333333333, "x": "公文書館はこうまとめている。"}, {"t": 831.05, "x": "「どの手紙も、殺人者が\n書いたという強い証拠は無い」。"}, {"t": 834.3333333333334, "x": "そして「今のいたずらと同じで、\n警察の時間をむだにさせただけだった」。"}, {"t": 838.8833333333333, "x": "……警察はそれを全部読まないといけなかったのね。"}, {"t": 841.7833333333333, "x": "読まなければ本物を見落とすかもしれないからな。"}, {"t": 844.5666666666667, "x": "国立公文書館には、こうした\n手紙だけを集めた束がある。"}, {"t": 848.3, "x": "題は「切り裂きジャックと署名した個人からの手紙」。"}, {"t": 851.4666666666667, "x": "日付は1888年から1891年までだ。"}, {"t": 855.7666666666667, "x": "3年も手紙が来続けたの？"}, {"t": 857.8333333333334, "x": "そうだ。名前は、事件が止まった\nあとも手紙の中で生き続けた。"}, {"t": 862.5166666666667, "x": "その中でひときわ知られている1通がある。"}, {"t": 865.0, "x": "10月16日の夕方の郵便。"}, {"t": 867.2, "x": "届いた先は、自警委員会の会長、\nジョージ・ラスクの家だった。"}, {"t": 871.4333333333333, "x": "警察じゃなくて自警団の会長に？"}, {"t": 873.8, "x": "そうだ。手紙は小包の中に入っていた。"}, {"t": 876.5, "x": "小包の中身はここでは言わない。"}, {"t": 878.65, "x": "……うん。"}, {"t": 879.7833333333333, "x": "手紙の書き出しは「地獄より」。"}, {"t": 881.8333333333334, "x": "結びはこうだ。"}, {"t": 882.8166666666667, "x": "「つかまえられるものなら\nつかまえてみな、ラスクさん」。"}, {"t": 885.85, "x": "挑発してるのね。"}, {"t": 887.2666666666667, "x": "ラスクは最初、いたずらだと思ったそうだ。"}, {"t": 889.8333333333334, "x": "会長の名前と住んでいる通りは新聞にも出ていた。"}, {"t": 892.8166666666667, "x": "小包が届く前の日の夜中、気になる\n出来事があったとも伝えられている。"}, {"t": 897.2833333333333, "x": "近くの革製品の店にある男が入ってきた。"}, {"t": 900.3, "x": "店に貼られた自警委員会の懸賞金のビラを見て、\nラスクの住所を聞いたという。"}, {"t": 905.0666666666667, "x": "住所を？"}, {"t": 906.1833333333333, "x": "店の娘は新聞に載っていた通りの名前を教えた。"}, {"t": 909.3333333333334, "x": "ただ、番地までは教えなかった。"}, {"t": 911.4, "x": "そして届いた小包の宛名にも、\n番地が書かれていなかった。"}, {"t": 915.2666666666667, "x": "えっ、それって……。"}, {"t": 916.55, "x": "同じ男かどうかは分からない。"}, {"t": 918.25, "x": "娘があとからそう話した、というだけだ。"}, {"t": 920.95, "x": "ここで一つ気になるのは、この手紙には\n「ジャック」の署名が無いことだ。"}, {"t": 925.4833333333333, "x": "名乗ってないの？"}, {"t": 926.6333333333333, "x": "名乗っていない。それなのに、今はよく\n「ジャックの手紙」として紹介される。"}, {"t": 931.35, "x": "名前のほうがあとから手紙にくっついたのね。"}, {"t": 934.0166666666667, "x": "そうだ。そしてこの手紙の原物も、\n今は行方が分からない。"}, {"t": 937.7833333333333, "x": "1888年10月に写真に撮られたあと、\nどこへ行ったのか記録が無い。"}, {"t": 942.85, "x": "また、写しだけ？"}, {"t": 944.3166666666667, "x": "そうだ。この事件は、原物より\n写しのほうが多く残っている。"}, {"t": 948.7333333333333, "x": "町の人たちはどうしてたの？"}, {"t": 950.6833333333333, "x": "10月、ホワイトチャペルの商店主たちが\n内務大臣に請願を出した。"}, {"t": 955.0666666666667, "x": "内務大臣って？"}, {"t": 956.35, "x": "警察を受け持つ大臣だ。"}, {"t": 957.9333333333333, "x": "ロンドン警視庁の上にいる。"}, {"t": 959.6833333333333, "x": "請願の中身は警官を増やしてほしい、というものだ。"}, {"t": 962.9666666666667, "x": "店をやってる人たちも怖かったのね。"}, {"t": 965.4333333333333, "x": "夜に人が出歩かなくなれば商売にも響く。"}, {"t": 968.2, "x": "警視庁のファイルには、10月22日付で\n巡回の人数の報告も入っている。"}, {"t": 973.2833333333333, "x": "警察も人数を見直したのね。"}, {"t": 975.4166666666666, "x": "この「警官は足りているのか」は議会でも聞かれた。"}, {"t": 978.6333333333333, "x": "11月13日、ある議員が内務大臣に質問している。"}, {"t": 982.45, "x": "混み合った貧しい地区の警官は、\n裕福な地区と同じ割合でいるのか。"}, {"t": 986.6166666666667, "x": "警察は働きすぎで人が足りないのではないか。"}, {"t": 989.6833333333333, "x": "大臣は何て答えたの？"}, {"t": 991.4333333333333, "x": "訳すとこうだ。"}, {"t": 992.4833333333333, "x": "「警官は地区ごとの必要に応じて置いていて、\n人数の割合では決めていない」。"}, {"t": 996.9166666666666, "x": "「働きすぎで人が足りないとは考えていない」。"}, {"t": 999.7666666666667, "x": "足りてる、って言ったのね。"}, {"t": 1001.3833333333333, "x": "ただ、こうも続けている。"}, {"t": 1003.0, "x": "「ときに、対応の難しい\n大きな仕事の重なりがあるのは確かだ」。"}, {"t": 1007.05, "x": "……認めてるような、認めてないような。"}, {"t": 1009.4166666666666, "x": "議会の答弁はたいていそういう言い回しになる。"}, {"t": 1012.6666666666666, "x": "そして11月9日。"}, {"t": 1014.4, "x": "ドーセット通りの奥、ミラーズ・コートという路地だ。"}, {"t": 1017.3666666666667, "x": "家主に頼まれて、ためた家賃を\n取り立てに来た男がいた。"}, {"t": 1021.1, "x": "家賃の取り立て？"}, {"t": 1022.3833333333333, "x": "ノックしても返事が無い。"}, {"t": 1023.7666666666667, "x": "戸には鍵がかかっていた。"}, {"t": 1025.4166666666667, "x": "窓のほうから中をのぞいて、5人目に気づいた。"}, {"t": 1028.3166666666666, "x": "メアリー・ジェーン・ケリー。"}, {"t": 1029.7666666666667, "x": "部屋の番号は13号だった。"}, {"t": 1031.6833333333334, "x": "5人のうち、ただ1人、\n自分の部屋の中で見つかった人だ。"}, {"t": 1035.7, "x": "外じゃなくて部屋の中で……。"}, {"t": 1037.4833333333333, "x": "そうだ。様子についてはここでは話さない。"}, {"t": 1040.2, "x": "うん。"}, {"t": 1041.3333333333333, "x": "この日、議会でも動きがあった。"}, {"t": 1043.4, "x": "ある議員が、夕刊で新しい事件を\n知ったと言って立ち上がった。"}, {"t": 1047.1166666666666, "x": "そして内務大臣に、ウォーレン総監を\n替えるべきではないかと質問した。"}, {"t": 1051.4666666666667, "x": "その場で？"}, {"t": 1052.6, "x": "その場でだ。でも議長に止められた。"}, {"t": 1054.8166666666666, "x": "「通常の手続きで質問の通告をしなさい」。"}, {"t": 1057.65, "x": "手続きが先なのね。"}, {"t": 1059.2166666666667, "x": "続けて別の議員が、ウォーレンはまだ\nサンクトペテルブルクにいるのかと聞いた。"}, {"t": 1063.6166666666666, "x": "ロシアに？"}, {"t": 1064.75, "x": "その質問の答えは記録に残っていない。"}, {"t": 1067.3, "x": "ただ、このとき総監はもう辞表を出していた。"}, {"t": 1070.1666666666667, "x": "えっ、もう？"}, {"t": 1071.2833333333333, "x": "それがいつだったかは、3日後の議会で明らかになる。"}, {"t": 1075.1166666666666, "x": "11月12日、ある議員が内務大臣に聞いた。"}, {"t": 1078.35, "x": "ウォーレン総監が辞表を出したという\n夕刊の記事は本当か。"}, {"t": 1081.7166666666667, "x": "大臣の答えはこうだ。"}, {"t": 1083.2, "x": "「総監は今月8日に辞表を出し、それは受理された」。"}, {"t": 1086.5833333333333, "x": "8日って、ケリーさんの事件の前の日じゃない。"}, {"t": 1089.4166666666667, "x": "そうだ。辞表は5人目の事件より先だった。"}, {"t": 1092.3833333333334, "x": "じゃあ、事件の責任を取って辞めたわけじゃないの？"}, {"t": 1095.4166666666667, "x": "少なくとも日付の上では5人目の前だ。"}, {"t": 1098.0333333333333, "x": "同じ8日の議会では、別の件で\n総監が問題になっていた。"}, {"t": 1101.95, "x": "別の件？"}, {"t": 1103.0833333333333, "x": "総監が、雑誌に警察の運営についての記事を\n書いていたんだ。"}, {"t": 1106.8833333333334, "x": "内務省には1879年から、許しなく部署のことを\n出版しないという決まりがあった。"}, {"t": 1112.6, "x": "大臣の答弁では、総監は\nその決まりを知らなかったという。"}, {"t": 1116.3, "x": "上とうまくいってなかったのね。"}, {"t": 1118.2166666666667, "x": "さらにこの年、\n警視庁の刑事部門のトップも辞めていた。"}, {"t": 1121.7666666666667, "x": "11月12日の答弁で、大臣は\n刑事部門の今の指揮についても説明している。"}, {"t": 1126.9833333333333, "x": "新しい責任者が、総監の監督の下で\n直接受け持っている、と。"}, {"t": 1131.5333333333333, "x": "刑事部門のトップまで替わってたの？"}, {"t": 1133.8, "x": "そうだ。事件のさなかに、\n捜査の上の人が次々に替わっていた。"}, {"t": 1137.9833333333333, "x": "その答弁で大臣はこうも言っている。"}, {"t": 1140.1333333333334, "x": "「ここまで捕まえられないのは、新しい\n組織や仕組みの欠陥のせいではない」。"}, {"t": 1144.4833333333333, "x": "「この残忍な犯行の、並外れた\n狡猾さと秘密性のせいだ」。"}, {"t": 1148.5833333333333, "x": "犯人がうますぎる、って言ったのね。"}, {"t": 1150.8333333333333, "x": "辞表を出したあと総監は新聞に手紙を寄せている。"}, {"t": 1153.85, "x": "その中で、法律に反するような\n指示を受けたこともあると書いた。"}, {"t": 1157.6833333333334, "x": "議会ではその指示は何だったのかと聞かれた。"}, {"t": 1160.35, "x": "大臣は「法律に反する\n指示を出したことは無い」と答えた。"}, {"t": 1164.15, "x": "やり取りの手紙も一部は秘密だとして出さなかった。"}, {"t": 1167.3833333333334, "x": "議員たちは納得したの？"}, {"t": 1169.1666666666667, "x": "総監と内務省のどちらの言い分が正しいか\n決めるために全部出すべきだという声もあった。"}, {"t": 1174.3666666666666, "x": "大臣は全部を出す必要は無いと答えている。"}, {"t": 1177.1166666666666, "x": "11月26日には、辞表を出した総監がまだ\n警察の規則に署名している、と質問が出た。"}, {"t": 1183.4333333333334, "x": "大臣の答えは、後任が決まるまで\n職務を続けている、だった。"}, {"t": 1187.4166666666667, "x": "新しい総監の任命が正式に\n決まったのは、11月の終わりだ。"}, {"t": 1191.7333333333333, "x": "……事件のさなかに、\n警察のトップと大臣がもめてたのね。"}, {"t": 1195.4, "x": "そういう時期だった、ということだけ\n記録に残っている。"}, {"t": 1199.2, "x": "同じ11月12日、もう一つ大事な答弁がある。"}, {"t": 1202.6833333333334, "x": "ある議員が、犯人を捕まえるための懸賞金を\n国が出さないのかと聞いた。"}, {"t": 1207.2333333333333, "x": "町の人が出したのに国は出してなかったの？"}, {"t": 1210.0833333333333, "x": "出していなかった。内務大臣は、\nいつもより長く理由を話した。"}, {"t": 1214.1, "x": "1884年より前は、内務省もよく懸賞金を出していた。"}, {"t": 1218.4666666666667, "x": "200ポンドから2000ポンドまで出した事件もあった。"}, {"t": 1221.4833333333333, "x": "アイルランドの大きな事件では、\n1万ポンドまで出した。"}, {"t": 1224.8333333333333, "x": "1万ポンド！"}, {"t": 1225.9833333333333, "x": "でもどれも役に立つ証拠は出てこなかったという。"}, {"t": 1228.75, "x": "それどころか、懸賞金めあてに無実の人を\n犯人に仕立てる企みまで起きた。"}, {"t": 1233.7, "x": "お金のためにうその犯人を？"}, {"t": 1235.6333333333334, "x": "そうだ。それで1884年に、懸賞金をやめると決めた。"}, {"t": 1239.8833333333334, "x": "当時の内務大臣が、イングランドと\nアイルランドの警察に意見を聞いて決めた。"}, {"t": 1244.4, "x": "その後も1885年と1886年に、別の事件で\n見直されたが、やめる方針は守られた。"}, {"t": 1251.5333333333333, "x": "じゃあ、例外は無いの？"}, {"t": 1253.0666666666666, "x": "大臣は例外もありうると言っている。"}, {"t": 1255.15, "x": "犯人が誰か分かっていて、隠れ\n場所だけを知りたいときなどだ。"}, {"t": 1258.8666666666666, "x": "この事件は、そのどれにも\n当てはまらない、という説明だった。"}, {"t": 1262.5166666666667, "x": "大臣は当時の結論をこう読み上げている。"}, {"t": 1265.0166666666667, "x": "「大きな懸賞金は役に立たないどころか害がある」。"}, {"t": 1267.95, "x": "「確かな証言よりうその証言を生みやすい」。"}, {"t": 1270.5833333333333, "x": "うその証言……。"}, {"t": 1271.7166666666667, "x": "そしてこの事件ではなおさらだと続けた。"}, {"t": 1274.2166666666667, "x": "「世の中が興奮している今は、\n無実の人が訴えられる危険が大きい」。"}, {"t": 1278.6, "x": "さっきの、誰かを疑う空気のことね。"}, {"t": 1281.2166666666667, "x": "そうだ。最後に大臣はこう言っている。"}, {"t": 1283.55, "x": "「内務省も警視庁もあらゆる手を尽くす」。"}, {"t": 1286.0833333333333, "x": "お金は出さないけど、手は尽くす、ってことね。"}, {"t": 1289.0, "x": "そのうえで大臣は自分の気持ちも口にしている。"}, {"t": 1291.8666666666666, "x": "「世の中の不安を静めたいのは分かっている」。"}, {"t": 1294.3333333333333, "x": "「当局が無関心ではない証しを目に\n見える形で示せたら、うれしかった」。"}, {"t": 1298.8833333333334, "x": "本当は何か目に見えることをしたかったのね。"}, {"t": 1301.65, "x": "答弁を読むかぎりでは、そう取れる。"}, {"t": 1304.4166666666667, "x": "その代わりに国が出したのが恩赦だ。"}, {"t": 1306.7833333333333, "x": "恩赦って、罪を許すこと？"}, {"t": 1308.7666666666667, "x": "そうだ。犯人を除いて、知っていることを\n話した仲間の罪を問わない。"}, {"t": 1313.05, "x": "ケリーの事件の翌日、11月10日に、\n警視庁が情報を求める公示を出した。"}, {"t": 1318.2, "x": "内務省の手紙と一緒にその記録が残っている。"}, {"t": 1321.25, "x": "でも前の4件は？"}, {"t": 1322.6666666666667, "x": "そこを議会でも聞かれた。"}, {"t": 1324.25, "x": "11月12日、ある議員が、恩赦は\n最後の事件にしか付いていないと指摘した。"}, {"t": 1329.3666666666666, "x": "そして11月23日、別の議員がはっきり聞いた。"}, {"t": 1332.9833333333333, "x": "前の事件にも恩赦を広げないのか。"}, {"t": 1335.3166666666666, "x": "大臣は何て？"}, {"t": 1336.55, "x": "訳すとこうだ。"}, {"t": 1337.6333333333334, "x": "「前の事件でも、役に立つと\n思えば恩赦を出す用意はある」。"}, {"t": 1341.05, "x": "「ケリーの件には、\n前の事件に無かった事情があった」。"}, {"t": 1344.1833333333334, "x": "「犯行のあとで誰かが手を貸した\n見込みが、より高かった」。"}, {"t": 1347.75, "x": "誰かが手を貸した……？"}, {"t": 1349.15, "x": "大臣はそう考えた、ということだ。"}, {"t": 1351.45, "x": "その「事情」が何だったのかは、\n答弁では言っていない。"}, {"t": 1355.0166666666667, "x": "中身は言わないのね。"}, {"t": 1356.4666666666667, "x": "言っていない。そして結局、\n恩赦を出しても犯人は捕まらなかった。"}, {"t": 1360.8166666666666, "x": "……手がかりにはならなかったのね。"}, {"t": 1362.75, "x": "少なくとも事件を解く決め手にはならなかった。"}, {"t": 1366.2, "x": "議会はこのころ、事件の背景にも目を向けていた。"}, {"t": 1369.3333333333333, "x": "最初に話した、簡易宿泊所だ。"}, {"t": 1371.8666666666666, "x": "一晩いくらの相部屋ね。"}, {"t": 1373.5833333333333, "x": "11月16日、ある議員が取り締まりを\n強めるべきではないかと聞いた。"}, {"t": 1378.0, "x": "見回りや登録、詰め込みすぎの部屋のことだ。"}, {"t": 1380.8666666666666, "x": "内務大臣は今の法律は十分に守られていると答えた。"}, {"t": 1384.3666666666666, "x": "ただ、衛生の見回りは強められるかも\nしれないと付け加えた。"}, {"t": 1388.1333333333334, "x": "そこで事件の話は出たの？"}, {"t": 1390.0833333333333, "x": "出た。別の議員がこう聞いている。"}, {"t": 1392.1333333333334, "x": "東部の恐ろしい事件の多くは、\n簡易宿泊所と関わっているのではないか。"}, {"t": 1396.6333333333334, "x": "宿のせいだって言いたいのね。"}, {"t": 1398.4333333333334, "x": "1週間後の11月22日、また同じ話が出た。"}, {"t": 1402.1333333333334, "x": "ある判事が、この地区の犯罪はみな\n宿泊所のせいだと言った、という質問だ。"}, {"t": 1407.0166666666667, "x": "大臣はそうだって言ったの？"}, {"t": 1408.8166666666666, "x": "言わなかった。警察の意見としてこう答えている。"}, {"t": 1411.8333333333333, "x": "「犯罪が簡易宿泊所のせいだとは言えない」。"}, {"t": 1414.4, "x": "「宿の持ち主はたいてい警察に協力してくれる」。"}, {"t": 1417.3833333333334, "x": "「ほかへ追いやるより、\n宿にいるほうが警察の目が届く」。"}, {"t": 1420.6666666666667, "x": "へえ、追い出すとかえって見えなくなるのね。"}, {"t": 1423.2166666666667, "x": "そうだ。5人のうち何人もが\n寝泊まりしていたのも、こういう宿だった。"}, {"t": 1427.4, "x": "宿を責めてもそこに泊まるしかない人は残る。"}, {"t": 1430.2833333333333, "x": "……その人たちの暮らしは、\n議会では深く話されなかったのね。"}, {"t": 1434.1166666666666, "x": "少なくともこの年の答弁にはあまり出てこない。"}, {"t": 1436.9833333333333, "x": "その前の日、11月21日にも、こんな質問が出ている。"}, {"t": 1441.1333333333334, "x": "夕刊に、ホワイトチャペルでまた女性が\n殺されたという記事があるが、本当か。"}, {"t": 1445.85, "x": "また？"}, {"t": 1446.9833333333333, "x": "答えたのは内務省の次官だった。"}, {"t": 1449.1166666666666, "x": "大臣がまもなく来るので、あとで\nもう一度聞いてほしいと言った。"}, {"t": 1452.7, "x": "議会でも、夕刊が出るたびに\n不安が走っていた、ということだ。"}, {"t": 1457.2, "x": "11月10日、警視庁のファイルにもう\n1通、重要な手紙が入っている。"}, {"t": 1461.7333333333333, "x": "警察医が書いた手紙だ。"}, {"t": 1463.5333333333333, "x": "お医者さんが？"}, {"t": 1464.65, "x": "ケリーの事件とそれまでの4件を比べた手紙だ。"}, {"t": 1467.6166666666666, "x": "そして、犯人がどういう人物と\n考えられるかの見立ても書いてある。"}, {"t": 1471.7666666666667, "x": "犯人像ね。何て書いてあったの？"}, {"t": 1474.1, "x": "中身の多くは体の傷の話になるから、\nここでは読まない。"}, {"t": 1477.9166666666667, "x": "そっか。"}, {"t": 1479.05, "x": "大事なのは、この手紙が「5件」を\nひとまとめにして比べていることだ。"}, {"t": 1483.45, "x": "ここで最初に言った「数え方」の話に戻る。"}, {"t": 1486.7333333333333, "x": "のちに数えられる、ってやつね。"}, {"t": 1488.6833333333334, "x": "「切り裂きジャックの被害者は5人」とよく言われる。"}, {"t": 1491.4666666666667, "x": "でもこれは事件当時に決まった数じゃない。"}, {"t": 1494.05, "x": "じゃあ、誰が決めたの？"}, {"t": 1495.6333333333334, "x": "はっきり「5人、5人だけ」と書いたのは、\nのちの警視庁幹部、マクノートンだ。"}, {"t": 1500.65, "x": "1894年のメモの中でだ。"}, {"t": 1503.2833333333333, "x": "6年もたってから？"}, {"t": 1504.7666666666667, "x": "そうだ。つまり「5人」は、\n1人の幹部の見立てなんだ。"}, {"t": 1508.5166666666667, "x": "みんなが認めた数じゃないのね。"}, {"t": 1510.55, "x": "そうだ。そして警視庁のファイルそのものは、\n5人で終わっていない。"}, {"t": 1515.0166666666667, "x": "国立公文書館に、警視庁の\n「ホワイトチャペル殺人事件」のファイルがある。"}, {"t": 1519.9, "x": "その目録を引いてみた。"}, {"t": 1521.6166666666666, "x": "中には何が入ってるの？"}, {"t": 1523.3833333333334, "x": "5人の件だけじゃない。"}, {"t": 1524.7833333333333, "x": "5人より前、1888年8月7日の別の女性の件も\n入っている。"}, {"t": 1530.0, "x": "一番あとは、1891年2月13日の件だ。"}, {"t": 1534.1166666666666, "x": "1891年って、3年もあと？"}, {"t": 1537.1, "x": "そうだ。5人目の事件から2年以上あとだ。"}, {"t": 1539.8166666666666, "x": "公文書館の解説にもこう書いてある。"}, {"t": 1542.1833333333334, "x": "「5人の前後の数か月に、少なくとも\n3件、同じ人物ではないかと\n言われるほどの事件があった」。"}, {"t": 1548.2666666666667, "x": "じゃあ、本当は5人じゃないかもしれないの？"}, {"t": 1550.85, "x": "それも分からない。"}, {"t": 1551.9666666666667, "x": "同じ人物だという証拠も、\n別人だという証拠も無いからだ。"}, {"t": 1555.8166666666666, "x": "数さえ決まってないのね。"}, {"t": 1557.5, "x": "そうだ。犯人の名前だけじゃなく、\n何件だったのかも確かめられていない。"}, {"t": 1561.95, "x": "確かなのは、警察がこれだけの件を\n同じファイルにとじて追っていたことだ。"}, {"t": 1566.3166666666666, "x": "ファイルの中身は警察の報告だけじゃない。"}, {"t": 1568.8666666666666, "x": "新聞の切り抜きも入っている。"}, {"t": 1570.75, "x": "中には、アメリカのフィラデルフィアの\n新聞の切り抜きまである。"}, {"t": 1574.35, "x": "アメリカの新聞まで警視庁がとってたの？"}, {"t": 1576.9833333333333, "x": "海の向こうでどう書かれているかまで、\n集めていたということだ。"}, {"t": 1580.5833333333333, "x": "一つの束に何年分も。"}, {"t": 1582.5, "x": "そうだ。そしてそのどれにも、\n犯人の名前は書かれていない。"}, {"t": 1586.7666666666667, "x": "ねえ、結局あの最初の手紙は誰が書いたの？"}, {"t": 1589.7666666666667, "x": "それも分かっていない。ただ、\n警察の中には見立てがあった。"}, {"t": 1593.3666666666666, "x": "さっきのマクノートンは回想録にこう書いている。"}, {"t": 1596.1166666666666, "x": "「あのおぞましい手紙には、記者の汚れた\n人さし指が見える気がしていた」。"}, {"t": 1600.3666666666666, "x": "記者？"}, {"t": 1601.5, "x": "そうだ。そして続けてこう書いた。"}, {"t": 1603.65, "x": "「誰が書いたにせよ、あの殺人を犯した\n者でないことは、私には確かだ」。"}, {"t": 1608.4, "x": "警察の幹部が犯人じゃないって言ってるのね。"}, {"t": 1611.2166666666667, "x": "別の元幹部も、1913年の手紙で\n同じことを書いている。"}, {"t": 1615.5, "x": "警視庁では、あの名前を考えたのは\n通信社の記者だと広く思われていた。"}, {"t": 1620.0666666666666, "x": "そして「記者として気の利いた\n仕事だった」とまで書いた。"}, {"t": 1623.5833333333333, "x": "さらにこうも書いている。"}, {"t": 1624.9666666666667, "x": "「私のいた頃、警視庁からあれほど特別な\n扱いを受けた記者はほかにいない」。"}, {"t": 1629.7166666666667, "x": "警察の中に出入りしてた記者なのね。"}, {"t": 1632.2166666666667, "x": "そういうことになる。"}, {"t": 1633.5333333333333, "x": "……名前を付けたのが記者？"}, {"t": 1635.1833333333334, "x": "そう思われていた、ということだ。"}, {"t": 1637.0, "x": "決まったわけじゃない。"}, {"t": 1638.2333333333333, "x": "誰だったのかは本や番組でいろいろ言われてきた。"}, {"t": 1641.0833333333333, "x": "でもこの回では記者の名前も出さない。"}, {"t": 1643.3666666666666, "x": "証拠で決まった話ではないからだ。"}, {"t": 1645.6666666666667, "x": "考えてみると、手紙が届いたのも\n警察じゃなく通信社だったわね。"}, {"t": 1649.9666666666667, "x": "そこに目をつけた人もいる。"}, {"t": 1651.7, "x": "一般の人なら新聞社か警察に送りそうなものだ。"}, {"t": 1654.9833333333333, "x": "記事を新聞社に売る通信社を宛先に\n選ぶのは、業界の人らしい、という見方だ。"}, {"t": 1660.2, "x": "なるほど。でもそれも見方の一つなのね。"}, {"t": 1662.95, "x": "逆の見方もある。"}, {"t": 1664.1666666666667, "x": "手紙の「ボス」などの言い回しは、\n当時アメリカ風の言葉づかいだと指摘されてきた。"}, {"t": 1669.4, "x": "ロンドンの記者らしくない、とも読める。"}, {"t": 1671.7333333333333, "x": "どっちにも取れるのね。"}, {"t": 1673.2333333333333, "x": "そうだ。犯人と同じで手紙の書き手にも名前が無い。"}, {"t": 1677.15, "x": "ここで、1894年のマクノートンのメモを\nもう少し見ておく。"}, {"t": 1681.3333333333333, "x": "メモには、事件のまとめと、\n疑われた男たちのことが書いてある。"}, {"t": 1685.45, "x": "そもそもこのメモは、ある新聞への反論として\n書かれた。"}, {"t": 1688.9, "x": "その新聞は、別の事件で捕まったある男が\n切り裂きジャックだ、と書き立てていた。"}, {"t": 1693.9833333333333, "x": "メモは、その記事の誤りを\n一つずつ挙げて打ち消している。"}, {"t": 1697.5666666666666, "x": "新聞が名指しして警察が打ち消したのね。"}, {"t": 1700.3666666666666, "x": "そうだ。ここでも「この人が犯人だ」という\n話が先に走っていた。"}, {"t": 1704.9666666666667, "x": "容疑者の名前もあるの？"}, {"t": 1706.6, "x": "ある。3人の名前が書いてある。"}, {"t": 1708.7333333333333, "x": "誰？"}, {"t": 1709.8666666666666, "x": "この回では読み上げない。"}, {"t": 1711.4166666666667, "x": "どうして？"}, {"t": 1712.55, "x": "同じメモにこういう一行があるからだ。"}, {"t": 1714.7666666666667, "x": "訳すとこうだ。"}, {"t": 1715.85, "x": "「ホワイトチャペルの殺人者を見た\n者は一人もいない」。"}, {"t": 1718.85, "x": "「多くの者が疑われたが、誰一人について、\n証拠の影すら示せなかった」。"}, {"t": 1723.7333333333333, "x": "証拠の影すら……。"}, {"t": 1725.0333333333333, "x": "名前を挙げた本人が証拠は無いと書いているんだ。"}, {"t": 1727.9666666666667, "x": "名前だけがひとり歩きしちゃうわね。"}, {"t": 1730.2, "x": "そうだ。このメモのあとも、\n何十年にもわたって新しい説が出てきた。"}, {"t": 1734.5666666666666, "x": "2019年には学術誌にこういう論文も出た。"}, {"t": 1737.6333333333334, "x": "現場にあったとされる布を調べ、遺伝子から\n犯人を特定した、という内容だ。"}, {"t": 1742.6, "x": "えっ、じゃあ分かったの？"}, {"t": 1744.15, "x": "いや、専門家からは批判が多い。"}, {"t": 1746.3, "x": "その布が本当に現場にあったという証拠が無い。"}, {"t": 1749.15, "x": "調べた種類の遺伝子は、同じ型の人が\n何千人もいることがある。"}, {"t": 1753.2666666666667, "x": "データの出し方も足りない、という声があった。"}, {"t": 1756.0333333333333, "x": "決め手にはならない、ってことね。"}, {"t": 1758.0666666666666, "x": "そうだ。だからこの回ではその名前も出さない。"}, {"t": 1761.5, "x": "名前が分からない理由の一つは、\n紙そのものが減っていったことだ。"}, {"t": 1765.5666666666666, "x": "紙が減る？"}, {"t": 1766.7, "x": "最初に届いた、赤いインクの手紙だ。"}, {"t": 1769.15, "x": "1928年までに警察の公式の書類から消えていた。"}, {"t": 1773.3166666666666, "x": "事件から40年でもう無くなってたの？"}, {"t": 1775.8666666666666, "x": "そうだ。誰がいつ持ち出したのか、記録は無い。"}, {"t": 1778.7833333333333, "x": "ポストカードの原物も行方不明だ。"}, {"t": 1781.0333333333333, "x": "ラスクの家に届いた手紙も行方不明だ。"}, {"t": 1783.5666666666666, "x": "壁のチョークの文字はその朝のうちに消された。"}, {"t": 1786.35, "x": "残ってるのは写しばっかりね。"}, {"t": 1788.3333333333333, "x": "そうだ。そしてファイルの束そのものも欠けている。"}, {"t": 1791.2166666666667, "x": "国立公文書館の目録にこういう注意書きがある。"}, {"t": 1794.3666666666666, "x": "「33枚目から135枚目まで、\n1983年12月19日に紛失と報告」。"}, {"t": 1800.85, "x": "100枚以上？"}, {"t": 1801.9833333333333, "x": "100枚を超える。中身は、\n容疑者についての請願と懸賞金の申し出の束だ。"}, {"t": 1807.0, "x": "……そこに何が書いてあったんだろう。"}, {"t": 1809.0, "x": "欠けた束の中身を知る手がかりは今のところ無い。"}, {"t": 1811.85, "x": "この事件を追う人たちは、欠けた\n束と写しの紙で考えるしかない。"}, {"t": 1816.0833333333333, "x": "名前が出ないのも仕方ないのかも。"}, {"t": 1818.2666666666667, "x": "ただ、消えた紙の中には戻ってきた物もある。"}, {"t": 1821.85, "x": "1987年11月。"}, {"t": 1824.2333333333333, "x": "ロンドン警視庁に、\n差出人の分からない茶封筒が届いた。"}, {"t": 1827.9666666666667, "x": "消印はロンドンの南のクロイドンだった。"}, {"t": 1830.5333333333333, "x": "中には？"}, {"t": 1831.6666666666667, "x": "あの「親愛なるボスへ」の手紙が入っていた。"}, {"t": 1834.7166666666667, "x": "えっ、戻ってきたの？"}, {"t": 1836.3166666666666, "x": "戻ってきた。通信社の添え状、\n最初の封筒も一緒だった。"}, {"t": 1840.1666666666667, "x": "ほかの関係書類も入っていた。"}, {"t": 1842.3, "x": "誰が送ってきたの？"}, {"t": 1843.7833333333333, "x": "それが分からない。差出人の名前は無かった。"}, {"t": 1846.8333333333333, "x": "始まりも、名前の分からない人からの手紙だったわね。"}, {"t": 1850.3666666666666, "x": "そうだ。戻ってきたときも、\n名前の分からない誰かからだった。"}, {"t": 1854.2166666666667, "x": "1888年に届いてから、1987年に戻るまで99年だ。"}, {"t": 1860.05, "x": "99年……。"}, {"t": 1861.1833333333334, "x": "今、手紙はロンドン郊外のキューにある\n国立公文書館に収められている。"}, {"t": 1865.55, "x": "紙は端が欠けて、折り目には\nテープで補修した跡がある。"}, {"t": 1868.9166666666667, "x": "赤鉛筆の追伸はもうほとんど読めないそうだ。"}, {"t": 1871.8, "x": "100年もあちこちを渡ってきたのね。"}, {"t": 1874.1166666666666, "x": "国立公文書館の目録には短くこう書いてある。"}, {"t": 1877.3666666666666, "x": "「1987年11月、差出人不明で\nロンドン警視庁に送られてきた書類」。"}, {"t": 1883.05, "x": "送り主は最後まで分からないまま？"}, {"t": 1885.2833333333333, "x": "分からないままだ。事件の名前を作った\n手紙は、行きも帰りも名無しだった。"}, {"t": 1890.5666666666666, "x": "ねえ、話を聞いてて思ったんだけど。"}, {"t": 1892.9833333333333, "x": "何だ？"}, {"t": 1894.1166666666666, "x": "犯人の名前は分からない。"}, {"t": 1895.6, "x": "手紙の書き手も分からない。"}, {"t": 1897.3166666666666, "x": "送り返した人も分からない。"}, {"t": 1899.25, "x": "手紙の道のりを日付で並べておくか。"}, {"t": 1901.6666666666667, "x": "1888年9月27日、通信社に届く。"}, {"t": 1905.7166666666667, "x": "2日後の9月29日、冗談として扱われたまま警視庁へ。"}, {"t": 1909.8833333333334, "x": "10月4日、筆跡が新聞に載り警察署に貼られる。"}, {"t": 1913.4666666666667, "x": "そして1928年までには行方が分からなくなる。"}, {"t": 1917.0166666666667, "x": "1987年11月、差出人不明の茶封筒で戻ってくる。"}, {"t": 1921.9166666666667, "x": "どの場面にも名前の分かる送り主がいないのね。"}, {"t": 1924.9, "x": "そうだな。"}, {"t": 1926.0166666666667, "x": "でも亡くなった人たちの名前は分かってるのよね。"}, {"t": 1929.0166666666667, "x": "分かっている。"}, {"t": 1930.15, "x": "メアリー・アン・ニコルズ。"}, {"t": 1931.5333333333333, "x": "アニー・チャップマン。"}, {"t": 1932.7833333333333, "x": "エリザベス・ストライド。"}, {"t": 1934.1833333333334, "x": "キャサリン・エドウズ。"}, {"t": 1935.4833333333333, "x": "メアリー・ジェーン・ケリー。"}, {"t": 1936.9166666666667, "x": "国立公文書館の解説は、\nこの5人の名前を一人ずつ挙げている。"}, {"t": 1941.2833333333333, "x": "犯人の呼び名だけじゃなくて？"}, {"t": 1943.2166666666667, "x": "そうだ。解説はこうも書いている。"}, {"t": 1945.3166666666666, "x": "「最初から関心は殺人者に向けられ、\n被害者は脇に追いやられた」。"}, {"t": 1949.5, "x": "……今の私たちも名前のほうばかり覚えてたかも。"}, {"t": 1952.4666666666667, "x": "138年たった今も、本当の名前が\n分からないのは犯人のほうだ。"}, {"t": 1957.0, "x": "「切り裂きジャック」は、誰かが\n手紙に書いた通り名でしかない。"}, {"t": 1960.65, "x": "それを書いたのが誰かも確かめられていない。"}, {"t": 1963.3, "x": "名前があるみたいで無いのね。"}, {"t": 1965.0666666666666, "x": "そうだ。記録の上で名前が\nはっきりしているのは、5人のほうだ。"}, {"t": 1968.8833333333334, "x": "宿の寝床代を気にしていた人がいた。"}, {"t": 1971.2833333333333, "x": "季節の仕事から帰ってきたばかりの人がいた。"}, {"t": 1974.2, "x": "かつては家族と暮らしていた人もいた。"}, {"t": 1976.7166666666667, "x": "一人ひとりに暮らしがあったのね。"}, {"t": 1978.85, "x": "1888年9月27日、通信社に届いた赤いインクの手紙。"}, {"t": 1983.8833333333334, "x": "そこに書かれた名前は今も世界中で知られている。"}, {"t": 1986.8, "x": "ただ、それは犯人の名前じゃない。"}, {"t": 1988.9166666666667, "x": "今回は、その名前の出どころを\n紙の記録で追った回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
