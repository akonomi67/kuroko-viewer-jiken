<script>
const D={"name": "134", "file": "134_編集用", "dur": 1985.51665625, "segs": [], "subs": [{"t": 0.0, "x": "1888年9月27日。"}, {"t": 2.7333333333333334, "x": "イギリスのロンドン。"}, {"t": 3.9166666666666665, "x": "ある会社の郵便受けに、1通の封筒が届いた。"}, {"t": 7.0, "x": "宛名は「ボスへ。セントラル・ニューズ社」。"}, {"t": 9.7, "x": "セントラル・ニューズ？"}, {"t": 11.116666666666667, "x": "新聞社に記事を売る、通信社だ。"}, {"t": 13.333333333333334, "x": "中の便箋は赤いインクで両面にびっしり書いてあった。"}, {"t": 16.45, "x": "書き出しは「親愛なるボスへ」。"}, {"t": 18.4, "x": "そして最後にこう署名してあった。"}, {"t": 20.466666666666665, "x": "「切り裂きジャック」。"}, {"t": 21.65, "x": "えっ、あの名前って、手紙の署名だったの？"}, {"t": 24.55, "x": "そうだ。この名前が紙に書かれた最初の記録がこれだ。"}, {"t": 27.933333333333334, "x": "ここで数字を一つ出しておく。"}, {"t": 29.8, "x": "この手紙から数えて今年で138年になる。"}, {"t": 33.05, "x": "その138年のあいだ、犯人の本当の名前は\n一度も確かめられていない。"}, {"t": 38.11666666666667, "x": "じゃあ、ジャックっていうのは？"}, {"t": 39.766666666666666, "x": "誰かが付けた呼び名だ。"}, {"t": 41.3, "x": "しかもその手紙を犯人が書いたという強い証拠は無い。"}, {"t": 44.63333333333333, "x": "犯人じゃない人が、\n犯人の名前を付けたかもしれないってこと？"}, {"t": 48.61666666666667, "x": "その可能性を当時の警察の幹部が書き残している。"}, {"t": 51.85, "x": "今回は、この「名前」が\nどこから来たのかを紙の記録で追う。"}, {"t": 55.75, "x": "届いた手紙、警察の報告、\nそしてイギリス議会の記録だ。"}, {"t": 59.85, "x": "手紙と警察と議会ね。"}, {"t": 61.68333333333333, "x": "先に一つだけ。亡くなった\n女性たちの様子は話さない。"}, {"t": 65.25, "x": "容疑者とされた人の名前も一人も出さない。"}, {"t": 68.6, "x": "舞台はロンドンの東のはずれ、\nホワイトチャペルという地区だ。"}, {"t": 72.21666666666667, "x": "どんな町だったの？"}, {"t": 73.6, "x": "イギリスの国立公文書館は、国で最も\n貧しい地区の一つだったと書いている。"}, {"t": 78.53333333333333, "x": "家を持たない人たちは簡易宿泊所に泊まった。"}, {"t": 81.56666666666666, "x": "簡易宿泊所って、安い宿のこと？"}, {"t": 84.16666666666667, "x": "一晩いくらで寝床を借りる宿だ。"}, {"t": 86.26666666666667, "x": "何人もが同じ部屋で寝る相部屋だった。"}, {"t": 88.66666666666667, "x": "その日の寝床代を払えなければ、\n外で夜を明かすことになる。"}, {"t": 92.56666666666666, "x": "毎晩、その日のお金を作らないといけないのね。"}, {"t": 95.61666666666666, "x": "そういう暮らしをしていた人が、\nこの地区にはたくさんいた。"}, {"t": 98.93333333333334, "x": "公文書館の解説によると亡くなった5人もそうだった。"}, {"t": 102.31666666666666, "x": "5人とも決まった住まいも決まった収入も無かった。"}, {"t": 105.46666666666667, "x": "5人っていうのは？"}, {"t": 106.75, "x": "1888年の8月から11月にかけて\n亡くなった5人の女性だ。"}, {"t": 111.76666666666667, "x": "のちに「切り裂きジャック」の事件として数えられる。"}, {"t": 114.91666666666667, "x": "当時の新聞の多くは、この5人を\n売春婦だと決めつけて書いた。"}, {"t": 118.98333333333333, "x": "本当にそうだったの？"}, {"t": 120.46666666666667, "x": "公文書館は、警察にそうと知られていた\n人は一人もいないと書いている。"}, {"t": 124.81666666666666, "x": "宿の掃除をして稼いでいた人がいた。"}, {"t": 127.18333333333334, "x": "田舎の畑へ、季節の働き手として出ていた人もいた。"}, {"t": 130.85, "x": "5人とも、かつては決まった\n仕事を持っていた時期があった。"}, {"t": 134.26666666666668, "x": "結婚していた人も子どもがいた人もいた。"}, {"t": 137.06666666666666, "x": "最初からその暮らしだったわけじゃないのね。"}, {"t": 139.66666666666666, "x": "そうだ。それぞれに、あの地区に\nたどり着くまでの事情があった。"}, {"t": 143.93333333333334, "x": "最初の事件は、1888年8月31日の未明だ。"}, {"t": 148.55, "x": "場所はバックス・ロウという細い通り。"}, {"t": 150.85, "x": "仕事へ向かう荷馬車の御者が、\n道ばたに倒れている女性を見つけた。"}, {"t": 154.91666666666666, "x": "明かりは、通りの端にある\nガス灯が1つだけだったという。"}, {"t": 158.46666666666667, "x": "朝早くに通りがかった人が見つけたのね。"}, {"t": 161.28333333333333, "x": "亡くなっていたのは、メアリー・\nアン・ニコルズ。43歳だった。"}, {"t": 165.31666666666666, "x": "その夜、彼女は宿の台所にいた。"}, {"t": 167.75, "x": "でも寝床代が払えずに外へ出された。"}, {"t": 170.28333333333333, "x": "寝床代って、いくらだったの？"}, {"t": 172.36666666666667, "x": "彼女が少し前まで泊まっていた\n宿の相部屋は、一晩4ペンスだった。"}, {"t": 176.81666666666666, "x": "4ペンスって、今だとどれくらい？"}, {"t": 179.05, "x": "今のお金に直す確かな\n物差しは無いから、ここでは言わない。"}, {"t": 182.68333333333334, "x": "ただ、それが払えない夜があった、ということだ。"}, {"t": 185.65, "x": "出ていくとき、彼女は宿の者に\n寝床を取っておいてと頼んだという。"}, {"t": 189.7, "x": "すぐ戻るつもりだったのね。"}, {"t": 191.53333333333333, "x": "そうだ。でも戻ってこなかった。"}, {"t": 193.55, "x": "このとき警察はまだ一つの事件として調べていた。"}, {"t": 196.93333333333334, "x": "まだ、続けて起きるとは思ってなかったの？"}, {"t": 199.68333333333334, "x": "同じ地区では、それまでにも\n女性が襲われる事件があった。"}, {"t": 203.13333333333333, "x": "つながっているのかどうか、決め手は無かった。"}, {"t": 205.73333333333332, "x": "ただ、この事件はのちに\n一続きの1件目として数えられることになる。"}, {"t": 210.18333333333334, "x": "のちにね。"}, {"t": 211.06666666666666, "x": "そうだ。その数え方の話はあとでもう一度する。"}, {"t": 214.81666666666666, "x": "8日後の9月8日。"}, {"t": 216.26666666666668, "x": "ハンベリー通り29番地の家の裏庭で、\n2人目が見つかった。"}, {"t": 220.2, "x": "見つけたのは同じ家に住む荷馬車の御者だ。"}, {"t": 222.83333333333334, "x": "午前6時になる少し前だった。"}, {"t": 225.06666666666666, "x": "自分の住んでいる家の裏庭で？"}, {"t": 227.08333333333334, "x": "そうだ。亡くなっていたのはアニー・チャップマン。"}, {"t": 229.7, "x": "ここから町の空気が大きく変わった。"}, {"t": 232.08333333333334, "x": "どう変わったの？"}, {"t": 233.21666666666667, "x": "住民が自分たちで見回りの会を作った。"}, {"t": 235.85, "x": "ホワイトチャペル自警委員会だ。"}, {"t": 237.68333333333334, "x": "会長になったのはジョージ・ラスクという男だ。"}, {"t": 240.63333333333333, "x": "警察に任せておけない、ってこと？"}, {"t": 242.96666666666667, "x": "そういう気持ちが強かったんだろう。"}, {"t": 244.95, "x": "町の人の中からも、自分で\n懸賞金を出すと申し出る人が出た。"}, {"t": 249.21666666666667, "x": "その申し出のやり取りは、\nロンドン警視庁のファイルに残っている。"}, {"t": 252.88333333333333, "x": "日付は9月10日から19日だ。"}, {"t": 255.25, "x": "自分で懸賞金を？"}, {"t": 256.75, "x": "そうだ。理由について、警視庁のトップが\nのちに報告を書いている。"}, {"t": 260.78333333333336, "x": "町ではある民族の人たちが疑われはじめていた。"}, {"t": 263.8833333333333, "x": "その人たちへの反感をそらす\n狙いがあったのだろう、という見立てだ。"}, {"t": 267.95, "x": "事件のせいで関係ない人が疑われていたのね。"}, {"t": 271.01666666666665, "x": "この「誰かを疑う空気」は、\nこのあとの話にも何度も出てくる。"}, {"t": 275.8666666666667, "x": "さてここで最初の手紙に戻る。"}, {"t": 277.8833333333333, "x": "2人目の事件から19日後、9月27日。"}, {"t": 281.1666666666667, "x": "通信社に届いた、あの封筒だ。"}, {"t": 283.35, "x": "消印は9月27日。便箋に\n書かれた日付は9月25日だった。"}, {"t": 288.2, "x": "書いてから2日後に届いたのね。"}, {"t": 290.3666666666667, "x": "中身を言える範囲で訳しておく。"}, {"t": 292.28333333333336, "x": "「警察が俺を捕まえたと聞くがまだ捕まらない」。"}, {"t": 295.15, "x": "「この手紙は、俺がもう少し仕事をするまで\n取っておいて、それから出してくれ」。"}, {"t": 299.81666666666666, "x": "取っておいてから出せ？"}, {"t": 301.26666666666665, "x": "そう頼んでいる。新聞に出す\n時期まで指図しているんだ。"}, {"t": 304.6166666666667, "x": "最後に署名があって、その横にこう書き足してある。"}, {"t": 307.73333333333335, "x": "「商売用の名前を名乗るのを悪く思うな」。"}, {"t": 310.3, "x": "商売用の名前……。"}, {"t": 311.65, "x": "そう。「切り裂きジャック」は、\n自分で決めた通り名だと言っている。"}, {"t": 315.4, "x": "追伸は赤鉛筆で横向きに書かれていた。"}, {"t": 318.03333333333336, "x": "「今度は医者だと言われている、ははは」。"}, {"t": 320.4, "x": "……ふざけてるわね。"}, {"t": 321.6, "x": "本文にはここで読めない残酷な言葉も並んでいる。"}, {"t": 324.7, "x": "そこは今回、読まない。"}, {"t": 326.45, "x": "そのほうがいいわ。"}, {"t": 327.6, "x": "大事なのは、この時点ではまだ誰も、\nこの名前を知らなかったことだ。"}, {"t": 331.9, "x": "まだ新聞にも出てないものね。"}, {"t": 333.8833333333333, "x": "名前を知っていたのは、手紙を書いた人と、\nそれを開けた通信社の人だけだった。"}, {"t": 339.3833333333333, "x": "通信社の人はすぐに警察に届けたの？"}, {"t": 342.21666666666664, "x": "いや、すぐには届けていない。"}, {"t": 344.05, "x": "最初は冗談だと思われていた。"}, {"t": 346.1333333333333, "x": "冗談？"}, {"t": 346.85, "x": "こういう手紙はほかにも来ていたからな。"}, {"t": 349.1333333333333, "x": "実はこの手紙は犯人を名乗った最初の手紙でもない。"}, {"t": 352.4, "x": "9月24日の日付で、ウォーレン総監あてに\n届いた手紙が先にあった。"}, {"t": 356.9166666666667, "x": "総監というのはロンドン警視庁のトップのことだ。"}, {"t": 359.93333333333334, "x": "じゃあ、通信社の手紙は2番目？"}, {"t": 362.18333333333334, "x": "少なくとも記録の上ではそうなる。"}, {"t": 364.3, "x": "ただ「切り裂きジャック」と署名したのは、\n通信社の手紙が最初だった。"}, {"t": 368.75, "x": "警察に回されたのは2日後、9月29日だ。"}, {"t": 372.05, "x": "通信社の編集者が添え状をつけて送った。"}, {"t": 374.81666666666666, "x": "添え状の中身はこうだ。"}, {"t": 376.31666666666666, "x": "「同封のものは2日前に当社に届いたもので、\n冗談として扱っていました」。"}, {"t": 381.1666666666667, "x": "本当に冗談だと思ってたのね。"}, {"t": 383.3666666666667, "x": "そうだ。警察の側もすぐに大騒ぎはしていない。"}, {"t": 386.35, "x": "ところがその翌日。"}, {"t": 387.9166666666667, "x": "翌日って、9月30日？"}, {"t": 390.1666666666667, "x": "そうだ。この日、ひと晩のうちに2つの事件が起きた。"}, {"t": 393.75, "x": "ひと晩に2つ？"}, {"t": 395.05, "x": "手紙が警察に届いた次の夜だ。"}, {"t": 397.3833333333333, "x": "「もう少し仕事をするまで取っておいてくれ」と\n書いた手紙の、すぐあとだった。"}, {"t": 401.95, "x": "……それで手紙の見られ方が変わったのね。"}, {"t": 404.4, "x": "そうだ。冗談として2日しまわれていた\n手紙が、急に重くなった。"}, {"t": 408.5833333333333, "x": "ただ、ここで一つ押さえておきたい。"}, {"t": 410.76666666666665, "x": "重くなったのは、手紙の中身が\n確かめられたからじゃない。"}, {"t": 414.2, "x": "起きた時期が重なったからだ。"}, {"t": 416.18333333333334, "x": "時期が重なっただけ、ってことね。"}, {"t": 418.95, "x": "9月30日、午前1時ごろ。"}, {"t": 421.1666666666667, "x": "バーナー通りの奥にある、\nダットフィールド・ヤードという中庭。"}, {"t": 424.71666666666664, "x": "荷馬車で戻ってきた行商人の馬が、\n入口でおびえて進まなくなった。"}, {"t": 429.25, "x": "馬が？"}, {"t": 429.95, "x": "暗くて何があるのか見えなかったそうだ。"}, {"t": 432.3, "x": "そこで見つかったのが、\nエリザベス・ストライドだった。"}, {"t": 435.55, "x": "そしてそれから45分ほどあと。"}, {"t": 437.7, "x": "場所はマイター・スクエアという広場だ。"}, {"t": 439.98333333333335, "x": "午前1時44分、巡回中の巡査がもう1人を見つけた。"}, {"t": 443.98333333333335, "x": "キャサリン・エドウズだ。"}, {"t": 445.45, "x": "本当にひと晩のうちなのね。"}, {"t": 447.43333333333334, "x": "エドウズはその夜の早い時間に警察署にいた。"}, {"t": 450.3833333333333, "x": "警察署に？"}, {"t": 451.46666666666664, "x": "酔って道で倒れていて保護されていたんだ。"}, {"t": 453.8833333333333, "x": "酔いがさめたとして午前1時ごろに署から出された。"}, {"t": 456.8666666666667, "x": "それから1時間たたないうちに広場で見つかった。"}, {"t": 459.9166666666667, "x": "……警察署を出た、すぐあとだったのね。"}, {"t": 462.3666666666667, "x": "そしてこの広場は、\nロンドン警視庁の管轄じゃなかった。"}, {"t": 465.98333333333335, "x": "どういうこと？"}, {"t": 467.0, "x": "ロンドンの真ん中の「シティ」は、\n別のシティ警察が受け持っている。"}, {"t": 471.03333333333336, "x": "マイター・スクエアはその中にあった。"}, {"t": 473.25, "x": "つまりこの晩から、2つの警察が\n同じ事件を追うことになった。"}, {"t": 477.3333333333333, "x": "警察が2つ……。足並みはそろったの？"}, {"t": 479.9, "x": "その答えに近い出来事が、\nこの同じ夜の明け方に起きている。"}, {"t": 484.35, "x": "午前2時55分。"}, {"t": 485.68333333333334, "x": "ゴールストン通りの共同住宅の入口で、\n巡査が布切れを見つけた。"}, {"t": 489.9166666666667, "x": "マイター・スクエアの件に関わるとみられた布だ。"}, {"t": 492.8666666666667, "x": "そして、その上の壁に、\nチョークで一文が書いてあった。"}, {"t": 496.3666666666667, "x": "何て書いてあったの？"}, {"t": 497.8, "x": "ユダヤ人を名指しする一文だ。"}, {"t": 499.71666666666664, "x": "つづりがおかしくて意味もはっきりしない。"}, {"t": 501.93333333333334, "x": "ただ、読んだ人がユダヤ人を\n疑うように取れる文だった。"}, {"t": 505.5, "x": "さっきの、誰かを疑う空気ね。"}, {"t": 507.78333333333336, "x": "そうだ。夜明け前に、\n警視庁のトップが自分で現場へ来た。"}, {"t": 511.43333333333334, "x": "チャールズ・ウォーレン総監だ。"}, {"t": 513.1833333333333, "x": "そして写しを取ったうえでその文字を消させた。"}, {"t": 515.95, "x": "えっ、消しちゃったの？"}, {"t": 517.45, "x": "消した。ただ、反対の声もあった。"}, {"t": 519.8666666666667, "x": "シティ警察の刑事部長が写真に撮れと命じていた。"}, {"t": 523.0, "x": "問題の部分だけ消して、残りを\n写真に撮る案も出たという。"}, {"t": 526.6, "x": "でもその通りはロンドン警視庁の管轄だった。"}, {"t": 529.45, "x": "最後に決めるのは警視庁の側だった。"}, {"t": 531.9166666666666, "x": "手がかりかもしれないのに？"}, {"t": 533.6166666666667, "x": "ウォーレンは11月6日の報告で、\n理由を書き残している。"}, {"t": 537.2333333333333, "x": "訳すとこうだ。"}, {"t": 538.3166666666667, "x": "「あの文字を残しておけば、ユダヤ人への襲撃が\n起き、家は壊され、命もおそらく失われていた」。"}, {"t": 544.3, "x": "……暴動になると思ったのね。"}, {"t": 546.1, "x": "報告にはもう一つ出来事が書き添えてある。"}, {"t": 548.8, "x": "事件から13日後、ユダヤ教の聖職者の代表が\n総監に手紙を書いた。"}, {"t": 553.5666666666667, "x": "ある新聞が、壁の文字のつづりは\nユダヤ人の書き方だと書いたからだ。"}, {"t": 557.75, "x": "それを打ち消さないと、貧しい\nユダヤ人の身が危ない、という手紙だった。"}, {"t": 562.0666666666667, "x": "13日たってもそんなに張りつめてたのね。"}, {"t": 564.8833333333333, "x": "総監は、つづり一つでこうなら、文字が\n残っていたらどうなったかと書いている。"}, {"t": 569.4666666666667, "x": "日曜の朝でまもなく通りは人であふれる時刻だった。"}, {"t": 572.7333333333333, "x": "その通りはユダヤ人の露天商でにぎわう場所だった。"}, {"t": 575.8666666666667, "x": "残すのも危ない、消すのも手がかりを失う……。"}, {"t": 578.7, "x": "どちらを取るべきだったか、ここで答えは出さない。"}, {"t": 581.6, "x": "はっきりしているのは、この一文も\n写しの紙しか残らなかったことだ。"}, {"t": 586.4333333333333, "x": "10月1日、2つの事件の翌日。"}, {"t": 589.1666666666666, "x": "新聞が、あの「親愛なるボスへ」の\n手紙の書き起こしを載せた。"}, {"t": 593.3, "x": "手紙がとうとう表に出たのね。"}, {"t": 595.35, "x": "そうだ。そして同じ日の朝、通信社にもう1通届いた。"}, {"t": 599.05, "x": "今度は手紙じゃなくポストカードだ。"}, {"t": 601.25, "x": "同じ人から？"}, {"t": 602.45, "x": "赤鉛筆で書かれていて前の手紙のことに触れていた。"}, {"t": 605.6166666666667, "x": "「前の手紙を\n取っておいてくれてありがとう」という書き方だ。"}, {"t": 608.9666666666667, "x": "そして「今度は2つだ」とあった。"}, {"t": 611.45, "x": "2つって……ひと晩の2つのこと？"}, {"t": 613.9166666666666, "x": "そう読める書き方だ。"}, {"t": 615.3333333333334, "x": "筆跡は前の手紙の追伸と同じだとされた。"}, {"t": 618.3833333333333, "x": "じゃあ、事件の翌朝に届いたなら、\n犯人しか知らないはずじゃない？"}, {"t": 622.5, "x": "そう言われたこともある。でもそうとは限らない。"}, {"t": 625.15, "x": "2つの事件の話は、9月30日のうちに\n町中に広まっていた。"}, {"t": 629.6166666666667, "x": "それに当時の郵便は日曜も集めて配っていた。"}, {"t": 632.7166666666667, "x": "前の日に書いて出しても間に合うのね。"}, {"t": 635.0333333333333, "x": "そうだ。事件を知った誰かが書いても翌朝には届く。"}, {"t": 638.3666666666667, "x": "ちなみに、このポストカードの原物は\n今、行方が分からない。"}, {"t": 642.2, "x": "えっ、無くなったの？"}, {"t": 643.6833333333333, "x": "残っているのは、1888年に\n警視庁が作った写しだけだ。"}, {"t": 648.9333333333333, "x": "このポストカードにはもう一つ話がある。"}, {"t": 651.3833333333333, "x": "カードの両面に赤黒いしみがなすりつけてあった。"}, {"t": 654.3, "x": "宛名の側には指の跡のようなものも残っていた。"}, {"t": 657.3666666666667, "x": "指の跡！　それなら誰の指か調べられるんじゃない？"}, {"t": 660.5333333333333, "x": "まさにそう考えた人がいた。"}, {"t": 662.4166666666666, "x": "イギリス南西部のプリマスに住む\n男が、新聞に投書したんだ。"}, {"t": 666.35, "x": "中身を短くするとこうだ。"}, {"t": 668.15, "x": "「親指の表面の模様は、2人として同じものは無い」。"}, {"t": 671.4333333333333, "x": "「疑わしい男たちの親指を、専門家に\nこの跡と比べさせればよい」。"}, {"t": 675.5833333333334, "x": "「顕微鏡を使えばそれが分かる」。"}, {"t": 677.6, "x": "今で言う、指紋の鑑定ね。"}, {"t": 679.5666666666667, "x": "そうだ。ところが当時のロンドンの警察は、\nまだ指紋を使っていなかった。"}, {"t": 684.0, "x": "指紋で人を見分ける方法は、\n2年前の1886年に警視庁へ持ち込まれていた。"}, {"t": 689.65, "x": "でもそのときは断っていた。"}, {"t": 691.5833333333334, "x": "えっ、もったいない。"}, {"t": 692.9833333333333, "x": "指紋で殺人の犯人が初めて有罪になったのは、\n1892年のアルゼンチンだ。"}, {"t": 698.5, "x": "この事件の4年あとになる。"}, {"t": 700.3666666666667, "x": "じゃあ、もし指紋が使えていたら……。"}, {"t": 702.5333333333333, "x": "それも分からない。"}, {"t": 703.65, "x": "あの跡が、本当に書いた\n人の指だったのかも確かめようがない。"}, {"t": 707.55, "x": "そもそもカードの原物がもう無いからな。"}, {"t": 710.0666666666667, "x": "そうだった。写ししか残ってないのよね。"}, {"t": 712.7166666666667, "x": "投書の男の考えは正しかった。\nただ、時代が少し早すぎた。"}, {"t": 717.65, "x": "10月4日、新聞に手紙と\nポストカードの写真版が載った。"}, {"t": 721.6666666666666, "x": "写真版って？"}, {"t": 722.8, "x": "書き写した文字じゃなく、\n筆跡そのままを印刷したものだ。"}, {"t": 726.5333333333333, "x": "前の日の遅い版に、もう載っていたかも\nしれないとも言われる。"}, {"t": 729.9666666666667, "x": "そして警察は手紙の写しを警察署に貼り出した。"}, {"t": 733.3166666666667, "x": "警察が自分で？"}, {"t": 734.65, "x": "この字に見覚えのある\n人はいないか、という狙いだったんだろう。"}, {"t": 738.1166666666667, "x": "のちの警視庁の幹部マクノートンは、\nこれを回想録に書いている。"}, {"t": 741.9666666666667, "x": "訳すとこうだ。"}, {"t": 743.0333333333333, "x": "「写しが方々の警察署に貼られ、手紙に\nお墨付きを与えることになった」。"}, {"t": 747.4333333333333, "x": "その前には、自分の考えでは\n賢くなかった、と添えてある。"}, {"t": 751.3833333333333, "x": "警察が貼ったから本物っぽく見えちゃったのね。"}, {"t": 754.3666666666667, "x": "そうだ。そして同じ回想録にこういう一文もある。"}, {"t": 757.5333333333333, "x": "「切り裂きジャックという名前は\n国中に広まり、受けてしまった」。"}, {"t": 761.2666666666667, "x": "受けてしまった、って……。"}, {"t": 762.75, "x": "それまで新聞は\n「ホワイトチャペルの殺人者」と呼んでいた。"}, {"t": 766.4, "x": "それが、この手紙をきっかけに\n「ジャック」に置き換わっていった。"}, {"t": 770.3166666666667, "x": "手紙の署名が事件の名前になったのね。"}, {"t": 772.9666666666667, "x": "そうだ。本物かどうかを誰も\n確かめないまま、名前だけが先に決まった。"}, {"t": 777.6333333333333, "x": "警察が広めちゃったようなものね。"}, {"t": 779.8666666666667, "x": "結果としては、そうなった。"}, {"t": 782.3333333333334, "x": "名前が広まったらどうなったの？"}, {"t": 784.3666666666667, "x": "同じ名前を名乗る手紙が次々に届きはじめた。"}, {"t": 787.5666666666667, "x": "まねする人が出たのね。"}, {"t": 789.2333333333333, "x": "国立公文書館は、警視庁のファイルに「ジャック」を\n名乗る手紙が何百通もあると書いている。"}, {"t": 795.05, "x": "市民から警察と新聞に届いた手紙全体では何千通だ。"}, {"t": 798.9833333333333, "x": "何千通……。"}, {"t": 799.95, "x": "中には、本気で手がかりを\n知らせようとした手紙もあった。"}, {"t": 803.3833333333333, "x": "でも多くは犯人を名乗るいたずらだった。"}, {"t": 805.7166666666667, "x": "宛先もばらばらだ。"}, {"t": 807.0666666666667, "x": "ロンドンの警察署や判事だけじゃない。"}, {"t": 809.2833333333333, "x": "パリの警察、ベルギー、カナダ、\nアメリカのニューヨークやワシントンにも届いている。"}, {"t": 814.05, "x": "海の向こうにまで？"}, {"t": 815.3666666666667, "x": "そうだ。名前ごと世界へ広がっていった。"}, {"t": 817.9166666666666, "x": "公文書館が紹介している1通は、\nバーミンガムから出したと名乗っている。"}, {"t": 822.3333333333334, "x": "ロンドンじゃない町から？"}, {"t": 823.8666666666667, "x": "そうだ。犯人がどこにいるか、\n手紙だけでは何も分からない。"}, {"t": 827.55, "x": "公文書館はこうまとめている。"}, {"t": 829.3833333333333, "x": "「どの手紙も、殺人者が\n書いたという強い証拠は無い」。"}, {"t": 832.6666666666666, "x": "そして「今のいたずらと同じで、\n警察の時間をむだにさせただけだった」。"}, {"t": 837.2166666666667, "x": "……警察はそれを全部読まないといけなかったのね。"}, {"t": 840.1166666666667, "x": "読まなければ本物を見落とすかもしれないからな。"}, {"t": 842.9, "x": "国立公文書館には、こうした\n手紙だけを集めた束がある。"}, {"t": 846.6333333333333, "x": "題は「切り裂きジャックと署名した個人からの手紙」。"}, {"t": 849.8, "x": "日付は1888年から1891年までだ。"}, {"t": 854.1, "x": "3年も手紙が来続けたの？"}, {"t": 856.1666666666666, "x": "そうだ。名前は、事件が止まった\nあとも手紙の中で生き続けた。"}, {"t": 860.85, "x": "その中でひときわ知られている1通がある。"}, {"t": 863.3333333333334, "x": "10月16日の夕方の郵便。"}, {"t": 865.5333333333333, "x": "届いた先は、自警委員会の会長、\nジョージ・ラスクの家だった。"}, {"t": 869.7666666666667, "x": "警察じゃなくて自警団の会長に？"}, {"t": 872.1333333333333, "x": "そうだ。手紙は小包の中に入っていた。"}, {"t": 874.8333333333334, "x": "小包の中身はここでは言わない。"}, {"t": 876.9833333333333, "x": "……うん。"}, {"t": 877.4833333333333, "x": "手紙の書き出しは「地獄より」。"}, {"t": 879.5333333333333, "x": "結びはこうだ。"}, {"t": 880.5333333333333, "x": "「つかまえられるものなら\nつかまえてみな、ラスクさん」。"}, {"t": 883.55, "x": "挑発してるのね。"}, {"t": 884.9666666666667, "x": "ラスクは最初、いたずらだと思ったそうだ。"}, {"t": 887.5333333333333, "x": "会長の名前と住んでいる通りは新聞にも出ていた。"}, {"t": 890.5333333333333, "x": "小包が届く前の日の夜中、気になる\n出来事があったとも伝えられている。"}, {"t": 894.9833333333333, "x": "近くの革製品の店にある男が入ってきた。"}, {"t": 898.0166666666667, "x": "店に貼られた自警委員会の懸賞金のビラを見て、\nラスクの住所を聞いたという。"}, {"t": 902.7666666666667, "x": "住所を？"}, {"t": 903.5333333333333, "x": "店の娘は新聞に載っていた通りの名前を教えた。"}, {"t": 906.6833333333333, "x": "ただ、番地までは教えなかった。"}, {"t": 908.75, "x": "そして届いた小包の宛名にも、\n番地が書かれていなかった。"}, {"t": 912.6, "x": "えっ、それって……。"}, {"t": 913.9, "x": "同じ男かどうかは分からない。"}, {"t": 915.6, "x": "娘があとからそう話した、というだけだ。"}, {"t": 918.2833333333333, "x": "ここで一つ気になるのは、この手紙には\n「ジャック」の署名が無いことだ。"}, {"t": 922.8333333333334, "x": "名乗ってないの？"}, {"t": 923.9666666666667, "x": "名乗っていない。それなのに、今はよく\n「ジャックの手紙」として紹介される。"}, {"t": 928.6833333333333, "x": "名前のほうがあとから手紙にくっついたのね。"}, {"t": 931.3666666666667, "x": "そうだ。そしてこの手紙の原物も、\n今は行方が分からない。"}, {"t": 935.1333333333333, "x": "1888年10月に写真に撮られたあと、\nどこへ行ったのか記録が無い。"}, {"t": 940.2, "x": "また、写しだけ？"}, {"t": 941.6666666666666, "x": "そうだ。この事件は、原物より\n写しのほうが多く残っている。"}, {"t": 946.0833333333334, "x": "町の人たちはどうしてたの？"}, {"t": 948.0333333333333, "x": "10月、ホワイトチャペルの商店主たちが\n内務大臣に請願を出した。"}, {"t": 952.5, "x": "内務大臣って？"}, {"t": 953.7833333333333, "x": "警察を受け持つ大臣だ。"}, {"t": 955.3666666666667, "x": "ロンドン警視庁の上にいる。"}, {"t": 957.1166666666667, "x": "請願の中身は警官を増やしてほしい、というものだ。"}, {"t": 960.4, "x": "店をやってる人たちも怖かったのね。"}, {"t": 962.8666666666667, "x": "夜に人が出歩かなくなれば商売にも響く。"}, {"t": 965.6333333333333, "x": "警視庁のファイルには、10月22日付で\n巡回の人数の報告も入っている。"}, {"t": 970.7166666666667, "x": "警察も人数を見直したのね。"}, {"t": 972.85, "x": "この「警官は足りているのか」は議会でも聞かれた。"}, {"t": 976.0666666666667, "x": "11月13日、ある議員が内務大臣に質問している。"}, {"t": 979.8833333333333, "x": "混み合った貧しい地区の警官は、\n裕福な地区と同じ割合でいるのか。"}, {"t": 984.05, "x": "警察は働きすぎで人が足りないのではないか。"}, {"t": 987.1166666666667, "x": "大臣は何て答えたの？"}, {"t": 988.8666666666667, "x": "訳すとこうだ。"}, {"t": 989.9166666666666, "x": "「警官は地区ごとの必要に応じて置いていて、\n人数の割合では決めていない」。"}, {"t": 994.35, "x": "「働きすぎで人が足りないとは考えていない」。"}, {"t": 997.2, "x": "足りてる、って言ったのね。"}, {"t": 998.8166666666667, "x": "ただ、こうも続けている。"}, {"t": 1000.4333333333333, "x": "「ときに、対応の難しい\n大きな仕事の重なりがあるのは確かだ」。"}, {"t": 1004.4833333333333, "x": "……認めてるような、認めてないような。"}, {"t": 1006.85, "x": "議会の答弁はたいていそういう言い回しになる。"}, {"t": 1010.1, "x": "そして11月9日。"}, {"t": 1011.8333333333334, "x": "ドーセット通りの奥、ミラーズ・コートという路地だ。"}, {"t": 1014.8, "x": "家主に頼まれて、ためた家賃を\n取り立てに来た男がいた。"}, {"t": 1018.5333333333333, "x": "家賃の取り立て？"}, {"t": 1019.8166666666667, "x": "ノックしても返事が無い。"}, {"t": 1021.2, "x": "戸には鍵がかかっていた。"}, {"t": 1022.85, "x": "窓のほうから中をのぞいて、5人目に気づいた。"}, {"t": 1025.75, "x": "メアリー・ジェーン・ケリー。"}, {"t": 1027.2, "x": "部屋の番号は13号だった。"}, {"t": 1029.1166666666666, "x": "5人のうち、ただ1人、\n自分の部屋の中で見つかった人だ。"}, {"t": 1033.1333333333334, "x": "外じゃなくて部屋の中で……。"}, {"t": 1034.9333333333334, "x": "そうだ。様子についてはここでは話さない。"}, {"t": 1037.6333333333334, "x": "うん。"}, {"t": 1038.15, "x": "この日、議会でも動きがあった。"}, {"t": 1040.2166666666667, "x": "ある議員が、夕刊で新しい事件を\n知ったと言って立ち上がった。"}, {"t": 1043.9166666666667, "x": "そして内務大臣に、ウォーレン総監を\n替えるべきではないかと質問した。"}, {"t": 1048.2833333333333, "x": "その場で？"}, {"t": 1049.15, "x": "その場でだ。でも議長に止められた。"}, {"t": 1051.3666666666666, "x": "「通常の手続きで質問の通告をしなさい」。"}, {"t": 1054.2, "x": "手続きが先なのね。"}, {"t": 1055.7666666666667, "x": "続けて別の議員が、ウォーレンはまだ\nサンクトペテルブルクにいるのかと聞いた。"}, {"t": 1060.1666666666667, "x": "ロシアに？"}, {"t": 1061.0, "x": "その質問の答えは記録に残っていない。"}, {"t": 1063.55, "x": "ただ、このとき総監はもう辞表を出していた。"}, {"t": 1066.4166666666667, "x": "えっ、もう？"}, {"t": 1067.4166666666667, "x": "それがいつだったかは、3日後の議会で明らかになる。"}, {"t": 1071.2333333333333, "x": "11月12日、ある議員が内務大臣に聞いた。"}, {"t": 1074.4666666666667, "x": "ウォーレン総監が辞表を出したという\n夕刊の記事は本当か。"}, {"t": 1077.8333333333333, "x": "大臣の答えはこうだ。"}, {"t": 1079.3333333333333, "x": "「総監は今月8日に辞表を出し、それは受理された」。"}, {"t": 1082.7, "x": "8日って、ケリーさんの事件の前の日じゃない。"}, {"t": 1085.5333333333333, "x": "そうだ。辞表は5人目の事件より先だった。"}, {"t": 1088.5, "x": "じゃあ、事件の責任を取って辞めたわけじゃないの？"}, {"t": 1091.5333333333333, "x": "少なくとも日付の上では5人目の前だ。"}, {"t": 1094.15, "x": "同じ8日の議会では、別の件で\n総監が問題になっていた。"}, {"t": 1098.0666666666666, "x": "別の件？"}, {"t": 1098.9833333333333, "x": "総監が、雑誌に警察の運営についての記事を\n書いていたんだ。"}, {"t": 1102.7833333333333, "x": "内務省には1879年から、許しなく部署のことを\n出版しないという決まりがあった。"}, {"t": 1108.5, "x": "大臣の答弁では、総監は\nその決まりを知らなかったという。"}, {"t": 1112.2, "x": "上とうまくいってなかったのね。"}, {"t": 1114.1166666666666, "x": "さらにこの年、\n警視庁の刑事部門のトップも辞めていた。"}, {"t": 1117.6666666666667, "x": "11月12日の答弁で、大臣は\n刑事部門の今の指揮についても説明している。"}, {"t": 1122.8833333333334, "x": "新しい責任者が、総監の監督の下で\n直接受け持っている、と。"}, {"t": 1127.4333333333334, "x": "刑事部門のトップまで替わってたの？"}, {"t": 1129.7, "x": "そうだ。事件のさなかに、\n捜査の上の人が次々に替わっていた。"}, {"t": 1133.8833333333334, "x": "その答弁で大臣はこうも言っている。"}, {"t": 1136.0333333333333, "x": "「ここまで捕まえられないのは、新しい\n組織や仕組みの欠陥のせいではない」。"}, {"t": 1140.3833333333334, "x": "「この残忍な犯行の、並外れた\n狡猾さと秘密性のせいだ」。"}, {"t": 1144.4833333333333, "x": "犯人がうますぎる、って言ったのね。"}, {"t": 1146.7333333333333, "x": "辞表を出したあと総監は新聞に手紙を寄せている。"}, {"t": 1149.75, "x": "その中で、法律に反するような\n指示を受けたこともあると書いた。"}, {"t": 1153.5833333333333, "x": "議会ではその指示は何だったのかと聞かれた。"}, {"t": 1156.25, "x": "大臣は「法律に反する\n指示を出したことは無い」と答えた。"}, {"t": 1160.05, "x": "やり取りの手紙も一部は秘密だとして出さなかった。"}, {"t": 1163.2833333333333, "x": "議員たちは納得したの？"}, {"t": 1165.0666666666666, "x": "総監と内務省のどちらの言い分が正しいか\n決めるために全部出すべきだという声もあった。"}, {"t": 1170.2666666666667, "x": "大臣は全部を出す必要は無いと答えている。"}, {"t": 1173.0166666666667, "x": "11月26日には、辞表を出した総監がまだ\n警察の規則に署名している、と質問が出た。"}, {"t": 1179.3333333333333, "x": "大臣の答えは、後任が決まるまで\n職務を続けている、だった。"}, {"t": 1183.3166666666666, "x": "新しい総監の任命が正式に\n決まったのは、11月の終わりだ。"}, {"t": 1187.6333333333334, "x": "……事件のさなかに、\n警察のトップと大臣がもめてたのね。"}, {"t": 1191.3, "x": "そういう時期だった、ということだけ\n記録に残っている。"}, {"t": 1195.1, "x": "同じ11月12日、もう一つ大事な答弁がある。"}, {"t": 1198.5833333333333, "x": "ある議員が、犯人を捕まえるための懸賞金を\n国が出さないのかと聞いた。"}, {"t": 1203.1333333333334, "x": "町の人が出したのに国は出してなかったの？"}, {"t": 1205.9833333333333, "x": "出していなかった。内務大臣は、\nいつもより長く理由を話した。"}, {"t": 1210.0, "x": "1884年より前は、内務省もよく懸賞金を出していた。"}, {"t": 1214.3666666666666, "x": "200ポンドから2000ポンドまで出した事件もあった。"}, {"t": 1217.3833333333334, "x": "アイルランドの大きな事件では、\n1万ポンドまで出した。"}, {"t": 1220.7333333333333, "x": "1万ポンド！"}, {"t": 1221.8166666666666, "x": "でもどれも役に立つ証拠は出てこなかったという。"}, {"t": 1224.5833333333333, "x": "それどころか、懸賞金めあてに無実の人を\n犯人に仕立てる企みまで起きた。"}, {"t": 1229.5333333333333, "x": "お金のためにうその犯人を？"}, {"t": 1231.4666666666667, "x": "そうだ。それで1884年に、懸賞金をやめると決めた。"}, {"t": 1235.7333333333333, "x": "当時の内務大臣が、イングランドと\nアイルランドの警察に意見を聞いて決めた。"}, {"t": 1240.2333333333333, "x": "その後も1885年と1886年に、別の事件で\n見直されたが、やめる方針は守られた。"}, {"t": 1247.3666666666666, "x": "じゃあ、例外は無いの？"}, {"t": 1248.9, "x": "大臣は例外もありうると言っている。"}, {"t": 1250.9833333333333, "x": "犯人が誰か分かっていて、隠れ\n場所だけを知りたいときなどだ。"}, {"t": 1254.7, "x": "この事件は、そのどれにも\n当てはまらない、という説明だった。"}, {"t": 1258.35, "x": "大臣は当時の結論をこう読み上げている。"}, {"t": 1260.85, "x": "「大きな懸賞金は役に立たないどころか害がある」。"}, {"t": 1263.7833333333333, "x": "「確かな証言よりうその証言を生みやすい」。"}, {"t": 1266.4166666666667, "x": "うその証言……。"}, {"t": 1267.4833333333333, "x": "そしてこの事件ではなおさらだと続けた。"}, {"t": 1269.9833333333333, "x": "「世の中が興奮している今は、\n無実の人が訴えられる危険が大きい」。"}, {"t": 1274.3666666666666, "x": "さっきの、誰かを疑う空気のことね。"}, {"t": 1276.9833333333333, "x": "そうだ。最後に大臣はこう言っている。"}, {"t": 1279.3166666666666, "x": "「内務省も警視庁もあらゆる手を尽くす」。"}, {"t": 1281.85, "x": "お金は出さないけど、手は尽くす、ってことね。"}, {"t": 1284.7666666666667, "x": "そのうえで大臣は自分の気持ちも口にしている。"}, {"t": 1287.6333333333334, "x": "「世の中の不安を静めたいのは分かっている」。"}, {"t": 1290.1, "x": "「当局が無関心ではない証しを目に\n見える形で示せたら、うれしかった」。"}, {"t": 1294.6333333333334, "x": "本当は何か目に見えることをしたかったのね。"}, {"t": 1297.4166666666667, "x": "答弁を読むかぎりでは、そう取れる。"}, {"t": 1300.1833333333334, "x": "その代わりに国が出したのが恩赦だ。"}, {"t": 1302.55, "x": "恩赦って、罪を許すこと？"}, {"t": 1304.5333333333333, "x": "そうだ。犯人を除いて、知っていることを\n話した仲間の罪を問わない。"}, {"t": 1308.8, "x": "ケリーの事件の翌日、11月10日に、\n警視庁が情報を求める公示を出した。"}, {"t": 1313.9666666666667, "x": "内務省の手紙と一緒にその記録が残っている。"}, {"t": 1317.0166666666667, "x": "でも前の4件は？"}, {"t": 1318.4333333333334, "x": "そこを議会でも聞かれた。"}, {"t": 1320.0, "x": "11月12日、ある議員が、恩赦は\n最後の事件にしか付いていないと指摘した。"}, {"t": 1325.1166666666666, "x": "そして11月23日、別の議員がはっきり聞いた。"}, {"t": 1328.7333333333333, "x": "前の事件にも恩赦を広げないのか。"}, {"t": 1331.0833333333333, "x": "大臣は何て？"}, {"t": 1332.3166666666666, "x": "訳すとこうだ。"}, {"t": 1333.4, "x": "「前の事件でも、役に立つと\n思えば恩赦を出す用意はある」。"}, {"t": 1336.8, "x": "「ケリーの件には、\n前の事件に無かった事情があった」。"}, {"t": 1339.95, "x": "「犯行のあとで誰かが手を貸した\n見込みが、より高かった」。"}, {"t": 1343.5166666666667, "x": "誰かが手を貸した……？"}, {"t": 1344.9166666666667, "x": "大臣はそう考えた、ということだ。"}, {"t": 1347.2166666666667, "x": "その「事情」が何だったのかは、\n答弁では言っていない。"}, {"t": 1350.7833333333333, "x": "中身は言わないのね。"}, {"t": 1352.2333333333333, "x": "言っていない。そして結局、\n恩赦を出しても犯人は捕まらなかった。"}, {"t": 1356.5833333333333, "x": "……手がかりにはならなかったのね。"}, {"t": 1358.5166666666667, "x": "少なくとも事件を解く決め手にはならなかった。"}, {"t": 1361.95, "x": "議会はこのころ、事件の背景にも目を向けていた。"}, {"t": 1365.1, "x": "最初に話した、簡易宿泊所だ。"}, {"t": 1367.6166666666666, "x": "一晩いくらの相部屋ね。"}, {"t": 1369.35, "x": "11月16日、ある議員が取り締まりを\n強めるべきではないかと聞いた。"}, {"t": 1373.75, "x": "見回りや登録、詰め込みすぎの部屋のことだ。"}, {"t": 1376.6166666666666, "x": "内務大臣は今の法律は十分に守られていると答えた。"}, {"t": 1380.1166666666666, "x": "ただ、衛生の見回りは強められるかも\nしれないと付け加えた。"}, {"t": 1383.9, "x": "そこで事件の話は出たの？"}, {"t": 1385.85, "x": "出た。別の議員がこう聞いている。"}, {"t": 1387.8833333333334, "x": "東部の恐ろしい事件の多くは、\n簡易宿泊所と関わっているのではないか。"}, {"t": 1392.3833333333334, "x": "宿のせいだって言いたいのね。"}, {"t": 1394.2, "x": "1週間後の11月22日、また同じ話が出た。"}, {"t": 1397.9, "x": "ある判事が、この地区の犯罪はみな\n宿泊所のせいだと言った、という質問だ。"}, {"t": 1402.7833333333333, "x": "大臣はそうだって言ったの？"}, {"t": 1404.5833333333333, "x": "言わなかった。警察の意見としてこう答えている。"}, {"t": 1407.5833333333333, "x": "「犯罪が簡易宿泊所のせいだとは言えない」。"}, {"t": 1410.15, "x": "「宿の持ち主はたいてい警察に協力してくれる」。"}, {"t": 1413.15, "x": "「ほかへ追いやるより、\n宿にいるほうが警察の目が届く」。"}, {"t": 1416.4333333333334, "x": "へえ、追い出すとかえって見えなくなるのね。"}, {"t": 1418.9833333333333, "x": "そうだ。5人のうち何人もが\n寝泊まりしていたのも、こういう宿だった。"}, {"t": 1423.15, "x": "宿を責めてもそこに泊まるしかない人は残る。"}, {"t": 1426.0333333333333, "x": "……その人たちの暮らしは、\n議会では深く話されなかったのね。"}, {"t": 1429.8833333333334, "x": "少なくともこの年の答弁にはあまり出てこない。"}, {"t": 1432.7333333333333, "x": "その前の日、11月21日にも、こんな質問が出ている。"}, {"t": 1436.9, "x": "夕刊に、ホワイトチャペルでまた女性が\n殺されたという記事があるが、本当か。"}, {"t": 1441.6166666666666, "x": "また？"}, {"t": 1442.25, "x": "答えたのは内務省の次官だった。"}, {"t": 1444.3833333333334, "x": "大臣がまもなく来るので、あとで\nもう一度聞いてほしいと言った。"}, {"t": 1447.9666666666667, "x": "議会でも、夕刊が出るたびに\n不安が走っていた、ということだ。"}, {"t": 1452.4666666666667, "x": "11月10日、警視庁のファイルにもう\n1通、重要な手紙が入っている。"}, {"t": 1457.0, "x": "警察医が書いた手紙だ。"}, {"t": 1458.8, "x": "お医者さんが？"}, {"t": 1459.8, "x": "ケリーの事件とそれまでの4件を比べた手紙だ。"}, {"t": 1462.7666666666667, "x": "そして、犯人がどういう人物と\n考えられるかの見立ても書いてある。"}, {"t": 1466.9166666666667, "x": "犯人像ね。何て書いてあったの？"}, {"t": 1469.25, "x": "中身の多くは体の傷の話になるから、\nここでは読まない。"}, {"t": 1473.0666666666666, "x": "そっか。"}, {"t": 1473.8333333333333, "x": "大事なのは、この手紙が「5件」を\nひとまとめにして比べていることだ。"}, {"t": 1478.2333333333333, "x": "ここで最初に言った「数え方」の話に戻る。"}, {"t": 1481.5166666666667, "x": "のちに数えられる、ってやつね。"}, {"t": 1483.4833333333333, "x": "「切り裂きジャックの被害者は5人」とよく言われる。"}, {"t": 1486.2666666666667, "x": "でもこれは事件当時に決まった数じゃない。"}, {"t": 1488.8333333333333, "x": "じゃあ、誰が決めたの？"}, {"t": 1490.4166666666667, "x": "はっきり「5人、5人だけ」と書いたのは、\nのちの警視庁幹部、マクノートンだ。"}, {"t": 1495.4333333333334, "x": "1894年のメモの中でだ。"}, {"t": 1498.0666666666666, "x": "6年もたってから？"}, {"t": 1499.55, "x": "そうだ。つまり「5人」は、\n1人の幹部の見立てなんだ。"}, {"t": 1503.3166666666666, "x": "みんなが認めた数じゃないのね。"}, {"t": 1505.35, "x": "そうだ。そして警視庁のファイルそのものは、\n5人で終わっていない。"}, {"t": 1509.8166666666666, "x": "国立公文書館に、警視庁の\n「ホワイトチャペル殺人事件」のファイルがある。"}, {"t": 1514.6833333333334, "x": "その目録を引いてみた。"}, {"t": 1516.4, "x": "中には何が入ってるの？"}, {"t": 1518.1666666666667, "x": "5人の件だけじゃない。"}, {"t": 1519.5833333333333, "x": "5人より前、1888年8月7日の別の女性の件も\n入っている。"}, {"t": 1524.8, "x": "一番あとは、1891年2月13日の件だ。"}, {"t": 1528.9, "x": "1891年って、3年もあと？"}, {"t": 1531.9, "x": "そうだ。5人目の事件から2年以上あとだ。"}, {"t": 1534.6166666666666, "x": "公文書館の解説にもこう書いてある。"}, {"t": 1536.9833333333333, "x": "「5人の前後の数か月に、少なくとも\n3件、同じ人物ではないかと\n言われるほどの事件があった」。"}, {"t": 1543.0666666666666, "x": "じゃあ、本当は5人じゃないかもしれないの？"}, {"t": 1545.65, "x": "それも分からない。"}, {"t": 1546.75, "x": "同じ人物だという証拠も、\n別人だという証拠も無いからだ。"}, {"t": 1550.6, "x": "数さえ決まってないのね。"}, {"t": 1552.3, "x": "そうだ。犯人の名前だけじゃなく、\n何件だったのかも確かめられていない。"}, {"t": 1556.75, "x": "確かなのは、警察がこれだけの件を\n同じファイルにとじて追っていたことだ。"}, {"t": 1561.1, "x": "ファイルの中身は警察の報告だけじゃない。"}, {"t": 1563.65, "x": "新聞の切り抜きも入っている。"}, {"t": 1565.55, "x": "中には、アメリカのフィラデルフィアの\n新聞の切り抜きまである。"}, {"t": 1569.1333333333334, "x": "アメリカの新聞まで警視庁がとってたの？"}, {"t": 1571.7833333333333, "x": "海の向こうでどう書かれているかまで、\n集めていたということだ。"}, {"t": 1575.3666666666666, "x": "一つの束に何年分も。"}, {"t": 1577.3, "x": "そうだ。そしてそのどれにも、\n犯人の名前は書かれていない。"}, {"t": 1581.5666666666666, "x": "ねえ、結局あの最初の手紙は誰が書いたの？"}, {"t": 1584.55, "x": "それも分かっていない。ただ、\n警察の中には見立てがあった。"}, {"t": 1588.1666666666667, "x": "さっきのマクノートンは回想録にこう書いている。"}, {"t": 1590.9, "x": "「あのおぞましい手紙には、記者の汚れた\n人さし指が見える気がしていた」。"}, {"t": 1595.15, "x": "記者？"}, {"t": 1595.85, "x": "そうだ。そして続けてこう書いた。"}, {"t": 1598.0, "x": "「誰が書いたにせよ、あの殺人を犯した\n者でないことは、私には確かだ」。"}, {"t": 1602.75, "x": "警察の幹部が犯人じゃないって言ってるのね。"}, {"t": 1605.5833333333333, "x": "別の元幹部も、1913年の手紙で\n同じことを書いている。"}, {"t": 1609.85, "x": "警視庁では、あの名前を考えたのは\n通信社の記者だと広く思われていた。"}, {"t": 1614.4333333333334, "x": "そして「記者として気の利いた\n仕事だった」とまで書いた。"}, {"t": 1617.95, "x": "さらにこうも書いている。"}, {"t": 1619.3333333333333, "x": "「私のいた頃、警視庁からあれほど特別な\n扱いを受けた記者はほかにいない」。"}, {"t": 1624.0833333333333, "x": "警察の中に出入りしてた記者なのね。"}, {"t": 1626.5833333333333, "x": "そういうことになる。"}, {"t": 1627.8833333333334, "x": "……名前を付けたのが記者？"}, {"t": 1629.55, "x": "そう思われていた、ということだ。"}, {"t": 1631.3666666666666, "x": "決まったわけじゃない。"}, {"t": 1632.6, "x": "誰だったのかは本や番組でいろいろ言われてきた。"}, {"t": 1635.45, "x": "でもこの回では記者の名前も出さない。"}, {"t": 1637.7333333333333, "x": "証拠で決まった話ではないからだ。"}, {"t": 1640.0333333333333, "x": "考えてみると、手紙が届いたのも\n警察じゃなく通信社だったわね。"}, {"t": 1644.3166666666666, "x": "そこに目をつけた人もいる。"}, {"t": 1646.05, "x": "一般の人なら新聞社か警察に送りそうなものだ。"}, {"t": 1649.35, "x": "記事を新聞社に売る通信社を宛先に\n選ぶのは、業界の人らしい、という見方だ。"}, {"t": 1654.5666666666666, "x": "なるほど。でもそれも見方の一つなのね。"}, {"t": 1657.3166666666666, "x": "逆の見方もある。"}, {"t": 1658.5333333333333, "x": "手紙の「ボス」などの言い回しは、\n当時アメリカ風の言葉づかいだと指摘されてきた。"}, {"t": 1663.7666666666667, "x": "ロンドンの記者らしくない、とも読める。"}, {"t": 1666.1, "x": "どっちにも取れるのね。"}, {"t": 1667.6, "x": "そうだ。犯人と同じで手紙の書き手にも名前が無い。"}, {"t": 1671.5166666666667, "x": "ここで、1894年のマクノートンのメモを\nもう少し見ておく。"}, {"t": 1675.7, "x": "メモには、事件のまとめと、\n疑われた男たちのことが書いてある。"}, {"t": 1679.8166666666666, "x": "そもそもこのメモは、ある新聞への反論として\n書かれた。"}, {"t": 1683.2666666666667, "x": "その新聞は、別の事件で捕まったある男が\n切り裂きジャックだ、と書き立てていた。"}, {"t": 1688.35, "x": "メモは、その記事の誤りを\n一つずつ挙げて打ち消している。"}, {"t": 1691.9333333333334, "x": "新聞が名指しして警察が打ち消したのね。"}, {"t": 1694.7333333333333, "x": "そうだ。ここでも「この人が犯人だ」という\n話が先に走っていた。"}, {"t": 1699.3333333333333, "x": "容疑者の名前もあるの？"}, {"t": 1700.9666666666667, "x": "ある。3人の名前が書いてある。"}, {"t": 1703.1, "x": "誰？"}, {"t": 1703.7166666666667, "x": "この回では読み上げない。"}, {"t": 1705.2666666666667, "x": "どうして？"}, {"t": 1706.1166666666666, "x": "同じメモにこういう一行があるからだ。"}, {"t": 1708.35, "x": "訳すとこうだ。"}, {"t": 1709.4333333333334, "x": "「ホワイトチャペルの殺人者を見た\n者は一人もいない」。"}, {"t": 1712.4333333333334, "x": "「多くの者が疑われたが、誰一人について、\n証拠の影すら示せなかった」。"}, {"t": 1717.3166666666666, "x": "証拠の影すら……。"}, {"t": 1718.6333333333334, "x": "名前を挙げた本人が証拠は無いと書いているんだ。"}, {"t": 1721.55, "x": "名前だけがひとり歩きしちゃうわね。"}, {"t": 1723.7833333333333, "x": "そうだ。このメモのあとも、\n何十年にもわたって新しい説が出てきた。"}, {"t": 1728.15, "x": "2019年には学術誌にこういう論文も出た。"}, {"t": 1731.2166666666667, "x": "現場にあったとされる布を調べ、遺伝子から\n犯人を特定した、という内容だ。"}, {"t": 1736.1833333333334, "x": "えっ、じゃあ分かったの？"}, {"t": 1737.75, "x": "いや、専門家からは批判が多い。"}, {"t": 1739.9, "x": "その布が本当に現場にあったという証拠が無い。"}, {"t": 1742.75, "x": "調べた種類の遺伝子は、同じ型の人が\n何千人もいることがある。"}, {"t": 1746.8666666666666, "x": "データの出し方も足りない、という声があった。"}, {"t": 1749.6333333333334, "x": "決め手にはならない、ってことね。"}, {"t": 1751.65, "x": "そうだ。だからこの回ではその名前も出さない。"}, {"t": 1755.0833333333333, "x": "名前が分からない理由の一つは、\n紙そのものが減っていったことだ。"}, {"t": 1759.15, "x": "紙が減る？"}, {"t": 1760.1333333333334, "x": "最初に届いた、赤いインクの手紙だ。"}, {"t": 1762.5833333333333, "x": "1928年までに警察の公式の書類から消えていた。"}, {"t": 1766.75, "x": "事件から40年でもう無くなってたの？"}, {"t": 1769.3, "x": "そうだ。誰がいつ持ち出したのか、記録は無い。"}, {"t": 1772.2166666666667, "x": "ポストカードの原物も行方不明だ。"}, {"t": 1774.4666666666667, "x": "ラスクの家に届いた手紙も行方不明だ。"}, {"t": 1777.0, "x": "壁のチョークの文字はその朝のうちに消された。"}, {"t": 1779.8, "x": "残ってるのは写しばっかりね。"}, {"t": 1781.7666666666667, "x": "そうだ。そしてファイルの束そのものも欠けている。"}, {"t": 1784.65, "x": "国立公文書館の目録にこういう注意書きがある。"}, {"t": 1787.8, "x": "「33枚目から135枚目まで、\n1983年12月19日に紛失と報告」。"}, {"t": 1794.2833333333333, "x": "100枚以上？"}, {"t": 1795.3166666666666, "x": "100枚を超える。中身は、\n容疑者についての請願と懸賞金の申し出の束だ。"}, {"t": 1800.3333333333333, "x": "……そこに何が書いてあったんだろう。"}, {"t": 1802.3333333333333, "x": "欠けた束の中身を知る手がかりは今のところ無い。"}, {"t": 1805.2, "x": "この事件を追う人たちは、欠けた\n束と写しの紙で考えるしかない。"}, {"t": 1809.4333333333334, "x": "名前が出ないのも仕方ないのかも。"}, {"t": 1811.6, "x": "ただ、消えた紙の中には戻ってきた物もある。"}, {"t": 1815.2, "x": "1987年11月。"}, {"t": 1817.5666666666666, "x": "ロンドン警視庁に、\n差出人の分からない茶封筒が届いた。"}, {"t": 1821.3166666666666, "x": "消印はロンドンの南のクロイドンだった。"}, {"t": 1823.8833333333334, "x": "中には？"}, {"t": 1824.7333333333333, "x": "あの「親愛なるボスへ」の手紙が入っていた。"}, {"t": 1827.7833333333333, "x": "えっ、戻ってきたの？"}, {"t": 1829.3833333333334, "x": "戻ってきた。通信社の添え状、\n最初の封筒も一緒だった。"}, {"t": 1833.2333333333333, "x": "ほかの関係書類も入っていた。"}, {"t": 1835.3666666666666, "x": "誰が送ってきたの？"}, {"t": 1836.85, "x": "それが分からない。差出人の名前は無かった。"}, {"t": 1839.9, "x": "始まりも、名前の分からない人からの手紙だったわね。"}, {"t": 1843.4333333333334, "x": "そうだ。戻ってきたときも、\n名前の分からない誰かからだった。"}, {"t": 1847.2833333333333, "x": "1888年に届いてから、1987年に戻るまで99年だ。"}, {"t": 1853.1166666666666, "x": "99年……。"}, {"t": 1854.25, "x": "今、手紙はロンドン郊外のキューにある\n国立公文書館に収められている。"}, {"t": 1858.6166666666666, "x": "紙は端が欠けて、折り目には\nテープで補修した跡がある。"}, {"t": 1861.9833333333333, "x": "赤鉛筆の追伸はもうほとんど読めないそうだ。"}, {"t": 1864.8666666666666, "x": "100年もあちこちを渡ってきたのね。"}, {"t": 1867.1833333333334, "x": "国立公文書館の目録には短くこう書いてある。"}, {"t": 1870.4333333333334, "x": "「1987年11月、差出人不明で\nロンドン警視庁に送られてきた書類」。"}, {"t": 1876.1166666666666, "x": "送り主は最後まで分からないまま？"}, {"t": 1878.35, "x": "分からないままだ。事件の名前を作った\n手紙は、行きも帰りも名無しだった。"}, {"t": 1883.6333333333334, "x": "ねえ、話を聞いてて思ったんだけど。"}, {"t": 1886.05, "x": "何だ？"}, {"t": 1886.7833333333333, "x": "犯人の名前は分からない。"}, {"t": 1888.2666666666667, "x": "手紙の書き手も分からない。"}, {"t": 1889.9833333333333, "x": "送り返した人も分からない。"}, {"t": 1891.9166666666667, "x": "手紙の道のりを日付で並べておくか。"}, {"t": 1894.35, "x": "1888年9月27日、通信社に届く。"}, {"t": 1898.3833333333334, "x": "2日後の9月29日、冗談として扱われたまま警視庁へ。"}, {"t": 1902.55, "x": "10月4日、筆跡が新聞に載り警察署に貼られる。"}, {"t": 1906.1333333333334, "x": "そして1928年までには行方が分からなくなる。"}, {"t": 1909.6833333333334, "x": "1987年11月、差出人不明の茶封筒で戻ってくる。"}, {"t": 1914.5833333333333, "x": "どの場面にも名前の分かる送り主がいないのね。"}, {"t": 1917.5666666666666, "x": "そうだな。"}, {"t": 1918.3833333333334, "x": "でも亡くなった人たちの名前は分かってるのよね。"}, {"t": 1921.3833333333334, "x": "分かっている。"}, {"t": 1922.2666666666667, "x": "メアリー・アン・ニコルズ。"}, {"t": 1923.6666666666667, "x": "アニー・チャップマン。"}, {"t": 1924.9166666666667, "x": "エリザベス・ストライド。"}, {"t": 1926.3166666666666, "x": "キャサリン・エドウズ。"}, {"t": 1927.6, "x": "メアリー・ジェーン・ケリー。"}, {"t": 1929.05, "x": "国立公文書館の解説は、\nこの5人の名前を一人ずつ挙げている。"}, {"t": 1933.4166666666667, "x": "犯人の呼び名だけじゃなくて？"}, {"t": 1935.35, "x": "そうだ。解説はこうも書いている。"}, {"t": 1937.4333333333334, "x": "「最初から関心は殺人者に向けられ、\n被害者は脇に追いやられた」。"}, {"t": 1941.6333333333334, "x": "……今の私たちも名前のほうばかり覚えてたかも。"}, {"t": 1944.6, "x": "138年たった今も、本当の名前が\n分からないのは犯人のほうだ。"}, {"t": 1949.1333333333334, "x": "「切り裂きジャック」は、誰かが\n手紙に書いた通り名でしかない。"}, {"t": 1952.7666666666667, "x": "それを書いたのが誰かも確かめられていない。"}, {"t": 1955.4333333333334, "x": "名前があるみたいで無いのね。"}, {"t": 1957.2, "x": "そうだ。記録の上で名前が\nはっきりしているのは、5人のほうだ。"}, {"t": 1961.0166666666667, "x": "宿の寝床代を気にしていた人がいた。"}, {"t": 1963.4166666666667, "x": "季節の仕事から帰ってきたばかりの人がいた。"}, {"t": 1966.3333333333333, "x": "かつては家族と暮らしていた人もいた。"}, {"t": 1968.85, "x": "一人ひとりに暮らしがあったのね。"}, {"t": 1970.9833333333333, "x": "1888年9月27日、通信社に届いた赤いインクの手紙。"}, {"t": 1976.0166666666667, "x": "そこに書かれた名前は今も世界中で知られている。"}, {"t": 1978.9166666666667, "x": "ただ、それは犯人の名前じゃない。"}, {"t": 1981.05, "x": "今回は、その名前の出どころを\n紙の記録で追った回だった。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
