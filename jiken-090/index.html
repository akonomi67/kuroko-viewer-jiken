<script>
const D={"name": "090", "file": "090_編集用", "dur": 2161.66665625, "segs": [], "subs": [{"t": 0.0, "x": "一つの銃撃に、二つの国が、\n別々の答えを出したことがある。"}, {"t": 4.3, "x": "1981年11月、アメリカのロサンゼルスで、\n日本人の夫婦が撃たれた。"}, {"t": 9.7, "x": "妻が重体になり、夫も脚にけがをした。"}, {"t": 12.433333333333334, "x": "妻は、翌年の11月に亡くなっている。"}, {"t": 15.366666666666667, "x": "……四十五年前の話ね。"}, {"t": 17.233333333333334, "x": "そうだ。そして、この事件で殺人の罪に\n問われた夫は、日本の裁判で無罪になった。"}, {"t": 22.8, "x": "2003年3月5日、最高裁が検察の上告を\n退けて、無罪が確定している。"}, {"t": 28.433333333333334, "x": "ここは、今日いちばん\n大事なところだ。先に言っておく。"}, {"t": 31.683333333333334, "x": "この人は、銃撃については無罪が確定している。"}, {"t": 34.733333333333334, "x": "私はこの回で、一度も「犯人」とは呼ばない。"}, {"t": 38.13333333333333, "x": "わかったわ。"}, {"t": 39.06666666666667, "x": "ところが、その五年後だ。"}, {"t": 40.8, "x": "2008年2月、本人はサイパンで、\nアメリカの捜査当局に逮捕された。"}, {"t": 45.733333333333334, "x": "……日本で無罪になったのに？"}, {"t": 47.46666666666667, "x": "そうだ。同じ、1981年の銃撃をめぐってだ。"}, {"t": 51.4, "x": "そして同じ年の10月10日、\nロサンゼルスの留置施設で、死亡が確認された。"}, {"t": 56.63333333333333, "x": "裁判は、一度も開かれないまま終わった。"}, {"t": 59.25, "x": "この回で追うのは、事件そのものよりも、\nこの二十七年のあいだに何が起きたのかだ。"}, {"t": 64.35, "x": "日本で無罪が確定した人が、\nなぜ別の国で捕まるのか。"}, {"t": 68.21666666666667, "x": "一事不再理という言葉は、どこまで届くのか。"}, {"t": 71.13333333333334, "x": "それを、国会の記録と、政府の答弁書と、\n法律の条文だけで確かめていく。"}, {"t": 76.38333333333334, "x": "想像では話さない、ということね。"}, {"t": 78.66666666666667, "x": "そうだ。もう一つ断っておく。"}, {"t": 80.76666666666667, "x": "撃たれた場面も、けがの様子も、\n亡くなったときの様子も、この回では描かない。"}, {"t": 85.6, "x": "そして最後まで読んでも、撃った\n人間が誰かは分からない。"}, {"t": 88.85, "x": "日本でも、アメリカでも、確定していないからだ。"}, {"t": 92.61666666666666, "x": "時間を戻す。1981年11月のロサンゼルスだ。"}, {"t": 96.78333333333333, "x": "日本から来ていた夫婦が、市内で銃で撃たれた。"}, {"t": 99.7, "x": "妻の一美さんが重体になり、夫は脚にけがをした。"}, {"t": 103.03333333333333, "x": "ここから先の様子は、話さない。"}, {"t": 105.38333333333334, "x": "ええ。"}, {"t": 105.9, "x": "このときの日本側の動きは、\n実は国会の記録に残っている。"}, {"t": 109.86666666666666, "x": "1984年5月9日、衆議院の外務委員会だ。"}, {"t": 113.88333333333334, "x": "外務省の担当者が、当時の記録を\nたどってこう説明している。"}, {"t": 117.76666666666667, "x": "一美さんは、はじめは民間の旅客機で\n日本へ運ぶことも考えられていた。"}, {"t": 122.3, "x": "ところが容体が悪化して、\n病院側から、民間機では無理だ、"}, {"t": 126.05, "x": "設備の整った米軍の病院機を\n使うべきではないか、という示唆があった。"}, {"t": 130.6, "x": "そこで家族から、外務省がアメリカ側とかけ合って、"}, {"t": 133.68333333333334, "x": "移送の手配ができるように\n協力してほしい、という依頼があった。"}, {"t": 137.45, "x": "在米の大使館を通じて、アメリカの国務省の領事部に\n依頼して、それが実現した。"}, {"t": 142.85, "x": "……軍の飛行機で、日本に運ばれたのね。"}, {"t": 145.55, "x": "そうだ。そして費用の話まで、国会で答弁されている。"}, {"t": 149.23333333333332, "x": "三千九百五十五ドル。"}, {"t": 150.75, "x": "1982年6月にアメリカ側から\n請求が来て、本人が支払った。"}, {"t": 155.85, "x": "1982年7月9日付で、米空軍省の担当者から\n領収証が来ていて、その写しは外務省のファイルにも"}, {"t": 163.48333333333332, "x": "入っている、とまで述べている。"}, {"t": 165.18333333333334, "x": "ずいぶん細かいのね。"}, {"t": 166.63333333333333, "x": "この細かさが、あとで意味を持つ。"}, {"t": 168.73333333333332, "x": "なぜ国会で領収証の日付まで問われたのか。\nその理由は、次の章から見えてくる。"}, {"t": 173.81666666666666, "x": "先に確認しておく。この銃撃について、本人は\n2003年に日本の最高裁で無罪が確定している。"}, {"t": 180.41666666666666, "x": "いまから話すのは、その確定より二十年近く前の話だ。"}, {"t": 184.95, "x": "一美さんは、意識が戻らないまま、\n1982年11月に亡くなった。"}, {"t": 190.1, "x": "撃たれてから、およそ一年後だ。"}, {"t": 192.26666666666668, "x": "……一年、目を覚まさなかったのね。"}, {"t": 194.46666666666667, "x": "そうだ。ここで、ひとつ整理しておきたいことがある。"}, {"t": 197.53333333333333, "x": "この時点で、日本の警察は\nこの銃撃を捜査していない。"}, {"t": 201.1, "x": "事件が起きたのはアメリカで、\n捜査をしていたのもアメリカの当局だ。"}, {"t": 205.1, "x": "日本の報道も、当時は「アメリカで日本人夫婦が\n巻き込まれた事件」として扱っていた。"}, {"t": 210.75, "x": "巻き込まれた側、ということ。"}, {"t": 212.75, "x": "そうだ。1982年3月、衆議院の外務委員会で、\n伊藤公介議員がこの夫婦に触れている。"}, {"t": 219.35, "x": "文脈は、外国で日本人が通り魔のような\n事件に巻き込まれたときに、"}, {"t": 223.53333333333333, "x": "国の補償の制度を\n使えるようにできないか、という質問だった。"}, {"t": 227.45, "x": "つまり、この時点では被害に遭った\n家庭として国会で語られている。"}, {"t": 231.58333333333334, "x": "……最初はそうだったのね。"}, {"t": 233.16666666666666, "x": "それが二年もしないうちに、正反対の扱いに変わる。"}, {"t": 236.53333333333333, "x": "その変わり方について、のちに\n元警視総監の下稲葉耕吉議員が、\n国会でこう振り返っている。"}, {"t": 242.6, "x": "最初は大変この人物を褒めたたえているわけです、\n美談として報道されたんですね、と。"}, {"t": 247.98333333333332, "x": "ところが、しばらくたちますと、今度は"}, {"t": 250.43333333333334, "x": "「あんな憎い男性はいない」ということで、これ\nまたマスコミがわっと騒ぎ立てた事件です、と。"}, {"t": 255.91666666666666, "x": "1993年3月11日、参議院の予算委員会での発言だ。"}, {"t": 260.8833333333333, "x": "褒めたたえる側から、憎む側へ。"}, {"t": 262.9, "x": "同じ報道機関が、同じ人物について、\n二年で向きを変えた。"}, {"t": 267.05, "x": "そして、この人が銃撃について無罪が\n確定するのは、そこから二十年後のことになる。"}, {"t": 273.1, "x": "向きが変わったのは、1984年だ。"}, {"t": 276.05, "x": "週刊誌が、この銃撃をめぐる連載を始めた。"}, {"t": 278.96666666666664, "x": "「疑惑の銃弾」という題名だった。"}, {"t": 281.31666666666666, "x": "その題名だけは、聞いたことがあるわ。"}, {"t": 283.73333333333335, "x": "そこから「ロス疑惑」という言い方が広まっていく。"}, {"t": 286.9166666666667, "x": "ただ、私はここで、その記事の中身を\n読み上げることはしない。"}, {"t": 290.85, "x": "どうして。"}, {"t": 291.68333333333334, "x": "この回は、その中身を確かめられる立場にないからだ。\nそして、その中身が問われた事件については、"}, {"t": 297.7, "x": "無罪が確定している。"}, {"t": 299.31666666666666, "x": "代わりに、確実な日付を一つ出す。"}, {"t": 301.7, "x": "1984年1月21日だ。"}, {"t": 304.65, "x": "この日、本人が、\nその週刊誌の編集部の氏名不詳の人物を相手取って、"}, {"t": 309.3666666666667, "x": "名誉毀損の罪で告訴状を出している。"}, {"t": 311.95, "x": "……告訴した側だったのね。"}, {"t": 313.71666666666664, "x": "そうだ。これは国会の記録で確認できる。"}, {"t": 316.46666666666664, "x": "1984年3月2日、衆議院の法務委員会で、\n法務省の刑事局長がこう答弁している。"}, {"t": 322.98333333333335, "x": "本年1月21日に三浦和義氏から、"}, {"t": 325.8333333333333, "x": "株式会社文芸春秋社週刊文春編集部内氏名不詳者を\n被告訴人といたしまして、"}, {"t": 331.4, "x": "名誉棄損の罪での告訴状が出ております。"}, {"t": 334.21666666666664, "x": "告訴の中身も説明されている。"}, {"t": 336.3333333333333, "x": "あたかも告訴人が金銭のために銃撃事件などに関して\n決定的な役割を演じたかのような記事を掲載し、"}, {"t": 342.75, "x": "販売して、名誉を毀損した、という内容だ。"}, {"t": 345.8833333333333, "x": "そして、この告訴を受理して、現在、\n東京地検で捜査中である、と。"}, {"t": 350.55, "x": "じゃあ、この時点では警察も検察も、\n殺人の捜査はしていなかったの。"}, {"t": 355.18333333333334, "x": "していない。していたのは、\n名誉毀損の告訴を受けた側の捜査だ。"}, {"t": 359.2, "x": "順番を、間違えないようにしたい。"}, {"t": 361.3, "x": "この人は、のちに銃撃について無罪が\n確定する。そして1984年1月の時点では、"}, {"t": 367.35, "x": "記事によって名誉を傷つけられたと訴え出た人だった。"}, {"t": 371.3, "x": "ここが、この回でいちばん見てほしい\n日付かもしれない。"}, {"t": 374.48333333333335, "x": "1984年2月24日、参議院の予算委員会。"}, {"t": 378.55, "x": "野末陳平議員が、本題に入る前に、\n一問だけ、と断ってこう質問している。"}, {"t": 383.81666666666666, "x": "最近、世間をにぎわしております\n例のロサンゼルスの事件ですね、\n「疑惑の銃弾」というあれですが、と。"}, {"t": 389.95, "x": "マスコミの取材合戦ばかりが\nエスカレートしておりまして、国民の間には、"}, {"t": 394.28333333333336, "x": "当局はどうなっているんだろう、\nどういうふうにしているんだ、\nそんなような関心も高まっている、と。"}, {"t": 399.9166666666667, "x": "国民が、報道を見て、当局を心配してるのね。"}, {"t": 403.3333333333333, "x": "逆なんだ。普通は、捜査が\n動いて、それを報道が追う。"}, {"t": 406.8833333333333, "x": "このときは、報道が先に走っていて、国会が\n「当局は何をしているんだ」と聞いている。"}, {"t": 412.51666666666665, "x": "では、警察庁はなんと答えたか。"}, {"t": 414.78333333333336, "x": "答弁したのは警察庁の刑事局長だ。こう言っている。"}, {"t": 418.23333333333335, "x": "昨年の11月に家出人の捜索願が出された、\nその捜索願に関係して、現在、"}, {"t": 423.9, "x": "関係警察で事実調査を含めまして\n実態の把握に努めております、と。"}, {"t": 428.73333333333335, "x": "……実態の把握。"}, {"t": 429.95, "x": "そうだ。捜査ではない。"}, {"t": 431.3, "x": "「実態の把握」だ。"}, {"t": 432.8, "x": "しかも、それはロサンゼルスの銃撃のことですらない。"}, {"t": 435.8, "x": "別の届け出に関する話だ。"}, {"t": 437.93333333333334, "x": "野末議員が重ねて、アメリカにも協力を\n依頼しているのか、と聞くと、局長はこう答える。"}, {"t": 443.56666666666666, "x": "具体的な調査の内容、それから\n依頼先等につきましては、"}, {"t": 447.21666666666664, "x": "関係先のそれぞれの都合がございますので、この席で\nお答えをするというわけにはまいらない、と。"}, {"t": 452.8, "x": "つまり1984年2月の時点で、警察が\n国会で言えたのは、実態の把握に\n努めている、それだけだった。"}, {"t": 460.2, "x": "それなのに、世間はもう答えを\n知った気になっていた、と。"}, {"t": 463.73333333333335, "x": "そういうことになる。そして最終的に、\n銃撃については無罪が確定する。"}, {"t": 469.03333333333336, "x": "その一週間後だ。1984年3月2日、\n衆議院の法務委員会。"}, {"t": 474.1666666666667, "x": "稲葉誠一議員が、法務省に対してこう切り出している。"}, {"t": 477.56666666666666, "x": "何か一つの事件が起きたのか起きないのかわけが\nわからない、その段階でわあわあわあ"}, {"t": 482.6666666666667, "x": "騒いで、と。"}, {"t": 483.2, "x": "それは取材なり報道の自由であることは"}, {"t": 485.45, "x": "間違いありませんけれども、どうも少し度が過ぎておる\n場合もなきにしもあらずではないか、と。"}, {"t": 490.6666666666667, "x": "……起きたのか起きないのか\nわからない段階、って言ってるわね。"}, {"t": 493.96666666666664, "x": "ここが正確だ。1984年3月の時点では、犯罪が\n成立するのかどうかも、まだ誰にも分かっていない。"}, {"t": 501.25, "x": "そのうえで稲葉議員は、人権擁護局長に質問する。"}, {"t": 504.75, "x": "本人の側から人権擁護の窓口に\n申し立てがあったと伝えられているが、"}, {"t": 509.0, "x": "どういう点について申し立てがあったのか、と。"}, {"t": 511.76666666666665, "x": "これに対してどう対処していくのか、と聞いている。"}, {"t": 514.8166666666667, "x": "本人が、報道の被害を訴えていたのね。"}, {"t": 517.6666666666666, "x": "この時点ではそうだ。"}, {"t": 518.8333333333334, "x": "逮捕されてもいない。"}, {"t": 520.0, "x": "起訴もされていない。"}, {"t": 521.2666666666667, "x": "そして繰り返すが、のちに\n銃撃については無罪が確定する。"}, {"t": 525.0666666666667, "x": "「報道が先に走った」というのは、\n私の感想ではない。"}, {"t": 528.7, "x": "1984年の国会で、現に議員がそう指摘していて、\nそれが会議録に残っている、という事実だ。"}, {"t": 535.55, "x": "……感想じゃなくて、記録なのね。"}, {"t": 537.7166666666667, "x": "そうだ。しかも指摘は、ここで終わらない。"}, {"t": 540.9333333333333, "x": "1984年3月31日、参議院の逓信委員会。"}, {"t": 545.1666666666666, "x": "放送を所管する委員会だ。"}, {"t": 547.0166666666667, "x": "中村鋭一議員が、この件の報道について、\nこんな指摘をしている。"}, {"t": 551.2333333333333, "x": "この報道には顕著な特色がございました、と。"}, {"t": 554.2166666666667, "x": "テレビにおきましては民間放送は終始執拗に、\n場合によっては少し煩雑にわたるぐらいに、"}, {"t": 559.5666666666667, "x": "朝も夜もこの事件を報道しておりました、と。"}, {"t": 562.5833333333334, "x": "ところが、放送局によっては、報道量が\n民放に比較して極端に少なかった、と。"}, {"t": 568.2166666666667, "x": "……同じ時期に、まったく違う\n判断をした放送局があったのね。"}, {"t": 572.1333333333333, "x": "そうだ。中村議員は、その理由を尋ねている。"}, {"t": 575.1333333333333, "x": "そして、こう確かめ直している。"}, {"t": 577.2, "x": "ということはあれですか、\n三浦和義さん自身の人権というものを考えて、"}, {"t": 581.4333333333333, "x": "確たる証拠もないのにさような報道はできない、"}, {"t": 584.05, "x": "端的に言えばそういうことで報道を\n差し控えておられたわけですか、と。"}, {"t": 588.25, "x": "確たる証拠もないのに、ね。"}, {"t": 590.25, "x": "私がこの章を入れたのは、比較ができるからだ。"}, {"t": 593.2833333333333, "x": "同じ日、同じ材料で、朝も夜も流し続けた側と、"}, {"t": 596.7666666666667, "x": "確たる証拠がないから流さないと\n判断した側が、両方あった。"}, {"t": 600.8833333333333, "x": "つまり「あの時代はみんなそうだった」では済まない。"}, {"t": 603.7333333333333, "x": "判断した人がいたということだ。"}, {"t": 606.0166666666667, "x": "……選べたのね。"}, {"t": 607.0666666666667, "x": "選べた。そして、銃撃について無罪が\n確定するのは、この十九年後になる。"}, {"t": 612.0666666666667, "x": "その十九年のあいだ、報道の量は減らなかった。"}, {"t": 615.7833333333333, "x": "1985年9月12日の午前零時ごろ、\n本人は警視庁に逮捕された。"}, {"t": 621.05, "x": "ここで、どうしても\n押さえておかなければならないことがある。"}, {"t": 624.2166666666667, "x": "このとき逮捕された容疑は、11月の銃撃ではない。"}, {"t": 627.7833333333333, "x": "えっ。"}, {"t": 628.4166666666666, "x": "1981年の夏に、ロサンゼルスのホテルで\n一美さんが襲われた、別の事件だ。"}, {"t": 634.0833333333334, "x": "これを「殴打事件」と呼ぶ。"}, {"t": 635.7333333333333, "x": "容疑は殺人未遂だった。"}, {"t": 637.5333333333333, "x": "この二つは、最後まで別々の事件として扱われる。\nここを混ぜると、何もかも分からなくなる。"}, {"t": 643.5833333333334, "x": "じゃあ、もう一度整理して。"}, {"t": 645.3833333333333, "x": "いいだろう。一つ目が、1981年の夏の殴打事件。"}, {"t": 649.3333333333334, "x": "殺人未遂だ。こちらは、のちに有罪が確定する。"}, {"t": 652.9166666666666, "x": "二つ目が、1981年11月の銃撃事件。"}, {"t": 656.6833333333333, "x": "殺人だ。こちらが、2003年に無罪が確定する。"}, {"t": 660.4166666666666, "x": "同じ人、同じ年、同じ街。だが、\n罪名も、結論も違う。"}, {"t": 665.0666666666667, "x": "……有罪と無罪が、両方あるのね。"}, {"t": 667.3333333333334, "x": "そうだ。だから「あの人は有罪だった」も\n「あの人は無罪だった」も、\nどちらもそのままでは正しくない。"}, {"t": 673.8833333333333, "x": "これは私が整理した言い方ではない。"}, {"t": 676.1, "x": "のちに参議院に提出された\n質問主意書に、こう書かれている。"}, {"t": 679.8833333333333, "x": "日本の裁判所において、\n元妻への殴打事件については有罪、"}, {"t": 683.55, "x": "銃撃事件については無罪が\nそれぞれ確定している、と。"}, {"t": 687.15, "x": "政府に対して出された公式の文書に、そう書いてある。"}, {"t": 690.4833333333333, "x": "この回で「無罪が確定している」と\n言うときは、常に銃撃事件のことを指している。"}, {"t": 696.2833333333333, "x": "逮捕から三か月後、国会が\nこの逮捕そのものを議題にした。"}, {"t": 700.15, "x": "1985年12月19日、参議院の法務委員会。"}, {"t": 704.2333333333333, "x": "会議録の「本日の会議に付した案件」に、\nこう書かれている。"}, {"t": 708.2333333333333, "x": "三浦和義君逮捕に際しての人権問題等に関する件。"}, {"t": 712.1, "x": "……逮捕のやり方が、国会の議題になったの。"}, {"t": 715.0166666666667, "x": "なった。質問に立ったのは寺田熊雄議員だ。"}, {"t": 717.9166666666666, "x": "まず、逮捕の場所だ。"}, {"t": 719.2333333333333, "x": "銀座のホテルの地下駐車場だった。"}, {"t": 721.4833333333333, "x": "寺田議員は、逮捕の状況が余りにも\nドラマチックに仕組まれていた、と言っている。"}, {"t": 726.1833333333333, "x": "現場からは「三浦がただいま出ました」という\nテレビ中継までなされていた。"}, {"t": 730.5166666666667, "x": "だから、あらかじめ"}, {"t": 731.6, "x": "警察が逮捕の日時や場所をマスコミに\n漏らしていたのではないか、という疑いを\n持たざるを得ない、と質している。"}, {"t": 738.0166666666667, "x": "中継されてたのね……。"}, {"t": 739.4833333333333, "x": "次が時刻だ。逮捕が午前零時ごろ。"}, {"t": 741.7666666666667, "x": "警視庁に到着したのが午前零時二十七分。"}, {"t": 744.7666666666667, "x": "寺田議員は、深夜に銀座から警視庁まで行くにしては\n時間がかかり過ぎているのではないか、と指摘する。"}, {"t": 750.9833333333333, "x": "報道陣が警視庁の前に総ぞろいするのを\n待っていたのではないか、時間稼ぎではないか、と。"}, {"t": 756.5666666666667, "x": "そして到着したときだ。"}, {"t": 758.1, "x": "警視庁の前に待ち構えていた\n報道陣は、約四百五十人。"}, {"t": 762.0666666666667, "x": "ロープで仕切られて機動隊員に守られた通路を、"}, {"t": 764.65, "x": "両わきを捜査員に抱えられて\n歩かされた。その距離が三十メートルだ。"}, {"t": 769.0833333333334, "x": "三十メートル……。"}, {"t": 770.2333333333333, "x": "寺田議員はこう言っている。"}, {"t": 771.75, "x": "警視庁には裏門がある、そこから\n車を入れればいいじゃないか、と。"}, {"t": 775.6166666666667, "x": "なぜそんなにカメラの放列の前に、\n殊さらに手錠をかけて腰ひもをつけて、"}, {"t": 779.9833333333333, "x": "天下衆人環視の中を被疑者を歩かせるのか、と。"}, {"t": 783.3166666666667, "x": "これほど被疑者の人権を\n侵害することはないでしょう、と。"}, {"t": 786.6166666666667, "x": "この時点で、銃撃事件については\nまだ何も決まっていない。"}, {"t": 790.0666666666667, "x": "無罪が確定するのは、この十八年後だ。"}, {"t": 793.55, "x": "同じ日の質疑は、そこから三つの方向に広がっていく。"}, {"t": 797.1166666666667, "x": "一つ目。当時すでに退職していた元の警視総監が、\n週刊誌のインタビューに答えていた。"}, {"t": 802.85, "x": "その中で、まだ起訴もされていない\n別の事件についてまで\n「容疑は極めて濃厚です」と語っていた。"}, {"t": 809.0, "x": "寺田議員は、これを強い言葉で批判している。"}, {"t": 811.85, "x": "公務員が自分の扱った事件について、\n得々として容疑が濃厚であるなどと語るのは、"}, {"t": 817.0333333333333, "x": "公務員としての心構えが全くできておらぬ、と。"}, {"t": 820.3833333333333, "x": "もう公務員としてのモラルの基礎ができておらぬ、\n遺憾千万だ、と。"}, {"t": 824.5333333333333, "x": "……捜査した側が、外で断定してたのね。"}, {"t": 827.35, "x": "二つ目。裁判所の中の話だ。"}, {"t": 829.7666666666667, "x": "弁護人の一人が担当部の書記官室に行ったところ、\nこの件を扱った週刊誌が山と積まれていた、という。"}, {"t": 836.3666666666667, "x": "寺田議員は、書記官が読みたいと思うのは当然かも\nしれない、と一度断ったうえで、こう続ける。"}, {"t": 842.25, "x": "担当部にあまり積まれていると、裁判官もこれを\n読むのではないかと弁護人が考えないでもない、と。"}, {"t": 848.0833333333334, "x": "裁判がこういうマスコミフィーバーに\n影響されては困る、と。"}, {"t": 851.55, "x": "……裁判所まで届いてたの。"}, {"t": 853.3166666666667, "x": "三つ目。家族の話だ。"}, {"t": 855.1833333333333, "x": "本人の両親から寺田議員に届いた\n手紙が、委員会で読まれている。"}, {"t": 859.35, "x": "マスコミが家を包囲して取材に\n狂奔するため、一時は買い物にも行けない、"}, {"t": 863.65, "x": "食料難に陥ったこともあります、と。"}, {"t": 866.3166666666667, "x": "そして、二人の子どもが幼稚園と\n保育園に通うこともできなくなって、\n退園のやむなきに至った、と。"}, {"t": 872.55, "x": "寺田議員は、本人が仮に有罪であったとしても\n子供には何の罪もない、とはっきり言っている。"}, {"t": 878.2333333333333, "x": "報道に追われて事業も閉鎖に追い込まれた、という\n訴えも同じ場で読み上げられている。"}, {"t": 883.0166666666667, "x": "そして、この銃撃事件については、\nのちに無罪が確定する。"}, {"t": 887.55, "x": "ここで一度、制度の話に切り替える。"}, {"t": 890.0333333333333, "x": "素朴な疑問があるはずだ。"}, {"t": 891.5333333333333, "x": "事件が起きたのはアメリカなのに、\nどうして日本の裁判所が裁いたんだ、と。"}, {"t": 896.2166666666667, "x": "それ、ずっと引っかかってたわ。"}, {"t": 898.25, "x": "答えは、刑法の第三条にある。"}, {"t": 900.2666666666667, "x": "見出しは「国民の国外犯」だ。"}, {"t": 902.65, "x": "条文はこうだ。この法律は、日本国外において\n次に掲げる罪を犯した日本国民に適用する。"}, {"t": 908.9333333333333, "x": "そして、そこに並んでいる罪の七番目に、\n殺人の罪およびその未遂罪が入っている。"}, {"t": 914.45, "x": "……外国でやっても、日本の刑法がついていくのね。"}, {"t": 917.6333333333333, "x": "そうだ。日本の刑法は、日本人については\n国境を越えて追いかける。"}, {"t": 921.7666666666667, "x": "だから、ロサンゼルスで起きたことを、\n東京の裁判所が裁くことができた。"}, {"t": 926.2333333333333, "x": "これは例外ではない。"}, {"t": 927.3333333333334, "x": "放火も、傷害も、監禁も、詐欺も、\n名誉毀損まで、この第三条に並んでいる。"}, {"t": 932.8666666666667, "x": "ここを押さえておかないと、\nあとの話が分からなくなる。"}, {"t": 936.1333333333333, "x": "どういうこと。"}, {"t": 937.1333333333333, "x": "日本の刑法が国境を越えて\n追いかけるということは、裏を返すと、"}, {"t": 940.8833333333333, "x": "他の国の刑法も、その国の考え方で\n誰かを追いかけるということだ。"}, {"t": 945.4666666666667, "x": "同じ一つの出来事に、二つの国の法律が\n同時にかかることがある。"}, {"t": 949.8, "x": "ふだんは、どちらかの国で裁判をすれば、\nそれで終わったように見える。"}, {"t": 953.7666666666667, "x": "この事件では、そう見えていたものが、\n二十七年後にひっくり返った。"}, {"t": 958.0, "x": "そして先に結論を言っておく。"}, {"t": 959.8166666666667, "x": "銃撃事件について無罪が確定したという\n日本の結論は、いまも動いていない。"}, {"t": 965.3, "x": "日本の裁判に戻る。\n二つの事件が、別々に進んでいく。"}, {"t": 969.3333333333334, "x": "まず、1981年の夏の殴打事件だ。罪名は殺人未遂。"}, {"t": 974.0, "x": "この裁判について、国会に\nはっきりした記録が残っている。"}, {"t": 977.6833333333333, "x": "1988年5月10日、衆議院の法務委員会。"}, {"t": 981.4, "x": "坂上富男議員の発言だ。"}, {"t": 983.4166666666666, "x": "第一審は懲役六年で、いま\n控訴している、という趣旨のことを述べている。"}, {"t": 987.85, "x": "この殴打事件は、のちに有罪が確定する。"}, {"t": 990.7333333333333, "x": "こっちは有罪なのね。"}, {"t": 992.2666666666667, "x": "そうだ。そして同じ日、坂上議員はもう\n一つ、重要なことを国会で取り上げている。"}, {"t": 997.5833333333334, "x": "アメリカのロサンゼルスの検事局が、\nこの人を起訴したというのだ。"}, {"t": 1001.5166666666667, "x": "しかも、その罪名が二つある。"}, {"t": 1003.4666666666667, "x": "殺人罪と、共謀罪だ。"}, {"t": 1005.55, "x": "……1988年の時点で、アメリカはもう起訴してたの。"}, {"t": 1009.5666666666667, "x": "そう報じられ、国会でも取り上げられていた。"}, {"t": 1012.2166666666667, "x": "坂上議員は、ロス検事局の起訴と、いま日本で"}, {"t": 1014.6833333333333, "x": "進んでいる裁判との関係をどう\n理解したらいいのか、と法務省に尋ねている。"}, {"t": 1019.9833333333333, "x": "二十年後に問題になる論点が、このとき\nすでに国会に出ていたことになる。"}, {"t": 1024.55, "x": "ただし、当時はそれ以上進まなかった。"}, {"t": 1026.9, "x": "本人は日本にいて、日本で裁判を受けていたからだ。"}, {"t": 1030.3666666666666, "x": "日本にいるあいだは、何も起きなかった、と。"}, {"t": 1033.2, "x": "そういうことだ。ここは、あとで効いてくる。"}, {"t": 1035.7166666666667, "x": "そして、もう一つの事件、11月の銃撃事件は、\nこのあと十五年かけて結論に向かう。"}, {"t": 1041.55, "x": "結論は、無罪の確定だ。"}, {"t": 1044.1333333333334, "x": "銃撃事件の裁判は、一審と\n二審で結論がひっくり返った。"}, {"t": 1048.2, "x": "一審の東京地方裁判所は、有罪とした。"}, {"t": 1051.0, "x": "言い渡された刑は、無期懲役だ。"}, {"t": 1053.3666666666666, "x": "……無期懲役。"}, {"t": 1054.4166666666667, "x": "そうだ。1994年のことだ。"}, {"t": 1057.0, "x": "ところが控訴審の東京高等裁判所は、これを\n取り消して、無罪を言い渡した。1998年だ。"}, {"t": 1063.7333333333333, "x": "一審が無期懲役、二審が無罪。これ\n以上ないほど、大きくひっくり返っている。"}, {"t": 1068.55, "x": "この経過は、国会でも語られている。"}, {"t": 1070.95, "x": "2004年4月21日、衆議院の法務委員会で、\n辻惠議員がこう述べている。"}, {"t": 1076.2166666666667, "x": "三浦和義さんの裁判において、判決は、第一審は\n無期懲役であった、第二審は無罪判決になった、と。"}, {"t": 1083.2333333333333, "x": "……どうして、そこまで逆になるの。"}, {"t": 1085.4, "x": "私は、その中身の評価には立ち入らない。"}, {"t": 1087.95, "x": "判決の理由を原文で確かめられていないからだ。"}, {"t": 1091.0666666666666, "x": "確かめられていないことを、それらしく語るのが\nいちばんよくない。この回は、そこを守る。"}, {"t": 1096.3333333333333, "x": "言えるのは、事実の並びだけだ。"}, {"t": 1098.45, "x": "一審は有罪。二審は無罪。そして検察は、\n二審の無罪を受け入れず、最高裁に上告した。"}, {"t": 1104.6166666666666, "x": "まだ続くのね。"}, {"t": 1105.8166666666666, "x": "続く。ただ、ここで一つだけ数えておきたい。"}, {"t": 1108.7833333333333, "x": "1985年9月の逮捕から、\n1998年の二審判決まで、十三年ある。"}, {"t": 1115.1166666666666, "x": "その十三年のあいだ、この人は\n「疑惑の人」として名前を呼ばれ続けた。"}, {"t": 1119.95, "x": "そして二審は、その呼び方を支える\n有罪判決を、取り消したことになる。"}, {"t": 1124.5166666666667, "x": "この二審の無罪が、五年後にそのまま\n無罪が確定する形につながっていく。"}, {"t": 1129.8833333333334, "x": "2003年3月5日。"}, {"t": 1131.6666666666667, "x": "最高裁判所が、検察の上告を退けた。上告棄却だ。"}, {"t": 1135.85, "x": "これで、銃撃事件の無罪が確定した。"}, {"t": 1138.6833333333334, "x": "……終わったのね。"}, {"t": 1139.7166666666667, "x": "日本の刑事手続としては、終わった。\nここから先は、もう蒸し返せない。"}, {"t": 1144.3333333333333, "x": "その根拠になっているのが、\n日本国憲法の第三十九条だ。条文を読む。"}, {"t": 1149.1666666666667, "x": "何人も、実行の時に適法であつた行為又は\n既に無罪とされた行為については、\n刑事上の責任を問はれない。"}, {"t": 1156.15, "x": "又、同一の犯罪について、重ねて\n刑事上の責任を問はれない。"}, {"t": 1160.5833333333333, "x": "これが、一事不再理ね。"}, {"t": 1162.3833333333334, "x": "そう呼ばれている。ただし、\nここで妙なことを一つ言っておく。"}, {"t": 1165.9166666666667, "x": "「一事不再理」という言葉そのものには、\n法令上の定義が無い。"}, {"t": 1169.8333333333333, "x": "……えっ。"}, {"t": 1170.4333333333334, "x": "これは私の解釈ではない。のちに\n政府が答弁書ではっきり書いている。"}, {"t": 1174.65, "x": "お尋ねの「一事不再理」については、\n法令上の定義はないが、"}, {"t": 1178.4333333333334, "x": "日本国憲法第三十九条はこう\n規定している、という書き方だ。"}, {"t": 1182.7166666666667, "x": "つまり、条文としてあるのは憲法三十九条であって、"}, {"t": 1185.9333333333334, "x": "「一事不再理」は、\nその考え方につけられた呼び名だ。"}, {"t": 1189.5666666666666, "x": "この違いが、五年後に効いてくる。"}, {"t": 1191.85, "x": "呼び名と、条文は、別ということ。"}, {"t": 1194.3666666666666, "x": "そうだ。憲法三十九条が誰に向かって\n書かれているのか。そこが、この回の分かれ目になる。"}, {"t": 1200.0666666666666, "x": "とにかく2003年3月5日、\n銃撃事件について、無罪が確定した。"}, {"t": 1204.95, "x": "この時点で、日本ではもう誰も、\nこの件でこの人を起訴できなくなった。"}, {"t": 1209.9666666666667, "x": "ここで、まったく別の場所で\n起きていたことを重ねたい。"}, {"t": 1213.2, "x": "無罪が確定した2003年3月5日。\nその五か月後の2003年8月だ。"}, {"t": 1218.4333333333334, "x": "日本とアメリカが、刑事に関する\n共助の条約に署名している。"}, {"t": 1222.1166666666666, "x": "日米刑事共助条約だ。"}, {"t": 1224.0833333333333, "x": "……偶然よね。"}, {"t": 1225.0833333333333, "x": "偶然だ。この事件のために結ばれた条約ではない。"}, {"t": 1228.3, "x": "ただ、この条約が何を変えたのかは、\n知っておいたほうがいい。"}, {"t": 1231.8666666666666, "x": "法務省の犯罪白書に、こう書かれている。"}, {"t": 1234.3666666666666, "x": "平成19年版の第二編だ。"}, {"t": 1236.6166666666666, "x": "我が国は、捜査協力関係の一層の強化を目指し、\n2003年8月、日米刑事共助条約の署名に至った。"}, {"t": 1244.0166666666667, "x": "同条約は、2006年6月に批准書を\n交換し、同年7月に発効した、と。"}, {"t": 1249.5166666666667, "x": "そして、ここからが本題だ。"}, {"t": 1251.45, "x": "この条約では、共助の請求や受理を行う\n「中央当局」というものを、あらかじめ決めておく。"}, {"t": 1257.2666666666667, "x": "日本側は、法務大臣、もしくは国家公安委員会、\nまたはそれらが指定する者だ。"}, {"t": 1262.4666666666667, "x": "条約が発効すると、どうなるか。"}, {"t": 1264.55, "x": "白書はこう書いている。"}, {"t": 1266.0, "x": "外交ルートを経由することなく、\n日本の法務省または警察庁が、"}, {"t": 1269.95, "x": "アメリカの司法当局に対し、直接、\n共助の請求をすることができる。"}, {"t": 1274.6166666666666, "x": "同様に、アメリカの司法当局からも、日本の法務省に\n対し、直接、共助の請求がなされることとなる、と。"}, {"t": 1281.75, "x": "……外務省を通さないで、直接なのね。"}, {"t": 1284.3333333333333, "x": "そうだ。2006年7月から、その回路が開いた。"}, {"t": 1287.9, "x": "無罪が確定したのが2003年3月。"}, {"t": 1290.4333333333334, "x": "回路が開いたのが2006年7月。"}, {"t": 1292.85, "x": "逮捕はその一年七か月後だ。"}, {"t": 1295.1, "x": "並べても、それは因果関係にはならない。\nただ、時計としては、こう並んでいる。"}, {"t": 1300.6166666666666, "x": "2008年2月。本人はサイパンにいた。"}, {"t": 1303.4166666666667, "x": "そこで、アメリカの捜査当局に逮捕された。"}, {"t": 1306.1166666666666, "x": "容疑は、1981年11月の銃撃をめぐるものだ。"}, {"t": 1310.4666666666667, "x": "……日本で無罪が確定した、あの銃撃ね。"}, {"t": 1313.2833333333333, "x": "そうだ。無罪が確定してから、五年後のことになる。"}, {"t": 1316.6, "x": "ここで、地理の確認をしておきたい。\nとても大事なところだ。"}, {"t": 1320.2333333333333, "x": "サイパンは、北マリアナ諸島にある。"}, {"t": 1322.2666666666667, "x": "北マリアナ諸島は、アメリカの自治領だ。"}, {"t": 1324.9666666666667, "x": "つまり……アメリカの中、ということ。"}, {"t": 1327.3833333333334, "x": "そういうことになる。これが何を意味するか。"}, {"t": 1329.9166666666667, "x": "日本からアメリカへ「引き渡した」のではない。"}, {"t": 1332.65, "x": "日本は、何もしていない。"}, {"t": 1334.3, "x": "何もできる場面が無かった。"}, {"t": 1336.25, "x": "本人が自分でそこへ行き、そこはアメリカの当局が\n権限を持つ場所だった。それだけだ。"}, {"t": 1341.6833333333334, "x": "政府の答弁書にも、その痕跡が残っている。"}, {"t": 1344.7, "x": "日本の総領事館が連絡を取った相手として、\n北マリアナ諸島検事局、という名前が出てくる。"}, {"t": 1350.55, "x": "外務省は、逮捕の理由を確認し、家族と\n連絡を取りながら領事面会を行った。"}, {"t": 1355.75, "x": "健康状態を確かめ、留置の状況や\n待遇についての要望を聞き取って、\n家族や現地の当局に伝えた。"}, {"t": 1362.45, "x": "邦人保護の観点から、必要かつ可能な\n支援を行った、と答弁書は書いている。"}, {"t": 1367.65, "x": "……できるのは、そこまでなのね。"}, {"t": 1369.6333333333334, "x": "そこまでだ。無罪が確定していることを理由に、\n釈放させる権限は、日本政府には無い。"}, {"t": 1375.3, "x": "なぜ無いのか。それを、\n次の二つの章で条文から確かめる。"}, {"t": 1379.75, "x": "逮捕の四日後、2008年2月26日。"}, {"t": 1382.75, "x": "衆議院の法務委員会が開かれている。"}, {"t": 1385.15, "x": "この日の質疑は、そのまま全部が資料になる。"}, {"t": 1388.0333333333333, "x": "最初に立ったのが神崎武法議員だ。こう整理している。"}, {"t": 1391.55, "x": "いわゆるロス疑惑につきましては、\n一美さんに対する殺人事件について、"}, {"t": 1395.8333333333333, "x": "日本の裁判所で無罪が確定をいたしております、と。"}, {"t": 1399.25, "x": "このたび、ロス市警が、"}, {"t": 1400.7, "x": "殺人と共謀の罪で\n逮捕したということでございますけれども、\n日本には一事不再理の原則がある、と。"}, {"t": 1407.0333333333333, "x": "ただし、日本の裁判所の効力は"}, {"t": 1409.2666666666667, "x": "外国に及ばないということでは、\nこういうこともあるのかなとは思いますけれども、"}, {"t": 1413.4, "x": "異例の事態だろうと思います、と。"}, {"t": 1415.65, "x": "……国会でも、異例って言ってるのね。"}, {"t": 1417.9333333333334, "x": "法務大臣は鳩山邦夫さんだった。その答えがこれだ。"}, {"t": 1421.4333333333334, "x": "感想としては私もびっくりいたしまして、\nこれは前例のないことだと"}, {"t": 1425.1833333333334, "x": "思うんですね、全く\n類似の例というのはないのだと思います、と。"}, {"t": 1429.2666666666667, "x": "さらに、こうも言っている。"}, {"t": 1430.7833333333333, "x": "もう終わったことだと思っていたものが\nアメリカの司法当局によって逮捕と。"}, {"t": 1434.8166666666666, "x": "世界にはいろいろな\n刑事司法制度があるんだな、と思いました、と。"}, {"t": 1438.9166666666667, "x": "法務大臣も、終わったと思ってたのね。"}, {"t": 1441.55, "x": "そして、驚くのはここからだ。"}, {"t": 1443.4333333333334, "x": "細川律夫議員が、連絡はあったのかと繰り返し聞く。"}, {"t": 1446.95, "x": "大臣の答えは、こうだ。"}, {"t": 1448.6666666666667, "x": "三浦和義という男をサイパンで逮捕したぞという\n連絡を、アメリカから私はいただいておりません。"}, {"t": 1454.3166666666666, "x": "外務省の政府参考人も、こう述べている。"}, {"t": 1457.0166666666667, "x": "現在、この件はアメリカの捜査当局が、"}, {"t": 1459.5666666666666, "x": "アメリカの主権に基づきまして捜査を行っている\n事案であろうと理解しております、と。"}, {"t": 1464.7, "x": "日本で無罪が確定した事件について、\n日本政府は、逮捕の連絡すら受けていなかった。"}, {"t": 1470.75, "x": "ここが、この回の中心だ。"}, {"t": 1472.5, "x": "二つの法律を並べる。"}, {"t": 1474.1833333333334, "x": "一つ目は、国際捜査共助等に関する法律。"}, {"t": 1477.2333333333333, "x": "昭和五十五年の法律だ。"}, {"t": 1479.0666666666666, "x": "外国から「捜査に協力してくれ」と\n頼まれたときの決まりが書いてある。"}, {"t": 1483.5833333333333, "x": "その第二条に、協力してはいけない\n場合が並んでいる。"}, {"t": 1486.7, "x": "数えると、三つしかない。"}, {"t": 1488.5166666666667, "x": "一つ、政治犯罪であるとき。"}, {"t": 1490.4333333333334, "x": "二つ、その行為が日本の法律では罪にならないとき。"}, {"t": 1493.8, "x": "三つ、証人尋問などについて、\n要請する国の必要な書面が無いとき。"}, {"t": 1498.7666666666667, "x": "……「日本で無罪が確定している」は、\n入ってないのね。"}, {"t": 1502.1333333333334, "x": "入っていない。だから政府の答弁は、こうなる。"}, {"t": 1505.0, "x": "同一事件について我が国で判決が\n確定していることは、直ちに\n捜査共助の拒否事由となるものではない。"}, {"t": 1511.4666666666667, "x": "法務大臣も、国会で同じことを\n一般論として述べている。"}, {"t": 1515.1666666666667, "x": "我が国において無罪判決が確定していることは、\n共助の拒否理由にはならない、と。"}, {"t": 1520.2, "x": "では二つ目だ。逃亡犯罪人引渡法。"}, {"t": 1522.9666666666667, "x": "昭和二十八年の法律だ。"}, {"t": 1524.9333333333334, "x": "外国から「その人をこちらへ引き渡してくれ」と\n求められたときの決まりだ。"}, {"t": 1529.7, "x": "その第二条には、引き渡してはならない\n場合が並んでいる。その第七号を読む。"}, {"t": 1534.5, "x": "引渡犯罪に係る事件が\n日本国の裁判所に係属するとき、"}, {"t": 1538.5666666666666, "x": "又は、その事件について日本国の裁判所に\nおいて確定判決を経たとき。"}, {"t": 1543.5166666666667, "x": "……こっちには、書いてある。"}, {"t": 1545.1166666666666, "x": "書いてある。しかも第七号は、条約で\n例外を作れる号にも入っていない。"}, {"t": 1549.6, "x": "つまり、日本にいる人については、日本で確定判決が\n出ている事件で引き渡すことは、できない。"}, {"t": 1555.6833333333334, "x": "第九号には「逃亡犯罪人が\n日本国民であるとき」も並んでいる。"}, {"t": 1560.0333333333333, "x": "日本にいる限り、この人は守られていた。"}, {"t": 1562.5166666666667, "x": "守っていたのは、この第二条第七号だ。"}, {"t": 1565.25, "x": "ところが、この条文は\n「引き渡すかどうか」を決める条文だ。"}, {"t": 1569.2, "x": "本人がすでに外国にいるなら、\n引き渡すという場面が起きない。"}, {"t": 1572.8833333333334, "x": "条文の出番が無い。"}, {"t": 1574.3833333333334, "x": "……国境を越えた瞬間に、働かなくなるのね。"}, {"t": 1577.4166666666667, "x": "そういうことになる。"}, {"t": 1578.45, "x": "銃撃事件の無罪は確定したままなのに、だ。"}, {"t": 1582.1833333333334, "x": "もう一つ、制度の話がある。"}, {"t": 1584.0666666666666, "x": "アメリカが挙げた罪名の話だ。"}, {"t": 1586.1666666666667, "x": "1988年に報じられたときも、2008年の逮捕のときも、\n罪名は二つだった。殺人と、共謀だ。"}, {"t": 1593.8, "x": "共謀って、相談しただけ、ということ。"}, {"t": 1596.6, "x": "ざっくり言えばそうだ。"}, {"t": 1597.7, "x": "英米の法律では、共謀そのものが\n独立した一つの罪になる。"}, {"t": 1601.8, "x": "これは、日本の国会でも制度論として説明されている。"}, {"t": 1605.3, "x": "2017年5月30日、参議院の法務委員会。"}, {"t": 1608.7333333333333, "x": "糸数慶子議員の発言だ。"}, {"t": 1610.7, "x": "共謀罪は英米法で認められているものですが、"}, {"t": 1613.35, "x": "英米法では、その犯罪が実際に\n実行された場合に成立する犯罪とは"}, {"t": 1617.9333333333334, "x": "別個に成立する、すなわち独立罪として\n処罰するとされています、と。"}, {"t": 1622.3833333333334, "x": "そして、こう続ける。"}, {"t": 1623.85, "x": "このことは、\nいわゆるロス疑惑事件の被疑者とされた方が、"}, {"t": 1627.25, "x": "我が国において殺人罪で無罪が確定した後に、"}, {"t": 1630.3, "x": "サイパンにいた際にアメリカのロサンゼルス警察に\nよる殺人の共謀罪容疑で"}, {"t": 1634.6333333333334, "x": "逮捕されたことからも分かります、と。"}, {"t": 1637.0333333333333, "x": "その際にも二重処罰になるか\nどうかが議論になりました、と。"}, {"t": 1640.8, "x": "……この事件が、制度の説明に使われてるのね。"}, {"t": 1643.8833333333334, "x": "そうだ。同じ審議で、参考人として\n出席した村井敏邦さん、一橋大学の"}, {"t": 1649.4333333333334, "x": "名誉教授も、この件に触れている。"}, {"t": 1651.4333333333334, "x": "ロス疑惑のときに、日本で\n共謀共同正犯としての殺人罪について\n無罪が確定した後に、"}, {"t": 1657.0666666666666, "x": "ロサンゼルスの地方裁判所に\n起訴されたのが、殺人の共謀罪だった、と。"}, {"t": 1661.9166666666667, "x": "そして、その起訴状には「オーバートアクト」、\n日本語で言えば公然たる行為が、"}, {"t": 1666.3833333333334, "x": "二十ぐらい並べて書かれていた、と述べている。"}, {"t": 1669.25, "x": "日本の裁判で問われたのは「殺人」だった。"}, {"t": 1672.0666666666666, "x": "アメリカが残したのは「共謀」だった。"}, {"t": 1674.6833333333334, "x": "罪名が違えば、同じ罪ではない。だから\n二重ではない。そういう理屈が立つ余地があった。"}, {"t": 1680.1166666666666, "x": "……名前が違うだけで。"}, {"t": 1681.5666666666666, "x": "そこが争点になった。\nそして日本での無罪は、動いていない。"}, {"t": 1686.0, "x": "2008年の夏から秋にかけて、\nアメリカの裁判所が判断を出した。"}, {"t": 1690.4333333333334, "x": "先に断っておく。ここから話す\nアメリカ側の判断について、私は公的な\n記録の原文に到達できていない。"}, {"t": 1697.45, "x": "だから、この章は全部\n「そう報じられている」という形で話す。"}, {"t": 1701.7333333333333, "x": "確かめられたところだけ、本物として扱うのね。"}, {"t": 1705.1, "x": "そうだ。報じられた内容は、こうだ。"}, {"t": 1707.45, "x": "ロサンゼルス郡の裁判所は、殺人の訴因については、\n二重に処罰することになるとして退けた。"}, {"t": 1713.5833333333333, "x": "一方で、共謀の訴因については、\nそのまま進められるとした。"}, {"t": 1717.5666666666666, "x": "……半分だけ、通ったのね。"}, {"t": 1719.45, "x": "そう報じられている。ただし、ここは\n日本の資料ではっきり確かめられる部分がある。"}, {"t": 1724.1833333333334, "x": "参議院に出された質問主意書に、\nその経過がこう書かれている。"}, {"t": 1728.0, "x": "ロサンゼルス郡地方裁判所は\n殺人容疑の逮捕状は無効としたものの、\n共謀容疑の逮捕状を有効として、と。"}, {"t": 1734.8, "x": "結局、本年十月十日にロサンゼルスに移送した、と。"}, {"t": 1738.4833333333333, "x": "つまり、殺人については、アメリカの裁判所も\n「もうやれない」と判断した。"}, {"t": 1743.3166666666666, "x": "日本の無罪確定が、アメリカでも\n効いた部分がある、ということになる。"}, {"t": 1747.5833333333333, "x": "じゃあ、どうして拘束は続いたの。"}, {"t": 1749.8166666666666, "x": "残ったほうの、共謀があったからだ。"}, {"t": 1752.0666666666666, "x": "本人は、サイパンからロサンゼルスへ移されることを\n争っていたが、殺人の訴因が外れたあと、"}, {"t": 1757.6, "x": "移送に応じたと報じられている。"}, {"t": 1759.6333333333334, "x": "拘束は、七か月以上に及んだ。これは\n衆議院に出された質問主意書に、\n七ヶ月以上の拘置、と書いてある。"}, {"t": 1766.6, "x": "そして2008年10月10日、ロサンゼルスに到着する。"}, {"t": 1770.3, "x": "繰り返す。日本では、\n銃撃事件の無罪は確定したままだ。"}, {"t": 1774.9, "x": "2008年10月10日。この日のことは、\n日本政府の答弁書に、時系列で書かれている。"}, {"t": 1780.7, "x": "在ロサンゼルス日本国総領事館では、"}, {"t": 1783.05, "x": "平成二十年十月十日に三浦和義氏が\nロサンゼルスに到着し、と始まる。"}, {"t": 1788.0833333333333, "x": "ロサンゼルス市警察での留置手続を了した後、\n同氏からの要望を受け直ちに領事面会を行い、と続く。"}, {"t": 1794.9, "x": "同氏の健康状態に問題のないことを確認するとともに、\n留置状況、待遇等に関する要望事項を聴取し、と。"}, {"t": 1802.15, "x": "ロサンゼルス市警察側に伝達するなど、\n邦人保護の観点から必要な支援を行った、と。"}, {"t": 1808.0666666666666, "x": "……健康状態に、問題はなかったのね。"}, {"t": 1810.7, "x": "そう書かれている。そしてその同じ日、\n留置施設で死亡が確認された。"}, {"t": 1815.2333333333333, "x": "様子については、話さない。"}, {"t": 1817.1, "x": "死因について、ロサンゼルス郡の検視当局は\n自殺と結論づけたと報じられている。"}, {"t": 1822.15, "x": "一方で、弁護人は独自に病理の専門家に見てもらい、\nその結論に異議を唱えたと報じられている。"}, {"t": 1828.1333333333334, "x": "警察側は、他殺をうかがわせる証拠は\n現時点で無い、としたと報じられている。"}, {"t": 1832.9333333333334, "x": "私は、このどれか一つを選んで\n「こうだった」とは言わない。"}, {"t": 1836.4666666666667, "x": "確かめられていないからだ。"}, {"t": 1838.2666666666667, "x": "……これも、決まっていないのね。"}, {"t": 1840.1333333333334, "x": "決まっていない。そして、その数日後、共謀の訴因も\n正式に取り下げられたと報じられている。"}, {"t": 1845.9166666666667, "x": "裁判は、一度も開かれなかった。"}, {"t": 1848.2333333333333, "x": "証人も立たず、弁論も無く、判決も出ていない。"}, {"t": 1851.5, "x": "アメリカ側が「二十ぐらい並べた」という\n主張が正しいのかどうかも、"}, {"t": 1855.5, "x": "法廷で確かめられないまま終わった。"}, {"t": 1857.8166666666666, "x": "日本の側では、銃撃事件の無罪が\n確定している。それは今も変わっていない。"}, {"t": 1862.6333333333334, "x": "つまり、この銃撃について公の場で出ている\n結論は、日本の無罪判決ひとつだけになった。"}, {"t": 1869.0666666666666, "x": "死亡から一週間も経たないうちに、国会に\n二通の文書が出された。質問主意書だ。"}, {"t": 1874.3333333333333, "x": "一通目は2008年10月16日、\n衆議院に鈴木宗男議員が提出した。"}, {"t": 1879.3666666666666, "x": "題名は、我が国で無罪が確定した事案に"}, {"t": 1882.0166666666667, "x": "関し邦人が米国で逮捕された件に\n対する政府の対応に関する質問主意書。"}, {"t": 1887.0333333333333, "x": "二通目は翌17日、参議院に松野信夫議員が提出した。"}, {"t": 1891.15, "x": "題名は、いわゆる三浦事件における\n日本政府の対応に関する質問主意書。"}, {"t": 1895.9166666666667, "x": "……題名からして、無罪が確定した\n事案、って書いてあるのね。"}, {"t": 1899.6666666666667, "x": "そうだ。そして、政府の答えが返ってくる。"}, {"t": 1902.5166666666667, "x": "10月24日、内閣総理大臣臨時代理の名前で、\n衆議院に答弁書が出た。"}, {"t": 1907.8, "x": "10月28日、内閣総理大臣 麻生太郎の名前で、\n参議院に答弁書が出た。"}, {"t": 1913.3666666666666, "x": "中身は、ほぼ同じだ。二か所を読む。"}, {"t": 1915.7666666666667, "x": "一か所目。各国の裁判権は、"}, {"t": 1917.8666666666666, "x": "個別の国の判断に基づいて\n行使されるべきものであり、\n日本国憲法第三十九条の規定も、"}, {"t": 1923.7, "x": "外国の裁判権の行使について定めたものではない。"}, {"t": 1927.1, "x": "……憲法三十九条は、外国には向いていない。"}, {"t": 1930.0666666666666, "x": "そういう答えだ。続きがある。"}, {"t": 1931.95, "x": "したがって、外国が、その裁判権に基づき、"}, {"t": 1935.0166666666667, "x": "我が国において確定判決を受けた\n者の刑事責任を追及することについて、\n我が国は、当該外国政府に対し、"}, {"t": 1942.1333333333334, "x": "抗議等を行う立場にはないと考えている。"}, {"t": 1944.9166666666667, "x": "二か所目。主権侵害ではないか、と問われた部分だ。"}, {"t": 1948.2833333333333, "x": "米国が、我が国の確定判決のあった\n事件について、司法手続を進めることは、"}, {"t": 1953.5666666666666, "x": "我が国の主権を\n侵害することにはならないと考えている。"}, {"t": 1957.2, "x": "……抗議もできないし、主権の侵害でもない。"}, {"t": 1959.9333333333334, "x": "それが、日本政府の公式の答えだ。"}, {"t": 1962.3166666666666, "x": "2008年10月に、文書で残っている。"}, {"t": 1965.1333333333334, "x": "言い換えると、こうなる。"}, {"t": 1966.5333333333333, "x": "日本の最高裁が出した無罪の確定は、\n日本の中では完全に有効だ。"}, {"t": 1971.0, "x": "誰もこの人を、もう日本で起訴できない。"}, {"t": 1973.6666666666667, "x": "だが、それは日本の外まで持ち出せる盾ではなかった。"}, {"t": 1977.6666666666667, "x": "整理して終わる。"}, {"t": 1978.7, "x": "1981年11月、ロサンゼルスで日本人の夫婦が\n撃たれ、妻の一美さんが翌年の11月に亡くなった。"}, {"t": 1986.35, "x": "1984年、報道が先に走った。"}, {"t": 1989.25, "x": "国会では、その年のうちに\n「度が過ぎておる」という指摘が出ている。"}, {"t": 1993.5833333333333, "x": "1985年9月、逮捕。"}, {"t": 1995.95, "x": "同じ年の12月、参議院の法務委員会が\n「逮捕に際しての人権問題」を正式な議題にした。"}, {"t": 2002.5, "x": "1981年夏の殴打事件は有罪が\n確定し、1981年11月の銃撃事件は、"}, {"t": 2009.2, "x": "2003年3月5日に無罪が確定した。"}, {"t": 2012.2666666666667, "x": "2008年2月、サイパンで逮捕。"}, {"t": 2014.55, "x": "日本政府には、逮捕の連絡すら来ていなかった。"}, {"t": 2017.7, "x": "2008年10月10日、ロサンゼルスの留置施設で\n死亡が確認され、裁判は開かれないまま終わった。"}, {"t": 2024.3333333333333, "x": "……結局、撃った人間は。"}, {"t": 2026.2, "x": "分かっていない。日本の裁判でも、\nアメリカの手続でも、確定していない。"}, {"t": 2030.8333333333333, "x": "この回で私が言いたかったことは、二つある。"}, {"t": 2033.7, "x": "一つ目。無罪の確定は、国の中でしか通用しない。"}, {"t": 2037.3, "x": "逃亡犯罪人引渡法の第二条第七号は、\n日本で確定判決を経た事件では"}, {"t": 2042.6166666666666, "x": "引き渡してはならない、と書いている。"}, {"t": 2044.7666666666667, "x": "だが、その条文が働くのは、\nその人が日本にいるときだけだ。"}, {"t": 2048.866666666667, "x": "そして、国際捜査共助等に関する法律の第二条には、"}, {"t": 2052.5, "x": "日本で無罪が確定したことは、\nそもそも書かれていない。"}, {"t": 2056.1, "x": "二つ目。答えが出るより先に、\n名前のほうが決まってしまうことがある。"}, {"t": 2060.3333333333335, "x": "1984年2月、警察が国会で言えたのは\n「実態の把握に努めている」だけだった。"}, {"t": 2066.55, "x": "その同じ時期に、世間はもう\n答えを知った気になっていた。"}, {"t": 2070.0, "x": "そのあと十九年かけて出た答えが、無罪の確定だ。"}, {"t": 2073.55, "x": "……順番が、逆だったのね。"}, {"t": 2075.4666666666667, "x": "逆だった。そして、逆になったことを、\n当時の国会は記録に残していた。"}, {"t": 2080.25, "x": "出典を挙げておく。"}, {"t": 2081.516666666667, "x": "国会での発言は、国立国会図書館の\n国会会議録検索システムから取った。"}, {"t": 2086.7, "x": "1982年から2017年までの十二の会議録だ。"}, {"t": 2090.9666666666667, "x": "政府の見解は、第170回国会に出された\n二通の質問主意書と、それぞれの答弁書。"}, {"t": 2096.733333333333, "x": "衆議院の第一二七号と、参議院の第五七号だ。"}, {"t": 2100.6666666666665, "x": "条文は、憲法第三十九条、刑法第三条、\n国際捜査共助等に関する法律第二条、"}, {"t": 2106.5833333333335, "x": "逃亡犯罪人引渡法第二条を、法令の原文から引いた。"}, {"t": 2110.7166666666667, "x": "条約の署名と発効は、\n法務省の平成19年版 犯罪白書による。"}, {"t": 2115.516666666667, "x": "アメリカ側の経過は、原文に到達できていないので、\n報道による、とだけ言っておく。"}, {"t": 2120.65, "x": "確かめられていないものは、リサーチのファイルに\n「要確認」と書いて残してある。"}, {"t": 2125.366666666667, "x": "最後に一つだけ。"}, {"t": 2126.7, "x": "この人は、銃撃については無罪が確定している。"}, {"t": 2129.733333333333, "x": "私は最後まで、犯人とは呼ばなかった。"}, {"t": 2132.616666666667, "x": "それは、この人をかばうためではない。"}, {"t": 2134.6833333333334, "x": "判決が出る前に名前を決めてしまった\n四十二年間を、もう一度なぞらないためだ。"}, {"t": 2139.7833333333333, "x": "……呼び方が、いちばん先に決まってしまうものね。"}, {"t": 2142.8166666666666, "x": "そうだ。そして一美さんが"}, {"t": 2144.4666666666667, "x": "亡くなっていることは、この四十五年でいちばん\n動かない事実だ。そこは忘れないでおきたい。"}, {"t": 2149.733333333333, "x": "ここまで見て、あなたはどこで\n「答えが決まった」と感じただろうか。"}, {"t": 2153.85, "x": "報道か、逮捕か、一審か、二審か、\n最高裁か。よければ、その一点だけ\nコメントに書いていってほしい。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
